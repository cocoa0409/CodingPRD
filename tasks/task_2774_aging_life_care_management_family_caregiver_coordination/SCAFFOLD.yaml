# =============================================================================
# Aging Life Care Management & Family Caregiver Coordination — seed tables (v1)
# =============================================================================

scenario: |
  2774. Aging Life Care Management & Family Caregiver Coordination (Aging Life
  Care Association member practice): comprehensive geriatric assessment and care
  plan authoring, vendor coordination across home care, medical, legal and
  housing, family conference facilitation and decision documentation with
  capacity considerations, crisis response and hospital-to-home transition
  oversight, private-pay hourly billing with retainer and travel time,
  long-distance family reporting cadence, conflict-of-interest disclosure for
  referred providers, escalation to guardianship or protective services

domain_name: aging-life-care-coordination
api_prefix: /care

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys carried in request bodies. Only state
  # and action sub-paths (`/{id}/state`, `/{id}/payments`) appear under a
  # resource; no entity is addressed through another entity's collection path.

  state_machine_shape: branching
  # Branching fork-join dominates (assessment review forks ACCEPTED vs
  # REVISION_REQUESTED; care-plan family decision forks ACTIVE vs REJECTED),
  # layered with revision cycles (Assessment REVISION_REQUESTED -> DRAFT,
  # CarePlan REJECTED -> DRAFT, CrisisEpisode TRANSITION_OVERSIGHT -> OPEN,
  # Client SUSPENDED_NONPAYMENT -> ACTIVE_CARE) and one entity carrying two
  # independent state dimensions (ServiceAuthorization.auth_status x
  # ServiceAuthorization.coi_status).

  relationship_patterns:
    - one_to_many          # Client -> Assessment / CarePlan / TimeEntry / Invoice
    - self_referential     # CarePlan.supersedes_care_plan_id -> CarePlan.id
    - cross_aggregate      # ServiceAuthorization.authorizing_decision_id -> ConferenceDecision.id

  role_model: segregation_of_duties
  # The care manager who authored an assessment may not review it; the care
  # manager who logged a time entry may not approve it; the conflict-of-interest
  # disclosure on a referred vendor may only be acknowledged by a surrogate
  # family decision maker, never by practice staff.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Older adult's legal name", constraints: "1..120 chars" }
      - { name: residence_setting, type: enum, source: input, description: "PRIVATE_HOME | ASSISTED_LIVING | SKILLED_NURSING | HOSPITAL", constraints: "one of the four values" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ASSESSMENT_IN_PROGRESS | ACTIVE_CARE | SUSPENDED_NONPAYMENT | DISCHARGED — see 1.2 Client machine" }
      - { name: capacity_status, type: enum, source: system, description: "PRESUMED_CAPABLE | DIMINISHED_DOCUMENTED | ADJUDICATED_INCAPACITATED — written only by POST /care/clients/{clientId}/capacity-determination or by an accepted guardianship escalation", default: PRESUMED_CAPABLE }
      - { name: capacity_basis, type: string, source: system, description: "Free-text evidentiary basis recorded with the last capacity determination; null while capacity_status == PRESUMED_CAPABLE", default: null }
      - { name: risk_posture, type: enum, source: computed, description: "ROUTINE | ELEVATED | CRISIS — derived by calculations.client_risk_posture; gates care-plan activation and crisis-rate time entries" }
      - { name: acuity_score, type: integer, source: computed, description: "0..100 composite acuity copied from the client's most recently ACCEPTED Assessment (calculations.assessment_composite_acuity, COMPREHENSIVE variant); 0 when no accepted assessment exists", default: 0 }
      - { name: billing_increment_min, type: integer, source: input, description: "Minute increment every TimeEntry is rounded up to", default: 15, constraints: "one of {6, 15}" }
      - { name: travel_billing_pct, type: integer, source: input, description: "Percent of the care manager's hourly rate billed for TRAVEL service_type", default: 50, constraints: "0..100" }
      - { name: retainer_floor_cents, type: integer, source: input, description: "Retainer balance below which the client is auto-suspended for nonpayment", default: 50000, constraints: ">= 0" }
      - { name: authorized_concurrent_caregivers, type: integer, source: input, description: "Maximum caregivers that may be authorized across overlapping ServiceAuthorization coverage windows", default: 2, constraints: ">= 1" }
      - { name: retainer_deposits_total_cents, type: integer, source: computed, description: "Sum of amount_cents over every accepted POST /care/clients/{clientId}/retainer-deposits call, minus nothing (deposits are never deleted)", default: 0 }
      - { name: retainer_balance_cents, type: integer, source: computed, description: "= retainer_deposits_total_cents - SUM(Invoice.retainer_applied_cents WHERE Invoice.client_id == this.id AND Invoice.status IN {ISSUED, PAID}); see calculations.client_retainer_and_accrual_ledger", default: 0 }
      - { name: unbilled_accrual_cents, type: integer, source: computed, description: "= SUM(TimeEntry.billable_amount_cents WHERE TimeEntry.client_id == this.id AND TimeEntry.status IN {DRAFT, SUBMITTED, APPROVED})", default: 0 }
      - { name: authorized_coverage_hours, type: number, source: computed, description: "= SUM(ServiceAuthorization.coverage_hours WHERE ServiceAuthorization.client_id == this.id AND auth_status IN {AUTHORIZED, ACTIVE}); conserved quantity of compensating_invariant instance 2", default: 0 }
      - { name: protective_escalation_status, type: enum, source: computed, description: "NONE | PENDING | ACCEPTED | DECLINED — derived from the client's ConferenceDecision rows whose decision_type IN {ESCALATE_GUARDIANSHIP_PETITION, ESCALATE_APS_REPORT}; see calculations.client_protective_escalation_status", default: NONE }

  - name: CareManager
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Care manager's name", constraints: "1..120 chars" }
      - { name: credential, type: enum, source: input, description: "CMC | CCM | CMAC | C_ASWCM", constraints: "one of the four values" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Standard private-pay hourly rate in cents", constraints: "> 0" }
      - { name: is_supervisor, type: boolean, source: input, description: "True when this care manager may act with the PracticeSupervisor role", default: false }
      - { name: active, type: boolean, source: input, description: "False retires the care manager from new assignments", default: true }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Provider / firm name", constraints: "1..160 chars" }
      - { name: vendor_type, type: enum, source: input, description: "HOME_CARE | MEDICAL | LEGAL | HOUSING", constraints: "one of the four values" }
      - { name: has_referral_relationship, type: boolean, source: input, description: "True when the practice receives any consideration from, or shares ownership with, this vendor — forces conflict-of-interest disclosure on every ServiceAuthorization naming it" }
      - { name: referral_fee_pct, type: number, source: input, description: "Percent of vendor billings received by the practice; must be > 0 when has_referral_relationship is true", default: 0, constraints: "0..100" }
      - { name: standing, type: enum, source: input, description: "APPROVED | PROBATION | BARRED — BARRED vendors may not be named on a new ServiceAuthorization", default: APPROVED }

  - name: FamilyContact
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the older adult this contact is attached to" }
      - { name: full_name, type: string, source: input, description: "Family member / fiduciary name", constraints: "1..120 chars" }
      - { name: contact_role, type: enum, source: input, description: "POA_HEALTHCARE | POA_FINANCIAL | GUARDIAN | RESPONSIBLE_PARTY | INTERESTED_FAMILY", constraints: "one of the five values" }
      - { name: is_surrogate_decision_maker, type: boolean, source: input, description: "True when this contact may execute decisions on the client's behalf", default: false }
      - { name: is_long_distance, type: boolean, source: input, description: "True when the contact lives outside the client's metro area and receives the cadence report", default: false }
      - { name: reporting_cadence_days, type: integer, source: input, description: "Days between required long-distance family reports", default: 30, constraints: "1..180" }
      - { name: last_report_sent_at, type: datetime, source: system, description: "Logical-clock timestamp of the last accepted POST /care/family-contacts/{contactId}/reports; null until the first report", default: null }
      - { name: reports_sent_count, type: integer, source: system, description: "Number of accepted reports", default: 0 }
      - { name: report_status, type: enum, source: computed, description: "NOT_APPLICABLE | CURRENT | DUE | OVERDUE — see calculations.family_report_cadence_status", default: NOT_APPLICABLE }
      - { name: days_overdue, type: integer, source: computed, description: "Whole days past (last_report_sent_at + reporting_cadence_days + GRACE_DAYS); 0 unless report_status == OVERDUE", default: 0 }

  - name: Assessment
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; subject of the comprehensive geriatric assessment" }
      - { name: care_manager_id, type: string, source: input, description: "FK -> CareManager.id; the authoring care manager" }
      - { name: reviewed_by_care_manager_id, type: string, source: system, description: "FK -> CareManager.id; the X-User-ID that drove the SUBMITTED -> ACCEPTED or SUBMITTED -> REVISION_REQUESTED transition; null until reviewed", default: null }
      - { name: domain_scores, type: object, source: input, description: "Exactly six integer keys — adl, cognition, medical_complexity, social_support, safety, finances", constraints: "every key present, each value an integer 0..5" }
      - { name: narrative, type: string, source: input, description: "Assessment narrative", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REVISION_REQUESTED | ACCEPTED | WITHDRAWN — see 1.2 Assessment machine" }
      - { name: revision_round, type: integer, source: system, description: "Incremented on every REVISION_REQUESTED -> DRAFT transition; round 0 is the first draft", default: 0 }
      - { name: screening_acuity, type: integer, source: computed, description: "0..100, SCREENING variant of calculations.assessment_composite_acuity, stamped on DRAFT -> SUBMITTED", default: null }
      - { name: comprehensive_acuity, type: integer, source: computed, description: "0..100, COMPREHENSIVE variant of calculations.assessment_composite_acuity, stamped on SUBMITTED -> ACCEPTED", default: null }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock timestamp of the SUBMITTED -> ACCEPTED transition; null otherwise", default: null }

  - name: CarePlan
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: source_assessment_id, type: string, source: input, description: "FK -> Assessment.id; the accepted assessment this plan is authored from" }
      - { name: supersedes_care_plan_id, type: string, source: input, description: "FK -> CarePlan.id; the ACTIVE plan this plan replaces when it activates; null for a first plan", default: null }
      - { name: approved_by_contact_id, type: string, source: system, description: "FK -> FamilyContact.id; the surrogate who drove PENDING_FAMILY_APPROVAL -> ACTIVE", default: null }
      - { name: goals, type: array, source: input, description: "Ordered array of goal strings", constraints: "1..12 non-empty strings" }
      - { name: review_interval_days, type: integer, source: input, description: "Days between scheduled plan reviews", default: 90, constraints: "30..365" }
      - { name: pinned_assessment_version, type: integer, source: system, description: "Value of Assessment.version captured at plan creation; the plan may not be sent for family approval once the source assessment's version has moved past it" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_FAMILY_APPROVAL | ACTIVE | REJECTED | SUPERSEDED | WITHDRAWN — see 1.2 CarePlan machine" }
      - { name: rejection_rounds, type: integer, source: system, description: "Incremented on every PENDING_FAMILY_APPROVAL -> REJECTED transition", default: 0 }
      - { name: coverage_gap_flag, type: boolean, source: computed, description: "True when status == ACTIVE and the plan has zero ServiceAuthorization rows with auth_status IN {AUTHORIZED, ACTIVE}", default: true }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of the transition into ACTIVE", default: null }

  - name: ServiceAuthorization
    parent: CarePlan
    common_fields: true
    fields:
      - { name: care_plan_id, type: string, source: input, description: "FK -> CarePlan.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; the coordinated home care, medical, legal or housing provider" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from CarePlan.client_id at creation and never edited" }
      - { name: authorizing_decision_id, type: string, source: input, description: "FK -> ConferenceDecision.id; the ratified family decision that authorized this vendor, when one exists", default: null }
      - { name: coi_acknowledged_by_contact_id, type: string, source: system, description: "FK -> FamilyContact.id; surrogate who acknowledged the conflict-of-interest disclosure", default: null }
      - { name: coverage_start, type: datetime, source: input, description: "Inclusive start of the coverage window" }
      - { name: coverage_end, type: datetime, source: input, description: "Inclusive end of the coverage window; coverage windows are CLOSED intervals, so two windows that merely touch at an endpoint are treated as overlapping", constraints: "> coverage_start" }
      - { name: concurrent_caregivers, type: integer, source: input, description: "Caregivers the vendor staffs simultaneously across the window", constraints: "1..10" }
      - { name: hourly_cost_cents, type: integer, source: input, description: "Vendor's hourly cost per caregiver in cents", constraints: "> 0" }
      - { name: coverage_hours, type: number, source: computed, description: "= (coverage_end - coverage_start) in whole hours * concurrent_caregivers" }
      - { name: base_cost_cents, type: integer, source: computed, description: "= coverage_hours * hourly_cost_cents" }
      - { name: coordination_fee_cents, type: integer, source: computed, description: "Practice coordination fee, see calculations.service_authorization_coordination_fee" }
      - { name: total_projected_cost_cents, type: integer, source: computed, description: "= base_cost_cents + coordination_fee_cents" }
      - { name: auth_status, type: enum, source: system, description: "PROPOSED | AUTHORIZED | ACTIVE | SUSPENDED | TERMINATED — first of two independent state dimensions" }
      - { name: coi_status, type: enum, source: system, description: "NOT_REQUIRED | PENDING_DISCLOSURE | DISCLOSED | ACKNOWLEDGED — second, independent state dimension; set to NOT_REQUIRED at creation when Vendor.has_referral_relationship is false, otherwise PENDING_DISCLOSURE" }
      - { name: disclosure_text, type: string, source: system, description: "Disclosure statement minted at creation when the vendor carries a referral relationship; null when coi_status == NOT_REQUIRED", default: null }
      - { name: suspension_reason, type: enum, source: system, description: "NONE | NONPAYMENT | VENDOR_STANDING | FAMILY_REQUEST — set on the transition into SUSPENDED", default: NONE }
      - { name: termination_reason, type: enum, source: system, description: "NONE | CARE_MANAGER_REQUEST | DECISION_RESCINDED | PLAN_SUPERSEDED | VENDOR_STANDING | CLIENT_DISCHARGED", default: NONE }

  - name: FamilyConference
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned conference start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned conference end", constraints: "> scheduled_start" }
      - { name: invited_contact_ids, type: array, source: input, description: "Array of FamilyContact.id values invited to the conference; every element must be a FamilyContact of client_id", constraints: "1..12 unique ids" }
      - { name: attended_contact_ids, type: array, source: system, description: "Array of FamilyContact.id values recorded on the SCHEDULED -> CONVENED transition; must be a subset of invited_contact_ids", default: [] }
      - { name: agenda, type: string, source: input, description: "Agenda text", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONVENED | DOCUMENTED | RESCHEDULED | CANCELLED — see 1.2 FamilyConference machine" }
      - { name: reschedule_count, type: integer, source: system, description: "Incremented on every SCHEDULED -> RESCHEDULED transition", default: 0 }
      - { name: quorum_met, type: boolean, source: computed, description: "Evaluated on CONVENED by calculations.conference_quorum_evaluation", default: false }
      - { name: surrogate_present, type: boolean, source: computed, description: "True when attended_contact_ids contains at least one FamilyContact with is_surrogate_decision_maker == true", default: false }
      - { name: convened_at, type: datetime, source: system, description: "Logical-clock timestamp of the SCHEDULED -> CONVENED transition", default: null }

  - name: ConferenceDecision
    parent: FamilyConference
    common_fields: true
    fields:
      - { name: family_conference_id, type: string, source: input, description: "FK -> FamilyConference.id; the conference at which the decision was reached" }
      - { name: decided_by_contact_id, type: string, source: input, description: "FK -> FamilyContact.id; the family member who made the decision" }
      - { name: decision_type, type: enum, source: input, description: "VENDOR_ENGAGEMENT | PLACEMENT_CHANGE | CARE_LEVEL_CHANGE | ESCALATE_GUARDIANSHIP_PETITION | ESCALATE_APS_REPORT", constraints: "one of the five values" }
      - { name: decision_text, type: string, source: input, description: "Verbatim documented decision", constraints: "1..2000 chars" }
      - { name: capacity_basis, type: string, source: input, description: "Evidentiary basis for relying on a surrogate; required when the client's capacity_status != PRESUMED_CAPABLE", default: null }
      - { name: status, type: enum, source: system, description: "RECORDED | RATIFIED | ESCALATED | ESCALATION_ACCEPTED | ESCALATION_DECLINED | RESCINDED — see 1.2 ConferenceDecision machine" }
      - { name: ratified_at, type: datetime, source: system, description: "Logical-clock timestamp of RECORDED -> RATIFIED", default: null }
      - { name: escalated_at, type: datetime, source: system, description: "Logical-clock timestamp of RATIFIED -> ESCALATED", default: null }
      - { name: rescinded_reason, type: string, source: system, description: "Note captured on the transition into RESCINDED", default: null }

  - name: CrisisEpisode
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: assigned_care_manager_id, type: string, source: system, description: "FK -> CareManager.id; the X-User-ID that opened the episode", default: null }
      - { name: trigger_type, type: enum, source: input, description: "HOSPITAL_ADMISSION | FALL | CAREGIVER_NO_SHOW | ACUTE_BEHAVIORAL | ELDER_ABUSE_SUSPICION", constraints: "one of the five values" }
      - { name: hospital_name, type: string, source: input, description: "Facility name when trigger_type == HOSPITAL_ADMISSION", default: null }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: stabilized_at, type: datetime, source: system, description: "Logical-clock timestamp of OPEN -> STABILIZED", default: null }
      - { name: discharge_at, type: datetime, source: input, description: "Hospital discharge timestamp recorded on STABILIZED -> TRANSITION_OVERSIGHT", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of TRANSITION_OVERSIGHT -> CLOSED", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | STABILIZED | TRANSITION_OVERSIGHT | CLOSED — see 1.2 CrisisEpisode machine" }
      - { name: readmission_count, type: integer, source: system, description: "Incremented on every TRANSITION_OVERSIGHT -> OPEN transition", default: 0 }

  - name: TimeEntry
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client billed for this time" }
      - { name: care_manager_id, type: string, source: input, description: "FK -> CareManager.id; whose time this is" }
      - { name: approved_by_care_manager_id, type: string, source: system, description: "FK -> CareManager.id; the X-User-ID that drove SUBMITTED -> APPROVED", default: null }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; set when the entry is pulled onto an issued invoice, cleared when that invoice is voided", default: null }
      - { name: crisis_episode_id, type: string, source: input, description: "FK -> CrisisEpisode.id; required when service_type == CRISIS_RESPONSE", default: null }
      - { name: service_type, type: enum, source: input, description: "ASSESSMENT | CARE_COORDINATION | CRISIS_RESPONSE | TRAVEL | CONFERENCE", constraints: "one of the five values" }
      - { name: start_at, type: datetime, source: input, description: "Interval start; TimeEntry intervals on one care manager are HALF-OPEN [start_at, end_at), so an entry starting exactly when another ends does not overlap" }
      - { name: end_at, type: datetime, source: input, description: "Interval end (exclusive)", constraints: "> start_at" }
      - { name: service_location_id, type: string, source: input, description: "Opaque location key (e.g. 'HOSPITAL_A', 'CLIENT_HOME'); a location change between back-to-back entries forces the travel buffer", constraints: "1..40 chars" }
      - { name: service_date, type: string, source: computed, description: "UTC calendar date (YYYY-MM-DD) of start_at; daily-cap aggregation key" }
      - { name: raw_minutes, type: integer, source: computed, description: "= whole minutes between start_at and end_at" }
      - { name: rounded_minutes, type: integer, source: computed, description: "raw_minutes rounded UP to the client's billing_increment_min" }
      - { name: rate_multiplier, type: number, source: computed, description: "Service-type and crisis-state multiplier, see calculations.time_entry_billable_amount" }
      - { name: after_hours_factor, type: number, source: computed, description: "1.20 when the UTC hour of start_at is < 8 or >= 18, else 1.00" }
      - { name: billable_amount_cents, type: integer, source: computed, description: "Final per-entry amount, see calculations.time_entry_billable_amount" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | INVOICED | VOIDED — see 1.2 TimeEntry machine" }
      - { name: note, type: string, source: input, description: "Activity note", default: null }

  - name: Invoice
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: period_start, type: string, source: input, description: "Inclusive first service_date of the billing period (YYYY-MM-DD)" }
      - { name: period_end, type: string, source: input, description: "Inclusive last service_date of the billing period (YYYY-MM-DD)", constraints: ">= period_start" }
      - { name: variant, type: enum, source: computed, description: "PROVISIONAL while status == DRAFT, FINAL once ISSUED — selects which branch of calculations.invoice_totals is authoritative" }
      - { name: line_entry_ids, type: array, source: computed, description: "Ordered array of TimeEntry.id values included by the active variant, sorted by TimeEntry.start_at ASC then TimeEntry.created_at ASC" }
      - { name: line_subtotal_cents, type: integer, source: computed, description: "Sum of billable_amount_cents over line_entry_ids (each already rounded per entry)" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "= round_half_up(line_subtotal_cents * ADMIN_FEE_PCT / 100) — computed once on the SUMMED subtotal, never per line" }
      - { name: total_due_cents, type: integer, source: computed, description: "= line_subtotal_cents + admin_fee_cents" }
      - { name: retainer_applied_cents, type: integer, source: computed, description: "Retainer draw; projected while DRAFT, actually debited on ISSUED, released on VOIDED" }
      - { name: balance_due_cents, type: integer, source: computed, description: "= total_due_cents - retainer_applied_cents" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of accepted payments against this invoice", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOIDED — see 1.2 Invoice machine" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of DRAFT -> ISSUED", default: null }
      - { name: voided_reason, type: string, source: system, description: "Reason captured on the transition into VOIDED", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Client
    initial_state: PROSPECT
    terminal_states: [DISCHARGED]
    transitions:
      - from: PROSPECT
        to: ASSESSMENT_IN_PROGRESS
        trigger: "POST /care/assessments (system auto-transition on the client's first Assessment)"
        actor: system
        preconditions: ["Client.status == PROSPECT"]
        side_effects: ["Client.version += 1", "Client.updated_at refreshed"]
      - from: ASSESSMENT_IN_PROGRESS
        to: ACTIVE_CARE
        trigger: "PATCH /care/care-plans/{carePlanId}/state with to_state=ACTIVE (system auto-transition)"
        actor: system
        preconditions: ["Client.status == ASSESSMENT_IN_PROGRESS", "the activating CarePlan.client_id == Client.id"]
        side_effects: ["Client.version += 1", "Client.risk_posture recomputed by calculations.client_risk_posture"]
      - from: ACTIVE_CARE
        to: SUSPENDED_NONPAYMENT
        trigger: "PATCH /care/invoices/{invoiceId}/state with to_state=ISSUED (system auto-transition)"
        actor: system
        preconditions: ["Client.status == ACTIVE_CARE", "after the FINAL retainer draw Client.retainer_balance_cents < Client.retainer_floor_cents", "Invoice.balance_due_cents > 0"]
        side_effects:
          - "Every ServiceAuthorization of this client with auth_status == ACTIVE moves to SUSPENDED with suspension_reason=NONPAYMENT"
          - "Client.authorized_coverage_hours recomputed (suspended authorizations leave the {AUTHORIZED, ACTIVE} input set)"
          - "Client.version += 1"
      - from: SUSPENDED_NONPAYMENT
        to: ACTIVE_CARE
        trigger: "POST /care/clients/{clientId}/retainer-deposits, or PATCH /care/invoices/{invoiceId}/state with to_state=VOIDED (system auto-transition)"
        actor: system
        preconditions: ["Client.status == SUSPENDED_NONPAYMENT", "recomputed Client.retainer_balance_cents >= Client.retainer_floor_cents"]
        side_effects:
          - "Every ServiceAuthorization of this client with auth_status == SUSPENDED AND suspension_reason == NONPAYMENT moves to ACTIVE with suspension_reason=NONE"
          - "Client.authorized_coverage_hours recomputed (reactivated authorizations re-enter the input set)"
          - "Client.version += 1"
        note: "Cycle: ACTIVE_CARE -> SUSPENDED_NONPAYMENT -> ACTIVE_CARE may repeat any number of times."
      - from: PROSPECT
        to: DISCHARGED
        trigger: "PATCH /care/clients/{clientId}/state with to_state=DISCHARGED"
        actor: PracticeAdmin
        preconditions: ["Client.status != DISCHARGED"]
        side_effects: ["Client.version += 1"]
      - from: ACTIVE_CARE
        to: DISCHARGED
        trigger: "PATCH /care/clients/{clientId}/state with to_state=DISCHARGED"
        actor: PracticeAdmin
        preconditions: ["Client.status != DISCHARGED", "no CrisisEpisode of this client has status IN {OPEN, TRANSITION_OVERSIGHT}"]
        side_effects:
          - "Every ServiceAuthorization of this client with auth_status IN {PROPOSED, AUTHORIZED, ACTIVE, SUSPENDED} moves to TERMINATED with termination_reason=CLIENT_DISCHARGED"
          - "Every CarePlan of this client with status IN {DRAFT, PENDING_FAMILY_APPROVAL, ACTIVE} moves to WITHDRAWN"
          - "Client.authorized_coverage_hours recomputed to 0"
          - "Client.version += 1"
        note: "Same DISCHARGED transition is available from ASSESSMENT_IN_PROGRESS and SUSPENDED_NONPAYMENT with identical preconditions and side effects."

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [ACCEPTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "PATCH /care/assessments/{assessmentId}/state with to_state=SUBMITTED"
        actor: CareManager
        preconditions: ["Assessment.status == DRAFT", "X-User-ID == Assessment.care_manager_id", "Client.status != DISCHARGED"]
        side_effects:
          - "Assessment.screening_acuity stamped by calculations.assessment_composite_acuity (SCREENING variant)"
          - "Assessment.version += 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "PATCH /care/assessments/{assessmentId}/state with to_state=ACCEPTED"
        actor: PracticeSupervisor
        preconditions: ["Assessment.status == SUBMITTED", "X-User-ID != Assessment.care_manager_id (segregation of duties)", "the acting CareManager.is_supervisor == true"]
        side_effects:
          - "Assessment.comprehensive_acuity stamped by calculations.assessment_composite_acuity (COMPREHENSIVE variant)"
          - "Assessment.accepted_at = logical clock now"
          - "Assessment.reviewed_by_care_manager_id = X-User-ID"
          - "Client.acuity_score recomputed from the client's most recently ACCEPTED assessment"
          - "Client.risk_posture recomputed by calculations.client_risk_posture (crosses to ELEVATED at acuity_score >= 70)"
          - "Assessment.version += 1"
          - "Client.version += 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "PATCH /care/assessments/{assessmentId}/state with to_state=REVISION_REQUESTED"
        actor: PracticeSupervisor
        preconditions: ["Assessment.status == SUBMITTED", "X-User-ID != Assessment.care_manager_id (segregation of duties)", "the acting CareManager.is_supervisor == true"]
        side_effects: ["Assessment.reviewed_by_care_manager_id = X-User-ID", "Assessment.version += 1"]
        note: "Branch point: the same SUBMITTED state forks to ACCEPTED (acuity stamped, client acuity/posture recomputed) or REVISION_REQUESTED (no acuity written) with disjoint side-effect sets."
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "PATCH /care/assessments/{assessmentId}/state with to_state=DRAFT"
        actor: CareManager
        preconditions: ["Assessment.status == REVISION_REQUESTED", "X-User-ID == Assessment.care_manager_id"]
        side_effects: ["Assessment.revision_round += 1", "Assessment.screening_acuity reset to null", "Assessment.version += 1"]
        note: "Revision cycle: DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT is unbounded; every lap bumps Assessment.version, which is what stales a CarePlan's pinned_assessment_version."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "PATCH /care/assessments/{assessmentId}/state with to_state=WITHDRAWN"
        actor: PracticeSupervisor
        preconditions: ["Assessment.status IN {DRAFT, SUBMITTED, REVISION_REQUESTED}", "no CarePlan with source_assessment_id == this assessment has status IN {PENDING_FAMILY_APPROVAL, ACTIVE}"]
        side_effects: ["Assessment.version += 1"]
        note: "Also permitted from SUBMITTED and REVISION_REQUESTED with identical preconditions."

  - entity: CarePlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_FAMILY_APPROVAL
        trigger: "PATCH /care/care-plans/{carePlanId}/state with to_state=PENDING_FAMILY_APPROVAL"
        actor: CareManager
        preconditions:
          - "CarePlan.status IN {DRAFT, REJECTED}"
          - "the source Assessment.status == ACCEPTED"
          - "CarePlan.pinned_assessment_version == the source Assessment.version (else ERR_PINNED_ASSESSMENT_STALE)"
          - "Client.status != DISCHARGED"
          - "the client has at least one FamilyContact with is_surrogate_decision_maker == true"
        side_effects: ["CarePlan.version += 1"]
      - from: PENDING_FAMILY_APPROVAL
        to: ACTIVE
        trigger: "PATCH /care/care-plans/{carePlanId}/state with to_state=ACTIVE"
        actor: FamilyDecisionMaker
        preconditions:
          - "CarePlan.status == PENDING_FAMILY_APPROVAL"
          - "X-User-ID is a FamilyContact of CarePlan.client_id with is_surrogate_decision_maker == true"
          - "Client.risk_posture != CRISIS (a plan may not be activated while an episode is OPEN or under TRANSITION_OVERSIGHT)"
          - "when Client.capacity_status != PRESUMED_CAPABLE, Client.capacity_basis is non-null"
        side_effects:
          - "CarePlan.approved_by_contact_id = X-User-ID"
          - "CarePlan.activated_at = logical clock now"
          - "CarePlan.coverage_gap_flag recomputed (true — a freshly activated plan has no authorizations yet)"
          - "When CarePlan.supersedes_care_plan_id is non-null, that plan moves ACTIVE -> SUPERSEDED and each of its ServiceAuthorization rows with auth_status IN {PROPOSED, AUTHORIZED, ACTIVE, SUSPENDED} moves to TERMINATED with termination_reason=PLAN_SUPERSEDED"
          - "Client.status ASSESSMENT_IN_PROGRESS -> ACTIVE_CARE when applicable"
          - "Client.risk_posture recomputed"
          - "Client.authorized_coverage_hours recomputed"
          - "CarePlan.version += 1"
          - "Client.version += 1"
      - from: PENDING_FAMILY_APPROVAL
        to: REJECTED
        trigger: "PATCH /care/care-plans/{carePlanId}/state with to_state=REJECTED"
        actor: FamilyDecisionMaker
        preconditions: ["CarePlan.status == PENDING_FAMILY_APPROVAL", "X-User-ID is a FamilyContact of CarePlan.client_id with is_surrogate_decision_maker == true"]
        side_effects: ["CarePlan.rejection_rounds += 1", "CarePlan.version += 1"]
        note: "Fork-join: PENDING_FAMILY_APPROVAL forks to ACTIVE (supersede cascade, client status/posture recomputation) or REJECTED (counter only); REJECTED rejoins the DRAFT -> PENDING_FAMILY_APPROVAL edge."
      - from: REJECTED
        to: DRAFT
        trigger: "PATCH /care/care-plans/{carePlanId}/state with to_state=DRAFT"
        actor: CareManager
        preconditions: ["CarePlan.status == REJECTED"]
        side_effects: ["CarePlan.version += 1"]
      - from: PENDING_FAMILY_APPROVAL
        to: DRAFT
        trigger: "PATCH /care/conference-decisions/{decisionId}/state with to_state=ESCALATION_ACCEPTED on an ESCALATE_GUARDIANSHIP_PETITION decision of this client (system cascade only; no actor may request this edge directly)"
        actor: system
        preconditions: ["CarePlan.status == PENDING_FAMILY_APPROVAL", "the cascading ConferenceDecision.decision_type == ESCALATE_GUARDIANSHIP_PETITION", "the resulting Client.capacity_status == ADJUDICATED_INCAPACITATED"]
        side_effects: ["CarePlan.approved_by_contact_id stays null", "CarePlan.rejection_rounds unchanged (adjudication is not a family rejection)", "CarePlan.version += 1"]
        note: "Guardianship adjudication invalidates the surrogate's pending approval authority, so the plan falls back to DRAFT for re-authoring rather than to REJECTED."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "PATCH /care/care-plans/{carePlanId}/state with to_state=ACTIVE on a newer plan whose supersedes_care_plan_id names this plan (system auto-transition)"
        actor: system
        preconditions: ["CarePlan.status == ACTIVE"]
        side_effects: ["Every ServiceAuthorization of this plan with auth_status IN {PROPOSED, AUTHORIZED, ACTIVE, SUSPENDED} -> TERMINATED with termination_reason=PLAN_SUPERSEDED", "Client.authorized_coverage_hours recomputed", "CarePlan.version += 1"]
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "PATCH /care/clients/{clientId}/state with to_state=DISCHARGED (system cascade)"
        actor: system
        preconditions: ["CarePlan.status IN {DRAFT, PENDING_FAMILY_APPROVAL, ACTIVE}"]
        side_effects: ["CarePlan.version += 1"]

  - entity: ServiceAuthorization
    dimension: auth_status
    initial_state: PROPOSED
    terminal_states: [TERMINATED]
    transitions:
      - from: PROPOSED
        to: AUTHORIZED
        trigger: "PATCH /care/service-authorizations/{authorizationId}/state with to_state=AUTHORIZED"
        actor: PracticeSupervisor
        preconditions:
          - "ServiceAuthorization.auth_status == PROPOSED"
          - "the parent CarePlan.status == ACTIVE (else ERR_CARE_PLAN_NOT_ACTIVE)"
          - "Client.status NOT IN {SUSPENDED_NONPAYMENT, DISCHARGED} (else ERR_CLIENT_NOT_IN_SERVICE)"
          - "ServiceAuthorization.coi_status IN {NOT_REQUIRED, ACKNOWLEDGED} (else ERR_COI_NOT_ACKNOWLEDGED)"
          - "Vendor.standing != BARRED"
          - "aggregate coverage capacity holds — see validations priority 64"
        side_effects:
          - "Client.authorized_coverage_hours += ServiceAuthorization.coverage_hours"
          - "the parent CarePlan.coverage_gap_flag recomputed (becomes false)"
          - "Client.risk_posture recomputed"
          - "ServiceAuthorization.version += 1"
          - "CarePlan.version += 1"
          - "Client.version += 1"
      - from: AUTHORIZED
        to: ACTIVE
        trigger: "PATCH /care/service-authorizations/{authorizationId}/state with to_state=ACTIVE"
        actor: CareManager
        preconditions: ["ServiceAuthorization.auth_status == AUTHORIZED", "Client.status == ACTIVE_CARE"]
        side_effects: ["ServiceAuthorization.version += 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /care/service-authorizations/{authorizationId}/state with to_state=SUSPENDED (actor-driven), or the Client ACTIVE_CARE -> SUSPENDED_NONPAYMENT cascade, or PATCH /care/vendors/{vendorId} setting standing=BARRED"
        actor: CareManager
        preconditions: ["ServiceAuthorization.auth_status == ACTIVE"]
        side_effects:
          - "ServiceAuthorization.suspension_reason = FAMILY_REQUEST (actor-driven), NONPAYMENT (client cascade) or VENDOR_STANDING (vendor barred cascade)"
          - "Client.authorized_coverage_hours -= ServiceAuthorization.coverage_hours"
          - "the parent CarePlan.coverage_gap_flag recomputed"
          - "Client.risk_posture recomputed"
          - "ServiceAuthorization.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /care/service-authorizations/{authorizationId}/state with to_state=ACTIVE, or the Client SUSPENDED_NONPAYMENT -> ACTIVE_CARE cascade"
        actor: CareManager
        preconditions: ["ServiceAuthorization.auth_status == SUSPENDED", "Vendor.standing != BARRED", "Client.status == ACTIVE_CARE", "aggregate coverage capacity holds"]
        side_effects:
          - "ServiceAuthorization.suspension_reason = NONE"
          - "Client.authorized_coverage_hours += ServiceAuthorization.coverage_hours"
          - "the parent CarePlan.coverage_gap_flag recomputed"
          - "Client.risk_posture recomputed"
          - "ServiceAuthorization.version += 1"
        note: "Cycle ACTIVE <-> SUSPENDED is unbounded and each lap must leave Client.authorized_coverage_hours exactly where it started."
      - from: ACTIVE
        to: TERMINATED
        trigger: "PATCH /care/service-authorizations/{authorizationId}/state with to_state=TERMINATED, or a ConferenceDecision RESCINDED cascade, or a CarePlan SUPERSEDED cascade, or a Client DISCHARGED cascade"
        actor: CareManager
        preconditions: ["ServiceAuthorization.auth_status IN {PROPOSED, AUTHORIZED, ACTIVE, SUSPENDED}"]
        side_effects:
          - "ServiceAuthorization.termination_reason = CARE_MANAGER_REQUEST | DECISION_RESCINDED | PLAN_SUPERSEDED | VENDOR_STANDING | CLIENT_DISCHARGED per trigger"
          - "Client.authorized_coverage_hours recomputed (this row leaves the {AUTHORIZED, ACTIVE} input set)"
          - "the parent CarePlan.coverage_gap_flag recomputed"
          - "Client.risk_posture recomputed"
          - "ServiceAuthorization.version += 1"

  - entity: ServiceAuthorization
    dimension: coi_status
    initial_state: PENDING_DISCLOSURE
    terminal_states: [NOT_REQUIRED, ACKNOWLEDGED]
    transitions:
      - from: PENDING_DISCLOSURE
        to: DISCLOSED
        trigger: "POST /care/service-authorizations/{authorizationId}/coi-events with action=DISCLOSE"
        actor: CareManager
        preconditions: ["ServiceAuthorization.coi_status == PENDING_DISCLOSURE", "ServiceAuthorization.auth_status != TERMINATED"]
        side_effects: ["ServiceAuthorization.version += 1"]
        note: "coi_status advances independently of auth_status: a PROPOSED row can reach ACKNOWLEDGED and an AUTHORIZED row can still be at NOT_REQUIRED. Only the PROPOSED -> AUTHORIZED edge reads the coi dimension."
      - from: DISCLOSED
        to: ACKNOWLEDGED
        trigger: "POST /care/service-authorizations/{authorizationId}/coi-events with action=ACKNOWLEDGE"
        actor: FamilyDecisionMaker
        preconditions:
          - "ServiceAuthorization.coi_status == DISCLOSED"
          - "acknowledged_by_contact_id is a FamilyContact of ServiceAuthorization.client_id with is_surrogate_decision_maker == true and contact_role IN {POA_HEALTHCARE, POA_FINANCIAL, GUARDIAN, RESPONSIBLE_PARTY} (else ERR_COI_ACK_BY_INELIGIBLE_PARTY)"
          - "X-User-ID == acknowledged_by_contact_id"
        side_effects: ["ServiceAuthorization.coi_acknowledged_by_contact_id = acknowledged_by_contact_id", "Client.risk_posture recomputed (a pending disclosure is an ELEVATED trigger)", "ServiceAuthorization.version += 1", "Client.version += 1"]
      - from: NOT_REQUIRED
        to: NOT_REQUIRED
        trigger: "POST /care/service-authorizations (creation with a vendor whose has_referral_relationship == false)"
        actor: system
        preconditions: ["Vendor.has_referral_relationship == false"]
        side_effects: ["ServiceAuthorization.disclosure_text stays null"]
        note: "Self-edge documents the initialization branch; NOT_REQUIRED is terminal and no coi-events call is accepted on such a row (ERR_INVALID_STATE_TRANSITION)."

  - entity: FamilyConference
    initial_state: SCHEDULED
    terminal_states: [DOCUMENTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONVENED
        trigger: "PATCH /care/family-conferences/{conferenceId}/state with to_state=CONVENED"
        actor: CareManager
        preconditions:
          - "FamilyConference.status == SCHEDULED"
          - "attended_contact_ids is a non-empty subset of invited_contact_ids"
          - "quorum holds per calculations.conference_quorum_evaluation (else ERR_QUORUM_NOT_MET)"
        side_effects: ["FamilyConference.attended_contact_ids stored", "FamilyConference.quorum_met = true", "FamilyConference.surrogate_present recomputed", "FamilyConference.convened_at = logical clock now", "FamilyConference.version += 1"]
      - from: CONVENED
        to: DOCUMENTED
        trigger: "PATCH /care/family-conferences/{conferenceId}/state with to_state=DOCUMENTED"
        actor: CareManager
        preconditions: ["FamilyConference.status == CONVENED", "at least one ConferenceDecision with family_conference_id == this conference and status != RESCINDED exists"]
        side_effects: ["FamilyConference.version += 1"]
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "PATCH /care/family-conferences/{conferenceId}/state with to_state=RESCHEDULED"
        actor: CareManager
        preconditions: ["FamilyConference.status == SCHEDULED", "rescheduled_start and rescheduled_end are supplied with rescheduled_end > rescheduled_start"]
        side_effects: ["FamilyConference.scheduled_start = rescheduled_start", "FamilyConference.scheduled_end = rescheduled_end", "FamilyConference.reschedule_count += 1", "FamilyConference.version += 1"]
      - from: RESCHEDULED
        to: SCHEDULED
        trigger: "PATCH /care/family-conferences/{conferenceId}/state with to_state=SCHEDULED"
        actor: CareManager
        preconditions: ["FamilyConference.status == RESCHEDULED"]
        side_effects: ["FamilyConference.version += 1"]
        note: "Cycle SCHEDULED -> RESCHEDULED -> SCHEDULED is unbounded; reschedule_count records the laps."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "PATCH /care/family-conferences/{conferenceId}/state with to_state=CANCELLED"
        actor: CareManager
        preconditions: ["FamilyConference.status IN {SCHEDULED, RESCHEDULED}"]
        side_effects: ["FamilyConference.version += 1"]

  - entity: ConferenceDecision
    initial_state: RECORDED
    terminal_states: [ESCALATION_ACCEPTED, ESCALATION_DECLINED, RESCINDED]
    transitions:
      - from: RECORDED
        to: RATIFIED
        trigger: "PATCH /care/conference-decisions/{decisionId}/state with to_state=RATIFIED"
        actor: PracticeSupervisor
        preconditions: ["ConferenceDecision.status == RECORDED", "the parent FamilyConference.status IN {CONVENED, DOCUMENTED}", "the parent FamilyConference.quorum_met == true"]
        side_effects: ["ConferenceDecision.ratified_at = logical clock now", "ConferenceDecision.version += 1"]
      - from: RATIFIED
        to: ESCALATED
        trigger: "PATCH /care/conference-decisions/{decisionId}/state with to_state=ESCALATED"
        actor: PracticeSupervisor
        preconditions:
          - "ConferenceDecision.status == RATIFIED"
          - "ConferenceDecision.decision_type IN {ESCALATE_GUARDIANSHIP_PETITION, ESCALATE_APS_REPORT}"
          - "the client's capacity_status IN {DIMINISHED_DOCUMENTED, ADJUDICATED_INCAPACITATED}"
          - "the parent FamilyConference.status == DOCUMENTED"
        side_effects: ["ConferenceDecision.escalated_at = logical clock now", "Client.protective_escalation_status recomputed to PENDING", "Client.risk_posture recomputed", "ConferenceDecision.version += 1", "Client.version += 1"]
      - from: ESCALATED
        to: ESCALATION_ACCEPTED
        trigger: "PATCH /care/conference-decisions/{decisionId}/state with to_state=ESCALATION_ACCEPTED"
        actor: PracticeSupervisor
        preconditions: ["ConferenceDecision.status == ESCALATED"]
        side_effects:
          - "Client.protective_escalation_status recomputed to ACCEPTED"
          - "Hop 2 — when decision_type == ESCALATE_GUARDIANSHIP_PETITION, Client.capacity_status -> ADJUDICATED_INCAPACITATED and Client.capacity_basis = 'Guardianship petition granted; decision ' + ConferenceDecision.id"
          - "Hop 3 — caused by hop 2, every CarePlan of the client with status == PENDING_FAMILY_APPROVAL moves back to DRAFT (the surrogate's approval authority is invalidated by adjudication)"
          - "Hop 4 — caused by hop 3, Client.risk_posture recomputed to ELEVATED"
          - "ConferenceDecision.version += 1"
          - "Client.version += 1"
      - from: ESCALATED
        to: ESCALATION_DECLINED
        trigger: "PATCH /care/conference-decisions/{decisionId}/state with to_state=ESCALATION_DECLINED"
        actor: PracticeSupervisor
        preconditions: ["ConferenceDecision.status == ESCALATED"]
        side_effects: ["Client.protective_escalation_status recomputed to DECLINED", "Client.version += 1", "ConferenceDecision.version += 1"]
        note: "Fork: ESCALATED forks to ESCALATION_ACCEPTED (capacity adjudication cascade) or ESCALATION_DECLINED (status only)."
      - from: RATIFIED
        to: RESCINDED
        trigger: "PATCH /care/conference-decisions/{decisionId}/state with to_state=RESCINDED"
        actor: PracticeSupervisor
        preconditions: ["ConferenceDecision.status IN {RECORDED, RATIFIED}"]
        side_effects:
          - "ConferenceDecision.rescinded_reason = note"
          - "Hop 2 — caused by hop 1, every ServiceAuthorization with authorizing_decision_id == this decision and auth_status IN {PROPOSED, AUTHORIZED, ACTIVE, SUSPENDED} moves to TERMINATED with termination_reason=DECISION_RESCINDED"
          - "Hop 3 — caused by hop 2, Client.authorized_coverage_hours is recomputed downward and each affected CarePlan.coverage_gap_flag is recomputed"
          - "Hop 4 — caused by hop 3, when an ACTIVE CarePlan's coverage_gap_flag flips false -> true, Client.risk_posture is recomputed to ELEVATED"
          - "ConferenceDecision.version += 1"
          - "Client.version += 1"

  - entity: CrisisEpisode
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: STABILIZED
        trigger: "PATCH /care/crisis-episodes/{episodeId}/state with to_state=STABILIZED"
        actor: CareManager
        preconditions: ["CrisisEpisode.status == OPEN"]
        side_effects: ["CrisisEpisode.stabilized_at = logical clock now", "Client.risk_posture recomputed (STABILIZED leaves the CRISIS input set)", "CrisisEpisode.version += 1", "Client.version += 1"]
      - from: STABILIZED
        to: TRANSITION_OVERSIGHT
        trigger: "PATCH /care/crisis-episodes/{episodeId}/state with to_state=TRANSITION_OVERSIGHT"
        actor: CareManager
        preconditions: ["CrisisEpisode.status == STABILIZED", "discharge_at is supplied", "the client has at least one ServiceAuthorization with auth_status IN {AUTHORIZED, ACTIVE} (hospital-to-home oversight requires standing coverage)"]
        side_effects: ["CrisisEpisode.discharge_at stored", "Client.risk_posture recomputed to CRISIS (TRANSITION_OVERSIGHT re-enters the CRISIS input set)", "CrisisEpisode.version += 1", "Client.version += 1"]
      - from: TRANSITION_OVERSIGHT
        to: OPEN
        trigger: "PATCH /care/crisis-episodes/{episodeId}/state with to_state=OPEN"
        actor: CareManager
        preconditions: ["CrisisEpisode.status == TRANSITION_OVERSIGHT"]
        side_effects: ["CrisisEpisode.readmission_count += 1", "CrisisEpisode.stabilized_at reset to null", "Client.risk_posture recomputed", "CrisisEpisode.version += 1"]
        note: "Readmission cycle OPEN -> STABILIZED -> TRANSITION_OVERSIGHT -> OPEN is unbounded."
      - from: TRANSITION_OVERSIGHT
        to: CLOSED
        trigger: "PATCH /care/crisis-episodes/{episodeId}/state with to_state=CLOSED"
        actor: CareManager
        preconditions: ["CrisisEpisode.status == TRANSITION_OVERSIGHT", "every TimeEntry with crisis_episode_id == this episode has status IN {APPROVED, INVOICED, REJECTED, VOIDED} (no DRAFT or SUBMITTED crisis time may remain)"]
        side_effects: ["CrisisEpisode.closed_at = logical clock now", "Client.risk_posture recomputed", "CrisisEpisode.version += 1", "Client.version += 1"]

  - entity: TimeEntry
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "PATCH /care/time-entries/{timeEntryId}/state with to_state=SUBMITTED"
        actor: CareManager
        preconditions: ["TimeEntry.status == DRAFT", "X-User-ID == TimeEntry.care_manager_id"]
        side_effects: ["TimeEntry.version += 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "PATCH /care/time-entries/{timeEntryId}/state with to_state=APPROVED"
        actor: PracticeSupervisor
        preconditions: ["TimeEntry.status == SUBMITTED", "X-User-ID != TimeEntry.care_manager_id (segregation of duties)", "the acting CareManager.is_supervisor == true"]
        side_effects: ["TimeEntry.approved_by_care_manager_id = X-User-ID", "TimeEntry.version += 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "PATCH /care/time-entries/{timeEntryId}/state with to_state=REJECTED"
        actor: PracticeSupervisor
        preconditions: ["TimeEntry.status == SUBMITTED", "X-User-ID != TimeEntry.care_manager_id", "the acting CareManager.is_supervisor == true"]
        side_effects: ["Client.unbilled_accrual_cents recomputed (a REJECTED entry leaves the accrual input set)", "TimeEntry.version += 1", "Client.version += 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "PATCH /care/time-entries/{timeEntryId}/state with to_state=DRAFT"
        actor: CareManager
        preconditions: ["TimeEntry.status == REJECTED", "X-User-ID == TimeEntry.care_manager_id"]
        side_effects: ["Client.unbilled_accrual_cents recomputed (the entry re-enters the accrual input set)", "TimeEntry.version += 1", "Client.version += 1"]
        note: "Correction cycle SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED is unbounded and must leave Client.unbilled_accrual_cents unchanged per lap."
      - from: APPROVED
        to: INVOICED
        trigger: "PATCH /care/invoices/{invoiceId}/state with to_state=ISSUED (system cascade)"
        actor: system
        preconditions: ["TimeEntry.status == APPROVED", "TimeEntry.id appears in the issuing Invoice.line_entry_ids"]
        side_effects: ["TimeEntry.invoice_id = the issuing invoice id", "Client.unbilled_accrual_cents recomputed downward", "TimeEntry.version += 1"]
      - from: INVOICED
        to: APPROVED
        trigger: "PATCH /care/invoices/{invoiceId}/state with to_state=VOIDED (system cascade, hop 2 of the invoice-void chain)"
        actor: system
        preconditions: ["TimeEntry.status == INVOICED", "the invoice named by TimeEntry.invoice_id is transitioning to VOIDED"]
        side_effects: ["TimeEntry.invoice_id reset to null", "Client.unbilled_accrual_cents recomputed upward", "TimeEntry.version += 1"]
      - from: APPROVED
        to: VOIDED
        trigger: "PATCH /care/time-entries/{timeEntryId}/state with to_state=VOIDED"
        actor: PracticeSupervisor
        preconditions: ["TimeEntry.status IN {DRAFT, SUBMITTED, APPROVED, REJECTED}", "TimeEntry.invoice_id is null (an entry sitting on an ISSUED invoice must be released by voiding that invoice first)"]
        side_effects: ["Client.unbilled_accrual_cents recomputed downward", "the care manager's daily rounded-minute total for TimeEntry.service_date drops by rounded_minutes", "TimeEntry.version += 1", "Client.version += 1"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "PATCH /care/invoices/{invoiceId}/state with to_state=ISSUED"
        actor: BillingAdministrator
        preconditions:
          - "Invoice.status == DRAFT"
          - "recomputing the FINAL variant yields a non-empty line_entry_ids set (else ERR_NO_BILLABLE_ACTIVITY)"
          - "Client.status != DISCHARGED"
        side_effects:
          - "Invoice.variant = FINAL and every computed money field is recomputed under the FINAL input set (APPROVED entries only)"
          - "Invoice.issued_at = logical clock now"
          - "Every TimeEntry in Invoice.line_entry_ids moves APPROVED -> INVOICED with invoice_id set"
          - "Client.retainer_balance_cents decreases by Invoice.retainer_applied_cents; Client.unbilled_accrual_cents recomputed"
          - "Client.status ACTIVE_CARE -> SUSPENDED_NONPAYMENT when the post-draw balance falls below Client.retainer_floor_cents and Invoice.balance_due_cents > 0 (which itself cascades ACTIVE authorizations to SUSPENDED)"
          - "Invoice.version += 1"
          - "Client.version += 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /care/invoices/{invoiceId}/payments"
        actor: BillingAdministrator
        preconditions: ["Invoice.status == ISSUED", "amount_paid_cents + amount_cents == Invoice.balance_due_cents (partial payments keep the invoice ISSUED; an overpayment is rejected with ERR_PAYMENT_EXCEEDS_BALANCE)"]
        side_effects: ["Invoice.amount_paid_cents += amount_cents", "Invoice.version += 1"]
      - from: DRAFT
        to: VOIDED
        trigger: "PATCH /care/invoices/{invoiceId}/state with to_state=VOIDED"
        actor: BillingAdministrator
        preconditions: ["Invoice.status == DRAFT"]
        side_effects: ["Invoice.voided_reason = reason", "no money or entry state changes (a DRAFT invoice never drew retainer nor moved entries)", "Invoice.version += 1"]
      - from: ISSUED
        to: VOIDED
        trigger: "PATCH /care/invoices/{invoiceId}/state with to_state=VOIDED"
        actor: BillingAdministrator
        preconditions: ["Invoice.status == ISSUED", "Invoice.amount_paid_cents == 0"]
        side_effects:
          - "Hop 1 — Invoice.status = VOIDED, Invoice.voided_reason = reason"
          - "Hop 2 — caused by hop 1, every TimeEntry with invoice_id == this invoice moves INVOICED -> APPROVED and its invoice_id is cleared"
          - "Hop 3 — caused by hop 2, Client.unbilled_accrual_cents is recomputed upward by exactly the released entries and Client.retainer_balance_cents is recomputed upward by exactly Invoice.retainer_applied_cents (the voided invoice leaves the {ISSUED, PAID} draw set)"
          - "Hop 4 — caused by hop 3, when Client.status == SUSPENDED_NONPAYMENT and the recomputed retainer balance is >= Client.retainer_floor_cents, Client.status -> ACTIVE_CARE"
          - "Hop 5 — caused by hop 4, every ServiceAuthorization of the client with auth_status == SUSPENDED AND suspension_reason == NONPAYMENT moves to ACTIVE with suspension_reason=NONE, and Client.authorized_coverage_hours is recomputed upward"
          - "Invoice.version += 1"
          - "Client.version += 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: care-plan-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /care/care-plans"
    occ_field: "expected_client_version"
    description: |
      Authoring a CarePlan against a Client whose version has advanced past the
      value the client last observed is rejected. A care plan legitimately
      supersedes the client's prior ACTIVE plan when it activates, so the write
      is only safe while the author's view of the client (its status, capacity
      determination, acuity score and existing plan set) is still current. A
      stale expected_client_version means the author never saw the intervening
      capacity determination, assessment acceptance or plan activation.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

  - rule_id: authorization-create-stale-care-plan
    parent_entity: CarePlan
    write_endpoint: "POST /care/service-authorizations"
    occ_field: "expected_care_plan_version"
    description: |
      Proposing a ServiceAuthorization against a CarePlan whose version has
      advanced past the value the caller last observed is rejected. A new
      authorization for a plan legitimately supersedes the coverage picture the
      caller was reasoning about (another authorization may have just been
      authorized, consuming the client's concurrent-caregiver capacity, or the
      plan may have been superseded), so a stale expected_care_plan_version
      means the caller's coverage view is no longer trustworthy.
    error_id: ERR_STALE_CARE_PLAN_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: time_entry_billable_amount
    trigger: "POST /care/time-entries (stamped at creation; never recomputed afterwards, so a later crisis-episode transition does not retroactively re-rate a logged entry)"
    algorithm: threshold
    formula: |
      raw_minutes      = floor((end_at - start_at) / 60 seconds)
      rounded_minutes  = ceil(raw_minutes / Client.billing_increment_min) * Client.billing_increment_min
      # rate_multiplier — evaluated in this exact branch order, first match wins:
      if service_type == TRAVEL:
          rate_multiplier = Client.travel_billing_pct / 100
      elif service_type == CRISIS_RESPONSE
           and CrisisEpisode(crisis_episode_id).status IN {OPEN, TRANSITION_OVERSIGHT}:
          rate_multiplier = CRISIS_MULTIPLIER            # 1.5
      elif service_type == CRISIS_RESPONSE:              # episode STABILIZED or CLOSED
          rate_multiplier = 1.0
      else:                                             # ASSESSMENT | CARE_COORDINATION | CONFERENCE
          rate_multiplier = 1.0
      after_hours_factor = 1.20 if (UTC hour of start_at < 8 or UTC hour of start_at >= 18) else 1.00
      # ONE rounding, applied to the fully composed product. Rounding any
      # intermediate factor (e.g. rounding the hourly-rate share before applying
      # after_hours_factor) is explicitly wrong.
      billable_amount_cents = round_half_up(
          rounded_minutes * CareManager.hourly_rate_cents * rate_multiplier * after_hours_factor / 60
      )
    input_set: "One TimeEntry row plus the CareManager named by care_manager_id, the Client named by client_id, and — only when service_type == CRISIS_RESPONSE — the CrisisEpisode named by crisis_episode_id."
    constants:
      CRISIS_MULTIPLIER: 1.5
      AFTER_HOURS_START_UTC_HOUR: 18
      AFTER_HOURS_END_UTC_HOUR: 8
      AFTER_HOURS_FACTOR: 1.20
      DAILY_BILLABLE_CAP_MINUTES: 600
      TRAVEL_BUFFER_MINUTES: 30
    precision: "Integer cents, round_half_up, applied exactly once to the whole product."
    variants: []
    note: "Four inputs interact non-linearly: the increment ladder is a ceiling function, rate_multiplier branches on the linked CrisisEpisode's live status, and after_hours_factor multiplies on top. Mode (a) of difficulty rule combinatorial_formula."

  - name: invoice_totals
    trigger: "POST /care/invoices (PROVISIONAL variant) and PATCH /care/invoices/{invoiceId}/state with to_state=ISSUED (FINAL variant)"
    algorithm: aggregation
    formula: |
      # 1. Candidate line set — status filter differs per variant (see variants).
      candidates = TimeEntry rows where
            client_id == Invoice.client_id
        AND invoice_id IS NULL
        AND service_date BETWEEN Invoice.period_start AND Invoice.period_end (both inclusive)
        AND status IN <variant status set>
      line_entry_ids = candidates sorted by start_at ASC, then created_at ASC
      # 2. Per-line amounts are ALREADY rounded (time_entry_billable_amount rounds
      #    per entry). Sum the rounded lines — "round per line, then sum".
      line_subtotal_cents = SUM(candidates.billable_amount_cents)
      # 3. The administrative fee uses the OPPOSITE order — "sum, then round"
      #    ONCE on the summed subtotal. Rounding a 7% fee per line and summing
      #    the roundings is explicitly wrong and yields different cents.
      admin_fee_cents = round_half_up(line_subtotal_cents * ADMIN_FEE_PCT / 100)
      total_due_cents = line_subtotal_cents + admin_fee_cents
      # 4. Retainer waterfall: the retainer is drawn first, the family is billed
      #    the remainder.
      retainer_applied_cents = min(Client.retainer_balance_cents, total_due_cents)
      balance_due_cents      = total_due_cents - retainer_applied_cents
    input_set: "TimeEntry rows of the invoice's client whose service_date lies inside the closed period window and whose invoice_id is null; the status filter is variant-specific."
    constants:
      ADMIN_FEE_PCT: 7
    precision: "Integer cents. Line amounts are rounded per entry upstream; admin_fee_cents is rounded once on the summed subtotal, round_half_up."
    variants:
      - name: PROVISIONAL
        when: "Invoice.status == DRAFT (stamped by POST /care/invoices and re-derived on every read of a DRAFT invoice)"
        difference: "status IN {SUBMITTED, APPROVED} — unapproved-but-submitted time is included so the family sees the expected bill; retainer_applied_cents is a projection and NO money moves."
      - name: FINAL
        when: "Invoice.status IN {ISSUED, PAID} (stamped by the DRAFT -> ISSUED transition)"
        difference: "status == APPROVED only — supervisor-unapproved time is dropped, so the same invoice row over the same data yields a strictly smaller line_subtotal_cents whenever any candidate is still SUBMITTED; retainer_applied_cents is actually debited from Client.retainer_balance_cents."
    note: "Dual-variant instance 1 (money / cost accounting on Invoice). Mode (b) of combinatorial_formula: the scaffold pins round-per-line for lines and sum-then-round for the admin fee."

  - name: assessment_composite_acuity
    trigger: "PATCH /care/assessments/{assessmentId}/state with to_state=SUBMITTED (SCREENING variant, writes Assessment.screening_acuity) and with to_state=ACCEPTED (COMPREHENSIVE variant, writes Assessment.comprehensive_acuity and Client.acuity_score)"
    algorithm: weighted_scoring
    formula: |
      d = Assessment.domain_scores          # six integers, each 0..5
      # SCREENING — unweighted arithmetic mean, no domain judgement:
      screening_acuity = round_half_up(
          (d.adl + d.cognition + d.medical_complexity + d.social_support + d.safety + d.finances) / 6 * 20
      )
      # COMPREHENSIVE — weighted by clinical priority:
      weighted = d.safety * 0.30 + d.cognition * 0.25 + d.adl * 0.20
               + d.medical_complexity * 0.15 + d.social_support * 0.05 + d.finances * 0.05
      comprehensive_acuity = round_half_up(weighted * 20)
      # Client roll-up — pinned selector, no ambiguity:
      #   candidate set : Assessment rows with client_id == Client.id AND status == ACCEPTED
      #   ranking       : accepted_at DESC
      #   tie-break     : created_at ASC   (never id)
      #   empty set     : Client.acuity_score = 0
      Client.acuity_score = comprehensive_acuity of the top-ranked candidate
    input_set: "Exactly one Assessment's domain_scores object for the two variants; for the Client roll-up, the client's Assessment rows with status == ACCEPTED."
    constants:
      WEIGHT_SAFETY: 0.30
      WEIGHT_COGNITION: 0.25
      WEIGHT_ADL: 0.20
      WEIGHT_MEDICAL_COMPLEXITY: 0.15
      WEIGHT_SOCIAL_SUPPORT: 0.05
      WEIGHT_FINANCES: 0.05
      DOMAIN_SCALE: 20
    precision: "Integer 0..100, round_half_up on the final product only."
    variants:
      - name: SCREENING
        when: "DRAFT -> SUBMITTED"
        difference: "Unweighted mean of the six domains — every domain counts equally."
      - name: COMPREHENSIVE
        when: "SUBMITTED -> ACCEPTED"
        difference: "Priority-weighted sum; safety and cognition carry 55% of the score between them, so a client heavy in safety/cognition risk scores materially higher than the screening pass suggested on identical domain_scores."
    note: "Dual-variant instance 2 — a different entity domain from invoice_totals: clinical risk scoring on Assessment/Client, not money on Invoice."

  - name: client_risk_posture
    trigger: "Recomputed after every mutation that can change its inputs: crisis-episode transitions, assessment acceptance, capacity determination, coi acknowledgement, and any authorization transition that changes a CarePlan.coverage_gap_flag"
    algorithm: threshold
    formula: |
      # First matching branch wins.
      if EXISTS CrisisEpisode where client_id == Client.id
                            and status IN {OPEN, TRANSITION_OVERSIGHT}:
          risk_posture = CRISIS
      elif Client.acuity_score >= ACUITY_ELEVATED_THRESHOLD               # >= 70, not > 70
         or Client.capacity_status == ADJUDICATED_INCAPACITATED
         or COUNT(ServiceAuthorization where client_id == Client.id
                  and coi_status IN {PENDING_DISCLOSURE, DISCLOSED}) >= 1
         or EXISTS CarePlan where client_id == Client.id
                            and status == ACTIVE and coverage_gap_flag == true:
          risk_posture = ELEVATED
      else:
          risk_posture = ROUTINE
    input_set: "The client's CrisisEpisode rows with status IN {OPEN, TRANSITION_OVERSIGHT}; the client's own acuity_score and capacity_status; ServiceAuthorization rows of the client with coi_status IN {PENDING_DISCLOSURE, DISCLOSED}; CarePlan rows of the client with status == ACTIVE."
    constants:
      ACUITY_ELEVATED_THRESHOLD: 70
    precision: "Enumerated result; the acuity comparison is inclusive at exactly 70."
    variants: []

  - name: client_retainer_and_accrual_ledger
    trigger: "Recomputed after every retainer deposit, invoice issue, invoice void, and every TimeEntry status transition"
    algorithm: aggregation
    formula: |
      retainer_deposits_total_cents = SUM(amount_cents of every accepted
          POST /care/clients/{clientId}/retainer-deposits call on this client)
      retainer_drawn_cents = SUM(Invoice.retainer_applied_cents
          where Invoice.client_id == Client.id AND Invoice.status IN {ISSUED, PAID})
      retainer_balance_cents = retainer_deposits_total_cents - retainer_drawn_cents
      unbilled_accrual_cents = SUM(TimeEntry.billable_amount_cents
          where TimeEntry.client_id == Client.id
            AND TimeEntry.status IN {DRAFT, SUBMITTED, APPROVED})
      # Conserved quantity (money), asserted after every forward/compensating pair:
      #   retainer_balance_cents + retainer_drawn_cents == retainer_deposits_total_cents
    input_set: "Retainer deposits of the client (append-only, never reversed); Invoice rows of the client with status IN {ISSUED, PAID}; TimeEntry rows of the client with status IN {DRAFT, SUBMITTED, APPROVED}. VOIDED and DRAFT invoices contribute zero draw; REJECTED, INVOICED and VOIDED time entries contribute zero accrual."
    constants: {}
    precision: "Integer cents; no rounding — every input is already integral."
    variants: []

  - name: client_authorized_coverage_hours
    trigger: "Recomputed on every ServiceAuthorization auth_status transition and on the Client discharge cascade"
    algorithm: aggregation
    formula: |
      coverage_hours(a) = floor((a.coverage_end - a.coverage_start) / 3600 seconds)
                          * a.concurrent_caregivers
      Client.authorized_coverage_hours = SUM(coverage_hours(a) for every
          ServiceAuthorization a where a.client_id == Client.id
                                   and a.auth_status IN {AUTHORIZED, ACTIVE})
      # Conserved quantity (authorized caregiver-hours of coverage), asserted
      # after every terminate/re-authorize or suspend/reactivate pair.
    input_set: "ServiceAuthorization rows of the client with auth_status IN {AUTHORIZED, ACTIVE}. PROPOSED, SUSPENDED and TERMINATED rows are excluded."
    constants: {}
    precision: "Number with no fractional part in practice (whole hours * integer caregivers)."
    variants: []

  - name: service_authorization_coordination_fee
    trigger: "POST /care/service-authorizations (stamped at creation)"
    algorithm: tiered_pricing
    formula: |
      base_cost_cents = coverage_hours * hourly_cost_cents
      # The fee tier is selected from base_cost_cents, NEVER from
      # total_projected_cost_cents. Selecting the tier from the total would be
      # circular (total depends on the fee, the fee depends on the tier, the
      # tier depends on the total). Pinned evaluation order:
      #   (1) coverage_hours -> (2) base_cost_cents -> (3) tier from base_cost_cents
      #   -> (4) coordination_fee_cents -> (5) total_projected_cost_cents
      if   base_cost_cents <  TIER_1_CEILING_CENTS:  pct = TIER_1_PCT   # < 200000 -> 8
      elif base_cost_cents <  TIER_2_CEILING_CENTS:  pct = TIER_2_PCT   # < 500000 -> 6
      else:                                          pct = TIER_3_PCT   # >= 500000 -> 4
      coordination_fee_cents      = round_half_up(base_cost_cents * pct / 100)
      total_projected_cost_cents  = base_cost_cents + coordination_fee_cents
    input_set: "One ServiceAuthorization row's coverage window, concurrent_caregivers and hourly_cost_cents."
    constants:
      TIER_1_CEILING_CENTS: 200000
      TIER_2_CEILING_CENTS: 500000
      TIER_1_PCT: 8
      TIER_2_PCT: 6
      TIER_3_PCT: 4
    precision: "Integer cents, round_half_up once on the fee."
    variants: []
    note: "Mode (c) of combinatorial_formula: a circular-looking dependency whose evaluation order is pinned. A base_cost of 190000 sits in tier 1 (8% -> 15200) even though the resulting total of 205200 would fall in tier 2 (6%)."

  - name: family_report_cadence_status
    trigger: "Derived on every read of a FamilyContact and after every POST /care/family-contacts/{contactId}/reports"
    algorithm: decay_function
    formula: |
      if FamilyContact.is_long_distance == false:
          report_status = NOT_APPLICABLE ; days_overdue = 0
      else:
          anchor = FamilyContact.last_report_sent_at
                   if last_report_sent_at IS NOT NULL else FamilyContact.created_at
          due_at   = anchor + reporting_cadence_days days
          grace_at = due_at + GRACE_DAYS days
          now      = logical clock now
          if   now <  due_at:    report_status = CURRENT ; days_overdue = 0
          elif now <  grace_at:  report_status = DUE     ; days_overdue = 0   # due_at is INCLUSIVE of DUE
          else:                  report_status = OVERDUE                      # grace_at is INCLUSIVE of OVERDUE
                                 days_overdue = floor((now - grace_at) / 86400 seconds)
    input_set: "One FamilyContact row plus the logical clock."
    constants:
      GRACE_DAYS: 7
    precision: "Whole days, floor; boundaries are inclusive on the later state (now == due_at is DUE, now == grace_at is OVERDUE)."
    variants: []

  - name: conference_quorum_evaluation
    trigger: "PATCH /care/family-conferences/{conferenceId}/state with to_state=CONVENED"
    algorithm: threshold
    formula: |
      invited  = COUNT(distinct FamilyConference.invited_contact_ids)
      attended = COUNT(distinct attended_contact_ids supplied on the transition)
      # Integer comparison — no division, no float rounding:
      half_met = (attended * 2 >= invited)
      surrogate_present = EXISTS c IN attended_contact_ids
                          where FamilyContact(c).is_surrogate_decision_maker == true
      if Client.capacity_status IN {DIMINISHED_DOCUMENTED, ADJUDICATED_INCAPACITATED}:
          quorum_met = half_met AND surrogate_present
                       AND EXISTS c IN attended_contact_ids where
                           FamilyContact(c).contact_role IN {POA_HEALTHCARE, GUARDIAN}
      else:
          quorum_met = half_met AND surrogate_present
    input_set: "The conference's invited_contact_ids, the attended_contact_ids supplied on the transition, those FamilyContact rows, and the Client's capacity_status."
    constants:
      QUORUM_NUMERATOR: 1
      QUORUM_DENOMINATOR: 2
    precision: "Boolean; the half threshold is inclusive (attended * 2 == invited passes)."
    variants: []

  - name: client_protective_escalation_status
    trigger: "Recomputed on every ConferenceDecision transition into ESCALATED, ESCALATION_ACCEPTED, ESCALATION_DECLINED or RESCINDED"
    algorithm: projection
    formula: |
      #   candidate set : ConferenceDecision rows whose parent FamilyConference.client_id
      #                   == Client.id AND decision_type IN
      #                   {ESCALATE_GUARDIANSHIP_PETITION, ESCALATE_APS_REPORT}
      #                   AND status IN {ESCALATED, ESCALATION_ACCEPTED, ESCALATION_DECLINED}
      #   ranking       : escalated_at DESC
      #   tie-break     : created_at ASC   (never id)
      #   empty set     : protective_escalation_status = NONE
      top = highest-ranked candidate
      protective_escalation_status = PENDING             if top.status == ESCALATED
                                     ACCEPTED            if top.status == ESCALATION_ACCEPTED
                                     DECLINED            if top.status == ESCALATION_DECLINED
    input_set: "The client's escalation-typed ConferenceDecision rows with status IN {ESCALATED, ESCALATION_ACCEPTED, ESCALATION_DECLINED}; RECORDED, RATIFIED and RESCINDED rows are excluded."
    constants: {}
    precision: "Enumerated result."
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "On a multi-role endpoint the acting role owns the requested to_state / action: SUBMITTED, DRAFT and WITHDRAWN-from-DRAFT belong to CareManager while ACCEPTED and REVISION_REQUESTED belong to PracticeSupervisor on assessments; PENDING_FAMILY_APPROVAL and DRAFT belong to CareManager while ACTIVE and REJECTED belong to FamilyDecisionMaker on care plans; AUTHORIZED belongs to PracticeSupervisor while ACTIVE, SUSPENDED and TERMINATED belong to CareManager on authorizations; SUBMITTED and DRAFT belong to CareManager while APPROVED, REJECTED and VOIDED belong to PracticeSupervisor on time entries; coi-events action=DISCLOSE belongs to CareManager and action=ACKNOWLEDGE to FamilyDecisionMaker"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "PATCH /care/assessments/{assessmentId}/state, PATCH /care/care-plans/{carePlanId}/state, PATCH /care/service-authorizations/{authorizationId}/state, PATCH /care/time-entries/{timeEntryId}/state, POST /care/service-authorizations/{authorizationId}/coi-events"
  - priority: 4
    category: existence
    check: "Request body parses, all required fields present, all types/enums/ranges valid (domain_scores carries exactly the six declared keys with integers 0..5; end_at > start_at; coverage_end > coverage_start; limit within 1..100)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 10
    category: existence
    check: "Client named by the path or by client_id exists"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {clientId} or a client_id body field"
  - priority: 11
    category: existence
    check: "CareManager named by the path or by care_manager_id exists"
    error_id: ERR_CARE_MANAGER_NOT_FOUND
    http_status: 404
    applies_to: "GET /care/care-managers/{careManagerId}, POST /care/assessments, POST /care/time-entries"
  - priority: 12
    category: existence
    check: "Vendor named by the path or by vendor_id exists"
    error_id: ERR_VENDOR_NOT_FOUND
    http_status: 404
    applies_to: "GET /care/vendors/{vendorId}, PATCH /care/vendors/{vendorId}, POST /care/service-authorizations"
  - priority: 13
    category: existence
    check: "FamilyContact named by the path, by decided_by_contact_id, by acknowledged_by_contact_id or by any element of invited_contact_ids exists"
    error_id: ERR_CONTACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /care/family-contacts/{contactId}, POST /care/family-contacts/{contactId}/reports, POST /care/family-conferences, POST /care/conference-decisions, POST /care/service-authorizations/{authorizationId}/coi-events"
  - priority: 14
    category: existence
    check: "Assessment named by the path or by source_assessment_id exists"
    error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET/PATCH /care/assessments/{assessmentId}, PATCH /care/assessments/{assessmentId}/state, POST /care/care-plans"
  - priority: 15
    category: existence
    check: "CarePlan named by the path, by care_plan_id or by supersedes_care_plan_id exists"
    error_id: ERR_CARE_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /care/care-plans/{carePlanId}, PATCH /care/care-plans/{carePlanId}/state, POST /care/care-plans, POST /care/service-authorizations"
  - priority: 16
    category: existence
    check: "ServiceAuthorization named by the path exists"
    error_id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /care/service-authorizations/{authorizationId}, PATCH /care/service-authorizations/{authorizationId}/state, POST /care/service-authorizations/{authorizationId}/coi-events"
  - priority: 17
    category: existence
    check: "FamilyConference named by the path or by family_conference_id exists"
    error_id: ERR_CONFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /care/family-conferences/{conferenceId}, PATCH /care/family-conferences/{conferenceId}/state, POST /care/conference-decisions"
  - priority: 18
    category: existence
    check: "ConferenceDecision named by the path or by authorizing_decision_id exists"
    error_id: ERR_DECISION_NOT_FOUND
    http_status: 404
    applies_to: "GET /care/conference-decisions/{decisionId}, PATCH /care/conference-decisions/{decisionId}/state, POST /care/service-authorizations"
  - priority: 19
    category: existence
    check: "CrisisEpisode named by the path or by crisis_episode_id exists"
    error_id: ERR_CRISIS_EPISODE_NOT_FOUND
    http_status: 404
    applies_to: "GET /care/crisis-episodes/{episodeId}, PATCH /care/crisis-episodes/{episodeId}/state, POST /care/time-entries"
  - priority: 20
    category: existence
    check: "TimeEntry named by the path exists"
    error_id: ERR_TIME_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "GET /care/time-entries/{timeEntryId}, PATCH /care/time-entries/{timeEntryId}/state"
  - priority: 21
    category: existence
    check: "Invoice named by the path exists"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /care/invoices/{invoiceId}, PATCH /care/invoices/{invoiceId}/state, POST /care/invoices/{invoiceId}/payments"
  - priority: 30
    category: auth
    check: "For entity_backed roles the acting X-User-ID owns the resource: a CareManager acts only on a TimeEntry/Assessment whose care_manager_id equals X-User-ID for author-side transitions; a FamilyDecisionMaker's X-User-ID must be a FamilyContact of the affected client with is_surrogate_decision_maker == true, and must equal acknowledged_by_contact_id on a coi ACKNOWLEDGE; an X-User-ID presenting X-User-Role=PracticeSupervisor must resolve to an existing CareManager whose is_supervisor == true"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "PATCH /care/assessments/{assessmentId}, PATCH /care/assessments/{assessmentId}/state, PATCH /care/time-entries/{timeEntryId}/state, PATCH /care/care-plans/{carePlanId}/state, PATCH /care/service-authorizations/{authorizationId}/state, PATCH /care/conference-decisions/{decisionId}/state, POST /care/service-authorizations/{authorizationId}/coi-events, PATCH /care/clients/{clientId}/state, and every GET under /care when the acting role is FamilyDecisionMaker (the addressed resource must resolve to the acting contact's own client_id)"
  - priority: 35
    category: state
    check: "expected_client_version equals the current Client.version (POST /care/care-plans); expected_care_plan_version equals the current CarePlan.version (POST /care/service-authorizations)"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    applies_to: "POST /care/care-plans, POST /care/service-authorizations (ERR_STALE_CARE_PLAN_VERSION on the latter)"
  - priority: 40
    category: state
    check: "The requested transition exists in the target resource's state machine from its current state (includes second-cancel, terminal-state lockdown, coi-events on a NOT_REQUIRED row, and a domain_scores edit on an assessment whose status is not DRAFT)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every PATCH .../state endpoint, PATCH /care/assessments/{assessmentId} (domain_scores edits), POST /care/service-authorizations/{authorizationId}/coi-events, POST /care/invoices/{invoiceId}/payments"
  - priority: 41
    category: state
    check: "The affected Client.status is compatible with the operation: DISCHARGED blocks assessment creation, time-entry creation, invoice creation, invoice issue and authorization AUTHORIZED; SUSPENDED_NONPAYMENT additionally blocks authorization AUTHORIZED"
    error_id: ERR_CLIENT_NOT_IN_SERVICE
    http_status: 409
    applies_to: "POST /care/assessments, POST /care/time-entries, POST /care/invoices, PATCH /care/invoices/{invoiceId}/state, PATCH /care/service-authorizations/{authorizationId}/state"
  - priority: 42
    category: state
    check: "The CarePlan's source Assessment.status == ACCEPTED"
    error_id: ERR_ASSESSMENT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /care/care-plans, PATCH /care/care-plans/{carePlanId}/state with to_state=PENDING_FAMILY_APPROVAL"
  - priority: 43
    category: state
    check: "CarePlan.pinned_assessment_version equals the current version of the source Assessment"
    error_id: ERR_PINNED_ASSESSMENT_STALE
    http_status: 409
    applies_to: "PATCH /care/care-plans/{carePlanId}/state with to_state=PENDING_FAMILY_APPROVAL"
  - priority: 44
    category: state
    check: "The parent CarePlan.status == ACTIVE when authorizing a ServiceAuthorization"
    error_id: ERR_CARE_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "PATCH /care/service-authorizations/{authorizationId}/state with to_state=AUTHORIZED"
  - priority: 50
    category: business_safety
    check: "Vendor.standing != BARRED on the vendor named by a new ServiceAuthorization, and on any authorization transitioning to AUTHORIZED or back to ACTIVE"
    error_id: ERR_VENDOR_BARRED
    http_status: 422
    applies_to: "POST /care/service-authorizations, PATCH /care/service-authorizations/{authorizationId}/state"
  - priority: 51
    category: business_safety
    check: "ServiceAuthorization.coi_status IN {NOT_REQUIRED, ACKNOWLEDGED} before the authorization may be AUTHORIZED"
    error_id: ERR_COI_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "PATCH /care/service-authorizations/{authorizationId}/state with to_state=AUTHORIZED"
  - priority: 52
    category: business_safety
    check: "acknowledged_by_contact_id is a FamilyContact of the authorization's client with is_surrogate_decision_maker == true and contact_role IN {POA_HEALTHCARE, POA_FINANCIAL, GUARDIAN, RESPONSIBLE_PARTY}"
    error_id: ERR_COI_ACK_BY_INELIGIBLE_PARTY
    http_status: 422
    applies_to: "POST /care/service-authorizations/{authorizationId}/coi-events with action=ACKNOWLEDGE"
  - priority: 53
    category: business_safety
    check: "capacity_basis is supplied on a ConferenceDecision when the client's capacity_status != PRESUMED_CAPABLE"
    error_id: ERR_CAPACITY_BASIS_REQUIRED
    http_status: 422
    applies_to: "POST /care/conference-decisions"
  - priority: 54
    category: business_safety
    check: "decided_by_contact_id has is_surrogate_decision_maker == true, and additionally contact_role IN {POA_HEALTHCARE, GUARDIAN} when the client's capacity_status == ADJUDICATED_INCAPACITATED"
    error_id: ERR_SURROGATE_AUTHORITY_MISSING
    http_status: 422
    applies_to: "POST /care/conference-decisions"
  - priority: 55
    category: business_safety
    check: "calculations.conference_quorum_evaluation returns quorum_met == true"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "PATCH /care/family-conferences/{conferenceId}/state with to_state=CONVENED"
  - priority: 56
    category: business_safety
    check: "Escalation preconditions hold: decision_type IN {ESCALATE_GUARDIANSHIP_PETITION, ESCALATE_APS_REPORT}, the client's capacity_status IN {DIMINISHED_DOCUMENTED, ADJUDICATED_INCAPACITATED}, and the parent FamilyConference.status == DOCUMENTED"
    error_id: ERR_ESCALATION_PRECONDITION_UNMET
    http_status: 422
    applies_to: "PATCH /care/conference-decisions/{decisionId}/state with to_state=ESCALATED"
  - priority: 57
    category: business_safety
    check: "The acting X-User-ID differs from the author: Assessment.care_manager_id on review transitions, TimeEntry.care_manager_id on approval/rejection transitions"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "PATCH /care/assessments/{assessmentId}/state with to_state IN {ACCEPTED, REVISION_REQUESTED}, PATCH /care/time-entries/{timeEntryId}/state with to_state IN {APPROVED, REJECTED}"
  - priority: 58
    category: business_safety
    check: "service_type == CRISIS_RESPONSE requires a crisis_episode_id whose CrisisEpisode.status IN {OPEN, STABILIZED, TRANSITION_OVERSIGHT} and whose client_id matches; non-crisis service types must omit crisis_episode_id"
    error_id: ERR_CRISIS_CONTEXT_REQUIRED
    http_status: 422
    applies_to: "POST /care/time-entries"
  - priority: 62
    category: business_referential
    check: "Cross-entity parentage holds: source_assessment_id and supersedes_care_plan_id belong to client_id; every invited_contact_ids element and decided_by_contact_id belong to the conference's client; authorizing_decision_id is a ConferenceDecision with status == RATIFIED whose conference belongs to the care plan's client; crisis_episode_id belongs to client_id; attended_contact_ids is a subset of invited_contact_ids"
    error_id: ERR_ENTITY_RELATIONSHIP_INVALID
    http_status: 422
    applies_to: "POST /care/care-plans, POST /care/service-authorizations, POST /care/family-conferences, POST /care/conference-decisions, POST /care/time-entries, PATCH /care/family-conferences/{conferenceId}/state"
  - priority: 64
    category: business_constraint
    check: "Aggregate coverage capacity: for the candidate window, SUM(concurrent_caregivers) over the client's ServiceAuthorization rows with auth_status IN {AUTHORIZED, ACTIVE} whose CLOSED coverage interval intersects the candidate's CLOSED interval (touching endpoints count as intersecting), plus the candidate's own concurrent_caregivers, must be <= Client.authorized_concurrent_caregivers"
    error_id: ERR_COVERAGE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "PATCH /care/service-authorizations/{authorizationId}/state with to_state IN {AUTHORIZED, ACTIVE}"
  - priority: 65
    category: business_temporal
    check: "No other TimeEntry of the same care_manager_id with status IN {DRAFT, SUBMITTED, APPROVED, INVOICED} has a HALF-OPEN [start_at, end_at) interval intersecting the candidate's; touching endpoints (previous.end_at == candidate.start_at) do NOT intersect"
    error_id: ERR_TIME_ENTRY_OVERLAP
    http_status: 409
    applies_to: "POST /care/time-entries"
  - priority: 66
    category: business_temporal
    check: "When the nearest non-overlapping neighbouring TimeEntry of the same care manager (status IN {DRAFT, SUBMITTED, APPROVED, INVOICED}) carries a different service_location_id, the gap between the two intervals must be >= TRAVEL_BUFFER_MINUTES (30); a gap of exactly 30 minutes passes"
    error_id: ERR_TRAVEL_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /care/time-entries"
  - priority: 67
    category: business_temporal
    check: "No other Invoice of the same client with status IN {DRAFT, ISSUED, PAID} covers a service_date inside the candidate's closed [period_start, period_end] window"
    error_id: ERR_INVOICE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /care/invoices"
  - priority: 72
    category: business_fiscal
    check: "SUM(rounded_minutes) over the same care_manager_id and the same service_date across TimeEntry rows with status IN {DRAFT, SUBMITTED, APPROVED, INVOICED}, including the candidate, must be <= DAILY_BILLABLE_CAP_MINUTES (600); exactly 600 passes"
    error_id: ERR_DAILY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /care/time-entries"
  - priority: 73
    category: business_fiscal
    check: "The active variant's line_entry_ids set is non-empty"
    error_id: ERR_NO_BILLABLE_ACTIVITY
    http_status: 422
    applies_to: "POST /care/invoices, PATCH /care/invoices/{invoiceId}/state with to_state=ISSUED"
  - priority: 74
    category: business_fiscal
    check: "amount_paid_cents + amount_cents <= Invoice.balance_due_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /care/invoices/{invoiceId}/payments"
  - priority: 75
    category: business_fiscal
    check: "Client.retainer_balance_cents >= Client.retainer_floor_cents before a ServiceAuthorization may be AUTHORIZED"
    error_id: ERR_RETAINER_INSUFFICIENT
    http_status: 402
    applies_to: "PATCH /care/service-authorizations/{authorizationId}/state with to_state=AUTHORIZED"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Clients -------------------------------------------------------------
  - method: POST
    path: "/care/clients"
    description: "Register an older adult as a prospect."
    roles: [PracticeAdmin]
    code: 201
    input: [full_name, residence_setting, "billing_increment_min?", "travel_billing_pct?", "retainer_floor_cents?", "authorized_concurrent_caregivers?"]
    output: Client
    side_effects: ["Client.status = PROSPECT", "Client.capacity_status = PRESUMED_CAPABLE", "all computed ledger fields initialised to 0", "Client.risk_posture = ROUTINE"]
  - method: GET
    path: "/care/clients"
    description: "List clients, newest first (created_at DESC, tie-break created_at ASC is impossible so ordering is total)."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: ["status?", "risk_posture?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: GET
    path: "/care/clients/{clientId}"
    description: "Read one client with every derived ledger and posture field recomputed."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: PATCH
    path: "/care/clients/{clientId}/state"
    description: "Move a client to DISCHARGED (or back to ACTIVE_CARE from SUSPENDED_NONPAYMENT once the retainer is restored)."
    roles: [PracticeAdmin, PracticeSupervisor]
    code: 200
    input: [to_state, "reason?"]
    output: Client
    side_effects: ["Client state machine transition", "on DISCHARGED: authorizations TERMINATED with termination_reason=CLIENT_DISCHARGED and care plans WITHDRAWN", "Client.authorized_coverage_hours recomputed", "increments Client.version by 1"]
  - method: POST
    path: "/care/clients/{clientId}/capacity-determination"
    description: "Record a capacity determination with its evidentiary basis."
    roles: [CareManager, PracticeSupervisor]
    code: 200
    input: [capacity_status, basis]
    output: Client
    side_effects: ["Client.capacity_status and Client.capacity_basis written", "Client.risk_posture recomputed by calculations.client_risk_posture", "increments Client.version by 1"]
  - method: POST
    path: "/care/clients/{clientId}/retainer-deposits"
    description: "Post a private-pay retainer deposit to the client's trust balance."
    roles: [BillingAdministrator]
    code: 200
    input: [amount_cents, received_at]
    output: Client
    side_effects: ["Client.retainer_deposits_total_cents and Client.retainer_balance_cents recomputed by calculations.client_retainer_and_accrual_ledger", "Client SUSPENDED_NONPAYMENT -> ACTIVE_CARE when the recomputed balance >= retainer_floor_cents, which reactivates NONPAYMENT-suspended authorizations", "increments Client.version by 1"]

  # ---- Care managers -------------------------------------------------------
  - method: POST
    path: "/care/care-managers"
    description: "Register a care manager; is_supervisor grants the PracticeSupervisor role to this X-User-ID."
    roles: [PracticeAdmin]
    code: 201
    input: [full_name, credential, hourly_rate_cents, "is_supervisor?", "active?"]
    output: CareManager
    side_effects: []
  - method: GET
    path: "/care/care-managers/{careManagerId}"
    description: "Read one care manager."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator]
    code: 200
    input: []
    output: CareManager
    side_effects: []

  # ---- Vendors -------------------------------------------------------------
  - method: POST
    path: "/care/vendors"
    description: "Register a coordinated provider across home care, medical, legal or housing."
    roles: [PracticeAdmin]
    code: 201
    input: [name, vendor_type, has_referral_relationship, "referral_fee_pct?", "standing?"]
    output: Vendor
    side_effects: ["referral_fee_pct must be > 0 when has_referral_relationship is true (ERR_INVALID_REQUEST otherwise)"]
  - method: GET
    path: "/care/vendors"
    description: "List vendors."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: ["vendor_type?", "standing?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []
  - method: GET
    path: "/care/vendors/{vendorId}"
    description: "Read one vendor."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: PATCH
    path: "/care/vendors/{vendorId}"
    description: "Update a vendor's standing or referral fee; BARRING a vendor cascades to its live authorizations."
    roles: [PracticeAdmin]
    code: 200
    input: ["standing?", "referral_fee_pct?"]
    output: Vendor
    side_effects: ["On standing=BARRED: every ServiceAuthorization of this vendor with auth_status == ACTIVE moves to SUSPENDED with suspension_reason=VENDOR_STANDING and every PROPOSED or AUTHORIZED row moves to TERMINATED with termination_reason=VENDOR_STANDING", "affected Clients' authorized_coverage_hours and risk_posture recomputed", "increments Vendor.version by 1"]

  # ---- Family contacts -----------------------------------------------------
  - method: POST
    path: "/care/family-contacts"
    description: "Attach a family member, fiduciary or surrogate decision maker to a client."
    roles: [PracticeAdmin, CareManager]
    code: 201
    input: [client_id, full_name, contact_role, "is_surrogate_decision_maker?", "is_long_distance?", "reporting_cadence_days?"]
    output: FamilyContact
    side_effects: ["FamilyContact.report_status derived by calculations.family_report_cadence_status (CURRENT for a long-distance contact created inside its first cadence window, NOT_APPLICABLE otherwise)"]
  - method: GET
    path: "/care/family-contacts"
    description: "List family contacts, filterable by client and cadence status."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: ["client_id?", "report_status?", "limit?", "offset?"]
    output: FamilyContact[]
    side_effects: []
  - method: GET
    path: "/care/family-contacts/{contactId}"
    description: "Read one family contact with report_status and days_overdue recomputed against the logical clock."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: []
    output: FamilyContact
    side_effects: []
  - method: POST
    path: "/care/family-contacts/{contactId}/reports"
    description: "Send the long-distance family report for a period and reset the cadence clock."
    roles: [CareManager]
    code: 200
    input: [report_period_start, report_period_end, summary]
    output: FamilyContact
    side_effects: ["FamilyContact.last_report_sent_at = logical clock now", "FamilyContact.reports_sent_count += 1", "report_status and days_overdue recomputed", "increments FamilyContact.version by 1"]

  # ---- Assessments ---------------------------------------------------------
  - method: POST
    path: "/care/assessments"
    description: "Open a comprehensive geriatric assessment in DRAFT."
    roles: [CareManager]
    code: 201
    input: [client_id, care_manager_id, domain_scores, "narrative?"]
    output: Assessment
    side_effects: ["Assessment.status = DRAFT", "Assessment.revision_round = 0", "Client PROSPECT -> ASSESSMENT_IN_PROGRESS", "increments Client.version by 1"]
  - method: GET
    path: "/care/assessments"
    description: "List assessments filterable by client, author and reviewer."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: ["client_id?", "care_manager_id?", "reviewed_by_care_manager_id?", "status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []
  - method: GET
    path: "/care/assessments/{assessmentId}"
    description: "Read one assessment."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: PATCH
    path: "/care/assessments/{assessmentId}"
    description: "Edit a DRAFT assessment's domain scores, or correct the narrative of a DRAFT or ACCEPTED assessment."
    roles: [CareManager]
    code: 200
    input: ["domain_scores?", "narrative?"]
    output: Assessment
    side_effects: ["A domain_scores edit is permitted only while Assessment.status == DRAFT (else ERR_INVALID_STATE_TRANSITION)", "A narrative-only correction is permitted while Assessment.status IN {DRAFT, ACCEPTED}; it never re-derives screening_acuity or comprehensive_acuity and never changes status", "increments Assessment.version by 1 (which is what stales a CarePlan's pinned_assessment_version)"]
  - method: PATCH
    path: "/care/assessments/{assessmentId}/state"
    description: "Drive the assessment review cycle: SUBMITTED, ACCEPTED, REVISION_REQUESTED, DRAFT or WITHDRAWN."
    roles: [CareManager, PracticeSupervisor]
    code: 200
    input: [to_state, "review_note?"]
    output: Assessment
    side_effects: ["Assessment state machine transition", "screening_acuity / comprehensive_acuity stamped per variant", "Client.acuity_score and Client.risk_posture recomputed on ACCEPTED", "increments Assessment.version by 1"]

  # ---- Care plans ----------------------------------------------------------
  - method: POST
    path: "/care/care-plans"
    description: "Author a care plan from an ACCEPTED assessment; pins the assessment version. Requires the client version the author last observed."
    roles: [CareManager]
    code: 201
    input: [client_id, source_assessment_id, expected_client_version, goals, "review_interval_days?", "supersedes_care_plan_id?"]
    output: CarePlan
    side_effects: ["CarePlan.status = DRAFT", "CarePlan.pinned_assessment_version = source Assessment.version", "CarePlan.coverage_gap_flag = true", "increments Client.version by 1"]
  - method: GET
    path: "/care/care-plans"
    description: "List care plans filterable by client, source assessment and superseded predecessor."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: ["client_id?", "source_assessment_id?", "supersedes_care_plan_id?", "approved_by_contact_id?", "status?", "limit?", "offset?"]
    output: CarePlan[]
    side_effects: []
  - method: GET
    path: "/care/care-plans/{carePlanId}"
    description: "Read one care plan with coverage_gap_flag recomputed."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: []
    output: CarePlan
    side_effects: []
  - method: PATCH
    path: "/care/care-plans/{carePlanId}/state"
    description: "Send a plan for family approval, or record the family's ACTIVE / REJECTED decision, or return a rejected plan to DRAFT."
    roles: [CareManager, FamilyDecisionMaker, PracticeSupervisor]
    code: 200
    input: [to_state, "decision_note?"]
    output: CarePlan
    side_effects: ["CarePlan state machine transition", "on ACTIVE: predecessor plan SUPERSEDED with its authorizations TERMINATED (termination_reason=PLAN_SUPERSEDED), Client -> ACTIVE_CARE, Client.risk_posture and authorized_coverage_hours recomputed", "increments CarePlan.version by 1"]

  # ---- Service authorizations ---------------------------------------------
  - method: POST
    path: "/care/service-authorizations"
    description: "Propose a vendor engagement against an ACTIVE care plan. Requires the care-plan version the caller last observed. Mints the conflict-of-interest disclosure when the vendor carries a referral relationship."
    roles: [CareManager]
    code: 201
    input: [care_plan_id, vendor_id, expected_care_plan_version, coverage_start, coverage_end, concurrent_caregivers, hourly_cost_cents, "authorizing_decision_id?"]
    output: ServiceAuthorization
    side_effects: ["auth_status = PROPOSED", "client_id copied from CarePlan.client_id", "coverage_hours, base_cost_cents, coordination_fee_cents and total_projected_cost_cents stamped by calculations.service_authorization_coordination_fee", "coi_status = PENDING_DISCLOSURE with disclosure_text minted when Vendor.has_referral_relationship is true, else NOT_REQUIRED", "Client.risk_posture recomputed (a pending disclosure is an ELEVATED trigger)", "increments CarePlan.version by 1", "increments Client.version by 1"]
  - method: GET
    path: "/care/service-authorizations"
    description: "List service authorizations filterable by client, plan, vendor, authorizing decision and acknowledging contact."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: ["client_id?", "care_plan_id?", "vendor_id?", "authorizing_decision_id?", "coi_acknowledged_by_contact_id?", "auth_status?", "coi_status?", "limit?", "offset?"]
    output: ServiceAuthorization[]
    side_effects: []
  - method: GET
    path: "/care/service-authorizations/{authorizationId}"
    description: "Read one service authorization with both state dimensions and all cost projections."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: []
    output: ServiceAuthorization
    side_effects: []
  - method: PATCH
    path: "/care/service-authorizations/{authorizationId}/state"
    description: "Advance the auth_status dimension: AUTHORIZED, ACTIVE, SUSPENDED or TERMINATED."
    roles: [CareManager, PracticeSupervisor]
    code: 200
    input: [to_state, "reason?"]
    output: ServiceAuthorization
    side_effects: ["ServiceAuthorization auth_status transition", "Client.authorized_coverage_hours recomputed by calculations.client_authorized_coverage_hours", "parent CarePlan.coverage_gap_flag recomputed", "Client.risk_posture recomputed", "increments ServiceAuthorization.version by 1"]
  - method: POST
    path: "/care/service-authorizations/{authorizationId}/coi-events"
    description: "Advance the independent coi_status dimension: action=DISCLOSE (care manager delivers the disclosure) or action=ACKNOWLEDGE (surrogate family decision maker acknowledges it)."
    roles: [CareManager, FamilyDecisionMaker]
    code: 200
    input: [action, "acknowledged_by_contact_id?", "note?"]
    output: ServiceAuthorization
    side_effects: ["coi_status transition PENDING_DISCLOSURE -> DISCLOSED -> ACKNOWLEDGED", "coi_acknowledged_by_contact_id written on ACKNOWLEDGE", "Client.risk_posture recomputed", "increments ServiceAuthorization.version by 1"]

  # ---- Family conferences and decisions -----------------------------------
  - method: POST
    path: "/care/family-conferences"
    description: "Schedule a family conference and record the invitation list."
    roles: [CareManager]
    code: 201
    input: [client_id, scheduled_start, scheduled_end, invited_contact_ids, "agenda?"]
    output: FamilyConference
    side_effects: ["status = SCHEDULED", "attended_contact_ids = []", "quorum_met = false", "surrogate_present = false"]
  - method: GET
    path: "/care/family-conferences"
    description: "List family conferences filterable by client and status."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: FamilyConference[]
    side_effects: []
  - method: GET
    path: "/care/family-conferences/{conferenceId}"
    description: "Read one family conference with quorum_met and surrogate_present."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: []
    output: FamilyConference
    side_effects: []
  - method: PATCH
    path: "/care/family-conferences/{conferenceId}/state"
    description: "Convene (recording attendance and evaluating quorum), document, reschedule, return to SCHEDULED, or cancel a conference."
    roles: [CareManager]
    code: 200
    input: [to_state, "attended_contact_ids?", "rescheduled_start?", "rescheduled_end?", "reason?"]
    output: FamilyConference
    side_effects: ["FamilyConference state machine transition", "quorum_met and surrogate_present stamped by calculations.conference_quorum_evaluation on CONVENED", "increments FamilyConference.version by 1"]
  - method: POST
    path: "/care/conference-decisions"
    description: "Document a family decision reached at a convened conference, with the capacity basis when the client is not presumed capable."
    roles: [CareManager]
    code: 201
    input: [family_conference_id, decided_by_contact_id, decision_type, decision_text, "capacity_basis?"]
    output: ConferenceDecision
    side_effects: ["status = RECORDED", "increments FamilyConference.version by 1"]
  - method: GET
    path: "/care/conference-decisions"
    description: "List documented decisions filterable by conference, deciding contact and status."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: ["family_conference_id?", "decided_by_contact_id?", "decision_type?", "status?", "limit?", "offset?"]
    output: ConferenceDecision[]
    side_effects: []
  - method: GET
    path: "/care/conference-decisions/{decisionId}"
    description: "Read one documented decision."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: []
    output: ConferenceDecision
    side_effects: []
  - method: PATCH
    path: "/care/conference-decisions/{decisionId}/state"
    description: "Ratify a decision, escalate it to guardianship or protective services, record the escalation outcome, or rescind it."
    roles: [PracticeSupervisor]
    code: 200
    input: [to_state, "note?"]
    output: ConferenceDecision
    side_effects: ["ConferenceDecision state machine transition", "Client.protective_escalation_status recomputed by calculations.client_protective_escalation_status", "on ESCALATION_ACCEPTED of a guardianship petition: Client.capacity_status -> ADJUDICATED_INCAPACITATED, then PENDING_FAMILY_APPROVAL plans revert to DRAFT, then Client.risk_posture -> ELEVATED", "on RESCINDED: authorizations naming this decision TERMINATED, then coverage hours and coverage_gap_flag recomputed, then Client.risk_posture recomputed", "increments ConferenceDecision.version by 1", "increments Client.version by 1"]

  # ---- Crisis episodes -----------------------------------------------------
  - method: POST
    path: "/care/crisis-episodes"
    description: "Open a crisis episode; the client's risk_posture becomes CRISIS immediately."
    roles: [CareManager]
    code: 201
    input: [client_id, trigger_type, "hospital_name?"]
    output: CrisisEpisode
    side_effects: ["status = OPEN", "opened_at = logical clock now", "assigned_care_manager_id = X-User-ID", "Client.risk_posture recomputed to CRISIS", "increments Client.version by 1"]
  - method: GET
    path: "/care/crisis-episodes"
    description: "List crisis episodes filterable by client, assigned care manager and status."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: ["client_id?", "assigned_care_manager_id?", "status?", "limit?", "offset?"]
    output: CrisisEpisode[]
    side_effects: []
  - method: GET
    path: "/care/crisis-episodes/{episodeId}"
    description: "Read one crisis episode."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: []
    output: CrisisEpisode
    side_effects: []
  - method: PATCH
    path: "/care/crisis-episodes/{episodeId}/state"
    description: "Stabilize, hand to hospital-to-home transition oversight, readmit, or close a crisis episode."
    roles: [CareManager, PracticeSupervisor]
    code: 200
    input: [to_state, "discharge_at?", "note?"]
    output: CrisisEpisode
    side_effects: ["CrisisEpisode state machine transition", "Client.risk_posture recomputed by calculations.client_risk_posture", "increments CrisisEpisode.version by 1", "increments Client.version by 1"]

  # ---- Time entries --------------------------------------------------------
  - method: POST
    path: "/care/time-entries"
    description: "Log private-pay billable time (including travel and crisis response) against a client."
    roles: [CareManager]
    code: 201
    input: [client_id, care_manager_id, service_type, start_at, end_at, service_location_id, "crisis_episode_id?", "note?"]
    output: TimeEntry
    side_effects: ["status = DRAFT", "service_date, raw_minutes, rounded_minutes, rate_multiplier, after_hours_factor and billable_amount_cents stamped by calculations.time_entry_billable_amount", "Client.unbilled_accrual_cents recomputed", "increments Client.version by 1"]
  - method: GET
    path: "/care/time-entries"
    description: "List time entries filterable by client, author, approver, invoice, crisis episode, status and service date."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: ["client_id?", "care_manager_id?", "approved_by_care_manager_id?", "invoice_id?", "crisis_episode_id?", "status?", "service_date?", "limit?", "offset?"]
    output: TimeEntry[]
    side_effects: []
  - method: GET
    path: "/care/time-entries/{timeEntryId}"
    description: "Read one time entry with its rating breakdown."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []
  - method: PATCH
    path: "/care/time-entries/{timeEntryId}/state"
    description: "Submit, approve, reject, return to draft, or void a time entry."
    roles: [CareManager, PracticeSupervisor]
    code: 200
    input: [to_state, "reason?"]
    output: TimeEntry
    side_effects: ["TimeEntry state machine transition", "Client.unbilled_accrual_cents recomputed by calculations.client_retainer_and_accrual_ledger", "increments TimeEntry.version by 1", "increments Client.version by 1"]

  # ---- Invoices ------------------------------------------------------------
  - method: POST
    path: "/care/invoices"
    description: "Open a DRAFT invoice for a billing period; totals are computed under the PROVISIONAL variant."
    roles: [BillingAdministrator]
    code: 201
    input: [client_id, period_start, period_end]
    output: Invoice
    side_effects: ["status = DRAFT", "variant = PROVISIONAL", "line_entry_ids, line_subtotal_cents, admin_fee_cents, total_due_cents, retainer_applied_cents and balance_due_cents stamped by calculations.invoice_totals (PROVISIONAL)", "no money moves"]
  - method: GET
    path: "/care/invoices"
    description: "List invoices filterable by client and status."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/care/invoices/{invoiceId}"
    description: "Read one invoice; a DRAFT invoice is re-derived under the PROVISIONAL variant on every read."
    roles: [PracticeAdmin, CareManager, PracticeSupervisor, BillingAdministrator, FamilyDecisionMaker]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: PATCH
    path: "/care/invoices/{invoiceId}/state"
    description: "Issue a DRAFT invoice (switching to the FINAL variant and drawing the retainer) or void an invoice (releasing everything it consumed)."
    roles: [BillingAdministrator]
    code: 200
    input: [to_state, "reason?"]
    output: Invoice
    side_effects: ["Invoice state machine transition", "on ISSUED: variant = FINAL, totals recomputed under the APPROVED-only input set, entries move APPROVED -> INVOICED, retainer drawn, client possibly SUSPENDED_NONPAYMENT with its ACTIVE authorizations suspended", "on VOIDED from ISSUED: the five-hop release cascade of 1.2 Invoice ISSUED_to_VOIDED", "increments Invoice.version by 1", "increments Client.version by 1"]
  - method: POST
    path: "/care/invoices/{invoiceId}/payments"
    description: "Record a family payment against an issued invoice."
    roles: [BillingAdministrator]
    code: 200
    input: [amount_cents, received_at, method]
    output: Invoice
    side_effects: ["Invoice.amount_paid_cents increased", "Invoice ISSUED -> PAID when the balance is fully settled", "increments Invoice.version by 1"]

  # ---- Test-driving surface ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every timestamp, cadence window and expiry rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z; until this endpoint is called the logical clock reads that default and never falls back to real wall-clock time."
    roles: [PracticeAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["All subsequent logical-clock reads (created_at, updated_at, accepted_at, cadence evaluation, opened_at, issued_at) use the new instant"]

# ============================================================================
# 1.6 Error Catalog
# ============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    when: "The X-User-ID header is absent or empty on any endpoint under /care or /_clock."
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    when: "The caller's role is not listed in the endpoint's roles, or the caller is a FamilyContact whose client_id does not match the addressed client."
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    when: "A required input field is absent, a field has the wrong JSON type, an enum value is outside its declared set, a numeric field is out of range, or an interval has end <= start."
  - error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    when: "The addressed or referenced client_id matches no Client."
  - error_id: ERR_CARE_MANAGER_NOT_FOUND
    http_status: 404
    when: "The addressed or referenced care_manager_id (including primary_care_manager_id, assigned_care_manager_id and approved_by_care_manager_id) matches no CareManager."
  - error_id: ERR_VENDOR_NOT_FOUND
    http_status: 404
    when: "The addressed or referenced vendor_id matches no Vendor."
  - error_id: ERR_CONTACT_NOT_FOUND
    http_status: 404
    when: "A referenced family contact id (contact_id, decided_by_contact_id, acknowledged_by_contact_id, or any member of invited_contact_ids / attended_contact_ids) matches no FamilyContact."
  - error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    when: "The addressed or referenced assessment_id matches no Assessment."
  - error_id: ERR_CARE_PLAN_NOT_FOUND
    http_status: 404
    when: "The addressed or referenced care_plan_id matches no CarePlan."
  - error_id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    when: "The addressed authorizationId matches no ServiceAuthorization."
  - error_id: ERR_CONFERENCE_NOT_FOUND
    http_status: 404
    when: "The addressed or referenced family_conference_id matches no FamilyConference."
  - error_id: ERR_DECISION_NOT_FOUND
    http_status: 404
    when: "The addressed decisionId or a referenced authorizing_decision_id matches no ConferenceDecision."
  - error_id: ERR_CRISIS_EPISODE_NOT_FOUND
    http_status: 404
    when: "The addressed or referenced crisis_episode_id matches no CrisisEpisode."
  - error_id: ERR_TIME_ENTRY_NOT_FOUND
    http_status: 404
    when: "The addressed timeEntryId matches no TimeEntry."
  - error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    when: "The addressed invoiceId matches no Invoice."
  - error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    when: "POST /care/care-plans carries an expected_client_version that does not equal the stored Client.version."
  - error_id: ERR_STALE_CARE_PLAN_VERSION
    http_status: 412
    when: "POST /care/service-authorizations carries an expected_care_plan_version that does not equal the stored CarePlan.version."
  - error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    when: "The requested to_state or action is not reachable from the entity's current state in that entity's state machine (including every attempt to leave a terminal state)."
  - error_id: ERR_CLIENT_NOT_IN_SERVICE
    http_status: 409
    when: "A DISCHARGED Client is named by assessment creation, time-entry creation, invoice creation or invoice issue, or a SUSPENDED_NONPAYMENT or DISCHARGED Client is named by a ServiceAuthorization transition to AUTHORIZED."
  - error_id: ERR_ASSESSMENT_NOT_ACCEPTED
    http_status: 409
    when: "A care plan names a source assessment whose status is not ACCEPTED."
  - error_id: ERR_PINNED_ASSESSMENT_STALE
    http_status: 409
    when: "A care plan is advanced while its pinned_assessment_version no longer equals the source Assessment.version."
  - error_id: ERR_CARE_PLAN_NOT_ACTIVE
    http_status: 409
    when: "A service authorization is created against or advanced under a CarePlan whose status is not ACTIVE."
  - error_id: ERR_VENDOR_BARRED
    http_status: 422
    when: "A service authorization names a Vendor whose standing is BARRED, or an authorization of a BARRED vendor is advanced to AUTHORIZED or back to ACTIVE."
  - error_id: ERR_COI_NOT_ACKNOWLEDGED
    http_status: 422
    when: "A service authorization carrying a referral conflict of interest is advanced to AUTHORIZED or ACTIVE while its coi_status is not ACKNOWLEDGED."
  - error_id: ERR_COI_ACK_BY_INELIGIBLE_PARTY
    http_status: 422
    when: "A conflict-of-interest acknowledgement names a FamilyContact who is not a surrogate decision maker for the authorization's client, or who is the referring party."
  - error_id: ERR_CAPACITY_BASIS_REQUIRED
    http_status: 422
    when: "A conference decision is documented for a client whose capacity_status is DIMINISHED_DOCUMENTED or ADJUDICATED_INCAPACITATED without a capacity_basis."
  - error_id: ERR_SURROGATE_AUTHORITY_MISSING
    http_status: 422
    when: "The documented decision maker holds no surrogate authority (no health-care proxy, power of attorney or guardianship) adequate for the decision_type."
  - error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    when: "A conference is convened, or a decision is documented against a convened conference, while calculations.conference_quorum_evaluation reports quorum_met = false."
  - error_id: ERR_ESCALATION_PRECONDITION_UNMET
    http_status: 422
    when: "A decision is escalated to guardianship or protective services while the escalation preconditions of calculations.client_protective_escalation_status are not satisfied."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    when: "The acting X-User-ID would occupy two mutually exclusive positions on the same record: reviewing (ACCEPTED or REVISION_REQUESTED) an assessment whose care_manager_id equals that user, or approving/rejecting a time entry whose care_manager_id equals that user."
  - error_id: ERR_CRISIS_CONTEXT_REQUIRED
    http_status: 422
    when: "A time entry uses service_type CRISIS_RESPONSE without a crisis_episode_id, or names a crisis episode whose status is CLOSED or whose client differs from the entry's client."
  - error_id: ERR_ENTITY_RELATIONSHIP_INVALID
    http_status: 422
    when: "Two referenced records exist but do not belong to the same client, or a referenced record belongs to the wrong parent (for example an authorizing_decision_id from another client's conference, or an attending contact who was never invited)."
  - error_id: ERR_COVERAGE_CAPACITY_EXCEEDED
    http_status: 409
    when: "The concurrent_caregivers implied by overlapping AUTHORIZED or ACTIVE service authorizations would exceed Client.authorized_concurrent_caregivers."
  - error_id: ERR_TIME_ENTRY_OVERLAP
    http_status: 409
    when: "A time entry's half-open [start_at, end_at) interval overlaps another non-VOID, non-REJECTED entry by the same care manager."
  - error_id: ERR_TRAVEL_BUFFER_VIOLATION
    http_status: 409
    when: "Two consecutive non-overlapping entries by the same care manager at different service_location_id values are separated by fewer than TRAVEL_BUFFER_MINUTES."
  - error_id: ERR_INVOICE_PERIOD_OVERLAP
    http_status: 409
    when: "An invoice's [period_start, period_end] closed date range overlaps an existing DRAFT, ISSUED or PAID invoice for the same client."
  - error_id: ERR_DAILY_CAP_EXCEEDED
    http_status: 422
    when: "A time entry would push one care manager's total rounded_minutes for one service_date, aggregated across every client, above DAILY_BILLABLE_CAP_MINUTES."
  - error_id: ERR_NO_BILLABLE_ACTIVITY
    http_status: 422
    when: "An invoice is issued while its FINAL-variant line_entry_ids is empty."
  - error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    when: "A payment's amount_cents is greater than the invoice's balance_due_cents."
  - error_id: ERR_RETAINER_INSUFFICIENT
    http_status: 402
    when: "A ServiceAuthorization is advanced to AUTHORIZED while its client's retainer_balance_cents is below Client.retainer_floor_cents (validations priority 75)."

# ============================================================================
# 1.7 RBAC
# ============================================================================
roles:
  - role: CareManager
    identity: "entity_backed:CareManager"
    description: "Aging life care manager of record. Owns assessment authorship, plan drafting, vendor authorization proposals, conference facilitation, crisis response and time capture for the clients they are assigned to."
    exclusive_operations: ["POST /care/assessments", "PATCH /care/assessments/{assessmentId}", "POST /care/care-plans", "POST /care/service-authorizations", "POST /care/family-conferences", "PATCH /care/family-conferences/{conferenceId}/state", "POST /care/conference-decisions", "POST /care/crisis-episodes", "POST /care/time-entries", "POST /care/family-contacts/{contactId}/reports"]
    shared_operations: ["POST /care/family-contacts", "POST /care/clients/{clientId}/capacity-determination", "PATCH /care/assessments/{assessmentId}/state", "PATCH /care/care-plans/{carePlanId}/state", "PATCH /care/service-authorizations/{authorizationId}/state", "POST /care/service-authorizations/{authorizationId}/coi-events", "PATCH /care/crisis-episodes/{episodeId}/state", "PATCH /care/time-entries/{timeEntryId}/state", "all GET endpoints under /care"]
    forbidden_operations: ["PATCH /care/conference-decisions/{decisionId}/state", "POST /care/invoices", "PATCH /care/invoices/{invoiceId}/state", "POST /care/invoices/{invoiceId}/payments", "POST /care/clients", "POST /care/vendors", "PATCH /care/vendors/{vendorId}", "POST /_clock/set_current_utc"]
  - role: PracticeSupervisor
    identity: "entity_backed:CareManager"
    description: "Senior care manager holding is_supervisor = true. Adds the second-pair-of-eyes authority: accepting assessments, ratifying and escalating documented decisions, and approving other care managers' time. Cannot author the record it approves."
    exclusive_operations: ["PATCH /care/conference-decisions/{decisionId}/state"]
    shared_operations: ["PATCH /care/clients/{clientId}/state", "POST /care/clients/{clientId}/capacity-determination", "PATCH /care/assessments/{assessmentId}/state", "PATCH /care/care-plans/{carePlanId}/state", "PATCH /care/service-authorizations/{authorizationId}/state", "PATCH /care/crisis-episodes/{episodeId}/state", "PATCH /care/time-entries/{timeEntryId}/state", "all GET endpoints under /care"]
    forbidden_operations: ["POST /care/time-entries", "POST /care/conference-decisions", "POST /care/invoices", "PATCH /care/invoices/{invoiceId}/state", "POST /care/invoices/{invoiceId}/payments", "POST /care/clients", "POST /_clock/set_current_utc"]
  - role: FamilyDecisionMaker
    identity: "entity_backed:FamilyContact"
    description: "Family member or surrogate decision maker for exactly one client. May acknowledge conflict-of-interest disclosures and read that client's record; may never write clinical, authorization or billing state."
    exclusive_operations: []
    shared_operations: ["PATCH /care/care-plans/{carePlanId}/state (only the PENDING_FAMILY_APPROVAL -> ACTIVE and PENDING_FAMILY_APPROVAL -> REJECTED family-approval transitions)", "POST /care/service-authorizations/{authorizationId}/coi-events", "all GET endpoints under /care scoped to the contact's own client_id"]
    forbidden_operations: ["POST /care/assessments", "POST /care/care-plans", "POST /care/service-authorizations", "PATCH /care/service-authorizations/{authorizationId}/state", "POST /care/family-conferences", "POST /care/conference-decisions", "PATCH /care/conference-decisions/{decisionId}/state", "POST /care/crisis-episodes", "POST /care/time-entries", "POST /care/invoices", "POST /_clock/set_current_utc"]
  - role: BillingAdministrator
    identity: "opaque"
    description: "Private-pay billing operator. Owns the retainer ledger, invoice lifecycle and payment posting; holds no clinical authority whatsoever."
    exclusive_operations: ["POST /care/invoices", "PATCH /care/invoices/{invoiceId}/state", "POST /care/invoices/{invoiceId}/payments", "POST /care/clients/{clientId}/retainer-deposits"]
    shared_operations: ["all GET endpoints under /care"]
    forbidden_operations: ["POST /care/assessments", "PATCH /care/assessments/{assessmentId}/state", "POST /care/care-plans", "POST /care/service-authorizations", "POST /care/time-entries", "PATCH /care/time-entries/{timeEntryId}/state", "PATCH /care/conference-decisions/{decisionId}/state", "POST /_clock/set_current_utc"]
  - role: PracticeAdmin
    identity: "opaque"
    description: "Practice operations administrator. Onboards clients, care managers, vendors and family contacts, maintains vendor standing, and drives the logical clock. Holds no clinical, authorization or billing authority."
    exclusive_operations: ["POST /care/clients", "POST /care/care-managers", "POST /care/vendors", "PATCH /care/vendors/{vendorId}", "POST /_clock/set_current_utc"]
    shared_operations: ["PATCH /care/clients/{clientId}/state", "POST /care/family-contacts", "all GET endpoints under /care"]
