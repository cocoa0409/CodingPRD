  - rule_id: boundary_precision_check
    instances:
      - name: returns_rate_exactly_at_tier_2_threshold
        grounds:
          - calculations.returns_reserve_obligation
          - entities.PhysicalRun.fields.returns_rate
          - entities.PhysicalRun.fields.effective_reserve_pct
          - entities.PhysicalRun.fields.reserve_initial_cents
          - endpoints[POST /physical-runs/{id}/record-returns]
        distinguishing_aspect: |
          Metric = returns_rate against RETURNS_TIER_2_RATE, endpoint = record-returns. One returned unit
          separates the arms: 250/1000 is exactly 0.2500 and the tier test is >=, so it escalates to
          0.3500 and 315000 cents, while 249/1000 rounds to 0.2490, stays in tier 1 at 0.2500 and holds
