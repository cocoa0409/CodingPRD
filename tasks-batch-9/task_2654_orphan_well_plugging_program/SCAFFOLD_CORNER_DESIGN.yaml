              payload: { kind: "STATE_FUND", name: "Wyoming orphan well account", authorized_cents: 20000000, expires_at: "2027-12-31T00:00:00Z", allowable_cost_categories: ["PLUGGING"] }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_id: $.data.id }
            - call: "POST /plugging-jobs/${job_id}/funding-commitments"
              payload: {}
