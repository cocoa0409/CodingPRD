              payload: { full_name: "Stale A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "L Stale", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "95 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id }
            - call: "GET /amc/orders/${o_id}"
              payload: {}
              as: AMCCoordinator
              captures: { o_v_pre: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v_pre}" }
              as: AMCCoordinator
          trigger:
            - call: "POST /amc/orders/${o_id}/cancel"
              payload: { expected_order_version: "${o_v_pre}" }
              as: AMCCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/orders/${o_id}/cancel .error_id == ERR_STALE_ORDER_VERSION"
            - "POST /amc/orders/${o_id}/cancel HTTP 412"

  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: appraiser_cannot_place_order_unauthorized
        claim_type: cannot_perform_others_exclusive
        grounds:
          - roles
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "An Appraiser calling POST /amc/orders (a role not in that endpoint's roles) is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup:
            - "An appraiser exists, plus a lender + property to reference."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Rb A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "L Rb", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "90 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/orders .error_id == ERR_UNAUTHORIZED"
            - "POST /amc/orders HTTP 403"

      - name: compliance_reviewer_cannot_assign_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - roles
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "A ComplianceReviewer calling POST /amc/orders/{id}/assignments (coordinator-exclusive) is denied ERR_UNAUTHORIZED (403); reviewer is segregated from assignment."
        test_recipe:
          setup:
            - "Order placed and assignable."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Seg A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "L Seg", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "91 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
          trigger:
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: ComplianceReviewer
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/orders/${o_id}/assignments .error_id == ERR_UNAUTHORIZED"
            - "POST /amc/orders/${o_id}/assignments HTTP 403"

      - name: lender_air_firewall_blocks_compliance_finalize
        claim_type: cannot_perform_others_exclusive
        grounds:
          - validations[priority=2]
          - errors[ERR_AIR_FIREWALL_VIOLATION]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / firewall_safety_beats_referential_eligibility_on_assign
          rationale: "The AIR-firewall business_safety denial path is established by the §1.8 firewall priority-conflict instance on the assignments endpoint; the finalize variant is the same firewall rule."

  # =========================================================================
  # Section: cross_cutting
  # =========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_order_version_assignment_supersede
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-order]
          - errors[ERR_STALE_ORDER_VERSION]
          - state_machines.Order.ASSIGNED_to_ASSIGNED
        distinguishing_aspect: "After a successful reassign (Order.version advances), a second reassign still carrying the pre-advance expected_order_version is rejected ERR_STALE_ORDER_VERSION (412); two strictly sequential requests."
        test_recipe:
          setup:
            - "Order assigned to A1 (version advanced), A1 declines (order stays ASSIGNED); two more eligible appraisers A2,A3 on panel so reassignment can legitimately supersede twice."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Occ A1", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /amc/appraisers"
              payload: { full_name: "Occ A2", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a2_id: $.data.id }
            - call: "POST /amc/appraisers"
              payload: { full_name: "Occ A3", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a3_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "L Occ", approved_panel_appraiser_ids: ["${a1_id}", "${a2_id}", "${a3_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "100 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg1_id: $.data.id }
            - call: "GET /amc/orders/${o_id}"
              payload: {}
              as: AMCCoordinator
              captures: { o_v1: $.data.version }
            - call: "POST /amc/assignments/${asg1_id}/decline"
              payload: {}
              as: Appraiser
              as_user_id: "${a1_id}"
          trigger:
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v1}" }
              as: AMCCoordinator
              captures: { asg2_id: $.data.id }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v1}" }
              as: AMCCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/orders/${o_id}/assignments (second trigger) .error_id == ERR_STALE_ORDER_VERSION"
            - "POST /amc/orders/${o_id}/assignments (second trigger) HTTP 412"

      - name: order_version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Order.fields.version
          - state_machines.Order.PLACED_to_ASSIGNED
        distinguishing_aspect: "Order.version starts at 1 on placement and becomes 2 after a successful assignment-create (increments by exactly 1 per mutation)."
        test_recipe:
          setup:
            - "Order placed (version 1), one eligible appraiser."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Ver A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "L Ver", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "101 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
          trigger:
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
            - call: "GET /amc/orders/${o_id}"
              payload: {}
              as: AMCCoordinator
              captures: { v_after: $.data.version }
          assert:
            - "GET /amc/orders/${o_id} .version == 2"

      - name: rush_premium_threshold_present_only_when_rush_true
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.fee_split_computation
          - entities.Order.fields.rush
        excluded_because:
          difficulty_instance: combinatorial_formula / fee_split_rounding_order_pinned_per_component
          rationale: "The rush=true branch adding the 10% rush_premium to the appraiser share is verified by the §1.8 rounding-order instance (fee 80000 rush -> appraiser 52000 includes the 8000 premium)."

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: feesplit_recompute_visible_immediately_after_resolve
        claim_type: immediate
        grounds:
          - entities.FeeSplit.fields.appraiser_fee_cents
          - state_machines.ReconsiderationOfValue.UNDER_REVIEW_to_VALUE_CHANGED
        excluded_because:
          difficulty_instance: transitive_cascade / rov_value_change_cascades_order_value_then_feesplit_depth2
          rationale: "Immediate visibility of the cascaded FeeSplit recompute in the same workflow's subsequent read is asserted by the named §1.8 depth-2 cascade instance."
