  - method: POST
    path: "/rental-agreements"
    description: "Check out rental gear (creates an ACTIVE agreement)"
    roles: [ShopAdmin]
    code: 201
    input: [diver_id, item_description, daily_rate_cents, deposit_cents, scheduled_return_at]
    output: RentalAgreement
    side_effects:
      - "status=ACTIVE; checkout_at = clock; estimated_cost_cents computed (calculations.rental_charge variant=estimated)"
      - "CASCADE: Diver.deposit_on_hold_cents recomputed (debits deposit_cents)"
  - method: GET
    path: "/rental-agreements/{id}"
    description: "Get a rental agreement"
    roles: [ShopAdmin, Diver]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: []
  - method: GET
    path: "/rental-agreements"
    description: "List rental agreements, optionally filtered by diver"
    roles: [ShopAdmin, Diver]
    code: 200
    input: ["diver_id?", "limit?", "offset?"]
    output: RentalAgreement[]
    side_effects: []
  - method: POST
    path: "/rental-agreements/{id}/checkin"
    description: "Check in rental gear and settle"
    roles: [ShopAdmin]
    code: 200
    input: ["damage_fee_cents?"]
    output: RentalAgreement
    side_effects:
      - "status ACTIVE->RETURNED; actual_return_at=clock; actual_cost_cents, deposit_refund_cents computed"
      - "CASCADE: Diver.deposit_on_hold_cents recomputed (credits deposit back)"
  - method: POST
    path: "/rental-agreements/{id}/void"
    description: "Void a rental at checkout (compensating action, full deposit refund)"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: RentalAgreement
    side_effects:
      - "status ACTIVE->VOIDED; actual_cost_cents=0; deposit_refund_cents=deposit_cents"
      - "CASCADE: Diver.deposit_on_hold_cents recomputed, fully reversing the checkout debit"

  # --- FillService (Diver -> FillService FK reverse-reachability) ---
  - method: POST
    path: "/fill-services"
    description: "Fill a tank (air or nitrox)"
    roles: [ShopAdmin]
    code: 201
    input: [diver_id, gas, o2_pct, tank_capacity_liters]
    output: FillService
    side_effects:
      - "price_cents computed (calculations.fill_price)"
      - "Validates: NITROX requires Diver.nitrox_certified; o2_pct band"
  - method: GET
    path: "/fill-services/{id}"
    description: "Get a fill service"
    roles: [ShopAdmin, Diver]
    code: 200
    input: []
    output: FillService
    side_effects: []
  - method: GET
    path: "/fill-services"
    description: "List fill services, optionally filtered by diver"
    roles: [ShopAdmin, Diver]
    code: 200
    input: ["diver_id?", "limit?", "offset?"]
    output: FillService[]
    side_effects: []

  # --- GearServiceOrder (Diver -> GearServiceOrder FK reverse-reachability) ---
  - method: POST
    path: "/gear-service-orders"
    description: "Open a VIP or hydro gear service order"
    roles: [ShopAdmin]
    code: 201
    input: [diver_id, service_type]
    output: GearServiceOrder
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/gear-service-orders/{id}"
    description: "Get a gear service order"
    roles: [ShopAdmin, Diver]
    code: 200
    input: []
    output: GearServiceOrder
    side_effects: []
  - method: GET
    path: "/gear-service-orders"
    description: "List gear service orders, optionally filtered by diver"
    roles: [ShopAdmin, Diver]
    code: 200
    input: ["diver_id?", "limit?", "offset?"]
    output: GearServiceOrder[]
    side_effects: []
  - method: POST
    path: "/gear-service-orders/{id}/complete"
    description: "Complete a gear service order"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: GearServiceOrder
    side_effects: ["status OPEN->COMPLETED; serviced_at=clock; next_due_at computed (calculations.gear_service_due)"]
  - method: POST
    path: "/gear-service-orders/{id}/cancel"
    description: "Cancel a gear service order"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: GearServiceOrder
    side_effects: ["status OPEN->CANCELLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or entity_backed actor acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced path or body resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, out-of-range enum, or constraint violation (e.g. ends_at <= starts_at, elearning_pct outside 0..100, o2_pct band)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_WAIVER_REQUIRED, http: 422, condition: "Diver lacks an active Waiver or medical_status==RESTRICTED for an operation that requires medical clearance" }
  - { id: ERR_CERT_PREREQUISITE_NOT_MET, http: 422, condition: "Diver.cert_level below the trip's min_cert_level, or NITROX fill requested for a non-nitrox-certified diver" }
  - { id: ERR_INSTRUCTOR_CONFLICT, http: 409, condition: "Primary instructor not rated INSTRUCTOR, or already booked in a SCHEDULED session whose half-open window overlaps" }
  - { id: ERR_BOAT_CONFLICT, http: 409, condition: "Boat already has a non-CANCELLED trip whose buffer-expanded window overlaps the requested one" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Booking would push confirmed_seats above max_students, or confirmed_divers above boat capacity" }
  - { id: ERR_DUPLICATE_BOOKING, http: 409, condition: "A non-terminal SessionBooking already exists for (enrollment, session), or a non-CANCELLED TripBooking for (diver, trip)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Dive-shop operator. Manages courses, sessions, trips, boats, instructors, certification issuance, rentals, fills, and gear service. Operational identity not tied to a persisted entity."
    identity: opaque
    exclusive_operations:
      - "POST /instructors, POST /courses, POST /boats"
      - "POST /sessions, POST /sessions/{id}/cancel"
      - "POST /dive-trips, POST /dive-trips/{id}/depart, POST /dive-trips/{id}/cancel"
      - "POST /enrollments/{id}/recompute-eligibility, POST /enrollments/{id}/issue-certification"
      - "POST /rental-agreements, POST /rental-agreements/{id}/checkin, POST /rental-agreements/{id}/void"
      - "POST /fill-services"
      - "POST /gear-service-orders, POST /gear-service-orders/{id}/complete, POST /gear-service-orders/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /divers, POST /waivers, POST /enrollments, POST /enrollments/{id}/elearning-progress, POST /enrollments/{id}/withdraw"
      - "POST /session-bookings, POST /session-bookings/{id}/cancel"
      - "POST /trip-bookings, POST /trip-bookings/{id}/cancel"
      - "all GET reads"

  - name: Instructor
    description: "Teaching staff. Records attendance and completes sessions they lead. X-User-ID is an Instructor.id."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /sessions/{id}/complete (only for sessions where primary_instructor_id == X-User-ID)"
      - "POST /session-bookings/{id}/attend (only for bookings whose session's primary_instructor_id == X-User-ID)"
    shared_operations:
      - "GET /divers, GET /divers/{id}, GET /instructors/{id}, GET /courses/{id}, GET /enrollments, GET /enrollments/{id}, GET /sessions, GET /sessions/{id}, GET /session-bookings, GET /session-bookings/{id}, GET /waivers, GET /certification-cards, GET /boats/{id}, GET /dive-trips, GET /dive-trips/{id}"

  - name: Diver
    description: "Customer. Registers, signs waivers, enrolls, books session seats and trips, manages own bookings. X-User-ID is a Diver.id; may only act on own resources."
    identity: "entity_backed:Diver"
    exclusive_operations: []
    shared_operations:
      - "POST /divers (self-register)"
      - "POST /waivers (own), POST /enrollments (own), POST /enrollments/{id}/elearning-progress (own), POST /enrollments/{id}/withdraw (own)"
      - "POST /session-bookings (own enrollment), POST /session-bookings/{id}/cancel (own)"
      - "POST /trip-bookings (own), POST /trip-bookings/{id}/cancel (own)"
      - "GET reads of own divers/{id}, enrollments, session-bookings, trip-bookings, rental-agreements, fill-services, gear-service-orders, waivers, certification-cards, and public courses/sessions/dive-trips/boats"
