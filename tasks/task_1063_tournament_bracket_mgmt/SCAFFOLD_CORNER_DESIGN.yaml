scaffold_corner_design:
  # ---------------- Entities ----------------
  - section: entities
    instances:
      - name: create_tournament_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Tournament, endpoints]
        distinguishing_aspect: "POST /tournaments with all required fields returns 201, status DRAFT, version 1, and echoes name/format/prize_pool_cents."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "1 A", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /tournaments"
              payload: { name: "Cup", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 8, prize_pool_cents: 5000, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
          assert:
            - "Response status 201; data.status == DRAFT; data.version == 1; data.format == SINGLE_ELIM; data.prize_pool_cents == 5000."
            - "data.seeding_method == RATING (default) and data.paid_places == 2 (default)."

      - name: get_tournament_not_found
        claim_type: Not Found
        grounds: [entities.Tournament, endpoints]
        distinguishing_aspect: "GET /tournaments/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /tournaments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Public
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404."

      - name: create_tournament_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Tournament, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /tournaments omitting the required check_in_deadline is rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "2 A", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /tournaments"
              payload: { name: "Cup", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 8, prize_pool_cents: 5000 }
              as: Director
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 422."

      - name: create_player_applies_default_rating
        claim_type: Defaults
        grounds: [entities.Player.fields.rating, entities.Player.fields.tax_id_provided]
        distinguishing_aspect: "POST /players omitting rating and tax_id_provided applies defaults rating==1000 and tax_id_provided==false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /players"
              payload: { display_name: "P", email: "px@x.com" }
              as: Public
              captures: { p_id: $.data.id }
          assert:
            - "data.rating == 1000 and data.tax_id_provided == false."

      - name: tournament_counters_are_computed
        claim_type: Computed Fields
        grounds: [entities.Tournament.fields.registered_count, entities.Tournament.fields.checked_in_count]
        distinguishing_aspect: "registered_count reflects REGISTERED/CHECKED_IN registrations regardless of any client-supplied value; two registrations yield registered_count==2."
        test_recipe:
          setup: ["Tournament REGISTRATION_OPEN with two players registered."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "3 A", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P1", email: "p1o@x.com" }
              as: Public
              captures: { p1: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P2", email: "p2o@x.com" }
              as: Public
              captures: { p2: $.data.id }
            - call: "POST /tournaments"
              payload: { name: "Cnt", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 8, prize_pool_cents: 0, paid_places: 1, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
            - call: "POST /tournaments/${t_id}/open-registration"
              payload: {}
              as: Director
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p1}" }
              as: Player
              as_user_id: "${p1}"
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p2}" }
              as: Player
              as_user_id: "${p2}"
          trigger:
            - call: "GET /tournaments/${t_id}"
              payload: {}
              as: Public
          assert:
            - "data.registered_count == 2 and data.checked_in_count == 0."

  # ---------------- State machines ----------------
  - section: state_machines
    instances:
      - name: start_before_bracket_ready_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Tournament.BRACKET_READY_to_IN_PROGRESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /tournaments/{id}/start while status is DRAFT (not BRACKET_READY) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT tournament exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "4 A", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /tournaments"
              payload: { name: "D", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 4, prize_pool_cents: 0, paid_places: 1, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /tournaments/${t_id}/start"
              payload: {}
              as: Director
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409; data (on a follow-up GET) status remains DRAFT."

      - name: confirm_from_pending_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Match.REPORTED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a match that is still PENDING (never scheduled/reported) is rejected with ERR_INVALID_STATE; the OCC/SoD checks are not reached."
        test_recipe:
          setup: ["2-player SINGLE_ELIM IN_PROGRESS with a PENDING final."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "5 A", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P1", email: "p1p@x.com", rating: 1500 }
              as: Public
              captures: { p1: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P2", email: "p2p@x.com", rating: 1200 }
              as: Public
              captures: { p2: $.data.id }
            - call: "POST /tournaments"
              payload: { name: "Pend", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 4, prize_pool_cents: 0, paid_places: 1, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
            - call: "POST /tournaments/${t_id}/open-registration"
              payload: {}
              as: Director
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p1}" }
              as: Player
              as_user_id: "${p1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p2}" }
              as: Player
              as_user_id: "${p2}"
              captures: { r2: $.data.id }
            - call: "POST /tournaments/${t_id}/close-registration"
              payload: {}
              as: Director
            - call: "POST /registrations/${r1}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p1}"
            - call: "POST /registrations/${r2}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p2}"
            - call: "POST /tournaments/${t_id}/generate-bracket"
              payload: {}
              as: Director
            - call: "POST /tournaments/${t_id}/start"
              payload: {}
              as: Director
            - call: "GET /tournaments/${t_id}/matches"
              payload: {}
              as: Public
              captures: { m_id: "$.data[0].id", m_ver: "$.data[0].version" }
          trigger:
            - call: "POST /matches/${m_id}/confirm"
              payload: { expected_match_version: "${m_ver}" }
              as: Referee
              as_user_id: "ref-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409; match stays PENDING."

      - name: checkin_already_checked_in_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Registration.REGISTERED_to_CHECKED_IN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second check-in on an already CHECKED_IN registration is rejected with ERR_INVALID_STATE (not idempotently re-accepted)."
        test_recipe:
          setup: ["Tournament REGISTRATION_CLOSED; one registration already CHECKED_IN."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "6 A", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P1", email: "p1q@x.com" }
              as: Public
              captures: { p1: $.data.id }
            - call: "POST /tournaments"
              payload: { name: "Chk", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 4, prize_pool_cents: 0, paid_places: 1, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
            - call: "POST /tournaments/${t_id}/open-registration"
              payload: {}
              as: Director
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p1}" }
              as: Player
              as_user_id: "${p1}"
              captures: { r1: $.data.id }
            - call: "POST /tournaments/${t_id}/close-registration"
              payload: {}
              as: Director
            - call: "POST /registrations/${r1}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p1}"
          trigger:
            - call: "POST /registrations/${r1}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409; checked_in_count remains 1."

  # ---------------- Calculations ----------------
  - section: calculations
    instances:
      - name: seeding_by_rating_descending
        claim_type: Correct Result
        grounds: [calculations.seeding_assignment, entities.Registration.fields.seed]
        distinguishing_aspect: "With seeding_method RATING, the highest-rated checked-in registration gets seed 1; created_at breaks equal ratings; id is never used."
        test_recipe:
          setup: ["2-player SINGLE_ELIM: P_hi rating 1600, P_lo rating 900; both checked in; bracket generated."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "7 A", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /players"
              payload: { display_name: "Hi", email: "hi@x.com", rating: 1600 }
              as: Public
              captures: { phi: $.data.id }
            - call: "POST /players"
              payload: { display_name: "Lo", email: "lo@x.com", rating: 900 }
              as: Public
              captures: { plo: $.data.id }
            - call: "POST /tournaments"
              payload: { name: "Seed", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 4, seeding_method: "RATING", prize_pool_cents: 0, paid_places: 1, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
            - call: "POST /tournaments/${t_id}/open-registration"
              payload: {}
              as: Director
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${phi}" }
              as: Player
              as_user_id: "${phi}"
              captures: { rhi: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${plo}" }
              as: Player
              as_user_id: "${plo}"
              captures: { rlo: $.data.id }
            - call: "POST /tournaments/${t_id}/close-registration"
              payload: {}
              as: Director
            - call: "POST /registrations/${rhi}/check-in"
              payload: {}
              as: Player
              as_user_id: "${phi}"
            - call: "POST /registrations/${rlo}/check-in"
              payload: {}
              as: Player
              as_user_id: "${plo}"
            - call: "POST /tournaments/${t_id}/generate-bracket"
              payload: {}
              as: Director
          trigger:
            - call: "GET /registrations/${rhi}"
              payload: {}
              as: Public
          assert:
            - "Registration.${rhi}.seed == 1 and Registration.${rlo}.seed == 2."

      - name: provisional_payout_created_at_bracket_ready
        claim_type: Variant Selection
        grounds: [calculations.payout_allocation, entities.Payout.fields.variant]
        excluded_because:
          difficulty_instance: payout_provisional_vs_final_registration_mapping
          rationale: "The PROVISIONAL payout creation and its seed-based registration mapping are asserted by the named §1.8 dual-variant instance."

  # ---------------- Validations ----------------
  - section: validations
    instances:
      - name: duplicate_registration_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=18]", "errors[ERR_DUPLICATE_REGISTRATION]"]
        distinguishing_aspect: "A player registering twice (non-terminal) in the same tournament is rejected with ERR_DUPLICATE_REGISTRATION."
        test_recipe:
          setup: ["Tournament REGISTRATION_OPEN; player P1 already registered."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "8 A", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P1", email: "p1r@x.com" }
              as: Public
              captures: { p1: $.data.id }
            - call: "POST /tournaments"
              payload: { name: "Dup", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 8, prize_pool_cents: 0, paid_places: 1, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
            - call: "POST /tournaments/${t_id}/open-registration"
              payload: {}
              as: Director
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p1}" }
              as: Player
              as_user_id: "${p1}"
          trigger:
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p1}" }
              as: Player
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_REGISTRATION, HTTP 409."

      - name: report_tie_score_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=11]", "errors[ERR_TIE_NOT_ALLOWED]"]
        distinguishing_aspect: "Reporting equal scores (home_score == away_score) is rejected with ERR_TIE_NOT_ALLOWED (422)."
        test_recipe:
          setup: ["2-player SINGLE_ELIM IN_PROGRESS; final SCHEDULED."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "9 A", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /venues/${v_id}/stations"
              payload: { label: "T1" }
              as: Director
              captures: { st_id: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P1", email: "p1s@x.com", rating: 1500 }
              as: Public
              captures: { p1: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P2", email: "p2s@x.com", rating: 1200 }
              as: Public
              captures: { p2: $.data.id }
            - call: "POST /tournaments"
              payload: { name: "Tie", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 4, prize_pool_cents: 0, paid_places: 1, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
            - call: "POST /tournaments/${t_id}/open-registration"
              payload: {}
              as: Director
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p1}" }
              as: Player
              as_user_id: "${p1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p2}" }
              as: Player
              as_user_id: "${p2}"
              captures: { r2: $.data.id }
            - call: "POST /tournaments/${t_id}/close-registration"
              payload: {}
              as: Director
            - call: "POST /registrations/${r1}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p1}"
            - call: "POST /registrations/${r2}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p2}"
            - call: "POST /tournaments/${t_id}/generate-bracket"
              payload: {}
              as: Director
            - call: "POST /tournaments/${t_id}/start"
              payload: {}
              as: Director
            - call: "GET /tournaments/${t_id}/matches"
              payload: {}
              as: Public
              captures: { m_id: "$.data[0].id" }
            - call: "POST /matches/${m_id}/schedule"
              payload: { station_id: "${st_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-01T11:00:00Z" }
              as: Referee
          trigger:
            - call: "POST /matches/${m_id}/report"
              payload: { home_score: 1, away_score: 1 }
              as: Player
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TIE_NOT_ALLOWED, HTTP 422; match stays SCHEDULED."

      - name: complete_with_incomplete_matches_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=20]", "errors[ERR_MATCHES_INCOMPLETE]", state_machines.Tournament.IN_PROGRESS_to_COMPLETED]
        distinguishing_aspect: "Completing while a match is still SCHEDULED (non-terminal) is rejected with ERR_MATCHES_INCOMPLETE — cross-entity Tournament->Match gate distinct from the §1.8 pairs."
        test_recipe:
          setup: ["2-player SINGLE_ELIM IN_PROGRESS; final SCHEDULED (not confirmed)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "10 A", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /venues/${v_id}/stations"
              payload: { label: "T1" }
              as: Director
              captures: { st_id: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P1", email: "p1t@x.com", rating: 1500 }
              as: Public
              captures: { p1: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P2", email: "p2t@x.com", rating: 1200 }
              as: Public
              captures: { p2: $.data.id }
            - call: "POST /tournaments"
              payload: { name: "Inc", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 4, prize_pool_cents: 0, paid_places: 1, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
            - call: "POST /tournaments/${t_id}/open-registration"
              payload: {}
              as: Director
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p1}" }
              as: Player
              as_user_id: "${p1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p2}" }
              as: Player
              as_user_id: "${p2}"
              captures: { r2: $.data.id }
            - call: "POST /tournaments/${t_id}/close-registration"
              payload: {}
              as: Director
            - call: "POST /registrations/${r1}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p1}"
            - call: "POST /registrations/${r2}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p2}"
            - call: "POST /tournaments/${t_id}/generate-bracket"
              payload: {}
              as: Director
            - call: "POST /tournaments/${t_id}/start"
              payload: {}
              as: Director
            - call: "GET /tournaments/${t_id}/matches"
              payload: {}
              as: Public
              captures: { m_id: "$.data[0].id" }
            - call: "POST /matches/${m_id}/schedule"
              payload: { station_id: "${st_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-01T11:00:00Z" }
              as: Referee
            - call: "GET /tournaments/${t_id}"
              payload: {}
              as: Director
              captures: { t_ver: $.data.version }
          trigger:
            - call: "POST /tournaments/${t_id}/complete"
              payload: { expected_tournament_version: "${t_ver}" }
              as: Director
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MATCHES_INCOMPLETE, HTTP 409; tournament stays IN_PROGRESS."

      - name: second_open_dispute_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=21]", "errors[ERR_DISPUTE_ALREADY_OPEN]"]
        distinguishing_aspect: "Raising a second dispute on a match that already has an OPEN dispute is rejected with ERR_DISPUTE_ALREADY_OPEN."
        test_recipe:
          setup: ["2-player SINGLE_ELIM IN_PROGRESS; final REPORTED; one OPEN dispute already exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "11 A", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /venues/${v_id}/stations"
              payload: { label: "T1" }
              as: Director
              captures: { st_id: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P1", email: "p1u@x.com", rating: 1500 }
              as: Public
              captures: { p1: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P2", email: "p2u@x.com", rating: 1200 }
              as: Public
              captures: { p2: $.data.id }
            - call: "POST /tournaments"
              payload: { name: "Dis", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 4, prize_pool_cents: 0, paid_places: 1, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
            - call: "POST /tournaments/${t_id}/open-registration"
              payload: {}
              as: Director
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p1}" }
              as: Player
              as_user_id: "${p1}"
