              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/subscribers/${sub2_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-Q11" }
