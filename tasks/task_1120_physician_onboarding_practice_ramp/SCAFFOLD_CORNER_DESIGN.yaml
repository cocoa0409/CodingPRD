            - "After all five check-ins: complete succeeds, status == COMPLETED and checkins_recorded == 5"

  - section: calculations
    instances:
      - name: critical_path_eta_boundary_date
        claim_type: correct_result
        grounds: ["calculations.credential_critical_path", "errors[ERR_START_DATE_BEFORE_CREDENTIAL_ETA]", "errors[ERR_OFFER_NOT_ACCEPTED]"]
        distinguishing_aspect: "The chain license(90) -> DEA(45) -> commercial payer(75) yields critical_path 210; earliest start = 2026-05-01 + 210 + 14 = 2026-12-11. An offer proposing 2026-12-10 fails at execute; one proposing exactly 2026-12-11 executes (>= boundary inclusive)."
        test_recipe:
          setup:
            - "Physician + case; credential items STATE_LICENSE, DEA_REGISTRATION (depends on license), PAYER_ENROLLMENT_COMMERCIAL (depends on DEA) all PENDING at clock default 2026-05-01"
            - "Offer A ACCEPTED with proposed_start_date 2026-12-10"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Pia", specialty: "FAMILY_MEDICINE", email: "pia@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2026-12-10", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_a: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_a}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_a}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/credential-items", payload: { onboarding_case_id: "${case_id}", item_type: "STATE_LICENSE", expires_on: "2028-06-01", document_ref: "doc-lic" }, as: CredentialingSpecialist, captures: { lic: "$.data.id" } }
            - { call: "POST /onboarding/credential-items", payload: { onboarding_case_id: "${case_id}", item_type: "DEA_REGISTRATION", expires_on: "2028-06-01", depends_on_item_ids: ["${lic}"], document_ref: "doc-dea" }, as: CredentialingSpecialist, captures: { dea: "$.data.id" } }
            - { call: "POST /onboarding/credential-items", payload: { onboarding_case_id: "${case_id}", item_type: "PAYER_ENROLLMENT_COMMERCIAL", payer_code: "AETNA", depends_on_item_ids: ["${dea}"], document_ref: "doc-aet" }, as: CredentialingSpecialist, captures: { pcom: "$.data.id" } }
          trigger:
            - { call: "POST /onboarding/offers/${offer_a}/execute", payload: {}, as: ContractAdministrator, captures: { err: "$.data.error_id" } }
            - { call: "POST /onboarding/offers/${offer_a}/withdraw", payload: {}, as: Recruiter }
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: Recruiter, captures: { v_now: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${v_now}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2026-12-11", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_b: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_b}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_b}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/offers/${offer_b}/execute", payload: {}, as: ContractAdministrator, captures: { st: "$.data.status" } }
          assert:
            - "Offer A execute rejected with error_id == ERR_START_DATE_BEFORE_CREDENTIAL_ETA (HTTP 422): 2026-12-10 is one day before the earliest legal start"
            - "Offer A remains ACCEPTED after the failed execute (no transition on rejection), then WITHDRAWN"
            - "Offer B proposing exactly 2026-12-11 (critical path 210 + buffer 14 from 2026-05-01) executes: status == EXECUTED"
            - "OnboardingCase.${case_id}.actual_start_date == 2026-12-11"

      - name: weekly_minutes_exclude_admin_blocks
        claim_type: input_set_filtering
        grounds: ["calculations.weekly_capacity_minutes", "entities.OnboardingCase.fields.weekly_active_minutes"]
        distinguishing_aspect: "The aggregation includes only ACTIVE templates with block_type in {CLINIC, PROCEDURE, OR}: an ACTIVE 600-minute ADMIN block contributes 0 to weekly_active_minutes and does not move practice_status out of BUILDING."
        test_recipe:
          setup: ["Physician (FAMILY_MEDICINE, requirement 1200) + case; one ACTIVE CLINIC template [480,960) weekday 1; one ACTIVE ADMIN template [480,1080) weekday 2"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Ree", specialty: "FAMILY_MEDICINE", email: "ree@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
