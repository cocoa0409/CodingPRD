  - rule_id: compensating_invariant
    instances:
      - name: invariant_e1_emission_reservation_released_by_abort_and_by_completion
        grounds:
          - calculations.formation_energy_charge
          - state_machines.FormationRun.run_state.CHARGING_to_COMPLETED
          - state_machines.FormationRun.run_state.CHARGING_to_ABORTED
          - endpoints[GET /plants/{id}/emission-ledger]
        distinguishing_aspect: |
          Conserved quantity: the plant's lead-emission ledger (reserved grams versus
          consumed grams against a fixed monthly allowance). Every reservation is
          compensated by exactly one of two opposite paths - completion converts the
          reservation into consumption, abort erases it with nothing booked - and both
          paths must leave emission_reserved_g at 0.00 with no orphaned grams. The abort
          also proves the provisional money is NOT conserved into the plant charge total.
