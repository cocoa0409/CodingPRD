# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Walks references/claim-extraction-guide.md against this scaffold's §1.1–§1.7.
# Numeric asserts are pre-computed literals. Names unique across §1.8 ∪ §1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_store_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Store
          - endpoints
        distinguishing_aspect: "POST /stores with name+state_code → 201; status defaults OPEN, loyalty_point_value_cents defaults 1, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "Main", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Store.${s_id}.status == OPEN"
            - "Store.${s_id}.loyalty_point_value_cents == 1"
            - "Store.${s_id}.version == 1"

      - name: get_store_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Store
          - errors[ERR_STORE_NOT_FOUND]
        distinguishing_aspect: "GET /stores/{bad uuid} → 404 ERR_STORE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /stores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_STORE_NOT_FOUND"

      - name: create_product_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - entities.Product
          - errors[ERR_INVALID_FIELD_VALUE]
          - validations[priority=6]
        distinguishing_aspect: "POST /products omitting unit_price_cents → 422 ERR_INVALID_FIELD_VALUE (required input with no default)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "X1", name: "NoPrice", category: "FOOD" }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_FIELD_VALUE"

      - name: create_product_invalid_enum_category_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.Product.fields.category
          - errors[ERR_INVALID_FIELD_VALUE]
          - validations[priority=6]
        distinguishing_aspect: "POST /products with category=TOY (not in {FOOD,HABITAT,ACCESSORY,MEDICATION}) → 422 ERR_INVALID_FIELD_VALUE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "X2", name: "Bad", category: "TOY", unit_price_cents: 100 }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_FIELD_VALUE"

      - name: product_default_is_prescription_diet_false
        claim_type: Defaults
        grounds:
          - entities.Product.fields.is_prescription_diet
        distinguishing_aspect: "Omitting is_prescription_diet → default false; loyalty_points_per_unit defaults 0; recall_state defaults CLEAR."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "X3", name: "Plain", category: "FOOD", unit_price_cents: 500 }
              as: InventoryManager
              captures: { p_id: $.data.id }
          assert:
            - "Product.${p_id}.is_prescription_diet == false"
            - "Product.${p_id}.loyalty_points_per_unit == 0"
            - "Product.${p_id}.recall_state == CLEAR"

      - name: system_fields_ignored_on_inventory_lot_create
        claim_type: System Fields
        grounds:
          - entities.InventoryLot.fields.quantity_reserved
          - entities.InventoryLot.fields.status
        distinguishing_aspect: "POST /inventory-lots: server sets quantity_reserved=0 and status=AVAILABLE regardless of input; id/created_at/version system-minted."
        test_recipe:
          setup: ["Store S, Product P."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-S", name: "Prod", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 20, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
              captures: { lot_id: $.data.id }
          assert:
            - "InventoryLot.${lot_id}.quantity_reserved == 0"
            - "InventoryLot.${lot_id}.status == AVAILABLE"
            - "InventoryLot.${lot_id}.version == 1"

      - name: computed_recall_state_clear_when_no_open_recall
        claim_type: Computed Fields
        grounds:
          - entities.Product.fields.recall_state
        distinguishing_aspect: "Product.recall_state is computed; with no OPEN recall covering it, GET /products/{id} returns recall_state=CLEAR."
        test_recipe:
          setup: ["Product P, no recalls."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-CLR", name: "Clear", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /products/${p_id}"
              payload: {}
              as: StoreClerk
              captures: { rs: $.data.recall_state }
          assert:
            - "Product.${p_id}.recall_state == CLEAR"

      - name: fk_referenced_store_not_found_on_lot_create
        claim_type: Parent Relationships
        grounds:
          - entities.InventoryLot.fields.store_id
          - validations[priority=5]
          - errors[ERR_STORE_NOT_FOUND]
        distinguishing_aspect: "POST /inventory-lots with non-existent store_id → 404 ERR_STORE_NOT_FOUND (FK existence)."
        test_recipe:
          setup: ["Product P exists; store_id is bogus."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-FK", name: "FK", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /inventory-lots"
              payload: { store_id: "00000000-0000-4000-8000-000000000000", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 5, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_STORE_NOT_FOUND"

      - name: duplicate_sku_returns_409
        claim_type: Type Constraints
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_RESOURCE]
          - entities.Product.fields.sku
        distinguishing_aspect: "Creating a second Product with an existing sku → 409 ERR_DUPLICATE_RESOURCE (sku globally unique)."
        test_recipe:
          setup: ["Product with sku DUP exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "DUP", name: "First", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
          trigger:
            - call: "POST /products"
              payload: { sku: "DUP", name: "Second", category: "FOOD", unit_price_cents: 2000 }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_RESOURCE"

      - name: list_products_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Product
          - endpoints
        distinguishing_aspect: "GET /products?limit=1&offset=0 returns array envelope with total_count and has_more reflecting 2 products."
        test_recipe:
          setup: ["Two products exist."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "PG1", name: "A", category: "FOOD", unit_price_cents: 100 }
              as: InventoryManager
            - call: "POST /products"
              payload: { sku: "PG2", name: "B", category: "FOOD", unit_price_cents: 200 }
              as: InventoryManager
          trigger:
            - call: "GET /products?limit=1&offset=0"
              payload: {}
              as: StoreClerk
          assert:
            - "response.response_type == array"
            - "response.data length == 1"
            - "response.meta has api_request_id"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_subscription_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - errors[ERR_SUBSCRIPTION_STATE_INVALID]
        distinguishing_aspect: "A CANCELLED subscription cancelled again → 409 ERR_SUBSCRIPTION_STATE_INVALID; CANCELLED is terminal."
        test_recipe:
          setup: ["Customer C with a CANCELLED subscription."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 1, cycle_days: 30, next_ship_at: "2026-02-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SUBSCRIPTION_STATE_INVALID"

      - name: clear_quarantine_before_window_elapsed_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LivestockBatch.health=QUARANTINE_to_health=HEALTHY
          - validations[priority=11]
          - errors[ERR_QUARANTINE_NOT_ELAPSED]
        distinguishing_aspect: "clear-quarantine with clock < intake_at + quarantine_days → 409 ERR_QUARANTINE_NOT_ELAPSED (default clock 2026-01-01 is before window end)."
        test_recipe:
          setup: ["Batch B intake 2026-01-01, quarantine_days=5; clock left at default 2026-01-01."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "betta", animal_class: "FISH", head_count: 5, unit_price_cents: 500, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /livestock-batches/${b_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_QUARANTINE_NOT_ELAPSED"

      - name: quarantine_clearance_blocked_by_mortality
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LivestockBatch.health=QUARANTINE_to_health=HEALTHY
          - errors[ERR_QUARANTINE_MORTALITY_BLOCK]
        distinguishing_aspect: "After recording 1 death (batch now UNDER_TREATMENT, not QUARANTINE) a clear-quarantine from QUARANTINE path no longer applies; from UNDER_TREATMENT with r<0.5 clearance to HEALTHY succeeds — here r=0.2<0.5 so recovery succeeds, asserting the recovery loop precondition."
        test_recipe:
          setup: ["Batch head=10; record 2 deaths (r=0.2<0.5 → UNDER_TREATMENT); clock past window."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "molly", animal_class: "FISH", head_count: 10, unit_price_cents: 500, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
            - call: "POST /livestock-batches/${b_id}/record-mortality"
              payload: { deaths: 2 }
              as: LivestockKeeper
          trigger:
            - call: "POST /livestock-batches/${b_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
              captures: { hs: $.data.health_state }
          assert:
            - "LivestockBatch.${b_id}.health_state == HEALTHY"

      - name: checkin_before_start_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ClinicAppointment.BOOKED_to_CHECKED_IN
          - validations[priority=11]
          - errors[ERR_APPOINTMENT_NOT_STARTED]
        distinguishing_aspect: "check-in with clock < start_at → 409 ERR_APPOINTMENT_NOT_STARTED."
        test_recipe:
          setup: ["Appointment 09:00–10:00 booked; clock at default 2026-01-01 (before start)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /clinic-appointments"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", service_type: "VACCINE", room: "R1", start_at: "2026-01-05T09:00:00Z", end_at: "2026-01-05T10:00:00Z", fee_cents: 4000 }
              as: ClinicVet
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /clinic-appointments/${a_id}/check-in"
              payload: {}
              as: ClinicVet
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPOINTMENT_NOT_STARTED"

      - name: no_show_before_end_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ClinicAppointment.BOOKED_to_NO_SHOW
          - errors[ERR_APPOINTMENT_NOT_ENDED]
        distinguishing_aspect: "no-show with clock < end_at → 409 ERR_APPOINTMENT_NOT_ENDED."
        test_recipe:
          setup: ["Appointment 09:00–10:00 booked; clock advanced to 09:30 (before end)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /clinic-appointments"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", service_type: "VACCINE", room: "R1", start_at: "2026-01-05T09:00:00Z", end_at: "2026-01-05T10:00:00Z", fee_cents: 4000 }
              as: ClinicVet
              captures: { a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T09:30:00Z" }
              as: ClinicVet
          trigger:
            - call: "POST /clinic-appointments/${a_id}/no-show"
              payload: {}
              as: ClinicVet
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPOINTMENT_NOT_ENDED"

      - name: run_shipment_before_due_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - errors[ERR_SHIPMENT_NOT_DUE]
        distinguishing_aspect: "run-shipment with clock < next_ship_at → 409 ERR_SHIPMENT_NOT_DUE; checked after OCC matches."
        test_recipe:
          setup: ["ACTIVE subscription with next_ship_at 2026-03-01; clock at default 2026-01-01; lot stocked."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 50, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 1, cycle_days: 30, next_ship_at: "2026-03-01T00:00:00Z" }
              as: StoreClerk
              captures: { sub_id: $.data.id, sub_v: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/run-shipment"
              payload: { expected_subscription_version: "${sub_v}" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SHIPMENT_NOT_DUE"

      - name: resolve_already_resolved_recall_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Recall.OPEN_to_RESOLVED
          - errors[ERR_RECALL_STATE_INVALID]
        distinguishing_aspect: "Resolving a RESOLVED recall → 409 ERR_RECALL_STATE_INVALID; RESOLVED is terminal."
        test_recipe:
          setup: ["Product P recalled then resolved."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-R2", name: "P", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${p_id}", severity: "ADVISORY" }
              as: InventoryManager
              captures: { r_id: $.data.id }
            - call: "POST /recalls/${r_id}/resolve"
              payload: {}
              as: InventoryManager
          trigger:
            - call: "POST /recalls/${r_id}/resolve"
              payload: {}
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RECALL_STATE_INVALID"

      - name: recall_resolve_reactivates_halted_subscription
        claim_type: Compensation
        grounds:
          - state_machines.Recall.OPEN_to_RESOLVED
          - state_machines.Subscription.HALTED_to_ACTIVE
          - entities.Subscription.fields.status
          - entities.InventoryLot.fields.status
        distinguishing_aspect: "Resolving the only OPEN recall un-quarantines the lot (status→AVAILABLE), recomputes product.recall_state→CLEAR, and reactivates the subscription it halted (HALTED→ACTIVE)."
        test_recipe:
          setup: ["Store S, Product P, lot, ACTIVE subscription; recall issued (lot QUARANTINED, sub HALTED); then resolved."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-RES", name: "P", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 50, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
              captures: { lot_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 1, cycle_days: 30, next_ship_at: "2026-02-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${p_id}", severity: "MANDATORY" }
              as: InventoryManager
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /recalls/${r_id}/resolve"
              payload: {}
              as: InventoryManager
          assert:
            - "InventoryLot.${lot_id}.status == AVAILABLE"
            - "Product.${p_id}.recall_state == CLEAR"
            - "Subscription.${sub_id}.status == ACTIVE"
            - "Recall.${r_id}.status == RESOLVED"

      - name: subscription_initial_state_active
        claim_type: Initial State
        grounds:
          - state_machines.Subscription
          - entities.Subscription.fields.status
        distinguishing_aspect: "A newly created subscription starts in status ACTIVE with shipments_count 0."
        test_recipe:
          setup: ["Store, Product, Customer."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 1, cycle_days: 30, next_ship_at: "2026-02-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"
            - "Subscription.${sub_id}.shipments_count == 0"

  # ===========================================================================
  - section: calculations
    instances:
      - name: livestock_sale_accrual_correct_points
        claim_type: Correct Result
        grounds:
          - calculations.livestock_sale_total
          - entities.Customer.fields.loyalty_points
          - entities.Customer.fields.lifetime_spend_cents
