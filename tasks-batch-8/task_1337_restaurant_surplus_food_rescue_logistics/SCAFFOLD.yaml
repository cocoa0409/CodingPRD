# =============================================================================
# SCAFFOLD.yaml — Restaurant Surplus Food Rescue Logistics
# Generated per prd-bench-scaffold-generator SKILL.md (§1.0–§1.7 only;
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  Restaurant Surplus Food Rescue Logistics (food rescue nonprofit): donor site
  onboarding & pickup window, volunteer driver assignment & route matching,
  food safety (temperature/time) protocol & liability protection documentation,
  recipient agency capacity & matching by food type, weight/impact tracking per
  rescue, no-show/failed pickup handling, cold-chain equipment (coolers)
  inventory, donor tax substantiation & reporting

domain_name: restaurant-surplus-food-rescue
api_prefix: /api

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite pools: agency capacity (lbs), vehicle capacity, cooler liters, driver windows — reserved, committed, released
  secondary_archetype: temporal_windowing    # pickup windows, availability windows, cooler blocked intervals, rate-card effective windows
  complexity_layers:
    - optimistic_concurrency                 # OCC on DonationOffer.version (dispatch) and DonorSite.version (tax receipt issue/supersede)
    - cascading_side_effects                 # strike adjudication -> score -> suspension -> run teardown -> offer reversion -> cooler release
    - dual_variant_calculation               # standard vs enhanced tax valuation; estimated vs verified weight; provisional vs final safety verdict
    - selector_policy                        # server-side driver / agency / cooler matching with eligibility, ranking, tie-break, empty-pool fallback
  entity_topology: flat                      # peer entities joined by FK references; no nested creation paths
  state_machine_shape: cyclic                # offer re-offer loop, cooler checkout cycle, driver suspend/reinstate loop; RescueRun carries parallel dims
  relationship_patterns: [one_to_many, cross_aggregate, polymorphic]   # StrikeReport.subject_id is polymorphic (DonorSite | VolunteerDriver)
  role_model: segregation_of_duties          # strike adjudicator must differ from reporter; entity-backed peer ownership elsewhere
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: DonorSite
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Restaurant legal name" }
      - { name: ein, type: string, source: input, description: "9-digit IRS employer identification number used for tax substantiation" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: enhanced_deduction_eligible, type: boolean, source: input, default: false, description: "When true, tax receipts use the enhanced-deduction variant of tax_substantiation_value" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | ACTIVE | SUSPENDED | DEACTIVATED; initial PENDING_REVIEW" }
      - { name: strike_count, type: integer, source: computed, default: 0, description: "Count of StrikeReports with subject=this donor and status=UPHELD; reset to 0 on reinstatement" }
      - { name: lifetime_weight_lbs, type: integer, source: computed, default: 0, description: "Sum of RescueRun.actual_weight_lbs over VERIFIED runs whose offer belongs to this donor" }
      - { name: pending_estimated_lbs, type: integer, source: computed, default: 0, description: "Sum of DonationOffer.estimated_weight_lbs over this donor's offers in status MATCHED, SCHEDULED, PICKED_UP, or DELIVERED" }
      - { name: lifetime_tax_value_cents, type: integer, source: computed, default: 0, description: "Sum of deductible_value_cents over this donor's TaxReceipts with status=ISSUED (AMENDED excluded)" }

  - name: RecipientAgency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agency display name" }
      - { name: accepts_categories, type: array, source: input, description: "Non-empty subset of COLD_HELD | HOT_HELD | PRODUCE | SHELF_STABLE" }
      - { name: capacity_cold_held_lbs, type: integer, source: input, description: "Max committed lbs of COLD_HELD food" }
      - { name: capacity_hot_held_lbs, type: integer, source: input, description: "Max committed lbs of HOT_HELD food" }
      - { name: capacity_produce_lbs, type: integer, source: input, description: "Max committed lbs of PRODUCE food" }
      - { name: capacity_shelf_stable_lbs, type: integer, source: input, description: "Max committed lbs of SHELF_STABLE food" }
      - { name: committed_cold_held_lbs, type: integer, source: computed, default: 0, description: "Sum of RescueRun.estimated_weight_snapshot for runs targeting this agency with run_status in PROPOSED, CONFIRMED, PICKED_UP and offer category COLD_HELD" }
      - { name: committed_hot_held_lbs, type: integer, source: computed, default: 0, description: "Same formula for HOT_HELD" }
      - { name: committed_produce_lbs, type: integer, source: computed, default: 0, description: "Same formula for PRODUCE" }
      - { name: committed_shelf_stable_lbs, type: integer, source: computed, default: 0, description: "Same formula for SHELF_STABLE" }
      - { name: received_total_lbs, type: integer, source: computed, default: 0, description: "Sum of RescueRun.actual_weight_lbs for runs targeting this agency that reached DELIVERED or VERIFIED" }

  - name: VolunteerDriver
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Driver full name" }
      - { name: email, type: string, source: input, description: "Driver contact email" }
      - { name: vehicle_capacity_lbs, type: integer, source: input, description: "Maximum lbs the vehicle can carry on one run" }
      - { name: cooler_slot_count, type: integer, source: input, description: "Maximum number of coolers the vehicle can carry (>= 0)" }
      - { name: cold_chain_certified, type: boolean, source: input, default: false, description: "Food-safety cold-chain training certification" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED; initial ONBOARDING" }
      - { name: reliability_score, type: integer, source: computed, default: 100, description: "0..100; +5 per VERIFIED run (cap 100); -50 per upheld strike; SUSPENDED when < 60; reset to 80 on reinstatement" }
      - { name: completed_run_count, type: integer, source: computed, default: 0, description: "Count of VERIFIED runs driven" }
      - { name: upheld_strike_count, type: integer, source: computed, default: 0, description: "Count of UPHELD StrikeReports with subject=this driver" }

  - name: DriverAvailabilityWindow
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> VolunteerDriver.id; owner of this availability window" }
      - { name: window_start, type: datetime, source: input, description: "Window start (inclusive), ISO 8601 UTC" }
      - { name: window_end, type: datetime, source: input, description: "Window end (exclusive), must be > window_start" }
      - { name: status, type: enum, source: system, description: "OPEN | BOOKED; initial OPEN" }
      - { name: booked_run_id, type: string, source: system, description: "System-set id of the RescueRun currently booking this window; null when OPEN. Plain reference (discover runs via GET /api/rescue-runs?driver_id=)" }

  - name: Cooler
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Human label (e.g. COOLER-07)" }
      - { name: capacity_liters, type: integer, source: input, description: "Cooler volume in liters (> 0)" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | CHECKED_OUT | CLEANING | QUARANTINED; initial AVAILABLE. CLEANING and QUARANTINED lazily resolve to AVAILABLE once the logical clock >= cleaning_ends_at (recomputed on every read and on every eligibility check)" }
      - { name: cleaning_ends_at, type: datetime, source: system, description: "Null unless status is CLEANING (return_clock + 45 min) or QUARANTINED (return_clock + 240 min)" }

  - name: CoolerReservation
    parent: null
    common_fields: true
    fields:
      - { name: cooler_id, type: string, source: system, description: "FK -> Cooler.id; the reserved cooler" }
      - { name: rescue_run_id, type: string, source: system, description: "FK -> RescueRun.id; the run this reservation serves" }
      - { name: blocked_start, type: datetime, source: system, description: "= offer.pickup_window_start at dispatch time" }
      - { name: blocked_end, type: datetime, source: system, description: "= offer.pickup_window_end + RETURN_ALLOWANCE_MINUTES (90) + CLEANING_BUFFER_MINUTES (45) = pickup_window_end + 135 min" }
      - { name: status, type: enum, source: system, description: "RESERVED | CHECKED_OUT | RELEASED | RETURNED | QUARANTINED_HOLD; initial RESERVED" }

  - name: DonationOffer
    parent: null
    common_fields: true
    fields:
      - { name: donor_site_id, type: string, source: input, description: "FK -> DonorSite.id; offering donor" }
      - { name: food_category, type: enum, source: input, description: "COLD_HELD | HOT_HELD | PRODUCE | SHELF_STABLE" }
      - { name: requires_cold_chain, type: boolean, source: computed, description: "true iff food_category in {COLD_HELD, HOT_HELD}; input value ignored" }
      - { name: estimated_weight_lbs, type: integer, source: input, description: "Donor-estimated weight in whole lbs (> 0)" }
      - { name: pickup_window_start, type: datetime, source: input, description: "Pickup window start (inclusive)" }
      - { name: pickup_window_end, type: datetime, source: input, description: "Pickup window end (exclusive); window length must be in [30, 240] minutes" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | MATCHED | SCHEDULED | PICKED_UP | DELIVERED | CLOSED | CANCELLED | EXPIRED | DISCARDED; initial DRAFT" }
      - { name: failed_attempts, type: integer, source: system, default: 0, description: "Pickup-stage failures; on the 3rd failure the offer goes EXPIRED instead of OPEN" }
      - { name: current_run_id, type: string, source: system, description: "System-set id of the latest RescueRun dispatched against this offer; null when none. Plain reference (discover runs via GET /api/rescue-runs?offer_id=)" }

  - name: RescueRun
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: input, description: "FK -> DonationOffer.id; the offer being rescued" }
      - { name: agency_id, type: string, source: system, description: "FK -> RecipientAgency.id; destination agency (pinned by request or chosen by agency_matching_selector)" }
      - { name: driver_id, type: string, source: system, description: "FK -> VolunteerDriver.id; assigned driver (pinned by request or chosen by driver_matching_selector)" }
      - { name: run_status, type: enum, source: system, description: "PROPOSED | CONFIRMED | PICKED_UP | DELIVERED | VERIFIED | DECLINED | FAILED_PICKUP | FAILED_DELIVERY | CANCELLED; initial PROPOSED. Parallel dimension independent of safety_status" }
      - { name: safety_status, type: enum, source: system, description: "UNVERIFIED | PROVISIONAL_COMPLIANT | VERIFIED_COMPLIANT | VERIFIED_VIOLATION; initial UNVERIFIED. Evolves independently of run_status (e.g. a run may be FAILED_DELIVERY with safety_status VERIFIED_VIOLATION)" }
      - { name: estimated_weight_snapshot, type: integer, source: system, description: "Copy of offer.estimated_weight_lbs pinned at dispatch; used for all capacity commitment math even if the offer is later edited" }
      - { name: actual_weight_lbs, type: integer, source: system, description: "Agency-scale weight recorded at record-delivery; null until then" }
      - { name: pickup_time, type: datetime, source: system, description: "Recorded at record-pickup; null until then" }
      - { name: arrival_time, type: datetime, source: system, description: "Recorded at record-delivery; null until then" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock timestamp of verify-delivery; null until then. Drives tax-receipt period inclusion" }
      - { name: driver_attestation_signed_at, type: datetime, source: system, description: "Set at record-pickup when attestation_confirmed=true; the Good-Samaritan liability attestation artifact" }
      - { name: agency_countersigned_by_user_id, type: string, source: system, description: "X-User-ID of the AgencyCoordinator who verified delivery; null until then" }
      - { name: agency_countersigned_at, type: datetime, source: system, description: "Logical-clock timestamp of countersign; null until then" }
      - { name: fault_party, type: enum, source: system, description: "DONOR | DRIVER | AGENCY | NONE; null unless run failed" }
      - { name: failure_reason, type: enum, source: system, description: "DONOR_NO_SHOW | DRIVER_NO_SHOW | SAFETY_REJECTED | AGENCY_CLOSED | OVER_CAPACITY | SAFETY_DISPOSAL | OTHER; null unless failed" }
      - { name: disposal_method, type: string, source: system, description: "Required on delivery-stage fail with reason=SAFETY_DISPOSAL; else null" }
      - { name: disposal_notes, type: string, source: system, description: "Required on delivery-stage fail with reason=SAFETY_DISPOSAL; else null" }

  - name: TemperatureLog
    parent: null
    common_fields: false
    fields:
      - { name: rescue_run_id, type: string, source: system, description: "FK -> RescueRun.id; the run this reading belongs to" }
      - { name: point, type: enum, source: system, description: "PICKUP (created by record-pickup) | ARRIVAL (created by record-delivery attempt)" }
      - { name: temp_f, type: number, source: system, description: "Recorded food temperature in Fahrenheit (1 decimal)" }
      - { name: recorded_at, type: datetime, source: system, description: "= pickup_time for PICKUP logs, = arrival_time for ARRIVAL logs" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recorder" }

  - name: StrikeReport
    parent: null
    common_fields: true
    fields:
      - { name: rescue_run_id, type: string, source: system, description: "FK -> RescueRun.id; the run whose failure auto-filed this report" }
      - { name: reporter_role, type: enum, source: system, description: "DRIVER | ADMIN | SYSTEM; SYSTEM when auto-filed by a donor-cancel cascade" }
      - { name: reporter_user_id, type: string, source: system, description: "X-User-ID of the filer; null when reporter_role=SYSTEM" }
      - { name: subject_type, type: enum, source: system, description: "DONOR_SITE | DRIVER" }
      - { name: subject_id, type: string, source: system, description: "Polymorphic reference: id of a DonorSite when subject_type=DONOR_SITE, of a VolunteerDriver when subject_type=DRIVER" }
      - { name: reason, type: enum, source: system, description: "Copied from the failing call's reason" }
      - { name: status, type: enum, source: system, description: "FILED | UPHELD | WAIVED; initial FILED" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the adjudicating DispatchAdmin; null until adjudicated" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Logical-clock timestamp of adjudication; null until then" }

  - name: TaxReceipt
    parent: null
    common_fields: true
    fields:
      - { name: donor_site_id, type: string, source: system, description: "FK -> DonorSite.id; receipt subject (path parameter)" }
      - { name: period_start, type: datetime, source: input, description: "Receipt period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Receipt period end (exclusive); a run counts iff period_start <= verified_at < period_end" }
      - { name: status, type: enum, source: system, description: "ISSUED | AMENDED; a newly issued receipt for an identical (donor, period_start, period_end) supersedes the prior ISSUED one, which becomes AMENDED" }
      - { name: rate_card_version, type: integer, source: system, description: "Version of the RateCard whose [effective_start, effective_end) contains period_end; pinned at issuance" }
      - { name: lines, type: array, source: system, description: "One object per food_category present: { food_category, weight_lbs, fmv_cents_per_lb, basis_cents_per_lb, standard_cents, enhanced_cents }" }
      - { name: total_standard_value_cents, type: integer, source: system, description: "Sum of lines[].standard_cents" }
      - { name: total_enhanced_value_cents, type: integer, source: system, description: "Sum of lines[].enhanced_cents" }
      - { name: deductible_value_cents, type: integer, source: system, description: "= total_enhanced_value_cents when donor.enhanced_deduction_eligible else total_standard_value_cents" }
      - { name: total_weight_lbs, type: integer, source: system, description: "Sum of lines[].weight_lbs" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance" }

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: effective_start, type: datetime, source: input, description: "Effective window start (inclusive)" }
      - { name: effective_end, type: datetime, source: input, description: "Effective window end (exclusive); must be > effective_start and must not overlap any existing card's window" }
      - { name: card_version, type: integer, source: system, description: "Monotonic version assigned in successful-creation order, starts at 1; rejected creations do not consume a version" }
      - { name: cold_held_fmv_cents_per_lb, type: integer, source: input, description: "Fair-market-value rate for COLD_HELD" }
      - { name: cold_held_basis_cents_per_lb, type: integer, source: input, description: "Cost-basis rate for COLD_HELD" }
      - { name: hot_held_fmv_cents_per_lb, type: integer, source: input, description: "Fair-market-value rate for HOT_HELD" }
      - { name: hot_held_basis_cents_per_lb, type: integer, source: input, description: "Cost-basis rate for HOT_HELD" }
      - { name: produce_fmv_cents_per_lb, type: integer, source: input, description: "Fair-market-value rate for PRODUCE" }
      - { name: produce_basis_cents_per_lb, type: integer, source: input, description: "Cost-basis rate for PRODUCE" }
      - { name: shelf_stable_fmv_cents_per_lb, type: integer, source: input, description: "Fair-market-value rate for SHELF_STABLE" }
      - { name: shelf_stable_basis_cents_per_lb, type: integer, source: input, description: "Cost-basis rate for SHELF_STABLE" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: DonorSite
    initial_state: PENDING_REVIEW
    terminal_states: [DEACTIVATED]
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "PATCH /api/donor-sites/{id}/status with target_status=ACTIVE"
        actor: DispatchAdmin
        preconditions:
          - "Donor must be PENDING_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "DonorSite.version incremented"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /api/donor-sites/{id}/status with target_status=SUSPENDED, OR system when strike_count reaches DONOR_STRIKE_LIMIT (3) at strike adjudication"
        actor: "DispatchAdmin or system"
        preconditions: []
        side_effects:
          - "Cascade: every offer of this donor in DRAFT or OPEN -> CANCELLED (no strike)"
          - "Cascade: every offer in MATCHED or SCHEDULED -> CANCELLED, and its current run -> CANCELLED, releasing window, cooler reservations, and agency commitment (see DonationOffer cancel cascade)"
          - "Offers in PICKED_UP or DELIVERED are in flight and are NOT affected"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /api/donor-sites/{id}/status with target_status=ACTIVE"
        actor: DispatchAdmin
        preconditions:
          - "Donor must be SUSPENDED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "strike_count reset to 0"
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "PATCH /api/donor-sites/{id}/status with target_status=DEACTIVATED"
        actor: DispatchAdmin
        preconditions:
          - "No offer of this donor in DRAFT, OPEN, MATCHED, SCHEDULED, PICKED_UP, or DELIVERED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "PATCH /api/donor-sites/{id}/status with target_status=DEACTIVATED"
        actor: DispatchAdmin
        preconditions:
          - "Same as ACTIVE -> DEACTIVATED"
        side_effects: []

  - entity: VolunteerDriver
    initial_state: ONBOARDING
    terminal_states: []
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "PATCH /api/volunteer-drivers/{id}/status with target_status=ACTIVE"
        actor: DispatchAdmin
        preconditions:
          - "Driver must be ONBOARDING (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /api/volunteer-drivers/{id}/status with target_status=SUSPENDED, OR system when reliability_score drops below 60 at strike adjudication"
        actor: "DispatchAdmin or system"
        preconditions: []
        side_effects:
          - "Cascade: each PROPOSED run driven by this driver -> DECLINED (offer reverts MATCHED -> OPEN; window BOOKED -> OPEN; cooler reservations RELEASED; coolers RESERVED -> AVAILABLE; agency commitment released)"
          - "Cascade: each CONFIRMED run driven by this driver -> FAILED_PICKUP with fault_party=DRIVER, reason=DRIVER_NO_SHOW (agency commitment released; offer failed_attempts+1 then OPEN or EXPIRED per the 3-strikes rule; a StrikeReport with reporter_role=SYSTEM, subject_type=DRIVER is auto-filed)"
          - "Runs in PICKED_UP or DELIVERED are in flight and are NOT affected"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /api/volunteer-drivers/{id}/status with target_status=ACTIVE"
        actor: DispatchAdmin
        preconditions:
          - "Driver must be SUSPENDED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "reliability_score reset to 80"

  - entity: DriverAvailabilityWindow
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "system (POST /api/rescue-runs selects this window for the assigned driver)"
        actor: system
        preconditions:
          - "Window covers the offer pickup window: window_start <= pickup_window_start AND window_end >= pickup_window_end"
        side_effects:
          - "booked_run_id set to the new run"
      - from: BOOKED
        to: OPEN
        trigger: "system (booking run reaches DECLINED, FAILED_PICKUP, FAILED_DELIVERY, CANCELLED, or VERIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "booked_run_id cleared to null"

  - entity: Cooler
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (POST /api/rescue-runs creates a CoolerReservation for this cooler)"
        actor: system
        preconditions:
          - "Cooler lazily resolved to AVAILABLE (clock >= cleaning_ends_at when CLEANING/QUARANTINED)"
          - "No existing CoolerReservation in RESERVED or CHECKED_OUT whose [blocked_start, blocked_end) overlaps the new reservation's blocked interval (buffered semantics; adjacency allowed)"
        side_effects: []
      - from: RESERVED
        to: CHECKED_OUT
        trigger: "system (record-pickup on the reserving run)"
        actor: system
        preconditions: []
        side_effects:
          - "Linked CoolerReservation -> CHECKED_OUT"
      - from: CHECKED_OUT
        to: CLEANING
        trigger: "system (record-delivery success, or delivery-stage fail without SAFETY_DISPOSAL)"
        actor: system
        preconditions: []
        side_effects:
          - "cleaning_ends_at = current logical clock + CLEANING_BUFFER_MINUTES (45)"
          - "Linked CoolerReservation -> RETURNED"
      - from: CHECKED_OUT
        to: QUARANTINED
        trigger: "system (delivery-stage fail with reason=SAFETY_DISPOSAL)"
        actor: system
        preconditions: []
        side_effects:
          - "cleaning_ends_at = current logical clock + QUARANTINE_DEEP_CLEAN_MINUTES (240)"
          - "Linked CoolerReservation -> QUARANTINED_HOLD"
      - from: CLEANING
        to: AVAILABLE
        trigger: "system (lazy: any read or eligibility check once logical clock >= cleaning_ends_at)"
        actor: system
        preconditions: []
        side_effects:
          - "cleaning_ends_at cleared to null"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "system (lazy: any read or eligibility check once logical clock >= cleaning_ends_at)"
        actor: system
        preconditions: []
        side_effects:
          - "cleaning_ends_at cleared to null"
          - "Linked CoolerReservation in QUARANTINED_HOLD -> RETURNED"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (reserving run reaches DECLINED, FAILED_PICKUP, or CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "Linked CoolerReservation -> RELEASED"

  - entity: CoolerReservation
    initial_state: RESERVED
    terminal_states: [RELEASED, RETURNED]
    transitions:
      - from: RESERVED
        to: CHECKED_OUT
        trigger: "system (record-pickup on the reserving run)"
        actor: system
        preconditions: []
        side_effects: ["Cooler RESERVED -> CHECKED_OUT"]
      - from: RESERVED
        to: RELEASED
        trigger: "system (reserving run reaches DECLINED, FAILED_PICKUP, or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: ["Cooler RESERVED -> AVAILABLE"]
      - from: CHECKED_OUT
        to: RETURNED
        trigger: "system (record-delivery success, or delivery-stage fail with reason != SAFETY_DISPOSAL)"
        actor: system
        preconditions: []
        side_effects: ["Cooler CHECKED_OUT -> CLEANING (cleaning_ends_at = clock + 45)"]
      - from: CHECKED_OUT
        to: QUARANTINED_HOLD
        trigger: "system (delivery-stage fail with reason=SAFETY_DISPOSAL)"
        actor: system
        preconditions: []
        side_effects: ["Cooler CHECKED_OUT -> QUARANTINED (cleaning_ends_at = clock + 240)"]
      - from: QUARANTINED_HOLD
        to: RETURNED
        trigger: "system (lazy, when the linked cooler leaves QUARANTINED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DonationOffer
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED, EXPIRED, DISCARDED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "PATCH /api/donation-offers/{id}/status with target_status=OPEN"
        actor: "DonorCoordinator (owning donor) or DispatchAdmin"
        preconditions:
          - "Offer must be DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "DonorSite.status == ACTIVE (else ERR_DONOR_NOT_ACTIVE)"
          - "pickup_window_end > current logical clock (else ERR_PICKUP_WINDOW_PAST)"
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "PATCH /api/donation-offers/{id}/status with target_status=CANCELLED"
        actor: "DonorCoordinator (owning donor) or DispatchAdmin"
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "PATCH /api/donation-offers/{id}/status with target_status=CANCELLED"
        actor: "DonorCoordinator (owning donor) or DispatchAdmin"
        preconditions: []
        side_effects: []
      - from: MATCHED
        to: CANCELLED
        trigger: "PATCH /api/donation-offers/{id}/status with target_status=CANCELLED"
        actor: "DonorCoordinator (owning donor) or DispatchAdmin"
        preconditions: []
        side_effects:
          - "Current run (PROPOSED) -> CANCELLED; agency commitment released; window BOOKED -> OPEN; cooler reservations RELEASED; coolers RESERVED -> AVAILABLE"
          - "If the actor is a DonorCoordinator: a StrikeReport (subject_type=DONOR_SITE, reporter_role=SYSTEM) is auto-filed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "PATCH /api/donation-offers/{id}/status with target_status=CANCELLED"
        actor: "DonorCoordinator (owning donor) or DispatchAdmin"
        preconditions: []
        side_effects:
          - "Same release cascade as MATCHED -> CANCELLED, applied to the CONFIRMED current run"
          - "If the actor is a DonorCoordinator: a StrikeReport (subject_type=DONOR_SITE, reporter_role=SYSTEM) is auto-filed"
      - from: OPEN
        to: MATCHED
        trigger: "system (POST /api/rescue-runs succeeds)"
        actor: system
        preconditions: []
        side_effects:
          - "current_run_id set; donor pending_estimated_lbs += estimated_weight_lbs"
      - from: MATCHED
        to: OPEN
        trigger: "system (driver responds DECLINE on the current PROPOSED run)"
        actor: system
        preconditions: []
        side_effects:
          - "failed_attempts unchanged; donor pending_estimated_lbs -= estimated_weight_lbs"
      - from: MATCHED
        to: SCHEDULED
        trigger: "system (driver responds ACCEPT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: PICKED_UP
        trigger: "system (record-pickup succeeds)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: OPEN
        trigger: "system (pickup-stage fail on the current run, when failed_attempts+1 < 3)"
        actor: system
        preconditions: []
        side_effects:
          - "failed_attempts += 1; donor pending_estimated_lbs -= estimated_weight_lbs"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system (pickup-stage fail on the current run, when failed_attempts+1 == 3)"
        actor: system
        preconditions: []
        side_effects:
          - "failed_attempts = 3; donor pending_estimated_lbs -= estimated_weight_lbs; offer can never be re-offered"
      - from: PICKED_UP
        to: DELIVERED
        trigger: "system (record-delivery succeeds)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: CLOSED
        trigger: "system (verify-delivery succeeds)"
        actor: system
        preconditions: []
        side_effects:
          - "donor lifetime_weight_lbs += run.actual_weight_lbs; pending_estimated_lbs -= estimated_weight_lbs"
      - from: PICKED_UP
        to: DISCARDED
        trigger: "system (delivery-stage fail on the current run, any reason)"
        actor: system
        preconditions: []
        side_effects:
          - "donor pending_estimated_lbs -= estimated_weight_lbs"
      - from: OPEN
        to: EXPIRED
        trigger: "system (lazy: any read or dispatch attempt once logical clock > pickup_window_end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MATCHED
        to: EXPIRED
        trigger: "system (lazy: any read or dispatch attempt once logical clock > pickup_window_end)"
        actor: system
        preconditions: []
        side_effects:
          - "Current PROPOSED run -> CANCELLED with full release cascade (window, reservations, coolers, agency commitment)"

  - entity: RescueRun
    initial_state: PROPOSED
    terminal_states: [VERIFIED, DECLINED, FAILED_PICKUP, FAILED_DELIVERY, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /api/rescue-runs/{id}/respond with decision=ACCEPT"
        actor: "VolunteerDriver (assigned driver only; ownership masked as ERR_RUN_NOT_FOUND)"
        preconditions:
          - "run_status == PROPOSED (else ERR_RUN_NOT_IN_EXPECTED_STATE). No driver-status re-check: a suspension between dispatch and respond already tore the PROPOSED run down via the suspension cascade, so the state check fires first."
        side_effects:
          - "DonationOffer MATCHED -> SCHEDULED"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /api/rescue-runs/{id}/respond with decision=DECLINE, OR system cascade (driver suspension, donor suspension, offer expiry/cancel)"
        actor: "VolunteerDriver (assigned) or system"
        preconditions:
          - "run_status == PROPOSED (else ERR_RUN_NOT_IN_EXPECTED_STATE)"
        side_effects:
          - "DonationOffer MATCHED -> OPEN (on explicit decline; cascade callers may move it to CANCELLED/EXPIRED instead)"
          - "Window BOOKED -> OPEN; cooler reservations RELEASED; coolers RESERVED -> AVAILABLE; agency commitment released"
      - from: CONFIRMED
        to: PICKED_UP
        trigger: "POST /api/rescue-runs/{id}/record-pickup"
        actor: "VolunteerDriver (assigned)"
        preconditions:
          - "run_status == CONFIRMED (else ERR_RUN_NOT_IN_EXPECTED_STATE)"
          - "attestation_confirmed == true (else ERR_INVALID_REQUEST)"
          - "pickup_time <= current logical clock (else ERR_INVALID_REQUEST)"
          - "Cold-chain offers: pickup_temp_f present and not at/ beyond kill temperature (COLD_HELD: >= 70.0; HOT_HELD: <= 100.0) else ERR_SAFETY_VIOLATION_AT_PICKUP"
        side_effects:
          - "TemperatureLog (point=PICKUP) created"
          - "safety_status -> PROVISIONAL_COMPLIANT"
          - "driver_attestation_signed_at = logical clock"
          - "Cooler reservations RESERVED -> CHECKED_OUT; coolers -> CHECKED_OUT"
          - "DonationOffer SCHEDULED -> PICKED_UP"
      - from: CONFIRMED
        to: FAILED_PICKUP
        trigger: "POST /api/rescue-runs/{id}/fail, OR system cascade (driver suspension)"
        actor: "VolunteerDriver (assigned) or DispatchAdmin or system"
        preconditions:
          - "run_status == CONFIRMED (else ERR_RUN_NOT_IN_EXPECTED_STATE)"
          - "reason == SAFETY_REJECTED requires fault_party == NONE; DONOR_NO_SHOW requires fault_party == DONOR; DRIVER_NO_SHOW requires fault_party == DRIVER (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Agency commitment released (committed_lbs -= estimated_weight_snapshot)"
          - "Window BOOKED -> OPEN; cooler reservations RELEASED; coolers RESERVED -> AVAILABLE"
          - "If reason == SAFETY_REJECTED: DonationOffer SCHEDULED -> DISCARDED and NO strike is filed"
          - "Else: DonationOffer failed_attempts += 1; -> OPEN if failed_attempts < 3 else -> EXPIRED"
          - "If fault_party in {DONOR, DRIVER}: StrikeReport auto-filed (subject mapped from fault_party; reporter_role = DRIVER when actor is the assigned driver, ADMIN when DispatchAdmin, SYSTEM on cascade)"
      - from: PICKED_UP
        to: DELIVERED
        trigger: "POST /api/rescue-runs/{id}/record-delivery"
        actor: "VolunteerDriver (assigned)"
        preconditions:
          - "run_status == PICKED_UP (else ERR_RUN_NOT_IN_EXPECTED_STATE)"
          - "pickup_time <= arrival_time <= current logical clock (else ERR_INVALID_REQUEST)"
          - "actual_weight_lbs >= 1 and <= ceil(estimated_weight_snapshot * 1.25) (else ERR_DELIVERY_OVERAGE_EXCEEDED; see agency_capacity_commitment)"
          - "Cold-chain offers: arrival_temp_f present; danger_zone_compliance_verdict computed over PICKUP+ARRIVAL logs must be COMPLIANT (else ERR_SAFETY_VERDICT_VIOLATION and safety_status -> VERIFIED_VIOLATION, run stays PICKED_UP)"
        side_effects:
          - "TemperatureLog (point=ARRIVAL) created"
          - "safety_status -> VERIFIED_COMPLIANT (non-cold-chain offers are always COMPLIANT)"
          - "Agency: committed_lbs -= estimated_weight_snapshot; received_total_lbs += actual_weight_lbs"
          - "Cooler reservations CHECKED_OUT -> RETURNED; coolers CHECKED_OUT -> CLEANING (cleaning_ends_at = clock + 45)"
          - "DonationOffer PICKED_UP -> DELIVERED"
      - from: PICKED_UP
        to: FAILED_DELIVERY
        trigger: "POST /api/rescue-runs/{id}/fail"
        actor: "VolunteerDriver (assigned) or DispatchAdmin"
        preconditions:
          - "run_status == PICKED_UP (else ERR_RUN_NOT_IN_EXPECTED_STATE)"
          - "reason == SAFETY_DISPOSAL requires safety_status == VERIFIED_VIOLATION (else ERR_RUN_NOT_IN_EXPECTED_STATE) and non-empty disposal_method + disposal_notes (else ERR_INVALID_REQUEST)"
          - "AGENCY_CLOSED / OVER_CAPACITY require fault_party == AGENCY; SAFETY_DISPOSAL requires fault_party == NONE (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Agency commitment released (committed_lbs -= estimated_weight_snapshot); received_total_lbs unchanged"
          - "Window BOOKED -> OPEN"
          - "reason == SAFETY_DISPOSAL: reservations -> QUARANTINED_HOLD, coolers -> QUARANTINED (cleaning_ends_at = clock + 240); other reasons: reservations -> RETURNED, coolers -> CLEANING (clock + 45)"
          - "DonationOffer PICKED_UP -> DISCARDED"
          - "Strikes target only DONOR_SITE or DRIVER subjects; fault_party == AGENCY files NO StrikeReport"
      - from: DELIVERED
        to: VERIFIED
        trigger: "POST /api/rescue-runs/{id}/verify-delivery"
        actor: "AgencyCoordinator (of run.agency_id only; ownership masked as ERR_RUN_NOT_FOUND)"
        preconditions:
          - "run_status == DELIVERED (else ERR_RUN_NOT_IN_EXPECTED_STATE)"
        side_effects:
          - "verified_at = logical clock; agency_countersigned_by_user_id = caller; agency_countersigned_at = logical clock"
          - "DonationOffer DELIVERED -> CLOSED (donor lifetime_weight_lbs += actual_weight_lbs)"
          - "Driver: completed_run_count += 1; reliability_score = min(100, +5)"
          - "Window BOOKED -> OPEN"
      - from: PROPOSED
        to: CANCELLED
        trigger: "system cascade (donor cancels MATCHED offer, donor suspension, offer expiry)"
        actor: system
        preconditions: []
        side_effects:
          - "Window BOOKED -> OPEN; reservations RELEASED; coolers RESERVED -> AVAILABLE; agency commitment released"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system cascade (donor cancels SCHEDULED offer or donor suspension)"
        actor: system
        preconditions: []
        side_effects:
          - "Same release cascade as PROPOSED -> CANCELLED (including agency commitment)"

  - entity: StrikeReport
    initial_state: FILED
    terminal_states: [UPHELD, WAIVED]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /api/strike-reports/{id}/adjudicate with outcome=UPHELD"
        actor: DispatchAdmin
        preconditions:
          - "status == FILED (else ERR_STRIKE_NOT_FILED)"
          - "Segregation of duties: when reporter_role != SYSTEM, caller's X-User-ID != reporter_user_id (else ERR_SELF_ADJUDICATION_FORBIDDEN)"
        side_effects:
          - "subject DONOR_SITE: DonorSite.strike_count += 1; if strike_count >= 3 -> DonorSite -> SUSPENDED with its full cascade"
          - "subject DRIVER: VolunteerDriver.upheld_strike_count += 1; reliability_score -= 50; if reliability_score < 60 -> VolunteerDriver -> SUSPENDED with its full cascade"
      - from: FILED
        to: WAIVED
        trigger: "POST /api/strike-reports/{id}/adjudicate with outcome=WAIVED"
        actor: DispatchAdmin
        preconditions:
          - "status == FILED (else ERR_STRIKE_NOT_FILED)"
          - "Same segregation-of-duties check"
        side_effects:
          - "No changes to subject counters or scores"

  - entity: TaxReceipt
    initial_state: ISSUED
    terminal_states: []
    transitions:
      - from: ISSUED
        to: AMENDED
        trigger: "system (a new TaxReceipt is issued for the same donor with identical period_start and period_end)"
        actor: system
        preconditions: []
        side_effects:
          - "Superseded receipt excluded from donor.lifetime_tax_value_cents recomputation"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: run-create-stale-offer
    parent_entity: DonationOffer
    write_endpoint: "POST /api/rescue-runs"
    occ_field: expected_offer_version
    description: |
      Creating a RescueRun against a DonationOffer whose version has advanced
      since the client last observed it is rejected. The offer may legitimately
      be OPEN again at a newer version (e.g. after a prior run was declined and
      the offer reverted MATCHED -> OPEN), so no state precondition can reject
      the stale write; only the version check can.
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
  - rule_id: receipt-issue-stale-donor
    parent_entity: DonorSite
    write_endpoint: "POST /api/donor-sites/{id}/tax-receipts"
    occ_field: expected_donor_version
    description: |
      Issuing a TaxReceipt against a DonorSite whose version has advanced since
      the client last observed it is rejected. Issuing a receipt for a period
      that already has an ISSUED receipt legitimately supersedes it under the
      amendment rule, so no state precondition can reject the stale write;
      only the version check can.
    error_id: ERR_STALE_DONOR_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: danger_zone_compliance_verdict
    trigger: "record-pickup (provisional variant: kill-temperature screen) and record-delivery (final variant: full interpolation)"
    algorithm: threshold
    formula: |
      Applies only to cold-chain offers (COLD_HELD, HOT_HELD). PRODUCE and
      SHELF_STABLE are always COMPLIANT.
      Danger predicate by category:
        COLD_HELD: temp_f > 41.0 is dangerous; kill screen at pickup: temp_f >= 70.0
        HOT_HELD:  temp_f < 135.0 is dangerous; kill screen at pickup: temp_f <= 100.0
      Provisional (record-pickup): if kill screen trips -> reject with
        ERR_SAFETY_VIOLATION_AT_PICKUP; else safety_status = PROVISIONAL_COMPLIANT.
      Final (record-delivery): exactly two TemperatureLogs exist, sorted by
        recorded_at: (t0, T0) = PICKUP log, (t1, T1) = ARRIVAL log; span = t1 - t0.
        danger_minutes =
          0                                   if neither T0 nor T1 dangerous
          span                                if both dangerous
          span * (T1 - K) / (T1 - T0)         if only T1 dangerous (K = 41.0 for COLD_HELD, 135.0 for HOT_HELD; crossing time found by linear interpolation)
          span * (K - T0) / (T1 - T0)         if only T0 dangerous
        Verdict COMPLIANT iff danger_minutes <= DANGER_ZONE_LIMIT_MINUTES (240);
        boundary is INCLUSIVE: exactly 240 is COMPLIANT, 241 is VIOLATION.
        VIOLATION -> reject record-delivery with ERR_SAFETY_VERDICT_VIOLATION
        and persist safety_status = VERIFIED_VIOLATION (run stays PICKED_UP).
    input_set: "TemperatureLogs of the run (PICKUP + ARRIVAL), offer.food_category"
    constants:
      DANGER_ZONE_LIMIT_MINUTES: 240
      COLD_HELD_DANGER_ABOVE_F: 41.0
      COLD_HELD_KILL_AT_PICKUP_F: 70.0
      HOT_HELD_DANGER_BELOW_F: 135.0
      HOT_HELD_KILL_AT_PICKUP_F: 100.0
    precision: "minutes as whole numbers; temperatures 1 decimal place"
    variants:
      - name: provisional
        when: "at record-pickup"
        difference: "screens only the kill temperature at pickup; never inspects elapsed time"
      - name: final
        when: "at record-delivery"
        difference: "interpolates the danger-zone crossing between PICKUP and ARRIVAL logs and applies the 240-minute cumulative limit"

  - name: tax_substantiation_value
    trigger: "POST /api/donor-sites/{id}/tax-receipts (issuance)"
    algorithm: tiered_pricing
    formula: |
      Input set S = runs with run_status == VERIFIED, offer.donor_site_id == donor,
        and period_start <= run.verified_at < period_end (HALF-OPEN period).
      Rate card R = the unique card with effective_start <= period_end < effective_end.
      Group S by offer.food_category; per category line:
        weight_lbs          = sum(run.actual_weight_lbs)
        standard_cents      = weight_lbs * R.fmv_cents_per_lb(category)
        enhanced_rate_cents = min(2 * R.basis_cents_per_lb(category),
                                  R.basis_cents_per_lb(category)
                                  + round_half_up((R.fmv_cents_per_lb(category) - R.basis_cents_per_lb(category)) / 2))
        enhanced_cents      = weight_lbs * enhanced_rate_cents
      ROUNDING ORDER IS PINNED: the per-lb enhanced rate is rounded half-up to a
      whole cent BEFORE multiplying by weight_lbs. (Rounding the line total
      instead yields different cents, e.g. fmv=151, basis=100, weight=10:
      pinned order 10 * 126 = 1260; round-after-multiply 1255.)
      Totals: total_standard_value_cents = sum(standard_cents);
              total_enhanced_value_cents = sum(enhanced_cents);
              total_weight_lbs = sum(weight_lbs);
      deductible_value_cents = total_enhanced_value_cents if donor.enhanced_deduction_eligible
                               else total_standard_value_cents.
    input_set: "VERIFIED runs in the half-open period [period_start, period_end); AMENDED receipts never contribute; runs still DELIVERED (unverified) never contribute"
    constants: {}
    precision: "integer cents; round_half_up applied once per line at the per-lb enhanced rate"
    variants:
      - name: standard
        when: "donor.enhanced_deduction_eligible == false"
        difference: "deductible = weight * fmv per category (fair market value)"
      - name: enhanced
        when: "donor.enhanced_deduction_eligible == true"
        difference: "deductible = weight * min(2*basis, basis + round_half_up((fmv - basis)/2)) per category; ALWAYS <= standard for the same data"

  - name: estimated_vs_verified_weight
    trigger: "dispatch (estimated variant) and verify-delivery (verified variant)"
    algorithm: aggregation
    formula: |
      Estimated variant: donor.pending_estimated_lbs = sum of
        offer.estimated_weight_lbs over offers in {MATCHED, SCHEDULED, PICKED_UP, DELIVERED}.
      Verified variant: donor.lifetime_weight_lbs = sum of run.actual_weight_lbs
        over VERIFIED runs of the donor's offers.
      For identical rescue scope the two variants diverge whenever
      actual_weight_lbs != estimated_weight_lbs; the switch estimated->verified
      happens at verify-delivery (pending -= estimated, lifetime += actual).
    input_set: "offers in flight for the estimated variant; VERIFIED runs for the verified variant"
    constants: {}
    variants:
      - name: estimated
        when: "while a run is MATCHED..DELIVERED"
        difference: "uses offer.estimated_weight_lbs (donor self-report)"
      - name: verified
        when: "after verify-delivery"
        difference: "uses run.actual_weight_lbs (agency scale); replaces the estimate"

  - name: driver_reliability_score
    trigger: "verify-delivery (+5), strike adjudication UPHELD on a DRIVER subject (-50), reinstatement (reset to 80)"
    algorithm: aggregation
    formula: |
      Start 100. On verify-delivery: score = min(100, score + 5).
      On UPHELD driver strike: score = max(0, score - 50);
        if score < SUSPEND_THRESHOLD (60) -> driver -> SUSPENDED (cascade).
        Note the strict inequality: exactly 60 keeps the driver ACTIVE.
      On reinstatement (SUSPENDED -> ACTIVE): score = 80.
    input_set: "the driver being scored"
    constants:
      RELIABILITY_START: 100
      COMPLETION_BONUS: 5
      STRIKE_PENALTY: 50
      SUSPEND_THRESHOLD: 60
      REINSTATE_SCORE: 80
    precision: "integer"

  - name: donor_strike_suspension
    trigger: "strike adjudication UPHELD on a DONOR_SITE subject"
    algorithm: threshold
    formula: |
      strike_count = count of UPHELD StrikeReports with subject_id = donor.
      On adjudication: strike_count += 1; if strike_count >= DONOR_STRIKE_LIMIT (3)
        -> DonorSite -> SUSPENDED with full cascade.
      Boundary INCLUSIVE: the 3rd upheld strike suspends.
      Reinstatement resets strike_count to 0 (reset mechanism changes baseline).
    input_set: "UPHELD strikes for the donor"
    constants:
      DONOR_STRIKE_LIMIT: 3
    precision: "integer"

  - name: agency_capacity_commitment
    trigger: "dispatch (reserve), respond ACCEPT (re-check), record-delivery (release+receive), fail/decline/cancel (release)"
    algorithm: aggregation
    formula: |
      For agency a and category c:
        committed(a, c) = sum(run.estimated_weight_snapshot)
          over runs with agency_id == a, run_status in {PROPOSED, CONFIRMED, PICKED_UP},
          and offer.food_category == c.
      Gate (dispatch and respond ACCEPT):
        committed(a, c) + new_estimated <= capacity(a, c)
        — at respond ACCEPT the run itself is already in the committed set, so the
        gate is committed(a, c) <= capacity(a, c). Boundary INCLUSIVE: == allowed.
      On record-delivery: committed -= estimated_weight_snapshot;
        received_total_lbs += actual_weight_lbs.
      Overage gate at record-delivery:
        actual_weight_lbs <= ceil(estimated_weight_snapshot * OVERAGE_NUMERATOR / OVERAGE_DENOMINATOR)   # 1.25x
        else ERR_DELIVERY_OVERAGE_EXCEEDED. Boundary INCLUSIVE: equality allowed.
    input_set: "runs in {PROPOSED, CONFIRMED, PICKED_UP} for the agency+category"
    constants:
      OVERAGE_NUMERATOR: 5
      OVERAGE_DENOMINATOR: 4
    precision: "integer lbs; overage ceiling uses ceil"

  - name: driver_matching_selector
    trigger: "POST /api/rescue-runs when driver_id is omitted"
    algorithm: weighted_scoring
    formula: |
      Eligibility (all must hold):
        driver.status == ACTIVE
        driver.cold_chain_certified == true when offer.requires_cold_chain
        driver.vehicle_capacity_lbs >= offer.estimated_weight_lbs
        exists a DriverAvailabilityWindow w of the driver with w.status == OPEN
          and w.window_start <= offer.pickup_window_start
          and w.window_end >= offer.pickup_window_end
      Ranking: reliability_score DESC, then the covering window's window_start ASC,
        then that window's created_at ASC. (ids never participate in ranking.)
      The window used for ranking is the driver's earliest-starting covering OPEN
        window (tie: earliest created_at); that window becomes BOOKED.
      Empty pool -> ERR_NO_ELIGIBLE_DRIVER.
    input_set: "all VolunteerDrivers"
    constants: {}
    precision: "n/a"

  - name: agency_matching_selector
    trigger: "POST /api/rescue-runs when agency_id is omitted"
    algorithm: weighted_scoring
    formula: |
      Eligibility: offer.food_category in agency.accepts_categories AND
        committed(agency, category) + offer.estimated_weight_lbs <= capacity(agency, category)
        (see agency_capacity_commitment; INCLUSIVE boundary).
      Ranking: best fit — (capacity - committed - estimated) ASC (smallest
        non-negative slack first), tie-break agency.created_at ASC.
      Empty pool -> ERR_NO_ELIGIBLE_AGENCY.
    input_set: "all RecipientAgencies"
    constants: {}
    precision: "n/a"

  - name: cooler_allocation
    trigger: "POST /api/rescue-runs (auto mode when cooler_ids omitted) and validation of pinned cooler_ids"
    algorithm: waterfall_allocation
    formula: |
      Only cold-chain offers need coolers:
        required_liters = ceil(offer.estimated_weight_lbs * LBS_TO_LITERS)   # 0.5 L per lb
      Candidate coolers: lazily AVAILABLE and no overlapping reservation
        (see cooler_reservation_overlap).
      Auto mode: sort candidates by capacity_liters DESC, tie created_at ASC;
        accumulate in order while total < required_liters AND
        selected_count < driver.cooler_slot_count;
        success iff total >= required_liters else ERR_INSUFFICIENT_COOLER_CAPACITY.
      Pinned mode: every listed cooler must be a candidate (else
        ERR_COOLER_UNAVAILABLE); count <= driver.cooler_slot_count and
        sum(capacity_liters) >= required_liters (else ERR_INSUFFICIENT_COOLER_CAPACITY).
      Non-cold-chain offers: cooler_ids must be omitted or empty (else
        ERR_INVALID_REQUEST) and no reservation is created.
    input_set: "all Coolers (lazily status-resolved)"
    constants:
      LBS_TO_LITERS: 0.5
    precision: "integer liters via ceil"

  - name: cooler_reservation_overlap
    trigger: "POST /api/rescue-runs cooler eligibility and pinned-cooler validation"
    algorithm: interval_merge
    formula: |
      Each reservation blocks the buffered interval
        [blocked_start, blocked_end) = [offer.pickup_window_start,
                                        offer.pickup_window_end + 135 min]
        (90 min return allowance + 45 min cleaning buffer).
      A new blocked interval [s, e) conflicts with an existing reservation in
      status RESERVED or CHECKED_OUT iff s < existing.blocked_end AND
      existing.blocked_start < e.
      BUFFERED adjacency: new.blocked_start == existing.blocked_end is ALLOWED
      (strict inequality); anything earlier conflicts.
    input_set: "CoolerReservations in {RESERVED, CHECKED_OUT} for the cooler"
    constants:
      RETURN_ALLOWANCE_MINUTES: 90
      CLEANING_BUFFER_MINUTES: 45
    precision: "minute precision"

  - name: availability_window_overlap
    trigger: "POST /api/volunteer-drivers/{id}/availability-windows"
    algorithm: interval_merge
    formula: |
      New window [s, e) conflicts with an existing window of the SAME driver in
      status OPEN or BOOKED iff s < existing.window_end AND
      existing.window_start < e.
      HALF-OPEN adjacency: new.window_start == existing.window_end is ALLOWED.
      (Contrast with cooler_reservation_overlap: no buffer is appended here.)
      Violation -> ERR_AVAILABILITY_WINDOW_OVERLAP.
    input_set: "the driver's windows in {OPEN, BOOKED}"
    constants: {}
    precision: "minute precision"

# =============================================================================
# Table 4: Validation Rules Table (§1.4, ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The caller's role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Request body must be well-formed: all required fields present, no unknown fields, correct types, enum members valid, integers > 0 where noted, window_end > window_start, pickup window length in [30, 240] minutes, datetimes not in the future where prohibited (pickup_time, arrival_time <= logical clock), attestation_confirmed == true, disposal fields present when reason=SAFETY_DISPOSAL, fault_party/reason combination consistent, cooler_ids omitted/empty for non-cold-chain offers, tax period period_start < period_end and period_end <= logical clock"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 4
    category: existence
    check: "Path ids (left to right), then body FK ids (offer_id, driver_id, agency_id, each entry of cooler_ids) must exist"
    error_id: "ERR_DONOR_NOT_FOUND | ERR_AGENCY_NOT_FOUND | ERR_DRIVER_NOT_FOUND | ERR_COOLER_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_STRIKE_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: existence
    check: "Ownership masking: an entity-backed caller may only touch its own resources (DonorCoordinator: offers/tax-receipts of its donor site, donor record itself; VolunteerDriver: own record, own windows, own assigned runs; AgencyCoordinator: own agency record, runs targeting its agency). Violations are masked as the resource's NOT_FOUND error"
    error_id: "same NOT_FOUND codes as priority 4"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 6
    category: state
    check: "Target resource lifecycle state must admit the operation (PATCH status transition validity; ERR_DONOR_NOT_ACTIVE on offer publish; ERR_OFFER_NOT_OPEN on dispatch; ERR_RUN_NOT_IN_EXPECTED_STATE on run actions incl. SAFETY_DISPOSAL without VERIFIED_VIOLATION; ERR_STRIKE_NOT_FILED on adjudicate), including cross-entity state preconditions: ERR_DRIVER_NOT_ACTIVE when an ONBOARDING/SUSPENDED driver creates an availability window or is pinned at dispatch. Lazy EXPIRED resolution on offers and lazy AVAILABLE resolution on coolers run BEFORE this check"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_DONOR_NOT_ACTIVE | ERR_DRIVER_NOT_ACTIVE | ERR_OFFER_NOT_OPEN | ERR_RUN_NOT_IN_EXPECTED_STATE | ERR_STRIKE_NOT_FILED | ERR_PICKUP_WINDOW_PAST"
    http_status: 409
    applies_to: "state transition endpoints, dispatch, run actions, adjudicate"
  - priority: 7
    category: business_constraint
    check: "OCC: expected_offer_version must equal DonationOffer.version; expected_donor_version must equal DonorSite.version"
    error_id: "ERR_STALE_OFFER_VERSION | ERR_STALE_DONOR_VERSION"
    http_status: 412
    applies_to: "POST /api/rescue-runs, POST /api/donor-sites/{id}/tax-receipts"
  - priority: 8
    category: business_safety
    check: "Cold-chain safety: pinned driver must be cold_chain_certified when offer.requires_cold_chain (dispatch); pickup kill temperature screen; delivery danger-zone verdict"
    error_id: "ERR_DRIVER_NOT_COLD_CHAIN_CERTIFIED | ERR_SAFETY_VIOLATION_AT_PICKUP | ERR_SAFETY_VERDICT_VIOLATION"
    http_status: 409
    applies_to: "POST /api/rescue-runs, POST /api/rescue-runs/{id}/record-pickup, POST /api/rescue-runs/{id}/record-delivery"
  - priority: 9
    category: business_temporal
    check: "Interval rules: availability-window overlap (half-open, no buffer); driver window coverage of the pickup window; cooler buffered-interval overlap; rate-card effective-window overlap"
    error_id: "ERR_AVAILABILITY_WINDOW_OVERLAP | ERR_DRIVER_WINDOW_MISSING | ERR_COOLER_UNAVAILABLE | ERR_RATE_CARD_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /api/volunteer-drivers/{id}/availability-windows, POST /api/rescue-runs, POST /api/rate-cards"
  - priority: 10
    category: business_constraint
    check: "Cross-entity acceptability: pinned agency must list offer.food_category in accepts_categories"
    error_id: ERR_AGENCY_CATEGORY_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /api/rescue-runs"
  - priority: 11
    category: business_fiscal
    check: "Capacity quotas: vehicle_capacity_lbs >= estimated_weight_lbs; agency committed + estimated <= capacity (INCLUSIVE); cooler liters >= ceil(estimated * 0.5) within driver.cooler_slot_count; delivery overage <= ceil(estimated * 1.25) (INCLUSIVE); for receipts the verified-run set is evaluated FIRST (ERR_RECEIPT_NO_VERIFIED_RESCUES) and rate-card coverage SECOND (ERR_NO_RATE_CARD_EFFECTIVE)"
    error_id: "ERR_DRIVER_CAPACITY_EXCEEDED | ERR_AGENCY_CAPACITY_EXCEEDED | ERR_INSUFFICIENT_COOLER_CAPACITY | ERR_DELIVERY_OVERAGE_EXCEEDED | ERR_RECEIPT_NO_VERIFIED_RESCUES | ERR_NO_RATE_CARD_EFFECTIVE"
    http_status: 409
    applies_to: "POST /api/rescue-runs, POST /api/rescue-runs/{id}/respond, POST /api/rescue-runs/{id}/record-delivery, POST /api/donor-sites/{id}/tax-receipts"
  - priority: 12
    category: business_constraint
    check: "Selector fallback: when a resource class is omitted and its eligibility pool is empty, report the FIRST empty pool in resolution order: driver, then agency, then coolers"
    error_id: "ERR_NO_ELIGIBLE_DRIVER | ERR_NO_ELIGIBLE_AGENCY | ERR_INSUFFICIENT_COOLER_CAPACITY"
    http_status: 409
    applies_to: "POST /api/rescue-runs"

# =============================================================================
# Response Envelope (§1.0 — FIXED, verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5 — 33 endpoints; the extra endpoint beyond the 32 target is lint-mandated FK reverse-reachability surface)
# =============================================================================
endpoints:
  # --- test-driving logical clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. All timestamp validations, lazy expirations, lazy cooler releases, cleaning_ends_at, and *_at server stamps read this clock."
    roles: [DispatchAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Advancing the clock lazily expires OPEN/MATCHED offers whose pickup_window_end has passed and lazily releases CLEANING/QUARANTINED coolers whose cleaning_ends_at has passed"]

  # --- DonorSite ---
  - method: POST
    path: "/api/donor-sites"
    description: "Onboard a donor site (enters PENDING_REVIEW)"
    roles: [DispatchAdmin]
    code: 201
    input: [legal_name, ein, contact_email, "enhanced_deduction_eligible?"]
    output: DonorSite
    side_effects: ["status=PENDING_REVIEW, strike_count=0, aggregates=0"]
  - method: GET
    path: "/api/donor-sites/{id}"
    description: "Get a donor site including computed aggregates"
    roles: [DispatchAdmin, DonorCoordinator]
    code: 200
    input: []
    output: DonorSite
    side_effects: []
  - method: PATCH
    path: "/api/donor-sites/{id}/status"
    description: "Lifecycle transitions: approve (PENDING_REVIEW->ACTIVE), suspend (ACTIVE->SUSPENDED), reinstate (SUSPENDED->ACTIVE, resets strike_count), deactivate (->DEACTIVATED when no in-flight offers)"
    roles: [DispatchAdmin]
    code: 200
    input: [target_status]
    output: DonorSite
    side_effects: ["Suspension cascades to non-in-flight offers and their runs; reinstatement resets strike_count to 0"]
  - method: GET
    path: "/api/donor-sites/{id}/donation-offers"
    description: "List offers of a donor (FK reverse reachability for DonationOffer.donor_site_id)"
    roles: [DispatchAdmin, DonorCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DonationOffer[]"
    side_effects: []
  - method: GET
    path: "/api/donor-sites/{id}/tax-receipts"
    description: "List tax receipts of a donor, all statuses (FK reverse reachability for TaxReceipt.donor_site_id)"
    roles: [DispatchAdmin, DonorCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TaxReceipt[]"
    side_effects: []
  - method: POST
    path: "/api/donor-sites/{id}/tax-receipts"
    description: "Issue a tax receipt for [period_start, period_end). Supersedes (AMENDs) any ISSUED receipt with identical period. OCC-guarded on DonorSite.version."
    roles: [DispatchAdmin]
    code: 201
    input: [period_start, period_end, expected_donor_version]
    output: TaxReceipt
    side_effects: ["Computes tax_substantiation_value over VERIFIED runs in the period; pins rate_card_version; supersedes identical-period ISSUED receipt -> AMENDED; increments DonorSite.version by 1; recomputes DonorSite.lifetime_tax_value_cents"]

  # --- RecipientAgency ---
  - method: POST
    path: "/api/recipient-agencies"
    description: "Register a recipient agency with per-category capacities"
    roles: [DispatchAdmin]
    code: 201
    input: [name, accepts_categories, capacity_cold_held_lbs, capacity_hot_held_lbs, capacity_produce_lbs, capacity_shelf_stable_lbs]
    output: RecipientAgency
    side_effects: ["committed_*=0, received_total_lbs=0"]
  - method: GET
    path: "/api/recipient-agencies/{id}"
    description: "Get an agency including committed/received aggregates"
    roles: [DispatchAdmin, AgencyCoordinator]
    code: 200
    input: []
    output: RecipientAgency
    side_effects: []

  # --- VolunteerDriver ---
  - method: POST
    path: "/api/volunteer-drivers"
    description: "Register a volunteer driver (enters ONBOARDING)"
    roles: [DispatchAdmin]
    code: 201
    input: [full_name, email, vehicle_capacity_lbs, cooler_slot_count, "cold_chain_certified?"]
    output: VolunteerDriver
    side_effects: ["status=ONBOARDING, reliability_score=100"]
  - method: GET
    path: "/api/volunteer-drivers/{id}"
    description: "Get a driver including reliability_score"
    roles: [DispatchAdmin, VolunteerDriver]
    code: 200
    input: []
    output: VolunteerDriver
    side_effects: []
  - method: PATCH
    path: "/api/volunteer-drivers/{id}/status"
    description: "Lifecycle transitions: activate (ONBOARDING->ACTIVE), suspend (ACTIVE->SUSPENDED), reinstate (SUSPENDED->ACTIVE, resets reliability_score to 80)"
    roles: [DispatchAdmin]
    code: 200
    input: [target_status]
    output: VolunteerDriver
    side_effects: ["Suspension cascades: PROPOSED runs DECLINED, CONFIRMED runs FAILED_PICKUP with SYSTEM strike; reinstatement resets reliability_score to 80"]
  - method: POST
    path: "/api/volunteer-drivers/{id}/availability-windows"
    description: "Declare an availability window (driver must be ACTIVE; half-open overlap check against the driver's OPEN/BOOKED windows)"
    roles: [VolunteerDriver]
    code: 201
    input: [window_start, window_end]
    output: DriverAvailabilityWindow
    side_effects: []
  - method: GET
    path: "/api/volunteer-drivers/{id}/availability-windows"
    description: "List a driver's availability windows (FK reverse reachability for DriverAvailabilityWindow.driver_id)"
    roles: [DispatchAdmin, VolunteerDriver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DriverAvailabilityWindow[]"
    side_effects: []

  # --- Cooler ---
  - method: POST
    path: "/api/coolers"
    description: "Add a cooler to the cold-chain inventory"
    roles: [DispatchAdmin]
    code: 201
    input: [label, capacity_liters]
    output: Cooler
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/api/coolers/{id}"
    description: "Get a cooler; CLEANING/QUARANTINED lazily resolve to AVAILABLE once the logical clock passes cleaning_ends_at"
    roles: [DispatchAdmin]
    code: 200
    input: []
    output: Cooler
    side_effects: ["Lazy status resolution on read"]
  - method: GET
    path: "/api/coolers/{id}/cooler-reservations"
    description: "List a cooler's reservations (FK reverse reachability for CoolerReservation.cooler_id)"
    roles: [DispatchAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CoolerReservation[]"
    side_effects: []

  # --- DonationOffer ---
  - method: POST
    path: "/api/donation-offers"
    description: "Create an offer in DRAFT (caller must be the donor site's coordinator: X-User-ID == donor_site_id)"
    roles: [DonorCoordinator]
    code: 201
    input: [donor_site_id, food_category, estimated_weight_lbs, pickup_window_start, pickup_window_end]
    output: DonationOffer
    side_effects: ["requires_cold_chain computed from food_category; status=DRAFT; failed_attempts=0"]
  - method: GET
    path: "/api/donation-offers/{id}"
    description: "Get an offer; lazily transitions OPEN/MATCHED offers to EXPIRED once the logical clock passes pickup_window_end"
    roles: [DispatchAdmin, DonorCoordinator]
    code: 200
    input: []
    output: DonationOffer
    side_effects: ["Lazy expiry on read"]
  - method: PATCH
    path: "/api/donation-offers/{id}/status"
    description: "publish (DRAFT->OPEN) or cancel (DRAFT/OPEN/MATCHED/SCHEDULED->CANCELLED). Donor-initiated cancel of MATCHED/SCHEDULED auto-files a SYSTEM strike against the donor."
    roles: [DonorCoordinator, DispatchAdmin]
    code: 200
    input: [target_status]
    output: DonationOffer
    side_effects: ["Cancel of MATCHED/SCHEDULED tears down the current run (-> CANCELLED), releasing window, reservations, coolers, and agency commitment"]

  # --- RescueRun ---
  - method: POST
    path: "/api/rescue-runs"
    description: "Dispatch a rescue run for an OPEN offer. driver_id/agency_id/cooler_ids may be pinned or omitted for selector matching. OCC-guarded on DonationOffer.version."
    roles: [DispatchAdmin]
    code: 201
    input: [offer_id, expected_offer_version, "driver_id?", "agency_id?", "cooler_ids?"]
    output: RescueRun
    side_effects:
      - "Offer OPEN -> MATCHED; DonationOffer.version incremented by 1; current_run_id set"
      - "Selected driver window OPEN -> BOOKED; CoolerReservations created (RESERVED); coolers AVAILABLE -> RESERVED"
      - "Agency commitment reserved (committed += estimated_weight_snapshot) via agency_capacity_commitment"
      - "estimated_weight_snapshot pinned from the offer"
  - method: GET
    path: "/api/rescue-runs"
    description: "List/filter rescue runs (FK reverse reachability for RescueRun.offer_id, .agency_id, .driver_id)"
    roles: [DispatchAdmin]
    code: 200
    input: ["offer_id?", "agency_id?", "driver_id?", "status?", "limit?", "offset?"]
    output: "RescueRun[]"
    side_effects: []
  - method: GET
    path: "/api/rescue-runs/{id}"
    description: "Get a run including both run_status and safety_status"
    roles: [DispatchAdmin, VolunteerDriver, AgencyCoordinator]
    code: 200
    input: []
    output: RescueRun
    side_effects: []
  - method: POST
    path: "/api/rescue-runs/{id}/respond"
    description: "Assigned driver accepts (PROPOSED->CONFIRMED, offer->SCHEDULED) or declines (PROPOSED->DECLINED, offer->OPEN, full release)"
    roles: [VolunteerDriver]
    code: 200
    input: [decision]
    output: RescueRun
    side_effects: ["ACCEPT moves offer MATCHED -> SCHEDULED; DECLINE releases window/reservations/coolers/agency commitment and reverts offer MATCHED -> OPEN"]
  - method: POST
    path: "/api/rescue-runs/{id}/record-pickup"
    description: "Assigned driver records pickup time, pickup temperature (cold-chain), and signs the liability attestation (attestation_confirmed must be true)"
    roles: [VolunteerDriver]
    code: 200
    input: [pickup_time, "pickup_temp_f?", attestation_confirmed]
    output: RescueRun
    side_effects: ["CONFIRMED -> PICKED_UP; offer -> PICKED_UP; PICKUP TemperatureLog created; provisional kill-temperature screen; reservations/coolers -> CHECKED_OUT; driver_attestation_signed_at set"]
  - method: POST
    path: "/api/rescue-runs/{id}/fail"
    description: "Fail the run. From CONFIRMED = pickup stage (fault DONOR/DRIVER/NONE; SAFETY_REJECTED discards the offer without a strike). From PICKED_UP = delivery stage (fault AGENCY/NONE; SAFETY_DISPOSAL requires VERIFIED_VIOLATION + disposal documentation and quarantines coolers)."
    roles: [VolunteerDriver, DispatchAdmin]
    code: 200
    input: [fault_party, reason, "disposal_method?", "disposal_notes?"]
    output: RescueRun
    side_effects: ["Stage-dependent teardown: agency commitment release, window release, reservation/cooler release or quarantine, offer re-offer (failed_attempts+1) or EXPIRED at 3rd failure or DISCARDED, StrikeReport auto-filed when fault_party maps to a subject"]
  - method: POST
    path: "/api/rescue-runs/{id}/record-delivery"
    description: "Assigned driver records arrival time/temperature and agency-scale weight; computes the final danger-zone verdict; on VIOLATION rejects with ERR_SAFETY_VERDICT_VIOLATION and persists safety_status=VERIFIED_VIOLATION"
    roles: [VolunteerDriver]
    code: 200
    input: [arrival_time, "arrival_temp_f?", actual_weight_lbs]
    output: RescueRun
    side_effects: ["PICKED_UP -> DELIVERED; offer -> DELIVERED; ARRIVAL TemperatureLog created; agency committed -= estimated, received += actual; reservations -> RETURNED; coolers -> CLEANING (clock+45)"]
  - method: POST
    path: "/api/rescue-runs/{id}/verify-delivery"
    description: "Agency coordinator countersigns (liability documentation) and closes the rescue: run VERIFIED, offer CLOSED, donor aggregates and driver score updated"
    roles: [AgencyCoordinator]
    code: 200
    input: []
    output: RescueRun
    side_effects: ["DELIVERED -> VERIFIED; verified_at set; offer -> CLOSED; donor lifetime_weight_lbs += actual; driver reliability +5 (cap 100), completed_run_count+1; window released"]
  - method: GET
    path: "/api/rescue-runs/{id}/temperature-logs"
    description: "List a run's temperature logs (FK reverse reachability for TemperatureLog.rescue_run_id)"
    roles: [DispatchAdmin, VolunteerDriver, AgencyCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "TemperatureLog[]"
    side_effects: []

  - method: GET
    path: "/api/rescue-runs/{id}/cooler-reservations"
    description: "List a run's cooler reservations (FK reverse reachability for CoolerReservation.rescue_run_id)"
    roles: [DispatchAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CoolerReservation[]"
    side_effects: []

  # --- StrikeReport ---
  - method: GET
    path: "/api/rescue-runs/{id}/strike-reports"
    description: "List the strike reports auto-filed for a run (FK reverse reachability for StrikeReport.rescue_run_id)"
    roles: [DispatchAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "StrikeReport[]"
    side_effects: []
  - method: POST
    path: "/api/strike-reports/{id}/adjudicate"
    description: "Uphold or waive a FILED strike. Segregation of duties: the adjudicator's X-User-ID must differ from reporter_user_id when reporter_role != SYSTEM."
    roles: [DispatchAdmin]
    code: 200
    input: [outcome]
    output: StrikeReport
    side_effects: ["UPHELD applies subject penalty: donor strike_count+1 (>=3 suspends donor with cascade) or driver reliability -50 (<60 suspends driver with cascade)"]

  # --- RateCard ---
  - method: POST
    path: "/api/rate-cards"
    description: "Publish a per-category FMV/basis rate card with an effective window; windows must not overlap existing cards"
    roles: [DispatchAdmin]
    code: 201
    input: [effective_start, effective_end, cold_held_fmv_cents_per_lb, cold_held_basis_cents_per_lb, hot_held_fmv_cents_per_lb, hot_held_basis_cents_per_lb, produce_fmv_cents_per_lb, produce_basis_cents_per_lb, shelf_stable_fmv_cents_per_lb, shelf_stable_basis_cents_per_lb]
    output: RateCard
    side_effects: ["card_version assigned monotonically from 1"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6 — 36 codes)
# =============================================================================
errors:
  # --- auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing/empty, or role not recognized"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Caller's role is not in the endpoint's roles list"
  # --- existence (also used to mask ownership violations) ---
  - id: ERR_DONOR_NOT_FOUND
    http: 404
    condition: "DonorSite id does not exist, or a DonorCoordinator addressed another donor's resource"
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "RecipientAgency id does not exist, or an AgencyCoordinator addressed another agency"
  - id: ERR_DRIVER_NOT_FOUND
    http: 404
    condition: "VolunteerDriver id does not exist, or a VolunteerDriver addressed another driver's record/windows"
  - id: ERR_COOLER_NOT_FOUND
    http: 404
    condition: "Cooler id (path or cooler_ids entry) does not exist"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "DonationOffer id does not exist, or a DonorCoordinator addressed another donor's offer"
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "RescueRun id does not exist, or the caller is not the assigned driver / destination agency"
  - id: ERR_STRIKE_REPORT_NOT_FOUND
    http: 404
    condition: "StrikeReport id does not exist"
  # --- schema ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, unknown field, bad type/enum, non-positive integer, window_end <= window_start, pickup window length outside [30, 240] minutes, pickup_time/arrival_time after the logical clock, arrival_time before pickup_time, attestation_confirmed != true, disposal fields missing for SAFETY_DISPOSAL, inconsistent fault_party/reason pair, cooler_ids on a non-cold-chain offer, tax period_start >= period_end or period_end after the logical clock"
  # --- state ---
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "PATCH status target not reachable from the entity's current state (donor/driver/offer lifecycle), or deactivate with in-flight offers"
  - id: ERR_DONOR_NOT_ACTIVE
    http: 409
    condition: "Offer publish requires DonorSite.status == ACTIVE"
  - id: ERR_DRIVER_NOT_ACTIVE
    http: 409
    condition: "Driver must be ACTIVE: availability-window creation, pinned dispatch, respond ACCEPT"
  - id: ERR_OFFER_NOT_OPEN
    http: 409
    condition: "Dispatch requires DonationOffer.status == OPEN (lazy EXPIRED resolution runs first)"
  - id: ERR_PICKUP_WINDOW_PAST
    http: 409
    condition: "Publish requires pickup_window_end after the current logical clock"
  - id: ERR_RUN_NOT_IN_EXPECTED_STATE
    http: 409
    condition: "Run action requires a different run_status (or, for SAFETY_DISPOSAL, safety_status == VERIFIED_VIOLATION)"
  - id: ERR_STRIKE_NOT_FILED
    http: 409
    condition: "Adjudicate requires StrikeReport.status == FILED"
  # --- OCC ---
  - id: ERR_STALE_OFFER_VERSION
    http: 412
    condition: "expected_offer_version != DonationOffer.version at dispatch"
  - id: ERR_STALE_DONOR_VERSION
    http: 412
    condition: "expected_donor_version != DonorSite.version at tax-receipt issuance"
  # --- business: safety ---
  - id: ERR_DRIVER_NOT_COLD_CHAIN_CERTIFIED
    http: 409
    condition: "Pinned driver lacks cold_chain_certified for a cold-chain offer"
  - id: ERR_SAFETY_VIOLATION_AT_PICKUP
    http: 409
    condition: "Pickup temperature trips the kill screen (COLD_HELD >= 70.0F, HOT_HELD <= 100.0F)"
  - id: ERR_SAFETY_VERDICT_VIOLATION
    http: 409
    condition: "Final danger-zone verdict is VIOLATION (cumulative danger minutes > 240); safety_status persists VERIFIED_VIOLATION"
  # --- business: temporal ---
  - id: ERR_AVAILABILITY_WINDOW_OVERLAP
    http: 409
    condition: "New availability window overlaps (half-open, no buffer) an existing OPEN/BOOKED window of the same driver"
  - id: ERR_DRIVER_WINDOW_MISSING
    http: 409
    condition: "Pinned driver has no OPEN window fully covering the offer pickup window"
  - id: ERR_COOLER_UNAVAILABLE
    http: 409
    condition: "Pinned cooler not lazily AVAILABLE, or its buffered reservation interval overlaps the new blocked interval"
  - id: ERR_RATE_CARD_WINDOW_OVERLAP
    http: 409
    condition: "New rate card's effective window overlaps an existing card's window (half-open adjacency allowed)"
  # --- business: constraint ---
  - id: ERR_AGENCY_CATEGORY_NOT_ACCEPTED
    http: 409
    condition: "Pinned agency's accepts_categories does not include offer.food_category"
  # --- business: fiscal / quota ---
  - id: ERR_DRIVER_CAPACITY_EXCEEDED
    http: 409
    condition: "Pinned driver's vehicle_capacity_lbs < offer.estimated_weight_lbs"
  - id: ERR_AGENCY_CAPACITY_EXCEEDED
    http: 409
    condition: "committed + estimated would exceed the agency's capacity for the offer's category (checked at dispatch and re-checked at respond ACCEPT)"
  - id: ERR_INSUFFICIENT_COOLER_CAPACITY
    http: 409
    condition: "Selected/pinned coolers within the driver's slot limit sum below ceil(estimated_lbs * 0.5) liters"
  - id: ERR_DELIVERY_OVERAGE_EXCEEDED
    http: 409
    condition: "actual_weight_lbs > ceil(estimated_weight_snapshot * 1.25)"
  - id: ERR_RECEIPT_NO_VERIFIED_RESCUES
    http: 409
    condition: "No VERIFIED run for the donor with period_start <= verified_at < period_end"
  - id: ERR_NO_RATE_CARD_EFFECTIVE
    http: 409
    condition: "No rate card with effective_start <= period_end < effective_end"
  # --- selector fallback ---
  - id: ERR_NO_ELIGIBLE_DRIVER
    http: 409
    condition: "Auto-match: no ACTIVE driver satisfies certification, capacity, and window coverage"
  - id: ERR_NO_ELIGIBLE_AGENCY
    http: 409
    condition: "Auto-match: no agency accepts the category with sufficient remaining capacity"
  # --- segregation of duties ---
  - id: ERR_SELF_ADJUDICATION_FORBIDDEN
    http: 403
    condition: "Adjudicator's X-User-ID equals the strike reporter's reporter_user_id (reporter_role != SYSTEM)"

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: DispatchAdmin
    description: "Nonprofit operations staff; onboards all parties, dispatches runs, manages cooler inventory and rate cards, issues tax receipts, adjudicates strikes"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/donor-sites, PATCH /api/donor-sites/{id}/status"
      - "POST /api/recipient-agencies"
      - "POST /api/volunteer-drivers, PATCH /api/volunteer-drivers/{id}/status"
      - "POST /api/coolers, GET /api/coolers/{id}, GET /api/coolers/{id}/cooler-reservations"
      - "POST /api/rescue-runs, GET /api/rescue-runs"
      - "POST /api/donor-sites/{id}/tax-receipts"
      - "GET /api/rescue-runs/{id}/strike-reports, POST /api/strike-reports/{id}/adjudicate (subject to segregation of duties)"
      - "POST /api/rate-cards"
    shared_operations:
      - "GET /api/donor-sites/{id}, GET /api/donor-sites/{id}/donation-offers, GET /api/donor-sites/{id}/tax-receipts"
      - "GET /api/recipient-agencies/{id}"
      - "GET /api/volunteer-drivers/{id}, GET /api/volunteer-drivers/{id}/availability-windows"
      - "GET /api/donation-offers/{id}, PATCH /api/donation-offers/{id}/status"
      - "GET /api/rescue-runs/{id}, POST /api/rescue-runs/{id}/fail, GET /api/rescue-runs/{id}/temperature-logs, GET /api/rescue-runs/{id}/cooler-reservations"
  - name: DonorCoordinator
    description: "Restaurant donor representative; manages its own site's offers and views its own tax receipts"
    identity: "entity_backed:DonorSite"
    exclusive_operations:
      - "POST /api/donation-offers (donor_site_id must equal X-User-ID)"
    shared_operations:
      - "GET /api/donor-sites/{id} (own id only; others masked as ERR_DONOR_NOT_FOUND)"
      - "GET /api/donor-sites/{id}/donation-offers, GET /api/donor-sites/{id}/tax-receipts (own id only)"
      - "GET /api/donation-offers/{id}, PATCH /api/donation-offers/{id}/status (own offers only; donor-initiated cancel of MATCHED/SCHEDULED auto-files a SYSTEM strike against the donor)"
  - name: VolunteerDriver
    description: "Volunteer driver; declares availability, responds to dispatches, records pickup/temperature/delivery, reports failures"
    identity: "entity_backed:VolunteerDriver"
    exclusive_operations:
      - "POST /api/volunteer-drivers/{id}/availability-windows (own id only)"
      - "POST /api/rescue-runs/{id}/respond, /record-pickup, /record-delivery (assigned driver only)"
    shared_operations:
      - "GET /api/volunteer-drivers/{id}, GET /api/volunteer-drivers/{id}/availability-windows (own id only)"
      - "GET /api/rescue-runs/{id} (assigned runs only), GET /api/rescue-runs/{id}/temperature-logs (assigned runs only)"
      - "POST /api/rescue-runs/{id}/fail (assigned driver or DispatchAdmin)"
  - name: AgencyCoordinator
    description: "Recipient agency intake coordinator; countersigns deliveries for its agency (liability documentation)"
    identity: "entity_backed:RecipientAgency"
    exclusive_operations:
      - "POST /api/rescue-runs/{id}/verify-delivery (only for runs targeting its agency)"
    shared_operations:
      - "GET /api/recipient-agencies/{id} (own id only)"
      - "GET /api/rescue-runs/{id} (runs targeting its agency only), GET /api/rescue-runs/{id}/temperature-logs (same scope)"
