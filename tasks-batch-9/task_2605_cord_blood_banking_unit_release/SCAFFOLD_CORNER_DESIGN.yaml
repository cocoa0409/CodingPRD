      - name: corner_collection_on_a_kit_past_its_shelf_life_returns_kit_expired
        claim_type: temporal_validation
        grounds: "§1.4 priority 24 ERR_KIT_EXPIRED 'the CollectionKit's expires_at is not in the past at collection'; §1.5 POST /cbb/collection-kits sets expires_at := clock + 120 days (KIT_SHELF_LIFE_DAYS)."
