          The lodging request is flawless in its own right — the lease is
          OCCUPIED, it is the unit's current lease, and 4 occupants sit under the
          ceiling of 2 + 3 == 5 — yet it is refused purely because the referenced
          HazardCase is still in REPORTED, i.e. an environmental hazard nobody
          has certified yet cannot authorise taxpayer-funded lodging. The
