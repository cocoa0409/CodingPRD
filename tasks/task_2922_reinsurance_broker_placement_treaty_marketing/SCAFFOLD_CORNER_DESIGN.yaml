      - name: program_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - response_envelope.pagination_fields
          - endpoints.GET /programs
          - endpoints.GET /cedents/{cedent_id}/programs
        distinguishing_aspect: |
          Three non-overlapping programs of one cedent, read with limit 2 / offset 0, return 2 rows
          with total_count 3 and has_more true; offset 2 returns the last row with has_more false.
          The line_of_business filter narrows total_count to the filtered population, not to the
          page size.
        test_recipe:
          setup:
            - "One Cedent with three programs: PROPERTY 2026, MARINE 2026 and CASUALTY 2026 — different lines of business, so validations[priority=50] never fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000 }
              as: BrokerPlacementLead
              captures: { p1: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Marine 2026", line_of_business: "MARINE", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 500000000 }
              as: BrokerPlacementLead
              captures: { p2: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Casualty 2026", line_of_business: "CASUALTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 800000000 }
              as: BrokerPlacementLead
              captures: { p3: $.data.id }
          trigger:
            - call: "GET /programs"
              payload: { cedent_id: "${ced_id}", limit: 2, offset: 0 }
              as: BrokerPlacementLead
              captures: { first_id: "$.data[0].id" }
            - call: "GET /programs"
              payload: { cedent_id: "${ced_id}", limit: 2, offset: 2 }
              as: BrokerPlacementLead
              captures: { last_id: "$.data[0].id" }
            - call: "GET /cedents/${ced_id}/programs"
              payload: { line_of_business: "MARINE", limit: 10, offset: 0 }
              as: BrokerPlacementLead
              captures: { marine_id: "$.data[0].id" }
          assert:
            - "the first page returns response_type == \"array\" with 2 rows, total_count 3, has_more true, limit 2, offset 0"
            - "${first_id} == ${p1}  # created_at ASC ordering"
            - "the second page returns 1 row, total_count 3, has_more false; ${last_id} == ${p3}"
            - "the filtered read returns 1 row with total_count 1 and has_more false; ${marine_id} == ${p2}"

      - name: pagination_limit_outside_one_to_one_hundred_is_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=7]
          - errors.ERR_VALIDATION
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The pagination guard is its own priority-7 rule over collection GETs: limit 101 and
          offset -1 are 422 ERR_VALIDATION, while limit 100 and offset 0 are accepted — the
          boundary is inclusive at both declared ends.
        test_recipe:
          setup:
            - "One Cedent exists so the collection is non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
          trigger:
            - call: "GET /cedents"
              payload: { limit: 101, offset: 0 }
              as: PlatformAdmin
              captures: { err_limit: $.data.error_id }
            - call: "GET /cedents"
              payload: { limit: 10, offset: -1 }
              as: PlatformAdmin
              captures: { err_offset: $.data.error_id }
            - call: "GET /cedents"
              payload: { limit: 100, offset: 0 }
              as: PlatformAdmin
              captures: { ok_id: "$.data[0].id" }
          assert:
            - "${err_limit} == ERR_VALIDATION with HTTP 400"
            - "${err_offset} == ERR_VALIDATION with HTTP 400"
            - "the third call returns HTTP 200 with 1 row, total_count 1, limit 100, offset 0"
            - "${ok_id} == ${ced_id}"

      - name: reinsurer_retrieval_reflects_the_security_status_change
        claim_type: Retrieval
        grounds:
          - endpoints.GET /reinsurers/{reinsurer_id}
          - endpoints.POST /reinsurers/{reinsurer_id}/security-status
          - entities.Reinsurer.fields.security_status
        distinguishing_aspect: |
          A read after a write returns the stored row, not a cached one: the market is created
          APPROVED, moved to RESTRICTED by the control function, and both the action response and
          the subsequent GET show RESTRICTED with the version incremented once — RESTRICTED still
          admits firm orders, so nothing else changes.
        test_recipe:
          setup:
            - "One market Alpha Re, created APPROVED with version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /reinsurers"
              payload: { name: "Alpha Re", security_rating: "AA", capacity_limit_minor: 1000000000, max_line_pct: 100.0000, lead_authorised: true }
              as: PlatformAdmin
              captures: { alpha_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /reinsurers/${alpha_id}/security-status"
              payload: { security_status: "RESTRICTED", reason: "Watchlist downgrade" }
              as: ComplianceOfficer
              as_user_id: "compl-1"
              captures: { after: $.data.security_status, v2: $.data.version }
            - call: "GET /reinsurers/${alpha_id}"
              payload: {}
              as: BrokerPlacementLead
              captures: { read_status: $.data.security_status, read_version: $.data.version }
          assert:
            - "${v1} == 1 and ${after} == RESTRICTED and ${v2} == 2"
            - "${read_status} == RESTRICTED and ${read_version} == 2"
            - "Reinsurer.${alpha_id}.capacity_limit_minor == 1000000000 and available_capacity_minor == 1000000000"
            - "GET /reinsurers with security_status RESTRICTED returns exactly this row"

