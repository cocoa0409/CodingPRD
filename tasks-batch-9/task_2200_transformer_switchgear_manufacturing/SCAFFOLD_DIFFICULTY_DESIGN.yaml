            - call: "POST /component-allocations"
              payload: { long_lead_component_id: "${comp_id}", engineered_order_id: "${ord_id}", quantity: 2, priority_class: 2, need_by_date: "2026-07-01T00:00:00Z", expected_component_version: "${comp_v0}" }
