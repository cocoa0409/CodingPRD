      - name: corner_dispensing_fee_threshold_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.abn_cash_quote
          - calculations.abn_cash_quote.constants
        excluded_because:
          difficulty_instance: dispensing_fee_waived_exactly_at_fifty_thousand_cent_subtotal
          rationale: "That §1.8 instance pins DISPENSING_FEE_CENTS and FEE_WAIVER_SUBTOTAL_CENTS at the exact boundary: a subtotal of exactly 50000 waives the fee (total 50000) while a subtotal of 49999 charges it (total 52499), which is the threshold-at / threshold-1 pair for this constant set."

      - name: corner_par_stock_posture_threshold_boundaries
        claim_type: Constants Applied
        grounds:
          - calculations.par_stock_posture
          - state_machines[ClinicParLevel.stock_posture]
        excluded_because:
          difficulty_instance: par_stock_posture_exact_critical_floor_and_par_min_boundaries
          rationale: "That §1.8 instance walks on_hand_qty across every posture boundary (par_min exactly, critical_floor exactly, one below each) and shows that a reservation moves available_qty without moving stock_posture, covering the threshold algorithm's boundary rows."

      - name: corner_patient_responsibility_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.patient_responsibility.variants
        excluded_because:
          difficulty_instance: patient_responsibility_insurance_vs_abn_cash_variant_divergence
          rationale: "That §1.8 instance runs two structurally identical encounters through the two variants and asserts the delta between INSURANCE_ASSIGNED and ABN_CASH_SELFPAY, including that the cash variant copies the signed notice's estimated_cost_cents (dispensing fee included) and leaves billable_amount_cents at 0."

      - name: corner_supplier_turnaround_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.supplier_turnaround_score.variants
        excluded_because:
          difficulty_instance: supplier_turnaround_promised_basis_vs_elapsed_basis_divergence
          rationale: "That §1.8 instance shows the two score bases diverging on the SAME order once rework has occurred: promised_basis ignores the adjustment rounds while elapsed_basis charges ADJUSTMENT_PENALTY_POINTS per round and measures through accepted_at, and only the elapsed basis feeds the supplier rollup."

      - name: corner_restock_refund_evaluation_order
        claim_type: Precision
        grounds:
          - calculations.restock_refund
          - calculations.restock_refund.precision
        excluded_because:
          difficulty_instance: restock_refund_pinned_evaluation_order_mode_c
          rationale: "That §1.8 instance pins the whole evaluation order of restock_refund (device bucket rounded first, fitting bucket as the exact remainder, each refund line rounded separately at its own fee rate) and contrasts the pinned result against the round-once-at-the-end alternative."

      - name: corner_same_or_similar_half_open_window
        claim_type: Correct Result
        grounds:
          - calculations.same_or_similar_lookback
        excluded_because:
          difficulty_instance: same_or_similar_half_open_window_closes_exactly_at_useful_lifetime
          rationale: "That §1.8 instance tests the chronological month arithmetic at the exact edge of the half-open window [0, reasonable_useful_lifetime_months), including the day-of-month correction, so the boundary rows for this calculation are already covered at depth."

  - section: validations
    instances:
      - name: corner_par_level_creation_and_receipt_constraints_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=51]
          - validations[priority=59]
          - validations[priority=62]
          - errors[ERR_DUPLICATE_PAR_LEVEL]
          - errors[ERR_PRODUCT_CATEGORY_MISMATCH]
          - errors[ERR_PAR_MAX_EXCEEDED]
          - endpoints[POST /dme/par-levels]
          - endpoints[POST /dme/par-levels/{id}/stock-receipts]
        distinguishing_aspect: |
          Four separate shelf-creation guards fire off one small fixture, each
          on its own request: the (clinic_id, product_id) uniqueness rule
          (priority 51), the par_min_qty <= par_max_qty half of priority 62,
          the "no shelf for a CUSTOM_FABRICATED product" half of priority 59,
          and the receipt-overshoot half of priority 62 (on_hand 6 + 21 = 27
          would exceed par_max 20). The receipt case is the interesting one:
          the ceiling is checked against the POST-receipt on-hand total, not
          against received_qty alone, so a receipt of 21 is rejected even
          though 21 is itself larger than par_max only after the existing 6
          units are added.
        test_recipe:
          setup:
            - "one accredited SPINE clinic, one attested supplier, three products (two OFF_SHELF_PREFAB and one CUSTOM_FABRICATED)"
            - "one shelf for the first off-shelf product at par_min 4 / par_max 20, stocked to 6 units"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: true, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_shelf_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0631", description: "LSO brace, second off-shelf line", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE_ALT", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 18000, cash_price_cents: 9900, unit_cost_cents: 5200, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_spare_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L1960", description: "AFO, custom fabricated", category: "CUSTOM_FABRICATED", specialty: "SPINE", same_or_similar_group: "AFO_CUSTOM", reasonable_useful_lifetime_months: 36, allowed_amount_cents: 42000, cash_price_cents: 24000, unit_cost_cents: 15000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_custom_id: $.data.id }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_shelf_id}", par_min_qty: 4, par_max_qty: 20 }
              as: InventoryManager
              captures: { par_id: $.data.id }
            - call: "POST /dme/par-levels/${par_id}/stock-receipts"
              payload: { received_qty: 6 }
              as: InventoryManager
              captures: { par_on_hand: $.data.on_hand_qty, par_v: $.data.version }
          trigger:
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_shelf_id}", par_min_qty: 2, par_max_qty: 30 }
              as: InventoryManager
              captures: { err_dup: $.data.error_id }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_spare_id}", par_min_qty: 25, par_max_qty: 20 }
              as: InventoryManager
              captures: { err_min_over_max: $.data.error_id }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_custom_id}", par_min_qty: 1, par_max_qty: 5 }
              as: InventoryManager
              captures: { err_category: $.data.error_id }
            - call: "POST /dme/par-levels/${par_id}/stock-receipts"
              payload: { received_qty: 21 }
              as: InventoryManager
              captures: { err_receipt: $.data.error_id }
            - call: "GET /dme/par-levels/${par_id}"
              payload: {}
              as: InventoryManager
              captures: { par_on_hand_after: $.data.on_hand_qty, par_v_after: $.data.version }
          assert:
            - "${par_on_hand} == 6"
            - "${err_dup} == ERR_DUPLICATE_PAR_LEVEL with HTTP 409"
            - "${err_min_over_max} == ERR_PAR_MAX_EXCEEDED with HTTP 422"
            - "${err_category} == ERR_PRODUCT_CATEGORY_MISMATCH with HTTP 422"
            - "${err_receipt} == ERR_PAR_MAX_EXCEEDED with HTTP 422"
            - "${par_on_hand_after} == 6 and ${par_v_after} == ${par_v}: every rejected request left the shelf untouched, version included"

      - name: corner_stock_receipt_to_exactly_par_max_succeeds
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=62]
          - calculations.par_stock_posture
          - endpoints[POST /dme/par-levels/{id}/stock-receipts]
        distinguishing_aspect: |
          The receipt ceiling is inclusive: a receipt that lands on_hand_qty
          exactly on par_max_qty (0 + 20 with par_max 20) is accepted, so the
          rejected case one unit higher in the previous instance is a boundary
          and not a blanket refusal. The accepted receipt also fixes the
          derived fields in the SAME response body: on_hand 20, reserved 0,
          available 20, lifetime_received 20, stock_posture OK, version 2.
        test_recipe:
          setup:
            - "one accredited SPINE clinic, one attested supplier, one OFF_SHELF_PREFAB product and an empty shelf at par_min 4 / par_max 20"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_id: $.data.id }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_id}", par_min_qty: 4, par_max_qty: 20 }
              as: InventoryManager
              captures: { par_id: $.data.id, par_v0: $.data.version, posture_empty: $.data.stock_posture }
          trigger:
            - call: "POST /dme/par-levels/${par_id}/stock-receipts"
              payload: { received_qty: 20 }
              as: InventoryManager
              captures: { on_hand: $.data.on_hand_qty, reserved: $.data.reserved_qty, available: $.data.available_qty, lifetime: $.data.lifetime_received_qty, posture: $.data.stock_posture, par_v1: $.data.version }
          assert:
            - "HTTP 201; the receipt is accepted because on_hand_qty lands on par_max_qty exactly, not above it"
            - "${posture_empty} == STOCKOUT and ${par_v0} == 1 (a shelf is born empty and stocked out)"
            - "${on_hand} == 20 and ${lifetime} == 20"
            - "${reserved} == 0 and ${available} == 20"
            - "${posture} == OK"
            - "${par_v1} == 2"

      - name: corner_duplicate_npi_across_the_whole_practice_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=50]
          - errors[ERR_DUPLICATE_NPI]
          - endpoints[POST /dme/clinics/{id}/physicians]
        distinguishing_aspect: |
          NPI uniqueness is practice-wide, not clinic-scoped: the same npi is
          rejected both on a second POST under the SAME clinic and on a POST
          under a DIFFERENT clinic. A per-clinic unique index would accept the
          second case, so the two triggers separate the two readings. A
          different npi under the same clinic still succeeds, which shows the
          rejection is keyed on npi and not on (clinic, full_name).
        test_recipe:
          setup:
            - "two accredited SPINE clinics; one physician with npi 1700000301 already registered at the first clinic"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_a_id: $.data.id }
            - call: "POST /dme/clinics"
              payload: { name: "South Ortho", state_code: "OH", accreditation_body: "BOC", accreditation_expires_on: "2027-09-30", ioas_supervision_level: "GENERAL", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_b_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_a_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000301", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_a_id: $.data.id }
          trigger:
            - call: "POST /dme/clinics/${clinic_a_id}/physicians"
              payload: { full_name: "Ora Vance II", npi: "1700000301", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { err_same_clinic: $.data.error_id }
            - call: "POST /dme/clinics/${clinic_b_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000301", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { err_other_clinic: $.data.error_id }
            - call: "POST /dme/clinics/${clinic_a_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000302", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_ok_id: $.data.id }
          assert:
            - "${err_same_clinic} == ERR_DUPLICATE_NPI with HTTP 409"
            - "${err_other_clinic} == ERR_DUPLICATE_NPI with HTTP 409, proving the index is practice-wide"
            - "${phys_ok_id} is a fresh id with HTTP 201: the same full_name with a different npi is accepted at the same clinic"
            - "GET /dme/clinics/${clinic_a_id}/physicians has total_count 2 and GET /dme/clinics/${clinic_b_id}/physicians has total_count 0"

      - name: corner_reservation_and_fabrication_route_gates_rejected
        claim_type: Conditional validation
        grounds:
          - validations[priority=59]
          - validations[priority=61]
          - validations[priority=58]
          - errors[ERR_PRODUCT_CATEGORY_MISMATCH]
          - errors[ERR_INSUFFICIENT_PAR_STOCK]
          - errors[ERR_CUSTOM_FAB_NOT_SUPPORTED]
          - endpoints[POST /dme/encounters/{id}/reservations]
          - endpoints[POST /dme/encounters/{id}/custom-fab-orders]
        distinguishing_aspect: |
          The two fulfilment routes are mutually exclusive and each rejects the
          other's product class: a shelf reservation demands
          OFF_SHELF_PREFAB or CUSTOM_FITTED_PREFAB (priority 59) and a
          fabrication order demands a supplier with custom_fab_capable == true
          (priority 58). The stock gate is the third, quantity-driven case:
          available_qty is 1 while the encounter asks for 2, so priority 61
          fires even though the shelf exists and is not stocked out. All three
          are conditional on entity configuration, not on state, and none of
          them mutates the shelf.
        test_recipe:
          setup:
            - "one accredited SPINE clinic with one physician, one CUSTOM_AND_OFF_SHELF fitter and one patient"
            - "one attested supplier that is NOT custom-fab capable, one OFF_SHELF_PREFAB product with a shelf holding a single unit, and one CUSTOM_FABRICATED product with no shelf"
            - "two documented encounters: one for 2 units of the off-shelf product, one for 1 unit of the custom-fabricated product"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
