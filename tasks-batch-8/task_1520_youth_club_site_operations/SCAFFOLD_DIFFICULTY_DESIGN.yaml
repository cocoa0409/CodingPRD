  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: staff_assignment_blocked_by_lapsed_staff_compliance
        grounds:
          - state_machines.RotationAssignment.transitions
          - entities.Staff.fields.compliance_status
          - errors[ERR_STAFF_NOT_COMPLIANT]
        distinguishing_aspect: |
          Entity pair RotationAssignment -> Staff: creating a STAFF-kind
          assignment is gated on the referenced Staff row's computed
          compliance_status; after the background-check credential is moved
          into the past (LAPSED), the create is rejected
          ERR_STAFF_NOT_COMPLIANT.
        test_recipe:
          setup: ["frontline staff F was ACTIVE, then background check expiry updated into the past -> LAPSED; club day OPEN; area exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
