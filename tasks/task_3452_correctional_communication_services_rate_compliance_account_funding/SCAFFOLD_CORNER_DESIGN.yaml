              payload: { expected_contract_version: "${c_v2}" }
              as: PlatformAdmin
              captures: { s2_status: $.data.status }
          assert:
            - "stale attempt: 412 err == ERR_STALE_VERSION (c_v was observed before S1's activation bumped it)"
            - "fresh attempt: s2_status == ACTIVE"
            - "RateSchedule.${s1_id}.status == SUPERSEDED after S2 activates"
            - "FacilityContract.${c_id}.version == ${c_v} + 2 after both activations"

      - name: stale_cap_version_on_amend_returns_412
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[regulatory-cap-amend-stale]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on the cap row itself: an amendment carrying the pre-amendment version is 412 ERR_STALE_VERSION while the current version succeeds — two strictly sequential PUTs, no overlap needed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One RegulatoryCap for ST (version captured at creation)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/regulatory-caps"
