            - { call: "POST /api/device-lots/${lot_id}/release", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { disp_end: "$.data.disposition_status" } }
          assert:
            - "place-hold: hold_status == ON_HOLD while disposition_status stays COMPLETED (dimensions independent)"
