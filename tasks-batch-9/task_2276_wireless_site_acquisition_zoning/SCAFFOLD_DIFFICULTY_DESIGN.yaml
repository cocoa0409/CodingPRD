  # =========================================================================
  # Rule 9 — compensating invariants over different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: execute_then_terminate_conserves_landlord_executed_lease_count
        grounds:
          - calculations.landlord_executed_lease_ledger
          - state_machines.LeaseAgreement.ACCEPTED_to_EXECUTED
          - state_machines.LeaseAgreement.EXECUTED_to_TERMINATED
          - entities.Landlord.fields.executed_lease_count
        distinguishing_aspect: |
          Conserved quantity: Landlord.executed_lease_count. Executing the lease raises it 0 -> 1 and the
          compensating terminate returns it to exactly 0, with the candidate relinquished and no residual
          drift in the count even though committed_rent_final_usd stays recorded on the lease.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an ACCEPTED lease on an ACTIVE landlord with executed_lease_count 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur_id: $.data.id }
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
            - call: "POST /landlords"
              payload: { legal_name: "Beacon Holdings LLC", entity_type: "LLC", contact_email: "asset@beacon.example", market_code: "MKT-NE-01", outreach_optout: false }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { ll_id: $.data.id }
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "${ll_id}", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "TOWER", lat: 42.3510, lon: -71.0620, distance_from_center_m: 200, agl_m: 60, months_to_availability: 3, measured_rsrp_dbm: -88, offered_capacity_gbps: 10 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { cand_id: $.data.id }
            - call: "POST /candidates/${cand_id}/outreach-events"
              payload: { event_type: "OUTREACH_SENT" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /candidates/${cand_id}/outreach-events"
              payload: { event_type: "LANDLORD_REPLY" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /leases"
              payload: { candidate_id: "${cand_id}", landlord_id: "${ll_id}", negotiating_agent_user_id: "agent-001", base_monthly_rent_usd: 2400.00, escalation_type: "FIXED_PCT", escalation_pct: 0.03, initial_term_years: 5, renewal_option_count: 2, renewal_term_years: 5, equipment_expansion_sqft: 120, revenue_share_pct: 0.05 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/rounds"
              payload: { action: "SUBMIT", counter_rent_usd: 2400.00 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${lease_id}/rounds"
              payload: { action: "ACCEPT" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
          trigger:
            - call: "POST /leases/${lease_id}/execute"
              payload: { execution_date: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "director-001"
            - call: "POST /leases/${lease_id}/terminate"
              payload: { reason: "landlord withdrew consent" }
              as: ProgramDirector
              as_user_id: "director-001"
          assert:
            - "before the execute Landlord.${ll_id}.executed_lease_count == 0"
            - "after the execute Landlord.${ll_id}.executed_lease_count == 1 and Candidate.${cand_id}.acquisition_status == LEASE_EXECUTED"
            - "after the terminate Landlord.${ll_id}.executed_lease_count == 0"
            - "LeaseAgreement.${lease_id}.status == TERMINATED"
            - "LeaseAgreement.${lease_id}.committed_rent_final_usd == 562431.16"
            - "Candidate.${cand_id}.acquisition_status == RELINQUISHED"
            - "SearchRing.${ring_id}.candidate_count == 0"

      - name: order_create_then_cancel_conserves_provider_committed_crew_days
        grounds:
          - calculations.provider_crew_day_ledger
          - state_machines.UtilityBackhaulOrder.REQUESTED_to_CANCELLED
          - entities.UtilityProvider.fields.committed_crew_days
        distinguishing_aspect: |
          A different conserved quantity: UtilityProvider.committed_crew_days. Requesting a 4-day window
          raises it 0 -> 4 and cancelling that order returns it to exactly 0, while the order's own
          crew_days field remains 4 — the ledger drops the row rather than zeroing its stored width.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one candidate and one provider with concurrent_crew_capacity 2 and committed_crew_days 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
