              payload: {}
              as: ContractsOfficer
            - call: "POST /v1/production-lines/${line_id}/suspend"
              payload: {}
              as: PlantManager
            - call: "POST /v1/component-lots"
              payload: { supplier_name: "GlassCo", lot_code: "LOT-PEND-1", component_type: "GLASS", country_of_origin: "US", lot_cost_usd: 400.0 }
              as: SupplyChainAuditor
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /v1/deliveries"
              payload: { reservation_id: "${res_id}", scheduled_window_start: "2027-06-01T00:00:00Z", scheduled_window_end: "2027-07-01T00:00:00Z", volume_mw: 1.0, lot_ids: ["${lot_id}"] }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
          assert:
            - "response.http_status == 422"
            - "response.error_id == ERR_LOT_NOT_VERIFIED (priority 6 business_safety beats priority 16 state)"

      - name: overlap_check_precedes_volume_check
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: |
          Error-category pair = business_temporal (priority 8, ERR_WINDOW_OVERLAP)
          vs business_constraint (priority 9, ERR_VOLUME_EXCEEDS_CONTRACT) — a
          different pair than business_safety vs state. The request both overlaps
