      - name: shared_endpoints_partition_their_actions_between_the_two_holder_roles
        claim_type: role_permitted_operations
        grounds:
          - validations.priority_21
          - endpoints.POST_/work-packages/{id}/transparency
          - endpoints.POST_/subcontracts/{id}/bond-claim
          - roles.ProcurementOfficer
          - roles.IndependentAuditor
        distinguishing_aspect: |
          Two endpoints are shared between roles, and on both the sharing is per-action rather than
          per-endpoint: the publisher of the open-book breakdown must not be its certifier, and the
          party that files a bond claim must not be the party that records what the surety paid. The
          endpoint-level gate at priority 20 admits both holders, so only the action-level gate at
          priority 21 can distinguish them - an implementation that stops at the roles list lets the
          same actor do both halves.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z, advanced to 2026-08-15T00:00:00Z"
          setup_api_calls:
