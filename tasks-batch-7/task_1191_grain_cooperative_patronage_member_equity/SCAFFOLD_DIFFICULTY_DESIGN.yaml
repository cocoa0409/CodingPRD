  # ============================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ============================================================
  - rule_id: transitive_cascade
    instances:
      - name: estate_claim_approval_cascades_to_disbursement
        grounds:
          - state_machines.EstateClaim.PROBATED_to_APPROVED
          - state_machines.Member.ACTIVE_to_DECEASED
          - state_machines.EquityCertificate.FROZEN_to_ACTIVE
          - state_machines.RedemptionRequest.APPROVED_to_PAID
        distinguishing_aspect: |
          Depth-4 cascade triggered by EstateClaim approval: board approval of
          PROBATED claim (hop 1) → unfreezes deceased member's certificates
          (hop 2) → executor's RedemptionRequest can be APPROVED (hop 3) →
          disbursement moves certificates to REDEEMED and updates member
          equity balances (hop 4). Each hop is caused by the previous one.
        test_recipe:
          setup:
            - "District DIST-G, Member M9 (deceased), Member M10 (executor, class=ESTATE)"
            - "M9 had 1 ACTIVE certificate C_M9 face 80000c (now FROZEN)"
            - "EstateClaim EC1 in PROBATED (claim_window_days elapsed)"
            - "PASSED BoardResolution APPROVE_ESTATE for EC1"
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-G", name: "District G", max_delegates: 3 }
