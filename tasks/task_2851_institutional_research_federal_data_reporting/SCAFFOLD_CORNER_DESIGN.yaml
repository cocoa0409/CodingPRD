      - name: corner_ep_metric_patch_recomputes_variance_and_flags_the_row_restated
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /ir/component-metrics/{metric_id}]
          - calculations.prior_year_variance_pct
          - entities.ComponentMetric.fields.restated
        distinguishing_aspect: |
          variance_pct is null at creation (the formula runs on prepare and on PATCH only), becomes
          12.5 when the value is corrected to 1125, and returns to 0.0 when corrected back to
          1000 — but `restated` is sticky true once set, so the audit trail survives the round trip.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED with a DRAFT ENROLLMENT component carrying TOTAL_HEADCOUNT 1000 against a prior year of 1000."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60156", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1000, prior_year_value: 1000, source_field_path: "sis.enrollment.headcount" }
              as: IRAnalyst
              captures: { met: $.data.id }
          trigger:
            - call: "PATCH /ir/component-metrics/${met}"
              payload: { reported_value: 1125, restatement_note: "Residency reclassification added 125 students after the extract was pulled." }
              as: IRAnalyst
            - call: "PATCH /ir/component-metrics/${met}"
              payload: { reported_value: 1000 }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
          assert:
            - "At creation: ComponentMetric.${met}.variance_pct is null, restated == false, restatement_note is null, version == 1"
            - "First PATCH: HTTP status == 200, reported_value == 1125, variance_pct == 12.5, restated == true, restatement_note stored, version == 2"
            - "Second PATCH: reported_value == 1000, variance_pct == 0.0, restated is still true, restatement_note unchanged, version == 3"
            - "GET /ir/component-metrics/${met} -> data.variance_pct == 0.0 and data.restated == true"
            - "Prepare: SurveyComponent.${comp}.edit_status == CLEARED and GET /ir/edit-checks?component_id=${comp} -> total_count == 0"

      - name: corner_ep_member_outcome_patch_reprices_the_cohort_and_is_refused_once_locked
        claim_type: Conditional action
        grounds:
          - endpoints[PATCH /ir/cohort-members/{member_id}]
          - errors[ERR_COHORT_LOCKED]
          - calculations.cohort_rate_variants
        distinguishing_aspect: |
          The same PATCH is legal on a DRAFT cohort (retention rises from 50.0 to 100.0 in the
          mutating response) and refused with ERR_COHORT_LOCKED once the roster is locked — the
          roster is frozen by cohort status, not by the cycle's posture.
        test_recipe:
          setup:
            - "A DRAFT RETENTION_FT cohort for FALL2025 holds S001 STILL_ENROLLED and S002 NO_LONGER_ENROLLED."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/cohorts"
              payload: { cohort_type: "RETENTION_FT", entry_term: "FALL2025", publication_metric_key: "RETENTION_FT_FALL2025" }
              as: RegistrarOfficer
              captures: { coh: $.data.id }
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S001", entry_status: "FULL_TIME", outcome: "STILL_ENROLLED" }
              as: RegistrarOfficer
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S002", entry_status: "FULL_TIME", outcome: "NO_LONGER_ENROLLED" }
              as: RegistrarOfficer
              captures: { m2: $.data.id }
          trigger:
            - call: "PATCH /ir/cohort-members/${m2}"
              payload: { outcome: "COMPLETED_150" }
              as: RegistrarOfficer
            - call: "POST /ir/cohorts/${coh}/lock"
              payload: {}
              as: RegistrarOfficer
            - call: "PATCH /ir/cohort-members/${m2}"
              payload: { outcome: "STILL_ENROLLED" }
              as: RegistrarOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Before the PATCH: CohortDefinition.${coh}.retained_count == 1, federal_rate_pct == 50.0, ranking_rate_pct == 50.0"
            - "First PATCH: HTTP status == 200, CohortMember.${m2}.outcome == COMPLETED_150, version == 2"
            - "CohortDefinition.${coh}.completers_count == 1, retained_count == 2, federal_rate_pct == 100.0, ranking_rate_pct == 100.0"
            - "Lock: HTTP status == 200, status == LOCKED, locked_at == \"2026-11-01T00:00:00.000Z\""
            - "Second PATCH: HTTP status == 409 and response.error_id == \"ERR_COHORT_LOCKED\""
            - "CohortMember.${m2}.outcome == COMPLETED_150 and version == 2 (unchanged)"

      - name: corner_ep_transmit_is_gated_on_both_the_submission_and_the_cycle
        claim_type: Conditional action
        grounds:
          - endpoints[POST /ir/external-submissions/{submission_id}/transmit]
          - errors[ERR_INVALID_SUBMISSION_STATE]
          - errors[ERR_CYCLE_NOT_FROZEN]
          - state_machines.ExternalSubmission.RECONCILED_to_TRANSMITTED
        distinguishing_aspect: |
          Two independent gates guard one action and fail with different ids: a DRAFT submission
          gives ERR_INVALID_SUBMISSION_STATE, and a RECONCILED submission on a merely CENSUS_LOCKED
          cycle gives ERR_CYCLE_NOT_FROZEN — the transmission only fires once both the submission
          and the cycle are ready.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED with a CERTIFIED ENROLLMENT component reporting TOTAL_HEADCOUNT 1000."
            - "A DRAFT STATE submission to the State Board reports 1002 for TOTAL_HEADCOUNT."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60157", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1000, prior_year_value: 1000, source_field_path: "sis.enrollment.headcount" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the enrollment component as reported to the federal collection." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/external-submissions"
              payload: { cycle_id: "${cyc}", component_id: "${comp}", target_type: "STATE", target_name: "State Board of Higher Education", metric_key: "TOTAL_HEADCOUNT", reported_value: 1002 }
              as: IRAnalyst
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /ir/external-submissions/${sub}/transmit"
              payload: { transmission_reference: "STATE-2027-0001" }
              as: IRDirector
              as_user_id: "director-1"
              captures: { err1: $.data.error_id }
            - call: "POST /ir/external-submissions/${sub}/reconcile"
              payload: {}
              as: IRAnalyst
            - call: "POST /ir/external-submissions/${sub}/transmit"
              payload: { transmission_reference: "STATE-2027-0001" }
              as: IRDirector
              as_user_id: "director-1"
              captures: { err2: $.data.error_id }
            - call: "POST /ir/reporting-cycles/${cyc}/freeze"
              payload: {}
              as: IRDirector
            - call: "POST /ir/external-submissions/${sub}/transmit"
              payload: { transmission_reference: "STATE-2027-0001" }
              as: IRDirector
              as_user_id: "director-1"
          assert:
            - "First transmit: HTTP status == 409 and response.error_id == \"ERR_INVALID_SUBMISSION_STATE\""
            - "Reconcile: raw_delta_pct == 0.20, allowance_pct == 0.00, effective_delta_pct == 0.20, tolerance_pct == 0.50, status == RECONCILED"
            - "Second transmit: HTTP status == 409 and response.error_id == \"ERR_CYCLE_NOT_FROZEN\", ExternalSubmission.${sub}.status still RECONCILED and transmitted_at is null"
            - "Freeze: ReportingCycle.${cyc}.snapshot_posture == FROZEN"
            - "Third transmit: HTTP status == 200, status == TRANSMITTED, transmission_reference == \"STATE-2027-0001\", transmitted_at == \"2026-11-01T00:00:00.000Z\""

  - section: errors
    instances:
      - name: corner_err_missing_or_unknown_role_header_is_unauthenticated
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - rbac.roles
        distinguishing_aspect: |
          Both header defects collapse to the same 401: omitting X-User-Role / X-User-ID entirely and
          sending a role string outside the five declared roles. Authentication is decided before
          any RBAC or resource lookup, so a valid cycle id still yields 401 rather than 403 or 404.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 exists and is readable by all five roles."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id }
          trigger:
            - call: "GET /ir/reporting-cycles/${cyc}"
              payload: {}
              as: IRAnalyst
              captures: { err1: $.data.error_id }
            - call: "GET /ir/reporting-cycles/${cyc}"
              payload: {}
              as: ProvostOffice
              captures: { err2: $.data.error_id }
            - call: "GET /ir/reporting-cycles/${cyc}"
              payload: {}
              as: IRAnalyst
          assert:
            - "First call is issued with BOTH the X-User-Role and X-User-ID headers removed: HTTP status == 401 and response.error_id == \"ERR_UNAUTHENTICATED\""
            - "Second call is issued with X-User-Role: ProvostOffice (not one of the five declared roles): HTTP status == 401 and response.error_id == \"ERR_UNAUTHENTICATED\""
            - "Neither 401 leaks the resource: the response carries only error_id and message"
            - "Third call, properly headed: HTTP status == 200 and data.cycle_code == \"IPEDS-2027\""

      - name: corner_err_every_not_found_id_is_reachable_by_path_or_body_reference
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_FROZEN_FILE_NOT_FOUND]
          - errors[ERR_COMPONENT_NOT_FOUND]
          - errors[ERR_METRIC_NOT_FOUND]
          - errors[ERR_EDIT_CHECK_NOT_FOUND]
          - errors[ERR_COHORT_NOT_FOUND]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_DEFINITION_NOT_FOUND]
          - errors[ERR_MAPPING_NOT_FOUND]
          - errors[ERR_SUBMISSION_NOT_FOUND]
          - errors[ERR_PUBLICATION_NOT_FOUND]
          - errors[ERR_RESTATEMENT_NOT_FOUND]
          - errors[ERR_DATA_REQUEST_NOT_FOUND]
          - errors[ERR_CELL_NOT_FOUND]
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: |
          Each of the fourteen entity families answers an unknown id with its OWN 404 id rather than
          a generic one, and the same discrimination applies to body-borne references: an unknown
          cycle_id and an unknown frozen_file_id on the very same POST return
          ERR_CYCLE_NOT_FOUND and ERR_FROZEN_FILE_NOT_FOUND respectively.
