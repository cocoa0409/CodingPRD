        claim_type: Precision
        grounds:
          - calculations.prize_pool_remaining
        excluded_because:
          difficulty_instance: physical_grant_nested_rounding_floor_then_sum
          rationale: "The §1.8 combinatorial_formula instance pins floor-then-sum at 120 against the sum-then-floor reading of 121."

      - name: tier_pool_tier_and_member_threshold_interaction
        claim_type: Correct Result
        grounds:
          - calculations.tier_prize_support_pool
        excluded_because:
          difficulty_instance: championship_pool_tier_and_member_threshold_interaction
          rationale: "The second §1.8 combinatorial_formula instance pins 96 versus 108 across the fourth-member boundary."

