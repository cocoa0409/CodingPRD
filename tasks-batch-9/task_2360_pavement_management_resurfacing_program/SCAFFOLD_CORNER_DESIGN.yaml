      - name: service_request_sla_equality_is_not_a_breach_but_one_second_later_is
        claim_type: threshold
        grounds: ["calculations.service_request_sla", "entities.ServiceRequest.fields.sla_due_at", "entities.ServiceRequest.fields.sla_breached"]
        distinguishing_aspect: "The comparison is strictly greater-than: at the logical clock EXACTLY equal to sla_due_at (2026-08-04T00:00:00Z, created_at + 72 h for HIGH) sla_breached is false, and moving the clock one single second to 2026-08-04T00:00:01Z flips the same untouched row to true — with no write in between, proving the flag is derived at read time from the clock."
        test_recipe:
          setup:
            - "Empty database."
            - "Maple St exists and the logical clock is 2026-08-01T00:00:00Z."
            - "A resident files a HIGH-severity POTHOLE request, so SLA_HOURS[HIGH] = 72 gives sla_due_at 2026-08-04T00:00:00Z."
            - "The request is left in request_status NEW so the reference instant is the clock, not closed_at."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/service-requests"
              payload: { segment_id: "${seg1}", complaint_type: "POTHOLE", reported_severity: "HIGH", location_note: "deep pothole at 1200 block driveway" }
              as: Resident
              as_user_id: "resident-1"
              captures: { sr1: "$.data.id" }
          trigger:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: PavementEngineer
            - call: "GET /pavement/service-requests/${sr1}"
              payload: {}
              as: PavementEngineer
              captures: { due_eq: "$.data.sla_due_at", breach_eq: "$.data.sla_breached", st_eq: "$.data.request_status" }
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:01Z" }
              as: PavementEngineer
            - call: "GET /pavement/service-requests/${sr1}"
              payload: {}
              as: PavementEngineer
              captures: { breach_after: "$.data.sla_breached", due_after: "$.data.sla_due_at" }
          assert:
            - "At the clock 2026-08-04T00:00:00Z: data.sla_due_at == '2026-08-04T00:00:00Z' and data.sla_breached == false."
            - "At the clock 2026-08-04T00:00:01Z: data.sla_breached == true."
            - "data.sla_due_at is identical in both reads ('2026-08-04T00:00:00Z') — the deadline did not move, only the comparison flipped."
            - "request_status is 'NEW' in both reads and data.closed_at is null throughout."
            - "A MEDIUM request created at the same instant would carry sla_due_at 2026-08-08T00:00:00Z (168 h), so the 72 came from the severity table, not a global default."

      - name: waterfall_benefit_cost_strategy_reranks_the_identical_candidate_pool
        claim_type: waterfall_allocation
        grounds: ["calculations.scenario_waterfall_allocation", "entities.BudgetScenario.fields.strategy", "entities.ScenarioAllocation.fields.rank"]
        distinguishing_aspect: "Two scenarios over the SAME two candidates and the SAME 20,000,000 cents fund the same street but in mirror-image order: WORST_FIRST ranks the 30.0 reconstruction first (rank 1, DEFERRED at 237,099,941) and the 69.1 overlay second (rank 2, FUNDED), while BENEFIT_COST — bcr 14381.0110 vs 11809.3631 — ranks the overlay first. Both report funded_cost 10,743,323 and backlog 237,099,941, so ONLY rank distinguishes them."
