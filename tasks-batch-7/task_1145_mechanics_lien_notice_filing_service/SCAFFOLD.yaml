# =============================================================================
# SCAFFOLD.yaml — Mechanics Lien Notice & Filing Service (NCS/Levelset style)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1145. Mechanics Lien Notice & Filing Service (NCS/Levelset style service):
  project/party research (owner/GC/lender) & property description, preliminary
  notice deadline by state & delivery proof, lien filing window from last
  furnishing date, amount calculation & waiver reconciliation, lien release
  upon payment & bonding around lien, foreclosure suit deadline & referral to
  counsel, stop notice & bond claim alternatives, deadline calendaring across
  jurisdictions

domain_name: mechanics-lien-service
api_prefix: /lien

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # regulatory deadlines, delivery proof, immutable filing trail
  secondary_archetype: ledger_reconciliation # claim amount vs waivers vs payments, two amount variants
  complexity_layers:
    - optimistic_concurrency      # OCC on Project.version (furnishing-span supersede) and Company.version (balance adjustments)
    - cascading_side_effects      # rule supersede -> project deadlines -> notice expiry -> company counters; payment verify -> claim release -> project counters
    - dual_variant_calculation    # provisional vs final claim amount; strict vs inclusive last-furnishing date
    - scheduled_actions           # logical clock drives lazy auto-expiry of notices, claims, stop notices, bond claims
    - derived_field_reconciliation # open_notice_count / open_lien_count / lien_posture must reconcile after every cascade
    - version_pinning_on_approval # locked/filed claims pin the JurisdictionRule version in effect at lock; unlocked projections recompute live
  entity_topology: flat           # peer entities joined by FK references; reverse-reachability via sub-resource GETs
  state_machine_shape: branching  # cycles (notice reprepare, lien lock/unlock, referral decline/refer) + auto-expiry branches
  relationship_patterns:
    - one_to_many                 # Project -> Party/FurnishingSpan/NoticeOrder/LienClaim/Waiver/Payment/StopNotice/BondClaim
    - self_referential            # JurisdictionRule.supersedes_rule_id (rule version chain)
    - cross_aggregate             # NoticeOrder -> Party; BondingRequest/BondClaim -> Party(surety); Payment -> LienClaim
  role_model: segregation_of_duties # CustomerAdmin drafts/orders; OpsAgent verifies/serves/files; Counsel acts on referrals; PlatformAdmin configures
  consistency_model: immediate    # every mutation + cascades visible in the same request's response

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: Company
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Claimant company legal name" }
      - { name: contact_email, type: string, source: input, description: "Billing contact email" }
      - { name: prepaid_balance_cents, type: integer, source: system, default: 0, description: "Prepaid service balance; debited by notice fees, credited by balance adjustments" }
      - { name: open_notice_count, type: integer, source: computed, default: 0, description: "Count of NoticeOrders on this company's projects with status IN {DRAFT, SERVED, DELIVERY_FAILED}" }

  - name: JurisdictionRule
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state code, e.g. CA" }
      - { name: project_type, type: enum, source: input, description: "COMMERCIAL_PRIVATE | RESIDENTIAL_PRIVATE | STATE_PUBLIC | FEDERAL_PUBLIC" }
      - { name: prelim_notice_required, type: boolean, source: input, description: "Whether a preliminary notice is required before a lien may be locked" }
      - { name: prelim_days, type: integer, source: input, description: "Days from first furnishing within which the prelim notice must be served" }
      - { name: prelim_day_basis, type: enum, source: input, description: "CALENDAR | BUSINESS — BUSINESS skips Saturdays and Sundays (no holidays)" }
      - { name: refused_counts_as_served, type: boolean, source: input, description: "Whether a REFUSED delivery attempt still proves service" }
      - { name: allowed_delivery_methods, type: array, source: input, description: "Subset of CERTIFIED_MAIL | PERSONAL_SERVICE | EMAIL_STATUTORY" }
      - { name: filing_window_days, type: integer, source: input, description: "Days from last furnishing within which the lien must be filed" }
      - { name: foreclosure_deadline_days, type: integer, source: input, description: "Days from lien filing within which a foreclosure suit must be filed" }
      - { name: stop_notice_days, type: integer, source: input, description: "Days from last furnishing within which a stop notice must be served" }
      - { name: bond_claim_days, type: integer, source: input, description: "Days from last furnishing within which a bond claim must be submitted" }
      - { name: counts_punch_list, type: boolean, source: input, description: "Variant selector: true = PUNCH_LIST/WARRANTY spans extend last furnishing (inclusive); false = strict" }
      - { name: retainage_claimable, type: boolean, source: input, description: "Whether retainage_held_cents is claimable in the final lien amount" }
      - { name: cap_mode, type: enum, source: input, description: "UNCAPPED | CONTRACT_BALANCE — cap final amount at contract_value_cents - verified payments" }
      - { name: interest_annual_rate, type: number, source: input, description: "Base pre-judgment interest annual rate, e.g. 0.10" }
      - { name: bond_pct, type: number, source: input, description: "Bond-to-claim multiplier for bonding around a lien, e.g. 1.25" }
      - { name: effective_from, type: string, source: input, description: "ISO date from which this rule version applies" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | SUPERSEDED" }
      - { name: supersedes_rule_id, type: string, source: system, description: "FK -> JurisdictionRule.id; set on the successor created by /supersede, null on original rules" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: system, description: "FK -> Company.id; taken from the CustomerAdmin's X-User-ID at creation" }
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of the property" }
      - { name: county, type: string, source: input, description: "County of the property (recording jurisdiction)" }
      - { name: project_type, type: enum, source: input, description: "COMMERCIAL_PRIVATE | RESIDENTIAL_PRIVATE | STATE_PUBLIC | FEDERAL_PUBLIC" }
      - { name: property_legal_description, type: string, source: input, description: "Legal property description captured during research" }
      - { name: contract_value_cents, type: integer, source: input, description: "Base contract value in cents" }
      - { name: approved_extras_cents, type: integer, source: input, description: "Approved change-order extras in cents" }
      - { name: retainage_held_cents, type: integer, source: input, description: "Retainage withheld in cents" }
      - { name: research_status, type: enum, source: system, description: "UNRESEARCHED | RESEARCHED | VERIFIED" }
      - { name: first_furnishing_date, type: string, source: computed, description: "Min start_date over ACTIVE FurnishingSpans; null when none" }
      - { name: last_furnishing_date, type: string, source: computed, description: "Per furnishing_date_determination variant selected by the effective rule's counts_punch_list; null when none" }
      - { name: open_notice_count, type: integer, source: computed, default: 0, description: "Count of NoticeOrders on this project with status IN {DRAFT, SERVED, DELIVERY_FAILED}" }
      - { name: open_lien_count, type: integer, source: computed, default: 0, description: "Count of LienClaims on this project with status == FILED" }
      - { name: lien_posture, type: enum, source: computed, description: "CLEAR | NOTICED | ENCUMBERED | LITIGATION — see lien_posture_derivation" }

  - name: Party
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: party_role, type: enum, source: input, description: "OWNER | GC | LENDER | HIRER | SURETY" }
      - { name: legal_name, type: string, source: input, description: "Researched legal name of the party" }
      - { name: address, type: string, source: input, description: "Service address" }
      - { name: research_status, type: enum, source: system, description: "PENDING | VERIFIED | FAILED" }

  - name: FurnishingSpan
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: span_kind, type: enum, source: input, description: "BASE_CONTRACT | CHANGE_ORDER | PUNCH_LIST | WARRANTY" }
      - { name: start_date, type: string, source: input, description: "ISO date of first furnishing in this span" }
      - { name: end_date, type: string, source: input, description: "ISO date of last furnishing in this span; must be >= start_date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED — creating a new span of the same span_kind supersedes the prior ACTIVE one" }

  - name: NoticeOrder
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: recipient_party_id, type: string, source: input, description: "FK -> Party.id; must be a VERIFIED party on the same project" }
      - { name: delivery_method, type: enum, source: input, description: "CERTIFIED_MAIL | PERSONAL_SERVICE | EMAIL_STATUTORY; must be allowed by the effective rule" }
      - { name: status, type: enum, source: system, description: "DRAFT | SERVED | PROOF_CONFIRMED | DELIVERY_FAILED | EXPIRED" }
      - { name: service_deadline, type: string, source: computed, description: "first_furnishing_date + effective rule prelim_days on the rule's day basis; recomputed live while DRAFT, frozen once SERVED" }
      - { name: served_at, type: string, source: system, description: "ISO date service occurred; null until served" }
      - { name: proof_result, type: enum, source: system, description: "DELIVERED | REFUSED | RETURNED; null until proof recorded" }
      - { name: proof_url, type: string, source: system, description: "Delivery proof document URL; null until proof recorded" }
      - { name: fee_cents, type: integer, source: computed, description: "Quoted notice service fee per notice_fee_quote; debited from Company.prepaid_balance_cents at creation" }

  - name: LienClaim
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | AMOUNT_LOCKED | FILED | RELEASED | BONDED_OFF | FORECLOSED | EXPIRED" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Provisional variant of claimable_amount; recomputed on every waiver/payment change while DRAFT" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Final variant of claimable_amount; computed at lock, recomputed on waiver apply/void and payment verify while AMOUNT_LOCKED, frozen once FILED" }
      - { name: gross_snapshot_cents, type: integer, source: system, description: "Gross claimable value snapshotted at lock (contract + extras - excluded retainage); null until locked" }
      - { name: verified_paid_cents, type: integer, source: computed, default: 0, description: "Sum of VERIFIED Payment.amount_cents on this project (any lien_claim_id)" }
      - { name: effective_waiver_cents, type: integer, source: computed, default: 0, description: "Sum of effective APPLIED waivers per claimable_amount (conditional waivers count only when their condition is met)" }
      - { name: waived_to_extras_cents, type: integer, source: computed, default: 0, description: "Portion of effective waivers allocated to extras per waiver_waterfall" }
      - { name: waived_to_contract_cents, type: integer, source: computed, default: 0, description: "Portion of effective waivers allocated to contract per waiver_waterfall" }
      - { name: outstanding_cents, type: integer, source: computed, description: "final_amount_cents - sum of VERIFIED payments with lien_claim_id == this claim; null until locked; reaching 0 while FILED auto-releases the claim" }
      - { name: filed_at, type: string, source: system, description: "ISO date the lien was recorded; null until FILED" }
      - { name: filing_window_end, type: string, source: computed, description: "last_furnishing_date + locked rule filing_window_days; pinned at lock; null until locked" }
      - { name: foreclosure_deadline, type: string, source: computed, description: "filed_at + locked rule foreclosure_deadline_days; null until FILED" }
      - { name: locked_rule_id, type: string, source: system, description: "FK -> JurisdictionRule.id; rule version pinned at lock; null until locked" }
      - { name: interest_cents, type: integer, source: computed, description: "Pre-judgment interest per prejudgment_interest; computed on read for FILED/FORECLOSED claims; null otherwise" }
      - { name: total_with_interest_cents, type: integer, source: computed, description: "final_amount_cents + interest_cents capped per prejudgment_interest; null until FILED" }

  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: waiver_type, type: enum, source: input, description: "CONDITIONAL_PROGRESS | UNCONDITIONAL_PROGRESS | CONDITIONAL_FINAL | UNCONDITIONAL_FINAL" }
      - { name: amount_cents, type: integer, source: input, description: "Waived amount in cents; must be > 0" }
      - { name: period_start, type: string, source: input, description: "ISO date start of the waived billing period (half-open, inclusive)" }
      - { name: period_end, type: string, source: input, description: "ISO date end of the waived billing period (half-open, exclusive); must be >= period_start" }
      - { name: status, type: enum, source: system, description: "RECEIVED | APPLIED | VOIDED" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: lien_claim_id, type: string, source: input, description: "FK -> LienClaim.id; optional allocation link used for outstanding_cents; null allowed" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; must be > 0" }
      - { name: received_at, type: string, source: input, description: "ISO date the payment was received" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED" }

  - name: BondingRequest
    parent: null
    common_fields: true
    fields:
      - { name: lien_claim_id, type: string, source: input, description: "FK -> LienClaim.id; claim must be FILED" }
      - { name: surety_party_id, type: string, source: input, description: "FK -> Party.id; must be a VERIFIED SURETY on the same project" }
      - { name: bond_amount_cents, type: integer, source: computed, description: "round_half_up(final_amount_cents x locked rule bond_pct) computed at creation" }
      - { name: status, type: enum, source: system, description: "REQUESTED | BOND_RECORDED | REJECTED" }
      - { name: recorded_at, type: string, source: system, description: "ISO date the bond was recorded; null until recorded" }

  - name: ForeclosureReferral
    parent: null
    common_fields: true
    fields:
      - { name: lien_claim_id, type: string, source: input, description: "FK -> LienClaim.id; claim must be FILED" }
      - { name: counsel_name, type: string, source: input, description: "Referral counsel firm name" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACCEPTED | DECLINED | SUIT_FILED | CANCELLED" }
      - { name: suit_filed_at, type: string, source: system, description: "ISO date the foreclosure suit was filed; null until SUIT_FILED" }
      - { name: cancel_reason, type: enum, source: system, description: "MOOT_BONDED | MOOT_RELEASED | MOOT_EXPIRED; set when auto-cancelled; null otherwise" }

  - name: StopNotice
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project must be STATE_PUBLIC" }
      - { name: amount_cents, type: integer, source: input, description: "Amount demanded in cents; must be > 0" }
      - { name: coverage_start, type: string, source: input, description: "ISO date start of claimed coverage (closed interval, inclusive)" }
      - { name: coverage_end, type: string, source: input, description: "ISO date end of claimed coverage (closed interval, inclusive); must be >= coverage_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | SERVED | RELEASED | EXPIRED" }
      - { name: served_at, type: string, source: system, description: "ISO date served; null until SERVED" }

  - name: BondClaim
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project must be STATE_PUBLIC or FEDERAL_PUBLIC" }
      - { name: surety_party_id, type: string, source: input, description: "FK -> Party.id; must be a VERIFIED SURETY on the same project" }
      - { name: amount_cents, type: integer, source: input, description: "Claimed amount in cents; must be > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | PAID | DENIED | EXPIRED" }
      - { name: submitted_at, type: string, source: system, description: "ISO date submitted to the surety; null until SUBMITTED" }
      - { name: resolve_outcome, type: enum, source: system, description: "PAID | DENIED; null until resolved" }

# =============================================================================
# §1.2 State Machine Table
# Auto-transition note (applies to all machines): EXPIRED auto-transitions are
# evaluated LAZILY against the logical clock — whenever the entity is read or
# is the target of a mutation, due auto-transitions are applied first and are
# reflected in that response. The logical clock defaults to
# 2026-05-01T00:00:00Z at server start and only moves via POST /_clock/set_current_utc.
# =============================================================================
state_machines:
  - entity: Project
    field: research_status
    initial_state: UNRESEARCHED
    terminal_states: [VERIFIED]
    transitions:
      - from: UNRESEARCHED
        to: RESEARCHED
        trigger: "POST /lien/projects/{id}/research-advance"
        actor: OpsAgent
        preconditions:
          - "research_status == UNRESEARCHED"
        side_effects:
          - "increments Project.version by 1"
      - from: RESEARCHED
        to: VERIFIED
        trigger: "POST /lien/projects/{id}/research-advance"
        actor: OpsAgent
        preconditions:
          - "research_status == RESEARCHED"
          - "Every required party (roles OWNER and GC always; LENDER additionally when the effective rule's prelim_notice_required is true) has research_status == VERIFIED (ERR_PARTIES_UNVERIFIED)"
        side_effects:
          - "increments Project.version by 1"
      - from: VERIFIED
        to: VERIFIED
        trigger: "POST /lien/projects/{id}/research-advance"
        actor: OpsAgent
        preconditions: ["none — always rejected"]
        side_effects: []
        note: "Advancing an already-VERIFIED project fails with ERR_RESEARCH_ALREADY_VERIFIED (409)"

  - entity: Project
    field: lien_posture
    derivation: |
      Computed, never set directly. Priority order:
      1) LITIGATION if any LienClaim on the project is FORECLOSED, or any ForeclosureReferral is SUIT_FILED
      2) ENCUMBERED if any LienClaim is FILED, or any StopNotice is SERVED, or any BondClaim is SUBMITTED
      3) NOTICED if any NoticeOrder is SERVED or PROOF_CONFIRMED
      4) Otherwise CLEAR
      Recomputed after every mutation touching claims, referrals, notices, stop notices, or bond claims.

  - entity: JurisdictionRule
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /lien/jurisdiction-rules/{id}/supersede (creates the successor rule)"
        actor: PlatformAdmin
        preconditions:
          - "Rule status == PUBLISHED (ERR_RULE_NOT_PUBLISHED)"
          - "expected_jurisdiction_rule_version == rule.version (ERR_STALE_VERSION)"
        side_effects:
          - "New JurisdictionRule created with status PUBLISHED and supersedes_rule_id == this rule's id"
          - "This rule: status -> SUPERSEDED, version incremented by 1"
          - "CASCADE link 1: every Project with matching (state_code, project_type) has its projected deadlines recomputed live against the successor (furnishing_date_determination, prelim_notice_deadline, lien_windows)"
          - "CASCADE link 2: each such Project's DRAFT NoticeOrders whose recomputed service_deadline < current clock date auto-transition DRAFT -> EXPIRED"
          - "CASCADE link 3: each expired NoticeOrder decrements its Project.open_notice_count and Company.open_notice_count by 1"

  - entity: FurnishingSpan
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — POST /lien/furnishing-spans creates a new span with the same (project_id, span_kind)"
        actor: system
        preconditions: []
        side_effects:
          - "Prior ACTIVE span of the same kind: status -> SUPERSEDED, updated_at refreshed"
          - "Project.first_furnishing_date and Project.last_furnishing_date recomputed over remaining ACTIVE spans"
          - "Project.version incremented by 1"

  - entity: NoticeOrder
    initial_state: DRAFT
    terminal_states: [PROOF_CONFIRMED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SERVED
        trigger: "POST /lien/notices/{id}/serve"
        actor: OpsAgent
        preconditions:
          - "Project.research_status == VERIFIED (ERR_PROJECT_NOT_VERIFIED)"
          - "served_at <= NoticeOrder.service_deadline (ERR_NOTICE_DEADLINE_PASSED); the last day is inclusive"
        side_effects:
          - "served_at set; service_deadline frozen"
          - "Project.lien_posture recomputed"
      - from: SERVED
        to: PROOF_CONFIRMED
        trigger: "POST /lien/notices/{id}/proof with result DELIVERED, or result REFUSED when the effective rule's refused_counts_as_served is true"
        actor: OpsAgent
        preconditions: ["status == SERVED"]
        side_effects:
          - "proof_result and proof_url set"
          - "Project.open_notice_count and Company.open_notice_count decremented by 1"
          - "Project.lien_posture recomputed"
      - from: SERVED
        to: DELIVERY_FAILED
        trigger: "POST /lien/notices/{id}/proof with result RETURNED, or result REFUSED when refused_counts_as_served is false"
        actor: OpsAgent
        preconditions: ["status == SERVED"]
        side_effects:
          - "proof_result and proof_url set"
      - from: DELIVERY_FAILED
        to: DRAFT
        trigger: "POST /lien/notices/{id}/reprepare"
        actor: CustomerAdmin
        preconditions: ["status == DELIVERY_FAILED"]
        side_effects:
          - "served_at and proof_result cleared; service_deadline recomputed live against the currently effective rule"
      - from: DRAFT
        to: EXPIRED
        trigger: "system — lazy auto-transition when current clock date > service_deadline"
        actor: system
        preconditions: ["current clock date > service_deadline"]
        side_effects:
          - "Project.open_notice_count and Company.open_notice_count decremented by 1"
          - "Project.lien_posture recomputed"

  - entity: LienClaim
    initial_state: DRAFT
    terminal_states: [RELEASED, BONDED_OFF, FORECLOSED, EXPIRED]
    transitions:
      - from: DRAFT
        to: AMOUNT_LOCKED
        trigger: "POST /lien/lien-claims/{id}/lock"
        actor: CustomerAdmin
        preconditions:
          - "status == DRAFT"
          - "If the effective rule's prelim_notice_required: a NoticeOrder on the same project exists with status == PROOF_CONFIRMED (ERR_PRELIM_NOTICE_REQUIRED)"
          - "Computed final_amount_cents > 0 (ERR_ZERO_CLAIM_AMOUNT)"
        side_effects:
          - "final_amount_cents, gross_snapshot_cents computed per claimable_amount (final variant)"
          - "locked_rule_id pinned to the effective JurisdictionRule; filing_window_end computed and pinned"
          - "waived_to_extras_cents / waived_to_contract_cents computed per waiver_waterfall"
      - from: AMOUNT_LOCKED
        to: DRAFT
        trigger: "POST /lien/lien-claims/{id}/unlock"
        actor: CustomerAdmin
        preconditions: ["status == AMOUNT_LOCKED"]
        side_effects:
          - "final_amount_cents, gross_snapshot_cents, filing_window_end, locked_rule_id cleared"
          - "provisional_amount_cents recomputed"
      - from: AMOUNT_LOCKED
        to: FILED
        trigger: "POST /lien/lien-claims/{id}/file"
        actor: OpsAgent
        preconditions:
          - "status == AMOUNT_LOCKED (ERR_CLAIM_NOT_LOCKED)"
          - "filed_at <= filing_window_end (ERR_FILING_WINDOW_CLOSED); the last day is inclusive"
        side_effects:
          - "filed_at set; final_amount_cents frozen; foreclosure_deadline computed from locked rule"
          - "Project.open_lien_count incremented by 1"
          - "Project.lien_posture recomputed"
      - from: FILED
        to: RELEASED
        trigger: "POST /lien/lien-claims/{id}/release (manual) OR system when outstanding_cents reaches 0 after a payment verify"
        actor: CustomerAdmin | system
        preconditions: ["status == FILED"]
        side_effects:
          - "Project.open_lien_count decremented by 1"
          - "Project.lien_posture recomputed"
          - "Open ForeclosureReferrals (DRAFT | SENT | DECLINED | ACCEPTED) for this claim -> CANCELLED with cancel_reason MOOT_RELEASED"
      - from: FILED
        to: BONDED_OFF
        trigger: "system — POST /lien/bonding-requests/{id}/record on a REQUESTED BondingRequest for this claim"
        actor: system
        preconditions: ["status == FILED"]
        side_effects:
          - "Project.open_lien_count decremented by 1"
          - "Project.lien_posture recomputed"
          - "Open ForeclosureReferrals for this claim -> CANCELLED with cancel_reason MOOT_BONDED"
      - from: FILED
        to: FORECLOSED
        trigger: "system — POST /lien/foreclosure-referrals/{id}/mark-suit-filed on an ACCEPTED referral for this claim"
        actor: system
        preconditions: ["status == FILED"]
        side_effects:
          - "Project.lien_posture recomputed (becomes LITIGATION)"
      - from: FILED
        to: EXPIRED
        trigger: "system — lazy auto-transition when current clock date > foreclosure_deadline and no referral is SUIT_FILED"
        actor: system
        preconditions: ["current clock date > foreclosure_deadline"]
        side_effects:
          - "Project.open_lien_count decremented by 1"
          - "Project.lien_posture recomputed"
          - "Open ForeclosureReferrals for this claim -> CANCELLED with cancel_reason MOOT_EXPIRED"

  - entity: Waiver
    initial_state: RECEIVED
    terminal_states: [VOIDED]
    transitions:
      - from: RECEIVED
        to: APPLIED
        trigger: "POST /lien/waivers/{id}/apply"
        actor: OpsAgent
        preconditions: ["status == RECEIVED (ERR_WAIVER_NOT_RECEIVED)"]
        side_effects:
          - "Open LienClaim (DRAFT | AMOUNT_LOCKED) on the project recomputes waiver fields and amounts"
      - from: RECEIVED
        to: VOIDED
        trigger: "POST /lien/waivers/{id}/void"
        actor: CustomerAdmin
        preconditions: ["status == RECEIVED"]
        side_effects: []
      - from: APPLIED
        to: VOIDED
        trigger: "POST /lien/waivers/{id}/void"
        actor: CustomerAdmin
        preconditions: ["status == APPLIED"]
        side_effects:
          - "Compensating recompute: open LienClaim waiver fields and amounts restored as if the waiver had never applied"

  - entity: Payment
    initial_state: PENDING
    terminal_states: [VERIFIED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /lien/payments/{id}/verify"
        actor: OpsAgent
        preconditions: ["status == PENDING"]
        side_effects:
          - "CASCADE link 1: open LienClaim on the project recomputes verified_paid_cents, conditional-waiver effectiveness, and (if AMOUNT_LOCKED) final_amount_cents and outstanding_cents; if FILED, outstanding_cents recomputed"
          - "CASCADE link 2: if the claim is FILED and outstanding_cents reaches 0, the claim auto-transitions FILED -> RELEASED (see LienClaim), which decrements Project.open_lien_count and recomputes Project.lien_posture"

  - entity: BondingRequest
    initial_state: REQUESTED
    terminal_states: [BOND_RECORDED, REJECTED]
    transitions:
      - from: REQUESTED
        to: BOND_RECORDED
        trigger: "POST /lien/bonding-requests/{id}/record"
        actor: OpsAgent
        preconditions:
          - "status == REQUESTED"
          - "Linked LienClaim status == FILED (ERR_CLAIM_NOT_FILED)"
        side_effects:
          - "recorded_at set"
          - "Linked LienClaim auto-transitions FILED -> BONDED_OFF (see LienClaim side effects incl. referral cancellation)"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /lien/bonding-requests/{id}/reject"
        actor: OpsAgent
        preconditions: ["status == REQUESTED"]
        side_effects: []

  - entity: ForeclosureReferral
    initial_state: DRAFT
    terminal_states: [SUIT_FILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /lien/foreclosure-referrals/{id}/send"
        actor: OpsAgent
        preconditions:
          - "status == DRAFT"
          - "current clock date <= linked claim's foreclosure_deadline (ERR_FORECLOSURE_DEADLINE_PASSED)"
        side_effects: []
      - from: DECLINED
        to: SENT
        trigger: "POST /lien/foreclosure-referrals/{id}/send with counsel_name (new counsel required)"
        actor: OpsAgent
        preconditions:
          - "status == DECLINED"
          - "counsel_name provided and differs from the declined counsel"
          - "current clock date <= linked claim's foreclosure_deadline (ERR_FORECLOSURE_DEADLINE_PASSED)"
        side_effects: ["counsel_name replaced with the new counsel"]
      - from: SENT
        to: ACCEPTED
        trigger: "POST /lien/foreclosure-referrals/{id}/respond with outcome ACCEPTED"
        actor: Counsel
        preconditions: ["status == SENT"]
        side_effects: []
      - from: SENT
        to: DECLINED
        trigger: "POST /lien/foreclosure-referrals/{id}/respond with outcome DECLINED"
        actor: Counsel
        preconditions: ["status == SENT"]
        side_effects: []
      - from: ACCEPTED
        to: SUIT_FILED
        trigger: "POST /lien/foreclosure-referrals/{id}/mark-suit-filed"
        actor: Counsel
        preconditions:
          - "status == ACCEPTED"
          - "suit_filed_at <= linked claim's foreclosure_deadline (ERR_FORECLOSURE_DEADLINE_PASSED); the last day is inclusive"
        side_effects:
          - "suit_filed_at set"
          - "Linked LienClaim auto-transitions FILED -> FORECLOSED; Project.lien_posture becomes LITIGATION"
      - from: DRAFT
        to: CANCELLED
        trigger: "system — linked claim leaves FILED (RELEASED | BONDED_OFF | EXPIRED)"
        actor: system
        preconditions: []
        side_effects: ["cancel_reason set per the claim's exit transition"]
      - from: SENT
        to: CANCELLED
        trigger: "system — linked claim leaves FILED"
        actor: system
        preconditions: []
        side_effects: ["cancel_reason set per the claim's exit transition"]
      - from: DECLINED
        to: CANCELLED
        trigger: "system — linked claim leaves FILED"
        actor: system
        preconditions: []
        side_effects: ["cancel_reason set per the claim's exit transition"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "system — linked claim leaves FILED"
        actor: system
        preconditions: []
        side_effects: ["cancel_reason set per the claim's exit transition"]

  - entity: StopNotice
    initial_state: DRAFT
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SERVED
        trigger: "POST /lien/stop-notices/{id}/serve"
        actor: OpsAgent
        preconditions:
          - "status == DRAFT"
          - "served_at <= last_furnishing_date + effective rule stop_notice_days (ERR_STOP_NOTICE_DEADLINE_PASSED); the last day is inclusive"
        side_effects:
          - "served_at set"
          - "Project.lien_posture recomputed (becomes ENCUMBERED)"
      - from: SERVED
        to: RELEASED
        trigger: "POST /lien/stop-notices/{id}/release"
        actor: OpsAgent
        preconditions: ["status == SERVED"]
        side_effects: ["Project.lien_posture recomputed"]
      - from: DRAFT
        to: EXPIRED
        trigger: "system — lazy auto-transition when current clock date > last_furnishing_date + stop_notice_days"
        actor: system
        preconditions: ["current clock date past the stop-notice deadline"]
        side_effects: []

  - entity: BondClaim
    initial_state: DRAFT
    terminal_states: [PAID, DENIED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /lien/bond-claims/{id}/submit"
        actor: OpsAgent
        preconditions:
          - "status == DRAFT"
          - "submitted_at <= last_furnishing_date + effective rule bond_claim_days (ERR_BOND_CLAIM_DEADLINE_PASSED); the last day is inclusive"
        side_effects:
          - "submitted_at set"
          - "Project.lien_posture recomputed (becomes ENCUMBERED)"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /lien/bond-claims/{id}/resolve with outcome PAID"
        actor: OpsAgent
        preconditions: ["status == SUBMITTED"]
        side_effects: ["resolve_outcome = PAID", "Project.lien_posture recomputed"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /lien/bond-claims/{id}/resolve with outcome DENIED"
        actor: OpsAgent
        preconditions: ["status == SUBMITTED"]
        side_effects: ["resolve_outcome = DENIED", "Project.lien_posture recomputed"]
      - from: DRAFT
        to: EXPIRED
        trigger: "system — lazy auto-transition when current clock date > last_furnishing_date + bond_claim_days"
        actor: system
        preconditions: ["current clock date past the bond-claim deadline"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; sequential-observable conflicts live in
# state_machines/validations)
# =============================================================================
concurrency_rules:
  - rule_id: span-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /lien/furnishing-spans"
    occ_field: expected_project_version
    description: |
      Creating a FurnishingSpan supersedes the prior ACTIVE span of the same
      kind and mutates the parent Project's furnishing dates; both a correction
      and a subsequent correction are legitimate supersedes under product
      semantics. A create carrying an expected_project_version that no longer
      matches the Project's current version is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: balance-adjust-stale-company
    parent_entity: Company
    write_endpoint: "POST /lien/companies/{id}/balance-adjustments"
    occ_field: expected_company_version
    description: |
      A balance adjustment that carries an expected_company_version no longer
      matching the Company's current version is rejected as stale, because any
      intervening mutation of the Company (another adjustment, or a notice-fee
      debit) has advanced the version since the client last observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: furnishing_date_determination
    trigger: "FurnishingSpan create/supersede; effective JurisdictionRule change (via supersede); read of Project or its deadline calendar"
    algorithm: aggregation
    formula: |
      ACTIVE = FurnishingSpans on the project with status == ACTIVE.
      first_furnishing_date = min(start_date) over ACTIVE; null when ACTIVE is empty.
      STRICT variant (effective rule counts_punch_list == false):
        last_furnishing_date = max(end_date) over ACTIVE spans with span_kind IN {BASE_CONTRACT, CHANGE_ORDER}.
      INCLUSIVE variant (counts_punch_list == true):
        last_furnishing_date = max(end_date) over ALL ACTIVE spans.
      Empty candidate set -> null.
    input_set: "FurnishingSpans of the project with status == ACTIVE only; SUPERSEDED spans are excluded"
    constants: {}
    precision: "ISO dates, day granularity"
    variants:
      - name: strict
        when: "Effective rule has counts_punch_list == false"
        difference: "PUNCH_LIST and WARRANTY spans never extend last_furnishing_date"
      - name: inclusive
        when: "Effective rule has counts_punch_list == true"
        difference: "All ACTIVE span kinds extend last_furnishing_date; identical inputs can yield a later date than strict"

  - name: prelim_notice_deadline
    trigger: "NoticeOrder creation; recomputed live while the notice is DRAFT whenever the effective rule changes; frozen at serve"
    algorithm: threshold
    formula: |
      service_deadline = add_days(first_furnishing_date, effective_rule.prelim_days, basis)
      CALENDAR basis: add prelim_days calendar days.
      BUSINESS basis: add prelim_days days skipping Saturdays and Sundays (no holiday calendar).
      Service is timely iff served_at <= service_deadline (the deadline day itself is valid).
      A DRAFT notice whose service_deadline < current clock date auto-expires (lazy).
    input_set: "The project's ACTIVE furnishing spans (via furnishing_date_determination) and the effective JurisdictionRule"
    constants: {}
    precision: "ISO dates, day granularity"

  - name: lien_windows
    trigger: "LienClaim lock (filing_window_end pinned); LienClaim file (foreclosure_deadline pinned); StopNotice serve / BondClaim submit deadline checks"
    algorithm: threshold
    formula: |
      filing_window_end = last_furnishing_date + locked_rule.filing_window_days (calendar days)
      foreclosure_deadline = filed_at + locked_rule.foreclosure_deadline_days (calendar days)
      stop_notice_deadline = last_furnishing_date + effective_rule.stop_notice_days
      bond_claim_deadline = last_furnishing_date + effective_rule.bond_claim_days
      Each action is timely iff action_date <= deadline (inclusive last day).
    input_set: "Project furnishing dates and the JurisdictionRule pinned at lock (claims) or currently effective (stop notices, bond claims)"
    constants: {}
    precision: "ISO dates, day granularity"

  - name: claimable_amount
    trigger: "LienClaim creation (provisional); lock (final); waiver apply/void and payment verify while DRAFT (provisional) or AMOUNT_LOCKED (final); never recomputed once FILED"
    algorithm: aggregation
    formula: |
      # FINAL variant (at lock, while AMOUNT_LOCKED):
      gross = contract_value_cents + approved_extras_cents - (0 if rule.retainage_claimable else retainage_held_cents)
      verified_paid = sum(Payment.amount_cents) over payments of the project with status == VERIFIED (any lien_claim_id)
      effective_waivers = sum over waivers of the project with status == APPLIED of:
          amount_cents if waiver_type IN {UNCONDITIONAL_PROGRESS, UNCONDITIONAL_FINAL}
          amount_cents if waiver_type IN {CONDITIONAL_PROGRESS, CONDITIONAL_FINAL}
                         AND exists a VERIFIED payment on the project with received_at >= waiver.period_end
          0 otherwise
      cap = +infinity if rule.cap_mode == UNCAPPED
            else max(0, contract_value_cents - verified_paid)   # CONTRACT_BALANCE
      final_amount_cents = max(0, min(cap, gross - verified_paid - effective_waivers))
      # PROVISIONAL variant (while DRAFT):
      all_paid = sum(Payment.amount_cents) over ALL payments of the project (PENDING and VERIFIED)
      all_waivers = sum(Waiver.amount_cents) over ALL waivers of the project with status != VOIDED
      provisional_amount_cents = max(0, contract_value_cents + approved_extras_cents - all_paid - all_waivers)
      # outstanding (only once locked):
      outstanding_cents = final_amount_cents - sum(Payment.amount_cents where status == VERIFIED AND lien_claim_id == claim.id)
    input_set: "Project money fields; payments and waivers as filtered above per variant"
    constants: {}
    precision: "integer cents, no rounding"
    variants:
      - name: provisional
        when: "Claim is DRAFT"
        difference: "Counts PENDING payments, counts conditional waivers unconditionally, ignores retainage exclusion and cap_mode — provisional and final diverge for identical project data"
      - name: final
        when: "Claim is AMOUNT_LOCKED or FILED"
        difference: "Verified payments only, conditional waivers gated on proof of payment, retainage excluded per rule, CONTRACT_BALANCE cap applied"

  - name: waiver_waterfall
    trigger: "Waiver apply/void while a LienClaim on the project is DRAFT or AMOUNT_LOCKED; also at lock"
    algorithm: waterfall_allocation
    formula: |
      effective = APPLIED waivers effective per claimable_amount (conditional gating identical)
      Process effective waivers in order: period_end ASC, tie-break created_at ASC.
      extras_pool = approved_extras_cents; contract_pool = contract_value_cents.
      For each waiver: take = min(amount_cents, extras_pool); extras_pool -= take; remainder = amount_cents - take;
                       take2 = min(remainder, contract_pool); contract_pool -= take2.
      waived_to_extras_cents = approved_extras_cents - extras_pool
      waived_to_contract_cents = contract_value_cents - contract_pool
      Amounts exceeding both pools are still counted in full in effective_waiver_cents (waiver credit is not capped by the pools).
    input_set: "APPLIED waivers on the project, effective per claimable_amount"
    constants: {}
    precision: "integer cents"

  - name: notice_fee_quote
    trigger: "NoticeOrder creation (fee_cents computed and debited from Company.prepaid_balance_cents)"
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER: round each line to integer cents FIRST (round_half_up), THEN sum.
      recipient_line_cents = round_half_up(RECIPIENT_BASE_CENTS * (1 + (LENDER_SURCHARGE_PCT if recipient party_role == LENDER else 0)))
      delivery_line_cents  = round_half_up(DELIVERY_BASE_CENTS * METHOD_MULTIPLIER[delivery_method])
      fee_cents = recipient_line_cents + delivery_line_cents
      # Summing first and rounding once is FORBIDDEN (it produces different cents).
    input_set: "The notice's recipient Party.party_role and delivery_method"
    constants:
      RECIPIENT_BASE_CENTS: 1499
      LENDER_SURCHARGE_PCT: 0.15
      DELIVERY_BASE_CENTS: 899
      METHOD_MULTIPLIER_CERTIFIED_MAIL: 1.0
      METHOD_MULTIPLIER_PERSONAL_SERVICE: 2.5
      METHOD_MULTIPLIER_EMAIL_STATUTORY: 0.5
    precision: "round_half_up to integer cents per line, then integer sum"

  - name: prejudgment_interest
    trigger: "Computed read on a FILED or FORECLOSED LienClaim (e.g., for referral packaging)"
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER (the tier depends on base ONLY, never on the total,
      # which would make the definition circular):
      (1) base = final_amount_cents (frozen at FILED)
      (2) rate = locked_rule.interest_annual_rate
                 + (INTEREST_TIER_BUMP if base > INTEREST_TIER_THRESHOLD_CENTS else 0)
      (3) days = calendar days from filed_at to min(current clock date, foreclosure_deadline), both inclusive-exclusive (deadline day not counted)
      (4) interest_cents = round_half_up(base * rate * days / 365)
      (5) total_with_interest_cents = min(base + interest_cents, MAX_AWARD_CENTS)
    input_set: "A FILED/FORECLOSED LienClaim and its pinned JurisdictionRule"
    constants:
      INTEREST_TIER_THRESHOLD_CENTS: 1000000
      INTEREST_TIER_BUMP: 0.02
      MAX_AWARD_CENTS: 1000000000
    precision: "round_half_up to integer cents"

  - name: lien_posture_derivation
    trigger: "After every mutation touching LienClaims, ForeclosureReferrals, NoticeOrders, StopNotices, or BondClaims of the project"
    algorithm: threshold
    formula: |
      1) LITIGATION if any LienClaim is FORECLOSED or any ForeclosureReferral is SUIT_FILED
      2) ENCUMBERED if any LienClaim is FILED, or any StopNotice is SERVED, or any BondClaim is SUBMITTED
      3) NOTICED if any NoticeOrder is SERVED or PROOF_CONFIRMED
      4) otherwise CLEAR
    input_set: "All child entities of the project in the named statuses"
    constants: {}
    precision: "n/a"

  - name: deadline_calendar
    trigger: "GET /lien/projects/{id}/deadline-calendar"
    algorithm: projection
    formula: |
      effective_rule = among PUBLISHED JurisdictionRules matching (project.state_code, project.project_type),
                       the one with the greatest effective_from <= current clock date;
                       tie-break: created_at ASC. Empty set -> all deadline fields null, applied_rule_id null.
      Projected (live, unpinned) values are computed from effective_rule:
        prelim_notice_deadline = first_furnishing_date + prelim_days on prelim_day_basis (null if no ACTIVE span)
        filing_window_end      = last_furnishing_date + filing_window_days (null if none)
        stop_notice_deadline   = last_furnishing_date + stop_notice_days (null if none)
      Locked/Filed claims ignore this projection — they keep the rule pinned at lock (version-pinning).
    input_set: "PUBLISHED rules for the project's (state_code, project_type); ACTIVE furnishing spans"
    constants: {}
    precision: "ISO dates, day granularity"

  - name: bond_amount
    trigger: "BondingRequest creation"
    algorithm: threshold
    formula: |
      bond_amount_cents = round_half_up(lien_claim.final_amount_cents * locked_rule.bond_pct)
      Requires the claim FILED (final_amount_cents frozen).
    input_set: "The FILED LienClaim and its pinned rule"
    constants: {}
    precision: "round_half_up to integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of PlatformAdmin | OpsAgent | CustomerAdmin | Counsel"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "CustomerAdmin may only access resources whose owning Project.company_id == the caller's X-User-ID (their Company id); PlatformAdmin/OpsAgent/Counsel are not company-scoped"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all company-scoped endpoints
  - priority: 4
    category: existence
    check: "Every id in the path exists (left to right); every FK id in the body exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "Target resource is in a state that permits the operation (specific state errors take this priority slot)"
    error_id: "ERR_INVALID_STATE | ERR_CLAIM_NOT_LOCKED | ERR_CLAIM_NOT_FILED | ERR_NOTICE_NOT_SERVED | ERR_WAIVER_NOT_RECEIVED | ERR_RULE_NOT_PUBLISHED | ERR_RESEARCH_ALREADY_VERIFIED"
    http_status: 409
    applies_to: all state-transition endpoints
  - priority: 5b
    category: state
    check: "OCC: expected_<parent>_version in the request body must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /lien/furnishing-spans, POST /lien/companies/{id}/balance-adjustments, POST /lien/jurisdiction-rules/{id}/supersede"
  - priority: 6
    category: business_safety
    check: "Compliance gates: project research VERIFIED before notice service; lien claims forbidden on public projects; stop notices only on STATE_PUBLIC; bond claims only on public projects; delivery method allowed by the effective rule; required parties verified"
    error_id: "ERR_PROJECT_NOT_VERIFIED | ERR_PARTIES_UNVERIFIED | ERR_LIEN_NOT_PERMITTED_PUBLIC | ERR_STOP_NOTICE_NOT_PERMITTED | ERR_BOND_CLAIM_NOT_PERMITTED | ERR_DELIVERY_METHOD_NOT_ALLOWED"
    http_status: "409 | 422"
    applies_to: "notice create/serve, research-advance, lien-claim create, stop-notice create, bond-claim create"
  - priority: 7
    category: business_referential
    check: "Body FK references are consistent: recipient/surety party belongs to the same project; surety party is VERIFIED with role SURETY; recipient party is VERIFIED; optional lien_claim_id belongs to the same project"
    error_id: "ERR_PARTY_PROJECT_MISMATCH | ERR_SURETY_NOT_VERIFIED | ERR_PARTY_NOT_VERIFIED"
    http_status: "422 | 409"
    applies_to: "notice create, bonding-request create, bond-claim create, payment create"
  - priority: 8
    category: business_temporal
    check: "Date sanity and deadline checks: span end >= start; served/filed/submitted dates within their windows (last day inclusive)"
    error_id: "ERR_SPAN_DATES_INVALID | ERR_NOTICE_DEADLINE_PASSED | ERR_FILING_WINDOW_CLOSED | ERR_STOP_NOTICE_DEADLINE_PASSED | ERR_BOND_CLAIM_DEADLINE_PASSED | ERR_FORECLOSURE_DEADLINE_PASSED"
    http_status: "422 | 409"
    applies_to: "furnishing-span create, notice serve, lien-claim file, stop-notice serve, bond-claim submit, referral create/send, mark-suit-filed"
  - priority: 9
    category: business_constraint
    check: "Uniqueness/aggregate constraints: one published rule per (state_code, project_type); one open lien claim per project; one open bonding request per claim; one open foreclosure referral per claim; waiver periods non-overlapping (half-open); stop-notice coverage non-overlapping (closed); an ACTIVE furnishing span exists where deadlines require it"
    error_id: "ERR_RULE_ALREADY_PUBLISHED | ERR_OPEN_CLAIM_EXISTS | ERR_OPEN_BONDING_EXISTS | ERR_OPEN_REFERRAL_EXISTS | ERR_WAIVER_PERIOD_OVERLAP | ERR_STOP_NOTICE_OVERLAP | ERR_NO_ACTIVE_SPAN"
    http_status: 409
    applies_to: "rule create, lien-claim create, bonding-request create, referral create, waiver create, stop-notice create/serve, notice create"
  - priority: 10
    category: business_fiscal
    check: "Money checks last: positive amounts; company prepaid balance covers the notice fee; locked claim amount must be > 0"
    error_id: "ERR_AMOUNT_MUST_BE_POSITIVE | ERR_INSUFFICIENT_BALANCE | ERR_ZERO_CLAIM_AMOUNT"
    http_status: "422 | 402"
    applies_to: "payment/waiver/stop-notice/bond-claim create, notice create, lien-claim lock"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (61 endpoints)
# =============================================================================
endpoints:
  # --- Company ---
  - { method: POST, path: "/lien/companies", description: "Create a claimant company", roles: [PlatformAdmin], code: 201, input: [name, contact_email], output: Company, side_effects: ["prepaid_balance_cents = 0, open_notice_count = 0"] }
  - { method: GET, path: "/lien/companies/{id}", description: "Get a company", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: [], output: Company, side_effects: [] }
  - method: POST
    path: "/lien/companies/{id}/balance-adjustments"
    description: "Adjust (credit or debit) a company's prepaid balance; OCC-guarded"
    roles: [PlatformAdmin]
    code: 201
    input: [amount_cents, reason, expected_company_version]
    output: Company
    side_effects: ["prepaid_balance_cents += amount_cents", "increments Company.version by 1"]
  - { method: GET, path: "/lien/companies/{id}/projects", description: "List projects owned by a company", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "Project[]", side_effects: [] }

  # --- JurisdictionRule ---
  - { method: POST, path: "/lien/jurisdiction-rules", description: "Publish the first rule for a (state_code, project_type) pair; rejected when a PUBLISHED rule already exists (use supersede)", roles: [PlatformAdmin], code: 201, input: [state_code, project_type, prelim_notice_required, prelim_days, prelim_day_basis, refused_counts_as_served, allowed_delivery_methods, filing_window_days, foreclosure_deadline_days, stop_notice_days, bond_claim_days, counts_punch_list, retainage_claimable, cap_mode, interest_annual_rate, bond_pct, effective_from], output: JurisdictionRule, side_effects: ["status = PUBLISHED"] }
  - method: POST
    path: "/lien/jurisdiction-rules/{id}/supersede"
    description: "Publish a successor rule for the same (state_code, project_type); the addressed rule must be PUBLISHED; OCC-guarded on the addressed rule's version"
    roles: [PlatformAdmin]
    code: 201
    input: [expected_jurisdiction_rule_version, prelim_notice_required, prelim_days, prelim_day_basis, refused_counts_as_served, allowed_delivery_methods, filing_window_days, foreclosure_deadline_days, stop_notice_days, bond_claim_days, counts_punch_list, retainage_claimable, cap_mode, interest_annual_rate, bond_pct, effective_from]
    output: JurisdictionRule
    side_effects:
      - "Addressed rule -> SUPERSEDED; increments the addressed JurisdictionRule.version by 1"
      - "New rule created PUBLISHED with supersedes_rule_id = addressed rule id and the addressed rule's (state_code, project_type)"
      - "Cascade: matching projects recompute live deadlines; DRAFT notices past recomputed deadline auto-EXPIRE; open notice counts on Project and Company decremented"
  - { method: GET, path: "/lien/jurisdiction-rules/{id}", description: "Get a jurisdiction rule", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: [], output: JurisdictionRule, side_effects: [] }
  - { method: GET, path: "/lien/jurisdiction-rules/{id}/successors", description: "List rules that supersede this rule (via supersedes_rule_id)", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "JurisdictionRule[]", side_effects: [] }
  - { method: GET, path: "/lien/jurisdiction-rules/{id}/lien-claims", description: "List lien claims that pinned this rule at lock (via locked_rule_id)", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "LienClaim[]", side_effects: [] }

  # --- Project ---
  - { method: POST, path: "/lien/projects", description: "Create a project for the caller's company (company_id taken from X-User-ID)", roles: [CustomerAdmin], code: 201, input: [name, state_code, county, project_type, property_legal_description, contract_value_cents, approved_extras_cents, retainage_held_cents], output: Project, side_effects: ["research_status = UNRESEARCHED, lien_posture = CLEAR, counts = 0"] }
  - { method: GET, path: "/lien/projects/{id}", description: "Get a project", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: [], output: Project, side_effects: [] }
  - { method: POST, path: "/lien/projects/{id}/research-advance", description: "Advance research UNRESEARCHED -> RESEARCHED -> VERIFIED", roles: [OpsAgent], code: 200, input: [], output: Project, side_effects: ["increments Project.version by 1"] }
  - method: GET
    path: "/lien/projects/{id}/deadline-calendar"
    description: "Computed read: projected deadlines across the project's jurisdiction (live rule projection; locked claims keep pinned rules)"
    roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel]
    code: 200
    input: []
    output: "{ applied_rule_id: string|null, prelim_notice_deadline: string|null, filing_window_end: string|null, stop_notice_deadline: string|null, last_furnishing_date: string|null, last_furnishing_variant: string|null }"
    side_effects: []
  - { method: GET, path: "/lien/projects/{id}/parties", description: "List parties of a project", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "Party[]", side_effects: [] }
  - { method: GET, path: "/lien/projects/{id}/furnishing-spans", description: "List furnishing spans of a project", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "FurnishingSpan[]", side_effects: [] }
  - { method: GET, path: "/lien/projects/{id}/notices", description: "List notice orders of a project", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "NoticeOrder[]", side_effects: [] }
  - { method: GET, path: "/lien/projects/{id}/lien-claims", description: "List lien claims of a project", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "LienClaim[]", side_effects: [] }
  - { method: GET, path: "/lien/projects/{id}/waivers", description: "List waivers of a project", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "Waiver[]", side_effects: [] }
  - { method: GET, path: "/lien/projects/{id}/payments", description: "List payments of a project", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: GET, path: "/lien/projects/{id}/stop-notices", description: "List stop notices of a project", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "StopNotice[]", side_effects: [] }
  - { method: GET, path: "/lien/projects/{id}/bond-claims", description: "List bond claims of a project", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "BondClaim[]", side_effects: [] }

  # --- Party ---
  - { method: POST, path: "/lien/parties", description: "Add a researched party (owner/GC/lender/hirer/surety) to a project", roles: [CustomerAdmin], code: 201, input: [project_id, party_role, legal_name, address], output: Party, side_effects: ["research_status = PENDING"] }
  - { method: GET, path: "/lien/parties/{id}", description: "Get a party", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: [], output: Party, side_effects: [] }
  - { method: POST, path: "/lien/parties/{id}/decide", description: "Verify or fail a party's research", roles: [OpsAgent], code: 200, input: [outcome], output: Party, side_effects: ["research_status -> VERIFIED or FAILED"] }
  - { method: GET, path: "/lien/parties/{id}/notices", description: "List notice orders addressed to this party", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "NoticeOrder[]", side_effects: [] }
  - { method: GET, path: "/lien/parties/{id}/bonding-requests", description: "List bonding requests naming this party as surety", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "BondingRequest[]", side_effects: [] }
  - { method: GET, path: "/lien/parties/{id}/bond-claims", description: "List bond claims naming this party as surety", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "BondClaim[]", side_effects: [] }

  # --- FurnishingSpan ---
  - method: POST
    path: "/lien/furnishing-spans"
    description: "Record a furnishing span; supersedes the prior ACTIVE span of the same (project_id, span_kind); OCC-guarded on Project.version"
    roles: [CustomerAdmin]
    code: 201
    input: [project_id, span_kind, start_date, end_date, expected_project_version]
    output: FurnishingSpan
    side_effects:
      - "Prior ACTIVE span of same kind -> SUPERSEDED"
      - "Project.first_furnishing_date / last_furnishing_date recomputed"
      - "increments Project.version by 1"
  # (reverse reachability: GET /lien/projects/{id}/furnishing-spans)

  # --- NoticeOrder ---
  - method: POST
    path: "/lien/notices"
    description: "Order a preliminary notice; computes fee and service deadline, debits the company balance"
    roles: [CustomerAdmin]
    code: 201
    input: [project_id, recipient_party_id, delivery_method]
    output: NoticeOrder
    side_effects:
      - "status = DRAFT; service_deadline computed; fee_cents computed per notice_fee_quote"
      - "Company.prepaid_balance_cents -= fee_cents; increments Company.version by 1"
      - "Project.open_notice_count and Company.open_notice_count incremented by 1"
  - { method: GET, path: "/lien/notices/{id}", description: "Get a notice order", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: [], output: NoticeOrder, side_effects: ["lazy EXPIRED auto-transition applied if past deadline"] }
  - { method: POST, path: "/lien/notices/{id}/serve", description: "Mark a DRAFT notice served", roles: [OpsAgent], code: 200, input: [served_at], output: NoticeOrder, side_effects: ["status -> SERVED; served_at set; service_deadline frozen"] }
  - { method: POST, path: "/lien/notices/{id}/proof", description: "Record delivery proof on a SERVED notice", roles: [OpsAgent], code: 200, input: [result, "proof_url?"], output: NoticeOrder, side_effects: ["status -> PROOF_CONFIRMED or DELIVERY_FAILED per rule; open notice counts decremented on PROOF_CONFIRMED"] }
  - { method: POST, path: "/lien/notices/{id}/reprepare", description: "Return a DELIVERY_FAILED notice to DRAFT for re-service", roles: [CustomerAdmin], code: 200, input: [], output: NoticeOrder, side_effects: ["status -> DRAFT; served_at/proof cleared; service_deadline recomputed live"] }

  # --- LienClaim ---
  - { method: POST, path: "/lien/lien-claims", description: "Create a lien claim in DRAFT with a provisional amount", roles: [CustomerAdmin], code: 201, input: [project_id], output: LienClaim, side_effects: ["status = DRAFT; provisional_amount_cents computed"] }
  - { method: GET, path: "/lien/lien-claims/{id}", description: "Get a lien claim", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: [], output: LienClaim, side_effects: ["lazy EXPIRED auto-transition applied if past foreclosure deadline"] }
  - { method: POST, path: "/lien/lien-claims/{id}/lock", description: "Lock the claim amount (DRAFT -> AMOUNT_LOCKED), pinning the effective rule", roles: [CustomerAdmin], code: 200, input: [], output: LienClaim, side_effects: ["final_amount_cents, gross_snapshot_cents, filing_window_end computed and pinned; locked_rule_id set"] }
  - { method: POST, path: "/lien/lien-claims/{id}/unlock", description: "Unlock the claim (AMOUNT_LOCKED -> DRAFT)", roles: [CustomerAdmin], code: 200, input: [], output: LienClaim, side_effects: ["pinned fields cleared; provisional_amount_cents recomputed"] }
  - { method: POST, path: "/lien/lien-claims/{id}/file", description: "Record the lien with the county (AMOUNT_LOCKED -> FILED)", roles: [OpsAgent], code: 200, input: [filed_at], output: LienClaim, side_effects: ["filed_at set; foreclosure_deadline computed; final amount frozen; Project.open_lien_count incremented; posture recomputed"] }
  - { method: POST, path: "/lien/lien-claims/{id}/release", description: "Release a FILED lien (e.g., upon payment)", roles: [CustomerAdmin], code: 200, input: [], output: LienClaim, side_effects: ["status -> RELEASED; Project.open_lien_count decremented; open referrals CANCELLED (MOOT_RELEASED)"] }
  - { method: GET, path: "/lien/lien-claims/{id}/payments", description: "List payments allocated to this claim", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: GET, path: "/lien/lien-claims/{id}/bonding-requests", description: "List bonding requests for this claim", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "BondingRequest[]", side_effects: [] }
  - { method: GET, path: "/lien/lien-claims/{id}/foreclosure-referrals", description: "List foreclosure referrals for this claim", roles: [PlatformAdmin, OpsAgent, CustomerAdmin, Counsel], code: 200, input: ["limit?", "offset?"], output: "ForeclosureReferral[]", side_effects: [] }

  # --- Waiver ---
  - { method: POST, path: "/lien/waivers", description: "Record a lien waiver; half-open billing periods of non-VOIDED waivers on the same project must not overlap", roles: [CustomerAdmin], code: 201, input: [project_id, waiver_type, amount_cents, period_start, period_end], output: Waiver, side_effects: ["status = RECEIVED"] }
  - { method: POST, path: "/lien/waivers/{id}/apply", description: "Apply a RECEIVED waiver against the claim amount", roles: [OpsAgent], code: 200, input: [], output: Waiver, side_effects: ["status -> APPLIED; open LienClaim waiver fields and amounts recomputed"] }
  - { method: POST, path: "/lien/waivers/{id}/void", description: "Void a waiver (compensating recompute when it was APPLIED)", roles: [CustomerAdmin], code: 200, input: [], output: Waiver, side_effects: ["status -> VOIDED; open LienClaim recomputed as if never applied"] }

  # --- Payment ---
  - { method: POST, path: "/lien/payments", description: "Record a payment against a project, optionally allocated to a claim", roles: [CustomerAdmin], code: 201, input: [project_id, "lien_claim_id?", amount_cents, received_at], output: Payment, side_effects: ["status = PENDING"] }
  - { method: POST, path: "/lien/payments/{id}/verify", description: "Verify a payment; cascades into claim amounts and may auto-release a FILED claim", roles: [OpsAgent], code: 200, input: [], output: Payment, side_effects: ["status -> VERIFIED; claim recompute cascade; FILED claim with outstanding_cents == 0 auto-RELEASED"] }

  # --- BondingRequest ---
  - { method: POST, path: "/lien/bonding-requests", description: "Request bonding around a FILED lien", roles: [CustomerAdmin], code: 201, input: [lien_claim_id, surety_party_id], output: BondingRequest, side_effects: ["status = REQUESTED; bond_amount_cents computed per bond_amount"] }
  - { method: POST, path: "/lien/bonding-requests/{id}/record", description: "Record the bond; the linked lien becomes BONDED_OFF", roles: [OpsAgent], code: 200, input: [recorded_at], output: BondingRequest, side_effects: ["status -> BOND_RECORDED; LienClaim FILED -> BONDED_OFF; open referrals CANCELLED (MOOT_BONDED)"] }
  - { method: POST, path: "/lien/bonding-requests/{id}/reject", description: "Reject a bonding request", roles: [OpsAgent], code: 200, input: [], output: BondingRequest, side_effects: ["status -> REJECTED"] }

  # --- ForeclosureReferral ---
  - { method: POST, path: "/lien/foreclosure-referrals", description: "Refer a FILED lien to foreclosure counsel", roles: [CustomerAdmin], code: 201, input: [lien_claim_id, counsel_name], output: ForeclosureReferral, side_effects: ["status = DRAFT"] }
  - { method: POST, path: "/lien/foreclosure-referrals/{id}/send", description: "Send the referral to counsel (from DRAFT, or from DECLINED with a new counsel_name)", roles: [OpsAgent], code: 200, input: ["counsel_name?"], output: ForeclosureReferral, side_effects: ["status -> SENT"] }
  - { method: POST, path: "/lien/foreclosure-referrals/{id}/respond", description: "Counsel accepts or declines the referral", roles: [Counsel], code: 200, input: [outcome], output: ForeclosureReferral, side_effects: ["status -> ACCEPTED or DECLINED"] }
  - { method: POST, path: "/lien/foreclosure-referrals/{id}/mark-suit-filed", description: "Counsel marks the foreclosure suit filed; the lien becomes FORECLOSED", roles: [Counsel], code: 200, input: [suit_filed_at], output: ForeclosureReferral, side_effects: ["status -> SUIT_FILED; LienClaim FILED -> FORECLOSED; posture LITIGATION"] }

  # --- StopNotice ---
  - { method: POST, path: "/lien/stop-notices", description: "Create a stop notice (STATE_PUBLIC projects only); closed coverage intervals of SERVED stop notices must not overlap", roles: [CustomerAdmin], code: 201, input: [project_id, amount_cents, coverage_start, coverage_end], output: StopNotice, side_effects: ["status = DRAFT"] }
  - { method: POST, path: "/lien/stop-notices/{id}/serve", description: "Serve a stop notice within its deadline", roles: [OpsAgent], code: 200, input: [served_at], output: StopNotice, side_effects: ["status -> SERVED; posture recomputed"] }
  - { method: POST, path: "/lien/stop-notices/{id}/release", description: "Release a SERVED stop notice", roles: [OpsAgent], code: 200, input: [], output: StopNotice, side_effects: ["status -> RELEASED; posture recomputed"] }

  # --- BondClaim ---
  - { method: POST, path: "/lien/bond-claims", description: "Create a payment-bond claim (public projects only)", roles: [CustomerAdmin], code: 201, input: [project_id, surety_party_id, amount_cents], output: BondClaim, side_effects: ["status = DRAFT"] }
  - { method: POST, path: "/lien/bond-claims/{id}/submit", description: "Submit a bond claim to the surety within its deadline", roles: [OpsAgent], code: 200, input: [submitted_at], output: BondClaim, side_effects: ["status -> SUBMITTED; posture recomputed"] }
  - { method: POST, path: "/lien/bond-claims/{id}/resolve", description: "Resolve a submitted bond claim as PAID or DENIED", roles: [OpsAgent], code: 200, input: [outcome], output: BondClaim, side_effects: ["status -> PAID or DENIED; posture recomputed"] }

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601 UTC). Startup default before any set call is exactly 2026-05-01T00:00:00Z; the server never falls back to wall-clock time. Lazy auto-transitions (EXPIRED) are evaluated against this clock on the next read or mutation of the affected entity."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; subsequent reads apply due auto-transitions"]

# =============================================================================
# §1.6 Error Code Catalog (36 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for the endpoint, or CustomerAdmin accessing another company's resources" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body reference id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, unknown field, or invalid enum/format value" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic: target resource state does not permit the operation and no specific state error applies" }
  - { id: ERR_RESEARCH_ALREADY_VERIFIED, http: 409, condition: "research-advance called on a VERIFIED project" }
  - { id: ERR_PARTIES_UNVERIFIED, http: 409, condition: "research-advance to VERIFIED while a required party (OWNER/GC, plus LENDER when prelim required) is not VERIFIED" }
  - { id: ERR_PROJECT_NOT_VERIFIED, http: 409, condition: "Notice creation or service requires Project.research_status == VERIFIED" }
  - { id: ERR_PARTY_NOT_VERIFIED, http: 409, condition: "Notice recipient party research_status != VERIFIED" }
  - { id: ERR_SURETY_NOT_VERIFIED, http: 409, condition: "Surety party is not VERIFIED or not role SURETY" }
  - { id: ERR_PARTY_PROJECT_MISMATCH, http: 422, condition: "Referenced party/claim belongs to a different project than the operation's project" }
  - { id: ERR_DELIVERY_METHOD_NOT_ALLOWED, http: 422, condition: "delivery_method not in the effective rule's allowed_delivery_methods" }
  - { id: ERR_NO_ACTIVE_SPAN, http: 409, condition: "Operation requires an ACTIVE furnishing span (deadline computation) but none exists" }
  - { id: ERR_NOTICE_DEADLINE_PASSED, http: 409, condition: "served_at is after the notice's service_deadline" }
  - { id: ERR_NOTICE_NOT_SERVED, http: 409, condition: "proof recorded on a notice that is not SERVED" }
  - { id: ERR_LIEN_NOT_PERMITTED_PUBLIC, http: 422, condition: "Lien claim created on a STATE_PUBLIC or FEDERAL_PUBLIC project" }
  - { id: ERR_OPEN_CLAIM_EXISTS, http: 409, condition: "A LienClaim in DRAFT, AMOUNT_LOCKED, or FILED already exists on the project" }
  - { id: ERR_PRELIM_NOTICE_REQUIRED, http: 409, condition: "Lock requires a PROOF_CONFIRMED prelim notice on the project (rule prelim_notice_required)" }
  - { id: ERR_ZERO_CLAIM_AMOUNT, http: 422, condition: "Lock would produce final_amount_cents <= 0" }
  - { id: ERR_CLAIM_NOT_LOCKED, http: 409, condition: "file called on a claim not in AMOUNT_LOCKED" }
  - { id: ERR_CLAIM_NOT_FILED, http: 409, condition: "bonding-request create/record or referral create on a claim not FILED" }
  - { id: ERR_FILING_WINDOW_CLOSED, http: 409, condition: "filed_at is after the claim's filing_window_end" }
  - { id: ERR_WAIVER_PERIOD_OVERLAP, http: 409, condition: "New waiver's half-open [period_start, period_end) overlaps a non-VOIDED waiver on the same project; adjacency (period_start == other period_end) is allowed" }
  - { id: ERR_WAIVER_NOT_RECEIVED, http: 409, condition: "apply called on a waiver not in RECEIVED" }
  - { id: ERR_STOP_NOTICE_NOT_PERMITTED, http: 422, condition: "Stop notice created on a project that is not STATE_PUBLIC" }
  - { id: ERR_STOP_NOTICE_OVERLAP, http: 409, condition: "New stop notice's closed [coverage_start, coverage_end] overlaps a SERVED stop notice on the same project; sharing an endpoint counts as overlap" }
  - { id: ERR_STOP_NOTICE_DEADLINE_PASSED, http: 409, condition: "served_at is after last_furnishing_date + stop_notice_days" }
  - { id: ERR_BOND_CLAIM_NOT_PERMITTED, http: 422, condition: "Bond claim created on a private project" }
  - { id: ERR_BOND_CLAIM_DEADLINE_PASSED, http: 409, condition: "submitted_at is after last_furnishing_date + bond_claim_days" }
  - { id: ERR_OPEN_BONDING_EXISTS, http: 409, condition: "A BondingRequest in REQUESTED already exists for the claim" }
  - { id: ERR_OPEN_REFERRAL_EXISTS, http: 409, condition: "A ForeclosureReferral in DRAFT, SENT, DECLINED, or ACCEPTED already exists for the claim" }
  - { id: ERR_FORECLOSURE_DEADLINE_PASSED, http: 409, condition: "Referral create/send or mark-suit-filed after the claim's foreclosure_deadline (last day inclusive)" }
  - { id: ERR_RULE_ALREADY_PUBLISHED, http: 409, condition: "A PUBLISHED rule already exists for the (state_code, project_type) pair; use supersede" }
  - { id: ERR_RULE_NOT_PUBLISHED, http: 409, condition: "supersede addressed a rule not in PUBLISHED status" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 402, condition: "Company.prepaid_balance_cents < notice fee_cents at notice creation" }
  - { id: ERR_AMOUNT_MUST_BE_POSITIVE, http: 422, condition: "amount_cents must be > 0" }
  - { id: ERR_SPAN_DATES_INVALID, http: 422, condition: "end_date < start_date" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Service operator staff; configures jurisdiction rules, company accounts, balances, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /lien/companies"
      - "POST /lien/companies/{id}/balance-adjustments"
      - "POST /lien/jurisdiction-rules"
      - "POST /lien/jurisdiction-rules/{id}/supersede"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: OpsAgent
    description: "Service operations agent; verifies research and parties, serves notices, records proof, files liens, applies waivers, verifies payments, records bonds, processes stop notices and bond claims"
    identity: opaque
    exclusive_operations:
      - "POST /lien/projects/{id}/research-advance"
      - "POST /lien/parties/{id}/decide"
      - "POST /lien/notices/{id}/serve and /proof"
      - "POST /lien/lien-claims/{id}/file"
      - "POST /lien/waivers/{id}/apply"
      - "POST /lien/payments/{id}/verify"
      - "POST /lien/bonding-requests/{id}/record and /reject"
      - "POST /lien/foreclosure-referrals/{id}/send"
      - "POST /lien/stop-notices/{id}/serve and /release"
      - "POST /lien/bond-claims/{id}/submit and /resolve"
    shared_operations:
      - "All GET endpoints"
  - name: CustomerAdmin
    description: "Administrator of a claimant company; owns projects, orders notices, manages claims/waivers/payments, requests bonding and referrals"
    identity: "entity_backed:Company"
    exclusive_operations:
      - "POST /lien/projects"
      - "POST /lien/parties"
      - "POST /lien/furnishing-spans"
      - "POST /lien/notices and /lien/notices/{id}/reprepare"
      - "POST /lien/lien-claims and /lock /unlock /release"
      - "POST /lien/waivers and /lien/waivers/{id}/void"
      - "POST /lien/payments"
      - "POST /lien/bonding-requests"
      - "POST /lien/foreclosure-referrals"
      - "POST /lien/stop-notices"
      - "POST /lien/bond-claims"
    shared_operations:
      - "All GET endpoints (company-scoped)"
  - name: Counsel
    description: "External foreclosure counsel; responds to referrals and marks suits filed"
    identity: opaque
    exclusive_operations:
      - "POST /lien/foreclosure-referrals/{id}/respond"
      - "POST /lien/foreclosure-referrals/{id}/mark-suit-filed"
    shared_operations:
      - "All GET endpoints"
