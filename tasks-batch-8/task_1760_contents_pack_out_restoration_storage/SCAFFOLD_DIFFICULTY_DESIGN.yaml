          - entities.HandlingClaim.fields.status
        distinguishing_aspect: |
          Entity pair PackBackSchedule -> HandlingClaim (third distinct pair): the
          item IS eligible (IN_STORAGE, no referrals), structure IS complete, but a
          FILED claim on the eligible item vetoes CONFIRM.
        test_recipe:
          setup:
            - "Job structure COMPLETE; one item IN_STORAGE (eligible); a FILED HandlingClaim exists on that item"
          setup_api_calls:
