# =====================================================================
# 1.9 Scaffold Corner Design (Breadth Claim Index)
# Task 2667 — Fair Trade Certification & Producer Premium Administration
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; nothing is invented here.
# Every recipe drives empty-DB state through §1.5 endpoints only.
# Logical clock default: 2026-08-01T00:00:00Z.
# =====================================================================
scaffold_corner_design:

  # ===================================================================
  - section: entities
    instances:
      - name: producer_holder_creation_mints_pending_holder_and_zeroed_premium_fund
        claim_type: creation
        grounds:
          - entities.CertificateHolder
          - entities.PremiumFund
          - endpoints.POST_/fairtrade/certificate-holders
        distinguishing_aspect: "A PRODUCER_ORG registration returns 201 with certificate_status PENDING and compliance_score 100, and silently mints one PremiumFund row for fiscal_year 2026 with all five money and counter fields at 0."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
          trigger:
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
          assert:
            - "HTTP 201 and the response data carries every declared CertificateHolder field"
            - "CertificateHolder.${prod_id}.certificate_status == PENDING and certified_at == null"
            - "CertificateHolder.${prod_id}.compliance_score == 100 and open_critical_count == 0 and open_major_count == 0 and open_minor_count == 0"
            - "CertificateHolder.${prod_id}.label_license_status == NONE and license_fee_cents == 0 and license_fee_settled == false"
            - "CertificateHolder.${prod_id}.suspension_reason == NONE and next_audit_due_at == null and annual_certified_volume_kg == 0"
            - "GET /fairtrade/certificate-holders/${prod_id}/premium-funds returns exactly 1 row with fiscal_year == 2026, total_accrued_cents == 0, balance_cents == 0, committed_cents == 0, disbursed_cents == 0, pending_proposal_count == 0"

      - name: get_certificate_holder_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_/fairtrade/certificate-holders/{id}
        distinguishing_aspect: "A single-entity GET returns the same field values the creating POST returned, wrapped in the success envelope with response_type object."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one PENDING BRAND holder registered"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
          trigger:
            - call: "GET /fairtrade/certificate-holders/${brand_id}"
              payload: {}
              as: BrandLicensee
              as_user_id: "${brand_id}"
          assert:
            - "HTTP 200 with response_type == object and data.id == ${brand_id}"
            - "data.legal_name == Nordic Roasters, data.holder_type == BRAND, data.country_code == SE, data.product_code == COFFEE_ARABICA"
            - "data.certificate_status == PENDING, unchanged by the read"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: list_certificate_holders_filters_by_certificate_status_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_/fairtrade/certificate-holders
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three holders of which two are CERTIFIED, the filtered list returns exactly the two CERTIFIED rows and reports total_count 2 and has_more false; limit 1 returns 1 row with has_more true."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "three holders: two CERTIFIED PRODUCER_ORGs and one PENDING BRAND"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { p1_holder_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${p1_holder_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Cocoa Union", holder_type: "PRODUCER_ORG", country_code: "GH", product_code: "COCOA" }
              as: CertificationOfficer
              captures: { p2_holder_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${p2_holder_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
          trigger:
            - call: "GET /fairtrade/certificate-holders"
              payload: { certificate_status: "CERTIFIED" }
              as: CertificationOfficer
            - call: "GET /fairtrade/certificate-holders"
              payload: { certificate_status: "CERTIFIED", limit: 1, offset: 0 }
              as: CertificationOfficer
          assert:
            - "the unpaginated filtered call returns response_type == array with 2 rows, total_count == 2 and has_more == false"
            - "the returned ids are exactly ${p1_holder_id} and ${p2_holder_id}, ordered by created_at ASC, and ${brand_id} is absent"
            - "the limit 1 call returns 1 row whose id == ${p1_holder_id}, total_count == 2 and has_more == true"
            - "the default page size is 10 per response_envelope.pagination_defaults, so the unpaginated call needs no limit to return both rows"

      - name: get_unknown_supply_chain_node_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NODE_NOT_FOUND]
          - validations.priority_4
        distinguishing_aspect: "A well-formed read of a node id that was never minted returns 404 ERR_NODE_NOT_FOUND, and the error body carries only error_id and message."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one CERTIFIED PRODUCER_ORG holder exists but no SupplyChainNode has been created"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
          trigger:
            - call: "GET /fairtrade/supply-chain-nodes/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: CertificationOfficer
          assert:
            - "HTTP 404 with data.error_id == ERR_NODE_NOT_FOUND"
            - "data contains only error_id and message, and response_type == error"
            - "GET /fairtrade/supply-chain-nodes?holder_id=${prod_id} returns 0 rows with total_count == 0"

      - name: create_trade_transaction_missing_volume_kg_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_3
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/fairtrade/trade-transactions
        distinguishing_aspect: "Omitting the required volume_kg from an otherwise valid trade payload returns 422 ERR_INVALID_REQUEST and reserves nothing on the seller node."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CERTIFIED producer with an ACTIVE PHYSICAL cooperative node holding 50000 kg, and a CERTIFIED brand with an ACTIVE PHYSICAL BRAND_NODE downstream"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { node_v1: $.data.version }
          trigger:
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", declared_unit_price_cents_per_kg: 500, contract_date: "2026-08-01", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
          assert:
            - "HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "SupplyChainNode.${sell_node_id}.reserved_output_kg == 0.000 and available_credit_kg == 50000.000"
            - "SupplyChainNode.${sell_node_id}.version == ${node_v1}, so the rejected request did not bump the OCC parent"
            - "GET /fairtrade/trade-transactions?seller_node_id=${sell_node_id} returns 0 rows"

      - name: committee_quorum_and_trade_organic_flag_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.PremiumCommittee.fields.quorum_pct
          - entities.TradeTransaction.fields.is_organic
        distinguishing_aspect: "Omitting quorum_pct yields exactly 60.00 on the committee, and omitting is_organic yields false on the trade, which is observable because the premium stays at the un-uplifted 80 cents per kg rate."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CERTIFIED producer with an ACTIVE PHYSICAL cooperative node holding 50000 kg and a CERTIFIED brand with an ACTIVE PHYSICAL BRAND_NODE downstream"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { node_v1: $.data.version }
          trigger:
            - call: "POST /fairtrade/premium-committees"
              payload: { holder_id: "${prod_id}", chair_user_id: "chair-1", member_count: 5, approved_use_categories: ["EDUCATION"] }
              as: CertificationOfficer
              captures: { cmte_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", volume_kg: 10000, declared_unit_price_cents_per_kg: 500, contract_date: "2026-08-01", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t1_id: $.data.id }
          assert:
            - "PremiumCommittee.${cmte_id}.quorum_pct == 60.00 and status == FORMING and open_proposal_count == 0"
            - "TradeTransaction.${t1_id}.is_organic == false"
            - "TradeTransaction.${t1_id}.premium_cents == 800000, the un-uplifted 80 cents per kg over 10000 kg"
            - "TradeTransaction.${t1_id}.applied_floor_cents_per_kg == 320, with no organic differential added"
            - "SupplyChainNode.${sell_node_id}.conversion_ratio == 1.0 on both nodes, the declared default"

      - name: trade_money_fields_are_computed_from_the_floor_schedule_not_from_input
        claim_type: computed_fields
        grounds:
          - calculations.minimum_price_floor
          - entities.TradeTransaction.fields.settled_unit_price_cents_per_kg
          - entities.TradeTransaction.fields.floor_topup_cents
        distinguishing_aspect: "A COCOA shipment declared at 200 cents per kg is lifted to the 260-cent floor: settled price 260, floor_topup 300000 over 5000 kg and gross_value 1300000 — none of which the client can supply, since only declared_unit_price_cents_per_kg is an input."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CERTIFIED COCOA producer with an ACTIVE PHYSICAL cooperative node holding 50000 kg and a CERTIFIED COCOA brand with an ACTIVE PHYSICAL BRAND_NODE downstream"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Cocoa Union", holder_type: "PRODUCER_ORG", country_code: "GH", product_code: "COCOA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Alpine Chocolate", holder_type: "BRAND", country_code: "CH", product_code: "COCOA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { node_v1: $.data.version }
          trigger:
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COCOA", quality_grade: "STANDARD", volume_kg: 5000, declared_unit_price_cents_per_kg: 200, contract_date: "2026-08-01", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t1_id: $.data.id }
          assert:
            - "TradeTransaction.${t1_id}.applied_floor_cents_per_kg == 260"
            - "TradeTransaction.${t1_id}.settled_unit_price_cents_per_kg == 260, the floor rather than the declared 200"
            - "TradeTransaction.${t1_id}.floor_topup_cents == 300000"
            - "TradeTransaction.${t1_id}.gross_value_cents == 1300000"
            - "TradeTransaction.${t1_id}.premium_cents == 300000 and premium_basis == PHYSICAL_TRACEABILITY"
            - "TradeTransaction.${t1_id}.declared_unit_price_cents_per_kg == 200, stored unchanged next to the computed settled price"

      - name: mark_usage_request_system_fields_are_server_stamped_only
        claim_type: system_fields
        grounds:
          - entities.MarkUsageRequest.fields.decided_by_user_id
          - entities.MarkUsageRequest.fields.decided_at
          - entities.MarkUsageRequest.fields.status
        distinguishing_aspect: "status, decided_by_user_id, decided_at and decision_reason are absent from the create endpoint's input, so the new row is SUBMITTED with all three decision fields null until decide stamps them from the X-User-ID header and the logical clock."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CERTIFIED BRAND holder with an ACTIVE 2026 label licence for 100000 kg, fully paid, so license_fee_settled is true"
            - "the brand owns one MASS_BALANCE BRAND_NODE whose upstream is a MASS_BALANCE cooperative of a CERTIFIED producer"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Cocoa Union", holder_type: "PRODUCER_ORG", country_code: "GH", product_code: "COCOA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Alpine Chocolate", holder_type: "BRAND", country_code: "CH", product_code: "COCOA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "MASS_BALANCE" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "MASS_BALANCE", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/label-license"
              payload: { license_year: 2026, licensed_volume_kg: 100000 }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders/${brand_id}/label-license/payments"
              payload: { amount_cents: 382950 }
              as: BrandLicensee
              as_user_id: "${brand_id}"
          trigger:
            - call: "POST /fairtrade/mark-usage-requests"
              payload: { brand_holder_id: "${brand_id}", sku_code: "ALP-DARK-70", artwork_ref: "ART-2026-001", claim_type: "FT_INGREDIENT_MASS_BALANCE", requested_volume_kg: 20000 }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { mur_id: $.data.id }
            - call: "POST /fairtrade/mark-usage-requests/${mur_id}/decide"
              payload: { decision: "APPROVE", reason: "Artwork conforms" }
              as: CertificationOfficer
              as_user_id: "officer-7"
          assert:
            - "immediately after creation MarkUsageRequest.${mur_id}.status == SUBMITTED, decided_by_user_id == null, decided_at == null and decision_reason == null"
            - "after the decide MarkUsageRequest.${mur_id}.decided_by_user_id == officer-7, taken from the X-User-ID header and not from any payload field"
            - "MarkUsageRequest.${mur_id}.decided_at == 2026-08-01T00:00:00Z, the logical clock instant"
            - "MarkUsageRequest.${mur_id}.decision_reason == Artwork conforms and status == APPROVED"
            - "created_at and updated_at are server-stamped and version increased by 1 across the decide"

      - name: create_holder_with_unknown_product_code_returns_invalid_enum
        claim_type: type_constraints
        grounds:
          - entities.CertificateHolder.fields.product_code
          - validations.priority_3
        distinguishing_aspect: "product_code is constrained to {COFFEE_ARABICA, COCOA, BANANA}, so TEA is refused with 422 ERR_INVALID_REQUEST and no holder or PremiumFund row is created."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
          trigger:
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Assam Growers", holder_type: "PRODUCER_ORG", country_code: "IN", product_code: "TEA" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Assam Growers", holder_type: "PRODUCER_ORG", country_code: "IND", product_code: "COCOA" }
              as: CertificationOfficer
          assert:
            - "the TEA request returns 422 with data.error_id == ERR_INVALID_REQUEST"
            - "the three-letter country_code request also returns 422 ERR_INVALID_REQUEST, since country_code must be exactly 2 uppercase letters"
            - "GET /fairtrade/certificate-holders returns 0 rows with total_count == 0, so neither refusal created a holder or a fund"

      - name: premium_ledger_entry_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.PremiumLedgerEntry
        distinguishing_aspect: "PremiumLedgerEntry declares common_fields false, so its rows expose no version and no updated_at, there is no write endpoint that targets an entry, and the only way its content changes is by appending a further entry."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CERTIFIED producer with a PHYSICAL cooperative node holding 50000 kg, a CERTIFIED brand with a downstream BRAND_NODE, and one 10000 kg coffee trade VERIFIED and SETTLED"
          setup_api_calls:
