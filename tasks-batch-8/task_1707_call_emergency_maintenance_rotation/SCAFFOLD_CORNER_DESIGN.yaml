  # ---------------------------------------------------------------
  - section: calculations
    instances:
      - name: sla_targets_assigned_by_category_constants
        claim_type: constants_applied
        grounds: [calculations.sla_target_assignment, entities.CallTicket.fields.sla_target_minutes]
        distinguishing_aspect: "Triage stamps the category-driven target: GAS_LEAK 30, NO_HEAT 60, LOCKOUT 120 — three tickets, three constants, no dispatch needed."
        test_recipe:
          setup: ["unit exists"]
          setup_api_calls:
            - { call: "POST /v1/units", payload: { unit_number: "C-1", building_code: "BC" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "A", caller_phone: "555", category: "GAS_LEAK", description: "gas" }, as: Dispatcher, captures: { t1: $.data.id } }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "B", caller_phone: "555", category: "NO_HEAT", description: "cold" }, as: Dispatcher, captures: { t2: $.data.id } }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "C", caller_phone: "555", category: "LOCKOUT", description: "locked out" }, as: Dispatcher, captures: { t3: $.data.id } }
          trigger:
            - { call: "POST /v1/call-tickets/${t1}/triage", payload: { is_true_emergency: true }, as: Dispatcher, captures: { s1: $.data.sla_target_minutes } }
            - { call: "POST /v1/call-tickets/${t2}/triage", payload: { is_true_emergency: true }, as: Dispatcher, captures: { s2: $.data.sla_target_minutes } }
            - { call: "POST /v1/call-tickets/${t3}/triage", payload: { is_true_emergency: true }, as: Dispatcher, captures: { s3: $.data.sla_target_minutes } }
          assert:
            - "GAS_LEAK -> sla_target_minutes == 30"
            - "NO_HEAT -> sla_target_minutes == 60"
            - "LOCKOUT -> sla_target_minutes == 120"

      - name: callback_pay_plain_daytime_uses_callout_floor_only
        claim_type: correct_result
        grounds: [calculations.callback_pay]
        distinguishing_aspect: "Weekday daytime non-hazard callback: all three multipliers are 1.0 and the nested max(45, 120) floor dominates — 2h x 4800 = 9600, contrasting the 27000 stacked case in §1.8."
        test_recipe:
          setup: ["T1 (4800/h) ACTIVE shift 2026-08-03 09:00-18:00 (Monday); LOCKOUT ticket dispatched 10:00, arrived 10:20, mitigated 10:45 (45 min); IR submitted"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "C-2", building_code: "BC" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T09:00:00Z", end_at: "2026-08-03T18:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "D", caller_phone: "555", category: "LOCKOUT", description: "locked out" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:20:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:45:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "Re-keyed", unit_uninhabitable: false }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/call-tickets/${tk}/incident-record", payload: { narrative: "Lock replaced", estimated_damage_cents: 8000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { ir: $.data.id } }
