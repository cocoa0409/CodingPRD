            - { call: "POST /port-ops/service-orders/${so2}/approve", as: TerminalOperator, as_user_id: "op-1" }
            - { call: "POST /port-ops/service-orders/${so3}/approve", as: TerminalOperator, as_user_id: "op-1" }
            - { call: "POST /port-ops/port-calls/${pc1}/arrive", payload: { actual_eta: "2026-08-10T08:00:00Z" }, as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc2}/arrive", payload: { actual_eta: "2026-08-10T08:00:00Z" }, as: Harbormaster }
          trigger:
