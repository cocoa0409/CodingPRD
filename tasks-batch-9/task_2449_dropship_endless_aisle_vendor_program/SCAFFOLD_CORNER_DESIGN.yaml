    claim_type: precondition_enforcement
    grounds:
    - state_machines.Vendor.INTEGRATION_TESTING_to_CERTIFIED
    - validations[priority=28]
    - errors[ERR_INTEGRATION_INCOMPLETE]
    - entities.IntegrationTest.fields.message_type
