scenario: |
  Single-Family Rental Investment Marketplace & Tenant-in-Place Underwriting (Roofstock): property listing with inspection reports, valuation and existing lease and tenant payment history disclosed to buyers, certification program setting inspection and title standards for listed homes, buyer underwriting tools with rent estimates, expense assumptions and projected yields under disclosure limitations, offer, escrow and closing coordination for out-of-state investors with remote signing, property management referral and onboarding at closing with continuity of the existing lease, guarantee programs covering vacancy or lease-up for certified properties, seller portfolio listings with bulk transaction mechanics, post-close performance tracking and dispute handling on disclosed conditions
  

domain_name: sfr-investment-marketplace
api_prefix: /marketplace
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - conditional_feature_flags
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Seller
  parent: null
  common_fields: true
  fields:
  - name: legal_name
    type: string
    source: input
    description: Seller legal name
  - name: seller_state
    type: string
    source: input
    description: 2-letter state code of seller domicile
  - name: seller_type
    type: enum
    source: input
    description: Seller legal form
    constraints: enum {INDIVIDUAL, LLC, TRUST}
  - name: listed_count
    type: integer
    source: computed
    description: Count of seller's Listings with status NOT IN {SOLD, WITHDRAWN}
  - name: bulk_discount_bps
    type: integer
    source: computed
    description: Discount tier in basis points derived from listed_count (see bulk_discount_bps calculation)
- name: Buyer
  parent: null
  common_fields: true
  fields:
  - name: legal_name
    type: string
    source: input
    description: Buyer legal name
  - name: buyer_state
    type: string
    source: input
    description: 2-letter state code of buyer domicile
  - name: entity_type
    type: enum
    source: input
    description: Buyer legal form
    constraints: enum {INDIVIDUAL, LLC, TRUST}
  - name: proof_of_funds_cents
    type: integer
    source: input
    description: Self-attested liquid funds; floor-checked on CASH offers
  - name: accredited
    type: boolean
    source: input
    default: false
    description: Accredited-investor attestation
- name: CertificationProgram
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Program name (unique)
  - name: min_inspection_score
    type: integer
    source: input
    description: Minimum inspection overall_score required for certification, 0-100
  - name: min_title_grade
    type: enum
    source: input
    description: Minimum title grade required
    constraints: enum {A, B, C}; order A < B < C, A best
  - name: requires_lease_disclosure
    type: boolean
    source: input
    description: If true, listing must carry a Lease with disclosure_status=DISCLOSED and status=ACTIVE before certification
  - name: guarantee_months_cap
    type: integer
    source: input
    description: Maximum guarantee coverage_months issuable under this program
  - name: active
    type: boolean
    source: input
    default: true
    description: Program accepting new certifications
- name: Listing
  parent: Seller
  common_fields: true
  fields:
  - name: seller_id
    type: string
    source: input
    description: FK -> Seller.id; owning seller
  - name: address_line
    type: string
    source: input
    description: Street address
  - name: listing_state
    type: string
    source: input
    description: 2-letter state code of the property (drives remote-signing and out-of-state logic)
  - name: asking_price_cents
    type: integer
    source: input
    description: Asking price, integer cents > 0
  - name: status
    type: enum
    source: system
    description: Listing lifecycle
    constraints: enum {DRAFT, SUBMITTED, IN_REVIEW, CERTIFIED, LISTED, OFFER_PENDING, UNDER_CONTRACT, SOLD, WITHDRAWN}
  - name: listing_kind
    type: enum
    source: input
    description: Single property or bulk portfolio
    constraints: enum {SINGLE, PORTFOLIO}; PORTFOLIO requires bulk_price_cents
  - name: bulk_price_cents
    type: integer
    source: input
    description: Aggregate price for PORTFOLIO listing; required when listing_kind=PORTFOLIO
  - name: certification_program_id
    type: string
    source: input
    description: FK -> CertificationProgram.id; optional at draft, required before CERTIFIED
  - name: certified_at
    type: datetime
    source: system
    description: UTC timestamp of CERTIFIED entry (logical clock)
  - name: seller_asks_confidential
    type: boolean
    source: input
    default: false
    description: 'Feature flag: when true, tenant payment history is redacted in underwriting outputs (disclosure limitation) and the REDACTED underwriting variant applies'
- name: InspectionReport
  parent: Listing
  common_fields: true
  fields:
  - name: listing_id
    type: string
    source: input
    description: FK -> Listing.id
  - name: inspector_name
    type: string
    source: input
    description: Inspector of record
  - name: inspection_date
    type: datetime
    source: input
    description: UTC date the inspection occurred
  - name: overall_score
    type: integer
    source: input
    description: 0-100 composite condition score
  - name: roof_score
    type: integer
    source: input
    description: 0-100 roof sub-score
  - name: systems_score
    type: integer
    source: input
    description: 0-100 mechanical systems sub-score
  - name: disclosed_defects
    type: array
    source: input
    description: Array of {code, severity, description}; severity in {LOW, MEDIUM, HIGH}
  - name: title_grade
    type: enum
    source: input
    description: Title standard grade
    constraints: enum {A, B, C}
  - name: submitted_by_seller_id
    type: string
    source: system
    description: Seller id who submitted the report (segregation-of-duties check on verify)
  - name: status
    type: enum
    source: system
    description: Inspection review lifecycle
    constraints: enum {DRAFT, SUBMITTED, VERIFIED, REJECTED}
- name: Lease
  parent: Listing
  common_fields: true
  fields:
  - name: listing_id
    type: string
    source: input
    description: FK -> Listing.id
  - name: tenant_alias
    type: string
    source: input
    description: Pseudonymous tenant identifier (privacy)
  - name: monthly_rent_cents
    type: integer
    source: input
    description: Contract rent, integer cents > 0
  - name: lease_start
    type: datetime
    source: input
    description: Lease start date (UTC)
  - name: lease_end
    type: datetime
    source: input
    description: Lease end date (UTC); must be strictly after lease_start
  - name: deposit_cents
    type: integer
    source: input
    description: Security deposit held, integer cents >= 0
  - name: disclosure_status
    type: enum
    source: system
    description: Disclosure dimension of the lease
    constraints: enum {PENDING, DISCLOSED, REDACTED}
  - name: status
    type: enum
    source: system
    description: Tenancy dimension of the lease
    constraints: enum {ACTIVE, ASSIGNED, TERMINATED}
- name: PaymentRecord
  parent: Lease
  common_fields: false
  fields:
  - name: lease_id
    type: string
    source: input
    description: FK -> Lease.id
  - name: due_date
    type: datetime
    source: input
    description: Rent due date (UTC)
  - name: paid_date
    type: datetime
    source: input
    description: UTC date payment received; omitted/null means unpaid
  - name: amount_cents
    type: integer
    source: input
    description: Amount paid, integer cents >= 0
  - name: late
    type: boolean
    source: computed
    description: paid_date strictly more than LATE_GRACE_DAYS after due_date
- name: UnderwritingReport
  parent: Listing
  common_fields: true
  fields:
  - name: listing_id
    type: string
    source: input
    description: FK -> Listing.id
  - name: buyer_id
    type: string
    source: input
    description: FK -> Buyer.id; report owner
  - name: rent_estimate_cents
    type: integer
    source: input
    description: Buyer/analyst market-rent estimate, integer cents > 0
  - name: vacancy_rate_bps
    type: integer
    source: input
    description: Vacancy assumption in basis points, 0-5000
  - name: opex_rate_bps
    type: integer
    source: input
    description: Operating-expense ratio in basis points, 0-9000
  - name: projected_noi_cents
    type: integer
    source: computed
    description: Projected net operating income (see projected_noi calculation; variant selected by disclosure_limited)
  - name: projected_yield_bps
    type: integer
    source: computed
    description: Projected yield in basis points against the price basis (see projected_yield calculation)
  - name: disclosure_limited
    type: boolean
    source: computed
    description: True when listing.seller_asks_confidential=true; when true the report omits tenant payment history from any output view
- name: Offer
  parent: Listing
  common_fields: true
  fields:
  - name: listing_id
    type: string
    source: input
    description: FK -> Listing.id
  - name: buyer_id
    type: string
    source: input
    description: FK -> Buyer.id; offering buyer
  - name: amount_cents
    type: integer
    source: input
    description: Current offer amount, integer cents > 0; updated on resubmit
  - name: earnest_money_cents
    type: integer
    source: input
    description: Earnest money deposit, integer cents >= EARNEST_MIN_CENTS
  - name: financing_type
    type: enum
    source: input
    description: Financing type
    constraints: enum {CASH, CONVENTIONAL, HARD_MONEY}
  - name: status
    type: enum
    source: system
    description: Negotiation lifecycle
    constraints: enum {DRAFT, SUBMITTED, COUNTERED, ACCEPTED, DECLINED, WITHDRAWN, EXPIRED}
  - name: round_number
    type: integer
    source: system
    description: Negotiation round, starts at 1; increments on each COUNTERED entry; resubmit requires round_number < MAX_NEGOTIATION_ROUNDS
  - name: is_out_of_state
    type: boolean
    source: system
    description: 'Pinned at creation: buyer.buyer_state != listing.listing_state; never recomputed'
  - name: expires_at
    type: datetime
    source: system
    description: SUBMITTED offers expire at logical clock + OFFER_TTL_HOURS; refreshed on resubmit
- name: Escrow
  parent: Offer
  common_fields: true
  fields:
  - name: offer_id
    type: string
    source: input
    description: FK -> Offer.id; exactly one Escrow per accepted Offer
  - name: escrow_officer_name
    type: string
    source: input
    description: Escrow officer of record (set at SEND_DOCS)
  - name: status
    type: enum
    source: system
    description: Closing lifecycle
    constraints: enum {OPENED, DOCS_SENT, SIGNED, FUNDED, CLOSED, CANCELLED}
  - name: remote_signing_required
    type: boolean
    source: computed
    description: True when offer.is_out_of_state=true; a remote_notarization_ref is then mandatory at sign
  - name: signed_at
    type: datetime
    source: system
    description: UTC timestamp of signing completion (logical clock)
  - name: funded_amount_cents
    type: integer
    source: system
    description: Amount funded by buyer; must equal offer.amount_cents exactly to enter FUNDED
- name: PropertyManager
  parent: null
  common_fields: true
  fields:
  - name: company_name
    type: string
    source: input
    description: PM company name
  - name: markets
    type: array
    source: input
    description: Array of 2-letter state codes served
  - name: onboarding_fee_bps
    type: integer
    source: input
    description: Onboarding fee in basis points of first-year scheduled rent, 0-2000
  - name: monthly_fee_bps
    type: integer
    source: input
    description: Recurring management fee in basis points of collected rent, 0-3000
  - name: active
    type: boolean
    source: input
    default: true
    description: Accepting referrals
- name: ManagementReferral
  parent: Listing
  common_fields: true
  fields:
  - name: listing_id
    type: string
    source: input
    description: FK -> Listing.id; listing handed off at closing
  - name: property_manager_id
    type: string
    source: input
    description: FK -> PropertyManager.id
  - name: status
    type: enum
    source: system
    description: Referral lifecycle
    constraints: enum {REFERRED, ACCEPTED, ONBOARDED, DECLINED}
  - name: onboarding_fee_cents
    type: integer
    source: computed
    description: Onboarding fee (see pm_onboarding_fee calculation), computed at ONBOARDED
  - name: lease_continuity_confirmed
    type: boolean
    source: system
    description: True once the existing Lease transitions to ASSIGNED under the new owner at closing
- name: Guarantee
  parent: Listing
  common_fields: true
  fields:
  - name: listing_id
    type: string
    source: input
    description: FK -> Listing.id; certified listing covered
  - name: guarantee_kind
    type: enum
    source: input
    description: Coverage kind
    constraints: enum {VACANCY, LEASE_UP}
  - name: coverage_months
    type: integer
    source: input
    description: Months of coverage; 1..certification program guarantee_months_cap
  - name: status
    type: enum
    source: system
    description: Guarantee lifecycle
    constraints: enum {ISSUED, ACTIVE, CLAIMED, PAID, EXPIRED, VOID}
  - name: claim_amount_cents
    type: integer
    source: computed
    description: Amount payable on claim (see guarantee_claim_amount calculation)
  - name: claimed_at
    type: datetime
    source: system
    description: UTC claim timestamp (logical clock)
- name: Dispute
  parent: Listing
  common_fields: true
  fields:
  - name: listing_id
    type: string
    source: input
    description: FK -> Listing.id; disputed listing (post-close)
  - name: opened_by
    type: enum
    source: input
    description: Opening party
    constraints: enum {BUYER, SELLER}
  - name: opener_user_id
    type: string
    source: system
    description: X-User-ID of the opener (segregation-of-duties check on resolution)
  - name: condition_code
    type: string
    source: input
    description: Disclosed-condition code contested; must exist in the listing's latest VERIFIED InspectionReport.disclosed_defects[].code
  - name: status
    type: enum
    source: system
    description: Dispute lifecycle
    constraints: enum {OPENED, EVIDENCE, RESOLVED_BUYER, RESOLVED_SELLER, WITHDRAWN}
  - name: remedy_cents
    type: integer
    source: input
    description: Remedy amount proposed; integer cents >= 0
state_machines:
- entity: Listing
  field: status
  initial_state: DRAFT
  terminal_states:
  - SOLD
  - WITHDRAWN
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /marketplace/listings/{id}/transition with action=SUBMIT
    actor: Seller
    preconditions:
    - Seller owns listing (seller_id == X-User-ID)
    - listing_kind=SINGLE OR (listing_kind=PORTFOLIO AND bulk_price_cents > 0)
    side_effects:
    - Seller.listed_count recomputed
    - Seller.bulk_discount_bps recomputed (see bulk_discount_bps calculation)
  - from: SUBMITTED
    to: IN_REVIEW
    trigger: POST /marketplace/listings/{id}/transition with action=BEGIN_REVIEW
    actor: CertificationReviewer
    preconditions:
    - At least one InspectionReport for the listing with status = VERIFIED
    side_effects: []
  - from: IN_REVIEW
    to: CERTIFIED
    trigger: POST /marketplace/listings/{id}/transition with action=CERTIFY
    actor: CertificationReviewer
    preconditions:
    - certification_program_id is set and program.active = true
    - latest VERIFIED InspectionReport (max inspection_date; tie-break created_at DESC) has overall_score >= program.min_inspection_score
    - latest VERIFIED InspectionReport.title_grade <= program.min_title_grade in grade order A<B<C
    - latest VERIFIED InspectionReport.inspection_date within INSPECTION_MAX_AGE_DAYS of the logical clock
    - 'if program.requires_lease_disclosure: at least one Lease for the listing with disclosure_status = DISCLOSED and status = ACTIVE'
    side_effects:
    - certified_at set to logical clock
  - from: IN_REVIEW
    to: WITHDRAWN
    trigger: POST /marketplace/listings/{id}/transition with action=WITHDRAW
    actor: Seller
    preconditions: []
    side_effects:
    - Seller.listed_count recomputed
    - Seller.bulk_discount_bps recomputed
  - from: CERTIFIED
    to: LISTED
    trigger: POST /marketplace/listings/{id}/transition with action=PUBLISH
    actor: Seller
    preconditions:
    - Seller owns listing
    side_effects: []
  - from: LISTED
    to: OFFER_PENDING
    trigger: system (first Offer enters SUBMITTED)
    actor: system
    preconditions: []
    side_effects: []
  - from: OFFER_PENDING
    to: LISTED
    trigger: system (no Offer remains in {SUBMITTED, COUNTERED} and none is ACCEPTED)
    actor: system
    preconditions: []
    side_effects: []
  - from: OFFER_PENDING
    to: UNDER_CONTRACT
    trigger: system (an Offer enters ACCEPTED)
    actor: system
    preconditions: []
    side_effects:
    - Every other Offer in {SUBMITTED, COUNTERED} on this listing -> EXPIRED
    - Escrow created for the accepted Offer with status OPENED and remote_signing_required per offer.is_out_of_state
  - from: UNDER_CONTRACT
    to: SOLD
    trigger: system (Escrow reaches CLOSED)
    actor: system
    preconditions: []
    side_effects:
    - Lease for the listing with status = ACTIVE -> ASSIGNED (lease continuity to buyer)
    - ManagementReferral for this listing in {REFERRED, ACCEPTED} -> ONBOARDED; onboarding_fee_cents computed (see pm_onboarding_fee)
    - Guarantee for this listing in ISSUED -> ACTIVE
    - Seller.listed_count recomputed
    - Seller.bulk_discount_bps recomputed
  - from: UNDER_CONTRACT
    to: LISTED
    trigger: system (Escrow reaches CANCELLED)
    actor: system
    preconditions: []
    side_effects:
    - Guarantee for this listing in {ISSUED, ACTIVE} -> VOID
  - from:
    - LISTED
    - OFFER_PENDING
    to: WITHDRAWN
    trigger: POST /marketplace/listings/{id}/transition with action=WITHDRAW
    actor: Seller
    preconditions:
    - No Offer on the listing in state ACCEPTED
    side_effects:
    - All Offers in {SUBMITTED, COUNTERED} -> WITHDRAWN
    - Guarantee in {ISSUED, ACTIVE} -> VOID
    - Seller.listed_count recomputed
    - Seller.bulk_discount_bps recomputed
- entity: InspectionReport
  field: status
  initial_state: DRAFT
  terminal_states:
  - VERIFIED
  - REJECTED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /marketplace/inspection-reports/{id}/transition with action=SUBMIT
    actor: Seller
    preconditions:
    - Listing.status IN {DRAFT, SUBMITTED, IN_REVIEW}
    side_effects:
    - submitted_by_seller_id = X-User-ID
  - from: SUBMITTED
    to: VERIFIED
    trigger: POST /marketplace/inspection-reports/{id}/transition with action=VERIFY
    actor: CertificationReviewer
    preconditions:
    - 'Segregation of duties: verifier X-User-ID != submitted_by_seller_id (different individual; an opaque reviewer id equal to the submitting seller id is forbidden)'
    side_effects: []
  - from: SUBMITTED
    to: REJECTED
    trigger: POST /marketplace/inspection-reports/{id}/transition with action=REJECT
    actor: CertificationReviewer
    preconditions: []
    side_effects: []
  - from: REJECTED
    to: DRAFT
    trigger: POST /marketplace/inspection-reports/{id}/transition with action=REVISE
    actor: Seller
    preconditions: []
    side_effects: []
    note: Revision loop — a report may cycle DRAFT->SUBMITTED->REJECTED->DRAFT repeatedly
- entity: Lease
  field: disclosure_status
  initial_state: PENDING
  terminal_states: []
  transitions:
  - from: PENDING
    to: DISCLOSED
    trigger: POST /marketplace/leases/{id}/transition with action=DISCLOSE
    actor: Seller
    preconditions:
    - Lease.status = ACTIVE
    side_effects: []
  - from: PENDING
    to: REDACTED
    trigger: POST /marketplace/leases/{id}/transition with action=REDACT
    actor: Seller
    preconditions:
    - Listing.seller_asks_confidential = true
    side_effects: []
  - from: REDACTED
    to: DISCLOSED
    trigger: POST /marketplace/leases/{id}/transition with action=DISCLOSE
    actor: Seller
    preconditions:
    - Lease.status = ACTIVE
    side_effects: []
    note: Disclosure dimension cycles PENDING->REDACTED->DISCLOSED independent of the tenancy dimension
- entity: Lease
  field: status
  initial_state: ACTIVE
  terminal_states:
  - TERMINATED
  transitions:
  - from: ACTIVE
    to: ASSIGNED
    trigger: system (Listing reaches SOLD — lease continuity to buyer)
    actor: system
    preconditions: []
    side_effects:
    - ManagementReferral.lease_continuity_confirmed = true on the listing's ONBOARDED referral
  - from: ACTIVE
    to: TERMINATED
    trigger: POST /marketplace/leases/{id}/transition with action=TERMINATE
    actor: Seller
    preconditions:
    - Listing.status IN {DRAFT, SUBMITTED, IN_REVIEW} (pre-sale only)
    side_effects: []
- entity: Offer
  field: status
  initial_state: DRAFT
  terminal_states:
  - ACCEPTED
  - DECLINED
  - WITHDRAWN
  - EXPIRED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /marketplace/offers/{id}/transition with action=SUBMIT
    actor: Buyer
    preconditions:
    - Buyer owns offer (buyer_id == X-User-ID)
    - Listing.status IN {LISTED, OFFER_PENDING}
    - earnest_money_cents >= EARNEST_MIN_CENTS
    - 'if financing_type = CASH: buyer.proof_of_funds_cents >= amount_cents'
    side_effects:
    - expires_at = logical clock + OFFER_TTL_HOURS
    - Listing LISTED -> OFFER_PENDING
  - from: SUBMITTED
    to: COUNTERED
    trigger: POST /marketplace/offers/{id}/transition with action=COUNTER
    actor: Seller
    preconditions:
    - Seller owns the listing
    - counter_amount_cents > 0
    side_effects:
    - round_number increments by 1
  - from: COUNTERED
    to: SUBMITTED
    trigger: POST /marketplace/offers/{id}/transition with action=RESUBMIT
    actor: Buyer
    preconditions:
    - Buyer owns offer
    - round_number < MAX_NEGOTIATION_ROUNDS
    side_effects:
    - amount_cents updated to payload amount_cents
    - expires_at refreshed = logical clock + OFFER_TTL_HOURS
  - from: COUNTERED
    to: DECLINED
    trigger: POST /marketplace/offers/{id}/transition with action=DECLINE (by Buyer)
    actor: Buyer
    preconditions: []
    side_effects:
    - 'If no other Offer on listing in {SUBMITTED, COUNTERED}: Listing OFFER_PENDING -> LISTED'
  - from:
    - SUBMITTED
    - COUNTERED
    to: ACCEPTED
    trigger: POST /marketplace/offers/{id}/transition with action=ACCEPT
    actor: Seller
    preconditions:
    - Seller owns the listing
    - No other Offer on the listing in state ACCEPTED
    side_effects:
    - Listing OFFER_PENDING -> UNDER_CONTRACT
    - All sibling Offers in {SUBMITTED, COUNTERED} -> EXPIRED
    - Escrow created (status OPENED; remote_signing_required per offer.is_out_of_state)
  - from:
    - SUBMITTED
    - COUNTERED
    to: DECLINED
    trigger: POST /marketplace/offers/{id}/transition with action=DECLINE (by Seller)
    actor: Seller
    preconditions: []
    side_effects:
    - 'If no other Offer on listing in {SUBMITTED, COUNTERED}: Listing OFFER_PENDING -> LISTED'
  - from:
    - DRAFT
    - SUBMITTED
    - COUNTERED
    to: WITHDRAWN
    trigger: POST /marketplace/offers/{id}/transition with action=WITHDRAW
    actor: Buyer
    preconditions:
    - Buyer owns offer
    side_effects:
    - 'If no other Offer on listing in {SUBMITTED, COUNTERED}: Listing OFFER_PENDING -> LISTED'
  - from: SUBMITTED
    to: EXPIRED
    trigger: system (logical clock >= expires_at, evaluated on clock set and on any offer read/action)
    actor: system
    preconditions: []
    side_effects:
    - 'If no other Offer on listing in {SUBMITTED, COUNTERED}: Listing OFFER_PENDING -> LISTED'
- entity: Escrow
  field: status
  initial_state: OPENED
  terminal_states:
  - CLOSED
  - CANCELLED
  transitions:
  - from: OPENED
    to: DOCS_SENT
    trigger: POST /marketplace/escrows/{id}/transition with action=SEND_DOCS
    actor: EscrowOfficer
    preconditions: []
    side_effects:
    - escrow_officer_name recorded
  - from: DOCS_SENT
    to: SIGNED
    trigger: POST /marketplace/escrows/{id}/sign (OCC)
    actor: Buyer
    preconditions:
    - Buyer owns the underlying Offer
    - 'if remote_signing_required: payload remote_notarization_ref must be present and non-empty'
    - expected_escrow_version == current Escrow.version
    side_effects:
    - signed_at set to logical clock
    - Escrow.version increments by 1
  - from: SIGNED
    to: FUNDED
    trigger: POST /marketplace/escrows/{id}/fund
    actor: Buyer
    preconditions:
    - Buyer owns the underlying Offer
    - payload funded_amount_cents == offer.amount_cents exactly
    side_effects:
    - funded_amount_cents recorded
  - from: FUNDED
    to: CLOSED
    trigger: POST /marketplace/escrows/{id}/transition with action=CLOSE
    actor: EscrowOfficer
    preconditions: []
    side_effects:
    - Listing UNDER_CONTRACT -> SOLD
    - Lease ACTIVE -> ASSIGNED (continuity); referral.lease_continuity_confirmed = true
    - ManagementReferral {REFERRED, ACCEPTED} -> ONBOARDED with onboarding_fee_cents computed
    - Guarantee ISSUED -> ACTIVE
    - Seller.listed_count and bulk_discount_bps recomputed
  - from:
    - OPENED
    - DOCS_SENT
    - SIGNED
    to: CANCELLED
    trigger: POST /marketplace/escrows/{id}/transition with action=CANCEL
    actor: EscrowOfficer
    preconditions: []
    side_effects:
    - Listing UNDER_CONTRACT -> LISTED
    - Guarantee in {ISSUED, ACTIVE} for the listing -> VOID
- entity: ManagementReferral
  field: status
  initial_state: REFERRED
  terminal_states:
  - ONBOARDED
  - DECLINED
  transitions:
  - from: REFERRED
    to: ACCEPTED
    trigger: POST /marketplace/management-referrals/{id}/transition with action=ACCEPT
    actor: PropertyManager
    preconditions:
    - property_manager_id == X-User-ID
    - PropertyManager.active = true
    - Listing.listing_state IN PropertyManager.markets
    side_effects: []
  - from: REFERRED
    to: DECLINED
    trigger: POST /marketplace/management-referrals/{id}/transition with action=DECLINE
    actor: PropertyManager
    preconditions:
    - property_manager_id == X-User-ID
    side_effects: []
  - from:
    - REFERRED
    - ACCEPTED
    to: ONBOARDED
    trigger: system (Escrow for the listing reaches CLOSED)
    actor: system
    preconditions: []
    side_effects:
    - onboarding_fee_cents computed (see pm_onboarding_fee)
    - lease_continuity_confirmed = true once the Lease transitions to ASSIGNED
- entity: Guarantee
  field: status
  initial_state: ISSUED
  terminal_states:
  - PAID
  - EXPIRED
  - VOID
  transitions:
  - from: ISSUED
    to: ACTIVE
    trigger: system (Escrow for the listing reaches CLOSED)
    actor: system
    preconditions: []
    side_effects: []
  - from: ACTIVE
    to: CLAIMED
    trigger: POST /marketplace/guarantees/{id}/transition with action=CLAIM
    actor: Buyer
    preconditions:
    - Buyer owns the ACCEPTED Offer for the listing
    - logical clock within coverage_months * 30 days of the listing's SOLD timestamp (claim window)
    - 'for VACANCY: no Lease on the listing in status IN {ACTIVE, ASSIGNED} at claim time'
    - 'for LEASE_UP: a PaymentRecord with due_date in [sold_date, claim_date] exists that is unpaid or late'
    side_effects:
    - claimed_at set to logical clock
    - claim_amount_cents computed (see guarantee_claim_amount)
  - from: CLAIMED
    to: PAID
    trigger: POST /marketplace/guarantees/{id}/transition with action=PAY
    actor: ClaimsAdjuster
    preconditions: []
    side_effects: []
  - from: CLAIMED
    to: VOID
    trigger: POST /marketplace/guarantees/{id}/transition with action=DENY
    actor: ClaimsAdjuster
    preconditions: []
    side_effects: []
  - from: ACTIVE
    to: EXPIRED
    trigger: system (logical clock beyond claim window; evaluated on clock set)
    actor: system
    preconditions: []
    side_effects: []
- entity: Dispute
  field: status
  initial_state: OPENED
  terminal_states:
  - RESOLVED_BUYER
  - RESOLVED_SELLER
  - WITHDRAWN
  transitions:
  - from: OPENED
    to: EVIDENCE
    trigger: POST /marketplace/disputes/{id}/transition with action=START_EVIDENCE
    actor: ClaimsAdjuster
    preconditions:
    - condition_code exists in the listing's latest VERIFIED InspectionReport.disclosed_defects[].code
    side_effects: []
  - from: EVIDENCE
    to: RESOLVED_BUYER
    trigger: POST /marketplace/disputes/{id}/transition with action=RESOLVE_BUYER
    actor: ClaimsAdjuster
    preconditions:
    - 'Segregation of duties: resolver X-User-ID != opener_user_id'
    side_effects:
    - 'If a Guarantee in state ACTIVE covers the listing and the contested condition_code maps to a disclosed defect: Guarantee ACTIVE -> CLAIMED with claim_amount_cents recomputed'
  - from: EVIDENCE
    to: RESOLVED_SELLER
    trigger: POST /marketplace/disputes/{id}/transition with action=RESOLVE_SELLER
    actor: ClaimsAdjuster
    preconditions:
    - 'Segregation of duties: resolver X-User-ID != opener_user_id'
    side_effects: []
  - from:
    - OPENED
    - EVIDENCE
    to: WITHDRAWN
    trigger: POST /marketplace/disputes/{id}/transition with action=WITHDRAW
    actor: Buyer
    preconditions:
    - X-User-ID == opener_user_id (only the opener withdraws)
    side_effects: []
concurrency_rules:
- rule_id: offer-create-stale-listing
  parent_entity: Listing
  write_endpoint: POST /marketplace/listings/{id}/offers
  occ_field: expected_listing_version
  description: 'Creating an Offer against a Listing whose version has advanced since the

    buyer last observed it is rejected: an intervening mutation (e.g., another

    offer''s creation bumping the version) invalidates the buyer''s underwriting

    basis. The writer must re-read the listing and retry with the fresh version.

    '
  error_id: ERR_STALE_LISTING_VERSION
  http_status: 412
- rule_id: escrow-sign-stale-escrow
  parent_entity: Escrow
  write_endpoint: POST /marketplace/escrows/{id}/sign
  occ_field: expected_escrow_version
  description: 'Signing an Escrow whose version has advanced since the signer last observed

    it (e.g., a prior sign attempt already advanced it) is rejected; the signer

    must re-read the escrow before signing.

    '
  error_id: ERR_STALE_ESCROW_VERSION
  http_status: 412
calculations:
- name: projected_noi
  trigger: UnderwritingReport creation
  algorithm: aggregation
  formula: "Variant BASE (disclosure_limited = false):\n  gross = rent_estimate_cents * 12\n  vac = floor(gross * vacancy_rate_bps / 10000)\n  opex = floor((gross - vac) * opex_rate_bps / 10000)\n  projected_noi_cents\
    \ = gross - vac - opex\nVariant REDACTED (disclosure_limited = true; tenant history withheld, so a\nvacancy risk uplift applies):\n  gross = rent_estimate_cents * 12\n  vac = floor(gross * (vacancy_rate_bps\
    \ + REDACTED_VACANCY_UPLIFT_BPS) / 10000)\n  opex = floor((gross - vac) * opex_rate_bps / 10000)\n  projected_noi_cents = gross - vac - opex\nRounding order is pinned: floor the vacancy line first,\
    \ then floor opex on\nthe post-vacancy base, then subtract. Flooring only the final total is\nFORBIDDEN (produces different cents).\n"
  input_set: The UnderwritingReport's own input fields; disclosure_limited derived from the parent Listing.seller_asks_confidential
  constants:
    MONTHS_PER_YEAR: 12
    REDACTED_VACANCY_UPLIFT_BPS: 300
  precision: 'integer cents; floor per line in pinned order: vacancy -> opex -> subtract'
  variants:
  - name: BASE
    when: listing.seller_asks_confidential = false
    difference: no vacancy uplift
  - name: REDACTED
    when: listing.seller_asks_confidential = true (disclosure limitation)
    difference: vacancy_rate_bps increased by REDACTED_VACANCY_UPLIFT_BPS before the floor step
- name: projected_yield
  trigger: UnderwritingReport creation, after projected_noi
  algorithm: aggregation
  formula: "price_basis =\n  if listing.listing_kind = SINGLE    then listing.asking_price_cents\n  if listing.listing_kind = PORTFOLIO then listing.bulk_price_cents\nprojected_yield_bps = floor(projected_noi_cents\
    \ * 10000 / price_basis)\nEvaluation order pinned: projected_noi first, then yield against the basis.\nprice_basis is never zero (asking_price_cents > 0; PORTFOLIO requires\nbulk_price_cents > 0 at\
    \ submit).\n"
  input_set: projected_noi_cents (already computed), Listing.asking_price_cents / Listing.bulk_price_cents
  constants: {}
  precision: integer basis points, floor
- name: bulk_discount_bps
  trigger: Seller.listed_count recompute (listing submit, withdraw, or sale)
  algorithm: tiered_pricing
  formula: "Tier on listed_count (listings with status NOT IN {SOLD, WITHDRAWN}):\n  listed_count >= 10 -> 500 bps\n  listed_count >= 5  -> 300 bps\n  listed_count >= 2  -> 100 bps\n  else             \
    \  -> 0 bps\nBoundary semantics: thresholds are INCLUSIVE (>=); a count of exactly 5\nyields 300 bps, exactly 2 yields 100 bps.\n"
  input_set: Seller's Listings with status NOT IN {SOLD, WITHDRAWN}
  constants:
    TIER_10_BPS: 500
    TIER_5_BPS: 300
    TIER_2_BPS: 100
  precision: integer bps
- name: pm_onboarding_fee
  trigger: ManagementReferral transitions to ONBOARDED at closing
  algorithm: aggregation
  formula: "Evaluation order pinned (circular-looking dependency resolved):\n  1. resolve the lease: the listing's Lease with status IN {ACTIVE, ASSIGNED}\n     (at most one expected; if several, pick max\
    \ monthly_rent_cents,\n     tie-break created_at ASC)\n  2. scheduled_annual_rent_cents = lease.monthly_rent_cents * 12 (0 if no such lease)\n  3. onboarding_fee_cents = floor(scheduled_annual_rent_cents\
    \ * property_manager.onboarding_fee_bps / 10000)\nThe fee is derived from lease rent and the PM fee basis ONLY; it never feeds\nback into the lease, the offer, or the listing price.\n"
  input_set: Lease (status IN {ACTIVE, ASSIGNED}) for the listing; PropertyManager.onboarding_fee_bps
  constants:
    MONTHS_PER_YEAR: 12
  precision: integer cents, floor
- name: guarantee_claim_amount
  trigger: Guarantee transitions to CLAIMED
  algorithm: waterfall_allocation
  formula: "Variant VACANCY (forward-looking):\n  monthly_coverage = monthly_rent_cents of the lease that was ASSIGNED at\n    closing; if none, use the listing's most recent TERMINATED lease\n    (max\
    \ lease_end; tie-break created_at DESC); if no lease exists at all,\n    the claim is invalid -> ERR_GUARANTEE_NOT_CLAIMABLE\n  elapsed_months = floor(days between SOLD timestamp and claim timestamp\
    \ / 30)\n  payable_months = max(0, coverage_months - elapsed_months)\n  claim_amount_cents = monthly_coverage * payable_months\nVariant LEASE_UP (chronological):\n  claim_amount_cents = min(\n    sum\
    \ of PaymentRecord.amount_cents for records on the listing's leases\n      with due_date in [sold_timestamp, claim_timestamp] that are unpaid\n      (paid_date null) or late = true,\n    monthly_rent_cents\
    \ (of the ASSIGNED lease; else most recent TERMINATED\n      as above) * coverage_months\n  )\nThe two variants draw on different quantities: VACANCY pays forward-looking\nrent months; LEASE_UP reimburses\
    \ historical unpaid/late records.\n"
  input_set: Guarantee.coverage_months, listing's Leases, PaymentRecords with due_date in the claim window
  constants:
    DAYS_PER_MONTH: 30
  precision: integer cents
  variants:
  - name: VACANCY
    when: guarantee_kind = VACANCY
    difference: 'forward-looking: rent * remaining covered months after elapsed time'
  - name: LEASE_UP
    when: guarantee_kind = LEASE_UP
    difference: 'chronological: sum of unpaid/late records in window, capped at rent * coverage_months'
- name: late_flag
  trigger: PaymentRecord creation and whenever paid_date is set
  algorithm: threshold
  formula: 'late = (paid_date is not null) AND (paid_date > due_date + LATE_GRACE_DAYS days)

    Boundary: payment exactly at due_date + LATE_GRACE_DAYS (same instant) is

    NOT late (strict >).

    '
  input_set: The PaymentRecord's own due_date and paid_date
  constants:
    LATE_GRACE_DAYS: 5
  precision: boolean
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers present and non-empty; role declared in the RBAC matrix
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all
- priority: 2
  category: auth
  check: Role permitted for this endpoint (RBAC); entity-backed roles must own the resource where ownership is declared
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: Path ids exist, validated left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 4
  category: state
  check: Target entity in a state from which the requested transition is defined (per §1.2)
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all transition/action endpoints
- priority: 5
  category: business_safety
  check: 'Segregation of duties: inspection verifier != submitted_by_seller_id; dispute resolver != opener_user_id'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 409
  applies_to: inspection-reports transition action=VERIFY; disputes transition action=RESOLVE_BUYER/RESOLVE_SELLER
- priority: 6
  category: business_constraint
  check: 'Shape/type constraints: enum membership, lease_end strictly after lease_start, positive amounts, coverage_months within program guarantee_months_cap, PORTFOLIO requires bulk_price_cents'
  error_id: ERR_VALIDATION
  http_status: 422
  applies_to: create endpoints
- priority: 7
  category: business_constraint
  check: 'Lease period overlap (half-open interval semantics): a new Lease on a listing is rejected if an existing Lease with status = ACTIVE has [lease_start, lease_end) intersecting the new [lease_start,
    lease_end); pure adjacency (new.lease_start == existing.lease_end OR new.lease_end == existing.lease_start) is PERMITTED'
  error_id: ERR_LEASE_PERIOD_OVERLAP
  http_status: 409
  applies_to: POST /marketplace/listings/{id}/leases
- priority: 8
  category: business_constraint
  check: 'Payment-record due-month bucket (discrete calendar-month semantics): a new PaymentRecord is rejected if another PaymentRecord on the same lease already has a due_date in the same UTC calendar
    month, regardless of the day or time component'
  error_id: ERR_DUPLICATE_DUE_MONTH
  http_status: 409
  applies_to: POST /marketplace/leases/{id}/payment-records
- priority: 9
  category: business_temporal
  check: 'Temporal rules vs logical clock: offer not expired at accept; guarantee claim within coverage window; certification inspection within INSPECTION_MAX_AGE_DAYS'
  error_id: ERR_EXPIRED
  http_status: 409
  applies_to: offers transition action=ACCEPT; guarantees transition action=CLAIM; listings transition action=CERTIFY
- priority: 10
  category: business_referential
  check: 'Cross-entity preconditions: certification prerequisites (VERIFIED report, DISCLOSED lease, active program); listing in LISTED/OFFER_PENDING for offer submit; no other ACCEPTED offer; PM market
    match; guarantee claim conditions'
  error_id: ERR_PRECONDITION
  http_status: 409
  applies_to: listings transition action=CERTIFY; offers transition; management-referrals transition; guarantees transition action=CLAIM
- priority: 11
  category: business_fiscal
  check: 'Funds/fee checks: earnest money >= EARNEST_MIN_CENTS; CASH offers require proof_of_funds_cents >= amount_cents; funded_amount_cents == offer.amount_cents'
  error_id: ERR_INSUFFICIENT_FUNDS
  http_status: 402
  applies_to: offers transition action=SUBMIT/RESUBMIT; escrows fund
endpoints:
- method: POST
  path: /marketplace/_clock/set_current_utc
  description: Set logical clock; before any call the clock reads exactly 2026-09-01T00:00:00Z (never wall-clock). Setting the clock runs the offer-expiry sweep (SUBMITTED offers with expires_at <= clock
    -> EXPIRED) and the guarantee-expiry sweep.
  roles:
  - PlatformAdmin
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: datetime
  side_effects:
  - offer expiry sweep
  - guarantee expiry sweep
- method: GET
  path: /marketplace/underwriting-reports
  description: List underwriting reports; filterable
  roles:
  - PlatformAdmin
  - Buyer
  code: 200
  input:
  - listing_id?
  - buyer_id?
  - limit?
  - offset?
  output: UnderwritingReport[]
  side_effects: []
- method: POST
  path: /marketplace/sellers
  description: Register seller
  roles:
  - PlatformAdmin
  code: 201
  input:
  - legal_name
  - seller_state
  - seller_type
  output: Seller
  side_effects:
  - listed_count=0, bulk_discount_bps=0
- method: GET
  path: /marketplace/sellers/{id}
  description: Get seller (listed_count, bulk_discount_bps re-read after mutations)
  roles:
  - PlatformAdmin
  - Seller
  code: 200
  input: []
  output: Seller
  side_effects: []
- method: POST
  path: /marketplace/buyers
  description: Register buyer
  roles:
  - PlatformAdmin
  code: 201
  input:
  - legal_name
  - buyer_state
  - entity_type
  - proof_of_funds_cents
  - accredited?
  output: Buyer
  side_effects: []
- method: POST
  path: /marketplace/certification-programs
  description: Create certification program
  roles:
  - PlatformAdmin
  code: 201
  input:
  - name
  - min_inspection_score
  - min_title_grade
  - requires_lease_disclosure
  - guarantee_months_cap
  - active?
  output: CertificationProgram
  side_effects: []
- method: POST
  path: /marketplace/listings
  description: Create listing (DRAFT)
  roles:
  - Seller
  code: 201
  input:
  - seller_id
  - address_line
  - listing_state
  - asking_price_cents
  - listing_kind
  - bulk_price_cents?
  - certification_program_id?
  - seller_asks_confidential?
  output: Listing
  side_effects:
  - status=DRAFT
- method: GET
  path: /marketplace/listings
  description: List listings; filterable and paginated
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  - CertificationReviewer
  code: 200
  input:
  - seller_id?
  - certification_program_id?
  - status?
  - listing_state?
  - limit?
  - offset?
  output: Listing[]
  side_effects: []
- method: GET
  path: /marketplace/listings/{id}
  description: Get listing
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  - CertificationReviewer
  code: 200
  input: []
  output: Listing
  side_effects: []
- method: POST
  path: /marketplace/listings/{id}/transition
  description: 'Drive listing lifecycle; action in {SUBMIT, BEGIN_REVIEW, CERTIFY, PUBLISH, WITHDRAW}. Role per action: SUBMIT/PUBLISH/WITHDRAW = Seller; BEGIN_REVIEW/CERTIFY = CertificationReviewer.'
  roles:
  - Seller
  - CertificationReviewer
  code: 200
  input:
  - action
  output: Listing
  side_effects:
  - per §1.2 Listing machine
- method: POST
  path: /marketplace/listings/{id}/inspection-reports
  description: Attach inspection report (DRAFT)
  roles:
  - Seller
  code: 201
  input:
  - inspector_name
  - inspection_date
  - overall_score
  - roof_score
  - systems_score
  - disclosed_defects
  - title_grade
  output: InspectionReport
  side_effects:
  - status=DRAFT
- method: GET
  path: /marketplace/listings/{id}/inspection-reports
  description: List inspection reports for a listing
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  - CertificationReviewer
  code: 200
  input: []
  output: InspectionReport[]
  side_effects: []
- method: POST
  path: /marketplace/inspection-reports/{id}/transition
  description: 'Drive inspection lifecycle; action in {SUBMIT, VERIFY, REJECT, REVISE}. Role per action: SUBMIT/REVISE = Seller; VERIFY/REJECT = CertificationReviewer.'
  roles:
  - Seller
  - CertificationReviewer
  code: 200
  input:
  - action
  output: InspectionReport
  side_effects:
  - per §1.2 InspectionReport machine
- method: POST
  path: /marketplace/listings/{id}/leases
  description: Attach lease (tenant-in-place)
  roles:
  - Seller
  code: 201
  input:
  - tenant_alias
  - monthly_rent_cents
  - lease_start
  - lease_end
  - deposit_cents
  output: Lease
  side_effects:
  - status=ACTIVE, disclosure_status=PENDING
- method: GET
  path: /marketplace/listings/{id}/leases
  description: List leases for a listing
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  code: 200
  input: []
  output: Lease[]
  side_effects: []
- method: POST
  path: /marketplace/leases/{id}/transition
  description: Drive lease dimensions; action in {DISCLOSE, REDACT, TERMINATE} (Seller only)
  roles:
  - Seller
  code: 200
  input:
  - action
  output: Lease
  side_effects:
  - per §1.2 Lease machines
- method: GET
  path: /marketplace/leases/{id}
  description: Get lease
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  - PropertyManager
  code: 200
  input: []
  output: Lease
  side_effects: []
- method: POST
  path: /marketplace/leases/{id}/payment-records
  description: Record tenant payment
  roles:
  - Seller
  - PropertyManager
  code: 201
  input:
  - due_date
  - paid_date?
  - amount_cents
  output: PaymentRecord
  side_effects:
  - late flag computed
- method: GET
  path: /marketplace/leases/{id}/payment-records
  description: List payment records for a lease
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  - PropertyManager
  code: 200
  input: []
  output: PaymentRecord[]
  side_effects: []
- method: POST
  path: /marketplace/listings/{id}/underwriting-reports
  description: Run buyer underwriting (rent estimate, expense assumptions, projected yield)
  roles:
  - Buyer
  code: 201
  input:
  - buyer_id
  - rent_estimate_cents
  - vacancy_rate_bps
  - opex_rate_bps
  output: UnderwritingReport
  side_effects:
  - projected_noi_cents + projected_yield_bps computed per disclosure variant
- method: POST
  path: /marketplace/listings/{id}/offers
  description: Create offer (OCC on listing version)
  roles:
  - Buyer
  code: 201
  input:
  - buyer_id
  - amount_cents
  - earnest_money_cents
  - financing_type
  - expected_listing_version
  output: Offer
  side_effects:
  - status=DRAFT; round_number=1; is_out_of_state pinned; increments Listing.version by 1
- method: GET
  path: /marketplace/offers/{id}
  description: Get offer
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  code: 200
  input: []
  output: Offer
  side_effects: []
- method: GET
  path: /marketplace/offers
  description: List offers; filterable
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  code: 200
  input:
  - listing_id?
  - buyer_id?
  - status?
  - limit?
  - offset?
  output: Offer[]
  side_effects: []
- method: POST
  path: /marketplace/offers/{id}/transition
  description: 'Drive offer negotiation; action in {SUBMIT, COUNTER, RESUBMIT, ACCEPT, DECLINE, WITHDRAW}. Role per action: SUBMIT/RESUBMIT/WITHDRAW = Buyer; COUNTER/ACCEPT = Seller; DECLINE = Buyer (on
    COUNTERED) or Seller (on SUBMITTED/COUNTERED).'
  roles:
  - Buyer
  - Seller
  code: 200
  input:
  - action
  - counter_amount_cents?
  - amount_cents?
  output: Offer
  side_effects:
  - per §1.2 Offer machine
- method: GET
  path: /marketplace/offers/{id}/escrow
  description: Get escrow for an accepted offer (array of length 0 or 1)
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  - EscrowOfficer
  code: 200
  input: []
  output: Escrow[]
  side_effects: []
- method: POST
  path: /marketplace/escrows/{id}/sign
  description: Buyer signs (remote notarization ref required when out-of-state); OCC on escrow version
  roles:
  - Buyer
  code: 200
  input:
  - expected_escrow_version
  - remote_notarization_ref?
  output: Escrow
  side_effects:
  - status -> SIGNED; signed_at set; increments Escrow.version by 1
- method: POST
  path: /marketplace/escrows/{id}/fund
  description: Buyer funds escrow; amount must equal offer amount exactly
  roles:
  - Buyer
  code: 200
  input:
  - funded_amount_cents
  output: Escrow
  side_effects:
  - status -> FUNDED
- method: POST
  path: /marketplace/escrows/{id}/transition
  description: Escrow officer actions; action in {SEND_DOCS, CLOSE, CANCEL}
  roles:
  - EscrowOfficer
  code: 200
  input:
  - action
  - escrow_officer_name?
  output: Escrow
  side_effects:
  - per §1.2 Escrow machine; CLOSE fires the sale cascade
- method: POST
  path: /marketplace/property-managers
  description: Register property manager
  roles:
  - PlatformAdmin
  code: 201
  input:
  - company_name
  - markets
  - onboarding_fee_bps
  - monthly_fee_bps
  - active?
  output: PropertyManager
  side_effects: []
- method: POST
  path: /marketplace/listings/{id}/management-referrals
  description: Refer property manager at closing
  roles:
  - PlatformAdmin
  - Seller
  code: 201
  input:
  - property_manager_id
  output: ManagementReferral
  side_effects:
  - status=REFERRED
- method: GET
  path: /marketplace/management-referrals
  description: List referrals; filterable
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  - PropertyManager
  code: 200
  input:
  - listing_id?
  - property_manager_id?
  - limit?
  - offset?
  output: ManagementReferral[]
  side_effects: []
- method: POST
  path: /marketplace/management-referrals/{id}/transition
  description: PM responds to referral; action in {ACCEPT, DECLINE}
  roles:
  - PropertyManager
  code: 200
  input:
  - action
  output: ManagementReferral
  side_effects:
  - per §1.2 ManagementReferral machine
- method: POST
  path: /marketplace/listings/{id}/guarantees
  description: Issue vacancy/lease-up guarantee (listing must be CERTIFIED or LISTED; coverage_months <= program guarantee_months_cap)
  roles:
  - PlatformAdmin
  code: 201
  input:
  - guarantee_kind
  - coverage_months
  output: Guarantee
  side_effects:
  - status=ISSUED
- method: GET
  path: /marketplace/listings/{id}/guarantees
  description: List guarantees for a listing
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  - ClaimsAdjuster
  code: 200
  input: []
  output: Guarantee[]
  side_effects: []
- method: POST
  path: /marketplace/guarantees/{id}/transition
  description: 'Guarantee lifecycle; action in {CLAIM, PAY, DENY}. Role per action: CLAIM = Buyer; PAY/DENY = ClaimsAdjuster.'
  roles:
  - Buyer
  - ClaimsAdjuster
  code: 200
  input:
  - action
  output: Guarantee
  side_effects:
  - per §1.2 Guarantee machine; CLAIM computes claim_amount_cents
- method: POST
  path: /marketplace/listings/{id}/disputes
  description: Open post-close dispute on a disclosed condition (listing must be SOLD)
  roles:
  - Buyer
  - Seller
  code: 201
  input:
  - opened_by
  - condition_code
  - remedy_cents
  output: Dispute
  side_effects:
  - status=OPENED; opener_user_id recorded
- method: GET
  path: /marketplace/listings/{id}/disputes
  description: List disputes for a listing
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  - ClaimsAdjuster
  code: 200
  input: []
  output: Dispute[]
  side_effects: []
- method: POST
  path: /marketplace/disputes/{id}/transition
  description: 'Dispute lifecycle; action in {START_EVIDENCE, RESOLVE_BUYER, RESOLVE_SELLER, WITHDRAW}. Role per action: START_EVIDENCE/RESOLVE_* = ClaimsAdjuster; WITHDRAW = opener (Buyer or Seller).'
  roles:
  - ClaimsAdjuster
  - Buyer
  - Seller
  code: 200
  input:
  - action
  output: Dispute
  side_effects:
  - per §1.2 Dispute machine
- method: GET
  path: /marketplace/underwriting-reports/{id}
  description: Get underwriting report
  roles:
  - PlatformAdmin
  - Buyer
  code: 200
  input: []
  output: UnderwritingReport
  side_effects: []
- method: GET
  path: /marketplace/management-referrals/{id}
  description: Get referral
  roles:
  - PlatformAdmin
  - Seller
  - Buyer
  - PropertyManager
  code: 200
  input: []
  output: ManagementReferral
  side_effects: []
errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: Missing/malformed X-User-ID or X-User-Role header
- id: ERR_FORBIDDEN
  http: 403
  condition: Role not permitted for endpoint or entity-backed caller does not own the resource
- id: ERR_NOT_FOUND
  http: 404
  condition: Path id does not exist
- id: ERR_INVALID_STATE
  http: 409
  condition: Entity not in a state from which the requested transition is defined
- id: ERR_SEGREGATION_OF_DUTIES
  http: 409
  condition: Same individual attempts both sides of a segregated control (verify vs submit; resolve vs open)
- id: ERR_VALIDATION
  http: 422
  condition: Shape/type/enum/range constraint violated (e.g., lease_end <= lease_start, coverage_months > program cap, negative amounts, PORTFOLIO without bulk_price_cents)
- id: ERR_EXPIRED
  http: 409
  condition: 'Logical-clock temporal violation: offer past expires_at at accept, guarantee claim outside coverage window, stale inspection at certification'
- id: ERR_PRECONDITION
  http: 409
  condition: Cross-entity precondition failed (no VERIFIED inspection, no DISCLOSED lease, inactive program, another offer already ACCEPTED, PM market mismatch, guarantee claim conditions unmet)
- id: ERR_INSUFFICIENT_FUNDS
  http: 402
  condition: Earnest money below minimum, CASH offer exceeds proof of funds, or funded amount != offer amount
- id: ERR_STALE_LISTING_VERSION
  http: 412
  condition: expected_listing_version mismatch on offer create
- id: ERR_STALE_ESCROW_VERSION
  http: 412
  condition: expected_escrow_version mismatch on escrow sign
- id: ERR_NEGOTIATION_ROUND_EXCEEDED
  http: 409
  condition: RESUBMIT attempted when round_number >= MAX_NEGOTIATION_ROUNDS (5)
- id: ERR_GUARANTEE_NOT_CLAIMABLE
  http: 409
  condition: Guarantee claim conditions unmet (lease still ACTIVE/ASSIGNED for VACANCY; no qualifying unpaid/late record for LEASE_UP; no lease history at all)
- id: ERR_REMOTE_SIGNING_REQUIRED
  http: 409
  condition: Out-of-state buyer attempted to sign without remote_notarization_ref
- id: ERR_DISPUTE_CONDITION_UNDISCLOSED
  http: 409
  condition: condition_code not present in the listing's latest VERIFIED inspection report at START_EVIDENCE
- id: ERR_LEASE_PERIOD_OVERLAP
  http: 409
  condition: New lease's half-open [lease_start, lease_end) intersects an existing ACTIVE lease's interval on the same listing; pure adjacency permitted
- id: ERR_DUPLICATE_DUE_MONTH
  http: 409
  condition: A PaymentRecord with a due_date in the same UTC calendar month already exists on the lease
roles:
- name: PlatformAdmin
  description: Marketplace operator; provisions parties, programs, PMs, guarantees; drives the logical clock
  identity: opaque
  exclusive_operations:
  - create sellers/buyers/programs/property-managers
  - issue guarantees
  - set clock
  shared_operations:
  - read any resource
- name: Seller
  description: Property seller; owns listings, inspections, leases; negotiates offers
  identity: entity_backed:Seller
  exclusive_operations:
  - create listing
  - listing transitions SUBMIT/PUBLISH/WITHDRAW
  - attach+submit+revise inspection
  - attach+disclose+redact+terminate lease
  - offer transitions COUNTER/ACCEPT/DECLINE-as-seller
  shared_operations:
  - record payment records
  - read listings/offers/escrow/disputes
  - open dispute
  - withdraw own dispute
- name: Buyer
  description: Investor buyer; runs underwriting, makes offers, signs/funds escrow, claims guarantees
  identity: entity_backed:Buyer
  exclusive_operations:
  - create underwriting report
  - create offer
  - offer transitions SUBMIT/RESUBMIT/WITHDRAW/DECLINE-as-buyer
  - sign and fund escrow
  - guarantee CLAIM
  shared_operations:
  - read listings/leases/payment-records/offers/escrow
  - open dispute
  - withdraw own dispute
- name: CertificationReviewer
  description: Independent certification reviewer; verifies inspections, certifies listings
  identity: opaque
  exclusive_operations:
  - listing transitions BEGIN_REVIEW/CERTIFY
  - inspection transitions VERIFY/REJECT
  shared_operations:
  - read listings/inspection-reports
- name: EscrowOfficer
  description: Escrow/closing coordinator
  identity: opaque
  exclusive_operations:
  - escrow transitions SEND_DOCS/CLOSE/CANCEL
  shared_operations:
  - read escrows
- name: PropertyManager
  description: Property management company receiving referrals
  identity: entity_backed:PropertyManager
  exclusive_operations:
  - referral transitions ACCEPT/DECLINE
  shared_operations:
  - record payment records post-onboarding
  - read referrals/leases/payment-records
- name: ClaimsAdjuster
  description: Guarantee claims and dispute adjudicator
  identity: opaque
  exclusive_operations:
  - guarantee transitions PAY/DENY
  - dispute transitions START_EVIDENCE/RESOLVE_BUYER/RESOLVE_SELLER
  shared_operations:
  - read guarantees/disputes/listings
constants:
  EARNEST_MIN_CENTS: 50000
  OFFER_TTL_HOURS: 72
  MAX_NEGOTIATION_ROUNDS: 5
  LATE_GRACE_DAYS: 5
  INSPECTION_MAX_AGE_DAYS: 180
  DEFAULT_CLOCK: '2026-09-01T00:00:00Z'
