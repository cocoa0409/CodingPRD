  - rule_id: transitive_cascade
    instances:
      - name: lab_positive_cascades_five_hops_to_service_request_priority
        grounds:
          - state_machines.LabPool.IN_TESTING_to_RESULT_POSITIVE
          - calculations.area_risk_posture
          - calculations.posture_priority_escalation
          - calculations.service_request_due_at
          - entities.TrapSite.fields.season_positive_count
          - entities.RiskAssessment.fields.is_stale
        distinguishing_aspect: |
          Cascade A is triggered by the LabPool RESULT=POSITIVE transition and is five
          hops deep, each hop caused by the previous one: pool -> collection
          (positive_pool_count, wnv_detected) -> trap site (season_positive_count,
          last_positive_at) -> OPEN RiskAssessment (is_stale, stale_reason) ->
          ServiceArea (risk_posture ELEVATED via POSITIVE_OVERRIDE) -> open
          ServiceRequest (priority PRIORITY, due_at recomputed to triaged_at + 48h).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 with risk_posture NORMAL and posture_source NO_ASSESSMENT."
            - "One trap site with a SUBMITTED collection of 60 females over 2 trap-nights and one LabPool of 50 in status IN_TESTING."
            - "One ServiceRequest triaged ROUTINE at 2026-06-01T00:00:00.000Z with due_at 2026-06-06T00:00:00.000Z."
            - "One RiskAssessment in status OPEN, created after the request and before the lab result, with vector_index_provisional 24.00 and is_stale false."
