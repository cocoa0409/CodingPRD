            - "RecoveryGroup.${g1_id}.projected_recovery_minutes != 137 — the SOFT edge APP-EDGE -> APP-CORE is excluded from the path search"
            - "RecoveryGroup.${g1_id}.recovery_sequence == [${a1_id}, ${d1_id}, ${i1_id}]"
            - "APP-EDGE remains an isolated 45-minute path and therefore does not win the maximisation"

  # =====================================================================
  # RULE 3 — non-linear state machines on different entities
  #   3a: Exercise, three parallel axes with one join
  #   3b: Finding, re-test cycle
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: exercise_three_axes_advance_independently_then_join_at_close
        grounds:
          - state_machines.Exercise.DATA_VALIDATING_to_DATA_DIVERGENT
          - state_machines.Exercise.DATA_RECONCILING_to_DATA_VALIDATING
          - state_machines.Exercise.SYNC_IN_PROGRESS_to_SYNC_FAILED
          - state_machines.Exercise.SYNC_FAILED_to_SYNC_IN_PROGRESS
          - state_machines.Exercise.FAILOVER_COMPLETE_to_CLOSED
          - entities.Exercise.fields.data_state
          - entities.Exercise.fields.failback_state
        distinguishing_aspect: |
          Exercise carries three independent axes on one row: driving data_state through the
          DATA_DIVERGENT -> DATA_RECONCILING -> DATA_VALIDATING reconciliation loop leaves
          execution_state at FAILOVER_COMPLETE and failback_state at FAILBACK_NOT_PLANNED untouched,
          and only the CLOSE join requires DATA_VERIFIED AND FAILBACK_COMPLETE together.
        test_recipe:
          setup:
            - "The standard RG-1 fixture exists at clock 2026-08-01T00:00:00Z with posture READY."
            - "AST-DB1 carries a replication observation at 2026-08-01T00:00:00Z with replication_lag_seconds 240."
            - "Exercise exX (COMPONENT_FAILOVER, window 2026-08-20T00:00:00Z - 06:00:00Z) is scoped on RG-1, approved, scheduled, started, holds one PASSED step execution of 750 seconds and has completed failover."
            - "SITE-R reserved_capacity_units is 2 while exX sits in FAILOVER_COMPLETE."
