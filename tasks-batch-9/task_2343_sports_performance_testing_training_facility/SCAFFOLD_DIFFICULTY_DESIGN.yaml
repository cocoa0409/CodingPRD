# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: sports-performance-facility  (task 2343)
# All numeric literals below were computed by executing the §1.3 formulas with
# their declared `constants:` — no estimates.
# The logical clock starts at its declared default 2026-08-01T00:00:00Z; chains
# that do not call POST /_clock/set_current_utc run at that instant.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: movement_screen_intake_variant_scores_lower_than_reassessment_variant
        grounds:
          - calculations.movement_screen_risk_score
          - entities.Athlete.fields.injury_risk_score
          - entities.Athlete.fields.screen_count
          - entities.TestSession.fields.variant_applied
          - entities.InjuryRecord.fields.status
          - state_machines.Athlete.training_clearance.CLEARED_to_RESTRICTED
        distinguishing_aspect: |
          The variant subject is the Athlete injury-risk domain: the SAME five screen scores
          produce risk_score 10.00 under intake_screen_variant (history multiplier forced to
          1.00) and 13.00 under reassessment_screen_variant (multiplier 1.30 from two
          ACTIVE_REHAB injuries), and the 12.00 restriction threshold is crossed only by the
          second variant, flipping training_clearance from CLEARED to RESTRICTED.
        test_recipe:
          setup:
            - "One StaffMember acting as Coach, credential_status COMPLIANT: liability insurance valid to 2027-12-31 plus one VALID CPR_AED certification (a staff member with zero valid certifications is LAPSED and may not administer tests or be assigned)."
            - "One BASKETBALL/GUARD athlete born 2010-01-15 (age 16 at the default clock), initially SCREEN_PENDING / PENDING_INTAKE."
            - "A first MOVEMENT_SCREEN test session finalized with scores OH_SQUAT 2, HURDLE_STEP 2, INLINE_LUNGE 1, SL_HOP_L 3, SL_HOP_R 1 (raw 9, asymmetry 2) while screen_count == 0."
            - "Two InjuryRecord rows for the athlete in ACTIVE_REHAB."
            - "A second MOVEMENT_SCREEN session holding the identical five scores, still DRAFT."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Dana Reyes", role_title: "HEAD_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_id}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Mia Okafor", date_of_birth: "2010-01-15", sport: "BASKETBALL", position: "GUARD", guardian_email: "parent.okafor@example.com" }
              as: FrontDesk
              captures: { ath_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${ath_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { screen1_id: $.data.id }
            - call: "POST /test-sessions/${screen1_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 2, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 2, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 1, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 1, side: "RIGHT" } ] }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /test-sessions/${screen1_id}/finalize"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /injury-records"
              payload: { athlete_id: "${ath_id}", body_region: "ANKLE", severity: "MODERATE", occurred_on: "2026-05-04", rts_required: false }
              as: MedicalProvider
              as_user_id: "mp-1"
              captures: { inj1_id: $.data.id }
            - call: "POST /injury-records"
              payload: { athlete_id: "${ath_id}", body_region: "HIP", severity: "MILD", occurred_on: "2026-06-18", rts_required: false }
              as: MedicalProvider
              as_user_id: "mp-1"
              captures: { inj2_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${ath_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { screen2_id: $.data.id }
            - call: "POST /test-sessions/${screen2_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 2, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 2, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 1, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 1, side: "RIGHT" } ] }
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "POST /test-sessions/${screen2_id}/finalize"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
              captures: { screen2_risk: $.data.risk_score }
          assert:
            - "TestSession.${screen1_id}.variant_applied == INTAKE_SCREEN"
            - "TestSession.${screen1_id}.risk_score == 10.00"
            - "TestSession.${screen1_id}.asymmetry_points == 2"
            - "TestSession.${screen2_id}.variant_applied == REASSESSMENT_SCREEN"
            - "TestSession.${screen2_id}.risk_score == 13.00"
            - "TestSession.${screen2_id}.asymmetry_points == 2"
            - "Athlete.${ath_id}.injury_risk_score == 13.00"
            - "Athlete.${ath_id}.screen_count == 2"
            - "Athlete.${ath_id}.training_clearance == RESTRICTED"
            - "Athlete.${ath_id}.membership_status == ACTIVE"

      - name: performance_composite_raw_norm_variant_diverges_from_maturity_adjusted_variant
        grounds:
          - calculations.performance_composite_percentile
          - entities.Athlete.fields.maturity_offset_months
          - entities.TestSession.fields.effective_age_years
          - entities.TestSession.fields.composite_percentile
          - entities.TestSession.fields.metric_percentiles
        distinguishing_aspect: |
          The variant subject is the TestSession normative-percentile domain, not the Athlete
          risk domain: two athletes with byte-identical raw metrics (CMJ_CM 46.0,
          SPRINT_10M_S 1.70, IMTP_N 2000) and the same chronological age 16 score
          composite_percentile 71.6 under raw_norm_variant versus 53.2 under
          maturity_adjusted_variant, because maturity_offset_months 24 shifts the lookup
          band from BASKETBALL/GUARD 15..16 to 17..18.
        test_recipe:
          setup:
            - "One StaffMember acting as Coach, credential_status COMPLIANT (insurance to 2027-12-31 plus one VALID CPR_AED certification)."
            - "Athlete R born 2010-01-15 (age 16), BASKETBALL/GUARD, maturity_offset_months 0, CLEARED via a perfect movement screen (all fives scored 3, risk 0.00)."
            - "Athlete M born 2010-01-15 (age 16), BASKETBALL/GUARD, maturity_offset_months 24, CLEARED the same way."
            - "R's PERFORMANCE_BATTERY session already FINALIZED with CMJ_CM 46.0, SPRINT_10M_S 1.70, IMTP_N 2000."
            - "M's PERFORMANCE_BATTERY session holds the identical three metric rows and is still DRAFT."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Ivan Petrov", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_id}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Rosa Lin", date_of_birth: "2010-01-15", sport: "BASKETBALL", position: "GUARD", guardian_email: "parent.lin@example.com", maturity_offset_months: 0 }
              as: FrontDesk
              captures: { ath_r_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${ath_r_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { scr_r_id: $.data.id }
            - call: "POST /test-sessions/${scr_r_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /test-sessions/${scr_r_id}/finalize"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /athletes"
              payload: { full_name: "Mateo Diaz", date_of_birth: "2010-01-15", sport: "BASKETBALL", position: "GUARD", guardian_email: "parent.diaz@example.com", maturity_offset_months: 24 }
              as: FrontDesk
              captures: { ath_m_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${ath_m_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { scr_m_id: $.data.id }
            - call: "POST /test-sessions/${scr_m_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /test-sessions/${scr_m_id}/finalize"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /test-sessions"
              payload: { athlete_id: "${ath_r_id}", battery_type: "PERFORMANCE_BATTERY" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { perf_r_id: $.data.id }
            - call: "POST /test-sessions/${perf_r_id}/results"
              payload: { results: [ { metric_code: "CMJ_CM", value: 46.0, side: "BILATERAL" }, { metric_code: "SPRINT_10M_S", value: 1.70, side: "BILATERAL" }, { metric_code: "IMTP_N", value: 2000, side: "BILATERAL" } ] }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /test-sessions/${perf_r_id}/finalize"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /test-sessions"
              payload: { athlete_id: "${ath_m_id}", battery_type: "PERFORMANCE_BATTERY" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { perf_m_id: $.data.id }
            - call: "POST /test-sessions/${perf_m_id}/results"
              payload: { results: [ { metric_code: "CMJ_CM", value: 46.0, side: "BILATERAL" }, { metric_code: "SPRINT_10M_S", value: 1.70, side: "BILATERAL" }, { metric_code: "IMTP_N", value: 2000, side: "BILATERAL" } ] }
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "POST /test-sessions/${perf_m_id}/finalize"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
              captures: { comp_m: $.data.composite_percentile }
          assert:
            - "TestSession.${perf_r_id}.variant_applied == RAW_NORM"
            - "TestSession.${perf_r_id}.age_years_at_test == 16"
            - "TestSession.${perf_r_id}.effective_age_years == 16"
            - "TestSession.${perf_r_id}.composite_percentile == 71.6"
            - "TestSession.${perf_m_id}.variant_applied == MATURITY_ADJUSTED"
            - "TestSession.${perf_m_id}.age_years_at_test == 16"
            - "TestSession.${perf_m_id}.effective_age_years == 18"
            - "TestSession.${perf_m_id}.composite_percentile == 53.2"
            - "Athlete.${ath_r_id}.last_composite_percentile == 71.6"
            - "Athlete.${ath_m_id}.last_composite_percentile == 53.2"
            - "Athlete.${ath_r_id}.next_test_due_on == 2026-09-26"
            - "Athlete.${ath_m_id}.next_test_due_on == 2026-09-26"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: coach_requirement_two_reached_by_station_term_and_by_ratio_term
        grounds:
          - calculations.coach_ratio_requirement
          - entities.GroupSession.fields.station_count
          - entities.GroupSession.fields.athlete_units
          - entities.GroupSession.fields.required_coach_count
          - validations[priority=12]
        distinguishing_aspect: |
          Mode (a): required_coach_count = max(1, ceil(athlete_units / base_ratio),
          ceil(station_count / 3)) has three inputs whose nested max makes the SAME output
          value 2 arise from two different dominant terms — the station term on an ONSITE
          session with station_count 6 and athlete_units 1.0, and the ratio term on an
          OFFSITE session with station_count 3 and athlete_units 4.5 from three U12 athletes
          weighted 1.5 each.
        test_recipe:
          setup:
            - "Two StaffMembers, both credential_status COMPLIANT (insurance to 2027-12-31 plus one VALID CPR_AED certification each)."
            - "One standard athlete X born 2010-01-15 (age 16) and three U12 athletes U1/U2/U3 born 2015-01-15 (age 11), all CLEARED by a perfect movement screen."
            - "GroupSession P: ONSITE, 2026-08-10T10:00Z-11:00Z, station_count 6, max_athletes 10, phase_focus GENERAL_PREP, both coaches assigned (required 2 from the station term alone)."
            - "GroupSession Q: OFFSITE at 'Northside HS Gym', 2026-08-11T10:00Z-11:00Z, station_count 3, max_athletes 10, phase_focus GENERAL_PREP, both coaches assigned."
            - "X is enrolled in P; U1 and U2 are enrolled in Q (athlete_units 3.0, required 1)."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Ana Cruz", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_a_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_a_id}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Ben Oyelaran", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_b_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_b_id}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Xena Ford", date_of_birth: "2010-01-15", sport: "BASKETBALL", position: "GUARD", guardian_email: "parent.ford@example.com" }
              as: FrontDesk
              captures: { ath_x_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${ath_x_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              as_user_id: "${coach_a_id}"
              captures: { scr_x_id: $.data.id }
            - call: "POST /test-sessions/${scr_x_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
              as_user_id: "${coach_a_id}"
            - call: "POST /test-sessions/${scr_x_id}/finalize"
              payload: {}
              as: Coach
              as_user_id: "${coach_a_id}"
            - call: "POST /athletes"
              payload: { full_name: "Uma One", date_of_birth: "2015-01-15", sport: "BASKETBALL", position: "GUARD", guardian_email: "parent.one@example.com" }
              as: FrontDesk
              captures: { ath_u1_id: $.data.id }
            - call: "POST /test-sessions"
