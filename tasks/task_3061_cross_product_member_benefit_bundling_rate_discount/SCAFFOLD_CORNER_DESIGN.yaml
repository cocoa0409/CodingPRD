  # ===========================================================================
  - section: endpoints
    instances:

      - name: discount_application_create_returns_201_with_the_snapshotted_rule_values
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/benefits/loan-accounts/{loan_account_id}/applications
          - entities.DiscountApplication.fields.applied_bps
        distinguishing_aspect: "The create snapshots applied_bps, window_from and window_to from the rule at application time, so a later edit of the rule cannot retroactively change the stored application."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-E-001 has an ADOPTED LENDING holding with a loan and one ACTIVE 65 bps rule in window."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-E-001", full_name: "Etta Ruiz", email: "etta@x.com" }
              as: Anonymous
              captures: { e001_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${e001_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { e001_h_id: $.data.id }
            - call: "POST /benefits/holdings/${e001_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${e001_id}"
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "SNAP_65", discount_kind: "PROMOTIONAL", stacking_class: "ADDITIVE", discount_bps: 65, effective_from: "2026-05-01T00:00:00Z", effective_to: "2027-05-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { e001_r_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${e001_r_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${e001_id}", holding_id: "${e001_h_id}", loan_type: "PERSONAL", principal_cents: 450000, base_apr_bps: 1150 }
              as: Underwriter
              captures: { e001_la_id: $.data.id }
            - call: "GET /benefits/loan-accounts/${e001_la_id}"
              payload: {}
              as: Underwriter
              captures: { e001_la_v: $.data.version }
          trigger:
            - call: "POST /benefits/loan-accounts/${e001_la_id}/applications"
              payload: { rule_id: "${e001_r_id}", expected_loan_account_version: "${e001_la_v}" }
              as: BenefitsAdmin
              captures: { e001_app_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "DiscountApplication.${e001_app_id}.applied_bps == 65 and application_state == APPLIED"
            - "DiscountApplication.${e001_app_id}.window_from == 2026-05-01T00:00:00Z and window_to == 2027-05-01T00:00:00Z"
            - "LoanAccount.${e001_la_id}.discount_stack_bps == 65 and effective_apr_bps == 1085"

      - name: pricing_breakdown_read_is_computed_from_the_live_rule_pool
        claim_type: computed_read
        grounds:
          - endpoints.GET_/benefits/loan-accounts/{loan_account_id}/pricing-breakdown
          - calculations.discount_stack_total_bps
        distinguishing_aspect: "The computed read reports the cap, the uncapped sum and the floor together, so it is the only endpoint that surfaces the discrepancy between the applied ceiling and the raw rule arithmetic."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-E-002 has an ADOPTED LENDING holding with a loan at base_apr_bps 550 and one ACTIVE 500 bps rule, so the stack cap and the APR floor both bind."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-E-002", full_name: "Finn Adler", email: "finn@x.com" }
              as: Anonymous
              captures: { e002_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${e002_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { e002_h_id: $.data.id }
            - call: "POST /benefits/holdings/${e002_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${e002_id}"
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "FLOOR_500", discount_kind: "MEMBER_TIER", stacking_class: "BASE", discount_bps: 500, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { e002_r_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${e002_r_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${e002_id}", holding_id: "${e002_h_id}", loan_type: "REFINANCE", principal_cents: 350000, base_apr_bps: 550 }
              as: Underwriter
              captures: { e002_la_id: $.data.id }
          trigger:
            - call: "GET /benefits/loan-accounts/${e002_la_id}/pricing-breakdown"
              payload: {}
              as: Underwriter
          assert:
            - "the response status is 200 and response_type is object"
            - "the response reports stored_bps == 400 after the STACK_CAP_BPS ceiling, even though the rule is worth 500"
            - "the response reports uncapped_bps == 500 and floor_bps == 199"
            - "LoanAccount.${e002_la_id}.effective_apr_bps == 199, because 550 - 400 is 150, below APR_FLOOR_BPS 199, so the floor raises it to exactly 199"
            - "the breakdown is recomputed on read rather than served from a stale cached field"

      - name: churn_notice_send_is_conditional_on_the_clock_passing_issue_time
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/benefits/churn-notices/{notice_id}/send
          - state_machines.ChurnNotice.QUEUED_to_SENT
        distinguishing_aspect: "The send action is gated on the logical clock reaching issued_at, so a notice queued for a future instant cannot be dispatched until the clock moves — a conditional action rather than a plain state transition."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-E-003 has a QUEUED notice issued at 2026-09-01T00:00:00Z and effective at 2026-09-15T00:00:00Z."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-E-003", full_name: "Gia Wren", email: "gia@x.com" }
              as: Anonymous
              captures: { e003_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${e003_id}", product_line: "INVESTING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { e003_h_id: $.data.id }
            - call: "POST /benefits/holdings/${e003_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${e003_id}"
            - call: "POST /benefits/deposit-enrollments"
              payload: { member_id: "${e003_id}", required_monthly_amount_cents: 100000 }
              as: PlatformAdmin
              captures: { e003_en_id: $.data.id }
            - call: "POST /benefits/members/${e003_id}/deposits"
              payload: { enrollment_id: "${e003_en_id}", amount_cents: 200000, posted_at: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/deposit-enrollments/${e003_en_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/deposit-enrollments/${e003_en_id}/lapse"
              payload: {}
              as: PlatformAdmin
            - call: "GET /benefits/churn-notices"
              payload: { member_id: "${e003_id}", status: "QUEUED" }
              as: PlatformAdmin
              captures: { e003_note_id: $.data.0.id }
          trigger:
            - call: "POST /benefits/churn-notices/${e003_note_id}/send"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the notice is QUEUED with issued_at == 2026-10-02T00:00:00Z and effective_at non-null"
            - "the send returns 200 and the status becomes SENT, because the logical clock is at or past issued_at"
            - "acknowledging now succeeds with 200 and the status becomes ACKNOWLEDGED"
            - "a queued notice whose issued_at sits ahead of the logical clock would be refused on the same call"

      - name: holding_list_filters_by_member_and_by_line_independently
        claim_type: standard_crud
        grounds:
          - endpoints.GET_/benefits/holdings
          - entities.ProductHolding.fields.product_line
          - response_envelope.pagination_fields
        distinguishing_aspect: "The filtered list accepts the member foreign key and the line enum at once, and each filter narrows the result independently, so the endpoint is the discovery channel for holdings created by cascade rather than by direct POST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-E-004 holds one BANKING and one INVESTING holding; member M-E-005 holds one BANKING holding."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-E-004", full_name: "Hana Poole", email: "hana.p@x.com" }
              as: Anonymous
              captures: { e004_id: $.data.id }
            - call: "POST /benefits/members"
              payload: { member_number: "M-E-005", full_name: "Iva Poole", email: "iva.p@x.com" }
              as: Anonymous
              captures: { e005_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${e004_id}", product_line: "BANKING", balance_cents: 100000 }
              as: PlatformAdmin
            - call: "POST /benefits/holdings"
              payload: { member_id: "${e004_id}", product_line: "INVESTING", balance_cents: 0 }
              as: PlatformAdmin
            - call: "POST /benefits/holdings"
              payload: { member_id: "${e005_id}", product_line: "BANKING", balance_cents: 0 }
              as: PlatformAdmin
          trigger:
            - call: "GET /benefits/holdings"
              payload: { member_id: "${e004_id}" }
              as: PlatformAdmin
          assert:
