              captures: { ce4_id: $.data.id }
            - call: "POST /entries/${entry1_id}/verify"
              payload: {}
              as: ShowSecretary
            - call: "POST /entries/${entry1_id}/accept"
              payload: {}
              as: ShowSecretary
            - call: "POST /entries/${entry1_id}/invoice"
              payload: {}
              as: ShowSecretary
            - call: "POST /entries/${entry1_id}/payment"
              payload: { amount_cents: 30000 }
              as: Exhibitor
              as_user_id: "${rider1_id}"
            - call: "POST /entries/${entry2_id}/verify"
              payload: {}
              as: ShowSecretary
            - call: "POST /entries/${entry2_id}/accept"
              payload: {}
              as: ShowSecretary
            - call: "POST /entries/${entry2_id}/invoice"
              payload: {}
              as: ShowSecretary
            - call: "POST /entries/${entry2_id}/payment"
              payload: { amount_cents: 30000 }
              as: Exhibitor
              as_user_id: "${rider1_id}"
            - call: "GET /rings/${ring_a_id}"
              payload: {}
              as: RingMaster
              captures: { ring_a_v: $.data.version }
          trigger:
            - call: "POST /ring-slots"
              payload: { ring_id: "${ring_a_id}", class_id: "${class_id}", start_utc: "2026-09-10T14:00:00Z", expected_ring_version: "${ring_a_v}" }
              as: RingMaster
              captures: { slot_id: $.data.id, slot_duration: $.data.duration_minutes }
            - call: "GET /shows/${show_id}/schedule-projection"
              payload: {}
              as: ShowSecretary
          assert:
            - "ShowClass.${class_id}.entry_count == 4 and ShowClass.${class_id}.confirmed_entry_count == 2"
            - "the POST /ring-slots response has data.duration_minutes == 29 (projected_all_entered variant: 4 rounds + 2 jump-off rounds at 75 s x height_factor 1.1 = 9 ride minutes + 10 course-walk minutes + 10 turnover-buffer minutes)"
            - "ShowClass.${class_id}.estimated_minutes == 29"
            - "RingSlot.${slot_id}.end_utc == 2026-09-10T14:29:00Z"
            - "RingSlot.${slot_id}.warmup_start_utc == 2026-09-10T13:30:00Z"
            - "RingSlot.${slot_id}.order_index == 1"
            - "GET /shows/${show_id}/schedule-projection returns projected_total_minutes == 29"
            - "GET /shows/${show_id}/schedule-projection returns confirmed_only_total_minutes == 25 (2 rounds + 1 jump-off round = 5 ride minutes + 10 + 10)"
            - "GET /shows/${show_id}/schedule-projection returns projected_drift_minutes == 4"
            - "Ring.${ring_a_id}.scheduled_minutes_total == 29 and Ring.${ring_a_id}.slot_count == 1"

      - name: rider_standings_national_scale_vs_regional_scale
        grounds:
          - calculations.rider_standing_points
          - calculations.rider_standing_points.variants.national_scale
          - calculations.rider_standing_points.variants.regional_scale
          - entities.ClassEntry.fields.points_national
          - entities.ClassEntry.fields.points_regional
          - entities.Rider.fields.national_points_total
          - entities.Rider.fields.regional_points_total
          - state_machines.PointSubmission.PREPARED_to_NATIONAL_ACCEPTED
          - state_machines.PointSubmission.NATIONAL_ACCEPTED_to_RECORDED
        distinguishing_aspect: |
          This second dual-variant instance lives in the standings domain on Rider and
          ClassEntry rather than the scheduling domain on ShowClass and RingSlot: the
          same four placings are scored twice, once through the 5-deep national table
          scaled by an entry-count multiplier and once through the 3-deep regional table
          under a per-show cap, so 4th place scores 3.0 nationally and exactly 0 regionally.
        test_recipe:
          setup:
            - "One APPROVED show, Ring A (buffer 10), JUMPER division (jumpoff_enabled true, division_share_bp 3333), class 101 at 120 cm with class_share_bp 1669 and entry_fee_cents 25000."
            - "Four distinct riders, each with one horse, one Entry (requested_stall_count 0) and one ClassEntry on class 101; all four Entry rows ACCEPTED and PAID, so confirmed_entry_count == 4."
