            - "different hrt_type PROGESTERONE is accepted: prescription created ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: refills_conservation_on_reverse
        grounds:
          - calculations.refill_count_invariant
          - state_machines.Refill.APPROVED_to_FULFILLED
          - state_machines.Refill.FULFILLED_to_REVERSED
          - entities.Prescription.fields.refills_remaining
        distinguishing_aspect: "Conserved quantity = refill COUNT: after fulfill (remaining 1, FULFILLED 1) and its reverse (remaining 2, FULFILLED 0), refills_remaining + FULFILLED count stays == total_refills_authorized (2)."
        test_recipe:
          setup:
            - "CASH patient; prescription total_refills_authorized 2; one refill FULFILLED (refills_remaining 1)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Kim Ta", email: "kim@x.com", date_of_birth: "1970-03-13", state_code: "OR", billing_mode: "CASH", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Ola", specialty: "GYNECOLOGY", npi: "1717171717", visit_fee_cents: 12000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
