        claim_type: computed_read
        grounds:
          - endpoints[GET /induction-cycles/{id}]
          - entities.InductionCycle.fields.austerity_tier
          - entities.InductionCycle.fields.travel_committed_cents
          - calculations.travel_grant_award_cents
        distinguishing_aspect: |
          The cycle read is where two derived figures meet: travel_committed_cents is the sum of
          APPROVED awards only, and austerity_tier is re-derived from committed/budget on every
          change. A three-night living grant at the FULL tier freezes 3 * 18333 = 54999 cents; once
          approved, 54999/100000 = 0.54999 lands in [0.50, 0.80) so the read reports REDUCED even
          though the grant itself was priced at FULL - the tier on the grant row never moves.
