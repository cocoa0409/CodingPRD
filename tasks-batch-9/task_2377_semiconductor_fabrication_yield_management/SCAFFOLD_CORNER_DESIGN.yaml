            - "${hsp} == 0.0"
            - "${pu} == 2026-08-02T00:00:00Z"
            - "Chamber.${ch_l1}.qual_state == QUALIFIED"

      - name: a_sort_excursion_links_back_to_its_run_and_its_lot
