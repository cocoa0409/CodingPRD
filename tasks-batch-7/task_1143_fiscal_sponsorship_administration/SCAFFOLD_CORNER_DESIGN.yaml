      - name: c_fee_tier_cap_boundary_exact
        claim_type: constants_applied
        grounds: [calculations.admin_fee_on_receipt]
        distinguishing_aspect: "A donation that brings cumulative receipts to exactly the 10,000,000-cent tier-1 cap is entirely rated at 8% (fee 800,000); the next 1,000 cents are rated at 6% (fee 60)."
        test_recipe:
