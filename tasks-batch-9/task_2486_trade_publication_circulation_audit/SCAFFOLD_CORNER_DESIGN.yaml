              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "${status} == ACTIVE and ${pool} == 3000000 (6 insertions at 500000 cents)"
            - "${total} == 1200 against a guaranteed_rate_base of 1000"
            - "HTTP 409 with ${err} == ERR_NO_SHORTFALL_TO_SETTLE"
            - "no MakeGoodObligation row exists for AdvertiserContract.${ac_id} and its makegood_credit_available_cents is still 3000000"
            - "CirculationStatement.${st_id}.guarantees_settled_at is null and status is still FILED"

