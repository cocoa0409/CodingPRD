            - { call: "GET /plant/nixtamal-batches/${batch_id}", payload: {}, as: LineScheduler, captures: { avail_mid: "$.data.masa_available_kg", actual_mid: "$.data.actual_masa_kg" } }
            - { call: "POST /plant/allocations/${al_id}/release", payload: {}, as: LineScheduler, captures: { al_status: "$.data.allocation_status" } }
            - { call: "GET /plant/nixtamal-batches/${batch_id}", payload: {}, as: LineScheduler, captures: { avail_end: "$.data.masa_available_kg" } }
          assert:
