  - rule_id: resource_temporal_overlap
    instances:
      - name: line_window_half_open_adjacency
        grounds:
          - validations[priority=15]
          - calculations.changeover_class
        distinguishing_aspect: |
          Interval semantics: pairwise half-open [window_start, window_end)
          exclusion on resource ProductionLine — back-to-back windows touching at
          exactly end == start are ACCEPTED, while a window straddling that
          boundary is rejected ERR_LINE_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "supplier S; three ACCEPTED pepper lots (100 kg each, costs 100/200/300); ACTIVE formula WIN-1 (BLACK_PEPPER 100% min 50); COMMITTED blend run of 10 kg (cap 4.000 forces LA 4 + LB 4 + LC 2); line LN (cap 1000 kg/shift)"
