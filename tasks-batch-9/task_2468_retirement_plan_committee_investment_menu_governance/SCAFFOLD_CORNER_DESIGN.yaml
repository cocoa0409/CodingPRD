            - call: "POST /governance/training-records"
              payload: { member_id: "${mem_chair_id}", module_code: "PROHIBITED_TRANSACTIONS", status: "WAIVED", waiver_basis: "ERISA 406 counsel attestation refreshed 2028-06-04" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-26", quarter_index: 8 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet_q8_id: $.data.id }
