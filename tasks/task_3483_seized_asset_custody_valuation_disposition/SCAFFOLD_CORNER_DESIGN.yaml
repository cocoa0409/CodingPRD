        distinguishing_aspect: "Three fiscal edges on POST /custody/distributions against a pool of exactly 90000: 9999 fails ERR_SHARE_BELOW_MINIMUM (below the 10000 floor), 90001 fails ERR_INSUFFICIENT_PROCEEDS (one cent over), and 90000 exactly succeeds — after approval the pool is 0, the zero-quantity edge."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Case filed and forfeited; PERSONAL_PROPERTY asset appraised 100000 (raw 100000 EXCELLENT); SELL; authorized; sold at 100000 (fee 10000, net 90000; no liens, no costs) so available_proceeds_cents == 90000."
