# =============================================================================
# §1.9 Scaffold Corner Design — Beverage Program & Wine List Management
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Sections and claim_type values are
# taken verbatim from references/claim-extraction-guide.md; nothing is invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub naming the §1.8 instance and have no test_recipe.
#
# Shared conventions (identical to §1.8):
#   * every chain opens with POST /_clock/set_current_utc (default logical clock
#     2026-08-01T00:00:00Z unless the corner needs another instant)
#   * X-User-ID: BeverageDirector "bd-001", Controller "ctl-001",
#     ComplianceOfficer "co-001"; VenueSommelier is the Venue id,
#     DistributorRep is the Distributor id (entity_backed identities, §1.7)
#   * pinned reference wine: Ridge / Monte Bello 2019, RED, 750 ml,
#     reference_cost_cents 2400, case_pack 6  ->  bottle_price_cents 8600
#     (CORE band) at the reference venue's RED target of 28.0
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: venue_creation_persists_every_declared_input_field
        claim_type: Creation
        grounds:
          - entities.Venue
          - endpoints["POST /beverage-program/venues"]
          - response_envelope.success
        distinguishing_aspect: >-
          A create call that supplies every optional policy field must echo all of them back
          unchanged alongside the server-minted common fields, with response_type "object" and the
          computed fields at their declared initial values — not silently coerce or drop the
          per-category COGS map.
        test_recipe:
          setup:
            - "Empty database; logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
          trigger:
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", costing_method: "WEIGHTED_AVERAGE", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, event_cogs_target_pct: 26.5, corkage_fee_cents: 4000, corkage_waiver_purchase_ratio: 3, byo_bottle_limit_per_party: 4, byo_prohibited_categories: ["SPARKLING"], priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == \"object\" and meta.api_request_id present"
            - "Venue.${v1_id}.name == \"Harbor Room\", venue_code == \"HRB\", costing_method == WEIGHTED_AVERAGE, event_cogs_target_pct == 26.5, corkage_fee_cents == 4000, corkage_waiver_purchase_ratio == 3, byo_bottle_limit_per_party == 4, byo_prohibited_categories == [\"SPARKLING\"], priority_rank == 1"
            - "Venue.${v1_id}.cogs_target_pct_by_category has exactly the six WINE_CATEGORIES keys with RED == 28.0 and WHITE == 25.0"
            - "computed fields at their initial values: program_posture == OPEN, last_variance_pct == 0.00, last_pour_cost_run_at == null, cogs_ledger_cents == 0, revenue_ledger_cents == 0"
            - "Venue.${v1_id}.version == 1 and Venue.${v1_id}.id is a bare UUID with no type prefix"
      - name: venue_optional_policy_fields_apply_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Venue.fields.costing_method
          - entities.Venue.fields.corkage_fee_cents
          - entities.Venue.fields.byo_prohibited_categories
          - endpoints["POST /beverage-program/venues"]
        distinguishing_aspect: >-
          Omitting every optional field must produce the exact declared defaults (FIFO, 30.0, 3500,
          2, 2, [], 3), which is the inverse of the all-fields-supplied corner: a server that
          defaults corkage_waiver_purchase_ratio to 1 or byo_prohibited_categories to null passes
          the creation corner and fails here.
        test_recipe:
          setup:
            - "Empty database; logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
          trigger:
            - call: "POST /beverage-program/venues"
              payload: { name: "Marina Grill", venue_code: "MAR", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 } }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v2_id: $.data.id }
          assert:
            - "Venue.${v2_id}.costing_method == FIFO"
            - "Venue.${v2_id}.event_cogs_target_pct == 30.0"
            - "Venue.${v2_id}.corkage_fee_cents == 3500 and corkage_waiver_purchase_ratio == 2"
            - "Venue.${v2_id}.byo_bottle_limit_per_party == 2 and byo_prohibited_categories == []"
            - "Venue.${v2_id}.priority_rank == 3"
      - name: wine_retrieval_returns_stored_representation_with_defaults
        claim_type: Retrieval
        grounds:
          - entities.Wine
          - endpoints["GET /beverage-program/wines/{wine_id}"]
        distinguishing_aspect: >-
          A GET by id must return the same field values the create call returned, including the
          bottle_size_ml/case_pack/is_allocated defaults and successor_count 0 — proving the read
          path reads persisted state rather than recomputing a partial projection.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one RED wine created with only the required fields."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w1_id: $.data.id }
          trigger:
            - call: "GET /beverage-program/wines/${w1_id}"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
          assert:
            - "HTTP 200 with Wine.${w1_id}.producer == \"Ridge\", cuvee == \"Monte Bello\", vintage_year == 2019, category == RED, reference_cost_cents == 2400"
            - "defaults present on the read: bottle_size_ml == 750, case_pack == 6, is_allocated == false, predecessor_wine_id == null, successor_count == 0"
            - "Wine.${w1_id}.version == 1 and created_at == 2026-08-01T00:00:00.000Z"
      - name: cellar_bin_listing_returns_pagination_envelope_and_declared_order
        claim_type: Listing
        grounds:
          - endpoints["GET /beverage-program/cellar-bins"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: >-
          With three bins and limit 2 the array response must carry limit, offset, total_count 3 and
          has_more true, and the venue_id filter must exclude the other venue's bin — a server that
          returns a bare array or computes has_more from the page length alone fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Venue HRB with three CELLAR bins A1, A2, A3 (capacity 48 each) created in that order."
            - "A second venue MAR with one bin B1, to prove the venue_id filter."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/venues"
              payload: { name: "Marina Grill", venue_code: "MAR", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 2 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v2_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/cellar-bins"
              payload: { bin_code: "A1", zone: "CELLAR", capacity_bottles: 48, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { bin_a1: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/cellar-bins"
              payload: { bin_code: "A2", zone: "CELLAR", capacity_bottles: 48, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { bin_a2: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/cellar-bins"
              payload: { bin_code: "A3", zone: "CELLAR", capacity_bottles: 48, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { bin_a3: $.data.id }
            - call: "POST /beverage-program/venues/${v2_id}/cellar-bins"
              payload: { bin_code: "B1", zone: "CELLAR", capacity_bottles: 24, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v2_id}"
              captures: { bin_b1: $.data.id }
          trigger:
            - call: "GET /beverage-program/cellar-bins"
              payload: { venue_id: "${v1_id}", limit: 2, offset: 0 }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "GET /beverage-program/cellar-bins"
              payload: { venue_id: "${v1_id}", limit: 2, offset: 2 }
              as: BeverageDirector
              as_user_id: "bd-001"
          assert:
            - "page 1: HTTP 200, response_type == \"array\", 2 rows (${bin_a1} then ${bin_a2}), limit == 2, offset == 0, total_count == 3, has_more == true"
            - "page 2: 1 row (${bin_a3}), limit == 2, offset == 2, total_count == 3, has_more == false"
            - "${bin_b1} appears on neither page — the venue_id filter is applied before pagination"
            - "GET /beverage-program/cellar-bins with no limit returns all 4 bins across both venues under the default limit of 10 with total_count == 4"
      - name: inventory_lot_get_with_unknown_id_returns_lot_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_LOT_NOT_FOUND]
          - validations[priority=10]
          - endpoints["GET /beverage-program/inventory-lots/{lot_id}"]
        distinguishing_aspect: >-
          A syntactically valid but unknown UUID on a path parameter must produce the entity-specific
          404 (ERR_LOT_NOT_FOUND), not a generic ERR_INVALID_REQUEST and not an empty 200 body.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no InventoryLot rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
          trigger:
            - call: "GET /beverage-program/inventory-lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == \"error\" and ${err} == ERR_LOT_NOT_FOUND"
            - "the envelope carries data.message and meta.api_request_id, per §1.0"
      - name: wine_creation_missing_required_producer_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Wine.fields.producer
          - validations[priority=12]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >-
          producer has source input with no default, so omitting it must fail at priority 12 with
          ERR_INVALID_REQUEST (400) before any enum or range check runs, and no Wine row may be
          created.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no Wine rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
          trigger:
            - call: "POST /beverage-program/wines"
              payload: { cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with ${err} == ERR_INVALID_REQUEST"
            - "GET /beverage-program/wines returns total_count == 0"
      - name: list_entry_computed_price_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.ListEntry.fields.bottle_price_cents
          - entities.ListEntry.fields.price_band
          - calculations.list_entry_bottle_price
          - endpoints["POST /beverage-program/list-versions/{list_version_id}/entries"]
        distinguishing_aspect: >-
          bottle_price_cents, price_band, glass_price_cents, effective_pours and contest_points are
          source computed and are not in the endpoint's input list, so client-supplied values must be
          ignored and the formula result stored: 2400 at a 28.0 RED target gives 8600 / CORE, never
          the submitted 100.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Venue HRB (RED target 28.0) with a DRAFT ListVersion on its wine list."
            - "One RED wine at reference_cost_cents 2400."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w1_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/wine-lists"
              payload: { name: "Dinner List" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { wl_id: $.data.id }
            - call: "POST /beverage-program/wine-lists/${wl_id}/versions"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lv_id: $.data.id, lv_v1: $.data.version }
          trigger:
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w1_id}", sort_rank: 1, expected_list_version_version: "${lv_v1}", by_the_glass: false, par_bottles: 6, education_verified: false, bottle_price_cents: 100, price_band: "RESERVE", contest_points: 999 }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { e1_id: $.data.id }
          assert:
            - "HTTP 201 with ListEntry.${e1_id}.bottle_price_cents == 8600 (round_half_up(2400 * 100 / 28.0) rounded to the pricing step), not 100"
            - "ListEntry.${e1_id}.price_band == CORE, not RESERVE"
            - "ListEntry.${e1_id}.glass_price_cents == null and effective_pours == null because by_the_glass is false"
            - "ListEntry.${e1_id}.contest_points == 0.00, not 999"
      - name: venue_system_fields_server_minted_extra_field_ignored
        claim_type: System Fields
        grounds:
          - entities.Venue
          - endpoints["POST /beverage-program/venues"]
        distinguishing_aspect: >-
          id, created_at, updated_at and version are server-minted: a create payload carrying its own
          id and created_at must be ignored rather than honoured, and the response id must be a fresh
          bare UUID while created_at equals the logical clock, not the submitted string.
        test_recipe:
          setup:
            - "Logical clock explicitly set to 2026-08-15T09:30:00Z so a wrong created_at is visible."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:30:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
          trigger:
            - call: "POST /beverage-program/venues"
              payload: { name: "Cliff House", venue_code: "CLF", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, id: "11111111-1111-4111-8111-111111111111", created_at: "2020-01-01T00:00:00.000Z", version: 47, program_posture: "FROZEN" }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v3_id: $.data.id }
          assert:
            - "HTTP 201 and ${v3_id} != \"11111111-1111-4111-8111-111111111111\""
            - "Venue.${v3_id}.created_at == 2026-08-15T09:30:00.000Z and updated_at == created_at"
            - "Venue.${v3_id}.version == 1, not 47"
            - "Venue.${v3_id}.program_posture == OPEN, not FROZEN — a computed field is never seeded from input"
      - name: wine_category_outside_enum_rejected
        claim_type: Type Constraints
        grounds:
          - constants_global.WINE_CATEGORIES
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_INVALID_ENUM_VALUE]
          - errors[ERR_VALUE_OUT_OF_RANGE]
        distinguishing_aspect: >-
          Enum membership (priority 13, ERR_INVALID_ENUM_VALUE 422) and numeric range (priority 14,
          ERR_VALUE_OUT_OF_RANGE 422) are separate rows in the ladder, and the enum row must win when
          both are violated by the same payload.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no Wine rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
          trigger:
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Orange Experiment", vintage_year: 2019, category: "ORANGE", reference_cost_cents: 2400 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { err_enum: $.data.error_id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 1800, category: "RED", reference_cost_cents: 2400 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { err_range: $.data.error_id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 1800, category: "ORANGE", reference_cost_cents: 2400 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { err_both: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_ENUM_VALUE with HTTP 422 (ORANGE is not in WINE_CATEGORIES)"
            - "${err_range} == ERR_VALUE_OUT_OF_RANGE with HTTP 422 (vintage_year 1800 is outside 1900..2100)"
            - "${err_both} == ERR_INVALID_ENUM_VALUE — priority 13 beats priority 14"
            - "GET /beverage-program/wines returns total_count == 0 after all three refusals"
      - name: depletion_entry_immutability_no_update_endpoint_and_no_version_field
        claim_type: Immutability
        grounds:
          - entities.DepletionEntry.common_fields
          - endpoints["GET /beverage-program/depletion-entries/{depletion_entry_id}"]
          - endpoints["GET /beverage-program/depletion-entries"]
        distinguishing_aspect: >-
          DepletionEntry is declared common_fields: false, so §1.5 exposes only reads for it: the
          ledger row carries id and created_at but no version and no updated_at, and corrections must
          arrive as additional REVERSAL rows. A slot close is the cheapest way to mint one.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with bin A1 (capacity 48) and a 12-bottle RED lot at 2400 cents received 2026-08-10."
            - "A PUBLISHED ListVersion with one by-the-glass RED entry at pour_size_ml 177 (effective_pours 3, glass_price_cents 2875)."
            - "An OPEN BtgSlot on that entry at slot_index 1 with ARGON preservation, closed with pours_sold 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/cellar-bins"
              payload: { bin_code: "A1", zone: "CELLAR", capacity_bottles: 48, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { bin_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w1_id: $.data.id }
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v1_id}", wine_id: "${w1_id}", bin_id: "${bin_id}", bottles_received: 12, unit_cost_cents: 2400, received_at: "2026-08-10T00:00:00Z" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/wine-lists"
              payload: { name: "Dinner List" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { wl_id: $.data.id }
            - call: "POST /beverage-program/wine-lists/${wl_id}/versions"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lv_id: $.data.id, lv_v1: $.data.version }
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w1_id}", sort_rank: 1, expected_list_version_version: "${lv_v1}", by_the_glass: true, pour_size_ml: 177, par_bottles: 6, education_verified: false }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /beverage-program/list-versions/${lv_id}/submit"
