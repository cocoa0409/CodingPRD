# =============================================================================
# PRD Benchmark Scaffold — Direct Selling Consultant Compensation
# Difficulty target: above Expert (§0.4) — 13 entities, 9 state machines,
# 10 calculation rules (2 of them dual-variant), 2 OCC races, 65 endpoints,
# 69 ordered validations, 91 error codes, 7 roles.
# All money is integer cents; all commission/tax/override rates are integer
# basis points (bp, 1 bp = 0.01%); all volume is integer points.
# =============================================================================

scenario: |
  2356. Direct Selling Consultant Compensation (direct selling company): consultant enrollment with starter kit purchase, agreement acceptance and identity verification, personal and downline volume tracking with qualification periods for rank advancement, commission calculation across retail profit, personal volume bonuses and multi-level overrides with compression rules, income disclosure statement preparation with earnings distribution transparency, inventory purchase policies including buyback obligations and anti-inventory-loading rules, sales tax collection on suggested retail price under facilitator agreements, consultant compliance monitoring for income and product claims with disciplinary process, termination, reinstatement and downline reassignment rules

domain_name: direct-selling-consultant-compensation
api_prefix: /direct-selling

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: graph_constraint
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: graph
  # Consultant.sponsor_consultant_id is self-referential, forming a genealogy
  # tree that is mutated in place by termination/reassignment and read
  # transitively by group-volume and multi-level-override calculations. Every
  # other entity is a peer resource joined by explicit foreign keys (flat URL
  # shape, no nesting deeper than one action segment).

  state_machine_shape: parallel
  # EnrollmentApplication carries three independent status dimensions
  # (agreement_status x identity_status x kit_status) whose conjunction drives a
  # compound `status`; ProductOrder carries payment_status x fulfillment_status;
  # QualificationPeriod (CLOSED->REOPENED->LOCKED), CommissionRun
  # (CALCULATED->DRAFT), ComplianceCase (SANCTIONED->APPEALED->UNDER_REVIEW) and
  # EnrollmentApplication identity (FAILED->PENDING_REVIEW) are cyclic.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # CommissionAnalyst calculates a run but may never approve it; the approving
  # FinanceController's X-User-ID must differ from CommissionRun
  # .calculated_by_user_id. Same rule on IncomeDisclosureStatement
  # (submitting analyst != publishing LegalReviewer).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: CompensationPlan
    parent: null
    common_fields: true
    fields:
      - name: plan_code
        type: string
        source: input
        description: business identifier of the plan
        constraints: unique across all CompensationPlan rows; 1-32 chars
      - name: name
        type: string
        source: input
        description: display name of the compensation plan
      - name: compression_mode
        type: enum
        source: input
        description: selects which multi-level override algorithm variant runs
        default: DYNAMIC
        constraints: "one of {DYNAMIC, STATIC}; mutable via PATCH /direct-selling/compensation-plans/{plan_id}"
      - name: point_value_cents
        type: integer
        source: input
        description: cash value in cents of one volume point when paying bonuses
        default: 100
        constraints: ">= 1"
      - name: payline_min_pv_points
        type: integer
        source: input
        description: minimum net personal volume points a downline consultant needs in the period to occupy a payline level (below this the node is compressed out)
        default: 200
      - name: pv_bonus_min_points
        type: integer
        source: input
        description: minimum net personal volume points required before any personal volume bonus is computed (distinct from payline_min_pv_points)
        default: 100
      - name: active_leg_min_points
        type: integer
        source: input
        description: minimum subtree volume (leg root plus all descendants, net personal volume) for a direct leg to count as active
        default: 300
      - name: pv_bonus_bands
        type: array
        source: input
        description: "ordered marginal bands for the personal volume bonus; each element is { upper_points: integer|null, rate_bp: integer }; the final band MUST have upper_points: null"
        default: "[{upper_points: 500, rate_bp: 500}, {upper_points: 1500, rate_bp: 900}, {upper_points: null, rate_bp: 1300}]"
      - name: pv_bonus_cap_cents
        type: integer
        source: input
        description: hard ceiling applied to the personal volume bonus after the rank bump is added
        default: 50000
      - name: senior_rank_bump_bp
        type: integer
        source: input
        description: additional basis points applied to the whole personal volume when paid_as_rank_code is SENIOR_CONSULTANT or higher
        default: 200
      - name: probation_keep_bp
        type: integer
        source: input
        description: fraction (bp) of the personal volume bonus retained when the earner's status is PROBATION
        default: 5000
      - name: withhold_tier_threshold_cents
        type: integer
        source: input
        description: gross commission above which the high chargeback-withholding rate applies
        default: 20000
      - name: withhold_low_bp
        type: integer
        source: input
        description: chargeback-withholding rate for gross commission at or below withhold_tier_threshold_cents
        default: 1000
      - name: withhold_high_bp
        type: integer
        source: input
        description: chargeback-withholding rate for gross commission strictly above withhold_tier_threshold_cents
        default: 2500
      - name: min_payout_cents
        type: integer
        source: input
        description: statements whose net_payable_cents is strictly below this are carried forward instead of paid
        default: 2500
      - name: consecutive_qualifying_periods
        type: integer
        source: input
        description: number of consecutive CLOSED periods a consultant must qualify at a rank before rank_code advances to it
        default: 2
      - name: maintenance_grace_periods
        type: integer
        source: input
        description: number of consecutive CLOSED periods a consultant may hold a rank above their qualified rank before a one-step demotion
        default: 1
      - name: seventy_rule_bp
        type: integer
        source: input
        description: minimum prior-period sell-through ratio (bp) required before a new PERSONAL_INVENTORY order is accepted; the check is `sell_through_bp >= seventy_rule_bp`
        default: 7000
      - name: buyback_rate_bp
        type: integer
        source: input
        description: fraction of eligible wholesale cost refunded on an approved buyback
        default: 9000
      - name: buyback_window_days
        type: integer
        source: input
        description: maximum age in days of an order line (order.placed_at) eligible for buyback
        default: 365
      - name: restock_free_limit_cents
        type: integer
        source: input
        description: gross refund at or below this value attracts no restocking fee
        default: 45000
      - name: restock_fee_bp
        type: integer
        source: input
        description: restocking fee rate applied when gross_refund_cents strictly exceeds restock_free_limit_cents
        default: 500
      - name: sanction_cooloff_days
        type: integer
        source: input
        description: buffer in days appended after a sanction window's effective_until during which a further sanction window may not start
        default: 30
      - name: appeal_window_days
        type: integer
        source: input
        description: days after a SANCTIONED decision during which the consultant may appeal
        default: 14
      - name: reinstatement_window_days
        type: integer
        source: input
        description: days after terminated_at during which reinstatement is permitted
        default: 180
      - name: max_identity_attempts
        type: integer
        source: input
        description: number of identity-verification submissions allowed before a FAIL decision rejects the application outright
        default: 2
      - name: free_shipping_threshold_cents
        type: integer
        source: input
        description: merchandise subtotal at or above which shipping is free
        default: 25000
      - name: flat_shipping_cents
        type: integer
        source: input
        description: flat shipping charge applied when merchandise subtotal is below free_shipping_threshold_cents
        default: 995
      - name: rank_ladder
        type: array
        source: input
        description: "ordered rank definitions; each element is { rank_code: string, rank_order: integer, required_pv_points: integer, required_gv_points: integer, required_active_legs: integer, override_levels: integer, override_bp_by_level: integer[] }; rank_order values MUST be 1..N contiguous and override_bp_by_level MUST have exactly override_levels elements"
        default: |
          [{rank_code: CONSULTANT,         rank_order: 1, required_pv_points: 0,   required_gv_points: 0,     required_active_legs: 0, override_levels: 0, override_bp_by_level: []},
           {rank_code: SENIOR_CONSULTANT,  rank_order: 2, required_pv_points: 300, required_gv_points: 1200,  required_active_legs: 1, override_levels: 1, override_bp_by_level: [500]},
           {rank_code: DIRECTOR,           rank_order: 3, required_pv_points: 500, required_gv_points: 3000,  required_active_legs: 1, override_levels: 3, override_bp_by_level: [800, 400, 200]},
           {rank_code: EXECUTIVE_DIRECTOR, rank_order: 4, required_pv_points: 800, required_gv_points: 10000, required_active_legs: 3, override_levels: 5, override_bp_by_level: [900, 500, 300, 200, 100]}]
        constraints: at least one element; rank_code unique within the array
      - name: consultant_count
        type: integer
        source: computed
        description: number of Consultant rows referencing this plan whose status is not TERMINATED
        default: 0

  - name: TaxJurisdiction
    parent: null
    common_fields: false
    fields:
      - name: state_code
        type: string
        source: input
        description: two-letter state code the rule applies to
        constraints: unique across all TaxJurisdiction rows; exactly 2 uppercase letters
      - name: tax_rate_bp
        type: integer
        source: input
        description: sales tax rate in basis points applied to the taxable basis
        constraints: 0..2000
      - name: facilitator_agreement_active
        type: boolean
        source: input
        description: true when the company has a marketplace-facilitator agreement in this state
      - name: tax_basis_mode
        type: enum
        source: computed
        description: "SRP when facilitator_agreement_active is true, NET_PRICE otherwise"
        constraints: "one of {SRP, NET_PRICE}"
      - name: remitter
        type: enum
        source: computed
        description: "COMPANY when facilitator_agreement_active is true, CONSULTANT otherwise"
        constraints: "one of {COMPANY, CONSULTANT}"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: catalog identifier
        constraints: unique across all Product rows
      - name: name
        type: string
        source: input
        description: display name
      - name: wholesale_price_cents
        type: integer
        source: input
        description: price in cents a consultant pays per unit
        constraints: ">= 0"
      - name: srp_cents
        type: integer
        source: input
        description: suggested retail price in cents per unit; the taxable basis under a facilitator agreement
        constraints: ">= wholesale_price_cents"
      - name: volume_points_per_unit
        type: integer
        source: input
        description: volume points earned per unit ordered
        default: 0
        constraints: ">= 0"
      - name: commissionable
        type: boolean
        source: input
        description: when false the unit's volume points never enter commissionable volume
        default: true
      - name: buyback_eligible
        type: boolean
        source: input
        description: when false the unit may never appear on a BuybackRequest line
        default: true
      - name: is_starter_kit
        type: boolean
        source: input
        description: when true the product may be referenced as EnrollmentApplication.starter_kit_product_id
        default: false

  - name: EnrollmentApplication
    parent: null
    common_fields: true
    fields:
      - name: applicant_email
        type: string
        source: input
        description: prospect email
        constraints: unique among EnrollmentApplication rows whose status is in {DRAFT, READY_FOR_APPROVAL, APPROVED}
      - name: applicant_full_name
        type: string
        source: input
        description: prospect legal name
      - name: applicant_state_code
        type: string
        source: input
        description: prospect state code; selects the TaxJurisdiction row used for starter-kit tax
      - name: sponsor_consultant_id
        type: string
        source: input
        description: "FK -> Consultant.id; nullable — null enrolls a root (no upline) consultant and is only accepted from PlatformAdmin"
      - name: compensation_plan_id
        type: string
        source: input
        description: FK -> CompensationPlan.id; the plan the resulting consultant is enrolled on
      - name: starter_kit_product_id
        type: string
        source: input
        description: FK -> Product.id; MUST be a Product whose is_starter_kit is true
      - name: agreement_version
        type: string
        source: input
        description: identifier of the consultant agreement text presented to the applicant
        default: AGR-2026-01
      - name: identity_document_reference
        type: string
        source: input
        description: opaque reference to the identity document bundle; when supplied at creation the application starts with identity_status PENDING_REVIEW
        default: null
      - name: status
        type: enum
        source: computed
        description: compound rollup of the three parallel dimensions
        default: DRAFT
        constraints: "one of {DRAFT, READY_FOR_APPROVAL, APPROVED, REJECTED, WITHDRAWN}"
      - name: agreement_status
        type: enum
        source: computed
        description: agreement acceptance dimension
        default: NOT_ACCEPTED
        constraints: "one of {NOT_ACCEPTED, ACCEPTED}"
      - name: agreement_accepted_at
        type: datetime
        source: computed
        description: logical-clock instant the agreement was accepted; null before acceptance
        default: null
      - name: identity_status
        type: enum
        source: computed
        description: identity verification dimension
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, PENDING_REVIEW, VERIFIED, FAILED}"
      - name: identity_attempt_count
        type: integer
        source: computed
        description: number of identity document submissions made so far (creation with identity_document_reference counts as 1)
        default: 0
      - name: identity_failure_reason
        type: string
        source: computed
        description: reviewer-supplied reason recorded by the most recent FAIL decision
        default: null
      - name: kit_status
        type: enum
        source: computed
        description: starter kit payment dimension
        default: UNPAID
        constraints: "one of {UNPAID, PAID}"
      - name: kit_charge_cents
        type: integer
        source: computed
        description: wholesale_price_cents of the starter kit product, snapshotted at application creation
      - name: kit_tax_cents
        type: integer
        source: computed
        description: sales tax on the starter kit, computed by calculations.starter_kit_charge from the applicant_state_code jurisdiction
      - name: kit_total_cents
        type: integer
        source: computed
        description: kit_charge_cents + kit_tax_cents
      - name: kit_payment_reference
        type: string
        source: computed
        description: payment reference recorded by POST pay-starter-kit
        default: null
      - name: created_consultant_id
        type: string
        source: computed
        description: FK -> Consultant.id; the Consultant minted by approval, null before approval
        default: null
      - name: rejection_reason
        type: string
        source: computed
        description: reason recorded when the application moved to REJECTED or WITHDRAWN
        default: null

  - name: Consultant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: computed
        description: copied from EnrollmentApplication.applicant_full_name at approval
      - name: email
        type: string
        source: computed
        description: copied from EnrollmentApplication.applicant_email at approval
      - name: state_code
        type: string
        source: computed
        description: copied from EnrollmentApplication.applicant_state_code at approval
      - name: compensation_plan_id
        type: string
        source: computed
        description: FK -> CompensationPlan.id; copied from the approved application
      - name: enrollment_application_id
        type: string
        source: computed
        description: FK -> EnrollmentApplication.id; the application that minted this consultant
      - name: sponsor_consultant_id
        type: string
        source: computed
        description: "FK -> Consultant.id; self-referential upline pointer, null for a root consultant; rewritten by termination reassignment and by reinstatement"
        default: null
      - name: upline_path
        type: array
        source: computed
        description: ordered array of Consultant ids from the root down to the direct sponsor (exclusive of self); recomputed for the whole subtree whenever sponsor_consultant_id changes
      - name: genealogy_depth
        type: integer
        source: computed
        description: length of upline_path
        default: 0
      - name: direct_downline_count
        type: integer
        source: computed
        description: number of Consultant rows whose sponsor_consultant_id equals this id and whose status is not TERMINATED
        default: 0
      - name: status
        type: enum
        source: computed
        description: lifecycle state
        default: ACTIVE
        constraints: "one of {ACTIVE, PROBATION, SUSPENDED, INACTIVE, TERMINATED}"
      - name: rank_code
        type: string
        source: computed
        description: currently held rank; MUST equal a rank_code in the plan's rank_ladder
        default: CONSULTANT
      - name: rank_order
        type: integer
        source: computed
        description: rank_order of rank_code within the plan's rank_ladder
        default: 1
      - name: rank_source
        type: enum
        source: computed
        description: how the current rank_code was set
        default: ENROLLMENT
        constraints: "one of {ENROLLMENT, EARNED, ADMIN_ADJUSTED, MAINTENANCE_DEMOTION, REINSTATEMENT}"
      - name: consecutive_qualified_count
        type: integer
        source: computed
        description: number of consecutive CLOSED periods in which qualified_rank_order was at or above rank_order + 1 (the advancement candidate); reset to 0 by any CLOSED period that falls short
        default: 0
      - name: grace_periods_used
        type: integer
        source: computed
        description: consecutive CLOSED periods in which qualified_rank_order was below rank_order without a demotion yet applied
        default: 0
      - name: lifetime_commission_paid_cents
        type: integer
        source: computed
        description: cumulative paid_cents across all CommissionStatement rows whose payout_status is PAID
        default: 0
      - name: carry_forward_cents
        type: integer
        source: computed
        description: cumulative net_payable_cents of statements whose payout_status is CARRIED_FORWARD and which have not yet been released
        default: 0
      - name: clawback_balance_cents
        type: integer
        source: computed
        description: outstanding amount the company must recover (buyback under-recovery plus reversed payouts)
        default: 0
      - name: payout_hold
        type: boolean
        source: computed
        description: true whenever clawback_balance_cents is greater than 0
        default: false
      - name: enrollment_completed_at
        type: datetime
        source: computed
        description: logical-clock instant of application approval
      - name: terminated_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent termination; null when never terminated
        default: null
      - name: termination_reason
        type: enum
        source: computed
        description: reason of the most recent termination
        default: null
        constraints: "one of {VOLUNTARY, ADMINISTRATIVE, DISCIPLINARY}"
      - name: reinstated_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent reinstatement
        default: null
      - name: reinstatement_count
        type: integer
        source: computed
        description: number of times this consultant has been reinstated
        default: 0
      - name: reassigned_from_sponsor_consultant_id
        type: string
        source: computed
        description: "FK -> Consultant.id; the sponsor this consultant had immediately before the most recent downline reassignment, retained so reinstatement can restore the edge"
        default: null
      - name: reassignment_count
        type: integer
        source: computed
        description: number of times this consultant's sponsor_consultant_id was rewritten by a termination reassignment
        default: 0
      - name: open_case_count
        type: integer
        source: computed
        description: number of ComplianceCase rows for this consultant whose status is in {OPEN, UNDER_REVIEW, APPEALED}
        default: 0
      - name: highest_sanction_order
        type: integer
        source: computed
        description: "highest sanction ladder position ever imposed on this consultant (WARNING=1, PROBATION=2, SUSPENSION=3, TERMINATION=4); 0 when never sanctioned"
        default: 0
      - name: active_sanction_level
        type: enum
        source: computed
        description: sanction level currently in force
        default: null
        constraints: "one of {WARNING, PROBATION, SUSPENSION, TERMINATION}"
      - name: active_sanction_until
        type: datetime
        source: computed
        description: effective_until of the sanction currently in force; null when no dated sanction is in force
        default: null

  - name: ProductOrder
    parent: null
    common_fields: true
    fields:
      - name: consultant_id
        type: string
        source: input
        description: FK -> Consultant.id; the ordering consultant
      - name: order_type
        type: enum
        source: input
        description: purchase channel; drives anti-inventory-loading and retail-profit treatment
        constraints: "one of {PERSONAL_INVENTORY, RETAIL_CUSTOMER, BUSINESS_SUPPLY}"
      - name: posted_period_code
        type: string
        source: input
        description: period_code the order's volume must post to; MUST equal the period_code of the plan's QualificationPeriod whose half-open interval contains placed_at
      - name: ship_to_state_code
        type: string
        source: input
        description: state code selecting the TaxJurisdiction row for this order
      - name: lines
        type: array
        source: input
        description: "order lines; the client supplies { product_id: string (references Product.id), quantity: integer >= 1 } and the server appends the computed members { unit_wholesale_price_cents, unit_srp_cents, volume_points_per_unit, commissionable, line_wholesale_subtotal_cents, line_srp_subtotal_cents, line_tax_cents, line_volume_points, returned_quantity }; line order is preserved as submitted"
        constraints: 1..20 elements
      - name: placed_at
        type: datetime
        source: computed
        description: logical clock value at creation
      - name: payment_status
        type: enum
        source: computed
        description: payment dimension (independent of fulfillment_status)
        default: PENDING
        constraints: "one of {PENDING, PAID, REFUNDED_PARTIAL, REFUNDED_FULL}"
      - name: fulfillment_status
        type: enum
        source: computed
        description: fulfillment dimension (independent of payment_status)
        default: NEW
        constraints: "one of {NEW, SHIPPED, DELIVERED, RETURNED_PARTIAL, RETURNED_FULL}"
      - name: merchandise_subtotal_cents
        type: integer
        source: computed
        description: sum over lines of line_wholesale_subtotal_cents
      - name: srp_basis_cents
        type: integer
        source: computed
        description: sum over lines of line_srp_subtotal_cents
      - name: tax_basis_mode
        type: enum
        source: computed
        description: snapshot of the jurisdiction's tax_basis_mode at creation
        constraints: "one of {SRP, NET_PRICE}"
      - name: tax_remitter
        type: enum
        source: computed
        description: snapshot of the jurisdiction's remitter at creation
        constraints: "one of {COMPANY, CONSULTANT}"
      - name: tax_rate_bp
        type: integer
        source: computed
        description: snapshot of the jurisdiction's tax_rate_bp at creation
      - name: tax_total_cents
        type: integer
        source: computed
        description: sum over lines of line_tax_cents (rounded per line, then summed)
      - name: shipping_cents
        type: integer
        source: computed
        description: flat_shipping_cents when merchandise_subtotal_cents is below free_shipping_threshold_cents, else 0
      - name: total_due_cents
        type: integer
        source: computed
        description: merchandise_subtotal_cents + tax_total_cents + shipping_cents
      - name: total_volume_points
        type: integer
        source: computed
        description: sum over lines of line_volume_points
      - name: commissionable_volume_points
        type: integer
        source: computed
        description: sum over lines of line_volume_points where the line's commissionable is true
      - name: returned_volume_points
        type: integer
        source: computed
        description: sum over lines of volume_points_per_unit * returned_quantity
        default: 0
      - name: payment_reference
        type: string
        source: computed
        description: reference recorded by POST pay
        default: null
      - name: volume_posted
        type: boolean
        source: computed
        description: true once payment posted this order's volume to a PeriodQualification row
        default: false
      - name: refunded_cents
        type: integer
        source: computed
        description: cumulative net_refund_cents of REFUNDED BuybackRequest lines drawn against this order
        default: 0

  - name: QualificationPeriod
    parent: null
    common_fields: true
    fields:
      - name: compensation_plan_id
        type: string
        source: input
        description: FK -> CompensationPlan.id
      - name: period_code
        type: string
        source: input
        description: period label
        constraints: unique per compensation_plan_id
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the period's half-open interval
      - name: period_end
        type: datetime
        source: input
        description: exclusive end of the period's half-open interval
        constraints: strictly greater than period_start
      - name: status
        type: enum
        source: computed
        description: period lifecycle
        default: OPEN
        constraints: "one of {OPEN, LOCKED, CLOSED, REOPENED}"
      - name: locked_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent lock
        default: null
      - name: closed_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent close
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: number of times this period has been reopened
        default: 0
      - name: correction_pending
        type: boolean
        source: computed
        description: true when a post-close correction (returned volume) landed on this period and the period has not been reopened and re-locked since
        default: false
      - name: qualification_count
        type: integer
        source: computed
        description: number of PeriodQualification rows attached to this period
        default: 0
      - name: total_net_personal_volume_points
        type: integer
        source: computed
        description: sum over this period's PeriodQualification rows of net_personal_volume_points
        default: 0

  - name: PeriodQualification
    parent: null
    common_fields: true
    fields:
      - name: consultant_id
        type: string
        source: computed
        description: FK -> Consultant.id
      - name: qualification_period_id
        type: string
        source: computed
        description: FK -> QualificationPeriod.id
      - name: period_code
        type: string
        source: computed
        description: denormalized copy of the period's period_code
      - name: personal_volume_points
        type: integer
        source: computed
        description: sum of line_volume_points over the consultant's PAID orders posted to this period
        default: 0
      - name: returned_volume_points
        type: integer
        source: computed
        description: volume points removed from this period by REFUNDED buybacks
        default: 0
      - name: net_personal_volume_points
        type: integer
        source: computed
        description: personal_volume_points - returned_volume_points
        default: 0
      - name: retail_volume_points
        type: integer
        source: computed
        description: portion of personal_volume_points sourced from RETAIL_CUSTOMER orders
        default: 0
      - name: inventory_volume_points
        type: integer
        source: computed
        description: portion of personal_volume_points sourced from PERSONAL_INVENTORY orders
        default: 0
      - name: attested_personal_use_points
        type: integer
        source: computed
        description: points the consultant attested as personally consumed in this period, set by POST personal-use-attestation
        default: 0
      - name: group_volume_points
        type: integer
        source: computed
        description: net_personal_volume_points of this consultant plus the net_personal_volume_points of every descendant in the genealogy at unlimited depth; maintained incrementally while the period status is OPEN or REOPENED and frozen while LOCKED or CLOSED
        default: 0
      - name: active_leg_count
        type: integer
        source: computed
        description: number of direct downline consultants whose own subtree volume (self plus descendants, net personal volume in this period) is at least plan.active_leg_min_points; maintained on the same schedule as group_volume_points
        default: 0
      - name: sell_through_bp
        type: integer
        source: computed
        description: prior-period sell-through ratio computed by calculations.inventory_loading_ratio and stamped at lock
        default: 0
      - name: qualified_rank_code
        type: string
        source: computed
        description: highest rank_ladder rank whose thresholds this row satisfies; null when even the lowest rank is unmet
        default: null
      - name: qualified_rank_order
        type: integer
        source: computed
        description: rank_order of qualified_rank_code, 0 when null
        default: 0
      - name: paid_as_rank_code
        type: string
        source: computed
        description: the lower by rank_order of the consultant's held rank_code and this row's qualified_rank_code; null when qualified_rank_code is null
        default: null
      - name: evaluated_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent lock evaluation
        default: null

  - name: CommissionRun
    parent: null
    common_fields: true
    fields:
      - name: qualification_period_id
        type: string
        source: input
        description: FK -> QualificationPeriod.id; the CLOSED period this run pays
      - name: period_code
        type: string
        source: computed
        description: denormalized copy of the period's period_code
      - name: compression_mode_snapshot
        type: enum
        source: computed
        description: the plan's compression_mode read at the moment of the most recent calculate
        default: null
        constraints: "one of {DYNAMIC, STATIC}"
      - name: status
        type: enum
        source: computed
        description: run lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, CALCULATED, APPROVED, PAID, REVERSED}"
      - name: calculation_sequence
        type: integer
        source: computed
        description: number of times this run has been calculated
        default: 0
      - name: calculated_by_user_id
        type: string
        source: computed
        description: X-User-ID of the CommissionAnalyst who most recently calculated the run
        default: null
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the FinanceController who approved the run
        default: null
      - name: statement_count
        type: integer
        source: computed
        description: number of CommissionStatement rows of this run whose status is ACTIVE
        default: 0
      - name: gross_total_cents
        type: integer
        source: computed
        description: sum of gross_commission_cents over ACTIVE statements
        default: 0
      - name: forfeited_to_company_cents
        type: integer
        source: computed
        description: override entitlement that no consultant received because a genealogical payline level was occupied by a non-payline-qualified node under STATIC compression
        default: 0
      - name: distributable_pool_cents
        type: integer
        source: computed
        description: gross_total_cents + forfeited_to_company_cents
        default: 0
      - name: withheld_total_cents
        type: integer
        source: computed
        description: sum of withholding_cents over ACTIVE statements
        default: 0
      - name: net_payable_total_cents
        type: integer
        source: computed
        description: sum of net_payable_cents over ACTIVE statements
        default: 0
      - name: paid_total_cents
        type: integer
        source: computed
        description: sum of paid_cents over ACTIVE statements after the pay transition
        default: 0
      - name: carry_forward_total_cents
        type: integer
        source: computed
        description: sum of carry_forward_cents over ACTIVE statements after the pay transition
        default: 0
      - name: reversed_total_cents
        type: integer
        source: computed
        description: total paid_cents clawed back by the reverse transition
        default: 0
      - name: paid_at
        type: datetime
        source: computed
        description: logical-clock instant of the pay transition
        default: null
      - name: reversed_at
        type: datetime
        source: computed
        description: logical-clock instant of the reverse transition
        default: null
      - name: correction_flagged
        type: boolean
        source: computed
        description: true when a post-close volume correction landed on the run's period after the run was paid
        default: false

  - name: CommissionStatement
    parent: null
    common_fields: true
    fields:
      - name: commission_run_id
        type: string
        source: computed
        description: FK -> CommissionRun.id
      - name: consultant_id
        type: string
        source: computed
        description: FK -> Consultant.id
      - name: period_code
        type: string
        source: computed
        description: denormalized copy of the run's period_code
      - name: calculation_sequence
        type: integer
        source: computed
        description: the run's calculation_sequence when this statement was produced
      - name: paid_as_rank_code
        type: string
        source: computed
        description: paid_as_rank_code copied from the consultant's PeriodQualification row for the run's period
        default: null
      - name: net_personal_volume_points
        type: integer
        source: computed
        description: net_personal_volume_points copied from the PeriodQualification row
        default: 0
      - name: retail_profit_cents
        type: integer
        source: computed
        description: output of calculations.retail_profit_recognition
        default: 0
      - name: pv_bonus_cents
        type: integer
        source: computed
        description: output of calculations.personal_volume_bonus
        default: 0
      - name: override_total_cents
        type: integer
        source: computed
        description: output of calculations.multilevel_override_payout
        default: 0
      - name: override_breakdown
        type: array
        source: computed
        description: "one element per paid downline node: { source_consultant_id: string (references Consultant.id), paid_level: integer, volume_points: integer, amount_cents: integer }, ordered by (paid_level ASC, source consultant created_at ASC)"
      - name: gross_commission_cents
        type: integer
        source: computed
        description: retail_profit_cents + pv_bonus_cents + override_total_cents
        default: 0
      - name: withhold_rate_bp
        type: integer
        source: computed
        description: withholding rate selected from the gross_commission_cents tier
        default: 0
      - name: withholding_cents
        type: integer
        source: computed
        description: chargeback withholding actually applied
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: gross_commission_cents - withholding_cents
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: amount actually disbursed by the run's pay transition
        default: 0
      - name: carry_forward_cents
        type: integer
        source: computed
        description: amount deferred because net_payable_cents was below plan.min_payout_cents
        default: 0
      - name: payout_status
        type: enum
        source: computed
        description: disbursement outcome
        default: PENDING
        constraints: "one of {PENDING, PAYABLE, CARRIED_FORWARD, PAID, VOIDED}"
      - name: status
        type: enum
        source: computed
        description: statement generation lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED, VOIDED}"

  - name: BuybackRequest
    parent: null
    common_fields: true
    fields:
      - name: consultant_id
        type: string
        source: input
        description: FK -> Consultant.id; the returning consultant
      - name: lines
        type: array
        source: input
        description: "buyback lines; the client supplies { product_order_id: string (references ProductOrder.id), product_id: string (references Product.id), quantity: integer >= 1, condition: enum {RESALABLE, OPENED, DAMAGED} } and the server appends { unit_wholesale_price_cents, volume_points_per_unit, line_wholesale_cents, line_volume_points }"
        constraints: 1..20 elements
      - name: status
        type: enum
        source: computed
        description: buyback lifecycle
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DENIED, REFUNDED}"
      - name: requested_volume_points
        type: integer
        source: computed
        description: sum over lines of volume_points_per_unit * quantity
        default: 0
      - name: eligible_wholesale_cents
        type: integer
        source: computed
        description: sum over lines of unit_wholesale_price_cents * quantity
        default: 0
      - name: gross_refund_cents
        type: integer
        source: computed
        description: step 1 of calculations.buyback_refund_settlement
        default: 0
      - name: restocking_fee_bp
        type: integer
        source: computed
        description: restocking rate selected from the gross_refund_cents tier
        default: 0
      - name: restocking_fee_cents
        type: integer
        source: computed
        description: step 2 of calculations.buyback_refund_settlement
        default: 0
      - name: commission_clawback_cents
        type: integer
        source: computed
        description: step 3 of calculations.buyback_refund_settlement
        default: 0
      - name: net_refund_cents
        type: integer
        source: computed
        description: step 4 of calculations.buyback_refund_settlement
        default: 0
      - name: unrecovered_clawback_cents
        type: integer
        source: computed
        description: step 5 of calculations.buyback_refund_settlement; added to Consultant.clawback_balance_cents at refund
        default: 0
      - name: volume_reversal_period_code
        type: string
        source: computed
        description: period_code the returned volume was subtracted from (always the posted_period_code of the source orders)
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the FinanceController who approved or denied the request
        default: null
      - name: decision_reason
        type: string
        source: computed
        description: reason recorded with the decision
        default: null
      - name: refunded_at
        type: datetime
        source: computed
        description: logical-clock instant of the refund transition
        default: null

  - name: ComplianceCase
    parent: null
    common_fields: true
    fields:
      - name: consultant_id
        type: string
        source: input
        description: FK -> Consultant.id; the consultant under investigation
      - name: claim_type
        type: enum
        source: input
        description: category of the alleged violation
        constraints: "one of {INCOME_CLAIM, PRODUCT_CLAIM, PRICING_VIOLATION, CROSS_RECRUITING}"
      - name: evidence_reference
        type: string
        source: input
        description: opaque reference to the evidence bundle
      - name: status
        type: enum
        source: computed
        description: case lifecycle
        default: OPEN
        constraints: "one of {OPEN, UNDER_REVIEW, SANCTIONED, DISMISSED, APPEALED}"
      - name: sanction_level
        type: enum
        source: computed
        description: sanction imposed by the most recent SANCTION decision
        default: null
        constraints: "one of {WARNING, PROBATION, SUSPENSION, TERMINATION}"
      - name: sanction_order
        type: integer
        source: computed
        description: "ladder position of sanction_level (WARNING=1, PROBATION=2, SUSPENSION=3, TERMINATION=4); 0 when unsanctioned"
        default: 0
      - name: effective_from
        type: datetime
        source: computed
        description: inclusive start of the sanction window
        default: null
      - name: effective_until
        type: datetime
        source: computed
        description: inclusive end of the sanction window
        default: null
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: effective_from plus plan.appeal_window_days; the last instant an appeal is accepted
        default: null
      - name: appeal_count
        type: integer
        source: computed
        description: number of appeals filed against this case
        default: 0
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceOfficer who most recently moved the case to UNDER_REVIEW
        default: null
      - name: decision_reason
        type: string
        source: computed
        description: reason recorded with the most recent decision
        default: null
      - name: resolved_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent SANCTION or DISMISS decision
        default: null

  - name: IncomeDisclosureStatement
    parent: null
    common_fields: true
    fields:
      - name: commission_run_id
        type: string
        source: input
        description: FK -> CommissionRun.id; the PAID run whose earnings are disclosed
      - name: period_code
        type: string
        source: computed
        description: denormalized copy of the run's period_code
      - name: population_basis
        type: enum
        source: input
        description: selects which population variant of calculations.income_disclosure_distribution runs
        constraints: "one of {ALL_ENROLLED, PAID_ONLY}"
      - name: status
        type: enum
        source: computed
        description: disclosure lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, LEGAL_REVIEW, PUBLISHED, SUPERSEDED}"
      - name: population_count
        type: integer
        source: computed
        description: size of the population under the selected basis
        default: 0
      - name: zero_earner_count
        type: integer
        source: computed
        description: number of population members whose total_earnings_cents is 0
        default: 0
      - name: total_earnings_cents
        type: integer
        source: computed
        description: sum of total_earnings_cents over the population
        default: 0
      - name: median_earnings_cents
        type: integer
        source: computed
        description: median of the population's earnings, per the pinned ordering and even-count rule
        default: 0
      - name: mean_earnings_cents
        type: integer
        source: computed
        description: total_earnings_cents divided by population_count, round_half_up
        default: 0
      - name: p90_earnings_cents
        type: integer
        source: computed
        description: nearest-rank 90th percentile of the population's earnings
        default: 0
      - name: top_decile_share_bp
        type: integer
        source: computed
        description: share (bp) of total_earnings_cents received by the top decile of earners
        default: 0
      - name: distribution_buckets
        type: array
        source: computed
        description: "four fixed buckets in this order: { lower_cents: 0, upper_cents: 0 }, { lower_cents: 1, upper_cents: 9999 }, { lower_cents: 10000, upper_cents: 49999 }, { lower_cents: 50000, upper_cents: null }; each element also carries { consultant_count: integer, share_bp: integer }"
      - name: revision_number
        type: integer
        source: computed
        description: number of REQUEST_REVISION round trips this statement has taken
        default: 0
      - name: submitted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the CommissionAnalyst who submitted the statement for legal review
        default: null
      - name: legal_reviewer_user_id
        type: string
        source: computed
        description: X-User-ID of the LegalReviewer who published the statement
        default: null
      - name: published_at
        type: datetime
        source: computed
        description: logical-clock instant of publication
        default: null
      - name: superseded_by_id
        type: string
        source: computed
        description: FK -> IncomeDisclosureStatement.id; the newer statement that superseded this one
        default: null
      - name: supersede_reason
        type: enum
        source: computed
        description: why this statement was superseded
        default: null
        constraints: "one of {NEWER_PUBLICATION, RUN_REVERSED, PERIOD_CORRECTION}"
      - name: revision_note
        type: string
        source: computed
        description: note recorded by the most recent REQUEST_REVISION decision
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: EnrollmentApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    parallel_dimensions:
      - field: agreement_status
        states: [NOT_ACCEPTED, ACCEPTED]
      - field: identity_status
        states: [UNVERIFIED, PENDING_REVIEW, VERIFIED, FAILED]
      - field: kit_status
        states: [UNPAID, PAID]
    compound_rule: |
      status is derived from the three dimensions on every write:
        if status in {APPROVED, REJECTED, WITHDRAWN}: status is frozen (terminal)
        elif agreement_status == ACCEPTED and identity_status == VERIFIED and kit_status == PAID: READY_FOR_APPROVAL
        else: DRAFT
      The three dimensions advance independently except that kit payment requires
      agreement_status == ACCEPTED (a consultant may not be charged before signing).
    transitions:
      - from: null
        to: DRAFT
        trigger: POST /direct-selling/enrollment-applications
        actor: Applicant, PlatformAdmin
        preconditions:
          - compensation_plan_id references an existing CompensationPlan
          - starter_kit_product_id references an existing Product whose is_starter_kit is true
          - applicant_state_code references an existing TaxJurisdiction
          - "sponsor_consultant_id, when non-null, references a Consultant whose status is in {ACTIVE, PROBATION} (SUSPENDED, INACTIVE and TERMINATED sponsors are rejected)"
          - sponsor_consultant_id may only be null when the caller role is PlatformAdmin
          - no other EnrollmentApplication with the same applicant_email is in {DRAFT, READY_FOR_APPROVAL, APPROVED}
        side_effects:
          - kit_charge_cents, kit_tax_cents and kit_total_cents computed by calculations.starter_kit_charge
          - "identity_status set to PENDING_REVIEW and identity_attempt_count set to 1 when identity_document_reference was supplied; otherwise UNVERIFIED and 0"
          - agreement_status set to NOT_ACCEPTED, kit_status set to UNPAID

      - from: DRAFT
        to: DRAFT
        trigger: POST /direct-selling/enrollment-applications/{application_id}/accept-agreement
        actor: Applicant, PlatformAdmin
        preconditions:
          - status is DRAFT
          - agreement_status is NOT_ACCEPTED
          - the submitted agreement_version equals the application's agreement_version
        side_effects:
          - agreement_status set to ACCEPTED
          - agreement_accepted_at set to the logical clock
          - status re-derived by compound_rule

      - from: DRAFT
        to: DRAFT
        trigger: POST /direct-selling/enrollment-applications/{application_id}/identity-submission
        actor: Applicant, PlatformAdmin
        preconditions:
          - status is DRAFT
          - identity_status is UNVERIFIED or FAILED (resubmission after failure is the cycle edge)
          - identity_attempt_count is strictly below plan.max_identity_attempts
        side_effects:
          - identity_document_reference replaced with the submitted value
          - identity_attempt_count incremented by 1
          - identity_status set to PENDING_REVIEW
          - identity_failure_reason cleared to null

      - from: DRAFT
        to: DRAFT
        trigger: "POST /direct-selling/enrollment-applications/{application_id}/identity-decision with decision VERIFY"
        actor: ComplianceOfficer
        preconditions:
          - status is DRAFT
          - identity_status is PENDING_REVIEW
        side_effects:
          - identity_status set to VERIFIED
          - status re-derived by compound_rule

      - from: DRAFT
        to: DRAFT
        trigger: "POST /direct-selling/enrollment-applications/{application_id}/identity-decision with decision FAIL, while identity_attempt_count is below plan.max_identity_attempts"
        actor: ComplianceOfficer
        preconditions:
          - status is DRAFT
          - identity_status is PENDING_REVIEW
        side_effects:
          - identity_status set to FAILED
          - identity_failure_reason recorded from the decision payload

      - from: DRAFT
        to: REJECTED
        trigger: "POST /direct-selling/enrollment-applications/{application_id}/identity-decision with decision FAIL, once identity_attempt_count has reached plan.max_identity_attempts"
        actor: ComplianceOfficer
        preconditions:
          - status is DRAFT
          - identity_status is PENDING_REVIEW
          - identity_attempt_count is greater than or equal to plan.max_identity_attempts
        side_effects:
          - identity_status set to FAILED
          - status set to REJECTED (automatic, no separate call)
          - rejection_reason set to IDENTITY_ATTEMPTS_EXHAUSTED

      - from: DRAFT
        to: DRAFT
        trigger: POST /direct-selling/enrollment-applications/{application_id}/pay-starter-kit
        actor: Applicant, PlatformAdmin
        preconditions:
          - status is DRAFT
          - kit_status is UNPAID
          - agreement_status is ACCEPTED
          - the submitted amount_cents equals kit_total_cents
        side_effects:
          - kit_status set to PAID
          - kit_payment_reference recorded
          - status re-derived by compound_rule

      - from: DRAFT, READY_FOR_APPROVAL
        to: WITHDRAWN
        trigger: POST /direct-selling/enrollment-applications/{application_id}/withdraw
        actor: Applicant, PlatformAdmin
        preconditions:
          - status is DRAFT or READY_FOR_APPROVAL
        side_effects:
          - rejection_reason recorded from the withdrawal payload
          - "the starter kit charge is not refunded here: a paid kit must be recovered through a BuybackRequest after enrollment, so withdrawal of a PAID application is rejected"

      - from: READY_FOR_APPROVAL
        to: APPROVED
        trigger: POST /direct-selling/enrollment-applications/{application_id}/approve
        actor: ComplianceOfficer
        preconditions:
          - status is READY_FOR_APPROVAL (a DRAFT application is rejected with ERR_ENROLLMENT_INCOMPLETE)
          - "sponsor_consultant_id, when non-null, still references a Consultant whose status is in {ACTIVE, PROBATION} at approval time"
        side_effects:
          - "a Consultant row is created with status ACTIVE, rank_code set to the rank_ladder entry whose rank_order is 1, rank_source ENROLLMENT, sponsor_consultant_id copied from the application, upline_path computed from the sponsor's upline_path plus the sponsor id, genealogy_depth set to the length of upline_path, enrollment_completed_at set to the logical clock"
          - the sponsor's direct_downline_count incremented by 1
          - the plan's consultant_count incremented by 1
          - created_consultant_id set on the application

  - entity: Consultant
    initial_state: ACTIVE
    terminal_states: []
    terminal_note: |
      TERMINATED is absorbing only after plan.reinstatement_window_days have elapsed
      since terminated_at; inside the window POST reinstate is the single exit edge,
      so no state is unconditionally terminal.
    transitions:
      - from: null
        to: ACTIVE
        trigger: POST /direct-selling/enrollment-applications/{application_id}/approve
        actor: ComplianceOfficer
        preconditions:
          - see EnrollmentApplication READY_FOR_APPROVAL to APPROVED
        side_effects:
          - all derived counters initialized to their defaults

      - from: ACTIVE
        to: PROBATION
        trigger: "POST /direct-selling/compliance-cases/{case_id}/decision with decision SANCTION and sanction_level PROBATION"
        actor: ComplianceOfficer
        preconditions:
          - the consultant's status is ACTIVE
        side_effects:
          - active_sanction_level set to PROBATION, active_sanction_until set to the case's effective_until
          - highest_sanction_order raised to 2 when it was lower
          - "future personal volume bonuses for this consultant are multiplied by plan.probation_keep_bp while status is PROBATION"

      - from: ACTIVE, PROBATION
        to: SUSPENDED
        trigger: "POST /direct-selling/compliance-cases/{case_id}/decision with decision SANCTION and sanction_level SUSPENSION"
        actor: ComplianceOfficer
        preconditions:
          - the consultant's status is ACTIVE or PROBATION
        side_effects:
          - active_sanction_level set to SUSPENSION, active_sanction_until set to the case's effective_until
          - highest_sanction_order raised to 3 when it was lower
          - the consultant may no longer create ProductOrder or BuybackRequest rows while SUSPENDED

      - from: SUSPENDED
        to: ACTIVE
        trigger: "automatic, evaluated by POST /direct-selling/qualification-periods/{period_id}/lock"
        actor: system
        preconditions:
          - status is SUSPENDED
          - active_sanction_until is strictly before the logical clock
        side_effects:
          - status set to ACTIVE
          - active_sanction_level and active_sanction_until cleared to null
          - highest_sanction_order is NOT reduced (the escalation ladder is permanent)

      - from: ACTIVE, PROBATION, SUSPENDED, INACTIVE
        to: TERMINATED
        trigger: "POST /direct-selling/consultants/{consultant_id}/terminate, or POST /direct-selling/compliance-cases/{case_id}/decision with decision SANCTION and sanction_level TERMINATION"
        actor: ComplianceOfficer, PlatformAdmin
        preconditions:
          - status is not already TERMINATED
          - "no CommissionRun covering a period in which this consultant has an ACTIVE statement is in status APPROVED (a run mid-approval must be paid or rejected first)"
        side_effects:
          - status set to TERMINATED, terminated_at set to the logical clock, termination_reason recorded
          - "every direct downline consultant whose status is not TERMINATED is reassigned: sponsor_consultant_id set to this consultant's sponsor_consultant_id (null when this consultant was a root), reassigned_from_sponsor_consultant_id set to this consultant's id, reassignment_count incremented by 1"
          - upline_path recomputed for every reassigned consultant and, transitively, for every descendant of a reassigned consultant
          - "direct_downline_count recomputed for this consultant (falls to 0) and for the receiving grandparent (rises by the number of reassigned children)"
          - "for every QualificationPeriod whose status is OPEN or REOPENED, the PeriodQualification rows of every ancestor of the moved subtree have group_volume_points and active_leg_count recomputed"
          - active_sanction_level set to TERMINATION and active_sanction_until set to null when the trigger was a sanction
          - the plan's consultant_count decremented by 1

      - from: TERMINATED
        to: ACTIVE
        trigger: POST /direct-selling/consultants/{consultant_id}/reinstate
        actor: ComplianceOfficer
        preconditions:
          - status is TERMINATED
          - the logical clock is at or before terminated_at plus plan.reinstatement_window_days
          - clawback_balance_cents is 0
          - no ComplianceCase for this consultant is in status OPEN, UNDER_REVIEW or APPEALED
        side_effects:
          - status set to ACTIVE, reinstated_at set to the logical clock, reinstatement_count incremented by 1
          - "sponsor_consultant_id restored to reassigned_from_sponsor_consultant_id when that consultant's status is not TERMINATED; otherwise set to the nearest non-TERMINATED ancestor of that consultant, or null when none exists"
          - the restored sponsor's direct_downline_count incremented by 1
          - "the downline that was reassigned away at termination is NOT returned: reassignment is permanent"
          - rank_code reset to the rank_order 1 rung, rank_source set to REINSTATEMENT, consecutive_qualified_count and grace_periods_used reset to 0
          - active_sanction_level and active_sanction_until cleared, terminated_at retained for audit
          - the plan's consultant_count incremented by 1

      - from: ACTIVE, PROBATION
        to: INACTIVE
        trigger: "automatic, evaluated by POST /direct-selling/qualification-periods/{period_id}/close"
        actor: system
        preconditions:
          - the consultant's PeriodQualification row for the closing period has qualified_rank_code null
          - grace_periods_used has already reached plan.maintenance_grace_periods
        side_effects:
          - status set to INACTIVE
          - rank_code reset to the rank_order 1 rung, rank_source set to MAINTENANCE_DEMOTION
          - grace_periods_used reset to 0

      - from: INACTIVE
        to: ACTIVE
        trigger: "automatic, evaluated by POST /direct-selling/qualification-periods/{period_id}/close"
        actor: system
        preconditions:
          - the consultant's PeriodQualification row for the closing period has qualified_rank_code not null
        side_effects:
          - status set to ACTIVE

      - from: ACTIVE, PROBATION, INACTIVE
        to: ACTIVE, PROBATION, INACTIVE
        trigger: POST /direct-selling/consultants/{consultant_id}/rank-adjustment
        actor: PlatformAdmin
        preconditions:
          - status is not TERMINATED and not SUSPENDED
          - the requested rank_code exists in the plan's rank_ladder
        side_effects:
          - rank_code and rank_order set to the requested rung, rank_source set to ADMIN_ADJUSTED
          - consecutive_qualified_count and grace_periods_used reset to 0
          - "no state change occurs on any other dimension; the adjustment changes future paid_as_rank_code but never rewrites an already-CALCULATED statement"

  - entity: ProductOrder
    initial_state: PENDING
    terminal_states: [REFUNDED_FULL]
    parallel_dimensions:
      - field: payment_status
        states: [PENDING, PAID, REFUNDED_PARTIAL, REFUNDED_FULL]
      - field: fulfillment_status
        states: [NEW, SHIPPED, DELIVERED, RETURNED_PARTIAL, RETURNED_FULL]
    compound_rule: |
      payment_status and fulfillment_status advance independently: an order may be
      PAID/NEW, PENDING/NEW or PAID/DELIVERED, but shipping requires payment_status
      PAID, so the pair (PENDING, SHIPPED) is unreachable.
    transitions:
      - from: null
        to: PENDING
        trigger: POST /direct-selling/product-orders
        actor: Consultant, PlatformAdmin
        preconditions:
          - consultant_id references an existing Consultant whose status is ACTIVE or PROBATION
          - ship_to_state_code references an existing TaxJurisdiction
          - every line's product_id references an existing Product whose is_starter_kit is false
          - posted_period_code matches a QualificationPeriod of the consultant's plan whose status is OPEN or REOPENED and whose half-open interval contains the logical clock
          - "when order_type is PERSONAL_INVENTORY, the consultant's most recent CLOSED-period sell_through_bp is at or above plan.seventy_rule_bp"
        side_effects:
          - all line and order money, tax and volume fields computed by calculations.order_financials
          - placed_at set to the logical clock
          - payment_status set to PENDING, fulfillment_status set to NEW

      - from: PENDING
        to: PAID
        trigger: POST /direct-selling/product-orders/{order_id}/pay
        actor: Consultant, PlatformAdmin
        preconditions:
          - payment_status is PENDING
          - the submitted amount_cents equals total_due_cents
          - the posted period's status is still OPEN or REOPENED
          - the consultant's status is ACTIVE or PROBATION
        side_effects:
          - payment_status set to PAID, payment_reference recorded, volume_posted set to true
          - "the PeriodQualification row for (consultant, posted period) is created when absent, then personal_volume_points, retail_volume_points, inventory_volume_points and net_personal_volume_points increased by this order's contribution"
          - the period's total_net_personal_volume_points increased
          - "group_volume_points and active_leg_count recomputed on the PeriodQualification rows of the consultant and of every ancestor in upline_path"

      - from: NEW
        to: SHIPPED
        trigger: "POST /direct-selling/product-orders/{order_id}/fulfillment with event SHIP"
        actor: PlatformAdmin
        preconditions:
          - fulfillment_status is NEW
          - payment_status is PAID
        side_effects:
          - fulfillment_status set to SHIPPED

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /direct-selling/product-orders/{order_id}/fulfillment with event DELIVER"
        actor: PlatformAdmin
        preconditions:
          - fulfillment_status is SHIPPED
        side_effects:
          - fulfillment_status set to DELIVERED

      - from: PAID
        to: REFUNDED_PARTIAL, REFUNDED_FULL
        trigger: POST /direct-selling/buyback-requests/{buyback_id}/refund
        actor: FinanceController
        preconditions:
          - the buyback request is APPROVED and references this order on at least one line
        side_effects:
          - each referenced line's returned_quantity increased by the buyback quantity
          - returned_volume_points and refunded_cents recomputed
          - "payment_status set to REFUNDED_FULL when every line is fully returned, else REFUNDED_PARTIAL; fulfillment_status set to RETURNED_FULL or RETURNED_PARTIAL on the same test"

  - entity: QualificationPeriod
    initial_state: OPEN
    terminal_states: []
    terminal_note: |
      CLOSED is exitable through REOPENED, and REOPENED re-enters LOCKED, so the
      machine is cyclic with no absorbing state.
    transitions:
      - from: null
        to: OPEN
        trigger: POST /direct-selling/qualification-periods
        actor: CommissionAnalyst, PlatformAdmin
        preconditions:
          - compensation_plan_id references an existing CompensationPlan
          - period_end is strictly after period_start
          - "the half-open interval [period_start, period_end) does not overlap any existing period of the same plan (touching endpoints are allowed)"
          - period_code is unique within the plan
        side_effects:
          - status set to OPEN

      - from: OPEN, REOPENED
        to: LOCKED
        trigger: POST /direct-selling/qualification-periods/{period_id}/lock
        actor: CommissionAnalyst
        preconditions:
          - status is OPEN or REOPENED
        side_effects:
          - "a PeriodQualification row is created for every Consultant of the plan whose status is not TERMINATED and that has no row yet"
          - "for every row: net_personal_volume_points, group_volume_points and active_leg_count finalized, sell_through_bp stamped by calculations.inventory_loading_ratio, qualified_rank_code and qualified_rank_order set by calculations.qualification_evaluation, paid_as_rank_code set to the lower-rank_order of the consultant's held rank and qualified_rank_code"
          - every consultant whose active_sanction_until is strictly before the logical clock and whose status is SUSPENDED is returned to ACTIVE
          - status set to LOCKED, locked_at set to the logical clock, qualification_count refreshed
          - group_volume_points and active_leg_count are frozen from this point until a reopen

      - from: LOCKED
        to: CLOSED
        trigger: POST /direct-selling/qualification-periods/{period_id}/close
        actor: CommissionAnalyst
        preconditions:
          - status is LOCKED
        side_effects:
          - "rank advancement applied per consultant: consecutive_qualified_count incremented when qualified_rank_order exceeds rank_order, and once it reaches plan.consecutive_qualifying_periods the consultant's rank_code advances by exactly one rung with rank_source EARNED and the counter resets to 0"
          - "maintenance evaluated per consultant: when qualified_rank_order is below rank_order, grace_periods_used is incremented, and once it exceeds plan.maintenance_grace_periods the rank is demoted by one rung with rank_source MAINTENANCE_DEMOTION"
          - INACTIVE and ACTIVE maintenance flips applied per the Consultant machine
          - status set to CLOSED, closed_at set to the logical clock, correction_pending set to false

      - from: CLOSED
        to: REOPENED
        trigger: POST /direct-selling/qualification-periods/{period_id}/reopen
        actor: PlatformAdmin
        preconditions:
          - status is CLOSED
          - "no CommissionRun of this period is in status DRAFT, CALCULATED, APPROVED or PAID (a paid run must be reversed first)"
        side_effects:
          - status set to REOPENED, reopen_count incremented by 1
          - group_volume_points and active_leg_count become live again and are recomputed immediately from current genealogy and volume
          - correction_pending set to false

  - entity: CommissionRun
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: null
        to: DRAFT
        trigger: POST /direct-selling/commission-runs
        actor: CommissionAnalyst
        preconditions:
          - qualification_period_id references an existing QualificationPeriod whose status is CLOSED
          - expected_qualification_period_version equals the period's current version
          - no other CommissionRun of this period is in status DRAFT, CALCULATED, APPROVED or PAID
        side_effects:
          - period_code denormalized from the period
          - the QualificationPeriod's version incremented by 1

      - from: DRAFT
        to: CALCULATED
        trigger: POST /direct-selling/commission-runs/{run_id}/calculate
        actor: CommissionAnalyst
        preconditions:
          - status is DRAFT
          - the period's status is still CLOSED
        side_effects:
          - every existing ACTIVE statement of this run set to SUPERSEDED
          - "one ACTIVE CommissionStatement created per PeriodQualification row of the period whose consultant's status is not TERMINATED, computed by calculations.retail_profit_recognition, calculations.personal_volume_bonus and calculations.multilevel_override_payout, then withheld by calculations.commission_withholding"
          - compression_mode_snapshot set to the plan's current compression_mode
          - calculation_sequence incremented by 1, calculated_by_user_id set to the caller's X-User-ID
          - "run totals recomputed: gross_total_cents, forfeited_to_company_cents, distributable_pool_cents, withheld_total_cents, net_payable_total_cents, statement_count"
          - status set to CALCULATED

      - from: CALCULATED
        to: APPROVED
        trigger: "POST /direct-selling/commission-runs/{run_id}/approval-decision with decision APPROVE"
        actor: FinanceController
        preconditions:
          - status is CALCULATED
          - the caller's X-User-ID differs from calculated_by_user_id
          - "no consultant holding an ACTIVE statement of this run is in status SUSPENDED (a suspended earner must be resolved before approval)"
        side_effects:
          - approved_by_user_id recorded, status set to APPROVED
          - every ACTIVE statement's payout_status set to PAYABLE

      - from: CALCULATED
        to: DRAFT
        trigger: "POST /direct-selling/commission-runs/{run_id}/approval-decision with decision REJECT"
        actor: FinanceController
        preconditions:
          - status is CALCULATED
          - the caller's X-User-ID differs from calculated_by_user_id
        side_effects:
          - every ACTIVE statement set to SUPERSEDED with payout_status PENDING
          - all run totals reset to 0, statement_count reset to 0, compression_mode_snapshot cleared to null
          - status set to DRAFT so the analyst can recalculate

      - from: APPROVED
        to: PAID
        trigger: POST /direct-selling/commission-runs/{run_id}/pay
        actor: FinanceController
        preconditions:
          - status is APPROVED
        side_effects:
          - "per ACTIVE statement, first: the consultant's clawback_balance_cents decreased by the statement's withholding_cents and payout_hold re-derived as (clawback_balance_cents > 0); this recovery happens whether or not the net amount is disbursed, and payout_hold is evaluated for the disbursement test BEFORE this recovery is applied"
          - "per ACTIVE statement: when net_payable_cents is at or above plan.min_payout_cents and the consultant's payout_hold was false at the start of the transition, paid_cents set to net_payable_cents, carry_forward_cents 0, payout_status PAID and the consultant's lifetime_commission_paid_cents increased by paid_cents"
          - "otherwise paid_cents set to 0, carry_forward_cents set to net_payable_cents, payout_status CARRIED_FORWARD and the consultant's carry_forward_cents increased by that amount"
          - paid_total_cents and carry_forward_total_cents refreshed, paid_at set to the logical clock
          - status set to PAID

      - from: PAID
        to: REVERSED
        trigger: POST /direct-selling/commission-runs/{run_id}/reverse
        actor: FinanceController
        preconditions:
          - status is PAID
          - a reversal_reason is supplied
        side_effects:
          - "every ACTIVE statement set to status VOIDED and payout_status VOIDED"
          - "for every statement whose payout_status was PAID: the consultant's lifetime_commission_paid_cents decreased by paid_cents and clawback_balance_cents increased by the same amount, then payout_hold set to true when clawback_balance_cents is above 0"
          - "for every statement whose payout_status was CARRIED_FORWARD: the consultant's carry_forward_cents decreased by carry_forward_cents"
          - reversed_total_cents set to the former paid_total_cents, reversed_at set to the logical clock
          - "every PUBLISHED IncomeDisclosureStatement of this run set to SUPERSEDED with supersede_reason RUN_REVERSED"
          - status set to REVERSED

  - entity: CommissionStatement
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: POST /direct-selling/commission-runs/{run_id}/calculate
        actor: CommissionAnalyst
        preconditions:
          - the run is in status DRAFT
        side_effects:
          - all money fields computed, payout_status set to PENDING
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /direct-selling/commission-runs/{run_id}/calculate (recalculation), or approval-decision with decision REJECT"
        actor: CommissionAnalyst, FinanceController
        preconditions:
          - status is ACTIVE
        side_effects:
          - payout_status reset to PENDING
      - from: ACTIVE
        to: VOIDED
        trigger: POST /direct-selling/commission-runs/{run_id}/reverse
        actor: FinanceController
        preconditions:
          - status is ACTIVE and the run's status is PAID
        side_effects:
          - payout_status set to VOIDED and the consultant's ledger fields compensated

  - entity: BuybackRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, REFUNDED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: POST /direct-selling/buyback-requests
        actor: Consultant, PlatformAdmin
        preconditions:
          - consultant_id references an existing Consultant whose status is ACTIVE, PROBATION or TERMINATED (a terminated consultant retains the statutory right to sell inventory back)
          - the consultant's status is not SUSPENDED
          - "every line's product_order_id references a ProductOrder of this consultant whose payment_status is PAID or REFUNDED_PARTIAL and whose order_type is PERSONAL_INVENTORY"
          - every line's product_id appears on that order and has buyback_eligible true
          - every line's quantity is at or below that order line's quantity minus returned_quantity
          - every line's condition is RESALABLE
          - "every referenced order's placed_at is at most plan.buyback_window_days before the logical clock"
        side_effects:
          - all money fields computed by calculations.buyback_refund_settlement
          - volume_reversal_period_code set to the referenced orders' posted_period_code

      - from: REQUESTED
        to: APPROVED
        trigger: "POST /direct-selling/buyback-requests/{buyback_id}/decision with decision APPROVE"
        actor: FinanceController
        preconditions:
          - status is REQUESTED
        side_effects:
          - decided_by_user_id and decision_reason recorded

      - from: REQUESTED
        to: DENIED
        trigger: "POST /direct-selling/buyback-requests/{buyback_id}/decision with decision DENY"
        actor: FinanceController
        preconditions:
          - status is REQUESTED
          - a decision_reason is supplied
        side_effects:
          - decided_by_user_id and decision_reason recorded, all money fields left as computed but never disbursed

      - from: APPROVED
        to: REFUNDED
        trigger: POST /direct-selling/buyback-requests/{buyback_id}/refund
        actor: FinanceController
        preconditions:
          - status is APPROVED
        side_effects:
          - refunded_at set to the logical clock
          - each referenced ProductOrder line's returned_quantity increased and the order's payment_status and fulfillment_status re-derived
          - "the PeriodQualification row for (consultant, volume_reversal_period_code) has returned_volume_points increased by requested_volume_points and net_personal_volume_points recomputed"
          - "group_volume_points and active_leg_count recomputed for the consultant and every ancestor when that period's status is OPEN or REOPENED"
          - "when that period's status is LOCKED or CLOSED, the period's correction_pending set to true and every CommissionRun of that period whose status is PAID has correction_flagged set to true and every PUBLISHED IncomeDisclosureStatement of such a run set to SUPERSEDED with supersede_reason PERIOD_CORRECTION"
          - the consultant's clawback_balance_cents increased by unrecovered_clawback_cents and payout_hold re-derived

  - entity: ComplianceCase
    initial_state: OPEN
    terminal_states: [DISMISSED]
    transitions:
      - from: null
        to: OPEN
        trigger: POST /direct-selling/compliance-cases
        actor: ComplianceOfficer
        preconditions:
          - consultant_id references an existing Consultant whose status is not TERMINATED
        side_effects:
          - opened case counted in the consultant's open_case_count

      - from: OPEN, APPEALED
        to: UNDER_REVIEW
        trigger: POST /direct-selling/compliance-cases/{case_id}/review
        actor: ComplianceOfficer
        preconditions:
          - status is OPEN or APPEALED
        side_effects:
          - reviewed_by_user_id set to the caller's X-User-ID

      - from: UNDER_REVIEW
        to: SANCTIONED
        trigger: "POST /direct-selling/compliance-cases/{case_id}/decision with decision SANCTION"
        actor: ComplianceOfficer
        preconditions:
          - status is UNDER_REVIEW
          - effective_until is strictly after effective_from
          - "the requested sanction_order is strictly greater than the consultant's highest_sanction_order (the disciplinary ladder may not be skipped downward nor repeated)"
          - "the requested window [effective_from, effective_until] does not overlap, nor start within plan.sanction_cooloff_days after the end of, any other SANCTIONED case window of the same consultant"
        side_effects:
          - sanction_level, sanction_order, effective_from, effective_until and decision_reason recorded
          - appeal_deadline_at set to effective_from plus plan.appeal_window_days
          - resolved_at set to the logical clock
          - the consultant's status, active_sanction_level, active_sanction_until and highest_sanction_order updated per the Consultant machine, including the TERMINATION reassignment cascade
          - the consultant's open_case_count decremented by 1

      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /direct-selling/compliance-cases/{case_id}/decision with decision DISMISS"
        actor: ComplianceOfficer
        preconditions:
          - status is UNDER_REVIEW
        side_effects:
          - resolved_at set to the logical clock, decision_reason recorded
          - "when this case had previously imposed PROBATION or SUSPENSION, the consultant's status returns to ACTIVE and active_sanction_level and active_sanction_until are cleared; highest_sanction_order is NOT reduced and a TERMINATION is NOT auto-undone (reinstatement remains a separate act)"
          - the consultant's open_case_count decremented by 1

      - from: SANCTIONED
        to: APPEALED
        trigger: POST /direct-selling/compliance-cases/{case_id}/appeal
        actor: Consultant
        preconditions:
          - status is SANCTIONED
          - the caller's consultant identity equals consultant_id
          - the logical clock is at or before appeal_deadline_at
          - appeal_count is 0 (a single appeal per case)
        side_effects:
          - appeal_count incremented by 1
          - the sanction remains in force during the appeal (no stay of execution)
          - the consultant's open_case_count incremented by 1

  - entity: IncomeDisclosureStatement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: null
        to: DRAFT
        trigger: POST /direct-selling/income-disclosure-statements
        actor: CommissionAnalyst
        preconditions:
          - commission_run_id references an existing CommissionRun whose status is PAID
          - expected_commission_run_version equals the run's current version
          - the selected population is non-empty
        side_effects:
          - every distribution metric computed by calculations.income_disclosure_distribution
          - the CommissionRun's version incremented by 1

      - from: DRAFT
        to: LEGAL_REVIEW
        trigger: POST /direct-selling/income-disclosure-statements/{statement_id}/submit-legal-review
        actor: CommissionAnalyst
        preconditions:
          - status is DRAFT
        side_effects:
          - submitted_by_user_id set to the caller's X-User-ID

      - from: LEGAL_REVIEW
        to: PUBLISHED
        trigger: "POST /direct-selling/income-disclosure-statements/{statement_id}/legal-decision with decision PUBLISH"
        actor: LegalReviewer
        preconditions:
          - status is LEGAL_REVIEW
          - the caller's X-User-ID differs from submitted_by_user_id
          - the run's status is still PAID (a reversed run may not be disclosed)
        side_effects:
          - published_at set to the logical clock, legal_reviewer_user_id recorded
          - "any other PUBLISHED statement of the same run set to SUPERSEDED with supersede_reason NEWER_PUBLICATION and superseded_by_id pointing at this statement"

      - from: LEGAL_REVIEW
        to: DRAFT
        trigger: "POST /direct-selling/income-disclosure-statements/{statement_id}/legal-decision with decision REQUEST_REVISION"
        actor: LegalReviewer
        preconditions:
          - status is LEGAL_REVIEW
          - a revision_note is supplied
        side_effects:
          - revision_number incremented by 1, revision_note recorded, submitted_by_user_id cleared to null
          - every distribution metric recomputed from current data

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "automatic, on publication of a newer statement of the same run, on POST /direct-selling/commission-runs/{run_id}/reverse, or on a post-close volume correction reaching the run's period"
        actor: system
        preconditions:
          - status is PUBLISHED
        side_effects:
          - supersede_reason set to NEWER_PUBLICATION, RUN_REVERSED or PERIOD_CORRECTION respectively
          - superseded_by_id set only for the NEWER_PUBLICATION case

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - id: stale-period-version-on-run-create
    scenario: |
      A commission run is created for a CLOSED qualification period while that
      period is being mutated by another workflow. The client that read the period
      earlier holds an outdated snapshot: after its read, the period was reopened
      and re-locked (or a buyback correction bumped it), so the volume the client
      believes it is paying is no longer the volume of record.
    guarantee: |
      POST /direct-selling/commission-runs requires expected_qualification_period_version.
      The write is admitted only when the value equals QualificationPeriod.version at
      the moment the run is created; otherwise the request is rejected and nothing is
      written. A successful create increments QualificationPeriod.version by 1, so a
      replay of the same request with the same expected value is rejected.
    occ_field: expected_qualification_period_version
    parent_entity: QualificationPeriod
    write_endpoint: POST /direct-selling/commission-runs
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412
    serialization: |
      Version comparison is the only admission test. Where an ordering fallback is
      needed among rows (for example choosing which of several statements is the
      earliest), order by created_at ascending; the UUID id is never used to decide
      any business outcome.

  - id: stale-run-version-on-disclosure-draft
    scenario: |
      An income disclosure statement is drafted from a paid commission run whose
      figures have since changed: the run was reversed, or a newer calculation
      sequence replaced its statements. The drafting client's snapshot of the run is
      outdated and the disclosure it would publish would misstate the earnings
      distribution.
    guarantee: |
      POST /direct-selling/income-disclosure-statements requires
      expected_commission_run_version. The draft is admitted only when the value
      equals CommissionRun.version at the moment the statement is created; otherwise
      the request is rejected and no statement row is written. A successful create
      increments CommissionRun.version by 1, so a second draft attempt reusing the
      stale expected value is rejected and the caller must re-read the run.
    occ_field: expected_commission_run_version
    parent_entity: CommissionRun
    write_endpoint: POST /direct-selling/income-disclosure-statements
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412
    serialization: |
      Version comparison is the only admission test; created_at ascending is the
      tie-break for any ordering question (for example which PUBLISHED statement of a
      run is the newest). The UUID id never participates in a business decision.

# =============================================================================
# §1.3 Calculation Rules Table
#
# Global arithmetic conventions (apply to every rule below unless the rule says
# otherwise):
#   * Money is integer cents; volume is integer points; rates are integer basis
#     points (bp) where 10000 bp = 100%.
#   * round_half_up(x) means: round to the nearest integer, and when the fraction
#     is exactly 0.5 round away from zero. Written rhu(x) below.
#   * A rate application is always rhu(amount * rate_bp / 10000) evaluated on the
#     exact rational value, never on a pre-rounded intermediate.
#   * "the logical clock" is the value returned by GET /direct-selling/_clock,
#     default 2026-08-01T00:00:00Z.
# =============================================================================
calculations:

  - name: starter_kit_charge
    description: |
      Prices the starter kit on an enrollment application. The taxable basis
      depends on the applicant state's facilitator agreement, while the amount the
      applicant pays for the merchandise itself is always the wholesale price.
    trigger: POST /direct-selling/enrollment-applications (at creation only; never recomputed afterwards)
    inputs:
      - Product row referenced by starter_kit_product_id (wholesale_price_cents, srp_cents)
      - TaxJurisdiction row whose state_code equals applicant_state_code (tax_rate_bp, facilitator_agreement_active)
    algorithm: threshold
    formula: |
      kit_charge_cents = product.wholesale_price_cents
      basis_cents      = product.srp_cents  if jurisdiction.facilitator_agreement_active else product.wholesale_price_cents
      kit_tax_cents    = rhu(basis_cents * jurisdiction.tax_rate_bp / 10000)
      kit_total_cents  = kit_charge_cents + kit_tax_cents
    constants: {}
    precision: integer cents, round_half_up on the single tax multiplication
    worked_example: |
      Starter kit KIT-STD wholesale 9900, srp 14900; jurisdiction TX rate 825 bp with
      facilitator_agreement_active true.
        basis = 14900 ; tax = rhu(14900 * 825 / 10000) = rhu(1229.25) = 1229
        kit_charge = 9900 ; kit_total = 11129
      The same kit in a non-facilitator state at 825 bp would be taxed on 9900:
        tax = rhu(816.75) = 817 ; kit_total = 10717

  - name: order_financials
    description: |
      Prices a product order line by line, then rolls the lines up. Sales tax is
      computed and rounded PER LINE and the rounded line amounts are summed; the
      order-level tax is never computed by applying the rate to the order-level
      basis. Under a facilitator agreement the taxable basis is the suggested
      retail price even though the consultant pays the wholesale price.
    trigger: POST /direct-selling/product-orders (at creation only)
    inputs:
      - lines[] with product_id and quantity
      - Product rows (wholesale_price_cents, srp_cents, volume_points_per_unit, commissionable)
      - TaxJurisdiction row whose state_code equals ship_to_state_code
      - CompensationPlan (free_shipping_threshold_cents, flat_shipping_cents)
    algorithm: tiered_pricing
    formula: |
      tax_basis_mode = jurisdiction.tax_basis_mode        # SRP under a facilitator agreement, else NET_PRICE
      tax_remitter   = jurisdiction.remitter
      tax_rate_bp    = jurisdiction.tax_rate_bp

      for each line i, in submitted order:
        unit_wholesale_price_cents_i = product_i.wholesale_price_cents
        unit_srp_cents_i             = product_i.srp_cents
        line_wholesale_subtotal_i    = unit_wholesale_price_cents_i * quantity_i
        line_srp_subtotal_i          = unit_srp_cents_i * quantity_i
        line_basis_i                 = line_srp_subtotal_i if tax_basis_mode == SRP else line_wholesale_subtotal_i
        line_tax_cents_i             = rhu(line_basis_i * tax_rate_bp / 10000)      # PER-LINE rounding
        line_volume_points_i         = product_i.volume_points_per_unit * quantity_i
        returned_quantity_i          = 0

      merchandise_subtotal_cents   = SUM(line_wholesale_subtotal_i)
      srp_basis_cents              = SUM(line_srp_subtotal_i)
      tax_total_cents              = SUM(line_tax_cents_i)                          # sum of rounded lines
      shipping_cents               = plan.flat_shipping_cents
                                       if merchandise_subtotal_cents < plan.free_shipping_threshold_cents
                                       else 0
      total_due_cents              = merchandise_subtotal_cents + tax_total_cents + shipping_cents
      total_volume_points          = SUM(line_volume_points_i)
      commissionable_volume_points = SUM(line_volume_points_i where product_i.commissionable)
    constants:
      BP_DENOMINATOR: 10000
    precision: integer cents; round_half_up per line; the free-shipping test uses strict less-than
    worked_example: |
      TX 825 bp facilitator. Two lines, each 5 units of SACHET (wholesale 100, srp 200):
        line_srp_subtotal = 1000 each
        line_tax = rhu(1000 * 825 / 10000) = rhu(82.5) = 83 each  ->  tax_total = 166
      Applying the rate to the order basis instead would give
        rhu(2000 * 825 / 10000) = rhu(165.0) = 165, which is WRONG by 1 cent.
      Single line, 120 units of SERUM (wholesale 2000, srp 4000):
        merchandise = 240000 ; srp basis = 480000
        tax = rhu(480000 * 825 / 10000) = 39600 ; shipping = 0 (240000 >= 25000)
        total_due = 279600 ; volume = 120 * 20 = 2400 points

  - name: qualification_evaluation
    description: |
      Determines, for one PeriodQualification row, the highest rank whose
      thresholds the row satisfies, and the rank the consultant will actually be
      paid as. Group volume counts the consultant plus every descendant at
      unlimited depth; a leg is active on its whole subtree volume, not on the
      leg root's personal volume alone.
    trigger: POST /direct-selling/qualification-periods/{period_id}/lock (once per row per lock)
    inputs:
      - PeriodQualification.net_personal_volume_points for every row of the period
      - Consultant genealogy (sponsor_consultant_id, upline_path, status)
      - CompensationPlan.rank_ladder and active_leg_min_points
    algorithm: threshold
    formula: |
      subtree_volume(X) = SUM over {X} and every descendant D of X of
                          (net_personal_volume_points of D's row in this period, 0 when no row)
      group_volume_points = subtree_volume(self)
      active_leg_count    = COUNT of direct children C of self with C.status != TERMINATED
                            and subtree_volume(C) >= plan.active_leg_min_points

      qualified_rank = the rung L of rank_ladder with the greatest rank_order such that
                         net_personal_volume_points >= L.required_pv_points
                     AND group_volume_points        >= L.required_gv_points
                     AND active_leg_count           >= L.required_active_legs
                       (all three comparisons are inclusive; null when no rung matches)
      qualified_rank_code  = qualified_rank.rank_code, or null
      qualified_rank_order = qualified_rank.rank_order, or 0
      paid_as_rank_order   = 0 if qualified_rank_order == 0
                             else MIN(consultant.rank_order, qualified_rank_order)
      paid_as_rank_code    = the rank_ladder rung with rank_order == paid_as_rank_order, or null
    constants:
      RANK_LADDER: |
        rank_order 1 CONSULTANT           pv 0    gv 0      legs 0  override_levels 0  bps []
        rank_order 2 SENIOR_CONSULTANT    pv 300  gv 1200   legs 1  override_levels 1  bps [500]
        rank_order 3 DIRECTOR             pv 500  gv 3000   legs 1  override_levels 3  bps [800, 400, 200]
        rank_order 4 EXECUTIVE_DIRECTOR   pv 800  gv 10000  legs 3  override_levels 5  bps [900, 500, 300, 200, 100]
      ACTIVE_LEG_MIN_POINTS: 300
    precision: integer points; every threshold comparison is greater-than-or-equal
    worked_example: |
      Genealogy A -> B -> C with net personal volume A 600, B 100, C 2400.
        A: gv = 600+100+2400 = 3100 ; subtree(B) = 2500 >= 300 so legs = 1
           DIRECTOR needs pv 500, gv 3000, legs 1 -> all met ; EXECUTIVE needs gv 10000 -> not met
           qualified_rank_code = DIRECTOR (rank_order 3)
        B: pv 100 < 300 so SENIOR is not met -> qualified_rank_code = CONSULTANT (rank_order 1)
        C: legs = 0 < 1 so SENIOR is not met -> qualified_rank_code = CONSULTANT
      Boundary pair: A pv 300 with a single child B pv 900 gives gv exactly 1200 and
      1 active leg, so A qualifies SENIOR_CONSULTANT; B pv 899 gives gv 1199 and A
      falls back to CONSULTANT.

  - name: personal_volume_bonus
    description: |
      Marginal-band bonus on the consultant's own net personal volume, then a
      flat rank bump applied to the WHOLE volume (not only to the top band), then
      a cap, then a probation haircut. The order of those four steps is normative.
    trigger: POST /direct-selling/commission-runs/{run_id}/calculate (once per statement)
    inputs:
      - PeriodQualification.net_personal_volume_points
      - PeriodQualification.paid_as_rank_code
      - Consultant.status
      - CompensationPlan (pv_bonus_bands, pv_bonus_min_points, point_value_cents, senior_rank_bump_bp, pv_bonus_cap_cents, probation_keep_bp)
    algorithm: tiered_pricing
    formula: |
      pv = net_personal_volume_points
      if pv < plan.pv_bonus_min_points: pv_bonus_cents = 0 and STOP

      # step 1 - marginal bands, rounded per band then summed
      lower = 0 ; base_cents = 0
      for each band in plan.pv_bonus_bands, in order:
        upper       = band.upper_points if band.upper_points is not null else pv
        band_points = MAX(0, MIN(pv, upper) - lower)
        base_cents += rhu(band_points * plan.point_value_cents * band.rate_bp / 10000)
        lower       = upper
        if lower >= pv: break

      # step 2 - rank bump on the whole volume
      bump_cents = rhu(pv * plan.point_value_cents * plan.senior_rank_bump_bp / 10000)
                     if paid_as_rank_code is not null
                        and rank_order(paid_as_rank_code) >= 2
                   else 0

      # step 3 - cap
      capped_cents = MIN(base_cents + bump_cents, plan.pv_bonus_cap_cents)

      # step 4 - probation haircut, applied AFTER the cap
      pv_bonus_cents = rhu(capped_cents * plan.probation_keep_bp / 10000)
                         if consultant.status == PROBATION
                       else capped_cents
    constants:
      PV_BONUS_BANDS: "1..500 -> 500 bp ; 501..1500 -> 900 bp ; 1501+ -> 1300 bp"
      POINT_VALUE_CENTS: 100
      PV_BONUS_MIN_POINTS: 100
      SENIOR_RANK_BUMP_BP: 200
      PV_BONUS_CAP_CENTS: 50000
      PROBATION_KEEP_BP: 5000
    precision: integer cents, round_half_up per band and once for the bump
    worked_example: |
      pv 600, paid_as DIRECTOR, status ACTIVE:
        band 1..500  : 500 * 100 = 50000 -> rhu(50000 * 500 / 10000)  = 2500
        band 501..600: 100 * 100 = 10000 -> rhu(10000 * 900 / 10000)  =  900
        base = 3400 ; bump = rhu(600 * 100 * 200 / 10000) = 1200 ; total = 4600
      pv 100, paid_as CONSULTANT: base = rhu(10000 * 500 / 10000) = 500, bump 0 -> 500
      pv 2400, paid_as CONSULTANT: 2500 + 9000 + rhu(90000 * 1300 / 10000) = 23200
      pv 2400, status PROBATION  : rhu(23200 * 5000 / 10000) = 11600
      pv 5000, paid_as CONSULTANT: 2500 + 9000 + 45500 = 57000 -> capped to 50000
      pv 899 , paid_as CONSULTANT: 2500 + rhu(39900 * 900 / 10000) = 2500 + 3591 = 6091
      pv 99  : below PV_BONUS_MIN_POINTS -> 0

  - name: multilevel_override_payout
    description: |
      Pays the earner a percentage of each downline consultant's net personal
      volume by payline level. Nodes whose own volume is below the payline
      minimum are not paid. The two compression modes disagree about what happens
      to the LEVEL such a node occupies: DYNAMIC closes the gap and pulls deeper
      qualified nodes upward, STATIC leaves the gap open and forfeits the
      entitlement of the level to the company.
    trigger: POST /direct-selling/commission-runs/{run_id}/calculate (once per statement)
    inputs:
      - the earner's PeriodQualification.paid_as_rank_code and the rung's override_levels / override_bp_by_level
      - net_personal_volume_points of every PeriodQualification row of the period
      - Consultant genealogy (sponsor_consultant_id, upline_path, status)
      - CompensationPlan (compression_mode, payline_min_pv_points, point_value_cents)
    algorithm: topological
    formula: |
      if paid_as_rank_code is null: override_total_cents = 0, breakdown empty, STOP
      levels = rung(paid_as_rank_code).override_levels
      bp     = rung(paid_as_rank_code).override_bp_by_level     # 1-indexed
      if levels == 0: override_total_cents = 0, breakdown empty, STOP

      payline_qualified(X) = X.status != TERMINATED
                             and X has a PeriodQualification row in this period
                             and that row's net_personal_volume_points >= plan.payline_min_pv_points

      amount(X, level) = rhu(X.row.net_personal_volume_points * plan.point_value_cents
                             * bp[level] / 10000)

      for every descendant D of the earner E (unlimited depth):
        gen_level     = D.genealogy_depth - E.genealogy_depth      # 1 for a direct child
        skipped_count = number of nodes strictly between E and D on the
                        genealogy path that are NOT payline_qualified
        # variant-specific level assignment, see variants below
      breakdown is ordered by (paid_level ASC, source consultant created_at ASC)
      override_total_cents = SUM of breakdown amount_cents
    constants:
      PAYLINE_MIN_PV_POINTS: 200
      POINT_VALUE_CENTS: 100
      OVERRIDE_BP_BY_LEVEL: "SENIOR_CONSULTANT [500] ; DIRECTOR [800, 400, 200] ; EXECUTIVE_DIRECTOR [900, 500, 300, 200, 100]"
    precision: integer cents, round_half_up per paid node
    variants:
      - name: DYNAMIC
        when: the run's compression_mode_snapshot is DYNAMIC
        difference: |
          paid_level = gen_level - skipped_count. A payline-qualified descendant is
          paid at the level it would occupy if every non-qualified ancestor between
          it and the earner were removed from the tree, so deep volume is pulled up
          into a nearer, better-paying band. Non-qualified nodes generate no payment
          and no forfeiture, so this variant contributes 0 to
          CommissionRun.forfeited_to_company_cents.
      - name: STATIC
        when: the run's compression_mode_snapshot is STATIC
        difference: |
          paid_level = gen_level, with no compression. A payline-qualified descendant
          is paid at its literal genealogical distance, and for every NON-qualified
          descendant N whose gen_level is at or below levels the amount that would
          have been paid at that level, amount(N, gen_level), is added to
          CommissionRun.forfeited_to_company_cents instead of being paid to anyone.
          Deep qualified volume therefore pays less (or nothing, once gen_level
          exceeds levels) than under DYNAMIC.
    worked_example: |
      Genealogy A -> B -> C, net personal volume A 600, B 100, C 2400.
      A is paid_as DIRECTOR (levels 3, bp [800, 400, 200]).
      B has 100 points, below PAYLINE_MIN_PV_POINTS 200, so B is not payline qualified.
        DYNAMIC: C gen_level 2, skipped_count 1 -> paid_level 1
                 amount = rhu(2400 * 100 * 800 / 10000) = 19200
                 A.override_total_cents = 19200 ; forfeited = 0
        STATIC : C gen_level 2 -> paid_level 2
                 amount = rhu(2400 * 100 * 400 / 10000) = 9600
                 B is unqualified at gen_level 1 -> forfeited += rhu(100 * 100 * 800 / 10000) = 800
                 A.override_total_cents = 9600 ; run.forfeited_to_company_cents = 800
      B is paid_as CONSULTANT (levels 0) so B's override_total_cents is 0 in both modes.

  - name: retail_profit_recognition
    description: |
      The consultant's retail margin on customer orders in the period: suggested
      retail price minus wholesale price on units that were sold and not returned.
      Inventory and business-supply purchases never produce retail profit, and
      unpaid orders are excluded entirely.
    trigger: POST /direct-selling/commission-runs/{run_id}/calculate (once per statement)
    inputs:
      - ProductOrder rows of the consultant with posted_period_code equal to the run's period_code
      - order lines (unit_srp_cents, unit_wholesale_price_cents, quantity, returned_quantity)
    algorithm: aggregation
    formula: |
      eligible_orders = ProductOrder rows where
          consultant_id       == statement.consultant_id
      AND posted_period_code  == run.period_code
      AND order_type          == RETAIL_CUSTOMER
      AND payment_status      in {PAID, REFUNDED_PARTIAL}

      retail_profit_cents = SUM over eligible_orders, over their lines, of
          (unit_srp_cents - unit_wholesale_price_cents) * (quantity - returned_quantity)
    constants: {}
    precision: exact integer cents, no rounding (all terms are integers)
    worked_example: |
      A RETAIL_CUSTOMER order of 70 units of SAMPLE (srp 200, wholesale 100), fully paid
      and not returned: retail_profit = 70 * (200 - 100) = 7000.
      The same consultant's PERSONAL_INVENTORY order of 100 units contributes 0.
      A PENDING retail order contributes 0 until it is paid.

  - name: commission_withholding
    description: |
      Chargeback withholding on a statement. The rate is chosen by a gross-amount
      tier, but the amount actually withheld can never exceed the consultant's
      outstanding clawback balance, because withholding exists only to recover
      that balance. At payment the withheld amount is applied against the balance.
    trigger: POST /direct-selling/commission-runs/{run_id}/calculate, then applied by POST .../pay
    inputs:
      - CommissionStatement.gross_commission_cents
      - Consultant.clawback_balance_cents
      - CompensationPlan (withhold_tier_threshold_cents, withhold_low_bp, withhold_high_bp)
    algorithm: threshold
    formula: |
      gross_commission_cents = retail_profit_cents + pv_bonus_cents + override_total_cents
      withhold_rate_bp = plan.withhold_high_bp
                           if gross_commission_cents > plan.withhold_tier_threshold_cents
                         else plan.withhold_low_bp
      tier_amount_cents  = rhu(gross_commission_cents * withhold_rate_bp / 10000)
      withholding_cents  = MIN(tier_amount_cents, consultant.clawback_balance_cents)
      net_payable_cents  = gross_commission_cents - withholding_cents

      # at POST /direct-selling/commission-runs/{run_id}/pay, for every ACTIVE statement,
      # regardless of whether the net amount is disbursed or carried forward:
      consultant.clawback_balance_cents -= withholding_cents
      consultant.payout_hold             = (consultant.clawback_balance_cents > 0)
    constants:
      WITHHOLD_TIER_THRESHOLD_CENTS: 20000
      WITHHOLD_LOW_BP: 1000
      WITHHOLD_HIGH_BP: 2500
    precision: integer cents, round_half_up once; the tier test uses strict greater-than
    worked_example: |
      gross 23800 with clawback_balance 0     : rate 2500 bp, tier 5950, withheld 0,     net 23800
      gross 23800 with clawback_balance 100000: rate 2500 bp, tier 5950, withheld 5950,  net 17850
      gross 20000 with clawback_balance 100000: rate 1000 bp (20000 is NOT above 20000), withheld 2000
      gross 20001 with clawback_balance 100000: rate 2500 bp, tier rhu(5000.25) = 5000,  net 15001
      gross  3400 with clawback_balance 22000 : rate 1000 bp, withheld 340, net 3060,
                                               balance falls to 21660 at payment

  - name: buyback_refund_settlement
    description: |
      Settles an inventory buyback in five ordered steps. The restocking tier is
      keyed on the GROSS refund, before any clawback is netted; recomputing the
      tier on the net refund is the classic error. Commission already paid on the
      returned volume is clawed back pro rata, and any shortfall becomes a
      receivable that puts the consultant on payout hold.
    trigger: POST /direct-selling/buyback-requests (steps 1-5 at creation), re-applied to ledgers by POST .../refund
    inputs:
      - buyback lines (unit_wholesale_price_cents, volume_points_per_unit, quantity)
      - the consultant's CommissionStatement for volume_reversal_period_code, when one exists
      - the consultant's PeriodQualification row for volume_reversal_period_code
      - CompensationPlan (buyback_rate_bp, restock_free_limit_cents, restock_fee_bp)
    algorithm: waterfall_allocation
    formula: |
      # step 1 - gross refund
      eligible_wholesale_cents = SUM over lines of unit_wholesale_price_cents * quantity
      requested_volume_points  = SUM over lines of volume_points_per_unit * quantity
      gross_refund_cents       = rhu(eligible_wholesale_cents * plan.buyback_rate_bp / 10000)

      # step 2 - restocking fee, tiered on the GROSS refund of step 1
      restocking_fee_bp    = plan.restock_fee_bp
                               if gross_refund_cents > plan.restock_free_limit_cents
                             else 0
      restocking_fee_cents = rhu(gross_refund_cents * restocking_fee_bp / 10000)

      # step 3 - pro rata commission clawback
      let S = the consultant's CommissionStatement for volume_reversal_period_code
              whose status is ACTIVE or VOIDED (the most recent by created_at when
              several exist), and let Q = the consultant's PeriodQualification row
              for that period
      commission_clawback_cents =
          0                                        if S does not exist
                                                   or Q.net_personal_volume_points <= 0
          rhu(S.pv_bonus_cents * requested_volume_points / Q.net_personal_volume_points)
                                                   otherwise
          (capped at S.pv_bonus_cents)

      # step 4 - net refund, never negative
      net_refund_cents = MAX(0, gross_refund_cents - restocking_fee_cents - commission_clawback_cents)

      # step 5 - shortfall becomes a receivable
      unrecovered_clawback_cents = MAX(0, restocking_fee_cents + commission_clawback_cents
                                          - gross_refund_cents)
    constants:
      BUYBACK_RATE_BP: 9000
      RESTOCK_FREE_LIMIT_CENTS: 45000
      RESTOCK_FEE_BP: 500
      BUYBACK_WINDOW_DAYS: 365
    precision: integer cents, round_half_up at steps 1, 2 and 3; steps 4 and 5 are exact
    worked_example: |
      100 units of SERUM (wholesale 2000) returned by a consultant whose statement for
      the source period had pv_bonus_cents 23200 on 2400 net personal volume points, and
      whose returned volume is 100 * 20 = 2000 points:
        step 1: eligible 200000 -> gross = rhu(200000 * 9000 / 10000) = 180000
        step 2: 180000 > 45000  -> fee_bp 500 -> fee = rhu(180000 * 500 / 10000) = 9000
        step 3: clawback = rhu(23200 * 2000 / 2400) = rhu(19333.33) = 19333
        step 4: net = 180000 - 9000 - 19333 = 151667
        step 5: unrecovered = 0
      Restocking boundary, 25 units of SERUM: gross = rhu(45000) = 45000, which is NOT
      above 45000, so fee_bp is 0 and net is 45000 minus clawback. 26 units: gross 46800,
      fee_bp 500, fee = 2340.
      Shortfall case, 100 units of BOOST (wholesale 100, 30 points each) returned by a
      consultant whose statement had pv_bonus_cents 31000 on 3000 points:
        gross = rhu(10000 * 9000 / 10000) = 9000 ; fee_bp 0 ; clawback = rhu(31000 * 3000 / 3000) = 31000
        net = MAX(0, 9000 - 0 - 31000) = 0 ; unrecovered = 31000 - 9000 = 22000

  - name: inventory_loading_ratio
    description: |
      The anti-inventory-loading (seventy percent) rule. Measures how much of the
      inventory a consultant purchased in a period was sold to customers or
      attested as personally consumed. This is the only ratio in the domain that
      truncates instead of rounding half up, because a consultant may never be
      credited with sell-through they did not achieve.
    trigger: POST /direct-selling/qualification-periods/{period_id}/lock (stamped on each row); read by POST /direct-selling/product-orders
    inputs:
      - PeriodQualification.inventory_volume_points
      - PeriodQualification.retail_volume_points
      - PeriodQualification.attested_personal_use_points
      - CompensationPlan.seventy_rule_bp
    algorithm: threshold
    formula: |
      purchased_points = inventory_volume_points
      credited_points  = MIN(retail_volume_points + attested_personal_use_points,
                             purchased_points)
      sell_through_bp  = 10000                                            if purchased_points == 0
                         else floor(credited_points * 10000 / purchased_points)

      # order admission test, evaluated when order_type == PERSONAL_INVENTORY:
      let R = the consultant's PeriodQualification row for the most recent CLOSED
              QualificationPeriod of the plan, ordered by period_start descending
      admitted = true                              if R does not exist
                 else R.sell_through_bp >= plan.seventy_rule_bp
    constants:
      SEVENTY_RULE_BP: 7000
      ROUNDING: floor (truncation toward zero), deliberately different from every other rule
    precision: integer basis points, floor; the admission test is greater-than-or-equal
    worked_example: |
      purchased 100 points, retail 70 points, attested 0: floor(70 * 10000 / 100) = 7000,
      and 7000 >= 7000 so the next inventory order is admitted.
      purchased 100, retail 69: floor(6900) = 6900 < 7000, so the next inventory order is
      rejected with ERR_INVENTORY_LOADING_VIOLATION.
      purchased 100, retail 60, attested 10: credited 70 -> 7000, admitted.
      purchased 100, retail 80, attested 40: credited capped at 100 -> 10000, admitted.
      purchased 0: 10000 by definition, admitted.
      A consultant with no CLOSED period yet is admitted unconditionally.

  - name: income_disclosure_distribution
    description: |
      Builds the earnings distribution published in the income disclosure
      statement. Earnings mean GROSS commission, before withholding and before
      the minimum-payout carry-forward. The population basis is the disclosure's
      central policy choice and materially changes every published figure.
    trigger: POST /direct-selling/income-disclosure-statements, and again on REQUEST_REVISION
    inputs:
      - the run's ACTIVE CommissionStatement rows (gross_commission_cents, payout_status)
      - Consultant rows (status, enrollment_completed_at)
      - QualificationPeriod.period_end
    algorithm: weighted_scoring
    formula: |
      population is defined per variant (see variants), each member contributing one
      earnings_cents value; let E = the population's earnings values sorted ASCENDING
      and n = population_count = length(E), with E indexed 0..n-1

      total_earnings_cents = SUM(E)
      zero_earner_count    = COUNT of members with earnings_cents == 0
      mean_earnings_cents  = rhu(total_earnings_cents / n)
      median_earnings_cents = E[(n-1)/2]                     when n is odd
                              rhu((E[n/2 - 1] + E[n/2]) / 2) when n is even
      p90_index            = ceil(90 * n / 100) - 1          # nearest-rank, 0-based
      p90_earnings_cents   = E[p90_index]
      k                    = MAX(1, ceil(n / 10))
      top_decile_total     = SUM of the k largest values of E
      top_decile_share_bp  = 0 if total_earnings_cents == 0
                             else rhu(top_decile_total * 10000 / total_earnings_cents)

      distribution_buckets are the four fixed bands, in this order:
        [0, 0], [1, 9999], [10000, 49999], [50000, null]
      for each bucket: consultant_count = COUNT of members whose earnings_cents falls in
      the inclusive band, and share_bp = rhu(consultant_count * 10000 / n)
    constants:
      BUCKET_BOUNDS_CENTS: "[0,0], [1,9999], [10000,49999], [50000,null]"
      TOP_DECILE_FRACTION: "ceil(n / 10), at least 1"
    precision: integer cents and integer basis points, round_half_up; percentile index uses ceil
    variants:
      - name: ALL_ENROLLED
        when: population_basis is ALL_ENROLLED
        difference: |
          The population is every Consultant of the run's plan whose status is not
          TERMINATED and whose enrollment_completed_at is strictly before the period's
          period_end. A consultant with no ACTIVE statement in the run contributes
          earnings_cents 0, so zero_earner_count can be positive and the mean and
          median are pulled down. This is the disclosure basis that includes
          non-earners.
      - name: PAID_ONLY
        when: population_basis is PAID_ONLY
        difference: |
          The population is only those consultants whose ACTIVE statement in the run
          has payout_status PAID. Statements carried forward below the minimum payout
          and consultants without a statement are excluded entirely, so n is smaller,
          zero_earner_count is normally 0, and the mean, median and p90 are higher.
          The two bases therefore disagree on population_count, mean, median,
          top_decile_share_bp and every bucket count for the same run.
    worked_example: |
      A run with three ACTIVE statements: 500 (carried forward, below the 2500 minimum),
      23200 (paid) and 23800 (paid); all three consultants are non-terminated and were
      enrolled before period_end.
        ALL_ENROLLED: E = [500, 23200, 23800], n = 3, total = 47500
                      median = E[1] = 23200 ; mean = rhu(47500 / 3) = 15833
                      p90_index = ceil(2.7) - 1 = 2 -> p90 = 23800
                      k = MAX(1, ceil(0.3)) = 1 -> top_decile_total = 23800
                      top_decile_share_bp = rhu(23800 * 10000 / 47500) = rhu(5010.53) = 5011
                      zero_earner_count = 0
                      buckets = [0, 1, 2, 0] with share_bp [0, 3333, 6667, 0]
        PAID_ONLY   : E = [23200, 23800], n = 2, total = 47000
                      median = rhu((23200 + 23800) / 2) = 23500 ; mean = 23500
                      p90_index = ceil(1.8) - 1 = 1 -> p90 = 23800
                      k = 1 -> top_decile_share_bp = rhu(23800 * 10000 / 47000) = rhu(5063.83) = 5064
                      buckets = [0, 0, 2, 0] with share_bp [0, 0, 10000, 0]
      Adding a fourth, non-earning consultant changes only ALL_ENROLLED:
        E = [0, 500, 23200, 23800], n = 4, median = rhu((500 + 23200) / 2) = 11850,
        mean = rhu(47500 / 4) = 11875, zero_earner_count = 1,
        p90_index = ceil(3.6) - 1 = 3 -> p90 = 23800, k = MAX(1, ceil(0.4)) = 1 -> 5011 bp.

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first violated rule short-circuits the request and nothing is written)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: X-User-ID and X-Role headers are both present and non-empty
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: no credentials at all; evaluated before the request body is parsed

  - priority: 2
    category: auth
    check: the X-Role value is one of the seven declared roles and is listed in the endpoint's roles
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: authenticated but not permitted on this endpoint

  - priority: 3
    category: auth
    check: |
      when X-Role is Consultant the acting consultant (resolved from X-User-ID)
      must own the addressed resource, and when X-Role is Applicant the acting
      applicant must own the addressed EnrollmentApplication
    error_id: ERR_FORBIDDEN_RESOURCE
    http_status: 403
    applies_to: "all endpoints whose roles include Consultant or Applicant"
    description: row-level ownership, checked before any body validation

  - priority: 4
    category: validation
    check: |
      body and query shape: every required field present; enums are declared
      members; integer fields are integers within their declared range; arrays are
      within their declared length bounds; datetimes are ISO-8601 with a Z offset;
      limit is 1..100 and offset is at or above 0
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
    description: |
      one generic shape error for every malformed request. Unknown body keys and
      any attempt to supply a `source: computed` or `source: system` field are
      silently ignored rather than rejected.

  - priority: 5
    category: existence
    check: every id in the path resolves to a live row
    error_id: "ERR_PLAN_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_CONSULTANT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_QUALIFICATION_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_STATEMENT_NOT_FOUND | ERR_BUYBACK_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_DISCLOSURE_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_JURISDICTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: the error id names the entity the missing path segment addresses

  - priority: 6
    category: existence
    check: every foreign key in the request body resolves to a live row, including state_code lookups against TaxJurisdiction
    error_id: "ERR_PLAN_NOT_FOUND | ERR_CONSULTANT_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_JURISDICTION_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /direct-selling/enrollment-applications, POST /direct-selling/product-orders, POST /direct-selling/qualification-periods, POST /direct-selling/commission-runs, POST /direct-selling/buyback-requests, POST /direct-selling/compliance-cases, POST /direct-selling/income-disclosure-statements"
    description: body references are resolved left to right in the order the fields are declared in §1.5 input

  - priority: 7
    category: existence
    check: every product_id and product_order_id inside a lines[] element resolves to a live row
    error_id: "ERR_PRODUCT_NOT_FOUND | ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /direct-selling/product-orders, POST /direct-selling/buyback-requests"
    description: nested line references are resolved in submitted line order, so the first bad line decides the error

  - priority: 8
    category: concurrency
    check: expected_qualification_period_version equals the addressed QualificationPeriod's current version
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412
    applies_to: POST /direct-selling/commission-runs
    description: §1.2.1 rule 1; evaluated after existence and before any state check

  - priority: 9
    category: concurrency
    check: expected_commission_run_version equals the addressed CommissionRun's current version
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412
    applies_to: POST /direct-selling/income-disclosure-statements
    description: §1.2.1 rule 2

  - priority: 10
    category: business_referential
    check: starter_kit_product_id references a Product whose is_starter_kit is true
    error_id: ERR_STARTER_KIT_INVALID
    http_status: 422
    applies_to: POST /direct-selling/enrollment-applications
    description: an ordinary catalog item may not be enrolled as a starter kit

  - priority: 11
    category: business_referential
    check: no order line references a Product whose is_starter_kit is true
    error_id: ERR_PRODUCT_NOT_ORDERABLE
    http_status: 422
    applies_to: POST /direct-selling/product-orders
    description: starter kits are sold only through the enrollment flow

  - priority: 12
    category: business_referential
    check: "sponsor_consultant_id, when supplied, references a Consultant whose status is ACTIVE or PROBATION"
    error_id: ERR_SPONSOR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /direct-selling/enrollment-applications, POST /direct-selling/enrollment-applications/{application_id}/approve"
    description: |
      A SUSPENDED, INACTIVE or TERMINATED consultant may not sponsor. Re-checked at
      approval because the sponsor's status can change while the application sits in
      DRAFT. PRIORITY PAIR: this business_referential rule outranks the
      business_constraint duplicate-email rule at priority 16, so an application that
      both reuses an open email AND names an ineligible sponsor returns
      ERR_SPONSOR_NOT_ELIGIBLE.

  - priority: 13
    category: business_referential
    check: sponsor_consultant_id may be omitted or null only when X-Role is PlatformAdmin
    error_id: ERR_ROOT_ENROLLMENT_FORBIDDEN
    http_status: 403
    applies_to: POST /direct-selling/enrollment-applications
    description: only an administrator may create a genealogy root

  - priority: 14
    category: state
    check: the addressed EnrollmentApplication's status is not APPROVED, REJECTED or WITHDRAWN
    error_id: ERR_APPLICATION_TERMINAL
    http_status: 409
    applies_to: "POST /direct-selling/enrollment-applications/{application_id}/accept-agreement, .../identity-submission, .../identity-decision, .../pay-starter-kit, .../withdraw, .../approve"
    description: terminal applications are frozen

  - priority: 15
    category: state
    check: the addressed EnrollmentApplication's status is DRAFT
    error_id: ERR_APPLICATION_NOT_DRAFT
    http_status: 409
    applies_to: "POST /direct-selling/enrollment-applications/{application_id}/accept-agreement, .../identity-submission, .../identity-decision, .../pay-starter-kit"
    description: dimension writes are refused once the application has rolled up to READY_FOR_APPROVAL

  - priority: 16
    category: business_constraint
    check: no other EnrollmentApplication with the same applicant_email has status DRAFT, READY_FOR_APPROVAL or APPROVED
    error_id: ERR_DUPLICATE_APPLICATION_EMAIL
    http_status: 409
    applies_to: POST /direct-selling/enrollment-applications
    description: PRIORITY PAIR partner of priority 12 (business_referential beats business_constraint)

  - priority: 17
    category: business_constraint
    check: plan_code, sku, state_code and (compensation_plan_id, period_code) are unique
    error_id: "ERR_DUPLICATE_PLAN_CODE | ERR_DUPLICATE_SKU | ERR_DUPLICATE_JURISDICTION | ERR_DUPLICATE_PERIOD_CODE"
    http_status: 409
    applies_to: "POST /direct-selling/compensation-plans, POST /direct-selling/products, POST /direct-selling/tax-jurisdictions, POST /direct-selling/qualification-periods"
    description: configuration uniqueness

  - priority: 18
    category: state
    check: agreement_status is NOT_ACCEPTED
    error_id: ERR_AGREEMENT_ALREADY_ACCEPTED
    http_status: 409
    applies_to: POST /direct-selling/enrollment-applications/{application_id}/accept-agreement
    description: acceptance is not idempotent

  - priority: 19
    category: business_constraint
    check: the submitted agreement_version equals the application's agreement_version
    error_id: ERR_AGREEMENT_VERSION_MISMATCH
    http_status: 422
    applies_to: POST /direct-selling/enrollment-applications/{application_id}/accept-agreement
    description: the applicant must accept the exact text they were shown

  - priority: 20
    category: state
    check: identity_status is UNVERIFIED or FAILED
    error_id: ERR_IDENTITY_NOT_RESUBMITTABLE
    http_status: 409
    applies_to: POST /direct-selling/enrollment-applications/{application_id}/identity-submission
    description: a submission already under review, or already verified, may not be replaced

  - priority: 21
    category: business_constraint
    check: identity_attempt_count is strictly below plan.max_identity_attempts
    error_id: ERR_IDENTITY_ATTEMPTS_EXHAUSTED
    http_status: 422
    applies_to: POST /direct-selling/enrollment-applications/{application_id}/identity-submission
    description: the applicant gets max_identity_attempts submissions, no more

  - priority: 22
    category: state
    check: identity_status is PENDING_REVIEW
    error_id: ERR_IDENTITY_NOT_PENDING
    http_status: 409
    applies_to: POST /direct-selling/enrollment-applications/{application_id}/identity-decision
    description: nothing to decide

  - priority: 23
    category: state
    check: agreement_status is ACCEPTED and kit_status is UNPAID
    error_id: "ERR_AGREEMENT_REQUIRED | ERR_KIT_ALREADY_PAID"
    http_status: 409
    applies_to: POST /direct-selling/enrollment-applications/{application_id}/pay-starter-kit
    description: |
      ERR_AGREEMENT_REQUIRED when the agreement has not been accepted (an applicant
      may not be charged before signing); ERR_KIT_ALREADY_PAID when the kit is
      already paid. The agreement test is evaluated first.

  - priority: 24
    category: business_fiscal
    check: the submitted amount_cents equals kit_total_cents
    error_id: ERR_KIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: POST /direct-selling/enrollment-applications/{application_id}/pay-starter-kit
    description: exact-amount payment, including the facilitator sales tax

  - priority: 25
    category: state
    check: kit_status is UNPAID
    error_id: ERR_KIT_PAID_NOT_WITHDRAWABLE
    http_status: 409
    applies_to: POST /direct-selling/enrollment-applications/{application_id}/withdraw
    description: once the kit is paid the applicant must enroll and use the buyback route

  - priority: 26
    category: state
    check: status is READY_FOR_APPROVAL
    error_id: ERR_ENROLLMENT_INCOMPLETE
    http_status: 409
    applies_to: POST /direct-selling/enrollment-applications/{application_id}/approve
    description: all three of agreement, identity and kit payment must be complete

  - priority: 27
    category: state
    check: |
      on the two order endpoints the acting consultant's status is ACTIVE or
      PROBATION; on POST /direct-selling/buyback-requests the status is ACTIVE,
      PROBATION or TERMINATED (a terminated consultant keeps the statutory right
      to sell inventory back), and SUSPENDED is rejected everywhere
    error_id: ERR_CONSULTANT_NOT_ORDER_ELIGIBLE
    http_status: 409
    applies_to: "POST /direct-selling/product-orders, POST /direct-selling/product-orders/{order_id}/pay, POST /direct-selling/buyback-requests"
    description: |
      SUSPENDED, INACTIVE and TERMINATED consultants may not place or pay orders;
      for POST /direct-selling/buyback-requests only SUSPENDED is refused, because a
      TERMINATED consultant retains the statutory right to return inventory.
      PRIORITY PAIR: this state rule outranks the business_fiscal
      inventory-loading rule at priority 33, so a SUSPENDED consultant who is also
      in breach of the seventy percent rule receives
      ERR_CONSULTANT_NOT_ORDER_ELIGIBLE, never ERR_INVENTORY_LOADING_VIOLATION.

  - priority: 28
    category: state
    check: the QualificationPeriod named by posted_period_code has status OPEN or REOPENED
    error_id: ERR_PERIOD_NOT_ACCEPTING_VOLUME
    http_status: 409
    applies_to: "POST /direct-selling/product-orders, POST /direct-selling/product-orders/{order_id}/pay, POST /direct-selling/period-qualifications/{period_qualification_id}/personal-use-attestation"
    description: a LOCKED or CLOSED period accepts no new volume and no new attestation

  - priority: 29
    category: business_temporal
    check: "the logical clock falls inside the half-open interval [period_start, period_end) of the period named by posted_period_code"
    error_id: ERR_PERIOD_CODE_MISMATCH
    http_status: 422
    applies_to: POST /direct-selling/product-orders
    description: volume may not be posted to a period the order was not placed in

  - priority: 30
    category: business_temporal
    check: period_end is strictly after period_start
    error_id: ERR_PERIOD_BOUNDS_INVALID
    http_status: 422
    applies_to: POST /direct-selling/qualification-periods
    description: empty and inverted periods are refused

  - priority: 31
    category: business_temporal
    check: "the half-open interval [period_start, period_end) does not intersect any existing period of the same plan"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: POST /direct-selling/qualification-periods
    description: |
      Periods tile the timeline. Adjacency is legal: a new period whose
      period_start equals an existing period's period_end does NOT overlap.

  - priority: 32
    category: business_fiscal
    check: the submitted amount_cents equals total_due_cents
    error_id: ERR_ORDER_AMOUNT_MISMATCH
    http_status: 422
    applies_to: POST /direct-selling/product-orders/{order_id}/pay
    description: exact-amount payment including per-line tax and shipping

  - priority: 33
    category: business_fiscal
    check: "when order_type is PERSONAL_INVENTORY, the consultant's most recent CLOSED-period sell_through_bp is at or above plan.seventy_rule_bp"
    error_id: ERR_INVENTORY_LOADING_VIOLATION
    http_status: 422
    applies_to: POST /direct-selling/product-orders
    description: PRIORITY PAIR partner of priority 27 (state beats business_fiscal)

  - priority: 34
    category: state
    check: payment_status is PENDING
    error_id: ERR_ORDER_ALREADY_PAID
    http_status: 409
    applies_to: POST /direct-selling/product-orders/{order_id}/pay
    description: payment is not idempotent

  - priority: 35
    category: state
    check: "the fulfillment event is legal from the current fulfillment_status: SHIP requires NEW and payment_status PAID, DELIVER requires SHIPPED"
    error_id: ERR_FULFILLMENT_SEQUENCE_INVALID
    http_status: 409
    applies_to: POST /direct-selling/product-orders/{order_id}/fulfillment
    description: the fulfillment dimension is linear and gated on payment

  - priority: 36
    category: business_constraint
    check: attested_personal_use_points does not exceed the row's inventory_volume_points
    error_id: ERR_ATTESTATION_EXCEEDS_INVENTORY
    http_status: 422
    applies_to: POST /direct-selling/period-qualifications/{period_qualification_id}/personal-use-attestation
    description: a consultant cannot attest to consuming more than they purchased

  - priority: 37
    category: state
    check: "the period's status permits the requested lifecycle move: lock requires OPEN or REOPENED, close requires LOCKED, reopen requires CLOSED"
    error_id: "ERR_PERIOD_NOT_OPEN | ERR_PERIOD_NOT_LOCKED | ERR_PERIOD_NOT_CLOSED"
    http_status: 409
    applies_to: "POST /direct-selling/qualification-periods/{period_id}/lock, .../close, .../reopen"
    description: one error id per lifecycle endpoint

  - priority: 38
    category: business_safety
    check: no CommissionRun of the period is in status DRAFT, CALCULATED, APPROVED or PAID
    error_id: ERR_ACTIVE_RUN_BLOCKS_REOPEN
    http_status: 409
    applies_to: POST /direct-selling/qualification-periods/{period_id}/reopen
    description: a paid period must be reversed before its volume can be corrected

  - priority: 39
    category: state
    check: the referenced QualificationPeriod's status is CLOSED
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 409
    applies_to: POST /direct-selling/commission-runs
    description: commissions are only calculated on closed volume

  - priority: 40
    category: business_constraint
    check: no other CommissionRun of the same period is in status DRAFT, CALCULATED, APPROVED or PAID
    error_id: ERR_RUN_ALREADY_EXISTS
    http_status: 409
    applies_to: POST /direct-selling/commission-runs
    description: at most one live run per period; a REVERSED run permits a fresh one

  - priority: 41
    category: state
    check: "the run's status permits the requested move: calculate requires DRAFT, approval-decision requires CALCULATED, pay requires APPROVED, reverse requires PAID"
    error_id: "ERR_RUN_NOT_DRAFT | ERR_RUN_NOT_CALCULATED | ERR_RUN_NOT_APPROVED | ERR_RUN_NOT_PAID"
    http_status: 409
    applies_to: "POST /direct-selling/commission-runs/{run_id}/calculate, .../approval-decision, .../pay, .../reverse"
    description: one error id per lifecycle endpoint

  - priority: 42
    category: business_safety
    check: |
      the caller's X-User-ID differs from the user who performed the preceding step:
      on approval-decision from CommissionRun.calculated_by_user_id, on legal-decision
      from IncomeDisclosureStatement.submitted_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /direct-selling/commission-runs/{run_id}/approval-decision, POST /direct-selling/income-disclosure-statements/{statement_id}/legal-decision"
    description: the preparer of a figure may never be its approver or publisher

  - priority: 43
    category: business_safety
    check: no consultant holding an ACTIVE statement of the run has status SUSPENDED
    error_id: ERR_SUSPENDED_EARNER_BLOCKS_APPROVAL
    http_status: 409
    applies_to: POST /direct-selling/commission-runs/{run_id}/approval-decision
    description: only checked for decision APPROVE; a REJECT decision is always permitted

  - priority: 44
    category: state
    check: "the case's status permits the requested move: review requires OPEN or APPEALED, decision requires UNDER_REVIEW, appeal requires SANCTIONED"
    error_id: "ERR_CASE_NOT_REVIEWABLE | ERR_CASE_NOT_UNDER_REVIEW | ERR_CASE_NOT_SANCTIONED"
    http_status: 409
    applies_to: "POST /direct-selling/compliance-cases/{case_id}/review, .../decision, .../appeal"
    description: one error id per lifecycle endpoint

  - priority: 45
    category: business_constraint
    check: "for decision SANCTION, sanction_level, effective_from and effective_until are all supplied"
    error_id: ERR_SANCTION_FIELDS_REQUIRED
    http_status: 422
    applies_to: POST /direct-selling/compliance-cases/{case_id}/decision
    description: conditionally required fields, refused only for the SANCTION branch

  - priority: 46
    category: business_safety
    check: "the requested sanction_order is strictly greater than the consultant's highest_sanction_order"
    error_id: ERR_DISCIPLINARY_ESCALATION_REQUIRED
    http_status: 422
    applies_to: POST /direct-selling/compliance-cases/{case_id}/decision
    description: |
      The disciplinary ladder WARNING < PROBATION < SUSPENSION < TERMINATION may
      neither repeat a level nor step down. PRIORITY PAIR: this business_safety rule
      outranks the business_temporal window rule at priority 48, so a decision that
      both repeats a level AND collides with an existing window returns
      ERR_DISCIPLINARY_ESCALATION_REQUIRED.

  - priority: 47
    category: business_temporal
    check: effective_until is strictly after effective_from
    error_id: ERR_SANCTION_WINDOW_INVALID
    http_status: 422
    applies_to: POST /direct-selling/compliance-cases/{case_id}/decision
    description: inverted and empty sanction windows are refused

  - priority: 48
    category: business_temporal
    check: |
      the closed interval [effective_from, effective_until] neither intersects any
      other SANCTIONED case window of the same consultant nor begins within
      plan.sanction_cooloff_days after such a window's effective_until
    error_id: ERR_SANCTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: POST /direct-selling/compliance-cases/{case_id}/decision
    description: PRIORITY PAIR partner of priority 46 (business_safety beats business_temporal)

  - priority: 49
    category: business_temporal
    check: the logical clock is at or before appeal_deadline_at
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: POST /direct-selling/compliance-cases/{case_id}/appeal
    description: the appeal window closes plan.appeal_window_days after effective_from

  - priority: 50
    category: business_constraint
    check: appeal_count is 0
    error_id: ERR_APPEAL_ALREADY_FILED
    http_status: 409
    applies_to: POST /direct-selling/compliance-cases/{case_id}/appeal
    description: one appeal per case

  - priority: 51
    category: state
    check: the consultant's status is not TERMINATED
    error_id: ERR_CONSULTANT_ALREADY_TERMINATED
    http_status: 409
    applies_to: "POST /direct-selling/consultants/{consultant_id}/terminate, POST /direct-selling/compliance-cases"
    description: a terminated consultant cannot be terminated again nor made the subject of a new case

  - priority: 52
    category: business_safety
    check: no CommissionRun in status APPROVED covers a period in which this consultant holds an ACTIVE statement
    error_id: ERR_APPROVED_RUN_BLOCKS_TERMINATION
    http_status: 409
    applies_to: "POST /direct-selling/consultants/{consultant_id}/terminate, POST /direct-selling/compliance-cases/{case_id}/decision"
    description: an approved-but-unpaid run must be settled before the earner's genealogy is rewritten

  - priority: 53
    category: state
    check: the consultant's status is TERMINATED
    error_id: ERR_CONSULTANT_NOT_TERMINATED
    http_status: 409
    applies_to: POST /direct-selling/consultants/{consultant_id}/reinstate
    description: only terminated consultants can be reinstated

  - priority: 54
    category: business_temporal
    check: the logical clock is at or before terminated_at plus plan.reinstatement_window_days
    error_id: ERR_REINSTATEMENT_WINDOW_EXPIRED
    http_status: 422
    applies_to: POST /direct-selling/consultants/{consultant_id}/reinstate
    description: after the window the consultant must re-enroll from scratch

  - priority: 55
    category: business_fiscal
    check: clawback_balance_cents is 0
    error_id: ERR_CLAWBACK_OUTSTANDING
    http_status: 422
    applies_to: POST /direct-selling/consultants/{consultant_id}/reinstate
    description: outstanding receivables must be settled before reinstatement

  - priority: 56
    category: business_safety
    check: no ComplianceCase of the consultant is in status OPEN, UNDER_REVIEW or APPEALED
    error_id: ERR_OPEN_CASE_BLOCKS_REINSTATEMENT
    http_status: 409
    applies_to: POST /direct-selling/consultants/{consultant_id}/reinstate
    description: unresolved discipline blocks reinstatement

  - priority: 57
    category: state
    check: the consultant's status is not SUSPENDED and not TERMINATED
    error_id: ERR_CONSULTANT_NOT_ADJUSTABLE
    http_status: 409
    applies_to: POST /direct-selling/consultants/{consultant_id}/rank-adjustment
    description: ranks are not adjusted while a consultant is suspended or terminated

  - priority: 58
    category: business_constraint
    check: the submitted rank_code exists in the consultant's plan rank_ladder
    error_id: ERR_RANK_CODE_UNKNOWN
    http_status: 422
    applies_to: POST /direct-selling/consultants/{consultant_id}/rank-adjustment
    description: ranks are plan-scoped

  - priority: 59
    category: business_referential
    check: |
      every buyback line references a ProductOrder of the same consultant whose
      order_type is PERSONAL_INVENTORY and whose payment_status is PAID or
      REFUNDED_PARTIAL, and whose lines contain the referenced product_id
    error_id: ERR_BUYBACK_LINE_INVALID
    http_status: 422
    applies_to: POST /direct-selling/buyback-requests
    description: only the consultant's own paid inventory purchases may be returned

  - priority: 60
    category: business_referential
    check: every referenced Product has buyback_eligible true
    error_id: ERR_PRODUCT_NOT_BUYBACK_ELIGIBLE
    http_status: 422
    applies_to: POST /direct-selling/buyback-requests
    description: consumables and literature are excluded from the buyback obligation

  - priority: 61
    category: business_temporal
    check: every referenced order's placed_at is at most plan.buyback_window_days before the logical clock
    error_id: ERR_BUYBACK_WINDOW_EXPIRED
    http_status: 422
    applies_to: POST /direct-selling/buyback-requests
    description: the statutory buyback obligation lapses after the window

  - priority: 62
    category: business_constraint
    check: "for every line, quantity is at or below (order line quantity - returned_quantity), and condition is RESALABLE"
    error_id: "ERR_BUYBACK_QUANTITY_EXCEEDED | ERR_BUYBACK_CONDITION_INVALID"
    http_status: 422
    applies_to: POST /direct-selling/buyback-requests
    description: the quantity test is evaluated before the condition test, line by line in submitted order

  - priority: 63
    category: state
    check: "the buyback's status permits the requested move: decision requires REQUESTED, refund requires APPROVED"
    error_id: "ERR_BUYBACK_NOT_REQUESTED | ERR_BUYBACK_NOT_APPROVED"
    http_status: 409
    applies_to: "POST /direct-selling/buyback-requests/{buyback_id}/decision, .../refund"
    description: one error id per lifecycle endpoint

  - priority: 64
    category: business_constraint
    check: "for decision DENY a decision_reason is supplied"
    error_id: ERR_DECISION_REASON_REQUIRED
    http_status: 422
    applies_to: POST /direct-selling/buyback-requests/{buyback_id}/decision
    description: denials must be justified in writing; approvals need no reason

  - priority: 65
    category: state
    check: the referenced CommissionRun's status is PAID
    error_id: ERR_RUN_NOT_PAID
    http_status: 409
    applies_to: "POST /direct-selling/income-disclosure-statements, POST /direct-selling/income-disclosure-statements/{statement_id}/legal-decision"
    description: only a paid run may be disclosed, and it must still be PAID at publication time

  - priority: 66
    category: business_constraint
    check: the population selected by population_basis is non-empty
    error_id: ERR_DISCLOSURE_POPULATION_EMPTY
    http_status: 422
    applies_to: POST /direct-selling/income-disclosure-statements
    description: PAID_ONLY can select nothing when every statement was carried forward

  - priority: 67
    category: state
    check: "the disclosure's status permits the requested move: submit-legal-review requires DRAFT, legal-decision requires LEGAL_REVIEW"
    error_id: "ERR_DISCLOSURE_NOT_DRAFT | ERR_DISCLOSURE_NOT_IN_REVIEW"
    http_status: 409
    applies_to: "POST /direct-selling/income-disclosure-statements/{statement_id}/submit-legal-review, .../legal-decision"
    description: one error id per lifecycle endpoint

  - priority: 68
    category: business_constraint
    check: "for decision REQUEST_REVISION a revision_note is supplied"
    error_id: ERR_REVISION_NOTE_REQUIRED
    http_status: 422
    applies_to: POST /direct-selling/income-disclosure-statements/{statement_id}/legal-decision
    description: the analyst must be told what to change

  - priority: 69
    category: business_constraint
    check: at least one mutable plan field is present in the request body
    error_id: ERR_NO_MUTABLE_FIELDS
    http_status: 422
    applies_to: PATCH /direct-selling/compensation-plans/{plan_id}
    description: an empty patch is refused rather than silently accepted

# =============================================================================
# §1.5 API Endpoint Table
#
# Conventions:
#   * `input` lists request-body fields for writes and query parameters for
#     reads; a trailing `?` marks the field optional.
#   * Every list endpoint accepts `limit?` and `offset?` and returns the
#     pagination fields from §1.0. Default ordering for every list is created_at
#     ascending; where two rows of the same list can share a created_at the
#     tie-break is stated in the endpoint description.
#   * Roles are the §1.7 role names. Row-level ownership for Consultant and
#     Applicant callers is enforced by §1.4 priority 3, not by the role list.
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- test clock
  - method: GET
    path: /direct-selling/_clock
    description: Returns the logical clock every temporal rule reads.
    roles: [Applicant, Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: []
    code: 200
    output: { current_utc: datetime }
    side_effects: []

  - method: POST
    path: /direct-selling/_clock/set_current_utc
    description: |
      Test-driving endpoint (§1.5 ladder step 3). Sets the logical clock so that
      period boundaries, buyback windows, appeal windows, sanction cooling-off
      periods and the reinstatement window are reachable without waiting. Default
      value before any call is 2026-08-01T00:00:00Z. Setting the clock never
      triggers any business transition by itself; every temporal rule reads the
      clock at the moment its own endpoint is called.
    roles: [PlatformAdmin]
    input: [current_utc]
    code: 200
    output: { current_utc: datetime }
    side_effects: []

  # ------------------------------------------------------------ configuration
  - method: POST
    path: /direct-selling/compensation-plans
    description: Creates a compensation plan. Every numeric policy field has a default, so a minimal call creates the canonical plan.
    roles: [PlatformAdmin]
    input: [plan_code, name, "compression_mode?", "point_value_cents?", "payline_min_pv_points?", "pv_bonus_min_points?", "active_leg_min_points?", "pv_bonus_bands?", "pv_bonus_cap_cents?", "senior_rank_bump_bp?", "probation_keep_bp?", "withhold_tier_threshold_cents?", "withhold_low_bp?", "withhold_high_bp?", "min_payout_cents?", "consecutive_qualifying_periods?", "maintenance_grace_periods?", "seventy_rule_bp?", "buyback_rate_bp?", "buyback_window_days?", "restock_free_limit_cents?", "restock_fee_bp?", "sanction_cooloff_days?", "appeal_window_days?", "reinstatement_window_days?", "max_identity_attempts?", "free_shipping_threshold_cents?", "flat_shipping_cents?", "rank_ladder?"]
    code: 201
    output: CompensationPlan
    side_effects: [consultant_count initialized to 0]

  - method: PATCH
    path: /direct-selling/compensation-plans/{plan_id}
    description: |
      Updates mutable plan policy. Changing compression_mode affects only runs
      calculated afterwards; an already-CALCULATED run keeps its
      compression_mode_snapshot until it is recalculated.
    roles: [PlatformAdmin]
    input: ["compression_mode?", "payline_min_pv_points?", "min_payout_cents?", "seventy_rule_bp?", "restock_free_limit_cents?", "restock_fee_bp?", "probation_keep_bp?", "withhold_tier_threshold_cents?", "pv_bonus_cap_cents?", "sanction_cooloff_days?", "appeal_window_days?", "reinstatement_window_days?"]
    code: 200
    output: CompensationPlan
    side_effects: [version incremented]

  - method: GET
    path: /direct-selling/compensation-plans
    description: Lists compensation plans.
    roles: [Applicant, Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: ["plan_code?", "compression_mode?", "limit?", "offset?"]
    code: 200
    output: CompensationPlan[]
    side_effects: []

  - method: GET
    path: /direct-selling/compensation-plans/{plan_id}
    description: Reads one compensation plan.
    roles: [Applicant, Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: []
    code: 200
    output: CompensationPlan
    side_effects: []

  - method: POST
    path: /direct-selling/tax-jurisdictions
    description: Registers a state's sales-tax treatment. tax_basis_mode and remitter are derived from facilitator_agreement_active.
    roles: [PlatformAdmin]
    input: [state_code, tax_rate_bp, facilitator_agreement_active]
    code: 201
    output: TaxJurisdiction
    side_effects: [tax_basis_mode and remitter derived]

  - method: GET
    path: /direct-selling/tax-jurisdictions
    description: Lists tax jurisdictions.
    roles: [Applicant, Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: ["state_code?", "facilitator_agreement_active?", "limit?", "offset?"]
    code: 200
    output: TaxJurisdiction[]
    side_effects: []

  - method: GET
    path: /direct-selling/tax-jurisdictions/{jurisdiction_id}
    description: Reads one tax jurisdiction. The row is immutable, so there is no update endpoint and no version field.
    roles: [Applicant, Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: []
    code: 200
    output: TaxJurisdiction
    side_effects: []

  - method: POST
    path: /direct-selling/products
    description: Adds a catalog product.
    roles: [PlatformAdmin]
    input: [sku, name, wholesale_price_cents, srp_cents, "volume_points_per_unit?", "commissionable?", "buyback_eligible?", "is_starter_kit?"]
    code: 201
    output: Product
    side_effects: []

  - method: GET
    path: /direct-selling/products
    description: Lists catalog products.
    roles: [Applicant, Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: ["sku?", "is_starter_kit?", "buyback_eligible?", "limit?", "offset?"]
    code: 200
    output: Product[]
    side_effects: []

  - method: GET
    path: /direct-selling/products/{product_id}
    description: Reads one catalog product.
    roles: [Applicant, Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: []
    code: 200
    output: Product
    side_effects: []

  # -------------------------------------------------------------- enrollment
  - method: POST
    path: /direct-selling/enrollment-applications
    description: |
      Opens an enrollment application in DRAFT. Supplying
      identity_document_reference here starts the identity dimension at
      PENDING_REVIEW with one attempt consumed; omitting it leaves the dimension
      at UNVERIFIED. Omitting sponsor_consultant_id enrolls a genealogy root and
      is permitted only for PlatformAdmin.
    roles: [Applicant, PlatformAdmin]
    input: [applicant_email, applicant_full_name, applicant_state_code, compensation_plan_id, starter_kit_product_id, "sponsor_consultant_id?", "agreement_version?", "identity_document_reference?"]
    code: 201
    output: EnrollmentApplication
    side_effects:
      - calculations.starter_kit_charge computes kit_charge_cents, kit_tax_cents, kit_total_cents
      - identity_status and identity_attempt_count seeded from identity_document_reference

  - method: GET
    path: /direct-selling/enrollment-applications
    description: |
      Lists enrollment applications. Filterable by every reference the entity
      carries, which is how a sponsor's pending applications and an approved
      application's minted consultant are both reachable.
    roles: [Applicant, ComplianceOfficer, PlatformAdmin]
    input: ["sponsor_consultant_id?", "compensation_plan_id?", "starter_kit_product_id?", "created_consultant_id?", "applicant_email?", "status?", "identity_status?", "limit?", "offset?"]
    code: 200
    output: EnrollmentApplication[]
    side_effects: []

  - method: GET
    path: /direct-selling/enrollment-applications/{application_id}
    description: Reads one enrollment application including all three status dimensions.
    roles: [Applicant, ComplianceOfficer, PlatformAdmin]
    input: []
    code: 200
    output: EnrollmentApplication
    side_effects: []

  - method: POST
    path: /direct-selling/enrollment-applications/{application_id}/accept-agreement
    description: |
      Records acceptance of the consultant agreement (agreement dimension). The
      agreement is a personal legal act: only the applicant may accept it, so this
      is the one enrollment action PlatformAdmin cannot perform on the applicant's
      behalf.
    roles: [Applicant]
    input: [agreement_version]
    code: 200
    output: EnrollmentApplication
    side_effects: [agreement_status ACCEPTED, agreement_accepted_at stamped, status re-derived]

  - method: POST
    path: /direct-selling/enrollment-applications/{application_id}/identity-submission
    description: Submits or resubmits identity documents (identity dimension).
    roles: [Applicant, PlatformAdmin]
    input: [identity_document_reference]
    code: 200
    output: EnrollmentApplication
    side_effects: [identity_status PENDING_REVIEW, identity_attempt_count incremented, identity_failure_reason cleared]

  - method: POST
    path: /direct-selling/enrollment-applications/{application_id}/identity-decision
    description: |
      Compliance decision on the submitted identity documents. decision is VERIFY
      or FAIL. A FAIL taken once identity_attempt_count has reached
      plan.max_identity_attempts also drives status to REJECTED.
    roles: [ComplianceOfficer]
    input: [decision, "failure_reason?"]
    code: 200
    output: EnrollmentApplication
    side_effects: [identity_status set, status re-derived, rejection_reason set on exhaustion]

  - method: POST
    path: /direct-selling/enrollment-applications/{application_id}/pay-starter-kit
    description: Pays the starter kit at exactly kit_total_cents (kit dimension). Requires the agreement to be accepted first.
    roles: [Applicant, PlatformAdmin]
    input: [amount_cents, payment_reference]
    code: 200
    output: EnrollmentApplication
    side_effects: [kit_status PAID, kit_payment_reference recorded, status re-derived]

  - method: POST
    path: /direct-selling/enrollment-applications/{application_id}/withdraw
    description: Withdraws an application that has not yet paid for its starter kit.
    roles: [Applicant, PlatformAdmin]
    input: [reason]
    code: 200
    output: EnrollmentApplication
    side_effects: [status WITHDRAWN, rejection_reason recorded]

  - method: POST
    path: /direct-selling/enrollment-applications/{application_id}/approve
    description: Approves a READY_FOR_APPROVAL application and mints the Consultant.
    roles: [ComplianceOfficer]
    input: []
    code: 201
    output: Consultant
    side_effects:
      - Consultant created ACTIVE at the rank_order 1 rung with upline_path and genealogy_depth computed
      - sponsor's direct_downline_count incremented, plan's consultant_count incremented
      - application status APPROVED and created_consultant_id set

  # -------------------------------------------------------------- consultants
  - method: GET
    path: /direct-selling/consultants
    description: |
      Lists consultants. sponsor_consultant_id finds a consultant's direct
      downline; reassigned_from_sponsor_consultant_id finds everyone moved by a
      given termination.
    roles: [Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: ["compensation_plan_id?", "enrollment_application_id?", "sponsor_consultant_id?", "reassigned_from_sponsor_consultant_id?", "status?", "rank_code?", "payout_hold?", "limit?", "offset?"]
    code: 200
    output: Consultant[]
    side_effects: []

  - method: GET
    path: /direct-selling/consultants/{consultant_id}
    description: Reads one consultant including genealogy, rank and ledger fields.
    roles: [Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: []
    code: 200
    output: Consultant
    side_effects: []

  - method: POST
    path: /direct-selling/consultants/{consultant_id}/terminate
    description: Terminates a consultant and reassigns the whole direct downline to the terminated consultant's sponsor.
    roles: [ComplianceOfficer, PlatformAdmin]
    input: [termination_reason]
    code: 200
    output: Consultant
    side_effects:
      - status TERMINATED, terminated_at stamped
      - direct downline reassigned upward with reassigned_from_sponsor_consultant_id and reassignment_count updated
      - upline_path recomputed for the moved subtree, direct_downline_count recomputed on both ends
      - group_volume_points and active_leg_count recomputed on every ancestor's rows in OPEN or REOPENED periods

  - method: POST
    path: /direct-selling/consultants/{consultant_id}/reinstate
    description: Reinstates a terminated consultant inside the reinstatement window, restoring the upline edge but not the downline.
    roles: [ComplianceOfficer]
    input: ["reinstatement_note?"]
    code: 200
    output: Consultant
    side_effects:
      - status ACTIVE, reinstated_at stamped, reinstatement_count incremented
      - sponsor_consultant_id restored from reassigned_from_sponsor_consultant_id or the nearest live ancestor
      - rank_code reset to the rank_order 1 rung with rank_source REINSTATEMENT

  - method: POST
    path: /direct-selling/consultants/{consultant_id}/rank-adjustment
    description: |
      Administrative rank override (§1.5 ladder step 2 — a general business
      endpoint). Recognizes ranks earned on a legacy plan and makes any rung's
      override structure reachable without waiting for
      plan.consecutive_qualifying_periods closed periods.
    roles: [PlatformAdmin]
    input: [rank_code, "adjustment_reason?"]
    code: 200
    output: Consultant
    side_effects: [rank_code and rank_order set, rank_source ADMIN_ADJUSTED, consecutive_qualified_count and grace_periods_used reset]

  # ------------------------------------------------------------------- orders
  - method: POST
    path: /direct-selling/product-orders
    description: |
      Places an order. Prices every line, computes per-line sales tax on the
      jurisdiction's basis, and enforces the anti-inventory-loading rule for
      PERSONAL_INVENTORY orders.
    roles: [Consultant, PlatformAdmin]
    input: [consultant_id, order_type, posted_period_code, ship_to_state_code, lines]
    code: 201
    output: ProductOrder
    side_effects: [calculations.order_financials applied, placed_at stamped]

  - method: GET
    path: /direct-selling/product-orders
    description: Lists orders. Ordering ties inside one consultant and period are broken by ascending merchandise_subtotal_cents.
    roles: [Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, PlatformAdmin]
    input: ["consultant_id?", "order_type?", "posted_period_code?", "payment_status?", "fulfillment_status?", "limit?", "offset?"]
    code: 200
    output: ProductOrder[]
    side_effects: []

  - method: GET
    path: /direct-selling/product-orders/{order_id}
    description: Reads one order including its priced lines.
    roles: [Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, PlatformAdmin]
    input: []
    code: 200
    output: ProductOrder
    side_effects: []

  - method: POST
    path: /direct-selling/product-orders/{order_id}/pay
    description: Pays an order at exactly total_due_cents and posts its volume to the period.
    roles: [Consultant, PlatformAdmin]
    input: [amount_cents, payment_reference]
    code: 200
    output: ProductOrder
    side_effects:
      - payment_status PAID, volume_posted true
      - PeriodQualification row created when absent, then personal, retail and inventory volume increased
      - group_volume_points and active_leg_count recomputed for the consultant and every ancestor

  - method: POST
    path: /direct-selling/product-orders/{order_id}/fulfillment
    description: Advances the fulfillment dimension. event is SHIP or DELIVER.
    roles: [PlatformAdmin]
    input: [event]
    code: 200
    output: ProductOrder
    side_effects: [fulfillment_status advanced]

  # ------------------------------------------------------- qualification cycle
  - method: POST
    path: /direct-selling/qualification-periods
    description: Opens a qualification period on a half-open interval that may touch but not overlap its neighbours.
    roles: [CommissionAnalyst, PlatformAdmin]
    input: [compensation_plan_id, period_code, period_start, period_end]
    code: 201
    output: QualificationPeriod
    side_effects: []

  - method: GET
    path: /direct-selling/qualification-periods
    description: Lists qualification periods, ordered by period_start ascending.
    roles: [Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, PlatformAdmin]
    input: ["compensation_plan_id?", "period_code?", "status?", "limit?", "offset?"]
    code: 200
    output: QualificationPeriod[]
    side_effects: []

  - method: GET
    path: /direct-selling/qualification-periods/{period_id}
    description: Reads one qualification period.
    roles: [Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, PlatformAdmin]
    input: []
    code: 200
    output: QualificationPeriod
    side_effects: []

  - method: POST
    path: /direct-selling/qualification-periods/{period_id}/lock
    description: |
      Freezes the period's volume, materializes a PeriodQualification row for every
      non-terminated consultant of the plan, evaluates qualification and stamps
      sell_through_bp. Also expires any sanction whose window has passed.
    roles: [CommissionAnalyst]
    input: []
    code: 200
    output: QualificationPeriod
    side_effects:
      - missing PeriodQualification rows created
      - calculations.qualification_evaluation and calculations.inventory_loading_ratio applied per row
      - expired SUSPENDED sanctions returned to ACTIVE
      - status LOCKED, locked_at stamped, qualification_count and total_net_personal_volume_points refreshed

  - method: POST
    path: /direct-selling/qualification-periods/{period_id}/close
    description: Closes a locked period and applies rank advancement, maintenance demotion and activity flips.
    roles: [CommissionAnalyst]
    input: []
    code: 200
    output: QualificationPeriod
    side_effects:
      - consecutive_qualified_count, grace_periods_used, rank_code and rank_source updated per consultant
      - ACTIVE and INACTIVE maintenance flips applied
      - status CLOSED, closed_at stamped, correction_pending cleared

  - method: POST
    path: /direct-selling/qualification-periods/{period_id}/reopen
    description: Reopens a closed period so a correction can be absorbed. Refused while any live run exists.
    roles: [PlatformAdmin]
    input: [reason]
    code: 200
    output: QualificationPeriod
    side_effects: [status REOPENED, reopen_count incremented, group volume and active legs recomputed live]

  - method: GET
    path: /direct-selling/period-qualifications
    description: |
      Lists qualification rows. Filtering by consultant_id together with
      qualification_period_id addresses exactly one row.
    roles: [Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, PlatformAdmin]
    input: ["consultant_id?", "qualification_period_id?", "period_code?", "qualified_rank_code?", "limit?", "offset?"]
    code: 200
    output: PeriodQualification[]
    side_effects: []

  - method: GET
    path: /direct-selling/period-qualifications/{period_qualification_id}
    description: Reads one qualification row including group volume, active legs, sell-through and qualified rank.
    roles: [Consultant, ComplianceOfficer, CommissionAnalyst, FinanceController, PlatformAdmin]
    input: []
    code: 200
    output: PeriodQualification
    side_effects: []

  - method: POST
    path: /direct-selling/period-qualifications/{period_qualification_id}/personal-use-attestation
    description: |
      Records the points the consultant attests as personally consumed in the
      period. Counts toward the seventy percent rule alongside retail volume.
    roles: [Consultant, PlatformAdmin]
    input: [attested_personal_use_points]
    code: 200
    output: PeriodQualification
    side_effects: [attested_personal_use_points set, sell_through_bp recomputed at the next lock]

  # ---------------------------------------------------------------- commission
  - method: POST
    path: /direct-selling/commission-runs
    description: Opens a commission run against a CLOSED period under optimistic concurrency control.
    roles: [CommissionAnalyst]
    input: [qualification_period_id, expected_qualification_period_version]
    code: 201
    output: CommissionRun
    side_effects: [period_code denormalized, QualificationPeriod.version incremented]

  - method: GET
    path: /direct-selling/commission-runs
    description: Lists commission runs.
    roles: [Consultant, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: ["qualification_period_id?", "period_code?", "status?", "limit?", "offset?"]
    code: 200
    output: CommissionRun[]
    side_effects: []

  - method: GET
    path: /direct-selling/commission-runs/{run_id}
    description: Reads one commission run including every roll-up total.
    roles: [Consultant, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: []
    code: 200
    output: CommissionRun
    side_effects: []

  - method: POST
    path: /direct-selling/commission-runs/{run_id}/calculate
    description: |
      Computes every statement of the run: retail profit, personal volume bonus and
      multi-level overrides under the plan's current compression_mode, then
      withholding. Recalculation supersedes the previous generation of statements.
    roles: [CommissionAnalyst]
    input: []
    code: 200
    output: CommissionRun
    side_effects:
      - prior ACTIVE statements SUPERSEDED, one ACTIVE statement created per qualification row
      - compression_mode_snapshot taken, calculation_sequence incremented, calculated_by_user_id recorded
      - run totals including forfeited_to_company_cents and distributable_pool_cents refreshed

  - method: POST
    path: /direct-selling/commission-runs/{run_id}/approval-decision
    description: |
      Finance decision on a calculated run. decision is APPROVE or REJECT.
      Segregation of duties: the caller may not be the analyst who calculated it.
    roles: [FinanceController]
    input: [decision, "decision_note?"]
    code: 200
    output: CommissionRun
    side_effects:
      - "APPROVE: status APPROVED, approved_by_user_id recorded, statements PAYABLE"
      - "REJECT: statements SUPERSEDED, totals zeroed, status back to DRAFT"

  - method: POST
    path: /direct-selling/commission-runs/{run_id}/pay
    description: Disburses an approved run, carrying forward statements below the minimum payout and recovering clawback through withholding.
    roles: [FinanceController]
    input: []
    code: 200
    output: CommissionRun
    side_effects:
      - per statement paid_cents or carry_forward_cents set and payout_status PAID or CARRIED_FORWARD
      - consultant lifetime_commission_paid_cents, carry_forward_cents, clawback_balance_cents and payout_hold updated
      - paid_total_cents, carry_forward_total_cents and paid_at set, status PAID

  - method: POST
    path: /direct-selling/commission-runs/{run_id}/reverse
    description: Reverses a paid run, voiding every statement and turning disbursed amounts into clawback receivables.
    roles: [FinanceController]
    input: [reversal_reason]
    code: 200
    output: CommissionRun
    side_effects:
      - statements VOIDED, consultant ledgers compensated, payout_hold raised
      - PUBLISHED disclosures of the run SUPERSEDED with supersede_reason RUN_REVERSED
      - reversed_total_cents and reversed_at set, status REVERSED

  - method: GET
    path: /direct-selling/commission-statements
    description: |
      Lists commission statements. Filtering by commission_run_id together with
      consultant_id addresses exactly one ACTIVE statement per calculation
      generation; ties are broken by calculation_sequence ascending.
    roles: [Consultant, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: ["commission_run_id?", "consultant_id?", "period_code?", "status?", "payout_status?", "paid_as_rank_code?", "limit?", "offset?"]
    code: 200
    output: CommissionStatement[]
    side_effects: []

  - method: GET
    path: /direct-selling/commission-statements/{statement_id}
    description: Reads one statement including the ordered override_breakdown.
    roles: [Consultant, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: []
    code: 200
    output: CommissionStatement
    side_effects: []

  # ------------------------------------------------------------------ buyback
  - method: POST
    path: /direct-selling/buyback-requests
    description: |
      Requests a statutory inventory buyback. Prices the settlement immediately so
      the consultant sees the restocking fee and the pro rata commission clawback
      before the company decides.
    roles: [Consultant, PlatformAdmin]
    input: [consultant_id, lines]
    code: 201
    output: BuybackRequest
    side_effects: [calculations.buyback_refund_settlement applied, volume_reversal_period_code resolved]

  - method: GET
    path: /direct-selling/buyback-requests
    description: Lists buyback requests.
    roles: [Consultant, ComplianceOfficer, FinanceController, PlatformAdmin]
    input: ["consultant_id?", "status?", "volume_reversal_period_code?", "limit?", "offset?"]
    code: 200
    output: BuybackRequest[]
    side_effects: []

  - method: GET
    path: /direct-selling/buyback-requests/{buyback_id}
    description: Reads one buyback request including all five settlement figures.
    roles: [Consultant, ComplianceOfficer, FinanceController, PlatformAdmin]
    input: []
    code: 200
    output: BuybackRequest
    side_effects: []

  - method: POST
    path: /direct-selling/buyback-requests/{buyback_id}/decision
    description: Finance decision on a requested buyback. decision is APPROVE or DENY; DENY requires a reason.
    roles: [FinanceController]
    input: [decision, "decision_reason?"]
    code: 200
    output: BuybackRequest
    side_effects: [status APPROVED or DENIED, decided_by_user_id recorded]

  - method: POST
    path: /direct-selling/buyback-requests/{buyback_id}/refund
    description: |
      Executes an approved buyback: returns the units, reverses the volume, flags
      the affected period and run when the volume has already been paid, and books
      any unrecovered clawback against the consultant.
    roles: [FinanceController]
    input: []
    code: 200
    output: BuybackRequest
    side_effects:
      - order line returned_quantity increased, order payment_status and fulfillment_status re-derived
      - PeriodQualification returned_volume_points and net_personal_volume_points updated
      - group volume and active legs recomputed, or correction_pending and correction_flagged raised for a closed period
      - PUBLISHED disclosures of an affected paid run SUPERSEDED with supersede_reason PERIOD_CORRECTION
      - consultant clawback_balance_cents increased by unrecovered_clawback_cents and payout_hold re-derived

  # --------------------------------------------------------------- compliance
  - method: POST
    path: /direct-selling/compliance-cases
    description: Opens a compliance case over an income or product claim.
    roles: [ComplianceOfficer]
    input: [consultant_id, claim_type, evidence_reference]
    code: 201
    output: ComplianceCase
    side_effects: [consultant open_case_count incremented]

  - method: GET
    path: /direct-selling/compliance-cases
    description: Lists compliance cases.
    roles: [Consultant, ComplianceOfficer, PlatformAdmin]
    input: ["consultant_id?", "status?", "claim_type?", "sanction_level?", "limit?", "offset?"]
    code: 200
    output: ComplianceCase[]
    side_effects: []

  - method: GET
    path: /direct-selling/compliance-cases/{case_id}
    description: Reads one compliance case including its sanction window and appeal deadline.
    roles: [Consultant, ComplianceOfficer, PlatformAdmin]
    input: []
    code: 200
    output: ComplianceCase
    side_effects: []

  - method: POST
    path: /direct-selling/compliance-cases/{case_id}/review
    description: Moves an open or appealed case into review.
    roles: [ComplianceOfficer]
    input: []
    code: 200
    output: ComplianceCase
    side_effects: [reviewed_by_user_id recorded]

  - method: POST
    path: /direct-selling/compliance-cases/{case_id}/decision
    description: |
      Decides a case under review. decision is SANCTION or DISMISS. A SANCTION must
      escalate strictly above every sanction the consultant has ever received and
      must not collide with an existing window or its cooling-off buffer.
    roles: [ComplianceOfficer]
    input: [decision, "sanction_level?", "effective_from?", "effective_until?", "decision_reason?"]
    code: 200
    output: ComplianceCase
    side_effects:
      - sanction window and appeal_deadline_at recorded
      - consultant status, active_sanction_level, active_sanction_until and highest_sanction_order updated
      - "TERMINATION additionally triggers the full downline reassignment cascade"
      - "DISMISS of a probation or suspension restores the consultant to ACTIVE"

  - method: POST
    path: /direct-selling/compliance-cases/{case_id}/appeal
    description: Files the single permitted appeal against a sanction, inside the appeal window. The sanction is not stayed.
    roles: [Consultant]
    input: [appeal_statement]
    code: 200
    output: ComplianceCase
    side_effects: [status APPEALED, appeal_count incremented, consultant open_case_count incremented]

  # ------------------------------------------------------- income disclosure
  - method: POST
    path: /direct-selling/income-disclosure-statements
    description: |
      Drafts an income disclosure statement over a paid run, under optimistic
      concurrency control on the run. population_basis selects the variant of
      calculations.income_disclosure_distribution.
    roles: [CommissionAnalyst]
    input: [commission_run_id, population_basis, expected_commission_run_version]
    code: 201
    output: IncomeDisclosureStatement
    side_effects: [every distribution metric computed, CommissionRun.version incremented]

  - method: GET
    path: /direct-selling/income-disclosure-statements
    description: Lists income disclosure statements. superseded_by_id finds the statement a given publication replaced.
    roles: [Consultant, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: ["commission_run_id?", "superseded_by_id?", "period_code?", "population_basis?", "status?", "limit?", "offset?"]
    code: 200
    output: IncomeDisclosureStatement[]
    side_effects: []

  - method: GET
    path: /direct-selling/income-disclosure-statements/{statement_id}
    description: Reads one income disclosure statement including its distribution buckets.
    roles: [Consultant, CommissionAnalyst, FinanceController, LegalReviewer, PlatformAdmin]
    input: []
    code: 200
    output: IncomeDisclosureStatement
    side_effects: []

  - method: POST
    path: /direct-selling/income-disclosure-statements/{statement_id}/submit-legal-review
    description: Submits a draft disclosure for legal review, recording the submitting analyst for the segregation-of-duties test.
    roles: [CommissionAnalyst]
    input: []
    code: 200
    output: IncomeDisclosureStatement
    side_effects: [status LEGAL_REVIEW, submitted_by_user_id recorded]

  - method: POST
    path: /direct-selling/income-disclosure-statements/{statement_id}/legal-decision
    description: |
      Legal decision on a disclosure under review. decision is PUBLISH or
      REQUEST_REVISION. The publisher may not be the submitting analyst.
    roles: [LegalReviewer]
    input: [decision, "revision_note?"]
    code: 200
    output: IncomeDisclosureStatement
    side_effects:
      - "PUBLISH: published_at and legal_reviewer_user_id set, any earlier PUBLISHED statement of the run SUPERSEDED with supersede_reason NEWER_PUBLICATION"
      - "REQUEST_REVISION: status DRAFT, revision_number incremented, metrics recomputed"

# =============================================================================
# §1.6 Error Code Catalog
# Every id below is reachable from at least one §1.4 rule; the §1.9 corner design
# carries a trigger for each one.
# =============================================================================
errors:

  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: X-User-ID or X-Role header missing or empty
    applies_to: [all]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: the caller's role is not listed in the endpoint's roles
    applies_to: [all]
  - id: ERR_FORBIDDEN_RESOURCE
    http_status: 403
    condition: a Consultant or Applicant caller addresses a resource they do not own
    applies_to: ["all endpoints whose roles include Consultant or Applicant"]
  - id: ERR_VALIDATION
    http_status: 400
    condition: missing required field, wrong type, unknown enum member, out-of-range integer, malformed datetime, array length out of bounds, limit or offset out of bounds
    applies_to: [all]

  - id: ERR_PLAN_NOT_FOUND
    http_status: 404
    condition: compensation plan id in the path or body does not resolve
    applies_to: ["GET /direct-selling/compensation-plans/{plan_id}", "PATCH /direct-selling/compensation-plans/{plan_id}", POST /direct-selling/enrollment-applications, POST /direct-selling/qualification-periods]
  - id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    condition: enrollment application id in the path does not resolve
    applies_to: ["GET /direct-selling/enrollment-applications/{application_id}", "POST /direct-selling/enrollment-applications/{application_id}/accept-agreement", "POST /direct-selling/enrollment-applications/{application_id}/identity-submission", "POST /direct-selling/enrollment-applications/{application_id}/identity-decision", "POST /direct-selling/enrollment-applications/{application_id}/pay-starter-kit", "POST /direct-selling/enrollment-applications/{application_id}/withdraw", "POST /direct-selling/enrollment-applications/{application_id}/approve"]
  - id: ERR_CONSULTANT_NOT_FOUND
    http_status: 404
    condition: consultant id in the path or body does not resolve
    applies_to: ["GET /direct-selling/consultants/{consultant_id}", "POST /direct-selling/consultants/{consultant_id}/terminate", "POST /direct-selling/consultants/{consultant_id}/reinstate", "POST /direct-selling/consultants/{consultant_id}/rank-adjustment", POST /direct-selling/product-orders, POST /direct-selling/buyback-requests, POST /direct-selling/compliance-cases, POST /direct-selling/enrollment-applications]
  - id: ERR_ORDER_NOT_FOUND
    http_status: 404
    condition: product order id in the path or in a buyback line does not resolve
    applies_to: ["GET /direct-selling/product-orders/{order_id}", "POST /direct-selling/product-orders/{order_id}/pay", "POST /direct-selling/product-orders/{order_id}/fulfillment", POST /direct-selling/buyback-requests]
  - id: ERR_PERIOD_NOT_FOUND
    http_status: 404
    condition: qualification period id in the path or body does not resolve
    applies_to: ["GET /direct-selling/qualification-periods/{period_id}", "POST /direct-selling/qualification-periods/{period_id}/lock", "POST /direct-selling/qualification-periods/{period_id}/close", "POST /direct-selling/qualification-periods/{period_id}/reopen", POST /direct-selling/commission-runs]
  - id: ERR_QUALIFICATION_NOT_FOUND
    http_status: 404
    condition: period qualification id in the path does not resolve
    applies_to: ["GET /direct-selling/period-qualifications/{period_qualification_id}", "POST /direct-selling/period-qualifications/{period_qualification_id}/personal-use-attestation"]
  - id: ERR_RUN_NOT_FOUND
    http_status: 404
    condition: commission run id in the path or body does not resolve
    applies_to: ["GET /direct-selling/commission-runs/{run_id}", "POST /direct-selling/commission-runs/{run_id}/calculate", "POST /direct-selling/commission-runs/{run_id}/approval-decision", "POST /direct-selling/commission-runs/{run_id}/pay", "POST /direct-selling/commission-runs/{run_id}/reverse", POST /direct-selling/income-disclosure-statements]
  - id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    condition: commission statement id in the path does not resolve
    applies_to: ["GET /direct-selling/commission-statements/{statement_id}"]
  - id: ERR_BUYBACK_NOT_FOUND
    http_status: 404
    condition: buyback request id in the path does not resolve
    applies_to: ["GET /direct-selling/buyback-requests/{buyback_id}", "POST /direct-selling/buyback-requests/{buyback_id}/decision", "POST /direct-selling/buyback-requests/{buyback_id}/refund"]
  - id: ERR_CASE_NOT_FOUND
    http_status: 404
    condition: compliance case id in the path does not resolve
    applies_to: ["GET /direct-selling/compliance-cases/{case_id}", "POST /direct-selling/compliance-cases/{case_id}/review", "POST /direct-selling/compliance-cases/{case_id}/decision", "POST /direct-selling/compliance-cases/{case_id}/appeal"]
  - id: ERR_DISCLOSURE_NOT_FOUND
    http_status: 404
    condition: income disclosure statement id in the path does not resolve
    applies_to: ["GET /direct-selling/income-disclosure-statements/{statement_id}", "POST /direct-selling/income-disclosure-statements/{statement_id}/submit-legal-review", "POST /direct-selling/income-disclosure-statements/{statement_id}/legal-decision"]
  - id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    condition: product id in the path, body or a nested line does not resolve
    applies_to: ["GET /direct-selling/products/{product_id}", POST /direct-selling/enrollment-applications, POST /direct-selling/product-orders, POST /direct-selling/buyback-requests]
  - id: ERR_JURISDICTION_NOT_FOUND
    http_status: 404
    condition: no TaxJurisdiction exists for the supplied state code
    applies_to: ["GET /direct-selling/tax-jurisdictions/{jurisdiction_id}", POST /direct-selling/enrollment-applications, POST /direct-selling/product-orders]

  - id: ERR_STALE_PERIOD_VERSION
    http_status: 412
    condition: expected_qualification_period_version does not equal the period's current version
    applies_to: [POST /direct-selling/commission-runs]
  - id: ERR_STALE_RUN_VERSION
    http_status: 412
    condition: expected_commission_run_version does not equal the run's current version
    applies_to: [POST /direct-selling/income-disclosure-statements]

  - id: ERR_STARTER_KIT_INVALID
    http_status: 422
    condition: starter_kit_product_id names a product whose is_starter_kit is false
    applies_to: [POST /direct-selling/enrollment-applications]
  - id: ERR_PRODUCT_NOT_ORDERABLE
    http_status: 422
    condition: an order line names a product whose is_starter_kit is true
    applies_to: [POST /direct-selling/product-orders]
  - id: ERR_SPONSOR_NOT_ELIGIBLE
    http_status: 422
    condition: the named sponsor's status is not ACTIVE or PROBATION
    applies_to: [POST /direct-selling/enrollment-applications, "POST /direct-selling/enrollment-applications/{application_id}/approve"]
  - id: ERR_ROOT_ENROLLMENT_FORBIDDEN
    http_status: 403
    condition: sponsor_consultant_id omitted or null by a non-PlatformAdmin caller
    applies_to: [POST /direct-selling/enrollment-applications]
  - id: ERR_APPLICATION_TERMINAL
    http_status: 409
    condition: the application is APPROVED, REJECTED or WITHDRAWN
    applies_to: ["POST /direct-selling/enrollment-applications/{application_id}/accept-agreement", "POST /direct-selling/enrollment-applications/{application_id}/identity-submission", "POST /direct-selling/enrollment-applications/{application_id}/identity-decision", "POST /direct-selling/enrollment-applications/{application_id}/pay-starter-kit", "POST /direct-selling/enrollment-applications/{application_id}/withdraw", "POST /direct-selling/enrollment-applications/{application_id}/approve"]
  - id: ERR_APPLICATION_NOT_DRAFT
    http_status: 409
    condition: a dimension write was attempted while the application is READY_FOR_APPROVAL
    applies_to: ["POST /direct-selling/enrollment-applications/{application_id}/accept-agreement", "POST /direct-selling/enrollment-applications/{application_id}/identity-submission", "POST /direct-selling/enrollment-applications/{application_id}/identity-decision", "POST /direct-selling/enrollment-applications/{application_id}/pay-starter-kit"]
  - id: ERR_DUPLICATE_APPLICATION_EMAIL
    http_status: 409
    condition: another application with the same applicant_email is DRAFT, READY_FOR_APPROVAL or APPROVED
    applies_to: [POST /direct-selling/enrollment-applications]
  - id: ERR_DUPLICATE_PLAN_CODE
    http_status: 409
    condition: plan_code already exists
    applies_to: [POST /direct-selling/compensation-plans]
  - id: ERR_DUPLICATE_SKU
    http_status: 409
    condition: sku already exists
    applies_to: [POST /direct-selling/products]
  - id: ERR_DUPLICATE_JURISDICTION
    http_status: 409
    condition: state_code already exists
    applies_to: [POST /direct-selling/tax-jurisdictions]
  - id: ERR_DUPLICATE_PERIOD_CODE
    http_status: 409
    condition: period_code already exists for the plan
    applies_to: [POST /direct-selling/qualification-periods]
  - id: ERR_AGREEMENT_ALREADY_ACCEPTED
    http_status: 409
    condition: agreement_status is already ACCEPTED
    applies_to: ["POST /direct-selling/enrollment-applications/{application_id}/accept-agreement"]
  - id: ERR_AGREEMENT_VERSION_MISMATCH
    http_status: 422
    condition: the submitted agreement_version differs from the application's agreement_version
    applies_to: ["POST /direct-selling/enrollment-applications/{application_id}/accept-agreement"]
  - id: ERR_IDENTITY_NOT_RESUBMITTABLE
    http_status: 409
    condition: identity_status is PENDING_REVIEW or VERIFIED
    applies_to: ["POST /direct-selling/enrollment-applications/{application_id}/identity-submission"]
  - id: ERR_IDENTITY_ATTEMPTS_EXHAUSTED
    http_status: 422
    condition: identity_attempt_count has already reached plan.max_identity_attempts
    applies_to: ["POST /direct-selling/enrollment-applications/{application_id}/identity-submission"]
  - id: ERR_IDENTITY_NOT_PENDING
    http_status: 409
    condition: identity_status is not PENDING_REVIEW
    applies_to: ["POST /direct-selling/enrollment-applications/{application_id}/identity-decision"]
  - id: ERR_AGREEMENT_REQUIRED
    http_status: 409
    condition: the starter kit payment was attempted before the agreement was accepted
    applies_to: ["POST /direct-selling/enrollment-applications/{application_id}/pay-starter-kit"]
  - id: ERR_KIT_ALREADY_PAID
    http_status: 409
    condition: kit_status is already PAID
    applies_to: ["POST /direct-selling/enrollment-applications/{application_id}/pay-starter-kit"]
  - id: ERR_KIT_AMOUNT_MISMATCH
    http_status: 422
    condition: amount_cents does not equal kit_total_cents
    applies_to: ["POST /direct-selling/enrollment-applications/{application_id}/pay-starter-kit"]
  - id: ERR_KIT_PAID_NOT_WITHDRAWABLE
    http_status: 409
    condition: withdrawal attempted after the starter kit was paid
    applies_to: ["POST /direct-selling/enrollment-applications/{application_id}/withdraw"]
  - id: ERR_ENROLLMENT_INCOMPLETE
    http_status: 409
    condition: approval attempted while status is DRAFT (agreement, identity or kit payment incomplete)
    applies_to: ["POST /direct-selling/enrollment-applications/{application_id}/approve"]

  - id: ERR_CONSULTANT_NOT_ORDER_ELIGIBLE
    http_status: 409
    condition: the consultant's status forbids the operation (SUSPENDED, INACTIVE or TERMINATED for orders; SUSPENDED for buybacks)
    applies_to: [POST /direct-selling/product-orders, "POST /direct-selling/product-orders/{order_id}/pay", POST /direct-selling/buyback-requests]
  - id: ERR_PERIOD_NOT_ACCEPTING_VOLUME
    http_status: 409
    condition: the target period's status is LOCKED or CLOSED
    applies_to: [POST /direct-selling/product-orders, "POST /direct-selling/product-orders/{order_id}/pay", "POST /direct-selling/period-qualifications/{period_qualification_id}/personal-use-attestation"]
  - id: ERR_PERIOD_CODE_MISMATCH
    http_status: 422
    condition: the logical clock falls outside the interval of the period named by posted_period_code
    applies_to: [POST /direct-selling/product-orders]
  - id: ERR_PERIOD_BOUNDS_INVALID
    http_status: 422
    condition: period_end is not strictly after period_start
    applies_to: [POST /direct-selling/qualification-periods]
  - id: ERR_PERIOD_OVERLAP
    http_status: 409
    condition: the new period's half-open interval intersects an existing period of the same plan
    applies_to: [POST /direct-selling/qualification-periods]
  - id: ERR_ORDER_AMOUNT_MISMATCH
    http_status: 422
    condition: amount_cents does not equal total_due_cents
    applies_to: ["POST /direct-selling/product-orders/{order_id}/pay"]
  - id: ERR_INVENTORY_LOADING_VIOLATION
    http_status: 422
    condition: a PERSONAL_INVENTORY order was placed while the last closed period's sell_through_bp is below plan.seventy_rule_bp
    applies_to: [POST /direct-selling/product-orders]
  - id: ERR_ORDER_ALREADY_PAID
    http_status: 409
    condition: payment_status is not PENDING
    applies_to: ["POST /direct-selling/product-orders/{order_id}/pay"]
  - id: ERR_FULFILLMENT_SEQUENCE_INVALID
    http_status: 409
    condition: SHIP from a state other than NEW, SHIP on an unpaid order, or DELIVER from a state other than SHIPPED
    applies_to: ["POST /direct-selling/product-orders/{order_id}/fulfillment"]
  - id: ERR_ATTESTATION_EXCEEDS_INVENTORY
    http_status: 422
    condition: attested_personal_use_points exceeds the row's inventory_volume_points
    applies_to: ["POST /direct-selling/period-qualifications/{period_qualification_id}/personal-use-attestation"]

  - id: ERR_PERIOD_NOT_OPEN
    http_status: 409
    condition: lock attempted while the period is LOCKED or CLOSED
    applies_to: ["POST /direct-selling/qualification-periods/{period_id}/lock"]
  - id: ERR_PERIOD_NOT_LOCKED
    http_status: 409
    condition: close attempted while the period is not LOCKED
    applies_to: ["POST /direct-selling/qualification-periods/{period_id}/close"]
  - id: ERR_PERIOD_NOT_CLOSED
    http_status: 409
    condition: reopen attempted on a period that is not CLOSED, or a run opened against a period that is not CLOSED
    applies_to: ["POST /direct-selling/qualification-periods/{period_id}/reopen", POST /direct-selling/commission-runs]
  - id: ERR_ACTIVE_RUN_BLOCKS_REOPEN
    http_status: 409
    condition: reopen attempted while a run of the period is DRAFT, CALCULATED, APPROVED or PAID
    applies_to: ["POST /direct-selling/qualification-periods/{period_id}/reopen"]
  - id: ERR_RUN_ALREADY_EXISTS
    http_status: 409
    condition: another run of the same period is DRAFT, CALCULATED, APPROVED or PAID
    applies_to: [POST /direct-selling/commission-runs]
  - id: ERR_RUN_NOT_DRAFT
    http_status: 409
    condition: calculate attempted while the run is not DRAFT
    applies_to: ["POST /direct-selling/commission-runs/{run_id}/calculate"]
  - id: ERR_RUN_NOT_CALCULATED
    http_status: 409
    condition: an approval decision was taken while the run is not CALCULATED
    applies_to: ["POST /direct-selling/commission-runs/{run_id}/approval-decision"]
  - id: ERR_RUN_NOT_APPROVED
    http_status: 409
    condition: pay attempted while the run is not APPROVED
    applies_to: ["POST /direct-selling/commission-runs/{run_id}/pay"]
  - id: ERR_RUN_NOT_PAID
    http_status: 409
    condition: reverse attempted on a run that is not PAID, or a disclosure drafted or published against a run that is not PAID
    applies_to: ["POST /direct-selling/commission-runs/{run_id}/reverse", POST /direct-selling/income-disclosure-statements, "POST /direct-selling/income-disclosure-statements/{statement_id}/legal-decision"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: the approver equals the calculating analyst, or the publisher equals the submitting analyst
    applies_to: ["POST /direct-selling/commission-runs/{run_id}/approval-decision", "POST /direct-selling/income-disclosure-statements/{statement_id}/legal-decision"]
  - id: ERR_SUSPENDED_EARNER_BLOCKS_APPROVAL
    http_status: 409
    condition: a consultant holding an ACTIVE statement of the run is SUSPENDED
    applies_to: ["POST /direct-selling/commission-runs/{run_id}/approval-decision"]

  - id: ERR_CASE_NOT_REVIEWABLE
    http_status: 409
    condition: review attempted while the case is not OPEN and not APPEALED
    applies_to: ["POST /direct-selling/compliance-cases/{case_id}/review"]
  - id: ERR_CASE_NOT_UNDER_REVIEW
    http_status: 409
    condition: a decision was taken while the case is not UNDER_REVIEW
    applies_to: ["POST /direct-selling/compliance-cases/{case_id}/decision"]
  - id: ERR_CASE_NOT_SANCTIONED
    http_status: 409
    condition: appeal attempted while the case is not SANCTIONED
    applies_to: ["POST /direct-selling/compliance-cases/{case_id}/appeal"]
  - id: ERR_SANCTION_FIELDS_REQUIRED
    http_status: 422
    condition: decision SANCTION without sanction_level, effective_from or effective_until
    applies_to: ["POST /direct-selling/compliance-cases/{case_id}/decision"]
  - id: ERR_DISCIPLINARY_ESCALATION_REQUIRED
    http_status: 422
    condition: the requested sanction_order is not strictly above the consultant's highest_sanction_order
    applies_to: ["POST /direct-selling/compliance-cases/{case_id}/decision"]
  - id: ERR_SANCTION_WINDOW_INVALID
    http_status: 422
    condition: effective_until is not strictly after effective_from
    applies_to: ["POST /direct-selling/compliance-cases/{case_id}/decision"]
  - id: ERR_SANCTION_WINDOW_CONFLICT
    http_status: 409
    condition: the sanction window overlaps another sanctioned window of the consultant or starts inside its cooling-off buffer
    applies_to: ["POST /direct-selling/compliance-cases/{case_id}/decision"]
  - id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    condition: the logical clock is past appeal_deadline_at
    applies_to: ["POST /direct-selling/compliance-cases/{case_id}/appeal"]
  - id: ERR_APPEAL_ALREADY_FILED
    http_status: 409
    condition: appeal_count is already 1
    applies_to: ["POST /direct-selling/compliance-cases/{case_id}/appeal"]

  - id: ERR_CONSULTANT_ALREADY_TERMINATED
    http_status: 409
    condition: the consultant is already TERMINATED
    applies_to: ["POST /direct-selling/consultants/{consultant_id}/terminate", POST /direct-selling/compliance-cases]
  - id: ERR_APPROVED_RUN_BLOCKS_TERMINATION
    http_status: 409
    condition: an APPROVED run covers a period in which the consultant holds an ACTIVE statement
    applies_to: ["POST /direct-selling/consultants/{consultant_id}/terminate", "POST /direct-selling/compliance-cases/{case_id}/decision"]
  - id: ERR_CONSULTANT_NOT_TERMINATED
    http_status: 409
    condition: reinstatement attempted on a consultant who is not TERMINATED
    applies_to: ["POST /direct-selling/consultants/{consultant_id}/reinstate"]
  - id: ERR_REINSTATEMENT_WINDOW_EXPIRED
    http_status: 422
    condition: the logical clock is more than plan.reinstatement_window_days past terminated_at
    applies_to: ["POST /direct-selling/consultants/{consultant_id}/reinstate"]
  - id: ERR_CLAWBACK_OUTSTANDING
    http_status: 422
    condition: clawback_balance_cents is above 0
    applies_to: ["POST /direct-selling/consultants/{consultant_id}/reinstate"]
  - id: ERR_OPEN_CASE_BLOCKS_REINSTATEMENT
    http_status: 409
    condition: a case of the consultant is OPEN, UNDER_REVIEW or APPEALED
    applies_to: ["POST /direct-selling/consultants/{consultant_id}/reinstate"]
  - id: ERR_CONSULTANT_NOT_ADJUSTABLE
    http_status: 409
    condition: rank adjustment attempted on a SUSPENDED or TERMINATED consultant
    applies_to: ["POST /direct-selling/consultants/{consultant_id}/rank-adjustment"]
  - id: ERR_RANK_CODE_UNKNOWN
    http_status: 422
    condition: the submitted rank_code is absent from the plan's rank_ladder
    applies_to: ["POST /direct-selling/consultants/{consultant_id}/rank-adjustment"]

  - id: ERR_BUYBACK_LINE_INVALID
    http_status: 422
    condition: a line references another consultant's order, a non-inventory order, an unpaid order, or a product absent from that order
    applies_to: [POST /direct-selling/buyback-requests]
  - id: ERR_PRODUCT_NOT_BUYBACK_ELIGIBLE
    http_status: 422
    condition: a line references a product whose buyback_eligible is false
    applies_to: [POST /direct-selling/buyback-requests]
  - id: ERR_BUYBACK_WINDOW_EXPIRED
    http_status: 422
    condition: a referenced order was placed more than plan.buyback_window_days before the logical clock
    applies_to: [POST /direct-selling/buyback-requests]
  - id: ERR_BUYBACK_QUANTITY_EXCEEDED
    http_status: 422
    condition: a line's quantity exceeds the order line's unreturned quantity
    applies_to: [POST /direct-selling/buyback-requests]
  - id: ERR_BUYBACK_CONDITION_INVALID
    http_status: 422
    condition: a line's condition is OPENED or DAMAGED
    applies_to: [POST /direct-selling/buyback-requests]
  - id: ERR_BUYBACK_NOT_REQUESTED
    http_status: 409
    condition: a decision was taken on a buyback that is not REQUESTED
    applies_to: ["POST /direct-selling/buyback-requests/{buyback_id}/decision"]
  - id: ERR_BUYBACK_NOT_APPROVED
    http_status: 409
    condition: refund attempted on a buyback that is not APPROVED
    applies_to: ["POST /direct-selling/buyback-requests/{buyback_id}/refund"]
  - id: ERR_DECISION_REASON_REQUIRED
    http_status: 422
    condition: decision DENY without a decision_reason
    applies_to: ["POST /direct-selling/buyback-requests/{buyback_id}/decision"]

  - id: ERR_DISCLOSURE_POPULATION_EMPTY
    http_status: 422
    condition: the selected population contains no members
    applies_to: [POST /direct-selling/income-disclosure-statements]
  - id: ERR_DISCLOSURE_NOT_DRAFT
    http_status: 409
    condition: submit-legal-review attempted while the statement is not DRAFT
    applies_to: ["POST /direct-selling/income-disclosure-statements/{statement_id}/submit-legal-review"]
  - id: ERR_DISCLOSURE_NOT_IN_REVIEW
    http_status: 409
    condition: a legal decision was taken while the statement is not LEGAL_REVIEW
    applies_to: ["POST /direct-selling/income-disclosure-statements/{statement_id}/legal-decision"]
  - id: ERR_REVISION_NOTE_REQUIRED
    http_status: 422
    condition: decision REQUEST_REVISION without a revision_note
    applies_to: ["POST /direct-selling/income-disclosure-statements/{statement_id}/legal-decision"]
  - id: ERR_NO_MUTABLE_FIELDS
    http_status: 422
    condition: the patch body contains no mutable plan field
    applies_to: ["PATCH /direct-selling/compensation-plans/{plan_id}"]

# =============================================================================
# §1.7 RBAC Permission Matrix
# role_model: segregation_of_duties
# =============================================================================
roles:

  - name: Applicant
    description: |
      A prospect working through their own enrollment application. Owns exactly one
      application, identified by matching X-User-ID to the application's
      applicant_email. Can accept the agreement, submit identity documents, pay the
      starter kit and withdraw, but can never verify their own identity nor approve
      their own application.
    identity: entity_backed:EnrollmentApplication
    exclusive_operations:
      - POST /direct-selling/enrollment-applications/{application_id}/accept-agreement
    shared_operations:
      - POST /direct-selling/enrollment-applications (shared with PlatformAdmin, but only PlatformAdmin may omit the sponsor)
      - POST /direct-selling/enrollment-applications/{application_id}/pay-starter-kit (shared with PlatformAdmin)
      - POST /direct-selling/enrollment-applications/{application_id}/identity-submission (shared with PlatformAdmin)
      - POST /direct-selling/enrollment-applications/{application_id}/withdraw (shared with PlatformAdmin)
      - catalog and own-application reads

  - name: Consultant
    description: |
      An enrolled consultant, resolved from X-User-ID to a Consultant row. Places
      and pays their own orders, attests personal use, requests buybacks of their own
      inventory, appeals sanctions against themselves and reads their own
      statements. Cannot lock periods, calculate commissions, decide compliance
      cases or approve anything.
    identity: entity_backed:Consultant
    exclusive_operations:
      - POST /direct-selling/compliance-cases/{case_id}/appeal
    shared_operations:
      - POST /direct-selling/product-orders (shared with PlatformAdmin)
      - POST /direct-selling/product-orders/{order_id}/pay (shared with PlatformAdmin)
      - POST /direct-selling/period-qualifications/{period_qualification_id}/personal-use-attestation (shared with PlatformAdmin)
      - POST /direct-selling/buyback-requests (shared with PlatformAdmin)
      - own-row reads across consultants, orders, qualifications, statements, buybacks, cases and disclosures

  - name: ComplianceOfficer
    description: |
      Owns identity verification, enrollment approval, the disciplinary process and
      the termination/reinstatement decisions. Cannot compute or approve money.
    identity: opaque
    exclusive_operations:
      - POST /direct-selling/enrollment-applications/{application_id}/identity-decision
      - POST /direct-selling/enrollment-applications/{application_id}/approve
      - POST /direct-selling/consultants/{consultant_id}/reinstate
      - POST /direct-selling/compliance-cases
      - POST /direct-selling/compliance-cases/{case_id}/review
      - POST /direct-selling/compliance-cases/{case_id}/decision
    shared_operations:
      - POST /direct-selling/consultants/{consultant_id}/terminate (shared with PlatformAdmin)
      - reads across applications, consultants, orders, periods, buybacks and cases

  - name: CommissionAnalyst
    description: |
      Runs the qualification and commission cycle and prepares income disclosure
      statements. Under segregation of duties an analyst may calculate a run but
      never approve it, and may submit a disclosure but never publish it.
    identity: opaque
    exclusive_operations:
      - POST /direct-selling/qualification-periods/{period_id}/lock
      - POST /direct-selling/qualification-periods/{period_id}/close
      - POST /direct-selling/commission-runs
      - POST /direct-selling/commission-runs/{run_id}/calculate
      - POST /direct-selling/income-disclosure-statements
      - POST /direct-selling/income-disclosure-statements/{statement_id}/submit-legal-review
    shared_operations:
      - POST /direct-selling/qualification-periods (shared with PlatformAdmin)
      - reads across consultants, orders, periods, qualifications, runs, statements and disclosures

  - name: FinanceController
    description: |
      Approves, pays and reverses commission runs and decides and executes
      buybacks. May not calculate a run, and may not approve a run they calculated
      (which they cannot do at all, so the segregation test bites when the same
      human holds two role headers under one X-User-ID).
    identity: opaque
    exclusive_operations:
      - POST /direct-selling/commission-runs/{run_id}/approval-decision
      - POST /direct-selling/commission-runs/{run_id}/pay
      - POST /direct-selling/commission-runs/{run_id}/reverse
      - POST /direct-selling/buyback-requests/{buyback_id}/decision
      - POST /direct-selling/buyback-requests/{buyback_id}/refund
    shared_operations:
      - reads across consultants, orders, periods, qualifications, runs, statements, buybacks and disclosures

  - name: LegalReviewer
    description: |
      Publishes or returns income disclosure statements. Holds no other write
      permission anywhere in the domain, which makes it the cleanest probe for
      ERR_UNAUTHORIZED.
    identity: opaque
    exclusive_operations:
      - POST /direct-selling/income-disclosure-statements/{statement_id}/legal-decision
    shared_operations:
      - reads across consultants, runs, statements and disclosures

  - name: PlatformAdmin
    description: |
      Configures the plan, jurisdictions, products and periods, mints genealogy
      roots, adjusts ranks administratively, reopens closed periods, drives
      fulfillment and sets the logical clock. Deliberately excluded from the money
      path: an admin may not calculate, approve, pay or reverse a run, nor decide a
      compliance case, nor publish a disclosure.
    identity: opaque
    exclusive_operations:
      - POST /direct-selling/compensation-plans
      - PATCH /direct-selling/compensation-plans/{plan_id}
      - POST /direct-selling/tax-jurisdictions
      - POST /direct-selling/products
      - POST /direct-selling/consultants/{consultant_id}/rank-adjustment
      - POST /direct-selling/product-orders/{order_id}/fulfillment
      - POST /direct-selling/qualification-periods/{period_id}/reopen
      - POST /direct-selling/_clock/set_current_utc
    shared_operations:
      - POST /direct-selling/enrollment-applications and its identity-submission, pay-starter-kit and withdraw actions (never accept-agreement, which only the applicant may perform)
      - POST /direct-selling/qualification-periods (shared with CommissionAnalyst)
      - POST /direct-selling/product-orders and pay (shared with Consultant)
      - POST /direct-selling/period-qualifications/{period_qualification_id}/personal-use-attestation (shared with Consultant)
      - POST /direct-selling/buyback-requests (shared with Consultant)
      - POST /direct-selling/consultants/{consultant_id}/terminate (shared with ComplianceOfficer)
      - all reads
