          assert:
            - "First compliance-check: status == COMPLIANCE_REJECTED and compliance_note == ERR_TRADE_PROHIBITED"
            - "Re-check after retire: status == APPROVED (COMPLIANCE_REJECTED -> APPROVED loop)"
            - "Attach: status == BLOCKED; detach: status == APPROVED and block_id == null (BLOCKED -> APPROVED loop)"

      - name: settlement_fail_repair_cycle_retains_fail_count
        grounds:
          - state_machines.SettlementInstruction.INSTRUCTED_to_FAILED
          - state_machines.SettlementInstruction.FAILED_to_INSTRUCTED
          - entities.SettlementInstruction.fields.fail_count
        distinguishing_aspect: |
          The SettlementInstruction machine cycles INSTRUCTED -> FAILED ->
          INSTRUCTED via repair, and fail_count is monotone across the cycle
          (repair does not reset it) — a cyclic machine with retained history on
          a different entity than Order.
        test_recipe:
          setup:
            - "Account A1 ACTIVE with OPEN budget 100000; EQUITY security lot 1; broker 50bp"
            - "Order 100 BUY approved; block routed; fill 100@1000 -> FILLED; plan PRO_RATA proposed/approved/posted (line 100@1000, commission 500); instruction PENDING exists"
