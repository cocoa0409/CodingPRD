              as: BrewerAdmin
              captures: { ags_id: $.data.id }
            - call: "POST /allocation-events"
              payload: { brand_code: "BUD-LTD", total_qty_cases: 100 }
              as: BrewerAdmin
              captures: { evs_id: $.data.id }
            - call: "POST /allocation-events/${evs_id}/requests"
              payload: { requested_qty_cases: 300 }
