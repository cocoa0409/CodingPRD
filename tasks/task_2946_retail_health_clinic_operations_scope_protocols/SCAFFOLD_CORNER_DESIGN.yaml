      - name: corner_clock_advance_activates_then_completes_the_assignment
        claim_type: valid_transition
        grounds:
          - state_machines.StaffingAssignment.SCHEDULED_to_ACTIVE
          - state_machines.StaffingAssignment.ACTIVE_to_COMPLETED
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The clock endpoint is the only driver of assignment activation and completion: an assignment for [09:00, 12:00) created at the 00:00 startup default is SCHEDULED with the clinic CLOSED, appears in activated_assignment_ids at exactly 09:00 (clinic OPEN), and appears in completed_assignment_ids at exactly 12:00 (clinic CLOSED again)."
        test_recipe:
          setup:
            - "One CA clinic with min_clinicians_required 1 and one clinician exist; the logical clock is at its 2026-08-01T00:00:00Z startup default."
            - "A PRIMARY assignment is scheduled for [2026-08-01T09:00:00Z, 2026-08-01T12:00:00Z)."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 37", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c37_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Elm", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p37_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Elm", credential: "NP", license_state_code: "CA", home_clinic_id: "${c37_id}", supervising_physician_id: "${p37_id}" }
              as: ClinicAdmin
              captures: { cl37_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c37_id}", clinician_id: "${cl37_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T09:00:00Z", ends_at: "2026-08-01T12:00:00Z", pinned_supervising_physician_id: "${p37_id}" }
              as: ClinicAdmin
              captures: { sa37_id: $.data.id, sa37_status: $.data.status }
            - call: "GET /clinics/${c37_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c37_before: $.data.open_status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: ClinicAdmin
              captures: { activated_ids: $.data.activated_assignment_ids, affected_ids: $.data.affected_clinic_ids }
            - call: "GET /clinics/${c37_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c37_at_nine: $.data.open_status, c37_headcount: $.data.on_duty_clinician_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: ClinicAdmin
              captures: { completed_ids: $.data.completed_assignment_ids }
            - call: "GET /clinics/${c37_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c37_at_noon: $.data.open_status, c37_headcount_after: $.data.on_duty_clinician_count }
          assert:
            - "${sa37_status} == SCHEDULED and ${c37_before} == CLOSED"
            - "${activated_ids} contains ${sa37_id} and ${affected_ids} contains ${c37_id}"
            - "${c37_at_nine} == OPEN and ${c37_headcount} == 1"
            - "StaffingAssignment.${sa37_id}.status == ACTIVE immediately after the 09:00 call"
            - "${completed_ids} contains ${sa37_id}"
            - "${c37_at_noon} == CLOSED and ${c37_headcount_after} == 0"
            - "StaffingAssignment.${sa37_id}.status == COMPLETED"
            - "Clinic.${c37_id}.posted_wait_minutes == 0"

