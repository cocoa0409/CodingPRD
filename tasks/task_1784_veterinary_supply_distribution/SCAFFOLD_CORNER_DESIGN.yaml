scaffold_corner_design:
- section: entities
  instances:
  - name: clinic_creation_initial_state_and_computed
    claim_type: creation
    grounds:
    - entities.Clinic
    - state_machines.Clinic
    distinguishing_aspect: A created clinic starts PENDING_VERIFICATION with credit_used_cents 0 and version 1; omitted dea_registration_number defaults to null.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic N
          license_number: LIC-N1
          ship_to_address: 21 Mews St
          credit_limit_cents: 100000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 2
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_status: $.data.status
          c_used: $.data.credit_used_cents
          c_ver: $.data.version
          c_dea: $.data.dea_registration_number
      assert:
      - status == PENDING_VERIFICATION (initial state)
      - credit_used_cents == 0 and version == 1
      - dea_registration_number is null (default applied)
      - id is a server-minted UUID; created_at/updated_at stamped with three fractional digits
  - name: product_create_system_and_computed_input_ignored
    claim_type: computed_field
    grounds:
    - entities.Product.fields.requires_cold_chain
    distinguishing_aspect: 'requires_cold_chain is computed from product_type: a CONSUMABLE created with requires_cold_chain true in the payload still stores false; a client-supplied id is ignored.'
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /vet/products
        payload:
          sku: CONS-IG
          product_name: Towel Pack
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 2500
          requires_cold_chain: true
          id: 11111111-1111-1111-1111-111111111111
        as: SupplyChainPlanner
        captures:
          p_cold: $.data.requires_cold_chain
          p_id: $.data.id
          p_status: $.data.status
      assert:
      - requires_cold_chain == false (computed from product_type CONSUMABLE; client input ignored)
      - id != 11111111-1111-1111-1111-111111111111 (server-minted)
      - status == LISTED (initial state)
  - name: product_retrieval_and_not_found
    claim_type: not_found
    grounds:
    - entities.Product
    - errors[ERR_PRODUCT_NOT_FOUND]
    distinguishing_aspect: GET by id returns the stored product; a random UUID yields ERR_PRODUCT_NOT_FOUND (404).
    test_recipe:
      setup:
      - one product exists
      setup_api_calls:
      - call: POST /vet/products
        payload:
          sku: VAC-NF
          product_name: FVRCP 10ds
          manufacturer_code: GEN
          product_type: VACCINE
          unit_price_cents: 5000
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      trigger:
      - call: GET /vet/products/${p_id}
        as: AccountManager
        captures:
          p_sku: $.data.sku
          p_cold: $.data.requires_cold_chain
      - call: GET /vet/products/00000000-0000-0000-0000-000000000000
        as: AccountManager
        captures:
          err: $.data.error_id
      assert:
      - 'GET existing: sku == VAC-NF and requires_cold_chain == true (VACCINE)'
      - 'GET random id: error_id == ERR_PRODUCT_NOT_FOUND, http 404'
  - name: not_found_sweep_all_path_resources
    claim_type: not_found
    grounds:
    - errors[ERR_CLINIC_NOT_FOUND]
    - errors[ERR_AUTHORIZATION_NOT_FOUND]
    - errors[ERR_LOT_NOT_FOUND]
    - errors[ERR_ORDER_NOT_FOUND]
    - errors[ERR_ORDER_LINE_NOT_FOUND]
    - errors[ERR_SHIPMENT_NOT_FOUND]
    - errors[ERR_PROGRAM_NOT_FOUND]
    - errors[ERR_ENROLLMENT_NOT_FOUND]
    - errors[ERR_CREDIT_NOT_FOUND]
    - errors[ERR_BACKORDER_LINE_NOT_FOUND]
    distinguishing_aspect: "Every path-addressable resource returns its domain-specific 404 on a random UUID \u2014 one trigger per resource."
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /vet/clinics/00000000-0000-0000-0000-000000000000
        as: AccountManager
        captures:
          e1: $.data.error_id
      - call: GET /vet/manufacturer-authorizations/00000000-0000-0000-0000-000000000000
        as: ComplianceOfficer
        captures:
          e2: $.data.error_id
      - call: GET /vet/inventory-lots/00000000-0000-0000-0000-000000000000
        as: SupplyChainPlanner
        captures:
          e3: $.data.error_id
      - call: GET /vet/orders/00000000-0000-0000-0000-000000000000
        as: AccountManager
        captures:
          e4: $.data.error_id
      - call: GET /vet/order-lines/00000000-0000-0000-0000-000000000000
        as: AccountManager
        captures:
          e5: $.data.error_id
      - call: GET /vet/shipments/00000000-0000-0000-0000-000000000000
        as: SupplyChainPlanner
        captures:
          e6: $.data.error_id
      - call: GET /vet/bundle-programs/00000000-0000-0000-0000-000000000000
        as: AccountManager
        captures:
          e7: $.data.error_id
      - call: GET /vet/bundle-enrollments/00000000-0000-0000-0000-000000000000
        as: AccountManager
        captures:
          e8: $.data.error_id
      - call: GET /vet/short-date-credits/00000000-0000-0000-0000-000000000000
        as: ComplianceOfficer
        captures:
          e9: $.data.error_id
      - call: POST /vet/backorder-lines/00000000-0000-0000-0000-000000000000/cancel
        as: AccountManager
        captures:
          e10: $.data.error_id
      assert:
      - e1 ERR_CLINIC_NOT_FOUND, e2 ERR_AUTHORIZATION_NOT_FOUND, e3 ERR_LOT_NOT_FOUND, e4 ERR_ORDER_NOT_FOUND, e5 ERR_ORDER_LINE_NOT_FOUND (all 404)
      - e6 ERR_SHIPMENT_NOT_FOUND, e7 ERR_PROGRAM_NOT_FOUND, e8 ERR_ENROLLMENT_NOT_FOUND, e9 ERR_CREDIT_NOT_FOUND, e10 ERR_BACKORDER_LINE_NOT_FOUND (all 404)
  - name: order_create_missing_required_fields_returns_invalid_request
    claim_type: required_fields
    grounds:
    - validations[priority=6]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST /vet/orders without clinic_id (and without lines) is rejected ERR_INVALID_REQUEST (400) before any state or business check.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /vet/orders
        payload:
          ship_to_address: 22 Nowhere Rd
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
        as: ClinicBuyer
        as_user_id: 00000000-0000-0000-0000-000000000000
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST, http 400 (missing required clinic_id and lines)
  - name: order_window_inverted_and_product_enum_invalid
    claim_type: type_constraint
    grounds:
    - validations[priority=6]
    - entities.Order.fields.delivery_window_end
    - entities.Product.fields.product_type
    distinguishing_aspect: "delivery_window_end <= delivery_window_start is a structural 400; an unknown product_type enum value is a structural 400 \u2014 both before any state check."
    test_recipe:
      setup:
      - ACTIVE clinic exists
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic TC
          license_number: LIC-TC
          ship_to_address: 23 Type Ter
          credit_limit_cents: 100000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 2
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      trigger:
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 23 Type Ter
          delivery_window_start: '2026-08-03T15:00:00Z'
          delivery_window_end: '2026-08-03T13:00:00Z'
          lines: []
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          err1: $.data.error_id
      - call: POST /vet/products
        payload:
          sku: BAD-ENUM
          product_name: Mystery
          manufacturer_code: GEN
          product_type: NARCOTIC
          unit_price_cents: 1000
        as: SupplyChainPlanner
        captures:
          err2: $.data.error_id
      assert:
      - inverted window -> error_id == ERR_INVALID_REQUEST (400)
      - unknown product_type -> error_id == ERR_INVALID_REQUEST (400)
  - name: lot_computed_fields_and_past_expiry_rejected
    claim_type: computed_field
    grounds:
    - entities.InventoryLot.fields.qty_available
    - validations[priority=6.2]
    - errors[ERR_INVALID_LOT_EXPIRY]
    distinguishing_aspect: On receipt qty_allocated == 0 and qty_available == qty_on_hand (computed); expiry_date before the clock date (2026-08-01 default) is rejected ERR_INVALID_LOT_EXPIRY.
    test_recipe:
      setup:
      - one product exists
      setup_api_calls:
      - call: POST /vet/products
        payload:
          sku: CONS-LF
          product_name: Pad Case
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 2500
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      trigger:
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-OK
          expiry_date: '2027-01-31'
          qty_on_hand: 7
        as: SupplyChainPlanner
        captures:
          l_alloc: $.data.qty_allocated
          l_avail: $.data.qty_available
          l_status: $.data.status
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-STALE
          expiry_date: '2026-07-15'
          qty_on_hand: 7
        as: SupplyChainPlanner
        captures:
          err: $.data.error_id
      assert:
      - 'good lot: qty_allocated == 0, qty_available == 7, status AVAILABLE'
      - 'stale lot (expiry 2026-07-15 < clock 2026-08-01): error_id == ERR_INVALID_LOT_EXPIRY, http 400'
  - name: product_duplicate_sku_conflict
    claim_type: type_constraint
    grounds:
    - validations[priority=6.1]
    - errors[ERR_DUPLICATE_SKU]
    distinguishing_aspect: 'SKU uniqueness is global: the second product with the same sku is rejected ERR_DUPLICATE_SKU (409).'
    test_recipe:
      setup:
      - product SKU-EXISTS created
      setup_api_calls:
      - call: POST /vet/products
        payload:
          sku: SKU-DUP
          product_name: First
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 1000
        as: SupplyChainPlanner
      trigger:
      - call: POST /vet/products
        payload:
          sku: SKU-DUP
          product_name: Second
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 2000
        as: SupplyChainPlanner
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_DUPLICATE_SKU, http 409
  - name: authorization_invalid_date_range_rejected
    claim_type: type_constraint
    grounds:
    - validations[priority=6]
    - entities.ManufacturerAuthorization.fields.valid_until
    distinguishing_aspect: valid_until < valid_from is a structural 400 before the window-overlap check.
    test_recipe:
      setup:
      - ACTIVE clinic exists
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic DR
          license_number: LIC-DR
          ship_to_address: 24 Date Dr
          credit_limit_cents: 100000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 2
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      trigger:
      - call: POST /vet/manufacturer-authorizations
        payload:
          clinic_id: ${c_id}
          manufacturer_code: ZOETIS
          valid_from: '2026-12-31'
          valid_until: '2026-01-01'
          approved_ship_to_address: 24 Date Dr
          quarterly_quantity_cap: 100
        as: ComplianceOfficer
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST, http 400 (valid_until < valid_from)
  - name: order_create_initial_state_and_lines_pending
    claim_type: initial_state
    grounds:
    - state_machines.Order
    - state_machines.OrderLine
    distinguishing_aspect: "A created order is DRAFT and each embedded line is PENDING with qty_allocated 0 and lot_id null \u2014 nothing is priced until submit."
    test_recipe:
      setup:
      - ACTIVE clinic and stocked product exist
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic IS
          license_number: LIC-IS
          ship_to_address: 25 Init Ave
          credit_limit_cents: 100000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 2
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-IS
          product_name: Film Pack
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 2500
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-IS
          expiry_date: '2027-01-31'
          qty_on_hand: 10
        as: SupplyChainPlanner
      trigger:
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 25 Init Ave
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 2
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
          o_status: $.data.status
      - call: GET /vet/order-lines?order_id=${o_id}
        as: AccountManager
        captures:
          l_status: $.data[0].status
          l_alloc: $.data[0].qty_allocated
      assert:
      - Order.status == DRAFT; totals are not yet computed (null or 0)
      - OrderLine.status == PENDING, qty_allocated == 0, lot_id null
  - name: product_listing_pagination_defaults
    claim_type: listing
    grounds:
    - response_envelope
    - entities.Product
    distinguishing_aspect: A bare list call applies envelope defaults limit 10 / offset 0 and reports total_count and has_more; limit 1 pages deterministically.
    test_recipe:
      setup:
      - two products exist
      setup_api_calls:
      - call: POST /vet/products
        payload:
          sku: PG-1
          product_name: Page One
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 1000
        as: SupplyChainPlanner
      - call: POST /vet/products
        payload:
          sku: PG-2
          product_name: Page Two
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 1000
        as: SupplyChainPlanner
      trigger:
      - call: GET /vet/products
        as: AccountManager
      - call: GET /vet/products?limit=1&offset=0
        as: AccountManager
      - call: GET /vet/products?limit=1&offset=1
        as: AccountManager
      assert:
      - 'bare list: response_type == array, total_count == 2, limit == 10, offset == 0, has_more == false'
      - 'limit=1&offset=0: exactly 1 item, has_more == true'
      - 'limit=1&offset=1: the other item, has_more == false; the two pages are disjoint'
- section: state_machines
  instances:
  - name: clinic_double_activate_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.Clinic
    - errors[ERR_CLINIC_INVALID_STATE]
    distinguishing_aspect: Activate is only valid from PENDING_VERIFICATION; the second activate on an ACTIVE clinic fails ERR_CLINIC_INVALID_STATE and changes nothing.
    test_recipe:
      setup:
      - clinic created and activated
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic DA
          license_number: LIC-DA
          ship_to_address: 26 Double Dr
          credit_limit_cents: 100000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 2
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      trigger:
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_CLINIC_INVALID_STATE, http 409
      - Clinic remains ACTIVE with version == 2 (no mutation on the rejected call)
  - name: authorization_revoked_terminal_lockdown
    claim_type: terminal_lockdown
    grounds:
    - state_machines.ManufacturerAuthorization
    - errors[ERR_AUTHORIZATION_INVALID_STATE]
    distinguishing_aspect: 'REVOKED is terminal: suspend after revoke fails ERR_AUTHORIZATION_INVALID_STATE; the machine offers no exit from REVOKED.'
    test_recipe:
      setup:
      - ACTIVE clinic; authorization created, approved, then revoked
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic TL
          license_number: LIC-TL
          ship_to_address: 27 Term Trl
          credit_limit_cents: 100000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 2
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/manufacturer-authorizations
        payload:
          clinic_id: ${c_id}
          manufacturer_code: ZOETIS
          valid_from: '2026-01-01'
          valid_until: '2026-12-31'
          approved_ship_to_address: 27 Term Trl
          quarterly_quantity_cap: 100
        as: ComplianceOfficer
        captures:
          a_id: $.data.id
      - call: POST /vet/manufacturer-authorizations/${a_id}/approve
        as: ComplianceOfficer
      - call: POST /vet/manufacturer-authorizations/${a_id}/revoke
        as: ComplianceOfficer
      trigger:
      - call: POST /vet/manufacturer-authorizations/${a_id}/suspend
        as: ComplianceOfficer
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_AUTHORIZATION_INVALID_STATE, http 409; status remains REVOKED
  - name: order_cancelled_terminal_lockdown_and_resubmit
    claim_type: terminal_lockdown
    grounds:
    - state_machines.Order
    - errors[ERR_ORDER_INVALID_STATE]
    distinguishing_aspect: 'CANCELLED is terminal: submit on a cancelled order fails ERR_ORDER_INVALID_STATE.'
    test_recipe:
      setup:
      - ACTIVE clinic, stocked product; order created then cancelled from DRAFT
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic TL2
          license_number: LIC-TL2
          ship_to_address: 28 Lock Ln
          credit_limit_cents: 100000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 2
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-TL2
          product_name: Tape Roll
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 2500
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 28 Lock Ln
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      - call: POST /vet/orders/${o_id}/cancel
        as: ClinicBuyer
        as_user_id: ${c_id}
      trigger:
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_ORDER_INVALID_STATE, http 409; status remains CANCELLED
  - name: order_submit_idempotency_violation
    claim_type: idempotency
    grounds:
    - state_machines.Order.DRAFT_to_SUBMITTED
    distinguishing_aspect: 'Submit is not idempotent: the first submit succeeds (SUBMITTED); the identical second submit fails ERR_ORDER_INVALID_STATE.'
    test_recipe:
      setup:
      - ACTIVE clinic, stocked product, order created
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic ID
          license_number: LIC-ID
          ship_to_address: 29 Idem Isle
          credit_limit_cents: 100000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 2
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-ID
          product_name: Tube Box
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 2500
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 29 Idem Isle
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      trigger:
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          ok: $.data.status
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          err: $.data.error_id
      assert:
      - first submit -> 200 SUBMITTED
      - second identical submit -> error_id == ERR_ORDER_INVALID_STATE, http 409
  - name: product_discontinue_valid_then_invalid
    claim_type: valid_transition
    grounds:
    - state_machines.Product
    - errors[ERR_PRODUCT_INVALID_STATE]
    distinguishing_aspect: LISTED -> DISCONTINUED succeeds once; a second discontinue fails ERR_PRODUCT_INVALID_STATE (terminal lockdown on the same machine).
    test_recipe:
      setup:
      - one LISTED product
      setup_api_calls:
      - call: POST /vet/products
        payload:
          sku: CONS-DISC
          product_name: Old SKU
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 1000
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      trigger:
      - call: POST /vet/products/${p_id}/discontinue
        as: SupplyChainPlanner
        captures:
          ok: $.data.status
      - call: POST /vet/products/${p_id}/discontinue
        as: SupplyChainPlanner
        captures:
          err: $.data.error_id
      assert:
      - first discontinue -> 200 DISCONTINUED, version 2
      - second discontinue -> error_id == ERR_PRODUCT_INVALID_STATE, http 409
  - name: discontinued_product_blocked_at_submit
    claim_type: precondition_enforcement
    grounds:
    - validations[priority=6.6]
    - errors[ERR_PRODUCT_DISCONTINUED]
