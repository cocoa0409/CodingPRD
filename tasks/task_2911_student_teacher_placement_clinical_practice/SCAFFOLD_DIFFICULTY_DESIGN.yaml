      - name: paid_stipend_clawback_restores_agreement_committed_money
        grounds:
          - "state_machines.Placement"
          - "calculations.agreement_ledger"
          - "endpoints.POST /epp/placements/{placement_id}/stipend-transition"
          - "endpoints.POST /epp/cooperating-teachers/{teacher_id}/disqualify"
          - "entities.PartnershipAgreement.stipend_committed_cents"
          - "entities.Placement.stipend_status"
        distinguishing_aspect: |
          Conserved quantity: SETTLED MONEY - the agreement's stipend_committed_cents. A full 14-week
          placement is completed and its FINAL stipend of 183968 cents is approved and paid; misconduct is
          then substantiated against the cooperating teacher and the payout is clawed back. The money
          ledger must return to exactly its pre-confirmation value of 0 by re-derivation, not by a second
          subtraction that could overshoot into negative cents, and the clinical record must survive
          untouched - the placement stays COMPLETED and the seat stays committed, because the seat ledger
          is a different conserved quantity that a money compensation may not disturb. The sibling instance
          conserves occupancy units on an unsettled placement, where no money exists at all.
        test_recipe:
          setup:
            - "Build the base fixture at clock 2026-08-01T00:00:00Z and drive a 14-week placement all the way to COMPLETED with a FINAL stipend of 183968 cents."
            - "Move the money dimension ACCRUED -> APPROVED -> PAID, which is legal only because the variant is already FINAL."
            - "Substantiate misconduct against the cooperating teacher, moving qualification_status to DISQUALIFIED - the precondition that unlocks the clawback edge."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/districts"
              payload: {"name": "Ridgeview ISD", "district_code": "D-RIDGE", "state_code": "TX", "requires_district_fingerprint": true, "travel_reimbursement_enabled": true}
              as: ProgramAdmin
              captures: {"d1": "$.data.id"}
            - call: "POST /epp/partnership-agreements"
              payload: {"district_id": "${d1}", "term": "FALL_2026", "window_start": "2026-08-01", "window_end": "2027-01-31", "placement_cap": 1, "stipend_rate_cents_per_week": 12345, "allowed_subjects": ["MATH", "ELA"], "allowed_grade_bands": ["MG_5_9", "HS_9_12"]}
