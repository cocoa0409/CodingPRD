  - rule_id: transitive_cascade
    instances:

      - name: dose_void_drives_five_link_compliance_and_clearance_cascade
        grounds:
          - state_machines.ImmunizationDose.VALID_to_VOIDED
          - state_machines.ImmunizationDose.VALID_to_INVALID_TOO_EARLY
          - calculations.immunization_compliance_status
          - state_machines.SportsPhysicalClearance.ACTIVE_to_VOIDED
          - state_machines.ParentNotification.null_to_QUEUED
          - entities.SportsPhysicalClearance.fields.void_reason
        distinguishing_aspect: |
          Depth-5 chain from the POST /sbhc/immunization-doses/{id}/void trigger,
          each link caused by the previous one: (1) HEPB dose 1 becomes VOIDED,
          (2) which strips HEPB doses 2 and 3 of their VALID predecessor so they
          become INVALID_TOO_EARLY with invalid_reason PREDECESSOR_VOIDED,
          (3) which drops Student.immunization_compliance_status to NON_COMPLIANT,
          (4) which voids the ACTIVE clearance with void_reason
          IMMUNIZATION_COMPLIANCE_LOST, (5) which creates a CLEARANCE_VOIDED
          ParentNotification.
