            - call: "POST /service-locations/${locB_id}/retread-lines"
              payload: { line_code: "L1", cure_cooldown_minutes: 30 }
              as: DealerAdmin
              captures: { ok_line_id: $.data.id }
          assert:
            - "the six clashes return 409 with error_ids ERR_DUPLICATE_LOCATION_CODE, ERR_DUPLICATE_CASING_SERIAL, ERR_DUPLICATE_VEHICLE_UNIT, ERR_DUPLICATE_TIRE_POLICY, ERR_DUPLICATE_LINE_CODE and ERR_DUPLICATE_AGREEMENT_CODE respectively — six distinct ids, no shared generic conflict code"
            - "the casing_serial clash is rejected even though the second casing belongs to a different fleet, proving that serial uniqueness is global"
            - "unit_number T-200 under fleet B returns 201, proving vehicle uniqueness is per-fleet"
            - "line_code L1 at location B returns 201, proving line uniqueness is per-location"

