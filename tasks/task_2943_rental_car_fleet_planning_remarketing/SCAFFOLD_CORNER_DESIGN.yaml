      - name: computed_read_endpoints_match_the_calculation_rules
        excluded_because:
          difficulty_instance: fleet_plan_forward_planned_vs_chronological_actual_divergence
          rationale: "The `Computed read` row - derived data matching the expected calculation - is covered by the §1.8 instances that drive the three read-only computed endpoints: GET /fleet/fleet-plans/{plan_id}/performance there, GET /fleet/vehicles/{vehicle_id}/valuation in vehicle_residual_program_guarantee_vs_policy_schedule_divergence, and GET /fleet/vehicles/{vehicle_id}/channel-recommendation in channel_pool_empties_one_kilometre_past_hard_mileage_band."

  # ===========================================================================
  # Table 6 has no claim-type rows: the requirement is that EVERY code in §1.6 is
  # triggerable. These instances are grouped by error family so that one setup
  # chain drives several codes; between them and the codes already triggered in
  # §1.8, the entities/state_machines/validations/rbac/layers sections above and
  # below, every one of the 67 declared codes has at least one trigger.
  - section: errors
    instances:

      - name: every_single_entity_get_with_an_unknown_uuid_returns_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations[priority 5 path-id existence]
          - errors[ERR_SEGMENT_NOT_FOUND]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_CHANNEL_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_FLEET_PLAN_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - errors[ERR_TASK_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_DAMAGE_EVENT_NOT_FOUND]
          - errors[ERR_CONSIGNMENT_NOT_FOUND]
          - errors[ERR_LEDGER_ENTRY_NOT_FOUND]
        distinguishing_aspect: "Priority 5 mints a DISTINCT code per entity rather than one shared ERR_NOT_FOUND, so eleven single-GET endpoints must return eleven different error_id values from an empty database - a generic 404 body fails this instance."
        test_recipe:
          setup:
            - "Empty database. No entity of any type exists, so every path id below is unknown."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "GET /fleet/vehicle-segments/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { e_seg: $.data.error_id }
            - call: "GET /fleet/manufacturer-programs/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { e_prg: $.data.error_id }
            - call: "GET /fleet/remarketing-channels/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { e_chn: $.data.error_id }
            - call: "GET /fleet/depreciation-policies/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { e_pol: $.data.error_id }
            - call: "GET /fleet/fleet-plans/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { e_pln: $.data.error_id }
            - call: "GET /fleet/purchase-allocations/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { e_all: $.data.error_id }
            - call: "GET /fleet/in-fleeting-tasks/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { e_tsk: $.data.error_id }
            - call: "GET /fleet/redistribution-orders/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { e_ord: $.data.error_id }
            - call: "GET /fleet/damage-events/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { e_dmg: $.data.error_id }
            - call: "GET /fleet/consignments/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { e_con: $.data.error_id }
            - call: "GET /fleet/ledger-entries/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { e_led: $.data.error_id }
          assert:
            - "all eleven calls return HTTP 404"
            - "the error_id values are, in call order, ERR_SEGMENT_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_CHANNEL_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_FLEET_PLAN_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_TASK_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_DAMAGE_EVENT_NOT_FOUND, ERR_CONSIGNMENT_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND"
            - "the eleven values are pairwise distinct"
            - "each response body carries data.error_id only, with no partially built entity payload"

      - name: blank_or_unrecognised_auth_headers_return_401_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority 1 ERR_MISSING_AUTH_HEADERS]
          - validations[priority 2 ERR_UNKNOWN_ROLE]
        distinguishing_aspect: "Priorities 1 and 2 run ahead of every other check including path-id existence, so a blank header pair and an unrecognised role name are both 401 on an endpoint whose target id does not exist - the response never reaches the 404 or the 403."
        test_recipe:
          setup:
            - "Empty database; one ATL market exists so that a valid-role control call can succeed."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
          trigger:
            - call: "GET /fleet/markets/${mkt_atl}"
              payload: {}
              as: ""
              as_user_id: "u-plan-1"
              captures: { e_blank_role: $.data.error_id }
            - call: "GET /fleet/markets/${mkt_atl}"
              payload: {}
              as: FleetPlanner
              as_user_id: ""
              captures: { e_blank_user: $.data.error_id }
            - call: "GET /fleet/markets/00000000-0000-4000-8000-00000000000c"
              payload: {}
              as: FleetOverlord
              as_user_id: "u-nobody"
              captures: { e_bad_role: $.data.error_id }
          assert:
            - "the empty X-User-Role call returns HTTP 401 with data.error_id == \"ERR_MISSING_AUTH_HEADERS\""
            - "the empty X-User-ID call returns HTTP 401 with data.error_id == \"ERR_MISSING_AUTH_HEADERS\": BOTH headers are required, not either one"
            - "the FleetOverlord call returns HTTP 401 with data.error_id == \"ERR_UNKNOWN_ROLE\" and NOT 404 ERR_MARKET_NOT_FOUND, even though its path id is also unknown: priority 2 precedes priority 5"
            - "the headers are sent as empty strings rather than omitted or whitespace-filled, so the server sees a present-but-empty value"

      - name: duplicate_keys_and_out_of_range_scalars_are_rejected_on_the_registry_endpoints
        claim_type: error_triggerable
        grounds:
          - validations[priority 7 ERR_INVALID_PAGINATION]
          - validations[priority 7 ERR_INVALID_UNIT_COUNT]
          - validations[priority 9 ERR_DUPLICATE_SEGMENT_CODE]
          - validations[priority 9 ERR_DUPLICATE_CHANNEL_CODE]
          - validations[priority 9 ERR_DUPLICATE_FLEET_PLAN]
        distinguishing_aspect: "Three of the six priority-9 uniqueness codes are single-column (segment code, channel code) while ERR_DUPLICATE_FLEET_PLAN is a three-column composite on (market_id, season, plan_year); the pagination and unit-count codes sit at priority 7 and therefore fire before any of them."
