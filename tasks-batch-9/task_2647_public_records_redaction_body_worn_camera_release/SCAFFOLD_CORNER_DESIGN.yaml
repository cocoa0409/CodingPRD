            - "DepictedIndividual.${juvenile_id}: notified_at == 2026-08-05T14:30:00Z, objection_deadline_at == 2026-08-20T14:30:00Z (JUVENILE_OBJECTION_WINDOW_DAYS 15) and notice_method == PERSONAL_SERVICE"
            - "VideoAsset.${asset_id}.depicted_individual_count == 2"
            - "PublicRecordsRequest.${req_id}.open_notification_count == 2 (NOTIFIED still counts as open; only a waiver, an overruled objection or NOT_REQUIRED clears it)"
      - name: presumptive_and_adjudicated_burden_diverge_on_one_record
        claim_type: Variant Divergence
        grounds:
          - calculations.record_redaction_burden.variants
          - entities.ResponsiveRecord.fields.presumptive_burden_minutes
          - entities.ResponsiveRecord.fields.adjudicated_burden_minutes
        distinguishing_aspect: |
          The two burden variants differ only in the claim-status filter, so one record
          carrying an ASSERTED and a SUSTAINED claim must show a strictly larger
          presumptive figure than adjudicated figure at the same instant.
        excluded_because:
          difficulty_instance: record_burden_variants_diverge_on_responsive_record
          rationale: |
            That §1.8 instance builds exactly that claim mix on one record and pins both
            variants after every write, including the OVERRULED and WITHDRAWN cases where
            the two figures reconverge.
      - name: estimate_basis_choice_changes_the_quote_on_identical_data
        claim_type: Variant Selection
        grounds:
          - calculations.fee_estimate_total.variants
          - entities.FeeEstimate.fields.basis
          - entities.FeeEstimate.fields.projected_burden_minutes
        distinguishing_aspect: |
          Two estimates taken back-to-back on untouched data must differ solely because
          basis selects the burden variant, and the smaller subtotal can also drop a
          public-interest tier.
        excluded_because:
          difficulty_instance: fee_estimate_basis_variants_diverge_on_request
          rationale: |
            That §1.8 instance issues the PRESUMPTIVE and ADJUDICATED estimates in
            sequence on frozen data and pins all eleven money fields of both, including
            the tier change and the fee_status flip that the smaller total causes.
      - name: tier_is_keyed_on_the_pre_waiver_subtotal
        claim_type: Constants Applied
        grounds:
          - calculations.fee_estimate_total
          - entities.FeeEstimate.fields.effective_waiver_pct
          - entities.Requester.fields.fee_waiver_pct
        distinguishing_aspect: |
          Step 8 keys PUBLIC_INTEREST_TIER on subtotal_cents, so a MEDIA requester whose
          post-waiver total falls into a lower tier band still pays the tier struck from
          the pre-waiver figure.
        excluded_because:
          difficulty_instance: public_interest_tier_keyed_on_pre_waiver_subtotal
          rationale: |
            That §1.8 instance is built precisely on the subtotal that straddles the
            5000-cent band edge and contrasts the pinned reading against the circular
            misreading, asserting both candidate totals by number.
      - name: invoice_labour_rounds_per_task_not_per_aggregate
        claim_type: Precision
        grounds:
          - calculations.fee_invoice_total
          - entities.RedactionTask.fields.approved_labor_minutes
          - entities.RedactionTask.fields.target_type
        distinguishing_aspect: |
          Rounding each task's complexity-scaled labour before summing yields 596 cents
          for two 5-minute LICENSE_PLATE tasks where rounding the aggregate yields 595.
        excluded_because:
          difficulty_instance: invoice_rounds_each_task_before_summing
          rationale: |
            That §1.8 instance drives exactly the two-task 596-versus-595 split through
            approval and invoicing and asserts the ledger rows the invoice appends.
      - name: adjacent_clips_do_not_overlap_but_one_millisecond_does
        claim_type: Interval Adjacency
        grounds:
          - calculations.clip_overlap
          - validations.priority_21
          - errors.ERR_CLIP_OVERLAP
        distinguishing_aspect: |
          Half-open intervals with no buffer mean a task starting exactly where another
          ends is accepted while a one-millisecond penetration is rejected, and a
          different target_type never conflicts at all.
        excluded_because:
          difficulty_instance: clip_overlap_half_open_adjacency_on_responsive_record
          rationale: |
            That §1.8 instance walks the exact adjacency boundary at 30000 ms, the 29999
            ms penetration, the different-target_type escape and the CANCELLED-task
            reuse in one flow.
      - name: buffered_qa_windows_conflict_thirty_minutes_apart
        claim_type: Interval Adjacency
        grounds:
          - calculations.qa_window_conflict
          - validations.priority_26
          - errors.ERR_QA_WINDOW_CONFLICT
        distinguishing_aspect: |
          QA windows use closed endpoints inflated by a symmetric 30-minute buffer, the
          opposite convention from clip_overlap, so a 30-minute gap conflicts and a
          31-minute gap is clear.
        excluded_because:
          difficulty_instance: qa_window_buffered_closed_interval_on_reviewer
          rationale: |
            That §1.8 instance tests the touching pair, the exactly-30-minute gap and the
            31-minute gap against one reviewer and contrasts them with the unbuffered
            clip rule on the same request.
      - name: reversal_restores_the_ledger_balance_exactly
        claim_type: Aggregation Reversal
        grounds:
          - calculations.ledger_conservation
          - entities.PublicRecordsRequest.fields.deposit_balance_cents
          - entities.FeeLedgerEntry.fields.reverses_entry_id
        distinguishing_aspect: |
          A reversal is an append, not an edit: deposit_balance_cents returns to its exact
          pre-payment value while the ledger row count grows by one and the invariant
          balance == paid + credits - recognized still holds.
        excluded_because:
          difficulty_instance: payment_reversal_conserves_ledger_balance_identity
          rationale: |
            That §1.8 instance asserts the full identity before and after the reversal,
            the row count, the untouched target entry and the SETTLED -> INVOICED
            fee_status regression it triggers.
      - name: failed_qa_leaves_request_billable_minutes_unchanged
        claim_type: Aggregation Reversal
        grounds:
          - calculations.request_billable_labor_minutes
          - entities.PublicRecordsRequest.fields.billable_labor_minutes
          - entities.RedactionTask.fields.logged_labor_minutes
        distinguishing_aspect: |
          Only APPROVED tasks contribute, so a submit-qa followed by a FAIL must leave
          billable_labor_minutes byte-identical to its pre-submission value even though
          logged_labor_minutes is non-zero.
        excluded_because:
          difficulty_instance: qa_rejection_conserves_request_billable_minutes
          rationale: |
            That §1.8 instance measures the conserved quantity at every hop of the
            DRAFT -> QA_PENDING -> QA_REJECTED -> QA_PENDING -> APPROVED walk and after
            the cancellation that later zeroes it again.
      - name: deposit_threshold_is_strictly_greater_than
        claim_type: Constants Applied
        grounds:
          - calculations.fee_estimate_total
          - entities.FeeEstimate.fields.deposit_required_cents
          - state_machines.PublicRecordsRequest.fee_status.transitions.NOT_ASSESSED->ESTIMATED
        distinguishing_aspect: |
          Step 11 uses a strict greater-than, so a total of exactly
          DEPOSIT_THRESHOLD_CENTS requires no deposit and lands in ESTIMATED while one
          cent more requires a deposit and lands in DEPOSIT_DUE.
        excluded_because:
          difficulty_instance: deposit_threshold_exact_versus_one_step_over
          rationale: |
            That §1.8 instance constructs the two requests that land exactly on and one
            step over the threshold and asserts both the deposit figures and the
            divergent fee_status values.
  - section: validations
    instances:
      - name: commercial_requester_is_refused_a_fourth_open_request
        claim_type: Violation -> Error
        grounds:
          - validations.priority_22
          - errors.ERR_OPEN_REQUEST_LIMIT
          - entities.Requester.fields.open_request_count
        distinguishing_aspect: |
          The limit is checked against the count BEFORE the insert, so the third request
          is accepted at count 2 and the fourth is refused at count 3 while a
          GENERAL_PUBLIC requester with the same three open requests is unaffected.
        test_recipe:
          setup:
            - "One COMMERCIAL requester and one GENERAL_PUBLIC requester, both starting at open_request_count 0."
            - "COMMERCIAL_OPEN_REQUEST_LIMIT is 3 and every request created here stays in INTAKE, which is not one of RELEASED, DENIED or CLOSED."
