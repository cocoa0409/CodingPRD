              payload: { order_id: "${order_id}", part_id: "${pid}", qty: 1 }
              as: WholesaleRep
              captures: { line_id: $.data.id }
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { v2: $.data.version }
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v2}" }
