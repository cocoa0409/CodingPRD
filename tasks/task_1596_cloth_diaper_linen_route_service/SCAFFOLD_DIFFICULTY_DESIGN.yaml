            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "SUSPEND" }, as: PlatformAdmin, captures: { cs_1: $.data.status } }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "REINSTATE" }, as: PlatformAdmin, captures: { cs_2: $.data.status } }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "SUSPEND" }, as: PlatformAdmin }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "REINSTATE" }, as: PlatformAdmin, captures: { cs_4: $.data.status } }
            - { call: "GET /api/subscriptions/${sub_id}", as: PlatformAdmin, captures: { sub_final: $.data.service_status } }
          assert:
