  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkout_gated_by_aircraft_airworthy
        grounds:
          - state_machines.Reservation.BOOKED_to_CHECKED_OUT
          - state_machines.Aircraft.AIRWORTHY_to_GROUNDED
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair Reservation -> Aircraft: checkout's valid transition set
          depends on the linked Aircraft being AIRWORTHY; a manually grounded
          glider blocks checkout with ERR_AIRCRAFT_NOT_AIRWORTHY even though
          the reservation itself is BOOKED and inside its window.
        test_recipe:
          setup:
            - "glider GZ AIRWORTHY; reservation RZ BOOKED with window 2026-08-21T10:00-12:00 (start_at precedes the grounding instant so the ground cascade's start_at > now filter leaves it BOOKED)"
            - "glider grounded manually at clock 2026-08-21T10:30:00Z (inside the checkout window)"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "GATE", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tier_z: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Gate Pilot", tier_id: "${tier_z}" }
              as: ClubAdmin
              captures: { mz_id: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N920G", kind: "GLIDER", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gz_id: $.data.id, gz_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T09:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gz_id}", member_id: "${mz_id}", start_at: "2026-08-21T10:00:00Z", end_at: "2026-08-21T12:00:00Z", expected_aircraft_version: "${gz_ver}" }
              as: Member
              as_user_id: "${mz_id}"
              captures: { rz_id: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T10:30:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/aircraft/${gz_id}/ground"
              payload: {}
              as: ClubAdmin
          trigger:
            - call: "POST /soaring/reservations/${rz_id}/checkout"
              payload: {}
              as: Member
              as_user_id: "${mz_id}"
              captures: { gate_err: $.data.error_id }
          assert:
            - "checkout rejected with error_id ERR_AIRCRAFT_NOT_AIRWORTHY"
            - "Reservation.${rz_id}.status == BOOKED (unchanged; start_at 10:00 < ground instant 10:30 so the cascade filter left it)"
            - "Aircraft.${gz_id}.status == GROUNDED and grounded_reason == MANUAL"

      - name: solo_signoff_gated_by_member_status
        grounds:
          - state_machines.StudentProgress.PENDING_to_SIGNED_OFF
          - calculations.student_solo_eligibility
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair StudentProgress -> Member (different pair from
          Reservation -> Aircraft): SOLO_SIGNOFF signoff depends on the
          student Member being ACTIVE; suspending the student makes signoff
          fail with ERR_MEMBER_NOT_ACTIVE (priority 5 state gate, evaluated
          before the business eligibility formula) even though the record
          itself is PENDING.
        test_recipe:
          setup:
            - "STUDENT-tier student SS ACTIVE then manually SUSPENDED; instructor INS is_instructor"
            - "StudentProgress SOLO_SIGNOFF in PENDING (hour history irrelevant: the status gate fires first)"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "STU2", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0, student_tier: true }
              as: ClubAdmin
              captures: { tier_ss: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Solo Student", tier_id: "${tier_ss}" }
              as: ClubAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Solo CFI", tier_id: "${tier_ss}", is_instructor: true }
              as: ClubAdmin
              captures: { ins2_id: $.data.id }
            - call: "POST /soaring/student-progress"
              payload: { student_id: "${ss_id}", instructor_id: "${ins2_id}", kind: "SOLO_SIGNOFF" }
              as: Instructor
              as_user_id: "${ins2_id}"
              captures: { sp2_id: $.data.id }
            - call: "POST /soaring/members/${ss_id}/suspend"
              payload: {}
              as: ClubAdmin
          trigger:
            - call: "POST /soaring/student-progress/${sp2_id}/signoff"
              payload: {}
              as: Instructor
              as_user_id: "${ins2_id}"
              captures: { sign_err: $.data.error_id }
          assert:
            - "signoff rejected with error_id ERR_MEMBER_NOT_ACTIVE (cross-entity gate on the student Member, not the record's own state)"
            - "StudentProgress.${sp2_id}.status == PENDING unchanged"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: glider_reservation_half_open_overlap
        grounds:
          - validations[priority=8]
          - entities.Reservation.fields.start_at
        distinguishing_aspect: |
          Half-open interval semantics on the Aircraft resource: a BOOKED
          reservation [10:00, 12:00) blocks a new [11:00, 13:00) (true
          intersection) but ALLOWS back-to-back [12:00, 14:00) — touching
          endpoints do not intersect under [start, end) semantics.
        test_recipe:
          setup:
            - "glider GO AIRWORTHY; existing BOOKED reservation 2026-08-22T10:00-12:00 by member MO1"
            - "clock 2026-08-22T08:00:00Z"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "OVL", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tier_o: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Overlap A", tier_id: "${tier_o}" }
              as: ClubAdmin
              captures: { mo1: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Overlap B", tier_id: "${tier_o}" }
              as: ClubAdmin
              captures: { mo2: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N930G", kind: "GLIDER", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { go_id: $.data.id, go_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T08:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${go_id}", member_id: "${mo1}", start_at: "2026-08-22T10:00:00Z", end_at: "2026-08-22T12:00:00Z", expected_aircraft_version: "${go_ver}" }
              as: Member
              as_user_id: "${mo1}"
            - call: "GET /soaring/aircraft/${go_id}"
              as: ClubAdmin
              captures: { go_ver2: $.data.version }
          trigger:
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${go_id}", member_id: "${mo2}", start_at: "2026-08-22T11:00:00Z", end_at: "2026-08-22T13:00:00Z", expected_aircraft_version: "${go_ver2}" }
              as: Member
              as_user_id: "${mo2}"
              captures: { ovl_err: $.data.error_id }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${go_id}", member_id: "${mo2}", start_at: "2026-08-22T12:00:00Z", end_at: "2026-08-22T14:00:00Z", expected_aircraft_version: "${go_ver2}" }
              as: Member
              as_user_id: "${mo2}"
              captures: { adj_id: $.data.id }
          assert:
            - "overlapping create [11:00,13:00) rejected with error_id ERR_GLIDER_OVERLAP"
            - "adjacent create [12:00,14:00) succeeds (201): Reservation.${adj_id}.status == BOOKED — touching endpoint is not an intersection"

      - name: instructor_buffered_gap_overlap
        grounds:
          - validations[priority=9]
        distinguishing_aspect: |
          Buffered-interval semantics on a different resource (instructor
          Member, not Aircraft): two reservations for the same instructor with
          a 20-minute gap are REJECTED (gap < INSTRUCTOR_BUFFER_MIN=30), while
          an exactly-30-minute gap is ALLOWED — the buffer expands each
          interval by 30 minutes on both sides before intersection, so plain
          adjacency (0 gap) is also rejected here, unlike the glider rule.
        test_recipe:
          setup:
            - "instructor MI ACTIVE is_instructor with OPEN availability 2026-08-23T08:00-20:00 covering all candidate windows"
            - "gliders GI1, GI2; students MU1, MU2 (student tier) ACTIVE"
            - "existing reservation for instructor MI: 10:00-12:00 with MU1 on GI1"
            - "clock 2026-08-23T07:00:00Z"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "STU3", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0, student_tier: true }
              as: ClubAdmin
              captures: { tier_i: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Buf CFI", tier_id: "${tier_i}", is_instructor: true }
              as: ClubAdmin
              captures: { mi_id: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Buf Stu1", tier_id: "${tier_i}" }
              as: ClubAdmin
              captures: { mu1: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Buf Stu2", tier_id: "${tier_i}" }
              as: ClubAdmin
              captures: { mu2: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N940G", kind: "GLIDER", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gi1: $.data.id, gi1_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N941G", kind: "GLIDER", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gi2: $.data.id, gi2_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-23T07:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/instructor-availability"
              payload: { instructor_id: "${mi_id}", start_at: "2026-08-23T08:00:00Z", end_at: "2026-08-23T20:00:00Z" }
              as: Instructor
              as_user_id: "${mi_id}"
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gi1}", member_id: "${mu1}", instructor_id: "${mi_id}", start_at: "2026-08-23T10:00:00Z", end_at: "2026-08-23T12:00:00Z", expected_aircraft_version: "${gi1_ver}" }
              as: Member
              as_user_id: "${mu1}"
          trigger:
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gi2}", member_id: "${mu2}", instructor_id: "${mi_id}", start_at: "2026-08-23T12:20:00Z", end_at: "2026-08-23T14:00:00Z", expected_aircraft_version: "${gi2_ver}" }
              as: Member
              as_user_id: "${mu2}"
              captures: { buf_err: $.data.error_id }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gi2}", member_id: "${mu2}", instructor_id: "${mi_id}", start_at: "2026-08-23T12:30:00Z", end_at: "2026-08-23T14:00:00Z", expected_aircraft_version: "${gi2_ver}" }
              as: Member
              as_user_id: "${mu2}"
              captures: { buf_ok: $.data.id }
          assert:
            - "20-minute-gap create rejected with error_id ERR_INSTRUCTOR_DOUBLE_BOOKED (gap 20 < 30)"
            - "exactly-30-minute-gap create succeeds (201): Reservation.${buf_ok}.status == BOOKED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: flight_post_then_void_balance_invariant
        grounds:
          - state_machines.Flight.IN_FLIGHT_to_VOIDED
          - calculations.tow_fee_calculation
          - entities.Member.fields.account_balance_cents
        distinguishing_aspect: |
          Conserved quantity: Member.account_balance_cents (monetary ledger).
          Invariant: balance_after(post F; void F) == balance_before. Post
          debits provisional 2700 (1500 ft base 3000, 10% discount); void must
          reverse exactly 2700 — zero drift.
        test_recipe:
          setup:
            - "member MB ACTIVE balance 0 on zero-dues 10%-discount tier; reservation CHECKED_OUT; slot capacity 3"
            - "clock 2026-08-24T10:00:00Z"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "INV", monthly_dues_cents: 0, tow_fee_discount_pct: 0.10, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tier_b: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Inv Pilot", tier_id: "${tier_b}" }
              as: ClubAdmin
              captures: { mb_id: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Inv Tow", tier_id: "${tier_b}", is_tow_pilot: true }
              as: ClubAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N950G", kind: "GLIDER", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gb_id: $.data.id, gb_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N951T", kind: "TOW_PLANE", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { tbw: $.data.id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${tbw}", tow_pilot_id: "${tb_id}", start_at: "2026-08-24T09:00:00Z", end_at: "2026-08-24T18:00:00Z", capacity: 3 }
              as: ClubAdmin
              captures: { sb_id: $.data.id, sb_ver: $.data.version }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gb_id}", member_id: "${mb_id}", start_at: "2026-08-24T09:30:00Z", end_at: "2026-08-24T14:00:00Z", expected_aircraft_version: "${gb_ver}" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { rb2_id: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T10:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations/${rb2_id}/checkout"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
          trigger:
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${rb2_id}", tow_slot_id: "${sb_id}", release_altitude_ft: 1500, takeoff_at: "2026-08-24T10:05:00Z", expected_tow_slot_version: "${sb_ver}" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { fb_id: $.data.id }
            - call: "POST /soaring/flights/${fb_id}/void"
              payload: {}
              as: DutyOfficer
              as_user_id: "${tb_id}"
          assert:
            - "Member.${mb_id}.account_balance_cents == 0 after post-then-void (2700 debited then exactly 2700 reversed — conserved)"
            - "Flight.${fb_id}.status == VOIDED"

      - name: swap_accept_decline_member_conservation
        grounds:
          - state_machines.DutyRosterSlot.SWAP_PENDING_to_ASSIGNED
          - entities.DutyRosterSlot.fields.member_id
        distinguishing_aspect: |
          Conserved quantity of a different type (assignment multiset over the
          slot pair, not money): propose -> decline leaves the (slot ->
          member) mapping unchanged; propose -> accept conserves the multiset
          of assigned members across the pair (same two members, exchanged).
          No member gains or loses duty count in either branch.
        test_recipe:
          setup:
            - "members DX, DY ACTIVE; slots SX (2026-08-26, DX) and SY (2026-08-27, DY), both ASSIGNED"
            - "clock 2026-08-24T00:00:00Z"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "SWAP", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tier_x: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Duty X", tier_id: "${tier_x}" }
              as: ClubAdmin
              captures: { dx_id: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Duty Y", tier_id: "${tier_x}" }
              as: ClubAdmin
              captures: { dy_id: $.data.id }
            - call: "POST /soaring/duty-roster"
              payload: { duty_date: "2026-08-26T00:00:00Z", member_id: "${dx_id}" }
              as: ClubAdmin
              captures: { sx_id: $.data.id }
            - call: "POST /soaring/duty-roster"
              payload: { duty_date: "2026-08-27T00:00:00Z", member_id: "${dy_id}" }
              as: ClubAdmin
              captures: { sy_id: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /soaring/duty-roster/${sx_id}/propose-swap"
              payload: { swap_with_slot_id: "${sy_id}" }
              as: Member
              as_user_id: "${dx_id}"
            - call: "POST /soaring/duty-roster/${sx_id}/decline-swap"
              payload: {}
              as: Member
              as_user_id: "${dy_id}"
          assert:
            - "DutyRosterSlot.${sx_id}.member_id == ${dx_id} (unchanged after propose+decline)"
            - "DutyRosterSlot.${sy_id}.member_id == ${dy_id} (unchanged)"
            - "both slots status == ASSIGNED and swap_with_slot_id == null on both — assignment multiset fully conserved"
