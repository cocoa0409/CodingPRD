          - calculations.fee_invoice_total
          - calculations.ledger_conservation
        distinguishing_aspect: |
          RELEASE_READY is exactly the state where the two priority-9 sets disagree: the
          release endpoint accepts it and the invoice endpoint refuses it, and the very
          same invoice call succeeds once the release has moved the request to RELEASED.
