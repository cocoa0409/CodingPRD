              payload: { case_number: "C-RBAC", defendant_name: "Xia Poe" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "POST /collections/waiver-requests"
              payload: { case_id: "${case_id}", obligation_id: "${obl_id}", requested_amount_cents: 4000 }
              as: CollectionsClerk
              as_user_id: "clerk-1"
              captures: { wr_id: $.data.id }
