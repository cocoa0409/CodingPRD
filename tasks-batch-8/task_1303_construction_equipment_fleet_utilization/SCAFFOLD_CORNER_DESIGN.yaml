      - name: ownership_field_constraints_enforced_both_directions
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_OWNERSHIP_FIELD_MISMATCH]"]
        distinguishing_aspect: "Ownership-typed field rule fires both ways: OWNED with acquisition_cost_cents == 0 rejected; RENTED with acquisition_cost_cents > 0 rejected — both 422 ERR_OWNERSHIP_FIELD_MISMATCH."
