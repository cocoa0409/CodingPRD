scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: valuation_provisional_vs_appraisal_diverge
        grounds:
          - calculations.spi_adjusted_valuation
          - entities.Tract.fields.soil_productivity_index
          - entities.ComparableSale.fields.sale_date
        distinguishing_aspect: |
          Dual variant on the LAND-VALUATION domain (Tract x ComparableSale): identical comparable
          set yields estimated_value 833333 under PROVISIONAL and 924373 under APPRAISAL because
          APPRAISAL alone applies the tillable factor (1.12) and the 0.97 recency discount on the
          oldest comparable.
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z"
            - "Three IA comparables: C1 900000/100ac/SPI80 sold 2026-01-15; C2 780000/120ac/SPI65 sold 2025-09-01; C3 550000/100ac/SPI55 sold 2024-09-01"
            - "Listing L (WHOLE, IA, 100ac) with tract T (100ac gross, 90 tillable, SPI 80)"
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2025-09-01T00:00:00Z", sale_price_total: 780000, gross_acres: 120, tillable_acres: 60, soil_productivity_index: 65 }, as: PlatformAdmin }
            - { call: "POST /api/comparables", payload: { county: "Polk", state_code: "IA", sale_date: "2024-09-01T00:00:00Z", sale_price_total: 550000, gross_acres: 100, tillable_acres: 50, soil_productivity_index: 55 }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L1", county: "Dallas", state_code: "IA", total_gross_acres: 100, packaging_strategy: "WHOLE", reserve_price_total: 750000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 100, tillable_acres: 90, soil_productivity_index: 80, min_price: 700000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t_id: $.data.id } }
          trigger:
            - { call: "GET /api/tracts/${t_id}/valuation", payload: { variant: "PROVISIONAL" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { prov_val: $.data.estimated_value, prov_vpa: $.data.value_per_acre, prov_n: $.data.comparable_count } }
            - { call: "GET /api/tracts/${t_id}/valuation", payload: { variant: "APPRAISAL" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { appr_val: $.data.estimated_value, appr_vpa: $.data.value_per_acre } }
          assert:
            - "prov_val == 833333 and prov_vpa == 8333.33 and prov_n == 3"
            - "appr_val == 924373 and appr_vpa == 9243.73"
            - "prov_val != appr_val (same comparable data, two variants, different dollars)"

      - name: net_sheet_provisional_vs_final_diverge
        grounds:
          - calculations.seller_net_sheet
          - calculations.closing_cost_allocation
          - calculations.possession_proration
          - entities.SettlementStatement.fields.variant
        distinguishing_aspect: |
          Dual variant on the FISCAL-SETTLEMENT domain (SettlementStatement), distinct from Rule-1
          instance 1's land-valuation domain: for the identical closing, PROVISIONAL nets
          1136000.00 (flat 0.5% cost estimate, zero rent credit) while FINAL nets 1133380.60
          (actual per-tract allocation 7400.00 plus possession rent credit 2219.40).
        test_recipe:
          setup:
            - "Full awarded flow: listing L1 COMBINATION 160ac, tracts T1 (100ac/90 till/SPI80/min 700000) and T2 (60ac/30 till/SPI70/min 350000), reserve 1200000; disclosure on T1 (lease ends 2026-10-15, rent 18000); buyer B3 qualified; ONLINE auction 2026-08-10 17:00-19:00Z; B3 combination bid 1400000 on [T1,T2] wins at award (clock 2026-08-10T19:00:00Z)"
            - "Deposit 42000.00 paid on time and VERIFIED; disclosure ACKNOWLEDGED by B3; closing created for 2026-09-01 with payoff 200000; title CLEARED and survey COMPLETED (READY_TO_CLOSE)"
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2025-09-01T00:00:00Z", sale_price_total: 780000, gross_acres: 120, tillable_acres: 60, soil_productivity_index: 65 }, as: PlatformAdmin }
            - { call: "POST /api/comparables", payload: { county: "Polk", state_code: "IA", sale_date: "2024-09-01T00:00:00Z", sale_price_total: 550000, gross_acres: 100, tillable_acres: 50, soil_productivity_index: 55 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { full_name: "Buyer Three", email: "b3@x.com", proof_of_funds_amount: 2000000 }, as: PlatformAdmin, captures: { b3_id: $.data.id } }
            - { call: "POST /api/buyers/${b3_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L1", county: "Dallas", state_code: "IA", total_gross_acres: 160, packaging_strategy: "COMBINATION", reserve_price_total: 1200000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 100, tillable_acres: 90, soil_productivity_index: 80, min_price: 700000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t1_id: $.data.id } }
            - { call: "GET /api/listings/${l_id}", as: BrokerAgent, as_user_id: "${g_id}", captures: { l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 2, gross_acres: 60, tillable_acres: 30, soil_productivity_index: 70, min_price: 350000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t2_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t1_id}", mineral_rights: "CONVEYED", wind_rights: "RESERVED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/rights", payload: { tract_id: "${t2_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/disclosures", payload: { tract_id: "${t1_id}", tenant_name: "Tenant A", lease_start_date: "2025-03-01T00:00:00Z", lease_end_date: "2026-10-15T00:00:00Z", annual_rent: 18000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { d_id: $.data.id } }
            - { call: "POST /api/listings/${l_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "ONLINE", scheduled_start: "2026-08-10T17:00:00Z", scheduled_end: "2026-08-10T19:00:00Z", soft_close_window_minutes: 5, extension_minutes: 5 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T17:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/open", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 1400000, tract_ids: ["${t1_id}", "${t2_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b3_id}", captures: { bid_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T19:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/award", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "GET /api/bids/${bid_id}/deposits", as: BrokerAgent, as_user_id: "${g_id}", captures: { dep_id: "$.data[0].id", dep_due: "$.data[0].amount_due" } }
            - { call: "POST /api/deposits/${dep_id}/record-payment", payload: { amount: 42000 }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/deposits/${dep_id}/verify", as: PlatformAdmin }
            - { call: "POST /api/disclosures/${d_id}/acknowledge", as: Buyer, as_user_id: "${b3_id}" }
            - { call: "POST /api/closings", payload: { auction_id: "${a_id}", target_closing_date: "2026-09-01T00:00:00Z", payoff_amount: 200000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/closings/${c_id}/track-events", payload: { axis: "TITLE", event: "ORDER_COMMITMENT" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/closings/${c_id}/track-events", payload: { axis: "TITLE", event: "RECEIVE_COMMITMENT" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/closings/${c_id}/track-events", payload: { axis: "TITLE", event: "CLEAR" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/closings/${c_id}/track-events", payload: { axis: "SURVEY", event: "ORDER" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/closings/${c_id}/track-events", payload: { axis: "SURVEY", event: "COMPLETE" }, as: BrokerAgent, as_user_id: "${g_id}" }
          trigger:
            - { call: "POST /api/statements", payload: { closing_id: "${c_id}", variant: "PROVISIONAL" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { prov_net: $.data.seller_net, prov_costs: $.data.allocated_seller_costs, prov_comm: $.data.commission_amount } }
            - { call: "POST /api/statements", payload: { closing_id: "${c_id}", variant: "FINAL" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { fin_net: $.data.seller_net, fin_costs: $.data.allocated_seller_costs, fin_rent: $.data.rent_credit, fin_comm: $.data.commission_amount } }
          assert:
            - "prov_comm == 57000.00 and fin_comm == 57000.00 (no kicker: 1400000 < 1.10 * 1357673 = 1493440.30)"
            - "prov_costs == 7000.00 (flat 0.5% estimate) and prov_net == 1136000.00"
            - "fin_costs == 7400.00 and fin_rent == 2219.40 and fin_net == 1133380.60"
            - "prov_net != fin_net — same closing data, two variants, different seller net"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: commission_tiered_marginal_plus_kicker
        grounds:
          - calculations.commission_calc
          - entities.SettlementStatement.fields.commission_amount
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs with non-linear interaction — marginal tier selection
          on gross (590000 -> 28950.00 across three tiers), a conditional kicker branch keyed on
          gross >= 1.10 x appraisal (590000 >= 587386.80 fires, +2950.00), and a max() floor;
          final commission 31900.00. The other Rule-2 instance uses mode (b) rounding order.
        test_recipe:
          setup:
            - "IA comparables C1/C2/C3 as in valuation instances; listing L3 WHOLE 50ac, tract T3 (50/50 till/SPI90/min 300000), reserve 400000 (floor 0.85 x 468750 = 398437.50 passes)"
            - "LIVE auction 2026-08-11 10:00-12:00Z; qualified buyer B1 bids 590000 on [T3]; auction awarded at 12:00; EMD 17700 paid+verified; closing for 2026-09-01 payoff 0; title CLEARED, survey WAIVED"
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2025-09-01T00:00:00Z", sale_price_total: 780000, gross_acres: 120, tillable_acres: 60, soil_productivity_index: 65 }, as: PlatformAdmin }
            - { call: "POST /api/comparables", payload: { county: "Polk", state_code: "IA", sale_date: "2024-09-01T00:00:00Z", sale_price_total: 550000, gross_acres: 100, tillable_acres: 50, soil_productivity_index: 55 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { full_name: "Buyer One", email: "b1@x.com", proof_of_funds_amount: 2000000 }, as: PlatformAdmin, captures: { b1_id: $.data.id } }
            - { call: "POST /api/buyers/${b1_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L3", county: "Dallas", state_code: "IA", total_gross_acres: 50, packaging_strategy: "WHOLE", reserve_price_total: 400000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 50, tillable_acres: 50, soil_productivity_index: 90, min_price: 300000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t3_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t3_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "LIVE", scheduled_start: "2026-08-11T10:00:00Z", scheduled_end: "2026-08-11T12:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/open", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 590000, tract_ids: ["${t3_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b1_id}", captures: { bid_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/award", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "GET /api/bids/${bid_id}/deposits", as: BrokerAgent, as_user_id: "${g_id}", captures: { dep_id: "$.data[0].id" } }
            - { call: "POST /api/deposits/${dep_id}/record-payment", payload: { amount: 17700 }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/deposits/${dep_id}/verify", as: PlatformAdmin }
            - { call: "POST /api/closings", payload: { auction_id: "${a_id}", target_closing_date: "2026-09-01T00:00:00Z", payoff_amount: 0 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/closings/${c_id}/track-events", payload: { axis: "TITLE", event: "ORDER_COMMITMENT" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/closings/${c_id}/track-events", payload: { axis: "TITLE", event: "RECEIVE_COMMITMENT" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/closings/${c_id}/track-events", payload: { axis: "TITLE", event: "CLEAR" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/closings/${c_id}/track-events", payload: { axis: "SURVEY", event: "WAIVE", seller_consent: true }, as: BrokerAgent, as_user_id: "${g_id}" }
          trigger:
            - { call: "POST /api/statements", payload: { closing_id: "${c_id}", variant: "FINAL" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { comm: $.data.commission_amount, net: $.data.seller_net, costs: $.data.allocated_seller_costs } }
          assert:
            - "comm == 31900.00 (tiers 15000.00 + 11250.00 + 2700.00 = 28950.00 base; kicker 0.005 x 590000 = 2950.00 because 590000 >= 1.10 x 533988 = 587386.80; floor 7500 not binding)"
            - "costs == 4175.00 (1500 + 0.002 x 590000 + 1200 x 1 + 0.001 x 590000 x 0.5)"
            - "net == 553925.00"

      - name: closing_cost_allocation_per_tract_rounding_order
        grounds:
          - calculations.closing_cost_allocation
          - entities.SettlementStatement.fields.tract_allocations
        distinguishing_aspect: |
          Mode (b) combinatorial (distinct from mode (a) instance above): nested rounding where the
          pinned order is per-tract round_half_up FIRST, then residual to the highest tract_number.
          Exact division would give 5038.2973/2361.7027; the pinned order yields 5038.30/2361.70
          and the tract_allocations array MUST show the rounded per-tract values summing to exactly
          7400.00 — a sum-then-round implementation exposes different per-tract cents.
        test_recipe:
          setup:
            - "Same awarded COMBINATION flow as net_sheet_provisional_vs_final_diverge: T1 appraisal 924373, T2 appraisal 433300, gross 1400000, closing READY_TO_CLOSE"
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2025-09-01T00:00:00Z", sale_price_total: 780000, gross_acres: 120, tillable_acres: 60, soil_productivity_index: 65 }, as: PlatformAdmin }
            - { call: "POST /api/comparables", payload: { county: "Polk", state_code: "IA", sale_date: "2024-09-01T00:00:00Z", sale_price_total: 550000, gross_acres: 100, tillable_acres: 50, soil_productivity_index: 55 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { full_name: "Buyer Three", email: "b3@x.com", proof_of_funds_amount: 2000000 }, as: PlatformAdmin, captures: { b3_id: $.data.id } }
            - { call: "POST /api/buyers/${b3_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L1", county: "Dallas", state_code: "IA", total_gross_acres: 160, packaging_strategy: "COMBINATION", reserve_price_total: 1200000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 100, tillable_acres: 90, soil_productivity_index: 80, min_price: 700000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t1_id: $.data.id } }
            - { call: "GET /api/listings/${l_id}", as: BrokerAgent, as_user_id: "${g_id}", captures: { l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 2, gross_acres: 60, tillable_acres: 30, soil_productivity_index: 70, min_price: 350000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t2_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t1_id}", mineral_rights: "CONVEYED", wind_rights: "RESERVED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/rights", payload: { tract_id: "${t2_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "ONLINE", scheduled_start: "2026-08-10T17:00:00Z", scheduled_end: "2026-08-10T19:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T17:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/open", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
