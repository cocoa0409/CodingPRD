    roles: [TravelManager]
    code: 200
    input: [confirmed_count]
    output: GroupBooking
    side_effects: ["status -> CONFIRMED"]

  - method: POST
    path: "/tmc/group-bookings/{id}/release"
    description: "Release a confirmed group block back to vendor capacity"
    roles: [TravelManager]
    code: 200
    input: []
    output: GroupBooking
    side_effects: ["status -> RELEASED"]

  - method: POST
    path: "/tmc/group-bookings/{id}/cancel"
    description: "Cancel a held group block"
    roles: [TravelManager]
    code: 200
    input: []
