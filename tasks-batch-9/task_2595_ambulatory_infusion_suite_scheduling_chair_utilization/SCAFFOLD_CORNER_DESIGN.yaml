            - call: "POST /appointments"
              payload: { center_id: "${ctr_home}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp_away_ref}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
