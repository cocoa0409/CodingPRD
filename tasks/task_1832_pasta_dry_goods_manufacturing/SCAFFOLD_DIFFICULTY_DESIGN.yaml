            - call: "GET /finished-goods-lots"
              payload: { run_id: "${run_id}" }
              as: WarehouseClerk
              captures: { goods_id: "$.data[0].id" }
            - call: "POST /finished-goods-lots/${goods_id}/put-away"
              payload: { zone_id: "${zone_id}" }
              as: WarehouseClerk
          trigger:
            - call: "POST /finished-goods-lots/${goods_id}/release"
              payload: {}
              as: WarehouseClerk
              captures: { blocked_err: $.data.error_id }
            - call: "POST /production-runs/${run_id}/quality-release"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /finished-goods-lots/${goods_id}/release"
              payload: {}
              as: WarehouseClerk
          assert:
            - "blocked_err == ERR_RUN_QUALITY_NOT_RELEASED (run disposition PENDING_QA)"
            - "After quality-release: run.quality_disposition == RELEASED"
            - "Retry release succeeds: FinishedGoodsLot.${goods_id}.status == RELEASED"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_buffered_interval_overlap_half_open
        grounds:
          - calculations.changeover_minutes
          - errors[ERR_LINE_WINDOW_OVERLAP]
          - concurrency_rules[run-create-stale-line]
        distinguishing_aspect: |
          Interval semantics on ProductionLine: half-open buffered occupancy
          [start - changeover, end). A run starting exactly at its predecessor's end still
          collides because its own 30-minute changeover buffer reaches into the predecessor;
          starting 30 minutes later makes the buffered intervals merely touch (half-open
          adjacency) and is accepted. changeover values: 45 (no predecessor) vs 30 (LONG->LONG).
        test_recipe:
          setup:
            - "ACTIVE contract; lot received; LONG_CUT recipe approved; line L-OVL (no die mounted -> wear adder 0)"
            - "Run1 window 2026-08-10T00:00:00Z..2026-08-11T00:00:00Z created"
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-OVL", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-01", received_weight_kg: 1000.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
            - call: "POST /recipes"
              payload: { recipe_name: "Spaghetti OVL", brand_type: "BRANDED", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0, min_protein_pct: 12.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { r_id: $.data.id }
            - call: "POST /recipes/${r_id}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /production-lines"
              payload: { line_name: "L-OVL" }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "GET /production-lines/${line_id}"
              as: ProductionOperator
              captures: { lv1: $.data.version }
            - call: "POST /production-runs"
              payload: { recipe_id: "${r_id}", line_id: "${line_id}", semolina_lot_id: "${lot_id}", planned_input_kg: 100.0, scheduled_start: "2026-08-10T00:00:00Z", scheduled_end: "2026-08-11T00:00:00Z", expected_line_version: "${lv1}" }
              as: ProductionOperator
              captures: { run1_id: $.data.id, cho1: $.data.changeover_minutes }
            - call: "GET /production-lines/${line_id}"
              as: ProductionOperator
              captures: { lv2: $.data.version }
          trigger:
            - call: "POST /production-runs"
              payload: { recipe_id: "${r_id}", line_id: "${line_id}", semolina_lot_id: "${lot_id}", planned_input_kg: 100.0, scheduled_start: "2026-08-11T00:00:00Z", scheduled_end: "2026-08-12T00:00:00Z", expected_line_version: "${lv2}" }
              as: ProductionOperator
              captures: { overlap_err: $.data.error_id }
            - call: "POST /production-runs"
              payload: { recipe_id: "${r_id}", line_id: "${line_id}", semolina_lot_id: "${lot_id}", planned_input_kg: 100.0, scheduled_start: "2026-08-11T00:30:00Z", scheduled_end: "2026-08-12T00:30:00Z", expected_line_version: "${lv2}" }
              as: ProductionOperator
              captures: { run3_id: $.data.id, cho3: $.data.changeover_minutes }
          assert:
            - "ProductionRun.${run1_id}.changeover_minutes == 45 (NONE predecessor base)"
            - "overlap_err == ERR_LINE_WINDOW_OVERLAP — run2 occupancy [2026-08-10T23:30, 2026-08-12T00:00) intersects run1 occupancy [2026-08-09T23:15, 2026-08-11T00:00)"
            - "ProductionRun.${run3_id} created (201): occupancy [2026-08-11T00:00, 2026-08-12T00:30) only touches run1's end — half-open adjacency permitted"
            - "ProductionRun.${run3_id}.changeover_minutes == 30 (LONG_CUT -> LONG_CUT same-family base; wear 0; allergen 0)"

      - name: contract_window_closed_interval_overlap
        grounds:
          - state_machines.IngredientContract.DRAFT_to_ACTIVE
          - errors[ERR_CONTRACT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Different resource and different interval semantics than the line rule: contract
          windows are CLOSED intervals — both endpoints inclusive — so a second SEMOLINA
          contract whose effective_start equals the ACTIVE contract's effective_end
          (2026-08-31) conflicts, while a 2026-09-01 start is accepted. No buffer arithmetic.
        test_recipe:
          setup:
            - "Contract A SEMOLINA 2026-01-01..2026-08-31 ACTIVE"
            - "Contract B SEMOLINA 2026-08-31..2026-12-31 DRAFT (shares the endpoint date)"
            - "Contract C SEMOLINA 2026-09-01..2026-12-31 DRAFT (first non-overlapping day)"
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-WA", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-08-31" }
              as: ProcurementManager
              captures: { ca_id: $.data.id }
            - call: "POST /ingredient-contracts/${ca_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-WB", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 520, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-08-31", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { cb_id: $.data.id }
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-WC", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 520, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-09-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { cc_id: $.data.id }
          trigger:
            - call: "POST /ingredient-contracts/${cb_id}/activate"
              payload: {}
              as: PlantManager
              captures: { overlap_err: $.data.error_id }
            - call: "POST /ingredient-contracts/${cc_id}/activate"
              payload: {}
              as: PlantManager
          assert:
            - "overlap_err == ERR_CONTRACT_WINDOW_OVERLAP (closed intervals: 2026-08-31 belongs to both windows)"
            - "Contract B remains DRAFT"
            - "Contract C activates to ACTIVE (2026-09-01 is strictly after A's end)"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: semolina_mass_conservation_consume_then_refund
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_MIXING
          - state_machines.ProductionRun.MIXING_to_ABORTED
          - entities.SemolinaLot.fields.consumed_kg
        distinguishing_aspect: |
          Conserved quantity = semolina mass (kg): received == remaining + consumed at every
          step. Forward consume (MIXING: 500 -> 300/200) paired with its compensation (abort
          from MIXING refunds: -> 500/0) leaves the lot exactly as before; a second full
          consume (500/500 -> 0/500) closes the invariant at the DEPLETED boundary.
        test_recipe:
          setup:
            - "ACTIVE contract; ACCEPTED lot exactly 500 kg; recipe approved; line L-INV with die"
            - "Run1 planned 200 kg window 2026-08-10; clock at window start"
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-INV", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-01", received_weight_kg: 500.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
