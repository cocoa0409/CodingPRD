# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID/X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed Customer X-User-ID does not own the target project/draw/change-order" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist within its parent" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed required field, enum out of range, non-positive dimension/quantity, or bps out of bounds" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_CROSS_SHOP_REFERENCE, http: 409, condition: "Referenced material/machine/project belongs to a different shop" }
  - { id: ERR_NO_SPECS, http: 409, condition: "Project measure attempted with zero CabinetSpec rows" }
  - { id: ERR_FINISH_REQUIRED, http: 409, condition: "Project quote/contract attempted with no active FinishSelection" }
  - { id: ERR_MACHINE_OFFLINE, http: 409, condition: "BuildJob start while machine status==OFFLINE" }
  - { id: ERR_MACHINE_TIME_CONFLICT, http: 409, condition: "BuildJob interval (with changeover buffer) collides with another job on the same machine" }
  - { id: ERR_INSTALL_CAPACITY_FULL, http: 409, condition: "Installation create exceeds Shop.max_installs_per_day for install_date" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Reservation sheets exceed Material.available_sheets at create time" }
  - { id: ERR_DEPOSIT_UNPAID, http: 409, condition: "First BuildJob attempted before deposit fully paid (paid_to_date < deposit_required)" }
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 409, condition: "Draw issue or project contract while Customer.credit_hold==true" }
  - { id: ERR_EMPTY_DRAW, http: 409, condition: "Draw issue while amount_cents==0" }
  - { id: ERR_BUILD_INCOMPLETE, http: 409, condition: "mark-ready while some BuildJob not COMPLETE" }
  - { id: ERR_CHANGE_OPEN, http: 409, condition: "mark-ready while a ChangeOrder is SUBMITTED or REVISING" }
  - { id: ERR_MAJOR_PUNCH_OPEN, http: 409, condition: "Installation complete with an OPEN MAJOR PunchItem" }
  - { id: ERR_PUNCH_OPEN, http: 409, condition: "Project close while any PunchItem is OPEN" }
  - { id: ERR_NOTHING_TO_REOPEN, http: 409, condition: "Installation reopen with no OPEN PunchItem" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 409, condition: "Project close while paid_to_date < contract_total" }
  - { id: ERR_DEPOSIT_PAID_NO_CANCEL, http: 409, condition: "Cancel CONTRACTED project after deposit already paid (paid_to_date>0)" }
  - { id: ERR_RESERVATION_LOCKED, http: 409, condition: "Release a COMMITTED reservation while project is IN_PRODUCTION" }
  - { id: ERR_SPECS_LOCKED, http: 409, condition: "Spec add/delete after specs LOCKED (project CONTRACTED or later)" }
  - { id: ERR_PROJECT_NOT_READY, http: 409, condition: "Installation start while project not READY_FOR_DELIVERY" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_project_version does not equal Project.version on a guarded write" }
  - { id: ERR_VALIDATION_PAGINATION, http: 422, condition: "limit/offset out of bounds (limit 1..100, offset>=0)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Operational superset: every operation in the shop, including all manager/designer/installer actions and config."
    identity: "opaque"
    exclusive_operations:
      - "POST /shops — create shop"
      - "POST /_clock/set_current_utc — set test clock"
    shared_operations:
      - "All ShopManager, Designer, and Installer operations (superset)"

  - name: ShopManager
    description: "Runs production: materials, machines, reservations, build scheduling, draws (issue/void/create progress), change-order authoring, mark-ready/close/cancel."
    identity: "opaque"
    exclusive_operations:
      - "POST .../materials, .../materials/{id}/restock — material stock"
      - "POST/PATCH .../machines — machine config"
      - "POST .../material-reservations(/commit|/release) — reservation lifecycle"
      - "POST .../build-jobs(/start|/complete|/cancel) — build scheduling"
      - "POST .../draws, .../draws/{id}/issue, .../draws/{id}/void — draw billing"
      - "POST .../change-orders, .../change-orders/{id}/submit|/resubmit|/cancel — change-order authoring"
      - "POST .../projects/{id}/mark-ready|/close|/cancel — production milestones"
      - "PATCH .../customers/{id} — credit hold toggle"
    shared_operations:
      - "Designer operations (project/spec/finish authoring, measure/quote/revise)"
      - "Installer operations (installation/punch lifecycle)"

  - name: Designer
    description: "Design & measure: customers, projects, specs, finish selection, measure/quote/revise, cut-list read."
    identity: "opaque"
    exclusive_operations:
      - "POST .../specs, DELETE .../specs/{id} — cabinet specs"
      - "POST .../finish-selections — finish selection"
    shared_operations:
      - "POST .../customers, .../projects — create customer/project (shared with ShopManager/ShopAdmin)"
      - "POST .../projects/{id}/measure|/quote|/revise — design milestones"
      - "GET .../cut-list — cut list read"

  - name: Customer
    description: "The buyer: approves the contract, pays draws, approves/rejects/requests-revision on change orders. Acts only on their own projects."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST .../projects/{id}/contract — accept contract (OCC)"
      - "POST .../draws/{id}/pay — pay a draw"
      - "POST .../change-orders/{id}/approve|/reject|/request-revision — change-order decisions"
    shared_operations:
      - "GET on own shop/customer/project/draw/change-order/installation/punch-item resources"

  - name: Installer
    description: "Delivery & install crew: schedules and runs installations, walkthrough, punch items, reopen, complete."
    identity: "opaque"
    exclusive_operations:
      - "POST .../installations(/start|/walkthrough|/reopen|/complete|/cancel) — install lifecycle"
      - "POST .../punch-items, .../punch-items/{id}/resolve — punch/touch-up"
    shared_operations:
      - "GET on installation/punch-item/project resources"
