          trigger:
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct_data}", identifier: "TR01-C01", application: "CAMERA", horizontal_length_m: 40.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { err: $.data.error_id }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct_multi}", identifier: "TR01-C02", application: "CAMERA", horizontal_length_m: 40.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link_ok: $.data.id }
          assert:
            - "the first link creation returns 422 with data.error_id == \"ERR_APPLICATION_NOT_SUPPORTED\""
            - "the second link creation returns 201 with application == \"CAMERA\" and cable_type_id == ${ct_multi}"
            - "GET /cabling/projects/${proj} returns total_link_count == 1"

      - name: a_thin_bonding_conductor_is_refused_before_any_measurement_is_stored
        claim_type: violation_to_error
        grounds:
          - validations[priority=95]
          - state_machines.TelecomRoom.ROUGH_IN_to_GROUNDED
          - errors[ERR_BONDING_NON_COMPLIANT]
        distinguishing_aspect: "The conductor gate at priority 95 runs before the resistance grading, so a #8 AWG submission is refused outright with 422 and leaves grounding_status UNVERIFIED rather than NON_COMPLIANT — an implementation that grades first would store a verdict."
        test_recipe:
          setup: ["Project RVT1 with room TR01 in ROUGH_IN and no grounding verification yet"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id, room_v1: $.data.version }
          trigger:
            - call: "POST /cabling/telecom-rooms/${room}/grounding-verification"
              payload: { tgb_installed: true, bonding_conductor_awg: 8, ground_resistance_milliohms: 100.00 }
              as: ProjectManager
              captures: { err: $.data.error_id }
            - call: "POST /cabling/telecom-rooms/${room}/grounding-verification"
              payload: { tgb_installed: true, bonding_conductor_awg: 6, ground_resistance_milliohms: 5000 }
              as: ProjectManager
          assert:
            - "the #8 AWG submission returns 422 with data.error_id == \"ERR_BONDING_NON_COMPLIANT\""
            - "immediately after that refusal GET /cabling/telecom-rooms/${room} returns grounding_status == \"UNVERIFIED\", room_state == \"ROUGH_IN\" and version == ${room_v1}"
            - "the #6 AWG submission returns 200 with grounding_status == \"COMPLIANT\" and room_state == \"GROUNDED\""
            - "GET /cabling/telecom-rooms/${room} returns bonding_conductor_awg == 6 and ground_resistance_milliohms == 5000"

      - name: cross_project_references_are_refused_on_links_and_on_routes
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=100]
          - errors[ERR_CROSS_PROJECT_REFERENCE]
        distinguishing_aspect: "The same 409 fires at two different call sites for two different pairings: a link whose telecom_room_id belongs to another project, and a route whose link and pathway segment belong to different projects — neither is reducible to a 404, because both referenced rows exist."
        test_recipe:
          setup: ["Projects RVT1 and RVT2, each with a room and a segment, plus one link in RVT1"]
          setup_api_calls:
