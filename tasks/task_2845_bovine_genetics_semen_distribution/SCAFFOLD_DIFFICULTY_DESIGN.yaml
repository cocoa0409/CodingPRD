              as: ProgramDirector
              captures: { ev1: "$.data.id" }
            - call: "POST /genetics/genomic-evaluations/${ev1}/publish"
              payload: {}
              as: ProgramDirector
            - call: "GET /genetics/sires/${a_id}"
              payload: {}
              as: ProgramDirector
              captures: { a_ver2: "$.data.version" }
            - call: "POST /genetics/sires/${a_id}/genomic-evaluations"
              payload: { milk_kg: 700, fat_kg: 30, protein_kg: 24, somatic_cell_score: 2.95, fertility_pct: 1.0, longevity_months: 1.0, reliability_pct: 98, progeny_daughter_count: 60, effective_at: "2026-07-20T00:00:00Z", expected_sire_version: "${a_ver2}" }
              as: ProgramDirector
              captures: { ev2: "$.data.id" }
          trigger:
            - call: "POST /genetics/genomic-evaluations/${ev2}/publish"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/genomic-evaluations/${ev1}/publish"
              payload: {}
              as: ProgramDirector
          assert:
            - "After the first trigger call: GenomicEvaluation.${ev2}.status == PUBLISHED and supersedes_evaluation_id == ${ev1}"
            - "After the first trigger call: GenomicEvaluation.${ev1}.status == SUPERSEDED and Sire.${a_id}.published_composite_index == 34.95"
            - "After the second trigger call: GenomicEvaluation.${ev1}.status == PUBLISHED and supersedes_evaluation_id == ${ev2}"
            - "After the second trigger call: GenomicEvaluation.${ev2}.status == SUPERSEDED and Sire.${a_id}.published_composite_index == 62.37"
