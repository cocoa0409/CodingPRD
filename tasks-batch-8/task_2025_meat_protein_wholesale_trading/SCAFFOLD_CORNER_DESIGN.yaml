    instances:
      - name: immediate_visibility_after_write
        claim_type: immediate
        grounds: [complexity_profile]
        distinguishing_aspect: "Consistency model immediate: a created supplier is fully readable by its own id in the next request with version == 1 and all input fields echoed."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/suppliers", payload: { name: "Immed", establishment_number: "EST-IM", contact_email: "ops@immed.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
