      - name: sealing_an_already_sealed_frame_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_FRAME_STATE_INVALID
          - state_machines.SamplingFrame.DRAFT_to_SEALED
          - validations.priority_13
        distinguishing_aspect: "Seal is declared only from DRAFT, so a second seal on a SEALED frame is a state failure (409 ERR_FRAME_STATE_INVALID) and not an idempotent 200. The frame must be left untouched: the slots seeded by the first seal must not be re-seeded, which would silently reset consumed capacity."
        test_recipe:
          setup: ["one ACTIVE program, one internal analyst, one frame with quota_lost 1 that has been sealed once (no draw yet)"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
            - call: POST /programs/${p_id}/activate
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /analysts
              payload: { program_id: "${p_id}", full_name: "Ana One", linked_user_ref: "user-ana-1", employment_type: "INTERNAL", certified_until: "2027-01-01T00:00:00.000Z", sales_org_member: false }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { a1_id: $.data.id }
            - call: POST /sampling-frames
              payload: { program_id: "${p_id}", label: "Wave 1", window_start: "2026-04-01T00:00:00.000Z", window_end: "2026-07-01T00:00:00.000Z", quota_won: 0, quota_lost: 1, quota_no_decision: 0, selection_basis: "STRATIFIED_BY_SEGMENT" }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
              captures: { f1_id: $.data.id }
            - call: POST /sampling-frames/${f1_id}/seal
              payload: {}
              as: ResearchAnalyst
              as_user_id: ${a1_id}
          trigger:
            - call: POST /sampling-frames/${f1_id}/seal
              payload: {}
              as: ResearchAnalyst
              as_user_id: ${a1_id}
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_FRAME_STATE_INVALID\""
            - "GET /sampling-frames/${f1_id} returns status == \"SEALED\""
            - "GET /sampling-frames/${f1_id} returns open_lost_slots == 1 and selected_lost_count == 0"

      - name: decline_selection_on_a_deal_that_was_never_drawn_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_DEAL_STATE_INVALID
          - state_machines.Deal.SELECTED_to_DECLINED
          - validations.priority_13
        distinguishing_aspect: "decline-selection is declared only from SELECTED. A deal that exists but was never drawn is still NOT_SELECTED, so the call is 409 ERR_DEAL_STATE_INVALID — not 404 (the deal resolves) and not a no-op 200 that would strand the deal in DECLINED without ever having consumed a sampling slot."
        test_recipe:
          setup: ["one ACTIVE program, one competitor, one internal analyst and one LOST deal; no sampling frame is drawn, so the deal stays NOT_SELECTED"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
