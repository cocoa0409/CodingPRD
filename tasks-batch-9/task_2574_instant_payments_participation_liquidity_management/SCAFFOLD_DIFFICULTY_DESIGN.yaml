            - "hop 2: CustomerAccount.${ca_id}.status == RESTRICTED with restricted_at == 2026-08-03T13:30:00Z"
            - "hop 3: CreditTransfer.${t2_id}.clearing_status == QUEUED_THROTTLED with queued_at == 2026-08-03T13:30:00Z"
            - "PrefundedPositionAccount.${acct_id}.reserved_cents == 0 and available_cents == 1200000000 (both reservations released)"
            - "PrefundedPositionAccount.${acct_id}.current_balance_cents == 1200000000 and alert_tier == GREEN (a block moves no money)"
            - "Participant.${pa_id}.operational_posture == NORMAL (the fan-out is scoped to the customer account, not the participant)"
            - "GET /position-accounts/${acct_id}/ledger-entries returns 0 entries"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: send_frozen_state_outranks_insufficient_liquidity_fiscal
        grounds:
          - validations[priority=57]
          - validations[priority=99]
          - errors[ERR_PARTICIPANT_SEND_FROZEN]
          - errors[ERR_INSUFFICIENT_LIQUIDITY]
        distinguishing_aspect: |
          A single request violates a state rule at priority 57 and a business_fiscal rule at
          priority 99, and the two errors carry different HTTP statuses (409 vs 422). Only a
          strictly ordered evaluator returns ERR_PARTICIPANT_SEND_FROZEN with 409; an
          implementation that checks funds first - the intuitive order, since the balance is
          already loaded - returns ERR_INSUFFICIENT_LIQUIDITY with 422 and is detectably wrong.
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a position account of 1,200,000,000 cents (warning 1,100,000,000 / critical 1,000,000,000 / floor 200,000,000) and a CORPORATE policy with per-transaction limit 250,000,000."
            - "Customer account CUST-ALPHA-0001 (CORPORATE, baseline 20) is ACTIVE."
            - "A withdrawal of 1,000,000,000 cents drops the balance to exactly 200,000,000 cents, which is <= critical_threshold_cents, so alert_tier becomes RED and operational_posture becomes SEND_FROZEN."
            - "The clock stays at 2026-08-03T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_v: $.data.version }
            - call: "POST /segment-policies"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 250000000, daily_aggregate_limit_cents: 500000000, rolling_window_count_limit: 5, rolling_window_amount_limit_cents: 400000000, effective_from: "2026-08-01T00:00:00Z", expected_participant_version: "${pa_v}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /customer-accounts"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", account_reference: "CUST-ALPHA-0001", fraud_risk_baseline: 20 }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /settlement-cycles"
              payload: { business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /position-accounts/${acct_id}/ledger-adjustments"
              payload: { entry_type: "WITHDRAWAL_DEBIT", magnitude_cents: 1000000000, reference: "Sweep to correspondent account" }
              as: LiquidityOfficer
              as_user_id: "liq-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v1: $.data.version }
          trigger:
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 100000000, expected_position_account_version: "${acct_v1}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
          assert:
            - "Both rules are genuinely violated by this request: posture is SEND_FROZEN (priority 57) and available_cents - amount_cents == 100000000 which is below floor_cents 200000000 (priority 99)"
            - "The response is HTTP 409 with error_id == ERR_PARTICIPANT_SEND_FROZEN, not HTTP 422 ERR_INSUFFICIENT_LIQUIDITY"
            - "No CreditTransfer row was created for this request"
            - "PrefundedPositionAccount.${acct_id}.current_balance_cents == 200000000, reserved_cents == 0 and alert_tier == RED (the rejected request had no side effect)"
            - "The per-transaction limit 250000000 is NOT violated by 100000000, so priority 92 plays no part in the ordering"

      - name: model_safety_outranks_per_transaction_constraint
        grounds:
          - validations[priority=65]
          - validations[priority=92]
          - validations[priority=94]
          - validations[priority=95]
          - errors[ERR_SEND_NOT_PERMITTED_FOR_MODEL]
        distinguishing_aspect: |
