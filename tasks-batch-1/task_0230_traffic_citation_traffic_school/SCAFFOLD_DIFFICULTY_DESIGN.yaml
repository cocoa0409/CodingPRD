# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Traffic Citation Payment & Traffic School — Expert tier
# 9 rule_ids x >= 2 instances = 18 instances total.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Standard jurisdiction A config used throughout (created by the recipe itself):
#   base_court_fee_cents=5000, surcharge_pct=0.20, late_penalty_cents=3000,
#   installment_setup_fee_cents=2500, min_installment_cents=2000,
#   collections_age_days=30, collections_fee_pct=0.25, traffic_school_fee_cents=4000,
#   school_eligible_max_points=1, school_cooldown_months=18,
#   point_suspension_threshold=4, point_window_months=12.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: installment_schedule_vs_chronological_citation_balance
        grounds:
          - calculations.installment_schedule
          - calculations.citation_balance
          - entities.InstallmentPlan.fields.principal_cents
          - entities.Citation.fields.balance_cents
        distinguishing_aspect: |
          Same paid amount feeds two valid algorithms on DIFFERENT entity domains:
          the forward-looking InstallmentPlan schedule (principal includes the
          setup fee, remainder folded into the final installment) vs the
          chronological Citation.balance_cents (assessed_total + penalty - POSTED
          payments). After paying installment 1 they read different numbers
          (schedule_remaining 23625 vs Citation.balance_cents 21125).
        test_recipe:
          setup:
            - "Jurisdiction A; driver D1; citation C with one charge base_fine_cents=19999, points=1; assessed_total_cents=28999, balance_cents=28999 (ASSESSED)."
            - "An ACTIVE InstallmentPlan over term_count=4 (principal_cents=31499, installments 7874/7874/7874/7877)."
            - "One payment of 7874 posted against installment 1."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "D1LIC", full_name: "Dana One" }
              as: CourtClerk
              captures: { d1: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d1}", citation_number: "C-DV1", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${cid}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 19999, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
              captures: { cver: $.data.version }
            - call: "POST /citations/${cid}/installment-plans"
              payload: { term_count: 4, first_due_at: "2026-03-01T00:00:00Z", expected_citation_version: "${cver}" }
              as: Driver
              as_user_id: "${d1}"
              captures: { plan: $.data.id }
            - call: "GET /installments"
              payload: {}
              as: CourtClerk
              captures: { inst1: "$.data[0].id" }
            - call: "POST /citations/${cid}/payments"
              payload: { amount_cents: 7874, method: "CARD", installment_id: "${inst1}" }
              as: Driver
              as_user_id: "${d1}"
          trigger:
            - call: "GET /citations/${cid}"
              payload: {}
              as: Driver
              as_user_id: "${d1}"
              captures: { bal: $.data.balance_cents }
            - call: "GET /installment-plans/${plan}"
              payload: {}
              as: Driver
              as_user_id: "${d1}"
          assert:
            - "Citation.${cid}.balance_cents == 21125"
            - "InstallmentPlan.${plan}.principal_cents == 31499"
            - "InstallmentPlan.${plan}.installment_cents == 7874"
            - "Citation.${cid}.balance_cents (21125) != sum of remaining scheduled Installment.amount_cents (23625)"

      - name: raw_posted_points_vs_active_windowed_point_balance
        grounds:
          - calculations.driver_point_balance
          - calculations.point_reduction
          - entities.Driver.fields.point_balance
          - entities.PointLedgerEntry.fields.state
        distinguishing_aspect: |
          Two valid readings of the SAME posted points on the Driver/PointLedger
          domain diverge: the raw count of all PointLedgerEntry.points (2) vs the
          authoritative Driver.point_balance which sums only ACTIVE entries inside
          the rolling window (0 after traffic-school masks them). The masked entry
          still exists in the ledger but no longer contributes.
        test_recipe:
          setup:
            - "Jurisdiction A; driver D2; citation C2 with one charge points=1 base_fine_cents=10000; contest filed, hearing set, UPHELD -> 1 PointLedgerEntry(points=1, ACTIVE)."
            - "Wait: school requires fine PAID; pay C2 fully first, then enroll and complete traffic school -> the 1-point entry masked."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: CourtClerk
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "D2LIC", full_name: "Dee Two" }
              as: CourtClerk
              captures: { d2: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d2}", citation_number: "C-DV2", issued_at: "2026-01-04T00:00:00Z", appear_by: "2026-02-04T00:00:00Z" }
              as: CourtClerk
              captures: { c2: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${c2}", violation_code: "VC21453", description: "Red light", base_fine_cents: 10000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${c2}/assess"
              payload: {}
              as: CourtClerk
            - call: "POST /citations/${c2}/contest-requests"
              payload: { grounds: "Camera malfunction" }
              as: Driver
              as_user_id: "${d2}"
              captures: { req: $.data.id }
            - call: "POST /contest-requests/${req}/schedule"
              payload: { hearing_at: "2026-03-01T00:00:00Z" }
              as: CourtClerk
            - call: "POST /contest-requests/${req}/decide"
              payload: { verdict: "UPHOLD" }
              as: HearingOfficer
            - call: "POST /citations/${c2}/payments"
              payload: { amount_cents: 17000, method: "CARD" }
              as: Driver
              as_user_id: "${d2}"
            - call: "POST /citations/${c2}/enrollments"
              payload: { completion_due_at: "2026-04-01T00:00:00Z" }
              as: Driver
              as_user_id: "${d2}"
              captures: { enr: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr}/complete"
              payload: {}
              as: CourtClerk
            - call: "GET /drivers/${d2}"
              payload: {}
              as: DmvAdmin
            - call: "GET /point-ledger"
              payload: {}
              as: DmvAdmin
          assert:
            - "Driver.${d2}.point_balance == 0"
            - "TrafficSchoolEnrollment.${enr}.points_reduced == 1"
            - "Exactly one PointLedgerEntry for citation ${c2} exists with state == MASKED (raw points still 1, but excluded from balance)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: assessed_total_surcharge_rounded_before_court_fee_add
        grounds:
          - calculations.assessed_total
          - entities.Citation.fields.assessed_total_cents
          - entities.Jurisdiction.fields.surcharge_pct
        distinguishing_aspect: |
          Mode (b) nested-rounding order: surcharge = round_half_up(base_fine *
          surcharge_pct) is rounded BEFORE the integer court fee is added, so the
          court fee never sits inside the rounding boundary. With base 9990 and
          surcharge_pct 0.225, surcharge=2248 (9990*0.225=2247.75 -> half-up),
          assessed_total = 9990 + 5000 + 2248 = 17238. Rounding the whole
          (base+court)*pct or summing-then-rounding would give a different cent.
        test_recipe:
          setup:
            - "Jurisdiction B with surcharge_pct=0.225, base_court_fee_cents=5000."
            - "Citation with one charge base_fine_cents=9990, points=0; assessed."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court B", state_code: "NV", base_court_fee_cents: 5000, surcharge_pct: 0.225, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "D3LIC", full_name: "Cee Three" }
              as: CourtClerk
              captures: { d3: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d3}", citation_number: "C-CF1", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { c3: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${c3}", violation_code: "VC22107", description: "Unsafe turn", base_fine_cents: 9990, points: 0 }
              as: CourtClerk
          trigger:
            - call: "POST /citations/${c3}/assess"
              payload: {}
              as: CourtClerk
          assert:
            - "Citation.${c3}.assessed_total_cents == 17238"
            - "Citation.${c3}.balance_cents == 17238"
            - "Citation.${c3}.financial_status == ASSESSED"

      - name: installment_floor_base_with_remainder_to_final
        grounds:
          - calculations.installment_schedule
          - entities.InstallmentPlan.fields.installment_cents
          - entities.Installment.fields.amount_cents
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula: base = floor(principal / term),
          remainder = principal - base*term, and the FINAL installment absorbs the
          entire remainder (not spread). With principal 34500 over term 7, base=4928,
          remainder=4, final=4932; first six are 4928. Different from average-rate or
          spread-remainder schemes.
        test_recipe:
          setup:
            - "Jurisdiction A; citation assessed_total 29000; late penalty 3000 applied -> balance 32000; plan principal = 32000+2500 = 34500 over 7 terms."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: CourtClerk
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "D4LIC", full_name: "Eff Four" }
              as: CourtClerk
              captures: { d4: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d4}", citation_number: "C-CF2", issued_at: "2026-01-04T00:00:00Z", appear_by: "2026-02-04T00:00:00Z" }
              as: CourtClerk
              captures: { c4: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${c4}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${c4}/assess"
              payload: {}
              as: CourtClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-11T00:00:00Z" }
              as: CourtClerk
            - call: "POST /citations/${c4}/apply-late-penalty"
              payload: {}
              as: CourtClerk
              captures: { c4ver: $.data.version }
          trigger:
            - call: "POST /citations/${c4}/installment-plans"
              payload: { term_count: 7, first_due_at: "2026-03-01T00:00:00Z", expected_citation_version: "${c4ver}" }
              as: Driver
              as_user_id: "${d4}"
              captures: { plan4: $.data.id }
            - call: "GET /installments"
              payload: {}
              as: CourtClerk
          assert:
            - "InstallmentPlan.${plan4}.principal_cents == 34500"
            - "InstallmentPlan.${plan4}.installment_cents == 4928"
            - "The 7 Installment.amount_cents values are [4928,4928,4928,4928,4928,4928,4932] (remainder 4 folded into the final installment)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contest_request_cyclic_continuance_loop
        grounds:
          - state_machines.ContestRequest.HEARING_SET_to_CONTINUANCE
          - state_machines.ContestRequest.CONTINUANCE_to_HEARING_SET
          - entities.ContestRequest.fields.continuance_count
        distinguishing_aspect: |
          ContestRequest is cyclic: HEARING_SET -> CONTINUANCE -> HEARING_SET can
          repeat, continuance_count incrementing each loop, capped at 2. Re-entering
          HEARING_SET from CONTINUANCE is the loop edge no linear pipeline has.
        test_recipe:
          setup:
            - "Jurisdiction A; driver D5; citation assessed; contest filed and HEARING_SET."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: CourtClerk
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "D5LIC", full_name: "Gee Five" }
              as: CourtClerk
              captures: { d5: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d5}", citation_number: "C-NL1", issued_at: "2026-01-04T00:00:00Z", appear_by: "2026-02-04T00:00:00Z" }
              as: CourtClerk
              captures: { c5: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${c5}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${c5}/assess"
              payload: {}
              as: CourtClerk
            - call: "POST /citations/${c5}/contest-requests"
              payload: { grounds: "Disputed reading" }
              as: Driver
              as_user_id: "${d5}"
              captures: { req5: $.data.id }
            - call: "POST /contest-requests/${req5}/schedule"
              payload: { hearing_at: "2026-03-01T00:00:00Z" }
              as: CourtClerk
          trigger:
            - call: "POST /contest-requests/${req5}/continue"
              payload: {}
              as: HearingOfficer
            - call: "POST /contest-requests/${req5}/schedule"
              payload: { hearing_at: "2026-03-15T00:00:00Z" }
              as: CourtClerk
            - call: "POST /contest-requests/${req5}/continue"
              payload: {}
              as: HearingOfficer
            - call: "GET /contest-requests/${req5}"
              payload: {}
              as: HearingOfficer
          assert:
            - "ContestRequest.${req5}.continuance_count == 2"
            - "ContestRequest.${req5}.status == CONTINUANCE"
            - "A subsequent /continue would return ERR_CONTINUANCE_LIMIT (count == 2)"

      - name: citation_parallel_financial_and_adjudication_dimensions
        grounds:
          - state_machines.Citation.ASSESSED_to_PARTIALLY_PAID
          - entities.Citation.fields.financial_status
          - entities.Citation.fields.adjudication_status
          - state_machines.ContestRequest.initial_state
        distinguishing_aspect: |
          Two independent state dimensions evolve on the SAME Citation row:
          financial_status reaches PARTIALLY_PAID via a payment while
          adjudication_status reaches CONTESTED via a contest filing. Neither
          transition constrains the other — a parallel-dimensions machine, on a
          different entity than the cyclic ContestRequest above.
        test_recipe:
          setup:
            - "Jurisdiction A; driver D6; citation assessed (29000); a partial payment of 10000 posted (PARTIALLY_PAID); then a contest filed (CONTESTED)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "D6LIC", full_name: "Aitch Six" }
              as: CourtClerk
              captures: { d6: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d6}", citation_number: "C-NL2", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { c6: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${c6}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${c6}/assess"
              payload: {}
              as: CourtClerk
            - call: "POST /citations/${c6}/payments"
              payload: { amount_cents: 10000, method: "CASH" }
              as: Driver
              as_user_id: "${d6}"
          trigger:
            - call: "POST /citations/${c6}/contest-requests"
              payload: { grounds: "Wrong driver" }
              as: Driver
              as_user_id: "${d6}"
            - call: "GET /citations/${c6}"
              payload: {}
              as: Driver
              as_user_id: "${d6}"
          assert:
            - "Citation.${c6}.financial_status == PARTIALLY_PAID"
            - "Citation.${c6}.adjudication_status == CONTESTED"
            - "Citation.${c6}.balance_cents == 19000"
            - "Citation.${c6}.disposition == OPEN (neither dimension has reached a closing state)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_paid_releases_hold_rederives_license_reevaluates_points
        grounds:
          - state_machines.Citation.PARTIALLY_PAID_to_PAID
          - state_machines.LicenseHold.OPEN_to_RELEASED
          - calculations.license_status
          - calculations.driver_point_balance
        distinguishing_aspect: |
          Depth-3 cascade from a single payment: Citation -> PAID causes (1) the OPEN
          NONPAYMENT_HOLD for that citation -> RELEASED, which causes (2) Driver.license_status
          to be re-derived, which causes (3) a re-evaluation of Driver point suspension.
          Each link is caused by the previous link, not by the payment directly.
        test_recipe:
          setup:
            - "Jurisdiction A; driver D7; citation assessed (29000); clock past appear_by; late penalty applied -> NONPAYMENT_HOLD opened, license_status HELD, balance 32000."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: CourtClerk
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "D7LIC", full_name: "Jay Seven" }
              as: CourtClerk
              captures: { d7: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d7}", citation_number: "C-TC1", issued_at: "2026-01-04T00:00:00Z", appear_by: "2026-02-04T00:00:00Z" }
              as: CourtClerk
              captures: { c7: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${c7}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${c7}/assess"
              payload: {}
              as: CourtClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-11T00:00:00Z" }
              as: CourtClerk
            - call: "POST /citations/${c7}/apply-late-penalty"
              payload: {}
              as: CourtClerk
          trigger:
            - call: "POST /citations/${c7}/payments"
              payload: { amount_cents: 32000, method: "CARD" }
              as: Driver
              as_user_id: "${d7}"
            - call: "GET /drivers/${d7}"
              payload: {}
              as: DmvAdmin
            - call: "GET /license-holds"
              payload: {}
              as: DmvAdmin
          assert:
            - "Citation.${c7}.financial_status == PAID"
            - "Citation.${c7}.balance_cents == 0"
            - "The NONPAYMENT_HOLD LicenseHold for citation ${c7} has status == RELEASED"
            - "Driver.${d7}.license_status == VALID"

      - name: school_completion_masks_points_releases_point_suspension
        grounds:
          - state_machines.TrafficSchoolEnrollment.ENROLLED_to_COMPLETED
          - calculations.point_reduction
          - calculations.driver_point_balance
          - state_machines.LicenseHold.OPEN_to_RELEASED
        distinguishing_aspect: |
          Depth-2 cascade from a school completion (a DIFFERENT trigger than the
          payment cascade above): COMPLETE masks this citation's ACTIVE point entries,
          and that masking re-evaluates point suspension which RELEASES the
          POINT_SUSPENSION hold and re-derives license_status. The single 2-point
          school-eligible citation drops the driver below threshold.
        test_recipe:
          setup:
            - "Jurisdiction A but with school_eligible_max_points=2; driver D8 has two UPHELD citations each 2 points => point_balance 4 => POINT_SUSPENSION (SUSPENDED). One of them (Cx) is paid in full and school-eligible."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court C", state_code: "AZ", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 2, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: CourtClerk
            - call: "POST /drivers"
