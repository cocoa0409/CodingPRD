  # SECTION 6 — ERRORS (claim-extraction-guide Table 6)
  # ==========================================================================
  - section: errors
    instances:

      - name: unknown_path_ids_return_entity_specific_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ENERGY_TEST_NOT_FOUND]
          - errors[ERR_COMPLIANCE_LABEL_NOT_FOUND]
          - errors[ERR_STORE_PLAN_NOT_FOUND]
          - errors[ERR_STORE_PLAN_LINE_NOT_FOUND]
          - errors[ERR_WORK_ORDER_NOT_FOUND]
          - errors[ERR_SHIPMENT_NOT_FOUND]
          - errors[ERR_INSTALL_CREW_NOT_FOUND]
          - errors[ERR_INSTALL_BOOKING_NOT_FOUND]
          - errors[ERR_PART_INVENTORY_NOT_FOUND]
          - errors[ERR_WARRANTY_CLAIM_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "Every path id resolves to its own 404 code rather than a generic ERR_NOT_FOUND: the same unresolvable uuid returns ten different error_id values depending on the collection read."
        test_recipe:
          setup:
            - "The store is empty; no rows of any entity exist."
