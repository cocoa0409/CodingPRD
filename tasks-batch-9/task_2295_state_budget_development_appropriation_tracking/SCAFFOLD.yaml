scenario: |
  2295. State Budget Development & Appropriation Tracking (state budget office): agency budget request
  submission with base budget, decision packages and performance measures, revenue forecast integration
  and balancing to constitutional or statutory requirements, executive budget recommendation preparation
  with policy priorities and reduction scenarios, legislative appropriation tracking through committee
  action with running balance calculations, allotment and spending authority release by quarter with cash
  flow constraints, budget amendment, transfer authority and emergency appropriation processes,
  expenditure monitoring against appropriation with reversion and carryforward rules, federal fund
  matching requirements and maintenance-of-effort tracking

domain_name: state-budget-appropriation
api_prefix: /fiscal

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer collection under /fiscal/<collection>; parenthood is expressed
  # purely through FK fields in request bodies, never through nested URL ownership.

  state_machine_shape: cyclic
  # AgencyRequest loops SUBMITTED -> UNDER_REVIEW -> RETURNED_FOR_REVISION -> SUBMITTED;
  # Appropriation carries two independent state dimensions (authority_status, cash_status),
  # the cash dimension itself cycling UNRELEASED -> PARTIALLY_RELEASED -> UNRELEASED on recall
  # and FROZEN -> recomputed on unfreeze.

  relationship_patterns:
    - one_to_many          # BudgetCycle -> AgencyRequest / Appropriation / RevenueForecast
    - self_referential     # DecisionPackage.depends_on_package_id -> DecisionPackage.id
    - many_to_many         # FederalGrant <-> Appropriation through MatchCommitment
    - cross_aggregate      # BudgetTransfer spans two Appropriation aggregates

  role_model: segregation_of_duties
  # The X-User-ID that prepares an Allotment, an ExecutiveRecommendation, or a BudgetTransfer
  # may never be the X-User-ID that approves it, even when the same person holds both roles.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities, 64 endpoints, 54 error codes, 11 calculations (4 with divergent variants),
  # 44 ordered validations, 10 state machines, 3 OCC races, 4 named invariants.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BudgetCycle
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: "Fiscal year label, e.g. 2027"
        constraints: ">= 2000 and <= 2100; unique across BudgetCycle"
      - name: fiscal_year_start_date
        type: string
        source: input
        description: "First calendar day of quarter 1, ISO date (YYYY-MM-DD). Quarter q spans [start + 3*(q-1) months, start + 3*q months) — half-open."
        constraints: "ISO 8601 date"
      - name: phase
        type: enum
        source: system
        description: "Lifecycle phase of the cycle; gates which operations are legal"
        default: DEVELOPMENT
        constraints: "one of DEVELOPMENT|EXECUTIVE_PREP|LEGISLATIVE|ENACTED|EXECUTION|CLOSED"
      - name: constitutional_reserve_pct
        type: number
        source: input
        description: "Fraction of adopted general-fund revenue that must remain unappropriated as constitutional reserve"
        default: 0.05
        constraints: ">= 0 and <= 0.5"
      - name: reserve_balance_cents
        type: integer
        source: input
        description: "Cash held in the budget stabilization reserve, the only funding source for emergency appropriations"
        constraints: ">= 0"
      - name: adopted_general_fund_revenue_cents
        type: integer
        source: computed
        description: "Sum of RevenueForecast.amount_cents where budget_cycle_id == this.id AND status == ADOPTED AND fund_type == GENERAL"
        default: 0
      - name: total_recommended_cents
        type: integer
        source: computed
        description: "Sum of ExecutiveRecommendation.recommended_amount_cents where status == APPROVED and its AgencyRequest.budget_cycle_id == this.id"
        default: 0
      - name: required_reserve_cents
        type: integer
        source: computed
        description: "round_half_up(constitutional_reserve_pct * adopted_general_fund_revenue_cents)"
        default: 0
      - name: balance_certified
        type: boolean
        source: system
        description: "True once the director has certified the recommendation set balances against adopted revenue"
        default: false
      - name: emergency_granted_cents
        type: integer
        source: computed
        description: "Sum of Appropriation.enacted_amount_cents where budget_cycle_id == this.id AND is_emergency == true AND authority_status == ENACTED"
        default: 0
      - name: total_released_cents
        type: integer
        source: computed
        description: "Sum of Appropriation.released_cents over all Appropriation where budget_cycle_id == this.id"
        default: 0
      - name: total_expended_cents
        type: integer
        source: computed
        description: "Sum of Appropriation.expended_cents over all Appropriation where budget_cycle_id == this.id"
        default: 0
      - name: total_reverted_cents
        type: integer
        source: computed
        description: "Sum of Appropriation.reverted_cents over all Appropriation where budget_cycle_id == this.id; written only by the close sweep"
        default: 0
      - name: total_carryforward_cents
        type: integer
        source: computed
        description: "Sum of the per-appropriation Appropriation.carryforward_cents values (each already rounded to the cent) where budget_cycle_id == this.id"
        default: 0
      - name: projected_cumulative_cash_cents
        type: integer
        source: computed
        description: "round_half_up(CASH_FLOW_FACTOR[current_quarter] * adopted_general_fund_revenue_cents), current_quarter derived from the logical clock"
        default: 0
      - name: cash_utilization_pct
        type: number
        source: computed
        description: "round_half_up(total_released_cents / max(1, projected_cumulative_cash_cents), 4)"
        default: 0
      - name: cash_posture
        type: enum
        source: computed
        description: "CONSTRAINED when cash_utilization_pct >= CASH_POSTURE_THRESHOLD (0.90), else NORMAL"
        default: NORMAL
        constraints: "one of NORMAL|CONSTRAINED"

  - name: Agency
    parent: null
    common_fields: true
    fields:
      - name: agency_code
        type: string
        source: input
        description: "Short statewide agency code, e.g. DOH"
        constraints: "1..12 chars, unique across Agency"
      - name: name
        type: string
        source: input
        description: "Legal agency name"
        constraints: "1..200 chars"
      - name: agency_type
        type: enum
        source: input
        description: "Branch classification, drives nothing fiscal but is reported"
        constraints: "one of EXECUTIVE|JUDICIAL|LEGISLATIVE|HIGHER_ED"
      - name: federal_compliance_flag
        type: enum
        source: computed
        description: "CLEAR when no FederalGrant of this agency is AT_RISK or SHORTFALL; AT_RISK when at least one grant is AT_RISK and none SHORTFALL; DEFICIENT when at least one grant is SHORTFALL"
        default: CLEAR
        constraints: "one of CLEAR|AT_RISK|DEFICIENT"

  - name: RevenueForecast
    parent: null
    common_fields: true
    fields:
      - name: budget_cycle_id
        type: string
        source: input
        description: "FK -> BudgetCycle.id; the cycle whose revenue this forecast estimates"
      - name: source_code
        type: string
        source: input
        description: "Revenue source code, e.g. SALES_TAX"
        constraints: "1..32 chars"
      - name: fund_type
        type: enum
        source: input
        description: "Fund the forecast credits; only GENERAL rows feed adopted_general_fund_revenue_cents"
        constraints: "one of GENERAL|FEDERAL|DEDICATED"
      - name: forecast_round
        type: enum
        source: input
        description: "Which consensus round produced the estimate"
        constraints: "one of CONSENSUS_SPRING|CONSENSUS_FALL|REVISED"
      - name: amount_cents
        type: integer
        source: input
        description: "Estimated revenue for the effective window"
        constraints: "> 0"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the window this estimate governs (ISO 8601 UTC)"
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the window this estimate governs (ISO 8601 UTC); must be > effective_from"
      - name: status
        type: enum
        source: system
        description: "Adoption lifecycle"
        default: DRAFT
        constraints: "one of DRAFT|ADOPTED|SUPERSEDED"

  - name: AgencyRequest
    parent: null
    common_fields: true
    fields:
      - name: budget_cycle_id
        type: string
        source: input
        description: "FK -> BudgetCycle.id; the cycle this request is submitted into"
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the requesting agency; must equal X-User-ID for AgencyBudgetOfficer"
      - name: base_budget_cents
        type: integer
        source: input
        description: "Continuation (base) budget the agency needs to keep current services"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle with a revision loop"
        default: DRAFT
        constraints: "one of DRAFT|SUBMITTED|UNDER_REVIEW|RETURNED_FOR_REVISION|ACCEPTED"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times this request has entered RETURNED_FOR_REVISION"
        default: 0
      - name: last_return_reason
        type: string
        source: system
        description: "Reason text of the most recent return-for-revision, null before the first return"
        default: null
      - name: total_request_cents
        type: integer
        source: computed
        description: "base_budget_cents plus the signed sum of its DecisionPackage rows (see calculation agency_request_total)"
        default: 0

  - name: DecisionPackage
    parent: null
    common_fields: true
    fields:
      - name: agency_request_id
        type: string
        source: input
        description: "FK -> AgencyRequest.id; the request this package hangs off"
      - name: depends_on_package_id
        type: string
        source: input
        description: "FK -> DecisionPackage.id; optional prerequisite package that must be RECOMMENDED before this one can be; null when independent"
        default: null
      - name: package_type
        type: enum
        source: input
        description: "EXPANSION and TECHNICAL and FEDERAL_MATCH add to the request; REDUCTION subtracts"
        constraints: "one of EXPANSION|REDUCTION|TECHNICAL|FEDERAL_MATCH"
      - name: priority_rank
        type: integer
        source: input
        description: "Agency-assigned rank; lower rank is funded first"
        constraints: ">= 1; unique within agency_request_id"
      - name: amount_cents
        type: integer
        source: input
        description: "Positive magnitude of the package; for REDUCTION it is the magnitude of savings offered"
        constraints: "> 0"
      - name: fte_delta
        type: number
        source: input
        description: "Full-time-equivalent change requested by the package"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Analyst disposition"
        default: PROPOSED
        constraints: "one of PROPOSED|RECOMMENDED|DEFERRED"

  - name: PerformanceMeasure
    parent: null
    common_fields: false
    fields:
      - name: decision_package_id
        type: string
        source: input
        description: "FK -> DecisionPackage.id; the package this measure justifies"
      - name: measure_code
        type: string
        source: input
        description: "Statewide performance measure code"
        constraints: "1..32 chars"
      - name: unit
        type: enum
        source: input
        description: "Unit of the baseline/target pair"
        constraints: "one of COUNT|PERCENT|DAYS|DOLLARS"
      - name: baseline_value
        type: number
        source: input
        description: "Current measured performance"
        constraints: ">= 0"
      - name: target_value
        type: number
        source: input
        description: "Performance promised if the package is funded; must be > baseline_value"
        constraints: "> baseline_value"

  - name: ExecutiveRecommendation
    parent: null
    common_fields: true
    fields:
      - name: agency_request_id
        type: string
        source: input
        description: "FK -> AgencyRequest.id; the request being recommended on"
      - name: recommended_base_cents
        type: integer
        source: input
        description: "Base budget the executive recommends, may differ from the request"
        constraints: ">= 0"
      - name: recommended_package_ids
        type: array
        source: input
        description: "Array of DecisionPackage.id values to fund; each id must belong to the same agency_request_id and be status RECOMMENDED"
      - name: policy_priority
        type: enum
        source: input
        description: "Governor policy bucket this recommendation is charged to"
        constraints: "one of WORKFORCE|INFRASTRUCTURE|PUBLIC_SAFETY|EDUCATION|HEALTH"
      - name: recommended_amount_cents
        type: integer
        source: computed
        description: "recommended_base_cents plus the signed sum of the listed packages (see calculation executive_recommendation_amount)"
        default: 0
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID that created this recommendation; blocked from approving it"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID that approved this recommendation, null until APPROVED"
        default: null
      - name: status
        type: enum
        source: system
        description: "Preparation lifecycle; a newer recommendation for the same request supersedes the prior one"
        default: PREPARED
        constraints: "one of PREPARED|APPROVED|SUPERSEDED"

  - name: ReductionScenario
    parent: null
    common_fields: false
    fields:
      - name: budget_cycle_id
        type: string
        source: input
        description: "FK -> BudgetCycle.id; the cycle the reduction target is computed against"
      - name: target_reduction_pct
        type: number
        source: input
        description: "Fraction of the accepted base to be cut, e.g. 0.10 for a ten percent scenario"
        constraints: "> 0 and <= 0.5"
      - name: target_reduction_cents
        type: integer
        source: computed
        description: "round_half_up(target_reduction_pct * sum of AgencyRequest.base_budget_cents where status == ACCEPTED and budget_cycle_id == this.budget_cycle_id)"
      - name: selected_package_ids
        type: array
        source: computed
        description: "Ordered array of DecisionPackage.id values chosen by the waterfall, in selection order"
      - name: achieved_reduction_cents
        type: integer
        source: computed
        description: "Cumulative amount_cents of selected_package_ids"
      - name: overshoot_cents
        type: integer
        source: computed
        description: "max(0, achieved_reduction_cents - target_reduction_cents); packages are never split"
      - name: feasibility
        type: enum
        source: computed
        description: "FEASIBLE when achieved_reduction_cents >= target_reduction_cents, else INFEASIBLE"
        constraints: "one of FEASIBLE|INFEASIBLE"

  - name: Appropriation
    parent: null
    common_fields: true
    fields:
      - name: budget_cycle_id
        type: string
        source: input
        description: "FK -> BudgetCycle.id; the cycle the appropriation belongs to"
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the agency receiving spending authority"
      - name: fund_type
        type: enum
        source: input
        description: "Fund the authority is drawn on; drives quarter caps and carryforward caps"
        constraints: "one of GENERAL|FEDERAL|DEDICATED"
      - name: program_code
        type: string
        source: input
        description: "Program / line-item code"
        constraints: "1..32 chars; unique within (budget_cycle_id, agency_id)"
      - name: introduced_amount_cents
        type: integer
        source: input
        description: "Amount as introduced in the appropriation bill, before committee action"
        constraints: ">= 0"
      - name: committee_balance_cents
        type: integer
        source: computed
        description: "Running balance after replaying all CommitteeAction rows of this appropriation in sequence_number ASC order; equals introduced_amount_cents when no action exists"
        default: 0
      - name: enacted_amount_cents
        type: integer
        source: computed
        description: "committee_balance_cents frozen at the moment of enactment; 0 while authority_status == PENDING"
        default: 0
      - name: transfers_in_cents
        type: integer
        source: computed
        description: "Sum of BudgetTransfer.amount_cents where target_appropriation_id == this.id AND status == EXECUTED"
        default: 0
      - name: transfers_out_cents
        type: integer
        source: computed
        description: "Sum of BudgetTransfer.amount_cents where source_appropriation_id == this.id AND status == EXECUTED"
        default: 0
      - name: released_cents
        type: integer
        source: computed
        description: "Sum of Allotment.released_cents where appropriation_id == this.id AND status == RELEASED"
        default: 0
      - name: expended_cents
        type: integer
        source: computed
        description: "Sum of Expenditure.amount_cents where appropriation_id == this.id AND status == POSTED"
        default: 0
      - name: reverted_cents
        type: integer
        source: computed
        description: "Unexpended authority swept back to the fund at cycle close; 0 before close"
        default: 0
      - name: carryforward_cents
        type: integer
        source: computed
        description: "Unexpended authority carried into the next cycle at close, capped per fund_type; 0 before close"
        default: 0
      - name: available_cash_cents
        type: integer
        source: computed
        description: "released_cents - expended_cents (cash basis of available spending room)"
        default: 0
      - name: available_authority_cents
        type: integer
        source: computed
        description: "enacted_amount_cents + transfers_in_cents - transfers_out_cents - expended_cents (authority basis of available spending room)"
        default: 0
      - name: authority_status
        type: enum
        source: system
        description: "Legal-authority dimension of this row, independent of the cash dimension"
        default: PENDING
        constraints: "one of PENDING|ENACTED|LAPSED|CLOSED"
      - name: cash_status
        type: enum
        source: system
        description: "Cash-release dimension of this row, independent of the authority dimension"
        default: UNRELEASED
        constraints: "one of UNRELEASED|PARTIALLY_RELEASED|FULLY_RELEASED|FROZEN"
      - name: pre_freeze_cash_status
        type: enum
        source: system
        description: "cash_status captured immediately before a freeze, used to detect that unfreeze recomputes rather than restores"
        default: null
        constraints: "one of UNRELEASED|PARTIALLY_RELEASED|FULLY_RELEASED or null"
      - name: release_hold
        type: boolean
        source: computed
        description: "True while the owning cycle is CONSTRAINED and this row is GENERAL fund with cash_status == UNRELEASED; blocks allotment preparation"
        default: false
      - name: is_emergency
        type: boolean
        source: system
        description: "True when created through the emergency-appropriation endpoint out of the stabilization reserve"
        default: false
      - name: freeze_reason
        type: string
        source: system
        description: "Reason recorded by the controller when cash was frozen, null when never frozen"
        default: null

  - name: CommitteeAction
    parent: null
    common_fields: false
    fields:
      - name: appropriation_id
        type: string
        source: input
        description: "FK -> Appropriation.id; the line item the committee acted on"
      - name: chamber
        type: enum
        source: input
        description: "Chamber or conference that took the action"
        constraints: "one of HOUSE|SENATE|CONFERENCE"
      - name: committee_name
        type: string
        source: input
        description: "Name of the acting committee"
        constraints: "1..120 chars"
      - name: action_type
        type: enum
        source: input
        description: "SET replaces the balance, INCREASE adds, DECREASE subtracts, RESTORE resets to introduced_amount_cents, STRIKE zeroes the line"
        constraints: "one of SET|INCREASE|DECREASE|RESTORE|STRIKE"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount the action operates with; must be > 0 for SET/INCREASE/DECREASE and must be 0 for RESTORE/STRIKE"
        constraints: ">= 0"
      - name: sequence_number
        type: integer
        source: input
        description: "Position of this action in the committee record; replay order key. Gaps are legal, duplicates are not"
        constraints: ">= 1; unique within appropriation_id"
      - name: running_balance_cents
        type: integer
        source: computed
        description: "Balance after applying this action during a sequence_number ASC replay; recomputed on every insert, including inserts with a lower sequence_number"

  - name: Allotment
    parent: null
    common_fields: true
    fields:
      - name: appropriation_id
        type: string
        source: input
        description: "FK -> Appropriation.id; the authority being released against"
      - name: quarter
        type: integer
        source: input
        description: "Fiscal quarter of the owning cycle this release covers"
        constraints: ">= 1 and <= 4"
      - name: requested_cents
        type: integer
        source: input
        description: "Cash the agency asks to have released this quarter"
        constraints: "> 0"
      - name: allow_partial
        type: boolean
        source: input
        description: "When true a ceiling below requested_cents is accepted and recorded; when false a binding ceiling rejects the preparation"
        default: false
      - name: computed_release_cents
        type: integer
        source: computed
        description: "Ceiling-limited release amount fixed at PREPARE time (see calculation allotment_release_ceiling)"
        default: 0
      - name: binding_constraint
        type: enum
        source: computed
        description: "Which term of the ceiling minimum was binding at PREPARE time, resolved by the fixed precedence REQUEST > QUARTER_CAP > UNRELEASED_AUTHORITY > CASH_FLOW"
        default: null
        constraints: "one of REQUEST|QUARTER_CAP|UNRELEASED_AUTHORITY|CASH_FLOW or null"
      - name: released_cents
        type: integer
        source: computed
        description: "computed_release_cents once status == RELEASED, else 0; returns to 0 on recall"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Release lifecycle; RECALLED is the compensating end state of RELEASED"
        default: DRAFT
        constraints: "one of DRAFT|PREPARED|APPROVED|RELEASED|RECALLED|CANCELLED"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID that prepared the allotment, null while DRAFT"
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID that approved the allotment, null before APPROVED"
        default: null
      - name: recall_reason
        type: string
        source: system
        description: "Reason recorded on recall, null otherwise"
        default: null

  - name: BudgetTransfer
    parent: null
    common_fields: true
    fields:
      - name: source_appropriation_id
        type: string
        source: input
        description: "FK -> Appropriation.id; authority is moved out of this row"
      - name: target_appropriation_id
        type: string
        source: input
        description: "FK -> Appropriation.id; authority is moved into this row; must differ from source_appropriation_id"
      - name: amount_cents
        type: integer
        source: input
        description: "Authority moved; capped at TRANSFER_AUTHORITY_PCT of the source enacted amount"
        constraints: "> 0"
      - name: transfer_type
        type: enum
        source: input
        description: "INTRA_AGENCY requires both rows to share agency_id; INTER_AGENCY requires them to differ"
        constraints: "one of INTRA_AGENCY|INTER_AGENCY"
      - name: justification
        type: string
        source: input
        description: "Statutory justification text"
        constraints: "1..500 chars"
      - name: status
        type: enum
        source: system
        description: "Transfer lifecycle; REVERSED is the compensating end state of EXECUTED"
        default: PROPOSED
        constraints: "one of PROPOSED|APPROVED|REJECTED|EXECUTED|REVERSED"
      - name: proposed_by_user_id
        type: string
        source: system
        description: "X-User-ID that proposed the transfer; blocked from approving it"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID that approved the transfer, null before APPROVED"
        default: null
      - name: decision_reason
        type: string
        source: system
        description: "Reason recorded on reject or reverse, null otherwise"
        default: null

  - name: Expenditure
    parent: null
    common_fields: true
    fields:
      - name: appropriation_id
        type: string
        source: input
        description: "FK -> Appropriation.id; the authority being charged"
      - name: quarter
        type: integer
        source: input
        description: "Fiscal quarter the charge is posted into; must equal the cycle quarter of the logical clock"
        constraints: ">= 1 and <= 4"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount charged"
        constraints: "> 0"
      - name: object_code
        type: string
        source: input
        description: "Object-of-expenditure code"
        constraints: "1..16 chars"
      - name: vendor_reference
        type: string
        source: input
        description: "Vendor invoice reference"
        constraints: "1..64 chars"
      - name: status
        type: enum
        source: system
        description: "POSTED charges count against the appropriation; VOIDED ones do not"
        default: POSTED
        constraints: "one of POSTED|VOIDED"
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the charge was posted"
      - name: void_reason
        type: string
        source: system
        description: "Reason recorded on void, null otherwise"
        default: null

  - name: FederalGrant
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; grantee agency"
      - name: budget_cycle_id
        type: string
        source: input
        description: "FK -> BudgetCycle.id; cycle the award is budgeted in"
      - name: cfda_number
        type: string
        source: input
        description: "Federal assistance listing number"
        constraints: "1..16 chars"
      - name: award_cents
        type: integer
        source: input
        description: "Federal award amount"
        constraints: "> 0"
      - name: required_match_ratio
        type: number
        source: input
        description: "State dollars required per federal dollar"
        default: 0.25
        constraints: ">= 0 and <= 3"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the grant performance period (ISO 8601 UTC)"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the grant performance period (ISO 8601 UTC); must be > period_start"
      - name: required_state_match_cents
        type: integer
        source: computed
        description: "round_half_up(award_cents * required_match_ratio)"
        default: 0
      - name: committed_match_cents
        type: integer
        source: computed
        description: "Sum of MatchCommitment.committed_match_cents where federal_grant_id == this.id AND status == COMMITTED"
        default: 0
      - name: match_status
        type: enum
        source: computed
        description: "See calculation federal_match_coverage for the four-way resolution"
        default: UNMET
        constraints: "one of UNMET|MET|AT_RISK|SHORTFALL"
      - name: moe_baseline_cents
        type: integer
        source: input
        description: "Maintenance-of-effort baseline the state must at least match"
        constraints: "> 0"
      - name: moe_prior_year1_spend_cents
        type: integer
        source: input
        description: "State MOE-eligible spend in the year before the cycle"
        default: 0
        constraints: ">= 0"
      - name: moe_prior_year2_spend_cents
        type: integer
        source: input
        description: "State MOE-eligible spend two years before the cycle"
        default: 0
        constraints: ">= 0"
      - name: moe_current_spend_cents
        type: integer
        source: computed
        description: "Sum of Expenditure.amount_cents where status == POSTED and its Appropriation has fund_type == GENERAL, agency_id == this.agency_id and budget_cycle_id == this.budget_cycle_id"
        default: 0
      - name: moe_compliance_ratio
        type: number
        source: computed
        description: "round_half_up(assessed_spend_cents / moe_baseline_cents, 6) for whichever basis was assessed; 0 before assessment"
        default: 0
      - name: moe_assessed_basis
        type: enum
        source: system
        description: "Basis used by the most recent assessment, null before the first assessment"
        default: null
        constraints: "one of SINGLE_YEAR|THREE_YEAR_AVERAGE or null"
      - name: moe_compliance_status
        type: enum
        source: computed
        description: "Result of the most recent assessment"
        default: NOT_ASSESSED
        constraints: "one of NOT_ASSESSED|COMPLIANT|DEFICIENT"

  - name: MatchCommitment
    parent: null
    common_fields: true
    fields:
      - name: federal_grant_id
        type: string
        source: input
        description: "FK -> FederalGrant.id; the grant whose match this pledge covers"
      - name: appropriation_id
        type: string
        source: input
        description: "FK -> Appropriation.id; the state authority pledged as match"
      - name: committed_match_cents
        type: integer
        source: input
        description: "State dollars pledged from that appropriation"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "COMMITTED counts toward the grant match; AT_RISK does not; RELEASED_FROM_COMMITMENT is set by the cycle close sweep"
        default: COMMITTED
        constraints: "one of COMMITTED|AT_RISK|RELEASED_FROM_COMMITMENT"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BudgetCycle
    initial_state: DEVELOPMENT
    terminal_states: [CLOSED]
    transitions:
      - from: EXECUTIVE_PREP
        to: EXECUTIVE_PREP
        trigger: "POST /fiscal/budget-cycles/{id}/certify-balance"
        actor: BudgetDirector
        preconditions:
          - "phase == EXECUTIVE_PREP"
          - "adopted_general_fund_revenue_cents > 0 (at least one ADOPTED GENERAL RevenueForecast) else ERR_NO_ADOPTED_FORECAST"
          - "total_recommended_cents <= adopted_general_fund_revenue_cents - required_reserve_cents else ERR_BUDGET_NOT_BALANCED"
        side_effects:
          - "recompute required_reserve_cents via calculation cycle_balance_certification"
          - "set balance_certified = true"
          - "increment BudgetCycle.version by 1"
        note: "Self-transition on the phase dimension; only balance_certified and required_reserve_cents change."
      - from: DEVELOPMENT
        to: EXECUTIVE_PREP
        trigger: "POST /fiscal/budget-cycles/{id}/advance-phase with to_phase=EXECUTIVE_PREP"
        actor: BudgetDirector
        preconditions:
          - "phase == DEVELOPMENT"
          - "at least one RevenueForecast of this cycle has status == ADOPTED else ERR_NO_ADOPTED_FORECAST"
        side_effects:
          - "set phase = EXECUTIVE_PREP"
          - "increment BudgetCycle.version by 1"
      - from: EXECUTIVE_PREP
        to: LEGISLATIVE
        trigger: "POST /fiscal/budget-cycles/{id}/advance-phase with to_phase=LEGISLATIVE"
        actor: BudgetDirector
        preconditions:
          - "phase == EXECUTIVE_PREP"
          - "balance_certified == true else ERR_BUDGET_NOT_BALANCED"
        side_effects:
          - "set phase = LEGISLATIVE"
          - "increment BudgetCycle.version by 1"
      - from: LEGISLATIVE
        to: ENACTED
        trigger: "POST /fiscal/budget-cycles/{id}/advance-phase with to_phase=ENACTED"
        actor: BudgetDirector
        preconditions:
          - "phase == LEGISLATIVE"
          - "every Appropriation with budget_cycle_id == this.id has authority_status IN {ENACTED, LAPSED} else ERR_INVALID_STATE"
        side_effects:
          - "set phase = ENACTED"
          - "increment BudgetCycle.version by 1"
      - from: ENACTED
        to: EXECUTION
        trigger: "POST /fiscal/budget-cycles/{id}/advance-phase with to_phase=EXECUTION"
        actor: BudgetDirector
        preconditions:
          - "phase == ENACTED"
        side_effects:
          - "set phase = EXECUTION"
          - "recompute projected_cumulative_cash_cents, cash_utilization_pct and cash_posture"
          - "increment BudgetCycle.version by 1"
      - from: EXECUTION
        to: CLOSED
        trigger: "POST /fiscal/budget-cycles/{id}/close"
        actor: StateController
        preconditions:
          - "phase == EXECUTION"
          - "logical clock >= fiscal_year_start_date + 12 months else ERR_CYCLE_NOT_ENDED"
        side_effects:
          - "for every Appropriation of this cycle with authority_status IN {ENACTED, LAPSED}: run calculation reversion_carryforward_split, write carryforward_cents and reverted_cents, then set authority_status = CLOSED"
          - "because each Appropriation moved to CLOSED, every MatchCommitment whose appropriation_id points at it and whose status IN {COMMITTED, AT_RISK} moves to RELEASED_FROM_COMMITMENT"
          - "because those MatchCommitment rows left COMMITTED, each affected FederalGrant recomputes committed_match_cents and match_status via calculation federal_match_coverage"
          - "because each affected FederalGrant recomputed match_status, each owning Agency recomputes federal_compliance_flag"
          - "recompute total_reverted_cents and total_carryforward_cents as the sum of the already-rounded per-appropriation values"
          - "set phase = CLOSED"
          - "increment BudgetCycle.version by 1"

  - entity: RevenueForecast
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /fiscal/revenue-forecasts/{id}/adopt"
        actor: BudgetDirector
        preconditions:
          - "status == DRAFT else ERR_INVALID_STATE"
          - "owning BudgetCycle.phase IN {DEVELOPMENT, EXECUTIVE_PREP} else ERR_CYCLE_PHASE_INVALID"
          - "when supersedes_forecast_id is supplied: that forecast belongs to the same cycle, has the same source_code and status == ADOPTED else ERR_INVALID_STATE"
          - "no other ADOPTED forecast of the same cycle and source_code (excluding the one named by supersedes_forecast_id) sits within the 30-day quiet buffer of this window else ERR_FORECAST_WINDOW_CONFLICT"
        side_effects:
          - "set status = ADOPTED"
          - "when supersedes_forecast_id is supplied, set that forecast.status = SUPERSEDED"
          - "recompute BudgetCycle.adopted_general_fund_revenue_cents, required_reserve_cents, projected_cumulative_cash_cents, cash_utilization_pct and cash_posture"
          - "increment BudgetCycle.version by 1"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system, during POST /fiscal/revenue-forecasts/{id}/adopt of a newer forecast naming this row in supersedes_forecast_id"
        actor: system
        preconditions:
          - "status == ADOPTED"
          - "same budget_cycle_id and source_code as the adopting forecast"
        side_effects:
          - "set status = SUPERSEDED"
          - "amount no longer counts toward BudgetCycle.adopted_general_fund_revenue_cents"

  - entity: AgencyRequest
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fiscal/agency-requests/{id}/submit"
        actor: AgencyBudgetOfficer
        preconditions:
          - "status == DRAFT else ERR_INVALID_STATE"
          - "owning BudgetCycle.phase == DEVELOPMENT else ERR_CYCLE_PHASE_INVALID"
          - "X-User-ID == agency_id else ERR_AGENCY_SCOPE_VIOLATION"
          - "every DecisionPackage of this request with package_type == EXPANSION has at least one PerformanceMeasure else ERR_PERFORMANCE_MEASURE_REQUIRED"
        side_effects:
          - "set status = SUBMITTED"
          - "recompute total_request_cents via calculation agency_request_total"
          - "increment AgencyRequest.version by 1"
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /fiscal/agency-requests/{id}/submit"
        actor: AgencyBudgetOfficer
        preconditions:
          - "status == RETURNED_FOR_REVISION else ERR_INVALID_STATE"
          - "owning BudgetCycle.phase == DEVELOPMENT else ERR_CYCLE_PHASE_INVALID"
          - "X-User-ID == agency_id else ERR_AGENCY_SCOPE_VIOLATION"
          - "every DecisionPackage of this request with package_type == EXPANSION has at least one PerformanceMeasure else ERR_PERFORMANCE_MEASURE_REQUIRED"
        side_effects:
          - "set status = SUBMITTED"
          - "recompute total_request_cents via calculation agency_request_total"
          - "increment AgencyRequest.version by 1"
        note: "Closes the revision loop SUBMITTED -> UNDER_REVIEW -> RETURNED_FOR_REVISION -> SUBMITTED."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /fiscal/agency-requests/{id}/begin-review"
        actor: BudgetAnalyst
        preconditions:
          - "status == SUBMITTED else ERR_INVALID_STATE"
        side_effects:
          - "set status = UNDER_REVIEW"
          - "increment AgencyRequest.version by 1"
      - from: UNDER_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /fiscal/agency-requests/{id}/return-for-revision"
        actor: BudgetAnalyst
        preconditions:
          - "status == UNDER_REVIEW else ERR_INVALID_STATE"
        side_effects:
          - "set status = RETURNED_FOR_REVISION"
          - "increment revision_count by 1"
          - "store reason in last_return_reason"
          - "increment AgencyRequest.version by 1"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /fiscal/agency-requests/{id}/accept"
        actor: BudgetAnalyst
        preconditions:
          - "status == UNDER_REVIEW else ERR_INVALID_STATE"
          - "owning BudgetCycle.phase IN {DEVELOPMENT, EXECUTIVE_PREP} else ERR_CYCLE_PHASE_INVALID"
        side_effects:
          - "set status = ACCEPTED"
          - "recompute total_request_cents via calculation agency_request_total"
          - "increment AgencyRequest.version by 1"

  - entity: DecisionPackage
    initial_state: PROPOSED
    terminal_states: []
    transitions:
      - from: PROPOSED
        to: RECOMMENDED
        trigger: "POST /fiscal/decision-packages/{id}/recommend"
        actor: BudgetAnalyst
        preconditions:
          - "status == PROPOSED else ERR_INVALID_STATE"
          - "owning AgencyRequest.status == ACCEPTED else ERR_INVALID_STATE"
          - "when depends_on_package_id is non-null, that package.status == RECOMMENDED else ERR_DEPENDENCY_NOT_RECOMMENDED"
          - "when package_type == EXPANSION, at least one PerformanceMeasure exists with target_value > baseline_value else ERR_PERFORMANCE_MEASURE_REQUIRED"
        side_effects:
          - "set status = RECOMMENDED"
          - "recompute owning AgencyRequest.total_request_cents"
          - "increment DecisionPackage.version by 1"
      - from: PROPOSED
        to: DEFERRED
        trigger: "POST /fiscal/decision-packages/{id}/defer"
        actor: BudgetAnalyst
        preconditions:
          - "status == PROPOSED else ERR_INVALID_STATE"
        side_effects:
          - "set status = DEFERRED"
          - "recompute owning AgencyRequest.total_request_cents"
          - "increment DecisionPackage.version by 1"
      - from: DEFERRED
        to: RECOMMENDED
        trigger: "POST /fiscal/decision-packages/{id}/recommend"
        actor: BudgetAnalyst
        preconditions:
          - "status == DEFERRED else ERR_INVALID_STATE"
          - "owning AgencyRequest.status == ACCEPTED else ERR_INVALID_STATE"
          - "when depends_on_package_id is non-null, that package.status == RECOMMENDED else ERR_DEPENDENCY_NOT_RECOMMENDED"
          - "when package_type == EXPANSION, at least one PerformanceMeasure exists with target_value > baseline_value else ERR_PERFORMANCE_MEASURE_REQUIRED"
        side_effects:
          - "set status = RECOMMENDED"
          - "recompute owning AgencyRequest.total_request_cents"
          - "increment DecisionPackage.version by 1"
        note: "Revival path; makes the disposition dimension cyclic PROPOSED -> DEFERRED -> RECOMMENDED."

  - entity: ExecutiveRecommendation
    initial_state: PREPARED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PREPARED
        to: APPROVED
        trigger: "POST /fiscal/executive-recommendations/{id}/approve"
        actor: BudgetDirector
        preconditions:
          - "status == PREPARED else ERR_INVALID_STATE"
          - "owning AgencyRequest.status == ACCEPTED else ERR_INVALID_STATE"
          - "owning BudgetCycle.phase == EXECUTIVE_PREP else ERR_CYCLE_PHASE_INVALID"
          - "X-User-ID != prepared_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set status = APPROVED and approved_by_user_id = X-User-ID"
          - "recompute owning BudgetCycle.total_recommended_cents"
          - "set BudgetCycle.balance_certified = false (a new approved amount invalidates any prior certification)"
          - "increment ExecutiveRecommendation.version by 1 and BudgetCycle.version by 1"
      - from: PREPARED
        to: SUPERSEDED
        trigger: "system, during POST /fiscal/executive-recommendations for the same agency_request_id"
        actor: system
        preconditions:
          - "status == PREPARED"
          - "a newer ExecutiveRecommendation for the same agency_request_id was created"
        side_effects:
          - "set status = SUPERSEDED"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system, during POST /fiscal/executive-recommendations for the same agency_request_id"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "a newer ExecutiveRecommendation for the same agency_request_id was created"
        side_effects:
          - "set status = SUPERSEDED"
          - "because this row left APPROVED, recompute BudgetCycle.total_recommended_cents"
          - "set BudgetCycle.balance_certified = false"

  - entity: Appropriation
    initial_state: AUTHORITY_PENDING|CASH_UNRELEASED
    terminal_states: [AUTHORITY_CLOSED]
    transitions:
      - from: AUTHORITY_PENDING
        to: AUTHORITY_ENACTED
        trigger: "POST /fiscal/appropriations/{id}/enact"
        actor: LegislativeFiscalOfficer
        preconditions:
          - "authority_status == PENDING else ERR_INVALID_STATE"
          - "owning BudgetCycle.phase == LEGISLATIVE else ERR_CYCLE_PHASE_INVALID"
          - "committee_balance_cents > 0"
        side_effects:
          - "set enacted_amount_cents = committee_balance_cents"
          - "set authority_status = ENACTED"
          - "recompute available_authority_cents and available_cash_cents"
          - "increment Appropriation.version by 1"
      - from: AUTHORITY_PENDING
        to: AUTHORITY_LAPSED
        trigger: "POST /fiscal/appropriations/{id}/enact"
        actor: LegislativeFiscalOfficer
        preconditions:
          - "authority_status == PENDING else ERR_INVALID_STATE"
          - "owning BudgetCycle.phase == LEGISLATIVE else ERR_CYCLE_PHASE_INVALID"
          - "committee_balance_cents == 0 (the line was STRIKEd or decreased to zero)"
        side_effects:
          - "set enacted_amount_cents = 0"
          - "set authority_status = LAPSED"
          - "increment Appropriation.version by 1"
        note: "Branch of the same trigger; the destination depends on the replayed committee balance."
      - from: AUTHORITY_PENDING
        to: AUTHORITY_ENACTED
        trigger: "POST /fiscal/appropriations/emergency"
        actor: BudgetDirector
        preconditions:
          - "owning BudgetCycle.phase == EXECUTION else ERR_CYCLE_PHASE_INVALID"
          - "requested_amount_cents <= emergency capacity per calculation emergency_appropriation_capacity else ERR_EMERGENCY_EXCEEDS_RESERVE_CAPACITY"
        side_effects:
          - "create the row with is_emergency = true, introduced_amount_cents = requested_amount_cents, committee_balance_cents = requested_amount_cents, enacted_amount_cents = requested_amount_cents"
          - "set authority_status = ENACTED and cash_status = UNRELEASED in the same creation"
          - "recompute BudgetCycle.emergency_granted_cents"
          - "increment BudgetCycle.version by 1"
        note: "Emergency rows skip the legislative dimension entirely and land ENACTED at creation."
      - from: AUTHORITY_ENACTED
        to: AUTHORITY_CLOSED
        trigger: "POST /fiscal/budget-cycles/{id}/close"
        actor: StateController
        preconditions:
          - "authority_status == ENACTED"
          - "owning BudgetCycle.phase == EXECUTION"
        side_effects:
          - "run calculation reversion_carryforward_split and write carryforward_cents and reverted_cents"
          - "set authority_status = CLOSED"
          - "cascade: MatchCommitment rows on this appropriation leave COMMITTED/AT_RISK for RELEASED_FROM_COMMITMENT"
          - "increment Appropriation.version by 1"
      - from: AUTHORITY_LAPSED
        to: AUTHORITY_CLOSED
        trigger: "POST /fiscal/budget-cycles/{id}/close"
        actor: StateController
        preconditions:
          - "authority_status == LAPSED"
          - "owning BudgetCycle.phase == EXECUTION"
        side_effects:
          - "set carryforward_cents = 0 and reverted_cents = 0 (a lapsed line carries no authority)"
          - "set authority_status = CLOSED"
          - "increment Appropriation.version by 1"
      - from: CASH_UNRELEASED
        to: CASH_PARTIALLY_RELEASED
        trigger: "POST /fiscal/allotments/{id}/release"
        actor: StateController
        preconditions:
          - "cash_status == UNRELEASED"
          - "authority_status == ENACTED else ERR_APPROPRIATION_NOT_ENACTED"
          - "released_cents after the release is > 0 and < enacted_amount_cents + transfers_in_cents - transfers_out_cents"
        side_effects:
          - "recompute released_cents, available_cash_cents"
          - "set cash_status = PARTIALLY_RELEASED"
          - "cascade: owning BudgetCycle recomputes total_released_cents, cash_utilization_pct and cash_posture"
          - "increment Appropriation.version by 1"
      - from: CASH_UNRELEASED
        to: CASH_FULLY_RELEASED
        trigger: "POST /fiscal/allotments/{id}/release"
        actor: StateController
        preconditions:
          - "cash_status == UNRELEASED"
          - "authority_status == ENACTED else ERR_APPROPRIATION_NOT_ENACTED"
          - "released_cents after the release == enacted_amount_cents + transfers_in_cents - transfers_out_cents"
        side_effects:
          - "recompute released_cents, available_cash_cents"
          - "set cash_status = FULLY_RELEASED"
          - "cascade: owning BudgetCycle recomputes total_released_cents, cash_utilization_pct and cash_posture"
          - "increment Appropriation.version by 1"
      - from: CASH_PARTIALLY_RELEASED
        to: CASH_FULLY_RELEASED
        trigger: "POST /fiscal/allotments/{id}/release"
        actor: StateController
        preconditions:
          - "cash_status == PARTIALLY_RELEASED"
          - "released_cents after the release == enacted_amount_cents + transfers_in_cents - transfers_out_cents"
        side_effects:
          - "recompute released_cents, available_cash_cents"
          - "set cash_status = FULLY_RELEASED"
          - "cascade: owning BudgetCycle recomputes total_released_cents, cash_utilization_pct and cash_posture"
          - "increment Appropriation.version by 1"
      - from: CASH_PARTIALLY_RELEASED
        to: CASH_UNRELEASED
        trigger: "POST /fiscal/allotments/{id}/recall"
        actor: StateController
        preconditions:
          - "cash_status == PARTIALLY_RELEASED"
          - "released_cents after the recall == 0"
        side_effects:
          - "recompute released_cents (drops the recalled allotment) and available_cash_cents"
          - "set cash_status = UNRELEASED"
          - "cascade: owning BudgetCycle recomputes total_released_cents, cash_utilization_pct and cash_posture; a posture returning to NORMAL clears release_hold on every GENERAL UNRELEASED appropriation of the cycle"
          - "increment Appropriation.version by 1"
        note: "Cash dimension is cyclic: a release followed by its recall returns the row to UNRELEASED."
      - from: CASH_FULLY_RELEASED
        to: CASH_PARTIALLY_RELEASED
        trigger: "POST /fiscal/allotments/{id}/recall"
        actor: StateController
        preconditions:
          - "cash_status == FULLY_RELEASED"
          - "released_cents after the recall is > 0"
        side_effects:
          - "recompute released_cents and available_cash_cents"
          - "set cash_status = PARTIALLY_RELEASED"
          - "cascade: owning BudgetCycle recomputes total_released_cents, cash_utilization_pct and cash_posture"
          - "increment Appropriation.version by 1"
      - from: CASH_UNRELEASED
        to: CASH_FROZEN
        trigger: "POST /fiscal/appropriations/{id}/freeze-cash"
        actor: StateController
        preconditions:
          - "cash_status IN {UNRELEASED, PARTIALLY_RELEASED, FULLY_RELEASED} else ERR_INVALID_STATE"
          - "authority_status == ENACTED else ERR_APPROPRIATION_NOT_ENACTED"
        side_effects:
          - "store the prior cash_status in pre_freeze_cash_status and the reason in freeze_reason"
          - "set cash_status = FROZEN"
          - "increment Appropriation.version by 1"
        note: "Same transition shape applies from PARTIALLY_RELEASED and FULLY_RELEASED; pre_freeze_cash_status records which."
      - from: CASH_FROZEN
        to: CASH_PARTIALLY_RELEASED
        trigger: "POST /fiscal/appropriations/{id}/unfreeze-cash"
        actor: StateController
        preconditions:
          - "cash_status == FROZEN else ERR_INVALID_STATE"
        side_effects:
          - "recompute cash_status from released_cents against enacted_amount_cents + transfers_in_cents - transfers_out_cents (0 -> UNRELEASED, full -> FULLY_RELEASED, otherwise PARTIALLY_RELEASED); the recomputed value can differ from pre_freeze_cash_status when a transfer changed the authority meanwhile"
          - "clear freeze_reason"
          - "increment Appropriation.version by 1"

  - entity: Allotment
    initial_state: DRAFT
    terminal_states: [RECALLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /fiscal/allotments/{id}/prepare"
        actor: BudgetAnalyst
        preconditions:
          - "status == DRAFT else ERR_INVALID_STATE"
          - "owning Appropriation.authority_status == ENACTED else ERR_APPROPRIATION_NOT_ENACTED"
          - "owning Appropriation.cash_status != FROZEN else ERR_CASH_FROZEN"
          - "owning Appropriation.release_hold == false else ERR_RELEASE_HOLD_ACTIVE"
          - "owning BudgetCycle.phase == EXECUTION else ERR_CYCLE_PHASE_INVALID"
          - "calculation allotment_release_ceiling yields a ceiling > 0 else ERR_NO_RELEASE_CAPACITY"
          - "when allow_partial == false, the ceiling >= requested_cents else ERR_ALLOTMENT_EXCEEDS_CEILING"
        side_effects:
          - "write computed_release_cents and binding_constraint from calculation allotment_release_ceiling"
          - "set prepared_by_user_id = X-User-ID"
          - "set status = PREPARED"
          - "increment Allotment.version by 1"
      - from: PREPARED
        to: APPROVED
        trigger: "POST /fiscal/allotments/{id}/approve"
        actor: BudgetDirector
        preconditions:
          - "status == PREPARED else ERR_INVALID_STATE"
          - "X-User-ID != prepared_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "owning Appropriation.cash_status != FROZEN else ERR_CASH_FROZEN"
        side_effects:
          - "set approved_by_user_id = X-User-ID"
          - "set status = APPROVED"
          - "increment Allotment.version by 1"
      - from: APPROVED
        to: RELEASED
        trigger: "POST /fiscal/allotments/{id}/release"
        actor: StateController
        preconditions:
          - "status == APPROVED else ERR_INVALID_STATE"
          - "quarter == current cycle quarter derived from the logical clock else ERR_QUARTER_NOT_OPEN when quarter is later, ERR_QUARTER_CLOSED when earlier"
          - "owning Appropriation.cash_status != FROZEN else ERR_CASH_FROZEN"
        side_effects:
          - "set released_cents = computed_release_cents and status = RELEASED"
          - "because released_cents became non-zero, owning Appropriation recomputes released_cents, available_cash_cents and its cash_status dimension"
          - "because the Appropriation cash figures changed, owning BudgetCycle recomputes total_released_cents, cash_utilization_pct and cash_posture"
          - "because cash_posture became CONSTRAINED, every Appropriation of that cycle with fund_type == GENERAL and cash_status == UNRELEASED sets release_hold = true"
          - "increment Allotment.version, Appropriation.version and BudgetCycle.version by 1 each"
      - from: RELEASED
        to: RECALLED
        trigger: "POST /fiscal/allotments/{id}/recall"
        actor: StateController
        preconditions:
          - "status == RELEASED else ERR_INVALID_STATE"
          - "owning Appropriation.available_cash_cents - released_cents >= 0 - i.e. recalling this release must not push released_cents below expended_cents else ERR_INSUFFICIENT_CASH_RELEASED"
        side_effects:
          - "set released_cents = 0, record recall_reason, set status = RECALLED"
          - "because released_cents dropped to 0, owning Appropriation recomputes released_cents, available_cash_cents and cash_status"
          - "because the Appropriation cash figures changed, owning BudgetCycle recomputes total_released_cents, cash_utilization_pct and cash_posture"
          - "because cash_posture returned to NORMAL, release_hold is cleared on every GENERAL UNRELEASED appropriation of the cycle"
          - "invariant released_authority_conservation must hold after this transition"
          - "increment Allotment.version, Appropriation.version and BudgetCycle.version by 1 each"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fiscal/allotments/{id}/cancel"
        actor: BudgetAnalyst
        preconditions:
          - "status IN {DRAFT, PREPARED} else ERR_INVALID_STATE"
        side_effects:
          - "set status = CANCELLED, freeing the (appropriation_id, quarter) slot for a new allotment"
          - "increment Allotment.version by 1"
      - from: PREPARED
        to: CANCELLED
        trigger: "POST /fiscal/allotments/{id}/cancel"
        actor: BudgetAnalyst
        preconditions:
          - "status == PREPARED else ERR_INVALID_STATE"
        side_effects:
          - "set status = CANCELLED and clear computed_release_cents to 0 and binding_constraint to null"
          - "increment Allotment.version by 1"

  - entity: BudgetTransfer
    initial_state: PROPOSED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /fiscal/budget-transfers/{id}/approve"
        actor: BudgetDirector
        preconditions:
          - "status == PROPOSED else ERR_INVALID_STATE"
          - "X-User-ID != proposed_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "source Appropriation.authority_status == ENACTED else ERR_APPROPRIATION_NOT_ENACTED"
          - "amount_cents <= source Appropriation.available_authority_cents else ERR_TRANSFER_EXCEEDS_AVAILABLE"
        side_effects:
          - "set approved_by_user_id = X-User-ID and status = APPROVED"
          - "increment BudgetTransfer.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /fiscal/budget-transfers/{id}/reject"
        actor: BudgetDirector
        preconditions:
          - "status == PROPOSED else ERR_INVALID_STATE"
        side_effects:
          - "record decision_reason and set status = REJECTED"
          - "increment BudgetTransfer.version by 1"
        note: "Branch sibling of approve; no ledger effect at all."
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /fiscal/budget-transfers/{id}/execute"
        actor: StateController
        preconditions:
          - "status == APPROVED else ERR_INVALID_STATE"
          - "amount_cents <= source Appropriation.available_authority_cents else ERR_TRANSFER_EXCEEDS_AVAILABLE"
          - "target Appropriation.authority_status == ENACTED else ERR_APPROPRIATION_NOT_ENACTED"
        side_effects:
          - "set status = EXECUTED and executed_at from the logical clock"
          - "source Appropriation.transfers_out_cents and target Appropriation.transfers_in_cents recomputed; both available_authority_cents recomputed"
          - "because source available_authority_cents fell, every MatchCommitment on the source with status == COMMITTED whose grant-period-overlapping committed total now exceeds that available authority moves to AT_RISK"
          - "because those MatchCommitment rows left COMMITTED, each affected FederalGrant recomputes committed_match_cents and match_status via calculation federal_match_coverage"
          - "because the FederalGrant match_status changed, the owning Agency recomputes federal_compliance_flag"
          - "invariant transfer_authority_conservation must hold after this transition"
          - "increment BudgetTransfer.version, source Appropriation.version and target Appropriation.version by 1 each"
      - from: EXECUTED
        to: REVERSED
        trigger: "POST /fiscal/budget-transfers/{id}/reverse"
        actor: StateController
        preconditions:
          - "status == EXECUTED else ERR_INVALID_STATE"
          - "target Appropriation.available_authority_cents >= amount_cents else ERR_TRANSFER_EXCEEDS_AVAILABLE"
          - "owning BudgetCycle.phase == EXECUTION else ERR_CYCLE_PHASE_INVALID"
        side_effects:
          - "record decision_reason and set status = REVERSED"
          - "source transfers_out_cents and target transfers_in_cents recomputed (the reversed row no longer counts)"
          - "because source available_authority_cents recovered, every AT_RISK MatchCommitment on the source whose overlapping committed total once again fits returns to COMMITTED"
          - "because those MatchCommitment rows returned to COMMITTED, each affected FederalGrant recomputes committed_match_cents and match_status"
          - "because the FederalGrant match_status changed, the owning Agency recomputes federal_compliance_flag"
          - "invariant transfer_authority_conservation must hold after this transition"
          - "increment BudgetTransfer.version, source Appropriation.version and target Appropriation.version by 1 each"

  - entity: Expenditure
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /fiscal/expenditures/{id}/void"
        actor: StateController
        preconditions:
          - "status == POSTED else ERR_INVALID_STATE"
          - "owning BudgetCycle.phase == EXECUTION else ERR_CYCLE_PHASE_INVALID"
        side_effects:
          - "record void_reason and set status = VOIDED"
          - "owning Appropriation recomputes expended_cents, available_cash_cents and available_authority_cents"
          - "every FederalGrant of the same agency and cycle recomputes moe_current_spend_cents"
          - "invariant expenditure_ledger_conservation must hold after this transition"
          - "increment Expenditure.version and Appropriation.version by 1 each"

  - entity: MatchCommitment
    initial_state: COMMITTED
    terminal_states: [RELEASED_FROM_COMMITMENT]
    transitions:
      - from: COMMITTED
        to: AT_RISK
        trigger: "system, during POST /fiscal/budget-transfers/{id}/execute on the pledged appropriation"
        actor: system
        preconditions:
          - "status == COMMITTED"
          - "sum of committed_match_cents over COMMITTED commitments on the same appropriation whose grant performance periods overlap this one now exceeds Appropriation.available_authority_cents"
        side_effects:
          - "set status = AT_RISK"
          - "the pledged amount stops counting toward FederalGrant.committed_match_cents"
      - from: AT_RISK
        to: COMMITTED
        trigger: "system, during POST /fiscal/budget-transfers/{id}/reverse on the pledged appropriation"
        actor: system
        preconditions:
          - "status == AT_RISK"
          - "the overlapping committed total once again fits inside Appropriation.available_authority_cents"
        side_effects:
          - "set status = COMMITTED"
          - "the pledged amount counts toward FederalGrant.committed_match_cents again"
      - from: COMMITTED
        to: RELEASED_FROM_COMMITMENT
        trigger: "system, during POST /fiscal/budget-cycles/{id}/close"
        actor: system
        preconditions:
          - "status == COMMITTED"
          - "the pledged Appropriation moved to authority_status == CLOSED"
        side_effects:
          - "set status = RELEASED_FROM_COMMITMENT"
          - "owning FederalGrant recomputes committed_match_cents and match_status"
      - from: AT_RISK
        to: RELEASED_FROM_COMMITMENT
        trigger: "system, during POST /fiscal/budget-cycles/{id}/close"
        actor: system
        preconditions:
          - "status == AT_RISK"
          - "the pledged Appropriation moved to authority_status == CLOSED"
        side_effects:
          - "set status = RELEASED_FROM_COMMITMENT"
          - "owning FederalGrant recomputes committed_match_cents and match_status"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on a parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: forecast-create-stale-cycle
    parent_entity: BudgetCycle
    write_endpoint: "POST /fiscal/revenue-forecasts"
    occ_field: "expected_budget_cycle_version"
    description: |
      Creating a RevenueForecast against a BudgetCycle whose version has advanced since the
      client last observed it is rejected. A forecast adoption that legitimately supersedes a
      prior estimate rewrites adopted_general_fund_revenue_cents and required_reserve_cents on
      the cycle, so a writer holding a stale cycle version is estimating against a revenue base
      that no longer exists.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: recommendation-create-stale-request
    parent_entity: AgencyRequest
    write_endpoint: "POST /fiscal/executive-recommendations"
    occ_field: "expected_agency_request_version"
    description: |
      Creating an ExecutiveRecommendation against an AgencyRequest whose version has advanced is
      rejected. A newer recommendation legitimately supersedes the prior PREPARED or APPROVED one,
      so a writer whose view of the request is stale would silently displace a recommendation it
      never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-propose-stale-source
    parent_entity: Appropriation
    write_endpoint: "POST /fiscal/budget-transfers"
    occ_field: "expected_source_appropriation_version"
    description: |
      Proposing a BudgetTransfer whose source Appropriation version has advanced is rejected.
      Executing another transfer, releasing an allotment, or posting an expenditure all move the
      source row's available_authority_cents, and a proposal drafted against the earlier figure
      would be approved on arithmetic that no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: agency_request_total
    trigger: "on POST /fiscal/agency-requests/{id}/submit, on POST /fiscal/agency-requests/{id}/accept, and on every DecisionPackage recommend/defer transition"
    algorithm: aggregation
    formula: |
      additive   = sum(p.amount_cents for p in packages
                       where p.agency_request_id == request.id
                         and p.status IN {PROPOSED, RECOMMENDED}
                         and p.package_type IN {EXPANSION, TECHNICAL, FEDERAL_MATCH})
      subtractive = sum(p.amount_cents for p in packages
                       where p.agency_request_id == request.id
                         and p.status IN {PROPOSED, RECOMMENDED}
                         and p.package_type == REDUCTION)
      total_request_cents = request.base_budget_cents + additive - subtractive
    input_set: "DecisionPackage rows of this request whose status IN {PROPOSED, RECOMMENDED}; DEFERRED rows are excluded entirely. Order is irrelevant (pure integer sum), so no tie-break is required."
    constants: {}
    precision: "integer cents, no rounding"
    variants: []

  - name: executive_recommendation_amount
    trigger: "on POST /fiscal/executive-recommendations (creation)"
    algorithm: aggregation
    formula: |
      additive    = sum(p.amount_cents for p in recommended_package_ids
                        where p.package_type IN {EXPANSION, TECHNICAL, FEDERAL_MATCH})
      subtractive = sum(p.amount_cents for p in recommended_package_ids
                        where p.package_type == REDUCTION)
      recommended_amount_cents = recommended_base_cents + additive - subtractive
    input_set: "Exactly the DecisionPackage rows named in recommended_package_ids; every one must have status == RECOMMENDED and belong to the same agency_request_id (else ERR_PACKAGE_NOT_RECOMMENDED / ERR_PACKAGE_REQUEST_MISMATCH). An empty array is legal and yields recommended_base_cents."
    constants: {}
    precision: "integer cents, no rounding"
    variants: []

  - name: cycle_balance_certification
    trigger: "on POST /fiscal/budget-cycles/{id}/certify-balance and on POST /fiscal/budget-cycles/{id}/advance-phase to LEGISLATIVE"
    algorithm: threshold
    formula: |
      adopted_general_fund_revenue_cents =
          sum(f.amount_cents for f in forecasts
              where f.budget_cycle_id == cycle.id and f.status == ADOPTED and f.fund_type == GENERAL)
      required_reserve_cents = round_half_up(cycle.constitutional_reserve_pct
                                            * adopted_general_fund_revenue_cents)
      appropriable_cents     = adopted_general_fund_revenue_cents - required_reserve_cents
      total_recommended_cents = sum(r.recommended_amount_cents for r in recommendations
                                    where r.status == APPROVED
                                      and r.agency_request.budget_cycle_id == cycle.id)
      balanced = (total_recommended_cents <= appropriable_cents)     # inclusive: equality balances
    input_set: "ADOPTED GENERAL forecasts only (DRAFT and SUPERSEDED excluded); APPROVED recommendations only (PREPARED and SUPERSEDED excluded)."
    constants: {}
    precision: "integer cents; the reserve is rounded round_half_up before the subtraction, never after"
    variants: []

  - name: committee_running_balance
    trigger: "on POST /fiscal/committee-actions (full replay, including when the new row carries a lower sequence_number than existing rows) and read by POST /fiscal/appropriations/{id}/enact"
    algorithm: chronological
    formula: |
      balance = appropriation.introduced_amount_cents
      for a in actions(appropriation) ordered by sequence_number ASC, created_at ASC:
          if   a.action_type == SET:      balance = a.amount_cents
          elif a.action_type == INCREASE: balance = balance + a.amount_cents
          elif a.action_type == DECREASE: balance = balance - a.amount_cents
          elif a.action_type == RESTORE:  balance = appropriation.introduced_amount_cents
          elif a.action_type == STRIKE:   balance = 0
          if balance < 0: reject the whole insert with ERR_NEGATIVE_APPROPRIATION_BALANCE
          a.running_balance_cents = balance
      appropriation.committee_balance_cents = balance     # introduced_amount_cents when no action exists
    input_set: "Every CommitteeAction of the appropriation, with no status filter (the entity is append-only and has no status). The replay is total: inserting a row with sequence_number 1 after a row with sequence_number 2 already exists rewrites the running_balance_cents of that later row."
    constants: {}
    precision: "integer cents, no rounding"
    variants:
      - name: full_replay_by_sequence
        when: "always — this is the pinned interpretation"
        difference: "Reorders by sequence_number ASC and recomputes every row, so a late-arriving low-sequence action changes the final balance."
      - name: arrival_order_append
        when: "never applied; documented only to name the divergence this calculation exists to catch"
        difference: "Applying actions in insertion order instead would leave earlier running_balance_cents untouched and yield a different committee_balance_cents for the identical set of actions."

  - name: allotment_release_ceiling
    trigger: "on POST /fiscal/allotments/{id}/prepare"
    algorithm: constraint_propagation
    formula: |
      authority          = appr.enacted_amount_cents + appr.transfers_in_cents - appr.transfers_out_cents
      quarter_cap        = round_half_up(QUARTER_CAP_PCT[appr.fund_type][allot.quarter] * authority)
      unreleased         = authority - appr.released_cents
      projected_cash     = round_half_up(CASH_FLOW_FACTOR[allot.quarter]
                                         * cycle.adopted_general_fund_revenue_cents)
      cash_available     = max(0, projected_cash - cycle.total_released_cents)
      ceiling            = min(allot.requested_cents, quarter_cap, unreleased, cash_available)
      binding_constraint = first label in the fixed precedence list
                           [REQUEST, QUARTER_CAP, UNRELEASED_AUTHORITY, CASH_FLOW]
                           whose term equals ceiling
      if ceiling == 0:                                    -> ERR_NO_RELEASE_CAPACITY
      if ceiling < allot.requested_cents and allow_partial == false -> ERR_ALLOTMENT_EXCEEDS_CEILING
      computed_release_cents = ceiling
    input_set: "The owning Appropriation (its enacted, transfer and released figures), the owning BudgetCycle (adopted GENERAL revenue and total_released_cents across ALL its appropriations, including FEDERAL and DEDICATED ones), and the allotment's own quarter and requested_cents. Allotment rows with status IN {RECALLED, CANCELLED} contribute nothing to appr.released_cents."
    constants:
      QUARTER_CAP_PCT:
        GENERAL: { 1: 0.22, 2: 0.26, 3: 0.26, 4: 0.26 }
        FEDERAL: { 1: 0.25, 2: 0.25, 3: 0.25, 4: 0.25 }
        DEDICATED: { 1: 0.30, 2: 0.30, 3: 0.20, 4: 0.20 }
      CASH_FLOW_FACTOR: { 1: 0.20, 2: 0.45, 3: 0.70, 4: 1.00 }
    precision: "integer cents; each of quarter_cap and projected_cash is rounded round_half_up before entering the min(), never after"
    variants: []

  - name: appropriation_available_balance
    trigger: "on every mutation of released_cents, expended_cents, enacted_amount_cents, transfers_in_cents or transfers_out_cents; read by GET /fiscal/appropriations/{id}/balance-summary"
    algorithm: aggregation
    formula: |
      expended = sum(e.amount_cents for e in expenditures
                     where e.appropriation_id == appr.id and e.status == POSTED)
      released = sum(a.released_cents for a in allotments
                     where a.appropriation_id == appr.id and a.status == RELEASED)
      authority = appr.enacted_amount_cents + appr.transfers_in_cents - appr.transfers_out_cents
      available_cash_cents      = released  - expended          # cash basis
      available_authority_cents = authority - expended          # authority basis
    input_set: "POSTED expenditures only (VOIDED excluded) and RELEASED allotments only (DRAFT/PREPARED/APPROVED/RECALLED/CANCELLED excluded)."
    constants: {}
    precision: "integer cents, no rounding"
    variants:
      - name: cash_basis
        when: "guarding POST /fiscal/expenditures (ERR_INSUFFICIENT_CASH_RELEASED) and reported as available_cash_cents"
        difference: "Counts only cash actually released through allotments, so unreleased enacted authority is invisible; for an ENACTED appropriation with nothing released this is 0 even though authority is positive."
      - name: authority_basis
        when: "guarding POST /fiscal/expenditures (ERR_APPROPRIATION_OVERSPEND), POST /fiscal/budget-transfers approve/execute and MatchCommitment capacity, and reported as available_authority_cents"
        difference: "Counts full enacted authority adjusted by executed transfers and ignores whether cash was released, so it is >= the cash basis for the identical row and yields a different verdict on the same expenditure request."

  - name: reduction_scenario_waterfall
    trigger: "on POST /fiscal/reduction-scenarios"
    algorithm: waterfall_allocation
    formula: |
      accepted_base = sum(r.base_budget_cents for r in requests
                          where r.budget_cycle_id == cycle.id and r.status == ACCEPTED)
      target_reduction_cents = round_half_up(target_reduction_pct * accepted_base)
      candidates = [p for p in packages
                    where p.package_type == REDUCTION
                      and p.status == PROPOSED
                      and p.agency_request.status == ACCEPTED
                      and p.agency_request.budget_cycle_id == cycle.id]
      if candidates is empty: -> ERR_NO_REDUCTION_CANDIDATES
      order candidates by priority_rank ASC, then amount_cents DESC, then created_at ASC
      achieved = 0; selected = []
      for p in ordered candidates:
          if achieved >= target_reduction_cents: break        # inclusive stop
          selected.append(p.id); achieved += p.amount_cents   # packages are never split
      achieved_reduction_cents = achieved
      overshoot_cents          = max(0, achieved - target_reduction_cents)
      feasibility = FEASIBLE if achieved >= target_reduction_cents else INFEASIBLE
    input_set: "REDUCTION packages in status PROPOSED whose owning AgencyRequest is ACCEPTED in this cycle; RECOMMENDED and DEFERRED reduction packages are excluded, as are packages of requests still under review."
    constants: {}
    precision: "integer cents; the target is rounded round_half_up once, before the walk"
    variants: []

  - name: reversion_carryforward_split
    trigger: "on POST /fiscal/budget-cycles/{id}/close, once per Appropriation with authority_status == ENACTED"
    algorithm: threshold
    formula: |
      # per-appropriation, rounded to the cent BEFORE any aggregation
      authority   = appr.enacted_amount_cents + appr.transfers_in_cents - appr.transfers_out_cents
      unexpended  = max(0, authority - appr.expended_cents)
      cap_cents   = round_half_up(CARRYFORWARD_CAP_PCT[appr.fund_type] * authority)
      carryforward_cents = min(unexpended, cap_cents)
      reverted_cents     = unexpended - carryforward_cents
      # cycle rollup sums the already-rounded per-row values
      cycle.total_carryforward_cents = sum(appr.carryforward_cents for appr in cycle appropriations)
      cycle.total_reverted_cents     = sum(appr.reverted_cents     for appr in cycle appropriations)
    input_set: "Appropriations of the closing cycle with authority_status == ENACTED. LAPSED rows get carryforward_cents = 0 and reverted_cents = 0. Rows already CLOSED are skipped."
    constants:
      CARRYFORWARD_CAP_PCT: { GENERAL: 0.00, FEDERAL: 1.00, DEDICATED: 0.15 }
    precision: |
      integer cents, round_half_up, and the rounding ORDER IS PINNED: the percentage cap is rounded
      to the cent per appropriation FIRST and the cycle totals are the sum of those rounded values.
      Summing the authority across appropriations and rounding the percentage once at the end is
      wrong and can differ by a cent per row.
    variants: []

  - name: federal_moe_compliance
    trigger: "on POST /fiscal/federal-grants/{id}/moe-assessment"
    algorithm: threshold
    formula: |
      moe_current_spend_cents = sum(e.amount_cents for e in expenditures
                                    where e.status == POSTED
                                      and e.appropriation.fund_type == GENERAL
                                      and e.appropriation.agency_id == grant.agency_id
                                      and e.appropriation.budget_cycle_id == grant.budget_cycle_id)
      if basis == SINGLE_YEAR:
          assessed_spend_cents = moe_current_spend_cents
      else:  # THREE_YEAR_AVERAGE
          assessed_spend_cents = round_half_up((moe_current_spend_cents
                                                + grant.moe_prior_year1_spend_cents
                                                + grant.moe_prior_year2_spend_cents) / 3)
      moe_compliance_status = COMPLIANT if assessed_spend_cents >= grant.moe_baseline_cents
                              else DEFICIENT                      # inclusive at exact equality
      moe_compliance_ratio  = round_half_up(assessed_spend_cents / grant.moe_baseline_cents, 6)
      moe_assessed_basis    = basis
    input_set: "POSTED expenditures charged to GENERAL-fund appropriations of the same agency and the same cycle; FEDERAL and DEDICATED charges and VOIDED rows are excluded. The two prior-year figures are operator-supplied inputs on the grant."
    constants: {}
    precision: "integer cents for the average (round_half_up before the comparison); the ratio is reported at 6 decimal places but the COMPLIANT/DEFICIENT verdict compares integers, never the rounded ratio"
    variants:
      - name: single_year_basis
        when: "basis == SINGLE_YEAR on the assessment request"
        difference: "Compares this cycle's GENERAL-fund spend alone against the baseline; a state that front-loads the current year passes."
      - name: three_year_average_basis
        when: "basis == THREE_YEAR_AVERAGE on the assessment request"
        difference: "Averages the current spend with the two operator-supplied prior years, so identical current-year data yields a lower assessed figure whenever prior years were leaner — the same grant flips COMPLIANT under one basis and DEFICIENT under the other."

  - name: federal_match_coverage
    trigger: "on POST /fiscal/match-commitments, on BudgetTransfer execute/reverse touching a pledged appropriation, and on POST /fiscal/budget-cycles/{id}/close"
    algorithm: aggregation
    formula: |
      required_state_match_cents = round_half_up(grant.award_cents * grant.required_match_ratio)
      committed_match_cents = sum(m.committed_match_cents for m in commitments
                                 where m.federal_grant_id == grant.id and m.status == COMMITTED)
      any_at_risk = exists(m for m in commitments
                           where m.federal_grant_id == grant.id and m.status == AT_RISK)
      if   committed_match_cents < required_state_match_cents and committed_match_cents == 0:
           match_status = SHORTFALL if any_at_risk else UNMET
      elif committed_match_cents < required_state_match_cents:
           match_status = SHORTFALL
      elif any_at_risk:
           match_status = AT_RISK
      else:
           match_status = MET
      # aggregate-capacity gate applied on CREATE of a new commitment
      overlapping = [m for m in commitments
                     where m.appropriation_id == new.appropriation_id
                       and m.status == COMMITTED
                       and m.grant.period_start < new.grant.period_end
                       and new.grant.period_start < m.grant.period_end]   # half-open, touching is NOT overlap
      if sum(overlapping.committed_match_cents) + new.committed_match_cents
             > appropriation.available_authority_cents:
           -> ERR_MATCH_AGGREGATE_CAPACITY_EXCEEDED
      agency.federal_compliance_flag = DEFICIENT if any grant of the agency is SHORTFALL
                                       else AT_RISK if any grant is AT_RISK
                                       else CLEAR
    input_set: "COMMITTED commitments only for the coverage sum; AT_RISK rows count for the any_at_risk predicate but not the sum; RELEASED_FROM_COMMITMENT rows count for neither. The capacity gate considers only COMMITTED commitments on the same appropriation whose grant performance periods half-open-overlap the incoming grant's period."
    constants: {}
    precision: "integer cents; the required match is rounded round_half_up once at grant creation"
    variants: []

  - name: emergency_appropriation_capacity
    trigger: "on POST /fiscal/appropriations/emergency"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED. The row being requested is deliberately EXCLUDED from step 1,
      # even though granting it will raise general_fund_authority_total for the NEXT request.
      # There is no fixed-point iteration.
      step1: general_fund_authority_total =
                 sum(a.enacted_amount_cents + a.transfers_in_cents - a.transfers_out_cents
                     for a in appropriations
                     where a.budget_cycle_id == cycle.id
                       and a.fund_type == GENERAL
                       and a.authority_status == ENACTED)
      step2: required_minimum_reserve_cents =
                 round_half_up(cycle.constitutional_reserve_pct * general_fund_authority_total)
      step3: emergency_capacity_cents =
                 max(0, cycle.reserve_balance_cents
                        - cycle.emergency_granted_cents
                        - required_minimum_reserve_cents)
      step4: if requested_amount_cents > emergency_capacity_cents
                 -> ERR_EMERGENCY_EXCEEDS_RESERVE_CAPACITY
             else grant the appropriation (enacted immediately) and add requested_amount_cents
                  to cycle.emergency_granted_cents
    input_set: "GENERAL-fund appropriations of the cycle with authority_status == ENACTED, including previously granted emergency rows (they are ENACTED, so they enter step 1 of every LATER request); PENDING, LAPSED and CLOSED rows are excluded, as is the request currently being evaluated."
    constants: {}
    precision: "integer cents; the reserve floor is rounded round_half_up in step 2 before the subtraction in step 3"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource named in the path exists, validated left to right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "every FK named in the request body resolves to an existing row, validated in declaration order of the endpoint's input list"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields"
  - priority: 5
    category: auth
    check: "for AgencyBudgetOfficer, X-User-ID equals the agency_id of the target row (directly, or through the referenced AgencyRequest / Appropriation / FederalGrant)"
    error_id: ERR_AGENCY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /fiscal/agency-requests, POST /fiscal/agency-requests/{id}/submit, POST /fiscal/decision-packages, POST /fiscal/performance-measures, POST /fiscal/expenditures, POST /fiscal/match-commitments"
  - priority: 6
    category: business_constraint
    check: "request body is well formed: required fields present, enum members legal, integers integral, limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 7
    category: business_constraint
    check: "monetary and count fields respect their sign rules: amount_cents > 0 where the entity requires it, CommitteeAction.amount_cents == 0 for RESTORE and STRIKE and > 0 otherwise, quarter within 1..4 (PerformanceMeasure value ordering is checked separately at priority 8)"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /fiscal/agency-requests, POST /fiscal/decision-packages, POST /fiscal/committee-actions, POST /fiscal/allotments, POST /fiscal/budget-transfers, POST /fiscal/expenditures, POST /fiscal/match-commitments, POST /fiscal/appropriations/emergency"
  - priority: 8
    category: business_constraint
    check: "PerformanceMeasure.target_value must be strictly greater than baseline_value"
    error_id: ERR_PERFORMANCE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /fiscal/performance-measures"
  - priority: 9
    category: state
    check: "expected_<parent>_version equals the current version of the named parent row"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fiscal/revenue-forecasts, POST /fiscal/executive-recommendations, POST /fiscal/budget-transfers"
  - priority: 10
    category: state
    check: "the owning BudgetCycle is in a phase that permits this operation"
    error_id: ERR_CYCLE_PHASE_INVALID
    http_status: 409
    applies_to: "all write endpoints that touch a cycle-scoped row"
  - priority: 11
    category: state
    check: "the target row is in a state from which this transition is declared in 1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 12
    category: state
    check: "the referenced Appropriation.authority_status == ENACTED"
    error_id: ERR_APPROPRIATION_NOT_ENACTED
    http_status: 409
    applies_to: "POST /fiscal/allotments/{id}/prepare, POST /fiscal/budget-transfers/{id}/approve, POST /fiscal/budget-transfers/{id}/execute, POST /fiscal/expenditures, POST /fiscal/match-commitments, POST /fiscal/appropriations/{id}/freeze-cash"
  - priority: 13
    category: state
    check: "the referenced Appropriation.cash_status != FROZEN"
    error_id: ERR_CASH_FROZEN
    http_status: 409
    applies_to: "POST /fiscal/allotments/{id}/prepare, POST /fiscal/allotments/{id}/approve, POST /fiscal/allotments/{id}/release, POST /fiscal/expenditures"
  - priority: 14
    category: state
    check: "the referenced Appropriation.release_hold == false"
    error_id: ERR_RELEASE_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /fiscal/allotments/{id}/prepare"
  - priority: 15
    category: business_safety
    check: "the acting X-User-ID differs from the X-User-ID that prepared or proposed the row (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fiscal/allotments/{id}/approve, POST /fiscal/executive-recommendations/{id}/approve, POST /fiscal/budget-transfers/{id}/approve"
  - priority: 16
    category: business_referential
    check: "DecisionPackage.depends_on_package_id, when supplied, points at a package of the same agency_request_id whose status != DEFERRED"
    error_id: ERR_DEPENDENCY_DEFERRED
    http_status: 422
    applies_to: "POST /fiscal/decision-packages"
  - priority: 17
    category: business_referential
    check: "on recommend, the prerequisite named by depends_on_package_id has status == RECOMMENDED"
    error_id: ERR_DEPENDENCY_NOT_RECOMMENDED
    http_status: 422
    applies_to: "POST /fiscal/decision-packages/{id}/recommend"
  - priority: 18
    category: business_referential
    check: "every id in recommended_package_ids has status == RECOMMENDED"
    error_id: ERR_PACKAGE_NOT_RECOMMENDED
    http_status: 422
    applies_to: "POST /fiscal/executive-recommendations"
  - priority: 19
    category: business_referential
    check: "every id in recommended_package_ids belongs to the same agency_request_id as the recommendation"
    error_id: ERR_PACKAGE_REQUEST_MISMATCH
    http_status: 422
    applies_to: "POST /fiscal/executive-recommendations"
  - priority: 20
    category: business_referential
    check: "every EXPANSION DecisionPackage of the request carries at least one PerformanceMeasure with target_value > baseline_value"
    error_id: ERR_PERFORMANCE_MEASURE_REQUIRED
    http_status: 422
    applies_to: "POST /fiscal/agency-requests/{id}/submit, POST /fiscal/decision-packages/{id}/recommend"
  - priority: 21
    category: business_temporal
    check: "the target quarter is not already past: Expenditure.quarter must equal the cycle quarter of the logical clock; Allotment.quarter must be >= that quarter at creation and == it at release"
    error_id: ERR_QUARTER_CLOSED
    http_status: 409
    applies_to: "POST /fiscal/allotments, POST /fiscal/allotments/{id}/release, POST /fiscal/expenditures"
  - priority: 22
    category: business_temporal
    check: "the target quarter is not still in the future: Allotment release requires quarter == current cycle quarter; Expenditure.quarter may not exceed it"
    error_id: ERR_QUARTER_NOT_OPEN
    http_status: 409
    applies_to: "POST /fiscal/allotments/{id}/release, POST /fiscal/expenditures"
  - priority: 23
    category: business_temporal
    check: "the logical clock has reached fiscal_year_start_date + 12 months"
    error_id: ERR_CYCLE_NOT_ENDED
    http_status: 409
    applies_to: "POST /fiscal/budget-cycles/{id}/close"
  - priority: 24
    category: business_temporal
    check: "the adopted window of the forecast keeps a 30-day quiet buffer from every other ADOPTED window of the same cycle and source_code, excluding the row named in supersedes_forecast_id"
    error_id: ERR_FORECAST_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /fiscal/revenue-forecasts/{id}/adopt"
  - priority: 25
    category: business_constraint
    check: "no other Allotment on the same appropriation_id and quarter has status IN {DRAFT, PREPARED, APPROVED, RELEASED}"
    error_id: ERR_ALLOTMENT_QUARTER_OCCUPIED
    http_status: 409
    applies_to: "POST /fiscal/allotments"
  - priority: 26
    category: business_constraint
    check: "sequence_number is not already used by another CommitteeAction of the same appropriation"
    error_id: ERR_ACTION_SEQUENCE_DUPLICATE
    http_status: 409
    applies_to: "POST /fiscal/committee-actions"
  - priority: 27
    category: business_constraint
    check: "priority_rank is not already used by another DecisionPackage of the same agency_request_id"
    error_id: ERR_DUPLICATE_PRIORITY_RANK
    http_status: 409
    applies_to: "POST /fiscal/decision-packages"
  - priority: 28
    category: business_constraint
    check: "the agency has no other AgencyRequest in the same budget_cycle_id"
    error_id: ERR_DUPLICATE_AGENCY_REQUEST
    http_status: 409
    applies_to: "POST /fiscal/agency-requests"
  - priority: 29
    category: business_constraint
    check: "agency_code is unique across Agency; fiscal_year is unique across BudgetCycle; program_code is unique within (budget_cycle_id, agency_id)"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /fiscal/agencies, POST /fiscal/budget-cycles, POST /fiscal/appropriations"
  - priority: 30
    category: business_constraint
    check: "source_appropriation_id != target_appropriation_id"
    error_id: ERR_TRANSFER_SAME_APPROPRIATION
    http_status: 422
    applies_to: "POST /fiscal/budget-transfers"
  - priority: 31
    category: business_constraint
    check: "source and target Appropriation share the same fund_type"
    error_id: ERR_TRANSFER_FUND_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /fiscal/budget-transfers"
  - priority: 32
    category: business_constraint
    check: "transfer_type matches the agency relationship: INTRA_AGENCY requires equal agency_id, INTER_AGENCY requires different agency_id"
    error_id: ERR_TRANSFER_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /fiscal/budget-transfers"
  - priority: 33
    category: business_fiscal
    check: "the replayed committee balance never goes negative at any sequence position"
    error_id: ERR_NEGATIVE_APPROPRIATION_BALANCE
    http_status: 422
    applies_to: "POST /fiscal/committee-actions"
  - priority: 34
    category: business_fiscal
    check: "amount_cents <= TRANSFER_AUTHORITY_PCT (0.10) * source Appropriation.enacted_amount_cents, rounded round_half_up"
    error_id: ERR_TRANSFER_EXCEEDS_AUTHORITY_CAP
    http_status: 422
    applies_to: "POST /fiscal/budget-transfers"
  - priority: 35
    category: business_fiscal
    check: "amount_cents <= source Appropriation.available_authority_cents (authority basis)"
    error_id: ERR_TRANSFER_EXCEEDS_AVAILABLE
    http_status: 422
    applies_to: "POST /fiscal/budget-transfers, POST /fiscal/budget-transfers/{id}/approve, POST /fiscal/budget-transfers/{id}/execute, POST /fiscal/budget-transfers/{id}/reverse"
  - priority: 36
    category: business_fiscal
    check: "Expenditure.amount_cents <= Appropriation.available_authority_cents (authority basis)"
    error_id: ERR_APPROPRIATION_OVERSPEND
    http_status: 422
    applies_to: "POST /fiscal/expenditures"
  - priority: 37
    category: business_fiscal
    check: "Expenditure.amount_cents <= Appropriation.available_cash_cents (cash basis); also guards recall from pushing released_cents below expended_cents"
    error_id: ERR_INSUFFICIENT_CASH_RELEASED
    http_status: 422
    applies_to: "POST /fiscal/expenditures, POST /fiscal/allotments/{id}/recall"
  - priority: 38
    category: business_fiscal
    check: "the allotment ceiling is greater than zero"
    error_id: ERR_NO_RELEASE_CAPACITY
    http_status: 422
    applies_to: "POST /fiscal/allotments/{id}/prepare"
  - priority: 39
    category: business_fiscal
    check: "when allow_partial == false, the allotment ceiling is >= requested_cents"
    error_id: ERR_ALLOTMENT_EXCEEDS_CEILING
    http_status: 422
    applies_to: "POST /fiscal/allotments/{id}/prepare"
  - priority: 40
    category: business_fiscal
    check: "at least one ADOPTED GENERAL RevenueForecast exists for the cycle"
    error_id: ERR_NO_ADOPTED_FORECAST
    http_status: 422
    applies_to: "POST /fiscal/budget-cycles/{id}/advance-phase, POST /fiscal/budget-cycles/{id}/certify-balance"
  - priority: 41
    category: business_fiscal
    check: "total_recommended_cents <= adopted_general_fund_revenue_cents - required_reserve_cents; also enforced as balance_certified == true when advancing to LEGISLATIVE"
    error_id: ERR_BUDGET_NOT_BALANCED
    http_status: 422
    applies_to: "POST /fiscal/budget-cycles/{id}/certify-balance, POST /fiscal/budget-cycles/{id}/advance-phase"
  - priority: 42
    category: business_fiscal
    check: "requested_amount_cents <= emergency_capacity_cents per calculation emergency_appropriation_capacity"
    error_id: ERR_EMERGENCY_EXCEEDS_RESERVE_CAPACITY
    http_status: 422
    applies_to: "POST /fiscal/appropriations/emergency"
  - priority: 43
    category: business_fiscal
    check: "the sum of overlapping COMMITTED match pledges on the appropriation plus the new pledge fits inside available_authority_cents"
    error_id: ERR_MATCH_AGGREGATE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /fiscal/match-commitments"
  - priority: 44
    category: business_constraint
    check: "at least one eligible REDUCTION candidate package exists for the cycle"
    error_id: ERR_NO_REDUCTION_CANDIDATES
    http_status: 422
    applies_to: "POST /fiscal/reduction-scenarios"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Agencies -------------------------------------------------------------
  - method: POST
    path: "/fiscal/agencies"
    description: "Register a statewide agency. The returned id is the X-User-ID an AgencyBudgetOfficer acts under."
    roles: [SystemAdmin]
    code: 201
    input: [agency_code, name, agency_type]
    output: Agency
    side_effects: ["none beyond creation; federal_compliance_flag starts CLEAR"]
  - method: GET
    path: "/fiscal/agencies/{id}"
    description: "Read one agency including its derived federal_compliance_flag."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: []
    output: Agency
    side_effects: []

  # --- Budget cycles --------------------------------------------------------
  - method: POST
    path: "/fiscal/budget-cycles"
    description: "Open a budget cycle in phase DEVELOPMENT."
    roles: [SystemAdmin]
    code: 201
    input: [fiscal_year, fiscal_year_start_date, reserve_balance_cents, "constitutional_reserve_pct?"]
    output: BudgetCycle
    side_effects: ["phase = DEVELOPMENT", "version = 1", "all computed money fields start at 0"]
  - method: GET
    path: "/fiscal/budget-cycles/{id}"
    description: "Read one cycle including adopted revenue, required reserve, cash posture and version."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: []
    output: BudgetCycle
    side_effects: []
  - method: POST
    path: "/fiscal/budget-cycles/{id}/advance-phase"
    description: "Move the cycle forward one phase; the only legal to_phase is the immediate successor of the current phase."
    roles: [BudgetDirector]
    code: 200
    input: [to_phase]
    output: BudgetCycle
    side_effects: ["sets phase", "recomputes projected_cumulative_cash_cents, cash_utilization_pct and cash_posture when entering EXECUTION", "increments BudgetCycle.version by 1"]
  - method: POST
    path: "/fiscal/budget-cycles/{id}/certify-balance"
    description: "Certify that the approved recommendation set balances against adopted revenue net of the constitutional reserve."
    roles: [BudgetDirector]
    code: 200
    input: []
    output: BudgetCycle
    side_effects: ["runs calculation cycle_balance_certification", "sets required_reserve_cents and balance_certified = true", "increments BudgetCycle.version by 1"]
  - method: POST
    path: "/fiscal/budget-cycles/{id}/close"
    description: "Close the fiscal year: run the reversion and carryforward sweep over every appropriation, release match commitments, and lock the cycle."
    roles: [StateController]
    code: 200
    input: []
    output: BudgetCycle
    side_effects: ["runs calculation reversion_carryforward_split per appropriation", "sets every ENACTED/LAPSED appropriation to authority_status CLOSED", "cascades MatchCommitment -> FederalGrant.match_status -> Agency.federal_compliance_flag", "sets total_reverted_cents and total_carryforward_cents", "sets phase = CLOSED", "increments BudgetCycle.version by 1"]

  # --- Revenue forecasts ----------------------------------------------------
  - method: POST
    path: "/fiscal/revenue-forecasts"
    description: "Record a DRAFT revenue estimate for a cycle. Guarded by OCC on the cycle version (rule forecast-create-stale-cycle)."
    roles: [BudgetAnalyst]
    code: 201
    input: [budget_cycle_id, source_code, fund_type, forecast_round, amount_cents, effective_from, effective_to, expected_budget_cycle_version]
    output: RevenueForecast
    side_effects: ["status = DRAFT", "increments BudgetCycle.version by 1"]
  - method: POST
    path: "/fiscal/revenue-forecasts/{id}/adopt"
    description: "Adopt a DRAFT estimate, optionally superseding a prior ADOPTED estimate of the same source_code."
    roles: [BudgetDirector]
    code: 200
    input: ["supersedes_forecast_id?"]
    output: RevenueForecast
    side_effects: ["status = ADOPTED", "named prior forecast becomes SUPERSEDED", "recomputes BudgetCycle.adopted_general_fund_revenue_cents, required_reserve_cents, projected_cumulative_cash_cents, cash_utilization_pct, cash_posture", "increments BudgetCycle.version by 1"]
  - method: GET
    path: "/fiscal/budget-cycles/{id}/revenue-forecasts"
    description: "List the revenue forecasts of one cycle (reverse lookup for RevenueForecast.budget_cycle_id)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["status?", "fund_type?", "limit?", "offset?"]
    output: RevenueForecast[]
    side_effects: []

  # --- Agency requests ------------------------------------------------------
  - method: POST
    path: "/fiscal/agency-requests"
    description: "Create a DRAFT budget request carrying the agency's base budget."
    roles: [AgencyBudgetOfficer]
    code: 201
    input: [budget_cycle_id, agency_id, base_budget_cents]
    output: AgencyRequest
    side_effects: ["status = DRAFT", "total_request_cents = base_budget_cents"]
  - method: GET
    path: "/fiscal/agency-requests/{id}"
    description: "Read one request including revision_count, total_request_cents and version."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: []
    output: AgencyRequest
    side_effects: []
  - method: GET
    path: "/fiscal/agency-requests"
    description: "List requests filtered by cycle, agency or status (reverse lookup for both AgencyRequest FKs)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["budget_cycle_id?", "agency_id?", "status?", "limit?", "offset?"]
    output: AgencyRequest[]
    side_effects: []
  - method: POST
    path: "/fiscal/agency-requests/{id}/submit"
    description: "Submit a DRAFT or RETURNED_FOR_REVISION request to the budget office."
    roles: [AgencyBudgetOfficer]
    code: 200
    input: []
    output: AgencyRequest
    side_effects: ["status = SUBMITTED", "recomputes total_request_cents", "increments AgencyRequest.version by 1"]
  - method: POST
    path: "/fiscal/agency-requests/{id}/begin-review"
    description: "Take a submitted request under analyst review."
    roles: [BudgetAnalyst]
    code: 200
    input: []
    output: AgencyRequest
    side_effects: ["status = UNDER_REVIEW", "increments AgencyRequest.version by 1"]
  - method: POST
    path: "/fiscal/agency-requests/{id}/return-for-revision"
    description: "Send the request back to the agency, incrementing its revision counter."
    roles: [BudgetAnalyst]
    code: 200
    input: [reason]
    output: AgencyRequest
    side_effects: ["status = RETURNED_FOR_REVISION", "revision_count + 1", "stores last_return_reason", "increments AgencyRequest.version by 1"]
  - method: POST
    path: "/fiscal/agency-requests/{id}/accept"
    description: "Accept the request into the executive budget build."
    roles: [BudgetAnalyst]
    code: 200
    input: []
    output: AgencyRequest
    side_effects: ["status = ACCEPTED", "recomputes total_request_cents", "increments AgencyRequest.version by 1"]

  # --- Decision packages & performance measures -----------------------------
  - method: POST
    path: "/fiscal/decision-packages"
    description: "Attach a decision package to a request, optionally depending on a sibling package."
    roles: [AgencyBudgetOfficer]
    code: 201
    input: [agency_request_id, package_type, priority_rank, amount_cents, "fte_delta?", "depends_on_package_id?"]
    output: DecisionPackage
    side_effects: ["status = PROPOSED", "recomputes AgencyRequest.total_request_cents"]
  - method: GET
    path: "/fiscal/decision-packages/{id}"
    description: "Read one decision package."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: []
    output: DecisionPackage
    side_effects: []
  - method: GET
    path: "/fiscal/decision-packages"
    description: "List packages by request, by prerequisite or by disposition (reverse lookup for agency_request_id and the self-referential depends_on_package_id)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["agency_request_id?", "depends_on_package_id?", "status?", "package_type?", "limit?", "offset?"]
    output: DecisionPackage[]
    side_effects: []
  - method: POST
    path: "/fiscal/decision-packages/{id}/recommend"
    description: "Mark a package as recommended for funding."
    roles: [BudgetAnalyst]
    code: 200
    input: []
    output: DecisionPackage
    side_effects: ["status = RECOMMENDED", "recomputes AgencyRequest.total_request_cents", "increments DecisionPackage.version by 1"]
  - method: POST
    path: "/fiscal/decision-packages/{id}/defer"
    description: "Defer a package; deferred packages leave the request total and the reduction candidate pool."
    roles: [BudgetAnalyst]
    code: 200
    input: []
    output: DecisionPackage
    side_effects: ["status = DEFERRED", "recomputes AgencyRequest.total_request_cents", "increments DecisionPackage.version by 1"]
  - method: POST
    path: "/fiscal/performance-measures"
    description: "Attach an immutable baseline/target performance measure to a package."
    roles: [AgencyBudgetOfficer]
    code: 201
    input: [decision_package_id, measure_code, unit, baseline_value, target_value]
    output: PerformanceMeasure
    side_effects: ["none; the row is immutable and carries only id and created_at"]
  - method: GET
    path: "/fiscal/decision-packages/{id}/performance-measures"
    description: "List the measures of one package (reverse lookup for PerformanceMeasure.decision_package_id)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["limit?", "offset?"]
    output: PerformanceMeasure[]
    side_effects: []

  # --- Executive recommendations & reduction scenarios ----------------------
  - method: POST
    path: "/fiscal/executive-recommendations"
    description: "Prepare the executive recommendation for an accepted request. Guarded by OCC on the request version (rule recommendation-create-stale-request); a new row supersedes any prior recommendation for the same request."
    roles: [BudgetAnalyst, BudgetDirector]
    code: 201
    input: [agency_request_id, recommended_base_cents, recommended_package_ids, policy_priority, expected_agency_request_version]
    output: ExecutiveRecommendation
    side_effects: ["status = PREPARED", "runs calculation executive_recommendation_amount", "sets prepared_by_user_id = X-User-ID", "any prior PREPARED/APPROVED recommendation for the same request becomes SUPERSEDED, which recomputes BudgetCycle.total_recommended_cents and clears balance_certified", "increments AgencyRequest.version by 1"]
  - method: POST
    path: "/fiscal/executive-recommendations/{id}/approve"
    description: "Approve a prepared recommendation; the preparer may not approve their own row."
    roles: [BudgetDirector]
    code: 200
    input: []
    output: ExecutiveRecommendation
    side_effects: ["status = APPROVED, approved_by_user_id = X-User-ID", "recomputes BudgetCycle.total_recommended_cents", "sets BudgetCycle.balance_certified = false", "increments ExecutiveRecommendation.version and BudgetCycle.version by 1 each"]
  - method: GET
    path: "/fiscal/agency-requests/{id}/executive-recommendations"
    description: "List the recommendations of one request, newest last (reverse lookup for ExecutiveRecommendation.agency_request_id)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExecutiveRecommendation[]
    side_effects: []
  - method: POST
    path: "/fiscal/reduction-scenarios"
    description: "Compute an immutable reduction scenario snapshot by walking the eligible REDUCTION packages of the cycle."
    roles: [BudgetAnalyst]
    code: 201
    input: [budget_cycle_id, target_reduction_pct]
    output: ReductionScenario
    side_effects: ["runs calculation reduction_scenario_waterfall", "writes selected_package_ids, achieved_reduction_cents, overshoot_cents and feasibility", "does not mutate any DecisionPackage"]
  - method: GET
    path: "/fiscal/budget-cycles/{id}/reduction-scenarios"
    description: "List the reduction scenarios computed for one cycle (reverse lookup for ReductionScenario.budget_cycle_id)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["limit?", "offset?"]
    output: ReductionScenario[]
    side_effects: []

  # --- Appropriations -------------------------------------------------------
  - method: POST
    path: "/fiscal/appropriations"
    description: "Introduce an appropriation line item into the legislative bill (authority PENDING, cash UNRELEASED)."
    roles: [LegislativeFiscalOfficer]
    code: 201
    input: [budget_cycle_id, agency_id, fund_type, program_code, introduced_amount_cents]
    output: Appropriation
    side_effects: ["authority_status = PENDING, cash_status = UNRELEASED", "committee_balance_cents = introduced_amount_cents"]
  - method: GET
    path: "/fiscal/appropriations/{id}"
    description: "Read one appropriation including both status dimensions, both balance bases and version."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: []
    output: Appropriation
    side_effects: []
  - method: GET
    path: "/fiscal/appropriations"
    description: "Paginated list of appropriations filtered by cycle, agency, fund or authority status (reverse lookup for both Appropriation FKs)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["budget_cycle_id?", "agency_id?", "fund_type?", "authority_status?", "limit?", "offset?"]
    output: Appropriation[]
    side_effects: []
  - method: POST
    path: "/fiscal/appropriations/{id}/enact"
    description: "Enact the line at its replayed committee balance; a zero balance lapses the line instead."
    roles: [LegislativeFiscalOfficer]
    code: 200
    input: []
    output: Appropriation
    side_effects: ["enacted_amount_cents = committee_balance_cents", "authority_status = ENACTED when the balance is > 0, LAPSED when it is 0", "recomputes available_authority_cents and available_cash_cents", "increments Appropriation.version by 1"]
  - method: POST
    path: "/fiscal/appropriations/emergency"
    description: "Grant an emergency appropriation out of the stabilization reserve during EXECUTION; lands ENACTED at creation."
    roles: [BudgetDirector]
    code: 201
    input: [budget_cycle_id, agency_id, program_code, requested_amount_cents, justification]
    output: Appropriation
    side_effects: ["runs calculation emergency_appropriation_capacity with the pinned evaluation order", "creates the row with is_emergency = true, authority_status = ENACTED, cash_status = UNRELEASED, fund_type = GENERAL", "recomputes BudgetCycle.emergency_granted_cents", "increments BudgetCycle.version by 1"]
  - method: POST
    path: "/fiscal/appropriations/{id}/freeze-cash"
    description: "Freeze the cash dimension of an enacted appropriation, recording the pre-freeze value."
    roles: [StateController]
    code: 200
    input: [reason]
    output: Appropriation
    side_effects: ["pre_freeze_cash_status = current cash_status", "cash_status = FROZEN", "stores freeze_reason", "increments Appropriation.version by 1"]
  - method: POST
    path: "/fiscal/appropriations/{id}/unfreeze-cash"
    description: "Unfreeze cash; the cash dimension is recomputed from released_cents against current authority, not restored from pre_freeze_cash_status."
    roles: [StateController]
    code: 200
    input: []
    output: Appropriation
    side_effects: ["cash_status recomputed from released_cents vs authority", "clears freeze_reason", "increments Appropriation.version by 1"]
  - method: GET
    path: "/fiscal/appropriations/{id}/balance-summary"
    description: "Computed read exposing both variants of calculation appropriation_available_balance side by side."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: []
    output: "{ appropriation_id: string, authority_cents: integer, released_cents: integer, expended_cents: integer, available_cash_cents: integer, available_authority_cents: integer, basis_delta_cents: integer }"
    side_effects: []

  # --- Committee actions ----------------------------------------------------
  - method: POST
    path: "/fiscal/committee-actions"
    description: "Record a committee action; the whole action set of the appropriation is replayed in sequence_number order, so a late low-sequence insert rewrites later running balances."
    roles: [LegislativeFiscalOfficer]
    code: 201
    input: [appropriation_id, chamber, committee_name, action_type, amount_cents, sequence_number]
    output: CommitteeAction
    side_effects: ["runs calculation committee_running_balance over every action of the appropriation", "rewrites running_balance_cents on every affected action", "updates Appropriation.committee_balance_cents", "increments Appropriation.version by 1"]
  - method: GET
    path: "/fiscal/appropriations/{id}/committee-actions"
    description: "List the committee actions of one appropriation in sequence_number ASC order (reverse lookup for CommitteeAction.appropriation_id)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["limit?", "offset?"]
    output: CommitteeAction[]
    side_effects: []

  # --- Allotments -----------------------------------------------------------
  - method: POST
    path: "/fiscal/allotments"
    description: "Open a DRAFT allotment request for one quarter of one appropriation."
    roles: [BudgetAnalyst]
    code: 201
    input: [appropriation_id, quarter, requested_cents, "allow_partial?"]
    output: Allotment
    side_effects: ["status = DRAFT", "occupies the (appropriation_id, quarter) slot"]
  - method: GET
    path: "/fiscal/allotments/{id}"
    description: "Read one allotment including computed_release_cents and binding_constraint."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: []
    output: Allotment
    side_effects: []
  - method: GET
    path: "/fiscal/appropriations/{id}/allotments"
    description: "List the allotments of one appropriation (reverse lookup for Allotment.appropriation_id)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["status?", "quarter?", "limit?", "offset?"]
    output: Allotment[]
    side_effects: []
  - method: POST
    path: "/fiscal/allotments/{id}/prepare"
    description: "Compute and lock the release ceiling for the allotment."
    roles: [BudgetAnalyst, BudgetDirector]
    code: 200
    input: []
    output: Allotment
    side_effects: ["runs calculation allotment_release_ceiling", "writes computed_release_cents and binding_constraint", "sets prepared_by_user_id = X-User-ID", "status = PREPARED", "increments Allotment.version by 1"]
  - method: POST
    path: "/fiscal/allotments/{id}/approve"
    description: "Approve a prepared allotment; the preparer may not approve their own row."
    roles: [BudgetDirector]
    code: 200
    input: []
    output: Allotment
    side_effects: ["approved_by_user_id = X-User-ID", "status = APPROVED", "increments Allotment.version by 1"]
  - method: POST
    path: "/fiscal/allotments/{id}/release"
    description: "Release the approved cash for the current quarter, driving the appropriation cash dimension, the cycle posture and the release holds."
    roles: [StateController]
    code: 200
    input: []
    output: Allotment
    side_effects: ["released_cents = computed_release_cents, status = RELEASED", "Appropriation.released_cents, available_cash_cents and cash_status recomputed", "BudgetCycle.total_released_cents, cash_utilization_pct and cash_posture recomputed", "a CONSTRAINED posture sets release_hold on every GENERAL UNRELEASED appropriation of the cycle", "increments Allotment.version, Appropriation.version and BudgetCycle.version by 1 each"]
  - method: POST
    path: "/fiscal/allotments/{id}/recall"
    description: "Recall a released allotment; the compensating action of release, conserving total released cash."
    roles: [StateController]
    code: 200
    input: [reason]
    output: Allotment
    side_effects: ["released_cents = 0, status = RECALLED, stores recall_reason", "Appropriation and BudgetCycle cash figures recomputed", "a posture returning to NORMAL clears release_hold across the cycle", "increments Allotment.version, Appropriation.version and BudgetCycle.version by 1 each"]
  - method: POST
    path: "/fiscal/allotments/{id}/cancel"
    description: "Cancel a DRAFT or PREPARED allotment, freeing its quarter slot."
    roles: [BudgetAnalyst]
    code: 200
    input: []
    output: Allotment
    side_effects: ["status = CANCELLED", "computed_release_cents = 0 and binding_constraint = null", "frees the (appropriation_id, quarter) slot", "increments Allotment.version by 1"]

  # --- Budget transfers -----------------------------------------------------
  - method: POST
    path: "/fiscal/budget-transfers"
    description: "Propose moving authority between two appropriations of the same fund. Guarded by OCC on the source appropriation version (rule transfer-propose-stale-source)."
    roles: [BudgetAnalyst, BudgetDirector]
    code: 201
    input: [source_appropriation_id, target_appropriation_id, amount_cents, transfer_type, justification, expected_source_appropriation_version]
    output: BudgetTransfer
    side_effects: ["status = PROPOSED", "sets proposed_by_user_id = X-User-ID", "increments source Appropriation.version by 1"]
  - method: GET
    path: "/fiscal/appropriations/{id}/budget-transfers"
    description: "List transfers touching one appropriation on either side (reverse lookup for both BudgetTransfer FKs)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["side?", "status?", "limit?", "offset?"]
    output: BudgetTransfer[]
    side_effects: []
  - method: POST
    path: "/fiscal/budget-transfers/{id}/approve"
    description: "Approve a proposed transfer; the proposer may not approve their own row."
    roles: [BudgetDirector]
    code: 200
    input: []
    output: BudgetTransfer
    side_effects: ["status = APPROVED, approved_by_user_id = X-User-ID", "increments BudgetTransfer.version by 1"]
  - method: POST
    path: "/fiscal/budget-transfers/{id}/reject"
    description: "Reject a proposed transfer with no ledger effect."
    roles: [BudgetDirector]
    code: 200
    input: [reason]
    output: BudgetTransfer
    side_effects: ["status = REJECTED, stores decision_reason", "increments BudgetTransfer.version by 1"]
  - method: POST
    path: "/fiscal/budget-transfers/{id}/execute"
    description: "Execute an approved transfer, moving authority and cascading into match commitments, grants and the agency compliance flag."
    roles: [StateController]
    code: 200
    input: []
    output: BudgetTransfer
    side_effects: ["status = EXECUTED, executed_at from the logical clock", "source transfers_out_cents and target transfers_in_cents recomputed", "over-pledged MatchCommitment rows on the source move to AT_RISK", "affected FederalGrant.match_status recomputed", "owning Agency.federal_compliance_flag recomputed", "increments BudgetTransfer.version, source Appropriation.version and target Appropriation.version by 1 each"]
  - method: POST
    path: "/fiscal/budget-transfers/{id}/reverse"
    description: "Reverse an executed transfer; the compensating action of execute, conserving total authority."
    roles: [StateController]
    code: 200
    input: [reason]
    output: BudgetTransfer
    side_effects: ["status = REVERSED, stores decision_reason", "transfer figures recomputed on both rows", "AT_RISK MatchCommitment rows that fit again return to COMMITTED", "FederalGrant.match_status and Agency.federal_compliance_flag recomputed", "increments BudgetTransfer.version, source Appropriation.version and target Appropriation.version by 1 each"]

  # --- Expenditures ---------------------------------------------------------
  - method: POST
    path: "/fiscal/expenditures"
    description: "Post a charge against an appropriation; checked against the authority basis first and the cash basis second."
    roles: [AgencyBudgetOfficer]
    code: 201
    input: [appropriation_id, quarter, amount_cents, object_code, vendor_reference]
    output: Expenditure
    side_effects: ["status = POSTED, posted_at from the logical clock", "Appropriation.expended_cents, available_cash_cents and available_authority_cents recomputed", "FederalGrant.moe_current_spend_cents recomputed for the agency and cycle", "increments Appropriation.version by 1"]
  - method: POST
    path: "/fiscal/expenditures/{id}/void"
    description: "Void a posted charge; the compensating action of posting, conserving the expenditure ledger."
    roles: [StateController]
    code: 200
    input: [reason]
    output: Expenditure
    side_effects: ["status = VOIDED, stores void_reason", "Appropriation.expended_cents and both balance bases recomputed", "FederalGrant.moe_current_spend_cents recomputed", "increments Expenditure.version and Appropriation.version by 1 each"]
  - method: GET
    path: "/fiscal/appropriations/{id}/expenditures"
    description: "List the charges of one appropriation (reverse lookup for Expenditure.appropriation_id)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["status?", "quarter?", "limit?", "offset?"]
    output: Expenditure[]
    side_effects: []

  # --- Federal grants & match commitments -----------------------------------
  - method: POST
    path: "/fiscal/federal-grants"
    description: "Record a federal award with its match ratio, performance period and maintenance-of-effort baseline."
    roles: [BudgetAnalyst]
    code: 201
    input: [agency_id, budget_cycle_id, cfda_number, award_cents, period_start, period_end, moe_baseline_cents, "required_match_ratio?", "moe_prior_year1_spend_cents?", "moe_prior_year2_spend_cents?"]
    output: FederalGrant
    side_effects: ["required_state_match_cents = round_half_up(award_cents * required_match_ratio)", "match_status = UNMET", "moe_compliance_status = NOT_ASSESSED"]
  - method: GET
    path: "/fiscal/federal-grants/{id}"
    description: "Read one grant including match and MOE derived fields."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: []
    output: FederalGrant
    side_effects: []
  - method: GET
    path: "/fiscal/federal-grants"
    description: "List grants by agency or cycle (reverse lookup for both FederalGrant FKs)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["agency_id?", "budget_cycle_id?", "match_status?", "limit?", "offset?"]
    output: FederalGrant[]
    side_effects: []
  - method: POST
    path: "/fiscal/federal-grants/{id}/moe-assessment"
    description: "Assess maintenance of effort on the requested basis; the two bases can disagree on identical data."
    roles: [BudgetAnalyst]
    code: 200
    input: [basis]
    output: FederalGrant
    side_effects: ["runs calculation federal_moe_compliance", "writes moe_current_spend_cents, moe_compliance_ratio, moe_assessed_basis and moe_compliance_status", "increments FederalGrant.version by 1"]
  - method: POST
    path: "/fiscal/match-commitments"
    description: "Pledge state authority from an appropriation as match for a grant, subject to the overlapping-period capacity gate."
    roles: [AgencyBudgetOfficer]
    code: 201
    input: [federal_grant_id, appropriation_id, committed_match_cents]
    output: MatchCommitment
    side_effects: ["status = COMMITTED", "runs calculation federal_match_coverage", "recomputes FederalGrant.committed_match_cents and match_status", "recomputes Agency.federal_compliance_flag"]
  - method: GET
    path: "/fiscal/match-commitments/{id}"
    description: "Read one match commitment."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: []
    output: MatchCommitment
    side_effects: []
  - method: GET
    path: "/fiscal/match-commitments"
    description: "List commitments by grant or appropriation (reverse lookup for both MatchCommitment FKs)."
    roles: [SystemAdmin, AgencyBudgetOfficer, BudgetAnalyst, BudgetDirector, LegislativeFiscalOfficer, StateController]
    code: 200
    input: ["federal_grant_id?", "appropriation_id?", "status?", "limit?", "offset?"]
    output: MatchCommitment[]
    side_effects: []

  # --- Test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["recomputes the current cycle quarter for every BudgetCycle, and with it projected_cumulative_cash_cents, cash_utilization_pct and cash_posture"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_AGENCY_SCOPE_VIOLATION
    http: 403
    condition: "an AgencyBudgetOfficer acts on a row belonging to an agency other than its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approving X-User-ID equals the preparing or proposing X-User-ID on an allotment, recommendation or transfer"
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "agency_id in path or body matches no Agency"
  - id: ERR_BUDGET_CYCLE_NOT_FOUND
    http: 404
    condition: "budget_cycle_id in path or body matches no BudgetCycle"
  - id: ERR_REVENUE_FORECAST_NOT_FOUND
    http: 404
    condition: "forecast id in path or supersedes_forecast_id matches no RevenueForecast"
  - id: ERR_AGENCY_REQUEST_NOT_FOUND
    http: 404
    condition: "agency_request_id in path or body matches no AgencyRequest"
  - id: ERR_DECISION_PACKAGE_NOT_FOUND
    http: 404
    condition: "decision_package_id, depends_on_package_id or a member of recommended_package_ids matches no DecisionPackage"
  - id: ERR_RECOMMENDATION_NOT_FOUND
    http: 404
    condition: "recommendation id in path matches no ExecutiveRecommendation"
  - id: ERR_APPROPRIATION_NOT_FOUND
    http: 404
    condition: "appropriation id in path or body matches no Appropriation"
  - id: ERR_ALLOTMENT_NOT_FOUND
    http: 404
    condition: "allotment id in path matches no Allotment"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "transfer id in path matches no BudgetTransfer"
  - id: ERR_EXPENDITURE_NOT_FOUND
    http: 404
    condition: "expenditure id in path matches no Expenditure"
  - id: ERR_FEDERAL_GRANT_NOT_FOUND
    http: 404
    condition: "federal_grant_id in path or body matches no FederalGrant"
  - id: ERR_MATCH_COMMITMENT_NOT_FOUND
    http: 404
    condition: "match_commitment id in path matches no MatchCommitment"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required body field missing, unknown enum member, non-integer where an integer is required, or limit/offset outside 1..100 / >= 0"
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "a monetary or count field violates its sign rule, e.g. amount_cents <= 0, quarter outside 1..4, or CommitteeAction.amount_cents != 0 on RESTORE/STRIKE"
  - id: ERR_PERFORMANCE_TARGET_INVALID
    http: 422
    condition: "PerformanceMeasure.target_value <= baseline_value"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_budget_cycle_version, expected_agency_request_version or expected_source_appropriation_version does not match the parent's current version"
  - id: ERR_CYCLE_PHASE_INVALID
    http: 409
    condition: "the owning BudgetCycle is in a phase that does not permit the requested operation, including any write against a CLOSED cycle"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row is not in a state from which the requested transition is declared"
  - id: ERR_APPROPRIATION_NOT_ENACTED
    http: 409
    condition: "the referenced Appropriation.authority_status is not ENACTED"
  - id: ERR_CASH_FROZEN
    http: 409
    condition: "the referenced Appropriation.cash_status == FROZEN"
  - id: ERR_RELEASE_HOLD_ACTIVE
    http: 409
    condition: "the referenced Appropriation.release_hold == true because its cycle posture is CONSTRAINED"
  - id: ERR_DEPENDENCY_DEFERRED
    http: 422
    condition: "depends_on_package_id points at a DEFERRED package"
  - id: ERR_DEPENDENCY_NOT_RECOMMENDED
    http: 422
    condition: "recommend was attempted while the prerequisite package is not RECOMMENDED"
  - id: ERR_PACKAGE_NOT_RECOMMENDED
    http: 422
    condition: "a member of recommended_package_ids is not in status RECOMMENDED"
  - id: ERR_PACKAGE_REQUEST_MISMATCH
    http: 422
    condition: "a member of recommended_package_ids belongs to a different agency_request_id"
  - id: ERR_PERFORMANCE_MEASURE_REQUIRED
    http: 422
    condition: "an EXPANSION package has no PerformanceMeasure with target_value > baseline_value"
  - id: ERR_QUARTER_CLOSED
    http: 409
    condition: "the target quarter is earlier than the current cycle quarter of the logical clock"
  - id: ERR_QUARTER_NOT_OPEN
    http: 409
    condition: "the target quarter is later than the current cycle quarter of the logical clock"
  - id: ERR_CYCLE_NOT_ENDED
    http: 409
    condition: "close was attempted before the logical clock reached fiscal_year_start_date + 12 months"
  - id: ERR_FORECAST_WINDOW_CONFLICT
    http: 409
    condition: "the adopted window sits within the 30-day quiet buffer of another ADOPTED window of the same cycle and source_code"
  - id: ERR_ALLOTMENT_QUARTER_OCCUPIED
    http: 409
    condition: "another Allotment on the same appropriation and quarter is in status DRAFT, PREPARED, APPROVED or RELEASED"
  - id: ERR_ACTION_SEQUENCE_DUPLICATE
    http: 409
    condition: "sequence_number is already used by another CommitteeAction of the same appropriation"
  - id: ERR_DUPLICATE_PRIORITY_RANK
    http: 409
    condition: "priority_rank is already used by another DecisionPackage of the same request"
  - id: ERR_DUPLICATE_AGENCY_REQUEST
    http: 409
    condition: "the agency already has an AgencyRequest in this cycle"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "agency_code, fiscal_year, or program_code within (cycle, agency) already exists"
  - id: ERR_TRANSFER_SAME_APPROPRIATION
    http: 422
    condition: "source_appropriation_id == target_appropriation_id"
  - id: ERR_TRANSFER_FUND_TYPE_MISMATCH
    http: 422
    condition: "source and target appropriations have different fund_type"
  - id: ERR_TRANSFER_TYPE_MISMATCH
    http: 422
    condition: "transfer_type INTRA_AGENCY with different agency_id, or INTER_AGENCY with equal agency_id"
  - id: ERR_NEGATIVE_APPROPRIATION_BALANCE
    http: 422
    condition: "the committee replay would drive the running balance below zero at some sequence position"
  - id: ERR_TRANSFER_EXCEEDS_AUTHORITY_CAP
    http: 422
    condition: "amount_cents exceeds 10 percent of the source appropriation's enacted amount"
  - id: ERR_TRANSFER_EXCEEDS_AVAILABLE
    http: 422
    condition: "amount_cents exceeds the source appropriation's available_authority_cents, or a reversal would exceed the target's"
  - id: ERR_APPROPRIATION_OVERSPEND
    http: 422
    condition: "the charge exceeds available_authority_cents (authority basis)"
  - id: ERR_INSUFFICIENT_CASH_RELEASED
    http: 422
    condition: "the charge exceeds available_cash_cents (cash basis), or a recall would push released_cents below expended_cents"
  - id: ERR_NO_RELEASE_CAPACITY
    http: 422
    condition: "the allotment release ceiling evaluates to zero"
  - id: ERR_ALLOTMENT_EXCEEDS_CEILING
    http: 422
    condition: "the ceiling is below requested_cents while allow_partial is false"
  - id: ERR_NO_ADOPTED_FORECAST
    http: 422
    condition: "the cycle has no ADOPTED GENERAL revenue forecast"
  - id: ERR_BUDGET_NOT_BALANCED
    http: 422
    condition: "approved recommendations exceed adopted revenue net of the constitutional reserve, or LEGISLATIVE was requested while balance_certified is false"
  - id: ERR_EMERGENCY_EXCEEDS_RESERVE_CAPACITY
    http: 422
    condition: "the emergency request exceeds the reserve capacity computed with the pinned evaluation order"
  - id: ERR_MATCH_AGGREGATE_CAPACITY_EXCEEDED
    http: 422
    condition: "overlapping committed match pledges plus the new pledge exceed the appropriation's available_authority_cents"
  - id: ERR_NO_REDUCTION_CANDIDATES
    http: 422
    condition: "no eligible REDUCTION package exists for the cycle"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Statewide financial-system operator: registers agencies and cycles and owns the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /fiscal/agencies"
      - "POST /fiscal/budget-cycles"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"
  - name: AgencyBudgetOfficer
    description: "Budget officer of one agency; may only touch rows whose agency chain resolves to its own X-User-ID."
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /fiscal/agency-requests"
      - "POST /fiscal/agency-requests/{id}/submit"
      - "POST /fiscal/decision-packages"
      - "POST /fiscal/performance-measures"
      - "POST /fiscal/expenditures"
      - "POST /fiscal/match-commitments"
    shared_operations:
      - "every GET endpoint"
  - name: BudgetAnalyst
    description: "Budget office analyst: reviews requests, records forecasts and grants, builds recommendations, scenarios and allotments."
    identity: opaque
    exclusive_operations:
      - "POST /fiscal/revenue-forecasts"
      - "POST /fiscal/agency-requests/{id}/begin-review"
      - "POST /fiscal/agency-requests/{id}/return-for-revision"
      - "POST /fiscal/agency-requests/{id}/accept"
      - "POST /fiscal/decision-packages/{id}/recommend"
      - "POST /fiscal/decision-packages/{id}/defer"
      - "POST /fiscal/reduction-scenarios"
      - "POST /fiscal/allotments"
      - "POST /fiscal/allotments/{id}/cancel"
      - "POST /fiscal/federal-grants"
      - "POST /fiscal/federal-grants/{id}/moe-assessment"
    shared_operations:
      - "POST /fiscal/executive-recommendations (with BudgetDirector)"
      - "POST /fiscal/allotments/{id}/prepare (with BudgetDirector)"
      - "POST /fiscal/budget-transfers (with BudgetDirector)"
      - "every GET endpoint"
  - name: BudgetDirector
    description: "Budget director: adopts forecasts, drives cycle phases, certifies balance, approves recommendations, allotments and transfers, and grants emergency appropriations. May also prepare, in which case segregation of duties blocks the matching approval."
    identity: opaque
    exclusive_operations:
      - "POST /fiscal/revenue-forecasts/{id}/adopt"
      - "POST /fiscal/budget-cycles/{id}/advance-phase"
      - "POST /fiscal/budget-cycles/{id}/certify-balance"
      - "POST /fiscal/executive-recommendations/{id}/approve"
      - "POST /fiscal/allotments/{id}/approve"
      - "POST /fiscal/budget-transfers/{id}/approve"
      - "POST /fiscal/budget-transfers/{id}/reject"
      - "POST /fiscal/appropriations/emergency"
    shared_operations:
      - "POST /fiscal/executive-recommendations (with BudgetAnalyst)"
      - "POST /fiscal/allotments/{id}/prepare (with BudgetAnalyst)"
      - "POST /fiscal/budget-transfers (with BudgetAnalyst)"
      - "every GET endpoint"
  - name: LegislativeFiscalOfficer
    description: "Legislative fiscal staff: introduces appropriation line items, records committee action and enacts the bill."
    identity: opaque
    exclusive_operations:
      - "POST /fiscal/appropriations"
      - "POST /fiscal/appropriations/{id}/enact"
      - "POST /fiscal/committee-actions"
    shared_operations:
      - "every GET endpoint"
  - name: StateController
    description: "State controller: releases and recalls cash, executes and reverses transfers, voids charges, freezes cash and closes the fiscal year."
    identity: opaque
    exclusive_operations:
      - "POST /fiscal/allotments/{id}/release"
      - "POST /fiscal/allotments/{id}/recall"
      - "POST /fiscal/budget-transfers/{id}/execute"
      - "POST /fiscal/budget-transfers/{id}/reverse"
      - "POST /fiscal/expenditures/{id}/void"
      - "POST /fiscal/appropriations/{id}/freeze-cash"
      - "POST /fiscal/appropriations/{id}/unfreeze-cash"
      - "POST /fiscal/budget-cycles/{id}/close"
    shared_operations:
      - "every GET endpoint"

# =============================================================================
# Named global invariants referenced by 1.2 side effects (Rule 9)
# =============================================================================
invariants:
  - name: released_authority_conservation
    conserved_quantity: "total released cash of a cycle"
    formula: |
      BudgetCycle.total_released_cents
        == sum(Appropriation.released_cents for appropriations of the cycle)
        == sum(Allotment.released_cents for allotments whose status == RELEASED
               and whose appropriation belongs to the cycle)
    holds_after: "POST /fiscal/allotments/{id}/release followed by POST /fiscal/allotments/{id}/recall returns every term to its pre-release value"
  - name: transfer_authority_conservation
    conserved_quantity: "total spending authority of a cycle"
    formula: |
      sum(Appropriation.enacted_amount_cents + transfers_in_cents - transfers_out_cents
          for appropriations of the cycle)
        == sum(Appropriation.enacted_amount_cents for appropriations of the cycle)
    holds_after: "every POST /fiscal/budget-transfers/{id}/execute and every POST /fiscal/budget-transfers/{id}/reverse"
  - name: expenditure_ledger_conservation
    conserved_quantity: "posted charges against an appropriation"
    formula: |
      Appropriation.expended_cents
        == sum(Expenditure.amount_cents for expenditures of the appropriation with status == POSTED)
    holds_after: "POST /fiscal/expenditures followed by POST /fiscal/expenditures/{id}/void returns expended_cents and both balance bases to their pre-posting values"
  - name: reversion_carryforward_conservation
    conserved_quantity: "unexpended authority at close"
    formula: |
      for every closed Appropriation:
        carryforward_cents + reverted_cents
          == max(0, enacted_amount_cents + transfers_in_cents - transfers_out_cents - expended_cents)
    holds_after: "POST /fiscal/budget-cycles/{id}/close"
