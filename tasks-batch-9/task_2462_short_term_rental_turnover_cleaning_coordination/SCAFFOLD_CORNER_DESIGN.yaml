              as_user_id: "${cc}"
              captures: { acc1_status: "$.data.status", acc1_at: "$.data.accepted_at" }
            - call: "POST /assignments/${a1}/accept"
              payload: {}
              as: Cleaner
              as_user_id: "${cc}"
            - call: "GET /pay-lines"
              payload: { turnover_id: "${t1}" }
              as: Coordinator
              captures: { pay_net: "$.data[0].net_cents", pay_status: "$.data[0].status" }
            - call: "GET /cleaners/${cc}"
              payload: {}
              as: Coordinator
              captures: { ledger: "$.data.pending_payout_cents" }
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { t_status: "$.data.status", t_ver: "$.data.version" }
          assert:
            - "first accept: HTTP 200, ${acc1_status} == ACCEPTED, ${acc1_at} == 2026-08-01T00:00:00Z"
            - "second accept: HTTP 409 with data.error_id == ERR_INVALID_ASSIGNMENT_STATE"
            - "GET /pay-lines?turnover_id=${t1} returns total_count == 1 with ${pay_status} == PROVISIONAL and ${pay_net} == 12554"
            - "${ledger} == 12554 (credited once, not twice)"
            - "${t_status} == SCHEDULED and ${t_ver} == 3 (create 1, assign 2, accept 3 - the refused accept did not increment)"

      - name: corner_second_offer_supersedes_and_revokes_the_outstanding_one
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Assignment.OFFERED_to_REVOKED
          - endpoints["POST /turnovers/{id}/assign"].side_effects
          - entities.Assignment.fields.sequence_no
        distinguishing_aspect: |
          Re-offering the same turnover to a different cleaner is a declared supersede: the
          first Assignment becomes REVOKED with revoked_at set, the second is created with
          sequence_no 2, and because no PayLine existed yet neither cleaner's ledger moves.
          The turnover stays PENDING_ASSIGNMENT but its version advances 1 -> 2 -> 3.
        test_recipe:
          setup:
            - "P1, cleaners C1 (ZONE_A skill 4 quality 92.00) and C2 (ZONE_A skill 3 quality 88.00), T1 in PENDING_ASSIGNMENT at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
