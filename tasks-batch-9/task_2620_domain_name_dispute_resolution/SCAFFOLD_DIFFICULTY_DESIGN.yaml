      - name: expired_correction_period_closes_the_case_and_reverses_the_whole_ledger
        grounds:
          - state_machines.DeficiencyNotice.OPEN_to_EXPIRED
          - state_machines.Case.DEFICIENT_to_ADMIN_CLOSED
          - calculations.withdrawal_refund
          - calculations.case_ledger_reconciliation
          - calculations.domain_occupation_conflict
          - endpoints.POST_/udrp/_ops/deadline-sweep
        distinguishing_aspect: |
          The cascade is started by nothing but the clock: POST /udrp/_ops/deadline-sweep carries an
          empty payload and still walks DeficiencyNotice OPEN -> EXPIRED -> Case DEFICIENT ->
          ADMIN_CLOSED -> a server-minted negative REFUND FeeTransaction at the full pre-clearance
          percentage -> recomputed paid_cents and complainant_paid_cents of 0 -> refiling_bar_until
          30 days out, and the notice whose deadline has *not* yet passed on a second case is left
          strictly untouched, so the sweep is proved selective as well as cascading.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z while both cases are filed, then moved to 2026-08-07T00:00:00Z before the sweep."
            - "Registrar IANA-1202 ACTIVE; domains lapsed.example and stillopen.example under it."
            - "Complainant Lapse GmbH (country_code FR) files a case on each domain; both reach FILED with three grounds and 150000 cents paid."
            - "Case A (lapsed.example) receives a deficiency notice with correction_days 5 on 2026-08-01, so its correction_deadline_at is 2026-08-06T00:00:00Z - already past at sweep time."
            - "Case B (stillopen.example) receives a deficiency notice with correction_days 10, so its correction_deadline_at is 2026-08-11T00:00:00Z - still in the future at sweep time."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Regis Twelve", iana_id: "IANA-1202", contact_email: "abuse@registwelve.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "lapsed.example", registrar_id: "${reg_id}", registrant_name_public: "Lapsed Holder", registrant_email_public: "lapsed@proxy.example", registration_date: "2020-05-05T00:00:00Z", expiry_date: "2027-05-05T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_a_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "stillopen.example", registrar_id: "${reg_id}", registrant_name_public: "Open Holder", registrant_email_public: "open@proxy.example", registration_date: "2020-06-06T00:00:00Z", expiry_date: "2027-06-06T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_b_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Lapse GmbH", country_code: "FR", email: "ip@lapse.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_a_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_a_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_a_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "LAPSE is a registered German mark.", evidence_count: 1, similarity_claim: "IDENTICAL" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_a_id}/grounds"
              payload: { ground_type: "NO_LEGITIMATE_INTEREST", assertion_text: "No licence exists.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_a_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "The domain was offered for sale to the complainant.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_a_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 150000, reference: "WIRE-1202-A" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_b_id}", mutual_jurisdiction: "US", remedy_requested: "CANCELLATION", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_b_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_b_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "LAPSE is a registered German mark.", evidence_count: 1, similarity_claim: "CONFUSINGLY_SIMILAR" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_b_id}/grounds"
              payload: { ground_type: "NO_LEGITIMATE_INTEREST", assertion_text: "No licence exists.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_b_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "The registrant runs a pay-per-click page.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_b_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 150000, reference: "WIRE-1202-B" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /udrp/cases/${case_a_id}/deficiency-notices"
              payload: { deficiency_codes: ["MUTUAL_JURISDICTION_ABSENT"], correction_days: 5 }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { notice_a_id: "$.data.id", dl_a: "$.data.correction_deadline_at" }
            - call: "POST /udrp/cases/${case_b_id}/deficiency-notices"
              payload: { deficiency_codes: ["MISSING_SIGNATURE"], correction_days: 10 }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { notice_b_id: "$.data.id", dl_b: "$.data.correction_deadline_at" }
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T00:00:00Z" }
              as: ProviderAdmin
          trigger:
            - call: "POST /udrp/_ops/deadline-sweep"
              payload: {}
              as: ProviderAdmin
              captures: { expired_1: "$.data.expired_notice_count", closed_1: "$.data.closed_case_count", defaulted_1: "$.data.defaulted_case_count" }
            - call: "GET /udrp/cases/${case_a_id}/fee-transactions"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { ledger_total: "$.meta.total_count", refund_kind: "$.data[1].kind", refund_amount: "$.data[1].amount_cents", refund_payer: "$.data[1].payer" }
            - call: "POST /udrp/_ops/deadline-sweep"
              payload: {}
              as: ProviderAdmin
              captures: { expired_2: "$.data.expired_notice_count", closed_2: "$.data.closed_case_count" }
          assert:
            - "DeficiencyNotice.${notice_a_id}.correction_deadline_at == 2026-08-06T00:00:00Z and DeficiencyNotice.${notice_b_id}.correction_deadline_at == 2026-08-11T00:00:00Z"
            - "First sweep returns expired_notice_count == 1 and closed_case_count == 1 and defaulted_case_count == 0"
            - "Link 1: DeficiencyNotice.${notice_a_id}.status == EXPIRED"
            - "Link 2: Case.${case_a_id}.status == ADMIN_CLOSED with closed_at == 2026-08-07T00:00:00Z"
            - "Link 3: a FeeTransaction with kind REFUND, payer COMPLAINANT, amount_cents == -150000 and reference AUTO-CLOSE-REFUND exists on case A (100% pre-clearance refund)"
            - "Link 4: Case.${case_a_id}.paid_cents == 0 and complainant_paid_cents == 0 and respondent_paid_cents == 0"
            - "Link 5: Case.${case_a_id}.refiling_bar_until == 2026-09-06T00:00:00Z"
            - "Link 6: Complainant.${cpl_id}.open_case_count == 2 before the sweep and 1 after it"
            - "GET /udrp/cases/${case_a_id}/fee-transactions returns meta.total_count == 2, ordered created_at ASC, with the refund second"
            - "Selectivity: DeficiencyNotice.${notice_b_id}.status is still OPEN, Case.${case_b_id}.status is still DEFICIENT and its paid_cents is still 150000"
            - "DomainName.${dom_a_id}.lock_status == UNLOCKED throughout, because no registrar verification was ever answered on case A"
            - "Idempotency: the second sweep at the same clock returns expired_notice_count == 0 and closed_case_count == 0 and mints no further FeeTransaction, so GET /udrp/cases/${case_a_id}/fee-transactions still reports meta.total_count == 2"
            - "A new POST /udrp/cases on ${dom_a_id} at clock 2026-08-07T00:00:00Z returns ERR_REFILING_BAR_ACTIVE (409)"

      - name: replacing_one_seated_panelist_unconstitutes_the_panel_and_voids_the_draft
        grounds:
          - state_machines.Case.PANEL_CONSTITUTED_to_PANEL_APPOINTMENT
          - state_machines.PanelistAppointment.ACCEPTED_to_REPLACED
          - state_machines.Decision.DRAFT_to_VOIDED
          - calculations.panelist_honoraria_allocation
          - calculations.load_and_population_counters
          - endpoints.POST_/udrp/appointments/{id}/replace
        distinguishing_aspect: |
          The caller replaces one appointment and four other rows move: the vacated seat's
          honoraria_cents is zeroed, the vacated panelist's active_case_load drops, the parent Case
          falls back out of PANEL_CONSTITUTED, and - two links removed from anything named in the
          request - the DRAFT Decision on that case becomes VOIDED while the PanelVote already cast
          on it survives as immutable history. A successor appointment is minted in NOMINATED and
          linked back through replaced_by_appointment_id, and only after that successor screens clean
          does the case return to PANEL_CONSTITUTED.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z throughout."
            - "Registrar IANA-1303 ACTIVE; domain vacate.example under it."
            - "Complainant Vacate Srl (country_code FR), mutual_jurisdiction US, remedy TRANSFER."
            - "150000 paid, cleared by cm-002, verification answered lock_applied true, EMAIL notification delivered, respondent elects a three-member panel."
            - "The complainant tops up 125000 and the respondent pays 125000, so paid_cents is 400000 and honoraria_pool_cents is 280000."
            - "Three panelists (DE, IT, ES) fill PRESIDING, CO_PANELIST_1 and CO_PANELIST_2 and all three screen at conflict_score 0.00, so the case reaches PANEL_CONSTITUTED and honoraria are written 112000 / 84000 / 84000."
            - "A decision is drafted and the PRESIDING seat casts a TRANSFER vote; the other two seats have not voted yet."
            - "A fourth panelist (NL) sits on the roster as the intended replacement."
