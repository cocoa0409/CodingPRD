      - name: bill_introduction_state_error_outranks_introduction_deadline_error
        grounds:
          - validations.priority_100.ERR_INVALID_DRAFTING_REQUEST_STATE
          - validations.priority_150.ERR_INTRODUCTION_DEADLINE_PASSED
          - endpoints.POST_bills
        distinguishing_aspect: |
          Category pair `state` (priority 100) versus `business_temporal`
          (priority 150) on POST /bills. Both conditions hold at once: the drafting
          request is still DRAFTING rather than DRAFT_READY, AND the logical clock has
          moved past session.introduction_deadline_utc. Only the priority-100 state
          error may surface; the deadline error must stay hidden.
        test_recipe:
          setup:
            - "CONVENED session with introduction_deadline_utc 2026-10-15T00:00:00Z."
            - "One drafting request advanced only as far as DRAFTING (research complete, draft NOT certified) with zero StatutoryConflict rows, so the priority-120 blocking-conflict check cannot fire."
            - "Logical clock then advanced to 2026-10-16T00:00:00Z, one day past the introduction deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
