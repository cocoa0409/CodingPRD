        excluded_because:
          difficulty_instance: compensating_invariant / handoff_void_restores_zero_deposit_liability
          rationale: |
            The saga's conserved-quantity claim for the credit leg is that instance's subject: it
            names the deposit liability that must return to its pre-handoff value after a void and
            checks it against the order, the handoff and the move together, which strictly contains
            any single-leg corner assertion.

      - name: saga_merge_unwind_of_open_children
        claim_type: saga_compensation
        grounds:
          - complexity_profile.consistency_model
          - state_machines.MoveRecord.NON_TERMINAL_to_DUPLICATE_MERGED
        excluded_because:
          difficulty_instance: transitive_cascade / duplicate_merge_three_hop_cascade
          rationale: |
            MERGE_INTO is the second global compensation path, and its three-hop unwind (orders,
            filings, placements and handoffs of the merged move) plus the survivor-side effects are
            asserted end-to-end there; repeating it here would only re-test the same trigger with a
            weaker child-state matrix.
