  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: royalty_rounding_pinned_per_line_then_summed
        grounds:
          - calculations.royalty_due_computation
          - calculations.royalty_due_computation.constants.CHANNEL_CLASS_ORDER
          - entities.RoyaltyReport.fields.channel_lines
          - entities.RoyaltyReport.fields.royalty_due_cents
        distinguishing_aspect: |
          Combination mode (b) — ORDER / GROUPING of the same operands. Rounding is
          pinned to per-line-then-sum: two lines of 2500005 net each at 800 bps give
          round_half_up(200000.4) == 200000 twice for 400000, whereas the natural
          sum-then-round path gives round_half_up(5000010 * 800 / 10000) ==
          round_half_up(400000.8) == 400001. The tier itself is still selected from
          the SUMMED basis 5000010 (>= 5000000 -> 800 bps), so an implementation must
          aggregate for tier selection yet NOT aggregate for rounding. One cent apart.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_C ACTIVE; agreement AGR_C ACTIVE on category JERSEY, MG 1000000, required_advance 250000 fully paid, term 2026-01-01..2027-12-31, posture CLEAR"
            - "two AUTHORIZED authorizations for LIC_C: DEPARTMENT (Metro Sports) and SPECIALTY (Court Culture), both covering 2026-01-01..2028-12-31 with sku_classes [JERSEY]"
