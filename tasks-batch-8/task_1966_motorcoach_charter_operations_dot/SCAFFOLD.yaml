roles:
  - name: PlatformAdmin
    description: "System administrator with full access to all resources and clock control"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/_clock/set_current_utc"
    shared_operations:
      - "POST /api/v1/customers"
      - "GET /api/v1/customers"
      - "GET /api/v1/customers/{id}"
      - "PATCH /api/v1/customers/{id}"
      - "POST /api/v1/vehicles"
      - "GET /api/v1/vehicles"
      - "GET /api/v1/vehicles/{id}"
      - "POST /api/v1/drivers"
      - "GET /api/v1/drivers"
      - "GET /api/v1/drivers/{id}"
      - "GET /api/v1/quotes"
      - "GET /api/v1/orders"
