      - name: transfer_is_gated_on_the_freeze_the_target_and_the_status
        claim_type: conditional_action
        grounds:
          - validations[priority=74]
          - validations[priority=75]
          - validations[priority=53]
          - errors[ERR_PORT_FREEZE_ACTIVE]
          - errors[ERR_TRANSFER_SAME_PROVIDER]
          - errors[ERR_TRANSFER_NOT_REQUESTED]
        distinguishing_aspect: |
          The port action is admitted only under three simultaneous conditions and each is
          isolated by a single-variable change: one millisecond before port_freeze_until the
          request is refused (ERR_PORT_FREEZE_ACTIVE) and at the freeze instant itself it is
          allowed, proving the half-open window; naming the holding carrier as the gaining
          carrier is refused (ERR_TRANSFER_SAME_PROVIDER); and once the gaining carrier has
          rejected the port, accepting the SAME transfer is refused
          (ERR_TRANSFER_NOT_REQUESTED) because REJECTED is terminal.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; carrier P1 (holding) and carrier P2 (gaining), both ACTIVE and licensed in TX with cap 50."
            - "One VOICE enrollment E1 on P1 starting 2026-08-01, so port_freeze_until is 2026-09-30 under the half-open convention."
          setup_api_calls:
