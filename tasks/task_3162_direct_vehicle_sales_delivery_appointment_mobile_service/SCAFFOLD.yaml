# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: VehicleOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /v1/orders/{orderId}/place"
        actor: Buyer
        preconditions:
          - "Actor must own the order: Buyer.id == VehicleOrder.buyer_id (ERR_ORDER_NOT_OWNED)"
          - "Buyer.status == ACTIVE (ERR_BUYER_NOT_ACTIVE)"
          - "The linked StateJurisdiction.status == ENACTED (ERR_JURISDICTION_NOT_ENACTED)"
          - "OrderFeeLedgerEntry with entry_type ORDER_FEE_PAYMENT for order_fee_cents must be posted before place (ERR_ORDER_FEE_UNPAID)"
        side_effects:
          - "placed_at := current logical clock instant"
          - "configuration_lock_deadline := placed_at + constants.configuration_lock_days days"
          - "DeliveryEstimate #1 created with estimate_state PROVISIONAL, notification_state UNNOTIFIED, basis_equipment_at := placed_at"
          - "order_total_due_cents recomputed provisionally (calculations.order_total_due_cents, variant provisional)"
          - "delivery_readiness_posture recomputed → FROZEN"
      - from: PLACED
        to: CONFIG_LOCKED
        trigger: "system (automatic at the moment now_utc > configuration_lock_deadline), or POST /v1/orders/{orderId}/lock-configuration"
        actor: system
        preconditions:
          - "For the explicit endpoint: Actor must own the order (ERR_ORDER_NOT_OWNED)"
          - "For the explicit endpoint: now_utc <= configuration_lock_deadline (ERR_CONFIG_LOCK_DEADLINE_PASSED)"
        side_effects:
          - "configuration_option_ids on VehicleOrder frozen; any later change request is rejected"
          - "A DeliveryEstimate whose notification_state is UNNOTIFIED moves to NOTIFIED"
          - "delivery_readiness_posture relinked to the current provisional estimate"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /v1/orders/{orderId}/cancel"
        actor: Buyer
        preconditions:
          - "Actor must own the order (ERR_ORDER_NOT_OWNED)"
        side_effects:
          - "DeliveryEstimate rows on this order with estimate_state IN {PROVISIONAL, FIRM} → SUPERSEDED"
          - "Every VISIBLE TradeInAppraisal on this order → REJECTED"
          - "Every non-terminal FinancingApplication on this order → DECLINED"
          - "Compensating OrderFeeLedgerEntry ORDER_FEE_REFUND written with amount_cents = -20000: the 25000-cent order fee is refunded less a retained 5000-cent cancellation fee, so a buyer who paid 25000 and then cancelled settles at order_credit_balance_cents == 5000; Buyer.order_credit_balance_cents recomputed"
          - "delivery_readiness_posture → FROZEN"
      - from: CONFIG_LOCKED
        to: ALLOCATED
        trigger: "POST /v1/orders/{orderId}/allocation"
        actor: PlatformAdmin
        preconditions:
          - "Order must be in CONFIG_LOCKED (ERR_ORDER_NOT_CONFIG_LOCKED)"
          - "An AllocationUnit with status UNASSIGNED exists in a ProductionBatch whose model_code equals the order's configuration model_code (ERR_NO_ELIGIBLE_UNIT)"
        side_effects:
          - "AllocationUnit.order_id := order id, status → ALLOCATED, allocated_at := now_utc"
          - "ProductionBatch.allocated_unit_count += 1 and unallocated_unit_count recomputed"
          - "DeliveryEstimate #2 created: window_start := unit.transport_eta, window_end := window_start + 7 days, prior_estimate_id := #1, shift_days := whole days the window start moved, estimate_state FIRM, notification_state UNNOTIFIED"
          - "VehicleOrder.estimate_shift_days_cumulative += DeliveryEstimate #2 shift_days"
          - "VehicleOrder.status → ALLOCATED"
      - from: ALLOCATED
        to: IN_TRANSIT
        trigger: "POST /v1/orders/{orderId}/dispatch-to-transport"
        actor: PlatformAdmin
        preconditions:
          - "Order must be in ALLOCATED (ERR_ORDER_NOT_ALLOCATED)"
        side_effects:
          - "AllocationUnit.status → IN_TRANSIT"
          - "VehicleOrder.delivery_readiness_posture recomputed"
      - from: IN_TRANSIT
        to: AT_DELIVERY_CENTER
        trigger: "POST /v1/orders/{orderId}/arrive-at-center"
        actor: PlatformAdmin
        preconditions:
          - "Order must be in IN_TRANSIT (ERR_ORDER_NOT_IN_TRANSIT)"
          - "Jurisdiction handover eligibility cleared: jurisdiction.direct_sales_permitted == true OR the order's delivery_center_id resolves to a center whose state_code differs from jurisdiction.state_code (ERR_OUT_OF_STATE_DELIVERY_REQUIRED)"
          - "When jurisdiction.gallery_only_required == true, the resolved center's center_kind must not be GALLERY (ERR_GALLERY_HANDOVER_FORBIDDEN)"
          - "The resolved center's center_kind must not be GALLERY, because a gallery holds no handover bay (ERR_GALLERY_SERIALIZATION_GAP)"
          - "The resolved center's status must be ACTIVE, not SUSPENDED or RETIRED (ERR_CENTER_NOT_FOUND_FOR_KIND)"
        side_effects:
          - "AllocationUnit.status → ARRIVED"
          - "Vehicle row created for this order with vin inherited from the allocation unit, odometer_miles 0, software_version = baseline, service_hold_state NONE, status IN_SERVICE"
          - "DeliveryCenter.booked_slot_count recomputed from live DeliveryAppointment and ServiceAppointment rows"
          - "VehicleOrder.delivery_readiness_posture recomputed; becomes READY when the allocation unit is ARRIVED and order_total_due_cents is fully covered, RESTRICTED when the allocation unit is ARRIVED but the total is not covered, FROZEN otherwise"
      - from: AT_DELIVERY_CENTER
        to: DELIVERY_SCHEDULED
        trigger: "POST /v1/delivery-appointments"
        actor: DeliveryAdvisor
        preconditions:
          - "Order must be in AT_DELIVERY_CENTER (ERR_ORDER_NOT_AT_CENTER)"
          - "Order.delivery_readiness_posture != FROZEN (ERR_ORDER_DELIVERY_NOT_READY)"
          - "Jurisdiction handover eligibility cleared (ERR_OUT_OF_STATE_DELIVERY_REQUIRED / ERR_GALLERY_HANDOVER_FORBIDDEN)"
          - "Bay slot free under the buffered half-open overlap rule (ERR_DELIVERY_SLOT_CONFLICT)"
          - "Every VISIBLE TradeInAppraisal on the order must be ACCEPTED (ERR_TRADE_IN_NOT_RESOLVED)"
          - "Any FinancingApplication on the order must be FUNDED (ERR_FINANCING_NOT_FUNDED)"
        side_effects:
          - "DeliveryCenter.booked_slot_count += 1"
          - "DeliveryEstimate rows on this order with estimate_state FIRM → CONSUMED"
      - from: DELIVERY_SCHEDULED
        to: DELIVERED
        trigger: "POST /v1/delivery-appointments/{appointmentId}/complete"
        actor: DeliveryAdvisor
        preconditions:
          - "Appointment must be in CONFIRMED (ERR_APPOINTMENT_NOT_CONFIRMED)"
          - "Appointment.order_id's linked VehicleOrder must be in DELIVERY_SCHEDULED (ERR_ORDER_NOT_DELIVERY_SCHEDULED)"
          - "Trade-in transfer settled when a credit was applied (ERR_TRADE_IN_TRANSFER_UNSETTLED)"
        side_effects:
          - "Vehicle row created (or updated) with vin, delivered_at := now_utc, software_version := latest SoftwareEntitlement version string, status IN_SERVICE"
          - "AllocationUnit.status → RELEASED"
          - "DeliveryAppointment.status → COMPLETED, acceptance_inspection_result set from input, documented_issue_count := count of documented issues in input"
          - "For each documented issue: a VehicleIssueNote row is created and VehicleOrder.issue_note_count reflects the new count"
          - "DeliveryCenter.booked_slot_count recomputed"
          - "VehicleOrder.order_total_due_cents recomputed (calculations.order_total_due_cents, variant final)"
          - "OrderFeeLedgerEntry DELIVERY_FEE_CHARGE written with amount_cents = -2500 against the buyer, unconditionally on every completion"
          - "OrderFeeLedgerEntry TRADE_IN_CREDIT written with amount_cents = +net_credit_cents for each ACCEPTED TradeInAppraisal on the order (none when no appraisal was accepted)"
          - "Buyer.order_credit_balance_cents recomputed"
          - "VehicleOrder.status → DELIVERED"
      - from: AT_DELIVERY_CENTER
        to: DELIVERY_SCHEDULED
        trigger: "POST /v1/delivery-appointments (HOME mode)"
        actor: DeliveryAdvisor
        preconditions:
          - "Same preconditions as the CENTER booking, plus the buyer service address must fall inside delivery_center.home_delivery_radius_miles (ERR_HOME_DELIVERY_OUT_OF_RANGE)"
          - "jurisdiction.mobile_service_permitted does not gate home handover"
        side_effects:
          - "Same as CENTER booking, except no bay slot is occupied and a van is reserved instead"

  - entity: DeliveryEstimate
    initial_state: PROVISIONAL
    terminal_states: [CONSUMED]
    transitions:
      - from: PROVISIONAL
        to: FIRM
        trigger: "POST /v1/orders/{orderId}/allocation"
        actor: PlatformAdmin
        preconditions:
          - "A prior estimate exists on the order, or the order is reaching ALLOCATED with no allocation history"
        side_effects: []
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "POST /v1/orders/{orderId}/delivery-estimates (a new estimate is projected)"
        actor: PlatformAdmin
        preconditions:
          - "The supplied basis_iso8601 or window_days must move either the projected window start or the projected window end of the order's current estimate (ERR_NO_ESTIMATE_CHANGE)"
        side_effects:
          - "VehicleOrder.estimate_shift_days_cumulative += this estimate's shift_days"
      - from: FIRM
        to: SUPERSEDED
        trigger: "POST /v1/orders/{orderId}/delivery-estimates after allocation"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "VehicleOrder.estimate_shift_days_cumulative += this estimate's shift_days"
      - from: FIRM
        to: CONSUMED
        trigger: "POST /v1/delivery-appointments"
        actor: DeliveryAdvisor
        preconditions:
          - "The appointment occupies the window this estimate pinned"
        side_effects: []
      - from: SUPERSEDED
        to: FIRM
        trigger: "POST /v1/delivery-estimates/{estimateId}/restore"
        actor: PlatformAdmin
        preconditions:
          - "The superseded estimate's window_start is still >= now_utc (ERR_ESTIMATE_WINDOW_EXPIRED)"
        side_effects:
          - "VehicleOrder.estimate_shift_days_cumulative −= this estimate's shift_days"
          - "Every other delivery estimate of the same order whose estimate_state == PROVISIONAL or FIRM → SUPERSEDED"

  - entity: DeliveryAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: CONFIRMED
        trigger: "POST /v1/delivery-appointments/{appointmentId}/confirm"
        actor: DeliveryAdvisor
        preconditions:
          - "Appointment must be in BOOKED (ERR_APPOINTMENT_NOT_BOOKED)"
          - "Linked VehicleOrder.delivery_readiness_posture IN {READY, RESTRICTED} (ERR_ORDER_DELIVERY_NOT_READY)"
        side_effects:
          - "Buyer notified; DeliveryEstimate notification_state → ACKNOWLEDGED on the consumed estimate"
      - from: CONFIRMED
        to: AT_RISK
        trigger: "system (automatic when a DeliveryEstimate on the linked order moves the projected window past scheduled_start)"
        actor: system
        preconditions: []
        side_effects:
          - "Linked VehicleOrder.status reverts to AT_DELIVERY_CENTER"
          - "DeliveryCenter.booked_slot_count −= 1 (the appointment no longer holds a live bay slot)"
      - from: AT_RISK
        to: CONFIRMED
        trigger: "POST /v1/delivery-appointments/{appointmentId}/rebook"
        actor: DeliveryAdvisor
        preconditions:
          - "Appointment must be in AT_RISK (ERR_APPOINTMENT_NOT_AT_RISK)"
          - "New interval free under the buffered half-open overlap rule (ERR_DELIVERY_SLOT_CONFLICT)"
          - "Linked VehicleOrder.delivery_readiness_posture IN {READY, RESTRICTED} (ERR_ORDER_DELIVERY_NOT_READY)"
        side_effects:
          - "DeliveryCenter.booked_slot_count += 1"
          - "Linked VehicleOrder.status → DELIVERY_SCHEDULED"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /v1/delivery-appointments/{appointmentId}/cancel"
        actor: DeliveryAdvisor
        preconditions:
          - "Appointment must not already be terminal (ERR_APPOINTMENT_ALREADY_TERMINAL)"
        side_effects:
          - "DeliveryCenter.booked_slot_count −= 1; linked VehicleOrder.status → AT_DELIVERY_CENTER"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /v1/delivery-appointments/{appointmentId}/cancel"
        actor: DeliveryAdvisor
        preconditions:
          - "Appointment must not already be terminal (ERR_APPOINTMENT_ALREADY_TERMINAL)"
        side_effects:
          - "DeliveryCenter.booked_slot_count −= 1; linked VehicleOrder.status → AT_DELIVERY_CENTER"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /v1/delivery-appointments/{appointmentId}/complete"
        actor: DeliveryAdvisor
        preconditions:
          - "acceptance_inspection_result must be CLEAN or ISSUES_DOCUMENTED (ERR_INSPECTION_INCOMPLETE)"
        side_effects: []

  - entity: TradeInAppraisal
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: APPRAISED
        trigger: "POST /v1/orders/{orderId}/trade-in-appraisals/{appraisalId}/appraise"
        actor: TradeInSpecialist
        preconditions:
          - "Appraisal must be in DRAFT (ERR_APPRAISAL_NOT_DRAFT)"
          - "Linked VehicleOrder.status IN {PLACED, CONFIG_LOCKED, ALLOCATED, IN_TRANSIT, AT_DELIVERY_CENTER} (ERR_ORDER_NOT_APPRAISABLE)"
          - "Linked VehicleOrder.delivery_readiness_posture != FROZEN is NOT required at appraisal time"
        side_effects:
          - "net_credit_cents recomputed (calculations.trade_in_net_credit_cents)"
      - from: APPRAISED
        to: OFFERED
        trigger: "POST /v1/orders/{orderId}/trade-in-appraisals/{appraisalId}/offer"
        actor: TradeInSpecialist
        preconditions:
          - "offer_valid_until > now_utc at the moment of offering (ERR_APPRAISAL_OFFER_EXPIRED)"
        side_effects:
          - "OrderFeeLedgerEntry TRADE_IN_CREDIT written for +net_credit_cents against the buyer; Buyer.order_credit_balance_cents recomputed"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /v1/_clock/set_current_utc to an instant strictly after offer_valid_until"
        actor: system
        preconditions: []
        side_effects:
          - "Compensating OrderFeeLedgerEntry TRADE_IN_CREDIT_REVERSAL written for −net_credit_cents; Buyer.order_credit_balance_cents returns to its pre-offer value"
      - from: EXPIRED
        to: REAPPRAISED
        trigger: "POST /v1/orders/{orderId}/trade-in-appraisals/{appraisalId}/reappraise"
        actor: TradeInSpecialist
        preconditions:
          - "A new offer_valid_until strictly after now_utc is supplied (ERR_APPRAISAL_OFFER_EXPIRED)"
        side_effects:
          - "A new OrderFeeLedgerEntry TRADE_IN_CREDIT is written for +net_credit_cents; Buyer.order_credit_balance_cents returns to its pre-expiry value"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /v1/orders/{orderId}/trade-in-appraisals/{appraisalId}/accept"
        actor: Buyer
        preconditions:
          - "Actor must own the order (ERR_ORDER_NOT_OWNED)"
          - "offer_valid_until > now_utc (ERR_APPRAISAL_OFFER_EXPIRED)"
        side_effects:
          - "Linked FinancingApplication whose include_trade_in_credit == true recomputes amount_financed_cents"
      - from: OFFERED
        to: REJECTED
        trigger: "POST /v1/orders/{orderId}/trade-in-appraisals/{appraisalId}/reject"
        actor: Buyer
        preconditions:
          - "Actor must own the order (ERR_ORDER_NOT_OWNED)"
        side_effects:
          - "Compensating OrderFeeLedgerEntry TRADE_IN_CREDIT_REVERSAL written for −net_credit_cents; Buyer.order_credit_balance_cents returns to its pre-offer value"

  - entity: FinancingApplication
    initial_state: SUBMITTED
    terminal_states: [FUNDED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: CONDITIONALLY_APPROVED
        trigger: "POST /v1/financing-applications/{applicationId}/decision"
        actor: FinancePartner
        preconditions:
          - "Application must be in SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)"
          - "Buyer.identity_verified == true (ERR_BUYER_NOT_VERIFIED)"
          - "order_total_due_cents (provisional) minus down_payment_cents must not exceed the band's maximum financeable amount (ERR_FINANCE_EXCEEDS_VEHICLE_VALUE)"
        side_effects:
          - "apr_bps, credit_band, monthly_payment_cents computed (calculations.financing_monthly_payment_cents)"
          - "Buyer.credit_band := this application's credit_band"
      - from: CONDITIONALLY_APPROVED
        to: CONTRACT_PENDING
        trigger: "POST /v1/financing-applications/{applicationId}/contract-review"
        actor: FinancePartner
        preconditions:
          - "Linked VehicleOrder.status IN {PLACED, CONFIG_LOCKED, ALLOCATED, IN_TRANSIT, AT_DELIVERY_CENTER} (ERR_ORDER_NOT_FINANCEABLE)"
        side_effects:
          - "amount_financed_cents recomputed with the accepted trade-in credit applied"
      - from: CONTRACT_PENDING
        to: FUNDED
        trigger: "POST /v1/financing-applications/{applicationId}/fund"
        actor: FinancePartner
        preconditions:
          - "Linked VehicleOrder.delivery_readiness_posture == READY (ERR_ORDER_DELIVERY_NOT_READY)"
          - "Every VISIBLE TradeInAppraisal on the order is ACCEPTED (ERR_TRADE_IN_NOT_RESOLVED)"
        side_effects:
          - "Linked VehicleOrder.order_total_due_cents recomputed provisionally with the funded amount applied"
      - from: SUBMITTED
        to: CONTRACT_PENDING
        trigger: "POST /v1/financing-applications/{id}/contract-review"
        actor: FinancePartner
        preconditions:
          - "Application must be in SUBMITTED or CONDITIONALLY_APPROVED (ERR_APPLICATION_NOT_SUBMITTED)"
          - "Linked VehicleOrder.status IN {PLACED, CONFIG_LOCKED, ALLOCATED, IN_TRANSIT, AT_DELIVERY_CENTER} (ERR_ORDER_NOT_FINANCEABLE)"
        side_effects:
          - "apr_bps, credit_band and monthly_payment_cents computed on this path"
          - "amount_financed_cents recomputed with the accepted trade-in credit applied"

      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /v1/financing-applications/{applicationId}/decision (outcome DECLINED)"
        actor: FinancePartner
        preconditions: []
        side_effects:
          - "Buyer.credit_band := SUBPRIME"
      - from: CONDITIONALLY_APPROVED
        to: DECLINED
        trigger: "POST /v1/financing-applications/{applicationId}/decision (outcome DECLINED, re-decision)"
        actor: FinancePartner
        preconditions: []
        side_effects:
          - "Buyer.credit_band := SUBPRIME"
          - "The order's DeliveryAppointment, if any, is refunded its bay slot: DeliveryCenter.booked_slot_count −= 1"

  - entity: ProductionBatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_PRODUCTION
        trigger: "POST /v1/production-batches/{batchId}/start"
        actor: PlatformAdmin
        preconditions:
          - "Batch must be in SCHEDULED (ERR_BATCH_NOT_SCHEDULED)"
        side_effects: []
      - from: IN_PRODUCTION
        to: DELAYED
        trigger: "POST /v1/production-batches/{batchId}/delay"
        actor: PlatformAdmin
        preconditions:
          - "Batch must be in IN_PRODUCTION or DELAYED (ERR_BATCH_NOT_DELAYABLE)"
          - "delay_days supplied must be >= 1 (ERR_INVALID_DELAY_DAYS)"
        side_effects:
          - "For each VehicleOrder linked through an AllocationUnit of this batch with status IN {ALLOCATED, IN_TRANSIT, ARRIVED}: the order's current PROVISIONAL or FIRM estimate → SUPERSEDED, and a fresh PROVISIONAL estimate is created with window_start = prior.window_start + delay_days, window_end = prior.window_end + delay_days, prior_estimate_id set to that superseded estimate, and shift_days = max(0, floor_days(new.window_start - prior.window_end))"
          - "Each affected order's VehicleOrder.estimate_shift_days_cumulative += that shift_days, because a transition INTO SUPERSEDED accrues"
          - "Each affected order's DeliveryAppointment with status CONFIRMED moves to AT_RISK when the shifted window end exceeds its scheduled_start"
          - "Each DeliveryAppointment that became AT_RISK moves its linked VehicleOrder.status back to AT_DELIVERY_CENTER"
          - "ProductionBatch.delay_days += supplied delay_days and planned_completion_at += the same number of days"
      - from: DELAYED
        to: DELAYED
        trigger: "POST /v1/production-batches/{batchId}/delay (cumulative second delay)"
        actor: PlatformAdmin
        preconditions:
          - "delay_days supplied must be >= 1 (ERR_INVALID_DELAY_DAYS)"
        side_effects:
          - "Same propagation as IN_PRODUCTION → DELAYED, applied cumulatively on top of the existing shift"
      - from: DELAYED
        to: IN_PRODUCTION
        trigger: "POST /v1/production-batches/{batchId}/resume"
        actor: PlatformAdmin
        preconditions:
          - "Batch must be in DELAYED (ERR_BATCH_NOT_DELAYED)"
        side_effects: []
      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "POST /v1/production-batches/{batchId}/complete"
        actor: PlatformAdmin
        preconditions:
          - "Batch must be in IN_PRODUCTION or DELAYED (ERR_BATCH_NOT_IN_PRODUCTION)"
        side_effects:
          - "AllocationUnit rows of this batch with status UNASSIGNED → ALLOCATED reads unchanged; no order state change"

  - entity: SoftwareEntitlement
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /v1/vehicles/{vehicleId}/software-entitlements (basis-version advances)"
        actor: PlatformAdmin
        preconditions:
          - "A newer software_version is supplied (ERR_ENTITLEMENT_VERSION_NOT_NEWER)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when now_utc > expires_at on a TRIAL row)"
        actor: system
        preconditions: []
        side_effects:
          - "Trial-created row's expires_at stays frozen; a new PURCHASE row is required to restore the feature"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /v1/vehicles/{vehicleId}/software-entitlements/{entitlementId}/revoke"
        actor: PlatformAdmin
        preconditions:
          - "Entitlement must not already be terminal (ERR_ALREADY_TERMINAL)"
        side_effects:
          - "price_cents is refunded as an OrderFeeLedgerEntry DELIVERY_FEE_WAIVER entry of +price_cents against the owning buyer's order"

  - entity: ServiceAppointment
    initial_state: TRIAGED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: TRIAGED
        to: CENTER_SCHEDULED
        trigger: "POST /v1/service-appointments/{id}/schedule-center"
        actor: ServiceTechnician
        preconditions:
          - "Appointment must be in TRIAGED (ERR_INVALID_STATE)"
          - "The referenced report's triage_outcome must be CENTER_REQUIRED (ERR_TRIAGE_NO_SERVICE_REQUIRED)"
          - "Service bay free under the buffered half-open overlap rule (ERR_SERVICE_SLOT_CONFLICT)"
        side_effects:
          - "DeliveryCenter.booked_slot_count += 1"
          - "Vehicle.service_hold_state → PARTS_HOLD when the report's parts_required == true"
      - from: TRIAGED
        to: MOBILE_DISPATCHED
        trigger: "POST /v1/mobile-service-visits"
        actor: ServiceTechnician
        preconditions:
          - "Appointment must be in TRIAGED (ERR_INVALID_STATE)"
          - "The referenced report's triage_outcome must be MOBILE_REQUIRED (ERR_TRIAGE_NO_SERVICE_REQUIRED)"
          - "jurisdiction.mobile_service_permitted == true (ERR_MOBILE_SERVICE_FORBIDDEN)"
        side_effects:
          - "Vehicle.service_hold_state → AWAITING_PARTS_SHIPMENT when the report's parts_required == true"
      - from: CENTER_SCHEDULED
        to: COMPLETED
        trigger: "system (automatic when now_utc >= scheduled_end)"
        actor: system
        preconditions: []
        side_effects:
          - "DeliveryCenter.booked_slot_count −= 1"
          - "Vehicle.service_hold_state → NONE"
      - from: CENTER_SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/service-appointments/{id}/cancel"
        actor: ServiceTechnician
        preconditions:
          - "Appointment must be in CENTER_SCHEDULED or TRIAGED (ERR_INVALID_STATE)"
        side_effects:
          - "DeliveryCenter.booked_slot_count −= 1 (the compensating release)"
          - "Vehicle.service_hold_state → NONE"
      - from: MOBILE_DISPATCHED
        to: COMPLETED
        trigger: "POST /v1/mobile-service-visits/{id}/complete"
        actor: ServiceTechnician
        preconditions:
          - "The linked visit must be in IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "Vehicle.service_hold_state → NONE"
      - from: MOBILE_DISPATCHED
        to: TRIAGED
        trigger: "POST /v1/mobile-service-visits/{id}/cancel"
        actor: ServiceTechnician
        preconditions:
          - "The linked visit must not be terminal (ERR_ALREADY_TERMINAL)"
        side_effects:
          - "Vehicle.service_hold_state → NONE"
          - "The appointment returns to TRIAGED so a new channel can be chosen"

  - entity: MobileServiceVisit
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PARTS_RESERVED
        trigger: "POST /v1/mobile-service-visits/{id}/reserve-parts"
        actor: PartsCoordinator
        preconditions:
          - "Visit must be in DRAFT (ERR_INVALID_STATE)"
          - "The linked report's parts_required must be true (ERR_PARTS_NOT_REQUIRED)"
        side_effects:
          - "parts_cost_cents frozen for the life of the visit"
      - from: PARTS_RESERVED
        to: PARTS_SHIPPED
        trigger: "POST /v1/mobile-service-visits/{id}/confirm-parts-shipment"
        actor: PartsCoordinator
        preconditions:
          - "Visit must be in PARTS_RESERVED (ERR_INVALID_STATE)"
        side_effects:
          - "parts_pre_shipped_at = now_utc"
      - from: DRAFT
        to: PARTS_SHIPPED
        trigger: "POST /v1/mobile-service-visits/{id}/confirm-parts-shipment when no parts are required"
        actor: PartsCoordinator
        preconditions:
          - "The linked report's parts_required must be false (ERR_PARTS_NOT_REQUIRED is not raised on this path)"
        side_effects:
          - "parts_pre_shipped_at = now_utc"
      - from: PARTS_RESERVED
        to: CANCELLED
        trigger: "POST /v1/mobile-service-visits/{id}/cancel"
        actor: ServiceTechnician
        preconditions:
          - "Visit must not already be terminal (ERR_ALREADY_TERMINAL)"
        side_effects:
          - "Linked ServiceAppointment returns to TRIAGED; Vehicle.service_hold_state → NONE"
      - from: PARTS_SHIPPED
        to: EN_ROUTE
        trigger: "POST /v1/mobile-service-visits/{id}/start"
        actor: ServiceTechnician
        preconditions:
          - "parts_pre_shipped_at must be non-null (ERR_PARTS_NOT_PRE_SHIPPED)"
        side_effects: []
      - from: EN_ROUTE
        to: IN_PROGRESS
        trigger: "system (automatic when now_utc >= visit_start)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /v1/mobile-service-visits/{id}/complete"
        actor: ServiceTechnician
        preconditions:
          - "Vehicle.service_hold_state must be AWAITING_PARTS_SHIPMENT or PARTS_HOLD (ERR_INVALID_STATE)"
        side_effects:
          - "Linked ServiceAppointment.status → COMPLETED"
          - "Vehicle.service_hold_state → NONE"
          - "DeliveryCenter.booked_slot_count recomputed"
      - from: DRAFT
        to: RESCHEDULED
        trigger: "POST /v1/mobile-service-visits/{id}/reschedule"
        actor: ServiceTechnician
        preconditions:
          - "Visit must be in DRAFT, PARTS_RESERVED or PARTS_SHIPPED (ERR_INVALID_STATE)"
          - "The new van window must be free (ERR_VAN_SCHEDULE_CONFLICT)"
        side_effects:
          - "status returns to PARTS_SHIPPED when parts_pre_shipped_at is non-null, otherwise PARTS_RESERVED"
      - from: PARTS_SHIPPED
        to: RESCHEDULED
        trigger: "POST /v1/mobile-service-visits/{id}/reschedule"
        actor: ServiceTechnician
        preconditions:
          - "The new van window must be free (ERR_VAN_SCHEDULE_CONFLICT)"
        side_effects:
          - "status returns to PARTS_SHIPPED"

  - entity: Vehicle
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: SERVICE_HOLD
        trigger: "system (automatic when service_hold_state moves to PARTS_HOLD or AWAITING_PARTS_SHIPMENT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SERVICE_HOLD
        to: IN_SERVICE
        trigger: "system (automatic when service_hold_state returns to NONE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /v1/vehicles/{id}/retire"
        actor: PlatformAdmin
        preconditions:
          - "Vehicle must be IN_SERVICE (ERR_INVALID_STATE)"
        side_effects:
          - "Every ACTIVE SoftwareEntitlement on this vehicle that is not a PURCHASE row → REVOKED"
          - "The vehicle is excluded from new service appointments"

  - entity: VehicleIssueNote
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /v1/issue-notes/{id}/resolve"
        actor: ServiceTechnician
        preconditions:
          - "Note must be OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "The linked order's delivery_readiness_posture recomputed"
      - from: OPEN
        to: WAIVED
        trigger: "POST /v1/issue-notes/{id}/waive"
        actor: PlatformAdmin
        preconditions:
          - "Note must be OPEN (ERR_INVALID_STATE)"
          - "waiver_reason must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "The linked order's delivery_readiness_posture recomputed"

  - entity: StateJurisdiction
    initial_state: DRAFT
    terminal_states: [REPEALED]
    transitions:
      - from: DRAFT
        to: ENACTED
        trigger: "POST /v1/jurisdictions/{id}/enact"
        actor: PlatformAdmin
        preconditions:
          - "Jurisdiction must be in DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "Orders already bound to this regime can now reach PLACED"
      - from: ENACTED
        to: REPEALED
        trigger: "system (automatic when the regime is withdrawn)"
        actor: system
        preconditions: []
        side_effects:
          - "Orders bound to this regime can no longer be placed"

  - entity: Buyer
    initial_state: PENDING_VERIFICATION
    terminal_states: [SUSPENDED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /v1/buyers/{id}/identity-verification"
        actor: PlatformAdmin
        preconditions:
          - "Buyer must be in PENDING_VERIFICATION (ERR_INVALID_STATE)"
        side_effects:
          - "identity_verified = true; the account may now open and place orders"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/buyers/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Buyer must be in ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Every subsequent Buyer-role operation is rejected with ERR_BUYER_SUSPENDED"

  - entity: DeliveryCenter
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/delivery-centers/{centerId}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Center must be in ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Every BOOKED or CONFIRMED appointment at this center is retained; new bookings at this center are rejected with ERR_CENTER_NOT_FOUND_FOR_KIND"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/delivery-centers/{centerId}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Center must be in SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "system (automatic when every appointment at the center is terminal and no live visit is assigned to it)"
        actor: system
        preconditions: []
        side_effects:
          - "booked_slot_count is driven to 0 as the compensating cancellations land"

  # =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on the parent's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: delivery-appointment-create-with-stale-order-version
    parent_entity: VehicleOrder
    write_endpoint: "POST /v1/delivery-appointments"
    occ_field: "expected_order_version"
    description: |
      Booking a handover against a VehicleOrder whose version has advanced since
      the advisor last read it is rejected. The order legitimately admits a new
      appointment after the prior one was cancelled or after the readiness
      posture changed, so a repeated sequential booking on a stale read is a
      real occurrence rather than a state-precondition violation.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: delivery-appointment-complete-with-stale-order-version
    parent_entity: VehicleOrder
    write_endpoint: "POST /v1/delivery-appointments/{appointmentId}/complete"
    occ_field: "expected_order_version"
    description: |
      Completing an acceptance inspection against a VehicleOrder the advisor
      read before another side effect bumped its version is rejected, because
      the delivery total and the trade-in ledger the advisor saw are stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: mobile-visit-create-with-stale-appointment-version
    parent_entity: ServiceAppointment
    write_endpoint: "POST /v1/mobile-service-visits"
    occ_field: "expected_service_appointment_version"
    description: |
      Dispatching a mobile visit against a ServiceAppointment whose version has
      advanced since the dispatcher read it is rejected. A triaged appointment
      accepts a new dispatch after a prior visit was cancelled, so the repeated
      sequential create on a stale read is a genuine occurrence.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_total_due_cents
    trigger: "order placement, option change, allocation, and delivery completion"
    algorithm: dual_variant
    formula: |
      subtotal = configuration.configured_price_cents
      options  = sum(ConfigurationOption.price_cents for option in order's
                     configuration options where is_software_entitlement == false)
      base     = subtotal + options
      late_fee = constants.order_fee_cents if now_utc > order.configuration_lock_deadline
                 else 0
      doc_fee  = min(constants.doc_fee_cents, jurisdiction.doc_fee_cap_cents)
      note: jurisdiction.doc_fee_cap_cents == 0 means doc_fee = 0 (no documentation fee)
      VARIANT provisional (order.status NOT IN {DELIVERED}):
        order_total_due_cents = base + order_fee_cents + late_fee + doc_fee + 2500
      VARIANT final (order.status == DELIVERED):
        order_total_due_cents = base + order_fee_cents + late_fee + doc_fee
                                + 2500
                                - min(2500, sum(appraisal.net_credit_cents
                                                for appraisal in order's appraisals
                                                where appraisal.status == ACCEPTED))
      Rounding order is pinned: the delivery fee is added BEFORE the trade-in
      credit is subtracted, and the resulting value is rounded once at the end.
    input_set: "configuration options where is_software_entitlement == false; appraisals where status == ACCEPTED"
    constants:
      order_fee_cents: 25000
      doc_fee_cents: 7500
      delivery_fee_cents: 2500
    precision: "integer cents; round_half_up when a division is introduced"
    variants:
      - name: provisional
        when: "order.status NOT IN {DELIVERED} — the total is quoted as owed"
        difference: "no trade-in credit is subtracted, so the delivery fee remains in full"
      - name: final
        when: "order.status == DELIVERED, computed inside the completion transition"
        difference: "the accepted trade-in net credit is subtracted, capped at the 2500-cent delivery fee"

  - name: delivery_estimate_window
    trigger: "order placement, unit allocation, and each production delay event"
    algorithm: forward_looking
    formula: |
      basis = allocation_unit.transport_eta when the order has an AllocationUnit
                  whose status is ALLOCATED, IN_TRANSIT, ARRIVED or RELEASED
              else now_utc + jurisdiction.transport_lead_days (the pre-allocation
                  projection made at order placement)
      buffer_days = 7 when an AllocationUnit is ALLOCATED
                    else 5
      window_start = basis
      window_end   = basis + buffer_days days
      prior_end = prior_estimate.window_end when prior_estimate is not null else null
      shift_days = 0 when prior_end is null
                   else max(0, floor_days(window_start - prior_end))
      floor_days(x) = whole days of x rounded DOWN
      Tie-break and ordering: estimates are ordered by created_at ASC; the
      first estimate of an order always has prior_estimate_id == null.
    input_set: "the order's current PROVISIONAL or FIRM estimate, plus the newest batch delay affecting an ALLOCATED unit"
    constants:
      MIN_BUFFER_DAYS: 5
      STANDARD_BUFFER_DAYS: 7
      TRANSPORT_LEAD_DAYS: 7
    precision: "shift_days is an integer number of whole days, floored"
    variants:
      - name: pre_allocation
        when: "the order has no ALLOCATED AllocationUnit"
        difference: "window is projected from batch planned_completion_at plus the jurisdiction transport lead, and the buffer is 5 days"
      - name: post_allocation
        when: "the order has an ALLOCATED AllocationUnit"
        difference: "window is projected from the unit's transport_eta and the buffer widens to 7 days"

  - name: financing_monthly_payment_cents
    trigger: "every financing decision and every contract review"
    algorithm: tiered_pricing
    formula: |
      amount_financed_cents = max(0, order_total_due_cents(provisional)
                                  - down_payment_cents
                                  - applied_trade_in_credit_cents)
      applied_trade_in_credit_cents = sum(appraisal.net_credit_cents for the
                                  order's appraisals where status == ACCEPTED)
                                  when include_trade_in_credit == true else 0
      apr_bps = tier lookup on (credit_band, term_months) — total over all terms:
        PRIME       & term <= 48  -> 490
        PRIME       & term >= 49  -> 590
        NEAR_PRIME  & term <= 48  -> 790
        NEAR_PRIME  & term >= 49  -> 890
        SUBPRIME    (any term)    -> 1290
      monthly_rate = apr_bps / 10000 / 12
      monthly_payment_cents = round_half_up(
          amount_financed_cents * monthly_rate
          / (1 - (1 + monthly_rate) ** (-term_months)))
      All three inputs are pinned and the single rounding happens once at the end.
    input_set: "the order's provisional total, the applicant's down payment, and appraisals where status == ACCEPTED"
    constants:
      PRIME_SHORT_APR_BPS: 490
      PRIME_LONG_APR_BPS: 590
      NEAR_PRIME_SHORT_APR_BPS: 790
      NEAR_PRIME_LONG_APR_BPS: 890
      SUBPRIME_APR_BPS: 1290
      SHORT_TERM_MAX_MONTHS: 48
      LONG_TERM_MIN_MONTHS: 49
    precision: "integer cents; round_half_up applied once to the annuity result"
    variants:
      - name: gross
        when: "include_trade_in_credit == false"
        difference: "no trade-in credit reduces the financed principal"
      - name: net_of_trade_in
        when: "include_trade_in_credit == true and at least one accepted appraisal exists"
        difference: "the accepted trade-in credit lowers amount_financed_cents and therefore the monthly payment"

  - name: trade_in_net_credit_cents
    trigger: "appraisal, offer, and reappraisal"
    algorithm: threshold
    formula: |
      raw = gross_offer_cents - reconditioning_estimate_cents
      mileage_deduction_cents = min(constants.MILEAGE_DEDUCTION_CAP_CENTS,
          (mileage - constants.MILEAGE_DEDUCTION_THRESHOLD_MILES) * 12)
      net_credit_cents = max(constants.TRADE_IN_FLOOR_CENTS, raw - mileage_deduction_cents)
      Order of operations is pinned: the reconditioning deduction is applied to
      the gross offer FIRST, the mileage deduction is applied SECOND, and the
      floor is applied LAST.
      A negative net_credit_cents is clamped upward to the 25000-cent floor so
      that no desktop valuation can force a negative ledger entry.
    input_set: "a single TradeInAppraisal in any non-terminal state"
    constants:
      MILEAGE_DEDUCTION_THRESHOLD_MILES: 50000
      MILEAGE_DEDUCTION_CAP_CENTS: 200000
      TRADE_IN_FLOOR_CENTS: 25000
    precision: "integer cents; the mileage deduction is a linear function, no rounding step"
    variants:
      - name: straight
        when: "mileage <= 50000"
        difference: "no mileage deduction is applied, so the credit is gross offer minus reconditioning, floored"
      - name: mileage_penalised
        when: "mileage > 50000"
        difference: "each mile above the threshold costs 12 cents up to a 200000-cent ceiling before the floor is applied"

  - name: entitlement_bundle_price_cents
    trigger: "software entitlement purchase"
    algorithm: weighted_scoring
    formula: |
      existing_count = count of SoftwareEntitlement rows on the vehicle whose
                       status == ACTIVE, evaluated BEFORE any new row is inserted
      tier_bps = 0    when existing_count <= 1
               = 500  when existing_count <= 3
               = 1000 otherwise
      raw_total = sum(entry.price_cents for entry in the request, in request order)
      gross_discount = raw_total * tier_bps / 10000
      applied_discount = min(constants.MAX_BUNDLE_DISCOUNT_CENTS, gross_discount)
      bundle_discount_bps = applied_discount * 10000 / raw_total   (integer floor)
      bundle_net_cents = raw_total - applied_discount
      Per-row allocation, in request order:
        running = 0
        for i, entry in enumerate(request order):
          amount = bundle_net_cents * entry.price_cents / raw_total
          payable_cents[i] = floor_to_whole_dollar(amount)
          running += payable_cents[i]
        payable_cents[last] += bundle_net_cents - running
      Order of operations is pinned: the tier band is read BEFORE insertion,
      the cap is applied to the whole-bundle discount rather than per row, the
      per-row split happens after the cap, and the truncation remainder is
      given to the last row. Per-row-then-cap and cap-then-per-row differ.
    input_set: "the requested purchase entries in request order and the vehicle's existing entitlements where status == ACTIVE"
    constants:
      TIER_2_ENTITLEMENT_MIN: 2
      TIER_3_ENTITLEMENT_MIN: 4
      TIER_2_DISCOUNT_BPS: 500
      TIER_3_DISCOUNT_BPS: 1000
      MAX_BUNDLE_DISCOUNT_CENTS: 200000
    precision: "integer cents; each row floored down to whole dollars, remainder assigned to the last row"

  - name: delivery_readiness_posture
    trigger: "allocation, transit, arrival, appointment changes, and cancellation"
    algorithm: constraint_propagation
    formula: |
      FROZEN when the order's AllocationUnit.status != ARRIVED
      FROZEN when the order is CANCELLED
      RESTRICTED when the AllocationUnit.status == ARRIVED and
         order_total_due_cents(provisional) is not fully covered by order_fee_paid_cents
      READY when the AllocationUnit.status == ARRIVED and
         order_total_due_cents(provisional) <= order_fee_paid_cents
      Evaluation order is pinned top to bottom; the first matching clause wins.
    input_set: "the order's allocation unit status and the provisional total"
    constants:
      EVALUATION_ORDER: "FROZEN-CANCEL, FROZEN-UNIT, RESTRICTED, READY"

  - name: mobile_service_visit_cost_cents
    trigger: "mobile visit creation, parts pre-shipment, and completion"
    algorithm: aggregation
    formula: |
      travel_fee_cents = 0 when constants.MOBILE_BASE_TRAVEL_CENTS == 0
                         else constants.MOBILE_BASE_TRAVEL_CENTS
                         + max(0, (visit_miles - constants.INCLUDED_MILES)) * 95
      labor_cents = round_half_up(labor_hours * constants.LABOR_RATE_CENTS_PER_HOUR)
      visit_cost_cents = travel_fee_cents + labor_cents + parts_cost_cents
      warranty_covers_it = the triage report's severity IN {HIGH, CRITICAL}
                           and vehicle.odometer_miles <= constants.WARRANTY_MILEAGE_CEILING
      customer_payable_cents = 0 when warranty_covers_it else visit_cost_cents
    input_set: "the visit's labor hours, its parts cost, and the triage report's severity"
    constants:
      MOBILE_BASE_TRAVEL_CENTS: 0
      INCLUDED_MILES: 30
      PER_MILE_CENTS: 95
      LABOR_RATE_CENTS_PER_HOUR: 19500
      WARRANTY_MILEAGE_CEILING: 60000
    precision: "integer cents; round_half_up on the labor line only"

  - name: service_triage_outcome
    trigger: "remote diagnostic report creation"
    algorithm: threshold
    formula: |
      NO_ACTION        when severity == LOW
                       and the most recent prior RemoteDiagnosticReport on the
                           same vehicle carries the same fault_code
      OTA_RESOLVABLE   when jurisdiction.mobile_service_permitted == false
                       and severity IN {LOW, MEDIUM} and is_driveable == true
      CENTER_REQUIRED  when severity IN {HIGH, CRITICAL} or is_driveable == false
      MOBILE_REQUIRED  otherwise, i.e. severity IN {LOW, MEDIUM},
                       is_driveable == true and jurisdiction.mobile_service_permitted == true
      Evaluation order is pinned top to bottom; the first matching clause wins,
      so a repeated LOW fault short-circuits to NO_ACTION before the
      jurisdiction clause is consulted.
      parts_required = true when triage_outcome IN {MOBILE_REQUIRED, CENTER_REQUIRED}
                       and severity IN {MEDIUM, HIGH, CRITICAL}
    input_set: "one RemoteDiagnosticReport plus the most recent prior report on the same vehicle and the jurisdiction's mobile_service_permitted flag"
    constants:
      REPEAT_FAULT_WINDOW_REPORTS: 1
    variants:
      - name: jurisdiction_permits_mobile
        when: "jurisdiction.mobile_service_permitted == true"
        difference: "LOW/MEDIUM driveable faults become MOBILE_REQUIRED"
      - name: jurisdiction_bars_mobile
        when: "jurisdiction.mobile_service_permitted == false and no prior report carries the same fault_code"
        difference: "the same fault becomes OTA_RESOLVABLE, so no van is dispatched"

  - name: batch_delay_propagation
    trigger: "POST /v1/production-batches/{batchId}/delay"
    algorithm: chronological
    formula: |
      For the affected batch, orders are processed in ascending order of
      VehicleOrder.placed_at, and ties are broken by VehicleOrder.created_at ASC.
      brand-new estimate window_start = prior.window_start + delay_days
      brand-new estimate window_end   = prior.window_end   + delay_days
      shift_days = max(0, floor_days(new.window_start - prior.window_end))
      Ordering is pinned by placed_at (never by id, never by VIN) so the
      cumulative estimator is reproducible.
    input_set: "orders linked through AllocationUnit rows of the delayed batch whose status IN {ALLOCATED, IN_TRANSIT, ARRIVED}"
    constants:
      MAX_PROPAGATION_DEPTH: 4

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header must be present and must be one of the 8 declared roles"
    error_id: ERR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The role in X-User-Role must be permitted for the operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right along the path"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (per entity: ERR_BUYER_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_APPRAISAL_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_UNIT_NOT_FOUND, ERR_VEHICLE_NOT_FOUND, ERR_VISIT_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_ENTITLEMENT_NOT_FOUND, ERR_JURISDICTION_NOT_FOUND, ERR_CENTER_NOT_FOUND, ERR_CONFIGURATION_NOT_FOUND, ERR_OPTION_NOT_FOUND, ERR_ESTIMATE_NOT_FOUND, ERR_NOTE_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: auth
    check: "For identity: entity_backed roles, a read of another account's own resource by id is refused unless the acting X-User-ID equals that resource's owning Buyer.id"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "GET /v1/buyers/{id} and the buyer-scoped sub-resources of another account"

  - priority: 5
    category: state
    check: "The acting role's own account must not be SUSPENDED"
    error_id: ERR_BUYER_SUSPENDED
    http_status: 403
    applies_to: "all Buyer-role endpoints"

  - priority: 6
    category: business_fiscal
    check: "The order fee must be posted to the ledger before the order can be placed"
    error_id: ERR_ORDER_FEE_UNPAID
    http_status: 402
    applies_to: "POST /v1/orders/{orderId}/place"

  - priority: 7
    category: business_temporal
    check: "A configuration change request must arrive at or before the configuration lock deadline"
    error_id: ERR_CONFIG_LOCK_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /v1/orders/{orderId}/configuration-changes"

  - priority: 8
    category: business_safety
    check: "A resident of a state where direct sales are not permitted must take handover outside that state"
    error_id: ERR_OUT_OF_STATE_DELIVERY_REQUIRED
    http_status: 403
    applies_to: "POST /v1/delivery-appointments, POST /v1/orders/{orderId}/arrive-at-center"

  - priority: 9
    category: business_safety
    check: "A gallery-only jurisdiction forbids contract execution at a gallery center"
    error_id: ERR_GALLERY_HANDOVER_FORBIDDEN
    http_status: 403
    applies_to: "POST /v1/delivery-appointments, POST /v1/orders/{orderId}/arrive-at-center"

  - priority: 10
    category: business_temporal
    check: "An appointment interval must be well formed: scheduled_end strictly after scheduled_start, and visit_end strictly after visit_start"
    error_id: ERR_INVALID_APPOINTMENT_WINDOW
    http_status: 400
    applies_to: "POST /v1/delivery-appointments, POST /v1/delivery-appointments/{id}/rebook, POST /v1/service-appointments, POST /v1/service-appointments/{id}/schedule-center, POST /v1/mobile-service-visits, POST /v1/mobile-service-visits/{id}/reschedule"

  - priority: 11
    category: business_constraint
    check: "Delivery bay occupation must not collide with an existing BOOKED, CONFIRMED or AT_RISK appointment under the buffered half-open interval rule"
    error_id: ERR_DELIVERY_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /v1/delivery-appointments, POST /v1/delivery-appointments/{appointmentId}/rebook"

  - priority: 12
    category: business_constraint
    check: "Service bay occupation must not collide with an existing CENTER_SCHEDULED service appointment under the buffered half-open interval rule; the service bay and the handover bay are the same physical resource at a site, so the check also rejects a handover interval that overlaps a CENTER_SCHEDULED service appointment"
    error_id: ERR_SERVICE_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /v1/service-appointments/{appointmentId}/schedule-center"

  - priority: 13
    category: business_constraint
    check: "Mobile van dispatch windows for the same van must not overlap"
    error_id: ERR_VAN_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /v1/mobile-service-visits, POST /v1/mobile-service-visits/{visitId}/reschedule"

  - priority: 14
    category: business_temporal
    check: "A trade-in offer whose validity instant falls before the order's current projected delivery window end cannot be published, because the credit would lapse before the handover it is meant to fund"
    error_id: ERR_APPRAISAL_EXPIRES_BEFORE_DELIVERY
    http_status: 409
    applies_to: "POST /v1/orders/{orderId}/trade-in-appraisals/{appraisalId}/offer"

  - priority: 15
    category: business_safety
    check: "Mobile dispatch is forbidden when the governing jurisdiction bars mobile service"
    error_id: ERR_MOBILE_SERVICE_FORBIDDEN
    http_status: 403
    applies_to: "POST /v1/mobile-service-visits"

  - priority: 16
    category: business_referential
    check: "Every visible trade-in appraisal on the order must be ACCEPTED before a handover appointment can be booked or the financing can fund"
    error_id: ERR_TRADE_IN_NOT_RESOLVED
    http_status: 409
    applies_to: "POST /v1/delivery-appointments, POST /v1/financing-applications/{id}/fund"

  - priority: 17
    category: business_referential
    check: "The order must expose readiness posture READY or RESTRICTED; FROZEN blocks the operation"
    error_id: ERR_ORDER_DELIVERY_NOT_READY
    http_status: 409
    applies_to: "POST /v1/delivery-appointments, POST /v1/delivery-appointments/{id}/confirm, POST /v1/delivery-appointments/{id}/rebook, POST /v1/financing-applications/{id}/fund"

  - priority: 18
    category: business_fiscal
    check: "The provisional total must not exceed the maximum financeable amount for the applicant's credit band"
    error_id: ERR_FINANCE_EXCEEDS_VEHICLE_VALUE
    http_status: 402
    applies_to: "POST /v1/financing-applications/{id}/decision, POST /v1/orders/{id}/configuration-changes"

  - priority: 19
    category: business_constraint
    check: "Optimistic-concurrency guard: the supplied expected_*_version must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/delivery-appointments, POST /v1/delivery-appointments/{id}/complete, POST /v1/mobile-service-visits"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Advance the logical clock. The server's startup default clock value is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time before this endpoint is called. Advancing the clock runs every scheduled sweep: DeliveryEstimate window expiry, TradeInAppraisal offer expiry with its compensating reversal, SoftwareEntitlement trial expiry, and the automatic PLACED → CONFIG_LOCKED transition once now_utc strictly exceeds configuration_lock_deadline."
    roles: [PlatformAdmin]
    code: 200
    input: ["current_utc"]
    output: null
    side_effects:
      - "logical clock set to the supplied instant"
      - "expiry sweeps executed for estimates, trade-in offers and entitlements"

  - method: POST
    path: "/v1/_payments/simulate"
    description: "Test-driving endpoint: settle the order fee capture or refund for an order without a real payment gateway."
    roles: [PlatformAdmin]
    code: 201
    input: ["order_id", "outcome"]
    output: VehicleOrder
    side_effects:
      - "Outcome SUCCEEDED writes OrderFeeLedgerEntry ORDER_FEE_PAYMENT for +order_fee_cents"
      - "Outcome REFUNDED writes OrderFeeLedgerEntry ORDER_FEE_REFUND for −order_fee_cents"
      - "Buyer.order_credit_balance_cents recomputed; VehicleOrder.order_fee_paid_cents recomputed"

  # --- Buyer ---
  - method: POST
    path: "/v1/buyers"
    description: "Create a purchasing account"
    roles: [Anonymous]
    code: 201
    input: ["full_name", "email", "residency_state_code"]
    output: Buyer
    side_effects: ["status = PENDING_VERIFICATION", "credit_band = UNRATED", "order_credit_balance_cents = 0"]

  - method: GET
    path: "/v1/buyers"
    description: "List buying accounts"
    roles: [PlatformAdmin, FinancePartner]
    code: 200
    input: ["residency_state_code?", "status?", "limit?", "offset?"]
    output: "Buyer[]"
    side_effects: []

