# =============================================================================
# Task 1171: Prescribed Burn & Wildfire Fuels Reduction Program — seed tables
# =============================================================================

scenario: "1171. Prescribed Burn & Wildfire Fuels Reduction Program (prescribed burn association): burn plan & prescription window parameters, permit/notification & smoke management approval, crew/resource ordering & contingency plan, ignition sequencing & holding assignment, go/no-go checklist & weather observation, escape/incident conversion to wildfire response, post-burn monitoring & effectiveness, landowner cost-share & liability"

domain_name: prescribed-burn-program
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency        # OCC on Parcel/BurnPlan for create-with-stale-parent writes
    - cascading_side_effects        # wildfire declaration -> execution -> permit -> cost-share suspension
    - version_pinning_on_approval   # BurnExecution pins BurnPlan.version at scheduling; staleness blocks brief
    - scheduled_actions             # logical clock sweeps: plan/permit expiry, execution lapse, report overdue
  entity_topology: graph            # flat collections + FK web; BurnPlan self-references (supersession)
  state_machine_shape: cyclic       # plan revision loop; also branching (escape fork) and parallel dims (Incident)
  relationship_patterns:
    - one_to_many
    - many_to_many                  # CrewAssignment junction: ResourceOrder x Contractor
    - self_referential              # BurnPlan.supersedes_plan_id
    - cross_aggregate               # CostShareAgreement references Landowner + BurnPlan
  role_model: segregation_of_duties # plan author (BurnBoss) may not approve/issue/accept own work as AgencyReviewer
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: BurnAssociation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Association display name" }
      - { name: airshed_daily_acres_cap, type: integer, source: input, description: "Max aggregate approved burn acres per airshed per day" }
      - { name: single_claim_cap_cents, type: integer, source: input, description: "Per-claim liability fund payout cap" }
      - { name: landowner_liability_cap_cents, type: integer, source: input, description: "Per-incident landowner liability cap (standard allocation only)" }
      - { name: fund_balance_cents, type: integer, source: computed, description: "Liability/cost-share fund balance = initial + deposits - non-reversed payouts - disbursed cost-share" }
      - { name: fund_posture, type: enum, source: computed, description: "FUND_NORMAL | FUND_RESTRICTED; FUND_RESTRICTED when fund_balance_cents < 200000 (FUND_LOW_THRESHOLD_CENTS), FUND_NORMAL otherwise" }

  - name: Landowner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Landowner name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: liability_waiver_signed, type: boolean, source: input, description: "Association liability waiver on file" }
      - { name: standing, type: enum, source: computed, description: "GOOD_STANDING | SUSPENDED; SUSPENDED while any LiabilityClaim outcome=LANDOWNER_LIABLE with outstanding balance and adjudicated_at + 30 days < current clock" }
      - { name: outstanding_liability_cents, type: integer, source: computed, default: 0, description: "Unpaid landowner-liable shares, summed over adjudicated claims" }

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - { name: landowner_id, type: string, source: input, description: "FK -> Landowner.id; owning landowner" }
      - { name: name, type: string, source: input, description: "Parcel name" }
      - { name: acreage, type: integer, source: input, description: "Total parcel acres (> 0)" }
      - { name: fuel_model, type: enum, source: input, description: "GRASS | BRUSH | TIMBER" }
      - { name: slope_class, type: enum, source: input, description: "FLAT | MODERATE | STEEP" }
      - { name: wui_adjacent, type: boolean, source: input, description: "Wildland-urban interface adjacency flag" }
      - { name: airshed_id, type: string, source: input, description: "Airshed identifier for smoke capacity accounting" }
      - { name: drought_index, type: integer, source: input, description: "0-30 drought contribution to hazard" }
      - { name: hazard_score, type: integer, source: computed, description: "fuel_weight + slope_weight + (wui_adjacent ? 20 : 0) + drought_index; see hazard_score calc" }

  - name: BurnBoss
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Burn boss name" }
      - { name: certification_tier, type: enum, source: input, description: "RXB1 | RXB2 | RXB3; gates plan size/hazard per certification_gate calc" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Contractor company name" }
      - { name: resource_type, type: enum, source: input, description: "ENGINE | HAND_CREW | DOZER | WATER_TENDER" }
      - { name: capacity_units, type: integer, source: input, description: "Total units the contractor can field" }
      - { name: personnel_per_unit, type: integer, source: input, description: "Personnel fielded per unit" }
      - { name: day_rate_cents_per_unit, type: integer, source: input, description: "Daily rate per unit" }
      - { name: no_show_count, type: integer, source: system, default: 0, description: "Cumulative NO_SHOW assignments" }
      - { name: standing, type: enum, source: computed, description: "GOOD_STANDING | SUSPENDED; SUSPENDED when no_show_count >= 2" }
      - { name: available_units, type: integer, source: computed, description: "capacity_units - sum(units) over assignments in {ASSIGNED, CONFIRMED}" }

  - name: BurnPlan
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; target parcel" }
      - { name: author_boss_id, type: string, source: system, description: "FK -> BurnBoss.id; set from X-User-ID at creation" }
      - { name: supersedes_plan_id, type: string, source: input, required: false, description: "FK -> BurnPlan.id; prior plan this revision supersedes (self-referential)" }
      - { name: planned_acres, type: integer, source: input, description: "Planned treatment acres (> 0, <= parcel.acreage)" }
      - { name: planned_window_start, type: string, source: input, description: "ISO date; inclusive prescription window start" }
      - { name: planned_window_end, type: string, source: input, description: "ISO date; inclusive prescription window end (>= start)" }
      - { name: max_wind_mph, type: integer, source: input, description: "Prescription: max sustained wind (inclusive bound)" }
      - { name: min_fuel_moisture_pct, type: integer, source: input, description: "Prescription: min fine-fuel moisture (inclusive)" }
      - { name: max_fuel_moisture_pct, type: integer, source: input, description: "Prescription: max fine-fuel moisture (inclusive)" }
      - { name: min_rh_pct, type: integer, source: input, description: "Prescription: min relative humidity (inclusive)" }
      - { name: min_temp_f, type: integer, source: input, description: "Prescription: min temperature F (inclusive)" }
      - { name: max_temp_f, type: integer, source: input, description: "Prescription: max temperature F (inclusive)" }
      - { name: min_mixing_height_ft, type: integer, source: input, description: "Prescription: min mixing height (inclusive)" }
      - { name: treatment_lines, type: array, source: input, description: "Array of {category: BROADCAST|UNDERSTORY|PILE_BURN, rate_class: GRASS|BRUSH|TIMBER, acres: int}; >= 1 line; sum(acres) == planned_acres" }
      - { name: approved_by_boss_id, type: string, source: system, description: "FK -> BurnBoss.id; reviewer who approved (null until APPROVED)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | SUPERSEDED | CANCELLED | EXPIRED" }

  - name: BurnPermit
    parent: null
    common_fields: true
    fields:
      - { name: burn_plan_id, type: string, source: system, description: "FK -> BurnPlan.id; plan this permit covers" }
      - { name: notifications_required, type: integer, source: input, description: "Count of neighbor notifications the agency requires (>= 0)" }
      - { name: notifications_completed, type: integer, source: computed, description: "Count of child PermitNotification rows in CONFIRMED status" }
      - { name: notified_completed_at, type: datetime, source: computed, description: "max(confirmed_at) over CONFIRMED notifications; null when none" }
      - { name: issued_by_boss_id, type: string, source: system, description: "FK -> BurnBoss.id; reviewer who issued (null until ISSUED)" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | ISSUED | DENIED | SUSPENDED | REVOKED | EXPIRED" }

  - name: PermitNotification
    parent: null
    common_fields: true
    fields:
      - { name: burn_permit_id, type: string, source: system, description: "FK -> BurnPermit.id" }
      - { name: recipient_name, type: string, source: input, description: "Notified neighbor/recipient" }
      - { name: channel, type: enum, source: input, description: "MAIL | PHONE | IN_PERSON" }
      - { name: confirmed_at, type: datetime, source: system, description: "Clock time when confirmed; null until CONFIRMED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED" }

  - name: SmokeApproval
    parent: null
    common_fields: true
    fields:
      - { name: burn_plan_id, type: string, source: system, description: "FK -> BurnPlan.id" }
      - { name: airshed_id, type: string, source: system, description: "Copied from the plan's parcel at creation" }
      - { name: requested_burn_date, type: string, source: input, description: "ISO date the burn is requested for" }
      - { name: requested_acres, type: integer, source: input, description: "Acres requested for that date (> 0, <= plan.planned_acres)" }
      - { name: decision_note, type: string, source: input, required: false, description: "Officer note recorded at decision" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | CONDITIONALLY_APPROVED | DENIED | WITHDRAWN | SUPERSEDED" }

  - name: ContingencyPlan
    parent: null
    common_fields: true
    fields:
      - { name: burn_plan_id, type: string, source: system, description: "FK -> BurnPlan.id" }
      - { name: escape_trigger_points, type: string, source: input, description: "Conditions that trigger escape response" }
      - { name: min_holding_personnel, type: integer, source: input, description: "Minimum holding force personnel (>= 0)" }
      - { name: water_supply_description, type: string, source: input, description: "Water supply plan" }
      - { name: evacuation_route_description, type: string, source: input, description: "Evacuation routes" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACCEPTED | REJECTED" }

  - name: IgnitionPlan
    parent: null
    common_fields: true
    fields:
      - { name: burn_plan_id, type: string, source: system, description: "FK -> BurnPlan.id" }
      - { name: ignition_method, type: enum, source: input, description: "DRIP_TORCH | AERIAL | HAND_LINE" }
      - { name: test_fire_required, type: boolean, source: input, description: "Whether a test fire precedes primary ignition" }
      - { name: steps, type: array, source: input, description: "Ordered array of {step_index: int, zone_label: string, technique: string}; step_index unique ascending from 1; >= 1 step" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACCEPTED | REJECTED | SUPERSEDED" }

  - name: ResourceOrder
    parent: null
    common_fields: true
    fields:
      - { name: burn_plan_id, type: string, source: system, description: "FK -> BurnPlan.id" }
      - { name: required_engines, type: integer, source: computed, description: "ceil(planned_acres / 40 * fuel_factor) + (2 if parcel.wui_adjacent else 0); see required_holding_force" }
      - { name: required_hand_crews, type: integer, source: computed, description: "max(1, ceil(planned_acres / 80)) * (2 if parcel.slope_class == STEEP else 1)" }
      - { name: required_dozers, type: integer, source: computed, description: "1 if fuel_model == TIMBER and planned_acres > 100 else 0" }
      - { name: required_water_tenders, type: integer, source: computed, description: "max(1, floor(planned_acres / 60))" }
      - { name: confirmed_engines, type: integer, source: computed, description: "Sum of units on CONFIRMED assignments whose contractor.resource_type == ENGINE" }
      - { name: confirmed_hand_crews, type: integer, source: computed, description: "Same for HAND_CREW" }
      - { name: confirmed_dozers, type: integer, source: computed, description: "Same for DOZER" }
      - { name: confirmed_water_tenders, type: integer, source: computed, description: "Same for WATER_TENDER" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | PARTIALLY_FILLED | FILLED | CANCELLED" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: resource_order_id, type: string, source: system, description: "FK -> ResourceOrder.id" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id" }
      - { name: units, type: integer, source: input, description: "Units committed (> 0)" }
      - { name: window_start, type: string, source: input, description: "ISO date; assignment window start (inclusive)" }
      - { name: window_end, type: string, source: input, description: "ISO date; assignment window end (exclusive, > start)" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | CONFIRMED | DECLINED | RELEASED | NO_SHOW | COMPLETED" }

  - name: BurnExecution
    parent: null
    common_fields: true
    fields:
      - { name: burn_plan_id, type: string, source: system, description: "FK -> BurnPlan.id" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date of burn; must fall inside plan window (inclusive both ends)" }
      - { name: plan_version_at_schedule, type: integer, source: system, description: "BurnPlan.version pinned at scheduling; brief requires equality with current plan version (ERR_STALE_PLAN_VERSION)" }
      - { name: acres_blackened, type: integer, source: system, description: "Recorded at complete-ignition; null until then" }
      - { name: actual_treatment_lines, type: array, source: system, description: "Recorded at close; array of {category, rate_class, acres}" }
      - { name: closed_at, type: datetime, source: system, description: "Clock time of close; null until CLOSED" }
      - { name: phase, type: enum, source: system, description: "SCHEDULED | BRIEFED | TEST_FIRE | IGNITION | HOLDING | PATROL | MOP_UP | CLOSED | ESCAPED | WILDFIRE_RESPONSE | STOOD_DOWN | CANCELLED | LAPSED" }

  - name: WeatherObservation
    parent: null
    common_fields: false
    fields:
      - { name: burn_execution_id, type: string, source: system, description: "FK -> BurnExecution.id" }
      - { name: observed_at, type: datetime, source: input, description: "When the reading was taken (ISO 8601 UTC)" }
      - { name: wind_mph, type: integer, source: input, description: "Sustained wind" }
      - { name: fuel_moisture_pct, type: integer, source: input, description: "Fine fuel moisture" }
      - { name: rh_pct, type: integer, source: input, description: "Relative humidity" }
      - { name: temp_f, type: integer, source: input, description: "Temperature F" }
      - { name: mixing_height_ft, type: integer, source: input, description: "Mixing height" }
      - { name: in_prescription, type: boolean, source: computed, description: "All five parameters within the plan's inclusive prescription bounds; see weather_prescription_check" }

  - name: GoNoGoChecklist
    parent: null
    common_fields: false
    fields:
      - { name: burn_execution_id, type: string, source: system, description: "FK -> BurnExecution.id" }
      - { name: weather_observation_id, type: string, source: system, description: "Snapshot of the WeatherObservation id the verdict was based on (execution-scoped audit reference; discover the observation via the execution's weather-observations list)" }
      - { name: answers, type: array, source: input, description: "Echo of submitted [{item, result}] answers; item one of the six required items {permit_verified, crew_briefed, communications_check, escape_routes_reviewed, weather_within_prescription, holding_resources_ready}, result PASS | FAIL" }
      - { name: verdict, type: enum, source: system, description: "GO | NO_GO" }
      - { name: evaluated_at, type: datetime, source: system, description: "Clock time of evaluation" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: burn_execution_id, type: string, source: system, description: "FK -> BurnExecution.id" }
      - { name: incident_type, type: enum, source: system, description: "ESCAPE (via declare-escape) | SPOT | SMOKE_INTRUSION (manual report)" }
      - { name: response_status, type: enum, source: system, description: "REPORTED | CONFIRMED | CONTAINED | CLOSED | DISMISSED | DECLARED_WILDFIRE (axis A, independent of billing_status)" }
      - { name: billing_status, type: enum, source: system, description: "UNASSESSED | ASSESSED | BILLED | SETTLED | DISPUTED (axis B, independent of response_status)" }
      - { name: suppression_cost_cents, type: integer, source: system, description: "Set by assess-costs; null until ASSESSED" }
      - { name: escaped_acres, type: integer, source: system, description: "Set by assess-costs; null until ASSESSED" }

  - name: MonitoringReport
    parent: null
    common_fields: true
    fields:
      - { name: burn_execution_id, type: string, source: system, description: "FK -> BurnExecution.id" }
      - { name: report_type, type: enum, source: system, description: "FIRST_24H | SEVEN_DAY | THIRTY_DAY; one of each created at execution close" }
      - { name: due_at, type: datetime, source: system, description: "closed_at + 24h / +7d / +30d by report_type" }
      - { name: actual_treatment_lines, type: array, source: system, description: "Submitted observed acres per {category, rate_class, acres}; null until submitted" }
      - { name: effectiveness_score, type: integer, source: computed, description: "round_half_up(100 * sum(actual acres * category_weight) / sum(planned acres * category_weight)) against the cost-share agreement's treatment_lines; null until submit; see monitoring_effectiveness_score" }
      - { name: deficiency_reason, type: string, source: system, description: "Recorded when marked DEFICIENT; null otherwise" }
      - { name: status, type: enum, source: system, description: "DUE | OVERDUE | SUBMITTED | ACCEPTED | DEFICIENT" }

  - name: CostShareAgreement
    parent: null
    common_fields: true
    fields:
      - { name: landowner_id, type: string, source: input, description: "FK -> Landowner.id; applicant" }
      - { name: burn_plan_id, type: string, source: input, description: "FK -> BurnPlan.id; plan being cost-shared" }
      - { name: funding_tier, type: enum, source: input, description: "STANDARD (0.50) | PRIORITY (0.75) | LEGACY (0.65)" }
      - { name: treatment_lines, type: array, source: input, description: "Array of {category, rate_class, acres}; >= 1 line" }
      - { name: provisional_estimate_cents, type: integer, source: computed, description: "sum over lines of round_half_up(acres * rate_cents * share_pct); see provisional_cost_share_estimate" }
      - { name: final_reimbursement_cents, type: integer, source: computed, description: "Recomputed when THIRTY_DAY report ACCEPTED: per-line round_half_up(actual_acres * rate_cents * share_pct * effectiveness_factor) then sum; null until then" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Cumulative disbursed amount" }
      - { name: approved_at, type: datetime, source: system, description: "Clock time of approval; null until APPROVED" }
      - { name: expires_at, type: datetime, source: system, description: "approved_at + 365 days; disbursements after this are rejected (ERR_AGREEMENT_EXPIRED)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED | PARTIALLY_DISBURSED | FULLY_DISBURSED | SUSPENDED | CANCELLED" }

  - name: LiabilityClaim
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> Incident.id" }
      - { name: total_suppression_cost_cents, type: integer, source: system, description: "Copied from incident at claim creation" }
      - { name: negligence_found, type: boolean, source: system, description: "Set at adjudication; selects allocation variant" }
      - { name: landowner_share_cents, type: integer, source: computed, description: "standard: min(escaped_acres * 25000, association.landowner_liability_cap_cents); negligence: round_half_up(escaped_acres * 25000 * 1.5) uncapped; null until adjudicated" }
      - { name: association_share_cents, type: integer, source: computed, description: "total_suppression_cost_cents - landowner_share_cents; null until adjudicated" }
      - { name: fund_payout_cents, type: integer, source: computed, description: "Actual fund debit at pay time after fund cap rule; null until PAID" }
      - { name: outcome, type: enum, source: system, description: "PENDING | LANDOWNER_LIABLE | ASSOCIATION_LIABLE | NOT_LIABLE" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Clock time of adjudication; null until then" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_INVESTIGATION | ADJUDICATED | DISMISSED | PAID | PAYMENT_REVERSED | CLOSED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: BurnPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /burn-plans/{id}/submit"
        actor: BurnBoss
        preconditions:
          - "plan.status == DRAFT (ERR_PLAN_NOT_DRAFT)"
          - "X-User-ID == plan.author_boss_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "increments BurnPlan.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /burn-plans/{id}/request-revision"
        actor: AgencyReviewer
        preconditions:
          - "plan.status == SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
        side_effects:
          - "increments BurnPlan.version by 1"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /burn-plans/{id}/revise"
        actor: BurnBoss
        preconditions:
          - "plan.status == REVISION_REQUESTED (ERR_PLAN_NOT_IN_REVISION)"
          - "X-User-ID == plan.author_boss_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "increments BurnPlan.version by 1"
        note: "Revision loop: DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT may repeat without bound"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /burn-plans/{id}/approve"
        actor: AgencyReviewer
        preconditions:
          - "plan.status == SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
          - "X-User-ID != plan.author_boss_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "sets approved_by_boss_id = X-User-ID"
          - "if plan.supersedes_plan_id is set and that prior plan is APPROVED: prior plan -> SUPERSEDED (link B)"
          - "the SUPERSEDED prior plan's ISSUED permit (if any) -> SUSPENDED (link C)"
          - "any CostShareAgreement on the SUPERSEDED prior plan in {APPROVED, PARTIALLY_DISBURSED} -> SUSPENDED (link D)"
          - "increments BurnPlan.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /burn-plans/{id}/cancel"
        actor: BurnBoss
        preconditions:
          - "plan.status in {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED} (ERR_PLAN_NOT_CANCELLABLE)"
          - "X-User-ID == plan.author_boss_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "the plan's ResourceOrders in {DRAFT, SUBMITTED, PARTIALLY_FILLED} -> CANCELLED (link B of cancel cascade)"
          - "each such order's CrewAssignments in {ASSIGNED, CONFIRMED} -> RELEASED (link C), restoring contractor available_units"
          - "the plan's non-terminal BurnExecution (SCHEDULED or BRIEFED only) -> CANCELLED"
          - "increments BurnPlan.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /burn-plans/{id}/cancel"
        actor: BurnBoss
        preconditions: ["same as DRAFT -> CANCELLED"]
        side_effects: ["same as DRAFT -> CANCELLED"]
      - from: REVISION_REQUESTED
        to: CANCELLED
        trigger: "POST /burn-plans/{id}/cancel"
        actor: BurnBoss
        preconditions: ["same as DRAFT -> CANCELLED"]
        side_effects: ["same as DRAFT -> CANCELLED"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /burn-plans/{id}/cancel"
        actor: BurnBoss
        preconditions: ["same as DRAFT -> CANCELLED"]
        side_effects: ["same as DRAFT -> CANCELLED"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (when a successor plan naming this plan in supersedes_plan_id is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "this plan's ISSUED permit -> SUSPENDED"
          - "CostShareAgreements on this plan in {APPROVED, PARTIALLY_DISBURSED} -> SUSPENDED"
          - "increments BurnPlan.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system clock sweep (POST /_clock/set_current_utc): planned_window_end < current date AND no execution of this plan ever reached CLOSED or WILDFIRE_RESPONSE"
        actor: system
        preconditions: []
        side_effects:
          - "this plan's ISSUED permit -> EXPIRED"
          - "increments BurnPlan.version by 1"

  - entity: BurnPermit
    initial_state: UNDER_REVIEW
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: UNDER_REVIEW
        to: ISSUED
        trigger: "POST /permits/{id}/issue"
        actor: AgencyReviewer
        preconditions:
          - "permit.status == UNDER_REVIEW (ERR_PERMIT_NOT_UNDER_REVIEW)"
          - "X-User-ID != plan.author_boss_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "plan.status == APPROVED (ERR_PLAN_NOT_APPROVED)"
          - "a ContingencyPlan with status ACCEPTED exists for the plan (ERR_CONTINGENCY_NOT_ACCEPTED)"
          - "permit.notifications_completed >= permit.notifications_required (ERR_NOTIFICATIONS_INCOMPLETE)"
          - "plan.planned_window_end >= current clock date (ERR_PLAN_WINDOW_LAPSED)"
        side_effects:
          - "sets issued_by_boss_id = X-User-ID"
          - "increments BurnPermit.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /permits/{id}/deny"
        actor: AgencyReviewer
        preconditions:
          - "permit.status == UNDER_REVIEW (ERR_PERMIT_NOT_UNDER_REVIEW)"
        side_effects: ["increments BurnPermit.version by 1"]
      - from: ISSUED
        to: SUSPENDED
        trigger: "POST /permits/{id}/suspend OR system cascade (plan superseded; execution entered WILDFIRE_RESPONSE)"
        actor: AgencyReviewer | system
        preconditions:
          - "permit.status == ISSUED (ERR_PERMIT_NOT_ISSUED)"
        side_effects:
          - "CostShareAgreements on the permit's plan in {APPROVED, PARTIALLY_DISBURSED} -> SUSPENDED"
          - "increments BurnPermit.version by 1"
      - from: SUSPENDED
        to: ISSUED
        trigger: "POST /permits/{id}/reinstate"
        actor: AgencyReviewer
        preconditions:
          - "permit.status == SUSPENDED (ERR_PERMIT_NOT_SUSPENDED)"
          - "plan.status == APPROVED (ERR_PLAN_NOT_APPROVED)"
        side_effects: ["increments BurnPermit.version by 1"]
      - from: ISSUED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: AgencyReviewer
        preconditions:
          - "permit.status in {ISSUED, SUSPENDED} (ERR_PERMIT_NOT_REVOKABLE)"
        side_effects: ["increments BurnPermit.version by 1"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: AgencyReviewer
        preconditions: ["permit.status in {ISSUED, SUSPENDED} (ERR_PERMIT_NOT_REVOKABLE)"]
        side_effects: ["increments BurnPermit.version by 1"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system clock sweep (plan expired, or planned_window_end < current date with no non-terminal execution)"
        actor: system
        preconditions: []
        side_effects: ["increments BurnPermit.version by 1"]

  - entity: SmokeApproval
    initial_state: SUBMITTED
    terminal_states: [DENIED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /smoke-approvals/{id}/decide with decision=APPROVED"
        actor: AirQualityOfficer
        preconditions:
          - "approval.status == SUBMITTED (ERR_SMOKE_NOT_SUBMITTED)"
          - "airshed capacity: sum(requested_acres of other SmokeApprovals in {APPROVED, CONDITIONALLY_APPROVED} with same airshed_id and requested_burn_date) + this.requested_acres <= association.airshed_daily_acres_cap (ERR_AIRSHED_CAPACITY_EXCEEDED)"
        side_effects: ["increments SmokeApproval.version by 1"]
      - from: SUBMITTED
        to: CONDITIONALLY_APPROVED
        trigger: "POST /smoke-approvals/{id}/decide with decision=CONDITIONALLY_APPROVED"
        actor: AirQualityOfficer
        preconditions:
          - "approval.status == SUBMITTED (ERR_SMOKE_NOT_SUBMITTED)"
          - "airshed capacity check identical to APPROVED (ERR_AIRSHED_CAPACITY_EXCEEDED)"
        side_effects: ["increments SmokeApproval.version by 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /smoke-approvals/{id}/decide with decision=DENIED"
        actor: AirQualityOfficer
        preconditions:
          - "approval.status == SUBMITTED (ERR_SMOKE_NOT_SUBMITTED)"
        side_effects: ["increments SmokeApproval.version by 1"]
      - from: CONDITIONALLY_APPROVED
        to: APPROVED
        trigger: "POST /smoke-approvals/{id}/clear-conditions"
        actor: AirQualityOfficer
        preconditions:
          - "approval.status == CONDITIONALLY_APPROVED (ERR_SMOKE_NOT_CONDITIONAL)"
        side_effects: ["increments SmokeApproval.version by 1"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /smoke-approvals/{id}/withdraw"
        actor: AirQualityOfficer
        preconditions:
          - "approval.status in {APPROVED, CONDITIONALLY_APPROVED} (ERR_SMOKE_NOT_WITHDRAWABLE)"
        side_effects: ["increments SmokeApproval.version by 1"]
      - from: CONDITIONALLY_APPROVED
        to: WITHDRAWN
        trigger: "POST /smoke-approvals/{id}/withdraw"
        actor: AirQualityOfficer
        preconditions: ["approval.status in {APPROVED, CONDITIONALLY_APPROVED} (ERR_SMOKE_NOT_WITHDRAWABLE)"]
        side_effects: ["increments SmokeApproval.version by 1"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a new SmokeApproval is created for the same burn_plan_id)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a new SmokeApproval is created for the same burn_plan_id)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONDITIONALLY_APPROVED
        to: SUPERSEDED
        trigger: "system (a new SmokeApproval is created for the same burn_plan_id)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ContingencyPlan
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /contingency-plans/{id}/accept"
        actor: AgencyReviewer
        preconditions:
          - "contingency.status == DRAFT (ERR_CONTINGENCY_NOT_DRAFT)"
          - "X-User-ID != burn_plan.author_boss_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "no other ContingencyPlan for the same plan is ACCEPTED (ERR_CONTINGENCY_ALREADY_ACCEPTED)"
        side_effects: ["increments ContingencyPlan.version by 1"]
      - from: DRAFT
        to: REJECTED
        trigger: "POST /contingency-plans/{id}/reject"
        actor: AgencyReviewer
        preconditions:
          - "contingency.status == DRAFT (ERR_CONTINGENCY_NOT_DRAFT)"
        side_effects: ["increments ContingencyPlan.version by 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /contingency-plans/{id}/revise"
        actor: BurnBoss
        preconditions:
          - "contingency.status == REJECTED (ERR_CONTINGENCY_NOT_REJECTED)"
          - "X-User-ID == burn_plan.author_boss_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["increments ContingencyPlan.version by 1"]
        note: "Reject-revise loop may repeat"

  - entity: IgnitionPlan
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /ignition-plans/{id}/accept"
        actor: AgencyReviewer
        preconditions:
          - "ignition_plan.status == DRAFT (ERR_IGNITION_PLAN_NOT_DRAFT)"
          - "X-User-ID != burn_plan.author_boss_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects: ["increments IgnitionPlan.version by 1"]
      - from: DRAFT
        to: REJECTED
        trigger: "POST /ignition-plans/{id}/reject"
        actor: AgencyReviewer
        preconditions:
          - "ignition_plan.status == DRAFT (ERR_IGNITION_PLAN_NOT_DRAFT)"
        side_effects: ["increments IgnitionPlan.version by 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /ignition-plans/{id}/revise"
        actor: BurnBoss
        preconditions:
          - "ignition_plan.status == REJECTED (ERR_IGNITION_PLAN_NOT_REJECTED)"
          - "X-User-ID == burn_plan.author_boss_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["increments IgnitionPlan.version by 1"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new IgnitionPlan is created for the same burn_plan_id)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (a new IgnitionPlan is created for the same burn_plan_id)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system (a new IgnitionPlan is created for the same burn_plan_id)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ResourceOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /resource-orders/{id}/submit"
        actor: BurnBoss
        preconditions:
          - "order.status == DRAFT (ERR_ORDER_NOT_DRAFT)"
        side_effects: ["increments ResourceOrder.version by 1"]
      - from: SUBMITTED
        to: PARTIALLY_FILLED
        trigger: "system (a CrewAssignment on this order reaches CONFIRMED while coverage is incomplete)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "system (confirmed units per type all reach required_* levels; see order_fill_evaluation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: FILLED
        trigger: "system (a single confirmation completes coverage from zero)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FILLED
        to: PARTIALLY_FILLED
        trigger: "system (a CONFIRMED assignment is RELEASED or marked NO_SHOW and coverage breaks; compensation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "system cascade (plan cancelled)"
        actor: system
        preconditions: []
        side_effects: ["assignments in {ASSIGNED, CONFIRMED} -> RELEASED"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system cascade (plan cancelled)"
        actor: system
        preconditions: []
        side_effects: ["assignments in {ASSIGNED, CONFIRMED} -> RELEASED"]
      - from: PARTIALLY_FILLED
        to: CANCELLED
        trigger: "system cascade (plan cancelled)"
        actor: system
        preconditions: []
        side_effects: ["assignments in {ASSIGNED, CONFIRMED} -> RELEASED"]

  - entity: CrewAssignment
    initial_state: ASSIGNED
    terminal_states: [DECLINED, RELEASED, NO_SHOW, COMPLETED]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /assignments/{id}/confirm"
        actor: Contractor
        preconditions:
          - "assignment.status == ASSIGNED (ERR_ASSIGNMENT_NOT_ASSIGNED)"
          - "X-User-ID == assignment.contractor_id (ERR_NOT_RESOURCE_OWNER)"
          - "contractor.standing == GOOD_STANDING (ERR_CONTRACTOR_SUSPENDED)"
          - "contractor.available_units >= assignment.units (ERR_CONTRACTOR_CAPACITY_EXCEEDED)"
          - "no window conflict: for every other assignment of the same contractor in {ASSIGNED, CONFIRMED}, NOT(window_start >= other.window_end + 1 day OR window_end <= other.window_start - 1 day) is false (ERR_CONTRACTOR_WINDOW_CONFLICT)"
        side_effects:
          - "recomputes order confirmed_* counts and order status (SUBMITTED -> PARTIALLY_FILLED/FILLED)"
          - "increments CrewAssignment.version by 1"
      - from: ASSIGNED
        to: DECLINED
        trigger: "POST /assignments/{id}/decline"
        actor: Contractor
        preconditions:
          - "assignment.status == ASSIGNED (ERR_ASSIGNMENT_NOT_ASSIGNED)"
          - "X-User-ID == assignment.contractor_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["increments CrewAssignment.version by 1"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /assignments/{id}/release OR system cascade (order cancelled)"
        actor: BurnBoss | system
        preconditions:
          - "assignment.status == CONFIRMED (ERR_ASSIGNMENT_NOT_CONFIRMED); manual release also requires X-User-ID == order.plan.author_boss_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "contractor availability restored (units freed)"
          - "order confirmed_* recomputed; order may drop FILLED -> PARTIALLY_FILLED"
          - "increments CrewAssignment.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /assignments/{id}/mark-no-show"
        actor: BurnBoss
        preconditions:
          - "assignment.status == CONFIRMED (ERR_ASSIGNMENT_NOT_CONFIRMED)"
          - "X-User-ID == order.plan.author_boss_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "contractor.no_show_count += 1 (standing recomputed: SUSPENDED at >= 2)"
          - "order confirmed_* recomputed; order may drop FILLED -> PARTIALLY_FILLED"
          - "increments CrewAssignment.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (execution closes)"
        actor: system
        preconditions: []
        side_effects: ["units freed at completion"]

  - entity: BurnExecution
    initial_state: SCHEDULED
    terminal_states: [CLOSED, STOOD_DOWN, CANCELLED, LAPSED, WILDFIRE_RESPONSE]
    transitions:
      - from: SCHEDULED
        to: BRIEFED
        trigger: "POST /executions/{id}/brief"
        actor: BurnBoss
        preconditions:
          - "execution.phase == SCHEDULED (ERR_EXECUTION_NOT_SCHEDULED)"
          - "X-User-ID == plan.author_boss_id (ERR_NOT_RESOURCE_OWNER)"
          - "execution.plan_version_at_schedule == plan.version (ERR_STALE_PLAN_VERSION)"
          - "order for the plan is FILLED (ERR_HOLDING_FORCE_INADEQUATE)"
          - "an IgnitionPlan with status ACCEPTED exists for the plan (ERR_IGNITION_PLAN_NOT_ACCEPTED)"
          - "a ContingencyPlan with status ACCEPTED exists for the plan (ERR_CONTINGENCY_NOT_ACCEPTED)"
          - "plan's permit is ISSUED (ERR_PERMIT_NOT_ISSUED)"
          - "a SmokeApproval in {APPROVED, CONDITIONALLY_APPROVED} exists for the plan with requested_burn_date == execution.scheduled_date (ERR_SMOKE_APPROVAL_NOT_VALID)"
          - "current clock date == execution.scheduled_date (ERR_WRONG_BURN_DAY)"
          - "permit.notified_completed_at is not null AND current clock >= notified_completed_at + 48 hours (ERR_NOTIFICATION_LEAD_TIME_UNMET)"
        side_effects: ["increments BurnExecution.version by 1"]
      - from: BRIEFED
        to: TEST_FIRE
        trigger: "POST /executions/{id}/go-no-go when evaluation passes (see go_no_go_evaluation)"
        actor: BurnBoss
        preconditions:
          - "execution.phase == BRIEFED (ERR_EXECUTION_NOT_BRIEFED)"
          - "checklist_answers covers all six required items (ERR_INCOMPLETE_CHECKLIST)"
          - "latest WeatherObservation (by observed_at; tie-break created_at ASC, latest wins) exists and current clock - observed_at <= 60 minutes (ERR_WEATHER_OBSERVATION_STALE)"
          - "latest observation in_prescription == true (ERR_WEATHER_OUT_OF_PRESCRIPTION)"
          - "confirmed units per resource type >= required_* (ERR_HOLDING_FORCE_INADEQUATE)"
        side_effects:
          - "creates GoNoGoChecklist with verdict GO"
          - "increments BurnExecution.version by 1"
      - from: BRIEFED
        to: STOOD_DOWN
        trigger: "POST /executions/{id}/go-no-go when any answer is FAIL, OR POST /executions/{id}/stand-down"
        actor: BurnBoss
        preconditions:
          - "execution.phase == BRIEFED (ERR_EXECUTION_NOT_BRIEFED)"
        side_effects:
          - "when via go-no-go: creates GoNoGoChecklist with verdict NO_GO"
          - "increments BurnExecution.version by 1"
      - from: TEST_FIRE
        to: IGNITION
        trigger: "POST /executions/{id}/start-ignition"
        actor: BurnBoss
        preconditions:
          - "execution.phase == TEST_FIRE (ERR_EXECUTION_NOT_IN_TEST_FIRE)"
          - "latest observation age <= 60 minutes (ERR_WEATHER_OBSERVATION_STALE)"
          - "latest observation in_prescription == true (ERR_WEATHER_OUT_OF_PRESCRIPTION)"
        side_effects: ["increments BurnExecution.version by 1"]
      - from: IGNITION
        to: HOLDING
        trigger: "POST /executions/{id}/complete-ignition"
        actor: BurnBoss
        preconditions:
          - "execution.phase == IGNITION (ERR_EXECUTION_NOT_IGNITING)"
        side_effects:
          - "sets acres_blackened from input"
          - "increments BurnExecution.version by 1"
      - from: HOLDING
        to: PATROL
        trigger: "POST /executions/{id}/begin-patrol"
        actor: BurnBoss
        preconditions:
          - "execution.phase == HOLDING (ERR_EXECUTION_NOT_HOLDING)"
          - "no Incident of this execution has response_status in {REPORTED, CONFIRMED} (ERR_OPEN_INCIDENTS_EXIST)"
        side_effects: ["increments BurnExecution.version by 1"]
      - from: PATROL
        to: MOP_UP
        trigger: "POST /executions/{id}/begin-mop-up"
        actor: BurnBoss
        preconditions:
          - "execution.phase == PATROL (ERR_EXECUTION_NOT_PATROLLING)"
          - "no Incident of this execution has response_status in {REPORTED, CONFIRMED} (ERR_OPEN_INCIDENTS_EXIST)"
        side_effects: ["increments BurnExecution.version by 1"]
      - from: MOP_UP
        to: CLOSED
        trigger: "POST /executions/{id}/close"
        actor: BurnBoss
        preconditions:
          - "execution.phase == MOP_UP (ERR_EXECUTION_NOT_MOPPING_UP)"
          - "no Incident of this execution has response_status in {REPORTED, CONFIRMED} (ERR_OPEN_INCIDENTS_EXIST)"
        side_effects:
          - "sets closed_at = current clock, records actual_treatment_lines"
          - "creates three MonitoringReports (FIRST_24H due closed_at+24h, SEVEN_DAY due closed_at+7d, THIRTY_DAY due closed_at+30d), each status DUE"
          - "all CONFIRMED CrewAssignments of the plan's orders -> COMPLETED (units freed)"
          - "increments BurnExecution.version by 1"
      - from: TEST_FIRE
        to: ESCAPED
        trigger: "POST /executions/{id}/declare-escape"
        actor: BurnBoss
        preconditions:
          - "execution.phase in {TEST_FIRE, IGNITION, HOLDING, PATROL} (ERR_EXECUTION_NOT_ESCAPABLE)"
        side_effects:
          - "creates an Incident (incident_type ESCAPE, response_status REPORTED, billing_status UNASSESSED)"
          - "increments BurnExecution.version by 1"
      - from: IGNITION
        to: ESCAPED
        trigger: "POST /executions/{id}/declare-escape"
        actor: BurnBoss
        preconditions: ["execution.phase in {TEST_FIRE, IGNITION, HOLDING, PATROL} (ERR_EXECUTION_NOT_ESCAPABLE)"]
        side_effects: ["same as TEST_FIRE -> ESCAPED"]
      - from: HOLDING
        to: ESCAPED
        trigger: "POST /executions/{id}/declare-escape"
        actor: BurnBoss
        preconditions: ["execution.phase in {TEST_FIRE, IGNITION, HOLDING, PATROL} (ERR_EXECUTION_NOT_ESCAPABLE)"]
        side_effects: ["same as TEST_FIRE -> ESCAPED"]
      - from: PATROL
        to: ESCAPED
        trigger: "POST /executions/{id}/declare-escape"
        actor: BurnBoss
        preconditions: ["execution.phase in {TEST_FIRE, IGNITION, HOLDING, PATROL} (ERR_EXECUTION_NOT_ESCAPABLE)"]
        side_effects: ["same as TEST_FIRE -> ESCAPED"]
      - from: ESCAPED
        to: WILDFIRE_RESPONSE
        trigger: "system (an Incident of this execution is DECLARED_WILDFIRE)"
        actor: system
        preconditions: []
        side_effects:
          - "the plan's ISSUED permit -> SUSPENDED (which itself suspends the plan's {APPROVED, PARTIALLY_DISBURSED} CostShareAgreements)"
          - "increments BurnExecution.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /executions/{id}/cancel OR system cascade (plan cancelled)"
        actor: BurnBoss | system
        preconditions:
          - "execution.phase == SCHEDULED (ERR_EXECUTION_NOT_SCHEDULED); manual cancel also requires X-User-ID == plan.author_boss_id"
        side_effects: ["increments BurnExecution.version by 1"]
      - from: SCHEDULED
        to: LAPSED
        trigger: "system clock sweep: scheduled_date < current date"
        actor: system
        preconditions: []
        side_effects: ["increments BurnExecution.version by 1"]

  - entity: PermitNotification
    initial_state: REQUESTED
    terminal_states: [CONFIRMED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /notifications/{id}/confirm"
        actor: BurnBoss
        preconditions:
          - "notification.status == REQUESTED (ERR_NOTIFICATION_NOT_REQUESTED)"
        side_effects:
          - "sets confirmed_at = current clock"
          - "recomputes permit.notifications_completed and permit.notified_completed_at"
          - "increments PermitNotification.version by 1"

  - entity: Incident
    initial_state: REPORTED (response_status) / UNASSESSED (billing_status)
    terminal_states: [CLOSED, DISMISSED, DECLARED_WILDFIRE (response axis); SETTLED, DISPUTED (billing axis)]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /incidents/{id}/confirm"
        actor: IncidentCommander
        preconditions:
          - "incident.response_status == REPORTED (ERR_INCIDENT_NOT_REPORTED)"
        side_effects: ["increments Incident.version by 1"]
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /incidents/{id}/dismiss"
        actor: IncidentCommander
        preconditions:
          - "incident.response_status == REPORTED (ERR_INCIDENT_NOT_REPORTED)"
        side_effects: ["increments Incident.version by 1"]
      - from: CONFIRMED
        to: CONTAINED
        trigger: "POST /incidents/{id}/mark-contained"
        actor: IncidentCommander
        preconditions:
          - "incident.response_status == CONFIRMED (ERR_INCIDENT_NOT_CONFIRMED)"
        side_effects: ["increments Incident.version by 1"]
      - from: CONFIRMED
        to: DECLARED_WILDFIRE
        trigger: "POST /incidents/{id}/declare-wildfire"
        actor: IncidentCommander
        preconditions:
          - "incident.response_status == CONFIRMED (ERR_INCIDENT_NOT_CONFIRMED)"
        side_effects:
          - "the parent BurnExecution (phase ESCAPED) -> WILDFIRE_RESPONSE (link B of wildfire cascade)"
          - "execution entering WILDFIRE_RESPONSE suspends the plan's ISSUED permit (link C)"
          - "permit suspension suspends the plan's {APPROVED, PARTIALLY_DISBURSED} CostShareAgreements (link D)"
          - "increments Incident.version by 1"
      - from: CONTAINED
        to: CLOSED
        trigger: "POST /incidents/{id}/close"
        actor: IncidentCommander
        preconditions:
          - "incident.response_status == CONTAINED (ERR_INCIDENT_NOT_CONTAINED)"
        side_effects: ["increments Incident.version by 1"]
      - from: UNASSESSED
        to: ASSESSED
        trigger: "POST /incidents/{id}/assess-costs"
        actor: IncidentCommander
        preconditions:
          - "incident.billing_status == UNASSESSED (ERR_BILLING_NOT_UNASSESSED)"
          - "incident.response_status in {CONTAINED, CLOSED, DECLARED_WILDFIRE} (ERR_INCIDENT_NOT_COSTABLE)"
        side_effects:
          - "sets suppression_cost_cents and escaped_acres"
          - "increments Incident.version by 1"
      - from: ASSESSED
        to: BILLED
        trigger: "system (a LiabilityClaim is created for this incident)"
        actor: system
        preconditions: []
        side_effects: ["increments Incident.version by 1"]
      - from: BILLED
        to: SETTLED
        trigger: "system (the incident's LiabilityClaim reaches PAID)"
        actor: system
        preconditions: []
        side_effects: ["increments Incident.version by 1"]
      - from: SETTLED
        to: DISPUTED
        trigger: "system (the incident's LiabilityClaim payment is reversed)"
        actor: system
        preconditions: []
        side_effects: ["increments Incident.version by 1"]
      - from: DISPUTED
        to: SETTLED
        trigger: "system (the incident's LiabilityClaim is paid again after reversal)"
        actor: system
        preconditions: []
        side_effects: ["increments Incident.version by 1"]

  - entity: MonitoringReport
    initial_state: DUE
    terminal_states: [ACCEPTED]
    transitions:
      - from: DUE
        to: OVERDUE
        trigger: "system clock sweep: due_at < current clock"
        actor: system
        preconditions: []
        side_effects: []
      - from: DUE
        to: SUBMITTED
        trigger: "POST /monitoring-reports/{id}/submit"
        actor: BurnBoss
        preconditions:
          - "report.status in {DUE, OVERDUE, DEFICIENT} (ERR_REPORT_NOT_SUBMITTABLE)"
          - "X-User-ID == execution.plan.author_boss_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "computes effectiveness_score (see monitoring_effectiveness_score)"
          - "increments MonitoringReport.version by 1"
      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /monitoring-reports/{id}/submit"
        actor: BurnBoss
        preconditions: ["same as DUE -> SUBMITTED"]
        side_effects: ["same as DUE -> SUBMITTED"]
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /monitoring-reports/{id}/submit"
        actor: BurnBoss
        preconditions: ["same as DUE -> SUBMITTED"]
        side_effects: ["same as DUE -> SUBMITTED"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /monitoring-reports/{id}/accept"
        actor: AgencyReviewer
        preconditions:
          - "report.status == SUBMITTED (ERR_REPORT_NOT_SUBMITTED)"
          - "X-User-ID != execution.plan.author_boss_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "when report_type == THIRTY_DAY: recomputes final_reimbursement_cents on the linked CostShareAgreement"
          - "increments MonitoringReport.version by 1"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /monitoring-reports/{id}/mark-deficient"
        actor: AgencyReviewer
        preconditions:
          - "report.status == SUBMITTED (ERR_REPORT_NOT_SUBMITTED)"
        side_effects:
          - "records deficiency_reason"
          - "increments MonitoringReport.version by 1"

  - entity: CostShareAgreement
    initial_state: SUBMITTED
    terminal_states: [DENIED, FULLY_DISBURSED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /cost-share-agreements/{id}/begin-review"
        actor: AssociationAdmin
        preconditions:
          - "agreement.status == SUBMITTED (ERR_AGREEMENT_NOT_SUBMITTED)"
        side_effects: ["increments CostShareAgreement.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /cost-share-agreements/{id}/approve"
        actor: AssociationAdmin
        preconditions:
          - "agreement.status == UNDER_REVIEW (ERR_AGREEMENT_NOT_UNDER_REVIEW)"
          - "X-User-ID != agreement.landowner_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "sets approved_at = current clock; expires_at = approved_at + 365 days"
          - "increments CostShareAgreement.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /cost-share-agreements/{id}/deny"
        actor: AssociationAdmin
        preconditions:
          - "agreement.status == UNDER_REVIEW (ERR_AGREEMENT_NOT_UNDER_REVIEW)"
        side_effects: ["increments CostShareAgreement.version by 1"]
      - from: APPROVED
        to: PARTIALLY_DISBURSED
        trigger: "POST /cost-share-agreements/{id}/disburse (provisional installment)"
        actor: AssociationAdmin
        preconditions:
          - "agreement.status == APPROVED (ERR_AGREEMENT_NOT_APPROVED)"
          - "the plan has an execution in CLOSED phase (ERR_NO_CLOSED_EXECUTION)"
          - "current clock <= agreement.expires_at (ERR_AGREEMENT_EXPIRED)"
          - "fund_balance_cents >= provisional installment (ERR_INSUFFICIENT_ASSOCIATION_FUNDS)"
        side_effects:
          - "disburses round_half_up(provisional_estimate_cents * 0.5); disbursed_cents += installment"
          - "association.fund_balance_cents -= installment"
          - "increments CostShareAgreement.version by 1"
      - from: PARTIALLY_DISBURSED
        to: FULLY_DISBURSED
        trigger: "POST /cost-share-agreements/{id}/disburse (final installment)"
        actor: AssociationAdmin
        preconditions:
          - "agreement.status == PARTIALLY_DISBURSED (ERR_AGREEMENT_NOT_PARTIALLY_DISBURSED)"
          - "the execution's THIRTY_DAY MonitoringReport is ACCEPTED (ERR_MONITORING_NOT_ACCEPTED)"
          - "current clock <= agreement.expires_at (ERR_AGREEMENT_EXPIRED)"
          - "fund_balance_cents >= final installment (ERR_INSUFFICIENT_ASSOCIATION_FUNDS)"
        side_effects:
          - "disburses final_reimbursement_cents - disbursed_cents"
          - "association.fund_balance_cents -= installment"
          - "increments CostShareAgreement.version by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "system cascade (permit SUSPENDED, or plan SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects: ["increments CostShareAgreement.version by 1"]
      - from: PARTIALLY_DISBURSED
        to: SUSPENDED
        trigger: "system cascade (permit SUSPENDED, or plan SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects: ["increments CostShareAgreement.version by 1"]
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /cost-share-agreements/{id}/reinstate"
        actor: AssociationAdmin
        preconditions:
          - "agreement.status == SUSPENDED (ERR_AGREEMENT_NOT_SUSPENDED)"
          - "all LiabilityClaims on incidents of the plan's executions are in {CLOSED, DISMISSED, PAYMENT_REVERSED} (ERR_CLAIMS_NOT_RESOLVED)"
          - "the plan's permit is ISSUED (ERR_PERMIT_NOT_ISSUED)"
        side_effects:
          - "target state is APPROVED when disbursed_cents == 0, else PARTIALLY_DISBURSED (conditional target)"
          - "increments CostShareAgreement.version by 1"
      - from: SUSPENDED
        to: PARTIALLY_DISBURSED
        trigger: "POST /cost-share-agreements/{id}/reinstate (when disbursed_cents > 0)"
        actor: AssociationAdmin
        preconditions: ["same as SUSPENDED -> APPROVED"]
        side_effects: ["same as SUSPENDED -> APPROVED"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /cost-share-agreements/{id}/cancel"
        actor: AssociationAdmin
        preconditions:
          - "agreement.status in {SUBMITTED, UNDER_REVIEW, APPROVED} (ERR_AGREEMENT_NOT_CANCELLABLE)"
        side_effects: ["increments CostShareAgreement.version by 1"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /cost-share-agreements/{id}/cancel"
        actor: AssociationAdmin
        preconditions: ["agreement.status in {SUBMITTED, UNDER_REVIEW, APPROVED} (ERR_AGREEMENT_NOT_CANCELLABLE)"]
        side_effects: ["increments CostShareAgreement.version by 1"]
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /cost-share-agreements/{id}/cancel"
        actor: AssociationAdmin
        preconditions: ["agreement.status in {SUBMITTED, UNDER_REVIEW, APPROVED} (ERR_AGREEMENT_NOT_CANCELLABLE)"]
        side_effects: ["increments CostShareAgreement.version by 1"]

  - entity: LiabilityClaim
    initial_state: FILED
    terminal_states: [DISMISSED, CLOSED]
    transitions:
      - from: FILED
        to: UNDER_INVESTIGATION
        trigger: "POST /liability-claims/{id}/begin-investigation"
        actor: AssociationAdmin
        preconditions:
          - "claim.status == FILED (ERR_CLAIM_NOT_FILED)"
        side_effects: ["increments LiabilityClaim.version by 1"]
      - from: UNDER_INVESTIGATION
        to: ADJUDICATED
        trigger: "POST /liability-claims/{id}/adjudicate with outcome=LANDOWNER_LIABLE or ASSOCIATION_LIABLE"
        actor: AssociationAdmin
        preconditions:
          - "claim.status == UNDER_INVESTIGATION (ERR_CLAIM_NOT_UNDER_INVESTIGATION)"
        side_effects:
          - "computes landowner_share_cents / association_share_cents per suppression_cost_allocation (variant selected by negligence_found)"
          - "sets adjudicated_at = current clock"
          - "when outcome == LANDOWNER_LIABLE: landowner.outstanding_liability_cents += landowner_share_cents"
          - "increments LiabilityClaim.version by 1"
      - from: UNDER_INVESTIGATION
        to: DISMISSED
        trigger: "POST /liability-claims/{id}/adjudicate with outcome=NOT_LIABLE"
        actor: AssociationAdmin
        preconditions:
          - "claim.status == UNDER_INVESTIGATION (ERR_CLAIM_NOT_UNDER_INVESTIGATION)"
        side_effects: ["increments LiabilityClaim.version by 1"]
      - from: ADJUDICATED
        to: PAID
        trigger: "POST /liability-claims/{id}/pay"
        actor: AssociationAdmin
        preconditions:
          - "claim.status in {ADJUDICATED, PAYMENT_REVERSED} (ERR_CLAIM_NOT_ADJUDICATED)"
          - "fund payout per fund_payout_with_cap > 0 or association_share_cents == 0 (ERR_INSUFFICIENT_ASSOCIATION_FUNDS when computed payout == 0 and association_share_cents > 0)"
        side_effects:
          - "fund_payout_cents = min(association_share_cents, floor(fund_balance_cents * 0.5), association.single_claim_cap_cents) evaluated with balance BEFORE debit (see fund_payout_with_cap)"
          - "association.fund_balance_cents -= fund_payout_cents"
          - "incident.billing_status -> SETTLED"
          - "increments LiabilityClaim.version by 1"
      - from: PAYMENT_REVERSED
        to: PAID
        trigger: "POST /liability-claims/{id}/pay"
        actor: AssociationAdmin
        preconditions: ["same as ADJUDICATED -> PAID"]
        side_effects: ["same as ADJUDICATED -> PAID"]
      - from: PAID
        to: PAYMENT_REVERSED
        trigger: "POST /liability-claims/{id}/reverse-payment"
        actor: AssociationAdmin
        preconditions:
          - "claim.status == PAID (ERR_CLAIM_NOT_PAID)"
        side_effects:
          - "association.fund_balance_cents += claim.fund_payout_cents (exact restoration; compensating invariant)"
          - "incident.billing_status -> DISPUTED"
          - "increments LiabilityClaim.version by 1"
      - from: PAID
        to: CLOSED
        trigger: "POST /liability-claims/{id}/close"
        actor: AssociationAdmin
        preconditions:
          - "claim.status in {PAID, PAYMENT_REVERSED} (ERR_CLAIM_NOT_CLOSABLE)"
        side_effects: ["increments LiabilityClaim.version by 1"]
      - from: PAYMENT_REVERSED
        to: CLOSED
        trigger: "POST /liability-claims/{id}/close"
        actor: AssociationAdmin
        preconditions: ["claim.status in {PAID, PAYMENT_REVERSED} (ERR_CLAIM_NOT_CLOSABLE)"]
        side_effects: ["increments LiabilityClaim.version by 1"]

# =============================================================================
# Concurrency Rules (OCC on parent version; see SKILL.md section 1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: burn-plan-create-stale-parcel
    parent_entity: Parcel
    write_endpoint: "POST /burn-plans"
    occ_field: "expected_parcel_version"
    description: |
      Creating a BurnPlan against a Parcel whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just created a plan on the same parcel (which advances the
      parcel's version) and the current writer's view of the parcel is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: ignition-plan-create-stale-plan
    parent_entity: BurnPlan
    write_endpoint: "POST /burn-plans/{id}/ignition-plans"
    occ_field: "expected_burn_plan_version"
    description: |
      Creating an IgnitionPlan against a BurnPlan whose version has advanced
      since the client last observed it is rejected. Because creating an
      IgnitionPlan legitimately supersedes the prior ignition plan and advances
      the BurnPlan's version, a second create carrying the older version is
      stale and must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: hazard_score
    trigger: "Parcel creation (recomputed only then; inputs are immutable)"
    algorithm: weighted_scoring
    formula: |
      hazard_score = FUEL_WEIGHT[fuel_model] + SLOPE_WEIGHT[slope_class]
                   + (20 if wui_adjacent else 0) + drought_index
      Range: 0..120.
    input_set: "the Parcel's own immutable attributes"
    constants:
      FUEL_WEIGHT: { GRASS: 20, BRUSH: 35, TIMBER: 50 }
      SLOPE_WEIGHT: { FLAT: 0, MODERATE: 10, STEEP: 20 }
      WUI_BONUS: 20
    precision: "integer, exact"

  - name: certification_gate
    trigger: "POST /burn-plans"
    algorithm: threshold
    formula: |
      RXB1: allowed iff planned_acres <= 40 AND parcel.hazard_score <= 40
      RXB2: allowed iff planned_acres <= 200 AND parcel.hazard_score <= 70
      RXB3: always allowed
      Both bounds INCLUSIVE. Violation -> ERR_BOSS_CERTIFICATION_INSUFFICIENT.
    input_set: "author BurnBoss.certification_tier, plan.planned_acres, parcel.hazard_score"
    precision: "integer comparison, inclusive bounds"

  - name: required_holding_force
    trigger: "ResourceOrder creation (required_* pinned from plan + parcel at that moment)"
    algorithm: tiered_pricing
    formula: |
      required_engines       = ceil(plan.planned_acres / 40 * FUEL_FACTOR[parcel.fuel_model])
                               + (2 if parcel.wui_adjacent else 0)
      required_hand_crews    = max(1, ceil(plan.planned_acres / 80))
                               * (2 if parcel.slope_class == STEEP else 1)
      required_dozers        = 1 if (parcel.fuel_model == TIMBER and plan.planned_acres > 100) else 0
      required_water_tenders = max(1, floor(plan.planned_acres / 60))
      Worked pins: 100 acres BRUSH MODERATE non-WUI -> engines 4, crews 2, dozers 0, tenders 1.
      150 acres TIMBER STEEP WUI -> engines ceil(3.75*2.0)+2 = 10, crews max(1,2)*2 = 4, dozers 1, tenders 2.
    input_set: "plan.planned_acres; parcel.{fuel_model, slope_class, wui_adjacent}"
    constants:
      FUEL_FACTOR: { GRASS: 1.0, BRUSH: 1.5, TIMBER: 2.0 }
      ACRES_PER_ENGINE: 40
      ACRES_PER_HAND_CREW: 80
      ACRES_PER_WATER_TENDER: 60
      WUI_ENGINE_BONUS: 2
      STEEP_CREW_MULTIPLIER: 2
      DOZER_TIMBER_ACRE_THRESHOLD: 100
    precision: "ceil/floor to integer units, exact"

  - name: order_fill_evaluation
    trigger: "CrewAssignment confirm / release / no-show / cascade release"
    algorithm: threshold
    formula: |
      confirmed_<type> = sum(assignment.units) over assignments with status == CONFIRMED
                         whose contractor.resource_type == <type>
      order FILLED iff confirmed_engines >= required_engines
                    AND confirmed_hand_crews >= required_hand_crews
                    AND confirmed_dozers >= required_dozers
                    AND confirmed_water_tenders >= required_water_tenders
      else PARTIALLY_FILLED iff any confirmed_* > 0, else SUBMITTED (post-submit floor)
      Boundary: equality (==) counts as filled for each type.
    input_set: "assignments of this order in status CONFIRMED"
    precision: "integer comparison, inclusive"

  - name: contractor_availability
    trigger: "assignment create (capacity check), confirm, decline, release, no-show, completion"
    algorithm: aggregation
    formula: |
      available_units = contractor.capacity_units
                        - sum(units) over that contractor's assignments in {ASSIGNED, CONFIRMED}
      Compensating invariant: ASSIGN followed by RELEASE/DECLINE/NO_SHOW/COMPLETED restores
      available_units exactly to its prior value.
    input_set: "assignments of the contractor in {ASSIGNED, CONFIRMED}"
    precision: "integer, exact"

  - name: weather_prescription_check
    trigger: "WeatherObservation creation (computes in_prescription)"
    algorithm: threshold
    formula: |
      p = execution.plan prescription fields
      in_prescription =
           wind_mph <= p.max_wind_mph
       AND p.min_fuel_moisture_pct <= fuel_moisture_pct <= p.max_fuel_moisture_pct
       AND rh_pct >= p.min_rh_pct
       AND p.min_temp_f <= temp_f <= p.max_temp_f
       AND mixing_height_ft >= p.min_mixing_height_ft
      ALL bounds INCLUSIVE: wind == max_wind_mph passes; fuel_moisture == min passes.
    input_set: "the observation's five readings vs the plan's prescription fields"
    precision: "integer comparison, inclusive bounds"

  - name: observation_freshness
    trigger: "go-no-go and start-ignition evaluation"
    algorithm: threshold
    formula: |
      latest = observation with max observed_at; tie-break: created_at ASC, later row wins
      fresh iff (current_clock - latest.observed_at) <= 60 minutes  (exactly 60 min PASSES)
      ERR_WEATHER_OBSERVATION_STALE when no observation exists or age > 60 minutes.
    constants:
      FRESHNESS_LIMIT_MINUTES: 60
    precision: "minute granularity, inclusive bound"

  - name: notification_lead_time
    trigger: "brief evaluation"
    algorithm: threshold
    formula: |
      permit.notified_completed_at = max(confirmed_at) over CONFIRMED PermitNotifications
      brief allowed iff notified_completed_at is not null
                    AND current_clock >= notified_completed_at + 48 hours
      Exactly 48h00m00s PASSES (inclusive).
    constants:
      LEAD_TIME_HOURS: 48
    precision: "second granularity, inclusive bound"

  - name: airshed_daily_capacity
    trigger: "POST /smoke-approvals/{id}/decide with decision in {APPROVED, CONDITIONALLY_APPROVED}"
    algorithm: aggregation
    formula: |
      committed = sum(requested_acres) over OTHER SmokeApprovals with status in
                  {APPROVED, CONDITIONALLY_APPROVED}, same airshed_id, same requested_burn_date
      decision allowed iff committed + this.requested_acres <= association.airshed_daily_acres_cap
      Equality (== cap) PASSES. Aggregate-capacity semantics: pairwise interval geometry
      is irrelevant; only the same-date acreage sum matters.
    precision: "integer acres, inclusive bound"

  - name: provisional_cost_share_estimate
    trigger: "CostShareAgreement creation"
    algorithm: tiered_pricing
    formula: |
      share = SHARE_PCT[funding_tier]
      line_amount(line) = round_half_up(line.acres * RATE_CENTS[line.rate_class] * share)
      provisional_estimate_cents = sum over lines of line_amount(line)
      PINNED ROUNDING ORDER: each line is rounded to whole cents FIRST (round_half_up),
      then the rounded integers are summed. Summing raw values and rounding once at the
      end is a DIFFERENT, forbidden order (off-by-cents divergence).
      Worked pin: LEGACY, lines {BROADCAST/GRASS/12} + {UNDERSTORY/BRUSH/3}:
        line A = round(12 * 15327 * 0.65) = round(119550.60) = 119551
        line B = round(3 * 28750 * 0.65)  = round(56062.50)  = 56063
        provisional_estimate_cents = 175614   (sum-then-round would yield 175613)
    constants:
      RATE_CENTS: { GRASS: 15327, BRUSH: 28750, TIMBER: 46000 }
      SHARE_PCT: { STANDARD: 0.50, PRIORITY: 0.75, LEGACY: 0.65 }
    precision: "0 decimal places (integer cents), round_half_up per line, then sum"
    variants:
      - name: provisional
        when: "at agreement creation / approval"
        difference: "uses planned treatment_lines acres; no effectiveness factor (implicitly 1.0)"

  - name: final_cost_share_reimbursement
    trigger: "THIRTY_DAY MonitoringReport ACCEPTED (recompute), disburse (read)"
    algorithm: tiered_pricing
    formula: |
      eff = effectiveness_score of the ACCEPTED THIRTY_DAY report
      factor = 1.00 if eff >= 80; 0.75 if 50 <= eff < 80; 0.00 if eff < 50  (bounds INCLUSIVE at 80 and 50)
      line_final(line) = round_half_up(actual_acres(line) * RATE_CENTS[line.rate_class] * share * factor)
        where actual_acres(line) is taken from the report's actual_treatment_lines matched by category
      final_reimbursement_cents = sum over lines of line_final(line)   (same pinned order: per-line round, then sum)
      final installment at disburse = final_reimbursement_cents - disbursed_cents
      CLAWBACK: the final installment MAY be negative (actuals far below plan). A negative
      installment decreases disbursed_cents and CREDITS association.fund_balance_cents by the
      same magnitude; the fund-sufficiency check is skipped for non-positive installments.
      Conservation invariant: after the final disburse, disbursed_cents == final_reimbursement_cents
      and (disbursed_cents + remaining_due) == final_reimbursement_cents at every point.
    constants:
      RATE_CENTS: { GRASS: 15327, BRUSH: 28750, TIMBER: 46000 }
      SHARE_PCT: { STANDARD: 0.50, PRIORITY: 0.75, LEGACY: 0.65 }
      PROVISIONAL_INSTALLMENT_FRACTION: 0.5
      EFFECTIVENESS_FULL_THRESHOLD: 80
      EFFECTIVENESS_PARTIAL_THRESHOLD: 50
      EFFECTIVENESS_PARTIAL_FACTOR: 0.75
    precision: "0 decimal places (integer cents), round_half_up per line, then sum"
    variants:
      - name: final
        when: "after THIRTY_DAY report ACCEPTED"
        difference: "uses actual acres from the accepted report and applies the effectiveness factor; produces a different total than provisional whenever actuals diverge from plan"

  - name: monitoring_effectiveness_score
    trigger: "MonitoringReport submit"
    algorithm: weighted_scoring
    formula: |
      weights: BROADCAST 1.0, UNDERSTORY 0.8, PILE_BURN 0.6
      planned_w = sum over agreement.treatment_lines of (acres * weight[category])
      actual_w  = sum over report.actual_treatment_lines of (acres * weight[category])
                  (categories absent from actuals contribute 0)
      effectiveness_score = round_half_up(100 * actual_w / planned_w)
      Worked pin: planned {BROADCAST 12, UNDERSTORY 3} -> planned_w = 12 + 2.4 = 14.4;
                  actual  {BROADCAST 11, UNDERSTORY 3} -> actual_w  = 11 + 2.4 = 13.4;
                  score = round_half_up(93.0555...) = 93.
    input_set: "agreement treatment_lines (planned), report actual_treatment_lines (actual)"
    constants:
      CATEGORY_WEIGHT: { BROADCAST: 1.0, UNDERSTORY: 0.8, PILE_BURN: 0.6 }
    precision: "integer percent 0..100+ (no clamp), round_half_up"

  - name: suppression_cost_allocation
    trigger: "LiabilityClaim adjudication"
    algorithm: threshold
    formula: |
      standard (negligence_found == false):
        landowner_share_cents = min(escaped_acres * PER_ACRE_CENTS, association.landowner_liability_cap_cents)
      negligence (negligence_found == true):
        landowner_share_cents = round_half_up(escaped_acres * PER_ACRE_CENTS * 1.5)   # UNCAPPED
      association_share_cents = total_suppression_cost_cents - landowner_share_cents
      Worked pin (total 3000000, escaped 60, cap 1000000):
        standard   -> landowner 1000000, association 2000000
        negligence -> landowner 2250000, association 750000
    constants:
      PER_ACRE_CENTS: 25000
      NEGLIGENCE_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up"
    variants:
      - name: standard_allocation
        when: "negligence_found == false"
        difference: "landowner share capped at association.landowner_liability_cap_cents"
      - name: negligence_allocation
        when: "negligence_found == true"
        difference: "1.5x multiplier and NO cap; same incident data yields a strictly larger landowner share"

  - name: fund_payout_with_cap
    trigger: "LiabilityClaim pay"
    algorithm: waterfall_allocation
    formula: |
      CIRCULAR-LOOKING DEPENDENCY, EVALUATION ORDER PINNED:
        (1) B = association.fund_balance_cents BEFORE this payout
        (2) cap = min(floor(B * FUND_PAYOUT_FRACTION), association.single_claim_cap_cents)
        (3) fund_payout_cents = min(claim.association_share_cents, cap)
        (4) debit: fund_balance_cents = B - fund_payout_cents
      Step (2) MUST use the pre-debit balance B; using the post-debit balance is forbidden.
      Worked pin: B = 600000, association_share 2000000, single_claim_cap 500000
        -> cap = min(300000, 500000) = 300000 -> payout 300000 -> new balance 300000.
    constants:
      FUND_PAYOUT_FRACTION: 0.5
    precision: "integer cents, floor for the fraction"

  - name: fund_ledger_reconciliation
    trigger: "fund deposit, cost-share disburse, liability pay, liability reverse-payment"
    algorithm: aggregation
    formula: |
      fund_balance_cents == initial_fund_cents + sum(deposits)
                            - sum(non-reversed liability fund_payout_cents)
                            - sum(cost-share installments disbursed)
      Compensating invariant: pay followed by reverse-payment restores fund_balance_cents
      to exactly its pre-pay value; fund_payout_cents of the reversed claim stays recorded
      but is excluded from the payout sum.
    precision: "integer cents, exact"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role must be listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right"
    error_id: "ERR_NOT_FOUND (or resource-specific ERR_*_NOT_FOUND)"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: auth
    check: "Ownership: BurnBoss X-User-ID must equal plan.author_boss_id for author-scoped actions; Landowner X-User-ID must equal the owning landowner_id; Contractor X-User-ID must equal assignment.contractor_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "author-scoped BurnBoss endpoints, Landowner parcel/agreement creation, Contractor confirm/decline"

  - priority: 5
    category: auth
    check: "Segregation of duties: reviewer/approver X-User-ID must differ from plan.author_boss_id (plan approve, permit issue, contingency accept, ignition accept, monitoring accept); cost-share approver X-User-ID must differ from agreement.landowner_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "approve/issue/accept endpoints and cost-share approve"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version (when the endpoint declares one) must equal the parent's current version; evaluated BEFORE business rules"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /burn-plans (Parcel), POST /burn-plans/{id}/ignition-plans (BurnPlan)"

  - priority: 7
    category: state
    check: "Target resource must be in the state required by the transition (per state_machines)"
    error_id: "ERR_* state codes (e.g. ERR_PLAN_NOT_SUBMITTED, ERR_EXECUTION_NOT_BRIEFED)"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 8
    category: business_safety
    check: "Weather safety: latest observation must be in_prescription (ignition, go-no-go); holding force coverage must meet required_* (brief, go-no-go); contingency and ignition plan ACCEPTED (brief)"
    error_id: "ERR_WEATHER_OUT_OF_PRESCRIPTION | ERR_HOLDING_FORCE_INADEQUATE | ERR_CONTINGENCY_NOT_ACCEPTED | ERR_IGNITION_PLAN_NOT_ACCEPTED"
    http_status: 422
    applies_to: "brief, go-no-go, start-ignition"

  - priority: 9
    category: business_safety
    check: "Certification gate: author tier must cover planned_acres and parcel.hazard_score; waiver must be signed for parcel creation; contractor and landowner standing must be GOOD_STANDING"
    error_id: "ERR_BOSS_CERTIFICATION_INSUFFICIENT | ERR_LANDOWNER_WAIVER_UNSIGNED | ERR_CONTRACTOR_SUSPENDED | ERR_LANDOWNER_NOT_IN_GOOD_STANDING"
    http_status: 403
    applies_to: "POST /burn-plans, POST /parcels, assignment create/confirm, POST /cost-share-agreements"

  - priority: 10
    category: business_referential
    check: "Version pin: execution.plan_version_at_schedule must equal plan.version at brief; referenced plan/agreement/permit must belong together (agreement.burn_plan_id's parcel landowner must equal agreement.landowner_id)"
    error_id: "ERR_STALE_PLAN_VERSION | ERR_PARCEL_OWNERSHIP_MISMATCH"
    http_status: 409
    applies_to: "brief, POST /cost-share-agreements"

  - priority: 11
    category: business_constraint
    check: "Uniqueness/capacity: one plan in {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED} per parcel — EXCEPT that a create whose supersedes_plan_id references the parcel's existing APPROVED plan is allowed (the incumbent leaves the active set only when the successor is APPROVED); one permit in {UNDER_REVIEW, ISSUED, SUSPENDED} per plan; one non-terminal execution per plan; one CostShareAgreement in {SUBMITTED, UNDER_REVIEW, APPROVED, PARTIALLY_DISBURSED, SUSPENDED} per plan; contractor window overlap (1-day buffer rule); airshed daily acreage cap; contractor capacity_units"
    error_id: "ERR_ACTIVE_PLAN_EXISTS_FOR_PARCEL | ERR_PERMIT_ALREADY_OPEN | ERR_EXECUTION_ALREADY_OPEN | ERR_ACTIVE_AGREEMENT_EXISTS_FOR_PLAN | ERR_CONTRACTOR_WINDOW_CONFLICT | ERR_AIRSHED_CAPACITY_EXCEEDED | ERR_CONTRACTOR_CAPACITY_EXCEEDED | ERR_CONTINGENCY_ALREADY_ACCEPTED"
    http_status: 409
    applies_to: "create/decide endpoints as applicable"

  - priority: 12
    category: business_temporal
    check: "Temporal: scheduled_date inside plan window; burn-day equality at brief; 48h notification lead time; 60-minute observation freshness; agreement not expired at disburse; parcel monitoring-gap (no new execution on the parcel with scheduled_date <= prior closed execution's closed_at + 30 days)"
    error_id: "ERR_WRONG_BURN_DAY | ERR_NOTIFICATION_LEAD_TIME_UNMET | ERR_WEATHER_OBSERVATION_STALE | ERR_AGREEMENT_EXPIRED | ERR_PARCEL_EXECUTION_WINDOW_CONFLICT | ERR_PLAN_WINDOW_LAPSED | ERR_SCHEDULED_DATE_OUTSIDE_WINDOW"
    http_status: 422
    applies_to: "scheduling, brief, go-no-go, start-ignition, disburse, permit issue"

  - priority: 13
    category: business_fiscal
    check: "Fiscal last: fund balance covers installment (disburse) or payout floor (liability pay)"
    error_id: "ERR_INSUFFICIENT_ASSOCIATION_FUNDS | ERR_NO_DISBURSEMENT_DUE"
    http_status: 402
    applies_to: "disburse, liability pay"

  - priority: 14
    category: business_constraint
    check: "Input shape: required fields present, enum members valid, prescription min<=max pairs, treatment_lines non-empty with acres summing to planned_acres, steps step_index unique ascending from 1, window_end > window_start"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_ENUM | ERR_INVALID_PRESCRIPTION_PARAMS"
    http_status: 400
    applies_to: "creation endpoints"
    note: "Input-shape failures are reported before auth when the body cannot be parsed at all; otherwise field-level checks run last so that auth/state errors surface first for well-formed bodies"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; default time fixed) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-05-01T00:00:00Z; before any set call the clock reads that default and never falls back to wall-clock. Setting the clock performs time sweeps: BurnPlan APPROVED with planned_window_end < current date and no CLOSED/WILDFIRE_RESPONSE execution -> EXPIRED (its ISSUED permit -> EXPIRED); BurnExecution SCHEDULED with scheduled_date < current date -> LAPSED; MonitoringReport DUE with due_at < now -> OVERDUE."
    roles: [AssociationAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["time sweeps for plan EXPIRED, permit EXPIRED, execution LAPSED, report OVERDUE"]

  # --- Associations ---
  - method: POST
    path: "/associations"
    description: "Create a burn association (fund starts at initial_fund_cents)"
    roles: [AssociationAdmin]
    code: 201
    input: [name, airshed_daily_acres_cap, single_claim_cap_cents, landowner_liability_cap_cents, initial_fund_cents]
    output: BurnAssociation
    side_effects: ["fund_balance_cents = initial_fund_cents"]
  - method: GET
    path: "/associations/{id}"
    description: "Get an association"
    roles: [Any]
    code: 200
    input: []
    output: BurnAssociation
    side_effects: []
  - method: POST
    path: "/associations/{id}/fund-deposits"
    description: "Deposit into the liability/cost-share fund"
    roles: [AssociationAdmin]
    code: 200
    input: [amount_cents]
    output: BurnAssociation
    side_effects: ["fund_balance_cents += amount_cents", "increments BurnAssociation.version by 1"]

  # --- Landowners ---
  - method: POST
    path: "/landowners"
    description: "Register a landowner"
    roles: [AssociationAdmin]
    code: 201
    input: [name, contact_email, liability_waiver_signed]
    output: Landowner
    side_effects: []
  - method: GET
    path: "/landowners/{id}"
    description: "Get a landowner"
    roles: [Any]
    code: 200
    input: []
    output: Landowner
    side_effects: []
  - method: GET
    path: "/landowners"
    description: "List landowners (paginated; filter by standing)"
    roles: [Any]
    code: 200
    input: ["standing?", "limit?", "offset?"]
    output: "Landowner[]"
    side_effects: []

  # --- Parcels ---
  - method: POST
    path: "/parcels"
    description: "Register a parcel (caller must be the owning landowner; waiver must be signed)"
    roles: [Landowner]
    code: 201
    input: [landowner_id, name, acreage, fuel_model, slope_class, wui_adjacent, airshed_id, drought_index]
    output: Parcel
    side_effects: ["hazard_score computed"]
  - method: GET
    path: "/parcels/{id}"
    description: "Get a parcel"
    roles: [Any]
    code: 200
    input: []
    output: Parcel
    side_effects: []
  - method: GET
    path: "/parcels"
    description: "List parcels (paginated; filter by landowner_id)"
    roles: [Any]
    code: 200
    input: ["landowner_id?", "limit?", "offset?"]
    output: "Parcel[]"
    side_effects: []

  # --- Burn bosses ---
  - method: POST
    path: "/burn-bosses"
    description: "Register a certified burn boss"
    roles: [AssociationAdmin]
    code: 201
    input: [name, certification_tier]
    output: BurnBoss
    side_effects: []
  - method: GET
    path: "/burn-bosses/{id}"
    description: "Get a burn boss"
    roles: [Any]
    code: 200
    input: []
    output: BurnBoss
    side_effects: []

  # --- Contractors ---
  - method: POST
    path: "/contractors"
    description: "Register a contractor"
    roles: [AssociationAdmin]
    code: 201
    input: [name, resource_type, capacity_units, personnel_per_unit, day_rate_cents_per_unit]
    output: Contractor
    side_effects: []
  - method: GET
    path: "/contractors/{id}"
    description: "Get a contractor"
    roles: [Any]
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: GET
    path: "/contractors"
    description: "List contractors (paginated; filter by resource_type)"
    roles: [Any]
    code: 200
    input: ["resource_type?", "limit?", "offset?"]
    output: "Contractor[]"
    side_effects: []
  - method: GET
    path: "/contractors/{id}/assignments"
    description: "List assignments of a contractor"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CrewAssignment[]"
    side_effects: []

  # --- Burn plans ---
  - method: POST
    path: "/burn-plans"
    description: "Draft a burn plan (OCC on Parcel version; certification gate; one active plan per parcel)"
    roles: [BurnBoss]
    code: 201
    input: [parcel_id, expected_parcel_version, planned_acres, planned_window_start, planned_window_end, max_wind_mph, min_fuel_moisture_pct, max_fuel_moisture_pct, min_rh_pct, min_temp_f, max_temp_f, min_mixing_height_ft, treatment_lines, "supersedes_plan_id?"]
    output: BurnPlan
    side_effects: ["status = DRAFT", "author_boss_id = X-User-ID", "increments Parcel.version by 1"]
  - method: GET
    path: "/burn-plans/{id}"
    description: "Get a burn plan"
    roles: [Any]
    code: 200
    input: []
    output: BurnPlan
    side_effects: []
  - method: GET
    path: "/burn-plans"
    description: "List burn plans (paginated; filters)"
    roles: [Any]
    code: 200
    input: ["parcel_id?", "author_boss_id?", "approved_by_boss_id?", "supersedes_plan_id?", "status?", "limit?", "offset?"]
    output: "BurnPlan[]"
    side_effects: []
  - method: POST
    path: "/burn-plans/{id}/submit"
    description: "Submit a draft plan for review"
    roles: [BurnBoss]
    code: 200
    input: []
    output: BurnPlan
    side_effects: ["status DRAFT -> SUBMITTED", "increments BurnPlan.version by 1"]
  - method: POST
    path: "/burn-plans/{id}/request-revision"
    description: "Reviewer sends plan back for revision"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: BurnPlan
    side_effects: ["status SUBMITTED -> REVISION_REQUESTED", "increments BurnPlan.version by 1"]
  - method: POST
    path: "/burn-plans/{id}/revise"
    description: "Author pulls a revision-requested plan back to DRAFT"
    roles: [BurnBoss]
    code: 200
    input: []
    output: BurnPlan
    side_effects: ["status REVISION_REQUESTED -> DRAFT", "increments BurnPlan.version by 1"]
  - method: POST
    path: "/burn-plans/{id}/approve"
    description: "Approve a submitted plan (segregation of duties; supersession cascade)"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: BurnPlan
    side_effects: ["status SUBMITTED -> APPROVED", "supersession cascade to prior plan, its permit, its agreements", "increments BurnPlan.version by 1"]
  - method: POST
    path: "/burn-plans/{id}/cancel"
    description: "Cancel a non-terminal plan (cascade cancels orders and releases assignments)"
    roles: [BurnBoss]
    code: 200
    input: []
    output: BurnPlan
    side_effects: ["status -> CANCELLED", "orders -> CANCELLED", "assignments ASSIGNED/CONFIRMED -> RELEASED", "non-terminal execution (SCHEDULED/BRIEFED) -> CANCELLED", "increments BurnPlan.version by 1"]

  # --- Permits & notifications ---
  - method: POST
    path: "/burn-plans/{id}/permits"
    description: "Request a burn permit for a plan (plan must be SUBMITTED or APPROVED, else ERR_PLAN_NOT_SUBMITTED; one open permit per plan)"
    roles: [BurnBoss]
    code: 201
    input: [notifications_required]
    output: BurnPermit
    side_effects: ["status = UNDER_REVIEW"]
  - method: GET
    path: "/permits/{id}"
    description: "Get a permit"
    roles: [Any]
    code: 200
    input: []
    output: BurnPermit
    side_effects: []
  - method: GET
    path: "/permits"
    description: "List permits (paginated; filter by plan, issuer, or status)"
    roles: [Any]
    code: 200
    input: ["burn_plan_id?", "issued_by_boss_id?", "status?", "limit?", "offset?"]
    output: "BurnPermit[]"
    side_effects: []
  - method: GET
    path: "/burn-plans/{id}/permits"
    description: "List permits of a plan"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "BurnPermit[]"
    side_effects: []
  - method: POST
    path: "/permits/{id}/notifications"
    description: "Record a neighbor notification for a permit"
    roles: [BurnBoss]
    code: 201
    input: [recipient_name, channel]
    output: PermitNotification
    side_effects: ["status = REQUESTED"]
  - method: GET
    path: "/permits/{id}/notifications"
    description: "List notifications of a permit"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "PermitNotification[]"
    side_effects: []
  - method: POST
    path: "/notifications/{id}/confirm"
    description: "Confirm a notification was delivered"
    roles: [BurnBoss]
    code: 200
    input: []
    output: PermitNotification
    side_effects: ["status REQUESTED -> CONFIRMED", "confirmed_at = clock", "recomputes permit.notifications_completed and notified_completed_at"]
  - method: POST
    path: "/permits/{id}/issue"
    description: "Issue a permit (SoD; requires plan APPROVED, contingency ACCEPTED, notifications complete, window not lapsed)"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: BurnPermit
    side_effects: ["status UNDER_REVIEW -> ISSUED", "sets issued_by_boss_id", "increments BurnPermit.version by 1"]
  - method: POST
    path: "/permits/{id}/deny"
    description: "Deny a permit"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: BurnPermit
    side_effects: ["status UNDER_REVIEW -> DENIED", "increments BurnPermit.version by 1"]
  - method: POST
    path: "/permits/{id}/suspend"
    description: "Suspend an issued permit (suspends plan's active cost-share agreements)"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: BurnPermit
    side_effects: ["status ISSUED -> SUSPENDED", "agreements {APPROVED, PARTIALLY_DISBURSED} -> SUSPENDED", "increments BurnPermit.version by 1"]
  - method: POST
    path: "/permits/{id}/reinstate"
    description: "Reinstate a suspended permit"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: BurnPermit
    side_effects: ["status SUSPENDED -> ISSUED", "increments BurnPermit.version by 1"]
  - method: POST
    path: "/permits/{id}/revoke"
    description: "Revoke an issued or suspended permit"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: BurnPermit
    side_effects: ["status -> REVOKED", "increments BurnPermit.version by 1"]

  # --- Smoke management ---
  - method: POST
    path: "/burn-plans/{id}/smoke-approvals"
    description: "Submit a smoke management approval request (supersedes any non-terminal approval on the same plan; copies airshed_id from parcel)"
    roles: [BurnBoss]
    code: 201
    input: [requested_burn_date, requested_acres]
    output: SmokeApproval
    side_effects: ["status = SUBMITTED", "prior SUBMITTED/APPROVED/CONDITIONALLY_APPROVED approvals on this plan -> SUPERSEDED"]
  - method: GET
    path: "/smoke-approvals/{id}"
    description: "Get a smoke approval"
    roles: [Any]
    code: 200
    input: []
    output: SmokeApproval
    side_effects: []
  - method: GET
    path: "/burn-plans/{id}/smoke-approvals"
    description: "List smoke approvals of a plan"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "SmokeApproval[]"
    side_effects: []
  - method: POST
    path: "/smoke-approvals/{id}/decide"
    description: "Air quality officer decision (airshed daily capacity enforced for APPROVED/CONDITIONALLY_APPROVED)"
    roles: [AirQualityOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: SmokeApproval
    side_effects: ["status SUBMITTED -> APPROVED | CONDITIONALLY_APPROVED | DENIED", "increments SmokeApproval.version by 1"]
  - method: POST
    path: "/smoke-approvals/{id}/withdraw"
    description: "Withdraw an approved smoke approval"
    roles: [AirQualityOfficer]
    code: 200
    input: []
    output: SmokeApproval
    side_effects: ["status -> WITHDRAWN", "increments SmokeApproval.version by 1"]
  - method: POST
    path: "/smoke-approvals/{id}/clear-conditions"
    description: "Clear conditions on a conditional approval"
    roles: [AirQualityOfficer]
    code: 200
    input: []
    output: SmokeApproval
    side_effects: ["status CONDITIONALLY_APPROVED -> APPROVED", "increments SmokeApproval.version by 1"]

  # --- Contingency plans ---
  - method: POST
    path: "/burn-plans/{id}/contingency-plans"
    description: "Draft a contingency plan"
    roles: [BurnBoss]
    code: 201
    input: [escape_trigger_points, min_holding_personnel, water_supply_description, evacuation_route_description]
    output: ContingencyPlan
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/contingency-plans/{id}"
    description: "Get a contingency plan"
    roles: [Any]
    code: 200
    input: []
    output: ContingencyPlan
    side_effects: []
  - method: GET
    path: "/burn-plans/{id}/contingency-plans"
    description: "List contingency plans of a plan"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ContingencyPlan[]"
    side_effects: []
  - method: POST
    path: "/contingency-plans/{id}/accept"
    description: "Accept a contingency plan (SoD; at most one ACCEPTED per plan)"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: ContingencyPlan
    side_effects: ["status DRAFT -> ACCEPTED", "increments ContingencyPlan.version by 1"]
  - method: POST
    path: "/contingency-plans/{id}/reject"
    description: "Reject a contingency plan"
    roles: [AgencyReviewer]
    code: 200
    input: [reason]
    output: ContingencyPlan
    side_effects: ["status DRAFT -> REJECTED", "increments ContingencyPlan.version by 1"]
  - method: POST
    path: "/contingency-plans/{id}/revise"
    description: "Author returns a rejected contingency plan to DRAFT"
    roles: [BurnBoss]
    code: 200
    input: []
    output: ContingencyPlan
    side_effects: ["status REJECTED -> DRAFT", "increments ContingencyPlan.version by 1"]

  # --- Ignition plans ---
  - method: POST
    path: "/burn-plans/{id}/ignition-plans"
    description: "Upload an ignition sequencing plan (OCC on BurnPlan version; supersedes prior ignition plans on the plan)"
    roles: [BurnBoss]
    code: 201
    input: [expected_burn_plan_version, ignition_method, test_fire_required, steps]
    output: IgnitionPlan
    side_effects: ["status = DRAFT", "prior DRAFT/ACCEPTED/REJECTED ignition plans on this plan -> SUPERSEDED", "increments BurnPlan.version by 1"]
  - method: GET
    path: "/ignition-plans/{id}"
    description: "Get an ignition plan"
    roles: [Any]
    code: 200
    input: []
    output: IgnitionPlan
    side_effects: []
  - method: GET
    path: "/burn-plans/{id}/ignition-plans"
    description: "List ignition plans of a plan"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "IgnitionPlan[]"
    side_effects: []
  - method: POST
    path: "/ignition-plans/{id}/accept"
    description: "Accept an ignition plan (SoD)"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: IgnitionPlan
    side_effects: ["status DRAFT -> ACCEPTED", "increments IgnitionPlan.version by 1"]
  - method: POST
    path: "/ignition-plans/{id}/reject"
    description: "Reject an ignition plan"
    roles: [AgencyReviewer]
    code: 200
    input: [reason]
    output: IgnitionPlan
    side_effects: ["status DRAFT -> REJECTED", "increments IgnitionPlan.version by 1"]
  - method: POST
    path: "/ignition-plans/{id}/revise"
    description: "Author returns a rejected ignition plan to DRAFT"
    roles: [BurnBoss]
    code: 200
    input: []
    output: IgnitionPlan
    side_effects: ["status REJECTED -> DRAFT", "increments IgnitionPlan.version by 1"]

  # --- Resource orders & crew assignments ---
  - method: POST
    path: "/burn-plans/{id}/resource-orders"
    description: "Create a resource order; required_* computed from plan + parcel at creation"
    roles: [BurnBoss]
    code: 201
    input: []
    output: ResourceOrder
    side_effects: ["status = DRAFT", "required_* computed per required_holding_force"]
  - method: GET
    path: "/resource-orders/{id}"
    description: "Get a resource order"
    roles: [Any]
    code: 200
    input: []
    output: ResourceOrder
    side_effects: []
  - method: GET
    path: "/burn-plans/{id}/resource-orders"
    description: "List resource orders of a plan"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ResourceOrder[]"
    side_effects: []
  - method: POST
    path: "/resource-orders/{id}/submit"
    description: "Submit a draft resource order"
    roles: [BurnBoss]
    code: 200
    input: []
    output: ResourceOrder
    side_effects: ["status DRAFT -> SUBMITTED", "increments ResourceOrder.version by 1"]
  - method: POST
    path: "/resource-orders/{id}/assignments"
    description: "Assign contractor units to an order (order must be SUBMITTED or PARTIALLY_FILLED; contractor standing; window sanity)"
    roles: [BurnBoss]
    code: 201
    input: [contractor_id, units, window_start, window_end]
    output: CrewAssignment
    side_effects: ["status = ASSIGNED"]
  - method: GET
    path: "/resource-orders/{id}/assignments"
    description: "List assignments of an order"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CrewAssignment[]"
    side_effects: []
  - method: POST
    path: "/assignments/{id}/confirm"
    description: "Contractor confirms an assignment (capacity + 1-day-buffer window conflict checks; order fill recomputed)"
    roles: [Contractor]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status ASSIGNED -> CONFIRMED", "order confirmed_* and status recomputed", "increments CrewAssignment.version by 1"]
  - method: POST
    path: "/assignments/{id}/decline"
    description: "Contractor declines an assignment"
    roles: [Contractor]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status ASSIGNED -> DECLINED", "increments CrewAssignment.version by 1"]
  - method: POST
    path: "/assignments/{id}/release"
    description: "Author releases a confirmed assignment (order may drop FILLED -> PARTIALLY_FILLED)"
    roles: [BurnBoss]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status CONFIRMED -> RELEASED", "order confirmed_* and status recomputed", "increments CrewAssignment.version by 1"]
  - method: POST
    path: "/assignments/{id}/mark-no-show"
    description: "Author marks a confirmed assignment as no-show (increments contractor.no_show_count)"
    roles: [BurnBoss]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status CONFIRMED -> NO_SHOW", "contractor.no_show_count += 1", "order confirmed_* and status recomputed", "increments CrewAssignment.version by 1"]

  # --- Burn executions ---
  - method: POST
    path: "/burn-plans/{id}/executions"
    description: "Schedule a burn execution (pins plan version; one non-terminal execution per plan; parcel monitoring-gap rule)"
    roles: [BurnBoss]
    code: 201
    input: [scheduled_date]
    output: BurnExecution
    side_effects: ["phase = SCHEDULED", "plan_version_at_schedule = plan.version"]
  - method: GET
    path: "/executions/{id}"
    description: "Get an execution"
    roles: [Any]
    code: 200
    input: []
    output: BurnExecution
    side_effects: []
  - method: GET
    path: "/burn-plans/{id}/executions"
    description: "List executions of a plan"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "BurnExecution[]"
    side_effects: []
  - method: POST
    path: "/executions/{id}/cancel"
    description: "Cancel a scheduled execution"
    roles: [BurnBoss]
    code: 200
    input: []
    output: BurnExecution
    side_effects: ["phase SCHEDULED -> CANCELLED", "increments BurnExecution.version by 1"]
  - method: POST
    path: "/executions/{id}/brief"
    description: "Pre-burn briefing; validates pin, permit, smoke, order FILLED, ignition/contingency ACCEPTED, burn-day, lead time"
    roles: [BurnBoss]
    code: 200
    input: []
    output: BurnExecution
    side_effects: ["phase SCHEDULED -> BRIEFED", "increments BurnExecution.version by 1"]
  - method: POST
    path: "/executions/{id}/weather-observations"
    description: "Record a weather observation (execution must be non-terminal; computes in_prescription)"
    roles: [BurnBoss]
    code: 201
    input: [observed_at, wind_mph, fuel_moisture_pct, rh_pct, temp_f, mixing_height_ft]
    output: WeatherObservation
    side_effects: ["in_prescription computed per weather_prescription_check"]
  - method: GET
    path: "/executions/{id}/weather-observations"
    description: "List observations of an execution"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "WeatherObservation[]"
    side_effects: []
  - method: POST
    path: "/executions/{id}/go-no-go"
    description: "Evaluate go/no-go: checklist_answers must cover exactly the six required items {permit_verified, crew_briefed, communications_check, escape_routes_reviewed, weather_within_prescription, holding_resources_ready} each with result PASS|FAIL; all PASS plus fresh in-prescription weather and adequate holding force -> TEST_FIRE; any FAIL answer -> STOOD_DOWN"
    roles: [BurnBoss]
    code: 200
    input: [checklist_answers]
    output: GoNoGoChecklist
    side_effects: ["creates GoNoGoChecklist with computed verdict", "phase BRIEFED -> TEST_FIRE (GO) or -> STOOD_DOWN (NO_GO)", "increments BurnExecution.version by 1"]
  - method: GET
    path: "/executions/{id}/checklists"
    description: "List go/no-go checklists of an execution"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "GoNoGoChecklist[]"
    side_effects: []
  - method: POST
    path: "/executions/{id}/start-ignition"
    description: "Begin primary ignition after a passing test fire (fresh in-prescription observation required)"
    roles: [BurnBoss]
    code: 200
    input: []
    output: BurnExecution
    side_effects: ["phase TEST_FIRE -> IGNITION", "increments BurnExecution.version by 1"]
  - method: POST
    path: "/executions/{id}/complete-ignition"
    description: "Complete ignition, recording acres blackened"
    roles: [BurnBoss]
    code: 200
    input: [acres_blackened]
    output: BurnExecution
    side_effects: ["phase IGNITION -> HOLDING", "sets acres_blackened", "increments BurnExecution.version by 1"]
  - method: POST
    path: "/executions/{id}/begin-patrol"
    description: "Move from holding to patrol (no open incidents)"
    roles: [BurnBoss]
    code: 200
    input: []
    output: BurnExecution
    side_effects: ["phase HOLDING -> PATROL", "increments BurnExecution.version by 1"]
  - method: POST
    path: "/executions/{id}/begin-mop-up"
    description: "Move from patrol to mop-up (no open incidents)"
    roles: [BurnBoss]
    code: 200
    input: []
    output: BurnExecution
    side_effects: ["phase PATROL -> MOP_UP", "increments BurnExecution.version by 1"]
  - method: POST
    path: "/executions/{id}/close"
    description: "Close the burn (no open incidents); creates the three monitoring reports; completes confirmed assignments"
    roles: [BurnBoss]
    code: 200
    input: [actual_treatment_lines]
    output: BurnExecution
    side_effects: ["phase MOP_UP -> CLOSED", "sets closed_at and actual_treatment_lines", "creates MonitoringReports FIRST_24H/SEVEN_DAY/THIRTY_DAY", "CONFIRMED assignments -> COMPLETED", "increments BurnExecution.version by 1"]
  - method: POST
    path: "/executions/{id}/stand-down"
    description: "Voluntarily stand down a briefed execution"
    roles: [BurnBoss]
    code: 200
    input: []
    output: BurnExecution
    side_effects: ["phase BRIEFED -> STOOD_DOWN", "increments BurnExecution.version by 1"]
  - method: POST
    path: "/executions/{id}/declare-escape"
    description: "Declare an escape (TEST_FIRE/IGNITION/HOLDING/PATROL); creates an ESCAPE Incident"
    roles: [BurnBoss]
    code: 200
    input: []
    output: BurnExecution
    side_effects: ["phase -> ESCAPED", "creates Incident(ESCAPE, REPORTED, UNASSESSED)", "increments BurnExecution.version by 1"]

  # --- Incidents ---
  - method: POST
    path: "/executions/{id}/incidents"
    description: "Manually report an incident on an execution whose phase is in {TEST_FIRE, IGNITION, HOLDING, PATROL, ESCAPED}; incident_type must be SPOT or SMOKE_INTRUSION (ESCAPE is created only via declare-escape)"
    roles: [IncidentCommander]
    code: 201
    input: [incident_type]
    output: Incident
    side_effects: ["response_status = REPORTED", "billing_status = UNASSESSED"]
  - method: GET
    path: "/incidents/{id}"
    description: "Get an incident"
    roles: [Any]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: GET
    path: "/executions/{id}/incidents"
    description: "List incidents of an execution"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Incident[]"
    side_effects: []
  - method: POST
    path: "/incidents/{id}/confirm"
    description: "Confirm a reported incident"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Incident
    side_effects: ["response_status REPORTED -> CONFIRMED", "increments Incident.version by 1"]
  - method: POST
    path: "/incidents/{id}/dismiss"
    description: "Dismiss a reported incident (false alarm)"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Incident
    side_effects: ["response_status REPORTED -> DISMISSED", "increments Incident.version by 1"]
  - method: POST
    path: "/incidents/{id}/declare-wildfire"
    description: "Convert a confirmed incident to a wildfire response (cascade: execution -> WILDFIRE_RESPONSE, permit -> SUSPENDED, agreements -> SUSPENDED)"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Incident
    side_effects: ["response_status CONFIRMED -> DECLARED_WILDFIRE", "execution ESCAPED -> WILDFIRE_RESPONSE", "permit ISSUED -> SUSPENDED", "agreements {APPROVED, PARTIALLY_DISBURSED} -> SUSPENDED", "increments Incident.version by 1"]
  - method: POST
    path: "/incidents/{id}/mark-contained"
    description: "Mark a confirmed incident contained"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Incident
    side_effects: ["response_status CONFIRMED -> CONTAINED", "increments Incident.version by 1"]
  - method: POST
    path: "/incidents/{id}/close"
    description: "Close a contained incident"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Incident
    side_effects: ["response_status CONTAINED -> CLOSED", "increments Incident.version by 1"]
  - method: POST
    path: "/incidents/{id}/assess-costs"
    description: "Record suppression cost and escaped acres (billing axis; incident must be contained/closed/declared-wildfire)"
    roles: [IncidentCommander]
    code: 200
    input: [suppression_cost_cents, escaped_acres]
    output: Incident
    side_effects: ["billing_status UNASSESSED -> ASSESSED", "sets suppression_cost_cents and escaped_acres", "increments Incident.version by 1"]

  # --- Monitoring reports ---
  - method: GET
    path: "/monitoring-reports/{id}"
    description: "Get a monitoring report"
    roles: [Any]
    code: 200
    input: []
    output: MonitoringReport
    side_effects: []
  - method: GET
    path: "/executions/{id}/monitoring-reports"
    description: "List monitoring reports of an execution, sorted by due_at ASC"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "MonitoringReport[]"
    side_effects: []
  - method: POST
    path: "/monitoring-reports/{id}/submit"
    description: "Submit observed treatment results (computes effectiveness_score)"
    roles: [BurnBoss]
    code: 200
    input: [actual_treatment_lines]
    output: MonitoringReport
    side_effects: ["status {DUE, OVERDUE, DEFICIENT} -> SUBMITTED", "computes effectiveness_score", "increments MonitoringReport.version by 1"]
  - method: POST
    path: "/monitoring-reports/{id}/accept"
    description: "Accept a submitted report (SoD; THIRTY_DAY acceptance recomputes final_reimbursement_cents)"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: MonitoringReport
    side_effects: ["status SUBMITTED -> ACCEPTED", "THIRTY_DAY: recomputes agreement.final_reimbursement_cents", "increments MonitoringReport.version by 1"]
  - method: POST
    path: "/monitoring-reports/{id}/mark-deficient"
    description: "Mark a submitted report deficient"
    roles: [AgencyReviewer]
    code: 200
    input: [reason]
    output: MonitoringReport
    side_effects: ["status SUBMITTED -> DEFICIENT", "records deficiency_reason", "increments MonitoringReport.version by 1"]

  # --- Cost-share agreements ---
  - method: POST
    path: "/cost-share-agreements"
    description: "Landowner applies for cost-share (plan must be APPROVED; parcel ownership must match; landowner in good standing)"
    roles: [Landowner]
    code: 201
    input: [landowner_id, burn_plan_id, funding_tier, treatment_lines]
    output: CostShareAgreement
    side_effects: ["status = SUBMITTED", "provisional_estimate_cents computed (per-line round then sum)"]
  - method: GET
    path: "/cost-share-agreements/{id}"
    description: "Get an agreement"
    roles: [Any]
    code: 200
    input: []
    output: CostShareAgreement
    side_effects: []
  - method: GET
    path: "/cost-share-agreements"
    description: "List agreements (paginated; filters)"
    roles: [Any]
    code: 200
    input: ["landowner_id?", "burn_plan_id?", "status?", "limit?", "offset?"]
    output: "CostShareAgreement[]"
    side_effects: []
  - method: POST
    path: "/cost-share-agreements/{id}/begin-review"
    description: "Move an application to review"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: CostShareAgreement
    side_effects: ["status SUBMITTED -> UNDER_REVIEW", "increments CostShareAgreement.version by 1"]
  - method: POST
    path: "/cost-share-agreements/{id}/approve"
    description: "Approve an application (SoD vs landowner; sets approved_at/expires_at)"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: CostShareAgreement
    side_effects: ["status UNDER_REVIEW -> APPROVED", "sets approved_at, expires_at", "increments CostShareAgreement.version by 1"]
  - method: POST
    path: "/cost-share-agreements/{id}/deny"
    description: "Deny an application"
    roles: [AssociationAdmin]
    code: 200
    input: [reason]
    output: CostShareAgreement
    side_effects: ["status UNDER_REVIEW -> DENIED", "increments CostShareAgreement.version by 1"]
  - method: POST
    path: "/cost-share-agreements/{id}/disburse"
    description: "Disburse the currently-due installment (provisional after execution CLOSED; final after THIRTY_DAY ACCEPTED); debits association fund"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: CostShareAgreement
    side_effects: ["computes and pays the due installment (negative final installment = clawback: fund is credited)", "disbursed_cents += installment", "fund_balance_cents -= installment", "status APPROVED -> PARTIALLY_DISBURSED or PARTIALLY_DISBURSED -> FULLY_DISBURSED", "increments CostShareAgreement.version by 1"]
  - method: POST
    path: "/cost-share-agreements/{id}/reinstate"
    description: "Reinstate a suspended agreement (claims resolved, permit ISSUED); target APPROVED if nothing disbursed else PARTIALLY_DISBURSED"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: CostShareAgreement
    side_effects: ["status SUSPENDED -> APPROVED | PARTIALLY_DISBURSED", "increments CostShareAgreement.version by 1"]
  - method: POST
    path: "/cost-share-agreements/{id}/cancel"
    description: "Cancel an agreement before final disbursement"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: CostShareAgreement
    side_effects: ["status -> CANCELLED", "increments CostShareAgreement.version by 1"]

  # --- Liability claims ---
  - method: POST
    path: "/incidents/{id}/liability-claims"
    description: "File a liability claim on an ASSESSED incident (billing -> BILLED)"
    roles: [IncidentCommander]
    code: 201
    input: []
    output: LiabilityClaim
    side_effects: ["status = FILED", "outcome = PENDING", "copies total_suppression_cost_cents from incident", "incident.billing_status ASSESSED -> BILLED"]
  - method: GET
    path: "/liability-claims/{id}"
    description: "Get a liability claim"
    roles: [Any]
    code: 200
    input: []
    output: LiabilityClaim
    side_effects: []
  - method: GET
    path: "/incidents/{id}/liability-claims"
    description: "List liability claims of an incident"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "LiabilityClaim[]"
    side_effects: []
  - method: POST
    path: "/liability-claims/{id}/begin-investigation"
    description: "Begin investigation"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: LiabilityClaim
    side_effects: ["status FILED -> UNDER_INVESTIGATION", "increments LiabilityClaim.version by 1"]
  - method: POST
    path: "/liability-claims/{id}/adjudicate"
    description: "Adjudicate with outcome (LANDOWNER_LIABLE | ASSOCIATION_LIABLE | NOT_LIABLE) and negligence finding; computes allocation"
    roles: [AssociationAdmin]
    code: 200
    input: [outcome, negligence_found]
    output: LiabilityClaim
    side_effects: ["status UNDER_INVESTIGATION -> ADJUDICATED | DISMISSED", "computes landowner_share_cents / association_share_cents per variant", "LANDOWNER_LIABLE: landowner.outstanding_liability_cents += share", "sets adjudicated_at", "increments LiabilityClaim.version by 1"]
  - method: POST
    path: "/liability-claims/{id}/pay"
    description: "Pay a claim from the fund per fund_payout_with_cap (billing -> SETTLED)"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: LiabilityClaim
    side_effects: ["computes fund_payout_cents (pre-debit balance cap rule)", "fund_balance_cents -= fund_payout_cents", "incident.billing_status -> SETTLED", "status -> PAID", "increments LiabilityClaim.version by 1"]
  - method: POST
    path: "/liability-claims/{id}/reverse-payment"
    description: "Reverse a paid claim (restores fund exactly; billing -> DISPUTED)"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: LiabilityClaim
    side_effects: ["fund_balance_cents += fund_payout_cents", "incident.billing_status SETTLED -> DISPUTED", "status PAID -> PAYMENT_REVERSED", "increments LiabilityClaim.version by 1"]
  - method: POST
    path: "/liability-claims/{id}/close"
    description: "Close a paid or reversed claim"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: LiabilityClaim
    side_effects: ["status -> CLOSED", "increments LiabilityClaim.version by 1"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own/target the resource (plan author, landowner, contractor mismatch)" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Approver/reviewer is the same identity as the plan author (or agreement landowner)" }
  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource not found" }
  - { id: ERR_ASSOCIATION_NOT_FOUND, http: 404, condition: "Association id not found" }
  - { id: ERR_LANDOWNER_NOT_FOUND, http: 404, condition: "Landowner id not found" }
  - { id: ERR_PARCEL_NOT_FOUND, http: 404, condition: "Parcel id not found" }
  - { id: ERR_BOSS_NOT_FOUND, http: 404, condition: "BurnBoss id not found" }
  - { id: ERR_CONTRACTOR_NOT_FOUND, http: 404, condition: "Contractor id not found" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "BurnPlan id not found" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "BurnPermit id not found" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "PermitNotification id not found" }
  - { id: ERR_SMOKE_APPROVAL_NOT_FOUND, http: 404, condition: "SmokeApproval id not found" }
  - { id: ERR_CONTINGENCY_NOT_FOUND, http: 404, condition: "ContingencyPlan id not found" }
  - { id: ERR_IGNITION_PLAN_NOT_FOUND, http: 404, condition: "IgnitionPlan id not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "ResourceOrder id not found" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "CrewAssignment id not found" }
  - { id: ERR_EXECUTION_NOT_FOUND, http: 404, condition: "BurnExecution id not found" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "Incident id not found" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "MonitoringReport id not found" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "CostShareAgreement id not found" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "LiabilityClaim id not found" }
  # --- Input shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, unknown field, type mismatch, treatment_lines empty or acres not summing to planned_acres" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value outside declared member set" }
  - { id: ERR_INVALID_PRESCRIPTION_PARAMS, http: 400, condition: "Prescription range inverted (min > max), window_end < window_start, non-positive acres" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  # --- State ---
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Plan must be DRAFT (submit)" }
  - { id: ERR_PLAN_NOT_SUBMITTED, http: 409, condition: "Plan must be SUBMITTED (approve, request-revision)" }
  - { id: ERR_PLAN_NOT_IN_REVISION, http: 409, condition: "Plan must be REVISION_REQUESTED (revise)" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "Plan must be APPROVED (permit issue, agreement create, execution schedule, smoke create, ignition/contingency/order create)" }
  - { id: ERR_PLAN_NOT_CANCELLABLE, http: 409, condition: "Plan is terminal and cannot be cancelled" }
  - { id: ERR_PERMIT_NOT_UNDER_REVIEW, http: 409, condition: "Permit must be UNDER_REVIEW (issue, deny)" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 409, condition: "Permit must be ISSUED (brief, suspend, agreement reinstate)" }
  - { id: ERR_PERMIT_NOT_SUSPENDED, http: 409, condition: "Permit must be SUSPENDED (reinstate)" }
  - { id: ERR_PERMIT_NOT_REVOKABLE, http: 409, condition: "Permit must be ISSUED or SUSPENDED (revoke)" }
  - { id: ERR_NOTIFICATION_NOT_REQUESTED, http: 409, condition: "Notification must be REQUESTED (confirm)" }
  - { id: ERR_SMOKE_NOT_SUBMITTED, http: 409, condition: "SmokeApproval must be SUBMITTED (decide)" }
  - { id: ERR_SMOKE_NOT_CONDITIONAL, http: 409, condition: "SmokeApproval must be CONDITIONALLY_APPROVED (clear-conditions)" }
  - { id: ERR_SMOKE_NOT_WITHDRAWABLE, http: 409, condition: "SmokeApproval must be APPROVED or CONDITIONALLY_APPROVED (withdraw)" }
  - { id: ERR_SMOKE_APPROVAL_NOT_VALID, http: 409, condition: "No APPROVED/CONDITIONALLY_APPROVED smoke approval for the plan matching scheduled_date (brief)" }
  - { id: ERR_CONTINGENCY_NOT_DRAFT, http: 409, condition: "ContingencyPlan must be DRAFT (accept, reject)" }
  - { id: ERR_CONTINGENCY_NOT_REJECTED, http: 409, condition: "ContingencyPlan must be REJECTED (revise)" }
  - { id: ERR_CONTINGENCY_NOT_ACCEPTED, http: 409, condition: "No ACCEPTED contingency plan for the plan (permit issue, brief)" }
  - { id: ERR_IGNITION_PLAN_NOT_DRAFT, http: 409, condition: "IgnitionPlan must be DRAFT (accept, reject)" }
  - { id: ERR_IGNITION_PLAN_NOT_REJECTED, http: 409, condition: "IgnitionPlan must be REJECTED (revise)" }
  - { id: ERR_IGNITION_PLAN_NOT_ACCEPTED, http: 409, condition: "No ACCEPTED ignition plan for the plan (brief)" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "ResourceOrder must be DRAFT (submit)" }
  - { id: ERR_ORDER_NOT_OPEN, http: 409, condition: "ResourceOrder must be SUBMITTED or PARTIALLY_FILLED (assignment create)" }
  - { id: ERR_ASSIGNMENT_NOT_ASSIGNED, http: 409, condition: "CrewAssignment must be ASSIGNED (confirm, decline)" }
  - { id: ERR_ASSIGNMENT_NOT_CONFIRMED, http: 409, condition: "CrewAssignment must be CONFIRMED (release, mark-no-show)" }
  - { id: ERR_EXECUTION_NOT_SCHEDULED, http: 409, condition: "BurnExecution must be SCHEDULED (brief, cancel)" }
  - { id: ERR_EXECUTION_NOT_BRIEFED, http: 409, condition: "BurnExecution must be BRIEFED (go-no-go, stand-down)" }
  - { id: ERR_EXECUTION_NOT_IN_TEST_FIRE, http: 409, condition: "BurnExecution must be TEST_FIRE (start-ignition)" }
  - { id: ERR_EXECUTION_NOT_IGNITING, http: 409, condition: "BurnExecution must be IGNITION (complete-ignition)" }
  - { id: ERR_EXECUTION_NOT_HOLDING, http: 409, condition: "BurnExecution must be HOLDING (begin-patrol)" }
  - { id: ERR_EXECUTION_NOT_PATROLLING, http: 409, condition: "BurnExecution must be PATROL (begin-mop-up)" }
  - { id: ERR_EXECUTION_NOT_MOPPING_UP, http: 409, condition: "BurnExecution must be MOP_UP (close)" }
  - { id: ERR_EXECUTION_NOT_ESCAPABLE, http: 409, condition: "BurnExecution must be in TEST_FIRE, IGNITION, HOLDING, or PATROL (declare-escape)" }
  - { id: ERR_EXECUTION_ALREADY_OPEN, http: 409, condition: "Plan already has a non-terminal execution" }
  - { id: ERR_OPEN_INCIDENTS_EXIST, http: 409, condition: "Incidents in REPORTED or CONFIRMED block patrol/mop-up/close" }
  - { id: ERR_INCIDENT_NOT_REPORTED, http: 409, condition: "Incident response_status must be REPORTED (confirm, dismiss)" }
  - { id: ERR_INCIDENT_NOT_CONFIRMED, http: 409, condition: "Incident response_status must be CONFIRMED (mark-contained, declare-wildfire)" }
  - { id: ERR_INCIDENT_NOT_CONTAINED, http: 409, condition: "Incident response_status must be CONTAINED (close)" }
  - { id: ERR_INCIDENT_NOT_COSTABLE, http: 409, condition: "Incident response_status must be CONTAINED, CLOSED, or DECLARED_WILDFIRE (assess-costs)" }
  - { id: ERR_BILLING_NOT_UNASSESSED, http: 409, condition: "Incident billing_status must be UNASSESSED (assess-costs)" }
  - { id: ERR_BILLING_NOT_ASSESSED, http: 409, condition: "Incident billing_status must be ASSESSED (liability-claim create)" }
  - { id: ERR_REPORT_NOT_SUBMITTABLE, http: 409, condition: "MonitoringReport must be DUE, OVERDUE, or DEFICIENT (submit)" }
  - { id: ERR_REPORT_NOT_SUBMITTED, http: 409, condition: "MonitoringReport must be SUBMITTED (accept, mark-deficient)" }
  - { id: ERR_AGREEMENT_NOT_SUBMITTED, http: 409, condition: "Agreement must be SUBMITTED (begin-review)" }
  - { id: ERR_AGREEMENT_NOT_UNDER_REVIEW, http: 409, condition: "Agreement must be UNDER_REVIEW (approve, deny)" }
  - { id: ERR_AGREEMENT_NOT_APPROVED, http: 409, condition: "Agreement must be APPROVED (first disburse)" }
  - { id: ERR_AGREEMENT_NOT_PARTIALLY_DISBURSED, http: 409, condition: "Agreement must be PARTIALLY_DISBURSED (final disburse)" }
  - { id: ERR_AGREEMENT_NOT_SUSPENDED, http: 409, condition: "Agreement must be SUSPENDED (reinstate)" }
  - { id: ERR_AGREEMENT_NOT_CANCELLABLE, http: 409, condition: "Agreement must be SUBMITTED, UNDER_REVIEW, or APPROVED (cancel)" }
  - { id: ERR_CLAIM_NOT_FILED, http: 409, condition: "LiabilityClaim must be FILED (begin-investigation)" }
  - { id: ERR_CLAIM_NOT_UNDER_INVESTIGATION, http: 409, condition: "LiabilityClaim must be UNDER_INVESTIGATION (adjudicate)" }
  - { id: ERR_CLAIM_NOT_ADJUDICATED, http: 409, condition: "LiabilityClaim must be ADJUDICATED or PAYMENT_REVERSED (pay)" }
  - { id: ERR_CLAIM_NOT_PAID, http: 409, condition: "LiabilityClaim must be PAID (reverse-payment)" }
  - { id: ERR_CLAIM_NOT_CLOSABLE, http: 409, condition: "LiabilityClaim must be PAID or PAYMENT_REVERSED (close)" }
  # --- Business ---
  - { id: ERR_ACTIVE_PLAN_EXISTS_FOR_PARCEL, http: 409, condition: "Parcel already has a plan in DRAFT, SUBMITTED, REVISION_REQUESTED, or APPROVED" }
  - { id: ERR_PERMIT_ALREADY_OPEN, http: 409, condition: "Plan already has a permit in UNDER_REVIEW, ISSUED, or SUSPENDED" }
  - { id: ERR_CONTINGENCY_ALREADY_ACCEPTED, http: 409, condition: "Another contingency plan for the plan is already ACCEPTED" }
  - { id: ERR_ACTIVE_AGREEMENT_EXISTS_FOR_PLAN, http: 409, condition: "Plan already has a CostShareAgreement in SUBMITTED, UNDER_REVIEW, APPROVED, PARTIALLY_DISBURSED, or SUSPENDED" }
  - { id: ERR_CONTRACTOR_WINDOW_CONFLICT, http: 409, condition: "Contractor has an ASSIGNED/CONFIRMED assignment whose window (with 1-day rest buffer) collides" }
  - { id: ERR_CONTRACTOR_CAPACITY_EXCEEDED, http: 409, condition: "Assignment units exceed contractor.available_units" }
  - { id: ERR_CONTRACTOR_SUSPENDED, http: 403, condition: "Contractor standing is SUSPENDED (no_show_count >= 2)" }
  - { id: ERR_LANDOWNER_NOT_IN_GOOD_STANDING, http: 403, condition: "Landowner standing is SUSPENDED (unpaid adjudicated liability older than 30 days)" }
  - { id: ERR_LANDOWNER_WAIVER_UNSIGNED, http: 403, condition: "liability_waiver_signed must be true to register parcels" }
  - { id: ERR_BOSS_CERTIFICATION_INSUFFICIENT, http: 403, condition: "Author certification tier does not cover planned_acres / hazard_score" }
  - { id: ERR_PARCEL_OWNERSHIP_MISMATCH, http: 409, condition: "Agreement landowner_id does not own the plan's parcel" }
  - { id: ERR_STALE_PLAN_VERSION, http: 409, condition: "execution.plan_version_at_schedule != plan.version at brief (plan changed since scheduling)" }
  - { id: ERR_WRONG_BURN_DAY, http: 422, condition: "Current clock date != execution.scheduled_date (brief)" }
  - { id: ERR_NOTIFICATION_LEAD_TIME_UNMET, http: 422, condition: "Fewer than 48 hours since the last confirmed notification (brief)" }
  - { id: ERR_NOTIFICATIONS_INCOMPLETE, http: 409, condition: "notifications_completed < notifications_required (permit issue)" }
  - { id: ERR_WEATHER_OBSERVATION_STALE, http: 422, condition: "No observation or latest observation older than 60 minutes (go-no-go, start-ignition)" }
  - { id: ERR_WEATHER_OUT_OF_PRESCRIPTION, http: 422, condition: "Latest observation outside the plan's prescription window" }
  - { id: ERR_INCOMPLETE_CHECKLIST, http: 422, condition: "checklist_answers missing required items or invalid result values" }
  - { id: ERR_HOLDING_FORCE_INADEQUATE, http: 422, condition: "Confirmed units per type below required_* (brief, go-no-go)" }
  - { id: ERR_AIRSHED_CAPACITY_EXCEEDED, http: 409, condition: "Airshed daily approved acres would exceed airshed_daily_acres_cap" }
  - { id: ERR_PLAN_WINDOW_LAPSED, http: 422, condition: "Plan window end before current date (permit issue)" }
  - { id: ERR_SCHEDULED_DATE_OUTSIDE_WINDOW, http: 422, condition: "scheduled_date outside [planned_window_start, planned_window_end]" }
  - { id: ERR_PARCEL_EXECUTION_WINDOW_CONFLICT, http: 409, condition: "Another execution on the parcel is non-terminal, or scheduled_date <= prior CLOSED execution's closed_at + 30 days" }
  - { id: ERR_AGREEMENT_EXPIRED, http: 422, condition: "Current clock beyond agreement.expires_at (disburse)" }
  - { id: ERR_NO_CLOSED_EXECUTION, http: 409, condition: "No CLOSED execution on the plan (first disbursement gate)" }
  - { id: ERR_MONITORING_NOT_ACCEPTED, http: 409, condition: "THIRTY_DAY report not ACCEPTED (final disbursement gate)" }
  - { id: ERR_NO_DISBURSEMENT_DUE, http: 402, condition: "Computed installment is zero or already fully disbursed" }
  - { id: ERR_INSUFFICIENT_ASSOCIATION_FUNDS, http: 402, condition: "Fund balance below the installment, or computed liability payout is zero while association share is positive" }
  - { id: ERR_CLAIMS_NOT_RESOLVED, http: 409, condition: "Liability claims on the plan's executions are not all CLOSED/DISMISSED/PAYMENT_REVERSED (reinstate)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: AssociationAdmin
    description: "Association staff: registry management, fund administration, cost-share and liability adjudication"
    identity: opaque
    exclusive_operations:
      - "POST /associations, POST /associations/{id}/fund-deposits, POST /_clock/set_current_utc"
      - "POST /landowners, POST /burn-bosses, POST /contractors"
      - "POST /cost-share-agreements/{id}/begin-review|approve|deny|disburse|reinstate|cancel"
      - "POST /liability-claims/{id}/begin-investigation|adjudicate|pay|reverse-payment|close"
    shared_operations: ["all GET endpoints"]
  - name: Landowner
    description: "Landowner applying for burns and cost-share on their own parcels"
    identity: "entity_backed:Landowner"
    exclusive_operations:
      - "POST /parcels (landowner_id must equal X-User-ID)"
      - "POST /cost-share-agreements (landowner_id must equal X-User-ID)"
    shared_operations: ["all GET endpoints"]
  - name: BurnBoss
    description: "Certified burn boss authoring plans and leading executions on their own plans"
    identity: "entity_backed:BurnBoss"
    exclusive_operations:
      - "POST /burn-plans and plan lifecycle actions (submit, revise, cancel) on authored plans"
      - "permit request, notifications record/confirm, smoke/contingency/ignition/resource-order creation, ignition/contingency revise"
      - "execution schedule and all burn-day action endpoints, weather observations, monitoring submit"
    shared_operations: ["all GET endpoints"]
  - name: AgencyReviewer
    description: "Agency reviewer; also a certified burn boss acting in review capacity (segregated from own authored plans)"
    identity: "entity_backed:BurnBoss"
    exclusive_operations:
      - "POST /burn-plans/{id}/approve|request-revision"
      - "POST /permits/{id}/issue|deny|suspend|reinstate|revoke"
      - "POST /contingency-plans/{id}/accept|reject, POST /ignition-plans/{id}/accept|reject"
      - "POST /monitoring-reports/{id}/accept|mark-deficient"
    shared_operations: ["all GET endpoints"]
  - name: AirQualityOfficer
    description: "Air quality regulator deciding smoke management approvals"
    identity: opaque
    exclusive_operations:
      - "POST /smoke-approvals/{id}/decide|withdraw|clear-conditions"
    shared_operations: ["all GET endpoints"]
  - name: IncidentCommander
    description: "Incident commander running escape/wildfire response and suppression cost assessment"
    identity: opaque
    exclusive_operations:
      - "POST /executions/{id}/incidents"
      - "POST /incidents/{id}/confirm|dismiss|declare-wildfire|mark-contained|close|assess-costs"
      - "POST /incidents/{id}/liability-claims"
    shared_operations: ["all GET endpoints"]
  - name: Contractor
    description: "Crew contractor confirming or declining their own assignments"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /assignments/{id}/confirm|decline (contractor_id must equal X-User-ID)"
    shared_operations: ["all GET endpoints"]
  - name: Any
    description: "Any authenticated role may read"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
