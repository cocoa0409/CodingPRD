      - "releases every CurtailmentOrder of this turbine in state ACTIVE and sets active_curtailment_count to 0"
      - "decrements WindFarm.turbine_count by 1 and subtracts TurbineModel.rated_power_kw from WindFarm.installed_capacity_kw"
