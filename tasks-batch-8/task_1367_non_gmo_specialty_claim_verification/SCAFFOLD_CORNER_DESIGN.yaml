        claim_type: immediate_consistency
        grounds: ["complexity_profile", "entities.Ingredient.fields.is_exempt"]
        distinguishing_aspect: "Immediate consistency: the POST /ingredients response body itself carries the computed flags (is_exempt, requires_pcr, requires_affidavit, compliance_status) — no re-fetch is needed to observe the derivation."
        test_recipe:
          setup: ["standard (exemption 0.5) and DRAFT product exist"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 30.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ex: $.data.is_exempt, rp: $.data.requires_pcr, ra: $.data.requires_affidavit, cs: $.data.compliance_status } }
          assert:
