# =============================================================================
# PRD Benchmark Scaffold — Provider Enrollment & Payer Roster Synchronization
# =============================================================================

scenario: |
  Provider Enrollment & Payer Roster Synchronization (medical group payer
  enrollment): enrollment application by payer & effective date tracking,
  CAQH profile attestation cycle, group vs individual enrollment &
  reassignment of benefits, revalidation deadlines (Medicare) & deactivation
  risk, roster file submission & payer confirmation reconciliation, claims
  hold for pending enrollment, delegated credentialing arrangement,
  terminations & retro-effective billing

domain_name: provider-enrollment-roster-sync
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - ops_run_checkpoint        # logical clock sweep drives CAQH lapse, revalidation window, deactivation, agreement expiry
    - cascading_side_effects    # termination cascades: provider -> records -> claims -> balances
    - dual_variant_calculation  # effective-date policies; gross-impact vs net-recoupment
    - optimistic_concurrency    # OCC on DelegatedCredentialingAgreement.version for roster supersession
  entity_topology: flat         # peer entities joined by FK references; no URL nesting except sub-resource reads
  state_machine_shape: cyclic   # application info-request loop, CAQH attestation loop, revalidation loop
  relationship_patterns:
    - many_to_many              # Provider x Payer via EnrollmentApplication / EnrollmentRecord
    - cross_aggregate           # RosterLine -> Provider, Claim -> Provider+Payer
  role_model: segregation_of_duties  # roster submitter cannot reconcile own roster
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: PracticeGroup
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Practice group legal name" }
      - { name: tax_id, type: string, source: input, description: "Group federal tax identifier" }
      - { name: group_npi, type: string, source: input, description: "Group NPI (type-2)" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: practice_group_id, type: string, source: system, description: "FK -> PracticeGroup.id; owning group from creation path" }
      - { name: npi, type: string, source: input, description: "Individual NPI (type-1); unique across all providers", constraints: "unique; duplicate -> ERR_DUPLICATE_NPI" }
      - { name: full_name, type: string, source: input, description: "Provider full name" }
      - { name: specialty, type: string, source: input, description: "Primary specialty" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | TERMINATED" }
      - { name: termination_date, type: string, source: system, default: null, description: "Termination effective date (may be retroactive); null while ACTIVE" }
      - { name: termination_reason, type: string, source: system, default: null, description: "Reason recorded at termination" }
      - { name: recoupment_balance_cents, type: integer, source: computed, default: 0, description: "Outstanding recoupment = sum(amount_cents + recoupment_fee_cents) over this provider's RECOUPED claims" }

  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: payer_code, type: string, source: input, description: "Payer code" }
      - { name: name, type: string, source: input, description: "Payer display name" }
      - { name: is_medicare, type: boolean, source: input, description: "Medicare payer: revalidation due date snaps to end of calendar month" }
      - { name: effective_date_policy, type: enum, source: input, description: "APPROVAL_DATE | RETRO_90 — governs enrollment effective-date calculation" }
      - { name: claims_hold_enabled, type: boolean, source: input, description: "If false, uncovered claims are DENIED at receipt instead of HELD" }
      - { name: revalidation_interval_days, type: integer, source: input, description: "Days between revalidations (Medicare default 1825)" }

  - name: CAQHProfile
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; exactly one profile per provider, auto-created with provider" }
      - { name: status, type: enum, source: system, default: NEVER_ATTESTED, description: "NEVER_ATTESTED | ATTESTED | DUE | LAPSED" }
      - { name: last_attested_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of latest attestation" }
      - { name: due_at, type: datetime, source: computed, default: null, description: "= last_attested_at + 120 days" }

  - name: EnrollmentApplication
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id" }
      - { name: enrollment_scope, type: enum, source: input, description: "GROUP_LINK | INDIVIDUAL" }
      - { name: requested_effective_date, type: string, source: input, description: "Requested effective date (YYYY-MM-DD); must be >= current date - 90 days" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | PENDING_INFO | APPROVED | REJECTED | WITHDRAWN" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of latest submit/resubmit" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of approval" }
      - { name: info_request_reason, type: string, source: system, default: null, description: "Reason recorded by payer on request-info" }
      - { name: decision_reason, type: string, source: system, default: null, description: "Reason recorded on reject" }

  - name: EnrollmentRecord
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; copied from source application or roster line" }
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id; copied from source application or roster line" }
      - { name: source_application_id, type: string, source: system, default: null, description: "FK -> EnrollmentApplication.id; set when created via application approval" }
      - { name: source_roster_line_id, type: string, source: system, default: null, description: "FK -> RosterLine.id; set when created via delegated roster confirmation" }
      - { name: enrollment_scope, type: enum, source: system, description: "GROUP_LINK | INDIVIDUAL; copied from source" }
      - { name: benefit_assignment, type: enum, source: system, description: "GROUP | INDIVIDUAL; GROUP = benefits reassigned to the practice group" }
      - { name: effective_date, type: string, source: computed, description: "Per enrollment_effective_date calculation" }
      - { name: termination_date, type: string, source: system, default: null, description: "Termination effective date; may be retroactive" }
      - { name: last_revalidation_completed_at, type: datetime, source: system, description: "Baseline for revalidation schedule; = activation timestamp initially" }
      - { name: revalidation_due_date, type: string, source: computed, description: "Per revalidation_schedule calculation" }
      - { name: revalidation_window_start, type: string, source: computed, description: "= revalidation_due_date - 60 days" }
      - { name: gross_impacted_cents, type: integer, source: computed, default: 0, description: "Gross-impact variant of retro recoupment: principal of HELD->DENIED + RELEASED->RECOUPED claims" }
      - { name: net_recouped_cents, type: integer, source: computed, default: 0, description: "Net-recoupment variant: sum(amount + per-claim fee) over RECOUPED claims only" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | PENDING_REVALIDATION | DEACTIVATED | TERMINATED" }

  - name: DelegatedCredentialingAgreement
    parent: null
    common_fields: true
    fields:
      - { name: practice_group_id, type: string, source: input, description: "FK -> PracticeGroup.id" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id" }
      - { name: effective_date, type: string, source: input, description: "Agreement start (YYYY-MM-DD); closed interval lower bound" }
      - { name: expiry_date, type: string, source: input, description: "Agreement end (YYYY-MM-DD); closed interval upper bound, must be > effective_date" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED | TERMINATED" }

  - name: RosterFile
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> DelegatedCredentialingAgreement.id" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting EnrollmentSpecialist (drives segregation-of-duties on reconcile)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }
      - { name: status, type: enum, source: computed, default: SUBMITTED, description: "SUBMITTED | CONFIRMED | PARTIALLY_CONFIRMED | RECONCILED | SUPERSEDED; derived from line rollup except RECONCILED (manual) and SUPERSEDED (system)" }
      - { name: total_lines, type: integer, source: computed, description: "Count of all lines in the file" }
      - { name: pending_count, type: integer, source: computed, description: "Lines in PENDING" }
      - { name: confirmed_count, type: integer, source: computed, description: "Lines in CONFIRMED" }
      - { name: rejected_count, type: integer, source: computed, description: "Lines in REJECTED" }
      - { name: discrepancy_count, type: integer, source: computed, description: "Lines in DISCREPANCY" }
      - { name: superseded_count, type: integer, source: computed, description: "Lines in SUPERSEDED" }

  - name: RosterLine
    parent: null
    common_fields: true
    fields:
      - { name: roster_file_id, type: string, source: system, description: "FK -> RosterFile.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: line_index, type: integer, source: system, description: "0-based position within the file, assigned at submission in request order" }
      - { name: action, type: enum, source: input, description: "ADD | TERM" }
      - { name: enrollment_scope, type: enum, source: input, description: "GROUP_LINK | INDIVIDUAL (ADD only)" }
      - { name: benefit_assignment, type: enum, source: input, description: "GROUP | INDIVIDUAL (ADD only)" }
      - { name: expected_effective_date, type: string, source: input, description: "Expected effective (ADD) or termination (TERM) date; must be >= current date - 90 days" }
      - { name: confirmed_effective_date, type: string, source: system, default: null, description: "Date confirmed by payer; mismatch vs expected puts line in DISCREPANCY" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | CONFIRMED | REJECTED | DISCREPANCY | SUPERSEDED" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Reason recorded on payer rejection or specialist decline" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id" }
      - { name: service_date, type: string, source: input, description: "Date of service (YYYY-MM-DD); must be <= current logical date" }
      - { name: amount_cents, type: integer, source: input, description: "Billed amount in cents; must be > 0" }
      - { name: status, type: enum, source: system, description: "RELEASED | HELD | DENIED | RECOUPED; initial value computed by claim_hold_evaluation at creation" }
      - { name: denial_reason, type: enum, source: system, default: null, description: "PAYER_HOLD_DISABLED | ENROLLMENT_TERMINATED | ENROLLMENT_DEACTIVATED" }
      - { name: recoupment_fee_cents, type: integer, source: computed, default: 0, description: "Per-claim recovery fee = round_half_up(amount_cents * 0.02); set on recoup, reset to 0 on reversal" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Provider
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/providers/{id}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
          - "Every EnrollmentRecord of this provider in {ACTIVE, PENDING_REVALIDATION} has effective_date <= termination_effective_date (else ERR_TERMINATION_DATE_INVALID)"
        side_effects:
          - "termination_date and termination_reason recorded on provider"
          - "Cascade 1 (depth 3): each EnrollmentRecord in {ACTIVE, PENDING_REVALIDATION} -> TERMINATED with termination_date = termination_effective_date; each such record termination itself fires the record-termination cascade (HELD claims -> DENIED with ENROLLMENT_TERMINATED; RELEASED claims with service_date >= termination_date -> RECOUPED with per-claim fee); each claim recoupment itself increments provider.recoupment_balance_cents by (amount_cents + recoupment_fee_cents)"
          - "Each remaining HELD claim of this provider with no covering record -> DENIED with ENROLLMENT_TERMINATED"
          - "Each EnrollmentApplication of this provider in {DRAFT, SUBMITTED, PENDING_INFO} -> WITHDRAWN (system actor)"

  - entity: CAQHProfile
    initial_state: NEVER_ATTESTED
    terminal_states: []
    transitions:
      - from: NEVER_ATTESTED
        to: ATTESTED
        trigger: "POST /api/caqh-profiles/{id}/attest"
        actor: Provider
        preconditions:
          - "X-User-ID == profile.provider_id (else ERR_PROFILE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "last_attested_at = current logical clock"
          - "due_at = last_attested_at + 120 days"
      - from: ATTESTED
        to: ATTESTED
        trigger: "POST /api/caqh-profiles/{id}/attest"
        actor: Provider
        preconditions:
          - "X-User-ID == profile.provider_id (else ERR_PROFILE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "last_attested_at = current logical clock; due_at recomputed (cycle reset)"
      - from: DUE
        to: ATTESTED
        trigger: "POST /api/caqh-profiles/{id}/attest"
        actor: Provider
        preconditions:
          - "X-User-ID == profile.provider_id (else ERR_PROFILE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "last_attested_at = current logical clock; due_at recomputed"
      - from: LAPSED
        to: ATTESTED
        trigger: "POST /api/caqh-profiles/{id}/attest"
        actor: Provider
        preconditions:
          - "X-User-ID == profile.provider_id (else ERR_PROFILE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "last_attested_at = current logical clock; due_at recomputed (cycle restart after lapse)"
      - from: ATTESTED
        to: DUE
        trigger: "system (clock sweep on POST /api/_clock/set_current_utc)"
        actor: system
        preconditions:
          - "due_at - 30 days <= current logical clock <= due_at"
        side_effects: []
      - from: ATTESTED
        to: LAPSED
        trigger: "system (clock sweep)"
        actor: system
        preconditions:
          - "current logical clock > due_at (strictly greater; at exactly due_at the profile is DUE, not LAPSED)"
        side_effects: []
      - from: DUE
        to: LAPSED
        trigger: "system (clock sweep)"
        actor: system
        preconditions:
          - "current logical clock > due_at"
        side_effects: []
    note: "Cyclic machine: ATTESTED -> DUE -> LAPSED -> ATTESTED loops indefinitely."

  - entity: EnrollmentApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/enrollment-applications/{id}/submit"
        actor: EnrollmentSpecialist
        preconditions:
          - "provider.status == ACTIVE (else ERR_PROVIDER_TERMINATED)"
          - "provider's CAQHProfile.status in {ATTESTED, DUE} (else ERR_CAQH_ATTESTATION_NOT_CURRENT)"
        side_effects:
          - "submitted_at = current logical clock"
      - from: SUBMITTED
        to: PENDING_INFO
        trigger: "POST /api/enrollment-applications/{id}/request-info"
        actor: PayerRepresentative
        preconditions: []
        side_effects:
          - "info_request_reason recorded from request body"
      - from: PENDING_INFO
        to: SUBMITTED
        trigger: "POST /api/enrollment-applications/{id}/resubmit"
        actor: EnrollmentSpecialist
        preconditions:
          - "provider.status == ACTIVE (else ERR_PROVIDER_TERMINATED)"
          - "provider's CAQHProfile.status in {ATTESTED, DUE} (else ERR_CAQH_ATTESTATION_NOT_CURRENT)"
        side_effects:
          - "submitted_at = current logical clock (cycle: SUBMITTED -> PENDING_INFO -> SUBMITTED may repeat)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/enrollment-applications/{id}/approve"
        actor: PayerRepresentative
        preconditions:
          - "provider.status == ACTIVE (else ERR_PROVIDER_TERMINATED)"
          - "provider's CAQHProfile.status in {ATTESTED, DUE} at approval time (else ERR_CAQH_ATTESTATION_NOT_CURRENT)"
          - "No EnrollmentRecord in {ACTIVE, PENDING_REVALIDATION} exists for (provider_id, payer_id) (else ERR_ENROLLMENT_OVERLAP)"
          - "Computed effective_date must not fall inside any TERMINATED record's half-open interval [effective_date, termination_date) for (provider_id, payer_id); effective_date == prior termination_date is allowed (else ERR_ENROLLMENT_OVERLAP)"
        side_effects:
          - "approved_at = current logical clock"
          - "Create EnrollmentRecord: status ACTIVE, source_application_id = this application, enrollment_scope copied, benefit_assignment = GROUP when enrollment_scope == GROUP_LINK else INDIVIDUAL, effective_date per enrollment_effective_date calculation, last_revalidation_completed_at = approved_at, revalidation_due_date and revalidation_window_start per revalidation_schedule"
          - "Claim-release cascade: this provider+payer's HELD claims with service_date >= effective_date -> RELEASED, processed in service_date ASC then created_at ASC order; HELD claims with service_date < effective_date remain HELD"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/enrollment-applications/{id}/reject"
        actor: PayerRepresentative
        preconditions: []
        side_effects:
          - "decision_reason recorded from request body"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/enrollment-applications/{id}/withdraw OR system (provider termination cascade)"
        actor: EnrollmentSpecialist | system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/enrollment-applications/{id}/withdraw OR system (provider termination cascade)"
        actor: EnrollmentSpecialist | system
        preconditions: []
        side_effects: []
      - from: PENDING_INFO
        to: WITHDRAWN
        trigger: "POST /api/enrollment-applications/{id}/withdraw OR system (provider termination cascade)"
        actor: EnrollmentSpecialist | system
        preconditions: []
        side_effects: []

  - entity: EnrollmentRecord
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: PENDING_REVALIDATION
        trigger: "system (clock sweep)"
        actor: system
        preconditions:
          - "revalidation_window_start <= current logical date <= revalidation_due_date"
        side_effects: []
      - from: PENDING_REVALIDATION
        to: ACTIVE
        trigger: "POST /api/enrollment-records/{id}/revalidate"
        actor: EnrollmentSpecialist
        preconditions:
          - "status == PENDING_REVALIDATION (from ACTIVE -> ERR_REVALIDATION_NOT_DUE; from DEACTIVATED/TERMINATED -> ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "last_revalidation_completed_at = current logical clock"
          - "revalidation_due_date and revalidation_window_start recomputed per revalidation_schedule (cycle: ACTIVE -> PENDING_REVALIDATION -> ACTIVE may repeat)"
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "system (clock sweep)"
        actor: system
        preconditions:
          - "current logical date > revalidation_due_date"
        side_effects:
          - "Deactivation cascade: this provider+payer's HELD claims -> DENIED with ENROLLMENT_DEACTIVATED; RELEASED claims are NOT recouped (deactivation is not retroactive)"
      - from: PENDING_REVALIDATION
        to: DEACTIVATED
        trigger: "system (clock sweep)"
        actor: system
        preconditions:
          - "current logical date > revalidation_due_date"
        side_effects:
          - "Deactivation cascade: this provider+payer's HELD claims -> DENIED with ENROLLMENT_DEACTIVATED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/enrollment-records/{id}/terminate OR system (provider termination cascade)"
        actor: ComplianceOfficer | system
        preconditions:
          - "termination_effective_date >= effective_date (else ERR_TERMINATION_DATE_INVALID); retro-effective dates (in the past) are allowed"
        side_effects:
          - "termination_date = termination_effective_date"
          - "Record-termination cascade: this provider+payer's HELD claims -> DENIED with ENROLLMENT_TERMINATED"
          - "This provider+payer's RELEASED claims with service_date >= termination_date -> RECOUPED, processed in service_date ASC then created_at ASC order; per-claim recoupment_fee_cents = round_half_up(amount_cents * 0.02)"
          - "gross_impacted_cents = sum(amount_cents) over the DENIED-held + RECOUPED claims of this cascade; net_recouped_cents = sum(amount_cents + recoupment_fee_cents) over the RECOUPED claims"
          - "provider.recoupment_balance_cents += net_recouped_cents of this cascade"
      - from: PENDING_REVALIDATION
        to: TERMINATED
        trigger: "POST /api/enrollment-records/{id}/terminate OR system (provider termination cascade)"
        actor: ComplianceOfficer | system
        preconditions:
          - "termination_effective_date >= effective_date (else ERR_TERMINATION_DATE_INVALID)"
        side_effects:
          - "Same record-termination cascade as ACTIVE -> TERMINATED"

  - entity: RosterFile
    initial_state: SUBMITTED
    terminal_states: [RECONCILED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "system (line rollup after any line mutation)"
        actor: system
        preconditions:
          - "pending_count == 0 AND confirmed_count == total_lines AND total_lines >= 1"
        side_effects:
          - "Rollup counts recomputed per roster_line_rollup"
      - from: SUBMITTED
        to: PARTIALLY_CONFIRMED
        trigger: "system (line rollup after any line mutation)"
        actor: system
        preconditions:
          - "pending_count == 0 AND confirmed_count < total_lines"
        side_effects:
          - "Rollup counts recomputed per roster_line_rollup"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a newer RosterFile for the same agreement is submitted via POST /api/roster-files)"
        actor: system
        preconditions:
          - "This file is the prior SUBMITTED file for the agreement"
        side_effects:
          - "Its PENDING lines -> SUPERSEDED; rollup counts recomputed"
      - from: CONFIRMED
        to: RECONCILED
        trigger: "POST /api/roster-files/{id}/reconcile"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != submitted_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: PARTIALLY_CONFIRMED
        to: RECONCILED
        trigger: "POST /api/roster-files/{id}/reconcile"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != submitted_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
    note: "Compound machine: SUBMITTED -> CONFIRMED | PARTIALLY_CONFIRMED is derived from child RosterLine states, not directly invocable."

  - entity: RosterLine
    initial_state: PENDING
    terminal_states: [CONFIRMED, REJECTED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /api/roster-files/{id}/lines/{lineId}/confirm with confirmed_effective_date == expected_effective_date"
        actor: PayerRepresentative
        preconditions:
          - "line.status == PENDING (else ERR_ROSTER_LINE_NOT_PENDING)"
          - "roster file status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"
          - "For action TERM: an EnrollmentRecord in {ACTIVE, PENDING_REVALIDATION} exists for (provider_id, agreement.payer_id) (else ERR_NO_ACTIVE_ENROLLMENT)"
          - "For action ADD: no EnrollmentRecord in {ACTIVE, PENDING_REVALIDATION} exists for (provider_id, agreement.payer_id) and confirmed date does not fall inside a TERMINATED record's half-open interval (else ERR_ENROLLMENT_OVERLAP)"
        side_effects:
          - "confirmed_effective_date recorded"
          - "ADD: create EnrollmentRecord (status ACTIVE, source_roster_line_id = this line, effective_date = confirmed_effective_date, enrollment_scope and benefit_assignment copied from line, last_revalidation_completed_at = current logical clock, revalidation schedule computed); then claim-release cascade for this provider+payer"
          - "TERM: the matching EnrollmentRecord -> TERMINATED with termination_date = confirmed_effective_date, firing the full record-termination cascade (claim denial, recoupment, fees, provider balance)"
          - "Roster file rollup recomputed"
      - from: PENDING
        to: DISCREPANCY
        trigger: "POST /api/roster-files/{id}/lines/{lineId}/confirm with confirmed_effective_date != expected_effective_date"
        actor: PayerRepresentative
        preconditions:
          - "line.status == PENDING (else ERR_ROSTER_LINE_NOT_PENDING)"
          - "roster file status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "confirmed_effective_date recorded; NO enrollment mutation until resolved"
          - "Roster file rollup recomputed"
      - from: PENDING
        to: REJECTED
        trigger: "POST /api/roster-files/{id}/lines/{lineId}/reject"
        actor: PayerRepresentative
        preconditions:
          - "line.status == PENDING (else ERR_ROSTER_LINE_NOT_PENDING)"
          - "roster file status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "rejection_reason recorded; roster file rollup recomputed"
      - from: DISCREPANCY
        to: CONFIRMED
        trigger: "POST /api/roster-files/{id}/lines/{lineId}/resolve with accept_confirmed = true"
        actor: EnrollmentSpecialist
        preconditions:
          - "line.status == DISCREPANCY (else ERR_ROSTER_LINE_NOT_PENDING)"
        side_effects:
          - "Applies the deferred effects of confirmation using confirmed_effective_date (ADD creates record + claim release; TERM terminates record + retro cascade, subject to the same ERR_NO_ACTIVE_ENROLLMENT / ERR_ENROLLMENT_OVERLAP checks)"
          - "Roster file rollup recomputed"
      - from: DISCREPANCY
        to: REJECTED
        trigger: "POST /api/roster-files/{id}/lines/{lineId}/resolve with accept_confirmed = false"
        actor: EnrollmentSpecialist
        preconditions:
          - "line.status == DISCREPANCY (else ERR_ROSTER_LINE_NOT_PENDING)"
        side_effects:
          - "rejection_reason = 'DISCREPANCY_DECLINED'; roster file rollup recomputed"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (owning roster file superseded by a newer submission)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Claim
    initial_state: RELEASED
    terminal_states: [DENIED]
    transitions:
      - from: HELD
        to: RELEASED
        trigger: "system (claim-release cascade when an EnrollmentRecord becomes ACTIVE for the claim's provider+payer)"
        actor: system
        preconditions:
          - "service_date >= the activated record's effective_date"
        side_effects: []
      - from: HELD
        to: DENIED
        trigger: "system (record termination cascade, deactivation cascade, or provider termination cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "denial_reason set to ENROLLMENT_TERMINATED or ENROLLMENT_DEACTIVATED"
      - from: RELEASED
        to: RECOUPED
        trigger: "system (retro-effective termination cascade)"
        actor: system
        preconditions:
          - "service_date >= termination_date of the terminated record"
        side_effects:
          - "recoupment_fee_cents = round_half_up(amount_cents * 0.02)"
          - "provider.recoupment_balance_cents += amount_cents + recoupment_fee_cents"
      - from: RECOUPED
        to: RELEASED
        trigger: "POST /api/claims/{id}/reverse-recoupment"
        actor: ComplianceOfficer
        preconditions:
          - "status == RECOUPED (else ERR_CLAIM_NOT_RECOUPED)"
        side_effects:
          - "provider.recoupment_balance_cents -= amount_cents + recoupment_fee_cents"
          - "recoupment_fee_cents reset to 0"
    note: "Creation computes the initial state per claim_hold_evaluation: RELEASED when covered, HELD when not covered and payer.claims_hold_enabled, DENIED (PAYER_HOLD_DISABLED) otherwise. RECOUPED -> RELEASED makes the money dimension cyclic."

  - entity: DelegatedCredentialingAgreement
    initial_state: ACTIVE
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep)"
        actor: system
        preconditions:
          - "current logical date > expiry_date"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/delegation-agreements/{id}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

# =============================================================================
# Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: roster-submit-stale-agreement
    parent_entity: DelegatedCredentialingAgreement
    write_endpoint: "POST /api/roster-files"
    occ_field: expected_agreement_version
    description: |
      Submitting a RosterFile against a DelegatedCredentialingAgreement whose
      version has advanced since the client last observed it is rejected. This
      captures the case where another writer has just submitted a roster for
      the same agreement (which legitimately supersedes the prior SUBMITTED
      roster per the RosterFile state machine) and the current writer's view
      of the agreement is therefore stale.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: caqh_attestation_cycle
    trigger: "POST /api/caqh-profiles/{id}/attest (due_at recompute) and system clock sweep (status re-evaluation)"
    algorithm: threshold
    formula: |
      due_at = last_attested_at + ATTESTATION_CYCLE_DAYS days
      window_start = due_at - DUE_WARNING_DAYS days
      On clock sweep, for each CAQHProfile with status in {ATTESTED, DUE}:
        if current_utc > due_at:            status = LAPSED
        elif current_utc >= window_start:   status = DUE
        else:                               status unchanged (ATTESTED)
      Boundary: at exactly current_utc == due_at the profile is DUE, never LAPSED
      (lapse is strictly greater-than).
    input_set: "All CAQHProfile rows with status in {ATTESTED, DUE}; NEVER_ATTESTED and freshly attested rows outside the window are untouched"
    constants:
      ATTESTATION_CYCLE_DAYS: 120
      DUE_WARNING_DAYS: 30
    precision: "timestamps compared at second precision, UTC"

  - name: enrollment_effective_date
    trigger: "EnrollmentApplication approval (POST .../approve) and roster ADD line confirmation (delegated path)"
    algorithm: threshold
    formula: |
      if created via delegated roster line:
        effective_date = line.confirmed_effective_date
      else (application path):
        approved_day = date(application.approved_at)
        if payer.effective_date_policy == APPROVAL_DATE:
          effective_date = approved_day
        elif payer.effective_date_policy == RETRO_90:
          effective_date = max(application.requested_effective_date,
                               approved_day - RETRO_DAYS days)
    input_set: "The single application being approved, or the single roster line being confirmed"
    constants:
      RETRO_DAYS: 90
    precision: "date precision (YYYY-MM-DD)"
    variants:
      - name: payer_policy_approval
        when: "payer.effective_date_policy == APPROVAL_DATE"
        difference: "effective_date = approval day; requested_effective_date is ignored"
      - name: payer_policy_retro
        when: "payer.effective_date_policy == RETRO_90"
        difference: "effective_date = max(requested_effective_date, approval day - 90 days); identical inputs yield an earlier effective date than payer_policy_approval whenever requested date precedes approval day"

  - name: revalidation_schedule
    trigger: "EnrollmentRecord activation (application approval or roster ADD confirm), POST .../revalidate, and system clock sweep"
    algorithm: threshold
    formula: |
      base = date(last_revalidation_completed_at) + payer.revalidation_interval_days days
      if payer.is_medicare:
        revalidation_due_date = last calendar day of the month containing base
      else:
        revalidation_due_date = base
      revalidation_window_start = revalidation_due_date - REVALIDATION_WINDOW_DAYS days
      On clock sweep, for each EnrollmentRecord with status in {ACTIVE, PENDING_REVALIDATION}:
        if current_date > revalidation_due_date:      status = DEACTIVATED (+ denial cascade)
        elif current_date >= revalidation_window_start and status == ACTIVE:
                                                      status = PENDING_REVALIDATION
    input_set: "The one record being activated/revalidated, or (sweep) all records in {ACTIVE, PENDING_REVALIDATION}"
    constants:
      REVALIDATION_WINDOW_DAYS: 60
    precision: "date precision (YYYY-MM-DD); month-end snap uses the Gregorian calendar"

  - name: claim_hold_evaluation
    trigger: "POST /api/claims (initial status) and EnrollmentRecord activation (release cascade)"
    algorithm: forward_looking
    formula: |
      covering_record(provider_id, payer_id, service_date) =
        the EnrollmentRecord for (provider_id, payer_id) with
          status in {ACTIVE, PENDING_REVALIDATION}
          AND effective_date <= service_date
          AND (termination_date is null OR service_date < termination_date)
        (at most one such record exists per the half-open overlap invariant)
      At claim creation:
        if covering_record exists:                status = RELEASED
        elif payer.claims_hold_enabled:           status = HELD
        else:                                     status = DENIED, denial_reason = PAYER_HOLD_DISABLED
      Release cascade on record activation with effective_date E:
        for each HELD claim of (provider_id, payer_id) with service_date >= E,
        processed in service_date ASC, tie-break created_at ASC:
          status = RELEASED
        HELD claims with service_date < E remain HELD.
    input_set: "Claims of the (provider_id, payer_id) pair in status HELD (cascade) or the single new claim (creation)"
    precision: "date precision"

  - name: retro_recoupment
    trigger: "EnrollmentRecord termination with retro-effective termination_date (record-level or via provider termination cascade) and roster TERM line confirmation"
    algorithm: chronological
    formula: |
      held_set    = this provider+payer's claims with status == HELD
      recoup_set  = this provider+payer's claims with status == RELEASED
                    AND service_date >= termination_date
      processing order for both sets: service_date ASC, tie-break created_at ASC
      for each claim in held_set:    status = DENIED, denial_reason = ENROLLMENT_TERMINATED
      for each claim in recoup_set:  status = RECOUPED,
                                     recoupment_fee_cents per recoupment_fee calculation
    input_set: "Claims of the terminated record's (provider_id, payer_id) pair in status HELD or RELEASED at termination time"
    precision: "whole cents"
    variants:
      - name: gross_impact
        when: "recorded on EnrollmentRecord.gross_impacted_cents at termination"
        difference: "sum(amount_cents) over BOTH the HELD->DENIED claims and the RELEASED->RECOUPED claims; principal only, fees excluded — measures total claims impact"
      - name: net_recoupment
        when: "recorded on EnrollmentRecord.net_recouped_cents and added to Provider.recoupment_balance_cents at termination"
        difference: "sum(amount_cents + recoupment_fee_cents) over ONLY the RELEASED->RECOUPED claims — measures money actually clawed back; identical termination data yields a different number than gross_impact whenever any HELD claim is denied or any fee is nonzero"

  - name: recoupment_fee
    trigger: "each claim entering RECOUPED during the retro_recoupment sweep"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (per-claim-then-sum):
        per claim:  fee_i = round_half_up(amount_cents_i * RECOUPMENT_FEE_PCT) to whole cents
        aggregate:  net_recouped_cents = sum_i(amount_cents_i + fee_i)
      The alternative order — sum principals first, then round the product of the
      total and RECOUPMENT_FEE_PCT once — is explicitly rejected; it produces
      different cents (e.g., two 3333-cent claims: pinned order 67+67=134 in fees
      vs 133 for sum-then-round).
    input_set: "The claims entering RECOUPED in one termination cascade"
    constants:
      RECOUPMENT_FEE_PCT: 0.02
    precision: "0 decimal places per fee, round_half_up"

  - name: roster_line_rollup
    trigger: "every RosterLine mutation (confirm, reject, resolve, supersede) and roster creation"
    algorithm: aggregation
    formula: |
      For roster file F over its lines:
        total_lines       = count(lines)
        pending_count     = count(status == PENDING)
        confirmed_count   = count(status == CONFIRMED)
        rejected_count    = count(status == REJECTED)
        discrepancy_count = count(status == DISCREPANCY)
        superseded_count  = count(status == SUPERSEDED)
      Derived file status (only while F.status == SUBMITTED):
        if pending_count > 0:                          SUBMITTED
        elif confirmed_count == total_lines:           CONFIRMED
        else:                                          PARTIALLY_CONFIRMED
      Invariant maintained at all times:
        pending_count + confirmed_count + rejected_count
          + discrepancy_count + superseded_count == total_lines
    input_set: "All RosterLine rows of the file, any status"
    precision: "integer counts"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and the role must be a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The role in X-User-Role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path-template ids must resolve to existing resources, validated left-to-right (agreement before roster line, file before line, etc.); body FK ids (provider_id, payer_id, agreement_id) must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Request body schema: required fields present, enum members valid, date fields parse as YYYY-MM-DD, integer fields are integers, amount_cents > 0, agreement expiry_date > effective_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 5
    category: auth
    check: "Actor scope: a Provider may only attest the CAQHProfile whose provider_id equals X-User-ID; a ComplianceOfficer may only reconcile a RosterFile whose submitted_by_user_id differs from X-User-ID (segregation of duties)"
    error_id: "ERR_PROFILE_OWNERSHIP_MISMATCH | ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "POST /api/caqh-profiles/{id}/attest; POST /api/roster-files/{id}/reconcile"

  - priority: 6
    category: business_constraint
    check: "OCC: expected_agreement_version must equal the agreement's current version"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /api/roster-files"

  - priority: 7
    category: state
    check: "Target resource state must allow the transition (application in DRAFT/SUBMITTED/PENDING_INFO as required; claim RECOUPED for reversal; record PENDING_REVALIDATION for revalidate — from ACTIVE this is ERR_REVALIDATION_NOT_DUE; line PENDING or DISCREPANCY as required; file SUBMITTED for line actions, CONFIRMED/PARTIALLY_CONFIRMED for reconcile). Within this priority, the most specific resource's error wins: a line-level violation (ERR_ROSTER_LINE_NOT_PENDING) is reported before the parent file's state violation (ERR_INVALID_STATE_TRANSITION)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_ROSTER_LINE_NOT_PENDING | ERR_CLAIM_NOT_RECOUPED | ERR_REVALIDATION_NOT_DUE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 8
    category: business_safety
    check: "Compliance gates: provider.status must be ACTIVE (application submit/resubmit/approve, claim creation); CAQHProfile.status in {ATTESTED, DUE} at application submit/resubmit/approve; agreement.status == ACTIVE at roster submission"
    error_id: "ERR_PROVIDER_TERMINATED | ERR_CAQH_ATTESTATION_NOT_CURRENT | ERR_AGREEMENT_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /api/enrollment-applications*, POST /api/claims, POST /api/roster-files"

  - priority: 9
    category: business_referential
    check: "Every roster line's provider must belong to the agreement's practice group; a TERM line's (provider, agreement.payer) must have an EnrollmentRecord in {ACTIVE, PENDING_REVALIDATION}"
    error_id: "ERR_PROVIDER_GROUP_MISMATCH | ERR_NO_ACTIVE_ENROLLMENT"
    http_status: 422
    applies_to: "POST /api/roster-files (group check at submission); roster line confirm/resolve (enrollment check)"

  - priority: 10
    category: business_temporal
    check: "requested_effective_date and roster-line expected_effective_date must be >= current logical date - 90 days; termination_effective_date must be >= the target record's effective_date (provider-level: >= every active record's effective_date); claim service_date must be <= current logical date"
    error_id: "ERR_RETRO_WINDOW_EXCEEDED | ERR_TERMINATION_DATE_INVALID | ERR_FUTURE_SERVICE_DATE"
    http_status: 422
    applies_to: "POST /api/enrollment-applications, POST /api/roster-files, POST /api/providers/{id}/terminate, POST /api/enrollment-records/{id}/terminate, POST /api/claims"

  - priority: 11
    category: business_constraint
    check: "Uniqueness and overlap: npi unique; at most one in-flight application in {DRAFT, SUBMITTED, PENDING_INFO} per (provider_id, payer_id); no overlapping enrollment intervals per (provider_id, payer_id) using half-open [effective_date, termination_date) semantics (touching allowed); no overlapping agreement intervals per (practice_group_id, payer_id) among agreements with status != TERMINATED using CLOSED [effective_date, expiry_date] semantics (touching rejected); roster must contain >= 1 line; logical clock is monotonic non-decreasing"
    error_id: "ERR_DUPLICATE_NPI | ERR_APPLICATION_IN_FLIGHT | ERR_ENROLLMENT_OVERLAP | ERR_AGREEMENT_OVERLAP | ERR_EMPTY_ROSTER | ERR_CLOCK_REGRESSION"
    http_status: "409 | 409 | 409 | 409 | 422 | 422"
    applies_to: "POST /api/practice-groups/{id}/providers, POST /api/enrollment-applications, POST .../approve + roster ADD confirm/resolve, POST /api/delegation-agreements, POST /api/roster-files, POST /api/_clock/set_current_utc"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Practice groups & providers ---
  - method: POST
    path: "/api/practice-groups"
    description: "Create a practice group"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, tax_id, group_npi]
    output: PracticeGroup
    side_effects: []

  - method: GET
    path: "/api/practice-groups/{id}"
    description: "Get a practice group"
    roles: &all_roles [ComplianceOfficer, EnrollmentSpecialist, PayerRepresentative, Provider]
    code: 200
    input: []
    output: PracticeGroup
    side_effects: []

  - method: POST
    path: "/api/practice-groups/{id}/providers"
    description: "Create a provider in a practice group; auto-creates the provider's CAQHProfile in NEVER_ATTESTED"
    roles: [EnrollmentSpecialist]
    code: 201
    input: [npi, full_name, specialty]
    output: Provider
    side_effects:
      - "CAQHProfile created for the new provider (status NEVER_ATTESTED, last_attested_at null, due_at null)"
      - "ERR_DUPLICATE_NPI if npi already exists"

  - method: GET
    path: "/api/practice-groups/{id}/providers"
    description: "List providers of a practice group (FK reverse reachability)"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []

  - method: GET
    path: "/api/providers/{id}"
    description: "Get a provider (includes computed recoupment_balance_cents)"
    roles: *all_roles
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: POST
    path: "/api/providers/{id}/terminate"
    description: "Terminate a provider with a (possibly retro-effective) termination date; fires the depth-3 cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: [termination_effective_date, reason]
    output: Provider
    side_effects:
      - "Provider -> TERMINATED; records -> TERMINATED; claims -> DENIED/RECOUPED; in-flight applications -> WITHDRAWN; recoupment_balance_cents updated (see Provider state machine)"

  - method: GET
    path: "/api/providers/{id}/caqh-profile"
    description: "Get the provider's CAQH profile (array of length 1)"
    roles: *all_roles
    code: 200
    input: []
    output: CAQHProfile[]
    side_effects: []

  - method: GET
    path: "/api/providers/{id}/roster-lines"
    description: "List roster lines referencing this provider (FK reverse reachability)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: RosterLine[]
    side_effects: []

  # --- Payers ---
  - method: POST
    path: "/api/payers"
    description: "Create a payer (configuration: medicare flag, effective-date policy, claims-hold switch, revalidation interval)"
    roles: [ComplianceOfficer]
    code: 201
    input: [payer_code, name, is_medicare, effective_date_policy, claims_hold_enabled, revalidation_interval_days]
    output: Payer
    side_effects: []

  - method: GET
    path: "/api/payers/{id}"
    description: "Get a payer"
    roles: *all_roles
    code: 200
    input: []
    output: Payer
    side_effects: []

  # --- CAQH ---
  - method: POST
    path: "/api/caqh-profiles/{id}/attest"
    description: "Attest the CAQH profile; only the owning provider (X-User-ID == provider_id) may attest; allowed from any status and resets the 120-day cycle"
    roles: [Provider]
    code: 200
    input: []
    output: CAQHProfile
    side_effects:
      - "status -> ATTESTED; last_attested_at = current logical clock; due_at = last_attested_at + 120 days"

  # --- Enrollment applications ---
  - method: POST
    path: "/api/enrollment-applications"
    description: "Create an enrollment application (DRAFT)"
    roles: [EnrollmentSpecialist]
    code: 201
    input: [provider_id, payer_id, enrollment_scope, requested_effective_date]
    output: EnrollmentApplication
    side_effects:
      - "ERR_APPLICATION_IN_FLIGHT if an application in {DRAFT, SUBMITTED, PENDING_INFO} exists for (provider_id, payer_id)"
      - "ERR_ENROLLMENT_OVERLAP if a record in {ACTIVE, PENDING_REVALIDATION} exists for (provider_id, payer_id)"
      - "ERR_RETRO_WINDOW_EXCEEDED if requested_effective_date < current logical date - 90 days"

  - method: GET
    path: "/api/enrollment-applications/{id}"
    description: "Get an enrollment application"
    roles: *all_roles
    code: 200
    input: []
    output: EnrollmentApplication
    side_effects: []

  - method: GET
    path: "/api/enrollment-applications"
    description: "List/filter enrollment applications (FK reverse reachability for provider_id and payer_id)"
    roles: *all_roles
    code: 200
    input: ["provider_id?", "payer_id?", "status?", "limit?", "offset?"]
    output: EnrollmentApplication[]
    side_effects: []

  - method: POST
    path: "/api/enrollment-applications/{id}/submit"
    description: "Submit a DRAFT application"
    roles: [EnrollmentSpecialist]
    code: 200
    input: []
    output: EnrollmentApplication
    side_effects: ["status DRAFT -> SUBMITTED; submitted_at set"]

  - method: POST
    path: "/api/enrollment-applications/{id}/request-info"
    description: "Payer requests more information"
    roles: [PayerRepresentative]
    code: 200
    input: [reason]
    output: EnrollmentApplication
    side_effects: ["status SUBMITTED -> PENDING_INFO; info_request_reason set"]

  - method: POST
    path: "/api/enrollment-applications/{id}/resubmit"
    description: "Resubmit after an info request (closes the cycle)"
    roles: [EnrollmentSpecialist]
    code: 200
    input: []
    output: EnrollmentApplication
    side_effects: ["status PENDING_INFO -> SUBMITTED; submitted_at refreshed"]

  - method: POST
    path: "/api/enrollment-applications/{id}/approve"
    description: "Payer approves; creates the EnrollmentRecord and releases eligible held claims"
    roles: [PayerRepresentative]
    code: 200
    input: []
    output: EnrollmentApplication
    side_effects:
      - "status SUBMITTED -> APPROVED; approved_at set"
      - "EnrollmentRecord created (ACTIVE) with computed effective_date and revalidation schedule"
      - "Claim-release cascade for this provider+payer"

  - method: POST
    path: "/api/enrollment-applications/{id}/reject"
    description: "Payer rejects the application"
    roles: [PayerRepresentative]
    code: 200
    input: [reason]
    output: EnrollmentApplication
    side_effects: ["status SUBMITTED -> REJECTED; decision_reason set"]

  - method: POST
    path: "/api/enrollment-applications/{id}/withdraw"
    description: "Withdraw a non-terminal application"
    roles: [EnrollmentSpecialist]
    code: 200
    input: []
    output: EnrollmentApplication
    side_effects: ["status -> WITHDRAWN from DRAFT/SUBMITTED/PENDING_INFO"]

  # --- Enrollment records ---
  - method: GET
    path: "/api/enrollment-records/{id}"
    description: "Get an enrollment record"
    roles: *all_roles
    code: 200
    input: []
    output: EnrollmentRecord
    side_effects: []

  - method: GET
    path: "/api/enrollment-records"
    description: "List/filter enrollment records (FK reverse reachability)"
    roles: *all_roles
    code: 200
    input: ["provider_id?", "payer_id?", "source_application_id?", "source_roster_line_id?", "status?", "limit?", "offset?"]
    output: EnrollmentRecord[]
    side_effects: []

  - method: POST
    path: "/api/enrollment-records/{id}/terminate"
    description: "Terminate one enrollment record; retro-effective dates allowed; fires the record-termination cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: [termination_effective_date]
    output: EnrollmentRecord
    side_effects:
      - "status -> TERMINATED; claims denied/recouped; gross_impacted_cents and net_recouped_cents set; provider balance updated"

  - method: POST
    path: "/api/enrollment-records/{id}/revalidate"
    description: "Complete a Medicare/commercial revalidation cycle; only valid from PENDING_REVALIDATION"
    roles: [EnrollmentSpecialist]
    code: 200
    input: []
    output: EnrollmentRecord
    side_effects:
      - "status PENDING_REVALIDATION -> ACTIVE; last_revalidation_completed_at = now; revalidation schedule recomputed"

  # --- Delegated credentialing agreements ---
  - method: POST
    path: "/api/delegation-agreements"
    description: "Create a delegated credentialing agreement (closed-interval overlap check per group+payer)"
    roles: [ComplianceOfficer]
    code: 201
    input: [practice_group_id, payer_id, effective_date, expiry_date]
    output: DelegatedCredentialingAgreement
    side_effects:
      - "ERR_AGREEMENT_OVERLAP when [effective_date, expiry_date] (inclusive both ends) intersects an existing agreement with status != TERMINATED for the same (practice_group_id, payer_id); touching at a shared boundary date counts as overlap"

  - method: GET
    path: "/api/delegation-agreements/{id}"
    description: "Get an agreement"
    roles: *all_roles
    code: 200
    input: []
    output: DelegatedCredentialingAgreement
    side_effects: []

  - method: GET
    path: "/api/delegation-agreements"
    description: "List/filter agreements (FK reverse reachability)"
    roles: *all_roles
    code: 200
    input: ["payer_id?", "practice_group_id?", "status?", "limit?", "offset?"]
    output: DelegatedCredentialingAgreement[]
    side_effects: []

  - method: POST
    path: "/api/delegation-agreements/{id}/terminate"
    description: "Terminate an agreement"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DelegatedCredentialingAgreement
    side_effects: ["status ACTIVE -> TERMINATED"]

  # --- Roster files & lines ---
  - method: POST
    path: "/api/roster-files"
    description: "Submit a roster file with its lines (delegated credentialing channel). OCC-guarded by the agreement version; supersedes the prior SUBMITTED roster of the same agreement"
    roles: [EnrollmentSpecialist]
    code: 201
    input: [agreement_id, expected_agreement_version, lines]
    output: RosterFile
    side_effects:
      - "RosterFile created in SUBMITTED with all lines PENDING; line_index assigned in request order"
      - "increments DelegatedCredentialingAgreement.version by 1"
      - "Prior SUBMITTED RosterFile for the same agreement -> SUPERSEDED; its PENDING lines -> SUPERSEDED"
      - "ERR_EMPTY_ROSTER when lines is empty; ERR_PROVIDER_GROUP_MISMATCH when a line's provider is not in the agreement's group; ERR_RETRO_WINDOW_EXCEEDED per line expected_effective_date"

  - method: GET
    path: "/api/roster-files/{id}"
    description: "Get a roster file (includes rollup counts)"
    roles: *all_roles
    code: 200
    input: []
    output: RosterFile
    side_effects: []

  - method: GET
    path: "/api/roster-files"
    description: "List/filter roster files (FK reverse reachability)"
    roles: *all_roles
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: RosterFile[]
    side_effects: []

  - method: GET
    path: "/api/roster-files/{id}/lines"
    description: "List the lines of a roster file, ordered by line_index ASC (FK reverse reachability)"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RosterLine[]
    side_effects: []

  - method: POST
    path: "/api/roster-files/{id}/lines/{lineId}/confirm"
    description: "Payer confirms a line with its confirmed effective date; date equality decides CONFIRMED vs DISCREPANCY"
    roles: [PayerRepresentative]
    code: 200
    input: [confirmed_effective_date]
    output: RosterLine
    side_effects:
      - "Match: line -> CONFIRMED and enrollment effects apply (ADD creates record + claim release; TERM terminates record + retro cascade)"
      - "Mismatch: line -> DISCREPANCY, enrollment effects deferred until resolve"
      - "Roster file rollup recomputed"

  - method: POST
    path: "/api/roster-files/{id}/lines/{lineId}/reject"
    description: "Payer rejects a line"
    roles: [PayerRepresentative]
    code: 200
    input: [reason]
    output: RosterLine
    side_effects: ["line PENDING -> REJECTED; rollup recomputed"]

  - method: POST
    path: "/api/roster-files/{id}/lines/{lineId}/resolve"
    description: "Specialist resolves a DISCREPANCY line: accept the payer's confirmed date or decline"
    roles: [EnrollmentSpecialist]
    code: 200
    input: [accept_confirmed]
    output: RosterLine
    side_effects:
      - "accept_confirmed=true: apply deferred enrollment effects at confirmed_effective_date; line -> CONFIRMED"
      - "accept_confirmed=false: line -> REJECTED with rejection_reason DISCREPANCY_DECLINED"
      - "Roster file rollup recomputed"

  - method: POST
    path: "/api/roster-files/{id}/reconcile"
    description: "Compliance sign-off closing a fully-adjudicated roster; the original submitter may not reconcile (segregation of duties)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RosterFile
    side_effects: ["status CONFIRMED|PARTIALLY_CONFIRMED -> RECONCILED"]

  # --- Claims ---
  - method: POST
    path: "/api/claims"
    description: "Receive a claim; initial status computed by claim_hold_evaluation"
    roles: [EnrollmentSpecialist]
    code: 201
    input: [provider_id, payer_id, service_date, amount_cents]
    output: Claim
    side_effects:
      - "status = RELEASED (covered) | HELD (uncovered, payer hold enabled) | DENIED/PAYER_HOLD_DISABLED (uncovered, hold disabled)"
      - "ERR_PROVIDER_TERMINATED when provider is TERMINATED; ERR_FUTURE_SERVICE_DATE when service_date > current logical date"

  - method: GET
    path: "/api/claims/{id}"
    description: "Get a claim"
    roles: *all_roles
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/api/claims"
    description: "List/filter claims (FK reverse reachability)"
    roles: *all_roles
    code: 200
    input: ["provider_id?", "payer_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/api/claims/{id}/reverse-recoupment"
    description: "Reverse a recoupment (compensating action): RECOUPED -> RELEASED, fee zeroed, provider balance decremented"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "provider.recoupment_balance_cents -= amount_cents + recoupment_fee_cents; recoupment_fee_cents reset to 0"

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Monotonic non-decreasing; regression rejected with ERR_CLOCK_REGRESSION. Fires the sweep: CAQH DUE/LAPSED transitions, revalidation window/deactivation transitions (+ denial cascades), agreement expiry"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "CAQHProfile sweep (DUE at due_at - 30d; LAPSED strictly after due_at)"
      - "EnrollmentRecord sweep (PENDING_REVALIDATION from window start; DEACTIVATED after due date + HELD-claim denial cascade)"
      - "DelegatedCredentialingAgreement sweep (EXPIRED after expiry_date)"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role name not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, unparseable date, non-positive amount_cents, or agreement expiry_date <= effective_date" }
  - { id: ERR_PROFILE_OWNERSHIP_MISMATCH, http: 403, condition: "Provider attempting to attest a CAQH profile whose provider_id differs from X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Roster reconcile attempted by the same X-User-ID that submitted the roster" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version does not match the agreement's current version (OCC)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Trigger invoked from a state that does not allow it (generic state violation, including terminal-state lockdown and revalidate from DEACTIVATED/TERMINATED)" }
  - { id: ERR_ROSTER_LINE_NOT_PENDING, http: 409, condition: "Line confirm/reject on a non-PENDING line, or resolve on a non-DISCREPANCY line" }
  - { id: ERR_CLAIM_NOT_RECOUPED, http: 409, condition: "reverse-recoupment on a claim not in RECOUPED" }
  - { id: ERR_REVALIDATION_NOT_DUE, http: 409, condition: "revalidate invoked on an ACTIVE record whose revalidation window has not opened" }
  - { id: ERR_PROVIDER_TERMINATED, http: 409, condition: "Application submit/resubmit/approve or claim creation for a TERMINATED provider" }
  - { id: ERR_CAQH_ATTESTATION_NOT_CURRENT, http: 409, condition: "Application submit/resubmit/approve while the provider's CAQH profile is NEVER_ATTESTED or LAPSED" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Roster submission against an agreement in EXPIRED or TERMINATED" }
  - { id: ERR_PROVIDER_GROUP_MISMATCH, http: 422, condition: "Roster line's provider does not belong to the agreement's practice group" }
  - { id: ERR_NO_ACTIVE_ENROLLMENT, http: 422, condition: "TERM line confirmed but no EnrollmentRecord in {ACTIVE, PENDING_REVALIDATION} exists for (provider, payer)" }
  - { id: ERR_RETRO_WINDOW_EXCEEDED, http: 422, condition: "requested_effective_date or line expected_effective_date earlier than current logical date - 90 days" }
  - { id: ERR_TERMINATION_DATE_INVALID, http: 422, condition: "termination_effective_date earlier than the affected record's effective_date" }
  - { id: ERR_FUTURE_SERVICE_DATE, http: 422, condition: "Claim service_date later than the current logical date" }
  - { id: ERR_DUPLICATE_NPI, http: 409, condition: "Provider creation with an npi that already exists" }
  - { id: ERR_APPLICATION_IN_FLIGHT, http: 409, condition: "Application creation while another application in {DRAFT, SUBMITTED, PENDING_INFO} exists for the same (provider_id, payer_id)" }
  - { id: ERR_ENROLLMENT_OVERLAP, http: 409, condition: "Application create/approve or roster ADD confirm/resolve would produce overlapping enrollment intervals for (provider_id, payer_id); half-open [effective_date, termination_date) semantics — touching at the boundary is allowed" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 409, condition: "New agreement's closed [effective_date, expiry_date] interval intersects an existing non-TERMINATED agreement for the same (practice_group_id, payer_id); a shared boundary date counts as overlap" }
  - { id: ERR_EMPTY_ROSTER, http: 422, condition: "Roster submission with zero lines" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "set_current_utc to a timestamp earlier than the current logical clock" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Practice-group compliance officer; owns configuration, agreements, terminations, roster reconciliation, recoupment reversals, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/practice-groups"
      - "POST /api/payers"
      - "POST /api/providers/{id}/terminate"
      - "POST /api/enrollment-records/{id}/terminate"
      - "POST /api/delegation-agreements (+ terminate)"
      - "POST /api/roster-files/{id}/reconcile (never the roster's own submitter)"
      - "POST /api/claims/{id}/reverse-recoupment"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: EnrollmentSpecialist
    description: "Group enrollment staff; creates providers, drives applications, submits rosters, resolves discrepancies, completes revalidations, enters claims"
    identity: opaque
    exclusive_operations:
      - "POST /api/practice-groups/{id}/providers"
      - "POST /api/enrollment-applications (+ submit, resubmit, withdraw)"
      - "POST /api/roster-files"
      - "POST /api/roster-files/{id}/lines/{lineId}/resolve"
      - "POST /api/enrollment-records/{id}/revalidate"
      - "POST /api/claims"
    shared_operations:
      - "All GET endpoints"

  - name: PayerRepresentative
    description: "Payer-side enrollment representative; adjudicates applications and roster lines"
    identity: opaque
    exclusive_operations:
      - "POST /api/enrollment-applications/{id}/request-info"
      - "POST /api/enrollment-applications/{id}/approve"
      - "POST /api/enrollment-applications/{id}/reject"
      - "POST /api/roster-files/{id}/lines/{lineId}/confirm"
      - "POST /api/roster-files/{id}/lines/{lineId}/reject"
    shared_operations:
      - "All GET endpoints"

  - name: Provider
    description: "The enrolled clinician; attests only their own CAQH profile"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /api/caqh-profiles/{id}/attest (only when X-User-ID == profile.provider_id)"
    shared_operations:
      - "All GET endpoints"
