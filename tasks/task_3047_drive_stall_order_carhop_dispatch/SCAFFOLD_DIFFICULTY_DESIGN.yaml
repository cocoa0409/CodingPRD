  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: run_void_restores_carhop_load_and_order_readiness
        grounds:
          - state_machines.DeliveryRun.LOADED_to_VOIDED
          - entities.Carhop.fields.active_run_load
        distinguishing_aspect: |
          Conserved quantity = carhop dispatch capacity: staging a run adds
          order_count to active_run_load and voiding it subtracts the same
          count, returning active_run_load to its pre-stage value and the
          orders to READY unstaged — no drift in the conserved load.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T13:00:00Z; Location L, stall 1; carhop with max_trays 3 and active_run_load 0; one READY captured order staged on a run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: PlatformAdmin
            - call: "POST /locations"
              payload: { code: "OKC-130", name: "OKC 130", timezone: "America/Chicago", stall_capacity: 2 }
              as: PlatformAdmin
              captures: { loc17_id: $.data.id, loc17_v0: $.data.version }
            - call: "POST /locations/${loc17_id}/service-targets"
              payload: { channel: "STALL_INTERCOM", weather_mode: "NORMAL", target_seconds: 600 }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { sku: "FD-R", name: "R", category: "FOOD", base_price_cents: 500, size_scheme: "NONE", half_price_eligible: false }
              as: PlatformAdmin
              captures: { food17: $.data.id }
            - call: "POST /locations/${loc17_id}/stalls"
              payload: { stall_number: 1, kind: "STALL" }
              as: PlatformAdmin
              captures: { stall17_id: $.data.id }
            - call: "POST /locations/${loc17_id}/carhops"
              payload: { name: "Hop E", zone: "NORTH", on_shift: true, max_trays: 3 }
              as: ShiftManager
              captures: { hop17_id: $.data.id, hop17_v0: $.data.version }
            - call: "POST /locations/${loc17_id}/stalls/${stall17_id}/checkin"
              payload: { expected_location_version: "${loc17_v0}" }
              as: ShiftManager
              captures: { o17_id: $.data.id }
            - call: "POST /locations/${loc17_id}/orders/${o17_id}/lines"
              payload: { menu_item_id: "${food17}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${loc17_id}/orders/${o17_id}/place"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc17_id}/orders/${o17_id}/start_preparation"
              payload: {}
              as: KitchenStaff
            - call: "POST /locations/${loc17_id}/orders/${o17_id}/mark_ready"
              payload: {}
              as: KitchenStaff
            - call: "POST /locations/${loc17_id}/delivery-runs"
              payload: { carhop_id: "${hop17_id}", expected_carhop_version: "${hop17_v0}", order_ids: ["${o17_id}"] }
              as: ShiftManager
              captures: { run17_id: $.data.id }
            - call: "GET /locations/${loc17_id}/carhops/${hop17_id}"
              payload: {}
              as: ShiftManager
              captures: { load_staged: $.data.active_run_load }
          trigger:
            - call: "POST /locations/${loc17_id}/delivery-runs/${run17_id}/void"
              payload: {}
              as: ShiftManager
            - call: "GET /locations/${loc17_id}/carhops/${hop17_id}"
              payload: {}
              as: ShiftManager
              captures: { load_restored: $.data.active_run_load }
          assert:
            - "After staging: active_run_load == 1"
            - "After void: Carhop.${hop17_id}.active_run_load == 0 (conserved)"
            - "Order.${o17_id}.status == READY and delivery_run_id is null and run_position is null"
      - name: refund_voids_tip_and_restores_wallet_conservation
        grounds:
          - state_machines.OrderPaymentAxis.CAPTURED_to_REFUNDED
          - state_machines.TipRecord.RECORDED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity = carhop outstanding tips: capture creates a
          TipRecord adding tip_cents to tips_outstanding_cents; refund voids
          the TipRecord subtracting the same amount — outstanding tips return
          to pre-capture value while wallet_credit_cents is credited by
          total_cents (a different conserved quantity from carhop load).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T13:00:00Z; Location L, stall 1; carhop run delivered an order captured with tip 100; carhop tips_outstanding_cents == 100."
          setup_api_calls:
