# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Long-Term Care Insurance Administration — EXPERT band
# Nine Difficulty Rules × ≥2 instances each (≥18 instances total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reimbursement_vs_indemnity_same_claim_lines
        grounds:
          - calculations.claim_benefit_payout
          - entities.Policy.fields.product_mode
          - entities.ClaimLine.fields.benefit_paid_cents
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Two policies with identical claim lines (charges 15000/25000/18000, daily_max 20000)
          pay 53000 under REIMBURSEMENT (min of charge,cap each day) but 60000 under INDEMNITY
          (full cap each day) — different cents on the Claim/ClaimLine domain from one calc.
        test_recipe:
          setup:
            - "Two IN_FORCE, benefits-triggered, premium-current policies for the same holder: P_R is REIMBURSEMENT, P_I is INDEMNITY; both daily_max=20000, monthly_max=600000, pool=10000000, inflation NONE, elimination 0."
            - "Each policy has an ACTIVE care plan on an ELIGIBLE NURSING_HOME provider, and a claim UNDER_REVIEW with three qualifying lines: 2026-03-01 charge 15000, 2026-03-02 charge 25000, 2026-03-03 charge 18000."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Pat Insured", state_code: "CA", date_of_birth: "1948-02-02" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Maple NH", provider_type: "NURSING_HOME", state_code: "CA" }
              as: CareAssessor
              captures: { prov_id: $.data.id }
            - call: "POST /providers/${prov_id}/certify"
              payload: {}
              as: CareAssessor
            # ---- REIMBURSEMENT policy ----
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pr_id: $.data.id }
            - call: "POST /policies/${pr_id}/issue"
              payload: {}
              as: Underwriter
              captures: { pr_v1: $.data.version }
            - call: "POST /policies/${pr_id}/premium-invoices"
              payload: { period_index: 0, base_premium_cents: 12000, due_date: "2026-01-31", grace_deadline: "2026-04-06" }
              as: Underwriter
              captures: { pr_inv0: $.data.id }
            - call: "POST /premium-invoices/${pr_inv0}/pay"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /policies/${pr_id}/trigger-certifications"
              payload: { adl_deficiencies: ["BATHING", "DRESSING"], cognitive_impairment: false }
              as: CareAssessor
            - call: "POST /care-plans"
              payload: { policy_id: "${pr_id}", provider_id: "${prov_id}", care_setting: "NURSING_HOME" }
              as: CareAssessor
              captures: { pr_cp: $.data.id }
            - call: "POST /care-plans/${pr_cp}/activate"
              payload: {}
              as: CareAssessor
            - call: "GET /policies/${pr_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { pr_v2: $.data.version }
            - call: "POST /claims"
              payload: { policy_id: "${pr_id}", care_plan_id: "${pr_cp}", service_month: "2026-03", expected_policy_version: "${pr_v2}" }
              as: ClaimsExaminer
              captures: { pr_claim: $.data.id }
            - call: "POST /claims/${pr_claim}/lines"
              payload: { service_date: "2026-03-01", billed_charge_cents: 15000 }
              as: ClaimsExaminer
            - call: "POST /claims/${pr_claim}/lines"
              payload: { service_date: "2026-03-02", billed_charge_cents: 25000 }
              as: ClaimsExaminer
            - call: "POST /claims/${pr_claim}/lines"
              payload: { service_date: "2026-03-03", billed_charge_cents: 18000 }
              as: ClaimsExaminer
            - call: "POST /claims/${pr_claim}/start-review"
              payload: {}
              as: ClaimsExaminer
            # ---- INDEMNITY policy ----
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "INDEMNITY", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pi_id: $.data.id }
            - call: "POST /policies/${pi_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pi_id}/premium-invoices"
              payload: { period_index: 0, base_premium_cents: 12000, due_date: "2026-01-31", grace_deadline: "2026-04-06" }
              as: Underwriter
              captures: { pi_inv0: $.data.id }
            - call: "POST /premium-invoices/${pi_inv0}/pay"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /policies/${pi_id}/trigger-certifications"
              payload: { adl_deficiencies: ["BATHING", "DRESSING"], cognitive_impairment: false }
              as: CareAssessor
            - call: "POST /care-plans"
              payload: { policy_id: "${pi_id}", provider_id: "${prov_id}", care_setting: "NURSING_HOME" }
              as: CareAssessor
              captures: { pi_cp: $.data.id }
            - call: "POST /care-plans/${pi_cp}/activate"
              payload: {}
              as: CareAssessor
            - call: "GET /policies/${pi_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { pi_v2: $.data.version }
            - call: "POST /claims"
              payload: { policy_id: "${pi_id}", care_plan_id: "${pi_cp}", service_month: "2026-03", expected_policy_version: "${pi_v2}" }
              as: ClaimsExaminer
              captures: { pi_claim: $.data.id }
            - call: "POST /claims/${pi_claim}/lines"
              payload: { service_date: "2026-03-01", billed_charge_cents: 15000 }
              as: ClaimsExaminer
            - call: "POST /claims/${pi_claim}/lines"
              payload: { service_date: "2026-03-02", billed_charge_cents: 25000 }
              as: ClaimsExaminer
            - call: "POST /claims/${pi_claim}/lines"
              payload: { service_date: "2026-03-03", billed_charge_cents: 18000 }
              as: ClaimsExaminer
            - call: "POST /claims/${pi_claim}/start-review"
              payload: {}
              as: ClaimsExaminer
          trigger:
            - call: "GET /policies/${pr_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { pr_v3: $.data.version }
            - call: "POST /claims/${pr_claim}/approve"
              payload: { expected_policy_version: "${pr_v3}" }
              as: ClaimsExaminer
            - call: "GET /policies/${pi_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { pi_v3: $.data.version }
            - call: "POST /claims/${pi_claim}/approve"
              payload: { expected_policy_version: "${pi_v3}" }
              as: ClaimsExaminer
          assert:
            - "Claim.${pr_claim}.month_paid_cents == 53000"
            - "Claim.${pi_claim}.month_paid_cents == 60000"
            - "Claim.${pi_claim}.month_paid_cents - Claim.${pr_claim}.month_paid_cents == 7000"

      - name: premium_amount_increase_vs_no_increase_variant
        grounds:
          - calculations.premium_amount
          - entities.PremiumInvoice.fields.amount_cents
          - state_machines.RateIncreaseFiling.FILED_to_APPROVED
        distinguishing_aspect: |
          On the Policy/PremiumInvoice domain (distinct from the Claim payout domain), the same
          base_premium_cents 12000 yields 12000 with no applicable filing but 16800 once a +40%
          filing is APPROVED at the invoice's period_index.
        test_recipe:
          setup:
            - "An IN_FORCE policy with a +40% RateIncreaseFiling APPROVED effective at period_index 1; invoice for period 0 has no increase, invoice for period 1 carries the increase."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Rae Rate", state_code: "CA", date_of_birth: "1950-05-05" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/premium-invoices"
              payload: { period_index: 0, base_premium_cents: 12000, due_date: "2026-01-31", grace_deadline: "2026-04-06" }
              as: Underwriter
              captures: { inv0: $.data.id }
            - call: "POST /rate-filings"
              payload: { policy_id: "${pol_id}", requested_increase_pct: 40, effective_period_index: 1 }
              as: Underwriter
              captures: { fil_id: $.data.id }
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Regulator
              captures: { pol_v: $.data.version }
            - call: "POST /rate-filings/${fil_id}/adjudicate"
              payload: { granted_pct: 40, expected_policy_version: "${pol_v}" }
              as: Regulator
          trigger:
            - call: "POST /policies/${pol_id}/premium-invoices"
              payload: { period_index: 1, base_premium_cents: 12000, due_date: "2026-02-28", grace_deadline: "2026-05-04" }
              as: Underwriter
              captures: { inv1: $.data.id }
          assert:
            - "PremiumInvoice.${inv0}.amount_cents == 12000"
            - "PremiumInvoice.${inv1}.amount_cents == 16800"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: claim_payout_nested_min_over_charge_cap_monthly_pool
        grounds:
          - calculations.claim_benefit_payout
          - entities.Policy.fields.monthly_benefit_max_cents
          - entities.ClaimLine.fields.benefit_paid_cents
        distinguishing_aspect: |
          Mode (a): a 4-input nested-min day formula (min of charge|cap, monthly headroom, pool
          remaining) with a branch on product_mode — INDEMNITY with monthly_max 45000 pays
          20000+20000+5000 because the monthly cap clamps the third day, not the daily cap.
        test_recipe:
          setup:
            - "An IN_FORCE INDEMNITY policy daily_max=20000 monthly_max=45000 pool=10000000 inflation NONE elim=0, benefits triggered, premium current, ACTIVE care plan, claim UNDER_REVIEW with three qualifying lines (charges 15000/25000/18000) in 2026-03."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Cap Test", state_code: "CA", date_of_birth: "1949-09-09" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Cap NH", provider_type: "NURSING_HOME", state_code: "CA" }
              as: CareAssessor
              captures: { prov_id: $.data.id }
            - call: "POST /providers/${prov_id}/certify"
              payload: {}
              as: CareAssessor
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "INDEMNITY", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 45000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/premium-invoices"
              payload: { period_index: 0, base_premium_cents: 12000, due_date: "2026-01-31", grace_deadline: "2026-04-06" }
              as: Underwriter
              captures: { inv0: $.data.id }
            - call: "POST /premium-invoices/${inv0}/pay"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /policies/${pol_id}/trigger-certifications"
              payload: { adl_deficiencies: ["BATHING", "TOILETING"], cognitive_impairment: false }
              as: CareAssessor
            - call: "POST /care-plans"
              payload: { policy_id: "${pol_id}", provider_id: "${prov_id}", care_setting: "NURSING_HOME" }
              as: CareAssessor
              captures: { cp_id: $.data.id }
            - call: "POST /care-plans/${cp_id}/activate"
              payload: {}
              as: CareAssessor
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { pol_v: $.data.version }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", care_plan_id: "${cp_id}", service_month: "2026-03", expected_policy_version: "${pol_v}" }
              as: ClaimsExaminer
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/lines"
              payload: { service_date: "2026-03-01", billed_charge_cents: 15000 }
              as: ClaimsExaminer
            - call: "POST /claims/${claim_id}/lines"
              payload: { service_date: "2026-03-02", billed_charge_cents: 25000 }
              as: ClaimsExaminer
            - call: "POST /claims/${claim_id}/lines"
              payload: { service_date: "2026-03-03", billed_charge_cents: 18000 }
              as: ClaimsExaminer
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsExaminer
          trigger:
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { pol_v2: $.data.version }
            - call: "POST /claims/${claim_id}/approve"
              payload: { expected_policy_version: "${pol_v2}" }
              as: ClaimsExaminer
          assert:
            - "Claim.${claim_id}.month_paid_cents == 45000"

      - name: inflation_growth_per_year_rounding_order_pinned
        grounds:
          - calculations.inflation_growth
          - entities.Policy.fields.inflated_daily_max_cents
          - entities.Policy.fields.inflation_years_elapsed
          - state_machines.Policy.coverage_status
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — daily_max 20015 at COMPOUND_3PCT over
          2 anniversaries compounds-then-rounds PER YEAR to 21233, whereas round-once-at-end
          gives 21234; the scaffold pins per-year rounding so 21233 is the only correct value.
        test_recipe:
          setup:
            - "An IN_FORCE policy daily_max=20015 inflation COMPOUND_3PCT, after two apply-anniversary calls (inflation_years_elapsed == 2)."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Inf Test", state_code: "CA", date_of_birth: "1947-07-07" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20015, monthly_benefit_max_cents: 600450, initial_pool_cents: 7305475, inflation_rider: "COMPOUND_3PCT", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/apply-anniversary"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/apply-anniversary"
              payload: {}
              as: Underwriter
          trigger:
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { final_daily: $.data.inflated_daily_max_cents }
          assert:
            - "Policy.${pol_id}.inflation_years_elapsed == 2"
            - "Policy.${pol_id}.inflated_daily_max_cents == 21233"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: policy_parallel_coverage_and_premium_axes
        grounds:
          - state_machines.Policy.coverage_status
          - state_machines.Policy.premium_status
          - entities.Policy.fields.coverage_status
          - entities.Policy.fields.premium_status
        distinguishing_aspect: |
          Parallel dimensions on ONE entity: Policy.coverage_status advances APPLIED->IN_FORCE
          while Policy.premium_status independently advances PENDING->PAID_CURRENT->GRACE without
          touching coverage_status — the two axes evolve on the same row independently.
        test_recipe:
          setup:
            - "An IN_FORCE policy whose first invoice is unpaid; the clock is advanced past the due date but within grace so premium_status becomes GRACE while coverage_status stays IN_FORCE."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Para Llel", state_code: "CA", date_of_birth: "1946-06-06" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/premium-invoices"
              payload: { period_index: 0, base_premium_cents: 12000, due_date: "2026-01-31", grace_deadline: "2026-04-06" }
              as: Underwriter
              captures: { inv0: $.data.id }
            - call: "POST /premium-invoices/${inv0}/pay"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /policies/${pol_id}/premium-invoices"
              payload: { period_index: 1, base_premium_cents: 12000, due_date: "2026-02-28", grace_deadline: "2026-05-04" }
              as: Underwriter
              captures: { inv1: $.data.id }
          trigger:
            - call: "POST /_clock/advance_to"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: Underwriter
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { cov: $.data.coverage_status, prem: $.data.premium_status }
          assert:
            - "Policy.${pol_id}.coverage_status == IN_FORCE"
            - "Policy.${pol_id}.premium_status == GRACE"

      - name: claim_cyclic_reassessment_loop
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_PENDING_REASSESSMENT
          - state_machines.Claim.PENDING_REASSESSMENT_to_UNDER_REVIEW
          - entities.Claim.fields.requires_reassessment
        distinguishing_aspect: |
          Cycle on a different entity (Claim, not Policy): UNDER_REVIEW -> PENDING_REASSESSMENT
          -> UNDER_REVIEW, with requires_reassessment toggling true then false on the round-trip.
        test_recipe:
          setup:
            - "A claim UNDER_REVIEW on a benefits-triggered policy with an ACTIVE care plan on an ELIGIBLE provider."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Cy Clic", state_code: "CA", date_of_birth: "1945-05-05" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Loop NH", provider_type: "NURSING_HOME", state_code: "CA" }
              as: CareAssessor
              captures: { prov_id: $.data.id }
            - call: "POST /providers/${prov_id}/certify"
              payload: {}
              as: CareAssessor
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/premium-invoices"
              payload: { period_index: 0, base_premium_cents: 12000, due_date: "2026-01-31", grace_deadline: "2026-04-06" }
              as: Underwriter
              captures: { inv0: $.data.id }
            - call: "POST /premium-invoices/${inv0}/pay"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /policies/${pol_id}/trigger-certifications"
              payload: { adl_deficiencies: ["BATHING", "DRESSING"], cognitive_impairment: false }
              as: CareAssessor
              captures: { cert1: $.data.id }
            - call: "POST /care-plans"
              payload: { policy_id: "${pol_id}", provider_id: "${prov_id}", care_setting: "NURSING_HOME" }
              as: CareAssessor
              captures: { cp_id: $.data.id }
            - call: "POST /care-plans/${cp_id}/activate"
              payload: {}
              as: CareAssessor
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { pol_v: $.data.version }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", care_plan_id: "${cp_id}", service_month: "2026-03", expected_policy_version: "${pol_v}" }
              as: ClaimsExaminer
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsExaminer
          trigger:
            - call: "POST /claims/${claim_id}/request-reassessment"
              payload: {}
              as: ClaimsExaminer
              captures: { st_pending: $.data.status, rr_true: $.data.requires_reassessment }
            - call: "POST /policies/${pol_id}/trigger-certifications"
              payload: { adl_deficiencies: ["BATHING", "DRESSING", "EATING"], cognitive_impairment: false, supersedes_id: "${cert1}" }
              as: CareAssessor
            - call: "POST /claims/${claim_id}/resume-review"
              payload: {}
              as: ClaimsExaminer
              captures: { st_review: $.data.status, rr_false: $.data.requires_reassessment }
          assert:
            - "Claim.${claim_id}.status after request-reassessment == PENDING_REASSESSMENT"
            - "Claim.${claim_id}.requires_reassessment == true after request-reassessment"
            - "Claim.${claim_id}.status after resume-review == UNDER_REVIEW"
            - "Claim.${claim_id}.requires_reassessment == false after resume-review"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: approve_claim_depth4_ledger_pool_partnership
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - calculations.claim_benefit_payout
          - calculations.partnership_disregard
          - entities.BenefitLedgerEntry.fields.amount_cents
          - entities.BenefitPool.fields.lifetime_paid_cents
          - entities.PartnershipDisregard.fields.protected_asset_cents
        distinguishing_aspect: |
          Depth-4 chain from claim approve: approve -> append CLAIM_PAYMENT BenefitLedgerEntry
          -> recompute BenefitPool.lifetime_paid_cents/remaining_pool_cents -> recompute
          PartnershipDisregard.protected_asset_cents. Each hop is caused by the prior hop's mutation.
        test_recipe:
          setup:
            - "An IN_FORCE REIMBURSEMENT partnership policy (is_partnership_policy true), benefits triggered, premium current, ACTIVE care plan, claim UNDER_REVIEW with three qualifying lines 15000/25000/18000 in 2026-03; pool 10000000 daily_max 20000 monthly_max 600000 elim 0."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Casc Ade", state_code: "CA", date_of_birth: "1944-04-04", medicaid_state_eligible: true }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Casc NH", provider_type: "NURSING_HOME", state_code: "CA" }
              as: CareAssessor
              captures: { prov_id: $.data.id }
            - call: "POST /providers/${prov_id}/certify"
              payload: {}
