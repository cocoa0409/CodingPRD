            - "PunchItem.${it}.status == VERIFIED"
            - "TradePackage.${ta}.open_item_count == 0 AND closeout_ready == true (link 1 -> link 2)"
            - "Project.${pa}.status == FINAL_RELEASE_PENDING (link 3 fired automatically — no direct project call)"

      - name: waiver_accept_cascades_trade_ready_to_project_advance
        grounds:
          - state_machines.TradePackage.SUBMITTED_to_ACCEPTED
          - calculations.trade_closeout_ready
          - state_machines.Project.CLOSEOUT_IN_PROGRESS_to_FINAL_RELEASE_PENDING
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger (lien-waiver-decision ACCEPT, not item
