        claim_type: violation_to_error
        grounds: ["concurrency_rules[machine-modification-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Optimistic concurrency: a modification carrying the pre-first-write version is rejected 412 ERR_STALE_VERSION after the first modification advanced Machine.version; each success increments version by exactly 1."
        test_recipe:
          setup: ["Machine M created (version captured); no procedure needed"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-OCC", full_name: "Mgr OCC", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /machines"
              payload: { asset_tag: "A-OCC-1", name: "Press", area: "Bay 44", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id, m_v: $.data.version }
          trigger:
            - call: "POST /machines/${m}/modifications"
              payload: { description: "First: new guard", expected_machine_version: "${m_v}" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { mod1: $.data.id }
            - call: "POST /machines/${m}/modifications"
              payload: { description: "Second: stale view", expected_machine_version: "${m_v}" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { err: $.data.error_id }
            - call: "GET /machines/${m}"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m_v2: $.data.version }
            - call: "POST /machines/${m}/modifications"
              payload: { description: "Third: fresh view", expected_machine_version: "${m_v2}" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { mod3: $.data.id }
          assert:
            - "First modification ${mod1} succeeds (201); Machine.${m}.version advanced to ${m_v} + 1"
            - "Second modification with the stale version: ${err} == ERR_STALE_VERSION (http 412)"
            - "Third modification with the fresh version ${m_v2} succeeds (201): MachineModification.${mod3} exists"
            - "GET /machines/${m}/modifications returns total_count == 2"

      - name: modification_cascade_layer_covered
        claim_type: side_effect_execution
        grounds: ["complexity_profile.complexity_layers[1]"]
        excluded_because:
          difficulty_instance: modification_cascade_to_locks
          rationale: "The cascading_side_effects layer is exercised end-to-end (depth 3) by the named §1.8 instance."
      - name: rate_threshold_layer_covered
        claim_type: correct_result
        grounds: ["complexity_profile.complexity_layers[2]"]
        excluded_because:
          difficulty_instance: audit_due_instant_boundary
          rationale: "The rate_threshold_triggers layer is exercised at exact boundary precision by the named §1.8 instance (and by risk-tier thresholds in incident_link_high_risk_cascade)."
      - name: version_pinning_layer_covered
        claim_type: side_effect_execution
        grounds: ["complexity_profile.complexity_layers[3]"]
        excluded_because:
          difficulty_instance: pinned_capacity_survives_procedure_supersede
          rationale: "The version_pinning_on_approval layer is the subject of the named §1.8 instance."

