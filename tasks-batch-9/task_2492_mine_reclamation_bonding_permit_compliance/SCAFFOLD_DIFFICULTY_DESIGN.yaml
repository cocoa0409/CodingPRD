  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: forfeiture_finalize_cascade_reaches_second_permit_bond_deficiency
        grounds:
          - state_machines.ForfeitureProceeding.INITIATED_to_FINAL
          - state_machines.Permit.status.ISSUED_to_FORFEITED
          - state_machines.Operator.self_bond_status.QUALIFIED_to_DISQUALIFIED
          - state_machines.BondInstrument.ACCEPTED_to_SUBSTITUTION_REQUIRED
          - calculations.forfeiture_settlement
          - calculations.permit_compliance_posture
        distinguishing_aspect: |
          Depth-4 cascade triggered by ForfeitureProceeding finalize: link 1
          proceeding -> FINAL causes link 2 permit A -> FORFEITED, which causes
          link 3 operator -> DISQUALIFIED, which causes link 4 the operator's
          SELF_BOND instrument on the untouched permit B -> SUBSTITUTION_REQUIRED
          and permit B -> BOND_DEFICIENT; each link is caused by the previous
          link, not by the finalize call.
        test_recipe:
          setup:
            - "One operator QUALIFIED for self-bonding with capacity 10000000.00 (TNW 40000000.00, liabilities 8000000.00, net income 5000000.00)."
            - "Permit A on site A: 120 acres, bond_required 865998.00, covered by a 900000.00 CASH instrument, ISSUED, then expanded by an approved 60-acre EXPANSION revision so bond_required is 1298997.00, bond_deficiency_amount 398997.00 and compliance_posture BOND_DEFICIENT."
            - "Permit B on site B: 20 acres, bond_required 144700.00, covered by a 144700.00 SELF_BOND instrument, ISSUED, COMPLIANT."
            - "A ForfeitureProceeding opened on permit A for BOND_DEFICIENCY_UNCURED at clock 2026-08-01 (contest_deadline 2026-08-31); clock then advanced to 2026-09-05, past the contest window."
