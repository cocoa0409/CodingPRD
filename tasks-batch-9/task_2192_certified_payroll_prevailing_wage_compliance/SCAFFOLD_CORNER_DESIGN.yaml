scaffold_corner_design:
  - section: entities
    instances:
      - name: create_reporting_portal_returns_201_with_stored_fields
        claim_type: creation
        grounds:
          - entities.ReportingPortal
          - endpoints.POST /reporting-portals
        distinguishing_aspect: "A portal created with every declared input field echoes those exact values back in data and mints an id plus created_at; nothing about the filing window is derived at this point."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /reporting-portals"
              payload: { portal_code: "LCPTRACKER_CA", submission_format: "XML_LCP", cutoff_offset_days: 10, grace_hours: 0, requires_notarized_statement: false }
              as: PortalAdmin
              captures: { portal_id: $.data.id }
          assert:
            - "response.status == 201"
            - "response.response_type == object"
            - "ReportingPortal.${portal_id}.portal_code == LCPTRACKER_CA"
            - "ReportingPortal.${portal_id}.submission_format == XML_LCP"
            - "ReportingPortal.${portal_id}.cutoff_offset_days == 10"
            - "ReportingPortal.${portal_id}.grace_hours == 0"
            - "ReportingPortal.${portal_id}.requires_notarized_statement == false"

      - name: get_contractor_by_id_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.Contractor
          - endpoints.GET /contractors/{id}
        distinguishing_aspect: "A freshly created contractor reads back with its input fields intact and its derived compliance counters at their initial values (debarment_status CLEAR, debarment_risk_score 0, outstanding_restitution_cents 0)."
        test_recipe:
          setup:
            - "One contractor 'Acme Electric' with DIR registration PW-1001 exists and has never been cited."
          setup_api_calls:
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
              captures: { prime_id: $.data.id }
          trigger:
            - call: "GET /contractors/${prime_id}"
              payload: {}
              as: AgencyComplianceOfficer
              as_user_id: "officer-anna"
          assert:
            - "response.status == 200"
            - "Contractor.${prime_id}.legal_name == Acme Electric"
            - "Contractor.${prime_id}.dir_registration_number == PW-1001"
            - "Contractor.${prime_id}.debarment_status == CLEAR"
            - "Contractor.${prime_id}.debarment_risk_score == 0"
            - "Contractor.${prime_id}.outstanding_restitution_cents == 0"
            - "Contractor.${prime_id}.version == 1"

      - name: list_contractors_honours_limit_offset_and_pagination_counters
        claim_type: listing
        grounds:
          - endpoints.GET /contractors
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three contractors stored, limit 2 / offset 0 returns exactly two rows with total_count 3 and has_more true, so the counters describe the whole filtered set and not just the returned page."
        test_recipe:
          setup:
            - "Three contractors exist: Acme Electric, Bay Conduit and Central Wiring."
          setup_api_calls:
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Bay Conduit", dir_registration_number: "PW-1002" }
              as: PortalAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Central Wiring", dir_registration_number: "PW-1003" }
              as: PortalAdmin
          trigger:
            - call: "GET /contractors"
              payload: { limit: 2, offset: 0 }
              as: PortalAdmin
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response.data.length == 2"
            - "response.total_count == 3"
            - "response.has_more == true"
            - "response.limit == 2"
            - "response.offset == 0"

      - name: get_contractor_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET /contractors/{id}
          - errors[ERR_CONTRACTOR_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unstored UUID must produce the contractor-specific 404 rather than a generic 400 or an empty 200 body."
        test_recipe:
          setup:
            - "One unrelated contractor exists so the collection is non-empty."
          setup_api_calls:
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
          trigger:
            - call: "GET /contractors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PortalAdmin
          assert:
            - "response.status == 404"
            - "response.response_type == error"
            - "response.data.error_id == ERR_CONTRACTOR_NOT_FOUND"

      - name: create_wage_determination_without_locality_code_is_rejected
        claim_type: required_fields
        grounds:
          - entities.WageDetermination.fields.locality_code
          - endpoints.POST /wage-determinations
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "locality_code is an input field with no default, so omitting it fails body-shape validation at priority 7 with 422 and no determination row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", modification_number: 0, effective_date: "2026-01-01T00:00:00.000Z" }
              as: PortalAdmin
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: omitting_modification_number_applies_zero_default
        claim_type: defaults
        grounds:
          - entities.WageDetermination.fields.modification_number
          - endpoints.POST /wage-determinations
        distinguishing_aspect: "modification_number declares default 0, so a determination created without it stores 0 rather than null, and status defaults to DRAFT with rate_count 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", locality_code: "CA-ALAMEDA", effective_date: "2026-01-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_id: $.data.id }
          assert:
            - "response.status == 201"
            - "WageDetermination.${wd_id}.modification_number == 0"
            - "WageDetermination.${wd_id}.status == DRAFT"
            - "WageDetermination.${wd_id}.rate_count == 0"
            - "WageDetermination.${wd_id}.expiry_date == null"
            - "WageDetermination.${wd_id}.superseded_by_id == null"

      - name: fringe_plan_annualized_credit_is_computed_not_accepted_from_input
        claim_type: computed_fields
        grounds:
          - entities.FringeBenefitPlan.fields.annualized_credit_cents
          - calculations.fringe_hourly_credit
          - endpoints.POST /contractors/{id}/fringe-plans
        distinguishing_aspect: "annualized_credit_cents and claimed_credit_cents are source computed: they are derived from annual_contribution_cents divided by the two hour bases at creation time, and approval_status starts at PENDING_APPROVAL rather than being supplied."
        test_recipe:
          setup:
            - "One contractor with one PREPARER staff member exists."
          setup_api_calls:
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
              captures: { prime_id: $.data.id }
            - call: "POST /contractors/${prime_id}/staff"
              payload: { full_name: "Pat Prep", capability: "PREPARER" }
              as: PortalAdmin
              captures: { staff_prep_id: $.data.id }
          trigger:
            - call: "POST /contractors/${prime_id}/fringe-plans"
              payload: { plan_name: "IBEW Trust B", plan_type: "BONA_FIDE_TRUST", annual_contribution_cents: 420000, annual_total_hours: 2100.00, annual_public_works_hours: 2100.00 }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { plan_id: $.data.id }
          assert:
            - "response.status == 201"
            - "FringeBenefitPlan.${plan_id}.annualized_credit_cents == 200"
            - "FringeBenefitPlan.${plan_id}.claimed_credit_cents == 200"
            - "FringeBenefitPlan.${plan_id}.approval_status == PENDING_APPROVAL"

      - name: worker_id_and_created_at_are_system_minted
        claim_type: system_fields
        grounds:
          - entities.Worker
          - endpoints.POST /workers
        distinguishing_aspect: "The Worker row receives a server-minted UUID id, a created_at stamp and version 1 even though none of the three appear in the endpoint's input list, and the caller cannot influence them."
        test_recipe:
          setup:
            - "One contractor with one PREPARER staff member exists."
          setup_api_calls:
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
              captures: { prime_id: $.data.id }
            - call: "POST /contractors/${prime_id}/staff"
              payload: { full_name: "Pat Prep", capability: "PREPARER" }
              as: PortalAdmin
              captures: { staff_prep_id: $.data.id }
          trigger:
            - call: "POST /workers"
              payload: { employer_contractor_id: "${prime_id}", worker_number: "W-001", full_name: "Jo Journey", default_classification_code: "ELEC-INSIDE-JW" }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { w1_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Worker.${w1_id}.version == 1"
            - "Worker.${w1_id}.employer_contractor_id == ${prime_id}"
            - "Worker.${w1_id}.worker_number == W-001"

      - name: staff_capability_outside_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.ContractorStaff.fields.capability
          - endpoints.POST /contractors/{id}/staff
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "capability is constrained to {PREPARER, CERTIFIER, BOTH}; a plausible-looking value such as SIGNER must be refused at priority 7 with 422 rather than stored verbatim."
        test_recipe:
          setup:
            - "One contractor exists."
          setup_api_calls:
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
              captures: { prime_id: $.data.id }
          trigger:
            - call: "POST /contractors/${prime_id}/staff"
              payload: { full_name: "Sid Signer", capability: "SIGNER" }
              as: PortalAdmin
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: payroll_line_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.PayrollLine
          - endpoints.POST /payroll-submissions/{id}/lines
          - endpoints.GET /payroll-lines
        distinguishing_aspect: "PayrollLine declares common_fields false, so the created row exposes only id and created_at plus its own fields — no version, no updated_at — and §1.5 offers no PATCH or DELETE for it, only creation and reads."
        test_recipe:
          setup:
            - "ACTIVE project in CA-ALAMEDA on an ACTIVE determination whose ELEC-INSIDE-JW BASE rate is 5000 base + 2000 fringe; prime tier ACTIVE; one journeyworker; one DRAFT payroll for week ending 2026-08-01."
          setup_api_calls:
            - call: "POST /reporting-portals"
              payload: { portal_code: "LCPTRACKER_CA", submission_format: "XML_LCP", cutoff_offset_days: 10, grace_hours: 0, requires_notarized_statement: false }
              as: PortalAdmin
              captures: { portal_id: $.data.id }
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-01-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_id: $.data.id }
            - call: "POST /wage-determinations/${wd_id}/wage-rates"
              payload: { classification_code: "ELEC-INSIDE-JW", trade_code: "ELEC", zone_code: "BASE", base_hourly_rate_cents: 5000, fringe_hourly_rate_cents: 2000, zone_adjustment_cents: 0, apprentice_scale_pct: [50, 60, 70, 80] }
              as: PortalAdmin
            - call: "POST /wage-determinations/${wd_id}/activate"
              payload: {}
              as: PortalAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
              captures: { prime_id: $.data.id }
            - call: "POST /contractors/${prime_id}/staff"
              payload: { full_name: "Pat Prep", capability: "PREPARER" }
              as: PortalAdmin
              captures: { staff_prep_id: $.data.id }
            - call: "POST /projects"
              payload: { project_name: "Alameda Transit Center", awarding_agency: "City of Alameda", locality_code: "CA-ALAMEDA", zone_code: "BASE", wage_determination_id: "${wd_id}", reporting_portal_id: "${portal_id}", funding_source: "FEDERAL_DAVIS_BACON", contract_award_date: "2026-02-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/contract-assignments"
              payload: { contractor_id: "${prime_id}", subcontract_amount_cents: 100000000 }
              as: PortalAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /contract-assignments/${ca_id}/activate"
              payload: {}
              as: PortalAdmin
              captures: { ca_v: $.data.version }
            - call: "POST /projects/${proj_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PortalAdmin
            - call: "POST /workers"
              payload: { employer_contractor_id: "${prime_id}", worker_number: "W-001", full_name: "Jo Journey", default_classification_code: "ELEC-INSIDE-JW" }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /payroll-submissions"
              payload: { contract_assignment_id: "${ca_id}", week_ending_date: "2026-08-01T00:00:00.000Z", prepared_by_staff_id: "${staff_prep_id}", expected_contract_assignment_version: "${ca_v}" }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /payroll-submissions/${sub_id}/lines"
              payload: { worker_id: "${w1_id}", classification_code: "ELEC-INSIDE-JW", straight_hours: 40.00, overtime_hours: 0.00, base_rate_paid_cents: 5000, overtime_rate_paid_cents: 0, fringe_cash_paid_cents: 2000, reported_as_apprentice: false }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { line_id: $.data.id }
          assert:
            - "response.status == 201"
            - "PayrollLine.${line_id}.required_base_cents == 5000"
            - "PayrollLine.${line_id}.required_fringe_cents == 2000"
            - "PayrollLine.${line_id}.line_underpayment_cents == 0"
            - "PayrollLine.${line_id}.version == absent"

      - name: wage_rate_creation_requires_an_existing_parent_determination
        claim_type: parent_relationships
        grounds:
          - entities.WageRate.parent
          - endpoints.POST /wage-determinations/{id}/wage-rates
          - errors[ERR_DETERMINATION_NOT_FOUND]
        distinguishing_aspect: "WageRate is a child of WageDetermination, so a rate posted under an unstored determination id fails with the parent's 404 and never lands as an orphan row."
        test_recipe:
          setup:
            - "One unrelated DRAFT determination exists so the collection is non-empty."
          setup_api_calls:
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-01-01T00:00:00.000Z" }
              as: PortalAdmin
          trigger:
            - call: "POST /wage-determinations/00000000-0000-4000-8000-000000000000/wage-rates"
              payload: { classification_code: "ELEC-INSIDE-JW", trade_code: "ELEC", zone_code: "BASE", base_hourly_rate_cents: 5000, fringe_hourly_rate_cents: 2000, zone_adjustment_cents: 0, apprentice_scale_pct: [50, 60, 70, 80] }
              as: PortalAdmin
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_DETERMINATION_NOT_FOUND"

      - name: self_referential_subcontract_tier_graph_is_navigable_both_ways
        claim_type: graph_topology
        grounds:
          - entities.ContractAssignment.fields.upper_tier_assignment_id
          - entities.ContractAssignment.fields.tier
          - endpoints.GET /contract-assignments
        distinguishing_aspect: "entity_topology is graph: a second-tier assignment points at its prime through the self-referential upper_tier_assignment_id, the server derives tier 1 from the prime's tier 0, and GET /contract-assignments?upper_tier_assignment_id resolves the reverse direction of that self edge."
        test_recipe:
          setup:
            - "An AWARDED project in CA-ALAMEDA on an ACTIVE determination."
            - "Prime contractor Acme Electric holds an ACTIVE prime (tier 0) assignment; subcontractor Bay Conduit is registered and CLEAR."
          setup_api_calls:
            - call: "POST /reporting-portals"
              payload: { portal_code: "LCPTRACKER_CA", submission_format: "XML_LCP", cutoff_offset_days: 10, grace_hours: 0, requires_notarized_statement: false }
              as: PortalAdmin
              captures: { portal_id: $.data.id }
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-01-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_id: $.data.id }
            - call: "POST /wage-determinations/${wd_id}/wage-rates"
              payload: { classification_code: "ELEC-INSIDE-JW", trade_code: "ELEC", zone_code: "BASE", base_hourly_rate_cents: 5000, fringe_hourly_rate_cents: 2000, zone_adjustment_cents: 0, apprentice_scale_pct: [50, 60, 70, 80] }
              as: PortalAdmin
            - call: "POST /wage-determinations/${wd_id}/activate"
              payload: {}
              as: PortalAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
              captures: { prime_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Bay Conduit", dir_registration_number: "PW-1002" }
              as: PortalAdmin
              captures: { sub_id_c: $.data.id }
            - call: "POST /projects"
              payload: { project_name: "Alameda Transit Center", awarding_agency: "City of Alameda", locality_code: "CA-ALAMEDA", zone_code: "BASE", wage_determination_id: "${wd_id}", reporting_portal_id: "${portal_id}", funding_source: "FEDERAL_DAVIS_BACON", contract_award_date: "2026-02-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/contract-assignments"
              payload: { contractor_id: "${prime_id}", subcontract_amount_cents: 100000000 }
              as: PortalAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /contract-assignments/${a1_id}/activate"
              payload: {}
              as: PortalAdmin
          trigger:
            - call: "POST /projects/${proj_id}/contract-assignments"
              payload: { contractor_id: "${sub_id_c}", upper_tier_assignment_id: "${a1_id}", subcontract_amount_cents: 25000000 }
              as: PortalAdmin
              captures: { a2_id: $.data.id }
            - call: "GET /contract-assignments"
              payload: { upper_tier_assignment_id: "${a1_id}" }
              as: PortalAdmin
          assert:
            - "response.status == 200"
            - "response.data.length == 1"
            - "ContractAssignment.${a2_id}.tier == 1"
            - "ContractAssignment.${a2_id}.upper_tier_assignment_id == ${a1_id}"
            - "ContractAssignment.${a2_id}.status == INVITED"
            - "ContractAssignment.${a1_id}.tier == 0"

  - section: state_machines
    instances:
      - name: activate_determination_moves_draft_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.WageDetermination.status.DRAFT_to_ACTIVE
          - endpoints.POST /wage-determinations/{id}/activate
        distinguishing_aspect: "A DRAFT determination carrying one rate row activates cleanly, its status becomes ACTIVE, version increments to 2 and expiry_date stays null because no successor exists."
        test_recipe:
          setup:
            - "One DRAFT determination for CA-ALAMEDA with exactly one ELEC-INSIDE-JW BASE rate row."
          setup_api_calls:
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-01-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_id: $.data.id }
            - call: "POST /wage-determinations/${wd_id}/wage-rates"
              payload: { classification_code: "ELEC-INSIDE-JW", trade_code: "ELEC", zone_code: "BASE", base_hourly_rate_cents: 5000, fringe_hourly_rate_cents: 2000, zone_adjustment_cents: 0, apprentice_scale_pct: [50, 60, 70, 80] }
              as: PortalAdmin
          trigger:
            - call: "POST /wage-determinations/${wd_id}/activate"
              payload: {}
              as: PortalAdmin
          assert:
            - "response.status == 200"
            - "WageDetermination.${wd_id}.status == ACTIVE"
            - "WageDetermination.${wd_id}.rate_count == 1"
            - "WageDetermination.${wd_id}.expiry_date == null"
            - "WageDetermination.${wd_id}.version == 3"

      - name: activate_determination_without_rate_rows_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.WageDetermination.status.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_DETERMINATION_STATE]
        distinguishing_aspect: "The DRAFT_to_ACTIVE precondition rate_count >= 1 is independent of the from-state check: a DRAFT determination with zero rate rows is refused with 409 and stays DRAFT, so a locality can never be governed by an empty schedule."
        test_recipe:
          setup:
            - "One DRAFT determination for CA-ALAMEDA with no rate rows."
          setup_api_calls:
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-01-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_id: $.data.id }
          trigger:
            - call: "POST /wage-determinations/${wd_id}/activate"
              payload: {}
              as: PortalAdmin
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_DETERMINATION_STATE"
            - "WageDetermination.${wd_id}.status == DRAFT"
            - "WageDetermination.${wd_id}.rate_count == 0"

      - name: superseding_activation_stamps_predecessor_and_repoints_awarded_project
        claim_type: side_effect_execution
        grounds:
          - state_machines.WageDetermination.status.ACTIVE_to_SUPERSEDED
          - endpoints.POST /wage-determinations/{id}/activate
          - entities.Project.fields.wage_determination_id
        distinguishing_aspect: "Every declared side effect of the supersede transition must land in one call: the predecessor becomes SUPERSEDED with expiry_date equal to the successor's effective_date and superseded_by_id set, and cascade hop 2 re-points the AWARDED project onto the successor. The project is deliberately left AWARDED, which is the only status the re-point clause covers."
        test_recipe:
          setup:
            - "Determination A for CA-ALAMEDA is ACTIVE from 2026-01-01 with one ELEC rate."
            - "One AWARDED project points at determination A."
            - "Determination B for the same locality is DRAFT, effective 2026-06-01, with one ELEC rate."
          setup_api_calls:
            - call: "POST /reporting-portals"
              payload: { portal_code: "LCPTRACKER_CA", submission_format: "XML_LCP", cutoff_offset_days: 10, grace_hours: 0, requires_notarized_statement: false }
              as: PortalAdmin
              captures: { portal_id: $.data.id }
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-01-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_a_id: $.data.id }
            - call: "POST /wage-determinations/${wd_a_id}/wage-rates"
              payload: { classification_code: "ELEC-INSIDE-JW", trade_code: "ELEC", zone_code: "BASE", base_hourly_rate_cents: 5000, fringe_hourly_rate_cents: 2000, zone_adjustment_cents: 0, apprentice_scale_pct: [50, 60, 70, 80] }
              as: PortalAdmin
