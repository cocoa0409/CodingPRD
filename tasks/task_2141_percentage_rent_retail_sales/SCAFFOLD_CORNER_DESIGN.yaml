scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_center_returns_201_with_derived_zero_metrics
        claim_type: Creation
        grounds:
          - entities.ShoppingCenter.fields.occupied_gla_sqft
          - entities.ShoppingCenter.fields.occupancy_bps
          - entities.ShoppingCenter.fields.open_anchor_count
        distinguishing_aspect: "A freshly created ShoppingCenter returns 201 with occupied_gla_sqft 0, occupancy_bps 0, open_anchor_count 0 and version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "GET /_clock"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000, fiscal_year_start_month: 9 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "data.occupied_gla_sqft == 0 and data.occupancy_bps == 0 and data.open_anchor_count == 0"
            - "data.version == 1 and data.code == \"NGC\" and data.fiscal_year_start_month == 9"

      - name: center_fiscal_year_start_month_defaults_to_one
        claim_type: Defaults
        grounds:
          - entities.ShoppingCenter.fields.fiscal_year_start_month
        distinguishing_aspect: "Omitting the optional fiscal_year_start_month yields the declared default 1, not null and not the current month."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /_clock"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /retail/centers"
              payload: { name: "Southgate Plaza", code: "SGP", total_gla_sqft: 250000, anchor_gla_sqft: 100000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
          assert:
            - "data.fiscal_year_start_month == 1"

      - name: tenant_created_in_prospect_with_derived_is_anchor
        claim_type: Computed Fields
        grounds:
          - entities.Tenant.fields.status
          - entities.Tenant.fields.is_anchor
        distinguishing_aspect: "A JUNIOR_ANCHOR tenant is created with status PROSPECT and is_anchor true derived from category, while an INLINE tenant gets is_anchor false; an is_anchor value supplied by the client is ignored."
        test_recipe:
          setup:
            - "One shopping center exists."
          setup_api_calls:
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
          trigger:
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Junior Box LLC", trade_name: "JuniorBox", category: "JUNIOR_ANCHOR", gla_sqft: 40000 }
              as: CenterAdmin
              captures: { ja_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Small Shop LLC", trade_name: "SmallShop", category: "INLINE", gla_sqft: 2000 }
              as: LeaseAdministrator
              captures: { inline_id: $.data.id }
          assert:
            - "Tenant.${ja_id}.status == PROSPECT and Tenant.${ja_id}.is_anchor == true"
            - "Tenant.${inline_id}.is_anchor == false"
            - "ShoppingCenter.${center_id}.open_anchor_count == 0 (a PROSPECT anchor is not OPERATING)"

      - name: lease_natural_breakpoint_is_computed_from_base_rent_and_rate
        claim_type: Computed Fields
        grounds:
          - entities.Lease.fields.natural_breakpoint_cents
          - entities.Lease.fields.effective_breakpoint_cents
        distinguishing_aspect: "natural_breakpoint_cents == round_half_up(12000000 * 10000 / 600) == 200000000 and, because breakpoint_type is NATURAL, effective_breakpoint_cents equals it exactly."
        test_recipe:
          setup:
            - "One shopping center and one INLINE tenant exist."
          setup_api_calls:
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Natural BP LLC", trade_name: "NatShop", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { tenant_id: $.data.id }
          trigger:
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${tenant_id}", suite_code: "3101", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "NATURAL", billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_id: $.data.id }
          assert:
            - "data.natural_breakpoint_cents == 200000000"
            - "data.effective_breakpoint_cents == 200000000"
            - "data.artificial_breakpoint_cents is null"
            - "data.status == DRAFT and data.co_tenancy_status == COMPLIANT and data.delinquency_strikes == 0 and data.watchlist_status == NORMAL"

      - name: get_lease_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_LEASE_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /retail/leases/{id} returns 404 with ERR_LEASE_NOT_FOUND."
        test_recipe:
          setup:
            - "One shopping center exists; no lease has that id."
          setup_api_calls:
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
          trigger:
            - call: "GET /retail/leases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LeaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and data.error_id == \"ERR_LEASE_NOT_FOUND\""

      - name: create_lease_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required percentage_rate_bps on POST /retail/leases returns 400 ERR_INVALID_REQUEST and creates no Lease row."
        test_recipe:
          setup:
            - "One shopping center and one tenant exist."
          setup_api_calls:
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Missing Field LLC", trade_name: "MissShop", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { tenant_id: $.data.id }
          trigger:
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${tenant_id}", suite_code: "3201", leased_sqft: 4000, annual_base_rent_cents: 12000000, breakpoint_type: "NATURAL", billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /retail/leases with center_id=${center_id} returns 0 rows"

      - name: create_tenant_with_invalid_category_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Tenant.fields.category
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A category value outside {ANCHOR, JUNIOR_ANCHOR, INLINE, FOOD, KIOSK} returns 400 ERR_INVALID_REQUEST rather than being stored verbatim."
        test_recipe:
          setup:
            - "One shopping center exists."
          setup_api_calls:
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
          trigger:
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Bad Enum LLC", trade_name: "BadEnum", category: "POPUP", gla_sqft: 1000 }
              as: CenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /retail/tenants with center_id=${center_id} returns 0 rows"

      - name: create_lease_with_tenant_from_another_center_returns_center_mismatch
        claim_type: Parent Relationships
        grounds:
          - validations[priority=10]
          - errors[ERR_CENTER_MISMATCH]
          - entities.Lease.fields.tenant_id
        distinguishing_aspect: "Both the center and the tenant exist, so existence passes, but Tenant.center_id differs from the lease's center_id and the request is refused with 409 ERR_CENTER_MISMATCH."
        test_recipe:
          setup:
            - "Two shopping centers exist; the tenant belongs to the second one."
          setup_api_calls:
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_a_id: $.data.id }
            - call: "POST /retail/centers"
              payload: { name: "Southgate Plaza", code: "SGP", total_gla_sqft: 250000, anchor_gla_sqft: 100000 }
              as: CenterAdmin
              captures: { center_b_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_b_id}", legal_name: "Wrong Center LLC", trade_name: "WrongShop", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { tenant_b_id: $.data.id }
          trigger:
            - call: "POST /retail/leases"
              payload: { center_id: "${center_a_id}", tenant_id: "${tenant_b_id}", suite_code: "3301", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "NATURAL", billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == \"ERR_CENTER_MISMATCH\""
            - "GET /retail/leases with center_id=${center_a_id} returns 0 rows"

      - name: not_found_errors_for_every_unknown_resource_id
        claim_type: Not Found
        grounds:
          - errors[ERR_CENTER_NOT_FOUND]
          - errors[ERR_TENANT_NOT_FOUND]
          - errors[ERR_LEASE_YEAR_NOT_FOUND]
          - errors[ERR_SALES_REPORT_NOT_FOUND]
          - errors[ERR_CHARGE_NOT_FOUND]
          - errors[ERR_CO_TENANCY_CLAUSE_NOT_FOUND]
          - errors[ERR_CO_TENANCY_EVENT_NOT_FOUND]
          - errors[ERR_KICK_OUT_CLAUSE_NOT_FOUND]
          - errors[ERR_AUDIT_NOT_FOUND]
        distinguishing_aspect: "Each single-resource GET answers with its own entity-specific 404 error_id rather than one shared generic not-found code."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "GET /_clock"
              payload: {}
              as: LeaseAdministrator
          trigger:
            - call: "GET /retail/centers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: CenterAdmin
              captures: { e_center: $.data.error_id }
            - call: "GET /retail/tenants/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: CenterAdmin
              captures: { e_tenant: $.data.error_id }
            - call: "GET /retail/lease-years/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: LeaseAdministrator
              captures: { e_ly: $.data.error_id }
            - call: "GET /retail/sales-reports/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: LeaseAdministrator
              captures: { e_report: $.data.error_id }
            - call: "GET /retail/charges/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: LeaseAdministrator
              captures: { e_charge: $.data.error_id }
            - call: "GET /retail/co-tenancy-clauses/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: CenterAdmin
              captures: { e_clause: $.data.error_id }
            - call: "GET /retail/co-tenancy-events/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: CenterAdmin
              captures: { e_event: $.data.error_id }
            - call: "GET /retail/kick-out-clauses/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: CenterAdmin
              captures: { e_ko: $.data.error_id }
            - call: "GET /retail/audits/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: Auditor
              captures: { e_audit: $.data.error_id }
          assert:
            - "All nine calls return HTTP 404"
            - "The error_ids are, in order: ERR_CENTER_NOT_FOUND, ERR_TENANT_NOT_FOUND, ERR_LEASE_YEAR_NOT_FOUND, ERR_SALES_REPORT_NOT_FOUND, ERR_CHARGE_NOT_FOUND, ERR_CO_TENANCY_CLAUSE_NOT_FOUND, ERR_CO_TENANCY_EVENT_NOT_FOUND, ERR_KICK_OUT_CLAUSE_NOT_FOUND, ERR_AUDIT_NOT_FOUND"

      - name: list_leases_honours_limit_offset_and_status_filter
        claim_type: Listing
        grounds:
          - endpoints["GET /retail/leases"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three leases created (two ACTIVE, one DRAFT), GET /retail/leases with limit 2 and offset 0 returns 2 rows with total_count 3 and has_more true, and adding status=ACTIVE narrows total_count to 2."
        test_recipe:
          setup:
            - "One center, three tenants and three leases; the first two leases have been activated, the third remains DRAFT."
          setup_api_calls:
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Page One LLC", trade_name: "PageOne", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Page Two LLC", trade_name: "PageTwo", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Page Three LLC", trade_name: "PageThree", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { t3_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${t1_id}", suite_code: "3401", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "NATURAL", billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${t2_id}", suite_code: "3402", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "NATURAL", billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { l2_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${t3_id}", suite_code: "3403", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "NATURAL", billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { l3_id: $.data.id }
            - call: "POST /retail/leases/${l1_id}/activate"
              payload: {}
              as: CenterAdmin
            - call: "POST /retail/leases/${l2_id}/activate"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "GET /retail/leases"
              payload: { center_id: "${center_id}", limit: 2, offset: 0 }
              as: LeaseAdministrator
            - call: "GET /retail/leases"
              payload: { center_id: "${center_id}", status: "ACTIVE" }
              as: LeaseAdministrator
          assert:
            - "The first call returns 2 rows with meta pagination total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "The second call returns 2 rows with total_count == 2 and has_more == false"
            - "ShoppingCenter.${center_id}.occupied_gla_sqft == 8000 (only the two ACTIVE leases count)"

      - name: ledger_entries_are_append_only_without_version_field
        claim_type: Immutability
        grounds:
          - entities.ReportingLedgerEntry.fields.entry_type
          - endpoints["GET /retail/lease-years/{id}/ledger-entries"]
        distinguishing_aspect: "ReportingLedgerEntry is declared common_fields:false, so each row exposes id and created_at but no updated_at and no version, and no endpoint mutates or deletes one."
        test_recipe:
          setup:
            - "One ACTIVE lease with LeaseYear 1 and one report accepted at 30,000,000 gross against a 200,000,000 breakpoint (so no charge is produced)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Ledger Retail LLC", trade_name: "LedgerShop", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { tenant_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${tenant_id}", suite_code: "3501", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "ARTIFICIAL", artificial_breakpoint_cents: 200000000, billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /retail/leases/${lease_id}/activate"
              payload: {}
              as: CenterAdmin
            - call: "POST /retail/leases/${lease_id}/lease-years"
              payload: { year_index: 1, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { ly_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_id}/sales-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { r1_id: $.data.id }
            - call: "POST /retail/sales-reports/${r1_id}/submit"
              payload: { gross_sales_cents: 30000000 }
              as: TenantUser
              as_user_id: "${tenant_id}"
            - call: "POST /retail/sales-reports/${r1_id}/accept"
              payload: {}
              as: LeaseAdministrator
          trigger:
            - call: "GET /retail/lease-years/${ly_id}/ledger-entries"
              payload: {}
              as: Auditor
          assert:
            - "Exactly 1 row is returned with entry_type == REPORT_ACCEPTED and delta_net_sales_cents == 30000000 and delta_billed_cents == 0"
            - "The row exposes id and created_at but no version and no updated_at field"

  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_lease_from_draft_moves_to_active_and_raises_occupancy
        claim_type: Valid Transition
        grounds:
          - state_machines.Lease.DRAFT_to_ACTIVE
          - calculations.occupancy_and_co_tenancy_monitor
        distinguishing_aspect: "Activation sets Lease.status ACTIVE, effective_monthly_rent_cents 1,000,000, relief_monthly_credit_cents 0 and raises ShoppingCenter.occupied_gla_sqft to 4000 with occupancy_bps 100."
        test_recipe:
          setup:
            - "One 400,000 sqft center with one DRAFT 4,000 sqft lease at 12,000,000 annual base rent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Activate LLC", trade_name: "ActShop", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { tenant_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${tenant_id}", suite_code: "3601", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "NATURAL", billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /retail/leases/${lease_id}/activate"
              payload: {}
              as: LeaseAdministrator
          assert:
            - "data.status == ACTIVE and data.effective_monthly_rent_cents == 1000000 and data.relief_monthly_credit_cents == 0"
            - "Lease.${lease_id}.version == 2"
            - "ShoppingCenter.${center_id}.occupied_gla_sqft == 4000 and ShoppingCenter.${center_id}.occupancy_bps == 100"

      - name: activate_lease_twice_second_call_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Lease.DRAFT_to_ACTIVE
          - errors[ERR_LEASE_STATE_INVALID]
        distinguishing_aspect: "A second activate on an already ACTIVE lease returns 409 ERR_LEASE_STATE_INVALID and does not double-count leased_sqft in ShoppingCenter.occupied_gla_sqft."
        test_recipe:
          setup:
            - "One ACTIVE 4,000 sqft lease in a 400,000 sqft center."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Twice LLC", trade_name: "TwiceShop", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { tenant_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${tenant_id}", suite_code: "3701", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "NATURAL", billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /retail/leases/${lease_id}/activate"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /retail/leases/${lease_id}/activate"
              payload: {}
              as: CenterAdmin
              captures: { err: $.data.error_id }
          assert:
