          not a claim): (1) SealEvent BROKEN_UNAUTHORIZED sets movement.seal_intact
          false, (2) the system creates a SEAL_DISCREPANCY ExaminationHold moving
          custody_status to EXAM_HOLD, (3) Port(3901).open_hold_count becomes 1,
          (4) the one-time GO grace pushes go_deadline_utc from
          2026-08-25T00:00:00Z to 2026-08-30T00:00:00Z with go_grace_applied true.
