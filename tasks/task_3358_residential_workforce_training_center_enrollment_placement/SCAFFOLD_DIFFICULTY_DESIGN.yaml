            - { call: "POST /jc/applicants", payload: { full_name: "Inv Two", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a2: $.data.id, a2_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a2}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["HOMELESS"], expected_applicant_version: "${a2_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app2: $.data.id } }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a2}", as: AdmissionsCounselor, captures: { a2_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a2}/center-assignment", payload: { expected_applicant_version: "${a2_v2}", residential_track: true }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a2}", trade_program_id: "${p1}", residential_track: true }, as: EnrollmentManager, captures: { e2: $.data.id } }
          trigger:
            - { call: "POST /jc/dormitory-assignments", payload: { enrollment_id: "${e1}", move_in_date: "2026-09-01" }, as: ResidentialAdvisor, captures: { da1: $.data.id, bed1: $.data.bed_label } }
            - { call: "POST /jc/dormitory-assignments", payload: { enrollment_id: "${e2}", move_in_date: "2026-09-01" }, as: ResidentialAdvisor, captures: { da2: $.data.id, bed2: $.data.bed_label } }
            - { call: "GET /jc/centers/${c1}", as: OperatorAdmin, captures: { use_full: $.data.beds_in_use, avail_full: $.data.beds_available } }
            - { call: "POST /jc/dormitory-assignments/${da1}/checkout", payload: { move_out_date: "2026-10-01" }, as: ResidentialAdvisor }
            - { call: "GET /jc/centers/${c1}", as: OperatorAdmin, captures: { use_post: $.data.beds_in_use, avail_post: $.data.beds_available } }
          assert:
            - "at creation: beds_in_use == 0, beds_available == 2 (invariant 0 + 2 == 2)"
            - "auto-select ordering: first assignment bed_label == B-01, second == B-02 (lowest free label ASC)"
            - "after both assignments: beds_in_use == 2, beds_available == 0 (invariant 2 + 0 == 2)"
            - "after the compensating checkout: beds_in_use == 1, beds_available == 1 (invariant 1 + 1 == 2) — no drift"

      - name: seat_enroll_unenroll_conserves_capacity
        grounds:
          - entities.TradeProgram.fields.open_seats
          - state_machines.TradeProgram.OPEN_to_FULL
          - state_machines.TradeProgram.FULL_to_OPEN
        distinguishing_aspect: |
          Conserved quantity of a different type from the sibling's bed count:
          TradeProgram.capacity == enrolled_count + open_seats. Enroll (forward)
          and unenroll (compensating) drive the seat ledger (0,2) -> (1,1) ->
          (2,0) -> (1,1) with the status auto-flip OPEN -> FULL -> OPEN riding
          the same mutations.
        test_recipe:
          setup:
            - "clock default; center (R-NORTH, 4 beds), WELDING program capacity 2"
            - "two eligible applicants assigned to the center (nonresidential)"
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Seat Center", region_code: "R-NORTH", total_beds: 4 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 2 }, as: OperatorAdmin, captures: { p1: $.data.id, os0: $.data.open_seats, ec0: $.data.enrolled_count } }
            - { call: "POST /jc/applicants", payload: { full_name: "Seat One", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/applicants", payload: { full_name: "Seat Two", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a2: $.data.id, a2_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a2}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["HOMELESS"], expected_applicant_version: "${a2_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app2: $.data.id } }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a2}", as: AdmissionsCounselor, captures: { a2_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a2}/center-assignment", payload: { expected_applicant_version: "${a2_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
          trigger:
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a2}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e2: $.data.id } }
            - { call: "GET /jc/centers/${c1}/trade-programs", as: OperatorAdmin, captures: { os_full: "$.data[0].open_seats", ec_full: "$.data[0].enrolled_count", st_full: "$.data[0].status" } }
            - { call: "POST /jc/enrollments/${e1}/transition", payload: { action: "unenroll", reason: "WITHDRAWN" }, as: EnrollmentManager }
            - { call: "GET /jc/centers/${c1}/trade-programs", as: OperatorAdmin, captures: { os_post: "$.data[0].open_seats", ec_post: "$.data[0].enrolled_count", st_post: "$.data[0].status" } }
          assert:
            - "at creation: enrolled_count == 0, open_seats == 2 (invariant 0 + 2 == 2)"
            - "after two enrollments: enrolled_count == 2, open_seats == 0, status == FULL (auto-flip at exactly 0)"
            - "after the compensating unenroll: enrolled_count == 1, open_seats == 1, status == OPEN (auto-flip back) — capacity 2 conserved at every step"
