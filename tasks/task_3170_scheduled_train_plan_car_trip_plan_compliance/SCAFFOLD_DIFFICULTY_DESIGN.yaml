              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "CONDUCTOR", service_date: "2026-09-01", crews_available: 3 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "CI-UP0101", current_yard_id: "${yA}", horsepower: 4400 }
              as: PowerPlanner
              captures: { l1: $.data.id }
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${l1}", car_count_planned: 5, crew_hours_estimated: 6 }
              as: TerminalSuperintendent
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /rail/train-departures/${d1}/cancel"
              payload: {}
              as: TerminalSuperintendent
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${l1}", car_count_planned: 5, crew_hours_estimated: 6 }
              as: TerminalSuperintendent
