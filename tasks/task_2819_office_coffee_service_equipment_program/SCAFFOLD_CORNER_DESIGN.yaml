          difficulty_instance: dual_variant_calc / site_par_sizing_headcount_model_vs_trailing_usage_divergence
          rationale: "That §1.8 instance runs both variants on identical site attributes and asserts the differing par_units literals plus the delta."

      - name: corner_the_program_charge_variant_is_selected_by_terms_type
        claim_type: variant_selection
        grounds:
          - calculations.equipment_program_charge.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / equipment_program_charge_loan_recovery_vs_rental_surcharge_divergence
          rationale: "That §1.8 instance shows the same minimum and trailing purchases producing a LOAN recovery fee versus a RENTAL surcharge plus prorated rent."

      - name: corner_invoice_assembly_reaches_a_fixed_point_without_re_keying_the_total
        claim_type: constraint_propagation
        grounds:
          - calculations.invoice_assembly_order
        excluded_because:
          difficulty_instance: combinatorial_formula / freight_waiver_and_breadth_tier_both_key_on_pre_discount_total
          rationale: "That §1.8 instance pins the evaluation order by showing both the discount tier and the freight waiver keyed on the step-2 pre-discount total."

      - name: corner_green_index_movement_at_the_adjustable_threshold
        claim_type: threshold
        grounds:
          - calculations.green_index_adjustment.constants
        excluded_because:
          difficulty_instance: boundary_precision_check / index_movement_at_799_800_and_801_bps_around_the_adjustable_threshold
          rationale: "That §1.8 instance tests 799, 800 and 801 bps around INDEX_MOVEMENT_THRESHOLD_BPS with the resulting pass-through literals."

      - name: corner_invoice_lines_are_rounded_individually_not_after_summing
        claim_type: precision
        grounds:
          - calculations.invoice_line_rounding
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_line_rounding_per_line_beats_sum_then_round
          rationale: "That §1.8 instance constructs fractional-cent unit prices whose per-line rounding differs by cents from the forbidden sum-then-round reading."

      - name: corner_interval_rules_treat_abutment_differently_per_calculation
        claim_type: interval_merge
        grounds:
          - calculations.route_window_conflict
          - calculations.loaner_window_conflict
        excluded_because:
          difficulty_instance: resource_temporal_overlap / route_technician_day_halfopen_buffered_windows_abut_at_1015_but_collide_at_1014
          rationale: "That §1.8 instance covers the half-open buffered route rule, and its loaner sibling covers the closed date-interval rule with the trailing reconditioning day."

