scenario: |
  1072. Unclaimed-Property Recovery & Compliance: owner match & claim, holder
  due-diligence & reporting, dormancy & escheat, recovery-fee & payout, state
  filing & audit, evidence/documentation, cross-state, tracking

domain_name: unclaimed-property-recovery
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # flat: peer entities linked by foreign keys (Holder, Property, Owner,
  # RecoveryFirm, HolderReport, Claim, AuditCase, StateAccount, LedgerEntry),
  # no nesting in URL paths beyond sub-resource reads.
  state_machine_shape: cyclic
  # Claim carries a NEEDS_EVIDENCE<->UNDER_REVIEW review loop; HolderReport a
  # REJECTED->DRAFT revise loop; AuditCase an INFO_REQUESTED<->OPEN loop.
  relationship_patterns:
    - one_to_many          # Holder -> Property, Holder -> HolderReport, Claim -> EvidenceDocument
    - cross_aggregate      # Claim.property_id, LedgerEntry.ref_claim_id span aggregates
  role_model: segregation_of_duties
  # A StateApprover who pays/approves a Claim MUST NOT be the StateExaminer who
  # examined it (approver_user_id != examiner_user_id).
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Holder
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the business holding property.
      - name: incorporation_state
        type: string
        source: input
        description: Two-letter state code of incorporation; escheat fallback jurisdiction.
        constraints: Two uppercase letters (e.g., NY, CA, TX).
      - name: holder_type
        type: enum
        source: input
        description: Category of holder institution.
        constraints: One of {BANK, INSURER, UTILITY, BROKER, OTHER}.
      - name: status
        type: enum
        source: system
        description: Registration lifecycle of the holder.
        default: ACTIVE
        constraints: One of {ACTIVE, SUSPENDED}.
      - name: audit_hold
        type: boolean
        source: computed
        description: >
          True while at least one AuditCase for this Holder is in a non-terminal
          state (OPEN or INFO_REQUESTED); blocks report submission. Recomputed on
          every AuditCase transition that touches this holder.
        default: false
      - name: assessed_penalty_cents
        type: integer
        source: computed
        description: Running total of penalties assessed against this holder by closed audits.
        default: 0

  - name: PropertyType
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: Short unique code for the property category (e.g., AC01, MO02).
        constraints: Unique across PropertyType.
      - name: name
        type: string
        source: input
        description: Human-readable property category name.
      - name: dormancy_period_years
        type: integer
        source: input
        description: Whole years of inactivity before the property becomes dormant.
        constraints: Integer >= 1.
      - name: dormancy_basis
        type: enum
        source: input
        description: Which date the dormancy clock counts from.
        constraints: One of {LAST_ACTIVITY, ISSUANCE}.
      - name: interest_bearing
        type: boolean
        source: input
        description: Whether escheated remittance accrues statutory interest.
      - name: due_diligence_required
        type: boolean
        source: input
        description: Whether the holder must send a due-diligence notice before reporting.
      - name: due_diligence_min_days
        type: integer
        source: input
        description: Minimum days that must elapse after the first notice before the property may be reported.
        constraints: Integer >= 0.

  - name: StateAccount
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: Two-letter jurisdiction code; unique across StateAccount.
        constraints: Unique; two uppercase letters.
      - name: custody_balance_cents
        type: integer
        source: computed
        description: >
          Signed sum of this account's LedgerEntry rows (REMIT_IN +, CLAWBACK_IN +,
          PAYOUT_OUT -, FEE_OUT -). Recomputed on every ledger write.
        default: 0

  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the property owner / claimant.
      - name: ssn_last4
        type: string
        source: input
        description: Last four digits of the owner's tax id, used for identity match.
        constraints: Exactly 4 digits.
      - name: address_state
        type: string
        source: input
        description: Two-letter state code of the owner's current address.
      - name: email
        type: string
        source: input
        description: Contact email of the owner.
      - name: id_verified
        type: boolean
        source: system
        description: Whether the owner's identity has been verified by the state.
        default: false

  - name: RecoveryFirm
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the recovery / locator firm.
      - name: registered_state
        type: string
        source: input
        description: Two-letter state code where the firm is licensed.
      - name: license_number
        type: string
        source: input
        description: State-issued locator license number.
      - name: max_fee_pct
        type: number
        source: input
        description: Firm's own maximum contract fee fraction (0..1).
        constraints: 0 < max_fee_pct <= 1.

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: holder_id
        type: string
        source: input
        description: FK -> Holder.id; the institution that reported/holds this property.
      - name: property_type_id
        type: string
        source: input
        description: FK -> PropertyType.id; category driving dormancy and interest rules.
      - name: owner_name
        type: string
        source: input
        description: Name of the apparent owner as recorded by the holder.
      - name: owner_last_known_state
        type: string
        source: input
        description: Two-letter state of the owner's last known address; null/empty if unknown.
        default: null
      - name: amount_cents
        type: integer
        source: input
        description: Face principal value of the property in cents (pre-interest).
        constraints: Integer >= 0.
      - name: last_activity_date
        type: datetime
        source: input
        description: Last owner-initiated activity date (basis for LAST_ACTIVITY dormancy).
      - name: issue_date
        type: datetime
        source: input
        description: Instrument issue date (basis for ISSUANCE dormancy); null when not applicable.
        default: null
      - name: escheat_state
        type: string
        source: computed
        description: >
          Jurisdiction this property escheats to, per the priority rule: owner_last_known_state
          when present and non-empty, else the holder's incorporation_state. Computed at creation.
      - name: dormancy_date
        type: datetime
        source: computed
        description: >
          Instant at which the property becomes eligible for DORMANT. See calculations.dormancy_date.
      - name: remitted_amount_cents
        type: integer
        source: computed
        description: >
          Principal plus accrued statutory interest remitted at escheat; set when the property
          transitions REPORTED->ESCHEATED. See calculations.escheat_remittance_amount.
        default: 0
      - name: report_id
        type: string
        source: system
        description: FK -> HolderReport.id; the report this property is attached to; null until added.
        default: null
      - name: status
        type: enum
        source: system
        description: Property lifecycle state.
        default: ACTIVE
        constraints: One of {ACTIVE, DORMANT, DUE_DILIGENCE, REPORTED, ESCHEATED, CLAIMED}.

  - name: DueDiligenceNotice
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; the property the outreach concerns.
      - name: method
        type: enum
        source: input
        description: Outreach channel.
        constraints: One of {MAIL, EMAIL}.
      - name: sent_at
        type: datetime
        source: system
        description: Logical-clock instant the notice was sent.
      - name: responded
        type: boolean
        source: system
        description: Whether the owner responded to this notice.
        default: false
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant the owner responded; null until a response is recorded.
        default: null

  - name: HolderReport
    parent: null
    common_fields: true
    fields:
      - name: holder_id
        type: string
        source: input
        description: FK -> Holder.id; the filing institution.
      - name: report_state
        type: string
        source: input
        description: Two-letter jurisdiction the report is filed with.
      - name: report_period_year
        type: integer
        source: input
        description: Calendar reporting year covered by this filing.
        constraints: Integer >= 2000.
      - name: property_count
        type: integer
        source: computed
        description: Count of Property rows currently attached (report_id == this.id).
        default: 0
      - name: total_remitted_cents
        type: integer
        source: computed
        description: >
          Sum of round(escheat_remittance_amount) over attached properties, rounded per-property
          then summed. See calculations.report_total_remitted.
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant the report was submitted; null until submit.
        default: null
      - name: status
        type: enum
        source: system
        description: Report lifecycle state.
        default: DRAFT
        constraints: One of {DRAFT, SUBMITTED, UNDER_AUDIT, ACCEPTED, REJECTED}.

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; the escheated property being claimed.
      - name: claimant_owner_id
        type: string
        source: input
        description: FK -> Owner.id; the owner asserting ownership.
      - name: recovery_firm_id
        type: string
        source: input
        description: FK -> RecoveryFirm.id; the firm filing on the owner's behalf; null for OWNER-filed claims.
        default: null
      - name: filed_by
        type: enum
        source: input
        description: Who filed the claim.
        constraints: One of {OWNER, FIRM}.
      - name: contract_fee_pct
        type: number
        source: input
        description: Agreed recovery fee fraction (0..1); 0 for OWNER-filed claims.
        default: 0
      - name: claim_amount_cents
        type: integer
        source: computed
        description: Gross claimable amount, snapshot of Property.remitted_amount_cents at filing.
        default: 0
      - name: provisional_fee_cents
        type: integer
        source: computed
        description: >
          Recovery fee estimated at filing from the property's face principal (pre-interest).
          See calculations.recovery_fee variant provisional.
        default: 0
      - name: fee_cents
        type: integer
        source: computed
        description: >
          Final recovery fee computed at approval from claim_amount_cents. See
          calculations.recovery_fee variant final and calculations.claim_payout_waterfall.
        default: 0
      - name: admin_deduction_cents
        type: integer
        source: computed
        description: State administrative deduction; see calculations.claim_payout_waterfall.
        default: 0
      - name: net_payout_cents
        type: integer
        source: computed
        description: Amount paid to the owner; see calculations.claim_payout_waterfall.
        default: 0
      - name: examiner_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the StateExaminer who examined this claim; null until examined.
        default: null
      - name: approver_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the StateApprover who approved this claim; null until approved.
        default: null
      - name: status
        type: enum
        source: system
        description: Claim lifecycle state.
        default: FILED
        constraints: One of {FILED, UNDER_REVIEW, NEEDS_EVIDENCE, APPROVED, PAID, DENIED, VOIDED}.

  - name: EvidenceDocument
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK -> Claim.id; the claim this evidence supports.
      - name: doc_type
        type: enum
        source: input
        description: Kind of supporting document.
        constraints: One of {GOV_ID, PROOF_OF_ADDRESS, DEATH_CERTIFICATE, OWNERSHIP_PROOF}.
      - name: reviewed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the StateExaminer who reviewed the document; null until reviewed.
        default: null
      - name: status
        type: enum
        source: system
        description: Evidence review state.
        default: PENDING
        constraints: One of {PENDING, ACCEPTED, REJECTED}.

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - name: holder_id
        type: string
        source: input
        description: FK -> Holder.id; the holder under examination.
      - name: examiner_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the StateExaminer who opened the case.
      - name: assessed_penalty_cents
        type: integer
        source: input
        description: Penalty amount recorded when the case closes with a finding; 0 otherwise.
        default: 0
      - name: findings
        type: string
        source: input
        description: Free-text audit findings; null until closed.
        default: null
      - name: status
        type: enum
        source: system
        description: Audit case lifecycle state.
        default: OPEN
        constraints: One of {OPEN, INFO_REQUESTED, CLOSED_NO_FINDING, CLOSED_ASSESSED}.

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: state_account_id
        type: string
        source: system
        description: FK -> StateAccount.id; the custody account this entry posts to.
      - name: property_id
        type: string
        source: system
        description: FK -> Property.id; the property that generated the entry; null for non-property entries.
        default: null
      - name: ref_claim_id
        type: string
        source: system
        description: FK -> Claim.id; the claim that generated the entry; null when not claim-driven.
        default: null
      - name: ref_report_id
        type: string
        source: system
        description: FK -> HolderReport.id; the report that generated the entry; null when not report-driven.
        default: null
      - name: entry_type
        type: enum
        source: system
        description: Ledger movement type.
        constraints: One of {REMIT_IN, PAYOUT_OUT, FEE_OUT, CLAWBACK_IN}.
      - name: amount_cents
        type: integer
        source: system
        description: Unsigned magnitude of the movement in cents; sign implied by entry_type.
        constraints: Integer >= 0.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Property
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DORMANT
        trigger: "POST /properties/{id}/evaluate-dormancy"
        actor: Holder
        preconditions:
          - "current_clock >= Property.dormancy_date (inclusive; exactly-at is dormant)"
        side_effects:
          - "sets Property.status = DORMANT"
        note: "Boundary: at exactly dormancy_date the property is DORMANT (>=); before it, ERR_NOT_YET_DORMANT."
      - from: DORMANT
        to: DUE_DILIGENCE
        trigger: "POST /properties/{id}/notices"
        actor: Holder
        preconditions:
          - "PropertyType.due_diligence_required == true"
          - "no existing DueDiligenceNotice for this property with sent_at within DUE_DILIGENCE_NOTICE_BUFFER_DAYS of current_clock"
        side_effects:
          - "creates a DueDiligenceNotice with sent_at = current_clock"
          - "sets Property.status = DUE_DILIGENCE"
      - from: DUE_DILIGENCE
        to: DUE_DILIGENCE
        trigger: "POST /properties/{id}/notices"
        actor: Holder
        preconditions:
          - "PropertyType.due_diligence_required == true"
          - "no existing DueDiligenceNotice for this property with sent_at within DUE_DILIGENCE_NOTICE_BUFFER_DAYS of current_clock"
        side_effects:
          - "creates an additional DueDiligenceNotice with sent_at = current_clock"
        note: "Follow-up outreach; buffer rule (ERR_NOTICE_TOO_SOON) still applies. Status unchanged."
      - from: DUE_DILIGENCE
        to: ACTIVE
        trigger: "POST /due-diligence-notices/{id}/record-response"
        actor: Holder
        preconditions:
          - "the notice belongs to this property"
        side_effects:
          - "sets DueDiligenceNotice.responded = true, responded_at = current_clock"
          - "reactivates the owner: sets Property.status = ACTIVE"
        note: "Owner responded — property is reclaimed by the owner and leaves the escheat pipeline (revert)."
      - from: DORMANT
        to: REPORTED
        trigger: "POST /reports/{report_id}/add-property"
        actor: Holder
        preconditions:
          - "PropertyType.due_diligence_required == false (no notice required)"
          - "Property.escheat_state == HolderReport.report_state"
          - "HolderReport.status == DRAFT"
          - "Property.holder_id == HolderReport.holder_id"
        side_effects:
          - "sets Property.report_id = report.id"
          - "sets Property.status = REPORTED"
          - "increments HolderReport.version by 1 (OCC parent bump)"
          - "recomputes HolderReport.property_count and HolderReport.total_remitted_cents"
        note: "Direct reporting path for property types that do not require due diligence."
      - from: DUE_DILIGENCE
        to: REPORTED
        trigger: "POST /reports/{report_id}/add-property"
        actor: Holder
        preconditions:
          - "Property.escheat_state == HolderReport.report_state"
          - "HolderReport.status == DRAFT"
          - "Property.holder_id == HolderReport.holder_id"
        side_effects:
          - "sets Property.report_id = report.id"
          - "sets Property.status = REPORTED"
          - "increments HolderReport.version by 1 (OCC parent bump)"
          - "recomputes HolderReport.property_count and HolderReport.total_remitted_cents"
      - from: REPORTED
        to: ESCHEATED
        trigger: "POST /reports/{report_id}/accept (cascade over attached properties)"
        actor: StateExaminer
        preconditions:
          - "parent HolderReport transitions UNDER_AUDIT->ACCEPTED"
        side_effects:
          - "computes Property.remitted_amount_cents via calculations.escheat_remittance_amount"
          - "sets Property.status = ESCHEATED"
          - "creates LedgerEntry REMIT_IN(remitted_amount_cents) on StateAccount[escheat_state]"
          - "recomputes StateAccount.custody_balance_cents (+= remitted_amount_cents)"
        note: "Cascade L2->L3 of transitive_cascade report_accept_escheat_custody."
      - from: ESCHEATED
        to: CLAIMED
        trigger: "POST /claims/{claim_id}/pay (cascade from Claim APPROVED->PAID)"
        actor: StateApprover
        preconditions:
          - "the paying Claim.property_id == this property and Claim transitions APPROVED->PAID"
        side_effects:
          - "sets Property.status = CLAIMED"
          - "creates LedgerEntry PAYOUT_OUT(net_payout_cents) and FEE_OUT(fee_cents) on StateAccount[escheat_state]"
          - "recomputes StateAccount.custody_balance_cents (-= net_payout_cents + fee_cents)"
        note: "Cascade L2->L3 of transitive_cascade claim_pay_property_custody."
      - from: CLAIMED
        to: ESCHEATED
        trigger: "POST /claims/{claim_id}/void (compensation from Claim PAID->VOIDED)"
        actor: StateApprover
        preconditions:
          - "the voided Claim.property_id == this property and Claim transitions PAID->VOIDED"
        side_effects:
          - "sets Property.status = ESCHEATED"
          - "creates LedgerEntry CLAWBACK_IN(net_payout_cents + fee_cents) on StateAccount[escheat_state]"
          - "recomputes StateAccount.custody_balance_cents (+= net_payout_cents + fee_cents)"
        note: "Compensating action for compensating_invariant custody_conservation."

  - entity: HolderReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reports/{id}/submit"
        actor: Holder
        preconditions:
          - "Holder.audit_hold == false"
          - "every attached Property satisfies due_diligence_min_days elapsed since its earliest notice"
          - "request declared_total_cents == HolderReport.total_remitted_cents"
        side_effects:
          - "sets HolderReport.status = SUBMITTED, submitted_at = current_clock"
      - from: SUBMITTED
        to: UNDER_AUDIT
        trigger: "POST /reports/{id}/begin-review"
        actor: StateExaminer
        preconditions:
          - "HolderReport.status == SUBMITTED"
        side_effects:
          - "sets HolderReport.status = UNDER_AUDIT"
      - from: UNDER_AUDIT
        to: ACCEPTED
        trigger: "POST /reports/{id}/accept"
        actor: StateExaminer
        preconditions:
          - "HolderReport.status == UNDER_AUDIT"
        side_effects:
          - "cascades every attached REPORTED Property -> ESCHEATED (see Property REPORTED->ESCHEATED)"
        note: "L1 of transitive_cascade report_accept_escheat_custody; depth-3 chain Report->Property->Ledger/StateAccount."
      - from: UNDER_AUDIT
        to: REJECTED
        trigger: "POST /reports/{id}/reject"
        actor: StateExaminer
        preconditions:
          - "HolderReport.status == UNDER_AUDIT"
        side_effects:
          - "sets HolderReport.status = REJECTED"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /reports/{id}/revise"
        actor: Holder
        preconditions:
          - "HolderReport.status == REJECTED"
        side_effects:
          - "sets HolderReport.status = DRAFT"
        note: "Revise loop (branching-with-revert non-linear shape)."

  - entity: Claim
    initial_state: FILED
    terminal_states: [DENIED, VOIDED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/examine"
        actor: StateExaminer
        preconditions:
          - "Claim.status == FILED"
        side_effects:
          - "sets Claim.examiner_user_id = X-User-ID"
          - "sets Claim.status = UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: NEEDS_EVIDENCE
        trigger: "POST /claims/{id}/request-evidence"
        actor: StateExaminer
        preconditions:
          - "Claim.status == UNDER_REVIEW"
        side_effects:
          - "sets Claim.status = NEEDS_EVIDENCE"
      - from: NEEDS_EVIDENCE
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/resubmit"
        actor: [Owner, RecoveryAgent]
        preconditions:
          - "Claim.status == NEEDS_EVIDENCE"
          - "at least one EvidenceDocument for this claim has status ACCEPTED"
        side_effects:
          - "sets Claim.status = UNDER_REVIEW"
        note: "Evidence review loop (cyclic non-linear shape on Claim)."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: StateApprover
        preconditions:
          - "Claim.status == UNDER_REVIEW"
          - "X-User-ID (approver) != Claim.examiner_user_id (segregation of duties)"
          - "Property referenced by the claim is in status ESCHEATED"
        side_effects:
          - "computes fee_cents, admin_deduction_cents, net_payout_cents via calculations.claim_payout_waterfall"
          - "sets Claim.approver_user_id = X-User-ID"
          - "sets Claim.status = APPROVED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: StateExaminer
        preconditions:
          - "Claim.status == UNDER_REVIEW"
        side_effects:
          - "sets Claim.status = DENIED"
      - from: APPROVED
        to: PAID
        trigger: "POST /claims/{id}/pay"
        actor: StateApprover
        preconditions:
          - "Claim.status == APPROVED"
          - "X-User-ID (payer) != Claim.examiner_user_id (segregation of duties)"
        side_effects:
          - "sets Claim.status = PAID"
          - "cascades Property ESCHEATED->CLAIMED (see Property ESCHEATED->CLAIMED)"
        note: "L1 of transitive_cascade claim_pay_property_custody; depth-3 chain Claim->Property->Ledger/StateAccount."
      - from: PAID
        to: VOIDED
        trigger: "POST /claims/{id}/void"
        actor: StateApprover
        preconditions:
          - "Claim.status == PAID"
        side_effects:
          - "sets Claim.status = VOIDED"
          - "cascades Property CLAIMED->ESCHEATED with custody clawback (see Property CLAIMED->ESCHEATED)"
        note: "Compensating action for compensating_invariant custody_conservation."

  - entity: AuditCase
    initial_state: OPEN
    terminal_states: [CLOSED_NO_FINDING, CLOSED_ASSESSED]
    transitions:
      - from: OPEN
        to: INFO_REQUESTED
        trigger: "POST /audit-cases/{id}/request-info"
        actor: StateExaminer
        preconditions:
          - "AuditCase.status == OPEN"
        side_effects:
          - "sets AuditCase.status = INFO_REQUESTED"
      - from: INFO_REQUESTED
        to: OPEN
        trigger: "POST /audit-cases/{id}/provide-info"
        actor: Holder
        preconditions:
          - "AuditCase.status == INFO_REQUESTED"
        side_effects:
          - "sets AuditCase.status = OPEN"
        note: "Info-request loop (cyclic non-linear shape on AuditCase)."
      - from: OPEN
        to: CLOSED_NO_FINDING
        trigger: "POST /audit-cases/{id}/close-clean"
        actor: StateExaminer
        preconditions:
          - "AuditCase.status == OPEN"
        side_effects:
          - "sets AuditCase.status = CLOSED_NO_FINDING"
          - "recomputes Holder.audit_hold (false when no other non-terminal case)"
      - from: OPEN
        to: CLOSED_ASSESSED
        trigger: "POST /audit-cases/{id}/close-assess"
        actor: StateExaminer
        preconditions:
          - "AuditCase.status == OPEN"
          - "request assessed_penalty_cents >= 1"
        side_effects:
          - "sets AuditCase.status = CLOSED_ASSESSED, assessed_penalty_cents, findings"
          - "adds assessed_penalty_cents to Holder.assessed_penalty_cents"
          - "sets Holder.status = SUSPENDED"
          - "recomputes Holder.audit_hold (false when no other non-terminal case)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: report-add-property-stale-report
    parent_entity: HolderReport
    write_endpoint: "POST /reports/{id}/add-property"
    occ_field: "expected_report_version"
    description: |
      Attaching a Property to a DRAFT HolderReport whose version has advanced since
      the client last observed it is rejected. Each add recomputes the report's
      derived total_remitted_cents and property_count and bumps the report version;
      a client that attaches a second (distinct, otherwise-eligible) property while
      carrying a stale report version has computed its intended filing total from an
      out-of-date snapshot and must re-read before attaching. Both attaches are
      individually legitimate under natural semantics — only the stale version blocks
      the loser, so this is a true CREATE-with-supersede race, not a state precondition.
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dormancy_date
    trigger: "on Property creation (POST /properties)"
    algorithm: threshold
    formula: |
      basis = PropertyType.dormancy_basis
      if basis == LAST_ACTIVITY:
          anchor = Property.last_activity_date
      elif basis == ISSUANCE:
          anchor = Property.issue_date            # required non-null when basis == ISSUANCE
      dormancy_date = anchor + PropertyType.dormancy_period_years calendar years
      # DORMANT is reachable once current_clock >= dormancy_date (inclusive).
    input_set: "single Property plus its PropertyType configuration"
    constants: {}
    precision: "whole-date arithmetic; add exact calendar years to the anchor instant"
    variants:
      - name: last_activity
        when: "PropertyType.dormancy_basis == LAST_ACTIVITY"
        difference: "anchor is last_activity_date"
      - name: issuance
        when: "PropertyType.dormancy_basis == ISSUANCE"
        difference: >
          anchor is issue_date; for the SAME property carrying both dates this yields a
          different dormancy_date than the last_activity variant.

  - name: escheat_remittance_amount
    trigger: "on Property REPORTED->ESCHEATED (POST /reports/{id}/accept cascade)"
    algorithm: threshold
    formula: |
      # Non-linear: >=3 inputs (amount, years_dormant, interest_bearing) with a min cap and a conditional branch.
      years_dormant = floor( full calendar years between Property.dormancy_date and current_clock )
      if PropertyType.interest_bearing == false:
          interest = 0
      else:
          raw_interest = amount_cents * ANNUAL_INTEREST_RATE * years_dormant
          cap          = amount_cents * MAX_INTEREST_MULTIPLE
          interest     = min( raw_interest, cap )
      remitted_amount_cents = round_half_up( amount_cents + interest )
    input_set: "single Property at escheat; years measured against current logical clock"
    constants:
      ANNUAL_INTEREST_RATE: 0.02
      MAX_INTEREST_MULTIPLE: 0.5
    precision: "2 decimal places conceptually; values are integer cents, round_half_up on the final sum"

  - name: report_total_remitted
    trigger: "on POST /reports/{id}/add-property (recompute) and read of HolderReport"
    algorithm: aggregation
    formula: |
      # Mode (b): nested rounding where order matters. PINNED: round each property first, then sum.
      total_remitted_cents = sum over attached properties P of round_half_up( escheat_remittance_amount(P) )
      property_count       = count of attached properties (Property.report_id == report.id)
      # Forbidden alternative (sum raw remittances then round once) can differ by cents.
    input_set: "all Property rows with report_id == this report (any attached status)"
    constants: {}
    precision: "round per-property to cents FIRST, then sum; tie-break not needed (summation is commutative)"

  - name: recovery_fee
    trigger: "provisional at POST /claims; final at POST /claims/{id}/approve"
    algorithm: threshold
    formula: |
      effective_pct = min( Claim.contract_fee_pct, STATE_MAX_FEE_PCT )
      # provisional: uses the property's face principal at filing time
      provisional_fee_cents = round_half_up( effective_pct * Property.amount_cents )
      # final: uses the escheated claim_amount_cents (principal + accrued interest)
      fee_cents = round_half_up( effective_pct * Claim.claim_amount_cents )
    input_set: "single Claim and its Property"
    constants:
      STATE_MAX_FEE_PCT: 0.10
    precision: "round_half_up to integer cents"
    variants:
      - name: provisional
        when: "at claim filing (POST /claims)"
        difference: "fee computed on Property.amount_cents (pre-interest face value)"
      - name: final
        when: "at claim approval (POST /claims/{id}/approve)"
        difference: >
          fee computed on Claim.claim_amount_cents (= remitted principal + interest); for an
          interest-bearing property this exceeds the provisional fee.

  - name: claim_payout_waterfall
    trigger: "on POST /claims/{id}/approve"
    algorithm: waterfall_allocation
    formula: |
      # Mode (c): circular-looking dependency; evaluation order PINNED.
      # Step 1 — fee from gross:
      effective_pct       = min( Claim.contract_fee_pct, STATE_MAX_FEE_PCT )
      fee_cents           = round_half_up( effective_pct * claim_amount_cents )
      # Step 2 — post-fee residual:
      post_fee            = claim_amount_cents - fee_cents
      # Step 3 — admin deduction keyed on the post-fee tier (depends on Step 1 output):
      if post_fee <= ADMIN_TIER_THRESHOLD_CENTS:
          admin_deduction_cents = ADMIN_FLAT_FEE_CENTS
      else:
          admin_deduction_cents = round_half_up( ADMIN_PCT * post_fee )
      # Step 4 — net to owner (depends on Steps 1 and 3):
      net_payout_cents    = claim_amount_cents - fee_cents - admin_deduction_cents
      # Invariant: claim_amount_cents == fee_cents + admin_deduction_cents + net_payout_cents
    input_set: "single approved Claim"
    constants:
      STATE_MAX_FEE_PCT: 0.10
      ADMIN_FLAT_FEE_CENTS: 500
      ADMIN_TIER_THRESHOLD_CENTS: 100000
      ADMIN_PCT: 0.005
    precision: "round_half_up to integer cents at each pinned step in the stated order"

  - name: custody_balance
    trigger: "on every LedgerEntry write (escheat, payout, void)"
    algorithm: aggregation
    formula: |
      custody_balance_cents(state_account) =
          sum( amount_cents where entry_type in {REMIT_IN, CLAWBACK_IN} )
        - sum( amount_cents where entry_type in {PAYOUT_OUT, FEE_OUT} )
      # for all LedgerEntry rows with state_account_id == account.id
    input_set: "all LedgerEntry rows for the given StateAccount"
    constants: {}
    precision: "integer cents; exact"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path id and every FK in the body resolves to an existing entity (validated left-to-right)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "target entity is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 5
    category: state
    check: "evaluate-dormancy only from ACTIVE and only when current_clock >= dormancy_date"
    error_id: ERR_NOT_YET_DORMANT
    http_status: 409
    applies_to: "POST /properties/{id}/evaluate-dormancy"
  - priority: 6
    category: state
    check: "a claim may only be filed against a Property in status ESCHEATED (cross-entity Claim->Property)"
    error_id: ERR_PROPERTY_NOT_CLAIMABLE
    http_status: 409
    applies_to: "POST /claims"
  - priority: 7
    category: business_safety
    check: "approver/payer X-User-ID must differ from the claim's examiner_user_id (segregation of duties)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /claims/{id}/approve, POST /claims/{id}/pay"
  - priority: 8
    category: business_safety
    check: "a report may not be submitted while its Holder.audit_hold is true (cross-entity Report->Holder)"
    error_id: ERR_HOLDER_UNDER_AUDIT
    http_status: 409
    applies_to: "POST /reports/{id}/submit"
  - priority: 9
    category: business_temporal
    check: "for every attached property requiring due diligence, current_clock - earliest DueDiligenceNotice.sent_at (days) >= PropertyType.due_diligence_min_days"
    error_id: ERR_DUE_DILIGENCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /reports/{id}/submit"
  - priority: 10
    category: business_temporal
    check: "a new DueDiligenceNotice must not fall within DUE_DILIGENCE_NOTICE_BUFFER_DAYS (= 30) days of an existing notice on the same property"
    error_id: ERR_NOTICE_TOO_SOON
    http_status: 409
    applies_to: "POST /properties/{id}/notices"
  - priority: 11
    category: business_referential
    check: "Property.escheat_state must equal HolderReport.report_state when attaching (cross-state jurisdiction)"
    error_id: ERR_ESCHEAT_STATE_MISMATCH
    http_status: 422
    applies_to: "POST /reports/{report_id}/add-property"
  - priority: 12
    category: business_referential
    check: "filed_by == FIRM requires a non-null recovery_firm_id; filed_by == OWNER requires recovery_firm_id null and contract_fee_pct == 0"
    error_id: ERR_FIRM_REQUIRED
    http_status: 422
    applies_to: "POST /claims"
  - priority: 13
    category: business_constraint
    check: "a Property may have at most one non-terminal Claim (FILED/UNDER_REVIEW/NEEDS_EVIDENCE/APPROVED/PAID)"
    error_id: ERR_CLAIM_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /claims"
  - priority: 14
    category: business_constraint
    check: "at most one HolderReport per (holder_id, report_state, report_period_year)"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /reports"
  - priority: 15
    category: business_constraint
    check: "approval requires the claim to be UNDER_REVIEW with no EvidenceDocument in status PENDING for that claim"
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /claims/{id}/approve"
  - priority: 16
    category: business_constraint
    check: "OCC: expected_report_version must equal the report's current version"
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412
    applies_to: "POST /reports/{report_id}/add-property"
  - priority: 17
    category: business_fiscal
    check: "contract_fee_pct must be <= min(RecoveryFirm.max_fee_pct, STATE_MAX_FEE_PCT); at exactly the cap is allowed"
    error_id: ERR_FEE_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /claims"
  - priority: 18
    category: business_fiscal
    check: "on submit, request declared_total_cents must equal HolderReport.total_remitted_cents"
    error_id: ERR_REMITTANCE_MISMATCH
    http_status: 422
    applies_to: "POST /reports/{id}/submit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Holder ---
  - method: POST
    path: "/holders"
    description: "Register a holder institution."
    roles: [StateAdmin]
    code: 201
    input: [legal_name, incorporation_state, holder_type]
    output: Holder
    side_effects: ["creates Holder with status ACTIVE, audit_hold false"]
  - method: GET
    path: "/holders/{id}"
    description: "Fetch a holder."
    roles: [StateAdmin, Holder, StateExaminer, StateApprover]
    code: 200
    input: []
    output: Holder
    side_effects: []
  # --- PropertyType ---
  - method: POST
    path: "/property-types"
    description: "Define a property category and its dormancy/interest rules."
    roles: [StateAdmin]
    code: 201
    input: [code, name, dormancy_period_years, dormancy_basis, interest_bearing, due_diligence_required, due_diligence_min_days]
    output: PropertyType
    side_effects: ["creates PropertyType"]
  - method: GET
    path: "/property-types/{id}"
    description: "Fetch a property type."
    roles: [StateAdmin, Holder, StateExaminer, StateApprover]
    code: 200
    input: []
    output: PropertyType
    side_effects: []
  # --- StateAccount ---
  - method: POST
    path: "/state-accounts"
    description: "Open a custody account for a jurisdiction."
    roles: [StateAdmin]
    code: 201
    input: [state_code]
    output: StateAccount
    side_effects: ["creates StateAccount with custody_balance_cents 0"]
  - method: GET
    path: "/state-accounts/{id}"
    description: "Fetch a custody account with its computed balance."
    roles: [StateAdmin, StateExaminer, StateApprover]
    code: 200
    input: []
    output: StateAccount
    side_effects: []
  # --- Owner ---
  - method: POST
    path: "/owners"
    description: "Register an owner / claimant identity."
    roles: [StateAdmin]
    code: 201
    input: [full_name, ssn_last4, address_state, email]
    output: Owner
    side_effects: ["creates Owner with id_verified false"]
  - method: GET
    path: "/owners/{id}"
    description: "Fetch an owner."
    roles: [StateAdmin, Owner, StateExaminer, StateApprover]
    code: 200
    input: []
    output: Owner
    side_effects: []
  # --- RecoveryFirm ---
  - method: POST
    path: "/recovery-firms"
    description: "Register a recovery / locator firm."
    roles: [StateAdmin]
    code: 201
    input: [legal_name, registered_state, license_number, max_fee_pct]
    output: RecoveryFirm
    side_effects: ["creates RecoveryFirm with status ACTIVE"]
  - method: GET
    path: "/recovery-firms/{id}"
    description: "Fetch a recovery firm."
    roles: [StateAdmin, RecoveryAgent, StateExaminer, StateApprover]
    code: 200
    input: []
    output: RecoveryFirm
    side_effects: []
  # --- Property ---
  - method: POST
    path: "/properties"
    description: "Record a property held by a holder; computes escheat_state and dormancy_date."
    roles: [Holder]
    code: 201
    input: [holder_id, property_type_id, owner_name, "owner_last_known_state?", amount_cents, last_activity_date, "issue_date?"]
    output: Property
    side_effects: ["computes escheat_state (priority rule)", "computes dormancy_date", "creates Property in ACTIVE"]
  - method: GET
    path: "/properties/{id}"
    description: "Fetch a property."
    roles: [StateAdmin, Holder, StateExaminer, StateApprover, Owner, RecoveryAgent]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/properties"
    description: "List/filter properties."
    roles: [StateAdmin, Holder, StateExaminer, StateApprover]
    code: 200
    input: ["holder_id?", "property_type_id?", "report_id?", "status?", "escheat_state?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: POST
    path: "/properties/{id}/evaluate-dormancy"
    description: "Attempt ACTIVE->DORMANT once the dormancy date is reached."
    roles: [Holder]
    code: 200
    input: []
    output: Property
    side_effects: ["sets status DORMANT when current_clock >= dormancy_date, else ERR_NOT_YET_DORMANT"]
  - method: POST
    path: "/properties/{id}/notices"
    description: "Send a due-diligence notice; moves DORMANT->DUE_DILIGENCE."
    roles: [Holder]
    code: 201
    input: [method]
    output: DueDiligenceNotice
    side_effects: ["creates DueDiligenceNotice sent_at=current_clock", "sets Property.status DUE_DILIGENCE", "rejects if within DUE_DILIGENCE_NOTICE_BUFFER_DAYS of a prior notice"]
  - method: GET
    path: "/properties/{id}/notices"
    description: "List due-diligence notices for a property (FK reverse-reachability)."
    roles: [StateAdmin, Holder, StateExaminer]
    code: 200
    input: []
    output: DueDiligenceNotice[]
    side_effects: []
  - method: POST
    path: "/due-diligence-notices/{id}/record-response"
    description: "Record an owner response; reactivates the property DUE_DILIGENCE->ACTIVE."
    roles: [Holder]
    code: 200
    input: []
    output: DueDiligenceNotice
    side_effects: ["sets responded true, responded_at=current_clock", "sets Property.status ACTIVE"]
  # --- HolderReport ---
  - method: POST
    path: "/reports"
    description: "Open a DRAFT holder report for a jurisdiction and period."
    roles: [Holder]
    code: 201
    input: [holder_id, report_state, report_period_year]
    output: HolderReport
    side_effects: ["creates HolderReport in DRAFT", "rejects duplicate (holder,state,year) with ERR_REPORT_PERIOD_OVERLAP"]
  - method: GET
    path: "/reports/{id}"
    description: "Fetch a holder report with computed totals."
    roles: [StateAdmin, Holder, StateExaminer, StateApprover]
    code: 200
    input: []
    output: HolderReport
    side_effects: []
  - method: GET
    path: "/reports"
    description: "List/filter holder reports."
    roles: [StateAdmin, Holder, StateExaminer, StateApprover]
    code: 200
    input: ["holder_id?", "report_state?", "status?", "limit?", "offset?"]
    output: HolderReport[]
    side_effects: []
  - method: POST
    path: "/reports/{id}/add-property"
    description: "Attach a DUE_DILIGENCE property to a DRAFT report (OCC on report version)."
    roles: [Holder]
    code: 200
    input: [property_id, expected_report_version]
    output: HolderReport
    side_effects: ["sets Property.report_id and status REPORTED", "increments HolderReport.version by 1", "recomputes property_count and total_remitted_cents"]
  - method: POST
    path: "/reports/{id}/submit"
    description: "Submit a DRAFT report; requires reconciled total and no audit hold."
    roles: [Holder]
    code: 200
    input: [declared_total_cents]
    output: HolderReport
    side_effects: ["sets status SUBMITTED, submitted_at=current_clock"]
  - method: POST
    path: "/reports/{id}/begin-review"
    description: "Move a SUBMITTED report to UNDER_AUDIT."
    roles: [StateExaminer]
    code: 200
    input: []
    output: HolderReport
    side_effects: ["sets status UNDER_AUDIT"]
  - method: POST
    path: "/reports/{id}/accept"
    description: "Accept a report; escheats attached properties and credits custody."
    roles: [StateExaminer]
    code: 200
    input: []
    output: HolderReport
    side_effects: ["cascade: each attached REPORTED Property -> ESCHEATED with remittance + REMIT_IN ledger + custody credit", "sets status ACCEPTED"]
  - method: POST
    path: "/reports/{id}/reject"
    description: "Reject a report under audit."
    roles: [StateExaminer]
    code: 200
    input: []
    output: HolderReport
    side_effects: ["sets status REJECTED"]
  - method: POST
    path: "/reports/{id}/revise"
    description: "Return a REJECTED report to DRAFT for correction."
    roles: [Holder]
    code: 200
    input: []
    output: HolderReport
    side_effects: ["sets status DRAFT"]
  # --- Claim ---
  - method: POST
    path: "/claims"
    description: "File a claim against an ESCHEATED property."
    roles: [Owner, RecoveryAgent]
    code: 201
    input: [property_id, claimant_owner_id, filed_by, "recovery_firm_id?", "contract_fee_pct?"]
    output: Claim
    side_effects: ["snapshots claim_amount_cents from Property.remitted_amount_cents", "computes provisional_fee_cents", "creates Claim in FILED"]
  - method: GET
    path: "/claims/{id}"
    description: "Fetch a claim."
    roles: [StateAdmin, StateExaminer, StateApprover, Owner, RecoveryAgent]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/claims"
    description: "List/filter claims."
    roles: [StateAdmin, StateExaminer, StateApprover, Owner, RecoveryAgent]
    code: 200
    input: ["property_id?", "claimant_owner_id?", "recovery_firm_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/examine"
    description: "StateExaminer takes up a FILED claim (records examiner_user_id)."
    roles: [StateExaminer]
    code: 200
    input: []
    output: Claim
    side_effects: ["sets examiner_user_id = X-User-ID", "sets status UNDER_REVIEW"]
  - method: POST
    path: "/claims/{id}/request-evidence"
    description: "Request more evidence; UNDER_REVIEW->NEEDS_EVIDENCE."
    roles: [StateExaminer]
    code: 200
    input: []
    output: Claim
    side_effects: ["sets status NEEDS_EVIDENCE"]
  - method: POST
    path: "/claims/{id}/evidence"
    description: "Upload an evidence document for a claim."
    roles: [Owner, RecoveryAgent]
    code: 201
    input: [doc_type]
    output: EvidenceDocument
    side_effects: ["creates EvidenceDocument in PENDING"]
  - method: GET
    path: "/claims/{id}/evidence"
    description: "List evidence documents for a claim (FK reverse-reachability)."
    roles: [StateAdmin, StateExaminer, StateApprover, Owner, RecoveryAgent]
    code: 200
    input: []
    output: EvidenceDocument[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/evidence/{doc_id}/review"
    description: "StateExaminer accepts or rejects an evidence document."
    roles: [StateExaminer]
    code: 200
    input: [decision]
    output: EvidenceDocument
    side_effects: ["sets EvidenceDocument.status ACCEPTED or REJECTED, reviewed_by_user_id = X-User-ID"]
  - method: POST
    path: "/claims/{id}/resubmit"
    description: "Claimant resubmits after evidence; NEEDS_EVIDENCE->UNDER_REVIEW."
    roles: [Owner, RecoveryAgent]
    code: 200
    input: []
    output: Claim
    side_effects: ["sets status UNDER_REVIEW"]
  - method: POST
    path: "/claims/{id}/approve"
    description: "StateApprover approves an UNDER_REVIEW claim (SoD enforced); runs payout waterfall."
    roles: [StateApprover]
    code: 200
    input: []
    output: Claim
    side_effects: ["computes fee_cents, admin_deduction_cents, net_payout_cents", "sets approver_user_id = X-User-ID", "sets status APPROVED"]
  - method: POST
    path: "/claims/{id}/pay"
    description: "Pay an APPROVED claim; cascades property CLAIMED and debits custody."
    roles: [StateApprover]
    code: 200
    input: []
    output: Claim
    side_effects: ["sets status PAID", "cascade: Property ESCHEATED->CLAIMED with PAYOUT_OUT+FEE_OUT ledger and custody debit"]
  - method: POST
    path: "/claims/{id}/deny"
    description: "Deny an UNDER_REVIEW claim (terminal)."
    roles: [StateExaminer]
    code: 200
    input: []
    output: Claim
    side_effects: ["sets status DENIED"]
  - method: POST
    path: "/claims/{id}/void"
    description: "Void a PAID claim; compensating clawback restores custody and property."
    roles: [StateApprover]
    code: 200
    input: []
    output: Claim
    side_effects: ["sets status VOIDED", "cascade: Property CLAIMED->ESCHEATED with CLAWBACK_IN ledger and custody credit"]
  # --- AuditCase ---
  - method: POST
    path: "/audit-cases"
    description: "Open an audit case against a holder; sets audit_hold."
    roles: [StateExaminer]
    code: 201
    input: [holder_id]
    output: AuditCase
    side_effects: ["creates AuditCase in OPEN, examiner_user_id = X-User-ID", "sets Holder.audit_hold true"]
  - method: GET
    path: "/audit-cases/{id}"
    description: "Fetch an audit case."
    roles: [StateAdmin, StateExaminer, Holder]
    code: 200
    input: []
    output: AuditCase
    side_effects: []
  - method: GET
    path: "/audit-cases"
    description: "List/filter audit cases (FK reverse-reachability on holder_id)."
    roles: [StateAdmin, StateExaminer, Holder]
    code: 200
    input: ["holder_id?", "status?", "limit?", "offset?"]
    output: AuditCase[]
    side_effects: []
  - method: POST
    path: "/audit-cases/{id}/request-info"
    description: "Request info from the holder; OPEN->INFO_REQUESTED."
    roles: [StateExaminer]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["sets status INFO_REQUESTED"]
  - method: POST
    path: "/audit-cases/{id}/provide-info"
    description: "Holder provides requested info; INFO_REQUESTED->OPEN."
    roles: [Holder]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["sets status OPEN"]
  - method: POST
    path: "/audit-cases/{id}/close-clean"
    description: "Close an audit with no finding; may clear audit_hold."
    roles: [StateExaminer]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["sets status CLOSED_NO_FINDING", "recomputes Holder.audit_hold"]
  - method: POST
    path: "/audit-cases/{id}/close-assess"
    description: "Close an audit with an assessed penalty; may clear audit_hold."
    roles: [StateExaminer]
    code: 200
    input: [assessed_penalty_cents, findings]
    output: AuditCase
    side_effects: ["sets status CLOSED_ASSESSED", "adds penalty to Holder.assessed_penalty_cents", "recomputes Holder.audit_hold"]
  # --- LedgerEntry ---
  - method: GET
    path: "/ledger-entries/{id}"
    description: "Fetch a single ledger entry."
    roles: [StateAdmin, StateExaminer, StateApprover]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []
  - method: GET
    path: "/ledger-entries"
    description: "List/filter ledger entries (FK reverse-reachability for all ledger FKs)."
    roles: [StateAdmin, StateExaminer, StateApprover]
    code: 200
    input: ["state_account_id?", "property_id?", "ref_claim_id?", "ref_report_id?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock)."
    roles: [StateAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets the logical clock used by all dormancy/interest/notice/due-diligence rules"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for this endpoint."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, malformed value, or bad enum."
  - id: ERR_HOLDER_NOT_FOUND
    http: 404
    condition: "Referenced Holder id does not exist."
  - id: ERR_PROPERTY_TYPE_NOT_FOUND
    http: 404
    condition: "Referenced PropertyType id does not exist."
  - id: ERR_STATE_ACCOUNT_NOT_FOUND
    http: 404
    condition: "Referenced StateAccount id does not exist."
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "Referenced Owner id does not exist."
  - id: ERR_FIRM_NOT_FOUND
    http: 404
    condition: "Referenced RecoveryFirm id does not exist."
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "Referenced Property id does not exist."
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "Referenced DueDiligenceNotice id does not exist."
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "Referenced HolderReport id does not exist."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "Referenced Claim id does not exist."
  - id: ERR_EVIDENCE_NOT_FOUND
    http: 404
    condition: "Referenced EvidenceDocument id does not exist."
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "Referenced AuditCase id does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the entity's current state."
  - id: ERR_NOT_YET_DORMANT
    http: 409
    condition: "evaluate-dormancy called before current_clock reaches dormancy_date."
  - id: ERR_PROPERTY_NOT_CLAIMABLE
    http: 409
    condition: "Claim filed against a property not in ESCHEATED."
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Approver/payer X-User-ID equals the claim's examiner_user_id."
  - id: ERR_HOLDER_UNDER_AUDIT
    http: 409
    condition: "Report submit attempted while the holder's audit_hold is true."
  - id: ERR_DUE_DILIGENCE_INCOMPLETE
    http: 422
    condition: "Due-diligence min-days window not yet elapsed for a property being reported."
  - id: ERR_NOTICE_TOO_SOON
    http: 409
    condition: "New notice falls within DUE_DILIGENCE_NOTICE_BUFFER_DAYS (= 30) days of an existing notice on the property."
  - id: ERR_ESCHEAT_STATE_MISMATCH
    http: 422
    condition: "Property.escheat_state does not equal the report's report_state."
  - id: ERR_FIRM_REQUIRED
    http: 422
    condition: "filed_by FIRM without recovery_firm_id, or filed_by OWNER with a firm/nonzero fee."
  - id: ERR_CLAIM_ALREADY_ACTIVE
    http: 409
    condition: "The property already has a non-terminal claim."
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "A report already exists for the same (holder, state, year)."
  - id: ERR_EVIDENCE_REQUIRED
    http: 422
    condition: "Approval attempted while an EvidenceDocument for the claim is still PENDING."
  - id: ERR_STALE_REPORT_VERSION
    http: 412
    condition: "expected_report_version does not match the report's current version (OCC)."
  - id: ERR_FEE_EXCEEDS_CAP
    http: 422
    condition: "contract_fee_pct exceeds min(firm.max_fee_pct, STATE_MAX_FEE_PCT)."
  - id: ERR_REMITTANCE_MISMATCH
    http: 422
    condition: "declared_total_cents does not equal the report's computed total_remitted_cents."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StateAdmin
    description: "State system administrator: registers holders/owners/firms, defines property types and custody accounts, controls the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /holders"
      - "POST /property-types"
      - "POST /state-accounts"
      - "POST /owners"
      - "POST /recovery-firms"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across holders, property-types, state-accounts, owners, firms, properties, reports, claims, audit-cases, ledger-entries"
  - name: Holder
    description: "A reporting institution acting on its own properties, notices, and reports."
    identity: "entity_backed:Holder"
    exclusive_operations:
      - "POST /properties"
      - "POST /properties/{id}/evaluate-dormancy"
      - "POST /properties/{id}/notices"
      - "POST /due-diligence-notices/{id}/record-response"
      - "POST /reports"
      - "POST /reports/{id}/add-property"
      - "POST /reports/{id}/submit"
      - "POST /reports/{id}/revise"
      - "POST /audit-cases/{id}/provide-info"
    shared_operations:
      - "GET reads on own holder, properties, reports, notices, audit-cases"
  - name: Owner
    description: "An owner/claimant filing and pursuing their own claim."
    identity: "entity_backed:Owner"
    exclusive_operations: []
    shared_operations:
      - "POST /claims (filed_by OWNER)"
      - "POST /claims/{id}/evidence"
      - "POST /claims/{id}/resubmit"
      - "GET reads on own claims and evidence"
  - name: RecoveryAgent
    description: "A licensed recovery firm filing and pursuing claims on owners' behalf for a fee."
    identity: "entity_backed:RecoveryFirm"
    exclusive_operations: []
    shared_operations:
      - "POST /claims (filed_by FIRM)"
      - "POST /claims/{id}/evidence"
      - "POST /claims/{id}/resubmit"
      - "GET reads on own firm, claims, evidence"
  - name: StateExaminer
    description: "State examiner: reviews claims and evidence, reviews reports, and conducts audits. Under SoD, cannot approve/pay a claim they examined."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/examine"
      - "POST /claims/{id}/request-evidence"
      - "POST /claims/{id}/evidence/{doc_id}/review"
      - "POST /claims/{id}/deny"
      - "POST /reports/{id}/begin-review"
      - "POST /reports/{id}/accept"
      - "POST /reports/{id}/reject"
      - "POST /audit-cases"
      - "POST /audit-cases/{id}/request-info"
      - "POST /audit-cases/{id}/close-clean"
      - "POST /audit-cases/{id}/close-assess"
    shared_operations:
      - "GET reads across the system"
  - name: StateApprover
    description: "State approver: approves, pays, and voids claims. Under SoD, must differ from the claim's examiner."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/approve"
      - "POST /claims/{id}/pay"
      - "POST /claims/{id}/void"
    shared_operations:
      - "GET reads across claims, properties, reports, ledger-entries, state-accounts"



