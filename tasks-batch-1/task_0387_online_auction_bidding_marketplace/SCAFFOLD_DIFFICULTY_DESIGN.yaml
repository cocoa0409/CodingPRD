              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Inv S", format: "BUY_NOW", buy_now_price_cents: 30000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${b_id}", shipping_cents: 0 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          assert:
            - "Account.${s_id}.fee_balance_cents == 0"
            - "SellerFeeInvoice for ${ord_id} settlement_status == CREDITED"
            - "Account.${s_id}.standing == GOOD"
