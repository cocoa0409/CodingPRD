  # ===================================================================================
  - rule_id: transitive_cascade
    instances:
      - name: grounding_cascade_incident_to_drone_to_flight_to_order_and_nest
        grounds:
          - state_machines.Incident.UNDER_REVIEW_to_MAINTENANCE_REQUIRED
          - state_machines.Drone.IN_FLIGHT_to_GROUNDED
          - state_machines.Flight.LAUNCHED_to_ABORTED
          - state_machines.Order.IN_TRANSIT_to_QUOTED
          - calculations.nest_pad_ledger
          - calculations.customer_funds_ledger
        distinguishing_aspect: |
          Cascade #1, depth 4, triggered by POST /incidents/{id}/outcome (outcome=MAINTENANCE_REQUIRED):
          the incident's own transition grounds the Drone; BECAUSE the drone is now GROUNDED its live
          Flight is force-aborted; BECAUSE that flight aborted its AirspaceAuthorization is REVOKED,
          the recovery Nest's pad is released and the Order reverts IN_TRANSIT -> QUOTED with the
          funds hold reversed. Each hop is caused by the previous hop, not by the original request.
        test_recipe:
          setup:
            - "Clock 2026-06-01T09:00:00Z; Bay + nest N1 (2 pads); drone N101 with a READY 100% pack."
            - "Order 2000 g STANDARD (order_total 8.96) dispatched, authorized, released and LAUNCHED: Flight is LAUNCHED/CLEARED, Order IN_TRANSIT, Customer.held_total 8.96, Nest.reserved_pads 1, Drone IN_FLIGHT, Battery IN_USE."
            - "A CRITICAL incident is filed against the drone and moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
