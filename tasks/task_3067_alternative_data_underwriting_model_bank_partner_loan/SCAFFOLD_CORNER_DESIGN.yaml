              as_user_id: "ro-creator"
          assert:
            - "create returns 201 with outcome == PENDING"
            - "decide returns 200 with outcome == FAILED and details == \"exclude zip-derived variable\""
            - "GET /platform/fairness-reviews?model_version_id=${m_id}&review_type=VARIABLE_EXCLUSION returns exactly 1 row"

