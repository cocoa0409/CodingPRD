            - call: "POST /market-conduct/data-calls/${clm_dc_id}/bulk-review"
              payload:
                reviews:
                  - { file_reference: "CLM-000001", error_severity: "MATERIAL", underpaid_amount_cents: 30000, days_to_pay: 74 }
                  - { file_reference: "CLM-000401", error_severity: "MATERIAL", underpaid_amount_cents: 20000, days_to_pay: 55 }
                  - { file_reference: "CLM-000801", error_severity: "MATERIAL", underpaid_amount_cents: 10000, days_to_pay: 41 }
                  - { file_reference: "CLM-001201", error_severity: "NONE" }
