            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "ACMLX", fund_name: "Acme Large Cap Value", asset_class_code: "US_LARGE_CAP", share_class_code: "R6", gross_expense_ratio_bps: 80, net_expense_ratio_bps: 70, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 16, manager_tenure_quarters: 6, manager_change_flag: true, style_drift_r2: 0.8500, plan_assets_cents: 0 }
              as: InvestmentConsultant
              captures: { fund1_id: $.data.id }
            - call: "POST /governance/quarterly-reviews"
              payload: { plan_id: "${plan_id}", quarter_index: 0 }
              as: InvestmentConsultant
              captures: { r1_id: $.data.id, r1_v: $.data.version }
          trigger:
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${r1_id}", fund_id: "${fund1_id}", expected_review_version: "${r1_v}", trailing_return_3y_bps: 820, trailing_return_5y_bps: 700, benchmark_return_3y_bps: 900, benchmark_return_5y_bps: 650, peer_rank_pct: 90, style_drift_r2: 0.8500, net_expense_ratio_bps: 70, peer_median_expense_bps: 40, manager_tenure_quarters: 6, manager_change_flag: true }
              as: InvestmentConsultant
              captures: { sc1_id: $.data.id }
            - call: "GET /governance/quarterly-reviews/${r1_id}"
              payload: {}
              as: InvestmentConsultant
              captures: { r1_v2: $.data.version }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${r1_id}", fund_id: "${fund1_id}", expected_review_version: "${r1_v2}", trailing_return_3y_bps: 820, trailing_return_5y_bps: 700, benchmark_return_3y_bps: 900, benchmark_return_5y_bps: 650, rolling_since_watch_return_bps: 100, rolling_since_watch_benchmark_bps: 900, peer_rank_pct: 90, style_drift_r2: 0.8500, net_expense_ratio_bps: 70, peer_median_expense_bps: 40, manager_tenure_quarters: 6, manager_change_flag: true }
              as: InvestmentConsultant
              captures: { sc2_id: $.data.id }
          assert:
            - "QuarterlyReview.${r1_id}.scoring_variant == TRAILING_PERIOD"
            - "FundScorecard.${sc1_id}.performance_component == 47.20"
            - "FundScorecard.${sc1_id}.peer_component == 10.00"
            - "FundScorecard.${sc1_id}.expense_component == 40.00"
            - "FundScorecard.${sc1_id}.style_component == 100.00"
            - "FundScorecard.${sc1_id}.manager_component == 12.00"
            - "FundScorecard.${sc1_id}.composite_score == 40.08"
            - "FundScorecard.${sc1_id}.watch_recommendation == WATCH"
            - "FundScorecard.${sc1_id}.status == SUPERSEDED"
            - "FundScorecard.${sc2_id}.supersedes_scorecard_id == ${sc1_id}"
            - "FundScorecard.${sc2_id}.performance_component == 47.20"
            - "FundScorecard.${sc2_id}.composite_score == 40.08"
            - "FundScorecard.${sc2_id}.watch_recommendation == WATCH"
            - "FundScorecard.${sc2_id}.status == SUBMITTED"
