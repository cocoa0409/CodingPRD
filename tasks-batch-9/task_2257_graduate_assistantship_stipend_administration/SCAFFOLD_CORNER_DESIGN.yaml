              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /academic-terms/${term_id}/open"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /students"
              payload: { student_number: "GS-1060", full_name: "Ada Vance", degree_level: "DOCTORAL", is_international: false, cumulative_gpa: 3.60, enrolled_credit_hours: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
