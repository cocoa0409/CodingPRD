            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { server_role_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "BAR", title: "Bartender", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1000, pool_share_points: 8, side_work_eligible: true }
              as: PayrollAdmin
              captures: { bar_role_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { ana_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Zed Okafor", external_payroll_ref: "E2", monthly_tip_baseline_cents: 0, separation_date: "2026-08-05T00:00:00Z" }
