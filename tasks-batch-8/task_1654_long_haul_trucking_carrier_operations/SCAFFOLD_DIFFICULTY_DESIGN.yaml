            - { call: "POST /trips", payload: { load_id: "${loadB}", driver_id: "${drvB}", tractor_id: "${trB}", planned_deadhead_miles: 120, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 1020 } ] }, as: Dispatcher, captures: { errB: $.data.error_id } }
