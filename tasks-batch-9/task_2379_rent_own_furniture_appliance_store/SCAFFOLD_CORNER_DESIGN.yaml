      - name: delivery_order_reschedule_with_a_stale_agreement_version_is_rejected
        claim_type: optimistic_concurrency
        rule_id: delivery-order-reschedule-stale-agreement
        grounds:
          - concurrency_rules[delivery-order-reschedule-stale-agreement]
          - endpoints[POST /agreements/{id}/delivery-orders]
          - state_machines.DeliveryOrder.SCHEDULED_to_SUPERSEDED
        distinguishing_aspect: |
          Cutting a delivery order supersedes the agreement's prior order, so the
          create is version-guarded: the second order offered with the version
          read before the FIRST create is refused with 412 and the original
          dispatch survives untouched. Retried with the current version it is
