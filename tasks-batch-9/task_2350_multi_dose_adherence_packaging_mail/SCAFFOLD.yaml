    raised_by: "POST /pharmacy/patients/{id}/synchronize; POST /pharmacy/fill-cycles"
  - error_id: ERR_REFILL_TOO_SOON
    http_status: 409
    message: "Fill cycle {id} was rejected by the payer as a refill too soon."
    raised_by: "POST /pharmacy/fill-cycles/{id}/generate-roll while insurance_status == REJECTED_TOO_SOON"
  - error_id: ERR_NOTHING_TO_REISSUE
    http_status: 422
    message: "Fill cycle {id} has no lines awaiting reissue."
    raised_by: "POST /pharmacy/fill-cycles/{id}/reissue"

# =============================================================================
# 1.7 RBAC Matrix — role_model: segregation_of_duties
# =============================================================================
roles:

  - name: PlatformAdmin
    identity: opaque
    description: "Configures payer plans and enrolls patients. Reads everything operational but performs no pharmacy step."
    exclusive_operations:
      - "POST /pharmacy/insurance-plans"
    shared_operations:
      - "POST /pharmacy/patients (with PharmacyOperations)"
      - "every GET under /pharmacy"
      - "POST /pharmacy/_clock/set_current_utc"
    forbidden_operations:
      - "POST /pharmacy/fill-cycles/{id}/adjudicate — pharmacist judgement"
      - "POST /pharmacy/fill-cycles/{id}/generate-roll and /pharmacy/pouch-rolls/{id}/pack — bench work"
      - "POST /pharmacy/pouch-rolls/{id}/verify and /rework — pharmacist judgement"
      - "POST /pharmacy/refill-authorizations/{id}/respond and /pharmacy/prescriptions/{id}/regimen-change — prescriber acts"
      - "POST /pharmacy/shipments/{id}/confirm-pickup — patient acts"

  - name: PharmacyOperations
    identity: opaque
    description: "Owns synchronization, cycle creation, the authorization chase, split shipments and reissue. Cannot adjudicate, cannot pack and cannot verify."
    exclusive_operations:
      - "POST /pharmacy/patients/{id}/synchronize"
      - "POST /pharmacy/patients/{id}/adherence-review"
      - "POST /pharmacy/fill-cycles"
      - "POST /pharmacy/fill-cycles/{id}/shipments"
      - "POST /pharmacy/shipments/{id}/dispatch"
      - "POST /pharmacy/shipments/{id}/deliver"
      - "POST /pharmacy/refill-authorizations"
      - "POST /pharmacy/refill-authorizations/{id}/chase"
      - "POST /pharmacy/refill-authorizations/{id}/escalate"
      - "POST /pharmacy/fill-cycles/{id}/reissue"
    shared_operations:
      - "POST /pharmacy/patients (with PlatformAdmin)"
      - "POST /pharmacy/prescriptions (with Prescriber)"
      - "POST /pharmacy/patients/{id}/autoship (with Patient)"
      - "POST /pharmacy/patients/{id}/dose-events (with Patient)"
      - "POST /pharmacy/vacation-exceptions (with Patient)"
      - "every GET under /pharmacy"
      - "POST /pharmacy/_clock/set_current_utc"
    forbidden_operations:
      - "POST /pharmacy/insurance-plans — plan configuration"
      - "POST /pharmacy/fill-cycles/{id}/adjudicate — pharmacist judgement"
      - "POST /pharmacy/fill-cycles/{id}/generate-roll and /pharmacy/pouch-rolls/{id}/pack — bench work"
      - "POST /pharmacy/pouch-rolls/{id}/verify, /rework and /pharmacy/vacation-exceptions/{id}/decide — pharmacist judgement"
      - "POST /pharmacy/refill-authorizations/{id}/respond and /pharmacy/prescriptions/{id}/regimen-change — prescriber acts"
      - "POST /pharmacy/shipments/{id}/confirm-pickup — patient acts"

  - name: VerifyingPharmacist
    identity: opaque
    description: "Professional judgement: payer adjudication, roll verification, rework and travel exception decisions. Never packs a roll, and per §1.4 priority 18 may not verify or image a roll they packed."
    exclusive_operations:
      - "POST /pharmacy/fill-cycles/{id}/adjudicate"
      - "POST /pharmacy/pouch-rolls/{id}/verify"
      - "POST /pharmacy/pouch-rolls/{id}/rework"
      - "POST /pharmacy/vacation-exceptions/{id}/decide"
    shared_operations:
      - "POST /pharmacy/pouches/{id}/verification-image (with PackagingTechnician)"
      - "POST /pharmacy/pouch-rolls/{id}/verification-images (with PackagingTechnician)"
      - "every GET under /pharmacy"
      - "POST /pharmacy/_clock/set_current_utc"
    forbidden_operations:
      - "POST /pharmacy/insurance-plans and POST /pharmacy/patients"
      - "POST /pharmacy/fill-cycles, /pharmacy/fill-cycles/{id}/shipments, /pharmacy/fill-cycles/{id}/reissue"
      - "POST /pharmacy/fill-cycles/{id}/generate-roll and /pharmacy/pouch-rolls/{id}/pack — bench work"
      - "POST /pharmacy/refill-authorizations and its /chase, /escalate, /respond routes"
      - "POST /pharmacy/shipments/{id}/dispatch, /deliver, /confirm-pickup"
      - "POST /pharmacy/patients/{id}/synchronize, /autoship, /dose-events, /adherence-review"

  - name: PackagingTechnician
    identity: opaque
    description: "Bench role: builds the roll, packs it and captures pack-verification images. Cannot verify their own work and cannot adjudicate."
    exclusive_operations:
      - "POST /pharmacy/fill-cycles/{id}/generate-roll"
      - "POST /pharmacy/pouch-rolls/{id}/pack"
    shared_operations:
      - "POST /pharmacy/pouches/{id}/verification-image (with VerifyingPharmacist)"
      - "POST /pharmacy/pouch-rolls/{id}/verification-images (with VerifyingPharmacist)"
      - "GET /pharmacy/patients/{id}, /pharmacy/prescriptions, /pharmacy/prescriptions/{id}, /pharmacy/fill-cycles, /pharmacy/fill-cycles/{id}, /pharmacy/cycle-lines, /pharmacy/cycle-lines/{id}, /pharmacy/pouch-rolls, /pharmacy/pouch-rolls/{id}, /pharmacy/pouches, /pharmacy/pouches/{id}, /pharmacy/shipments, /pharmacy/shipments/{id}"
      - "POST /pharmacy/_clock/set_current_utc"
    forbidden_operations:
      - "POST /pharmacy/pouch-rolls/{id}/verify and /rework — second-person verification"
      - "POST /pharmacy/fill-cycles/{id}/adjudicate"
      - "POST /pharmacy/insurance-plans, POST /pharmacy/patients, POST /pharmacy/prescriptions"
      - "POST /pharmacy/fill-cycles and every /pharmacy/shipments write route"
      - "GET /pharmacy/insurance-plans/{id}, /pharmacy/patients, /pharmacy/credit-memos, /pharmacy/vacation-exceptions, /pharmacy/refill-authorizations, /pharmacy/adherence-events"

  - name: Prescriber
    identity: opaque
    description: "Writes prescriptions, answers refill authorization chases and issues mid-cycle regimen changes. Touches no pharmacy operation."
    exclusive_operations:
      - "POST /pharmacy/refill-authorizations/{id}/respond"
      - "POST /pharmacy/prescriptions/{id}/regimen-change"
    shared_operations:
      - "POST /pharmacy/prescriptions (with PharmacyOperations)"
      - "GET /pharmacy/prescriptions, /pharmacy/prescriptions/{id}, /pharmacy/refill-authorizations, /pharmacy/refill-authorizations/{id}"
      - "POST /pharmacy/_clock/set_current_utc"
    forbidden_operations:
      - "POST /pharmacy/refill-authorizations, /chase and /escalate — the pharmacy chases, the prescriber answers"
      - "POST /pharmacy/fill-cycles and every cycle, roll, pouch and shipment write route"
