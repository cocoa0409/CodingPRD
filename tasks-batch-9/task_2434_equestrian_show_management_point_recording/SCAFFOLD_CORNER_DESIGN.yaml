      - name: priority_ladder_conflict_ordering
        claim_type: priority_conflict
        grounds:
          - validations.priority_10
          - validations.priority_21
        excluded_because:
          difficulty_instance: class_not_open_outranks_coggins_expired
          rationale: |
            The §1.8 instance stages a request that violates a priority-10 state guard
            AND priority 21 simultaneously, asserts the priority-10 error, then fixes
            only the state defect and asserts the priority-21 error appears — the
            priority-conflict claim in its strongest form.

      - name: temporal_overlap_detection
        claim_type: temporal
        grounds:
          - validations.priority_42
          - validations.priority_43
        excluded_because:
          difficulty_instance: ring_slot_half_open_plus_turnover_buffer
          rationale: |
            That instance (with its sibling official_closed_interval_plus_travel_gap)
            already probes both temporal geometries one minute either side of the
            boundary, which is the whole of the temporal-validation claim here.

      - name: stall_capacity_aggregate_boundary
        claim_type: aggregate
        grounds:
          - validations.priority_60
          - calculations.show_stall_ledger
        excluded_because:
          difficulty_instance: stall_capacity_accept_boundary
          rationale: |
            The §1.8 instance accepts entries until reserved_stall_count sits exactly on
            stall_capacity and then rejects the next request, which is the individually
            valid / collectively excessive claim for stalls.

      - name: official_license_cross_entity
        claim_type: cross_entity
        grounds:
          - validations.priority_23
        excluded_because:
          difficulty_instance: official_license_outranks_time_conflict
          rationale: |
            That instance drives all four legs of the licence gate (role, discipline,
            level versus the show's competition_level, and expiry versus the slot start)
            and shows the gate outranking the priority-43 time conflict, so both the
            cross-entity and the ordering aspects are covered.

  - section: endpoints
    instances:
      - name: coverage_checkin_lead_window_boundary
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/coverage-shifts/{id}/activate
          - state_machines.CoverageShift.SCHEDULED_to_ACTIVE
          - validations.priority_64
        distinguishing_aspect: |
          Check-in is a conditional action gated on the logical clock: one minute before
          the COVERAGE_CHECKIN_LEAD_MINUTES window opens it must be refused, and exactly
          on the boundary (start_utc - 60 minutes) it must succeed. The same action
          replayed once the shift is ACTIVE returns the state guard, not a second
          success — so the instance pins the boundary, the sign of the comparison and
          idempotency in one sweep.
        test_recipe:
          setup:
            - "A show (licence state is irrelevant: coverage shifts are not licence-gated) with a VETERINARIAN CoverageShift 2026-09-10T14:00:00Z .. 2026-09-10T20:00:00Z."
            - "The check-in window therefore opens at 2026-09-10T13:00:00Z (start_utc minus COVERAGE_CHECKIN_LEAD_MINUTES 60)."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/coverage-shifts"
              payload: { coverage_type: "VETERINARIAN", provider_name: "Ridgeline Equine Vets", start_utc: "2026-09-10T14:00:00Z", end_utc: "2026-09-10T20:00:00Z" }
              as: GroundsManager
              captures: { vet_shift_id: $.data.id, vet_status: $.data.status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:59:00Z" }
              as: FederationOfficer
            - call: "POST /coverage-shifts/${vet_shift_id}/activate"
              payload: {}
              as: GroundsManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T13:00:00Z" }
              as: FederationOfficer
            - call: "POST /coverage-shifts/${vet_shift_id}/activate"
              payload: {}
              as: GroundsManager
              captures: { activated_status: $.data.status, activated_version: $.data.version }
            - call: "POST /coverage-shifts/${vet_shift_id}/activate"
              payload: {}
              as: GroundsManager
            - call: "GET /shows/${show_id}/coverage-shifts?coverage_type=VETERINARIAN&status=ACTIVE"
              payload: {}
              as: GroundsManager
          assert:
            - "${vet_status} == SCHEDULED at creation, version == 1"
            - "at 12:59 (start minus 61 minutes) activate -> 409 ERR_COVERAGE_CHECKIN_TOO_EARLY and the shift is still SCHEDULED at version 1"
            - "at exactly 13:00 (start minus 60 minutes) activate -> 200 with ${activated_status} == ACTIVE and ${activated_version} == 2 — the comparison is `>=`"
            - "the replayed activate -> 409 ERR_COVERAGE_SHIFT_NOT_SCHEDULED"
            - "the filtered list returns total_count == 1 and that row ${vet_shift_id} has status ACTIVE at version 2 — the rejected replay did not bump the version"

      - name: slot_start_gate_sweep_rejects_unmet_conditions
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/ring-slots/{id}/start
          - state_machines.RingSlot.SCHEDULED_to_RUNNING
          - validations.priority_24
          - validations.priority_25
          - validations.priority_26
          - calculations.official_load_ledger.constants.REQUIRED_OFFICIALS
        distinguishing_aspect: |
          Starting a ring is the scaffold's most heavily guarded conditional action, and
          its guards are ORDERED. Three separately defective rings prove it: an unsafe
          surface returns ERR_FOOTING_UNSAFE; a ring on MAINTENANCE_HOLD whose footing is
          ALSO unsafe returns ERR_RING_NOT_AVAILABLE (ring status is checked before
          footing, so an implementation that checks footing first fails here); and a
          sound ring returns ERR_VET_COVERAGE_MISSING, then
          ERR_OFFICIALS_REQUIREMENT_UNMET while only the judge chair is filled, then
          succeeds once the LOCAL requirement of one JUDGE plus one STEWARD is met.
          Replaying the successful start returns the state guard.
        test_recipe:
          setup:
            - "APPROVED LOCAL show 2026-09-10T13:00 .. 2026-09-13T22:00 with three rings, all turnover_buffer_minutes 10: Ring L seeded footing_condition_score 40, Ring H seeded 100 and then pushed to 50 by a maintenance hold, Ring A seeded 100."
            - "Three OPEN classes with zero entries -> every slot is 20 minutes long (0 ride + 10 walk + 10 buffer)."
            - "Slots: class 101 on Ring L at 2026-09-10T14:00, class 102 on Ring H at 2026-09-11T14:00 (clear of the 13:00-13:30 hold window on 09-10), class 103 on Ring A at 2026-09-10T14:00."
            - "One JUDGE and one STEWARD official, level 2, JUMPER, expiring 2027-12-31."
