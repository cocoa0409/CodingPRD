  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_scheduling_requires_recipe_approved_not_superseded
        grounds:
          - validations[priority=10]
          - errors[ERR_RECIPE_NOT_APPROVED]
          - state_machines.BlendRecipe.APPROVED_to_SUPERSEDED
          - entities.BlendRecipe.fields.supersedes_recipe_id
        distinguishing_aspect: |
          The gate is on a DIFFERENT entity than the one being created: the run is refused because
          its referenced BlendRecipe left APPROVED. Because R-NF-0 had pinned_run_count 0 when its
          successor R-NF-0B was approved, the supersede fired immediately rather than being
          deferred, so a recipe that was legal to schedule against a moment earlier no longer is.
        test_recipe:
