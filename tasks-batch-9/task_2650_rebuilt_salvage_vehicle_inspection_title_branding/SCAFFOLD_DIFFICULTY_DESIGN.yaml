      - name: stolen_component_finding_cascades_document_referral_vehicle_and_rebuilder
        grounds:
          - entities.InspectionFinding.fields.blocking
          - state_machines.PartsDocument.VERIFIED_to_REJECTED
          - state_machines.FraudReferral
          - entities.Vehicle.fields.fraud_hold
          - entities.Rebuilder.fields.open_referral_count
          - entities.RebuiltApplication.fields.documented_parts_cost_cents
        distinguishing_aspect: |
          Depth-4 chain fired by POST /v1/inspections/{id}/findings: finding -> cited PartsDocument
          REJECTED -> application.documented_parts_cost_cents 280000 -> 230000 and an AUTO_CASCADE
