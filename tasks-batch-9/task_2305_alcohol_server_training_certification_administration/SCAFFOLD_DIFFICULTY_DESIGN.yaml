            - "AlcoholServer.${srv_id}.work_eligibility == \"GRACE\""
            - "ServerAssignment.${asg_id}.assignment_state == \"ACTIVE\" (grace servers are not work-restricted)"
            - "EmployerLocation.${loc_a_id}.assigned_server_count == 1"
            - "EmployerLocation.${loc_a_id}.compliant_server_count == 0"
            - "EmployerLocation.${loc_a_id}.grace_server_count == 1"
            - "EmployerLocation.${loc_a_id}.compliance_rate_strict_pct == 0.00"
            - "EmployerLocation.${loc_a_id}.compliance_rate_grace_inclusive_pct == 100.00"
            - "EmployerLocation.${loc_a_id}.compliance_posture == \"COMPLIANT\""
            - "EmployerAccount.${emp_id}.account_compliance_rate_pct == 0.00"
            - "ComplianceRun.${run_id}.certificates_graced_count == 1"
            - "ComplianceRun.${run_id}.certificates_lapsed_count == 0"
            - "ComplianceRun.${run_id}.reminders_sent_count == 1"
            - "GET /employer-locations/${loc_a_id}/compliance-dashboard returns compliance_rate_strict_pct 0.00 and compliance_rate_grace_inclusive_pct 100.00 in the same payload"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: seat_credit_settlement_pinned_eight_step_order_with_fee_cap_and_net_based_bonus
        grounds:
          - calculations.seat_credit_purchase_settlement
          - entities.EmployerAccount.fields.seat_credits_purchased_total
          - entities.EmployerAccount.fields.last_purchase_total_charged_cents
          - entities.EmployerAccount.fields.lifetime_charged_cents
        distinguishing_aspect: |
          The 80-seat purchase forces all three interlocking steps to be evaluated in the
          pinned order: the volume tier is keyed on the GROSS subtotal 200000 (6.00 pct),
          the processing fee is the CAP 2500 rather than the uncapped 5452, and the bonus
          credit is floor(net 188000 / 100000) = 1 rather than floor(gross 200000 /
          100000) = 2 — three different intermediate values feeding three different steps.
        test_recipe:
          setup:
            - "An employer account Lone Star Taverns LLC in ACTIVE standing with a zero seat-credit ledger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-accounts"
              payload: { legal_name: "Lone Star Taverns LLC", billing_state_code: "TX" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /employer-accounts/${emp_id}/seat-credit-purchases"
              payload: { seat_quantity: 80, unit_price_cents: 2500 }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
            - call: "POST /employer-accounts/${emp_id}/seat-credit-purchases"
              payload: { seat_quantity: 20, unit_price_cents: 2500 }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
          assert:
            - "After the first purchase EmployerAccount.${emp_id}.last_purchase_discount_pct == 6.00"
            - "After the first purchase EmployerAccount.${emp_id}.last_purchase_total_charged_cents == 190500"
            - "After the first purchase EmployerAccount.${emp_id}.seat_credits_purchased_total == 81 (80 seats + 1 net-based bonus, not 2)"
            - "After the first purchase EmployerAccount.${emp_id}.seat_credit_balance == 81"
            - "After the second purchase EmployerAccount.${emp_id}.last_purchase_discount_pct == 3.00 (gross subtotal exactly 50000 is inside the 3.00 pct tier)"
            - "After the second purchase EmployerAccount.${emp_id}.last_purchase_total_charged_cents == 49907 (fee round_half_up(48500 * 0.029) == 1407, below the 2500 cap)"
            - "After the second purchase EmployerAccount.${emp_id}.seat_credits_purchased_total == 101 (20 seats + 0 bonus)"
            - "After the second purchase EmployerAccount.${emp_id}.seat_credit_balance == 101"
            - "After the second purchase EmployerAccount.${emp_id}.lifetime_charged_cents == 240407"
            - "EmployerAccount.${emp_id}.seat_credits_consumed_total == 0"
            - "EmployerAccount.${emp_id}.seat_credits_refunded_total == 0"

      - name: dram_shop_credit_rounds_per_location_before_summing
        grounds:
          - calculations.dram_shop_discount_credit
          - calculations.dram_shop_discount_pct
          - entities.DramShopDocument.fields.discount_credit_cents
          - entities.DramShopDocument.fields.location_count
          - concurrency_rules[dram-shop-document-stale-account]
        distinguishing_aspect: |
          Two locations with premiums 4821734 and 1257444 at a 10.00 pct discount produce
          per-location credits 482173 (from 482173.40) and 125744 (from 125744.40) summing
          to 607917, whereas summing the premiums first (6079178) and rounding once yields
          607918 — the pinned per-location-then-sum order is observable as a one-cent
          difference.
        test_recipe:
          setup:
            - "TX jurisdiction with MANDATORY mandate covering both tracks."
            - "Employer Lone Star Taverns LLC in ACTIVE standing with exactly two ON_PREMISE TX locations, premiums 4821734 and 1257444 cents, created in that order."
            - "Server Ari Cole holds an ACTIVE certificate and is the account's only live assignment, at the first location, so account_compliance_rate_pct is 100.00 and no dram-shop document exists yet."
            - "The logical clock stands at 2026-08-15T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"], certificate_validity_months: 24, renewal_grace_days: 30, new_hire_training_days: 30, registry_submission_required: true, registry_deadline_days: 15, registry_late_fee_cents_per_day: 250, min_passing_score_pct: 70, max_retakes_allowed: 2, retake_cooling_off_hours: 24, proctor_separation_required: false, reminder_lead_days: 60 }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: ProgramAdmin
              captures: { course_v: $.data.version }
            - call: "POST /course-approvals"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", submission_note: "initial filing" }
              as: ProgramAdmin
              captures: { appr_id: $.data.id }
            - call: "POST /course-approvals/${appr_id}/decision"
              payload: { decision: "APPROVE", approval_number: "TX-ABC-2026-001", effective_from: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: StateRegulator
            - call: "POST /trainers"
              payload: { full_name: "Dana Reyes", email: "dana@tips.example" }
              as: ProgramAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /trainers/${tr_id}/credential"
              payload: { certified_tracks: ["ON_PREMISE"], certified_state_codes: ["TX"], credential_expires_at: "2027-06-30T00:00:00Z" }
