        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; published NMFC-2026A; customer ACME with three programs -- one ACTIVE CLASS_BASED, one APPROVED DENSITY_BASED, one MODELING FAK -- and customer BETA with one MODELING CLASS_BASED program."
