        grounds:
          - state_machines.Reservation.BOOKED_to_RELEASED
          - state_machines.ClassSession.FULL_to_OPEN
          - state_machines.ClassSession.OPEN_to_FULL
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          Depth-3 chain from a member cancel: cancel mutates Reservation r1 (RELEASED)
          -> that release frees a seat and triggers waitlist_promotion mutating r2
          (WAITLISTED->BOOKED) and its Membership wallet (debit 5) -> that promotion
          re-fills the seat and mutates ClassSession (OPEN->FULL). Each hop is caused
          by the previous hop.
