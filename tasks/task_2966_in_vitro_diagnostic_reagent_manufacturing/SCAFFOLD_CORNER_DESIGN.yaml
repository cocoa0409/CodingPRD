      - name: laboratory_and_production_exclusive_operations_are_mutually_closed_returns_forbidden_role
        claim_type: Exclusive Operation Denial
        grounds:
          - roles.QCAnalyst
          - roles.ProductionOperator
          - roles.QAReleaser
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "These three roles form the manufacturing triangle and are the ones most likely to be collapsed into one 'operations' permission: the analyst measures, the operator builds, the releaser decides. Each denial below crosses exactly one edge of that triangle, so a single over-broad grant is localised rather than hidden behind a passing aggregate."
