            - "Panelist.${p}.consecutive_no_shows == 3"
            - "Panelist.${p}.status == SUSPENDED (auto-transition at the 3rd no-show)"
            - "PanelAssignment.${a4}.status == EXCUSED (cascade hop 3: future ASSIGNED work on PLANNED session S4 auto-excused)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (state-vs-fiscal; safety-vs-referential)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_state_error_beats_fiscal_error
        grounds:
          - validations[priority=4]
          - validations[priority=9]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: activation of a DRAFT
          study whose client has 0.0 retainer balance violates both priority 4
          (ERR_INVALID_STUDY_STATE) and priority 9
          (ERR_INSUFFICIENT_RETAINER_HOURS) — the state error MUST win.
        test_recipe:
          setup:
            - "Client with retainer_hours_balance == 0 (never topped up); study with 1 control arm and 1 time point, still DRAFT (submit-design never called); reserve would be 16 hours"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Broke Co", contact_email: "broke@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Cereal", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist }
          trigger:
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STUDY_STATE (http 409) — state check (priority 4) precedes fiscal check (priority 9)"
            - "ClientAccount.${client_id}.retainer_hours_balance == 0 (no escrow movement)"
            - "Study.${study_id}.status == DRAFT (unchanged)"

      - name: measurement_range_error_beats_referential_error
        grounds:
          - validations[priority=5]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential: a lab
          result with measured_value 999.0 (outside APC range [0,12]) AND an
          arm_id belonging to a different study violates both priority 5 and
          priority 8 — ERR_MEASUREMENT_OUT_OF_RANGE MUST win over
          ERR_ARM_STUDY_MISMATCH. Distinct pair from state-vs-fiscal.
        test_recipe:
          setup:
            - "Studies A and B both IN_PROGRESS (shared client topped up 200; reserves 16 each); arm_b belongs to study B; tp_a belongs to study A"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Prio Co", contact_email: "prio@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 200 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Milk A", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_a: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_a}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_a: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_a}", day_index: 0 }, as: SensoryScientist, captures: { tp_a: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_a}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_a}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_a}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Milk B", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_b: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_b}", packaging_variant: "MAP", is_control: true }, as: SensoryScientist, captures: { arm_b: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_b}", day_index: 0 }, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_b}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_b}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_b}/activate", payload: {}, as: SensoryScientist }
          trigger:
            - { call: "POST /sensory-lab/lab-test-results", payload: { study_id: "${study_a}", arm_id: "${arm_b}", time_point_id: "${tp_a}", test_type: "APC", measured_value: 999.0 }, as: LabAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_MEASUREMENT_OUT_OF_RANGE (http 422) — business_safety (priority 5) precedes business_referential (priority 8)"
            - "no LabTestResult row is created (GET /sensory-lab/lab-test-results?study_id=${study_a} returns empty list, total_count == 0)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (mean threshold vs unit-count capacity)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: sensory_threshold_inclusive_at_or_below
        grounds:
          - calculations.sensory_criterion_evaluation
          - entities.EvaluationSession.fields.sensory_failed
        distinguishing_aspect: |
          Boundary on the OVERALL mean metric via POST .../lock: a variant-arm
          mean of exactly 6.00 == sensory_fail_threshold 6.0 satisfies the
          INCLUSIVE at-or-below leg; with the control locked at 10.00 and
          significance_delta 2.08, |6.00-10.00| = 4.0 >= 2.0785 so the endpoint
          trips. Metric: attribute mean score.
        test_recipe:
