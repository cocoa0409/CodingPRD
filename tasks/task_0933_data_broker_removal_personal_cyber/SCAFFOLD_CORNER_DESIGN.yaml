      - name: plan_downgrade_below_member_usage_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=47]
          - calculations.account_member_capacity
          - errors[ERR_PLAN_DOWNGRADE_BELOW_USAGE]
        distinguishing_aspect: "The downgrade boundary is INCLUSIVE (occupied_seats <= new max_members): an account holding two seats cannot move to a plan whose max_members is 1, and the failure is ERR_PLAN_DOWNGRADE_BELOW_USAGE rather than any proration error."
        test_recipe:
          setup:
            - "A FAMILY plan (max_members 4) and a SOLO plan (max_members 1)."
            - "An ACTIVE account on FAMILY holding two roster seats: the primary member plus one INVITED member."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
