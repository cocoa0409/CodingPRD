# =============================================================================
# Task 0115: ABA Autism Behavioral Therapy — Scaffold Difficulty Design
# (§1.8 Test Targeting Index — cross-references SCAFFOLD.yaml §1.1–§1.7
#  against the nine Difficulty Rules of §0.5.)
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: authorization_unit_balance_provisional_vs_adjudicated
        grounds:
          - calculations.authorization_unit_balance
          - calculations.authorization_unit_balance.variants.provisional
          - calculations.authorization_unit_balance.variants.adjudicated
          - entities.Authorization.fields.provisional_units_consumed
          - entities.Authorization.fields.adjudicated_units_consumed
          - state_machines.TherapySession.IN_PROGRESS_to_COMPLETED
          - state_machines.InsuranceClaim.ADJUDICATED_to_PAID
        distinguishing_aspect: |
          This dual variant lives on the Authorization entity (unit-hour quota domain).
          The provisional variant aggregates BillingLedgerEntry rows of
          entry_type ∈ {PROVISIONAL_DEBIT, PROVISIONAL_CREDIT} (driven by session
          completion); the adjudicated variant aggregates only
          {ADJUDICATED_DEBIT, ADJUDICATED_CREDIT} (driven by claim PAY). With the same
          underlying sessions but no claim PAID yet, the two values diverge: provisional
          reflects work performed, adjudicated reflects work reimbursed.
        test_recipe:
          setup:
            - "Clinic created; clinic.now_ts = 2025-01-01T00:00:00.000Z"
            - "Therapist(credential=BCBA), Therapist(credential=RBT), Patient created"
            - "DiagnosticEvaluation scheduled, started, completed with recommended_weekly_hours=20"
            - "TreatmentPlan drafted (direct=20, supervision=2, parent_training=1) and activated"
            - "Authorization (cpt_code=97153, approved_units=240, effective_start=2025-01-02, effective_end=2025-07-01) created, approved, clock advanced past start → ACTIVE"
            - "POST /_clock/advance to 2025-01-03T09:00:00.000Z"
            - "5 TherapySession (session_type=DIRECT_RBT, planned 1 hour each = 4 units each) created at non-overlapping hours"
          trigger:
            - "Start and complete all 5 sessions (POST /sessions/{id}/start then /complete with progress_rating=4); each completion advances clock 1 hour"
          assert:
            - "After all 5 completions but before any claim creation: Authorization.provisional_units_consumed == 20"
            - "After all 5 completions but before any claim creation: Authorization.adjudicated_units_consumed == 0"
            - "Computed provisional_balance = 240 - 20 = 220; adjudicated_balance = 240 - 0 = 240; the two diverge by exactly 20"

      - name: patient_clinical_progress_score_provisional_vs_adjudicated
        grounds:
          - calculations.patient_clinical_progress_score
          - calculations.patient_clinical_progress_score.variants.provisional
          - calculations.patient_clinical_progress_score.variants.adjudicated
          - entities.Patient.fields.clinical_progress_score_provisional
          - entities.Patient.fields.clinical_progress_score_adjudicated
          - entities.TherapySession.fields.progress_rating
        distinguishing_aspect: |
          This dual variant lives on the Patient entity (clinical progress domain) —
          structurally different from authorization_unit_balance which lives on
          Authorization (financial quota domain). Provisional averages weighted
          ratings across BOTH DIRECT_RBT and BCBA_SUPERVISION sessions, regardless of
          claim outcome. Adjudicated includes ONLY BCBA_SUPERVISION sessions whose
          containing claim is PAID. With identical session data but zero PAID claims,
          provisional yields a positive average while adjudicated is exactly 0.00.
        test_recipe:
          setup:
            - "Patient with active treatment plan and ACTIVE authorizations for cpt_codes 97153 (RBT) and 97155 (BCBA supervision)"
            - "3 TherapySession of session_type=DIRECT_RBT, planned 1 hour each (4 units each), completed with progress_rating=4"
            - "1 TherapySession of session_type=BCBA_SUPERVISION, planned 1 hour (4 units), completed with progress_rating=2; supervising_therapist_id set to the RBT"
            - "No InsuranceClaim has been created yet"
          trigger:
            - "GET /patients/{patient_id}"
          assert:
            - "Patient.clinical_progress_score_provisional == 3.50  # = (4*4 + 4*4 + 4*4 + 4*2) / (4+4+4+4) = 56/16 = 3.5"
            - "Patient.clinical_progress_score_adjudicated == 0.00  # numerator=0, denominator=max(1,0)=1, result=0.0"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: supervision_ratio_three_input_non_linear_mode_a
        grounds:
          - calculations.supervision_ratio
          - validations[priority=9]
          - validations[priority=10]
          - endpoints["GET /authorizations/{authorization_id}/supervision-ratio"]
        distinguishing_aspect: |
          MODE (a): formula with ≥3 inputs (rbt_minutes, bcba_supervision_minutes,
          trailing window length) and non-linear interaction — a conditional branch on
          the denominator (rbt_minutes == 0 yields ratio := 1.0 instead of division by
          zero) plus a threshold comparison (ratio >= 0.10). Not a tiered-rate formula
          (that would be mode (a)-style on a different axis), not nested rounding (mode
          b), not circular-looking dependency (mode c).
        test_recipe:
          setup:
            - "Patient with ACTIVE 97153 and 97155 authorizations"
            - "5 DIRECT_RBT sessions completed in the trailing 30 days totaling exactly 100 minutes of (actual_end-actual_start)"
            - "1 BCBA_SUPERVISION session completed in the trailing 30 days totaling exactly 10 minutes of (actual_end-actual_start)"
          trigger:
            - "GET /authorizations/{97153_auth_id}/supervision-ratio"
          assert:
            - "response.data.rbt_minutes == 100"
            - "response.data.bcba_supervision_minutes == 10"
            - "response.data.ratio == 0.10  # 10/100 exactly"
            - "response.data.compliant == true  # boundary precision: 0.10 >= 0.10 passes"

      - name: claim_total_submitted_per_line_rounding_then_sum_mode_b
        grounds:
          - calculations.claim_total_submitted
          - calculations.claim_total_submitted.constants.TIERED_RATES
          - calculations.claim_total_submitted.precision
          - state_machines.InsuranceClaim.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters. Two DIRECT_RBT lines of 7
          units and 5 units, applied 15% patient responsibility (default), produce
          per-line raw amounts 19831.35¢ and 14165.25¢. Per-line round_half_up first
          (then sum) yields 19831 + 14165 = 33996¢. Sum-first then round yields
          round_half_up(33996.60¢) = 33997¢. The scaffold pins per-line rounding then
          integer sum, so the only correct answer is 33996¢. This is distinct from
          mode (a) supervision_ratio (no rounding involved there).
        test_recipe:
          setup:
            - "Patient with ACTIVE Authorization (cpt_code=97153, payer_name unmapped so PATIENT_RESPONSIBILITY_PCT_DEFAULT=0.15 applies)"
            - "Two completed TherapySession of session_type=DIRECT_RBT: session A with billed_units=7, session B with billed_units=5 (achieved by planning sessions of 1h45m and 1h15m respectively, completed at exactly those durations)"
            - "Draft InsuranceClaim referencing [session_A_id, session_B_id], TherapySession.id ordering deterministic"
          trigger:
            - "POST /claims/{claim_id}/submit"
          assert:
            - "claim.status == SUBMITTED"
            - "claim.submitted_amount_cents == 33996  # = round_half_up(7*3333*0.85) + round_half_up(5*3333*0.85) = 19831 + 14165"
            - "claim.submitted_amount_cents != 33997  # would be sum-first-then-round; scaffold REJECTS this order"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: insurance_claim_appeal_cycle
        grounds:
          - state_machines.InsuranceClaim
          - state_machines.InsuranceClaim.ADJUDICATED_to_DENIED
          - state_machines.InsuranceClaim.DENIED_to_APPEALED
          - state_machines.InsuranceClaim.APPEALED_to_ADJUDICATED
          - entities.InsuranceClaim.fields.appeal_round
          - validations[priority=21]
        distinguishing_aspect: |
          The InsuranceClaim machine contains a true CYCLE: ADJUDICATED → DENIED →
          APPEALED → ADJUDICATED. The state visits a previously occupied state and the
          loop can be traversed up to appeal_round=2 before ERR_APPEAL_LIMIT_REACHED
          terminates further appeals. A linear A→B→C→D pipeline cannot satisfy this.
        test_recipe:
          setup:
            - "An ADJUDICATED InsuranceClaim with denial_reason=MISSING_PROGRESS_NOTE and appeal_round=0"
          trigger:
            - "POST /claims/{claim_id}/deny  → DENIED, appeal_round still 0"
            - "POST /claims/{claim_id}/appeal → APPEALED, appeal_round=1, denial_reason cleared"
            - "POST /claims/{claim_id}/adjudicate (no denial_reason) → ADJUDICATED"
          assert:
            - "After deny: claim.status == DENIED and claim.appeal_round == 0"
            - "After appeal: claim.status == APPEALED and claim.appeal_round == 1 and claim.denial_reason is NULL"
            - "After adjudicate: claim.status == ADJUDICATED  # cycle has returned to ADJUDICATED at appeal_round=1"

      - name: therapy_session_dispute_cycle
        grounds:
          - state_machines.TherapySession
          - state_machines.TherapySession.COMPLETED_to_DISPUTED
          - state_machines.TherapySession.DISPUTED_to_COMPLETED
          - entities.TherapySession.fields.dispute_reason
        distinguishing_aspect: |
          This non-linear shape lives on TherapySession — a DIFFERENT entity than the
          claim cycle above. Cycle: COMPLETED ↔ DISPUTED. Each traversal of the cycle
          emits paired PROVISIONAL_CREDIT (on enter DISPUTED) and PROVISIONAL_DEBIT (on
          return to COMPLETED), so the cycle is observable in the BillingLedgerEntry
          history. A linear pipeline cannot visit COMPLETED twice.
        test_recipe:
          setup:
            - "A completed TherapySession with billed_units=4 (so PROVISIONAL_DEBIT of 4 already exists)"
            - "Authorization.provisional_units_consumed == 4"
          trigger:
            - "POST /sessions/{session_id}/dispute  with body {dispute_reason: 'review_pending'} → DISPUTED"
            - "POST /sessions/{session_id}/resolve-dispute → COMPLETED"
          assert:
            - "After dispute: TherapySession.status == DISPUTED and Authorization.provisional_units_consumed == 0"
            - "After resolve-dispute: TherapySession.status == COMPLETED and Authorization.provisional_units_consumed == 4"
            - "BillingLedgerEntry count for this authorization == 3 (initial debit + credit + debit)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: claim_pay_depth_3_cascade
        grounds:
          - state_machines.InsuranceClaim.ADJUDICATED_to_PAID
          - entities.BillingLedgerEntry
          - calculations.authorization_unit_balance
          - state_machines.Authorization
        distinguishing_aspect: |
          Trigger: POST /claims/{id}/pay (Claim ADJUDICATED→PAID). Three sequential
          causal hops, each caused by the previous (NOT a fan-out from the same
          action): (hop 1) status change causes BillingLedgerEntry append of
          ADJUDICATED_DEBIT; (hop 2) ledger row's existence causes
          Authorization.adjudicated_units_consumed to recompute to a new value; (hop 3)
          the new value crosses approved_units, which causes Authorization status
          ACTIVE→EXHAUSTED. Each link is caused by the previous link's state change,
          not directly by the original PAY action.
        test_recipe:
          setup:
            - "Authorization with approved_units=20 and adjudicated_units_consumed=16"
            - "ADJUDICATED InsuranceClaim with no denial_reason whose session_ids total exactly 4 billed_units, all under that Authorization"
            - "Patient supervision_ratio compliant (>= 0.10)"
          trigger:
            - "POST /claims/{claim_id}/pay"
          assert:
            - "HOP 1: a BillingLedgerEntry row exists with entry_type=ADJUDICATED_DEBIT, units_delta=-4, reason_code=CLAIM_PAID, claim_id matching"
            - "HOP 2: Authorization.adjudicated_units_consumed == 20 (was 16, now += 4 from recompute)"
            - "HOP 3: Authorization.status == EXHAUSTED (was ACTIVE; auto-transitioned because adjudicated_balance == 0)"

      - name: session_dispute_depth_2_cascade
        grounds:
          - state_machines.TherapySession.COMPLETED_to_DISPUTED
          - entities.BillingLedgerEntry
          - calculations.authorization_unit_balance.variants.provisional
        distinguishing_aspect: |
          Trigger is DIFFERENT from the claim-pay cascade above — it originates on
          POST /sessions/{id}/dispute (Session COMPLETED→DISPUTED), not on a claim
          transition, so the scaffold exercises a second propagation pattern. Two
          sequential causal hops: (hop 1) status change causes BillingLedgerEntry
          PROVISIONAL_CREDIT append; (hop 2) ledger row's existence causes
          Authorization.provisional_units_consumed to recompute. Each hop is caused by
          the previous, not by the original dispute action.
        test_recipe:
          setup:
            - "A completed TherapySession with billed_units=4 (PROVISIONAL_DEBIT of 4 already on ledger)"
            - "Authorization.provisional_units_consumed == 4"
          trigger:
            - "POST /sessions/{session_id}/dispute with {dispute_reason: 'duplicate_note'}"
          assert:
            - "HOP 1: a BillingLedgerEntry row exists with entry_type=PROVISIONAL_CREDIT, units_delta=+4, reason_code=SESSION_DISPUTED, session_id matching"
            - "HOP 2: Authorization.provisional_units_consumed == 0 (recomputed from -(-4) + -(+4) = 0)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_referential_on_claim_submit
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - state_machines.InsuranceClaim.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Pair: `state` (p8, ERR_SESSION_NOT_COMPLETED) vs `business_referential` (p11,
          ERR_SESSION_AUTH_MISMATCH). Both fail simultaneously on the same
          POST /claims/{id}/submit; the state check fires first because session-status
          check (p8) precedes the auth-mismatch referential check (p11).
        test_recipe:
          setup:
            - "Authorization A (97153) ACTIVE; Authorization B (97153) ACTIVE; both under same patient"
            - "TherapySession S1 created under Authorization A, currently still in status SCHEDULED (never completed) — VIOLATES p8"
            - "TherapySession S2 created under Authorization B and completed (so its authorization_id != claim.authorization_id) — VIOLATES p11"
            - "Draft InsuranceClaim referencing claim.authorization_id=A and session_ids=[S1.id, S2.id]"
          trigger:
            - "POST /claims/{claim_id}/submit"
          assert:
            - "response status == 409"
            - "response.data.error_id == 'ERR_SESSION_NOT_COMPLETED'  # state (p8) wins over referential (p11)"
            - "response.data.error_id != 'ERR_SESSION_AUTH_MISMATCH'  # this would only fire if state check passed"

      - name: referential_vs_fiscal_on_session_create
        grounds:
          - validations[priority=13]
          - validations[priority=17]
          - endpoints["POST /patients/{patient_id}/sessions"]
        distinguishing_aspect: |
          Pair: `business_referential` (p13, ERR_NO_RBT_TO_SUPERVISE) vs
          `business_fiscal` (p17, ERR_AUTH_UNITS_EXHAUSTED). DIFFERENT pair than
          above (state-vs-referential). Both fail on the same POST /sessions create
          for a BCBA_SUPERVISION session; the referential check (p13) fires first
          because the eligibility-of-supervisee check precedes the
          quota/capacity check (p17).
        test_recipe:
          setup:
            - "Authorization (cpt_code=97155) ACTIVE with approved_units=4, provisional_units_consumed=4 (so 0 units remaining) — VIOLATES p17"
            - "supervising_therapist_id refers to an RBT who has NO TherapySession in COMPLETED|BILLED with this patient in the trailing 30 days — VIOLATES p13"
          trigger:
            - "POST /patients/{patient_id}/sessions with session_type=BCBA_SUPERVISION, supervising_therapist_id=<that RBT>, planned 1-hour session"
          assert:
            - "response status == 422"
            - "response.data.error_id == 'ERR_NO_RBT_TO_SUPERVISE'  # referential (p13) wins over fiscal (p17)"
            - "response.data.error_id != 'ERR_AUTH_UNITS_EXHAUSTED'  # this would only fire if referential check passed"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: supervision_ratio_at_exact_0_10
        grounds:
          - calculations.supervision_ratio.constants.SUPERVISION_RATIO_MIN
          - validations[priority=9]
          - endpoints["POST /claims/{claim_id}/pay"]
          - endpoints["GET /authorizations/{authorization_id}/supervision-ratio"]
        distinguishing_aspect: |
          Numeric threshold boundary. The comparator is `ratio >= 0.10`, so:
          ratio == 0.10 must PASS (compliant=true, claim PAY succeeds);
          ratio == 0.09999 must FAIL (ERR_SUPERVISION_RATIO_BREACH). Endpoint:
          POST /claims/{id}/pay. Distinct from the empty-set boundary below in
          metric type (continuous ratio vs collection cardinality) and endpoint.
        test_recipe:
          setup:
            - "Patient with ACTIVE 97153 and 97155 authorizations"
            - "DIRECT_RBT sessions totaling exactly 100 minutes completed in trailing 30 days"
            - "BCBA_SUPERVISION sessions totaling exactly 10 minutes completed in trailing 30 days (ratio = 0.10 exactly)"
            - "ADJUDICATED InsuranceClaim referencing one of the RBT sessions, with no denial_reason"
          trigger:
            - "POST /claims/{claim_id}/pay"
          assert:
            - "response status == 200"
            - "claim.status == PAID  # ratio 0.10 >= 0.10 passes the boundary"
            - "Repeating the same scenario but with BCBA_SUPERVISION at 9 minutes (ratio 0.09) yields status 422 and error_id == 'ERR_SUPERVISION_RATIO_BREACH'"

      - name: empty_claim_zero_units_boundary
        grounds:
          - validations[priority=18]
          - endpoints["POST /claims/{claim_id}/submit"]
          - state_machines.InsuranceClaim.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Empty-collection / zero-count boundary. METRIC differs from
          supervision_ratio: this is sum(session.billed_units) over session_ids, a
          collection-cardinality / aggregate-zero edge, NOT a numeric ratio.
          ENDPOINT also differs: POST /claims/{id}/submit instead of
          POST /claims/{id}/pay.
        test_recipe:
          setup:
            - "Authorization ACTIVE"
            - "Draft InsuranceClaim created with session_ids=[] (empty list)"
          trigger:
            - "POST /claims/{claim_id}/submit"
          assert:
            - "response status == 422"
            - "response.data.error_id == 'ERR_EMPTY_CLAIM'  # boundary: sum == 0 fails"
            - "Repeating with one session of billed_units=1 yields status 200 and claim.status == SUBMITTED (boundary: sum > 0 passes)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: session_start_requires_authorization_active
        grounds:
          - state_machines.TherapySession.SCHEDULED_to_IN_PROGRESS
          - state_machines.Authorization
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair: TherapySession ↔ Authorization. TherapySession's
          SCHEDULED→IN_PROGRESS transition is blocked unless the referenced
          Authorization is in status ACTIVE (not APPROVED, not EXPIRED, not
          EXHAUSTED). The validity of the session transition depends on a separate
          entity's state.
        test_recipe:
          setup:
            - "Authorization in status APPROVED (clock has NOT yet crossed effective_start, so it has not auto-transitioned to ACTIVE)"
            - "TherapySession SCHEDULED under that authorization (planned_start in the future)"
          trigger:
            - "Advance clock to session.planned_start but NOT to authorization.effective_start"
            - "POST /sessions/{session_id}/start"
          assert:
            - "response status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'  # session start blocked by authorization not yet ACTIVE"
            - "After POST /_clock/advance crossing authorization.effective_start so authorization auto-transitions to ACTIVE, retrying POST /sessions/{id}/start succeeds (status 200, session.status == IN_PROGRESS)"

      - name: plan_activate_requires_evaluation_completed
        grounds:
          - state_machines.TreatmentPlan.DRAFT_to_ACTIVE
          - state_machines.DiagnosticEvaluation
          - entities.TreatmentPlan.fields.source_evaluation_id
        distinguishing_aspect: |
          Entity pair: TreatmentPlan ↔ DiagnosticEvaluation — DIFFERENT pair than
          session-authorization above. The plan's DRAFT→ACTIVE precondition includes
          source_evaluation in status COMPLETED; if the evaluation is still
          IN_PROGRESS (or got VOIDed), the plan cannot activate.
        test_recipe:
          setup:
            - "DiagnosticEvaluation E started but not yet completed (status IN_PROGRESS)"
            - "TreatmentPlan P drafted with source_evaluation_id = E.id"
          trigger:
            - "POST /treatment-plans/{P.id}/activate"
          assert:
            - "response status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'  # plan activate blocked by evaluation not COMPLETED"
            - "After POST /evaluations/{E.id}/complete with valid diagnosis fields → evaluation status COMPLETED, retrying POST /treatment-plans/{P.id}/activate succeeds (status 200, plan.status == ACTIVE)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: therapist_half_open_interval_overlap
        grounds:
          - validations[priority=14]
          - entities.TherapySession.fields.therapist_id
          - endpoints["POST /patients/{patient_id}/sessions"]
        distinguishing_aspect: |
          Resource: Therapist (therapist_id). Interval semantic: HALF-OPEN
          `[planned_start, planned_end)`. Adjacent intervals that touch at the
          boundary (e.g., A ends 10:00, B starts 10:00) are PERMITTED.
        test_recipe:
          setup:
            - "Therapist T (any credential); patient with ACTIVE authorization"
            - "Existing TherapySession on T: planned_start=2025-01-03T09:00:00Z, planned_end=2025-01-03T10:00:00Z"
          trigger:
            - "POST /patients/{patient_id}/sessions with therapist_id=T, planned_start=2025-01-03T10:00:00Z, planned_end=2025-01-03T11:00:00Z  # touching boundary"
            - "POST /patients/{patient_id}/sessions with therapist_id=T, planned_start=2025-01-03T09:30:00Z, planned_end=2025-01-03T10:30:00Z  # overlap"
          assert:
            - "First POST: status 201, session created (boundary touch permitted under half-open semantic)"
            - "Second POST: status 409, error_id == 'ERR_SESSION_THERAPIST_OVERLAP' (interval [09:30,10:30) overlaps [09:00,10:00))"

      - name: parent_training_closed_buffered_overlap
        grounds:
          - validations[priority=15]
          - entities.TherapySession.fields.patient_id
          - entities.TherapySession.fields.session_type
          - endpoints["POST /patients/{patient_id}/sessions"]
        distinguishing_aspect: |
          Resource: Patient (patient_id) — DIFFERENT resource than the therapist
          overlap above. Interval semantic: CLOSED-CLOSED with a 15-minute buffer on
          each side — TOUCHING a neighbor's interval (or coming within 15 minutes of
          it) IS a conflict. This is geometrically incompatible with the half-open
          semantic — boundary touch is REJECTED here but permitted above.
        test_recipe:
          setup:
            - "Patient P with ACTIVE 97153 and 97156 authorizations and two different therapists T1 (RBT) and T2 (BCBA)"
            - "Existing TherapySession on P with therapist_id=T1, session_type=DIRECT_RBT, planned_start=2025-01-03T09:00:00Z, planned_end=2025-01-03T10:00:00Z"
          trigger:
            - "POST /patients/{P.id}/sessions with therapist_id=T2, session_type=PARENT_TRAINING, planned_start=2025-01-03T10:00:00Z, planned_end=2025-01-03T10:45:00Z  # touching boundary"
            - "POST /patients/{P.id}/sessions with therapist_id=T2, session_type=PARENT_TRAINING, planned_start=2025-01-03T10:16:00Z, planned_end=2025-01-03T11:00:00Z  # 16 minutes after boundary"
          assert:
            - "First POST: status 409, error_id == 'ERR_PARENT_TRAINING_BUFFER' (touching at 10:00:00Z violates the 15-minute buffer on each side)"
            - "Second POST: status 201, session created (16 minutes ≥ 15-minute buffer satisfied)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: session_complete_dispute_zero_net_provisional_units
        grounds:
          - state_machines.TherapySession.IN_PROGRESS_to_COMPLETED
          - state_machines.TherapySession.COMPLETED_to_DISPUTED
          - calculations.authorization_unit_balance.variants.provisional
          - entities.BillingLedgerEntry
        distinguishing_aspect: |
          Conserved quantity: `Authorization.provisional_units_consumed`, pinned as
          `-sum(BillingLedgerEntry.units_delta for entries with entry_type ∈
          {PROVISIONAL_DEBIT, PROVISIONAL_CREDIT} where authorization_id == auth.id)`.
          Forward action (complete) appends PROVISIONAL_DEBIT of `-N`; compensating
          action (dispute) appends PROVISIONAL_CREDIT of `+N`. The pair must leave
          the conserved quantity at its pre-action value (typically 0 if starting from
          empty).
        test_recipe:
          setup:
            - "Authorization with approved_units=20 and zero ledger entries; Authorization.provisional_units_consumed == 0"
            - "TherapySession SCHEDULED, planned 1 hour (4 units)"
          trigger:
            - "POST /sessions/{id}/start; POST /sessions/{id}/complete with progress_rating=4  # FORWARD"
            - "POST /sessions/{id}/dispute with {dispute_reason: 'invariant_test'}  # COMPENSATE"
          assert:
            - "Immediately after complete: Authorization.provisional_units_consumed == 4 (deviation from invariant during transient)"
            - "After dispute: Authorization.provisional_units_consumed == 0 (invariant restored — equal to pre-action value)"
            - "BillingLedgerEntry rows for this authorization == 2 (one PROVISIONAL_DEBIT, one PROVISIONAL_CREDIT, units_delta sum exactly 0)"

      - name: claim_submit_deny_zero_net_billed_session_count
        grounds:
          - state_machines.InsuranceClaim.DRAFT_to_SUBMITTED
          - state_machines.InsuranceClaim.ADJUDICATED_to_DENIED
          - state_machines.TherapySession.COMPLETED_to_BILLED
          - state_machines.TherapySession.BILLED_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity: count of TherapySession rows in status BILLED for a
          given Authorization — DIFFERENT type of conserved quantity than
          provisional_units_consumed above (this is a cardinality of rows in a
          specific state, not a signed numeric aggregate). Forward action (claim
          submit) cascades sessions COMPLETED→BILLED; compensating action (claim
          deny after adjudication) cascades BILLED→COMPLETED. The pair must leave
          count_of_BILLED_sessions equal to its pre-action value.
        test_recipe:
          setup:
            - "Authorization with two COMPLETED TherapySession rows S1 and S2; count_of_BILLED_sessions == 0"
            - "Draft InsuranceClaim referencing [S1.id, S2.id] with no denial_reason yet"
          trigger:
            - "POST /claims/{id}/submit  # FORWARD: cascades S1 and S2 to BILLED"
            - "POST /claims/{id}/adjudicate with denial_reason=DUPLICATE_LINE"
            - "POST /claims/{id}/deny  # COMPENSATE: cascades S1 and S2 back to COMPLETED"
          assert:
            - "Immediately after submit: S1.status == BILLED AND S2.status == BILLED AND count_of_BILLED_sessions for this authorization == 2 (transient deviation)"
            - "After deny: S1.status == COMPLETED AND S2.status == COMPLETED AND count_of_BILLED_sessions for this authorization == 0 (invariant restored)"
