            - call: "GET /quota-cells"
              payload: { market_id: "${run35_market}" }
              as: MethodologyStatistician
              captures: { c35_id: "$.data[0].id" }
            - call: "POST /clients"
              payload: { name: "Lakeshore Cable", tier: "BASIC", contract_market_ids: ["${run35_market}"] }
              as: ClientServiceRep
              captures: { cl35_id: "$.data.id" }
            - call: "POST /clients/${cl35_id}/scheduled-deliverables"
              payload: { processing_run_id: "${run35_id}", requested_cell_count: 0 }
              as: ClientServiceRep
              captures: { d35_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-30T00:00:00Z" }
              as: MethodologyStatistician
            - call: "GET /markets/${run35_market}"
              payload: {}
              as: MethodologyStatistician
              captures: { m35_v: "$.data.version" }
            - call: "POST /universe-estimates"
              payload: { market_id: "${run35_market}", vintage_label: "2026Q4", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", cell_populations: [{ quota_cell_id: "${c35_id}", population_households: 120000, population_persons: 300000 }], expected_market_version: "${m35_v}" }
              as: MethodologyStatistician
              captures: { ue35b_id: "$.data.id" }
          trigger:
            - call: "POST /universe-estimates/${ue35b_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /processing-runs/${run35_id}"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /client-deliverables/${d35_id}"
              payload: {}
              as: ClientServiceRep
            - call: "POST /client-deliverables/${d35_id}/release"
              payload: {}
              as: ClientServiceRep
              captures: { e35: "$.data.error_id" }
            - call: "POST /processing-runs/${run35_id}/repin"
              payload: { universe_estimate_id: "${ue35b_id}" }
              as: MethodologyStatistician
            - call: "GET /tuning-intervals/${ti35_id}"
              payload: {}
              as: MethodologyStatistician
          assert:
            - "Trigger call 1: HTTP 200 with data.status == PUBLISHED and the 2026Q3 vintage now SUPERSEDED with superseded_at == 2026-08-30T00:00:00Z"
            - "Trigger call 2: data.state == PENDING_REPIN with data.repin_required_reason == UNIVERSE_SUPERSEDED - the EDITED run is non-terminal so it is pulled back"
            - "Trigger call 3: data.state == HELD, data.hold_reason == UPSTREAM_RUN_REPIN, data.held_from_state == SCHEDULED and Client.${cl35_id}.held_deliverable_count == 1"
            - "Trigger call 4: HTTP 409 with ${e35} == ERR_RUN_NOT_PUBLISHED - a hold whose run is PENDING_REPIN cannot be released, so the cascade cannot be undone from the commercial side"
            - "Trigger call 5: HTTP 200 with data.state == OPEN, data.repin_required_reason == null, data.universe_estimate_id == ${ue35b_id}, data.edit_rule_set_id unchanged (the omitted pin is left alone), data.contributing_household_count == 0, data.invalidated_interval_count == 0, data.ascribed_interval_count == 0, data.total_weight_mass == 0 and data.projected_average_audience == null"
            - "Trigger call 6: data.state == RAW, data.processing_run_id == null and data.usable_minutes == 0, whereas before the repin ${ti35_usable} was 350 - the claim is fully reversed"
            - "GET /client-deliverables/${d35_id} after trigger call 5 still reports HELD: repin does not release deliverables"

