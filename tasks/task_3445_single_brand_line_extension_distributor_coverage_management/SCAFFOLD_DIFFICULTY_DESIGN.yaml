              payload: { legal_name: "Gamma Co-Packers", site_country: "US", capabilities: ["LIQUID_FILL"] }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { mfr3_id: $.data.id }
            - call: "POST /brand-ops/contract-manufacturers/${mfr3_id}/qualify"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - call: "GET /brand-ops/contract-manufacturers/${mfr3_id}"
              payload: {}
              as: TradeSecretOfficer
              captures: { disc_before: $.data.disclosed_component_count }
          trigger:
            - call: "POST /brand-ops/confidentiality-grants"
              payload: { manufacturer_id: "${mfr3_id}", formulation_id: "${form_id}", component_scope: ["C1"], expires_on: "2027-12-31T00:00:00Z", grant_reason: "SECOND_SOURCE" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { g3_id: $.data.id }
            - call: "POST /brand-ops/confidentiality-grants/${g3_id}/grant"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - call: "POST /brand-ops/confidentiality-grants/${g3_id}/activate"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - call: "GET /brand-ops/contract-manufacturers/${mfr3_id}"
              payload: {}
              as: TradeSecretOfficer
              captures: { disc_mid: $.data.disclosed_component_count }
            - call: "POST /brand-ops/confidentiality-grants/${g3_id}/revoke"
              payload: { for_cause: false }
              as: ComplianceAuditor
