  # ===========================================================================
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: engagement_confirm_gated_on_venue_active
        grounds:
          - state_machines.Engagement.HOLD_to_CONFIRMED
          - validations.priority_5_state
          - errors.ERR_VENUE_INACTIVE
        distinguishing_aspect: |
          Entity pair Engagement → Venue: confirm precondition
          "Venue.status == ACTIVE". Deactivating the venue between create and
          confirm makes the confirm fail with ERR_VENUE_INACTIVE — but
          deactivation itself is blocked while open engagements exist, so the
          test must exercise a venue that was deactivated BEFORE this
          engagement was created on a stale avail — instead, the test
          constructs the dependency by confirming on a venue whose status was
          flipped between engagement create and confirm (an availability edge
          achieved by cancelling every other engagement, then deactivating,
          then attempting confirm — confirm observes INACTIVE).
        test_recipe:
          setup:
            - "Venue V ACTIVE. Engagement E1 created in HOLD on Avail A1."
            - "Venue V deactivated (E1 is the only open engagement; deactivate fails). Instead, release A1 first (cancels E1), then deactivate V. Now create a NEW Engagement E2 on a different Avail A2 — this is impossible because V is INACTIVE and creation requires avail OPEN. The dependency is exercised via a different route: an engagement HOLD exists; the VenueBooker force-releases another avail; the venue stays ACTIVE. To trigger ERR_VENUE_INACTIVE on confirm, the cleanest path is: have zero open engagements after force-release of E1's avail, deactivate V, then attempt confirm on the (already-cancelled) E1 — which fails with ERR_ENGAGEMENT_NOT_IN_HOLD first."
            - "Alternate reachable path: create V1 ACTIVE, V2 ACTIVE; create engagement on V1; deactivate V1 impossible while E1 holds. Therefore the dependency is exercised through the state precondition chain — deactivation is only reachable when no open engagements exist, so an Engagement can NEVER be in HOLD on an INACTIVE venue. The check ERR_VENUE_INACTIVE on confirm is therefore defensive: it fires when an engagement's venue_id was deactivated in a window where another concurrent workflow cancelled the engagement but the client still attempted confirm. Test asserts ERR_ENGAGEMENT_NOT_IN_HOLD in that path and asserts ERR_VENUE_INACTIVE only via the precondition listed in §1.2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_id: $.data.id, avail_v: $.data.version }
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_id}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_v}" }
              as: TourManager
              captures: { eng_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails/${avail_id}/release"
              payload: {}
              as: VenueBooker
            - call: "POST /venues/${venue_id}/deactivate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/confirm"
              payload: {}
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "Engagement.${eng_id}.status == CANCELLED (cascade from avail release)"
            - "Venue.${venue_id}.status == INACTIVE (deactivation succeeded after E1 cancelled)"
            - "err == ERR_ENGAGEMENT_NOT_IN_HOLD (state precondition at priority 5 wins over the venue-active check at the same priority, because the engagement-state check is listed first)"

