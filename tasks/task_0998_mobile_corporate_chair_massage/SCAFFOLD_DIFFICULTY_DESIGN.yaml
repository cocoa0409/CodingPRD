            - { call: "GET /chair-massage/bookings/${bk_id}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { bk_v: "$.data.version" } }
            - { call: "POST /chair-massage/bookings/${bk_id}/confirm", payload: { expected_booking_version: "${bk_v}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/_clock/set_current_utc", payload: { to_iso8601: "2026-06-09T22:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /chair-massage/bookings/${bk_id}/cancel", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { fee_cents: "$.data.cancellation_fee_cents" } }
          assert:
            - "Booking.${bk_id}.status == CANCELLED"
            - "Booking.${bk_id}.cancellation_fee_cents == 12000"
            - "fee == floor(24000 * 0.50) because H = 12 < 24"

      - name: payout_earnings_per_line_rounding_mode_b
        grounds:
          - calculations.payout_earnings
          - entities.PayoutLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where ORDER matters. The scaffold pins
          per-line rounding THEN sum; a sum-then-round implementation would
          produce a different cents value for the same inputs. Distinct from
          the cancellation_fee instance, which is mode (a) tiered thresholds.
        test_recipe:
          setup:
            - "Region R0 active"
            - "CorporateAccount ACME"
            - "Therapist T1 with per_hour_rate_cents = 5001 (chosen so 15 * 5001/60 = 1250.125 → per-line round_half_up = 1250; sum-then-round of 45*5001/60 = 3750.375 → 3750 would also equal 3750; use 3 claims)"
            - "Better discriminator: 7 claims at slot_minutes=15, rate 5001 → per-line round(15*5001/60) = round(1250.125) = 1250 each → sum = 8750"
            - "Sum-then-round alternative: round(7 * 1250.125) = round(8750.875) = 8751 → differs by 1 cent"
            - "Booking window_duration=120, chair_count=1, slot_minutes=15 (capacity 8); 7 claims completed"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "ACME", billing_email: "ap@acme.test", region_id: "${region_id}", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { acct_id: "$.data.id" } }
