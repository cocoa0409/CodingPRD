          assert:
            - "after the supersede: TransferOrder.${to_first_id}.status == CANCELLED with reserved_unit_count == 0 and TransferOrder.${to_second_id}.status == REQUESTED with reserved_unit_count == 1"
            - "after the supersede the ledger balances: AmbulanceMOU.${mou_id}.units_committed == 2, units_reserved == 1, units_available == 1, saturation_state == AVAILABLE"
            - "after the supersede Encounter.${enc_id}.clinical_state == TRANSFER_PENDING and TransferOrder.${to_second_id}.round_index == 1"
            - "after the decline the ledger balances again: AmbulanceMOU.${mou_id}.units_committed == 2, units_reserved == 0, units_available == 2, saturation_state == AVAILABLE"
            - "after the decline Facility.${fac_id}.ambulance_units_reserved_total == 0 and transfer_capacity_state == AVAILABLE"
            - "after the decline Encounter.${enc_id}.clinical_state == MSE_COMPLETE (no observation bed was held) and declined_transfer_count == 1"
            - "decline_reason CAPACITY appends no defect: Facility.${fac_id}.open_compliance_defect_count == 0 and compliance_posture == OPEN"
      - name: observation_admission_and_discharge_conserve_the_licensed_bed_count
        grounds:
          - calculations.observation_bed_ledger
          - state_machines.Encounter.OBSERVATION_to_DISCHARGED
          - validations[priority=28]
          - entities.Facility.fields.observation_beds_occupied
        distinguishing_aspect: |
          A third conserved quantity: OBSERVATION BEDS, where observation_beds_occupied must always
          equal the count of encounters holding a bed and must never exceed observation_bed_count.
          Two admissions saturate the two licensed beds, a third is refused, and a discharge is the
          compensating release that frees exactly one bed - after which the previously refused
          admission succeeds and the count returns to 2 with a different set of holders.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with observation_bed_count 2 and compliance_posture OPEN"
            - "Three encounters, each ACKNOWLEDGED and screened STABLE, all sitting in MSE_COMPLETE"
            - "Encounters A and B are already admitted to observation, so observation_beds_occupied is 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities"
              payload: { name: "Cedar Freestanding ED", state_code: "TX", license_category: "INDEPENDENT_FREESTANDING_ED", license_status: "ACTIVE", observation_bed_count: 2, imaging_scope: ["XRAY", "CT"], lab_scope: ["CBC", "TROPONIN"], pharmacy_scope_tier: "EMERGENCY_ONLY", max_concurrent_physicians: 2 }
