          assert:
            - "before the trigger: CarHireMovement.${mv_id} == (chargeable_hours 92.00, chargeable_days 4, time_component_cents 10900, mileage_component_cents 564, gross_hire_cents 11464, reclaim_credit_cents 2843, net_hire_cents 8621) and SettlementCycle.${cycle_id} == (status SETTLED, pre_fee_net_cents 8621, clearinghouse_fee_cents 43, net_settlement_cents 8578)"
            - "L1: InterchangeEvent.${reject_event_id}.status == VOID and CorrectionRequest.${corr_id}.status == APPLIED"
            - "L2: CarHireMovement.${mv_id}.bad_order_from == null and CarHireMovement.${mv_id}.bad_order_to == null"
