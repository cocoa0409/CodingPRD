              payload: { full_name: "Finn Two", email: "f2@x.com" }
              as: IntakeOfficer
              captures: { cmp_f2: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_f2}", employer_id: "${emp_cc}", basis_codes: ["RACE"], incident_date: "2026-06-01", harm_description: "fired", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_cc: $.data.id }
            - call: "POST /eeoc/charges/${chg_cc}/mediation-cases"
              as: IntakeOfficer
              captures: { med_cc: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_cc}/respond"
              payload: { response: "ACCEPTED" }
              as: ChargingParty
              as_user_id: "${cmp_f2}"
            - call: "POST /eeoc/mediation-cases/${med_cc}/respond"
              payload: { response: "ACCEPTED" }
              as: RespondentRep
              as_user_id: "${emp_cc}"
            - call: "POST /eeoc/mediation-cases/${med_cc}/sessions"
              payload: { scheduled_start: "2026-10-01T10:00:00Z", scheduled_end: "2026-10-01T11:00:00Z" }
              as: Mediator
              as_user_id: "med-012"
              captures: { ses_cc: $.data.id }
          trigger:
            - call: "POST /eeoc/mediation-cases/${med_cc}/conclude"
              payload: { outcome: "SETTLED", settlement_amount_cents: 900000 }
              as: Mediator
              as_user_id: "med-012"
              captures: { med_cc_status: $.data.status }
            - call: "GET /eeoc/mediation-cases/${med_cc}/sessions"
              as: Mediator
              captures: { ses_cc_status: "$.data[0].status" }
            - call: "GET /eeoc/charges/${chg_cc}"
              as: Director
              captures: { chg_cc_status: $.data.case_status, chg_cc_amt: $.data.settled_amount_cents }
          assert:
            - "mediation SETTLED; the SCHEDULED session reads CANCELLED (not HELD — the clock never passed its start)"
            - "charge CLOSED_SETTLED with settled_amount_cents == 900000 and settled_via == MEDIATION"
      - name: response_envelope_shape_on_success_and_error
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "the fixed envelope wraps both paths: success carries meta.api_request_id + response_type object; errors carry response_type error with data.error_id + data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Finn Three", email: "f3@x.com" }
              as: IntakeOfficer
              captures: { cmp_f3: $.data.id }
            - call: "GET /eeoc/charges/00000000-0000-4000-8000-000000000000"
              as: Director
              captures: { err_env: $.data.error_id }
          assert:
            - "success response: meta.api_request_id non-empty string, meta.api_request_timestamp present, response_type == object, data holds the Complainant"
            - "error response: response_type == error, data.error_id == ERR_CHARGE_NOT_FOUND, data.message non-empty"
      - name: vacate_after_window_rejected
        claim_type: conditional_action
        grounds: ["endpoints: POST /eeoc/charges/{id}/vacate-settlement", "errors[ERR_VACATE_WINDOW_EXPIRED]"]
        distinguishing_aspect: "the vacate window is settled_at + VACATE_WINDOW_DAYS 10 inclusive: at 2026-09-11 the vacate still succeeds... — pinned here at the failure edge: at 2026-09-12 (11 days after a 2026-09-01 settlement) it fails ERR_VACATE_WINDOW_EXPIRED."
        test_recipe:
          setup: ["charge CLOSED_SETTLED via mediation at the 2026-09-01 default clock (settled_at == 2026-09-01)"]
