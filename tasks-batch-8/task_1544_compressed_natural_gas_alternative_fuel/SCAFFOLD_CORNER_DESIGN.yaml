  - section: validations
    instances:
      - name: request_missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before role or existence checks."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /cng/stations", payload: {}, as: NetworkOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER with HTTP 400 (headers stripped by the test client)"

      - name: existence_precedes_state_on_authorize
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]", "errors[ERR_DISPENSER_NOT_FOUND]"]
        distinguishing_aspect: "Authorize with a non-existent dispenser_id against a SUSPENDED account returns ERR_DISPENSER_NOT_FOUND (existence p4), not ERR_ACCOUNT_NOT_ACTIVE (state p6)."
        test_recipe:
          setup: ["ACTIVE station; SUSPENDED account with card"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Ord", station_code: "ST-ORD", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Ord Co", billing_email: "ap@ord.example", credit_limit_cents: 100000 }, as: NetworkOperator, captures: { acct_id: $.data.id, av1: $.data.version } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-OR01", vehicle_plate: "1LLL012", daily_gge_limit: 100.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "POST /cng/fleet-accounts/${acct_id}/suspend", payload: {}, as: NetworkOperator }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: NetworkOperator, captures: { av2: $.data.version } }
          trigger:
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "00000000-0000-4000-8000-0000000000aa", client_ref: "CR-OR1", estimated_gge: 5.0, expected_fleet_account_version: "${av2}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DISPENSER_NOT_FOUND with HTTP 404 (existence outranks the account state failure)"

      - name: driver_cannot_use_anothers_card
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_CARD_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "FleetDriver X-User-ID (card A) authorizing with fleet_card_id of card B is rejected with ERR_CARD_OWNERSHIP_MISMATCH (403)."
        test_recipe:
          setup: ["Two accounts A and B each with one card; ACTIVE station with policy"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Own", station_code: "ST-OWN", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
