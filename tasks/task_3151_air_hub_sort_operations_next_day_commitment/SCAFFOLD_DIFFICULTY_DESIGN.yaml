              captures: { move_id: $.data.id }
            - call: "POST /airhub/buildups"
              payload: { hub_id: "${hub_id}", load_move_id: "${move_id}", destination_gateway_code: "LAX", container_limit_grams: 100000, hazardous_cap_grams: 0, requires_container: true }
              as: LoadPlanner
              captures: { bd_id: $.data.id }
            - call: "POST /airhub/moves/${move_id}/plan-load"
              payload: {}
              as: LoadPlanner
            - &k_pkg_q1
              call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-Q-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 100000, dimension_weight_grams: 100000 }
              as: SortOperator
              captures: { pkg_q1: $.data.id }
            - &k_pkg_q2
              call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-Q-0002", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 100100, dimension_weight_grams: 100100 }
              as: SortOperator
              captures: { pkg_q2: $.data.id }
            - &k_pkg_q3
