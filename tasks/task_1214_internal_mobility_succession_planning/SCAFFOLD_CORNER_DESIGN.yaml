          trigger:
            - { call: "POST /talent/vacancies/${vac}/fill-from-slate", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { by: $.data.filled_by_employee_id } }
          assert:
            - "Vacancy.${vac}.filled_by_employee_id == ${sa} (the SUSPENDED READY_NOW entry at position 1 is excluded by the status eligibility filter)"

      - name: selector_tie_break_by_slate_position
        claim_type: selector_policy
        grounds: [calculations.slate_fill_selection]
        distinguishing_aspect: "Two ACTIVE READY_NOW entries with identical readiness_score (both 40.00, STRONG, no plan): the ranking tie is broken by slate_position ASC — position 1 beats position 2."
        test_recipe:
          setup: ["vacancy; slate: S133A ACTIVE READY_NOW position 2; S133B ACTIVE READY_NOW position 1; both STRONG with no plan (score 40.00 each)"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC133", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC133", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S133A", full_name: "Sue A", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { sa: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S133B", full_name: "Sue B", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { sb: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 133", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${sa}", readiness_rating: "READY_NOW", slate_position: 2, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { ea: $.data.id } }
            - { call: "PATCH /talent/successors/${ea}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v3: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${sb}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v3}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { eb: $.data.id } }
            - { call: "PATCH /talent/successors/${eb}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
          trigger:
            - { call: "POST /talent/vacancies/${vac}/fill-from-slate", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { by: $.data.filled_by_employee_id } }
          assert:
            - "Vacancy.${vac}.filled_by_employee_id == ${sb} (position 1 wins the score tie; created_at and id never consulted)"

      - name: selector_empty_pool_returns_no_eligible_successor
        claim_type: selector_policy
        grounds: [calculations.slate_fill_selection, "errors[ERR_NO_ELIGIBLE_SUCCESSOR]"]
        distinguishing_aspect: "Empty-pool fallback: the only ACTIVE entry is READY_3_PLUS (outside the eligible readiness set), so fill-from-slate fails with ERR_NO_ELIGIBLE_SUCCESSOR."
        test_recipe:
          setup: ["vacancy; slate holds one ACTIVE READY_3_PLUS entry"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC134", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC134", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S134", full_name: "Sue Cessor", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { suc: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 134", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
