              captures: { pb2_id: $.data.id }
          assert:
            - "the 2027-03-31 start returns 409 with error_id ERR_PREBUY_SEASON_OVERLAP (the shared end/start day is a conflict under closed-interval semantics)"
            - "the 2027-04-01 start returns 201 with status DRAFT, drawn_cubic_yards 0.0 and remaining_cubic_yards 20.0"
            - "PreBuyContract.${pb1_id}.status == ACTIVE and remaining_cubic_yards == 50.0 (the rejected attempt changed nothing)"
            - "GET /prebuy-contracts?contractor_account_id=${acct_id} returns total_count 2, namely ${pb1_id} and ${pb2_id}"

  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_restores_reservation_prebuy_credit_and_purchase_order
        grounds:
          - state_machines.MaterialOrder.CONFIRMED_to_CANCELLED
          - state_machines.PreBuyContract.EXHAUSTED_to_ACTIVE
          - state_machines.JobPurchaseOrder.EXHAUSTED_to_OPEN
          - calculations.account_credit_position
          - calculations.inventory_net_sellable_volume
        distinguishing_aspect: |
          One cancel must undo a four-entity reservation fan-out exactly, with no drift and no
          residue: lot reservation back to 0.0, pre-buy draw back to 0.0 with the terminal-looking
          EXHAUSTED status reverting to ACTIVE, purchase-order commitment back to 0 with
          EXHAUSTED reverting to OPEN, and account credit back to 0 — while the settlement axis
          stays UNBILLED, proving the compensation is scoped to the fulfillment dimension only.
        test_recipe:
          setup:
            - "prebuy_eligible material at 2000 cents/cubic-yard list price; lot of 100.00 gross cubic yards at 15% moisture (net 90.00)."
            - "Account with credit_limit_cents exactly 36000 and po_required true; JobPurchaseOrder with po_limit_cents exactly 36000."
            - "ACTIVE pre-buy contract locking 1500 cents/cubic-yard for 10.00 cubic yards over the 2026-07-01 to 2026-12-31 season."
            - "DELIVERY order (CLASS_A, 0.0 miles) tagged to the purchase order with one BULK line of 10.00 cubic yards drawing on the pre-buy, confirmed (quoted 36000 = 15000 bulk + 7500 min-load fee + 13500 TRI_AXLE base), then given one PLANNED load."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "MULCH-PREBUY", name: "Pre-Buy Hardwood Mulch", offered_forms: [BULK], seasonal_category: "MULCH", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: true }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Compensation Grounds Care", credit_limit_cents: 36000, po_required: true, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /job-purchase-orders"
              payload: { contractor_account_id: "${acct_id}", po_number: "PO-2026-118", job_code: "JOB-118", po_limit_cents: 36000 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { po_id: $.data.id }
            - call: "POST /prebuy-contracts"
              payload: { contractor_account_id: "${acct_id}", material_id: "${mat_id}", locked_price_per_cubic_yard_cents: 1500, contracted_cubic_yards: 10.0, season_start_date: "2026-07-01", season_end_date: "2026-12-31" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /prebuy-contracts/${pb_id}/activate"
              payload: {}
              as: YardAdmin
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "DELIVERY", job_purchase_order_id: "${po_id}", delivery_address: "60 Compensation Rd", driveway_access_class: "CLASS_A", delivery_distance_miles: 0.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 10.0, use_prebuy: true }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { line_id: $.data.id }
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /delivery-trucks"
              payload: { truck_code: "T-444", axle_class: "TRI_AXLE", max_payload_lb: 20000, bed_capacity_cubic_yards: 15.0, min_driveway_access_class: "CLASS_C" }
              as: DispatchPlanner
              captures: { truck_id: $.data.id }
            - call: "POST /delivery-loads"
              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 10.0, window_start: "2026-08-02T08:00:00.000Z", window_end: "2026-08-02T12:00:00.000Z" }
              as: DispatchPlanner
              captures: { load_id: $.data.id }
          trigger:
            - call: "POST /material-orders/${ord_id}/cancel"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
          assert:
            - "before the cancel: MaterialOrder.${ord_id}.quoted_total_cents == 36000, OrderLine.${line_id}.unit_price_cents == 1500 and line_price_cents == 15000 (locked price, no seasonal surcharge)"
            - "before the cancel: InventoryLot.${lot_id}.reserved_cubic_yards == 10.00, Material.${mat_id}.available_net_cubic_yards == 80.00, PreBuyContract.${pb_id}.status == EXHAUSTED with remaining_cubic_yards 0.0, JobPurchaseOrder.${po_id}.status == EXHAUSTED with committed_cents 36000, ContractorAccount.${acct_id}.credit_used_cents == 36000 and credit_available_cents == 0"
            - "after the cancel: MaterialOrder.${ord_id}.fulfillment_status == CANCELLED and settlement_status == UNBILLED (untouched)"
            - "after the cancel: InventoryLot.${lot_id}.reserved_cubic_yards == 0.0, net_sellable_cubic_yards == 90.00 and Material.${mat_id}.available_net_cubic_yards == 90.00"
            - "after the cancel: PreBuyContract.${pb_id}.drawn_cubic_yards == 0.0, remaining_cubic_yards == 10.0 and status == ACTIVE (reverted out of EXHAUSTED)"
            - "after the cancel: JobPurchaseOrder.${po_id}.committed_cents == 0 and status == OPEN; ContractorAccount.${acct_id}.credit_used_cents == 0 and credit_available_cents == 36000"
            - "after the cancel: DeliveryLoad.${load_id}.status == CANCELLED and InventoryLot.${lot_id}.withdrawn_gross_cubic_yards == 0.0 (no material ever moved)"

      - name: container_deposit_liability_conserved_across_partial_return_and_forfeit
        grounds:
          - calculations.container_deposit_refund
          - state_machines.ContainerReturn.OUTSTANDING_to_PARTIALLY_RETURNED
          - state_machines.ContainerReturn.PARTIALLY_RETURNED_to_FORFEITED
          - entities.ContractorAccount.fields.pallet_deposit_balance_cents
        distinguishing_aspect: |
          A conservation identity rather than an undo: whatever the decay curve does to the
          refund, refund_cents + forfeited_cents must equal issued_count * deposit_per_unit_cents
          exactly, and the account's pallet_deposit_balance_cents must land on 0 — here through
          a 40-day-late partial return (weeks_late CEIL(10 days / 7 days) = 2, multiplier 0.50,
          refund 1250) followed by a forfeit of the container that never came back (3750). The
          two halves are unequal, so an implementation that mirrors the refund instead of
          subtracting it from the issued liability breaks the identity.
        test_recipe:
          setup:
            - "MULCH material (PALLET containers at 2500 cents deposit) at 2000 cents/cubic-yard bulk and 899 cents/bag; the logical clock is left at its 2026-08-01T00:00:00Z default."
            - "DELIVERY order (CLASS_A, 0.0 miles) with a BULK line of 5.00 cubic yards and a BAGGED line of 60 bags, confirmed and delivered in full on 2026-08-01, cascade-creating a ContainerReturn with issued_count 2 and issued_at 2026-08-01T00:00:00.000Z."
            - "The clock is then advanced to 2026-09-10T00:00:00.000Z, which is 40 days after issue and therefore 10 days past the 30-day grace window."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "MULCH-BAGGED", name: "Bagged Hardwood Mulch", offered_forms: [BULK, BAGGED], seasonal_category: "MULCH", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Pallet Ledger Landscapes", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "DELIVERY", delivery_address: "22 Ledger St", driveway_access_class: "CLASS_A", delivery_distance_miles: 0.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 5.0 }
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BAGGED", quantity: 60 }
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /delivery-trucks"
              payload: { truck_code: "T-555", axle_class: "TRI_AXLE", max_payload_lb: 20000, bed_capacity_cubic_yards: 15.0, min_driveway_access_class: "CLASS_C" }
              as: DispatchPlanner
              captures: { truck_id: $.data.id }
            - call: "POST /delivery-loads"
              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 5.0, window_start: "2026-08-01T08:00:00.000Z", window_end: "2026-08-01T12:00:00.000Z" }
              as: DispatchPlanner
              captures: { load_id: $.data.id }
            - call: "POST /delivery-loads/${load_id}/dispatch"
              payload: {}
              as: DispatchPlanner
              as_user_id: "planner-8"
            - call: "POST /delivery-loads/${load_id}/deliver"
              payload: { actual_net_cubic_yards: 5.0, driveway_protection_used: true }
              as: DispatchPlanner
              as_user_id: "planner-8"
            - call: "GET /container-returns"
              payload: { material_order_id: "${ord_id}" }
              as: YardLoader
              captures: { ret_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00.000Z" }
              as: YardAdmin
          trigger:
            - call: "POST /container-returns/${ret_id}/receive"
              payload: { returned_count: 1 }
              as: YardLoader
              as_user_id: "loader-3"
            - call: "POST /container-returns/${ret_id}/forfeit"
              payload: {}
              as: YardAdmin
          assert:
            - "after the receive: ContainerReturn.${ret_id}.returned_count == 1, refund_cents == 1250 (ROUND_HALF_UP(2500 * 0.50)), status == PARTIALLY_RETURNED"
            - "after the receive: ContractorAccount.${acct_id}.pallet_deposit_balance_cents == 3750 (5000 issued liability - 1250 refunded)"
            - "after the forfeit: ContainerReturn.${ret_id}.status == FORFEITED and forfeited_cents == 3750"
            - "invariant: refund_cents + forfeited_cents == 1250 + 3750 == 5000 == issued_count 2 * deposit_per_unit_cents 2500"
            - "after the forfeit: ContractorAccount.${acct_id}.pallet_deposit_balance_cents == 0"
            - "ContainerReturn.${ret_id}.returned_count stays 1 (forfeit never fabricates a return) and last_received_at == 2026-09-10T00:00:00.000Z"
