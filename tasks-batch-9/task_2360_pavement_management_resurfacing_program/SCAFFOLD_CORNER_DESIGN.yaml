        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Maple St's candidate is FUNDED in an ADOPTED 20,000,000 scenario, but it has never been placed into a project."
            - "A Z1 project was created with NO lines and advanced with START_COORDINATION, creating the four roster rows."
