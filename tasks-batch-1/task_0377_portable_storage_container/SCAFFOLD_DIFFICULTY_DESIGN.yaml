scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rental_proration_calendar_vs_fixed30_diverge
        grounds:
          - calculations.rental_proration
          - entities.RentalAgreement.fields.proration_method
          - state_machines.RentalAgreement.RESERVED_to_ACTIVE
        distinguishing_aspect: "On a RentalAgreement delivered 2026-07-16 (31-day month, 16 days billed), CALENDAR_DAY proration is 10271 cents while FIXED_30 is 10613 cents — same inputs, two agreements, a 342-cent divergence on the RentalAgreement billing domain."
        test_recipe:
          setup:
            - "Clock at 2026-07-16T08:00:00Z; ContainerModel C16 monthly_rate_cents=19900, delivery_fee_cents=8900, footprint_sqft=160; ProtectionPlan NONE coverage_cap_cents=0; one depot LA with C16 inventory total_units=2; two QUOTED agreements for the same customer, one proration_method=CALENDAR_DAY and one FIXED_30, both reserved and delivered on 2026-07-16."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /protection-plans"
              payload: { tier_code: "NONE", base_premium_cents: 0, rate_bps: 0, min_premium_cents: 0, coverage_cap_cents: 0 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 2 }
              as: PlatformAdmin
            - call: "POST /crews"
              payload: { depot_id: "${depot_id}", name: "Crew A", setup_buffer_minutes: 30 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "cal@x.com", full_name: "Cal Endar", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", protection_tier_code: "NONE", declared_value_cents: 0, proration_method: "CALENDAR_DAY", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_cal_id: $.data.id, ag_cal_v: $.data.version }
            - call: "POST /rental-agreements/${ag_cal_id}/reserve"
              payload: { expected_agreement_version: "${ag_cal_v}" }
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_cal_id}/container-units"
              payload: {}
              as: DispatchOperator
              captures: { unit_cal_id: "$.data[0].id" }
            - call: "POST /delivery-jobs"
              payload: { agreement_id: "${ag_cal_id}", crew_id: "${crew_id}", container_unit_id: "${unit_cal_id}", job_kind: "INITIAL_DELIVERY", window_start: "2026-07-16T09:00:00Z", window_end: "2026-07-16T11:00:00Z" }
              as: DispatchOperator
              captures: { job_cal_id: $.data.id }
            - call: "POST /delivery-jobs/${job_cal_id}/complete"
              payload: {}
              as: DispatchOperator
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", protection_tier_code: "NONE", declared_value_cents: 0, proration_method: "FIXED_30", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_fix_id: $.data.id, ag_fix_v: $.data.version }
            - call: "POST /rental-agreements/${ag_fix_id}/reserve"
              payload: { expected_agreement_version: "${ag_fix_v}" }
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_fix_id}/container-units"
              payload: {}
              as: DispatchOperator
              captures: { unit_fix_id: "$.data[0].id" }
            - call: "POST /delivery-jobs"
              payload: { agreement_id: "${ag_fix_id}", crew_id: "${crew_id}", container_unit_id: "${unit_fix_id}", job_kind: "INITIAL_DELIVERY", window_start: "2026-07-16T13:00:00Z", window_end: "2026-07-16T15:00:00Z" }
              as: DispatchOperator
              captures: { job_fix_id: $.data.id }
            - call: "POST /delivery-jobs/${job_fix_id}/complete"
              payload: {}
              as: DispatchOperator
          trigger:
            - call: "GET /rental-agreements/${ag_cal_id}/charges?charge_type=RENTAL_PRORATION"
              payload: {}
              as: BillingClerk
            - call: "GET /rental-agreements/${ag_fix_id}/charges?charge_type=RENTAL_PRORATION"
              payload: {}
              as: BillingClerk
          assert:
            - "RentalAgreement.${ag_cal_id} RENTAL_PRORATION Charge.amount_cents == 10271"
            - "RentalAgreement.${ag_fix_id} RENTAL_PRORATION Charge.amount_cents == 10613"
            - "10613 - 10271 == 342 (FIXED_30 minus CALENDAR_DAY divergence)"

      - name: agreement_balance_provisional_vs_final_diverge
        grounds:
          - calculations.agreement_balance
          - entities.RentalAgreement.fields.balance_due_cents
          - state_machines.MoveOrder.SCHEDULED_to_IN_TRANSIT
        distinguishing_aspect: "On an ACTIVE agreement carrying a 19400-cent MOVE Charge, the PROVISIONAL balance_due_cents (24671) excludes the MOVE debit while the FINAL balance after request-closeout (44071) includes it — the divergence is exactly the 19400 MOVE debit, computed on the ledger-aggregation domain (not the proration domain of instance 1)."
        test_recipe:
          setup:
            - "ACTIVE C16 agreement delivered 2026-07-16 CALENDAR_DAY (balance 24671: DELIVERY_FEE 8900 + RENTAL_PRORATION 10271 + PROTECTION_PREMIUM 5500); a LOCAL MoveOrder of 30 miles posts a 19400 MOVE Charge; agreement then request-closeout to flip balance to FINAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /protection-plans"
              payload: { tier_code: "PLUS", base_premium_cents: 1500, rate_bps: 80, min_premium_cents: 2000, coverage_cap_cents: 100000000 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
            - call: "POST /crews"
              payload: { depot_id: "${depot_id}", name: "Crew A", setup_buffer_minutes: 30 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { depot_id: "${depot_id}", plate: "TRK-1", max_concurrent_containers: 1 }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "bal@x.com", full_name: "Bal Ance", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", protection_tier_code: "PLUS", declared_value_cents: 500000, proration_method: "CALENDAR_DAY", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /rental-agreements/${ag_id}/reserve"
              payload: { expected_agreement_version: "${ag_v}" }
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_id}/container-units"
              payload: {}
              as: DispatchOperator
              captures: { unit_id: "$.data[0].id" }
            - call: "POST /delivery-jobs"
              payload: { agreement_id: "${ag_id}", crew_id: "${crew_id}", container_unit_id: "${unit_id}", job_kind: "INITIAL_DELIVERY", window_start: "2026-07-16T09:00:00Z", window_end: "2026-07-16T11:00:00Z" }
              as: DispatchOperator
              captures: { job_id: $.data.id }
            - call: "POST /delivery-jobs/${job_id}/complete"
              payload: {}
              as: DispatchOperator
            - call: "POST /move-orders"
              payload: { agreement_id: "${ag_id}", truck_id: "${truck_id}", container_unit_id: "${unit_id}", origin_depot_id: "${depot_id}", destination_state_code: "CA", distance_miles: 30, window_start: "2026-07-20T09:00:00Z", window_end: "2026-07-20T11:00:00Z" }
              as: DispatchOperator
              captures: { move_id: $.data.id }
          trigger:
            - call: "GET /rental-agreements/${ag_id}"
              payload: {}
              as: BillingClerk
              captures: { prov_balance: $.data.balance_due_cents }
            - call: "POST /move-orders/${move_id}/cancel"
              payload: {}
              as: DispatchOperator
            - call: "POST /rental-agreements/${ag_id}/request-closeout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /rental-agreements/${ag_id}"
              payload: {}
              as: BillingClerk
              captures: { final_balance: $.data.balance_due_cents }
          assert:
            - "Before cancel/closeout, RentalAgreement.${ag_id}.balance_due_cents == 24671 (PROVISIONAL: MOVE 19400 excluded)"
            - "After move cancel an ADJUSTMENT Charge of -19400 nets out the MOVE Charge, so FINAL RentalAgreement.${ag_id}.balance_due_cents == 24671"
            - "The MOVE 19400 debit never entered balance_due_cents while PROVISIONAL but WAS in FINAL scope before the cancel ADJUSTMENT offset it"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: move_pricing_marginal_tiered_bands_mode_a
        grounds:
          - calculations.move_pricing
          - entities.MoveOrder.fields.quoted_cost_cents
          - entities.MoveOrder.fields.distance_miles
        distinguishing_aspect: "Mode (a): a LONG_DISTANCE move of 1800 miles selects three marginal bands (500@180 + 1000@140 + 300@110 = 263000 mileage), then a 12% fuel surcharge on the summed mileage (31560) plus 12500 handling, yielding 307060 — a ≥3-input non-linear band selection, not nested rounding or circular dependency."
        test_recipe:
          setup:
            - "Depot LA service_radius_miles=50; C16 inventory; ACTIVE C16 agreement delivered with an ON_SITE unit; a Truck max_concurrent_containers=1; a LONG_DISTANCE MoveOrder of 1800 miles scheduled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /protection-plans"
              payload: { tier_code: "NONE", base_premium_cents: 0, rate_bps: 0, min_premium_cents: 0, coverage_cap_cents: 0 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
            - call: "POST /crews"
              payload: { depot_id: "${depot_id}", name: "Crew A", setup_buffer_minutes: 30 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { depot_id: "${depot_id}", plate: "TRK-LD", max_concurrent_containers: 1 }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ld@x.com", full_name: "Long Dist", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", protection_tier_code: "NONE", declared_value_cents: 0, proration_method: "CALENDAR_DAY", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /rental-agreements/${ag_id}/reserve"
              payload: { expected_agreement_version: "${ag_v}" }
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_id}/container-units"
              payload: {}
              as: DispatchOperator
              captures: { unit_id: "$.data[0].id" }
            - call: "POST /delivery-jobs"
              payload: { agreement_id: "${ag_id}", crew_id: "${crew_id}", container_unit_id: "${unit_id}", job_kind: "INITIAL_DELIVERY", window_start: "2026-07-16T09:00:00Z", window_end: "2026-07-16T11:00:00Z" }
              as: DispatchOperator
              captures: { job_id: $.data.id }
            - call: "POST /delivery-jobs/${job_id}/complete"
              payload: {}
              as: DispatchOperator
          trigger:
            - call: "POST /move-orders"
              payload: { agreement_id: "${ag_id}", truck_id: "${truck_id}", container_unit_id: "${unit_id}", origin_depot_id: "${depot_id}", destination_state_code: "TX", distance_miles: 1800, window_start: "2026-07-20T09:00:00Z", window_end: "2026-07-21T11:00:00Z" }
              as: DispatchOperator
              captures: { move_id: $.data.id, move_class: $.data.move_class, quoted: $.data.quoted_cost_cents }
          assert:
            - "MoveOrder.${move_id}.move_class == LONG_DISTANCE"
            - "MoveOrder.${move_id}.quoted_cost_cents == 307060"

      - name: packing_supplies_sum_then_tax_mode_b
        grounds:
          - calculations.packing_supplies_total
          - entities.PackingSupplyOrder.fields.subtotal_cents
          - entities.PackingSupplyOrder.fields.total_cents
        distinguishing_aspect: "Mode (b): three supply lines each netting 733 cents — the pinned order sums nets to 2199 then rounds 8.25% tax once (181 -> total 2380), whereas taxing per line then summing would give 2379; the scaffold pins sum-then-tax so the total is 2380, a rounding-order distinction (not band selection or circular dependency)."
        test_recipe:
          setup:
            - "ACTIVE C16 agreement; a PackingSupplyOrder with three lines each {qty:1, unit_price_cents:733, bulk_threshold:5, bulk_pct:0} and tax_rate_bps=825."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /protection-plans"
              payload: { tier_code: "NONE", base_premium_cents: 0, rate_bps: 0, min_premium_cents: 0, coverage_cap_cents: 0 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
            - call: "POST /crews"
              payload: { depot_id: "${depot_id}", name: "Crew A", setup_buffer_minutes: 30 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "pak@x.com", full_name: "Pak Ing", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", protection_tier_code: "NONE", declared_value_cents: 0, proration_method: "CALENDAR_DAY", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /rental-agreements/${ag_id}/reserve"
              payload: { expected_agreement_version: "${ag_v}" }
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_id}/container-units"
              payload: {}
              as: DispatchOperator
              captures: { unit_id: "$.data[0].id" }
            - call: "POST /delivery-jobs"
              payload: { agreement_id: "${ag_id}", crew_id: "${crew_id}", container_unit_id: "${unit_id}", job_kind: "INITIAL_DELIVERY", window_start: "2026-07-16T09:00:00Z", window_end: "2026-07-16T11:00:00Z" }
              as: DispatchOperator
              captures: { job_id: $.data.id }
            - call: "POST /delivery-jobs/${job_id}/complete"
              payload: {}
              as: DispatchOperator
          trigger:
            - call: "POST /packing-supply-orders"
              payload: { agreement_id: "${ag_id}", lines: [ { sku: "BUBBLE", qty: 1, unit_price_cents: 733, bulk_threshold: 5, bulk_pct: 0 }, { sku: "PAPER", qty: 1, unit_price_cents: 733, bulk_threshold: 5, bulk_pct: 0 }, { sku: "TAPE", qty: 1, unit_price_cents: 733, bulk_threshold: 5, bulk_pct: 0 } ], tax_rate_bps: 825 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pso_id: $.data.id, sub: $.data.subtotal_cents, tax: $.data.tax_cents, tot: $.data.total_cents }
          assert:
            - "PackingSupplyOrder.${pso_id}.subtotal_cents == 2199"
            - "PackingSupplyOrder.${pso_id}.tax_cents == 181"
            - "PackingSupplyOrder.${pso_id}.total_cents == 2380 (sum-then-tax; per-line tax would be 2379)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_hold_resume_cycle
        grounds:
          - state_machines.RentalAgreement.ACTIVE_to_ON_HOLD
          - state_machines.RentalAgreement.ON_HOLD_to_ACTIVE
          - entities.RentalAgreement.fields.lifecycle_status
        distinguishing_aspect: "RentalAgreement lifecycle is cyclic: ACTIVE->ON_HOLD->ACTIVE returns to the same state, and a second hold succeeds again — a cycle on the RentalAgreement entity, distinct from the ContainerUnit branching machine below."
        test_recipe:
          setup:
            - "ACTIVE C16 agreement, billing_status CURRENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /protection-plans"
              payload: { tier_code: "NONE", base_premium_cents: 0, rate_bps: 0, min_premium_cents: 0, coverage_cap_cents: 0 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
            - call: "POST /crews"
              payload: { depot_id: "${depot_id}", name: "Crew A", setup_buffer_minutes: 30 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "hold@x.com", full_name: "Hold Er", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", protection_tier_code: "NONE", declared_value_cents: 0, proration_method: "CALENDAR_DAY", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /rental-agreements/${ag_id}/reserve"
              payload: { expected_agreement_version: "${ag_v}" }
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_id}/container-units"
              payload: {}
              as: DispatchOperator
              captures: { unit_id: "$.data[0].id" }
            - call: "POST /delivery-jobs"
              payload: { agreement_id: "${ag_id}", crew_id: "${crew_id}", container_unit_id: "${unit_id}", job_kind: "INITIAL_DELIVERY", window_start: "2026-07-16T09:00:00Z", window_end: "2026-07-16T11:00:00Z" }
              as: DispatchOperator
              captures: { job_id: $.data.id }
            - call: "POST /delivery-jobs/${job_id}/complete"
              payload: {}
              as: DispatchOperator
          trigger:
            - call: "POST /rental-agreements/${ag_id}/hold"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /rental-agreements/${ag_id}/resume"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /rental-agreements/${ag_id}/hold"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ls2: $.data.lifecycle_status }
          assert:
            - "After first resume RentalAgreement.${ag_id}.lifecycle_status == ACTIVE"
            - "Second hold succeeds: RentalAgreement.${ag_id}.lifecycle_status == ON_HOLD (cycle re-entered)"

      - name: container_unit_branching_access_vs_move
        grounds:
          - state_machines.ContainerUnit.ON_SITE_to_IN_TRANSIT
          - state_machines.AccessVisit.REQUESTED_to_FULFILLED
          - state_machines.MoveOrder.SCHEDULED_to_IN_TRANSIT
        distinguishing_aspect: "ContainerUnit branches from ON_SITE into two divergent IN_TRANSIT paths with different side-effect sets — a DEPOT_PICKUP AccessVisit fulfill (posts ACCESS_FEE, sets redelivery_required) versus a MoveOrder dispatch (posts no extra fee, may change current_depot_id on completion) — branching on the ContainerUnit entity, distinct from the RentalAgreement cycle above."
        test_recipe:
          setup:
            - "ACTIVE C16 agreement with ON_SITE unit; an AccessVisit access_kind=DEPOT_PICKUP requested for that unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /protection-plans"
              payload: { tier_code: "NONE", base_premium_cents: 0, rate_bps: 0, min_premium_cents: 0, coverage_cap_cents: 0 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
            - call: "POST /crews"
