            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 3 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c1_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v0}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { o1_id: $.data.id }
            - call: "GET /v1/slots/${slot_id}"
