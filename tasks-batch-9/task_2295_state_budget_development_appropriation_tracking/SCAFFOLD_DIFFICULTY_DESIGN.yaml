          - entities.DecisionPackage.fields.depends_on_package_id
        distinguishing_aspect: |
          Category pair business_referential (priority 16, ERR_DEPENDENCY_DEFERRED) versus
          business_constraint (priority 27, ERR_DUPLICATE_PRIORITY_RANK) — a different
          error-category pair and a different endpoint than the prepare instance: one POST
          /fiscal/decision-packages violates both and MUST return ERR_DEPENDENCY_DEFERRED.
        test_recipe:
          setup:
            - "Agency DOE; BudgetCycle 2027 in phase DEVELOPMENT"
