  # =========================================================================
  - section: rbac
    instances:

      - name: ops_planner_cannot_approve_a_report
        claim_type: role_denied_operations
        grounds:
          - roles.OpsPlanner
          - roles.ContractAdmin
          - validations[priority=30]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Approve is exclusive to ContractAdmin, so an OpsPlanner call returns 403 ERR_FORBIDDEN_ROLE and the report stays SUBMITTED with approved_by_user_id null."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with one empty-period report submitted by liaison-r."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "RBAC Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { crb: $.data.id }
            - call: "POST /service-contracts/${crb}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /service-period-reports"
              payload: { contract_id: "${crb}", period_start_date: "2026-09-01", period_end_date: "2026-09-30" }
              as: ClientLiaison
              captures: { rprb: $.data.id }
            - call: "POST /service-period-reports/${rprb}/submit"
              payload: {}
              as: ClientLiaison
              as_user_id: "liaison-r"
          trigger:
            - call: "POST /service-period-reports/${rprb}/approve"
              payload: {}
              as: OpsPlanner
              as_user_id: "planner-r"
              captures: { e_role: $.data.error_id }
          assert:
            - "HTTP status is 403"
            - "${e_role} == 'ERR_FORBIDDEN_ROLE'"
            - "GET /service-period-reports/${rprb} -> ServicePeriodReport.status == 'SUBMITTED' and approved_by_user_id == null"

      - name: driver_cannot_start_a_trip_assigned_to_another_driver
        claim_type: role_denied_operations
        grounds:
          - roles.DriverUser
          - validations[priority=35]
          - errors[ERR_DRIVER_NOT_ASSIGNED]
        distinguishing_aspect: "DriverUser is entity_backed:Driver, so the server compares X-User-ID against trip.driver_id: the unassigned driver's start returns 403 ERR_DRIVER_NOT_ASSIGNED while the assigned driver's identical start succeeds."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with a PUBLISHED single-trip Route on 2026-09-02 ASSIGNED to driver A."
            - "A second driver B exists but is on no trip."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Identity Campus", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /service-contracts/${cid}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${cid}", name: "Identity Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rid: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-3901", seat_capacity: 20, is_ada_accessible: false, odometer_km: 1000, service_interval_km: 20000 }
              as: FleetManager
              captures: { vid: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Driver A", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { didA: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Driver B", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { didB: $.data.id }
            - call: "POST /routes/${rid}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rid}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tid: "$.data[0].id" }
            - call: "POST /trips/${tid}/assign"
              payload: { vehicle_id: "${vid}", driver_id: "${didA}" }
              as: OpsPlanner
          trigger:
            - call: "POST /trips/${tid}/start"
              payload: { actual_departure_min: 421 }
              as: DriverUser
              as_user_id: "${didB}"
              captures: { e_ident: $.data.error_id }
            - call: "POST /trips/${tid}/start"
              payload: { actual_departure_min: 421 }
              as: DriverUser
              as_user_id: "${didA}"
              captures: { tid_status: $.data.dispatch_status }
          assert:
            - "the driver B attempt responds with HTTP 403"
            - "${e_ident} == 'ERR_DRIVER_NOT_ASSIGNED'"
            - "${tid_status} == 'IN_SERVICE'"
            - "GET /trips/${tid} -> Trip.actual_departure_min == 421"

      - name: request_without_auth_headers_returns_unauthenticated
        claim_type: role_denied_operations
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "The trigger is sent with NO X-User-Role and NO X-User-ID header at all, and must return 401 ERR_UNAUTHENTICATED even though the endpoint is a plain read that every role is allowed to perform."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "GET /service-contracts"
              payload: {}
              as: ContractAdmin
              captures: { e_auth: $.data.error_id }
          assert:
            - "the request omits both the X-User-Role and the X-User-ID header"
            - "HTTP status is 401"
            - "${e_auth} == 'ERR_UNAUTHENTICATED'"
            - "response_type == 'error'"

      - name: unknown_role_header_returns_unauthenticated
        claim_type: role_denied_operations
        grounds:
          - validations[priority=20]
          - errors[ERR_UNAUTHENTICATED]
          - roles.ContractAdmin
        distinguishing_aspect: "X-User-Role 'Auditor' is not one of the five declared roles, so the call fails at priority 20 with 401 ERR_UNAUTHENTICATED rather than at priority 30 with 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "GET /service-contracts"
              payload: {}
              as: Auditor
              as_user_id: "auditor-1"
              captures: { e_unknown: $.data.error_id }
          assert:
            - "HTTP status is 401"
            - "${e_unknown} == 'ERR_UNAUTHENTICATED'"
            - "the response is NOT 403 and NOT ERR_FORBIDDEN_ROLE"

      - name: segregation_of_duties_blocks_self_approval
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=70]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles.ContractAdmin
          - entities.ServicePeriodReport.fields.submitted_by_user_id
        distinguishing_aspect: "ContractAdmin may both submit and approve, but not the same X-User-ID on the same report: admin-s submitting and then approving returns 403 ERR_SEGREGATION_OF_DUTIES, while admin-t approving the identical report succeeds."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with an empty reporting period submitted by ContractAdmin admin-s."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "SoD Corp", site_type: "CORPORATE", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { csd: $.data.id }
            - call: "POST /service-contracts/${csd}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /service-period-reports"
              payload: { contract_id: "${csd}", period_start_date: "2026-09-01", period_end_date: "2026-09-30" }
              as: ContractAdmin
              as_user_id: "admin-s"
              captures: { rpsd: $.data.id }
            - call: "POST /service-period-reports/${rpsd}/submit"
              payload: {}
              as: ContractAdmin
              as_user_id: "admin-s"
              captures: { rpsd_submitter: $.data.submitted_by_user_id }
          trigger:
            - call: "POST /service-period-reports/${rpsd}/approve"
              payload: {}
              as: ContractAdmin
              as_user_id: "admin-s"
              captures: { e_sod: $.data.error_id }
            - call: "POST /service-period-reports/${rpsd}/approve"
              payload: {}
              as: ContractAdmin
              as_user_id: "admin-t"
              captures: { rpsd_status: $.data.status }
          assert:
            - "${rpsd_submitter} == 'admin-s'"
            - "the self-approval responds with HTTP 403"
            - "${e_sod} == 'ERR_SEGREGATION_OF_DUTIES'"
            - "${rpsd_status} == 'APPROVED'"
            - "GET /service-period-reports/${rpsd} -> ServicePeriodReport.approved_by_user_id == 'admin-t' and settlement_variant == 'FINAL'"

  # =========================================================================
  - section: cross_cutting_layers
    instances:

      - name: optimistic_concurrency_stale_contract_version_on_offer_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[renewal-offer-create-stale-contract]
          - errors[ERR_STALE_CONTRACT_VERSION]
          - validations[priority=58]
        distinguishing_aspect: "The first create consumes the observed contract version and advances it; a strictly later create still carrying that same value returns 412 ERR_STALE_CONTRACT_VERSION and leaves the standing offer OPEN, with no second offer row created."
        test_recipe:
          setup:
            - "Logical clock at 2027-07-15T09:00:00Z."
            - "One ACTIVE ServiceContract whose version was read immediately after activation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-15T09:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "OCC Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { coc: $.data.id }
            - call: "POST /service-contracts/${coc}/activate"
              payload: {}
              as: ContractAdmin
              captures: { coc_v: $.data.version }
            - call: "POST /renewal-offers"
              payload: { contract_id: "${coc}", proposed_term_months: 12, expected_contract_version: "${coc_v}" }
              as: ContractAdmin
              captures: { ooc1: $.data.id }
          trigger:
            - call: "POST /renewal-offers"
              payload: { contract_id: "${coc}", proposed_term_months: 24, expected_contract_version: "${coc_v}" }
              as: ContractAdmin
              captures: { e_occ: $.data.error_id }
          assert:
            - "HTTP status is 412"
            - "${e_occ} == 'ERR_STALE_CONTRACT_VERSION'"
            - "GET /renewal-offers?contract_id=${coc} -> total_count == 1 and data[0].id == '${ooc1}' and data[0].status == 'OPEN'"
            - "GET /service-contracts/${coc} -> ServiceContract.status == 'RENEWAL_PENDING'"

      - name: optimistic_concurrency_fresh_contract_version_supersedes_standing_offer
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[renewal-offer-create-stale-contract]
          - state_machines.RenewalOffer.OPEN_to_SUPERSEDED
          - state_machines.ServiceContract.RENEWAL_PENDING_to_RENEWAL_PENDING
        distinguishing_aspect: "Re-reading the contract before the second create supplies the fresh version, so the create is accepted, the first offer moves to SUPERSEDED, and the contract's version advances once more."
        test_recipe:
          setup:
            - "Logical clock at 2027-07-15T09:00:00Z."
            - "One ServiceContract at RENEWAL_PENDING carrying one OPEN RenewalOffer for a 12-month term."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-15T09:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Supersede Campus", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { csp: $.data.id }
            - call: "POST /service-contracts/${csp}/activate"
              payload: {}
              as: ContractAdmin
              captures: { csp_v1: $.data.version }
            - call: "POST /renewal-offers"
              payload: { contract_id: "${csp}", proposed_term_months: 12, expected_contract_version: "${csp_v1}" }
              as: ContractAdmin
              captures: { osp1: $.data.id }
            - call: "GET /service-contracts/${csp}"
              payload: {}
              as: ContractAdmin
              captures: { csp_v2: $.data.version }
          trigger:
            - call: "POST /renewal-offers"
              payload: { contract_id: "${csp}", proposed_term_months: 24, expected_contract_version: "${csp_v2}" }
              as: ContractAdmin
              captures: { osp2: $.data.id, osp2_round: $.data.round_index }
          assert:
            - "HTTP status is 201"
            - "${csp_v2} == ${csp_v1} + 1"
            - "GET /renewal-offers/${osp1} -> RenewalOffer.status == 'SUPERSEDED'"
            - "GET /renewal-offers/${osp2} -> RenewalOffer.status == 'OPEN' and proposed_term_months == 24"
            - "${osp2_round} == 1"
            - "GET /renewal-offers?contract_id=${csp} -> total_count == 2"
            - "GET /service-contracts/${csp} -> ServiceContract.version == ${csp_v2} + 1 and status == 'RENEWAL_PENDING'"

      - name: optimistic_concurrency_stale_route_version_on_republish
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[route-republish-stale-route]
          - errors[ERR_STALE_ROUTE_VERSION]
          - state_machines.Route.PUBLISHED_to_PUBLISHED
        distinguishing_aspect: "The first republish consumes the version observed at publish and advances it; a second republish reusing that value returns 412 ERR_STALE_ROUTE_VERSION and does not re-cut the day, so headway stays at 18 and the SCHEDULED trip count stays 3."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One ACTIVE ServiceContract with a PUBLISHED Route (window 420..456, headway 12) already republished once at headway 18, which cancelled the four original trips and created three new ones."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Route OCC Corp", site_type: "CORPORATE", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { croc: $.data.id }
            - call: "POST /service-contracts/${croc}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${croc}", name: "Route OCC Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 456, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rroc: $.data.id }
            - call: "POST /routes/${rroc}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { rroc_v: $.data.version }
            - call: "POST /routes/${rroc}/republish"
              payload: { service_date: "2026-09-02", headway_minutes: 18, expected_route_version: "${rroc_v}" }
              as: OpsPlanner
          trigger:
            - call: "POST /routes/${rroc}/republish"
              payload: { service_date: "2026-09-02", headway_minutes: 24, expected_route_version: "${rroc_v}" }
              as: OpsPlanner
              captures: { e_roc: $.data.error_id }
          assert:
            - "HTTP status is 412"
            - "${e_roc} == 'ERR_STALE_ROUTE_VERSION'"
            - "GET /routes/${rroc} -> Route.headway_minutes == 18 and Route.status == 'PUBLISHED'"
            - "GET /trips?route_id=${rroc}&dispatch_status=SCHEDULED -> total_count == 3"
            - "GET /trips?route_id=${rroc}&dispatch_status=CANCELLED -> total_count == 4"

  # =========================================================================
  - section: errors
    instances:

      - name: unknown_path_ids_return_their_own_not_found_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ROUTE_NOT_FOUND]
          - errors[ERR_TRIP_NOT_FOUND]
          - errors[ERR_VEHICLE_NOT_FOUND]
          - errors[ERR_DRIVER_NOT_FOUND]
