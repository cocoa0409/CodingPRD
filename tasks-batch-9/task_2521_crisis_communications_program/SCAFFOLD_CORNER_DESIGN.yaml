# =============================================================================
# 1.9 Scaffold Corner Design (Claim Coverage Index)
#
# Domain: crisis-communications-program   (see SCAFFOLD.yaml §1.1-§1.7)
# Sections and claim_types follow references/claim-extraction-guide.md. Corners already pinned by a
# §1.8 instance appear here as `excluded_because:` stubs that name that instance.
# Logical clock default is 2026-08-01T00:00:00Z; instances that do not set the clock rely on it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_team_member_creation_returns_declared_fields
        claim_type: Creation
        grounds:
          - entities.TeamMember
          - endpoints.POST_/crisis/team-members
        distinguishing_aspect: "A single create call must echo every declared input and initialise both TeamMember ledgers to 0 in the same response body."
        test_recipe:
          setup:
            - "No prior data; the logical clock is at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /crisis/team-members"
              payload: { full_name: "Mara Vance", org_title: "Chief Spokesperson", privilege_cleared: true, media_training_status: "CURRENT", media_training_expires_at: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { member_id: $.data.id }
          assert:
            - "response status == 201"
            - "TeamMember.${member_id}.full_name == Mara Vance"
            - "TeamMember.${member_id}.org_title == Chief Spokesperson"
            - "TeamMember.${member_id}.privilege_cleared == true"
            - "TeamMember.${member_id}.media_training_status == CURRENT"
            - "TeamMember.${member_id}.media_training_expires_at == 2026-12-01T00:00:00Z"
            - "TeamMember.${member_id}.scheduled_interview_minutes == 0"
            - "TeamMember.${member_id}.active_assignment_count == 0"
            - "id, created_at, updated_at and version are present and version == 1"

      - name: corner_monitored_channel_defaults_applied_when_optional_input_omitted
        claim_type: Defaults
        grounds:
          - entities.MonitoredChannel.fields.escalation_path_state
          - entities.MonitoredChannel.fields.max_concurrent_corrections
          - endpoints.POST_/crisis/monitored-channels
        distinguishing_aspect: "Omitting both optional inputs must still yield an UNVERIFIED escalation path, zeroed ledgers and the declared default correction capacity."
        test_recipe:
          setup:
            - "No prior data; logical clock at the startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /crisis/monitored-channels"
              payload: { name: "Platform X", channel_type: "SOCIAL" }
              as: ProgramAdmin
              captures: { ch_id: $.data.id }
          assert:
            - "response status == 201"
            - "MonitoredChannel.${ch_id}.escalation_path_state == UNVERIFIED"
            - "MonitoredChannel.${ch_id}.reserved_correction_minutes == 0"
            - "MonitoredChannel.${ch_id}.open_escalation_count == 0"
            - "MonitoredChannel.${ch_id}.max_concurrent_corrections == 1"
            - "MonitoredChannel.${ch_id}.platform_escalation_contact == null"

      - name: corner_prepared_material_computed_fields_start_at_draft_zero
        claim_type: Computed Fields
        grounds:
          - entities.PreparedMaterial.fields.readiness_score
          - entities.PreparedMaterial.fields.readiness_state
          - state_machines.PreparedMaterial.initial_state
        distinguishing_aspect: "readiness_score is computed, so a brand-new material must read 0.00 in DRAFT even though the review endpoint would set 100.00."
        test_recipe:
          setup:
            - "One comms lead on the roster."
          setup_api_calls:
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ivo Berg", org_title: "Comms Director" }
              as: ProgramAdmin
              captures: { comms_id: $.data.id }
          trigger:
            - call: "POST /crisis/prepared-materials"
              payload: { scenario_code: "DATA_BREACH", material_type: "DARK_SITE", title: "Breach dark site" }
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { mat_id: $.data.id }
          assert:
            - "response status == 201"
            - "PreparedMaterial.${mat_id}.readiness_state == DRAFT"
            - "PreparedMaterial.${mat_id}.readiness_score == 0.00"
            - "PreparedMaterial.${mat_id}.last_reviewed_at == null"
            - "PreparedMaterial.${mat_id}.dark_site_url == null"

      - name: corner_incident_system_fields_generated_and_extra_field_rejected
        claim_type: System Fields
        grounds:
          - entities.Incident
          - validations.priority_4_request_schema
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "System columns are never client-writable here: sending id or version in the body is an unknown-field violation (400), not silently ignored."
        test_recipe:
          setup:
            - "One incident lead on the roster."
          setup_api_calls:
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
          trigger:
            - call: "POST /crisis/incidents"
              payload: { title: "Rumour of a plant closure", scenario_code: "PLANT_INCIDENT", id: "00000000-0000-0000-0000-00000000aaaa", version: 9 }
              as: IncidentLead
              as_user_id: "${lead_id}"
            - call: "POST /crisis/incidents"
              payload: { title: "Rumour of a plant closure", scenario_code: "PLANT_INCIDENT" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_id: $.data.id }
          assert:
            - "the first call returns status 400 with data.error_id ERR_INVALID_REQUEST"
            - "the second call returns status 201 and Incident.${inc_id}.id != 00000000-0000-0000-0000-00000000aaaa"
            - "Incident.${inc_id}.version == 1"
            - "Incident.${inc_id}.created_at and updated_at are server-generated ISO 8601 instants"
            - "Incident.${inc_id}.created_by_member_id == ${lead_id}"

      - name: corner_issue_signal_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations.priority_5_path_id_existence
          - errors.ERR_SIGNAL_NOT_FOUND
          - endpoints.GET_/crisis/issue-signals/{signal_id}
        distinguishing_aspect: "A well-formed but unused UUID on the signal read path must produce the signal-specific 404, not a generic error."
        test_recipe:
          setup:
            - "No IssueSignal rows exist."
          setup_api_calls:
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ray Lund", org_title: "Social Analyst" }
              as: ProgramAdmin
              captures: { listener_id: $.data.id }
          trigger:
            - call: "GET /crisis/issue-signals/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: SocialListener
              as_user_id: "${listener_id}"
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_SIGNAL_NOT_FOUND"
            - "response data.message is a non-empty string"

      - name: corner_prepared_material_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - validations.priority_4_request_schema
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/crisis/prepared-materials
        distinguishing_aspect: "material_type has no default, so omitting it must fail with 400 before any row is created."
        test_recipe:
          setup:
            - "One comms lead on the roster."
          setup_api_calls:
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ivo Berg", org_title: "Comms Director" }
              as: ProgramAdmin
              captures: { comms_id: $.data.id }
          trigger:
            - call: "POST /crisis/prepared-materials"
              payload: { scenario_code: "DATA_BREACH", title: "Breach FAQ" }
              as: CommsLead
              as_user_id: "${comms_id}"
          assert:
            - "response status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /crisis/prepared-materials returns total_count 0"

      - name: corner_monitored_channel_invalid_enum_value_rejected
        claim_type: Type Constraints
        grounds:
          - entities.MonitoredChannel.fields.channel_type
          - validations.priority_4_request_schema
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "channel_type is a closed enum of MEDIA, SOCIAL and REGULATORY, so PODCAST must be refused rather than stored as free text."
        test_recipe:
          setup:
            - "No prior data."
          setup_api_calls: []
          trigger:
            - call: "POST /crisis/monitored-channels"
              payload: { name: "Podcast network", channel_type: "PODCAST" }
              as: ProgramAdmin
          assert:
            - "response status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /crisis/monitored-channels returns total_count 0"

      - name: corner_media_interview_unknown_spokesperson_fk_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations.priority_6_foreign_key_existence
          - errors.ERR_TEAM_MEMBER_NOT_FOUND
          - endpoints.POST_/crisis/media-interviews
        distinguishing_aspect: "In a flat topology every body FK is validated on its own: a resolvable incident_id and channel_id cannot rescue an unresolvable spokesperson_member_id."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z; a MONITORING incident and a MEDIA channel both exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ivo Berg", org_title: "Comms Director" }
              as: ProgramAdmin
              captures: { comms_id: $.data.id }
            - call: "POST /crisis/monitored-channels"
              payload: { name: "National Wire", channel_type: "MEDIA" }
              as: ProgramAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /crisis/incidents"
              payload: { title: "Inspection follow-up", scenario_code: "PLANT_INCIDENT" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /crisis/media-interviews"
              payload: { incident_id: "${inc_id}", spokesperson_member_id: "00000000-0000-0000-0000-0000000000bb", channel_id: "${ch_id}", outlet_name: "Wire Morning", scheduled_start_at: "2026-08-12T14:00:00Z", scheduled_end_at: "2026-08-12T15:00:00Z" }
              as: CommsLead
              as_user_id: "${comms_id}"
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_TEAM_MEMBER_NOT_FOUND"
            - "GET /crisis/media-interviews?incident_id=${inc_id} returns total_count 0"

      - name: corner_team_member_listing_returns_pagination_envelope
        claim_type: Listing
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints.GET_/crisis/team-members
        distinguishing_aspect: "With three rows and limit 2 the envelope must report total_count 3, has_more true and exactly two data items, and offset 2 must return the remaining one."
        test_recipe:
          setup:
            - "Three roster members exist."
          setup_api_calls:
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ivo Berg", org_title: "Comms Director" }
              as: ProgramAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ray Lund", org_title: "Social Analyst" }
              as: ProgramAdmin
              captures: { m3_id: $.data.id }
          trigger:
            - call: "GET /crisis/team-members?limit=2&offset=0"
              payload: {}
              as: ProgramAdmin
            - call: "GET /crisis/team-members?limit=2&offset=2"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the first list returns status 200 with total_count 3, limit 2, offset 0, has_more true and 2 items"
            - "the second list returns total_count 3, offset 2, has_more false and 1 item"
            - "the two pages together contain ${m1_id}, ${m2_id} and ${m3_id} exactly once each"

      - name: corner_incident_retrieval_echoes_stored_values
        claim_type: Retrieval
        grounds:
          - entities.Incident
          - endpoints.GET_/crisis/incidents/{incident_id}
        distinguishing_aspect: "A read-back of a MONITORING incident must show the stored inputs plus the not-yet-computed fields as null, with no severity assigned before activation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z; one incident created with reputation_index_before 62.40."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /crisis/incidents"
              payload: { title: "Customer records exposed", scenario_code: "DATA_BREACH", reputation_index_before: 62.40 }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "GET /crisis/incidents/${inc_id}"
              payload: {}
              as: IncidentLead
              as_user_id: "${lead_id}"
          assert:
            - "response status == 200"
            - "Incident.${inc_id}.title == Customer records exposed"
            - "Incident.${inc_id}.scenario_code == DATA_BREACH"
            - "Incident.${inc_id}.reputation_index_before == 62.40"
            - "Incident.${inc_id}.response_state == MONITORING"
            - "Incident.${inc_id}.privilege_state == NON_PRIVILEGED"
            - "Incident.${inc_id}.severity_tier == null"
            - "Incident.${inc_id}.activated_at == null"
            - "Incident.${inc_id}.holding_statement_due_at == null"
            - "Incident.${inc_id}.sla_breached == false"

      - name: corner_flat_topology_filtered_list_scopes_rows_by_foreign_key
        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology
          - endpoints.GET_/crisis/issue-signals
          - entities.IssueSignal.fields.incident_id
        distinguishing_aspect: "With a flat topology the only way to walk Incident -> IssueSignal is the filtered list, so ?incident_id= must return exactly the linked signal and exclude the unlinked one."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z; one MEDIA channel, two incidents."
            - "Two signals: one LINKED to the first incident, one left OPEN and unlinked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ray Lund", org_title: "Social Analyst" }
              as: ProgramAdmin
              captures: { listener_id: $.data.id }
            - call: "POST /crisis/monitored-channels"
              payload: { name: "National Wire", channel_type: "MEDIA" }
              as: ProgramAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /crisis/incidents"
              payload: { title: "First incident", scenario_code: "DATA_BREACH" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_a_id: $.data.id }
            - call: "POST /crisis/incidents"
              payload: { title: "Second incident", scenario_code: "SERVICE_OUTAGE" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_b_id: $.data.id }
            - call: "POST /crisis/issue-signals"
              payload: { channel_id: "${ch_id}", headline: "Signal that gets linked", reach_score: 55, sentiment_score: 0.0, source_credibility_tier: "A" }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_linked_id: $.data.id }
            - call: "POST /crisis/issue-signals"
              payload: { channel_id: "${ch_id}", headline: "Signal that stays open", reach_score: 55, sentiment_score: 0.0, source_credibility_tier: "A" }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_open_id: $.data.id }
            - call: "POST /crisis/issue-signals/${sig_linked_id}/link"
              payload: { incident_id: "${inc_a_id}" }
              as: SocialListener
              as_user_id: "${listener_id}"
          trigger:
            - call: "GET /crisis/issue-signals?incident_id=${inc_a_id}"
              payload: {}
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "GET /crisis/issue-signals?incident_id=${inc_b_id}"
              payload: {}
              as: SocialListener
              as_user_id: "${listener_id}"
          assert:
            - "the first list returns total_count 1 and its single item id == ${sig_linked_id}"
            - "the first list does not contain ${sig_open_id}"
            - "the second list returns total_count 0"
            - "IssueSignal.${sig_linked_id}.incident_id == ${inc_a_id}"
            - "IssueSignal.${sig_open_id}.incident_id == null"

  - section: state_machines
    instances:
      - name: corner_initial_states_across_all_machines
        claim_type: Initial State
        grounds:
          - state_machines.Incident.initial_state
          - state_machines.Incident.privilege_state.initial_state
          - state_machines.IssueSignal.initial_state
          - entities.MonitoredChannel.fields.escalation_path_state
          - state_machines.PreparedMaterial.initial_state
        distinguishing_aspect: "Every freshly created row must sit in its declared initial state, including both Incident dimensions at once (MONITORING x NON_PRIVILEGED)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z; a lead, a comms lead and a listener on the roster."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ivo Berg", org_title: "Comms Director" }
              as: ProgramAdmin
              captures: { comms_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ray Lund", org_title: "Social Analyst" }
              as: ProgramAdmin
              captures: { listener_id: $.data.id }
          trigger:
            - call: "POST /crisis/monitored-channels"
              payload: { name: "National Wire", channel_type: "MEDIA" }
              as: ProgramAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /crisis/incidents"
              payload: { title: "Cooling tower plume", scenario_code: "PLANT_INCIDENT" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /crisis/issue-signals"
              payload: { channel_id: "${ch_id}", headline: "Neighbour posts a photo", reach_score: 55, sentiment_score: 0.0, source_credibility_tier: "A" }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_id: $.data.id }
            - call: "POST /crisis/prepared-materials"
              payload: { scenario_code: "PLANT_INCIDENT", material_type: "HOLDING_TEMPLATE", title: "Plant incident holding template" }
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { mat_id: $.data.id }
          assert:
            - "Incident.${inc_id}.response_state == MONITORING"
            - "Incident.${inc_id}.privilege_state == NON_PRIVILEGED"
            - "Incident.${inc_id}.comms_posture == OPEN"
            - "IssueSignal.${sig_id}.state == OPEN"
            - "MonitoredChannel.${ch_id}.escalation_path_state == UNVERIFIED"
            - "PreparedMaterial.${mat_id}.readiness_state == DRAFT"
            - "IssueSignal.${sig_id}.detected_at == 2026-08-10T09:00:00Z"

      - name: corner_team_assignment_second_acknowledge_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.TeamAssignment.ASSIGNED_to_ACKNOWLEDGED
          - validations.priority_10_transition_from_state
          - errors.ERR_ASSIGNMENT_STATE_INVALID
        distinguishing_aspect: "Acknowledging a seat is not idempotent: the second identical call must be refused with ERR_ASSIGNMENT_STATE_INVALID while leaving acknowledged_at untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z; a MONITORING incident with one ASSIGNED INCIDENT_LEAD seat."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /crisis/incidents"
              payload: { title: "Payment processor outage", scenario_code: "SERVICE_OUTAGE" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /crisis/team-assignments"
              payload: { incident_id: "${inc_id}", member_id: "${lead_id}", team_role: "INCIDENT_LEAD", decision_authority: "FULL" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { a_lead_id: $.data.id }
          trigger:
            - call: "POST /crisis/team-assignments/${a_lead_id}/acknowledge"
              payload: {}
              as: IncidentLead
              as_user_id: "${lead_id}"
            - call: "POST /crisis/team-assignments/${a_lead_id}/acknowledge"
              payload: {}
              as: IncidentLead
              as_user_id: "${lead_id}"
          assert:
            - "the first acknowledge returns status 200 and TeamAssignment.${a_lead_id}.state == ACKNOWLEDGED"
            - "TeamAssignment.${a_lead_id}.acknowledged_at == 2026-08-10T09:00:00Z"
            - "the second acknowledge returns status 409 with data.error_id ERR_ASSIGNMENT_STATE_INVALID"
            - "TeamAssignment.${a_lead_id}.state == ACKNOWLEDGED"
            - "TeamMember.${lead_id}.active_assignment_count == 1"

      - name: corner_incident_activation_without_escalated_signal_rejected
        claim_type: Precondition Enforcement
        grounds:
          - validations.priority_24_escalated_signal_required
          - errors.ERR_NO_ESCALATED_SIGNAL
          - state_machines.Incident.MONITORING_to_ACTIVATED
        distinguishing_aspect: "A LINKED-only signal is exposure but not a trigger: activation must fail with ERR_NO_ESCALATED_SIGNAL until at least one signal reaches ESCALATED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One MEDIA signal scoring 63.00 LINKED to the incident but never escalated; INCIDENT_LEAD seat ACKNOWLEDGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ray Lund", org_title: "Social Analyst" }
              as: ProgramAdmin
              captures: { listener_id: $.data.id }
            - call: "POST /crisis/monitored-channels"
              payload: { name: "National Wire", channel_type: "MEDIA" }
              as: ProgramAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /crisis/incidents"
