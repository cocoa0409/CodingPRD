              payload: { cycle_day: 1, meal_slot: "DINNER", component_name: "Bean Rice Bowl", kcal_per_100g: 380.0, protein_grams_per_100g: 6.1, sodium_mg_per_100g: 160.0, portion_grams: 500, raw_cost_cents: 110 }
