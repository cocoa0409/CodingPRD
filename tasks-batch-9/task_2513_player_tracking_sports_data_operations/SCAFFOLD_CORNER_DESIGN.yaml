            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g_id: $.data.id }
            - call: "POST /games/${g_id}/open-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /licensees"
              payload: { name: "Northstar Data", licensee_class: "BROADCASTER", tier: "GOLD", granted_units: 5000, biometric_entitled: false }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { lic_id: $.data.id }
            - call: "POST /games/${g_id}/rights-windows"
              payload: { rights_class: "COMMERCIAL_LICENSE", holder_type: "LICENSEE", holder_id: "${lic_id}", territory: "US", window_start_utc: "2026-08-01T18:00:00Z", window_end_utc: "2026-08-01T21:00:00Z", max_latency_ms: 400, allowed_scopes: ["POSITIONAL"] }
              as: LeagueDataOps
