              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { d_gw_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VIN00000000000GW1", model_year: 2023, warranty_start_date: "2023-06-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { veh_gw_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "GW-200", description: "Cabin HVAC blower replacement", standard_time_hours: 1.0, max_time_hours: 1.5, category: "BASIC", requires_causal_part: true, causal_failure_group: "HVAC", overlap_group: "HVAC" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_gw_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "GW-P1", description: "HVAC blower motor", dealer_net_cents: 40000, failure_group: "HVAC", return_required: true, retention_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_gw_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${d_gw_id}", vehicle_id: "${veh_gw_id}", labor_operation_id: "${lo_gw_id}", causal_part_id: "${part_gw_id}", repair_order_number: "RO-GW-1", repair_date: "2026-05-14", odometer_at_repair: 39600, claimed_labor_hours: 1.0, claimed_parts_qty: 1, complaint_text: "Customer reports intermittent fault on delivery.", cause_text: "Component failed internal leak test at the dealership.", correction_text: "Replaced the failed component and road tested the vehicle." }
              as: DealerWarrantyAdmin
              as_user_id: "${d_gw_id}"
              captures: { cl_gw_id: $.data.id, cl_gw_version: $.data.version }
            - call: "POST /warranty/claims/${cl_gw_id}/goodwill-authorizations"
              payload: { requested_amount_cents: 40000, policy_adjustment_pct: 0.25, justification: "Long-standing customer just outside the mileage limit.", expected_claim_version: "${cl_gw_version}" }
              as: ClaimAdjudicator
