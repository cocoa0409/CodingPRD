          Three members are tuned to land exactly on the band edges from the same TX-led solicitation
          with notice_days 21: the OR member scores exactly AUTHORITY_AUTHORIZED_THRESHOLD (85.00) and
          must be AUTHORIZED, the ID member scores exactly AUTHORITY_CONDITIONAL_THRESHOLD (60.00) and
          must be CONDITIONAL, and the OK member scores 45.00 with a SHORT_NOTICE deduction that must be
