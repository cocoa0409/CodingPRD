              payload: { unit_code: "IMP-0113", unit_name: "Ash Pond 113", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, prog_id: $.data.monitoring_program_id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-01", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-01", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 20.00, screen_bottom_ft: 40.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-02", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 21.00, screen_bottom_ft: 41.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-03", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 23.00, screen_bottom_ft: 43.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "PATCH /ccr/monitoring-programs/${prog_id}"
              payload: { comparison_basis: "INTERWELL", background_window_start_on: "2025-01-01", background_window_end_on: "2025-12-31" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/monitoring-programs/${prog_id}/certify-network"
              payload: { certified_on: "2025-01-05" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/sampling-events"
              payload: { program_id: "${prog_id}", event_code: "DET-EMPTY", event_type: "DETECTION", sampled_on: "2026-06-15" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /ccr/sampling-events/${event_id}/validate"
              payload: { validated_on: "2026-06-16" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
