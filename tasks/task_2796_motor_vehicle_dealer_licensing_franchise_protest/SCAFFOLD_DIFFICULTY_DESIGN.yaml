  - rule_id: priority_pair_validation_conflict
    instances:
      - name: protest_on_effective_filing_state_beats_window_closed_temporal
        grounds:
          - validations.priority_9_ERR_INVALID_FILING_STATE
          - validations.priority_41_ERR_PROTEST_WINDOW_CLOSED
          - state_machines.FranchiseFiling.NOTICE_SERVED_to_EFFECTIVE
        distinguishing_aspect: |
          Category pair state (priority 9) vs business_temporal (priority 41). A protest against a
          filing that has already become EFFECTIVE violates both rules at once — the filing is in
          a state that admits no protest AND the 30-day window closed on 2026-10-10 — and the
          409 state error must win over the 422 temporal error. The OCC comparand is supplied
          correctly so the priority-8 version check cannot mask either rule.
        test_recipe:
          setup:
            - "Licensed, franchised incumbent Lakeside Aurora at site (0, 0)."
            - "ADDITIONAL_POINT filing at site (9, 12) noticed 2026-09-10 with proposed_effective_on 2026-11-15; protest_window_ends_on is 2026-10-10 and nobody protests."
