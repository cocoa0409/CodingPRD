        distinguishing_aspect: "Three identical in-window advances compete for a 10000-cent aggregate cap derived from G == 20000: the two oldest by funded_on take 5000 each and the newest is truncated to 0 — the earlier advance is never reduced to make room. The zero-take advance must keep months_recouped 0, so its own amortization horizon is not consumed by a month it did not participate in."
