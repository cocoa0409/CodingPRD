# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Art Gallery & Exhibition Sales (Expert)
# 9 rule_ids × 2 instances = 18 instances. Every grounds[] ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every call resolves to a §1.5 endpoint.
# Default clock = 2026-04-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: consignment_split_provisional_vs_final_on_sale
        grounds:
          - calculations.consignment_split
          - state_machines.Sale.RESERVED_to_INVOICED
          - state_machines.Sale.INVOICED_to_SETTLED
          - entities.Sale.fields.artist_share_cents
        distinguishing_aspect: |
          Provisional split ignores discount_bps (artist_share computed on undiscounted
          gross-net = 500000) while final split applies it (450000), so the SAME sale
          yields two different artist_share_cents values on the Sale entity domain.
        test_recipe:
          setup:
            - "Gallery in CA, sales_tax_rate_bps=875, default split 5000."
            - "ACTIVE artist with no override; one CONSIGNED artwork list_price 1000000."
            - "Sale created gross 1000000, discount_bps 1000 (10%), buyer CA, shipping 5000 -> RESERVED, provisional artist_share=500000; invoiced; paid in full; settled -> final artist_share=450000."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Blue Door", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Ada Vega" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Dawn", list_price_cents: 1000000, insured_value_cents: 1000000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Ben", buyer_state_code: "CA", gross_amount_cents: 1000000, discount_bps: 1000, shipping_cents: 5000 }
              as: SalesAssociate
              captures: { s: $.data.id, prov: $.data.artist_share_cents, total: $.data.buyer_total_cents, sv: $.data.version }
            - call: "POST /sales/${s}/invoice"
              payload: {}
              as: SalesAssociate
              captures: { sv2: $.data.version }
            - call: "POST /sales/${s}/payments"
              payload: { amount_cents: 983750, expected_sale_version: "${sv2}" }
              as: SalesAssociate
          trigger:
            - call: "POST /sales/${s}/settle"
              payload: {}
              as: SalesAssociate
              captures: { fin: $.data.artist_share_cents }
          assert:
            - "Sale.${s}.artist_share_cents == 500000 immediately after create (provisional)"
            - "Sale.${s}.artist_share_cents == 450000 after settle (final)"
            - "Sale.${s}.gallery_share_cents == 450000 after settle"

      - name: payout_approved_amount_clamp_vs_requested
        grounds:
          - calculations.artist_ledger
          - state_machines.Payout.PENDING_to_COMPLETED
          - entities.Payout.fields.approved_cents
        distinguishing_aspect: |
          Payout.approved_cents is min(requested, payable) computed on the Artist
          ledger domain (a different entity from Sale): requesting 300000 against a
          200000 payable yields approved_cents=200000, diverging from requested_cents.
        test_recipe:
          setup:
            - "Gallery CA; artist with one SETTLED sale accruing 200000 (gross 400000, buyer NY tax-exempt, split 5000)."
            - "Artist.ledger_payable_cents == 200000."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Net Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Cy Lin" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Tide", list_price_cents: 400000, insured_value_cents: 400000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Out NY", buyer_state_code: "NY", gross_amount_cents: 400000 }
              as: SalesAssociate
              captures: { s: $.data.id }
            - call: "POST /sales/${s}/invoice"
              payload: {}
              as: SalesAssociate
              captures: { sv: $.data.version }
            - call: "POST /sales/${s}/payments"
              payload: { amount_cents: 400000, expected_sale_version: "${sv}" }
              as: SalesAssociate
            - call: "POST /sales/${s}/settle"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /payouts"
              payload: { artist_id: "${a}", requested_cents: 300000 }
              as: GalleryAdmin
              captures: { p: $.data.id, ap: $.data.approved_cents }
          assert:
            - "Payout.${p}.approved_cents == 200000"
            - "Payout.${p}.requested_cents == 300000"
            - "Artist.${a}.ledger_payable_cents == 200000 before payout complete"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tax_on_net_then_add_shipping_rounding_order
        grounds:
          - calculations.sale_money_breakdown
          - entities.Sale.fields.tax_amount_cents
          - entities.Sale.fields.buyer_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding order: net is rounded after discount, THEN tax is
          rounded on net (not on gross), THEN untaxed shipping is added. With gross
          1000000, 10% discount, 8.75% rate, shipping 5000 the pinned order yields
          net 900000, tax 78750, buyer_total 983750.
        test_recipe:
          setup:
            - "Gallery CA, rate 875; artwork; sale gross 1000000 discount 1000 shipping 5000 buyer CA."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Order Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Mo Day" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Wave", list_price_cents: 1000000, insured_value_cents: 1000000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
          trigger:
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Tee", buyer_state_code: "CA", gross_amount_cents: 1000000, discount_bps: 1000, shipping_cents: 5000 }
              as: SalesAssociate
              captures: { s: $.data.id }
          assert:
            - "Sale.${s}.net_amount_cents == 900000"
            - "Sale.${s}.tax_amount_cents == 78750"
            - "Sale.${s}.buyer_total_cents == 983750"

      - name: installment_remainder_loaded_on_final
        grounds:
          - calculations.installment_schedule
          - entities.PaymentPlan.fields.installment_cents
          - entities.PaymentPlan.fields.final_installment_cents
        distinguishing_aspect: |
          Mode (a) ≥3-input non-linear allocation with floor + remainder: buyer_total
          983750 over 3 installments yields installment_cents=327916 for #1,#2 and
          final_installment_cents=327918 carrying the +2 remainder, not an even split.
        test_recipe:
          setup:
            - "Sale invoiced with buyer_total 983750 (gross 1000000, discount 1000, shipping 5000, buyer CA, rate 875)."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Plan Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Ru Sum" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Crest", list_price_cents: 1000000, insured_value_cents: 1000000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Ivy", buyer_state_code: "CA", gross_amount_cents: 1000000, discount_bps: 1000, shipping_cents: 5000 }
              as: SalesAssociate
              captures: { s: $.data.id }
            - call: "POST /sales/${s}/invoice"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /payment-plans"
              payload: { sale_id: "${s}", installment_count: 3, cadence_days: 30, first_due_utc: "2026-05-01T00:00:00Z" }
              as: SalesAssociate
              captures: { pl: $.data.id }
          assert:
            - "PaymentPlan.${pl}.installment_cents == 327916"
            - "PaymentPlan.${pl}.final_installment_cents == 327918"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: sale_parallel_settlement_and_shipping_dimensions
        grounds:
          - state_machines.Sale.PENDING_to_SHIPPED
          - state_machines.Sale.RESERVED_to_INVOICED
          - entities.Sale.fields.settlement_status
          - entities.Sale.fields.shipping_status
        distinguishing_aspect: |
          Sale carries two independent state axes: shipping_status advances PENDING->SHIPPED
          while settlement_status is still RESERVED/INVOICED, proving parallel dimensions
          on one entity (Sale) evolve independently.
        test_recipe:
          setup:
            - "Sale RESERVED, shipping PENDING."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Par Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Px Two" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Split", list_price_cents: 200000, insured_value_cents: 200000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Zo", buyer_state_code: "NY", gross_amount_cents: 200000 }
              as: SalesAssociate
              captures: { s: $.data.id }
          trigger:
            - call: "POST /sales/${s}/ship"
              payload: {}
              as: SalesAssociate
              captures: { ss: $.data.shipping_status, set: $.data.settlement_status }
          assert:
            - "Sale.${s}.shipping_status == SHIPPED"
            - "Sale.${s}.settlement_status == RESERVED"

      - name: artwork_cyclic_reserved_back_to_consigned_on_void
        grounds:
          - state_machines.Artwork.CONSIGNED_to_RESERVED
          - state_machines.Artwork.RESERVED_to_CONSIGNED
          - entities.Artwork.fields.status
        distinguishing_aspect: |
          Artwork lifecycle is cyclic on a different entity than Sale: CONSIGNED->RESERVED
          (sale create) then RESERVED->CONSIGNED (sale void) returns the artwork to its
          prior state, a loop A->B->A.
        test_recipe:
          setup:
            - "Artwork CONSIGNED; a RESERVED sale against it."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Cyc Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Lo Op" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Round", list_price_cents: 300000, insured_value_cents: 300000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Ne", buyer_state_code: "NY", gross_amount_cents: 300000 }
              as: SalesAssociate
              captures: { s: $.data.id }
          trigger:
            - call: "POST /sales/${s}/void"
              payload: {}
              as: SalesAssociate
            - call: "GET /artworks/${aw}"
              payload: {}
              as: SalesAssociate
              captures: { st: $.data.status }
          assert:
            - "Artwork.${aw}.status == CONSIGNED after void"
            - "Sale.${s}.settlement_status == VOID"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: settle_cascade_artwork_slot_ledger_depth3
        grounds:
          - state_machines.Sale.INVOICED_to_SETTLED
          - state_machines.Artwork.RESERVED_to_SOLD
          - calculations.artist_ledger
          - entities.WallSlot.fields.status
        distinguishing_aspect: |
          Depth-3 chain: settle mutates Sale->SETTLED (hop1), which drives Artwork
          RESERVED->SOLD (hop2 caused by hop1), which releases the artwork's PLACED
          WallSlot and accrues the artist ledger (hop3 caused by hop2). Each link is
          caused by the previous, not the original settle call.
        test_recipe:
          setup:
            - "Exhibition PLANNED capacity 2; artwork placed on a wall slot; sale RESERVED then invoiced then paid in full; artwork RESERVED."
            - "Artist ledger_payable 0 before settle."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Casc Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Ca Three" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Hop", list_price_cents: 400000, insured_value_cents: 400000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /exhibitions"
              payload: { gallery_id: "${g}", title: "Show A", wall_capacity: 2, opens_utc: "2026-04-10T00:00:00Z", closes_utc: "2026-05-10T00:00:00Z" }
              as: GalleryAdmin
              captures: { ex: $.data.id, exv: $.data.version }
            - call: "POST /exhibitions/${ex}/wall-slots"
              payload: { artwork_id: "${aw}", wall_label: "N-1", position_index: 0, expected_exhibition_version: "${exv}" }
              as: Registrar
              captures: { ws: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Pa", buyer_state_code: "NY", gross_amount_cents: 400000, exhibition_id: "${ex}" }
              as: SalesAssociate
              captures: { s: $.data.id }
            - call: "POST /sales/${s}/invoice"
              payload: {}
              as: SalesAssociate
              captures: { sv: $.data.version }
            - call: "POST /sales/${s}/payments"
              payload: { amount_cents: 400000, expected_sale_version: "${sv}" }
              as: SalesAssociate
          trigger:
            - call: "POST /sales/${s}/settle"
              payload: {}
              as: SalesAssociate
            - call: "GET /wall-slots/${ws}"
              payload: {}
              as: GalleryAdmin
              captures: { wst: $.data.status }
          assert:
            - "Artwork.${aw}.status == SOLD"
            - "WallSlot.${ws}.status == RELEASED"
            - "Artist.${a}.ledger_accrued_cents == 200000"

      - name: exhibition_cancel_cascade_event_rsvp_depth3
        grounds:
          - state_machines.Exhibition.PLANNED_to_CANCELLED
          - state_machines.OpeningEvent.SCHEDULED_to_CANCELLED
          - state_machines.Rsvp.CONFIRMED_to_CANCELLED
          - entities.Rsvp.fields.status
        distinguishing_aspect: |
          Different trigger (exhibition cancel) drives a depth-3 chain: Exhibition->CANCELLED
          (hop1) cancels its SCHEDULED OpeningEvent (hop2 caused by hop1) which cancels that
          event's CONFIRMED Rsvp (hop3 caused by hop2).
        test_recipe:
          setup:
            - "Exhibition PLANNED with one SCHEDULED opening event holding one CONFIRMED RSVP."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Cx Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /exhibitions"
              payload: { gallery_id: "${g}", title: "Show B", wall_capacity: 3, opens_utc: "2026-05-01T00:00:00Z", closes_utc: "2026-06-01T00:00:00Z" }
              as: GalleryAdmin
              captures: { ex: $.data.id }
            - call: "POST /opening-events"
              payload: { exhibition_id: "${ex}", capacity: 10, starts_utc: "2026-05-01T18:00:00Z", rsvp_deadline_utc: "2026-04-30T00:00:00Z" }
              as: GalleryAdmin
              captures: { ev: $.data.id }
            - call: "POST /rsvps"
              payload: { opening_event_id: "${ev}", guest_name: "Vi", party_size: 2 }
              as: SalesAssociate
              captures: { rs: $.data.id }
          trigger:
            - call: "POST /exhibitions/${ex}/cancel"
              payload: {}
              as: GalleryAdmin
            - call: "GET /rsvps/${rs}"
              payload: {}
              as: GalleryAdmin
              captures: { rst: $.data.status }
          assert:
            - "Exhibition.${ex}.status == CANCELLED"
            - "OpeningEvent.${ev}.status == CANCELLED"
            - "Rsvp.${rs}.status == CANCELLED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: not_found_beats_invalid_state_on_settle
        grounds:
          - validations[priority=3]
          - validations[priority=5]
        distinguishing_aspect: |
          Error-category pair existence(priority 3) vs state(priority 5): settling a
          non-existent sale returns ERR_NOT_FOUND, never ERR_INVALID_STATE, even though
          the operation is also state-invalid.
        test_recipe:
          setup:
            - "Gallery exists; no sale with the probed id."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Pv1 Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "POST /sales/00000000-0000-4000-8000-000000000000/settle"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: coverage_safety_beats_schedule_overlap_on_loan
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - calculations.loan_coverage_gap
        distinguishing_aspect: |
          Error-category pair business_safety(priority 8, coverage) vs business_temporal
          (priority 9, schedule overlap): a loan that is BOTH under-covered AND overlapping
          an existing loan returns ERR_INSUFFICIENT_COVERAGE (safety wins), not ERR_SCHEDULE_CONFLICT.
        test_recipe:
          setup:
            - "Artwork insured 1000000 already OUT on an OUTSTANDING loan [2026-04-05,2026-05-05). New loan window overlaps AND coverage 500000 < 1000000."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Pv2 Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Lc One" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Lend", list_price_cents: 1000000, insured_value_cents: 1000000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /loans"
              payload: { artwork_id: "${aw}", borrower_name: "MoMA", coverage_value_cents: 1000000, out_utc: "2026-04-05T00:00:00Z", due_utc: "2026-05-05T00:00:00Z" }
              as: Registrar
              captures: { l1: $.data.id }
            - call: "POST /loans/${l1}/return"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /loans"
              payload: { artwork_id: "${aw}", borrower_name: "Tate", coverage_value_cents: 500000, out_utc: "2026-04-20T00:00:00Z", due_utc: "2026-05-20T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_COVERAGE"
            - "http status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: loan_coverage_equal_passes_strict_less_rejects
        grounds:
          - calculations.loan_coverage_gap
          - validations[priority=8]
          - entities.Artwork.fields.insured_value_cents
        distinguishing_aspect: |
          Numeric >= boundary on coverage via POST /loans: coverage 1000000 == insured
          1000000 is accepted (OUTSTANDING created); coverage 999999 (one cent less) is
          rejected ERR_INSUFFICIENT_COVERAGE.
        test_recipe:
          setup:
            - "Two artworks each insured 1000000, both CONSIGNED."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Bp1 Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Bd One" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Eq", list_price_cents: 1000000, insured_value_cents: 1000000 }
              as: GalleryAdmin
              captures: { aw1: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Lt", list_price_cents: 1000000, insured_value_cents: 1000000 }
              as: GalleryAdmin
              captures: { aw2: $.data.id }
            - call: "POST /loans"
              payload: { artwork_id: "${aw1}", borrower_name: "Eq Borrow", coverage_value_cents: 1000000, out_utc: "2026-04-05T00:00:00Z", due_utc: "2026-05-05T00:00:00Z" }
              as: Registrar
              captures: { lok: $.data.id, lst: $.data.status }
          trigger:
            - call: "POST /loans"
              payload: { artwork_id: "${aw2}", borrower_name: "Lt Borrow", coverage_value_cents: 999999, out_utc: "2026-04-05T00:00:00Z", due_utc: "2026-05-05T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "Loan.${lok}.status == OUTSTANDING (equal coverage accepted)"
            - "trigger response error_id == ERR_INSUFFICIENT_COVERAGE"

      - name: exhibition_open_requires_at_least_one_slot_empty_set
        grounds:
          - state_machines.Exhibition.PLANNED_to_OPEN
          - entities.Exhibition.fields.slots_occupied
        distinguishing_aspect: |
          Empty-collection boundary on a different endpoint (POST /exhibitions/{id}/open):
          opening with slots_occupied==0 is rejected ERR_INVALID_STATE; after one PLACED
          slot (slots_occupied==1) at/after opens_utc the open succeeds.
        test_recipe:
          setup:
            - "Exhibition PLANNED capacity 2 with zero placements; clock at 2026-04-15 (>= opens 2026-04-10)."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Bp2 Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Em Set" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Solo", list_price_cents: 100000, insured_value_cents: 100000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /exhibitions"
              payload: { gallery_id: "${g}", title: "Empty Show", wall_capacity: 2, opens_utc: "2026-04-10T00:00:00Z", closes_utc: "2026-05-10T00:00:00Z" }
              as: GalleryAdmin
              captures: { ex: $.data.id, exv: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: GalleryAdmin
          trigger:
            - call: "POST /exhibitions/${ex}/open"
              payload: {}
              as: GalleryAdmin
              captures: { err: $.data.error_id }
            - call: "POST /exhibitions/${ex}/wall-slots"
              payload: { artwork_id: "${aw}", wall_label: "S-1", position_index: 0, expected_exhibition_version: "${exv}" }
              as: GalleryAdmin
              captures: { ws: $.data.id }
            - call: "POST /exhibitions/${ex}/open"
              payload: {}
              as: GalleryAdmin
              captures: { st: $.data.status }
          assert:
            - "first open response error_id == ERR_INVALID_STATE (slots_occupied==0)"
            - "Exhibition.${ex}.status == OPEN after one slot placed"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: artwork_consign_blocked_by_suspended_artist
        grounds:
          - state_machines.Artist.ACTIVE_to_SUSPENDED
          - validations[priority=7]
          - entities.Artist.fields.status
        distinguishing_aspect: |
          Entity pair Artwork->Artist: consigning a new Artwork is rejected
          ERR_ARTIST_SUSPENDED when the referenced Artist.status == SUSPENDED; the
          artwork transition depends on a different entity's state.
        test_recipe:
          setup:
            - "Artist SUSPENDED."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Cs1 Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Su End" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artists/${a}/suspend"
              payload: {}
              as: GalleryAdmin
          trigger:
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Blocked", list_price_cents: 100000, insured_value_cents: 100000 }
              as: GalleryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ARTIST_SUSPENDED"
            - "http status == 409"

      - name: lease_convert_blocked_when_artwork_not_on_loan
        grounds:
          - state_machines.LeaseAgreement.ACTIVE_to_CONVERTED
          - entities.Artwork.fields.status
        distinguishing_aspect: |
          Different entity pair Lease->Artwork: lease convert requires the linked
          Artwork.status == ON_LOAN; after the lease is RETURNED (artwork CONSIGNED),
          convert is rejected ERR_LEASE_ARTWORK_NOT_OUT.
        test_recipe:
          setup:
            - "Lease ACTIVE then RETURNED so artwork is CONSIGNED, lease no longer ACTIVE — re-create one ACTIVE lease then return it leaves artwork CONSIGNED; use the returned lease for convert."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Cs2 Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Le Ase" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Leased", list_price_cents: 500000, insured_value_cents: 500000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /leases"
              payload: { artwork_id: "${aw}", lessee_name: "Firm", monthly_rate_cents: 50000, term_months: 12, starts_utc: "2026-04-01T00:00:00Z", purchase_credit_bps: 2000 }
              as: SalesAssociate
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/return"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /leases/${ls}/convert"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (lease no longer ACTIVE)"
            - "Artwork.${aw}.status == CONSIGNED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: loan_window_half_open_overlap_same_artwork
        grounds:
          - validations[priority=9]
          - entities.Loan.fields.out_utc
          - entities.Loan.fields.due_utc
        distinguishing_aspect: |
          Loan interval semantics are half-open [out_utc, due_utc) against the artwork's
          full loan-history calendar (returned loans still reserve their slot): a new loan
          starting strictly before the prior loan's due_utc overlaps (ERR_SCHEDULE_CONFLICT)
          even though the prior loan is RETURNED and the artwork is CONSIGNED again — the
          half-open upper bound means starting exactly at the prior due_utc would be allowed.
        test_recipe:
          setup:
            - "Artwork with a RETURNED loan whose recorded window is [2026-04-05,2026-05-05); artwork now CONSIGNED."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Ov1 Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Tm One" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Tour", list_price_cents: 200000, insured_value_cents: 200000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /loans"
              payload: { artwork_id: "${aw}", borrower_name: "B1", coverage_value_cents: 200000, out_utc: "2026-04-05T00:00:00Z", due_utc: "2026-05-05T00:00:00Z" }
              as: Registrar
              captures: { l1: $.data.id }
            - call: "POST /loans/${l1}/return"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /loans"
              payload: { artwork_id: "${aw}", borrower_name: "B2", coverage_value_cents: 200000, out_utc: "2026-04-20T00:00:00Z", due_utc: "2026-05-20T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_SCHEDULE_CONFLICT (out 04-20 < prior due 05-05, calendar slot still reserved)"
            - "http status == 409"

      - name: exhibition_run_window_overlap_for_shared_artwork
        grounds:
          - validations[priority=9]
          - entities.Exhibition.fields.opens_utc
          - entities.Exhibition.fields.closes_utc
          - entities.WallSlot.fields.exhibition_id
        distinguishing_aspect: |
          Different resource (Exhibition) and different interval arithmetic: placing the
          SAME artwork on a wall slot of a second exhibition whose [opens,closes) run
          window overlaps an exhibition already PLACING that artwork is rejected
          ERR_SCHEDULE_CONFLICT — the conflict is on overlapping show windows, not loan windows.
        test_recipe:
          setup:
            - "Artwork placed in Exhibition X [2026-04-10,2026-05-10); a second Exhibition Y [2026-05-01,2026-06-01) overlaps X."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Ov2 Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Tm Two" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Shared", list_price_cents: 300000, insured_value_cents: 300000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /exhibitions"
              payload: { gallery_id: "${g}", title: "X", wall_capacity: 3, opens_utc: "2026-04-10T00:00:00Z", closes_utc: "2026-05-10T00:00:00Z" }
              as: GalleryAdmin
              captures: { exx: $.data.id, exxv: $.data.version }
            - call: "POST /exhibitions/${exx}/wall-slots"
              payload: { artwork_id: "${aw}", wall_label: "X-1", position_index: 0, expected_exhibition_version: "${exxv}" }
              as: Registrar
              captures: { wsx: $.data.id }
            - call: "POST /exhibitions"
              payload: { gallery_id: "${g}", title: "Y", wall_capacity: 3, opens_utc: "2026-05-01T00:00:00Z", closes_utc: "2026-06-01T00:00:00Z" }
              as: GalleryAdmin
              captures: { exy: $.data.id, exyv: $.data.version }
          trigger:
            - call: "POST /exhibitions/${exy}/wall-slots"
              payload: { artwork_id: "${aw}", wall_label: "Y-1", position_index: 0, expected_exhibition_version: "${exyv}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_SCHEDULE_CONFLICT (Y window overlaps X for same artwork)"
            - "http status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payout_complete_then_reverse_conserves_ledger
        grounds:
          - state_machines.Payout.PENDING_to_COMPLETED
          - state_machines.Payout.COMPLETED_to_REVERSED
          - calculations.artist_ledger
        distinguishing_aspect: |
          Conserved quantity = Artist ledger identity (accrued == paid + payable). Complete
          then reverse a 150000 payout leaves ledger_paid back at 0 and ledger_payable back
          at 200000, with accrued unchanged at 200000 — no drift in the money ledger.
        test_recipe:
          setup:
            - "Artist with accrued 200000 (one SETTLED tax-exempt sale of 400000, split 5000); ledger_paid 0, payable 200000."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Cmp1 Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Cv One" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Paid", list_price_cents: 400000, insured_value_cents: 400000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "NYbuy", buyer_state_code: "NY", gross_amount_cents: 400000 }
              as: SalesAssociate
              captures: { s: $.data.id }
            - call: "POST /sales/${s}/invoice"
              payload: {}
              as: SalesAssociate
              captures: { sv: $.data.version }
            - call: "POST /sales/${s}/payments"
              payload: { amount_cents: 400000, expected_sale_version: "${sv}" }
              as: SalesAssociate
            - call: "POST /sales/${s}/settle"
              payload: {}
              as: SalesAssociate
            - call: "POST /payouts"
              payload: { artist_id: "${a}", requested_cents: 150000 }
              as: GalleryAdmin
              captures: { p: $.data.id }
            - call: "POST /payouts/${p}/complete"
              payload: {}
              as: GalleryAdmin
          trigger:
            - call: "POST /payouts/${p}/reverse"
              payload: {}
              as: GalleryAdmin
            - call: "GET /artists/${a}"
              payload: {}
              as: GalleryAdmin
              captures: { paid: $.data.ledger_paid_cents, payable: $.data.ledger_payable_cents, accrued: $.data.ledger_accrued_cents }
          assert:
            - "Artist.${a}.ledger_paid_cents == 0 after reverse"
            - "Artist.${a}.ledger_payable_cents == 200000 after reverse"
            - "Artist.${a}.ledger_accrued_cents == 200000 (unchanged; accrued == paid + payable)"

      - name: sale_void_conserves_wall_slot_occupancy
        grounds:
          - state_machines.Sale.RESERVED_to_INVOICED
          - state_machines.Sale.PARTIALLY_PAID_to_VOID
          - state_machines.Artwork.RESERVED_to_CONSIGNED
          - entities.Exhibition.fields.slots_occupied
        distinguishing_aspect: |
          Different conserved quantity = Exhibition wall-slot occupancy (slots_occupied +
          slots_available == wall_capacity). Placing then selling (slot stays PLACED) then
          voiding releases the slot, returning slots_occupied to 0 and slots_available to
          wall_capacity — occupancy conserved, no phantom-held slot.
        test_recipe:
          setup:
            - "Exhibition capacity 2 with one PLACED slot (occupied 1); a RESERVED sale (artwork RESERVED, slot still PLACED while reserved)."
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Cmp2 Gallery", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Cv Two" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "OnWall", list_price_cents: 300000, insured_value_cents: 300000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /exhibitions"
              payload: { gallery_id: "${g}", title: "Hold Show", wall_capacity: 2, opens_utc: "2026-04-10T00:00:00Z", closes_utc: "2026-05-10T00:00:00Z" }
              as: GalleryAdmin
              captures: { ex: $.data.id, exv: $.data.version }
            - call: "POST /exhibitions/${ex}/wall-slots"
              payload: { artwork_id: "${aw}", wall_label: "W-1", position_index: 0, expected_exhibition_version: "${exv}" }
              as: Registrar
              captures: { ws: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Hb", buyer_state_code: "NY", gross_amount_cents: 300000, exhibition_id: "${ex}" }
              as: SalesAssociate
              captures: { s: $.data.id }
          trigger:
            - call: "POST /sales/${s}/void"
              payload: {}
              as: SalesAssociate
            - call: "GET /exhibitions/${ex}"
              payload: {}
              as: GalleryAdmin
              captures: { occ: $.data.slots_occupied, avail: $.data.slots_available }
          assert:
            - "Exhibition.${ex}.slots_occupied == 0 after void"
            - "Exhibition.${ex}.slots_available == 2 after void"
            - "Artwork.${aw}.status == CONSIGNED after void"
