            - call: "POST /verification-cycles/${cyc}/deficiencies"
              payload: { criterion_code: "CD-09-01", deficiency_class: "TYPE_II_MAJOR", remediation_due_at: "2026-09-30T00:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
            - call: "POST /verification-cycles/${cyc}/deficiencies"
              payload: { criterion_code: "CD-09-02", deficiency_class: "TYPE_II_MAJOR", remediation_due_at: "2026-09-30T00:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
          trigger:
            - call: "POST /verification-cycles/${cyc}/submit"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
          assert:
            - "HTTP status is 200 and VerificationCycle.${cyc}.status == SUBMITTED"
            - "VerificationCycle.${cyc}.readiness_score == 70.00 exactly"
            - "VerificationCycle.${cyc}.open_type_ii_count == 2 and open_type_i_count == 0"
            - "TraumaCenter.${c1}.readiness_posture == READY"
      - name: triage_rates_on_empty_case_cohort_return_zero
        grounds:
          - calculations.under_over_triage_rates
          - entities.TraumaCenter.fields.under_triage_rate_pct
          - endpoints[GET /trauma-centers/{id}/triage-rates]
          - calculations.readiness_posture
        distinguishing_aspect: |
          With no registry cases the denominator is 0, so both variants return 0.00 rather than raising
          a division error, and the 5.00 under-triage alert threshold is not crossed — the empty
          collection is a legal boundary, not an error path.
        test_recipe:
          setup:
            - "one trauma center registered seconds ago with no activation tiers, no cases and no cycles"
            - "the clock stands at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Wind Gap Trauma", state_code: "PA", designation_level: "LEVEL_III", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
          trigger:
            - call: "GET /trauma-centers/${c1}/triage-rates"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
            - call: "GET /trauma-centers/${c1}/triage-rates"
              payload: { variant: "VERIFICATION_AUDIT" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
          assert:
            - "the default read returns denominator_case_count == 0, under_triage_numerator == 0, over_triage_numerator == 0, under_triage_rate_pct == 0.00 and over_triage_rate_pct == 0.00"
            - "the VERIFICATION_AUDIT read returns the same zeros with variant == VERIFICATION_AUDIT"
            - "TraumaCenter.${c1}.under_triage_rate_pct == 0.00, registry_included_case_count == 0 and registry_excluded_case_count == 0"
            - "TraumaCenter.${c1}.readiness_posture == READY and open_pi_event_count == 0"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_lock_requires_child_abstraction_in_validated_state
        grounds:
          - validations[priority=54]
          - errors[ERR_ABSTRACTION_NOT_VALIDATED]
          - state_machines.RegistryCase.VALIDATED_to_LOCKED
          - state_machines.AbstractionRecord.SUBMITTED_to_VALIDATED
        distinguishing_aspect: |
          The lock is refused purely because of the *child* AbstractionRecord's state: the case itself
          is ABSTRACTED and otherwise lockable, and the identical request succeeds once a different user
          validates the child record — the parent operation is gated by another entity's state, not by
          any field of its own payload.
        test_recipe:
          setup:
            - "one trauma center with a TIER_1_FULL tier and posture READY"
            - "one INCLUDED case with a single AbstractionRecord still in validation_status SUBMITTED"
            - "the abstraction was submitted by u_abstractor_1, so u_validator_1 may validate it later"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
