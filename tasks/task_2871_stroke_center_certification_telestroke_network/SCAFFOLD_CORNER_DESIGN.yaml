          oc_st2: $.data.status
      - call: POST /stroke-network/consults
        payload:
          case_id: ${oc_id}
          agreement_id: ${agr_id}
          requested_privilege_scope: CONSULT_AND_THROMBOLYSIS
          expected_case_version: ${oc_v1}
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          occ2_id: $.data.error_id
          occ2_msg: $.data.message
      - call: GET /stroke-network/code-strokes/${oc_id}
        as: EdPhysician
        captures:
          oc_v3: $.data.version
      - call: GET /stroke-network/neurologists/${n1_id}
        as: ProgramCoordinator
        captures:
          oc_n_active: $.data.active_consult_count
      - call: GET /stroke-network/consults?case_id=${oc_id}&limit=10&offset=0
        payload:
          case_id: ${oc_id}
          limit: 10
          offset: 0
        as: ProgramCoordinator
        captures:
          oc_only: $.data[0].id
      assert:
      - ${oc_v0} == 1 is the version the create returned; imaging-complete already moved the case, so ${occ1_id} == ERR_STALE_CASE_VERSION with HTTP 412
      - 'the 412 changed nothing: ${oc_st1} == IMAGING_COMPLETE, ${oc_v1} == 2 == ${oc_v0} + 1, and the consult list for the case has total_count 0'
      - 'the same body with ${oc_v1} succeeds: ${oc_k1_st} == ASSIGNED with ${oc_k1_n} == ${n1_id}'
      - 'the success cascaded a case bump: ${oc_st2} == CONSULT_IN_PROGRESS and ${oc_v2} == 3 == ${oc_v1} + 1'
      - '${occ2_id} == ERR_STALE_CASE_VERSION: the version that worked one call ago is now stale, so the check compares against the CURRENT row and not against any request history'
      - 'the second 412 is inert too: ${oc_v3} == ${oc_v2} == 3, ${oc_n_active} == 1 (not 2), and the case still has exactly one consult with total_count 1 and ${oc_only} == ${oc_k1}'
      - 412 is used for both refusals — never 409 and never 422
