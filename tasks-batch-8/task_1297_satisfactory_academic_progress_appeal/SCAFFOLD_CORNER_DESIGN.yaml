      - name: pace_two_thirds_fails_below_threshold
        claim_type: correct_result
        grounds: ['calculations.pace_calculation']
        distinguishing_aspect: "2/3 rounds to 66.67 under round_half_up(2dp) and FAILS — the repeating decimal must not round up to the 67.00 threshold."
        test_recipe:
          setup: ["Program required_credits=120; T1; student attempted 3 earned 2 QP 8.0 gh 3 (gpa 2.667 passes); grading closed"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-23", name: "TwoThirds", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
