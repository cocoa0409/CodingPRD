scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: create_project_applies_default_warranty_days
        claim_type: defaults
        grounds: [entities.RepairProject.fields.warranty_days, entities.RepairProject.fields.required_survey_types]
        distinguishing_aspect: "Omitting warranty_days and required_survey_types on project creation yields the defaults 90 and [] (the survey gate is then vacuously satisfied at completion)."
        test_recipe:
          setup: ["one dock and one vessel exist"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
          trigger:
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_wd: $.data.warranty_days, p_v: $.data.version }
          assert:
            - "captured p_wd == 90 (default applied)"
            - "captured p_v == 1"
      - name: create_project_system_fields_server_generated
        claim_type: system_fields
        grounds: [entities.RepairProject]
        distinguishing_aspect: "Server-minted id, created_at stamped from the logical clock default 2026-08-01T00:00:00Z, version 1; client-supplied computed fields are ignored (bid_total_cents initializes to 0 with no items)."
        test_recipe:
          setup: ["one dock and one vessel exist"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
          trigger:
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version, p_created: $.data.created_at, p_bid: $.data.bid_total_cents, p_status: $.data.status }
          assert:
            - "captured p_v == 1 and p_status == DRAFT (initial state)"
            - "captured p_created == 2026-08-01T00:00:00Z (logical clock default, never wall-clock)"
            - "captured p_bid == 0 (computed field initialised by the system, not the client)"
      - name: create_project_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.RepairProject.fields.contract_delivery_date, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required contract_delivery_date yields ERR_INVALID_REQUEST (400) before any existence or state check."
        test_recipe:
          setup: ["one dock and one vessel exist"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
          trigger:
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_REQUEST"
      - name: get_project_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/repair-projects/00000000-0000-4000-8000-000000000000"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_NOT_FOUND"
      - name: create_work_item_with_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.WorkItem.fields.pricing_mode, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "pricing_mode outside {LUMP_SUM, TIME_AND_MATERIALS} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["DRAFT project exists"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Mystery line", trade_code: "PIPING", pricing_mode: "COST_PLUS", duration_days: 2, quantity: 1, unit_price_cents: 100 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_REQUEST"
      - name: computed_line_total_input_ignored
        claim_type: computed_fields
        grounds: [entities.WorkItem.fields.line_total_cents]
        distinguishing_aspect: "Client-supplied line_total_cents on creation is ignored; the server recomputes 2 x 500000 = 1000000."
        test_recipe:
          setup: ["DRAFT project exists"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Pipe renewal", trade_code: "PIPING", pricing_mode: "LUMP_SUM", duration_days: 2, quantity: 2, unit_price_cents: 500000, line_total_cents: 1 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { lt: $.data.line_total_cents }
          assert:
            - "captured lt == 1000000 (server-computed; the supplied 1 was ignored)"
      - name: list_work_items_paginates_with_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /v1/work-items with limit=2 over 3 items returns exactly 2 rows plus total_count 3 and has_more true; offset=2 returns the third row with has_more false."
        test_recipe:
          setup: ["DRAFT project with three work items"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Line 1", trade_code: "PIPING", pricing_mode: "LUMP_SUM", duration_days: 1, quantity: 1, unit_price_cents: 100 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Line 2", trade_code: "PIPING", pricing_mode: "LUMP_SUM", duration_days: 1, quantity: 1, unit_price_cents: 100 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Line 3", trade_code: "PIPING", pricing_mode: "LUMP_SUM", duration_days: 1, quantity: 1, unit_price_cents: 100 }
              as: ProjectManager
              as_user_id: "pm_1"
          trigger:
            - call: "GET /v1/work-items"
              payload: { project_id: "${p_id}", limit: 2, offset: 0 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "GET /v1/work-items"
              payload: { project_id: "${p_id}", limit: 2, offset: 2 }
              as: ProjectManager
              as_user_id: "pm_1"
          assert:
            - "first page returns 2 data rows with total_count == 3 and has_more == true"
            - "second page (offset 2) returns 1 data row with total_count == 3 and has_more == false"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: deliver_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RepairProject, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "deliver is defined only from WORK_COMPLETE; from DRAFT it is rejected with ERR_INVALID_STATE and no LD fields are set."
        test_recipe:
          setup: ["DRAFT project exists"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/repair-projects/${p_id}/deliver"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE"
      - name: award_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RepairProject.BID_SUBMITTED_to_CONTRACTED]
        distinguishing_aspect: "award requires BID_SUBMITTED; from DRAFT it fails with ERR_INVALID_STATE (bid phase may not be skipped)."
        test_recipe:
          setup: ["DRAFT project with one work item exists (never submitted)"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Line 1", trade_code: "PIPING", pricing_mode: "LUMP_SUM", duration_days: 1, quantity: 1, unit_price_cents: 100 }
              as: ProjectManager
              as_user_id: "pm_1"
          trigger:
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE"
      - name: cancel_complete_work_item_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.WorkItem]
        distinguishing_aspect: "COMPLETE is terminal for cancellation; cancelling a completed item fails with ERR_INVALID_STATE (cancel is defined only from PLANNED)."
        test_recipe:
          setup: ["IN_DOCK project with one COMPLETE work item (project auto-advanced to WORK_COMPLETE)"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Line 1", trade_code: "PIPING", pricing_mode: "LUMP_SUM", duration_days: 1, quantity: 1, unit_price_cents: 100 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { w_id: $.data.id }
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items/${w_id}/start"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items/${w_id}/complete"
              as: ProjectManager
              as_user_id: "pm_1"
          trigger:
            - call: "POST /v1/work-items/${w_id}/cancel"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE"
      - name: activate_before_window_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.DockReservation.BOOKED_to_ACTIVE]
        distinguishing_aspect: "Activation requires the logical clock inside [start_utc, end_utc); with the clock at the default 2026-08-01T00:00:00Z and a window starting 2026-08-05, activate fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["CONTRACTED project with a BOOKED reservation for 2026-08-05 -> 2026-08-20; logical clock still at the 2026-08-01 default"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-09-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Line 1", trade_code: "PIPING", pricing_mode: "LUMP_SUM", duration_days: 1, quantity: 1, unit_price_cents: 100 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-05T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE (clock 2026-08-01T00:00:00Z < start 2026-08-05T00:00:00Z)"
      - name: reservation_activate_docks_project
        claim_type: side_effect_execution
        grounds: [state_machines.DockReservation.BOOKED_to_ACTIVE, state_machines.RepairProject.CONTRACTED_to_IN_DOCK]
        distinguishing_aspect: "A successful activate flips the reservation to ACTIVE AND mutates the parent project to IN_DOCK with actual_dock_in_utc stamped at the logical clock — a cross-entity side effect, not two independent writes."
        test_recipe:
          setup: ["CONTRACTED project with BOOKED reservation 2026-08-01 -> 2026-08-20; clock at default"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Line 1", trade_code: "PIPING", pricing_mode: "LUMP_SUM", duration_days: 1, quantity: 1, unit_price_cents: 100 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_status: $.data.status, r_activated: $.data.activated_at_utc }
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_status: $.data.status, p_dockin: $.data.actual_dock_in_utc }
          assert:
            - "captured r_status == ACTIVE and r_activated == 2026-08-01T00:00:00Z"
            - "captured p_status == IN_DOCK and p_dockin == 2026-08-01T00:00:00Z"
      - name: permit_expiry_sweep_on_clock_set
        claim_type: valid_transition
        grounds: [state_machines.Permit.GRANTED_to_EXPIRED]
        distinguishing_aspect: "The system sweep inside set_current_utc flips a GRANTED permit to EXPIRED once the clock passes valid_to; no explicit permit call is involved."
        test_recipe:
          setup: ["GRANTED HOT_WORK permit valid 2026-08-01T00:00:00Z -> 2026-08-10T23:59:59Z on a DRAFT project"]
          setup_api_calls:
            - call: "POST /v1/docks"
