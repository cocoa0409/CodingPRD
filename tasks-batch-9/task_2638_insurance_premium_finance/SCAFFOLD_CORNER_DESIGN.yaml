      - name: cross_reference_link_policy_binds_an_agreement_and_a_carrier_on_both_sides
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/agreements/{id}/policies
          - validations.priority_3_ERR_AGREEMENT_NOT_FOUND
          - validations.priority_4_ERR_INSURED_NOT_FOUND
        distinguishing_aspect: |
          Attaching a policy is the one call that names two independent parents — the note in the path
          and the carrier in the body — so BOTH must resolve, and the error depends on which one is
          missing: a bad path id is caught at priority 3 as ERR_AGREEMENT_NOT_FOUND, a bad body id at
          priority 4 as ERR_INSURER_NOT_FOUND. Once the link is written it must be navigable from
          either end, and it must be reflected in the note's derived policy_count. The two-carrier
          fixture proves the insurer filter really discriminates instead of returning every policy of
          the note.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15 and the canonical TX regime has an effective License"
            - "two Insurers exist: Meridian Casualty and Cordillera Mutual"
            - "one DRAFT agreement exists, plus a second DRAFT agreement to prove the agreement filter discriminates"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
