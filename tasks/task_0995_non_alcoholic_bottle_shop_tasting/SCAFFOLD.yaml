    output: Member
    side_effects: ["Member.wallet_credit_cents += delta_cents (floor at 0)"]
  - method: GET
    path: "/nabs/members/{id}/tasting-events"
    description: "Reverse-reachability: tasting events hosted by this member"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: TastingEvent[]
    side_effects: []
  - method: GET
    path: "/nabs/members/{id}/tasting-seats"
    description: "Reverse-reachability: tasting seats held by this member"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: TastingSeat[]
    side_effects: []

  # --- Attestations ---
  - method: POST
    path: "/nabs/members/{id}/attestations"
    description: "ShopStaff submits attestation (transitions Member UNVERIFIED/REJECTED -> PENDING_REVIEW)"
    roles: [ShopStaff, ComplianceOfficer]
    code: 201
    input: ["attested_by_user_id", "outcome", "attested_on", "document_reference"]
    output: ComplianceAttestation
    side_effects: ["Member.age_attestation_status := PENDING_REVIEW"]
  - method: POST
    path: "/nabs/members/{id}/attestations/{att_id}/approve"
    description: "ComplianceOfficer approves attestation; Member -> ATTESTED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Member
    side_effects: ["Member.age_attestation_status := ATTESTED"]
  - method: POST
    path: "/nabs/members/{id}/attestations/{att_id}/reject"
    description: "ComplianceOfficer rejects attestation; Member -> REJECTED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Member
    side_effects: ["Member.age_attestation_status := REJECTED"]
  - method: POST
    path: "/nabs/members/{id}/attestations/revoke"
    description: "Revoke attestation; Member ATTESTED -> REVOKED; cascade-cancels affected orders"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Member
    side_effects: ["Member.age_attestation_status := REVOKED", "Cancel affected DRAFT/PICKING orders containing ADULT_ONLY_REQUIRED SKUs"]

  # --- Club Plans ---
  - method: POST
    path: "/nabs/club-plans"
    description: "Create club plan"
    roles: [PlatformAdmin]
    code: 201
    input: ["code", "cadence", "bottles_per_shipment", "price_cents_per_cycle", "allowed_category_ids", "discount_bps_on_retail", "max_active_subscriptions"]
    output: ClubPlan
    side_effects: []
  - method: GET
    path: "/nabs/club-plans"
    description: "List club plans"
    roles: [PlatformAdmin, ShopStaff, Member, Anonymous]
    code: 200
    input: ["limit?", "offset?"]
    output: ClubPlan[]
    side_effects: []
  - method: GET
    path: "/nabs/club-plans/{id}"
    description: "Fetch club plan"
    roles: [PlatformAdmin, ShopStaff, Member, Anonymous]
    code: 200
    input: []
    output: ClubPlan
    side_effects: []
  - method: GET
    path: "/nabs/club-plans/{id}/subscriptions"
    description: "Reverse-reachability: subscriptions under plan"
    roles: [PlatformAdmin, ShopStaff]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ClubSubscription[]
    side_effects: []

  # --- Club Subscriptions ---
  - method: POST
    path: "/nabs/club-subscriptions"
    description: "Subscribe a member to a plan; OCC via expected_plan_version"
    roles: [Member, ShopStaff, PlatformAdmin]
    code: 201
    input: ["plan_id", "member_id", "started_on", "expected_plan_version", "trial_days?"]
    output: ClubSubscription
    side_effects: ["ClubPlan.active_subscription_count += 1; ClubPlan.version += 1"]
  - method: GET
    path: "/nabs/club-subscriptions/{id}"
    description: "Fetch subscription"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: []
    output: ClubSubscription
    side_effects: []
  - method: POST
    path: "/nabs/club-subscriptions/{id}/pause"
    description: "Pause subscription"
    roles: [Member, ShopStaff]
    code: 200
    input: ["pause_reason?"]
    output: ClubSubscription
    side_effects: []
  - method: POST
    path: "/nabs/club-subscriptions/{id}/resume"
    description: "Resume subscription"
    roles: [Member, ShopStaff]
    code: 200
    input: []
    output: ClubSubscription
    side_effects: ["next_billing_on recomputed"]
  - method: POST
    path: "/nabs/club-subscriptions/{id}/cancel"
    description: "Cancel subscription"
    roles: [Member, ShopStaff]
    code: 200
    input: []
    output: ClubSubscription
    side_effects: ["ClubPlan.active_subscription_count -= 1; ClubPlan.version += 1"]

  # --- Tasting Events ---
  - method: POST
    path: "/nabs/tasting-events"
    description: "Create tasting event (DRAFT)"
    roles: [ShopStaff, PlatformAdmin]
    code: 201
    input: ["title", "host_member_id", "starts_at", "ends_at", "capacity", "flight_price_cents", "min_attendee_age_years?"]
    output: TastingEvent
    side_effects: []
  - method: GET
    path: "/nabs/tasting-events"
    description: "List events"
    roles: [PlatformAdmin, ShopStaff, Member, Anonymous]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: TastingEvent[]
    side_effects: []
  - method: GET
    path: "/nabs/tasting-events/{id}"
    description: "Fetch event"
    roles: [PlatformAdmin, ShopStaff, Member, Anonymous]
    code: 200
    input: []
    output: TastingEvent
    side_effects: []
  - method: GET
    path: "/nabs/tasting-events/{id}/flight-items"
    description: "Reverse-reachability: flight items under event"
    roles: [PlatformAdmin, ShopStaff, Member, Anonymous]
    code: 200
    input: ["limit?", "offset?"]
    output: FlightItem[]
    side_effects: []
  - method: GET
    path: "/nabs/tasting-events/{id}/seats"
    description: "Reverse-reachability: seats under event"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: TastingSeat[]
    side_effects: []
  - method: POST
    path: "/nabs/tasting-events/{id}/flight-items"
    description: "Add flight item (SKU) to event"
    roles: [ShopStaff]
    code: 201
    input: ["sku_id", "pour_size_ml", "sequence_no"]
    output: FlightItem
    side_effects: ["Recompute TastingEvent.compliance_hold"]
  - method: POST
    path: "/nabs/tasting-events/{id}/publish"
    description: "Publish event: reserves inventory, transitions DRAFT->PUBLISHED"
    roles: [ShopStaff]
    code: 200
    input: []
    output: TastingEvent
    side_effects: ["Inventory reservation via lot_allocation_walk", "SKU.on_hand_cached recomputed", "TastingEvent.version += 1"]
  - method: POST
    path: "/nabs/tasting-events/{id}/cancel"
    description: "Cancel event: cascade-cancels seats, restores inventory"
    roles: [ShopStaff]
    code: 200
    input: []
    output: TastingEvent
    side_effects: ["Seats -> CANCELLED", "Inventory restored", "TastingEvent.version += 1"]
  - method: POST
    path: "/nabs/tasting-events/{id}/reschedule"
    description: "Reschedule LOCKED event to new starts_at"
    roles: [ShopStaff]
    code: 200
    input: ["new_starts_at", "new_ends_at"]
    output: TastingEvent
    side_effects: ["TastingEvent.status := RESCHEDULED -> PUBLISHED", "TastingEvent.version += 1"]

  # --- Tasting Seats ---
  - method: POST
    path: "/nabs/tasting-events/{id}/seats"
    description: "Book seat; OCC via expected_event_version"
    roles: [Member, ShopStaff]
    code: 201
    input: ["member_id", "expected_event_version"]
