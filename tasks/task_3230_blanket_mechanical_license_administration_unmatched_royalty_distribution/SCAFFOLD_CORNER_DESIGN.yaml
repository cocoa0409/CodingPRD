# =============================================================================
# §1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Blanket Mechanical License Administration & Unmatched Royalty Distribution
#
# Breadth probe: every testable claim of SCAFFOLD.yaml §1.1–§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Section/claim_type values
# follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_service_provider_required_fields_and_defaults
        claim_type: creation_and_defaults
        grounds: [entities.ServiceProvider]
        distinguishing_aspect: "POST with legal_name -> 201; participation_status defaults to PENDING and audit_credits to 0; version starts at 1."
        test_recipe:
          setup: ["Empty DB; clock default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id, dsp_status: $.data.participation_status, dsp_credits: $.data.audit_credits, dsp_v: $.data.version }
          assert:
            - "dsp_status == PENDING"
            - "dsp_credits == 0"
            - "dsp_v == 1"

      - name: create_service_provider_missing_legal_name_returns_invalid_request
        claim_type: required_field_violation
        grounds: [entities.ServiceProvider.fields.legal_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required legal_name is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /mlc/service-providers"
              payload: {}
              as: MLCAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"

      - name: get_member_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND], endpoints.GET /mlc/members/{id}"]
        distinguishing_aspect: "GET with a well-formed but unknown member id -> ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /mlc/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MLCAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_MEMBER_NOT_FOUND"

      - name: list_members_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints.GET /mlc/members]
        distinguishing_aspect: "List response carries limit/offset/total_count/has_more; defaults limit=10 offset=0; with 2 members total_count == 2 and has_more == false."
        test_recipe:
          setup: ["Two members registered"]
          setup_api_calls:
            - call: "POST /mlc/members"
              payload: { legal_name: "Alder Publishing", member_type: "PUBLISHER", ipi_number: "00000000101" }
              as: MLCAdministrator
            - call: "POST /mlc/members"
              payload: { legal_name: "Birch Songs", member_type: "SELF_PUBLISHED_SONGWRITER", ipi_number: "00000000202" }
              as: MLCAdministrator
          trigger:
            - call: "GET /mlc/members"
              payload: {}
              as: PublicSearcher
          assert:
            - "response envelope response_type == 'array'"
            - "total_count == 2 and has_more == false and limit == 10 and offset == 0"

      - name: member_ipi_uniqueness_enforced
        claim_type: type_constraint
        grounds: [entities.Member.fields.ipi_number]
        distinguishing_aspect: "A second member registering the same non-null ipi_number is rejected; null IPIs may repeat."
        test_recipe:
          setup: ["Member A registered with ipi_number 00000000101"]
          setup_api_calls:
            - call: "POST /mlc/members"
              payload: { legal_name: "Alder Publishing", member_type: "PUBLISHER", ipi_number: "00000000101" }
              as: MLCAdministrator
          trigger:
            - call: "POST /mlc/members"
              payload: { legal_name: "Alder Copycat", member_type: "PUBLISHER", ipi_number: "00000000101" }
              as: MLCAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: work_iswc_uniqueness_enforced
        claim_type: type_constraint
        grounds: [entities.MusicalWork.fields.iswc]
        distinguishing_aspect: "Two works with the same non-null iswc cannot both exist; the second create is rejected."
        test_recipe:
          setup: ["Work W1 with iswc T0000000001"]
          setup_api_calls:
            - call: "POST /mlc/works"
              payload: { title: "Kestrel", iswc: "T0000000001" }
              as: MLCAdministrator
          trigger:
            - call: "POST /mlc/works"
              payload: { title: "Kestrel (alt)", iswc: "T0000000001" }
              as: MLCAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"

      - name: usage_line_rejects_zero_plays
        claim_type: type_constraint
        grounds: [entities.UsageLine.fields.plays_count, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "plays_count == 0 (the zero-quantity edge) is rejected at line creation."
        test_recipe:
          setup:
            - "Clock 2026-09-10; schedule ACTIVE; DSP ACTIVE; DRAFT report 2026-08"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_id: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-08" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r0: $.data.id }
          trigger:
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/lines"
              payload: { isrc: "USAA19900051", track_title: "Sora", plays_count: 0, duration_seconds: 100 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"

      - name: statement_line_immutability
        claim_type: immutability
        grounds: [entities.StatementLine, entities.Statement]
        distinguishing_aspect: "StatementLine has common_fields: false and no update endpoint; Statement carries no version field (common_fields false) — update attempts have no route (404) and delivered statements reject every mutation."
        test_recipe:
          setup: ["Member A with ACTIVE payee; statement finalized and delivered"]
          setup_api_calls:
            - call: "POST /mlc/members"
              payload: { legal_name: "Alder Publishing", member_type: "PUBLISHER", ipi_number: "00000000101" }
              as: MLCAdministrator
              captures: { m_a: $.data.id }
            - call: "POST /mlc/members/${m_a}/payees"
              payload: { payee_legal_name: "Alder Publishing LLC", payment_method: "ACH", routing_number: "021000021", account_number: "123456789", tax_id: "123456789" }
              as: MLCAdministrator
            - call: "POST /mlc/members/${m_a}/statements"
              payload: { period_month: "2026-06" }
              as: MLCAdministrator
              captures: { st0: $.data.id }
            - call: "POST /mlc/members/${m_a}/statements/${st0}/finalize"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/members/${m_a}/statements/${st0}/deliver"
              payload: {}
              as: MLCAdministrator
          trigger:
            - call: "POST /mlc/members/${m_a}/statements/${st0}/reopen"
              payload: {}
              as: MLCAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (DELIVERED is terminal)"
            - "Statement.${st0}.status == DELIVERED"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: accept_rejected_report_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.UsageReport.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accept is only valid from SUBMITTED; calling it on a DRAFT report fails with ERR_INVALID_STATE and no sweep fires."
        test_recipe:
          setup:
            - "Clock 2026-09-10; schedule ACTIVE; DSP ACTIVE; DRAFT report 2026-08"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_id: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { dsp_v: $.data.accepted_rate_schedule_version }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-08" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r0: $.data.id }
          trigger:
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/accept"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: MLCAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"
            - "UsageReport.${r0}.status == DRAFT"

      - name: submit_empty_report_returns_empty_report
        claim_type: precondition_enforcement
        grounds: [state_machines.UsageReport.DRAFT_to_SUBMITTED, "errors[ERR_EMPTY_REPORT]"]
        distinguishing_aspect: "Submit precondition: at least one UsageLine — an empty DRAFT report is rejected with ERR_EMPTY_REPORT."
        test_recipe:
          setup:
            - "Clock 2026-09-10; schedule ACTIVE; DSP ACTIVE; DRAFT report 2026-08 with zero lines"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_id: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { dsp_v: $.data.accepted_rate_schedule_version }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-08" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r0: $.data.id }
          trigger:
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/submit"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_EMPTY_REPORT"

      - name: submit_future_period_returns_future_period
        claim_type: precondition_enforcement
        grounds: ["validations[priority=7], errors[ERR_FUTURE_PERIOD]"]
        distinguishing_aspect: "A report for the current (not fully elapsed) month cannot be submitted: clock 2026-09-10 with reporting_month 2026-09 -> ERR_FUTURE_PERIOD."
        test_recipe:
          setup:
            - "Clock 2026-09-10; schedule ACTIVE; DSP ACTIVE; DRAFT report 2026-09 with one line"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_id: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { dsp_v: $.data.accepted_rate_schedule_version }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-09" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r0: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/lines"
              payload: { isrc: "USAA19900051", track_title: "Sora", plays_count: 10, duration_seconds: 100 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
          trigger:
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/submit"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_FUTURE_PERIOD"

      - name: double_submit_returns_invalid_state_idempotency
        claim_type: idempotency
        grounds: [state_machines.UsageReport.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Repeating the same submit trigger after it succeeded is rejected (SUBMITTED is not a valid from-state); no double side effects."
        test_recipe:
          setup:
            - "Clock 2026-09-10; schedule ACTIVE; DSP ACTIVE; report 2026-08 with one line already SUBMITTED"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_id: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { dsp_v: $.data.accepted_rate_schedule_version }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-08" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r0: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/lines"
              payload: { isrc: "USAA19900051", track_title: "Sora", plays_count: 10, duration_seconds: 100 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/submit"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
          trigger:
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/submit"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"
            - "UsageReport.${r0}.total_usage_cents == 1310 (no double recompute side effect)"

      - name: work_withdraw_cascades_shares
        claim_type: cascade_down
        grounds: [state_machines.MusicalWork.ACTIVE_to_WITHDRAWN, state_machines.WorkShare.ACTIVE_to_WITHDRAWN]
        distinguishing_aspect: "Withdrawing a work cascades every ACTIVE/DISPUTED share to WITHDRAWN and recomputes total_share_percent to 0."
        test_recipe:
          setup: ["Work 'Kestrel' with two ACTIVE shares (60/40)"]
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/members"
              payload: { legal_name: "Alder Publishing", member_type: "PUBLISHER", ipi_number: "00000000101" }
              as: MLCAdministrator
              captures: { m_a: $.data.id }
            - call: "POST /mlc/members"
              payload: { legal_name: "Birch Songs", member_type: "PUBLISHER", ipi_number: "00000000202" }
              as: MLCAdministrator
              captures: { m_b: $.data.id }
            - call: "POST /mlc/works"
              payload: { title: "Kestrel" }
              as: MLCAdministrator
              captures: { w0: $.data.id, w0_v: $.data.version }
            - call: "POST /mlc/works/${w0}/shares"
              payload: { claimant_member_id: "${m_a}", share_percent: 60, effective_from: "2026-01-01T00:00:00Z", expected_work_version: "${w0_v}" }
              as: MLCAdministrator
              captures: { s1: $.data.id }
            - call: "POST /mlc/works/${w0}/shares"
              payload: { claimant_member_id: "${m_b}", share_percent: 40, effective_from: "2026-01-01T00:00:00Z", expected_work_version: "${w0_v} + 1" }
              as: MLCAdministrator
              captures: { s2: $.data.id }
          trigger:
            - call: "POST /mlc/works/${w0}/withdraw"
              payload: {}
              as: MLCAdministrator
          assert:
            - "MusicalWork.${w0}.status == WITHDRAWN and withdrawn_at is non-null"
            - "WorkShare.${s1}.status == WITHDRAWN and WorkShare.${s2}.status == WITHDRAWN"
            - "MusicalWork.${w0}.total_share_percent == 0"

      - name: rate_schedule_activation_bubbles_to_dsps
        claim_type: bubble_up
        grounds: [state_machines.RateSchedule.PENDING_to_ACTIVE, state_machines.RateSchedule.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Activating a schedule supersedes the prior ACTIVE one and bumps accepted_rate_schedule_version on every ACTIVE/SUSPENDED DSP (bubble up from schedule to providers)."
        test_recipe:
          setup: ["RS1 ACTIVE; DSP ACTIVE with accepted version v1; RS2 PENDING effective 2026-01-01 (already effective at clock)"]
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z", rate_cents_under_5min: 120, rate_cents_per_minute_over_5min: 240 }
              as: MLCAdministrator
              captures: { rs1: $.data.id }
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-06-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs2: $.data.id, rs2_v: $.data.version }
            - call: "POST /mlc/rate-schedules/${rs1}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
          trigger:
            - call: "POST /mlc/rate-schedules/${rs2}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "GET /mlc/service-providers/${dsp_id}"
              payload: {}
              as: MLCAdministrator
              captures: { dsp_ack: $.data.accepted_rate_schedule_version }
          assert:
            - "RateSchedule.${rs1}.status == SUPERSEDED"
            - "RateSchedule.${rs2}.status == ACTIVE"
            - "dsp_ack == rs2_v (the DSP's acknowledgement bumped to the newly activated schedule's version)"

      - name: claim_withdraw_only_by_owner
        claim_type: guarded_transition
        grounds: [state_machines.Claim.PENDING_to_WITHDRAWN, "errors[ERR_NOT_CLAIM_OWNER]"]
        distinguishing_aspect: "Cross-actor guard: a MemberUser whose id is not the claim's claimant_member_id cannot withdraw it."
        test_recipe:
          setup:
            - "Full chain: DSP ACTIVE; report 2026-06 accepted with unmatched line 'Gale'; HELD accrual; claim by member A PENDING"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_id: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { dsp_v: $.data.accepted_rate_schedule_version }
            - call: "POST /mlc/members"
              payload: { legal_name: "Alder Publishing", member_type: "PUBLISHER", ipi_number: "00000000101" }
              as: MLCAdministrator
              captures: { m_a: $.data.id }
            - call: "POST /mlc/members"
              payload: { legal_name: "Birch Songs", member_type: "PUBLISHER", ipi_number: "00000000202" }
              as: MLCAdministrator
              captures: { m_b: $.data.id }
            - call: "POST /mlc/works"
              payload: { title: "Gale" }
              as: MLCAdministrator
              captures: { w0: $.data.id, w0_v: $.data.version }
            - call: "POST /mlc/works/${w0}/shares"
              payload: { claimant_member_id: "${m_a}", share_percent: 100, effective_from: "2026-01-01T00:00:00Z", expected_work_version: "${w0_v}" }
              as: MLCAdministrator
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
