# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7 surface. Corners already asserted by a §1.8 instance are emitted as
# `excluded_because:` stubs naming that instance.
scaffold_corner_design:

  - section: entities
    instances:

      - name: student_creation_initialises_every_computed_and_system_field
        claim_type: creation
        grounds:
          - entities.Student.fields.fpl_percent
          - entities.Student.fields.discount_tier
          - entities.Student.fields.immunization_compliance_status
          - entities.Student.fields.total_dose_count
        distinguishing_aspect: "POST /sbhc/students with only the three input fields returns 201 and initialises fpl_percent 0.00, discount_tier TIER_A, payer_route SELF_PAY, immunization_exemption_type NONE, immunization_compliance_status NON_COMPLIANT, all four dose counters 0 and version 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock set to 2026-05-04T09:00:00Z."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
          trigger:
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "Student.${stu_id}.fpl_percent == 0.00"
            - "Student.${stu_id}.discount_tier == TIER_A"
            - "Student.${stu_id}.payer_route == SELF_PAY"
            - "Student.${stu_id}.insurance_member_id is null"
            - "Student.${stu_id}.immunization_exemption_type == NONE"
            - "Student.${stu_id}.immunization_compliance_status == NON_COMPLIANT"
            - "Student.${stu_id}.valid_dose_count == 0"
            - "Student.${stu_id}.invalid_dose_count == 0"
            - "Student.${stu_id}.voided_dose_count == 0"
            - "Student.${stu_id}.total_dose_count == 0"
            - "Student.${stu_id}.version == 1"

      - name: student_retrieval_reflects_recomputed_sliding_fee_position
        claim_type: retrieval
        grounds:
          - entities.Student.fields.fpl_percent
          - calculations.fpl_percent_and_discount_tier
        distinguishing_aspect: "GET /sbhc/students/{id} after a financial-profile write returns fpl_percent 213.27 and discount_tier TIER_E for income 4500000 at household size 2, with version incremented to 2."
        test_recipe:
          setup:
            - "One student on the roster with a financial profile of 4500000 cents at household size 2."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/students"
              payload: { first_name: "Nia", last_name: "Bell", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id" }
            - call: "PATCH /sbhc/students/${stu_id}/financial-profile"
              payload: { household_income_annual_cents: 4500000, household_size: 2, payer_route: "SELF_PAY" }
              as: Registrar
          trigger:
            - call: "GET /sbhc/students/${stu_id}"
              payload: {}
              as: Registrar
              captures: { pct: "$.data.fpl_percent", tier: "$.data.discount_tier" }
          assert:
            - "Student.${stu_id}.fpl_percent == 213.27"
            - "Student.${stu_id}.discount_tier == TIER_E"
            - "Student.${stu_id}.version == 2"

      - name: enrollment_list_honours_limit_offset_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Enrollment.fields.school_id
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three enrollments on file, GET /sbhc/enrollments with limit 2 and offset 0 returns exactly 2 rows with total_count 3 and has_more true, and offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One ACTIVE school and three students, each with one PENDING 2025-2026 enrollment at that school."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /sbhc/students"
              payload: { first_name: "One", last_name: "Alpha", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { s1_id: "$.data.id", s1_v: "$.data.version" }
            - call: "POST /sbhc/students/${s1_id}/enrollments"
              payload: { school_id: "${school_id}", school_year: "2025-2026", expected_student_version: "${s1_v}" }
              as: Registrar
            - call: "POST /sbhc/students"
              payload: { first_name: "Two", last_name: "Beta", date_of_birth: "2010-05-15" }
              as: Registrar
              captures: { s2_id: "$.data.id", s2_v: "$.data.version" }
            - call: "POST /sbhc/students/${s2_id}/enrollments"
              payload: { school_id: "${school_id}", school_year: "2025-2026", expected_student_version: "${s2_v}" }
              as: Registrar
            - call: "POST /sbhc/students"
              payload: { first_name: "Three", last_name: "Gamma", date_of_birth: "2010-06-15" }
              as: Registrar
              captures: { s3_id: "$.data.id", s3_v: "$.data.version" }
            - call: "POST /sbhc/students/${s3_id}/enrollments"
              payload: { school_id: "${school_id}", school_year: "2025-2026", expected_student_version: "${s3_v}" }
              as: Registrar
          trigger:
            - call: "GET /sbhc/enrollments?school_id=${school_id}&limit=2&offset=0"
              payload: {}
              as: Registrar
            - call: "GET /sbhc/enrollments?school_id=${school_id}&limit=2&offset=2"
              payload: {}
              as: Registrar
          assert:
            - "the first list response contains exactly 2 Enrollment rows"
            - "the first list response reports total_count == 3 and has_more == true"
            - "the second list response contains exactly 1 Enrollment row"
            - "the second list response reports total_count == 3 and has_more == false"

      - name: visit_get_with_unknown_uuid_returns_visit_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_VISIT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /sbhc/visits/{unknown uuid} returns HTTP 404 with data.error_id == ERR_VISIT_NOT_FOUND rather than an empty object."
        test_recipe:
          setup:
            - "Empty database with the logical clock set to 2026-05-04T09:00:00Z."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
          trigger:
            - call: "GET /sbhc/visits/2f1b6b12-0000-4000-8000-000000000001"
              payload: {}
              as: Clinician
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status is 404"
            - "data.error_id == ERR_VISIT_NOT_FOUND"

      - name: school_create_missing_required_site_code_returns_validation
        claim_type: required_fields
        grounds:
          - validations[priority=6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /sbhc/schools omitting the required site_code returns HTTP 400 with data.error_id == ERR_VALIDATION and creates no School row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
          trigger:
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", sponsor_hospital_name: "Mercy Sponsor Hospital" }
              as: SbhcAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status is 400"
            - "data.error_id == ERR_VALIDATION"
            - "zero School rows exist"

      - name: school_capacity_and_guardian_flags_default_when_omitted
        claim_type: defaults
        grounds:
          - entities.School.fields.telehealth_concurrent_capacity
          - entities.Guardian.fields.is_primary
          - entities.Guardian.fields.notification_opt_out
        distinguishing_aspect: "Omitting telehealth_concurrent_capacity yields DEFAULT_TELEHEALTH_CONCURRENT_CAPACITY 1; omitting is_primary yields false, and notification_opt_out defaults to false without ever being an input on the create call."
        test_recipe:
          setup:
            - "Empty database with the clock at 2026-05-04T09:00:00Z and one student on the roster."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id" }
          trigger:
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital" }
              as: SbhcAdmin
              captures: { school_id: "$.data.id", cap: "$.data.telehealth_concurrent_capacity" }
            - call: "POST /sbhc/students/${stu_id}/guardians"
              payload: { full_name: "Mai Nguyen", relationship: "MOTHER", contact_email: "mai@example.org" }
              as: Registrar
              captures: { g_id: "$.data.id" }
          assert:
            - "School.${school_id}.telehealth_concurrent_capacity == 1"
            - "School.${school_id}.program_status == ACTIVE"
            - "School.${school_id}.telehealth_booked_minutes_total == 0"
            - "School.${school_id}.suspended_count == 0"
            - "Guardian.${g_id}.is_primary == false"
            - "Guardian.${g_id}.notification_opt_out == false"

      - name: student_system_fields_are_server_minted_and_version_increments
        claim_type: system_fields
        grounds:
          - entities.Student.fields.date_of_birth
          - calculations.fpl_percent_and_discount_tier
        distinguishing_aspect: "Student.id is a bare UUID with no type prefix, created_at and updated_at are ISO 8601 UTC with three fractional digits, and version starts at 1 and increments by exactly 1 on the financial-profile mutation."
        test_recipe:
          setup:
            - "One freshly created student."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id", v1: "$.data.version" }
          trigger:
            - call: "PATCH /sbhc/students/${stu_id}/financial-profile"
              payload: { household_income_annual_cents: 3000000, household_size: 4, payer_route: "SELF_PAY" }
              as: Registrar
              captures: { v2: "$.data.version" }
          assert:
            - "Student.${stu_id}.id is a bare UUID with no type prefix"
            - "Student.${stu_id}.version == 2"
            - "Student.${stu_id}.updated_at is greater than or equal to Student.${stu_id}.created_at"

      - name: report_snapshot_is_immutable_and_exposes_no_version_field
        claim_type: immutability
        grounds:
          - entities.AggregateReport.fields.generated_at
          - entities.AggregateReport.fields.period_start_date
        distinguishing_aspect: "AggregateReport is declared common_fields false, so a generated report exposes id and created_at but no version and no update endpoint; re-reading it returns the identical counts."
        test_recipe:
          setup:
            - "One ACTIVE school and one generated report over 2026-04-01 to 2026-04-30."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /sbhc/reports"
              payload: { period_start_date: "2026-04-01", period_end_date: "2026-04-30", school_id: "${school_id}" }
              as: SbhcAdmin
              captures: { rep_id: "$.data.id" }
          trigger:
            - call: "GET /sbhc/reports/${rep_id}"
              payload: {}
              as: SbhcAdmin
          assert:
            - "the report response carries id, created_at, period_start_date 2026-04-01 and period_end_date 2026-04-30"
            - "the report response carries no version field"
            - "AggregateReport.${rep_id}.total_visits == 0"
            - "GET /sbhc/reports filtered by school_id ${school_id} returns exactly 1 AggregateReport row"

      - name: consent_create_with_unknown_category_enum_returns_validation
        claim_type: type_constraints
        grounds:
          - entities.Consent.fields.category
          - validations[priority=6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /sbhc/students/{id}/consents with category VISION_CARE, which is not one of the five declared members, returns HTTP 400 ERR_VALIDATION and creates no Consent row."
        test_recipe:
          setup:
            - "One student with one guardian on file."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id", stu_v: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/guardians"
              payload: { full_name: "Mai Nguyen", relationship: "MOTHER", contact_email: "mai@example.org", is_primary: true }
              as: Registrar
              captures: { g1_id: "$.data.id" }
          trigger:
            - call: "POST /sbhc/students/${stu_id}/consents"
              payload: { category: "VISION_CARE", school_year: "2025-2026", granted_by: "GUARDIAN", granted_by_user_id: "${g1_id}", expected_student_version: "${stu_v}" }
              as: Registrar
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status is 400"
            - "data.error_id == ERR_VALIDATION"
            - "the student's consent list returns zero Consent rows"

      - name: guardian_create_under_unknown_student_returns_student_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Guardian.fields.student_id
          - validations[priority=4]
          - errors[ERR_STUDENT_NOT_FOUND]
        distinguishing_aspect: "POST /sbhc/students/{unknown uuid}/guardians returns HTTP 404 ERR_STUDENT_NOT_FOUND, proving the parent path segment is resolved before the body is processed."
        test_recipe:
          setup:
            - "Empty roster."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
          trigger:
            - call: "POST /sbhc/students/2f1b6b12-0000-4000-8000-0000000000aa/guardians"
              payload: { full_name: "Mai Nguyen", relationship: "MOTHER", contact_email: "mai@example.org", is_primary: true }
              as: Registrar
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status is 404"
            - "data.error_id == ERR_STUDENT_NOT_FOUND"

  - section: state_machines
    instances:

      - name: enrollment_starts_pending_and_activate_stamps_activated_at
        claim_type: initial_state
        grounds:
          - state_machines.Enrollment.null_to_PENDING
          - state_machines.Enrollment.PENDING_to_ACTIVE
          - entities.Enrollment.fields.activated_at
        distinguishing_aspect: "A newly created Enrollment is PENDING with activated_at null and reinstated_count 0; POST /sbhc/enrollments/{id}/activate moves it to ACTIVE and stamps activated_at with the logical clock instant 2026-05-04T09:00:00Z."
        test_recipe:
          setup:
            - "One ACTIVE school and one student on the roster, clock at 2026-05-04T09:00:00Z."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id", stu_v1: "$.data.version" }
          trigger:
            - call: "POST /sbhc/students/${stu_id}/enrollments"
              payload: { school_id: "${school_id}", school_year: "2025-2026", expected_student_version: "${stu_v1}" }
              as: Registrar
              captures: { enr_id: "$.data.id", st0: "$.data.status" }
            - call: "POST /sbhc/enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
          assert:
            - "immediately after creation Enrollment.${enr_id}.status == PENDING, activated_at is null and reinstated_count == 0"
            - "Enrollment.${enr_id}.status == ACTIVE"
            - "Enrollment.${enr_id}.activated_at == 2026-05-04T09:00:00.000Z"
            - "Student.${stu_id}.version == 3"

      - name: enrollment_activate_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Enrollment.PENDING_to_ACTIVE
          - validations[priority=17]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Repeating POST /sbhc/enrollments/{id}/activate on an already ACTIVE enrollment returns HTTP 409 ERR_INVALID_STATE and leaves activated_at at its first value."
        test_recipe:
          setup:
            - "One ACTIVE school, one student and one ACTIVE enrollment activated at 2026-05-04T09:00:00Z."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id", stu_v1: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/enrollments"
              payload: { school_id: "${school_id}", school_year: "2025-2026", expected_student_version: "${stu_v1}" }
              as: Registrar
              captures: { enr_id: "$.data.id" }
            - call: "POST /sbhc/enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:00:00Z" }
              as: SbhcAdmin
          trigger:
            - call: "POST /sbhc/enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status is 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Enrollment.${enr_id}.status == ACTIVE"
            - "Enrollment.${enr_id}.activated_at == 2026-05-04T09:00:00.000Z"

      - name: enrollment_third_reinstatement_returns_limit_exceeded
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Enrollment.WITHDRAWN_to_ACTIVE
          - entities.Enrollment.fields.reinstated_count
          - validations[priority=28]
          - errors[ERR_REINSTATEMENT_LIMIT_EXCEEDED]
        distinguishing_aspect: "After two WITHDRAWN to ACTIVE reinstatements the row carries reinstated_count 2, and a third reinstate returns HTTP 409 ERR_REINSTATEMENT_LIMIT_EXCEEDED with the row left in WITHDRAWN."
        test_recipe:
          setup:
            - "One ACTIVE school, one student, one enrollment that has already been withdrawn and reinstated twice and is currently WITHDRAWN."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id", stu_v1: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/enrollments"
              payload: { school_id: "${school_id}", school_year: "2025-2026", expected_student_version: "${stu_v1}" }
              as: Registrar
              captures: { enr_id: "$.data.id" }
            - call: "POST /sbhc/enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /sbhc/enrollments/${enr_id}/withdraw"
              payload: { reason: "Family moved out of district" }
              as: Registrar
            - call: "POST /sbhc/enrollments/${enr_id}/reinstate"
              payload: {}
              as: Registrar
            - call: "POST /sbhc/enrollments/${enr_id}/withdraw"
              payload: { reason: "Second withdrawal" }
              as: Registrar
            - call: "POST /sbhc/enrollments/${enr_id}/reinstate"
              payload: {}
              as: Registrar
            - call: "POST /sbhc/enrollments/${enr_id}/withdraw"
              payload: { reason: "Third withdrawal" }
              as: Registrar
          trigger:
            - call: "POST /sbhc/enrollments/${enr_id}/reinstate"
              payload: {}
              as: Registrar
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status is 409"
            - "data.error_id == ERR_REINSTATEMENT_LIMIT_EXCEEDED"
            - "Enrollment.${enr_id}.status == WITHDRAWN"
            - "Enrollment.${enr_id}.reinstated_count == 2"

      - name: enrollment_withdraw_cancels_scheduled_visits_of_that_enrollment
        claim_type: side_effect_execution
        grounds:
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - state_machines.Visit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Withdrawing the enrollment moves every SCHEDULED visit anchored to it into CANCELLED in the same request, and stamps Enrollment.withdrawn_at with the current clock instant."
        test_recipe:
          setup:
            - "One ACTIVE school, one MEDICAL clinician, one student with an ACTIVE enrollment and an ACTIVE GENERAL_TREATMENT consent."
            - "One SCHEDULED ACUTE visit on that enrollment."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
