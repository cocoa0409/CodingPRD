            - "Second sweep at 2026-12-30: due2 == 1 (installment 2), delq2 == 0 because installment 1 is PAID even though its delinquent_on of 2026-11-29 has passed, de2 == 0, dd2 == 0, and fin2 == 1."
            - "GET /liability-assessments/${la_id} reports lifecycle_status == \"FINAL\", review_status == \"NONE\" and collection_status == \"CURRENT\"."
            - "GET /installments?payment_schedule_id=${ps_id} shows statuses PAID, DUE, SCHEDULED, SCHEDULED in sequence order."
            - "GET /employers/${emp_id} reports credit_watch == false, delinquency_strikes == 0 and outstanding_liability_cents == 3750000."

      - name: accelerating_before_the_cure_deadline_is_rejected_and_permitted_one_day_after
        claim_type: Conditional action
        grounds:
          - "endpoints[POST /payment-schedules/{payment_schedule_id}/accelerate]"
          - "validations[priority=9]"
          - "errors[ERR_CURE_DEADLINE_NOT_EXPIRED]"
        distinguishing_aspect: |
          The comparison is STRICTLY after, so the last day of the statutory cure period is
          still protected. Acceleration is also the point of no return: it converts the
          remaining installments into a single balance and defaults the employer, so the
          off-by-one here is the difference between a curable default and a permanent
          one.
        test_recipe:
          setup:
            - "The baseline assessment issued at 2026-08-01. The clock advances to 2027-02-28 and a sweep leaves installments 1 and 2 DELINQUENT with the schedule DEFAULT_ELIGIBLE; the trustee issues the default notice, so cure_deadline_at is 2027-04-29."
