    instances:
      - name: immediate_visibility_of_invoice_effects_covered
        claim_type: immediate
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: invoice_then_payment_conserves_credit
          rationale: "Invoice and payment effects are read back immediately after each trigger in the named §1.8 instance, which exercises the immediate consistency model."
