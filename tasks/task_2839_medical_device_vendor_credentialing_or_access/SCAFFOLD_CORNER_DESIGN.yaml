      - name: pir_revision_cycle_terminates_at_max_revision_rounds
        claim_type: cyclic
        grounds:
          - state_machines.ProductIntroductionRequest.CHANGES_REQUESTED_to_CLINICAL_REVIEW
          - validations.priority_35_ERR_PIR_REVISION_LIMIT
          - global_constants.MAX_REVISION_ROUNDS
        distinguishing_aspect: "The CHANGES_REQUESTED -> CLINICAL_REVIEW -> VALUE_ANALYSIS_REVIEW loop is walked twice, lifting revision_round to exactly 2; the third REQUEST_CHANGES is refused with ERR_PIR_REVISION_LIMIT (422) and the request stays in VALUE_ANALYSIS_REVIEW instead of looping forever."
        test_recipe:
          setup:
            - "Facility PR-34 and Vendor PIRV exist; one PIR has been through two full revision rounds and now sits in VALUE_ANALYSIS_REVIEW with revision_round == 2."
            - "Each round re-endorsement is required because REQUEST_CHANGES clears clinical_sponsor_user_id."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Pir Rounds Hospital", code: "PR-34", spd_turnaround_hours: 5, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_pr_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Pir Rounds Devices", vendor_code: "PIRV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_pirv_id: $.data.id, v_pirv_ver0: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_pirv_id}", facility_id: "${f_pr_id}", product_name: "Revised Cage", product_catalog_number: "RC-400", manufacturer: "Pirv", is_implant: true, unit_cost_cents: 400000, expected_vendor_version: "${v_pirv_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_pirv_id}"
              captures: { pir_rc_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests/${pir_rc_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_pirv_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_rc_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_rc_id}/value-analysis-decision"
              payload: { decision: "REQUEST_CHANGES" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_rc_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_pirv_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_rc_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_rc_id}/value-analysis-decision"
              payload: { decision: "REQUEST_CHANGES" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_rc_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_pirv_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_rc_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "GET /vendor-access/product-introduction-requests/${pir_rc_id}"
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
              captures: { pir_rc_round_before: $.data.revision_round, pir_rc_status_before: $.data.status }
          trigger:
            - call: "POST /vendor-access/product-introduction-requests/${pir_rc_id}/value-analysis-decision"
              payload: { decision: "REQUEST_CHANGES" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
              captures: { revision_limit_error: $.data.error_id }
          assert:
            - "the captured pre-trigger values are ${pir_rc_round_before} == 2 and ${pir_rc_status_before} == VALUE_ANALYSIS_REVIEW"
            - "HTTP status is 422 and error_id == ERR_PIR_REVISION_LIMIT"
            - "ProductIntroductionRequest.${pir_rc_id}.status is still VALUE_ANALYSIS_REVIEW and revision_round is still 2"
            - "Vendor.${v_pirv_id}.open_pir_count == 1 — the refused decision neither closed nor reopened the request"
            - "an APPROVE decision on the same request still succeeds afterwards, proving the limit blocks only the loop and not the exit"

