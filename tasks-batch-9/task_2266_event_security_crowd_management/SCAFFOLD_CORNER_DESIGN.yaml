  - name: assessment_approval_by_its_own_submitter_returns_segregation_of_duties
    claim_type: segregation_of_duties
    grounds:
    - validations[priority=15]
    - errors.ERR_SEGREGATION_OF_DUTIES
    - entities.RiskAssessment.fields.submitted_by_user_id
    distinguishing_aspect: |
      This is the only rule in §1.4 keyed on comparing X-User-ID against a STORED actor id rather than on the role, so it fires for a caller who holds the correct role and the correct action and still must be refused. It also has to be distinguished from priority 3: the same request with the same body from a DIFFERENT director id succeeds, which proves the refusal is about identity, not authority.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - Venue "Harbor Arena" with zones ZF, ZI and ZE; SecurityEvent in PLANNING
      - a RiskAssessment SUBMITTED with submitted_by_user_id "director-1" — the submit was performed under the RiskAnalyst role by the user who also holds SecurityDirector
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/venues
        payload:
          name: Harbor Arena
          gross_capacity: 8000
          door_count: 1
          egress_capacity_per_minute: 500
          perimeter_length_m: 400
          alcohol_licensed: false
          prior_incident_rate: 0
        as: SecurityDirector
        captures:
          venue_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZF
          zone_type: FLOOR
          floor_area_sqm: 200
          posted_capacity: 300
          exit_units: 3
          post_slot_capacity: 12
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          zf_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZI
          zone_type: CONCOURSE
          floor_area_sqm: 100
          posted_capacity: 150
          exit_units: 2
          post_slot_capacity: 12
          is_ingress_zone: true
        as: SecurityDirector
        captures:
          zi_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZE
          zone_type: EXIT_CORRIDOR
          floor_area_sqm: 50
          posted_capacity: 80
          exit_units: 1
          post_slot_capacity: 6
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          ze_id: $.data.id
      - call: POST /event-security/security-events
        payload:
          venue_id: ${venue_id}
          event_name: Autumn Gala
          event_type: CONCERT
          doors_open_at: '2026-09-12T17:00:00Z'
          event_start_at: '2026-09-12T18:30:00Z'
          event_end_at: '2026-09-12T22:30:00Z'
          expected_attendance: 200
          alcohol_served: false
          vip_present: false
        as: SecurityDirector
        captures:
          event_id: $.data.id
      - call: POST /event-security/security-events/${event_id}/risk-assessments
        payload:
          threat_level_input: LOW
          protest_likelihood: NONE
          crowd_profile: SEATED
          ingress_door_count: 1
          layout_complexity_score: 1
          history_incident_rate: 0
        as: RiskAnalyst
        as_user_id: analyst-1
        captures:
          ra_id: $.data.id
      - call: POST /event-security/risk-assessments/${ra_id}/decision
        payload:
          action: SUBMIT
        as: RiskAnalyst
        as_user_id: director-1
      trigger:
      - call: POST /event-security/risk-assessments/${ra_id}/decision
        payload:
          action: APPROVE
        as: SecurityDirector
        as_user_id: director-1
      - call: POST /event-security/risk-assessments/${ra_id}/decision
        payload:
          action: REJECT
          rejection_reason: self review not permitted
        as: SecurityDirector
        as_user_id: director-1
      - call: POST /event-security/risk-assessments/${ra_id}/decision
        payload:
          action: APPROVE
        as: SecurityDirector
        as_user_id: director-2
      - call: GET /event-security/risk-assessments/${ra_id}
        payload: {}
        as: SecurityDirector
        as_user_id: director-1
      assert:
      - APPROVE by "director-1" returns 403 with data.error_id == "ERR_SEGREGATION_OF_DUTIES" even though the role and the action are both permitted
      - REJECT by "director-1" also returns 403 with data.error_id == "ERR_SEGREGATION_OF_DUTIES" — the rule covers both decision verbs, not just the favourable one
      - APPROVE by "director-2" returns 200 with RiskAssessment.${ra_id}.status == APPROVED and approved_by_user_id == "director-2"
      - RiskAssessment.${ra_id}.submitted_by_user_id is still "director-1" and revision_number is still 1
      - SecurityEvent.${event_id}.status == RISK_ASSESSED after the accepted approval
  - name: after_action_return_and_finalize_by_its_author_return_segregation_of_duties
    claim_type: segregation_of_duties
    grounds:
    - validations[priority=15]
    - errors.ERR_SEGREGATION_OF_DUTIES
    - entities.AfterActionReview.fields.authored_by_user_id
    - state_machines.AfterActionReview.SUBMITTED_to_FINALIZED
