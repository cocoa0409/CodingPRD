      - name: installment_sweep_ages_the_schedule_then_defaults_the_whole_plan
        claim_type: Side Effect Execution
        grounds:
          - endpoints[POST /amnesty/programs/{id}/installment-sweep]
          - state_machines.Installment.SCHEDULED_to_LATE
          - state_machines.PaymentPlan.ACTIVE_to_DEFAULTED
          - calculations.installment_schedule_generation.constants.INSTALLMENT_GRACE_DAYS_LATE
        distinguishing_aspect: |
          The sweep is three ordered steps over the same rows and the order is visible in
          the counters. At 2026-11-20 installment 1 (due 2026-10-15) and installment 2
          (due 2026-11-14) are both overdue, so step 1 marks two rows LATE; only
          installment 1 is past due_date + 30 days (2026-11-14), so step 2 defaults it
          and the plan; step 3 then sweeps the remaining ten rows to DEFAULTED. A sweep
          that defaulted in one pass would report marked_late_count 1.
