# =============================================================================
# Economic-Development Incentive & Abatement — seed tables (SCAFFOLD.yaml)
# §1.0–§1.7 (+ complexity_profile, concurrency_rules). Expert difficulty.
# =============================================================================

scenario: |
  Economic-Development Incentive & Abatement: application & but-for/eligibility,
  incentive type (TIF/abatement/grant) & term, job/investment clawback covenant,
  compliance certification & annual report, disbursement/abatement calculation,
  transparency disclosure, default & recapture, portfolio dashboard

domain_name: economic-development-incentive
api_prefix: ""   # flat topology: peer collections rooted at "/", no shared parent segment

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat            # peer entities linked by FK fields, no nested ownership in URLs
  state_machine_shape: branching   # + cyclic (ComplianceReport, RecaptureAssessment) on other entities
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: IncentiveProgram
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: program_name, type: string, source: input, description: "Program display name" }
      - { name: incentive_type, type: enum, source: input, description: "TIF | ABATEMENT | GRANT — fixes which award/disbursement formula applies", constraints: "one of TIF, ABATEMENT, GRANT" }
      - { name: total_budget_cents, type: integer, source: input, description: "Total appropriated funding pool for this program, in cents" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of max_incentive_cents over Agreements in status IN {EXECUTED, ACTIVE, DEFAULTED}; released on CLOSED/COMPLETED" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Net cash paid = sum(Disbursement.disbursed_amount_cents PAID) - sum(Disbursement.disbursed_amount_cents CLAWED_BACK)" }
      - { name: available_budget_cents, type: integer, source: computed, description: "total_budget_cents - committed_cents - disbursed_cents (budget partition invariant)" }
      - { name: min_jobs_required, type: integer, source: input, description: "Minimum jobs a covenant of type JOBS may target" }
      - { name: min_investment_cents, type: integer, source: input, description: "Minimum investment (cents) a covenant of type INVESTMENT may target" }
      - { name: max_term_years, type: integer, source: input, description: "Upper bound on an Agreement's term_years" }
      - { name: abatement_rate_pct, type: number, source: input, description: "Percent of assessed value abated per year for ABATEMENT programs (e.g. 12.5)" }
      - { name: grant_per_job_cents, type: integer, source: input, description: "Grant dollars (cents) awarded per committed job for GRANT programs" }
      - { name: tif_capture_pct, type: number, source: input, description: "Percent of the assessed-value increment captured per year for TIF programs" }
      - { name: but_for_pass_threshold, type: number, source: input, default: 60, description: "Minimum but_for_eligibility_score for an EligibilityReview.finding of PASS" }
      - { name: disclosure_threshold_cents, type: integer, source: input, default: 0, description: "max_incentive_cents at/above which a TransparencyDisclosure is required" }

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - { name: parcel_identifier, type: string, source: input, description: "Assessor parcel number" }
      - { name: jurisdiction, type: string, source: input, description: "Taxing jurisdiction name" }
      - { name: base_assessed_value_cents, type: integer, source: input, description: "Frozen base-year assessed value (cents); TIF increment measured from here" }
      - { name: current_assessed_value_cents, type: integer, source: input, description: "Current assessed value (cents); basis for abatement and TIF calcs" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> IncentiveProgram.id" }
      - { name: applicant_user_id, type: string, source: input, description: "X-User-ID (opaque) of the Applicant who owns this application" }
      - { name: applicant_name, type: string, source: input, description: "Legal name of applicant entity" }
      - { name: proposed_jobs, type: integer, source: input, description: "Jobs the applicant projects to create" }
      - { name: proposed_investment_cents, type: integer, source: input, description: "Capital investment the applicant projects (cents)" }
      - { name: but_for_attested, type: boolean, source: input, default: false, description: "Applicant attests the project would not proceed but-for the incentive" }
      - { name: distress_zone, type: boolean, source: input, default: false, description: "Site located in a designated economically-distressed zone" }
      - { name: but_for_eligibility_score, type: number, source: computed, description: "Weighted eligibility score; see calc but_for_eligibility_score" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> UNDER_REVIEW -> {APPROVED | DENIED}", constraints: "one of DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, DENIED" }

  - name: EligibilityReview
    parent: null
    common_fields: false   # append-only determination record: id + created_at only, immutable
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id" }
      - { name: reviewer_user_id, type: string, source: input, description: "X-User-ID (opaque) of the ProgramAnalyst who authored this review; pinned for four-eyes SoD" }
      - { name: eligibility_score, type: number, source: system, description: "Snapshot of Application.but_for_eligibility_score at review creation" }
      - { name: finding, type: enum, source: system, description: "PASS if eligibility_score >= program.but_for_pass_threshold else FAIL", constraints: "one of PASS, FAIL" }
      - { name: notes, type: string, source: input, default: "", description: "Analyst narrative" }

  - name: Agreement
    parent: null
    common_fields: true   # version is the OCC anchor
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id (must be APPROVED)" }
      - { name: program_id, type: string, source: system, description: "FK -> IncentiveProgram.id (copied from the source application)" }
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: incentive_type, type: enum, source: system, description: "Copied from program.incentive_type", constraints: "one of TIF, ABATEMENT, GRANT" }
      - { name: term_years, type: integer, source: input, description: "Incentive term in years; must be <= program.max_term_years" }
      - { name: awarded_jobs, type: integer, source: input, description: "Contractual job commitment baseline" }
      - { name: awarded_investment_cents, type: integer, source: input, description: "Contractual investment commitment baseline (cents)" }
      - { name: max_incentive_cents, type: integer, source: computed, description: "Award cap; see calc incentive_award_cap. Reserved into program.committed_cents at execution" }
      - { name: gross_disbursed_cents, type: integer, source: computed, default: 0, description: "Sum of every disbursed_amount_cents ever PAID against this agreement (never decreases)" }
      - { name: net_disbursed_cents, type: integer, source: computed, default: 0, description: "gross_disbursed_cents - clawed_back_cents (current cash out the door)" }
      - { name: clawed_back_cents, type: integer, source: computed, default: 0, description: "Sum of disbursed_amount_cents on disbursements that reached CLAWED_BACK" }
      - { name: effective_date, type: datetime, source: system, description: "Logical clock at execution (POST /agreements)" }
      - { name: status, type: enum, source: system, default: EXECUTED, description: "EXECUTED -> ACTIVE -> {COMPLETED | DEFAULTED}; DEFAULTED -> CLOSED", constraints: "one of EXECUTED, ACTIVE, COMPLETED, DEFAULTED, CLOSED" }

  - name: Covenant
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> Agreement.id" }
      - { name: covenant_type, type: enum, source: input, description: "JOBS | INVESTMENT — which metric the clawback covenant governs", constraints: "one of JOBS, INVESTMENT" }
      - { name: target_value, type: integer, source: input, description: "Target metric: job count (JOBS) or investment cents (INVESTMENT)" }
      - { name: measurement_start_date, type: datetime, source: input, description: "Closed-interval start of the covenant measurement window" }
      - { name: measurement_end_date, type: datetime, source: input, description: "Closed-interval end of the covenant measurement window (>= start)" }
      - { name: cure_period_days, type: integer, source: input, default: 0, description: "Grace days after a BREACHED finding before default may be declared" }
      - { name: attainment_pct, type: number, source: computed, default: 0, description: "actual/target*100 from the latest ACCEPTED report; see calc covenant_attainment_pct" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> {MET | BREACHED}; BREACHED -> MET (cure); {ACTIVE,BREACHED} -> WAIVED", constraints: "one of ACTIVE, MET, BREACHED, WAIVED" }

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> Agreement.id" }
      - { name: reporting_year, type: integer, source: input, description: "Calendar year the report covers" }
      - { name: period_start_date, type: datetime, source: input, description: "Half-open [start,end) reporting period start" }
      - { name: period_end_date, type: datetime, source: input, description: "Half-open [start,end) reporting period end (exclusive; > start)" }
      - { name: actual_jobs, type: integer, source: input, description: "Actual jobs certified for the period" }
      - { name: actual_investment_cents, type: integer, source: input, description: "Actual investment certified for the period (cents)" }
      - { name: attestation, type: boolean, source: input, default: false, description: "Recipient certification flag; acceptance requires true" }
      - { name: certified_by, type: string, source: system, description: "X-User-ID of the submitter when attestation is true" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> {ACCEPTED | RETURNED}; RETURNED -> SUBMITTED (resubmit cycle)", constraints: "one of SUBMITTED, RETURNED, ACCEPTED" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id" }
      - { name: compliance_report_id, type: string, source: input, description: "FK -> ComplianceReport.id (must be ACCEPTED) that justifies this disbursement" }
      - { name: period_year, type: integer, source: system, description: "Copied from the source ComplianceReport.reporting_year" }
      - { name: gross_entitlement_cents, type: integer, source: computed, description: "Pre-attainment period entitlement; see calc period_disbursement" }
      - { name: disbursed_amount_cents, type: integer, source: computed, description: "Final amount after attainment/type adjustment; see calc period_disbursement" }
      - { name: status, type: enum, source: system, default: CALCULATED, description: "CALCULATED -> APPROVED -> PAID; PAID -> CLAWED_BACK", constraints: "one of CALCULATED, APPROVED, PAID, CLAWED_BACK" }

  - name: RecaptureAssessment
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> Agreement.id" }
      - { name: trigger_reason, type: string, source: system, description: "Reason recorded when default was declared" }
      - { name: severity, type: enum, source: system, description: "PARTIAL -> pro-rata recapture; MATERIAL -> cliff (full) recapture", constraints: "one of PARTIAL, MATERIAL" }
      - { name: breached_covenants_count, type: integer, source: system, description: "Count of this agreement's covenants NOT in {MET, WAIVED} at default time" }
      - { name: total_covenants_count, type: integer, source: system, description: "Count of all covenants on this agreement at default time" }
      - { name: assessed_amount_cents, type: integer, source: computed, description: "Recapture owed; see calc recapture_amount" }
      - { name: status, type: enum, source: system, default: ASSESSED, description: "ASSESSED -> {DISPUTED | FINALIZED | WAIVED}; DISPUTED -> {ASSESSED | FINALIZED}", constraints: "one of ASSESSED, DISPUTED, FINALIZED, WAIVED" }

  - name: TransparencyDisclosure
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id" }
      - { name: disclosure_year, type: integer, source: input, description: "Year this public disclosure covers" }
      - { name: disclosed_recipient_name, type: string, source: computed, description: "Snapshot of the source application's applicant_name" }
      - { name: disclosed_incentive_type, type: enum, source: computed, description: "Snapshot of agreement.incentive_type", constraints: "one of TIF, ABATEMENT, GRANT" }
      - { name: disclosed_max_incentive_cents, type: integer, source: computed, description: "Snapshot of agreement.max_incentive_cents" }
      - { name: disclosed_net_disbursed_cents, type: integer, source: computed, description: "Snapshot of agreement.net_disbursed_cents at publication" }
      - { name: disclosed_jobs_committed, type: integer, source: computed, description: "Snapshot of agreement.awarded_jobs" }
      - { name: status, type: enum, source: system, default: PUBLISHED, description: "PUBLISHED on creation (public record)", constraints: "one of PUBLISHED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{applicationId}/submit"
        actor: Applicant
        preconditions:
          - "Acting Applicant owns the application (X-User-ID == applicant_user_id)"
        side_effects:
          - "Compute and store but_for_eligibility_score (calc but_for_eligibility_score)"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{applicationId}/start-review"
        actor: ProgramAnalyst
        preconditions: []
        side_effects:
          - "Create one EligibilityReview: eligibility_score = application.but_for_eligibility_score; finding = PASS if score >= program.but_for_pass_threshold else FAIL; reviewer_user_id = X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /applications/{applicationId}/approve"
        actor: ProgramDirector
        preconditions:
          - "A latest EligibilityReview exists for this application with finding == PASS (else ERR_ELIGIBILITY_NOT_PASSED)"
          - "Approving X-User-ID != that EligibilityReview.reviewer_user_id (four-eyes; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /applications/{applicationId}/deny"
        actor: ProgramDirector
        preconditions: []
        side_effects: []

  - entity: Agreement
    initial_state: EXECUTED
    terminal_states: [COMPLETED, CLOSED]
    transitions:
      - from: EXECUTED
        to: ACTIVE
        trigger: "POST /agreements/{agreementId}/activate"
        actor: ProgramDirector
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (bubble-up when every Covenant is in {MET, WAIVED} after a report is ACCEPTED)"
        actor: system
        preconditions:
          - "Agreement has >= 1 Covenant and all Covenants are in {MET, WAIVED}"
        side_effects:
          - "Release remaining reservation: program.committed_cents -= max_incentive_cents; program.available_budget_cents += max_incentive_cents (budget partition preserved)"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /agreements/{agreementId}/declare-default"
        actor: ProgramDirector
        preconditions:
          - "Agreement has >= 1 Covenant not in {MET, WAIVED} (else ERR_NO_BREACH_TO_DEFAULT)"
        side_effects:
          - "CASCADE-1 hop 1->2: every Covenant currently ACTIVE -> BREACHED"
          - "CASCADE-1 hop 2->3: the resulting set of not-{MET,WAIVED} covenants triggers creation of one RecaptureAssessment (status ASSESSED): severity from payload (default PARTIAL); breached_covenants_count = covenants not in {MET,WAIVED}; total_covenants_count = all covenants; assessed_amount_cents per calc recapture_amount"
      - from: DEFAULTED
        to: CLOSED
        trigger: "system (on RecaptureAssessment FINALIZED)"
        actor: system
        preconditions: []
        side_effects:
          - "Release remaining reservation: program.committed_cents -= max_incentive_cents; program.available_budget_cents += max_incentive_cents"

  - entity: Covenant
    initial_state: ACTIVE
    terminal_states: [MET, WAIVED]
    transitions:
      - from: ACTIVE
        to: MET
        trigger: "system (on ComplianceReport ACCEPTED when attainment_pct >= 100.00)"
        actor: system
        preconditions:
          - "Latest ACCEPTED report yields attainment_pct >= 100.00"
        side_effects:
          - "CASCADE-2 hop 2->3: if all covenants now in {MET, WAIVED}, bubble Agreement ACTIVE -> COMPLETED"
      - from: ACTIVE
        to: BREACHED
        trigger: "system (on ComplianceReport ACCEPTED when attainment_pct < 100.00, or via declare-default)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BREACHED
        to: MET
        trigger: "system (on a later ComplianceReport ACCEPTED within cure window when attainment_pct >= 100.00)"
        actor: system
        preconditions:
          - "clock <= measurement_end_date + cure_period_days"
        side_effects:
          - "CASCADE-2 hop 2->3: if all covenants now in {MET, WAIVED}, bubble Agreement ACTIVE -> COMPLETED"
      - from: ACTIVE
        to: WAIVED
        trigger: "POST /covenants/{covenantId}/waive"
        actor: ProgramDirector
        preconditions: []
        side_effects: []
      - from: BREACHED
        to: WAIVED
        trigger: "POST /covenants/{covenantId}/waive"
        actor: ProgramDirector
        preconditions: []
        side_effects: []

  - entity: ComplianceReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /compliance-reports/{reportId}/accept"
        actor: ProgramAnalyst
        preconditions:
          - "attestation == true (else ERR_REPORT_NOT_CERTIFIED)"
          - "period [period_start_date, period_end_date) does not overlap any other ACCEPTED report on the same agreement (else ERR_REPORTING_PERIOD_OVERLAP)"
        side_effects:
          - "CASCADE-2 hop 1->2: recompute each governing Covenant.attainment_pct (calc covenant_attainment_pct) and transition ACTIVE/BREACHED covenants to MET or BREACHED"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /compliance-reports/{reportId}/return"
        actor: ProgramAnalyst
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /compliance-reports/{reportId}/resubmit"
        actor: Applicant
        preconditions:
          - "Acting Applicant owns the agreement's application"
        side_effects: []

  - entity: Disbursement
    initial_state: CALCULATED
    terminal_states: [CLAWED_BACK]
    transitions:
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /disbursements/{disbursementId}/approve"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /disbursements/{disbursementId}/pay"
        actor: ComplianceOfficer
        preconditions:
          - "gross_disbursed_cents + disbursed_amount_cents <= agreement.max_incentive_cents (else ERR_DISBURSEMENT_EXCEEDS_CAP)"
        side_effects:
          - "agreement.gross_disbursed_cents += disbursed_amount_cents; agreement.net_disbursed_cents += disbursed_amount_cents"
          - "program.committed_cents -= disbursed_amount_cents; program.disbursed_cents += disbursed_amount_cents (budget partition preserved)"
          - "increments Agreement.version by 1"
      - from: PAID
        to: CLAWED_BACK
        trigger: "system (on RecaptureAssessment FINALIZED)"
        actor: system
        preconditions: []
        side_effects:
          - "agreement.net_disbursed_cents -= disbursed_amount_cents; agreement.clawed_back_cents += disbursed_amount_cents (gross unchanged: ledger partition preserved)"
          - "program.disbursed_cents -= disbursed_amount_cents; program.available_budget_cents += disbursed_amount_cents"

  - entity: RecaptureAssessment
    initial_state: ASSESSED
    terminal_states: [FINALIZED, WAIVED]
    transitions:
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /recapture-assessments/{assessmentId}/dispute"
        actor: Applicant
        preconditions:
          - "Acting Applicant owns the agreement's application"
        side_effects: []
      - from: DISPUTED
        to: ASSESSED
        trigger: "POST /recapture-assessments/{assessmentId}/finalize with reopen=true — routes back to ASSESSED for re-review"
        actor: ComplianceOfficer
        preconditions: []
        note: "reopen loop: officer may bounce a disputed assessment back to ASSESSED before finalizing"
        side_effects: []
      - from: ASSESSED
        to: FINALIZED
        trigger: "POST /recapture-assessments/{assessmentId}/finalize"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "CASCADE (recapture): every PAID Disbursement on the agreement -> CLAWED_BACK (each hop updates agreement ledger + program budget per Disbursement PAID->CLAWED_BACK)"
          - "bubble Agreement DEFAULTED -> CLOSED"
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /recapture-assessments/{assessmentId}/finalize"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "same as ASSESSED -> FINALIZED"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /recapture-assessments/{assessmentId}/waive"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "bubble Agreement DEFAULTED -> CLOSED (no clawback)"
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /recapture-assessments/{assessmentId}/waive"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "bubble Agreement DEFAULTED -> CLOSED (no clawback)"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on Agreement.version only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: disbursement-create-stale-agreement
    parent_entity: Agreement
    write_endpoint: "POST /disbursements"
    occ_field: "expected_agreement_version"
    description: |
      Creating a Disbursement against an Agreement whose version has advanced
      since the client last observed it is rejected. A disbursement's entitlement
      is computed against the agreement's current cumulative disbursed ledger; if
      another writer has already created a disbursement for a period (legitimately
      advancing the agreement and its ledger), the current writer's view is stale
      and the create is refused so it cannot double-count against an outdated
      cumulative balance.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: but_for_eligibility_score
    trigger: "Application submit (POST /applications/{id}/submit); snapshotted into EligibilityReview at start-review"
    algorithm: weighted_scoring
    formula: |
      # >=3 inputs with non-linear min-caps and conditional additions (combinatorial mode (a))
      jobs_component = min(30, 30 * proposed_jobs / program.min_jobs_required)
      inv_component  = min(30, 30 * proposed_investment_cents / program.min_investment_cents)
      but_for_bonus  = 25 if but_for_attested else 0
      distress_bonus = 15 if distress_zone else 0
      score = round_half_up(jobs_component + inv_component + but_for_bonus + distress_bonus, 2)
      # PASS when score >= program.but_for_pass_threshold (boundary is inclusive >=)
    input_set: "Single Application plus its program's min_jobs_required, min_investment_cents, but_for_pass_threshold"
    constants:
      JOBS_WEIGHT: 30
      INVESTMENT_WEIGHT: 30
      BUT_FOR_BONUS: 25
      DISTRESS_BONUS: 15
    precision: "2 decimal places, round_half_up"

  - name: incentive_award_cap
    trigger: "Agreement execution (POST /agreements)"
    algorithm: tiered_pricing
    formula: |
      # Branch on program.incentive_type; ABATEMENT/TIF sum PER-YEAR ROUNDED amounts
      # (combinatorial mode (b): rounding order is pinned to round-per-year THEN sum).
      if incentive_type == GRANT:
        cap = awarded_jobs * program.grant_per_job_cents
      elif incentive_type == ABATEMENT:
        per_year = round_half_up(parcel.current_assessed_value_cents * program.abatement_rate_pct / 100)
        cap = sum(per_year for y in 1..term_years)        # == per_year * term_years
      elif incentive_type == TIF:
        increment = max(0, parcel.current_assessed_value_cents - parcel.base_assessed_value_cents)
        per_year = round_half_up(increment * program.tif_capture_pct / 100)
        cap = sum(per_year for y in 1..term_years)
      # ROUNDING ORDER (pinned): round each year's amount to whole cents FIRST, then sum.
      # Summing raw then rounding once (sum-then-round) is INCORRECT and can differ by cents.
    input_set: "One Agreement, its Parcel, and its Program config for the matching incentive_type"
    constants: {}
    precision: "whole cents, round_half_up per year before summation"
    variants:
      - name: abatement_round_then_sum
        when: "incentive_type == ABATEMENT or TIF"
        difference: "per-year amount rounded to cents before summation; total != round(sum of raw per-year amounts)"

  - name: period_disbursement
    trigger: "Disbursement creation (POST /disbursements) against an ACCEPTED ComplianceReport"
    algorithm: forward_looking
    formula: |
      per_period_base = round_half_up(agreement.max_incentive_cents / agreement.term_years)
      if agreement.incentive_type == GRANT:
        # provisional variant assumes full attainment; final variant uses the report's actuals
        attainment_ratio = min(1.0, report.actual_jobs / agreement.awarded_jobs)
        gross_entitlement_cents = per_period_base
        disbursed_amount_cents  = round_half_up(per_period_base * attainment_ratio)
      else:  # ABATEMENT or TIF — automatic, not attainment-adjusted
        gross_entitlement_cents = per_period_base
        disbursed_amount_cents  = per_period_base
    input_set: "One Agreement (max_incentive_cents, term_years, incentive_type, awarded_jobs) and one ACCEPTED ComplianceReport (actual_jobs)"
    constants: {}
    precision: "whole cents, round_half_up"
    variants:
      - name: grant_provisional_vs_final
        when: "incentive_type == GRANT"
        difference: "provisional (per_period_base, full-attainment assumption at execution) vs final (per_period_base * min(1, actual_jobs/awarded_jobs) at disbursement) diverge whenever actual_jobs < awarded_jobs"

  - name: recapture_amount
    trigger: "declare-default cascade (creation of RecaptureAssessment)"
    algorithm: dual_variant
    formula: |
      if severity == MATERIAL:
        assessed_amount_cents = agreement.net_disbursed_cents          # cliff: full recapture
      else:  # PARTIAL
        assessed_amount_cents = round_half_up(
            agreement.net_disbursed_cents * breached_covenants_count / total_covenants_count)  # pro-rata
    input_set: "One Agreement (net_disbursed_cents) and covenant counts at default time"
    constants: {}
    precision: "whole cents, round_half_up"
    variants:
      - name: cliff_vs_prorata_recapture
        when: "MATERIAL default vs PARTIAL default"
        difference: "MATERIAL recaptures 100% of net_disbursed_cents; PARTIAL recaptures net_disbursed_cents * (breached/total); differ whenever breached < total"

  - name: covenant_attainment_pct
    trigger: "ComplianceReport ACCEPTED (cascade hop 1->2)"
    algorithm: threshold
    formula: |
      actual = report.actual_jobs if covenant_type == JOBS else report.actual_investment_cents
      attainment_pct = round_half_up(actual / covenant.target_value * 100, 2)
      # MET when attainment_pct >= 100.00 (inclusive boundary); else BREACHED
    input_set: "One Covenant and the latest ACCEPTED ComplianceReport on the same agreement"
    constants:
      MET_THRESHOLD_PCT: 100.00
    precision: "2 decimal places, round_half_up"

  - name: program_budget_partition
    trigger: "Agreement execute; Disbursement pay; RecaptureAssessment finalize (clawback); Agreement complete/close"
    algorithm: aggregation
    formula: |
      # INVARIANT (conserved quantity #1): total_budget_cents is constant and always equals the partition.
      available_budget_cents + committed_cents + disbursed_cents == total_budget_cents
      # execute:  committed += max_incentive_cents; available -= max_incentive_cents
      # pay:      committed -= disbursed_amount_cents; disbursed += disbursed_amount_cents
      # clawback: disbursed -= disbursed_amount_cents; available += disbursed_amount_cents
      # complete/close: committed -= remaining max_incentive_cents; available += remaining
    input_set: "One IncentiveProgram and all its Agreements/Disbursements"
    constants: {}
    precision: "whole cents (exact integer partition)"

  - name: agreement_disbursement_ledger
    trigger: "Disbursement pay (forward); Disbursement clawback (compensating)"
    algorithm: aggregation
    formula: |
      # INVARIANT (conserved quantity #2): gross is monotonic; net+clawed_back reconstruct it.
      gross_disbursed_cents == net_disbursed_cents + clawed_back_cents
      # pay:      gross += x; net += x
      # clawback: net -= x; clawed_back += x   (gross unchanged)
    input_set: "One Agreement and its Disbursements"
    constants: {}
    precision: "whole cents (exact integer partition)"

  - name: portfolio_dashboard
    trigger: "GET /portfolio/summary"
    algorithm: aggregation
    formula: |
      active_agreement_count      = count(Agreement.status == ACTIVE)
      defaulted_agreement_count   = count(Agreement.status == DEFAULTED)
      total_committed_cents       = sum(IncentiveProgram.committed_cents)
      total_disbursed_cents       = sum(IncentiveProgram.disbursed_cents)
      total_recaptured_cents      = sum(RecaptureAssessment.assessed_amount_cents where status == FINALIZED)
      # counts/sums pinned over explicit status filters; no id-based ordering.
    input_set: "All IncentiveProgram, Agreement, RecaptureAssessment rows filtered by the stated statuses"
    constants: {}
    precision: "whole cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every resource id in the path exists, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: all path-parameterized endpoints
  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, integers non-negative, measurement_end_date >= measurement_start_date, period_end_date > period_start_date, term_years >= 1"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all write endpoints
  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is legal"
    error_id: "ERR_<ENTITY>_INVALID_STATE (specific per entity)"
    http_status: 409
    applies_to: all transition endpoints
  - priority: 6
    category: concurrency
    check: "expected_agreement_version matches Agreement.version (OCC)"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /disbursements"
  - priority: 7
    category: business_safety
    check: "Four-eyes: approving user must differ from the EligibilityReview.reviewer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /applications/{applicationId}/approve"
  - priority: 8
    category: business_referential
    check: "Cross-entity precondition on a linked entity's state (e.g. approve needs a PASS EligibilityReview; execute needs an APPROVED Application; disbursement needs an ACCEPTED ComplianceReport)"
    error_id: "ERR_ELIGIBILITY_NOT_PASSED | ERR_APPLICATION_NOT_APPROVED | ERR_NO_ACCEPTED_REPORT"
    http_status: 409
    applies_to: "POST /applications/{id}/approve, POST /agreements, POST /disbursements"
  - priority: 9
    category: business_constraint
    check: "Domain constraint: report attestation true before accept; covenant target >= program minimum for its type"
    error_id: "ERR_REPORT_NOT_CERTIFIED | ERR_COVENANT_TARGET_BELOW_MINIMUM"
    http_status: 422
    applies_to: "POST /compliance-reports/{id}/accept, POST /agreements/{id}/covenants"
  - priority: 10
    category: business_temporal
    check: "Interval-overlap rejection: covenant measurement windows (closed) of same covenant_type must not overlap; report periods (half-open) must not overlap accepted periods"
    error_id: "ERR_COVENANT_WINDOW_OVERLAP | ERR_REPORTING_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "POST /agreements/{id}/covenants, POST /compliance-reports/{id}/accept"
  - priority: 11
    category: business_fiscal
    check: "Fiscal capacity: program.available_budget_cents >= award cap at execution; cumulative disbursed + this disbursement <= agreement.max_incentive_cents at pay"
    error_id: "ERR_PROGRAM_BUDGET_EXCEEDED | ERR_DISBURSEMENT_EXCEEDS_CAP"
    http_status: 402
    applies_to: "POST /agreements, POST /disbursements/{id}/pay"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- IncentiveProgram ---
  - method: POST
    path: "/incentive-programs"
    description: "Create an incentive program (funding pool + rate config)"
    roles: [ProgramDirector]
    code: 201
    input: [program_name, incentive_type, total_budget_cents, min_jobs_required, min_investment_cents, max_term_years, abatement_rate_pct, grant_per_job_cents, tif_capture_pct, "but_for_pass_threshold?", "disclosure_threshold_cents?"]
    output: IncentiveProgram
    side_effects: ["committed_cents=0, disbursed_cents=0, available_budget_cents=total_budget_cents"]
  - method: GET
    path: "/incentive-programs"
    description: "List incentive programs (paginated)"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer, PublicViewer]
    code: 200
    input: ["incentive_type?", "limit?", "offset?"]
    output: "IncentiveProgram[]"
    side_effects: []
  - method: GET
    path: "/incentive-programs/{programId}"
    description: "Get one incentive program"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer, PublicViewer]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: []

  # --- Parcel ---
  - method: POST
    path: "/parcels"
    description: "Register a parcel with base and current assessed values"
    roles: [ProgramDirector]
    code: 201
    input: [parcel_identifier, jurisdiction, base_assessed_value_cents, current_assessed_value_cents]
    output: Parcel
    side_effects: []
  - method: GET
    path: "/parcels"
    description: "List parcels (paginated)"
    roles: [ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Parcel[]"
    side_effects: []
  - method: GET
    path: "/parcels/{parcelId}"
    description: "Get one parcel"
    roles: [ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/applications"
    description: "Create an incentive application (DRAFT)"
    roles: [Applicant]
    code: 201
    input: [program_id, applicant_user_id, applicant_name, proposed_jobs, proposed_investment_cents, "but_for_attested?", "distress_zone?"]
    output: Application
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/applications"
    description: "List/filter applications; reverse-reachability for Application.program_id"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: ["program_id?", "applicant_user_id?", "status?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []
  - method: GET
    path: "/applications/{applicationId}"
    description: "Get one application"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/applications/{applicationId}/submit"
    description: "Submit a DRAFT application (DRAFT/RETURNED-equivalent -> SUBMITTED)"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["compute but_for_eligibility_score", "status DRAFT -> SUBMITTED"]
  - method: POST
    path: "/applications/{applicationId}/start-review"
    description: "Begin review; creates the EligibilityReview (SUBMITTED -> UNDER_REVIEW)"
    roles: [ProgramAnalyst]
    code: 201
    input: ["notes?"]
    output: EligibilityReview
    side_effects: ["create EligibilityReview (finding PASS/FAIL from score vs threshold)", "application status SUBMITTED -> UNDER_REVIEW"]
  - method: POST
    path: "/applications/{applicationId}/approve"
    description: "Approve (UNDER_REVIEW -> APPROVED); enforces PASS review + four-eyes SoD"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Application
    side_effects: ["status UNDER_REVIEW -> APPROVED"]
  - method: POST
    path: "/applications/{applicationId}/deny"
    description: "Deny (UNDER_REVIEW -> DENIED)"
    roles: [ProgramDirector]
    code: 200
    input: ["reason?"]
    output: Application
    side_effects: ["status UNDER_REVIEW -> DENIED"]

  # --- EligibilityReview ---
  - method: GET
    path: "/eligibility-reviews"
    description: "List/filter eligibility reviews; reverse-reachability for EligibilityReview.application_id"
    roles: [ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: "EligibilityReview[]"
    side_effects: []
  - method: GET
    path: "/eligibility-reviews/{reviewId}"
    description: "Get one eligibility review"
    roles: [ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: []
    output: EligibilityReview
    side_effects: []

  # --- Agreement ---
  - method: POST
    path: "/agreements"
    description: "Execute an agreement from an APPROVED application (EXECUTED). Computes award cap and reserves budget"
    roles: [ProgramDirector]
    code: 201
    input: [application_id, parcel_id, term_years, awarded_jobs, awarded_investment_cents]
    output: Agreement
    side_effects: ["copy program_id + incentive_type from application/program", "compute max_incentive_cents (calc incentive_award_cap)", "program.committed_cents += max_incentive_cents; available -= max_incentive_cents", "set effective_date = clock", "status=EXECUTED"]
  - method: GET
    path: "/agreements"
    description: "List/filter agreements; reverse-reachability for Agreement.application_id, program_id, parcel_id"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: ["program_id?", "application_id?", "parcel_id?", "status?", "limit?", "offset?"]
    output: "Agreement[]"
    side_effects: []
  - method: GET
    path: "/agreements/{agreementId}"
    description: "Get one agreement"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: []
    output: Agreement
    side_effects: []
  - method: POST
    path: "/agreements/{agreementId}/activate"
    description: "Activate (EXECUTED -> ACTIVE)"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Agreement
    side_effects: ["status EXECUTED -> ACTIVE", "increments Agreement.version by 1"]
  - method: POST
    path: "/agreements/{agreementId}/declare-default"
    description: "Declare default (ACTIVE -> DEFAULTED); cascade breaches covenants and creates a RecaptureAssessment"
    roles: [ProgramDirector]
    code: 200
    input: ["severity?", "reason?"]
    output: Agreement
    side_effects: ["CASCADE-1: covenants ACTIVE -> BREACHED; create RecaptureAssessment (ASSESSED) with recapture_amount", "status ACTIVE -> DEFAULTED", "increments Agreement.version by 1"]

  # --- Covenant ---
  - method: POST
    path: "/agreements/{agreementId}/covenants"
    description: "Attach a job/investment clawback covenant to an agreement"
    roles: [ProgramDirector]
    code: 201
    input: [covenant_type, target_value, measurement_start_date, measurement_end_date, "cure_period_days?"]
    output: Covenant
    side_effects: ["status=ACTIVE", "increments Agreement.version by 1"]
  - method: GET
    path: "/covenants"
    description: "List/filter covenants; reverse-reachability for Covenant.agreement_id"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: ["agreement_id?", "covenant_type?", "status?", "limit?", "offset?"]
    output: "Covenant[]"
    side_effects: []
  - method: GET
    path: "/covenants/{covenantId}"
    description: "Get one covenant"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: []
    output: Covenant
    side_effects: []
  - method: POST
    path: "/covenants/{covenantId}/waive"
    description: "Waive a covenant ({ACTIVE,BREACHED} -> WAIVED)"
    roles: [ProgramDirector]
    code: 200
    input: ["reason?"]
    output: Covenant
    side_effects: ["status -> WAIVED", "if all covenants now in {MET,WAIVED} bubble Agreement -> COMPLETED"]

  # --- ComplianceReport ---
  - method: POST
    path: "/agreements/{agreementId}/compliance-reports"
    description: "Submit an annual compliance report (SUBMITTED)"
    roles: [Applicant]
    code: 201
    input: [reporting_year, period_start_date, period_end_date, actual_jobs, actual_investment_cents, "attestation?"]
    output: ComplianceReport
    side_effects: ["certified_by = X-User-ID when attestation true", "status=SUBMITTED"]
  - method: GET
    path: "/compliance-reports"
    description: "List/filter compliance reports; reverse-reachability for ComplianceReport.agreement_id"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "ComplianceReport[]"
    side_effects: []
  - method: GET
    path: "/compliance-reports/{reportId}"
    description: "Get one compliance report"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []
  - method: POST
    path: "/compliance-reports/{reportId}/accept"
    description: "Accept a report (SUBMITTED -> ACCEPTED); cascade re-evaluates covenants"
    roles: [ProgramAnalyst]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["CASCADE-2: recompute covenant attainment; covenants -> MET/BREACHED; possible Agreement -> COMPLETED", "status SUBMITTED -> ACCEPTED"]
  - method: POST
    path: "/compliance-reports/{reportId}/return"
    description: "Return a report for correction (SUBMITTED -> RETURNED)"
    roles: [ProgramAnalyst]
    code: 200
    input: ["reason?"]
    output: ComplianceReport
    side_effects: ["status SUBMITTED -> RETURNED"]
  - method: POST
    path: "/compliance-reports/{reportId}/resubmit"
    description: "Resubmit a returned report (RETURNED -> SUBMITTED)"
    roles: [Applicant]
    code: 200
    input: ["actual_jobs?", "actual_investment_cents?", "attestation?"]
    output: ComplianceReport
    side_effects: ["status RETURNED -> SUBMITTED"]

  # --- Disbursement ---
  - method: POST
    path: "/disbursements"
    description: "Create a period disbursement against an ACCEPTED report (CALCULATED). OCC-guarded on Agreement.version"
    roles: [ComplianceOfficer]
    code: 201
    input: [agreement_id, compliance_report_id, expected_agreement_version]
    output: Disbursement
    side_effects: ["compute gross_entitlement_cents + disbursed_amount_cents (calc period_disbursement)", "period_year = report.reporting_year", "status=CALCULATED", "increments Agreement.version by 1"]
  - method: GET
    path: "/disbursements"
    description: "List/filter disbursements; reverse-reachability for Disbursement.agreement_id and compliance_report_id"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: ["agreement_id?", "compliance_report_id?", "status?", "limit?", "offset?"]
    output: "Disbursement[]"
    side_effects: []
  - method: GET
    path: "/disbursements/{disbursementId}"
    description: "Get one disbursement"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: []
  - method: POST
    path: "/disbursements/{disbursementId}/approve"
    description: "Approve a disbursement (CALCULATED -> APPROVED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status CALCULATED -> APPROVED"]
  - method: POST
    path: "/disbursements/{disbursementId}/pay"
    description: "Pay a disbursement (APPROVED -> PAID); updates agreement + program ledgers"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["cap check ERR_DISBURSEMENT_EXCEEDS_CAP", "agreement gross/net += amount; program committed -= amount, disbursed += amount", "status APPROVED -> PAID", "increments Agreement.version by 1"]

  # --- RecaptureAssessment ---
  - method: GET
    path: "/recapture-assessments"
    description: "List/filter recapture assessments; reverse-reachability for RecaptureAssessment.agreement_id"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "RecaptureAssessment[]"
    side_effects: []
  - method: GET
    path: "/recapture-assessments/{assessmentId}"
    description: "Get one recapture assessment"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer]
    code: 200
    input: []
    output: RecaptureAssessment
    side_effects: []
  - method: POST
    path: "/recapture-assessments/{assessmentId}/dispute"
    description: "Dispute an assessment (ASSESSED -> DISPUTED)"
    roles: [Applicant]
    code: 200
    input: ["grounds?"]
    output: RecaptureAssessment
    side_effects: ["status ASSESSED -> DISPUTED"]
  - method: POST
    path: "/recapture-assessments/{assessmentId}/finalize"
    description: "Finalize (ASSESSED/DISPUTED -> FINALIZED, or reopen DISPUTED -> ASSESSED); cascade claws back disbursements and closes agreement"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reopen?"]
    output: RecaptureAssessment
    side_effects: ["if reopen: DISPUTED -> ASSESSED", "else CASCADE: PAID disbursements -> CLAWED_BACK; Agreement DEFAULTED -> CLOSED"]
  - method: POST
    path: "/recapture-assessments/{assessmentId}/waive"
    description: "Waive an assessment ({ASSESSED,DISPUTED} -> WAIVED); closes agreement without clawback"
    roles: [ProgramDirector]
    code: 200
    input: ["reason?"]
    output: RecaptureAssessment
    side_effects: ["status -> WAIVED; Agreement DEFAULTED -> CLOSED"]

  # --- TransparencyDisclosure ---
  - method: POST
    path: "/agreements/{agreementId}/disclosures"
    description: "Publish a transparency disclosure snapshot for an agreement"
    roles: [ComplianceOfficer]
    code: 201
    input: [disclosure_year]
    output: TransparencyDisclosure
    side_effects: ["snapshot recipient/type/max_incentive/net_disbursed/jobs from agreement+application", "status=PUBLISHED"]
  - method: GET
    path: "/disclosures"
    description: "List/filter published disclosures (public); reverse-reachability for TransparencyDisclosure.agreement_id"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer, PublicViewer]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "TransparencyDisclosure[]"
    side_effects: []
  - method: GET
    path: "/disclosures/{disclosureId}"
    description: "Get one disclosure (public)"
    roles: [Applicant, ProgramAnalyst, ProgramDirector, ComplianceOfficer, PublicViewer]
    code: 200
    input: []
    output: TransparencyDisclosure
    side_effects: []

  # --- Portfolio dashboard (computed read) ---
  - method: GET
    path: "/portfolio/summary"
    description: "Portfolio dashboard: aggregate counts and cent totals (calc portfolio_dashboard)"
    roles: [ProgramAnalyst, ProgramDirector, ComplianceOfficer, PublicViewer]
    code: 200
    input: ["program_id?"]
    output: "{ active_agreement_count: integer, defaulted_agreement_count: integer, total_committed_cents: integer, total_disbursed_cents: integer, total_recaptured_cents: integer }"
    side_effects: []

  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z (before every default fixture date); the clock never falls back to wall-clock time"
    roles: [ProgramDirector, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, negative amount, end<start, term_years<1" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "IncentiveProgram id not found" }
  - { id: ERR_PARCEL_NOT_FOUND, http: 404, condition: "Parcel id not found" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Application id not found" }
  - { id: ERR_ELIGIBILITY_REVIEW_NOT_FOUND, http: 404, condition: "EligibilityReview id not found" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "Agreement id not found" }
  - { id: ERR_COVENANT_NOT_FOUND, http: 404, condition: "Covenant id not found" }
  - { id: ERR_COMPLIANCE_REPORT_NOT_FOUND, http: 404, condition: "ComplianceReport id not found" }
  - { id: ERR_DISBURSEMENT_NOT_FOUND, http: 404, condition: "Disbursement id not found" }
  - { id: ERR_RECAPTURE_ASSESSMENT_NOT_FOUND, http: 404, condition: "RecaptureAssessment id not found" }
  - { id: ERR_DISCLOSURE_NOT_FOUND, http: 404, condition: "TransparencyDisclosure id not found" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Application not in a legal state for submit/start-review/approve/deny" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Agreement not in a legal state for activate/declare-default/execute-source/disclosure" }
  - { id: ERR_COVENANT_INVALID_STATE, http: 409, condition: "Covenant not in {ACTIVE,BREACHED} for waive" }
  - { id: ERR_COMPLIANCE_REPORT_INVALID_STATE, http: 409, condition: "ComplianceReport not in a legal state for accept/return/resubmit" }
  - { id: ERR_DISBURSEMENT_INVALID_STATE, http: 409, condition: "Disbursement not in a legal state for approve/pay" }
  - { id: ERR_RECAPTURE_INVALID_STATE, http: 409, condition: "RecaptureAssessment not in a legal state for dispute/finalize/waive" }
  - { id: ERR_ELIGIBILITY_NOT_PASSED, http: 409, condition: "Approve requires a latest EligibilityReview with finding PASS" }
  - { id: ERR_APPLICATION_NOT_APPROVED, http: 409, condition: "Execute agreement requires the source Application in status APPROVED" }
  - { id: ERR_NO_ACCEPTED_REPORT, http: 409, condition: "Disbursement requires the linked ComplianceReport in status ACCEPTED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approving user is the same as the EligibilityReview reviewer (four-eyes violation)" }
  - { id: ERR_REPORT_NOT_CERTIFIED, http: 422, condition: "Accept requires report attestation == true" }
  - { id: ERR_COVENANT_TARGET_BELOW_MINIMUM, http: 422, condition: "Covenant target_value below program minimum for its covenant_type" }
  - { id: ERR_COVENANT_WINDOW_OVERLAP, http: 409, condition: "New covenant measurement window overlaps an existing covenant of the same covenant_type on this agreement" }
  - { id: ERR_REPORTING_PERIOD_OVERLAP, http: 409, condition: "Report period overlaps an already-ACCEPTED report period on this agreement" }
  - { id: ERR_NO_BREACH_TO_DEFAULT, http: 409, condition: "declare-default requires >= 1 covenant not in {MET,WAIVED}" }
  - { id: ERR_PROGRAM_BUDGET_EXCEEDED, http: 402, condition: "Award cap exceeds program.available_budget_cents at execution" }
  - { id: ERR_DISBURSEMENT_EXCEEDS_CAP, http: 402, condition: "Cumulative disbursed + this disbursement exceeds agreement.max_incentive_cents at pay" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version does not match Agreement.version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Incentive seeker/recipient; owns applications and files compliance reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /applications"
      - "POST /applications/{id}/submit"
      - "POST /agreements/{id}/compliance-reports"
      - "POST /compliance-reports/{id}/resubmit"
      - "POST /recapture-assessments/{id}/dispute"
    shared_operations:
      - "GET (own applications, agreements, covenants, reports, disbursements, recapture-assessments, disclosures)"
  - name: ProgramAnalyst
    description: "Reviews applications and compliance reports; authors eligibility findings"
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/start-review"
      - "POST /compliance-reports/{id}/accept"
      - "POST /compliance-reports/{id}/return"
    shared_operations:
      - "GET reads across the review/compliance surface"
  - name: ProgramDirector
    description: "Approves deals and governs agreements/covenants; declares default; waives"
    identity: "opaque"
    exclusive_operations:
      - "POST /incentive-programs"
      - "POST /parcels"
      - "POST /applications/{id}/approve"
      - "POST /applications/{id}/deny"
      - "POST /agreements"
      - "POST /agreements/{id}/activate"
      - "POST /agreements/{id}/declare-default"
      - "POST /agreements/{id}/covenants"
      - "POST /covenants/{id}/waive"
      - "POST /recapture-assessments/{id}/waive"
    shared_operations:
      - "GET reads; POST /_clock/set_current_utc"
  - name: ComplianceOfficer
    description: "Calculates/approves/pays disbursements; finalizes recapture; publishes disclosures"
    identity: "opaque"
    exclusive_operations:
      - "POST /disbursements"
      - "POST /disbursements/{id}/approve"
      - "POST /disbursements/{id}/pay"
      - "POST /recapture-assessments/{id}/finalize"
      - "POST /agreements/{id}/disclosures"
    shared_operations:
      - "GET reads; POST /_clock/set_current_utc"
  - name: PublicViewer
    description: "Public transparency consumer; read-only on disclosures, programs, portfolio"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /incentive-programs, GET /incentive-programs/{id}"
      - "GET /disclosures, GET /disclosures/{id}"
      - "GET /portfolio/summary"
