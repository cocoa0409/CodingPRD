            - { call: "POST /api/dossier-items/${item_lk}/withdraw", as: Candidate, as_user_id: "${cand_lk}" }
          trigger:
            - { call: "POST /api/clock-extensions/${ext_lk}/approve", as: ProvostOfficer, captures: { err_lk1: $.data.error_id } }
            - { call: "POST /api/midterm-reviews/${mid_lk}/complete", payload: { outcome: "CONCERNS" }, as: ProvostOfficer, captures: { err_lk2: $.data.error_id } }
