    roles: [BoardAnalyst]
    code: 201
    input: [period_start, period_end]
    output: BoardReport
    side_effects: ["every aggregate computed by calculations.board_report_rollup", "status set to DRAFT"]

  - method: GET
    path: "/board-reports/{id}"
    description: "Reads one board report including the by-reason lost-business breakdown."
    roles: [BureauAdmin, BoardAnalyst]
    code: 200
    input: []
    output: BoardReport
    side_effects: []

  - method: GET
    path: "/board-reports"
    description: "Lists board reports with an optional status filter and offset pagination."
    roles: [BureauAdmin, BoardAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BoardReport[]
    side_effects: []

  - method: POST
    path: "/board-reports/{id}/publish"
    description: "Publishes a DRAFT report, freezing every aggregate against later data changes."
    roles: [BoardAnalyst]
    code: 200
    input: []
    output: BoardReport
    side_effects: ["status DRAFT -> PUBLISHED and published_at stamped from the logical clock", "no aggregate is ever recomputed afterwards"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, empty, or naming a role not declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource it does not own - HotelPartner whose X-User-ID differs from the commitment's hotel_id, or MeetingPlanner whose X-User-ID differs from the opportunity's planner_id"
  - id: ERR_VALIDATION
    http: 400
    condition: "request body violates the endpoint's input schema: missing required field, unknown enum member, malformed date or ISO-8601 instant, money with more than 2 fraction digits, out-of-range integer, arrival_date >= departure_date, move_in_start >= move_out_end, window_start >= window_end, period_start >= period_end, or pagination limit outside [1, 100]"

  # --- existence -------------------------------------------------------------
  - id: ERR_PLANNER_NOT_FOUND
    http: 404
    condition: "no MeetingPlanner with the given id (path or planner_id body field)"
  - id: ERR_HOTEL_NOT_FOUND
    http: 404
    condition: "no Hotel with the given id (path or hotel_id body field)"
  - id: ERR_HALL_NOT_FOUND
    http: 404
    condition: "no CenterHall with the given id (path or center_hall_id body field)"
  - id: ERR_OPPORTUNITY_NOT_FOUND
    http: 404
    condition: "no Opportunity with the given id (path, opportunity_id, or supersedes_opportunity_id body field)"
  - id: ERR_SPACE_HOLD_NOT_FOUND
    http: 404
    condition: "no SpaceHold with the given id (path or challenging_space_hold_id body field)"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "no RoomBlockCommitment with the given id"
  - id: ERR_BID_PACKAGE_NOT_FOUND
    http: 404
    condition: "no BidPackage with the given id"
  - id: ERR_FUND_NOT_FOUND
    http: 404
    condition: "no IncentiveFund with the given id (path or fund_id body field)"
  - id: ERR_SERVICING_ORDER_NOT_FOUND
    http: 404
    condition: "no ServicingOrder with the given id"
  - id: ERR_BOARD_REPORT_NOT_FOUND
    http: 404
    condition: "no BoardReport with the given id"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_OPPORTUNITY_VERSION
    http: 412
    condition: "expected_opportunity_version does not equal the target Opportunity.version on POST /bid-packages or POST /room-block-commitments"
  - id: ERR_STALE_FUND_VERSION
    http: 412
    condition: "expected_fund_version does not equal the target IncentiveFund.version on POST /bid-packages/{id}/incentive-decisions"

  # --- state preconditions ---------------------------------------------------
  - id: ERR_INVALID_OPPORTUNITY_STAGE
    http: 409
    condition: "the opportunity's sales_stage is not a declared from-state of the requested transition (e.g. qualifying an already QUALIFIED lead, holding space for a LEAD, or opening a servicing order before DEFINITE)"
  - id: ERR_INVALID_HOLD_STATE
    http: 409
    condition: "the SpaceHold is not in a declared from-state for challenge or release (already CONFIRMED, RELEASED or EXPIRED)"
  - id: ERR_INVALID_COMMITMENT_STATE
    http: 409
    condition: "the RoomBlockCommitment is not in a declared from-state for offer, commit, withdraw or pickup reporting"
  - id: ERR_INVALID_BID_STATE
    http: 409
    condition: "the BidPackage is not in a declared from-state for the requested action (letters or incentive request outside DRAFT, decision outside INCENTIVE_PENDING, submit outside APPROVED, planner response outside SUBMITTED)"
  - id: ERR_INVALID_SERVICING_STATE
    http: 409
    condition: "the ServicingOrder is not REQUESTED for schedule, not SCHEDULED for deliver, or already DELIVERED or CANCELLED when cancel is called"
  - id: ERR_BOARD_REPORT_PUBLISHED
    http: 409
    condition: "the BoardReport is already PUBLISHED and therefore frozen"

  # --- safety / compliance ---------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the deciding X-User-ID equals BidPackage.prepared_by_user_id or BidPackage.incentive_requested_by_user_id"
  - id: ERR_HALL_UNAVAILABLE
    http: 409
    condition: "CenterHall.hall_status == UNDER_RENOVATION when a hold is requested"
  - id: ERR_HOTEL_NOT_PARTICIPATING
    http: 409
    condition: "Hotel.participation_status == SUSPENDED when an invite, offer or commit is attempted"

  # --- temporal --------------------------------------------------------------
  - id: ERR_LEAD_TIME_TOO_SHORT
    http: 422
    condition: "arrival_date is fewer than MIN_LEAD_DAYS (180) days after the current logical clock at qualify time"
  - id: ERR_HOLD_EXPIRED
    http: 409
    condition: "the target SpaceHold's expires_at has already passed at the current logical clock"
  - id: ERR_CHALLENGE_WINDOW_CLOSED
    http: 422
    condition: "the planner answers a SUBMITTED bid after BidPackage.response_due_at"
  - id: ERR_HALL_WINDOW_CONFLICT
    http: 409
    condition: "a CONFIRMED SpaceHold on the same hall conflicts with the candidate's buffered window per calculations.hall_occupation_conflict"
  - id: ERR_HALL_HOLD_LIMIT_REACHED
    http: 409
    condition: "two holds in status HELD or CHALLENGED already conflict with the candidate's buffered window (MAX_HELD_HOLDS_PER_BUFFERED_WINDOW = 2)"
  - id: ERR_PICKUP_NIGHT_OUT_OF_RANGE
    http: 422
    condition: "night_date falls outside [Opportunity.arrival_date, Opportunity.departure_date) - including the departure night itself"
  - id: ERR_DUPLICATE_PICKUP_NIGHT
    http: 422
    condition: "a PickupRecord already exists for the same (room_block_commitment_id, night_date)"
  - id: ERR_CUTOFF_MISALIGNED
    http: 422
    condition: "Opportunity.cutoff_alignment_spread_days exceeds CUTOFF_ALIGNMENT_TOLERANCE_DAYS (2) at submit time"

  # --- constraint satisfaction ----------------------------------------------
  - id: ERR_CHALLENGE_TARGET_INVALID
    http: 422
    condition: "the challenger is not a HELD SECOND-rank hold, the path hold is not a HELD FIRST-rank hold on the same hall, the windows do not conflict, or both holds belong to the same opportunity"
  - id: ERR_HALL_CAPACITY_INSUFFICIENT
    http: 422
    condition: "Opportunity.attendance_estimate exceeds CenterHall.capacity_persons or exhibit_sqft_requested exceeds CenterHall.exhibit_sqft"
  - id: ERR_DUPLICATE_COMMITMENT
    http: 409
    condition: "a RoomBlockCommitment for the same (opportunity_id, hotel_id) is already INVITED, OFFERED or COMMITTED"
  - id: ERR_RATE_CEILING_EXCEEDED
    http: 422
    condition: "rate_offered_amount exceeds Opportunity.rate_ceiling_amount, or rooms_peak_offered exceeds Hotel.committable_rooms"
  - id: ERR_HOTEL_CAPACITY_EXCEEDED
    http: 422
    condition: "committing the block would push the hotel's COMMITTED rooms above committable_rooms on at least one night of [arrival_date, departure_date)"
  - id: ERR_NO_ACTIVE_SPACE_HOLD
    http: 422
    condition: "the opportunity has no SpaceHold in status HELD, CHALLENGED or CONFIRMED at submit time"
  - id: ERR_SUPPORT_LETTERS_INSUFFICIENT
    http: 422
    condition: "the bid package carries fewer than MIN_DISTINCT_SUPPORT_LETTER_TYPES (2) DISTINCT letter_type values"
  - id: ERR_BLOCK_COVERAGE_INSUFFICIENT
    http: 422
    condition: "Opportunity.block_coverage_pct is below MIN_BLOCK_COVERAGE_PCT (85.00) at submit time"
  - id: ERR_BID_ROUND_LIMIT_REACHED
    http: 409
    condition: "POST /bid-packages is called while the opportunity already has a BidPackage in status DRAFT, INCENTIVE_PENDING, APPROVED or SUBMITTED; a revision requested at round_number == MAX_BID_ROUNDS (3) does NOT raise this error - it declines the package and loses the opportunity with lost_reason REVISION_LIMIT_REACHED"
  - id: ERR_ESTIMATE_VARIANT_NOT_AVAILABLE
    http: 422
    condition: "a FINAL EconomicImpactEstimate is requested while the opportunity has no PickupRecord on any COMMITTED or RELEASED commitment"

  # --- fiscal ----------------------------------------------------------------
  - id: ERR_FUND_EXHAUSTED
    http: 409
    condition: "IncentiveFund.posture == EXHAUSTED when a decision would charge it"
  - id: ERR_INCENTIVE_EXCEEDS_CAP
    http: 422
    condition: "approved_amount exceeds the incentive cap recomputed at decision time by calculations.incentive_cap"
  - id: ERR_FUND_INSUFFICIENT
    http: 422
    condition: "approved_amount plus the admin fee exceeds IncentiveFund.uncommitted_amount"
  - id: ERR_TAX_PAYBACK_BELOW_FLOOR
    http: 422
    condition: "PROVISIONAL lodging_tax_yield_amount divided by total_charge_amount is below MIN_TAX_PAYBACK_RATIO (3.00)"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix - role_model: segregation_of_duties
# ---------------------------------------------------------------------------
roles:
  - name: BureauAdmin
    description: "bureau operations administrator: registers planners, hotels, halls and funds, credits lodging-tax receipts, and fires the hold-expiry ops run"
    identity: "opaque"
    exclusive_operations:
      - "POST /meeting-planners"
      - "POST /hotels"
      - "POST /hotels/{id}/participation"
      - "POST /incentive-funds"
      - "POST /incentive-funds/{id}/lodging-tax-receipts"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /center-halls"
      - "POST /space-hold-expiry-runs"
      - "GET reads across planners, hotels, halls, funds, opportunities, holds, commitments, bids, servicing orders and board reports"

  - name: SalesManager
    description: "destination sales manager: owns the lead, assembles the citywide room block, prepares the bid package and requests incentive money"
    identity: "opaque"
    exclusive_operations:
      - "POST /opportunities"
      - "POST /opportunities/{id}/qualify"
      - "POST /opportunities/{id}/lose"
      - "POST /room-block-commitments"
      - "POST /room-block-commitments/{id}/commit"
      - "POST /bid-packages"
      - "POST /bid-packages/{id}/support-letters"
      - "POST /bid-packages/{id}/request-incentive"
      - "POST /bid-packages/{id}/submit"
    shared_operations:
      - "POST /economic-impact-estimates"
      - "GET reads across planners, hotels, halls, opportunities, holds, commitments, pickup records, bids, letters, decisions, estimates and servicing orders"

  - name: HotelPartner
    description: "hotel revenue manager acting for one property: answers invitations with rates and cutoffs, withdraws, and reports nightly pickup"
    identity: "entity_backed:Hotel"
    exclusive_operations:
      - "POST /room-block-commitments/{id}/offer"
      - "POST /room-block-commitments/{id}/withdraw"
      - "POST /room-block-commitments/{id}/pickup-records"
    shared_operations:
      - "GET /hotels/{id}"
      - "GET /opportunities/{id}"
      - "GET /room-block-commitments, GET /room-block-commitments/{id}, GET /room-block-commitments/{id}/pickup-records"

  - name: CenterScheduler
    description: "convention center scheduler: owns hall inventory and every date/space hold, including challenges and releases"
    identity: "opaque"
    exclusive_operations:
      - "POST /space-holds"
      - "POST /space-holds/{id}/challenge"
      - "POST /space-holds/{id}/release"
    shared_operations:
      - "POST /center-halls"
      - "POST /space-hold-expiry-runs"
      - "GET reads across halls, holds and opportunities"

  - name: MeetingPlanner
    description: "the client-side meeting planner acting for their own organization: answers a submitted bid"
    identity: "entity_backed:MeetingPlanner"
    exclusive_operations:
      - "POST /bid-packages/{id}/planner-response"
    shared_operations:
      - "GET /bid-packages/{id}"
      - "GET /opportunities/{id}"

  - name: IncentiveApprover
    description: "incentive committee officer who decides funding requests; segregation of duties bars the preparer and the requester from this role's decision on the same package"
    identity: "opaque"
    exclusive_operations:
      - "POST /bid-packages/{id}/incentive-decisions"
    shared_operations:
      - "GET reads across planners, funds, fund receipts, decisions, opportunities, bids, letters and estimates"

  - name: ServicesManager
    description: "convention services manager: opens, schedules and delivers housing, transportation and volunteer servicing orders"
    identity: "opaque"
    exclusive_operations:
      - "POST /servicing-orders"
      - "POST /servicing-orders/{id}/schedule"
      - "POST /servicing-orders/{id}/deliver"
      - "POST /servicing-orders/{id}/cancel"
    shared_operations:
      - "GET /servicing-orders/{id}, GET /opportunities/{id}/servicing-orders, GET /opportunities/{id}"

  - name: BoardAnalyst
    description: "board reporting analyst: computes impact estimates and the lodging-tax board report on room-night production"
    identity: "opaque"
    exclusive_operations:
      - "POST /board-reports"
      - "POST /board-reports/{id}/publish"
    shared_operations:
      - "POST /economic-impact-estimates"
      - "GET reads across planners, hotels, funds, receipts, decisions, opportunities, commitments, pickup records, bids, estimates, servicing orders and board reports"
