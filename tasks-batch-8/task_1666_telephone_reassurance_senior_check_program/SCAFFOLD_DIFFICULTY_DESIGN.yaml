            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-10", window_start: "09:00", window_end: "09:30" }, as: ProgramCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /api/call-assignments/${a1}/call-logs", payload: { called_at: "2026-08-03T09:05:00Z", duration_seconds: 600, outcome: "REACHED_CONCERN", concern_level: "IMMEDIATE_DANGER", concern_categories: ["SAFETY"], follow_up_needed: true, follow_up_plan: "participant reported gas smell; advised evacuation and called 911", supervisor_notified: true }, as: VolunteerCaller, as_user_id: "${v_id}", captures: { log_id: $.data.id } }
