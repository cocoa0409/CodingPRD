      - name: uniqueness_keys_reject_duplicates_across_five_collections
        claim_type: Violation -> Error
        grounds:
          - validations[priority=27]
          - errors[ERR_DUPLICATE_RESOURCE]
          - entities.Season.fields.code
          - entities.Item.fields.sku
          - entities.Store.fields.store_number
          - entities.PriceZone.fields.zone_code
          - entities.SalesWeek
        distinguishing_aspect: |
          Five different uniqueness keys share one error id, and one of them is a composite:
          (item_id, week_ending_date) must reject a second week for the same item on the same date while the
          same date for a different item is accepted, so the key cannot be implemented as a global date index.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is ACTIVE with zones CHAIN-US and REGION-WEST, store 0101 and item A-1001"
            - "Item A-1001 already has sales weeks for 2026-09-05, 09-12, 09-19 and 09-26"
