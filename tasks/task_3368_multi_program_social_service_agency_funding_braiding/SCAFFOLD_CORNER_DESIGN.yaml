  - section: rbac
    instances:
      - name: exclusive_write_operations_are_refused_for_unlisted_roles
        claim_type: rbac_denial
        grounds: ['roles[ComplianceOfficer].exclusive_operations', 'roles[ProgramManager].exclusive_operations', 'roles[FinanceOfficer].exclusive_operations', 'errors[ERR_FORBIDDEN_ROLE]']
        distinguishing_aspect: "Each exclusive write is refused for a role that is declared elsewhere in the matrix: funder creation for FinanceOfficer, enrollment exit for IntakeSpecialist, and posture recompute for ProgramManager."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/funders"
              payload: { name: "Diocesan Fund", funder_type: "DIOCESAN", allow_faith_based_activity: true, requires_time_and_effort_documentation: false, max_admin_rate_pct: 0.25, fiscal_year_start_month: 1 }
              as: FinanceOfficer
              captures: { err_1: "$.data.error_id" }
            - call: "POST /api/enrollments/00000000-0000-4000-8000-000000000000/exit"
              payload: { exit_reason: "WITHDRAWN" }
              as: IntakeSpecialist
              captures: { err_2: "$.data.error_id" }
            - call: "POST /api/grants/00000000-0000-4000-8000-000000000000/posture-recompute"
              payload: {}
              as: ProgramManager
              captures: { err_3: "$.data.error_id" }
          assert:
            - "first.code == 403 and first.data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "second.code == 403 and second.data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "third.code == 403 and third.data.error_id == \"ERR_FORBIDDEN_ROLE\""

      - name: read_operations_respect_the_role_allowlist
        claim_type: rbac_denial
        grounds: ['endpoints[GET /api/cost-allocations]', 'endpoints[GET /api/clients/{id}]', 'roles[IntakeSpecialist].shared_operations']
        distinguishing_aspect: "Read endpoints are allowlisted per role: IntakeSpecialist is refused the fiscal cost-allocation list and ProgramManager is refused the client record, both with ERR_FORBIDDEN_ROLE rather than an empty result."
        test_recipe:
          setup: ["one registered client; clock at default"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { full_name: "Ada Vance", date_of_birth: "1990-01-01", household_size: 2, immigration_status: "CITIZEN", county_code: "COOK" }
              as: IntakeSpecialist
              captures: { c1: "$.data.id" }
          trigger:
            - call: "GET /api/cost-allocations"
              payload: {}
              as: IntakeSpecialist
              captures: { err_1: "$.data.error_id" }
            - call: "GET /api/clients/${c1}"
              payload: {}
              as: ProgramManager
              captures: { err_2: "$.data.error_id" }
          assert:
            - "first.code == 403 and first.data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "second.code == 403 and second.data.error_id == \"ERR_FORBIDDEN_ROLE\""

      - name: operator_endpoints_are_refused_for_business_and_client_roles
        claim_type: rbac_denial
        grounds: ['roles[PlatformAdmin].exclusive_operations', 'roles[Client].shared_operations', 'endpoints[POST /api/_clock/set_current_utc]']
        distinguishing_aspect: "The logical-clock endpoint is exclusive to PlatformAdmin and the Client role owns no write at all, so both a business role and the client role are refused on writes they might otherwise appear entitled to."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err_1: "$.data.error_id" }
            - call: "POST /api/clients"
              payload: { full_name: "Ada Vance", date_of_birth: "1990-01-01", household_size: 2, immigration_status: "CITIZEN", county_code: "COOK" }
              as: Client
              captures: { err_2: "$.data.error_id" }
          assert:
            - "first.code == 403 and first.data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "second.code == 403 and second.data.error_id == \"ERR_FORBIDDEN_ROLE\""

      - name: in_kind_donation_creation_is_shared_by_program_and_finance_roles
        claim_type: rbac_shared_operation
        grounds: ['roles[ProgramManager].shared_operations', 'roles[FinanceOfficer].shared_operations', 'endpoints[POST /api/in-kind-donations]']
        distinguishing_aspect: "POST /api/in-kind-donations is the one write both ProgramManager and FinanceOfficer share, so the identical call succeeds for both while remaining refused to IntakeSpecialist."
