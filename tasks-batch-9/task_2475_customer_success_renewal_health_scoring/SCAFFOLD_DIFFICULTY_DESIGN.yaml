    instances:
      - name: escalation_commit_depends_on_sponsor_contact_status
        grounds:
          - state_machines.EscalationCase.OPEN_to_COMMITTED
          - entities.SponsorContact.fields.status
          - validations[priority=17]
        distinguishing_aspect: |
          Entity pair EscalationCase -> SponsorContact: the identical COMMIT call
          is rejected while the economic buyer is DEPARTED and succeeds once that
          same SponsorContact is set back to ACTIVE, with nothing on the
          EscalationCase itself changing in between.
        test_recipe:
          setup:
            - "ENTERPRISE Account with one CXO economic buyer currently status DEPARTED."
            - "One DRAFT SavePlay and one EscalationCase in state OPEN at remediation_round 1."
            - "One RemediationCommitment of 500000 cents already in state ACCEPTED with round_index 1, so the referential precondition is satisfied and only the sponsor state blocks the commit."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 17 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
