              as: AccessibilityLead
              captures: { comp_a: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Report Viewer", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 30 }
