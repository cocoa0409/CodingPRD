  # ===========================================================================
  - section: endpoints
    instances:
      - name: award_action_creates_mixed_category_slots
        claim_type: Side Effect
        grounds: ["endpoints.POST_/applications/{applicationId}/award", "entities.PositionSlot"]
        distinguishing_aspect: "slot_requests [FULL_TIME x1, HALF_TIME x2] produce exactly 3 slots in array order: slot_index 1 FULL_TIME, 2 and 3 HALF_TIME; total_term_minutes 210000 and cost_per_msy_awarded_cents 1942857.14."
        test_recipe:
          setup: ["Application (1 FT + 2 HT, federal 4000000, CASH match 960000 == exactly 24%) submitted; competition CLOSED."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - call: "POST /competitions/${comp_id}/applications"
              payload: { organization_id: "${org_id}", federal_share_requested_cents: 4000000, slot_requests: [{ term_category: "FULL_TIME", count: 1 }, { term_category: "HALF_TIME", count: 2 }], match_lines: [{ category: "CASH", amount_cents: 960000 }] }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - *k_submit
            - *k_clock2
            - *k_close
          trigger:
            - call: "POST /applications/${app_id}/award"
              payload: { federal_share_awarded_cents: 4000000 }
              as: CNCSProgramOfficer
              captures: { award_id: $.data.id }
            - call: "GET /awards/${award_id}/slots"
              payload: {}
              as: CNCSProgramOfficer
          assert:
            - "GrantAward.${award_id}.awarded_slot_count == 3 and total_term_minutes == 210000 (1 x 102000 + 2 x 54000)"
            - "GrantAward.${award_id}.cost_per_msy_awarded_cents == 1942857.14 (round_half_up(4000000 x 102000 / 210000, 2))"
            - "slots: 3 rows; slot_index 1 == FULL_TIME, slot_index 2 and 3 == HALF_TIME; all OPEN with fill_count 0"

      - name: match_reports_accumulate_per_line_rounded_amounts
        claim_type: Side Effect
        grounds: ["endpoints.POST_/awards/{awardId}/match-reports", "calculations.allowable_match", "entities.GrantAward.fields.allowable_match_cents"]
        distinguishing_aspect: "Two reports accumulate: CASH 500001 (rate 1.00 -> 500001) then IN_KIND 100001 (rate 0.80 -> 80001) give allowable_match_cents == 580002; each report bumps award.version by exactly 1."
        test_recipe:
          setup: ["Award ACTIVE, allowable_match_cents 0, version 1."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
          trigger:
            - call: "POST /awards/${award_id}/match-reports"
              payload: { reporting_period_label: "P1", lines: [{ category: "CASH", amount_cents: 500001 }] }
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "POST /awards/${award_id}/match-reports"
              payload: { reporting_period_label: "P2", lines: [{ category: "IN_KIND", amount_cents: 100001 }] }
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "GET /awards/${award_id}"
              payload: {}
              as: CNCSProgramOfficer
          assert:
            - "after P1: allowable_match_cents == 500001 and version == 2"
            - "after P2: allowable_match_cents == 580002 (500001 + round(100001 x 0.8) == 500001 + 80001) and version == 3"

      - name: sweep_with_nothing_overdue_is_a_noop
        claim_type: Conditional Action
        grounds: ["endpoints.POST_/compliance/sweep-overdue"]
        distinguishing_aspect: "A sweep with no overdue corrective actions returns three empty lists and mutates nothing — silence is a defined outcome, not an error."
