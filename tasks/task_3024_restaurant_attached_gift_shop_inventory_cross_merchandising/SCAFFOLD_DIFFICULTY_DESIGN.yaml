  - rule_id: boundary_precision_check
    instances:

      - name: guest_count_threshold_crossing_is_inclusive_at_one_hundred_twenty
        grounds:
          - state_machines.StoreDay.OPEN_to_OPEN
          - entities.StoreDay.fields.traffic_state
          - entities.StoreDay.fields.conversion_gate
          - validations[priority=8]
        distinguishing_aspect: "The boundary is a numeric threshold on guest count: 119 guests leaves the day STEADY with an OPEN gate, 120 guests moves it to RUSH with a GATED_RESTRICTED gate and 121 stays RUSH, so the comparison is inclusive at 120 and a strict greater-than test fails exactly one of the three."
