# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3153_delivery_point_sequencing_route_adjustment_service_standards
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Section/claim_type vocabulary follows references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: facility_create_returns_declared_fields_and_active_status
        claim_type: Creation
        grounds:
          - entities.ProcessingFacility
          - endpoints.POST_/processing-facilities
        distinguishing_aspect: "A facility created with the five required inputs returns 201 with status ACTIVE, version 1, and server-minted id/created_at/updated_at; status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "PDX", facility_type: "S_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "16:30", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
          assert:
            - "response status 201 and response_type object"
            - "ProcessingFacility.${fac_id}.facility_code == \"PDX\" and facility_type == S_AND_DC and region_class == CONTIGUOUS"
            - "ProcessingFacility.${fac_id}.status == ACTIVE and version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: delivery_unit_default_scan_target_applied
        claim_type: Defaults
        grounds:
          - entities.DeliveryUnit.fields.scan_compliance_target
          - entities.DeliveryUnit.fields.universal_service_obligation
        distinguishing_aspect: "Omitting scan_compliance_target applies the 0.98 default, and universal_service_obligation is forced true regardless of any client intent — both are observable on the create response."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Facility LAX exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU9", office_name: "Ninth Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
          assert:
            - "DeliveryUnit.${unit_id}.scan_compliance_target == 0.98"
            - "DeliveryUnit.${unit_id}.universal_service_obligation == true"
            - "DeliveryUnit.${unit_id}.active_route_count == 0"

      - name: delivery_point_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - entities.DeliveryPoint.fields.is_deliverable
          - entities.DeliveryPoint.fields.vacancy_days
          - entities.DeliveryPoint.fields.occupancy_status
        distinguishing_aspect: "Computed/system fields are never client-writable: a point created with only the declared inputs comes back with occupancy_status UNDER_CONSTRUCTION, vacancy_days 0, is_deliverable false — no payload could have set them otherwise."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Unit DU10 exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU10", office_name: "Tenth Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "1 Cedar St", city: "Culver City", state_code: "CA", zip11: "902300109991", point_kind: "BUSINESS" }
              as: AddressManagementSpecialist
              captures: { p_id: $.data.id }
          assert:
            - "response status 201"
            - "DeliveryPoint.${p_id}.occupancy_status == UNDER_CONSTRUCTION (system-set; the create contract exposes no field that could choose it)"
            - "DeliveryPoint.${p_id}.vacancy_days == 0 and is_deliverable == false"
            - "DeliveryPoint.${p_id}.active_route_id is null"

      - name: delivery_point_invalid_zip11_format_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.DeliveryPoint.fields.zip11
          - validations.priority_18_business_constraint
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "zip11 must match ^[0-9]{11}$ exactly — a 5-digit ZIP is a format error (400 ERR_INVALID_REQUEST), not a business rejection."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Unit DU11 exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU11", office_name: "Eleventh Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "2 Cedar St", city: "Culver City", state_code: "CA", zip11: "90230", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 with error_id == ERR_INVALID_REQUEST"
            - "no DeliveryPoint row is created (GET list returns 0 rows)"

      - name: route_case_slot_range_enforced_at_unit_level
        claim_type: Type Constraints
        grounds:
          - entities.DeliveryUnit.fields.case_slot_count_per_route
          - validations.priority_14_business_constraint
          - errors.ERR_RANGE_VIOLATION
        distinguishing_aspect: "case_slot_count_per_route below the 4-slot floor is a range violation (422 ERR_RANGE_VIOLATION) distinct from a format error — the value parses but is out of domain."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Facility LAX exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU12", office_name: "Tiny Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 3 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 with error_id == ERR_RANGE_VIOLATION"
            - "no DeliveryUnit row is created"

      - name: scan_event_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.DeliveryScanEvent
        distinguishing_aspect: "DeliveryScanEvent has common_fields false (append-only): no PUT/PATCH/DELETE endpoint exists for it in §1.5, and the row carries id and created_at but no version field."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Unit with route C950 and one OCCUPIED point; one scan event recorded."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU13", office_name: "Immutable Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/carriers"
              payload: { employee_id: "E0000950", full_name: "Uma Pace", carrier_class: "REGULAR" }
              as: Postmaster
              captures: { car_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes"
              payload: { route_code: "C950", assigned_carrier_id: "${car_id}", route_type: "CITY" }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "31 Ash St", city: "Culver City", state_code: "CA", zip11: "902300109981", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
              captures: { p_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points/${p_id}/activate"
              payload: { route_id: "${route_id}" }
              as: AddressManagementSpecialist
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/scan-events"
              payload: { delivery_point_id: "${p_id}", carrier_id: "${car_id}", scan_code: "DELIVERED", scan_datetime: "2026-09-01T15:00:00Z", gps_within_geofence: true }
              as: Carrier
              as_user_id: "${car_id}"
              captures: { ev_id: $.data.id }
          assert:
            - "the scan event response carries id and created_at but no version field"
            - "no PUT, PATCH, or DELETE endpoint for /scan-events/{id} is declared in §1.5 — the resource is append-only"
            - "DeliveryScanEvent.${ev_id}.is_compliant == true"

      - name: points_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/delivery-units/{unitId}/delivery-points
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three points on a unit, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Unit DU14 with three delivery points."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU14", office_name: "Page Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "1 Page St", city: "Culver City", state_code: "CA", zip11: "902300108881", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "2 Page St", city: "Culver City", state_code: "CA", zip11: "902300108882", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "3 Page St", city: "Culver City", state_code: "CA", zip11: "902300108883", point_kind: "BUSINESS" }
              as: AddressManagementSpecialist
          trigger:
            - call: "GET /api/delivery-units/${unit_id}/delivery-points"
              payload: { limit: 2, offset: 0 }
              as: AddressManagementSpecialist
          assert:
            - "response status 200, response_type array, exactly 2 rows, total_count == 3, has_more == true"
            - "GET with limit=2&offset=2 returns exactly 1 row, total_count == 3, has_more == false"
            - "GET with point_kind=BUSINESS returns exactly 1 row"
            - "GET with no parameters returns 3 rows (default limit 10, offset 0)"

      - name: get_point_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/delivery-units/{unitId}/delivery-points/{pointId}
          - errors.ERR_NOT_FOUND
          - validations.priority_3_existence
        distinguishing_aspect: "A syntactically valid but unallocated point id yields 404 ERR_NOT_FOUND; a valid point id under the WRONG unit id also yields 404 (parent-scoped existence, left-to-right)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Units DU15a and DU15b exist; one point P under DU15a only."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU15A", office_name: "Fifteen A", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_a: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU15B", office_name: "Fifteen B", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_b: $.data.id }
            - call: "POST /api/delivery-units/${unit_a}/delivery-points"
              payload: { address_line1: "1 Scope St", city: "Culver City", state_code: "CA", zip11: "902300107771", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /api/delivery-units/${unit_a}/delivery-points/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AddressManagementSpecialist
              captures: { err1: $.data.error_id }
            - call: "GET /api/delivery-units/${unit_b}/delivery-points/${p_id}"
              payload: {}
              as: AddressManagementSpecialist
              captures: { err2: $.data.error_id }
          assert:
            - "unknown point id under the right unit returns 404 ERR_NOT_FOUND"
            - "the real point id under the WRONG unit returns 404 ERR_NOT_FOUND (no cross-unit leakage)"

      - name: child_creation_requires_parent_existence
        claim_type: Parent Relationships
        grounds:
          - entities.DeliveryPoint.parent
          - validations.priority_3_existence
        distinguishing_aspect: "Creating a point under a nonexistent unit id fails at the unit segment with 404 ERR_NOT_FOUND before any body validation runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/delivery-units/00000000-0000-0000-0000-000000000000/delivery-points"
              payload: { address_line1: "1 Ghost St", city: "Nowhere", state_code: "CA", zip11: "902300106661", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response status 404 with error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: point_initial_state_is_under_construction
        claim_type: Initial State
        grounds:
          - state_machines.DeliveryPoint
        distinguishing_aspect: "A freshly created point starts UNDER_CONSTRUCTION with vacancy_days 0 and no route assignment — the state is system-set, never client-chosen."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Unit DU16 exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU16", office_name: "Init Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "1 Newbuild Way", city: "Culver City", state_code: "CA", zip11: "902300105551", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
              captures: { p_id: $.data.id }
          assert:
            - "DeliveryPoint.${p_id}.occupancy_status == UNDER_CONSTRUCTION"
            - "DeliveryPoint.${p_id}.vacant_since_date is null and vacancy_days == 0"
            - "DeliveryPoint.${p_id}.active_route_id is null and version == 1"

      - name: mark_vacant_from_under_construction_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.DeliveryPoint.transitions
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "mark-vacant requires OCCUPIED; firing it on an UNDER_CONSTRUCTION point (which has no route yet) is a state error, not a referential one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Unit DU17 with one UNDER_CONSTRUCTION point."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU17", office_name: "Invalid Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "2 Newbuild Way", city: "Culver City", state_code: "CA", zip11: "902300105552", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
              captures: { p_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/carriers"
              payload: { employee_id: "E0001700", full_name: "Vic Alda", carrier_class: "REGULAR" }
              as: Postmaster
              captures: { car_id: $.data.id }
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/delivery-points/${p_id}/mark-vacant"
              payload: {}
              as: Carrier
              as_user_id: "${car_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_INVALID_STATE"
            - "DeliveryPoint.${p_id}.occupancy_status remains UNDER_CONSTRUCTION"

      - name: activate_side_effects_append_sequence_entry
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DeliveryPoint.UNDER_CONSTRUCTION_to_OCCUPIED
          - endpoints.POST_/delivery-units/{unitId}/delivery-points/{pointId}/activate
        distinguishing_aspect: "Activation is not just a status flip: it appends a RouteSequenceEntry at position N+1, recomputes the route's active_delivery_point_count, and stamps active_route_id — all observable through separate GETs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Unit DU18, route C960 with one already-active point (position 1); a second point P2 still UNDER_CONSTRUCTION."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU18", office_name: "Effect Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/carriers"
              payload: { employee_id: "E0001800", full_name: "Wes Bly", carrier_class: "REGULAR" }
              as: Postmaster
              captures: { car_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes"
              payload: { route_code: "C960", assigned_carrier_id: "${car_id}", route_type: "CITY" }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "1 Effect St", city: "Culver City", state_code: "CA", zip11: "902300104441", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
              captures: { p1: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "2 Effect St", city: "Culver City", state_code: "CA", zip11: "902300104442", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
              captures: { p2: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points/${p1}/activate"
              payload: { route_id: "${route_id}" }
              as: AddressManagementSpecialist
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/delivery-points/${p2}/activate"
              payload: { route_id: "${route_id}" }
              as: AddressManagementSpecialist
