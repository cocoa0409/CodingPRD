              captures: { cl_id: $.data.id }
            - call: "POST /projection-methodologies"
              payload: { name: "M-WIN", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G1", specialty: "ONCOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /report-products"
              payload: { client_id: "${cl_id}", methodology_id: "${m_id}", name: "P-WIN", prescriber_ids: [], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /report-products/${pr_id}/delivery-periods"
              payload: { period_code: "2026-08", period_end_date: "2026-08-31", total_due_deliveries: 1 }
              as: PlatformAdmin
              captures: { pe_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /report-deliveries/${d_id}/compile"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d_id}/compile"
              payload: {}
              as: PlatformAdmin
              captures: { st2: $.data.status }
          assert:
            - "compile on 2026-08-30 fails with ERR_DELIVERY_WINDOW_MISSED (HTTP 422)"
            - "compile on 2026-08-31 (exactly period_end_date, >= boundary) succeeds: status COMPILED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: batch_validate_blocked_when_agreement_suspended
        grounds:
          - state_machines.DataFeedBatch.RECEIVED_to_VALIDATED
          - validations[priority=8]
          - endpoints.POST_/data-feed-batches/{id}/validate
        distinguishing_aspect: |
          Entity pair DataFeedBatch -> DataAcquisitionAgreement: validating a batch
          whose agreement is SUSPENDED is rejected with ERR_AGREEMENT_NOT_ACTIVE even
          though the batch itself is in a valid source state (RECEIVED); the
          quarantine cascade does not touch RECEIVED batches, isolating the
          cross-entity check.
        test_recipe:
          setup:
            - "Supplier, agreement ACTIVE, batch created (RECEIVED); agreement then suspended (batch stays RECEIVED — cascade touches only VALIDATED/DEIDENTIFIED)."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "ClaimCo", supplier_type: "CLAIM_PROCESSOR", state_code: "WA" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "CLAIMS_ADJUDICATION", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 10000000 }
              as: DataAcquisitionManager
              captures: { ag_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/activate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag_id}", period_code: "2026-08", record_count: 5000 }
              as: SupplierOperator
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/suspend"
              payload: {}
              as: DataAcquisitionManager
          trigger:
            - call: "POST /data-feed-batches/${b_id}/validate"
              payload: {}
              as: DataAcquisitionManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AGREEMENT_NOT_ACTIVE with HTTP 409"
            - "GET /data-feed-batches/${b_id} still shows status RECEIVED (unaffected by quarantine cascade)"

      - name: optout_verify_blocked_when_prescriber_inactive
        grounds:
          - state_machines.PrescriberOptOut.SUBMITTED_to_VERIFIED
          - validations[priority=12]
          - endpoints.POST_/prescriber-opt-outs/{id}/verify
        distinguishing_aspect: |
          Entity pair PrescriberOptOut -> Prescriber (different pair from the
          batch/agreement dependency): verifying an opt-out whose prescriber is
          INACTIVE is rejected with ERR_PRESCRIBER_NOT_ACTIVE even though the
          opt-out itself is in the correct SUBMITTED state.
        test_recipe:
          setup:
            - "Prescriber ACTIVE; opt-out created (SUBMITTED); prescriber then deactivated to INACTIVE."
          setup_api_calls:
            - call: "POST /prescribers"
              payload: { full_name: "Dr Y", npi: "NPI-202", state_code: "OR", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /prescribers/${p_id}/opt-outs"
              payload: {}
              as: PrivacyOfficer
              captures: { oo_id: $.data.id }
            - call: "POST /prescribers/${p_id}/deactivate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /prescriber-opt-outs/${oo_id}/verify"
              payload: {}
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PRESCRIBER_NOT_ACTIVE with HTTP 409"
            - "GET /prescriber-opt-outs/${oo_id} still shows status SUBMITTED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: agreement_exclusivity_half_open_adjacency
        grounds:
          - calculations.calc_agreement_window_overlap
          - validations[priority=18]
          - endpoints.POST_/suppliers/{id}/agreements
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) exclusivity per
          (supplier, data_domain) on DataAcquisitionAgreement — a new window starting
          exactly at the previous window's end (adjacency) is allowed, while one
          starting a day earlier overlaps; a different data_domain never conflicts.
        test_recipe:
          setup:
            - "Supplier S; agreement A1 RETAIL_SCRIPTS [2026-01-01, 2026-06-01)."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "PharmCo5", supplier_type: "PHARMACY", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2026-06-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-06-01", exclusivity_end_date: "2026-12-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { a2_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-05-31", exclusivity_end_date: "2026-07-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { err: $.data.error_id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "CLAIMS_ADJUDICATION", exclusivity_start_date: "2026-02-01", exclusivity_end_date: "2026-03-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { a4_id: $.data.id }
          assert:
            - "adjacent agreement (start == A1.end) is created (201) with status DRAFT"
            - "overlapping agreement (start 2026-05-31 < A1.end) fails with ERR_AGREEMENT_WINDOW_OVERLAP (HTTP 409)"
            - "same-window different-domain agreement is created (201) — exclusivity is per (supplier, data_domain)"

      - name: audit_cooldown_thirty_day_buffer
        grounds:
          - calculations.calc_audit_cooldown
          - validations[priority=20]
          - endpoints.POST_/clients/{id}/audit-requests
        distinguishing_aspect: |
          Different interval semantics from the exclusivity half-open rule: audit
          windows on ClientAuditEvent enforce a minimum 30-day buffer AFTER the last
          COMPLETED audit — mere non-overlap is not enough. 29 days after window_end
          is rejected; exactly 30 days passes (>= boundary).
        test_recipe:
          setup:
            - "Client with one COMPLETED audit whose window was [2026-03-01, 2026-03-31)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Client Aud", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audit-requests"
              payload: { window_start_date: "2026-03-01", window_end_date: "2026-03-31", purpose: "AUDIT_COMPLIANCE" }
              as: ManufacturerClient
              as_user_id: "${cl_id}"
              captures: { au1_id: $.data.id }
            - call: "POST /audit-events/${au1_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /audit-events/${au1_id}/complete"
              payload: { outcome: "CLEAN" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clients/${cl_id}/audit-requests"
              payload: { window_start_date: "2026-04-29", window_end_date: "2026-05-15", purpose: "AUDIT_COMPLIANCE" }
              as: ManufacturerClient
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
            - call: "POST /clients/${cl_id}/audit-requests"
              payload: { window_start_date: "2026-04-30", window_end_date: "2026-05-15", purpose: "AUDIT_COMPLIANCE" }
              as: ManufacturerClient
              as_user_id: "${cl_id}"
              captures: { au2_id: $.data.id, au2_st: $.data.status }
          assert:
            - "start 2026-04-29 (29 days after 2026-03-31) fails with ERR_AUDIT_COOLDOWN_ACTIVE (HTTP 422)"
            - "start 2026-04-30 (exactly 30 days) succeeds with status REQUESTED (201)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: recall_reissue_conserves_entitlement_balance
        grounds:
          - calculations.calc_entitlement_balance
          - state_machines.ReportDelivery.SCHEDULED_to_COMPILED
          - state_machines.ReportDelivery.COMPILED_to_RECALLED
          - state_machines.ReportDelivery.RECALLED_to_REISSUED
        distinguishing_aspect: |
          Conserved quantity: client entitlement_cells_balance. A compile debit
          paired with its compensating recall credit returns the balance exactly
          (100 -> 97 -> 100); reissue then debits the recomputed set (100 -> 97).
        test_recipe:
          setup:
            - "Default clock. Client entitlement_cells_total 100; methodology with three CURRENT cells for 2026-08; product; period ended 2026-08-31; one SCHEDULED delivery."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Client Inv", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id, bal0: $.data.entitlement_cells_balance }
            - call: "POST /projection-methodologies"
              payload: { name: "M-INV", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G1", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G2", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G3", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /report-products"
              payload: { client_id: "${cl_id}", methodology_id: "${m_id}", name: "P-INV", prescriber_ids: [], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /report-products/${pr_id}/delivery-periods"
              payload: { period_code: "2026-08", period_end_date: "2026-08-31", total_due_deliveries: 1 }
              as: PlatformAdmin
              captures: { pe_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /report-deliveries/${d_id}/compile"
              payload: {}
              as: PlatformAdmin
            - call: "GET /clients/${cl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal1: $.data.entitlement_cells_balance }
            - call: "POST /report-deliveries/${d_id}/recall"
              payload: {}
              as: PlatformAdmin
            - call: "GET /clients/${cl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal2: $.data.entitlement_cells_balance }
            - call: "POST /report-deliveries/${d_id}/reissue"
              payload: {}
              as: PlatformAdmin
            - call: "GET /clients/${cl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal3: $.data.entitlement_cells_balance }
          assert:
            - "balance at creation == 100"
            - "after compile == 97 (3 cells debited)"
            - "after recall == 100 (compile + recall leaves the balance unchanged — invariant)"
            - "after reissue == 97 (recomputed 3 cells debited again)"

      - name: optout_lift_restores_deliverable_count
        grounds:
          - calculations.calc_deliverable_prescriber_count
          - state_machines.PrescriberOptOut.VERIFIED_to_ACTIVE
          - state_machines.PrescriberOptOut.ACTIVE_to_LIFTED
        distinguishing_aspect: |
          Conserved quantity: product deliverable_prescriber_count (a count, a
          different quantity type from the entitlement balance). Opt-out activation
          decrements it (2 -> 1); the compensating lift restores it exactly (1 -> 2).
        test_recipe:
          setup:
            - "Prescribers P1, P2 ACTIVE; client; methodology; product with prescriber_ids [P1, P2] (deliverable count 2); opt-out for P1 SUBMITTED and VERIFIED."
          setup_api_calls:
            - call: "POST /prescribers"
              payload: { full_name: "Dr A", npi: "NPI-301", state_code: "TX", specialty: "CARDIOLOGY" }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr B", npi: "NPI-302", state_code: "TX", specialty: "ONCOLOGY" }
              as: PlatformAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /projection-methodologies"
              payload: { name: "M-LIFT", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Client Lift", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /report-products"
              payload: { client_id: "${cl_id}", methodology_id: "${m_id}", name: "P-LIFT", prescriber_ids: ["${p1_id}", "${p2_id}"], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id, cnt0: $.data.deliverable_prescriber_count }
            - call: "POST /prescribers/${p1_id}/opt-outs"
              payload: {}
              as: PrivacyOfficer
              captures: { oo_id: $.data.id }
            - call: "POST /prescriber-opt-outs/${oo_id}/verify"
              payload: {}
              as: PrivacyOfficer
          trigger:
            - call: "POST /prescriber-opt-outs/${oo_id}/activate"
              payload: {}
              as: PrivacyOfficer
            - call: "GET /report-products/${pr_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cnt1: $.data.deliverable_prescriber_count }
            - call: "POST /prescriber-opt-outs/${oo_id}/lift"
              payload: {}
              as: PrivacyOfficer
            - call: "GET /report-products/${pr_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cnt2: $.data.deliverable_prescriber_count }
          assert:
            - "count at product creation == 2"
            - "after opt-out activation == 1"
            - "after lift == 2 (activate + lift leaves the deliverable count unchanged — invariant)"
            - "GET /prescriber-opt-outs/${oo_id} shows status LIFTED"
