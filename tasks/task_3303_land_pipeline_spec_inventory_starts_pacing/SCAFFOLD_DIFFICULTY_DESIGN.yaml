            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}", captures: {cc1: $.data.id} }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 20, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id} }
            - { call: "GET /trade-partners/${tp1}/capacity-commitments", as: TRADE_PARTNER, as_user_id: "${tp1}", captures: {alloc_mid: "$.data[0].allocated_units", rem_mid: "$.data[0].remaining_units"} }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
          trigger:
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER, captures: {bs: $.data.build_stage} }
            - { call: "GET /trade-partners/${tp1}/capacity-commitments", as: TRADE_PARTNER, as_user_id: "${tp1}", captures: {alloc_end: "$.data[0].allocated_units", rem_end: "$.data[0].remaining_units"} }
          assert:
            - "after start: allocated_units == 1 and remaining_units == 9 (committed 10 conserved)"
            - "Home.${h1}.build_stage == COMPLETE after the 4th advance"
            - "after COMPLETE release: allocated_units == 0 and remaining_units == 10 (compensating release restores the pair)"
            - "committed_units == allocated_units + remaining_units at every observation"
