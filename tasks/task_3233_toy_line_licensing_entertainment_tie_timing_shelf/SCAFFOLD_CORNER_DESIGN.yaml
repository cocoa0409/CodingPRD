        test_recipe:
          setup:
            - "Evergreen line EL with PASSED sku SK1, APPROVED tooling order, line TOOLED."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-06-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id, el_v: $.data.version }
            - call: "POST /toy-licensing/toy-lines/${el}/advance"
              payload: { expected_toy_line_version: "${el_v}" }
              as: BrandManager
              captures: { el_v1: $.data.version }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Bucket", age_grade_months: 48, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/safety-tests"
              payload: { sku_id: "${sk1}", test_type: "MECHANICAL", lab_name: "LabA", claimed_age_grade_months: 48 }
              as: SafetyEngineer
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/safety-tests/${st1}/record_result"
              payload: { outcome: "PASS", result_age_grade_months: 48, validated_claims: ["BPA_FREE"] }
              as: SafetyEngineer
            - call: "POST /toy-licensing/factories"
              payload: { name: "F1", capacity_units_per_month: 100000, tooling_lead_weeks: 4 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2026-11", units: 100 }
              as: BrandManager
            - call: "POST /toy-licensing/toy-lines/${el}/advance"
              payload: { expected_toy_line_version: "${el_v1}" }
              as: BrandManager
          trigger:
            - call: "PATCH /toy-licensing/skus/${sk1}"
              payload: { age_grade_months: 36 }
              as: BrandManager
          assert:
            - "SafetyTest.${st1}.status == INVALIDATED"
            - "Sku.${sk1}.safety_status == FAILED and claims_validated == false"
            - "ToyLine.${el}.status == IN_DEVELOPMENT (safety regression cascade)"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: clock_default_is_2026_09_01
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/toy-licensing/_clock/set_current_utc
        distinguishing_aspect: "Before any set call, Property.lifecycle derives from the fixed default clock 2026-09-01T00:00:00Z, never wall-clock."
        test_recipe:
          setup:
            - "No clock set call. Property reveal 2026-09-01 exactly, release 2027-01-01."
          setup_api_calls:
            - call: "POST /toy-licensing/studios"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/properties"
              payload: { studio_id: "${st1}", title: "P", category: "FILM", reveal_date: "2026-09-01T00:00:00Z", release_date: "2027-01-01T00:00:00Z" }
              as: StudioRep
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /toy-licensing/properties/${p1}"
              payload: {}
              as: BrandManager
              captures: { lc: $.data.lifecycle }
          assert:
            - "lifecycle == REVEALED  # default clock 2026-09-01T00:00:00Z == reveal_date boundary"
      - name: scrapped_tooling_order_frees_capacity
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/toy-licensing/tooling-orders/{id}/scrap
          - calculations.factory_capacity_allocation
        distinguishing_aspect: "Scrap removes the order's allocated_units from the factory month bucket; a previously-rejected order then succeeds."
        test_recipe:
          setup:
            - "Factory F1 capacity 1000; existing APPROVED order 800 units in 2027-01; evergreen line+sku moq 100."
          setup_api_calls:
            - call: "POST /toy-licensing/factories"
              payload: { name: "F1", capacity_units_per_month: 1000, tooling_lead_weeks: 4 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "L", brand_kind: "EVERGREEN", target_street_date_input: "2027-06-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Bucket", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 100, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2027-01", units: 800 }
              as: BrandManager
              captures: { to1: $.data.id }
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2027-01", units: 300 }
              as: BrandManager
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /toy-licensing/tooling-orders/${to1}/scrap"
              payload: {}
              as: BrandManager
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2027-01", units: 300 }
              as: BrandManager
              captures: { to2: $.data.id }
          assert:
            - "Pre-scrap order of 300 was rejected with ERR_FACTORY_CAPACITY_EXCEEDED"
            - "After scrap the same order succeeds (201) with allocated_units == 300"
      - name: shipment_street_date_inherited_from_line
        claim_type: Computed read
        grounds:
          - entities.Shipment.fields.street_date
        distinguishing_aspect: "Shipment created under a licensed line inherits target_street_date from the property's release_date, not from any shipment input."
        test_recipe:
          setup:
            - "Licensed line L1 under property release 2027-03-01; retailer review+commitment."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/studios"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/properties"
              payload: { studio_id: "${st1}", title: "P", category: "FILM", reveal_date: "2026-09-01T00:00:00Z", release_date: "2027-03-01T00:00:00Z" }
              as: StudioRep
              captures: { p1: $.data.id }
            - call: "POST /toy-licensing/license-agreements"
              payload: { property_id: "${p1}", territory: "GLOBAL", royalty_rate_pct: 0.10, advance_guarantee_cents: 0, annual_minimum_guarantee_cents: 0, start_date: "2026-01-01T00:00:00Z", end_date: "2028-12-31T00:00:00Z", approval_rights_required: false }
              as: BrandManager
              captures: { la1: $.data.id, la1_v: $.data.version }
            - call: "POST /toy-licensing/license-agreements/${la1}/activate"
              payload: { expected_license_agreement_version: "${la1_v}" }
              as: BrandManager
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Racers", brand_kind: "LICENSED", property_id: "${p1}", license_agreement_id: "${la1}" }
              as: BrandManager
              captures: { l1: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${l1}", name: "Racer", age_grade_months: 48, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/retailers"
              payload: { name: "ToyBox", region: "NA" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r1}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z", commitment_deadline: "2026-11-01T00:00:00Z", shelf_slots_total: 20 }
              as: RetailerOps
              as_user_id: "${r1}"
              captures: { lr1: $.data.id }
            - call: "POST /toy-licensing/line-reviews/${lr1}/approve"
              payload: {}
              as: BrandManager
            - call: "POST /toy-licensing/assortment-commitments"
              payload: { line_review_id: "${lr1}", sku_id: "${sk1}", committed_units: 100, unit_price_cents: 100, shelf_slots: 2 }
              as: BrandManager
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /toy-licensing/shipments"
              payload: { commitment_id: "${c1}", planned_ship_date: "2027-02-01T00:00:00Z", units: 100 }
              as: BrandManager
              captures: { sh1: $.data.id }
          assert:
            - "Shipment.${sh1}.street_date == 2027-03-01T00:00:00Z (inherited from property release via line)"

