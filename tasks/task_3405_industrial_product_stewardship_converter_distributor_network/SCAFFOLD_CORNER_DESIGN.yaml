# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# task_3405_industrial_product_stewardship_converter_distributor_network
# Breadth probe across the claim-extraction taxonomy. Anchors (&k_...) are
# file-local; each test_recipe runs from an empty database.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: formulation_create_returns_server_defaults
        claim_type: Creation
        grounds:
          - entities.Formulation
          - endpoints.POST_/stewardship/formulations
        distinguishing_aspect: "A root formulation created with the three required inputs returns 201 with status DRAFT, revision_number 1, successor_of_id null, version 1, and server-stamped id/created_at/updated_at; ltb fields are null and active_clearance_count is 0."
        test_recipe:
          setup:
            - "Clock at 2026-10-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_form
              call: "POST /stewardship/formulations"
              payload: { product_code: "F-100", name: "Acrylic foam base", base_polymer_family: "acrylic" }
              as: ProductManager
              captures: { f_id: $.data.id, f_v: $.data.version }
          assert:
            - "status 201, response_type object"
            - "Formulation.${f_id}.status == DRAFT and revision_number == 1 and version == 1"
            - "successor_of_id is null; discontinued_at / ltb_deadline / last_ship_date / ltb_pool_quantity are null"
            - "active_clearance_count == 0; id, created_at, updated_at present and non-null"

      - name: jurisdiction_get_roundtrip_applies_sla_default
        claim_type: Defaults
        grounds:
          - entities.Jurisdiction.fields.review_sla_days
          - endpoints.GET_/stewardship/jurisdictions/{id}
        distinguishing_aspect: "review_sla_days omitted at creation comes back as the declared default 30 on GET, alongside the posted thresholds."
        test_recipe:
          setup:
            - "Clock at 2026-10-01T00:00:00Z. One jurisdiction created without review_sla_days."
          setup_api_calls:
            - *k_clock
            - &k_jur
              call: "POST /stewardship/jurisdictions"
              payload: { code: "DE", name: "Germany", declaration_threshold_ppm: 1000, full_disclosure_threshold_ppm: 10000 }
              as: PlatformAdmin
              captures: { jur_de: $.data.id }
          trigger:
            - call: "GET /stewardship/jurisdictions/${jur_de}"
              payload: {}
              as: RegulatoryManager
              as_user_id: "rm-1"
          assert:
            - "status 200; code == DE, declaration_threshold_ppm == 1000, full_disclosure_threshold_ppm == 10000"
            - "review_sla_days == 30 (default applied, not null)"

      - name: formulation_components_list_reverse_reaches_both_parents
        claim_type: Listing
        grounds:
          - entities.FormulationComponent.fields.formulation_id
          - entities.FormulationComponent.fields.substance_id
          - endpoints.GET_/stewardship/formulation-components
        distinguishing_aspect: "The filtered list satisfies FK reverse-reachability both ways: ?formulation_id= returns the two components of one formulation, and ?substance_id= returns the same substance's rows across two formulations, with total_count spanning the full filtered set."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Substances S1 RESTRICTED, S2 REPORTABLE. Formulations F-100 (S1@5000, S2@200) and F-200 (S1@300)."
          setup_api_calls:
            - *k_clock
            - call: "POST /stewardship/substances"
              payload: { cas_number: "50-00-0", name: "Formaldehyde", restriction_class: "RESTRICTED" }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /stewardship/substances"
              payload: { cas_number: "64-17-5", name: "Ethanol", restriction_class: "REPORTABLE" }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - *k_form
            - call: "POST /stewardship/formulations"
              payload: { product_code: "F-200", name: "Solvent adhesive", base_polymer_family: "solvent" }
              as: ProductManager
              captures: { f2: $.data.id }
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f_id}", substance_id: "${s1}", concentration_ppm: 5000 }
              as: ProductManager
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f_id}", substance_id: "${s2}", concentration_ppm: 200 }
              as: ProductManager
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f2}", substance_id: "${s1}", concentration_ppm: 300 }
              as: ProductManager
          trigger:
            - call: "GET /stewardship/formulation-components"
              payload: { formulation_id: "${f_id}" }
              as: ProductManager
            - call: "GET /stewardship/formulation-components"
              payload: { substance_id: "${s1}" }
              as: ProductManager
          assert:
            - "?formulation_id=${f_id} returns 2 rows (5000ppm S1, 200ppm S2), total_count == 2, has_more == false"
            - "?substance_id=${s1} returns 2 rows spanning both formulations, total_count == 2"

      - name: order_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/stewardship/orders/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: "A syntactically valid but unallocated UUID in the orders path yields 404 ERR_NOT_FOUND with the standard error envelope, not a 500 or empty 200."
        test_recipe:
          setup:
            - "Clock 2026-10-01. No orders exist."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /stewardship/orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { nf_err: $.data.error_id }
          assert:
            - "status 404 and error_id == ERR_NOT_FOUND (actual ${nf_err})"
            - "response_type == error and data carries error_id and message"

      - name: component_create_missing_concentration_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.FormulationComponent.fields.concentration_ppm
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "concentration_ppm is required input; omitting it is a 400 ERR_INVALID_REQUEST from the shape check (priority 5), evaluated before any existence check on the FKs."
        test_recipe:
          setup:
            - "Clock 2026-10-01. One DRAFT formulation and one substance exist."
          setup_api_calls:
            - *k_clock
            - *k_form
            - call: "POST /stewardship/substances"
              payload: { cas_number: "50-00-0", name: "Formaldehyde", restriction_class: "RESTRICTED" }
              as: PlatformAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f_id}", substance_id: "${s1}" }
              as: ProductManager
              captures: { rf_err: $.data.error_id }
          assert:
            - "status 400, error_id == ERR_INVALID_REQUEST (actual ${rf_err})"

      - name: formulation_component_row_is_immutable_without_version
        claim_type: Immutability
        grounds:
          - entities.FormulationComponent
        distinguishing_aspect: "common_fields: false — the created component carries id and created_at but NO version or updated_at fields, and the API exposes no update/delete path for it."
        test_recipe:
          setup:
            - "Clock 2026-10-01. DRAFT formulation plus substance."
          setup_api_calls:
            - *k_clock
            - *k_form
            - call: "POST /stewardship/substances"
              payload: { cas_number: "50-00-0", name: "Formaldehyde", restriction_class: "RESTRICTED" }
              as: PlatformAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f_id}", substance_id: "${s1}", concentration_ppm: 5000 }
              as: ProductManager
              captures: { comp_id: $.data.id }
          assert:
            - "status 201; response data has id and created_at"
            - "response data has NO version field and NO updated_at field"

      - name: substance_create_rejects_unknown_restriction_class
        claim_type: Type Constraints
        grounds:
          - entities.Substance.fields.restriction_class
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "restriction_class is a closed enum; BANNED is not in {STANDARD, REPORTABLE, RESTRICTED, PROHIBITED} and is rejected 400 before persistence."
        test_recipe:
          setup:
            - "Clock 2026-10-01."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /stewardship/substances"
              payload: { cas_number: "00-00-0", name: "Mystery", restriction_class: "BANNED" }
              as: PlatformAdmin
              captures: { enum_err: $.data.error_id }
          assert:
            - "status 400, error_id == ERR_INVALID_REQUEST (actual ${enum_err})"

      - name: successor_creation_sets_self_reference_and_revision
        claim_type: Parent Relationships
        grounds:
          - entities.Formulation.fields.successor_of_id
          - entities.Formulation.fields.revision_number
          - endpoints.POST_/stewardship/formulations/{id}/successors
        distinguishing_aspect: "The self-referential reformulation link: the successor row reports successor_of_id == predecessor id and revision_number == predecessor+1, and the predecessor is discoverable via GET /formulations?successor_of_id=."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Root formulation F-100 (DRAFT, version 1)."
          setup_api_calls:
            - *k_clock
            - *k_form
          trigger:
            - call: "POST /stewardship/formulations/${f_id}/successors"
              payload: { product_code: "F-100R", name: "Reformulated acrylic foam", base_polymer_family: "acrylic", expected_formulation_version: "${f_v}" }
              as: ProductManager
              captures: { fs_id: $.data.id }
            - call: "GET /stewardship/formulations"
              payload: { successor_of_id: "${f_id}" }
              as: ProductManager
          assert:
            - "Formulation.${fs_id}.successor_of_id == ${f_id} and revision_number == 2 and status == DRAFT"
            - "GET /formulations?successor_of_id=${f_id} returns exactly 1 row: ${fs_id}"
            - "predecessor Formulation.${f_id}.version incremented to 2 (content-free parent mutation bumps version)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: clearance_decision_on_already_cleared_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.JurisdictionClearance
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "decision is only defined from SUBMITTED; firing it on a CLEARED clearance is a 409 ERR_INVALID_STATE and does not double-count active_clearance_count."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Formulation ACTIVE: its DE clearance already CLEARED (active_clearance_count 1)."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - &k_clear
              call: "POST /stewardship/clearances"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", disclosure_package_level: "EXEMPT" }
              as: ProductManager
              captures: { cl_id: $.data.id }
            - &k_decide
              call: "POST /stewardship/clearances/${cl_id}/decision"
              payload: { decision: "CLEARED" }
              as: RegulatoryManager
              as_user_id: "rm-1"
          trigger:
            - call: "POST /stewardship/clearances/${cl_id}/decision"
              payload: { decision: "CHANGES_REQUESTED" }
              as: RegulatoryManager
              as_user_id: "rm-1"
              captures: { is_err: $.data.error_id }
          assert:
            - "409 error_id == ERR_INVALID_STATE (actual ${is_err})"
            - "JurisdictionClearance.${cl_id}.status stays CLEARED; Formulation.${f_id}.active_clearance_count stays 1"

      - name: discontinue_from_draft_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Formulation.ACTIVE_to_DISCONTINUED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The LTB/discontinuation transition exists only from ACTIVE; a DRAFT formulation (no clearance ever decided) rejects discontinue with ERR_INVALID_STATE and keeps all ltb fields null."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Formulation F-100 in DRAFT."
          setup_api_calls:
            - *k_clock
            - *k_form
          trigger:
            - call: "POST /stewardship/formulations/${f_id}/discontinue"
              payload: { last_time_buy_deadline: "2027-01-15T00:00:00Z", last_ship_date: "2027-03-01T00:00:00Z", ltb_pool_quantity: 100 }
              as: ProductManager
              captures: { dr_err: $.data.error_id }
          assert:
            - "409 error_id == ERR_INVALID_STATE (actual ${dr_err})"
            - "Formulation.${f_id}.status == DRAFT; ltb_deadline / ltb_pool_quantity remain null"

      - name: shipped_order_advance_is_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Order
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "SHIPPED is terminal for advance; a third advance on a SHIPPED order is 409 ERR_INVALID_STATE with no further mutation (shipped_at unchanged)."
        test_recipe:
          setup:
            - "Clock 2026-10-01. ACTIVE formulation, distributor STANDARD agreement; order O qty 2 advanced twice to SHIPPED."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - *k_clear
            - *k_decide
            - &k_dist
              call: "POST /stewardship/distributors"
              payload: { name: "DistribOne GmbH", home_territory_code: "DE" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { dist_id: $.data.id }
            - &k_ag_std
              call: "POST /stewardship/price-agreements"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", distributor_id: "${dist_id}", tier: "STANDARD", base_price_cents: 10000, effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 2, requested_ship_date: "2026-11-01T00:00:00Z", expected_price_agreement_version: "${ag_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { o_id: $.data.id }
            - call: "POST /stewardship/orders/${o_id}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /stewardship/orders/${o_id}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ship_ts: $.data.shipped_at }
          trigger:
            - call: "POST /stewardship/orders/${o_id}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { term_err: $.data.error_id }
          assert:
            - "third advance: 409 ERR_INVALID_STATE (actual ${term_err})"
            - "Order.${o_id}.fulfillment_status == SHIPPED and shipped_at still == ${ship_ts}"

      - name: authorize_at_score_74_rejected_75_accepted
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Converter.AUDIT_RECORDED_to_AUTHORIZED
          - errors.ERR_AUDIT_SCORE_INSUFFICIENT
          - constants.MIN_AUDIT_SCORE
        distinguishing_aspect: "MIN_AUDIT_SCORE 75 is inclusive: audit 74 blocks authorize with ERR_AUDIT_SCORE_INSUFFICIENT; a second converter audited at exactly 75 authorizes cleanly."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Converters C-low (audit 74) and C-edge (audit 75), both AUDIT_RECORDED."
          setup_api_calls:
            - *k_clock
            - call: "POST /stewardship/converters"
              payload: { name: "LowScore Converting", home_territory_code: "DE" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { c_low: $.data.id }
            - call: "POST /stewardship/converters"
              payload: { name: "EdgeScore Converting", home_territory_code: "DE" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { c_edge: $.data.id }
            - call: "POST /stewardship/converters/${c_low}/record-audit"
              payload: { audit_score: 74, audit_standard: "ISO9001" }
              as: QualityAuditor
              as_user_id: "qa-1"
            - call: "POST /stewardship/converters/${c_edge}/record-audit"
              payload: { audit_score: 75, audit_standard: "ISO9001" }
              as: QualityAuditor
              as_user_id: "qa-1"
          trigger:
            - call: "POST /stewardship/converters/${c_low}/authorize"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { low_err: $.data.error_id }
            - call: "POST /stewardship/converters/${c_edge}/authorize"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
          assert:
            - "C-low authorize: 409 ERR_AUDIT_SCORE_INSUFFICIENT (actual ${low_err}); status stays AUDIT_RECORDED"
            - "C-edge authorize: 200; Converter.${c_edge}.status == AUTHORIZED (75 >= 75 inclusive)"

      - name: claim_provisional_accrual_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RebateAccrual.FINALIZED_to_CLAIMED
          - errors.ERR_ACCRUAL_NOT_FINALIZED
        distinguishing_aspect: "claim exists only from FINALIZED; while the parent program is still ACTIVE the accrual is PROVISIONAL and claim fails 409 ERR_ACCRUAL_NOT_FINALIZED."
        test_recipe:
          setup:
            - "Clock 2026-10-01. ACTIVE formulation + distributor agreement + rebate program ACTIVATED (accrual exists, PROVISIONAL)."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - *k_clear
            - *k_decide
            - *k_dist
            - *k_ag_std
            - call: "POST /stewardship/rebate-programs"
              payload: { formulation_id: "${f_id}", partner_type: "DISTRIBUTOR", distributor_id: "${dist_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", rebate_tiers: [{ threshold_qty: 0, rate_pct: 0.01 }], budget_cap_cents: 1000000 }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /stewardship/rebate-programs/${prog_id}/advance"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
            - call: "GET /stewardship/rebate-accruals"
              payload: { program_id: "${prog_id}" }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { acc_id: "$.data[0].id" }
          trigger:
            - call: "POST /stewardship/rebate-accruals/${acc_id}/claim"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { claim_err: $.data.error_id }
          assert:
            - "409 error_id == ERR_ACCRUAL_NOT_FINALIZED (actual ${claim_err})"
            - "RebateAccrual.${acc_id}.status stays PROVISIONAL"

      - name: phaseout_qualifying_advance_without_successor_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PhaseOutProgram.REFORMULATING_to_QUALIFYING
          - errors.ERR_PHASEOUT_SUCCESSOR_REQUIRED
        distinguishing_aspect: "REFORMULATING -> QUALIFYING without successor_formulation_id in the payload is 409 ERR_PHASEOUT_SUCCESSOR_REQUIRED; the program stays REFORMULATING."
        test_recipe:
          setup:
            - "Clock 2026-10-01. RESTRICTED substance; affected formulation exists. Phase-out program advanced ANNOUNCED -> REFORMULATING."
          setup_api_calls:
            - *k_clock
            - call: "POST /stewardship/substances"
              payload: { cas_number: "50-00-0", name: "Formaldehyde", restriction_class: "RESTRICTED" }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - *k_form
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f_id}", substance_id: "${s1}", concentration_ppm: 5000 }
              as: ProductManager
            - call: "POST /stewardship/phase-out-programs"
              payload: { substance_id: "${s1}", jurisdiction_codes: ["DE"], trigger_concentration_ppm: 1000 }
              as: RegulatoryManager
              as_user_id: "rm-1"
              captures: { pop_id: $.data.id }
            - call: "POST /stewardship/phase-out-programs/${pop_id}/advance"
              payload: {}
              as: RegulatoryManager
              as_user_id: "rm-1"
          trigger:
            - call: "POST /stewardship/phase-out-programs/${pop_id}/advance"
              payload: {}
              as: RegulatoryManager
              as_user_id: "rm-1"
              captures: { gate_err: $.data.error_id }
          assert:
            - "409 error_id == ERR_PHASEOUT_SUCCESSOR_REQUIRED (actual ${gate_err})"
            - "PhaseOutProgram.${pop_id}.status stays REFORMULATING and successor_formulation_id stays null"

      - name: phaseout_enforce_blocked_with_single_qualified_customer
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PhaseOutProgram.QUALIFYING_to_ENFORCED
          - errors.ERR_QUALIFICATION_GATE_UNMET
          - constants.MIN_QUALIFIED_CUSTOMERS
        distinguishing_aspect: "MIN_QUALIFIED_CUSTOMERS is 2 inclusive: with the successor clearance CLEARED in DE but only ONE qualified customer recorded, QUALIFYING -> ENFORCED fails ERR_QUALIFICATION_GATE_UNMET; a second qualification then unlocks it."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Program in QUALIFYING with successor F-100R (CLEARED in DE); one customer qualified."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - call: "POST /stewardship/substances"
              payload: { cas_number: "50-00-0", name: "Formaldehyde", restriction_class: "RESTRICTED" }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - *k_form
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f_id}", substance_id: "${s1}", concentration_ppm: 5000 }
              as: ProductManager
            - call: "POST /stewardship/phase-out-programs"
              payload: { substance_id: "${s1}", jurisdiction_codes: ["DE"], trigger_concentration_ppm: 1000 }
              as: RegulatoryManager
              as_user_id: "rm-1"
              captures: { pop_id: $.data.id }
            - call: "POST /stewardship/phase-out-programs/${pop_id}/advance"
              payload: {}
              as: RegulatoryManager
              as_user_id: "rm-1"
            - call: "GET /stewardship/formulations/${f_id}"
              payload: {}
              as: ProductManager
              captures: { f_v_pre: $.data.version }
            - call: "POST /stewardship/formulations/${f_id}/successors"
              payload: { product_code: "F-100R", name: "Reformulated base", base_polymer_family: "acrylic", expected_formulation_version: "${f_v_pre}" }
              as: ProductManager
              captures: { fs_id: $.data.id }
            - call: "POST /stewardship/clearances"
              payload: { formulation_id: "${fs_id}", jurisdiction_id: "${jur_de}", disclosure_package_level: "EXEMPT" }
              as: ProductManager
              captures: { cls_id: $.data.id }
            - call: "POST /stewardship/clearances/${cls_id}/decision"
              payload: { decision: "CLEARED" }
              as: RegulatoryManager
              as_user_id: "rm-1"
            - call: "POST /stewardship/phase-out-programs/${pop_id}/advance"
              payload: { successor_formulation_id: "${fs_id}" }
              as: RegulatoryManager
              as_user_id: "rm-1"
            - call: "POST /stewardship/phase-out-programs/${pop_id}/record-qualification"
              payload: { customer_ref: "K-1", samples_passed: 3 }
              as: TechnicalEngineer
              as_user_id: "te-1"
          trigger:
            - call: "POST /stewardship/phase-out-programs/${pop_id}/advance"
              payload: {}
              as: RegulatoryManager
              as_user_id: "rm-1"
              captures: { qual_err: $.data.error_id }
