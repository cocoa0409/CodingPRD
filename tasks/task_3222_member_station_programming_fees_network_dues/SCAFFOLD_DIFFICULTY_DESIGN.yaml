  - rule_id: compensating_invariant
    instances:
      - name: invariant_dues_vote_pair_weight_conservation
        grounds:
          - calculations.slate_weighted_vote_scoring
          - state_machines.StationVote.transitions.RECORDED_to_SUPERSEDED
          - state_machines.StationVote.transitions.SUPERSEDED_to_RECORDED
          - entities.StationVote.fields.recorded_weight
        distinguishing_aspect: "The conserved quantity is the total recorded vote weight on a proposal: superseding a vote and restoring the original must return Σ recorded_weight over RECORDED rows to its pre-supersede value, with the superseder left at weight zero."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one OPEN proposal with quorum 1 and one CLASS_A station whose vote is recorded YES at weight 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026O", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
