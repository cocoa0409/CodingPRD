# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3208_theater_dining_service_timing_server_routing
#
# Breadth probe: every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: auditorium_create_supplies_posture_axes_and_version_one
        claim_type: Creation
        grounds:
          - entities.Auditorium
          - entities.Auditorium.fields.status
          - entities.Auditorium.fields.build_phase
          - entities.Auditorium.fields.service_posture
          - endpoints.POST_/auditoriums
        distinguishing_aspect: "An auditorium created with only name and seat_capacity comes back 201 with every posture field defaulted from a system value and no client-supplied state, and version exactly 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /auditoriums"
              payload: { name: "Theater 1", seat_capacity: 80 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Auditorium.${aud_id}.name == \"Theater 1\" and seat_capacity == 80"
            - "Auditorium.${aud_id}.status == \"DARK\" and service_posture == \"DARK\" and build_phase == \"EMPTY\""
            - "Auditorium.${aud_id}.screen_lead_time_minutes == 20, kitchen_point_rate == 1 and alcove_point_rate == 3, all taken from the declared defaults"
            - "Auditorium.${aud_id}.version == 1 and created_at and updated_at are both present"

      - name: server_create_reads_back_with_empty_ratings_and_rotation_on
        claim_type: Retrieval
        grounds:
          - entities.Server
          - entities.Server.fields.ratings
          - entities.Server.fields.in_rotation
          - endpoints.GET_/servers/{id}
        distinguishing_aspect: "A freshly created server round-trips through the read endpoint with ratings as an empty array, lifetime_points 0 and in_rotation true, none of which were supplied."
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, created by PlatformAdmin."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 2", seat_capacity: 60 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Ada", home_auditorium_id: "${aud_id}" }
              as: KitchenLead
              captures: { srv_id: $.data.id }
          trigger:
            - call: "GET /servers/${srv_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "data.display_name == \"Ada\" and data.home_auditorium_id == \"${aud_id}\""
            - "data.ratings == []"
            - "data.lifetime_points == 0 and data.status == \"ACTIVE\" and data.in_rotation == true"
            - "data.version == 1"

      - name: list_endpoints_apply_the_default_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.MenuItem
          - endpoints.GET_/menu-items
          - response_envelope.pagination_defaults
        distinguishing_aspect: "A list endpoint returns response_type array with total_count, has_more and the declared default limit of 10 when the caller supplies no pagination parameters."
        test_recipe:
          setup:
            - "Three menu items exist."
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { catalog_name: "Popcorn", channel: "ENTREE", price_cents: 800, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { catalog_name: "Root Beer", channel: "BEVERAGE", price_cents: 500, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { catalog_name: "Pale Ale", channel: "BEVERAGE", price_cents: 700, prep_minutes: 1, is_alcoholic: true }
              as: PlatformAdmin
          trigger:
            - call: "GET /menu-items"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response_type is array and data has exactly 3 elements"
            - "the envelope carries limit == 10, offset == 0, total_count == 3 and has_more == false"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: get_missing_showtime_returns_not_found_error
        claim_type: Not Found
        grounds:
          - errors[ERR_SHOWTIME_NOT_FOUND]
          - endpoints.GET_/showtimes/{id}
        distinguishing_aspect: "Reading a showtime id that was never minted returns ERR_SHOWTIME_NOT_FOUND with HTTP 404 rather than an empty object."
        test_recipe:
          setup:
            - "An auditorium exists so the failure is not an auditorium lookup."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 3", seat_capacity: 60 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
          trigger:
            - call: "GET /showtimes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response carries HTTP 404 and response_type error"
            - "data.error_id == \"ERR_SHOWTIME_NOT_FOUND\""

      - name: showtime_create_ignores_client_supplied_derived_instants
        claim_type: Computed Fields
        grounds:
          - entities.Showtime.fields.dining_open_at_utc
          - entities.Showtime.fields.entree_ready_deadline_utc
          - entities.Showtime.fields.pre_show_minutes
          - endpoints.POST_/showtimes
        distinguishing_aspect: "Every window instant is server-derived from start_at_utc, runtime_minutes and the auditorium's lead time, so the returned instants are computable from declared inputs alone."
        test_recipe:
          setup:
            - "Auditorium A with screen_lead_time_minutes 20, 60 seats."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 4", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
          trigger:
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Alien", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x_id: $.data.id }
          assert:
            - "Showtime.${x_id}.pre_show_minutes == 20, inherited from the auditorium"
            - "Showtime.${x_id}.dining_open_at_utc == \"2026-09-01T19:40:00Z\""
            - "Showtime.${x_id}.entree_ready_deadline_utc == \"2026-09-01T21:15:00Z\", being start_at_utc plus floor(100 * 0.75) minutes"
            - "Showtime.${x_id}.dining_close_at_utc == \"2026-09-01T21:05:00Z\", being the deadline minus 10 minutes"
            - "Showtime.${x_id}.status == \"SCHEDULED\" and mode == \"DINING_CLOSED\""

      - name: showtime_create_rejects_runtime_below_one_minute
        claim_type: Type Constraints
        grounds:
          - entities.Showtime.fields.runtime_minutes
          - endpoints.POST_/showtimes
        distinguishing_aspect: "A runtime of zero violates the declared floor of 1 and is refused before any window instant is derived."
        test_recipe:
          setup:
            - "Auditorium A exists."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 5", seat_capacity: 60 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
          trigger:
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Zero", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 0, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the call is refused with HTTP 400"
            - "data.error_id == \"ERR_INVALID_SHOWTIME_RUNTIME\""

      - name: themed_menu_item_is_immutable_and_has_no_version
        claim_type: Immutability
        grounds:
          - entities.ThemedMenuItem
          - endpoints.GET_/themed-menu-items/{id}
        distinguishing_aspect: "ThemedMenuItem is declared with common_fields false, so its read carries id and created_at but neither updated_at nor version, and no endpoint in §1.5 mutates it."
        test_recipe:
          setup:
            - "Auditorium A, a menu item, and a programming event with one themed item attached."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 6", seat_capacity: 60 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Meat Pie", channel: "ENTREE", price_cents: 900, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
              captures: { mi_id: $.data.id }
            - call: "POST /programming-events"
              payload: { auditorium_id: "${aud_id}", theme_name: "Medieval Night", requires_themed_menu: true }
              as: ProgrammingCoordinator
              captures: { pe_id: $.data.id }
            - call: "POST /programming-events/${pe_id}/themed-menu-items"
              payload: { menu_item_id: "${mi_id}", theme_price_cents: 1100, is_signature: true }
              as: ProgrammingCoordinator
              captures: { tmi_id: $.data.id }
          trigger:
            - call: "GET /themed-menu-items/${tmi_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "data.id == \"${tmi_id}\" and data.created_at is present"
            - "data.theme_price_cents == 1100 and data.is_signature == true"
            - "the payload carries no updated_at key and no version key"

      - name: menu_item_availability_enum_starts_available_and_has_one_writer
        claim_type: Enum Closure
        grounds:
          - entities.MenuItem.fields.availability_state
          - endpoints.POST_/menu-items
        distinguishing_aspect: "AVAILABLE is written at creation; OUT_OF_STOCK is reachable only through the declared stock-adjustment endpoint, so no enum value is a dead end."
        test_recipe:
          setup:
            - "Empty database, clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { catalog_name: "Bavarian Pretzel", channel: "ENTREE", price_cents: 950, prep_minutes: 2, is_alcoholic: false }
              as: PlatformAdmin
              captures: { mi_id: $.data.id }
          trigger:
            - call: "GET /menu-items/${mi_id}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /menu-items/${mi_id}/stock"
              payload: { availability_state: "OUT_OF_STOCK" }
              as: PlatformAdmin
            - call: "GET /menu-items/${mi_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the create response carried data.availability_state == \"AVAILABLE\""
            - "the read after the stock call reports data.availability_state == \"OUT_OF_STOCK\""
            - "the enum's two declared values are therefore both writable from the declared surface, and no third value appears"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: auditorium_posture_is_compound_over_showtime_states
        claim_type: compound
        grounds:
          - state_machines.Auditorium.DARK_to_TURNOVER
          - state_machines.Auditorium.TURNOVER_to_LIVE
          - state_machines.Auditorium.LIVE_to_DARK
          - calculations.auditorium_posture_reconciliation
        distinguishing_aspect: "The auditorium has no direct state-setting endpoint; its status moves only as a consequence of its member showtimes, and it walks DARK to TURNOVER to LIVE to TURNOVER to DARK across one schedule."
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, clock 2026-09-01T19:00:00Z, empty of showtimes."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 7", seat_capacity: 60 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "First", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "GET /auditoriums/${aud_id}/posture"
              payload: {}
              as: KitchenLead
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "GET /auditoriums/${aud_id}/posture"
              payload: {}
              as: KitchenLead
            - call: "POST /showtimes/${x1_id}/cancel"
              payload: {}
              as: ProgrammingCoordinator
            - call: "GET /auditoriums/${aud_id}/posture"
              payload: {}
              as: KitchenLead
          assert:
            - "after scheduling, the posture reads status == \"TURNOVER\" and build_phase == \"READY\", since 19:00 is at or past the 19:40 dining open minus the 30-minute ready lead"
            - "after open-dining the posture reads status == \"LIVE\""
            - "after cancelling the only showtime the posture reads status == \"DARK\" and build_phase == \"EMPTY\""
            - "no endpoint was called that sets Auditorium.status directly"

      - name: reopen_service_reverts_auto_completed_sections_and_their_points
        claim_type: cyclic
        grounds:
          - state_machines.Showtime.COMPLETED_to_SERVICE
          - state_machines.SectionAssignment.COMPLETED_to_ACTIVE
          - entities.Server.fields.lifetime_points
        distinguishing_aspect: "COMPLETED is not terminal: reopening within the feature window walks the showtime back to SERVICE and the auto-completed section back to ACTIVE, removing exactly the points the completion had added."
        test_recipe:
          setup:
            - "Auditorium A, kitchen_point_rate 1. Server S1 hired into A. Showtime X1 starts 2026-09-01T20:00:00Z runtime 100 with section SA1 (S1, LEFT), X1 in SERVICE and the clock past the feature start."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 8", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Bea", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Heat", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /showtimes/${x1_id}/start-service"
              payload: {}
              as: KitchenLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T20:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /showtimes/${x1_id}/complete"
              payload: {}
              as: KitchenLead
            - call: "GET /servers/${srv_id}"
              payload: {}
              as: KitchenLead
            - call: "POST /showtimes/${x1_id}/reopen-service"
              payload: {}
              as: KitchenLead
            - call: "GET /servers/${srv_id}"
              payload: {}
              as: KitchenLead
          assert:
            - "completing the showtime scores SA1 at data.assignment_points == 2, the UNRATED base"
            - "the server then reads lifetime_points == 2"
            - "after reopen-service the section reads status == \"ACTIVE\" with assignment_points == 0"
            - "the server reads lifetime_points == 0 again, so the reopen removed exactly the points the completion had added"

      - name: terminal_showtime_rejects_every_outbound_trigger
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Showtime.SCHEDULED_to_CANCELLED
          - errors[ERR_SHOWTIME_NOT_SCHEDULED]
          - errors[ERR_SHOWTIME_NOT_DINING_OPEN]
        distinguishing_aspect: "CANCELLED is terminal, so open-dining and start-service both reject from it with their own state errors rather than silently no-opping."
        test_recipe:
          setup:
            - "Auditorium A with one scheduled showtime X1, which is then cancelled."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 9", seat_capacity: 60 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Cancelled", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id }
          trigger:
            - call: "POST /showtimes/${x1_id}/cancel"
              payload: {}
              as: ProgrammingCoordinator
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
              captures: { err_open: $.data.error_id }
            - call: "POST /showtimes/${x1_id}/start-service"
              payload: {}
              as: KitchenLead
              captures: { err_service: $.data.error_id }
          assert:
            - "the cancelled showtime reads data.status == \"CANCELLED\""
            - "open-dining from the terminal state is refused with data.error_id == \"ERR_SHOWTIME_NOT_SCHEDULED\""
            - "start-service from the terminal state is refused with data.error_id == \"ERR_SHOWTIME_NOT_DINING_OPEN\""

      - name: programming_event_activation_is_guarded_by_linked_showtime_presence
        claim_type: guarded transition
        grounds:
          - state_machines.ProgrammingEvent.DRAFT_to_ACTIVATED
          - errors[ERR_NO_LINKED_SHOWTIME]
        distinguishing_aspect: "The activation edge requires an entity of another type to exist first: with an approved pre-show cut but no special-event showtime pointing at the event, activation is refused."
        test_recipe:
          setup:
            - "Auditorium A, a themed menu item, and a programming event whose pre-show content has been approved. No showtime linked yet."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 10", seat_capacity: 60 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Roast Beast", channel: "ENTREE", price_cents: 1400, prep_minutes: 2, is_alcoholic: false }
              as: PlatformAdmin
              captures: { mi_id: $.data.id }
            - call: "POST /programming-events"
              payload: { auditorium_id: "${aud_id}", theme_name: "Holiday Special", requires_themed_menu: true }
              as: ProgrammingCoordinator
              captures: { pe_id: $.data.id, pe_v: $.data.version }
            - call: "POST /programming-events/${pe_id}/themed-menu-items"
              payload: { menu_item_id: "${mi_id}", theme_price_cents: 1600, is_signature: true }
              as: ProgrammingCoordinator
            - call: "POST /programming-events/${pe_id}/pre-show-content/submit"
              payload: {}
              as: ProgrammingCoordinator
            - call: "POST /programming-events/${pe_id}/pre-show-content/approve"
              payload: {}
              as: PreShowProducer
          trigger:
            - call: "POST /programming-events/${pe_id}/activate"
              payload: { expected_programming_event_version: "${pe_v}" }
              as: ProgrammingCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the activation is refused with data.error_id == \"ERR_NO_LINKED_SHOWTIME\" and HTTP 404"
            - "the event still reads data.status == \"DRAFT\" with pre_show_content_status == \"PRE_SHOW_APPROVED\""

  # ===========================================================================
  - section: calculations
    instances:

      - name: kitchen_load_projection_excludes_non_entree_and_terminal_slips
        claim_type: Input Set Filtering
        grounds:
          - calculations.kitchen_load_projection
          - calculations.kitchen_load_projection.input_set
          - endpoints.GET_/showtimes/{id}/dining-capacity
        distinguishing_aspect: "A beverage slip and a cancelled entree slip both sit on the showtime yet neither contributes to the entree load, so the load equals only the in-flight entree points."
        test_recipe:
          setup:
            - "Auditorium A, kitchen_point_rate 1, alcove_point_rate 3. ENTREE E1 price 1000 prep 2. BEVERAGE B1 price 500 prep 1 non-alcoholic. Server S1. Showtime X1 starts 2026-09-01T20:00:00Z runtime 100."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 11", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Calzone", channel: "ENTREE", price_cents: 1000, prep_minutes: 2, is_alcoholic: false }
              as: PlatformAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Lemonade", channel: "BEVERAGE", price_cents: 500, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Cleo", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Heat", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 1, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv_id}"
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 2, lines: [ { menu_item_id: "${b1_id}", quantity: 4 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv_id}"
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 3, lines: [ { menu_item_id: "${e1_id}", quantity: 2 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv_id}"
              captures: { doomed_id: $.data.id }
          trigger:
            - call: "POST /order-slips/${doomed_id}/cancel"
              payload: { reason_code: "SERVICE_OVERFLOW" }
              as: KitchenLead
            - call: "GET /showtimes/${x1_id}/dining-capacity"
              payload: {}
              as: KitchenLead
          assert:
            - "the beverage slip of 4x B1 contributes nothing, so its 4 points never enter entree_load_points"
            - "the cancelled entree slip of 2x E1 drops out of the cohort"
            - "data.entree_load_points == 2, which is the single surviving 1x E1 at 2 points"
            - "data.beverage_load_points == 0, since no hot-line ticket is open yet"

      - name: section_assignment_points_multiply_grade_ejection_and_refund
