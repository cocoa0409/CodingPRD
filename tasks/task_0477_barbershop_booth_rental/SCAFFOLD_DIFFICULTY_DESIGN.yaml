      # --- Instance 2: shift closed-buffer overlap on a chair (different interval semantics) ---
      - name: shift_chair_closed_buffer_overlap
        grounds:
          - validations[priority=13]
          - errors[ERR_SHIFT_OVERLAP]
          - entities.BarberShift.fields.chair_id
          - entities.Shop.fields.late_grace_minutes
        distinguishing_aspect: "Shift overlap uses CLOSED-BUFFER semantics: two SCHEDULED shifts on the same chair must keep a >= late_grace_minutes(=10) gap, so a back-to-back shift that merely touches (gap 0) is rejected ERR_SHIFT_OVERLAP — geometrically different from instance 1's half-open touching-allowed appointment rule, and on a different resource entity (BarberShift vs Appointment)."
