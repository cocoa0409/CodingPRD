          assert:
            - "${frozen_a} == 0.5 and Listing.${list_fz_a}.frozen_price_usd == 0.5"
            - "Listing.${list_fz_a}.gross_credit_volume == 50.0 and provider_payout_usd == 42.5 and platform_fee_usd == 7.5"
            - "GET provider-payout data.price_source == FLAT_PRICE because ${list_fz_b} has never paid out"
            - "Listing.${list_fz_b}.frozen_price_usd == null"
      - name: awsdaily_storage_components_priced_separately
        claim_type: Constants Applied
        grounds:
          - calculations.storage_billing_time_travel_fail_safe.constants.BILLABLE_RATE
          - entities.StorageUsageRecord.fields.time_travel_days
        distinguishing_aspect: "The three per-component rates are applied independently, so a zero time-travel window drops that component to zero dollars while the other two still bill."
        test_recipe:
          setup: ["one account"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Calc Rates", account_locator: "cr2113", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_rt2: $.data.id }
            - call: "POST /v1/storage-usage-records"
              payload: { account_id: "${acct_rt2}", usage_date: "2026-09-05T00:00:00Z", active_tb: 10.0, time_travel_tb: 5.0, fail_safe_tb: 2.0, time_travel_days: 0 }
              as: DataEngineer
              captures: { sur_rt: $.data.id }
