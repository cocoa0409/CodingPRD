            - call: "POST /msha/inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.370", kind: "CITATION", negligence: "NONE", gravity_likelihood: "REASONABLY_LIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: true }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id, cv1: $.data.version }
            - call: "GET /msha/citations/${cit1}/penalty-assessments"
              payload: {}
