# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Escrow Holdback & Repair Escrow Administration
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: holdback_sizing_provisional_vs_commitment
        grounds:
          - calculations.holdback_sizing
          - entities.Holdback.fields.holdback_amount_cents
          - entities.Holdback.fields.commitment_basis_cents
          - state_machines.Bid.SUBMITTED_to_SELECTED
        distinguishing_aspect: |
          On the Holdback/agreement domain: PROVISIONAL sizing uses repair_estimate_cents
          (200000 x 1.15 = 230000, the funded amount) while COMMITMENT_BASIS sizing uses the
          selected Bid.amount_cents (210000 x 1.15 = 241500); same agreement, two valid
          algorithms, 11500-cent divergence. This instance is distinct from
          draw_shortfall_net_vs_gross_cap, which lives on the DrawRequest/ledger domain.
        test_recipe:
          setup:
            - "EscrowFile with buyer_1/seller_1/lender_1 (no insurer)"
            - "Holdback: estimate 200000, contingency 15 -> provisional amount 230000; status ACTIVE"
            - "Contractor contr_1 has a SUBMITTED bid of 210000"
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof and gutter repair", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_l}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
            - call: "POST /escrow/bids"
              payload: { holdback_id: "${hb_id}", amount_cents: 210000, scope_text: "Full tear-off and reshingle" }
              as: Contractor
              as_user_id: "contr_1"
              captures: { bid_id: $.data.id }
          trigger:
            - { call: "POST /escrow/bids/${bid_id}/select", payload: {}, as: Buyer, as_user_id: "buyer_1" }
            - call: "GET /escrow/holdbacks/${hb_id}"
              as: EscrowOfficer
              captures: { amt_prov: $.data.holdback_amount_cents, amt_commit: $.data.commitment_basis_cents }
          assert:
            - "Holdback.${hb_id}.holdback_amount_cents == 230000 (PROVISIONAL variant, funded at creation, unchanged by selection)"
            - "Holdback.${hb_id}.commitment_basis_cents == 241500 (COMMITMENT_BASIS variant = round_half_up(210000 * 115 / 100))"
            - "amt_prov != amt_commit — the two variants diverge for identical agreement terms"
            - "Holdback.${hb_id}.selected_bid_id == ${bid_id}"

      - name: draw_shortfall_net_vs_gross_cap
        grounds:
          - calculations.draw_payable_cap
          - calculations.shortfall_assessment
          - state_machines.DrawRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          On the DrawRequest/ledger domain (different entity domain than
          holdback_sizing_provisional_vs_commitment): the pinned NET cap subtracts other
          APPROVED-unpaid draws, so approving a 90000 draw while 150000 is APPROVED-unpaid
          against a 230000 holdback yields projected_excess 10000 and a pledge; the GROSS
          reading (trust_balance only) sees 90000 <= 230000 and creates no pledge.
        test_recipe:
          setup:
            - "ACTIVE holdback, amount 230000 (estimate 200000, contingency 15), overrun_responsibility=BUYER"
            - "Work order exists (bid 210000 selected); draw1 (150000) APPROVED but unpaid"
            - "draw2 (90000) SUBMITTED with a verifying inspection reported after its creation"
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof and gutter repair", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_l}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
            - call: "POST /escrow/bids"
              payload: { holdback_id: "${hb_id}", amount_cents: 210000, scope_text: "Full tear-off and reshingle" }
              as: Contractor
              as_user_id: "contr_1"
              captures: { bid_id: $.data.id }
            - { call: "POST /escrow/bids/${bid_id}/select", payload: {}, as: Buyer, as_user_id: "buyer_1" }
            - call: "POST /escrow/draw-requests"
              payload: { holdback_id: "${hb_id}", amount_cents: 150000, description: "Stage 1 tear-off", is_final: false }
              as: Contractor
              as_user_id: "contr_1"
              captures: { draw1_id: $.data.id }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_1", purpose: "DRAW_VERIFICATION", scheduled_start: "2026-08-20T10:00:00Z", scheduled_end: "2026-08-20T11:00:00Z" }
              as: EscrowOfficer
              captures: { ins1_id: $.data.id }
            - { call: "POST /escrow/inspections/${ins1_id}/report", payload: { result: "PASSED" }, as: Inspector, as_user_id: "insp_1" }
            - { call: "POST /escrow/draw-requests/${draw1_id}/approve", payload: {}, as: EscrowOfficer }
            - call: "POST /escrow/draw-requests"
              payload: { holdback_id: "${hb_id}", amount_cents: 90000, description: "Stage 2 materials", is_final: false }
              as: Contractor
              as_user_id: "contr_1"
              captures: { draw2_id: $.data.id }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_1", purpose: "DRAW_VERIFICATION", scheduled_start: "2026-08-21T10:00:00Z", scheduled_end: "2026-08-21T11:00:00Z" }
              as: EscrowOfficer
              captures: { ins2_id: $.data.id }
            - { call: "POST /escrow/inspections/${ins2_id}/report", payload: { result: "PASSED" }, as: Inspector, as_user_id: "insp_1" }
          trigger:
            - { call: "POST /escrow/draw-requests/${draw2_id}/approve", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/shortfall-pledges"
              as: EscrowOfficer
              captures: { pledge_amt: "$.data[0].amount_cents", pledge_status: "$.data[0].status" }
          assert:
            - "pledge_amt == 10000 (NET: (0 disbursed + 240000 reserved) - 230000 funded = 10000)"
            - "pledge_status == PLEDGED and payer_role == BUYER (overrun_responsibility=BUYER -> single pledge)"
            - "Under the rejected GROSS reading no pledge would exist (90000 <= 230000); the pledge's existence proves NET"
            - "Holdback.${hb_id}.reserved_cents == 240000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: extension_grant_nested_min_caps
        grounds:
          - calculations.extension_grant
          - state_machines.ExtensionRequest.PENDING_to_GRANTED
          - entities.Holdback.fields.effective_deadline_date
        distinguishing_aspect: |
          Mode (a): a 4-input nested min with a reason-conditional branch — requested 21,
          WEATHER_EXTERIOR per-request cap 21, total cap remaining 31 (45 - 14 granted),
          hard-stop remaining 16 (2026-10-15 minus 2026-09-29) — grants 16, a partial grant
          driven by the hard-stop term, distinct from close_split_rounding_order's
          rounding-order mode (b).
        test_recipe:
          setup:
            - "ACTIVE holdback: work_deadline_date 2026-09-15, hard_stop_date 2026-10-15, exterior_work_flag true"
            - "First extension already GRANTED 14 days (effective deadline 2026-09-29)"
            - "Second extension PENDING with requested_days 21, reason WEATHER_EXTERIOR"
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Exterior paint and siding", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_l}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
            - call: "POST /escrow/extension-requests"
              payload: { holdback_id: "${hb_id}", reason: "WEATHER_EXTERIOR", requested_days: 14, evidence_ref: "NOAA storm log A" }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { ext1_id: $.data.id }
            - { call: "POST /escrow/extension-requests/${ext1_id}/decide", payload: { decision: "GRANTED" }, as: EscrowOfficer }
            - call: "POST /escrow/extension-requests"
              payload: { holdback_id: "${hb_id}", reason: "WEATHER_EXTERIOR", requested_days: 21, evidence_ref: "NOAA storm log B" }
              as: Seller
              as_user_id: "seller_1"
              captures: { ext2_id: $.data.id }
          trigger:
            - call: "POST /escrow/extension-requests/${ext2_id}/decide"
              payload: { decision: "GRANTED" }
              as: EscrowOfficer
              captures: { granted2: $.data.granted_days }
            - call: "GET /escrow/holdbacks/${hb_id}"
              as: EscrowOfficer
              captures: { eff_dl: $.data.effective_deadline_date, tot_ext: $.data.granted_extension_days }
          assert:
            - "ExtensionRequest.${ext1_id}.granted_days == 14 (min(14, 21, 45, 30))"
            - "granted2 == 16 (min(21, 21, 31, 16)) — partial grant clamped by hard_stop_date, not by requested or per-request cap"
            - "tot_ext == 30"
            - "eff_dl == '2026-10-15' (exactly the hard stop; 2026-09-15 + 14d + 16d)"

      - name: close_split_rounding_order
        grounds:
          - calculations.close_waterfall
          - state_machines.Holdback.ACTIVE_to_CLOSED_COMPLETED
          - entities.LedgerEntry.fields.running_balance_cents
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order: on an odd 10503-cent remainder the
          seller share is rounded half-up FIRST (round_half_up(5251.5) = 5252) and the buyer
          takes the residual (5251); independently rounding both shares yields 5252+5252 and
          drifts a cent from the remainder — distinct from extension_grant_nested_min_caps'
          nested-min mode (a).
        test_recipe:
          setup:
            - "ACTIVE holdback sized to an odd amount: estimate 9548, contingency 10 -> holdback_amount_cents 10503"
            - "funding_source SPLIT_EQUAL; bid 9000 selected; work order VERIFIED; zero draws ever requested"
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "2 Cedar Ln", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Fence rebuild", repair_estimate_cents: 9548, contingency_pct: 10, funding_source: "SPLIT_EQUAL", overrun_responsibility: "SPLIT_EQUAL", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: false }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_l}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
            - call: "POST /escrow/bids"
              payload: { holdback_id: "${hb_id}", amount_cents: 9000, scope_text: "Fence panels" }
              as: Contractor
              as_user_id: "contr_1"
              captures: { bid_id: $.data.id }
            - { call: "POST /escrow/bids/${bid_id}/select", payload: {}, as: Buyer, as_user_id: "buyer_1" }
            - call: "GET /escrow/holdbacks/${hb_id}/work-orders"
              as: EscrowOfficer
              captures: { wo_id: "$.data[0].id" }
            - { call: "POST /escrow/work-orders/${wo_id}/submit-completion", payload: {}, as: Contractor, as_user_id: "contr_1" }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_1", purpose: "FINAL_VERIFICATION", scheduled_start: "2026-08-25T09:00:00Z", scheduled_end: "2026-08-25T10:00:00Z" }
              as: EscrowOfficer
              captures: { fins_id: $.data.id }
            - { call: "POST /escrow/inspections/${fins_id}/report", payload: { result: "PASSED" }, as: Inspector, as_user_id: "insp_1" }
          trigger:
            - { call: "POST /escrow/holdbacks/${hb_id}/close", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/ledger-entries"
              as: EscrowOfficer
              captures: { e1_type: "$.data[1].entry_type", e1_amt: "$.data[1].amount_cents", e1_run: "$.data[1].running_balance_cents", e2_type: "$.data[2].entry_type", e2_amt: "$.data[2].amount_cents", e2_run: "$.data[2].running_balance_cents" }
          assert:
            - "e1_type == RETURN_TO_SELLER and e1_amt == -5252 (seller share rounded half-up first from 5251.5)"
            - "e2_type == RELEASE_TO_BUYER and e2_amt == -5251 (residual: 10503 - 5252)"
            - "e1_run == 5251 and e2_run == 0 (no cent drift; independent rounding would leave 1 cent stranded)"
            - "Holdback.${hb_id}.trust_balance_cents == 0 and status == CLOSED_COMPLETED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_rework_cycle
        grounds:
          - state_machines.WorkOrder.COMPLETION_SUBMITTED_to_IN_PROGRESS
          - state_machines.WorkOrder.COMPLETION_SUBMITTED_to_VERIFIED
          - entities.WorkOrder.fields.failed_final_count
        distinguishing_aspect: |
          Cycle on WorkOrder: COMPLETION_SUBMITTED -> IN_PROGRESS on a FAILED final report
          and back to COMPLETION_SUBMITTED on resubmission, terminating VERIFIED only via a
          REINSPECTION pass (enabled solely by failed_final_count >= 1). Distinct entity
          from holdback_approval_rejection_cycle (Holdback).
        test_recipe:
          setup:
            - "ACTIVE holdback 230000; bid 210000 selected; WorkOrder IN_PROGRESS"
            - "One FAILED FINAL_VERIFICATION report has already reworked the order once"
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof and gutter repair", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_l}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
            - call: "POST /escrow/bids"
              payload: { holdback_id: "${hb_id}", amount_cents: 210000, scope_text: "Full tear-off" }
              as: Contractor
              as_user_id: "contr_1"
              captures: { bid_id: $.data.id }
            - { call: "POST /escrow/bids/${bid_id}/select", payload: {}, as: Buyer, as_user_id: "buyer_1" }
            - call: "GET /escrow/holdbacks/${hb_id}/work-orders"
              as: EscrowOfficer
              captures: { wo_id: "$.data[0].id" }
            - { call: "POST /escrow/work-orders/${wo_id}/submit-completion", payload: {}, as: Contractor, as_user_id: "contr_1" }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_1", purpose: "FINAL_VERIFICATION", scheduled_start: "2026-08-20T09:00:00Z", scheduled_end: "2026-08-20T10:00:00Z" }
              as: EscrowOfficer
              captures: { fins1_id: $.data.id }
            - { call: "POST /escrow/inspections/${fins1_id}/report", payload: { result: "FAILED", result_notes: "Flashing missing" }, as: Inspector, as_user_id: "insp_1" }
          trigger:
            - { call: "POST /escrow/work-orders/${wo_id}/submit-completion", payload: {}, as: Contractor, as_user_id: "contr_1" }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_1", purpose: "REINSPECTION", scheduled_start: "2026-08-28T09:00:00Z", scheduled_end: "2026-08-28T10:00:00Z" }
              as: EscrowOfficer
              captures: { rins_id: $.data.id }
            - { call: "POST /escrow/inspections/${rins_id}/report", payload: { result: "PASSED" }, as: Inspector, as_user_id: "insp_1" }
            - call: "GET /escrow/holdbacks/${hb_id}/work-orders"
              as: EscrowOfficer
              captures: { wo_status: "$.data[0].status", wo_fails: "$.data[0].failed_final_count" }
          assert:
            - "After FAILED final: WorkOrder was IN_PROGRESS (rework loop traversed exactly once)"
            - "wo_fails == 1"
            - "wo_status == VERIFIED (REINSPECTION PASS after the rework)"
            - "Inspection.${fins1_id}.status == FAILED and Inspection.${rins_id}.status == PASSED"

      - name: holdback_approval_rejection_cycle
        grounds:
          - state_machines.Holdback.PENDING_APPROVALS_to_DRAFT
          - state_machines.Approval.REQUESTED_to_REJECTED
          - state_machines.Holdback.DRAFT_to_PENDING_APPROVALS
        distinguishing_aspect: |
          Cycle on Holdback (different entity than work_order_rework_cycle): a lender
          REJECTION snaps PENDING_APPROVALS back to DRAFT and CANCELLs the still-pending
          insurer approval; amend + resubmit starts a fresh approval round that must reach
          ACTIVE — the negotiation loop is observable in Approval statuses.
        test_recipe:
          setup:
            - "EscrowFile WITH insurer_1 (two approvals required)"
            - "Holdback submitted once; lender REJECTED -> holdback back in DRAFT, insurer approval CANCELLED"
            - "Terms amended, resubmitted; fresh approvals REQUESTED"
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1", insurer_user_id: "insurer_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof and gutter repair", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id, hb_v1: $.data.version }
            - call: "POST /escrow/holdbacks/${hb_id}/submit"
              payload: {}
              as: EscrowOfficer
              captures: { hb_v2: $.data.version }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_ins1: "$.data[0].id", ap_len1: "$.data[1].id" }
            - { call: "POST /escrow/approvals/${ap_len1}/decide", payload: { decision: "REJECTED", rejection_reason: "Contingency too low" }, as: Lender, as_user_id: "lender_1" }
            - call: "GET /escrow/holdbacks/${hb_id}"
              as: EscrowOfficer
              captures: { hb_v3: $.data.version }
            - call: "POST /escrow/holdbacks/${hb_id}/amend"
              payload: { expected_holdback_version: "${hb_v3}", contingency_pct: 20 }
              as: EscrowOfficer
            - call: "POST /escrow/holdbacks/${hb_id}/submit"
              payload: {}
              as: EscrowOfficer
              captures: { hb_v5: $.data.version }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
