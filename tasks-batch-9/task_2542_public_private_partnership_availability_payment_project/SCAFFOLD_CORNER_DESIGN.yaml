      - name: amending_a_drafted_concession_leaves_the_charge_undecided
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /ppp/concessions/{id}]
          - calculations.monthly_unitary_charge
          - entities.Concession.fields.monthly_unitary_charge_cents
        distinguishing_aspect: |
          The only update endpoint in the surface, and it is deliberately partial: a PATCH
          may rewrite masp_cents and deduction_cap_pct while status == DRAFTED, must bump
          version to 2, and must NOT derive monthly_unitary_charge_cents — that value is
          minted at financial close from whatever the amended parameters then are, which is
          what keeps a frozen period charge from ever being invalidated retroactively.
        test_recipe:
          setup:
            - "A freshly created concession in DRAFTED with masp 100000000, deduction_cap_pct 0.20 and version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
