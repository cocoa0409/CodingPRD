scenario: |
  Packaging & Shipping-Supply Distribution (Uline style): catalog SKU breadth & same-day ship cutoff, multi-warehouse sourcing by zone, quantity break pricing & pallet quantity, custom-print item lead time & tolerance, freight class calculation & oversize handling, back-in-stock notification, corporate account & PO approval, return of custom vs stock item

domain_name: packaging-shipping-supply-distribution
api_prefix: /packaging-distribution

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: pricing engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Legal or trading name of the corporate buyer."
      - name: account_type
        type: enum
        source: input
        description: "CORPORATE or RETAIL; gates PO-required checkout and net-terms invoicing."
        constraints: "CORPORATE | RETAIL"
      - name: status
        type: enum
        source: system
        description: "ACTIVE or SUSPENDED; suspended accounts cannot submit or approve orders."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum allowed open receivable for this account, in cents."
        constraints: ">= 0"
      - name: po_required
        type: boolean
        source: input
        description: "When true, every CORPORATE account order must reference a unique po_number."
        default: false
      - name: default_warehouse_code
        type: enum
        source: input
        description: "Preferred sourcing warehouse; must exist in the platform warehouse registry."
        constraints: "ATL | RNO | DFW"
      - name: open_receivable_cents
        type: integer
        source: computed
        description: "Sum of grand_total_cents over this account's orders with invoice_status = OPEN. Maintained by calc_open_receivable."
        default: 0

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Catalog-unique stock keeping unit code."
        constraints: "unique across all Products"
      - name: name
        type: string
        source: input
        description: "Display name of the catalog item."
      - name: category
        type: enum
        source: input
        description: "Merchandising category."
        constraints: "BOXES | MAILERS | TAPE | CUSHIONING | LABELS"
      - name: base_price_cents
        type: integer
        source: input
        description: "Unit price in cents before quantity-break and custom-print surcharges."
        constraints: "> 0"
      - name: uom
        type: enum
        source: input
        description: "Selling unit of measure."
        constraints: "EACH | CASE"
      - name: case_qty
        type: integer
        source: input
        description: "Units per case; 1 when uom = EACH."
        constraints: ">= 1"
      - name: pallet_qty
        type: integer
        source: input
        description: "Sellable units per full pallet; drives calc_pallet_incentive."
        constraints: ">= 1"
      - name: weight_lbs_per_unit
        type: number
        source: input
        description: "Ship weight of one sellable unit."
        constraints: "> 0"
      - name: density_pcf
        type: number
        source: input
        description: "Pounds per cubic foot; primary freight-class input."
        constraints: "> 0"
      - name: oversize
        type: boolean
        source: input
        description: "True when any dimension exceeds carrier standard limits; forces FREIGHT method and oversize surcharge."
        default: false
      - name: is_custom_print
        type: boolean
        source: input
        description: "True for made-to-order printed items; changes lead time, returnability, and pricing."
        default: false
      - name: lead_time_days
        type: integer
        source: input
        description: "Business days to produce a custom-print run; must be 0 for stock items."
        default: 0
        constraints: ">= 0; must be > 0 when is_custom_print = true"
      - name: ship_method
        type: enum
        source: computed
        description: "PARCEL when oversize = false, else FREIGHT. Set at creation and on catalog update."
        constraints: "PARCEL | FREIGHT"
      - name: status
        type: enum
        source: system
        description: "ACTIVE products are orderable; DISCONTINUED products are read-only."
        default: ACTIVE
        constraints: "ACTIVE | DISCONTINUED"

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: "Warehouse identifier, unique."
        constraints: "ATL | RNO | DFW; unique"
      - name: name
        type: string
        source: input
        description: "Human-readable facility name."
      - name: zone
        type: integer
        source: input
        description: "Parcel zone of the facility itself (zone-1 rate baseline)."
        constraints: "1..8"
      - name: ship_cutoff_time
        type: string
        source: input
        description: "Local same-day cutoff in HH:MM 24h format, interpreted against the logical clock."
        constraints: "HH:MM"
      - name: timezone
        type: string
        source: input
        description: "IANA timezone name used to localize ship_cutoff_time."
      - name: oversize_capable
        type: boolean
        source: input
        description: "True when the facility can ship oversize/FREIGHT lines."
        default: true
      - name: press_count
        type: integer
        source: input
        description: "Number of custom-print presses at the facility; caps how many CustomPrintJobs may occupy press time at once."
        default: 1
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "ACTIVE warehouses participate in sourcing; INACTIVE do not."
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"

  - name: Inventory
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the stocked catalog item."
      - name: warehouse_id
        type: string
        source: input
        description: "FK -> Warehouse.id; the stocking facility. (product_id, warehouse_id) pair is unique."
      - name: on_hand_qty
        type: integer
        source: input
        description: "Physical units on hand at last receipt."
        constraints: ">= 0"
      - name: reserved_qty
        type: integer
        source: system
        description: "Units reserved by PENDING/STOCK_RESERVED order lines. Changed only by reserve/release/confirm/decrement flows."
        default: 0
        constraints: ">= 0"
      - name: available_qty
        type: integer
        source: computed
        description: "on_hand_qty - reserved_qty; computed on every read, never stored divergently."
      - name: backorderable
        type: boolean
        source: input
        description: "When true, lines short at this warehouse may be placed on backorder instead of failing."
        default: false
      - name: reorder_point_qty
        type: integer
        source: input
        description: "Restock threshold: a stock decrement that leaves available_qty strictly below this fires restock notifications."
        default: 0
        constraints: ">= 0"

  - name: QuantityBreak
    parent: null
    common_fields: false
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product this break prices."
      - name: min_qty
        type: integer
        source: input
        description: "Inclusive lower bound (in sellable units) of the break; the break applies when line qty >= min_qty."
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Flat per-unit price for the entire line when this break is selected (NOT marginal)."
        constraints: "> 0"
      - name: sort_seq
        type: integer
        source: input
        description: "Author-declared ascending order of breaks; deterministic tie/ordering aid equal to ascending min_qty."
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the price window (half-open interval start), evaluated against the logical clock."
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the price window; null means open-ended. Overlap rule: two breaks for the SAME product with the SAME min_qty must not have overlapping [effective_from, effective_to) windows; adjacency (one's effective_to == the other's effective_from) is allowed."
        constraints: "null or > effective_from"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; purchasing account."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of the order."
        default: DRAFT
        constraints: "DRAFT | PENDING | PO_REVIEW | STOCK_RESERVED | CUSTOM_PRODUCTION | SHIPPED | PARTIALLY_BACKORDERED | CANCELLED | RETURNED"
      - name: ship_zone
        type: integer
        source: input
        description: "Destination parcel zone; drives warehouse sourcing distance."
        constraints: "1..8"
      - name: po_number
        type: string
        source: input
        description: "Purchase-order reference; required for CORPORATE accounts with po_required = true; unique per account."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum over non-cancelled lines of qty x resolved unit price. Maintained by calc_order_pricing."
        default: 0
      - name: pallet_discount_cents
        type: integer
        source: computed
        description: "Sum of per-line pallet incentives (negative value stored as positive discount amount)."
        default: 0
      - name: oversize_surcharge_cents
        type: integer
        source: computed
        description: "Per-order oversize handling surcharge from calc_freight_and_oversize."
        default: 0
      - name: freight_estimate_cents
        type: integer
        source: computed
        description: "Estimated freight cost from calc_freight_and_oversize (provisional at submit, final at ship)."
        default: 0
      - name: grand_total_cents
        type: integer
        source: computed
        description: "subtotal_cents - pallet_discount_cents + oversize_surcharge_cents + freight_estimate_cents."
        default: 0
      - name: invoice_status
        type: enum
        source: system
        description: "OPEN accrues to Account.open_receivable_cents; PAID/VOID remove it."
        default: OPEN
        constraints: "OPEN | PAID | VOID"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the DRAFT -> PENDING submit."
      - name: promised_ship_date
        type: datetime
        source: computed
        description: "Same-day vs next-day promise from calc_same_day_cutoff, or lead-time projection for custom orders."

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; owning order."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; purchased item."
      - name: qty
        type: integer
        source: input
        description: "Quantity in sellable units; for uom = CASE must be a multiple of Product.case_qty."
        constraints: ">= 1"
      - name: requested_warehouse_code
        type: enum
        source: input
        description: "Optional sourcing override; must be in the warehouse registry and able to ship the line."
        constraints: "ATL | RNO | DFW | null"
      - name: print_artwork_ref
        type: string
        source: input
        description: "Artwork reference for custom-print lines; required when Product.is_custom_print = true."
      - name: over_under_tolerance_pct
        type: number
        source: input
        description: "Allowed custom-print over/under ship tolerance in percent, 0..20 inclusive; used by receive step."
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Resolved per-unit price from calc_order_pricing (quantity break or base, plus custom-print surcharge)."
      - name: freight_class
        type: string
        source: computed
        description: "NMFC class resolved by calc_freight_and_oversize (e.g. '50', '65', ..., '500')."
      - name: allocated_warehouse_id
        type: string
        source: computed
        description: "FK -> Warehouse.id; warehouse chosen by the sourcing selector at submit; null until STOCK_RESERVED."
      - name: status
        type: enum
        source: system
        description: "Line lifecycle."
        default: OPEN
        constraints: "OPEN | ALLOCATED | IN_PRODUCTION | SHIPPED | BACKORDERED | CANCELLED"
      - name: shipped_qty
        type: integer
        source: system
        description: "Units actually shipped for this line (may differ from qty within tolerance on custom lines)."
        default: 0
        constraints: ">= 0"

  - name: CustomPrintJob
    parent: null
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: input
        description: "FK -> OrderLine.id (1:1); the custom-print line this job produces."
      - name: warehouse_id
        type: string
        source: system
        description: "FK -> Warehouse.id; the producing facility, copied from OrderLine.allocated_warehouse_id at job creation."
      - name: status
        type: enum
        source: system
        description: "Production lifecycle."
        default: QUEUED
        constraints: "QUEUED | PLATING | PRINTING | COMPLETED | SCRAPPED"
      - name: actual_qty
        type: integer
        source: system
        description: "Quantity actually produced, set by the complete step."
        constraints: ">= 0"
      - name: receive_note
        type: string
        source: input
        description: "Optional operator note recorded at completion/scrap."
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the job left QUEUED."
      - name: occupied_until
        type: datetime
        source: computed
        description: "Business-days-after(started_at, Product.lead_time_days) press-release instant; the job occupies a press over the half-open interval [started_at, occupied_until)."

  - name: Return
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the shipped order being returned."
      - name: return_type
        type: enum
        source: input
        description: "STOCK or CUSTOM; CUSTOM allowed only when the order contains custom-print lines."
        constraints: "STOCK | CUSTOM"
      - name: status
        type: enum
        source: system
        description: "Return lifecycle."
        default: REQUESTED
        constraints: "REQUESTED | APPROVED | REJECTED | RECEIVED | RESTOCKED"
      - name: reason_code
        type: string
        source: input
        description: "Free-form reason code supplied by the requester."
      - name: restock_fee_cents
        type: integer
        source: computed
        description: "15% restocking fee on CUSTOM returns (0 on STOCK), from calc_return_restock."
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: "Credit amount issued at RECEIVED, net of restock fee; rounded per line then summed."
        default: 0
      - name: requested_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of return request; drives the 30-day return window."

  - name: ReturnLine
    parent: Return
    common_fields: true
    fields:
      - name: return_id
        type: string
        source: input
        description: "FK -> Return.id; owning return."
      - name: order_line_id
        type: string
        source: input
        description: "FK -> OrderLine.id; the shipped line being returned."
      - name: qty
        type: integer
        source: input
        description: "Units returned; must be <= OrderLine.shipped_qty minus quantities on prior non-REJECTED return lines."
        constraints: ">= 1"

  - name: RestockNotification
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; subscriber."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; watched product. (account_id, product_id) unique while status = ACTIVE."
      - name: status
        type: enum
        source: system
        description: "ACTIVE subscriptions are eligible to fire; NOTIFIED have fired once; CANCELLED opted out."
        default: ACTIVE
        constraints: "ACTIVE | NOTIFIED | CANCELLED"
      - name: notified_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the notification fired."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /packaging-distribution/accounts/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Account.status == ACTIVE"
        side_effects:
          - "Account.version increments by 1"
        note: "Suspension blocks submit and approve; existing orders are untouched."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /packaging-distribution/accounts/{id}/reactivate"
        actor: PlatformAdmin
        preconditions:
          - "Account.status == SUSPENDED"
        side_effects:
          - "Account.version increments by 1"

  - entity: Product
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /packaging-distribution/products/{id}/discontinue"
        actor: CatalogManager
        preconditions:
          - "Product.status == ACTIVE"
          - "No OrderLine with product_id == this product in status IN {OPEN, ALLOCATED, IN_PRODUCTION}"
        side_effects:
          - "Product.version increments by 1"

  - entity: Order
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING
        trigger: "POST /packaging-distribution/orders/{id}/submit"
        actor: Buyer
        preconditions:
          - "Order.account_id references an Account with status == ACTIVE"
          - "At least one OrderLine with order_id == this order and status == OPEN exists"
          - "If Account.account_type == CORPORATE and Account.po_required == true: Order.po_number present and unique among this account's orders"
        side_effects:
          - "calc_order_pricing recomputes subtotal_cents, pallet_discount_cents, grand_total_cents (always, even when routed to PO_REVIEW)"
          - "calc_freight_and_oversize (provisional variant) sets per-line freight_class, Order.oversize_surcharge_cents, Order.freight_estimate_cents (always)"
          - "If the PO_REVIEW routing precondition holds (grand_total_cents > 1000000 on a po_required CORPORATE account): status becomes PO_REVIEW and the allocation pass below is DEFERRED to approve"
          - "Otherwise, allocation pass: for each non-custom OPEN line the selector picks allocated_warehouse_id (see calc_same_day_cutoff); sufficient cover sets line.status = ALLOCATED and increments that Inventory.reserved_qty by line.qty; short stock keeps line.status = OPEN for the split check"
          - "After the allocation pass: any non-custom line still OPEN with allocated Inventory.backorderable == true becomes BACKORDERED; any still OPEN with backorderable == false rejects the whole submit with ERR_BACKORDER_NOT_ALLOWED and no reservations persist"
          - "For each custom-print line (non-PO_REVIEW path): selector picks allocated_warehouse_id ignoring inventory cover (calc_same_day_cutoff custom rule), one CustomPrintJob is created with status QUEUED and warehouse_id = line.allocated_warehouse_id, and the line becomes IN_PRODUCTION"
          - "Final status derivation (non-PO_REVIEW path): any custom line -> CUSTOM_PRODUCTION; else any BACKORDERED line -> PARTIALLY_BACKORDERED; else STOCK_RESERVED"
          - "Order.submitted_at = current logical clock; Order.promised_ship_date computed by calc_same_day_cutoff (stock) or calc_custom_lead_time (custom)"
          - "calc_open_receivable refreshes Account.open_receivable_cents"
          - "Order.version increments by 1"
        note: "Overall order status is derived from the post-allocation line states: the machine is branching with fork on stock cover and custom flag."
      - from: PENDING
        to: STOCK_RESERVED
        trigger: "system: allocation pass inside submit resolves all lines ALLOCATED (no custom lines)"
        actor: system
        preconditions:
          - "All lines status == ALLOCATED"
          - "No line's Product.is_custom_print == true"
        side_effects:
          - "Order.status becomes STOCK_RESERVED"
      - from: PENDING
        to: PARTIALLY_BACKORDERED
        trigger: "system: allocation pass leaves at least one short line on a backorderable Inventory"
        actor: system
        preconditions:
          - "At least one line status == BACKORDERED"
        side_effects:
          - "Order.status becomes PARTIALLY_BACKORDERED"
      - from: PENDING
        to: CUSTOM_PRODUCTION
        trigger: "system: at least one line's product is custom-print"
        actor: system
        preconditions:
          - "At least one OrderLine has Product.is_custom_print == true"
        side_effects:
          - "CustomPrintJob rows created QUEUED (one per custom line)"
          - "Custom lines set to IN_PRODUCTION"
      - from: PENDING
        to: PO_REVIEW
        trigger: "system: account requires PO review routing"
        actor: system
        preconditions:
          - "Account.account_type == CORPORATE and Account.po_required == true and Order.grand_total_cents > 1000000"
        side_effects:
          - "Order.status becomes PO_REVIEW; approval required before allocation pass runs"
        note: "High-value corporate orders route through the approval chain before inventory is touched."
      - from: PO_REVIEW
        to: PENDING
        trigger: "POST /packaging-distribution/orders/{id}/approve"
        actor: AccountApprover
        preconditions:
          - "Order.status == PO_REVIEW"
          - "Account.status == ACTIVE"
          - "calc_credit_check: Account.open_receivable_cents + Order.grand_total_cents <= Account.credit_limit_cents"
        side_effects:
          - "Allocation pass runs exactly as the DRAFT -> PENDING submit side effects (reserve, backorder check, custom job creation, pricing/freight recompute)"
          - "calc_open_receivable refreshes Account.open_receivable_cents"
          - "Order.version increments by 1"
      - from: PO_REVIEW
        to: DRAFT
        trigger: "POST /packaging-distribution/orders/{id}/reject"
        actor: AccountApprover
        preconditions:
          - "Order.status == PO_REVIEW"
        side_effects:
          - "Order.status returns to DRAFT; no reservation was taken; invoice_status stays OPEN with grand_total_cents recomputed by calc_order_pricing"
          - "Order.version increments by 1"
        note: "Branching revert loop DRAFT -> ... -> PO_REVIEW -> DRAFT allows revise-and-resubmit cycles."
      - from: STOCK_RESERVED
        to: SHIPPED
        trigger: "POST /packaging-distribution/orders/{id}/ship"
        actor: WarehouseOps
        preconditions:
          - "Order.status == STOCK_RESERVED"
          - "Every line status == ALLOCATED"
        side_effects:
          - "For each line: Inventory(allocated_warehouse_id, product_id).on_hand_qty -= line.qty and reserved_qty -= line.qty; line.status = SHIPPED; line.shipped_qty = line.qty"
          - "calc_freight_and_oversize (final variant) recomputes freight_estimate_cents from shipped quantities and updates grand_total_cents"
          - "calc_open_receivable refreshes Account.open_receivable_cents"
          - "Order.version increments by 1"
      - from: CUSTOM_PRODUCTION
        to: SHIPPED
        trigger: "POST /packaging-distribution/orders/{id}/ship"
        actor: WarehouseOps
        preconditions:
          - "Order.status == CUSTOM_PRODUCTION"
          - "Every CustomPrintJob of this order's custom lines has status == COMPLETED (each custom line is ALLOCATED with qty = actual_qty)"
          - "Every non-custom line status == ALLOCATED"
        side_effects:
          - "Ship-step side effects (inventory decrement, final freight, receivable refresh) run as in STOCK_RESERVED -> SHIPPED, with custom lines decrementing by their actual_qty reservation; a made-to-order line with no Inventory row at its allocated warehouse skips the decrement"
          - "Order.version increments by 1"
      - from: PARTIALLY_BACKORDERED
        to: SHIPPED
        trigger: "POST /packaging-distribution/orders/{id}/ship"
        actor: WarehouseOps
        preconditions:
          - "Order.status == PARTIALLY_BACKORDERED"
          - "Every non-BACKORDERED line status == ALLOCATED"
        side_effects:
          - "Ship side effects apply to ALLOCATED lines only; BACKORDERED lines stay BACKORDERED and keep no reservation"
          - "calc_freight_and_oversize (final variant) over shipped lines only"
          - "Order.version increments by 1"
        note: "Backordered lines remain for a later receipt-driven allocation; this benchmark ships the covered portion."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /packaging-distribution/orders/{id}/cancel"
        actor: Buyer
        preconditions:
          - "Order.status IN {DRAFT, PENDING, STOCK_RESERVED, PARTIALLY_BACKORDERED}"
          - "If any line Product.is_custom_print == true and its CustomPrintJob.status != QUEUED: reject with ERR_CUSTOM_PRODUCTION_STARTED"
        side_effects:
          - "Release all reservations: each ALLOCATED line's Inventory.reserved_qty -= line.qty; lines become CANCELLED"
          - "Reservation release raises Inventory.available_qty; any RestockNotification (product_id, status == ACTIVE) whose product crosses from below reorder_point_qty to >= reorder_point_qty fires: status -> NOTIFIED, notified_at = current logical clock"
          - "QUEUED CustomPrintJobs are SCRAPPED"
          - "Order.invoice_status = VOID"
          - "calc_open_receivable refreshes Account.open_receivable_cents (removes the voided total)"
          - "Order.version increments by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /packaging-distribution/orders/{id}/cancel"
        actor: Buyer
        preconditions: ["as DRAFT -> CANCELLED"]
        side_effects: ["as DRAFT -> CANCELLED"]
      - from: STOCK_RESERVED
        to: CANCELLED
        trigger: "POST /packaging-distribution/orders/{id}/cancel"
        actor: Buyer
        preconditions: ["as DRAFT -> CANCELLED"]
        side_effects: ["as DRAFT -> CANCELLED"]
      - from: PARTIALLY_BACKORDERED
        to: CANCELLED
        trigger: "POST /packaging-distribution/orders/{id}/cancel"
        actor: Buyer
        preconditions: ["as DRAFT -> CANCELLED"]
        side_effects: ["as DRAFT -> CANCELLED"]
      - from: SHIPPED
        to: RETURNED
        trigger: "POST /packaging-distribution/returns/{id}/receive with all ReturnLines restocked (chain: Return RECEIVED -> RESTOCKED -> Order re-evaluates)"
        actor: system
        preconditions:
          - "Every OrderLine of the order is fully covered by RESTOCKED return lines (sum of return qty == shipped_qty per line)"
        side_effects:
          - "Order.invoice_status = VOID"
          - "calc_open_receivable refreshes Account.open_receivable_cents"
          - "Order.version increments by 1"

  - entity: OrderLine
    initial_state: OPEN
    terminal_states: [CANCELLED, SHIPPED]
    transitions:
      - from: OPEN
        to: ALLOCATED
        trigger: "system: submit/approve allocation pass finds cover at selected warehouse"
        actor: system
        preconditions:
          - "Inventory(selected warehouse, product).available_qty >= qty"
        side_effects:
          - "Inventory.reserved_qty += qty"
      - from: OPEN
        to: BACKORDERED
        trigger: "system: allocation pass short and Inventory.backorderable == true"
        actor: system
        preconditions:
          - "No warehouse in the selector candidate set has available_qty >= qty"
        side_effects:
          - "Order.status becomes PARTIALLY_BACKORDERED"
      - from: OPEN
        to: IN_PRODUCTION
        trigger: "system: custom-print line enters production at submit"
        actor: system
        preconditions:
          - "Product.is_custom_print == true"
        side_effects:
          - "CustomPrintJob created with status QUEUED"
      - from: IN_PRODUCTION
        to: ALLOCATED
        trigger: "POST /packaging-distribution/custom-print-jobs/{id}/receive with actual_qty inside tolerance"
        actor: WarehouseOps
        preconditions:
          - "CustomPrintJob.status == PRINTING"
          - "actual_qty within qty x (1 +/- over_under_tolerance_pct / 100), computed with Decimal half-up to whole units"
        side_effects:
          - "CustomPrintJob.status = COMPLETED; CustomPrintJob.actual_qty set"
          - "Line qty for billing becomes actual_qty; calc_order_pricing recomputes the order totals"
          - "Custom line's reservation at the allocated warehouse: Inventory.reserved_qty += actual_qty when an Inventory row exists for (product, allocated warehouse); made-to-order products without an Inventory row skip the reservation"
      - from: IN_PRODUCTION
        to: OPEN
        trigger: "POST /packaging-distribution/custom-print-jobs/{id}/receive with actual_qty outside tolerance (scrap branch)"
        actor: WarehouseOps
        preconditions:
          - "CustomPrintJob.status == PRINTING"
          - "actual_qty outside the tolerance band"
        side_effects:
          - "CustomPrintJob.status = SCRAPPED"
          - "A replacement CustomPrintJob is created with status QUEUED for the same line"
          - "Line returns to OPEN and immediately re-enters IN_PRODUCTION under the new job (cycle continues)"
        note: "IN_PRODUCTION -> OPEN -> IN_PRODUCTION forms a cyclic rework loop."
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /packaging-distribution/orders/{id}/ship"
        actor: WarehouseOps
        preconditions:
          - "Order.status IN {STOCK_RESERVED, PARTIALLY_BACKORDERED, CUSTOM_PRODUCTION-complete}"
        side_effects:
          - "Inventory.on_hand_qty -= shipped qty; reserved_qty -= shipped qty; shipped_qty set"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /packaging-distribution/orders/{id}/cancel"
        actor: Buyer
        preconditions:
          - "Order cancellable per Order machine"
        side_effects:
          - "Inventory.reserved_qty -= qty"

  - entity: CustomPrintJob
    initial_state: QUEUED
    terminal_states: [COMPLETED, SCRAPPED]
    transitions:
      - from: QUEUED
        to: PLATING
        trigger: "POST /packaging-distribution/custom-print-jobs/{id}/start"
        actor: WarehouseOps
        preconditions:
          - "CustomPrintJob.status == QUEUED"
          - "Press occupancy: at the job's warehouse, count of other jobs in status IN {PLATING, PRINTING} whose half-open occupancy [started_at, occupied_until) intersects [now, business_days_after(now, lead_time_days)) must be < Warehouse.press_count; back-to-back (now == another job's occupied_until) is NOT an intersection"
        side_effects:
          - "started_at = current logical clock"
          - "occupied_until = business_days_after(started_at, Product.lead_time_days of the line's product)"
      - from: PLATING
        to: PRINTING
        trigger: "POST /packaging-distribution/custom-print-jobs/{id}/advance"
        actor: WarehouseOps
        preconditions:
          - "CustomPrintJob.status == PLATING"
        side_effects: []
      - from: PRINTING
        to: COMPLETED
        trigger: "POST /packaging-distribution/custom-print-jobs/{id}/receive with actual_qty within tolerance"
        actor: WarehouseOps
        preconditions:
          - "CustomPrintJob.status == PRINTING"
          - "Tolerance band check passes"
        side_effects:
          - "OrderLine -> ALLOCATED (see OrderLine machine)"
      - from: PRINTING
        to: SCRAPPED
        trigger: "POST /packaging-distribution/custom-print-jobs/{id}/receive with actual_qty outside tolerance"
        actor: WarehouseOps
        preconditions:
          - "CustomPrintJob.status == PRINTING"
          - "Tolerance band check fails"
        side_effects:
          - "Replacement CustomPrintJob created QUEUED with warehouse_id copied; OrderLine cycles IN_PRODUCTION -> OPEN -> IN_PRODUCTION"

  - entity: Return
    initial_state: REQUESTED
    terminal_states: [REJECTED, RESTOCKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /packaging-distribution/returns/{id}/approve"
        actor: CustomerService
        preconditions:
          - "Return.status == REQUESTED"
          - "If return_type == CUSTOM: every ReturnLine's OrderLine has Product.is_custom_print == true, else ERR_CUSTOM_NOT_RETURNABLE"
          - "If return_type == STOCK: every ReturnLine's OrderLine has Product.is_custom_print == false, else ERR_CUSTOM_NOT_RETURNABLE"
          - "requested_at within 30 calendar days of current logical clock (window: now - 30d <= requested_at)"
        side_effects:
          - "calc_return_restock computes restock_fee_cents and refund_cents"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /packaging-distribution/returns/{id}/reject"
        actor: CustomerService
        preconditions:
          - "Return.status == REQUESTED"
        side_effects: []
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /packaging-distribution/returns/{id}/receive"
        actor: WarehouseOps
        preconditions:
          - "Return.status == APPROVED"
        side_effects:
          - "refund_cents finalized (calc_return_restock, rounded per line then summed)"
      - from: RECEIVED
        to: RESTOCKED
        trigger: "POST /packaging-distribution/returns/{id}/restock"
        actor: WarehouseOps
        preconditions:
          - "Return.status == RECEIVED"
        side_effects:
          - "If return_type == STOCK: for each ReturnLine, Inventory at the original OrderLine.allocated_warehouse_id has on_hand_qty += qty (available_qty rises by qty)"
          - "If return_type == CUSTOM: no restock (scrap); on_hand_qty unchanged"
          - "Restock notifications fire for any product whose available_qty crosses from below reorder_point_qty to >= reorder_point_qty — ACTIVE subscriptions become NOTIFIED with notified_at set"
          - "When all lines of the parent Order fully restocked: Order -> RETURNED (invoice VOID)"

  - entity: RestockNotification
    initial_state: ACTIVE
    terminal_states: [CANCELLED, NOTIFIED]
    transitions:
      - from: ACTIVE
        to: NOTIFIED
        trigger: "system: watched product's available_qty at any warehouse crosses from below reorder_point_qty to >= reorder_point_qty (receipt, restock, or reservation release)"
        actor: system
        preconditions:
          - "RestockNotification.status == ACTIVE"
        side_effects:
          - "notified_at = current logical clock"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /packaging-distribution/restock-notifications/{id}/cancel"
        actor: Buyer
        preconditions:
          - "RestockNotification.status == ACTIVE"
          - "Acting Buyer belongs to RestockNotification.account_id"
        side_effects: []

  - entity: Warehouse
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /packaging-distribution/warehouses/{id}/deactivate"
        actor: PlatformAdmin
        preconditions:
          - "Warehouse.status == ACTIVE"
        side_effects:
          - "Warehouse excluded from future sourcing selector candidate sets; existing reservations unaffected"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /packaging-distribution/warehouses/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "Warehouse.status == INACTIVE"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: inventory-adjust-stale-version
    parent_entity: Inventory
    write_endpoint: "POST /packaging-distribution/inventory/{id}/adjust"
    occ_field: "expected_inventory_version"
    description: |
      Adjusting an Inventory row whose version has advanced since the client
      last observed it is rejected. Another writer may have just received
      stock or a reservation may have moved reserved_qty, so the adjuster's
      view of on_hand_qty is stale and the delta would apply to the wrong
      baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: product-update-stale-version
    parent_entity: Product
    write_endpoint: "PUT /packaging-distribution/products/{id}"
    occ_field: "expected_product_version"
    description: |
      Updating a Product whose version has advanced since the client last
      observed it is rejected: a concurrent catalog change may have altered
      base_price_cents or pallet_qty, and repricing on a stale record would
      silently discard the newer catalog state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_order_pricing
    trigger: "Order submit, approve, line add/update in DRAFT, custom receive (qty adjusts to actual_qty)"
    algorithm: tiered_pricing
    formula: |
      For each non-CANCELLED OrderLine (evaluation order pinned: breaks first,
      surcharge second, pallet third):
        base = Product.base_price_cents
        # Quantity break selection: candidate breaks = QuantityBreak rows for the
        # product with min_qty <= line.qty AND effective_from <= current logical
        # clock AND (effective_to IS NULL OR current logical clock < effective_to);
        # selected = candidate with the largest min_qty; tie-break: smallest
        # sort_seq, then earliest created_at.
        # Selected break price REPLACES base for the WHOLE line (all-units, not
        # marginal). A break price may legitimately exceed base (premium pack).
        if candidate set non-empty: unit = selected.unit_price_cents else unit = base
        # Custom-print surcharge is a multiplicative uplift on the resolved unit:
        if Product.is_custom_print: unit = ceil(unit * 1.15)   # integer cents, round up per unit
        line.unit_price_cents = unit
        line_ext = unit * line.qty
        # Pallet incentive: applied on the break/surcharge-resolved unit price.
        pallets = floor(line.qty / Product.pallet_qty)
        line_pallet_discount = pallets * floor(unit * 0.03)    # per-pallet rebate, floor per pallet
      Order.subtotal_cents = sum(line_ext)
      Order.pallet_discount_cents = sum(line_pallet_discount)
      Order.grand_total_cents = subtotal - pallet_discount + oversize_surcharge + freight_estimate
      Rounding: all per-unit and per-pallet rounding happens BEFORE summation;
      grand total is exact integer addition (no second rounding pass).
    input_set: "OrderLines of the order with status != CANCELLED; QuantityBreak rows for each product; Product constants (pallet_qty, base_price_cents, is_custom_print)"
    constants:
      CUSTOM_PRINT_SURCHARGE_PCT: 0.15
      PALLET_REBATE_PCT: 0.03
    precision: "integer cents; ceil for surcharge, floor for pallet rebate; per-line before sum"
    variants:
      - name: all_units_break
        when: "default"
        difference: "Selected break price applies to every unit on the line (flat per-unit), not marginally per tier slice."

  - name: calc_freight_and_oversize
    trigger: "Order submit (provisional) and order ship / custom receive completion (final)"
    algorithm: threshold
    formula: |
      Freight class per line from Product.density_pcf — the LOWEST class whose
      lower density bound is strictly less than the density:
        density > 50          -> class 50
        35 < density <= 50    -> class 55
        30 < density <= 35    -> class 60
        22.5 < density <= 30  -> class 65
        18 < density <= 22.5  -> class 70
        15 < density <= 18    -> class 77.5
        13.5 < density <= 15  -> class 85
        12 < density <= 13.5  -> class 92.5
        10.5 < density <= 12  -> class 100
        9 < density <= 10.5   -> class 110
        8 < density <= 9      -> class 125
        7 < density <= 8      -> class 150
        6 < density <= 7      -> class 175
        5 < density <= 6      -> class 200
        4 < density <= 5      -> class 250
        3 < density <= 4      -> class 300
        2 < density <= 3      -> class 400
        1 <= density <= 2     -> class 500
        density < 1           -> reject line (ERR_INVALID_REQUEST)
      Boundary rule (pinned): every interval is (lower, upper] — a density
      exactly equal to a table bound belongs to the interval whose UPPER bound
      it is. Worked pins: density == 15.0 -> class 85 (interval 13.5 < d <= 15);
      density == 15.0001 -> class 77.5; density == 50.0 -> class 55;
      density == 8.0 -> class 150; density == 1.0 -> class 500.
      Surcharge (mode a — tiered threshold on distance):
        oversize lines exist and ship_method == FREIGHT:
          zone_distance = abs(Order.ship_zone - Warehouse.zone of majority ship-from)
          base_surcharge = 8900 cents
          if zone_distance >= 4: base_surcharge += 2500 cents
          if any line weight (qty * weight_lbs_per_unit) > 150: base_surcharge += 5000 cents
        else 0
      Freight estimate (variant-selected):
        weight_lbs = sum over shipped/eligible lines of qty * Product.weight_lbs_per_unit
        provisional: freight_estimate_cents = ceil(weight_lbs * rate_per_lb(class_max) * zone_factor * 1.10)
        final:       freight_estimate_cents = ceil(weight_lbs * rate_per_lb(class_max) * zone_factor)
        where class_max = numerically highest freight_class among lines,
        rate_per_lb(50)=0.90, (55)=1.05, (60..92.5)=1.20, (100..125)=1.45,
        (150..200)=1.75, (250+)=2.10 (dollars, converted to cents),
        zone_factor = 1 + 0.12 * (zone_distance - 1) with zone_distance >= 1.
      The 1.10 uplift makes provisional strictly >= final for identical inputs.
    input_set: "Provisional: all non-CANCELLED lines at submit. Final: lines with status SHIPPED at ship time (custom lines use actual_qty)."
    constants:
      OVERSIZE_BASE_CENTS: 8900
      OVERSIZE_ZONE_STEP_CENTS: 2500
      OVERSIZE_ZONE_STEP_DISTANCE: 4
      HEAVY_LINE_THRESHOLD_LBS: 150
      HEAVY_LINE_CENTS: 5000
      PROVISIONAL_UPLIFT: 1.10
    precision: "integer cents. Compute with exact decimal/rational arithmetic: rate_per_lb as cents (120 = $1.20), zone_factor as the exact ratio (100 + 12*(zone_distance-1))/100, uplift 11/10; ceil is applied ONCE to the exact final product — no intermediate float rounding. Per-line class lookup is exact table membership."
    variants:
      - name: provisional
        when: "at submit / before ship"
        difference: "Applies PROVISIONAL_UPLIFT 1.10 and includes all non-CANCELLED lines."
      - name: final
        when: "at ship (and after custom receive)"
        difference: "No uplift; input set restricted to actually-shipped lines with shipped quantities."

  - name: calc_same_day_cutoff
    trigger: "Order submit, after allocation pass selects warehouses"
    algorithm: forward_looking
    formula: |
      Warehouse sourcing selector (deterministic):
        candidate set per line = Warehouses w with w.status == ACTIVE,
          (line.requested_warehouse_code == null OR w.code == requested_warehouse_code),
          (Product.oversize == false OR w.oversize_capable == true),
          and for NON-custom lines only: Inventory(product, w) exists.
          (Custom-print lines are made to order: no Inventory row is required.)
        ranking (non-custom lines) = (available_qty >= qty ? 0 : 1) ASC,  # full cover first
                  abs(Order.ship_zone - w.zone) ASC,               # nearest zone
                  (w.code == Account.default_warehouse_code ? 0 : 1) ASC,
                  w.code ASC.                                      # final tie-break: code, never id
        ranking (custom lines) = abs(Order.ship_zone - w.zone) ASC,
                  (w.code == Account.default_warehouse_code ? 0 : 1) ASC,
                  w.code ASC.
        selected = first row; empty candidate set -> ERR_NO_WAREHOUSE_CAPABLE.
      Same-day promise: let ship_time_utc = current logical clock,
        local_submit = ship_time_utc rendered in selected warehouse's timezone.
        If local_submit's HH:MM < selected.ship_cutoff_time:
          promised_ship_date = calendar date of local_submit (same day)
        else:
          promised_ship_date = next business day after local_submit.
      For multi-warehouse orders the promise is the LATEST of the per-warehouse
      promises. Custom-print lines override: promised_ship_date =
      calc_custom_lead_time result when later than the stock promise.
    input_set: "Order lines at submit; Warehouses; Inventory rows; Account.default_warehouse_code"
    constants:
      ZONE_BASELINE: 1
    precision: "date granularity; business-day skip = Saturday/Sunday"
    variants: []

  - name: calc_custom_lead_time
    trigger: "Order submit when any line is custom-print; re-evaluated if a job scraps and re-queues"
    algorithm: forward_looking
    formula: |
      For each custom line: ready_date = business_days_after(submit_date, Product.lead_time_days)
      (business_days_after skips Saturdays and Sundays; submit day counts as day 0).
      Order-level promise = max over lines of ready_date.
      On scrap + re-queue: ready_date recomputed from the scrap date (reset baseline).
    input_set: "Custom-print OrderLines of the order; Product.lead_time_days; submit/scrap date from logical clock"
    constants: {}
    precision: "date granularity"
    variants: []

  - name: calc_open_receivable
    trigger: "Order submit, ship, cancel, return-restock, invoice payment, PO approve"
    algorithm: aggregation
    formula: |
      Account.open_receivable_cents = sum of grand_total_cents over Orders with
        account_id == Account.id AND invoice_status == OPEN
        AND status IN {STOCK_RESERVED, PARTIALLY_BACKORDERED, CUSTOM_PRODUCTION, SHIPPED}
      (DRAFT, PENDING, and PO_REVIEW orders are not yet receivables and are
      excluded; CANCELLED orders are VOID so excluded; RETURNED orders are VOID.)
      Recomputed in full on every trigger — no incremental drift.
    input_set: "Orders of the account filtered by invoice_status and status sets above"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: calc_return_restock
    trigger: "Return approve (compute) and receive (finalize)"
    algorithm: aggregation
    formula: |
      mode (b) — nested rounding order pinned:
        per ReturnLine: line_credit = round_half_up(qty_returned * OrderLine.unit_price_cents * (1 - restock_pct))
          where restock_pct = 0.15 if Return.return_type == CUSTOM else 0.00
        Return.refund_cents = sum(line_credit)        # sum AFTER per-line rounding
        Return.restock_fee_cents = sum over lines of round_half_up(qty * unit_price * restock_pct)
      Per-line-then-sum and sum-then-round differ by design; the pinned order is
      per-line round_half_up THEN sum.
    input_set: "ReturnLines of the return; their OrderLine.unit_price_cents"
    constants:
      CUSTOM_RESTOCK_PCT: 0.15
    precision: "integer cents, round_half_up per line before summation"
    variants: []

  - name: calc_credit_check
    trigger: "PO approve"
    algorithm: threshold
    formula: |
      prospective = Account.open_receivable_cents + Order.grand_total_cents
      approve allowed iff prospective <= Account.credit_limit_cents   # boundary: AT the limit passes
    input_set: "Account.open_receivable_cents (calc_open_receivable), Order.grand_total_cents, Account.credit_limit_cents"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted on this endpoint per §1.5 roles and §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path and body referenced resources exist (account, product, warehouse, order, line, job, return), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition exists per §1.2 (includes terminal-state lockdown); for POST /packaging-distribution/returns the referenced Order must have status == SHIPPED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints and POST /packaging-distribution/returns"
  - priority: 5
    category: state
    check: "Account.status == ACTIVE for order submit and PO approve"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: ["POST /packaging-distribution/orders/{id}/submit", "POST /packaging-distribution/orders/{id}/approve"]
  - priority: 6
    category: state
    check: "Order contains at least one OPEN line at submit"
    error_id: ERR_ORDER_EMPTY
    http_status: 422
    applies_to: ["POST /packaging-distribution/orders/{id}/submit"]
  - priority: 7
    category: business_constraint
    check: "CORPORATE account with po_required == true must have po_number set on the order at submit time"
    error_id: ERR_PO_REQUIRED
    http_status: 422
    applies_to: ["POST /packaging-distribution/orders/{id}/submit"]
  - priority: 8
    category: business_constraint
    check: "po_number must be unique among the account's non-DRAFT orders (checked at submit)"
    error_id: ERR_DUPLICATE_PO
    http_status: 409
    applies_to: ["POST /packaging-distribution/orders/{id}/submit"]
  - priority: 9
    category: business_constraint
    check: "Line qty multiple of Product.case_qty when Product.uom == CASE; qty >= 1"
    error_id: ERR_CASE_QTY_MISMATCH
    http_status: 422
    applies_to: ["POST /packaging-distribution/orders/{id}/lines", "PUT /packaging-distribution/orders/{id}/lines/{lineId}"]
  - priority: 10
    category: business_constraint
    check: "Custom-print line must supply print_artwork_ref and over_under_tolerance_pct within 0..20 inclusive"
    error_id: ERR_ARTWORK_REQUIRED
    http_status: 422
    applies_to: ["POST /packaging-distribution/orders/{id}/lines"]
  - priority: 11
    category: business_constraint
    check: "Only one ACTIVE RestockNotification per (account_id, product_id)"
    error_id: ERR_DUPLICATE_SUBSCRIPTION
    http_status: 409
    applies_to: ["POST /packaging-distribution/restock-notifications"]
  - priority: 12
    category: business_constraint
    check: "QuantityBreak price-window overlap: no two breaks for the same product with the same min_qty may have overlapping [effective_from, effective_to) windows; adjacency (effective_to == other.effective_from) is allowed"
    error_id: ERR_OVERLAPPING_PRICE_WINDOW
    http_status: 422
    applies_to: ["POST /packaging-distribution/products/{id}/quantity-breaks"]
  - priority: 13
    category: business_constraint
    check: "requested_warehouse_code exists in registry and (for oversize products) is oversize_capable; candidate set non-empty"
    error_id: ERR_NO_WAREHOUSE_CAPABLE
    http_status: 422
    applies_to: ["POST /packaging-distribution/orders/{id}/submit", "POST /packaging-distribution/orders/{id}/approve"]
  - priority: 14
    category: business_constraint
    check: "Uncovered lines on non-backorderable inventory reject the submit"
    error_id: ERR_BACKORDER_NOT_ALLOWED
    http_status: 422
    applies_to: ["POST /packaging-distribution/orders/{id}/submit", "POST /packaging-distribution/orders/{id}/approve"]
  - priority: 15
    category: business_temporal
    check: "Press occupancy: starting a custom-print job must not exceed Warehouse.press_count overlapping [started_at, occupied_until) occupancies at that warehouse; back-to-back adjacency allowed"
    error_id: ERR_PRESS_OCCUPIED
    http_status: 409
    applies_to: ["POST /packaging-distribution/custom-print-jobs/{id}/start"]
  - priority: 16
    category: business_fiscal
    check: "calc_credit_check: open_receivable + grand_total <= credit_limit at PO approve"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /packaging-distribution/orders/{id}/approve"]
  - priority: 17
    category: business_temporal
    check: "Return requested within 30 calendar days before now (now - 30d <= requested_at) at approve"
    error_id: ERR_RETURN_WINDOW_EXPIRED
    http_status: 422
    applies_to: ["POST /packaging-distribution/returns/{id}/approve"]
  - priority: 18
    category: business_referential
    check: "Every ReturnLine.order_line_id must reference an OrderLine whose order_id == the return's order_id"
    error_id: ERR_RETURN_LINE_MISMATCH
    http_status: 422
    applies_to: ["POST /packaging-distribution/returns"]
  - priority: 19
    category: business_referential
    check: "CUSTOM return lines must all reference custom-print order lines (and STOCK returns stock lines)"
    error_id: ERR_CUSTOM_NOT_RETURNABLE
    http_status: 422
    applies_to: ["POST /packaging-distribution/returns", "POST /packaging-distribution/returns/{id}/approve"]
  - priority: 20
    category: business_safety
    check: "Custom-print cancel blocked once any job left QUEUED"
    error_id: ERR_CUSTOM_PRODUCTION_STARTED
    http_status: 409
    applies_to: ["POST /packaging-distribution/orders/{id}/cancel"]
  - priority: 21
    category: business_referential
    check: "ReturnLine qty <= OrderLine.shipped_qty - sum(qty over prior non-REJECTED return lines for that order line)"
    error_id: ERR_RETURN_QTY_EXCEEDED
    http_status: 422
    applies_to: ["POST /packaging-distribution/returns"]
  - priority: 22
    category: business_constraint
    check: "Payload field types, required fields present, enum membership, numeric ranges (incl. density >= 1 for freight table)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/packaging-distribution/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock. Startup default is 2026-08-01T00:00:00Z and the clock NEVER falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advanced; no entity mutation"]

  - method: POST
    path: "/packaging-distribution/accounts"
    description: "Create a corporate or retail account."
    roles: [PlatformAdmin]
    code: 201
    input: [company_name, account_type, credit_limit_cents, default_warehouse_code, "po_required?"]
    output: Account
    side_effects: []
  - method: GET
    path: "/packaging-distribution/accounts"
    description: "List accounts with pagination; optional filters."
    roles: [PlatformAdmin, CustomerService]
    code: 200
    input: ["status?", "account_type?", "limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: GET
    path: "/packaging-distribution/accounts/{id}"
    description: "Fetch one account including computed open_receivable_cents."
    roles: [PlatformAdmin, CustomerService, AccountApprover, Buyer]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: PATCH
    path: "/packaging-distribution/accounts/{id}"
    description: "Update mutable account fields (credit_limit_cents, po_required, default_warehouse_code)."
    roles: [PlatformAdmin]
    code: 200
    input: ["credit_limit_cents?", "po_required?", "default_warehouse_code?"]
    output: Account
    side_effects: ["Account.version increments by 1"]
  - method: POST
    path: "/packaging-distribution/accounts/{id}/suspend"
    description: "Suspend an ACTIVE account."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["Account.status -> SUSPENDED", "Account.version increments by 1"]
  - method: POST
    path: "/packaging-distribution/accounts/{id}/reactivate"
    description: "Reactivate a SUSPENDED account."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["Account.status -> ACTIVE", "Account.version increments by 1"]

  - method: POST
    path: "/packaging-distribution/products"
    description: "Create a catalog product; ship_method computed from oversize."
    roles: [CatalogManager]
    code: 201
    input: [sku, name, category, base_price_cents, uom, case_qty, pallet_qty, weight_lbs_per_unit, density_pcf, "oversize?", "is_custom_print?", "lead_time_days?"]
    output: Product
    side_effects: ["ship_method computed (PARCEL | FREIGHT)"]
  - method: GET
    path: "/packaging-distribution/products"
    description: "List products with pagination and filters."
    roles: [PlatformAdmin, CatalogManager, CustomerService, Buyer, AccountApprover, WarehouseOps]
    code: 200
    input: ["category?", "status?", "is_custom_print?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: "/packaging-distribution/products/{id}"
    description: "Fetch one product."
    roles: [PlatformAdmin, CatalogManager, CustomerService, Buyer, AccountApprover, WarehouseOps]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: PUT
    path: "/packaging-distribution/products/{id}"
    description: "Full catalog update under OCC: reprices future orders; guarded by concurrency rule product-update-stale-version."
    roles: [CatalogManager]
    code: 200
    input: [expected_product_version, "name?", "base_price_cents?", "case_qty?", "pallet_qty?", "weight_lbs_per_unit?", "density_pcf?", "oversize?", "lead_time_days?"]
    output: Product
    side_effects: ["ship_method recomputed if oversize changed", "increments Product.version by 1"]
  - method: POST
    path: "/packaging-distribution/products/{id}/discontinue"
    description: "Discontinue an ACTIVE product with no open pipeline lines."
    roles: [CatalogManager]
    code: 200
    input: []
    output: Product
    side_effects: ["Product.status -> DISCONTINUED", "Product.version increments by 1"]

  - method: POST
    path: "/packaging-distribution/products/{id}/quantity-breaks"
    description: "Add a quantity break with a half-open effective price window; overlapping windows for the same product+min_qty are rejected, adjacency allowed."
    roles: [CatalogManager]
    code: 201
    input: [min_qty, unit_price_cents, sort_seq, effective_from, "effective_to?"]
    output: QuantityBreak
    side_effects: []
  - method: GET
    path: "/packaging-distribution/products/{id}/quantity-breaks"
    description: "List a product's quantity breaks ordered by min_qty ASC."
    roles: [PlatformAdmin, CatalogManager, CustomerService, Buyer, AccountApprover]
    code: 200
    input: []
    output: QuantityBreak[]
    side_effects: []
  - method: DELETE
    path: "/packaging-distribution/quantity-breaks/{id}"
    description: "Remove a quantity break."
    roles: [CatalogManager]
    code: 204
    input: []
    output: null
    side_effects: []

  - method: POST
    path: "/packaging-distribution/warehouses"
    description: "Register a warehouse."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, zone, ship_cutoff_time, timezone, "oversize_capable?", "press_count?"]
    output: Warehouse
    side_effects: []
  - method: GET
    path: "/packaging-distribution/warehouses"
    description: "List warehouses."
    roles: [PlatformAdmin, CatalogManager, CustomerService, WarehouseOps, Buyer, AccountApprover]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Warehouse[]
    side_effects: []
  - method: GET
    path: "/packaging-distribution/warehouses/{id}"
    description: "Fetch one warehouse."
    roles: [PlatformAdmin, CatalogManager, CustomerService, WarehouseOps]
    code: 200
    input: []
    output: Warehouse
    side_effects: []
  - method: POST
    path: "/packaging-distribution/warehouses/{id}/deactivate"
    description: "Deactivate a warehouse (excluded from future sourcing)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Warehouse
    side_effects: ["Warehouse.status -> INACTIVE", "Warehouse.version increments by 1"]
  - method: POST
    path: "/packaging-distribution/warehouses/{id}/activate"
    description: "Reactivate a warehouse."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Warehouse
    side_effects: ["Warehouse.status -> ACTIVE", "Warehouse.version increments by 1"]

  - method: POST
    path: "/packaging-distribution/inventory"
    description: "Create an Inventory row for a (product, warehouse) pair."
    roles: [WarehouseOps, PlatformAdmin]
    code: 201
    input: [product_id, warehouse_id, on_hand_qty, "backorderable?", "reorder_point_qty?"]
    output: Inventory
    side_effects: ["reserved_qty initialized 0"]
  - method: GET
    path: "/packaging-distribution/inventory"
    description: "Filtered inventory list (both FK filters supported)."
    roles: [PlatformAdmin, WarehouseOps, CustomerService]
    code: 200
    input: ["product_id?", "warehouse_id?", "limit?", "offset?"]
    output: Inventory[]
    side_effects: []
  - method: GET
    path: "/packaging-distribution/inventory/{id}"
    description: "Fetch one inventory row with computed available_qty."
    roles: [PlatformAdmin, WarehouseOps, CustomerService]
    code: 200
    input: []
    output: Inventory
    side_effects: []
  - method: POST
    path: "/packaging-distribution/inventory/{id}/receive"
    description: "Receive stock: on_hand_qty += qty; fires restock notifications on threshold crossing."
    roles: [WarehouseOps]
    code: 200
    input: [qty]
    output: Inventory
    side_effects: ["on_hand_qty += qty", "available_qty recomputed", "ACTIVE RestockNotifications for the product fire when available_qty crosses to >= reorder_point_qty", "increments Inventory.version by 1"]
  - method: POST
    path: "/packaging-distribution/inventory/{id}/adjust"
    description: "Cycle-count adjustment under OCC (concurrency rule inventory-adjust-stale-version)."
    roles: [WarehouseOps]
    code: 200
    input: [expected_inventory_version, delta_qty, "reason?"]
    output: Inventory
    side_effects: ["on_hand_qty += delta_qty (may be negative; result must stay >= reserved_qty)", "notification crossing check runs", "increments Inventory.version by 1"]

  - method: POST
    path: "/packaging-distribution/orders"
    description: "Create a DRAFT order for an account."
    roles: [Buyer]
    code: 201
    input: [account_id, ship_zone, "po_number?"]
    output: Order
    side_effects: ["totals initialized to 0; invoice_status OPEN"]
  - method: GET
    path: "/packaging-distribution/orders"
    description: "List orders; filterable by account_id and status."
    roles: [PlatformAdmin, CustomerService, WarehouseOps, Buyer, AccountApprover]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/packaging-distribution/orders/{id}"
    description: "Fetch one order with computed totals."
    roles: [PlatformAdmin, CustomerService, WarehouseOps, Buyer, AccountApprover]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: POST
    path: "/packaging-distribution/orders/{id}/lines"
    description: "Add a line to a DRAFT order."
    roles: [Buyer]
    code: 201
    input: [product_id, qty, "requested_warehouse_code?", "print_artwork_ref?", "over_under_tolerance_pct?"]
    output: OrderLine
    side_effects: ["calc_order_pricing recomputes DRAFT totals (derived totals refresh does NOT increment Order.version; only lifecycle transitions do)"]
  - method: GET
    path: "/packaging-distribution/orders/{id}/lines"
    description: "List an order's lines."
    roles: [PlatformAdmin, CustomerService, WarehouseOps, Buyer, AccountApprover]
    code: 200
    input: []
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/packaging-distribution/order-lines"
    description: "Flat filtered list of order lines across orders (FK reverse-reachability for product_id, allocated_warehouse_id)."
    roles: [PlatformAdmin, CustomerService, WarehouseOps, Buyer, AccountApprover]
    code: 200
    input: ["order_id?", "product_id?", "allocated_warehouse_id?", "status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/packaging-distribution/order-lines/{id}"
    description: "Fetch one order line."
    roles: [PlatformAdmin, CustomerService, WarehouseOps, Buyer, AccountApprover]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: PUT
    path: "/packaging-distribution/orders/{id}/lines/{lineId}"
    description: "Update qty / artwork on a DRAFT order line."
    roles: [Buyer]
    code: 200
    input: ["qty?", "requested_warehouse_code?", "print_artwork_ref?", "over_under_tolerance_pct?"]
    output: OrderLine
    side_effects: ["calc_order_pricing recomputes DRAFT totals (no Order.version increment)"]
  - method: POST
    path: "/packaging-distribution/orders/{id}/submit"
    description: "Submit a DRAFT order: pricing, allocation pass, freight provisional, promise date."
    roles: [Buyer]
    code: 200
    input: []
    output: Order
    side_effects: ["DRAFT -> PENDING -> {STOCK_RESERVED | PARTIALLY_BACKORDERED | CUSTOM_PRODUCTION | PO_REVIEW}", "reservations, custom jobs, calc_order_pricing, calc_freight_and_oversize (provisional), calc_same_day_cutoff, calc_open_receivable", "increments Order.version by 1"]
  - method: POST
    path: "/packaging-distribution/orders/{id}/approve"
    description: "Approve a PO_REVIEW order (segregated from the submitting Buyer)."
    roles: [AccountApprover]
    code: 200
    input: []
    output: Order
    side_effects: ["PO_REVIEW -> PENDING + allocation pass", "calc_credit_check gate", "increments Order.version by 1"]
  - method: POST
    path: "/packaging-distribution/orders/{id}/reject"
    description: "Reject a PO_REVIEW order back to DRAFT."
    roles: [AccountApprover]
    code: 200
    input: ["reason?"]
    output: Order
    side_effects: ["PO_REVIEW -> DRAFT", "increments Order.version by 1"]
  - method: POST
    path: "/packaging-distribution/orders/{id}/ship"
    description: "Ship allocated lines; decrement stock; final freight; fire notifications."
    roles: [WarehouseOps]
    code: 200
    input: []
    output: Order
    side_effects: ["-> SHIPPED", "Inventory decrements", "restock notification crossing check", "calc_freight_and_oversize (final)", "calc_open_receivable", "increments Order.version by 1"]
  - method: POST
    path: "/packaging-distribution/orders/{id}/cancel"
    description: "Cancel a pre-ship order; release reservations; void invoice."
    roles: [Buyer]
    code: 200
    input: ["reason?"]
    output: Order
    side_effects: ["-> CANCELLED", "reservations released", "QUEUED jobs SCRAPPED", "invoice_status VOID", "calc_open_receivable", "increments Order.version by 1"]

  - method: POST
    path: "/packaging-distribution/orders/{id}/invoice/pay"
    description: "Mark a SHIPPED order's invoice PAID."
    roles: [AccountApprover, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["invoice_status -> PAID", "calc_open_receivable", "increments Order.version by 1"]

  - method: GET
    path: "/packaging-distribution/custom-print-jobs"
    description: "Filtered list of custom print jobs (by order_line_id, warehouse_id, status)."
    roles: [PlatformAdmin, WarehouseOps, CustomerService]
    code: 200
    input: ["order_line_id?", "warehouse_id?", "status?", "limit?", "offset?"]
    output: CustomPrintJob[]
    side_effects: []
  - method: GET
    path: "/packaging-distribution/custom-print-jobs/{id}"
    description: "Fetch one job."
    roles: [PlatformAdmin, WarehouseOps, CustomerService]
    code: 200
    input: []
    output: CustomPrintJob
    side_effects: []
  - method: POST
    path: "/packaging-distribution/custom-print-jobs/{id}/start"
    description: "QUEUED -> PLATING; enforces per-warehouse press occupancy (ERR_PRESS_OCCUPIED)."
    roles: [WarehouseOps]
    code: 200
    input: []
    output: CustomPrintJob
    side_effects: ["started_at set from logical clock", "occupied_until computed (business_days_after(started_at, lead_time_days))", "increments CustomPrintJob.version by 1"]
  - method: POST
    path: "/packaging-distribution/custom-print-jobs/{id}/advance"
    description: "PLATING -> PRINTING."
    roles: [WarehouseOps]
    code: 200
    input: []
    output: CustomPrintJob
    side_effects: ["increments CustomPrintJob.version by 1"]
  - method: POST
    path: "/packaging-distribution/custom-print-jobs/{id}/receive"
    description: "PRINTING -> COMPLETED (in tolerance) or SCRAPPED + replacement job (out of tolerance)."
    roles: [WarehouseOps]
    code: 200
    input: [actual_qty, "receive_note?"]
    output: CustomPrintJob
    side_effects: ["tolerance band check", "in-tolerance: line ALLOCATED with qty=actual_qty, reservation taken, calc_order_pricing recompute", "out-of-tolerance: job SCRAPPED, replacement job QUEUED, line cycles OPEN -> IN_PRODUCTION", "increments CustomPrintJob.version by 1"]

  - method: POST
    path: "/packaging-distribution/returns"
    description: "Request a return against a SHIPPED order with its lines."
    roles: [Buyer, CustomerService]
    code: 201
    input: [order_id, return_type, reason_code, lines]
    output: Return
    side_effects: ["ReturnLines created", "requested_at set from logical clock"]
  - method: GET
    path: "/packaging-distribution/returns"
    description: "List returns; filterable."
    roles: [PlatformAdmin, CustomerService, WarehouseOps, Buyer]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: Return[]
    side_effects: []
  - method: GET
    path: "/packaging-distribution/returns/{id}"
    description: "Fetch one return."
    roles: [PlatformAdmin, CustomerService, WarehouseOps, Buyer]
    code: 200
    input: []
    output: Return
    side_effects: []
  - method: GET
    path: "/packaging-distribution/returns/{id}/lines"
    description: "List a return's lines."
    roles: [PlatformAdmin, CustomerService, WarehouseOps, Buyer]
    code: 200
    input: []
    output: ReturnLine[]
    side_effects: []
  - method: GET
    path: "/packaging-distribution/return-lines"
    description: "Flat filtered list of return lines (FK reverse-reachability for order_line_id, return_id)."
    roles: [PlatformAdmin, CustomerService, WarehouseOps, Buyer]
    code: 200
    input: ["return_id?", "order_line_id?", "limit?", "offset?"]
    output: ReturnLine[]
    side_effects: []
  - method: GET
    path: "/packaging-distribution/return-lines/{id}"
    description: "Fetch one return line."
    roles: [PlatformAdmin, CustomerService, WarehouseOps, Buyer]
    code: 200
    input: []
    output: ReturnLine
    side_effects: []
  - method: POST
    path: "/packaging-distribution/returns/{id}/approve"
    description: "REQUESTED -> APPROVED; computes restock fee and refund."
    roles: [CustomerService]
    code: 200
    input: []
    output: Return
    side_effects: ["calc_return_restock", "window + custom-eligibility gates"]
  - method: POST
    path: "/packaging-distribution/returns/{id}/reject"
    description: "REQUESTED -> REJECTED."
    roles: [CustomerService]
    code: 200
    input: ["reason?"]
    output: Return
    side_effects: []
  - method: POST
    path: "/packaging-distribution/returns/{id}/receive"
    description: "APPROVED -> RECEIVED; finalizes refund."
    roles: [WarehouseOps]
    code: 200
    input: []
    output: Return
    side_effects: ["refund_cents finalized"]
  - method: POST
    path: "/packaging-distribution/returns/{id}/restock"
    description: "RECEIVED -> RESTOCKED; STOCK returns add inventory back and may fire notifications; full-order restock returns the order."
    roles: [WarehouseOps]
    code: 200
    input: []
    output: Return
    side_effects: ["Inventory.on_hand_qty += qty for STOCK lines at original allocated warehouse", "notification crossing check", "Order -> RETURNED when fully restocked", "calc_open_receivable"]

  - method: POST
    path: "/packaging-distribution/restock-notifications"
