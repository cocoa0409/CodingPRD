      - name: corner_cure_round_codes_are_reachable_and_bounded
        claim_type: error_triggerable
        grounds:
          - validations[priority=49]
          - validations[priority=50]
          - errors.ERR_CONDITIONS_NOT_ADDRESSED
          - errors.ERR_CURE_LIMIT_EXCEEDED
          - calculations.cure_window
        distinguishing_aspect: "The cure loop is bounded on both sides. A resubmission must cover EVERY open condition index, not merely one of them, so addressed_condition_indexes [0] against open [0, 1] answers 422 ERR_CONDITIONS_NOT_ADDRESSED even though the build itself clears the gate. And once cure_count has reached MAX_CURE_ROUNDS 2, a THIRD conditional verdict answers 409 ERR_CURE_LIMIT_EXCEEDED while a REJECTED verdict on the very same build is still accepted - the limit caps the cycle, it does not freeze the review."
