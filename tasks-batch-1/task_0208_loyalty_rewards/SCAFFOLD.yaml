# =============================================================================
# Retail Loyalty & Rewards Program — Scaffold Seed Tables (§1.0–§1.7)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  Retail Loyalty & Rewards Program: points earn/burn rules, tier qualification/benefits,
  bonus-point promotions, points expiration, reward-catalog redemption, referral bonus,
  birthday reward, partner-points transfer

domain_name: loyalty-rewards
api_prefix: ""    # flat multi-root topology: members/redemptions/transfers/etc. are peer top-level collections

# -----------------------------------------------------------------------------
# Complexity Profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid          # Program tree (config) + flat FK web (Member ledger, partner, catalog)
  state_machine_shape: branching   # Redemption fork-join, Referral revert, PartnerTransfer compensation
  relationship_patterns:
    - one_to_many                  # Program→Tier, Member→PointsLot, Redemption→RedemptionLine
    - cross_aggregate              # Redemption→Member, PartnerTransfer→PartnerAccount + Member
    - self_referential             # Referral: Member refers Member

  role_model: peer_roles           # ProgramAdmin owns config; Member owns own ledger; PartnerOperator owns partner transfers
  consistency_model: immediate

  difficulty_band: expert
  entity_count: 14
  endpoint_count: 58           # ~35 business endpoints + ~23 reverse-reachability/discovery GETs required by §1.5
  error_code_count: 31
  calculation_count: 8
  state_machine_count: 9
  role_count: 4

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---- Configuration root ---------------------------------------------------
  - name: LoyaltyProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: base_earn_rate, type: number, source: input, description: "Points earned per whole dollar of eligible spend (e.g. 1.0)", constraints: "> 0" }
      - { name: point_value_cents, type: number, source: input, description: "Cash value of 1 point in cents, used for partner-transfer floor checks (e.g. 1.0)", constraints: "> 0" }
      - { name: lot_expiration_months, type: integer, source: input, description: "Months after a PointsLot's created_at at which its unspent balance expires", constraints: ">= 1" }
      - { name: qualifying_window_months, type: integer, source: input, description: "Trailing window (months) over which qualifying points are summed for tier evaluation", default: 12, constraints: ">= 1" }
      - { name: birthday_reward_points, type: integer, source: input, description: "Fixed points granted by a birthday reward grant", constraints: ">= 0" }
      - { name: referral_referrer_points, type: integer, source: input, description: "Fixed points granted to the referrer when a referral is COMPLETED", constraints: ">= 0" }
      - { name: referral_referee_points, type: integer, source: input, description: "Fixed points granted to the referee when a referral is COMPLETED", constraints: ">= 0" }
      - { name: referral_min_qualifying_cents, type: integer, source: input, description: "Minimum single-purchase eligible_amount_cents that completes a pending referral", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED", default: DRAFT, constraints: "DRAFT, ACTIVE, CLOSED" }

  # ---- Tier configuration (child of program) --------------------------------
  - name: Tier
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> LoyaltyProgram.id" }
      - { name: code, type: enum, source: input, description: "STANDARD | SILVER | GOLD | PLATINUM", constraints: "unique per program; STANDARD, SILVER, GOLD, PLATINUM" }
      - { name: qualify_threshold, type: integer, source: input, description: "Minimum cumulative qualifying points (over the trailing window) to hold this tier", constraints: ">= 0; STANDARD must be 0" }
      - { name: earn_multiplier, type: number, source: input, description: "Multiplier applied to redeemable earn for members at this tier (STANDARD=1.0)", constraints: ">= 1.0" }
      - { name: transfer_ratio, type: number, source: input, description: "Loyalty-point -> partner-point conversion ratio for members at this tier", constraints: "> 0" }
      - { name: rank, type: integer, source: input, description: "Tier ordering; higher rank = higher tier. STANDARD=0", constraints: ">= 0; unique per program" }

  # ---- Member (ledger owner) ------------------------------------------------
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> LoyaltyProgram.id" }
      - { name: email, type: string, source: input, description: "Member email; unique within program" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: birth_month_day, type: string, source: input, description: "Birthday as MM-DD (used by birthday reward)", constraints: "format MM-DD" }
      - { name: referred_by_member_id, type: string, source: input, description: "FK -> Member.id; the referrer who invited this member, null if organic", default: null }
      - { name: current_tier_code, type: enum, source: computed, description: "Tier.code held now, derived from qualifying_points_window vs Tier.qualify_threshold", constraints: "STANDARD, SILVER, GOLD, PLATINUM" }
      - { name: available_points, type: integer, source: computed, description: "Sum of remaining_points over PointsLot in {ACTIVE} owned by this member (non-expired, non-exhausted)" }
      - { name: projected_points, type: integer, source: computed, description: "available_points minus sum of remaining_points over PointsLot whose expires_at <= clock.now (lots ACTIVE but past expiry, not yet swept)" }
      - { name: qualifying_points_window, type: integer, source: computed, description: "Sum of PointsTransaction.qualifying_points for EARN_PURCHASE rows whose created_at >= clock.now - qualifying_window_months" }
      - { name: lifetime_earned_points, type: integer, source: computed, description: "Sum of PointsTransaction.points_delta over all rows with type in {EARN_PURCHASE, EARN_BONUS, BIRTHDAY, REFERRAL, TRANSFER_IN_REVERSAL} (positive deltas)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "ACTIVE, SUSPENDED" }
      - { name: last_birthday_grant_year, type: integer, source: system, description: "Calendar year of most recent BIRTHDAY grant; null if never", default: null }

  # ---- PointsLot (FIFO earn lot — the ledger backbone) ----------------------
  - name: PointsLot
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owner of this lot" }
      - { name: source_type, type: enum, source: system, description: "EARN_PURCHASE | EARN_BONUS | BIRTHDAY | REFERRAL | TRANSFER_IN_REVERSAL", constraints: "EARN_PURCHASE, EARN_BONUS, BIRTHDAY, REFERRAL, TRANSFER_IN_REVERSAL" }
      - { name: source_id, type: string, source: system, description: "Id of the originating PurchaseEvent/Referral/grant; identity only, never a decision input", default: null }
      - { name: original_points, type: integer, source: system, description: "Points minted into this lot at creation", constraints: "> 0" }
      - { name: remaining_points, type: integer, source: computed, description: "original_points minus cumulative burned/expired; floored at 0", constraints: ">= 0" }
      - { name: expires_at, type: datetime, source: system, description: "created_at + program.lot_expiration_months (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | EXPIRED", default: ACTIVE, constraints: "ACTIVE, EXHAUSTED, EXPIRED" }

  # ---- PointsTransaction (append-only ledger) -------------------------------
  - name: PointsTransaction
    parent: null
    common_fields: false
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: lot_id, type: string, source: system, description: "FK -> PointsLot.id; the lot minted (positive) or drawn from (negative), null for pure aggregate corrections", default: null }
      - { name: type, type: enum, source: system, description: "EARN_PURCHASE | EARN_BONUS | BIRTHDAY | REFERRAL | REDEEM | TRANSFER_OUT | EXPIRE | TRANSFER_IN_REVERSAL", constraints: "EARN_PURCHASE, EARN_BONUS, BIRTHDAY, REFERRAL, REDEEM, TRANSFER_OUT, EXPIRE, TRANSFER_IN_REVERSAL" }
      - { name: points_delta, type: integer, source: system, description: "Signed point change: positive for earns/reversals, negative for redeem/transfer_out/expire" }
      - { name: qualifying_points, type: integer, source: system, description: "Tier-qualifying contribution of this row; nonzero only for EARN_PURCHASE (= floor(eligible_amount_cents/100 * base_earn_rate)), 0 otherwise", default: 0 }
      - { name: ref_redemption_id, type: string, source: system, description: "FK -> Redemption.id; set on REDEEM rows", default: null }
      - { name: ref_transfer_id, type: string, source: system, description: "FK -> PartnerTransfer.id; set on TRANSFER_OUT / TRANSFER_IN_REVERSAL rows", default: null }

  # ---- Promotion (bonus-point config) ---------------------------------------
  - name: Promotion
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> LoyaltyProgram.id" }
      - { name: name, type: string, source: input, description: "Promotion display name" }
      - { name: bonus_multiplier, type: number, source: input, description: "Multiplier stacked on redeemable earn while window is live (e.g. 2.0 for double points)", constraints: ">= 1.0" }
      - { name: starts_at, type: datetime, source: input, description: "Inclusive window start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Exclusive window end (ISO 8601 UTC)", constraints: "ends_at > starts_at" }
      - { name: min_eligible_cents, type: integer, source: input, description: "Minimum purchase eligible_amount_cents for the promo to apply", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | ENDED | CANCELLED", default: SCHEDULED, constraints: "SCHEDULED, ACTIVE, ENDED, CANCELLED" }

  # ---- CatalogReward (redeemable item config) -------------------------------
  - name: CatalogReward
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> LoyaltyProgram.id" }
      - { name: name, type: string, source: input, description: "Reward display name" }
      - { name: point_cost, type: integer, source: input, description: "Base point cost of one unit of this reward", constraints: "> 0" }
      - { name: tier_discount_pct, type: number, source: input, description: "Fractional discount on point_cost granted to GOLD+ members (e.g. 0.125)", default: 0.0, constraints: ">= 0 and < 1" }
      - { name: stock, type: integer, source: input, description: "Units available for redemption; decremented on fulfillment", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED", default: ACTIVE, constraints: "ACTIVE, DISCONTINUED" }

  # ---- Redemption (burn lifecycle, fork-join) -------------------------------
  - name: Redemption
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the burning member" }
      - { name: quoted_cost_points, type: integer, source: computed, description: "Provisional total point cost at request time (sum over lines of per-line rounded cost), reserved against balance" }
      - { name: final_cost_points, type: integer, source: computed, description: "Final point cost recomputed at fulfillment; may differ from quoted_cost_points if tier changed", default: null }
      - { name: status, type: enum, source: system, description: "QUOTED | CONFIRMED | FULFILLED | CANCELLED", default: QUOTED, constraints: "QUOTED, CONFIRMED, FULFILLED, CANCELLED" }
      - { name: expected_member_version, type: integer, source: input, description: "OCC: Member.version the client observed; checked on confirm", default: null }

  # ---- RedemptionLine (line items of a redemption) --------------------------
  - name: RedemptionLine
    parent: Redemption
    common_fields: false
    fields:
      - { name: redemption_id, type: string, source: system, description: "FK -> Redemption.id" }
      - { name: reward_id, type: string, source: input, description: "FK -> CatalogReward.id" }
      - { name: quantity, type: integer, source: input, description: "Units of the reward in this line", constraints: ">= 1" }
      - { name: line_cost_points, type: integer, source: computed, description: "round_half_up(quantity * point_cost * (1 - applicable_discount_pct)) computed per line" }

  # ---- Referral (self-referential lifecycle) --------------------------------
  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> LoyaltyProgram.id" }
      - { name: referrer_member_id, type: string, source: input, description: "FK -> Member.id; the inviting member" }
      - { name: referee_member_id, type: string, source: system, description: "FK -> Member.id; the invited member, set when referee registers", default: null }
      - { name: referee_email, type: string, source: input, description: "Email the invitation was sent to" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED | EXPIRED | REVOKED", default: PENDING, constraints: "PENDING, COMPLETED, EXPIRED, REVOKED" }
      - { name: completed_at, type: datetime, source: system, description: "When the qualifying purchase completed the referral", default: null }

  # ---- PartnerAccount (config; transfer counterparty) -----------------------
  - name: PartnerAccount
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> LoyaltyProgram.id" }
      - { name: name, type: string, source: input, description: "Partner display name (e.g. airline)" }
      - { name: transfer_block_size, type: integer, source: input, description: "Loyalty points must be transferred in whole multiples of this block size", constraints: ">= 1" }
      - { name: min_transfer_points, type: integer, source: input, description: "Minimum loyalty points per single transfer", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED", default: ACTIVE, constraints: "ACTIVE, PAUSED" }

  # ---- TransferBlackout (per-partner maintenance interval; closed interval + buffer) ----
  - name: TransferBlackout
    parent: PartnerAccount
    common_fields: true
    fields:
      - { name: partner_account_id, type: string, source: input, description: "FK -> PartnerAccount.id" }
      - { name: starts_at, type: datetime, source: input, description: "Blackout start (ISO 8601 UTC); transfers blocked when starts_at <= clock.now <= ends_at (CLOSED interval, both ends inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Blackout end (ISO 8601 UTC); inclusive", constraints: "ends_at >= starts_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED", default: SCHEDULED, constraints: "SCHEDULED, CANCELLED" }

  # ---- PartnerTransfer (transfer lifecycle, compensation) -------------------
  - name: PartnerTransfer
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the transferring member" }
      - { name: partner_account_id, type: string, source: input, description: "FK -> PartnerAccount.id" }
      - { name: loyalty_points, type: integer, source: input, description: "Loyalty points the member spends in this transfer", constraints: "> 0; multiple of partner.transfer_block_size" }
      - { name: partner_points, type: integer, source: computed, description: "floor(loyalty_points * Tier.transfer_ratio) using the member's current tier at submit time" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SETTLED | REVERSED", default: SUBMITTED, constraints: "SUBMITTED, SETTLED, REVERSED" }
      - { name: expected_member_version, type: integer, source: input, description: "OCC: Member.version the client observed; checked on submit" }

  # ---- PurchaseEvent (earn trigger; append-only) ----------------------------
  - name: PurchaseEvent
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the purchasing member" }
      - { name: eligible_amount_cents, type: integer, source: input, description: "Eligible spend in cents that earns points", constraints: ">= 0" }
      - { name: occurred_at, type: datetime, source: input, description: "Purchase timestamp (ISO 8601 UTC); defaults to clock.now if omitted", default: null }
      - { name: earned_points, type: integer, source: computed, description: "Redeemable points minted = floor((eligible_amount_cents/100) * base_earn_rate * tier_multiplier * promo_multiplier)" }
      - { name: qualifying_points, type: integer, source: computed, description: "Tier-qualifying points = floor(eligible_amount_cents/100 * base_earn_rate); excludes tier & promo multipliers" }
      - { name: applied_promotion_id, type: string, source: computed, description: "FK -> Promotion.id; the single Promotion whose window/min covered this purchase, null if none; identity only", default: null }
      - { name: posted, type: boolean, source: system, description: "True once points have been minted into a PointsLot (always true on create)", default: false }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- LoyaltyProgram: lifecycle (DRAFT -> ACTIVE -> CLOSED) ----
  - entity: LoyaltyProgram
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "LoyaltyProgram.status == DRAFT"
        side_effects:
          - "Member/earn/redeem/transfer operations become permitted"
      - from: [DRAFT, ACTIVE]
        to: CLOSED
        trigger: "POST /programs/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "LoyaltyProgram.status in {DRAFT, ACTIVE}"
        side_effects:
          - "Member/earn/redeem/transfer operations rejected with ERR_PROGRAM_NOT_ACTIVE"

  # ---- Member: suspension lifecycle (ACTIVE <-> SUSPENDED) ----
  - entity: Member
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /members/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "Member.status == ACTIVE"
        side_effects:
          - "Earn/redeem-confirm/transfer operations for this member are rejected with ERR_MEMBER_NOT_ACTIVE"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{id}/reactivate"
        actor: ProgramAdmin
        preconditions:
          - "Member.status == SUSPENDED"
        side_effects:
          - "Member resumes normal operations"

  # ---- Redemption: branching fork-join (QUOTED -> CONFIRMED -> {FULFILLED, CANCELLED}) ----
  - entity: Redemption
    field: status
    initial_state: QUOTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /redemptions/{id}/confirm"
        actor: Member
        preconditions:
          - "Redemption.status == QUOTED"
          - "Member.status == ACTIVE"
          - "Member.available_points >= quoted_cost_points"
          - "expected_member_version matches Member.version (OCC)"
        side_effects:
          - "Burn quoted_cost_points from member PointsLots in FIFO order (oldest created_at first; tie-break created_at ASC then lot id ASC only to disambiguate identical timestamps)"
          - "For each consumed lot, decrement PointsLot.remaining_points; lot -> EXHAUSTED when remaining_points reaches 0"
          - "Append one REDEEM PointsTransaction per consumed lot (points_delta negative, ref_redemption_id = this redemption)"
          - "Recompute Member.available_points and Member.projected_points"
          - "increments Member.version by 1"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /redemptions/{id}/fulfill"
        actor: ProgramAdmin
        preconditions:
          - "Redemption.status == CONFIRMED"
          - "Every line's CatalogReward.stock >= line.quantity"
          - "Every line's CatalogReward.status == ACTIVE"
        side_effects:
          - "Compute final_cost_points (final variant; recompute per-line discount from member's tier at fulfillment time)"
          - "If final_cost_points < quoted_cost_points, refund the difference by minting a TRANSFER_IN_REVERSAL-style EARN lot (source_type EARN_BONUS) of (quoted_cost_points - final_cost_points) and append an EARN_BONUS PointsTransaction"
          - "If final_cost_points > quoted_cost_points, burn the extra (quoted_cost_points - final_cost_points) shortfall in FIFO order (additional REDEEM rows)"
          - "Decrement each line's CatalogReward.stock by line.quantity; CatalogReward -> stock recomputed"
          - "Recompute Member.available_points and Member.projected_points"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /redemptions/{id}/cancel"
        actor: "Member, ProgramAdmin"
        preconditions:
          - "Redemption.status == QUOTED"
        side_effects:
          - "No points were burned in QUOTED state; nothing to refund"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /redemptions/{id}/cancel"
        actor: "Member, ProgramAdmin"
        preconditions:
          - "Redemption.status == CONFIRMED"
        side_effects:
          - "Compensation: refund quoted_cost_points by minting a single EARN_BONUS PointsLot of quoted_cost_points (compensating action; preserves member point conservation)"
          - "Append a compensating EARN_BONUS PointsTransaction (points_delta positive, ref_redemption_id = this redemption)"
          - "Recompute Member.available_points and Member.projected_points"

  # ---- Referral: branching with revert (PENDING -> {COMPLETED, EXPIRED, REVOKED}) ----
  - entity: Referral
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, EXPIRED, REVOKED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "system (referee PurchaseEvent with eligible_amount_cents >= program.referral_min_qualifying_cents)"
        actor: system
        preconditions:
          - "Referral.status == PENDING"
          - "Referral.referee_member_id is set (referee has registered)"
          - "Referee Member.status == ACTIVE and referrer Member.status == ACTIVE"
        side_effects:
          - "Mint a REFERRAL PointsLot of program.referral_referrer_points to the referrer; append REFERRAL PointsTransaction"
          - "Mint a REFERRAL PointsLot of program.referral_referee_points to the referee; append REFERRAL PointsTransaction"
          - "Set Referral.completed_at = clock.now"
          - "Recompute available_points/projected_points for both members"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /_clock/advance then POST /programs/{id}/sweep-expirations (referral older than program.lot_expiration_months and still pending)"
        actor: system
        preconditions:
          - "Referral.status == PENDING"
          - "clock.now >= Referral.created_at + program.lot_expiration_months"
        side_effects:
          - "No points were granted; no ledger change"
      - from: PENDING
        to: REVOKED
        trigger: "POST /referrals/{id}/revoke"
        actor: ProgramAdmin
        preconditions:
          - "Referral.status == PENDING"
        side_effects:
          - "No points were granted; no ledger change"

  # ---- PartnerTransfer: compensation (SUBMITTED -> {SETTLED, REVERSED}) ----
  - entity: PartnerTransfer
    field: status
    initial_state: SUBMITTED
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: SETTLED
        trigger: "POST /partner-transfers/{id}/settle"
        actor: PartnerOperator
        preconditions:
          - "PartnerTransfer.status == SUBMITTED"
          - "PartnerAccount.status == ACTIVE"
        side_effects:
          - "Transfer is final; partner credits partner_points externally"
      - from: SUBMITTED
        to: REVERSED
        trigger: "POST /partner-transfers/{id}/reverse"
        actor: "PartnerOperator, ProgramAdmin"
        preconditions:
          - "PartnerTransfer.status == SUBMITTED"
        side_effects:
          - "Compensation: mint a TRANSFER_IN_REVERSAL PointsLot of loyalty_points back to the member; append TRANSFER_IN_REVERSAL PointsTransaction (ref_transfer_id = this transfer)"
          - "Recompute Member.available_points and Member.projected_points"
          - "Conservation: member's total minted-minus-burned loyalty points returns to its pre-transfer value"

  # ---- Promotion: window lifecycle (SCHEDULED -> ACTIVE -> ENDED; SCHEDULED/ACTIVE -> CANCELLED) ----
  - entity: Promotion
    field: status
    initial_state: SCHEDULED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /_clock/advance then POST /programs/{id}/refresh-promotions (clock.now in [starts_at, ends_at))"
        actor: system
        preconditions:
          - "Promotion.status == SCHEDULED"
          - "clock.now >= starts_at and clock.now < ends_at"
        side_effects:
          - "Promotion becomes selectable for earn during purchases"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /programs/{id}/refresh-promotions (clock.now >= ends_at)"
        actor: system
        preconditions:
          - "Promotion.status == ACTIVE"
          - "clock.now >= ends_at"
        side_effects:
          - "Promotion no longer applies to new purchases"
      - from: [SCHEDULED, ACTIVE]
        to: CANCELLED
        trigger: "POST /promotions/{id}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "Promotion.status in {SCHEDULED, ACTIVE}"
        side_effects:
          - "Promotion no longer applies; already-earned points unaffected"

  # ---- PartnerAccount: pause/resume (ACTIVE <-> PAUSED) ----
  - entity: PartnerAccount
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /partners/{id}/pause"
        actor: ProgramAdmin
        preconditions:
          - "PartnerAccount.status == ACTIVE"
        side_effects:
          - "New PartnerTransfers against this partner are rejected with ERR_PARTNER_PAUSED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /partners/{id}/resume"
        actor: ProgramAdmin
        preconditions:
          - "PartnerAccount.status == PAUSED"
        side_effects:
          - "Transfers permitted again"

  # ---- PointsLot: expiration lifecycle (ACTIVE -> {EXHAUSTED, EXPIRED}) ----
  - entity: PointsLot
    field: status
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (remaining_points reaches 0 during a burn)"
        actor: system
        preconditions:
          - "PointsLot.status == ACTIVE"
          - "remaining_points == 0 after the burn"
        side_effects:
          - "Lot no longer contributes to Member.available_points"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /programs/{id}/sweep-expirations (clock.now >= expires_at)"
        actor: system
        preconditions:
          - "PointsLot.status == ACTIVE"
          - "clock.now >= expires_at"
          - "remaining_points > 0"
        side_effects:
          - "Append EXPIRE PointsTransaction with points_delta = -remaining_points"
          - "Set remaining_points = 0"
          - "Recompute Member.available_points and Member.projected_points"

  # ---- TransferBlackout: minimal lifecycle (SCHEDULED -> CANCELLED) ----
  - entity: TransferBlackout
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /blackouts/{id}/cancel"
        actor: "ProgramAdmin, PartnerOperator"
        preconditions:
          - "TransferBlackout.status == SCHEDULED"
        side_effects:
          - "Interval no longer blocks transfers (excluded from future overlap checks)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: redemption-confirm-stale-member
    parent_entity: Member
    write_endpoint: "POST /redemptions/{id}/confirm"
    occ_field: "expected_member_version"
    description: |
      Confirming a Redemption against a Member whose version has advanced since
      the client last observed it is rejected. This captures the case where the
      member's balance was already drawn down by another posted burn or transfer
      (each of which legitimately advances Member.version), so the client's view
      of available_points used to size this redemption is stale.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
  - rule_id: partner-transfer-submit-stale-member
    parent_entity: Member
    write_endpoint: "POST /partner-transfers"
    occ_field: "expected_member_version"
    description: |
      Submitting a PartnerTransfer against a Member whose version has advanced
      since the client last observed it is rejected. The transfer's partner_points
      depend on the member's current tier and the burn depends on available_points;
      a version advance means another posted ledger mutation has occurred and the
      client's basis is stale.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- Earn (combinatorial mode a: 4 inputs, nested multipliers + single floor) ----
  - name: purchase_earn_points
    trigger: "POST /purchase-events (EARN_PURCHASE) — also referenced by PurchaseEvent.earned_points side-effect"
    algorithm: tiered_pricing
    formula: |
      tier_multiplier = Tier.earn_multiplier for member.current_tier_code (resolved BEFORE earn)
      promo_multiplier = selected_promotion.bonus_multiplier if a promotion applies else 1.0
      raw = (eligible_amount_cents / 100.0) * program.base_earn_rate * tier_multiplier * promo_multiplier
      earned_points = floor(raw)            # single floor applied once, AFTER all multipliers
    input_set: "Single PurchaseEvent; tier_multiplier from member.current_tier_code at occurred_at; promo from §promotion_selection"
    constants: {}
    precision: "integer floor after full real-valued product; never round intermediate multipliers"
    variants: []

  # ---- Qualifying-points contribution (boundary-precision metric; distinct from redeemable earn) ----
  - name: qualifying_points_contribution
    trigger: "POST /purchase-events — sets PurchaseEvent.qualifying_points and the EARN_PURCHASE row's qualifying_points"
    algorithm: threshold
    formula: |
      qualifying_points = floor(eligible_amount_cents / 100.0 * program.base_earn_rate)
      # EXCLUDES tier and promo multipliers — qualifying is measured on base spend only
    input_set: "Single PurchaseEvent"
    constants: {}
    precision: "integer floor"
    variants: []

  # ---- Tier evaluation (threshold, boundary >=) ----
  - name: tier_evaluation
    trigger: "Recomputed on every PurchaseEvent post and on sweep-expirations; sets Member.current_tier_code"
    algorithm: threshold
    formula: |
      window_start = clock.now - program.qualifying_window_months
      qualifying_points_window = sum(PointsTransaction.qualifying_points
                                     where type == EARN_PURCHASE and created_at >= window_start)
      current_tier = the Tier with the HIGHEST rank whose qualify_threshold <= qualifying_points_window
      # comparison is >= (a member with exactly qualify_threshold qualifies for that tier)
    input_set: "EARN_PURCHASE PointsTransactions in trailing window; Tier rows for program ordered by rank"
    constants: {}
    precision: "integer; tie-break by Tier.rank DESC (ranks unique per program)"
    variants: []

  # ---- Member available vs projected balance (DUAL VARIANT #1 — Member domain) ----
  - name: member_balance
    trigger: "Recomputed after any ledger mutation; read on GET /members/{id}"
    algorithm: aggregation
    formula: |
      available_points = sum(PointsLot.remaining_points where status == ACTIVE)
      projected_points = available_points
                         - sum(PointsLot.remaining_points where status == ACTIVE and expires_at <= clock.now)
    input_set: "ACTIVE PointsLots owned by member"
    constants: {}
    precision: "integer"
    variants:
      - name: available
        when: "Used to gate burns (redeem confirm, partner transfer) — counts every ACTIVE lot regardless of expiry clock position"
        difference: "Includes lots whose expires_at <= clock.now that have not yet been swept"
      - name: projected
        when: "Shown to members as spendable-after-sweep balance"
        difference: "Excludes ACTIVE lots already past expires_at; differs from available whenever an unswept-but-expired lot exists"

  # ---- Redemption quoted vs final cost (DUAL VARIANT #2 — Redemption domain) ----
  - name: redemption_cost
    trigger: "quoted on POST /redemptions; final on POST /redemptions/{id}/fulfill"
    algorithm: aggregation
    formula: |
      per_line(line, tier) =
        applicable_discount = reward.tier_discount_pct if tier.rank >= GOLD.rank else 0.0
        round_half_up(line.quantity * reward.point_cost * (1 - applicable_discount))   # ROUND PER LINE
      total(tier) = sum over lines of per_line(line, tier)                              # THEN SUM
    input_set: "RedemptionLines of the redemption; member tier resolved at the variant's evaluation time"
    constants:
      GOLD_RANK: 2
    precision: "round_half_up PER LINE, then integer sum (round-then-sum order is pinned)"
    variants:
      - name: quoted
        when: "At POST /redemptions — uses member.current_tier_code at request time"
        difference: "Reserved against balance; basis = tier at request"
      - name: final
        when: "At fulfill — re-resolves member.current_tier_code at fulfillment"
        difference: "If member crossed the GOLD boundary between quote and fulfill, the discount toggles and final_cost_points != quoted_cost_points; delta refunded or burned"

  # ---- Multi-line redemption rounding (combinatorial mode b: per-line round vs sum-then-round) ----
  - name: redemption_line_rounding
    trigger: "Per RedemptionLine during redemption_cost"
    algorithm: aggregation
    formula: |
      # MODE (b): rounding order is load-bearing.
      # PINNED: round_half_up EACH line's (quantity*point_cost*(1-discount)), THEN sum the rounded integers.
      # The alternative (sum raw then round once) is explicitly NOT used and can differ by 1 point.
      line_cost_points = round_half_up(quantity * point_cost * (1 - applicable_discount_pct))
    input_set: "One RedemptionLine"
    constants: {}
    precision: "round_half_up per line; do NOT sum-then-round"
    variants: []

  # ---- Partner transfer conversion (combinatorial mode c: circular-looking, evaluation order pinned) ----
  - name: partner_transfer_conversion
    trigger: "POST /partner-transfers — sets PartnerTransfer.partner_points"
    algorithm: tiered_pricing
    formula: |
      # MODE (c): partner_points depends on transfer_ratio, which depends on member.current_tier_code,
      # which is itself recomputed from the qualifying window. Evaluation order is PINNED:
      #   (1) resolve member.current_tier_code via tier_evaluation (using current qualifying window)
      #   (2) ratio = Tier.transfer_ratio for that tier
      #   (3) partner_points = floor(loyalty_points * ratio)
      # The qualifying window is NOT re-derived from this transfer; the transfer burns redeemable
      # points but contributes 0 qualifying_points, so tier cannot change as a result of step (3).
      partner_points = floor(loyalty_points * Tier.transfer_ratio)
    input_set: "Single PartnerTransfer; member's current tier at submit"
    constants: {}
    precision: "integer floor"
    variants: []

  # ---- Expiration sweep (chronological FIFO, order-sensitive) ----
  - name: expiration_sweep
    trigger: "POST /programs/{id}/sweep-expirations"
    algorithm: chronological
    formula: |
      candidates = PointsLot where status == ACTIVE and expires_at <= clock.now and remaining_points > 0
      process candidates in created_at ASC order (tie-break lot id ASC only to disambiguate equal timestamps)
      for each lot:
        append EXPIRE PointsTransaction (points_delta = -remaining_points)
        set remaining_points = 0; lot -> EXPIRED
      recompute available_points/projected_points per affected member
    input_set: "ACTIVE PointsLots with expires_at <= clock.now"
    constants: {}
    precision: "integer"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth, check: "X-User-Role and X-User-ID headers present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /members (self-register) and GET reads marked public" }
  - { priority: 2,  category: auth, check: "Role permitted for this operation per §1.7", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: auth, check: "entity_backed actor (Member/PartnerOperator) owns the target resource (X-User-ID matches the resource's owner FK)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "member-owned and partner-owned mutations" }
  - { priority: 4,  category: existence, check: "Path/body referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5,  category: validation, check: "Required body fields present and well-typed (enums in domain, MM-DD format, ISO timestamps)", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: "all writes" }
  - { priority: 5,  category: validation, check: "Pagination limit in [1,100] and offset >= 0", error_id: ERR_VALIDATION_LIMIT, http_status: 422, applies_to: "all list endpoints" }
  - { priority: 5,  category: validation, check: "base_earn_rate/point_value_cents/transfer_ratio > 0 and earn_multiplier >= 1.0 at config creation", error_id: ERR_INVALID_RATE, http_status: 422, applies_to: "POST /programs, POST /programs/{id}/tiers" }
  - { priority: 5,  category: validation, check: "PurchaseEvent.eligible_amount_cents >= 0", error_id: ERR_NEGATIVE_AMOUNT, http_status: 422, applies_to: "POST /purchase-events" }
  - { priority: 5,  category: validation, check: "Redemption body has >= 1 line", error_id: ERR_EMPTY_REDEMPTION, http_status: 422, applies_to: "POST /redemptions" }
  - { priority: 5,  category: validation, check: "Each RedemptionLine.quantity >= 1", error_id: ERR_INVALID_QUANTITY, http_status: 422, applies_to: "POST /redemptions" }
  - { priority: 5,  category: state, check: "Program activate only from DRAFT (not ACTIVE/CLOSED)", error_id: ERR_PROGRAM_ALREADY_ACTIVE, http_status: 409, applies_to: "POST /programs/{id}/activate" }
  - { priority: 6,  category: business_constraint, check: "Member.email unique within program", error_id: ERR_DUPLICATE_EMAIL, http_status: 409, applies_to: "POST /members" }
  - { priority: 7,  category: business_constraint, check: "Tier.code and Tier.rank unique within program; STANDARD has qualify_threshold 0 and rank 0", error_id: ERR_DUPLICATE_TIER, http_status: 409, applies_to: "POST /programs/{id}/tiers" }
  - { priority: 8,  category: business_temporal, check: "Promotion ends_at > starts_at", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "POST /programs/{id}/promotions" }
  - { priority: 9,  category: business_temporal, check: "New Promotion's [starts_at, ends_at) does NOT overlap any non-CANCELLED promotion in the program. HALF-OPEN semantics: adjacency (a.ends_at == b.starts_at) is allowed; overlap iff (new.starts_at < existing.ends_at AND existing.starts_at < new.ends_at)", error_id: ERR_PROMOTION_OVERLAP, http_status: 409, applies_to: "POST /programs/{id}/promotions" }
  - { priority: 10, category: business_temporal, check: "New TransferBlackout's [starts_at, ends_at] (CLOSED interval) does NOT overlap, and is not within a 60-minute buffer of, any SCHEDULED blackout on the same partner. Overlap-or-buffer iff (new.starts_at <= existing.ends_at + 60min AND existing.starts_at - 60min <= new.ends_at)", error_id: ERR_BLACKOUT_OVERLAP, http_status: 409, applies_to: "POST /partners/{id}/blackouts" }
  - { priority: 11, category: state, check: "LoyaltyProgram.status == ACTIVE for member/earn/redeem/transfer operations", error_id: ERR_PROGRAM_NOT_ACTIVE, http_status: 409, applies_to: "POST /members, POST /purchase-events, POST /redemptions, POST /partner-transfers" }
  - { priority: 12, category: state, check: "Target entity in correct state for the requested transition (Redemption/Referral/PartnerTransfer/Promotion/PointsLot/TransferBlackout)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 13, category: state, check: "Member.status == ACTIVE for earn/redeem/transfer", error_id: ERR_MEMBER_NOT_ACTIVE, http_status: 409, applies_to: "POST /purchase-events, POST /redemptions/{id}/confirm, POST /partner-transfers" }
  - { priority: 14, category: business_constraint, check: "PartnerAccount.status == ACTIVE for new transfers", error_id: ERR_PARTNER_PAUSED, http_status: 409, applies_to: "POST /partner-transfers" }
  - { priority: 15, category: business_temporal, check: "No SCHEDULED TransferBlackout on the partner covers clock.now (starts_at <= clock.now <= ends_at, CLOSED) at transfer submit", error_id: ERR_TRANSFER_BLACKED_OUT, http_status: 409, applies_to: "POST /partner-transfers" }
  - { priority: 16, category: business_temporal, check: "PointsLot expiry: a lot whose expires_at <= clock.now is not burnable until swept; burns skip past-expiry lots", error_id: ERR_LOT_EXPIRED, http_status: 409, applies_to: "internal to confirm/transfer burn ordering" }
  - { priority: 17, category: business_constraint, check: "PartnerTransfer.loyalty_points is a positive multiple of PartnerAccount.transfer_block_size and >= min_transfer_points", error_id: ERR_INVALID_TRANSFER_BLOCK, http_status: 422, applies_to: "POST /partner-transfers" }
  - { priority: 18, category: business_constraint, check: "CatalogReward.status == ACTIVE and reward belongs to member's program for each redemption line", error_id: ERR_REWARD_UNAVAILABLE, http_status: 409, applies_to: "POST /redemptions" }
  - { priority: 19, category: business_constraint, check: "CatalogReward.stock >= line.quantity at fulfillment", error_id: ERR_INSUFFICIENT_STOCK, http_status: 409, applies_to: "POST /redemptions/{id}/fulfill" }
  - { priority: 20, category: business_fiscal, check: "Member.available_points >= quoted_cost_points at confirm; >= loyalty_points at transfer submit", error_id: ERR_INSUFFICIENT_POINTS, http_status: 409, applies_to: "POST /redemptions/{id}/confirm, POST /partner-transfers" }
  - { priority: 21, category: business_constraint, check: "Birthday grant allowed once per calendar year", error_id: ERR_BIRTHDAY_ALREADY_GRANTED, http_status: 409, applies_to: "POST /members/{id}/birthday-grant" }
  - { priority: 22, category: business_constraint, check: "Birthday grant only on the member's birth_month_day (clock MM-DD matches birth_month_day)", error_id: ERR_NOT_BIRTHDAY, http_status: 409, applies_to: "POST /members/{id}/birthday-grant" }
  - { priority: 23, category: business_constraint, check: "Referral referee_email differs from referrer's email; self-referral rejected", error_id: ERR_SELF_REFERRAL, http_status: 409, applies_to: "POST /referrals" }
  - { priority: 24, category: business_constraint, check: "Referral referee_email is not already a registered member of the program at creation", error_id: ERR_REFEREE_EXISTS, http_status: 409, applies_to: "POST /referrals" }
  - { priority: 25, category: state, check: "OCC: expected_member_version matches Member.version on confirm/transfer-submit (checked LAST, just before the write)", error_id: ERR_STALE_MEMBER_VERSION, http_status: 412, applies_to: "POST /redemptions/{id}/confirm, POST /partner-transfers" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Program config ----
  - { method: POST, path: "/programs", description: "Create a loyalty program", roles: [ProgramAdmin], code: 201, input: [name, base_earn_rate, point_value_cents, lot_expiration_months, "qualifying_window_months?", birthday_reward_points, referral_referrer_points, referral_referee_points, referral_min_qualifying_cents], output: LoyaltyProgram, side_effects: ["status defaults DRAFT"] }
  - { method: POST, path: "/programs/{id}/activate", description: "Activate a program", roles: [ProgramAdmin], code: 200, input: [], output: LoyaltyProgram, side_effects: ["status DRAFT -> ACTIVE"] }
  - { method: POST, path: "/programs/{id}/close", description: "Close a program (no further member/earn/redeem/transfer operations)", roles: [ProgramAdmin], code: 200, input: [], output: LoyaltyProgram, side_effects: ["status DRAFT|ACTIVE -> CLOSED"] }
  - { method: GET,  path: "/programs/{id}", description: "Get a program", roles: [ProgramAdmin, Member, PartnerOperator], code: 200, input: [], output: LoyaltyProgram, side_effects: [] }
  - { method: GET,  path: "/programs", description: "List programs", roles: [ProgramAdmin], code: 200, input: ["limit?", "offset?"], output: "LoyaltyProgram[]", side_effects: [] }

  # ---- Tiers (child of program) ----
  - { method: POST, path: "/programs/{id}/tiers", description: "Define a tier", roles: [ProgramAdmin], code: 201, input: [program_id, code, qualify_threshold, earn_multiplier, transfer_ratio, rank], output: Tier, side_effects: ["uniqueness checks on code/rank"] }
  - { method: GET,  path: "/programs/{id}/tiers", description: "List a program's tiers (reverse-reachability for Tier.program_id)", roles: [ProgramAdmin, Member], code: 200, input: ["limit?", "offset?"], output: "Tier[]", side_effects: [] }

  # ---- Promotions (child of program) ----
  - { method: POST, path: "/programs/{id}/promotions", description: "Schedule a bonus-point promotion", roles: [ProgramAdmin], code: 201, input: [program_id, name, bonus_multiplier, starts_at, ends_at, "min_eligible_cents?"], output: Promotion, side_effects: ["status SCHEDULED"] }
  - { method: GET,  path: "/programs/{id}/promotions", description: "List a program's promotions (reverse-reachability for Promotion.program_id)", roles: [ProgramAdmin, Member], code: 200, input: ["limit?", "offset?"], output: "Promotion[]", side_effects: [] }
  - { method: POST, path: "/promotions/{id}/cancel", description: "Cancel a promotion", roles: [ProgramAdmin], code: 200, input: [], output: Promotion, side_effects: ["status -> CANCELLED"] }
  - { method: POST, path: "/programs/{id}/refresh-promotions", description: "Advance promotion lifecycle vs clock (SCHEDULED->ACTIVE->ENDED)", roles: [ProgramAdmin], code: 200, input: [], output: "Promotion[]", side_effects: ["recompute promotion statuses"] }

  # ---- Catalog rewards (child of program) ----
  - { method: POST, path: "/programs/{id}/rewards", description: "Add a catalog reward", roles: [ProgramAdmin], code: 201, input: [program_id, name, point_cost, "tier_discount_pct?", stock], output: CatalogReward, side_effects: ["status ACTIVE"] }
  - { method: GET,  path: "/programs/{id}/rewards", description: "List a program's rewards (reverse-reachability for CatalogReward.program_id)", roles: [ProgramAdmin, Member], code: 200, input: ["limit?", "offset?"], output: "CatalogReward[]", side_effects: [] }
  - { method: POST, path: "/rewards/{id}/discontinue", description: "Discontinue a reward", roles: [ProgramAdmin], code: 200, input: [], output: CatalogReward, side_effects: ["status -> DISCONTINUED"] }

  # ---- Partner accounts (child of program) ----
  - { method: POST, path: "/programs/{id}/partners", description: "Register a partner account", roles: [ProgramAdmin], code: 201, input: [program_id, name, transfer_block_size, min_transfer_points], output: PartnerAccount, side_effects: ["status ACTIVE"] }
  - { method: POST, path: "/partners/{id}/pause", description: "Pause a partner account (blocks new transfers)", roles: [ProgramAdmin], code: 200, input: [], output: PartnerAccount, side_effects: ["status ACTIVE -> PAUSED"] }
  - { method: POST, path: "/partners/{id}/resume", description: "Resume a paused partner account", roles: [ProgramAdmin], code: 200, input: [], output: PartnerAccount, side_effects: ["status PAUSED -> ACTIVE"] }
  - { method: GET,  path: "/partners/{id}", description: "Get a partner account (segment anchor)", roles: [ProgramAdmin, Member, PartnerOperator], code: 200, input: [], output: PartnerAccount, side_effects: [] }
  - { method: GET,  path: "/programs/{id}/partners", description: "List a program's partners (reverse-reachability for PartnerAccount.program_id)", roles: [ProgramAdmin, Member, PartnerOperator], code: 200, input: ["limit?", "offset?"], output: "PartnerAccount[]", side_effects: [] }

  # ---- Members ----
  - { method: POST, path: "/members", description: "Register a member (self-service); may carry referral linkage", roles: [ProgramAdmin, Member], code: 201, input: [program_id, email, full_name, birth_month_day, "referred_by_member_id?"], output: Member, side_effects: ["status ACTIVE; current_tier_code STANDARD; if referred_by_member_id set, find the PENDING Referral in this program whose referrer_member_id == referred_by_member_id AND referee_email == this member's email, and set its referee_member_id to the new member id (leaving status PENDING)"] }
  - { method: GET,  path: "/members/{id}", description: "Get a member with computed balances and tier", roles: [ProgramAdmin, Member], code: 200, input: [], output: Member, side_effects: ["recompute available/projected/qualifying/tier on read"] }
  - { method: GET,  path: "/members", description: "List members, filterable by program or referrer (reverse-reachability for Member.program_id and Member.referred_by_member_id)", roles: [ProgramAdmin], code: 200, input: ["program_id?", "referred_by_member_id?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: POST, path: "/members/{id}/suspend", description: "Suspend a member", roles: [ProgramAdmin], code: 200, input: [], output: Member, side_effects: ["status ACTIVE -> SUSPENDED"] }
  - { method: POST, path: "/members/{id}/reactivate", description: "Reactivate a suspended member", roles: [ProgramAdmin], code: 200, input: [], output: Member, side_effects: ["status SUSPENDED -> ACTIVE"] }
  - { method: POST, path: "/members/{id}/birthday-grant", description: "Grant birthday reward points", roles: [ProgramAdmin], code: 201, input: [], output: PointsLot, side_effects: ["mint BIRTHDAY lot of program.birthday_reward_points; append BIRTHDAY PointsTransaction; set last_birthday_grant_year; increments Member.version by 1"] }
  - { method: GET,  path: "/members/{id}/lots", description: "List a member's points lots (reverse-reachability for PointsLot.member_id)", roles: [ProgramAdmin, Member], code: 200, input: ["status?", "limit?", "offset?"], output: "PointsLot[]", side_effects: [] }

  # ---- Points transactions (append-only ledger) ----
  - { method: GET,  path: "/transactions/{id}", description: "Get a single ledger transaction (segment anchor)", roles: [ProgramAdmin, Member], code: 200, input: [], output: PointsTransaction, side_effects: [] }
  - { method: GET,  path: "/transactions", description: "List ledger transactions, filterable (reverse-reachability for PointsTransaction.member_id / lot_id / ref_redemption_id / ref_transfer_id)", roles: [ProgramAdmin, Member], code: 200, input: ["member_id?", "lot_id?", "ref_redemption_id?", "ref_transfer_id?", "type?", "limit?", "offset?"], output: "PointsTransaction[]", side_effects: [] }

  # ---- Purchase events (earn) ----
  - { method: POST, path: "/purchase-events", description: "Record an eligible purchase; mints redeemable points and may complete a pending referral", roles: [ProgramAdmin, Member], code: 201, input: [member_id, eligible_amount_cents, "occurred_at?"], output: PurchaseEvent, side_effects: ["compute earned_points + qualifying_points; select promotion; mint EARN_PURCHASE PointsLot; append EARN_PURCHASE PointsTransaction; recompute tier; complete matching PENDING Referral if threshold met; increments Member.version by 1"] }
  - { method: GET,  path: "/purchase-events/{id}", description: "Get a purchase event (segment anchor)", roles: [ProgramAdmin, Member], code: 200, input: [], output: PurchaseEvent, side_effects: [] }
  - { method: GET,  path: "/purchase-events", description: "List purchase events, filterable by member or applied promotion (reverse-reachability for PurchaseEvent.member_id and applied_promotion_id)", roles: [ProgramAdmin, Member], code: 200, input: ["member_id?", "applied_promotion_id?", "limit?", "offset?"], output: "PurchaseEvent[]", side_effects: [] }

  # ---- Redemptions (burn) ----
  - { method: POST, path: "/redemptions", description: "Quote a catalog redemption (lines in body); reserves quoted_cost_points", roles: [ProgramAdmin, Member], code: 201, input: [member_id, lines], output: Redemption, side_effects: ["compute per-line line_cost_points and quoted_cost_points; status QUOTED"] }
  - { method: GET,  path: "/redemptions/{id}", description: "Get a redemption", roles: [ProgramAdmin, Member], code: 200, input: [], output: Redemption, side_effects: [] }
  - { method: GET,  path: "/members/{id}/redemptions", description: "List a member's redemptions (reverse-reachability for Redemption.member_id)", roles: [ProgramAdmin, Member], code: 200, input: ["status?", "limit?", "offset?"], output: "Redemption[]", side_effects: [] }
  - { method: GET,  path: "/redemptions/{id}/lines", description: "List a redemption's lines (reverse-reachability for RedemptionLine.redemption_id)", roles: [ProgramAdmin, Member], code: 200, input: [], output: "RedemptionLine[]", side_effects: [] }
  - { method: GET,  path: "/redemption-lines/{id}", description: "Get a single redemption line (segment anchor)", roles: [ProgramAdmin, Member], code: 200, input: [], output: RedemptionLine, side_effects: [] }
  - { method: GET,  path: "/redemption-lines", description: "List redemption lines, filterable (reverse-reachability for RedemptionLine.reward_id)", roles: [ProgramAdmin, Member], code: 200, input: ["reward_id?", "redemption_id?", "limit?", "offset?"], output: "RedemptionLine[]", side_effects: [] }
  - { method: POST, path: "/redemptions/{id}/confirm", description: "Confirm a quoted redemption; burns points (OCC on member)", roles: [Member, ProgramAdmin], code: 200, input: [expected_member_version], output: Redemption, side_effects: ["FIFO burn quoted_cost_points; lots -> EXHAUSTED; REDEEM rows; recompute balances; increments Member.version by 1; status QUOTED -> CONFIRMED"] }
  - { method: POST, path: "/redemptions/{id}/fulfill", description: "Fulfill a confirmed redemption; recompute final cost and adjust", roles: [ProgramAdmin], code: 200, input: [], output: Redemption, side_effects: ["compute final_cost_points; refund or burn delta; decrement stock; status CONFIRMED -> FULFILLED"] }
  - { method: POST, path: "/redemptions/{id}/cancel", description: "Cancel a redemption (compensates burn if CONFIRMED)", roles: [Member, ProgramAdmin], code: 200, input: [], output: Redemption, side_effects: ["if CONFIRMED, mint compensating EARN_BONUS lot of quoted_cost_points; status -> CANCELLED"] }

  # ---- Referrals ----
  - { method: POST, path: "/referrals", description: "Create a referral invitation", roles: [ProgramAdmin, Member], code: 201, input: [program_id, referrer_member_id, referee_email], output: Referral, side_effects: ["status PENDING"] }
  - { method: GET,  path: "/referrals/{id}", description: "Get a referral (segment anchor)", roles: [ProgramAdmin, Member], code: 200, input: [], output: Referral, side_effects: [] }
  - { method: GET,  path: "/referrals", description: "List referrals, filterable by program (reverse-reachability for Referral.program_id)", roles: [ProgramAdmin], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - { method: GET,  path: "/members/{id}/referrals", description: "List referrals where a member is referrer or referee (reverse-reachability for Referral.referrer_member_id and referee_member_id)", roles: [ProgramAdmin, Member], code: 200, input: ["role?", "status?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - { method: POST, path: "/referrals/{id}/revoke", description: "Revoke a pending referral", roles: [ProgramAdmin], code: 200, input: [], output: Referral, side_effects: ["status PENDING -> REVOKED"] }

  # ---- Partner transfers ----
  - { method: POST, path: "/partner-transfers", description: "Submit a partner-points transfer; burns loyalty points (OCC on member)", roles: [Member, ProgramAdmin], code: 201, input: [member_id, partner_account_id, loyalty_points, expected_member_version], output: PartnerTransfer, side_effects: ["compute partner_points; FIFO burn loyalty_points; TRANSFER_OUT rows; recompute balances; increments Member.version by 1; status SUBMITTED"] }
  - { method: GET,  path: "/partner-transfers/{id}", description: "Get a partner transfer", roles: [ProgramAdmin, Member, PartnerOperator], code: 200, input: [], output: PartnerTransfer, side_effects: [] }
  - { method: GET,  path: "/members/{id}/partner-transfers", description: "List a member's partner transfers (reverse-reachability for PartnerTransfer.member_id)", roles: [ProgramAdmin, Member], code: 200, input: ["status?", "limit?", "offset?"], output: "PartnerTransfer[]", side_effects: [] }
  - { method: GET,  path: "/partners/{id}/transfers", description: "List a partner's transfers (reverse-reachability for PartnerTransfer.partner_account_id)", roles: [ProgramAdmin, PartnerOperator], code: 200, input: ["status?", "limit?", "offset?"], output: "PartnerTransfer[]", side_effects: [] }
  - { method: POST, path: "/partner-transfers/{id}/settle", description: "Settle a submitted transfer", roles: [PartnerOperator], code: 200, input: [], output: PartnerTransfer, side_effects: ["status SUBMITTED -> SETTLED"] }
  - { method: POST, path: "/partner-transfers/{id}/reverse", description: "Reverse a submitted transfer (compensation refunds member)", roles: [PartnerOperator, ProgramAdmin], code: 200, input: [], output: PartnerTransfer, side_effects: ["mint TRANSFER_IN_REVERSAL lot of loyalty_points; recompute balances; status -> REVERSED"] }

  # ---- Transfer blackouts (per-partner maintenance intervals) ----
  - { method: POST, path: "/partners/{id}/blackouts", description: "Schedule a transfer-blackout interval on a partner (closed interval; must not overlap or sit within the buffer of another SCHEDULED blackout)", roles: [ProgramAdmin, PartnerOperator], code: 201, input: [partner_account_id, starts_at, ends_at], output: TransferBlackout, side_effects: ["status SCHEDULED"] }
  - { method: GET,  path: "/blackouts/{id}", description: "Get a transfer blackout (segment anchor)", roles: [ProgramAdmin, PartnerOperator], code: 200, input: [], output: TransferBlackout, side_effects: [] }
  - { method: GET,  path: "/partners/{id}/blackouts", description: "List a partner's transfer blackouts (reverse-reachability for TransferBlackout.partner_account_id)", roles: [ProgramAdmin, PartnerOperator], code: 200, input: ["status?", "limit?", "offset?"], output: "TransferBlackout[]", side_effects: [] }
  - { method: POST, path: "/blackouts/{id}/cancel", description: "Cancel a scheduled transfer blackout", roles: [ProgramAdmin, PartnerOperator], code: 200, input: [], output: TransferBlackout, side_effects: ["status SCHEDULED -> CANCELLED"] }

  # ---- Maintenance / clock (test-driving) ----
  - { method: POST, path: "/programs/{id}/sweep-expirations", description: "Expire all ACTIVE lots whose expires_at <= clock.now; expire stale pending referrals", roles: [ProgramAdmin], code: 200, input: [], output: "PointsLot[]", side_effects: ["EXPIRE swept lots in created_at ASC order; PENDING referrals past window -> EXPIRED; recompute balances"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the system clock (test-driving)", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: "{ now: datetime }", side_effects: ["server clock set"] }
  - { method: POST, path: "/_clock/advance", description: "Advance the system clock by a number of months (test-driving)", roles: [ProgramAdmin], code: 200, input: [months], output: "{ now: datetime }", side_effects: ["server clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,          http: 401, condition: "Missing/invalid X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_FORBIDDEN,                http: 403, condition: "Authenticated role not permitted for the operation" }
  - { id: ERR_NOT_RESOURCE_OWNER,       http: 403, condition: "entity_backed actor acts on a resource they do not own" }
  - { id: ERR_NOT_FOUND,                http: 404, condition: "Referenced program/member/lot/reward/promotion/partner/redemption/referral/transfer does not exist" }
  - { id: ERR_INVALID_REQUEST,          http: 422, condition: "Missing/malformed required body field, bad enum, bad MM-DD or ISO timestamp" }
  - { id: ERR_DUPLICATE_EMAIL,          http: 409, condition: "Member email already registered within the program" }
  - { id: ERR_DUPLICATE_TIER,           http: 409, condition: "Tier code or rank already defined for the program; or STANDARD threshold/rank not 0" }
  - { id: ERR_INVALID_WINDOW,           http: 422, condition: "Promotion ends_at <= starts_at; or TransferBlackout ends_at < starts_at" }
  - { id: ERR_PROMOTION_OVERLAP,        http: 409, condition: "New promotion window overlaps an existing non-CANCELLED promotion (half-open semantics, adjacency allowed)" }
  - { id: ERR_BLACKOUT_OVERLAP,         http: 409, condition: "New transfer blackout overlaps or is within the 60-minute buffer of an existing SCHEDULED blackout on the partner (closed-interval semantics)" }
  - { id: ERR_TRANSFER_BLACKED_OUT,     http: 409, condition: "A SCHEDULED transfer blackout covers clock.now at transfer submit" }
  - { id: ERR_PROGRAM_NOT_ACTIVE,       http: 409, condition: "Program not ACTIVE for member/earn/redeem/transfer operation" }
  - { id: ERR_INVALID_STATE,            http: 409, condition: "Entity not in a state that allows the requested transition" }
  - { id: ERR_MEMBER_NOT_ACTIVE,        http: 409, condition: "Member SUSPENDED for an earn/redeem/transfer" }
  - { id: ERR_PARTNER_PAUSED,           http: 409, condition: "PartnerAccount PAUSED at transfer submit" }
  - { id: ERR_LOT_EXPIRED,              http: 409, condition: "A burn would have to draw from a past-expiry unswept lot (internal burn guard)" }
  - { id: ERR_INVALID_TRANSFER_BLOCK,   http: 422, condition: "loyalty_points not a positive multiple of transfer_block_size or below min_transfer_points" }
  - { id: ERR_REWARD_UNAVAILABLE,       http: 409, condition: "Redemption line references a DISCONTINUED reward or one outside the member's program" }
  - { id: ERR_INSUFFICIENT_STOCK,       http: 409, condition: "Reward stock below requested quantity at fulfillment" }
  - { id: ERR_INSUFFICIENT_POINTS,      http: 409, condition: "available_points below quoted_cost_points (confirm) or below loyalty_points (transfer)" }
  - { id: ERR_BIRTHDAY_ALREADY_GRANTED, http: 409, condition: "Birthday already granted this calendar year" }
  - { id: ERR_NOT_BIRTHDAY,             http: 409, condition: "Birthday grant requested outside the member's birth month/day" }
  - { id: ERR_SELF_REFERRAL,            http: 409, condition: "referee_email equals the referrer's own email" }
  - { id: ERR_STALE_MEMBER_VERSION,     http: 412, condition: "expected_member_version does not match Member.version (OCC) on confirm/transfer-submit" }
  - { id: ERR_EMPTY_REDEMPTION,         http: 422, condition: "Redemption created with zero lines" }
  - { id: ERR_INVALID_QUANTITY,         http: 422, condition: "RedemptionLine quantity < 1" }
  - { id: ERR_NEGATIVE_AMOUNT,          http: 422, condition: "eligible_amount_cents < 0" }
  - { id: ERR_REFEREE_EXISTS,           http: 409, condition: "referee_email already belongs to a registered member of the program at referral creation" }
  - { id: ERR_INVALID_RATE,             http: 422, condition: "base_earn_rate, earn_multiplier, transfer_ratio, point_value_cents <= 0 (or earn_multiplier < 1.0)" }
  - { id: ERR_VALIDATION_LIMIT,         http: 422, condition: "Pagination limit/offset out of bounds (limit<1 or >100, offset<0)" }
  - { id: ERR_PROGRAM_ALREADY_ACTIVE,   http: 409, condition: "Activate called on a program already ACTIVE or CLOSED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Operates the loyalty program: configures tiers/promotions/rewards/partners, activates programs, runs maintenance sweeps and fulfillment, grants birthday rewards, revokes referrals."
    identity: "opaque"
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{id}/activate"
      - "POST /programs/{id}/close"
      - "POST /programs/{id}/tiers"
      - "POST /programs/{id}/promotions"
      - "POST /promotions/{id}/cancel"
      - "POST /programs/{id}/refresh-promotions"
      - "POST /programs/{id}/rewards"
      - "POST /rewards/{id}/discontinue"
      - "POST /programs/{id}/partners"
      - "POST /partners/{id}/pause"
      - "POST /partners/{id}/resume"
      - "POST /members/{id}/suspend"
      - "POST /members/{id}/reactivate"
      - "POST /members/{id}/birthday-grant"
      - "POST /redemptions/{id}/fulfill"
      - "POST /referrals/{id}/revoke"
      - "POST /programs/{id}/sweep-expirations"
      - "POST /_clock/set_current_utc"
      - "POST /_clock/advance"
      - "GET /programs"
      - "GET /members"
      - "GET /referrals"
    shared_operations:
      - "POST /members"
      - "POST /purchase-events"
      - "POST /redemptions"
      - "POST /redemptions/{id}/confirm"
      - "POST /redemptions/{id}/cancel"
      - "POST /referrals"
      - "POST /partner-transfers"
      - "POST /partner-transfers/{id}/reverse"
      - "POST /partners/{id}/blackouts"
      - "POST /blackouts/{id}/cancel"
      - "GET reads on members/lots/transactions/rewards/tiers/promotions/redemptions/redemption-lines/referrals/partner-transfers/blackouts/purchase-events/partners/programs/{id}"

  - name: Member
    description: "A loyalty member acting on their own ledger: registers, records purchases, redeems rewards, refers friends, transfers points to partners."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /members"
      - "POST /purchase-events"
      - "POST /redemptions"
      - "POST /redemptions/{id}/confirm"
      - "POST /redemptions/{id}/cancel"
      - "POST /referrals"
      - "POST /partner-transfers"
      - "GET /members/{id}"
      - "GET /members/{id}/lots"
      - "GET /members/{id}/redemptions"
      - "GET /members/{id}/referrals"
      - "GET /members/{id}/partner-transfers"
      - "GET /transactions"
      - "GET /transactions/{id}"
      - "GET /redemptions/{id}"
      - "GET /redemptions/{id}/lines"
      - "GET /redemption-lines"
      - "GET /redemption-lines/{id}"
      - "GET /referrals/{id}"
      - "GET /purchase-events"
      - "GET /purchase-events/{id}"
      - "GET /programs/{id}"
      - "GET /programs/{id}/tiers"
      - "GET /programs/{id}/promotions"
      - "GET /programs/{id}/rewards"
      - "GET /programs/{id}/partners"
      - "GET /partners/{id}"
      - "GET /partner-transfers/{id}"

  - name: PartnerOperator
    description: "A partner's operator who settles or reverses partner-points transfers for their own partner account."
    identity: "entity_backed:PartnerAccount"
    exclusive_operations:
      - "POST /partner-transfers/{id}/settle"
    shared_operations:
      - "POST /partner-transfers/{id}/reverse"
      - "POST /partners/{id}/blackouts"
      - "POST /blackouts/{id}/cancel"
      - "GET /partner-transfers/{id}"
      - "GET /partners/{id}/transfers"
      - "GET /partners/{id}"
      - "GET /partners/{id}/blackouts"
      - "GET /blackouts/{id}"
      - "GET /programs/{id}/partners"
      - "GET /programs/{id}"

  - name: Anonymous
    description: "Unauthenticated caller; reserved for negative auth tests. Holds no business operations."
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []
