              payload: { code: "CSP-1", title: "Programming I", segment: "SECONDARY", position: 1, credit_hours: 4.00, status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { crs_sec_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "CSP-9", title: "Dual-Credit Data Structures", segment: "POSTSECONDARY", position: 2, credit_hours: 3.00, articulated_credit_hours: 3.00, articulation_verified: true, prerequisite_course_id: "${crs_sec_id}", status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
