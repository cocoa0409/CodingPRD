# =============================================================================
# Yearbook Production & Sales — seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  460. Yearbook Production & Sales (Jostens style): page ladder & template, photo/quote
  submission & approval, staff role & deadline (signature pages), proof & plant submission,
  pre-sale & personalization (name stamp), ad/sponsor pages, print run & delivery,
  distribution list

domain_name: yearbook-production
api_prefix: /yearbooks

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: hybrid
  # Yearbook is the production project (root). LadderPage / Proof / PreSaleOrder / Distribution
  # nest under it (hierarchical). Submission and StaffAssignment reference LadderPage by FK,
  # AdContract references both Yearbook and LadderPage (cross-cutting flat references).

  state_machine_shape: branching
  # LadderPage, Submission, and Proof all carry revise/approve fork-join cycles; Yearbook is a
  # compound posture-like production_phase derived from its ladder + proof + print state.

  relationship_patterns:
    - one_to_many        # Yearbook -> LadderPage; LadderPage -> Submission
    - cross_aggregate    # AdContract references a LadderPage slot; PreSaleOrder references Yearbook

  role_model: peer_roles
  # Adviser owns ladder/proof/print decisions; Staff owns page production & submission approval
  # on assigned pages; Contributor submits photos/quotes; SalesRep sells ads & books; system
  # performs deadline/derived recomputations.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Yearbook
    parent: null
    common_fields: true
    fields:
      - { name: school_name, type: string, source: input, description: "School the yearbook is produced for" }
      - { name: academic_year, type: string, source: input, description: "e.g. 2025-2026" }
      - { name: target_page_count, type: integer, source: input, description: "Planned total pages in the ladder; must be a positive even number (signatures are 4-page multiples), constraints: > 0 and divisible by 4" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Plant unit print cost per copy in cents, used by production cost calc" }
      - { name: presale_open_iso, type: datetime, source: input, description: "Inclusive start of the pre-sale window (orders before this are rejected)" }
      - { name: presale_close_iso, type: datetime, source: input, description: "Exclusive end of the EARLY pre-sale window; orders at-or-after this fall to STANDARD pricing" }
      - { name: production_phase, type: enum, source: computed, description: "LADDER_BUILD | CONTENT | PROOFING | PLANT | PRINTING | DELIVERED — derived production posture; constraints: one of {LADDER_BUILD, CONTENT, PROOFING, PLANT, PRINTING, DELIVERED}" }
      - { name: ladder_filled_count, type: integer, source: computed, description: "Count of LadderPage rows attached to this Yearbook (one per page_number)" }
      - { name: ladder_complete, type: boolean, source: computed, description: "True iff ladder_filled_count == target_page_count" }
      - { name: ad_revenue_cents, type: integer, source: computed, description: "Running sum of net_price_cents over this Yearbook's AdContracts in SIGNED or PLACED state" }
      - { name: presale_revenue_cents, type: integer, source: computed, description: "Running sum of total_price_cents over this Yearbook's PreSaleOrders in PAID or FULFILLED state" }
      - { name: production_cost_cents, type: integer, source: computed, description: "Computed plant production cost for the committed print run (see §1.3 production_cost)" }

  - name: LadderPage
    parent: Yearbook
    common_fields: true
    fields:
      - { name: yearbook_id, type: string, source: system, description: "FK -> Yearbook.id" }
      - { name: page_number, type: integer, source: input, description: "1-based ordinal slot in the ladder; unique within the Yearbook; constraints: 1 <= page_number <= Yearbook.target_page_count" }
      - { name: section, type: enum, source: input, description: "STUDENT_LIFE | ACADEMICS | SPORTS | CLUBS | ADS | SIGNATURE; constraints: one of {STUDENT_LIFE, ACADEMICS, SPORTS, CLUBS, ADS, SIGNATURE}" }
      - { name: template_code, type: string, source: input, description: "Layout template applied to the page (e.g. T-2COL, T-COLLAGE)" }
      - { name: spread_span, type: integer, source: input, default: 1, description: "How many consecutive page_numbers this layout occupies (1 = single page, 2 = double-page spread); constraints: spread_span in {1, 2}" }
      - { name: assigned_staff_id, type: string, source: system, description: "FK -> StaffAssignment.id; the staff member responsible for producing this page (null until assigned)" }
      - { name: required_submission_count, type: integer, source: input, default: 1, description: "How many APPROVED submissions the page needs before it can be APPROVED; constraints: >= 0" }
      - { name: approved_submission_count, type: integer, source: computed, description: "Count of this page's Submissions currently in APPROVED state" }
      - { name: status, type: enum, source: system, description: "DRAFT -> IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW -> APPROVED / LOCKED; constraints: one of {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED, LOCKED}" }

  - name: Submission
    parent: LadderPage
    common_fields: true
    fields:
      - { name: ladder_page_id, type: string, source: system, description: "FK -> LadderPage.id" }
      - { name: kind, type: enum, source: input, description: "PHOTO | QUOTE; constraints: one of {PHOTO, QUOTE}" }
      - { name: contributor_id, type: string, source: input, description: "Opaque contributor identifier who submitted the asset" }
      - { name: asset_ref, type: string, source: input, description: "Storage reference or quote text for the submitted asset" }
      - { name: review_note, type: string, source: input, default: "", description: "Reviewer note recorded on reject/approve" }
      - { name: status, type: enum, source: system, description: "PENDING -> APPROVED / REJECTED; REJECTED -> PENDING on resubmit; constraints: one of {PENDING, APPROVED, REJECTED}" }

  - name: StaffAssignment
    parent: Yearbook
    common_fields: true
    fields:
      - { name: yearbook_id, type: string, source: system, description: "FK -> Yearbook.id" }
      - { name: staff_user_id, type: string, source: input, description: "Opaque staff operator identifier this assignment represents" }
      - { name: role_title, type: enum, source: input, description: "EDITOR | PHOTOGRAPHER | SECTION_LEAD | SIGNATURE_COORDINATOR; constraints: one of {EDITOR, PHOTOGRAPHER, SECTION_LEAD, SIGNATURE_COORDINATOR}" }
      - { name: deadline_iso, type: datetime, source: input, description: "Production deadline by which this staff member's assigned pages must reach APPROVED" }
      - { name: assigned_page_count, type: integer, source: computed, description: "Count of LadderPage rows whose assigned_staff_id == this assignment id" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RELEASED; constraints: one of {ACTIVE, RELEASED}" }

  - name: AdContract
    parent: Yearbook
    common_fields: true
    fields:
      - { name: yearbook_id, type: string, source: system, description: "FK -> Yearbook.id" }
      - { name: ladder_page_id, type: string, source: input, description: "FK -> LadderPage.id; the ADS-section page this contract occupies" }
      - { name: sponsor_name, type: string, source: input, description: "Sponsor / advertiser name" }
      - { name: size, type: enum, source: input, description: "FULL | HALF | QUARTER; fraction of a page purchased; constraints: one of {FULL, HALF, QUARTER}" }
      - { name: list_price_cents, type: integer, source: computed, description: "Pre-discount price for the size tier (see §1.3 ad_pricing)" }
      - { name: discount_pct, type: number, source: input, default: 0, description: "Sponsor discount fraction 0..0.5 applied to list price; constraints: 0 <= discount_pct <= 0.5" }
      - { name: net_price_cents, type: integer, source: computed, description: "Final ad price after discount and rounding (see §1.3 ad_pricing)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SIGNED -> PLACED / VOIDED; constraints: one of {DRAFT, SIGNED, PLACED, VOIDED}" }

  - name: Proof
    parent: Yearbook
    common_fields: true
    fields:
      - { name: yearbook_id, type: string, source: system, description: "FK -> Yearbook.id" }
      - { name: round_number, type: integer, source: computed, description: "1-based proof round; increments per new Proof created for the Yearbook" }
      - { name: reviewer_note, type: string, source: input, default: "", description: "Adviser note on the proof round" }
      - { name: status, type: enum, source: system, description: "OPEN -> CHANGES_REQUESTED -> OPEN; OPEN -> PLANT_SUBMITTED -> PLANT_APPROVED; constraints: one of {OPEN, CHANGES_REQUESTED, PLANT_SUBMITTED, PLANT_APPROVED}" }

  - name: PreSaleOrder
    parent: Yearbook
    common_fields: true
    fields:
      - { name: yearbook_id, type: string, source: system, description: "FK -> Yearbook.id" }
      - { name: buyer_name, type: string, source: input, description: "Name of the purchaser" }
      - { name: quantity, type: integer, source: input, description: "Number of copies ordered; constraints: >= 1" }
      - { name: personalize, type: boolean, source: input, default: false, description: "Whether a name stamp personalization is added" }
      - { name: stamp_name, type: string, source: input, default: "", description: "Foil name stamp text; required (non-empty) when personalize is true" }
      - { name: ordered_at_iso, type: datetime, source: system, description: "Logical-clock timestamp when the order was placed (sets EARLY vs STANDARD pricing tier)" }
      - { name: price_tier, type: enum, source: computed, description: "EARLY | STANDARD — tier the order was priced under; constraints: one of {EARLY, STANDARD}" }
      - { name: total_price_cents, type: integer, source: computed, description: "Computed order total (see §1.3 presale_price)" }
      - { name: status, type: enum, source: system, description: "PLACED -> PAID -> FULFILLED; PLACED/PAID -> CANCELLED; constraints: one of {PLACED, PAID, FULFILLED, CANCELLED}" }

  - name: PrintRun
    parent: Yearbook
    common_fields: true
    fields:
      - { name: yearbook_id, type: string, source: system, description: "FK -> Yearbook.id" }
      - { name: quantity, type: integer, source: input, description: "Total copies to print; constraints: >= 1" }
      - { name: delivery_address, type: string, source: input, description: "Ship-to address for the print run" }
      - { name: cost_cents, type: integer, source: computed, description: "Snapshot of production cost at commit (see §1.3 production_cost)" }
      - { name: status, type: enum, source: system, description: "COMMITTED -> SHIPPED -> DELIVERED; constraints: one of {COMMITTED, SHIPPED, DELIVERED}" }

  - name: DistributionRecord
    parent: Yearbook
    common_fields: true
    fields:
      - { name: yearbook_id, type: string, source: system, description: "FK -> Yearbook.id" }
      - { name: presale_order_id, type: string, source: system, description: "FK -> PreSaleOrder.id; the fulfilled order this distribution row settles" }
      - { name: recipient_name, type: string, source: system, description: "Copied from the PreSaleOrder buyer_name at distribution time" }
      - { name: copies_handed, type: integer, source: system, description: "Copies delivered to this recipient (copied from the order quantity)" }
      - { name: status, type: enum, source: system, description: "HANDED_OUT (terminal on creation); constraints: one of {HANDED_OUT}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LadderPage
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /yearbooks/pages/{pageId}/submit-review"
        actor: Staff
        preconditions:
          - "approved_submission_count >= required_submission_count (ERR_SUBMISSIONS_INCOMPLETE)"
          - "page has an assigned_staff_id whose StaffAssignment.status == ACTIVE (ERR_PAGE_UNASSIGNED)"
        side_effects: []

      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /yearbooks/pages/{pageId}/request-changes"
        actor: Adviser
        preconditions: []
        side_effects: []

      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /yearbooks/pages/{pageId}/submit-review"
        actor: Staff
        preconditions:
          - "approved_submission_count >= required_submission_count (ERR_SUBMISSIONS_INCOMPLETE)"
        side_effects: []
        note: "Revision loop — page bounces back to review after edits"

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /yearbooks/pages/{pageId}/approve"
        actor: Adviser
        preconditions:
          - "approved_submission_count >= required_submission_count (ERR_SUBMISSIONS_INCOMPLETE)"
        side_effects:
          - "Recompute Yearbook.production_phase (CONTENT once ladder_complete && >=1 page APPROVED)"

      - from: APPROVED
        to: LOCKED
        trigger: "system (automatic) — when a Proof on the parent Yearbook transitions OPEN -> PLANT_SUBMITTED"
        actor: system
        preconditions: []
        side_effects: []
        note: "Plant submission freezes every APPROVED page so no further edits land after the plant copy"

      - from: APPROVED
        to: CHANGES_REQUESTED
        trigger: "POST /yearbooks/pages/{pageId}/request-changes"
        actor: Adviser
        preconditions:
          - "no Proof on the parent Yearbook is in PLANT_SUBMITTED or PLANT_APPROVED (ERR_PLANT_FROZEN)"
        side_effects: []
        note: "Adviser may reopen an approved page only before plant submission (no plant proof exists yet)"

      - from: LOCKED
        to: CHANGES_REQUESTED
        trigger: "POST /yearbooks/pages/{pageId}/request-changes"
        actor: Adviser
        preconditions:
          - "no Proof on the parent Yearbook is in PLANT_SUBMITTED or PLANT_APPROVED (ERR_PLANT_FROZEN) — a LOCKED page ALWAYS has such a proof, so this transition is always rejected with ERR_PLANT_FROZEN, surfacing the domain-specific frozen error instead of a generic invalid-state"
        side_effects: []
        note: "request-changes is defined-from LOCKED only so the frozen-plant guard can return ERR_PLANT_FROZEN; the precondition can never pass while the page is LOCKED"

  - entity: Submission
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /yearbooks/submissions/{submissionId}/approve"
        actor: Staff
        preconditions:
          - "parent LadderPage.status in {DRAFT, IN_REVIEW, CHANGES_REQUESTED} (ERR_PAGE_LOCKED_FOR_SUBMISSIONS)"
        side_effects:
          - "LadderPage.approved_submission_count += 1 (recomputed)"

      - from: PENDING
        to: REJECTED
        trigger: "POST /yearbooks/submissions/{submissionId}/reject"
        actor: Staff
        preconditions: []
        side_effects:
          - "review_note stored"

      - from: APPROVED
        to: REJECTED
        trigger: "POST /yearbooks/submissions/{submissionId}/reject"
        actor: Staff
        preconditions:
          - "parent LadderPage.status in {DRAFT, IN_REVIEW, CHANGES_REQUESTED} (ERR_PAGE_LOCKED_FOR_SUBMISSIONS)"
        side_effects:
          - "LadderPage.approved_submission_count -= 1 (recomputed)"
        note: "Compensation — un-approving an asset restores the page's deficit"

      - from: REJECTED
        to: PENDING
        trigger: "POST /yearbooks/submissions/{submissionId}/resubmit"
        actor: Contributor
        preconditions:
          - "parent LadderPage.status in {DRAFT, IN_REVIEW, CHANGES_REQUESTED} (ERR_PAGE_LOCKED_FOR_SUBMISSIONS)"
        side_effects: []
        note: "Revision loop — contributor re-submits a corrected asset"

  - entity: AdContract
    initial_state: DRAFT
    terminal_states: [VOIDED, PLACED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /yearbooks/ad-contracts/{contractId}/sign"
        actor: SalesRep
        preconditions:
          - "the referenced LadderPage.section == ADS (ERR_AD_PAGE_NOT_ADS_SECTION)"
        side_effects:
          - "Recompute Yearbook.ad_revenue_cents (+= net_price_cents)"

      - from: SIGNED
        to: PLACED
        trigger: "POST /yearbooks/ad-contracts/{contractId}/place"
        actor: SalesRep
        preconditions:
          - "the referenced LadderPage.status == APPROVED (ERR_AD_PAGE_NOT_APPROVED)"
        side_effects: []

      - from: DRAFT
        to: VOIDED
        trigger: "POST /yearbooks/ad-contracts/{contractId}/void"
        actor: SalesRep
        preconditions: []
        side_effects: []

      - from: SIGNED
        to: VOIDED
        trigger: "POST /yearbooks/ad-contracts/{contractId}/void"
        actor: SalesRep
        preconditions: []
        side_effects:
          - "Compensation — recompute Yearbook.ad_revenue_cents (-= net_price_cents), restoring it to the pre-sign value"

  - entity: Proof
    initial_state: OPEN
    terminal_states: [PLANT_APPROVED]
    transitions:
      - from: OPEN
        to: CHANGES_REQUESTED
        trigger: "POST /yearbooks/proofs/{proofId}/request-changes"
        actor: Adviser
        preconditions: []
        side_effects: []

      - from: CHANGES_REQUESTED
        to: OPEN
        trigger: "POST /yearbooks/proofs/{proofId}/reopen"
        actor: Adviser
        preconditions: []
        side_effects: []
        note: "Revision loop — proof round reopened after corrections"

      - from: OPEN
        to: PLANT_SUBMITTED
        trigger: "POST /yearbooks/proofs/{proofId}/submit-plant"
        actor: Adviser
        preconditions:
          - "Yearbook.ladder_complete == true (ERR_LADDER_INCOMPLETE)"
          - "every LadderPage on the Yearbook is in APPROVED (ERR_PAGES_NOT_ALL_APPROVED)"
        side_effects:
          - "Cascade: every APPROVED LadderPage on the Yearbook transitions APPROVED -> LOCKED"
          - "Recompute Yearbook.production_phase (-> PLANT)"

      - from: PLANT_SUBMITTED
        to: PLANT_APPROVED
        trigger: "POST /yearbooks/proofs/{proofId}/approve-plant"
        actor: Adviser
        preconditions: []
        side_effects:
          - "Recompute Yearbook.production_phase (-> PRINTING)"

  - entity: PreSaleOrder
    initial_state: PLACED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PLACED
        to: PAID
        trigger: "POST /yearbooks/presale-orders/{orderId}/pay"
        actor: SalesRep
        preconditions: []
        side_effects:
          - "Recompute Yearbook.presale_revenue_cents (+= total_price_cents)"

      - from: PAID
        to: FULFILLED
        trigger: "system (automatic) — when a PrintRun on the Yearbook transitions SHIPPED -> DELIVERED"
        actor: system
        preconditions: []
        side_effects:
          - "Create a DistributionRecord copying buyer_name and quantity"

      - from: PLACED
        to: CANCELLED
        trigger: "POST /yearbooks/presale-orders/{orderId}/cancel"
        actor: SalesRep
        preconditions: []
        side_effects: []

      - from: PAID
        to: CANCELLED
        trigger: "POST /yearbooks/presale-orders/{orderId}/cancel"
        actor: SalesRep
        preconditions:
          - "no PrintRun on the Yearbook is in SHIPPED or DELIVERED (ERR_ALREADY_DISTRIBUTED)"
        side_effects:
          - "Compensation — recompute Yearbook.presale_revenue_cents (-= total_price_cents), restoring it to the pre-pay value"

  - entity: PrintRun
    initial_state: COMMITTED
    terminal_states: [DELIVERED]
    transitions:
      - from: COMMITTED
        to: SHIPPED
        trigger: "POST /yearbooks/print-runs/{printRunId}/ship"
        actor: Adviser
        preconditions: []
        side_effects: []

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /yearbooks/print-runs/{printRunId}/deliver"
        actor: Adviser
        preconditions: []
        side_effects:
          - "Cascade: every PAID PreSaleOrder on the Yearbook transitions PAID -> FULFILLED"
          - "Each FULFILLED order creates a DistributionRecord (recipient_name, copies_handed from the order)"
          - "Recompute Yearbook.production_phase (-> DELIVERED)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: print-run-commit-stale-yearbook
    parent_entity: Yearbook
    write_endpoint: "POST /yearbooks/print-runs"
    occ_field: "expected_yearbook_version"
    description: |
      Committing a PrintRun against a Yearbook whose version has advanced since the
      client last observed it is rejected on a stale version. This captures the case
      where another writer has already committed the (single) authoritative print run
      — which legitimately advances the Yearbook into PRINTING and bumps its version —
      and the current writer's view of the Yearbook is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ad_pricing
    trigger: "AdContract creation; recomputed on no further event (price is fixed at create from size + discount_pct)"
    algorithm: tiered_pricing
    formula: |
      # list_price by size tier (cents)
      list_price_cents = AD_SIZE_PRICE_CENTS[size]            # FULL=40000, HALF=24000, QUARTER=14000
      # discount applied to list price, then rounded to whole cents.
      # ROUNDING ORDER IS PINNED: apply discount to the integer list price, then
      # round_half_up to a whole cent in ONE step. Do NOT round list_price first.
      raw = list_price_cents * (1 - discount_pct)
      net_price_cents = round_half_up(raw)                    # single rounding step
    input_set: "single AdContract; no aggregation"
    constants:
      AD_SIZE_PRICE_CENTS: { FULL: 40000, HALF: 24000, QUARTER: 14000 }
    precision: "whole cents, round_half_up, single rounding step (combinatorial mode (b): rounding order pinned)"

  - name: presale_price
    trigger: "PreSaleOrder creation"
    algorithm: tiered_pricing
    formula: |
      # price_tier from order time vs the Yearbook pre-sale window (boundary pinned):
      #   ordered_at_iso <  presale_open_iso                       -> REJECT ERR_PRESALE_NOT_OPEN
      #   presale_open_iso <= ordered_at_iso < presale_close_iso   -> EARLY
      #   ordered_at_iso >= presale_close_iso                      -> STANDARD
      base_cents   = EARLY_BASE_CENTS if price_tier == EARLY else STANDARD_BASE_CENTS  # 6500 / 8000
      stamp_cents  = STAMP_FEE_CENTS if personalize else 0                              # 500 per copy
      per_copy     = base_cents + stamp_cents
      gross        = per_copy * quantity
      # bulk discount: 10% off gross ONLY when quantity >= BULK_QTY_THRESHOLD (>= 5)
      discount     = round_half_up(gross * BULK_DISCOUNT_PCT) if quantity >= BULK_QTY_THRESHOLD else 0
      total_price_cents = gross - discount
    input_set: "single PreSaleOrder; tier from order time vs Yearbook window"
    constants:
      EARLY_BASE_CENTS: 6500
      STANDARD_BASE_CENTS: 8000
      STAMP_FEE_CENTS: 500
      BULK_QTY_THRESHOLD: 5
      BULK_DISCOUNT_PCT: 0.10
    precision: "whole cents, round_half_up (combinatorial mode (a): >=3 inputs base/stamp/quantity with conditional bulk branch)"

  - name: production_cost
    trigger: "PrintRun commit (snapshotted onto PrintRun.cost_cents and mirrored onto Yearbook.production_cost_cents)"
    algorithm: aggregation
    formula: |
      # Cost the plant charges to print `quantity` copies of a `target_page_count`-page book.
      # PAGE-SURCHARGE TIER is non-linear in page count:
      pages = Yearbook.target_page_count
      surcharge_per_copy = 0
      if pages > BASE_PAGE_ALLOWANCE:                     # allowance = 96 pages
        extra_signatures = ceil((pages - BASE_PAGE_ALLOWANCE) / PAGES_PER_SIGNATURE)   # 4 pages/signature
        surcharge_per_copy = extra_signatures * SIGNATURE_SURCHARGE_CENTS              # 800 per extra signature
      per_copy_cost = Yearbook.unit_cost_cents + surcharge_per_copy
      production_cost_cents = per_copy_cost * PrintRun.quantity
    input_set: "single Yearbook + the committed PrintRun.quantity"
    constants:
      BASE_PAGE_ALLOWANCE: 96
      PAGES_PER_SIGNATURE: 4
      SIGNATURE_SURCHARGE_CENTS: 800
    precision: "whole cents, exact integer arithmetic"
    variants:
      - name: estimated_cost
        when: "read via GET /yearbooks/{id}/cost-estimate before any PrintRun exists; uses presale_revenue's implied quantity = sum of quantity over PLACED+PAID orders"
        difference: "quantity input is the projected demand (sum of quantity over PreSaleOrders in {PLACED, PAID}); forward-looking estimate"
      - name: committed_cost
        when: "computed at PrintRun commit and frozen onto PrintRun.cost_cents"
        difference: "quantity input is the explicit committed PrintRun.quantity; this is the authoritative figure and need not equal the estimate"

  - name: ladder_fill
    trigger: "LadderPage create/delete; Submission approve/reject; page approve"
    algorithm: aggregation
    formula: |
      ladder_filled_count    = count(LadderPage where yearbook_id == Yearbook.id)
      ladder_complete        = (ladder_filled_count == Yearbook.target_page_count)
      approved_submission_count(page) = count(Submission where ladder_page_id == page.id and status == APPROVED)
      assigned_page_count(assignment) = count(LadderPage where assigned_staff_id == assignment.id)
    input_set: "LadderPages and Submissions scoped to one Yearbook"
    precision: "exact integer counts"

  - name: production_phase
    trigger: "any LadderPage / Proof / PrintRun transition that changes derived posture"
    algorithm: derived
    formula: |
      if exists PrintRun in {COMMITTED, SHIPPED, DELIVERED} with status == DELIVERED:
        production_phase = DELIVERED
      elif exists Proof in PLANT_APPROVED:
        production_phase = PRINTING
      elif exists Proof in PLANT_SUBMITTED:
        production_phase = PLANT
      elif ladder_complete and count(LadderPage where status == APPROVED) == ladder_filled_count and ladder_filled_count > 0:
        production_phase = PROOFING
      elif ladder_filled_count > 0 and exists LadderPage with status != DRAFT:
        production_phase = CONTENT
      else:
        production_phase = LADDER_BUILD
    input_set: "all LadderPages/Proofs/PrintRuns under one Yearbook"
    precision: "enum derivation; evaluated top-down, first match wins"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Referenced resources in the path exist, validated left-to-right (Yearbook, then LadderPage/Proof/etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "FK targets named in the body exist (ladder_page_id on AdContract, etc.)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /ad-contracts, POST /pages, page assignment"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges (e.g. quantity >= 1, discount_pct in 0..0.5, target_page_count > 0 and divisible by 4, stamp_name non-empty when personalize)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: state
    check: "OCC: expected_yearbook_version matches current Yearbook.version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /print-runs"

  - priority: 8
    category: business_temporal
    check: "Pre-sale order time is at-or-after presale_open_iso (window has opened)"
    error_id: ERR_PRESALE_NOT_OPEN
    http_status: 409
    applies_to: "POST /presale-orders"

  - priority: 9
    category: business_referential
    check: "AdContract's referenced LadderPage is in the ADS section"
    error_id: ERR_AD_PAGE_NOT_ADS_SECTION
    http_status: 409
    applies_to: "POST /ad-contracts/{id}/sign"

  - priority: 10
    category: business_safety
    check: "A LOCKED page cannot be reopened (request-changes) because the Yearbook has a Proof in PLANT_SUBMITTED/PLANT_APPROVED — the plant copy is frozen. (request-changes from APPROVED is allowed pre-plant; once plant-submitted the page is LOCKED and this guard returns ERR_PLANT_FROZEN.)"
    error_id: ERR_PLANT_FROZEN
    http_status: 409
    applies_to: "POST /yearbooks/pages/{id}/request-changes from LOCKED"

  - priority: 11
    category: business_constraint
    check: "Page cannot enter IN_REVIEW until approved_submission_count >= required_submission_count"
    error_id: ERR_SUBMISSIONS_INCOMPLETE
    http_status: 409
    applies_to: "POST /pages/{id}/submit-review, POST /pages/{id}/approve"

  - priority: 12
    category: business_constraint
    check: "Plant submission requires ladder_complete AND every LadderPage APPROVED"
    error_id: "ERR_LADDER_INCOMPLETE / ERR_PAGES_NOT_ALL_APPROVED"
    http_status: 409
    applies_to: "POST /proofs/{id}/submit-plant"

  - priority: 13
    category: business_temporal
    check: "Page spread_span occupation must not overlap another page's occupied page_numbers; page_number must be unique and within ladder bounds"
    error_id: "ERR_PAGE_NUMBER_CONFLICT / ERR_PAGE_NUMBER_OUT_OF_BOUNDS"
    http_status: 409
    applies_to: "POST /pages"

  - priority: 14
    category: business_referential
    check: "Staff cannot be assigned to a page outside the StaffAssignment's Yearbook, and a deadline that has already passed (deadline_iso < clock now) cannot be set on a new assignment"
    error_id: "ERR_DEADLINE_IN_PAST"
    http_status: 409
    applies_to: "POST /staff-assignments"

  - priority: 15
    category: business_constraint
    check: "A distributed (SHIPPED/DELIVERED) print run blocks cancelling a PAID order"
    error_id: ERR_ALREADY_DISTRIBUTED
    http_status: 409
    applies_to: "POST /presale-orders/{id}/cancel from PAID"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time. Drives presale window & deadline determinism."
    roles: [Adviser]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso: datetime }"
    side_effects: ["logical clock advanced to to_iso8601"]

  # ---- Yearbook (root) ----
  - method: POST
    path: "/yearbooks"
    description: "Create a Yearbook production project"
    roles: [Adviser]
    code: 201
    input: [school_name, academic_year, target_page_count, unit_cost_cents, presale_open_iso, presale_close_iso]
    output: Yearbook
    side_effects:
      - "production_phase=LADDER_BUILD; all derived counts/revenue=0; version=1"

  - method: GET
    path: "/yearbooks/{yearbookId}"
    description: "Get a Yearbook with all derived fields"
    roles: [Adviser, Staff, SalesRep, Contributor]
    code: 200
    input: []
    output: Yearbook
    side_effects: []

  - method: GET
    path: "/yearbooks"
    description: "List yearbooks (paginated)"
    roles: [Adviser, Staff, SalesRep, Contributor]
    code: 200
    input: ["limit?", "offset?"]
    output: Yearbook[]
    side_effects: []

  - method: GET
    path: "/yearbooks/{yearbookId}/cost-estimate"
    description: "Computed read: forward-looking production cost estimate using projected demand (sum of quantity over PreSaleOrders in {PLACED, PAID})"
    roles: [Adviser, SalesRep]
    code: 200
    input: []
    output: "{ estimated_quantity: integer, estimated_cost_cents: integer }"
    side_effects: []

  # ---- LadderPage (collection /yearbooks/pages) ----
  - method: POST
    path: "/yearbooks/pages"
    description: "Add a page to a yearbook's ladder"
    roles: [Adviser]
    code: 201
    input: [yearbook_id, page_number, section, template_code, "spread_span?", "required_submission_count?", "assigned_staff_id?"]
    output: LadderPage
    side_effects:
      - "status=DRAFT; recompute Yearbook.ladder_filled_count, ladder_complete, production_phase"

  - method: GET
    path: "/yearbooks/pages/{pageId}"
    description: "Get a ladder page"
    roles: [Adviser, Staff, SalesRep, Contributor]
    code: 200
    input: []
    output: LadderPage
    side_effects: []

  - method: GET
    path: "/yearbooks/pages"
    description: "List ladder pages (reverse-reachability for LadderPage.yearbook_id and assigned_staff_id)"
    roles: [Adviser, Staff, SalesRep, Contributor]
    code: 200
    input: ["yearbook_id?", "assigned_staff_id?", "limit?", "offset?"]
    output: LadderPage[]
    side_effects: []

  - method: POST
    path: "/yearbooks/pages/{pageId}/assign"
    description: "Assign a StaffAssignment to a page (sets assigned_staff_id)"
    roles: [Adviser]
    code: 200
    input: [staff_assignment_id]
    output: LadderPage
    side_effects:
      - "assigned_staff_id set; recompute StaffAssignment.assigned_page_count"

  - method: POST
    path: "/yearbooks/pages/{pageId}/submit-review"
    description: "Staff submits a page for adviser review (DRAFT/CHANGES_REQUESTED -> IN_REVIEW)"
    roles: [Staff]
    code: 200
    input: []
    output: LadderPage
    side_effects: ["status -> IN_REVIEW"]

  - method: POST
    path: "/yearbooks/pages/{pageId}/request-changes"
    description: "Adviser requests changes (IN_REVIEW/APPROVED -> CHANGES_REQUESTED)"
    roles: [Adviser]
    code: 200
    input: []
    output: LadderPage
    side_effects: ["status -> CHANGES_REQUESTED"]

  - method: POST
    path: "/yearbooks/pages/{pageId}/approve"
    description: "Adviser approves a page (IN_REVIEW -> APPROVED)"
    roles: [Adviser]
    code: 200
    input: []
    output: LadderPage
    side_effects: ["status -> APPROVED; recompute Yearbook.production_phase"]

  # ---- Submission (collection /yearbooks/submissions) ----
  - method: POST
    path: "/yearbooks/submissions"
    description: "Contributor submits a photo/quote to a page"
    roles: [Contributor]
    code: 201
    input: [ladder_page_id, kind, contributor_id, asset_ref]
    output: Submission
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/yearbooks/submissions/{submissionId}"
    description: "Get a submission"
    roles: [Adviser, Staff, Contributor]
    code: 200
    input: []
    output: Submission
    side_effects: []

  - method: GET
    path: "/yearbooks/submissions"
    description: "List submissions (reverse-reachability for Submission.ladder_page_id)"
    roles: [Adviser, Staff, Contributor]
    code: 200
    input: ["ladder_page_id?", "limit?", "offset?"]
    output: Submission[]
    side_effects: []

  - method: POST
    path: "/yearbooks/submissions/{submissionId}/approve"
    description: "Staff approves a submission (PENDING -> APPROVED)"
    roles: [Staff]
    code: 200
    input: ["review_note?"]
    output: Submission
    side_effects: ["status -> APPROVED; recompute LadderPage.approved_submission_count"]

  - method: POST
    path: "/yearbooks/submissions/{submissionId}/reject"
    description: "Staff rejects a submission (PENDING/APPROVED -> REJECTED)"
    roles: [Staff]
    code: 200
    input: ["review_note?"]
    output: Submission
    side_effects: ["status -> REJECTED; if was APPROVED, recompute LadderPage.approved_submission_count (decrement)"]

  - method: POST
    path: "/yearbooks/submissions/{submissionId}/resubmit"
    description: "Contributor resubmits a rejected asset (REJECTED -> PENDING)"
    roles: [Contributor]
    code: 200
    input: ["asset_ref?"]
    output: Submission
    side_effects: ["status -> PENDING"]

  # ---- StaffAssignment (collection /yearbooks/staff-assignments) ----
  - method: POST
    path: "/yearbooks/staff-assignments"
    description: "Create a staff assignment with role & deadline"
    roles: [Adviser]
    code: 201
    input: [yearbook_id, staff_user_id, role_title, deadline_iso]
    output: StaffAssignment
    side_effects: ["status=ACTIVE; assigned_page_count=0"]

  - method: GET
    path: "/yearbooks/staff-assignments/{assignmentId}"
    description: "Get a staff assignment"
    roles: [Adviser, Staff]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []

  - method: GET
    path: "/yearbooks/staff-assignments"
    description: "List staff assignments (reverse-reachability for StaffAssignment.yearbook_id)"
    roles: [Adviser, Staff]
    code: 200
    input: ["yearbook_id?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []

  - method: POST
    path: "/yearbooks/staff-assignments/{assignmentId}/release"
    description: "Release (deactivate) a staff assignment (ACTIVE -> RELEASED)"
    roles: [Adviser]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["status -> RELEASED"]

  # ---- AdContract (collection /yearbooks/ad-contracts) ----
  - method: POST
    path: "/yearbooks/ad-contracts"
    description: "Create an ad/sponsor contract for an ADS-section page"
    roles: [SalesRep]
    code: 201
    input: [yearbook_id, ladder_page_id, sponsor_name, size, "discount_pct?"]
    output: AdContract
    side_effects: ["status=DRAFT; compute list_price_cents, net_price_cents"]

  - method: GET
    path: "/yearbooks/ad-contracts/{contractId}"
    description: "Get an ad contract"
    roles: [Adviser, SalesRep]
    code: 200
    input: []
    output: AdContract
    side_effects: []

  - method: GET
    path: "/yearbooks/ad-contracts"
    description: "List ad contracts (reverse-reachability for AdContract.yearbook_id and ladder_page_id)"
    roles: [Adviser, SalesRep]
    code: 200
    input: ["yearbook_id?", "ladder_page_id?", "limit?", "offset?"]
    output: AdContract[]
    side_effects: []

  - method: POST
    path: "/yearbooks/ad-contracts/{contractId}/sign"
    description: "Sign an ad contract (DRAFT -> SIGNED)"
    roles: [SalesRep]
    code: 200
    input: []
    output: AdContract
    side_effects: ["status -> SIGNED; recompute Yearbook.ad_revenue_cents (+= net_price_cents)"]

  - method: POST
    path: "/yearbooks/ad-contracts/{contractId}/place"
    description: "Place a signed ad contract once its page is approved (SIGNED -> PLACED)"
    roles: [SalesRep]
    code: 200
    input: []
    output: AdContract
    side_effects: ["status -> PLACED"]

  - method: POST
    path: "/yearbooks/ad-contracts/{contractId}/void"
    description: "Void an ad contract (DRAFT/SIGNED -> VOIDED)"
    roles: [SalesRep]
    code: 200
    input: []
    output: AdContract
    side_effects: ["status -> VOIDED; if was SIGNED, recompute Yearbook.ad_revenue_cents (-= net_price_cents)"]

  # ---- Proof (collection /yearbooks/proofs) ----
  - method: POST
    path: "/yearbooks/proofs"
    description: "Open a new proof round"
    roles: [Adviser]
    code: 201
    input: [yearbook_id, "reviewer_note?"]
    output: Proof
    side_effects: ["status=OPEN; round_number assigned (max existing + 1)"]

  - method: GET
    path: "/yearbooks/proofs/{proofId}"
    description: "Get a proof round"
    roles: [Adviser, Staff]
    code: 200
    input: []
    output: Proof
    side_effects: []

  - method: GET
    path: "/yearbooks/proofs"
    description: "List proof rounds (reverse-reachability for Proof.yearbook_id)"
    roles: [Adviser, Staff]
    code: 200
    input: ["yearbook_id?", "limit?", "offset?"]
    output: Proof[]
    side_effects: []

  - method: POST
    path: "/yearbooks/proofs/{proofId}/request-changes"
    description: "Adviser requests changes on a proof (OPEN -> CHANGES_REQUESTED)"
    roles: [Adviser]
    code: 200
    input: ["reviewer_note?"]
    output: Proof
    side_effects: ["status -> CHANGES_REQUESTED"]

  - method: POST
    path: "/yearbooks/proofs/{proofId}/reopen"
    description: "Adviser reopens a proof after corrections (CHANGES_REQUESTED -> OPEN)"
    roles: [Adviser]
    code: 200
    input: []
    output: Proof
    side_effects: ["status -> OPEN"]

  - method: POST
    path: "/yearbooks/proofs/{proofId}/submit-plant"
    description: "Submit the proof to the plant (OPEN -> PLANT_SUBMITTED); cascades approved pages to LOCKED"
    roles: [Adviser]
    code: 200
    input: []
    output: Proof
    side_effects:
      - "status -> PLANT_SUBMITTED"
      - "Cascade: every APPROVED LadderPage on the Yearbook -> LOCKED"
      - "recompute Yearbook.production_phase (-> PLANT)"

  - method: POST
    path: "/yearbooks/proofs/{proofId}/approve-plant"
    description: "Plant approves the submitted proof (PLANT_SUBMITTED -> PLANT_APPROVED)"
    roles: [Adviser]
    code: 200
    input: []
    output: Proof
    side_effects: ["status -> PLANT_APPROVED; recompute Yearbook.production_phase (-> PRINTING)"]

  # ---- PreSaleOrder (collection /yearbooks/presale-orders) ----
  - method: POST
    path: "/yearbooks/presale-orders"
    description: "Place a pre-sale order (with optional name-stamp personalization)"
    roles: [SalesRep]
    code: 201
    input: [yearbook_id, buyer_name, quantity, "personalize?", "stamp_name?"]
    output: PreSaleOrder
    side_effects:
      - "ordered_at_iso = clock now; status=PLACED; compute price_tier, total_price_cents"

  - method: GET
    path: "/yearbooks/presale-orders/{orderId}"
    description: "Get a pre-sale order"
    roles: [Adviser, SalesRep]
    code: 200
    input: []
    output: PreSaleOrder
    side_effects: []

  - method: GET
    path: "/yearbooks/presale-orders"
    description: "List pre-sale orders (reverse-reachability for PreSaleOrder.yearbook_id)"
    roles: [Adviser, SalesRep]
    code: 200
    input: ["yearbook_id?", "limit?", "offset?"]
    output: PreSaleOrder[]
    side_effects: []

  - method: POST
    path: "/yearbooks/presale-orders/{orderId}/pay"
    description: "Mark a pre-sale order paid (PLACED -> PAID)"
    roles: [SalesRep]
    code: 200
    input: []
    output: PreSaleOrder
    side_effects: ["status -> PAID; recompute Yearbook.presale_revenue_cents (+= total_price_cents)"]

  - method: POST
    path: "/yearbooks/presale-orders/{orderId}/cancel"
    description: "Cancel a pre-sale order (PLACED/PAID -> CANCELLED)"
    roles: [SalesRep]
    code: 200
    input: []
    output: PreSaleOrder
    side_effects: ["status -> CANCELLED; if was PAID, recompute Yearbook.presale_revenue_cents (-= total_price_cents)"]

  # ---- PrintRun (collection /yearbooks/print-runs) ----
  - method: POST
    path: "/yearbooks/print-runs"
    description: "Commit the authoritative print run (OCC-guarded on Yearbook.version)"
    roles: [Adviser]
    code: 201
    input: [yearbook_id, quantity, delivery_address, expected_yearbook_version]
    output: PrintRun
    side_effects:
      - "status=COMMITTED; compute cost_cents (production_cost); mirror Yearbook.production_cost_cents"
      - "increments Yearbook.version by 1"

  - method: GET
    path: "/yearbooks/print-runs/{printRunId}"
    description: "Get a print run"
    roles: [Adviser]
    code: 200
    input: []
    output: PrintRun
    side_effects: []

  - method: GET
    path: "/yearbooks/print-runs"
    description: "List print runs (reverse-reachability for PrintRun.yearbook_id)"
    roles: [Adviser]
    code: 200
    input: ["yearbook_id?", "limit?", "offset?"]
    output: PrintRun[]
    side_effects: []

  - method: POST
    path: "/yearbooks/print-runs/{printRunId}/ship"
    description: "Mark a print run shipped (COMMITTED -> SHIPPED)"
    roles: [Adviser]
    code: 200
    input: []
    output: PrintRun
    side_effects: ["status -> SHIPPED"]

  - method: POST
    path: "/yearbooks/print-runs/{printRunId}/deliver"
    description: "Mark a print run delivered (SHIPPED -> DELIVERED); cascades PAID orders to FULFILLED + distribution"
    roles: [Adviser]
    code: 200
    input: []
    output: PrintRun
    side_effects:
      - "status -> DELIVERED"
      - "Cascade: every PAID PreSaleOrder -> FULFILLED, each creating a DistributionRecord"
      - "recompute Yearbook.production_phase (-> DELIVERED)"

  # ---- DistributionRecord (collection /yearbooks/distribution-records) ----
  - method: GET
    path: "/yearbooks/distribution-records/{recordId}"
    description: "Get a distribution record"
    roles: [Adviser, SalesRep]
    code: 200
    input: []
    output: DistributionRecord
    side_effects: []

  - method: GET
    path: "/yearbooks/distribution-records"
    description: "List distribution records (reverse-reachability for DistributionRecord.yearbook_id and presale_order_id)"
    roles: [Adviser, SalesRep]
    code: 200
    input: ["yearbook_id?", "presale_order_id?", "limit?", "offset?"]
    output: DistributionRecord[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body-referenced FK target (ladder_page_id, staff_assignment_id) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range number, or stamp_name empty while personalize=true" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_yearbook_version does not match current Yearbook.version on a guarded write" }
  - { id: ERR_PRESALE_NOT_OPEN, http: 409, condition: "Pre-sale order placed before presale_open_iso" }
  - { id: ERR_AD_PAGE_NOT_ADS_SECTION, http: 409, condition: "Ad contract references a LadderPage whose section is not ADS" }
  - { id: ERR_AD_PAGE_NOT_APPROVED, http: 409, condition: "Placing an ad contract whose referenced LadderPage is not APPROVED" }
  - { id: ERR_PLANT_FROZEN, http: 409, condition: "request-changes on a LOCKED page while the Yearbook has a PLANT_SUBMITTED/PLANT_APPROVED proof (plant copy frozen)" }
  - { id: ERR_SUBMISSIONS_INCOMPLETE, http: 409, condition: "Page lacks enough APPROVED submissions to enter review/approval" }
  - { id: ERR_PAGE_UNASSIGNED, http: 409, condition: "Page submitted for review without an ACTIVE assigned staff member" }
  - { id: ERR_PAGE_LOCKED_FOR_SUBMISSIONS, http: 409, condition: "Submission approve/reject/resubmit attempted while parent page is APPROVED or LOCKED" }
  - { id: ERR_LADDER_INCOMPLETE, http: 409, condition: "Plant submission attempted while ladder_filled_count < target_page_count" }
  - { id: ERR_PAGES_NOT_ALL_APPROVED, http: 409, condition: "Plant submission attempted while some LadderPage is not APPROVED" }
  - { id: ERR_PAGE_NUMBER_CONFLICT, http: 409, condition: "New page's occupied page_numbers (page_number .. page_number+spread_span-1) overlap an existing page" }
  - { id: ERR_PAGE_NUMBER_OUT_OF_BOUNDS, http: 409, condition: "page_number or its spread exceeds 1..target_page_count" }
  - { id: ERR_DEADLINE_IN_PAST, http: 409, condition: "StaffAssignment deadline_iso is earlier than the current logical clock" }
  - { id: ERR_ALREADY_DISTRIBUTED, http: 409, condition: "Cancelling a PAID order after a print run reached SHIPPED/DELIVERED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Adviser
    description: "Yearbook faculty adviser; owns the ladder, staff assignments, proof/plant flow, and print/delivery lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /yearbooks — create yearbook"
      - "POST /yearbooks/{id}/pages — add ladder page"
      - "POST /yearbooks/{id}/pages/{id}/assign — assign staff to page"
      - "POST /yearbooks/{id}/pages/{id}/request-changes — request page changes"
      - "POST /yearbooks/{id}/pages/{id}/approve — approve page"
      - "POST /yearbooks/{id}/staff-assignments — create staff assignment"
      - "POST /yearbooks/{id}/staff-assignments/{id}/release — release assignment"
      - "POST /yearbooks/{id}/proofs (+ request-changes/reopen/submit-plant/approve-plant) — proof & plant flow"
      - "POST /yearbooks/{id}/print-runs (+ ship/deliver) — print run & delivery"
