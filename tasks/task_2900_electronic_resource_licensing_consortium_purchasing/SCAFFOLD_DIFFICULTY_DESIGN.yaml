  - rule_id: resource_temporal_overlap
    instances:
      - name: second_trial_starting_inside_the_cooldown_buffer_is_rejected
        grounds:
          - validations.priority_16_ERR_TRIAL_WINDOW_CONFLICT
          - errors.ERR_TRIAL_WINDOW_CONFLICT
          - entities.Trial.fields.start_date
          - entities.Trial.fields.end_date
          - global_constants.TRIAL_COOLDOWN_DAYS
        distinguishing_aspect: |
          Resource: the (product, member) trial slot, with half-open [start_date, end_date) windows
          plus a forward TRIAL_COOLDOWN_DAYS buffer on the existing window's end. The existing trial ran
          [2026-08-01, 2026-08-31), so its buffered end is 2026-09-30; a new window starting 2026-09-29
          is still inside the buffer and overlaps, while a start of 2026-09-30 would be accepted. Pure
          interval arithmetic on one entity's own windows - no aggregate capacity involved.
        test_recipe:
          setup:
            - "Vendor, Product Atlas Humanities Collection and Member Alpha College."
            - "Alpha holds one trial on that product for [2026-08-01, 2026-08-31) in DRAFT - the conflict check counts DRAFT rows too."
            - "The new request asks for [2026-09-29, 2026-10-29): 2026-09-29 < 2026-08-31 + 30 days = 2026-09-30 and 2026-08-01 < 2026-10-29, so both halves of the overlap test are satisfied."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Humanities Collection", base_list_price_cents: 10000000, title_count: 400, inflation_cap_pct: 5.00, cancellation_notice_days: 90, perpetual_access_mode_offered: "FULL_ARCHIVE", ill_mode_offered: "SECURE_ELECTRONIC", text_mining_offered: true, tier_bands: [{ min_participants: 1, discount_pct: 0 }, { min_participants: 3, discount_pct: 10 }, { min_participants: 5, discount_pct: 20 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { product_id: $.data.id }
            - call: "POST /erm/members"
              payload: { name: "Alpha College", fte_count: 4000, carnegie_class: "BACCALAUREATE", budget_ceiling_cents: 9000000 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { m_a_id: $.data.id }
            - call: "POST /erm/products/${product_id}/trials"
              payload: { member_id: "${m_a_id}", start_date: "2026-08-01", end_date: "2026-08-31", criteria: [{ code: "CONTENT_FIT", weight_pct: 100 }] }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { trial_1_id: $.data.id }
          trigger:
            - call: "POST /erm/products/${product_id}/trials"
              payload: { member_id: "${m_a_id}", start_date: "2026-09-29", end_date: "2026-10-29", criteria: [{ code: "CONTENT_FIT", weight_pct: 100 }] }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "response status == 409"
            - "${err} == ERR_TRIAL_WINDOW_CONFLICT"
            - "Trial.${trial_1_id}.status == DRAFT"
            - "only one Trial row exists on (${product_id}, ${m_a_id})"
      - name: fourth_overlapping_binding_on_one_realm_exceeds_realm_capacity
        grounds:
          - validations.priority_17_ERR_REALM_CAPACITY_EXCEEDED
          - errors.ERR_REALM_CAPACITY_EXCEEDED
          - entities.AuthConfig.fields.auth_realm_code
          - entities.AuthConfig.fields.verification_status
          - global_constants.MAX_OVERLAPPING_REALM_BINDINGS
        distinguishing_aspect: |
          Resource: the shared federation realm SHIB-EDU-1, an aggregate capacity of
          MAX_OVERLAPPING_REALM_BINDINGS = 3 measured over CLOSED subscription windows
          [activation_start_date, term_end] rather than half-open trial windows, and across a different
          entity (AuthConfig). Each of the three existing PENDING bindings is individually legal; only
          their simultaneous overlap with the fourth window makes the fourth binding illegal, so the
          failure is aggregate rather than pairwise.
        test_recipe:
