            - "After call 1: EquipmentAsset.${isolette_a}.decontamination_ready_at == 2026-08-02T12:45:00Z"
            - "After call 2: TransportRun.${run_f2}.status == AIR_LAUNCHED and decontamination_minutes == 90"
            - "After call 2: EquipmentAsset.${isolette_a}.decontamination_ready_at == 2026-08-02T19:30:00Z"
            - "After calls 3 and 4: both runs have status == ON_SCENE — the two branches join on one state"
            - "The GROUND branch never required weather_minimums_met (it was created false and dispatched successfully)"

  - rule_id: transitive_cascade
    instances:

      - name: equipment_out_of_service_cascades_to_transport_abort
        grounds:
          - endpoints[POST /equipment-assets/{asset_id}/out-of-service]
          - calculations.capability_level
          - calculations.effective_level
          - state_machines.Referral.capability_loss_divert
          - state_machines.TransportRun.abort
          - state_machines.Admission.capability_loss_requires_back_transfer
        distinguishing_aspect: |
          Depth 4, each link caused by the previous one and not by the trigger:
          asset -> OUT_OF_SERVICE causes the unit's capability_level to fall to
          LEVEL_II, which causes the LEVEL_III referral to be DIVERTED and its
          hold RELEASED, which causes the transport run standing on that hold to
          be ABORTED. The run is unreachable from the asset except through the
          unit's recomputed level and the referral's divert.
        test_recipe:
          setup:
            - "Prelude as above, plus the TRANSPORT_ISOLETTE asset."
            - "Regional NICU A is PROVISIONAL at LEVEL_III with capability_level LEVEL_III (NEO_BOARD + RN_NICU_CORE, CONVENTIONAL_VENT + HFOV)."
            - "One admission occupies a bed with current_care_level LEVEL_III (1200 g)."
            - "A second referral requiring LEVEL_III is ACCEPTED, holding a bed, and an ACTIVATED GROUND transport run stands on that hold."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - *k_isolette
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-E1", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_e1: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_e1: $.data.version }
            - call: "POST /referrals/${ref_e1}/accept"
              payload: { expected_unit_version: "${v_e1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_e1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_e1: $.data.id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-E2", gestational_age_weeks: 30.0, birth_weight_grams: 1250, support_modality: "HFOV" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_e2: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_e2: $.data.version }
            - call: "POST /referrals/${ref_e2}/accept"
              payload: { expected_unit_version: "${v_e2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { res_e2: $.data.reservation_id }
            - call: "POST /transport-runs"
              payload: { reservation_id: "${res_e2}", isolette_asset_id: "${isolette_a}", mode: "GROUND", crew_composition: ["TRANSPORT_RN", "NNP"], depart_at: "2026-08-02T08:00:00Z", planned_return_at: "2026-08-02T12:00:00Z", weather_minimums_met: false }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { run_e2: $.data.id }
          trigger:
            - call: "POST /equipment-assets/${hfov_a}/out-of-service"
              payload: { reason: "BIOMED_FAULT" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
          assert:
            - "Link 1: EquipmentAsset.${hfov_a}.status == OUT_OF_SERVICE and out_of_service_at == 2026-08-01T00:00:00Z"
            - "Link 2: NicuUnit.${unit_a}.equipment_compliant == false, capability_level == LEVEL_II, effective_level == LEVEL_II, designation_status == CONDITIONAL"
            - "Link 3: Referral.${ref_e2}.status == DIVERTED with decision_reason == CAPABILITY_LOST"
            - "Link 3: BedReservation.${res_e2}.status == RELEASED with released_reason == CAPABILITY_LOST"
            - "Link 4: TransportRun.${run_e2}.status == ABORTED with abort_reason == CAPABILITY_LOST"
            - "Side branch: Admission.${adm_e1}.care_status == BACK_TRANSFER_REQUIRED (current_care_level LEVEL_III now exceeds effective_level LEVEL_II)"
            - "NicuUnit.${unit_a}.held_bed_count == 0, occupied_bed_count == 1, available_bed_count == 3"
            - "Referral.${ref_e1}.status == COMPLETED — terminal referrals are untouched by the cascade"

      - name: back_transfer_admission_cascades_to_queue_promotion
        grounds:
          - endpoints[POST /admissions]
          - state_machines.Referral.complete
          - state_machines.Admission.back_transfer_completed
          - calculations.bed_ledger
          - calculations.deferral_promotion_order
          - state_machines.Referral.promote
        distinguishing_aspect: |
          Depth 4 from a completely different trigger (POST /admissions at the
          community hospital, not an equipment event): the new admission
          completes the BACK_TRANSFER referral, which transfers the source
          admission, which frees the regional unit's bed, which promotes the
          top-ranked DEFERRED referral into ACCEPTED with a fresh hold. The
          promotion is two units away from the endpoint's own unit.
        test_recipe:
          setup:
            - "Prelude as above."
            - "Regional NICU A's staffed_bed_target has been reduced to 1 under OCC and its single bed is occupied by a BACK_TRANSFER_READY admission (1200 g at birth, 1900 g now, room air, developmental bundle 60.00)."
            - "A BACK_TRANSFER referral from that admission to Community Hospital B has been accepted at Community Hospital B, holding one of its 6 beds."
            - "A second referral to Regional NICU A requiring LEVEL_II has been DEFERRED because no bed was available."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-T1", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_t1: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_t1: $.data.version }
            - call: "POST /referrals/${ref_t1}/accept"
              payload: { expected_unit_version: "${v_t1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_t1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_t1: $.data.id }
            - call: "POST /admissions/${adm_t1}/care-updates"
              payload: { current_weight_grams: 1900, support_modality: "ROOM_AIR", central_line_present: false, ventilated: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_t1}/developmental-rounds"
              payload: { kangaroo_care_minutes: 60, family_presence_minutes: 240, cluster_care_compliant: true, light_cycling_compliant: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_t1}/developmental-rounds"
              payload: { kangaroo_care_minutes: 60, family_presence_minutes: 240, cluster_care_compliant: true, light_cycling_compliant: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_t1}/back-transfer-ready"
              payload: { back_transfer_attestation_note: "1900 g, room air, full feeds — community level appropriate" }
