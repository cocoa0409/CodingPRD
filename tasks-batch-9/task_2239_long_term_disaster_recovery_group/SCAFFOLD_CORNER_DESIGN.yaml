      - name: corner_cascading_side_effects_layer_is_covered_by_the_award_ledger_chain
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / award_cascades_commitment_to_case_ledger_to_funding_status_to_case_status
          rationale: "The §1.8 transitive_cascade instance already drives the full four-level chain end to end - AWARD writes FundingCommitment.status and MemberOrganization.committed_cents, then RecoveryCase.total_committed_cents, then the derived funding_status, then case_status - and asserts every intermediate hop in order from a single response plus follow-up reads. Its sibling instances additionally cover ordering sensitivity (the bridge tier keyed on the pinned assessment rather than on the running award) and reversal (rescind and reverse restoring every hop). A separate §1.9 instance would restate the same call sequence with the same assertions."
      - name: corner_dual_variant_calculation_layer_is_covered_by_the_assessment_variant_divergence
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / unmet_need_purpose_matched_vs_pooled_diverge_by_600000
          rationale: "The §1.8 dual_variant_calc instance runs both UnmetNeedAssessment variants over one identical damage-and-assistance dataset and pins the 600000 divergence plus each variant's per-bucket breakdown, and the second dual-variant instance does the same for the deployment skill-fit variants. Delta-on-switch is covered there too, because the table award is keyed on the pinned assessment, so re-pinning the other variant moves the bridge tier. A §1.9 instance here would duplicate those fixtures verbatim."
  - section: consistency_model
    instances:
      - name: corner_every_derived_figure_is_already_present_in_the_response_that_caused_it
        claim_type: immediate
        grounds: ["complexity_profile[consistency_model]", "calculations.table_award_assembly", "calculations.case_funding_status_derivation", "calculations.restricted_fund_waterfall", "endpoints[POST /case-presentations/{id}/decision]", "endpoints[POST /disbursements/{id}/approve]"]
        distinguishing_aspect: "Each mutating response carries its own derived figures and every immediately following read already agrees with it - no second call, no delay, no reconciliation pass. The AWARD response itself reports bridge_tier, bridge_authorized_cents, awarded_cents and shortfall_cents while the very next GET of the case already shows total_committed_cents and the re-derived funding_status; the approve response carries the allocation lines, net and gross while the very next GET of the funding source already shows committed_cents and status EXHAUSTED. An implementation that computes derived fields lazily on read, or defers ledger updates to a background pass, produces a response body that disagrees with the immediately following read."
        test_recipe:
          setup:
            - "Case with a STRUCTURE item verified at 1000000 and a PURPOSE_MATCHED assessment of 1000000."
