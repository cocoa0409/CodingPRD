              as: SalesManager
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { opp_v_a: $.data.version }
            - call: "POST /room-block-commitments"
              payload: { opportunity_id: "${opp_id}", hotel_id: "${hotel_b_id}", rooms_peak_invited: 300, expected_opportunity_version: "${opp_v_a}" }
              as: SalesManager
              captures: { c_alpha_id: $.data.id }
            - call: "POST /room-block-commitments/${c_alpha_id}/offer"
              payload: { rooms_peak_offered: 300, rate_offered_amount: 209.77, cutoff_days_before_arrival: 30 }
              as: HotelPartner
