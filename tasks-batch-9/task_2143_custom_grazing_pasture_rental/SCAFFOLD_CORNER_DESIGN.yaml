            - call: "GET /grazing/pastures/${p1}"
              payload: {}
              as: Grazier
              as_user_id: "${g1}"
          assert:
            - "GrazingContract.${k1}.committed_head_days == 13800"
            - "Pasture.${p1}.committed_head_days == 13800"
            - "Pasture.${p1}.capacity_utilization_pct == 66.45"
