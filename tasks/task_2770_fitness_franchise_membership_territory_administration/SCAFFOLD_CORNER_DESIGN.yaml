  - section: errors
    instances:
      - name: corner_each_not_found_family_returns_its_own_code
        claim_type: violation_to_error
        grounds:
          - errors.ERR_TERRITORY_NOT_FOUND
          - errors.ERR_PLAN_ASSET_NOT_FOUND
          - errors.ERR_MEMBERSHIP_RECORD_NOT_FOUND
          - errors.ERR_OPS_RECORD_NOT_FOUND
        distinguishing_aspect: "The catalog splits 404s by aggregate family rather than using one generic code, so a well-formed but never-issued UUID must resolve to ERR_TERRITORY_NOT_FOUND on the territory route, ERR_PLAN_ASSET_NOT_FOUND on the plan-template route, ERR_MEMBERSHIP_RECORD_NOT_FOUND on the agreement route and ERR_OPS_RECORD_NOT_FOUND on the inspection route - four distinct ids from four structurally identical requests."
        test_recipe:
          setup:
            - "No fixtures are required: every id below is a well-formed UUID that the system never issued."
          setup_api_calls: []
          trigger:
            - call: "GET /franchise/territories/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: BrandAdministrator
            - call: "GET /franchise/plan-templates/00000000-0000-0000-0000-0000000000a2"
              payload: {}
              as: BrandAdministrator
            - call: "GET /franchise/agreements/00000000-0000-0000-0000-0000000000a3"
              payload: {}
              as: BrandAdministrator
            - call: "GET /franchise/inspections/00000000-0000-0000-0000-0000000000a4"
              payload: {}
              as: BrandAdministrator
          assert:
            - "the territories response status == 404"
            - "the territories response data.error_id == ERR_TERRITORY_NOT_FOUND"
            - "the plan-templates response status == 404"
            - "the plan-templates response data.error_id == ERR_PLAN_ASSET_NOT_FOUND"
            - "the agreements response status == 404"
            - "the agreements response data.error_id == ERR_MEMBERSHIP_RECORD_NOT_FOUND"
            - "the inspections response status == 404"
            - "the inspections response data.error_id == ERR_OPS_RECORD_NOT_FOUND"

      - name: corner_a_request_with_no_identity_header_is_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority 1]
        distinguishing_aspect: "Priority 1 sits above everything else, so a request carrying no X-Role / X-User-ID headers is refused with ERR_UNAUTHENTICATED (401) before the role check, the schema check or the existence check can speak - even though the very same body would be a valid BrandAdministrator franchisee create."
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - "POST /franchise/franchisees with body {legal_name: 'Harborline Fitness LLC', contact_email: 'ops@harborlinefit.example'} and NO X-Role and NO X-User-ID header at all."
            - "GET /franchise/franchisees with no X-Role and no X-User-ID header."
          assert:
            - "the POST response status == 401"
            - "the POST response data.error_id == ERR_UNAUTHENTICATED"
            - "the GET response status == 401"
            - "the GET response data.error_id == ERR_UNAUTHENTICATED"
            - "no Franchisee row was created"

      - name: corner_occupied_and_already_active_territories_are_rejected_differently
        claim_type: violation_to_error
        grounds:
          - errors.ERR_TERRITORY_OCCUPIED
          - errors.ERR_INVALID_TERRITORY_STATE
          - endpoints[POST /franchise/clubs]
        distinguishing_aspect: "One territory holds at most one club, and the refusal code depends on which stage the territory has reached: while the first club is still PRE_OPENING the territory is RESERVED and a second club create yields ERR_TERRITORY_OCCUPIED (priority 12), but once that club opens the territory is ACTIVE and the earlier priority 7 state check yields ERR_INVALID_TERRITORY_STATE instead."
