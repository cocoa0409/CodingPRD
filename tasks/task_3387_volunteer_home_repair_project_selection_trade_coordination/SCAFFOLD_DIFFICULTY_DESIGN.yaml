  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: amend_cancelled_project_state_error_beats_fiscal_error
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ENVELOPE_EXCEEDED]
        distinguishing_aspect: |
          state (priority 6) vs business_fiscal (priority 11): amending a
          CANCELLED project with an addition whose envelope delta would also
          exceed available funds must surface ERR_INVALID_STATE, not
          ERR_ENVELOPE_EXCEEDED.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Cycle budget 200000; one project (volunteer item 100000..100000, envelope 115000) selected, then CANCELLED by staff; cycle available is 200000 again after the reserve release."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 200000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Conflict A", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "11 Fifth St" }
