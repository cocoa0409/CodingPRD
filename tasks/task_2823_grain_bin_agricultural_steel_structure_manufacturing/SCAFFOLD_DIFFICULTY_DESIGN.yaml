  - rule_id: non_linear_state_machine
    instances:

      - name: bin_design_revision_cycle_returns_to_draft_and_supersedes_analyses
        grounds:
          - state_machines.BinDesign.DRAFT_to_UNDER_REVIEW
          - state_machines.BinDesign.UNDER_REVIEW_to_REVISION_REQUIRED
          - state_machines.BinDesign.REVISION_REQUIRED_to_DRAFT
          - state_machines.DesignAnalysis.CURRENT_to_SUPERSEDED
          - entities.BinDesign.fields.revision_round
          - validations[priority=11]
        distinguishing_aspect: |
          BinDesign is the cyclic machine: DRAFT -> UNDER_REVIEW -> REVISION_REQUIRED -> DRAFT is a
          genuine loop that increments revision_round to 1, re-runs both geometry and structural
          calculations over the merged inputs, and marks every prior DesignAnalysis superseded, so
          the loop's termination condition (a non-superseded PASS analysis matching design_method)
          must be re-satisfied before the design can re-enter UNDER_REVIEW.
