              captures: { mp14_v: $.data.version }
          trigger:
            - call: "POST /networks/${n14}/doors/${d14}/mix-plans/${mp14}/publish"
              payload: { expected_mix_plan_version: "${mp14_v}" }
              as: DoorManager
              as_user_id: "${d14}"
              captures: { pub_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (door SUSPENDED blocks publish)"
            - "MixPlan.${mp14}.mix_plan_status remains DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_stop_windows_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=6]
          - entities.RouteStop
        distinguishing_aspect: |
          Interval semantics 1 (half-open [start,end), adjacency allowed) on
          RouteStop: stops for the same door on one route with windows
          [08:00,10:00) and [10:00,12:00) are adjacent and ACCEPTED, but
          [09:00,11:00) overlapping [08:00,10:00) is REJECTED with
          ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Network N15, hub H15 (R15), door D15 (SPOKE, FRANCHISE, R15, hub H15)"
            - "Route RT15 (service 2026-09-01) with stop S15a for D15 window 08:00-10:00"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N15", display_name: "Net Fifteen" }
              as: NetworkAdmin
              captures: { n15: $.data.id }
            - call: "POST /networks/${n15}/hubs"
              payload: { hub_code: "H15", daily_capacity_dozens: 500, territory_region: "R15" }
              as: NetworkAdmin
              captures: { h15: $.data.id }
            - call: "POST /networks/${n15}/doors"
              payload: { door_kind: "SPOKE", ownership: "FRANCHISE", territory_region: "R15", hub_id: "${h15}" }
              as: NetworkAdmin
              captures: { d15: $.data.id }
            - call: "POST /networks/${n15}/hubs/${h15}/routes"
              payload: { route_code: "RT15", service_date: "2026-09-01", vehicle_capacity_dozens: 200 }
              as: RoutePlanner
              captures: { rt15: $.data.id }
            - call: "POST /networks/${n15}/hubs/${h15}/routes/${rt15}/stops"
              payload: { door_id: "${d15}", sequence_no: 1, window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T10:00:00Z" }
              as: RoutePlanner
              captures: { s15a: $.data.id }
          trigger:
            - call: "POST /networks/${n15}/hubs/${h15}/routes/${rt15}/stops"
              payload: { door_id: "${d15}", sequence_no: 2, window_start: "2026-09-01T10:00:00Z", window_end: "2026-09-01T12:00:00Z" }
              as: RoutePlanner
              captures: { s15b: $.data.id }
            - call: "POST /networks/${n15}/hubs/${h15}/routes/${rt15}/stops"
              payload: { door_id: "${d15}", sequence_no: 3, window_start: "2026-09-01T09:00:00Z", window_end: "2026-09-01T11:00:00Z" }
              as: RoutePlanner
              captures: { overlap_err: $.data.error_id }
          assert:
            - "Adjacent stop S15b (10:00-12:00) created successfully — half-open semantics: [08:00,10:00) and [10:00,12:00) do not overlap"
            - "Overlapping stop (09:00-11:00) rejected with ERR_WINDOW_OVERLAP"

      - name: hot_light_windows_single_lit_exclusion
        grounds:
          - state_machines.HotLightWindow.SCHEDULED_to_LIT
          - validations[priority=6]
        distinguishing_aspect: |
          Interval semantics 2 (aggregate exclusion — at most one LIT/EXTENDED
          window per door at any instant, independent of the creation-time
          half-open overlap check) on HotLightWindow: igniting window W2 while W1
          is LIT is rejected even if the two windows were non-overlapping at
          creation (W2 was scheduled within W1's span via extension).
        test_recipe:
          setup:
            - "Network N16, hub H16 (R16) with OPERATIONAL line L16 and batch B16 COMPLETED today (fresh)"
            - "THEATER COMPANY door D16 (hub H16 territory R16) with window W16a 06:00-09:00 LIT, and window W16b 10:00-12:00 SCHEDULED"
            - "W16a extended by 90 minutes via demand response so lit_end reaches 10:30 — now overlapping W16b's 10:00 start"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N16", display_name: "Net Sixteen" }
              as: NetworkAdmin
              captures: { n16: $.data.id }
            - call: "POST /networks/${n16}/hubs"
              payload: { hub_code: "H16", daily_capacity_dozens: 500, territory_region: "R16" }
              as: NetworkAdmin
              captures: { h16: $.data.id, h16_v: $.data.version }
            - call: "POST /networks/${n16}/hubs/${h16}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 500 }
              as: HubManager
              captures: { l16: $.data.id }
            - call: "POST /networks/${n16}/hubs/${h16}/batches"
              payload: { equipment_line_id: "${l16}", production_date: "2026-09-01", planned_dozens: 200 }
              as: HubManager
              captures: { b16: $.data.id }
            - call: "POST /networks/${n16}/hubs/${h16}/batches/${b16}/commit"
              payload: { expected_hub_version: "${h16_v}" }
              as: HubManager
            - call: "POST /networks/${n16}/hubs/${h16}/batches/${b16}/start"
              payload: {}
              as: HubManager
            - call: "POST /networks/${n16}/hubs/${h16}/batches/${b16}/complete"
              payload: { produced_dozens: 200 }
              as: HubManager
            - call: "POST /networks/${n16}/doors"
              payload: { door_kind: "THEATER", ownership: "COMPANY", territory_region: "R16" }
              as: NetworkAdmin
              captures: { d16: $.data.id }
            - call: "POST /networks/${n16}/doors/${d16}/hot-light-windows"
              payload: { lit_start: "2026-09-01T06:00:00Z", lit_end: "2026-09-01T09:00:00Z" }
              as: DoorManager
              as_user_id: "${d16}"
              captures: { w16a: $.data.id }
            - call: "POST /networks/${n16}/doors/${d16}/hot-light-windows"
              payload: { lit_start: "2026-09-01T10:00:00Z", lit_end: "2026-09-01T12:00:00Z" }
              as: DoorManager
              as_user_id: "${d16}"
              captures: { w16b: $.data.id }
            - call: "POST /networks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks/${n16}/doors/${d16}/hot-light-windows/${w16a}/ignite"
              payload: {}
              as: DoorManager
              as_user_id: "${d16}"
            - call: "POST /networks/${n16}/doors/${d16}/hot-light-windows/${w16a}/extend"
              payload: { demand_response_extend_minutes: 90 }
              as: DoorManager
              as_user_id: "${d16}"
            - call: "POST /networks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:15:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /networks/${n16}/doors/${d16}/hot-light-windows/${w16b}/ignite"
              payload: {}
              as: DoorManager
              as_user_id: "${d16}"
              captures: { ignite2_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (another window LIT/EXTENDED for this door — aggregate single-lit exclusion, distinct from creation-time half-open overlap)"
            - "HotLightWindow.${w16b}.window_status remains SCHEDULED"
            - "HotLightWindow.${w16a}.window_status == EXTENDED with lit_end == 2026-09-01T10:30:00Z"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: commit_then_cancel_conserves_hub_capacity
        grounds:
          - state_machines.ProductionBatch.SCHEDULED_to_COMMITTED
          - state_machines.ProductionBatch.COMMITTED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity 1 (hub capacity ledger): commit (planned 100) followed
          by its compensating cancel leaves Hub.committed_dozens_today unchanged
          (0 -> 100 -> 0) and Hub.daily_capacity_dozens untouched — the forward
          and compensating actions are exact inverses on the committed-dozens pool.
        test_recipe:
          setup:
            - "Network N17, hub H17 (cap 500, R17), line L17 OPERATIONAL"
            - "Batch B17 SCHEDULED (planned 100)"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N17", display_name: "Net Seventeen" }
              as: NetworkAdmin
              captures: { n17: $.data.id }
            - call: "POST /networks/${n17}/hubs"
              payload: { hub_code: "H17", daily_capacity_dozens: 500, territory_region: "R17" }
              as: NetworkAdmin
              captures: { h17: $.data.id, h17_v: $.data.version }
            - call: "POST /networks/${n17}/hubs/${h17}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 100 }
              as: HubManager
              captures: { l17: $.data.id }
            - call: "POST /networks/${n17}/hubs/${h17}/batches"
              payload: { equipment_line_id: "${l17}", production_date: "2026-09-01", planned_dozens: 100 }
              as: HubManager
              captures: { b17: $.data.id }
          trigger:
            - call: "POST /networks/${n17}/hubs/${h17}/batches/${b17}/commit"
              payload: { expected_hub_version: "${h17_v}" }
              as: HubManager
            - call: "POST /networks/${n17}/hubs/${h17}/batches/${b17}/cancel"
              payload: {}
              as: HubManager
          assert:
            - "Hub.${h17}.committed_dozens_today == 0 after commit(100) + cancel — invariant: committed_dozens_today after compensating pair equals pre-commit value"
            - "ProductionBatch.${b17}.batch_status == CANCELLED"

      - name: dispute_then_resolve_conserves_door_credit_balance
        grounds:
          - state_machines.StaleCredit.PROVISIONAL_to_DISPUTED
          - state_machines.StaleCredit.DISPUTED_to_RESOLVED
        distinguishing_aspect: |
          Conserved quantity 2 (door credit ledger + dispute counter pair):
          dispute followed by resolve leaves Door.open_dispute_count unchanged
          (0 -> 1 -> 0) and Door.credit_balance_cents equal to the single resolved
          final amount — not double-counted by the provisional booking plus the
          resolution (resolve adjusts by delta, it does not add a second credit).
        test_recipe:
          setup:
            - "Network N18, hub H18 (cap 500, R18), line L18 OPERATIONAL, door D18 (SPOKE, FRANCHISE, R18, hub H18)"
            - "Batch B18 COMPLETED 40; route RT18 dispatched; stop S18 (window covers 09:00); shipment SH18 20 shipped, 20 delivered on time"
            - "Stale credit SC18 of 5 dozen created at 13:00 (provisional == 5*1200*0.50 = 3000); then disputed"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N18", display_name: "Net Eighteen" }
              as: NetworkAdmin
              captures: { n18: $.data.id }
            - call: "POST /networks/${n18}/hubs"
              payload: { hub_code: "H18", daily_capacity_dozens: 500, territory_region: "R18" }
              as: NetworkAdmin
              captures: { h18: $.data.id, h18_v: $.data.version }
            - call: "POST /networks/${n18}/hubs/${h18}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 200 }
              as: HubManager
              captures: { l18: $.data.id }
            - call: "POST /networks/${n18}/doors"
              payload: { door_kind: "SPOKE", ownership: "FRANCHISE", territory_region: "R18", hub_id: "${h18}" }
              as: NetworkAdmin
              captures: { d18: $.data.id }
            - call: "POST /networks/${n18}/hubs/${h18}/batches"
              payload: { equipment_line_id: "${l18}", production_date: "2026-09-01", planned_dozens: 40 }
              as: HubManager
              captures: { b18: $.data.id }
            - call: "POST /networks/${n18}/hubs/${h18}/batches/${b18}/commit"
              payload: { expected_hub_version: "${h18_v}" }
              as: HubManager
            - call: "POST /networks/${n18}/hubs/${h18}/batches/${b18}/start"
              payload: {}
              as: HubManager
            - call: "POST /networks/${n18}/hubs/${h18}/batches/${b18}/complete"
              payload: { produced_dozens: 40 }
              as: HubManager
            - call: "POST /networks/${n18}/hubs/${h18}/routes"
              payload: { route_code: "RT18", service_date: "2026-09-01", vehicle_capacity_dozens: 200 }
              as: RoutePlanner
              captures: { rt18: $.data.id }
            - call: "POST /networks/${n18}/hubs/${h18}/routes/${rt18}/stops"
              payload: { door_id: "${d18}", sequence_no: 1, window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z" }
              as: RoutePlanner
              captures: { s18: $.data.id }
            - call: "POST /networks/${n18}/hubs/${h18}/routes/${rt18}/stops/${s18}/shipments"
              payload: { production_batch_id: "${b18}", dozens_shipped: 20 }
              as: RoutePlanner
              captures: { sh18: $.data.id }
            - call: "POST /networks/${n18}/hubs/${h18}/routes/${rt18}/lock"
              payload: {}
              as: RoutePlanner
            - call: "POST /networks/${n18}/hubs/${h18}/routes/${rt18}/dispatch"
              payload: {}
              as: RoutePlanner
            - call: "POST /networks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks/${n18}/hubs/${h18}/routes/${rt18}/stops/${s18}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /networks/${n18}/shipments/${sh18}/record-delivery"
              payload: { dozens_delivered: 20 }
              as: RouteDriver
            - call: "POST /networks/${n18}/hubs/${h18}/routes/${rt18}/stops/${s18}/deliver"
              payload: {}
              as: RouteDriver
            - call: "POST /networks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks/${n18}/doors/${d18}/stale-credits"
              payload: { shipment_id: "${sh18}", pulled_dozens: 5 }
              as: DoorManager
              as_user_id: "${d18}"
              captures: { sc18: $.data.id }
            - call: "POST /networks/${n18}/doors/${d18}/stale-credits/${sc18}/dispute"
              payload: {}
              as: DoorManager
              as_user_id: "${d18}"
          trigger:
            - call: "POST /networks/${n18}/doors/${d18}/stale-credits/${sc18}/resolve"
              payload: { resolution_credit_cents: 2500 }
              as: NetworkAdmin
          assert:
            - "Door.${d18}.open_dispute_count == 0 (dispute +1, resolve -1: conserved counter)"
            - "Door.${d18}.credit_balance_cents == 2500 (resolution amount exactly once — provisional 3000 was adjusted by delta -500, not added again)"
            - "StaleCredit.${sc18}.credit_state == RESOLVED and final_credit_cents == 2500"
