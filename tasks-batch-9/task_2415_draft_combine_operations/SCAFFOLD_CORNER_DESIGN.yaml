scaffold_corner_design:
  - section: entities
    instances:
      - name: draft_cycle_created_with_setup_defaults
        claim_type: creation
        grounds:
          - entities.DraftCycle
          - endpoints.POST_draft-ops_draft-cycles
          - response_envelope.success
        distinguishing_aspect: "Creating a cycle with rounds_count and compressed_final_day omitted must return 201 with status SETUP, posture OPEN, rounds_count 7, compressed_final_day false, club_count 0, lottery_completed false, an empty pick ledger and version 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z by startup default, then moved to 2027-01-02T00:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
          trigger:
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z" }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
          assert:
            - "response.status == 201"
            - "response.response_type == object"
            - "DraftCycle.${cycle_id}.season_year == 2027"
            - "DraftCycle.${cycle_id}.status == SETUP"
            - "DraftCycle.${cycle_id}.posture == OPEN"
            - "DraftCycle.${cycle_id}.rounds_count == 7"
            - "DraftCycle.${cycle_id}.compressed_final_day == false"
            - "DraftCycle.${cycle_id}.club_count == 0"
            - "DraftCycle.${cycle_id}.lottery_completed == false"
            - "DraftCycle.${cycle_id}.order_finalized_at == null"
            - "DraftCycle.${cycle_id}.udfa_window_close_at == null"
            - "DraftCycle.${cycle_id}.pick_inventory_count == 0"
            - "DraftCycle.${cycle_id}.pick_inventory_chart_points == 0.0"
            - "DraftCycle.${cycle_id}.version == 1"

      - name: club_retrieval_returns_stored_registration_row
        claim_type: retrieval
        grounds:
          - entities.Club
          - endpoints.GET_draft-ops_clubs_id
        distinguishing_aspect: "GET on a freshly registered club echoes every stored input plus the derived opening values: registration_status REGISTERED, timeouts_remaining 2 and rookie_pool_remaining_cents equal to rookie_pool_total_cents."
        test_recipe:
          setup:
            - "DraftCycle 2027 in SETUP with club ELM registered and no picks minted yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "ELM", market_name: "Elmwood", prior_season_win_pct: 0.500, strength_of_schedule: 0.470, head_to_head_rank: 5, rookie_pool_total_cents: 896721432, lottery_combinations: 75 }
              as: LeagueDraftAdmin
              captures: { elm_id: $.data.id }
          trigger:
            - call: "GET /draft-ops/clubs/${elm_id}"
              payload: {}
              as: LeagueDraftAdmin
          assert:
            - "response.status == 200"
            - "Club.${elm_id}.draft_cycle_id == ${cycle_id}"
            - "Club.${elm_id}.club_code == ELM"
            - "Club.${elm_id}.market_name == Elmwood"
            - "Club.${elm_id}.prior_season_win_pct == 0.500"
            - "Club.${elm_id}.lottery_combinations == 75"
            - "Club.${elm_id}.registration_status == REGISTERED"
            - "Club.${elm_id}.playoff_qualified == false"
            - "Club.${elm_id}.playoff_exit_round == 0"
            - "Club.${elm_id}.timeouts_remaining == 2"
            - "Club.${elm_id}.rookie_pool_remaining_cents == 896721432"
            - "Club.${elm_id}.version == 1"
            - "DraftCycle.${cycle_id}.club_count == 1"

      - name: cycle_club_listing_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints.GET_draft-ops_draft-cycles_id_clubs
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three clubs registered, limit=2 and offset=0 returns exactly two rows in created_at ASC order with total_count 3 and has_more true; offset=2 returns the third row with has_more false."
        test_recipe:
          setup:
            - "DraftCycle 2027 in SETUP with clubs ELM, HAR and BRN registered in that order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "ELM", market_name: "Elmwood", prior_season_win_pct: 0.500, strength_of_schedule: 0.470, head_to_head_rank: 5, rookie_pool_total_cents: 896721432, lottery_combinations: 75 }
              as: LeagueDraftAdmin
              captures: { elm_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "HAR", market_name: "Harbor City", prior_season_win_pct: 0.125, strength_of_schedule: 0.520, head_to_head_rank: 1, rookie_pool_total_cents: 500000000, lottery_combinations: 140 }
              as: LeagueDraftAdmin
              captures: { har_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "BRN", market_name: "Brenton", prior_season_win_pct: 0.250, strength_of_schedule: 0.480, head_to_head_rank: 2, rookie_pool_total_cents: 500000000, lottery_combinations: 125 }
              as: LeagueDraftAdmin
              captures: { brn_id: $.data.id }
          trigger:
            - call: "GET /draft-ops/draft-cycles/${cycle_id}/clubs?limit=2&offset=0"
              payload: {}
              as: LeagueDraftAdmin
              captures: { first_club_id: "$.data[0].id", second_club_id: "$.data[1].id" }
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response.meta.total_count == 3"
            - "response.meta.has_more == true"
            - "response.meta.limit == 2"
            - "response.meta.offset == 0"
            - "response.data[0].id == ${elm_id}"
            - "response.data[1].id == ${har_id}"
            - "response.data[0].club_code == ELM"
            - "response.data[1].club_code == HAR"

      - name: prospect_fetch_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations.priority_4
          - endpoints.GET_draft-ops_prospects_id
        distinguishing_aspect: "A syntactically valid UUID that matches no Prospect row must return ERR_RESOURCE_NOT_FOUND (404) with the error envelope, not an empty object or a 200."
        test_recipe:
          setup:
            - "DraftCycle 2027 exists; no Prospect has been created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "GET /draft-ops/prospects/2f8a9c31-0d64-4f77-9b2e-5c1a7d3e0004"
              payload: {}
              as: LeagueDraftAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.response_type == error"
            - "response.data.error_id == ERR_RESOURCE_NOT_FOUND"
            - "response.data.message is a non-empty string"

      - name: club_creation_without_market_name_is_rejected
        claim_type: required_fields
        grounds:
          - entities.Club.fields.market_name
          - validations.priority_3
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "market_name has source input with no default, so omitting it must return ERR_INVALID_REQUEST (400) and register no club; DraftCycle.club_count stays 0."
        test_recipe:
          setup:
            - "DraftCycle 2027 in SETUP with no clubs registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "ELM", prior_season_win_pct: 0.500, strength_of_schedule: 0.470, head_to_head_rank: 5, rookie_pool_total_cents: 896721432 }
              as: LeagueDraftAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "DraftCycle.${cycle_id}.club_count == 0"

      - name: prospect_created_with_all_parallel_dimension_defaults
        claim_type: defaults
        grounds:
          - entities.Prospect
          - state_machines.Prospect.initial_state
        distinguishing_aspect: "A new prospect must open every one of its six status dimensions at its declared default (UNDECLARED / UNREVIEWED / NOT_INVITED / NONE / PENDING / UNSIGNED) with drafted_pick_overall_number 0 and both waiver flags false."
        test_recipe:
          setup:
            - "DraftCycle 2027 in DECLARATION_OPEN with clubs ELM and HAR registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "ELM", market_name: "Elmwood", prior_season_win_pct: 0.500, strength_of_schedule: 0.470, head_to_head_rank: 5, rookie_pool_total_cents: 896721432, lottery_combinations: 75 }
              as: LeagueDraftAdmin
              captures: { elm_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "HAR", market_name: "Harbor City", prior_season_win_pct: 0.125, strength_of_schedule: 0.520, head_to_head_rank: 1, rookie_pool_total_cents: 500000000, lottery_combinations: 140 }
              as: LeagueDraftAdmin
              captures: { har_id: $.data.id }
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "DECLARATION_OPEN" }
              as: LeagueDraftAdmin
          trigger:
            - call: "POST /draft-ops/prospects"
              payload: { draft_cycle_id: "${cycle_id}", full_name: "Avery Lane", position_group: "QB", school_code: "NRT", seasons_played: 4, scouting_grade: 92.50, position_group_scarcity_rank: 1 }
              as: LeagueDraftAdmin
              captures: { p1_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Prospect.${p1_id}.declaration_status == UNDECLARED"
            - "Prospect.${p1_id}.declared_at == null"
            - "Prospect.${p1_id}.eligibility_status == UNREVIEWED"
            - "Prospect.${p1_id}.invitation_status == NOT_INVITED"
            - "Prospect.${p1_id}.consent_status == NONE"
            - "Prospect.${p1_id}.consent_scope == null"
            - "Prospect.${p1_id}.medical_clearance_status == PENDING"
            - "Prospect.${p1_id}.signing_status == UNSIGNED"
            - "Prospect.${p1_id}.drafted_pick_overall_number == 0"
            - "Prospect.${p1_id}.late_declaration_waived == false"
            - "Prospect.${p1_id}.early_entry_waived == false"
            - "Prospect.${p1_id}.version == 1"

      - name: medical_station_defaults_applied_when_optionals_omitted
        claim_type: defaults
        grounds:
          - entities.MedicalStation.fields.turnaround_buffer_minutes
          - entities.MedicalStation.fields.status
        distinguishing_aspect: "Omitting turnaround_buffer_minutes and status must yield 15 and AVAILABLE, the declared defaults that every station conflict check depends on."
        test_recipe:
          setup:
            - "The logical clock is at 2027-01-02T00:00:00.000Z; MedicalStation rows are league-wide and need no cycle"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
          trigger:
            - call: "POST /draft-ops/medical-stations"
              payload: { station_code: "ST-NEURO-1", exam_type: "NEURO" }
              as: LeagueDraftAdmin
              captures: { station_id: $.data.id }
          assert:
            - "response.status == 201"
            - "MedicalStation.${station_id}.station_code == ST-NEURO-1"
            - "MedicalStation.${station_id}.exam_type == NEURO"
            - "MedicalStation.${station_id}.turnaround_buffer_minutes == 15"
            - "MedicalStation.${station_id}.status == AVAILABLE"
            - "MedicalStation.${station_id}.version == 1"

      - name: booking_duration_minutes_computed_from_the_interval
        claim_type: computed_fields
        grounds:
          - entities.CombineBooking.fields.duration_minutes
          - endpoints.POST_draft-ops_combine-bookings
        distinguishing_aspect: "duration_minutes is source computed: a 09:00-09:45 exam must report 45 whatever the client sends, and status opens at SCHEDULED."
        test_recipe:
          setup:
            - "DraftCycle 2027 in COMBINE_WEEK with clubs ELM and HAR and Avery Lane DECLARED"
            - "MedicalStation ST-ORTHO-1 exists with turnaround_buffer_minutes 15"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "ELM", market_name: "Elmwood", prior_season_win_pct: 0.500, strength_of_schedule: 0.470, head_to_head_rank: 5, rookie_pool_total_cents: 896721432, lottery_combinations: 75 }
              as: LeagueDraftAdmin
              captures: { elm_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "HAR", market_name: "Harbor City", prior_season_win_pct: 0.125, strength_of_schedule: 0.520, head_to_head_rank: 1, rookie_pool_total_cents: 500000000, lottery_combinations: 140 }
              as: LeagueDraftAdmin
              captures: { har_id: $.data.id }
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "DECLARATION_OPEN" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/prospects"
              payload: { draft_cycle_id: "${cycle_id}", full_name: "Avery Lane", position_group: "QB", school_code: "NRT", seasons_played: 4, scouting_grade: 92.50, position_group_scarcity_rank: 1 }
              as: LeagueDraftAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /draft-ops/prospects/${p1_id}/declaration"
              payload: { action: "DECLARE" }
              as: ProspectAgent
              as_user_id: "${p1_id}"
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "COMBINE_WEEK" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/medical-stations"
              payload: { station_code: "ST-ORTHO-1", exam_type: "ORTHO", turnaround_buffer_minutes: 15 }
              as: LeagueDraftAdmin
              captures: { station_id: $.data.id }
          trigger:
            - call: "POST /draft-ops/combine-bookings"
              payload: { prospect_id: "${p1_id}", booking_type: "MEDICAL_EXAM", starts_at: "2027-02-23T09:00:00.000Z", ends_at: "2027-02-23T09:45:00.000Z", medical_station_id: "${station_id}" }
              as: LeagueDraftAdmin
              captures: { booking_id: $.data.id }
          assert:
            - "response.status == 201"
            - "CombineBooking.${booking_id}.duration_minutes == 45"
            - "CombineBooking.${booking_id}.status == SCHEDULED"
            - "CombineBooking.${booking_id}.prospect_id == ${p1_id}"
            - "CombineBooking.${booking_id}.medical_station_id == ${station_id}"
            - "CombineBooking.${booking_id}.interview_room_id == null"
            - "CombineBooking.${booking_id}.version == 1"

      - name: prospect_create_with_extra_field_system_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Prospect
          - complexity_profile.consistency_model
        distinguishing_aspect: "Client-supplied id, created_at and version values must be discarded: the server mints its own UUID, sets version 1, and the echoed row carries none of the submitted system values."
        test_recipe:
          setup:
            - "DraftCycle 2027 in DECLARATION_OPEN with clubs ELM and HAR registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "ELM", market_name: "Elmwood", prior_season_win_pct: 0.500, strength_of_schedule: 0.470, head_to_head_rank: 5, rookie_pool_total_cents: 896721432, lottery_combinations: 75 }
              as: LeagueDraftAdmin
              captures: { elm_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "HAR", market_name: "Harbor City", prior_season_win_pct: 0.125, strength_of_schedule: 0.520, head_to_head_rank: 1, rookie_pool_total_cents: 500000000, lottery_combinations: 140 }
              as: LeagueDraftAdmin
              captures: { har_id: $.data.id }
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "DECLARATION_OPEN" }
              as: LeagueDraftAdmin
          trigger:
            - call: "POST /draft-ops/prospects"
              payload: { draft_cycle_id: "${cycle_id}", full_name: "Brooks Hale", position_group: "WR", school_code: "STH", seasons_played: 4, scouting_grade: 88.00, position_group_scarcity_rank: 3, id: "11111111-1111-4111-8111-111111111111", created_at: "2020-01-01T00:00:00.000Z", version: 99 }
              as: LeagueDraftAdmin
              captures: { p2_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Prospect.${p2_id}.id != 11111111-1111-4111-8111-111111111111"
            - "Prospect.${p2_id}.created_at == 2027-01-02T00:00:00.000Z"
            - "Prospect.${p2_id}.version == 1"
            - "Prospect.${p2_id}.full_name == Brooks Hale"
            - "Prospect.${p2_id}.declaration_status == UNDECLARED"

      - name: prospect_invalid_enum_position_group_rejected
        claim_type: type_constraints
        grounds:
          - entities.Prospect.fields.position_group
          - validations.priority_3
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "position_group is constrained to nine values; GOALIE is outside the enum and must return ERR_INVALID_REQUEST (400) with no Prospect row created."
        test_recipe:
          setup:
            - "DraftCycle 2027 in DECLARATION_OPEN with clubs ELM and HAR registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "ELM", market_name: "Elmwood", prior_season_win_pct: 0.500, strength_of_schedule: 0.470, head_to_head_rank: 5, rookie_pool_total_cents: 896721432, lottery_combinations: 75 }
              as: LeagueDraftAdmin
              captures: { elm_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "HAR", market_name: "Harbor City", prior_season_win_pct: 0.125, strength_of_schedule: 0.520, head_to_head_rank: 1, rookie_pool_total_cents: 500000000, lottery_combinations: 140 }
              as: LeagueDraftAdmin
              captures: { har_id: $.data.id }
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "DECLARATION_OPEN" }
              as: LeagueDraftAdmin
          trigger:
            - call: "POST /draft-ops/prospects"
