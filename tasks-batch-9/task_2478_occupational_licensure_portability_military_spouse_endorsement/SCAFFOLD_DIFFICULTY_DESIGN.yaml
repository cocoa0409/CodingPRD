            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap_y}", profession_id: "${prof_rd}", primary_credential_id: "${cred_y}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap_y}"
              captures: { app_y: $.data.id }
            - call: "POST /licensure/applications/${app_y}/submit"
