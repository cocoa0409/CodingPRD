            - call: "POST /stores"
              payload: { store_number: "SZ-1", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 Z St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 5000000, actual_avg_weekly_sales_cents: 4000000 }
              as: FranchisorOps
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${fr2}", proposed_address: "Far Away", proposed_lat: 41.5, proposed_lng: -76.5, proposed_open_date: "2027-01-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da_id}"
              captures: { app_id: $.data.id }
