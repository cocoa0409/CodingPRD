  - rule_id: transitive_cascade
    instances:

      - name: license_suspension_cascades_beam_then_subscription_then_roaming_then_cell
        grounds:
          - state_machines.SpectrumLicense.ACTIVE_to_SUSPENDED
          - state_machines.RoamingAuthorization.APPROVED_to_REVOKED
          - entities.Subscription.fields.deauthorized_by_license_id
          - entities.ServiceCell.fields.availability_state
          - endpoints["POST /satellite-broadband/spectrum-licenses/{id}/enforcement-action"]
        distinguishing_aspect: |
          Cascade A, depth 4, triggered by the licence enforcement transition: suspending the licence
          suspends the beam (hop 1); the beam suspension deauthorises the subscriptions on that beam's
          cells (hop 2, caused by hop 1, not by the licence write); the deauthorisation revokes each
          such subscription's APPROVED roaming authorisation with revoked_reason LICENSE_SUSPENDED
