            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
          trigger:
            - call: "GET /blood-bank/par-level-policies/${pol}/posture"
              as: BloodBankSupervisor
              captures: { inbound: $.data.inbound_units_24h, phys: $.data.physical_posture, prosp: $.data.prospective_posture }
          assert:
            - "inbound == 0 (delivery is 48h out, beyond the 24h horizon)"
            - "phys == CRITICAL and prosp == CRITICAL (usable 0 <= 2; no prospective rescue)"
      - name: wastage_rate_rounding_4dp_and_excessive_flag
        claim_type: precision
        grounds:
          - "calculations.rolling_wastage_rate"
          - "entities.ParLevelPolicy.fields.excessive_wastage"
        distinguishing_aspect: "1 wasted / 3 received in-window rounds half-up to exactly 0.3333 at 4 decimals and crosses the inclusive 0.05 excessive threshold."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; policy RBC:O:NEG (watch 99, shortage 50, critical 10); 3 units received; 1 discarded while QUARANTINED"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
