              payload: { claimant_id: "${el_id}", alleged_onset_date: "2024-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: SSAAdmin
              captures: { ael_id: "$.data.id" }
            - call: "POST /ssdi/applications/${ael_id}/evidence"
              payload: { source_type: "TREATING_PHYSICIAN", report_date: "2024-02-01T00:00:00Z", diagnosis_code: "M54.5", severity_score: 80 }
              as: Claimant
              as_user_id: "${el_id}"
            - call: "POST /ssdi/applications/${ael_id}/evidence"
