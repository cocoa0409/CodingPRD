# =============================================================================
# Task 1209: Fair Lending Analysis & Redlining Monitoring — §1.8 Test Targeting Index
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations on different
  # entity domains (Application underwriting outcomes vs Market penetration).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: denial_ratio_net_vs_raw_divergence
        grounds:
          - calculations.denial_impact_ratio
          - entities.AnalysisRun.fields.impact_ratio_net
          - entities.AnalysisRun.fields.impact_ratio_raw
        distinguishing_aspect: |
          Same locked dataset yields impact_ratio_net == 0.8750 (MARGINAL, no
          flag on the net basis) and impact_ratio_raw == 0.6250 (ADVERSE,
          screening flag fires) — the two variants diverge because the raw
          variant's denominators include the 4 WITHDRAWN protected rows; the
          auto-finding is keyed on the raw screening flag, not the net
          classification. Entity domain: Application underwriting outcomes.
        test_recipe:
          setup:
            - "Market M1 (share 0.40), one branch, one officer O1"
            - "CONTROL cohort: 8 ORIGINATED @700bps + 2 DENIED, all VALIDATED, decision dates in 2026 Q1"
            - "PROTECTED_1 cohort: 7 ORIGINATED @700bps + 3 DENIED + 4 WITHDRAWN, all VALIDATED, decision dates in 2026 Q1"
            - "Run R on (M1, CONVENTIONAL, RACE, [2026-01-01, 2026-04-01)) locked with 24-row snapshot"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { c1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 721, dti_pct: 36.0, application_date: "2026-01-06", decision_date: "2026-01-21" }, as: LendingDataOps, captures: { c2: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 722, dti_pct: 36.0, application_date: "2026-01-07", decision_date: "2026-01-22" }, as: LendingDataOps, captures: { c3: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 723, dti_pct: 36.0, application_date: "2026-01-08", decision_date: "2026-01-23" }, as: LendingDataOps, captures: { c4: $.data.id } }
