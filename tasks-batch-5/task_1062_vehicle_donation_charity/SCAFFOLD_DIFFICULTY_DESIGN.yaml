scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: receipt_gross_proceeds_vs_fmv_full_on_one_sold_donation
        grounds:
          - calculations.tax_receipt_valuation
          - entities.TaxReceipt.fields.valuation_variant
          - entities.TaxReceipt.fields.claimed_amount_cents
          - entities.Donation.fields.exception_type
          - state_machines.TaxReceipt.ISSUED_to_VOIDED
          - state_machines.TaxReceipt.VOIDED_to_DRAFT
        distinguishing_aspect: |
          This dual variant lives in the donor-tax domain (TaxReceipt over one Donation): the
          identical sold donation yields claimed_amount_cents 120000 under GROSS_PROCEEDS and
          346800 under FMV_FULL, decided solely by Donation.exception_type.
        test_recipe:
          setup:
            - "charity Wheels For Hope (fee 0.10) and donor Dora Nate exist"
            - "donation d1 is a drop-off donation, declared GOOD, in status IN_CUSTODY"
            - "vehicle v1 has base_book_value_cents 480000 and, after inspection, odometer 120000 and grade GOOD, so fmv_estimate_cents == 346800"
            - "title t1 is CLEARED"
            - "lot l1 sold for 120000, so donation d1 has status SOLD, payout_status ACCRUED, gross_proceeds_cents 120000, net_to_charity_cents 103100"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Wheels For Hope", ein: "91-1111111", state_code: "CA", remittance_fee_pct: 0.10 }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "dora@example.com", full_name: "Dora Nate", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD", pickup_required: false }
              as: IntakeAgent
              captures: { d1: $.data.id }
            - call: "POST /api/donations/${d1}/accept"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/donations/${d1}/receive-dropoff"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/vehicles"
              payload: { donation_id: "${d1}", vin: "1HGCM82633A004352", year: 2016, make: "Honda", model: "Accord", base_book_value_cents: 480000 }
              as: IntakeAgent
              captures: { v1: $.data.id }
            - call: "PATCH /api/vehicles/${v1}"
              payload: { odometer_miles: 120000, condition_grade: "GOOD" }
              as: AuctionManager
            - call: "POST /api/title-records"
              payload: { donation_id: "${d1}", title_number: "CA-TTL-0001", owner_name: "Dora Nate" }
              as: TitleClerk
              captures: { t1: $.data.id }
            - call: "POST /api/title-records/${t1}/submit-dmv"
              payload: {}
              as: TitleClerk
            - call: "POST /api/title-records/${t1}/dmv-decision"
              payload: { outcome: "CLEARED" }
              as: TitleClerk
            - call: "POST /api/venues"
              payload: { name: "Bay Auto Auction", venue_type: "AUCTION", state_code: "CA" }
              as: ProgramAdmin
              captures: { ve1: $.data.id }
            - call: "POST /api/auction-lots"
              payload: { donation_id: "${d1}", venue_id: "${ve1}", lot_number: "L-001", reserve_price_cents: 50000 }
              as: AuctionManager
              captures: { l1: $.data.id }
            - call: "GET /api/donations/${d1}"
              as: AuctionManager
              captures: { d1_v: $.data.version }
            - call: "POST /api/auction-lots/${l1}/record-sale"
              payload: { sale_price_cents: 120000, expected_donation_version: "${d1_v}" }
              as: AuctionManager
          trigger:
            - call: "POST /api/tax-receipts"
              payload: { donation_id: "${d1}" }
              as: FinanceOfficer
              captures: { r1: $.data.id, r1_claimed: $.data.claimed_amount_cents }
            - call: "POST /api/tax-receipts/${r1}/issue"
              payload: {}
              as: FinanceOfficer
            - call: "POST /api/tax-receipts/${r1}/void"
              payload: { void_reason: "exception discovered after issue" }
              as: ProgramAdmin
            - call: "POST /api/donations/${d1}/exception"
              payload: { exception_type: "MATERIAL_IMPROVEMENT" }
              as: ProgramAdmin
            - call: "POST /api/tax-receipts/${r1}/reissue"
              payload: {}
              as: FinanceOfficer
          assert:
            - "after the first POST /api/tax-receipts, TaxReceipt.${r1}.valuation_variant == GROSS_PROCEEDS"
            - "after the first POST /api/tax-receipts, TaxReceipt.${r1}.form_type == FORM_1098C_BOX_4A"
            - "after the first POST /api/tax-receipts, TaxReceipt.${r1}.claimed_amount_cents == 120000"
            - "after issue, Donation.${d1}.status == CLOSED and Donation.${d1}.deduction_amount_cents == 120000"
            - "after void, Donation.${d1}.status == SOLD and Donation.${d1}.deduction_amount_cents is null"
            - "after reissue, TaxReceipt.${r1}.valuation_variant == FMV_FULL"
            - "after reissue, TaxReceipt.${r1}.form_type == FORM_1098C_BOX_4B"
            - "after reissue, TaxReceipt.${r1}.claimed_amount_cents == 346800"
            - "after reissue, TaxReceipt.${r1}.status == DRAFT and TaxReceipt.${r1}.reissue_count == 1"
            - "Donation.${d1}.gross_proceeds_cents == 120000 throughout; the two variants differ by 226800 cents on identical stored data"

      - name: remittance_fee_batch_rounding_vs_per_line_rounding
        grounds:
          - calculations.remittance_fee
          - entities.RemittanceBatch.fields.provisional_fee_cents
          - entities.RemittanceBatch.fields.fee_cents
          - entities.CharityAffiliate.fields.remittance_fee_pct
          - state_machines.RemittanceBatch.OPEN_to_CLOSED
        distinguishing_aspect: |
          This dual variant lives in the charity-remittance domain (RemittanceBatch over a
          CharityAffiliate), a different entity domain from the donor-tax receipt variant: the
          same three member donations produce provisional_fee_cents 2247 under BATCH_ROUNDING
          and fee_cents 2248 under PER_LINE_ROUNDING.
        test_recipe:
          setup:
            - "charity c1 has remittance_fee_pct 0.10"
            - "three drop-off donations sold for 19846, 14286 and 10836 cents give net_to_charity_cents 12346, 6786 and 3336"
            - "all three sales are recorded at logical clock 2026-07-10T00:00:00Z"
            - "an OPEN batch covers [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/charities"
              payload: { name: "Wheels For Hope", ein: "91-2222222", state_code: "CA", remittance_fee_pct: 0.10 }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "dora2@example.com", full_name: "Dora Nate", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Bay Auto Auction", venue_type: "AUCTION", state_code: "CA" }
              as: ProgramAdmin
              captures: { ve1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "FAIR", pickup_required: false }
              as: IntakeAgent
              captures: { da: $.data.id }
            - call: "POST /api/donations/${da}/accept"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/donations/${da}/receive-dropoff"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/title-records"
              payload: { donation_id: "${da}", title_number: "CA-TTL-A", owner_name: "Dora Nate" }
              as: TitleClerk
              captures: { ta: $.data.id }
            - call: "POST /api/title-records/${ta}/submit-dmv"
              payload: {}
              as: TitleClerk
            - call: "POST /api/title-records/${ta}/dmv-decision"
              payload: { outcome: "CLEARED" }
              as: TitleClerk
            - call: "POST /api/auction-lots"
              payload: { donation_id: "${da}", venue_id: "${ve1}", lot_number: "L-A", reserve_price_cents: 1000 }
              as: AuctionManager
              captures: { la: $.data.id }
            - call: "GET /api/donations/${da}"
              as: AuctionManager
              captures: { da_v: $.data.version }
            - call: "POST /api/auction-lots/${la}/record-sale"
              payload: { sale_price_cents: 19846, expected_donation_version: "${da_v}" }
              as: AuctionManager
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "PHONE", declared_condition: "FAIR", pickup_required: false }
              as: IntakeAgent
              captures: { db: $.data.id }
            - call: "POST /api/donations/${db}/accept"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/donations/${db}/receive-dropoff"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/title-records"
              payload: { donation_id: "${db}", title_number: "CA-TTL-B", owner_name: "Dora Nate" }
              as: TitleClerk
              captures: { tb: $.data.id }
            - call: "POST /api/title-records/${tb}/submit-dmv"
              payload: {}
              as: TitleClerk
            - call: "POST /api/title-records/${tb}/dmv-decision"
              payload: { outcome: "CLEARED" }
              as: TitleClerk
            - call: "POST /api/auction-lots"
              payload: { donation_id: "${db}", venue_id: "${ve1}", lot_number: "L-B", reserve_price_cents: 1000 }
              as: AuctionManager
              captures: { lb: $.data.id }
            - call: "GET /api/donations/${db}"
              as: AuctionManager
              captures: { db_v: $.data.version }
            - call: "POST /api/auction-lots/${lb}/record-sale"
              payload: { sale_price_cents: 14286, expected_donation_version: "${db_v}" }
              as: AuctionManager
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "PARTNER", declared_condition: "POOR", pickup_required: false }
              as: IntakeAgent
              captures: { dc: $.data.id }
            - call: "POST /api/donations/${dc}/accept"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/donations/${dc}/receive-dropoff"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/title-records"
              payload: { donation_id: "${dc}", title_number: "CA-TTL-C", owner_name: "Dora Nate" }
              as: TitleClerk
              captures: { tc: $.data.id }
            - call: "POST /api/title-records/${tc}/submit-dmv"
              payload: {}
              as: TitleClerk
            - call: "POST /api/title-records/${tc}/dmv-decision"
              payload: { outcome: "CLEARED" }
              as: TitleClerk
            - call: "POST /api/auction-lots"
              payload: { donation_id: "${dc}", venue_id: "${ve1}", lot_number: "L-C", reserve_price_cents: 1000 }
              as: AuctionManager
              captures: { lc: $.data.id }
            - call: "GET /api/donations/${dc}"
              as: AuctionManager
              captures: { dc_v: $.data.version }
            - call: "POST /api/auction-lots/${lc}/record-sale"
              payload: { sale_price_cents: 10836, expected_donation_version: "${dc_v}" }
              as: AuctionManager
            - call: "POST /api/remittance-batches"
              payload: { charity_id: "${c1}", period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-08-01T00:00:00Z" }
              as: FinanceOfficer
              captures: { b1: $.data.id }
          trigger:
            - call: "GET /api/remittance-batches/${b1}"
              as: FinanceOfficer
              captures: { b1_prov: $.data.provisional_fee_cents }
            - call: "POST /api/remittance-batches/${b1}/close"
              payload: {}
              as: FinanceOfficer
          assert:
            - "Donation.${da}.net_to_charity_cents == 12346"
            - "Donation.${db}.net_to_charity_cents == 6786"
            - "Donation.${dc}.net_to_charity_cents == 3336"
            - "before close, RemittanceBatch.${b1}.provisional_fee_cents == 2247"
            - "after close, RemittanceBatch.${b1}.gross_cents == 22468"
            - "after close, RemittanceBatch.${b1}.fee_cents == 2248"
            - "after close, RemittanceBatch.${b1}.net_cents == 20220"
            - "after close, RemittanceBatch.${b1}.donation_count == 3"
            - "RemittanceBatch.${b1}.fee_cents - RemittanceBatch.${b1}.provisional_fee_cents == 1"

  - rule_id: combinatorial_formula
    instances:
      - name: fmv_three_factor_product_with_salvage_cap_and_floor
        grounds:
          - calculations.vehicle_fmv_estimate
          - entities.Vehicle.fields.fmv_estimate_cents
          - entities.Vehicle.fields.salvage_flag
          - entities.Vehicle.fields.odometer_miles
          - entities.Vehicle.fields.condition_grade
        distinguishing_aspect: |
          Mode (a): a four-input non-linear formula (base value x condition multiplier x
          odometer-tier multiplier, then nested min for the salvage cap and max for the floor),
          where three vehicles sharing the same code path land on three different branches.
        test_recipe:
          setup:
            - "three drop-off donations exist for the same donor and charity"
            - "vehicle vs is salvage-flagged with base 900000, inspected GOOD at 60000 miles"
            - "vehicle vp is not salvage-flagged with base 900000, inspected GOOD at 60000 miles"
            - "vehicle vf has base 50000, inspected SALVAGE at 200000 miles"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Wheels For Hope", ein: "91-3333333", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "fmv@example.com", full_name: "Fern Mv", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "EXCELLENT", pickup_required: false }
              as: IntakeAgent
              captures: { ds: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "EXCELLENT", pickup_required: false }
              as: IntakeAgent
              captures: { dp: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "EXCELLENT", pickup_required: false }
              as: IntakeAgent
              captures: { df: $.data.id }
            - call: "POST /api/vehicles"
              payload: { donation_id: "${ds}", vin: "VINSALVAGE0000001", year: 2018, make: "Toyota", model: "Camry", base_book_value_cents: 900000, salvage_flag: true }
              as: IntakeAgent
              captures: { vs: $.data.id }
            - call: "POST /api/vehicles"
              payload: { donation_id: "${dp}", vin: "VINPLAIN000000001", year: 2018, make: "Toyota", model: "Camry", base_book_value_cents: 900000 }
              as: IntakeAgent
              captures: { vp: $.data.id }
            - call: "POST /api/vehicles"
              payload: { donation_id: "${df}", vin: "VINFLOOR000000001", year: 2002, make: "Ford", model: "Taurus", base_book_value_cents: 50000 }
              as: IntakeAgent
              captures: { vf: $.data.id }
          trigger:
            - call: "PATCH /api/vehicles/${vs}"
              payload: { odometer_miles: 60000, condition_grade: "GOOD" }
              as: AuctionManager
              captures: { vs_fmv: $.data.fmv_estimate_cents }
            - call: "PATCH /api/vehicles/${vp}"
              payload: { odometer_miles: 60000, condition_grade: "GOOD" }
              as: AuctionManager
              captures: { vp_fmv: $.data.fmv_estimate_cents }
            - call: "PATCH /api/vehicles/${vf}"
              payload: { odometer_miles: 200000, condition_grade: "SALVAGE" }
              as: AuctionManager
              captures: { vf_fmv: $.data.fmv_estimate_cents }
          assert:
            - "Vehicle.${vp}.fmv_estimate_cents == 765000"
            - "Vehicle.${vs}.fmv_estimate_cents == 75000"
            - "Vehicle.${vf}.fmv_estimate_cents == 10000"
            - "Vehicle.${vs}.fmv_variant == POST_INSPECTION and Vehicle.${vs}.inspected == true"
            - "Donation.${dp}.fmv_estimate_cents == 765000"
            - "Donation.${ds}.fmv_estimate_cents == 75000"
            - "Donation.${df}.fmv_estimate_cents == 10000"
            - "before the PATCH calls, Vehicle.${vp}.fmv_estimate_cents == 900000 because declared_condition EXCELLENT and a null odometer force both multipliers to 1.00"

      - name: proceeds_waterfall_tow_allowance_evaluation_order
        grounds:
          - calculations.donation_net_proceeds
          - entities.Donation.fields.program_fee_cents
          - entities.Donation.fields.tow_allowance_cents
          - entities.Donation.fields.net_to_charity_cents
          - entities.PickupOrder.fields.actual_tow_cost_cents
        distinguishing_aspect: |
          Mode (c): the tow allowance cap is a fraction of a net that itself depends on the
          program fee, so the scaffold pins the evaluation order; capping against gross
          (0.25 x 120000 = 30000) instead of the provisional net (0.25 x 105600 = 26400)
          would produce net_to_charity_cents 73100 instead of the pinned 76700.
        test_recipe:
          setup:
            - "logical clock is 2026-07-05T00:00:00Z"
            - "vendor Hauler One has capacity 5 and is ACTIVE"
            - "donation dt requires pickup; its tow completed with actual_tow_cost_cents 40000"
            - "title tt is CLEARED and lot lt is LISTED at venue ve1 with reserve 50000"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/charities"
              payload: { name: "Wheels For Hope", ein: "91-4444444", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "tow@example.com", full_name: "Tow Ner", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/tow-vendors"
              payload: { name: "Hauler One", service_state_code: "CA", hourly_rate_cents: 12000, daily_capacity_slots: 5 }
              as: ProgramAdmin
              captures: { tv1: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Bay Auto Auction", venue_type: "AUCTION", state_code: "CA" }
              as: ProgramAdmin
              captures: { ve1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "PHONE", declared_condition: "GOOD", pickup_required: true }
              as: IntakeAgent
              captures: { dt: $.data.id }
            - call: "POST /api/donations/${dt}/accept"
              payload: {}
              as: IntakeAgent
              captures: { dt_v1: $.data.version }
            - call: "POST /api/pickup-orders"
              payload: { donation_id: "${dt}", tow_vendor_id: "${tv1}", scheduled_start_utc: "2026-07-06T09:00:00Z", scheduled_end_utc: "2026-07-06T11:00:00Z", expected_donation_version: "${dt_v1}" }
              as: IntakeAgent
              captures: { po1: $.data.id }
            - call: "POST /api/pickup-orders/${po1}/complete"
              payload: { actual_tow_cost_cents: 40000 }
              as: IntakeAgent
            - call: "POST /api/title-records"
              payload: { donation_id: "${dt}", title_number: "CA-TTL-T", owner_name: "Tow Ner" }
              as: TitleClerk
              captures: { tt: $.data.id }
            - call: "POST /api/title-records/${tt}/submit-dmv"
              payload: {}
              as: TitleClerk
            - call: "POST /api/title-records/${tt}/dmv-decision"
              payload: { outcome: "CLEARED" }
              as: TitleClerk
            - call: "POST /api/auction-lots"
              payload: { donation_id: "${dt}", venue_id: "${ve1}", lot_number: "L-T", reserve_price_cents: 50000 }
              as: AuctionManager
              captures: { lt: $.data.id }
            - call: "GET /api/donations/${dt}"
              as: AuctionManager
              captures: { dt_v2: $.data.version }
          trigger:
            - call: "POST /api/auction-lots/${lt}/record-sale"
              payload: { sale_price_cents: 120000, expected_donation_version: "${dt_v2}" }
              as: AuctionManager
          assert:
            - "Donation.${dt}.gross_proceeds_cents == 120000"
            - "Donation.${dt}.program_fee_cents == 14400"
            - "Donation.${dt}.tow_allowance_cents == 26400"
            - "Donation.${dt}.net_to_charity_cents == 76700"
            - "Donation.${dt}.status == SOLD and Donation.${dt}.payout_status == ACCRUED"
            - "CharityAffiliate.${c1}.pledged_balance_cents == 76700"
            - "GET /api/donations/${dt}/ledger-entries returns 4 entries with amount_cents 120000, 14400, 26400 and 2500"

  - rule_id: non_linear_state_machine
    instances:
      - name: title_record_reject_resubmit_cycle_hits_resubmit_limit
        grounds:
          - state_machines.TitleRecord.SUBMITTED_to_REJECTED
          - state_machines.TitleRecord.REJECTED_to_SUBMITTED
          - entities.TitleRecord.fields.rejection_count
          - validations[priority=15]
          - errors[ERR_TITLE_RESUBMIT_LIMIT]
        distinguishing_aspect: |
          Non-linearity here is a CYCLE on TitleRecord: SUBMITTED -> REJECTED -> SUBMITTED runs
          twice and the third rejection (rejection_count 3 > TITLE_RESUBMIT_LIMIT 2) closes the
          loop with ERR_TITLE_RESUBMIT_LIMIT.
        test_recipe:
          setup:
            - "donation dr is ACCEPTED"
            - "title tr exists in DRAFT"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Wheels For Hope", ein: "91-5555555", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "title@example.com", full_name: "Tia Tel", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "FAIR", pickup_required: false }
              as: IntakeAgent
              captures: { dr: $.data.id }
            - call: "POST /api/donations/${dr}/accept"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/title-records"
              payload: { donation_id: "${dr}", title_number: "CA-TTL-R", owner_name: "Tia Tel" }
              as: TitleClerk
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /api/title-records/${tr}/submit-dmv"
              payload: {}
              as: TitleClerk
            - call: "POST /api/title-records/${tr}/dmv-decision"
              payload: { outcome: "REJECTED", rejection_reason: "signature mismatch" }
              as: TitleClerk
            - call: "POST /api/title-records/${tr}/resubmit"
              payload: { owner_name: "Tia Tel" }
              as: TitleClerk
            - call: "POST /api/title-records/${tr}/dmv-decision"
              payload: { outcome: "REJECTED", rejection_reason: "odometer statement missing" }
              as: TitleClerk
            - call: "POST /api/title-records/${tr}/resubmit"
              payload: { owner_name: "Tia Tel" }
              as: TitleClerk
            - call: "POST /api/title-records/${tr}/dmv-decision"
              payload: { outcome: "REJECTED", rejection_reason: "lien release absent" }
              as: TitleClerk
            - call: "POST /api/title-records/${tr}/resubmit"
