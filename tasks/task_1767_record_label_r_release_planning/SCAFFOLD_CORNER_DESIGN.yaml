# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Record Label A&R & Release Planning
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: artist_creation_computes_scouting_score
        claim_type: computed_fields
        grounds: [calculations.scouting_score, entities.Artist.fields.scouting_score]
        distinguishing_aspect: "POST /api/artists ignores any client-supplied score and computes 56.1 from the four metrics and the POP genre multiplier."
        test_recipe:
          setup: ["Empty DB; label with defaults"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label E1" }, as: LabelAdmin, captures: { label_id: $.data.id } }
          trigger:
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist E1", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id, score: $.data.scouting_score } }
          assert:
            - "Artist.scouting_score == 56.1 (computed: raw 51.0 x POP multiplier 1.10)"
            - "Artist.status == SCOUTED; id is a UUID; created_at/updated_at/version present with version == 1"

      - name: label_creation_applies_config_defaults
        claim_type: defaults
        grounds: [entities.Label.fields.advance_cap_cents, entities.Label.fields.tier_thresholds]
        distinguishing_aspect: "Creating a label with only a name materializes every config default (advance cap 5000000, reserve 1000 bps, lead 21 days, tier table)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/labels", payload: { name: "Label E2" }, as: LabelAdmin, captures: { label_id: $.data.id } }
          assert:
            - "Label.advance_cap_cents == 5000000 and reserve_rate_bps == 1000 and sign_threshold_score == 40.0"
            - "Label.release_lead_days == 21, beat_pre_release_days == 42, beat_post_release_days == 30, campaign_gap_days == 7, option_window_days == 90"
            - "Label.tier_thresholds == [{units:0,delta_bps:0},{units:500000,delta_bps:200},{units:2000000,delta_bps:300}]"

      - name: contract_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent contract id returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/contracts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: LabelAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status 404; response_type == error"

      - name: memo_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required advance_cents from the memo create body is rejected with 400 ERR_INVALID_REQUEST before any state change."
        test_recipe:
          setup: ["Label; SCOUTED artist"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label E4" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist E4", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
          trigger:
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST; no DealMemo is created (GET /api/artists/${artist_id}/deal-memos returns total_count 0)"

      - name: revenue_report_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.RevenueReport]
        distinguishing_aspect: "RevenueReport has common_fields false: the read payload exposes id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Label; funded contract (advance 0); SINGLE release LIVE; distributor DSP"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label E5" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist E5", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-E5", project_type: "SINGLE", budget_cents: 100000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/tracks", payload: { title: "TE5", duration_seconds: 200, isrc: "USRC20000001" }, as: AnRManager, captures: { trk_id: $.data.id } }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/contracts/${contract_id}/releases", payload: { project_id: "${proj_id}", title: "R-E5", release_type: "SINGLE", release_date: "2026-09-01", track_ids: ["${trk_id}"] }, as: AnRManager, captures: { rel_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/assemble", payload: {}, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/lock-assets", payload: { cover_art_confirmed: true }, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/schedule", payload: {}, as: MarketingManager }
            - { call: "POST /api/distributors", payload: { label_id: "${label_id}", name: "DSP-E5", channel_type: "DSP" }, as: LabelAdmin, captures: { dist_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/deliveries", payload: { distributor_ids: ["${dist_id}"] }, as: MarketingManager, captures: { del_id: "$.data[0].id" } }
            - { call: "POST /api/asset-deliveries/${del_id}/transmit", payload: {}, as: MarketingManager }
            - { call: "POST /api/asset-deliveries/${del_id}/acknowledge", payload: {}, as: MarketingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: LabelAdmin }
            - { call: "POST /api/releases/${rel_id}/go-live", payload: {}, as: MarketingManager }
          trigger:
            - { call: "POST /api/revenue-reports", payload: { label_id: "${label_id}", distributor_id: "${dist_id}", release_id: "${rel_id}", period: "2026-Q3", channel: "STREAMING", units: 100, gross_revenue_cents: 9900 }, as: FinanceController, captures: { rep_id: $.data.id } }
            - { call: "GET /api/revenue-reports/${rep_id}", payload: {}, as: FinanceController }
          assert:
            - "Response contains id and created_at but no version and no updated_at (common_fields false)"
            - "gross_revenue_cents == 9900 and units == 100 echoed verbatim"

      - name: track_version_self_reference_lineage
        claim_type: parent_relationships
        grounds: [entities.Track.fields.version_of_track_id]
        distinguishing_aspect: "A radio-edit track records version_of_track_id pointing at the original; the reverse lookup GET /api/tracks?version_of_track_id returns exactly the edit."
        test_recipe:
          setup: ["Label; funded contract; project RECORDING with track T1"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label E6" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist E6", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-E6", project_type: "ALBUM", budget_cents: 100000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/tracks", payload: { title: "T1-orig", duration_seconds: 200, isrc: "USRC20000002" }, as: AnRManager, captures: { trk1: $.data.id } }
          trigger:
            - { call: "POST /api/recording-projects/${proj_id}/tracks", payload: { title: "T1-radio-edit", duration_seconds: 180, isrc: "USRC20000003", version_of_track_id: "${trk1}" }, as: AnRManager, captures: { trk2: $.data.id } }
            - { call: "GET /api/tracks", payload: { version_of_track_id: "${trk1}" }, as: AnRManager, captures: { child_id: "$.data[0].id" } }
          assert:
            - "Track.${trk2}.version_of_track_id == ${trk1}"
            - "GET /api/tracks?version_of_track_id=${trk1} returns exactly [${trk2}] (total_count == 1)"

  - section: state_machines
    instances:
      - name: memo_initial_state_draft_then_propose_valid
        claim_type: initial_state
        grounds: ["state_machines.DealMemo.DRAFT_to_PROPOSED"]
        distinguishing_aspect: "A new memo starts in DRAFT; propose moves it to PROPOSED and flips the artist SCOUTED -> IN_NEGOTIATION."
        test_recipe:
          setup: ["Label; SCOUTED artist (score 56.1)"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label S1" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist S1", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
          trigger:
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 50000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id, memo_status: $.data.status } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager, captures: { memo_status2: $.data.status } }
          assert:
            - "Created with status == DRAFT (initial_state)"
            - "After propose: status == PROPOSED and Artist.${artist_id}.status == IN_NEGOTIATION"

      - name: memo_propose_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.DealMemo.DRAFT_to_PROPOSED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "propose is declared only from DRAFT; a second propose on the PROPOSED memo fails with ERR_INVALID_STATE and changes nothing."
        test_recipe:
          setup: ["Label; artist; memo PROPOSED"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label S2" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist S2", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 50000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
          trigger:
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (HTTP 409); DealMemo.${memo_id}.status remains PROPOSED and round_count == 0"

      - name: milestone_reject_resubmit_cycle
        claim_type: valid_transition
        grounds: ["state_machines.RecordingMilestone.REJECTED_to_SUBMITTED"]
        distinguishing_aspect: "The rework loop REJECTED -> SUBMITTED is legal: submit, reject, submit again, approve — the milestone ends APPROVED with budget committed."
        test_recipe:
          setup: ["Label; funded contract; project RECORDING; milestone payment 50000"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label S3" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist S3", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-S3", project_type: "SINGLE", budget_cents: 100000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/milestones", payload: { name: "M1", sequence: 1, due_date: "2026-09-01", payment_cents: 50000 }, as: AnRManager, captures: { ms_id: $.data.id } }
          trigger:
            - { call: "POST /api/milestones/${ms_id}/submit", payload: {}, as: AnRManager }
            - { call: "POST /api/milestones/${ms_id}/reject", payload: {}, as: LabelAdmin }
            - { call: "POST /api/milestones/${ms_id}/submit", payload: { deliverable_note: "v2 mixes attached" }, as: AnRManager }
            - { call: "POST /api/milestones/${ms_id}/approve", payload: {}, as: LabelAdmin, captures: { ms_status: $.data.status } }
          assert:
            - "RecordingMilestone.${ms_id} walked SUBMITTED -> REJECTED -> SUBMITTED -> APPROVED"
            - "RecordingProject.${proj_id}.committed_cents == 50000 after approve"

      - name: project_delivered_compound_gate
        claim_type: precondition_enforcement
        grounds: ["state_machines.RecordingProject.POST_PRODUCTION_to_DELIVERED"]
        distinguishing_aspect: "Compound gate: DELIVERED requires every milestone PAID and every track MASTERED+; with an APPROVED-but-unpaid milestone the advance fails, and succeeds after pay."
        test_recipe:
          setup: ["Label; funded contract; project POST_PRODUCTION with milestone APPROVED 50000 and one MASTERED track"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label S4" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist S4", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-S4", project_type: "SINGLE", budget_cents: 100000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/milestones", payload: { name: "M1", sequence: 1, due_date: "2026-09-01", payment_cents: 50000 }, as: AnRManager, captures: { ms_id: $.data.id } }
            - { call: "POST /api/milestones/${ms_id}/submit", payload: {}, as: AnRManager }
            - { call: "POST /api/milestones/${ms_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/recording-projects/${proj_id}/tracks", payload: { title: "TS4", duration_seconds: 200, isrc: "USRC20000011" }, as: AnRManager, captures: { trk_id: $.data.id } }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/advance-stage", payload: {}, as: AnRManager }
          trigger:
            - { call: "POST /api/recording-projects/${proj_id}/advance-stage", payload: {}, as: AnRManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/milestones/${ms_id}/pay", payload: {}, as: FinanceController }
            - { call: "POST /api/recording-projects/${proj_id}/advance-stage", payload: {}, as: AnRManager, captures: { proj_status: $.data.status } }
          assert:
            - "First advance from POST_PRODUCTION: error_id == ERR_INVALID_STATE (milestone APPROVED, not PAID)"
            - "After pay: advance succeeds — RecordingProject.${proj_id}.status == DELIVERED"
            - "RecordingProject.spent_cents == 50000 and RecoupmentAccount.recording_balance_cents == 50000"

      - name: statement_paid_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.RoyaltyStatement"]
        distinguishing_aspect: "PAID is terminal: dispute and a second pay on a PAID statement both fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Label; MASTER_ONLY contract advance 100000 disbursed; release LIVE; STREAMING report gross 1000000; run CALCULATED then FINALIZED; statement FINAL (net 40000)"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label S5" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist S5", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 100000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/disburse-advance", payload: {}, as: FinanceController }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-S5", project_type: "SINGLE", budget_cents: 100000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/tracks", payload: { title: "TS5", duration_seconds: 200, isrc: "USRC20000012" }, as: AnRManager, captures: { trk_id: $.data.id } }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/contracts/${contract_id}/releases", payload: { project_id: "${proj_id}", title: "R-S5", release_type: "SINGLE", release_date: "2026-09-01", track_ids: ["${trk_id}"] }, as: AnRManager, captures: { rel_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/assemble", payload: {}, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/lock-assets", payload: { cover_art_confirmed: true }, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/schedule", payload: {}, as: MarketingManager }
