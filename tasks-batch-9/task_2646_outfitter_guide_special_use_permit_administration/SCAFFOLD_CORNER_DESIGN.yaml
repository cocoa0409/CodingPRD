      - name: demand_ratio_rounds_half_up_at_the_fourth_decimal
        claim_type: precision
        grounds:
          - calculations.use_area_service_day_availability.precision
          - calculations.allocatable_service_day_conservation.precision
        distinguishing_aspect: |
          1/32 = 0.03125 is an exact binary fraction whose fifth decimal is a lone 5, so half-up
          (0.0313) and truncation or banker's rounding (0.0312) disagree. The follow-up 4/32 = 0.125
          must be reported as 0.1250 at four places, so a stringified ratio cannot drop trailing
          zeros, while the day counts themselves stay exact integers with no rounding anywhere.
        test_recipe:
          setup:
            - "TIN-03 with total_allocated_service_days 32 and no reserved days, plus a PUBLISHED 2027 assessment for 32 days"
            - "Alpine files a 1-day application and a 3-day application, both submitted"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "TIN-03", name: "Tin Cup Basin", total_allocated_service_days: 32, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 4, max_clients_per_guide: 4 }
