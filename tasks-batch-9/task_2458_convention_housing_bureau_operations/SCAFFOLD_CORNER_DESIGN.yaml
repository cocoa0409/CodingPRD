  # ===================================================================================
  # SECTION 6 — ERRORS (triggerability)
  # ===================================================================================
  - section: errors
    instances:
      - name: missing_x_user_headers_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=10]
        distinguishing_aspect: "The auth rung fires before any payload parsing: an otherwise perfectly valid event creation sent with no X-User-Role / X-User-ID headers returns 401 ERR_UNAUTHENTICATED and persists nothing."
        test_recipe:
          setup: ["Empty system."]
          setup_api_calls: []
          trigger:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: NONE
          assert:
            - "response HTTP status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "a subsequent authenticated POST /housing/events with code SUM26 returns 201, proving nothing was persisted"

      - name: pickup_report_for_another_hotels_block_forbidden
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations[priority=40]
        distinguishing_aspect: "HotelManager is entity-backed: manager of hotel B filing a pickup report on hotel A's block returns 403 ERR_NOT_RESOURCE_OWNER even though the role itself is allowed on the endpoint."
        test_recipe:
          setup: ["Two hotels; one CONTRACTED block on hotel A."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
