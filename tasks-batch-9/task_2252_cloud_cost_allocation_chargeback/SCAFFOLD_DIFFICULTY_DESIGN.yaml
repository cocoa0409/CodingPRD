              as_user_id: "analyst-1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /finops/tagging-policies/${pol_id}/activate"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/provisioning-requests"
              payload: { tagging_policy_id: "${pol_id}", business_unit_id: "${bu_a_id}", resource_kind: "COMPUTE", requested_tags: { team: "platform", environment: "dev", application: "api" }, monthly_run_rate_cents: 1000000, owner_user_id: "owner-1" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { pr1_id: "$.data.id" }
            - call: "POST /finops/provisioning-requests/${pr1_id}/approve"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/provisioning-requests/${pr1_id}/provision"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "GET /finops/cloud-resources"
              payload: { provisioning_request_id: "${pr1_id}" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { res1_id: "$.data[0].id" }
            - call: "POST /finops/provisioning-requests"
              payload: { tagging_policy_id: "${pol_id}", business_unit_id: "${bu_a_id}", resource_kind: "COMPUTE", requested_tags: { team: "platform", environment: "prod", application: "api" }, monthly_run_rate_cents: 30000, owner_user_id: "owner-1" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { pr2_id: "$.data.id" }
            - call: "POST /finops/provisioning-requests/${pr2_id}/approve"
              payload: {}
