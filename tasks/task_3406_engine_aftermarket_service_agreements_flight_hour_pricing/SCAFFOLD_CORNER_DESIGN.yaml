  - section: endpoints
    instances:
      - name: response_envelope_shape_success_and_error
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every response carries the fixed envelope: meta.api_request_id + meta.api_request_timestamp + response_type + data on success; data.error_id + data.message on error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/operators"
              payload: { name: "Echo Envelope", iata_code: "E9", credit_rating: "A" }
              as: PlatformAdmin
              captures: { env_id: $.data.id }
            - call: "GET /api/agreements/11111111-2222-3333-4444-555555555555"
              as: PlatformAdmin
              captures: { env_err: $.data.error_id }
          assert:
            - "success response contains meta.api_request_id, meta.api_request_timestamp, response_type == object, and data.id == captured env_id"
            - "error response has response_type == error and data carries error_id ERR_AGREEMENT_NOT_FOUND plus a message string"
  - section: errors
    instances:
      - name: error_mandatory_directive_open
        claim_type: violation_to_error
        grounds: ["errors[ERR_MANDATORY_DIRECTIVE_OPEN]"]
        excluded_because:
          difficulty_instance: complete_safety_beats_referential
          rationale: "ERR_MANDATORY_DIRECTIVE_OPEN is the asserted outcome of the named rule-5 instance."
      - name: error_shop_capacity_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHOP_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: shop_daily_induction_capacity
          rationale: "ERR_SHOP_CAPACITY_EXCEEDED is the asserted outcome of the named rule-8 instance."
      - name: error_lease_window_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_LEASE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: spare_engine_half_open_exclusion
          rationale: "ERR_LEASE_WINDOW_OVERLAP is the asserted outcome of the named rule-8 instance."
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_approve_and_get
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "The approval mutation is visible in the approving response itself and in an immediate re-read (no lag): status APPROVED and decided_at set in both."
        test_recipe:
          setup: ["visit INDUCTED with a SUBMITTED workscope"]
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Birch Air", iata_code: "B2", credit_rating: "B" }
              as: PlatformAdmin
              captures: { opc41: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${opc41}", esn: "ESN-B201", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { ec41: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-R4101", base_rate_per_fh_usd: 100.00, escalation_pct: 0.0, escalation_anchor_date: "2026-09-01T00:00:00Z", start_date: "2026-09-01T00:00:00Z", end_date: "2027-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW"], max_workscope_cost_usd: 1000000 }
              as: ContractManager
              captures: { ac41: $.data.id }
            - call: "POST /api/agreements/${ac41}/activate"
              as: ContractManager
            - call: "POST /api/agreements/${ac41}/enroll"
              payload: { engine_id: "${ec41}", assumed_annual_hours: 2400, assumed_cycles_per_month: 100 }
              as: ContractManager
            - call: "POST /api/engines/${ec41}/shop-visits"
              payload: { planned_induction_date: "2026-09-01T00:00:00Z" }
              as: Operator
              as_user_id: "${opc41}"
              captures: { vc41: $.data.id }
            - call: "POST /api/shop-visits/${vc41}/induct"
              as: ShopPlanner
              captures: { vc41_ver: $.data.version }
            - call: "POST /api/shop-visits/${vc41}/workscopes"
              payload:
                expected_shop_visit_version: "${vc41_ver}"
                items:
                  - { item_code: "MO-1", item_type: "MODULE_OVERHAUL", estimated_cost_usd: 100000, restores_cycles: 8000, directive_ref: null }
              as: ShopPlanner
              captures: { wc41: $.data.id }
          trigger:
            - call: "POST /api/workscopes/${wc41}/approve"
              as: Operator
              as_user_id: "${opc41}"
              captures: { w41_status: $.data.status }
            - call: "GET /api/workscopes/${wc41}"
              as: FinanceController
              captures: { w41_status2: $.data.status, w41_decided: $.data.decided_at }
          assert:
            - "captured w41_status == APPROVED (mutation visible in the same response)"
            - "captured w41_status2 == APPROVED and w41_decided is non-null on immediate re-read"
