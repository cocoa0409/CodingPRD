# =============================================================================
# Task 3316 — Integrated Resource Planning & Generation Retirement Sequencing
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Integrated Resource Planning & Generation Retirement Sequencing (Duke Energy): load forecast development across residential, commercial, industrial and electrification scenarios, resource portfolio modeling across generation types, storage, demand response and transmission with reliability constraints, retirement analysis for aging units considering environmental compliance costs, fuel and replacement capacity timing, stakeholder process with public comment, intervenor testimony and commission review of the plan, capacity accreditation methods that determine how much each resource counts toward reliability requirements, sensitivity analysis on fuel prices, policy changes and technology costs, procurement plans and competitive solicitation commitments arising from the approved plan, plan updates on a statutory cycle with deviation reporting

domain_name: integrated-resource-planning
api_prefix: ""   # endpoints are root-mounted; the plan aggregate lives at /plans, peers at /resources, /candidates, etc.

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - "optimistic_concurrency"
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "scheduled_deferred_actions"
  entity_topology: hybrid          # Plan tree (forecast/scenario/snapshot/testimony) + flat Resource/Candidate + junction Position
  state_machine_shape: branching   # approve-with-conditions / reject loops, cycle-bounded reopen, parallel procurement tracks
  relationship_patterns:
    - one_to_many
    - many_to_many                 # Position joins ResourceCandidate x ResourcePortfolio
    - cross_aggregate              # Candidate.global_sequence_index spans portfolios; Snapshot.fuel_price_usd_per_mmbtu referenced across entities
  role_model: approval_chain       # UtilityPlanner -> Intervener (testimony) -> Commissioner (review) + segregation_of_duties on commitments
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (11 entities)
# =============================================================================
entities:
  - name: ResourcePlan
    parent: null
    common_fields: true            # id, created_at, updated_at, version
    fields:
      - { name: plan_name, type: string, source: input, description: "Human-readable plan name" }
      - { name: cycle_year, type: integer, source: input, description: "Statutory cycle year the plan is filed under; each plan belongs to exactly one cycle_year" }
      - { name: planning_horizon_years, type: integer, source: input, description: "Number of calendar years modeled; must be >= 10" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN_FOR_COMMENT | UNDER_REVIEW | APPROVED | APPROVED_WITH_CONDITIONS | REJECTED | SUPERSEDED" }
      - { name: comment_window_opens_on, type: string, source: system, description: "ISO date (YYYY-MM-DD); set on open-comment transition; resolution DATE — comparisons against logical clock use the clock's calendar date" }
      - { name: comment_window_closes_on, type: string, source: system, description: "ISO date; = comment_window_opens_on + 30 calendar days; resolution DATE" }
      - { name: submitted_on, type: string, source: system, description: "ISO date set on DRAFT->OPEN_FOR_COMMENT; immutable once set; used for cycle-year deadline check" }
      - { name: approved_snapshot_id, type: string, source: system, description: "Reference to ReliabilitySnapshot.id (server-set on approval; nullable); set to the most recent (by created_at DESC, id tie-break forbidden — ties broken by created_at only, then server rejects ambiguity) ReliabilitySnapshot of the preferred portfolio" }
      - { name: preferred_portfolio_id, type: string, source: system, description: "Reference to ResourcePortfolio.id (server-set at submit-for-review; nullable); the single portfolio whose preferred_flag == true" }
      - { name: reopen_count, type: integer, source: system, description: "Number of REJECTED->DRAFT reopen transitions performed on this plan; starts 0; hard cap REOPEN_LIMIT = 2" }

  - name: LoadForecast
    parent: ResourcePlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> ResourcePlan.id; owning plan" }
      - { name: scenario_tag, type: enum, source: input, description: "BASE | HIGH_ELECTRIFICATION | LOW_GROWTH" }
      - { name: forecast_year, type: integer, source: input, description: "Calendar year this forecast row applies to" }
      - { name: residential_mw, type: number, source: input, description: "Residential class coincident peak contribution (MW, >= 0)" }
      - { name: commercial_mw, type: number, source: input, description: "Commercial class coincident peak contribution (MW, >= 0)" }
      - { name: industrial_mw, type: number, source: input, description: "Industrial class coincident peak contribution (MW, >= 0)" }
      - { name: electrification_mw, type: number, source: input, description: "Transport/building electrification adder (MW, >= 0)" }
      - { name: total_peak_mw, type: number, source: computed, description: "Sum of the four class contributions; 2 decimal places" }
      - { name: effective_load_mw, type: number, source: computed, description: "Effective peak for reliability modeling; variant-aware — see load_forecasting calculation" }
      - { name: locked, type: boolean, source: system, description: "true once the owning plan leaves DRAFT the first time; locked forecasts reject modification" }

  - name: Resource
    parent: null
    common_fields: true
    fields:
      - { name: unit_name, type: string, source: input, description: "Fleet unit name" }
      - { name: resource_type, type: enum, source: input, description: "COAL | GAS_CC | GAS_CT | NUCLEAR | HYDRO | SOLAR | WIND | STORAGE | DEMAND_RESPONSE" }
      - { name: nameplate_mw, type: number, source: input, description: "Installed capacity (MW, > 0)" }
      - { name: in_service_year, type: integer, source: input, description: "Original commercial operation year" }
      - { name: fuel_type, type: enum, source: input, description: "COAL | NATURAL_GAS | URANIUM | WATER | SUN | WIND | NONE; STORAGE and DEMAND_RESPONSE must use NONE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DECIDED | RETIRED | MOTHBALLED" }
      - { name: retirement_year, type: integer, source: system, description: "Calendar year the unit leaves service; set on retire decision; immutable" }
      - { name: decision_year, type: integer, source: system, description: "Calendar year in which the retire decision was taken; gates DER effectivity" }
      - { name: plan_id, type: string, source: system, description: "FK -> ResourcePlan.id; the plan under which retirement was decided (null for pre-existing ACTIVE units)" }

  - name: ResourcePortfolio
    parent: ResourcePlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> ResourcePlan.id; owning plan" }
      - { name: portfolio_name, type: string, source: input, description: "Portfolio label; unique within the plan (case-sensitive)" }
      - { name: preferred_flag, type: boolean, source: input, default: false, description: "At most one portfolio per plan may hold preferred_flag == true" }
      - { name: status, type: enum, source: system, description: "DRAFT | FROZEN" }

  - name: ResourceCandidate
    parent: null
    common_fields: true
    fields:
      - { name: candidate_name, type: string, source: input, description: "Candidate project name; globally unique (case-sensitive)" }
      - { name: resource_type, type: enum, source: input, description: "COAL | GAS_CC | GAS_CT | NUCLEAR | HYDRO | SOLAR | WIND | STORAGE | DEMAND_RESPONSE" }
      - { name: nameplate_mw, type: number, source: input, description: "Offered capacity (MW, > 0)" }
      - { name: online_year, type: integer, source: input, description: "First year of availability; must be >= 2026" }
      - { name: capex_usd_per_kw, type: number, source: input, description: "Overnight capital cost ($/kW, > 0)" }
      - { name: fixed_om_usd_per_kw_year, type: number, source: input, description: "Fixed O&M ($/kW-yr, >= 0)" }
      - { name: fuel_type, type: enum, source: input, description: "COAL | NATURAL_GAS | URANIUM | WATER | SUN | WIND | NONE; STORAGE and DEMAND_RESPONSE must use NONE" }
      - { name: build_lead_years, type: integer, source: input, description: "Years from procurement commitment to online; >= 1" }
      - { name: global_sequence_index, type: integer, source: system, description: "Cross-portfolio chronological tie-break key; assigned as a global counter in candidate creation order, starting at 1; used by screening_levelized_cost tie-breaks" }

  - name: Position
    parent: ResourcePortfolio
    common_fields: false           # id + created_at only; append-only junction, no update
    fields:
      - { name: portfolio_id, type: string, source: system, description: "FK -> ResourcePortfolio.id; owning portfolio" }
      - { name: candidate_id, type: string, source: system, description: "FK -> ResourceCandidate.id; candidate included" }
      - { name: committed_mw, type: number, source: input, description: "MW of the candidate committed in this portfolio (> 0, <= candidate nameplate)" }
      - { name: selected, type: boolean, source: system, description: "true while the position counts toward portfolio totals; set false by remove-position (soft removal, row retained for audit)" }

  - name: ReliabilitySnapshot
    parent: ResourcePortfolio
    common_fields: false           # id + created_at only; computed artifacts, immutable, no version
    fields:
      - { name: portfolio_id, type: string, source: system, description: "FK -> ResourcePortfolio.id; portfolio modeled" }
      - { name: forecast_year, type: integer, source: input, description: "Year modeled; a snapshot with (portfolio_id, forecast_year) is unique" }
      - { name: scenario_tag, type: enum, source: input, description: "Which load forecast scenario this snapshot uses; must equal the plan's BASE scenario unless overridden" }
      - { name: fuel_price_usd_per_mmbtu, type: number, source: input, description: "Natural-gas fuel price assumption ($/MMBtu, > 0) for this snapshot; referenced by retirement analysis and sensitivity scoring" }
      - { name: capacity_margin_mw, type: number, source: computed, description: "accredited_supply_mw - (load_mw * (1 + RESERVE_MARGIN_PCT)); 2 decimal places" }
      - { name: accredited_supply_mw, type: number, source: computed, description: "Sum of accredited MW over active resources and selected positions for forecast_year; 2 decimal places" }
      - { name: load_mw, type: number, source: computed, description: "Effective load for forecast_year under the snapshot's scenario variant; 2 decimal places" }
      - { name: meets_requirement, type: boolean, source: computed, description: "capacity_margin_mw >= 0 (exactly zero PASSES)" }

  - name: RetirementAnalysis
    parent: Resource
    common_fields: true
    fields:
      - { name: resource_id, type: string, source: system, description: "FK -> Resource.id; unit analyzed" }
      - { name: plan_id, type: string, source: system, description: "FK -> ResourcePlan.id; plan the analysis is attached to" }
      - { name: snapshot_id, type: string, source: system, description: "FK -> ReliabilitySnapshot.id; snapshot whose fuel price and capacity margin feed the analysis" }
      - { name: compliance_cost_usd, type: number, source: computed, description: "Total environmental compliance cost over the analysis window; 0 decimal places (round_half_up)" }
      - { name: replacement_cost_usd, type: number, source: computed, description: "Replacement capacity cost over the analysis window; 0 decimal places (round_half_up)" }
      - { name: net_retirement_benefit_usd, type: number, source: computed, description: "compliance_cost_usd - replacement_cost_usd + fixed_om_avoided_usd; 0 decimal places (round_half_up)" }
      - { name: fixed_om_avoided_usd, type: number, source: computed, description: "Sum over window years of FIXED_OM avoided; 0 decimal places (round_half_up)" }
      - { name: recommendation, type: enum, source: computed, description: "RETIRE if net_retirement_benefit_usd > 0 else KEEP" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINAL" }

  - name: PublicComment
    parent: ResourcePlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> ResourcePlan.id; plan commented on" }
      - { name: commenter_name, type: string, source: input, description: "Display name of the commenter" }
      - { name: commenter_email, type: string, source: input, description: "Contact email (free-form string, presence required)" }
      - { name: body, type: string, source: input, description: "Comment text; non-empty after trimming" }
      - { name: status, type: enum, source: system, description: "RECEIVED | ACKNOWLEDGED" }

  - name: IntervenorTestimony
    parent: ResourcePlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> ResourcePlan.id; plan under review" }
      - { name: intervenor_id, type: string, source: system, description: "FK -> Intervenor.id; the registered intervenor filing; must equal X-User-ID of the caller" }
      - { name: topic, type: string, source: input, description: "Testimony topic" }
      - { name: body, type: string, source: input, description: "Testimony text; non-empty" }
      - { name: volume_no, type: integer, source: computed, description: "Per-intervenor per-plan filing ordinal; starts at 1, increments by 1 per non-withdrawn filing" }
      - { name: status, type: enum, source: system, description: "FILED | WITHDRAWN" }

  - name: Intervenor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the intervening party; globally unique (case-sensitive)" }
      - { name: party_type, type: enum, source: input, description: "CONSUMER_ADVOCATE | INDUSTRIAL_GROUP | ENVIRONMENTAL_ORG | MUNICIPALITY" }
      - { name: standing_approved, type: boolean, source: input, default: true, description: "Whether the intervenor has standing to file testimony; defaults true at registration; only standing intervenors may file testimony" }

  - name: SensitivityAnalysis
    parent: ResourcePlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> ResourcePlan.id; plan analyzed" }
      - { name: snapshot_id, type: string, source: system, description: "FK -> ReliabilitySnapshot.id; base snapshot perturbed" }
      - { name: dimension, type: enum, source: input, description: "FUEL_PRICE | POLICY | TECHNOLOGY_COST" }
      - { name: delta_pct, type: number, source: input, description: "Signed perturbation fraction, e.g. 0.25 = +25%; must be within [-0.50, +0.50]" }
      - { name: adjusted_score_usd, type: number, source: computed, description: "Portfolio score under the perturbation; 0 decimal places (round_half_up); variant-aware — see sensitivity_scoring" }
      - { name: base_score_usd, type: number, source: computed, description: "Portfolio score unperturbed; 0 decimal places (round_half_up)" }
      - { name: robust_flag, type: boolean, source: computed, description: "true iff |adjusted_score_usd - base_score_usd| <= ROBUST_TOLERANCE_PCT * base_score_usd" }

  - name: ProcurementCommitment
    parent: ResourcePlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> ResourcePlan.id; approved plan that authorizes the commitment" }
      - { name: candidate_id, type: string, source: system, description: "FK -> ResourceCandidate.id; candidate procured" }
      - { name: committed_mw, type: number, source: input, description: "MW procured; > 0; aggregate committed MW per candidate across all ISSUED commitments must never exceed the candidate's nameplate_mw" }
      - { name: solicitation_type, type: enum, source: input, description: "RFP | SELF_BUILD" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the UtilityPlanner who issued the commitment; server-stamped at ISSUE; used for segregation-of-duties on award" }
      - { name: condition_discharge_ids, type: array, source: input, description: "Array of PlanCondition ids this commitment discharges; may be empty; every listed condition must belong to the same plan and still be OPEN (already-discharged ids are silently ignored)" }
      - { name: status, type: enum, source: system, description: "ISSUED | AWARDED | CANCELLED" }

  - name: PlanCondition
    parent: ResourcePlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> ResourcePlan.id; plan the condition attaches to" }
      - { name: description, type: string, source: input, description: "Condition text imposed by the commission" }
      - { name: required_procurement_mw, type: number, source: input, description: "MW of procurement the condition demands (>= 0); discharged by commitments referencing this condition" }
      - { name: status, type: enum, source: system, description: "OPEN | DISCHARGED" }

  - name: PlanDeviationReport
    parent: ResourcePlan
    common_fields: false            # id + created_at only; periodic reports are immutable filings
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> ResourcePlan.id; approved plan reported against" }
      - { name: report_year, type: integer, source: input, description: "Calendar year the report covers; (plan_id, report_year) unique" }
      - { name: baseline_load_mw, type: number, source: computed, description: "Load from the plan's approved snapshot for report_year" }
      - { name: actual_load_mw, type: number, source: input, description: "Observed coincident peak load (MW, >= 0)" }
      - { name: load_deviation_pct, type: number, source: computed, description: "(actual_load_mw - baseline_load_mw) / baseline_load_mw; 4 decimal places, round_half_up; ERR when baseline_load_mw == 0" }
      - { name: committed_procurement_mw, type: number, source: computed, description: "Sum of committed_mw over this plan's ProcurementCommitments with status in {ISSUED, AWARDED}" }
      - { name: required_procurement_mw, type: number, source: computed, description: "Sum of required_procurement_mw over this plan's PlanConditions with status OPEN" }
      - { name: procurement_deviation_mw, type: number, source: computed, description: "committed_procurement_mw - required_procurement_mw; negative means shortfall; 2 decimal places" }
      - { name: material_breach, type: boolean, source: computed, description: "true iff |load_deviation_pct| > DEVIATION_THRESHOLD_PCT (strictly greater; exactly 0.05 is NOT a breach) OR procurement_deviation_mw < 0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ResourcePlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: OPEN_FOR_COMMENT
        trigger: "POST /plans/{planId}/open-comment"
        actor: UtilityPlanner
        preconditions:
          - "Plan has at least one LoadForecast row with scenario_tag == BASE (ERR_PLAN_MISSING_BASE_FORECAST)"
          - "Plan has at least one ResourcePortfolio (ERR_PLAN_MISSING_PORTFOLIO)"
        side_effects:
          - "Every LoadForecast row of the plan: locked := true"
          - "comment_window_opens_on := logical-clock date; comment_window_closes_on := opens + 30 days; submitted_on := logical-clock date"
          - "Increments ResourcePlan.version by 1"

      - from: OPEN_FOR_COMMENT
        to: UNDER_REVIEW
        trigger: "POST /plans/{planId}/submit-for-review"
        actor: UtilityPlanner
        preconditions:
          - "Logical-clock date >= comment_window_closes_on (ERR_COMMENT_WINDOW_OPEN)"
          - "Plan has at least one ResourcePortfolio with preferred_flag == true (ERR_NO_PREFERRED_PORTFOLIO)"
        side_effects:
          - "Every ResourcePortfolio of the plan: status DRAFT -> FROZEN"
          - "preferred_portfolio_id := the unique preferred portfolio's id"
          - "Increments ResourcePlan.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /plans/{planId}/commission-review with decision=APPROVE"
        actor: Commissioner
        preconditions:
          - "preferred portfolio has at least one ReliabilitySnapshot with meets_requirement == true (ERR_RELIABILITY_NOT_MET)"
        side_effects:
          - "approved_snapshot_id := id of the preferred portfolio's most recent ReliabilitySnapshot by created_at DESC"
          - "Increments ResourcePlan.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /plans/{planId}/commission-review with decision=APPROVE_WITH_CONDITIONS and non-empty conditions[]"
        actor: Commissioner
        preconditions:
          - "preferred portfolio has at least one ReliabilitySnapshot with meets_requirement == true (ERR_RELIABILITY_NOT_MET)"
          - "conditions[] payload non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "For each element of conditions[]: create PlanCondition {description, required_procurement_mw, status=OPEN} under this plan"
          - "approved_snapshot_id := id of the preferred portfolio's most recent ReliabilitySnapshot by created_at DESC"
          - "Increments ResourcePlan.version by 1"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /plans/{planId}/commission-review with decision=REJECT"
        actor: Commissioner
        preconditions: []
        side_effects:
          - "Increments ResourcePlan.version by 1"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /plans/{planId}/reopen"
        actor: UtilityPlanner
        preconditions:
          - "reopen_count < REOPEN_LIMIT (2) (ERR_PLAN_REOPEN_LIMIT)"
        side_effects:
          - "reopen_count += 1"
          - "Every ResourcePortfolio of the plan: status FROZEN -> DRAFT (unfreeze)"
          - "Every LoadForecast row: locked := false"
          - "preferred_portfolio_id := null; approved_snapshot_id := null; comment_window fields := null; submitted_on := null"
          - "Increments ResourcePlan.version by 1"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when another plan with the same cycle_year reaches APPROVED or APPROVED_WITH_CONDITIONS)"
        actor: system
        preconditions: []
        side_effects:
          - "Superseded plan's OPEN PlanConditions remain attached for audit but no new ProcurementCommitment may reference them"
          - "Increments ResourcePlan.version by 1"

      - from: APPROVED_WITH_CONDITIONS
        to: SUPERSEDED
        trigger: "system (automatic when another plan with the same cycle_year reaches APPROVED or APPROVED_WITH_CONDITIONS)"
        actor: system
        preconditions: []
        side_effects:
          - "Same as APPROVED -> SUPERSEDED"
          - "Increments ResourcePlan.version by 1"

  - entity: ResourcePortfolio
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FROZEN
        trigger: "system (automatic on owning plan OPEN_FOR_COMMENT -> UNDER_REVIEW)"
        actor: system
        preconditions: []
        side_effects: ["Increments ResourcePortfolio.version by 1"]
      - from: FROZEN
        to: DRAFT
        trigger: "system (automatic on owning plan REJECTED -> DRAFT reopen)"
        actor: system
        preconditions: []
        side_effects: ["Increments ResourcePortfolio.version by 1"]

  - entity: Resource
    initial_state: ACTIVE
    terminal_states: [RETIRED, MOTHBALLED]
    transitions:
      - from: ACTIVE
        to: DECIDED
        trigger: "POST /resources/{resourceId}/retire"
        actor: UtilityPlanner
        preconditions:
          - "Payload retirement_year >= logical-clock calendar year + MIN_RETIREMENT_LEAD_YEARS (ERR_RETIREMENT_TOO_EARLY)"
          - "Payload plan_id references a plan with status == DRAFT (ERR_PLAN_NOT_DRAFT)"
        side_effects:
          - "Resource.retirement_year := payload retirement_year; decision_year := logical-clock calendar year; plan_id := payload plan_id"
          - "Retire-cascade flag: every ReliabilitySnapshot of every portfolio under that plan with forecast_year >= retirement_year is flagged (its retire_flagged marker set): a flagged snapshot (a) cannot satisfy the commission-review reliability precondition, and (b) does NOT occupy its (portfolio_id, forecast_year) uniqueness slot, so a POST snapshots for the same slot replaces it (recompute clears the flag on the new row)"
          - "Increments Resource.version by 1"
      - from: DECIDED
        to: RETIRED
        trigger: "system (automatic when logical-clock calendar year reaches retirement_year)"
        actor: system
        preconditions: []
        side_effects: ["Increments Resource.version by 1"]
      - from: DECIDED
        to: ACTIVE
        trigger: "POST /resources/{resourceId}/cancel-retirement"
        actor: UtilityPlanner
        preconditions:
          - "No ProcurementCommitment with status in {ISSUED, AWARDED} references a candidate whose positions were justified by this retirement — simplified rule: cancellation is allowed iff the deciding plan (Resource.plan_id) has status in {DRAFT, REJECTED} (ERR_PLAN_NOT_DRAFT)"
        side_effects:
          - "retirement_year := null; decision_year := null; plan_id := null"
          - "Increments Resource.version by 1"
      - from: DECIDED
        to: MOTHBALLED
        trigger: "POST /resources/{resourceId}/mothball"
        actor: UtilityPlanner
        preconditions:
          - "retirement_year <= logical-clock calendar year + 1 (unit must be within one year of leaving service)"
        side_effects: ["Increments Resource.version by 1"]

  - entity: RetirementAnalysis
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "POST /retirement-analyses/{analysisId}/finalize"
        actor: UtilityPlanner
        preconditions: []
        side_effects: ["Increments RetirementAnalysis.version by 1"]
      - from: FINAL
        to: DRAFT
        trigger: "POST /retirement-analyses/{analysisId}/reopen"
        actor: UtilityPlanner
        preconditions:
          - "The analysis's plan has status == DRAFT (ERR_PLAN_NOT_DRAFT)"
        side_effects:
          - "Recomputes compliance_cost_usd, replacement_cost_usd, fixed_om_avoided_usd, net_retirement_benefit_usd, recommendation from the CURRENT snapshot fuel price"
          - "Increments RetirementAnalysis.version by 1"

  - entity: PublicComment
    initial_state: RECEIVED
    terminal_states: []
    transitions:
      - from: RECEIVED
        to: ACKNOWLEDGED
        trigger: "POST /plans/{planId}/comments/{commentId}/acknowledge"
        actor: UtilityPlanner
        preconditions:
          - "Owning plan status == OPEN_FOR_COMMENT (ERR_PLAN_NOT_OPEN_FOR_COMMENT)"
        side_effects: ["Increments PublicComment.version by 1"]

  - entity: IntervenorTestimony
    initial_state: FILED
    terminal_states: []
    transitions:
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /testimonies/{testimonyId}/withdraw"
        actor: Intervener
        preconditions:
          - "X-User-ID == testimony.intervenor_id (ERR_FORBIDDEN)"
          - "Owning plan status == UNDER_REVIEW (ERR_PLAN_NOT_UNDER_REVIEW)"
        side_effects: ["Increments IntervenorTestimony.version by 1"]
      - from: WITHDRAWN
        to: FILED
        trigger: "POST /testimonies/{testimonyId}/refile"
        actor: Intervener
        preconditions:
          - "X-User-ID == testimony.intervenor_id (ERR_FORBIDDEN)"
          - "Owning plan status == UNDER_REVIEW (ERR_PLAN_NOT_UNDER_REVIEW)"
        side_effects:
          - "volume_no is NOT re-assigned (refiled testimony keeps its original volume_no)"
          - "Increments IntervenorTestimony.version by 1"

  - entity: ProcurementCommitment
    initial_state: ISSUED
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: ISSUED
        to: AWARDED
        trigger: "POST /procurement-commitments/{commitmentId}/award"
        actor: Commissioner
        preconditions:
          - "Owning plan status in {APPROVED, APPROVED_WITH_CONDITIONS} (ERR_PLAN_NOT_APPROVED)"
        side_effects:
          - "Each PlanCondition listed in condition_discharge_ids transitions OPEN -> DISCHARGED (bubble-up; each increments PlanCondition.version by 1)"
          - "Increments ProcurementCommitment.version by 1"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /procurement-commitments/{commitmentId}/cancel"
        actor: UtilityPlanner
        preconditions:
          - "Every PlanCondition listed in condition_discharge_ids has status == OPEN (ERR_CONDITION_ALREADY_DISCHARGED) — cancelling a commitment that has already discharged a condition would orphan the discharge"
        side_effects:
          - "Frees committed_mw from the candidate's aggregate committed total"
          - "Increments ProcurementCommitment.version by 1"

  - entity: PlanCondition
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: DISCHARGED
        trigger: "system (automatic on ProcurementCommitment ISSUED -> AWARDED that lists the condition in condition_discharge_ids)"
        actor: system
        preconditions: []
        side_effects: ["Increments PlanCondition.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-review-stale-version
    parent_entity: ResourcePlan
    write_endpoint: "POST /plans/{planId}/commission-review"
    occ_field: "expected_plan_version"
    description: |
      A commission-review call carrying an expected_plan_version that no longer
      matches ResourcePlan.version is rejected with ERR_STALE_PLAN_VERSION. This
      captures the case where the client's view of the plan predates a mutation
      that legitimately advanced the plan (another review decision, a reopen, or
      a supersede cascade), so the decision would be based on stale state.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: snapshot-stale-portfolio-version
    parent_entity: ResourcePortfolio
    write_endpoint: "POST /portfolios/{portfolioId}/snapshots"
    occ_field: "expected_portfolio_version"
    description: |
      A snapshot compute carrying an expected_portfolio_version that no longer
      matches ResourcePortfolio.version is rejected with ERR_STALE_PORTFOLIO_VERSION.
      Because retire/cancel-retirement cascades bump portfolio.version for every
      portfolio of the deciding plan, a snapshot computed against the client's
      older view would silently embed an obsolete fleet state.
    error_id: ERR_STALE_PORTFOLIO_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: load_forecasting
    trigger: "LoadForecast create or update (while unlocked); snapshot compute reads the stored effective_load_mw"
    algorithm: weighted_scoring
    formula: |
      effective_load_mw =
          residential_mw * 1.00
        + commercial_mw  * 1.00
        + industrial_mw  * INDUSTRIAL_COINCIDENCE   # 0.95
        + electrification_mw * ELECTRIFICATION_FACTOR[variant]
      where variant == COINCIDENT  -> ELECTRIFICATION_FACTOR = 1.00
            variant == NET_PEAK    -> ELECTRIFICATION_FACTOR = 0.60
      The variant is chosen per computation context:
        - The LoadForecast.effective_load_mw stored field always uses COINCIDENT.
        - A ReliabilitySnapshot may request scenario_tag NET_PEAK variant by
          carrying snapshot.scenario_tag == HIGH_ELECTRIFICATION together with
          the snapshot request flag variant=NET_PEAK (see snapshot input);
          otherwise snapshot load uses COINCIDENT.
      total_peak_mw = residential + commercial + industrial + electrification (no weights)
    constants:
      INDUSTRIAL_COINCIDENCE: 0.95
      ELECTRIFICATION_COINCIDENT: 1.00
      ELECTRIFICATION_NET_PEAK: 0.60
    precision: "2 decimal places, round_half_up"
    variants:
      - name: COINCIDENT
        when: "default — stored effective_load_mw and standard snapshots"
        difference: "electrification counts at full coincident value (factor 1.00)"
      - name: NET_PEAK
        when: "snapshot explicitly requested with variant NET_PEAK"
        difference: "electrification counts at 60% — EV charging shifts off-peak; same inputs, lower load, higher capacity_margin_mw"

  - name: capacity_accreditation
    trigger: "ReliabilitySnapshot compute (accredited_supply_mw term)"
    algorithm: aggregation
    formula: |
      For each contributing unit u (active fleet Resources plus selected Positions' candidates):
        base_factor = ACCREDITATION[u.resource_type]   # method: ELCC-class static factors
        der = derating_factor(u.resource_type, forecast_year)   # see derating_factor
        if u is a fleet Resource:
            contributed = (u.status == ACTIVE or (u.status == DECIDED and forecast_year < u.retirement_year))
            mw = contributed ? u.nameplate_mw : 0
        if u is a Position candidate:
            mw = (u.candidate.online_year <= forecast_year and u.selected) ? u.committed_mw : 0
        accredited += mw * base_factor * der
      accredited_supply_mw = round(accredited, 2)
    constants:
      ACCREDITATION_COAL: 0.90
      ACCREDITATION_GAS_CC: 0.88
      ACCREDITATION_GAS_CT: 0.85
      ACCREDITATION_NUCLEAR: 0.95
      ACCREDITATION_HYDRO: 0.80
      ACCREDITATION_SOLAR: 0.40
      ACCREDITATION_WIND: 0.15
      ACCREDITATION_STORAGE: 0.75
      ACCREDITATION_DEMAND_RESPONSE: 0.70
    precision: "2 decimal places, round_half_up"
    variants:
      - name: DECIDED_EXCLUSIVE
        when: "snapshot computed while the deciding plan is still DRAFT (default)"
        difference: "DECIDED resources contribute only while forecast_year < retirement_year; both the old unit and its replacement candidate may count in the same year only if independently eligible"
      - name: DECIDED_INCLUSIVE
        when: "snapshot requested with accreditation_mode=DECIDED_INCLUSIVE (conservative what-if)"
        difference: "DECIDED resources count at full nameplate for ALL forecast_year values (decision ignored) — same fleet data, higher accredited_supply_mw; used to bracket reliability outcomes"

  - name: derating_factor
    trigger: "inside capacity_accreditation, per unit per forecast_year"
    algorithm: decay_function
    formula: |
      COAL:
        age = forecast_year - in_service_year   (fleet) — candidates always treated as age 0
        if age <= 40: der = 1.00
        elif age >= 50: der = 0.90
        else: der = 1.00 - 0.01 * (age - 40)     # linear interpolation, age 41 -> 0.99 ... age 49 -> 0.91
      STORAGE:
        cycles = forecast_year - online_year
        if cycles >= 20: der = 0.75 else der = 1.00
      DEMAND_RESPONSE:
        if forecast_year >= 2030: der = 1.00 else der = 0.85
      all other resource_types: der = 1.00
      For fleet Resources, age uses the Resource.in_service_year; a Resource whose
      status == DECIDED applies age as of min(forecast_year, retirement_year) — the
      unit does not degrade beyond its retirement year.
      Candidate units (Positions) use age/cycles relative to candidate.online_year.
    constants:
      COAL_DERATE_START_AGE: 40
      COAL_DERATE_FLOOR_AGE: 50
      COAL_DERATE_FLOOR: 0.90
      STORAGE_DERATE_CYCLE: 20
      STORAGE_DERATE_FLOOR: 0.75
      DR_STEP_YEAR: 2030
      DR_PRE_STEP: 0.85
    precision: "2 decimal places, round_half_up (applied after multiplying by base_factor, per unit, before summing)"

  - name: capacity_margin
    trigger: "ReliabilitySnapshot compute"
    algorithm: threshold
    formula: |
      load_mw = effective load for (plan, snapshot.scenario_tag, forecast_year, snapshot variant)
      capacity_margin_mw = round(accredited_supply_mw - load_mw * (1 + RESERVE_MARGIN_PCT), 2)
      meets_requirement = (capacity_margin_mw >= 0)     # exactly 0.00 PASSES
    constants:
      RESERVE_MARGIN_PCT: 0.15
    precision: "2 decimal places, round_half_up"

  - name: screening_levelized_cost
    trigger: "retirement_analysis replacement-cost term; sensitivity scoring technology-cost term"
    algorithm: constraint_propagation
    formula: |
      For a candidate c and delivery year y (year capacity is needed):
        if c.build_lead_years > (y - CURRENT_DECISION_YEAR): candidate is INFEASIBLE for year y
        crf = DISCOUNT_RATE * (1+DISCOUNT_RATE)^LIFE / ((1+DISCOUNT_RATE)^LIFE - 1), LIFE = 25
        annual_fixed_usd = c.capex_usd_per_kw * 1000 * committed_mw * crf / 1000
                         + c.fixed_om_usd_per_kw_year * 1000 * committed_mw / 1000
          # capex $/kW * kW = $ ; committed_mw * 1000 = kW ; simplified: per-kW costs * committed MW * 1000 kW/MW
        levelized_usd_per_year = c.capex_usd_per_kw * crf * committed_mw * 1000
                               + c.fixed_om_usd_per_kw_year * committed_mw * 1000
      FEASIBILITY ORDERING (circular-looking dependency, pinned):
        Step 1: compute required replacement MW r = retired unit's accredited MW
                in the retirement year (using capacity_accreditation for that unit alone).
        Step 2: filter candidates to feasibility set F = {c : c.online_year <= y and c.build_lead_years <= y - CURRENT_DECISION_YEAR}.
        Step 3: rank F by levelized_usd_per_mw_year ASC (levelized per MW, i.e. divide by committed MW),
                tie-break by global_sequence_index ASC (never id).
        Step 4: greedily allocate candidates in rank order until cumulative committed_mw >= r;
                the final candidate may be partially allocated (waterfall).
      CURRENT_DECISION_YEAR := logical-clock calendar year at analysis creation time.
    constants:
      DISCOUNT_RATE: 0.07
      ASSET_LIFE_YEARS: 25
    precision: "0 decimal places on cost totals, round_half_up; per-MW ranking uses full precision (no rounding before ranking)"

  - name: retirement_analysis
    trigger: "RetirementAnalysis create and reopen (FINAL -> DRAFT recompute)"
    algorithm: chronological
    formula: |
      Window: years y in [retirement_year, retirement_year + 9] (10-year window, inclusive).
      compliance_cost_usd = sum over y of COMPLIANCE_COST_PER_YEAR[resource_type][y]
        (from the compliance schedule table; per-unit MW-scaled:
         cost_y = SCHEDULE[resource_type][y] * nameplate_mw, where SCHEDULE values are $/MW-year)
      fixed_om_avoided_usd = sum over y of FIXED_OM[resource_type] * nameplate_mw * 1000 / 1000
        = FIXED_OM[resource_type] ($/MW-yr) * nameplate_mw, per year, summed over the 10-year window.
      replacement_cost_usd = sum over y of levelized cost of the replacement allocation
        (see screening_levelized_cost) needed to cover the unit's accredited MW at year y,
        EXCLUDING any candidate c whose online_year > y (per-year feasibility filter).
      net_retirement_benefit_usd = compliance_cost_usd + fixed_om_avoided_usd - replacement_cost_usd
      recommendation = (net_retirement_benefit_usd > 0) ? RETIRE : KEEP    # exactly 0 -> KEEP
      Ordering note (pinned): per-year replacement allocation is computed strictly in
      ascending year order; allocations made for year y do not reserve candidate MW for
      year y+1 (each year's allocation is independent).
    constants:
      COAL_COMPLIANCE_BASE_USD_PER_MW_YEAR: 42000
      COAL_COMPLIANCE_STEP_USD_PER_MW_YEAR: 8000    # schedule = BASE + STEP * (y - 2030), floor at BASE, for y >= 2030; before 2030 flat BASE
      GAS_CT_COMPLIANCE_USD_PER_MW_YEAR: 6000
      FIXED_OM_COAL_USD_PER_MW_YEAR: 38000
      FIXED_OM_GAS_CT_USD_PER_MW_YEAR: 14000
      FIXED_OM_DEFAULT_USD_PER_MW_YEAR: 9000
      ANALYSIS_WINDOW_YEARS: 10
    precision: "0 decimal places, round_half_up (each component rounded to whole dollars before summing — round-per-component-then-sum, NOT sum-then-round)"

  - name: sensitivity_scoring
    trigger: "SensitivityAnalysis create"
    algorithm: weighted_scoring
    formula: |
      base_score_usd = sum over selected Positions in the snapshot's portfolio of
        (levelized annual cost of the position at snapshot.forecast_year — see screening_levelized_cost per-position form)
      adjusted_score_usd depends on dimension:
        FUEL_PRICE:
          COST_PLUS variant:  adjusted = base * (1 + fuel_share * delta_pct) where fuel_share = 0.35
          MARKET variant:     adjusted = base * (1 + delta_pct)
          Variant selection: the SensitivityAnalysis request field scoring_variant
          (COST_PLUS | MARKET); default COST_PLUS.
        POLICY: adjusted = base * (1 + POLICY_FACTOR * delta_pct), POLICY_FACTOR = 0.5,
          applied ONLY to positions whose candidate.resource_type in {COAL, GAS_CC, GAS_CT};
          other positions contribute unadjusted — i.e. adjusted = base_clean + base_fossil * (1 + 0.5 * delta_pct)
        TECHNOLOGY_COST: adjusted = base with each position's capex term scaled by (1 + delta_pct);
          fixed O&M term unscaled.
      robust_flag = |adjusted - base| <= ROBUST_TOLERANCE_PCT * base   # <= inclusive
    constants:
      FUEL_SHARE_COST_PLUS: 0.35
      POLICY_FACTOR: 0.5
      ROBUST_TOLERANCE_PCT: 0.10
    precision: "0 decimal places, round_half_up"
    variants:
      - name: COST_PLUS
        when: "scoring_variant == COST_PLUS (default) and dimension == FUEL_PRICE"
        difference: "only the 35% fuel share of cost moves with the price delta"
      - name: MARKET
        when: "scoring_variant == MARKET and dimension == FUEL_PRICE"
        difference: "full score moves with the price delta — same inputs, materially larger adjusted_score_usd"

  - name: deviation_measurement
    trigger: "PlanDeviationReport create"
    algorithm: aggregation
    formula: |
      baseline_load_mw = load_mw of the plan's approved ReliabilitySnapshot (approved_snapshot_id)
        for report_year; if that snapshot covers a different year, use the approved snapshot's
        portfolio's snapshot for report_year (must exist and meets any-state); if none exists,
        reject ERR_SNAPSHOT_NOT_FOUND.
      load_deviation_pct = (actual_load_mw - baseline_load_mw) / baseline_load_mw
        if baseline_load_mw == 0 -> reject ERR_INVALID_REQUEST (division by zero)
      committed_procurement_mw = sum(committed_mw) over plan's commitments with status in {ISSUED, AWARDED}
      required_procurement_mw = sum(required_procurement_mw) over plan's PlanConditions with status == OPEN
      procurement_deviation_mw = committed_procurement_mw - required_procurement_mw
      material_breach = (|load_deviation_pct| > DEVIATION_THRESHOLD_PCT) or (procurement_deviation_mw < 0)
        # strictly greater: exactly 0.0500 is NOT a breach; procurement shortfall uses strict <
    constants:
      DEVIATION_THRESHOLD_PCT: 0.05
    precision: "load_deviation_pct 4 decimal places round_half_up; procurement_deviation_mw 2 decimal places"

  - name: accreditation_waterfall
    trigger: "ProcurementCommitment create — eligibility pre-check when payload requests auto_select=true"
    algorithm: waterfall_allocation
    formula: |
      When a commitment is created with auto_select=true (no candidate_id), the server selects
      candidates to cover a requested MW block:
        Eligible set E = candidates with online_year <= logical-clock year + build_lead_years feasible
          AND aggregate committed MW (ISSUED/AWARDED commitments) < nameplate_mw.
        Rank E by screening levelized cost per MW ASC; tie-break by global_sequence_index ASC.
        Allocate in rank order: each candidate contributes min(remaining_need, nameplate_mw - committed_mw).
        If E is empty or total available < requested MW -> ERR_NO_ELIGIBLE_CANDIDATE.
      The selected candidate (first in rank order receiving allocation) becomes commitment.candidate_id.
    constants: {}
    precision: "2 decimal places"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per RBAC; entity_backed ownership (Intervener acting on own testimony; Commissioner segregation-of-duties: the same X-User-ID that issued a commitment cannot award it)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (planId, then portfolioId/commentId, etc.); body-referenced ids exist (FK targets: snapshot_id, candidate_id, plan_id, condition ids)"
    error_id: "ERR_PLAN_NOT_FOUND | ERR_PORTFOLIO_NOT_FOUND | ERR_RESOURCE_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND | ERR_SNAPSHOT_NOT_FOUND | ERR_ANALYSIS_NOT_FOUND | ERR_COMMENT_NOT_FOUND | ERR_TESTIMONY_NOT_FOUND | ERR_INTERVENOR_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_CONDITION_NOT_FOUND | ERR_FORECAST_NOT_FOUND"
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: concurrency
    check: "OCC: expected_<parent>_version (when the endpoint requires it) must equal the parent's current version"
    error_id: "ERR_STALE_PLAN_VERSION | ERR_STALE_PORTFOLIO_VERSION"
    http_status: 412
    applies_to: "POST /plans/{planId}/commission-review, POST /portfolios/{portfolioId}/snapshots"

  - priority: 5
    category: state
    check: "Target entity in a state that permits the operation (plan status gates: comment only while OPEN_FOR_COMMENT, testimony only while UNDER_REVIEW, commitment only while APPROVED/APPROVED_WITH_CONDITIONS, forecast edits only while unlocked; position add/remove only while portfolio DRAFT (snapshot compute is allowed on DRAFT and FROZEN portfolios); resource ACTIVE for retire, DECIDED for cancel/mothball; commitment ISSUED for award/cancel; testimony FILED/WITHDRAWN pairing)"
    error_id: "ERR_PLAN_NOT_DRAFT | ERR_PLAN_NOT_OPEN_FOR_COMMENT | ERR_PLAN_NOT_UNDER_REVIEW | ERR_PLAN_NOT_APPROVED | ERR_PORTFOLIO_FROZEN | ERR_FORECAST_LOCKED | ERR_INVALID_STATE | ERR_COMMITMENT_NOT_ISSUABLE | ERR_CONDITION_ALREADY_DISCHARGED"
    http_status: 409
    applies_to: "state-transition and child-mutation endpoints"

  - priority: 6
    category: business_temporal
    check: "Temporal window checks: comment window (logical-clock date within [opens_on, closes_on] inclusive both ends — a comment ON closes_on is accepted); retirement lead time (retirement_year >= clock year + MIN_RETIREMENT_LEAD_YEARS); cycle-year statutory deadline (submitted_on must be on or before CYCLE_DEADLINE_MONTH_DAY of cycle_year — plans opened after Sept 1 of the cycle year are rejected at open-comment); candidate online_year >= 2026; forecast_year within plan horizon"
    error_id: "ERR_COMMENT_WINDOW_CLOSED | ERR_COMMENT_WINDOW_OPEN | ERR_RETIREMENT_TOO_EARLY | ERR_CYCLE_DEADLINE_MISSED | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "comments, retire, open-comment, candidate/forecast create"

  - priority: 7
    category: business_constraint
    check: "Structural constraints: unique (plan_id, forecast_year) per snapshot; unique (plan_id, report_year) per deviation report; unique (plan_id, scenario_tag, forecast_year) per forecast; at most one preferred_flag portfolio per plan; candidate_name and intervenor legal_name globally unique; committed_mw <= candidate nameplate (aggregate across ISSUED/AWARDED commitments); position committed_mw <= candidate nameplate; no duplicate (portfolio_id, candidate_id) selected positions"
    error_id: "ERR_DUPLICATE_SNAPSHOT | ERR_DUPLICATE_REPORT | ERR_DUPLICATE_FORECAST | ERR_PREFERRED_PORTFOLIO_CONFLICT | ERR_DUPLICATE_CANDIDATE_NAME | ERR_DUPLICATE_INTERVENOR | ERR_NAMEPLATE_EXCEEDED | ERR_DUPLICATE_POSITION"
    http_status: 409
    applies_to: "create endpoints"

  - priority: 8
    category: business_referential
    check: "Cross-entity referential checks: commitment candidate must be referenceable and (unless auto_select) have remaining uncommitted nameplate; condition_discharge_ids entries must belong to the SAME plan as the commitment (a condition of another plan is ERR_REFERENTIAL_INTEGRITY, not a not-found); analysis snapshot must belong to a portfolio of the same plan as the analysis; testimony intervenor must be registered with standing_approved; retire plan_id must be a DRAFT plan; sensitivity snapshot must belong to the plan"
    error_id: "ERR_NO_ELIGIBLE_CANDIDATE | ERR_SNAPSHOT_PLAN_MISMATCH | ERR_INTERVENOR_NO_STANDING | ERR_PLAN_NOT_DRAFT | ERR_REFERENTIAL_INTEGRITY"
    http_status: 422
    applies_to: "commitments, analyses, testimonies, retire, sensitivities"

  - priority: 9
    category: business_fiscal
    check: "Reliability/fiscal gates: submit-for-review requires a preferred portfolio; commission-review APPROVE/APPROVE_WITH_CONDITIONS requires preferred portfolio reliability met; reopen requires reopen_count < REOPEN_LIMIT; comment acknowledgment only during comment window"
    error_id: "ERR_NO_PREFERRED_PORTFOLIO | ERR_RELIABILITY_NOT_MET | ERR_PLAN_REOPEN_LIMIT | ERR_PLAN_MISSING_BASE_FORECAST | ERR_PLAN_MISSING_PORTFOLIO"
    http_status: 422
    applies_to: "plan transitions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving, mandatory default) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z (fixed default; never falls back to wall-clock). All date/year comparisons in the domain use this clock."
    roles: [UtilityPlanner, PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Advances clock; on crossing into a Resource's retirement_year, DECIDED resources with retirement_year <= new clock year auto-transition to RETIRED"
      - "Increments the version of each Resource auto-transitioned"

  # --- ResourcePlan ---
  - method: POST
    path: "/plans"
    description: "Create a resource plan (DRAFT)"
    roles: [UtilityPlanner]
    code: 201
    input: [plan_name, cycle_year, planning_horizon_years]
    output: ResourcePlan
    side_effects: ["reopen_count = 0; version = 1"]

  - method: GET
    path: "/plans"
    description: "List plans"
    roles: [UtilityPlanner, Commissioner, Intervener, PublicCommenter, PlatformAdmin]
    code: 200
    input: ["status?", "cycle_year?", "approved_snapshot_id?", "preferred_portfolio_id?", "limit?", "offset?"]
    output: "ResourcePlan[]"
    side_effects: []

  - method: GET
    path: "/plans/{planId}"
    description: "Get one plan"
    roles: [UtilityPlanner, Commissioner, Intervener, PublicCommenter, PlatformAdmin]
    code: 200
    input: []
    output: ResourcePlan
    side_effects: []

  - method: POST
    path: "/plans/{planId}/open-comment"
    description: "DRAFT -> OPEN_FOR_COMMENT; locks forecasts; sets comment window and submitted_on; enforces cycle deadline (submitted_on <= Sept 1 of cycle_year)"
    roles: [UtilityPlanner]
    code: 200
    input: []
    output: ResourcePlan
    side_effects:
      - "LoadForecast.locked := true for all rows"
      - "comment_window_opens_on/closes_on, submitted_on set from logical clock"
      - "Increments ResourcePlan.version by 1"

  - method: POST
    path: "/plans/{planId}/submit-for-review"
    description: "OPEN_FOR_COMMENT -> UNDER_REVIEW; freezes portfolios; pins preferred portfolio"
    roles: [UtilityPlanner]
    code: 200
    input: []
    output: ResourcePlan
    side_effects:
      - "All portfolios DRAFT -> FROZEN"
      - "preferred_portfolio_id set"
      - "Increments ResourcePlan.version by 1"

  - method: POST
    path: "/plans/{planId}/commission-review"
    description: "UNDER_REVIEW -> APPROVED | APPROVED_WITH_CONDITIONS | REJECTED. OCC-guarded on expected_plan_version. On approval of a cycle_year, any other plan with the same cycle_year in APPROVED/APPROVED_WITH_CONDITIONS auto-transitions to SUPERSEDED."
    roles: [Commissioner]
    code: 200
    input: [decision, expected_plan_version, "conditions?"]
    output: ResourcePlan
    side_effects:
      - "On APPROVE_WITH_CONDITIONS: create PlanCondition rows (status OPEN)"
      - "On APPROVE/APPROVE_WITH_CONDITIONS: approved_snapshot_id set; same-cycle-year approved plans -> SUPERSEDED"
      - "Increments ResourcePlan.version by 1 (and version of each superseded plan)"

  - method: POST
    path: "/plans/{planId}/reopen"
