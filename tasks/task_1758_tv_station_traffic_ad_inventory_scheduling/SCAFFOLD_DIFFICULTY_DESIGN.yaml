            - call: "POST /traffic/spots/${spot9_id}/place"
              payload: { avail_unit_id: "${unit9b_id}", expected_avail_unit_version: "${unit9b_v0}" }
              as: TrafficManager
              captures: { dual_err: "$.data.error_id"}
          assert:
            - "temporal-only control: ${temporal_only_err} == ERR_DATE_WINDOW (air 2026-08-08 outside flight ending 2026-08-05)"
            - "dual failure: ${dual_err} == ERR_INVALID_STATE — spot9 is SCHEDULED (state violation, priority 4) AND target air 2026-08-15 is outside flight ending 2026-08-09 (temporal violation, priority 5); the state error wins"
            - "Spot.${spot9_id} remains SCHEDULED on U9a; AvailUnit.${unit9b_id}.booked_commercial_seconds == 0"
      - name: business_safety_vs_business_constraint_on_place
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_POLITICAL_RESERVE]
          - errors[ERR_SEPARATION_VIOLATION]
        distinguishing_aspect: |
          Pair (business_safety, business_constraint): one commercial
          placement that would BOTH consume reserved political seconds
          (safety, priority 7) AND land adjacent to a same-category spot
          (separation constraint, priority 9) MUST return
          ERR_POLITICAL_RESERVE — safety outranks constraint. A different
          category pair than (state, business_temporal).
        test_recipe:
          setup:
            - "Program P10 in political window (weekday 2 = Tuesday 2026-08-04, rating 4.0)"
            - "Week W10; unit U10 (2026-08-04, 60s, reserved_political_seconds 30) -> commercial capacity 30"
            - "Advertiser A10 (RETAIL) order with line (30s x 2, guarantee 0) approved; first spot r10a placed into U10 (booked_commercial == 30, capacity exhausted)"
            - "Second spot r10b (same advertiser, same RETAIL category) attempted into U10: violates reserve (30+30 > 30) AND separation (position distance 1)"
