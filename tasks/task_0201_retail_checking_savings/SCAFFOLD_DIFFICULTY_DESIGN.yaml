              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Almost Dormant", date_of_birth: "1990-01-01", tax_id_last4: "7171", country_of_residence: "US" }
              as: Teller
              captures: { cust_h: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_h}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_h: $.data.id }
            - call: "POST /applications/${app_h}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_h}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_h: $.data.opened_account_id }
            - call: "POST /accounts/${acct_h}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 5000 }
              as: AccountHolder
              as_user_id: "${cust_h}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-31T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /accounts/${acct_h}/run-dormancy-scan"
