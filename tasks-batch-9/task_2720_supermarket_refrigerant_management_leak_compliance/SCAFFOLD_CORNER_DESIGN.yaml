              captures: { storeb_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Eastgate Market", store_code: "EG-003", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { storec_id: $.data.id }
            - call: "POST /regulatory-reports"
              payload: { store_id: "${storea_id}", report_type: "ANNUAL_LEAK_RATE", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", leaked_lbs_method: "CHARGE_BASED" }
              as: ComplianceManager
              captures: { reporta_id: $.data.id, reporta_due: $.data.due_on }
            - call: "POST /regulatory-reports"
              payload: { store_id: "${storeb_id}", report_type: "ANNUAL_LEAK_RATE", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", leaked_lbs_method: "CHARGE_BASED" }
              as: ComplianceManager
              captures: { reportb_id: $.data.id }
            - call: "POST /regulatory-reports"
              payload: { store_id: "${storec_id}", report_type: "ANNUAL_LEAK_RATE", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", leaked_lbs_method: "CHARGE_BASED" }
              as: ComplianceManager
              captures: { reportc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regulatory-reports/${reporta_id}/submission"
              payload: { submission_note: "On-time filing." }
              as: ComplianceManager
              captures: { a_days_late: $.data.days_late, a_total: $.data.late_filing_assessment_usd }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regulatory-reports/${reportb_id}/submission"
              payload: { submission_note: "Ten days late." }
              as: ComplianceManager
              captures: { b_days_late: $.data.days_late, b_surcharge: $.data.administrative_surcharge_usd }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-08T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /regulatory-reports/${reportc_id}/submission"
              payload: { submission_note: "Forty days late." }
              as: ComplianceManager
              captures: { c_days_late: $.data.days_late, c_base: $.data.base_assessment_usd, c_total: $.data.late_filing_assessment_usd }
          assert:
            - "all three reports carry due_on == 2026-08-29T00:00:00Z"
            - "report A: days_late == 0, base_assessment_usd == 0.00, administrative_surcharge_usd == 0.00, late_filing_assessment_usd == 0.00, status == SUBMITTED"
            - "report B: days_late == 10, base_assessment_usd == 1650.00, administrative_surcharge_usd == 165.00, late_filing_assessment_usd == 1815.00"
            - "report C: HTTP 200, days_late == 40, base_assessment_usd == 6600.00, administrative_surcharge_usd == 1188.00, late_filing_assessment_usd == 7788.00"
            - "every report: total_leaked_lbs == 0.0, included_system_count == 0, submission_count == 1"

      - name: second_leak_event_within_the_year_counts_even_though_the_first_closed
        claim_type: correct_result
        grounds:
          - calculations.chronic_exceedance_count
          - state_machines.RefrigerantSystem.LEAK_OPEN_to_CHRONIC_EXCEEDANCE
          - entities.Store.fields.chronic_leaker_flag
        distinguishing_aspect: "exceedance_count_12mo counts non-VOIDED events including VERIFIED_CLOSED ones: after fully repairing and closing the first event, a second detection inside the same 365 days takes the count to 2, driving the system to CHRONIC_EXCEEDANCE and raising the store's chronic_leaker_flag - a rule that only counted open events would report 1 and stay quiet."
