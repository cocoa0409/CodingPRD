            - "fresh create succeeds: StayRequest.${sr2_id}.assignment_status == WAITLISTED with expected_nights == 5"
            - "supersede side effect: StayRequest.${sr1_id}.assignment_status == CANCELLED and superseded_by_request_id == ${sr2_id}"
            - "Family.${fam_id}.version == 3 after the two successful creates"

      - name: offer_respond_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[offer-respond-stale-request]', errors.ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on StayRequest.version: a respond carrying the pre-offer version (one behind) is refused 412 before the ACCEPT lands; the respond carrying the current version succeeds."
        test_recipe:
          setup:
            - "Verified request OFFERED; both the pre-offer version and the post-offer version captured."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/rooms"
              payload: { room_number: "101", bed_count: 2, occupancy_limit: 2 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { room_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id, fam_v: $.data.version }
