      - name: sensitive_review_naming_a_segment_of_another_request_not_found
        claim_type: cross_reference_link
        grounds:
          - validations.priority_7
          - errors.ERR_SEGMENT_NOT_FOUND
          - endpoints.POST_/roi/requests/{id}/sensitive-review
