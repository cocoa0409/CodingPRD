# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# =============================================================================
# Every rule_id carries ≥2 instances. Instance names are globally unique.

scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: matter_variance_gross_vs_net_divergence
        grounds:
          - calculations.matter_budget_variance
          - entities.Matter.fields.variance_cents
          - entities.Matter.fields.actual_fees_cents
        distinguishing_aspect: |
          matter_budget_variance is dual-variant on the Matter entity domain:
          gross_variance counts WRITTEN_DOWN entries at full billable_amount_cents,
          while net_variance counts them at post-write-down remainder. The two
          variants MUST produce different variance_cents for the same matter
          state once a write-down is applied.
        test_recipe:
          setup:
            - "Firm F1, Client C1 (ACTIVE), Matter M1 (ACTIVE) under FeeArrangement A1"
            - "PhaseBudget PB1 task_code=L110 budget=100000 ACTIVE"
            - "TimeEntries TE1 (40000) and TE2 (30000) both APPROVED then BILLED"
            - "WriteDownRequest WDR1 for [TE1] amount=10000 in APPLIED state"
            - "Matter.actual_fees_cents (net) == 60000 (70000 - 10000)"
            - "Matter.write_down_total_cents == 10000"
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P One", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_p1: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "CL1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "DISCOVERY", responsible_partner_id: "${tk_p1}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { matter_id: $.data.id, matter_v0: $.data.version }
            - call: "POST /firms/${firm_id}/matters/${matter_id}/fee_arrangements"
              payload: { arrangement_type: "FLAT_FEE", flat_fee_cents: 100000, fiscal_year_index: 2026 }
              as: PricingAnalyst
              captures: { arr_id: $.data.id }
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/activate"
              payload: { expected_matter_version: "${matter_v0}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { matter_v1: $.data.version }
            - call: "POST /firms/${firm_id}/matters/${matter_id}/phase_budgets"
              payload: { litigation_stage: "DISCOVERY", task_code: "L110", original_budget_cents: 100000 }
              as: PricingAnalyst
              captures: { pb_id: $.data.id }
            - call: "POST /firms/${firm_id}/phase_budgets/${pb_id}/activate"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/matters/${matter_id}/time_entries"
              payload: { timekeeper_id: "${tk_p1}", task_code: "L110", litigation_stage: "DISCOVERY", hours_worked_milli: 1000, hourly_rate_cents: 40000, entry_date: "2026-08-05" }
              as: Timekeeper
              as_user_id: "${tk_p1}"
              captures: { te1_id: $.data.id }
            - call: "POST /firms/${firm_id}/matters/${matter_id}/time_entries"
              payload: { timekeeper_id: "${tk_p1}", task_code: "L110", litigation_stage: "DISCOVERY", hours_worked_milli: 1000, hourly_rate_cents: 30000, entry_date: "2026-08-06" }
              as: Timekeeper
              as_user_id: "${tk_p1}"
              captures: { te2_id: $.data.id }
            - call: "POST /firms/${firm_id}/time_entries/${te1_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te2_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te1_id}/approve"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te2_id}/approve"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te1_id}/mark_billed"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te2_id}/mark_billed"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/matters/${matter_id}/write_down_requests"
              payload: { time_entry_ids: ["${te1_id}"], requested_amount_cents: 10000, reason_code: "CLIENT_RELATIONS" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { wdr_id: $.data.id }
            - call: "POST /firms/${firm_id}/write_down_requests/${wdr_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P Two", bar_number: "B002", role_title: "PARTNER", standard_rate_cents: 60000 }
              as: FirmAdmin
              captures: { tk_p2: $.data.id }
            - call: "POST /firms/${firm_id}/write_down_requests/${wdr_id}/decide"
              payload: { decision: "APPROVE" }
              as: BillingPartner
              as_user_id: "${tk_p2}"
            - call: "POST /firms/${firm_id}/write_down_requests/${wdr_id}/apply"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p2}"
          trigger:
            - call: "GET /firms/${firm_id}/matters/${matter_id}/variance"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
          assert:
            - "response.variance_cents == -40000  # net: 60000 - 100000"
            - "gross_variance variant would compute 70000 - 100000 == -30000; variants diverge by exactly the write-down amount (10000)"

      - name: realization_rate_billing_vs_collected_selection
        grounds:
          - calculations.realization_rate
          - entities.Matter.fields.realization_rate_bp
          - entities.Matter.fields.write_down_total_cents
        distinguishing_aspect: |
          realization_rate is dual-variant on the Matter domain: the
          billing_realization variant applies iff the matter has ≥1 APPLIED
          write-down (denominator includes write-downs); the
          collected_realization variant applies otherwise (always 10000 bp).
          This instance verifies that the variant-selection rule itself is
          exercised on the SAME matter pre- and post-write-down.
        test_recipe:
          setup:
            - "Firm F1, Client C1, Matter M1 ACTIVE under FLAT_FEE arrangement"
            - "PhaseBudget PB1 (L110, 100000) ACTIVE; entries TE1=40000 APPROVED+BILLED"
            - "Pre-write-down: realization_rate_bp == 10000 (collected_realization)"
            - "Then apply a 10000 write-down on TE1 (APPLIED)"
            - "Post-write-down: realization_rate_bp == round(10000 * 40000 / (40000+10000)) = 8000 (billing_realization)"
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_p1: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "CL1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "DISCOVERY", responsible_partner_id: "${tk_p1}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { matter_id: $.data.id, matter_v0: $.data.version }
            - call: "POST /firms/${firm_id}/matters/${matter_id}/fee_arrangements"
              payload: { arrangement_type: "FLAT_FEE", flat_fee_cents: 100000, fiscal_year_index: 2026 }
              as: PricingAnalyst
              captures: { arr_id: $.data.id }
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/activate"
              payload: { expected_matter_version: "${matter_v0}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/matters/${matter_id}/phase_budgets"
              payload: { litigation_stage: "DISCOVERY", task_code: "L110", original_budget_cents: 100000 }
              as: PricingAnalyst
              captures: { pb_id: $.data.id }
            - call: "POST /firms/${firm_id}/phase_budgets/${pb_id}/activate"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/matters/${matter_id}/time_entries"
              payload: { timekeeper_id: "${tk_p1}", task_code: "L110", litigation_stage: "DISCOVERY", hours_worked_milli: 1000, hourly_rate_cents: 40000, entry_date: "2026-08-05" }
              as: Timekeeper
              as_user_id: "${tk_p1}"
              captures: { te1_id: $.data.id }
            - call: "POST /firms/${firm_id}/time_entries/${te1_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te1_id}/approve"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te1_id}/mark_billed"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "GET /firms/matters/${matter_id}"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { realization_pre: $.data.realization_rate_bp }
            - call: "POST /firms/${firm_id}/matters/${matter_id}/write_down_requests"
              payload: { time_entry_ids: ["${te1_id}"], requested_amount_cents: 10000, reason_code: "CLIENT_RELATIONS" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { wdr_id: $.data.id }
            - call: "POST /firms/${firm_id}/write_down_requests/${wdr_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P2", bar_number: "B002", role_title: "PARTNER", standard_rate_cents: 60000 }
              as: FirmAdmin
              captures: { tk_p2: $.data.id }
            - call: "POST /firms/${firm_id}/write_down_requests/${wdr_id}/decide"
              payload: { decision: "APPROVE" }
              as: BillingPartner
              as_user_id: "${tk_p2}"
            - call: "POST /firms/${firm_id}/write_down_requests/${wdr_id}/apply"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p2}"
          trigger:
            - call: "GET /firms/matters/${matter_id}"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { realization_post: $.data.realization_rate_bp, wd_total: $.data.write_down_total_cents }
          assert:
            - "realization_pre == 10000   # captured before write-down request"
            - "realization_post == 8000   # round(10000 * 40000 / (40000+10000))"
            - "wd_total == 10000"
            - "variant selected differs based on write_down_total_cents == 0 (collected vs billing)"

  # -------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: collar_true_up_nested_band_arithmetic
        grounds:
          - calculations.collar_true_up_amount
          - entities.CollarTrueUp.fields.true_up_amount_cents
        distinguishing_aspect: |
          Mode (a) — combinatorial formula with ≥3 inputs and non-linear
          interaction via nested min/max band selection. Inputs:
          actual_year_fees_cents, collar_lower_bound_cents,
          collar_upper_bound_cents, collar_share_pct_bp. Branch taken depends
          on which side of two thresholds the actual falls; rounding differs
          per branch.
        test_recipe:
          setup:
            - "Firm F1 (fiscal_year_start_month=1); Matter M1 with COLLAR arrangement (lb=100000, ub=200000, share=5000bp=50%)"
            - "Time entries billed in fiscal_year_index 2026 totalling 250000 (above upper bound by 50000)"
            - "Advance clock past fiscal year end; run year-end true-up"
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_p1: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "CL1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "DISCOVERY", responsible_partner_id: "${tk_p1}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { matter_id: $.data.id, matter_v0: $.data.version }
            - call: "POST /firms/${firm_id}/matters/${matter_id}/fee_arrangements"
              payload: { arrangement_type: "COLLAR", collar_lower_bound_cents: 100000, collar_upper_bound_cents: 200000, collar_share_pct_bp: 5000, fiscal_year_index: 2026 }
              as: PricingAnalyst
              captures: { arr_id: $.data.id }
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/activate"
              payload: { expected_matter_version: "${matter_v0}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/matters/${matter_id}/phase_budgets"
              payload: { litigation_stage: "DISCOVERY", task_code: "L110", original_budget_cents: 300000 }
              as: PricingAnalyst
              captures: { pb_id: $.data.id }
            - call: "POST /firms/${firm_id}/phase_budgets/${pb_id}/activate"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/matters/${matter_id}/time_entries"
              payload: { timekeeper_id: "${tk_p1}", task_code: "L110", litigation_stage: "DISCOVERY", hours_worked_milli: 1000, hourly_rate_cents: 250000, entry_date: "2026-08-05" }
              as: Timekeeper
              as_user_id: "${tk_p1}"
              captures: { te1_id: $.data.id }
            - call: "POST /firms/${firm_id}/time_entries/${te1_id}/submit"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te1_id}/approve"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/time_entries/${te1_id}/mark_billed"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/advance_period"
              payload: {}
              as: FirmAdmin
          trigger:
            - call: "POST /firms/${firm_id}/matters/${matter_id}/run_year_end_collar_true_up"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { tu_id: $.data.id, tu_amount: $.data.true_up_amount_cents, tu_dir: $.data.direction }
          assert:
            - "tu_amount == 25000   # excess = 250000-200000 = 50000; share=50% → rebate 25000"
            - "tu_dir == REBATE_TO_CLIENT"
            - "CollarTrueUp.actual_year_fees_cents == 250000"

      - name: write_down_allocation_rounding_waterfall
        grounds:
          - calculations.write_down_allocation
          - entities.WriteDownRequest.fields.approved_amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Allocation is
          floor-per-entry then distribute leftover one cent at a time by
          entry.created_at ASC. Sum-then-round would produce different
          cent-level results. Pinned rounding order is verified by an
          allocation that produces leftover cents.
        test_recipe:
          setup:
            - "Matter M1 with three BILLED entries E1=33334, E2=33333, E3=33333 (created in order E1, E2, E3)"
            - "WriteDownRequest for [E1,E2,E3] amount=50000"
            - "Total = 100000; raw shares: E1=16667.0, E2=16666.5, E3=16666.5"
            - "Floor: E1=16667, E2=16666, E3=16666 (sum=49999); leftover=1"
            - "Leftover goes to E1 (earliest created_at): E1=16668, E2=16666, E3=16666"
