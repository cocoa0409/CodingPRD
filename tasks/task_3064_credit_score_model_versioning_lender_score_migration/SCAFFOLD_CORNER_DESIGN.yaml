            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${licv0}"}, as: ComplianceOfficer}
            - {call: "POST /score-discovery-requests", payload: {tag: "DISC-1"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {dr: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {licv1: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 715, expected_license_version: "${licv1}", discovery_tag: "DISC-1"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {sr: $.data.id}}
          trigger:
            - {call: "GET /score-discovery-requests/${dr}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {dr_now: $.data.status, dr_consumed: $.data.consumed_score_result_id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {licv2: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 716, expected_license_version: "${licv2}", discovery_tag: "DISC-1"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {err_second: $.data.error_id}}
          assert:
            - "data.dr_now == \"CONSUMED\" and data.dr_consumed == ScoreResult.${sr} — the slot is bound to the posting that consumed it"
            - "the second posting is refused with 404 ERR_DISCOVERY_TAG_UNKNOWN, because no REGISTERED slot carries that tag any more"
            - "GET /score-results?consumer_id=${c} reports total_count == 1"

      - name: license_activate_from_active_returns_invalid_state_machine_edge
        claim_type: Invalid Transitions
        grounds:
          - state_machines.License.PENDING_to_ACTIVE
          - errors.ERR_INVALID_STATE_MACHINE_EDGE
        distinguishing_aspect: "A second activation of an already-ACTIVE licence is refused with 409 ERR_INVALID_STATE_MACHINE_EDGE, because PENDING → ACTIVE is not declared from ACTIVE."
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets: [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT; one ACTIVE licence LEND-NORTH."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md: $.data.id, mdv: $.data.version}}
            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1v}"}, as: ModelDeveloper}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv0: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${licv0}"}, as: ComplianceOfficer}
          trigger:
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv1: $.data.version, st: $.data.status}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${licv1}"}, as: ComplianceOfficer, captures: {err: $.data.error_id}}
          assert:
            - "data.st == \"ACTIVE\" before the second call"
            - "the second activation returns 409 with data.err == \"ERR_INVALID_STATE_MACHINE_EDGE\""
            - "GET /licenses/${lic} still reports status ACTIVE and the version only advanced once, to the value captured on the second read"

      - name: validation_study_create_starts_scheduled_with_seeded_replay_log
        claim_type: Initial State
        grounds:
          - state_machines.ValidationStudy
          - endpoints.POST_/validation-studies
          - entities.ValidationStudy.fields.touched_model_ids
        distinguishing_aspect: "A newly scheduled study starts in SCHEDULED with touched_model_ids already seeded with its own model id and required_reason_codes derived from study_path, so the replay log is never empty."
        test_recipe:
          setup:
