              as: Manager
            - call: "POST /delivery-orders/${order_id}/deliver"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /delivery-orders/${order_id}/cancel"
              payload: {}
              as: Manager
          assert:
            - "WholesaleAccount.${acct_id}.credit_balance_cents == 0"
            - "DeliveryOrder.${order_id}.fulfillment_status == CANCELLED"
            - "BakePlanLine.${line_id}.reserved_qty == 0"
