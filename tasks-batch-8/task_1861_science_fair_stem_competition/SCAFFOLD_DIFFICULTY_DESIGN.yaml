  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: project_submit_gated_by_research_plan_state
        grounds:
          - state_machines.Project.DRAFT_to_SUBMITTED
          - entities.Project.fields.involves_human_subjects
        distinguishing_aspect: |
          Entity pair Project→ResearchPlan: submitting a project that declares human
          subjects is rejected with ERR_RESEARCH_PLAN_REQUIRED unless a ResearchPlan
