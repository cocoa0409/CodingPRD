    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: [finished_lot_id, fill_liters]
    output: Keg
    side_effects:
      - "status = FILLED; finished_lot_id and fill_liters set; deposit_state reset to NONE"
      - "lot.on_hand_units decreased by 1 and lot.poured_units increased by 1"
      - "increments FinishedLot.version by 1 and Keg.version by 1"

  - method: POST
    path: "/kegs/{id}/tap"
    description: "Put a filled keg on tap; the blow-off allowance is deducted once"
    roles: [TaproomStaff, PlatformAdmin]
    code: 200
    input: []
    output: Keg
    side_effects: ["status = ON_TAP; tapped_at set; remaining_liters = fill_liters - KEG_BLOWOFF_ALLOWANCE_LITERS", "increments Keg.version by 1"]

  - method: POST
    path: "/kegs/{id}/untap"
    description: "Take a keg off tap; the re-tap buffer starts here"
    roles: [TaproomStaff, PlatformAdmin]
    code: 200
    input: []
    output: Keg
    side_effects: ["status = FILLED; last_untapped_at set; tapped_at cleared", "increments Keg.version by 1"]

  - method: POST
    path: "/kegs/{id}/issue"
    description: "Send a filled keg out to an account on deposit"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: [account_id]
    output: Keg
    side_effects:
      - "status = ON_DEPOSIT; account_id and issued_at set; deposit_state = CHARGED; deposit_amount = KEG_DEPOSIT_AMOUNT"
      - "account.keg_deposit_balance and account.kegs_charged_lifetime updated"
      - "increments Keg.version by 1 and Account.version by 1"

  - method: POST
    path: "/kegs/{id}/return"
    description: "Take a keg back and settle the deposit"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: [condition]
    output: Keg
    side_effects:
      - "deposit_refund_amount and deposit_forfeit_amount computed by calculations.keg_deposit_settlement"
      - "status = RETURNED for a GOOD return and SCRAPPED for a DAMAGED one"
      - "account.keg_deposit_balance, deposit_refunded_total and deposit_forfeited_total updated"
      - "increments Keg.version by 1 and Account.version by 1"

  - method: GET
    path: "/kegs/{id}"
    description: "Read one keg asset"
    roles: [ProductionOperator, TaproomStaff, SalesRep, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Keg
    side_effects: []

  - method: GET
    path: "/kegs"
    description: "List keg assets with filters"
    roles: [ProductionOperator, TaproomStaff, SalesRep, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["finished_lot_id?", "account_id?", "status?", "deposit_state?", "limit?", "offset?"]
    output: "Keg[]"
    side_effects: []

  - method: GET
    path: "/kegs/{id}/fills"
    description: "Taproom fills drawn from this keg"
    roles: [TaproomStaff, PlatformAdmin]
    code: 200
    input: ["fill_status?", "limit?", "offset?"]
    output: "TaproomFill[]"
    side_effects: []

