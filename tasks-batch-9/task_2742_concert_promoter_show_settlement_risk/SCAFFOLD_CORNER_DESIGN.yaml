            - "Show S2 (Act Two, 2026-12-09T02:00Z, same hall, disjoint window): ON_SALE on an accepted FLAT_GUARANTEE offer of 800000 with deposit 100000; tier GA 5000 x 100 with 20 sold (gross 100000); BudgetLine PRODUCTION 600000 deductible with VendorInvoice I2 for 600000 already verified by u_sd_ta1 and approved by u_sd_ta2, so the line recognises 600000."
