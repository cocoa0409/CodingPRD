          setup:
            - "Clock 2026-08-01T00:00:00Z; a COST_PLUS contract with not_to_exceed_cents 6141, taken ACTIVE, with Studio A, a READY AED and an instructor with a VERIFIED GROUP_EX_CERT and a 2026-07-15 drill; one ACTIVE offering."
            - "One 55-minute session on 2026-08-05 with a CONFIRMED LEAD (4700/h -> 5483) COMPLETEd at 12:00Z, giving base 5483 -> markup 658 -> net 6141."
            - "The August invoice is drafted and issued, moving ytd_billed_cents to 6141; the clock is advanced to 2026-09-01 and the (empty) September invoice is drafted with a freshly read contract version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
