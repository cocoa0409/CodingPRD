            - "Quote.${q_id}.status == EXPIRED after the failed accept (lazy transition fired)"

      - name: coil_data_segregation_safety_beats_duplicate_uniqueness
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_DUPLICATE_ACTIVE]
        distinguishing_aspect: |
          Category pair business_safety (p8) vs business_constraint (p9): when
          the WindingTechnician recording coil data is the same operator who
