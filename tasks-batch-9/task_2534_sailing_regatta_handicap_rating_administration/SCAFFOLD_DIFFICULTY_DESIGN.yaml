      - name: start_sequence_blocked_while_division_reverted_to_provisional
        entity_pair: "Race depends on Division"
        grounds:
          - validations.priority_14_ERR_RACE_START_BLOCKED
          - endpoints.POST_races_id_start_sequence
          - state_machines.Division.status.CONFIRMED_to_PROVISIONAL
          - state_machines.Division.status.PROVISIONAL_to_MERGED
          - entities.Race.fields.start_blocked_reason
        distinguishing_aspect: |
          A third entity pair, and the dependency runs through a field the Race never writes itself:
          start_blocked_reason is stamped on the Race by a Division transition on a DIFFERENT division
          from the one that matters to the race committee. The race has full staffing, an effective SI,
          a RACING regatta and its own start_status PENDING -- every Race-local precondition holds -- yet
          the sequence is refused because a sibling division fell under its fleet minimum when one entry
          withdrew. The block is cleared not by touching the race but by merging the starved division
          away, after which the identical call succeeds. An implementation that recomputes blocking from
          Race-local state, or that clears the flag on withdrawal, gets one of the two calls wrong.
        test_recipe:
          setup:
            - "Eleven club members and four ISSUED TOD_PHRF MONOHULL certificates: A and B both 171.3, C and D both 218.8."
            - "A LOW_POINT regatta with fleet_minimum 2 holding two divisions: NARROW banded 165.0 to 175.0 and WIDE banded 150.0 to 230.0, both MONOHULL with min_entries 2."
            - "The selector puts A and B in NARROW because it is the narrower band and C and D in WIDE; all four are ACCEPTED and both divisions are CONFIRMED, so confirmed_division_count is 2."
            - "Racing is opened with a SEATED panel and three CONFIRMED whole-regatta duties from 12:00 to 20:00, and race 1 at 2026-08-05T14:00:00Z is created PENDING with start_blocked_reason null."
            - "Entry B then withdraws, so NARROW drops to one assigned entry, reverts CONFIRMED -> PROVISIONAL and stamps start_blocked_reason DIVISION_UNDER_MINIMUM on the PENDING race."
