              as: ProgramAdministrator
              captures: { r_balance_final: $.data.guest_meal_charge_balance_cents }
          assert:
            - "${c_cap} == 2000 and ${r_balance0} == 0"
            - "${t1_amount} == 1173 (1250 - round_half_up(156.25)=156 + round_half_up(79.315)=79) and ${r_balance1} == 1173"
            - "${cap_error} == ERR_SPONSOR_LIMIT_EXCEEDED with HTTP 402 (1173 + 1173 = 2346 > 2000) and no second ticket row exists"
            - "${t3_amount} == 1341 (unsponsored: 1250 + round_half_up(90.625)=91) with ${t3_resident} == null, accepted even though 1341 exceeds the remaining 827 of headroom"
            - "${r_balance_final} == 1173 — an unsponsored ticket never touches the resident balance"
      - name: allow_waitlist_flag_turns_capacity_rejection_into_waitlisted
