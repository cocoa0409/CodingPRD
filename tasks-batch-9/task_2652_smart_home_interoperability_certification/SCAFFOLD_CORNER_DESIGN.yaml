            - "POST /listings/${listing1_id}/withdraw returns 200 with publication_status == \"WITHDRAWN\" and compliance_status == \"NONCOMPLIANT\" - both axes move, and the second axis was COMPLIANT before"
            - "S1's dac_state is \"REVOKED\" after the withdrawal while its state stays \"CERTIFIED\" and dac_serial stays \"DAC-000001\" - the serial is burned, not released"
            - "${err_withdrawn_listing} == \"ERR_INVALID_LISTING_STATE\" (409) with a fresh expected_listing_version - WITHDRAWN is terminal on the publication axis, and firmware_revision_count stays 0"
            - "GET /listings?publication_status=WITHDRAWN returns total_count == 1; the withdrawn listing stays in the directory rather than disappearing"

      - name: readiness_computed_read_matches_the_scoring_formula
        claim_type: computed_read
        grounds:
          - endpoints[GET /submissions/{submission_id}/readiness]
          - calculations.certification_readiness_score
        excluded_because:
          difficulty_instance: readiness_provisional_vs_final_diverge_on_blocked_lines_and_lateness
          rationale: >
            That instance reads GET /submissions/{submission_id}/readiness under both ?variant values on
            identical stored data and asserts the two component-by-component decompositions, so the
            computed-read corner for this endpoint is already exercised there.

      - name: competency_computed_read_matches_the_scoring_formula
        claim_type: computed_read
        grounds:
          - endpoints[GET /test-laboratories/{laboratory_id}/competency]
          - calculations.laboratory_competency_score
        excluded_because:
          difficulty_instance: laboratory_competency_rolling_vs_lifetime_straddle_suspension_threshold
          rationale: >
            The competency read is exercised there under both ?variant values, including the punctuality
            and dispute-free component split and the 90-day rolling window boundary.

      - name: credit_ledger_computed_read_reconciles_with_its_identity
        claim_type: computed_read
        grounds:
          - endpoints[GET /members/{member_id}/credit-ledger]
          - calculations.member_credit_ledger
        excluded_because:
          difficulty_instance: credit_escrow_round_trips_through_withdraw_reject_and_consumption
          rationale: >
            That instance reads the ledger after every escrow-moving transition and asserts the
            purchased == balance + consumed + escrowed identity under both variants.

      - name: session_start_is_a_conditional_action_gated_on_the_laboratory
        claim_type: conditional_action
        grounds:
          - endpoints[POST /test-sessions/{test_session_id}/start]
          - validations[priority=15]
        excluded_because:
          difficulty_instance: session_start_refused_while_its_laboratory_sits_suspended
          rationale: >
            The conditional-action corner for session start - allowed only while the owning laboratory is
            AUTHORIZED and unexpired - is the whole subject of that instance, including the reinstatement
            that makes the same request succeed unchanged.

  - section: errors
    instances:
      - name: missing_headers_then_role_then_ownership_then_standing_on_one_submit
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=25]
          - validations[priority=26]
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: >
          One unchanged request line - POST /submissions/{submission_id}/submit on a DRAFT submission -
          walks the top of the priority ladder, returning a different error for each defect while the
          stored data never moves: absent headers give 401, an X-User-Role that is not one of the seven
          declared roles gives 401 rather than 403, a declared role that the endpoint does not list gives
          403, the wrong Member owner gives 403 even though that member is fully onboarded and funded, and
          only after ownership passes do the business rules (good standing at priority 25, then IP scope
          at priority 26) become visible.
