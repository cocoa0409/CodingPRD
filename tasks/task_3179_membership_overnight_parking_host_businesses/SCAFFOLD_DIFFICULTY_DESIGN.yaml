              payload: { host_id: "${h_gt}", member_id: "${m13}", vehicle_id: "${v13}", arrival_date: "2026-06-20", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m13}"
              captures: { gate_err: $.data.error_id, gate_msg: $.data.message }
          assert:
            - "the first CONFIRM returned request_status \"CONFIRMED\", so the same request row was admissible while the host was APPROVED"
            - "the new POST returns error_id \"ERR_HOST_NOT_ACCEPTING_STAYS\" with http 409 because the host's onboarding_status moved to SUSPENDED"
            - "StayRequest.${r_gt}.request_status == \"DECLINED\" as a consequence of the suspension cascade, not of the rejected request"
            - "the member's own subscription_status is still \"ACTIVE\", so the gate that fired belongs to the host pair and not to the member"

