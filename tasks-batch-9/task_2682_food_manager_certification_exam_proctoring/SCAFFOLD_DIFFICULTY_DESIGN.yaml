          - endpoints[POST /compliance-runs]
        distinguishing_aspect: |
          Depth 3 from a completely different trigger — the ops-run checkpoint rather than an incident
          resolution. Phase 2 expires the certificate because the clock reached expires_at (hop 1);
          because that certificate left ISSUED its registration is withdrawn (hop 2); because the
          candidate's only live certificate is gone the candidate's compliance_status drops CERTIFIED ->
