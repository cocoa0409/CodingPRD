scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: unmet_need_purpose_matched_vs_pooled_diverge_by_600000
        grounds:
          - "calculations.unmet_need_determination.variants"
          - "calculations.unmet_need_determination.constants.BUCKET_OF_CATEGORY"
          - "calculations.verified_damage_total.constants.CATEGORY_CAP_CENTS"
          - "entities.UnmetNeedAssessment.fields.variant"
          - "endpoints[POST /recovery-cases/{id}/assessments]"
        distinguishing_aspect: "PURPOSE_MATCHED offsets each assistance award only against its own purpose bucket, so an over-award in TEMPORARY_HOUSING (900000 against a 300000 need) is stranded and cannot subsidise STRUCTURE_REPAIR. POOLED sums every offset into one pot before subtracting. An implementation that pools (or that matches but lets over-awards spill) cannot produce both 6700000 and 6100000 from the identical fixture. DISPUTED assistance (A4, 1000000) must be excluded from offsets under BOTH variants, so an implementation that counts all documentation_statuses gets 5700000/5100000 instead."
        test_recipe:
          setup:
            - "Survivor S1 (household 4, VLI, age 58, disability) with Case C1 carrying temporary_housing_need_cents 300000."
            - "Four verified DamageItems whose category caps bite: STRUCTURE 8500000 (uncapped), ROOF 4000000 -> capped 3500000, CONTENTS 1800000 -> capped 1500000, ACCESSIBILITY 600000; verified_damage_total 14100000, need buckets {STRUCTURE_REPAIR 12000000, CONTENTS_REPLACEMENT 1500000, ACCESSIBILITY_MOD 600000, TEMPORARY_HOUSING 300000}."
            - "Four AssistanceRecords: 7000000 STRUCTURE_REPAIR DOCUMENTED, 900000 TEMPORARY_HOUSING DOCUMENTED (over-award), 400000 CONTENTS_REPLACEMENT DOCUMENTED, 1000000 STRUCTURE_REPAIR DISPUTED."
            - "Then run both assessment variants."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /survivors
              payload: { household_name: "Alvarez Household", primary_contact_phone: "555-0101", household_size: 4, income_band: "VLI", head_of_household_age: 58, has_member_with_disability: true, is_uninsured: false, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { s1: "$.data.id" }
            - call: POST /recovery-cases
              payload: { survivor_id: "${s1}", disaster_code: "DR-4801", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED", temporary_housing_need_cents: 300000 }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { c1: "$.data.id" }
            - call: POST /recovery-cases/{id}/damage-items
              payload: { category: "STRUCTURE", item_description: "Foundation and framing", documented_cost_cents: 8500000, photo_count: 12, is_habitability_critical: true }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { d1: "$.data.id" }
            - call: POST /damage-items/{id}/verification
              payload: { verification_status: "VERIFIED", verified_cost_cents: 8500000 }
              as: ConstructionManager
              as_user_id: u_cn_1
            - call: POST /recovery-cases/{id}/damage-items
              payload: { category: "ROOF", item_description: "Full roof replacement", documented_cost_cents: 4000000, photo_count: 6, is_habitability_critical: true }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { d2: "$.data.id" }
            - call: POST /damage-items/{id}/verification
              payload: { verification_status: "VERIFIED", verified_cost_cents: 4000000 }
              as: ConstructionManager
              as_user_id: u_cn_1
            - call: POST /recovery-cases/{id}/damage-items
              payload: { category: "CONTENTS", item_description: "Household contents", documented_cost_cents: 1800000, photo_count: 4, is_habitability_critical: false }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { d3: "$.data.id" }
            - call: POST /damage-items/{id}/verification
              payload: { verification_status: "VERIFIED", verified_cost_cents: 1800000 }
              as: ConstructionManager
              as_user_id: u_cn_1
            - call: POST /recovery-cases/{id}/damage-items
              payload: { category: "ACCESSIBILITY", item_description: "Ramp and grab bars", documented_cost_cents: 600000, photo_count: 3, is_habitability_critical: false }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { d4: "$.data.id" }
            - call: POST /damage-items/{id}/verification
              payload: { verification_status: "VERIFIED", verified_cost_cents: 600000 }
              as: ConstructionManager
              as_user_id: u_cn_1
            - call: POST /recovery-cases/{id}/assistance-records
              payload: { source_type: "INSURANCE_SETTLEMENT", purpose_code: "STRUCTURE_REPAIR", awarded_cents: 7000000, received_on: "2026-07-15", documentation_status: "DOCUMENTED" }
              as: CaseManager
              as_user_id: u_cm_1
            - call: POST /recovery-cases/{id}/assistance-records
              payload: { source_type: "FEMA_IA", purpose_code: "TEMPORARY_HOUSING", awarded_cents: 900000, received_on: "2026-07-20", documentation_status: "DOCUMENTED" }
              as: CaseManager
              as_user_id: u_cm_1
            - call: POST /recovery-cases/{id}/assistance-records
              payload: { source_type: "NONPROFIT_GRANT", purpose_code: "CONTENTS_REPLACEMENT", awarded_cents: 400000, received_on: "2026-07-22", documentation_status: "DOCUMENTED" }
              as: CaseManager
              as_user_id: u_cm_1
            - call: POST /recovery-cases/{id}/assistance-records
              payload: { source_type: "SBA_LOAN", purpose_code: "STRUCTURE_REPAIR", awarded_cents: 1000000, received_on: "2026-07-25", documentation_status: "DISPUTED" }
              as: CaseManager
              as_user_id: u_cm_1
          trigger:
            - call: POST /recovery-cases/{id}/assessments
              payload: { variant: "PURPOSE_MATCHED" }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { a_pm: "$.data.id" }
            - call: POST /recovery-cases/{id}/assessments
              payload: { variant: "POOLED" }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { a_pl: "$.data.id" }
          assert:
            - "PURPOSE_MATCHED assessment: verified_damage_total_cents 14100000, bucket_need_cents summing to 14400000, total_documented_assistance_cents 8300000, unmet_need_total_cents 6700000, and per-bucket unmet {STRUCTURE_REPAIR 5000000, CONTENTS_REPLACEMENT 1100000, ACCESSIBILITY_MOD 600000, TEMPORARY_HOUSING 0}."
            - "POOLED assessment: same verified_damage_total_cents 14100000, the same bucket_need_cents summing to 14400000, the same total_documented_assistance_cents 8300000, but unmet_need_total_cents 6100000."
            - "Delta = 600000, exactly the TEMPORARY_HOUSING over-award (900000 - 300000)."
            - "The 1000000 DISPUTED record is in neither offset total."
      - name: skill_fit_coverage_weighted_6000_vs_headcount_weighted_10000
        grounds:
          - "calculations.volunteer_skill_fit_score.variants"
          - "calculations.volunteer_skill_fit_score.constants.VOLUNTEER_HOURS_PER_DAY"
          - "calculations.volunteer_skill_fit_score.constants.CRITICAL_TRADE_WEIGHT"
          - "endpoints[GET /construction-projects/{id}/skill-fit]"
          - "entities.VolunteerDeployment.fields.skill_fit_score_bps"
        distinguishing_aspect: "COVERAGE_WEIGHTED measures hours delivered against hours required, so a group that has every trade represented but not enough bodies to cover the 300 GENERAL_LABOR hours scores 6000 bps. HEADCOUNT_WEIGHTED only asks whether each required trade has at least one qualified member (weighted by CRITICAL_TRADE_WEIGHT), so the identical group scores a perfect 10000 bps. An implementation with only one scoring path cannot return both numbers for the same (project, group, window) tuple."
        test_recipe:
          setup:
            - "Case C3 with a PERMITTED ConstructionProject requiring {FRAMING 300 (critical), ROOFING 150, GENERAL_LABOR 300} trade hours; weighted denominator = 3*300 + 150 + 300 = 1350."
            - "VolunteerGroup G3 with member_count 12 and skill_profile {FRAMING 5, ROOFING 2, GENERAL_LABOR 12}."
            - "Window 2026-09-07..2026-09-11 = 5 days at VOLUNTEER_HOURS_PER_DAY 6, so capacity is FRAMING 150, ROOFING 60, GENERAL_LABOR 360; covered hours are min(capacity, required) = 150/60/300; weighted numerator = 3*150 + 60 + 300 = 810."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /survivors
              payload: { household_name: "Nakamura Household", primary_contact_phone: "555-0103", household_size: 3, income_band: "LOW", head_of_household_age: 44, has_member_with_disability: false, is_uninsured: false, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { s3: "$.data.id" }
            - call: POST /recovery-cases
              payload: { survivor_id: "${s3}", disaster_code: "DR-4801", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { c3: "$.data.id" }
            - call: POST /construction-projects
              payload: { case_id: "${c3}", scope_code: "INTERIOR_REPAIR", required_trade_hours: { FRAMING: 300, ROOFING: 150, GENERAL_LABOR: 300 }, estimated_material_cents: 900000, critical_trades: ["FRAMING"] }
              as: ConstructionManager
              as_user_id: u_cn_1
              captures: { p3: "$.data.id" }
            - call: POST /construction-projects/{id}/transition
              payload: { action: "PERMIT", permit_number: "PB-3301" }
              as: ConstructionManager
              as_user_id: u_cn_1
            - call: POST /volunteer-groups
              payload: { group_name: "Redwood Baptist Crew", home_organization: "Redwood Baptist", member_count: 12, skill_profile: { FRAMING: 5, ROOFING: 2, GENERAL_LABOR: 12 }, requires_housing: false, brings_own_tools: true }
              as: VolunteerCoordinator
              as_user_id: u_vc_1
              captures: { g3: "$.data.id" }
          trigger:
            - call: GET /construction-projects/{id}/skill-fit
              payload: { group_id: "${g3}", variant: "COVERAGE_WEIGHTED", arrival_date: "2026-09-07", departure_date: "2026-09-11" }
              as: VolunteerCoordinator
              as_user_id: u_vc_1
            - call: GET /construction-projects/{id}/skill-fit
              payload: { group_id: "${g3}", variant: "HEADCOUNT_WEIGHTED", arrival_date: "2026-09-07", departure_date: "2026-09-11" }
              as: VolunteerCoordinator
              as_user_id: u_vc_1
          assert:
            - "COVERAGE_WEIGHTED response: day_count 5, weighted_required 1350, weighted_covered 810, score_bps 6000, meets_minimum true (MIN_FIT_BPS 6000, gate is >=)."
            - "HEADCOUNT_WEIGHTED response for the identical window: weighted_required 5 (3 for critical FRAMING + 1 ROOFING + 1 GENERAL_LABOR), weighted_covered 5, score_bps 10000, meets_minimum true."
            - "Both responses echo the same day_count 5 and the same project_id/group_id."

  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_retention_rounded_per_line_yields_105001_not_105000
        grounds:
          - "calculations.restricted_fund_waterfall"
          - "calculations.restricted_fund_waterfall.constants.ADMIN_RETENTION_BPS"
          - "calculations.restricted_fund_waterfall.precision"
          - "entities.Disbursement.fields.allocation_lines"
          - "endpoints[POST /disbursements/{id}/approve]"
        distinguishing_aspect: "A 3000000 net disbursement splits across two STRUCTURE_REPAIR_ONLY sources into net legs of 1500100 and 1499900. round_half_up(1500100*350/10000) = 52504 (from 52503.5) and round_half_up(1499900*350/10000) = 52497 (from 52496.5); summing the per-line results gives 105001. An implementation that sums the net legs first and rounds once computes round_half_up(3000000*350/10000) = 105000, one cent short, and its gross_cents is 3105000 instead of 3105001. The source ordering (restriction_specificity DESC) is also load-bearing: the UNRESTRICTED 2000000 source must remain completely untouched even though it alone could have covered the draw."
        test_recipe:
          setup:
            - "Case C4: STRUCTURE damage verified 12000000, no assistance, PURPOSE_MATCHED assessment -> unmet 12000000."
            - "Session opened with quorum 1 and M1 (cap 5000000) attending; M1 pledges 3000000; an UNRESTRICTED FundingSource FS_U of 2000000 exists so the bridge pool is non-empty; AWARD gives TIER_C (unmet > 2500000) bridge_cap 1800000, gap 9000000, bridge 1800000, awarded 4800000, case ACTIVE_RECOVERY / PARTIALLY_COMMITTED."
            - "Project P4 PERMITTED."
            - "Two STRUCTURE_REPAIR_ONLY sources with admin_retention_allowed true: FS_S1 total 1552604 expiring 2026-10-31 and FS_S2 total 3000000 expiring 2026-11-30."
            - "Disbursement of 3000000 for STRUCTURE_REPAIR (DOB pool 0 against a 12000000 bucket need, so exposure 0 -> DOB_CLEARED)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /survivors
              payload: { household_name: "Okonkwo Household", primary_contact_phone: "555-0104", household_size: 5, income_band: "ELI", head_of_household_age: 51, has_member_with_disability: false, is_uninsured: true, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { s4: "$.data.id" }
            - call: POST /recovery-cases
              payload: { survivor_id: "${s4}", disaster_code: "DR-4801", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { c4: "$.data.id" }
            - call: POST /recovery-cases/{id}/damage-items
              payload: { category: "STRUCTURE", item_description: "Rebuild", documented_cost_cents: 12000000, photo_count: 20, is_habitability_critical: true }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { d41: "$.data.id" }
            - call: POST /damage-items/{id}/verification
              payload: { verification_status: "VERIFIED", verified_cost_cents: 12000000 }
              as: ConstructionManager
              as_user_id: u_cn_1
            - call: POST /recovery-cases/{id}/assessments
              payload: { variant: "PURPOSE_MATCHED" }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { a4: "$.data.id" }
            - call: POST /member-organizations
              payload: { org_name: "First Presbyterian Relief", org_type: "FAITH_BASED", contact_email: "relief@fpc.example", annual_pledge_cap_cents: 5000000 }
              as: LTRGAdmin
              as_user_id: u_admin_1
              captures: { m1: "$.data.id" }
            - call: POST /table-sessions
              payload: { session_label: "UNT 2026-09-04", scheduled_for: "2026-09-04T15:00:00Z", quorum_min_member_orgs: 1 }
              as: UnmetNeedsChair
              as_user_id: u_chair_1
              captures: { t4: "$.data.id" }
            - call: POST /table-sessions/{id}/open
              payload: { attending_member_org_ids: ["${m1}"] }
