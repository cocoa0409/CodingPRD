      - name: unauthenticated_missing_headers_returns_401
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request missing X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /training/programs"
              payload: { title: "NoAuth", category: "TECHNICAL", delivery_mode: "VIRTUAL" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

      - name: enroll_after_deadline_window_closed
        claim_type: Temporal validation
        grounds:
          - validations[priority=14]
          - errors[ERR_ENROLL_WINDOW_CLOSED]
        distinguishing_aspect: "Registering a learner after enroll_deadline (clock advanced past it) returns ERR_ENROLL_WINDOW_CLOSED (409)."
        test_recipe:
          setup:
            - "OPEN cohort with enroll_deadline 2026-07-13T00:00:00Z; clock advanced to 2026-07-13T01:00:00Z (after deadline, before starts_at)"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Win Prog", category: "TECHNICAL", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 2, pricing_model: "PER_SEAT", per_seat_cents: 10000, min_seats: 1 }
              as: ProgramDesigner
              captures: { pv_id: $.data.id }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/program-versions/${pv_id}/approve"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/facilitators"
              payload: { full_name: "Fac Wn", email: "facwn@x.com", certified_categories: ["TECHNICAL"] }
              as: SchedulingCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /training/cohorts"
              payload: { program_version_id: "${pv_id}", lead_facilitator_id: "${fac_id}", seat_capacity: 3, delivery_mode: "VIRTUAL", starts_at: "2026-07-14T09:00:00Z", ends_at: "2026-07-14T11:00:00Z", enroll_deadline: "2026-07-13T00:00:00Z" }
              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/open"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-13T01:00:00Z" }
              as: SchedulingCoordinator
          trigger:
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "wn@x.com", learner_name: "WN" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_ENROLL_WINDOW_CLOSED"

