      - name: error_scan_cycle_and_dispute_states_are_checked_separately
        claim_type: ERR_INVALID_SCAN_CYCLE_STATE
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_INVALID_SCAN_CYCLE_STATE]
          - errors[ERR_INVALID_FINDING_DISPUTE_STATE]
          - errors[ERR_FINDING_NOT_HIGH_SEVERITY]
        distinguishing_aspect: "The cycle and its findings carry independent state: findings may only be appended while the cycle is SCHEDULED, yet a dispute is raised against the finding's own dispute_status after the cycle has already completed. A LOW finding is not disputable at all, and a finding whose dispute_status is NONE cannot be decided - two different refusals from the same pair of endpoints."
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' is in SCOPING with one CDE segment and one component 'pay-01'."
            - "ScanCycle '2026-Q3' is SCHEDULED with window_start 2026-07-01T00:00:00Z under the approved vendor 'Northstar ASV'."
            - "The cycle carries two findings on pay-01: one with cvss_score 3.9 (severity_class LOW) and one with cvss_score 7.5 (HIGH_OR_ABOVE)."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_cde_id: $.data.id }
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-01", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { comp_pay_01_id: $.data.id }
            - call: "POST /asv-vendors"
              payload: { name: "Northstar ASV", approval_expires_at: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scan-cycles"
              payload: { quarter_label: "2026-Q3", asv_vendor_id: "${vendor_id}", window_start: "2026-07-01T00:00:00Z" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { cycle_id: $.data.id }
            - call: "POST /scan-cycles/${cycle_id}/findings"
              payload: { plugin_reference: "ASV-11022", cvss_score: 3.9, component_id: "${comp_pay_01_id}" }
              as: AsvVendor
              as_user_id: "${vendor_id}"
              captures: { find_low_id: $.data.id }
            - call: "POST /scan-cycles/${cycle_id}/findings"
              payload: { plugin_reference: "ASV-30877", cvss_score: 7.5, component_id: "${comp_pay_01_id}" }
              as: AsvVendor
              as_user_id: "${vendor_id}"
              captures: { find_high_id: $.data.id }
          trigger:
            - call: "POST /scan-findings/${find_low_id}/dispute"
              payload: { dispute_rationale: "The plugin flags a service that is not reachable." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_low: $.data.error_id }
            - call: "POST /scan-cycles/${cycle_id}/complete"
              payload: {}
              as: AsvVendor
              as_user_id: "${vendor_id}"
            - call: "POST /scan-cycles/${cycle_id}/findings"
              payload: { plugin_reference: "ASV-40001", cvss_score: 9.1, component_id: "${comp_pay_01_id}" }
              as: AsvVendor
              as_user_id: "${vendor_id}"
              captures: { err_findings_closed: $.data.error_id }
            - call: "POST /scan-cycles/${cycle_id}/complete"
              payload: {}
              as: AsvVendor
              as_user_id: "${vendor_id}"
              captures: { err_complete_twice: $.data.error_id }
            - call: "POST /scan-findings/${find_high_id}/dispute"
              payload: { dispute_rationale: "The scanner fingerprinted a backported patch level." }
              as: ClientRepresentative
            - call: "POST /scan-findings/${find_high_id}/dispute"
              payload: { dispute_rationale: "Repeat of the same claim." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_dispute_twice: $.data.error_id }
            - call: "POST /scan-findings/${find_low_id}/dispute-decision"
              payload: { decision: "ACCEPT", decision_note: "No dispute was ever raised on this finding." }
              as: AsvVendor
              as_user_id: "${vendor_id}"
              captures: { err_decide_undisputed: $.data.error_id }
          assert:
            - "ScanFinding.${find_low_id}.severity_class == LOW and ScanFinding.${find_high_id}.severity_class == HIGH_OR_ABOVE (4.0 is the inclusive boundary)"
            - "The first dispute returns HTTP 422 with ${err_low} == ERR_FINDING_NOT_HIGH_SEVERITY and leaves dispute_status NONE"
            - "The completion returns HTTP 200: ScanCycle.${cycle_id}.status == FAILING with raw_finding_count == 2, effective_high_finding_count == 1 and scan_completed_at == 2026-08-01T00:00:00Z"
            - "The appended finding returns HTTP 409 with ${err_findings_closed} == ERR_INVALID_SCAN_CYCLE_STATE and GET /scan-findings?scan_cycle_id=${cycle_id} still returns total_count 2"
            - "The second completion returns HTTP 409 with ${err_complete_twice} == ERR_INVALID_SCAN_CYCLE_STATE and scan_completed_at is unchanged"
            - "The client's dispute on the HIGH finding returns HTTP 200: dispute_status == DISPUTED, dispute_rationale recorded, and the cycle moves FAILING -> DISPUTE_OPEN with open_dispute_count == 1"
            - "The repeat dispute returns HTTP 409 with ${err_dispute_twice} == ERR_INVALID_FINDING_DISPUTE_STATE and the stored dispute_rationale is still the client's first text"
            - "The decision on the untouched LOW finding returns HTTP 409 with ${err_decide_undisputed} == ERR_INVALID_FINDING_DISPUTE_STATE - a decision requires dispute_status DISPUTED"
            - "Engagement.${eng_id}.quarterly_scan_compliant == false throughout - the cycle never reaches PASSING"

