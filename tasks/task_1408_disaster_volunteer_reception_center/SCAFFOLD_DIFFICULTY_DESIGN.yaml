            - "st_mid == VETTING (VERIFIED credential alone does not promote; BackgroundCheck must be CLEARED)"
            - "st_end == REJECTED (BackgroundCheck FLAGGED cascades VETTING -> REJECTED)"

  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — two overlap rules with DIFFERENT
  # interval semantics on DIFFERENT resources: half-open volunteer shift
  # intervals (adjacency legal) vs vehicle trips padded by a 45-minute
  # turnaround buffer (plain adjacency illegal).
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: volunteer_shift_overlap_half_open_adjacency_legal
        grounds:
          - calculations.volunteer_shift_overlap_check
          - errors[ERR_DOUBLE_BOOKED_SHIFT]
        distinguishing_aspect: |
          Resource: the Volunteer (via their assignments' shift intervals).
          Semantics: HALF-OPEN [start_at, end_at) — a shift starting exactly at
          the confirmed shift's end_at is legal, while one starting one hour
          before that end is rejected with ERR_DOUBLE_BOOKED_SHIFT.
        test_recipe:
          setup:
            - "Incident ACTIVE; volunteer READY; one request (headcount 3, wide window); shift S1 2026-08-10 08:00-16:00 with the volunteer's assignment CONFIRMED"
            - "S2 2026-08-10 16:00-20:00 (adjacent: S2.start == S1.end) and S3 2026-08-10 15:00-17:00 (overlaps S1 by one hour), both OPEN_FOR_ROSTER"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood Omicron", ppe_stock: { GLOVES: 5, MASK: 5, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Pia Poh", phone: "555-1616", email: "pia@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol: $.data.id } }
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "GENERAL_LABOR", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { bg: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County OES", site_name: "Levee South", required_skill: "GENERAL_LABOR", min_credential_class: "STANDARD", headcount_needed: 3, criticality: "STANDARD", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T23:00:00Z" }, as: AgencyCoordinator, captures: { req: $.data.id } }
            - { call: "POST /vrc/support-requests/${req}/publish", payload: {}, as: AgencyCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "Levee South", hazard_level: "GREEN", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z", capacity: 3 }, as: LogisticsCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /vrc/shifts/${s1}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "Levee South", hazard_level: "GREEN", start_at: "2026-08-10T16:00:00Z", end_at: "2026-08-10T20:00:00Z", capacity: 3 }, as: LogisticsCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /vrc/shifts/${s2}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "Levee South", hazard_level: "GREEN", start_at: "2026-08-10T15:00:00Z", end_at: "2026-08-10T17:00:00Z", capacity: 3 }, as: LogisticsCoordinator, captures: { s3: $.data.id } }
            - { call: "POST /vrc/shifts/${s3}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol}", support_request_id: "${req}", site_shift_id: "${s1}" }, as: IntakeCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /vrc/assignments/${a1}/accept", payload: {}, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /vrc/assignments/${a1}/confirm", payload: {}, as: IntakeCoordinator }
          trigger:
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol}", support_request_id: "${req}", site_shift_id: "${s2}" }, as: IntakeCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol}", support_request_id: "${req}", site_shift_id: "${s3}" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent proposal SUCCEEDED: a2 captured (S2 [16:00,20:00) touches S1 [08:00,16:00) at a single instant — half-open intervals do not conflict)"
            - "err == ERR_DOUBLE_BOOKED_SHIFT for S3 ([15:00,17:00) intersects S1 [08:00,16:00))"

      - name: vehicle_turnaround_buffer_blocks_adjacency_allows_exact_45min_gap
        grounds:
          - calculations.vehicle_turnaround_conflict_check
          - errors[ERR_VEHICLE_TURNAROUND_CONFLICT]
        distinguishing_aspect: |
          Resource: the vehicle (TransportTrip.vehicle_id) — a different resource
          from the volunteer interval rule, with DIFFERENT semantics: each trip
          blocks its window padded by 45 minutes on both sides, so a 30-minute
          gap is rejected (ERR_VEHICLE_TURNAROUND_CONFLICT) while an exactly
          45-minute gap is legal — plain adjacency would NOT be legal here,
          unlike the volunteer shift rule.
        test_recipe:
          setup:
            - "Incident ACTIVE; one shift (2026-08-10 08:00-16:00) to anchor trips; trip T1 on vehicle BUS-9 departs 2026-08-10T07:00:00Z, arrive_estimate 2026-08-10T08:00:00Z"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Quake Pi", ppe_stock: { GLOVES: 5, MASK: 5, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "Civic Center", hazard_level: "GREEN", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z", capacity: 10 }, as: LogisticsCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /vrc/trips", payload: { incident_id: "${inc}", site_shift_id: "${sh}", vehicle_id: "BUS-9", seat_capacity: 30, depart_at: "2026-08-10T07:00:00Z", arrive_estimate_at: "2026-08-10T08:00:00Z" }, as: LogisticsCoordinator, captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /vrc/trips", payload: { incident_id: "${inc}", site_shift_id: "${sh}", vehicle_id: "BUS-9", seat_capacity: 30, depart_at: "2026-08-10T08:30:00Z", arrive_estimate_at: "2026-08-10T09:00:00Z" }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /vrc/trips", payload: { incident_id: "${inc}", site_shift_id: "${sh}", vehicle_id: "BUS-9", seat_capacity: 30, depart_at: "2026-08-10T08:45:00Z", arrive_estimate_at: "2026-08-10T09:15:00Z" }, as: LogisticsCoordinator, captures: { t3: $.data.id } }
          assert:
            - "err == ERR_VEHICLE_TURNAROUND_CONFLICT for the 08:30 departure (30-minute gap < 45-minute turnaround buffer)"
            - "t3 captured: the 08:45 departure (exactly 45 minutes after T1's arrive_estimate) is legal — buffer semantics, not half-open semantics"

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant — two invariants over DIFFERENT conserved
  # quantities: trip seat inventory vs volunteer committed-hours ledger.
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: seat_book_then_cancel_then_rebook_preserves_seat_inventory
        grounds:
          - entities.TransportTrip.fields.booked_seats
          - state_machines.SeatBooking.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: trip seat inventory. Pinned invariant:
          TransportTrip.booked_seats == COUNT(SeatBookings of the trip with
          status in {BOOKED, BOARDED}) — a create (+1) paired with a cancel (-1)
          returns booked_seats to its prior value exactly, and a subsequent
          re-book for the same (assignment, trip) succeeds because CANCELLED
          bookings no longer count against uniqueness either.
        test_recipe:
          setup:
            - "Incident ACTIVE; volunteers V1 and V2 READY with CONFIRMED assignments A1, A2 on one shift; trip T seat_capacity 3"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood Rho", ppe_stock: { GLOVES: 5, MASK: 5, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
