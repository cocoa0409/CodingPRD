              as_user_id: "${cm_id}"
              captures: { cledger_id: $.data.id }
            - &cx_dispute
              call: "POST /point-disputes"
              payload: { member_id: "${cm_id}", disputed_ledger_entry_id: "${cledger_id}", claimed_points: 100, reason_code: "UNAUTHORIZED_REDEMPTION" }
              as: Member
              as_user_id: "${cm_id}"
              captures: { cd_id: $.data.id }
            - &cx_dispute_investigate
              call: "POST /point-disputes/${cd_id}/investigate"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
          trigger:
