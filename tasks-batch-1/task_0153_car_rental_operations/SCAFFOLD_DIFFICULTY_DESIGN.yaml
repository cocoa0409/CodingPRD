              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res1}", expected_vehicle_version: "${veh1_ver}" }
              as: RentalAgent
            - call: "POST /rental-agreements"
              payload: { reservation_id: "${res1}", vehicle_id: "${veh1}", odometer_out: 1000, fuel_out_eighths: 8 }
              as: RentalAgent
              captures: { agr1: $.data.id }
            - call: "POST /incident-reports"
              payload: { agreement_id: "${agr1}", severity: "MINOR", assessed_damage_cents: 25000 }
              as: RentalAgent
              captures: { inc1: $.data.id }
            - call: "POST /rental-agreements/${agr1}/close"
              payload: { odometer_in: 1100, fuel_in_eighths: 8 }
              as: RentalAgent
              captures: { final_before: $.data.final_total_cents }
          trigger:
            - call: "POST /incident-reports/${inc1}/void"
              payload: {}
              as: FleetManager
            - call: "GET /rental-agreements/${agr1}"
              payload: {}
              as: FleetManager
              captures: { final_after: $.data.final_total_cents }
          assert:
            - "RentalAgreement.${agr1}.final_total_cents (before void) == 40000"
            - "RentalAgreement.${agr1}.final_total_cents (after void) == 15000"
            - "the agreement gains one LedgerEntry of kind INCIDENT_REVERSAL with amount_cents == -25000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_member_blocked_beats_no_availability
        grounds:
          - validations[priority=8]
          - validations[priority=14]
          - state_machines.Reservation.QUOTED_to_CONFIRMED
        distinguishing_aspect: |
          On POST /reservations/{id}/confirm a single request that violates BOTH business_safety
          (ERR_MEMBER_BLOCKED, priority 8) and business_fiscal (ERR_NO_AVAILABILITY, priority 14) returns
          ERR_MEMBER_BLOCKED — the safety/fiscal category pair, lower-priority number wins.
        test_recipe:
          setup:
            - "Member with no_show_strikes==3 (blocked). Class ECON exists but has zero AVAILABLE vehicles (none added)."
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /members"
              payload: { email: "blocked@x.com", full_name: "Block Ed", driver_age: 30 }
              as: RentalAgent
              captures: { memb: $.data.id }
            - call: "POST /_members/${memb}/set_loyalty"
              payload: { no_show_strikes: 3 }
              as: FleetManager
            - call: "POST /reservations"
              payload: { member_id: "${memb}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { resb: $.data.id }
          trigger:
            - call: "POST /reservations/${resb}/confirm"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_MEMBER_BLOCKED"

