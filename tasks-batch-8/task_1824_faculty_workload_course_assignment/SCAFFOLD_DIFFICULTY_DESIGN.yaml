      - name: faculty_on_leave_cascade
        grounds:
          - state_machines.FacultyMember.ACTIVE_to_ON_LEAVE
          - state_machines.Assignment.CONFIRMED_to_RESCINDED
          - state_machines.CourseSection.STAFFED_to_SCHEDULED
        distinguishing_aspect: |
          Different triggering transition (PATCH faculty status, not section
          cancel), depth >= 2: faculty -> ON_LEAVE rescinds/withdraws her
          assignments (link 1), each rescission demotes its section STAFFED ->
          SCHEDULED (link 2) and recomputes the LoadSheet to 0 — with NO stipend
          (leave cascade is not a late chair rescind).
