  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_on_written_off_account_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=16]
          - errors[ERR_ACCOUNT_WRITTEN_OFF]
          - errors[ERR_OVERPAYMENT_REJECTED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the settle request violates
          both the WRITTEN_OFF posture precondition (state, priority 6) and
          the REJECT overpayment ceiling (business_fiscal, priority 16); the
          higher-priority state error ERR_ACCOUNT_WRITTEN_OFF must win.
        test_recipe:
          setup:
            - "OPEN year (k=10, writeoff_max=100000); account with a 3000-cent ad-hoc assessment; aged to BUCKET_3 (case opened 2026-08-12, clock advanced 30 days to 2026-09-11); write-off executed so posture is WRITTEN_OFF"
          setup_api_calls:
