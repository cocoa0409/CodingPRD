# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2551 - Liquidation Marketplace & Bulk Lot Auctions
#
# Nine §0.5 rule blocks, 2 instances each (18 total). Every grounds[] entry
# resolves into SCAFFOLD.yaml §1.1-§1.7; every setup_api_calls chain runs from
# an empty database using only §1.5 endpoints; every numeric assertion below was
# computed against the §1.3 formulas and their constants before being written.
#
# Standing conventions used by every chain in this file:
#   * the logical clock starts at 2026-08-01T00:00:00Z and is only ever moved by
#     POST /_clock/set_current_utc
#   * SellerOps sends X-User-ID == SellerAccount.id, Buyer sends
#     X-User-ID == BuyerAccount.id (both roles are entity_backed per §1.7)
#   * opaque roles use stable literal operator ids so the §1.4 priority-5
#     segregation-of-duties rule is observable: "ops-review-1" reviews manifests,
#     "ops-claims-9" decides claims, "ops-dock-1" completes pickups,
#     "ops-close-1" closes auctions, "ops-sweep-1" runs sweeps,
#     "ts-1"/"ts-2" act for TrustSafety, "admin-1" for PlatformAdmin
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: order_settlement_provisional_vs_final_freight_delta
        grounds:
          - calculations.order_settlement
          - calculations.freight_estimate
          - calculations.buyer_premium
          - state_machines.SaleOrder.APPOINTMENT_SCHEDULED_to_PICKED_UP
          - state_machines.PickupAppointment.SCHEDULED_to_COMPLETED
          - entities.SaleOrder.fields.settlement_basis
          - entities.SaleOrder.fields.estimated_freight_cents
          - entities.SaleOrder.fields.actual_freight_cents
        distinguishing_aspect: |
          This dual variant lives in the SaleOrder money domain: the PROVISIONAL basis prices freight
          from the lot's pallet count (2 pallets x 8500 = 17000) while the FINAL basis substitutes the
          carrier's invoice (19000), so pre_fee_total_cents moves from 2987000 to 2989000 and the
          entire 2000-cent delta is freight while buyer_premium_cents stays 270000 in both variants.
        test_recipe:
          setup:
            - "One seller, one 1-door warehouse, one carrier with daily capacity 5, one QUALIFIED buyer with a 10,000,000-cent credit limit."
            - "Lot S1 is CUSTOMER_RETURNS with two ACTIVE manifest lines (100 x 40000 and 300 x 20000): declared_unit_count 400, declared_retail_value_cents 10000000."
            - "An AUCTION listing on S1 with opening_bid_cents 1000000, reserve_price_cents 2700000 and bid_increment_cents 100000 is OPEN over [2026-08-05T00:00:00Z, 2026-08-12T00:00:00Z)."
            - "The buyer's single LIVE bid of 2700000 wins at close, producing a SaleOrder with settlement_basis PROVISIONAL, estimated_freight_cents 17000 and total_due_cents 2987000, which the buyer pays in full."
            - "A pickup appointment is SCHEDULED for [2026-08-18T14:00:00Z, 2026-08-18T15:00:00Z) and the clock stands at its window_start_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 1, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/carriers"
              payload: { name: "Keystone Freight", scac_code: "KEYF", daily_pickup_capacity: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { c1: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts"
              payload: { legal_name: "Gulf Resale Co", tax_id: "B-2001", state_code: "TX", contact_email: "buy@gulf.example", resale_certificate_number: "TX-RC-77", resale_certificate_expires_on: "2027-01-31", requested_credit_limit_cents: 10000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ba: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts/${ba}/qualification-decisions"
              payload: { decision: "QUALIFY", business_verified: true, approved_credit_limit_cents: 10000000 }
              as: TrustSafety
              as_user_id: "ts-1"
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Apparel customer returns S1", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lot1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-100", unit_count: 100, unit_retail_cents: 40000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { ml1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-200", unit_count: 300, unit_retail_cents: 20000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot1}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot1}/manifest-reviews"
              payload: { decision: "APPROVE", review_note: "manifest matches photos" }
              as: MarketplaceOps
              as_user_id: "ops-review-1"
            - call: "POST /liquidation/lots/${lot1}/listings"
              payload: { listing_format: "AUCTION", resale_channel: "MARKETPLACE_RESALE", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-12T00:00:00Z", opening_bid_cents: 1000000, reserve_price_cents: 2700000, bid_increment_cents: 100000 }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lst1: "$.data.id" }
            - call: "POST /liquidation/listings/${lst1}/publications"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T01:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/listings/${lst1}/bids"
              payload: { buyer_id: "${ba}", amount_cents: 2700000 }
              as: Buyer
              as_user_id: "${ba}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/listings/${lst1}/closures"
              payload: {}
              as: MarketplaceOps
              as_user_id: "ops-close-1"
            - call: "GET /liquidation/sale-orders"
              payload: { listing_id: "${lst1}" }
              as: MarketplaceOps
              as_user_id: "ops-close-1"
              captures: { so1: "$.data[0].id", prov_total: "$.data[0].total_due_cents", prov_freight: "$.data[0].estimated_freight_cents" }
            - call: "POST /liquidation/sale-orders/${so1}/payments"
              payload: { amount_cents: 2987000 }
              as: Buyer
              as_user_id: "${ba}"
            - call: "POST /liquidation/sale-orders/${so1}/pickup-appointments"
              payload: { warehouse_id: "${w1}", carrier_id: "${c1}", window_start_at: "2026-08-18T14:00:00Z", window_end_at: "2026-08-18T15:00:00Z", bol_number: "BOL-0001" }
              as: Buyer
              as_user_id: "${ba}"
              captures: { ap1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-18T14:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /liquidation/pickup-appointments/${ap1}/completions"
              payload: { actual_freight_cents: 19000, picked_up_unit_count: 320 }
              as: MarketplaceOps
              as_user_id: "ops-dock-1"
          assert:
            - "${prov_total} == 2987000 (PROVISIONAL variant: 2700000 hammer + 270000 premium + 17000 estimated freight)"
            - "${prov_freight} == 17000 (ceil(400 / 200) = 2 pallets x 8500)"
            - "SaleOrder.${so1}.settlement_basis == FINAL"
            - "SaleOrder.${so1}.actual_freight_cents == 19000"
            - "SaleOrder.${so1}.estimated_freight_cents == 17000 (the PROVISIONAL input is retained, not overwritten)"
            - "SaleOrder.${so1}.pre_fee_total_cents == 2989000"
            - "SaleOrder.${so1}.total_due_cents == 2989000"
            - "SaleOrder.${so1}.balance_due_cents == 2000 (the FINAL total minus the 2987000 already paid)"
            - "SaleOrder.${so1}.buyer_premium_bps == 1000 and buyer_premium_cents == 270000, identical under both variants"
            - "SaleOrder.${so1}.total_due_cents - ${prov_total} == 2000, exactly the freight delta 19000 - 17000"
            - "SaleOrder.${so1}.logistics_status == PICKED_UP and PickupAppointment.${ap1}.appointment_status == COMPLETED"

      - name: recovery_rate_gross_and_net_diverge_on_seller_account
        grounds:
          - calculations.recovery_rate
          - calculations.commission_tier_assignment
          - calculations.seller_net_proceeds
          - entities.SellerAccount.fields.gross_recovery_rate
          - entities.SellerAccount.fields.net_recovery_rate
          - endpoints[GET /liquidation/recovery-analytics]
        distinguishing_aspect: |
          This dual variant lives in the SellerAccount analytics domain, not in the SaleOrder money
          domain: over the very same single sale the GROSS basis reports 0.1929 (2700000 hammer over
          14000000 of listed retail, including the unsold lot Y) while the NET basis reports 0.2295
          (2295000 of post-commission proceeds over the 10000000 of retail that actually sold), and
          publishing lot Y moves GROSS while leaving NET untouched.
        test_recipe:
          setup:
            - "One seller, one 1-door warehouse, one carrier, one QUALIFIED buyer with a 10,000,000-cent limit."
            - "Lot X is NEW_OVERSTOCK with one ACTIVE line 100 x 100000: declared_unit_count 100, declared_retail_value_cents 10000000."
            - "Lot X sells through a FIXED_PRICE listing at ask_price_cents 2700000, is paid in full (2978500) and is picked up with actual_freight_cents 9000, so it settles FINAL with seller_commission_rate_bps 1500, seller_commission_cents 405000 and seller_net_proceeds_cents 2295000."
            - "Lot Y is NEW_OVERSTOCK with one ACTIVE line 40 x 100000 (declared_retail_value_cents 4000000) and holds a DRAFT AUCTION listing that has not yet been published."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Zephyr Liquidations", tax_id: "S-1002", state_code: "OH", contact_email: "ops@zephyr.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Toledo DC", state_code: "OH", dock_door_count: 1, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/carriers"
              payload: { name: "Keystone Freight", scac_code: "KEYF", daily_pickup_capacity: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { c1: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts"
              payload: { legal_name: "Gulf Resale Co", tax_id: "B-2001", state_code: "TX", contact_email: "buy@gulf.example", resale_certificate_number: "TX-RC-77", resale_certificate_expires_on: "2027-01-31", requested_credit_limit_cents: 10000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ba: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts/${ba}/qualification-decisions"
              payload: { decision: "QUALIFY", business_verified: true, approved_credit_limit_cents: 10000000 }
              as: TrustSafety
              as_user_id: "ts-1"
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Electronics overstock X", category_code: "ELECTRONICS", condition_grade: "NEW_OVERSTOCK" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lotx: "$.data.id" }
            - call: "POST /liquidation/lots/${lotx}/manifest-lines"
              payload: { sku: "ELX-1", unit_count: 100, unit_retail_cents: 100000, declared_condition: "NEW" }
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lotx}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lotx}/manifest-reviews"
              payload: { decision: "APPROVE" }
              as: MarketplaceOps
              as_user_id: "ops-review-1"
            - call: "POST /liquidation/lots/${lotx}/listings"
              payload: { listing_format: "FIXED_PRICE", resale_channel: "DISCOUNT_RETAIL", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-20T00:00:00Z", ask_price_cents: 2700000 }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lstx: "$.data.id" }
            - call: "POST /liquidation/listings/${lstx}/publications"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T01:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/listings/${lstx}/bids"
              payload: { buyer_id: "${ba}", amount_cents: 2700000 }
              as: Buyer
              as_user_id: "${ba}"
            - call: "GET /liquidation/sale-orders"
              payload: { listing_id: "${lstx}" }
              as: MarketplaceOps
              as_user_id: "ops-close-1"
              captures: { sox: "$.data[0].id" }
            - call: "POST /liquidation/sale-orders/${sox}/payments"
              payload: { amount_cents: 2978500 }
              as: Buyer
              as_user_id: "${ba}"
            - call: "POST /liquidation/sale-orders/${sox}/pickup-appointments"
              payload: { warehouse_id: "${w1}", carrier_id: "${c1}", window_start_at: "2026-08-10T14:00:00Z", window_end_at: "2026-08-10T15:00:00Z", bol_number: "BOL-X1" }
              as: Buyer
              as_user_id: "${ba}"
              captures: { apx: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/pickup-appointments/${apx}/completions"
              payload: { actual_freight_cents: 9000, picked_up_unit_count: 100 }
              as: MarketplaceOps
              as_user_id: "ops-dock-1"
            - call: "GET /liquidation/recovery-analytics"
              payload: { seller_id: "${s1}" }
              as: MarketplaceOps
              as_user_id: "ops-close-1"
              captures: { gross_before: "$.data.gross_recovery_rate", net_before: "$.data.net_recovery_rate" }
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Electronics overstock Y", category_code: "ELECTRONICS", condition_grade: "NEW_OVERSTOCK" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { loty: "$.data.id" }
            - call: "POST /liquidation/lots/${loty}/manifest-lines"
              payload: { sku: "ELY-1", unit_count: 40, unit_retail_cents: 100000, declared_condition: "NEW" }
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${loty}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${loty}/manifest-reviews"
              payload: { decision: "APPROVE" }
              as: MarketplaceOps
              as_user_id: "ops-review-1"
            - call: "POST /liquidation/lots/${loty}/listings"
              payload: { listing_format: "AUCTION", resale_channel: "DISCOUNT_RETAIL", window_start_at: "2026-08-11T00:00:00Z", window_end_at: "2026-08-20T00:00:00Z", opening_bid_cents: 1000000, reserve_price_cents: 2000000, bid_increment_cents: 100000 }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lsty: "$.data.id" }
          trigger:
            - call: "POST /liquidation/listings/${lsty}/publications"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "GET /liquidation/recovery-analytics"
              payload: { seller_id: "${s1}" }
              as: MarketplaceOps
              as_user_id: "ops-close-1"
              captures: { gross_after: "$.data.gross_recovery_rate", net_after: "$.data.net_recovery_rate", gh: "$.data.gross_hammer_cents", lrv: "$.data.listed_retail_value_cents", npc: "$.data.net_proceeds_cents", srv: "$.data.sold_retail_value_cents" }
          assert:
            - "${gross_before} == 0.2700 and ${net_before} == 0.2295 before lot Y is published"
            - "${gh} == 2700000"
            - "${lrv} == 14000000 (lot X 10000000 SOLD plus lot Y 4000000 LISTED)"
            - "${gross_after} == 0.1929 (round_half_up(2700000 / 14000000, 4))"
            - "${npc} == 2295000 and ${srv} == 10000000"
            - "${net_after} == 0.2295 (round_half_up(2295000 / 10000000, 4)), unchanged by lot Y"
            - "${gross_after} != ${net_after} on the same single sale - the two variants disagree by 366 ten-thousandths"
            - "SellerAccount.${s1}.commission_tier == TIER_STANDARD and commission_rate_bps == 2000 (GROSS fell below the 0.2500 threshold)"
            - "SaleOrder.${sox}.seller_commission_rate_bps == 1500 (frozen at pickup; the later tier drop does not reprice a settled order)"
            - "SaleOrder.${sox}.seller_net_proceeds_cents == 2295000"

  # ===========================================================================
  # Rule 2 - combinatorial formulas, two different modes
  #   instance 1 uses mode (a): >=3 inputs combined non-linearly (nested min/max)
  #   instance 2 uses mode (b): nested rounding whose order changes the result
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: proxy_bid_public_price_from_nested_min_of_three_inputs
        grounds:
          - calculations.proxy_bid_resolution
          - calculations.anti_sniping_extension
          - concurrency_rules[Listing]
          - entities.Listing.fields.current_high_bid_cents
          - entities.Listing.fields.min_next_bid_cents
          - entities.Bid.fields.ceiling_cents
          - endpoints[POST /liquidation/listings/{id}/proxy-bids]
        distinguishing_aspect: |
          Mode (a). The published price is a non-linear combination of three independent inputs -
          the challenger's amount, the standing proxy ceiling and the increment - resolved as
          min(ceiling, challenger + increment): a 2600000 challenge against a 3000000 ceiling with a
          100000 increment publishes 2700000, neither the challenger's number, nor the sum
          2700000-by-coincidence-only ceiling, nor the naive "ceiling wins" 3000000. A single-input
          or additive reading cannot reproduce the 1100000 -> 2700000 -> min_next 2800000 sequence.
        test_recipe:
          setup:
            - "Seller, 1-door warehouse, carrier, and TWO QUALIFIED buyers (buyer A and buyer B), each with a 10,000,000-cent credit limit."
            - "Lot S1 (400 units / 10000000 retail, CUSTOMER_RETURNS) carries an OPEN AUCTION listing over [2026-08-05T00:00:00Z, 2026-08-12T00:00:00Z) with opening_bid_cents 1000000, reserve_price_cents 2700000 and bid_increment_cents 100000."
            - "The clock stands at 2026-08-05T01:00:00Z, far outside the 120-second snipe window."
            - "Buyer A holds the high bid at exactly the opening price 1000000; buyer B then lodges a PROXY bid with max_amount_cents 3000000, which auto-advances the price to 1100000 in B's favour."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 1, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts"
              payload: { legal_name: "Gulf Resale Co", tax_id: "B-2001", state_code: "TX", contact_email: "buy@gulf.example", resale_certificate_number: "TX-RC-77", resale_certificate_expires_on: "2027-01-31", requested_credit_limit_cents: 10000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ba: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts/${ba}/qualification-decisions"
              payload: { decision: "QUALIFY", business_verified: true, approved_credit_limit_cents: 10000000 }
              as: TrustSafety
              as_user_id: "ts-1"
            - call: "POST /liquidation/buyer-accounts"
              payload: { legal_name: "Ridge Wholesale Inc", tax_id: "B-2002", state_code: "AZ", contact_email: "buy@ridge.example", resale_certificate_number: "AZ-RC-31", resale_certificate_expires_on: "2027-01-31", requested_credit_limit_cents: 10000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { bb: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts/${bb}/qualification-decisions"
              payload: { decision: "QUALIFY", business_verified: true, approved_credit_limit_cents: 10000000 }
              as: TrustSafety
              as_user_id: "ts-1"
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Apparel customer returns S1", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lot1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-100", unit_count: 100, unit_retail_cents: 40000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-200", unit_count: 300, unit_retail_cents: 20000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot1}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot1}/manifest-reviews"
              payload: { decision: "APPROVE" }
              as: MarketplaceOps
              as_user_id: "ops-review-1"
            - call: "POST /liquidation/lots/${lot1}/listings"
