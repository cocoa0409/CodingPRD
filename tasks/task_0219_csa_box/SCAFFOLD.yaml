scenario: |
  Community Supported Agriculture (CSA) Box: share type/size, season subscription,
  weekly box composition, pickup-site/home-delivery, vacation hold/swap, add-on
  (eggs/flowers), waitlist/capacity, working-share/sliding-scale.

domain_name: csa-box
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities (Season, ShareType, AddOn, PickupSite, Member) joined by FK
  # references; Subscription is the central resource that fans out to WeeklyBox,
  # VacationHold, SubscriptionAddOn, WorkShareShift, LedgerEntry, WaitlistEntry.

  state_machine_shape: parallel
  # Subscription carries two independent state axes (billing_status ×
  # fulfillment_status). WeeklyBox is cyclic (SCHEDULED⇄HELD via hold/release).
  # WaitlistEntry branches (OFFERED→{CONVERTED, EXPIRED, DECLINED}).

  relationship_patterns:
    - one_to_many       # Season→Subscription, Subscription→WeeklyBox/VacationHold
    - many_to_many      # Subscription↔AddOn via SubscriptionAddOn junction
    - cross_aggregate   # WeeklyBox capacity counted across a PickupSite/week
    - self_referential  # VacationHold.swap_target_box_id references a sibling WeeklyBox

  role_model: peer_roles
  # Member owns their own Subscription/Holds; FarmManager configures the season
  # and runs weekly fulfillment; DeliveryCoordinator manages sites/capacity and
  # promotes the waitlist. PlatformAdmin is an opaque operator for clock/ledger.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Season label, e.g. "Summer 2026".
      - name: week_count
        type: integer
        source: input
        description: Number of delivery weeks in the season.
        constraints: integer, 1..52
      - name: first_delivery_date
        type: datetime
        source: input
        description: ISO date (UTC midnight) of delivery week 1. Subsequent weeks are +7 days each.
      - name: signup_close_date
        type: datetime
        source: input
        description: ISO datetime after which new subscriptions are waitlisted instead of confirmed.
      - name: status
        type: enum
        source: computed
        description: DRAFT on create; OPEN after open action; CLOSED after close action. Gates subscription creation.
        default: DRAFT
        constraints: one of {DRAFT, OPEN, CLOSED}
      - name: total_share_capacity
        type: integer
        source: input
        description: Season-wide cap on confirmed subscriptions across all sites combined.
        constraints: integer >= 0
      - name: confirmed_share_count
        type: integer
        source: computed
        description: Count of Subscriptions for this season whose billing_status IN {CONFIRMED, ACTIVE}. Recomputed on each confirm/cancel side effect.
        default: 0

  - name: PickupSite
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this site serves."
      - name: name
        type: string
        source: input
        description: Site label, e.g. "Downtown Market".
      - name: kind
        type: enum
        source: input
        description: PICKUP for a physical pickup location; HOME_DELIVERY for a routed home-delivery zone.
        constraints: one of {PICKUP, HOME_DELIVERY}
      - name: weekly_capacity
        type: integer
        source: input
        description: Maximum boxes that may be fulfilled at this site in any single delivery week.
        constraints: integer >= 0
      - name: delivery_surcharge_cents
        type: integer
        source: input
        description: Per-week surcharge added to billing when kind == HOME_DELIVERY; ignored for PICKUP.
        default: 0
        constraints: integer >= 0
      - name: active_subscription_count
        type: integer
        source: computed
        description: Count of Subscriptions whose current_site_id == this site and billing_status IN {CONFIRMED, ACTIVE}. Used for capacity checks; recomputed on assignment side effects.
        default: 0

  - name: ShareType
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this share is offered in."
      - name: size
        type: enum
        source: input
        description: Box size tier.
        constraints: one of {SMALL, MEDIUM, LARGE}
      - name: base_price_cents
        type: integer
        source: input
        description: Full-season list price in cents for this share at the BASELINE sliding-scale tier.
        constraints: integer > 0
      - name: items_per_box
        type: integer
        source: input
        description: Number of produce line items composed into each WeeklyBox for this share.
        constraints: integer >= 1

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this add-on is offered in."
      - name: kind
        type: enum
        source: input
        description: Add-on product.
        constraints: one of {EGGS, FLOWERS}
      - name: weekly_price_cents
        type: integer
        source: input
        description: Per-delivery-week price in cents for this add-on.
        constraints: integer > 0
      - name: weekly_supply_cap
        type: integer
        source: input
        description: Maximum SubscriptionAddOn rows (per week of demand) the farm can fulfill for this add-on across the whole season.
        constraints: integer >= 0
      - name: committed_count
        type: integer
        source: computed
        description: Count of SubscriptionAddOn rows with status == ATTACHED referencing this add-on. Recomputed on attach/detach side effects.
        default: 0

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Unique member email (case-insensitive unique).
      - name: full_name
        type: string
        source: input
        description: Member display name.
      - name: sliding_scale_tier
        type: enum
        source: input
        description: Self-declared pay tier governing the price multiplier applied to share base price.
        default: BASELINE
        constraints: one of {SOLIDARITY, BASELINE, SUSTAINER}
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: Member credit balance in cents accrued from completed working-share shifts and refunded held weeks; consumed first when an invoice is charged. Recomputed on ledger side effects.
        default: 0

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season subscribed to."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the owning member."
      - name: share_type_id
        type: string
        source: input
        description: "FK -> ShareType.id; the chosen share size; must belong to season_id."
      - name: current_site_id
        type: string
        source: input
        description: "FK -> PickupSite.id; the site/delivery zone currently assigned; must belong to season_id."
      - name: working_share_opt_in
        type: boolean
        source: input
        description: Whether the member opted into the working-share program (earns wallet credit per completed shift).
        default: false
      - name: billing_status
        type: enum
        source: computed
        description: Billing lifecycle axis. PENDING_PAYMENT on create-confirm path; CONFIRMED once invoiced; ACTIVE after first delivery week charged; CANCELLED on cancel. Independent of fulfillment_status.
        default: PENDING_PAYMENT
        constraints: one of {PENDING_PAYMENT, CONFIRMED, ACTIVE, CANCELLED}
      - name: fulfillment_status
        type: enum
        source: computed
        description: Fulfillment lifecycle axis. NOT_STARTED until first box delivered; IN_SEASON while weeks remain; COMPLETED once all weeks terminal. Independent of billing_status.
        default: NOT_STARTED
        constraints: one of {NOT_STARTED, IN_SEASON, COMPLETED}
      - name: season_price_cents
        type: integer
        source: computed
        description: Computed full-season share charge (sliding-scale tier multiplier × ShareType.base_price_cents), pinned at confirm time. See §1.3 season_share_price.
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: Running amount owed = season_price + add-on charges + delivery surcharges − wallet credit applied − payments. Recomputed on each LedgerEntry side effect.
        default: 0

  - name: SubscriptionAddOn
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription the add-on attaches to."
      - name: add_on_id
        type: string
        source: input
        description: "FK -> AddOn.id; the add-on attached; must share the subscription's season."
      - name: status
        type: enum
        source: computed
        description: ATTACHED while active; DETACHED after removal. Detaching frees one unit of the add-on's weekly_supply_cap.
        default: ATTACHED
        constraints: one of {ATTACHED, DETACHED}

  - name: WeeklyBox
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription this box belongs to."
      - name: week_index
        type: integer
        source: system
        description: 1-based delivery week number within the season (1..Season.week_count).
        constraints: integer >= 1
      - name: site_id
        type: string
        source: input
        description: "FK -> PickupSite.id; the site this specific week's box is routed to (defaults to subscription.current_site_id at generation; may differ after a swap)."
      - name: status
        type: enum
        source: computed
        description: SCHEDULED when generated; HELD when a VacationHold covers it (cyclic — may return to SCHEDULED on release); PACKED after weekly fulfillment; DELIVERED at terminal; SKIPPED if held through its delivery date.
        default: SCHEDULED
        constraints: one of {SCHEDULED, HELD, PACKED, DELIVERED, SKIPPED}
      - name: item_count
        type: integer
        source: computed
        description: Number of produce line items packed; equals ShareType.items_per_box for a normally packed box, 0 for SKIPPED.
        default: 0

  - name: VacationHold
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription requesting the hold."
      - name: held_box_id
        type: string
        source: input
        description: "FK -> WeeklyBox.id; the SCHEDULED box being held; must belong to subscription_id."
      - name: swap_target_box_id
        type: string
        source: input
        description: "FK -> WeeklyBox.id; optional later box that receives the held box's value as a double box (self-referential within the same subscription); null for a plain refund-to-credit hold."
        default: null
      - name: mode
        type: enum
        source: computed
        description: REFUND when no swap target (held week refunded to wallet credit); SWAP when a swap target is provided (value moved forward, no refund).
        constraints: one of {REFUND, SWAP}
      - name: status
        type: enum
        source: computed
        description: ACTIVE once placed; RELEASED if cancelled before the held week's delivery date (box returns to SCHEDULED, refund/swap reversed); CONSUMED once the held week passes its delivery date.
        default: ACTIVE
        constraints: one of {ACTIVE, RELEASED, CONSUMED}

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season waited on."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the waiting member."
      - name: share_type_id
        type: string
        source: input
        description: "FK -> ShareType.id; the requested share size."
      - name: requested_site_id
        type: string
        source: input
        description: "FK -> PickupSite.id; the requested site/zone."
      - name: status
        type: enum
        source: computed
        description: WAITING in queue; OFFERED when promoted (a slot opened); CONVERTED if the member accepts into a Subscription; DECLINED if the member rejects; EXPIRED if the offer lapses past its deadline.
        default: WAITING
        constraints: one of {WAITING, OFFERED, CONVERTED, DECLINED, EXPIRED}
      - name: offer_expires_at
        type: datetime
        source: computed
        description: Deadline by which an OFFERED entry must be accepted; set to current clock + 48h at promotion; null while WAITING.
        default: null

  - name: WorkShareShift
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; must have working_share_opt_in == true."
      - name: scheduled_date
        type: datetime
        source: input
        description: ISO datetime the shift is scheduled for.
      - name: hours
        type: number
        source: input
        description: Shift length in hours.
        constraints: number > 0
      - name: status
        type: enum
        source: computed
        description: SCHEDULED on create; COMPLETED when logged complete (accrues wallet credit); NO_SHOW if marked missed (no credit, may incur penalty).
        default: SCHEDULED
        constraints: one of {SCHEDULED, COMPLETED, NO_SHOW}
      - name: credit_earned_cents
        type: integer
        source: computed
        description: Wallet credit accrued on COMPLETED = round_half_up(hours × WORK_CREDIT_RATE_CENTS_PER_HOUR); 0 otherwise.
        default: 0

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription the entry posts against."
      - name: entry_type
        type: enum
        source: input
        description: CHARGE_SEASON (full-season share charge), CHARGE_ADDON, CHARGE_SURCHARGE, CREDIT_WORKSHARE, CREDIT_HOLD_REFUND, PAYMENT (member payment applied). Append-only.
        constraints: one of {CHARGE_SEASON, CHARGE_ADDON, CHARGE_SURCHARGE, CREDIT_WORKSHARE, CREDIT_HOLD_REFUND, PAYMENT}
      - name: amount_cents
        type: integer
        source: input
        description: Signed cents — positive for CHARGE_*, negative for CREDIT_* and PAYMENT entries.
      - name: memo
        type: string
        source: input
        description: Free-text description.
        default: ""

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /seasons/{id}/open"
        actor: FarmManager
        preconditions:
          - "Season has >= 1 ShareType and >= 1 PickupSite"
        side_effects:
          - "Subscriptions may now be created for this season"
      - from: OPEN
        to: CLOSED
        trigger: "POST /seasons/{id}/close"
        actor: FarmManager
        preconditions:
          - "Season.status == OPEN"
        side_effects:
          - "No new CONFIRMED subscriptions; further signups are waitlisted"

  - entity: Subscription
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    note: "Two independent axes — billing_status (below) and fulfillment_status — evolve on the same row (parallel dimensions). fulfillment_status transitions are listed after the billing axis."
    transitions:
      # ---- billing_status axis ----
      - from: PENDING_PAYMENT
        to: CONFIRMED
        trigger: "POST /subscriptions/{id}/confirm"
        actor: FarmManager
        preconditions:
          - "Season.status == OPEN"
          - "Season.confirmed_share_count < Season.total_share_capacity (capacity rule, strict <)"
          - "current_site_id PickupSite.active_subscription_count < PickupSite.weekly_capacity"
          - "current clock <= Season.signup_close_date"
        side_effects:
          - "compute season_price_cents via §1.3 season_share_price and post LedgerEntry CHARGE_SEASON"
          - "if HOME_DELIVERY site, post LedgerEntry CHARGE_SURCHARGE = delivery_surcharge_cents × Season.week_count"
          - "generate Season.week_count WeeklyBox rows (week_index 1..week_count, status SCHEDULED, site_id = current_site_id)"
          - "recompute outstanding_balance_cents via §1.3 outstanding_balance"
          - "increment Season.confirmed_share_count by 1"
          - "increment PickupSite.active_subscription_count by 1"
          - "increments Subscription.version by 1"
      - from: CONFIRMED
        to: ACTIVE
        trigger: "system: first WeeklyBox reaches DELIVERED"
        actor: system
        preconditions:
          - ">= 1 WeeklyBox for this subscription has status == DELIVERED"
        side_effects:
          - "fulfillment_status set to IN_SEASON if not already COMPLETED"
      - from: PENDING_PAYMENT
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Member
        preconditions:
          - "billing_status IN {PENDING_PAYMENT, CONFIRMED, ACTIVE}"
        side_effects:
          - "cancel all non-terminal WeeklyBox rows (SCHEDULED/HELD → SKIPPED) [cascade hop 1]"
          - "each SKIPPED box that was HELD releases its VacationHold (ACTIVE → RELEASED) [cascade hop 2]"
          - "detach all ATTACHED SubscriptionAddOn rows (→ DETACHED), decrement each AddOn.committed_count [cascade hop 3]"
          - "post LedgerEntry CREDIT_HOLD_REFUND for undelivered prepaid weeks; recompute outstanding_balance_cents"
          - "decrement Season.confirmed_share_count and PickupSite.active_subscription_count by 1 each"
          - "increments Subscription.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Member
        preconditions:
          - "billing_status IN {PENDING_PAYMENT, CONFIRMED, ACTIVE}"
        side_effects:
          - "same cascade as PENDING_PAYMENT→CANCELLED above (hops 1–3 plus ledger/counters)"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Member
        preconditions:
          - "billing_status IN {PENDING_PAYMENT, CONFIRMED, ACTIVE}"
        side_effects:
          - "same cascade as above; CREDIT_HOLD_REFUND covers only weeks whose box is still non-terminal"
          - "increments Subscription.version by 1"
      # ---- fulfillment_status axis (parallel) ----
      - from: NOT_STARTED
        to: IN_SEASON
        trigger: "system: first WeeklyBox DELIVERED"
        actor: system
        preconditions:
          - "billing_status IN {CONFIRMED, ACTIVE}"
        side_effects:
          - "no ledger change"
      - from: IN_SEASON
        to: COMPLETED
        trigger: "system: every WeeklyBox terminal (DELIVERED or SKIPPED)"
        actor: system
        preconditions:
          - "count of WeeklyBox with status NOT IN {DELIVERED, SKIPPED} == 0 (bubble-up)"
        side_effects:
          - "no ledger change"

  - entity: WeeklyBox
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, SKIPPED]
    note: "Cyclic: SCHEDULED⇄HELD via place/release hold."
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /vacation-holds (places hold on this box)"
        actor: Member
        preconditions:
          - "box.status == SCHEDULED"
          - "current clock < this box's delivery date (Season.first_delivery_date + 7×(week_index-1))"
        side_effects:
          - "create VacationHold; if REFUND mode post LedgerEntry CREDIT_HOLD_REFUND for one week's pro-rata share value [cascade hop 1 of hold]"
          - "if SWAP mode set swap_target_box.item_count to 2×ShareType.items_per_box on delivery (double box) — no ledger change"
          - "recompute Subscription.outstanding_balance_cents [cascade hop 2 of hold]"
      - from: HELD
        to: SCHEDULED
        trigger: "POST /vacation-holds/{id}/release"
        actor: Member
        preconditions:
          - "VacationHold.status == ACTIVE"
          - "current clock < held box's delivery date"
        side_effects:
          - "VacationHold ACTIVE → RELEASED"
          - "if REFUND mode reverse the CREDIT_HOLD_REFUND (post offsetting CHARGE) [compensation]"
          - "recompute Subscription.outstanding_balance_cents"
      - from: SCHEDULED
        to: PACKED
        trigger: "POST /weekly-boxes/{id}/pack"
        actor: FarmManager
        preconditions:
          - "box.status == SCHEDULED"
          - "PickupSite(box.site_id).active_subscription_count <= weekly_capacity"
        side_effects:
          - "set item_count = ShareType.items_per_box (or 2× for a swap target)"
      - from: PACKED
        to: DELIVERED
        trigger: "POST /weekly-boxes/{id}/deliver"
        actor: FarmManager
        preconditions:
          - "box.status == PACKED"
        side_effects:
          - "if this is the subscription's first DELIVERED box: Subscription billing_status CONFIRMED→ACTIVE and fulfillment_status NOT_STARTED→IN_SEASON [cross-entity bubble-up]"
          - "if all WeeklyBox of subscription now terminal: fulfillment_status IN_SEASON→COMPLETED"
      - from: HELD
        to: SKIPPED
        trigger: "system: clock passes held box's delivery date"
        actor: system
        preconditions:
          - "box.status == HELD"
          - "VacationHold.status == ACTIVE"
        side_effects:
          - "VacationHold ACTIVE → CONSUMED"
          - "if all WeeklyBox of subscription now terminal: fulfillment_status → COMPLETED"

  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [CONVERTED, DECLINED, EXPIRED]
    note: "Branching fork — OFFERED diverges into CONVERTED / DECLINED / EXPIRED with distinct side-effect sets."
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "POST /seasons/{id}/promote-waitlist"
        actor: DeliveryCoordinator
        preconditions:
          - "Season.confirmed_share_count < Season.total_share_capacity (a slot exists)"
          - "requested_site_id PickupSite.active_subscription_count < weekly_capacity"
          - "this is the WAITING entry with earliest created_at for (season_id, requested_site_id, share_type_id)"
        side_effects:
          - "set offer_expires_at = current clock + 48h"
      - from: OFFERED
        to: CONVERTED
        trigger: "POST /waitlist-entries/{id}/accept"
        actor: Member
        preconditions:
          - "status == OFFERED"
          - "current clock <= offer_expires_at"
        side_effects:
          - "create a Subscription (PENDING_PAYMENT) for member with requested share/site [cross-entity create]"
          - "no capacity counter change until that Subscription is confirmed"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /waitlist-entries/{id}/decline"
        actor: Member
        preconditions:
          - "status == OFFERED"
        side_effects:
          - "entry terminal; slot remains open for next promotion"
      - from: OFFERED
        to: EXPIRED
        trigger: "system: clock passes offer_expires_at"
        actor: system
        preconditions:
          - "status == OFFERED"
          - "current clock > offer_expires_at"
        side_effects:
          - "entry terminal; slot remains open for next promotion"

  - entity: WorkShareShift
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /work-share-shifts/{id}/complete"
        actor: FarmManager
        preconditions:
          - "status == SCHEDULED"
          - "Subscription.working_share_opt_in == true"
        side_effects:
          - "compute credit_earned_cents via §1.3 workshare_credit"
          - "post LedgerEntry CREDIT_WORKSHARE on the subscription [cascade hop 1]"
          - "increment Member.wallet_credit_cents by credit_earned_cents [cascade hop 2]"
          - "recompute Subscription.outstanding_balance_cents applying available wallet credit [cascade hop 3]"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /work-share-shifts/{id}/mark-no-show"
        actor: FarmManager
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "credit_earned_cents stays 0; no ledger entry"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: confirm-stale-season
    parent_entity: Season
    write_endpoint: "POST /subscriptions/{id}/confirm"
    occ_field: "expected_season_version"
    description: |
      Confirming a Subscription against a Season whose version has advanced
      since the client last observed it is rejected. Each confirm increments
      Season.version (confirmed_share_count changes), so a client that confirmed
      the last slot under a stale season view — believing capacity remained —
      is rejected on the stale-version check rather than silently over-filling
      total_share_capacity.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: promote-stale-season
    parent_entity: Season
    write_endpoint: "POST /seasons/{id}/promote-waitlist"
    occ_field: "expected_season_version"
    description: |
      Promoting the next WaitlistEntry against a Season whose version has
      advanced since the client last observed it is rejected. A confirm or a
      prior promotion bumps Season.version; a coordinator acting on a stale
      season view (where a slot still appeared free) is rejected on the
      stale-version check rather than offering a slot that no longer exists.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: season_share_price
    trigger: "Subscription confirm (PENDING_PAYMENT→CONFIRMED)"
    algorithm: tiered_pricing
    formula: |
      multiplier = SLIDING_SCALE_MULTIPLIER[member.sliding_scale_tier]   # SOLIDARITY 0.80, BASELINE 1.00, SUSTAINER 1.25
      season_price_cents = round_half_up(share_type.base_price_cents * multiplier)
      # pinned at confirm; not recomputed when the member later edits their tier.
    input_set: "The subscription's ShareType.base_price_cents and the owning Member.sliding_scale_tier at confirm time."
    constants:
      SLIDING_SCALE_MULTIPLIER: { SOLIDARITY: 0.80, BASELINE: 1.00, SUSTAINER: 1.25 }
    precision: "integer cents, round_half_up at the single multiply step"
    variants:
      - name: pinned_at_confirm
        when: "confirm transition"
        difference: "Uses tier as-of confirm; value frozen on Subscription.season_price_cents."

  - name: outstanding_balance
    trigger: "Any LedgerEntry posted against the subscription (charge, credit, payment) and on confirm/cancel/hold/release side effects"
    algorithm: aggregation
    formula: |
      # Evaluation order is pinned: (1) sum charges, (2) sum non-payment credits,
      # (3) apply wallet credit available, (4) subtract payments. A circular look
      # is avoided because wallet credit applied is capped by the post-credit
      # gross, not by the final balance.
      gross_charges = sum(LedgerEntry.amount_cents WHERE entry_type IN {CHARGE_SEASON, CHARGE_ADDON, CHARGE_SURCHARGE})
      non_wallet_credits = -sum(LedgerEntry.amount_cents WHERE entry_type == CREDIT_HOLD_REFUND)   # stored negative
      net_after_refunds = gross_charges - non_wallet_credits
      wallet_applied = min(member.wallet_credit_cents, max(net_after_refunds, 0))
      payments = -sum(LedgerEntry.amount_cents WHERE entry_type == PAYMENT)                          # stored negative
      outstanding_balance_cents = max(net_after_refunds - wallet_applied - payments, 0)
    input_set: "All LedgerEntry rows for the subscription; Member.wallet_credit_cents."
    constants: {}
    precision: "integer cents; no rounding (all inputs already integer cents)"
    variants:
      - name: provisional_pre_confirm
        when: "billing_status == PENDING_PAYMENT (before confirm posts CHARGE_SEASON)"
        difference: "gross_charges excludes the season charge, so balance reflects only add-ons; diverges from finalized balance which includes CHARGE_SEASON."
      - name: finalized_post_confirm
        when: "billing_status IN {CONFIRMED, ACTIVE}"
        difference: "gross_charges includes CHARGE_SEASON; produces the higher, finalized balance for identical add-on state."

  - name: workshare_credit
    trigger: "WorkShareShift complete (SCHEDULED→COMPLETED)"
    algorithm: threshold
    formula: |
      raw = shift.hours * WORK_CREDIT_RATE_CENTS_PER_HOUR
      # Daily cap: a member earns credit for at most WORK_CREDIT_DAILY_HOUR_CAP hours
      # across all COMPLETED shifts sharing the same calendar date (UTC). Excess hours
      # on the same date earn zero. Shifts are counted in created_at ASC order.
      prior_same_date_hours = sum(h.hours for COMPLETED WorkShareShift h on same UTC date, created_at < this.created_at)
      creditable_hours = max(0, min(shift.hours, WORK_CREDIT_DAILY_HOUR_CAP - prior_same_date_hours))
      credit_earned_cents = round_half_up(creditable_hours * WORK_CREDIT_RATE_CENTS_PER_HOUR)
    input_set: "This shift plus all COMPLETED WorkShareShift rows for the same subscription on the same UTC date."
    constants:
      WORK_CREDIT_RATE_CENTS_PER_HOUR: 1500
      WORK_CREDIT_DAILY_HOUR_CAP: 6
    precision: "integer cents, round_half_up at the final multiply"
    variants:
      - name: under_cap
        when: "prior_same_date_hours + shift.hours <= 6"
        difference: "full hours credited."
      - name: straddles_cap
        when: "prior_same_date_hours < 6 < prior_same_date_hours + shift.hours"
        difference: "only the hours up to the 6h cap are credited; remainder earns 0."

  - name: hold_refund_value
    trigger: "VacationHold placed in REFUND mode (WeeklyBox SCHEDULED→HELD)"
    algorithm: waterfall_allocation
    formula: |
      # One week's pro-rata share value, allocated as remainder-last so the sum of
      # all per-week refunds exactly reconciles to season_price_cents.
      base_per_week = season_price_cents // week_count          # integer floor
      remainder = season_price_cents - base_per_week * week_count
      # The first `remainder` weeks (by week_index ASC) carry one extra cent.
      refund_cents = base_per_week + (1 if week_index <= remainder else 0)
    input_set: "Subscription.season_price_cents, Season.week_count, the held box's week_index."
    constants: {}
    precision: "integer cents; remainder distributed to lowest week_index first (deterministic, week_index ASC)"
    variants:
      - name: early_week_extra_cent
        when: "week_index <= remainder"
        difference: "refund carries the +1 remainder cent."
      - name: late_week_floor
        when: "week_index > remainder"
        difference: "refund is the floor value, no extra cent."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /members and POST /waitlist-entries"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For Member-owned resources, X-User-ID equals the resource's member_id (directly or via subscription_id → member_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Member-actor endpoints on Subscription, VacationHold, WaitlistEntry, WeeklyBox"

  - priority: 4
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: business_referential
    check: "Referenced ShareType / PickupSite / AddOn belong to the same Season as the Subscription/Waitlist"
    error_id: ERR_SEASON_MISMATCH
    http_status: 409
    applies_to: "POST /subscriptions, POST /subscription-add-ons, POST /waitlist-entries"

  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 7
    category: business_temporal
    check: "Confirm requires current clock <= Season.signup_close_date; promotions/holds/releases honor their own clock windows"
    error_id: ERR_SIGNUP_CLOSED
    http_status: 409
    applies_to: "POST /subscriptions/{id}/confirm"

  - priority: 8
    category: business_temporal
    check: "A VacationHold (place or release) requires current clock strictly before the held box's delivery date"
    error_id: ERR_HOLD_WINDOW_PASSED
    http_status: 409
    applies_to: "POST /vacation-holds, POST /vacation-holds/{id}/release"

  - priority: 9
    category: business_constraint
    check: "swap_target_box_id, when provided, must belong to the same subscription, have week_index > held box's week_index, and be SCHEDULED"
    error_id: ERR_INVALID_SWAP_TARGET
    http_status: 422
    applies_to: "POST /vacation-holds"

  - priority: 10
    category: business_temporal
    check: "An OFFERED WaitlistEntry can only be accepted while current clock <= offer_expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /waitlist-entries/{id}/accept"

  - priority: 11
    category: business_constraint
    check: "Add-on attach requires AddOn.committed_count < AddOn.weekly_supply_cap (strict <)"
    error_id: ERR_ADDON_SUPPLY_EXHAUSTED
    http_status: 409
    applies_to: "POST /subscription-add-ons"

  - priority: 12
    category: business_constraint
    check: "WorkShareShift create/complete requires Subscription.working_share_opt_in == true"
    error_id: ERR_NOT_WORKING_SHARE
    http_status: 409
    applies_to: "POST /subscriptions/{id}/work-share-shifts, POST /work-share-shifts/{id}/complete"

  - priority: 13
    category: business_constraint
    check: "Site weekly_capacity not exceeded: active_subscription_count < weekly_capacity (strict <) at confirm and at promotion"
    error_id: ERR_SITE_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /subscriptions/{id}/confirm, POST /seasons/{id}/promote-waitlist"

  - priority: 14
    category: business_fiscal
    check: "Season capacity not exceeded: confirmed_share_count < total_share_capacity (strict <) at confirm"
    error_id: ERR_SEASON_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /subscriptions/{id}/confirm"

  - priority: 15
    category: business_constraint
    check: "Request body required fields present and well-typed; enums in allowed set; numerics in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 16
    category: business_constraint
    check: "Member email is unique (case-insensitive)"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /members"

  - priority: 17
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /subscriptions/{id}/confirm, POST /seasons/{id}/promote-waitlist"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Season ----
  - method: POST
    path: "/seasons"
    description: "Create a season (DRAFT)."
    roles: [FarmManager]
    code: 201
    input: [name, week_count, first_delivery_date, signup_close_date, total_share_capacity]
    output: Season
    side_effects: ["Season created in DRAFT"]
  - method: GET
    path: "/seasons/{id}"
    description: "Fetch a season."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: GET
    path: "/seasons"
    description: "List seasons (paginated)."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Season[]
    side_effects: []
  - method: POST
    path: "/seasons/{id}/open"
    description: "Open a season for signups."
    roles: [FarmManager]
    code: 200
    input: []
    output: Season
    side_effects: ["status DRAFT→OPEN"]
  - method: POST
    path: "/seasons/{id}/close"
    description: "Close a season."
    roles: [FarmManager]
    code: 200
    input: []
    output: Season
    side_effects: ["status OPEN→CLOSED"]
  - method: POST
    path: "/seasons/{id}/promote-waitlist"
    description: "Promote the earliest eligible WaitlistEntry to OFFERED."
    roles: [DeliveryCoordinator]
    code: 200
    input: [share_type_id, requested_site_id, expected_season_version]
    output: WaitlistEntry
    side_effects: ["selected WAITING entry → OFFERED; offer_expires_at set", "increments Season.version by 1"]

  # ---- PickupSite ----
  - method: POST
    path: "/pickup-sites"
    description: "Create a pickup site / delivery zone for a season."
    roles: [DeliveryCoordinator]
    code: 201
    input: ["season_id", "name", "kind", "weekly_capacity", "delivery_surcharge_cents?"]
    output: PickupSite
    side_effects: ["PickupSite created"]
  - method: GET
    path: "/pickup-sites/{id}"
    description: "Fetch a pickup site."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: PickupSite
    side_effects: []
  - method: GET
    path: "/pickup-sites"
    description: "List pickup sites; filter by season."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: ["season_id?", "limit?", "offset?"]
    output: PickupSite[]
    side_effects: []

  # ---- ShareType ----
  - method: POST
    path: "/share-types"
    description: "Create a share type for a season."
    roles: [FarmManager]
    code: 201
    input: [season_id, size, base_price_cents, items_per_box]
    output: ShareType
    side_effects: ["ShareType created"]
  - method: GET
    path: "/share-types/{id}"
    description: "Fetch a share type."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: ShareType
    side_effects: []
  - method: GET
    path: "/share-types"
    description: "List share types; filter by season."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: ["season_id?", "limit?", "offset?"]
    output: ShareType[]
    side_effects: []

  # ---- AddOn ----
  - method: POST
    path: "/add-ons"
    description: "Create an add-on for a season."
    roles: [FarmManager]
    code: 201
    input: [season_id, kind, weekly_price_cents, weekly_supply_cap]
    output: AddOn
    side_effects: ["AddOn created"]
  - method: GET
    path: "/add-ons/{id}"
    description: "Fetch an add-on."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: AddOn
    side_effects: []
  - method: GET
    path: "/add-ons"
    description: "List add-ons; filter by season."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: ["season_id?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []

  # ---- Member ----
  - method: POST
    path: "/members"
    description: "Register a member (no auth)."
    roles: [Anonymous]
    code: 201
    input: ["email", "full_name", "sliding_scale_tier?"]
    output: Member
    side_effects: ["Member created with wallet_credit_cents 0"]
  - method: GET
    path: "/members/{id}"
    description: "Fetch a member."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  # ---- Subscription ----
  - method: POST
    path: "/subscriptions"
    description: "Create a draft subscription (PENDING_PAYMENT) for an OPEN season."
    roles: [Member]
    code: 201
    input: ["season_id", "member_id", "share_type_id", "current_site_id", "working_share_opt_in?"]
    output: Subscription
    side_effects: ["Subscription created PENDING_PAYMENT / NOT_STARTED"]
  - method: GET
    path: "/subscriptions/{id}"
    description: "Fetch a subscription with computed balances."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "List subscriptions; filter by season, member, share type, or site."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: ["season_id?", "member_id?", "share_type_id?", "current_site_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/confirm"
    description: "Confirm a subscription: charge season, generate weekly boxes."
    roles: [FarmManager]
    code: 200
    input: [expected_season_version]
    output: Subscription
    side_effects:
      - "billing_status PENDING_PAYMENT→CONFIRMED"
      - "post CHARGE_SEASON (+ CHARGE_SURCHARGE for HOME_DELIVERY), generate WeeklyBox rows"
      - "increment Season.confirmed_share_count and PickupSite.active_subscription_count"
      - "increments Season.version by 1"
      - "increments Subscription.version by 1"
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel a subscription and cascade box/hold/add-on teardown."
    roles: [Member]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "billing_status →CANCELLED"
      - "cascade: non-terminal boxes →SKIPPED, holds →RELEASED, add-ons →DETACHED"
      - "post CREDIT_HOLD_REFUND; recompute outstanding_balance_cents"
      - "decrement Season.confirmed_share_count and PickupSite.active_subscription_count"
      - "increments Subscription.version by 1"

  # ---- SubscriptionAddOn (junction) ----
  - method: POST
    path: "/subscription-add-ons"
    description: "Attach an add-on to a subscription."
    roles: [Member]
    code: 201
    input: [subscription_id, add_on_id]
    output: SubscriptionAddOn
    side_effects:
      - "SubscriptionAddOn created ATTACHED; increment AddOn.committed_count"
      - "post CHARGE_ADDON = AddOn.weekly_price_cents × remaining_weeks, where remaining_weeks = count of this subscription's WeeklyBox with status NOT IN {DELIVERED, SKIPPED}; if no WeeklyBox exist yet (subscription still PENDING_PAYMENT, not confirmed) remaining_weeks = Season.week_count"
      - "recompute outstanding_balance_cents"
  - method: DELETE
    path: "/subscription-add-ons/{id}"
    description: "Detach an add-on."
    roles: [Member]
    code: 200
    input: []
    output: SubscriptionAddOn
    side_effects:
      - "status ATTACHED→DETACHED; decrement AddOn.committed_count"
      - "post offsetting CREDIT for undelivered weeks; recompute outstanding_balance_cents"
  - method: GET
    path: "/subscriptions/{id}/add-ons"
    description: "List a subscription's add-on attachments."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: SubscriptionAddOn[]
    side_effects: []
  - method: GET
    path: "/subscription-add-ons/{id}"
    description: "Fetch an add-on attachment."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: SubscriptionAddOn
    side_effects: []
  - method: GET
    path: "/subscription-add-ons"
    description: "List add-on attachments; filter by add_on_id."
    roles: [FarmManager, DeliveryCoordinator, PlatformAdmin]
    code: 200
    input: ["add_on_id?", "subscription_id?", "limit?", "offset?"]
    output: SubscriptionAddOn[]
    side_effects: []

  # ---- WeeklyBox ----
  - method: GET
    path: "/subscriptions/{id}/weekly-boxes"
    description: "List a subscription's weekly boxes."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: WeeklyBox[]
    side_effects: []
  - method: GET
    path: "/weekly-boxes/{id}"
    description: "Fetch a weekly box."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: WeeklyBox
    side_effects: []
  - method: GET
    path: "/weekly-boxes"
    description: "List weekly boxes; filter by site or subscription."
    roles: [FarmManager, DeliveryCoordinator, PlatformAdmin]
    code: 200
    input: ["site_id?", "subscription_id?", "status?", "limit?", "offset?"]
    output: WeeklyBox[]
    side_effects: []
  - method: POST
    path: "/weekly-boxes/{id}/pack"
    description: "Pack a scheduled box for the week."
    roles: [FarmManager]
    code: 200
    input: []
    output: WeeklyBox
    side_effects: ["status SCHEDULED→PACKED; set item_count"]
  - method: POST
    path: "/weekly-boxes/{id}/deliver"
    description: "Mark a packed box delivered."
    roles: [FarmManager]
    code: 200
    input: []
    output: WeeklyBox
    side_effects:
      - "status PACKED→DELIVERED"
      - "first delivery flips Subscription billing CONFIRMED→ACTIVE and fulfillment NOT_STARTED→IN_SEASON"
      - "all-terminal flips fulfillment →COMPLETED"

  # ---- VacationHold ----
  - method: POST
    path: "/vacation-holds"
    description: "Place a vacation hold (refund or swap) on a scheduled box."
    roles: [Member]
    code: 201
    input: ["subscription_id", "held_box_id", "swap_target_box_id?"]
    output: VacationHold
    side_effects:
      - "held box SCHEDULED→HELD; mode REFUND or SWAP derived"
      - "REFUND posts CREDIT_HOLD_REFUND; recompute outstanding_balance_cents"
  - method: GET
    path: "/vacation-holds/{id}"
    description: "Fetch a vacation hold."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: VacationHold
    side_effects: []
  - method: GET
    path: "/vacation-holds"
    description: "List vacation holds; filter by held box or swap target."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: ["held_box_id?", "swap_target_box_id?", "subscription_id?", "status?", "limit?", "offset?"]
    output: VacationHold[]
    side_effects: []
  - method: GET
    path: "/subscriptions/{id}/vacation-holds"
    description: "List a subscription's vacation holds."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: VacationHold[]
    side_effects: []
  - method: POST
    path: "/vacation-holds/{id}/release"
    description: "Release an active hold before its delivery date."
    roles: [Member]
    code: 200
    input: []
    output: VacationHold
    side_effects:
      - "status ACTIVE→RELEASED; held box HELD→SCHEDULED"
      - "REFUND mode reverses CREDIT_HOLD_REFUND; recompute outstanding_balance_cents"

  # ---- WaitlistEntry ----
  - method: POST
    path: "/waitlist-entries"
    description: "Join a season's waitlist (no auth — open signup)."
    roles: [Anonymous]
    code: 201
    input: [season_id, member_id, share_type_id, requested_site_id]
