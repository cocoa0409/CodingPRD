  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_upgrade_request_stale_pool
        claim_type: occ_conflict
        grounds:
          - concurrency_rules[upgrade-request-stale-pool]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / flightpool_aggregate_capacity_overlap
          rationale: "The pool-version OCC field is exercised when the second joiner observes the version bumped by the first join; the aggregate-capacity instance already drives two sequential joins against the same pool with version capture. A dedicated stale-version negative is enumerated below."
      - name: occ_upgrade_request_stale_pool_negative
        claim_type: occ_conflict
        grounds:
          - concurrency_rules[upgrade-request-stale-pool]
          - errors[ERR_STALE_POOL_VERSION]
        distinguishing_aspect: "A second upgrade-request create carrying the pre-first-join pool version is rejected with ERR_STALE_POOL_VERSION (412)."
        test_recipe:
          setup:
            - "Pool created (version captured); first join advances pool version; second join still carries the stale version."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-04-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "oc1@air.test", full_name: "Oc One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /members"
              payload: { email: "oc2@air.test", full_name: "Oc Two", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m2: "$.data.id" }
            - call: "POST /flight-pools"
              payload: { flight_number: "UA14", departure_at: "2026-04-10T08:00:00.000Z", premium_capacity: 5 }
              as: OperationsAgent
              captures: { pool: "$.data.id", pv0: "$.data.version" }
            - call: "POST /upgrade-requests"
              payload: { member_id: "${m1}", flight_pool_id: "${pool}", booked_fare_class: "ECONOMY", expected_flightpool_version: "${pv0}" }
              as: Member
              as_user_id: "${m1}"
          trigger:
            - call: "POST /upgrade-requests"
              payload: { member_id: "${m2}", flight_pool_id: "${pool}", booked_fare_class: "ECONOMY", expected_flightpool_version: "${pv0}" }
              as: Member
              as_user_id: "${m2}"
              captures: { eid: "$.data.error_id" }
          assert:
            - "HTTP 412"
            - "${eid} == 'ERR_STALE_POOL_VERSION'  # ${pv0} stale after first join bumped pool.version"
      - name: occ_gift_settle_stale_member_negative
        claim_type: occ_conflict
        grounds:
          - concurrency_rules[gift-settle-stale-sender]
          - errors[ERR_STALE_MEMBER_VERSION]
        distinguishing_aspect: "Settling a gift with a sender member version that predates an intervening debit is rejected with ERR_STALE_MEMBER_VERSION (412)."
        test_recipe:
          setup:
            - "Sender m1 (10000 pts), two pending gifts; sender version captured before first settle; second settle carries the stale version."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "og1@air.test", full_name: "Og One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /members"
              payload: { email: "og2@air.test", full_name: "Og Two", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m2: "$.data.id" }
            - call: "POST /_inject/points"
              payload: { member_id: "${m1}", amount: 10000 }
              as: ProgramAdmin
            - call: "POST /points-gifts"
              payload: { sender_id: "${m1}", recipient_id: "${m2}", amount: 1000 }
              as: Member
              as_user_id: "${m1}"
              captures: { giftA: "$.data.id" }
            - call: "POST /points-gifts"
              payload: { sender_id: "${m1}", recipient_id: "${m2}", amount: 1000 }
              as: Member
              as_user_id: "${m1}"
              captures: { giftB: "$.data.id" }
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { mv_stale: "$.data.version" }
            - call: "POST /points-gifts/${giftA}/settle"
              payload: { expected_member_version: "${mv_stale}" }
              as: Member
              as_user_id: "${m1}"
          trigger:
            - call: "POST /points-gifts/${giftB}/settle"
              payload: { expected_member_version: "${mv_stale}" }
              as: Member
              as_user_id: "${m1}"
              captures: { eid: "$.data.error_id" }
          assert:
            - "HTTP 412"
            - "${eid} == 'ERR_STALE_MEMBER_VERSION'  # ${mv_stale} stale after giftA settle bumped sender version"
      - name: award_cancel_quoted_no_refund
        claim_type: compensating_cascade
        grounds:
          - state_machines.AwardBooking.QUOTED_to_CANCELLED
          - entities.Member.fields.points_balance
        distinguishing_aspect: "Cancelling a QUOTED (never-issued) award writes no refund ledger row; points_balance unchanged from before."
