        distinguishing_aspect: |
          RateSchedule occupancy uses the OPPOSITE interval geometry to RightsRegistration: the
          window is CLOSED so schedules that merely touch on 2026-06-30 DO collide, and WORLD is a
          separate specificity layer that does NOT collide with GB — so a WORLD schedule spanning
          the entire year coexists with two GB schedules, and selection resolves a GB pool to the
          GB layer and an IE pool to the WORLD layer in the same calculate pass.
