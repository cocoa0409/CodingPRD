    message: "Vacation exception {id} is already {status}."
    raised_by: "POST /pharmacy/vacation-exceptions/{id}/decide twice"
  - error_id: ERR_INVALID_PRESCRIPTION_STATE
    http_status: 409
    message: "Prescription {id} is {status}; this operation is not available."
    raised_by: "regimen-change on a non-ACTIVE prescription; authorization creation on a SUPERSEDED, DISCONTINUED or EXPIRED prescription"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    message: "User {user_id} packed pouch roll {roll_id} and may not image or verify it."
