              payload: { expected_program_version: "${prog_v_fresh}" }
              as: ProgramManager
              captures: { treaty_st: $.data.status }
          assert:
            - "bind with stale version -> (${occ_err}) == ERR_STALE_VERSION (412)"
            - "retry with freshly-read version succeeds: treaty status (${treaty_st}) == ACTIVE"

