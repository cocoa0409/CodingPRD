scaffold_corner_design:
  # ===========================================================================
  # Section: entities — Creation, Retrieval, Listing, Not Found, Required Fields,
  # Defaults, Computed Fields, System Fields, Type Constraints, Parent Relationships
  # ===========================================================================
  - section: entities
    instances:
      - name: product_creation_required_fields
        claim_type: creation
        grounds: [entities.Product]
        distinguishing_aspect: "POST /oss-products with all required fields returns 201 with all fields populated"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /oss-products"
              payload:
                product_code: "TEST-001"
                product_name: "Test Product"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_id: "$.data.id"
          assert:
            - "response contains id, created_at, updated_at, version"
            - "product_code == TEST-001"
            - "compliance_posture == COMPLIANT"
            - "posture_version == 1"

      - name: product_missing_required_field_returns_error
        claim_type: required_fields
        grounds: [entities.Product.fields.product_code]
        distinguishing_aspect: "POST /oss-products missing product_code returns ERR_INVALID_REQUEST"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /oss-products"
              payload:
                product_name: "No Code"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                error_id: "$.data.error_id"
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: product_retrieval_not_found
        claim_type: not_found
        grounds: [entities.Product, errors.ERR_PRODUCT_NOT_FOUND]
        distinguishing_aspect: "GET /oss-products/{nonexistent-uuid} returns 404 ERR_PRODUCT_NOT_FOUND"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /oss-products/00000000-0000-0000-0000-000000000000"
              as: ComplianceAnalyst
              captures:
                error_id: "$.data.error_id"
          assert:
            - "error_id == ERR_PRODUCT_NOT_FOUND"
            - "http_status == 404"

      - name: component_computed_fields_ignore_input
        claim_type: computed_fields
        grounds: [entities.Component.fields.effective_classification]
        distinguishing_aspect: "POST /oss-components ignores client-provided effective_classification (computed field)"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/test@1.0.0"
                component_name: "test"
                version: "1.0.0"
                declared_license_spdx: "MIT"
              as: ComplianceAnalyst
              captures:
                comp_id: "$.data.id"
          assert:
            - "Component.effective_classification is null (not yet computed)"
            - "Component.license_policy_classification is null (not yet computed)"
            - "Computed fields populated only after scan completes"

      - name: bom_entry_self_referential_parent
        claim_type: parent_relationships
        grounds: [entities.BomEntry.fields.parent_entry_id]
        distinguishing_aspect: "BomEntry.parent_entry_id references parent BomEntry for transitive dependencies"
        test_recipe:
          setup:
            - "Product with BOM containing direct and transitive dependencies"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "TRANS-TEST"
                product_name: "Transitive Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_trans_id: "$.data.id"
                prod_trans_v: "$.data.version"
            - call: "POST /oss-products/${prod_trans_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "TRANSITIVE"
                expected_product_version: "${prod_trans_v}"
              as: ComplianceAnalyst
              captures:
                scan_trans_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_trans_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_trans_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_trans_id: "$.data[0].id"
          trigger:
            - call: "GET /oss-products/${prod_trans_id}/boms/${bom_trans_id}/entries"
              as: ComplianceAnalyst
          assert:
            - "Direct entries have parent_entry_id == null"
            - "Transitive entries have parent_entry_id referencing another BomEntry.id"
            - "dependency_depth > 0 for transitive entries"

  # ===========================================================================
  # Section: state_machines — Valid Transition, Precondition Enforcement,
  # Side Effect Execution, Invalid Transitions, Initial State, Terminal State Lockdown
  # ===========================================================================
  - section: state_machines
    instances:
      - name: scan_initial_state_queued
        claim_type: initial_state
        grounds: [state_machines.DependencyScan]
        distinguishing_aspect: "Newly created DependencyScan starts in QUEUED state"
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "INIT-TEST"
                product_name: "Init Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_init_id: "$.data.id"
                prod_init_v: "$.data.version"
          trigger:
            - call: "POST /oss-products/${prod_init_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_init_v}"
              as: ComplianceAnalyst
              captures:
                scan_init: "$.data"
          assert:
            - "scan_init.status == QUEUED"

      - name: scan_invalid_transition_terminal
        claim_type: invalid_transition
        grounds: [state_machines.DependencyScan, errors.ERR_SCAN_NOT_CANCELLABLE]
        distinguishing_aspect: "Cannot cancel scan in COMPLETED state (terminal)"
        test_recipe:
          setup:
            - "Scan completed successfully"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "TERM-TEST"
                product_name: "Terminal Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_term_id: "$.data.id"
                prod_term_v: "$.data.version"
            - call: "POST /oss-products/${prod_term_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_term_v}"
              as: ComplianceAnalyst
              captures:
                scan_term_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_term_id}"
              as: PlatformAdmin
          trigger:
            - call: "POST /oss-products/${prod_term_id}/dependency-scans/${scan_term_id}/cancel"
              as: ComplianceAnalyst
              captures:
                error_id: "$.data.error_id"
          assert:
            - "error_id == ERR_SCAN_NOT_CANCELLABLE"

      - name: license_approval_precondition_wrong_state
        claim_type: precondition_enforcement
        grounds: [state_machines.LicenseApprovalRequest, errors.ERR_REQUEST_NOT_PENDING]
        distinguishing_aspect: "Cannot assign-legal when request already in LEGAL_REVIEW"
        test_recipe:
          setup:
            - "LicenseApprovalRequest already in LEGAL_REVIEW"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "PRECOND"
                product_name: "Precondition Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_precond_id: "$.data.id"
                prod_precond_v: "$.data.version"
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/restricted@1.0.0"
                component_name: "restricted"
                version: "1.0.0"
                declared_license_spdx: "CC-BY-NC-4.0"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_precond_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_precond_v}"
              as: ComplianceAnalyst
              captures:
                scan_precond_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_precond_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_precond_id}/license-approvals"
              as: ComplianceAnalyst
              captures:
                approval_precond_id: "$.data[0].id"
            - call: "POST /oss-products/${prod_precond_id}/license-approvals/${approval_precond_id}/assign-legal"
              as: LegalCounsel
          trigger:
            - call: "POST /oss-products/${prod_precond_id}/license-approvals/${approval_precond_id}/assign-legal"
              as: LegalCounsel
              captures:
                error_id: "$.data.error_id"
          assert:
            - "error_id == ERR_REQUEST_NOT_PENDING"

      - name: release_gate_side_effect_execution
        claim_type: side_effect_execution
        grounds: [state_machines.ReleaseGate.OPEN_to_EVALUATING]
        distinguishing_aspect: "Evaluating ReleaseGate computes blocking_findings_count, warning_findings_count, obligations_fulfilled_pct"
        test_recipe:
          setup:
            - "Product with FINALIZED BOM, notice generated, all obligations fulfilled"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "SIDE-EFF"
                product_name: "Side Effect"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_se_id: "$.data.id"
                prod_se_v: "$.data.version"
            - call: "POST /oss-products/${prod_se_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_se_v}"
              as: ComplianceAnalyst
              captures:
                scan_se_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_se_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_se_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_se_id: "$.data[0].id"
                bom_se_v: "$.data[0].version"
            - call: "POST /oss-products/${prod_se_id}/boms/${bom_se_id}/generate-notice"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_se_id}/release-gates"
              payload:
                bom_id: "${bom_se_id}"
                release_version: "1.0.0"
              as: ReleaseManager
              captures:
                gate_se_id: "$.data.id"
          trigger:
            - call: "POST /oss-products/${prod_se_id}/release-gates/${gate_se_id}/evaluate"
              payload:
                expected_bom_version: "${bom_se_v}"
              as: ReleaseManager
          assert:
            - "ReleaseGate.blocking_findings_count is computed (not null)"
            - "ReleaseGate.warning_findings_count is computed (not null)"
            - "ReleaseGate.obligations_fulfilled_pct is computed (not null)"

      - name: product_terminal_state_lockdown_blocked
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Product, entities.Product.fields.compliance_posture]
        distinguishing_aspect: "BLOCKED Product cannot create new scans without unblock"
        test_recipe:
          setup:
            - "Product in BLOCKED posture (PROHIBITED component in BOM)"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "BLOCKED"
                product_name: "Blocked Product"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_blocked_id: "$.data.id"
                prod_blocked_v: "$.data.version"
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/wtfpl@1.0.0"
                component_name: "wtfpl"
                version: "1.0.0"
                declared_license_spdx: "WTFPL"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_blocked_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_blocked_v}"
              as: ComplianceAnalyst
              captures:
                scan_blocked_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_blocked_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_blocked_id}"
              as: ComplianceAnalyst
              captures:
                prod_blocked_v2: "$.data.version"
          trigger:
            - call: "POST /oss-products/${prod_blocked_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_blocked_v2}"
              as: ComplianceAnalyst
              captures:
                error_id: "$.data.error_id"
          assert:
            - "error_id == ERR_PRODUCT_BLOCKED"

  # ===========================================================================
  # Section: calculations — Correct Result, Input Set Filtering, Constants Applied,
  # Precision, Variant Divergence, Variant Selection, Reconciliation
  # ===========================================================================
  - section: calculations
    instances:
      - name: license_classification_unknown_defaults_restricted
        claim_type: correct_result
        grounds: [calculations.license_policy_classification]
        distinguishing_aspect: "Unknown SPDX license defaults to RESTRICTED (conservative)"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /oss-components"
              payload:
                package_url: "pkg:npm/unknown@1.0.0"
                component_name: "unknown"
                version: "1.0.0"
                declared_license_spdx: "UNKNOWN-LICENSE-XYZ"
              as: ComplianceAnalyst
              captures:
                comp_unknown: "$.data"
          assert:
            - "comp_unknown.license_policy_classification == RESTRICTED"

      - name: license_scan_coverage_precision
        claim_type: precision
        grounds: [calculations.license_scan_coverage]
        distinguishing_aspect: "Coverage percentage rounded to 2 decimal places, round_half_up"
        test_recipe:
          setup:
            - "Scan with 3 components, 2 with discovered licenses"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "PRECISION"
                product_name: "Precision Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_prec_id: "$.data.id"
                prod_prec_v: "$.data.version"
            - call: "POST /oss-products/${prod_prec_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_prec_v}"
              as: ComplianceAnalyst
              captures:
                scan_prec_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_prec_id}"
              as: PlatformAdmin
          trigger:
            - call: "GET /oss-products/${prod_prec_id}/dependency-scans/${scan_prec_id}"
              as: ComplianceAnalyst
              captures:
                scan_result: "$.data"
          assert:
            - "scan_result.license_scan_coverage_pct has exactly 2 decimal places"
            - "2/3 = 66.67 (round_half_up)"

      - name: remediation_sla_constants_applied
        claim_type: constants_applied
        grounds: [calculations.remediation_sla_deadline]
        distinguishing_aspect: "CRITICAL severity uses CRITICAL_SLA_DAYS=7, HIGH uses 30, etc."
        test_recipe:
          setup:
            - "CRITICAL vulnerability detected at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-08-01T00:00:00Z"
              as: PlatformAdmin
            - call: "POST /oss-products"
              payload:
                product_code: "SLA-CONST"
                product_name: "SLA Constants"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_sla_id: "$.data.id"
                prod_sla_v: "$.data.version"
            - call: "POST /oss-products/${prod_sla_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_sla_v}"
              as: ComplianceAnalyst
              captures:
                scan_sla_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_sla_id}"
              as: PlatformAdmin
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-SLA"
                severity: "CRITICAL"
                cvss_score: 9.8
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/test@1.0.0"
              as: SecurityAnalyst
            - call: "GET /oss-products/${prod_sla_id}/vulnerability-findings"
              as: SecurityAnalyst
              captures:
                finding_sla_id: "$.data[0].id"
          trigger:
            - call: "POST /oss-products/${prod_sla_id}/vulnerability-findings/${finding_sla_id}/confirm"
              as: SecurityAnalyst
          assert:
            - "VulnerabilityFinding.remediation_deadline == 2026-08-08T00:00:00Z (7 days from detection)"

      - name: license_change_variant_accelerates_sla
        claim_type: variant_divergence
        grounds: [calculations.remediation_sla_deadline.variants]
        distinguishing_aspect: "license_change_flag=true compresses SLA to 14 days regardless of severity"
        test_recipe:
          setup:
            - "MEDIUM vulnerability with license_change_flag=true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-08-01T00:00:00Z"
              as: PlatformAdmin
            - call: "POST /oss-products"
              payload:
                product_code: "VARIANT"
                product_name: "Variant Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_var_id: "$.data.id"
                prod_var_v: "$.data.version"
            - call: "POST /oss-products/${prod_var_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_var_v}"
              as: ComplianceAnalyst
              captures:
                scan_var_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_var_id}"
              as: PlatformAdmin
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-VAR"
                severity: "MEDIUM"
                cvss_score: 5.0
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/test@1.0.0"
                license_change_flag: true
                new_license_spdx: "GPL-3.0"
              as: SecurityAnalyst
            - call: "GET /oss-products/${prod_var_id}/vulnerability-findings"
              as: SecurityAnalyst
              captures:
                finding_var_id: "$.data[0].id"
          trigger:
            - call: "POST /oss-products/${prod_var_id}/vulnerability-findings/${finding_var_id}/confirm"
              as: SecurityAnalyst
          assert:
            - "VulnerabilityFinding.remediation_deadline == 2026-08-15T00:00:00Z (14 days, not 90)"

  # ===========================================================================
  # Section: validations — Violation → Error, Satisfaction → Pass, Priority Ordering
  # ===========================================================================
  - section: validations
    instances:
      - name: auth_missing_header_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "Missing X-User-ID header returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /oss-products"
              as: ComplianceAnalyst
              captures:
                error_id: "$.data.error_id"
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "http_status == 400"

      - name: auth_insufficient_permissions_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", errors.ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "ComplianceAnalyst cannot approve remediation (EngineeringManager only)"
        test_recipe:
          setup:
            - "Product with PROPOSED RemediationPlan"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "RBAC-TEST"
                product_name: "RBAC Test"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_rbac_id: "$.data.id"
                prod_rbac_v: "$.data.version"
            - call: "POST /oss-products/${prod_rbac_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_rbac_v}"
              as: ComplianceAnalyst
              captures:
                scan_rbac_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_rbac_id}"
              as: PlatformAdmin
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-RBAC"
                severity: "HIGH"
                cvss_score: 7.0
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/test@1.0.0"
              as: SecurityAnalyst
            - call: "GET /oss-products/${prod_rbac_id}/vulnerability-findings"
              as: SecurityAnalyst
              captures:
                finding_rbac_id: "$.data[0].id"
            - call: "POST /oss-products/${prod_rbac_id}/vulnerability-findings/${finding_rbac_id}/confirm"
              as: SecurityAnalyst
            - call: "POST /oss-products/${prod_rbac_id}/remediation-plans"
              payload:
                finding_id: "${finding_rbac_id}"
                plan_type: "PATCH"
                migration_effort_days: 5
              as: EngineeringManager
              captures:
                plan_rbac_id: "$.data.id"
          trigger:
            - call: "POST /oss-products/${prod_rbac_id}/remediation-plans/${plan_rbac_id}/approve"
              as: ComplianceAnalyst
              captures:
                error_id: "$.data.error_id"
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "http_status == 403"

      - name: validation_priority_state_before_business
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]"]
        distinguishing_aspect: "Product BLOCKED check (priority 4) fires before PROHIBITED component check (priority 6)"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_safety_conflict
          rationale: "Already covered as §1.8 difficulty instance"

  # ===========================================================================
  # Section: endpoints — Standard CRUD, Action endpoint, Bulk action,
  # Cross-reference link, Computed read, Conditional action
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_products_pagination
        claim_type: standard_crud
        grounds: ["endpoints[GET /oss-products]", response_envelope.pagination_fields]
        distinguishing_aspect: "GET /oss-products supports limit/offset pagination with total_count and has_more"
        test_recipe:
          setup:
            - "5 products exist"
          setup_api_calls:
            - call: "POST /oss-products"
              payload:
                product_code: "P1"
                product_name: "Product 1"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
            - call: "POST /oss-products"
              payload:
                product_code: "P2"
                product_name: "Product 2"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
            - call: "POST /oss-products"
              payload:
                product_code: "P3"
                product_name: "Product 3"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
            - call: "POST /oss-products"
              payload:
                product_code: "P4"
                product_name: "Product 4"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
            - call: "POST /oss-products"
              payload:
                product_code: "P5"
                product_name: "Product 5"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
          trigger:
            - call: "GET /oss-products?limit=2&offset=0"
              as: ComplianceAnalyst
              captures:
                page1: "$.data"
