              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /dental/plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /dental/providers"
              payload: { npi: "1234567897", legal_name: "Smile Dental 8", tier: "PPO", license_state: "CA", contracted_on: "2025-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_id: $.data.id }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D2391", allowed_cents: 10000, category: "BASIC", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-TC2", full_name: "Hank Prime", date_of_birth: "1970-07-07T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2391", tooth_number: "19", submitted_amount_cents: 10000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /dental/claims/${claim_id}/pay"
              payload: {}
              as: ClaimsExaminer
              captures: { claim_v: $.data.version }
            - call: "GET /dental/subscribers/${sub_id}/accumulators"
              payload: {}
              as: ClaimsExaminer
              captures: { acc_v_pre: "$.data[0].version", acc_ded_pre: "$.data[0].deductible_met_cents", acc_max_pre: "$.data[0].annual_max_used_cents" }
          trigger:
            - call: "POST /dental/claims/${claim_id}/void"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsExaminer
            - call: "GET /dental/subscribers/${sub_id}/accumulators"
              payload: {}
              as: ClaimsExaminer
              captures: { acc_v_post: "$.data[0].version", acc_ded_post: "$.data[0].deductible_met_cents", acc_max_post: "$.data[0].annual_max_used_cents" }
          assert:
            - "pre-void accumulator: deductible_met_cents == 5000 and annual_max_used_cents == 4000"
            - "link 1: post-void accumulator deductible_met_cents == 0 and annual_max_used_cents == 0"
            - "link 2: BenefitAccumulator.version == ${acc_v_pre} + 1 (incremented by the cascade, not by a direct accumulator write)"
            - "Claim.status == VOID"

