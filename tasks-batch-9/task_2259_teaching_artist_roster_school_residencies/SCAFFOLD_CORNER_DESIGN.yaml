          difficulty_instance: boundary_precision_check / clearance_expiry_date_itself_is_schedulable_but_next_day_is_not
          rationale: "That instance triggers the code on the day after expiry and shows the expiry date itself passing, which subsumes a bare trigger."

      - name: incomplete_standards_coverage_blocks_activation
        claim_type: every_code_triggerable
        grounds:
          - errors[ERR_STANDARDS_COVERAGE_INCOMPLETE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / residency_activation_gated_by_aligned_lesson_plan_strand_union
          rationale: "The code is raised there with a partially covering ALIGNED plan and then cleared by a second plan."

