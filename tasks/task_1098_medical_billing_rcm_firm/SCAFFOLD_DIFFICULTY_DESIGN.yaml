  - rule_id: non_linear_state_machine
    instances:
      - name: claim_cyclic_denied_appealed_denied
        grounds:
          - state_machines.Claim.DENIED_to_APPEALED
          - state_machines.Claim.APPEALED_to_DENIED
          - entities.Claim.fields.appeal_round
        distinguishing_aspect: "Cyclic shape on Claim: an appeal UPHOLD returns the claim from APPEALED back to the non-terminal DENIED it came from (a loop, not a linear terminal), and appeal_round advances to 1."
        test_recipe:
          setup:
            - "Claim accepted, then denied (denial_date 2026-05-20, within appeal window), appeal drafted and submitted so claim is APPEALED; clock 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AccountManager
            - call: "POST /rcm/practices"
              payload: { name: "Delta Clinic", npi: "1111111114", tax_id: "22-3333336", billing_fee_pct: 0.06 }
              as: AccountManager
              captures: { prac_id: $.data.id, prac_v: $.data.version }
            - call: "POST /rcm/payers"
              payload: { name: "BlueCo", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 60 }
              as: AccountManager
              captures: { payer_id: $.data.id }
            - call: "POST /rcm/providers"
              payload: { practice_id: "${prac_id}", npi: "2222222225", first_name: "Ann", last_name: "Lee", specialty: "IM" }
              as: CredentialingSpecialist
              captures: { prov_id: $.data.id }
            - call: "POST /rcm/providers/${prov_id}/credentialing/submit"
              payload: {}
              as: CredentialingSpecialist
            - call: "POST /rcm/providers/${prov_id}/credentialing/decision"
              payload: { decision: "APPROVE", expiration_date: "2027-01-01T00:00:00Z" }
              as: CredentialingSpecialist
            - call: "POST /rcm/payer-enrollments"
              payload: { provider_id: "${prov_id}", payer_id: "${payer_id}", effective_date: "2026-01-01T00:00:00Z" }
              as: CredentialingSpecialist
              captures: { enr_id: $.data.id }
            - call: "POST /rcm/payer-enrollments/${enr_id}/activate"
              payload: {}
              as: CredentialingSpecialist
            - call: "POST /rcm/fee-schedules"
              payload: { practice_id: "${prac_id}", effective_date: "2026-01-01T00:00:00Z" }
              as: AccountManager
              captures: { fs_id: $.data.id }
            - call: "POST /rcm/fee-schedules/${fs_id}/lines"
              payload: { cpt_code: "99213", allowed_amount_cents: 10000 }
              as: AccountManager
            - call: "POST /rcm/fee-schedules/${fs_id}/activate"
              payload: { expected_practice_version: "${prac_v}" }
              as: AccountManager
            - call: "POST /rcm/claims"
              payload: { practice_id: "${prac_id}", provider_id: "${prov_id}", payer_id: "${payer_id}", service_date: "2026-05-15T00:00:00Z", deductible_remaining_cents: 0, coinsurance_pct: 0.20, copay_cents: 0 }
              as: Coder
              captures: { claim_id: $.data.id }
            - call: "POST /rcm/claims/${claim_id}/lines"
              payload: { cpt_code: "99213", units: 1, charge_amount_cents: 15000 }
              as: Coder
            - call: "POST /rcm/claims/${claim_id}/scrub"
              payload: {}
              as: Coder
              as_user_id: "coder-3"
            - call: "POST /rcm/claims/${claim_id}/submit"
              payload: {}
              as: Biller
              as_user_id: "biller-3"
            - call: "POST /rcm/claims/${claim_id}/accept"
              payload: {}
              as: Biller
            - call: "POST /rcm/claims/${claim_id}/denials"
              payload: { denial_code: "CO-97", denied_amount_cents: 8000, denial_date: "2026-05-20T00:00:00Z" }
              as: DenialSpecialist
              captures: { denial_id: $.data.id }
            - call: "POST /rcm/denials/${denial_id}/appeals"
              payload: { level: 1, narrative: "Records support medical necessity." }
              as: DenialSpecialist
              captures: { appeal_id: $.data.id }
            - call: "POST /rcm/appeals/${appeal_id}/submit"
              payload: {}
              as: DenialSpecialist
          trigger:
            - call: "POST /rcm/appeals/${appeal_id}/decision"
              payload: { outcome: "UPHOLD" }
              as: DenialSpecialist
              captures: { appeal_status: $.data.status }
          assert:
            - "Claim.${claim_id}.status == DENIED"
            - "Claim.${claim_id}.appeal_round == 1"
            - "Appeal.${appeal_id}.status == UPHELD"
            - "Denial.${denial_id}.status == UPHELD"
      - name: appeal_branch_overturn_reopens_claim
        grounds:
          - state_machines.Appeal.SUBMITTED_to_OVERTURNED
          - state_machines.Appeal.SUBMITTED_to_UPHELD
          - state_machines.Claim.APPEALED_to_ACCEPTED
          - entities.Appeal.fields.recovered_amount_cents
        distinguishing_aspect: "Branching shape on Appeal: from SUBMITTED the OVERTURN branch reopens the claim to ACCEPTED and sets recovered_amount_cents=5000 and Denial=OVERTURNED — a side-effect set divergent from the UPHOLD branch."
        test_recipe:
          setup:
            - "Claim accepted then denied (denied 5000), appeal drafted and submitted so claim is APPEALED; clock 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AccountManager
            - call: "POST /rcm/practices"
              payload: { name: "Epsilon Clinic", npi: "1111111115", tax_id: "22-3333337", billing_fee_pct: 0.06 }
              as: AccountManager
