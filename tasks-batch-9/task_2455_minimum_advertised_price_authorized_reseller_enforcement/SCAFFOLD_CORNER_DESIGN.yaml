            - "Reseller.${res}.violation_points_total == 3"

      - name: violation_disputed_to_voided_on_sustain_reverses_points_and_rescinds_notice
        claim_type: valid_transition
        grounds: ["state_machines.Violation.transitions.DISPUTED_to_VOIDED", "calculations.reseller_points_ledger"]
        distinguishing_aspect: "A sustained dispute is the compensating action for issuance: points go back to 0, assessed_floor_cents / assessed_points / cure_deadline_at are nulled, and the notice becomes RESCINDED."
        test_recipe:
          setup: ["Violation V1 DISPUTED with assessed_points 3; reseller ledger at 3."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *DISPUTE1
          trigger:
            - call: "POST /violations/${vio}/dispute-decision"
              payload: { decision: "SUSTAIN", decision_reason: "Evidence hash does not match the archived capture" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
          assert:
            - "HTTP 200"
            - "Violation.${vio}.status == VOIDED"
            - "Violation.${vio}.resolution_reason == 'DISPUTE_SUSTAINED'"
            - "Violation.${vio}.assessed_points == null"
            - "Violation.${vio}.assessed_floor_cents == null"
            - "Violation.${vio}.cure_deadline_at == null"
            - "EnforcementNotice.${not1}.status == RESCINDED"
            - "Reseller.${res}.violation_points_total == 0"

      - name: violation_noticed_to_escalated_when_sweep_passes_cure_deadline
        claim_type: valid_transition
        grounds: ["state_machines.Violation.transitions.NOTICED_to_ESCALATED"]
        distinguishing_aspect: "Sweeping at 2026-08-31 (one day past cure_deadline_at 2026-08-30) escalates the violation with resolution_reason CURE_WINDOW_LAPSED and keeps its 3 points in the ledger."
        test_recipe:
          setup: ["Violation V1 NOTICED with cure_deadline_at 2026-08-30; clock advanced to 2026-08-31T00:00:00Z."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - &CLK0831
              call: "POST /_clock/set_current_utc"
