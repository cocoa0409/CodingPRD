      - name: corner_chargeback_parallel_dimensions
        claim_type: parallel
        excluded_because:
          difficulty_instance: chargeback_parallel_dimensions_evolve_independently
          rationale: "The parallel state_machine_shape claim - dispute_status and settlement_status advancing independently on one Chargeback and the combined state being correct - is exactly what that §1.8 instance drives and asserts, including the independence of the two dimensions' terminal values."

      - name: corner_dispute_cyclic_loop_termination
        claim_type: cyclic
        excluded_because:
          difficulty_instance: vendor_dispute_revision_cycle_bounded_at_two_rounds
          rationale: "The cyclic-shape claim (entity loops back, loop count / termination condition respected) is covered there: the SUBMITTED -> INFO_REQUESTED -> SUBMITTED loop is walked once, round_count is asserted at each step, and the third round is refused with ERR_DISPUTE_ROUND_LIMIT_EXCEEDED."

      - name: corner_assess_cascade_down_to_vendor
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: assess_cascade_depth_four_violation_to_vendor_exposure_alert
          rationale: "The cascade-down pattern for POST /compliance/violations/{id}/assess is verified end-to-end there across all four declared links, asserting each intermediate entity rather than only the endpoint's own response."

      - name: corner_allocation_ledger_sync_to_vendor_exposure
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: deduction_post_cascade_depth_four_allocation_to_vendor_exposure
          rationale: "The ledger-sync pattern (state change -> ancestor derived field updated, before/after reconciled) is asserted there for the allocation -> chargeback -> vendor money ladder, with pre-post and post-post figures both pinned."

      - name: corner_deduction_reversal_compensation
        claim_type: compensation
        excluded_because:
          difficulty_instance: deduction_reversal_restores_vendor_open_exposure_exactly
          rationale: "The compensation pattern (undo transition reverses every original side effect with no drift) is the entire subject of that §1.8 instance, which pins vendor.open_chargeback_cents, recovered_lifetime_cents and the surviving REVERSED allocation row."

      - name: corner_violation_guarded_by_shipment_state
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: violation_creation_depends_on_shipment_receipt_state
          rationale: "The cross-entity guarded-transition claim (A -> B only if entity C is in state X) is driven there for violation creation against an IN_TRANSIT versus a RECEIVED shipment, asserting both polarities."
  - section: calculations
    instances:
      - name: corner_tier2_cost_recovery_takes_the_max_branch_and_the_min_fee_floor
        claim_type: correct_result
        grounds:
          - calculations.chargeback_assessment
          - entities.RoutingRequirement.fields.severity_tier
          - endpoints[POST /compliance/violations/{id}/assess]
        distinguishing_aspect: "For a TIER_2 requirement the cost branch is max(unit_recovery, handling_recovery), not their sum: with PKG-02 at per_unit 25 x 400 affected units = 10000 and handling 3.00% of a 500000-cent invoice = 15000, cost_recovery_cents is 15000 (the larger term alone), and because raw 20000 + 15000 = 35000 sits under min_fee 45000 the floor lifts gross_assessed_cents to exactly 45000."
        test_recipe:
          setup:
