            - "g1 == 369000 and d1 == 0 and f1t == 369000"
            - "st2 == DRAFT and g2 == 369000 and d2 == 0 and f2t == 369000 (reopen conserves the monetary fields verbatim)"
            - "g3 == 369000 and f3t == 369000 (refinalize reproduces identical totals — no drift across the round trip)"
