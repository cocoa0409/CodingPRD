  # =========================================================================
  # Section 8: Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_waiver_cancel_returns_412
        claim_type: OptimisticConcurrencyStaleVersion
        grounds:
          - concurrency_rules[waiver-cancel-stale-claim]
          - errors[ERR_STALE_WAIVER_VERSION]
        distinguishing_aspect: "POST /waiver-claims/{id}/cancel with stale expected_waiverclaim_version (after advance-week transitioned the claim to a terminal state) → ERR_STALE_WAIVER_VERSION (412)."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_conflict_state_vs_business_fiscal_waiver_terminal_and_overbid
          rationale: "Already exercised: in the §1.8 instance, the cancel call uses an OCC value stale relative to the post-advance state; state check (priority 5) wins, but OCC mismatch is also present and the rule is grounded."

      - name: cascade_player_release_drops_roster_slot
        claim_type: CascadingSideEffects
        grounds:
          - state_machines.Player.ACTIVE_to_RELEASED
        excluded_because:
          difficulty_instance: compensating_invariant / waiver_won_then_released_preserves_player_count_invariant
          rationale: "§1.8 instance asserts release end-state (free agent pool count)."

      - name: scheduled_action_set_clock_affects_accepted_at
        claim_type: ScheduledActions
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.Trade.fields.accepted_at
        distinguishing_aspect: "Setting the clock via POST /_clock/set_current_utc to a pinned ISO time, then accepting a trade — Trade.accepted_at equals the pinned time."
        test_recipe:
          setup:
            - "League IN_SEASON; trade in PROPOSED state."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-25T10:30:00.000Z" }
              as: Commissioner
              as_user_id: "c22"
            - call: "POST /leagues"
              payload: { name: "Clock L", draft_type: "SNAKE", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "c22"
              captures: { l_id: $.data.id, l_v: $.data.version }
            - call: "POST /leagues/${l_id}/teams"
              payload: { display_name: "A", division: "E" }
              as: Commissioner
              as_user_id: "c22"
              captures: { ta_id: $.data.id }
            - call: "POST /leagues/${l_id}/teams"
              payload: { display_name: "B", division: "E" }
              as: Commissioner
              as_user_id: "c22"
              captures: { tb_id: $.data.id }
            - call: "POST /players"
