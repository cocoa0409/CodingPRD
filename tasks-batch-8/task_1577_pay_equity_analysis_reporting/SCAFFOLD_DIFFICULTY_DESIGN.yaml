            - { call: "POST /api/monitoring-cycles", payload: { study_id: "${sm}", window_start: "2026-12-01", window_end: "2027-03-01", due_date: "2027-03-15" }, as: CompAnalyst, captures: { cy2: "$.data.id", cy2_idx: "$.data.cycle_index" } }
            - { call: "POST /api/monitoring-cycles", payload: { study_id: "${sm}", window_start: "2026-11-30", window_end: "2027-02-01", due_date: "2027-02-15" }, as: CompAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "sm_status == MONITORING after the cascade (setup precondition)"
            - "Cycle 1 created with cycle_index == 1 ([2026-09-02, 2026-12-01))"
            - "Cycle 2 created with cycle_index == 2 — window_start 2026-12-01 equals cycle 1's window_end; touching half-open windows do NOT overlap"
            - "Cycle 3 rejected: err == ERR_MONITOR_WINDOW_OVERLAP (http 409) — 2026-11-30 < 2026-12-01 genuinely intersects cycle 1"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: approve_reverse_roundtrip_conserves_budget_cents
        grounds:
          - calculations.plan_budget_reconciliation
          - state_machines.Adjustment.PROPOSED_to_APPROVED
          - state_machines.Adjustment.EFFECTIVE_to_REVERSED
          - entities.RemediationPlan.fields.committed_cents
        distinguishing_aspect: |
          Conserved quantity = remediation budget cents: committed_cents +
          remaining_cents == total_budget_cents (2700000) at every step, and the
          forward APPROVE (+950000) paired with its compensating REVERSE after
          effectivation returns committed_cents to exactly 0 — no drift.
        test_recipe:
          setup:
            - "Study N (period 2024-01-01..2024-12-31, [GENDER], min_group_size 6) REMEDIATION_OPEN; 6-member group MEDIAN-analyzed; finding TARGETED; plan budget 2700000 APPROVED; adjustment A1 950000 (effective 2026-09-01) and adjustment A2 100000 (effective 2026-09-01, deliberately never decided so the plan cannot auto-COMPLETE and block the reverse)"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyN", analysis_period_start: "2024-01-01", analysis_period_end: "2024-12-31", protected_classes: ["GENDER"], min_group_size: 6 }, as: CompAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sn}", employee_ref: "NM1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 11000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { n_m1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sn}", employee_ref: "NM2", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { n_m2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sn}", employee_ref: "NM3", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { n_m3: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sn}", employee_ref: "NF1", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { n_f1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sn}", employee_ref: "NF2", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { n_f2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sn}", employee_ref: "NF3", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 8500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { n_f3: "$.data.id" } }
            - { call: "POST /api/comparator-groups", payload: { study_id: "${sn}", name: "GN", job_family: FIN, min_job_level: 5, max_job_level: 5, location_code: NY }, as: CompAnalyst, captures: { gn: "$.data.id" } }
            - { call: "PATCH /api/employee-snapshots/${n_m1}", payload: { comparator_group_id: "${gn}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${n_m2}", payload: { comparator_group_id: "${gn}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${n_m3}", payload: { comparator_group_id: "${gn}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${n_f1}", payload: { comparator_group_id: "${gn}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${n_f2}", payload: { comparator_group_id: "${gn}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${n_f3}", payload: { comparator_group_id: "${gn}" }, as: PeopleOpsAdmin }
            - { call: "POST /api/pay-equity-studies/${sn}/advance", payload: {}, as: CompAnalyst }
            - { call: "POST /api/comparator-groups/${gn}/lock", payload: {}, as: CompAnalyst, captures: { gvn: "$.data.version" } }
            - { call: "POST /api/model-runs", payload: { comparator_group_id: "${gn}", methodology: COHORT_MEDIAN, expected_group_version: "${gvn}" }, as: CompAnalyst, captures: { run_n: "$.data.id" } }
            - { call: "POST /api/model-runs/${run_n}/finalize", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${sn}/submit-legal-review", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${sn}/legal-decision", payload: { decision: APPROVE }, as: LegalCounsel }
            - { call: "POST /api/pay-equity-studies/${sn}/open-remediation", payload: {}, as: LegalCounsel }
            - { call: "POST /api/remediation-plans", payload: { study_id: "${sn}", total_budget_cents: 2700000 }, as: CompAnalyst, captures: { plan_n: "$.data.id" } }
            - { call: "GET /api/gap-findings", payload: { study_id: "${sn}" }, as: CompAnalyst, captures: { fn: "$.data[0].id" } }
            - { call: "POST /api/gap-findings/${fn}/disposition", payload: { disposition: TARGETED }, as: CompAnalyst }
            - { call: "POST /api/adjustments", payload: { plan_id: "${plan_n}", gap_finding_id: "${fn}", employee_snapshot_id: "${n_f1}", proposed_increase_cents: 950000, effective_date: "2026-09-01" }, as: CompAnalyst, as_user_id: "user-analyst-1", captures: { na1: "$.data.id" } }
            - { call: "POST /api/adjustments", payload: { plan_id: "${plan_n}", gap_finding_id: "${fn}", employee_snapshot_id: "${n_f2}", proposed_increase_cents: 100000, effective_date: "2026-09-01" }, as: CompAnalyst, as_user_id: "user-analyst-1", captures: { na2: "$.data.id" } }
            - { call: "POST /api/remediation-plans/${plan_n}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /api/remediation-plans/${plan_n}/decision", payload: { decision: APPROVE }, as: RemediationApprover }
            - { call: "GET /api/remediation-plans/${plan_n}", payload: {}, as: RemediationApprover, captures: { c0: "$.data.committed_cents", r0: "$.data.remaining_cents", pv_n: "$.data.version" } }
          trigger:
            - { call: "POST /api/adjustments/${na1}/decision", payload: { decision: APPROVE, expected_plan_version: "${pv_n}" }, as: RemediationApprover, as_user_id: "user-approver-1" }
            - { call: "GET /api/remediation-plans/${plan_n}", payload: {}, as: RemediationApprover, captures: { c1: "$.data.committed_cents", r1: "$.data.remaining_cents" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/adjustments/${na1}", payload: {}, as: RemediationApprover, captures: { na1_mid: "$.data.status" } }
            - { call: "GET /api/remediation-plans/${plan_n}", payload: {}, as: RemediationApprover, captures: { c2: "$.data.committed_cents", plan_mid: "$.data.status" } }
            - { call: "POST /api/adjustments/${na1}/reverse", payload: { rationale: "Employee departed before payout" }, as: RemediationApprover }
            - { call: "GET /api/adjustments/${na1}", payload: {}, as: RemediationApprover, captures: { na1_end: "$.data.status" } }
            - { call: "GET /api/remediation-plans/${plan_n}", payload: {}, as: RemediationApprover, captures: { c3: "$.data.committed_cents", r3: "$.data.remaining_cents" } }
          assert:
            - "c0 == 0 and r0 == 2700000 (baseline before the forward action)"
            - "c1 == 950000 and r1 == 1750000 after APPROVE (c1 + r1 == 2700000)"
            - "na1_mid == EFFECTIVE after the clock sweep and c2 == 950000 — effectivation alone does NOT change committed_cents (EFFECTIVE stays committed)"
            - "plan_mid == EXECUTING (A2 still PROPOSED blocks auto-COMPLETED)"
            - "na1_end == REVERSED after the compensating action"
            - "c3 == 0 == c0 and r3 == 2700000 — the approve->effective->reverse round trip conserves budget cents exactly (c3 + r3 == 2700000)"

      - name: assign_unassign_roundtrip_conserves_headcount
        grounds:
          - entities.ComparatorGroup.fields.member_count
          - entities.PayEquityStudy.fields.snapshot_count
          - entities.PayEquityStudy.fields.assigned_snapshot_count
        distinguishing_aspect: |
          Conserved quantity = study headcount (a different quantity than budget
          cents): snapshot_count stays 3 and assigned_snapshot_count +
          unassigned == 3 through an assign/unassign round trip, with
          member_count returning to exactly 0 — no drift from the pair of
          compensating PATCHes.
        test_recipe:
          setup:
            - "Study O (period 2025-01-01..2025-12-31, [GENDER], min_group_size 2) DRAFT with 3 unassigned snapshots; group GO (ENG, CA, 5) DRAFT with member_count 0"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyO", analysis_period_start: "2025-01-01", analysis_period_end: "2025-12-31", protected_classes: ["GENDER"], min_group_size: 2 }, as: CompAnalyst, captures: { so: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${so}", employee_ref: "OM1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 5, location_code: CA, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { o_1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${so}", employee_ref: "OM2", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 5, location_code: CA, fte_factor: 1.0, base_salary_cents: 10100000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { o_2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${so}", employee_ref: "OF1", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 5, location_code: CA, fte_factor: 1.0, base_salary_cents: 9500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { o_3: "$.data.id" } }
            - { call: "POST /api/comparator-groups", payload: { study_id: "${so}", name: "GO", job_family: ENG, min_job_level: 5, max_job_level: 5, location_code: CA }, as: CompAnalyst, captures: { go: "$.data.id" } }
            - { call: "GET /api/pay-equity-studies/${so}", payload: {}, as: PeopleOpsAdmin, captures: { snap_total0: "$.data.snapshot_count", assigned0: "$.data.assigned_snapshot_count" } }
          trigger:
            - { call: "PATCH /api/employee-snapshots/${o_1}", payload: { comparator_group_id: "${go}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${o_2}", payload: { comparator_group_id: "${go}" }, as: PeopleOpsAdmin }
            - { call: "GET /api/comparator-groups/${go}", payload: {}, as: PeopleOpsAdmin, captures: { mc2: "$.data.member_count" } }
            - { call: "GET /api/pay-equity-studies/${so}", payload: {}, as: PeopleOpsAdmin, captures: { snap_total2: "$.data.snapshot_count", assigned2: "$.data.assigned_snapshot_count" } }
            - { call: "PATCH /api/employee-snapshots/${o_1}", payload: { comparator_group_id: null }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${o_2}", payload: { comparator_group_id: null }, as: PeopleOpsAdmin }
            - { call: "GET /api/comparator-groups/${go}", payload: {}, as: PeopleOpsAdmin, captures: { mc_end: "$.data.member_count" } }
            - { call: "GET /api/pay-equity-studies/${so}", payload: {}, as: PeopleOpsAdmin, captures: { snap_total3: "$.data.snapshot_count", assigned3: "$.data.assigned_snapshot_count" } }
          assert:
            - "snap_total0 == 3 and assigned0 == 0 and initial member_count == 0"
            - "After two assigns: mc2 == 2, snap_total2 == 3, assigned2 == 2 (assigned + unassigned == 3)"
            - "After both unassigns: mc_end == 0 (exactly the initial value) and assigned3 == 0 and snap_total3 == 3 — headcount conserved through the round trip"
            - "The third snapshot ${o_3} was never assigned: EmployeeSnapshot.${o_3}.comparator_group_id is null throughout"
