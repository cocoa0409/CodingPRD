          assert:
            - "After cash: Tenancy.${ten}.refund_paid_cents == 149337, reserved_cents == 0, statement == SETTLED, tenancy == SETTLED (bubble up)"
            - "After reverse: refund_paid_cents == ${paid_pre} == 0 and balance_remaining_cents == ${bal_pre} == 149337 (cash+reverse pair leaves both quantities at their pre-disbursement values)"
            - "Invariant: deposit 200000 + interest 9337 - billed 60000 + released 0 - refund_paid 0 - escheated 0 - reserved 0 == balance_remaining_cents 149337"
            - "Statement reverts to ISSUED and tenancy to VACATED after reverse"

      - name: issue_then_reopen_conserves_key_counts
        grounds:
          - calculations.key_fob_lock_charge
          - state_machines.DepositStatement.DISPUTED_to_DRAFT
          - entities.Tenancy.fields.keys_issued
        distinguishing_aspect: |
          Conserved quantity = physical key count (not money): keys_issued (2)
          must always equal keys_returned + billed key-deduction quantity +
          unbilled unaccounted keys. Issue converts the unaccounted key into a
          BILLED line of quantity 1; the compensating reopen returns that line
          to DRAFT. Across the pair, keys_issued and keys_returned never move
          and the identity holds in every observed state.
        test_recipe:
          setup:
            - "Canonical tenancy; tenant returned 1 of 2 keys and 0 of 1 fobs before move-out"
            - "Move-out completion created KEY (qty 1, 5,000c), FOB (qty 1, 7,500c), LOCK (12,000c) DRAFT lines; statement DRAFT"
            - "Statement issued timely (lines BILLED), then disputed (10,000c), then reopened"
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi: $.data.id }
            - { call: "POST /pm/inspections/${mi}/complete", payload: {}, as: Inspector }
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ManagerAdmin }
            - { call: "POST /pm/tenancies/${ten}/give_notice", payload: {}, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten}/record_key_return", payload: { keys_returned: 1, fobs_returned: 0 }, as: PropertyManager }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo: $.data.id }
            - { call: "POST /pm/inspections/${mo}/complete", payload: {}, as: Inspector }
            - call: "GET /pm/tenancies/${ten}"
              as: PropertyManager
              captures: { ten_v: $.data.version }
            - call: "POST /pm/statements"
              payload: { tenancy_id: "${ten}", expected_tenancy_version: "${ten_v}" }
              as: PropertyManager
              captures: { stmt: $.data.id }
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ManagerAdmin }
            - { call: "POST /pm/statements/${stmt}/issue", payload: {}, as: PropertyManager }
            - call: "POST /pm/disputes"
              payload: { statement_id: "${stmt}", disputed_amount_cents: 10000, reason: "lock charge unfair" }
              as: Tenant
              as_user_id: "${ten}"
              captures: { disp: $.data.id }
          trigger:
            - { call: "POST /pm/statements/${stmt}/reopen", payload: {}, as: PropertyManager }
          assert:
            - "At every point: Tenancy.${ten}.keys_issued == 2 and keys_returned == 1 (never mutated by issue/reopen)"
            - "While ISSUED: KEY_NOT_RETURNED line BILLED with quantity 1 => 1 returned + 1 billed == 2 issued"
            - "After reopen: KEY_NOT_RETURNED line DRAFT with quantity 1 => 1 returned + 0 billed + 1 unbilled-unaccounted == 2 issued"
            - "After reopen: pending_deductions_cents == 24500, total_deductions_cents == 0, Dispute.${disp} WITHDRAWN"
