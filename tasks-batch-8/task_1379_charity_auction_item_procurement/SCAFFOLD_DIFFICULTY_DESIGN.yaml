            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor E", email: "de@x.org", donor_type: "BUSINESS" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Chef dinner", ask_estimate_cents: 40000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "Chef dinner", description: "For 8", kind: "EXPERIENCE" }, as: ProcurementOfficer, captures: { it: "$.data.id", it_v: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 40000, fmv_source: "DONOR_DECLARED", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va: "$.data.id" } }
            - { call: "POST /valuations/${va}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Dinner" }, as: CatalogManager, captures: { bd: "$.data.id" } }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it}" }, as: CatalogManager }
            - { call: "POST /bundles/${bd}/publish", payload: {}, as: CatalogManager, captures: { bd_v: "$.data.version" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bidders", payload: { gala_event_id: "${ev}", full_name: "Bidder A", email: "ba@x.org", paddle_no: 1, payment_method_on_file: true }, as: GalaAdmin, captures: { br: "$.data.id" } }
            - { call: "POST /bundles/${bd}/bids", payload: { amount_cents: 50000, expected_bundle_version: "${bd_v}" }, as: Bidder, as_user_id: "${br}" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "GET /invoices", payload: { bundle_id: "${bd}" }, as: GalaAdmin, captures: { inv: "$.data[0].id" } }
          trigger:
            - { call: "POST /invoices/${inv}/payments", payload: { amount_cents: 20000, method: "CARD" }, as: Bidder, as_user_id: "${br}", captures: { pay1: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { payment_id: "${pay1}", outcome: "SUCCEEDED" }, as: GalaAdmin }
            - { call: "GET /invoices/${inv}", payload: {}, as: FinanceOfficer, captures: { ps1: "$.data.payment_status", fs1: "$.data.fulfillment_status" } }
            - { call: "POST /invoices/${inv}/payments", payload: { amount_cents: 30000, method: "CHECK" }, as: Bidder, as_user_id: "${br}", captures: { pay2: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { payment_id: "${pay2}", outcome: "SUCCEEDED" }, as: GalaAdmin }
            - { call: "GET /invoices/${inv}", payload: {}, as: FinanceOfficer, captures: { ps2: "$.data.payment_status", fs2: "$.data.fulfillment_status" } }
            - { call: "GET /invoices/${inv}/certificates", payload: {}, as: FinanceOfficer, captures: { cert: "$.data[0].id", cert_st: "$.data[0].status" } }
            - { call: "POST /certificates/${cert}/redeem", payload: { scheduled_start: "2027-01-10T00:00:00Z", scheduled_end: "2027-01-12T00:00:00Z" }, as: Bidder, as_user_id: "${br}" }
            - { call: "GET /invoices/${inv}", payload: {}, as: FinanceOfficer, captures: { ps3: "$.data.payment_status", fs3: "$.data.fulfillment_status" } }
          assert:
            - "after partial payment: payment_status == PARTIALLY_PAID and fulfillment_status == PENDING (payment moved alone)"
            - "after full payment: payment_status == PAID and fulfillment_status == READY; Certificate.${cert}.status == ISSUED with expires_at == 2027-08-01T00:00:00Z"
            - "after redemption: fulfillment_status == FULFILLED while payment_status remains PAID (fulfillment moved alone)"
            - "Invoice.${inv}.amount_paid_cents == 50000"

      - name: disposition_reconsideration_cycle
        grounds:
          - state_machines.Disposition.DONOR_NOTIFIED_to_PROPOSED
          - state_machines.Item.UNSOLD_to_DISCARDED
        distinguishing_aspect: |
          Disposition has a genuine reconsideration cycle DONOR_NOTIFIED -> PROPOSED
          (donor decline clears the decision) before a second decision DISCARD is
          accepted and EXECUTED — distinct from the solicitation cycle (different
          entity) and from the invoice parallel machine.
