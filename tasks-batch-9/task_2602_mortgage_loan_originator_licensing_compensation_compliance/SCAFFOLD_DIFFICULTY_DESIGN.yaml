               locked_amount_cents)"
            - "Originator.${orig_id}.lifetime_accrued_cents == 400000 and
               open_investigation_count == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: sponsorship_half_open_adjacency_accepted_backdate_rejected
        grounds:
          - validations[priority=29]
          - calculations.state_authority_resolution
          - state_machines.SponsorshipTransfer
        distinguishing_aspect: |
          HALF-OPEN interval geometry on SponsorshipTransfer. S1 occupies
          [2026-08-01T00:00:00Z, 2026-08-10T00:00:00Z). A successor starting at exactly
          2026-08-10T00:00:00Z is ACCEPTED because the predecessor's end is exclusive, and an
          application taken at that same instant is authorised by the successor. A third transfer
          back-dated to 2026-08-05T00:00:00Z, which lands strictly inside S1's interval, is
          REJECTED with ERR_SPONSORSHIP_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "Originator NMLS 1100015 with an ACTIVE CA licence CA-DFPI-40203 and sponsorship S1
               for INST-ALPHA effective 2026-08-01T00:00:00Z."
            - "Clock advanced to 2026-08-10T00:00:00Z and S1 relinquished at that instant, so its
               half-open interval is [2026-08-01, 2026-08-10)."
          setup_api_calls:
            - call: "POST /originators"
              payload: { nmls_unique_id: "1100015", legal_name: "Greta Mundo", hire_date: "2025-05-05T00:00:00Z", employment_status: "EMPLOYED" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-40203", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026, required_ce_hours: 8 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-ALPHA", effective_at: "2026-08-01T00:00:00Z", expected_license_registration_version: "${lic_v0}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { s1_id: $.data.id }
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sponsorship-transfers/${s1_id}/relinquish"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { s1_status: $.data.status, s1_relinq: $.data.relinquished_at }
            - call: "GET /license-registrations/${lic_id}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_v1: $.data.version }
          trigger:
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-BETA", effective_at: "2026-08-10T00:00:00Z", expected_license_registration_version: "${lic_v1}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { s2_id: $.data.id, s2_status: $.data.status, s2_eff: $.data.effective_at }
            - call: "GET /originators/${orig_id}/authority"
              payload: { as_of_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { auth_at_boundary: $.data.authorized_state_codes }
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BW-2602-A1", product_type: "FIXED_30", requested_amount_cents: 17000000, par_rate_bps: 642 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { loan_id: $.data.id, loan_taken_at: $.data.application_taken_at, loan_flag: $.data.authority_flag }
            - call: "GET /license-registrations/${lic_id}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_v2: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-GAMMA", effective_at: "2026-08-05T00:00:00Z", expected_license_registration_version: "${lic_v2}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${s1_status} == RELINQUISHED and ${s1_relinq} == 2026-08-10T00:00:00Z"
            - "${s2_status} == ACTIVE and ${s2_eff} == 2026-08-10T00:00:00Z - adjacency at the
               exclusive end of the predecessor is legal, so HTTP 201 is returned"
            - "${auth_at_boundary} == [\"CA\"] - the successor's start is inclusive, so authority
               exists at the exact boundary instant with no one-millisecond gap"
            - "${loan_taken_at} == 2026-08-10T00:00:00Z and ${loan_flag} == VERIFIED"
            - "${err_id} == ERR_SPONSORSHIP_PERIOD_OVERLAP with HTTP 409 - 2026-08-05T00:00:00Z
               satisfies S1.effective_at <= new < S1.relinquished_at and is also strictly before
               S2.effective_at"
            - "GET /sponsorship-transfers?license_registration_id=${lic_id} returns exactly 2 rows
               (${s1_id} RELINQUISHED, ${s2_id} ACTIVE); no INST-GAMMA row was written"
            - "LicenseRegistration.${lic_id}.active_sponsoring_institution_code == INST-BETA and
               active_sponsorship_effective_at == 2026-08-10T00:00:00Z"

      - name: plan_assignment_closed_adjacency_rejected_next_day_accepted
        grounds:
          - validations[priority=30]
          - state_machines.CompensationPlan.ACTIVE_to_SUPERSEDED
          - concurrency_rules[plan-assignment-stale-originator]
        distinguishing_aspect: |
          The OPPOSITE geometry on a different entity pair: plan assignments use CLOSED bounds, so
          adjacency IS a collision. P1 covers [2026-08-01, 2026-09-30] inclusive; assigning P2 from
          exactly 2026-09-30 is REJECTED with ERR_PLAN_PERIOD_OVERLAP, while 2026-10-01 is
          accepted and supersedes P1. Read against the sponsorship instance, this pins that the two
          overlap rules deliberately differ at the shared endpoint.
        test_recipe:
          setup:
            - "Originator NMLS 1100016, no licence needed (assignment does not require authority)."
            - "Two ACTIVE plans: P1 at 150 bps and P2 at 175 bps, each with one permissible
               variable at weight 100."
            - "P1 assigned over [2026-08-01T00:00:00Z, 2026-09-30T00:00:00Z] with a fresh
               expected_originator_version."
          setup_api_calls:
            - call: "POST /originators"
              payload: { nmls_unique_id: "1100016", legal_name: "Hugo Bassey", hire_date: "2025-06-02T00:00:00Z", employment_status: "EMPLOYED" }
