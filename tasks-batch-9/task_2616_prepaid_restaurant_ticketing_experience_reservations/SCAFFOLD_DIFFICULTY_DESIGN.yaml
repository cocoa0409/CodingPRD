          Metric: hours_to_service against the STANDARD ladder's 72-hour row,
          on POST /reservations/{id}/cancel. The comparison is >=, so a
          cancellation at exactly 72.000 hours takes the cheaper 0 bp band and
          refunds everything, while the same cancellation one minute later
          (71.983 hours) drops to the 5000 bp band. One minute of clock changes
          the refund from 11583 to 5291.
