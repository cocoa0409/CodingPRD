  - section: endpoints
    instances:

      - name: standard_crud_publication_create_read_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints."POST /publications"
          - endpoints."GET /publications/{id}"
          - endpoints."GET /publications"
        distinguishing_aspect: |
          The create/read/list triple round-trips one Publication: the id returned by POST is
          readable by GET /{id} with identical field values, and the same row appears exactly once
          under a system_area_id filter — while the catalog declares no update or delete route for
          publications at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; SystemArea POWERTRAIN, Manufacturer ACME, VehicleModel AX7 exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /vehicle-models"
              payload: { manufacturer_id: "${mfr_id}", model_code: "AX7", model_year: 2025 }
              as: PlatformAdmin
              captures: { vm_id: $.data.id }
          trigger:
            - call: "POST /publications"
              payload: { vehicle_model_id: "${vm_id}", system_area_id: "${sa_pt_id}", publication_type: "TSB" }
              as: ContentPublisher
              as_user_id: "cp_1"
              captures: { pub_id: $.data.id }
            - call: "GET /publications/${pub_id}"
              payload: {}
              as: ContentPublisher
              as_user_id: "cp_1"
            - call: "GET /publications"
              payload: { system_area_id: "${sa_pt_id}", publication_type: "TSB" }
              as: ContentPublisher
              as_user_id: "cp_1"
          assert:
            - "create call: HTTP status == 201 and publication_type == TSB"
            - "read call: HTTP status == 200 and id == ${pub_id}"
            - "read call: vehicle_model_id == ${vm_id} and system_area_id == ${sa_pt_id} and publication_type == TSB"
            - "read call: current_version_no == 0 and published_version_id == null and version == 1"
            - "list call: total_count == 1 and data[0].id == ${pub_id}"
            - "§1.5 declares no PATCH, PUT or DELETE route for /publications/{id}"

      - name: action_endpoint_license_suspend_transitions_and_stamps_reason
        claim_type: action_endpoint
        grounds:
          - endpoints."POST /licenses/{id}/suspend"
          - state_machines.License.ACTIVE_to_SUSPENDED
          - validations[priority=36]
        distinguishing_aspect: |
          The suspend action does three declared things and nothing more: status ACTIVE ->
          SUSPENDED, suspension_reason stamped from the request, version bumped 2 -> 3 — and while
          existing entitlements are untouched, a NEW entitlement against the suspended license is
          refused with ERR_LICENSE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; SystemArea POWERTRAIN exists"
            - "Manufacturer ACME COMPLIANT with an ACTIVE License; Shop 'Bay Auto' tier PRO funded 200000"
