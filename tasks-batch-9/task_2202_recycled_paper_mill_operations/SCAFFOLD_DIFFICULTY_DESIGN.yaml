  # ===========================================================================
  # Rule 9 — compensating invariants over four different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: lot_fiber_ledger_survives_pulper_charge_then_cancel
        grounds:
          - calculations.mill_fiber_balance
          - state_machines.PulpBatch.PULPING_to_CANCELLED
          - entities.FiberInventoryLot.fields.tons_consumed
          - endpoints.GET_mill_fiber_balance
          - errors.ERR_PULP_BATCH_INVALID_STATE
        distinguishing_aspect: |
          Conserved quantity: the mill-wide fiber ledger identity
          total_received_tons - total_consumed_tons - total_available_tons == 0.000, observed
          across the reservation and its compensating release. Charging the pulper for the lot's
          entire 36.000 tons drives the lot to DEPLETED, and cancelling from PULPING must subtract
          the same tonnage back out and restore AVAILABLE — while the batch keeps its pinned
          provisional_accepted_tons of 30.060, because cancel releases the reservation without
          rewriting the yield projection. A cancel that only flips status leaves the ledger
          reporting 36.000 consumed against 0.000 available.
        test_recipe:
          setup:
            - "FiberGrade OCC_11 has max_moisture_pct 12.00 and nominal_yield_pct 88.00; MIX_54 exists only as its downgrade target."
            - "One receipt of two sublots, each 20.000 gross / 2.000 tare at exactly 12.00 moisture, so no moisture deduction applies: wet_i 18.000, ded_i 0.000, dry_i 18.000, net_tons 36.00 and weighted_contamination_pct 2.50."
            - "The ACCEPT disposition mints the mill's only FiberInventoryLot at tons_received 36.00, so every /mill/fiber-balance figure below describes that single lot."
            - "One PulpBatch charges the whole lot (36.000 tons_charged), which is the inclusive-equality case of the sufficiency rule at priority 66."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, downgrade_target_grade_code: "MIX_54", rank_order: 1 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-grade-specs", payload: { product_code: "TL_140", family: "CONTAINERBOARD", basis_weight_gsm: 140.0, target_moisture_pct: 7.50, moisture_tolerance_pct: 0.80, min_sct_kn_m: 2.20, requires_deink_pulp: false, rank_order: 10 }, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /suppliers", payload: { name: "Riverbend Fiber", freight_per_ton: 22.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "OCC_11", contracted_tons: 200.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-C-003", sublots: [ { sublot_no: 1, gross_tons: 20.000, tare_tons: 2.000, moisture_pct: 12.00, contamination_pct: 2.50 }, { sublot_no: 2, gross_tons: 20.000, tare_tons: 2.000, moisture_pct: 12.00, contamination_pct: 2.50 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_id: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_id}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "GET /fiber-inventory-lots", payload: { receipt_id: "${rcpt_id}" }, as: MachineOperator, as_user_id: "mo_1", captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /pulp-batches", payload: { pulper_line: "OCC_LINE", target_product_code: "TL_140", furnish_lines: [ { inventory_lot_id: "${lot_id}", tons_charged: 36.000 } ] }, as: MachineOperator, as_user_id: "mo_1", captures: { pb_id: "$.data.id" } }
          trigger:
            - { call: "POST /pulp-batches/${pb_id}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "GET /mill/fiber-balance", payload: {}, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /pulp-batches/${pb_id}/cancel", payload: {}, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "GET /mill/fiber-balance", payload: {}, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /pulp-batches/${pb_id}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
          assert:
            - "FiberReceipt.${rcpt_id}.net_tons == 36.00 AND moisture_deduction_tons == 0.000 AND weighted_moisture_pct == 12.00 AND weighted_contamination_pct == 2.50"
            - "after the start call: FiberInventoryLot.${lot_id}.tons_consumed == 36.000, tons_available == 0.000, status == DEPLETED"
            - "the first GET /mill/fiber-balance returns total_received_tons == 36.000, total_consumed_tons == 36.000, total_available_tons == 0.000, imbalance_tons == 0.000"
            - "PulpBatch.${pb_id}.provisional_accepted_tons == 30.060 AND charged_tons == 36.000 AND blend_contamination_pct == 2.500 (effective yield 83.50 = 88.00 - 1.8 * 2.50)"
            - "the cancel call returns HTTP 200 and PulpBatch.${pb_id}.status == CANCELLED"
            - "after the cancel call: FiberInventoryLot.${lot_id}.tons_consumed == 0.000, tons_available == 36.000, status == AVAILABLE"
            - "the second GET /mill/fiber-balance returns total_received_tons == 36.000, total_consumed_tons == 0.000, total_available_tons == 36.000, imbalance_tons == 0.000"
            - "PulpBatch.${pb_id}.provisional_accepted_tons is still 30.060 after the cancel — the compensating action releases tonnage without erasing the pinned projection"
            - "the second start call returns HTTP 409 with data.error_id == \"ERR_PULP_BATCH_INVALID_STATE\", so the released tonnage cannot be double-consumed"

      - name: batch_pulp_ledger_restored_by_run_abort_without_touching_lots
        grounds:
          - calculations.pulp_yield_final
          - state_machines.ProductionRun.RUNNING_to_ABORTED
          - endpoints.POST_run_abort
          - calculations.mill_fiber_balance
          - entities.PulpBatch.fields.available_tons
        distinguishing_aspect: |
          Conserved quantity: the BATCH-level pulp ledger
          final_accepted_tons == consumed_tons + available_tons, which must hold before, during and
          after a run draws pulp. Aborting a RUNNING run returns pulp_draw_tons to the batch and to
          nothing else: the FiberInventoryLot ledger must stay pinned at 36.000 received /
          30.000 consumed / 6.000 available throughout, because fiber was consumed at the pulper,
          not at the machine. An implementation that credits the abort back to the lot keeps
          imbalance_tons at 0.000 while silently manufacturing 12.000 tons of furnish.
