  - rule_id: cross_entity_state_dependency
    instances:

      - name: terrain_open_requires_serving_lift_open
        grounds:
          - validations[priority=31]
          - errors[ERR_SERVING_LIFT_NOT_OPEN]
          - state_machines.TerrainArea.READY_to_OPEN
          - state_machines.Lift.STANDBY_to_OPEN
          - entities.Lift.fields.service_status
          - entities.TerrainArea.fields.serving_lift_id
        distinguishing_aspect: |
          The entity pair is TerrainArea -> Lift: whether an area may open is decided by the service_status
          of a DIFFERENT row that the request body never mentions - the request carries only a decision and a
          note. Every gate on the area itself already holds (base depth 40.0 >= 30, groom coverage 83.3,
          two on-duty patrollers, no park, no avalanche terrain), so the only reason for the rejection is the
          serving lift sitting in STANDBY. Opening that lift and replaying the identical request then
          succeeds, which shows the dependency is on the other entity's live state and not on anything
          cached at area creation.
        test_recipe:
          setup:
            - "Open-mountain bootstrap with the lift left in STANDBY and the opening decision omitted: L1 is STANDBY with mechanical_status INSPECTION_PASSED and two operators, T1 is READY, day plan PUBLISHED_PARTIAL, season OPERATING."
            - "The logical clock stays at 2026-08-01T00:00:00Z, so inspection_valid_until 2026-08-02T00:00:00Z is still in the future and priority 32 is satisfied."
            - "The same opening-decision payload is submitted twice, before and after the lift is opened."
