          - errors[ERR_APPARATUS_OUT_OF_SERVICE]
        distinguishing_aspect: "Entity pair DutyShift->Apparatus: a DRAFT shift cannot be published while Apparatus.posture==OUT_OF_SERVICE (critical equipment down); publishing succeeds only after the apparatus returns to IN_SERVICE."
