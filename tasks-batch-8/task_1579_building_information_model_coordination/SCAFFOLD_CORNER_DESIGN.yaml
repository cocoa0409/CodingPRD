            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
          trigger:
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id, f1_st: $.data.status } }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F2", target_format: NWC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { err: $.data.error_id } }
            - { call: "GET /api/federated-models/${f1}", payload: {}, as: VDCManager, captures: { f1_after: $.data.status } }
          assert:
            - "first create succeeds with the observed version (F1 ASSEMBLED)"
            - "second create with the same (now stale) expected_project_version: 412 ERR_STALE_PROJECT_VERSION"
            - "F1 remains ASSEMBLED (the rejected create did not supersede it)"
            - "Project.${pid}.version == 2 (exactly one increment from the successful create)"

      - name: occ_takeoff_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[takeoff-create-stale-project]
          - errors[ERR_STALE_PROJECT_VERSION]
        distinguishing_aspect: "Same OCC field on the takeoff write path: a takeoff create carrying a project version captured before an intervening advance-phase is rejected 412; re-reading the project and re-issuing with the fresh version succeeds."
        test_recipe:
          setup: ["BASE: M1 ACCEPTED, F1 FROZEN; pv2 captured (version 2)"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CL2" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "GET /api/projects/${pid}", payload: {}, as: VDCManager, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /api/projects/${pid}/advance-phase", payload: {}, as: VDCManager }
            - { call: "POST /api/projects/${pid}/quantity-takeoffs", payload: { federated_model_id: "${f1}", extraction_mode: GROSS, elements: [ { element_ref: "E1", gross_qty: 1.0, deduction_qty: 0.0 } ], expected_project_version: "${pv2}" }, as: BIMCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /api/projects/${pid}", payload: {}, as: VDCManager, captures: { pv3: $.data.version } }
            - { call: "POST /api/projects/${pid}/quantity-takeoffs", payload: { federated_model_id: "${f1}", extraction_mode: GROSS, elements: [ { element_ref: "E1", gross_qty: 1.0, deduction_qty: 0.0 } ], expected_project_version: "${pv3}" }, as: BIMCoordinator, captures: { t1: $.data.id, t1_st: $.data.status } }
          assert:
            - "stale expected_project_version after advance-phase: 412 ERR_STALE_PROJECT_VERSION; no takeoff persisted"
            - "re-read + fresh version: create succeeds, T1 EXTRACTED"

      - name: version_pinning_on_members_and_signoffs
        claim_type: version_pinning
        grounds:
          - entities.FederatedModelMember.fields.pinned_model_version
          - entities.SignOff.fields.pinned_model_version
          - state_machines.TradeModel.ACCEPTED_to_SUPERSEDED
        distinguishing_aspect: "Version pinning at approval points: the member pin equals M1.version at assembly (3 = create+submit+accept); the sign-off pin equals M1.version at submit-for-signoff (3); after M2's accept supersedes M1, the member re-points to M2 but keeps the stale pin (3) and is_stale is true until re-freeze re-pins."
        test_recipe:
          setup: ["TC1-style chain: M1 ACCEPTED, F1 FROZEN, package with SIGNED sign-off; then M2 accepted"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CL3" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "FabCo", discipline: MECHANICAL, hourly_rate_cents: 10000, coordination_budget_hours: 50.0, software_platform: TEKLA }, as: VDCManager, captures: { p2: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "GET /api/federated-models/${f1}/members", payload: {}, as: VDCManager, captures: { pin1: "$.data[0].pinned_model_version" } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/projects/${pid}/fabrication-packages", payload: { federated_model_id: "${f1}", scope_disciplines: ["STRUCTURAL"] }, as: FabricationLead, as_user_id: "${p2}", captures: { pkg: $.data.id } }
            - { call: "POST /api/fabrication-packages/${pkg}/submit-for-signoff", payload: {}, as: FabricationLead, as_user_id: "${p2}" }
            - { call: "GET /api/fabrication-packages/${pkg}/signoffs", payload: {}, as: VDCManager, captures: { so1: "$.data[0].id", so_pin1: "$.data[0].pinned_model_version" } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 350, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m2: $.data.id } }
            - { call: "POST /api/trade-models/${m2}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/trade-models/${m2}/accept", payload: {}, as: BIMCoordinator }
            - { call: "GET /api/federated-models/${f1}/members", payload: {}, as: VDCManager, captures: { pin2: "$.data[0].pinned_model_version", mm2: "$.data[0].trade_model_id" } }
            - { call: "GET /api/federated-models/${f1}", payload: {}, as: VDCManager, captures: { stale2: $.data.is_stale } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "GET /api/federated-models/${f1}/members", payload: {}, as: VDCManager, captures: { pin3: "$.data[0].pinned_model_version" } }
            - { call: "GET /api/federated-models/${f1}", payload: {}, as: VDCManager, captures: { stale3: $.data.is_stale } }
          assert:
            - "at assembly: member pinned_model_version == 3 (M1 version after create/submit/accept)"
            - "at submit-for-signoff: SignOff pinned_model_version == 3"
            - "after M2 accept: member re-pointed to ${m2} but pin stays 3 (stale) and is_stale == true"
            - "after re-freeze: pinned_model_version re-pinned to M2's current version (3) and is_stale == false"

      - name: derived_cri_recomputed_per_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.coordination_readiness_index
          - entities.Project.fields.coordination_readiness_index
        distinguishing_aspect: "Immediate derived-field reconciliation: CRI tracks each mutation without a sweep — 100 before import, 75 after a CRITICAL import, still 75 after resolve (RESOLVED is still open), 100 only after verify closes the clash."
        test_recipe:
          setup: ["BASE clash chain; C1 CRITICAL assigned to P1"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CL4" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/federated-models/${f1}/clash-runs", payload: { tolerance_mm: 5.0 }, as: BIMCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/start", payload: {}, as: BIMCoordinator }
            - { call: "GET /api/projects/${pid}", payload: {}, as: VDCManager, captures: { cri0: $.data.coordination_readiness_index } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "D/1", overlap_mm: 75.0, spans_disciplines: true }, as: BIMCoordinator, captures: { c1: $.data.id } }
            - { call: "GET /api/projects/${pid}", payload: {}, as: VDCManager, captures: { cri1: $.data.coordination_readiness_index } }
          trigger:
            - { call: "POST /api/clash-issues/${c1}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c1}/resolve", payload: { actual_labor_hours: 1.0 }, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "GET /api/projects/${pid}", payload: {}, as: VDCManager, captures: { cri2: $.data.coordination_readiness_index } }
            - { call: "POST /api/clash-issues/${c1}/verify", payload: { re_inspection_overlap_mm: 0.0 }, as: BIMCoordinator, as_user_id: "coord-2" }
            - { call: "GET /api/projects/${pid}", payload: {}, as: VDCManager, captures: { cri3: $.data.coordination_readiness_index } }
          assert:
            - "before import: CRI == 100"
            - "after import (NEW): CRI == 75"
            - "after resolve (RESOLVED, still open): CRI == 75"
            - "after verify (VERIFIED, closed): CRI == 100"

      - name: cascade_side_effects_stub
        claim_type: cascading_side_effects
        grounds:
          - state_machines.TradeModel.ACCEPTED_to_SUPERSEDED
        excluded_because:
          difficulty_instance: transitive_cascade / accept_supersede_unfreeze_revoke_regress_chain
          rationale: "The 4-link cascade is asserted hop-by-hop in section 1.8; the reopen cascade is covered by reopen_breach_reliability_probation_chain."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_in_mutation_response
        claim_type: immediate
        grounds:
          - complexity_profile
        distinguishing_aspect: "Immediate consistency: mutation responses carry the post-mutation state directly — accept returns status ACCEPTED with audit_score populated; package release returns RELEASED with released_at; no re-read or delay is needed to observe effects."
        test_recipe:
          setup: ["project with partner P1; model M1 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CM1" }, as: VDCManager, captures: { pid: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator, captures: { st: $.data.status, aud: $.data.audit_score, ver: $.data.version, upd: $.data.updated_at } }
          assert:
            - "accept response itself: status == ACCEPTED, audit_score == 100.0, version == 3, updated_at refreshed"
            - "no GET required to observe the transition or the computed audit_score"
