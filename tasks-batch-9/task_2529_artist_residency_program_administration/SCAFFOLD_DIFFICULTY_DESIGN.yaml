      - name: panel_provisional_mean_lands_exactly_on_a_half_cent
        grounds: "§1.3 calculations.application_composite_score precision ('rounding is applied twice - once per reviewer and once on the mean', round_half_up, 2dp) and its worked_example; §1.5 POST /panel-assignments/{id}/scores"
        distinguishing_aspect: |
          ROUNDING-TIE boundary - a third metric on a third endpoint. Reviewer totals 82.00, 80.00,
          77.58 and 70.00 sum to 309.58, and 309.58 / 4 = 77.395 lands EXACTLY on a half-cent, the
          one input where round_half_up (77.40) and every other rounding mode disagree: truncation
          and round-half-down give 77.39, banker's rounding gives 77.40 here but 77.38 for the
          neighbouring 77.385 case. The 77.58 leg is itself only reachable because the reviewer-level
          rounding happens BEFORE the mean: 86.2 x 0.90 = 77.58 exactly, and a single-rounding
          implementation that averages weighted_raw values instead would compute
          (82.0 + 80.0 + 77.58 + 70.0) from unrounded legs and miss the tie entirely. The n == 3
          state is asserted first because 239.58 / 3 = 79.86 divides EXACTLY, so the tie appears only
          on the fourth score.
        test_recipe:
          setup: |
            CHAIN-PANEL: one cycle in PANEL_REVIEW with panel_quorum 2, one SCULPT application in
            PANEL_REVIEW, and FOUR panelists assigned to it. Three panelists list SCULPT expertise
            (multiplier 1.00) and the third, Rae Three, lists only PRINT, so its expertise_matched is
            false and the 0.90 mismatch multiplier applies. TRIM_MIN_PANELISTS is 4, so the fourth
            score simultaneously activates the trim on final_panel_score and creates the half-cent
            tie on provisional_screening_score.
