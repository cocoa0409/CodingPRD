        grounds:
          - validations[priority=18]
          - errors[ERR_VISIT_WEEKEND_BLOCKED]
          - errors[ERR_VISIT_OUTSIDE_WINDOW]
        distinguishing_aspect: "A certificate issued at a Saturday instant outside the clinic window violates both priority-18 checks; the weekday error is the one reported because the weekend rule is the tighter constraint."
