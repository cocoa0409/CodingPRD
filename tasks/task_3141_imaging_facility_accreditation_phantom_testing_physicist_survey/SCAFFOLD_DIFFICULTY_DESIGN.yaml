- rule_id: compensating_invariant
  instances:
  - name: registry_credit_cents_conserved_across_record_submit_and_reject
    grounds:
    - state_machines.DoseRegistryRecord.STAGED_to_SUBMITTED
    - state_machines.DoseRegistryRecord.SUBMITTED_to_REJECTED
    - entities.Facility.fields.registry_credit_cents
    - validations[priority=10]
    - errors.ERR_INSUFFICIENT_REGISTRY_CREDIT
    distinguishing_aspect: 'registry_credit_cents is a conserved money quantity: submit debits exactly 2500 and reject credits exactly 2500, so the facility''s balance returns to the value it held before the pair, with facility.version having advanced by exactly the number of mutations applied.'
    test_recipe:
      setup:
      - Logical clock 2026-09-05T00:00:00Z (inside the unit's open submission and testing windows).
      - Facility Northgate Imaging Center (CT) is ENROLLED, accreditation_currency PROVISIONAL, payer_participation_status ACTIVE, registry_credit_cents 500000.
