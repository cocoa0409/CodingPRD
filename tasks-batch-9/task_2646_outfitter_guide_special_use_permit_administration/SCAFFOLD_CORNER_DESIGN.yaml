      # ---- corners already owned by the depth probe (§1.8) ----
      - name: the_higher_priority_error_wins_when_two_rules_are_violated
        claim_type: priority_ordering
        grounds:
          - validations
          - errors
        excluded_because:
          difficulty_instance: missing_permit_beats_ownership_violation
          rationale: |
            The §1.8 instance fires a request that violates the priority-4 not-found rule and the
            priority-2 ownership rule at once and pins the 404 over the 403, and three sibling §1.8
            instances do the same for tiers 7-vs-12, 8-vs-11 and 10-vs-12. The generic ordering claim
            has no room left.

      - name: two_rules_in_different_tiers_return_the_lower_numbered_tier
        claim_type: priority_conflict
        grounds:
          - validations
        excluded_because:
          difficulty_instance: suspended_permit_beats_service_day_overage
          rationale: |
            The §1.8 instance files a use report against a SUSPENDED permit that would also blow the
            season day cap and asserts ERR_PERMIT_NOT_OPERATIONAL, exactly the pinned priority-7-over-12
            outcome in §1.4. outside_season_window_beats_deduction_cap and
            expired_first_aid_beats_full_guide_roster cover the other two pinned conflicts.

      - name: validity_depends_on_a_second_entitys_state
        claim_type: cross_entity_validation
        grounds:
          - validations[ERR_NEEDS_ASSESSMENT_NOT_PUBLISHED]
          - validations[ERR_OPERATING_PLAN_NOT_APPROVED]
          - validations[ERR_GUIDE_NOT_QUALIFIED]
          - validations[ERR_USE_REPORTS_PENDING]
        excluded_because:
          difficulty_instance: application_screening_gated_by_needs_assessment_publication
          rationale: |
            Four §1.8 instances are built exactly on cross-entity gates and each walks the guarding
            entity through every state: the assessment gate on screening, the plan gate on activation,
            the guide-status gate on authorization and the sibling-report gate on finalization.

      - name: interval_rules_are_probed_at_their_endpoints
        claim_type: temporal_validation
        grounds:
          - validations[ERR_REPORTING_PERIOD_OVERLAP]
          - validations[ERR_PERMIT_TERM_CONFLICT]
          - validations[ERR_INSURANCE_COVERAGE_GAP]
        excluded_because:
          difficulty_instance: use_report_half_open_period_adjacency
          rationale: |
            The §1.8 temporal trio already probes the half-open reporting interval at shared endpoints,
            the 14-clear-day permit-term buffer at 13, 14 and 15 days, and the closed insurance interval
            at a one-day hole and a same-day handover. Nothing about interval arithmetic is left
            untested.

  # ===========================================================================
  # §1.5 API Endpoints  (74 endpoints: 2 test-driving, 24 reads, 48 writes;
  # no bulk endpoint is declared, so the bulk-action row has no instance)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: application_listing_combines_filter_sort_and_offset_pagination
        claim_type: standard_crud
        grounds:
          - endpoints.GET /osup/permit-applications
          - endpoints.GET /osup/permit-applications/{id}
          - api_conventions.pagination_defaults
        distinguishing_aspect: |
          The list endpoint is declared created_at ASC — the OPPOSITE of the use-area listing's
          newest-first order — so a shared "order by created_at DESC" helper breaks here. total_count
          must describe the FILTERED population rather than the page or the table, has_more must be
          computed from limit + offset against that filtered count, and the declared limit bounds
          (min 1, max 100) are validated rather than clamped.
        test_recipe:
          setup:
            - "four applications created in a known order on BRW-01 for Alpine: 10, 20, 30 and 40 days"
            - "the first two are submitted, so the pool splits 2 SUBMITTED / 2 DRAFT"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 10, proposed_activity_type: "FISHING", narrative: "First." }
              as: PermitSpecialist
              captures: { app_1: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 20, proposed_activity_type: "FISHING", narrative: "Second." }
              as: PermitSpecialist
              captures: { app_2: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 30, proposed_activity_type: "FISHING", narrative: "Third." }
              as: PermitSpecialist
              captures: { app_3: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 40, proposed_activity_type: "FISHING", narrative: "Fourth." }
              as: PermitSpecialist
              captures: { app_4: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_1}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_2}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
          trigger:
            - call: "GET /osup/permit-applications"
              payload: { limit: 2, offset: 0 }
              as: PermitSpecialist
            - call: "GET /osup/permit-applications"
              payload: { limit: 2, offset: 2 }
              as: PermitSpecialist
            - call: "GET /osup/permit-applications"
              payload: { status: "SUBMITTED" }
              as: PermitSpecialist
            - call: "GET /osup/permit-applications"
              payload: { status: "DRAFT", limit: 1 }
              as: PermitSpecialist
            - call: "GET /osup/permit-applications"
              payload: { use_area_id: "${ua_id}", season_year: 2028 }
              as: PermitSpecialist
            - call: "GET /osup/permit-applications"
              payload: { limit: 0 }
              as: PermitSpecialist
            - call: "GET /osup/permit-applications"
              payload: { limit: 101 }
              as: PermitSpecialist
            - call: "GET /osup/permit-applications/${app_3}"
              payload: {}
              as: PermitSpecialist
          assert:
            - "limit 2 / offset 0 returns data [${app_1}, ${app_2}] in created_at ASC order with total_count 4 and has_more true"
            - "limit 2 / offset 2 returns [${app_3}, ${app_4}] with total_count 4 and has_more false — the second page completes the pool exactly"
            - "status SUBMITTED returns total_count 2 and [${app_1}, ${app_2}]: total_count counts the FILTERED population, not all four rows, and the default limit 10 leaves has_more false"
            - "status DRAFT with limit 1 returns total_count 2, data [${app_3}] and has_more true — filter and page interact, and the filtered order is still created_at ASC"
            - "use_area_id plus season_year 2028 returns total_count 0, data [] and has_more false rather than an error"
            - "limit 0 and limit 101 each return HTTP 400 ERR_INVALID_REQUEST against the declared bounds min 1 / max 100 — an out-of-range limit is rejected, never silently clamped"
            - "GET /osup/permit-applications/${app_3} returns requested_service_days 30, status DRAFT and the same field values the listing showed"

      - name: qualify_is_an_action_endpoint_with_an_empty_body_and_two_safety_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /osup/guides/{id}/qualify
          - state_machines.Guide.transitions[PENDING_QUALIFICATION->QUALIFIED]
          - validations[ERR_FIRST_AID_CERT_MISSING]
          - validations[ERR_FIRST_AID_CERT_EXPIRED]
          - calculations.guide_client_capacity
        distinguishing_aspect: |
          One empty-bodied action over five guides that differ only in their certification inputs: the
          expiry comparison is INCLUSIVE, so a certificate expiring on the logical-clock date still
          qualifies, while one that expired yesterday does not; a NONE certificate fails on the missing
          rather than the expired rule; and a TRAINEE qualifies successfully even though the transition
          leaves base_client_capacity at 0, because the level rule guards authorization, not
          qualification. A re-certification repairs the expired guide and the same request then passes.
        test_recipe:
          setup:
            - "the logical clock is 2027-01-05 and Alpine has five guides in PENDING_QUALIFICATION"
            - "Rita LEAD/WFR/2030-06-30/7 seasons; Nate LEAD/NONE/2030-06-30; Ida ASSISTANT/WFR/2026-12-31 (expired); Tom TRAINEE/WFR/2030-06-30; Ivy ASSISTANT/BASIC_FIRST_AID/2027-01-05 (expires today)/6 seasons"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/outfitters/${oa_id}/guides"
              payload: { full_name: "Rita Long", qualification_level: "LEAD", first_aid_cert_type: "WFR", first_aid_expires_on: "2030-06-30", seasons_experience: 7 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { g_rita: "$.data.id" }
            - call: "POST /osup/outfitters/${oa_id}/guides"
              payload: { full_name: "Nate Poe", qualification_level: "LEAD", first_aid_cert_type: "NONE", first_aid_expires_on: "2030-06-30", seasons_experience: 5 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { g_nate: "$.data.id" }
            - call: "POST /osup/outfitters/${oa_id}/guides"
              payload: { full_name: "Ida Vane", qualification_level: "ASSISTANT", first_aid_cert_type: "WFR", first_aid_expires_on: "2026-12-31" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { g_ida: "$.data.id" }
            - call: "POST /osup/outfitters/${oa_id}/guides"
              payload: { full_name: "Tom Ash", qualification_level: "TRAINEE", first_aid_cert_type: "WFR", first_aid_expires_on: "2030-06-30", seasons_experience: 1 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { g_tom: "$.data.id" }
            - call: "POST /osup/outfitters/${oa_id}/guides"
              payload: { full_name: "Ivy Cole", qualification_level: "ASSISTANT", first_aid_cert_type: "BASIC_FIRST_AID", first_aid_expires_on: "2027-01-05", seasons_experience: 6 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { g_ivy: "$.data.id" }
          trigger:
            - call: "POST /osup/guides/${g_rita}/qualify"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/guides/${g_nate}/qualify"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/guides/${g_ida}/qualify"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/guides/${g_ida}/certifications"
              payload: { first_aid_cert_type: "WFR", first_aid_expires_on: "2030-06-30" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/guides/${g_ida}/qualify"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/guides/${g_tom}/qualify"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/guides/${g_ivy}/qualify"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/outfitters/${oa_id}/guides"
              payload: { status: "QUALIFIED" }
              as: PermitSpecialist
          assert:
            - "Rita qualifies with an empty body: status QUALIFIED, qualified_at stamped, base_client_capacity 10 (min(8, 8) + min(2, floor(7/3)) = 8 + 2)"
            - "Nate returns HTTP 422 ERR_FIRST_AID_CERT_MISSING — first_aid_cert_type NONE fails the missing rule, which is pinned ahead of the expiry rule, even though his expiry date is years away"
            - "Ida returns HTTP 422 ERR_FIRST_AID_CERT_EXPIRED (2026-12-31 is strictly before 2027-01-05) and stays PENDING_QUALIFICATION"
            - "after re-certification the identical qualify request succeeds: Ida is QUALIFIED with base_client_capacity 4 (min(4, 8) + min(2, floor(0/3)) = 4 + 0, seasons_experience defaulted to 0)"
            - "Tom qualifies successfully — the TRAINEE level does not block QUALIFICATION — but base_client_capacity is 0 on the categorical short-circuit"
            - "Ivy qualifies with a certificate expiring EXACTLY on the clock date (inclusive boundary) and base_client_capacity 6 (min(4, 4) + min(2, floor(6/3)) = 4 + 2)"
            - "the QUALIFIED listing returns total_count 4 (Rita, Ida, Tom, Ivy); Nate is still PENDING_QUALIFICATION"

      - name: authorization_link_validates_both_endpoints_of_the_reference_and_is_readable_from_each_side
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST /osup/permits/{id}/guide-authorizations
          - endpoints.GET /osup/permits/{id}/guide-authorizations
          - endpoints.GET /osup/guides/{id}/guide-authorizations
          - validations[ERR_GUIDE_LEVEL_INELIGIBLE]
          - validations[ERR_GUIDE_NOT_QUALIFIED]
          - validations[ERR_GUIDE_TERM_CONFLICT]
        distinguishing_aspect: |
          The join row is reachable from BOTH parents, so the same row must appear in the permit-side
          and the guide-side listing after a single write. Each end of the reference is validated
          independently (unknown permit -> 404 on the path id, unknown guide -> 404 on the body id),
          and three different guide-side rules reject a link that would otherwise be well-formed —
          including a QUALIFIED TRAINEE, where the pinned intra-tier order makes the level error win
          over the not-qualified error rather than the other way round.
        test_recipe:
          setup:
            - "an ISSUED permit for Alpine on BRW-01 whose season closes 2027-09-30"
            - "Rita LEAD/WFR/2030-06-30/7 seasons QUALIFIED; Tom TRAINEE/WFR/2030-06-30 QUALIFIED; Pat ASSISTANT/WFR/2030-06-30 still PENDING_QUALIFICATION; Xen LEAD/WFR/2027-06-30/7 seasons QUALIFIED"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
