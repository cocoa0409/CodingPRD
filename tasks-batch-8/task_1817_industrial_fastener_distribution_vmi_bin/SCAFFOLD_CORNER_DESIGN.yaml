              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_STOCK (http 422)"
            - "Part.${part_id}.reserved_qty == 0 and available_qty == 8 (no partial reservation)"
            - "KitJob.${kit_id}.status == DRAFT"

      - name: credit_limit_boundary_exactly_at_limit_allowed
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_CREDIT_LIMIT_EXCEEDED]"
        distinguishing_aspect: "Fiscal boundary uses <= : confirm succeeds when outstanding + total == credit_limit exactly, and fails with ERR_CREDIT_LIMIT_EXCEEDED only when strictly over."
        test_recipe:
          setup:
            - "Site S credit_limit 95000; part P unit 1000; agreement min 10 max 100; scan at 5 -> DRAFT order qty 95 total 95000"
            - "Second agreement min 10 max 101; scan at 5 -> DRAFT order qty 96 total 96000 (over limit)"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "CL-1", credit_limit_cents: 95000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
