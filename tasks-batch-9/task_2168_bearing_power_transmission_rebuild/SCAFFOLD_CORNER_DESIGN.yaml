          assert:
            - "the single-bench read has response_type == 'object' and meta.api_request_id starting with 'req_'"
            - "the reservations read has response_type == 'array' and carries limit, offset, total_count and has_more"
            - "the missing-bench read is HTTP 404 with response_type == 'error' and data.error_id == ERR_BENCH_NOT_FOUND and a non-empty data.message"
            - "Bench.${bench_id}.cleanroom == true and parallel_slots == 2"

