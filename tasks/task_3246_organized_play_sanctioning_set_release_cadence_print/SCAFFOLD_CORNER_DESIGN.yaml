  # ===========================================================================
  # Stubs — corners §1.8 already exercises
  # ===========================================================================
  - section: state_machines
    instances:

      - name: event_application_approval_gated_by_release_state
        claim_type: Valid Transition
        grounds:
          - state_machines.EventApplication.status.SUBMITTED_to_APPROVED
          - state_machines.SetRelease.status.PRERELEASE_to_RELEASED
        excluded_because:
          difficulty_instance: release_must_reach_released_before_application_can_be_approved
          rationale: "The §1.8 cross_entity_state_dependency instance asserts both the refusal while PRERELEASE and the success after settlement."

      - name: distribution_pass_gated_by_owning_store_state
        claim_type: Valid Transition
        grounds:
          - state_machines.PrizeDistribution.status.PROPOSED_to_PASSED
          - state_machines.Store.status.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: store_must_be_active_before_distributions_can_pass
          rationale: "Covered as the blocked path of the second §1.8 cross_entity_state_dependency instance."

      - name: store_suspension_voids_distributions_end_to_end
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Store.status.ACTIVE_to_SUSPENDED
          - state_machines.PrizeDistribution.status.PASSED_to_VOIDED
        excluded_because:
          difficulty_instance: store_suspension_four_hop_cascade
          rationale: "The §1.8 transitive_cascade instance asserts every hop of the suspension cascade, including the void and the restored quantity."

      - name: ban_list_update_denies_approved_applications
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Format.current_epoch.EPOCH_N_to_EPOCH_N
          - state_machines.EventApplication.status.APPROVED_to_DENIED
        excluded_because:
          difficulty_instance: ban_list_denial_three_hop_cascade
          rationale: "Asserted hop by hop by the second §1.8 transitive_cascade instance."

      - name: event_application_prizing_and_reporting_dimensions_move_independently
        claim_type: Parallel dimensions
        grounds:
          - state_machines.EventApplication.status.SUBMITTED_to_APPROVED
          - state_machines.EventApplication.prizing_report_status.NOT_DUE_to_DUE
        excluded_because:
          difficulty_instance: event_application_parallel_status_and_prizing_dimensions_revert
          rationale: "The §1.8 non_linear_state_machine instance cycles the prizing axis while holding the reporting axis fixed."

      - name: physical_grant_axis_moves_independently_of_redemption_lifecycle
        claim_type: Parallel dimensions
        grounds:
          - state_machines.CodeRedemption.status.AVAILABLE_to_REDEEMED
          - state_machines.CodeRedemption.physical_grant_status.RESERVED_to_DISBURSED
        excluded_because:
          difficulty_instance: code_redemption_parallel_lifecycle_and_grant_dimensions
          rationale: "The second §1.8 non_linear_state_machine instance pins both axes by observing them in disagreement."

      - name: distribution_state_transitions_at_allocation_lifecycle_edges
        claim_type: Guarded transitions
        grounds:
          - state_machines.PrizeAllocation.status.OPEN_to_CLOSED
          - state_machines.PrizeAllocation.status.OPEN_to_RELEASED
        excluded_because:
          difficulty_instance: released_allocation_outranks_insufficient_pool
          rationale: "The §1.8 priority_pair_validation_conflict instance reaches the allocation lifecycle edge from the PASS side and asserts the resulting state error."

  - section: calculations
    instances:

      - name: bundled_and_unbundled_pod_pools_diverge_on_identical_inputs
        claim_type: Variant Divergence
        grounds:
          - calculations.tier_prize_support_pool
        excluded_because:
          difficulty_instance: bundled_vs_unbundled_pod_pool_diverges
          rationale: "The §1.8 dual_variant_calc instance pins base_tp 48 versus 64 for identical inputs."

      - name: reprint_addendum_and_suppressed_ceiling_diverge_on_identical_inputs
        claim_type: Variant Divergence
        grounds:
          - calculations.reprint_policy_verdict
        excluded_because:
          difficulty_instance: reprint_verdict_addendum_vs_suppressed_ceiling
          rationale: "The second §1.8 dual_variant_calc instance pins REPRINT_DENIED versus REPRINT_ALLOWED at index 42."

