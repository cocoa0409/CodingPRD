  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: lease_revision_cycle_bounded_at_two_rounds
        grounds:
          - state_machines.Lease
          - entities.Lease.fields.revision_round
          - endpoints[POST /leases/{id}/compliance-decisions]
          - validations[17]
          - errors.ERR_REVISION_LIMIT_EXCEEDED
        distinguishing_aspect: |
          CYCLE dimension on the Lease machine — PENDING_FMV_REVIEW →
          RETURNED_FOR_REVISION → PENDING_FMV_REVIEW is traversable exactly twice;
          the third RETURN_FOR_REVISION is rejected with 409
          ERR_REVISION_LIMIT_EXCEEDED and the lease is left sitting in
          PENDING_FMV_REVIEW with revision_round frozen at 2, so the loop bound is
          observable only by walking the cycle to exhaustion.
        test_recipe:
          setup:
            - "One Building with a 5000 sf STANDARD_EXAM suite and one non-physician-owned INDEPENDENT_PRACTICE tenant."
            - "One DIRECT lease at 30.00 psf submitted to PENDING_FMV_REVIEW with revision_round 0."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b6_id: $.data.id }
            - call: "POST /buildings/${b6_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s6_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234567911" }
              as: PortfolioAdmin
              captures: { t6_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b6_id}", suite_id: "${s6_id}", tenant_id: "${t6_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { l6_id: $.data.id }
            - call: "POST /leases/${l6_id}/submit-fmv-review"
              payload: { submission_note: "First pass" }
              as: LeasingAgent
              as_user_id: "agent-001"
          trigger:
            - call: "POST /leases/${l6_id}/compliance-decisions"
              payload: { action: "RETURN_FOR_REVISION", decision_note: "Attach the CAM reconciliation exhibit" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /leases/${l6_id}/submit-fmv-review"
              payload: { submission_note: "Exhibit attached" }
              as: LeasingAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${l6_id}/compliance-decisions"
              payload: { action: "RETURN_FOR_REVISION", decision_note: "Exhibit references the wrong suite" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /leases/${l6_id}/submit-fmv-review"
              payload: { submission_note: "Suite reference corrected" }
              as: LeasingAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${l6_id}/compliance-decisions"
              payload: { action: "RETURN_FOR_REVISION", decision_note: "Third bite at the apple" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
          assert:
            - "The first RETURN_FOR_REVISION returns 200 with status RETURNED_FOR_REVISION and revision_round 1"
            - "The second submit-fmv-review returns 200 with status PENDING_FMV_REVIEW and revision_round 1"
            - "The second RETURN_FOR_REVISION returns 200 with status RETURNED_FOR_REVISION and revision_round 2"
            - "The third submit-fmv-review returns 200 with status PENDING_FMV_REVIEW and revision_round 2"
            - "The third RETURN_FOR_REVISION returns 409 ERR_REVISION_LIMIT_EXCEEDED"
            - "Lease.${l6_id}.status == PENDING_FMV_REVIEW"
            - "Lease.${l6_id}.revision_round == 2"

      - name: ti_project_fork_join_permits_only_after_both_reviews_approved
        grounds:
          - state_machines.TenantImprovementProject
          - entities.TenantImprovementProject.fields.shielding_review_status
          - entities.TenantImprovementProject.fields.utility_review_status
          - entities.Suite.fields.shielding_certified
          - entities.Suite.fields.power_amps_available
          - endpoints[POST /ti-projects/{id}/reviews]
        distinguishing_aspect: |
          FORK-JOIN dimension on a different entity with disjoint side-effect
          sets — the SHIELDING branch alone stamps Suite.shielding_certified true
          and lead_thickness_mm while leaving power_amps_available at 200, and only
          the later UTILITY approval deducts the 150 requested amps to leave 50;
          the join to PERMITTED fires on the second approval, so the branch that
          moved the amps and the branch that moved the shielding flag can never be
          confused.
        test_recipe:
          setup:
            - "One Building with a 5000 sf STANDARD_EXAM suite rated 200 amps and shielding_certified false."
            - "One non-physician-owned INDEPENDENT_PRACTICE tenant with a DRAFT DIRECT lease at 30.00 psf."
            - "One TenantImprovementProject targeting IMAGING with lead_thickness_mm 2.5, power_amps_requested 150, medical_gas_requested false, allowance 500000.00 and landlord_share_pct 0.60, moved to IN_REVIEW."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b7_id: $.data.id }
            - call: "POST /buildings/${b7_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s7_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234567911" }
              as: PortfolioAdmin
              captures: { t7_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b7_id}", suite_id: "${s7_id}", tenant_id: "${t7_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { l7_id: $.data.id }
            - call: "POST /leases/${l7_id}/ti-projects"
              payload: { suite_id: "${s7_id}", target_suite_class: "IMAGING", lead_thickness_mm: 2.5, power_amps_requested: 150, medical_gas_requested: false, authorized_allowance_total: 500000.00, landlord_share_pct: 0.60 }
              as: LeasingAgent
              captures: { tp7_id: $.data.id, tp7_v1: $.data.version }
            - call: "POST /ti-projects/${tp7_id}/line-items"
              payload: { expected_ti_project_version: "${tp7_v1}", description: "Lead shielding, walls and ceiling", category: "SHIELDING", cost_amount: 88000.00 }
              as: LeasingAgent
            - call: "POST /ti-projects/${tp7_id}/transitions"
              payload: { action: "SUBMIT_REVIEWS", note: "Shielding and utility packages issued" }
              as: LeasingAgent
          trigger:
            - call: "POST /ti-projects/${tp7_id}/reviews"
              payload: { review_type: "SHIELDING", decision: "APPROVE", lead_thickness_verified_mm: 2.5, review_note: "Physicist sign-off on file" }
              as: FacilitiesEngineer
            - call: "GET /suites/${s7_id}"
              payload: {}
              as: FacilitiesEngineer
            - call: "POST /ti-projects/${tp7_id}/reviews"
              payload: { review_type: "UTILITY", decision: "APPROVE", review_note: "Feeder capacity confirmed" }
              as: FacilitiesEngineer
            - call: "GET /suites/${s7_id}"
              payload: {}
              as: FacilitiesEngineer
          assert:
            - "After SUBMIT_REVIEWS, TenantImprovementProject.${tp7_id}.status == IN_REVIEW with shielding_review_status PENDING and utility_review_status PENDING"
            - "After the SHIELDING approval, TenantImprovementProject.${tp7_id}.status is still IN_REVIEW with shielding_review_status APPROVED and utility_review_status PENDING"
            - "After the SHIELDING approval, Suite.${s7_id}.shielding_certified == true and lead_thickness_mm == 2.5"
            - "After the SHIELDING approval, Suite.${s7_id}.power_amps_available == 200 (untouched by the shielding branch)"
            - "After the UTILITY approval, TenantImprovementProject.${tp7_id}.status == PERMITTED with utility_review_status APPROVED"
            - "After the UTILITY approval, Suite.${s7_id}.power_amps_available == 50"
            - "After the UTILITY approval, Suite.${s7_id}.suite_class == STANDARD_EXAM (reclassification waits for completion)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: lease_termination_cascades_through_building_posture_to_peer_lease_and_ti_hold
        grounds:
          - state_machines.Lease[ACTIVE -> TERMINATED]
          - calculations.building_tenant_mix
          - entities.Building.fields.tenant_mix_posture
          - entities.Lease.fields.status
          - entities.TenantImprovementProject.fields.on_hold_from_status
        distinguishing_aspect: |
          DEPTH 4, rooted at POST /leases/{id}/terminate — and each hop is caused
          by the hop before it, not by a fan-out from the root: the termination
          vacates the suite (hop 1); only because that suite left the counted set
          does anchor_share_pct move from 0.7059 to 1.0000 and the posture to
          RESTRICTED (hop 2); only because the posture became RESTRICTED does an
          unrelated DRAFT lease held by a health-system-affiliated cardiology
          tenant flip to SUSPENDED_MIX_REVIEW (hop 3); and only because that peer
          lease was suspended does its DESIGN tenant-improvement project record
          on_hold_from_status DESIGN and move to ON_HOLD (hop 4). The terminated
          lease and the suspended lease share no tenant, no suite and no project.
        test_recipe:
          setup:
            - "One 100000 sf Building at 30.00 psf market with three suites: 12000 sf STANDARD_EXAM, 5000 sf STANDARD_EXAM, 4000 sf PROCEDURE."
            - "An anchor lease on the 12000 sf suite for a HEALTH_SYSTEM_ANCHOR tenant, executed FIRST while the posture is still BALANCED, at 28.00 psf."
            - "An independent lease on the 5000 sf suite for an INDEPENDENT_PRACTICE tenant at 30.00 psf, executed second (priority 25 does not apply to independents) and commenced on 2026-09-01 so the building reads anchor_share_pct 0.7059 / ANCHOR_CONCENTRATED."
            - "A DRAFT lease on the 4000 sf PROCEDURE suite for a HEALTH_SYSTEM_AFFILIATED cardiology tenant at 34.25 psf, carrying one TenantImprovementProject in status DESIGN."
            - "No rent invoices exist on the independent lease, so priority 39 does not block a MUTUAL termination."
