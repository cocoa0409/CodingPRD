            - "error_id == ERR_COUNTERFEIT_RISK_TOO_HIGH, http_status == 422; source stays PROVISIONAL"

      - name: serial_ship_blocked_by_open_ncr
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SERIAL_UNDER_NCR]", "state_machines.SerialNumber.CREATED_to_SHIPPED"]
        distinguishing_aspect: "Containment integrity: a serial listed on an OPEN NCR cannot ship even though its WO is COMPLETED."
        test_recipe:
          setup: ["LTA ACTIVE; PO qty 2 RELEASED; WO qty 2 COMPLETED; serials CREATED; NCR OPEN listing SN-0001"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-SU", part_number: "P134", part_revision: "A", quantity: 2, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 2, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-SU", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-SU", material_spec: "AMS 5643", quantity_received: 5 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 2 }, as: ManufacturingPlanner, captures: { s1: $.data.0.id, s2: $.data.1.id } }
            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/work-orders/${wo_id}/accept", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1" }
            - { call: "POST /api/ncrs", payload: { wo_id: "${wo_id}", defect_code: "MARKING", description: "wrong marking on SN-0001", quantity_affected: 1, affected_serial_ids: ["${s1}"], detected_post_shipment: false }, as: QualityInspector, as_user_id: "insp-1", captures: { ncr_id: $.data.id } }
          trigger:
            - { call: "POST /api/serials/${s1}/ship", payload: {}, as: ManufacturingPlanner, captures: { err: $.data.error_id } }
            - { call: "POST /api/serials/${s2}/ship", payload: {}, as: ManufacturingPlanner, captures: { s2_st: $.data.status } }
          assert:
            - "SN-0001 (on OPEN NCR): ship fails, error_id == ERR_SERIAL_UNDER_NCR, http_status == 422"
            - "SN-0002 (not listed): ship succeeds, status == SHIPPED"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: cert_accept_twice_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CERT_NOT_ACCEPTABLE]", "state_machines.MaterialCert.RECEIVED_to_ACCEPTED"]
        distinguishing_aspect: "Accepting an already-ACCEPTED cert fails with ERR_CERT_NOT_ACCEPTABLE (idempotency of the accept action)."
        test_recipe:
          setup: ["APPROVED RAW_MATERIAL source; cert H-2X ACCEPTED"]
          setup_api_calls:
            - { call: "POST /api/sources", payload: { supplier_code: "S-2X", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-2X", material_spec: "AMS 5643", quantity_received: 5 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CERT_NOT_ACCEPTABLE, http_status == 409"

      - name: cert_revoke_twice_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CERT_ALREADY_REVOKED]", "state_machines.MaterialCert.ACCEPTED_to_REVOKED"]
        distinguishing_aspect: "Revoking an already-REVOKED cert fails with ERR_CERT_ALREADY_REVOKED (terminal lockdown)."
        test_recipe:
          setup: ["APPROVED RAW_MATERIAL source; cert H-2R ACCEPTED then REVOKED"]
          setup_api_calls:
            - { call: "POST /api/sources", payload: { supplier_code: "S-2R", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-2R", material_spec: "AMS 5643", quantity_received: 5 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/material-certs/${cert_id}/revoke", payload: { reason: "suspect" }, as: QualityManager }
          trigger:
            - { call: "POST /api/material-certs/${cert_id}/revoke", payload: { reason: "again" }, as: QualityManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CERT_ALREADY_REVOKED, http_status == 409"

      - name: err_material_cert_revoked_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_MATERIAL_CERT_REVOKED]"]
        excluded_because:
          difficulty_instance: serial_create_safety_beats_fiscal
          rationale: "ERR_MATERIAL_CERT_REVOKED is the asserted failure of the named §1.8 instance."

      - name: err_fai_required_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_FAI_REQUIRED]"]
        excluded_because:
          difficulty_instance: wo_release_requires_fai_approved
          rationale: "ERR_FAI_REQUIRED is the asserted failure path of the named §1.8 instance."

      - name: err_stale_lta_version_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_LTA_VERSION]"]
        excluded_because:
          difficulty_instance: lta_ceiling_conservation
          rationale: "OCC stale-version rejection is exercised by cross_cutting_layers instances occ_po_create_stale_version and occ_amend_stale_version below; §1.8 invariant instances drive the version bumps they rely on."

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: lta_create_forbidden_for_mrb_member
        claim_type: rbac_denial
        grounds: ["roles[ContractsManager]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "MRBMember has no commercial authority: POST /api/ltas is ContractsManager-exclusive."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 1000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: MRBMember, as_user_id: "mrb-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS, http_status == 403"

      - name: fai_approve_forbidden_for_inspector
        claim_type: rbac_denial
        grounds: ["roles[CustomerQualityRep]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "FAI approval is customer-side: QualityInspector cannot approve even a well-formed SUBMITTED FAI."
        test_recipe:
          setup: ["FAI SUBMITTED (all PASS)"]
          setup_api_calls:
            - { call: "POST /api/first-articles", payload: { part_number: "P135", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1 }, as: QualityInspector, as_user_id: "insp-1", captures: { c1: $.data.id } }
            - { call: "POST /api/characteristics/${c1}/record-measurement", payload: { measured_value: 10.0 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/first-articles/${fai_id}/submit", payload: {}, as: QualityInspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /api/first-articles/${fai_id}/approve", payload: {}, as: QualityInspector, as_user_id: "insp-3", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS, http_status == 403 (role gate fires before any state check would matter)"

      - name: clock_set_forbidden_for_quality_manager
        claim_type: rbac_denial
        grounds: ["roles[SystemAdmin]", "endpoints[POST /api/_clock/set_current_utc]"]
        distinguishing_aspect: "The logical clock test-driving endpoint is SystemAdmin-exclusive."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: QualityManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS, http_status == 403; clock remains 2026-08-01T00:00:00Z"

      - name: delegation_grant_forbidden_for_supply_chain
        claim_type: rbac_denial
        grounds: ["roles[CustomerQualityRep]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Only the CustomerQualityRep may grant delegated inspection authority; SupplyChainManager is denied."
        test_recipe:
          setup: ["LTA ACTIVE; PO RELEASED"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-RB", part_number: "P136", part_revision: "A", quantity: 1, flowdown_clauses: ["DELEGATED_INSPECTION_PERMITTED"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
          trigger:
            - { call: "POST /api/delegations", payload: { po_id: "${po_id}", inspector_user_id: "insp-9", valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: SupplyChainManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS, http_status == 403"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_po_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[po-create-stale-lta]", "endpoints[POST /api/purchase-orders]"]
        distinguishing_aspect: "OCC on the LTA version: after PO-1 creation bumps LongTermAgreement.version, a second create still carrying the pre-bump expected_lta_version is rejected with 412."
        test_recipe:
          setup: ["LTA ACTIVE; client holds lta_v (version observed right after activation)"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
          trigger:
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-O1", part_number: "P137", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po1: $.data.id } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-O2", part_number: "P137", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { err: $.data.error_id } }
          assert:
            - "PO-O1 succeeds (expected_lta_version matched; LTA.version then incremented)"
            - "PO-O2 with the same stale expected_lta_version fails: error_id == ERR_STALE_LTA_VERSION, http_status == 412"

      - name: occ_amend_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lta-amend-stale-version]", "endpoints[POST /api/ltas/{ltaId}/amend]"]
        distinguishing_aspect: "OCC on amend: a second amendment still carrying the pre-amendment version is rejected with 412; the version increments by exactly 1 per successful amendment."
        test_recipe:
          setup: ["LTA ACTIVE; client holds lta_v"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
          trigger:
            - { call: "POST /api/ltas/${lta_id}/amend", payload: { expected_lta_version: "${lta_v}", pricing_tiers: [{min_qty: 1, unit_price_cents: 4800}] }, as: ContractsManager, captures: { v_after: $.data.version } }
            - { call: "POST /api/ltas/${lta_id}/amend", payload: { expected_lta_version: "${lta_v}", ceiling_cents: 90000000 }, as: ContractsManager, captures: { err: $.data.error_id } }
          assert:
            - "First amend succeeds: version == ${lta_v} + 1"
            - "Second amend with stale version fails: error_id == ERR_STALE_LTA_VERSION, http_status == 412"

      - name: po_price_pinned_after_lta_amend
        claim_type: version_pinning_on_approval
        grounds: ["entities.PurchaseOrder.fields.lta_version_pinned", "calculations.po_unit_price", "concurrency_rules[po-create-stale-lta]"]
        distinguishing_aspect: "Version-pinning: an existing PO keeps its pinned unit_price_cents (5000) after an LTA amendment cuts the tier price; a new PO prices at the amended 4500."
        test_recipe:
          setup: ["LTA ACTIVE; PO-1 (qty 10) created at tier price 5000 and pinned"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-VP1", part_number: "P138", part_revision: "A", quantity: 10, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po1: $.data.id, po1_up: $.data.unit_price_cents, po1_pin: $.data.lta_version_pinned } }
          trigger:
            - { call: "GET /api/ltas/${lta_id}", payload: {}, as: ContractsManager, captures: { lta_v2: $.data.version } }
            - { call: "POST /api/ltas/${lta_id}/amend", payload: { expected_lta_version: "${lta_v2}", pricing_tiers: [{min_qty: 1, unit_price_cents: 4500}, {min_qty: 100, unit_price_cents: 4000}] }, as: ContractsManager, captures: { lta_v3: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-VP2", part_number: "P138", part_revision: "A", quantity: 10, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v3}" }, as: ContractsManager, captures: { po2: $.data.id, po2_up: $.data.unit_price_cents, po2_pin: $.data.lta_version_pinned } }
            - { call: "GET /api/purchase-orders/${po1}", payload: {}, as: ContractsManager, captures: { po1_up_after: $.data.unit_price_cents } }
          assert:
            - "PO-1 unit_price_cents still == 5000 after the amendment (pinned at creation)"
            - "PO-2 unit_price_cents == 4500 (repriced_for_new_orders variant against the amended table)"
            - "po1.lta_version_pinned != po2.lta_version_pinned (different LTA versions pinned)"

      - name: ncr_post_shipment_spawns_escape_draft
        claim_type: cascading_side_effects
        grounds: ["endpoints[POST /api/ncrs]", "entities.EscapeReport.fields.due_at", "state_machines.EscapeReport.DRAFT_to_SUBMITTED"]
        distinguishing_aspect: "Side effect execution: an NCR with detected_post_shipment == true atomically spawns a DRAFT EscapeReport whose due_at equals NCR.created_at + 48h."
        test_recipe:
          setup: ["LTA ACTIVE; PO qty 1 RELEASED; WO qty 1 COMPLETED; serial SHIPPED (all at default clock 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-PS", part_number: "P139", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 1, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-PS", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-PS", material_spec: "AMS 5643", quantity_received: 5 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 1 }, as: ManufacturingPlanner, captures: { s1: $.data.0.id } }
            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/work-orders/${wo_id}/accept", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1" }
            - { call: "POST /api/serials/${s1}/ship", payload: {}, as: ManufacturingPlanner }
          trigger:
            - { call: "POST /api/ncrs", payload: { wo_id: "${wo_id}", defect_code: "FIELD_CRACK", description: "crack found in service", quantity_affected: 1, affected_serial_ids: ["${s1}"], detected_post_shipment: true }, as: QualityInspector, as_user_id: "insp-1", captures: { ncr_id: $.data.id, ncr_created: $.data.created_at } }
            - { call: "GET /api/escape-reports?ncr_id=${ncr_id}", payload: {}, as: QualityManager, captures: { er_id: $.data.0.id, er_st: $.data.0.status, er_due: $.data.0.due_at } }
          assert:
            - "Exactly one EscapeReport exists with ncr_id == ${ncr_id}"
            - "EscapeReport.${er_id}.status == DRAFT and due_at == NCR.created_at + 48 hours (2026-08-03T00:00:00Z given the default clock)"

      - name: spc_incapable_cascade_corner
        claim_type: cascading_side_effects
        grounds: ["endpoints[POST /api/work-orders/{woId}/spc-measurements]"]
        excluded_because:
          difficulty_instance: material_revoke_counterfeit_cascade
          rationale: "Cascade chains are covered by §1.8 rule 4 instances; the SPC auto-NCR cascade itself is asserted by the calculations corner cpk_incapable_auto_ncr_and_flags."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: po_create_response_immediately_consistent
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "endpoints[POST /api/purchase-orders]"]
        distinguishing_aspect: "Immediate consistency: the 201 response already carries the computed pricing and debited aggregates; a simultaneous LTA read shows the debit without any reconciliation delay."
        test_recipe:
          setup: ["LTA ACTIVE with ceiling 100000000"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
          trigger:
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-IC", part_number: "P140", part_revision: "A", quantity: 100, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id, up: $.data.unit_price_cents, tot: $.data.total_cents } }
            - { call: "GET /api/ltas/${lta_id}", payload: {}, as: ContractsManager, captures: { rem: $.data.remaining_ceiling_cents } }
          assert:
            - "Create response already has unit_price_cents == 4500 and total_cents == 450000 (no re-fetch needed)"
            - "Immediate LTA read shows remaining_ceiling_cents == 99550000 (debit visible in the same request sequence)"
