              payload: { product_id: "${prod_id}", presented_quantity: 10, expected_visit_version: "${visit_a_v1}" }
              as: ProgramAdmin
            - call: "POST /redemption-visits"
              payload: { site_type: "CENTER", channel: "MACHINE_COUNT", center_id: "${center_b}", machine_id: "${mach_b}" }
              as: ProgramAdmin
              captures: { visit_b: $.data.id, visit_b_v1: $.data.version }
            - call: "POST /redemption-visits/${visit_b}/lots"
              payload: { product_id: "${prod_id}", presented_quantity: 10, expected_visit_version: "${visit_b_v1}" }
              as: ProgramAdmin
            - call: "POST /reverse-vending-machines/${mach_b}/machine-events"
              payload: { event_type: "SESSION_OPEN", visit_id: "${visit_b}" }
              as: ProgramAdmin
            - call: "POST /reverse-vending-machines/${mach_b}/machine-events"
              payload: { event_type: "JAM_REPORTED", visit_id: "${visit_a}" }
              as: ProgramAdmin
              captures: { e_event: $.data.error_id }
          assert:
            - "the first trigger has status 422 and $.data.error_id == ERR_MACHINE_CENTER_MISMATCH and no visit row is created"
            - "the sixth trigger has status 200 with ReverseVendingMachine.${mach_b}.status == COUNTING and open_session_count == 1"
            - "the seventh trigger has status 422 and $.data.error_id == ERR_MACHINE_CENTER_MISMATCH"
            - "after the seventh trigger ReverseVendingMachine.${mach_b}.status is still COUNTING with jam_count_today 0, and RedemptionVisit.${visit_a}.count_status is still COUNTING with requires_manual_recount false"

      - name: payout_cannot_exceed_the_cash_in_the_drawer
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_INSUFFICIENT_CASH_DRAWER]
          - validations[priority=37]
          - state_machines.RedemptionVisit.APPROVED_to_PAID
        distinguishing_aspect: "A centre opened with only 100 cents in the drawer approves a 1000-cent payout and then fails at PAY, leaving the visit APPROVED and the drawer, the ledger and the period liability untouched."
        test_recipe:
          setup:
            - "OPEN period 2026Q3; OPERATIONAL center whose opening_cash_cents is 100; REGISTERED PET label with a 300-container deposit initiation; one anonymous machine-count visit of 100 containers, closed and APPROVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /program-periods"
              payload: { quarter_code: "2026Q3", start_date: "2026-07-01", end_date: "2026-09-30", operating_cost_cents: 0 }
              as: ProgramAdmin
              captures: { period_id: $.data.id }
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Spring", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 500, upc: "011110000001", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "SUBMIT" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /distributors/${dist_id}/deposit-initiations"
              payload: { product_id: "${prod_id}", container_count: 300, period_id: "${period_id}" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /redemption-centers"
              payload: { site_name: "Thin Drawer Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], accepts_all_materials: true, opening_cash_cents: 100 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
              captures: { mach_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /redemption-visits"
              payload: { site_type: "CENTER", channel: "MACHINE_COUNT", center_id: "${center_id}", machine_id: "${mach_id}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { visit_id: $.data.id, visit_v1: $.data.version }
            - call: "POST /redemption-visits/${visit_id}/lots"
              payload: { product_id: "${prod_id}", presented_quantity: 100, expected_visit_version: "${visit_v1}" }
              as: CenterOperator
              as_user_id: "${center_id}"
            - call: "POST /redemption-visits/${visit_id}/close-count"
              payload: {}
              as: CenterOperator
              as_user_id: "${center_id}"
            - call: "POST /redemption-visits/${visit_id}/payout-actions"
              payload: { action: "APPROVE" }
              as: CenterOperator
              as_user_id: "${center_id}"
          trigger:
            - call: "POST /redemption-visits/${visit_id}/payout-actions"
              payload: { action: "PAY" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { e_cash: $.data.error_id }
          assert:
            - "the trigger response has status 422 and $.data.error_id == ERR_INSUFFICIENT_CASH_DRAWER"
            - "RedemptionVisit.${visit_id}.payout_status == APPROVED, payout_cents == 1000 and paid_at == null"
            - "RedemptionCenter.${center_id}.cash_drawer_balance_cents == 100"
            - "GET /program-periods/${period_id}/ledger-entries reports total_count 1 — only the DEPOSIT_INITIATED row of 3000 cents"
            - "ProgramPeriod.${period_id}.redemptions_paid_cents == 0 and outstanding_liability_cents == 3000"

      - name: withdrawals_and_closure_respect_the_credit_balance
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_INSUFFICIENT_CREDIT_BALANCE]
          - errors[ERR_ACCOUNT_BALANCE_NONZERO]
          - validations[priority=38]
          - validations[priority=39]
        distinguishing_aspect: "600 cents cannot be taken from a 500-cent balance and the account cannot be closed while that balance stands; withdrawing exactly 500 satisfies both checks in one move."
        test_recipe:
          setup:
            - "One ACTIVE account whose balance is 500 cents from a manual grant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /redeemer-accounts"
              payload: { holder_name: "Dana Reyes", account_code: "ACCT-1001" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
            - call: "POST /redeemer-accounts/${acct_id}/credit-actions"
              payload: { action: "MANUAL_GRANT", amount_cents: 500, expected_account_version: "${acct_v1}" }
              as: ProgramAdmin
            - call: "GET /redeemer-accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "POST /redeemer-accounts/${acct_id}/credit-actions"
              payload: { action: "WITHDRAW", amount_cents: 600, expected_account_version: "${acct_v2}" }
              as: CenterOperator
              as_user_id: "operator-1"
              captures: { e_funds: $.data.error_id }
            - call: "POST /redeemer-accounts/${acct_id}/status-changes"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
              captures: { e_nonzero: $.data.error_id }
            - call: "POST /redeemer-accounts/${acct_id}/credit-actions"
              payload: { action: "WITHDRAW", amount_cents: 500, expected_account_version: "${acct_v2}" }
              as: CenterOperator
              as_user_id: "operator-1"
              captures: { entry_id: $.data.id }
            - call: "POST /redeemer-accounts/${acct_id}/status-changes"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
          assert:
            - "the first trigger has status 422 and $.data.error_id == ERR_INSUFFICIENT_CREDIT_BALANCE"
            - "the second trigger has status 409 and $.data.error_id == ERR_ACCOUNT_BALANCE_NONZERO"
            - "after the two failures RedeemerAccount.${acct_id}.credit_balance_cents == 500, status == ACTIVE and version == ${acct_v2}"
            - "the third trigger has status 201 with AccountCreditEntry.${entry_id}.amount_cents == -500 and balance_after_cents == 0"
            - "the fourth trigger has status 200 with RedeemerAccount.${acct_id}.status == CLOSED and bag_drop_enrolled false"

      - name: machine_session_inside_the_cooldown_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_MACHINE_COOLDOWN_ACTIVE]
          - validations[priority=27]
        excluded_because:
          difficulty_instance: machine_session_cooldown_halfopen_window_boundary
          rationale: "That §1.8 instance already drives SESSION_OPEN at last_session_closed_at plus 4 minutes 59 seconds (ERR_MACHINE_COOLDOWN_ACTIVE, 422) and at exactly plus 5 minutes (accepted), which is the only way to reach this code; a separate errors instance would repeat the same two calls."

      - name: overlapping_program_period_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_PERIOD_OVERLAP]
          - validations[priority=29]
        excluded_because:
          difficulty_instance: program_period_closed_interval_shared_endpoint_overlap
          rationale: "That §1.8 instance already posts a second period sharing a single endpoint date with an existing one and asserts ERR_PERIOD_OVERLAP (409) plus the accepted abutting interval, covering both sides of the closed-interval rule."

      - name: daily_cap_exhaustion_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_DAILY_CAP_EXHAUSTED]
          - validations[priority=35]
        excluded_because:
          difficulty_instance: close_count_cap_breach_flags_account_and_withholds_payout
          rationale: "That §1.8 instance already exhausts the account's daily allowance and then attempts a further redemption on the same visit_date, asserting ERR_DAILY_CAP_EXHAUSTED (422) alongside the fraud strike and the WITHHELD payout dimension it triggers."

      - name: non_operational_center_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_CENTER_NOT_OPERATIONAL]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: center_suspended_beats_daily_cap_exhausted
          rationale: "That §1.8 instance already suspends the centre and shows that a visit or lot at a SUSPENDED centre returns ERR_CENTER_NOT_OPERATIONAL (409) even when a lower-priority cap breach is also present, which is exactly the priority-11 claim."

      - name: exemption_distance_over_the_limit_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_EXEMPTION_DISTANCE_EXCEEDED]
          - validations[priority=36]
        excluded_because:
          difficulty_instance: exemption_distance_boundary_3_50_grants_and_3_52_denied
          rationale: "That §1.8 instance already claims an exemption at exactly 3.50 miles and is denied at 3.52 miles with ERR_EXEMPTION_DISTANCE_EXCEEDED (422), covering the inclusive boundary and the rounding of nearest_center_distance_miles in one chain."

      - name: flagged_account_credit_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_ACCOUNT_FLAGGED]
          - validations[priority=21]
        excluded_because:
          difficulty_instance: bag_drop_credit_rejected_when_account_flagged
          rationale: "That §1.8 instance already drives the account to FLAGGED through two fraud strikes and then attempts the bag-drop CREDIT settlement, asserting ERR_ACCOUNT_FLAGGED (409) and that no AccountCreditEntry is appended."

      - name: bag_drop_for_an_unenrolled_account_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_ACCOUNT_NOT_ENROLLED]
          - validations[priority=24]
        excluded_because:
          difficulty_instance: account_not_enrolled_beats_duplicate_tag_code
          rationale: "That §1.8 instance already posts a bag drop for an account whose bag_drop_enrolled is false while also reusing an existing tag_code, asserting ERR_ACCOUNT_NOT_ENROLLED (422) — the priority-24 check and the only path to this code."

  - section: rbac
    instances:

      - name: every_role_can_run_the_operations_it_owns
        claim_type: Allowed Operations
        grounds:
          - roles[ProgramAdmin]
          - roles[DistributorAgent]
          - roles[CenterOperator]
          - roles[PlantCounter]
          - roles[AccountHolder]
          - roles[RetailClerk]
        distinguishing_aspect: "All six declared roles act in one chain, each on the operation §1.7 reserves for it — label submission, plant counting, bag-drop dispute, exemption claim, period reading and centre suspension — and none of them is refused."
        test_recipe:
          setup:
            - "OPEN period 2026Q3, OPERATIONAL all-materials center at the origin with one PET machine, one DRAFT label, one enrolled ACTIVE account and one OBLIGATED 3000 sqft store 1.00 mile away"
