# =============================================================================
# task_0896 — School Transportation & McKinney-Vento Homeless Education
# SCAFFOLD.yaml  (§1.0–§1.7)
# =============================================================================

scenario: |
  School Transportation & McKinney-Vento Homeless Ed: student eligibility
  (homeless/foster) & transport, cross-district & cost-share, immediate-
  enrollment & records, liaison caseload & service, meal/fee-waiver linkage,
  dispute resolution, data & reporting, tutoring referral

domain_name: mckinney-vento-school-transport
api_prefix: /mv

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat            # peer entities linked by FK, no URL nesting
  state_machine_shape: branching   # Plan fork-join + revert; Dispute cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_band: Expert          # 12 entities, tightly coupled

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "District name" }
      - { name: nces_code, type: string, source: input, description: "Federal NCES LEA identifier" }
      - { name: transport_budget_cents, type: integer, source: input, description: "Monthly transport budget ceiling this district will fund as a serving district" }
      - { name: committed_cost_cents, type: integer, source: computed, default: 0, description: "Sum of serving_share_cents over CostShareAgreements whose serving_district_id == this District and whose TransportationPlan.status IN {ACTIVE, SUSPENDED}" }
      - { name: transport_balance_cents, type: integer, source: computed, default: 0, description: "Running sum of CostLedgerEntry.amount_cents where district_id == this District (TRIP_CHARGE positive, REVERSAL negative)" }
      - { name: categorical_eligible_count, type: integer, source: computed, default: 0, description: "Count of BenefitLink with status == ACTIVE and district_id == this District" }

  - name: Liaison
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; the district that employs this McKinney-Vento liaison" }
      - { name: full_name, type: string, source: input, description: "Liaison name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: max_caseload, type: integer, source: input, default: 25, description: "Maximum number of assigned eligible students" }
      - { name: current_caseload, type: integer, source: computed, default: 0, description: "Count of Student with liaison_id == this Liaison, status != WITHDRAWN, and eligibility_status == ELIGIBLE" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: first_name, type: string, source: input, description: "Student first name" }
      - { name: last_name, type: string, source: input, description: "Student last name" }
      - { name: birthdate, type: string, source: input, description: "Date of birth (YYYY-MM-DD)" }
      - { name: enrolled_district_id, type: string, source: input, description: "FK -> District.id; the district of current enrollment" }
      - { name: origin_district_id, type: string, source: input, description: "FK -> District.id; the school-of-origin district (may differ from enrolled)" }
      - { name: liaison_id, type: string, source: system, default: null, description: "FK -> Liaison.id; assigned caseload liaison (null until assigned)" }
      - { name: living_situation, type: enum, source: input, description: "Self-reported at intake: SHELTER | UNSHELTERED | HOTEL_MOTEL | DOUBLED_UP | FOSTER_PLACEMENT | HOUSED" }
      - { name: self_declared_category, type: enum, source: input, default: "NONE", description: "Self-declared: HOMELESS | FOSTER | NONE" }
      - { name: records_received, type: boolean, source: input, default: false, description: "Whether prior-school records have arrived (immediate enrollment does NOT require this to be true)" }
      - { name: status, type: enum, source: system, default: "INTAKE", description: "Enrollment lifecycle: INTAKE | ENROLLED | WITHDRAWN" }
      - { name: eligibility_status, type: enum, source: system, default: "UNDETERMINED", description: "UNDETERMINED | ELIGIBLE | INELIGIBLE — set by EligibilityDetermination finalize and by Dispute resolution" }
      - { name: priority_score, type: integer, source: computed, default: 0, description: "Service-priority score; PROVISIONAL variant at intake from living_situation, FINAL variant after a FINALIZED determination — see calculations.student_priority_score" }
      - { name: priority_basis, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL | FINAL — which variant priority_score currently reflects" }

  - name: EligibilityDetermination
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; subject of this determination" }
      - { name: category, type: enum, source: input, description: "HOMELESS | FOSTER" }
      - { name: basis, type: enum, source: input, description: "Verified basis: NIGHT_TO_NIGHT | SHELTER | HOTEL_MOTEL | DOUBLED_UP | UNSHELTERED | FOSTER" }
      - { name: decision, type: enum, source: input, description: "ELIGIBLE | INELIGIBLE" }
      - { name: effective_date, type: string, source: input, description: "Date the determination takes effect (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | FINALIZED" }

  - name: TransportationPlan
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the transported student" }
      - { name: origin_district_id, type: string, source: input, description: "FK -> District.id; school-of-origin district (bills a share)" }
      - { name: serving_district_id, type: string, source: input, description: "FK -> District.id; district operating the route (bills a share, subject to its budget)" }
      - { name: route_miles, type: integer, source: input, description: "One-way route mileage used for cost projection" }
      - { name: estimated_daily_cost_cents, type: integer, source: computed, description: "route_miles * PER_MILE_RATE_CENTS + BASE_TRIP_CENTS" }
      - { name: estimated_monthly_cost_cents, type: integer, source: computed, description: "estimated_daily_cost_cents * SCHOOL_DAYS_PER_MONTH" }
      - { name: actual_cost_cents, type: integer, source: computed, default: 0, description: "Chronological accumulation over COMPLETED (non-VOIDED) TripAssignments of trip_cost_cents" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PROPOSED | APPROVED | DENIED | ACTIVE | SUSPENDED | TERMINATED" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: serving_district_id, type: string, source: input, description: "FK -> District.id; owning district" }
      - { name: label, type: string, source: input, description: "Vehicle label / bus number" }
      - { name: capacity_students, type: integer, source: input, description: "Seat capacity" }
      - { name: status, type: enum, source: system, default: "IN_SERVICE", description: "IN_SERVICE | OUT_OF_SERVICE | RETIRED" }

  - name: TripAssignment
    parent: null
    common_fields: true
    fields:
      - { name: transportation_plan_id, type: string, source: input, description: "FK -> TransportationPlan.id; the plan this ride fulfils" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; the assigned vehicle" }
      - { name: serving_district_id, type: string, source: system, description: "Serving district, copied from TransportationPlan.serving_district_id at creation (used for district concurrency cap)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Ride window start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Ride window end (ISO 8601 UTC), half-open [start, end)" }
      - { name: actual_miles, type: integer, source: input, default: null, description: "Actual miles driven, supplied on complete" }
      - { name: trip_cost_cents, type: integer, source: computed, default: null, description: "actual_miles * PER_MILE_RATE_CENTS + BASE_TRIP_CENTS, set on complete" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | COMPLETED | CANCELED | VOIDED" }

  - name: CostShareAgreement
    parent: null
    common_fields: true
    fields:
      - { name: transportation_plan_id, type: string, source: input, description: "FK -> TransportationPlan.id; the plan whose cost is split" }
      - { name: origin_district_id, type: string, source: system, description: "Origin district, copied from the plan at creation" }
      - { name: serving_district_id, type: string, source: system, description: "Serving district, copied from the plan at creation" }
      - { name: total_monthly_cents, type: integer, source: computed, description: "Snapshot of TransportationPlan.estimated_monthly_cost_cents at agreement creation" }
      - { name: serving_pct, type: number, source: computed, description: "Tiered serving-district share fraction selected from route_miles" }
      - { name: serving_share_cents, type: integer, source: computed, description: "min(SHARE_CAP_CENTS, round_half_up(total_monthly_cents * serving_pct))" }
      - { name: origin_share_cents, type: integer, source: computed, description: "total_monthly_cents - serving_share_cents" }
      - { name: actual_cost_cents, type: integer, source: computed, default: 0, description: "Running actual serving-charge accumulation; equals sum of TRIP_CHARGE/REVERSAL CostLedgerEntry.amount_cents for this agreement" }

  - name: CostLedgerEntry
    parent: null
    common_fields: false          # append-only event: id + created_at only
    fields:
      - { name: cost_share_agreement_id, type: string, source: system, description: "FK -> CostShareAgreement.id; agreement this entry books against" }
      - { name: district_id, type: string, source: system, description: "FK -> District.id; the serving district charged by this entry" }
      - { name: trip_assignment_id, type: string, source: system, description: "Reference to the TripAssignment.id that generated this entry (not a resolvable sub-resource)" }
      - { name: entry_type, type: enum, source: system, description: "TRIP_CHARGE | REVERSAL" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents; TRIP_CHARGE positive, REVERSAL negative" }
      - { name: memo, type: string, source: system, description: "Human-readable memo" }

  - name: BenefitLink
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; the categorically-eligible student" }
      - { name: district_id, type: string, source: system, description: "FK -> District.id; enrolled district at link creation" }
      - { name: source, type: enum, source: system, default: "AUTO_ELIGIBILITY", description: "AUTO_ELIGIBILITY — created by determination/dispute cascade" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | REVOKED — grants categorical free meals and fee waivers" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the disputing student" }
      - { name: dispute_type, type: enum, source: input, description: "ELIGIBILITY | ENROLLMENT | TRANSPORT" }
      - { name: description, type: string, source: input, description: "Dispute narrative" }
      - { name: outcome, type: enum, source: system, default: null, description: "UPHELD | DENIED (set on resolve)" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | UNDER_REVIEW | INFO_REQUESTED | RESOLVED_UPHELD | RESOLVED_DENIED" }

  - name: TutoringReferral
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; referred student" }
      - { name: subject, type: enum, source: input, description: "MATH | READING | OTHER" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED | CANCELED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Student
    initial_state: INTAKE
    terminal_states: [WITHDRAWN]
    note: |
      `status` (enrollment) is the lifecycle machine below. `eligibility_status`
      is an independent field mutated by EligibilityDetermination.finalize and
      Dispute.resolve side-effects (UNDETERMINED -> ELIGIBLE|INELIGIBLE). The
      two evolve independently.
    transitions:
      - from: INTAKE
        to: ENROLLED
        trigger: "POST /mv/students/{studentId}/enroll"
        actor: Registrar
        preconditions:
          - "status == INTAKE"
        side_effects:
          - "Immediate enrollment: succeeds regardless of records_received (McKinney-Vento right); records_received is NOT a precondition"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /mv/students/{studentId}/withdraw"
        actor: Registrar
        preconditions:
          - "status == ENROLLED"
        side_effects:
          - "Cascade: every TransportationPlan for this student in {APPROVED, ACTIVE, SUSPENDED} -> TERMINATED (which itself cancels that plan's SCHEDULED TripAssignments)"
          - "Cascade: every BenefitLink for this student with status == ACTIVE -> REVOKED (decrements District.categorical_eligible_count)"

  - entity: EligibilityDetermination
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /mv/eligibility-determinations/{determinationId}/finalize"
        actor: Liaison
        preconditions:
          - "status == DRAFT"
          - "Student.status != WITHDRAWN (ERR_STUDENT_WITHDRAWN)"
        side_effects:
          - "CASCADE HOP 1 (A->B): set Student.eligibility_status = decision (ELIGIBLE or INELIGIBLE); recompute Student.priority_score to the FINAL variant and set priority_basis = FINAL"
          - "CASCADE HOP 2 (B->C): if decision == ELIGIBLE and Student now has no ACTIVE BenefitLink, create a BenefitLink {source: AUTO_ELIGIBILITY, status: ACTIVE, district_id = Student.enrolled_district_id}"
          - "CASCADE HOP 3 (C->D): the new BenefitLink increments District.categorical_eligible_count for that district"

  - entity: TransportationPlan
    initial_state: DRAFT
    terminal_states: [DENIED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /mv/transportation-plans/{planId}/submit"
        actor: TransportCoordinator
        preconditions: ["status == DRAFT"]
        side_effects: []
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /mv/transportation-plans/{planId}/approve"
        actor: TransportCoordinator
        preconditions:
          - "status == PROPOSED"
          - "CROSS-ENTITY: Student.eligibility_status == ELIGIBLE (ERR_STUDENT_NOT_ELIGIBLE)"
        side_effects: []
      - from: PROPOSED
        to: DENIED
        trigger: "POST /mv/transportation-plans/{planId}/deny"
        actor: TransportCoordinator
        preconditions: ["status == PROPOSED"]
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /mv/transportation-plans/{planId}/activate"
        actor: TransportCoordinator
        preconditions:
          - "status == APPROVED"
          - "REFERENTIAL: a CostShareAgreement exists for this plan (ERR_NO_COST_SHARE)"
          - "FISCAL: serving District.committed_cost_cents + agreement.serving_share_cents <= serving District.transport_budget_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "serving District.committed_cost_cents += agreement.serving_share_cents (derived-field reconciliation)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mv/transportation-plans/{planId}/suspend"
        actor: TransportCoordinator
        preconditions: ["status == ACTIVE"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mv/transportation-plans/{planId}/resume"
        actor: TransportCoordinator
        preconditions: ["status == SUSPENDED"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /mv/transportation-plans/{planId}/terminate"
        actor: TransportCoordinator
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "Cascade: every SCHEDULED TripAssignment for this plan -> CANCELED"
          - "serving District.committed_cost_cents -= agreement.serving_share_cents"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /mv/transportation-plans/{planId}/terminate"
        actor: TransportCoordinator
        preconditions: ["status == SUSPENDED"]
        side_effects:
          - "Cascade: every SCHEDULED TripAssignment for this plan -> CANCELED"
          - "serving District.committed_cost_cents -= agreement.serving_share_cents"

  - entity: Vehicle
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /mv/vehicles/{vehicleId}/set-status (status=OUT_OF_SERVICE)"
        actor: TransportCoordinator
        preconditions: ["status == IN_SERVICE"]
        side_effects: []
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /mv/vehicles/{vehicleId}/set-status (status=IN_SERVICE)"
        actor: TransportCoordinator
        preconditions: ["status == OUT_OF_SERVICE"]
        side_effects: []
      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /mv/vehicles/{vehicleId}/set-status (status=RETIRED)"
        actor: TransportCoordinator
        preconditions: ["status == IN_SERVICE"]
        side_effects: []
      - from: OUT_OF_SERVICE
        to: RETIRED
        trigger: "POST /mv/vehicles/{vehicleId}/set-status (status=RETIRED)"
        actor: TransportCoordinator
        preconditions: ["status == OUT_OF_SERVICE"]
        side_effects: []

  - entity: TripAssignment
    initial_state: SCHEDULED
    terminal_states: [CANCELED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /mv/trip-assignments/{tripId}/complete"
        actor: TransportCoordinator
        preconditions: ["status == SCHEDULED"]
        side_effects:
          - "trip_cost_cents = actual_miles * PER_MILE_RATE_CENTS + BASE_TRIP_CENTS"
          - "CASCADE HOP 1 (A->B): TransportationPlan.actual_cost_cents += trip_cost_cents; CostShareAgreement.actual_cost_cents increases by the serving delta"
          - "CASCADE HOP 2 (B->C): the agreement increase appends a CostLedgerEntry {entry_type: TRIP_CHARGE, amount_cents = round_half_up(trip_cost_cents * agreement.serving_pct), district_id = serving_district_id, trip_assignment_id = this trip}"
          - "CASCADE HOP 3 (C->D): the new CostLedgerEntry increments serving District.transport_balance_cents by amount_cents"
      - from: SCHEDULED
        to: CANCELED
        trigger: "POST /mv/trip-assignments/{tripId}/cancel"
        actor: TransportCoordinator
        preconditions: ["status == SCHEDULED"]
        side_effects: []
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /mv/trip-assignments/{tripId}/void"
        actor: TransportCoordinator
        preconditions: ["status == COMPLETED"]
        side_effects:
          - "COMPENSATION: TransportationPlan.actual_cost_cents -= trip_cost_cents; CostShareAgreement.actual_cost_cents decreases by the same serving delta"
          - "Append a CostLedgerEntry {entry_type: REVERSAL, amount_cents = -1 * round_half_up(trip_cost_cents * agreement.serving_pct), district_id = serving_district_id}"
          - "serving District.transport_balance_cents -= that magnitude, restoring it to the pre-completion value (conserved-quantity invariant)"

  - entity: BenefitLink
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /mv/benefit-links/{benefitLinkId}/revoke  (also fired by Student.withdraw cascade)"
        actor: Liaison
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "COMPENSATION: District.categorical_eligible_count -= 1 for the link's district_id, restoring the pre-creation count (conserved-quantity invariant)"

  - entity: Dispute
    initial_state: FILED
    terminal_states: [RESOLVED_UPHELD, RESOLVED_DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /mv/disputes/{disputeId}/begin-review"
        actor: StateCoordinator
        preconditions: ["status == FILED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /mv/disputes/{disputeId}/request-info"
        actor: StateCoordinator
        preconditions: ["status == UNDER_REVIEW"]
        side_effects: []
      - from: INFO_REQUESTED
        to: FILED
        trigger: "POST /mv/disputes/{disputeId}/resubmit"
        actor: Liaison
        preconditions: ["status == INFO_REQUESTED"]
        side_effects: ["Cyclic return to FILED so the review round can restart"]
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /mv/disputes/{disputeId}/resolve (outcome=UPHELD)"
        actor: StateCoordinator
        preconditions: ["status == UNDER_REVIEW"]
        side_effects:
          - "outcome = UPHELD"
          - "If Student.eligibility_status != ELIGIBLE: set Student.eligibility_status = ELIGIBLE and, if the student has no ACTIVE BenefitLink, create a BenefitLink {AUTO_ELIGIBILITY, ACTIVE} incrementing District.categorical_eligible_count"
      - from: UNDER_REVIEW
        to: RESOLVED_DENIED
        trigger: "POST /mv/disputes/{disputeId}/resolve (outcome=DENIED)"
        actor: StateCoordinator
        preconditions: ["status == UNDER_REVIEW"]
        side_effects: ["outcome = DENIED"]

  - entity: TutoringReferral
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /mv/tutoring-referrals/{referralId}/close"
        actor: Liaison
        preconditions: ["status == OPEN"]
        side_effects: []
      - from: OPEN
        to: CANCELED
        trigger: "POST /mv/tutoring-referrals/{referralId}/cancel"
        actor: Liaison
        preconditions: ["status == OPEN"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: cost-share-create-stale-plan
    parent_entity: TransportationPlan
    write_endpoint: "POST /mv/cost-share-agreements"
    occ_field: "expected_transportation_plan_version"
    description: |
      Creating a CostShareAgreement against a TransportationPlan whose version
      has advanced since the client last observed it is rejected. A new
      agreement legitimately supersedes the prior one for the same plan, so a
      client working from a stale view of the plan must be told its version is
      out of date rather than silently overwriting a fresher agreement.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: determination-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /mv/students/{studentId}/eligibility-determinations"
    occ_field: "expected_student_version"
    description: |
      Creating a new EligibilityDetermination against a Student whose version
      has advanced since the client last observed it is rejected. A newly
      created determination supersedes any prior DRAFT for that student, so a
      stale-version create is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: transport_plan_cost
    trigger: "TransportationPlan create sets estimates; TripAssignment complete/void updates actuals"
    algorithm: forward_looking
    formula: |
      estimated_daily_cost_cents   = route_miles * PER_MILE_RATE_CENTS + BASE_TRIP_CENTS
      estimated_monthly_cost_cents = estimated_daily_cost_cents * SCHOOL_DAYS_PER_MONTH
      actual_cost_cents            = sum(trip_cost_cents) over TripAssignment where
                                     transportation_plan_id == plan.id AND status == COMPLETED
                                     (VOIDED trips are excluded)
    input_set: "estimate uses projected route_miles; actual sums only COMPLETED (non-VOIDED) trips"
    constants:
      PER_MILE_RATE_CENTS: 155
      BASE_TRIP_CENTS: 500
      SCHOOL_DAYS_PER_MONTH: 20
    precision: "integer cents"
    variants:
      - name: estimated
        when: "projection at plan creation, forward-looking on route_miles"
        difference: "uses SCHOOL_DAYS_PER_MONTH * daily estimate; ignores whether any trip actually ran"
      - name: actual
        when: "reconciliation from logged rides"
        difference: "chronological sum of trip_cost_cents over COMPLETED trips only; for zero completed trips actual_cost_cents == 0 even though the estimate is positive"

  - name: cost_share_allocation
    trigger: "POST /mv/cost-share-agreements"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs (total_monthly_cents, route_miles->serving_pct tier, SHARE_CAP_CENTS)
      # with non-linear min() cap and tier selection.
      total_monthly_cents = TransportationPlan.estimated_monthly_cost_cents   # snapshot
      if   route_miles <= 10: serving_pct = 0.50
      elif route_miles <= 25: serving_pct = 0.60
      else:                   serving_pct = 0.75
      serving_share_cents = min(SHARE_CAP_CENTS, round_half_up(total_monthly_cents * serving_pct))
      origin_share_cents  = total_monthly_cents - serving_share_cents
    input_set: "single plan snapshot at agreement creation"
    constants:
      SHARE_CAP_CENTS: 100000
    precision: "round_half_up to integer cents; cap applied AFTER rounding"

  - name: student_priority_score
    trigger: "Student create sets PROVISIONAL; EligibilityDetermination.finalize sets FINAL"
    algorithm: weighted_scoring
    formula: |
      PROVISIONAL (at intake, from self-reported living_situation):
        LIVING_WEIGHT = { SHELTER:40, UNSHELTERED:50, HOTEL_MOTEL:30,
                          DOUBLED_UP:20, FOSTER_PLACEMENT:35, HOUSED:0 }
        priority_score = LIVING_WEIGHT[living_situation]
      FINAL (after finalize, from verified determination):
        BASIS_WEIGHT  = { NIGHT_TO_NIGHT:50, SHELTER:40, HOTEL_MOTEL:30,
                          DOUBLED_UP:20, UNSHELTERED:50, FOSTER:35 }
        priority_score = BASIS_WEIGHT[determination.basis] + (10 if determination.category == FOSTER else 0)
    input_set: "PROVISIONAL reads Student.living_situation; FINAL reads the FINALIZED determination's basis+category"
    precision: "integer"
    variants:
      - name: provisional
        when: "before any FINALIZED determination"
        difference: "keyed on self-reported living_situation; e.g. DOUBLED_UP -> 20"
      - name: final
        when: "after finalize"
        difference: "keyed on verified basis (+FOSTER bonus); same student can move e.g. from 20 (self-reported DOUBLED_UP) to 50 (verified UNSHELTERED)"

  - name: liaison_caseload
    trigger: "POST /mv/students/{studentId}/assign-liaison; recomputed on eligibility/withdraw changes"
    algorithm: aggregation
    formula: |
      current_caseload = count(Student where liaison_id == L.id
                               AND status != WITHDRAWN
                               AND eligibility_status == ELIGIBLE)
      # assignment rejected when it WOULD make current_caseload > max_caseload,
      # i.e. reject if current_caseload (counting this student) > max_caseload.
    input_set: "students assigned to the liaison that are ELIGIBLE and not WITHDRAWN"
    constants:
      DEFAULT_MAX_CASELOAD: 25
    precision: "integer count; boundary is strict '>' over max_caseload (a full load of exactly max_caseload is allowed, max_caseload+1 is rejected)"

  - name: cost_ledger_invoice
    trigger: "GET /mv/cost-share-agreements/{agreementId}/invoice"
    algorithm: aggregation
    formula: |
      # Nested-rounding order is PINNED: round EACH trip's serving portion to
      # whole cents, THEN sum. (Sum-then-round is explicitly NOT used and would
      # differ by a cent on fractional half-cents.)
      serving_invoice_cents = sum over COMPLETED (non-VOIDED) TripAssignment t of the plan of
                                round_half_up(t.trip_cost_cents * agreement.serving_pct)
      origin_invoice_cents  = sum over the same trips of
                                (t.trip_cost_cents - round_half_up(t.trip_cost_cents * agreement.serving_pct))
      trip_count            = number of COMPLETED (non-VOIDED) trips
    input_set: "COMPLETED, non-VOIDED trips of the agreement's plan"
    precision: "round_half_up per trip line BEFORE summation"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path ids and body FK references resolve (validated left-to-right); returns the resource-specific NOT_FOUND"
    error_id: "ERR_DISTRICT_NOT_FOUND / ERR_LIAISON_NOT_FOUND / ERR_STUDENT_NOT_FOUND / ERR_DETERMINATION_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_VEHICLE_NOT_FOUND / ERR_TRIP_NOT_FOUND / ERR_AGREEMENT_NOT_FOUND / ERR_BENEFIT_LINK_NOT_FOUND / ERR_DISPUTE_NOT_FOUND / ERR_REFERRAL_NOT_FOUND / ERR_LEDGER_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Body well-formed: required fields present, enums in range, scheduled_end > scheduled_start, non-negative integers"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all writes"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /mv/cost-share-agreements, POST /mv/students/{studentId}/eligibility-determinations"

  - priority: 6
    category: state
    check: "Target resource is in a state permitting the transition; withdrawn students reject mutating operations (ERR_STUDENT_WITHDRAWN); cross-entity state gates (ERR_STUDENT_NOT_ELIGIBLE on plan approve; ERR_VEHICLE_NOT_IN_SERVICE on trip create; ERR_PLAN_NOT_ACTIVE on trip create)"
    error_id: "ERR_INVALID_STATE / ERR_STUDENT_WITHDRAWN / ERR_STUDENT_NOT_ELIGIBLE / ERR_VEHICLE_NOT_IN_SERVICE / ERR_PLAN_NOT_ACTIVE"
    http_status: 409
    applies_to: "state-changing endpoints"

  - priority: 7
    category: business_referential
    check: "Plan activation requires an existing CostShareAgreement for the plan"
    error_id: ERR_NO_COST_SHARE
    http_status: 409
    applies_to: "POST /mv/transportation-plans/{planId}/activate"

  - priority: 8
    category: business_constraint
    check: "Assigning a liaison must not push current_caseload above max_caseload"
    error_id: ERR_LIAISON_CASELOAD_FULL
    http_status: 409
    applies_to: "POST /mv/students/{studentId}/assign-liaison"

  - priority: 9
    category: business_temporal
    check: "New trip must not overlap another non-terminal (SCHEDULED/COMPLETED) trip on the SAME vehicle within VEHICLE_BUFFER_MINUTES (= 30) turnaround (buffered-interval semantics)"
    error_id: ERR_VEHICLE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /mv/trip-assignments"

  - priority: 10
    category: business_temporal
    check: "New trip must not make the count of SCHEDULED trips whose half-open [start,end) window overlaps it, for the same serving_district_id, exceed DISTRICT_CONCURRENT_TRIP_CAP (= 3) (aggregate-capacity semantics; adjacency end==start does not overlap)"
    error_id: ERR_DISTRICT_CAPACITY
    http_status: 409
    applies_to: "POST /mv/trip-assignments"

  - priority: 11
    category: business_fiscal
    check: "Plan activation: serving District.committed_cost_cents + agreement.serving_share_cents must not exceed serving District.transport_budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /mv/transportation-plans/{planId}/activate"

