              as: DesignEngineer
              captures: { line_l: "$.data.id" }
            - call: "POST /panel-shop/panels/${panel_l}/submit-review"
              payload: {}
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${panel_l}/approve-design"
              payload: {}
              as: QAManager
              as_user_id: "qa-901"
            - call: "POST /panel-shop/panels/${panel_l}/release-procurement"
              payload: {}
              as: ProjectManager
            - call: "POST /panel-shop/panel-components/${line_l}/receive"
              payload: {}
              as: ShopLead
            - call: "POST /panel-shop/panels/${panel_l}/substitution-requests"
              payload: { original_line_id: "${line_l}", proposed_component_id: "${comp_prop}", reason: "vendor stockout" }
              as: DesignEngineer
              as_user_id: "de-002"
              captures: { sub_l: "$.data.id" }
          trigger:
            - call: "POST /panel-shop/substitution-requests/${sub_e}/approve"
