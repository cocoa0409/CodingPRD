# =============================================================================
# task_0849 — Beach & Lifeguard Operations — seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  849. Beach & Lifeguard Operations: beach zone & flag status, lifeguard shift &
  tower staffing, rescue/incident & EMS report, water-quality (bacteria) advisory
  & closure, parking/badge & resident pass, lost-child & first-aid, rip-current &
  weather, seasonal reporting

domain_name: beach-lifeguard-ops
api_prefix: /beach-ops

complexity_profile:
  primary_archetype: posture_driven            # Zone.flag_status + water_status gate swim operations
  secondary_archetype: temporal_windowing      # lifeguard shifts / tower staffing intervals
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat                          # peer entities linked by FK, no nested-in-URL ownership
  state_machine_shape: cyclic                    # Zone flag cycles GREEN<->YELLOW<->RED; Shift ON_DUTY<->ON_BREAK
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles                         # captain / lifeguard / inspector / clerk own distinct surfaces
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Beach
    parent: null
    common_fields: true      # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Beach / footprint name" }
      - { name: town_code, type: string, source: input, description: "Owning municipality code" }
      - { name: season_start_date, type: string, source: input, description: "Season open date, YYYY-MM-DD (inclusive)" }
      - { name: season_end_date, type: string, source: input, description: "Season close date, YYYY-MM-DD (inclusive); must be > season_start_date" }

  - name: Zone
    parent: null
    common_fields: true
    fields:
      - { name: beach_id, type: string, source: input, description: "FK -> Beach.id; owning beach" }
      - { name: name, type: string, source: input, description: "Zone label (e.g. 'North Cove')" }
      - { name: min_guards_required, type: integer, source: input, default: 1, description: "Minimum on-duty guards to fly a swim flag (GREEN/YELLOW)" }
      - { name: flag_status, type: enum, source: system, default: RED, description: "GREEN | YELLOW | RED | BLACK; GREEN=swim, YELLOW=caution, RED=no-swim (open beach), BLACK=hard closure" }
      - { name: water_status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED; parallel dimension to flag_status, driven by water-quality closures" }
      - { name: rip_current_level, type: enum, source: system, default: LOW, description: "LOW | MODERATE | HIGH; set by conditions updates" }
      - { name: on_duty_guard_count, type: integer, source: computed, default: 0, description: "Count of Shifts on this zone's towers in status ON_DUTY or ON_BREAK (see calc on_duty_guard_count)" }
      - { name: weather_note, type: string, source: system, description: "Free-text note from the latest conditions update" }

  - name: Tower
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; owning zone" }
      - { name: label, type: string, source: input, description: "Tower label (e.g. 'Tower 4')" }
      - { name: max_concurrent_guards, type: integer, source: input, default: 2, description: "Aggregate capacity: max number of overlapping non-cancelled shifts at any instant" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | OFFLINE; OFFLINE towers cannot be clocked into or scheduled onto" }

  - name: Lifeguard
    parent: null
    common_fields: true
    fields:
      - { name: beach_id, type: string, source: input, description: "FK -> Beach.id; home beach" }
      - { name: name, type: string, source: input, description: "Lifeguard full name" }
      - { name: certification_level, type: enum, source: input, description: "JUNIOR | SENIOR | CAPTAIN" }
      - { name: employee_ref, type: string, source: input, description: "Payroll / HR reference" }

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: lifeguard_id, type: string, source: input, description: "FK -> Lifeguard.id; the guard working this shift" }
      - { name: tower_id, type: string, source: input, description: "FK -> Tower.id; the staffed tower" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (ISO8601 UTC), half-open interval start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned end (ISO8601 UTC), half-open interval end; must be > scheduled_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | ON_DUTY | ON_BREAK | OFF_DUTY | CANCELLED" }
      - { name: clock_in_at, type: datetime, source: system, description: "Logical-clock time of CLOCK_IN; null until then" }
      - { name: clock_out_at, type: datetime, source: system, description: "Logical-clock time of CLOCK_OUT; null until then" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; where the incident occurred" }
      - { name: lifeguard_id, type: string, source: input, description: "FK -> Lifeguard.id; responding guard (optional)" }
      - { name: type, type: enum, source: input, description: "RESCUE | MEDICAL | LOST_CHILD | FIRST_AID" }
      - { name: severity, type: enum, source: input, default: LOW, description: "LOW | MODERATE | CRITICAL" }
      - { name: occurred_at, type: datetime, source: input, description: "When the incident occurred (ISO8601 UTC)" }
      - { name: victim_count, type: integer, source: input, default: 1, description: "People involved" }
      - { name: description, type: string, source: input, description: "Narrative" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RESOLVED_ON_SCENE | ESCALATED_EMS | REUNITED | CLOSED" }
      - { name: ems_transported, type: boolean, source: system, description: "Set on ESCALATE_EMS; whether patient was transported" }
      - { name: ems_hospital, type: string, source: system, description: "Set on ESCALATE_EMS; receiving hospital" }
      - { name: ems_unit, type: string, source: system, description: "Set on ESCALATE_EMS; responding EMS unit" }
      - { name: ems_narrative, type: string, source: system, description: "Set on ESCALATE_EMS; EMS handoff narrative" }

  - name: WaterQualitySample
    parent: null
    common_fields: false     # append-only event: id + created_at only, immutable
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; sampled zone" }
      - { name: enterococci_mpn, type: integer, source: input, description: "Enterococci bacteria count, MPN/100mL (>= 0)" }
      - { name: sampled_at, type: datetime, source: input, description: "Sample collection time (ISO8601 UTC)" }
      - { name: lab_ref, type: string, source: input, description: "Lab result reference" }
      - { name: technician, type: string, source: input, description: "Collecting technician" }

  - name: Advisory
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; advised zone" }
      - { name: basis, type: enum, source: input, description: "SINGLE_SAMPLE | GEOMEAN_30DAY; which assessment variant produced level" }
      - { name: level, type: enum, source: system, description: "NONE | ADVISORY | CLOSURE; computed by bacteria_exceedance_assessment" }
      - { name: assessed_value, type: number, source: computed, description: "The value the level was derived from (single latest MPN, or 30-day geometric mean rounded 2dp)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED | LIFTED" }
      - { name: reason, type: string, source: input, description: "Inspector note (optional)" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock issue time" }

  - name: ParkingLot
    parent: null
    common_fields: true
    fields:
      - { name: beach_id, type: string, source: input, description: "FK -> Beach.id; owning beach" }
      - { name: name, type: string, source: input, description: "Lot name" }
      - { name: total_spaces, type: integer, source: input, description: "Physical capacity (>= 1)" }
      - { name: available_spaces, type: integer, source: computed, description: "total_spaces - count(ACTIVE ParkingPass) (see calc available_spaces)" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Base daily rate in cents" }

  - name: ParkingPass
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> ParkingLot.id; issuing lot" }
      - { name: plate, type: string, source: input, description: "Vehicle plate" }
      - { name: vehicle_type, type: enum, source: input, description: "CAR | OVERSIZED" }
      - { name: pass_type, type: enum, source: input, description: "DAILY | SEASON; SEASON passes are the resident/season badge" }
      - { name: is_resident, type: boolean, source: input, default: false, description: "Resident pass flag; drives the resident discount / season base rate" }
      - { name: fee_cents, type: integer, source: computed, description: "Issuance fee in cents (see calc parking_fee)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REVOKED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock issue time" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Zone flag_status (cyclic) + water_status (parallel dimension) --------
  - entity: Zone
    field: flag_status
    initial_state: RED
    terminal_states: []
    transitions:
      - from: RED
        to: GREEN
        trigger: "POST /beach-ops/zones/{zone_id}/flag {flag_status: GREEN}"
        actor: BeachCaptain
        preconditions:
          - "No Advisory for this zone with level=CLOSURE and status=ACTIVE (ERR_ZONE_UNDER_CLOSURE) [Zone depends on Advisory]"
          - "zone.water_status == OPEN"
          - "zone.rip_current_level != HIGH (ERR_RIP_CURRENT_UNSAFE)"
          - "zone.on_duty_guard_count >= zone.min_guards_required (ERR_ZONE_UNDERSTAFFED)"
        side_effects: []
      - from: GREEN
        to: YELLOW
        trigger: "POST /beach-ops/zones/{zone_id}/flag {flag_status: YELLOW}"
        actor: BeachCaptain
        preconditions: ["zone.on_duty_guard_count >= zone.min_guards_required"]
        side_effects: []
      - from: YELLOW
        to: GREEN
        trigger: "POST /beach-ops/zones/{zone_id}/flag {flag_status: GREEN}"
        actor: BeachCaptain
        preconditions:
          - "No ACTIVE CLOSURE Advisory for this zone"
          - "zone.rip_current_level != HIGH"
          - "zone.on_duty_guard_count >= zone.min_guards_required"
        side_effects: []
      - from: GREEN
        to: RED
        trigger: "POST /beach-ops/zones/{zone_id}/flag {flag_status: RED}"
        actor: BeachCaptain
        preconditions: []
        side_effects: []
      - from: YELLOW
        to: RED
        trigger: "POST /beach-ops/zones/{zone_id}/flag {flag_status: RED}"
        actor: BeachCaptain
        preconditions: []
        side_effects: []
      - from: "GREEN|YELLOW"
        to: RED
        trigger: "POST /beach-ops/zones/{zone_id}/conditions {rip_current_level: HIGH}"
        actor: BeachCaptain
        preconditions: []
        side_effects: ["rip_current_level set to HIGH; swim flag forced down to RED"]
      - from: "GREEN|YELLOW"
        to: RED
        trigger: "system: Shift CLOCK_OUT drops on_duty_guard_count below min_guards_required"
        actor: system
        preconditions: []
        note: "Cascade link 2 of clockout_understaffed_cascade"
        side_effects: []
      - from: "GREEN|YELLOW|RED"
        to: BLACK
        trigger: "system: an Advisory with level=CLOSURE becomes ACTIVE for this zone"
        actor: system
        preconditions: []
        side_effects:
          - "zone.water_status set to CLOSED"
          - "All SCHEDULED shifts on this zone's towers -> CANCELLED (cascade link 3 of closure_advisory_cascade)"
      - from: BLACK
        to: RED
        trigger: "system: the ACTIVE CLOSURE Advisory is LIFTED (POST /beach-ops/advisories/{advisory_id}/lift)"
        actor: system
        preconditions: []
        side_effects: ["zone.water_status set to OPEN; flag drops to RED pending manual re-open"]

  # ---- Tower status --------------------------------------------------------
  - entity: Tower
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: OFFLINE
        trigger: "POST /beach-ops/towers/{tower_id}/status {status: OFFLINE}"
        actor: BeachCaptain
        preconditions: []
        side_effects: []
      - from: OFFLINE
        to: OPEN
        trigger: "POST /beach-ops/towers/{tower_id}/status {status: OPEN}"
        actor: BeachCaptain
        preconditions: []
        side_effects: []

  # ---- Shift (cyclic ON_DUTY<->ON_BREAK) -----------------------------------
  - entity: Shift
    field: status
    initial_state: SCHEDULED
    terminal_states: [OFF_DUTY, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ON_DUTY
        trigger: "POST /beach-ops/shifts/{shift_id}/transitions {action: CLOCK_IN}"
        actor: Lifeguard
        preconditions:
          - "tower.status == OPEN (ERR_TOWER_OFFLINE) [Shift depends on Tower]"
        side_effects:
          - "clock_in_at set to logical clock now"
          - "recompute Zone.on_duty_guard_count for the tower's zone (increments by 1)"
      - from: ON_DUTY
        to: ON_BREAK
        trigger: "POST /beach-ops/shifts/{shift_id}/transitions {action: BREAK}"
        actor: Lifeguard
        preconditions: []
        side_effects: ["Zone.on_duty_guard_count unchanged (ON_BREAK still counts)"]
      - from: ON_BREAK
        to: ON_DUTY
        trigger: "POST /beach-ops/shifts/{shift_id}/transitions {action: RESUME}"
        actor: Lifeguard
        preconditions: []
        side_effects: []
      - from: ON_DUTY
        to: OFF_DUTY
        trigger: "POST /beach-ops/shifts/{shift_id}/transitions {action: CLOCK_OUT}"
        actor: Lifeguard
        preconditions: []
        side_effects:
          - "clock_out_at set to logical clock now"
          - "recompute Zone.on_duty_guard_count for the tower's zone (decrements by 1) [cascade link 1 of clockout_understaffed_cascade]"
          - "if resulting on_duty_guard_count < zone.min_guards_required and flag in {GREEN,YELLOW} -> Zone.flag_status auto -> RED [cascade link 2]"
      - from: ON_BREAK
        to: OFF_DUTY
        trigger: "POST /beach-ops/shifts/{shift_id}/transitions {action: CLOCK_OUT}"
        actor: Lifeguard
        preconditions: []
        side_effects:
          - "clock_out_at set; recompute Zone.on_duty_guard_count (decrements by 1)"
          - "if resulting count < min_guards_required and flag in {GREEN,YELLOW} -> Zone.flag_status auto -> RED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /beach-ops/shifts/{shift_id}/transitions {action: CANCEL}"
        actor: BeachCaptain
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: zone water-quality CLOSURE cascade cancels scheduled shifts on the zone's towers"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Incident (branching fork with divergent side-effects) ---------------
  - entity: Incident
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESOLVED_ON_SCENE
        trigger: "POST /beach-ops/incidents/{incident_id}/transitions {action: RESOLVE_ON_SCENE}"
        actor: Lifeguard
        preconditions: []
        side_effects: ["no EMS fields set"]
      - from: OPEN
        to: ESCALATED_EMS
        trigger: "POST /beach-ops/incidents/{incident_id}/transitions {action: ESCALATE_EMS}"
        actor: Lifeguard
        preconditions:
          - "ems_hospital, ems_unit, ems_narrative, ems_transported all present in payload (ERR_EMS_DETAILS_REQUIRED)"
        side_effects: ["ems_transported/ems_hospital/ems_unit/ems_narrative populated from payload"]
      - from: OPEN
        to: REUNITED
        trigger: "POST /beach-ops/incidents/{incident_id}/transitions {action: REUNITE}"
        actor: Lifeguard
        preconditions: ["incident.type == LOST_CHILD (ERR_INCIDENT_TYPE_MISMATCH)"]
        side_effects: []
      - from: "RESOLVED_ON_SCENE|ESCALATED_EMS|REUNITED"
        to: CLOSED
        trigger: "POST /beach-ops/incidents/{incident_id}/transitions {action: CLOSE}"
        actor: Lifeguard
        preconditions: []
        side_effects: []

  # ---- Advisory ------------------------------------------------------------
  - entity: Advisory
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, LIFTED]
    transitions:
      - from: none
        to: ACTIVE
        trigger: "POST /beach-ops/zones/{zone_id}/advisories"
        actor: WaterQualityInspector
        preconditions:
          - "expected_zone_version matches zone.version (ERR_STALE_VERSION)"
        side_effects:
          - "level + assessed_value computed via bacteria_exceedance_assessment(basis) [cascade link 1 of closure_advisory_cascade]"
          - "any prior ACTIVE Advisory for the zone -> SUPERSEDED"
          - "increments Zone.version by 1"
          - "if level == CLOSURE -> Zone.flag_status system-transition to BLACK, water_status CLOSED [cascade link 2]"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer Advisory becomes ACTIVE for the same zone"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /beach-ops/advisories/{advisory_id}/lift"
        actor: WaterQualityInspector
        preconditions: ["advisory.status == ACTIVE (ERR_ADVISORY_NOT_ACTIVE)"]
        side_effects:
          - "if advisory.level == CLOSURE -> Zone.water_status OPEN, flag BLACK -> RED; increments Zone.version by 1"

  # ---- ParkingPass ---------------------------------------------------------
  - entity: ParkingPass
    field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: none
        to: ACTIVE
        trigger: "POST /beach-ops/parking-passes"
        actor: ParkingClerk
        preconditions:
          - "lot.available_spaces >= 1 (ERR_LOT_FULL)"
        side_effects:
          - "fee_cents computed via parking_fee"
          - "recompute ParkingLot.available_spaces (decrements by 1)"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /beach-ops/parking-passes/{pass_id}/revoke"
        actor: ParkingClerk
        preconditions: ["pass.status == ACTIVE (ERR_PASS_NOT_ACTIVE)"]
        side_effects: ["recompute ParkingLot.available_spaces (increments by 1) [compensating action]"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: advisory-create-stale-zone
    parent_entity: Zone
    write_endpoint: "POST /beach-ops/zones/{zone_id}/advisories"
    occ_field: "expected_zone_version"
    description: |
      Issuing an Advisory against a Zone whose version has advanced since the
      inspector last observed it is rejected. A new Advisory legitimately
      supersedes the prior ACTIVE one and bumps zone.version; an inspector still
      carrying the pre-supersede version is working from a stale view and is
      turned away with a precondition failure.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bacteria_exceedance_assessment
    trigger: "POST /beach-ops/zones/{zone_id}/advisories (advisory creation)"
    algorithm: threshold
    input_set: "WaterQualitySample rows for the zone; SINGLE_SAMPLE uses the latest by sampled_at (tie-break created_at DESC); GEOMEAN_30DAY uses all samples with sampled_at in [now-30d, now] inclusive"
    constants:
      ADVISORY_THRESHOLD_MPN: 35
      CLOSURE_THRESHOLD_MPN: 104
      GEOMEAN_WINDOW_DAYS: 30
    formula: |
      SINGLE_SAMPLE:
        v = latest_sample.enterococci_mpn   # latest by sampled_at DESC, then created_at DESC
        assessed_value = v (integer)
      GEOMEAN_30DAY:
        S = samples with (now - GEOMEAN_WINDOW_DAYS) <= sampled_at <= now
        if S empty: assessed_value = 0, level = NONE
        else: assessed_value = round_half_up( product(s.enterococci_mpn for s in S) ** (1/len(S)), 2 )
      level (both variants):
        CLOSURE  if assessed_value >= CLOSURE_THRESHOLD_MPN   # >= 104
        ADVISORY if assessed_value >= ADVISORY_THRESHOLD_MPN  # >= 35 and < 104
        NONE     otherwise
    precision: "geometric mean to 2 decimal places, round_half_up; MPN inputs are integers"
    variants:
      - name: single_sample
        when: "basis == SINGLE_SAMPLE"
        difference: "Uses only the latest sample's raw MPN; one high spike can trip CLOSURE"
      - name: geomean_30day
        when: "basis == GEOMEAN_30DAY"
        difference: "Uses the geometric mean of the trailing 30-day window; a lone spike is damped, so the same samples can land ADVISORY instead of CLOSURE"

  - name: parking_fee
    trigger: "POST /beach-ops/parking-passes (pass issuance)"
    algorithm: tiered_pricing
    input_set: "single ParkingPass request against its lot; day_type derived from the logical clock date"
    constants:
      WEEKDAY_MULT: 1.0
      WEEKEND_MULT: 1.5
      OVERSIZED_DAILY_SURCHARGE_CENTS: 2000
      RESIDENT_DISCOUNT_RATE: 0.5
      SEASON_BASE_RESIDENT_CENTS: 15000
      SEASON_BASE_NONRESIDENT_CENTS: 30000
      OVERSIZED_SEASON_SURCHARGE_CENTS: 5000
    formula: |
      day_type = WEEKEND if weekday(clock_now_date) in {Saturday, Sunday} else WEEKDAY
      if pass_type == DAILY:
        base_mult = WEEKEND_MULT if day_type == WEEKEND else WEEKDAY_MULT
        surcharge = OVERSIZED_DAILY_SURCHARGE_CENTS if vehicle_type == OVERSIZED else 0
        discount  = RESIDENT_DISCOUNT_RATE if is_resident else 0.0
        fee_cents = round_half_up( (lot.daily_rate_cents * base_mult + surcharge) * (1 - discount) )
      else:  # SEASON
        base = SEASON_BASE_RESIDENT_CENTS if is_resident else SEASON_BASE_NONRESIDENT_CENTS
        fee_cents = base + (OVERSIZED_SEASON_SURCHARGE_CENTS if vehicle_type == OVERSIZED else 0)
    precision: "integer cents, round_half_up"

  - name: seasonal_parking_revenue
    trigger: "GET /beach-ops/beaches/{beach_id}/seasonal-report (read-time aggregation)"
    algorithm: aggregation
    input_set: "ParkingPass rows with status==ACTIVE whose lot.beach_id == beach.id"
    constants:
      TOWN_SURCHARGE_RATE: 0.085
    formula: |
      # ROUNDING ORDER IS PINNED: apply the town surcharge and round PER PASS, THEN sum.
      per_pass_line(p) = round_half_up( p.fee_cents * (1 + TOWN_SURCHARGE_RATE) )
      total_parking_revenue_cents = sum( per_pass_line(p) for p in active_passes )
    precision: "each line rounded to integer cents (round_half_up) before summation"

  - name: zone_coverage_hours
    trigger: "GET /beach-ops/beaches/{beach_id}/seasonal-report (read-time aggregation)"
    algorithm: aggregation
    input_set: "Shift rows whose tower.zone.beach_id == beach.id"
    formula: |
      scheduled_coverage_minutes = sum( (scheduled_end - scheduled_start) in whole minutes
                                        for shifts with status != CANCELLED )
      actual_coverage_minutes    = sum( ((clock_out_at or clock_now) - clock_in_at) in whole minutes
                                        for shifts with clock_in_at != null )
    precision: "whole minutes (floor of the second-difference / 60)"
    variants:
      - name: scheduled_coverage
        when: "planning view"
        difference: "Counts planned schedule length; ignores whether the guard actually clocked in"
      - name: actual_coverage
        when: "operations view"
        difference: "Counts real clocked duration; a guard who clocked out early yields fewer minutes than scheduled"

  - name: on_duty_guard_count
    trigger: "Shift CLOCK_IN / CLOCK_OUT / CANCEL / closure cascade"
    algorithm: aggregation
    input_set: "Shift rows whose tower.zone_id == zone.id"
    formula: |
      zone.on_duty_guard_count = count( shift for shift in zone_shifts
                                        if shift.status in {ON_DUTY, ON_BREAK} )
    precision: "integer count"

  - name: available_spaces
    trigger: "ParkingPass create / revoke"
    algorithm: aggregation
    input_set: "ParkingPass rows whose lot_id == lot.id"
    formula: |
      lot.available_spaces = lot.total_spaces - count( pass for pass in lot_passes
                                                       if pass.status == ACTIVE )
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all mutating endpoints

  - priority: 3
    category: existence
    check: "All path ids and body FK ids resolve to existing rows (validated left-to-right)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all endpoints referencing ids

  - priority: 4
    category: business_constraint
    check: "Request body parses and all required fields present with valid enum/number types"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutating endpoints

  - priority: 5
    category: business_temporal
    check: "Shift scheduled_end > scheduled_start"
    error_id: ERR_SHIFT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /beach-ops/shifts"

  - priority: 6
    category: business_temporal
    check: "Beach season_end_date > season_start_date"
    error_id: ERR_SEASON_DATES_INVALID
    http_status: 422
    applies_to: "POST /beach-ops/beaches"

  - priority: 7
    category: state
    check: "OCC: expected_zone_version equals zone.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /beach-ops/zones/{zone_id}/advisories"

  - priority: 8
    category: state
    check: "Target resource is in a legal state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 9
    category: state
    check: "Tower.status == OPEN for shift scheduling and CLOCK_IN"
    error_id: ERR_TOWER_OFFLINE
    http_status: 409
    applies_to: "POST /beach-ops/shifts; POST /beach-ops/shifts/{shift_id}/transitions (CLOCK_IN)"

  - priority: 10
    category: state
    check: "Advisory must be ACTIVE to be lifted"
    error_id: ERR_ADVISORY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /beach-ops/advisories/{advisory_id}/lift"

  - priority: 11
    category: state
    check: "ParkingPass must be ACTIVE to be revoked"
    error_id: ERR_PASS_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /beach-ops/parking-passes/{pass_id}/revoke"

  - priority: 12
    category: business_safety
    check: "No ACTIVE CLOSURE Advisory on the zone when raising a swim flag (GREEN/YELLOW)"
    error_id: ERR_ZONE_UNDER_CLOSURE
    http_status: 409
    applies_to: "POST /beach-ops/zones/{zone_id}/flag"

  - priority: 13
    category: business_safety
    check: "rip_current_level != HIGH when raising a swim flag (GREEN/YELLOW)"
    error_id: ERR_RIP_CURRENT_UNSAFE
    http_status: 409
    applies_to: "POST /beach-ops/zones/{zone_id}/flag"

  - priority: 14
    category: business_referential
    check: "REUNITE only allowed on incident.type == LOST_CHILD"
    error_id: ERR_INCIDENT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /beach-ops/incidents/{incident_id}/transitions (REUNITE)"

  - priority: 15
    category: business_temporal
    check: "New shift must not overlap another non-cancelled shift for the same lifeguard; intervals are half-open [start,end) so touching endpoints do NOT conflict"
    error_id: ERR_LIFEGUARD_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /beach-ops/shifts"

  - priority: 16
    category: business_temporal
    check: "New shift must not push a tower's concurrent non-cancelled shift count above tower.max_concurrent_guards at any instant of its half-open interval"
    error_id: ERR_TOWER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /beach-ops/shifts"

  - priority: 17
    category: business_constraint
    check: "zone.on_duty_guard_count >= zone.min_guards_required when raising a swim flag (GREEN/YELLOW)"
    error_id: ERR_ZONE_UNDERSTAFFED
    http_status: 409
    applies_to: "POST /beach-ops/zones/{zone_id}/flag"

  - priority: 18
    category: business_constraint
    check: "ESCALATE_EMS requires ems_hospital, ems_unit, ems_narrative, ems_transported"
    error_id: ERR_EMS_DETAILS_REQUIRED
    http_status: 422
    applies_to: "POST /beach-ops/incidents/{incident_id}/transitions (ESCALATE_EMS)"

  - priority: 19
    category: business_fiscal
    check: "lot.available_spaces >= 1 when issuing a parking pass"
    error_id: ERR_LOT_FULL
    http_status: 409
    applies_to: "POST /beach-ops/parking-passes"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Beach ----
  - method: POST
    path: "/beach-ops/beaches"
    description: "Create a beach"
    roles: [BeachCaptain]
    code: 201
    input: [name, town_code, season_start_date, season_end_date]
    output: Beach
    side_effects: []

  - method: GET
    path: "/beach-ops/beaches/{beach_id}"
    description: "Get a beach"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: []
    output: Beach
    side_effects: []

  - method: GET
    path: "/beach-ops/beaches/{beach_id}/seasonal-report"
    description: "Computed seasonal rollup for the beach"
    roles: [BeachCaptain, Public]
    code: 200
    input: []
    output: "{ total_incidents: integer, rescue_count: integer, ems_escalations: integer, total_water_samples: integer, active_closures: integer, total_parking_revenue_cents: integer, scheduled_coverage_minutes: integer, actual_coverage_minutes: integer }"
    side_effects: ["runs seasonal_parking_revenue and zone_coverage_hours"]

  # ---- Zone ----
  - method: POST
    path: "/beach-ops/zones"
    description: "Create a zone under a beach"
    roles: [BeachCaptain]
    code: 201
    input: [beach_id, name, "min_guards_required?"]
    output: Zone
    side_effects: ["flag_status=RED, water_status=OPEN, rip_current_level=LOW, on_duty_guard_count=0"]

  - method: GET
    path: "/beach-ops/zones/{zone_id}"
    description: "Get a zone"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: []
    output: Zone
    side_effects: []

  - method: GET
    path: "/beach-ops/zones"
    description: "List zones (filterable by beach)"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: ["beach_id?", "limit?", "offset?"]
    output: Zone[]
    side_effects: []

  - method: POST
    path: "/beach-ops/zones/{zone_id}/flag"
    description: "Set zone swim flag"
    roles: [BeachCaptain]
    code: 200
    input: [flag_status]
    output: Zone
    side_effects: ["state-machine transition of flag_status"]

  - method: POST
    path: "/beach-ops/zones/{zone_id}/conditions"
    description: "Post rip-current / weather conditions for a zone"
    roles: [BeachCaptain]
    code: 200
    input: [rip_current_level, "weather_note?"]
    output: Zone
    side_effects: ["rip_current_level and weather_note updated; rip HIGH forces flag down to RED"]

  - method: POST
    path: "/beach-ops/zones/{zone_id}/advisories"
    description: "Issue a water-quality advisory for a zone (supersedes prior active); OCC-guarded"
    roles: [WaterQualityInspector]
    code: 201
    input: [basis, expected_zone_version, "reason?"]
    output: Advisory
    side_effects:
      - "computes level/assessed_value via bacteria_exceedance_assessment"
      - "prior ACTIVE advisory -> SUPERSEDED"
      - "increments Zone.version by 1"
      - "level==CLOSURE cascades Zone.flag_status -> BLACK, water_status CLOSED, cancels SCHEDULED shifts on the zone's towers"

  # ---- Tower ----
  - method: POST
    path: "/beach-ops/towers"
    description: "Create a tower under a zone"
    roles: [BeachCaptain]
    code: 201
    input: [zone_id, label, "max_concurrent_guards?"]
    output: Tower
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/beach-ops/towers/{tower_id}"
    description: "Get a tower"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: []
    output: Tower
    side_effects: []

  - method: GET
    path: "/beach-ops/towers"
    description: "List towers (filterable by zone)"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: ["zone_id?", "limit?", "offset?"]
    output: Tower[]
    side_effects: []

  - method: POST
    path: "/beach-ops/towers/{tower_id}/status"
    description: "Set tower OPEN/OFFLINE"
    roles: [BeachCaptain]
    code: 200
    input: [status]
    output: Tower
    side_effects: []

  # ---- Lifeguard ----
  - method: POST
    path: "/beach-ops/lifeguards"
    description: "Create a lifeguard"
    roles: [BeachCaptain]
    code: 201
    input: [beach_id, name, certification_level, employee_ref]
    output: Lifeguard
    side_effects: []

  - method: GET
    path: "/beach-ops/lifeguards/{lifeguard_id}"
    description: "Get a lifeguard"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: []
    output: Lifeguard
    side_effects: []

  - method: GET
    path: "/beach-ops/lifeguards"
    description: "List lifeguards (filterable by beach)"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: ["beach_id?", "limit?", "offset?"]
    output: Lifeguard[]
    side_effects: []

  # ---- Shift ----
  - method: POST
    path: "/beach-ops/shifts"
    description: "Schedule a shift (lifeguard on a tower over a window)"
    roles: [BeachCaptain]
    code: 201
    input: [lifeguard_id, tower_id, scheduled_start, scheduled_end]
    output: Shift
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/beach-ops/shifts/{shift_id}"
    description: "Get a shift"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: []
    output: Shift
    side_effects: []

  - method: GET
    path: "/beach-ops/shifts"
    description: "List shifts (filterable by lifeguard and/or tower)"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: ["lifeguard_id?", "tower_id?", "limit?", "offset?"]
    output: Shift[]
    side_effects: []

  - method: POST
    path: "/beach-ops/shifts/{shift_id}/transitions"
    description: "Drive shift lifecycle (CLOCK_IN, BREAK, RESUME, CLOCK_OUT, CANCEL)"
    roles: [Lifeguard, BeachCaptain]
    code: 200
    input: [action, "cancel_reason?"]
    output: Shift
    side_effects: ["state transition; recomputes Zone.on_duty_guard_count; may cascade zone flag to RED"]

  # ---- Incident ----
  - method: POST
    path: "/beach-ops/incidents"
    description: "Log an incident (rescue / medical / lost-child / first-aid)"
    roles: [Lifeguard]
    code: 201
    input: [zone_id, type, occurred_at, description, "severity?", "victim_count?", "lifeguard_id?"]
    output: Incident
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/beach-ops/incidents/{incident_id}"
    description: "Get an incident"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/beach-ops/incidents"
    description: "List incidents (filterable by zone and/or lifeguard)"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: ["zone_id?", "lifeguard_id?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  - method: POST
    path: "/beach-ops/incidents/{incident_id}/transitions"
    description: "Drive incident lifecycle (RESOLVE_ON_SCENE, ESCALATE_EMS, REUNITE, CLOSE)"
    roles: [Lifeguard]
    code: 200
    input: [action, "ems_transported?", "ems_hospital?", "ems_unit?", "ems_narrative?"]
    output: Incident
    side_effects: ["state transition; ESCALATE_EMS populates ems_* fields"]

  # ---- Water-quality samples ----
  - method: POST
    path: "/beach-ops/water-quality-samples"
    description: "Record a bacteria sample for a zone"
    roles: [WaterQualityInspector]
    code: 201
    input: [zone_id, enterococci_mpn, sampled_at, lab_ref, technician]
    output: WaterQualitySample
    side_effects: []

  - method: GET
    path: "/beach-ops/water-quality-samples/{sample_id}"
    description: "Get a sample"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: []
    output: WaterQualitySample
    side_effects: []

  - method: GET
    path: "/beach-ops/water-quality-samples"
    description: "List samples (filterable by zone)"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: ["zone_id?", "limit?", "offset?"]
    output: WaterQualitySample[]
    side_effects: []

  # ---- Advisory ----
  - method: GET
    path: "/beach-ops/advisories/{advisory_id}"
    description: "Get an advisory"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: []
    output: Advisory
    side_effects: []

  - method: GET
    path: "/beach-ops/advisories"
    description: "List advisories (filterable by zone)"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: ["zone_id?", "limit?", "offset?"]
    output: Advisory[]
    side_effects: []

  - method: POST
    path: "/beach-ops/advisories/{advisory_id}/lift"
    description: "Lift an ACTIVE advisory; a CLOSURE lift reopens the zone water"
    roles: [WaterQualityInspector]
    code: 200
    input: ["reason?"]
    output: Advisory
    side_effects: ["advisory -> LIFTED; CLOSURE lift sets Zone.water_status OPEN, flag BLACK->RED, bumps Zone.version"]

  # ---- Parking ----
  - method: POST
    path: "/beach-ops/parking-lots"
    description: "Create a parking lot under a beach"
    roles: [ParkingClerk, BeachCaptain]
    code: 201
    input: [beach_id, name, total_spaces, daily_rate_cents]
    output: ParkingLot
    side_effects: ["available_spaces=total_spaces"]

  - method: GET
    path: "/beach-ops/parking-lots/{lot_id}"
    description: "Get a parking lot"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: []
    output: ParkingLot
    side_effects: []

  - method: GET
    path: "/beach-ops/parking-lots"
    description: "List parking lots (filterable by beach)"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: ["beach_id?", "limit?", "offset?"]
    output: ParkingLot[]
    side_effects: []

  - method: POST
    path: "/beach-ops/parking-passes"
    description: "Issue a parking / resident pass against a lot"
    roles: [ParkingClerk]
    code: 201
    input: [lot_id, plate, vehicle_type, pass_type, "is_resident?"]
    output: ParkingPass
    side_effects: ["computes fee_cents via parking_fee; decrements lot.available_spaces"]

  - method: GET
    path: "/beach-ops/parking-passes/{pass_id}"
    description: "Get a parking pass"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: []
    output: ParkingPass
    side_effects: []

  - method: GET
    path: "/beach-ops/parking-passes"
    description: "List parking passes (filterable by lot)"
    roles: [BeachCaptain, Lifeguard, WaterQualityInspector, ParkingClerk, Public]
    code: 200
    input: ["lot_id?", "limit?", "offset?"]
    output: ParkingPass[]
    side_effects: []

  - method: POST
    path: "/beach-ops/parking-passes/{pass_id}/revoke"
    description: "Revoke an ACTIVE parking pass (compensating action)"
    roles: [ParkingClerk]
    code: 200
    input: ["reason?"]
    output: ParkingPass
    side_effects: ["pass -> REVOKED; increments lot.available_spaces"]

  # ---- Test-driving logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [BeachCaptain]
    code: 200
    input: [to_iso8601]
    output: "{ now: string }"
    side_effects: ["logical clock advanced/rewound to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A path or FK id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or invalid enum/type" }
  - { id: ERR_SHIFT_WINDOW_INVALID, http: 422, condition: "Shift scheduled_end <= scheduled_start" }
  - { id: ERR_SEASON_DATES_INVALID, http: 422, condition: "Beach season_end_date <= season_start_date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_zone_version does not match current Zone.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition illegal from the resource's current state" }
  - { id: ERR_TOWER_OFFLINE, http: 409, condition: "Tower is OFFLINE; cannot schedule onto it or clock into it" }
  - { id: ERR_ADVISORY_NOT_ACTIVE, http: 409, condition: "Advisory is not ACTIVE and cannot be lifted" }
  - { id: ERR_PASS_NOT_ACTIVE, http: 409, condition: "Parking pass is not ACTIVE and cannot be revoked" }
  - { id: ERR_ZONE_UNDER_CLOSURE, http: 409, condition: "Zone has an ACTIVE CLOSURE advisory; cannot raise a swim flag" }
  - { id: ERR_RIP_CURRENT_UNSAFE, http: 409, condition: "rip_current_level is HIGH; cannot raise a swim flag" }
  - { id: ERR_INCIDENT_TYPE_MISMATCH, http: 422, condition: "REUNITE attempted on a non-LOST_CHILD incident" }
  - { id: ERR_LIFEGUARD_DOUBLE_BOOKED, http: 409, condition: "Overlapping non-cancelled shift for the same lifeguard" }
  - { id: ERR_TOWER_CAPACITY_EXCEEDED, http: 409, condition: "Shift would exceed tower.max_concurrent_guards at some instant" }
  - { id: ERR_ZONE_UNDERSTAFFED, http: 409, condition: "on_duty_guard_count below min_guards_required when raising a swim flag" }
  - { id: ERR_EMS_DETAILS_REQUIRED, http: 422, condition: "ESCALATE_EMS missing one of ems_hospital/ems_unit/ems_narrative/ems_transported" }
  - { id: ERR_LOT_FULL, http: 409, condition: "Parking lot has no available spaces" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BeachCaptain
    description: "Operations lead: beaches, zones, flags, towers, lifeguards, shift scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /beach-ops/beaches"
      - "POST /beach-ops/zones"
      - "POST /beach-ops/zones/{zone_id}/flag"
      - "POST /beach-ops/zones/{zone_id}/conditions"
      - "POST /beach-ops/towers"
      - "POST /beach-ops/towers/{tower_id}/status"
      - "POST /beach-ops/lifeguards"
      - "POST /beach-ops/shifts"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /beach-ops/shifts/{shift_id}/transitions (CANCEL)"
      - "POST /beach-ops/parking-lots"
      - "GET (all read endpoints)"

  - name: Lifeguard
    description: "Front-line guard: clocks own shifts, logs incidents / lost-child / first-aid"
    identity: "entity_backed:Lifeguard"
    exclusive_operations:
      - "POST /beach-ops/incidents"
      - "POST /beach-ops/incidents/{incident_id}/transitions"
    shared_operations:
      - "POST /beach-ops/shifts/{shift_id}/transitions (CLOCK_IN, BREAK, RESUME, CLOCK_OUT)"
      - "GET (all read endpoints)"

  - name: WaterQualityInspector
    description: "Public-health inspector: bacteria samples, advisories, closures/lifts"
    identity: opaque
    exclusive_operations:
      - "POST /beach-ops/water-quality-samples"
      - "POST /beach-ops/zones/{zone_id}/advisories"
      - "POST /beach-ops/advisories/{advisory_id}/lift"
    shared_operations:
      - "GET (all read endpoints)"

  - name: ParkingClerk
    description: "Parking / resident-pass operator"
    identity: opaque
    exclusive_operations:
      - "POST /beach-ops/parking-passes"
      - "POST /beach-ops/parking-passes/{pass_id}/revoke"
    shared_operations:
      - "POST /beach-ops/parking-lots"
      - "GET (all read endpoints)"

  - name: Public
    description: "Unauthenticated-equivalent read-only consumer (kiosk / public site)"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET (all read endpoints)"
