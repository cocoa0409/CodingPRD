              as_user_id: "agent-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"
            - "HTTP status is 403"
            - "GET /api/policy-cases with app_id ${app_id} returns 0 cases"

      - name: corner_finance_ops_cannot_approve_payout_batch
        claim_type: Role denial
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
          - roles.FinanceOps
        distinguishing_aspect: "Segregation of duties at role level: FinanceOps submits a batch but only PlatformAdmin may approve it, so a FinanceOps approve returns ERR_UNAUTHORIZED (403) and the batch stays PENDING_APPROVAL."
        test_recipe:
          setup: ["An OPEN USD batch that FinanceOps calculated (0 eligible lines) and submitted for approval."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
