      - name: vendor_poll_empty_pool_and_zone_capacity_boundaries
        grounds:
          - validations[priority=22]
          - calculations.defense_dispatch_priority
          - errors[ERR_NO_ELIGIBLE_VENDOR]
          - errors[ERR_ZONE_DISPATCH_CAPACITY]
        distinguishing_aspect: "A non-numeric boundary on a different endpoint: the vendor poll distinguishes an EMPTY candidate set (zero dispatches eligible, ERR_NO_ELIGIBLE_VENDOR) from a SATURATED set (two overlapping assignments already holding the zone, ERR_ZONE_DISPATCH_CAPACITY excluding the third), so the two refusals are not interchangeable and each needs its own fixture."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Zone ZM1, three properties on it, and an ACTIVE event; ZM2 also ACTIVE but with no dispatch requests at all."
          setup_api_calls:
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZM1", state_code: "CA", wildland_urban_interface_band: "WITHIN_WUI", sustained_wind_mph: 50, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "EXTREME", state_event: "ACTIVE" }
              as: PlatformAdmin
              captures: { z1_id: $.data.id }
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZM2", state_code: "CA", wildland_urban_interface_band: "WITHIN_WUI", sustained_wind_mph: 50, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "EXTREME", state_event: "ACTIVE" }
              as: PlatformAdmin
              captures: { z2_id: $.data.id }
