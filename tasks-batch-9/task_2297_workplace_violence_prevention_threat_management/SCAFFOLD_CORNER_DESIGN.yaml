      - name: hazard_coverage_percentage_over_three_areas
        claim_type: aggregation
        grounds:
          - calculations.plan_compliance_metrics
          - entities.PreventionPlan.fields.hazard_coverage_pct
          - entities.PreventionPlan.fields.unmitigated_hazard_count
          - endpoints[POST /hazard-assessments]
          - concurrency_rules[hazard-assessment-create-stale-plan]
        distinguishing_aspect: |
          The coverage denominator is the WorkArea count of the worksite, so three areas make the
          percentage a repeating decimal that must be rounded half-up at 2dp on each write: 1/3 is 33.33
          (rounded down) and 2/3 is 66.67 (rounded up), and only the third assessment reaches exactly
          100.00 - the value the activation gate demands.
        test_recipe:
          setup:
