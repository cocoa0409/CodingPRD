scenario: |
  804. Childcare Subsidy Voucher (CCDF): family income/activity eligibility, sliding-fee copay
  calculation, provider selection & rate-ceiling, attendance-based authorization & payment,
  provider-licensing verification, redetermination & continuity-of-care, absence-day policy,
  overpayment recovery
domain_name: childcare-subsidy-voucher
api_prefix: /ccdf

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities (Family, Provider, Authorization, AttendanceRecord, Payment, OverpaymentClaim)
  # linked by foreign keys in bodies, not by URL nesting. Config entities (IncomeStandard,
  # RateCeiling) are looked up by attribute, not owned in a tree.

  state_machine_shape: cyclic
  # Provider (EXPIRED<->LICENSED renew loop), Authorization (ACTIVE<->SUSPENDED reinstate loop),
  # AttendanceRecord (REJECTED<->SUBMITTED resubmit loop) are all non-linear.

  relationship_patterns:
    - one_to_many        # Family -> {ParentActivity, EligibilityDetermination, Authorization}
    - cross_aggregate    # Authorization references Provider and EligibilityDetermination across aggregates

  role_model: peer_roles
  # Family owns applications, Provider owns attendance, CaseWorker owns determinations/authorizations,
  # ProgramAdmin owns config/licensing/recovery. Non-overlapping resource ownership.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Family
    parent: null
    common_fields: true
    fields:
      - name: applicant_name
        type: string
        source: input
        description: primary applicant / head of household name
      - name: household_size
        type: integer
        source: input
        description: number of persons in the household; keys the IncomeStandard lookup
        constraints: ">= 1"
      - name: monthly_gross_income_cents
        type: integer
        source: input
        description: reported monthly gross wage/salary income in cents
        constraints: ">= 0"
      - name: monthly_self_employment_income_cents
        type: integer
        source: input
        description: monthly self-employment income in cents; unverified at INITIAL, counted at REDETERMINATION
        default: 0
        constraints: ">= 0"
      - name: state_code
        type: string
        source: input
        description: two-letter state code; must match the IncomeStandard/RateCeiling state
      - name: status
        type: enum
        source: system
        description: household eligibility posture derived from its determinations
        default: PENDING
        constraints: "PENDING | ELIGIBLE | INELIGIBLE | CLOSED"
      - name: active_authorization_id
        type: string
        source: system
        description: id of the household's current (superseding) Authorization; set on authorization create
        default: null
      - name: total_copay_charged_cents
        type: integer
        source: computed
        description: running family copay ledger = sum(Payment.copay_deducted_cents WHERE Payment.status == PAID)
        default: 0

  - name: ParentActivity
    parent: null
    common_fields: false
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; the household this activity qualifies"
      - name: activity_type
        type: enum
        source: input
        description: qualifying activity category
        constraints: "WORK | EDUCATION | JOB_SEARCH"
      - name: weekly_hours
        type: integer
        source: input
        description: hours per week spent in this activity
        constraints: ">= 0"

  - name: IncomeStandard
    parent: null
    common_fields: false
    fields:
      - name: household_size
        type: integer
        source: input
        description: household size this standard applies to
      - name: entry_monthly_limit_cents
        type: integer
        source: input
        description: initial-eligibility income ceiling (85% SMI proxy) in cents
      - name: exit_monthly_limit_cents
        type: integer
        source: input
        description: continuity-of-care redetermination income ceiling in cents; must be >= entry limit
      - name: state_code
        type: string
        source: input
        description: two-letter state code this standard applies to

  - name: EligibilityDetermination
    parent: null
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; household under determination"
      - name: determination_type
        type: enum
        source: input
        description: INITIAL applies entry limit and provisional (gross-only) copay; REDETERMINATION applies exit limit and verified (gross+self-employment) copay
        constraints: "INITIAL | REDETERMINATION"
      - name: countable_income_cents
        type: integer
        source: computed
        description: income base selected by determination_type variant (see calc copay_determination)
        default: 0
      - name: income_eligible
        type: boolean
        source: computed
        description: countable_income_cents <= applicable limit (entry for INITIAL, exit for REDETERMINATION)
        default: false
      - name: activity_eligible
        type: boolean
        source: computed
        description: sum of ParentActivity.weekly_hours for the family >= MIN_WEEKLY_ACTIVITY_HOURS
        default: false
      - name: result
        type: enum
        source: computed
        description: APPROVED when income_eligible AND activity_eligible, else DENIED
        default: null
        constraints: "APPROVED | DENIED"
      - name: monthly_copay_cents
        type: integer
        source: computed
        description: sliding-fee family copay for the month (see calc copay_determination)
        default: 0
      - name: effective_date
        type: datetime
        source: computed
        description: logical clock time at finalize-approve; ISO8601 UTC
        default: null
      - name: redetermination_due_date
        type: datetime
        source: computed
        description: effective_date + REDETERMINATION_MONTHS; the continuity/redetermination deadline
        default: null
      - name: status
        type: enum
        source: system
        description: determination lifecycle
        default: PENDING
        constraints: "PENDING | APPROVED | DENIED | EXPIRED"

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: provider legal/business name
      - name: provider_type
        type: enum
        source: input
        description: licensing/rate-ceiling category
        constraints: "CENTER | FAMILY_HOME"
      - name: published_daily_rate_cents
        type: integer
        source: input
        description: the provider's own posted private-pay daily rate in cents
        constraints: ">= 0"
      - name: license_expiry_date
        type: datetime
        source: input
        description: date the current license lapses; ISO8601 UTC
      - name: license_status
        type: enum
        source: system
        description: licensing posture; gates authorization activation
        default: PENDING_VERIFICATION
        constraints: "PENDING_VERIFICATION | LICENSED | REJECTED | EXPIRED | REVOKED"
      - name: state_code
        type: string
        source: input
        description: two-letter state code
      - name: total_net_paid_cents
        type: integer
        source: computed
        description: running provider payment ledger = sum(Payment.net_provider_payment_cents WHERE Payment.status == PAID)
        default: 0

  - name: RateCeiling
    parent: null
    common_fields: false
    fields:
      - name: provider_type
        type: enum
        source: input
        description: provider category this ceiling applies to
        constraints: "CENTER | FAMILY_HOME"
      - name: care_level
        type: enum
        source: input
        description: child care level this ceiling applies to
        constraints: "INFANT | TODDLER | PRESCHOOL | SCHOOL_AGE"
      - name: max_daily_rate_cents
        type: integer
        source: input
        description: maximum reimbursable daily rate in cents for (provider_type, care_level)
        constraints: ">= 0"
      - name: effective_start
        type: datetime
        source: input
        description: inclusive start of ceiling effective window (closed interval); ISO8601 UTC
      - name: effective_end
        type: datetime
        source: input
        description: inclusive end of ceiling effective window (closed interval); ISO8601 UTC
      - name: state_code
        type: string
        source: input
        description: two-letter state code

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; household holding the voucher"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; selected provider"
      - name: determination_id
        type: string
        source: input
        description: "FK -> EligibilityDetermination.id; the determination this voucher rests on"
      - name: child_name
        type: string
        source: input
        description: name of the child served; overlap uniqueness key together with family_id
      - name: care_level
        type: enum
        source: input
        description: care level for rate-ceiling lookup
        constraints: "INFANT | TODDLER | PRESCHOOL | SCHOOL_AGE"
      - name: start_date
        type: datetime
        source: input
        description: inclusive authorization start; overlap uses half-open [start_date, end_date)
      - name: end_date
        type: datetime
        source: input
        description: exclusive authorization end; ISO8601 UTC
      - name: authorized_days_per_month
        type: integer
        source: input
        description: planned billable days per service month
        constraints: ">= 1"
      - name: authorized_daily_rate_cents
        type: integer
        source: computed
        description: min(Provider.published_daily_rate_cents, RateCeiling.max_daily_rate_cents) at create (see calc authorized_daily_rate)
        default: 0
      - name: monthly_copay_cents
        type: integer
        source: computed
        description: copied from EligibilityDetermination.monthly_copay_cents at create
        default: 0
      - name: estimated_monthly_payment_cents
        type: integer
        source: computed
        description: forward-looking estimate (see calc payment_computation, ESTIMATED variant)
        default: 0
      - name: status
        type: enum
        source: system
        description: voucher lifecycle
        default: PENDING
        constraints: "PENDING | ACTIVE | SUSPENDED | TERMINATED | EXPIRED"

  - name: AttendanceRecord
    parent: null
    common_fields: true
    fields:
      - name: authorization_id
        type: string
        source: input
        description: "FK -> Authorization.id; voucher being billed"
      - name: service_month
        type: string
        source: input
        description: billed month as YYYY-MM; unique per authorization
      - name: present_days
        type: integer
        source: input
        description: days the child was present
        constraints: ">= 0"
      - name: absent_days
        type: integer
        source: input
        description: days the child was absent
        constraints: ">= 0"
      - name: payable_days
        type: integer
        source: computed
        description: present_days + min(absent_days, MAX_PAID_ABSENCE_DAYS); computed at approve
        default: 0
      - name: status
        type: enum
        source: system
        description: attendance lifecycle
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | REJECTED"

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: attendance_record_id
        type: string
        source: input
        description: "FK -> AttendanceRecord.id; the approved attendance that produced this payment"
      - name: provider_id
        type: string
        source: system
        description: denormalized recipient provider id (copied from the authorization); not an owned FK path
      - name: family_id
        type: string
        source: system
        description: denormalized household id (copied from the authorization); not an owned FK path
      - name: service_month
        type: string
        source: system
        description: denormalized YYYY-MM from the attendance record
      - name: gross_amount_cents
        type: integer
        source: computed
        description: authorized_daily_rate_cents * payable_days (see calc payment_computation, ACTUAL variant)
        default: 0
      - name: copay_deducted_cents
        type: integer
        source: computed
        description: prorated family copay withheld (see calc copay_proration)
        default: 0
      - name: net_provider_payment_cents
        type: integer
        source: computed
        description: max(0, gross_amount_cents - copay_deducted_cents)
        default: 0
      - name: status
        type: enum
        source: system
        description: payment lifecycle
        default: PAID
        constraints: "PAID | REVERSED"

  - name: OverpaymentClaim
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; provider owing the overpayment"
      - name: payment_id
        type: string
        source: input
        description: "FK -> Payment.id; the reversed payment that generated the claim"
      - name: amount_cents
        type: integer
        source: computed
        description: original overpaid amount = reversed Payment.net_provider_payment_cents at reversal
        default: 0
      - name: recovered_amount_cents
        type: integer
        source: input
        description: cumulative amount recovered so far
        default: 0
        constraints: ">= 0 and <= amount_cents"
      - name: reason
        type: enum
        source: system
        description: why the claim was raised
        default: PAYMENT_REVERSAL
        constraints: "PAYMENT_REVERSAL | LICENSE_REVOKED | INELIGIBLE_PERIOD"
      - name: status
        type: enum
        source: system
        description: recovery lifecycle
        default: OPEN
        constraints: "OPEN | RECOVERING | RECOVERED | WAIVED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EligibilityDetermination
    initial_state: PENDING
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /ccdf/determinations/{id}/finalize"
        actor: CaseWorker
        preconditions:
          - "an IncomeStandard exists for (family.household_size, family.state_code)"
          - "income_eligible AND activity_eligible both true after computation"
        side_effects:
          - "compute countable_income_cents, monthly_copay_cents via calc copay_determination"
          - "set income_eligible, activity_eligible, result=APPROVED"
          - "set effective_date = logical clock now; redetermination_due_date = effective_date + REDETERMINATION_MONTHS"
          - "set Family.status = ELIGIBLE (increments Family.version by 1)"
      - from: PENDING
        to: DENIED
        trigger: "POST /ccdf/determinations/{id}/finalize"
        actor: CaseWorker
        preconditions:
          - "an IncomeStandard exists for (family.household_size, family.state_code)"
          - "income_eligible is false OR activity_eligible is false after computation"
        side_effects:
          - "set result=DENIED; monthly_copay_cents stays 0"
          - "set Family.status = INELIGIBLE (increments Family.version by 1)"
          - "cascade B: every Authorization with this determination_id in {PENDING, ACTIVE, SUSPENDED} transitions to TERMINATED"
      - from: APPROVED
        to: EXPIRED
        trigger: "system sweep on POST /ccdf/_clock/set_current_utc"
        actor: system
        preconditions:
          - "redetermination_due_date < logical clock now"
        side_effects:
          - "set status=EXPIRED (redetermination overdue)"

  - entity: Provider
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: PENDING_VERIFICATION
        to: LICENSED
        trigger: "POST /ccdf/providers/{id}/license (action=VERIFY)"
        actor: ProgramAdmin
        preconditions:
          - "license_expiry_date > logical clock now"
        side_effects: ["set license_status=LICENSED"]
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /ccdf/providers/{id}/license (action=REJECT)"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["set license_status=REJECTED"]
      - from: LICENSED
        to: REVOKED
        trigger: "POST /ccdf/providers/{id}/license (action=REVOKE)"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "set license_status=REVOKED"
          - "cascade A (hop 1): every ACTIVE Authorization for this provider transitions to SUSPENDED"
      - from: LICENSED
        to: EXPIRED
        trigger: "system sweep on POST /ccdf/_clock/set_current_utc"
        actor: system
        preconditions:
          - "license_expiry_date < logical clock now"
        side_effects:
          - "set license_status=EXPIRED"
      - from: EXPIRED
        to: LICENSED
        trigger: "POST /ccdf/providers/{id}/license (action=RENEW)"
        actor: ProgramAdmin
        preconditions:
          - "input license_expiry_date > logical clock now"
        side_effects:
          - "set license_expiry_date = input value; set license_status=LICENSED"
        note: "cycle EXPIRED->LICENSED (license renewal loop)"

  - entity: Authorization
    initial_state: PENDING
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /ccdf/authorizations/{id}/activate"
        actor: CaseWorker
        preconditions:
          - "Provider.license_status == LICENSED (cross-entity: Authorization depends on Provider)"
          - "EligibilityDetermination.family_id == Authorization.family_id"
          - "EligibilityDetermination.status == APPROVED (not EXPIRED)"
        side_effects: ["set status=ACTIVE"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /ccdf/authorizations/{id}/suspend OR cascade A hop 1 from provider REVOKE"
        actor: CaseWorker
        preconditions: []
        side_effects:
          - "set status=SUSPENDED"
          - "cascade A (hop 2): every AttendanceRecord for this authorization in SUBMITTED transitions to REJECTED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /ccdf/authorizations/{id}/reinstate"
        actor: CaseWorker
        preconditions:
          - "Provider.license_status == LICENSED"
        side_effects: ["set status=ACTIVE"]
        note: "cycle ACTIVE<->SUSPENDED (suspend/reinstate loop)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /ccdf/authorizations/{id}/terminate OR cascade B from determination DENIED"
        actor: CaseWorker
        preconditions: []
        side_effects: ["set status=TERMINATED"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /ccdf/authorizations/{id}/terminate OR cascade B from determination DENIED"
        actor: CaseWorker
        preconditions: []
        side_effects: ["set status=TERMINATED"]
      - from: PENDING
        to: TERMINATED
        trigger: "cascade B from determination DENIED"
        actor: system
        preconditions: []
        side_effects: ["set status=TERMINATED"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep on POST /ccdf/_clock/set_current_utc"
        actor: system
        preconditions:
          - "end_date < logical clock now"
        side_effects: ["set status=EXPIRED"]

  - entity: AttendanceRecord
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ccdf/attendance-records/{id}/approve"
        actor: CaseWorker
        preconditions:
          - "Authorization.status == ACTIVE (cross-entity: AttendanceRecord depends on Authorization)"
          - "present_days + absent_days <= days_in(service_month)"
        side_effects:
          - "compute payable_days via calc payment_computation"
          - "create Payment in status=PAID with computed gross/copay/net"
          - "Provider.total_net_paid_cents += Payment.net_provider_payment_cents"
          - "Family.total_copay_charged_cents += Payment.copay_deducted_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ccdf/attendance-records/{id}/reject OR cascade A hop 2 from authorization SUSPEND"
        actor: CaseWorker
        preconditions: []
        side_effects: ["set status=REJECTED"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /ccdf/attendance-records/{id}/resubmit"
        actor: Provider
        preconditions:
          - "Authorization.status == ACTIVE"
        side_effects: ["set status=SUBMITTED; overwrite present_days/absent_days if supplied"]
        note: "cycle SUBMITTED<->REJECTED (reject/resubmit loop)"

  - entity: Payment
    initial_state: PAID
    terminal_states: [REVERSED]
    transitions:
      - from: PAID
        to: REVERSED
        trigger: "POST /ccdf/payments/{id}/reverse"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "set status=REVERSED"
          - "Provider.total_net_paid_cents -= net_provider_payment_cents"
          - "Family.total_copay_charged_cents -= copay_deducted_cents"
          - "create OverpaymentClaim (reason=PAYMENT_REVERSAL, amount_cents = this payment's net_provider_payment_cents, status=OPEN)"

  - entity: OverpaymentClaim
    initial_state: OPEN
    terminal_states: [RECOVERED, WAIVED]
    transitions:
      - from: OPEN
        to: RECOVERING
        trigger: "POST /ccdf/overpayment-claims/{id}/record-recovery"
        actor: ProgramAdmin
        preconditions:
          - "0 < input recovered_amount_cents; running recovered_amount_cents < amount_cents after add"
        side_effects: ["recovered_amount_cents += input; set status=RECOVERING"]
      - from: RECOVERING
        to: RECOVERING
        trigger: "POST /ccdf/overpayment-claims/{id}/record-recovery"
        actor: ProgramAdmin
        preconditions:
          - "running recovered_amount_cents < amount_cents after add"
        side_effects: ["recovered_amount_cents += input"]
      - from: OPEN
        to: RECOVERED
        trigger: "POST /ccdf/overpayment-claims/{id}/record-recovery"
        actor: ProgramAdmin
        preconditions:
          - "recovered_amount_cents + input == amount_cents"
        side_effects: ["recovered_amount_cents = amount_cents; set status=RECOVERED"]
      - from: RECOVERING
        to: RECOVERED
        trigger: "POST /ccdf/overpayment-claims/{id}/record-recovery"
        actor: ProgramAdmin
        preconditions:
          - "recovered_amount_cents + input == amount_cents"
        side_effects: ["recovered_amount_cents = amount_cents; set status=RECOVERED"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /ccdf/overpayment-claims/{id}/waive"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["set status=WAIVED"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: authorization-create-stale-family
    parent_entity: Family
    write_endpoint: "POST /ccdf/authorizations"
    occ_field: "expected_family_version"
    description: |
      Creating a new Authorization supersedes the household's prior active voucher
      (continuity-of-care renewal): it sets Family.active_authorization_id and, when a
      prior ACTIVE Authorization exists for the same child_name, terminates it. Because
      a new voucher legitimately supersedes the prior one, a create carrying a
      Family.version older than the current persisted version is rejected as stale — the
      client's view of the household predates a superseding authorization already recorded.
    error_id: ERR_STALE_FAMILY_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: copay_determination
    trigger: "POST /ccdf/determinations/{id}/finalize (PENDING->APPROVED)"
    algorithm: tiered_pricing
    formula: |
      # income base is variant-selected:
      if determination_type == INITIAL:
          countable_income_cents = family.monthly_gross_income_cents                                   # PROVISIONAL
          limit = income_standard.entry_monthly_limit_cents
      else: # REDETERMINATION
          countable_income_cents = family.monthly_gross_income_cents + family.monthly_self_employment_income_cents  # VERIFIED
          limit = income_standard.exit_monthly_limit_cents
      income_eligible = countable_income_cents <= limit
      activity_eligible = sum(ParentActivity.weekly_hours for family) >= MIN_WEEKLY_ACTIVITY_HOURS
      if not (income_eligible and activity_eligible): result=DENIED; monthly_copay_cents=0; return
      # sliding-fee band keyed on ratio vs the ENTRY limit (same denominator both variants):
      ratio = countable_income_cents / income_standard.entry_monthly_limit_cents
      pct = first COPAY_BANDS[b].pct where ratio <= COPAY_BANDS[b].max_ratio   # ascending scan
      monthly_copay_cents = round_half_up(countable_income_cents * pct / 100)
    input_set: "one Family, its ACTIVE-scope ParentActivity rows (all rows count), one IncomeStandard matched on (household_size, state_code)"
    constants:
      MIN_WEEKLY_ACTIVITY_HOURS: 20
      REDETERMINATION_MONTHS: 12
      COPAY_BANDS:
        - { max_ratio: 0.50, pct: 2 }
        - { max_ratio: 0.75, pct: 5 }
        - { max_ratio: 1.00, pct: 8 }
        - { max_ratio: 1.25, pct: 10 }
    precision: "cents integer; round_half_up on the copay product"
    variants:
      - name: PROVISIONAL
        when: "determination_type == INITIAL"
        difference: "countable income = gross only; eligibility tested against entry_monthly_limit_cents"
      - name: VERIFIED
        when: "determination_type == REDETERMINATION"
        difference: "countable income = gross + self-employment; eligibility tested against exit_monthly_limit_cents (continuity of care)"

  - name: authorized_daily_rate
    trigger: "POST /ccdf/authorizations (create)"
    algorithm: threshold
    formula: |
      ceiling = the RateCeiling matching (provider.provider_type, authorization.care_level, provider.state_code)
                whose [effective_start, effective_end] (closed) contains authorization.start_date;
                if several match, choose the one with the latest effective_start, tie-break latest created_at
      authorized_daily_rate_cents = min(provider.published_daily_rate_cents, ceiling.max_daily_rate_cents)
      monthly_copay_cents = determination.monthly_copay_cents            # copied onto the authorization
    input_set: "one Provider, one Authorization, the matching RateCeiling"
    constants: {}
    precision: "cents integer; min() of two integers, no rounding"

  - name: payment_computation
    trigger: "POST /ccdf/attendance-records/{id}/approve (SUBMITTED->APPROVED), plus ESTIMATED at authorization create"
    algorithm: aggregation
    formula: |
      # ACTUAL (at approve):
      payable_days = present_days + min(absent_days, MAX_PAID_ABSENCE_DAYS)
      gross_amount_cents = authorization.authorized_daily_rate_cents * payable_days
      copay_deducted_cents = copay_proration(monthly_copay_cents, authorized_days_per_month, payable_days)
      net_provider_payment_cents = max(0, gross_amount_cents - copay_deducted_cents)
    input_set: "one AttendanceRecord + its Authorization"
    constants:
      MAX_PAID_ABSENCE_DAYS: 5
    precision: "cents integer"
    variants:
      - name: ESTIMATED
        when: "computed at Authorization create for estimated_monthly_payment_cents"
        difference: "assumes full attendance: payable_days = authorized_days_per_month and the FULL monthly_copay_cents is deducted (not prorated): estimated_monthly_payment_cents = max(0, authorized_daily_rate_cents * authorized_days_per_month - monthly_copay_cents)"
      - name: ACTUAL
        when: "computed at attendance approve for the Payment row"
        difference: "uses observed payable_days (with absence cap) and the PRORATED copay from calc copay_proration"

  - name: copay_proration
    trigger: "within payment_computation ACTUAL at attendance approve"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round the per-day copay FIRST, then multiply by payable days.
      daily_copay_cents = round_half_up(monthly_copay_cents / authorized_days_per_month)   # step 1: round
      copay_deducted_cents = daily_copay_cents * payable_days                               # step 2: multiply
      # This is deliberately NOT round_half_up(monthly_copay_cents * payable_days / authorized_days_per_month).
    input_set: "one Authorization's monthly_copay_cents and authorized_days_per_month; the AttendanceRecord payable_days"
    constants: {}
    precision: "round_half_up on the per-day quotient in step 1; exact integer multiply in step 2"

  - name: overpayment_amount
    trigger: "POST /ccdf/payments/{id}/reverse (PAID->REVERSED)"
    algorithm: aggregation
    formula: |
      OverpaymentClaim.amount_cents = reversed_payment.net_provider_payment_cents
      # conserved-quantity effects (see invariants): on reversal,
      #   Provider.total_net_paid_cents      -= reversed_payment.net_provider_payment_cents
      #   Family.total_copay_charged_cents   -= reversed_payment.copay_deducted_cents
    input_set: "one reversed Payment"
    constants: {}
    precision: "cents integer"

# =============================================================================
# Conserved-quantity invariants (compensating actions)
# =============================================================================
invariants:
  - name: provider_payment_ledger_conserved
    conserved_quantity: "Provider.total_net_paid_cents"
    formula: "Provider.total_net_paid_cents == sum(Payment.net_provider_payment_cents WHERE Payment.provider_id == Provider.id AND Payment.status == PAID)"
    forward_action: "attendance approve -> Payment PAID adds net_provider_payment_cents"
    compensating_action: "payment reverse -> Payment REVERSED subtracts the same net"
    note: "after approve then reverse of the same attendance, Provider.total_net_paid_cents returns to its pre-approve value; no drift"

  - name: family_copay_ledger_conserved
    conserved_quantity: "Family.total_copay_charged_cents"
    formula: "Family.total_copay_charged_cents == sum(Payment.copay_deducted_cents WHERE Payment.family_id == Family.id AND Payment.status == PAID)"
    forward_action: "attendance approve -> Payment PAID adds copay_deducted_cents"
    compensating_action: "payment reverse -> Payment REVERSED subtracts the same copay_deducted_cents"
    note: "distinct conserved quantity (family copay obligation) from provider_payment_ledger_conserved (provider disbursement)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "role permitted for this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path id and body FK id resolves, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (finalize, activate, suspend, reinstate, terminate, approve, reject, resubmit, reverse, license, record-recovery, waive)"
  - priority: 5
    category: business_referential
    check: "on authorization activate, EligibilityDetermination.family_id == Authorization.family_id"
    error_id: ERR_DETERMINATION_FAMILY_MISMATCH
    http_status: 409
    applies_to: "POST /ccdf/authorizations/{id}/activate"
  - priority: 6
    category: business_safety
    check: "on authorization activate/reinstate, Provider.license_status == LICENSED"
    error_id: ERR_PROVIDER_NOT_LICENSED
    http_status: 409
    applies_to: "POST /ccdf/authorizations/{id}/activate, POST /ccdf/authorizations/{id}/reinstate"
  - priority: 7
    category: business_referential
    check: "on authorization activate, EligibilityDetermination.status == APPROVED (not EXPIRED/DENIED/PENDING)"
    error_id: ERR_DETERMINATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /ccdf/authorizations/{id}/activate"
  - priority: 8
    category: business_temporal
    check: "on authorization create, no other non-terminal Authorization for the same (family_id, child_name) whose [start_date, end_date) half-open interval overlaps (adjacency end==start allowed)"
    error_id: ERR_AUTHORIZATION_OVERLAP
    http_status: 409
    applies_to: "POST /ccdf/authorizations"
  - priority: 9
    category: business_temporal
    check: "on rate-ceiling create, no other RateCeiling for the same (provider_type, care_level, state_code) whose [effective_start, effective_end] closed interval overlaps (shared endpoint counts as overlap)"
    error_id: ERR_RATE_CEILING_OVERLAP
    http_status: 409
    applies_to: "POST /ccdf/rate-ceilings"
  - priority: 10
    category: business_constraint
    check: "on attendance approve, present_days + absent_days <= number of calendar days in service_month"
    error_id: ERR_INVALID_ATTENDANCE_DAYS
    http_status: 422
    applies_to: "POST /ccdf/attendance-records/{id}/approve"
  - priority: 11
    category: business_constraint
    check: "on attendance create, no other AttendanceRecord exists for the same (authorization_id, service_month)"
    error_id: ERR_DUPLICATE_ATTENDANCE
    http_status: 409
    applies_to: "POST /ccdf/attendance-records"
  - priority: 12
    category: business_constraint
    check: "on authorization create, a RateCeiling matches (provider_type, care_level, state_code) covering start_date"
    error_id: ERR_NO_RATE_CEILING
    http_status: 422
    applies_to: "POST /ccdf/authorizations"
  - priority: 13
    category: business_fiscal
    check: "on overpayment record-recovery, running recovered_amount_cents + input <= amount_cents"
    error_id: ERR_RECOVERY_EXCEEDS_CLAIM
    http_status: 422
    applies_to: "POST /ccdf/overpayment-claims/{id}/record-recovery"
  - priority: 14
    category: business_constraint
    check: "on authorization create, expected_family_version matches current Family.version (OCC)"
    error_id: ERR_STALE_FAMILY_VERSION
    http_status: 412
    applies_to: "POST /ccdf/authorizations"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Family ----
  - method: POST
    path: "/ccdf/families"
    description: "Intake a household application"
    roles: [CaseWorker]
    code: 201
    input: [applicant_name, household_size, monthly_gross_income_cents, "monthly_self_employment_income_cents?", state_code]
    output: Family
    side_effects: ["Family created in status=PENDING"]
  - method: GET
    path: "/ccdf/families/{id}"
    description: "Read a household (Family may read only its own)"
    roles: [Family, CaseWorker, ProgramAdmin]
    code: 200
    input: []
    output: Family
    side_effects: []

  # ---- ParentActivity ----
  - method: POST
    path: "/ccdf/parent-activities"
    description: "Record a qualifying parent activity for a household"
    roles: [CaseWorker]
    code: 201
    input: [family_id, activity_type, weekly_hours]
    output: ParentActivity
    side_effects: []
  - method: GET
    path: "/ccdf/parent-activities/{id}"
    description: "Read one parent activity"
    roles: [CaseWorker, ProgramAdmin]
    code: 200
    input: []
    output: ParentActivity
    side_effects: []
  - method: GET
    path: "/ccdf/parent-activities"
    description: "List/filter parent activities (reverse-reachability for family_id)"
    roles: [CaseWorker, ProgramAdmin]
    code: 200
    input: ["family_id?", "limit?", "offset?"]
    output: ParentActivity[]
    side_effects: []

  # ---- IncomeStandard (config) ----
  - method: POST
    path: "/ccdf/income-standards"
    description: "Publish an income standard for a (household_size, state_code)"
    roles: [ProgramAdmin]
    code: 201
    input: [household_size, entry_monthly_limit_cents, exit_monthly_limit_cents, state_code]
    output: IncomeStandard
    side_effects: []

  # ---- EligibilityDetermination ----
  - method: POST
    path: "/ccdf/determinations"
    description: "Open a determination (INITIAL or REDETERMINATION) for a household"
    roles: [CaseWorker]
    code: 201
    input: [family_id, determination_type]
    output: EligibilityDetermination
    side_effects: ["EligibilityDetermination created in status=PENDING"]
  - method: POST
    path: "/ccdf/determinations/{id}/finalize"
    description: "Run income+activity test, set result and sliding-fee copay"
    roles: [CaseWorker]
    code: 200
    input: []
    output: EligibilityDetermination
    side_effects: ["calc copay_determination", "set result/copay/effective/redetermination_due", "set Family.status", "cascade B on DENIED"]
  - method: GET
    path: "/ccdf/determinations/{id}"
    description: "Read one determination"
    roles: [Family, CaseWorker, ProgramAdmin]
    code: 200
    input: []
    output: EligibilityDetermination
    side_effects: []
  - method: GET
    path: "/ccdf/determinations"
    description: "List/filter determinations (reverse-reachability for family_id)"
    roles: [CaseWorker, ProgramAdmin]
    code: 200
    input: ["family_id?", "limit?", "offset?"]
    output: EligibilityDetermination[]
    side_effects: []

  # ---- Provider ----
  - method: POST
    path: "/ccdf/providers"
    description: "Register a provider (starts PENDING_VERIFICATION)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, provider_type, published_daily_rate_cents, license_expiry_date, state_code]
    output: Provider
    side_effects: ["Provider created in license_status=PENDING_VERIFICATION"]
  - method: POST
    path: "/ccdf/providers/{id}/license"
    description: "Licensing action: VERIFY | REJECT | REVOKE | RENEW"
    roles: [ProgramAdmin]
    code: 200
    input: [action, "license_expiry_date?"]
    output: Provider
    side_effects: ["license_status transition", "cascade A on REVOKE"]
  - method: GET
    path: "/ccdf/providers/{id}"
    description: "Read one provider"
    roles: [Family, Provider, CaseWorker, ProgramAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: []

  # ---- RateCeiling (config) ----
  - method: POST
    path: "/ccdf/rate-ceilings"
    description: "Publish a reimbursement ceiling for (provider_type, care_level, state_code)"
    roles: [ProgramAdmin]
    code: 201
    input: [provider_type, care_level, max_daily_rate_cents, effective_start, effective_end, state_code]
    output: RateCeiling
    side_effects: []
  - method: GET
    path: "/ccdf/rate-ceilings"
    description: "List/filter rate ceilings"
    roles: [CaseWorker, ProgramAdmin]
    code: 200
    input: ["provider_type?", "care_level?", "limit?", "offset?"]
    output: RateCeiling[]
    side_effects: []

  # ---- Authorization ----
  - method: POST
    path: "/ccdf/authorizations"
    description: "Create a voucher; computes authorized_daily_rate and estimate; OCC on Family.version"
    roles: [CaseWorker]
    code: 201
    input: [family_id, provider_id, determination_id, child_name, care_level, start_date, end_date, authorized_days_per_month, expected_family_version]
    output: Authorization
    side_effects:
      - "calc authorized_daily_rate; calc payment_computation ESTIMATED -> estimated_monthly_payment_cents"
      - "copy determination.monthly_copay_cents onto authorization"
      - "set Family.active_authorization_id; supersede prior ACTIVE authorization for same child_name -> TERMINATED"
      - "increments Family.version by 1"
  - method: POST
    path: "/ccdf/authorizations/{id}/activate"
    description: "Activate a PENDING voucher (gated on provider license + approved determination)"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Authorization
    side_effects: ["set status=ACTIVE"]
  - method: POST
    path: "/ccdf/authorizations/{id}/suspend"
    description: "Suspend an ACTIVE voucher; rejects its SUBMITTED attendance"
    roles: [CaseWorker, ProgramAdmin]
    code: 200
    input: []
    output: Authorization
    side_effects: ["set status=SUSPENDED", "cascade A hop 2"]
  - method: POST
    path: "/ccdf/authorizations/{id}/reinstate"
    description: "Reinstate a SUSPENDED voucher (gated on provider license)"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Authorization
    side_effects: ["set status=ACTIVE"]
  - method: POST
    path: "/ccdf/authorizations/{id}/terminate"
    description: "Terminate a voucher"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Authorization
    side_effects: ["set status=TERMINATED"]
  - method: GET
    path: "/ccdf/authorizations/{id}"
    description: "Read one authorization"
    roles: [Family, Provider, CaseWorker, ProgramAdmin]
    code: 200
    input: []
    output: Authorization
    side_effects: []
  - method: GET
    path: "/ccdf/authorizations"
    description: "List/filter authorizations (reverse-reachability for family_id, provider_id, determination_id)"
    roles: [CaseWorker, ProgramAdmin]
    code: 200
    input: ["family_id?", "provider_id?", "determination_id?", "limit?", "offset?"]
    output: Authorization[]
    side_effects: []

  # ---- AttendanceRecord ----
  - method: POST
    path: "/ccdf/attendance-records"
    description: "Provider submits monthly attendance (must own the authorization's provider)"
    roles: [Provider]
    code: 201
    input: [authorization_id, service_month, present_days, absent_days]
    output: AttendanceRecord
    side_effects: ["AttendanceRecord created in status=SUBMITTED"]
  - method: POST
    path: "/ccdf/attendance-records/{id}/approve"
    description: "Approve attendance and disburse the resulting Payment"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: ["calc payment_computation ACTUAL", "create Payment PAID", "update provider/family ledgers"]
  - method: POST
    path: "/ccdf/attendance-records/{id}/reject"
    description: "Reject submitted attendance"
    roles: [CaseWorker]
    code: 200
    input: ["reason?"]
    output: AttendanceRecord
    side_effects: ["set status=REJECTED"]
  - method: POST
    path: "/ccdf/attendance-records/{id}/resubmit"
    description: "Provider resubmits a rejected attendance (optionally corrected)"
    roles: [Provider]
    code: 200
    input: ["present_days?", "absent_days?"]
    output: AttendanceRecord
    side_effects: ["set status=SUBMITTED"]
  - method: GET
    path: "/ccdf/attendance-records/{id}"
    description: "Read one attendance record"
    roles: [Provider, CaseWorker, ProgramAdmin]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: []
  - method: GET
    path: "/ccdf/attendance-records"
    description: "List/filter attendance (reverse-reachability for authorization_id)"
    roles: [Provider, CaseWorker, ProgramAdmin]
    code: 200
    input: ["authorization_id?", "limit?", "offset?"]
    output: AttendanceRecord[]
    side_effects: []

  # ---- Payment ----
  - method: POST
    path: "/ccdf/payments/{id}/reverse"
    description: "Reverse a PAID payment; raises an OverpaymentClaim and unwinds ledgers"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: Payment
    side_effects: ["set status=REVERSED", "unwind provider/family ledgers", "create OverpaymentClaim"]
  - method: GET
    path: "/ccdf/payments/{id}"
    description: "Read one payment"
    roles: [Provider, CaseWorker, ProgramAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/ccdf/payments"
    description: "List/filter payments (reverse-reachability for attendance_record_id)"
    roles: [Provider, CaseWorker, ProgramAdmin]
    code: 200
    input: ["attendance_record_id?", "provider_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- OverpaymentClaim ----
  - method: POST
    path: "/ccdf/overpayment-claims/{id}/record-recovery"
    description: "Record a recovery installment against a claim"
    roles: [ProgramAdmin]
    code: 200
    input: [recovered_amount_cents]
    output: OverpaymentClaim
    side_effects: ["recovered_amount_cents += input", "status -> RECOVERING or RECOVERED"]
  - method: POST
    path: "/ccdf/overpayment-claims/{id}/waive"
    description: "Waive an open claim"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: OverpaymentClaim
    side_effects: ["set status=WAIVED"]
  - method: GET
    path: "/ccdf/overpayment-claims/{id}"
    description: "Read one overpayment claim"
    roles: [Provider, ProgramAdmin]
    code: 200
    input: []
    output: OverpaymentClaim
    side_effects: []
  - method: GET
    path: "/ccdf/overpayment-claims"
    description: "List/filter claims (reverse-reachability for provider_id, payment_id)"
    roles: [ProgramAdmin]
    code: 200
    input: ["provider_id?", "payment_id?", "limit?", "offset?"]
    output: OverpaymentClaim[]
    side_effects: []

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/ccdf/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock. Advancing runs the expiry sweep (Provider EXPIRED, Authorization EXPIRED, EligibilityDetermination EXPIRED)."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advance logical clock", "expiry sweep across Provider/Authorization/EligibilityDetermination"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unrecognized X-User-Role or X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation, or entity_backed owner mismatch (Family/Provider acting on another's resource)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path id or body FK id does not resolve"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body: missing required field, wrong type, or invalid enum value"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_DETERMINATION_FAMILY_MISMATCH
    http: 409
    condition: "authorization activate where determination.family_id != authorization.family_id"
  - id: ERR_PROVIDER_NOT_LICENSED
    http: 409
    condition: "authorization activate/reinstate where provider.license_status != LICENSED"
  - id: ERR_DETERMINATION_NOT_APPROVED
    http: 409
    condition: "authorization activate where determination.status != APPROVED"
  - id: ERR_AUTHORIZATION_OVERLAP
    http: 409
    condition: "new authorization half-open interval overlaps an existing non-terminal one for same (family_id, child_name)"
  - id: ERR_RATE_CEILING_OVERLAP
    http: 409
    condition: "new rate ceiling closed interval overlaps an existing one for same (provider_type, care_level, state_code)"
  - id: ERR_INVALID_ATTENDANCE_DAYS
    http: 422
    condition: "present_days + absent_days exceeds the number of days in service_month"
  - id: ERR_DUPLICATE_ATTENDANCE
    http: 409
    condition: "an AttendanceRecord already exists for (authorization_id, service_month)"
  - id: ERR_NO_RATE_CEILING
    http: 422
    condition: "no RateCeiling matches (provider_type, care_level, state_code) covering start_date at authorization create"
  - id: ERR_NO_INCOME_STANDARD
    http: 422
    condition: "no IncomeStandard matches (household_size, state_code) at determination finalize"
  - id: ERR_RECOVERY_EXCEEDS_CLAIM
    http: 422
    condition: "recovery installment would push recovered_amount_cents above amount_cents"
  - id: ERR_STALE_FAMILY_VERSION
    http: 412
    condition: "expected_family_version does not equal current Family.version on authorization create (OCC)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Family
    description: "household applicant; reads its own application, determinations, authorizations, payments"
    identity: "entity_backed:Family"
    exclusive_operations: []
    shared_operations:
      - "GET /ccdf/families/{id} (own)"
      - "GET /ccdf/determinations/{id} (own)"
      - "GET /ccdf/authorizations/{id} (own)"
      - "GET /ccdf/providers/{id}"
  - name: Provider
    description: "childcare provider; submits attendance and reads its own payments"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /ccdf/attendance-records"
      - "POST /ccdf/attendance-records/{id}/resubmit"
    shared_operations:
      - "GET /ccdf/attendance-records/{id}"
      - "GET /ccdf/attendance-records"
      - "GET /ccdf/payments/{id}"
      - "GET /ccdf/payments"
      - "GET /ccdf/authorizations/{id}"
      - "GET /ccdf/providers/{id}"
      - "GET /ccdf/overpayment-claims/{id}"
  - name: CaseWorker
    description: "eligibility/authorization caseworker"
    identity: "opaque"
    exclusive_operations:
      - "POST /ccdf/families"
      - "POST /ccdf/parent-activities"
      - "POST /ccdf/determinations"
      - "POST /ccdf/determinations/{id}/finalize"
      - "POST /ccdf/authorizations"
      - "POST /ccdf/authorizations/{id}/activate"
      - "POST /ccdf/authorizations/{id}/reinstate"
      - "POST /ccdf/authorizations/{id}/terminate"
      - "POST /ccdf/attendance-records/{id}/approve"
      - "POST /ccdf/attendance-records/{id}/reject"
    shared_operations:
      - "POST /ccdf/authorizations/{id}/suspend"
      - "GET (families, determinations, parent-activities, authorizations, attendance-records, payments, rate-ceilings)"
  - name: ProgramAdmin
    description: "program administrator; config, licensing, payment reversal, overpayment recovery, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /ccdf/income-standards"
      - "POST /ccdf/providers"
      - "POST /ccdf/providers/{id}/license"
      - "POST /ccdf/rate-ceilings"
      - "POST /ccdf/payments/{id}/reverse"
      - "POST /ccdf/overpayment-claims/{id}/record-recovery"
      - "POST /ccdf/overpayment-claims/{id}/waive"
      - "POST /ccdf/_clock/set_current_utc"
    shared_operations:
      - "POST /ccdf/authorizations/{id}/suspend"
      - "GET (all read endpoints)"
