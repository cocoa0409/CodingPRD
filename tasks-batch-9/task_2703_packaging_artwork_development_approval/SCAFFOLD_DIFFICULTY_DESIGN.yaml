  # ==========================================================================
  # RULE 7 - cross_entity_state_dependency
  # One instance blocks a write on the state of a grandparent two FK hops up
  # (Version -> Asset -> Brief); the other blocks two different writes on the
  # DERIVED state of a child row (Version <- PrinterProof).
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: submit_gated_on_grandparent_brief_status_not_on_version_state
        grounds:
          - validations[priority=35]
          - validations[priority=24]
          - errors[ERR_BRIEF_NOT_APPROVED]
          - state_machines.Brief.DRAFT_to_APPROVED
          - state_machines.ArtworkVersion.ELEMENTS_VERIFIED_to_IN_REVIEW
          - entities.ArtworkAsset.fields.brief_id
        distinguishing_aspect: |
          The blocking state lives two hops away - ArtworkVersion ->
          ArtworkAsset.brief_id -> Brief.status - and the version itself is in a
          perfectly submittable state (ELEMENTS_VERIFIED, all seven elements PASS,
          compliance_score 100.0). An implementation that only inspects the version
          admits the first submit and creates a ReviewRoute; one that reads the
          grandparent rejects it with ERR_BRIEF_NOT_APPROVED and then accepts the
          identical payload once nothing but the Brief has changed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 created (FDA_FOOD / [US] / [en], all seven element codes required) and deliberately LEFT IN DRAFT - no decision has been posted."
            - "ArtworkAsset created against that DRAFT brief (POST /artwork-assets does not require an approved brief; only submit does)."
            - "ArtworkVersion v1 created with all seven mandatory elements well-formed and then verified: state ELEMENTS_VERIFIED, failed_element_count 0, compliance_score 100.0, route_count 0."
            - "Every precondition that lives on the version itself is therefore satisfied, and the only unsatisfied one is on the Brief."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
