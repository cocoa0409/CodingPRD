scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: penalty_standard_vs_ddia_on_taxperiod
        grounds:
          - calculations.accrued_penalty
          - state_machines.InstallmentAgreement.PROPOSED_to_APPROVED
          - entities.TaxPeriod.fields.penalty_accrued_cents
        distinguishing_aspect: >
          Same TaxPeriod, same 3 elapsed months: STANDARD variant accrues 15000 cents
          (0.5%/mo) before any agreement; the ddia_reduced variant accrues 7500 cents
          (0.25%/mo) once a DIRECT_DEBIT agreement is APPROVED — a 7500-cent divergence
          on the TaxPeriod (penalty) entity domain.
        test_recipe:
          setup:
            - "Account with one TaxPeriod assessed 1000000 cents on 2024-01-15; clock at 2024-04-15 (3 full months)."
            - "Standard recompute yields penalty_accrued_cents=15000, interest=18000, balance_due_cents=1033000."
            - "A PROPOSED LONG_TERM DIRECT_DEBIT agreement covering full payoff exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Acme LLC", tin: "100000001", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct_id}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_id: $.data.id }
            - call: "POST /collections/tax-accounts/${acct_id}/recompute"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct_id}", agreement_type: "LONG_TERM", payment_method: "DIRECT_DEBIT", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-04-15T00:00:00.000Z", active_to: "2024-10-15T00:00:00.000Z", low_income_flag: false }
              as: RevenueOfficer
              captures: { agr_id: $.data.id }
            - call: "GET /collections/tax-accounts/${acct_id}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /collections/installment-agreements/${agr_id}/approve"
              payload: { expected_tax_account_version: "${acct_v}" }
              as: RevenueOfficer
          assert:
            - "Before approve: TaxPeriod.${period_id}.penalty_accrued_cents == 15000"
            - "After approve: TaxPeriod.${period_id}.penalty_accrued_cents == 7500"
            - "After approve: TaxPeriod.${period_id}.balance_due_cents == 1025500"

      - name: setup_fee_standard_vs_waived_on_agreement
        grounds:
          - calculations.setup_fee
          - state_machines.InstallmentAgreement.PROPOSED_to_APPROVED
          - entities.InstallmentAgreement.fields.setup_fee_cents
        distinguishing_aspect: >
          Two InstallmentAgreements on two accounts: a non-low-income MANUAL LONG_TERM
          agreement gets setup_fee_cents=14900; an otherwise-identical agreement with
          low_income_flag=true gets setup_fee_cents=0 — divergence on the
          InstallmentAgreement entity domain (distinct from the TaxPeriod penalty
          variant above).
        test_recipe:
          setup:
            - "Two accounts each with one period assessed 1000000 on 2024-01-15; clock 2024-04-15."
            - "Account 1: MANUAL LONG_TERM, low_income_flag=false. Account 2: MANUAL LONG_TERM, low_income_flag=true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Std Co", tin: "100000010", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct1: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct1}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts/${acct1}/recompute"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct1}", agreement_type: "LONG_TERM", payment_method: "MANUAL", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-04-15T00:00:00.000Z", active_to: "2024-10-15T00:00:00.000Z", low_income_flag: false }
              as: RevenueOfficer
              captures: { agr1: $.data.id }
            - call: "GET /collections/tax-accounts/${acct1}"
              payload: {}
              as: RevenueOfficer
              captures: { acct1_v: $.data.version }
            - call: "POST /collections/installment-agreements/${agr1}/approve"
              payload: { expected_tax_account_version: "${acct1_v}" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Low Co", tin: "100000011", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct2: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct2}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts/${acct2}/recompute"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct2}", agreement_type: "LONG_TERM", payment_method: "MANUAL", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-04-15T00:00:00.000Z", active_to: "2024-10-15T00:00:00.000Z", low_income_flag: true }
              as: RevenueOfficer
              captures: { agr2: $.data.id }
            - call: "GET /collections/tax-accounts/${acct2}"
              payload: {}
              as: RevenueOfficer
              captures: { acct2_v: $.data.version }
          trigger:
            - call: "POST /collections/installment-agreements/${agr2}/approve"
              payload: { expected_tax_account_version: "${acct2_v}" }
              as: RevenueOfficer
          assert:
            - "InstallmentAgreement.${agr1}.setup_fee_cents == 14900"
            - "InstallmentAgreement.${agr2}.setup_fee_cents == 0"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rcp_tiered_multiplier_selection
        grounds:
          - calculations.reasonable_collection_potential
          - state_machines.OfferInCompromise.SUBMITTED_to_EVALUATING
          - entities.OfferInCompromise.fields.rcp_cents
        distinguishing_aspect: >
          Mode (a) non-linear: rcp_cents = net_realizable_equity_cents +
          monthly_disposable_income_cents * tier-selected multiplier, where the
          multiplier branches on remaining CSED months (>60 -> 60). With nre=500000,
          mdi=300000, remaining 118 months: rcp_cents == 500000 + 300000*60 == 18500000.
        test_recipe:
          setup:
            - "Account mdi=300000 with one period assessed 1000000 on 2024-01-15 (csed 2034-01-15); clock 2024-04-15 (remaining 118 months -> MULT_LONG=60)."
            - "An OIC submitted with offer 18500000, net_realizable_equity 500000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Offer Co", tin: "100000020", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/offers"
              payload: { tax_account_id: "${acct}", offer_amount_cents: 18500000, net_realizable_equity_cents: 500000 }
              as: RevenueOfficer
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /collections/offers/${offer_id}/begin-evaluation"
              payload: {}
              as: CaseReviewer
          assert:
            - "OfferInCompromise.${offer_id}.rcp_cents == 18500000"
            - "OfferInCompromise.${offer_id}.status == EVALUATING"

      - name: penalty_round_per_month_vs_interest_sum_then_round
        grounds:
          - calculations.accrued_penalty
          - calculations.accrued_interest
          - entities.TaxPeriod.fields.balance_due_cents
        distinguishing_aspect: >
          Mode (b) rounding-order: accrued_penalty rounds each month to whole cents then
          sums (3 * round(1000000*0.005)=3*5000=15000), while accrued_interest sums then
          rounds once (round(1000000*0.006*3)=18000). The scaffold pins the two opposite
          orders; recompute yields penalty 15000 and interest 18000 deterministically.
        test_recipe:
          setup:
            - "Account with one period assessed 1000000 on 2024-01-15; clock 2024-04-15 (3 months)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Round Co", tin: "100000021", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /collections/tax-accounts/${acct}/recompute"
              payload: {}
              as: RevenueOfficer
          assert:
            - "TaxPeriod.${period_id}.penalty_accrued_cents == 15000"
            - "TaxPeriod.${period_id}.interest_accrued_cents == 18000"
            - "TaxPeriod.${period_id}.balance_due_cents == 1033000"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_revision_loop_reinstated_then_defaulted
        grounds:
          - state_machines.InstallmentAgreement.APPROVED_to_REINSTATED
          - state_machines.InstallmentAgreement.REINSTATED_to_DEFAULTED
          - entities.InstallmentAgreement.fields.missed_debit_count
        distinguishing_aspect: >
          InstallmentAgreement is the cyclic/revision-loop machine: APPROVED -> REINSTATED
          (1st missed debit, below threshold) -> DEFAULTED (2nd missed debit hits
          MISSED_DEBIT_DEFAULT_THRESHOLD=2). missed_debit_count walks 0->1->2 and the
          status is REINSTATED then DEFAULTED — non-linear, distinct entity from the OIC
          branching machine below.
        test_recipe:
          setup:
            - "Account with one period assessed 1000000 on 2024-01-15; clock 2024-04-15; an APPROVED DIRECT_DEBIT LONG_TERM agreement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Loop Co", tin: "100000030", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts/${acct}/recompute"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct}", agreement_type: "LONG_TERM", payment_method: "DIRECT_DEBIT", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-04-15T00:00:00.000Z", active_to: "2024-10-15T00:00:00.000Z", low_income_flag: false }
              as: RevenueOfficer
              captures: { agr: $.data.id }
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v: $.data.version }
            - call: "POST /collections/installment-agreements/${agr}/approve"
              payload: { expected_tax_account_version: "${acct_v}" }
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements/${agr}/record-missed-debit"
              payload: {}
              as: RevenueOfficer
          trigger:
            - call: "POST /collections/installment-agreements/${agr}/record-missed-debit"
              payload: {}
              as: RevenueOfficer
          assert:
            - "After 1st missed debit: InstallmentAgreement.${agr}.status == REINSTATED and missed_debit_count == 1"
            - "After 2nd missed debit: InstallmentAgreement.${agr}.status == DEFAULTED and missed_debit_count == 2"

      - name: oic_branching_evaluating_to_reject_with_compensation
        grounds:
          - state_machines.OfferInCompromise.EVALUATING_to_REJECTED
          - state_machines.OfferInCompromise.EVALUATING_to_ACCEPTED
          - entities.OfferInCompromise.fields.status
        distinguishing_aspect: >
          OfferInCompromise is the branching fork machine: from EVALUATING the offer
          forks to ACCEPTED (payment + abatement side-effects) or REJECTED (CSED-close
          compensation + collection_status ACTIVE_COLLECTION). This instance drives the
          REJECTED branch; its side-effect set (no payment, status ACTIVE_COLLECTION)
          differs from the ACCEPTED branch — a different entity than the agreement loop.
        test_recipe:
          setup:
            - "Account with one period assessed 1000000 on 2024-01-15; clock 2024-04-15; an OIC moved to EVALUATING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Fork Co", tin: "100000031", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/offers"
              payload: { tax_account_id: "${acct}", offer_amount_cents: 18500000, net_realizable_equity_cents: 500000 }
              as: RevenueOfficer
              captures: { offer_id: $.data.id }
            - call: "POST /collections/offers/${offer_id}/begin-evaluation"
              payload: {}
              as: CaseReviewer
          trigger:
            - call: "POST /collections/offers/${offer_id}/reject"
              payload: {}
              as: CaseReviewer
          assert:
            - "OfferInCompromise.${offer_id}.status == REJECTED"
            - "TaxAccount.${acct}.collection_status == ACTIVE_COLLECTION"
            - "No Payment with payment_source OIC_LUMP_SUM exists for account ${acct}"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: oic_accept_depth3_payment_abate_account_resolve_agreement_close
        grounds:
          - state_machines.OfferInCompromise.EVALUATING_to_ACCEPTED
          - state_machines.InstallmentAgreement.APPROVED_to_CLOSED
          - calculations.account_total_balance
        distinguishing_aspect: >
          Depth-3 chain from OIC accept: (1) accept posts an OIC_LUMP_SUM Payment and sets
          non-SATISFIED periods to ABATED; (2) that abatement zeroes balances so
          account_total_balance recomputes to 0 -> collection_status RESOLVED; (3) the
          account reaching 0 auto-CLOSES the APPROVED agreement. Each hop is caused by the
          prior hop. Trigger differs from the default cascade below.
        test_recipe:
          setup:
            - "Account, one period assessed 1000000 on 2024-01-15; clock 2024-04-15."
            - "An APPROVED MANUAL LONG_TERM agreement exists (so an agreement is present to auto-close)."
            - "An OIC (offer 18500000 >= rcp) submitted by a DIFFERENT officer, moved to EVALUATING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Cascade Co", tin: "100000040", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_id: $.data.id }
            - call: "POST /collections/tax-accounts/${acct}/recompute"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct}", agreement_type: "LONG_TERM", payment_method: "MANUAL", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-04-15T00:00:00.000Z", active_to: "2024-10-15T00:00:00.000Z", low_income_flag: false }
              as: RevenueOfficer
              captures: { agr: $.data.id }
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v1: $.data.version }
            - call: "POST /collections/installment-agreements/${agr}/approve"
              payload: { expected_tax_account_version: "${acct_v1}" }
              as: RevenueOfficer
            - call: "POST /collections/offers"
              payload: { tax_account_id: "${acct}", offer_amount_cents: 18500000, net_realizable_equity_cents: 500000 }
              as: RevenueOfficer
              as_user_id: "officer-submitter"
              captures: { offer_id: $.data.id }
            - call: "POST /collections/offers/${offer_id}/begin-evaluation"
              payload: {}
              as: CaseReviewer
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "POST /collections/offers/${offer_id}/accept"
              payload: { expected_tax_account_version: "${acct_v2}" }
              as: CaseReviewer
              as_user_id: "reviewer-acceptor"
          assert:
            - "OfferInCompromise.${offer_id}.status == ACCEPTED"
            - "TaxPeriod.${period_id}.period_status == ABATED and balance_due_cents == 0"
            - "TaxAccount.${acct}.total_balance_cents == 0 and collection_status == RESOLVED"
            - "InstallmentAgreement.${agr}.status == CLOSED"

      - name: agreement_default_depth3_csed_close_extend_protection_drop
        grounds:
          - state_machines.InstallmentAgreement.APPROVED_to_DEFAULTED
          - calculations.csed_date
          - entities.TaxAccount.fields.csed_protection_count
        distinguishing_aspect: >
          Depth-3 chain from agreement default (threshold hit at 2 missed debits with
          DEFAULT_THRESHOLD lowered to 1 via repeated misses): default -> close the period's
          open CSED suspension interval -> the closed interval's days are added to
          TaxPeriod.csed_date -> TaxAccount.csed_protection_count drops to 0. Originates
          from a different trigger (default) than the OIC accept cascade.
        test_recipe:
          setup:
            - "Account, one period assessed 1000000 on 2024-01-15; clock 2024-04-15."
            - "An APPROVED DIRECT_DEBIT agreement (approval opened a CSED suspension with start_at 2024-04-15, csed_protection_count=1)."
            - "One missed debit recorded (count 1, REINSTATED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Default Co", tin: "100000041", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_id: $.data.id }
            - call: "POST /collections/tax-accounts/${acct}/recompute"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct}", agreement_type: "LONG_TERM", payment_method: "DIRECT_DEBIT", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-04-15T00:00:00.000Z", active_to: "2024-10-15T00:00:00.000Z", low_income_flag: false }
              as: RevenueOfficer
              captures: { agr: $.data.id }
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v: $.data.version }
            - call: "POST /collections/installment-agreements/${agr}/approve"
              payload: { expected_tax_account_version: "${acct_v}" }
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements/${agr}/record-missed-debit"
              payload: {}
              as: RevenueOfficer
          trigger:
            - call: "POST /collections/installment-agreements/${agr}/record-missed-debit"
              payload: {}
              as: RevenueOfficer
          assert:
            - "InstallmentAgreement.${agr}.status == DEFAULTED"
            - "TaxAccount.${acct}.csed_protection_count == 0"
            - "TaxPeriod.${period_id}.csed_date > original csed_date (extended by the closed suspension day-count)"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_oic_accept
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: >
          On POST /offers/{id}/accept against a SUBMITTED (not yet EVALUATING) offer whose
          offer_amount is also below RCP: priority-6 state check (ERR_INVALID_STATE, 409)
          outranks priority-13 business_fiscal check (ERR_OFFER_BELOW_RCP, 422). The pair
          is state vs business_fiscal.
        test_recipe:
          setup:
            - "Account with one period assessed 1000000 on 2024-01-15; clock 2024-04-15."
            - "An OIC SUBMITTED with offer 100 (well below any RCP); begin-evaluation NOT called, so rcp_cents not yet computed and status is SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "PriA Co", tin: "100000050", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/offers"
              payload: { tax_account_id: "${acct}", offer_amount_cents: 100, net_realizable_equity_cents: 500000 }
              as: RevenueOfficer
              as_user_id: "officer-sub-50"
              captures: { offer_id: $.data.id }
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /collections/offers/${offer_id}/accept"
              payload: { expected_tax_account_version: "${acct_v}" }
              as: CaseReviewer
