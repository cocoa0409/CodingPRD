      - name: mileage_total_per_entry_round_then_sum
        grounds:
          - calculations.mileage_total
          - entities.MileageEntry.fields.line_charge
          - entities.Invoice.fields.mileage_total
        distinguishing_aspect: |
          Mode (b): rounding order is pinned. Three RECORDED mileage entries of 1.45 miles
          (1.45*0.70=1.015 -> 1.02 each) sum to mileage_total 3.06, whereas sum-then-round
          (3*1.015=3.045 -> 3.05) would give a different cent; the per-entry order is authoritative.
        test_recipe:
          setup:
            - "One COMPLETED 2h HOURLY visit (charge 60.00) with three RECORDED mileage entries of 1.45 miles each; one DRAFT invoice over the window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
