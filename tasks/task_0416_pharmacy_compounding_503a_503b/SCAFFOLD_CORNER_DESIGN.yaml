              as: QualityAssurancePharmacist
              as_user_id: "qa-user-2"
              captures: { new_v: $.data.version, status: $.data.status }
          assert:
            - "CompoundingBatch.${batch_id}.status == RELEASED"
            - "CompoundingBatch.${batch_id}.version == ${batch_v} + 1"

      - name: occ_release_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[batch-release-stale-version]
          - errors[ERR_STALE_VERSION]
          - validations[priority=6]
          - endpoints["POST /pharmacy-compounding/compounding-batches/{bid}/release"]
        distinguishing_aspect: "Release carrying expected_batch_version = (current version - 1) is stale -> ERR_STALE_VERSION (412); no transition."
        test_recipe:
          setup:
            - "A QUARANTINED 503A batch with all QC passed; client captured current batch.version and deliberately sends version-1."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "F1", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 5, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API X", lot_number: "X-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/prescriptions"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", patient_name: "Pat Q", prescriber_npi: "1234567890", units_prescribed: 5, written_utc: "2026-06-01T00:00:00.000Z" }
              as: DispensingPharmacist
              captures: { rx_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "PRESCRIPTION", prescription_id: "${rx_id}" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 5 }
              as: CompoundingPharmacist
              as_user_id: "comp-user-1"
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch_id}", test_type: "POTENCY_ASSAY", measured_value: 100, lower_limit: 90, upper_limit: 110 }
              as: QualityAssurancePharmacist
              captures: { qc1_id: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${qc1_id}/begin"
              payload: {}
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests/${qc1_id}/record"
              payload: { measured_value: 100 }
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch_id}", test_type: "VISUAL_INSPECTION" }
              as: QualityAssurancePharmacist
              captures: { qc2_id: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${qc2_id}/begin"
              payload: {}
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests/${qc2_id}/record"
              payload: { pass: true }
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/quarantine"
              payload: {}
              as: CompoundingPharmacist
            - call: "GET /pharmacy-compounding/compounding-batches/${batch_id}"
              payload: {}
              as: QualityAssurancePharmacist
              captures: { batch_v: $.data.version }
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/release"
              payload: { expected_batch_version: "${batch_v} - 1" }
              as: QualityAssurancePharmacist
              as_user_id: "qa-user-2"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "CompoundingBatch.${batch_id}.status == QUARANTINED"

      - name: derived_remaining_grams_reconciled_after_start
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.lot_potency_adjustment
          - entities.IngredientLot.fields.remaining_grams
          - state_machines.CompoundingBatch.DRAFT_to_IN_PROCESS
        distinguishing_aspect: "remaining_grams reconciles to initial_grams - grams_used after start (50 - 10 = 40)."
        excluded_because:
          difficulty_instance: compensating_invariant / reject_restocks_lot_grams_conserves_total_grams
          rationale: "The derived remaining_grams decrement on start (50->40) is asserted as the mid-state of the grams-conservation difficulty instance before the reject restock."

      - name: rate_threshold_anticipatory_cap_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.anticipatory_consumed_units
          - validations[priority=15]
        distinguishing_aspect: "The anticipatory cumulative cap is tested at the boundary where consumed+yield exceeds anticipatory_max_units."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / anticipatory_rolling_window_aggregate_capacity_overlap
          rationale: "The cumulative anticipatory threshold at the 200-unit boundary (120 consumed + 90 = 210 > 200) is asserted in that difficulty instance."

      - name: cascade_recall_n_level_chain_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CompoundingBatch.RELEASED_to_RECALLED
          - state_machines.FinishedPreparation.DISPENSED_to_RECALLED
          - state_machines.Prescription.ACTIVE_to_FILLED
        distinguishing_aspect: "The recall N-level cascade (batch -> preps -> prescription) is verified end-to-end."
        excluded_because:
          difficulty_instance: transitive_cascade / recall_cascade_batch_to_prep_to_prescription_depth3
          rationale: "The full depth-3 recall cascade is the subject of that difficulty instance."

  # ===========================================================================
  # Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_compile_mints_preps_in_same_request
        claim_type: immediate
        grounds:
          - state_machines.CompoundingBatch.IN_PROCESS_to_COMPILED
          - entities.FinishedPreparation
          - endpoints["POST /pharmacy-compounding/compounding-batches/{bid}/compile"]
        distinguishing_aspect: "Immediately after the compile response (201/200), GET /finished-preparations?compounding_batch_id={bid} already returns actual_yield_units rows — all changes visible in the same request cycle."
        test_recipe:
          setup:
            - "A 503B OFFICE_USE batch started, ready to compile with actual_yield_units=3."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "F1", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 3, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API X", lot_number: "X-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 3 }
              as: CompoundingPharmacist
          trigger:
            - call: "GET /pharmacy-compounding/finished-preparations?compounding_batch_id=${batch_id}"
              payload: {}
              as: CompoundingPharmacist
          assert:
            - "response total_count == 3 (all 3 FinishedPreparations visible immediately after compile)"
