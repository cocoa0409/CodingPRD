            - { call: "POST /lease-buyouts/deals/${deal_id}/escrow-funding", payload: {}, as: TreasuryOfficer }
            - { call: "POST /lease-buyouts/deals/${deal_id}/close", payload: { recording_ref: "BK1420-PG318" }, as: PortfolioManager, as_user_id: "pm-bob" }
          trigger:
