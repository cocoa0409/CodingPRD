# ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2925 — Student Data Privacy Vendor Vetting
#
# Nine §0.5 Difficulty Rules x 2 instances each = 18 instances.
# Every literal in every `assert:` line was computed by executing the matching
# §1.3 formula in code against the fixture pinned in the same instance's
# `setup_api_calls:` chain.
#
# Shared fixture strings used verbatim across instances:
#   JUST_240 (240 chars, earns the 240-char justification bonus of 8)
#   JUST_140 (140 chars, above the 120-char minimum, earns bonus 0)
#   PURPOSE_61 (61 chars, above the 40-char minimization floor)
# ============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: review_compliance_provisional_vs_final_diverge
        grounds:
          - calculations.review_compliance_score
          - calculations.commitment_is_minimized
          - entities.DataPracticeReview.fields.provisional_compliance_score
          - entities.DataPracticeReview.fields.final_compliance_score
          - entities.Vendor.fields.signed_state_addendum
          - state_machines.DataPracticeReview.FINDINGS_ISSUED_to_CONDITIONAL
        distinguishing_aspect: |
          The two variants of review_compliance_score read DIFFERENT commitment
          input sets from byte-identical stored rows: provisional credits rows in
          {PROPOSED, ACCEPTED} (2 of 3 minimized, retention_factor 0.0 because a
          900-day row is present), final credits only ACCEPTED rows (2 of 2
          minimized, retention_factor 1.0), and only final charges the 20-point
          missing-state-addendum penalty. Provisional lands at 60.67 and final at
          64.00 on the same database.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Vendor V with breach_notification_hours 72, signed_state_addendum FALSE, subprocessor_disclosure_complete TRUE, no subprocessors and no incidents."
            - "Application A of V, category ASSESSMENT (max_permitted_tier 4), WCAG21_AA + VPAT on file, SAML2 with sso_verified TRUE."
            - "A triaged teacher request on A, and one review R over all four frameworks assigned to the SENIOR analyst."
            - "Three commitments on R: STUDENT_NAME/365d/ANONYMIZE and GRADE_LEVEL/365d/ANONYMIZE both ACCEPTED, plus EMAIL/900d/HARD_DELETE left PROPOSED."
            - "One findings round issued with findings_count 2, so open_findings_count == unresolved_findings_count == 2 and the review sits in FINDINGS_ISSUED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Northbeam Learning Inc", hq_country_code: "US", breach_notification_hours: 72, data_deletion_days: 30, signed_state_addendum: false, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Northbeam Formative", category: "ASSESSMENT", grade_band_low: 6, grade_band_high: 8, sso_protocol: "SAML2", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/attest-integration"
              payload: { sso_verified: true }
              as: PrivacyOfficeAdmin
            - call: "POST /teachers"
              payload: { full_name: "Dana Reyes", employee_number: "EMP-7001", school_code: "MS-04", grade_bands_taught: [6, 7, 8] }
              as: PrivacyOfficeAdmin
              captures: { t_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Ana Lopez", credential_level: "SENIOR", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Lee Park", credential_level: "LEAD", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /application-requests"
              payload: { application_id: "${app_id}", requester_teacher_id: "${t_id}", instructional_justification: "Grade seven and eight students use this tool for weekly formative practice aligned to the district scope and sequence, and teachers review item-level results during common planning time to regroup learners and plan targeted reteaching block", requested_data_elements: ["STUDENT_NAME", "GRADE_LEVEL"], student_count_estimate: 700, grade_band_low: 7, grade_band_high: 8 }
              as: Teacher
              as_user_id: "${t_id}"
              captures: { req_id: $.data.id }
            - call: "POST /application-requests/${req_id}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${t_id}"
            - call: "POST /application-requests/${req_id}/triage"
              payload: { disposition: "ACCEPT_FOR_REVIEW", triage_note: "Assessment tool, roster identity only." }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /data-practice-reviews"
              payload: { source_request_id: "${req_id}", assigned_analyst_id: "${an1_id}", framework_set: ["FERPA", "COPPA", "PPRA", "STATE_ADDENDUM"], estimated_minutes: 240 }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rev_id: $.data.id }
            - call: "GET /data-practice-reviews/${rev_id}"
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rv1: $.data.version }
            - call: "POST /data-element-commitments"
              payload: { review_id: "${rev_id}", element_code: "STUDENT_NAME", justified_purpose: "Roster identity matching for gradebook sync and report cards.", retention_days: 365, deletion_method: "ANONYMIZE", expected_review_version: "${rv1}" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { cm1_id: $.data.id }
            - call: "GET /data-practice-reviews/${rev_id}"
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rv2: $.data.version }
            - call: "POST /data-element-commitments"
              payload: { review_id: "${rev_id}", element_code: "GRADE_LEVEL", justified_purpose: "Roster identity matching for gradebook sync and report cards.", retention_days: 365, deletion_method: "ANONYMIZE", expected_review_version: "${rv2}" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { cm2_id: $.data.id }
            - call: "GET /data-practice-reviews/${rev_id}"
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rv3: $.data.version }
            - call: "POST /data-element-commitments"
              payload: { review_id: "${rev_id}", element_code: "EMAIL", justified_purpose: "Roster identity matching for gradebook sync and report cards.", retention_days: 900, deletion_method: "HARD_DELETE", expected_review_version: "${rv3}" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { cm3_id: $.data.id }
            - call: "POST /data-element-commitments/${cm1_id}/decide"
              payload: { disposition: "ACCEPT" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
            - call: "POST /data-element-commitments/${cm2_id}/decide"
              payload: { disposition: "ACCEPT" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
            - call: "POST /data-practice-reviews/${rev_id}/issue-findings"
              payload: { findings_count: 2, decision_note: "Retention term on EMAIL exceeds district guidance." }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
          trigger:
            - call: "POST /data-practice-reviews/${rev_id}/decide"
              payload: { disposition: "CONDITIONAL", decision_note: "Approved with conditions pending retention rewrite." }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
          assert:
            - "DataPracticeReview.${rev_id}.provisional_compliance_score == 60.67"
            - "DataPracticeReview.${rev_id}.final_compliance_score == 64.00"
            - "DataPracticeReview.${rev_id}.final_compliance_score - DataPracticeReview.${rev_id}.provisional_compliance_score == 3.33"
            - "DataPracticeReview.${rev_id}.status == CONDITIONAL"
            - "DataElementCommitment.${cm3_id}.status == SUPERSEDED"
            - "DataElementCommitment.${cm3_id}.is_minimized == false"
            - "Application.${app_id}.status == APPROVED_WITH_CONDITIONS"
            - "Vendor.${v_id}.status == CONDITIONAL"

      - name: vendor_risk_live_vs_reauthorization_diverge
        grounds:
          - calculations.vendor_risk_score
          - entities.Vendor.fields.risk_score
          - entities.Vendor.fields.reauthorization_risk_score
          - entities.VendorIncident.fields.response_status
          - concurrency_rules[reauthorization-stale-application]
          - state_machines.CatalogEntry.EXPIRING_SOON_to_SUPERSEDED
        distinguishing_aspect: |
          vendor_risk_score's two variants differ ONLY in which incident
          response_statuses they scope: live includes REMEDIATED, reauthorization
          excludes it. With one CRITICAL incident (severity weight 30) resolved to
          REMEDIATED and 47 days old (decay 1.0), the same vendor row simultaneously
          carries risk_score 50.50 and reauthorization_risk_score 20.50 — a
          divergence of exactly 30.00 on identical stored data.
        test_recipe:
          setup:
            - "Clock starts at 2026-07-20T00:00:00Z."
            - "Vendor V: breach_notification_hours 100 (so breach_term_penalty 10), US HQ, addendum signed, disclosure complete."
            - "One Irish subprocessor of V in DISCLOSED (foreign_subprocessor_penalty 10)."
            - "One BREACH incident of V detected 2026-07-20T00:00:00Z with affected_student_count 1400 => severity CRITICAL; notification sent inside the 24-hour statutory window, then contained and REMEDIATED."
            - "Application A of V approved through a cleared review carrying one ACCEPTED STUDENT_NAME/90d/HARD_DELETE commitment => element_points 1.00, Application.exposed_sensitivity_points 1.00, sensitivity_load 0.50."
            - "Catalog entry E published for window [2026-08-01T00:00:00Z, 2026-10-01T00:00:00Z) => reauthorization_due_at 2026-09-01T00:00:00Z."
            - "Clock advanced to 2026-09-05T00:00:00Z and the nightly sweep run, so E is EXPIRING_SOON and therefore renewable; the incident is 47 days old so its decay multiplier is still 1.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-20T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Coastline Analytics LLC", hq_country_code: "US", breach_notification_hours: 100, data_deletion_days: 45, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /subprocessors"
              payload: { vendor_id: "${v_id}", name: "Emerald Hosting Ltd", country_code: "IE", data_categories: ["ROSTER"], purpose: "Managed database hosting for the analytics warehouse.", sub_breach_notification_hours: 96 }
              as: PrivacyOfficeAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /vendor-incidents"
              payload: { vendor_id: "${v_id}", incident_type: "BREACH", detected_at: "2026-07-20T00:00:00Z", affected_student_count: 1400, max_data_tier: 3 }
              as: PrivacyOfficeAdmin
              captures: { inc_id: $.data.id }
            - call: "POST /vendor-incidents/${inc_id}/send-notification"
              payload: { notified_party_count: 1400 }
              as: PrivacyOfficeAdmin
            - call: "POST /vendor-incidents/${inc_id}/contain"
              payload: { contained_at: "2026-07-20T06:00:00Z", remediation_note: "Credential rotation complete." }
              as: PrivacyOfficeAdmin
            - call: "POST /vendor-incidents/${inc_id}/resolve"
              payload: { disposition: "REMEDIATE", remediation_note: "Root cause closed and audited." }
              as: PrivacyOfficeAdmin
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Coastline Insights", category: "ASSESSMENT", grade_band_low: 6, grade_band_high: 8, sso_protocol: "OIDC", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/attest-integration"
              payload: { sso_verified: true }
              as: PrivacyOfficeAdmin
            - call: "POST /teachers"
              payload: { full_name: "Marta Vela", employee_number: "EMP-7002", school_code: "MS-04", grade_bands_taught: [6, 7, 8] }
              as: PrivacyOfficeAdmin
              captures: { t_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Ana Lopez", credential_level: "SENIOR", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Lee Park", credential_level: "LEAD", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /application-requests"
              payload: { application_id: "${app_id}", requester_teacher_id: "${t_id}", instructional_justification: "Grade seven and eight students use this tool for weekly formative practice aligned to the district scope and sequence, and teachers review item-level results during common planning time to regroup learners and plan targeted reteaching block", requested_data_elements: ["STUDENT_NAME"], student_count_estimate: 700, grade_band_low: 7, grade_band_high: 8 }
              as: Teacher
              as_user_id: "${t_id}"
              captures: { req_id: $.data.id }
            - call: "POST /application-requests/${req_id}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${t_id}"
            - call: "POST /application-requests/${req_id}/triage"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /data-practice-reviews"
              payload: { source_request_id: "${req_id}", assigned_analyst_id: "${an1_id}", framework_set: ["FERPA", "COPPA", "PPRA", "STATE_ADDENDUM"], estimated_minutes: 240 }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rev_id: $.data.id }
            - call: "GET /data-practice-reviews/${rev_id}"
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rv1: $.data.version }
            - call: "POST /data-element-commitments"
              payload: { review_id: "${rev_id}", element_code: "STUDENT_NAME", justified_purpose: "Roster identity matching for gradebook sync and report cards.", retention_days: 90, deletion_method: "HARD_DELETE", expected_review_version: "${rv1}" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { cm_id: $.data.id }
            - call: "POST /data-element-commitments/${cm_id}/decide"
              payload: { disposition: "ACCEPT" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
            - call: "POST /data-practice-reviews/${rev_id}/issue-findings"
              payload: { findings_count: 0 }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /data-practice-reviews/${rev_id}/decide"
              payload: { disposition: "CLEAR" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /catalog-entries"
              payload: { application_id: "${app_id}", review_id: "${rev_id}", effective_from: "2026-08-01T00:00:00Z", expires_at: "2026-10-01T00:00:00Z", authorized_grade_band_low: 6, authorized_grade_band_high: 8 }
              as: PrivacyOfficeAdmin
              captures: { entry_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /compliance-sweeps"
              payload: {}
              as: PrivacyOfficeAdmin
            - call: "GET /applications/${app_id}"
              as: PrivacyOfficeAdmin
              captures: { app_version: $.data.version }
          trigger:
            - call: "POST /catalog-entries/${entry_id}/reauthorize"
              payload: { expires_at: "2027-10-01T00:00:00Z", expected_application_version: "${app_version}" }
              as: PrivacyOfficeAdmin
              captures: { new_entry_id: $.data.id }
          assert:
            - "Vendor.${v_id}.risk_score == 50.50"
            - "Vendor.${v_id}.reauthorization_risk_score == 20.50"
            - "Vendor.${v_id}.risk_score - Vendor.${v_id}.reauthorization_risk_score == 30.00"
            - "Vendor.${v_id}.privacy_posture == WATCH"
            - "Application.${app_id}.exposed_sensitivity_points == 1.00"
            - "CatalogEntry.${entry_id}.status == SUPERSEDED"
            - "CatalogEntry.${new_entry_id}.effective_from == 2026-10-01T00:00:00.000Z"
            - "CatalogEntry.${new_entry_id}.predecessor_entry_id == ${entry_id}"
            - "CatalogEntry.${new_entry_id}.reauthorization_due_at == 2027-09-01T00:00:00.000Z"

  - rule_id: combinatorial_formula
    instances:

      - name: exposed_points_round_each_element_then_sum
        grounds:
          - calculations.exposed_sensitivity_points
          - calculations.element_sensitivity_tier
          - entities.DataElementCommitment.fields.element_points
          - entities.Application.fields.exposed_sensitivity_points
          - calculations.vendor_risk_score
        distinguishing_aspect: |
          exposed_sensitivity_points multiplies three independent lookup tables
          (TIER_WEIGHT x retention_multiplier x DELETION_MULTIPLIER) and then
          rounds TWICE: once per element, once on the sum. Three identical
          tier-1 / 365-day / ANONYMIZE rows each yield raw 1.4375 -> 1.44, so the
          pinned round-then-sum order gives 4.32 while the naive sum-then-round
          order gives 4.31. The one-cent gap is the whole point of the instance.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Vendor V (breach_notification_hours 48 so breach_term_penalty 0, no subprocessors, no incidents)."
            - "Application A of V, category INSTRUCTIONAL_CONTENT so max_permitted_tier is 2, grade band 3..5."
            - "A triaged request and one SCREENING review on A."
            - "Three PROPOSED commitments, all tier 1 (STUDENT_NAME, GRADE_LEVEL, PARENT_CONTACT), all retention_days 365, all deletion_method ANONYMIZE. The first two are already ACCEPTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Brightpath Reading Co", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Brightpath Readers", category: "INSTRUCTIONAL_CONTENT", grade_band_low: 3, grade_band_high: 5, sso_protocol: "LTI13", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/attest-integration"
              payload: { sso_verified: true }
              as: PrivacyOfficeAdmin
            - call: "POST /teachers"
              payload: { full_name: "Ivy Chen", employee_number: "EMP-7003", school_code: "ES-11", grade_bands_taught: [3, 4, 5] }
              as: PrivacyOfficeAdmin
              captures: { t_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Ana Lopez", credential_level: "SENIOR", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Lee Park", credential_level: "LEAD", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /application-requests"
              payload: { application_id: "${app_id}", requester_teacher_id: "${t_id}", instructional_justification: "Grade seven and eight students use this tool for weekly formative practice aligned to the district scope and sequence, and teachers review item-level results during common planning time to regroup learners and plan targeted reteaching block", requested_data_elements: ["STUDENT_NAME", "GRADE_LEVEL", "PARENT_CONTACT"], student_count_estimate: 300, grade_band_low: 3, grade_band_high: 5 }
              as: Teacher
              as_user_id: "${t_id}"
              captures: { req_id: $.data.id }
            - call: "POST /application-requests/${req_id}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${t_id}"
            - call: "POST /application-requests/${req_id}/triage"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /data-practice-reviews"
              payload: { source_request_id: "${req_id}", assigned_analyst_id: "${an1_id}", framework_set: ["FERPA", "COPPA"], estimated_minutes: 180 }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rev_id: $.data.id }
            - call: "GET /data-practice-reviews/${rev_id}"
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rv1: $.data.version }
            - call: "POST /data-element-commitments"
              payload: { review_id: "${rev_id}", element_code: "STUDENT_NAME", justified_purpose: "Roster identity matching for gradebook sync and report cards.", retention_days: 365, deletion_method: "ANONYMIZE", expected_review_version: "${rv1}" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { cm1_id: $.data.id }
            - call: "GET /data-practice-reviews/${rev_id}"
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rv2: $.data.version }
            - call: "POST /data-element-commitments"
              payload: { review_id: "${rev_id}", element_code: "GRADE_LEVEL", justified_purpose: "Roster identity matching for gradebook sync and report cards.", retention_days: 365, deletion_method: "ANONYMIZE", expected_review_version: "${rv2}" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { cm2_id: $.data.id }
            - call: "GET /data-practice-reviews/${rev_id}"
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rv3: $.data.version }
            - call: "POST /data-element-commitments"
              payload: { review_id: "${rev_id}", element_code: "PARENT_CONTACT", justified_purpose: "Roster identity matching for gradebook sync and report cards.", retention_days: 365, deletion_method: "ANONYMIZE", expected_review_version: "${rv3}" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { cm3_id: $.data.id }
            - call: "POST /data-element-commitments/${cm1_id}/decide"
              payload: { disposition: "ACCEPT" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
            - call: "POST /data-element-commitments/${cm2_id}/decide"
              payload: { disposition: "ACCEPT" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
          trigger:
            - call: "POST /data-element-commitments/${cm3_id}/decide"
              payload: { disposition: "ACCEPT" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
          assert:
            - "DataElementCommitment.${cm1_id}.element_points == 1.44"
            - "DataElementCommitment.${cm2_id}.element_points == 1.44"
            - "DataElementCommitment.${cm3_id}.element_points == 1.44"
            - "Application.${app_id}.exposed_sensitivity_points == 4.32"
            - "Application.${app_id}.exposed_sensitivity_points != 4.31 (4.31 is the sum-then-round answer and is wrong)"
            - "Vendor.${v_id}.risk_score == 2.16"
            - "Vendor.${v_id}.privacy_posture == CLEAR"
            - "DataElementCommitment.${cm3_id}.sensitivity_tier == 1"
            - "DataElementCommitment.${cm3_id}.is_minimized == true"

      - name: request_priority_band_pinned_to_pre_multiplier_raw
        grounds:
          - calculations.request_priority_score
          - entities.ApplicationRequest.fields.priority_score
          - entities.ApplicationRequest.fields.priority_band
          - state_machines.ApplicationRequest.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          request_priority_score's band selector and its multiplier are wired in a
