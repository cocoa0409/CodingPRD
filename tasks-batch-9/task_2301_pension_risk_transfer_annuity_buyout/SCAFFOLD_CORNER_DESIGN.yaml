      - name: deficient_termination_filing_can_be_cured_then_the_plan_locks_down
        claim_type: cyclic
        grounds:
          - state_machines.PensionPlan.TERMINATION_FILED_to_FILING_DEFICIENT
          - state_machines.PensionPlan.TERMINATION_FILED_to_TERMINATED
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_PLAN_STATE_INVALID
        distinguishing_aspect: |
          The filing loop RESIDUAL -> TERMINATION_FILED -> FILING_DEFICIENT ->
          TERMINATION_FILED must require a deficiency_response on the second pass
          only: the same payload that was valid from RESIDUAL is rejected from
          FILING_DEFICIENT. Approval then terminates the plan, annuitizes the
          participant who never left the plan, and writes a zero-amount ledger row —
          after which the filing endpoint is closed for good.
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; a well-funded plan (liability 100000000, assets 120000000)"
            - "participant A: DEFERRED_VESTED stated 20000, FAME 100000, 160 months, cleansed; participant D: never cleansed, so it receives no notice"
            - "a LUMP_SUM_ONLY amendment and a window over [2026-08-01T00:00:00Z, 2026-09-30T00:00:00Z) with cap 10000000 and eligibility_max 3000000, elected by A and settled at 2026-09-30T00:00:00Z, which bubbles the plan to RESIDUAL"
