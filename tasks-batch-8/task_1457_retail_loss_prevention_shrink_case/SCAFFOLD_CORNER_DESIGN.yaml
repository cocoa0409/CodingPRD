            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T1", exception_type: "NO_SALE_DRAWER", amount_cents: 4000, occurred_at: "2026-07-10T10:00:00Z", employee_id: "${e1}" }
              as: PosFeed
              as_user_id: feed-1
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T2", exception_type: "PRICE_OVERRIDE", amount_cents: 3000, occurred_at: "2026-07-10T11:00:00Z", employee_id: "${e1}" }
              as: PosFeed
              as_user_id: feed-1
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T3", exception_type: "SWEETHEART_SCAN", amount_cents: 20000, occurred_at: "2026-07-10T12:00:00Z", employee_id: "${e1}" }
              as: PosFeed
              as_user_id: feed-1
            - call: "GET /alerts?store_id=${s1}&employee_id=${e1}"
              as: LPAnalyst
              as_user_id: ana-1
          trigger:
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T4", exception_type: "REFUND_NO_RECEIPT", amount_cents: 5000, occurred_at: "2026-07-10T13:00:00Z", employee_id: "${e1}" }
