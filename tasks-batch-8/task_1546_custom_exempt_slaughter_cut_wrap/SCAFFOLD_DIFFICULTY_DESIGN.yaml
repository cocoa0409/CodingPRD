          setup:
            - "Two independent fixtures, each: ACTIVE customer, confirmed HOG 1-head appointment (deposit 7500), animal processed to READY with StorageRecord ready_at 2026-08-04 (weighed 2026-08-01, hang met 2026-08-04), single share 1.0, invoice base total 15500 (17000 processing + 6000 slaughter - 7500 credit)"
            - "Fixture A clock: 2026-08-11 (days_stored == 7, last free day); fixture B clock: 2026-08-12 (days_stored == 8, first billable day)"
