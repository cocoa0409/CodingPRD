              captures: { credit1_id: "$.data[0].id", credit2_id: "$.data[1].id" }
            - call: "POST /makeup-bookings"
              payload: { makeup_credit_id: "${credit1_id}", target_class_session_id: "${src_sess_id}", occurrence_date: "2026-06-09T00:00:00Z" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { bk1_id: $.data.id }
          trigger:
            - call: "POST /makeup-bookings"
              payload: { makeup_credit_id: "${credit2_id}", target_class_session_id: "${s2_sess_id}", occurrence_date: "2026-06-09T00:00:00Z" }
