          rationale: "That instance asserts the 409 ERR_PERMIT_NOT_ACTIVE body as the winning error of its dual-failure booking request."

      - name: corner_error_invoice_past_due_state
        claim_type: error_triggerable
        grounds: ["errors[ERR_INVOICE_PAST_DUE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_permit_not_active_outranks_fiscal_invoice_past_due
          rationale: "The same instance drives an invoice to PAST_DUE via the ops-run and asserts FeeInvoice.status == PAST_DUE."

