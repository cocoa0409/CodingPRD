scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: session_bill_provisional_vs_final
        grounds:
          - calculations.session_time_charge
          - calculations.session_bill_total
          - entities.Reservation.fields.provisional_bill_total_cents
          - entities.Reservation.fields.bill_total_cents
          - state_machines.Reservation.transitions.SEATED_to_COMPLETED
        distinguishing_aspect: |
          On the SAME Reservation the provisional variant measures table-time to the
          current logical clock (60 min -> 4200) while the final variant measures to
          closed_at (120 min -> 5200); the two produce different bill totals. This is
          cost accounting on the Reservation entity domain.
        test_recipe:
          setup:
            - "Table T1 (half_hour_rate 500, day_pass 6000, cover 300, min_spend 2000, seats 6) exists."
            - "BRONZE member M1 exists (lifetime 0)."
            - "Reservation resv1 is SEATED at clock 2026-07-02T18:00:00Z with one non-VOID F&B line of 1500; clock is now 2026-07-02T19:00:00Z."
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "T1", seats: 6, half_hour_rate_cents: 500, day_pass_cents: 6000, cover_fee_cents: 300, min_spend_cents: 2000, zone: "MAIN" }
              as: Manager
              captures: { t1: $.data.id }
            - call: "POST /memberships"
              payload: { email: "m1@x.com", full_name: "M One" }
              as: Staff
              captures: { m1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T17:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t1}", membership_id: "${m1}", party_size: 4, start_at: "2026-07-02T18:00:00Z", end_at: "2026-07-02T20:00:00Z", deposit_cents: 0 }
              as: Staff
              captures: { resv1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T18:00:00Z" }
              as: Manager
            - call: "POST /reservations/${resv1}/seat"
              payload: {}
              as: Staff
            - call: "POST /fnb-orders"
              payload: { reservation_id: "${resv1}", description: "Snacks", total_cents: 1500 }
              as: Staff
              captures: { o1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T19:00:00Z" }
              as: Manager
          trigger:
            - call: "GET /reservations/${resv1}"
              payload: {}
              as: Staff
              captures: { prov: $.data.provisional_bill_total_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T20:00:00Z" }
              as: Manager
            - call: "POST /reservations/${resv1}/close"
              payload: {}
              as: Staff
              captures: { fin: $.data.bill_total_cents }
          assert:
            - "Reservation.${resv1}.provisional_bill_total_cents == 4200  # time 1000 (60min->2 blocks) + cover 1200 + fnb 1500 + shortfall 500"
            - "Reservation.${resv1}.bill_total_cents == 5200  # time 2000 (120min->4 blocks) + cover 1200 + fnb 1500 + shortfall 500"
            - "Reservation.${resv1}.provisional_bill_total_cents (4200) != Reservation.${resv1}.bill_total_cents (5200)"

      - name: tournament_prize_provisional_vs_final
        grounds:
          - calculations.tournament_prize_pool
          - entities.Tournament.fields.provisional_prize_pool_cents
          - entities.Tournament.fields.prize_pool_cents
          - entities.Tournament.fields.house_cut_cents
          - state_machines.Tournament.transitions.OPEN_to_RUNNING
        distinguishing_aspect: |
          On the Tournament entity domain the provisional pool counts REGISTERED+CHECKED_IN
          (3 -> 2400) while the final pool frozen at start counts CHECKED_IN only (2 -> 1600);
          different subject entity from the Reservation dual-variant above.
        test_recipe:
          setup:
            - "Tournament trn (entry_fee 1000, capacity 8) is OPEN with 3 registrations, 2 of them CHECKED_IN (checked in while OPEN)."
          setup_api_calls:
            - call: "POST /tournaments"
              payload: { name: "Catan Cup", game_title: "Catan", format: "SINGLE_ELIM", capacity: 8, entry_fee_cents: 1000, start_at: "2026-07-10T18:00:00Z" }
              as: Manager
              captures: { trn: $.data.id }
            - call: "POST /tournaments/${trn}/open"
              payload: {}
              as: Manager
            - call: "POST /memberships"
              payload: { email: "a@x.com", full_name: "A" }
              as: Staff
              captures: { ma: $.data.id }
            - call: "POST /memberships"
              payload: { email: "b@x.com", full_name: "B" }
              as: Staff
              captures: { mb: $.data.id }
            - call: "POST /memberships"
              payload: { email: "c@x.com", full_name: "C" }
              as: Staff
              captures: { mc: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${trn}", membership_id: "${ma}" }
              as: Staff
              captures: { ra: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${trn}", membership_id: "${mb}" }
              as: Staff
              captures: { rb: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${trn}", membership_id: "${mc}" }
              as: Staff
              captures: { rc: $.data.id }
            - call: "POST /registrations/${ra}/check-in"
              payload: {}
              as: Staff
            - call: "POST /registrations/${rb}/check-in"
              payload: {}
              as: Staff
          trigger:
            - call: "GET /tournaments/${trn}"
              payload: {}
              as: Staff
              captures: { prov: $.data.provisional_prize_pool_cents }
            - call: "POST /tournaments/${trn}/start"
              payload: {}
              as: Manager
              captures: { fin: $.data.prize_pool_cents }
          assert:
            - "Tournament.${trn}.provisional_prize_pool_cents == 2400  # gross 3*1000=3000, house round(600)=600, pool 2400"
            - "Tournament.${trn}.prize_pool_cents == 1600  # gross 2*1000=2000, house 400, pool 1600"
            - "Tournament.${trn}.house_cut_cents == 400"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: session_bill_nonlinear_composition_mode_a
        grounds:
          - calculations.session_bill_total
          - calculations.session_time_charge
          - entities.Table.fields.day_pass_cents
          - entities.Reservation.fields.minimum_shortfall_cents
          - entities.Reservation.fields.member_discount_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula combining a min()-capped time charge
          (blocks*rate capped at day_pass), a per-head cover, a conditional tier discount,
          and a max()-clamped F&B minimum shortfall — nested min/max plus a conditional
          branch on tier_at_seating.
        test_recipe:
          setup:
            - "Table T2 (half_hour_rate 500, day_pass 3000 low cap, cover 400, min_spend 5000, seats 8) exists."
            - "SILVER member M2 (granted 500 lifetime points -> tier SILVER) exists."
            - "Reservation resv2 seated at 2026-07-03T18:00:00Z, party 6, one 2000 F&B line; clock advanced to 2026-07-03T22:00:00Z (4h)."
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "T2", seats: 8, half_hour_rate_cents: 500, day_pass_cents: 3000, cover_fee_cents: 400, min_spend_cents: 5000, zone: "MAIN" }
              as: Manager
              captures: { t2: $.data.id }
            - call: "POST /memberships"
              payload: { email: "m2@x.com", full_name: "M Two" }
              as: Staff
              captures: { m2: $.data.id }
            - call: "POST /memberships/${m2}/loyalty-adjustments"
              payload: { points_delta: 500, reason: "signup bonus" }
              as: Manager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T18:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t2}", membership_id: "${m2}", party_size: 6, start_at: "2026-07-03T18:00:00Z", end_at: "2026-07-03T23:00:00Z", deposit_cents: 0 }
              as: Staff
              captures: { resv2: $.data.id }
            - call: "POST /reservations/${resv2}/seat"
              payload: {}
              as: Staff
            - call: "POST /fnb-orders"
              payload: { reservation_id: "${resv2}", description: "Pizza night", total_cents: 2000 }
              as: Staff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T22:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /reservations/${resv2}/close"
              payload: {}
              as: Staff
              captures: { bill: $.data.bill_total_cents }
          assert:
            - "Reservation.${resv2}.time_charge_cents == 3000  # 240min->8 blocks*500=4000, capped at day_pass 3000"
            - "Reservation.${resv2}.cover_charge_cents == 2400  # 6*400"
            - "Reservation.${resv2}.member_discount_cents == 540  # round_half_up((3000+2400)*0.10)"
            - "Reservation.${resv2}.minimum_shortfall_cents == 3000  # max(0, 5000-2000)"
            - "Reservation.${resv2}.bill_total_cents == 9860  # (5400-540) + 2000 + 3000"

      - name: loyalty_points_floor_per_line_then_sum_mode_b
        grounds:
          - calculations.loyalty_points_earned
          - entities.Reservation.fields.points_earned
          - entities.Membership.fields.lifetime_points
          - state_machines.Reservation.transitions.SEATED_to_COMPLETED
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — floor(250/100)+floor(250/100)=2+2=4, NOT
          floor((250+250)/100)=5. Two F&B lines of 250 make the per-line-then-sum order
          observable (differs from sum-then-floor by 1 point).
        test_recipe:
          setup:
            - "Table T3 (all rates 0, min_spend 0, cover 0, seats 4) exists so only F&B drives points."
            - "BRONZE member M3 (lifetime 0) exists."
            - "Reservation resv3 seated at 2026-07-04T18:00:00Z with two non-VOID F&B lines of 250 each; clock 2026-07-04T19:00:00Z."
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "T3", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0, zone: "QUIET" }
              as: Manager
              captures: { t3: $.data.id }
            - call: "POST /memberships"
              payload: { email: "m3@x.com", full_name: "M Three" }
              as: Staff
              captures: { m3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-04T18:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t3}", membership_id: "${m3}", party_size: 2, start_at: "2026-07-04T18:00:00Z", end_at: "2026-07-04T19:00:00Z", deposit_cents: 0 }
              as: Staff
              captures: { resv3: $.data.id }
            - call: "POST /reservations/${resv3}/seat"
              payload: {}
              as: Staff
            - call: "POST /fnb-orders"
              payload: { reservation_id: "${resv3}", description: "Coffee", total_cents: 250 }
              as: Staff
            - call: "POST /fnb-orders"
              payload: { reservation_id: "${resv3}", description: "Tea", total_cents: 250 }
              as: Staff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-04T19:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /reservations/${resv3}/close"
              payload: {}
              as: Staff
              captures: { pe: $.data.points_earned }
            - call: "GET /memberships/${m3}"
              payload: {}
              as: Staff
              captures: { lp: $.data.lifetime_points }
          assert:
            - "Reservation.${resv3}.points_earned == 4  # floor(250/100)+floor(250/100)=2+2, NOT floor(500/100)=5"
            - "Membership.${m3}.lifetime_points == 4"
            - "Membership.${m3}.points_balance == 4"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_branching_fork_divergent_side_effects
        grounds:
          - state_machines.Reservation.transitions.BOOKED_to_CANCELLED
          - state_machines.Reservation.transitions.BOOKED_to_NO_SHOW
          - state_machines.Reservation.transitions.BOOKED_to_SEATED
          - entities.Reservation.fields.deposit_forfeited
        distinguishing_aspect: |
          Reservation forks from a single BOOKED state into SEATED | CANCELLED | NO_SHOW,
          each with a divergent side-effect set: CANCEL leaves deposit_forfeited=false,
          NO_SHOW sets deposit_forfeited=true (branching fork-join non-linearity).
        test_recipe:
          setup:
            - "Table T4 exists; clock 2026-07-05T10:00:00Z."
            - "Reservation resvA (cancellable, window 20:00-22:00, deposit 1000) and resvB (past window 08:00-09:00, deposit 1000) both BOOKED on T4."
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "T4", seats: 6, half_hour_rate_cents: 500, day_pass_cents: 6000, cover_fee_cents: 300, min_spend_cents: 0, zone: "MAIN" }
              as: Manager
              captures: { t4: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t4}", party_size: 2, start_at: "2026-07-05T20:00:00Z", end_at: "2026-07-05T22:00:00Z", deposit_cents: 1000 }
              as: Staff
              captures: { resvA: $.data.id }
            - call: "POST /reservations"
              payload: { table_id: "${t4}", party_size: 2, start_at: "2026-07-05T08:00:00Z", end_at: "2026-07-05T09:00:00Z", deposit_cents: 1000 }
              as: Staff
              captures: { resvB: $.data.id }
          trigger:
            - call: "POST /reservations/${resvA}/cancel"
              payload: {}
              as: Staff
              captures: { sA: $.data.status }
            - call: "POST /reservations/${resvB}/no-show"
              payload: {}
              as: Staff
              captures: { sB: $.data.status }
          assert:
            - "Reservation.${resvA}.status == CANCELLED and Reservation.${resvA}.deposit_forfeited == false"
            - "Reservation.${resvB}.status == NO_SHOW and Reservation.${resvB}.deposit_forfeited == true"

      - name: game_copy_parallel_status_and_condition_dimensions
        grounds:
          - state_machines.GameCopy.transitions.AVAILABLE_to_CHECKED_OUT
          - state_machines.GameCopy.transitions.CHECKED_OUT_to_AVAILABLE
          - entities.GameCopy.fields.status
          - entities.GameCopy.fields.condition
        distinguishing_aspect: |
          On one GameCopy row the status dimension (AVAILABLE->CHECKED_OUT->AVAILABLE) and
          the condition dimension (GOOD->WORN) advance independently: checkout changes status
          only (condition stays GOOD), return changes both. Different entity from Reservation.
        test_recipe:
          setup:
            - "GameCopy GC (title Catan, condition GOOD) exists; a SEATED reservation resv exists to borrow against."
          setup_api_calls:
            - call: "POST /game-copies"
              payload: { title: "Catan", barcode: "BC-GC-1", replacement_value_cents: 4000, condition: "GOOD" }
              as: Manager
              captures: { gc: $.data.id }
            - call: "POST /tables"
              payload: { label: "T5", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0, zone: "MAIN" }
              as: Manager
              captures: { t5: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t5}", party_size: 2, start_at: "2026-07-05T12:00:00Z", end_at: "2026-07-05T14:00:00Z", deposit_cents: 0 }
              as: Staff
              captures: { resv: $.data.id }
            - call: "POST /reservations/${resv}/seat"
              payload: {}
              as: Staff
          trigger:
            - call: "POST /checkouts"
              payload: { game_copy_id: "${gc}", reservation_id: "${resv}" }
              as: Staff
              captures: { co: $.data.id }
            - call: "GET /game-copies/${gc}"
              payload: {}
              as: Staff
              captures: { st1: $.data.status, cond1: $.data.condition }
            - call: "POST /checkouts/${co}/return"
              payload: { return_condition: "WORN" }
              as: Staff
            - call: "GET /game-copies/${gc}"
              payload: {}
              as: Staff
              captures: { st2: $.data.status, cond2: $.data.condition }
          assert:
            - "GameCopy.${gc}.status == CHECKED_OUT and GameCopy.${gc}.condition == GOOD after checkout (status advanced, condition unchanged)"
            - "GameCopy.${gc}.status == AVAILABLE and GameCopy.${gc}.condition == WORN after return (condition advanced independently of status)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_session_accrual_then_tier_upgrade_cascade
        grounds:
          - state_machines.Reservation.transitions.SEATED_to_COMPLETED
          - calculations.loyalty_points_earned
          - calculations.membership_tier
          - entities.Membership.fields.lifetime_points
          - entities.Membership.fields.tier
        distinguishing_aspect: |
          Depth-3 cascade from close: (A) close computes points_earned=30 -> (B) that
          amount is added to Membership.lifetime_points (480->510) -> (C) the new lifetime
          crosses TIER_SILVER_THRESHOLD and re-derives tier BRONZE->SILVER. Each hop is
          caused by the previous, not directly by close.
        test_recipe:
          setup:
            - "Member M4 has lifetime 480 (BRONZE) via a loyalty grant."
            - "Reservation resv4 seated on a zero-rate table with a single 3000 F&B line; clock ready to close."
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "T6", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0, zone: "MAIN" }
              as: Manager
              captures: { t6: $.data.id }
            - call: "POST /memberships"
              payload: { email: "m4@x.com", full_name: "M Four" }
              as: Staff
              captures: { m4: $.data.id }
            - call: "POST /memberships/${m4}/loyalty-adjustments"
              payload: { points_delta: 480, reason: "carryover" }
              as: Manager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T18:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t6}", membership_id: "${m4}", party_size: 2, start_at: "2026-07-06T18:00:00Z", end_at: "2026-07-06T19:00:00Z", deposit_cents: 0 }
              as: Staff
              captures: { resv4: $.data.id }
            - call: "POST /reservations/${resv4}/seat"
              payload: {}
              as: Staff
            - call: "POST /fnb-orders"
              payload: { reservation_id: "${resv4}", description: "Big platter", total_cents: 3000 }
              as: Staff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T19:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /reservations/${resv4}/close"
              payload: {}
              as: Staff
              captures: { pe: $.data.points_earned }
            - call: "GET /memberships/${m4}"
              payload: {}
              as: Staff
              captures: { tier: $.data.tier, lp: $.data.lifetime_points, bal: $.data.points_balance }
          assert:
            - "Reservation.${resv4}.points_earned == 30  # floor(3000/100)"
            - "Membership.${m4}.lifetime_points == 510  # 480 + 30"
            - "Membership.${m4}.tier == SILVER  # 510 >= 500 threshold"
            - "Membership.${m4}.points_balance == 510  # 480 + 30"

      - name: no_show_strike_then_membership_suspend_cascade
        grounds:
          - state_machines.Reservation.transitions.BOOKED_to_NO_SHOW
          - entities.Membership.fields.no_show_strikes
          - state_machines.Membership.transitions.ACTIVE_to_SUSPENDED
          - entities.Membership.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger (no-show, not close): (A) no-show forfeits
          deposit and (B) increments Membership.no_show_strikes to 3 -> (C) reaching
          NO_SHOW_SUSPEND_THRESHOLD flips Membership.status ACTIVE->SUSPENDED.
        test_recipe:
          setup:
            - "Member M5 already has 2 no-show strikes from two prior no-shows; clock 2026-07-07T10:00:00Z."
            - "A third BOOKED reservation resvC (past window 09:20-09:40) exists on the same table (disjoint, buffer-clear windows)."
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "T7", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0, zone: "MAIN" }
              as: Manager
              captures: { t7: $.data.id }
            - call: "POST /memberships"
              payload: { email: "m5@x.com", full_name: "M Five" }
              as: Staff
              captures: { m5: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-07T10:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t7}", membership_id: "${m5}", party_size: 2, start_at: "2026-07-07T08:00:00Z", end_at: "2026-07-07T08:20:00Z", deposit_cents: 500 }
              as: Staff
              captures: { resvP1: $.data.id }
            - call: "POST /reservations/${resvP1}/no-show"
              payload: {}
              as: Staff
            - call: "POST /reservations"
              payload: { table_id: "${t7}", membership_id: "${m5}", party_size: 2, start_at: "2026-07-07T08:40:00Z", end_at: "2026-07-07T09:00:00Z", deposit_cents: 500 }
              as: Staff
              captures: { resvP2: $.data.id }
            - call: "POST /reservations/${resvP2}/no-show"
              payload: {}
              as: Staff
            - call: "POST /reservations"
              payload: { table_id: "${t7}", membership_id: "${m5}", party_size: 2, start_at: "2026-07-07T09:20:00Z", end_at: "2026-07-07T09:40:00Z", deposit_cents: 500 }
              as: Staff
              captures: { resvC: $.data.id }
          trigger:
            - call: "POST /reservations/${resvC}/no-show"
              payload: {}
              as: Staff
            - call: "GET /memberships/${m5}"
              payload: {}
              as: Staff
              captures: { strikes: $.data.no_show_strikes, status: $.data.status }
          assert:
            - "Reservation.${resvC}.deposit_forfeited == true"
            - "Membership.${m5}.no_show_strikes == 3"
            - "Membership.${m5}.status == SUSPENDED  # reached NO_SHOW_SUSPEND_THRESHOLD (3)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancel_seated_within_cutoff_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - state_machines.Reservation.transitions.BOOKED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CANCEL_TOO_LATE]
        distinguishing_aspect: |
          A SEATED reservation cancelled inside the 120-minute cutoff violates BOTH the
          state check (priority 6, ERR_INVALID_STATE) and the temporal cutoff (priority 17,
          ERR_CANCEL_TOO_LATE); priority 6 wins so ERR_INVALID_STATE is returned. Pair:
          state vs business_temporal.
        test_recipe:
          setup:
            - "Reservation resv is SEATED (start 2026-07-05T12:00:00Z) and the clock is 2026-07-05T11:30:00Z, inside the 120-min cutoff."
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "T8", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0, zone: "MAIN" }
              as: Manager
              captures: { t8: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t8}", party_size: 2, start_at: "2026-07-05T12:00:00Z", end_at: "2026-07-05T14:00:00Z", deposit_cents: 0 }
              as: Staff
              captures: { resv: $.data.id }
            - call: "POST /reservations/${resv}/seat"
              payload: {}
              as: Staff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T11:30:00Z" }
              as: Manager
          trigger:
            - call: "POST /reservations/${resv}/cancel"
              payload: {}
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE  # state priority 6 wins over ERR_CANCEL_TOO_LATE priority 17"
            - "http_status == 409"

      - name: redeem_suspended_and_insufficient_constraint_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=18]
          - errors[ERR_MEMBERSHIP_SUSPENDED]
          - errors[ERR_INSUFFICIENT_POINTS]
          - entities.Membership.fields.status
        distinguishing_aspect: |
          A SUSPENDED member with 0 points redeeming 100 violates BOTH the membership
          constraint (priority 7, ERR_MEMBERSHIP_SUSPENDED) and the fiscal balance check
          (priority 18, ERR_INSUFFICIENT_POINTS); priority 7 wins. Pair:
          business_constraint vs business_fiscal — a different pair from the state/temporal
          conflict above.
        test_recipe:
          setup:
            - "Member M6 is SUSPENDED and has points_balance 0."
          setup_api_calls:
            - call: "POST /memberships"
              payload: { email: "m6@x.com", full_name: "M Six" }
              as: Staff
              captures: { m6: $.data.id }
            - call: "PATCH /memberships/${m6}"
              payload: { status: "SUSPENDED" }
              as: Manager
          trigger:
            - call: "POST /memberships/${m6}/redemptions"
              payload: { points_cost: 100, reward_description: "Mug" }
              as: Member
              as_user_id: "${m6}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBERSHIP_SUSPENDED  # constraint priority 7 wins over ERR_INSUFFICIENT_POINTS priority 18"
            - "http_status == 409"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fnb_minimum_exact_equality_zero_shortfall
        grounds:
          - calculations.session_bill_total
          - entities.Reservation.fields.minimum_shortfall_cents
          - state_machines.Reservation.transitions.SEATED_to_COMPLETED
        distinguishing_aspect: |
          At fnb_subtotal == min_spend_cents (2000 == 2000) the shortfall is exactly 0
          (max(0, min - subtotal) with equality); a money-threshold boundary reached
          through POST /reservations/{id}/close.
        test_recipe:
          setup:
            - "Table T9 (min_spend 2000, zero rates/cover) exists; Reservation resv seated with F&B lines summing to exactly 2000; clock ready to close."
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "T9", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 2000, zone: "MAIN" }
              as: Manager
              captures: { t9: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-08T18:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t9}", party_size: 2, start_at: "2026-07-08T18:00:00Z", end_at: "2026-07-08T19:00:00Z", deposit_cents: 0 }
              as: Staff
              captures: { resv: $.data.id }
            - call: "POST /reservations/${resv}/seat"
              payload: {}
              as: Staff
            - call: "POST /fnb-orders"
              payload: { reservation_id: "${resv}", description: "Dinner", total_cents: 2000 }
              as: Staff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-08T19:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /reservations/${resv}/close"
              payload: {}
              as: Staff
              captures: { shortfall: $.data.minimum_shortfall_cents, bill: $.data.bill_total_cents }
          assert:
            - "Reservation.${resv}.minimum_shortfall_cents == 0  # fnb 2000 == min_spend 2000, no shortfall at equality"
            - "Reservation.${resv}.bill_total_cents == 2000  # gaming 0 + fnb 2000 + shortfall 0"

      - name: tournament_capacity_exact_full_rejects_next
        grounds:
          - validations[priority=11]
          - errors[ERR_TOURNAMENT_FULL]
          - entities.Tournament.fields.capacity
          - entities.Tournament.fields.registered_count
        distinguishing_aspect: |
          With capacity 2 and exactly 2 active registrations (count == capacity), the third
          POST /registrations is rejected with ERR_TOURNAMENT_FULL — a COUNT boundary on a
          DIFFERENT endpoint (POST /registrations) and metric than the F&B money boundary.
        test_recipe:
          setup:
            - "Tournament trn (capacity 2, entry_fee 0) is OPEN with exactly 2 REGISTERED entries."
          setup_api_calls:
            - call: "POST /tournaments"
              payload: { name: "Chess Night", game_title: "Chess", format: "CASUAL", capacity: 2, entry_fee_cents: 0, start_at: "2026-07-11T18:00:00Z" }
              as: Manager
              captures: { trn: $.data.id }
            - call: "POST /tournaments/${trn}/open"
              payload: {}
              as: Manager
            - call: "POST /memberships"
              payload: { email: "f1@x.com", full_name: "F1" }
              as: Staff
              captures: { mf1: $.data.id }
            - call: "POST /memberships"
              payload: { email: "f2@x.com", full_name: "F2" }
              as: Staff
              captures: { mf2: $.data.id }
            - call: "POST /memberships"
              payload: { email: "f3@x.com", full_name: "F3" }
              as: Staff
              captures: { mf3: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${trn}", membership_id: "${mf1}" }
              as: Staff
            - call: "POST /registrations"
              payload: { tournament_id: "${trn}", membership_id: "${mf2}" }
              as: Staff
          trigger:
            - call: "POST /registrations"
              payload: { tournament_id: "${trn}", membership_id: "${mf3}" }
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TOURNAMENT_FULL  # registered_count == capacity == 2 blocks the 3rd"
            - "http_status == 409"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkout_depends_on_reservation_seated_state
        grounds:
          - state_machines.GameCopy.transitions.AVAILABLE_to_CHECKED_OUT
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - entities.Reservation.fields.status
        distinguishing_aspect: |
          A checkout's validity depends on the referenced Reservation's state: while the
          reservation is BOOKED the checkout is rejected ERR_INVALID_STATE; once SEATED it
          succeeds. Pair: Checkout -> Reservation.
        test_recipe:
          setup:
            - "GameCopy GC (AVAILABLE, GOOD) and Reservation resv (still BOOKED) exist on a valid table; clock 2026-07-05T12:00:00Z."
          setup_api_calls:
            - call: "POST /game-copies"
              payload: { title: "Wingspan", barcode: "BC-WS-1", replacement_value_cents: 5000 }
              as: Manager
              captures: { gc: $.data.id }
            - call: "POST /tables"
              payload: { label: "T10", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0, zone: "MAIN" }
              as: Manager
              captures: { t10: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t10}", party_size: 2, start_at: "2026-07-05T12:00:00Z", end_at: "2026-07-05T14:00:00Z", deposit_cents: 0 }
              as: Staff
              captures: { resv: $.data.id }
          trigger:
            - call: "POST /checkouts"
              payload: { game_copy_id: "${gc}", reservation_id: "${resv}" }
              as: Staff
              captures: { err: $.data.error_id }
            - call: "POST /reservations/${resv}/seat"
              payload: {}
              as: Staff
            - call: "POST /checkouts"
              payload: { game_copy_id: "${gc}", reservation_id: "${resv}" }
              as: Staff
              captures: { co: $.data.id }
          assert:
            - "first POST /checkouts response error_id == ERR_INVALID_STATE  # reservation ${resv} is BOOKED, not SEATED"
            - "after seat, second POST /checkouts succeeds (201) and GameCopy.${gc}.status == CHECKED_OUT"

      - name: checkin_depends_on_tournament_open_state
        grounds:
          - state_machines.Registration.transitions.REGISTERED_to_CHECKED_IN
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - entities.Tournament.fields.status
        distinguishing_aspect: |
          A registration check-in's validity depends on the referenced Tournament's state:
          while OPEN check-in succeeds; once the tournament is RUNNING check-in is rejected
          ERR_INVALID_STATE. Pair: Registration -> Tournament (a different entity pair from
          Checkout -> Reservation).
        test_recipe:
          setup:
            - "Tournament trn OPEN with two REGISTERED entries ra, rb."
          setup_api_calls:
            - call: "POST /tournaments"
              payload: { name: "Ticket Tussle", game_title: "Ticket to Ride", format: "LEAGUE", capacity: 8, entry_fee_cents: 0, start_at: "2026-07-12T18:00:00Z" }
              as: Manager
              captures: { trn: $.data.id }
            - call: "POST /tournaments/${trn}/open"
              payload: {}
              as: Manager
            - call: "POST /memberships"
              payload: { email: "g1@x.com", full_name: "G1" }
              as: Staff
              captures: { mg1: $.data.id }
            - call: "POST /memberships"
              payload: { email: "g2@x.com", full_name: "G2" }
              as: Staff
              captures: { mg2: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${trn}", membership_id: "${mg1}" }
              as: Staff
              captures: { ra: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${trn}", membership_id: "${mg2}" }
              as: Staff
              captures: { rb: $.data.id }
          trigger:
            - call: "POST /registrations/${ra}/check-in"
              payload: {}
              as: Staff
              captures: { sa: $.data.status }
            - call: "POST /tournaments/${trn}/start"
              payload: {}
              as: Manager
            - call: "POST /registrations/${rb}/check-in"
              payload: {}
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "Registration.${ra}.status == CHECKED_IN  # checked in while tournament OPEN"
            - "second check-in response error_id == ERR_INVALID_STATE  # tournament ${trn} is RUNNING, not OPEN"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: table_reservation_turnover_buffer_conflict
        grounds:
          - validations[priority=14]
          - errors[ERR_TABLE_TIME_CONFLICT]
          - entities.Reservation.fields.start_at
          - entities.Reservation.fields.end_at
        distinguishing_aspect: |
          On a Table, two reservations conflict when the gap is under the 15-minute turnover
          buffer: r1 ends 20:00, r2 starts 20:10 (gap 10 < 15) -> ERR_TABLE_TIME_CONFLICT.
          Buffer-based interval semantics on the Table resource.
        test_recipe:
          setup:
            - "Table T11 has one reservation r1 for 2026-07-06T18:00:00Z..20:00:00Z; clock 2026-07-06T10:00:00Z."
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "T11", seats: 4, half_hour_rate_cents: 500, day_pass_cents: 6000, cover_fee_cents: 0, min_spend_cents: 0, zone: "MAIN" }
              as: Manager
              captures: { t11: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T10:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t11}", party_size: 2, start_at: "2026-07-06T18:00:00Z", end_at: "2026-07-06T20:00:00Z", deposit_cents: 0 }
              as: Staff
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { table_id: "${t11}", party_size: 2, start_at: "2026-07-06T20:10:00Z", end_at: "2026-07-06T21:00:00Z", deposit_cents: 0 }
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TABLE_TIME_CONFLICT  # 20:10 start is within 15-min turnover buffer of r1's 20:00 end (gap 10 < 15)"
            - "http_status == 409"

      - name: room_booking_confirmed_overlap_no_buffer
        grounds:
          - validations[priority=15]
          - errors[ERR_ROOM_TIME_CONFLICT]
          - concurrency_rules[private-booking-hold-supersede-stale-room]
          - entities.PrivateBooking.fields.start_at
          - entities.PrivateBooking.fields.end_at
        distinguishing_aspect: |
          On a Room, overlap uses half-open intervals with ZERO buffer against CONFIRMED
          bookings: a back-to-back booking (20:00-21:00 after a CONFIRMED 18:00-20:00) is
          ACCEPTED, but an overlapping one (19:30-20:30) is rejected ERR_ROOM_TIME_CONFLICT.
          Different interval arithmetic (no buffer) on a different resource (Room) than the
          buffered Table rule.
        test_recipe:
          setup:
            - "Room R1 (v=1) has a CONFIRMED booking pb1 for 18:00-20:00 and a HELD back-to-back booking pb2 for 20:00-21:00; Room.version is now 3."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Dragon Den", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room: $.data.id, rv0: $.data.version }
            - call: "POST /private-bookings"
              payload: { room_id: "${room}", start_at: "2026-07-09T18:00:00Z", end_at: "2026-07-09T20:00:00Z", headcount: 8, expected_room_version: "${rv0}" }
              as: Staff
              captures: { pb1: $.data.id }
            - call: "POST /private-bookings/${pb1}/confirm"
              payload: {}
              as: Staff
            - call: "GET /rooms/${room}"
              payload: {}
              as: Staff
              captures: { rv1: $.data.version }
            - call: "POST /private-bookings"
              payload: { room_id: "${room}", start_at: "2026-07-09T20:00:00Z", end_at: "2026-07-09T21:00:00Z", headcount: 8, expected_room_version: "${rv1}" }
              as: Staff
              captures: { pb2: $.data.id }
            - call: "GET /rooms/${room}"
              payload: {}
              as: Staff
              captures: { rv2: $.data.version }
          trigger:
            - call: "POST /private-bookings"
              payload: { room_id: "${room}", start_at: "2026-07-09T19:30:00Z", end_at: "2026-07-09T20:30:00Z", headcount: 8, expected_room_version: "${rv2}" }
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "PrivateBooking.${pb2}.status == HELD  # back-to-back 20:00-21:00 accepted against CONFIRMED 18:00-20:00 (half-open, no buffer)"
            - "response error_id == ERR_ROOM_TIME_CONFLICT  # 19:30-20:30 overlaps CONFIRMED pb1 18:00-20:00"
            - "http_status == 409"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: loyalty_redeem_reverse_conserves_points_balance
        grounds:
          - state_machines.Membership.transitions.ACTIVE_to_SUSPENDED
          - entities.Membership.fields.points_balance
          - entities.Membership.fields.last_redemption_id
          - entities.Membership.fields.last_redemption_status
        distinguishing_aspect: |
          Conserved quantity = loyalty POINTS BALANCE. redeem(-100) followed by reverse(+100)
          leaves points_balance unchanged: 300 -> 200 -> 300. Invariant pinned as
          points_balance_after_reverse == points_balance_before_redeem.
        test_recipe:
          setup:
            - "Member M7 has points_balance 300 (via a loyalty grant of 300; lifetime 300, BRONZE)."
          setup_api_calls:
            - call: "POST /memberships"
              payload: { email: "m7@x.com", full_name: "M Seven" }
              as: Staff
              captures: { m7: $.data.id }
            - call: "POST /memberships/${m7}/loyalty-adjustments"
              payload: { points_delta: 300, reason: "grant" }
              as: Manager
          trigger:
            - call: "POST /memberships/${m7}/redemptions"
              payload: { points_cost: 100, reward_description: "Poster" }
              as: Member
              as_user_id: "${m7}"
              captures: { rid: $.data.last_redemption_id, bal1: $.data.points_balance }
            - call: "POST /memberships/${m7}/redemptions/${rid}/reverse"
              payload: {}
              as: Staff
              captures: { bal2: $.data.points_balance }
          assert:
            - "Membership.${m7}.points_balance == 200 immediately after redemption (300 - 100)"
            - "Membership.${m7}.points_balance == 300 after reverse (restored to pre-redemption balance; points conserved)"
            - "Membership.${m7}.last_redemption_status == REVERSED"

      - name: game_checkout_return_conserves_available_copy_count
        grounds:
          - state_machines.Checkout.transitions.ACTIVE_to_RETURNED
          - state_machines.GameCopy.transitions.AVAILABLE_to_CHECKED_OUT
          - state_machines.GameCopy.transitions.CHECKED_OUT_to_AVAILABLE
          - calculations.condition_fee
          - entities.GameCopy.fields.status
        distinguishing_aspect: |
          Conserved quantity = LIBRARY AVAILABILITY COUNT (a count, not money): checkout
          (-1 available) paired with a same-condition return (+1 available) leaves the count
          of AVAILABLE 'Catan' copies at 2. GC1 returns to AVAILABLE/GOOD with a 0 fee; GC2
          untouched. Different conserved-quantity type from the points balance invariant.
        test_recipe:
          setup:
            - "Two AVAILABLE GOOD 'Catan' copies GC1, GC2 exist (available count 2); a SEATED reservation resv exists."
          setup_api_calls:
            - call: "POST /game-copies"
              payload: { title: "Catan", barcode: "BC-CAT-1", replacement_value_cents: 4000, condition: "GOOD" }
              as: Manager
              captures: { gc1: $.data.id }
            - call: "POST /game-copies"
              payload: { title: "Catan", barcode: "BC-CAT-2", replacement_value_cents: 4000, condition: "GOOD" }
              as: Manager
              captures: { gc2: $.data.id }
            - call: "POST /tables"
              payload: { label: "T12", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0, zone: "MAIN" }
              as: Manager
              captures: { t12: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t12}", party_size: 2, start_at: "2026-07-05T12:00:00Z", end_at: "2026-07-05T14:00:00Z", deposit_cents: 0 }
              as: Staff
              captures: { resv: $.data.id }
            - call: "POST /reservations/${resv}/seat"
              payload: {}
              as: Staff
          trigger:
            - call: "POST /checkouts"
              payload: { game_copy_id: "${gc1}", reservation_id: "${resv}" }
              as: Staff
              captures: { co: $.data.id }
            - call: "POST /checkouts/${co}/return"
              payload: { return_condition: "GOOD" }
              as: Staff
              captures: { fee: $.data.condition_fee_cents }
            - call: "GET /game-copies"
              payload: { title: "Catan", status: "AVAILABLE" }
              as: Staff
          assert:
            - "Checkout.${co}.condition_fee_cents == 0  # returned GOOD == checkout GOOD, no degradation"
            - "GameCopy.${gc1}.status == AVAILABLE and GameCopy.${gc1}.condition == GOOD after return"
            - "count of AVAILABLE 'Catan' copies conserved at 2 (meta.total_count == 2): GC1 (${gc1}) restored, GC2 (${gc2}) untouched"
