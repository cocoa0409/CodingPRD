              as: TaxManager
              captures: { q1: "$.data[0].id" }
          trigger:
            - call: "POST /tax/estimated-payments/${q1}/record-payment"
              payload: { amount_cents: 552538 }
              as: TaxAccountant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OVERPAYMENT (HTTP 422); paid_amount_cents stays 0 and status stays SCHEDULED"

      - name: manual_quarter_gap_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_QUARTER_GAP]
        distinguishing_aspect: "Manual quarter creation must tile contiguously: with only Q1 [01-01, 03-31] present, a Q3 starting 07-01 leaves a gap and is rejected ERR_QUARTER_GAP (distinct from the overlap rule exercised in §1.8)."
        test_recipe:
          setup: ["FY2026 (period starts 2026-01-01); US-IL; manual Q1 [2026-01-01, 2026-03-31] exists"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-IL", name: "Illinois", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_il: $.data.id }
            - call: "POST /tax/estimated-payments"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", quarter_index: 1, period_start_date: "2026-01-01", period_end_date: "2026-03-31", due_date: "2026-04-15", method: CURRENT_YEAR_ANNUALIZED, scheduled_amount_cents: 552537 }
              as: TaxManager
          trigger:
            - call: "POST /tax/estimated-payments"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", quarter_index: 3, period_start_date: "2026-07-01", period_end_date: "2026-09-30", due_date: "2026-10-15", method: CURRENT_YEAR_ANNUALIZED, scheduled_amount_cents: 552537 }
              as: TaxManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_QUARTER_GAP (HTTP 422) — quarter 3 cannot exist while quarter 2 is missing"

      - name: record_payment_zero_amount_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_AMOUNT]
        distinguishing_aspect: "amount_cents == 0 is not a valid payment (amounts must be positive); rejected ERR_INVALID_AMOUNT even on a SCHEDULED quarter in good standing."
        test_recipe:
          setup: ["FY2026; US-IL annualized schedule; quarter 1 SCHEDULED"]
          setup_api_calls:
