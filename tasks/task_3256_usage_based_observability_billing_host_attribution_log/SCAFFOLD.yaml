    roles: [BillingAdmin]
    code: 200
    input: []
    output: BillingPeriod
    side_effects:
      - "status OPEN -> CLOSED"
      - "computes host HWM, P99, charged count"
      - "creates DRAFT Invoice with one InvoiceLine per non-zero meter"
      - "settles elapsed Commitments"

  - method: POST
    path: "/api/billing-accounts/{id}/billing-periods/{id}/settle"
    description: "Settle a closed period (requires invoice PAID or VOID)"
    roles: [BillingAdmin]
    code: 200
    input: []
