      # -------- BRANCHING: three terminal branches, three different effect sets --------
      - name: non_linear_branching_bench_result_three_terminals_diverge
        grounds:
          - state_machines.MeterTestRequest
          - calculations.bench_test_accuracy
          - entities.Meter.fields.accuracy_status
          - entities.MeterTestRequest.fields.deposit_refunded
          - entities.AccountLedgerEntry.fields.source_kind
          - endpoints[POST /meter-test-requests/{id}/record-bench-result]
        distinguishing_aspect: |
          BRANCHING shape: one trigger on one source state (BENCH_TEST_PENDING) forks to three
          distinct terminal states whose side-effect sets are pairwise different, not merely
          different labels. CLOSED_PASS forfeits the deposit and touches nothing else.
          CLOSED_SLOW refunds the deposit but deliberately creates no CORRECTED read and no
          rebill. CLOSED_FAST refunds the deposit AND corrects the read AND drives the bill to
          REBILL_PENDING. Each terminal is then shown to be locked down: a second
          record-bench-result on any of the three is refused.
        test_recipe:
          setup:
            - "RS-STD-2026, the four SUMMER periods and ServiceAccount ACC-1003 exist, with three 1.0 inch masters MTR-P, MTR-S and MTR-F."
            - "Only MTR-F carries the billed history: reads 100000 / 104000 / 108000 / 112000 / 153000, four ISSUED bills, seasonal_baseline_gallons 4000 on the 2026-07 bill."
            - "MTR-P and MTR-S each carry a single 2026-07-31 read and no bills, so their branches cannot disturb any bill."
            - "An investigation on the 2026-07 bill is in EVIDENCE_REQUESTED, and three CUSTOMER-requested BENCH tests each carry a 3000-cent deposit."
