      - name: disclosure_exactly_at_pass_threshold
        grounds:
          - calculations.disclosure_accuracy_score
          - constants.DISCLOSURE_PASS_THRESHOLD
          - constants.PROVISIONAL_CONFIDENCE_FLOOR
          - validations[priority=55]
          - state_machines.BehaviorFinding.OPEN_to_DISMISSED
          - state_machines.Submission.DRAFT_to_PRE_REVIEW_PASSED
          - endpoints[POST /submissions/{id}/pre-review-check]
          - errors.ERR_PRIVACY_DISCLOSURE_INACCURATE
        distinguishing_aspect: |
          Two unmatched MINOR findings give 100 - 5 - 5 = 90 -> 0.9000 which fails, and dismissing one
          gives exactly 0.9500 which must PASS both the queue gate and the APPROVE gate because
          DISCLOSURE_PASS_THRESHOLD is inclusive; the same instance also pins the two in-scope
          boundaries, detected_at == pre_review_checked_at and scanner_confidence == 0.8000, which are
          both inclusive, so the findings are visible to the provisional variant at all.
        test_recipe:
          setup:
            - "PublisherAccount ACTIVE; AppRecord IOS with one PASSED PRIVACY mapping (index 100.00, posture OPEN)"
            - "Submission build 10 with declared_privacy_items == [] and tracking_consent_prompt_present false"
            - "Two OPEN MINOR BehaviorFindings, both detected_at 2026-08-01T00:00:00Z and scanner_confidence exactly 0.8000"
            - "One open ReviewCapacityWindow IOS/POOL_A with 5 slots; clock stays at 2026-08-01T00:00:00Z throughout"
          setup_api_calls:
            - { call: "POST /publisher-accounts", payload: { legal_name: "Northwind Mobile Ltd", contact_email: "ops@northwind.example", membership_paid_through_at: "2027-08-01T00:00:00Z", commerce_program_tier: "STANDARD" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { acct_id: "$.data.id", acct_v1: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { cert_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${cert_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "GET /publisher-accounts/${acct_id}", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { acct_v2: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z", linked_cert_id: "${cert_id}" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { prof_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${prof_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "POST /app-records", payload: { publisher_account_id: "${acct_id}", bundle_id: "com.northwind.wallet", platform: "IOS", display_name: "Northwind Wallet", primary_category: "FINANCE" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { app_id: "$.data.id" } }
            - { call: "POST /guideline-rules", payload: { rule_code: "5.1.1", title: "Data collection and storage", category: "PRIVACY", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: true }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { rule_priv_id: "$.data.id" } }
            - { call: "POST /guideline-rules/${rule_priv_id}/publish", payload: {}, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "POST /feature-mappings", payload: { app_record_id: "${app_id}", guideline_rule_id: "${rule_priv_id}", feature_code: "ACCOUNT_DELETION" }, as: ComplianceOfficer, as_user_id: "u-compliance-1", captures: { fm_priv_id: "$.data.id" } }
            - { call: "POST /feature-mappings/${fm_priv_id}/self-review", payload: { outcome: "START" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /feature-mappings/${fm_priv_id}/self-review", payload: { outcome: "PASS", evidence_ref: "https://evidence.northwind.example/acct-deletion.pdf" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "GET /app-records/${app_id}", payload: {}, as: ReleaseManager, as_user_id: "u-release-1", captures: { app_v_cur: "$.data.version" } }
            - { call: "POST /submissions", payload: { expected_app_record_version: "${app_v_cur}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 10, version_string: "1.0.0", release_mode: "PHASED" }, as: ReleaseManager, as_user_id: "u-release-1", captures: { sub_id: "$.data.id" } }
            - { call: "POST /metadata-locales", payload: { submission_id: "${sub_id}", locale: "en-US", title: "Northwind Wallet", screenshot_counts: { PHONE_65: 3, TABLET_129: 2 }, is_primary: true }, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "PUT /submissions/${sub_id}/age-rating", payload: { age_rating_answers: { VIOLENCE: 0, SEXUAL_CONTENT: 0, DRUGS_ALCOHOL: 0, GAMBLING_SIMULATED: 0, HORROR: 0, PROFANITY: 0, real_money_gambling: false, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, contests: false }, attested_age_rating: 4 }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "PUT /submissions/${sub_id}/privacy-declaration", payload: { declared_privacy_items: [], tracking_consent_prompt_present: false }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /review-capacity-windows", payload: { platform: "IOS", reviewer_pool_code: "POOL_A", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", capacity_slots: 5 }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { win_id: "$.data.id" } }
            - { call: "POST /behavior-findings", payload: { submission_id: "${sub_id}", data_type: "DEVICE_ID", observed_purpose: "ADVERTISING", observed_linked_to_user: true, observed_tracking: true, endpoint_domain: "ads.thirdparty.example", severity: "MINOR", scanner_confidence: 0.8000, detected_at: "2026-08-01T00:00:00Z" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { find_a_id: "$.data.id" } }
            - { call: "POST /behavior-findings", payload: { submission_id: "${sub_id}", data_type: "USAGE_DATA", observed_purpose: "ANALYTICS", observed_linked_to_user: false, observed_tracking: false, endpoint_domain: "metrics.northwind.example", severity: "MINOR", scanner_confidence: 0.8000, detected_at: "2026-08-01T00:00:00Z" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { find_b_id: "$.data.id" } }
          trigger:
            - { call: "POST /submissions/${sub_id}/pre-review-check", payload: {}, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /submissions/${sub_id}/queue", payload: {}, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "POST /behavior-findings/${find_b_id}/triage", payload: { action: "DISMISS", justification: "Aggregate usage metrics are exempt under the 2026.08 reading" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "POST /submissions/${sub_id}/pre-review-check", payload: {}, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /submissions/${sub_id}/queue", payload: {}, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "POST /submissions/${sub_id}/claim", payload: {}, as: PlatformReviewer, as_user_id: "u-reviewer-1" }
            - { call: "POST /submissions/${sub_id}/decision", payload: { outcome: "APPROVE" }, as: PlatformReviewer, as_user_id: "u-reviewer-1" }
          assert:
            - "after the first pre-review-check: Submission.${sub_id}.disclosure_accuracy_score_provisional == 0.9000 (100 - 5 - 5, integer penalties summed before the single division)"
            - "Submission.${sub_id}.pre_review_passed == false and pre_review_blocking_reasons == [\"PRIVACY_DISCLOSURE_INACCURATE\"]"
            - "Submission.${sub_id}.state == DRAFT (a failing report is 200, not a transition)"
            - "first POST /submissions/${sub_id}/queue -> 409 ERR_PRE_REVIEW_NOT_PASSED"
            - "after the DISMISS: BehaviorFinding.${find_b_id}.status == DISMISSED and Submission.${sub_id}.disclosure_accuracy_score_provisional == 0.9500"
            - "second pre-review-check -> 200 with pre_review_blocking_reasons == [] and Submission.${sub_id}.state == PRE_REVIEW_PASSED"
            - "second POST /submissions/${sub_id}/queue -> 200 at exactly 0.9500 (inclusive threshold; a 0.9499 score would be 409 ERR_PRIVACY_DISCLOSURE_INACCURATE)"
            - "after the claim: Submission.${sub_id}.disclosure_accuracy_score_final == 0.9500 (the one OPEN MINOR finding, zero over-disclosure because declared_privacy_items is empty)"
            - "POST /submissions/${sub_id}/decision outcome=APPROVE -> 200 and Submission.${sub_id}.state == APPROVED"
            - "BehaviorFinding.${find_a_id}.status == OPEN (an approved build may still carry an open MINOR finding)"

      - name: empty_effective_mapping_set_index_zero
        grounds:
          - calculations.feature_compliance_index
          - calculations.compliance_posture
          - entities.GuidelineRule.fields.status
          - entities.FeatureMapping.fields.self_review_status
          - state_machines.FeatureMapping.NOT_STARTED_to_IN_PROGRESS
          - state_machines.FeatureMapping.IN_PROGRESS_to_PASSED
          - state_machines.GuidelineRule.DRAFT_to_EFFECTIVE
        distinguishing_aspect: |
          The zero-count boundary is NOT a vacuous pass: an app with no mapping at all scores 0.00,
          and a mapping whose guideline is still DRAFT leaves the score at 0.00 for a different
          reason (it is outside the input set entirely, so both numerator and denominator stay empty),
          while publishing that same rule keeps the printed number at 0.00 but changes the denominator
          to 5, which the next START then lifts to exactly 25.00 via the 0.25 IN_PROGRESS factor.
        test_recipe:
          setup:
            - "PublisherAccount ACTIVE; AppRecord IOS with an ACTIVE DISTRIBUTION_CERT so R2 NO_ACTIVE_DISTRIBUTION_CERT cannot fire"
            - "Zero FeatureMapping rows and zero ImpactAssessment rows on the app"
            - "One SAFETY guideline 1.4.1 (severity_weight 5) created but left in status DRAFT"
            - "Clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - { call: "POST /publisher-accounts", payload: { legal_name: "Northwind Mobile Ltd", contact_email: "ops@northwind.example", membership_paid_through_at: "2027-08-01T00:00:00Z", commerce_program_tier: "STANDARD" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { acct_id: "$.data.id", acct_v1: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { cert_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${cert_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "POST /app-records", payload: { publisher_account_id: "${acct_id}", bundle_id: "com.northwind.wallet", platform: "IOS", display_name: "Northwind Wallet", primary_category: "FINANCE" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { app_id: "$.data.id" } }
            - { call: "POST /guideline-rules", payload: { rule_code: "1.4.1", title: "Physical harm", category: "SAFETY", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: true }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { rule_safety_id: "$.data.id" } }
          trigger:
            - { call: "GET /app-records/${app_id}/compliance-summary", payload: {}, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /feature-mappings", payload: { app_record_id: "${app_id}", guideline_rule_id: "${rule_safety_id}", feature_code: "CHILD_SAFETY_CONTROLS" }, as: ComplianceOfficer, as_user_id: "u-compliance-1", captures: { fm_id: "$.data.id" } }
            - { call: "GET /app-records/${app_id}/compliance-summary", payload: {}, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /guideline-rules/${rule_safety_id}/publish", payload: {}, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "GET /app-records/${app_id}/compliance-summary", payload: {}, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /feature-mappings/${fm_id}/self-review", payload: { outcome: "START" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "GET /app-records/${app_id}/compliance-summary", payload: {}, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /feature-mappings/${fm_id}/self-review", payload: { outcome: "PASS", evidence_ref: "https://evidence.northwind.example/child-safety.pdf" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
          assert:
            - "with zero mappings: AppRecord.${app_id}.feature_compliance_index == 0.00 (empty-set boundary, explicitly NOT 100.00)"
            - "with zero mappings: AppRecord.${app_id}.compliance_posture == RESTRICTED and posture_reason_codes == [\"COMPLIANCE_INDEX_BELOW_FLOOR\"]"
            - "FeatureMapping.${fm_id}.self_review_status == NOT_STARTED and FeatureMapping.${fm_id}.risk_weight == 5"
            - "while GuidelineRule.${rule_safety_id}.status == DRAFT: AppRecord.${app_id}.feature_compliance_index == 0.00 (mapping outside the input set)"
            - "after the publish: GuidelineRule.${rule_safety_id}.status == EFFECTIVE and AppRecord.${app_id}.feature_compliance_index == 0.00 (now 0 earned of 5 total)"
            - "after outcome=START: FeatureMapping.${fm_id}.self_review_status == IN_PROGRESS and AppRecord.${app_id}.feature_compliance_index == 25.00"
            - "after outcome=PASS: AppRecord.${app_id}.feature_compliance_index == 100.00 and compliance_posture == OPEN with posture_reason_codes == []"
            - "GET /feature-mappings?app_record_id=${app_id} returns exactly 1 row at every step"

      - name: retention_boundary_and_half_cent_round_half_up
        grounds:
          - calculations.commission_settlement_cents
          - constants.RETAINED_SUBSCRIBER_RATE
          - entities.CommerceItem.fields.subscriber_retention_months
          - entities.CommerceItem.fields.commission_rate_applied
          - entities.CommerceItem.fields.commission_cents
          - entities.PublisherAccount.fields.settlement_finalized_periods
          - endpoints[GET /app-records/{id}/commerce-settlement]
          - errors.ERR_REVENUE_ALREADY_REPORTED
