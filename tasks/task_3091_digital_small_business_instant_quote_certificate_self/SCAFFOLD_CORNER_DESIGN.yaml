              captures: { p_ch: $.data.id }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-18T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ins/policies/${p_ch}/non-renewal-notices"
              payload: { reason_code: "RISK_ESCALATION" }
              as: ClaimsAdjuster
              as_user_id: adj-2
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger returns 403 with error_id ERR_FORBIDDEN_ROLE"

      - name: policyholder_cannot_administer_appetite_rules
        claim_type: role_exclusive_denial
        grounds: [roles]
        distinguishing_aspect: "Appetite administration is PlatformAdmin-exclusive; a Policyholder (entity-backed) receives ERR_FORBIDDEN_ROLE, not a business error."
        test_recipe:
          setup: ["One account exists."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
