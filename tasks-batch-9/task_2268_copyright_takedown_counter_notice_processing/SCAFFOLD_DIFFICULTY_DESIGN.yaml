            - "RightsHolder.${rh_id}.enrollment_status == PROSPECT and RightsHolder.${rh_id}.program_tier == STANDARD (60.00 is below SUSPENSION_FLOOR 70)"
            - "Account.${acct_id}.strike_points == 30.00 and Account.${acct_id}.standing == LIMITED"

