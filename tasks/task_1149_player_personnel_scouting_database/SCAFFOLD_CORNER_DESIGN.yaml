  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: sign_immediately_visible_on_budget
        claim_type: immediate_visibility
        grounds: ["state_machines.FreeAgentTarget.OFFERED_to_SIGNED", "entities.Budget.fields.committed_cents"]
        distinguishing_aspect: "Immediate consistency: the sign response's side effects are observable in a plain GET issued right after — committed_cents 40000000 with no delay or reconciliation pass."
        test_recipe:
          setup: ["budget base 100000000; OPEN need QB P3; target OFFERED with hit 40000000"]
          setup_api_calls:
            - call: "POST /scouting/budgets"
              payload: { season_year: 2026, base_cap_cents: 100000000, rollover_cents: 0 }
              as: GeneralManager
              captures: { bud: $.data.id }
            - call: "POST /scouting/roster-needs"
              payload: { season_year: 2026, position: "QB", priority_tier: "P3" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets"
              payload: { player_name: "Vet", position: "QB", season_year: 2026, base_salary_cents: 40000000, signing_bonus_cents: 0, contract_years: 1 }
              as: GeneralManager
              captures: { t1: $.data.id }
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "EVALUATING" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "APPROVED" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "OFFERED" }
              as: GeneralManager
          trigger:
            - call: "POST /scouting/free-agent-targets/${t1}/sign"
              payload: { budget_id: "${bud}" }
              as: GeneralManager
            - call: "GET /scouting/budgets/${bud}"
              as: GeneralManager
              captures: { comm: $.data.committed_cents }
          assert:
            - "committed_cents == 40000000 on the immediate follow-up GET"
