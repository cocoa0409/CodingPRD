              payload: { publisher_name: "StreamCo", channel: "VIDEO", min_dark_days: 0 }
              as: AgencyAdmin
              captures: { pl: $.data.id }
            - call: "POST /media-plans"
              payload: { campaign_id: "${camp}", approved_budget_cents: 10000000, allowed_channels: ["VIDEO"] }
              as: MediaBuyer
              as_user_id: "${st_mia}"
              captures: { mp: $.data.id, mp_v1: $.data.version }
          trigger:
            - call: "POST /media-plans/${mp}/approve"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
              captures: { mp_v2: $.data.version }
            - call: "POST /insertion-orders"
              payload: { media_plan_id: "${mp}", placement_id: "${pl}", flight_start: "2026-06-05", flight_end: "2026-06-20", gross_cents: 1000000, expected_media_plan_version: "${mp_v2}" }
              as: MediaBuyer
              as_user_id: "${st_mia}"
              captures: { io: $.data.id }
            - call: "POST /insertion-orders/${io}/place"
              payload: {}
              as: MediaBuyer
              as_user_id: "${st_mia}"
            - call: "POST /insertion-orders/${io}/cancel"
              payload: {}
              as: MediaBuyer
              as_user_id: "${st_mia}"
            - call: "GET /media-plans/${mp}"
              payload: {}
              as: MediaBuyer
              as_user_id: "${st_mia}"
              captures: { mp_v_final: $.data.version }
          assert:
            - "${mp_v1} == 1"
            - "${mp_v2} == 2"
            - "${mp_v_final} == 4"
            - "MediaPlan.${mp}.uncommitted_cents == 10000000"
            - "InsertionOrder.${io}.status == CANCELLED"

      - name: final_invoice_issue_bills_lines_and_void_releases_them
        claim_type: cascading_side_effects
        grounds: [state_machines.TimeEntry.APPROVED_to_BILLED]
        excluded_because:
          difficulty_instance: retainer_cash_conserved_across_issue_and_void
          rationale: "That instance asserts the TimeEntry goes BILLED on issue and returns to APPROVED on void."

  # =========================================================================
  # Consistency model
  # =========================================================================
  - section: consistency_model
    instances:

      - name: all_cascade_effects_are_visible_in_the_same_response
        claim_type: immediate_consistency
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - entities.Invoice.fields.retainer_applied_cents
        distinguishing_aspect: |
          consistency_model is `immediate`: the POST /invoices/{id}/issue response itself already carries
          approval_status ISSUED, retainer_applied_cents 20600 and payment_status PAID — no second read
          is needed, and an immediately-following GET of the Retainer, Client and Campaign shows the
          entire cascade already applied.
        test_recipe:
          setup:
            - "Clock 2026-06-01; Acme; retainer funded exactly 20600; SOW countersigned; campaign IN_FLIGHT."
            - "One APPROVED TimeEntry (60 min SENIOR). A FINAL DRAFT invoice of total 20600."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Dana Lee", grade: "SENIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 6000 }
              as: AgencyAdmin
              captures: { st_dana: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
              captures: { st_ravi: $.data.id }
            - call: "POST /retainers"
              payload: { client_id: "${cli}", initial_funding_cents: 20600, period_start: "2026-06-01", period_end: "2026-09-01" }
              as: AgencyAdmin
              captures: { ret: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli}", rate_card_id: "${rc}", title: "Q3 Retainer SOW", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-06-01", effective_end: "2026-09-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow: $.data.id }
            - call: "POST /sows/${sow}/countersign"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /campaigns"
              payload: { client_id: "${cli}", sow_id: "${sow}", name: "Summer Push", brief_summary: "Drive summer awareness", objective: "AWARENESS" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/launch"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /time-entries"
              payload: { campaign_id: "${camp}", staff_id: "${st_dana}", started_at: "2026-06-02T09:00:00Z", ended_at: "2026-06-02T10:00:00Z", billable: true }
              as: CreativeLead
              as_user_id: "${st_dana}"
              captures: { te: $.data.id }
            - call: "POST /time-entries/${te}/approve"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /invoices"
              payload: { client_id: "${cli}", campaign_id: "${camp}", retainer_id: "${ret}", billing_mode: "FINAL", period_start: "2026-06-01", period_end: "2026-07-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { inv: $.data.id }
            - call: "GET /retainers/${ret}"
              payload: {}
              as: AgencyAdmin
              captures: { ret_v: $.data.version }
          trigger:
            - call: "POST /invoices/${inv}/issue"
              payload: { expected_retainer_version: "${ret_v}" }
              as: AgencyAdmin
              captures: { issued_applied: $.data.retainer_applied_cents, issued_payment: $.data.payment_status }
            - call: "GET /clients/${cli}"
              payload: {}
              as: AgencyAdmin
              captures: { cli_status: $.data.status }
          assert:
            - "${issued_applied} == 20600"
            - "${issued_payment} == PAID"
            - "${cli_status} == CREDIT_HOLD"
            - "Retainer.${ret}.status == DEPLETED"
            - "Campaign.${camp}.status == ON_HOLD"
