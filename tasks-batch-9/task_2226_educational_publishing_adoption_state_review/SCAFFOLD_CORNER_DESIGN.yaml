  - section: errors
    instances:
      - name: every_not_found_code_is_reachable_with_an_unknown_id
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STATE_PROFILE_NOT_FOUND]
          - errors[ERR_ADOPTION_CYCLE_NOT_FOUND]
          - errors[ERR_CONTENT_EDIT_NOT_FOUND]
          - errors[ERR_COMMITTEE_PANEL_NOT_FOUND]
          - errors[ERR_PRESENTATION_SLOT_NOT_FOUND]
          - errors[ERR_PRICING_PROPOSAL_NOT_FOUND]
          - errors[ERR_DISTRICT_ORDER_NOT_FOUND]
          - errors[ERR_PUBLIC_COMMENT_NOT_FOUND]
          - errors[ERR_CORRELATION_ENTRY_NOT_FOUND]
          - errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]
        distinguishing_aspect: |
          Each addressed-resource family returns its own 404 code rather than a generic one, and an
          unknown id inside a request body returns ERR_REFERENCED_RESOURCE_NOT_FOUND rather than the
          addressed-resource code.
        test_recipe:
          setup:
            - "State ND is OPEN_TERRITORY with a SCHEDULED 2027 MATH cycle, one title and one DRAFT submission that has no correlation entries"
          setup_api_calls:
            - call: "POST /state-profiles"
