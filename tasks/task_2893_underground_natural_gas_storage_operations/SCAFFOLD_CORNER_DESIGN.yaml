      - name: interruptible_confirm_refused_while_the_field_is_restricted
        claim_type: violation_to_error
        grounds:
          - validations.priority_10_ERR_INTERRUPTIBLE_RESTRICTED
          - errors.ERR_INTERRUPTIBLE_RESTRICTED
        excluded_because:
          difficulty_instance: interruptible_confirm_gated_on_a_sibling_wells_integrity_state_while_firm_proceeds
          rationale: |
            That §1.8 instance already confirms a FIRM nomination and refuses an INTERRUPTIBLE one on
            the same RESTRICTED field in the same run, which is the whole content of priority 10; a
            breadth instance would replay the identical two calls.

      - name: cushion_gas_floor_refuses_an_oversized_withdrawal
        claim_type: violation_to_error
        grounds:
          - validations.priority_13_ERR_CUSHION_GAS_BREACH
          - errors.ERR_CUSHION_GAS_BREACH
        excluded_because:
          difficulty_instance: cushion_gas_safety_priority_13_wins_over_contract_inventory_fiscal_priority_34
          rationale: |
            The §1.8 instance drives a withdrawal that breaches both the field's working-gas floor and
            the contract's balance, asserting ERR_CUSHION_GAS_BREACH and the untouched inventory, so
            the violation branch of priority 13 is already pinned.

      - name: contract_inventory_floor_refuses_a_withdrawal_beyond_the_balance
        claim_type: violation_to_error
        grounds:
          - validations.priority_34_ERR_CONTRACT_INVENTORY_INSUFFICIENT
          - errors.ERR_CONTRACT_INVENTORY_INSUFFICIENT
        excluded_because:
          difficulty_instance: cushion_gas_safety_priority_13_wins_over_contract_inventory_fiscal_priority_34
          rationale: |
            The same §1.8 instance isolates priority 34 by repairing the field-level breach and
            re-issuing the withdrawal, which then reports ERR_CONTRACT_INVENTORY_INSUFFICIENT with the
            fuel retention included in the comparison — both halves are covered there.

      - name: mit_schedule_conflict_refused_inside_the_clearance_buffer
        claim_type: violation_to_error
        grounds:
          - validations.priority_24_ERR_MIT_WINDOW_CONFLICT
          - errors.ERR_MIT_WINDOW_CONFLICT
          - global_constants.MIT_BUFFER_HOURS
        excluded_because:
          difficulty_instance: mit_windows_padded_by_the_clearance_buffer_on_both_sides
          rationale: |
            That §1.8 instance walks the padded window on both sides — refusing a test that starts
            inside the buffer, admitting the one that clears it by a minute — so the conflict rule and
            its constant are fully exercised.

      - name: compressor_horsepower_oversubscription_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_25_ERR_HORSEPOWER_OVERSUBSCRIBED
          - errors.ERR_HORSEPOWER_OVERSUBSCRIBED
        excluded_because:
          difficulty_instance: compressor_horsepower_aggregated_over_partially_overlapping_windows
          rationale: |
            The §1.8 instance sums allocations across partially overlapping half-open windows and
            asserts both the refusal and the admissible booking that follows once a window is moved,
            which subsumes any single-window violation test.

      - name: curtailed_nomination_third_submit_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_30_ERR_NOMINATION_REVISION_LIMIT
          - errors.ERR_NOMINATION_REVISION_LIMIT
          - global_constants.MAX_REVISION_ROUNDS
        excluded_because:
          difficulty_instance: nomination_curtailed_resubmit_cycle_bounded_by_revision_rounds
          rationale: |
            That §1.8 instance drives the CURTAILED -> SUBMITTED cycle to exhaustion and asserts the
            refusal on the round that would exceed MAX_REVISION_ROUNDS, together with the scheduled
            volumes released on each revision.

      - name: report_submission_refused_above_the_variance_tolerance
        claim_type: violation_to_error
        grounds:
          - validations.priority_38_ERR_REPORT_VARIANCE_EXCEEDED
          - errors.ERR_REPORT_VARIANCE_EXCEEDED
        excluded_because:
          difficulty_instance: report_variance_tolerance_boundary_is_inclusive_at_exactly_half_a_percent
          rationale: |
            That §1.8 instance submits one report at exactly 0.5000% and one just above it, so both
            the pass and the ERR_REPORT_VARIANCE_EXCEEDED refusal are asserted on adjacent measured
            volumes.

      - name: suspended_shipper_cannot_nominate_or_activate
        claim_type: violation_to_error
        grounds:
          - validations.priority_35_ERR_SHIPPER_CREDIT_SUSPENDED
          - errors.ERR_SHIPPER_CREDIT_SUSPENDED
        excluded_because:
          difficulty_instance: cash_out_credit_suspension_cascades_to_a_sibling_contract_nomination
          rationale: |
            The §1.8 instance suspends the shipper through a cash-out that crosses the penalty
            threshold and then shows the sibling contract's nomination refused with
            ERR_SHIPPER_CREDIT_SUSPENDED, which is the only way this rule can be reached.

      - name: ticket_state_check_precedes_the_well_safety_checks
        claim_type: priority_ordering
        grounds:
          - validations.priority_7_ERR_INVALID_TICKET_STATE
          - validations.priority_11_ERR_WELL_INTEGRITY_FAILED
          - validations.priority_12_ERR_WELL_NOT_IN_SERVICE
        excluded_because:
          difficulty_instance: ticket_state_priority_7_wins_over_well_safety_priority_11_and_12
          rationale: |
            That §1.8 instance is built precisely around this conflict: an already-confirmed ticket on
            a well that has since failed its integrity test reports ERR_INVALID_TICKET_STATE, not the
            well-safety codes, and the ordering flips back once the state is legal.

      - name: nomination_window_precedes_the_revision_limit
        claim_type: priority_ordering
        grounds:
          - validations.priority_18_ERR_NOMINATION_WINDOW_CLOSED
          - validations.priority_30_ERR_NOMINATION_REVISION_LIMIT
        excluded_because:
          difficulty_instance: nomination_window_temporal_priority_18_wins_over_revision_limit_priority_30
          rationale: |
            The §1.8 instance holds a nomination that violates both rules and asserts
            ERR_NOMINATION_WINDOW_CLOSED, then rewinds the clock so the same call reports
            ERR_NOMINATION_REVISION_LIMIT — the full ordering proof.

  # =========================================================================
  # ENDPOINTS
  # =========================================================================
  - section: endpoints
    instances:

      - name: contract_create_read_and_filtered_listing_paginate_by_created_at
        claim_type: standard_crud
        grounds:
          - endpoints[POST /storage-contracts]
          - endpoints[GET /storage-contracts/{id}]
          - endpoints[GET /storage-contracts]
          - response_envelope.pagination_defaults
          - response_envelope.list_ordering
        distinguishing_aspect: |
          The list endpoint carries four independent filters plus paging, and the defaults are easy to
          get wrong: with five contracts registered, an unparameterised GET returns all five (five is
          under the default limit of 10) with has_more false, while limit 2 / offset 2 returns the
          THIRD and FOURTH rows in created_at order with total_count still 5. Combining shipper_id with
          service_class narrows to a single row, and a status filter of ACTIVE excludes the DRAFT rows
          even though they match every other filter.
        test_recipe:
          setup:
            - "Field F_MINI with one IN_SERVICE well MINI-1 (so field_posture is OPEN and the activations are not refused with ERR_FIELD_FROZEN) and two shippers NORTHLINE and SOUTHLINE."
            - "Five contracts created in this order: CN-1 FIRM (NORTHLINE, activated), CN-2 INTERRUPTIBLE (NORTHLINE, activated), CN-3 FIRM (NORTHLINE, left DRAFT), CS-1 FIRM (SOUTHLINE, activated), CS-2 INTERRUPTIBLE (SOUTHLINE, left DRAFT)."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Southline Gas Trading", duns_number: "987654321", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s2: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-1", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /storage-contracts/${c1}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-2", service_class: "INTERRUPTIBLE", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "DAILY_RATCHET" }
              as: SchedulingCoordinator
              captures: { c2: $.data.id }
            - call: "POST /storage-contracts/${c2}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-3", service_class: "FIRM", max_storage_quantity_dth: 500000, max_daily_injection_dth: 50000, max_daily_withdrawal_dth: 50000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c3: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s2}", storage_field_id: "${f1}", contract_code: "CS-1", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0500, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c4: $.data.id }
            - call: "POST /storage-contracts/${c4}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s2}", storage_field_id: "${f1}", contract_code: "CS-2", service_class: "INTERRUPTIBLE", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0500, index_price_usd_per_dth: 3.4500, cash_out_method: "DAILY_RATCHET" }
              as: SchedulingCoordinator
              captures: { c5: $.data.id }
          trigger:
            - call: "GET /storage-contracts/${c3}"
