# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7. Corners already probed by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# excluded_because stubs. Logical clock boots at 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_branch_returns_201_with_zeroed_fleet_counters
        claim_type: creation
        grounds:
          - entities.Branch.fields.units_in_yard
          - entities.Branch.fields.units_available
          - entities.Branch.fields.utilization_pct
          - endpoints[POST /branches]
        distinguishing_aspect: "A brand-new Branch answers 201 with units_in_yard 0, units_available 0, utilization_pct 0.00, status OPERATIONAL, version 1 and a server-minted UUID id carrying no type prefix."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /branches"
              payload: { name: "Dallas Yard", region_code: "TX-N", yard_capacity_units: 25, daily_dispatch_capacity: 2, labor_rate_cents_per_hour: 9200 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { b1_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Branch.${b1_id}.units_in_yard == 0"
            - "Branch.${b1_id}.units_available == 0"
            - "Branch.${b1_id}.utilization_pct == 0.00"
            - "Branch.${b1_id}.status == \"OPERATIONAL\""
            - "Branch.${b1_id}.version == 1"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: get_unit_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /units/{id}]
          - entities.Unit.fields.serial_number
          - entities.Unit.fields.status
        distinguishing_aspect: "GET /units/{id} echoes serial_number, building_spec_id, current_branch_id, status IN_FLEET, condition_grade A and version 1 exactly as stored at creation."
        test_recipe:
          setup:
            - "One branch, one building spec and one unit."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Dallas Yard", region_code: "TX-N", yard_capacity_units: 25, daily_dispatch_capacity: 2, labor_rate_cents_per_hour: 9200 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { b1_id: $.data.id }
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2048", width_ft: 20, length_ft: 48, sections: 1, floor_height_in: 24, base_monthly_rate_cents: 118050, delivery_base_cents: 165000, install_base_cents: 120000, replacement_value_cents: 6200000, max_occupancy: 12 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s2_id: $.data.id }
            - call: "POST /units"
              payload: { serial_number: "MSU-2001", building_spec_id: "${s2_id}", current_branch_id: "${b1_id}", condition_grade: "A" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { u2_id: $.data.id }
          trigger:
            - call: "GET /units/${u2_id}"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
          assert:
            - "HTTP status == 200"
            - "Unit.${u2_id}.serial_number == \"MSU-2001\""
            - "Unit.${u2_id}.status == \"IN_FLEET\""
            - "Unit.${u2_id}.condition_grade == \"A\""
            - "Unit.${u2_id}.installed_config_id == null"
            - "Unit.${u2_id}.refurb_cycles == 0 and Unit.${u2_id}.lifetime_relocations == 0"

      - name: list_units_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /units]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three units at one branch, GET /units?current_branch_id=...&limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One branch with three IN_FLEET units on the same building spec."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Dallas Yard", region_code: "TX-N", yard_capacity_units: 25, daily_dispatch_capacity: 2, labor_rate_cents_per_hour: 9200 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { b1_id: $.data.id }
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2048", width_ft: 20, length_ft: 48, sections: 1, floor_height_in: 24, base_monthly_rate_cents: 118050, delivery_base_cents: 165000, install_base_cents: 120000, replacement_value_cents: 6200000, max_occupancy: 12 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s2_id: $.data.id }
            - call: "POST /units"
              payload: { serial_number: "MSU-2001", building_spec_id: "${s2_id}", current_branch_id: "${b1_id}", condition_grade: "A" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
            - call: "POST /units"
              payload: { serial_number: "MSU-2002", building_spec_id: "${s2_id}", current_branch_id: "${b1_id}", condition_grade: "A" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
            - call: "POST /units"
              payload: { serial_number: "MSU-2003", building_spec_id: "${s2_id}", current_branch_id: "${b1_id}", condition_grade: "A" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
          trigger:
            - call: "GET /units?current_branch_id=${b1_id}&limit=2&offset=0"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
            - call: "GET /units?current_branch_id=${b1_id}&limit=2&offset=2"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
          assert:
            - "the first page returns response_type == \"array\" with 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "the second page returns 1 row, total_count == 3, offset == 2, has_more == false"
            - "Branch.${b1_id}.units_in_yard == 3 and Branch.${b1_id}.units_available == 3"

      - name: unknown_ids_return_entity_specific_not_found_errors
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_BRANCH_NOT_FOUND]
          - errors[ERR_UNIT_NOT_FOUND]
          - errors[ERR_LEASE_NOT_FOUND]
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - errors[ERR_CONFIG_NOT_FOUND]
          - errors[ERR_BUILDING_SPEC_NOT_FOUND]
          - errors[ERR_PERMIT_NOT_FOUND]
          - errors[ERR_LOGISTICS_JOB_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_REFURB_ORDER_NOT_FOUND]
          - errors[ERR_ACCESSORY_PACKAGE_NOT_FOUND]
        distinguishing_aspect: "Each unknown-id lookup answers 404 with the error_id that names the MISSING entity type, not a generic not-found: a bogus branch id gives ERR_BRANCH_NOT_FOUND while a bogus lease id on the same catalog gives ERR_LEASE_NOT_FOUND."
        test_recipe:
          setup:
            - "One branch and one building spec exist so the catalog is non-empty; every id used in the trigger is a well-formed UUID that was never minted."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Dallas Yard", region_code: "TX-N", yard_capacity_units: 25, daily_dispatch_capacity: 2, labor_rate_cents_per_hour: 9200 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { b1_id: $.data.id }
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2048", width_ft: 20, length_ft: 48, sections: 1, floor_height_in: 24, base_monthly_rate_cents: 118050, delivery_base_cents: 165000, install_base_cents: 120000, replacement_value_cents: 6200000, max_occupancy: 12 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s2_id: $.data.id }
          trigger:
            - call: "GET /branches/11111111-1111-4111-8111-111111111111"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_branch: $.data.error_id }
            - call: "GET /units/22222222-2222-4222-8222-222222222222"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_unit: $.data.error_id }
            - call: "GET /leases/33333333-3333-4333-8333-333333333333"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_lease: $.data.error_id }
            - call: "GET /customers/44444444-4444-4444-8444-444444444444"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_customer: $.data.error_id }
            - call: "GET /floorplan-configurations/55555555-5555-4555-8555-555555555555"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_config: $.data.error_id }
            - call: "GET /building-specs/66666666-6666-4666-8666-666666666666"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_spec: $.data.error_id }
            - call: "GET /permit-applications/77777777-7777-4777-8777-777777777777"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_permit: $.data.error_id }
            - call: "GET /logistics-jobs/88888888-8888-4888-8888-888888888888"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_job: $.data.error_id }
            - call: "GET /damage-assessments/99999999-9999-4999-8999-999999999999"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_assessment: $.data.error_id }
            - call: "GET /refurbishment-orders/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_refurb: $.data.error_id }
            - call: "GET /accessory-packages/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_accessory: $.data.error_id }
            - call: "POST /floorplan-configurations"
              payload: { building_spec_id: "cccccccc-cccc-4ccc-8ccc-cccccccccccc", name: "Ghost Plan", private_offices: 1, restrooms: 1, partition_linear_ft: 10, hvac_tons: 1.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_body_spec: $.data.error_id }
            - call: "POST /units"
              payload: { serial_number: "MSU-9999", building_spec_id: "${s2_id}", current_branch_id: "dddddddd-dddd-4ddd-8ddd-dddddddddddd", condition_grade: "A" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { e_body_branch: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 404"
            - "error_ids are, in order: ERR_BRANCH_NOT_FOUND, ERR_UNIT_NOT_FOUND, ERR_LEASE_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND, ERR_CONFIG_NOT_FOUND, ERR_BUILDING_SPEC_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_LOGISTICS_JOB_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_REFURB_ORDER_NOT_FOUND, ERR_ACCESSORY_PACKAGE_NOT_FOUND, ERR_BUILDING_SPEC_NOT_FOUND, ERR_BRANCH_NOT_FOUND"
            - "no FloorplanConfiguration and no Unit row was created by the two rejected POSTs"

      - name: create_lease_missing_required_start_date_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /leases]
        distinguishing_aspect: "Omitting the required start_date on POST /leases returns 422 ERR_INVALID_REQUEST and leaves the unit in IN_FLEET — no partial lease row and no reservation side effect."
        test_recipe:
          setup:
            - "Catalog with a PUBLISHED configuration, a customer and one IN_FLEET unit."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Dallas Yard", region_code: "TX-N", yard_capacity_units: 25, daily_dispatch_capacity: 2, labor_rate_cents_per_hour: 9200 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { b1_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "TX-RUR", name: "Rural County", permit_required: false, permit_lead_days: 0, anchoring_standard: "GROUND_ANCHOR", wind_zone: 1, permit_fee_cents: 0, ada_ramp_required: false, min_ramp_run_ratio: 12.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { j2_id: $.data.id }
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2048", width_ft: 20, length_ft: 48, sections: 1, floor_height_in: 24, base_monthly_rate_cents: 118050, delivery_base_cents: 165000, install_base_cents: 120000, replacement_value_cents: 6200000, max_occupancy: 12 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s2_id: $.data.id }
            - call: "POST /floorplan-configurations"
              payload: { building_spec_id: "${s2_id}", name: "Open Plan", private_offices: 2, restrooms: 1, partition_linear_ft: 22, hvac_tons: 2.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { c2_id: $.data.id }
            - call: "POST /floorplan-configurations/${c2_id}/publish"
              payload: {}
              as: FleetAdmin
              as_user_id: "admin-ops-1"
            - call: "POST /units"
              payload: { serial_number: "MSU-2001", building_spec_id: "${s2_id}", current_branch_id: "${b1_id}", condition_grade: "A" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { u2_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Basin Drilling", billing_email: "ap@basin.test", credit_tier: "GOLD", credit_limit_cents: 5000000 }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { cu2_id: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { customer_id: "${cu2_id}", unit_id: "${u2_id}", jurisdiction_id: "${j2_id}", floorplan_configuration_id: "${c2_id}", site_address: "9 County Road 12, Rural TX", term_months: 12 }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == \"ERR_INVALID_REQUEST\""
            - "Unit.${u2_id}.status == \"IN_FLEET\""
            - "Unit.${u2_id}.version == 1"
            - "GET /leases?unit_id=${u2_id} returns total_count == 0"

      - name: accessory_package_omitting_ramp_fields_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.AccessoryPackage.fields.ramp_run_ft
          - entities.AccessoryPackage.fields.landing_count
          - entities.AccessoryPackage.fields.step_count
          - calculations.accessory_package_rate
          - calculations.ada_ramp_compliance
        distinguishing_aspect: "A STEPS package created with none of ramp_run_ft / landing_count / step_count defaults all three to 0, prices at exactly the 12500-cent base and scores NON_COMPLIANT because package_type is not RAMP_ADA or COMBO."
        test_recipe:
          setup:
            - "Permit-free, ADA-free TX-RUR catalog with a PUBLISHED configuration, a customer and a PENDING lease on an IN_FLEET unit."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Dallas Yard", region_code: "TX-N", yard_capacity_units: 25, daily_dispatch_capacity: 2, labor_rate_cents_per_hour: 9200 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { b1_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "TX-RUR", name: "Rural County", permit_required: false, permit_lead_days: 0, anchoring_standard: "GROUND_ANCHOR", wind_zone: 1, permit_fee_cents: 0, ada_ramp_required: false, min_ramp_run_ratio: 12.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { j2_id: $.data.id }
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2048", width_ft: 20, length_ft: 48, sections: 1, floor_height_in: 24, base_monthly_rate_cents: 118050, delivery_base_cents: 165000, install_base_cents: 120000, replacement_value_cents: 6200000, max_occupancy: 12 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s2_id: $.data.id }
            - call: "POST /floorplan-configurations"
              payload: { building_spec_id: "${s2_id}", name: "Open Plan", private_offices: 2, restrooms: 1, partition_linear_ft: 22, hvac_tons: 2.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { c2_id: $.data.id }
            - call: "POST /floorplan-configurations/${c2_id}/publish"
              payload: {}
              as: FleetAdmin
              as_user_id: "admin-ops-1"
            - call: "POST /units"
              payload: { serial_number: "MSU-2001", building_spec_id: "${s2_id}", current_branch_id: "${b1_id}", condition_grade: "A" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { u2_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Basin Drilling", billing_email: "ap@basin.test", credit_tier: "GOLD", credit_limit_cents: 5000000 }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { cu2_id: $.data.id }
            - call: "POST /leases"
              payload: { customer_id: "${cu2_id}", unit_id: "${u2_id}", jurisdiction_id: "${j2_id}", floorplan_configuration_id: "${c2_id}", site_address: "9 County Road 12, Rural TX", start_date: "2026-10-01", term_months: 12 }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { l2_id: $.data.id }
          trigger:
            - call: "POST /accessory-packages"
              payload: { lease_id: "${l2_id}", package_type: "STEPS" }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { pkg_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "AccessoryPackage.${pkg_id}.ramp_run_ft == 0"
            - "AccessoryPackage.${pkg_id}.landing_count == 0"
            - "AccessoryPackage.${pkg_id}.step_count == 0"
            - "AccessoryPackage.${pkg_id}.monthly_accessory_rate_cents == 12500"
            - "AccessoryPackage.${pkg_id}.compliance_status == \"NON_COMPLIANT\""
            - "Lease.${l2_id}.monthly_accessory_rate_cents == 12500"
            - "Lease.${l2_id}.quoted_total_cents == 2026280"

      - name: building_spec_floor_area_is_computed_and_client_input_ignored
        claim_type: computed_fields
        grounds:
          - calculations.building_spec_area
          - entities.BuildingSpec.fields.floor_area_sqft
        distinguishing_aspect: "floor_area_sqft is width_ft * length_ft == 1440 for a 24x60 two-section spec; `sections` never multiplies it, and a client-sent floor_area_sqft value is not persisted."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2460", width_ft: 24, length_ft: 60, sections: 2, floor_height_in: 36, base_monthly_rate_cents: 118000, delivery_base_cents: 240000, install_base_cents: 185000, replacement_value_cents: 9500000, max_occupancy: 24 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s1_id: $.data.id, area: $.data.floor_area_sqft }
          assert:
            - "BuildingSpec.${s1_id}.floor_area_sqft == 1440"
            - "BuildingSpec.${s1_id}.floor_area_sqft != 2880"
            - "BuildingSpec.${s1_id}.sections == 2"

      - name: unit_system_fields_are_server_minted_and_untyped
        claim_type: system_fields
        grounds:
          - entities.Unit.fields.status
          - entities.Unit.fields.installed_config_id
          - entities.Unit.fields.latest_quote_estimate_cents
        distinguishing_aspect: "A newly created Unit carries a bare UUID id with no `unit_` prefix, created_at/updated_at as ISO-8601 UTC with three fractional digits, version 1, status IN_FLEET and installed_config_id null — none of which the client supplied."
        test_recipe:
          setup:
            - "One branch and one building spec."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Dallas Yard", region_code: "TX-N", yard_capacity_units: 25, daily_dispatch_capacity: 2, labor_rate_cents_per_hour: 9200 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { b1_id: $.data.id }
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2048", width_ft: 20, length_ft: 48, sections: 1, floor_height_in: 24, base_monthly_rate_cents: 118050, delivery_base_cents: 165000, install_base_cents: 120000, replacement_value_cents: 6200000, max_occupancy: 12 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { serial_number: "MSU-2001", building_spec_id: "${s2_id}", current_branch_id: "${b1_id}" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { u2_id: $.data.id }
          assert:
            - "Unit.${u2_id}.id matches the bare UUID form (no `unit_` or other type prefix)"
            - "Unit.${u2_id}.version == 1"
            - "Unit.${u2_id}.status == \"IN_FLEET\""
            - "Unit.${u2_id}.condition_grade == \"A\" (declared default applied when omitted)"
            - "Unit.${u2_id}.installed_config_id == null"
            - "Unit.${u2_id}.latest_quote_estimate_cents == 0"
            - "Unit.${u2_id}.created_at and Unit.${u2_id}.updated_at are ISO-8601 UTC with three fractional digits"

      - name: create_jurisdiction_with_illegal_anchoring_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Jurisdiction.fields.anchoring_standard
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "anchoring_standard accepts only NONE / GROUND_ANCHOR / PIER_FOUNDATION / ENGINEERED_SLAB; the value \"HELICAL_PILE\" returns 422 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "TX-BAD", name: "Bad County", permit_required: true, permit_lead_days: 10, anchoring_standard: "HELICAL_PILE", wind_zone: 2, permit_fee_cents: 100000, ada_ramp_required: false, min_ramp_run_ratio: 12.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == \"ERR_INVALID_REQUEST\""
            - "no Jurisdiction row with code TX-BAD exists afterwards"

      - name: damage_line_item_is_immutable_append_only_with_no_version
        claim_type: immutability
        grounds:
          - entities.DamageLineItem
          - endpoints[POST /damage-assessments/{id}/line-items]
          - endpoints[GET /damage-assessments/{id}/line-items]
        distinguishing_aspect: "DamageLineItem is declared common_fields: false — its rows expose id and created_at but no version and no updated_at, and §1.5 declares no update or delete route for them; the sub-resource GET returns them in created_at ASC order."
        test_recipe:
          setup:
