            - call: "POST /crew-days"
              payload: { project_id: "${proj_ac_id}", worker_id: "${w_ap_ac_id}", foreman_id: "${w_jm_ac_id}", trade_activity_id: "${act_ac_id}", work_date_iso: "2026-10-01T00:00:00Z", regular_hours: 4.0, overtime_hours: 0.0, report_sequence: 2, acknowledge_mode: "FINAL" }
              as: GeneralForeman
