            - call: "POST /lanes"
              payload: { number: 272 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "er2@x.com", full_name: "ER2 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-09-29T18:00:00.000Z", end_at: "2026-09-29T19:00:00.000Z", bowler_count: 2, game_count: 1 }
              as: FrontDesk
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /reservations/${r_id}/waitlist"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
