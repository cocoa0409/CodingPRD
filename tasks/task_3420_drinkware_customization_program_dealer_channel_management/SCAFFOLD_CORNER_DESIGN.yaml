        grounds:
          - calculations.customization_quote_cents
        distinguishing_aspect: "Each pinned constant shows up in the total: 150c per extra color (x3), 200c per extra placement (x2), the 8000c setup fee because 10 < 144, no INDIVIDUAL tier rate, off-peak x1.0 -> exactly 36500c."
