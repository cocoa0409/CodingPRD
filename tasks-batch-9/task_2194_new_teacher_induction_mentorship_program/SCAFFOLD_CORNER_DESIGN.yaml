            - "data.snapshot_contact_minutes == 0, data.snapshot_observation_cycles == 0, data.snapshot_credited_seminars == 0, data.snapshot_held_sessions == 0, data.snapshot_excused_sessions == 0"
            - "GET /milestone-attainments/${a2_id} reports status == \"IN_PROGRESS\" — the LOCKED->IN_PROGRESS unlock bubbled up from its prerequisite"
            - "GET /novice-teachers/${novice_id} reports attained_milestone_count == 1 and readiness_index_snapshot == 0.00"
            - "GET /novice-teachers/${novice_id} reports license_advancement_status == \"NOT_ELIGIBLE\" and license_stage == \"PRELIMINARY\" — IND_M1 does not gate the recommendation"

      - name: novice_withdraw_ends_match_and_abandons_open_cycle
        claim_type: cross_entity
        grounds: [state_machines.NoviceTeacher.transitions.ACTIVE_to_WITHDRAWN, state_machines.MentorMatch.transitions.ACTIVE_to_ENDED, "endpoints[POST /novice-teachers/{id}/withdraw]"]
