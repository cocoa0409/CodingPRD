# =============================================================================
# Task 1588: Rice Mill & Drying Facility — §1.9 Scaffold Corner Design
# (breadth coverage of §1.1–§1.7 claims not already probed by §1.8)
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: season_create_client_clock_input_ignored
        claim_type: defaults
        grounds: ["entities.HarvestSeason.fields.current_clock_iso", "entities.HarvestSeason.fields.status"]
        distinguishing_aspect: "A client-supplied current_clock_iso is ignored; a new season starts SETUP with the logical clock at exactly 2026-08-01T00:00:00Z and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2, current_clock_iso: "2030-01-01T00:00:00Z" }
              as: MillAdmin
              captures: { sid: $.data.id, clk: $.data.current_clock_iso, st: $.data.status, ver: $.data.version }
          assert:
            - "captured clk == 2026-08-01T00:00:00Z (client input ignored; fixed default, never wall-clock)"
            - "captured st == SETUP and captured ver == 1"
            - "captured sid is a bare UUID with no type prefix"

      - name: lot_create_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: ["entities.PaddyLot.fields.net_wet_cwt", "entities.PaddyLot.fields.provisional_dry_weight_cwt"]
        distinguishing_aspect: "Client-supplied dry_weight_cwt and status on intake are ignored; the server computes net_wet_cwt 363.00 and provisional_dry_weight_cwt 340.32 and forces status WEIGHED."
        test_recipe:
          setup: ["season INTAKE_OPEN; grower FARM-001"]
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 48300, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 18.0, spot_price_cents_per_cwt: 1300, dry_weight_cwt: 1.00, status: "SETTLED" }
              as: ScaleOperator
              captures: { net: $.data.net_wet_cwt, prov: $.data.provisional_dry_weight_cwt, st: $.data.status }
          assert:
            - "captured net == 363.00 and captured prov == 340.32 (server-computed; client dry_weight_cwt 1.00 ignored)"
            - "captured st == WEIGHED (client status SETTLED ignored)"

      - name: grower_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "entities.Grower"]
        distinguishing_aspect: "GET /mill/growers honors limit/offset and returns the envelope pagination fields total_count and has_more."
        test_recipe:
          setup: ["season; two growers FARM-001 and FARM-002 in the season"]
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-002", legal_name: "Bayou Grain" }
              as: Merchandiser
          trigger:
            - call: "GET /mill/growers"
              payload: { season_id: "${s_id}", limit: 1, offset: 0 }
              as: Merchandiser
              captures: { first_code: "$.data[0].farm_code" }
          assert:
            - "response envelope has meta.api_request_id, response_type == array"
            - "exactly 1 row returned; total_count == 2; has_more == true"
            - "second page (offset 1) returns the other farm_code and has_more == false"

      - name: grower_duplicate_farm_code_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_FARM_CODE]", "validations[priority=10]"]
        distinguishing_aspect: "farm_code is unique per season: the second grower with FARM-001 in the same season fails with ERR_DUPLICATE_FARM_CODE."
        test_recipe:
          setup: ["season; grower FARM-001 exists"]
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
          trigger:
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Copycat Farms" }
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_DUPLICATE_FARM_CODE (409)"

      - name: bin_duplicate_code_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_BIN_CODE]", "validations[priority=10]"]
        distinguishing_aspect: "bin_code is unique per season: a second bin B-01 fails with ERR_DUPLICATE_BIN_CODE."
        test_recipe:
          setup: ["season; bin B-01 exists"]
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/bins"
              payload: { season_id: "${s_id}", bin_code: "B-01", capacity_cwt: 500.00 }
              as: MillAdmin
          trigger:
            - call: "POST /mill/bins"
              payload: { season_id: "${s_id}", bin_code: "B-01", capacity_cwt: 300.00 }
              as: MillAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_DUPLICATE_BIN_CODE (409)"

      - name: contract_create_missing_required_field
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "POST /mill/contracts without contracted_cwt fails shape validation with ERR_INVALID_REQUEST (400) before any state or business check."
        test_recipe:
          setup: ["season; grower"]
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /mill/contracts"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", base_price_cents_per_cwt: 1500, grade_adjustments: { US_NO_1: 0, US_NO_2: 0, US_NO_3: 0, US_NO_4: 0, US_NO_5: 0, SAMPLE: 0 } }
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_REQUEST (missing contracted_cwt)"

      - name: fk_reverse_reachability_filtered_lists
        claim_type: parent_relationships
        grounds: ["entities.PaddyLot.fields.grower_id", "entities.PaddyLot.fields.contract_id", "entities.Settlement.fields.grower_id"]
        distinguishing_aspect: "Every FK is reverse-reachable: GET /mill/lots filtered by grower_id and by contract_id returns exactly the matching lots; other growers' lots are excluded."
        test_recipe:
          setup:
            - "season INTAKE_OPEN; growers G1 FARM-001 and G2 FARM-002; one SPOT lot for G1, one SPOT lot for G2"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
              captures: { g1: $.data.id }
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-002", legal_name: "Bayou Grain" }
              as: Merchandiser
              captures: { g2: $.data.id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g1}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 48300, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 15.0, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { l1: $.data.id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g2}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 40000, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 15.0, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { l2: $.data.id }
          trigger:
            - call: "GET /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g1}" }
              as: ScaleOperator
              captures: { row1: "$.data[0].id" }
          assert:
            - "exactly 1 row returned and captured row1 == ${l1} (G2's lot ${l2} excluded)"
            - "GET /mill/lots with grower_id ${g2} returns exactly ${l2}"
            - "GET /mill/lots with status WEIGHED returns both lots"

  - section: state_machines
    instances:
      - name: lot_invalid_transitions_from_each_state
        claim_type: invalid_transition
        grounds: ["state_machines.PaddyLot", "errors[ERR_INVALID_LOT_STATE]"]
        distinguishing_aspect: "grade on a GRADED lot, store on a WEIGHED lot, and regrade on a REJECTED lot each fail with ERR_INVALID_LOT_STATE; only declared transitions fire."
        test_recipe:
          setup: ["season INTAKE_OPEN; grower; two SPOT lots L1 (graded) and L2 (weighed)"]
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/bins"
              payload: { season_id: "${s_id}", bin_code: "B-01", capacity_cwt: 500.00 }
              as: MillAdmin
              captures: { b_id: $.data.id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 48300, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 15.0, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { l1: $.data.id }
            - call: "POST /mill/lots/${l1}/grade"
              payload: { moisture_pct_official: 15.0, foreign_matter_pct: 0.4, damage_pct: 0.4, broken_pct: 2.0 }
              as: QualityLabTech
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 48300, tare_weight_lbs: 12000, scheduled_date: "2026-08-11", moisture_pct_handheld: 15.0, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { l2: $.data.id }
          trigger:
            - call: "POST /mill/lots/${l1}/grade"
              payload: { moisture_pct_official: 15.0, foreign_matter_pct: 0.4, damage_pct: 0.4, broken_pct: 2.0 }
              as: QualityLabTech
              captures: { err1: $.data.error_id }
            - call: "POST /mill/lots/${l2}/store"
              payload: { bin_id: "${b_id}" }
              as: ScaleOperator
              captures: { err2: $.data.error_id }
            - call: "POST /mill/lots/${l2}/reject"
              payload: { reject_reason: "wet load refused" }
              as: QualityLabTech
              captures: { l2_st: $.data.status }
            - call: "POST /mill/lots/${l2}/regrade"
              payload: { moisture_pct_official: 14.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
              as: QualityLabTech
              captures: { err3: $.data.error_id }
          assert:
            - "captured err1 == ERR_INVALID_LOT_STATE (grade requires WEIGHED)"
            - "captured err2 == ERR_INVALID_LOT_STATE (store requires GRADED)"
            - "captured l2_st == REJECTED"
            - "captured err3 == ERR_INVALID_LOT_STATE (regrade on terminal REJECTED)"

      - name: terminal_settled_lot_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.PaddyLot", "state_machines.Settlement"]
        distinguishing_aspect: "Once a lot is SETTLED (via settlement approve), every further mutation — regrade, reject, store — is rejected; SETTLED and REJECTED are terminal."
        test_recipe:
          setup:
            - "season through SETTLEMENT_REVIEW; contract lot 100.10 dry BINNED; settlement approved (lot SETTLED)"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-002", legal_name: "Bayou Grain" }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/contracts"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", contracted_cwt: 250.00, base_price_cents_per_cwt: 1000, grade_adjustments: { US_NO_1: 0, US_NO_2: 0, US_NO_3: 0, US_NO_4: 0, US_NO_5: 0, SAMPLE: 0 } }
              as: Merchandiser
              captures: { c_id: $.data.id, cv1: $.data.version }
            - call: "POST /mill/bins"
              payload: { season_id: "${s_id}", bin_code: "B-01", capacity_cwt: 500.00 }
              as: MillAdmin
              captures: { b_id: $.data.id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "CONTRACT", contract_id: "${c_id}", expected_contract_version: "${cv1}", gross_weight_lbs: 22010, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 13.0 }
              as: ScaleOperator
              captures: { l1: $.data.id }
            - call: "POST /mill/lots/${l1}/grade"
              payload: { moisture_pct_official: 13.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
              as: QualityLabTech
            - call: "POST /mill/lots/${l1}/store"
              payload: { bin_id: "${b_id}" }
              as: ScaleOperator
            - call: "POST /mill/seasons/${s_id}/close-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/settlements"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31" }
              as: SettlementClerk
              as_user_id: "clerk-1"
              captures: { st_id: $.data.id }
            - call: "POST /mill/settlements/${st_id}/issue-provisional"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-1"
            - call: "POST /mill/seasons/${s_id}/begin-settlement-review"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/settlements/${st_id}/approve"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-2"
          trigger:
            - call: "POST /mill/lots/${l1}/regrade"
              payload: { moisture_pct_official: 14.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
              as: QualityLabTech
              captures: { err1: $.data.error_id }
            - call: "POST /mill/lots/${l1}/reject"
              payload: { reject_reason: "late rejection attempt" }
              as: QualityLabTech
              captures: { err2: $.data.error_id }
            - call: "GET /mill/lots/${l1}"
              as: QualityLabTech
              captures: { lot_st: $.data.status }
          assert:
            - "captured lot_st == SETTLED"
            - "captured err1 == ERR_INVALID_LOT_STATE and captured err2 == ERR_INVALID_LOT_STATE (terminal lockdown)"

      - name: run_and_order_invalid_transitions
        claim_type: invalid_transition
        grounds: ["state_machines.DryingRun", "state_machines.MillRun", "state_machines.PackagingRun", "state_machines.ByproductSaleOrder"]
        distinguishing_aspect: "complete on a CANCELLED drying run, complete on a SCHEDULED (never started) mill run, ship on an OPEN byproduct order, and a second cancel on a CANCELLED packaging run each fail with their entity-specific state error; a BINNED lot also cannot enter a drying run."
        test_recipe:
          setup:
            - "season INTAKE_OPEN; grower; bin B-01 cap 800.00 with 300.00 LONG_GRAIN stock; lot L2 GRADED 288.16 dry with a CANCELLED drying run; mill run SCHEDULED input 100.00; byproduct order OPEN; packaging run SCHEDULED"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/bins"
              payload: { season_id: "${s_id}", bin_code: "B-01", capacity_cwt: 800.00 }
              as: MillAdmin
              captures: { b_id: $.data.id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 42000, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 13.0, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { l1: $.data.id }
            - call: "POST /mill/lots/${l1}/grade"
              payload: { moisture_pct_official: 13.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
              as: QualityLabTech
            - call: "POST /mill/lots/${l1}/store"
              payload: { bin_id: "${b_id}" }
              as: ScaleOperator
            - call: "POST /mill/drying-runs"
              payload: { season_id: "${s_id}", lot_ids: ["${l1}"], destination_bin_id: "${b_id}" }
              as: DryerOperator
              captures: { err_pre: $.data.error_id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 42000, tare_weight_lbs: 12000, scheduled_date: "2026-08-11", moisture_pct_handheld: 16.0, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { l2: $.data.id }
            - call: "POST /mill/lots/${l2}/grade"
              payload: { moisture_pct_official: 16.0, foreign_matter_pct: 0.4, damage_pct: 0.4, broken_pct: 2.0 }
              as: QualityLabTech
            - call: "POST /mill/drying-runs"
              payload: { season_id: "${s_id}", lot_ids: ["${l2}"], destination_bin_id: "${b_id}" }
              as: DryerOperator
              captures: { dr1: $.data.id }
            - call: "POST /mill/drying-runs/${dr1}/cancel"
              payload: {}
              as: DryerOperator
            - call: "POST /mill/mill-runs"
              payload: { season_id: "${s_id}", input_bin_id: "${b_id}", input_cwt: 100.00 }
              as: MillSupervisor
              captures: { mr1: $.data.id }
            - call: "POST /mill/byproduct-orders"
              payload: { season_id: "${s_id}", product: "BRAN", quantity_cwt: 5.00, price_cents_per_cwt: 1800, buyer_name: "FeedCo" }
              as: Merchandiser
              captures: { bo1: $.data.id }
            - call: "POST /mill/packaging-runs"
              payload: { season_id: "${s_id}", line_id: "LINE_1", brand_label: "MillHouse", package_size_kg: 10, units_planned: 10, starts_at: "2026-08-20T08:00:00Z", ends_at: "2026-08-20T09:00:00Z" }
              as: MillSupervisor
              captures: { pr1: $.data.id }
          trigger:
            - call: "POST /mill/drying-runs/${dr1}/complete"
              payload: { actual_output_cwt: 288.16 }
              as: DryerOperator
              captures: { err1: $.data.error_id }
            - call: "POST /mill/mill-runs/${mr1}/complete"
              payload: {}
              as: MillSupervisor
              captures: { err2: $.data.error_id }
            - call: "POST /mill/byproduct-orders/${bo1}/ship"
              payload: {}
              as: Merchandiser
              captures: { err3: $.data.error_id }
            - call: "POST /mill/packaging-runs/${pr1}/complete"
              payload: { units_produced: 10 }
              as: MillSupervisor
              captures: { err4: $.data.error_id }
            - call: "POST /mill/packaging-runs/${pr1}/cancel"
              payload: {}
              as: MillSupervisor
              captures: { pr_st: $.data.status }
            - call: "POST /mill/packaging-runs/${pr1}/cancel"
              payload: {}
              as: MillSupervisor
              captures: { err5: $.data.error_id }
          assert:
            - "captured err_pre == ERR_INVALID_LOT_STATE (drying-run create requires its lots GRADED; L1 is BINNED)"
            - "captured err1 == ERR_DRYING_RUN_NOT_PLANNED (run was CANCELLED)"
            - "captured err2 == ERR_MILL_RUN_INVALID_STATE (complete requires IN_PROCESS)"
            - "captured err3 == ERR_ORDER_INVALID_STATE (ship requires RESERVED)"
            - "captured err4 == ERR_INSUFFICIENT_MILLED_RICE (no head rice produced yet; state SCHEDULED is valid but inventory check fails)"
