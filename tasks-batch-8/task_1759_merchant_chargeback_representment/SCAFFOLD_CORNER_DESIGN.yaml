              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-WE1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb1: $.data.id }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-2", network_case_id: "NC-WE2", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb2: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb1}/notify", as: AcquirerOps, payload: {} }
            - { call: "POST /acquirer/chargebacks/${cb2}/notify", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb2}", evidence_type: RECEIPT, document_uri: "s3://ev/other.pdf" }
              captures: { ev_other: $.data.id }
