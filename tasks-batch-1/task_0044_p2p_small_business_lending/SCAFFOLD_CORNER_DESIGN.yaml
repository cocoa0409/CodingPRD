              payload: { business_name: "ThreeMiss", ein: "80-8000003", state_code: "MA" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_id: $.data.0.id, l_v0: $.data.0.version }
            - call: "POST /compliance-disclosures"
              payload: { loan_id: "${l_id}", document_type: "SERIES_NOTE_PROSPECTUS" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /investors"
              payload: { display_name: "Inv TM", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investments"
              payload: { investor_id: "${inv_id}", loan_id: "${l_id}", amount_cents: 1200000, expected_loan_version: "${l_v0}" }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /loans/${l_id}/disburse"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /loans/${l_id}/assess-late-fee"
              payload: {}
              as: PlatformAdmin
            - call: "POST /loans/${l_id}/assess-late-fee"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /loans/${l_id}/assess-late-fee"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Loan.${l_id}.missed_payment_count == 3 and Loan.${l_id}.status == DEFAULTED"
            - "Loan.${l_id}.late_fee_outstanding_cents == 15492 (3 * 5164)"

  # =================================================================
  # Consistency Model
  # =================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_committed_cents_visible_in_same_response
        claim_type: immediate
        grounds: [entities.Loan.fields.committed_cents]
        distinguishing_aspect: "Immediate consistency: the loan read right after an investment commit shows committed_cents already updated within the same request cycle (no lag)."
        excluded_because:
          difficulty_instance: transitive_cascade / scheduled_repayment_cascade_loan_investment_allocation_depth2
          rationale: "Derived-field immediacy after a mutation is asserted by the depth-2 cascade instance (loan + investment fields read immediately post-repayment)."
