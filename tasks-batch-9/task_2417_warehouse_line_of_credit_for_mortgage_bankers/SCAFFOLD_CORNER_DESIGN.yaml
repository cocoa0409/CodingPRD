          of exactly 10,000,000, the bailee letter expiring, a BAILEE_EXPIRED demand sized
          at the full 1,960,000,000 outstanding with a 10-day deadline, and a 35-day fee
          accrual — and only the margin call, not the demand, restricts the facility.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; DRY CONFORMING advance funded to 1,960,000,000 and shipped to Alpha Aggregator, both at 2026-08-01T00:00:00Z, so its BaileeLetter expires 2026-08-31T00:00:00Z."
