            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 7, qty_damaged: 0 } ] }, as: WarehouseReceiver, captures: { ev1_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev1_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
          trigger:
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 4, qty_damaged: 0 } ] }, as: WarehouseReceiver, captures: { ev2_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev2_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver, captures: { err: $.data.error_id } }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 3, qty_damaged: 0 } ] }, as: WarehouseReceiver, captures: { ev3_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev3_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
            - { call: "GET /api/po-lines/${l_id}", as: PurchasingAgent }
          assert:
            - "After first post: line was PARTIALLY_RECEIVED with qty_received == 7"
            - "Posting the 4-unit event is rejected 422 with error_id == ERR_OVER_RECEIPT (7 + 4 > 10); the event remains DRAFT"
            - "Posting the 3-unit event succeeds: POLine.${l_id}.qty_received == 10 and status == FULLY_RECEIVED"

      - name: freight_fcl_ltl_threshold_covered
        claim_type: correct_result
        grounds: [calculations.freight_mode_and_allocation]
        excluded_because:
          difficulty_instance: seal_cube_threshold_fcl_vs_ltl
          rationale: "The 67/66 m3 threshold arms with exact freight totals are asserted in the named difficulty instance."

      - name: budget_variance_dual_view_covered
        claim_type: correct_result
        grounds: [calculations.budget_line_variance]
        excluded_because:
          difficulty_instance: budget_variance_commitment_vs_final_view
          rationale: "Both variance views and their divergence are asserted in the named difficulty instance."

  # ------------------------------------------------------------ validations ---
  - section: validations
    instances:
      - name: missing_auth_header_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no role header against a nonexistent spec id fails authentication (400) before existence (404); with a valid role the same id yields ERR_SPEC_ITEM_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/spec-items/00000000-0000-0000-0000-000000000000/brand-review", payload: { decision: "APPROVE" }, as: "", captures: { err1: $.data.error_id } }
            - { call: "POST /api/spec-items/00000000-0000-0000-0000-000000000000/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover, captures: { err2: $.data.error_id } }
          assert:
            - "First call: HTTP 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (priority 1 beats priority 3)"
            - "Second call: HTTP 404 with error_id == ERR_SPEC_ITEM_NOT_FOUND"

      - name: line_add_brand_gate_budget_equality_and_overflow
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "validations[priority=11]", "errors[ERR_SPEC_NOT_BRAND_APPROVED]", "errors[ERR_BUDGET_LINE_EXCEEDED]", "errors[ERR_SPEC_ALREADY_ORDERED]"]
        distinguishing_aspect: "Three arms on one endpoint: spec not brand-approved -> 409 safety gate; extended exactly equal to budgeted -> created (<= allows equality); one more cent of commitment -> 402 fiscal gate; and a second line on the same spec -> 409 uniqueness."
        test_recipe:
          setup:
            - "Project total 10000000c in PROCUREMENT; FURNITURE budget line budgeted exactly 600000c"
            - "Spec1 (40 total, unit 15000c) and spec2 (1 total, unit 1000c) both exist; spec1 starts DRAFT"
            - "PO for VENDA exists"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-V2", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 600000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Guest chair", brand_standard_ref: "MS-GR-01", quantity_per_room: 2, room_count: 20, unit_budget_cents: 15000 }, as: PurchasingAgent, captures: { s1_id: $.data.id } }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Coat hook", brand_standard_ref: "MS-CH", quantity_per_room: 1, room_count: 1, unit_budget_cents: 1000 }, as: PurchasingAgent, captures: { s2_id: $.data.id } }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
          trigger:
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s1_id}", quantity_ordered: 40, declared_cube_m3: 10 }, as: PurchasingAgent, captures: { err1: $.data.error_id } }
            - { call: "POST /api/spec-items/${s1_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s1_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s1_id}", vendor_name: "VENDA", unit_price_cents: 15000, freight_estimate_cents: 0, lead_time_days: 14 }, as: Vendor, captures: { b1_id: $.data.id } }
            - { call: "POST /api/bids/${b1_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b1_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s1_id}", quantity_ordered: 40, declared_cube_m3: 10 }, as: PurchasingAgent, captures: { l1_id: $.data.id } }
            - { call: "POST /api/spec-items/${s2_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s2_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s2_id}", vendor_name: "VENDA", unit_price_cents: 1000, freight_estimate_cents: 0, lead_time_days: 3 }, as: Vendor, captures: { b2_id: $.data.id } }
            - { call: "POST /api/bids/${b2_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b2_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s2_id}", quantity_ordered: 1, declared_cube_m3: 1 }, as: PurchasingAgent, captures: { err2: $.data.error_id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s1_id}", quantity_ordered: 1, declared_cube_m3: 1 }, as: PurchasingAgent, captures: { err3: $.data.error_id } }
          assert:
            - "Arm 1: line add against DRAFT spec1 rejected 409 ERR_SPEC_NOT_BRAND_APPROVED"
            - "Arm 2: after approval + award, line 40 x 15000c == 600000c == budgeted is created (201); extended_cents == 600000"
            - "Arm 3: second line (600000 + 1000 > 600000) rejected 402 ERR_BUDGET_LINE_EXCEEDED"
            - "Arm 4: duplicate line for spec1 rejected 409 ERR_SPEC_ALREADY_ORDERED"

      - name: posture_sealed_blocks_new_po
        claim_type: conditional_validation
        grounds: [calculations.procurement_posture_derivation, "errors[ERR_PROJECT_PROCUREMENT_SEALED]"]
        distinguishing_aspect: "Once any window is IN_PROGRESS the derived posture flips to SEALED and new purchase orders are rejected; the same call succeeded before the window started."
        test_recipe:
          setup:
            - "Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec 10 x 10000c cube 5 awarded/ordered; shipment fully received (10 good)"
            - "Room R-601; window [2026-07-20, 2026-07-22) crew 1 with task qty 1; window IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-V3", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Lamp", brand_standard_ref: "MS-L", quantity_per_room: 1, room_count: 10, unit_budget_cents: 10000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 10000, freight_estimate_cents: 0, lead_time_days: 7 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 10, declared_cube_m3: 5 }, as: PurchasingAgent, captures: { l_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 10, qty_damaged: 0 } ] }, as: WarehouseReceiver, captures: { ev_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
            - { call: "POST /api/rooms", payload: { project_id: "${p_id}", floor_number: 6, room_number: "R-601", room_type: "GUEST_KING" }, as: InstallationManager, captures: { r_id: $.data.id } }
            - { call: "POST /api/installation-windows", payload: { project_id: "${p_id}", floor_number: 6, start_date: "2026-07-20", end_date: "2026-07-22", crew_count: 1 }, as: InstallationManager, captures: { w_id: $.data.id } }
            - { call: "POST /api/installation-tasks", payload: { window_id: "${w_id}", room_id: "${r_id}", po_line_id: "${l_id}", quantity: 1 }, as: InstallationManager }
            - { call: "POST /api/installation-windows/${w_id}/transitions", payload: { to_status: "RELEASED" }, as: InstallationManager }
            - { call: "POST /api/installation-windows/${w_id}/transitions", payload: { to_status: "IN_PROGRESS" }, as: InstallationManager }
          trigger:
            - { call: "GET /api/projects/${p_id}", as: PurchasingAgent, captures: { posture: $.data.procurement_posture } }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "FFEProject.${p_id}.procurement_posture == SEALED once the window is IN_PROGRESS"
            - "POST /api/purchase-orders is rejected 409 with error_id == ERR_PROJECT_PROCUREMENT_SEALED"

