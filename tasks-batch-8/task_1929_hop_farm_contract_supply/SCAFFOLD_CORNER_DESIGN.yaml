  - section: validations
    instances:
      - name: request_missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_UNAUTHENTICATED"

      - name: forbidden_beats_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: "Authorization (priority 2) precedes existence (priority 3): FarmManager activating a non-existent contract id gets ERR_FORBIDDEN, not ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/contracts/00000000-0000-0000-0000-000000000000/activate", payload: {}, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_FORBIDDEN"

      - name: plan_acreage_exceeded
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_ACREAGE_EXCEEDED]
        distinguishing_aspect: "planned_acreage 101 > field.acreage 100 -> ERR_ACREAGE_EXCEEDED."
        test_recipe:
          setup: ["field F1 acreage 100"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 101 }, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_ACREAGE_EXCEEDED"

      - name: finish_drying_weight_impossible
        claim_type: violation_to_error
        grounds:
          - calculations.kiln_moisture
          - errors[ERR_WEIGHT_IMPOSSIBLE]
        distinguishing_aspect: "dried_lbs 200 < ceil(0.24 x 1000) = 240 violates the bone-dry floor -> ERR_WEIGHT_IMPOSSIBLE."
        test_recipe:
          setup: ["lot wet 1000 IN_KILN"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1000 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
          trigger:
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 200 }, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_WEIGHT_IMPOSSIBLE"

      - name: pelletize_mixed_variety_alone
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MIXED_VARIETY]
          - validations[priority=12]
        distinguishing_aspect: "Both source lots DRIED (referential passes) but CASCADE vs CITRA -> ERR_MIXED_VARIETY surfaces on its own."
        test_recipe:
          setup: ["lot A CASCADE 2026 DRIED (dried 500); lot B CITRA 2026 on field F2 DRIED (dried 500)"]
          setup_api_calls:
