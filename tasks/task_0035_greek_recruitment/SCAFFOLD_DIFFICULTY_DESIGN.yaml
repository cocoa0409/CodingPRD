            - call: "POST /rush/pnms/register"
              payload: { full_name: "Y1", gpa: 3.50 }
              as: Anonymous
              captures: { y1: $.data.id }
            - call: "POST /rush/pnms/${y1}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch_j}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch_j}"
              captures: { pj1: $.data.id }
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch_j}", scheduled_start_utc: "2026-09-06T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch_j}"
              captures: { pj2: $.data.id }
            - call: "POST /rush/parties/${pj1}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_j}"
            - call: "POST /rush/parties/${pj2}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_j}"
            - call: "POST /rush/invitations"
              payload: { party_id: "${pj1}", pnm_id: "${y1}" }
              as: ChapterOfficer
              as_user_id: "${ch_j}"
              captures: { i1: $.data.id }
            - call: "POST /rush/invitations"
              payload: { party_id: "${pj2}", pnm_id: "${y1}" }
              as: ChapterOfficer
              as_user_id: "${ch_j}"
              captures: { i2: $.data.id }
            - call: "POST /rush/invitations/${i1}/accept"
              payload: {}
              as: PNM
              as_user_id: "${y1}"
            - call: "POST /rush/invitations/${i2}/accept"
              payload: {}
              as: PNM
              as_user_id: "${y1}"
          trigger:
            - call: "POST /rush/pnms/${y1}/withdraw"
              payload: {}
              as: PNM
              as_user_id: "${y1}"
          assert:
            - "PNM ${y1}.status == WITHDRAWN."
            - "PartyInvitation ${i1}.rsvp_status == DECLINED (caused by withdrawal cascade)."
            - "PartyInvitation ${i2}.rsvp_status == DECLINED (caused by withdrawal cascade)."
            - "Party ${pj1}.confirmed_count == 0 (was 1, now decremented as a derived consequence of the invitation cascade)."
            - "Party ${pj2}.confirmed_count == 0."

