scenario: |
  Section 8 Housing Choice Voucher: applicant income, Voucher issuance, Payment
  Standard, HQS annual inspection, rent reasonableness, Portability across
  regions, annual review, Special Mobility.

domain_name: section-8-housing-voucher
api_prefix: /housing-voucher

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - ops_run_checkpoint

  entity_topology: hybrid
  # Tenancy joins Voucher × Unit (cross-aggregate). Inspections & AnnualReviews
  # nest under their parent contracts. PortabilityRequest cuts across PHAs.

  state_machine_shape: branching
  # Voucher and Tenancy both branch with revert paths; Inspection branches on
  # severity; AnnualReview cycles (DEFICIENT → SUBMITTED). Compound posture on
  # Voucher derived from active Tenancy + Inspection results.

  relationship_patterns:
    - one_to_many        # Voucher → Tenancies (chronologically), Tenancy → Inspections
    - cross_aggregate    # Tenancy spans Voucher (issued by PHA) × Unit (Landlord)
    - polymorphic        # HAPPayment.event_ref can reference Tenancy | AnnualReview | PortabilityRequest
    - many_to_many       # PaymentStandard ← (bedroom_size × zone)

  role_model: peer_roles
  # Applicant, Landlord, CaseWorker, Inspector, PortabilityCoordinator each own
  # distinct resource types. PHAAdmin has hierarchical_override on configs.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: household_name
        type: string
        source: input
        description: "Head-of-household legal name"
      - name: household_size
        type: integer
        source: input
        description: "Total persons in household (used for bedroom-size determination and income limit lookup)"
        constraints: ">= 1, <= 20"
      - name: dependents_count
        type: integer
        source: input
        description: "Persons under 18 or disabled adult dependents claimed for the $480 deduction"
        constraints: ">= 0, <= household_size"
      - name: elderly_or_disabled_head
        type: boolean
        source: input
        description: "Whether head-of-household qualifies for the $400 elderly/disabled allowance"
      - name: gross_annual_income_cents
        type: integer
        source: input
        description: "Self-reported gross annual income across all household members, in cents"
        constraints: ">= 0"
      - name: childcare_expense_annual_cents
        type: integer
        source: input
        description: "Annual childcare expense allowance (capped at earned income of the parent enabling the work)"
        default: 0
      - name: medical_expense_annual_cents
        type: integer
        source: input
        description: "Annual medical expense (only deductible for elderly/disabled households, only amount above 3% of gross)"
        default: 0
      - name: adjusted_annual_income_cents
        type: integer
        source: computed
        description: "Output of calc_adjusted_income (variant: initial). Recomputed on each AnnualReview using the recertification variant."
      - name: income_band
        type: enum
        source: computed
        description: "Income classification vs HUD limits at issuance time"
        constraints: "IN {EXTREMELY_LOW, VERY_LOW, LOW, OVER_INCOME}"
      - name: eligibility_status
        type: enum
        source: computed
        description: "Final eligibility outcome"
        constraints: "IN {PENDING, ELIGIBLE, INELIGIBLE}"

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "Applicant the voucher was issued to (FK Applicant.id, must have eligibility_status=ELIGIBLE)"
      - name: bedroom_size
        type: integer
        source: computed
        description: "Number of bedrooms authorized, derived from household_size by the PHA occupancy table (1 person→0br, 2→1br, 3-4→2br, 5-6→3br, 7-8→4br, 9+→5br)"
        constraints: "IN {0, 1, 2, 3, 4, 5}"
      - name: issued_at
        type: datetime
        source: system
        description: "Wall-clock timestamp at issuance (set on POST /vouchers)"
      - name: search_deadline
        type: datetime
        source: system
        description: "issued_at + 120 days; voucher expires if no Tenancy is ACTIVE by this instant"
      - name: zone
        type: enum
        source: input
        description: "PHA-defined geographic zone determining Payment Standard tier"
        constraints: "IN {ZONE_A, ZONE_B, ZONE_C}"
      - name: special_mobility_flag
        type: boolean
        source: input
        description: "When true, voucher is in the Special Mobility program — Tenancy must be in an opportunity zone (ZONE_A only) and HAP uses the mobility payment standard tier (+10%)"
        default: false
      - name: administering_pha_id
        type: string
        source: input
        description: "PHA currently administering this voucher. Changes on PortabilityRequest.outcome=ABSORBED."
        constraints: "IN {PHA_001, PHA_002, PHA_003} for this PHA's configured network"
      - name: status
        type: enum
        source: computed
        description: "Voucher lifecycle posture (see §1.2 Voucher state machine)"
        constraints: "IN {ISSUED, SEARCHING, LEASED, SEARCHING_REISSUED, PORTED_OUT, EXPIRED, TERMINATED, REVOKED}"
      - name: remaining_search_days
        type: integer
        source: computed
        description: "Days between now() and search_deadline; refreshed on every read. Negative when expired."

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: landlord_id
        type: string
        source: input
        description: "Landlord owning the unit (FK Landlord role X-User-ID)"
      - name: street_address
        type: string
        source: input
        description: "Full street address"
      - name: zone
        type: enum
        source: input
        description: "Geographic zone — must match a configured Payment Standard zone"
        constraints: "IN {ZONE_A, ZONE_B, ZONE_C}"
      - name: bedroom_count
        type: integer
        source: input
        description: "Physical bedrooms in the unit"
        constraints: ">= 0, <= 6"
      - name: asking_rent_cents
        type: integer
        source: input
        description: "Landlord's proposed monthly contract rent (excludes utilities)"
        constraints: "> 0"
      - name: tenant_paid_utilities_cents
        type: integer
        source: input
        description: "PHA utility allowance for tenant-paid utilities at this unit's zone+bedroom_count"
        default: 0
      - name: last_inspection_passed_at
        type: datetime
        source: computed
        description: "Most recent Inspection with outcome=PASS (or CURED). Null if never inspected."
      - name: next_annual_inspection_due
        type: datetime
        source: computed
        description: "last_inspection_passed_at + 365 days. Computed property; refreshed on every read."
      - name: occupancy_status
        type: enum
        source: computed
        description: "Derived from active Tenancy presence"
        constraints: "IN {VACANT, OCCUPIED_PENDING, OCCUPIED_ACTIVE, OCCUPIED_ABATED}"

  - name: PaymentStandard
    parent: null
    common_fields: false
    fields:
      - name: zone
        type: enum
        source: input
        description: "Zone this row applies to"
        constraints: "IN {ZONE_A, ZONE_B, ZONE_C}"
      - name: bedroom_size
        type: integer
        source: input
        description: "Bedroom size key"
        constraints: "IN {0, 1, 2, 3, 4, 5}"
      - name: standard_amount_cents
        type: integer
        source: input
        description: "Monthly Payment Standard ceiling in cents for this (zone, bedroom_size) cell"
        constraints: "> 0"
      - name: mobility_amount_cents
        type: integer
        source: input
        description: "Special Mobility Payment Standard (typically 110% of standard_amount_cents, rounded to nearest cent). Used only when Voucher.special_mobility_flag=true."
        constraints: ">= standard_amount_cents"
      - name: effective_from
        type: datetime
        source: input
        description: "When this standard took effect. The active standard for any (zone, bedroom_size) is the row with the latest effective_from <= now()."

  - name: Tenancy
    parent: Voucher
    common_fields: true
    fields:
      - name: voucher_id
        type: string
        source: input
        description: "FK Voucher.id (must be in status SEARCHING or SEARCHING_REISSUED)"
      - name: unit_id
        type: string
        source: input
        description: "FK Unit.id (must be VACANT)"
      - name: requested_at
        type: datetime
        source: system
        description: "When Request for Tenancy Approval (RFTA) was submitted"
      - name: lease_start
        type: datetime
        source: input
        description: "Proposed lease start; must be >= now() and >= search_deadline-grace not required, but must be <= search_deadline"
      - name: gross_rent_cents
        type: integer
        source: computed
        description: "Unit.asking_rent_cents + Unit.tenant_paid_utilities_cents — frozen at Tenancy creation"
      - name: applicable_payment_standard_cents
        type: integer
        source: computed
        description: "PaymentStandard.standard_amount_cents (or mobility_amount_cents when Voucher.special_mobility_flag=true) for (Voucher.zone, min(Voucher.bedroom_size, Unit.bedroom_count)). Frozen at Tenancy creation."
      - name: rent_reasonable
        type: boolean
        source: computed
        description: "Output of calc_rent_reasonableness. Null until RentReasonablenessRecord is attached."
      - name: initial_total_tenant_payment_cents
        type: integer
        source: computed
        description: "Output of calc_ttp (variant: initial). Frozen at ACTIVE transition."
      - name: initial_hap_cents
        type: integer
        source: computed
        description: "Output of calc_hap using initial TTP. Frozen at ACTIVE transition."
      - name: current_total_tenant_payment_cents
        type: integer
        source: computed
        description: "Updated by AnnualReview/InterimReview using the recertification variant of calc_ttp"
      - name: current_hap_cents
        type: integer
        source: computed
        description: "Updated when current_total_tenant_payment_cents changes"
      - name: rent_burden_at_lease_up_pct
        type: number
        source: computed
        description: "(gross_rent_cents - initial_hap_cents) / (Applicant.adjusted_annual_income_cents / 12). Must be <= 0.40 at initial lease-up; not enforced on subsequent reviews."
      - name: status
        type: enum
        source: computed
        description: "Tenancy lifecycle posture (see §1.2)"
        constraints: "IN {PENDING_INSPECTION, PENDING_RENT_REASONABLE, ACTIVE, ABATED, TERMINATED, REJECTED}"
      - name: abatement_started_at
        type: datetime
        source: computed
        description: "When status transitioned to ABATED. Null otherwise."
      - name: termination_reason
        type: enum
        source: computed
        description: "Recorded on TERMINATED transition"
        constraints: "IN {HQS_UNCURED, ANNUAL_REVIEW_DENIED, TENANT_MOVE_OUT, PORTABILITY_ABSORBED, NULL}"

  - name: Inspection
    parent: Tenancy
    common_fields: true
    fields:
      - name: tenancy_id
        type: string
        source: input
        description: "FK Tenancy.id"
      - name: unit_id
        type: string
        source: computed
        description: "Copied from Tenancy.unit_id at creation"
      - name: inspection_type
        type: enum
        source: input
        description: "Initial RFTA inspection vs scheduled annual recertification inspection vs re-inspection of a cure"
        constraints: "IN {INITIAL, ANNUAL, REINSPECTION}"
      - name: scheduled_for
        type: datetime
        source: input
        description: "Scheduled inspection date/time"
      - name: completed_at
        type: datetime
        source: system
        description: "When result was filed"
      - name: outcome
        type: enum
        source: input
        description: "Inspector's filed result"
        constraints: "IN {PASS, FAIL_NONLIFETHREATENING, FAIL_LIFETHREATENING, CURED}"
      - name: defects
        type: array
        source: input
        description: "List of defect codes; non-empty for FAIL_*"
      - name: cure_deadline
        type: datetime
        source: computed
        description: "FAIL_NONLIFETHREATENING: completed_at + 30 days. FAIL_LIFETHREATENING: completed_at + 24 hours. Null otherwise."
      - name: status
        type: enum
        source: computed
        description: "Inspection record state"
        constraints: "IN {SCHEDULED, COMPLETED_PASS, COMPLETED_FAIL_CURABLE, COMPLETED_FAIL_LIFETHREAT, CURED, EXPIRED_UNCURED}"

  - name: RentReasonablenessRecord
    parent: Tenancy
    common_fields: false
    fields:
      - name: tenancy_id
        type: string
        source: input
        description: "FK Tenancy.id"
      - name: comparable_rents_cents
        type: array
        source: input
        description: "Array of >=3 monthly rents (integer cents) of comparable units in same zone with same bedroom_count"
        constraints: "length >= 3"
      - name: median_comparable_cents
        type: integer
        source: computed
        description: "Median of comparable_rents_cents (for even N, lower of the two middles — tie-break pinned)"
      - name: reasonable_threshold_cents
        type: integer
        source: computed
        description: "floor(median_comparable_cents * 1.10)"
      - name: is_reasonable
        type: boolean
        source: computed
        description: "Tenancy.gross_rent_cents <= reasonable_threshold_cents"
      - name: recorded_at
        type: datetime
        source: system
        description: "Set on creation"

  - name: AnnualReview
    parent: Tenancy
    common_fields: true
    fields:
      - name: tenancy_id
        type: string
        source: input
        description: "FK Tenancy.id (Tenancy.status must be ACTIVE)"
      - name: review_due_date
        type: datetime
        source: system
        description: "Tenancy.lease_start anniversary (issued at Tenancy ACTIVE transition; subsequent reviews +365 days)"
      - name: submitted_at
        type: datetime
        source: system
        description: "When SUBMITTED transition fired"
      - name: declared_gross_annual_income_cents
        type: integer
        source: input
        description: "Updated household income at review"
      - name: declared_household_size
        type: integer
        source: input
        description: "Updated household size at review"
      - name: new_adjusted_income_cents
        type: integer
        source: computed
        description: "Output of calc_adjusted_income (variant: recertification)"
      - name: new_total_tenant_payment_cents
        type: integer
        source: computed
        description: "Output of calc_ttp (variant: recertification)"
      - name: new_hap_cents
        type: integer
        source: computed
        description: "Output of calc_hap given new TTP"
      - name: deficiency_codes
        type: array
        source: input
        description: "Codes filed when status=DEFICIENT (missing pay stubs, missing IDs, etc.)"
      - name: status
        type: enum
        source: computed
        description: "Review lifecycle"
        constraints: "IN {DUE, SUBMITTED, DEFICIENT, APPROVED, DENIED}"

  - name: PortabilityRequest
    parent: Voucher
    common_fields: true
    fields:
      - name: voucher_id
        type: string
        source: input
        description: "FK Voucher.id (must be SEARCHING or LEASED)"
      - name: receiving_pha_id
        type: string
        source: input
        description: "Destination PHA — must be a different PHA than current administering_pha_id and present in the configured network"
      - name: requested_at
        type: datetime
        source: system
        description: "Submission timestamp"
      - name: outcome
        type: enum
        source: computed
        description: "Final disposition"
        constraints: "IN {INITIATED, ABSORBED, BILLED, DENIED}"
      - name: decided_at
        type: datetime
        source: system
        description: "When outcome was decided"
      - name: denial_reason
        type: enum
        source: input
        description: "Required when outcome=DENIED"
        constraints: "IN {RECEIVING_PHA_OVER_LEASING_CAP, INELIGIBLE_HOUSEHOLD, MOBILITY_ZONE_RESTRICTION, NULL}"

  - name: HAPPayment
    parent: null
    common_fields: false
    fields:
      - name: tenancy_id
        type: string
        source: input
        description: "FK Tenancy.id"
      - name: pay_period_month
        type: string
        source: input
        description: "YYYY-MM month this payment covers"
      - name: amount_cents
        type: integer
        source: computed
        description: "Tenancy.current_hap_cents at the moment the payment was generated. Zero when Tenancy.status=ABATED."
      - name: status
        type: enum
        source: computed
        description: "Payment ledger entry status"
        constraints: "IN {PAID, ABATED_SUSPENDED, VOIDED_RETROACTIVE}"
      - name: event_ref_type
        type: enum
        source: system
        description: "What produced this row"
        constraints: "IN {SCHEDULED_MONTHLY, ABATEMENT, AR_RECALC, PORTABILITY_CLOSEOUT}"
      - name: event_ref_id
        type: string
        source: system
        description: "Polymorphic FK — id of the AnnualReview, Inspection, PortabilityRequest, or sweep that produced this row"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Voucher
    initial_state: ISSUED
    terminal_states: [EXPIRED, TERMINATED, REVOKED]
    transitions:
      - from: ISSUED
        to: SEARCHING
        trigger: "Automatic on POST /vouchers success — voucher activates for search immediately"
        actor: system
        preconditions: ["Applicant.eligibility_status == ELIGIBLE"]
        side_effects:
          - "Voucher.search_deadline := issued_at + 120 days"
        note: "ISSUED is a momentary state; downstream reads will see SEARCHING."

      - from: ISSUED
        to: REVOKED
        trigger: "POST /applicants/{id}/revoke (PHAAdmin only) — applicant eligibility revoked before any tenancy"
        actor: PHAAdmin
        preconditions: ["Voucher.status == ISSUED"]
        side_effects: ["Applicant.eligibility_status := INELIGIBLE"]

      - from: SEARCHING
        to: LEASED
        trigger: "Automatic on Tenancy transition PENDING_RENT_REASONABLE → ACTIVE"
        actor: system
        preconditions: ["A Tenancy with this voucher_id reaches ACTIVE"]
        side_effects:
          - "Voucher.remaining_search_days frozen"
          - "First scheduled HAPPayment row generated by next /_clock advance into a new month"

      - from: SEARCHING
        to: EXPIRED
        trigger: "POST /_sweep/expirations OR /_clock advance past Voucher.search_deadline with no ACTIVE Tenancy"
        actor: system
        preconditions: ["now() > Voucher.search_deadline", "No Tenancy with this voucher_id in ACTIVE/PENDING_*"]
        side_effects: ["Voucher.status := EXPIRED (terminal)"]

      - from: LEASED
        to: SEARCHING_REISSUED
        trigger: "Tenancy → TERMINATED with reason=TENANT_MOVE_OUT (move-with-continued-assistance)"
        actor: system
        preconditions: ["Voucher.special_mobility_flag may be true or false; reissuance is allowed both ways"]
        side_effects:
          - "Voucher.search_deadline := termination_date + 60 days (re-search window)"
          - "Any DUE AnnualReview on the terminated Tenancy auto-closes as VOID"

      - from: LEASED
        to: TERMINATED
        trigger: "Cascade from Tenancy → TERMINATED with reason IN {HQS_UNCURED, ANNUAL_REVIEW_DENIED}"
        actor: system
        preconditions: ["No remaining ACTIVE Tenancy for this voucher_id"]
        side_effects:
          - "All future scheduled HAPPayment rows for this voucher are suppressed"

      - from: LEASED
        to: PORTED_OUT
        trigger: "Cascade from PortabilityRequest → ABSORBED"
        actor: system
        preconditions: ["PortabilityRequest.outcome == ABSORBED", "receiving_pha_id present in network"]
        side_effects:
          - "Voucher.administering_pha_id := PortabilityRequest.receiving_pha_id"
          - "All active Tenancies under this voucher → TERMINATED with reason=PORTABILITY_ABSORBED"
          - "Open AnnualReview rows close as VOID"
          - "HAPPayment(event_ref_type=PORTABILITY_CLOSEOUT, status=VOIDED_RETROACTIVE) emitted for any future month already prebooked"

      - from: SEARCHING_REISSUED
        to: LEASED
        trigger: "Automatic on next Tenancy ACTIVE"
        actor: system
        preconditions: ["Tenancy.lease_start <= Voucher.search_deadline"]
        side_effects: ["Same as SEARCHING → LEASED"]

      - from: SEARCHING_REISSUED
        to: EXPIRED
        trigger: "Same as SEARCHING → EXPIRED but evaluates against the reissued search_deadline"
        actor: system
        preconditions: ["now() > Voucher.search_deadline"]
        side_effects: ["Voucher.status := EXPIRED (terminal)"]

  - entity: Tenancy
    initial_state: PENDING_INSPECTION
    terminal_states: [TERMINATED, REJECTED]
    transitions:
      - from: PENDING_INSPECTION
        to: PENDING_RENT_REASONABLE
        trigger: "POST /inspections/{id}/complete with outcome=PASS on the INITIAL inspection"
        actor: Inspector
        preconditions:
          - "Inspection.tenancy_id == this Tenancy.id"
          - "Inspection.inspection_type == INITIAL"
          - "Tenancy.status == PENDING_INSPECTION"
        side_effects:
          - "Unit.last_inspection_passed_at := Inspection.completed_at"
          - "Unit.next_annual_inspection_due := Unit.last_inspection_passed_at + 365 days"

      - from: PENDING_INSPECTION
        to: REJECTED
        trigger: "Initial inspection FAIL_LIFETHREATENING with no successful cure inside 24h"
        actor: system
        preconditions: ["Inspection.cure_deadline elapsed without a CURED reinspection"]
        side_effects:
          - "Unit.occupancy_status := VACANT"
          - "Voucher stays in SEARCHING (no transition)"

      - from: PENDING_RENT_REASONABLE
        to: ACTIVE
        trigger: "POST /tenancies/{id}/finalize after RentReasonablenessRecord.is_reasonable=true AND rent_burden check passes"
        actor: CaseWorker
        preconditions:
          - "RentReasonablenessRecord.is_reasonable == true"
          - "rent_burden_at_lease_up_pct <= 0.40"
          - "Special Mobility constraint: if Voucher.special_mobility_flag=true then Unit.zone == ZONE_A"
        side_effects:
          - "Voucher.status := LEASED (cascade)"
          - "Tenancy.initial_total_tenant_payment_cents := calc_ttp(initial)"
          - "Tenancy.initial_hap_cents := calc_hap(initial)"
          - "Tenancy.current_* mirror the initial_* values"
          - "AnnualReview.review_due_date := lease_start + 365 days (DUE row created)"
          - "Unit.occupancy_status := OCCUPIED_ACTIVE"

      - from: PENDING_RENT_REASONABLE
        to: REJECTED
        trigger: "POST /tenancies/{id}/finalize while RentReasonableness fails OR rent_burden > 0.40 OR mobility zone violated"
        actor: CaseWorker
        preconditions: ["At least one of the ACTIVE preconditions fails"]
        side_effects:
          - "Unit.occupancy_status := VACANT"
          - "Voucher remains SEARCHING with original search_deadline"

      - from: ACTIVE
        to: ABATED
        trigger: "Automatic on Inspection.outcome IN {FAIL_NONLIFETHREATENING, FAIL_LIFETHREATENING} for an ANNUAL inspection"
        actor: system
        preconditions: ["Tenancy.status == ACTIVE"]
        side_effects:
          - "Tenancy.abatement_started_at := Inspection.completed_at"
          - "Next-month HAPPayment row created with amount_cents=0 and status=ABATED_SUSPENDED"
          - "Unit.occupancy_status := OCCUPIED_ABATED"

      - from: ABATED
        to: ACTIVE
        trigger: "POST /inspections/{id}/complete with outcome=CURED on a REINSPECTION before cure_deadline"
        actor: Inspector
        preconditions:
          - "Inspection.inspection_type == REINSPECTION"
          - "Inspection.completed_at <= original Inspection.cure_deadline"
        side_effects:
          - "Unit.last_inspection_passed_at := Inspection.completed_at"
          - "Unit.next_annual_inspection_due := last_inspection_passed_at + 365 days"
          - "Next HAPPayment resumes at Tenancy.current_hap_cents"
          - "Unit.occupancy_status := OCCUPIED_ACTIVE"

      - from: ABATED
        to: TERMINATED
        trigger: "POST /_sweep/abatements OR /_clock advance past cure_deadline without a CURED reinspection"
        actor: system
        preconditions:
          - "now() > Inspection.cure_deadline of the inspection that produced abatement"
          - "No Inspection with outcome=CURED in window"
        side_effects:
          - "Tenancy.termination_reason := HQS_UNCURED"
          - "Voucher cascade: LEASED → TERMINATED (no reissuance — uncured HQS is a program violation)"
          - "Unit.occupancy_status := VACANT"

      - from: ACTIVE
        to: TERMINATED
        trigger: "Cascade from AnnualReview → DENIED OR POST /tenancies/{id}/move-out"
        actor: system | CaseWorker
        preconditions: ["AnnualReview.status == DENIED OR move-out request body confirmed"]
        side_effects:
          - "Tenancy.termination_reason := ANNUAL_REVIEW_DENIED or TENANT_MOVE_OUT"
          - "Voucher cascade: LEASED → TERMINATED (if AR_DENIED) or LEASED → SEARCHING_REISSUED (if move-out)"
          - "All future-month HAPPayment rows suppressed"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_PASS, EXPIRED_UNCURED, CURED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED_PASS
        trigger: "POST /inspections/{id}/complete with outcome=PASS"
        actor: Inspector
        preconditions: ["Inspection.status == SCHEDULED"]
        side_effects:
          - "Inspection.completed_at := now()"
          - "Cascade to Tenancy as described above"

      - from: SCHEDULED
        to: COMPLETED_FAIL_CURABLE
        trigger: "POST /inspections/{id}/complete with outcome=FAIL_NONLIFETHREATENING"
        actor: Inspector
        preconditions: ["defects array is non-empty"]
        side_effects:
          - "cure_deadline := completed_at + 30 days"
          - "If parent Tenancy is ACTIVE → cascade to ABATED"

      - from: SCHEDULED
        to: COMPLETED_FAIL_LIFETHREAT
        trigger: "POST /inspections/{id}/complete with outcome=FAIL_LIFETHREATENING"
        actor: Inspector
        preconditions: ["defects array is non-empty"]
        side_effects:
          - "cure_deadline := completed_at + 24 hours"
          - "If parent Tenancy is PENDING_INSPECTION → blocks transition to PENDING_RENT_REASONABLE"
          - "If parent Tenancy is ACTIVE → cascade to ABATED"

      - from: COMPLETED_FAIL_CURABLE
        to: CURED
        trigger: "Subsequent REINSPECTION with outcome=CURED before cure_deadline"
        actor: Inspector
        preconditions: ["A new Inspection (type=REINSPECTION) on the same Tenancy completes with outcome=CURED before original cure_deadline"]
        side_effects: ["Cascade to Tenancy ABATED → ACTIVE"]

      - from: COMPLETED_FAIL_LIFETHREAT
        to: CURED
        trigger: "Same as above but the cure_deadline window is 24h"
        actor: Inspector
        preconditions: ["REINSPECTION CURED within 24h of original completion"]
        side_effects: ["Cascade to Tenancy"]

      - from: COMPLETED_FAIL_CURABLE
        to: EXPIRED_UNCURED
        trigger: "Sweep past cure_deadline without a CURED REINSPECTION"
        actor: system
        preconditions: ["now() > cure_deadline"]
        side_effects: ["Cascade: Tenancy ABATED → TERMINATED (HQS_UNCURED)"]

      - from: COMPLETED_FAIL_LIFETHREAT
        to: EXPIRED_UNCURED
        trigger: "Sweep past 24h cure_deadline"
        actor: system
        preconditions: ["now() > cure_deadline (24h after completed_at)"]
        side_effects: ["Cascade: Tenancy PENDING_INSPECTION → REJECTED OR Tenancy ACTIVE → TERMINATED"]

  - entity: AnnualReview
    initial_state: DUE
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DUE
        to: SUBMITTED
        trigger: "POST /annual-reviews/{id}/submit with declared income and household-size"
        actor: Applicant
        preconditions: ["AnnualReview.status == DUE", "now() within 30 days of review_due_date"]
        side_effects:
          - "submitted_at := now()"
          - "new_adjusted_income_cents := calc_adjusted_income(recertification)"
          - "new_total_tenant_payment_cents := calc_ttp(recertification)"
          - "new_hap_cents := calc_hap(recertification)"

      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /annual-reviews/{id}/mark-deficient with deficiency_codes"
        actor: CaseWorker
        preconditions: ["deficiency_codes non-empty"]
        side_effects: ["Tenant has 14 days to re-submit"]

      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /annual-reviews/{id}/resubmit (re-entry into SUBMITTED — this is a cycle)"
        actor: Applicant
        preconditions: ["AnnualReview.status == DEFICIENT", "now() <= status changed-at + 14 days"]
        side_effects: ["deficiency_codes cleared; new_* fields recomputed"]

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /annual-reviews/{id}/approve"
        actor: CaseWorker
        preconditions: ["AnnualReview.status == SUBMITTED"]
        side_effects:
          - "Tenancy.current_total_tenant_payment_cents := new_total_tenant_payment_cents"
          - "Tenancy.current_hap_cents := new_hap_cents"
          - "Next-month HAPPayment row uses new_hap_cents"
          - "A new DUE AnnualReview row scheduled for +365 days"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /annual-reviews/{id}/deny (e.g., income exceeds program limit by >20%)"
        actor: CaseWorker
        preconditions: ["new_adjusted_income_cents > HUD low-income limit OR fraud determination"]
        side_effects:
          - "Cascade: Tenancy ACTIVE → TERMINATED (reason=ANNUAL_REVIEW_DENIED)"
          - "Cascade: Voucher LEASED → TERMINATED"

      - from: DEFICIENT
        to: DENIED
        trigger: "Sweep past 14-day deficient cure window"
        actor: system
        preconditions: ["now() > deficient status_changed_at + 14 days"]
        side_effects: ["Same as SUBMITTED → DENIED cascade"]

  - entity: PortabilityRequest
    initial_state: INITIATED
    terminal_states: [ABSORBED, BILLED, DENIED]
    transitions:
      - from: INITIATED
        to: ABSORBED
        trigger: "POST /portability-requests/{id}/absorb"
        actor: PortabilityCoordinator
        preconditions:
          - "receiving_pha_id in configured network"
          - "Voucher.status IN {SEARCHING, LEASED, SEARCHING_REISSUED}"
          - "If Voucher.special_mobility_flag=true, receiving_pha_id must offer ZONE_A units (config check)"
        side_effects:
          - "Voucher.administering_pha_id := receiving_pha_id"
          - "If LEASED: cascade Tenancy → TERMINATED (reason=PORTABILITY_ABSORBED) and Voucher → PORTED_OUT"
          - "Suppress all future-month HAPPayment rows"

      - from: INITIATED
        to: BILLED
        trigger: "POST /portability-requests/{id}/bill"
        actor: PortabilityCoordinator
        preconditions: ["Same as ABSORBED but receiving PHA elects to bill originating PHA instead of absorbing"]
        side_effects:
          - "Voucher.administering_pha_id unchanged"
          - "HAPPayment continues from originating PHA; no Tenancy cascade"

      - from: INITIATED
        to: DENIED
        trigger: "POST /portability-requests/{id}/deny with denial_reason"
        actor: PortabilityCoordinator
        preconditions: ["denial_reason supplied"]
        side_effects: ["No side effects on Voucher or Tenancy"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two CaseWorkers simultaneously finalize the same Tenancy"
    guarantee: "At most one finalize succeeds; second receives ERR_INVALID_STATE because the first already advanced PENDING_RENT_REASONABLE → ACTIVE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Tenancy.status"

  - scenario: "Two Tenancies created on the same VACANT Unit at the same instant"
    guarantee: "At most one Tenancy is accepted; the other is rejected because Unit.occupancy_status transitions to OCCUPIED_PENDING"
    error_id: ERR_UNIT_NOT_VACANT
    http_status: 409
    serialization: "First-writer-wins on Unit.occupancy_status"

  - scenario: "Voucher expiration sweep runs concurrently with Tenancy finalize (rare boundary race)"
    guarantee: "If sweep already wrote Voucher.status=EXPIRED, the finalize request is rejected; if finalize wrote Tenancy.status=ACTIVE first, the sweep skips that voucher"
    error_id: ERR_VOUCHER_EXPIRED
    http_status: 409
    serialization: "First-writer-wins on Voucher.status"

  - scenario: "PortabilityRequest absorb concurrent with new Tenancy creation under the same voucher"
    guarantee: "Once Voucher.administering_pha_id changes (absorb wins), new Tenancy is rejected"
    error_id: ERR_VOUCHER_NOT_LOCAL
    http_status: 409
    serialization: "First-writer-wins on Voucher.administering_pha_id"

  - scenario: "Two Inspections marked complete on the same SCHEDULED record"
    guarantee: "Only the first complete succeeds; second is rejected because Inspection.status already transitioned"
    error_id: ERR_INSPECTION_ALREADY_COMPLETED
    http_status: 409
    serialization: "First-writer-wins on Inspection.status"

  - scenario: "AnnualReview approve and deny submitted simultaneously by two CaseWorkers"
    guarantee: "Exactly one wins; the other receives ERR_INVALID_STATE because the review already left SUBMITTED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on AnnualReview.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_adjusted_income
    trigger: "Computed (a) at Applicant creation; (b) at every AnnualReview.SUBMITTED transition (recertification variant)"
    algorithm: aggregation
    formula: |
      # All monetary values in integer cents; all rounding done at the end.
      gross = inputs.gross_annual_income_cents
      dep_allowance = DEPENDENT_ALLOWANCE_CENTS * inputs.dependents_count
      elderly_allowance = ELDERLY_ALLOWANCE_CENTS if inputs.elderly_or_disabled_head else 0

      # Medical: deductible ONLY for elderly_or_disabled_head households, ONLY amount above 3% of gross
      medical_threshold = floor(gross * 0.03)
      if inputs.elderly_or_disabled_head and inputs.medical_expense_annual_cents > medical_threshold:
          medical_deduction = inputs.medical_expense_annual_cents - medical_threshold
      else:
          medical_deduction = 0

      # Childcare: capped at the lesser of declared expense and effective earned income.
      childcare_deduction = min(inputs.childcare_expense_annual_cents, gross)  # simplification: cap at gross

      total_deductions = dep_allowance + elderly_allowance + medical_deduction + childcare_deduction
      adjusted = max(0, gross - total_deductions)
      return adjusted   # integer cents
    input_set: "Single Applicant record (initial variant) OR AnnualReview declared values (recertification variant)"
    constants:
      DEPENDENT_ALLOWANCE_CENTS: 48000    # $480 per dependent
      ELDERLY_ALLOWANCE_CENTS: 40000      # $400 once per qualifying household
    precision: "Integer cents; intermediate medical_threshold uses floor(); no monetary rounding at output"
    variants:
      - name: initial
        when: "Applicant creation — uses Applicant.gross_annual_income_cents and declared deductions verbatim"
        difference: |
          Inputs come from the Applicant entity:
            gross := Applicant.gross_annual_income_cents
            dependents_count := Applicant.dependents_count          (explicit, not derived from household_size)
            elderly_or_disabled_head := Applicant.elderly_or_disabled_head
            medical := Applicant.medical_expense_annual_cents
            childcare := Applicant.childcare_expense_annual_cents
          Result populates Applicant.adjusted_annual_income_cents.
      - name: recertification
        when: "AnnualReview SUBMITTED — uses AnnualReview.declared_* inputs"
        difference: |
          (1) gross := AnnualReview.declared_gross_annual_income_cents (NOT Applicant.gross_*).
          (2) DEPENDENT_ALLOWANCE is recomputed for the CURRENT household:
              dependents_recertification := AnnualReview.declared_household_size - 1
              (the "-1" is the head-of-household; this is the pinned heuristic for recertification).
              This produces a different dep_allowance than the initial variant whenever
              declared_household_size has changed since application.
          (3) elderly_or_disabled_head, medical_expense_annual_cents, and childcare_expense_annual_cents
              are READ FROM Applicant (frozen at application time — they are NOT redeclared
              on AnnualReview). This is intentional: the recertification re-evaluates household
              composition but not the elderly/medical declarations.
          (4) Result writes to AnnualReview.new_adjusted_income_cents, NOT back to Applicant.

  - name: calc_ttp
    trigger: "(a) Tenancy PENDING_RENT_REASONABLE→ACTIVE (initial variant); (b) AnnualReview SUBMITTED (recertification variant)"
    algorithm: threshold
    formula: |
      monthly_adjusted = floor(adjusted_annual_income_cents / 12)        # integer cents
      monthly_gross    = floor(gross_annual_income_cents / 12)

      thirty_pct = ceil(monthly_adjusted * 0.30)
      ten_pct    = ceil(monthly_gross    * 0.10)

      # WELFARE_RENT_CENTS and MINIMUM_RENT_CENTS are PHA configuration. Welfare_rent is 0
      # for non-welfare households (we apply the floor only if applicable).
      ttp = max(thirty_pct, ten_pct, WELFARE_RENT_CENTS, MINIMUM_RENT_CENTS)
      return ttp
    input_set: |
      Initial variant: Applicant.adjusted_annual_income_cents (the value at Voucher issuance, frozen).
      Recertification variant: AnnualReview.new_adjusted_income_cents (recomputed for THIS review's declared household).
    constants:
      WELFARE_RENT_CENTS: 0
      MINIMUM_RENT_CENTS: 5000     # $50/month statutory floor
    precision: "All intermediate values use floor() before percent application; percent application uses ceil() to the nearest cent (rounding order is pinned: divide-then-floor, then multiply-then-ceil; reversing the order produces different cent values)."
    variants:
      - name: initial
        when: "At Tenancy ACTIVE transition"
        difference: |
          Reads Applicant.adjusted_annual_income_cents (snapshot at voucher issuance) and Applicant.gross_annual_income_cents.
          Writes Tenancy.initial_total_tenant_payment_cents and mirrors into current_*.
      - name: recertification
        when: "At AnnualReview APPROVED"
        difference: |
          Reads AnnualReview.declared_gross_annual_income_cents and AnnualReview.new_adjusted_income_cents
          (recomputed for the current household — different value from initial after household composition or income changes).
          Writes AnnualReview.new_total_tenant_payment_cents and on APPROVED, cascades into Tenancy.current_total_tenant_payment_cents.
          Producing a DIFFERENT cent value than initial whenever income or household composition changed.

  - name: calc_hap
    trigger: "Same as calc_ttp — uses calc_ttp output and Payment Standard"
    algorithm: threshold
    formula: |
      applicable_ps = applicable_payment_standard_cents     # frozen on Tenancy
      gross_rent    = gross_rent_cents                      # frozen on Tenancy
      hap = max(0, min(applicable_ps, gross_rent) - ttp_cents)
      return hap
    input_set: "Tenancy.applicable_payment_standard_cents, Tenancy.gross_rent_cents, and the TTP from calc_ttp"
    constants: {}
    precision: "Integer cents; no rounding (inputs are already cents)."
    variants:
      - name: standard
        when: "Voucher.special_mobility_flag == false"
        difference: |
          applicable_payment_standard_cents := PaymentStandard.standard_amount_cents for the
          (Voucher.zone, min(Voucher.bedroom_size, Unit.bedroom_count)) cell whose effective_from is the
          latest <= Tenancy.requested_at.
      - name: special_mobility
        when: "Voucher.special_mobility_flag == true (and Unit.zone == ZONE_A)"
        difference: |
          applicable_payment_standard_cents := PaymentStandard.mobility_amount_cents for the
          same cell. mobility_amount_cents >= standard_amount_cents (typically 110%), so HAP is
          GREATER than the standard variant for identical Gross_Rent — same inputs, two
          algorithms, different cent value.

  - name: calc_rent_burden
    trigger: "Inline gate inside Tenancy.finalize before ACTIVE transition"
    algorithm: threshold
    formula: |
      monthly_adjusted = floor(adjusted_annual_income_cents / 12)
      tenant_share_at_lease_up_cents = gross_rent_cents - initial_hap_cents
      if monthly_adjusted == 0:
          return ERR_RENT_BURDEN_DIVZERO     # special-case validation
      burden = tenant_share_at_lease_up_cents / monthly_adjusted    # rational, NOT rounded
      # The check is the strict inequality 0.40 — the cap is INCLUSIVE.
      passes = (burden <= 0.40)
      return passes
    input_set: "Applicant.adjusted_annual_income_cents (snapshot), Tenancy.gross_rent_cents, Tenancy.initial_hap_cents"
    constants:
      RENT_BURDEN_CAP: 0.40
    precision: |
      Compare using exact rational arithmetic (multiply both sides by monthly_adjusted to
      avoid float drift): tenant_share_at_lease_up_cents * 100 <= 40 * monthly_adjusted.
      This is intentionally an INCLUSIVE bound — exactly 40% PASSES.
    variants: []

  - name: calc_rent_reasonableness
    trigger: "POST /rent-reasonableness-records"
    algorithm: aggregation
    formula: |
      sort comparable_rents_cents ascending
      n = length(comparable_rents_cents)
      if n is odd:
          median = comparable_rents_cents[(n-1) // 2]
      else:
          # EVEN-N TIE-BREAK PINNED: lower of the two middle values (NOT the arithmetic mean)
          median = comparable_rents_cents[(n // 2) - 1]
      reasonable_threshold = floor(median * 1.10)
      is_reasonable = (tenancy.gross_rent_cents <= reasonable_threshold)
    input_set: "Three or more integer-cent rents of comparable units in the same zone with same bedroom_count"
    constants:
      REASONABLENESS_MARGIN_PCT: 0.10
    precision: |
      Median uses the LOWER of two middles for even N (NOT arithmetic mean — pinned because the mean
      could land on a non-integer cent value and create rounding ambiguity).
      Threshold uses floor() — a gross_rent exactly equal to floor(median*1.10) is reasonable;
      one cent above is not.
    variants: []

  - name: calc_hap_monthly_ledger_round
    trigger: "POST /_clock advance into a new calendar month — generates HAPPayment rows for all ACTIVE Tenancies of vouchers administered locally"
    algorithm: aggregation
    formula: |
      # For each Voucher administered by THIS PHA where status==LEASED and has ACTIVE Tenancy,
      # generate ONE HAPPayment row for the new month.
      #
      # ROUNDING ORDER PINNED: "round per-tenancy-row, then sum across vouchers".
      # Each row's amount_cents is Tenancy.current_hap_cents (already cents — no further round).
      # The PHA's monthly total is sum(amount_cents across all rows of this sweep).
      #
      # If status==ABATED at the moment the sweep fires, the row is still generated but
      # amount_cents=0 and status=ABATED_SUSPENDED.
      #
      # If status==TERMINATED, no row generated.

      for tenancy in active_tenancies_administered_by(self_pha):
          if tenancy.status == ABATED:
              amount = 0; row_status = ABATED_SUSPENDED
          else:
              amount = tenancy.current_hap_cents; row_status = PAID
          insert HAPPayment(tenancy_id=tenancy.id, pay_period_month=new_month_yyyymm,
                            amount_cents=amount, status=row_status,
                            event_ref_type=SCHEDULED_MONTHLY, event_ref_id=sweep_run_id)
    input_set: "All Tenancy rows where administering PHA == self AND status IN {ACTIVE, ABATED}"
    constants: {}
    precision: |
      Pinned rounding order: "per-row then sum". Doing "sum then round" would be a no-op
      here because rows are already integer cents, but the order is pinned for downstream
      reporting endpoints that sum cents into dollars — the sum is taken in cents, then
      divided by 100 with floor at the reporting layer, NOT each row converted to dollars
      then summed.
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the configured roles {Applicant, Landlord, Inspector, CaseWorker, PortabilityCoordinator, PHAAdmin}"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-referenced resource ids exist (validated left-to-right): /vouchers/{vid}/tenancies/{tid}/inspections/{iid} checks vid then tid then iid"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-referenced endpoints"

  - priority: 4
    category: existence
    check: "All body-referenced foreign keys exist (applicant_id, unit_id, voucher_id, tenancy_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "all create/update endpoints"

  - priority: 5
    category: state
    check: "Voucher.status is in the set required by the endpoint (e.g., POST /tenancies requires Voucher.status IN {SEARCHING, SEARCHING_REISSUED})"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "endpoints with state preconditions in §1.2"

  - priority: 6
    category: state
    check: "Voucher.search_deadline has not passed (now() <= search_deadline)"
    error_id: ERR_VOUCHER_EXPIRED
    http_status: 409
    applies_to: ["POST /tenancies", "POST /tenancies/{id}/finalize"]

  - priority: 7
    category: business_referential
    check: "Voucher.administering_pha_id matches the PHA the API is serving (X-PHA-ID context). Cross-PHA actions must go through PortabilityRequest."
    error_id: ERR_VOUCHER_NOT_LOCAL
    http_status: 403
    applies_to: ["POST /tenancies", "POST /tenancies/{id}/finalize", "POST /annual-reviews"]

  - priority: 8
    category: business_referential
    check: "Inspector role can only complete Inspections where Inspection.tenancy_id resolves to a Tenancy administered by Inspector's PHA"
    error_id: ERR_INSPECTOR_OUT_OF_SCOPE
    http_status: 403
    applies_to: ["POST /inspections/{id}/complete"]

  - priority: 9
    category: business_safety
    check: "Voucher.special_mobility_flag=true requires Unit.zone == ZONE_A (HQS+mobility safety guardrail; a special-mobility voucher CANNOT lease into a non-opportunity zone)"
    error_id: ERR_MOBILITY_ZONE_VIOLATION
    http_status: 422
    applies_to: ["POST /tenancies", "POST /tenancies/{id}/finalize"]

  - priority: 10
    category: business_safety
    check: "Inspection cannot transition to PASS if defects array is non-empty; cannot transition to FAIL_* if defects array is empty"
    error_id: ERR_INSPECTION_OUTCOME_MISMATCH
    http_status: 422
    applies_to: ["POST /inspections/{id}/complete"]

  - priority: 11
    category: business_constraint
    check: "Unit.bedroom_count >= 1 when Voucher.bedroom_size >= 1 (cannot lease a 0br unit to a 2br voucher household — under-housing constraint)"
    error_id: ERR_UNIT_TOO_SMALL
    http_status: 422
    applies_to: ["POST /tenancies"]

  - priority: 12
    category: business_constraint
    check: "Tenancy.lease_start <= Voucher.search_deadline (cannot start a lease after the voucher search window closes)"
    error_id: ERR_LEASE_START_AFTER_DEADLINE
    http_status: 422
    applies_to: ["POST /tenancies"]

  - priority: 13
    category: business_constraint
    check: "RentReasonablenessRecord.comparable_rents_cents has length >= 3"
    error_id: ERR_INSUFFICIENT_COMPARABLES
    http_status: 422
    applies_to: ["POST /rent-reasonableness-records"]

  - priority: 14
    category: business_temporal
    check: "No two Tenancies on the same Unit may have overlapping [requested_at, terminated_at) intervals; a terminated_at must be strictly before the next requested_at (NO same-day occupancy — buffer is open at end, closed at start)"
    error_id: ERR_UNIT_OCCUPANCY_OVERLAP
    http_status: 409
    applies_to: ["POST /tenancies"]

  - priority: 15
    category: business_temporal
    check: "No two ANNUAL Inspections on the same Unit within 12 months — minimum gap is 365 days from previous PASS/CURED. Adjacency at exactly 365 days is allowed (closed-closed interval semantics on the GAP)."
    error_id: ERR_INSPECTION_TOO_SOON
    http_status: 409
    applies_to: ["POST /inspections"]

  - priority: 16
    category: business_fiscal
    check: "calc_rent_burden returns FALSE at initial lease-up — tenant share exceeds 40% of monthly adjusted income"
    error_id: ERR_RENT_BURDEN_EXCEEDED
    http_status: 422
    applies_to: ["POST /tenancies/{id}/finalize"]

  - priority: 17
    category: business_fiscal
    check: "calc_rent_burden hits divide-by-zero (Applicant.adjusted_annual_income_cents == 0 at lease-up)"
    error_id: ERR_RENT_BURDEN_DIVZERO
    http_status: 422
    applies_to: ["POST /tenancies/{id}/finalize"]

  - priority: 18
    category: business_fiscal
    check: "RentReasonablenessRecord.is_reasonable == false (gross_rent_cents > floor(median * 1.10))"
    error_id: ERR_RENT_NOT_REASONABLE
    http_status: 422
    applies_to: ["POST /tenancies/{id}/finalize"]

  - priority: 19
    category: business_constraint
    check: "PortabilityRequest.receiving_pha_id is different from Voucher.administering_pha_id AND is in the configured PHA network"
    error_id: ERR_INVALID_RECEIVING_PHA
    http_status: 422
    applies_to: ["POST /portability-requests"]

  - priority: 20
    category: business_constraint
    check: "AnnualReview.submitted_at is within 30 days before or after review_due_date"
    error_id: ERR_REVIEW_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /annual-reviews/{id}/submit"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Applicants ----
  - method: POST
    path: "/applicants"
    description: "Submit a new applicant household with income data. Computes adjusted_annual_income, income_band, eligibility_status."
    roles: [Applicant, CaseWorker]
    code: 201
    input: ["household_name", "household_size", "dependents_count", "elderly_or_disabled_head", "gross_annual_income_cents", "childcare_expense_annual_cents?", "medical_expense_annual_cents?"]
    output: Applicant
    side_effects: ["calc_adjusted_income (initial variant) populates adjusted_annual_income_cents"]

  - method: GET
    path: "/applicants/{id}"
    description: "Read an applicant"
    roles: [Applicant, CaseWorker, PHAAdmin]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: POST
    path: "/applicants/{id}/revoke"
    description: "Revoke applicant eligibility (also cascades to any ISSUED voucher → REVOKED)"
    roles: [PHAAdmin]
    code: 200
    input: []
    output: Applicant
    side_effects: ["Applicant.eligibility_status := INELIGIBLE", "Any Voucher with this applicant_id in status ISSUED → REVOKED"]

  # ---- Vouchers ----
  - method: POST
    path: "/vouchers"
    description: "Issue a voucher to an eligible applicant. Computes bedroom_size from household_size, sets search_deadline = now() + 120 days."
    roles: [CaseWorker]
    code: 201
    input: ["applicant_id", "zone", "special_mobility_flag?", "administering_pha_id"]
    output: Voucher
    side_effects: ["Voucher.status := SEARCHING immediately after persistence (ISSUED is momentary)"]

  - method: GET
    path: "/vouchers/{id}"
    description: "Read a voucher; remaining_search_days computed live from now()"
    roles: [Applicant, CaseWorker, PHAAdmin]
    code: 200
    input: []
    output: Voucher
    side_effects: []

  - method: GET
    path: "/vouchers"
    description: "List vouchers with filter+pagination (status, administering_pha_id, special_mobility_flag)"
    roles: [CaseWorker, PHAAdmin]
    code: 200
    input: ["status?", "administering_pha_id?", "special_mobility_flag?", "limit?", "offset?"]
    output: "Voucher[]"
    side_effects: []

  # ---- Units ----
  - method: POST
    path: "/units"
    description: "Landlord registers a unit"
    roles: [Landlord]
    code: 201
    input: ["street_address", "zone", "bedroom_count", "asking_rent_cents", "tenant_paid_utilities_cents?"]
    output: Unit
    side_effects: []

  - method: GET
    path: "/units/{id}"
    description: "Read a unit"
    roles: [Landlord, CaseWorker, Inspector]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: GET
    path: "/units"
    description: "List units (filter: zone, bedroom_count, occupancy_status)"
    roles: [Landlord, CaseWorker]
    code: 200
    input: ["zone?", "bedroom_count?", "occupancy_status?", "limit?", "offset?"]
    output: "Unit[]"
    side_effects: []

  # ---- Payment Standards ----
  - method: POST
    path: "/payment-standards"
    description: "PHAAdmin sets the Payment Standard for a (zone, bedroom_size) cell with an effective_from timestamp"
    roles: [PHAAdmin]
    code: 201
    input: [zone, bedroom_size, standard_amount_cents, mobility_amount_cents, effective_from]
    output: PaymentStandard
    side_effects: []

  - method: GET
    path: "/payment-standards"
    description: "List payment standards (filter: zone, bedroom_size, active_only)"
    roles: [PHAAdmin, CaseWorker, Landlord]
    code: 200
    input: ["zone?", "bedroom_size?", "active_only?", "limit?", "offset?"]
    output: "PaymentStandard[]"
    side_effects: []

  # ---- Tenancies (RFTA) ----
  - method: POST
    path: "/tenancies"
    description: "Submit Request for Tenancy Approval (RFTA). Creates Tenancy in PENDING_INSPECTION, freezes gross_rent_cents and applicable_payment_standard_cents."
    roles: [Landlord, CaseWorker]
    code: 201
    input: [voucher_id, unit_id, lease_start]
    output: Tenancy
    side_effects: ["Unit.occupancy_status := OCCUPIED_PENDING", "Tenancy.gross_rent_cents and applicable_payment_standard_cents frozen"]

  - method: GET
    path: "/tenancies/{id}"
    description: "Read a tenancy"
    roles: [Landlord, CaseWorker, Inspector, Applicant]
    code: 200
    input: []
    output: Tenancy
    side_effects: []

  - method: POST
    path: "/tenancies/{id}/finalize"
    description: "Finalize PENDING_RENT_REASONABLE → ACTIVE: runs rent_burden + mobility-zone gates, computes initial TTP and HAP, cascades Voucher → LEASED."
    roles: [CaseWorker]
    code: 200
    input: []
    output: Tenancy
    side_effects: ["calc_ttp (initial)", "calc_hap (initial or special_mobility)", "calc_rent_burden gate", "Voucher → LEASED", "AnnualReview DUE row created"]

  - method: POST
    path: "/tenancies/{id}/move-out"
    description: "Tenant initiates move-out with continued assistance — terminates this Tenancy, re-issues voucher search window"
    roles: [CaseWorker]
    code: 200
    input: [move_out_date]
    output: Tenancy
    side_effects: ["Tenancy.status := TERMINATED (reason=TENANT_MOVE_OUT)", "Voucher LEASED → SEARCHING_REISSUED with search_deadline := move_out_date + 60 days", "Unit.occupancy_status := VACANT"]

  # ---- Inspections ----
  - method: POST
    path: "/inspections"
    description: "Schedule an inspection. inspection_type IN {INITIAL, ANNUAL, REINSPECTION}. Enforces 365-day gap between ANNUAL inspections on the same Unit."
    roles: [Inspector, CaseWorker]
    code: 201
    input: [tenancy_id, inspection_type, scheduled_for]
    output: Inspection
    side_effects: ["Unit.next_annual_inspection_due updated where applicable"]

  - method: POST
    path: "/inspections/{id}/complete"
    description: "Inspector files outcome and defects. Drives cascades into Tenancy (ABATED/ACTIVE/REJECTED)."
    roles: [Inspector]
    code: 200
    input: [outcome, defects]
    output: Inspection
    side_effects: ["Cascade into parent Tenancy (see §1.2)", "Unit.last_inspection_passed_at updated on PASS/CURED"]

  - method: GET
    path: "/inspections/{id}"
    description: "Read an inspection"
    roles: [Inspector, CaseWorker, Landlord]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  # ---- Rent Reasonableness ----
  - method: POST
    path: "/rent-reasonableness-records"
    description: "Attach rent-reasonableness comparables to a Tenancy. Computes median + threshold + is_reasonable."
    roles: [CaseWorker]
    code: 201
    input: [tenancy_id, comparable_rents_cents]
    output: RentReasonablenessRecord
    side_effects: ["calc_rent_reasonableness", "Tenancy.rent_reasonable updated"]

  # ---- Annual Review ----
  - method: GET
    path: "/annual-reviews/{id}"
    description: "Read an annual review"
    roles: [Applicant, CaseWorker]
    code: 200
    input: []
    output: AnnualReview
    side_effects: []

  - method: POST
    path: "/annual-reviews/{id}/submit"
    description: "Applicant submits updated income and household-size. Runs calc_adjusted_income (recertification) and calc_ttp (recertification)."
    roles: [Applicant]
    code: 200
    input: [declared_gross_annual_income_cents, declared_household_size]
    output: AnnualReview
    side_effects: ["calc_adjusted_income (recertification)", "calc_ttp (recertification)", "calc_hap"]

  - method: POST
    path: "/annual-reviews/{id}/mark-deficient"
    description: "CaseWorker marks a submitted review as deficient — sets 14-day re-submit window"
    roles: [CaseWorker]
    code: 200
    input: [deficiency_codes]
    output: AnnualReview
    side_effects: []

  - method: POST
    path: "/annual-reviews/{id}/resubmit"
    description: "Applicant resubmits after fixing deficiencies (cycle back to SUBMITTED)"
    roles: [Applicant]
    code: 200
    input: [declared_gross_annual_income_cents, declared_household_size]
    output: AnnualReview
    side_effects: ["deficiency_codes cleared", "recalc new_* fields"]

  - method: POST
    path: "/annual-reviews/{id}/approve"
    description: "CaseWorker approves; cascades new TTP/HAP into Tenancy.current_* and schedules next DUE review"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AnnualReview
    side_effects: ["Tenancy.current_total_tenant_payment_cents and current_hap_cents updated", "Next AnnualReview row created with review_due_date := this.review_due_date + 365 days"]

  - method: POST
    path: "/annual-reviews/{id}/deny"
    description: "CaseWorker denies; cascades Tenancy → TERMINATED and Voucher → TERMINATED"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AnnualReview
    side_effects: ["Tenancy.status := TERMINATED (reason=ANNUAL_REVIEW_DENIED)", "Voucher → TERMINATED"]

  # ---- Portability ----
  - method: POST
    path: "/portability-requests"
    description: "Submit a portability request to move voucher administration to receiving_pha_id"
    roles: [Applicant, CaseWorker]
    code: 201
    input: [voucher_id, receiving_pha_id]
    output: PortabilityRequest
    side_effects: []

  - method: POST
    path: "/portability-requests/{id}/absorb"
    description: "Receiving PHA absorbs the voucher — administering_pha_id changes, any active Tenancy terminates"
    roles: [PortabilityCoordinator]
    code: 200
    input: []
    output: PortabilityRequest
    side_effects: ["Voucher.administering_pha_id := receiving_pha_id", "Cascade: Voucher → PORTED_OUT, active Tenancy → TERMINATED (PORTABILITY_ABSORBED)", "Future HAPPayment suppressed"]

  - method: POST
    path: "/portability-requests/{id}/bill"
    description: "Receiving PHA elects to bill the originating PHA instead of absorbing"
    roles: [PortabilityCoordinator]
    code: 200
    input: []
    output: PortabilityRequest
    side_effects: []

  - method: POST
    path: "/portability-requests/{id}/deny"
    description: "Deny the portability request"
    roles: [PortabilityCoordinator]
    code: 200
    input: [denial_reason]
    output: PortabilityRequest
    side_effects: []

  # ---- HAP Payments (ledger) ----
  - method: GET
    path: "/hap-payments"
    description: "List HAP ledger entries (filter: tenancy_id, pay_period_month, status)"
    roles: [CaseWorker, PHAAdmin, Landlord]
    code: 200
    input: ["tenancy_id?", "pay_period_month?", "status?", "limit?", "offset?"]
    output: "HAPPayment[]"
    side_effects: []

  # ---- Test-driving endpoints (clock + sweeps) ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server's logical clock. Required for any time-gated transition (voucher expiry, cure deadline, review window)."
    roles: [PHAAdmin]
    code: 200
    input: [to_timestamp]
    output: "{ now: datetime }"
    side_effects: []

  - method: POST
    path: "/_sweep/expirations"
    description: "Run the voucher-expiration sweep (idempotent: only transitions vouchers whose search_deadline has actually passed)"
    roles: [PHAAdmin]
    code: 200
    input: []
    output: "{ expired_voucher_ids: string[] }"
    side_effects: ["Vouchers with now() > search_deadline AND no ACTIVE Tenancy → EXPIRED"]

  - method: POST
    path: "/_sweep/abatements"
    description: "Run the abatement-deadline sweep — terminates Tenancies whose cure_deadline has elapsed without a CURED reinspection"
    roles: [PHAAdmin]
    code: 200
    input: []
    output: "{ terminated_tenancy_ids: string[] }"
    side_effects: ["Tenancy ABATED → TERMINATED (HQS_UNCURED), Voucher → TERMINATED"]

  - method: POST
    path: "/_sweep/reviews"
    description: "Run the AnnualReview sweep — closes deficient reviews past their 14-day cure window as DENIED"
    roles: [PHAAdmin]
    code: 200
    input: []
    output: "{ denied_review_ids: string[] }"
    side_effects: ["DEFICIENT → DENIED cascade"]

  - method: POST
    path: "/_sweep/monthly-hap"
    description: "Generate the monthly HAPPayment ledger rows for all ACTIVE/ABATED Tenancies of locally-administered vouchers"
    roles: [PHAAdmin]
    code: 200
    input: [pay_period_month]
    output: "{ created_payment_ids: string[] }"
    side_effects: ["calc_hap_monthly_ledger_round emits one HAPPayment row per Tenancy"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-Role or X-User-ID header missing"

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role not in {Applicant, Landlord, Inspector, CaseWorker, PortabilityCoordinator, PHAAdmin}, or the role is not permitted to invoke this endpoint per §1.7"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist (validated left-to-right in the URL)"

  - id: ERR_FK_NOT_FOUND
    http: 422
    condition: "A body field referencing another entity (applicant_id, voucher_id, unit_id, tenancy_id, receiving_pha_id) does not resolve"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state where the requested operation is allowed (e.g., finalize on already-ACTIVE Tenancy, approve on non-SUBMITTED AnnualReview)"

  - id: ERR_VOUCHER_EXPIRED
    http: 409
    condition: "Voucher.status == EXPIRED OR now() > Voucher.search_deadline when a tenancy operation is attempted"

  - id: ERR_VOUCHER_NOT_LOCAL
    http: 403
    condition: "Voucher.administering_pha_id does not match the API caller's PHA context (cross-PHA action requires portability)"

  - id: ERR_INSPECTOR_OUT_OF_SCOPE
    http: 403
    condition: "Inspector attempts to complete an Inspection on a Tenancy administered by another PHA"

  - id: ERR_MOBILITY_ZONE_VIOLATION
    http: 422
    condition: "special_mobility_flag voucher attempts to lease a non-ZONE_A Unit"

  - id: ERR_INSPECTION_OUTCOME_MISMATCH
    http: 422
    condition: "outcome=PASS with non-empty defects OR outcome=FAIL_* with empty defects"

  - id: ERR_UNIT_TOO_SMALL
    http: 422
    condition: "Unit.bedroom_count < required minimum for Voucher.bedroom_size (cannot under-house)"

  - id: ERR_LEASE_START_AFTER_DEADLINE
    http: 422
    condition: "Tenancy.lease_start > Voucher.search_deadline"

  - id: ERR_INSUFFICIENT_COMPARABLES
    http: 422
    condition: "RentReasonablenessRecord.comparable_rents_cents has length < 3"

  - id: ERR_UNIT_NOT_VACANT
    http: 409
    condition: "Unit.occupancy_status != VACANT when a new Tenancy is created on it"

  - id: ERR_UNIT_OCCUPANCY_OVERLAP
    http: 409
    condition: "Proposed Tenancy interval overlaps an existing non-terminated Tenancy on the same Unit (closed-open interval semantics: terminated_at < requested_at required)"

  - id: ERR_INSPECTION_TOO_SOON
    http: 409
    condition: "An ANNUAL inspection is requested less than 365 days after the previous PASS/CURED inspection on the same Unit"

  - id: ERR_INSPECTION_ALREADY_COMPLETED
    http: 409
    condition: "POST /inspections/{id}/complete on a record already in COMPLETED_* status"

  - id: ERR_RENT_BURDEN_EXCEEDED
    http: 422
    condition: "calc_rent_burden returns false (tenant share strictly exceeds 40% of monthly adjusted income at lease-up)"

  - id: ERR_RENT_BURDEN_DIVZERO
    http: 422
    condition: "Applicant.adjusted_annual_income_cents == 0 at lease-up — rent burden is undefined; treated as a separate failure mode from ERR_RENT_BURDEN_EXCEEDED"

  - id: ERR_RENT_NOT_REASONABLE
    http: 422
    condition: "RentReasonablenessRecord.is_reasonable == false on the active record at finalize time"

  - id: ERR_INVALID_RECEIVING_PHA
    http: 422
    condition: "PortabilityRequest.receiving_pha_id equals administering_pha_id or is not in the PHA network"

  - id: ERR_REVIEW_WINDOW_CLOSED
    http: 409
    condition: "AnnualReview submitted more than 30 days before or after review_due_date"

  - id: ERR_VALIDATION
    http: 422
    condition: "Generic request-body validation failure not covered by a more specific code (e.g., negative cents, malformed datetime)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Household head-of-household. Submits application, submits annual reviews, may initiate portability."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /annual-reviews/{id}/submit"
      - "POST /annual-reviews/{id}/resubmit"
    shared_operations:
      - "POST /applicants (shared with CaseWorker)"
      - "GET /applicants/{id} (own only — Applicant.id must equal X-User-ID)"
      - "GET /vouchers/{id} (own only — Voucher.applicant_id must equal X-User-ID)"
      - "GET /tenancies/{id} (own only — Tenancy → Voucher.applicant_id must equal X-User-ID)"
      - "GET /annual-reviews/{id} (own only)"
      - "POST /portability-requests (own voucher only)"

  - name: Landlord
    description: "Unit owner. Registers units, submits RFTA on tenant's behalf."
    identity: "entity_backed:Landlord"
    exclusive_operations:
      - "POST /units"
    shared_operations:
      - "GET /units/{id} (own only — Unit.landlord_id must equal X-User-ID)"
      - "GET /units (own only filter)"
      - "POST /tenancies (shared with CaseWorker; landlord may submit RFTA for own Unit)"
      - "GET /tenancies/{id} (own only — Tenancy.unit_id → Unit.landlord_id must equal X-User-ID)"
      - "GET /inspections/{id} (own only)"
      - "GET /hap-payments (own only — Tenancy.unit_id → Unit.landlord_id must equal X-User-ID)"
      - "GET /payment-standards"

  - name: Inspector
    description: "Conducts HQS inspections and files outcomes. Scoped to a PHA."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspections/{id}/complete"
    shared_operations:
      - "POST /inspections (shared with CaseWorker)"
      - "GET /inspections/{id}"
      - "GET /units/{id}"

  - name: CaseWorker
    description: "PHA staff. Issues vouchers, finalizes tenancies, reviews annual reviews."
    identity: "entity_backed:CaseWorker"
    exclusive_operations:
      - "POST /vouchers"
      - "POST /tenancies/{id}/finalize"
      - "POST /tenancies/{id}/move-out"
      - "POST /annual-reviews/{id}/mark-deficient"
      - "POST /annual-reviews/{id}/approve"
      - "POST /annual-reviews/{id}/deny"
      - "POST /rent-reasonableness-records"
    shared_operations:
      - "POST /applicants (shared with Applicant)"
      - "POST /tenancies (shared with Landlord)"
      - "POST /inspections (shared with Inspector)"
      - "GET /applicants/{id}, /vouchers/{id}, /tenancies/{id}, /annual-reviews/{id}, /units/{id}, /inspections/{id}"
      - "POST /portability-requests (shared with Applicant)"
      - "GET /hap-payments"

  - name: PortabilityCoordinator
    description: "Handles cross-PHA voucher transfers."
    identity: "entity_backed:PortabilityCoordinator"
    exclusive_operations:
      - "POST /portability-requests/{id}/absorb"
      - "POST /portability-requests/{id}/bill"
      - "POST /portability-requests/{id}/deny"
    shared_operations:
      - "GET /vouchers/{id}"

  - name: PHAAdmin
    description: "PHA administrator. Configures payment standards, runs system sweeps, advances clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /applicants/{id}/revoke"
      - "POST /payment-standards"
      - "POST /_clock/advance"
      - "POST /_sweep/expirations"
      - "POST /_sweep/abatements"
      - "POST /_sweep/reviews"
      - "POST /_sweep/monthly-hap"
    shared_operations:
      - "GET /vouchers, /payment-standards, /hap-payments (full visibility)"
      - "GET /applicants/{id}, /vouchers/{id}, /tenancies/{id}, /annual-reviews/{id}"
