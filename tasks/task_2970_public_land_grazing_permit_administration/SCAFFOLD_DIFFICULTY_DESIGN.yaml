      - name: appeal_reversal_restoration_cascade
        grounds:
          - state_machines.PermitDecision.EFFECTIVE_to_VACATED
          - state_machines.AppealCase.UNDER_REVIEW_to_REVERSED
          - calculations.emergency_reduction_reallocation
          - calculations.use_bill_amount
          - entities.PermitDecision.fields.pre_decision_adjustment_pct
        distinguishing_aspect: |
          Depth 4 from a completely different trigger — POST /appeal-cases/{appealId}/decide with
          outcome REVERSE — and it runs the cascade BACKWARDS: vacating the decision restores
          stocking_adjustment_pct from pre_decision_adjustment_pct 0.0000, WHICH restores
          effective_capacity_aums to 1200, WHICH restores the AOI to
          floor(300*(1-0.0))=300 from its issue-time snapshot, WHICH supersedes the reduced
          41280-cent bill with a 54100-cent bill (admin tier 2 returns), leaving no drift.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs, two 300-AUM pastures, a permittee with a 400-AUM LAND base property and an ISSUED 300-AUM permit"
            - "An ISSUED 2026 AOI whose 54100-cent PRELIMINARY_USE bill was superseded by a 41280-cent REVISED_USE bill when a 20 percent STOCKING_ADJUSTMENT decision was made EFFECTIVE"
            - "An appeal filed against the already EFFECTIVE decision (so no stay is granted) and docketed by u_judge_1"
