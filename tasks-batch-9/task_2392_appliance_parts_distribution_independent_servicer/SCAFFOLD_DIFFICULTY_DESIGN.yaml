            - "hop 2 — OrderLine.${line_1_id}.line_status == SUBSTITUTE_PENDING and OrderLine.${line_1_id}.allocation_branch_id == null"
            - "hop 2 — GET /substitute-requests?created_by_price_file_id=${pf_id} returns exactly 1 row with request_status == PENDING, source == PRICE_FILE_OBSOLESCENCE and order_line_id == ${line_1_id}"
            - "hop 2 — InventoryRecord.${inv_a_p1_id}.reserved_units == 0 and InventoryRecord.${inv_a_p1_id}.available_units == 10"
            - "hop 3 — PartOrder.${order_id}.fulfillment_status == HELD and PartOrder.${order_id}.hold_reason == SUBSTITUTE_PENDING"
            - "hop 3 — PartOrder.${order_id}.subtotal_cents == 102400 and PartOrder.${order_id}.total_cents == 102400"
            - "hop 4 — ServicerAccount.${acct_s_id}.credit_used_cents == 102400"
            - "untouched — OrderLine.${line_2_id}.line_status == ALLOCATED and OrderLine.${line_2_id}.extended_price_cents == 102400"
            - "untouched — InventoryRecord.${inv_a_p4_id}.reserved_units == 1"

      - name: return_credit_posting_releases_credit_hold_and_re_reserves_inventory
        grounds:
          - endpoints.POST_/return-authorizations/{id}/receive
          - state_machines.ReturnAuthorization.RECEIVED_to_CREDITED
          - state_machines.ServicerAccount.CREDIT_HOLD_to_ACTIVE
          - state_machines.PartOrder.HELD_to_ALLOCATED
          - calculations.branch_allocation_selection
        distinguishing_aspect: |
          Depth-5 chain fired from a receiving-dock write instead of a catalog write: RA
          RECEIVED -> CREDITED posting a 9359 credit (hop 1) -> ServicerAccount.credit_used_cents
          drops 20798 -> 11439 (hop 2) -> that figure is at or below 19800 == 22000 *
          CREDIT_HOLD_RELEASE_RATIO so the account leaves CREDIT_HOLD for ACTIVE (hop 3) -> the
          frozen HELD(CREDIT_HOLD) order returns to ALLOCATED (hop 4) -> its line re-reserves a
          unit at STL (hop 5). Removing any hop stops the rest: a rejected RA posts no credit,
          exposure above 19800 keeps the hold, a held account never sweeps, and an unswept order
          never re-reserves.
        test_recipe:
          setup:
            - "PricingTier GOLD; Branch STL; Part P1 (12999 MECHANICAL); InventoryRecord (STL, P1) with on_hand_units 10."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 22000 (so the release ratio threshold is exactly 19800), core_liability_limit_cents 5000000, authorized for WHIRLPOOL."
            - "Order O1 is fulfilled and INVOICED for 1 unit of P1 at 10399; order O2 is credit-approved and ALLOCATED for 1 unit of P1 at 10399, so exposure is 20798 — above the 19800 release threshold."
            - "The account is then put on CREDIT_HOLD, which freezes O2 to HELD(CREDIT_HOLD), pushes its line to BACKORDERED and releases its reservation."
            - "A NO_LONGER_NEEDED return of O1's line is requested on the fulfilment day (day 0, inside RESTOCK_TIER1_MAX_DAYS) and approved without a fee waiver: gross 10399, fee 1040, credit 9359."
            - "The clock stays at 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
