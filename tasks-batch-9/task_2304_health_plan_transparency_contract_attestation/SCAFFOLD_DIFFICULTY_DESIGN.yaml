  - rule_id: resource_temporal_overlap
    instances:
      - name: refresh_period_closed_interval_shares_boundary_day
        grounds:
          - validations[priority=20]
          - errors[ERR_REFRESH_PERIOD_OVERLAP]
          - calculations.refresh_cycle_outcome
          - entities.RefreshCycle.fields.period_end
        distinguishing_aspect: |
          Refresh periods are CLOSED intervals, so a new cycle starting on 2027-06-30 — the exact last
          day of the existing June cycle — collides and must be refused with 409
          ERR_REFRESH_PERIOD_OVERLAP; shifting the start by one day to 2027-07-01 is accepted and
          derives deadline_at 2027-08-05T23:59:59.999Z (period_end + GRACE_DAYS 5, end of day, to the
          millisecond). Half-open overlap arithmetic accepts the colliding request, and a naive
          "+5 days at midnight" deadline misses the 23:59:59.999 boundary.
        test_recipe:
          setup:
            - "Logical clock at 2027-07-01T09:00:00Z."
            - "ACTIVE PlanYear PY2027 (2027-01-01..2027-12-31), covered_lives 6000, one TPA contract."
            - "One PENDING RefreshCycle for 2027-06 spanning the closed interval 2027-06-01..2027-06-30."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-07-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/refresh-cycles"
              payload: { plan_year_id: "${py}", period_month: "2027-06", period_start: "2027-06-01", period_end: "2027-06-30" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rc_jun: "$.data.id" }
