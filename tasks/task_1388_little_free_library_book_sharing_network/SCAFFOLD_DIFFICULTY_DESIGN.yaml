            - { call: "POST /library-network/maintenance-requests", payload: { box_id: "${box}", category: "WEAR", description: "Loose knob" }, as: Anonymous, captures: { mr: "$.data.id" } }
            - { call: "POST /library-network/maintenance-requests/${mr}/triage", payload: { severity: "LOW", scheduled_date: "2026-08-02" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/maintenance-requests/${mr}/resolve", payload: { outcome: "RESOLVED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/batches", payload: { source_type: "PUBLIC_DROP", region_code: "OR" }, as: HubCoordinator, as_user_id: "hub-1", captures: { batch: "$.data.id" } }
            - { call: "POST /library-network/batches/${batch}/items", payload: { items: [ { title: "X1", category: "FICTION", condition_grade: "A" }, { title: "X2", category: "FICTION", condition_grade: "B" } ] }, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "POST /library-network/batches/${batch}/sort-complete", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { b_v: "$.data.version" } }
            - { call: "POST /library-network/batches/${batch}/distribution-runs", payload: { expected_batch_version: "${b_v}" }, as: HubCoordinator, as_user_id: "hub-1", captures: { run: "$.data.id" } }
            - { call: "POST /library-network/distribution-runs/${run}/confirm", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "GET /library-network/distribution-runs/${run}/allocations", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { a0: "$.data[0].id", a1: "$.data[1].id" } }
            - { call: "POST /library-network/distribution-runs/${run}/dispatch", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
          trigger:
            - { call: "POST /library-network/allocations/${a0}/receive", payload: {}, as: Steward, as_user_id: "${stw}" }
            - { call: "GET /library-network/stewards/${stw}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { mid_points: "$.data.rolling_points", mid_tier: "$.data.recognition_tier" } }
