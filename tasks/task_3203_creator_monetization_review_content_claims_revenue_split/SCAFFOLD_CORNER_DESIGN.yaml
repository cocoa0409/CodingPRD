              as_user_id: "${ch_lk}"
              captures: { i_lk: $.data.id }
            - call: "POST /api/channels/${ch_lk}/content-items/${i_lk}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_lk}"
            - call: "GET /api/content-items/${i_lk}"
              payload: {}
              as: Any
              captures: { i_lkv: $.data.version }
            - call: "POST /api/revenue-routings"
