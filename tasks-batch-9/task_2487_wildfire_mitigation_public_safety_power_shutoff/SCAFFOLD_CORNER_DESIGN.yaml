          - entities.Customer.fields.accessibility_needs
          - entities.NotificationRecord.fields.accessibility_format
        distinguishing_aspect: "accessibility_needs subtract channels before the waterfall runs: AUDIO forbids SMS and EMAIL, TTY forbids VOICE, so a TTY account consenting to VOICE and EMAIL is reached by EMAIL, a LARGE_PRINT account keeps SMS but is stamped LARGE_PRINT, and ACC-A3's AUDIO+TTY pair against an SMS-only consent set leaves no channel at all — channel_used null and UNREACHABLE."
