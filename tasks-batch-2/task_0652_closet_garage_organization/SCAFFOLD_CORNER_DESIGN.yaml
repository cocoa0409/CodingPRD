              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj}/space-measures"
              payload: { wall_count: 2, linear_feet: 12.5, ceiling_height_in: 96 }
              as: Designer
              captures: { meas: $.data.id }
            - call: "POST /projects/${proj}/component-configs"
              payload: { space_measure_id: "${meas}", material_grade: "MELAMINE", line_items: [ { component_type: "SHELF", quantity: 10, unit_price_cents: 5000 } ] }
              as: Designer
              captures: { cfg: $.data.id }
            - call: "POST /component-configs/${cfg}/finalize"
              payload: {}
              as: Designer
            - call: "POST /projects/${proj}/quotes"
              payload: { component_config_id: "${cfg}" }
              as: Designer
              captures: { quote: $.data.id }
            - call: "POST /quotes/${quote}/issue"
              payload: {}
              as: Designer
            - call: "POST /quotes/${quote}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { qv: $.data.version }
            - call: "POST /deposits"
              payload: { project_id: "${proj}", quote_id: "${quote}", amount_cents: 5000000 }
              as: PlatformAdmin
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/capture"
              payload: { expected_quote_version: "${qv}" }
              as: PlatformAdmin
            - call: "POST /change-orders"
              payload: { project_id: "${proj}", base_quote_id: "${quote}", change_type: "SCHEDULE_CHANGE" }
              as: Designer
              captures: { co1: $.data.id }
            - call: "POST /change-orders/${co1}/reject"
              payload: {}
              as: Designer
          trigger:
            - call: "POST /change-orders"
              payload: { project_id: "${proj}", base_quote_id: "${quote}", change_type: "SCHEDULE_CHANGE" }
              as: Designer
              captures: { co2: $.data.id }
          assert:
            - "ChangeOrder.${co1}.status == REJECTED"
            - "ChangeOrder.${co2}.status == SUBMITTED"

