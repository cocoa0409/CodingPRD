          assert:
            - "Invoice.${inv_id}.invoice_status == PAST_DUE (issued_at 2026-09-01 + 30 days crossed at 2026-10-01T00:00Z; clock now 2026-10-02)"
            - "Owner.${own_id}.owner_standing == DELINQUENT (hop 2 — caused by the invoice transition, not the clock call directly)"
            - "Subsequent POST /bookings/${bk_id}/confirm is rejected with ERR_OWNER_STANDING_BLOCKS (gate wired to hop-2 state)"

  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict: different error-category pairs
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_vs_fiscal_priority
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ENTITLEMENT_EXHAUSTED]
        distinguishing_aspect: |
          Category pair state(4) vs business_fiscal(10): a confirm on a
          CANCELLED booking whose share ALSO has insufficient hours must return
          ERR_INVALID_STATE (state beats fiscal), not ERR_ENTITLEMENT_EXHAUSTED.
        test_recipe:
          setup:
            - "Owner with ACTIVE 1/16 LIGHT share (50.00h); booking est 60.00h created then CANCELLED (so both state and fiscal checks would fail at confirm)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-PP1", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
