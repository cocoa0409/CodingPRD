      - name: resolve_splits_into_goodwill_and_upheld_arms_on_one_optional_field
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/loyalty/member-complaints/{complaintId}/resolve
          - state_machines.MemberComplaint
          - calculations.point_conservation
        distinguishing_aspect: |
          One endpoint, one optional field, two terminal states and two different ledger outcomes: a
          positive goodwill_points lands RESOLVED_GOODWILL and mints a GOODWILL entry, while omitting
          the field and passing an explicit 0 both land RESOLVED_UPHELD and write nothing. Only the
          RESOLVED_UPHELD arm can later be escalated, so the branch also decides the row's future.
        test_recipe:
          setup:
            - "One member with a settled 20000-point purchase, so the fund is HEALTHY and goodwill is not blocked."
            - "Three POINT_SHORTFALL complaints, each moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /loyalty/members"
              payload: { email: "gw1@example.com", full_name: "Lucia Ferrer", enrollment_date: "2026-02-11" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 20000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/member-complaints"
              payload: { member_id: "${m_id}", subject_type: "POINT_SHORTFALL", description: "My April stay credited fewer points than the rate card promised." }
              as: Member
              as_user_id: "${m_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /loyalty/member-complaints"
              payload: { member_id: "${m_id}", subject_type: "POINT_SHORTFALL", description: "My May stay is also short." }
              as: Member
              as_user_id: "${m_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /loyalty/member-complaints"
              payload: { member_id: "${m_id}", subject_type: "BLACKOUT_DISPUTE", description: "The blackout on my anniversary weekend seems wrong." }
              as: Member
              as_user_id: "${m_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /loyalty/member-complaints/${c1_id}/review"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-gw-01"
            - call: "POST /loyalty/member-complaints/${c2_id}/review"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-gw-01"
            - call: "POST /loyalty/member-complaints/${c3_id}/review"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /loyalty/member-complaints/${c1_id}/resolve"
              payload: { resolution: "Shortfall confirmed; 2000 points granted.", goodwill_points: 2000 }
              as: MemberCareAgent
              as_user_id: "care-gw-01"
              captures: { c1_status: $.data.status, c1_granted: $.data.goodwill_points_granted, c1_res: $.data.resolution }
            - call: "POST /loyalty/member-complaints/${c2_id}/resolve"
              payload: { resolution: "Earning was correct for a GROUP rate." }
              as: MemberCareAgent
              as_user_id: "care-gw-01"
              captures: { c2_status: $.data.status, c2_granted: $.data.goodwill_points_granted }
            - call: "POST /loyalty/member-complaints/${c3_id}/resolve"
              payload: { resolution: "Blackout was correctly published.", goodwill_points: 0 }
              as: ProgramAdministrator
              captures: { c3_status: $.data.status, c3_granted: $.data.goodwill_points_granted }
            - call: "GET /loyalty/point-ledger-entries"
              payload: { member_id: "${m_id}", entry_type: "GOODWILL" }
              as: ProgramAuditor
              as_user_id: "aud-gw-01"
              captures: { gw_page: $.data, gw_points: "$.data[0].points" }
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { m_balance: $.data.point_balance }
          assert:
            - "${c1_status} == RESOLVED_GOODWILL, ${c1_granted} == 2000 and ${c1_res} echoes the submitted resolution text"
            - "${c2_status} == RESOLVED_UPHELD and ${c2_granted} == 0 - the omitted optional field is the upheld arm"
            - "${c3_status} == RESOLVED_UPHELD and ${c3_granted} == 0 - an explicit zero is the same arm as omission, not a third behaviour"
            - "${gw_page}.total_count == 1 and ${gw_points} == 2000 - exactly one GOODWILL entry exists across all three resolutions"
            - "${m_balance} == 22000 - 20000 purchased plus the single grant"
            - "GET /loyalty/program-fund reports outstanding_points 22000 and point_liability_cents 10560 - round_half_up(22000 * 0.8 * 0.6) - so the grant is a real liability"

      - name: filtered_lists_are_the_only_reverse_path_from_parent_to_children
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_/loyalty/rate-plans
          - endpoints.GET_/loyalty/stays
          - endpoints.GET_/loyalty/point-ledger-entries
          - endpoints.GET_/loyalty/point-purchases
          - endpoints.GET_/loyalty/blackout-windows
        distinguishing_aspect: |
          No response embeds its children, so every FK is navigated backwards through a filter
          parameter: hotel to rate plans, rate plan to stays, purchase and stay to ledger entries,
          member to purchases, hotel to blackout windows. A well-formed identifier that matches
          nothing answers with an empty page and http 200, never a 404 - the filter is a predicate,
          not a lookup.
        test_recipe:
          setup:
            - "One ACTIVE property with one rate plan, one DRAFT blackout window, one member with a settled 20000-point purchase and one posted 10-night stay."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Linkline Lodge", brand_code: "LLL", market_tier: "SELECT", program_fee_pct: 0.05, rooms_count: 70, trailing_12m_occupancy_pct: 0.68, trailing_12m_adr_cents: 14000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/blackout-windows"
              payload: { start_date: "2026-12-24", end_date: "2026-12-26", scope: "PEAK_ONLY" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { w_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "lk1@example.com", full_name: "Peder Lund", enrollment_date: "2026-01-19" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 20000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-06-01", checkout_date: "2026-06-11", room_revenue_cents: 100000 }
              as: ProgramAdministrator
              captures: { s_id: $.data.id }
            - call: "POST /loyalty/stays/${s_id}/post"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "GET /loyalty/rate-plans"
              payload: { hotel_id: "${h_id}" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { rp_page: $.data, rp_first: "$.data[0].id" }
            - call: "GET /loyalty/stays"
              payload: { rate_plan_id: "${rp_id}" }
              as: ProgramAdministrator
              captures: { st_page: $.data, st_first: "$.data[0].id" }
            - call: "GET /loyalty/point-ledger-entries"
              payload: { source_purchase_id: "${pp_id}" }
              as: ProgramAuditor
              as_user_id: "aud-lk-01"
              captures: { pl_page: $.data, pl_first_type: "$.data[0].entry_type", pl_first_points: "$.data[0].points" }
            - call: "GET /loyalty/point-purchases"
              payload: { member_id: "${m_id}", status: "SETTLED" }
              as: ProgramAdministrator
              captures: { pu_page: $.data, pu_first: "$.data[0].id" }
            - call: "GET /loyalty/blackout-windows"
              payload: { hotel_id: "${h_id}", status: "DRAFT" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { bw_page: $.data, bw_first: "$.data[0].id" }
            - call: "GET /loyalty/stays"
              payload: { hotel_id: "00000000-0000-4000-8000-000000000000" }
              as: ProgramAdministrator
              captures: { miss_page: $.data }
          assert:
            - "${rp_page}.total_count == 1 and ${rp_first} == ${rp_id} - the hotel-to-rate-plan reverse hop"
            - "${st_page}.total_count == 1 and ${st_first} == ${s_id} - the rate-plan-to-stay reverse hop, which no other endpoint offers"
            - "${pl_page}.total_count == 1, ${pl_first_type} == PURCHASE and ${pl_first_points} == 20000 - the purchase-to-ledger reverse hop"
            - "${pu_page}.total_count == 1 and ${pu_first} == ${pp_id} - two predicates compose with AND, not OR"
            - "${bw_page}.total_count == 1 and ${bw_first} == ${w_id}"
            - "${miss_page}.total_count == 0 with http 200 - an unmatched but well-formed filter value is an empty page, not ERR_HOTEL_NOT_FOUND"
            - "no response body in this recipe embeds a child collection; every hop above needed its own request"

      - name: list_pagination_walks_the_collection_and_rejects_out_of_range_windows
        claim_type: standard_crud
        grounds:
          - response_envelope.pagination
          - endpoints.GET_/loyalty/members
          - validations.priority_22_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          The pagination contract is exercised at its edges on a three-row collection: the default
          window, a two-row first page that reports has_more true, a short last page that reports
          false, an offset past the end that still reports the true total, and three malformed
          windows - limit 0, limit 101 and a negative offset - that are refused as bad input rather
          than clamped.
        test_recipe:
          setup:
            - "Exactly three members exist and nothing else."
          setup_api_calls:
            - call: "POST /loyalty/members"
              payload: { email: "pg1@example.com", full_name: "Aiko Tanaka", enrollment_date: "2026-01-05" }
              as: ProgramAdministrator
              captures: { m1_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "pg2@example.com", full_name: "Bela Kovacs", enrollment_date: "2026-01-06" }
              as: ProgramAdministrator
              captures: { m2_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "pg3@example.com", full_name: "Cato Rasmussen", enrollment_date: "2026-01-07" }
              as: ProgramAdministrator
              captures: { m3_id: $.data.id }
          trigger:
            - call: "GET /loyalty/members"
              payload: {}
              as: ProgramAuditor
              as_user_id: "aud-pg-01"
              captures: { p_default: $.data }
            - call: "GET /loyalty/members"
              payload: { limit: 2, offset: 0 }
              as: ProgramAuditor
              as_user_id: "aud-pg-01"
              captures: { p_first: $.data, p_first_row: "$.data[0].id" }
            - call: "GET /loyalty/members"
              payload: { limit: 2, offset: 2 }
              as: ProgramAuditor
              as_user_id: "aud-pg-01"
              captures: { p_last: $.data, p_last_row: "$.data[0].id" }
            - call: "GET /loyalty/members"
              payload: { limit: 2, offset: 3 }
              as: ProgramAuditor
              as_user_id: "aud-pg-01"
              captures: { p_past: $.data }
            - call: "GET /loyalty/members"
              payload: { limit: 0 }
              as: ProgramAuditor
              as_user_id: "aud-pg-01"
              captures: { e_zero: $.data.error_id }
            - call: "GET /loyalty/members"
              payload: { limit: 101 }
              as: ProgramAuditor
              as_user_id: "aud-pg-01"
              captures: { e_big: $.data.error_id }
            - call: "GET /loyalty/members"
              payload: { offset: -1 }
              as: ProgramAuditor
              as_user_id: "aud-pg-01"
              captures: { e_neg: $.data.error_id }
          assert:
            - "${p_default}.limit == 10, ${p_default}.offset == 0, ${p_default}.total_count == 3 and ${p_default}.has_more == false - the declared defaults"
            - "${p_first} carries 2 rows with limit 2, offset 0, total_count 3 and has_more == true, and ${p_first_row} is the first row of the collection's stable order"
            - "${p_last} carries 1 row with total_count 3 and has_more == false, and ${p_last_row} is the third member - the window is offset-based, not cursor-based"
            - "${p_past} carries 0 rows, still reports total_count == 3 and has_more == false, and answers http 200"
            - "${e_zero} == ${e_big} == ${e_neg} == ERR_INVALID_REQUEST with http 400 - limit lives in 1..100 and offset is non-negative, and neither is silently clamped"
            - "every one of these responses carries meta.api_request_id and meta.api_request_timestamp per §1.0"

      - name: system_and_computed_fields_sent_in_a_create_body_are_input_ignored
        claim_type: standard_crud
        grounds:
          - entities.Hotel
          - endpoints.POST_/loyalty/hotels
          - endpoints.POST_/loyalty/stays
        distinguishing_aspect: |
          Fields the endpoint does not declare in its input are not writable, whichever way they are
          smuggled in: a create body that tries to set id, status, version, the fee ledger and the
          denial counter still yields an ONBOARDING property at version 1 with zeroed counters, and a
          stay create that tries to pre-set nights, tier_at_checkin and the awarded points still
          derives all of them. Nothing is rejected - the extra keys are simply not inputs.
        test_recipe:
          setup:
            - "Empty database; one member and one ACTIVE property are built inside the recipe."
          setup_api_calls:
            - call: "POST /loyalty/members"
              payload: { email: "ig1@example.com", full_name: "Marta Silva", enrollment_date: "2026-01-08" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /loyalty/hotels"
              payload: { name: "Ignoreville Hotel", brand_code: "IGH", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 100, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000, id: "00000000-0000-4000-8000-0000000000ff", status: "ACTIVE", version: 9, fee_ledger_balance_cents: 500000, benefit_denial_count: 3, blackout_days_used_current_year: 55 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id, h_status: $.data.status, h_v: $.data.version, h_fee_ledger: $.data.fee_ledger_balance_cents, h_denials: $.data.benefit_denial_count, h_blackout: $.data.blackout_days_used_current_year }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT", base_earn_rate_per_dollar: 99, is_qualifying: true }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id, rp_earn: $.data.base_earn_rate_per_dollar, rp_qual: $.data.is_qualifying }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-06-01", checkout_date: "2026-06-04", room_revenue_cents: 50000, nights: 99, tier_at_checkin: "PLATINUM", status: "POSTED_QUALIFYING", base_points_awarded: 7777, program_fee_assessed_cents: 12345 }
              as: ProgramAdministrator
              captures: { s_id: $.data.id, s_nights: $.data.nights, s_tier: $.data.tier_at_checkin, s_status: $.data.status, s_base: $.data.base_points_awarded, s_fee: $.data.program_fee_assessed_cents }
          assert:
            - "${h_id} != 00000000-0000-4000-8000-0000000000ff - the server mints its own identifier"
            - "${h_status} == ONBOARDING, ${h_v} == 1, ${h_fee_ledger} == 0, ${h_denials} == 0 and ${h_blackout} == 0 - every system and computed field took its declared default"
            - "${rp_earn} == 10 and ${rp_qual} == true - both are derived from rate_category TRANSIENT by the rate-plan derivation, so the submitted 99 is discarded"
            - "${s_nights} == 3, ${s_tier} == BASE and ${s_status} == PENDING_POSTING - all three are derived despite the body asserting otherwise"
            - "${s_base} == 0 and ${s_fee} == 0 - a PENDING_POSTING stay has awarded nothing yet, so the smuggled 7777 and 12345 did not survive"
            - "none of the three calls returned ERR_INVALID_REQUEST - undeclared keys are ignored, not rejected"

