            - "the replacement designation returns HTTP 201 over the freed window, so AuthorizedRepresentative.${rep6_id}.designation_status == DESIGNATED"
            - "GET /brand-protection/representatives?enrollment_id=${enr_id}&designation_status=DESIGNATED returns exactly 3 rows"

      - name: test_buy_cooling_interval_is_closed_so_exactly_seven_days_still_collides
