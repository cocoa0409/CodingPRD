  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_expected_credit_version_on_amendment_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.amendment-create-stale-credit
          - errors.ERR_STALE_CREDIT_VERSION
          - endpoints.POST_/credits/{id}/amendments
        distinguishing_aspect: |
          The §1.2.1 rule amendment-create-stale-credit is exercised on its declared
          write_endpoint with its declared occ_field. One writer reads version v1 and
          drafts amendment A1, which advances the credit to v2. A second draft still
          holding v1 is refused with 412 ERR_STALE_CREDIT_VERSION - a 409 or a silent
          success would both be wrong - and no Amendment row is created. Re-reading
          to v2 and repeating the identical payload succeeds, and the credit's
          version advances again to v3, which shows the check is a comparison
          against the live version rather than a fixed rejection. The supersede
          consequence is the reason the guard exists: the accepted second draft moves
          A1 from DRAFT to SUPERSEDED, so a writer working from a stale view would
          have silently discarded an amendment it never saw.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Standard fixture: applicant Baltic Timber Imports AS (NO, CLEARED), USD facility limit_cents 50000000 collateral_required_pct 0 expiring 2027-06-30, bank Nordkyst Bank NDKBNOKK, beneficiary Riga Sawmill SIA (LV)."
            - "One credit of amount_cents 10000000, SIGHT_PAYMENT, tenor_days 0, tolerance_pct 0, FOB, latest_shipment_date 2026-10-31, expiry_date 2026-11-30, presentation_period_days 21, ISSUED. Its version at that point is captured as v1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Nordkyst Bank", swift_bic: "NDKBNOKK", country_code: "NO", country_risk_score: 12, credit_rating: "AA", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Riga Sawmill SIA", country_code: "LV", nominated_bank_id: "${bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Riga", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { cr_id: $.data.id }
            - call: "POST /credits/${cr_id}/documentary-requirements"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_required: 1, copies_required: 2, issuer_constraint: "Beneficiary", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${cr_id}/documentary-requirements"
              payload: { doc_type: "BILL_OF_LADING", originals_required: 1, copies_required: 1, issuer_constraint: "Carrier", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${cr_id}/submit-for-approval"
              payload: { submission_note: "standard credit" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${cr_id}/approve"
              payload: { decision: "APPROVE", approval_note: "ok" }
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /credits/${cr_id}/issue"
              payload: { issue_note: "issued" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "GET /credits/${cr_id}"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /credits/${cr_id}/amendments"
              payload: { change_set: { latest_shipment_date: "2026-10-15" }, reason: "vessel schedule pulled forward", expected_credit_version: "${v1}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { a1_id: $.data.id }
            - call: "GET /credits/${cr_id}"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_2"
              captures: { v2: $.data.version }
            - call: "POST /credits/${cr_id}/amendments"
              payload: { change_set: { latest_shipment_date: "2026-10-20" }, reason: "second officer, working from a stale read", expected_credit_version: "${v1}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_2"
              captures: { e_stale: $.data.error_id }
            - call: "POST /credits/${cr_id}/amendments"
              payload: { change_set: { latest_shipment_date: "2026-10-20" }, reason: "second officer, after re-reading the credit", expected_credit_version: "${v2}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_2"
              captures: { a2_id: $.data.id }
            - call: "GET /credits/${cr_id}"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_2"
              captures: { v3: $.data.version }
          assert:
            - "trigger call 1 succeeds: Amendment.${a1_id}.status == DRAFT, seq == 1, requires_beneficiary_consent == true"
            - "${v2} == ${v1} + 1 - drafting an amendment advances the parent credit's version"
            - "trigger call 3 returns HTTP 412 and ${e_stale} == ERR_STALE_CREDIT_VERSION"
            - "GET /credits/${cr_id}/amendments returns total_count 1 immediately after trigger call 3 - the stale write created nothing"
            - "the credit's version is still ${v2} after trigger call 3 - a rejected write does not increment it"
            - "trigger call 4 succeeds with the identical change_set and reason: Amendment.${a2_id}.status == DRAFT and seq == 2"
            - "${v3} == ${v2} + 1"
            - "Amendment.${a1_id}.status == SUPERSEDED - the newer draft displaced the older one, which is exactly what the stale writer would have destroyed silently"
            - "GET /credits/${cr_id}/amendments returns total_count 2"

      - name: occ_stale_expected_facility_version_on_collateral_posting_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.collateral-posting-stale-facility
          - errors.ERR_STALE_FACILITY_VERSION
          - calculations.collateral_posted_ledger
        distinguishing_aspect: |
          The second §1.2.1 rule, on a different parent entity and a different
          occ_field. Collateral postings stack additively, so a repeated posting
          would succeed on its own merits and NOTHING in §1.2 or §1.4 could refuse
          it - only the stale expected_facility_version can, which is what makes this
          rule load-bearing rather than decorative. The recipe posts 1000000 at v1
          (accepted, ledger 1000000, version to v2), repeats the identical payload
          still quoting v1 (412 ERR_STALE_FACILITY_VERSION, ledger still 1000000),
          then repeats it quoting v2 (accepted, ledger 2000000). A naive
          implementation that ignored the field would show 3000000 at the end.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Applicant Baltic Timber Imports AS (NO, CLEARED) with a USD facility of limit_cents 50000000, collateral_required_pct 40, facility_expiry_date 2027-06-30, collateral_posted_cents 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 40, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id, fv1: $.data.version }
          trigger:
            - call: "POST /facilities/${fac_id}/collateral-postings"
              payload: { amount_cents: 1000000, expected_facility_version: "${fv1}", posting_note: "first cash margin" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { posted_1: $.data.collateral_posted_cents, fv2: $.data.version }
            - call: "POST /facilities/${fac_id}/collateral-postings"
              payload: { amount_cents: 1000000, expected_facility_version: "${fv1}", posting_note: "second officer replaying a stale read" }
              as: CreditOfficer
              as_user_id: "co_2"
              captures: { e_stale: $.data.error_id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_2"
              captures: { posted_mid: $.data.collateral_posted_cents, fv_mid: $.data.version }
            - call: "POST /facilities/${fac_id}/collateral-postings"
              payload: { amount_cents: 1000000, expected_facility_version: "${fv_mid}", posting_note: "second officer after re-reading" }
              as: CreditOfficer
              as_user_id: "co_2"
              captures: { posted_2: $.data.collateral_posted_cents, fv3: $.data.version }
          assert:
            - "${posted_1} == 1000000 and ${fv2} == ${fv1} + 1"
            - "trigger call 2 returns HTTP 412 and ${e_stale} == ERR_STALE_FACILITY_VERSION"
            - "${posted_mid} == 1000000 and ${fv_mid} == ${fv2} - the refused posting neither moved the ledger nor the version"
            - "trigger call 4 succeeds: ${posted_2} == 2000000 and ${fv3} == ${fv2} + 1"
            - "CreditFacility.${fac_id}.allocated_cents == 0 and available_cents == 50000000 - collateral is not exposure"

      - name: cascading_side_effects_four_level_chain_from_issuance_to_sibling_credits
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/credits/{id}/issue
          - state_machines.CreditFacility
          - state_machines.DocumentaryCredit
        excluded_because:
          difficulty_instance: issue_credit_depth4_facility_suspension_holds_sibling_credits
          rationale: |
            The cascading_side_effects layer asks for an N-level chain verified
            end-to-end with ordering sensitivity. The §1.8 transitive_cascade
            instance already walks the full depth-4 chain from POST
            /credits/{id}/issue (allocation row -> facility allocated_cents ->
            threshold breach suspending the facility -> sibling APPROVED credits
            forced to ON_HOLD) and asserts each hop separately, including that hop 4
            cannot be reached without hop 3. Repeating it here would duplicate the
            same call sequence and the same literals.

      - name: dual_variant_calculation_delta_on_switch_between_provisional_and_committed
        claim_type: dual_variant_calculation
        grounds:
          - calculations.credit_allocation_exposure
        excluded_because:
          difficulty_instance: facility_allocation_provisional_vs_committed
          rationale: |
            The dual_variant_calculation layer asks that both variants produce the
            expected results and that the delta on switching is correct. The §1.8
            dual_variant_calc instance already computes provisional_draft (tolerance
            and tenor forced to zero, nothing written to the facility) and
            committed_issuance on the same credit and asserts the exact difference
            between the two allocation figures, so the layer claim is fully
            discharged there.

      - name: selector_policy_confirming_bank_auto_selection_then_an_empty_eligible_pool
        claim_type: selector_policy
        grounds:
          - calculations.confirming_bank_selection
          - errors.ERR_NO_ELIGIBLE_CONFIRMING_BANK
          - endpoints.POST_/credits/{id}/confirmation-requests
        distinguishing_aspect: |
          The selector_policy layer has two halves and both must hold. With
          confirming_bank_id omitted the server must apply the whole policy itself:
          Sydbanken (SE, risk 10, AA) scores (100-10)*6 + 100*4 = 940 and Oresund
          Handelsbank (DK, risk 25, A) scores (100-25)*6 + 75*4 = 750, so the credit
          is sent to the higher score - the request must NOT simply take the
          beneficiary's nominated bank, and it must not take the first row created.
          On the second credit the beneficiary sits in SE, which excludes Sydbanken by
          the same-country rule, Oresund is SUSPENDED and Nordkyst is SUSPENDED too,
          so the eligible pool is empty and the answer is 422
          ERR_NO_ELIGIBLE_CONFIRMING_BANK rather than a null confirming bank or a
          500.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Applicant Baltic Timber Imports AS (NO, CLEARED) with a USD facility of limit_cents 50000000, collateral_required_pct 0, expiring 2027-06-30."
            - "Three banks: Nordkyst Bank NDKBNOKK (NO, risk 12, AA, appetite 90000000) which advises both credits, Sydbanken SYDBSESS (SE, risk 10, AA, appetite 90000000) scoring 940, and Oresund Handelsbank ORHBDKKK (DK, risk 25, A, appetite 90000000) scoring 750."
            - "Beneficiary B1 Riga Sawmill SIA (LV) nominates Nordkyst; beneficiary B2 Malmo Timber AB (SE) also nominates Nordkyst."
            - "Two credits are issued off the facility, C1 to B1 and C2 to B2, each amount_cents 10000000, SIGHT_PAYMENT, tenor_days 0, tolerance_pct 0, FOB, latest_shipment_date 2026-10-31, expiry_date 2026-11-30, presentation_period_days 21, so each confirmation window is [2026-08-10, 2026-12-21)."
            - "After both credits are issued, Oresund and Nordkyst are PATCHed to status SUSPENDED - a suspension does not retroactively unwind an issued credit, but it does remove the bank from later selection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Nordkyst Bank", swift_bic: "NDKBNOKK", country_code: "NO", country_risk_score: 12, credit_rating: "AA", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { nordkyst_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Sydbanken", swift_bic: "SYDBSESS", country_code: "SE", country_risk_score: 10, credit_rating: "AA", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { syd_id: $.data.id, syd_score: $.data.eligibility_score }
            - call: "POST /banks"
              payload: { bank_name: "Oresund Handelsbank", swift_bic: "ORHBDKKK", country_code: "DK", country_risk_score: 25, credit_rating: "A", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { ore_id: $.data.id, ore_score: $.data.eligibility_score }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Riga Sawmill SIA", country_code: "LV", nominated_bank_id: "${nordkyst_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben1_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Malmo Timber AB", country_code: "SE", nominated_bank_id: "${nordkyst_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben2_id: $.data.id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben1_id}", facility_id: "${fac_id}", advising_bank_id: "${nordkyst_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Riga", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { c1_id: $.data.id }
            - call: "POST /credits/${c1_id}/documentary-requirements"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_required: 1, copies_required: 2, issuer_constraint: "Beneficiary", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${c1_id}/submit-for-approval"
              payload: { submission_note: "C1" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${c1_id}/approve"
              payload: { decision: "APPROVE", approval_note: "ok" }
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /credits/${c1_id}/issue"
              payload: { issue_note: "C1 issued" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben2_id}", facility_id: "${fac_id}", advising_bank_id: "${nordkyst_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Malmo", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { c2_id: $.data.id }
            - call: "POST /credits/${c2_id}/documentary-requirements"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_required: 1, copies_required: 2, issuer_constraint: "Beneficiary", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${c2_id}/submit-for-approval"
              payload: { submission_note: "C2" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${c2_id}/approve"
              payload: { decision: "APPROVE", approval_note: "ok" }
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /credits/${c2_id}/issue"
              payload: { issue_note: "C2 issued" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "PATCH /banks/${ore_id}"
              payload: { status: "SUSPENDED" }
              as: ComplianceOfficer
              as_user_id: "cmp_1"
            - call: "PATCH /banks/${nordkyst_id}"
              payload: { status: "SUSPENDED" }
              as: ComplianceOfficer
              as_user_id: "cmp_1"
          trigger:
            - call: "POST /credits/${c1_id}/confirmation-requests"
              payload: { request_note: "please pick the best correspondent yourselves" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { picked: $.data.confirming_bank_id, conf_status: $.data.confirmation_status }
            - call: "POST /credits/${c2_id}/confirmation-requests"
              payload: { request_note: "same again on the Malmo credit" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { e_empty_pool: $.data.error_id }
          assert:
            - "${syd_score} == 940 and ${ore_score} == 750"
            - "trigger call 1 succeeds: ${picked} == ${syd_id} and ${conf_status} == CONFIRMATION_REQUESTED"
            - "${picked} != ${nordkyst_id} - the nominated advising bank is not automatically the confirming bank"
            - "${picked} != ${ore_id} - the lower weighted score loses even though Oresund is in a third country"
            - "trigger call 2 returns HTTP 422 and ${e_empty_pool} == ERR_NO_ELIGIBLE_CONFIRMING_BANK"
            - "DocumentaryCredit.${c2_id}.confirming_bank_id is null and confirmation_status == UNCONFIRMED"
            - "DocumentaryCredit.${c1_id}.confirmation_charge_cents == 0 - the charge is priced on the response, not the request"

      - name: ops_run_checkpoint_second_sweep_at_the_same_clock_reports_all_zeros
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints.POST_/_ops/run-expiry-sweep
          - state_machines.Presentation
          - state_machines.WaiverRequest
        distinguishing_aspect: |
          The ops_run_checkpoint layer requires the sweep to be a checkpoint rather
          than a mutation that can be replayed. Run once at 2026-08-18 the sweep
          reports presentations_precluded 1 and waiver_requests_expired 1; run again
          at the SAME logical clock it must report every counter as 0 and change
          nothing, because the rows it would have moved are no longer in the eligible
          set. The dry_run call before it proves the reverse property: it reports the
          same non-zero counters the real run will produce and yet leaves the
          presentation UNDER_EXAMINATION - so a reader cannot tell dry_run from the
