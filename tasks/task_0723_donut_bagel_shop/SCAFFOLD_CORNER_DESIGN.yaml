        distinguishing_aspect: "Refunding a PAID order restores BakeBatch.remaining_qty to its pre-sale value (compensation reconciles the derived field)."
        test_recipe:
          setup: ["a PAID 12-GLAZED order on a SELLING day; batch baked 30 (remaining 18 after sale)"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
