      - name: loan_completes_the_workout_correction_cycle_and_re_enters_special_servicing
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Loan.IN_WORKOUT_to_CORRECTED
          - state_machines.Loan.CORRECTED_to_MASTER_SERVICING
          - entities.Loan.fields.correction_source_plan_id
        distinguishing_aspect: "The servicing dimension is cyclic, not linear: a loan walks MASTER_SERVICING -> SPECIAL_SERVICING -> IN_WORKOUT -> CORRECTED -> MASTER_SERVICING and then back into SPECIAL_SERVICING on a fresh transfer event. The loop is not a reset — correction_source_plan_id keeps the executed plan forever while active_workout_plan_id is cleared, and the second transfer rewrites transferred_to_special_on and the 60-day plan deadline from the new clock."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, then moved to 2026-09-01T00:00:00Z before the second transfer."
            - "Loan with current_principal_balance_usd 10,000,000.00 under a trust with a 40,000,000.00 controlling class balance."
            - "A fresh ACCEPTED UPDATE appraisal so the plan may be EXECUTED, a MODIFICATION plan carried to EXECUTED, and three recorded timely payments."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V8", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V08", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 9000000, as_of_date: "2026-08-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "GET /special-servicing/loans/${loan_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { loan_version: "$.data.version" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_id}", discount_rate_pct: 9.5, npv_basis: "CONTRACTUAL", expected_loan_version: "${loan_version}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
