            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-10T00:00:00Z" }
              as: PricingAnalyst
          trigger:
            - call: "POST /zone-executions/${exec1_id}/post-signage"
              payload: {}
              as: StoreManager
              as_user_id: "${store_0101_id}"
            - call: "POST /zone-executions/${exec1_id}/verify-signage"
              payload: {}
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { err_verify: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-16T00:00:00Z" }
              as: PricingAnalyst
            - call: "POST /zone-executions/${exec1_id}/apply"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { err_apply: $.data.error_id }
          assert:
            - "The post-signage call returns HTTP 200 with signage_status == NON_COMPLIANT, posted_at == '2026-11-10T00:00:00.000Z' and posted_by_user_id == ${store_0101_id}"
            - "The verify-signage call returns HTTP 409 with data.error_id == 'ERR_SIGNAGE_NOT_POSTED' (NON_COMPLIANT is terminal on the signage dimension)"
            - "The apply call returns HTTP 409 with data.error_id == 'ERR_SIGNAGE_NOT_VERIFIED' even though the clock has reached the effective date"
            - "ZoneExecution.${exec1_id}.status == SCHEDULED, line_markdown_cents == 0 and verified_by_user_id null"
            - "Item.${item_a_id}.current_retail_cents == 4999 and MarkdownStep.${step1_id}.status == SCHEDULED"
      - name: parallel_lifecycle_and_markdown_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Item.lifecycle_stage
          - state_machines.Item.markdown_state
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / item_lifecycle_and_markdown_dimensions_advance_independently
          rationale: "The named §1.8 instance drives both Item dimensions through six combined states and asserts each pair, which is exactly this row's claim."
      - name: compensation_rollback_reverses_every_apply_side_effect
        claim_type: Compensation
        grounds:
          - state_machines.ZoneExecution.APPLIED_to_ROLLED_BACK
          - calculations.markdown_liability_line
        excluded_because:
          difficulty_instance: compensating_invariant / roll_back_restores_margin_exposure_ticket_and_reservations
          rationale: "The named §1.8 instance asserts the ticket, the reserve, the plan totals, the step and the reservations all return to their pre-apply values."
      - name: bubble_up_committed_units_open_the_exit_window
        claim_type: Bubble up
        grounds:
          - state_machines.Season.ACTIVE_to_EXIT_WINDOW
          - global_constants.EXIT_WINDOW_TRIGGER_PCT
        excluded_because:
          difficulty_instance: transitive_cascade / apply_cascade_commits_reservations_and_opens_exit_window
          rationale: "The named §1.8 instance walks all five hops from apply to the Season's auto EXIT_WINDOW transition at the exact threshold."
      - name: guarded_disposition_approval_depends_on_the_season_state
        claim_type: guarded transitions
        grounds:
          - state_machines.DispositionOrder.DRAFT_to_APPROVED
          - validations[priority=9]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / disposition_approve_blocked_while_season_still_active
          rationale: "The named §1.8 instance is precisely the cross-entity guard: the order is DRAFT and eligible, only the Season's status blocks."
      - name: cyclic_negotiation_loops_until_the_round_cap
        claim_type: cyclic
        grounds:
          - state_machines.VendorAllowanceAgreement.PROPOSED_to_COUNTERED
          - entities.VendorAllowanceAgreement.fields.round_index
        excluded_because:
          difficulty_instance: non_linear_state_machine / allowance_negotiation_alternates_offer_owner_across_rounds
          rationale: "The named §1.8 instance loops PROPOSED -> COUNTERED -> COUNTERED and asserts the alternating offer owner per round."
      - name: ledger_sync_recognition_updates_agreement_and_plan
        claim_type: Ledger sync
        grounds:
          - state_machines.VendorClaim.SUBMITTED_to_RECOGNIZED
          - calculations.vendor_funding_recognition
        excluded_because:
          difficulty_instance: transitive_cascade / claim_recognition_cascade_funds_agreement_and_rejects_sibling
          rationale: "The named §1.8 instance asserts the recognized claim, the agreement cap, the plan's net markdown and the rejected sibling in one cascade."

  - section: calculations
    instances:
      - name: sell_through_and_weeks_of_supply_round_half_up_at_two_decimals
        claim_type: Precision
        grounds:
          - entities.Item.fields.sell_through_pct
          - entities.Item.fields.weeks_of_supply
          - entities.Item.fields.sample_weeks
          - calculations.lifecycle_stage_classification.precision
        distinguishing_aspect: |
          Both item aggregates are exact-quotient traps: 257/600 is 42.8333... and 343/64.25 is 5.33852...,
          so a truncating implementation reports 42.83/5.33 while round_half_up at two decimals must report
          42.83/5.34 - and weeks_of_supply must round the weekly rate at FOUR decimals before dividing.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is ACTIVE (category APPAREL, exit_target_date 2027-01-15)"
            - "Item A-1001 was received 2026-08-20 with 600 units at 4999c and unit cost 2000c; no sales weeks are posted yet"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { season_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "A-1001", season_id: "${season_id}", category: "APPAREL", cluster_code: "CL-W1", vendor_code: "VN-100", first_receipt_date: "2026-08-20", original_retail_cents: 4999, unit_cost_cents: 2000, units_received_total: 600 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_a_id: $.data.id }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: MerchandiseDirector
              as_user_id: "md-1"
          trigger:
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-05", units_sold: 60, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-12", units_sold: 55, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-19", units_sold: 68, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-26", units_sold: 74, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "GET /items/${item_a_id}"
              payload: {}
              as: PricingAnalyst
          assert:
            - "Item.${item_a_id}.units_sold_total == 257 (60 + 55 + 68 + 74) and sample_weeks == 4"
            - "Item.${item_a_id}.on_hand_units == 343 (600 - 257 - 0)"
            - "Item.${item_a_id}.sell_through_pct == 42.83 - the exact quotient is 42.83333, so truncation would also give 42.83 but a 1-decimal or 0-decimal result is wrong"
            - "Item.${item_a_id}.weeks_of_supply == 5.34 - avg_weekly_units_sold is round_half_up(257/4, 4) == 64.25 and 343/64.25 == 5.338521..., which truncation would report as 5.33"
            - "GET /items/${item_a_id}/sales-weeks returns total_count == 4 ordered by week_ending_date ASC"
      - name: ladder_prices_round_the_discount_before_subtracting
        claim_type: Correct Result
        grounds:
          - calculations.markdown_step_price
          - entities.MarkdownStep.fields.price_cents
          - entities.MarkdownStep.fields.window_end_date_exclusive
          - global_constants.MIN_CADENCE_DAYS
        distinguishing_aspect: |
          Every rung is priced off original_retail_cents 4999 with the discount rounded first: 22.57 -> 3871,
          32.50 -> 3374, 35.00 -> 3249 and 50.00 -> 2499. Rounding the resulting price instead of the discount
          makes the 50.00 rung 2500, and compounding depths off current_retail_cents makes every rung wrong.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is ACTIVE and item A-1001 (original_retail_cents 4999) is AGING with a CERTIFIED estimate"
            - "A PERMANENT plan exists with exit_date_target 2027-01-15 and an empty ladder; the clock stands at 2026-10-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
