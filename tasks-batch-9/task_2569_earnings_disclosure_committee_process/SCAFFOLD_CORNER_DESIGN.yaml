              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cycle_v: $.data.version }
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "EARNINGS_RELEASE", title: "Q2 FY2026 Earnings Release", author_member_id: "${fin_id}", safe_harbor_present: true, expected_cycle_version: "${cycle_v}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /disclosure/documents/${doc_id}/adjusted-measures"
              payload: { measure_label: "Adjusted EBITDA", adjusted_value: 1200.50, comparable_gaap_value: 1000.00, reconciliation_items: [{ label: "Restructuring", amount: 150.25 }, { label: "Impairment", amount: 50.25 }], adjusted_prominence_index: 2, gaap_prominence_index: 1 }
              as: Controller
