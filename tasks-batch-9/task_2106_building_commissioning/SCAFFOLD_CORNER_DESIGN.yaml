          - roles.CxAuthority
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Submittal review is exclusive to CxAuthority under the peer split, so the DesignTeam that lodged the submittal cannot approve it and answers 403 ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup:
