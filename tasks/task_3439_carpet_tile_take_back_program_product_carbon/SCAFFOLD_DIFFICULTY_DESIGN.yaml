              payload: { collection_id: "${col_id}", report_id: "${rep1}", claim_type: "CARBON_NEGATIVE", claimed_volume_m2: 10, boundary: "CRADLE_TO_GRAVE", manufacturing_target_id: "${tgt2}" }
              as: SustainabilityManager
