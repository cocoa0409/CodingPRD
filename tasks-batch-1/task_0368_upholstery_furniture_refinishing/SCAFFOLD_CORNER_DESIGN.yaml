            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${v_est}" }
              as: Estimator
            - call: "GET /work-orders/${wo_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v_appr: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${v_appr}", deposit_amount_cents: 25500 }
