      - name: improvement_plan_links_to_its_funding_expenditure_and_both_ends_are_validated
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /cte/performance-indicators/{id}/improvement-plans]
          - endpoints[POST /cte/improvement-plans/{id}/submit]
          - endpoints[POST /cte/improvement-plans/{id}/accept]
          - validations[priority=31]
          - validations[priority=32]
          - validations[priority=9]
          - errors[ERR_PLAN_FUNDING_INVALID]
          - errors[ERR_MILESTONES_INSUFFICIENT]
          - errors[ERR_INVALID_PLAN_STATE]
        distinguishing_aspect: |
          The link between an ImprovementPlan and the Expenditure that funds it is validated at BOTH ends and at BOTH
          write points. Priority 32 is checked on create, so a plan pointing at a line that is neither
          CERTIFIED nor OBLIGATED — here a BLOCKED one — never comes into existence; priority 31 is checked only on submit, so a two-milestone plan is created happily and refused later;
          and once a plan is SUBMITTED the generic state check at priority 9 owns a second submit. The sibling plan left
          in DRAFT throughout proves none of the three refusals leaked into the other row.
        test_recipe:
          setup:
            - "One ProgramOfStudy in approval_status SUSPENDED, one GrantAward for fiscal_year 2027 with allocation_cents 5000000, one CERTIFIED CONSUMABLE Expenditure of gross 100000 on it, and one further CONSUMABLE Expenditure that the suspension cascade moved from REQUESTED to BLOCKED."
            - "A cohort of five CONCENTRATOR Students in cohort_year 2026 of whom two hold VERIFIED attainments, so the final actual is 40.00."
            - "One PerformanceIndicator 4S1_CREDENTIAL / 2027 / cohort 2026 with negotiated_level_pct 90.00 and met_threshold_pct 81.00, closed twice so consecutive_miss_count is 2 and status is IMPROVEMENT_REQUIRED."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
