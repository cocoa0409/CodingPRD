          - endpoints["GET /purchases"]
          - errors[ERR_OFFER_NOT_FOUND]
          - errors[ERR_PLAYER_NOT_FOUND]
        distinguishing_aspect: |
          A purchase demands that both referenced rows exist before any link is made: an unknown
          offer_id yields ERR_OFFER_NOT_FOUND, an unknown player_id yields ERR_PLAYER_NOT_FOUND,
