            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-06", window_start: "09:00", window_end: "09:30" }, as: ProgramCoordinator, captures: { a7: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/call-assignments/${a1}/call-logs", payload: { called_at: "2026-08-03T09:05:00Z", duration_seconds: 300, outcome: "REACHED_CONCERN", concern_level: "ROUTINE", concern_categories: ["MOOD"] }, as: VolunteerCaller, as_user_id: "${v_id}" }
            - { call: "POST /api/call-assignments/${a2}/call-logs", payload: { called_at: "2026-08-03T10:05:00Z", duration_seconds: 0, outcome: "NO_ANSWER" }, as: VolunteerCaller, as_user_id: "${v_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T11:00:00Z" }, as: ProgramCoordinator }
