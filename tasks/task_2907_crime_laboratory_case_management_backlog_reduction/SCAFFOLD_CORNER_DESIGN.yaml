              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.50, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0108", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed packet one", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "2", item_description: "Sealed packet two", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e2: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 2 }
              as: CaseManager
              captures: { r1: $.data.id }
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e2}", method_id: "${m1}", item_count: 2 }
              as: CaseManager
              captures: { r2: $.data.id, r2_v: $.data.version }
            - call: "POST /lab/examination-requests/${r2}/assignments"
