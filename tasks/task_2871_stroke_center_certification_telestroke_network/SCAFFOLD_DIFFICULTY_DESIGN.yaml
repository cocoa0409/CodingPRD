      - 'BASELINE captured at report creation: ${base_count} == 1, ${base_dtn} == 100.00, ${base_dti} == 0.00, ${base_tele} == 0.00, ${base_mean} == 0.00, ${base_closed} == 1, ${base_major} == 0 and ${base_variant} == PROVISIONAL'
      - 'PERTURBATION: the new abstraction auto-attaches even though case B is still open — ${b_report} == ${ir}, ${b_status} == DRAFT, ${b_variant} == PROVISIONAL, ${b_num} == false (70 > DTN_TARGET_MIN 60) and ${b_den} == true (the PROVISIONAL variant keeps excluded rows in the denominator)'
      - 'PERTURBED LEDGER: ${mid_count} == 2 and ${mid_dtn} == 50.00 — one numerator over a denominator of two'
      - '${mid_mean} == 0.00 and ${mid_closed} == 1 even at the perturbed point: mean_dtn_excess_pct pools only FINALIZED STK_DTN_60 rows and case B is still open, so the 70-minute case contributes nothing'
      - 'COMPENSATION: ${ret_status} == RETRACTED and ${ret_report} == null'
      - 'RESTORED EXACTLY: ${fin_count} == ${base_count} == 1, ${fin_dtn} == ${base_dtn} == 100.00, ${fin_dti} == ${base_dti} == 0.00, ${fin_tele} == ${base_tele} == 0.00 and ${fin_variant} == ${base_variant} == PROVISIONAL — no drift, and in particular the rate is NOT left at 50.00 and NOT reset to 0.00'
      - ${fin_mean} == ${base_mean} == 0.00 and ${fin_closed} == ${base_closed} == 1 and ${fin_major} == ${base_major} == 0 — the two control quantities never moved in either direction
      - 'QualityMeasureAbstraction.${ia_a} is untouched by the compensation: status FINALIZED, report_id ${ir}, variant CERTIFIED, numerator_flag true'
      - 'CodeStrokeCase.${ib_id} is untouched too: still THROMBOLYSIS_ADMINISTERED with door_to_needle_minutes 70 and deviation_count 1, whose single DTN_EXCEEDED deviation is still OPEN rather than SUBSTANTIATED'
      - the (case_id, measure_code) pair is freed, so creating a fresh STK_DTN_60 abstraction on case B succeeds and drives the ledger back to (2, 50.00) — proving the restoration was a recomputation and not a permanent exclusion
  - name: consult_load_conserved_across_decline_reroute_and_completion
    grounds:
    - state_machines.TelestrokeConsult ASSIGNED -> REQUESTED -> ASSIGNED (decline and re-route)
    - state_machines.Neurologist ON_CALL <-> IN_CONSULT
    - calculations.consult_routing_selection (roster_rank ASC, excluded_neurologist_ids)
    - validations priority 70 -> ERR_AGREEMENT_CONSULT_CAPACITY (the agreement counter's definition)
    - endpoints.POST /stroke-network/consults/{id}/decline
    - endpoints.POST /stroke-network/consults/{id}/complete
    distinguishing_aspect: 'A COMPLETELY DIFFERENT conserved quantity: the network-wide consult LOAD rather than a report ledger, and it is conserved across a re-assignment rather than restored by an undo. PINNED FORMULA, checked at three separate observation points: sum over all Neurologist rows of active_consult_count == count of TelestrokeConsult rows whose status IS IN {ASSIGNED, IN_SESSION}; and independently SpokeAgreement.active_consult_count == count of that agreement''s consults whose status IS IN {REQUESTED, ASSIGNED, IN_SESSION}. The decline must move exactly one unit from one neurologist to another with no double-count and no leak, and the completion must retire that unit from BOTH sides of the identity at once. A monotone counter, or a decrement that is skipped because the decliner was never the accepter, breaks the identity while every individual state value still looks plausible.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; hub, spoke and an ACTIVE TIER_1_FULL agreement with max_concurrent_consults 3.
      - 'TWO board-certified ON_CALL Neurologists at the hub, both with GRANTED CONSULT_AND_THROMBOLYSIS proxy credentials: N1 with roster_rank 10 and N2 with roster_rank 20, so N1 always wins the ranking.'
      - One CodeStrokeCase at the spoke, door_at 08:00:00Z, imaging complete 08:10:00Z.
      - One consult requested at 08:16:00Z, which routes to N1 by roster rank. OBSERVATION POINT 1 is captured here from both neurologists and the agreement.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          hub_id: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          spoke_id: $.data.id
      - call: POST /stroke-network/spoke-agreements
        payload:
          hub_center_id: ${hub_id}
          spoke_center_id: ${spoke_id}
          coverage_tier: TIER_1_FULL
          max_concurrent_consults: 3
          effective_from: '2026-08-01T00:00:00Z'
          effective_until: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
        captures:
          agr_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/activate
        payload: {}
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists
        payload:
          full_name: Dr Nora Ainsley
          home_center_id: ${hub_id}
          licensed_state_codes:
          - CA
          board_certified: true
          roster_rank: 10
          concurrent_consult_limit: 2
        as: ProgramCoordinator
        captures:
          n1_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/proxy-credentials
        payload:
          neurologist_id: ${n1_id}
          privilege_scope: CONSULT_AND_THROMBOLYSIS
          expires_at: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists/${n1_id}/on-call-state
        payload:
          on_call_state: ON_CALL
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists
        payload:
          full_name: Dr Owen Barlowe
          home_center_id: ${hub_id}
          licensed_state_codes:
          - CA
          board_certified: true
          roster_rank: 20
          concurrent_consult_limit: 2
        as: ProgramCoordinator
        captures:
          n2_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/proxy-credentials
        payload:
          neurologist_id: ${n2_id}
          privilege_scope: CONSULT_AND_THROMBOLYSIS
          expires_at: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists/${n2_id}/on-call-state
        payload:
          on_call_state: ON_CALL
        as: ProgramCoordinator
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${spoke_id}
          patient_ref: P-CV-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
