            - "${agr_status} == ACTIVE and ${inv1_variant} == net_settlement"
            - "${inv1_lines} == 1, ${inv1_recv} == 2150, ${inv1_net} == -2150 and ${inv1_dir} == RECEIVABLE — a negative net flips the direction"
