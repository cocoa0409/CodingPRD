        default: "DRAFT"
        constraints: "enum: DRAFT | CONFIRMED | GUARANTEED | FULFILLED | CANCELLED"
      - name: settlement_status
        type: enum
        source: system
        description: "Money dimension. Evolves independently of lifecycle_status on the same row."
        default: "UNBILLED"
        constraints: "enum: UNBILLED | DEPOSIT_HELD | INVOICED | SETTLED | REFUNDED | FORFEITED"
      - name: provisional_total_cents
        type: integer
        source: computed
        description: "Estimated grand total computed at confirmation from booked_headcount; see calc order_grand_total (variant provisional)."
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Invoiced grand total computed at invoicing from the guarantee floor; see calc order_grand_total (variant final). Null until INVOICED."
        default: null
