              as: IRDirector
              as_user_id: "director-1"
          assert:
            - "EditCheck.${ec1}.check_code == \"PY_VAR_FTE_ENROLLMENT\", severity == WARNING, variance_pct == 12.5, sequence_no == 1"
            - "EditCheck.${ec2}.check_code == \"PY_VAR_TOTAL_HEADCOUNT\", severity == FATAL, variance_pct == 30.0, sequence_no == 2"
            - "First call: HTTP status == 422, response.error_id == \"ERR_WAIVER_NOT_PERMITTED\", EditCheck.${ec2}.status == EXPLAINED"
            - "SurveyComponent.${comp}.fatal_open_count == 1 while the fatal check is still EXPLAINED"
            - "Second call: HTTP status == 200 and EditCheck.${ec1}.status == WAIVED"
            - "Third call: HTTP status == 200 and EditCheck.${ec2}.status == ACCEPTED"
            - "SurveyComponent.${comp}.edit_status == CLEARED and fatal_open_count == 0"
            - "Certify: HTTP status == 200 and prep_status == CERTIFIED"

      - name: corner_val_reconciliation_needs_a_federal_counterpart_with_a_non_zero_base
