  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: venue_half_open_interval_with_forward_turnover_buffer
        grounds:
          - validations[priority=22]
          - errors[ERR_VENUE_TURNOVER_CONFLICT]
          - entities.Venue.fields.turnover_buffer_minutes
          - entities.ProgramElement.fields.starts_at
          - entities.ProgramElement.fields.ends_at
        distinguishing_aspect: |
          The contended resource is the Venue and the interval semantics are half-open [starts_at, ends_at)
          with the buffer applied FORWARD from the incumbent only: against an incumbent 14:00Z-16:00Z with a
          90-minute buffer, a candidate ending exactly at 14:00Z is ACCEPTED, a candidate starting 17:00Z is
          REJECTED, and a candidate starting exactly at 17:30Z (= ends_at + buffer) is ACCEPTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one Venue with capacity_reception 400 and turnover_buffer_minutes 90; APPROVED Supplier."
            - "Program 2026-09-10..2026-09-14, still DRAFT."
            - "One incumbent ACTIVITY element at that venue 2026-09-11T14:00Z..16:00Z with planned/guaranteed 30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/venues"
              payload: { name: "Foundry Studio", capacity_seated: 200, capacity_reception: 400, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Foundry Creative Studio", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Ravel Apparel", group_name: "Buyer Roadshow", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 30, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Incumbent Workshop", starts_at: "2026-09-11T14:00:00Z", ends_at: "2026-09-11T16:00:00Z", planned_headcount: 30, guaranteed_headcount: 30, per_person_cost_cents: 4000, is_weather_dependent: false, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { el_incumbent: $.data.id }
            - call: "GET /dmc/programs/${prog_id}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v2: $.data.version }
          trigger:
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Touching Predecessor", starts_at: "2026-09-11T12:00:00Z", ends_at: "2026-09-11T14:00:00Z", planned_headcount: 30, guaranteed_headcount: 30, per_person_cost_cents: 4000, is_weather_dependent: false, expected_program_version: "${prog_v2}" }
              as: ProgramDirector
              captures: { el_touch_before: $.data.id }
            - call: "GET /dmc/programs/${prog_id}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v3: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Inside Buffer", starts_at: "2026-09-11T17:00:00Z", ends_at: "2026-09-11T19:00:00Z", planned_headcount: 30, guaranteed_headcount: 30, per_person_cost_cents: 4000, is_weather_dependent: false, expected_program_version: "${prog_v3}" }
              as: ProgramDirector
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Exactly At Buffer Edge", starts_at: "2026-09-11T17:30:00Z", ends_at: "2026-09-11T19:30:00Z", planned_headcount: 30, guaranteed_headcount: 30, per_person_cost_cents: 4000, is_weather_dependent: false, expected_program_version: "${prog_v3}" }
              as: ProgramDirector
              captures: { el_buffer_edge: $.data.id }
          assert:
            - "the first trigger call returns HTTP 201 (candidate ends_at 14:00Z equals the incumbent starts_at and is accepted)"
            - "the third trigger call returns HTTP 409 with data.error_id == ERR_VENUE_TURNOVER_CONFLICT"
            - "the fourth trigger call returns HTTP 201 (candidate starts_at 17:30Z equals incumbent ends_at plus the 90-minute buffer and is accepted)"
            - "Program.${prog_id}.element_count == 3"
            - "Program.${prog_id}.open_element_count == 3"

      - name: staff_closed_interval_touching_shifts_collide
        grounds:
          - validations[priority=23]
          - validations[priority=24]
          - errors[ERR_STAFF_ASSIGNMENT_OVERLAP]
          - entities.StaffMember.fields.min_rest_minutes
          - entities.StaffAssignment.fields.starts_at
          - entities.StaffAssignment.fields.ends_at
        distinguishing_aspect: |
          The contended resource is the StaffMember and the interval semantics are CLOSED
          [starts_at, ends_at] with no buffer: against a confirmed 08:00Z-12:00Z shift a candidate starting
          exactly at 12:00Z is REJECTED with ERR_STAFF_ASSIGNMENT_OVERLAP — the opposite adjacency verdict
          from venue_half_open_interval_with_forward_turnover_buffer — while 12:01Z is accepted; the staff
          member's min_rest_minutes is pinned to 0 so the rest rule cannot mask the overlap rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Program 2026-09-10..2026-09-14; one SHUTTLE_LOOP TransportSegment on it."
            - "One ACTIVE GREETER StaffMember with pay_rate_cents_per_hour 3000, min_rest_minutes 0, max_daily_minutes 720 and credentials valid through 2027."
            - "That staff member has a CONFIRMED 2026-09-11T08:00Z..12:00Z shift (240 minutes), so confirmed_minutes_total == 240."
            - "Two further PROPOSED shifts for the same staff member: 2026-09-11T12:00Z..14:00Z (touching) and 2026-09-11T12:01Z..14:00Z (119 minutes, one minute clear)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/programs"
              payload: { client_name: "Ironbark Mining", group_name: "Investor Site Visit", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 45, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/transport-segments"
              payload: { program_id: "${prog_id}", segment_type: "SHUTTLE_LOOP", vehicle_code: "SHUT-11", origin: "Host Hotel", destination: "Site Gate", depart_at: "2026-09-11T08:00:00Z", arrive_at: "2026-09-11T14:00:00Z", seat_capacity: 45, wheelchair_accessible: true }
              as: OperationsCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /dmc/staff-members"
              payload: { full_name: "Rowan Keane", role_type: "GREETER", badge_expires_on: "2027-06-30", first_aid_expires_on: "2027-12-31", pay_rate_cents_per_hour: 3000, min_rest_minutes: 0, max_daily_minutes: 720, status: "ACTIVE" }
              as: ProgramDirector
              captures: { staff_id: $.data.id }
            - call: "POST /dmc/staff-assignments"
              payload: { staff_id: "${staff_id}", program_id: "${prog_id}", target_type: "SEGMENT", segment_id: "${seg_id}", role_type: "GREETER", starts_at: "2026-09-11T08:00:00Z", ends_at: "2026-09-11T12:00:00Z" }
              as: ProgramDirector
              captures: { asg_incumbent: $.data.id }
            - call: "POST /dmc/staff-assignments/${asg_incumbent}/confirm"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/staff-assignments"
              payload: { staff_id: "${staff_id}", program_id: "${prog_id}", target_type: "SEGMENT", segment_id: "${seg_id}", role_type: "GREETER", starts_at: "2026-09-11T12:00:00Z", ends_at: "2026-09-11T14:00:00Z" }
              as: ProgramDirector
              captures: { asg_touch: $.data.id }
            - call: "POST /dmc/staff-assignments"
              payload: { staff_id: "${staff_id}", program_id: "${prog_id}", target_type: "SEGMENT", segment_id: "${seg_id}", role_type: "GREETER", starts_at: "2026-09-11T12:01:00Z", ends_at: "2026-09-11T14:00:00Z" }
              as: ProgramDirector
              captures: { asg_clear: $.data.id }
          trigger:
            - call: "POST /dmc/staff-assignments/${asg_touch}/confirm"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/staff-assignments/${asg_clear}/confirm"
              payload: {}
              as: ProgramDirector
          assert:
            - "the first trigger call returns HTTP 409 with data.error_id == ERR_STAFF_ASSIGNMENT_OVERLAP"
            - "StaffAssignment.${asg_touch}.status == PROPOSED"
            - "StaffMember.${staff_id}.confirmed_minutes_total == 240 after the first trigger call"
            - "the second trigger call returns HTTP 200 and StaffAssignment.${asg_clear}.status == CONFIRMED"
            - "StaffAssignment.${asg_clear}.planned_labor_cost_cents == 12000"
            - "StaffMember.${staff_id}.confirmed_minutes_total == 359"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: manifest_move_and_move_back_conserves_program_seat_count
        grounds:
          - state_machines.ManifestEntry.ASSIGNED_to_ASSIGNED
          - calculations.segment_seat_occupancy
          - entities.Program.fields.seated_guest_count
          - entities.ManifestEntry.fields.move_count
          - entities.TransportSegment.fields.booked_seat_count
        distinguishing_aspect: |
          The conserved quantity is the program-wide seat count: moving a 3-seat party from S1 to S2 and
          back leaves Program.seated_guest_count at 3 at every observation point and restores
          booked_seat_count to 3 on S1 and 0 on S2, while move_count monotonically reaches 2 — the drift
          detector is seat conservation, not money.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Program 2026-09-10..2026-09-14."
            - "Two SCHEDULED TransportSegments on that program, each seat_capacity 20 and wheelchair_accessible true: S1 (DINE_AROUND_LEG 2026-09-12T18:00Z..18:40Z) and S2 (DINE_AROUND_LEG 2026-09-12T18:15Z..18:55Z)."
            - "One ManifestEntry with seat_count 3 on S1, so S1.booked_seat_count == 3, S2.booked_seat_count == 0 and Program.seated_guest_count == 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/programs"
              payload: { client_name: "Halcyon Foundation", group_name: "Donor Dinner Series", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 30, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/transport-segments"
              payload: { program_id: "${prog_id}", segment_type: "DINE_AROUND_LEG", vehicle_code: "VAN-21", origin: "Host Hotel", destination: "Osteria Blu", depart_at: "2026-09-12T18:00:00Z", arrive_at: "2026-09-12T18:40:00Z", seat_capacity: 20, wheelchair_accessible: true }
              as: OperationsCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /dmc/transport-segments"
              payload: { program_id: "${prog_id}", segment_type: "DINE_AROUND_LEG", vehicle_code: "VAN-22", origin: "Host Hotel", destination: "Casa Verde", depart_at: "2026-09-12T18:15:00Z", arrive_at: "2026-09-12T18:55:00Z", seat_capacity: 20, wheelchair_accessible: true }
              as: OperationsCoordinator
              captures: { s2_id: $.data.id }
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${s1_id}", guest_ref: "G-501", guest_name: "Party Aoyama", seat_count: 3, mobility_assist: false }
              as: OperationsCoordinator
              captures: { me_id: $.data.id }
          trigger:
            - call: "POST /dmc/manifest-entries/${me_id}/move"
              payload: { target_segment_id: "${s2_id}" }
              as: OperationsCoordinator
            - call: "POST /dmc/manifest-entries/${me_id}/move"
              payload: { target_segment_id: "${s1_id}" }
              as: OperationsCoordinator
          assert:
            - "after the first trigger call TransportSegment.${s1_id}.booked_seat_count == 0 and TransportSegment.${s2_id}.booked_seat_count == 3"
            - "after the first trigger call Program.${prog_id}.seated_guest_count == 3"
            - "after the second trigger call TransportSegment.${s1_id}.booked_seat_count == 3 and TransportSegment.${s2_id}.booked_seat_count == 0"
            - "after the second trigger call Program.${prog_id}.seated_guest_count == 3"
            - "Program.${prog_id}.unseated_guest_count == 0"
            - "ManifestEntry.${me_id}.segment_id == ${s1_id}"
            - "ManifestEntry.${me_id}.move_count == 2"
            - "ManifestEntry.${me_id}.status == ASSIGNED"

      - name: settlement_approve_then_void_restores_supplier_payable_split
        grounds:
          - state_machines.SettlementPayment.PENDING_to_APPROVED
          - state_machines.SettlementPayment.APPROVED_to_VOID
          - calculations.settlement_net_payable
          - concurrency_rules[settlement-create-stale-contract]
          - entities.Program.fields.supplier_gross_payable_cents
          - entities.Program.fields.supplier_settled_cents
          - entities.Program.fields.supplier_open_payable_cents
        distinguishing_aspect: |
          The conserved quantity is money: supplier_gross_payable_cents == supplier_settled_cents +
          supplier_open_payable_cents must hold at 400000 == 0 + 400000 before approval, 400000 ==
          280000 + 120000 after approval, and 400000 == 0 + 400000 again after the void — a different
          conserved quantity from the seat count of manifest_move_and_move_back_conserves_program_seat_count.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Venue capacity_reception 400; APPROVED Supplier."
            - "Program 2026-09-10..2026-09-14 with markup_pct 0.20; one ACTIVITY element 2026-09-13T10:00Z..14:00Z, planned/guaranteed 50, per_person_cost_cents 8000."
            - "ACTIVE SupplierContract with contract_value_cents 400000 and deposit_pct 0.3 (deposit_paid_cents 120000)."
            - "Program IN_EXECUTION, element DELIVERED with actual_headcount 50, program COMPLETED, reconciliation opened, the single line APPROVED (supplier_cost 400000, markup 80000), invoice issued (management_fee 57600, final_client_total 537600)."
            - "One PENDING SettlementPayment created with the contract's observed version: gross 400000, deposit_applied 120000, net_payable 280000, overpayment_credit 0."
