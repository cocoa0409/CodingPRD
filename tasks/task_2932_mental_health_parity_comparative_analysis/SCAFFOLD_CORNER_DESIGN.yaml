      - name: a_fourth_reopen_of_the_same_analysis_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_26_ERR_REVISION_LIMIT_REACHED
          - state_machines.ComparativeAnalysis.INSUFFICIENT_to_DRAFT
          - entities.ComparativeAnalysis.fields.revision_round
        distinguishing_aspect: "The MAX_REVISION_ROUNDS ratchet is compared before the increment: rounds 1, 2 and 3 are granted and the fourth reopen from a genuinely INSUFFICIENT analysis is refused, leaving the analysis stuck in INSUFFICIENT."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one NqtlItem."
            - "One analysis (F=2, E=1) taken through submit / INSUFFICIENT review / reopen three times, so revision_round == 3 and it is INSUFFICIENT again."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
