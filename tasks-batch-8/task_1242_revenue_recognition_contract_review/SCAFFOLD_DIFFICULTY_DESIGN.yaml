              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/clauses"
              payload: { clause_code: "NS-1", clause_type: "RIGHT_OF_RETURN", is_non_standard: true }
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "GET /revrec/review-tasks"
              payload: { contract_id: "${c_id}" }
              as: ContractReviewer
              as_user_id: "rev-1"
              captures: { task_id: "$.data[0].id" }
          trigger:
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
            - call: "POST /revrec/review-tasks/${task_id}/start"
              payload: {}
              as: ContractReviewer
              as_user_id: "rev-1"
            - call: "POST /revrec/review-tasks/${task_id}/recommend"
              payload: { recommendation: "APPROVE" }
              as: ContractReviewer
              as_user_id: "rev-1"
            - call: "POST /revrec/review-tasks/${task_id}/decide"
              payload: { decision: "APPROVED" }
              as: ContractReviewer
              as_user_id: "rev-2"
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
              captures: { st_after: $.data.status }
          assert:
            - "while task ASSIGNED: approve -> error_id == ERR_REVIEW_OUTSTANDING"
            - "after task DECIDED (clause APPROVED): approve succeeds, Contract.status == APPROVED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics, different resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_period_half_open_adjacency_allowed
        grounds:
          - errors[ERR_PERIOD_OVERLAP]
          - entities.AccountingPeriod.fields.start_date
        distinguishing_aspect: |
          Resource: AccountingPeriod calendar. Semantics: HALF-OPEN [start, end) —
          a period starting exactly at another's end_date (2026-06-01) is adjacent,
          not overlapping, and is accepted; a period starting 2026-05-15 genuinely
          intersects and is rejected with ERR_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "period P1 [2026-05-01, 2026-06-01) exists"
          setup_api_calls:
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-05", start_date: "2026-05-01", end_date: "2026-06-01" }
              as: Controller
              as_user_id: "ctrl-1"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-05B", start_date: "2026-05-15", end_date: "2026-07-01" }
              as: Controller
              as_user_id: "ctrl-1"
              captures: { err: $.data.error_id }
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-06", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Controller
              as_user_id: "ctrl-1"
              captures: { p3_id: $.data.id, p3_status: $.data.status }
          assert:
            - "overlapping [2026-05-15, 2026-07-01) -> error_id == ERR_PERIOD_OVERLAP (409)"
            - "adjacent [2026-06-01, 2026-07-01) -> 201, status == OPEN (half-open semantics: shared endpoint is NOT an overlap)"

      - name: overlap_ssp_window_closed_interval_touching_conflicts
        grounds:
          - errors[ERR_SSP_WINDOW_OVERLAP]
          - entities.SspPrice.fields.effective_from
        distinguishing_aspect: |
          Resource: (product_code, region) SSP lane — a different resource than the
          accounting calendar. Semantics: CLOSED [effective_from, effective_to] —
          a window starting on the day another window ends (2026-03-31) shares that
          date and IS a conflict (ERR_SSP_WINDOW_OVERLAP); only 2026-04-01 onward is
          accepted. Adjacency treatment is the exact inverse of the period rule.
        test_recipe:
          setup:
            - "SSP GADGET/US 50000 with CLOSED window [2026-01-01, 2026-03-31] exists (ACTIVE)"
          setup_api_calls:
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "GADGET", region: "US", ssp_cents: 50000, effective_from: "2026-01-01", effective_to: "2026-03-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "GADGET", region: "US", ssp_cents: 52000, effective_from: "2026-03-31", effective_to: "2026-06-30" }
              as: RevenueManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "GADGET", region: "US", ssp_cents: 52000, effective_from: "2026-04-01", effective_to: "2026-06-30" }
              as: RevenueManager
              as_user_id: "mgr-1"
              captures: { s3_id: $.data.id, s3_status: $.data.status }
          assert:
            - "touching window [2026-03-31, 2026-06-30] -> error_id == ERR_SSP_WINDOW_OVERLAP (409) — closed intervals share the boundary date"
            - "gap-free non-touching [2026-04-01, 2026-06-30] -> 201, status == ACTIVE"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: invariant_allocation_sum_conserved_across_modification
        grounds:
          - calculations.ssp_allocation
          - entities.Contract.fields.allocated_total_cents
        distinguishing_aspect: |
          Conserved quantity: sum of POB allocated_amount_cents == contract
          transaction_price_cents. A +250000 CUMULATIVE_CATCH_UP modification moves
          money between POBs (375000/625000 -> 468750/781250) but the sum tracks the
          new price exactly — the forward+compensating reallocation leaves no drift.
        test_recipe:
          setup:
            - "clock 2026-06-15; OPEN June period; SSPs QA=300000, QB=500000 (region US); customer"
            - "contract fixed 1000000 ACTIVE with two POINT_IN_TIME POBs (QA, QB); allocation 375000 / 625000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-06", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Controller
              as_user_id: "ctrl-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "QA", region: "US", ssp_cents: 300000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
