        test_recipe:
          setup: ["One respondent in DD_IN_PROGRESS under DE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
