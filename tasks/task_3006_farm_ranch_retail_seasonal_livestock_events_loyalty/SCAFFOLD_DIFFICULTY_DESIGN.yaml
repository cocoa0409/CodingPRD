# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3006_farm_ranch_retail_seasonal_livestock_events_loyalty
#
# Depth probe: 9 Difficulty Rules x 2 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 and replays from empty-DB via §1.5 endpoints only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc: two domains (WeightedSale vs LoyaltyAccount)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: weighted_sale_provisional_vs_final_tare_pricing
        grounds:
          - calculations.weighted_sale_provisional_price
          - calculations.weighted_sale_final_price
          - entities.WeightedSale.fields.provisional_tare_lbs
          - entities.WeightedSale.fields.final_total_cents
        distinguishing_aspect: |
          Dual-variant on the WeightedSale domain: identical gross input prices
          differently under the provisional variant (class-table tare 20 lb for
          DRUM) than under the final variant (measured tare 15 lb), because the
          marginal feed tiers shift when net weight crosses 300 lb.
        test_recipe:
          setup:
            - "Store S exists; logical clock 2026-09-10T09:00:00Z."
          setup_api_calls:
            - &d1_clock_sep10
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: RegionalAdmin
            - &d1_store
              call: "POST /stores"
              payload: { store_name: "Waco Farm & Ranch", region_code: "TX-CENTRAL" }
              as: RegionalAdmin
              captures: { store_id: $.data.id, store_v0: $.data.version }
          trigger:
            - call: "POST /weighted-sales"
              payload: { store_id: "${store_id}", sale_kind: "FEED_BULK", container_class: "DRUM", gross_weight_lbs: 320 }
              as: StoreAssociate
              captures: { sale_id: $.data.id, prov_total: $.data.provisional_total_cents }
            - call: "POST /weighted-sales/${sale_id}/finalize"
              payload: { measured_tare_lbs: 15 }
              as: StoreAssociate
          assert:
            - "WeightedSale.${sale_id}.provisional_tare_lbs == 20 (class table) and provisional_total_cents == 10250"
            - "WeightedSale.${sale_id}.final_total_cents == 10400 — same gross, different variant, +150 cents"
            - "WeightedSale.${sale_id}.status == FINALIZED"

      - name: loyalty_rolling365_vs_posture_season_qualification
        grounds:
          - calculations.loyalty_tier_evaluation
          - calculations.fuel_feed_offer_eligibility
          - entities.LoyaltyAccount.fields.tier_qualifying_points
        distinguishing_aspect: |
          Dual-variant on the LoyaltyAccount domain: the same purchase history
          yields tier_qualifying_points == 200 under the rolling-365d variant
          (tier stays NEIGHBOR) but season_qualifying_points == 200 under the
          posture-season variant — and once a second FALL_FEED accrual pushes the
          posture variant to 700 while rolling-365 also shows 700, the offer fuel
          discount keys only off the posture variant (5 cents/gal at >= 500).
        test_recipe:
          setup:
            - "Store with FALL_FEED posture active; account A with zero history; clock 2026-09-20T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T10:00:00Z" }
              as: RegionalAdmin
            - call: "POST /stores"
              payload: { store_name: "Amarillo Farm & Ranch", region_code: "TX-PANHANDLE" }
              as: RegionalAdmin
              captures: { f_store_id: $.data.id, f_store_v0: $.data.version }
            - call: "POST /season-campaigns"
              payload: { store_id: "${f_store_id}", season: "FALL_FEED", planogram_map: "fall-feed-v1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { f_camp_id: $.data.id }
            - call: "POST /season-campaigns/${f_camp_id}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${f_camp_id}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${f_camp_id}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${f_camp_id}/activate"
              payload: { expected_store_version: "${f_store_v0}" }
              as: RegionalAdmin
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Dee Keller", phone: "555-0142" }
              as: Anonymous
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /loyalty-accounts/${acct_id}/ledger-entries"
              payload: { entry_type: "ACCRUAL", store_id: "${f_store_id}", base_amount_cents: 10000, earn_context: "FEED" }
              as: StoreAssociate
              captures: { e1: $.data.id, e1_points: $.data.points_delta }
            - call: "GET /loyalty-accounts/${acct_id}/offers"
              payload: { store_id: "${f_store_id}" }
              as: StoreAssociate
              captures: { offer1_fuel: $.data.fuel_discount_cents_per_gal, offer1_season: $.data.season_qualifying_points }
            - call: "POST /loyalty-accounts/${acct_id}/ledger-entries"
              payload: { entry_type: "ACCRUAL", store_id: "${f_store_id}", base_amount_cents: 25000, earn_context: "FEED" }
              as: StoreAssociate
              captures: { e2_points: $.data.points_delta }
            - call: "GET /loyalty-accounts/${acct_id}/offers"
              payload: { store_id: "${f_store_id}" }
              as: StoreAssociate
              captures: { offer2_fuel: $.data.fuel_discount_cents_per_gal, offer2_season: $.data.season_qualifying_points }
            - call: "GET /loyalty-accounts/${acct_id}"
              payload: {}
              as: StoreAssociate
              captures: { acct_tier: $.data.tier, acct_qual: $.data.tier_qualifying_points }
          assert:
            - "e1_points == 200 (base 100 x tier 1.0 x posture 2.0)"
            - "offer1_season == 200 and offer1_fuel == 0 (posture variant below the 500 step)"
            - "e2_points == 500 (base 250 x 1.0 x 2.0)"
            - "offer2_season == 700 and offer2_fuel == 5 (floor(700/500)=1 step x 5 cents)"
            - "acct_tier == NEIGHBOR and acct_qual == 700 — rolling-365d variant below the 2500 threshold while the posture variant already pays a fuel discount"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: mode (a) vs mode (c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: propane_price_nested_min_gallon_cap_and_rounding
        grounds:
          - calculations.weighted_sale_final_price
          - entities.WeightedSale.fields.propane_gallons
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: propane price nests
          min(net/4.24, 20.0) gallon cap inside flat-fee-plus-per-gallon, with the
          2dp gallon rounding happening BEFORE the per-gallon multiply; a net
          weight of 21 lb lands under the cylinder cap while 90 lb saturates it,
          so the marginal price per pound collapses to zero past the cap.
        test_recipe:
          setup:
            - "Store exists; clock 2026-09-10T09:00:00Z."
          setup_api_calls:
            - *d1_clock_sep10
            - *d1_store
            - call: "POST /season-campaigns"
              payload: { store_id: "${store_id}", season: "WINTER_HEATING", planogram_map: "floor-open-v1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { ko_camp: $.data.id }
            - call: "POST /season-campaigns/${ko_camp}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${ko_camp}/activate"
              payload: { expected_store_version: "${store_v0}" }
              as: RegionalAdmin
          trigger:
            - call: "POST /weighted-sales"
              payload: { store_id: "${store_id}", sale_kind: "PROPANE_EXCHANGE", container_class: "CYLINDER_20", gross_weight_lbs: 37 }
              as: StoreAssociate
              captures: { ps1: $.data.id, ps1_total: $.data.provisional_total_cents, ps1_gal: $.data.propane_gallons }
            - call: "POST /weighted-sales"
              payload: { store_id: "${store_id}", sale_kind: "PROPANE_EXCHANGE", container_class: "CYLINDER_20", gross_weight_lbs: 107 }
              as: StoreAssociate
              captures: { ps2: $.data.id, ps2_total: $.data.provisional_total_cents, ps2_gal: $.data.propane_gallons }
          assert:
            - "WeightedSale.${ps1}.propane_gallons == 4.72 and provisional_total_cents == 3646 (1999 + round_half_up(4.72*349)=1647)"
            - "WeightedSale.${ps2}.propane_gallons == 20.0 (cap saturates: 90/4.24=21.23 clamped) and provisional_total_cents == 8979 (1999 + 6980)"

      - name: loyalty_accrual_circular_tier_multiplier_order
        grounds:
          - calculations.loyalty_points_accrual
          - calculations.loyalty_tier_evaluation
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the
          accrual's points depend on the tier multiplier while the tier depends on
          qualifying points including this very entry; the scaffold resolves it by
          snapshotting the PRE-ENTRY tier, so a RANCH_HAND crossing HOMESTEAD
          mid-entry still earns at the 1.25 multiplier on that entry and only the
          NEXT entry gets 1.5.
        test_recipe:
          setup:
            - "Store with WINTER_HEATING posture active; account at exactly 7000 qualifying points (RANCH_HAND); clock 2026-09-20T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T10:00:00Z" }
              as: RegionalAdmin
            - call: "POST /stores"
              payload: { store_name: "Bozeman Farm & Ranch", region_code: "MT-WEST" }
              as: RegionalAdmin
              captures: { w_store_id: $.data.id, w_store_v0: $.data.version }
            - call: "POST /season-campaigns"
              payload: { store_id: "${w_store_id}", season: "WINTER_HEATING", planogram_map: "winter-heat-v1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { w_camp_id: $.data.id }
            - call: "POST /season-campaigns/${w_camp_id}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${w_camp_id}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${w_camp_id}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${w_camp_id}/activate"
              payload: { expected_store_version: "${w_store_v0}" }
              as: RegionalAdmin
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Hank Roper", phone: "555-0199" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /loyalty-accounts/${acct_id}/ledger-entries"
              payload: { entry_type: "ACCRUAL", store_id: "${w_store_id}", base_amount_cents: 700000, earn_context: "OTHER" }
              as: StoreAssociate
              captures: { base_entry: $.data.id }
          trigger:
            - call: "POST /loyalty-accounts/${acct_id}/ledger-entries"
              payload: { entry_type: "ACCRUAL", store_id: "${w_store_id}", base_amount_cents: 50000, earn_context: "OTHER" }
              as: StoreAssociate
              captures: { cross_entry: $.data.id, cross_points: $.data.points_delta }
            - call: "GET /loyalty-accounts/${acct_id}"
              payload: {}
              as: StoreAssociate
              captures: { tier_after: $.data.tier, qual_after: $.data.tier_qualifying_points }
            - call: "POST /loyalty-accounts/${acct_id}/ledger-entries"
              payload: { entry_type: "ACCRUAL", store_id: "${w_store_id}", base_amount_cents: 10000, earn_context: "OTHER" }
              as: StoreAssociate
              captures: { next_points: $.data.points_delta }
          assert:
            - "cross_points == 625 (base 500 x PRE-ENTRY tier RANCH_HAND 1.25 x posture 1.0 — even though this entry pushes qualifying points to 7625 >= 7500)"
            - "tier_after == HOMESTEAD and qual_after == 7625 (tier upgrades only after the crossing entry is posted)"
            - "next_points == 150 (base 100 x post-crossing tier HOMESTEAD 1.5 — the circular dependency resolves in pinned order)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine: ChickOrder (cyclic) vs PickupOrder (parallel)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: chick_order_brooder_verification_reverify_cycle
        grounds:
          - state_machines.ChickOrder.BROODER_VERIFIED_to_RESERVED
          - state_machines.ChickOrder.RESERVED_to_BROODER_VERIFIED
        distinguishing_aspect: |
          Cyclic machine on ChickOrder: BROODER_VERIFIED -> RESERVED -> BROODER_VERIFIED
          loops via the 72-hour staleness rule; the loop is driven by the logical
          clock, not by any new document, and the cycle can repeat without bound.
        test_recipe:
          setup:
            - "Spring store; PUBLISHED schedule (window 2026-03-01..2026-04-30, min 6, 349c); lot 100 ON_SALE; account; RESERVED order qty 6 with brooder verified at 2026-03-10T10:00:00Z; fresh care log."
          setup_api_calls:
            - &d3_clock_mar10
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T10:00:00Z" }
              as: RegionalAdmin
            - &d3_store
              call: "POST /stores"
              payload: { store_name: "Waxahachie Farm & Ranch", region_code: "TX-NORTH" }
              as: RegionalAdmin
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - &d3_campaign
              call: "POST /season-campaigns"
              payload: { store_id: "${store_id}", season: "SPRING_PLANTING", planogram_map: "spring-v1", aisle_count: 2 }
              as: RegionalAdmin
              captures: { camp_id: $.data.id }
            - &d3_teardown
              call: "POST /season-campaigns/${camp_id}/begin-teardown"
              payload: {}
              as: StoreManager
            - &d3_reset
              call: "POST /season-campaigns/${camp_id}/complete-reset"
              payload: { aisles_reset_count: 2 }
              as: StoreManager
            - &d3_verify
              call: "POST /season-campaigns/${camp_id}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - &d3_activate
              call: "POST /season-campaigns/${camp_id}/activate"
              payload: { expected_store_version: "${store_v0}" }
              as: RegionalAdmin
            - &d3_schedule
              call: "POST /hatchery-schedules"
              payload: { store_id: "${store_id}", species: "CHICKEN_LAYER", breed: "Rhode Island Red", hatch_date: "2026-02-25T00:00:00Z", sale_window_start: "2026-03-01T00:00:00Z", sale_window_end: "2026-04-30T23:59:59Z", daily_capacity: 500, min_purchase_qty: 6, base_price_cents_per_bird: 349 }
              as: StoreManager
              captures: { sched_id: $.data.id }
            - &d3_publish
              call: "POST /hatchery-schedules/${sched_id}/publish"
              payload: {}
              as: StoreManager
            - &d3_lot
              call: "POST /livestock-lots"
              payload: { store_id: "${store_id}", hatchery_schedule_id: "${sched_id}", quantity_received: 100, received_at: "2026-03-02T08:00:00Z" }
              as: StoreManager
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - &d3_open_sale
              call: "POST /livestock-lots/${lot_id}/open-sale"
              payload: {}
              as: StoreManager
              captures: { lot_v: $.data.version }
            - &d3_account
              call: "POST /loyalty-accounts"
              payload: { full_name: "Jesse Pruitt", phone: "555-0110" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - &d3_order6
              call: "POST /chick-orders"
              payload: { store_id: "${store_id}", livestock_lot_id: "${lot_id}", loyalty_account_id: "${acct_id}", quantity: 6, pickup_date: "2026-03-12T10:00:00Z", expected_livestock_lot_version: "${lot_v}" }
              as: Customer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - &d3_brooder_ok
              call: "POST /chick-orders/${order_id}/verify-brooder"
              payload: { heat_lamp_ok: true, thermometer_ok: true, bedding_ok: true }
              as: StoreAssociate
            - &d3_carelog
              call: "POST /livestock-lots/${lot_id}/care-logs"
              payload: { entry_type: "FEEDING" }
              as: StoreAssociate
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T11:00:00Z" }
              as: RegionalAdmin
            - call: "POST /chick-orders/${order_id}/fulfill"
              payload: {}
              as: StoreAssociate
              captures: { fulfill_err: $.data.error_id }
            - call: "POST /livestock-lots/${lot_id}/care-logs"
              payload: { entry_type: "WATER" }
              as: StoreAssociate
            - call: "POST /chick-orders/${order_id}/verify-brooder"
              payload: { heat_lamp_ok: true, thermometer_ok: true, bedding_ok: true }
              as: StoreAssociate
              captures: { order_state2: $.data.status }
            - call: "POST /chick-orders/${order_id}/fulfill"
              payload: {}
              as: StoreAssociate
              captures: { order_state3: $.data.status }
          assert:
            - "fulfill_err == ERR_BROODER_VERIFICATION_EXPIRED (73h > 72h) and the order reverted BROODER_VERIFIED -> RESERVED (cycle hop 1)"
            - "order_state2 == BROODER_VERIFIED (cycle hop 2 completes the loop)"
            - "order_state3 == FULFILLED and ChickOrder.${order_id}.fulfilled_at == 2026-03-13T11:00:00Z"
            - "LivestockLot.${lot_id}.quantity_sold == 6 and quantity_on_hand == 94"

      - name: pickup_order_parallel_fulfillment_and_loadout_dimensions
        grounds:
          - state_machines.PickupOrder
          - entities.PickupOrder.fields.fulfillment_status
          - entities.PickupOrder.fields.loadout_status
        distinguishing_aspect: |
          Parallel dimensions on PickupOrder: loadout_status
          (NOT_REQUIRED -> ASSISTANCE_REQUESTED -> LOADOUT_DONE) evolves
          independently of fulfillment_status (PLACED -> ... -> COMPLETED), and
          the fulfillment COMPLETED transition is gated by the loadout dimension
          only when assistance was requested.
        test_recipe:
          setup:
            - "Store; bay 7 size XL AVAILABLE; account; pickup order item_size_class L with requires_loadout_assistance=true, STAGED then READY_FOR_PICKUP at 2026-09-10T09:00:00Z."
          setup_api_calls:
            - *d1_clock_sep10
            - *d1_store
            - call: "POST /season-campaigns"
              payload: { store_id: "${store_id}", season: "WINTER_HEATING", planogram_map: "floor-open-v1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { ko_camp: $.data.id }
            - call: "POST /season-campaigns/${ko_camp}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${ko_camp}/activate"
              payload: { expected_store_version: "${store_v0}" }
              as: RegionalAdmin
            - call: "POST /staging-bays"
              payload: { store_id: "${store_id}", bay_no: 7, size_class: "XL" }
              as: StoreManager
              captures: { bay_id: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Opal Denton", phone: "555-0171" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /pickup-orders"
              payload: { store_id: "${store_id}", loyalty_account_id: "${acct_id}", item_sku: "GUN-SAFE-72", item_size_class: "L", requires_loadout_assistance: true }
              as: Customer
              as_user_id: "${acct_id}"
              captures: { po_id: $.data.id }
            - call: "POST /pickup-orders/${po_id}/stage"
              payload: {}
              as: StoreAssociate
            - call: "POST /pickup-orders/${po_id}/mark-ready"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /pickup-orders/${po_id}/request-loadout"
              payload: {}
              as: Customer
              as_user_id: "${acct_id}"
              captures: { po_load1: $.data.loadout_status, po_ful1: $.data.fulfillment_status }
            - call: "POST /pickup-orders/${po_id}/complete"
              payload: {}
              as: StoreAssociate
              captures: { complete_err: $.data.error_id }
            - call: "POST /pickup-orders/${po_id}/complete-loadout"
              payload: {}
              as: StoreAssociate
              captures: { po_load2: $.data.loadout_status, po_ful2: $.data.fulfillment_status }
            - call: "POST /pickup-orders/${po_id}/complete"
              payload: {}
              as: StoreAssociate
              captures: { po_ful3: $.data.fulfillment_status }
          assert:
            - "po_load1 == ASSISTANCE_REQUESTED while po_ful1 == READY_FOR_PICKUP (dimensions move independently)"
            - "complete_err == ERR_LOADOUT_NOT_COMPLETED (fulfillment transition gated by the loadout dimension)"
            - "po_load2 == LOADOUT_DONE and po_ful2 == READY_FOR_PICKUP (loadout advanced without touching fulfillment)"
            - "po_ful3 == COMPLETED and StagingBay.${bay_id}.status == AVAILABLE"

  # ===========================================================================
  # Rule 4 — transitive_cascade: mortality (depth 4) vs posture flip (depth 5)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: mortality_quarantine_cascade_depth4
        grounds:
          - state_machines.LivestockLot.ON_SALE_to_SUSPENDED
          - state_machines.ChickOrder.RESERVED_to_CANCELLED
          - calculations.care_log_mortality_rate
        distinguishing_aspect: |
          Depth-4 chain from a single MORTALITY care log: entry append mutates
          LivestockLot.mortality_count (hop 1); the lot's own mortality_rate
          recomputation suspends the lot (hop 2); the lot suspension cancels the
          RESERVED order into quarantined quantity (hop 3); the order
          cancellation posts a +500 goodwill ADJUSTMENT to the loyalty ledger
          (hop 4). Each hop is caused by the previous hop's mutation.
        test_recipe:
          setup:
            - "Spring store; lot 100 ON_SALE; account; RESERVED order qty 6; clock 2026-03-10T10:00:00Z."
          setup_api_calls:
            - *d3_clock_mar10
            - *d3_store
            - *d3_campaign
            - *d3_teardown
            - *d3_reset
            - *d3_verify
            - *d3_activate
            - *d3_schedule
            - *d3_publish
            - *d3_lot
            - *d3_open_sale
            - *d3_account
            - *d3_order6
          trigger:
            - call: "POST /livestock-lots/${lot_id}/care-logs"
              payload: { entry_type: "MORTALITY", mortality_count: 10 }
              as: StoreAssociate
            - call: "GET /livestock-lots/${lot_id}"
              payload: {}
              as: StoreManager
              captures: { lot_status: $.data.status, lot_flag: $.data.health_flag, lot_qoh: $.data.quantity_on_hand, lot_mort: $.data.mortality_count, lot_quar: $.data.quantity_quarantined }
            - call: "GET /chick-orders/${order_id}"
              payload: {}
              as: StoreManager
              captures: { ord_status: $.data.status }
            - call: "GET /loyalty-accounts/${acct_id}"
              payload: {}
              as: StoreManager
              captures: { acct_balance: $.data.points_balance }
          assert:
            - "lot_status == SUSPENDED and lot_flag == QUARANTINED (hop 1 -> hop 2: 10/100 = 0.1 > 0.05)"
            - "ord_status == CANCELLED (hop 3: order cancelled by lot suspension, not by the care log directly)"
            - "lot_qoh == 84 and lot_mort == 10 and lot_quar == 6 (cancelled reservation quarantined, not released)"
            - "acct_balance == 500 (hop 4: QUARANTINE_GOODWILL_POINTS ADJUSTMENT posted by the order cancellation)"

      - name: posture_flip_cascade_depth5
        grounds:
          - calculations.posture_cascade_on_activation
          - state_machines.SeasonCampaign.READY_to_ACTIVE
        distinguishing_aspect: |
          Depth-5 chain from a campaign activation: prior campaign COMPLETED
          (hop 1); Store.posture recomputed (hop 2); because the new posture is
          not SPRING_PLANTING the PUBLISHED schedule closes (hop 3); the schedule
          closure closes the ON_SALE lot (hop 4); the lot closure expires the
          BROODER_VERIFIED order and releases its birds (hop 5). Trigger differs
          from the mortality cascade (activation vs care log).
        test_recipe:
          setup:
            - "Spring store active; schedule PUBLISHED; lot 100 ON_SALE; order qty 6 BROODER_VERIFIED; a FALL_FEED campaign driven to READY; clock 2026-03-10T10:00:00Z."
          setup_api_calls:
            - *d3_clock_mar10
            - *d3_store
            - *d3_campaign
            - *d3_teardown
            - *d3_reset
            - *d3_verify
            - *d3_activate
            - *d3_schedule
            - *d3_publish
            - *d3_lot
            - *d3_open_sale
            - *d3_account
            - *d3_order6
            - *d3_brooder_ok
            - call: "POST /season-campaigns"
              payload: { store_id: "${store_id}", season: "FALL_FEED", planogram_map: "fall-v1", aisle_count: 3 }
              as: RegionalAdmin
              captures: { camp2_id: $.data.id }
            - call: "POST /season-campaigns/${camp2_id}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${camp2_id}/complete-reset"
              payload: { aisles_reset_count: 3 }
              as: StoreManager
            - call: "POST /season-campaigns/${camp2_id}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "GET /stores/${store_id}"
              payload: {}
              as: RegionalAdmin
              captures: { store_v1: $.data.version }
          trigger:
            - call: "POST /season-campaigns/${camp2_id}/activate"
              payload: { expected_store_version: "${store_v1}" }
              as: RegionalAdmin
            - call: "GET /season-campaigns/${camp_id}"
              payload: {}
              as: RegionalAdmin
              captures: { camp1_status: $.data.status }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: RegionalAdmin
              captures: { store_posture: $.data.posture }
            - call: "GET /hatchery-schedules/${sched_id}"
              payload: {}
              as: StoreManager
              captures: { sched_status: $.data.status }
            - call: "GET /livestock-lots/${lot_id}"
              payload: {}
              as: StoreManager
              captures: { lot_status2: $.data.status, lot_qoh2: $.data.quantity_on_hand }
            - call: "GET /chick-orders/${order_id}"
              payload: {}
              as: StoreManager
              captures: { ord_status2: $.data.status }
          assert:
            - "camp1_status == COMPLETED (hop 1: superseded by activation)"
            - "store_posture == FALL_FEED (hop 2: posture recomputed)"
            - "sched_status == CLOSED (hop 3: posture left SPRING_PLANTING)"
            - "lot_status2 == SALE_CLOSED (hop 4: schedule closure closes the lot)"
            - "ord_status2 == EXPIRED and lot_qoh2 == 100 (hop 5: order expired by lot closure; 6 birds released back)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: fulfill_state_lot_closed_beats_safety_care_log_stale
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.ChickOrder.BROODER_VERIFIED_to_FULFILLED
        distinguishing_aspect: |
          Category pair (state vs business_safety): a fulfill call that fails
          BOTH the order-state check (priority 7, order cascade-expired when its
          lot closed) and the care-log freshness safety check (priority 8, care
          log is 20h old) MUST surface ERR_INVALID_STATE_TRANSITION, proving
          state outranks safety.
        test_recipe:
          setup:
            - "Spring store; lot ON_SALE; order qty 6 BROODER_VERIFIED at 2026-03-10T10:00:00Z; care log is 20h stale by trigger time; lot manually closed."
          setup_api_calls:
            - *d3_clock_mar10
            - *d3_store
            - *d3_campaign
            - *d3_teardown
            - *d3_reset
            - *d3_verify
            - *d3_activate
            - *d3_schedule
            - *d3_publish
            - *d3_lot
            - *d3_open_sale
            - *d3_account
            - *d3_order6
            - *d3_brooder_ok
            - *d3_carelog
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T06:00:00Z" }
              as: RegionalAdmin
            - call: "POST /livestock-lots/${lot_id}/close-sale"
              payload: {}
              as: StoreManager
            - call: "POST /chick-orders/${order_id}/fulfill"
              payload: {}
              as: StoreAssociate
              captures: { fulfill_err2: $.data.error_id }
            - call: "GET /chick-orders/${order_id}"
              payload: {}
              as: StoreManager
              captures: { ord_mid: $.data.status }
          assert:
            - "fulfill_err2 == ERR_INVALID_STATE_TRANSITION — the state check (priority 7) beats the care-log staleness safety check (priority 8) even though the care log is 20h stale; the state surfaced is the cascade-induced EXPIRED"
            - "ord_mid == EXPIRED (close-sale cascade fired before the fulfill attempt)"

      - name: propane_hazmat_cap_beats_insufficient_points
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - state_machines.WeightedSale.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          Category pair (business_safety vs business_fiscal): a propane finalize
          that would BOTH breach the 40 gal/day hazmat cap (priority 7) and
          redeem more points than the account holds (priority 10) MUST surface
          ERR_HAZMAT_DAILY_CAP_EXCEEDED, proving safety outranks fiscal.
        test_recipe:
          setup:
            - "Store; account with 0 points; two propane sales of 20 gal already FINALIZED (hazmat tally 40); third PROPANE_EXCHANGE sale PROVISIONAL (gross 40, net 23 -> 5.42 gal); clock 2026-09-10."
          setup_api_calls:
