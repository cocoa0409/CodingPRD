      - name: closeout_refuses_to_settle_an_empty_committed_bucket_after_every_sheet_is_voided
        claim_type: violation_to_error
        grounds:
          - validations.priority_96
          - errors.ERR_NOTHING_TO_SETTLE
          - entities.ExhibitProject.fields.committed_fabrication_cents
        distinguishing_aspect: |
          ERR_NOTHING_TO_SETTLE looks unreachable, because the route into
          INSTALLATION demands an approved drawing and every approved drawing
          commits money. The only way in is the compensating path: void every sheet
          AFTER the phase has moved on. Voiding is deliberately not phase-gated, so
          the project can sit in CLOSEOUT with a zero committed bucket - and then the
          settlement must refuse rather than run the waterfall over zeros and write a
          row of zero-valued buckets. The five-bucket identity is checked on both
          sides of the void so the release is provably lossless, and the refusal must
          leave the phase at CLOSEOUT rather than dragging it to WARRANTY_CLOSED.
        test_recipe:
          setup:
            - "project in CLOSEOUT with interactive INT-STRATA COMMISSIONED and two APPROVED drawings totalling 4837500 cents committed"
