              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { exp_a_id: $.data.id }
            - call: "POST /scan-runs/${scan1_id}/findings"
              payload: { broker_id: "${broker_b_id}", exposure_kind: "MARKETING_LIST", source_url: "https://quicklookup.example/dana" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { exp_b_id: $.data.id }
            - call: "POST /scan-runs/${scan1_id}/complete"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /removal-requests"
              payload: { exposure_id: "${exp_a_id}" }
              as: PrivacyAgent
