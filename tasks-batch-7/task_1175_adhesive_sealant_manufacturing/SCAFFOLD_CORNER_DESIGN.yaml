              payload: { code: "PU-CYC", name: "PU Cyc", chemistry_family: "POLYURETHANE", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/distributors"
              payload: { name: "Dist CYC", credit_limit_cents: 1000000, contact_email: "cy@x.com" }
              as: CommercialManager
              captures: { dist_id: $.data.id }
            - call: "POST /api/consignment-agreements"
              payload: { distributor_id: "${dist_id}", formulation_id: "${form_id}", unit_price_cents: 2000, max_consigned_value_cents: 500000, reorder_threshold_units: 0, reorder_qty_units: 100 }
              as: CommercialManager
              captures: { ag_id: $.data.id }
            - { call: "POST /api/consignment-agreements/${ag_id}/activate", payload: {}, as: CommercialManager }
          trigger:
            - { call: "POST /api/consignment-agreements/${ag_id}/suspend", payload: {}, as: CommercialManager }
            - { call: "POST /api/consignment-agreements/${ag_id}/resume", payload: {}, as: CommercialManager }
          assert:
            - "after suspend: status == SUSPENDED; after resume: status == ACTIVE (cycle completed)"
            - "each mutation incremented version: create 1 -> activate 2 -> suspend 3 -> resume 4"

      - name: exposure_below_threshold_no_state_change
        claim_type: side_effect_execution
        grounds: [state_machines.PackagingRun.SEALED_to_HOLD, "endpoints.POST /api/packaging-runs/{runId}/exposure-events"]
        distinguishing_aspect: "A 29-minute exposure (below the 30-minute hold threshold) is recorded but fires NO cascade: run stays SEALED, lot stays CLEAR."
        test_recipe:
          setup: ["a SEALED run on a lot (3 cartridge units)"]
          setup_api_calls:
