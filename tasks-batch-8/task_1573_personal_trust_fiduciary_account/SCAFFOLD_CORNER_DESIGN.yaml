scaffold_corner_design:
  - section: entities
    instances:
      - name: create_trust_missing_required_and_invalid_enum_rejected
        claim_type: required_fields
        grounds: ["entities.TrustAccount.fields.trust_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Two malformed creates: one omits required trust_type, one passes an invalid enum - both must return ERR_VALIDATION (400) before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /trusts", payload: { trust_name: "No Type", grantor_name: "G", governing_state: "DE", ein: "04-0000001", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /trusts", payload: { trust_name: "Bad Type", trust_type: "FOOBAR", grantor_name: "G", governing_state: "DE", ein: "04-0000002", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { err2: $.data.error_id } }
          assert:
            - "Both triggers fail with error_id == ERR_VALIDATION and http 400"
            - "GET /trusts returns total_count == 0 (nothing persisted)"

      - name: system_and_computed_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.TrustAccount.fields.income_balance_cents"]
        distinguishing_aspect: "Client-supplied id, created_at, and income_balance_cents on create are ignored: the server mints its own id/timestamps and computed balances start at 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /trusts", payload: { trust_name: "Ignored Fields", trust_type: "REVOCABLE", grantor_name: "G", governing_state: "CA", ein: "04-0000003", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY", id: "client-supplied", income_balance_cents: 999999 }, as: TrustOfficer, captures: { new_id: $.data.id } }
          assert:
            - "Response id != 'client-supplied' (server-minted UUID)"
            - "Response income_balance_cents == 0 and principal_balance_cents == 0 and version == 1"

      - name: committee_member_status_default_active
        claim_type: defaults
        grounds: ["entities.CommitteeMember.fields.status"]
        distinguishing_aspect: "Omitting any status input yields a member whose status defaults to ACTIVE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /trusts/committee-members", payload: { full_name: "Default Dan", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm: $.data.id } }
          assert:
            - "CommitteeMember.${cm}.status == ACTIVE"

      - name: not_found_returns_404_per_resource_kind
        claim_type: not_found
        grounds: ["errors[ERR_TRUST_NOT_FOUND]", "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "A missing trust id yields ERR_TRUST_NOT_FOUND; a missing child id (document) yields the generic ERR_RESOURCE_NOT_FOUND - the two 404 codes are distinct."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /trusts/00000000-0000-4000-8000-000000000000", as: TrustOfficer, captures: { err1: $.data.error_id } }
            - { call: "GET /trusts/documents/00000000-0000-4000-8000-000000000000", as: TrustOfficer, captures: { err2: $.data.error_id } }
          assert:
            - "First trigger: error_id == ERR_TRUST_NOT_FOUND, http 404"
            - "Second trigger: error_id == ERR_RESOURCE_NOT_FOUND, http 404"

      - name: list_pagination_defaults_and_limit_cap
        claim_type: listing
        grounds: ["response_envelope.pagination_defaults"]
        distinguishing_aspect: "Default page is limit=10/offset=0 with total_count and has_more present; limit=101 exceeds the max of 100 and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["three trusts exist"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "P1", trust_type: "REVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000011", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer }
            - { call: "POST /trusts", payload: { trust_name: "P2", trust_type: "REVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000012", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer }
            - { call: "POST /trusts", payload: { trust_name: "P3", trust_type: "REVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000013", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer }
          trigger:
            - { call: "GET /trusts", as: TrustOfficer }
            - { call: "GET /trusts?limit=101", as: TrustOfficer, captures: { err: $.data.error_id } }
          assert:
            - "First trigger: response_type == array, total_count == 3, has_more == false, limit == 10, offset == 0"
            - "Second trigger: error_id == ERR_VALIDATION, http 400"

  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: ["state_machines.TrustAccount", "state_machines.DistributionRequest", "state_machines.FeeAssessment"]
        distinguishing_aspect: "Newly created entities start in their declared initial states: TrustAccount DRAFT, DistributionRequest SUBMITTED, FeeAssessment CALCULATED."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust with income beneficiary and principal cash 2,000,000.00"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Init Trust", trust_type: "REVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000021", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id, st0: $.data.status } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 200000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
          trigger:
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 100000, allocation_source: "INCOME_ONLY", purpose_category: "OTHER", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { req: $.data.id } }
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${trust_id}", period_start: "2026-07-01", period_end: "2026-09-30", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { fee: $.data.id } }
          assert:
            - "TrustAccount started in DRAFT (captured st0 == DRAFT)"
            - "DistributionRequest.${req}.status == SUBMITTED"
            - "FeeAssessment.${fee}.status == CALCULATED and assessed_fee_cents == 437500"

      - name: terminal_document_rejected_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.TrustDocument.INTERPRETED_to_REJECTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED TrustDocument is terminal: a subsequent approve attempt is rejected with ERR_INVALID_STATE and no status change occurs."
        test_recipe:
          setup: ["DRAFT trust with a document that has been submitted, interpreted, then REJECTED"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Lockdown Trust", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000022", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/documents", payload: { trust_id: "${trust_id}", version_number: 1, summary: "v1" }, as: TrustOfficer, captures: { doc: $.data.id } }
            - { call: "POST /trusts/documents/${doc}/submit", as: TrustOfficer }
            - { call: "POST /trusts/documents/${doc}/interpret", payload: { per_stirpes: true, interpretation_notes: "notes" }, as: TrustOfficer }
            - { call: "POST /trusts/documents/${doc}/reject-interpretation", payload: { rejected_reason: "ambiguity in article 4" }, as: TrustExecutive }
          trigger:
            - { call: "POST /trusts/documents/${doc}/approve", as: TrustExecutive, captures: { err: $.data.error_id } }
          assert:
            - "Trigger fails: error_id == ERR_INVALID_STATE, http 409"
            - "TrustDocument.${doc}.status remains REJECTED and rejected_reason == 'ambiguity in article 4'"

      - name: disburse_submitted_request_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DistributionRequest.APPROVED_to_DISBURSED", "errors[ERR_REQUEST_NOT_APPROVED]"]
        distinguishing_aspect: "Disburse is only valid from APPROVED; from SUBMITTED it fails with ERR_REQUEST_NOT_APPROVED and posts no ledger rows."
        test_recipe:
          setup: ["ACTIVE HEMS trust; income beneficiary; income 50,000.00; a request in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Bad Disburse", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000023", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 5000000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 1000000, allocation_source: "INCOME_ONLY", purpose_category: "HEALTH", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { req: $.data.id } }
          trigger:
            - { call: "POST /trusts/distribution-requests/${req}/disburse", as: TrustOperationsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "Trigger fails: error_id == ERR_REQUEST_NOT_APPROVED, http 409"
            - "GET /trusts/ledger-entries?entry_kind=DISTRIBUTION returns total_count == 0"

      - name: vote_after_decision_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DistributionRequest.VOTING_to_APPROVED", "errors[ERR_REQUEST_NOT_VOTING]"]
        distinguishing_aspect: "Once the third APPROVE vote flips the request to APPROVED, a fourth member's vote is rejected with ERR_REQUEST_NOT_VOTING (idempotency of the decision point)."
        test_recipe:
          setup: ["ACTIVE HEMS trust; income beneficiary; four ACTIVE members; request 10,000.00 INCOME_ONLY already APPROVED 3-0"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Post Vote", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000024", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM One", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm1: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Two", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm2: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Three", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm3: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Four", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm4: $.data.id } }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 5000000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 1000000, allocation_source: "INCOME_ONLY", purpose_category: "HEALTH", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { req: $.data.id } }
            - { call: "POST /trusts/distribution-requests/${req}/start-review", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req}/open-voting", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm1}" }
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm2}" }
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm3}" }
          trigger:
            - { call: "POST /trusts/distribution-requests/${req}/vote", payload: { vote: "ABSTAIN" }, as: CommitteeMember, as_user_id: "${cm4}", captures: { err: $.data.error_id } }
          assert:
            - "Trigger fails: error_id == ERR_REQUEST_NOT_VOTING, http 409"
            - "DistributionRequest.${req}.status remains APPROVED and abstain_count == 0"

      - name: fee_post_then_reverse_restores_balances
        claim_type: side_effect_execution
        grounds: ["state_machines.FeeAssessment.POSTED_to_REVERSED", "calculations.account_balances"]
        distinguishing_aspect: "Compensation pattern: posting a fee debits both buckets; reversing it appends offsetting ADJUSTMENT rows and restores both balances to the exact pre-post cents (no drift)."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust; principal 2,000,000.00, income 10,000.00; FINAL fee assessment Q3 (fee 4,375.00, split 2,187.50/2,187.50) progressed to POSTED"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Reverse Trust", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "NY", ein: "04-0000025", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 200000000, value_date: "2026-08-05", description: "principal" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 1000000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${trust_id}", period_start: "2026-07-01", period_end: "2026-09-30", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { fee: $.data.id } }
            - { call: "POST /trusts/fee-assessments/${fee}/disclose", as: TrustOperationsOfficer, as_user_id: "ops_disc" }
            - { call: "POST /trusts/fee-assessments/${fee}/post", as: TrustOperationsOfficer, as_user_id: "ops_post" }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { inc_posted: $.data.income_balance_cents, pri_posted: $.data.principal_balance_cents } }
          trigger:
            - { call: "POST /trusts/fee-assessments/${fee}/reverse", payload: { reason: "billing error" }, as: TrustExecutive }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { inc_rev: $.data.income_balance_cents, pri_rev: $.data.principal_balance_cents } }
          assert:
            - "After post: income_balance_cents == 781250 and principal_balance_cents == 199781250"
            - "After reverse: income_balance_cents == 1000000 and principal_balance_cents == 200000000 (exactly restored)"
            - "FeeAssessment.${fee}.status == REVERSED; GET /trusts/ledger-entries?entry_kind=ADJUSTMENT shows two offsetting rows of +218750 (INCOME) and +218750 (PRINCIPAL)"

      - name: accept_without_approved_document_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.TrustAccount.UNDER_ACCEPTANCE_REVIEW_to_ACTIVE", "errors[ERR_DOCUMENT_NOT_APPROVED]"]
        distinguishing_aspect: "Guarded transition: acceptance requires an APPROVED TrustDocument; with only an INTERPRETED document the accept call fails with ERR_DOCUMENT_NOT_APPROVED."
        test_recipe:
          setup: ["Trust in UNDER_ACCEPTANCE_REVIEW; document INTERPRETED but never approved"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Guarded Accept", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000026", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/documents", payload: { trust_id: "${trust_id}", version_number: 1, summary: "v1" }, as: TrustOfficer, captures: { doc: $.data.id } }
            - { call: "POST /trusts/documents/${doc}/submit", as: TrustOfficer }
            - { call: "POST /trusts/documents/${doc}/interpret", payload: { per_stirpes: false, interpretation_notes: "ok" }, as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
          trigger:
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive, captures: { err: $.data.error_id } }
          assert:
            - "Trigger fails: error_id == ERR_DOCUMENT_NOT_APPROVED, http 409"
            - "TrustAccount.${trust_id}.status remains UNDER_ACCEPTANCE_REVIEW"

      - name: statement_dispute_regenerate_cycle
        claim_type: valid_transition
        grounds: ["state_machines.AnnualStatement.DELIVERED_to_DISPUTED", "state_machines.AnnualStatement.DISPUTED_to_DRAFT"]
        distinguishing_aspect: "Cyclic shape corner: DELIVERED -> DISPUTED -> DRAFT regeneration recomputes totals from the current ledger, so a statement generated before a late receipt shows the new totals after regeneration."
        test_recipe:
          setup:
            - "ACTIVE DISCRETIONARY trust; income beneficiary; INTEREST 10,000.00 posted 2026-08-06"
            - "Statement FY2026 FINALIZED and DELIVERED at clock 2026-09-01; beneficiary disputes within the window; a second INTEREST receipt of 5,000.00 (value_date 2026-09-10) is then posted"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Cycle Stmt", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000027", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 1000000, value_date: "2026-08-06", description: "interest 1" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/annual-statements", payload: { trust_id: "${trust_id}", fiscal_year: 2026 }, as: TrustOfficer, captures: { stmt: $.data.id } }
            - { call: "POST /trusts/annual-statements/${stmt}/finalize", as: TrustOfficer }
            - { call: "POST /trusts/annual-statements/${stmt}/deliver", as: TrustOfficer }
          trigger:
            - { call: "POST /trusts/annual-statements/${stmt}/dispute", payload: { dispute_reason: "missing receipt" }, as: Beneficiary, as_user_id: "${b_inc}" }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 500000, value_date: "2026-09-10", description: "interest 2" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/annual-statements/${stmt}/regenerate", as: TrustOfficer }
          assert:
            - "After dispute: status == DISPUTED (within the 30-day window from 2026-09-01)"
            - "The DISPUTED statement is NOT superseded by the new ledger append (only DRAFT/FINALIZED are)"
            - "After regenerate: status == DRAFT and receipts_income_cents == 1500000 and closing_income_cents == 1500000 (recomputed from current ledger)"

      - name: deceased_beneficiary_cannot_file_request
        claim_type: precondition_enforcement
        grounds: ["validations[priority=9]", "errors[ERR_BENEFICIARY_NOT_ACTIVE]"]
        distinguishing_aspect: "Referential gate at creation: a DECEASED beneficiary cannot file a new distribution request - ERR_BENEFICIARY_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust; sole income beneficiary marked DECEASED (per_stirpes=true document so no reallocation runs)"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Deceased File", trust_type: "TESTAMENTARY", grantor_name: "G", governing_state: "TX", ein: "04-0000028", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/documents", payload: { trust_id: "${trust_id}", version_number: 1, summary: "stirpes" }, as: TrustOfficer, captures: { doc: $.data.id } }
            - { call: "POST /trusts/documents/${doc}/submit", as: TrustOfficer }
            - { call: "POST /trusts/documents/${doc}/interpret", payload: { per_stirpes: true, interpretation_notes: "per stirpes" }, as: TrustOfficer }
            - { call: "POST /trusts/documents/${doc}/approve", as: TrustExecutive }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/beneficiaries/${b_inc}/mark-deceased", payload: { deceased_at: "2026-09-01" }, as: TrustOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
          trigger:
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 100000, allocation_source: "INCOME_ONLY", purpose_category: "OTHER", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { err: $.data.error_id } }
          assert:
            - "Trigger fails: error_id == ERR_BENEFICIARY_NOT_ACTIVE, http 409"

  - section: calculations
    instances:
      - name: receipt_split_rounding_rental
        claim_type: correct_result
        grounds: ["calculations.receipt_allocation"]
        distinguishing_aspect: "RENTAL_INCOME split rounding: income = round_half_up(100001 * 0.90) = 90001, principal takes the remainder 10000 - two ledger rows are appended, INCOME row first."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust, no other entries"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Rent Trust", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "CA", ein: "04-0000031", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
          trigger:
            - call: "POST /trusts/ledger-entries"
              payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "RENTAL_INCOME", amount_cents: 100001, value_date: "2026-08-10", description: "rent" }
              as: TrustOperationsOfficer
              captures: { row0_amount: "$.data[0].amount_cents", row0_bucket: "$.data[0].bucket", row1_amount: "$.data[1].amount_cents", row1_bucket: "$.data[1].bucket" }
          assert:
            - "Response is an array of 2 rows: [0] bucket INCOME amount_cents == 90001, [1] bucket PRINCIPAL amount_cents == 10000"
            - "TrustAccount.income_balance_cents == 90001 and principal_balance_cents == 10000 (sum == 100001, no cent created or destroyed)"

      - name: statement_totals_year_window_filtering
        claim_type: input_set_filtering
        grounds: ["calculations.statement_totals"]
        distinguishing_aspect: "Input-set filtering by fiscal-year window: a backdated 2025 receipt lands in opening balances, a 2026 receipt in receipts/closing, and a 2027 receipt is excluded from every FY2026 total."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust with INTEREST receipts: 7,000.00 dated 2025-12-15, 3,000.00 dated 2026-06-15, 9,000.00 dated 2027-01-05"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Window Stmt", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000032", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 700000, value_date: "2025-12-15", description: "prior year" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 300000, value_date: "2026-06-15", description: "in year" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 900000, value_date: "2027-01-05", description: "next year" }, as: TrustOperationsOfficer }
          trigger:
            - { call: "POST /trusts/annual-statements", payload: { trust_id: "${trust_id}", fiscal_year: 2026 }, as: TrustOfficer, captures: { stmt: $.data.id } }
          assert:
            - "AnnualStatement.${stmt}.opening_income_cents == 700000 (2025 receipt)"
            - "AnnualStatement.${stmt}.receipts_income_cents == 300000 (only the 2026 receipt)"
            - "AnnualStatement.${stmt}.closing_income_cents == 1000000 (2027 receipt excluded from every field)"
            - "TrustAccount.income_balance_cents == 1900000 (live balance includes all three)"

      - name: concentration_exact_edge_allowed_one_cent_over_rejected
        claim_type: threshold_boundary
        grounds: ["validations[priority=7]", "errors[ERR_CONCENTRATION_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Concentration threshold boundary: a holding at exactly 25% of TMV is allowed (strict > rule); one cent over (25,000,001 / 100,000,000) is rejected."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust funded 1,000,000.00 principal; no IPS (drift check is a no-op)"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Conc Trust", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000033", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 100000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv1: $.data.version } }
          trigger:
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "EDGE", units: 1, unit_price_cents: 25000000, expected_trust_account_version: "${tv1}" }, as: InvestmentManager, captures: { h_ok: $.data.id } }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv2: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "OVER", units: 1, unit_price_cents: 25000001, expected_trust_account_version: "${tv2}" }, as: InvestmentManager, captures: { err: $.data.error_id } }
          assert:
            - "First purchase (250,000.00 / 1,000,000.00 == exactly 25%) succeeds: InvestmentHolding.${h_ok}.market_value_cents == 25000000"
            - "Second purchase (250,000.01 / 1,000,000.00 > 25%) fails: error_id == ERR_CONCENTRATION_LIMIT_EXCEEDED, http 422"

      - name: election_65day_amount_and_overflow
        claim_type: correct_result
        grounds: ["calculations.dni_and_distribution_deduction", "errors[ERR_INVALID_ELECTION_AMOUNT]"]
        distinguishing_aspect: "65-day rule: a distribution disbursed 2027-02-15 (inside [2027-01-01, 2027-03-06]) is electable into tax year 2026; electing 100,000 raises the deduction from 500,000 to 600,000, and electing 100,001 (one cent over the eligible window sum) fails."
        test_recipe:
          setup:
            - "ACTIVE DISCRETIONARY trust; income beneficiary; five members; 2026 INTEREST receipts totalling 15,000.00; no fees"
            - "Distribution 5,000.00 disbursed with clock 2026-11-10; distribution 1,000.00 disbursed with clock 2027-02-15"
            - "TaxReturnFiling 2026 in DATA_COLLECTION"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Election Trust", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "NY", ein: "04-0000034", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM One", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm1: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Two", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm2: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Three", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm3: $.data.id } }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 1500000, value_date: "2026-06-15", description: "income" }, as: TrustOperationsOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-10T00:00:00Z" }, as: TrustExecutive }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv1: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 500000, allocation_source: "INCOME_ONLY", purpose_category: "OTHER", expected_trust_account_version: "${tv1}" }, as: TrustOfficer, captures: { r1: $.data.id } }
            - { call: "POST /trusts/distribution-requests/${r1}/start-review", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${r1}/open-voting", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${r1}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm1}" }
            - { call: "POST /trusts/distribution-requests/${r1}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm2}" }
            - { call: "POST /trusts/distribution-requests/${r1}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm3}" }
            - { call: "POST /trusts/distribution-requests/${r1}/disburse", as: TrustOperationsOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-15T00:00:00Z" }, as: TrustExecutive }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv2: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 100000, allocation_source: "INCOME_ONLY", purpose_category: "OTHER", expected_trust_account_version: "${tv2}" }, as: TrustOfficer, captures: { r2: $.data.id } }
            - { call: "POST /trusts/distribution-requests/${r2}/start-review", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${r2}/open-voting", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${r2}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm1}" }
            - { call: "POST /trusts/distribution-requests/${r2}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm2}" }
            - { call: "POST /trusts/distribution-requests/${r2}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm3}" }
            - { call: "POST /trusts/distribution-requests/${r2}/disburse", as: TrustOperationsOfficer }
            - { call: "POST /trusts/tax-return-filings", payload: { trust_id: "${trust_id}", tax_year: 2026 }, as: TaxSpecialist, captures: { fil: $.data.id } }
          trigger:
            - { call: "POST /trusts/tax-return-filings/${fil}/prepare", payload: { elected_65day_amount_cents: 100001 }, as: TaxSpecialist, as_user_id: "tax_a", captures: { err: $.data.error_id } }
            - { call: "POST /trusts/tax-return-filings/${fil}/prepare", payload: { elected_65day_amount_cents: 100000 }, as: TaxSpecialist, as_user_id: "tax_a" }
          assert:
            - "First prepare fails: error_id == ERR_INVALID_ELECTION_AMOUNT (100,001 > 100,000 disbursed in the window), http 422"
            - "Second prepare succeeds: dni_cents == 1500000, distribution_deduction_cents == 600000 (500,000 in-year + 100,000 elected)"
            - "trust_taxable_income_cents == 870000 (1500000 - 600000 - 30000)"

      - name: fee_min_floor_at_low_base
        claim_type: constants_applied
        grounds: ["calculations.trustee_fee_assessment"]
        excluded_because:
          difficulty_instance: combinatorial_formula / trustee_fee_tiered_min_split
          rationale: "The MIN_QUARTERLY_FEE_CENTS floor (125,000 replacing a raw 25,000) is asserted directly in the named difficulty instance (trust B)."

  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1 beats everything: a call without X-User-Role/X-User-ID headers fails with ERR_UNAUTHENTICATED (401) even when the payload is otherwise valid."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /trusts", payload: { trust_name: "NoAuth", trust_type: "REVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000041", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, captures: { err: $.data.error_id } }
          assert:
            - "Trigger fails: error_id == ERR_UNAUTHENTICATED, http 401"

      - name: sod_fee_discloser_cannot_post
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties on FeeAssessment: the same operations user who disclosed cannot post; a different operations user can."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust, principal 2,000,000.00; FINAL Q3 fee assessment DISCLOSED by ops_same"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "SoD Fee", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "NY", ein: "04-0000042", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 200000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${trust_id}", period_start: "2026-07-01", period_end: "2026-09-30", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { fee: $.data.id } }
            - { call: "POST /trusts/fee-assessments/${fee}/disclose", as: TrustOperationsOfficer, as_user_id: "ops_same" }
          trigger:
            - { call: "POST /trusts/fee-assessments/${fee}/post", as: TrustOperationsOfficer, as_user_id: "ops_same", captures: { err: $.data.error_id } }
            - { call: "POST /trusts/fee-assessments/${fee}/post", as: TrustOperationsOfficer, as_user_id: "ops_other" }
          assert:
            - "First trigger fails: error_id == ERR_SEGREGATION_OF_DUTIES, http 403"
            - "Second trigger (different user) succeeds: FeeAssessment.${fee}.status == POSTED"

      - name: sod_tax_preparer_cannot_review
        claim_type: violation_to_error
        grounds: ["state_machines.TaxReturnFiling.UNDER_REVIEW_to_FILED", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties on TaxReturnFiling: the preparer cannot approve their own return for filing."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust with one INTEREST receipt; filing 2026 in UNDER_REVIEW prepared by tax_lead"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "SoD Tax", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "NY", ein: "04-0000043", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 1000000, value_date: "2026-09-01", description: "income" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/tax-return-filings", payload: { trust_id: "${trust_id}", tax_year: 2026 }, as: TaxSpecialist, captures: { fil: $.data.id } }
            - { call: "POST /trusts/tax-return-filings/${fil}/prepare", payload: { elected_65day_amount_cents: 0 }, as: TaxSpecialist, as_user_id: "tax_lead" }
            - { call: "POST /trusts/tax-return-filings/${fil}/submit-for-review", as: TaxSpecialist, as_user_id: "tax_lead" }
          trigger:
            - { call: "POST /trusts/tax-return-filings/${fil}/approve-review", as: TaxSpecialist, as_user_id: "tax_lead", captures: { err: $.data.error_id } }
            - { call: "POST /trusts/tax-return-filings/${fil}/approve-review", as: TaxSpecialist, as_user_id: "tax_peer" }
          assert:
            - "First trigger fails: error_id == ERR_SEGREGATION_OF_DUTIES, http 403"
            - "Second trigger (peer reviewer) succeeds: status == FILED and reviewed_by_user_id == 'tax_peer'"

      - name: sod_termination_initiator_cannot_approve_accounting
        claim_type: violation_to_error
        grounds: ["state_machines.TerminationCase.TAX_CLEARANCE_RECEIVED_to_FINAL_ACCOUNTING_APPROVED", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties on TerminationCase: the executive who initiated the termination cannot approve the final accounting; another executive can."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust with principal 10,000.00; TerminationCase in TAX_CLEARANCE_RECEIVED, initiated by exec_founder (terminate called with that user id); reserves 1,000.00 + 1,000.00"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "SoD Term", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "TX", ein: "04-0000044", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 1000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/${trust_id}/terminate", payload: { reason: "settlor directed" }, as: TrustExecutive, as_user_id: "exec_founder" }
            - { call: "GET /trusts/termination-cases", payload: { trust_id: "${trust_id}" }, as: TrustOfficer, captures: { case_id: "$.data[0].id" } }
            - { call: "POST /trusts/termination-cases/${case_id}/reserve-liabilities", payload: { reserve_taxes_cents: 100000, reserve_fees_cents: 100000 }, as: TrustOfficer }
            - { call: "POST /trusts/termination-cases/${case_id}/record-tax-clearance", as: TaxSpecialist }
          trigger:
            - { call: "POST /trusts/termination-cases/${case_id}/approve-final-accounting", as: TrustExecutive, as_user_id: "exec_founder", captures: { err: $.data.error_id } }
            - { call: "POST /trusts/termination-cases/${case_id}/approve-final-accounting", as: TrustExecutive, as_user_id: "exec_second" }
          assert:
            - "First trigger fails: error_id == ERR_SEGREGATION_OF_DUTIES, http 403"
            - "Second trigger succeeds: TerminationCase.${case_id}.status == FINAL_ACCOUNTING_APPROVED"

      - name: duplicate_vote_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_VOTE]"]
        distinguishing_aspect: "Aggregate uniqueness: one vote per (request, member); the second vote by the same member fails with ERR_DUPLICATE_VOTE even though the request is still VOTING."
        test_recipe:
