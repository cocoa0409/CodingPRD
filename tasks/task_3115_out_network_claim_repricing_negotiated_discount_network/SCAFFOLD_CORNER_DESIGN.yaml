        grounds:
          - validations[priority=9]
          - errors[ERR_NEGOTIATION_REQUIRED]
        distinguishing_aspect: "When the selected policy methodology is NEGOTIATION_REQUIRED (and the claim is not NSA-flagged), reprice is rejected 422 ERR_NEGOTIATION_REQUIRED and the claim stays PENDING_LINES — the claim must go through the negotiation flow instead."
