              captures: { proto_id: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/consent-documents"
              payload: { file_ref: "s3://consent/vote-v1.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { cd_id: $.data.id }
            - call: "POST /irb/consent-documents/${cd_id}/review"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${proto_id}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${proto_id}/determinations"
              payload: { determined_review_level: "FULL_BOARD" }
              as: IrbCoordinator
            - call: "POST /irb/board-meetings"
              payload: { room_id: "R-VOTE", scheduled_at: "2026-06-01T10:00:00Z", duration_minutes: 120 }
              as: IrbCoordinator
              captures: { mtg: $.data.id, mtg_v: $.data.version }
            - call: "POST /irb/board-meetings/${mtg}/agenda-items"
              payload: { protocol_id: "${proto_id}", expected_meeting_version: "${mtg_v}" }
              as: IrbCoordinator
              captures: { item: $.data.id }
          trigger:
            - call: "POST /irb/agenda-items/${item}/vote"
              payload: { motion: "APPROVE", votes_for: 3, votes_against: 0, votes_abstain: 0 }
              as: IrbChair
