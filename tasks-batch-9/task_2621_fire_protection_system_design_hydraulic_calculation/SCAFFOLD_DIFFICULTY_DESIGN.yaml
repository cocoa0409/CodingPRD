  # =====================================================================
  # RULE 8 - resource_temporal_overlap
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: witness_calendar_closed_interval_with_sixty_minute_buffer_rejects_exact_gap
        grounds:
          - validations[priority=40]
          - state_machines.AcceptanceTest.NOT_SCHEDULED_to_SCHEDULED
          - entities.AcceptanceTest.fields.witness_window_start
          - entities.AcceptanceTest.fields.witness_window_end
          - errors.ERR_WITNESS_WINDOW_CONFLICT
        distinguishing_aspect: |
          The reviewer's calendar is a CLOSED interval inflated by WITNESS_BUFFER_MINUTES 60 of travel
          on both sides, so a candidate that starts exactly 60 minutes after an existing window ends
          collides and one that starts 61 minutes after does not. 12:00Z against an existing window
          ending 11:00Z is refused; 12:01Z is accepted. This is the opposite convention to the outage
          windows in the same scaffold, which are half-open and where touching endpoints are legal, so
          an implementation that shares one overlap helper between the two fails one of them.
