scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: adoption_fee_waterfall_credit_first_vs_waiver_first
        grounds:
          - calculations.adoption_fee_waterfall
          - calculations.adoption_base_fee
          - calculations.adoption_waiver_selection
          - calculations.adoption_sponsorship_pool
          - entities.Adoption.fields.credit_application_order
          - entities.Adoption.fields.residual_credit_cents
        distinguishing_aspect: |
          This dual variant lives on the Adoption money domain: with identical base fee 25000,
          identical SENIOR waiver 0.60 and identical designated sponsorship 20000, CREDIT_FIRST
          charges the adopter 2000 and leaves 0 residual credit, while WAIVER_FIRST charges the
          adopter 0 and leaves 10000 residual credit.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "One SHELTER organization, one adopter Person and one donor Person."
            - "Two senior DOG animals born 2018-01-01, each OWNER_SURRENDER intaken on 2026-05-01 so their hold latched HOLD_EXPIRED, each already ALTERED by a completed SPAY_NEUTER record."
            - "Each animal carries exactly one animal-designated Contribution of 20000 cents with available_cents 20000."
            - "Each animal has one AdoptionApplication in status APPROVED, screened by user 'counselor-1'."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR", default_methodology: "SAC" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Dana Reed", email: "dana@example.test", youngest_child_age_years: 99, resident_cat_count: 0, resident_dog_count: 0, housing_type: "HOUSE", has_fenced_yard: true }
              as: PlatformAdmin
              captures: { adopter_id: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Gil Marsh", email: "gil@example.test" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Rex", species: "DOG", size_class: "LARGE", weight_lb: 65.0, date_of_birth: "2018-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: PlatformAdmin
              captures: { animal_a_id: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Bruno", species: "DOG", size_class: "LARGE", weight_lb: 66.0, date_of_birth: "2018-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: PlatformAdmin
              captures: { animal_b_id: $.data.id }
            - call: "POST /rescue/animals/${animal_a_id}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { intake_a_id: $.data.id }
            - call: "POST /rescue/animals/${animal_b_id}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { intake_b_id: $.data.id }
            - call: "POST /rescue/animals/${animal_a_id}/medical-records"
              payload: { procedure_type: "SPAY_NEUTER", expense_category: "SPAY_NEUTER", cost_cents: 0, scheduled_at: "2026-05-01T00:00:00Z", funding_required: false }
              as: PlatformAdmin
              captures: { med_a_id: $.data.id }
            - call: "POST /rescue/medical-records/${med_a_id}/complete"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rescue/animals/${animal_b_id}/medical-records"
              payload: { procedure_type: "SPAY_NEUTER", expense_category: "SPAY_NEUTER", cost_cents: 0, scheduled_at: "2026-05-01T00:00:00Z", funding_required: false }
              as: PlatformAdmin
              captures: { med_b_id: $.data.id }
            - call: "POST /rescue/medical-records/${med_b_id}/complete"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rescue/contributions"
              payload: { donor_person_id: "${donor_id}", amount_cents: 20000, donor_reference: "SPON-A", designated_animal_id: "${animal_a_id}", designated_program: "NONE", restriction_category: "UNRESTRICTED" }
              as: PlatformAdmin
              captures: { contrib_a_id: $.data.id }
            - call: "POST /rescue/contributions"
              payload: { donor_person_id: "${donor_id}", amount_cents: 20000, donor_reference: "SPON-B", designated_animal_id: "${animal_b_id}", designated_program: "NONE", restriction_category: "UNRESTRICTED" }
              as: PlatformAdmin
              captures: { contrib_b_id: $.data.id }
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/adoption-applications"
              payload: { animal_id: "${animal_a_id}", applicant_person_id: "${adopter_id}" }
              as: PlatformAdmin
              captures: { app_a_id: $.data.id }
            - call: "POST /rescue/adoption-applications"
              payload: { animal_id: "${animal_b_id}", applicant_person_id: "${adopter_id}" }
              as: PlatformAdmin
              captures: { app_b_id: $.data.id }
            - call: "POST /rescue/adoption-applications/${app_a_id}/screen"
              payload: { decision: "APPROVE" }
              as: AdoptionCounselor
              as_user_id: "counselor-1"
            - call: "POST /rescue/adoption-applications/${app_b_id}/screen"
              payload: { decision: "APPROVE" }
              as: AdoptionCounselor
              as_user_id: "counselor-1"
            - call: "GET /rescue/animals/${animal_a_id}"
              payload: {}
              as: PlatformAdmin
              captures: { animal_a_v: $.data.version }
            - call: "GET /rescue/animals/${animal_b_id}"
              payload: {}
              as: PlatformAdmin
              captures: { animal_b_v: $.data.version }
          trigger:
            - call: "POST /rescue/adoptions"
              payload: { adoption_application_id: "${app_a_id}", expected_animal_version: "${animal_a_v}", credit_application_order: "CREDIT_FIRST", refund_basis: "FEE_PAID", deposit_basis: "FLAT" }
              as: AdoptionCounselor
              as_user_id: "counselor-2"
              captures: { adopt_a_id: $.data.id }
            - call: "POST /rescue/adoptions"
              payload: { adoption_application_id: "${app_b_id}", expected_animal_version: "${animal_b_v}", credit_application_order: "WAIVER_FIRST", refund_basis: "FEE_PAID", deposit_basis: "FLAT" }
              as: AdoptionCounselor
              as_user_id: "counselor-2"
              captures: { adopt_b_id: $.data.id }
          assert:
            - "Adoption.${adopt_a_id}.base_fee_cents == 25000"
            - "Adoption.${adopt_a_id}.waiver_kind == SENIOR"
            - "Adoption.${adopt_a_id}.sponsorship_applied_cents == 20000"
            - "Adoption.${adopt_a_id}.waiver_applied_cents == 3000"
            - "Adoption.${adopt_a_id}.adopter_charged_cents == 2000"
            - "Adoption.${adopt_a_id}.residual_credit_cents == 0"
            - "Adoption.${adopt_a_id}.alteration_deposit_cents == 0"
            - "Adoption.${adopt_b_id}.base_fee_cents == 25000"
            - "Adoption.${adopt_b_id}.waiver_kind == SENIOR"
            - "Adoption.${adopt_b_id}.waiver_applied_cents == 15000"
            - "Adoption.${adopt_b_id}.sponsorship_applied_cents == 10000"
            - "Adoption.${adopt_b_id}.adopter_charged_cents == 0"
            - "Adoption.${adopt_b_id}.residual_credit_cents == 10000"
            - "Adoption.${adopt_a_id}.adopter_charged_cents != Adoption.${adopt_b_id}.adopter_charged_cents"
            - "Adoption.${adopt_a_id}.sponsorship_applied_cents + Adoption.${adopt_a_id}.waiver_applied_cents + Adoption.${adopt_a_id}.adopter_charged_cents == 25000"
            - "Adoption.${adopt_b_id}.sponsorship_applied_cents + Adoption.${adopt_b_id}.waiver_applied_cents + Adoption.${adopt_b_id}.adopter_charged_cents == 25000"

      - name: live_release_rate_sac_vs_asilomar_denominator
        grounds:
          - calculations.live_release_rate
          - entities.OutcomeRecord.fields.outcome_type
          - entities.OutcomeRecord.fields.is_live_release
          - endpoints["GET /rescue/reports/live-release-rate"]
        distinguishing_aspect: |
          This dual variant lives on the OutcomeRecord reporting domain, not on money: over the
          identical set of four outcomes (1 ADOPTION, 1 EUTHANASIA_MEDICAL, 2
          EUTHANASIA_OWNER_REQUESTED) SAC reports denominator 4 and rate 0.25 while ASILOMAR
          reports denominator 2 and rate 0.5.
        test_recipe:
          setup:
            - "Clock at 2026-05-10T00:00:00Z."
            - "Four DOG animals, each OWNER_SURRENDER intaken on 2026-05-01, each holding exactly one standing OutcomeRecord recorded on 2026-05-10."
            - "Outcome types are ADOPTION, EUTHANASIA_MEDICAL, EUTHANASIA_OWNER_REQUESTED and EUTHANASIA_OWNER_REQUESTED."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR", default_methodology: "SAC" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Ivy Chen", email: "ivy@example.test" }
              as: PlatformAdmin
              captures: { counterparty_id: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "A1", species: "DOG", size_class: "SMALL", weight_lb: 20.0, date_of_birth: "2020-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "A2", species: "DOG", size_class: "SMALL", weight_lb: 21.0, date_of_birth: "2020-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: PlatformAdmin
              captures: { a2: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "A3", species: "DOG", size_class: "SMALL", weight_lb: 22.0, date_of_birth: "2020-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: PlatformAdmin
              captures: { a3: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "A4", species: "DOG", size_class: "SMALL", weight_lb: 23.0, date_of_birth: "2020-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: PlatformAdmin
              captures: { a4: $.data.id }
            - call: "POST /rescue/animals/${a1}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/animals/${a2}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/animals/${a3}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/animals/${a4}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/animals/${a1}/outcomes"
              payload: { outcome_type: "ADOPTION", counterparty_person_id: "${counterparty_id}" }
              as: PlatformAdmin
            - call: "POST /rescue/animals/${a2}/outcomes"
              payload: { outcome_type: "EUTHANASIA_MEDICAL" }
              as: PlatformAdmin
            - call: "POST /rescue/animals/${a3}/outcomes"
              payload: { outcome_type: "EUTHANASIA_OWNER_REQUESTED" }
              as: PlatformAdmin
            - call: "POST /rescue/animals/${a4}/outcomes"
              payload: { outcome_type: "EUTHANASIA_OWNER_REQUESTED" }
              as: PlatformAdmin
          trigger:
            - call: "GET /rescue/reports/live-release-rate"
              payload: { from_date: "2026-05-01", to_date: "2026-05-31", methodology: "SAC" }
              as: PlatformAdmin
              captures: { sac_rate: $.data.live_release_rate, sac_den: $.data.denominator }
            - call: "GET /rescue/reports/live-release-rate"
              payload: { from_date: "2026-05-01", to_date: "2026-05-31", methodology: "ASILOMAR" }
              as: PlatformAdmin
              captures: { asi_rate: $.data.live_release_rate, asi_den: $.data.denominator }
          assert:
            - "sac_den == 4"
            - "sac_rate == 0.25"
            - "asi_den == 2"
            - "asi_rate == 0.5"
            - "the SAC response's live_outcome_count == 1 and non_live_outcome_count == 3"
            - "both responses report owner_requested_euthanasia_count == 2"

  - rule_id: combinatorial_formula
    instances:
      - name: medical_funding_per_line_overhead_rounding_mode_b
        grounds:
          - calculations.medical_cost_funding_allocation
          - calculations.organization_balance_derivation
          - entities.MedicalRecord.fields.admin_overhead_cents
          - entities.Contribution.fields.applied_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-draw-line-then-sum, so three draw
          lines of 3333, 3333 and 3334 cents at 8 percent yield 267 + 267 + 267 = 801 cents of
          overhead, whereas rounding the 10000-cent total once would yield 800.
        test_recipe:
          setup:
            - "Clock advanced between each contribution so their created_at values are strictly increasing."
            - "Three MEDICAL-restricted Contributions of 3333, 3333 and 10000 cents, created in that order, all undesignated."
            - "One TREATMENT MedicalRecord on an in-custody animal with expense_category MEDICAL, cost_cents 10000 and funding_required true."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Gil Marsh", email: "gil@example.test" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Pixel", species: "CAT", size_class: "SMALL", weight_lb: 9.0, date_of_birth: "2024-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: PlatformAdmin
              captures: { animal_id: $.data.id }
            - call: "POST /rescue/animals/${animal_id}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/contributions"
              payload: { donor_person_id: "${donor_id}", amount_cents: 3333, donor_reference: "M-001", restriction_category: "MEDICAL", designated_program: "NONE" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/contributions"
              payload: { donor_person_id: "${donor_id}", amount_cents: 3333, donor_reference: "M-002", restriction_category: "MEDICAL", designated_program: "NONE" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/contributions"
              payload: { donor_person_id: "${donor_id}", amount_cents: 10000, donor_reference: "M-003", restriction_category: "MEDICAL", designated_program: "NONE" }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /rescue/animals/${animal_id}/medical-records"
              payload: { procedure_type: "TREATMENT", expense_category: "MEDICAL", cost_cents: 10000, scheduled_at: "2026-05-02T03:00:00Z", funding_required: true }
              as: PlatformAdmin
              captures: { med_id: $.data.id }
          trigger:
            - call: "POST /rescue/medical-records/${med_id}/complete"
              payload: {}
              as: PlatformAdmin
          assert:
            - "MedicalRecord.${med_id}.status == COMPLETED"
            - "MedicalRecord.${med_id}.funded_amount_cents == 10000"
            - "MedicalRecord.${med_id}.admin_overhead_cents == 801"
            - "Contribution.${c1}.applied_cents == 3333"
            - "Contribution.${c1}.available_cents == 0"
            - "Contribution.${c1}.status == FULLY_APPLIED"
            - "Contribution.${c2}.applied_cents == 3333"
            - "Contribution.${c2}.status == FULLY_APPLIED"
            - "Contribution.${c3}.applied_cents == 3334"
            - "Contribution.${c3}.available_cents == 6666"
            - "Contribution.${c3}.status == PARTIALLY_APPLIED"
            - "Organization.${org_id}.unrestricted_balance_cents == -801"
            - "Organization.${org_id}.restricted_balance_cents == 6666"

      - name: reclaim_hardship_waiver_keyed_on_pre_waiver_total_mode_c
        grounds:
          - calculations.reclaim_total_with_hardship_waiver
          - calculations.impound_tiered_subtotal
          - calculations.repeat_offense_multiplier_selection
          - entities.Person.fields.hardship_certified
          - entities.IntakeRecord.fields.hardship_waiver_cents
        distinguishing_aspect: |
          Mode (c) circular evaluation: the waiver is keyed on the pre-waiver total which is
          itself a function of the waiver's own output field, so the scaffold pins step2 as the
          key. A hardship-certified owner whose pre-waiver total is 27000 receives the 2000
          waiver and pays 25000, while an equally hardship-certified owner whose pre-waiver total
          is only 9000 receives no waiver at all and pays 9000.
        test_recipe:
          setup:
            - "Clock at 2026-05-18T14:00:00Z at reclaim time."
            - "Owner P1 and owner P2 are both hardship_certified with reclaim_history_count 0."
            - "Animal X was STRAY intaken on 2026-05-10T09:00:00Z with impound_billing_basis CALENDAR_DAY."
            - "Animal Y was STRAY intaken on 2026-05-16T09:00:00Z with impound_billing_basis CALENDAR_DAY."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Pat Ling", email: "pat@example.test", hardship_certified: true }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Quinn Ade", email: "quinn@example.test", hardship_certified: true }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Scout", species: "DOG", size_class: "MEDIUM", weight_lb: 40.0, date_of_birth: "2022-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: PlatformAdmin
              captures: { animal_x: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Tilly", species: "DOG", size_class: "MEDIUM", weight_lb: 41.0, date_of_birth: "2022-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: PlatformAdmin
              captures: { animal_y: $.data.id }
            - call: "POST /rescue/animals/${animal_x}/intake-records"
              payload: { intake_type: "STRAY", intake_datetime: "2026-05-10T09:00:00Z", source_person_id: "${p1}", impound_billing_basis: "CALENDAR_DAY" }
              as: PlatformAdmin
              captures: { intake_x: $.data.id }
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/animals/${animal_y}/intake-records"
              payload: { intake_type: "STRAY", intake_datetime: "2026-05-16T09:00:00Z", source_person_id: "${p2}", impound_billing_basis: "CALENDAR_DAY" }
              as: PlatformAdmin
              captures: { intake_y: $.data.id }
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-18T14:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rescue/intake-records/${intake_x}/reclaim"
              payload: { reclaiming_person_id: "${p1}" }
              as: PlatformAdmin
              captures: { outcome_x: $.data.id }
            - call: "POST /rescue/intake-records/${intake_y}/reclaim"
              payload: { reclaiming_person_id: "${p2}" }
              as: PlatformAdmin
              captures: { outcome_y: $.data.id }
          assert:
            - "IntakeRecord.${intake_x}.impound_billable_days == 9"
            - "IntakeRecord.${intake_x}.impound_subtotal_cents == 22500"
            - "IntakeRecord.${intake_x}.repeat_offense_multiplier == 1.0"
            - "IntakeRecord.${intake_x}.hardship_waiver_cents == 2000"
            - "IntakeRecord.${intake_x}.reclaim_total_cents == 25000"
            - "IntakeRecord.${intake_y}.impound_billable_days == 3"
            - "IntakeRecord.${intake_y}.impound_subtotal_cents == 4500"
            - "IntakeRecord.${intake_y}.hardship_waiver_cents == 0"
            - "IntakeRecord.${intake_y}.reclaim_total_cents == 9000"
            - "OutcomeRecord.${outcome_x}.outcome_type == RETURN_TO_OWNER"
            - "OutcomeRecord.${outcome_y}.outcome_type == RETURN_TO_OWNER"

  - rule_id: non_linear_state_machine
    instances:
      - name: foster_application_parallel_axes_advance_independently
        grounds:
          - state_machines.FosterApplication.SUBMITTED_to_APPROVED
          - state_machines.FosterApplication.APPROVED_to_SUSPENDED
          - state_machines.FosterApplication.SUSPENDED_to_APPROVED
          - state_machines.FosterApplication.PASSED_to_LAPSED
          - calculations.home_check_expiry
        distinguishing_aspect: |
          FosterApplication carries two genuinely parallel axes: the SUSPEND/RESUME cycle on
          application_status leaves home_check_status at PASSED untouched, and the 180-day lapse
          of home_check_status leaves application_status at APPROVED untouched.
        test_recipe:
          setup:
            - "One foster Person, one FosterHome and one FosterApplication for species DOG."
            - "The application was APPROVED on 2026-05-01 and its home check PASSED with checked_at 2026-05-02, giving home_check_expires_at 2026-10-29T00:00:00Z."
            - "The application was then SUSPENDED on 2026-05-03 while the home check was still PASSED."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
