              payload: { project_id: "${p_id}", investigator_id: "${inv_b_id}", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z", expected_project_version: "${p_ver_fresh}" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { g_b_id: $.data.id }
          assert:
            - "trigger call 1 returns 404 ERR_INVESTIGATOR_NOT_FOUND, never 412 ERR_STALE_VERSION"
            - "trigger call 2 returns 412 ERR_STALE_VERSION"
            - "no ControlledAccessGrant row was created by trigger calls 1 or 2 and Project.${p_id}.version is unchanged by them"
            - "trigger call 4 returns 201 with status REQUESTED and peak_concurrency_at_request == 2"
            - "Project.${p_id}.version increased by exactly 1 across trigger calls 1 through 4"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ownership_control_threshold_inclusive_at_50_00_pct
        grounds:
          - calculations.organization_effective_designation
          - entities.ForeignOrganization.fields.parent_ownership_pct
          - entities.ForeignOrganization.fields.effective_designation
          - entities.ForeignOrganization.fields.effective_designation_depth
        distinguishing_aspect: |
          CONTROL_THRESHOLD_PCT is 50 and the comparison is >=, evaluated at two decimal places:
          a 50.00% stake inherits the parent's SDN designation at depth 1, while 49.99% breaks the
          chain of control and leaves the child NONE at depth 0. A strict > comparison, or a
          rounded-to-integer comparison that turns 49.99 into 50, gets one of the two rows wrong.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "ORG_SDN with own_designation SDN and no parent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Northline State Holdings", country_code: "RU", org_type: "GOVERNMENT_AGENCY", own_designation: "SDN", designated_on: "2025-03-01T00:00:00Z" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_sdn_id: $.data.id }
          trigger:
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Northline Precision Works", country_code: "RU", org_type: "COMPANY", own_designation: "NONE", parent_organization_id: "${org_sdn_id}", parent_ownership_pct: 50.00 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_at_id: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Northline Optical Works", country_code: "RU", org_type: "COMPANY", own_designation: "NONE", parent_organization_id: "${org_sdn_id}", parent_ownership_pct: 49.99 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_below_id: $.data.id }
          assert:
            - "ForeignOrganization.${org_at_id}.effective_designation == SDN and effective_designation_depth == 1"
            - "ForeignOrganization.${org_below_id}.effective_designation == NONE and effective_designation_depth == 0"
            - "ForeignOrganization.${org_at_id}.own_designation == NONE (imputation never rewrites the direct designation)"
            - "GET /foreign-organizations/${org_sdn_id}/subsidiaries returns both rows"

      - name: training_expiry_inclusive_at_the_due_instant
        grounds:
          - calculations.training_assignment_status
          - entities.TrainingAssignment.fields.status
          - entities.Investigator.fields.training_compliant
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          The deadline comparison is clock >= due_on, so the assignment is still ASSIGNED one
          second before due_on and EXPIRED at the exact due instant, and the investigator's
          training_compliant flag flips on that same tick because the status is recomputed on
          every read rather than stored. A strict > comparison keeps the assignment ASSIGNED at
          the boundary and leaves training_compliant true.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "Investigator INV with one institution-wide RESEARCH_SECURITY_BASE assignment due 2026-09-01T00:00:00Z and no completion or waiver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigators"
              payload: { full_name: "Nia Obi", email: "nia.obi@uni.edu", appointment_type: "RESEARCH_STAFF", home_department: "Public Health", institutional_base_effort_pct: 0 }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /training-assignments"
              payload: { investigator_id: "${inv_id}", course_code: "RESEARCH_SECURITY_BASE", due_on: "2026-09-01T00:00:00Z" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { train_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T23:59:59Z" }
              as: SystemAdmin
            - call: "GET /training-assignments/${train_id}"
              payload: {}
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /training-assignments/${train_id}"
              payload: {}
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
          assert:
            - "trigger call 2 returns status == ASSIGNED with assigned_on == 2026-08-01T00:00:00Z, completed_on null and waived_on null"
            - "Investigator.${inv_id}.training_compliant == true at the 2026-08-31T23:59:59Z clock"
            - "trigger call 4 returns status == EXPIRED for the identical row one second later"
            - "Investigator.${inv_id}.training_compliant == false at the 2026-09-01T00:00:00Z clock"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: grant_activation_depends_on_project_security_and_investigator_posture_and_plan
        grounds:
          - state_machines.ControlledAccessGrant.REQUESTED_to_ACTIVE
          - state_machines.Disclosure.plan_status.PLAN_ISSUED_to_PLAN_ACKNOWLEDGED
          - calculations.investigator_risk_score
          - calculations.investigator_disclosure_posture
          - errors.ERR_PROJECT_NOT_CLEARED
          - errors.ERR_INVESTIGATOR_POSTURE_BLOCKS_ACCESS
        distinguishing_aspect: |
          The same activation request is refused for a reason living on the Project, then for a
          reason living on the Investigator, then accepted because a THIRD entity — the
          Disclosure's independent plan dimension — subtracts the 20-point PLAN_CREDIT and moves
          risk_score from 60 to 40, crossing RESTRICT_SCORE downward. Nothing about the grant row
          itself ever changes; an implementation that snapshots eligibility on the grant cannot
          reproduce the final success.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "ORG_SDN with own_designation SDN."
            - "Investigator INV with a COMPLETED CONTROLLED_AREA_SAFETY assignment and an ACTIVE personnel row on project P (controlled_area_capacity 1, security PENDING_CLEARANCE)."
            - "Disclosure D in SUBMITTED with one paid TALENT_PROGRAM item on ORG_SDN still in DECLARED, so risk_score is 0 for now."
            - "ControlledAccessGrant G for INV on P in REQUESTED over [2026-09-01, 2026-12-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
