            - call: "POST /franchise-system/stores"
              payload: { store_code: "CST4", site_id: "${csite4}", operator_id: "${cop4}", expected_operator_version: "${cop4_v}" }
              as: FranchisorAdmin
              captures: { cst4: $.data.id }
            - call: "POST /franchise-system/agreements"
