        distinguishing_aspect: |
          Attendance 14999 with an event is NONE, exactly 15000 is ELEVATED (12500 bp, 1 extra vessel) and
          exactly 30000 is PEAK (15000 bp, 2 extra vessels); attendance 50000 with a null event_name stays NONE.
