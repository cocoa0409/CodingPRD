  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- Room: half-open, adjacency at buffer edge is OK; overlap inside buffer rejected ---
      - name: rto_room_half_open_buffer_overlap
        grounds:
          - calculations.room_window_occupancy
          - entities.Room.fields.buffer_minutes
          - state_machines.Booking.QUOTE_DRAFT_to_HELD
          - validations[priority=10]
        distinguishing_aspect: |
          On a Room (half-open intervals incl buffer), a second hold starting 12:15 (inside the first
          booking's [10:00,12:30) buffer) is rejected ERR_ROOM_WINDOW_CONFLICT; the geometry treats the
          buffer as part of the occupied interval and adjacency as free.
        test_recipe:
          setup:
            - "Room buffer 30. Booking A held 10:00 (occ [10:00,12:30)). Booking B created starting 12:15."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vr1", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rr1", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { a_id: $.data.id }
            - call: "POST /bookings/${a_id}/hold"
              payload: {}
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T12:15:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ROOM_WINDOW_CONFLICT"
            - "Booking.${b_id}.status == QUOTE_DRAFT"

      # --- Staff: CLOSED interval, adjacency at buffer edge DOES conflict (different semantics, different entity) ---
      - name: rto_staff_closed_adjacency_conflict
        grounds:
          - calculations.staff_window_occupancy
          - state_machines.StaffAssignment.ASSIGNED_to_RELEASED
          - validations[priority=10]
        distinguishing_aspect: |
          On a StaffMember (CLOSED intervals), assigning the same staff to a back-to-back booking
          starting exactly at the first's 12:30 buffer edge IS rejected ERR_STAFF_WINDOW_CONFLICT —
          closed-interval adjacency conflicts, the opposite geometry to the half-open Room rule.
        test_recipe:
          setup:
            - "Booking A held 10:00 (occ closed [10:00,12:30]) with staff S as HOST. Booking C held 12:30 back-to-back."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vr2", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rr2a", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r1_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rr2b", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r2_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Host S", skills: ["HOST"] }
              as: VenueManager
              captures: { sm_host: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r1_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { a_id: $.data.id }
            - call: "POST /bookings/${a_id}/hold"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${a_id}/staff-assignments"
              payload: { staff_member_id: "${sm_host}", role_on_event: "HOST" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r2_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T12:30:00Z", children_count: 8 }
              as: Coordinator
              captures: { c_id: $.data.id }
            - call: "POST /bookings/${c_id}/hold"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /bookings/${c_id}/staff-assignments"
              payload: { staff_member_id: "${sm_host}", role_on_event: "HOST" }
              as: Coordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STAFF_WINDOW_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- Money conserved: charge then void leaves amount_paid unchanged ---
      - name: ci_payment_charge_void_money_conserved
        grounds:
          - state_machines.Payment.SETTLED_to_VOIDED
          - calculations.amount_paid_reconcile
          - entities.Booking.fields.amount_paid_cents
        distinguishing_aspect: |
          Conserved quantity = amount_paid_cents (money): a SETTLED CHARGE of 7500 raises amount_paid
          to 7500; voiding it returns amount_paid to its pre-charge value 0 with zero drift
          (amount_paid_cents == sum(SETTLED CHARGE) - sum(SETTLED REFUND)).
        test_recipe:
          setup:
            - "HELD booking, one SETTLED CHARGE payment of 7500 (amount_paid 7500)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vi1", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Ri1", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${b_id}/payments"
              payload: { direction: "CHARGE", amount_cents: 7500, purpose: "DEPOSIT" }
              as: FinanceClerk
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/payments/${pay_id}/void"
              payload: {}
              as: FinanceClerk
          assert:
            - "Payment.${pay_id}.status == VOIDED"
            - "Booking.${b_id}.amount_paid_cents == 0"
            - "Booking.${b_id}.balance_due_cents == 30000"
            - "Booking.${b_id}.payment_status == UNPAID"

      # --- Room occupancy conserved: hold then release-hold frees the window for a competitor ---
      - name: ci_hold_release_room_window_conserved
        grounds:
          - state_machines.Booking.QUOTE_DRAFT_to_HELD
          - state_machines.Booking.HELD_to_QUOTE_DRAFT
          - calculations.room_window_occupancy
        distinguishing_aspect: |
          Conserved quantity = room-window availability (a non-money slot resource): holding Booking A
          occupies [10:00,12:30); releasing the hold frees it so a competing Booking B at the same
          window holds successfully — the forward hold and its compensating release-hold leave room
          occupancy unchanged (net zero occupied intervals for A).
        test_recipe:
          setup:
            - "Booking A held 10:00 then release-hold (window freed). Booking B at same 10:00 window."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vi2", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Ri2", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { a_id: $.data.id }
            - call: "POST /bookings/${a_id}/hold"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${a_id}/release-hold"
              payload: {}
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
          assert:
            - "Booking.${a_id}.status == QUOTE_DRAFT"
            - "Booking.${b_id}.status == HELD"
