scenario: |
  Generate task harder than expert level!

  2713. Trauma Center Verification & Registry Reporting (verified trauma center): trauma activation criteria tiers and over/under-triage rate monitoring, trauma registry abstraction with inclusion criteria and data dictionary compliance, performance improvement and patient safety program with loop closure documentation, required specialty response times and surgeon presence documentation, verification site visit preparation with criteria deficiencies remediation, outreach, injury prevention and education requirement tracking, state designation versus national verification differences, transfer-in/transfer-out patterns and referral center agreements
domain_name: trauma-verification-registry
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: graph
  # graph: TraumaCenter <-> TraumaCenter via ReferralAgreement (many-to-many junction) and via
  # RegistryCase.transfer_in_from_center_id / transfer_out_to_center_id (polymorphic-direction self
  # references across the center set); PIEvent is a cross-aggregate node pointing at either a
  # RegistryCase or a CriteriaDeficiency.
  state_machine_shape: cyclic
  # RegistryCase carries two independent dimensions (abstraction_status x triage_review_status);
  # PIEvent cycles LOOP_CLOSED -> REOPENED -> UNDER_REVIEW -> ACTION_PLANNED -> LOOP_CLOSED;
  # VerificationCycle cycles PREP -> PREP_BLOCKED -> PREP and branches UNDER_REVIEW -> {VERIFIED,
  # CONTINGENCY, DENIED}; OutreachActivity cycles VERIFIED -> REJECTED -> VERIFIED.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  # The user who submits a registry abstraction may not adjudicate it; the director who owns a
  # corrective action may not verify it nor close the loop that contains it; the state designation
  # authority may not decide a national verification cycle and vice versa.
  consistency_model: immediate
  difficulty_level: expert_plus

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: TraumaCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the verified trauma center
      - name: state_code
        type: string
        source: input
        description: two-letter state code owning the state designation program
        constraints: exactly 2 uppercase letters
      - name: designation_level
        type: enum
        source: input
        description: trauma level the center holds
        constraints: one of {LEVEL_I, LEVEL_II, LEVEL_III}
      - name: verification_cycle_start_date
        type: datetime
        source: input
        description: first day of the current three-year verification cycle
      - name: national_verification_status
        type: enum
        source: system
        description: outcome of the most recent NATIONAL_VERIFICATION cycle decision
        default: NOT_VERIFIED
        constraints: one of {NOT_VERIFIED, VERIFIED, CONTINGENCY, SUSPENDED}
      - name: state_designation_status
        type: enum
        source: system
        description: outcome of the most recent STATE_DESIGNATION cycle decision
        default: NOT_DESIGNATED
        constraints: one of {NOT_DESIGNATED, DESIGNATED, PROVISIONAL, WITHDRAWN}
      - name: readiness_posture
        type: enum
        source: computed
        description: derived aggregate gate computed by calculations.readiness_posture
        default: READY
        constraints: one of {READY, CONDITIONAL, AT_RISK, SUSPENDED}
      - name: registry_compliance_score
        type: number
        source: computed
        description: data-dictionary compliance score, decremented by abstraction penalties
        default: 100.00
        constraints: 0.00..100.00, 2 decimals
      - name: under_triage_rate_pct
        type: number
        source: computed
        description: persisted PROVISIONAL_MONITORING variant of calculations.under_over_triage_rates
        default: 0.00
        constraints: 0.00..100.00, 2 decimals
      - name: over_triage_rate_pct
        type: number
        source: computed
        description: persisted PROVISIONAL_MONITORING over-triage rate
        default: 0.00
        constraints: 0.00..100.00, 2 decimals
      - name: outreach_credit_hours_ytd
        type: number
        source: computed
        description: weighted outreach/injury-prevention credit hour ledger over VERIFIED activities
        default: 0.00
        constraints: 2 decimals, quantized per activity to 0.25 before summation
      - name: open_critical_deficiency_count
        type: integer
        source: computed
        description: count of TYPE_I_CRITICAL CriteriaDeficiency rows of this center with status != CLOSED
        default: 0
      - name: escalated_critical_deficiency_count
        type: integer
        source: computed
        description: count of TYPE_I_CRITICAL CriteriaDeficiency rows of this center with status == ESCALATED
        default: 0
      - name: open_pi_event_count
        type: integer
        source: computed
        description: count of PIEvent rows with status IN {IDENTIFIED, UNDER_REVIEW, ACTION_PLANNED, REOPENED}
        default: 0
      - name: closed_pi_event_count
        type: integer
        source: computed
        description: count of PIEvent rows with status == LOOP_CLOSED
        default: 0
      - name: registry_included_case_count
        type: integer
        source: computed
        description: count of RegistryCase rows of this center with inclusion_status == INCLUDED
        default: 0
      - name: registry_excluded_case_count
        type: integer
        source: computed
        description: count of RegistryCase rows of this center with inclusion_status == EXCLUDED
        default: 0

  - name: ActivationCriteriaTier
    parent: TraumaCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: FK -> TraumaCenter.id; owning verified center (taken from the path segment)
      - name: tier_code
        type: enum
        source: input
        description: activation tier this row configures
        constraints: one of {TIER_1_FULL, TIER_2_MODIFIED, TIER_3_CONSULT}; unique per (center_id, tier_code)
      - name: surgeon_response_limit_minutes
        type: integer
        source: input
        description: maximum documented surgeon arrival interval for this tier
        constraints: 1..240
      - name: specialty_response_limit_minutes
        type: integer
        source: input
        description: maximum documented non-surgeon specialty arrival interval for this tier
        constraints: 1..240
      - name: iss_threshold
        type: integer
        source: input
        description: Injury Severity Score at or above which this tier is the criteria-correct activation
        constraints: 0..75

  - name: RegistryCase
    parent: TraumaCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: FK -> TraumaCenter.id; center that received the patient
      - name: activation_tier_id
        type: string
        source: input
        description: FK -> ActivationCriteriaTier.id; tier actually activated at arrival
      - name: mrn
        type: string
        source: input
        description: medical record number, unique per (center_id, mrn, arrival_at)
      - name: arrival_at
        type: datetime
        source: input
        description: ED arrival timestamp; anchors the 60-day abstraction window
      - name: injury_severity_score
        type: integer
        source: input
        description: arrival-recorded ISS used by the PROVISIONAL_MONITORING triage variant
        constraints: 0..75
      - name: los_hours
        type: number
        source: input
        description: length of stay in hours, used by the inclusion-criteria exclusion branch
        constraints: '>= 0, 2 decimals'
      - name: ed_disposition
        type: enum
        source: input
        description: ED disposition recorded at case creation
        default: ADMIT
        constraints: one of {ADMIT, TRANSFER_OUT, DISCHARGE, MORGUE}
      - name: transfer_in_from_center_id
        type: string
        source: input
        description: FK -> TraumaCenter.id; nullable, referring center for a transfer-in case
        default: null
      - name: transfer_out_to_center_id
        type: string
        source: system
        description: FK -> TraumaCenter.id; nullable, set by POST /registry-cases/{id}/transfer-out and cleared by its rescind
        default: null
      - name: abstraction_status
        type: enum
        source: system
        description: registry abstraction dimension of the parallel state machine
        default: PENDING
        constraints: one of {PENDING, ABSTRACTED, VALIDATED, REJECTED, LOCKED}
      - name: triage_review_status
        type: enum
        source: system
        description: triage-review dimension of the parallel state machine, independent of abstraction_status
        default: UNREVIEWED
        constraints: one of {UNREVIEWED, UNDER_TRIAGE_CONFIRMED, OVER_TRIAGE_CONFIRMED, APPROPRIATE}
      - name: effective_iss
        type: integer
        source: computed
        description: iss_abstracted of the latest VALIDATED AbstractionRecord when abstraction_status IN {VALIDATED, LOCKED}, else injury_severity_score
      - name: inclusion_status
        type: enum
        source: computed
        description: registry inclusion decision from calculations.case_inclusion_classification
        default: INCLUDED
        constraints: one of {INCLUDED, EXCLUDED}
      - name: inclusion_reason
        type: enum
        source: computed
        description: reason code emitted alongside inclusion_status
        default: MEETS_INCLUSION_CRITERIA
        constraints: one of {MEETS_INCLUSION_CRITERIA, TRANSFER_OUT_MINOR_UNDER_24H, BELOW_INJURY_THRESHOLD}
      - name: locked_at
        type: datetime
        source: system
        description: logical-clock instant at which the case was locked for registry submission
        default: null

  - name: AbstractionRecord
    parent: RegistryCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> RegistryCase.id; abstracted case (taken from the path segment)
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the RegistryAbstractor who submitted this record
      - name: iss_abstracted
        type: integer
        source: input
        description: abstracted Injury Severity Score; nullable so REQUIRED dictionary rules are triggerable
        default: null
      - name: gcs_arrival
        type: integer
        source: input
        description: abstracted arrival Glasgow Coma Score; nullable
        default: null
      - name: mechanism_code
        type: string
        source: input
        description: abstracted injury mechanism code checked by CONFORMANCE dictionary rules
        default: null
      - name: ed_departure_at
        type: datetime
        source: input
        description: abstracted ED departure timestamp; nullable
        default: null
      - name: validation_status
        type: enum
        source: system
        description: adjudication state of this abstraction
        default: SUBMITTED
        constraints: one of {SUBMITTED, VALIDATED, REJECTED}
      - name: validated_by_user_id
        type: string
        source: system
        description: X-User-ID of the RegistryValidator that adjudicated the record
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: reason text copied from the validate call when decision == REJECT
        default: null
      - name: dictionary_error_count
        type: integer
        source: computed
        description: number of ACTIVE DataDictionaryRule rows violated by this submission
      - name: applied_penalty_points
        type: number
        source: computed
        description: band-multiplied penalty subtracted from TraumaCenter.registry_compliance_score
        constraints: 2 decimals
      - name: band_multiplier_used
        type: number
        source: computed
        description: multiplier selected from the center's registry_compliance_score as persisted at request start
        constraints: one of {1.0, 1.5, 2.0}

  - name: DataDictionaryRule
    parent: null
    common_fields: false
    fields:
      - name: field_name
        type: string
        source: input
        description: AbstractionRecord field this rule constrains
        constraints: one of {iss_abstracted, gcs_arrival, mechanism_code, ed_departure_at}
      - name: rule_kind
        type: enum
        source: input
        description: kind of dictionary check
        constraints: one of {REQUIRED, RANGE, CONFORMANCE}; unique per (field_name, rule_kind)
      - name: severity
        type: enum
        source: input
        description: severity band driving error_weight and the critical-violation gate
        constraints: one of {CRITICAL, MAJOR, MINOR}
      - name: min_value
        type: number
        source: input
        description: inclusive lower bound for RANGE rules
        default: null
      - name: max_value
        type: number
        source: input
        description: inclusive upper bound for RANGE rules
        default: null
      - name: allowed_codes
        type: array
        source: input
        description: permitted string codes for CONFORMANCE rules
        default: null
      - name: error_weight
        type: integer
        source: computed
        description: CRITICAL -> 4, MAJOR -> 2, MINOR -> 1

  - name: ResponseLog
    parent: RegistryCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> RegistryCase.id; activation this response documents (taken from the path segment)
      - name: responder_role
        type: enum
        source: input
        description: responding service; SURGEON uses the surgeon limit, all others the specialty limit
        constraints: one of {SURGEON, ANESTHESIA, NEUROSURGERY, ORTHOPEDICS, RADIOLOGY}
      - name: responder_user_id
        type: string
        source: input
        description: opaque identifier of the documented responder
      - name: notified_at
        type: datetime
        source: input
        description: activation page timestamp
      - name: arrived_at
        type: datetime
        source: input
        description: bedside arrival timestamp; null means presence was never documented
        default: null
      - name: response_minutes
        type: number
        source: computed
        description: '(arrived_at - notified_at) in minutes, round_half_up to 2 decimals; null when arrived_at is null'
      - name: applicable_limit_minutes
        type: integer
        source: computed
        description: limit copied from the case's ActivationCriteriaTier per responder_role
      - name: compliance_status
        type: enum
        source: computed
        description: outcome of calculations.response_time_compliance
        constraints: one of {COMPLIANT, LATE, UNDOCUMENTED}

  - name: PIEvent
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: FK -> TraumaCenter.id; center whose PIPS program owns the loop
      - name: case_id
        type: string
        source: input
        description: FK -> RegistryCase.id; nullable, case that triggered the event
        default: null
      - name: source_deficiency_id
        type: string
        source: system
        description: FK -> CriteriaDeficiency.id; nullable, set only for DEFICIENCY_ESCALATION events
        default: null
      - name: event_type
        type: enum
        source: input
        description: PIPS event category; DEFICIENCY_ESCALATION is system-only
        constraints: one of {UNDER_TRIAGE, DELAYED_SURGEON, DEFICIENCY_ESCALATION, MORTALITY_REVIEW, TRANSFER_DELAY}
      - name: severity
        type: enum
        source: input
        description: PIPS severity band
        constraints: one of {HIGH, MEDIUM, LOW}
      - name: status
        type: enum
        source: system
        description: loop-closure state; cycles through REOPENED
        default: IDENTIFIED
        constraints: one of {IDENTIFIED, UNDER_REVIEW, ACTION_PLANNED, LOOP_CLOSED, REOPENED}
      - name: origin
        type: enum
        source: system
        description: MANUAL for POST /pi-events, SYSTEM_AUTO for threshold- and cascade-created events
        constraints: one of {MANUAL, SYSTEM_AUTO}
      - name: opened_at
        type: datetime
        source: system
        description: logical-clock instant at creation
      - name: loop_closure_due_at
        type: datetime
        source: system
        description: opened_at + LOOP_CLOSURE_DAYS (60) at creation; reset to clock + 30 days on DEFICIENCY_ESCALATION creation and on reopen
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent LOOP_CLOSED entry; cleared on reopen
        default: null
      - name: review_round
        type: integer
        source: system
        description: increments by 1 on every reopen
        default: 1
      - name: corrective_action_count
        type: integer
        source: computed
        description: count of CorrectiveAction rows of this event
      - name: verified_action_count
        type: integer
        source: computed
        description: count of CorrectiveAction rows of this event with completion_status == VERIFIED

  - name: CorrectiveAction
    parent: PIEvent
    common_fields: true
    fields:
      - name: pi_event_id
        type: string
        source: input
        description: FK -> PIEvent.id; loop this action belongs to (taken from the path segment)
      - name: action_type
        type: enum
        source: input
        description: corrective action category
        constraints: one of {EDUCATION, PROTOCOL_CHANGE, CREDENTIAL_ACTION, EQUIPMENT}
      - name: owner_user_id
        type: string
        source: input
        description: opaque identifier of the accountable owner; blocked from verifying this action
      - name: due_at
        type: datetime
        source: input
        description: committed completion date
      - name: completion_status
        type: enum
        source: system
        description: action lifecycle state
        default: OPEN
        constraints: one of {OPEN, COMPLETED, VERIFIED}
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant of completion
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant of verification
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the TraumaMedicalDirector who verified the action
        default: null

  - name: VerificationCycle
    parent: TraumaCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: FK -> TraumaCenter.id; center under review
      - name: cycle_type
        type: enum
        source: input
        description: national verification versus state designation; drives weights, required outreach hours and deciding authority
        constraints: one of {NATIONAL_VERIFICATION, STATE_DESIGNATION}
      - name: site_visit_date
        type: datetime
        source: input
        description: planned site visit date
      - name: status
        type: enum
        source: system
        description: cycle lifecycle; PREP <-> PREP_BLOCKED is a posture-driven cycle and UNDER_REVIEW branches three ways
        default: PREP
        constraints: one of {PREP, PREP_BLOCKED, SUBMITTED, SITE_VISIT_SCHEDULED, UNDER_REVIEW, VERIFIED, CONTINGENCY, DENIED}
      - name: readiness_score
        type: number
        source: computed
        description: persisted REVIEWER_ASSESSMENT variant of calculations.verification_readiness_score
        default: 100.00
        constraints: 0.00..100.00, 2 decimals
      - name: open_type_i_count
        type: integer
        source: computed
        description: count of this cycle's TYPE_I_CRITICAL deficiencies with status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}
        default: 0
      - name: open_type_ii_count
        type: integer
        source: computed
        description: count of this cycle's TYPE_II_MAJOR deficiencies with status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}
        default: 0
      - name: open_type_iii_count
        type: integer
        source: computed
        description: count of this cycle's TYPE_III_MINOR deficiencies with status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}
        default: 0
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the decision transition
        default: null
      - name: decision_effective_date
        type: datetime
        source: system
        description: effective date carried by the decision call
        default: null

  - name: CriteriaDeficiency
    parent: VerificationCycle
    common_fields: true
    fields:
      - name: verification_cycle_id
        type: string
        source: input
        description: FK -> VerificationCycle.id; cycle that recorded the deficiency (taken from the path segment)
      - name: criterion_code
        type: string
        source: input
        description: verification criterion identifier, e.g. CD-5-13; ordering key for escalation cascades
      - name: deficiency_class
        type: enum
        source: input
        description: severity class of the criterion deficiency
        constraints: one of {TYPE_I_CRITICAL, TYPE_II_MAJOR, TYPE_III_MINOR}
      - name: status
        type: enum
        source: system
        description: remediation lifecycle
        default: OPEN
        constraints: one of {OPEN, REMEDIATION_SUBMITTED, ESCALATED, CLOSED}
      - name: remediation_due_at
        type: datetime
        source: input
        description: remediation deadline; rewritten to clock + 30 days when the deficiency is escalated
      - name: remediation_note
        type: string
        source: system
        description: text of the most recent remediation submission
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant of closure by the reviewing authority
        default: null

  - name: OutreachActivity
    parent: TraumaCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: FK -> TraumaCenter.id; center claiming the credit (taken from the path segment)
      - name: activity_kind
        type: enum
        source: input
        description: outreach category; drives KIND_WEIGHT in the credit-hour ledger
        constraints: one of {INJURY_PREVENTION, PROFESSIONAL_EDUCATION, COMMUNITY_OUTREACH}
      - name: event_date
        type: datetime
        source: input
        description: date the activity was delivered
      - name: credit_hours
        type: number
        source: input
        description: raw contact hours claimed
        constraints: '> 0, up to 3 decimals'
      - name: audience_count
        type: integer
        source: input
        description: number of participants reached
        constraints: '>= 0'
      - name: verified_status
        type: enum
        source: system
        description: review state; only VERIFIED rows enter the credit-hour ledger
        default: LOGGED
        constraints: one of {LOGGED, VERIFIED, REJECTED}
      - name: weighted_credit_hours
        type: number
        source: computed
        description: quantize_quarter(credit_hours * KIND_WEIGHT[activity_kind]); the per-activity term of the ledger
        constraints: multiple of 0.25
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the authority that verified or rejected the activity
        default: null

  - name: ReferralAgreement
    parent: null
    common_fields: true
    fields:
      - name: referring_center_id
        type: string
        source: input
        description: FK -> TraumaCenter.id; center that sends patients out under this agreement
      - name: receiving_center_id
        type: string
        source: input
        description: FK -> TraumaCenter.id; center that guarantees acceptance
      - name: agreement_status
        type: enum
        source: system
        description: agreement lifecycle
        default: DRAFT
        constraints: one of {DRAFT, ACTIVE, TERMINATED}
      - name: effective_from
        type: datetime
        source: input
        description: inclusive start of the half-open coverage interval
      - name: effective_to
        type: datetime
        source: input
        description: exclusive end of the half-open coverage interval
      - name: guaranteed_acceptance_minutes
        type: integer
        source: input
        description: contracted acceptance decision window
        constraints: 1..720
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant of activation
        default: null
      - name: terminated_at
        type: datetime
        source: system
        description: logical-clock instant of termination
        default: null

  - name: SurveyorBooking
    parent: VerificationCycle
    common_fields: true
    fields:
      - name: verification_cycle_id
        type: string
        source: input
        description: FK -> VerificationCycle.id; cycle being surveyed (taken from the path segment)
      - name: surveyor_user_id
        type: string
        source: input
        description: opaque identifier of the site-visit surveyor; the resource whose calendar is protected
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the closed on-site window
      - name: window_end
        type: datetime
        source: input
        description: inclusive end of the closed on-site window
      - name: travel_buffer_hours
        type: integer
        source: input
        description: TRAVEL_BUFFER_HOURS applied symmetrically around the closed window; optional on create and defaults to 24
        default: 24

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  # RegistryCase carries TWO independent state dimensions on the same row:
  #   dimension A (abstraction): PENDING -> ABSTRACTED -> {VALIDATED, REJECTED} -> LOCKED
  #   dimension B (triage):      UNREVIEWED -> {UNDER_TRIAGE_CONFIRMED, OVER_TRIAGE_CONFIRMED, APPROPRIATE}
  # Neither dimension gates the other: a PENDING case can be triage-reviewed and a VALIDATED case
  # can still be UNREVIEWED. Only LOCKED (dimension A) freezes dimension A.
  - entity: RegistryCase
    initial_state: "PENDING (abstraction dimension) + UNREVIEWED (triage dimension)"
    terminal_states: [LOCKED]
    transitions:
      - from: PENDING
        to: ABSTRACTED
        trigger: "POST /registry-cases/{id}/abstractions"
        actor: RegistryAbstractor
        preconditions:
          - "case.abstraction_status IN {PENDING, ABSTRACTED, REJECTED}"
          - "payload.expected_case_version == case.version"
          - "clock_now <= case.arrival_at + ABSTRACTION_WINDOW_DAYS (60)"
          - "no ACTIVE DataDictionaryRule with severity == CRITICAL is violated by the submission"
        side_effects:
          - "creates AbstractionRecord with validation_status = SUBMITTED and submitted_by_user_id = X-User-ID"
          - "any prior AbstractionRecord of this case with validation_status == SUBMITTED is set to REJECTED with rejection_reason = 'SUPERSEDED_BY_RESUBMISSION'"
          - "runs calculations.dictionary_penalty_scan -> AbstractionRecord.dictionary_error_count, band_multiplier_used, applied_penalty_points and rewrites TraumaCenter.registry_compliance_score"
          - "recomputes calculations.verification_readiness_score for every VerificationCycle of the center with status IN {PREP, PREP_BLOCKED, SUBMITTED, SITE_VISIT_SCHEDULED, UNDER_REVIEW}"
          - "increments RegistryCase.version by 1"
        note: "dimension A; ABSTRACTED -> ABSTRACTED resubmission is legal and supersedes the prior record"
      - from: ABSTRACTED
        to: VALIDATED
        trigger: "POST /abstractions/{id}/validate"
        actor: RegistryValidator
        preconditions:
          - "abstraction.validation_status == SUBMITTED"
          - "X-User-ID != abstraction.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "AbstractionRecord.validation_status = VALIDATED, validated_by_user_id = X-User-ID"
          - "recomputes RegistryCase.effective_iss from iss_abstracted"
          - "re-runs calculations.case_inclusion_classification, which rewrites TraumaCenter.registry_included_case_count / registry_excluded_case_count"
          - "recomputes calculations.under_over_triage_rates (PROVISIONAL_MONITORING) onto the center"
          - "increments RegistryCase.version by 1"
      - from: ABSTRACTED
        to: REJECTED
        trigger: "POST /abstractions/{id}/reject"
        actor: RegistryValidator
        preconditions:
          - "abstraction.validation_status == SUBMITTED"
          - "X-User-ID != abstraction.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "AbstractionRecord.validation_status = REJECTED, rejection_reason = payload.rejection_reason"
          - "case.abstraction_status = REJECTED, which re-opens the case for resubmission"
          - "increments RegistryCase.version by 1"
      - from: REJECTED
        to: ABSTRACTED
        trigger: "POST /registry-cases/{id}/abstractions (resubmission after rejection)"
        actor: RegistryAbstractor
        preconditions:
          - "case.abstraction_status == REJECTED"
          - "payload.expected_case_version == case.version"
        side_effects:
          - "same side effects as PENDING -> ABSTRACTED"
        note: "dimension A revision loop"
      - from: VALIDATED
        to: LOCKED
        trigger: "POST /registry-cases/{id}/lock"
        actor: TraumaProgramManager
        preconditions:
          - "case.abstraction_status == VALIDATED"
          - "the latest AbstractionRecord of the case has validation_status == VALIDATED"
          - "TraumaCenter.readiness_posture != SUSPENDED"
        side_effects:
          - "case.locked_at = clock_now"
          - "case enters the VERIFICATION_AUDIT cohort, so calculations.under_over_triage_rates results change for that variant"
          - "increments RegistryCase.version by 1"
      - from: UNREVIEWED
        to: UNDER_TRIAGE_CONFIRMED
        trigger: "POST /registry-cases/{id}/triage-review with triage_review_status = UNDER_TRIAGE_CONFIRMED"
        actor: TraumaMedicalDirector
        preconditions:
          - "case.triage_review_status == UNREVIEWED"
          - "case.inclusion_status == INCLUDED"
        side_effects:
          - "HOP 1: recomputes calculations.under_over_triage_rates (PROVISIONAL_MONITORING) and writes TraumaCenter.under_triage_rate_pct"
          - "HOP 2: because under_triage_rate_pct >= UNDER_TRIAGE_ALERT_PCT (5.00) and no PIEvent of the center has event_type == UNDER_TRIAGE with status IN {IDENTIFIED, UNDER_REVIEW, ACTION_PLANNED, REOPENED}, the system creates a PIEvent (origin = SYSTEM_AUTO, event_type = UNDER_TRIAGE, severity = HIGH, status = IDENTIFIED, loop_closure_due_at = clock_now + 60 days), which raises TraumaCenter.open_pi_event_count by 1"
          - "HOP 3: because open_pi_event_count changed, calculations.readiness_posture re-runs and TraumaCenter.readiness_posture is rewritten (AT_RISK once under_triage_rate_pct >= 5.00)"
          - "HOP 4: because open_pi_event_count changed, calculations.verification_readiness_score re-runs for every VerificationCycle of the center; each cycle with status == PREP whose recomputed readiness_score < SUBMIT_MIN_READINESS (70.00) transitions PREP -> PREP_BLOCKED"
          - "increments RegistryCase.version by 1"
        note: "dimension B; the four hops are the transitive cascade named difficulty instance under_triage_threshold_to_cycle_block"
      - from: UNREVIEWED
        to: OVER_TRIAGE_CONFIRMED
        trigger: "POST /registry-cases/{id}/triage-review with triage_review_status = OVER_TRIAGE_CONFIRMED"
        actor: TraumaMedicalDirector
        preconditions:
          - "case.triage_review_status == UNREVIEWED"
          - "case.inclusion_status == INCLUDED"
        side_effects:
          - "recomputes TraumaCenter.over_triage_rate_pct (PROVISIONAL_MONITORING)"
          - "re-runs calculations.readiness_posture (CONDITIONAL once over_triage_rate_pct >= OVER_TRIAGE_ALERT_PCT 35.00)"
          - "increments RegistryCase.version by 1"
      - from: UNREVIEWED
        to: APPROPRIATE
        trigger: "POST /registry-cases/{id}/triage-review with triage_review_status = APPROPRIATE"
        actor: TraumaMedicalDirector
        preconditions:
          - "case.triage_review_status == UNREVIEWED"
          - "case.inclusion_status == INCLUDED"
        side_effects:
          - "recomputes both PROVISIONAL_MONITORING rates onto the center (numerators unchanged, denominator unchanged)"
          - "increments RegistryCase.version by 1"
      - from: "INCLUDED (inclusion_status)"
        to: "EXCLUDED (inclusion_status)"
        trigger: "POST /registry-cases/{id}/transfer-out"
        actor: TraumaProgramManager
        preconditions:
          - "case.transfer_out_to_center_id IS NULL"
          - "a ReferralAgreement exists with referring_center_id == case.center_id, receiving_center_id == payload.transfer_out_to_center_id, agreement_status == ACTIVE and effective_from <= case.arrival_at < effective_to"
        side_effects:
          - "case.transfer_out_to_center_id = payload.transfer_out_to_center_id and case.ed_disposition = TRANSFER_OUT"
          - "re-runs calculations.case_inclusion_classification; a case with los_hours < 24.00 and effective_iss < 9 becomes EXCLUDED / TRANSFER_OUT_MINOR_UNDER_24H"
          - "rewrites TraumaCenter.registry_included_case_count and registry_excluded_case_count"
          - "recomputes calculations.under_over_triage_rates (PROVISIONAL_MONITORING); if the recomputed under_triage_rate_pct >= 5.00 the same UNDER_TRIAGE PIEvent creation of HOP 2 fires"
          - "re-runs calculations.readiness_posture"
          - "increments RegistryCase.version by 1"
        note: "compensated by POST /registry-cases/{id}/transfer-out/rescind"
      - from: "EXCLUDED (inclusion_status)"
        to: "INCLUDED (inclusion_status)"
        trigger: "POST /registry-cases/{id}/transfer-out/rescind"
        actor: TraumaProgramManager
        preconditions:
          - "case.transfer_out_to_center_id IS NOT NULL"
          - "case.abstraction_status != LOCKED"
        side_effects:
          - "case.transfer_out_to_center_id = null and case.ed_disposition = ADMIT"
          - "re-runs calculations.case_inclusion_classification and rewrites both center cohort counters (compensating action for the cohort-partition invariant)"
          - "recomputes calculations.under_over_triage_rates (PROVISIONAL_MONITORING) and calculations.readiness_posture"
          - "increments RegistryCase.version by 1"

  - entity: AbstractionRecord
    initial_state: SUBMITTED
    terminal_states: [VALIDATED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /abstractions/{id}/validate"
        actor: RegistryValidator
        preconditions:
          - "abstraction.validation_status == SUBMITTED"
          - "X-User-ID != abstraction.submitted_by_user_id"
        side_effects:
          - "sets validated_by_user_id = X-User-ID and drives RegistryCase ABSTRACTED -> VALIDATED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /abstractions/{id}/reject"
        actor: RegistryValidator
        preconditions:
          - "abstraction.validation_status == SUBMITTED"
          - "X-User-ID != abstraction.submitted_by_user_id"
        side_effects:
          - "sets rejection_reason and drives RegistryCase ABSTRACTED -> REJECTED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system event: a newer AbstractionRecord is created for the same case"
        actor: system
        preconditions:
          - "the superseded record still has validation_status == SUBMITTED"
        side_effects:
          - "rejection_reason = 'SUPERSEDED_BY_RESUBMISSION'"
        note: "the supersede path is what makes POST /registry-cases/{id}/abstractions an OCC-guarded write"

  # PIEvent is cyclic: LOOP_CLOSED -> REOPENED -> UNDER_REVIEW -> ACTION_PLANNED -> LOOP_CLOSED,
  # with review_round incrementing on every reopen. LOOP_CLOSED is NOT terminal.
  - entity: PIEvent
    initial_state: IDENTIFIED
    terminal_states: []
    transitions:
      - from: IDENTIFIED
        to: UNDER_REVIEW
        trigger: "POST /pi-events/{id}/start-review"
        actor: TraumaMedicalDirector
        preconditions:
          - "pi_event.status IN {IDENTIFIED, REOPENED}"
        side_effects:
          - "no counter change: the event stays inside open_pi_event_count"
      - from: REOPENED
        to: UNDER_REVIEW
        trigger: "POST /pi-events/{id}/start-review"
        actor: TraumaMedicalDirector
        preconditions:
          - "pi_event.status == REOPENED"
        side_effects:
          - "no counter change"
        note: "closes the revision loop opened by reopen"
      - from: UNDER_REVIEW
        to: ACTION_PLANNED
        trigger: "POST /pi-events/{id}/corrective-actions (first action of the round)"
        actor: TraumaProgramManager
        preconditions:
          - "pi_event.status == UNDER_REVIEW"
        side_effects:
          - "creates CorrectiveAction with completion_status = OPEN"
          - "recomputes PIEvent.corrective_action_count and verified_action_count"
      - from: ACTION_PLANNED
        to: LOOP_CLOSED
        trigger: "POST /pi-events/{id}/close-loop"
        actor: TraumaMedicalDirector
        preconditions:
          - "pi_event.status == ACTION_PLANNED"
          - "corrective_action_count >= 1 AND verified_action_count == corrective_action_count"
          - "X-User-ID is not the owner_user_id of any CorrectiveAction of this event (segregation of duties)"
        side_effects:
          - "closed_at = clock_now"
          - "TraumaCenter.open_pi_event_count decreases by 1 and closed_pi_event_count increases by 1 (the conserved PI accounting identity)"
          - "re-runs calculations.readiness_posture"
          - "recomputes calculations.verification_readiness_score for every VerificationCycle of the center; each cycle with status == PREP_BLOCKED whose recomputed readiness_score >= 70.00 transitions PREP_BLOCKED -> PREP"
      - from: LOOP_CLOSED
        to: REOPENED
        trigger: "POST /pi-events/{id}/reopen"
        actor: TraumaMedicalDirector | VerificationReviewer
        preconditions:
          - "pi_event.status == LOOP_CLOSED"
        side_effects:
          - "review_round increases by 1, closed_at = null, loop_closure_due_at = clock_now + 30 days"
          - "TraumaCenter.open_pi_event_count increases by 1 and closed_pi_event_count decreases by 1, restoring the pre-closure partition (compensating action)"
          - "re-runs calculations.readiness_posture and calculations.verification_readiness_score for the center's cycles"
        note: "cycle edge; the event may be re-reviewed, re-planned and re-closed any number of rounds"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /corrective-actions/{id}/complete"
        actor: TraumaProgramManager
        preconditions:
          - "action.completion_status == OPEN"
          - "parent PIEvent.status IN {ACTION_PLANNED, REOPENED}"
        side_effects:
          - "completed_at = clock_now"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /corrective-actions/{id}/verify"
        actor: TraumaMedicalDirector
        preconditions:
          - "action.completion_status == COMPLETED"
          - "X-User-ID != action.owner_user_id (segregation of duties)"
        side_effects:
          - "verified_at = clock_now, verified_by_user_id = X-User-ID"
          - "recomputes PIEvent.verified_action_count, which is what unblocks close-loop"

  # VerificationCycle blends a posture-driven cycle (PREP <-> PREP_BLOCKED) with a three-way
  # branch out of UNDER_REVIEW whose side-effect sets diverge, and whose national/state variants
  # write different center fields.
  - entity: VerificationCycle
    initial_state: PREP
    terminal_states: [VERIFIED, DENIED]
    transitions:
      - from: PREP
        to: PREP_BLOCKED
        trigger: "system event: readiness_score recomputed below SUBMIT_MIN_READINESS (70.00) after a cascade"
        actor: system
        preconditions:
          - "cycle.status == PREP"
          - "recomputed readiness_score (REVIEWER_ASSESSMENT) < 70.00"
        side_effects:
          - "cycle.readiness_score rewritten; the cycle can no longer be submitted"
      - from: PREP_BLOCKED
        to: PREP
        trigger: "system event: readiness_score recomputed at or above 70.00 after a deficiency closure or PI loop closure"
        actor: system
        preconditions:
          - "cycle.status == PREP_BLOCKED"
          - "recomputed readiness_score (REVIEWER_ASSESSMENT) >= 70.00"
        side_effects:
          - "cycle.readiness_score rewritten; submission is possible again"
      - from: PREP
        to: SUBMITTED
        trigger: "POST /verification-cycles/{id}/submit"
        actor: TraumaProgramManager
        preconditions:
          - "cycle.status == PREP"
          - "TraumaCenter.readiness_posture != SUSPENDED"
          - "cycle.readiness_score (REVIEWER_ASSESSMENT) >= SUBMIT_MIN_READINESS (70.00)"
        side_effects:
          - "cycle.readiness_score refreshed at submission time"
          - "increments VerificationCycle.version by 1"
      - from: SUBMITTED
        to: SITE_VISIT_SCHEDULED
        trigger: "POST /verification-cycles/{id}/schedule-site-visit"
        actor: VerificationReviewer | StateDesignationOfficer
        preconditions:
          - "cycle.status == SUBMITTED"
          - "at least one SurveyorBooking already exists for the cycle, created by POST /verification-cycles/{id}/surveyor-bookings while the cycle was SUBMITTED"
        side_effects:
          - "cycle.site_visit_date = payload.site_visit_date"
          - "increments VerificationCycle.version by 1"
        note: "surveyor bookings themselves are status-neutral and may be added while the cycle is SUBMITTED or SITE_VISIT_SCHEDULED; each booking must clear the TRAVEL_BUFFER_HOURS (24) conflict check of calculations.surveyor_window_conflict"
      - from: SITE_VISIT_SCHEDULED
        to: UNDER_REVIEW
        trigger: "POST /verification-cycles/{id}/begin-review"
        actor: VerificationReviewer | StateDesignationOfficer
        preconditions:
          - "cycle.status == SITE_VISIT_SCHEDULED"
          - "at least one SurveyorBooking exists for the cycle"
        side_effects:
          - "the cycle becomes eligible to record CriteriaDeficiency rows found on site"
          - "increments VerificationCycle.version by 1"
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /verification-cycles/{id}/decide with decision = VERIFIED"
        actor: VerificationReviewer | StateDesignationOfficer
        preconditions:
          - "cycle.status == UNDER_REVIEW"
          - "cycle_type == NATIONAL_VERIFICATION requires actor VerificationReviewer; cycle_type == STATE_DESIGNATION requires actor StateDesignationOfficer"
          - "cycle.open_type_i_count == 0"
        side_effects:
          - "decided_at = clock_now, decision_effective_date = payload.decision_effective_date"
          - "NATIONAL_VERIFICATION writes TraumaCenter.national_verification_status = VERIFIED; STATE_DESIGNATION writes TraumaCenter.state_designation_status = DESIGNATED and leaves national_verification_status untouched"
          - "re-runs calculations.readiness_posture"
      - from: UNDER_REVIEW
        to: CONTINGENCY
        trigger: "POST /verification-cycles/{id}/decide with decision = CONTINGENCY"
        actor: VerificationReviewer | StateDesignationOfficer
        preconditions:
          - "cycle.status == UNDER_REVIEW"
          - "cycle_type == NATIONAL_VERIFICATION requires actor VerificationReviewer; cycle_type == STATE_DESIGNATION requires actor StateDesignationOfficer"
        side_effects:
          - "HOP 1: decided_at = clock_now; NATIONAL_VERIFICATION writes TraumaCenter.national_verification_status = CONTINGENCY, STATE_DESIGNATION writes state_designation_status = PROVISIONAL"
          - "HOP 2: because the cycle entered CONTINGENCY, every CriteriaDeficiency of the cycle with deficiency_class == TYPE_I_CRITICAL and status IN {OPEN, REMEDIATION_SUBMITTED} is set to ESCALATED with remediation_due_at = clock_now + ESCALATION_REMEDIATION_DAYS (30), processed in ascending criterion_code order"
          - "HOP 3: because each of those deficiencies became ESCALATED, one PIEvent per escalated deficiency is created (origin = SYSTEM_AUTO, event_type = DEFICIENCY_ESCALATION, severity = HIGH, status = IDENTIFIED, case_id = null, source_deficiency_id = the escalated deficiency, loop_closure_due_at = clock_now + 30 days), raising TraumaCenter.open_pi_event_count by the number of escalations"
          - "HOP 4: because escalated_critical_deficiency_count and open_pi_event_count changed, calculations.readiness_posture re-runs and yields SUSPENDED once escalated_critical_deficiency_count >= 2"
          - "cycle.readiness_score refreshed"
        note: "the four hops are the transitive cascade named difficulty instance contingency_escalation_to_posture_suspension"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /verification-cycles/{id}/decide with decision = DENIED"
        actor: VerificationReviewer | StateDesignationOfficer
        preconditions:
          - "cycle.status == UNDER_REVIEW"
          - "cycle_type == NATIONAL_VERIFICATION requires actor VerificationReviewer; cycle_type == STATE_DESIGNATION requires actor StateDesignationOfficer"
        side_effects:
          - "decided_at = clock_now"
          - "NATIONAL_VERIFICATION writes TraumaCenter.national_verification_status = SUSPENDED, which makes calculations.readiness_posture return SUSPENDED and gates case locking and cycle submission"
          - "STATE_DESIGNATION writes TraumaCenter.state_designation_status = WITHDRAWN only; national_verification_status and therefore readiness_posture are unchanged"
        note: "branch divergence: the national branch mutates the posture gate, the state branch does not"

  - entity: CriteriaDeficiency
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: REMEDIATION_SUBMITTED
        trigger: "POST /criteria-deficiencies/{id}/remediation"
        actor: TraumaProgramManager
        preconditions:
          - "deficiency.status IN {OPEN, ESCALATED, REMEDIATION_SUBMITTED}"
          - "payload.expected_cycle_version == parent VerificationCycle.version"
        side_effects:
          - "remediation_note rewritten"
          - "cycle.open_type_i_count / open_type_ii_count / open_type_iii_count unchanged (REMEDIATION_SUBMITTED still counts as open for the REVIEWER_ASSESSMENT variant)"
          - "recomputes calculations.verification_readiness_score, whose SELF_ASSESSMENT variant improves while the REVIEWER_ASSESSMENT variant does not"
          - "increments VerificationCycle.version by 1"
      - from: ESCALATED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /criteria-deficiencies/{id}/remediation"
        actor: TraumaProgramManager
        preconditions:
          - "deficiency.status == ESCALATED"
          - "payload.expected_cycle_version == parent VerificationCycle.version"
        side_effects:
          - "TraumaCenter.escalated_critical_deficiency_count decreases by 1 for TYPE_I_CRITICAL rows"
          - "re-runs calculations.readiness_posture"
          - "increments VerificationCycle.version by 1"
      - from: REMEDIATION_SUBMITTED
        to: CLOSED
        trigger: "POST /criteria-deficiencies/{id}/close"
        actor: VerificationReviewer | StateDesignationOfficer
        preconditions:
          - "deficiency.status IN {REMEDIATION_SUBMITTED, ESCALATED}"
        side_effects:
          - "closed_at = clock_now"
          - "TraumaCenter.open_critical_deficiency_count and cycle.open_type_*_count decrease accordingly"
          - "re-runs calculations.readiness_posture and calculations.verification_readiness_score; a PREP_BLOCKED cycle back at or above 70.00 auto-transitions to PREP"
          - "increments VerificationCycle.version by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "system event: parent cycle transitions UNDER_REVIEW -> CONTINGENCY"
        actor: system
        preconditions:
          - "deficiency_class == TYPE_I_CRITICAL AND status IN {OPEN, REMEDIATION_SUBMITTED}"
        side_effects:
          - "remediation_due_at = clock_now + 30 days; spawns the DEFICIENCY_ESCALATION PIEvent of HOP 3"

  # OutreachActivity is cyclic on the review dimension: a rejected activity can be re-verified,
  # and every crossing of the VERIFIED boundary moves the center's credit-hour ledger.
  - entity: OutreachActivity
    initial_state: LOGGED
    terminal_states: []
    transitions:
      - from: LOGGED
        to: VERIFIED
        trigger: "POST /outreach-activities/{id}/verify"
        actor: TraumaMedicalDirector
        preconditions:
          - "activity.verified_status IN {LOGGED, REJECTED}"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "recomputes calculations.outreach_credit_hour_ledger: TraumaCenter.outreach_credit_hours_ytd = round_half_up(sum of weighted_credit_hours over VERIFIED activities, 2)"
          - "recomputes calculations.verification_readiness_score for every non-decided VerificationCycle of the center"
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /outreach-activities/{id}/reject"
        actor: TraumaMedicalDirector
        preconditions:
          - "activity.verified_status IN {LOGGED, VERIFIED}"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "recomputes the ledger over the remaining VERIFIED activities, which must land exactly on the pre-verification value (compensating action for the credit-hour invariant)"
          - "recomputes calculations.verification_readiness_score for every non-decided VerificationCycle of the center"
      - from: REJECTED
        to: VERIFIED
        trigger: "POST /outreach-activities/{id}/verify"
        actor: TraumaMedicalDirector
        preconditions:
          - "activity.verified_status == REJECTED"
        side_effects:
          - "same ledger recomputation as LOGGED -> VERIFIED; repeated crossings must not drift the ledger"
        note: "cycle edge"

  - entity: ReferralAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /referral-agreements/{id}/activate"
        actor: TraumaProgramManager
        preconditions:
          - "agreement.agreement_status == DRAFT"
          - "X-User-ID == agreement.receiving_center_id (only the guaranteeing center may activate)"
          - "no other ReferralAgreement with the same (referring_center_id, receiving_center_id) pair and agreement_status == ACTIVE has a half-open interval [effective_from, effective_to) intersecting this one"
        side_effects:
          - "activated_at = clock_now; the pair now has transfer-out coverage for the interval"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /referral-agreements/{id}/terminate"
        actor: TraumaProgramManager
        preconditions:
          - "agreement.agreement_status == ACTIVE"
          - "X-User-ID IN {agreement.referring_center_id, agreement.receiving_center_id}"
        side_effects:
          - "terminated_at = clock_now; the interval is freed for a new ACTIVE agreement on the same pair"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: abstraction-create-stale-case
    parent_entity: RegistryCase
    write_endpoint: "POST /registry-cases/{id}/abstractions"
    occ_field: "expected_case_version"
    description: |
      Submitting an AbstractionRecord against a RegistryCase whose version has advanced since the
      client last read it is rejected. Resubmission is a legitimate product operation — a newer
      abstraction supersedes the prior SUBMITTED record — so the write cannot be rejected by any
      state precondition; the stale-version check is what protects the abstractor from overwriting
      an adjudication or a supersede they never observed.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: remediation-submit-stale-cycle
    parent_entity: VerificationCycle
    write_endpoint: "POST /criteria-deficiencies/{id}/remediation"
    occ_field: "expected_cycle_version"
    description: |
      Submitting a remediation packet for a CriteriaDeficiency while carrying a VerificationCycle
      version older than the persisted one is rejected. Resubmitting remediation on the same
      deficiency is legal and supersedes the prior note, so the write is not covered by any state
      precondition; the stale-version check catches a program manager whose view of the cycle
      predates another deficiency's closure, escalation, or the cycle decision itself.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: case_inclusion_classification
    trigger: "on POST /registry-cases; on RegistryCase ABSTRACTED -> VALIDATED; on POST /registry-cases/{id}/transfer-out; on POST /registry-cases/{id}/transfer-out/rescind"
    algorithm: threshold
    formula: |
      # effective_iss is the audit-grade ISS when an adjudicated abstraction exists, else the
      # arrival-recorded value. Branches are evaluated top to bottom; the first match wins.
      tier = ActivationCriteriaTier[case.activation_tier_id]
      effective_iss = (case.abstraction_status IN {VALIDATED, LOCKED})
                      ? (latest AbstractionRecord of the case with validation_status == VALIDATED,
                         ordered by created_at DESC).iss_abstracted
                      : case.injury_severity_score

      IF case.transfer_out_to_center_id IS NOT NULL
         AND case.los_hours < TRANSFER_OUT_LOS_HOURS (24.00)
         AND effective_iss < TRANSFER_OUT_ISS_FLOOR (9):
          inclusion_status = EXCLUDED ; inclusion_reason = TRANSFER_OUT_MINOR_UNDER_24H
      ELIF effective_iss < MIN_ISS_INCLUSION (4) AND tier.tier_code == 'TIER_3_CONSULT':
          inclusion_status = EXCLUDED ; inclusion_reason = BELOW_INJURY_THRESHOLD
      ELSE:
          inclusion_status = INCLUDED ; inclusion_reason = MEETS_INCLUSION_CRITERIA

      # cohort partition, rewritten on every evaluation for the owning center:
      center.registry_included_case_count = count(RegistryCase where center_id == center.id AND inclusion_status == INCLUDED)
      center.registry_excluded_case_count = count(RegistryCase where center_id == center.id AND inclusion_status == EXCLUDED)
    input_set: "all RegistryCase rows of the center regardless of abstraction_status or triage_review_status; no time window"
    constants:
      TRANSFER_OUT_LOS_HOURS: 24.00
      TRANSFER_OUT_ISS_FLOOR: 9
      MIN_ISS_INCLUSION: 4
    precision: "integers compared exactly; los_hours compared at 2 decimals"

  - name: under_over_triage_rates
    trigger: "on POST /registry-cases/{id}/triage-review; on RegistryCase ABSTRACTED -> VALIDATED; on POST /registry-cases/{id}/transfer-out and its rescind; on GET /trauma-centers/{id}/triage-rates"
    algorithm: aggregation
    formula: |
      # cohort, ISS source and numerator predicates ALL depend on the variant.
      denominator = count(cohort)
      under_triage_rate_pct = (denominator == 0) ? 0.00 : round_half_up(100.0 * under_numerator / denominator, 2)
      over_triage_rate_pct  = (denominator == 0) ? 0.00 : round_half_up(100.0 * over_numerator  / denominator, 2)

      # PROVISIONAL_MONITORING (persisted onto TraumaCenter.under_triage_rate_pct / over_triage_rate_pct):
      cohort           = RegistryCase where center_id == C AND inclusion_status == INCLUDED
      under_numerator  = count(cohort where triage_review_status == UNDER_TRIAGE_CONFIRMED)
      over_numerator   = count(cohort where triage_review_status == OVER_TRIAGE_CONFIRMED)

      # VERIFICATION_AUDIT (read-only, returned by GET /trauma-centers/{id}/triage-rates?variant=VERIFICATION_AUDIT):
      cohort           = RegistryCase where center_id == C AND inclusion_status == INCLUDED
                                       AND abstraction_status IN {VALIDATED, LOCKED}
      under_numerator  = count(cohort where effective_iss >= CRIBARI_ISS (16)
                                       AND ActivationCriteriaTier[activation_tier_id].tier_code == 'TIER_3_CONSULT')
      over_numerator   = count(cohort where effective_iss < TRANSFER_OUT_ISS_FLOOR (9)
                                       AND ActivationCriteriaTier[activation_tier_id].tier_code == 'TIER_1_FULL')

      # threshold trigger, evaluated only on the PROVISIONAL_MONITORING result after it is persisted:
      IF under_triage_rate_pct >= UNDER_TRIAGE_ALERT_PCT (5.00)
         AND no PIEvent of center C has event_type == UNDER_TRIAGE
             AND status IN {IDENTIFIED, UNDER_REVIEW, ACTION_PLANNED, REOPENED}:
          create PIEvent(origin = SYSTEM_AUTO, event_type = UNDER_TRIAGE, severity = HIGH)
    input_set: "PROVISIONAL_MONITORING includes every INCLUDED case of the center at any abstraction_status; VERIFICATION_AUDIT includes only INCLUDED cases whose abstraction_status is VALIDATED or LOCKED"
    constants:
      UNDER_TRIAGE_ALERT_PCT: 5.00
      OVER_TRIAGE_ALERT_PCT: 35.00
      CRIBARI_ISS: 16
    precision: "2 decimal places, round_half_up; a zero denominator yields 0.00 and never an error"
    variants:
      - name: PROVISIONAL_MONITORING
        when: "persisted on the center and used by every threshold and posture check"
        difference: "cohort spans all INCLUDED cases and the numerators are the director's confirmed review outcomes"
      - name: VERIFICATION_AUDIT
        when: "requested explicitly on GET /trauma-centers/{id}/triage-rates for site-visit packets"
        difference: "cohort is narrowed to adjudicated cases and the numerators are recomputed from the Cribari ISS/tier matrix instead of review outcomes, so identical data yields different rates"

  - name: dictionary_penalty_scan
    trigger: "on POST /registry-cases/{id}/abstractions (PENDING/ABSTRACTED/REJECTED -> ABSTRACTED)"
    algorithm: weighted_scoring
    formula: |
      # EVALUATION ORDER IS PINNED. The band multiplier reads the center's registry_compliance_score
      # AS PERSISTED AT THE START OF THIS REQUEST, i.e. before this submission's penalty is applied.
      # Recomputing the band after subtracting the penalty is a different, wrong answer.
      STEP 1: score_at_request_start = center.registry_compliance_score
              band_multiplier_used = (score_at_request_start >= 95.00) ? 1.0
                                   : (score_at_request_start >= 90.00) ? 1.5
                                   : 2.0
      STEP 2: violations = DataDictionaryRule rows evaluated in ascending
              (severity_rank, field_name) order where severity_rank = {CRITICAL:1, MAJOR:2, MINOR:3}:
                REQUIRED    -> violated when the submitted value of field_name IS NULL
                RANGE       -> violated when the value IS NOT NULL and (value < min_value OR value > max_value)
                CONFORMANCE -> violated when the value IS NOT NULL and value NOT IN allowed_codes
              error_weight = {CRITICAL: 4, MAJOR: 2, MINOR: 1}
              raw_penalty = sum(error_weight over violated rules)
              dictionary_error_count = count(violated rules)
      STEP 3: applied_penalty_points = round_half_up(raw_penalty * band_multiplier_used, 2)
      STEP 4: center.registry_compliance_score = round_half_up(max(0.00, score_at_request_start - applied_penalty_points), 2)
      # A submission that violates any rule with severity == CRITICAL is rejected at validation
      # priority 52 before STEP 3 runs, so no penalty is written and no AbstractionRecord is created.
    input_set: "every DataDictionaryRule row in the database; rules are global configuration, not center-scoped"
    constants:
      WEIGHT_CRITICAL: 4
      WEIGHT_MAJOR: 2
      WEIGHT_MINOR: 1
      BAND_HIGH_MIN: 95.00
      BAND_MID_MIN: 90.00
    precision: "2 decimal places, round_half_up; score floors at 0.00"

  - name: outreach_credit_hour_ledger
    trigger: "on POST /outreach-activities/{id}/verify and on POST /outreach-activities/{id}/reject"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: quantize each activity to the nearest 0.25 hour FIRST, then sum.
      # Summing raw weighted hours and quantizing the total once is a different, wrong answer
      # (e.g. 1.65 + 1.15 + 0.375 quantizes to 3.25, while per-activity quantization sums to 3.50).
      KIND_WEIGHT = { INJURY_PREVENTION: 1.5, PROFESSIONAL_EDUCATION: 1.0, COMMUNITY_OUTREACH: 0.5 }
      quantize_quarter(x) = round_half_up(x * 4, 0) / 4
      for each OutreachActivity a of center C:
          a.weighted_credit_hours = quantize_quarter(a.credit_hours * KIND_WEIGHT[a.activity_kind])
      center.outreach_credit_hours_ytd =
          round_half_up(sum(a.weighted_credit_hours for a in OutreachActivity
                            where center_id == C AND verified_status == VERIFIED), 2)
    input_set: "only OutreachActivity rows with verified_status == VERIFIED; LOGGED and REJECTED rows contribute nothing; no date window"
    constants:
      KIND_WEIGHT_INJURY_PREVENTION: 1.5
      KIND_WEIGHT_PROFESSIONAL_EDUCATION: 1.0
      KIND_WEIGHT_COMMUNITY_OUTREACH: 0.5
      QUANTUM_HOURS: 0.25
    precision: "per-activity quantization to 0.25 with round_half_up, then a 2-decimal round_half_up on the sum"

  - name: verification_readiness_score
    trigger: "on POST /verification-cycles/{id}/deficiencies; on POST /criteria-deficiencies/{id}/remediation; on POST /criteria-deficiencies/{id}/close; on PIEvent creation, close-loop and reopen; on POST /outreach-activities/{id}/verify; on POST /outreach-activities/{id}/reject; on POST /registry-cases/{id}/abstractions; on POST /verification-cycles/{id}/submit; on GET /verification-cycles/{id}/readiness"
    algorithm: weighted_scoring
    formula: |
      # Four independent penalty inputs, each capped, one of which branches on cycle_type.
      OPEN_SET = (variant == 'SELF_ASSESSMENT')      ? {OPEN, ESCALATED}
               : (variant == 'REVIEWER_ASSESSMENT')  ? {OPEN, REMEDIATION_SUBMITTED, ESCALATED}
      t1 = count(CriteriaDeficiency of this cycle where deficiency_class == TYPE_I_CRITICAL  AND status IN OPEN_SET)
      t2 = count(CriteriaDeficiency of this cycle where deficiency_class == TYPE_II_MAJOR    AND status IN OPEN_SET)
      t3 = count(CriteriaDeficiency of this cycle where deficiency_class == TYPE_III_MINOR   AND status IN OPEN_SET)
      deficiency_penalty = min(60, 15*t1 + 6*t2 + 2*t3)

      required_outreach_hours = (cycle.cycle_type == 'NATIONAL_VERIFICATION') ? 12.00 : 8.00
      outreach_gap     = max(0.00, required_outreach_hours - center.outreach_credit_hours_ytd)
      outreach_penalty = min(20.00, round_half_up(outreach_gap * 1.5, 2))

      overdue_loops = count(PIEvent where center_id == cycle.center_id
                            AND status IN {IDENTIFIED, UNDER_REVIEW, ACTION_PLANNED, REOPENED}
                            AND loop_closure_due_at < clock_now)
      pi_penalty = (cycle.cycle_type == 'NATIONAL_VERIFICATION')
                   ? min(20, 4*center.open_pi_event_count + 8*overdue_loops)
                   : min(10, 2*center.open_pi_event_count)

      registry_penalty = max(0.00, round_half_up((100.00 - center.registry_compliance_score) * 0.25, 2))

      readiness_score = round_half_up(max(0.00, 100.00 - deficiency_penalty - outreach_penalty
                                                       - pi_penalty - registry_penalty), 2)
    input_set: "CriteriaDeficiency rows of this cycle only; PIEvent and outreach/registry inputs are center-wide and variant-independent"
    constants:
      DEFICIENCY_PENALTY_CAP: 60
      WEIGHT_TYPE_I: 15
      WEIGHT_TYPE_II: 6
      WEIGHT_TYPE_III: 2
      REQUIRED_OUTREACH_HOURS_NATIONAL: 12.00
      REQUIRED_OUTREACH_HOURS_STATE: 8.00
      OUTREACH_PENALTY_RATE: 1.5
      OUTREACH_PENALTY_CAP: 20.00
      PI_PENALTY_CAP_NATIONAL: 20
      PI_PENALTY_CAP_STATE: 10
      REGISTRY_PENALTY_RATE: 0.25
      SUBMIT_MIN_READINESS: 70.00
    precision: "2 decimal places, round_half_up; the score floors at 0.00"
    variants:
      - name: REVIEWER_ASSESSMENT
        when: "persisted onto VerificationCycle.readiness_score, used by the submit gate and by the PREP <-> PREP_BLOCKED auto-transitions; default of GET /verification-cycles/{id}/readiness"
        difference: "counts REMEDIATION_SUBMITTED deficiencies as still open, so a center's own remediation packets do not improve the score until the reviewing authority closes them"
      - name: SELF_ASSESSMENT
        when: "requested explicitly on GET /verification-cycles/{id}/readiness?variant=SELF_ASSESSMENT for the center's pre-review gap analysis"
        difference: "treats REMEDIATION_SUBMITTED as resolved, so identical deficiency data produces a higher score than the reviewer variant"

  - name: response_time_compliance
    trigger: "on POST /registry-cases/{id}/response-logs"
    algorithm: threshold
    formula: |
      tier = ActivationCriteriaTier[case.activation_tier_id]
      applicable_limit_minutes = (log.responder_role == 'SURGEON')
                                 ? tier.surgeon_response_limit_minutes
                                 : tier.specialty_response_limit_minutes
      IF log.arrived_at IS NULL:
          response_minutes = null ; compliance_status = UNDOCUMENTED
      ELSE:
          response_minutes = round_half_up((log.arrived_at - log.notified_at) in minutes, 2)
          compliance_status = (response_minutes <= applicable_limit_minutes) ? COMPLIANT : LATE
      # side effect chain: a LATE or UNDOCUMENTED SURGEON log creates a PIEvent
      # (origin = SYSTEM_AUTO, event_type = DELAYED_SURGEON, severity = HIGH), which raises
      # center.open_pi_event_count and therefore re-runs readiness_posture and every cycle's
      # verification_readiness_score.
    input_set: "the single ResponseLog being created plus its case's tier row"
    constants:
      SURGEON_ROLE: SURGEON
    precision: "response_minutes at 2 decimals, round_half_up; the limit comparison is inclusive (<=), so a response exactly at the limit is COMPLIANT"

  - name: readiness_posture
    trigger: "on every mutation of open_critical_deficiency_count, escalated_critical_deficiency_count, open_pi_event_count, under_triage_rate_pct, over_triage_rate_pct, national_verification_status; and on POST /verification-cycles/{id}/decide"
    algorithm: constraint_propagation
    formula: |
      # First matching branch wins; the ordering is normative.
      overdue_loops = count(PIEvent where center_id == C
                            AND status IN {IDENTIFIED, UNDER_REVIEW, ACTION_PLANNED, REOPENED}
                            AND loop_closure_due_at < clock_now)
      IF center.national_verification_status == 'SUSPENDED'
         OR center.escalated_critical_deficiency_count >= ESCALATION_SUSPEND_COUNT (2):
          readiness_posture = SUSPENDED
      ELIF center.open_critical_deficiency_count >= 1
           OR center.under_triage_rate_pct >= UNDER_TRIAGE_ALERT_PCT (5.00)
           OR overdue_loops >= 1:
          readiness_posture = AT_RISK
      ELIF center.open_pi_event_count >= CONDITIONAL_PI_COUNT (3)
           OR center.over_triage_rate_pct >= OVER_TRIAGE_ALERT_PCT (35.00):
          readiness_posture = CONDITIONAL
      ELSE:
          readiness_posture = READY
      # SUSPENDED gates POST /registry-cases/{id}/lock and POST /verification-cycles/{id}/submit
      # with ERR_POSTURE_SUSPENDED at validation priority 50.
    input_set: "center-scoped counters and rates only; no cross-center inputs"
    constants:
      ESCALATION_SUSPEND_COUNT: 2
      CONDITIONAL_PI_COUNT: 3
      UNDER_TRIAGE_ALERT_PCT: 5.00
      OVER_TRIAGE_ALERT_PCT: 35.00
    precision: "rate comparisons at 2 decimals; counters are exact integers"

  - name: surveyor_window_conflict
    trigger: "on POST /verification-cycles/{id}/surveyor-bookings"
    algorithm: interval_merge
    formula: |
      # CLOSED windows plus a symmetric travel buffer. Adjacency is NOT enough: a new window must
      # start strictly more than TRAVEL_BUFFER_HOURS after an existing window ends, or end strictly
      # more than TRAVEL_BUFFER_HOURS before it starts.
      BUFFER = TRAVEL_BUFFER_HOURS (24) hours
      conflict(new, existing) =
          (new.window_start < existing.window_end + BUFFER)
          AND (existing.window_start < new.window_end + BUFFER)
      candidate_set = SurveyorBooking where surveyor_user_id == new.surveyor_user_id
                      AND verification_cycle_id != new.verification_cycle_id OR same cycle
                      (i.e. every existing booking of that surveyor, across all cycles and centers)
      reject with ERR_SURVEYOR_WINDOW_CONFLICT when any candidate conflicts, evaluated in
      ascending (window_start, created_at) order and reporting the first conflict found
    input_set: "every SurveyorBooking row of the same surveyor_user_id regardless of cycle status"
    constants:
      TRAVEL_BUFFER_HOURS: 24
    precision: "timestamp comparison at second granularity; a gap of exactly 24 hours is accepted because both comparisons are strict"

  - name: agreement_interval_overlap
    trigger: "on POST /referral-agreements/{id}/activate"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [effective_from, effective_to). Adjacency IS allowed: an interval that
      # starts exactly when another ends does not overlap.
      overlap(new, existing) =
          (new.effective_from < existing.effective_to)
          AND (existing.effective_from < new.effective_to)
      candidate_set = ReferralAgreement where referring_center_id == new.referring_center_id
                      AND receiving_center_id == new.receiving_center_id
                      AND agreement_status == ACTIVE
      reject with ERR_AGREEMENT_INTERVAL_OVERLAP when any candidate overlaps, evaluated in
      ascending (effective_from, created_at) order
    input_set: "only ACTIVE agreements on the identical ordered center pair; DRAFT and TERMINATED rows are ignored, and the reversed pair is a different resource"
    constants:
      DIRECTED_PAIR: "(referring_center_id, receiving_center_id)"
    precision: "timestamp comparison at second granularity; half-open semantics make touching intervals legal"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for TraumaProgramManager, X-User-ID equals the center in scope: body center_id, case.center_id, cycle.center_id, the cycle center of a deficiency, activity.center_id, agreement.referring_center_id on create, agreement.receiving_center_id on activate, or either party on terminate"
    error_id: ERR_CENTER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all TraumaProgramManager write endpoints"
  - priority: 4
    category: auth
    check: "the deciding authority matches cycle_type: NATIONAL_VERIFICATION may only be decided, deficiency-closed and site-booked by VerificationReviewer; STATE_DESIGNATION only by StateDesignationOfficer"
    error_id: ERR_DESIGNATION_AUTHORITY_MISMATCH
    http_status: 403
    applies_to: "POST /verification-cycles/{id}/decide, POST /verification-cycles/{id}/deficiencies, POST /criteria-deficiencies/{id}/close, POST /verification-cycles/{id}/surveyor-bookings, POST /verification-cycles/{id}/begin-review"
  - priority: 10
    category: existence
    check: "the trauma center in the path or body exists"
    error_id: ERR_CENTER_NOT_FOUND
    http_status: 404
    applies_to: "all /trauma-centers/{id}/* endpoints, POST /registry-cases, POST /pi-events, POST /verification-cycles, POST /referral-agreements"
  - priority: 11
    category: existence
    check: "the registry case in the path or body exists"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all /registry-cases/{id}/* endpoints, POST /pi-events with case_id"
  - priority: 12
    category: existence
    check: "the verification cycle in the path exists"
    error_id: ERR_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "all /verification-cycles/{id}/* endpoints"
  - priority: 13
    category: existence
    check: "the PI event in the path exists"
    error_id: ERR_PI_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "all /pi-events/{id}/* endpoints"
  - priority: 14
    category: existence
    check: "any other referenced resource exists: abstraction, corrective action, criteria deficiency, outreach activity, referral agreement, activation tier id in the body, receiving center id in a transfer-out body"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "/abstractions/{id}/validate, /abstractions/{id}/reject, /corrective-actions/{id}/*, /criteria-deficiencies/{id}/*, /outreach-activities/{id}/verify, /outreach-activities/{id}/reject, /referral-agreements/{id}/*, POST /registry-cases, POST /registry-cases/{id}/transfer-out"
  - priority: 20
    category: existence
    check: "every required body field of the endpoint is present and correctly typed; limit is 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 21
    category: existence
    check: "every enum-typed body field carries a declared member of that enum, including triage_review_status, decision, deficiency_class, activity_kind, responder_role, event_type, severity, tier_code, rule_kind, cycle_type, variant"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all endpoints with enum inputs"
  - priority: 30
    category: state
    check: "expected_case_version equals RegistryCase.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /registry-cases/{id}/abstractions"
  - priority: 31
    category: state
    check: "expected_cycle_version equals the parent VerificationCycle.version"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /criteria-deficiencies/{id}/remediation"
  - priority: 40
    category: state
    check: "case.abstraction_status IN {PENDING, ABSTRACTED, REJECTED} for a new abstraction submission"
    error_id: ERR_CASE_NOT_ABSTRACTABLE
    http_status: 409
    applies_to: "POST /registry-cases/{id}/abstractions"
  - priority: 41
    category: state
    check: "case.abstraction_status != LOCKED for lock, transfer-out and transfer-out rescind"
    error_id: ERR_CASE_ALREADY_LOCKED
    http_status: 409
    applies_to: "POST /registry-cases/{id}/lock, POST /registry-cases/{id}/transfer-out, POST /registry-cases/{id}/transfer-out/rescind"
  - priority: 42
    category: state
    check: "case.triage_review_status == UNREVIEWED"
    error_id: ERR_TRIAGE_ALREADY_REVIEWED
    http_status: 409
    applies_to: "POST /registry-cases/{id}/triage-review"
  - priority: 43
    category: state
    check: "abstraction.validation_status == SUBMITTED"
    error_id: ERR_ABSTRACTION_ALREADY_ADJUDICATED
    http_status: 409
    applies_to: "POST /abstractions/{id}/validate, POST /abstractions/{id}/reject"
  - priority: 44
    category: state
    check: "the cycle is in the from-state the requested transition declares in §1.2, including 'deficiencies may only be recorded while status IN {PREP, PREP_BLOCKED, UNDER_REVIEW, CONTINGENCY}'"
    error_id: ERR_INVALID_CYCLE_STATE
    http_status: 409
    applies_to: "POST /verification-cycles/{id}/submit, POST /verification-cycles/{id}/surveyor-bookings, POST /verification-cycles/{id}/schedule-site-visit, POST /verification-cycles/{id}/begin-review, POST /verification-cycles/{id}/decide, POST /verification-cycles/{id}/deficiencies"
  - priority: 45
    category: state
    check: "the PI event is in the from-state the requested transition declares in §1.2"
    error_id: ERR_INVALID_PI_STATE
    http_status: 409
    applies_to: "POST /pi-events/{id}/start-review, POST /pi-events/{id}/corrective-actions, POST /pi-events/{id}/close-loop, POST /pi-events/{id}/reopen"
  - priority: 46
    category: state
    check: "deficiency.status is a legal from-state: {OPEN, ESCALATED, REMEDIATION_SUBMITTED} for remediation, {REMEDIATION_SUBMITTED, ESCALATED} for close"
    error_id: ERR_INVALID_DEFICIENCY_STATE
    http_status: 409
    applies_to: "POST /criteria-deficiencies/{id}/remediation, POST /criteria-deficiencies/{id}/close"
  - priority: 47
    category: state
    check: "action.completion_status == OPEN for complete and == COMPLETED for verify"
    error_id: ERR_INVALID_ACTION_STATE
    http_status: 409
    applies_to: "POST /corrective-actions/{id}/complete, POST /corrective-actions/{id}/verify"
  - priority: 48
    category: state
    check: "agreement.agreement_status == DRAFT for activate and == ACTIVE for terminate"
    error_id: ERR_INVALID_AGREEMENT_STATE
    http_status: 409
    applies_to: "POST /referral-agreements/{id}/activate, POST /referral-agreements/{id}/terminate"
  - priority: 49
    category: state
    check: "activity.verified_status IN {LOGGED, REJECTED} for a VERIFY decision and IN {LOGGED, VERIFIED} for a REJECT decision"
    error_id: ERR_INVALID_OUTREACH_STATE
    http_status: 409
    applies_to: "POST /outreach-activities/{id}/verify, POST /outreach-activities/{id}/reject"
  - priority: 50
    category: business_safety
    check: "TraumaCenter.readiness_posture != SUSPENDED"
    error_id: ERR_POSTURE_SUSPENDED
    http_status: 409
    applies_to: "POST /registry-cases/{id}/lock, POST /verification-cycles/{id}/submit"
  - priority: 52
    category: business_safety
    check: "the abstraction submission violates no DataDictionaryRule with severity == CRITICAL"
    error_id: ERR_DICTIONARY_CRITICAL_VIOLATION
    http_status: 422
    applies_to: "POST /registry-cases/{id}/abstractions"
  - priority: 54
    category: business_safety
    check: "the case's latest AbstractionRecord has validation_status == VALIDATED before the case may be locked"
    error_id: ERR_ABSTRACTION_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /registry-cases/{id}/lock"
  - priority: 55
    category: business_safety
    check: "the PI event has at least one CorrectiveAction and every CorrectiveAction has completion_status == VERIFIED"
    error_id: ERR_OPEN_ACTIONS_BLOCK_LOOP_CLOSURE
    http_status: 409
    applies_to: "POST /pi-events/{id}/close-loop"
  - priority: 56
    category: business_safety
    check: "cycle.open_type_i_count == 0 before a VERIFIED decision"
    error_id: ERR_CRITICAL_DEFICIENCY_BLOCKS_VERIFICATION
    http_status: 409
    applies_to: "POST /verification-cycles/{id}/decide with decision = VERIFIED"
  - priority: 60
    category: business_referential
    check: "an ACTIVE ReferralAgreement covers (case.center_id -> payload.transfer_out_to_center_id) with effective_from <= case.arrival_at < effective_to"
    error_id: ERR_NO_ACTIVE_REFERRAL_AGREEMENT
    http_status: 409
    applies_to: "POST /registry-cases/{id}/transfer-out"
  - priority: 62
    category: business_temporal
    check: "clock_now <= case.arrival_at + ABSTRACTION_WINDOW_DAYS (60)"
    error_id: ERR_ABSTRACTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /registry-cases/{id}/abstractions"
  - priority: 63
    category: business_temporal
    check: "remediation_due_at > clock_now and window_end > window_start and effective_to > effective_from"
    error_id: ERR_INVALID_INTERVAL_DATES
    http_status: 422
    applies_to: "POST /verification-cycles/{id}/deficiencies, POST /verification-cycles/{id}/surveyor-bookings, POST /referral-agreements"
  - priority: 64
    category: business_constraint
    check: "segregation of duties: X-User-ID != abstraction.submitted_by_user_id on validate, != action.owner_user_id on verify, and not any action owner of the event on close-loop"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /abstractions/{id}/validate, POST /abstractions/{id}/reject, POST /corrective-actions/{id}/verify, POST /pi-events/{id}/close-loop"
  - priority: 65
    category: business_constraint
    check: "(center_id, mrn) is unique across RegistryCase"
    error_id: ERR_DUPLICATE_CASE_MRN
    http_status: 409
    applies_to: "POST /registry-cases"
  - priority: 66
    category: business_constraint
    check: "(field_name, rule_kind) is unique across DataDictionaryRule and (center_id, tier_code) is unique across ActivationCriteriaTier"
    error_id: ERR_DUPLICATE_CONFIGURATION
    http_status: 409
    applies_to: "POST /data-dictionary-rules, POST /trauma-centers/{id}/activation-tiers"
  - priority: 67
    category: business_constraint
    check: "no ACTIVE agreement on the same directed center pair has a half-open interval intersecting the requested one"
    error_id: ERR_AGREEMENT_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /referral-agreements/{id}/activate"
  - priority: 68
    category: business_constraint
    check: "no existing booking of the same surveyor_user_id lies within TRAVEL_BUFFER_HOURS (24) of the requested closed window"
    error_id: ERR_SURVEYOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /verification-cycles/{id}/surveyor-bookings"
  - priority: 70
    category: business_constraint
    check: "cycle.readiness_score (REVIEWER_ASSESSMENT) >= SUBMIT_MIN_READINESS (70.00)"
    error_id: ERR_READINESS_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /verification-cycles/{id}/submit"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- TraumaCenter and configuration ---
  - method: POST
    path: "/trauma-centers"
    description: "register a verified trauma center; posture starts READY and every counter at 0"
    roles: [SystemAdmin]
    code: 201
    input: [name, state_code, designation_level, verification_cycle_start_date]
    output: TraumaCenter
    side_effects: ["readiness_posture = READY", "registry_compliance_score = 100.00", "outreach_credit_hours_ytd = 0.00", "version = 1"]
  - method: GET
    path: "/trauma-centers/{id}"
    description: "read one center including every computed posture, rate and counter field"
    roles: [SystemAdmin, TraumaProgramManager, RegistryAbstractor, RegistryValidator, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: []
    output: TraumaCenter
    side_effects: []
  - method: GET
    path: "/trauma-centers"
    description: "list centers with pagination and posture/state filters"
    roles: [SystemAdmin, TraumaProgramManager, RegistryAbstractor, RegistryValidator, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["state_code?", "readiness_posture?", "limit?", "offset?"]
    output: TraumaCenter[]
    side_effects: []
  - method: POST
    path: "/trauma-centers/{id}/activation-tiers"
    description: "configure one activation criteria tier for the center; unique per (center_id, tier_code)"
    roles: [SystemAdmin, TraumaProgramManager]
    code: 201
    input: [tier_code, surgeon_response_limit_minutes, specialty_response_limit_minutes, iss_threshold]
    output: ActivationCriteriaTier
    side_effects: ["no derived field changes"]
  - method: GET
    path: "/trauma-centers/{id}/activation-tiers"
    description: "reverse lookup of ActivationCriteriaTier rows from the owning center"
    roles: [SystemAdmin, TraumaProgramManager, RegistryAbstractor, RegistryValidator, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["tier_code?"]
    output: ActivationCriteriaTier[]
    side_effects: []
  - method: GET
    path: "/trauma-centers/{id}/triage-rates"
    description: "computed read of calculations.under_over_triage_rates; variant defaults to PROVISIONAL_MONITORING"
    roles: [SystemAdmin, TraumaProgramManager, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["variant?"]
    output: { variant: string, denominator_case_count: integer, under_triage_numerator: integer, over_triage_numerator: integer, under_triage_rate_pct: number, over_triage_rate_pct: number }
    side_effects: ["read-only; never persists the VERIFICATION_AUDIT variant onto the center"]
  - method: POST
    path: "/trauma-centers/{id}/outreach-activities"
    description: "log an outreach, injury-prevention or professional-education activity; starts LOGGED and contributes nothing until verified"
    roles: [TraumaProgramManager]
    code: 201
    input: [activity_kind, event_date, credit_hours, audience_count]
    output: OutreachActivity
    side_effects: ["weighted_credit_hours computed via quantize_quarter", "center.outreach_credit_hours_ytd unchanged while verified_status == LOGGED"]
  - method: GET
    path: "/trauma-centers/{id}/outreach-activities"
    description: "reverse lookup of OutreachActivity rows from the owning center"
    roles: [SystemAdmin, TraumaProgramManager, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["verified_status?", "activity_kind?", "limit?", "offset?"]
    output: OutreachActivity[]
    side_effects: []
  - method: GET
    path: "/trauma-centers/{id}/referral-agreements"
    description: "reverse lookup of ReferralAgreement rows where this center is the referring or the receiving party"
    roles: [SystemAdmin, TraumaProgramManager, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["direction?", "agreement_status?"]
    output: ReferralAgreement[]
    side_effects: []
  - method: GET
    path: "/trauma-centers/{id}/verification-cycles"
    description: "reverse lookup of VerificationCycle rows from the owning center"
    roles: [SystemAdmin, TraumaProgramManager, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["cycle_type?", "status?"]
    output: VerificationCycle[]
    side_effects: []
  - method: POST
    path: "/data-dictionary-rules"
    description: "declare one registry data-dictionary rule; immutable configuration, unique per (field_name, rule_kind)"
    roles: [SystemAdmin]
    code: 201
    input: [field_name, rule_kind, severity, "min_value?", "max_value?", "allowed_codes?"]
    output: DataDictionaryRule
    side_effects: ["error_weight derived from severity"]
  - method: GET
    path: "/data-dictionary-rules"
    description: "list dictionary rules; immutable rows carry no version or updated_at"
    roles: [SystemAdmin, TraumaProgramManager, RegistryAbstractor, RegistryValidator, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["severity?", "rule_kind?", "limit?", "offset?"]
    output: DataDictionaryRule[]
    side_effects: []
  - method: POST
    path: "/referral-agreements"
    description: "draft a referral centre agreement for a directed center pair"
    roles: [TraumaProgramManager]
    code: 201
    input: [referring_center_id, receiving_center_id, effective_from, effective_to, guaranteed_acceptance_minutes]
    output: ReferralAgreement
    side_effects: ["agreement_status = DRAFT"]
  - method: POST
    path: "/referral-agreements/{id}/activate"
    description: "the receiving center activates the agreement; enforces half-open interval exclusivity on the directed pair"
    roles: [TraumaProgramManager]
    code: 200
    input: []
    output: ReferralAgreement
    side_effects: ["agreement_status = ACTIVE", "activated_at = clock_now", "unlocks transfer-out for the interval"]
  - method: POST
    path: "/referral-agreements/{id}/terminate"
    description: "either party terminates an ACTIVE agreement, freeing the interval"
    roles: [TraumaProgramManager]
    code: 200
    input: [termination_reason]
    output: ReferralAgreement
    side_effects: ["agreement_status = TERMINATED", "terminated_at = clock_now"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint that moves the logical clock. The server's startup default logical time is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the clock reads that default and never falls back to real wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all subsequent clock_now reads, deadline comparisons and *_at stamps use the new value"]

  # --- RegistryCase, abstraction and response documentation ---
  - method: POST
    path: "/registry-cases"
    description: "open a trauma registry case against one activation criteria tier; MRN unique per center"
    roles: [RegistryAbstractor, TraumaProgramManager]
    code: 201
    input: [center_id, activation_tier_id, mrn, arrival_at, injury_severity_score, los_hours, "ed_disposition?", "transfer_in_from_center_id?"]
    output: RegistryCase
    side_effects: ["abstraction_status = PENDING", "triage_review_status = UNREVIEWED", "effective_iss = injury_severity_score", "inclusion_status/inclusion_reason computed via case_inclusion_classification", "center.registry_included_case_count or registry_excluded_case_count incremented by 1", "center.version bumped"]
  - method: GET
    path: "/registry-cases/{id}"
    description: "read one registry case with its computed inclusion and triage-review fields"
    roles: [SystemAdmin, TraumaProgramManager, RegistryAbstractor, RegistryValidator, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: []
    output: RegistryCase
    side_effects: []
  - method: GET
    path: "/registry-cases"
    description: "filtered list of registry cases; reverse lookup for center_id, activation_tier_id, transfer_in_from_center_id and transfer_out_to_center_id"
    roles: [SystemAdmin, TraumaProgramManager, RegistryAbstractor, RegistryValidator, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["center_id?", "activation_tier_id?", "transfer_in_from_center_id?", "transfer_out_to_center_id?", "abstraction_status?", "inclusion_status?", "triage_review_status?", "limit?", "offset?"]
    output: RegistryCase[]
    side_effects: []
  - method: POST
    path: "/registry-cases/{id}/abstractions"
    description: "submit an abstraction against the case; optimistically concurrent on the parent case version and scored by the data-dictionary scan"
    roles: [RegistryAbstractor]
    code: 201
    input: [expected_case_version, "iss_abstracted?", "gcs_arrival?", "mechanism_code?", "ed_departure_at?"]
    output: AbstractionRecord
    side_effects: ["validation_status = SUBMITTED", "dictionary_error_count, band_multiplier_used and applied_penalty_points computed via dictionary_penalty_scan", "center.registry_compliance_score reduced by applied_penalty_points", "case.abstraction_status = ABSTRACTED", "case.version bumped", "center.version bumped", "center.readiness_posture recomputed"]
  - method: GET
    path: "/registry-cases/{id}/abstractions"
    description: "reverse lookup of AbstractionRecord rows from the owning case"
    roles: [SystemAdmin, TraumaProgramManager, RegistryAbstractor, RegistryValidator, TraumaMedicalDirector, VerificationReviewer]
    code: 200
    input: ["validation_status?"]
    output: AbstractionRecord[]
    side_effects: []
  - method: POST
    path: "/abstractions/{id}/validate"
    description: "registry validator accepts the abstraction; a different user from the submitter is required"
    roles: [RegistryValidator]
    code: 200
    input: []
    output: AbstractionRecord
    side_effects: ["validation_status = VALIDATED", "validated_by_user_id = caller", "case.abstraction_status = VALIDATED", "case.effective_iss = iss_abstracted when present", "inclusion_status re-evaluated against the new effective_iss", "center included/excluded counters reconciled", "center.version bumped"]
  - method: POST
    path: "/abstractions/{id}/reject"
    description: "registry validator rejects the abstraction and returns the case for re-abstraction"
    roles: [RegistryValidator]
    code: 200
    input: [rejection_reason]
    output: AbstractionRecord
    side_effects: ["validation_status = REJECTED", "case.abstraction_status = REJECTED", "center.registry_compliance_score restored by applied_penalty_points", "center.readiness_posture recomputed", "center.version bumped"]
  - method: POST
    path: "/registry-cases/{id}/lock"
    description: "lock a validated case so the registry submission is frozen; terminal for the abstraction dimension"
    roles: [TraumaProgramManager]
    code: 200
    input: []
    output: RegistryCase
    side_effects: ["abstraction_status = LOCKED", "locked_at = clock_now"]
  - method: POST
    path: "/registry-cases/{id}/triage-review"
    description: "medical director adjudicates the triage decision for this case; UNDER_TRIAGE_CONFIRMED drives the four-hop cascade"
    roles: [TraumaMedicalDirector]
    code: 200
    input: [triage_review_status, "review_note?"]
    output: RegistryCase
    side_effects: ["triage_review_status set", "center under/over triage rates recomputed (PROVISIONAL_MONITORING)", "on UNDER_TRIAGE_CONFIRMED a SYSTEM_AUTO PIEvent is opened and center.open_pi_event_count incremented", "center.readiness_posture recomputed", "center.version bumped"]
  - method: POST
    path: "/registry-cases/{id}/transfer-out"
    description: "record a transfer-out to a receiving center; requires an ACTIVE referral agreement covering arrival_at"
    roles: [TraumaProgramManager, RegistryAbstractor]
    code: 200
    input: [transfer_out_to_center_id]
    output: RegistryCase
    side_effects: ["transfer_out_to_center_id set and ed_disposition = TRANSFER_OUT", "calculations.case_inclusion_classification re-run: a case with los_hours < 24.00 and effective_iss < 9 flips to EXCLUDED / TRANSFER_OUT_MINOR_UNDER_24H", "center.registry_included_case_count and registry_excluded_case_count rewritten", "triage rates and readiness_posture recomputed", "case.version bumped", "center.version bumped"]
  - method: POST
    path: "/registry-cases/{id}/transfer-out/rescind"
    description: "reverse a recorded transfer-out; the compensating action for the cohort-partition invariant"
    roles: [TraumaProgramManager]
    code: 200
    input: [rescind_reason]
    output: RegistryCase
    side_effects: ["transfer_out_to_center_id cleared and ed_disposition = ADMIT", "calculations.case_inclusion_classification re-run so an EXCLUDED / TRANSFER_OUT_MINOR_UNDER_24H case returns to INCLUDED / MEETS_INCLUSION_CRITERIA", "center cohort counters restored to their pre-transfer values", "triage rates and readiness_posture recomputed", "case.version bumped", "center.version bumped"]
  - method: POST
    path: "/registry-cases/{id}/response-logs"
    description: "document notification and arrival for one required specialty responder"
    roles: [RegistryAbstractor, TraumaProgramManager]
    code: 201
    input: [responder_role, responder_user_id, notified_at, "arrived_at?"]
    output: ResponseLog
    side_effects: ["response_minutes, applicable_limit_minutes and compliance_status computed via response_time_compliance", "a LATE surgeon log opens a SYSTEM_AUTO DELAYED_SURGEON PIEvent and increments center.open_pi_event_count", "center.version bumped"]
  - method: GET
    path: "/registry-cases/{id}/response-logs"
    description: "reverse lookup of ResponseLog rows from the owning case"
    roles: [SystemAdmin, TraumaProgramManager, RegistryAbstractor, RegistryValidator, TraumaMedicalDirector, VerificationReviewer]
    code: 200
    input: ["responder_role?", "compliance_status?"]
    output: ResponseLog[]
    side_effects: []

  # --- PIPS: events, corrective actions and loop closure ---
  - method: POST
    path: "/pi-events"
    description: "medical director opens a performance-improvement / patient-safety event manually"
    roles: [TraumaMedicalDirector]
    code: 201
    input: [center_id, event_type, severity, "case_id?", "source_deficiency_id?"]
    output: PIEvent
    side_effects: ["status = IDENTIFIED", "origin = MANUAL", "opened_at = clock_now", "loop_closure_due_at = opened_at + LOOP_CLOSURE_DAYS (60)", "review_round = 1", "center.open_pi_event_count incremented by 1", "center.readiness_posture recomputed", "center.version bumped"]
  - method: GET
    path: "/pi-events/{id}"
    description: "read one PI event with its loop-closure deadline and action counters"
    roles: [SystemAdmin, TraumaProgramManager, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: []
    output: PIEvent
    side_effects: []
  - method: GET
    path: "/pi-events"
    description: "filtered list of PI events; reverse lookup for center_id, case_id and source_deficiency_id"
    roles: [SystemAdmin, TraumaProgramManager, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["center_id?", "case_id?", "source_deficiency_id?", "status?", "event_type?", "origin?", "limit?", "offset?"]
    output: PIEvent[]
    side_effects: []
  - method: POST
    path: "/pi-events/{id}/start-review"
    description: "move an identified event into multidisciplinary review"
    roles: [TraumaMedicalDirector]
    code: 200
    input: []
    output: PIEvent
    side_effects: ["status = UNDER_REVIEW", "review_round unchanged on the first pass"]
  - method: POST
    path: "/pi-events/{id}/corrective-actions"
    description: "attach a corrective action to an event under review; moves the event to ACTION_PLANNED"
    roles: [TraumaMedicalDirector, TraumaProgramManager]
    code: 201
    input: [action_type, owner_user_id, due_at]
    output: CorrectiveAction
    side_effects: ["completion_status = OPEN", "pi_event.corrective_action_count incremented by 1", "pi_event.status = ACTION_PLANNED", "pi_event.version bumped"]
  - method: GET
    path: "/pi-events/{id}/corrective-actions"
    description: "reverse lookup of CorrectiveAction rows from the owning PI event"
    roles: [SystemAdmin, TraumaProgramManager, TraumaMedicalDirector, VerificationReviewer]
    code: 200
    input: ["completion_status?"]
    output: CorrectiveAction[]
    side_effects: []
  - method: POST
    path: "/corrective-actions/{id}/complete"
    description: "the action owner marks the action complete"
    roles: [TraumaProgramManager, TraumaMedicalDirector]
    code: 200
    input: ["completion_note?"]
    output: CorrectiveAction
    side_effects: ["completion_status = COMPLETED", "completed_at = clock_now"]
  - method: POST
    path: "/corrective-actions/{id}/verify"
    description: "a second reviewer verifies the completed action; the verifier may not be the owner"
    roles: [TraumaMedicalDirector, VerificationReviewer]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: ["completion_status = VERIFIED", "verified_at = clock_now", "verified_by_user_id = caller", "pi_event.verified_action_count incremented by 1", "pi_event.version bumped"]
  - method: POST
    path: "/pi-events/{id}/close-loop"
    description: "document loop closure; every corrective action must already be VERIFIED"
    roles: [TraumaMedicalDirector]
    code: 200
    input: [loop_closure_note]
    output: PIEvent
    side_effects: ["status = LOOP_CLOSED", "closed_at = clock_now", "center.open_pi_event_count decremented by 1", "center.closed_pi_event_count incremented by 1", "center.readiness_posture recomputed", "center.version bumped"]
  - method: POST
    path: "/pi-events/{id}/reopen"
    description: "reopen a closed loop when the reviewer finds the closure unsupported; the compensating counter move must exactly undo close-loop"
    roles: [TraumaMedicalDirector, VerificationReviewer]
    code: 200
    input: [reopen_reason]
    output: PIEvent
    side_effects: ["status = REOPENED", "closed_at cleared", "review_round incremented by 1", "verified_action_count reset to 0 and every VERIFIED action returned to OPEN", "center.open_pi_event_count incremented by 1", "center.closed_pi_event_count decremented by 1", "center.readiness_posture recomputed", "center.version bumped"]

  # --- Verification cycles, deficiencies and surveyor scheduling ---
  - method: POST
    path: "/verification-cycles"
    description: "open a national verification or state designation cycle for the center"
    roles: [TraumaProgramManager]
    code: 201
    input: [center_id, cycle_type, site_visit_date]
    output: VerificationCycle
    side_effects: ["status = PREP", "readiness_score computed via verification_readiness_score (REVIEWER_ASSESSMENT)", "open_type_i_count / open_type_ii_count / open_type_iii_count = 0"]
  - method: GET
    path: "/verification-cycles/{id}"
    description: "read one verification cycle including its persisted reviewer readiness score"
    roles: [SystemAdmin, TraumaProgramManager, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: []
    output: VerificationCycle
    side_effects: []
  - method: GET
    path: "/verification-cycles"
    description: "list verification cycles across centers with status and type filters"
    roles: [SystemAdmin, TraumaProgramManager, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["center_id?", "cycle_type?", "status?", "limit?", "offset?"]
    output: VerificationCycle[]
    side_effects: []
  - method: GET
    path: "/verification-cycles/{id}/readiness"
    description: "computed read of calculations.verification_readiness_score; variant defaults to REVIEWER_ASSESSMENT"
    roles: [SystemAdmin, TraumaProgramManager, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["variant?"]
    output: { variant: string, base_score: number, deficiency_penalty: number, outreach_penalty: number, pi_penalty: number, readiness_score: number, submit_eligible: boolean }
    side_effects: ["read-only; the SELF_ASSESSMENT variant is never persisted on the cycle"]
  - method: POST
    path: "/verification-cycles/{id}/deficiencies"
    description: "reviewer records a criteria deficiency found during prep or site visit"
    roles: [VerificationReviewer, StateDesignationOfficer]
    code: 201
    input: [criterion_code, deficiency_class, remediation_due_at]
    output: CriteriaDeficiency
    side_effects: ["status = OPEN", "cycle open_type_i_count / open_type_ii_count / open_type_iii_count incremented for the class", "cycle.readiness_score recomputed", "a TYPE_I_CRITICAL deficiency moves the cycle to PREP_BLOCKED and increments center.open_critical_deficiency_count", "center.readiness_posture recomputed", "cycle.version bumped", "center.version bumped"]
  - method: GET
    path: "/verification-cycles/{id}/deficiencies"
    description: "reverse lookup of CriteriaDeficiency rows from the owning verification cycle"
    roles: [SystemAdmin, TraumaProgramManager, TraumaMedicalDirector, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["deficiency_class?", "status?"]
    output: CriteriaDeficiency[]
    side_effects: []
  - method: POST
    path: "/criteria-deficiencies/{id}/remediation"
    description: "the program manager submits remediation evidence; optimistically concurrent on the parent cycle version"
    roles: [TraumaProgramManager]
    code: 200
    input: [expected_cycle_version, remediation_note]
    output: CriteriaDeficiency
    side_effects: ["status = REMEDIATION_SUBMITTED", "cycle.version bumped"]
  - method: POST
    path: "/criteria-deficiencies/{id}/close"
    description: "the reviewer accepts remediation and closes the deficiency"
    roles: [VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: []
    output: CriteriaDeficiency
    side_effects: ["status = CLOSED", "closed_at = clock_now", "cycle open count for the class decremented by 1", "cycle.readiness_score recomputed", "cycle leaves PREP_BLOCKED for PREP once no TYPE_I_CRITICAL remains open", "center.open_critical_deficiency_count decremented for a critical class", "center.readiness_posture recomputed"]
  - method: POST
    path: "/criteria-deficiencies/{id}/escalate"
    description: "the reviewer escalates an unremediated deficiency past its due date; opens a PIPS event"
    roles: [VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: [escalation_reason]
    output: CriteriaDeficiency
    side_effects: ["status = ESCALATED", "a SYSTEM_AUTO DEFICIENCY_ESCALATION PIEvent is opened with source_deficiency_id set", "center.escalated_critical_deficiency_count incremented for a critical class", "center.open_pi_event_count incremented by 1", "center.readiness_posture recomputed", "center.version bumped"]
  - method: POST
    path: "/verification-cycles/{id}/surveyor-bookings"
    description: "book a surveyor review window; windows for one cycle may not overlap once the travel buffer is applied"
    roles: [VerificationReviewer, StateDesignationOfficer]
    code: 201
    input: [surveyor_user_id, window_start, window_end, "travel_buffer_hours?"]
    output: SurveyorBooking
    side_effects: ["travel_buffer_hours defaults to 24"]
  - method: GET
    path: "/verification-cycles/{id}/surveyor-bookings"
    description: "reverse lookup of SurveyorBooking rows from the owning verification cycle"
    roles: [SystemAdmin, TraumaProgramManager, VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: ["surveyor_user_id?"]
    output: SurveyorBooking[]
    side_effects: []
  - method: POST
    path: "/verification-cycles/{id}/submit"
    description: "submit the prepared cycle for review; blocked by any open critical deficiency or a readiness score below 70.00"
    roles: [TraumaProgramManager]
    code: 200
    input: []
    output: VerificationCycle
    side_effects: ["status = SUBMITTED", "readiness_score frozen at the submitted REVIEWER_ASSESSMENT value"]
  - method: POST
    path: "/verification-cycles/{id}/schedule-site-visit"
    description: "the reviewing authority confirms the site visit date for a submitted cycle"
    roles: [VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: [site_visit_date]
    output: VerificationCycle
    side_effects: ["status = SITE_VISIT_SCHEDULED", "site_visit_date replaced"]
  - method: POST
    path: "/verification-cycles/{id}/begin-review"
    description: "the reviewing authority opens deliberation after the site visit"
    roles: [VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: []
    output: VerificationCycle
    side_effects: ["status = UNDER_REVIEW"]
  - method: POST
    path: "/verification-cycles/{id}/decide"
    description: "the reviewing authority renders VERIFIED, CONTINGENCY or DENIED; the authority role must match cycle_type"
    roles: [VerificationReviewer, StateDesignationOfficer]
    code: 200
    input: [decision, decision_effective_date]
    output: VerificationCycle
    side_effects: ["status = decision", "decided_at = clock_now", "national cycles write center.national_verification_status, state cycles write center.state_designation_status", "CONTINGENCY escalates every OPEN TYPE_I_CRITICAL deficiency and opens one SYSTEM_AUTO PIEvent per escalation", "center.readiness_posture recomputed", "center.version bumped"]

  # --- Outreach adjudication ---
  - method: POST
    path: "/outreach-activities/{id}/verify"
    description: "the medical director verifies a logged activity; its weighted credit hours enter the centre ledger"
    roles: [TraumaMedicalDirector]
    code: 200
    input: []
    output: OutreachActivity
    side_effects: ["verified_status = VERIFIED", "reviewed_by_user_id = caller", "center.outreach_credit_hours_ytd increased by weighted_credit_hours", "center.readiness_posture recomputed", "center.version bumped"]
  - method: POST
    path: "/outreach-activities/{id}/reject"
    description: "the medical director rejects a previously verified or logged activity; the ledger move exactly compensates the verify"
    roles: [TraumaMedicalDirector]
    code: 200
    input: [rejection_reason]
    output: OutreachActivity
    side_effects: ["verified_status = REJECTED", "center.outreach_credit_hours_ytd reduced by weighted_credit_hours when the activity had been VERIFIED", "center.readiness_posture recomputed", "center.version bumped"]

# ---------------------------------------------------------------------------
# §1.6 Error Catalog
# ---------------------------------------------------------------------------
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "X-User-ID and X-User-Role headers are required"
    triggered_by: "any request missing either identity header"
  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    message: "role is not permitted to perform this operation"
    triggered_by: "caller role absent from the endpoint's roles list"
  - error_id: ERR_CENTER_SCOPE_VIOLATION
    http_status: 403
    message: "TraumaProgramManager may only act inside its own trauma center"
    triggered_by: "an entity-backed TraumaProgramManager acting on a resource owned by another center"
  - error_id: ERR_DESIGNATION_AUTHORITY_MISMATCH
    http_status: 403
    message: "the deciding authority does not match the cycle type"
    triggered_by: "VerificationReviewer deciding a STATE_DESIGNATION cycle, or StateDesignationOfficer deciding a NATIONAL_VERIFICATION cycle"
  - error_id: ERR_CENTER_NOT_FOUND
    http_status: 404
    message: "trauma center not found"
    triggered_by: "path or body center id that does not exist"
  - error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    message: "registry case not found"
    triggered_by: "path or body registry case id that does not exist"
  - error_id: ERR_CYCLE_NOT_FOUND
    http_status: 404
    message: "verification cycle not found"
    triggered_by: "path verification cycle id that does not exist"
  - error_id: ERR_PI_EVENT_NOT_FOUND
    http_status: 404
    message: "performance improvement event not found"
    triggered_by: "path PI event id that does not exist"
  - error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    message: "referenced resource not found"
    triggered_by: "any other missing path or body reference: activation tier id in a case body, abstraction, corrective action, criteria deficiency, outreach activity, referral agreement, or the receiving center id of a transfer-out body"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "request payload is missing a required field or has an invalid type"
    triggered_by: "omitted required input field, wrong JSON type, or a negative credit_hours / injury_severity_score"
  - error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    message: "value is not a member of the allowed enumeration"
    triggered_by: "unknown tier_code, event_type, deficiency_class, activity_kind, decision, responder_role, triage_review_status or variant"
  - error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    message: "expected_case_version does not match the current registry case version"
    triggered_by: "POST /registry-cases/{id}/abstractions with a superseded expected_case_version"
  - error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    message: "expected_cycle_version does not match the current verification cycle version"
    triggered_by: "POST /criteria-deficiencies/{id}/remediation with a superseded expected_cycle_version"
  - error_id: ERR_CASE_NOT_ABSTRACTABLE
    http_status: 409
    message: "registry case is not in an abstractable state"
    triggered_by: "submitting an abstraction while case.abstraction_status is VALIDATED or LOCKED; PENDING, ABSTRACTED and REJECTED all remain abstractable because resubmission supersedes the prior SUBMITTED record"
  - error_id: ERR_CASE_ALREADY_LOCKED
    http_status: 409
    message: "registry case is locked and can no longer be modified"
    triggered_by: "POST /registry-cases/{id}/lock, POST /registry-cases/{id}/transfer-out or POST /registry-cases/{id}/transfer-out/rescind on a case whose abstraction_status is already LOCKED"
  - error_id: ERR_TRIAGE_ALREADY_REVIEWED
    http_status: 409
    message: "triage review has already been adjudicated for this case"
    triggered_by: "a second POST /registry-cases/{id}/triage-review"
  - error_id: ERR_ABSTRACTION_ALREADY_ADJUDICATED
    http_status: 409
    message: "abstraction has already been validated or rejected"
    triggered_by: "validate or reject on an abstraction that is not SUBMITTED"
  - error_id: ERR_INVALID_CYCLE_STATE
    http_status: 409
    message: "verification cycle is not in a state that allows this transition"
    triggered_by: "submit from SUBMITTED, schedule-site-visit from PREP, begin-review from PREP, decide from SUBMITTED, or any write on VERIFIED / DENIED"
  - error_id: ERR_INVALID_PI_STATE
    http_status: 409
    message: "PI event is not in a state that allows this transition"
    triggered_by: "start-review on an event already UNDER_REVIEW, close-loop from IDENTIFIED, or reopen on an event that is not LOOP_CLOSED"
  - error_id: ERR_INVALID_DEFICIENCY_STATE
    http_status: 409
    message: "criteria deficiency is not in a state that allows this transition"
    triggered_by: "remediation on a CLOSED deficiency, close on an OPEN deficiency, or escalate on a CLOSED deficiency"
  - error_id: ERR_INVALID_ACTION_STATE
    http_status: 409
    message: "corrective action is not in a state that allows this transition"
    triggered_by: "verify on an OPEN action, or complete on a VERIFIED action"
  - error_id: ERR_INVALID_AGREEMENT_STATE
    http_status: 409
    message: "referral agreement is not in a state that allows this transition"
    triggered_by: "activate on an ACTIVE or TERMINATED agreement, or terminate on a DRAFT agreement"
  - error_id: ERR_INVALID_OUTREACH_STATE
    http_status: 409
    message: "outreach activity is not in a state that allows this transition"
    triggered_by: "verify on an already VERIFIED activity, or reject on an already REJECTED activity"
  - error_id: ERR_POSTURE_SUSPENDED
    http_status: 409
    message: "trauma center readiness posture is SUSPENDED; registry and verification writes are frozen"
    triggered_by: "POST /registry-cases/{id}/lock or POST /verification-cycles/{id}/submit while center.readiness_posture == SUSPENDED"
  - error_id: ERR_DICTIONARY_CRITICAL_VIOLATION
    http_status: 422
    message: "abstraction violates a CRITICAL data dictionary rule"
    triggered_by: "an abstraction whose scan finds at least one CRITICAL REQUIRED, RANGE or CONFORMANCE violation"
  - error_id: ERR_ABSTRACTION_NOT_VALIDATED
    http_status: 409
    message: "registry case has no validated abstraction"
    triggered_by: "POST /registry-cases/{id}/lock before the abstraction reaches VALIDATED"
  - error_id: ERR_OPEN_ACTIONS_BLOCK_LOOP_CLOSURE
    http_status: 409
    message: "loop closure requires every corrective action to be VERIFIED"
    triggered_by: "close-loop while any corrective action is OPEN or COMPLETED, or while the event has no corrective action at all"
  - error_id: ERR_CRITICAL_DEFICIENCY_BLOCKS_VERIFICATION
    http_status: 409
    message: "an open TYPE_I_CRITICAL deficiency blocks this decision"
    triggered_by: "POST /verification-cycles/{id}/decide with decision = VERIFIED while cycle.open_type_i_count >= 1, i.e. a TYPE_I_CRITICAL deficiency is still OPEN, REMEDIATION_SUBMITTED or ESCALATED"
  - error_id: ERR_NO_ACTIVE_REFERRAL_AGREEMENT
    http_status: 409
    message: "no ACTIVE referral agreement covers this transfer"
    triggered_by: "transfer-out to a center with no ACTIVE agreement whose half-open interval contains case.arrival_at"
  - error_id: ERR_ABSTRACTION_WINDOW_CLOSED
    http_status: 422
    message: "the 60 day abstraction window for this case has closed"
    triggered_by: "submitting an abstraction after case.arrival_at + 60 days on the logical clock"
  - error_id: ERR_INVALID_INTERVAL_DATES
    http_status: 422
    message: "interval endpoints are not ordered, or the due date is in the past"
    triggered_by: "window_end <= window_start, effective_to <= effective_from, or remediation_due_at <= clock_now"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    message: "the acting user may not both perform and adjudicate this step"
    triggered_by: "the abstraction submitter validating it, the action owner verifying it, or an action owner closing the loop"
  - error_id: ERR_DUPLICATE_CASE_MRN
    http_status: 409
    message: "a registry case with this MRN already exists for the center"
    triggered_by: "POST /registry-cases with an MRN already used at that center"
  - error_id: ERR_DUPLICATE_CONFIGURATION
    http_status: 409
    message: "this configuration row already exists"
    triggered_by: "a second activation tier with the same tier_code for one center, or a second dictionary rule with the same (field_name, rule_kind)"
  - error_id: ERR_AGREEMENT_INTERVAL_OVERLAP
    http_status: 409
    message: "an ACTIVE agreement already covers an overlapping interval for this center pair"
    triggered_by: "activating an agreement whose half-open interval intersects an existing ACTIVE one on the same directed pair"
  - error_id: ERR_SURVEYOR_WINDOW_CONFLICT
    http_status: 409
    message: "surveyor window conflicts with an existing booking once the travel buffer is applied"
    triggered_by: "booking a window whose buffered closed interval intersects another booking on the same cycle"
  - error_id: ERR_READINESS_BELOW_THRESHOLD
    http_status: 409
    message: "reviewer readiness score is below the 70.00 submission threshold"
    triggered_by: "POST /verification-cycles/{id}/submit while the REVIEWER_ASSESSMENT score is under 70.00"

# ---------------------------------------------------------------------------
# §1.7 Role & Permission Matrix
# ---------------------------------------------------------------------------
roles:
  - role: SystemAdmin
    identity: opaque
    description: "platform operator; registers centers, declares immutable dictionary rules and drives the logical clock"
    exclusive_operations:
      - "POST /trauma-centers"
      - "POST /data-dictionary-rules"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /trauma-centers/{id}/activation-tiers"
      - "all GET reads"
  - role: TraumaProgramManager
    identity: "entity_backed:TraumaCenter"
    description: "runs one trauma center's program; scoped to its own center for every write"
    exclusive_operations:
      - "POST /registry-cases/{id}/lock"
      - "POST /trauma-centers/{id}/outreach-activities"
      - "POST /referral-agreements"
      - "POST /referral-agreements/{id}/activate"
      - "POST /referral-agreements/{id}/terminate"
      - "POST /verification-cycles"
      - "POST /criteria-deficiencies/{id}/remediation"
      - "POST /verification-cycles/{id}/submit"
    shared_operations:
      - "POST /registry-cases"
      - "POST /registry-cases/{id}/transfer-out"
      - "POST /registry-cases/{id}/response-logs"
      - "POST /pi-events/{id}/corrective-actions"
      - "POST /corrective-actions/{id}/complete"
      - "POST /trauma-centers/{id}/activation-tiers"
      - "all GET reads"
  - role: RegistryAbstractor
    identity: opaque
    description: "abstracts the registry record; may never adjudicate its own submission"
    exclusive_operations:
      - "POST /registry-cases/{id}/abstractions"
    shared_operations:
      - "POST /registry-cases"
      - "POST /registry-cases/{id}/transfer-out"
      - "POST /registry-cases/{id}/response-logs"
      - "GET reads of centers, cases, abstractions, response logs and dictionary rules"
  - role: RegistryValidator
    identity: opaque
    description: "adjudicates submitted abstractions for data dictionary compliance"
    exclusive_operations:
      - "POST /abstractions/{id}/validate"
      - "POST /abstractions/{id}/reject"
    shared_operations:
      - "GET reads of centers, cases, abstractions, response logs and dictionary rules"
  - role: TraumaMedicalDirector
    identity: opaque
    description: "owns triage adjudication, the PIPS loop and outreach verification"
    exclusive_operations:
      - "POST /registry-cases/{id}/triage-review"
      - "POST /pi-events"
      - "POST /pi-events/{id}/start-review"
      - "POST /pi-events/{id}/close-loop"
      - "POST /outreach-activities/{id}/verify"
      - "POST /outreach-activities/{id}/reject"
    shared_operations:
      - "POST /pi-events/{id}/corrective-actions"
      - "POST /corrective-actions/{id}/complete"
      - "POST /corrective-actions/{id}/verify"
      - "POST /pi-events/{id}/reopen"
      - "all GET reads except surveyor bookings"
  - role: VerificationReviewer
    identity: opaque
    description: "national verification authority; records deficiencies and decides NATIONAL_VERIFICATION cycles only"
    exclusive_operations: []
    shared_operations:
      - "POST /verification-cycles/{id}/deficiencies"
      - "POST /criteria-deficiencies/{id}/close"
      - "POST /criteria-deficiencies/{id}/escalate"
      - "POST /verification-cycles/{id}/surveyor-bookings"
      - "POST /verification-cycles/{id}/schedule-site-visit"
      - "POST /verification-cycles/{id}/begin-review"
      - "POST /verification-cycles/{id}/decide (NATIONAL_VERIFICATION only)"
      - "POST /corrective-actions/{id}/verify"
      - "POST /pi-events/{id}/reopen"
      - "all GET reads"
  - role: StateDesignationOfficer
    identity: opaque
    description: "state designation authority; same review surface but decides STATE_DESIGNATION cycles only"
    exclusive_operations: []
    shared_operations:
      - "POST /verification-cycles/{id}/deficiencies"
      - "POST /criteria-deficiencies/{id}/close"
      - "POST /criteria-deficiencies/{id}/escalate"
      - "POST /verification-cycles/{id}/surveyor-bookings"
      - "POST /verification-cycles/{id}/schedule-site-visit"
      - "POST /verification-cycles/{id}/begin-review"
      - "POST /verification-cycles/{id}/decide (STATE_DESIGNATION only)"
      - "all GET reads"
