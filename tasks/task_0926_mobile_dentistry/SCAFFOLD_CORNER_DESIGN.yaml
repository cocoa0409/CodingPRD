  - section: calculations
    instances:

      - name: never_calibrated_unit_reads_expired_and_the_default_clock_is_2026_05_01
        claim_type: Constants Applied
        grounds:
          - calculations.unit_calibration_status
          - global_constants.DEFAULT_CLOCK_UTC
          - entities.PortableUnit.fields.calibration_status
          - entities.PortableUnit.fields.calibration_due_on
        distinguishing_aspect: |
          With no call to the clock endpoint the logical clock reads exactly 2026-05-01T00:00:00Z, so a
          unit calibrated 2025-11-01 (due 2026-04-30) reads EXPIRED while a unit calibrated 2025-11-02
          (due 2026-05-01) reads DUE — a one-day difference that only holds if the default clock is
          exactly the declared instant and never real wall-clock time.
        test_recipe:
          setup:
            - "Empty database. The clock endpoint is deliberately NEVER called in this instance."
          setup_api_calls:
            - call: "POST /mobile-dentistry/portable-units"
              payload: { unit_code: "PU-01" }
              as: ProgramAdmin
              captures: { unit_fresh_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units"
              payload: { unit_code: "PU-02" }
              as: ProgramAdmin
              captures: { unit_expired_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units"
              payload: { unit_code: "PU-03" }
              as: ProgramAdmin
              captures: { unit_due_id: $.data.id }
          trigger:
            - call: "POST /mobile-dentistry/portable-units/${unit_expired_id}/calibrate"
              payload: { calibrated_on: "2025-11-01" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/portable-units/${unit_due_id}/calibrate"
              payload: { calibrated_on: "2025-11-02" }
              as: ProgramAdmin
            - call: "GET /mobile-dentistry/portable-units/${unit_fresh_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "PortableUnit.${unit_fresh_id}.calibration_status == EXPIRED"
            - "PortableUnit.${unit_fresh_id}.calibration_due_on == null"
            - "PortableUnit.${unit_expired_id}.calibration_due_on == 2026-04-30"
            - "PortableUnit.${unit_expired_id}.calibration_status == EXPIRED"
            - "PortableUnit.${unit_due_id}.calibration_due_on == 2026-05-01"
            - "PortableUnit.${unit_due_id}.calibration_status == DUE"

