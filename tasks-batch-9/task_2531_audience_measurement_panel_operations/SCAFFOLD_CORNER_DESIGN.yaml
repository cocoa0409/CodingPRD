          assert:
            - "Trigger call 2: the midnight-crossing interval is credited entirely to its START date 2026-08-09, giving that one reported day 30 minutes == MIN_COMPLIANT_DAY_MINUTES exactly, so data.compliance_rate_rolling_30 == 1.0000 (1 compliant day / 1 reported day) - the denominator is REPORTED days, never 30"
            - "Trigger call 4: 2026-08-11 has 29 credited minutes, one minute short, so it is a reported but non-compliant day: data.compliance_rate_rolling_30 == round_half_up(1/2, 4) == 0.5000"
            - "Trigger call 6: 2026-08-12 has 15 minutes so far and is also non-compliant: data.compliance_rate_rolling_30 == round_half_up(1/3, 4) == 0.3333"
            - "Trigger call 8: the second 15-minute interval on the SAME UTC date lifts 2026-08-12 to 30 credited minutes, which is summed BEFORE the comparison: data.compliance_rate_rolling_30 == round_half_up(2/3, 4) == 0.6667"
            - "Trigger call 8: the ROLLING_30 variant reads TuningInterval.tuning_minutes (all four rows are still RAW and no run has ever edited them), which is exactly why unedited data already scores"
            - "Trigger call 10: data.compliance_rate_rolling_30 is STILL 0.6667 even though the window is now [2026-08-21, 2026-09-20) and contains no interval at all - the field is a stored snapshot written on ingest and on fault-detection scans, never re-derived at read time"

