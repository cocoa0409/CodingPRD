            - "launching RC-SHORT fails 422 ERR_INSUFFICIENT_REMEDY_KITS: 2 affected units * 2 kits per unit = 4 > total_kits 3"
            - "RC-OK with total_kits 4 launches 200 as LAUNCHED with affected_unit_count 2, reserved_kits 4 and available_kits 0 — the check is >=, satisfied at exact equality"
            - "RC-SHORT is still DRAFT with affected_unit_count 0 after the failed launch: no remedy tasks and no kit reservations were created"

  - section: rbac
    instances:

      - name: absent_or_undeclared_role_headers_are_unauthenticated
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: |
          Authentication is header-shaped, not credential-shaped: the pair (X-User-ID, X-User-Role) must both
          be present AND the role must be one of the six declared in §1.7. A syntactically fine request
          carrying the role "FleetOwner" is ERR_UNAUTHENTICATED (priority 1), not ERR_ROLE_NOT_PERMITTED
          (priority 2) — an undeclared role is not a role that merely lacks permission. This is checked
          before the endpoint is even resolved, so it fires on reads as well as writes.
        test_recipe:
          setup:
            - "One BusModel exists so the target read has something to return"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
          trigger:
            - call: "GET /bus-models/${model_c_id}"
              payload: {}
              as: "<X-User-Role header omitted>"
              as_user_id: "compliance-01"
              captures: { err_no_role: $.data.error_id }
            - call: "GET /bus-models/${model_c_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "<X-User-ID header omitted>"
              captures: { err_no_user: $.data.error_id }
            - call: "GET /bus-models/${model_c_id}"
              payload: {}
              as: FleetOwner
              as_user_id: "outsider-01"
              captures: { err_undeclared: $.data.error_id }
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_D_TRANSIT" }
              as: FleetOwner
              as_user_id: "outsider-01"
              captures: { err_undeclared_write: $.data.error_id }
            - call: "GET /bus-models/${model_c_id}"
              payload: {}
              as: DealerAgent
              as_user_id: "any-dealer-agent"
              captures: { ok_code: $.data.model_code }
          assert:
            - "the request with no X-User-Role fails 401 ERR_UNAUTHENTICATED"
            - "the request with no X-User-ID fails 401 ERR_UNAUTHENTICATED even though the role is valid — both headers are required"
            - "role FleetOwner fails 401 ERR_UNAUTHENTICATED, NOT 403 ERR_ROLE_NOT_PERMITTED: priority 1 precedes priority 2 and an undeclared role is never matched against an endpoint's roles list"
            - "the undeclared-role write with a truncated payload also fails 401, not 422 — authentication precedes payload validation (priority 3)"
            - "the same read with a declared role returns 200 with model_code TYPE_C_CONV, proving the row and the route were fine all along"

      - name: wrong_role_calls_are_rejected_on_every_exclusive_operation
        claim_type: exclusive_operations
        grounds:
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles
          - endpoints[POST /bus-models]
          - endpoints[POST /production-lines]
          - endpoints[POST /dealers]
          - endpoints[POST /solicitations]
          - endpoints[POST /test-bays]
        distinguishing_aspect: |
          Each of the five registry creations is exclusive to exactly one role, and no role is a superset of
          another — there is no hierarchical override in this domain, so ComplianceOfficer cannot open a
          solicitation and ContractsAdmin cannot open a production line. The denial also outranks payload
          validation: a wrong-role request with an empty body reports ERR_ROLE_NOT_PERMITTED (2), never
          ERR_INVALID_REQUEST (3).
        test_recipe:
          setup:
            - "Empty database; each call below targets a creation endpoint with a single permitted role"
          setup_api_calls:
            - call: "GET /bus-models"
              payload: {}
              as: DealerAgent
              as_user_id: "dealer-agent-01"
              captures: { empty_list: $.data }
          trigger:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { err_model: $.data.error_id }
            - call: "POST /production-lines"
              payload: { line_code: "L-A1", plant_code: "PLANT-A", supported_body_classes: ["TYPE_C"], horizon_slot_day_capacity: 30, changeover_buffer_days: 3 }
              as: QualityInspector
              as_user_id: "qc-01"
              captures: { err_line: $.data.error_id }
            - call: "POST /test-bays"
              payload: { bay_code: "TB-1", plant_code: "PLANT-A", supported_test_types: ["BRAKE"], max_concurrent_electrical: 1 }
              as: DealerAgent
              as_user_id: "dealer-agent-01"
              captures: { err_bay: $.data.error_id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-TX", dealer_name: "Lone Star Bus Sales", licensed_state_codes: ["TX"], training_capacity_per_month: 12 }
              as: SalesEngineer
              as_user_id: "sales-01"
