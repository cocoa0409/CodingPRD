              captures: { p_id: $.data.id }
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
            - call: "POST /title/orders/${o_id}/transitions"
              payload: { to_status: "CLEAR_TO_CLOSE" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/deposits"
