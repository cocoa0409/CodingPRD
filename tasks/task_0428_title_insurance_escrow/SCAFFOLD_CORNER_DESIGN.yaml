            - "EscrowDeposit.${d_id}.status == POSTED"

      - name: invalid_gap_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_GAP_WINDOW]", state_machines.TitleSearch.IN_EXAM_to_COMPLETED]
        distinguishing_aspect: "Completing a search with gap_from_date 2026-03-01 after gap_to_date 2026-02-01 returns ERR_INVALID_GAP_WINDOW."
