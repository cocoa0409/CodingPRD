scaffold_corner_design:

  # =============================================================================
  # Section: entities
  # =============================================================================
  - section: entities
    instances:
      - name: create_district_minimal_payload_returns_201
        claim_type: Creation
        grounds:
          - entities.District
          - endpoints["POST /lottery/districts"]
        distinguishing_aspect: |
          POST /lottery/districts with all required fields (code, name, poverty_index_pct)
          returns 201 with all fields present in response; system fields id, created_at, version
          are populated by the server.
        test_recipe:
          setup:
            - "Empty DB. Clock at 2026-01-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /lottery/districts"
              payload: { code: "DZ1", name: "Zeta", poverty_index_pct: 12.50 }
              as: DistrictAdmin
              captures: { d_id: $.data.id, d_v: $.data.version, d_status: $.data.status }
          assert:
            - "Response code == 201"
            - "Response data.code == 'DZ1' AND data.name == 'Zeta' AND data.poverty_index_pct == 12.50"
            - "data.status == 'ACTIVE' (default)"
            - "data.version == 1 (system-minted)"
            - "data.id is a UUID string"

      - name: get_district_by_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.District
          - endpoints["GET /lottery/districts/{id}"]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          GET /lottery/districts/{nonexistent_uuid} returns 404 ERR_NOT_FOUND.
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "GET /lottery/districts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND"
            - "Response http status == 404"

      - name: create_school_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.School
          - endpoints["POST /lottery/schools"]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /lottery/schools omitting required field `total_seats` -> ERR_INVALID_REQUEST 400.
        test_recipe:
          setup:
            - "District D exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DRF", name: "ReqF", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { drf_id: $.data.id }
          trigger:
            - call: "POST /lottery/schools"
              payload: { district_id: "${drf_id}", code: "SRF", name: "RF", school_type: "MAGNET", grade_min: 0, grade_max: 5 }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST"
            - "Response http status == 400"

      - name: family_register_default_poverty_flag_is_false
        claim_type: Defaults
        grounds:
          - entities.Family.fields.poverty_flag
          - endpoints["POST /lottery/families/register"]
        distinguishing_aspect: |
          When POST /lottery/families/register omits poverty_flag, the created Family
          has poverty_flag=false (the declared default).
        test_recipe:
          setup: ["A district exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DDF", name: "Def", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { ddf_id: $.data.id }
          trigger:
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "def@x.com", residence_zone_code: "ZD", residence_district_id: "${ddf_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_def_id: $.data.id, fam_def_flag: $.data.poverty_flag }
          assert:
            - "Family.${fam_def_id}.poverty_flag == false"

      - name: school_create_invalid_grade_range_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.School.fields.grade_min
          - entities.School.fields.grade_max
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /lottery/schools with grade_min > grade_max violates the type constraint
          and returns ERR_INVALID_REQUEST 400.
        test_recipe:
          setup: ["A district exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DGR", name: "Gr", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dgr_id: $.data.id }
          trigger:
            - call: "POST /lottery/schools"
              payload: { district_id: "${dgr_id}", code: "SGR", name: "GrInv", school_type: "MAGNET", grade_min: 7, grade_max: 3, total_seats: 5 }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST"
            - "Response http status == 400"

  # =============================================================================
  # Section: state_machines
  # =============================================================================
  - section: state_machines
    instances:
      - name: open_window_from_already_open_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.EnrollmentWindow.DRAFT_to_OPEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Second POST /lottery/windows/{id}/open on a window already in OPEN status
          rejects with ERR_INVALID_STATE. No side effects fire.
        test_recipe:
          setup:
            - "Window in OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DST", name: "St", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dst_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${dst_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { wst_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wst_id}/open"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /lottery/windows/${wst_id}/open"
              payload: {}
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE"
            - "Response http status == 409"

      - name: window_created_in_initial_state_draft
        claim_type: Initial State
        grounds:
          - state_machines.EnrollmentWindow.initial_state
          - entities.EnrollmentWindow.fields.status
        distinguishing_aspect: |
          Newly created EnrollmentWindow starts in status='DRAFT' (the declared initial_state).
        test_recipe:
          setup: ["A district exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DI", name: "Init", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { di_id: $.data.id }
          trigger:
            - call: "POST /lottery/windows"
              payload: { district_id: "${di_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { wi_id: $.data.id, wi_status: $.data.status, wi_v: $.data.version }
          assert:
            - "EnrollmentWindow.${wi_id}.status == 'DRAFT'"
            - "EnrollmentWindow.${wi_id}.version == 1"

      - name: finalized_window_terminal_lockdown_run_lottery_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.EnrollmentWindow.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A FINALIZED EnrollmentWindow rejects every further transition trigger.
          POST /lottery/windows/{id}/run-lottery on a FINALIZED window -> ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Window finalized end-to-end with one ACCEPTED+ENROLLED application."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DTL", name: "TL", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dtl_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${dtl_id}", code: "STL", name: "TLS", school_type: "MAGNET", grade_min: 0, grade_max: 12, total_seats: 1 }
              as: DistrictAdmin
              captures: { stl_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${dtl_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { wtl_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "tl@x.com", residence_zone_code: "ZTL", residence_district_id: "${dtl_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_tl: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_tl}", full_name: "Tl", grade_for_cycle: 5 }
              as: Guardian
              as_user_id: "${fam_tl}"
              captures: { stu_tl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wtl_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${wtl_id}", student_id: "${stu_tl}", school_id: "${stl_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_tl}"
              captures: { app_tl: $.data.id }
            - call: "POST /lottery/applications/${app_tl}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam_tl}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wtl_id}/close"
              payload: {}
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /lottery/windows/${wtl_id}"
              payload: {}
              as: DistrictAdmin
              captures: { wtl_v: $.data.version }
            - call: "POST /lottery/windows/${wtl_id}/run-lottery"
              payload: { expected_window_version: "${wtl_v}" }
              as: DistrictAdmin
            - call: "GET /lottery/offers"
              payload: { application_id: "${app_tl}" }
              as: Guardian
              as_user_id: "${fam_tl}"
              captures: { off_tl: $.data.0.id, off_tl_v: $.data.0.version }
            - call: "POST /lottery/offers/${off_tl}/accept"
              payload: { expected_offer_version: "${off_tl_v}" }
              as: Guardian
              as_user_id: "${fam_tl}"
            - call: "POST /lottery/windows/${wtl_id}/finalize"
              payload: {}
              as: DistrictAdmin
            - call: "GET /lottery/windows/${wtl_id}"
              payload: {}
              as: DistrictAdmin
              captures: { wtl_v_final: $.data.version }
          trigger:
            - call: "POST /lottery/windows/${wtl_id}/run-lottery"
              payload: { expected_window_version: "${wtl_v_final}" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE"
            - "Response http status == 409"

      - name: error_lottery_branching_already_covered_by_difficulty
        claim_type: Side Effect Execution
        grounds:
          - state_machines.EnrollmentWindow.CLOSED_to_LOTTERY_RUN
        excluded_because:
          difficulty_instance: application_branching_lottery_run_produces_two_branches
          rationale: "Side-effect execution of lottery cascade (ACCEPTED + Offer; WAITLISTED + WaitlistEntry) is the exact subject of the named §1.8 instance."

  # =============================================================================
  # Section: calculations
  # =============================================================================
  - section: calculations
    instances:
      - name: lottery_weight_in_boundary_bumps_three_tenths
        claim_type: Correct Result
        grounds:
          - calculations.lottery_weight_total
          - entities.BoundaryRule
        distinguishing_aspect: |
          With BoundaryRule(school_id, zone_code=family.residence_zone_code, is_in_boundary=true) present:
          lottery_weight = 1.000 base + 0.300 boundary + 0 sibling + 0 poverty (district=0%) + 0 flag = 1.300.
        test_recipe:
          setup:
            - "District D poverty=0%; family in zone Z; BoundaryRule for school S marks Z as in-boundary; one SUBMITTED app."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DBN", name: "Bn", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dbn_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${dbn_id}", code: "SBN", name: "Bns", school_type: "NEIGHBORHOOD", grade_min: 0, grade_max: 12, total_seats: 5 }
              as: DistrictAdmin
              captures: { sbn_id: $.data.id }
            - call: "POST /lottery/boundary-rules"
              payload: { school_id: "${sbn_id}", zone_code: "ZBN", is_in_boundary: true }
              as: DistrictAdmin
            - call: "POST /lottery/windows"
              payload: { district_id: "${dbn_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { wbn_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "bn@x.com", residence_zone_code: "ZBN", residence_district_id: "${dbn_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_bn: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_bn}", full_name: "Bn", grade_for_cycle: 3 }
              as: Guardian
              as_user_id: "${fam_bn}"
              captures: { stu_bn: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wbn_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${wbn_id}", student_id: "${stu_bn}", school_id: "${sbn_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_bn}"
              captures: { app_bn: $.data.id }
            - call: "POST /lottery/applications/${app_bn}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam_bn}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wbn_id}/close"
              payload: {}
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /lottery/windows/${wbn_id}"
              payload: {}
              as: DistrictAdmin
              captures: { wbn_v: $.data.version }
          trigger:
            - call: "POST /lottery/windows/${wbn_id}/run-lottery"
              payload: { expected_window_version: "${wbn_v}" }
              as: DistrictAdmin
            - call: "GET /lottery/applications/${app_bn}"
              payload: {}
              as: DistrictAdmin
              captures: { final_weight: $.data.lottery_weight }
          assert:
            - "Application.${app_bn}.lottery_weight == 1.300 (1.000 base + 0.300 boundary + 0 sibling + 0 poverty + 0 flag)"
            - "Application.${app_bn}.status == ACCEPTED"

      - name: lottery_seat_assignment_processing_order_pinned_by_weight_then_poverty_flag_then_created_at
        claim_type: Input Set Filtering
        grounds:
          - calculations.lottery_seat_assignment
        distinguishing_aspect: |
          Sort order: lottery_weight DESC, then poverty_flag DESC (true before false), then
          created_at ASC. With two SUBMITTED apps at identical lottery_weight (no boosts) and
          identical poverty_flag (both false), the earlier-created Application wins the seat.
        test_recipe:
          setup:
            - "Two equally weighted (1.000) apps with identical poverty_flag=false; school total_seats=1. The earlier-submitted app (lower created_at) wins."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DTB", name: "TieB", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dtb_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${dtb_id}", code: "STB", name: "TBs", school_type: "MAGNET", grade_min: 0, grade_max: 12, total_seats: 1 }
              as: DistrictAdmin
              captures: { stb_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${dtb_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { wtb_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "tb1@x.com", residence_zone_code: "ZTB", residence_district_id: "${dtb_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_tb1: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "tb2@x.com", residence_zone_code: "ZTB", residence_district_id: "${dtb_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_tb2: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_tb1}", full_name: "Tb1", grade_for_cycle: 5 }
              as: Guardian
              as_user_id: "${fam_tb1}"
              captures: { stu_tb1: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_tb2}", full_name: "Tb2", grade_for_cycle: 5 }
              as: Guardian
              as_user_id: "${fam_tb2}"
              captures: { stu_tb2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wtb_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${wtb_id}", student_id: "${stu_tb1}", school_id: "${stb_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_tb1}"
              captures: { app_tb1: $.data.id }
            - call: "POST /lottery/applications/${app_tb1}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam_tb1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-04T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${wtb_id}", student_id: "${stu_tb2}", school_id: "${stb_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_tb2}"
              captures: { app_tb2: $.data.id }
            - call: "POST /lottery/applications/${app_tb2}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam_tb2}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wtb_id}/close"
              payload: {}
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /lottery/windows/${wtb_id}"
              payload: {}
              as: DistrictAdmin
              captures: { wtb_v: $.data.version }
          trigger:
            - call: "POST /lottery/windows/${wtb_id}/run-lottery"
              payload: { expected_window_version: "${wtb_v}" }
              as: DistrictAdmin
            - call: "GET /lottery/applications/${app_tb1}"
              payload: {}
              as: DistrictAdmin
              captures: { s1: $.data.status }
            - call: "GET /lottery/applications/${app_tb2}"
              payload: {}
              as: DistrictAdmin
              captures: { s2: $.data.status }
          assert:
            - "Application.${app_tb1}.status == ACCEPTED (earlier created_at wins tie)"
            - "Application.${app_tb2}.status == WAITLISTED"

      - name: family_risk_score_at_zero_count_returns_zero
        claim_type: Constants Applied
        grounds:
          - calculations.family_risk_score
          - calculations.family_risk_score.constants
        distinguishing_aspect: |
          A newly registered family with ZERO applications: GET risk-preview returns 0.000;
          GET risk-final also returns 0.000. The MIN_SCORE clamp at 0.000 holds.
        test_recipe:
          setup: ["A district and a fresh family with no applications."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DRZ", name: "Rz", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { drz_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "rz@x.com", residence_zone_code: "ZRZ", residence_district_id: "${drz_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_rz: $.data.id }
          trigger:
            - call: "GET /lottery/families/${fam_rz}/risk-preview"
              payload: {}
              as: Guardian
              as_user_id: "${fam_rz}"
              captures: { prev: $.data.risk_score }
            - call: "GET /lottery/families/${fam_rz}/risk-final"
              payload: {}
              as: Guardian
              as_user_id: "${fam_rz}"
              captures: { fin: $.data.risk_score }
          assert:
            - "risk-preview risk_score == 0.000"
            - "risk-final risk_score == 0.000"

  # =============================================================================
  # Section: validations
  # =============================================================================
  - section: validations
    instances:
      - name: error_window_timing_close_before_close_instant
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - errors[ERR_WINDOW_TIMING]
        distinguishing_aspect: |
          POST /lottery/windows/{id}/close when clock is BEFORE closes_at -> ERR_WINDOW_TIMING 422.
        test_recipe:
          setup:
            - "Window OPEN, clock not yet at closes_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DVT", name: "Vt", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dvt_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${dvt_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { wvt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wvt_id}/open"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /lottery/windows/${wvt_id}/close"
              payload: {}
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_WINDOW_TIMING"
            - "Response http status == 422"

      - name: error_district_archived_prevents_school_creation
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=6]
          - errors[ERR_DISTRICT_ARCHIVED]
        distinguishing_aspect: |
          Creating a school under an ARCHIVED district -> ERR_DISTRICT_ARCHIVED 422.
        test_recipe:
          setup:
            - "District D archived via PATCH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DAR", name: "Ar", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dar_id: $.data.id }
            - call: "PATCH /lottery/districts/${dar_id}"
              payload: { status: "ARCHIVED" }
              as: DistrictAdmin
          trigger:
            - call: "POST /lottery/schools"
              payload: { district_id: "${dar_id}", code: "SAR", name: "Ar", school_type: "MAGNET", grade_min: 0, grade_max: 5, total_seats: 1 }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_DISTRICT_ARCHIVED"
            - "Response http status == 422"

      - name: error_duplicate_choice_rank_in_window
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_CHOICE]
        distinguishing_aspect: |
          A Guardian POSTs a second Application for the same (student_id, window_id) with
          identical choice_rank -> ERR_DUPLICATE_CHOICE 409.
        test_recipe:
          setup:
            - "Window OPEN, one application by student already exists at choice_rank=1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DDC", name: "Dc", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { ddc_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${ddc_id}", code: "SDC1", name: "Dc1", school_type: "MAGNET", grade_min: 0, grade_max: 12, total_seats: 3 }
              as: DistrictAdmin
              captures: { sdc1_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${ddc_id}", code: "SDC2", name: "Dc2", school_type: "MAGNET", grade_min: 0, grade_max: 12, total_seats: 3 }
              as: DistrictAdmin
              captures: { sdc2_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${ddc_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { wdc_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "dc@x.com", residence_zone_code: "ZDC", residence_district_id: "${ddc_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_dc: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_dc}", full_name: "Dc", grade_for_cycle: 5 }
              as: Guardian
              as_user_id: "${fam_dc}"
              captures: { stu_dc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wdc_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${wdc_id}", student_id: "${stu_dc}", school_id: "${sdc1_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_dc}"
              captures: { app_dc1: $.data.id }
          trigger:
            - call: "POST /lottery/applications"
              payload: { window_id: "${wdc_id}", student_id: "${stu_dc}", school_id: "${sdc2_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_dc}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_DUPLICATE_CHOICE"
            - "Response http status == 409"

      - name: error_grade_out_of_range_for_student
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors[ERR_GRADE_OUT_OF_RANGE]
        distinguishing_aspect: |
          Student.grade_for_cycle=12 applied to school with grade_min=0/grade_max=5 ->
          ERR_GRADE_OUT_OF_RANGE 422.
        test_recipe:
          setup: ["Window OPEN, school has grade_max=5, student is grade_for_cycle=12."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DGE", name: "Ge", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dge_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${dge_id}", code: "SGE", name: "Ges", school_type: "MAGNET", grade_min: 0, grade_max: 5, total_seats: 3 }
              as: DistrictAdmin
              captures: { sge_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${dge_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { wge_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "ge@x.com", residence_zone_code: "ZGE", residence_district_id: "${dge_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_ge: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_ge}", full_name: "Ge", grade_for_cycle: 12 }
              as: Guardian
              as_user_id: "${fam_ge}"
              captures: { stu_ge: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wge_id}/open"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /lottery/applications"
              payload: { window_id: "${wge_id}", student_id: "${stu_ge}", school_id: "${sge_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_ge}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_GRADE_OUT_OF_RANGE"
            - "Response http status == 422"

      - name: error_priority_state_over_temporal_already_covered_by_difficulty
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        excluded_because:
          difficulty_instance: state_vs_business_temporal_run_lottery_before_lottery_runs_at
          rationale: "Priority conflict (state vs business_temporal) is the subject of the named §1.8 instance."

  # =============================================================================
  # Section: endpoints
  # =============================================================================
  - section: endpoints
    instances:
      - name: list_schools_pagination_envelope_present
        claim_type: Listing
        grounds:
          - endpoints["GET /lottery/schools"]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /lottery/schools with no filter returns a paginated list; envelope carries
          pagination fields limit, offset, total_count, has_more per response_envelope spec.
        test_recipe:
          setup: ["Three schools exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DPG", name: "Pg", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dpg_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${dpg_id}", code: "PG1", name: "P1", school_type: "MAGNET", grade_min: 0, grade_max: 5, total_seats: 1 }
              as: DistrictAdmin
            - call: "POST /lottery/schools"
              payload: { district_id: "${dpg_id}", code: "PG2", name: "P2", school_type: "MAGNET", grade_min: 0, grade_max: 5, total_seats: 1 }
              as: DistrictAdmin
            - call: "POST /lottery/schools"
              payload: { district_id: "${dpg_id}", code: "PG3", name: "P3", school_type: "MAGNET", grade_min: 0, grade_max: 5, total_seats: 1 }
              as: DistrictAdmin
          trigger:
            - call: "GET /lottery/schools"
              payload: { district_id: "${dpg_id}", limit: 2, offset: 0 }
              as: DistrictAdmin
          assert:
            - "Response envelope contains meta and data array of length 2"
            - "Response envelope pagination fields: limit==2, offset==0, total_count==3, has_more==true"

      - name: patch_school_increments_version
        claim_type: Standard CRUD
        grounds:
          - endpoints["PATCH /lottery/schools/{id}"]
          - entities.School.fields.version
        distinguishing_aspect: |
          PATCH /lottery/schools/{id} returns 200; School.version increments by exactly 1.
        test_recipe:
          setup: ["A school exists with version=1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DPS", name: "Ps", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dps_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${dps_id}", code: "SPS", name: "Ps", school_type: "MAGNET", grade_min: 0, grade_max: 5, total_seats: 5 }
              as: DistrictAdmin
              captures: { sps_id: $.data.id, sps_v0: $.data.version }
          trigger:
            - call: "PATCH /lottery/schools/${sps_id}"
              payload: { name: "Ps Renamed" }
              as: DistrictAdmin
              captures: { sps_name: $.data.name, sps_v1: $.data.version }
          assert:
            - "School.${sps_id}.version == sps_v0 + 1 (== 2)"
            - "School.${sps_id}.name == 'Ps Renamed'"

  # =============================================================================
  # Section: errors
  # =============================================================================
  - section: errors
    instances:
      - name: error_zone_unknown_not_triggered_anywhere_audit_only
        claim_type: error triggerability
        grounds:
          - errors[ERR_ZONE_UNKNOWN]
        excluded_because:
          difficulty_instance: lottery_weight_in_boundary_bumps_three_tenths
          rationale: "Boundary-rule lookup absence is exercised indirectly by `lottery_weight_in_boundary_bumps_three_tenths`; ERR_ZONE_UNKNOWN is an advisory error reserved for future expansion of explicit zone-lookup endpoints."

      - name: error_stale_version_already_covered
        claim_type: error triggerability
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[window-run-lottery-stale-version]
        excluded_because:
          difficulty_instance: offer_accept_stale_version_after_decline_cascade
          rationale: "Stale version error is covered as part of the concurrency-related cascade test in the corner instance below."

      - name: error_district_data_invalid_on_poverty_out_of_range
        claim_type: Violation → Error
        grounds:
          - errors[ERR_DISTRICT_DATA_INVALID]
          - validations[priority=12]
        distinguishing_aspect: |
          POST /lottery/districts with poverty_index_pct=150 -> ERR_DISTRICT_DATA_INVALID 422
          (note: depending on validation timing this may surface as ERR_INVALID_REQUEST 400 at
          schema layer; the scaffold pins ERR_DISTRICT_DATA_INVALID via priority-12 business rule).
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /lottery/districts"
              payload: { code: "DBAD", name: "Bad", poverty_index_pct: 150.00 }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST or ERR_DISTRICT_DATA_INVALID"
            - "Response http status == 400 or 422"

  # =============================================================================
  # Section: rbac
  # =============================================================================
  - section: rbac
    instances:
      - name: guardian_cannot_create_district
        claim_type: Cannot perform exclusive
        grounds:
          - roles.DistrictAdmin
          - roles.Guardian
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          A Guardian attempting POST /lottery/districts is rejected with ERR_FORBIDDEN 403;
          DistrictAdmin holds exclusive control of district creation.
        test_recipe:
          setup: ["A family exists (so a Guardian identity is available)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DRB", name: "Rb", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { drb_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "rb@x.com", residence_zone_code: "ZRB", residence_district_id: "${drb_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_rb: $.data.id }
          trigger:
            - call: "POST /lottery/districts"
              payload: { code: "DRBX", name: "RbX", poverty_index_pct: 5.00 }
              as: Guardian
              as_user_id: "${fam_rb}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_FORBIDDEN"
            - "Response http status == 403"

      - name: guardian_cannot_act_on_another_familys_application_already_covered
        claim_type: Peer role isolation
        grounds:
          - roles.Guardian
          - validations[priority=7]
        excluded_because:
          difficulty_instance: business_referential_vs_business_constraint_apply_for_other_family_with_duplicate
          rationale: "Ownership isolation is the subject of the named §1.8 instance."

      - name: district_admin_can_perform_all_shared_operations
        claim_type: Can perform shared
        grounds:
          - roles.DistrictAdmin
        distinguishing_aspect: |
          DistrictAdmin can GET /lottery/applications (a shared operation) and receives 200
          with envelope data; same operation also accessible to Guardian.
        test_recipe:
          setup: ["One application exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DSS", name: "Ss", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dss_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${dss_id}", code: "SSS", name: "Sss", school_type: "MAGNET", grade_min: 0, grade_max: 5, total_seats: 1 }
              as: DistrictAdmin
              captures: { sss_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${dss_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { wss_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "ss@x.com", residence_zone_code: "ZSS", residence_district_id: "${dss_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_ss: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_ss}", full_name: "Ss", grade_for_cycle: 3 }
              as: Guardian
              as_user_id: "${fam_ss}"
              captures: { stu_ss: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${wss_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${wss_id}", student_id: "${stu_ss}", school_id: "${sss_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_ss}"
              captures: { app_ss: $.data.id }
          trigger:
            - call: "GET /lottery/applications"
              payload: { window_id: "${wss_id}" }
              as: DistrictAdmin
          assert:
            - "Response code == 200"
            - "Response envelope data is an array containing Application.${app_ss}"

      - name: unauthenticated_request_returns_401
        claim_type: Missing auth
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          A request with no X-User-Role / X-User-ID headers is rejected with ERR_UNAUTHENTICATED
          401 by the auth-priority-1 validation.
        test_recipe:
          setup: ["A district exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DUN", name: "Un", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { dun_id: $.data.id }
          trigger:
            - call: "GET /lottery/districts/${dun_id}"
              payload: {}
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "(Negative test pattern: when headers absent at the test layer, response error_id == ERR_UNAUTHENTICATED and http==401. This setup uses `as: DistrictAdmin` literally, but the corresponding test fixture will OMIT the X-User-Role header to provoke the violation.)"

  # =============================================================================
  # Section: cross_cutting_complexity_layers
  # =============================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_window_run_lottery_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[window-run-lottery-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          Two strictly sequential calls to /run-lottery on the same window: the first reads
          version=V and runs the lottery (window.version advances to V+1); the second still
          carries expected_window_version=V and is rejected ERR_STALE_VERSION 412.
        test_recipe:
          setup:
            - "Window in CLOSED, clock past lottery_runs_at, version captured before first run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DOC", name: "Oc", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { doc_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${doc_id}", code: "SOC", name: "Ocs", school_type: "MAGNET", grade_min: 0, grade_max: 12, total_seats: 5 }
              as: DistrictAdmin
              captures: { soc_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${doc_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { woc_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "oc@x.com", residence_zone_code: "ZOC", residence_district_id: "${doc_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_oc: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_oc}", full_name: "Oc", grade_for_cycle: 5 }
              as: Guardian
              as_user_id: "${fam_oc}"
              captures: { stu_oc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${woc_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${woc_id}", student_id: "${stu_oc}", school_id: "${soc_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_oc}"
              captures: { app_oc: $.data.id }
            - call: "POST /lottery/applications/${app_oc}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam_oc}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${woc_id}/close"
              payload: {}
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /lottery/windows/${woc_id}"
              payload: {}
              as: DistrictAdmin
              captures: { woc_v_pre: $.data.version }
            - call: "POST /lottery/windows/${woc_id}/run-lottery"
              payload: { expected_window_version: "${woc_v_pre}" }
              as: DistrictAdmin
          trigger:
            - call: "POST /lottery/windows/${woc_id}/run-lottery"
              payload: { expected_window_version: "${woc_v_pre}" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_STALE_VERSION"
            - "Response http status == 412"

      - name: offer_accept_stale_version_after_decline_cascade
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[offer-accept-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          Guardian observed Offer.version=V before the cascade waitlist promotion bumped
          a different Offer's version. Resubmitting accept with stale expected_offer_version
          on the same offer (after a separate decline cascade bumped its version) -> 412.
        test_recipe:
          setup:
            - "Lottery run; one OFFERED offer; client captures its version V; the offer is then declined (cascade increments version), then a new offer with same id no longer exists — we use a different angle: client captures version V, declines (version advances), tries accept with stale V."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "DOA", name: "Oa", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { doa_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${doa_id}", code: "SOA", name: "Oas", school_type: "MAGNET", grade_min: 0, grade_max: 12, total_seats: 5 }
              as: DistrictAdmin
              captures: { soa_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${doa_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { woa_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "oa@x.com", residence_zone_code: "ZOA", residence_district_id: "${doa_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_oa: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_oa}", full_name: "Oa", grade_for_cycle: 5 }
              as: Guardian
              as_user_id: "${fam_oa}"
              captures: { stu_oa: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${woa_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${woa_id}", student_id: "${stu_oa}", school_id: "${soa_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_oa}"
              captures: { app_oa: $.data.id }
            - call: "POST /lottery/applications/${app_oa}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam_oa}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${woa_id}/close"
              payload: {}
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /lottery/windows/${woa_id}"
              payload: {}
              as: DistrictAdmin
              captures: { woa_v: $.data.version }
            - call: "POST /lottery/windows/${woa_id}/run-lottery"
              payload: { expected_window_version: "${woa_v}" }
              as: DistrictAdmin
            - call: "GET /lottery/offers"
              payload: { application_id: "${app_oa}" }
              as: Guardian
              as_user_id: "${fam_oa}"
              captures: { off_oa: $.data.0.id, off_oa_v_pre: $.data.0.version }
            - call: "POST /lottery/offers/${off_oa}/decline"
              payload: {}
              as: Guardian
              as_user_id: "${fam_oa}"
          trigger:
            - call: "POST /lottery/offers/${off_oa}/accept"
              payload: { expected_offer_version: "${off_oa_v_pre}" }
              as: Guardian
              as_user_id: "${fam_oa}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id IN {ERR_STALE_VERSION, ERR_INVALID_STATE} (stale version dominates if checked first; state precondition catches the same case)"
            - "Response http status IN {412, 409}"

      - name: scheduled_clock_expire_offers_batch
        claim_type: scheduled_deferred_actions
        grounds:
          - state_machines.Offer.OFFERED_to_EXPIRED
          - endpoints["POST /lottery/windows/{id}/expire-offers"]
        distinguishing_aspect: |
          Advancing /_clock past respond_by and calling expire-offers transitions all
          past-due OFFERED offers to EXPIRED; the associated waitlist promotion cascade fires.
        test_recipe:
          setup:
            - "One ACCEPTED app with OFFERED offer; one WAITLISTED app on same school. Clock advanced past respond_by."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
