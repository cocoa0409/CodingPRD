# =============================================================================
# PRD Benchmark Scaffold — Apple Packinghouse & Controlled-Atmosphere Storage
# =============================================================================

scenario: |
  Apple Packinghouse & Controlled-Atmosphere Storage (Washington apple packer): lot receiving & orchard/block traceability, CA room sealing/opening schedule & oxygen management, presize & grade/color sorting rules, packout percentage & grower return per bin, storage disorder monitoring & release priority, packaging spec by retail customer, pooled marketing & price averaging, cull/juice diversion

domain_name: apple-packinghouse-ca
api_prefix: ""   # flat multi-root API: /growers, /lots, /ca-rooms, /packing-runs, /pools, ...

complexity_profile:
  primary_archetype: ledger_reconciliation     # pooled marketing: advance vs final settlement produce different grower returns
  secondary_archetype: quota_allocation        # CA room bin capacity reserved/released by allocations
  complexity_layers:
    - optimistic_concurrency                   # OCC on CARoom.version (schedule update) and Pool.version (close)
    - cascading_side_effects                   # pool close -> settlements -> lots; inspection -> room -> allocations
    - dual_variant_calculation                 # est vs actual packout; provisional advance vs final settlement
    - selector_policy                          # release-priority selection among ACTIVE allocations
  entity_topology: flat                        # peer entities with FK references; a few nested creation paths for convenience
  state_machine_shape: cyclic                  # CARoom AVAILABLE->...->AVAILABLE; Pool CLOSED->REOPENED->CLOSED; Lot RELEASED<->PACKED
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: hierarchical_override            # Admin opaque superset; five peer roles own distinct surfaces
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Grower / ranch legal name" }
      - { name: grower_code, type: string, source: input, description: "Unique packer-assigned grower code", constraints: "unique across all growers; immutable" }

  - name: OrchardBlock
    parent: Grower
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: system, description: "FK -> Grower.id; owning grower (from creation path)" }
      - { name: orchard_name, type: string, source: input, description: "Orchard / ranch name" }
      - { name: block_code, type: string, source: input, description: "Block identifier within the orchard" }
      - { name: variety, type: enum, source: input, description: "HONEYCRISP | GALA | FUJI | GRANNY_SMITH | COSMIC_CRISP" }
      - { name: storage_life_days, type: integer, source: input, description: "Agronomic maximum storage days for fruit from this block; drives ERR_LOT_STORAGE_LIFE_EXCEEDED and must_release_by", constraints: "> 0" }
      # uniqueness: (grower_id, orchard_name, block_code, variety) at most one block row

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; grower who delivered the lot" }
      - { name: block_id, type: string, source: input, description: "FK -> OrchardBlock.id; source block for orchard/block traceability" }
      - { name: received_bin_count, type: integer, source: input, description: "Number of field bins received", constraints: "> 0" }
      - { name: received_weight_lbs, type: number, source: input, description: "Net received weight in lbs", constraints: "> 0" }
      - { name: avg_color_pct, type: number, source: input, description: "Sampled average red-color coverage percent at receiving; gates spec feasibility", constraints: "0 <= x <= 100" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp at lot creation; basis for storage-life checks" }
      - { name: size_small_lbs, type: number, source: system, default: 0, description: "Presize result: lbs graded into SMALL size class" }
      - { name: size_medium_lbs, type: number, source: system, default: 0, description: "Presize result: lbs graded into MEDIUM size class" }
      - { name: size_large_lbs, type: number, source: system, default: 0, description: "Presize result: lbs graded into LARGE size class" }
      - { name: presize_cull_lbs, type: number, source: system, default: 0, description: "Presize result: lbs culled at the presize line" }
      - { name: est_packout_pct, type: number, source: computed, description: "Forward-looking packout estimate from presize profile; null until presized (calc packout_percentage, variant estimated)" }
      - { name: actual_packout_pct, type: number, source: computed, description: "Chronological packout over COMPLETED non-VOIDED packing runs; null until first completion (calc packout_percentage, variant actual)" }
      - { name: diverted_weight_lbs, type: number, source: system, default: 0, description: "Lbs sent to cull/juice diversion at whole-lot level" }
      - { name: weight_balance_lbs, type: number, source: computed, description: "received_weight_lbs - diverted_weight_lbs - sum over COMPLETED non-VOIDED runs of (packed+cull+juice); invariant basis" }
      - { name: status, type: enum, source: system, description: "RECEIVED | PRESIZED | IN_STORAGE | RELEASED | PACKED | CLOSED | DIVERTED" }

  - name: CARoom
    parent: null
    common_fields: true
    fields:
      - { name: room_code, type: string, source: input, description: "Unique room identifier", constraints: "unique across all rooms" }
      - { name: bin_capacity, type: integer, source: input, description: "Room capacity in bins", constraints: "> 0" }
      - { name: o2_setpoint_pct, type: number, source: input, description: "Target oxygen percent once sealed", constraints: "0.1 <= x <= 21.0" }
      - { name: current_o2_pct, type: number, source: system, default: 20.9, description: "Last recorded oxygen reading; ambient air 20.9 at room creation" }
      - { name: atmosphere_alarm, type: boolean, source: system, default: false, description: "True while a SEALED room's |current_o2_pct - o2_setpoint_pct| > O2_TOLERANCE_PCT" }
      - { name: o2_excursion_count, type: integer, source: system, default: 0, description: "Count of readings that raised atmosphere_alarm from false to true" }
      - { name: disorder_index, type: number, source: system, default: 0, description: "disorder_index of the latest DisorderInspection for this room (0 if none)" }
      - { name: priority_release, type: boolean, source: system, default: false, description: "Set true by the disorder cascade (decay >= threshold); feeds release_priority_score" }
      - { name: sealed_at, type: datetime, source: system, description: "Logical-clock timestamp of sealing; null until sealed" }
      - { name: planned_open_date, type: datetime, source: input, description: "Scheduled opening date supplied at seal (or via schedule update); must be in the future at seal time" }
      - { name: actual_opened_at, type: datetime, source: system, description: "Logical-clock timestamp of opening; null until opened" }
      - { name: must_empty_by, type: datetime, source: computed, description: "actual_opened_at + ROOM_EMPTY_DAYS; null until opened" }
      - { name: bins_allocated, type: integer, source: computed, description: "Sum of bins over ACTIVE StorageAllocations in this room" }
      - { name: bins_free, type: integer, source: computed, description: "bin_capacity - bins_allocated" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | FILLING | SEALED | OPENED" }

  - name: StorageAllocation
    parent: CARoom
    common_fields: true
    fields:
      - { name: room_id, type: string, source: system, description: "FK -> CARoom.id; room holding the fruit (from creation path)" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; stored lot" }
      - { name: bins, type: integer, source: input, description: "Bins of the lot placed in this room", constraints: "> 0" }
      - { name: allocated_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: must_release_by, type: datetime, source: computed, description: "min(lot received_at + block storage_life_days, room opened_at + ROOM_EMPTY_DAYS once opened, cascade now + PRIORITY_RELEASE_DAYS once priority_release)" }
      - { name: release_priority_score, type: number, source: computed, description: "Selector score (calc release_priority_score); recomputed on inspection, atmosphere alarm change, room open, and daily state change inputs" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock timestamp of release; null while ACTIVE" }
      - { name: release_reason, type: enum, source: system, description: "MANUAL | SELECTED | DIVERSION; null while ACTIVE" }

  - name: DisorderInspection
    parent: CARoom
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: room_id, type: string, source: system, description: "FK -> CARoom.id; inspected room (from creation path)" }
      - { name: inspected_at, type: datetime, source: system, description: "Logical-clock timestamp of the inspection" }
      - { name: scald_pct, type: number, source: input, description: "Sampled superficial scald incidence percent", constraints: "0 <= x <= 100" }
      - { name: bitter_pit_pct, type: number, source: input, description: "Sampled bitter pit incidence percent", constraints: "0 <= x <= 100" }
      - { name: decay_pct, type: number, source: input, description: "Sampled decay incidence percent; >= DECAY_PRIORITY_THRESHOLD_PCT triggers the priority-release cascade", constraints: "0 <= x <= 100" }
      - { name: disorder_index, type: number, source: computed, description: "round_half_up(0.2*scald_pct + 0.3*bitter_pit_pct + 0.5*decay_pct, 2)" }

  - name: PackagingSpec
    parent: null
    common_fields: true
    fields:
      - { name: customer_name, type: string, source: input, description: "Retail customer this spec serves" }
      - { name: label_code, type: string, source: input, description: "Customer label / PLU program code" }
      - { name: grade_min, type: enum, source: input, description: "EXTRA_FANCY | FANCY | UTILITY — minimum grade packed under this spec" }
      - { name: color_min_pct, type: integer, source: input, description: "Minimum color coverage percent fruit must meet; lot.avg_color_pct must be >= this to schedule a run", constraints: "0 <= x <= 100" }
      - { name: size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE — carton size class" }
      - { name: pack_style, type: enum, source: input, description: "TRAY | BAG | POUCH" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED; creating a new ACTIVE spec with the same (customer_name, size_class, pack_style) supersedes the previous one" }

  - name: PackingRun
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot being packed (must be RELEASED)" }
      - { name: spec_id, type: string, source: input, description: "FK -> PackagingSpec.id; customer spec packed under (must be ACTIVE)" }
      - { name: pool_id, type: string, source: input, description: "FK -> Pool.id; marketing pool the cartons are attributed to (must be OPEN or REOPENED)" }
      - { name: line_code, type: string, source: input, description: "Packing line identifier; runs on the same line_code must not overlap in time" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open window start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open window end; must be strictly after scheduled_start" }
      - { name: input_weight_lbs, type: number, source: input, description: "Lbs of fruit fed to the line; must be <= lot.weight_balance_lbs", constraints: "> 0" }
      - { name: cartons_produced, type: integer, source: input, description: "Cartons packed (supplied at completion)", constraints: ">= 0" }
      - { name: packed_weight_lbs, type: number, source: input, description: "Lbs packed into cartons (supplied at completion)", constraints: ">= 0" }
      - { name: cull_weight_lbs, type: number, source: input, description: "Lbs culled at the line (supplied at completion)", constraints: ">= 0" }
      - { name: juice_weight_lbs, type: number, source: input, description: "Lbs diverted to juice at the line (supplied at completion)", constraints: ">= 0" }
      - { name: packout_pct, type: number, source: computed, description: "round_half_up(100 * packed / (packed+cull+juice), 1); set at completion, cleared on void" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED | VOIDED" }

  - name: Pool
    parent: null
    common_fields: true
    fields:
      - { name: variety, type: enum, source: input, description: "HONEYCRISP | GALA | FUJI | GRANNY_SMITH | COSMIC_CRISP" }
      - { name: grade_class, type: enum, source: input, description: "EXTRA_FANCY | FANCY | UTILITY" }
      - { name: season, type: string, source: input, description: "Marketing season label, e.g. 2026-2027" }
      - { name: total_packed_cartons, type: integer, source: computed, description: "Sum of cartons_produced over COMPLETED non-VOIDED runs attributed to this pool" }
      - { name: total_sales_cents, type: integer, source: computed, description: "Sum of gross_revenue_cents over recorded pool sales" }
      - { name: total_sale_deductions_cents, type: integer, source: computed, description: "Sum of deduction_cents (freight/commission) over recorded pool sales" }
      - { name: total_deductions_cents, type: integer, source: computed, description: "total_packed_cartons * PACKING_CHARGE_PER_CARTON_CENTS + total_sale_deductions_cents" }
      - { name: estimated_price_cents, type: integer, source: computed, description: "Provisional price while OPEN/REOPENED (calc pool_price, variant estimated); basis for advances" }
      - { name: pool_price_per_carton_cents, type: integer, source: computed, description: "Final pool-average price set at close (calc pool_price, variant final); null while OPEN" }
      - { name: rounding_drift_cents, type: integer, source: computed, description: "pool_price_per_carton_cents * total_packed_cartons - (total_sales_cents - total_deductions_cents); may be negative" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | REOPENED" }
      # uniqueness: (variety, grade_class, season)

  - name: GrowerSettlement
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: system, description: "FK -> Grower.id; derived from the run's lot.grower_id at auto-creation" }
      - { name: pool_id, type: string, source: system, description: "FK -> Pool.id; pool this settlement accrues against" }
      - { name: attributed_cartons, type: integer, source: computed, description: "Sum of cartons_produced over COMPLETED non-VOIDED runs whose lot.grower_id == grower_id and pool_id == pool_id" }
      - { name: advance_amount_cents, type: integer, source: system, default: 0, description: "Provisional advance paid (calc settlement_value, variant advance)" }
      - { name: final_payment_cents, type: integer, source: system, default: 0, description: "Final payment computed at the most recent pool close (calc settlement_value, variant final)" }
      - { name: paid_final_cents, type: integer, source: system, default: 0, description: "Cumulative finals computed across closes; a re-close pays only the delta" }
      - { name: clawback_cents, type: integer, source: system, default: 0, description: "Amount by which the advance exceeded final value at close (final floored at 0)" }
      - { name: status, type: enum, source: system, description: "ACCRUING | ADVANCE_PAID | SETTLED" }
      # uniqueness: (grower_id, pool_id); rows are auto-created on first run completion

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Lot
    initial_state: RECEIVED
    terminal_states: [CLOSED, DIVERTED]
    transitions:
      - from: RECEIVED
        to: PRESIZED
        trigger: "POST /lots/{lotId}/presize"
        actor: "ReceivingClerk | Admin"
        preconditions:
          - "lot.status == RECEIVED (else ERR_LOT_INVALID_STATE)"
          - "size_small_lbs + size_medium_lbs + size_large_lbs + presize_cull_lbs must equal lot.received_weight_lbs (else ERR_RUN_WEIGHT_MISMATCH)"
        side_effects:
          - "stores presize size profile; computes est_packout_pct (calc packout_percentage, variant estimated)"

      - from: RECEIVED
        to: IN_STORAGE
        trigger: "POST /ca-rooms/{id}/allocations (first ACTIVE allocation for this lot)"
        actor: "StorageOperator | Admin"
        preconditions: []
        side_effects:
          - "allocation created ACTIVE; room.bins_allocated += bins; if room was AVAILABLE -> FILLING (an OPENED room stays OPENED)"

      - from: PRESIZED
        to: IN_STORAGE
        trigger: "POST /ca-rooms/{id}/allocations (first ACTIVE allocation for this lot)"
        actor: "StorageOperator | Admin"
        preconditions: []
        side_effects:
          - "same as RECEIVED -> IN_STORAGE"

      - from: IN_STORAGE
        to: RELEASED
        trigger: "system (automatic when the lot's first StorageAllocation transitions ACTIVE -> RELEASED via release, select-release, or diversion)"
        actor: system
        preconditions: []
        side_effects:
          - "lot becomes packable (PackingRun creation gate)"

      - from: RELEASED
        to: PACKED
        trigger: "system (automatic when a PackingRun completion leaves lot.weight_balance_lbs == 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PACKED
        to: RELEASED
        trigger: "system (automatic when a PackingRun void leaves lot.weight_balance_lbs > 0)"
        actor: system
        preconditions: []
        side_effects: []
        note: "revision loop: a voided run returns fruit to the packable balance"

      - from: PACKED
        to: CLOSED
        trigger: "system (automatic in the pool-close cascade: every GrowerSettlement touching this lot is SETTLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CLOSED
        to: PACKED
        trigger: "system (automatic in the pool-reopen cascade: a settlement touching this lot reverts SETTLED -> ADVANCE_PAID)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RECEIVED
        to: DIVERTED
        trigger: "POST /lots/{lotId}/divert"
        actor: "StorageOperator | Admin"
        preconditions:
          - "lot.status in {RECEIVED, IN_STORAGE} (else ERR_LOT_INVALID_STATE)"
        side_effects:
          - "diverted_weight_lbs = current weight_balance_lbs; weight_balance_lbs unchanged by the divert itself (received - diverted - runs stays consistent)"
          - "cascade: every ACTIVE StorageAllocation for this lot -> RELEASED with release_reason=DIVERSION; each affected room.bins_allocated -= bins; a FILLING room whose bins_allocated reaches 0 -> AVAILABLE; an OPENED room whose bins_allocated reaches 0 -> AVAILABLE"

      - from: IN_STORAGE
        to: DIVERTED
        trigger: "POST /lots/{lotId}/divert"
        actor: "StorageOperator | Admin"
        preconditions: []
        side_effects:
          - "same as RECEIVED -> DIVERTED"

  - entity: CARoom
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: FILLING
        trigger: "system (automatic when the first ACTIVE StorageAllocation is created in this room)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FILLING
        to: AVAILABLE
        trigger: "system (automatic when bins_allocated returns to 0 via lot diversion)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FILLING
        to: SEALED
        trigger: "POST /ca-rooms/{id}/seal"
        actor: "StorageOperator | Admin"
        preconditions:
          - "room.status == FILLING (else ERR_ROOM_INVALID_STATE)"
          - "bins_allocated >= 1 (else ERR_ROOM_INVALID_STATE)"
          - "safety: |current_o2_pct - o2_setpoint_pct| <= O2_TOLERANCE_PCT using exact decimal comparison (else ERR_O2_NOT_AT_SETPOINT)"
          - "temporal: planned_open_date (input) must be strictly after the current logical clock (else ERR_OPEN_DATE_NOT_FUTURE)"
        side_effects:
          - "sealed_at = now; planned_open_date stored"

      - from: SEALED
        to: OPENED
        trigger: "POST /ca-rooms/{id}/open"
        actor: "StorageOperator | Admin"
        preconditions:
          - "room.status == SEALED (else ERR_ROOM_INVALID_STATE)"
        side_effects:
          - "actual_opened_at = now; must_empty_by = now + ROOM_EMPTY_DAYS"
          - "cascade hop 1 (room -> allocations): every ACTIVE allocation in this room gets must_release_by = min(existing, must_empty_by) and release_priority_score recomputed"
          - "opening a room with zero ACTIVE allocations (e.g. after a diversion while SEALED) is allowed; the room stays OPENED — the OPENED -> AVAILABLE auto-transition fires only when a release/diversion while OPENED drops bins_allocated to 0"

      - from: OPENED
        to: AVAILABLE
        trigger: "system (automatic when bins_allocated reaches 0 via releases or diversion; cycle restart)"
        actor: system
        preconditions: []
        side_effects:
          - "atmosphere_alarm = false; priority_release = false; actual_opened_at/must_empty_by cleared; room ready for the next fill"

  - entity: StorageAllocation
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /allocations/{allocationId}/release (release_reason=MANUAL)"
        actor: "StorageOperator | Admin"
        preconditions:
          - "allocation.status == ACTIVE (else ERR_ALLOCATION_INVALID_STATE)"
          - "room.status == OPENED (else ERR_ROOM_INVALID_STATE)"
        side_effects:
          - "cascade hop 1 (allocation -> room): room.bins_allocated -= bins; if room.bins_allocated == 0 and room.status == OPENED -> room OPENED -> AVAILABLE"
          - "cascade hop 1 (allocation -> lot): if this is the lot's first release, lot IN_STORAGE -> RELEASED"
          - "released_at = now"

      - from: ACTIVE
        to: RELEASED
        trigger: "POST /ca-rooms/{id}/select-release (release_reason=SELECTED; system picks the top-ranked ACTIVE allocation)"
        actor: "StorageOperator | Admin"
        preconditions:
          - "room.status == OPENED (else ERR_ROOM_INVALID_STATE)"
          - "at least one ACTIVE allocation exists in the room (else ERR_NO_RELEASABLE_ALLOCATIONS)"
        side_effects:
          - "same release cascades as MANUAL release, applied to the selected allocation"

      - from: ACTIVE
        to: RELEASED
        trigger: "system (lot diversion cascade; release_reason=DIVERSION)"
        actor: system
        preconditions: []
        side_effects:
          - "room.bins_allocated -= bins; room auto-transitions per bins_allocated == 0 rule"

  - entity: PackagingSpec
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when POST /specs creates a new spec with the same (customer_name, size_class, pack_style) scope)"
        actor: system
        preconditions: []
        side_effects:
          - "the prior ACTIVE spec in that scope becomes SUPERSEDED; SUPERSEDED specs reject new PackingRun creation (ERR_SPEC_INVALID_STATE)"

  - entity: PackingRun
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /packing-runs/{runId}/complete"
        actor: "PackingSupervisor | Admin"
        preconditions:
          - "run.status == SCHEDULED (else ERR_RUN_INVALID_STATE)"
          - "run.pool.status in {OPEN, REOPENED} (else ERR_POOL_INVALID_STATE)"
          - "packed_weight_lbs + cull_weight_lbs + juice_weight_lbs == run.input_weight_lbs exactly (else ERR_RUN_WEIGHT_MISMATCH)"
        side_effects:
          - "packout_pct computed (calc packout_percentage run-level)"
          - "cascade hop 1 (run -> lot): lot.weight_balance_lbs -= input_weight_lbs; lot.actual_packout_pct recomputed (chronological variant); if lot.weight_balance_lbs == 0 and lot.status == RELEASED -> lot RELEASED -> PACKED"
          - "cascade hop 1 (run -> pool): pool.total_packed_cartons += cartons_produced; pool totals/deductions/estimated price recomputed"
          - "cascade hop 2 (pool -> settlement): GrowerSettlement for (lot.grower_id, pool_id) is created ACCRUING if absent; attributed_cartons recomputed"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /packing-runs/{runId}/cancel"
        actor: "PackingSupervisor | Admin"
        preconditions:
          - "run.status == SCHEDULED (else ERR_RUN_INVALID_STATE)"
        side_effects:
          - "frees the line window; no weight or pool effects (nothing was consumed)"

      - from: COMPLETED
        to: VOIDED
        trigger: "POST /packing-runs/{runId}/void"
        actor: "PackingSupervisor | Admin"
        preconditions:
          - "run.status == COMPLETED (else ERR_RUN_INVALID_STATE)"
          - "run.pool.status in {OPEN, REOPENED} (else ERR_POOL_INVALID_STATE; post-close results are locked)"
        side_effects:
          - "compensation: lot.weight_balance_lbs += input_weight_lbs; lot.actual_packout_pct recomputed excluding this run; if lot.status == PACKED and balance > 0 -> lot PACKED -> RELEASED"
          - "pool.total_packed_cartons -= cartons_produced; pool totals/estimated price recomputed"
          - "settlement attributed_cartons recomputed"

  - entity: Pool
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /pools/{poolId}/close"
        actor: "PoolManager | Admin"
        preconditions:
          - "pool.status == OPEN (else ERR_POOL_INVALID_STATE)"
          - "OCC: expected_pool_version must match pool.version (else ERR_STALE_VERSION)"
          - "total_packed_cartons >= 1 (else ERR_POOL_EMPTY)"
          - "no PackingRun with status == SCHEDULED references this pool (else ERR_POOL_HAS_OPEN_RUNS)"
        side_effects:
          - "pool_price_per_carton_cents and rounding_drift_cents computed (calc pool_price, variant final; rounding order pinned)"
          - "cascade hop 1 (pool -> settlements): every GrowerSettlement with pool_id == pool.id in {ACCRUING, ADVANCE_PAID} computes final_payment_cents / clawback_cents and -> SETTLED"
          - "cascade hop 2 (settlement -> lots): for each Lot whose runs fed a settlement that just became SETTLED: if every GrowerSettlement touching that lot is SETTLED and lot.status == PACKED -> lot PACKED -> CLOSED"

      - from: CLOSED
        to: REOPENED
        trigger: "POST /pools/{poolId}/reopen"
        actor: "PoolManager | Admin"
        preconditions:
          - "pool.status == CLOSED (else ERR_POOL_INVALID_STATE)"
        side_effects:
          - "late-arriving sales can now be recorded; pool_price_per_carton_cents retained until the next close"
          - "cascade hop 1 (pool -> settlements): every SETTLED settlement for this pool reverts to ADVANCE_PAID (its final numbers are stale until re-close)"
          - "cascade hop 2 (settlement -> lots): each Lot that reached CLOSED via a settlement of this pool reverts CLOSED -> PACKED"

      - from: REOPENED
        to: CLOSED
        trigger: "POST /pools/{poolId}/close"
        actor: "PoolManager | Admin"
        preconditions:
          - "pool.status == REOPENED (else ERR_POOL_INVALID_STATE)"
          - "same OCC / non-empty / no-open-runs preconditions as OPEN -> CLOSED"
        side_effects:
          - "price recomputed over all sales; settlements pay only the delta vs paid_final_cents; same close cascades"

  - entity: GrowerSettlement
    initial_state: ACCRUING
    terminal_states: []   # SETTLED is terminal in practice but the pool-reopen cycle reverts it
    transitions:
      - from: ACCRUING
        to: ADVANCE_PAID
        trigger: "POST /settlements/{settlementId}/advance"
        actor: "PoolManager | Admin"
        preconditions:
          - "settlement.status == ACCRUING (else ERR_SETTLEMENT_INVALID_STATE)"
          - "settlement.pool.status == OPEN (else ERR_POOL_INVALID_STATE)"
          - "attributed_cartons >= 1 (else ERR_NO_ATTRIBUTED_CARTONS)"
        side_effects:
          - "advance_amount_cents = round_half_up(attributed_cartons * estimated_price_cents * ADVANCE_RATE) (calc settlement_value, variant advance)"

      - from: ACCRUING
        to: SETTLED
        trigger: "system (pool close cascade hop 1)"
        actor: system
        preconditions: []
        side_effects:
          - "final_payment_cents = max(0, attributed_cartons * pool_price_per_carton_cents - advance_amount_cents - paid_final_cents); clawback_cents += max(0, advance + paid_final - attributed * price); paid_final_cents += final_payment_cents"

      - from: ADVANCE_PAID
        to: SETTLED
        trigger: "system (pool close cascade hop 1)"
        actor: system
        preconditions: []
        side_effects:
          - "same final computation as ACCRUING -> SETTLED"

      - from: SETTLED
        to: ADVANCE_PAID
        trigger: "system (pool reopen cascade hop 1)"
        actor: system
        preconditions: []
        side_effects:
          - "final numbers retained but stale; the next close recomputes and pays the delta"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; sequential-observable conflicts live in §1.2/§1.4)
# =============================================================================
concurrency_rules:
  - rule_id: room-schedule-stale-version
    parent_entity: CARoom
    write_endpoint: "PUT /ca-rooms/{id}/schedule"
    occ_field: "expected_ca_room_version"
    description: |
      Updating a room's sealing schedule (planned_open_date and/or o2_setpoint_pct)
      is rejected when the client's last observed CARoom.version no longer matches
      the stored version. A schedule edit committed after another writer's edit
      (or after any cascade that bumped the room version, e.g. an inspection-driven
      priority_release update) is based on a stale view and must be re-read first.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: pool-close-stale-version
    parent_entity: Pool
    write_endpoint: "POST /pools/{poolId}/close"
    occ_field: "expected_pool_version"
    description: |
      Closing a pool commits the pool-average price computed from the totals the
      client last observed. If the pool's version has advanced since that read
      (a sale was recorded, a run completed or was voided), the close is based on
      stale totals and is rejected; the pool remains open and may legitimately be
      closed by a request carrying the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: packout_percentage
    trigger: "variant estimated: POST /lots/{lotId}/presize; variant actual: POST /packing-runs/{runId}/complete and POST /packing-runs/{runId}/void (recompute)"
    algorithm: forward_looking
    formula: |
      variant estimated (forward-looking, from presize profile):
        est_packout_pct = round_half_up(100 * (size_small_lbs + size_medium_lbs + size_large_lbs)
                          / (size_small_lbs + size_medium_lbs + size_large_lbs + presize_cull_lbs), 1)
      variant actual (chronological, over COMPLETED non-VOIDED PackingRuns of the lot):
        actual_packout_pct = round_half_up(100 * sum(packed_weight_lbs)
                             / sum(packed_weight_lbs + cull_weight_lbs + juice_weight_lbs), 1)
        null when the lot has no COMPLETED non-VOIDED runs.
      Run-level packout_pct (per PackingRun, at completion):
        packout_pct = round_half_up(100 * packed_weight_lbs / (packed+cull+juice), 1); cleared on void.
    input_set: "estimated: the lot's stored presize profile; actual: PackingRuns of this lot with status == COMPLETED only (SCHEDULED, CANCELLED, VOIDED excluded)"
    precision: "1 decimal place, round_half_up"
    variants:
      - name: estimated
        when: "at presize time, before any packing run completes"
        difference: "uses presize cull estimate; forward-looking over the presize profile"
      - name: actual
        when: "as packing runs complete / are voided"
        difference: "uses realized run weights; chronological aggregation over completed non-voided runs; diverges from estimated whenever line-level cull/juice differs from the presize cull estimate"

  - name: pool_price
    trigger: "variant estimated: recomputed whenever pool totals change (sale recorded, run completed, run voided) while pool OPEN/REOPENED; variant final: POST /pools/{poolId}/close"
    algorithm: aggregation
    formula: |
      net_cents = total_sales_cents - total_deductions_cents
      total_deductions_cents = total_packed_cartons * PACKING_CHARGE_PER_CARTON_CENTS + total_sale_deductions_cents
      variant estimated (while OPEN/REOPENED):
        estimated_price_cents = max(ESTIMATED_PRICE_FLOOR_CENTS, round_half_up(net_cents / total_packed_cartons, 0))
        when total_packed_cartons == 0: estimated_price_cents = ESTIMATED_PRICE_FLOOR_CENTS
      variant final (at close; total_packed_cartons >= 1 enforced by ERR_POOL_EMPTY):
        ROUNDING ORDER (pinned): first round the per-carton price to whole cents,
        then multiply per grower:
          pool_price_per_carton_cents = round_half_up(net_cents / total_packed_cartons, 0)
          rounding_drift_cents = pool_price_per_carton_cents * total_packed_cartons - net_cents
          (drift may be negative; it is recorded, never redistributed)
    input_set: "Pool totals over COMPLETED non-VOIDED runs and all recorded sales"
    constants:
      PACKING_CHARGE_PER_CARTON_CENTS: 650
      ESTIMATED_PRICE_FLOOR_CENTS: 1000
    precision: "integer cents, round_half_up"
    variants:
      - name: estimated
        when: "pool OPEN/REOPENED; feeds settlement advances"
        difference: "floored at ESTIMATED_PRICE_FLOOR_CENTS; reflects only sales recorded so far"
      - name: final
        when: "pool close"
        difference: "no floor; uses all recorded sales; rounding order pinned (price rounded first, then multiplied)"

  - name: settlement_value
    trigger: "variant advance: POST /settlements/{settlementId}/advance; variant final: pool close cascade"
    algorithm: aggregation
    formula: |
      variant advance (provisional, pool OPEN):
        advance_amount_cents = round_half_up(attributed_cartons * estimated_price_cents * ADVANCE_RATE, 0)
      variant final (at pool close):
        settlement_value_cents = attributed_cartons * pool_price_per_carton_cents
        delta = settlement_value_cents - advance_amount_cents - paid_final_cents
        final_payment_cents = max(0, delta)
        clawback_cents += max(0, -delta)
        paid_final_cents += final_payment_cents
    input_set: "the settlement row and its pool's price fields"
    constants:
      ADVANCE_RATE: 0.60
    precision: "integer cents, round_half_up"
    variants:
      - name: advance
        when: "while the pool is OPEN, before final pricing exists"
        difference: "provisional: ADVANCE_RATE fraction of the floored estimated price"
      - name: final
        when: "at pool close"
        difference: "actual pool-average price; advance is credited; shortfall claws back (final floored at 0); identical inputs produce a different amount than the advance"

  - name: release_priority_score
    trigger: "recomputed when a DisorderInspection is created for the room, when atmosphere_alarm changes, when the room opens, and when the priority-release cascade fires"
    algorithm: weighted_scoring
    formula: |
      release_priority_score = round_half_up(
          2.0 * room.disorder_index
        + (40 if room.atmosphere_alarm else 0)
        + (30 if room.priority_release else 0)
        + min(20, days_open)
        + urgency
      , 1)
      where:
        days_open = integer days from room.actual_opened_at to the current logical clock
          (0 while the room is not OPENED), computed with whole-day floor semantics.
        days_remaining = max(0, floor((must_release_by - now) in whole days))
        urgency = 30 - min(30, days_remaining)   # per-allocation term: lots nearer their
                                                 # deadline score higher; overdue lots max at 30
      Selector policy (POST /ca-rooms/{id}/select-release):
        eligibility: StorageAllocations with status == ACTIVE in this room (room must be OPENED)
        ranking: release_priority_score DESC
        tie-break: allocated_at ASC, then created_at ASC
        empty candidate set: ERR_NO_RELEASABLE_ALLOCATIONS
    input_set: "the allocation's room fields (disorder_index, atmosphere_alarm, priority_release, actual_opened_at) and the allocation's own must_release_by (urgency term differentiates allocations within one room)"
    constants:
      ALARM_BONUS: 40
      PRIORITY_BONUS: 30
      AGE_CAP_DAYS: 20
      URGENCY_WINDOW_DAYS: 30
    precision: "1 decimal place, round_half_up"

  - name: disorder_index
    trigger: "POST /ca-rooms/{id}/inspections"
    algorithm: weighted_scoring
    formula: |
      disorder_index = round_half_up(0.2 * scald_pct + 0.3 * bitter_pit_pct + 0.5 * decay_pct, 2)
      if decay_pct >= DECAY_PRIORITY_THRESHOLD_PCT (inclusive):
        fire the priority-release cascade (see state machine notes / endpoint side effects)
    input_set: "the inspection's three sampled percentages"
    constants:
      DECAY_PRIORITY_THRESHOLD_PCT: 5.0
    precision: "2 decimal places, round_half_up"

  - name: weight_balance
    trigger: "lot creation, run completion, run void, lot diversion"
    algorithm: aggregation
    formula: |
      weight_balance_lbs = received_weight_lbs
                         - diverted_weight_lbs
                         - sum over COMPLETED non-VOIDED PackingRuns of input_weight_lbs
      Invariant (compensating pair complete/void): completing a run then voiding it
      leaves weight_balance_lbs exactly unchanged.
      Diversion: diverted_weight_lbs = weight_balance_lbs at divert time (balance becomes 0).
    input_set: "the lot and its COMPLETED non-VOIDED PackingRuns"
    precision: "exact decimal, no rounding"

  - name: room_bins
    trigger: "allocation creation, allocation release (any reason)"
    algorithm: aggregation
    formula: |
      bins_allocated = sum(bins) over StorageAllocations of this room with status == ACTIVE
      bins_free = bin_capacity - bins_allocated
      Invariant (compensating pair allocate/release): creating an allocation then
      releasing it leaves bins_free exactly unchanged.
    input_set: "ACTIVE StorageAllocations of the room"
    precision: "integer bins"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role must be one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Grower-role scope: X-User-ID must equal the owning Grower.id of the addressed resource (grower self-read, lot, block via parent grower, allocation via lot, settlement)"
    error_id: ERR_GROWER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /growers/{id}; GET /growers/{id}/blocks; GET /lots; GET /lots/{lotId}; GET /allocations; GET /allocations/{allocationId}; GET /settlements; GET /settlements/{settlementId} — when X-User-Role == Grower"
  - priority: 4
    category: existence
    check: "Path identifiers exist, validated left-to-right; body-supplied FK ids (lot_id, block_id, spec_id, pool_id, room lots) must also exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: existence
    check: "Request shape: required fields present, JSON types correct, enum values within declared sets, percentages within 0..100, creation quantities (bins, received_bin_count, received_weight_lbs, input_weight_lbs, storage_life_days, bin_capacity) strictly positive. Money-sign rules on pool sales are NOT covered here (see priority 11)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 6
    category: state
    check: "OCC endpoints: expected_<parent>_version field present"
    error_id: ERR_VERSION_REQUIRED
    http_status: 400
    applies_to: "PUT /ca-rooms/{id}/schedule; POST /pools/{poolId}/close"
  - priority: 7
    category: state
    check: "OCC endpoints: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /ca-rooms/{id}/schedule; POST /pools/{poolId}/close"
  - priority: 8
    category: state
    check: "Entity state preconditions per §1.2 (lot presize/divertibility/storage/released gates; room filling/sealed/opened gates; allocation active gate; spec active gate; run scheduled/completed gates; pool open/closed gates; settlement accruing gate). When several state gates fail on one call, report in this order: lot, spec, pool, room, allocation, run, settlement. Also covers ERR_BLOCK_GROWER_MISMATCH referential ordering at this tier: block.grower_id must equal lot grower_id."
    error_id: "ERR_LOT_INVALID_STATE | ERR_ROOM_INVALID_STATE | ERR_ALLOCATION_INVALID_STATE | ERR_SPEC_INVALID_STATE | ERR_RUN_INVALID_STATE | ERR_POOL_INVALID_STATE | ERR_SETTLEMENT_INVALID_STATE | ERR_BLOCK_GROWER_MISMATCH"
    http_status: 409
    applies_to: "state-transition and state-gated endpoints"
  - priority: 9
    category: business_safety
    check: "Seal safety: |current_o2_pct - o2_setpoint_pct| <= O2_TOLERANCE_PCT using exact decimal comparison (strictly-greater raises the alarm; equality is within tolerance)"
    error_id: ERR_O2_NOT_AT_SETPOINT
    http_status: 409
    applies_to: "POST /ca-rooms/{id}/seal"
  - priority: 10
    category: business_temporal
    check: "Temporal rules: seal planned_open_date strictly in the future (ERR_OPEN_DATE_NOT_FUTURE); run scheduled_end strictly after scheduled_start (ERR_RUN_WINDOW_INVALID); run window must not overlap another SCHEDULED run on the same line_code — half-open intervals, adjacency allowed (ERR_LINE_SCHEDULE_OVERLAP); run creation rejected when current logical clock > lot.received_at + block.storage_life_days (ERR_LOT_STORAGE_LIFE_EXCEEDED)"
    error_id: "ERR_OPEN_DATE_NOT_FUTURE | ERR_RUN_WINDOW_INVALID | ERR_LINE_SCHEDULE_OVERLAP | ERR_LOT_STORAGE_LIFE_EXCEEDED"
    http_status: 422
    applies_to: "POST /ca-rooms/{id}/seal; POST /packing-runs (per-error HTTP statuses per §1.6 — ERR_LINE_SCHEDULE_OVERLAP is 409)"
  - priority: 11
    category: business_constraint
    check: "Constraint rules: allocation bins <= room.bins_free (ERR_ROOM_CAPACITY_EXCEEDED); run input_weight_lbs <= lot.weight_balance_lbs (ERR_WEIGHT_BALANCE_EXCEEDED); lot.avg_color_pct >= spec.color_min_pct (ERR_COLOR_BELOW_SPEC); run completion packed+cull+juice == input_weight_lbs exactly (ERR_RUN_WEIGHT_MISMATCH); presize profile sums to received_weight_lbs (ERR_RUN_WEIGHT_MISMATCH); uniqueness keys grower_code, room_code, (grower,orchard,block,variety), (variety,grade_class,season) (ERR_UNIQUE_CONSTRAINT_VIOLATION); pool close requires no SCHEDULED runs referencing the pool (ERR_POOL_HAS_OPEN_RUNS) and total_packed_cartons >= 1 (ERR_POOL_EMPTY) — within this tier the open-runs check is evaluated before the empty check"
    error_id: "ERR_ROOM_CAPACITY_EXCEEDED | ERR_WEIGHT_BALANCE_EXCEEDED | ERR_COLOR_BELOW_SPEC | ERR_RUN_WEIGHT_MISMATCH | ERR_UNIQUE_CONSTRAINT_VIOLATION | ERR_POOL_EMPTY | ERR_POOL_HAS_OPEN_RUNS"
    http_status: 409
    applies_to: "create/complete/close endpoints as listed (per-error HTTP statuses per §1.6 — weight/color/mismatch errors are 422)"
  - priority: 12
    category: business_fiscal
    check: "Fiscal rules: sale cartons_sold > 0, gross_revenue_cents > 0, deduction_cents >= 0 (ERR_SALE_AMOUNT_INVALID); settlement advance requires attributed_cartons >= 1 (ERR_NO_ATTRIBUTED_CARTONS)"
    error_id: "ERR_SALE_AMOUNT_INVALID | ERR_NO_ATTRIBUTED_CARTONS"
    http_status: 422
    applies_to: "POST /pools/{poolId}/sales; POST /settlements/{settlementId}/advance (per-error HTTP statuses per §1.6 — ERR_NO_ATTRIBUTED_CARTONS is 409)"

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Growers / Blocks ---
  - method: POST
    path: "/growers"
    description: "Register a grower"
    roles: [Admin]
    code: 201
    input: [name, grower_code]
    output: Grower
    side_effects: []

  - method: GET
    path: "/growers/{id}"
    description: "Get a grower (Grower role: self only)"
    roles: [Admin, PoolManager, ReceivingClerk, StorageOperator, PackingSupervisor, Grower]
    code: 200
    input: []
    output: Grower
    side_effects: []

  - method: POST
    path: "/growers/{id}/blocks"
    description: "Register an orchard block for a grower"
    roles: [Admin, ReceivingClerk]
    code: 201
    input: [orchard_name, block_code, variety, storage_life_days]
    output: OrchardBlock
    side_effects: []

  - method: GET
    path: "/growers/{id}/blocks"
    description: "List a grower's blocks (FK reverse for OrchardBlock.grower_id)"
    roles: [Admin, PoolManager, ReceivingClerk, StorageOperator, PackingSupervisor, Grower]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrchardBlock[]"
    side_effects: []

  # --- Lots ---
  - method: POST
    path: "/lots"
    description: "Receive a lot (bin delivery) tied to grower + block"
    roles: [Admin, ReceivingClerk]
    code: 201
    input: [grower_id, block_id, received_bin_count, received_weight_lbs, avg_color_pct]
    output: Lot
    side_effects:
      - "received_at = current logical clock; status=RECEIVED; weight_balance_lbs = received_weight_lbs"

  - method: GET
    path: "/lots/{lotId}"
    description: "Get a lot"
    roles: [Admin, PoolManager, ReceivingClerk, StorageOperator, PackingSupervisor, Grower]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/lots"
    description: "List lots with filters (FK reverse for Lot.grower_id and Lot.block_id; Grower role is force-filtered to own grower_id)"
    roles: [Admin, PoolManager, ReceivingClerk, StorageOperator, PackingSupervisor, Grower]
    code: 200
    input: ["grower_id?", "block_id?", "status?", "limit?", "offset?"]
    output: "Lot[]"
    side_effects: []

  - method: POST
    path: "/lots/{lotId}/presize"
    description: "Run the presize line over a RECEIVED lot; records size profile and computes est_packout_pct"
    roles: [Admin, ReceivingClerk]
    code: 200
    input: [size_small_lbs, size_medium_lbs, size_large_lbs, presize_cull_lbs]
    output: Lot
    side_effects:
      - "lot RECEIVED -> PRESIZED; est_packout_pct computed (calc packout_percentage, variant estimated)"

  - method: POST
    path: "/lots/{lotId}/divert"
    description: "Divert a whole lot to cull/juice (RECEIVED or IN_STORAGE)"
    roles: [Admin, StorageOperator]
    code: 200
    input: []
    output: Lot
    side_effects:
      - "lot -> DIVERTED; diverted_weight_lbs = weight_balance_lbs"
      - "cascade: ACTIVE allocations -> RELEASED (DIVERSION); rooms' bins freed; FILLING/OPENED rooms emptied to 0 -> AVAILABLE"

  # --- CA Rooms ---
  - method: POST
    path: "/ca-rooms"
    description: "Register a CA room"
    roles: [Admin, StorageOperator]
    code: 201
    input: [room_code, bin_capacity, o2_setpoint_pct]
    output: CARoom
    side_effects:
      - "status=AVAILABLE; current_o2_pct=20.9; atmosphere_alarm=false; priority_release=false; disorder_index=0"

  - method: GET
    path: "/ca-rooms/{id}"
    description: "Get a CA room"
    roles: [Admin, PoolManager, ReceivingClerk, StorageOperator, PackingSupervisor, Grower]
    code: 200
    input: []
    output: CARoom
    side_effects: []

  - method: PUT
    path: "/ca-rooms/{id}/schedule"
    description: "Update the room's sealing schedule / oxygen setpoint. OCC-guarded: expected_ca_room_version required (concurrency rule room-schedule-stale-version)."
    roles: [Admin, StorageOperator]
    code: 200
    input: [expected_ca_room_version, "planned_open_date?", "o2_setpoint_pct?"]
    output: CARoom
    side_effects:
      - "increments CARoom.version by 1"
      - "allowed only while status in {AVAILABLE, FILLING, SEALED} (else ERR_ROOM_INVALID_STATE)"

  - method: POST
    path: "/ca-rooms/{id}/seal"
    description: "Seal a FILLING room; requires oxygen pulled down to setpoint within tolerance and a future planned_open_date"
    roles: [Admin, StorageOperator]
    code: 200
    input: [planned_open_date]
    output: CARoom
    side_effects:
      - "room FILLING -> SEALED; sealed_at = now"

  - method: POST
    path: "/ca-rooms/{id}/open"
    description: "Open a SEALED room; starts the must-empty clock and recomputes allocation deadlines/scores"
    roles: [Admin, StorageOperator]
    code: 200
    input: []
    output: CARoom
    side_effects:
      - "room SEALED -> OPENED; actual_opened_at = now; must_empty_by = now + ROOM_EMPTY_DAYS"
      - "cascade: ACTIVE allocations get must_release_by = min(existing, must_empty_by); release_priority_score recomputed"

  - method: POST
    path: "/ca-rooms/{id}/atmosphere-readings"
    description: "Record an oxygen reading. Alarm semantics apply only while SEALED: |o2 - setpoint| > O2_TOLERANCE_PCT (exact decimal comparison) raises atmosphere_alarm and increments o2_excursion_count; a reading back within tolerance clears the alarm."
    roles: [Admin, StorageOperator]
    code: 200
    input: [o2_pct]
    output: CARoom
    side_effects:
      - "current_o2_pct = o2_pct"
      - "if room SEALED and alarm state flips on: atmosphere_alarm=true, o2_excursion_count += 1, allocation scores recomputed; if flips off: atmosphere_alarm=false, scores recomputed"

  - method: POST
    path: "/ca-rooms/{id}/inspections"
    description: "Record a storage-disorder inspection (room must be SEALED or OPENED)"
    roles: [Admin, StorageOperator]
    code: 201
    input: [scald_pct, bitter_pit_pct, decay_pct]
    output: DisorderInspection
    side_effects:
      - "disorder_index computed (calc disorder_index); room.disorder_index updated; allocation scores recomputed"
      - "priority-release cascade when decay_pct >= DECAY_PRIORITY_THRESHOLD_PCT: hop 1 (inspection -> room) room.priority_release=true and room.planned_open_date = min(planned_open_date, now + PRIORITY_OPEN_DAYS); hop 2 (room -> allocations) every ACTIVE allocation in the room gets must_release_by = min(existing, now + PRIORITY_RELEASE_DAYS) and release_priority_score recomputed"

  - method: GET
    path: "/ca-rooms/{id}/inspections"
    description: "List a room's disorder inspections (FK reverse for DisorderInspection.room_id)"
    roles: [Admin, PoolManager, ReceivingClerk, StorageOperator, PackingSupervisor, Grower]
    code: 200
    input: ["limit?", "offset?"]
    output: "DisorderInspection[]"
    side_effects: []

  - method: POST
    path: "/ca-rooms/{id}/allocations"
    description: "Allocate bins of a lot into a room (lot RECEIVED or PRESIZED; room AVAILABLE, FILLING, or OPENED — fruit may be added to an already-opened room)"
    roles: [Admin, StorageOperator]
    code: 201
    input: [lot_id, bins]
    output: StorageAllocation
    side_effects:
      - "allocation ACTIVE; must_release_by = lot.received_at + block.storage_life_days, further clamped to min(..., room.must_empty_by) when the room is already OPENED; room.bins_allocated += bins"
      - "room AVAILABLE -> FILLING on first allocation; an OPENED room stays OPENED; lot RECEIVED/PRESIZED -> IN_STORAGE on first ACTIVE allocation"

  - method: POST
    path: "/ca-rooms/{id}/select-release"
    description: "Selector: release the top-ranked ACTIVE allocation of an OPENED room per calc release_priority_score (score DESC, tie allocated_at ASC then created_at ASC)"
    roles: [Admin, StorageOperator]
    code: 200
    input: []
    output: StorageAllocation
    side_effects:
      - "selected allocation -> RELEASED (release_reason=SELECTED) with the same room/lot cascades as a manual release"

  # --- Allocations (flat) ---
  - method: GET
    path: "/allocations/{allocationId}"
    description: "Get a storage allocation"
    roles: [Admin, PoolManager, ReceivingClerk, StorageOperator, PackingSupervisor, Grower]
    code: 200
    input: []
    output: StorageAllocation
    side_effects: []

  - method: GET
    path: "/allocations"
    description: "List allocations with filters (FK reverse for StorageAllocation.room_id and StorageAllocation.lot_id; Grower role sees only own lots' allocations)"
    roles: [Admin, PoolManager, ReceivingClerk, StorageOperator, PackingSupervisor, Grower]
    code: 200
    input: ["room_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: "StorageAllocation[]"
    side_effects: []

  - method: POST
    path: "/allocations/{allocationId}/release"
    description: "Manually release an ACTIVE allocation (room must be OPENED)"
    roles: [Admin, StorageOperator]
    code: 200
    input: []
    output: StorageAllocation
    side_effects:
      - "allocation -> RELEASED (release_reason=MANUAL); room.bins_allocated -= bins; room OPENED with bins_allocated == 0 -> AVAILABLE; lot's first release: lot IN_STORAGE -> RELEASED"

  # --- Packaging Specs ---
  - method: POST
    path: "/specs"
    description: "Create a retail-customer packaging spec; a new ACTIVE spec supersedes the existing ACTIVE spec in the same (customer_name, size_class, pack_style) scope"
    roles: [Admin, PoolManager]
    code: 201
    input: [customer_name, label_code, grade_min, color_min_pct, size_class, pack_style]
    output: PackagingSpec
    side_effects:
      - "prior ACTIVE spec in the same scope -> SUPERSEDED"

  - method: GET
    path: "/specs/{specId}"
    description: "Get a packaging spec"
    roles: [Admin, PoolManager, ReceivingClerk, StorageOperator, PackingSupervisor, Grower]
    code: 200
    input: []
    output: PackagingSpec
    side_effects: []

  # --- Packing Runs ---
  - method: POST
    path: "/packing-runs"
    description: "Schedule a packing run: RELEASED lot + ACTIVE spec + OPEN/REOPENED pool + non-overlapping line window + weight/color/storage-life gates"
    roles: [Admin, PackingSupervisor]
    code: 201
    input: [lot_id, spec_id, pool_id, line_code, scheduled_start, scheduled_end, input_weight_lbs]
    output: PackingRun
    side_effects:
      - "status=SCHEDULED"

  - method: GET
    path: "/packing-runs/{runId}"
    description: "Get a packing run"
    roles: [Admin, PoolManager, ReceivingClerk, StorageOperator, PackingSupervisor, Grower]
    code: 200
    input: []
    output: PackingRun
    side_effects: []

  - method: GET
    path: "/packing-runs"
    description: "List packing runs with filters (FK reverse for PackingRun.lot_id / spec_id / pool_id)"
    roles: [Admin, PoolManager, ReceivingClerk, StorageOperator, PackingSupervisor, Grower]
    code: 200
    input: ["lot_id?", "spec_id?", "pool_id?", "status?", "limit?", "offset?"]
    output: "PackingRun[]"
    side_effects: []

  - method: POST
    path: "/packing-runs/{runId}/complete"
    description: "Complete a SCHEDULED run; records outputs, enforces exact weight split, fires lot/pool/settlement cascades"
    roles: [Admin, PackingSupervisor]
    code: 200
    input: [cartons_produced, packed_weight_lbs, cull_weight_lbs, juice_weight_lbs]
    output: PackingRun
    side_effects:
      - "run -> COMPLETED; packout_pct computed"
      - "lot.weight_balance_lbs -= input_weight_lbs; lot.actual_packout_pct recomputed; balance == 0 on a RELEASED lot -> PACKED"
      - "pool.total_packed_cartons += cartons_produced; estimated price recomputed"
      - "GrowerSettlement (lot.grower_id, pool_id) auto-created ACCRUING if absent; attributed_cartons recomputed"

  - method: POST
    path: "/packing-runs/{runId}/cancel"
    description: "Cancel a SCHEDULED run (frees the line window; no weight/pool effects)"
    roles: [Admin, PackingSupervisor]
    code: 200
    input: []
    output: PackingRun
    side_effects:
      - "run -> CANCELLED"

  - method: POST
    path: "/packing-runs/{runId}/void"
    description: "Void a COMPLETED run (pool still OPEN/REOPENED); compensates all completion effects"
    roles: [Admin, PackingSupervisor]
    code: 200
    input: []
    output: PackingRun
    side_effects:
      - "run -> VOIDED; lot.weight_balance_lbs += input_weight_lbs; actual_packout_pct recomputed; PACKED lot with balance > 0 -> RELEASED"
      - "pool.total_packed_cartons -= cartons_produced; settlement attributed_cartons recomputed"

  # --- Pools ---
  - method: POST
    path: "/pools"
    description: "Open a marketing pool for (variety, grade_class, season)"
    roles: [Admin, PoolManager]
    code: 201
    input: [variety, grade_class, season]
    output: Pool
    side_effects:
      - "status=OPEN; totals zeroed"

  - method: GET
    path: "/pools/{poolId}"
    description: "Get a pool"
    roles: [Admin, PoolManager, ReceivingClerk, StorageOperator, PackingSupervisor, Grower]
    code: 200
    input: []
    output: Pool
    side_effects: []

  - method: POST
    path: "/pools/{poolId}/sales"
    description: "Record a pooled sale (pool OPEN or REOPENED); increments totals and bumps pool.version"
    roles: [Admin, PoolManager]
    code: 200
    input: [cartons_sold, gross_revenue_cents, deduction_cents]
    output: Pool
    side_effects:
      - "total_sales_cents += gross_revenue_cents; total_sale_deductions_cents += deduction_cents; estimated price recomputed; increments Pool.version by 1"

  - method: POST
    path: "/pools/{poolId}/close"
    description: "Close a pool: computes final pool-average price (OCC-guarded by expected_pool_version, concurrency rule pool-close-stale-version), settles all settlements, closes packed lots"
    roles: [Admin, PoolManager]
    code: 200
    input: [expected_pool_version]
    output: Pool
    side_effects:
      - "increments Pool.version by 1"
      - "pool_price_per_carton_cents + rounding_drift_cents computed (rounding order pinned in calc pool_price)"
      - "cascade hop 1: settlements -> SETTLED with final_payment_cents/clawback_cents"
      - "cascade hop 2: PACKED lots whose settlements all SETTLED -> CLOSED"

  - method: POST
    path: "/pools/{poolId}/reopen"
    description: "Reopen a CLOSED pool for late-arriving sales; settlements revert to ADVANCE_PAID; lots revert CLOSED -> PACKED"
    roles: [Admin, PoolManager]
    code: 200
    input: []
    output: Pool
    side_effects:
      - "pool CLOSED -> REOPENED"
      - "cascade: settlements SETTLED -> ADVANCE_PAID; affected lots CLOSED -> PACKED"

  # --- Settlements ---
  - method: GET
    path: "/settlements/{settlementId}"
    description: "Get a grower settlement (Grower role: own only)"
    roles: [Admin, PoolManager, Grower]
    code: 200
    input: []
    output: GrowerSettlement
    side_effects: []

  - method: GET
    path: "/settlements"
    description: "List settlements with filters (FK reverse for GrowerSettlement.grower_id and pool_id; Grower role force-filtered to own)"
    roles: [Admin, PoolManager, Grower]
    code: 200
    input: ["grower_id?", "pool_id?", "status?", "limit?", "offset?"]
    output: "GrowerSettlement[]"
    side_effects: []

  - method: POST
    path: "/settlements/{settlementId}/advance"
    description: "Pay the provisional advance (60% of estimated pool value) on an ACCRUING settlement while the pool is OPEN"
    roles: [Admin, PoolManager]
    code: 200
    input: []
    output: GrowerSettlement
    side_effects:
      - "advance_amount_cents computed (calc settlement_value, variant advance); settlement ACCRUING -> ADVANCE_PAID"

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default when never called: exactly 2026-08-01T00:00:00Z — the logical clock MUST NOT fall back to wall-clock time. All received_at/allocated_at/inspected_at/sealed_at/opened_at timestamps and all deadline comparisons read this clock."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "logical clock := to_iso8601 (must be a valid ISO8601 UTC timestamp; setting the clock backwards is rejected with ERR_INVALID_REQUEST)"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_GROWER_SCOPE_VIOLATION, http: 403, condition: "Grower role addressing a resource owned by a different grower" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong JSON type, enum outside declared set, percentage outside 0..100, non-positive creation quantity, or clock set backwards" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-supplied FK id does not exist" }
  - { id: ERR_VERSION_REQUIRED, http: 400, condition: "OCC endpoint called without expected_<parent>_version" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_LOT_INVALID_STATE, http: 409, condition: "Lot not in a state allowing the operation (presize needs RECEIVED; divert needs RECEIVED|IN_STORAGE; allocation needs RECEIVED|PRESIZED; run creation needs RELEASED)" }
  - { id: ERR_ROOM_INVALID_STATE, http: 409, condition: "Room not in a state allowing the operation (allocate needs AVAILABLE|FILLING|OPENED; seal needs FILLING with >= 1 bin; open needs SEALED; release/select-release need OPENED; inspection needs SEALED|OPENED; schedule update needs AVAILABLE|FILLING|SEALED)" }
  - { id: ERR_ALLOCATION_INVALID_STATE, http: 409, condition: "Allocation not ACTIVE" }
  - { id: ERR_SPEC_INVALID_STATE, http: 409, condition: "PackagingSpec not ACTIVE (SUPERSEDED specs reject new runs)" }
  - { id: ERR_RUN_INVALID_STATE, http: 409, condition: "PackingRun not in the required state (complete/cancel need SCHEDULED; void needs COMPLETED)" }
  - { id: ERR_POOL_INVALID_STATE, http: 409, condition: "Pool not in the required state (sales/run-complete/void need OPEN|REOPENED; close needs OPEN|REOPENED; reopen needs CLOSED; advance needs OPEN)" }
  - { id: ERR_SETTLEMENT_INVALID_STATE, http: 409, condition: "Settlement not ACCRUING when advance attempted" }
  - { id: ERR_O2_NOT_AT_SETPOINT, http: 409, condition: "Seal attempted while |current_o2_pct - o2_setpoint_pct| > O2_TOLERANCE_PCT (exact decimal comparison)" }
  - { id: ERR_OPEN_DATE_NOT_FUTURE, http: 422, condition: "Seal planned_open_date is not strictly after the current logical clock" }
  - { id: ERR_RUN_WINDOW_INVALID, http: 422, condition: "scheduled_end is not strictly after scheduled_start" }
  - { id: ERR_LINE_SCHEDULE_OVERLAP, http: 409, condition: "Run window overlaps another SCHEDULED run on the same line_code (half-open intervals; adjacency allowed)" }
  - { id: ERR_LOT_STORAGE_LIFE_EXCEEDED, http: 422, condition: "Run creation when current logical clock is after lot.received_at + block.storage_life_days" }
  - { id: ERR_ROOM_CAPACITY_EXCEEDED, http: 409, condition: "Allocation bins exceed room.bins_free" }
  - { id: ERR_WEIGHT_BALANCE_EXCEEDED, http: 422, condition: "Run input_weight_lbs exceeds lot.weight_balance_lbs" }
  - { id: ERR_COLOR_BELOW_SPEC, http: 422, condition: "lot.avg_color_pct below spec.color_min_pct (>= passes; strictly below fails)" }
  - { id: ERR_UNIQUE_CONSTRAINT_VIOLATION, http: 409, condition: "Duplicate grower_code, room_code, (grower,orchard,block,variety) block, or (variety,grade_class,season) pool" }
  - { id: ERR_RUN_WEIGHT_MISMATCH, http: 422, condition: "Run completion weights do not sum exactly to input_weight_lbs, or presize profile does not sum exactly to received_weight_lbs" }
  - { id: ERR_POOL_EMPTY, http: 409, condition: "Pool close attempted with total_packed_cartons == 0" }
  - { id: ERR_POOL_HAS_OPEN_RUNS, http: 409, condition: "Pool close attempted while a SCHEDULED run references the pool" }
  - { id: ERR_SALE_AMOUNT_INVALID, http: 422, condition: "Sale with cartons_sold <= 0, gross_revenue_cents <= 0, or deduction_cents < 0" }
  - { id: ERR_NO_ATTRIBUTED_CARTONS, http: 409, condition: "Advance attempted on a settlement with attributed_cartons == 0" }
  - { id: ERR_NO_RELEASABLE_ALLOCATIONS, http: 409, condition: "select-release on an OPENED room with zero ACTIVE allocations" }
  - { id: ERR_BLOCK_GROWER_MISMATCH, http: 409, condition: "Lot creation where block.grower_id != grower_id" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Packinghouse platform administrator; superset of every operational role plus the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /growers — register grower"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "All other endpoints"

  - name: ReceivingClerk
    description: "Receiving desk operator: grower blocks, lot receiving, presize"
    identity: opaque
    exclusive_operations:
      - "POST /growers/{id}/blocks — register block"
      - "POST /lots — receive lot"
      - "POST /lots/{lotId}/presize — presize"
    shared_operations:
      - "Read endpoints (GET) across the API"

  - name: StorageOperator
    description: "CA storage operator: rooms, atmosphere, inspections, allocations, releases, diversions"
    identity: opaque
    exclusive_operations:
      - "POST /ca-rooms; PUT /ca-rooms/{id}/schedule; POST /ca-rooms/{id}/seal; POST /ca-rooms/{id}/open; POST /ca-rooms/{id}/atmosphere-readings; POST /ca-rooms/{id}/inspections; POST /ca-rooms/{id}/allocations; POST /ca-rooms/{id}/select-release; POST /allocations/{allocationId}/release; POST /lots/{lotId}/divert"
    shared_operations:
      - "Read endpoints (GET) across the API"

  - name: PackingSupervisor
    description: "Packing-line supervisor: schedules, completes, cancels, and voids packing runs"
    identity: opaque
    exclusive_operations:
      - "POST /packing-runs; POST /packing-runs/{runId}/complete; POST /packing-runs/{runId}/cancel; POST /packing-runs/{runId}/void"
    shared_operations:
      - "Read endpoints (GET) across the API"

  - name: PoolManager
    description: "Marketing/pool office: packaging specs, pools, sales, closes/reopens, settlement advances"
    identity: opaque
    exclusive_operations:
      - "POST /specs; POST /pools; POST /pools/{poolId}/sales; POST /pools/{poolId}/close; POST /pools/{poolId}/reopen; POST /settlements/{settlementId}/advance"
    shared_operations:
      - "Read endpoints (GET) across the API"

  - name: Grower
    description: "External grower; read-only access scoped to own grower record, blocks, lots, allocations, and settlements"
    identity: "entity_backed:Grower"
    exclusive_operations: []
    shared_operations:
      - "GET /growers/{id} (self); GET /growers/{id}/blocks (self); GET /lots(+filters, own only); GET /lots/{lotId} (own); GET /allocations(+filters, own lots only); GET /allocations/{allocationId} (own); GET /settlements(+filters, own only); GET /settlements/{settlementId} (own); other GET endpoints readable"
