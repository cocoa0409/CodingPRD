      - name: deal_fork_join_divergent_closing_document_sets
        grounds:
          - state_machines.Deal.STRUCTURING_to_PRICING_NEGOTIATED
          - state_machines.Deal.STRUCTURING_to_PRICING_COMPETITIVE
          - state_machines.Deal.PRICED_to_AWARDED
          - entities.Deal.fields.requires_g17_letter
          - entities.Deal.fields.requires_notice_of_sale
          - entities.ClosingDocument.fields.doc_type
        distinguishing_aspect: |
          Entity is Deal and the non-linearity is a branching fork-join: STRUCTURING forks into
          PRICING_NEGOTIATED (requires_g17_letter true, requires_notice_of_sale false) and
          PRICING_COMPETITIVE (the mirror image), both rejoin at PRICED, and the divergence is
          still observable after the join because award creates six closing documents whose sixth
          member is G17_DISCLOSURE_LETTER on the negotiated branch and
          NOTICE_OF_SALE_CERTIFICATE on the competitive branch.
        test_recipe:
          setup:
            - "One municipal advisor firm, one underwriting firm and one issuer exist."
            - "Deal N (Series 2026N) is negotiated with a single senior manager at 100.0000 percent liability; Deal C (Series 2026C) is competitive with no syndicate."
