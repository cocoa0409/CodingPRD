          - errors[ERR_OFFER_CREATOR_CANNOT_FINALIZE]
          - complexity_profile.role_model
        distinguishing_aspect: |
          The role model is segregation_of_duties, so the separations are between USERS
          holding the same role, not between roles - and the boundary is deliberately
          asymmetric: the drafter user-chair-1 MAY vote on their own offer (voting is a
          shared operation and nothing forbids it) but MAY NOT finalize it, while the sponsor
          user-sponsor-1 holds a perfectly valid CommitteeMember role and still may not vote
