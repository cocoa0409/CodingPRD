            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma_pep: "$.data.id" }
          trigger:
            - call: "POST /monitoring-assignments"
              as: StationEngineer
