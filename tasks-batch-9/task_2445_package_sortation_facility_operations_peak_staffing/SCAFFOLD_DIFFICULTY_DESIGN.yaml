              as_user_id: "u_planner_1"
            - call: "POST /sortation/staff-assignments"
              payload: { shift_plan_id: "${plan_id}", worker_id: "${w_id}", line_chute_id: "${chute1_id}", role_on_line: "PRIMARY_SORTER" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /sortation/staff-assignments/${sa_id}/check-in"
              payload: {}
              as: Worker
              as_user_id: "${w_id}"
            - call: "POST /sortation/workers/${w_id}/onboarding-events"
              payload: { event_type: "CERTIFIED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w_id}/onboarding-events"
              payload: { event_type: "TRAINING_SESSION_COMPLETED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w_id}/onboarding-events"
              payload: { event_type: "TRAINING_SESSION_COMPLETED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w_id}/onboarding-events"
              payload: { event_type: "CERTIFIED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/staff-assignments/${sa_id}/check-in"
              payload: {}
              as: Worker
              as_user_id: "${w_id}"
          assert:
            - "the first check-in returns ERR_WORKER_NOT_CLEARED with HTTP 409 while Worker.${w_id}.status == CLEARED, and StaffAssignment.${sa_id}.status stays ASSIGNED with checked_in_at == null"
            - "the premature CERTIFIED event returns ERR_WORKER_NOT_CLEARED with HTTP 409 (training_sessions_completed 0 < REQUIRED_TRAINING_SESSIONS 2) and the worker stays CLEARED"
            - "after two TRAINING_SESSION_COMPLETED events Worker.${w_id}.training_sessions_completed == 2 and status is still CLEARED"
            - "the second CERTIFIED event moves Worker.${w_id}.status to CERTIFIED"
            - "the final check-in returns HTTP 200 with StaffAssignment.${sa_id}.status == CHECKED_IN and checked_in_at == 2026-08-03T06:00:00Z"

