scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: user_registration_returns_created_with_fields
        claim_type: Creation
        grounds: [entities.User.fields.email, entities.User.fields.trust_score]
        distinguishing_aspect: "POST /users with email/full_name/phone returns 201 with a system id, trust_score defaulting to 300, verification_status UNVERIFIED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /users"
              payload: { email: "u_create@x.com", full_name: "New User", phone: "555" }
              as: Anonymous
              captures: { uid: $.data.id }
          assert:
            - "response.status == 201"
            - "User.${uid}.trust_score == 300"
            - "User.${uid}.verification_status == UNVERIFIED"

      - name: get_nonexistent_user_returns_not_found
        claim_type: Not Found
        grounds: [entities.User.fields.email, "validations[priority=3]"]
        distinguishing_aspect: "GET /users/{bogus-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /users/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Platform
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: listing_missing_required_base_rate_rejected
        claim_type: Required Fields
        grounds: [entities.Listing.fields.base_daily_rate_cents, "validations[priority=14]"]
        distinguishing_aspect: "POST /listings omitting base_daily_rate_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An owner exists."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_req@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Cam", category: "camera", declared_value_cents: 90000, deposit_cents: 50000 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: listing_quantity_defaults_to_one
        claim_type: Defaults
        grounds: [entities.Listing.fields.quantity]
        distinguishing_aspect: "Omitting quantity on POST /listings yields quantity == 1 (declared default)."
        test_recipe:
          setup: ["An owner exists."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_def@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Cam", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
          assert:
            - "Listing.${listing_id}.quantity == 1"

      - name: listing_demand_multiplier_out_of_range_rejected
        claim_type: Type Constraints
        grounds: [entities.Listing.fields.demand_multiplier_bps, "validations[priority=14]"]
        distinguishing_aspect: "demand_multiplier_bps=40000 (> 30000 max) on POST /listings returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["An owner exists."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_rng@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Cam", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, demand_multiplier_bps: 40000 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_email_registration_rejected
        claim_type: Type Constraints
        grounds: [entities.User.fields.email, "validations[priority=15]"]
        distinguishing_aspect: "Registering a second user with an already-used email returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["A user with email dup@x.com already exists."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "dup@x.com", full_name: "First", phone: "111" }
              as: Anonymous
          trigger:
            - call: "POST /users"
              payload: { email: "dup@x.com", full_name: "Second", phone: "222" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"

      - name: dynamic_pricing_correct_result_stub
        claim_type: Computed Fields
        grounds: [calculations.dynamic_daily_pricing]
        excluded_because:
          difficulty_instance: dynamic_daily_pricing_tier_weekend_demand_mode_a
          rationale: "Correct dynamic-pricing result (66600 subtotal) is asserted by the named §1.8 combinatorial instance."

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_listing_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Listing.DRAFT_to_ACTIVE, entities.Listing.fields.status]
        distinguishing_aspect: "Activating an already-ACTIVE listing (no ACTIVE->ACTIVE transition) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An owner has an ACTIVE listing."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_iv1@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Cam", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: approve_already_approved_booking_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Booking.REQUESTED_to_APPROVED, entities.Booking.fields.status]
        distinguishing_aspect: "Approving a booking already in APPROVED (no APPROVED->APPROVED transition) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A verified renter has an APPROVED booking."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_iv2@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_iv2@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Cam", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, quantity: 1 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_declined_terminal_booking_invalid
        claim_type: terminal_state
        grounds: [state_machines.Booking.REQUESTED_to_DECLINED, state_machines.Booking.REQUESTED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a booking already DECLINED (terminal) returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A verified renter has a DECLINED booking on a quantity-1 listing."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_iv3@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_iv3@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Cam", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, quantity: 1 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/decline"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: booking_initial_state_is_requested
        claim_type: initial_state
        grounds: [state_machines.Booking.null_to_REQUESTED, entities.Booking.fields.status]
        distinguishing_aspect: "A freshly created booking has status REQUESTED and active_booking_count on the listing rises to 1."
        test_recipe:
          setup: ["A verified renter and an ACTIVE quantity-1 listing."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_is@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_is@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Cam", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, quantity: 1 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "Booking.${booking_id}.status == REQUESTED"
            - "Listing.${listing_id}.active_booking_count == 1"

      - name: decide_already_approved_verification_invalid
        claim_type: idempotency
        grounds: [state_machines.VerificationRecord.PENDING_to_APPROVED]
        distinguishing_aspect: "Deciding a verification already APPROVED (terminal) returns ERR_INVALID_STATE on the second decide."
        test_recipe:
          setup: ["A user has an APPROVED verification record."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "renter_idem@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
          trigger:
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "REJECT", reject_reason: "changed mind" }
              as: Platform
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: pickup_without_completed_handoff_rejected
        claim_type: precondition
        grounds: [state_machines.Booking.APPROVED_to_ACTIVE, "validations[priority=17]"]
        distinguishing_aspect: "Pickup on an APPROVED booking with a PICKUP condition report but no COMPLETED PICKUP handoff returns ERR_HANDOFF_MISSING."
        test_recipe:
          setup: ["A verified renter has an APPROVED booking with a PICKUP condition report but NO handoff."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_pu@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_pu@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Cam", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, quantity: 1 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/condition-reports"
              payload: { phase: "PICKUP", photo_urls: ["u1"], recorded_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/pickup"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_HANDOFF_MISSING"

      - name: cancel_cascades_scheduled_handoff_to_cancelled
        claim_type: side_effect
        grounds: [state_machines.HandoffAppointment.SCHEDULED_to_CANCELLED, state_machines.Booking.APPROVED_to_CANCELLED]
        distinguishing_aspect: "Cancelling an APPROVED booking cascades its SCHEDULED PICKUP handoff to CANCELLED and restores active_booking_count to 0."
        test_recipe:
          setup: ["A verified renter has an APPROVED booking with a SCHEDULED PICKUP handoff."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_cc@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_cc@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Cam", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, quantity: 1 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/handoffs"
              payload: { type: "PICKUP", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T09:30:00Z" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
          assert:
            - "HandoffAppointment.${h_id}.status == CANCELLED"
            - "Listing.${listing_id}.active_booking_count == 0"

      - name: late_fee_accrual_stub
        claim_type: side_effect
        grounds: [calculations.late_fee_accrual, state_machines.Booking.ACTIVE_to_LATE]
        excluded_because:
          difficulty_instance: late_fee_round_per_day_then_sum_mode_b
          rationale: "Late-fee accrual and the LATE transition side-effects are asserted by the named §1.8 combinatorial instance."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: owner_payout_no_damage_net_correct
        claim_type: Correct Result
        grounds: [calculations.owner_payout, entities.Payout.fields.net_payout_cents]
        distinguishing_aspect: "On a clean RETURN (no claim), Payout net = gross 66600 - commission 9990 + 0 damage = 56610."
        test_recipe:
          setup: ["A RETURNED booking (base 10000, 7 nights, rental_subtotal 66600) with a PENDING Payout."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_pay@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_pay@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Cam", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, quantity: 1 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/handoffs"
              payload: { type: "PICKUP", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T09:30:00Z" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { pu_handoff_id: $.data.id }
            - call: "POST /handoffs/${pu_handoff_id}/complete"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/condition-reports"
              payload: { phase: "PICKUP", photo_urls: ["u1"], recorded_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/pickup"
              payload: {}
              as: Owner
