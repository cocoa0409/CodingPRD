              as: PlatformAdmin
              captures: { ven_n1b: "$.data.id" }
            - call: "GET /venues/${ven_n1a}"
              payload: {}
              as: LotBoss
              captures: { ven_n1a_name: "$.data.name" }
            - call: "GET /venues?jurisdiction_id=${jur_n1}&limit=1&offset=0"
              payload: {}
              as: RouteManager
              captures: { first_venue_id: "$.data[0].id" }
          assert:
            - "Both POSTs answer 201 with distinct ids"
            - "GET /venues/${ven_n1a} answers 200 with name == \"Franklin County Fairgrounds\", lot_area_sqft == 100000, usable_lot_sqft == 69999, allowed_amps == 1080.0"
            - "The filtered list answers 200 with total_count == 2, has_more == true and exactly 1 item"
            - "No update or delete verb exists for /venues/{id} in §1.5"

      - name: route_commit_action_moves_a_sequenced_route_to_committed
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /routes/{id}/commit]
          - state_machines.Route.transitions.SEQUENCED_to_COMMITTED
          - entities.Route.fields.status
        distinguishing_aspect: |
          Commit is a pure lock: it flips SEQUENCED to COMMITTED and touches nothing else — the stop stays PLANNED,
          the deal stays SENT, and the aggregates written by the earlier sequence call (sequence_index 0 and
          travel_hours_from_previous 0.0 for the chain head) are unchanged.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1, Route R1 with one PLANNED stop A carrying a SENT contract, already SEQUENCED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
