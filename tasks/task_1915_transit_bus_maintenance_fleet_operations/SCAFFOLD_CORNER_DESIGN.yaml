            - { call: "POST /fleet/mechanics", payload: { name: "LeadQA", employee_ref: "R4A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics/${m1}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 6500, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m1}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_SOD_QA_SELF_CERTIFY (403)", "WO remains PENDING_QA"]

      - name: sod_recovery_self_approval_rejected_then_other_manager_succeeds
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=13]
          - errors[ERR_SOD_RECOVERY_SELF_APPROVAL]
        distinguishing_aspect: "The FleetManager whose opaque X-User-ID equals the claim's submitted_by_user_id cannot post its recovery; a different FleetManager id succeeds and lands variance 0."
        test_recipe:
          setup: ["APPROVED claim 6500c submitted by clerk-9"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "R5", vin: "VINR5", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 100000, base_warranty_expiry_date: "2027-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "R5A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "R5B" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 6500, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}" }
            - { call: "GET /fleet/work-orders/${wo}/warranty-claims", payload: {}, as: WarrantyClerk, captures: { claim: "$.data[0].id" } }
            - { call: "POST /fleet/warranty-claims/${claim}/events", payload: { event_type: "SUBMIT" }, as: WarrantyClerk, as_user_id: "clerk-9" }
            - { call: "POST /fleet/warranty-claims/${claim}/events", payload: { event_type: "RECORD_OEM_DECISION", decision_outcome: "APPROVED" }, as: WarrantyClerk, as_user_id: "clerk-9" }
          trigger:
            - { call: "POST /fleet/warranty-claims/${claim}/events", payload: { event_type: "POST_RECOVERY", received_cents: 6500 }, as: FleetManager, as_user_id: "clerk-9", captures: { err: $.data.error_id } }
            - { call: "POST /fleet/warranty-claims/${claim}/events", payload: { event_type: "POST_RECOVERY", received_cents: 6500 }, as: FleetManager, as_user_id: "fm-7", captures: { st: $.data.status, varc: $.data.variance_cents } }
          assert:
            - "Same-person recovery: err == ERR_SOD_RECOVERY_SELF_APPROVAL (403)"
            - "Different manager: status RECOVERED, received_cents == 6500, variance_cents == 0"

      - name: request_without_auth_headers_unauthenticated
        claim_type: role_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID is rejected ERR_UNAUTHENTICATED (401) before any other validation (priority 1 beats everything)."
        test_recipe:
          setup: ["Empty DB; the trigger call is sent with no auth headers at all"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fleet/posture", payload: {}, captures: { err: $.data.error_id } }
          assert: ["err == ERR_UNAUTHENTICATED", "HTTP 401"]

      - name: labor_entry_by_non_lead_mechanic_forbidden
        claim_type: ownership
        grounds:
          - validations[priority=2]
          - roles.Mechanic
        distinguishing_aspect: "Entity-backed ownership: labor entries are accepted only from the WO's lead_mechanic_id; another mechanic (even a valid one) gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["IN_PROGRESS WO led by m1; m2 is another mechanic"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "R6", vin: "VINR6", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
