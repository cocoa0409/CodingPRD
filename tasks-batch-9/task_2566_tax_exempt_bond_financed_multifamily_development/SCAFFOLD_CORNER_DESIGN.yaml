            - "BondIssue.${bond_id}.cumulative_funded_cents == 200000000 and undrawn_cents == 0"
            - "1191666 <= BondIssue.${bond_id}.negative_arbitrage_allowance_cents 4000000, so neither funding is blocked"

      - name: restricted_rent_precision_at_each_floored_division_step
        claim_type: precision
        grounds:
          - calculations.restricted_rent_ceiling
          - entities.UnitRestriction.fields.restricted_rent_cents
        excluded_because:
          difficulty_instance: restricted_rent_clamps_at_the_exact_ceiling_and_at_the_exact_program_floor
          rationale: |
            The §1.8 boundary_precision_check instance already pins the whole
            rounding chain: the 30%-of-income step floors before the division by
            12 floors again, the utility allowance is subtracted only from the
            AMI-derived ceiling, and the MIN_RENT_FLOOR_CENTS clamp is applied
            last. It asserts the exact-tie cases on both clamps, which is the
            precision claim for this rule.

      - name: fifty_percent_threshold_boundary_at_and_below_five_thousand_bps
        claim_type: threshold
        grounds:
          - calculations.fifty_percent_aggregate_basis_test
          - entities.Project.fields.provisional_fifty_percent_ratio_bps
          - errors[ERR_FIFTY_PERCENT_TEST_FAILED]
        excluded_because:
          difficulty_instance: fifty_percent_ratio_of_exactly_5000_bps_issues_while_4987_bps_is_refused
          rationale: |
            The §1.8 boundary_precision_check instance tests the inclusive side of
            FIFTY_PERCENT_THRESHOLD_BPS with a ratio of exactly 5000 and the
            failing side one denomination step below at 4987, over the same
            project shape. Threshold-at, threshold-below and the flag they set are
            all covered there.

      - name: restricted_rent_tier_selection_across_ami_bands_and_elections
        claim_type: tiered_pricing
        grounds:
          - calculations.restricted_rent_ceiling
          - calculations.restricted_rent_ceiling.constants.AMI_100_ANNUAL_INCOME_CENTS
        excluded_because:
          difficulty_instance: restricted_rent_ceiling_binds_on_ami_then_on_market_then_on_the_program_floor
          rationale: |
            The §1.8 combinatorial_formula instance walks the same unit through
            three different binding caps - the AMI band, the market rent and the
            program floor - across household sizes and elections, which is
            exactly the tier-boundary walk this row asks for.

      - name: credit_delivery_fills_the_first_bucket_before_the_remainder
        claim_type: waterfall_allocation
        grounds:
          - calculations.credit_delivery_waterfall
          - entities.InvestorDelivery.fields.delivered_credit_cents
          - entities.CreditAllocation.fields.undelivered_credit_cents
        excluded_because:
          difficulty_instance: credit_delivery_waterfall_fills_exactly_then_to_the_penny_then_clamps_an_over_ask
          rationale: |
            The §1.8 combinatorial_formula instance runs three deliveries against
            one allocation: an exact fill, a to-the-penny remainder and an over-ask
            that is clamped rather than rejected, plus the conservation identity
            after a rescind. First-bucket-before-second, overflow and remainder
            allocation are all asserted there.

      - name: dscr_variants_diverge_on_identical_operating_months
        claim_type: variant_divergence
        grounds:
          - calculations.debt_service_coverage_ratio
          - calculations.debt_service_coverage_ratio.variants
          - entities.BondIssue.fields.dscr_bps
        excluded_because:
          difficulty_instance: dscr_variant_t3_clears_conversion_while_t12_on_the_same_months_is_refused
          rationale: |
            The §1.8 dual_variant_calc instance feeds one twelve-month history to
            both variants and asserts the delta: T3 reads only the three strongest
            months and converts, T12 reads all twelve and is refused with
            ERR_DSCR_BELOW_MINIMUM, with the stamped dscr_bps and dscr_basis
            checked on the surviving path.

      - name: fifty_percent_variant_selection_and_reconciliation_on_switch
        claim_type: variant_selection
        grounds:
          - calculations.fifty_percent_aggregate_basis_test.variants
          - entities.Project.fields.final_fifty_percent_ratio_bps
          - entities.Project.fields.automatic_credit_triggered
        excluded_because:
          difficulty_instance: fifty_percent_test_provisional_passes_then_final_variant_revokes_the_credit
          rationale: |
            The §1.8 dual_variant_calc instance covers both selection and
            reconciliation: the PROVISIONAL_AT_ISSUANCE variant runs on issuance
            and sets automatic_credit_triggered true, then FINAL_AT_COST_CERT runs
            on acceptance over funded draws and a certified denominator and
            overrides the flag to false, blocking Form 8609 issuance.

  - section: validations
    instances:
      - name: par_that_fits_before_the_denomination_round_up_fails_after_it
        claim_type: violation_to_error
        grounds:
          - validations[priority=111]
          - errors[ERR_PAR_EXCEEDS_CAP_AWARD]
          - calculations.bond_sizing
          - entities.VolumeCapAllocation.fields.awarded_amount_cents
          - endpoints[POST /bond-issues]
        distinguishing_aspect: |
          The award is set to exactly the UNROUNDED par, 199,920,000. The sizing
          therefore fits the award at every step until the final ceil to the next
          500,000 denomination pushes par to 200,000,000, which is 80,000 above
          the award - so the refusal is caused by the rounding step alone. A
          slightly smaller filing (eligible 189,000,000) sizes to 199,000,000 and
          is accepted against the same untouched award, proving the rule compares
          the ROUNDED par and nothing else.
        test_recipe:
          setup:
            - "Sponsor, 2026 pool of 600,000,000 and the four-unit CF project."
            - "One volume cap allocation requested at 200,000,000 but AWARDED at exactly 199,920,000."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /cap-pools"
              payload: { program_year: 2026, base_cap_cents: 500000000, carryforward_cents: 100000000 }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /volume-cap-allocations"
              payload: { project_id: "${proj_id}", cap_pool_id: "${pool_id}", requested_amount_cents: 200000000, requested_closing_date: "2026-09-15T00:00:00Z" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { alloc_id: $.data.id }
            - call: "GET /cap-pools/${pool_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_v: $.data.version }
            - call: "POST /volume-cap-allocations/${alloc_id}/decision"
              payload: { decision: "AWARD", awarded_amount_cents: 199920000, expiry_date: "2027-06-30T00:00:00Z", expected_cap_pool_version: "${pool_v}" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
          trigger:
            - call: "POST /bond-issues"
              payload: { project_id: "${proj_id}", volume_cap_allocation_id: "${alloc_id}", eligible_cost_cents: 190000000, capitalized_interest_cents: 6000000, bond_yield_bps: 450, investment_yield_bps: 200 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /bond-issues"
              payload: { project_id: "${proj_id}", volume_cap_allocation_id: "${alloc_id}", eligible_cost_cents: 189000000, capitalized_interest_cents: 6000000, bond_yield_bps: 450, investment_yield_bps: 200 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { ok_bond_id: $.data.id, ok_par: $.data.par_amount_cents }
          assert:
            - "the first call returns HTTP 422 and captured err_id == 'ERR_PAR_EXCEEDS_CAP_AWARD'"
            - "the unrounded sizing 196,000,000 + 3,920,000 = 199,920,000 equals the award exactly; only the ceil to 200,000,000 breaches it"
            - "no BondIssue row was created by the refused call: GET /bond-issues?project_id=${proj_id} returns total_count 1 after the second call"
            - "the second call returns HTTP 201 and captured ok_par == 199000000 (195,000,000 + 3,900,000 = 198,900,000, ceiled to 199,000,000)"
            - "BondIssue.${ok_bond_id}.issuance_allowance_cents == 3900000 and negative_arbitrage_allowance_cents == 3980000"
            - "VolumeCapAllocation.${alloc_id}.status is still AWARDED and awarded_amount_cents is still 199920000 after both calls"
            - "CapPool.${pool_id}.committed_cents == 199920000 and reserved_cents == 0 throughout"

      - name: agreement_terms_pass_at_the_exact_fifteen_year_gap_and_fail_one_year_short
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=130]
          - validations[priority=131]
          - errors[ERR_SET_ASIDE_MISMATCH]
          - errors[ERR_EXTENDED_USE_TOO_SHORT]
          - endpoints[POST /regulatory-agreements]
          - entities.RegulatoryAgreement.fields.compliance_period_years
        distinguishing_aspect: |
          Three near-miss filings and one exact-boundary filing on the same
          project. MIN_20_50 against a MIN_40_60 project fails on election match
          (priority 130) before any term arithmetic runs. compliance 14 fails the
          MIN_COMPLIANCE_PERIOD_YEARS floor even though its 30-year extended use
          clears the 15-year gap; compliance 15 with extended 29 fails the gap by
          exactly one year; compliance 15 with extended 30 satisfies the rule at
          equality (30 == 15 + 15) and is accepted, so the inclusive boundary is
          pinned on the passing side.
        test_recipe:
          setup:
            - "Sponsor and the four-unit CF project electing MIN_40_60, all four units designated (two RESTRICTED at 60% AMI, two MARKET)."
            - "No regulatory agreement exists yet."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "102", bedroom_count: 2, floor_space_sqft: 900, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "202", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
          trigger:
            - call: "POST /regulatory-agreements"
              payload: { project_id: "${proj_id}", set_aside_election: "MIN_20_50", compliance_period_years: 15, extended_use_years: 30, recording_county: "King" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_mismatch: $.data.error_id }
            - call: "POST /regulatory-agreements"
              payload: { project_id: "${proj_id}", set_aside_election: "MIN_40_60", compliance_period_years: 14, extended_use_years: 30, recording_county: "King" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_short_period: $.data.error_id }
            - call: "POST /regulatory-agreements"
              payload: { project_id: "${proj_id}", set_aside_election: "MIN_40_60", compliance_period_years: 15, extended_use_years: 29, recording_county: "King" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_short_gap: $.data.error_id }
            - call: "POST /regulatory-agreements"
              payload: { project_id: "${proj_id}", set_aside_election: "MIN_40_60", compliance_period_years: 15, extended_use_years: 30, recording_county: "King" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { ra_id: $.data.id }
          assert:
            - "the first call returns HTTP 422 and captured err_mismatch == 'ERR_SET_ASIDE_MISMATCH'"
            - "the second call returns HTTP 422 and captured err_short_period == 'ERR_EXTENDED_USE_TOO_SHORT' (compliance 14 is below the 15-year floor)"
            - "the third call returns HTTP 422 and captured err_short_gap == 'ERR_EXTENDED_USE_TOO_SHORT' (29 is one year short of 15 + 15)"
            - "the fourth call returns HTTP 201 with equality on the gap: RegulatoryAgreement.${ra_id}.compliance_period_years == 15 and extended_use_years == 30"
            - "RegulatoryAgreement.${ra_id}.status == DRAFT, instrument_number == null, recording_date == null, amendment_count == 0"
            - "RegulatoryAgreement.${ra_id}.compliance_period_end_date == null and extended_use_end_date == null (they are stamped only at conversion)"
            - "Project.${proj_id}.compliance_status is still UNRESTRICTED: a DRAFT agreement restricts nothing"
            - "GET /regulatory-agreements?project_id=${proj_id} returns total_count 1, so none of the three refused filings persisted a row"

      - name: unit_roster_aggregates_block_a_duplicate_a_fifth_unit_and_an_under_designated_recording
        claim_type: aggregate_validation
        grounds:
          - validations[priority=132]
          - validations[priority=121]
          - validations[priority=120]
          - errors[ERR_DUPLICATE_UNIT_NUMBER]
          - errors[ERR_UNIT_COUNT_EXCEEDS_TOTAL]
          - errors[ERR_UNIT_COUNT_MISMATCH]
          - endpoints[POST /regulatory-agreements/{id}/record]
        distinguishing_aspect: |
          Each individual unit filing is valid; only the collection breaches the
          limits. With two units designated on a four-unit project the set-aside
          ratio is already 5000 bps and passes priority 120, so the recording
          refusal must come from priority 121 counting designated_unit_count 2
          against total_units 4 - not from the set-aside test. Once the roster is
          complete the identical record call succeeds, and only then does a fifth
          designation breach total_units. The duplicate probe pins the other half
          of priority 132: unit_number uniqueness is tested BEFORE the count
          ceiling, so re-filing "101" on a project with room left returns the
          409 duplicate rather than the 422 count error.
        test_recipe:
          setup:
            - "Sponsor and the four-unit CF project electing MIN_40_60."
            - "Only the two RESTRICTED units 101 (800 sqft) and 102 (900 sqft) are designated; units 201 and 202 are not filed yet."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "102", bedroom_count: 2, floor_space_sqft: 900, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /regulatory-agreements"
              payload: { project_id: "${proj_id}", set_aside_election: "MIN_40_60", compliance_period_years: 15, extended_use_years: 30, recording_county: "King" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "101", bedroom_count: 1, floor_space_sqft: 700, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 170000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_dup: $.data.error_id }
            - call: "POST /regulatory-agreements/${ra_id}/record"
              payload: { instrument_number: "KC-2026-0009" }
              as: HfaComplianceOfficer
              as_user_id: "hfa-comp-1"
              captures: { err_count: $.data.error_id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "202", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /regulatory-agreements/${ra_id}/record"
              payload: { instrument_number: "KC-2026-0010" }
              as: HfaComplianceOfficer
              as_user_id: "hfa-comp-1"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "203", bedroom_count: 1, floor_space_sqft: 800, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 175000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_exceeds: $.data.error_id }
          assert:
            - "the duplicate filing returns HTTP 409 and captured err_dup == 'ERR_DUPLICATE_UNIT_NUMBER' even though the project still has room for two more units"
            - "the first record attempt returns HTTP 422 and captured err_count == 'ERR_UNIT_COUNT_MISMATCH' - Project.${proj_id}.set_aside_satisfied was already true, so priority 120 passed and priority 121 fired"
            - "after the refused recording RegulatoryAgreement.${ra_id}.status == DRAFT and instrument_number == null (KC-2026-0009 was not stamped)"
            - "the two MARKET filings return HTTP 201 and Project.${proj_id}.designated_unit_count becomes 4"
            - "the second record attempt returns HTTP 200 with instrument_number 'KC-2026-0010' and status RECORDED"
            - "Project.${proj_id}.compliance_status == RESTRICTED after the successful recording"
            - "the fifth designation returns HTTP 422 and captured err_exceeds == 'ERR_UNIT_COUNT_EXCEEDS_TOTAL' (unique number, but designated_unit_count 4 already equals total_units 4)"
            - "Project.${proj_id}.designated_unit_count is still 4 and applicable_fraction_bps is still 5000 after the refusal"

      - name: ami_band_above_sixty_is_allowed_only_under_the_average_income_election
        claim_type: conditional_validation
        grounds:
          - validations[priority=133]
          - errors[ERR_AMI_PERCENT_NOT_ALLOWED]
          - calculations.restricted_rent_ceiling
          - entities.UnitRestriction.fields.ami_percent
          - entities.Project.fields.set_aside_election
        distinguishing_aspect: |
          The identical 70% AMI filing is refused on the MIN_40_60 project and
          accepted on the AVG_INCOME project, so the rule is genuinely conditional
          on the parent's election rather than on the payload. The accepted row also
          proves the election feeds the rent formula: household size 3 at 70% gives
          floor(8,100,000*70/100) = 5,670,000 annual, floor(5,670,000*30/100) =
          1,701,000, floor(1,701,000/12) = 141,750, less the 12,000 allowance =
          129,750 - below the 150,000 market cap, so 129,750 stands. The same rule
          also owns the two presence cases: ami_percent absent on a RESTRICTED unit
          and ami_percent supplied on a MARKET unit both return the same code.
        test_recipe:
          setup:
            - "One sponsor owning two projects: Harborview Annex electing MIN_40_60 and Bayside Mix electing AVG_INCOME, each with total_units 4 and total_floor_space_sqft 3400."
            - "No units are designated on either project yet."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_a: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Bayside Mix", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "AVG_INCOME" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_b: $.data.id }
          trigger:
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_a}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 70, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_band: $.data.error_id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_b}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 70, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { b_unit_id: $.data.id, b_rent: $.data.restricted_rent_cents }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_a}", unit_number: "102", bedroom_count: 2, floor_space_sqft: 900, designation: "RESTRICTED", utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_absent: $.data.error_id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_a}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", ami_percent: 60, utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_present: $.data.error_id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_a}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { a_unit_id: $.data.id, a_rent: $.data.restricted_rent_cents }
          assert:
            - "the first call returns HTTP 422 and captured err_band == 'ERR_AMI_PERCENT_NOT_ALLOWED' (70 above 60 under MIN_40_60)"
            - "the second call returns HTTP 201: the same 70% band is legal under AVG_INCOME"
            - "captured b_rent == 129750 and UnitRestriction.${b_unit_id}.imputed_household_size == 3"
            - "the third call returns HTTP 422 and captured err_absent == 'ERR_AMI_PERCENT_NOT_ALLOWED' (required on a RESTRICTED unit)"
            - "the fourth call returns HTTP 422 and captured err_present == 'ERR_AMI_PERCENT_NOT_ALLOWED' (must be omitted on a MARKET unit)"
            - "the fifth call returns HTTP 201 and captured a_rent == 109500 - the 60% band on the same project shape"
            - "Project.${proj_a}.designated_unit_count == 1 and Project.${proj_b}.designated_unit_count == 1: none of the three refused filings persisted"
            - "Project.${proj_a}.restricted_unit_count == 1 and unit_fraction_bps == 2500 and set_aside_satisfied == false"

      - name: an_award_expiring_exactly_at_the_clock_instant_is_already_unusable
        claim_type: temporal_validation
        grounds:
          - validations[priority=82]
          - errors[ERR_ALLOCATION_EXPIRED]
          - state_machines.VolumeCapAllocation.AWARDED_to_EXPIRED
          - endpoints[POST /_clock/set_current_utc]
          - calculations.cap_pool_availability
        distinguishing_aspect: |
          The deadline is exclusive on the validation side but strict on the
          transition side, and the two disagree by one instant. At a clock of
          exactly 2027-06-30T00:00:00Z the award is unusable - POST /bond-issues
          returns ERR_ALLOCATION_EXPIRED - yet the allocation is still AWARDED and
          the pool still counts 200,000,000 as committed, because AWARDED ->
          EXPIRED needs the clock STRICTLY past expiry_date. One second later the
          transition fires, committed_cents falls back to 0, awardable_cents
          returns to 600,000,000 and the same request fails for the new reason
          that the allocation is no longer AWARDED - the same error code, a
          different cause.
        test_recipe:
          setup:
            - "Sponsor, a 2026 pool of 600,000,000 and the CF project with no units designated (none are needed to size a bond)."
            - "One allocation AWARDED at 200,000,000 with expiry_date 2027-06-30T00:00:00Z; the logical clock is still at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /cap-pools"
              payload: { program_year: 2026, base_cap_cents: 500000000, carryforward_cents: 100000000 }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /volume-cap-allocations"
              payload: { project_id: "${proj_id}", cap_pool_id: "${pool_id}", requested_amount_cents: 200000000, requested_closing_date: "2026-09-15T00:00:00Z" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { alloc_id: $.data.id }
            - call: "GET /cap-pools/${pool_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_v: $.data.version }
            - call: "POST /volume-cap-allocations/${alloc_id}/decision"
              payload: { decision: "AWARD", awarded_amount_cents: 200000000, expiry_date: "2027-06-30T00:00:00Z", expected_cap_pool_version: "${pool_v}" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-30T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "GET /volume-cap-allocations/${alloc_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { status_at_equality: $.data.status }
            - call: "POST /bond-issues"
              payload: { project_id: "${proj_id}", volume_cap_allocation_id: "${alloc_id}", eligible_cost_cents: 190000000, capitalized_interest_cents: 6000000, bond_yield_bps: 450, investment_yield_bps: 200 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_at_equality: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-30T00:00:01Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "GET /volume-cap-allocations/${alloc_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { status_past: $.data.status }
            - call: "POST /bond-issues"
              payload: { project_id: "${proj_id}", volume_cap_allocation_id: "${alloc_id}", eligible_cost_cents: 190000000, capitalized_interest_cents: 6000000, bond_yield_bps: 450, investment_yield_bps: 200 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_past: $.data.error_id }
          assert:
            - "captured status_at_equality == 'AWARDED': equality does not fire AWARDED -> EXPIRED, which needs the clock strictly past expiry_date"
            - "at equality CapPool.${pool_id}.committed_cents == 200000000 and awardable_cents == 400000000"
            - "the first bond filing returns HTTP 409 and captured err_at_equality == 'ERR_ALLOCATION_EXPIRED' (the validation deadline is exclusive)"
            - "captured status_past == 'EXPIRED' one second later"
            - "after expiry CapPool.${pool_id}.committed_cents == 0, reserved_cents == 0, available_cents == 600000000, awardable_cents == 600000000 and pool_status == OPEN"
            - "the conservation identity holds after the expiry: 600000000 == available_cents + reserved_cents + committed_cents"
            - "the second bond filing also returns HTTP 409 with captured err_past == 'ERR_ALLOCATION_EXPIRED', now because the allocation is no longer AWARDED"
            - "no BondIssue row exists for the project after either attempt"
            - "VolumeCapAllocation.${alloc_id}.awarded_amount_cents is retained as 200000000 on the EXPIRED row for the audit trail"

      - name: credit_allocation_gates_run_project_status_then_cert_status_then_cert_ownership
        claim_type: cascading_validation
        grounds:
          - validations[priority=86]
          - validations[priority=87]
          - validations[priority=88]
          - errors[ERR_PROJECT_NOT_PLACED_IN_SERVICE]
          - errors[ERR_COST_CERT_NOT_ACCEPTED]
          - errors[ERR_COST_CERT_PROJECT_MISMATCH]
          - endpoints[POST /credit-allocations]
        distinguishing_aspect: |
          Three probes each violate a later gate as well as the one under test, so
          only the declared order produces the expected code. A bare project paired
          with a foreign certification violates BOTH priority 86 and priority 88 and
          must report ERR_PROJECT_NOT_PLACED_IN_SERVICE. A DRAFT certification of
          the right project isolates priority 87. A foreign but ACCEPTED
          certification against a second project that is itself placed in service
          isolates priority 88 - it can only be reached once 86 and 87 both pass,
          which is why the fixture has to finance two projects out of the same pool.
        test_recipe:
          setup:
            - "Sponsor and 2026 pool of 600,000,000 funding two developments plus one unfinanced project."
            - "Harborview Annex: full CF chain to PLACED_IN_SERVICE with an ACCEPTED cost certification (355,000,000 eligible) and a SECOND certification left in DRAFT."
            - "Bayside Two: a smaller two-unit project financed from the same pool (par 50,000,000) and driven to PLACED_IN_SERVICE, with no certification of its own."
            - "Cedar Lot: a bare project in PLANNING with no units and no financing."
