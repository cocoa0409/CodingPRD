              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /blinds/consultations/${c1}/complete"
              as: Designer
              as_user_id: "${d1}"
              captures: { first_status: $.data.status }
            - call: "POST /blinds/consultations/${c1}/complete"
              as: Designer
              as_user_id: "${d1}"
              captures: { err_second: $.data.error_id }
          assert:
            - "the first call returns 200 with the captured ${first_status} == COMPLETED and completed_at stamped from the logical clock 2026-08-01T00:00:00.000Z"
            - "the cascade fired once: Lead.${l1}.status == CONSULT_COMPLETE"
            - "the second call fails 409 with error_id == ERR_CONSULTATION_NOT_SCHEDULED"
            - "the refusal changed nothing: Consultation.${c1}.status is still COMPLETED with the SAME completed_at, and Territory.${t1}.open_leads_count == 1 (CONSULT_COMPLETE still counts as open)"

      - name: measuring_survives_a_completed_appointment_but_not_a_no_show
        claim_type: Precondition Enforcement
        grounds:
          - validations.priority_21_ERR_CONSULTATION_CLOSED
          - state_machines.Consultation.SCHEDULED_to_NO_SHOW
          - state_machines.Lead.ROUTED_to_LOST
        distinguishing_aspect: "Two closed states, two verdicts: COMPLETED still admits measuring, configuring and quoting (a re-measure trip is normal), while NO_SHOW blocks all three with ERR_CONSULTATION_CLOSED. The pair proves the gate tests a status SET, not merely 'is the appointment over'."
        test_recipe:
          setup:
            - "One ACTIVE territory with capacity 5, one designer and two ROUTED leads, each with its own SCHEDULED consultation on non-overlapping windows in the same postal code."
