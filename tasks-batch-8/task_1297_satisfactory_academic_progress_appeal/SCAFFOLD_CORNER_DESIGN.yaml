  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ['validations[priority=1]', 'errors[ERR_UNAUTHENTICATED]']
        distinguishing_aspect: "A call with no X-User-Role/X-User-ID headers fails authentication before any other check, even for a read endpoint."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /sap/students", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_UNAUTHENTICATED (401); response_type == error"]

      - name: student_cannot_decide_appeal
        claim_type: violation_to_error
        grounds: ['validations[priority=2]', 'roles[Student]', 'errors[ERR_UNAUTHORIZED]']
        distinguishing_aspect: "Authorization (priority 2) precedes state checks: a Student calling decide on a real SUBMITTED appeal gets ERR_UNAUTHORIZED, never ERR_DECISION_REQUIRES_REVIEW."
        test_recipe:
          setup: ["Student suspended at T2 with appeal submitted (SUBMITTED)"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-SD", name: "StudDecide", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-3001", full_name: "Self Decider", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "OTHER", statement: "s", documents: [{ doc_type: "NOTE", description: "n" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { ap: $.data.id } }
          trigger:
            - { call: "POST /sap/appeals/${ap}/decide", payload: { decision: "APPROVED", resolution: "PROBATION_ONLY", rationale: "self-approve" }, as: Student, as_user_id: "${stu}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_UNAUTHORIZED (403); appeal stays SUBMITTED"]

      - name: committee_decide_nonexistent_appeal_returns_not_found
        claim_type: violation_to_error
        grounds: ['validations[priority=2]', 'validations[priority=3]', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "With authorization satisfied (CommitteeMember), existence fails next: 404 ERR_NOT_FOUND for an unknown appeal id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sap/appeals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/decide", payload: { decision: "DENIED", rationale: "no such appeal" }, as: CommitteeMember, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_FOUND (404)"]

      - name: appeal_without_documents_rejected
