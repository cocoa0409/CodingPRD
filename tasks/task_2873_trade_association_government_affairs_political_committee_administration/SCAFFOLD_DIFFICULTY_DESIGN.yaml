        grounds:
          - validations[priority=9].error_id
          - entities.PolicyCommittee.fields.roster_state
          - state_machines.PolicyPosition.transitions[CONSENSUS_REACHED->ADOPTED]
        distinguishing_aspect: |
          The blocker lives on a different entity than the one being transitioned, and the two roster gates are
          deliberately asymmetric: open-ballot only needs roster_state != FORMING (so an IMPAIRED committee CAN
          ballot and CAN reach consensus) while adopt needs the stricter QUORATE. The position is therefore stuck in
          a legal CONSENSUS_REACHED state that no amount of voting can advance.
        test_recipe:
          setup:
            - "Three ASSOCIATE members (TIER_WEIGHT 1 each) seated on one committee, so seat_count 3 >= MIN_SEATS but total_voting_weight 3 < MIN_ROSTER_WEIGHT 6 and roster_state is IMPAIRED."
            - "One position balloted to consensus with SUPPORT 2 / OPPOSE 1: quorum_pct 100.00 and consensus_pct 66.67, status CONSENSUS_REACHED."
