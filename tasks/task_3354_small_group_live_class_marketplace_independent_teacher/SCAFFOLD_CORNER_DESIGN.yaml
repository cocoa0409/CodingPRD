              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada_s1: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/submit-sample"
              payload: { teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada_s2: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/review"
              payload: { stage: "SAMPLE", verdict: "PASS" }
              as: TeacherReviewer
              as_user_id: "rev_1"
              captures: { app_ada_s3: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/approve"
              payload: {}
              as: TeacherReviewer
              as_user_id: "rev_1"
              captures: { t_ada: $.data.id }
            - call: "POST /outschool/teachers/${t_ada}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { t_ada_status: $.data.status }
            - call: "POST /outschool/class-listings"
              payload: { teacher_id: "${t_ada}", title: "Algebra Club", format: "ONE_TIME", min_age: 8, max_age: 12, max_learners: 6, list_price_cents: 2000 }
              as: Teacher
              as_user_id: "${t_ada}"
              captures: { l_1: $.data.id }
            - call: "POST /outschool/class-listings/${l_1}/policy-review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { l_1_review: $.data.content_review_state }
            - call: "POST /outschool/class-listings/${l_1}/publish"
              payload: {}
              as: Teacher
              as_user_id: "${t_ada}"
            - call: "POST /outschool/class-listings/${l_1}/sections"
              payload: { timezone: "America/New_York", start_utc: "2026-11-05T14:00:00Z", end_utc: "2026-11-05T16:00:00Z", min_learners: 1, capacity: 6 }
              as: Teacher
              as_user_id: "${t_ada}"
              captures: { s_1: $.data.id }
            - call: "POST /outschool/class-listings/${l_1}/sections/${s_1}/open"
              payload: {}
              as: Teacher
              as_user_id: "${t_ada}"
            - call: "POST /outschool/class-listings/${l_1}/sections/${s_1}/cancel"
              payload: {}
              as: Teacher
              as_user_id: "${t_ada}"
              captures: { s_1_outcome: $.data.outcome }
          trigger:
            - call: "POST /outschool/class-listings/${l_1}/sections/${s_1}/cancel"
              payload: {}
              as: Teacher
              as_user_id: "${t_ada}"
              captures: { err_recancel: $.data.error_id }
          assert:
            - "Section.${s_1}.status == CANCELLED"
            - "Section.${s_1}.outcome == CANCELLED_BY_TEACHER"
            - "The second cancellation returns error_id ERR_INVALID_STATE"
            - "Section.${s_1}.outcome is still CANCELLED_BY_TEACHER, so the sealed outcome was not rewritten"

      - name: confirm_enrollment_before_min_enrollment_met_rejected
