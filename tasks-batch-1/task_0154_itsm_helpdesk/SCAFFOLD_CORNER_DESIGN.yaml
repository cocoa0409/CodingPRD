# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# IT Service Management Helpdesk — Expert band. Breadth probe over §1.1–§1.7.
# Same seven-point per-instance contract as §1.8. Names unique across both files.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_ticket_minimal_fields_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Ticket
          - endpoints[POST /tickets]
        distinguishing_aspect: |
          POST /tickets with only short_description + category_id returns 201; priority defaults from
          Category.default_priority (P3), lifecycle_state=NEW, sla_state=RUNNING, assignment_group_id set from category.
        test_recipe:
          setup:
            - "A category default_priority=P3 wired to a policy and group."
          setup_api_calls:
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "G" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "C", default_priority: "P3", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /tickets"
              payload: { short_description: "Need help", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-c1"
              captures: { tkt_id: $.data.id, pr: $.data.priority, st: $.data.lifecycle_state }
          assert:
            - "HTTP 201"
            - "Ticket.${tkt_id}.priority == P3 (default from category)"
            - "Ticket.${tkt_id}.lifecycle_state == NEW"
            - "Ticket.${tkt_id}.sla_state == RUNNING"
            - "Ticket.${tkt_id}.assignment_group_id == ${grp_id}"
            - "Ticket.${tkt_id}.reopen_count == 0"

      - name: get_ticket_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints[GET /tickets/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /tickets/{random-uuid} returns ERR_NOT_FOUND 404; no body data fields."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /tickets/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: Agent
              as_user_id: "agent-c"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_category_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Category
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /categories without default_priority -> ERR_VALIDATION 400 (required input field missing)."
        test_recipe:
          setup: ["A policy and group exist for the FK fields."]
          setup_api_calls:
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "G" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
          trigger:
            - call: "POST /categories"
              payload: { name: "Bad", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_VALIDATION"

      - name: create_ticket_with_bad_category_fk_returns_fk_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Ticket.fields.category_id
          - errors[ERR_FK_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "POST /tickets with a category_id that does not resolve -> ERR_FK_NOT_FOUND 404."
        test_recipe:
          setup: ["No category with the supplied id."]
          setup_api_calls: []
          trigger:
            - call: "POST /tickets"
              payload: { short_description: "Orphan", category_id: "00000000-0000-4000-8000-0000000000bb" }
              as: Requester
              as_user_id: "req-c2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_FK_NOT_FOUND"

      - name: ticket_computed_queue_depth_reflects_open_tickets
        claim_type: Computed Fields
        grounds:
          - entities.AssignmentGroup.fields.queue_depth
          - endpoints[GET /assignment-groups/{id}]
        distinguishing_aspect: "queue_depth is server-computed: a group with two NEW tickets reports queue_depth==2; client-supplied queue_depth is ignored."
        test_recipe:
          setup: ["A group; two tickets opened into it."]
          setup_api_calls:
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "QD" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "QDc", default_priority: "P3", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "q1", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-c3"
            - call: "POST /tickets"
              payload: { short_description: "q2", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-c3"
          trigger:
            - call: "GET /assignment-groups/${grp_id}"
              payload: {}
              as: Agent
              as_user_id: "agent-c"
              captures: { qd: $.data.queue_depth }
          assert:
            - "AssignmentGroup.${grp_id}.queue_depth == 2"

      - name: list_tickets_paginated_envelope_has_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /tickets]
        distinguishing_aspect: "GET /tickets?limit=1 returns array response with pagination total_count and has_more=true when more than one ticket exists."
        test_recipe:
          setup: ["Two tickets in one category."]
          setup_api_calls:
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "PG2" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "PG2c", default_priority: "P3", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "p1", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-c4"
            - call: "POST /tickets"
              payload: { short_description: "p2", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-c4"
          trigger:
            - call: "GET /tickets"
              payload: { limit: 1, category_id: "${cat_id}" }
              as: Agent
              as_user_id: "agent-c"
          assert:
            - "response_type == array"
            - "meta pagination total_count == 2, has_more == true, returned data length == 1"

      - name: create_asset_duplicate_tag_returns_duplicate_asset_tag
        claim_type: Type Constraints
        grounds:
          - entities.Asset.fields.asset_tag
          - errors[ERR_DUPLICATE_ASSET_TAG]
          - validations[priority=15]
        distinguishing_aspect: "Two assets with the same asset_tag -> second POST /assets returns ERR_DUPLICATE_ASSET_TAG 409."
        test_recipe:
          setup: ["One asset with tag DUP-1 exists."]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_tag: "DUP-1", kind: "SERVER" }
              as: PlatformAdmin
          trigger:
            - call: "POST /assets"
              payload: { asset_tag: "DUP-1", kind: "LAPTOP" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_DUPLICATE_ASSET_TAG"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: start_ticket_from_new_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Ticket.ASSIGNED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /tickets/{id}/start on a NEW ticket (not yet ASSIGNED) -> ERR_INVALID_STATE 409; no first response recorded."
        test_recipe:
          setup: ["A NEW ticket, never assigned."]
          setup_api_calls:
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "S1" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "S1c", default_priority: "P3", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "S1t", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-c5"
              captures: { tkt_id: $.data.id }
          trigger:
            - call: "POST /tickets/${tkt_id}/start"
              payload: {}
              as: Agent
              as_user_id: "agent-c"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: cancel_resolved_ticket_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Ticket.NEW_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /tickets/{id}/cancel is only valid from NEW; a RESOLVED ticket cancel -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A ticket resolved (terminal-ish RESOLVED, not NEW)."]
          setup_api_calls:
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "S2" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "S2c", default_priority: "P3", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "S2t", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-c6"
              captures: { tkt_id: $.data.id }
            - call: "POST /tickets/${tkt_id}/assign"
              payload: { assignee_user_id: "agent-c6" }
              as: Agent
              as_user_id: "agent-c6"
            - call: "POST /tickets/${tkt_id}/start"
              payload: {}
              as: Agent
              as_user_id: "agent-c6"
            - call: "POST /tickets/${tkt_id}/resolve"
              payload: {}
              as: Agent
              as_user_id: "agent-c6"
          trigger:
            - call: "POST /tickets/${tkt_id}/cancel"
              payload: {}
              as: Requester
              as_user_id: "req-c6"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: implement_change_from_pending_cab_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ChangeRequest.APPROVED_to_IMPLEMENTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /change-requests/{id}/implement is valid only from APPROVED; from PENDING_CAB -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A MEDIUM-risk change submitted to CAB (PENDING_CAB), not yet approved."]
          setup_api_calls:
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "S3" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "S3c", default_priority: "P2", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "S3t", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-c7"
              captures: { tkt_id: $.data.id }
            - call: "POST /change-requests"
              payload: { title: "S3 CR", ticket_id: "${tkt_id}", risk: "MEDIUM" }
              as: ChangeManager
              as_user_id: "cm-c7"
              captures: { cr_id: $.data.id }
            - call: "POST /change-requests/${cr_id}/submit"
              payload: {}
              as: ChangeManager
              as_user_id: "cm-c7"
          trigger:
            - call: "POST /change-requests/${cr_id}/implement"
              payload: {}
              as: ChangeManager
              as_user_id: "cm-c7"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: retire_already_retired_asset_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Asset.OPERATIONAL_to_RETIRED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "RETIRED is terminal for Asset; a second POST /assets/{id}/retire -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["An asset retired (status RETIRED) with no incidents."]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_tag: "RET-1", kind: "NETWORK_DEVICE" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/retire"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /assets/${asset_id}/retire"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: known_errors_promotion_published_true_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Problem.ROOT_CAUSE_IDENTIFIED_to_KNOWN_ERROR
          - entities.KnownError.fields.published
          - endpoints[GET /problems/{id}/known-errors]
        distinguishing_aspect: "POST /problems/{id}/known-errors creates a KnownError with published=true and advances Problem to KNOWN_ERROR; the record is discoverable via the sub-resource GET."
        test_recipe:
          setup: ["A problem advanced to ROOT_CAUSE_IDENTIFIED."]
          setup_api_calls:
            - call: "POST /problems"
              payload: { title: "KE root", owner_user_id: "agent-c8" }
              as: Agent
              as_user_id: "agent-c8"
              captures: { prob_id: $.data.id }
            - call: "POST /problems/${prob_id}/identify-root-cause"
              payload: {}
              as: Agent
              as_user_id: "agent-c8"
          trigger:
            - call: "POST /problems/${prob_id}/known-errors"
              payload: { symptom: "blue screen", workaround: "rollback driver" }
              as: Agent
              as_user_id: "agent-c8"
              captures: { ke_id: $.data.id, pub: $.data.published }
            - call: "GET /problems/${prob_id}/known-errors"
              payload: {}
              as: Agent
              as_user_id: "agent-c8"
          assert:
            - "KnownError.${ke_id}.published == true"
            - "Problem.${prob_id}.state == KNOWN_ERROR"
            - "GET /problems/${prob_id}/known-errors returns an array containing ${ke_id}"

      - name: deflection_at_open_cancels_ticket_and_bumps_counts
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Ticket.NEW_to_CANCELLED
          - entities.Ticket.fields.deflected
          - entities.KbArticle.fields.deflection_count
        distinguishing_aspect: "POST /tickets with kb_article_id + accept_deflection=true opens then auto-CANCELS the ticket (deflected=true) and increments KbArticle.deflection_count and view_count."
        test_recipe:
          setup: ["A category and a KB article in that category."]
          setup_api_calls:
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "DF" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "DFc", default_priority: "P3", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /kb-articles"
              payload: { title: "Reset password", category_id: "${cat_id}", body: "Use the portal." }
              as: Agent
              as_user_id: "agent-c9"
              captures: { kb_id: $.data.id }
          trigger:
            - call: "POST /tickets"
              payload: { short_description: "Forgot password", category_id: "${cat_id}", kb_article_id: "${kb_id}", accept_deflection: true }
              as: Requester
              as_user_id: "req-c9"
              captures: { tkt_id: $.data.id, defl: $.data.deflected, st: $.data.lifecycle_state }
            - call: "GET /kb-articles/${kb_id}"
              payload: {}
              as: Agent
              as_user_id: "agent-c9"
              captures: { dc: $.data.deflection_count }
          assert:
            - "Ticket.${tkt_id}.lifecycle_state == CANCELLED"
            - "Ticket.${tkt_id}.deflected == true"
            - "KbArticle.${kb_id}.deflection_count == 1"
            - "KbArticle.${kb_id}.view_count == 1"

      - name: response_sla_breach_on_late_start
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SlaTimer.RUNNING_to_RESPONSE_BREACHED
          - calculations.sla_clock_eval
        distinguishing_aspect: "Starting work after response_due_at (clock advanced +65 on a P3 60-min response window) sets sla_state=RESPONSE_BREACHED."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; P3 ticket ASSIGNED; response_due = +60 min; clock advanced to +65."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "RB" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "RBc", default_priority: "P3", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "late", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-c10"
              captures: { tkt_id: $.data.id }
            - call: "POST /tickets/${tkt_id}/assign"
              payload: { assignee_user_id: "agent-c10" }
              as: Agent
              as_user_id: "agent-c10"
            - call: "POST /_clock/advance"
              payload: { minutes: 65 }
              as: PlatformAdmin
          trigger:
            - call: "POST /tickets/${tkt_id}/start"
              payload: {}
              as: Agent
              as_user_id: "agent-c10"
              captures: { sla: $.data.sla_state }
          assert:
            - "Ticket.${tkt_id}.sla_state == RESPONSE_BREACHED"
            - "Ticket.${tkt_id}.lifecycle_state == IN_PROGRESS"

      - name: resolve_sla_breach_one_minute_past_due
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SlaTimer.RUNNING_to_RESOLVE_BREACHED
          - calculations.sla_clock_eval
        distinguishing_aspect: "Resolving at +241 min on a P3 240-min resolve window (one minute past the inclusive boundary) sets sla_state=RESOLVE_BREACHED (contrast with the §1.8 inclusive-MET-at-240 boundary instance)."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; P3 ticket IN_PROGRESS; resolve_due = +240; clock advanced to +241."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "RBR" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "RBRc", default_priority: "P3", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "overdue", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-c11"
              captures: { tkt_id: $.data.id }
            - call: "POST /tickets/${tkt_id}/assign"
              payload: { assignee_user_id: "agent-c11" }
              as: Agent
              as_user_id: "agent-c11"
            - call: "POST /tickets/${tkt_id}/start"
              payload: {}
              as: Agent
              as_user_id: "agent-c11"
            - call: "POST /_clock/advance"
              payload: { minutes: 241 }
