          - state_machines.PublisherAgreement.COMPUTED_to_STALE
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_opt_out_grant_four_hops_to_at_risk_and_stale_reconciliation
          rationale: "All four hops of the opt-out grant cascade - charge, ledger and student balance, section AT_RISK, agreement STALE - are asserted end to end in one request there, alongside the drop and rebill cascades."

