            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
          trigger:
            - call: "POST /groups/${grp_id}/factual-reports/${rpt_id}/verify"
              payload: {}
              as: IIC
              as_user_id: "iic-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_REPORT_STATE_INVALID"
            - "GET /groups/${grp_id} shows the report still VERIFIED with verified_at == 2026-09-01T00:00:00Z"

      - name: complete_group_without_verified_report_returns_not_completable
        claim_type: Triggerable
        grounds:
          - errors.ERR_GROUP_NOT_COMPLETABLE
          - state_machines.InvestigativeGroup.ACTIVE_to_COMPLETE
        distinguishing_aspect: "Group completion is an aggregate gate: a group with a SEATED seat but only a SUBMITTED (never verified) report fails completion with 422 ERR_GROUP_NOT_COMPLETABLE — chairman, phase, and seating all satisfied, only the verified-report leg fails."
        test_recipe:
