  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: not_candidate_beats_device_not_indicated_safety_pair
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Two business_safety checks on start-trial: ERR_NOT_A_CANDIDATE (priority 7) wins over
          ERR_DEVICE_NOT_INDICATED (priority 8) when an evaluation is NORMAL AND the device's
          min_severity could not be indicated anyway — pair is business_safety(candidate) vs
          business_safety(indication).
        test_recipe:
          setup:
            - "Clock 2026-03-01. A FINALIZED evaluation ptag=20 (NORMAL, candidate=false)."
            - "A DRAFT order on a min_severity=PROFOUND device that would also fail indication."
          setup_api_calls:
