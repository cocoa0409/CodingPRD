              captures: { doc_status: $.data.status, eff: $.data.effective_status }
          assert:
            - "HTTP status is 200, IdentityDocument.${doc_id}.status == VERIFIED and verified_at == 2026-05-01T00:00:00.000Z"
            - "IdentityDocument.${doc_id}.effective_status == VALID"
            - "GET /members/${owner_id}/identity-documents returns total_count == 1"

  # =========================================================================
  # Section 8 — Cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_profile_version_blocks_second_identifier_add
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[identifier-add-stale-profile]
          - errors[ERR_STALE_PROFILE_VERSION]
          - validations[priority=17]
        distinguishing_aspect: "Two strictly sequential identifier adds: the first advances MonitoredProfile.version from 1 to 2, and the second still carrying expected_profile_version 1 is rejected with ERR_STALE_PROFILE_VERSION (412)."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one DRAFT profile at version 1."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, pv1: $.data.version }
          trigger:
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "one@example.com", expected_profile_version: "${pv1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { ident1: $.data.id }
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "two@example.com", expected_profile_version: "${pv1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "The first add returns HTTP 201 and MonitoredProfile.${prof_id}.version == 2"
            - "The second add returns HTTP 412 with data.error_id == ERR_STALE_PROFILE_VERSION"
            - "GET /monitored-profiles/${prof_id}/identifiers returns total_count == 1"
            - "Re-reading the profile and resending with the fresh version succeeds, giving total_count == 2"

      - name: occ_stale_account_version_blocks_second_member_invite
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[member-invite-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
        distinguishing_aspect: "Member invites legitimately succeed one after another under the cap, so only OCC catches the second invite that still carries the pre-invite Account.version."
        test_recipe:
          setup:
            - "FAMILY plan (max_members 4), ACTIVE account at version 1."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id, av1: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/members"
              payload: { email: "m1@example.com", full_name: "M One", role_in_family: "ADULT", expected_account_version: "${av1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /accounts/${acct_id}/members"
              payload: { email: "m2@example.com", full_name: "M Two", role_in_family: "ADULT", expected_account_version: "${av1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "The first invite returns HTTP 201 and Account.${acct_id}.version == 2"
            - "The second invite returns HTTP 412 with data.error_id == ERR_STALE_ACCOUNT_VERSION"
            - "GET /accounts/${acct_id}/members returns total_count == 2 (primary plus m1) — the stale invite created nothing"
            - "The roster still has room, proving ERR_MEMBER_CAP_EXCEEDED was not the blocker"

      - name: occ_stale_addon_version_blocks_second_seat_bind
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[device-seat-bind-stale-addon]
          - errors[ERR_STALE_ADDON_VERSION]
        distinguishing_aspect: "With seats_total 3 the second bind would legitimately succeed, so the rejection can only come from the stale expected_addon_version, not from ERR_SEAT_CAPACITY_EXCEEDED."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one ACTIVE VPN add-on with seats_total 3 at version 1."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /accounts/${acct_id}/addons"
              payload: { addon_type: "VPN", seats_total: 3, per_seat_fee_cents: 300 }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { addon_id: $.data.id, av1: $.data.version }
          trigger:
            - call: "POST /device-seats"
              payload: { addon_id: "${addon_id}", member_id: "${owner_id}", device_label: "Laptop", expected_addon_version: "${av1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { seat1: $.data.id }
            - call: "POST /device-seats"
              payload: { addon_id: "${addon_id}", member_id: "${owner_id}", device_label: "Tablet", expected_addon_version: "${av1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "The first bind returns HTTP 201 and AddOnSubscription.${addon_id}.version == 2 with seats_bound == 1"
            - "The second bind returns HTTP 412 with data.error_id == ERR_STALE_ADDON_VERSION"
            - "AddOnSubscription.${addon_id}.seats_bound == 1 and seats_available == 2 — capacity was never the issue"
            - "GET /device-seats?addon_id=${addon_id} returns total_count == 1"

      - name: occ_stale_account_version_blocks_second_plan_change
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-change-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - calculations.plan_proration_amount
        distinguishing_aspect: "A later plan change legitimately supersedes an earlier one, so only the stale expected_account_version stops the second call; the cycle keeps exactly the proration booked by the first."
        test_recipe:
          setup:
            - "A SOLO plan, a FAMILY plan and a FAMILY_PLUS plan; an ACTIVE account on SOLO at version 1."
            - "Clock at 2026-05-11T00:00:00Z, so remaining_days is 20."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "SOLO", name: "Solo Shield", monthly_fee_cents: 1200, max_members: 1, profile_quota_per_cycle: 1, scan_quota_per_cycle: 4, removal_quota_per_cycle: 20, per_member_removal_subcap: 20 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_solo_id: $.data.id }
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /plans"
              payload: { tier: "FAMILY_PLUS", name: "Family Plus", monthly_fee_cents: 3400, max_members: 6, profile_quota_per_cycle: 8, scan_quota_per_cycle: 24, removal_quota_per_cycle: 120, per_member_removal_subcap: 40 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_plus_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_solo_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id, av1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /accounts/${acct_id}/plan-changes"
              payload: { new_plan_id: "${plan_family_id}", change_kind: "UPGRADE", expected_account_version: "${av1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { av2: $.data.version }
            - call: "POST /accounts/${acct_id}/plan-changes"
              payload: { new_plan_id: "${plan_plus_id}", change_kind: "UPGRADE", expected_account_version: "${av1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "The first change returns HTTP 200 with Account.${acct_id}.plan_id == ${plan_family_id} and version == 2"
            - "The second change returns HTTP 412 with data.error_id == ERR_STALE_ACCOUNT_VERSION"
            - "Account.${acct_id}.plan_id is still ${plan_family_id} and version is still 2"
            - "The OPEN cycle has proration_charge_cents == 660 exactly — the rejected second change booked nothing"
            - "Resending with expected_account_version 2 succeeds and raises proration_charge_cents to 1460 (660 + round_half_up(1200/30) * 20 = 660 + 40 * 20)"

      - name: rate_threshold_scan_quota_boundary_at_the_last_unit
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=44]
          - calculations.entitlement_remaining
          - errors[ERR_SCAN_QUOTA_EXCEEDED]
        distinguishing_aspect: "The fiscal rung compares scan_units_remaining >= 1: with scan_quota_per_cycle 2 the second scan is admitted at remaining 1 and the third is refused at remaining 0, and cancelling one scan immediately re-opens the threshold."
        test_recipe:
          setup:
            - "A plan with scan_quota_per_cycle 2; ACTIVE account; ACTIVE profile with identifier."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "SOLO", name: "Solo Two Scans", monthly_fee_cents: 900, max_members: 1, profile_quota_per_cycle: 1, scan_quota_per_cycle: 2, removal_quota_per_cycle: 5, per_member_removal_subcap: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, pv1: $.data.version }
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "dana@example.com", expected_profile_version: "${pv1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles/${prof_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "INITIAL" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan1_id: $.data.id }
          trigger:
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "RECURRING" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan2_id: $.data.id }
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "RECURRING" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { err: $.data.error_id }
            - call: "POST /scan-runs/${scan1_id}/cancel"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "RECURRING" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan3_id: $.data.id }
          assert:
            - "The second scan is admitted while scan_units_remaining was exactly 1, leaving remaining 0"
            - "The third scan returns HTTP 409 with data.error_id == ERR_SCAN_QUOTA_EXCEEDED"
            - "After cancelling scan1: Account.${acct_id}.scan_units_released == 1 and scan_units_remaining == 1"
            - "The retried create then succeeds: ScanRun.${scan3_id}.status == QUEUED and Account.${acct_id}.scan_units_remaining == 0"
            - "Account.${acct_id}.scan_units_granted == 2 and scan_units_consumed == 3 throughout the final observation"

  # =========================================================================
  # Section 9 — Consistency model
  # =========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_cascade_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - entities.Account.fields.scan_units_remaining
        distinguishing_aspect: "The consistency model is immediate: the suspend response body itself already carries the post-cascade scan_units_remaining, so no second read is needed to observe the ledger movement three hops down the chain."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, ACTIVE profile with identifier, one QUEUED scan holding a SCAN unit."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, pv1: $.data.version }
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "dana@example.com", expected_profile_version: "${pv1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles/${prof_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "INITIAL" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/suspend"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inline_remaining: $.data.scan_units_remaining, inline_released: $.data.scan_units_released }
          assert:
            - "The suspend response body itself reports scan_units_released == 1 and scan_units_remaining == 12"
            - "A subsequent GET /accounts/${acct_id} reports identical values — nothing is reconciled later"
            - "ScanRun.${scan_id}.status == CANCELLED already in the first read after the trigger"
            - "MonitoredProfile.${prof_id}.status == PAUSED already in the first read after the trigger"
