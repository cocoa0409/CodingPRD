  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: screening_room_requires_exactly_thirty_minutes_turnaround_on_both_sides
        grounds:
          - calculations.screening_room_occupancy
          - calculations.screening_room_occupancy.constants.TURNAROUND_MINUTES
          - validations[priority=80]
          - entities.ScreeningSlot.fields.room_number
          - entities.ScreeningSlot.fields.status
          - state_machines.ScreeningSlot.HELD_to_CANCELLED
          - errors.ERR_SCREENING_ROOM_CONFLICT
        distinguishing_aspect: |
          Resource = (market_id, room_number) with a BUFFERED interval rule: a mandatory 30-minute
          turnaround is added to both sides of every HELD/CONFIRMED occupation, so back-to-back
          booking is illegal. The probe set pins each edge: a 20-minute gap is rejected, a 29-minute
          gap is rejected, a gap of exactly 30 minutes is accepted, a gap of exactly 30 minutes on
          the EARLIER side is accepted, and a zero-gap slot ending precisely when the incumbent
          starts is rejected. The same window is free on room 3, and cancelling the incumbent makes
          its own window immediately re-bookable. Simple overlap detection accepts the 20- and
          29-minute probes, which is the falsifier.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; the film only needs to reach PACKAGING to satisfy priority 52 for slot creation."
            - "Market AFM 2026 runs 2026-11-05T00:00:00Z to 2026-11-11T23:59:59Z with 4 screening rooms and 10 meeting tables, status OPEN."
            - "TURNAROUND_MINUTES is 30."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/films/${film_id}/agency-agreements"
              payload: { commission_pct: 0.10, expense_cap_usd: 75000.00, term_months: 24, term_start_date: "2026-08-01T00:00:00Z" }
              as: HeadOfSales
              captures: { agr_id: $.data.id }
            - call: "POST /film-sales/agency-agreements/${agr_id}/state"
              payload: { to_status: "EXECUTED" }
              as: HeadOfSales
              as_user_id: "hos-signer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "PACKAGING" }
              as: PlatformAdmin
            - call: "POST /film-sales/markets"
              payload: { name: "AFM 2026", city: "Los Angeles", start_date: "2026-11-05T00:00:00Z", end_date: "2026-11-11T23:59:59Z", screening_room_count: 4, meeting_table_count: 10 }
              as: PlatformAdmin
              captures: { market_id: $.data.id }
            - call: "POST /film-sales/markets/${market_id}/state"
              payload: { to_status: "OPEN" }
              as: PlatformAdmin
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "${market_id}", film_id: "${film_id}", room_number: 2, start_at: "2026-11-06T10:00:00Z", end_at: "2026-11-06T12:00:00Z", slot_type: "BUYER_SCREENING", capacity: 120 }
              as: SalesAgent
              captures: { slot_base_id: $.data.id }
          trigger:
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "${market_id}", film_id: "${film_id}", room_number: 2, start_at: "2026-11-06T12:20:00Z", end_at: "2026-11-06T14:00:00Z", slot_type: "BUYER_SCREENING", capacity: 100 }
              as: SalesAgent
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "${market_id}", film_id: "${film_id}", room_number: 2, start_at: "2026-11-06T12:29:00Z", end_at: "2026-11-06T14:00:00Z", slot_type: "BUYER_SCREENING", capacity: 100 }
              as: SalesAgent
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "${market_id}", film_id: "${film_id}", room_number: 2, start_at: "2026-11-06T12:30:00Z", end_at: "2026-11-06T14:00:00Z", slot_type: "BUYER_SCREENING", capacity: 100 }
              as: SalesAgent
              captures: { slot_after_id: $.data.id }
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "${market_id}", film_id: "${film_id}", room_number: 2, start_at: "2026-11-06T09:00:00Z", end_at: "2026-11-06T10:00:00Z", slot_type: "PRESS", capacity: 40 }
              as: SalesAgent
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "${market_id}", film_id: "${film_id}", room_number: 2, start_at: "2026-11-06T08:00:00Z", end_at: "2026-11-06T09:30:00Z", slot_type: "PRESS", capacity: 40 }
              as: SalesAgent
              captures: { slot_before_id: $.data.id }
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "${market_id}", film_id: "${film_id}", room_number: 3, start_at: "2026-11-06T10:00:00Z", end_at: "2026-11-06T12:00:00Z", slot_type: "MARKET_PREMIERE", capacity: 300 }
              as: SalesAgent
              captures: { slot_room3_id: $.data.id }
            - call: "POST /film-sales/screening-slots/${slot_base_id}/state"
              payload: { to_status: "CANCELLED" }
              as: SalesAgent
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "${market_id}", film_id: "${film_id}", room_number: 2, start_at: "2026-11-06T10:00:00Z", end_at: "2026-11-06T12:00:00Z", slot_type: "BUYER_SCREENING", capacity: 120 }
              as: SalesAgent
              captures: { slot_rebook_id: $.data.id }
          assert:
            - "probe 1 (gap 20 minutes after the incumbent) → 409 with error_id ERR_SCREENING_ROOM_CONFLICT"
            - "probe 2 (gap 29 minutes, one minute short of the buffer) → 409 with error_id ERR_SCREENING_ROOM_CONFLICT"
            - "probe 3 (gap exactly 30 minutes) → 201 with ScreeningSlot.${slot_after_id}.status == HELD"
            - "probe 4 (ends exactly when the incumbent starts, gap 0) → 409 with error_id ERR_SCREENING_ROOM_CONFLICT — the buffer applies on the earlier side too"
            - "probe 5 (ends exactly 30 minutes before the incumbent starts) → 201 with ScreeningSlot.${slot_before_id}.status == HELD"
            - "probe 6 (identical window in room 3) → 201 with ScreeningSlot.${slot_room3_id}.room_number == 3 — the resource is the (market, room) pair"
            - "probe 7 cancels the incumbent → ScreeningSlot.${slot_base_id}.status == CANCELLED"
            - "probe 8 (re-books the cancelled window byte for byte) → 201 with ScreeningSlot.${slot_rebook_id}.status == HELD, because CANCELLED slots leave the input set"
            - "GET /film-sales/screening-slots?market_id=${market_id}&room_number=2 returns exactly 4 rows: ${slot_base_id} CANCELLED plus ${slot_after_id}, ${slot_before_id} and ${slot_rebook_id} all HELD"

      - name: meeting_tables_allow_touching_windows_but_cap_buyer_minutes_at_exactly_240
        grounds:
          - calculations.meeting_table_occupancy
          - calculations.meeting_table_occupancy.constants.MEETING_MINUTES_CAP
          - validations[priority=81]
          - validations[priority=95]
          - entities.BuyerMeeting.fields.duration_minutes
          - state_machines.BuyerMeeting.SCHEDULED_to_CANCELLED
          - state_machines.BuyerMeeting.SCHEDULED_to_NO_SHOW
          - errors.ERR_MEETING_MINUTES_CAP_EXCEEDED
        distinguishing_aspect: |
          The same market, a different resource geometry and a second, non-geometric dimension. Here
          the intervals are half-open with NO buffer, so a meeting starting exactly when another ends
          on the SAME table is legal — the opposite outcome to the screening-room probe with gap 0 —
          while one buyer may never sit at two tables in overlapping windows. On top of that sits an
          aggregate: booked minutes per (market, buyer) may reach exactly 240 but not 241, CANCELLED
          meetings return their minutes to the pool, and NO_SHOW meetings do not. A single overlap
          predicate shared with the room rule cannot satisfy both instances.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; film at PACKAGING; market AFM 2026 OPEN with 10 meeting tables."
            - "Buyers Rhein Films (AAA/ACTIVE) and Nordic Media (AA/ACTIVE) both exist under territory DE."
            - "Rhein already holds table 3 from 2026-11-06T10:00:00Z to 11:30:00Z — 90 booked minutes."
            - "MEETING_MINUTES_CAP is 240."
