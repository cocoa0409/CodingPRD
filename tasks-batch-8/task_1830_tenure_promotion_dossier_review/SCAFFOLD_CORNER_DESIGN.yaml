            - { call: "POST /api/dossier-items/${al_r2}/submit", as: Candidate, as_user_id: "${cand_al}" }
            - { call: "POST /api/dossier-items/${al_r3}/submit", as: Candidate, as_user_id: "${cand_al}" }
            - { call: "POST /api/dossier-items/${al_s1}/submit", as: Candidate, as_user_id: "${cand_al}" }
            - { call: "POST /api/cases/${case_al}/submit-dossier", as: Candidate, as_user_id: "${cand_al}", captures: { case_al_v8: $.data.version } }
            - { call: "POST /api/reviewers", payload: { full_name: "Rev AL", institution: "MIT", email: "ral@mit.edu", expertise_area: "CS" }, as: ProvostOfficer, captures: { rev_al: $.data.id } }
          trigger:
            - { call: "POST /api/invitations", payload: { case_id: "${case_al}", reviewer_id: "${rev_al}", review_window_start: "2026-08-10", review_window_end: "2026-09-10", is_arm_length: true, declared_coauthor: true, expected_case_version: "${case_al_v8}" }, as: ProvostOfficer, captures: { err_al1: $.data.error_id } }
            - { call: "POST /api/invitations", payload: { case_id: "${case_al}", reviewer_id: "${rev_al}", review_window_start: "2026-08-10", review_window_end: "2026-09-10", is_arm_length: false, declared_coauthor: false, expected_case_version: "${case_al_v8}" }, as: ProvostOfficer, captures: { err_al2: $.data.error_id } }
