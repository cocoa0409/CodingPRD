  - name: a_state_gate_and_a_fiscal_gate_violated_together_report_the_state_gate
    claim_type: priority_conflict
    grounds:
    - validations[priority=13]
    - validations[priority=43]
    excluded_because:
      difficulty_instance: state_gate_outranks_fiscal_gate_on_package_submit
      rationale: That instance violates both on one submit and asserts the state error, then clears it to expose the fiscal
        error.
  - name: interval_sanity_outranks_the_quiet_buffer_on_a_change_request
    claim_type: priority_conflict
    grounds:
    - validations[priority=22]
    - validations[priority=27]
    excluded_because:
      difficulty_instance: window_sanity_outranks_change_window_buffer_on_change_request_create
      rationale: An inverted window that also breaches the 7-day buffer is asserted there to report ERR_WINDOW_INVALID first.
  - name: the_coverage_gate_outranks_the_budget_gate_on_submit
    claim_type: priority_conflict
    grounds:
    - validations[priority=36]
    - validations[priority=43]
    excluded_because:
      difficulty_instance: coverage_safety_gate_outranks_fiscal_gate_on_package_submit
