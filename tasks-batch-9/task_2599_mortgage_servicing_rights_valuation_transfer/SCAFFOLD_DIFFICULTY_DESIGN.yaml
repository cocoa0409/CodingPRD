  - rule_id: cross_entity_state_dependency
    instances:

      - name: settlement_blocked_by_a_sibling_approval_request_state
        grounds:
          - validations[priority=23]
          - validations[priority=13]
          - state_machines.PurchaseAgreement.transitions[PENDING_APPROVALS -> APPROVED]
          - state_machines.ApprovalRequest
          - entities.PurchaseAgreement.fields.approval_pending_count
          - errors[ERR_AGENCY_APPROVAL_PENDING]
        distinguishing_aspect: |
          The dependency runs from a PARENT to its own CHILD SET and is quantified over that set: the
          PurchaseAgreement cannot settle while ANY of its ApprovalRequest children is PENDING, and
          the parent's status is itself derived from the children by a join point (PENDING_APPROVALS
          -> APPROVED fires only when the last child is decided). One agency approval granted is not
          enough while the investor approval is outstanding, and the SAME settle request succeeds the
          moment the second child is decided — no field on the agreement is edited in between.
        test_recipe:
          setup:
            - "Fixture T is awarded, producing a DRAFTED PurchaseAgreement."
            - "Two ApprovalRequests are raised: (AGENCY, FNMA) and (INVESTOR, FNMA)."
            - "The agreement is submitted for approval, then only the AGENCY request is decided APPROVED by ag-001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
