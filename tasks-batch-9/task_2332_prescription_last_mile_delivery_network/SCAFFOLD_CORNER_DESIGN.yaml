  # ===========================================================================
  - section: rbac
    instances:
      - name: a_write_with_a_missing_x_user_header_returns_unauthenticated
        claim_type: role_denial
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - roles.PharmacyOperator.exclusive_operations
        distinguishing_aspect: "Identity is carried entirely by X-User-ID, so its absence is a 401 that precedes every other check: the same order-creation body that is otherwise perfectly valid, and a pure read as well, both fail before role, scope or business rules are consulted."
        test_recipe:
          setup:
            - "Reference data exists so the request body is fully valid; only the caller identity is missing."
            - "Both calls below are issued with the X-User-ID header omitted entirely."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {current_utc: "2026-08-03T09:00:00Z"}
              as: NetworkOps
            - call: "POST /health-plans"
              payload: {name: "Meridian Health", payer_type: "COMMERCIAL", member_cost_share_pct: 0.1}
              as: NetworkOps
              captures: { hp1_id: $.data.id }
            - call: "POST /plan-grants"
              payload: {health_plan_id: "${hp1_id}", benefit_year: 2026, grant_budget_cents: 100000, per_delivery_cap_cents: 150}
              as: NetworkOps
              captures: { g1_id: $.data.id }
            - call: "POST /pharmacies"
              payload: {name: "Cedar Rx", state_code: "WA", cold_chain_certified: true, controlled_license_tier: "CII_V", return_window_minutes: 240}
              as: NetworkOps
              captures: { ph1_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: {zone_code: "Z1", distance_band_miles: 6.4, base_fee_cents: 705, per_mile_cents: 123, cold_pack_fee_cents: 455, controlled_handling_fee_cents: 605, after_hours_fee_cents: 305, cold_chain_supported: true, controlled_delivery_allowed: true}
              as: NetworkOps
              captures: { z1_id: $.data.id }
            - call: "POST /patients"
              payload: {full_name: "Dana Reyes", date_of_birth: "1970-04-12", phone_last4: "4417", address_line: "881 Alder St", zone_code: "Z1", hipaa_consent_status: "GRANTED"}
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { pat1_id: $.data.id }
          trigger:
            # X-User-ID header omitted entirely
            - call: "POST /pharmacy-orders"
              payload: {pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 1, cold_chain_required: false, controlled_schedule: "NONE", total_rx_value_cents: 1000}
              as: PharmacyOperator
              captures: { e_write: $.data.error_id }
            # X-User-ID header omitted entirely
            - call: "GET /pharmacy-orders"
              payload: {}
              as: PharmacyOperator
              captures: { e_read: $.data.error_id }
          assert:
            - "Write without the header: status 401 with ${e_write} == ERR_UNAUTHENTICATED"
            - "Read without the header: status 401 with ${e_read} == ERR_UNAUTHENTICATED — reads are not anonymous either"
            - "The body was valid in every other respect, yet no PharmacyOrder was created: repeating the write with X-User-ID set to ${ph1_id} returns 201"
            - "An empty-string header is treated the same as an absent one: both are ERR_UNAUTHENTICATED, never ERR_INVALID_REQUEST"
      - name: a_pharmacy_operator_cannot_dispatch_settle_or_sweep_and_a_courier_cannot_reserve
        claim_type: role_denial
        grounds:
          - roles.PharmacyOperator.exclusive_operations
          - roles.NetworkOps.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The role split is bidirectional and non-hierarchical: the pharmacy that owns the order still cannot dispatch it, settle it or run the sweep, and the courier who will carry it cannot create the reservation — no role is a superset of another, so 403 lands in both directions on resources the caller legitimately owns."
