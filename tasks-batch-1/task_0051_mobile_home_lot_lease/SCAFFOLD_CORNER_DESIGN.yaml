      - name: conversion_tally_fail_keeps_park_owned
        claim_type: Conditional action
        grounds:
          - state_machines.ConversionVote.OPEN_to_FAILED
          - entities.Community.fields.ownership_model
        distinguishing_aspect: "Tally with yes_count(0)/eligible(1) < quorum 0.5 fails: vote FAILED, Community stays PARK_OWNED, lots unfreeze to OCCUPIED."
        test_recipe:
          setup:
            - "OPEN vote over CA community with one occupied(frozen) lot, no YES ballots, quorum 0.5"
