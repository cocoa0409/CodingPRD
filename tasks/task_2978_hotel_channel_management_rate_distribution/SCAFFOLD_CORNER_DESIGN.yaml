              payload: { channel_id: "${brand_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 2 }
              as: RevenueManager
          assert:
            - "Arrival 2026-09-11, 2 nights: HTTP 422 with data.error_id == ERR_MIN_STAY_NOT_MET - both windows cover the arrival date and effective_min_stay_nights is max(2, 3) == 3"
            - "Arrival 2026-09-10, 2 nights: HTTP 201 with reservation_state CONFIRMED and departure_date 2026-09-12 - only the plan-agnostic 2-night window covers 2026-09-10, and the 3-night window is ignored even though the stay runs into it"
