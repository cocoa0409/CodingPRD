scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: customer_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Customer.fields.penalty_delay_rule, entities.Customer.fields.current_exposure_cents]
        distinguishing_aspect: "Create returns 201 with server-minted id (typeless UUID), version 1, penalty_delay_rule defaulted to ADJUSTED, current_exposure_cents 0, credit_hold false, status ACTIVE."
        test_recipe:
          setup: ["empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id, v: $.data.version, rule: $.data.penalty_delay_rule, expo: $.data.current_exposure_cents, hold: $.data.credit_hold, st: $.data.status } }
          assert:
            - "c_id is a UUID without any type prefix; v == 1; rule == 'ADJUSTED'; expo == 0; hold == false; st == 'ACTIVE'"
      - name: customer_create_missing_required_credit_limit_returns_400
        claim_type: required_fields
        grounds: [entities.Customer.fields.credit_limit_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required credit_limit_cents yields 400 ERR_INVALID_REQUEST and no Customer is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mro/customers", payload: { name: "NoLimit", certificate_number: "AIR-X", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50 }, as: ShopManager, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_REQUEST' with HTTP 400"
      - name: unit_create_missing_required_owner_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ComponentUnit.fields.owner_customer_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "ownership=CUSTOMER without owner_customer_id is rejected; SHOP ownership must NOT carry an owner."
        test_recipe:
          setup:
            - "catalog part exists"
          setup_api_calls:
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-NO1", ownership: "CUSTOMER", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 100, cycles_since_overhaul: 100, manufactured_at: "2020-01-01" }, as: CustomerServiceRep, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_REQUEST' with HTTP 400 (owner_customer_id required iff ownership=CUSTOMER)"
      - name: unit_duplicate_serial_rejected
        claim_type: type_constraints
        grounds: [entities.ComponentUnit.fields.serial_number, "errors[ERR_DUPLICATE_SERIAL]"]
        distinguishing_aspect: "serial_number is globally unique; second registration with the same serial returns 409 ERR_DUPLICATE_SERIAL."
        test_recipe:
          setup: ["part exists; unit SN-DUP already registered"]
          setup_api_calls:
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-DUP", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 100, cycles_since_overhaul: 10, manufactured_at: "2020-01-01" }, as: CustomerServiceRep }
          trigger:
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-DUP", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 200, cycles_since_overhaul: 20, manufactured_at: "2021-01-01" }, as: CustomerServiceRep, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_DUPLICATE_SERIAL' with HTTP 409"
      - name: work_order_create_rejects_extra_status_field
        claim_type: system_fields
        grounds: [entities.WorkOrder.fields.status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "status is source:system; a client-supplied status field is an unknown input and is rejected 400 — clients cannot force an initial state."
        test_recipe:
          setup: ["customer, part, unit exist"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
          trigger:
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL", status: "CLOSED" }, as: CustomerServiceRep, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_REQUEST' with HTTP 400"
      - name: work_order_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_WORK_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown work-order id returns 404 ERR_WORK_ORDER_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mro/work-orders/00000000-0000-4000-8000-000000000000", payload: {}, as: ShopManager, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_WORK_ORDER_NOT_FOUND' with HTTP 404"
      - name: units_list_pagination_with_filters
        claim_type: listing
        grounds: [response_envelope.pagination_fields, entities.ComponentUnit]
        distinguishing_aspect: "Filtered list honors limit/offset over the filtered set: 3 SHOP units, limit 2 -> total_count 3 with has_more true; offset 2 -> one row, has_more false."
        test_recipe:
          setup: ["part exists; three SHOP pool units registered"]
          setup_api_calls:
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-P1", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 100, cycles_since_overhaul: 10, manufactured_at: "2020-01-01" }, as: CustomerServiceRep }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-P2", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 200, cycles_since_overhaul: 20, manufactured_at: "2020-02-01" }, as: CustomerServiceRep }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-P3", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 300, cycles_since_overhaul: 30, manufactured_at: "2020-03-01" }, as: CustomerServiceRep }
          trigger:
            - { call: "GET /mro/units", payload: { ownership: "SHOP", custody_status: "IN_POOL", limit: 2, offset: 0 }, as: ShopManager }
            - { call: "GET /mro/units", payload: { ownership: "SHOP", custody_status: "IN_POOL", limit: 2, offset: 2 }, as: ShopManager }
          assert:
            - "page 1: total_count == 3, has_more == true, 2 rows returned"
            - "page 2 (offset 2): total_count == 3, has_more == false, 1 row returned"
      - name: traceability_records_immutable_append_only
        claim_type: immutability
        grounds: [entities.TraceabilityRecord, state_machines.ComponentUnit]
        distinguishing_aspect: "TraceabilityRecord carries common_fields: false (id + created_at only, no version/updated_at); events append chronologically BIRTH then INDUCT and are never mutated by later transitions."
        test_recipe:
          setup: ["customer, part, unit registered (BIRTH event); work order created (INDUCT event)"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep }
          trigger:
            - { call: "GET /mro/units/${u1}/traceability", payload: {}, as: ShopManager, captures: { ev0: "$.data[0].event_type", ev1: "$.data[1].event_type" } }
          assert:
            - "ev0 == 'BIRTH' and ev1 == 'INDUCT' (chronological ascending by event_at then created_at)"
            - "each record exposes id and created_at only among common fields (no version, no updated_at)"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: teardown_complete_blocked_by_open_discrepancy
        claim_type: precondition_enforcement
        grounds: [state_machines.WorkOrder.TEARDOWN_IN_PROGRESS_to_AWAITING_QUOTE, "errors[ERR_OPEN_DISCREPANCIES]"]
        distinguishing_aspect: "teardown-complete with a card still OPEN is rejected; the work order stays in TEARDOWN_IN_PROGRESS and open_discrepancy_count stays 1."
        test_recipe:
          setup: ["work order in TEARDOWN_IN_PROGRESS with one OPEN discrepancy card (filed, never dispositioned)"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/discrepancies", payload: { finding_text: "Worn bearing", severity: "MAJOR" }, as: Technician, captures: { card: $.data.id, st: $.data.status } }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician, captures: { err: $.data.error_id } }
          assert:
            - "st == 'OPEN' (initial state on filing) and err == 'ERR_OPEN_DISCREPANCIES' with HTTP 409"
            - "GET /mro/work-orders/${wo} still shows status TEARDOWN_IN_PROGRESS and open_discrepancy_count == 1"
      - name: complete_repair_blocked_by_pending_mandatory_ad_then_passes
        claim_type: precondition_enforcement
        grounds: [state_machines.WorkOrder.REPAIR_IN_PROGRESS_to_READY_FOR_TEST, "errors[ERR_AD_COMPLIANCE_INCOMPLETE]", entities.DirectiveCompliance.fields.status]
        distinguishing_aspect: "Guarded transition: a PENDING mandatory AD compliance blocks complete-repair (403); recording COMPLIED unblocks it while a PENDING non-mandatory SB does NOT gate."
        test_recipe:
          setup:
            - "part PN-32-ACT carries mandatory AD 'AD-2026-32-01' and non-mandatory SB 'SB-32-100'; work order approved into REPAIR_IN_PROGRESS (two PENDING DirectiveCompliance rows auto-created at induction)"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/part-catalog/${p_id}/directives", payload: { directive_type: "AD", directive_number: "AD-2026-32-01", mandatory: true, description: "Actuator inspection" }, as: ShopManager }
            - { call: "POST /mro/part-catalog/${p_id}/directives", payload: { directive_type: "SB", directive_number: "SB-32-100", mandatory: false, description: "Optional seal upgrade" }, as: ShopManager }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q}" }, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1", captures: { err: $.data.error_id } }
            - { call: "POST /mro/work-orders/${wo}/directive-compliance", payload: { directive_number: "AD-2026-32-01", result: "COMPLIED", note: "Inspected per AD para (e)" }, as: Technician, captures: { dc_st: $.data.status } }
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1", captures: { wo_st: $.data.status } }
            - { call: "GET /mro/work-orders/${wo}/directive-compliances", payload: {}, as: ShopManager }
          assert:
            - "err == 'ERR_AD_COMPLIANCE_INCOMPLETE' with HTTP 403 while the mandatory AD is PENDING"
            - "dc_st == 'COMPLIED'; retry succeeds: wo_st == 'READY_FOR_TEST' even though SB 'SB-32-100' compliance remains PENDING (non-mandatory does not gate)"
      - name: quote_decline_return_path_cancels
        claim_type: valid_transition
        grounds: [state_machines.WorkOrder.QUOTE_SUBMITTED_to_CANCELLED]
        distinguishing_aspect: "Disposition RETURN_UNREPAIRED forks to CANCELLED: unit custody becomes AWAITING_SHIPMENT while condition_status stays UNSERVICEABLE (parallel dimensions move independently)."
        test_recipe:
          setup: ["work order quoted (QUOTE_SUBMITTED) for customer-owned UNSERVICEABLE unit"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "REPAIR" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 500000, parts_estimate_cents: 100000, scrap_option_ack: false }, as: CustomerServiceRep }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/quote-decline", payload: { disposition: "RETURN_UNREPAIRED" }, as: Customer, as_user_id: "${c_id}", captures: { st: $.data.status } }
            - { call: "GET /mro/units/${u1}", payload: {}, as: ShopManager, captures: { cust: $.data.custody_status, cond: $.data.condition_status } }
          assert:
            - "st == 'CANCELLED'; cust == 'AWAITING_SHIPMENT' and cond == 'UNSERVICEABLE' (unrepaired)"
      - name: quote_decline_scrap_requires_ber_flag
        claim_type: precondition_enforcement
        grounds: [state_machines.WorkOrder.QUOTE_SUBMITTED_to_BER_SCRAPPED, "errors[ERR_SCRAP_REQUIRES_BER]"]
        distinguishing_aspect: "Disposition SCRAP is rejected with ERR_SCRAP_REQUIRES_BER when ber_flag is false (estimate 3000000 < 6500000 threshold); the work order stays QUOTE_SUBMITTED."
        test_recipe:
          setup: ["work order quoted with non-BER estimates"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/quote-decline", payload: { disposition: "SCRAP" }, as: Customer, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_SCRAP_REQUIRES_BER' with HTTP 409; WorkOrder(${wo}).status remains 'QUOTE_SUBMITTED'"
      - name: closed_work_order_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WorkOrder]
        distinguishing_aspect: "From terminal CLOSED every trigger is rejected: a re-quote attempt returns ERR_WORK_ORDER_INVALID_STATE."
        test_recipe:
          setup: ["work order driven fully to CLOSED (invoice generated first)"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells", payload: { name: "CELL-A", supported_ata_chapters: ["32"], hourly_rate_cents: 100000 }, as: ShopManager, captures: { cell_id: $.data.id } }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo}", start_time: "2026-08-02T01:00:00Z", end_time: "2026-08-02T05:00:00Z" }, as: CustomerServiceRep }
