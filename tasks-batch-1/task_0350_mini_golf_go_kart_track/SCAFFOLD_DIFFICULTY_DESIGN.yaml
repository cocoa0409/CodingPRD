# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Mini-Golf & Go-Kart Track (Expert tier)
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.6.
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint; every ${var}
# is bound by an earlier captures: block; every formula-derived assert is a
# literal computed by code.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: booking_price_provisional_vs_final_diverges_on_window_flip
        grounds:
          - calculations.booking_price
          - entities.Booking.fields.gross_price_cents
          - state_machines.Booking.HOLD_to_CONFIRMED
        distinguishing_aspect: "PROVISIONAL price (OFF_PEAK at HOLD) and FINAL price (PEAK at confirm) on a Booking differ because the owning Heat window flipped; the dual variant lives on the Booking entity domain (price accounting), distinct from the Wallet-domain dual variant below."
        test_recipe:
          setup:
            - "Venue OPEN; GO_KART attraction lane_count=10, min_height_cm=0; PER_HEAT plan base=1500, peak_surcharge=500, group_discount_pct=0; one Heat OFF_PEAK then re-created PEAK is not possible, so create a Heat already PEAK and a separate Heat OFF_PEAK is NOT what we want — instead create the HOLD against an OFF_PEAK heat, then a SECOND PEAK heat is irrelevant. We compute provisional from the booking's own heat window, which at HOLD is OFF_PEAK; we then re-create the booking against a PEAK heat to observe FINAL. To keep one booking, we use two bookings to expose both variants."
            - "Guest with SIGNED waiver, height 180."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Track A" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id, venue_v: $.data.version }
            - call: "POST /venues/${venue_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", min_height_cm: 0, lane_count: 10 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /pricing-plans"
              payload: { venue_id: "${venue_id}", name: "Heat Std", mode: "PER_HEAT", base_price_cents: 1500, peak_surcharge_cents: 500, group_discount_pct: 0 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z", window: "OFF_PEAK" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_off_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T11:00:00Z", end_utc: "2026-06-14T11:15:00Z", window: "PEAK" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_peak_id: $.data.id }
            - call: "POST /heats/${heat_off_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_off_v: $.data.version }
            - call: "POST /heats/${heat_peak_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_peak_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Pat", height_cm: 180, birthdate: "1990-01-01" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { guest_id: $.data.id }
            - call: "POST /waivers"
              payload: { guest_id: "${guest_id}" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", slot_kind: "HEAT", heat_id: "${heat_off_id}", pricing_plan_id: "${plan_id}", origin: "RESERVATION", party_size: 2, units: 1 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk_off_id: $.data.id, bk_off_gross_prov: $.data.gross_price_cents }
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", slot_kind: "HEAT", heat_id: "${heat_peak_id}", pricing_plan_id: "${plan_id}", origin: "RESERVATION", party_size: 2, units: 1 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk_peak_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_peak_id}/confirm"
              payload: { expected_heat_version: "${heat_peak_v}" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk_peak_gross_final: $.data.gross_price_cents }
          assert:
            - "Booking.${bk_off_id}.gross_price_cents == 3000   # PROVISIONAL OFF_PEAK: 1500*1*2"
            - "Booking.${bk_peak_id}.gross_price_cents == 4000   # FINAL PEAK: (1500+500)*1*2"
            - "Booking.${bk_peak_id}.gross_price_cents != Booking.${bk_off_id}.gross_price_cents"

      - name: wallet_balance_loyalty_vs_balance_forward_diverge_on_topup_order
        grounds:
          - calculations.wallet_balance
          - entities.Wallet.fields.arcade_card_balance_cents
          - entities.Wallet.fields.total_loaded_cents
        distinguishing_aspect: "Two top-up orderings over the same Wallet ([3000,4000,3000] vs [3000,3000,4000]) yield different arcade_card_balance_cents (10400 vs 10300) because the loyalty bonus is computed on the single threshold-crossing top-up; the dual variant lives on the Wallet entity domain, distinct from the Booking-domain price variant above."
        test_recipe:
          setup:
            - "Two guests each with an auto-created Wallet; loyalty threshold 5000, bonus 10%."
          setup_api_calls:
            - call: "POST /guests"
              payload: { full_name: "Alex", height_cm: 175 }
              as: Cashier
              as_user_id: "cash-1"
              captures: { g_a: $.data.id }
            - call: "GET /wallets"
              payload: { guest_id: "${g_a}" }
              as: Cashier
              as_user_id: "cash-1"
              captures: { wallet_a: "$.data[0].id" }
            - call: "POST /guests"
              payload: { full_name: "Blair", height_cm: 175 }
              as: Cashier
              as_user_id: "cash-1"
              captures: { g_b: $.data.id }
            - call: "GET /wallets"
              payload: { guest_id: "${g_b}" }
              as: Cashier
              as_user_id: "cash-1"
              captures: { wallet_b: "$.data[0].id" }
          trigger:
            - call: "POST /wallets/${wallet_a}/top-ups"
              payload: { amount_cents: 3000 }
              as: Cashier
              as_user_id: "cash-1"
            - call: "POST /wallets/${wallet_a}/top-ups"
              payload: { amount_cents: 4000 }
              as: Cashier
              as_user_id: "cash-1"
            - call: "POST /wallets/${wallet_a}/top-ups"
              payload: { amount_cents: 3000 }
              as: Cashier
              as_user_id: "cash-1"
              captures: { bal_a: $.data.arcade_card_balance_cents }
            - call: "POST /wallets/${wallet_b}/top-ups"
              payload: { amount_cents: 3000 }
              as: Cashier
              as_user_id: "cash-1"
            - call: "POST /wallets/${wallet_b}/top-ups"
              payload: { amount_cents: 3000 }
              as: Cashier
              as_user_id: "cash-1"
            - call: "POST /wallets/${wallet_b}/top-ups"
              payload: { amount_cents: 4000 }
              as: Cashier
              as_user_id: "cash-1"
              captures: { bal_b: $.data.arcade_card_balance_cents }
          assert:
            - "Wallet.${wallet_a}.arcade_card_balance_cents == 10400   # crossing top-up is 4000 -> bonus 400"
            - "Wallet.${wallet_b}.arcade_card_balance_cents == 10300   # crossing top-up is 3000 -> bonus 300"
            - "Wallet.${wallet_a}.total_loaded_cents == 10000 and Wallet.${wallet_b}.total_loaded_cents == 10000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: booking_price_mode_a_nonlinear_multi_input
        grounds:
          - calculations.booking_price
          - entities.PricingPlan.fields.group_discount_pct
          - entities.Booking.fields.gross_price_cents
        distinguishing_aspect: "MODE (a): booking_price combines >=3 inputs (base_price, peak_surcharge, units, party_size, group_discount_pct) with non-linear interaction — a conditional PEAK branch, a conditional group-discount branch gated on party_size>=GROUP_MIN_SIZE, and a WRISTBAND min() cap path — distinct from the MODE (c) order-dependent loyalty instance below."
        test_recipe:
          setup:
            - "Venue OPEN; MINI_GOLF attraction min_height 0; PER_ROUND plan base=1200, peak_surcharge=300, group_discount_pct=0.20; TeeSession PEAK capacity 20; guest signed waiver."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Track B" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Putt", kind: "MINI_GOLF", min_height_cm: 0 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /pricing-plans"
              payload: { venue_id: "${venue_id}", name: "Round Grp", mode: "PER_ROUND", base_price_cents: 1200, peak_surcharge_cents: 300, group_discount_pct: 0.20 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /tee-sessions"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T11:00:00Z", party_slot_capacity: 20, window: "PEAK" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { tee_id: $.data.id }
            - call: "POST /tee-sessions/${tee_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { tee_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Quinn", height_cm: 170, birthdate: "1990-01-01" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { guest_id: $.data.id }
            - call: "POST /waivers"
              payload: { guest_id: "${guest_id}" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", slot_kind: "TEE_SESSION", tee_session_id: "${tee_id}", pricing_plan_id: "${plan_id}", origin: "RESERVATION", party_size: 4, units: 2 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { expected_tee_session_version: "${tee_v}" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { gross: $.data.gross_price_cents }
          assert:
            - "Booking.${bk_id}.gross_price_cents == 9600   # per_unit=(1200+300)=1500; raw=1500*2*4=12000; party_size 4>=GROUP_MIN_SIZE so *0.80 = 9600"
            - "Booking.${bk_id}.status == CONFIRMED"

      - name: wallet_loyalty_mode_c_order_dependent_bonus
        grounds:
          - calculations.wallet_balance
          - entities.Wallet.fields.arcade_card_balance_cents
        distinguishing_aspect: "MODE (c): the loyalty bonus has an order-dependent (circular-looking) evaluation — the bonus on a top-up depends on the cumulative total_loaded_cents BEFORE that top-up, so processing order must be pinned (created_at ASC); reordering [2000,6000] vs [6000,2000] keeps the crossing-top-up bonus tied to its own amount, while [3000,4000] vs [4000,3000] before a 3000 changes which amount crosses. Distinct mode from the MODE (a) booking_price instance above."
        test_recipe:
          setup:
            - "One guest with auto Wallet; two top-ups [2000, 6000] applied in chronological order."
          setup_api_calls:
            - call: "POST /guests"
              payload: { full_name: "Rao", height_cm: 175 }
              as: Guest
              captures: { g: $.data.id }
            - call: "GET /wallets"
              payload: { guest_id: "${g}" }
              as: Guest
              as_user_id: "${g}"
              captures: { wallet: "$.data[0].id" }
          trigger:
            - call: "POST /wallets/${wallet}/top-ups"
              payload: { amount_cents: 2000 }
              as: Guest
              as_user_id: "${g}"
            - call: "POST /wallets/${wallet}/top-ups"
              payload: { amount_cents: 6000 }
              as: Guest
              as_user_id: "${g}"
              captures: { bal: $.data.arcade_card_balance_cents }
          assert:
            - "Wallet.${wallet}.arcade_card_balance_cents == 8600   # 2000 (no cross) + 6000 (crosses 5000, bonus 10%*6000=600) = 8600"
            - "Wallet.${wallet}.total_loaded_cents == 8000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_cyclic_confirmed_waitlisted_promotion
        grounds:
          - state_machines.Booking.HOLD_to_WAITLISTED
          - state_machines.Booking.WAITLISTED_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: "Booking has a cyclic axis CONFIRMED<->WAITLISTED: a HOLD that cannot fit becomes WAITLISTED, and a CONFIRMED cancel promotes the earliest WAITLISTED back to CONFIRMED — a non-linear (cyclic) shape on the Booking entity, distinct from the PartyGroup branching machine below."
        test_recipe:
          setup:
            - "Heat lane_capacity=2, OPEN; booking A (party 2) CONFIRMED fills the heat; booking B (party 2) confirm -> WAITLISTED."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Track C" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", min_height_cm: 0, lane_count: 2 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /pricing-plans"
              payload: { venue_id: "${venue_id}", name: "Heat", mode: "PER_HEAT", base_price_cents: 1000 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
            - call: "POST /heats/${heat_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_v1: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "GA", height_cm: 180 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { ga: $.data.id }
            - call: "POST /waivers"
              payload: { guest_id: "${ga}" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /guests"
              payload: { full_name: "GB", height_cm: 180 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { gb: $.data.id }
            - call: "POST /waivers"
              payload: { guest_id: "${gb}" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${ga}", slot_kind: "HEAT", heat_id: "${heat_id}", pricing_plan_id: "${plan_id}", origin: "RESERVATION", party_size: 2 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk_a: $.data.id }
            - call: "POST /bookings/${bk_a}/confirm"
              payload: { expected_heat_version: "${heat_v1}" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_v2: $.data.version }
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${gb}", slot_kind: "HEAT", heat_id: "${heat_id}", pricing_plan_id: "${plan_id}", origin: "RESERVATION", party_size: 2 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk_b: $.data.id }
            - call: "POST /bookings/${bk_b}/confirm"
              payload: { expected_heat_version: "${heat_v2}" }
              as: OpsManager
              as_user_id: "ops-1"
          trigger:
            - call: "POST /bookings/${bk_a}/cancel"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
          assert:
            - "Booking.${bk_b}.status == CONFIRMED   # was WAITLISTED, promoted on A's cancel"
            - "Booking.${bk_b}.waitlist_seq == null"
            - "Booking.${bk_a}.status == CANCELLED"
            - "Heat.${heat_id}.lanes_committed == 2 and Heat.${heat_id}.lanes_available == 0"

      - name: party_group_branching_refund_vs_forfeit
        grounds:
          - state_machines.PartyGroup.DRAFT_to_CANCELLED
          - state_machines.PartyGroup.CONFIRMED_to_CANCELLED
          - state_machines.PartyGroup.DRAFT_to_CONFIRMED
        distinguishing_aspect: "PartyGroup branches from each state with divergent side-effect sets: DRAFT->CANCELLED refunds the deposit to the host wallet, while CONFIRMED->CANCELLED forfeits it — branching fork with per-branch side-effects on the PartyGroup entity, distinct from the Booking cyclic machine above."
        test_recipe:
          setup:
            - "Two party groups for the same host (deposit 2000 each). Host wallet topped up to 10000. Group1 cancelled while DRAFT (refund); Group2 confirmed then cancelled (forfeit)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Track D" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id, venue_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Host", height_cm: 175 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { host: $.data.id }
            - call: "GET /wallets"
              payload: { guest_id: "${host}" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { wallet: "$.data[0].id" }
            - call: "POST /wallets/${wallet}/top-ups"
              payload: { amount_cents: 4000 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bal0: $.data.arcade_card_balance_cents }
            - call: "POST /party-groups"
              payload: { venue_id: "${venue_id}", host_guest_id: "${host}", package_name: "P1", included_unit_count: 10, deposit_cents: 2000 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { grp1: $.data.id, grp1_v: $.data.version }
            - call: "POST /party-groups"
              payload: { venue_id: "${venue_id}", host_guest_id: "${host}", package_name: "P2", included_unit_count: 10, deposit_cents: 2000 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { grp2: $.data.id, grp2_v: $.data.version }
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", min_height_cm: 0, lane_count: 10 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /pricing-plans"
              payload: { venue_id: "${venue_id}", name: "Heat", mode: "PER_HEAT", base_price_cents: 1000 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
            - call: "POST /heats/${heat_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /waivers"
              payload: { guest_id: "${host}" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${host}", slot_kind: "HEAT", heat_id: "${heat_id}", pricing_plan_id: "${plan_id}", group_id: "${grp2}", origin: "RESERVATION", party_size: 1 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk2: $.data.id }
            - call: "POST /party-groups/${grp2}/confirm"
              payload: { expected_group_version: "${grp2_v}" }
              as: OpsManager
              as_user_id: "ops-1"
          trigger:
            - call: "POST /party-groups/${grp1}/cancel"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /party-groups/${grp2}/cancel"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bal_final: $.data.id }
          assert:
            - "PartyGroup.${grp1}.status == CANCELLED"
            - "PartyGroup.${grp2}.status == CANCELLED"
            - "Wallet.${wallet}.arcade_card_balance_cents == 2000   # top-up 4000 (below 5000, no bonus) - 2000(P1) - 2000(P2) + 2000(P1 DRAFT refund) = 2000; P2 CONFIRMED deposit forfeited"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: booking_cancel_cascades_to_promotion_to_party_units
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Booking.WAITLISTED_to_CONFIRMED
          - calculations.slot_capacity_rollup
          - calculations.party_group_unit_balance
        distinguishing_aspect: "Depth-4 chain from a single booking cancel: cancel A (Booking) -> Heat capacity released (Heat) -> earliest WAITLISTED B promoted to CONFIRMED (Booking) -> B's PartyGroup.units_consumed increases (PartyGroup); each link is caused by the prior link, not by the original cancel. Trigger = booking cancel."
        test_recipe:
          setup:
            - "Heat capacity 2 full with booking A (party 2). Booking B (party 2, group-linked) WAITLISTED. Group is CONFIRMED with units_consumed 0 (B not yet counted)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Track E" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /attractions"
