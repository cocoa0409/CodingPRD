            - "hop attribution: rejecting a *lot-linked* cert first mutated a report (hop 1), the failed re-check mutated the claim (hop 2), the claim's challenge mutated the contract (hop 3)"

      - name: factory_suspension_run_lot_order_cascade
        grounds:
          - state_machines.Factory.ACTIVE_to_SUSPENDED
          - state_machines.ProductionRun.MATERIAL_RESERVED_to_PLANNED
          - state_machines.CustomOrder.SCHEDULED_to_ACCEPTED
          - entities.MaterialLot.fields.quantity_remaining
        distinguishing_aspect: "Depth-2 cascade from a different trigger (factory suspension, not evidence rejection): the held/reverted run mutations themselves cause lot re-credit and order unschedule — suspending the factory moves the IN_PRODUCTION run to QUALITY_HOLD while the MATERIAL_RESERVED run reverts to PLANNED, its 10 consumed lot units flow back (480 -> 490), and its SCHEDULED custom order drops back to ACCEPTED with production_run_id null; the order on the held run is untouched."
