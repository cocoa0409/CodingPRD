# =============================================================================
# PRD Benchmark Scaffold — task_1653_parent_teacher_conference_scheduling
# Parent-Teacher Conference Scheduling (school front office)
# =============================================================================

scenario: |
  Parent-Teacher Conference Scheduling (school front office): conference window & slot generation per teacher, family self-scheduling with sibling/consecutive-slot logic, translation/interpreter request assignment, virtual vs in-person channel, no-show tracking & rescheduling, elementary vs secondary (multi-teacher) formats, capacity overflow & waitlist, attendance reporting & follow-up outreach

domain_name: parent-teacher-conference-scheduling
api_prefix: /conf

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
    - selector_policy
  entity_topology: graph        # peer entities + many-to-many junctions + self-referential Booking reschedule chain
  state_machine_shape: cyclic   # InterpreterRequest and WaitlistEntry and TimeSlot all have true cycles; ConferenceWindow is a guarded linear spine
  relationship_patterns:
    - one_to_many
    - many_to_many              # StudentTeacherLink junction; Booking joins Family/Student/Teacher/TimeSlot
    - self_referential          # Booking.rescheduled_from_booking_id
    - cross_aggregate           # InterpreterRequest spans Booking + Interpreter; WaitlistEntry spans Family/Student/Teacher/Window
  role_model: hierarchical_override   # SchoolAdmin superset of FrontOfficeStaff; Teacher/FamilyGuardian/Interpreter are entity-backed scoped roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ConferenceWindow
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human label, e.g. 'Fall Conferences'" }
      - { name: term_label, type: string, source: input, description: "Term identifier, e.g. '2026-FALL'" }
      - { name: format, type: enum, source: input, description: "ELEMENTARY | SECONDARY — drives booking format rules (homeroom-single vs multi-teacher)" }
      - { name: slot_length_minutes, type: integer, source: input, description: "Conference slot length L; > 0" }
      - { name: buffer_minutes, type: integer, source: input, description: "Gap B between consecutive slots for a teacher; >= 0" }
      - { name: travel_minutes, type: integer, source: input, description: "Required family gap when switching channel between consecutive bookings; >= 0" }
      - { name: day_windows, type: array, source: input, description: "Array of {date, start_at, end_at} ISO datetime day ranges that slot generation slices" }
      - { name: booking_open_at, type: datetime, source: input, description: "Logical-clock time at which open-booking becomes allowed" }
      - { name: booking_close_at, type: datetime, source: input, description: "Logical-clock time at which lock becomes allowed" }
      - { name: teacher_daily_conf_cap, type: integer, source: input, description: "Max CONFIRMED bookings per teacher per day_label; > 0" }
      - { name: family_conf_cap, type: integer, source: input, default: 8, description: "Max CONFIRMED bookings per family per window; > 0" }
      - { name: cancel_cutoff_hours, type: integer, source: input, default: 24, description: "Family self-cancel/reschedule requires clock <= slot.start_at minus this many hours" }
      - { name: waitlist_offer_ttl_hours, type: integer, source: default, default: 24, description: "Hours a waitlist offer stays claimable" }
      - { name: no_show_strike_threshold, type: integer, source: input, default: 3, description: "Family becomes RESTRICTED when no_show_strike_count >= this" }
      - { name: auto_no_show_grace_hours, type: integer, source: input, default: 24, description: "run-ops auto-marks NO_SHOW when slot.end_at + this many hours <= clock" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | BOOKING_OPEN | LOCKED | IN_PROGRESS | COMPLETED | ARCHIVED" }
      - { name: ops_run_index, type: integer, source: system, description: "Monotonic counter, starts 0, increments on run-ops" }
      - { name: slots_total_count, type: integer, source: computed, description: "Count of non-RETIRED TimeSlots in window" }
      - { name: slots_open_count, type: integer, source: computed, description: "TimeSlots with status OPEN" }
      - { name: slots_held_count, type: integer, source: computed, description: "TimeSlots with status HELD (offered to waitlist)" }
      - { name: slots_booked_count, type: integer, source: computed, description: "TimeSlots with status BOOKED" }
      - { name: bookings_confirmed_count, type: integer, source: computed, description: "Bookings with status CONFIRMED in window" }
      - { name: waitlist_waiting_count, type: integer, source: computed, description: "WaitlistEntries with status WAITING in window" }

  - name: Teacher
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Teacher display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: grade_band, type: enum, source: input, description: "ELEMENTARY | SECONDARY | BOTH — slot generation matches window.format to band (BOTH always matches)" }
      - { name: subjects, type: array, source: input, description: "Array of subject strings (secondary use)" }
      - { name: room_location, type: string, source: input, default: null, description: "Room for in-person conferences" }
      - { name: supports_in_person, type: boolean, source: input, default: true, description: "Offers in-person channel" }
      - { name: supports_virtual, type: boolean, source: input, default: false, description: "Offers virtual channel" }
      - { name: daily_conf_cap_override, type: integer, source: input, default: null, description: "When set, overrides window.teacher_daily_conf_cap for this teacher" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: Family
    parent: null
    common_fields: true
    fields:
      - { name: primary_guardian_name, type: string, source: input, description: "Primary guardian display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, default: null, description: "Contact phone" }
      - { name: preferred_language, type: string, source: input, default: "en", description: "ISO language code preferred for conferences" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESTRICTED — RESTRICTED blocks family self-service booking and waitlist join" }
      - { name: no_show_strike_count, type: integer, source: computed, description: "Lifetime NO_SHOW AttendanceRecords minus strikes_cleared_total, floored at 0" }
      - { name: strikes_cleared_total, type: integer, source: system, description: "Cumulative strikes cleared by staff via clear-strikes; starts 0" }
      - { name: attendance_risk_strict, type: number, source: computed, description: "Strict risk variant: 1.0 * count(lifetime NO_SHOW records), ignores clears" }
      - { name: attendance_risk_score, type: number, source: computed, description: "Weighted risk variant: 1.0*NO_SHOW + 0.5*LATE + 0.25*EXCUSED over lifetime AttendanceRecords" }

  - name: Student
    parent: Family
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; owning family" }
      - { name: full_name, type: string, source: input, description: "Student display name" }
      - { name: grade_level, type: integer, source: input, description: "0..12 (0 = kindergarten)" }
      - { name: enrollment_status, type: enum, source: system, description: "ENROLLED | WITHDRAWN" }

  - name: StudentTeacherLink
    parent: null
    common_fields: false
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: teacher_id, type: string, source: input, description: "FK -> Teacher.id" }
      - { name: is_homeroom, type: boolean, source: input, default: false, description: "Homeroom teacher flag; ELEMENTARY windows book only against the homeroom link" }
      - { name: required_conference, type: boolean, source: input, default: false, description: "Counselor-flagged required conference; feeds waitlist priority bonus" }

  - name: TimeSlot
    parent: null
    common_fields: true
    fields:
      - { name: window_id, type: string, source: system, description: "FK -> ConferenceWindow.id" }
      - { name: teacher_id, type: string, source: system, description: "FK -> Teacher.id" }
      - { name: day_label, type: string, source: system, description: "Date label (YYYY-MM-DD) of the slot; groups daily caps" }
      - { name: start_at, type: datetime, source: system, description: "Slot start (half-open interval start)" }
      - { name: end_at, type: datetime, source: system, description: "Slot end (half-open interval end)" }
      - { name: channel_allowed, type: enum, source: system, description: "IN_PERSON | VIRTUAL | EITHER — derived at generation from teacher.supports_* flags" }
      - { name: status, type: enum, source: system, description: "OPEN | BLOCKED | HELD | BOOKED | RETIRED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: window_id, type: string, source: system, description: "FK -> ConferenceWindow.id; derived from slot" }
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; derived from student.family_id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: teacher_id, type: string, source: system, description: "FK -> Teacher.id; derived from slot" }
      - { name: slot_id, type: string, source: input, description: "FK -> TimeSlot.id" }
      - { name: channel, type: enum, source: input, description: "IN_PERSON | VIRTUAL" }
      - { name: interpreter_language, type: string, source: input, default: null, description: "When non-null, an InterpreterRequest is auto-created for this booking" }
      - { name: booked_by_role, type: enum, source: system, description: "FAMILY_SELF | FRONT_OFFICE" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | COMPLETED | NO_SHOW | EXCUSED | CANCELLED | RESCHEDULED" }
      - { name: cancel_reason, type: string, source: system, default: null, description: "Reason recorded at cancel/reschedule (FAMILY_REQUEST | STAFF_REQUEST | TEACHER_INACTIVE | FAMILY_RESTRICTED | STUDENT_WITHDRAWN | RESCHEDULED)" }
      - { name: rescheduled_from_booking_id, type: string, source: system, default: null, description: "FK -> Booking.id; set on the successor booking created by reschedule" }
      - { name: family_compactness_score, type: number, source: computed, description: "Sibling compactness score of (family, window) recomputed after every booking mutation; same value stored on all bookings of that family in that window" }

  - name: Interpreter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Interpreter display name" }
      - { name: languages, type: array, source: input, description: "Array of ISO language codes the interpreter covers; non-empty" }
      - { name: supports_in_person, type: boolean, source: input, default: true, description: "Can work in-person assignments" }
      - { name: supports_virtual, type: boolean, source: input, default: true, description: "Can work virtual assignments" }
      - { name: max_consecutive_minutes, type: integer, source: input, description: "Fatigue cap: longest allowed run of back-to-back (zero-gap) assigned minutes; > 0" }
      - { name: base_minutes_per_window, type: integer, source: input, description: "Per-window capacity base before break allowance; > 0" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Hourly pay rate in cents; >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }
      - { name: committed_minutes, type: integer, source: computed, description: "Sum of assigned_minutes over ASSIGNED|CONFIRMED InterpreterRequests whose window status is not in {COMPLETED, ARCHIVED}" }
      - { name: created_seq, type: integer, source: system, description: "Global monotonic creation sequence (server-assigned, strictly increasing); final tie-break after created_at" }

  - name: InterpreterRequest
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: window_id, type: string, source: system, description: "FK -> ConferenceWindow.id; denormalized from booking" }
      - { name: language, type: string, source: input, description: "Requested ISO language code" }
      - { name: channel_required, type: enum, source: system, description: "IN_PERSON | VIRTUAL — copied from booking.channel at creation" }
      - { name: interpreter_id, type: string, source: system, default: null, description: "FK -> Interpreter.id; null until assigned" }
      - { name: assigned_minutes, type: integer, source: system, description: "Minutes reserved = slot length of the underlying booking slot" }
      - { name: declined_interpreter_ids, type: array, source: system, description: "Interpreter ids who declined; excluded from future auto-assign for this request" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ASSIGNED | CONFIRMED | CANCELLED | UNFILLED" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: window_id, type: string, source: input, description: "FK -> ConferenceWindow.id" }
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; derived from student.family_id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: teacher_id, type: string, source: input, description: "FK -> Teacher.id" }
      - { name: channel_pref, type: enum, source: input, description: "IN_PERSON | VIRTUAL | EITHER" }
      - { name: status, type: enum, source: system, description: "WAITING | OFFERED | CLAIMED | EXPIRED | WITHDRAWN | EXHAUSTED" }
      - { name: offers_made_count, type: integer, source: system, description: "Number of offers made; MAX_OFFERS = 2, then EXHAUSTED" }
      - { name: offered_slot_id, type: string, source: system, default: null, description: "FK -> TimeSlot.id; set while OFFERED" }
      - { name: offer_expires_at, type: datetime, source: system, default: null, description: "clock + window.waitlist_offer_ttl_hours at offer time" }
      - { name: declined_slot_ids, type: array, source: system, description: "Slot ids this entry declined or let expire; promotion never re-offers them" }
      - { name: priority_score, type: number, source: computed, description: "waitlist_priority_score at creation, refreshed by run-ops and relevant mutations" }
      - { name: created_seq, type: integer, source: system, description: "Global monotonic creation sequence (server-assigned, strictly increasing); final tie-break after created_at" }

  - name: AttendanceRecord
    parent: null
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: outcome, type: enum, source: input, description: "ATTENDED | LATE | NO_SHOW | EXCUSED" }
      - { name: marked_by_role, type: string, source: system, description: "Role that marked attendance (Teacher | FrontOfficeStaff | SchoolAdmin | system)" }
      - { name: marked_by_user_id, type: string, source: system, description: "X-User-ID of marker; 'system' for ops auto-no-show" }
      - { name: note, type: string, source: input, default: null, description: "Optional marker note" }

  - name: OutreachTask
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: system, description: "FK -> Family.id" }
      - { name: window_id, type: string, source: system, description: "FK -> ConferenceWindow.id; for manual tasks copied from the optional window_id input; null when neither booking nor window context is supplied" }
      - { name: booking_id, type: string, source: system, default: null, description: "FK -> Booking.id; null for manual family-level tasks" }
      - { name: kind, type: enum, source: system, description: "NO_SHOW_FOLLOW_UP | RESCHEDULE_ASSIST | LANGUAGE_ACCESS" }
      - { name: status, type: enum, source: system, description: "OPEN | CONTACTED | RESOLVED | DISMISSED" }
      - { name: attempts_count, type: integer, source: system, description: "Number of contact attempts; starts 0" }
      - { name: note, type: string, source: input, default: null, description: "Staff note" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ConferenceWindow
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /conf/windows/{id}/publish"
        actor: SchoolAdmin
        preconditions:
          - "day_windows non-empty, each with end_at > start_at (else ERR_INVALID_DAY_WINDOW)"
          - "slot_length_minutes > 0, buffer_minutes >= 0, travel_minutes >= 0"
        side_effects:
          - "increments ConferenceWindow.version by 1"
      - from: PUBLISHED
        to: BOOKING_OPEN
        trigger: "POST /conf/windows/{id}/open-booking"
        actor: SchoolAdmin
        preconditions:
          - "slots_total_count > 0 (generate-slots has run; else ERR_INVALID_WINDOW_STATE)"
          - "logical clock >= booking_open_at (else ERR_BOOKING_WINDOW_NOT_OPEN)"
        side_effects:
          - "increments ConferenceWindow.version by 1"
      - from: BOOKING_OPEN
        to: LOCKED
        trigger: "POST /conf/windows/{id}/lock"
        actor: SchoolAdmin
        preconditions:
          - "logical clock >= booking_close_at (else ERR_BOOKING_WINDOW_NOT_CLOSED)"
        side_effects:
          - "InterpreterRequests in REQUESTED -> UNFILLED"
          - "WaitlistEntries in OFFERED -> EXPIRED (their HELD slots -> OPEN, no further promotion after lock)"
          - "WaitlistEntries in WAITING -> EXPIRED"
          - "recomputes slots_* and waitlist_waiting_count counters"
          - "increments ConferenceWindow.version by 1"
      - from: LOCKED
        to: IN_PROGRESS
        trigger: "POST /conf/windows/{id}/start"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "increments ConferenceWindow.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /conf/windows/{id}/complete"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "increments ConferenceWindow.version by 1"
      - from: COMPLETED
        to: ARCHIVED
        trigger: "POST /conf/windows/{id}/archive"
        actor: SchoolAdmin
        preconditions:
          - "no OutreachTask for this window in status OPEN or CONTACTED (else ERR_OPEN_OUTREACH_TASKS)"
        side_effects:
          - "increments ConferenceWindow.version by 1"

  - entity: Teacher
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /conf/teachers/{id} with status=INACTIVE"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "TimeSlots of this teacher in windows with status in {PUBLISHED, BOOKING_OPEN} and slot status OPEN or BLOCKED -> RETIRED"
          - "Bookings CONFIRMED on this teacher's slots in those windows -> CANCELLED with cancel_reason=TEACHER_INACTIVE; their slots -> RETIRED (never reopen)"
          - "InterpreterRequests in REQUESTED or ASSIGNED on those cancelled bookings -> CANCELLED (ASSIGNED ones decrement Interpreter.committed_minutes by assigned_minutes)"
          - "WaitlistEntries in WAITING or OFFERED for this teacher -> WITHDRAWN (OFFERED ones release HELD slot -> RETIRED, not OPEN)"
          - "recomputes window counters on each affected window"
      - from: INACTIVE
        to: ACTIVE
        trigger: "PATCH /conf/teachers/{id} with status=ACTIVE"
        actor: SchoolAdmin
        preconditions: []
        side_effects: ["no slots are un-retired; generate-slots must be re-run to recreate inventory"]

  - entity: Family
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system (attendance NO_SHOW mark or ops auto-no-show pushes no_show_strike_count >= window.no_show_strike_threshold)"
        actor: system
        preconditions:
          - "recomputed no_show_strike_count >= no_show_strike_threshold of the window whose booking was marked"
        side_effects:
          - "all CONFIRMED Bookings of this family (any window) whose slot start_at > logical clock -> CANCELLED with cancel_reason=FAMILY_RESTRICTED; their slots BOOKED -> OPEN and each OPEN slot runs the waitlist promotion selector"
          - "InterpreterRequests in REQUESTED or ASSIGNED on those cancelled bookings -> CANCELLED (ASSIGNED ones decrement Interpreter.committed_minutes)"
          - "WaitlistEntries of this family in WAITING or OFFERED -> WITHDRAWN (OFFERED release HELD slot -> OPEN and re-run promotion)"
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /conf/families/{id}/clear-strikes"
        actor: FrontOfficeStaff | SchoolAdmin
        preconditions: []
        side_effects:
          - "strikes_cleared_total += current no_show_strike_count; no_show_strike_count recomputes to 0"
          - "attendance_risk_strict and attendance_risk_score are NOT changed (they ignore clears)"

  - entity: Student
    field: enrollment_status
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /conf/students/{id}/withdraw"
        actor: FrontOfficeStaff | SchoolAdmin
        preconditions: []
        side_effects:
          - "CONFIRMED Bookings of this student whose slot start_at > logical clock -> CANCELLED with cancel_reason=STUDENT_WITHDRAWN; slots BOOKED -> OPEN with promotion sweep per slot"
          - "InterpreterRequests REQUESTED|ASSIGNED on those bookings -> CANCELLED (ASSIGNED decrement Interpreter.committed_minutes)"
          - "WaitlistEntries of this student in WAITING|OFFERED -> WITHDRAWN (OFFERED releases HELD -> OPEN and re-runs promotion)"

  - entity: TimeSlot
    field: status
    initial_state: OPEN
    terminal_states: [RETIRED]
    transitions:
      - from: OPEN
        to: BLOCKED
        trigger: "POST /conf/slots/{id}/block"
        actor: Teacher | FrontOfficeStaff | SchoolAdmin
        preconditions:
          - "slot.status == OPEN (else ERR_SLOT_NOT_AVAILABLE)"
          - "window.status in {PUBLISHED, BOOKING_OPEN} (else ERR_INVALID_WINDOW_STATE)"
          - "Teacher caller must own slot.teacher_id (else ERR_FORBIDDEN)"
        side_effects: ["recomputes window slots_open_count"]
      - from: BLOCKED
        to: OPEN
        trigger: "POST /conf/slots/{id}/unblock"
        actor: Teacher | FrontOfficeStaff | SchoolAdmin
        preconditions:
          - "slot.status == BLOCKED (else ERR_INVALID_STATE)"
          - "window.status in {PUBLISHED, BOOKING_OPEN}"
        side_effects:
          - "if window.status == BOOKING_OPEN, run waitlist promotion selector on this slot (may become HELD immediately)"
          - "recomputes window slots_open_count / slots_held_count"
      - from: OPEN
        to: BOOKED
        trigger: "system (POST /conf/bookings or waitlist claim creates Booking)"
        actor: system
        preconditions: ["slot.status == OPEN for direct booking; HELD for claim (claim transitions HELD -> BOOKED)"]
        side_effects: ["recomputes window slots_open_count / slots_booked_count / bookings_confirmed_count"]
      - from: HELD
        to: BOOKED
        trigger: "system (POST /conf/waitlist-entries/{id}/claim)"
        actor: system
        preconditions: ["offering WaitlistEntry transitions OFFERED -> CLAIMED in the same request"]
        side_effects: ["recomputes window slots_held_count / slots_booked_count"]
      - from: BOOKED
        to: OPEN
        trigger: "system (booking cancel, reschedule-away, family-restriction cascade, student withdrawal)"
        actor: system
        preconditions: ["window.status in {BOOKING_OPEN} for promotion to run; otherwise slot opens without promotion"]
        side_effects:
          - "if window.status == BOOKING_OPEN, run waitlist promotion selector (slot may immediately become HELD)"
          - "recomputes window counters"
      - from: OPEN
        to: HELD
        trigger: "system (waitlist promotion selector offers this slot to a WaitlistEntry)"
        actor: system
        preconditions: ["selected entry transitions WAITING -> OFFERED in the same sweep"]
        side_effects: ["recomputes window slots_open_count / slots_held_count"]
      - from: HELD
        to: OPEN
        trigger: "system (offer expired via run-ops, offer declined, or entry withdrawn)"
        actor: system
        preconditions: []
        side_effects: ["re-runs promotion selector for this slot if window still BOOKING_OPEN"]
      - from: [OPEN, BLOCKED, HELD, BOOKED]
        to: RETIRED
        trigger: "system (teacher deactivation or window slot-grid regeneration)"
        actor: system
        preconditions: ["BOOKED slots retire only after their booking is cancelled in the same cascade"]
        side_effects: ["recomputes window counters; RETIRED slots never reopen"]

  - entity: Booking
    field: status
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, NO_SHOW, EXCUSED, CANCELLED, RESCHEDULED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /conf/bookings/{id}/cancel"
        actor: FamilyGuardian | FrontOfficeStaff | SchoolAdmin
        preconditions:
          - "window.status == BOOKING_OPEN (else ERR_INVALID_WINDOW_STATE)"
          - "FamilyGuardian caller: clock <= slot.start_at - window.cancel_cutoff_hours (else ERR_CANCELLATION_CUTOFF); staff callers bypass cutoff"
          - "FamilyGuardian caller must own booking.family_id (else ERR_FORBIDDEN)"
        side_effects:
          - "slot BOOKED -> OPEN; if window BOOKING_OPEN run promotion selector"
          - "open InterpreterRequest (REQUESTED|ASSIGNED|CONFIRMED) on this booking -> CANCELLED; ASSIGNED decrements Interpreter.committed_minutes"
          - "recompute family_compactness_score on remaining family bookings in window"
          - "recompute window counters"
      - from: CONFIRMED
        to: RESCHEDULED
        trigger: "POST /conf/bookings/{id}/reschedule"
        actor: FamilyGuardian | FrontOfficeStaff | SchoolAdmin
        preconditions:
          - "expected_booking_version == booking.version (else ERR_STALE_VERSION)"
          - "window.status == BOOKING_OPEN for FamilyGuardian (staff may also reschedule while IN_PROGRESS)"
          - "FamilyGuardian: clock <= old slot.start_at - cancel_cutoff_hours (else ERR_CANCELLATION_CUTOFF)"
          - "new slot OPEN, same window, and passes all booking validations (link, caps, gap, duplicate, channel)"
        side_effects:
          - "old booking -> RESCHEDULED (cancel_reason=RESCHEDULED); old slot BOOKED -> OPEN with promotion sweep"
          - "create successor Booking (status CONFIRMED, rescheduled_from_booking_id = old id, version 1); new slot OPEN -> BOOKED"
          - "old open InterpreterRequest -> CANCELLED; if old booking had interpreter_language non-null, auto-create new REQUESTED InterpreterRequest for successor"
          - "recompute family_compactness_score and window counters"
      - from: NO_SHOW
        to: RESCHEDULED
        trigger: "POST /conf/bookings/{id}/reschedule"
        actor: FrontOfficeStaff | SchoolAdmin
        preconditions:
          - "expected_booking_version == booking.version"
          - "window.status in {IN_PROGRESS, COMPLETED}"
          - "new slot OPEN, same window, start_at > logical clock; passes booking validations"
        side_effects:
          - "same successor-creation side effects as CONFIRMED reschedule; the existing NO_SHOW AttendanceRecord and strike are NOT removed"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /conf/bookings/{id}/attendance with outcome in {ATTENDED, LATE}"
        actor: Teacher | FrontOfficeStaff | SchoolAdmin
        preconditions:
          - "window.status in {IN_PROGRESS, COMPLETED} (else ERR_INVALID_WINDOW_STATE)"
          - "logical clock >= slot.start_at (else ERR_CANCELLATION_CUTOFF-class temporal rejection ERR_INVALID_STATE)"
          - "Teacher caller must own booking.teacher_id"
        side_effects:
          - "create AttendanceRecord(outcome); recompute family attendance_risk_strict / attendance_risk_score"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /conf/bookings/{id}/attendance with outcome=NO_SHOW, or system run-ops auto-no-show (slot.end_at + window.auto_no_show_grace_hours <= clock)"
        actor: Teacher | FrontOfficeStaff | SchoolAdmin | system
        preconditions:
          - "manual mark: window.status in {IN_PROGRESS, COMPLETED}; auto: window.status in {IN_PROGRESS, COMPLETED}"
        side_effects:
          - "create AttendanceRecord(NO_SHOW)"
          - "recompute Family.no_show_strike_count, attendance_risk_strict, attendance_risk_score"
          - "create OutreachTask(kind=NO_SHOW_FOLLOW_UP, status=OPEN)"
          - "if Family was ACTIVE and strike_count >= threshold: Family -> RESTRICTED and run the RESTRICTED cascade (cancel future bookings, withdraw waitlist entries, cancel interpreter requests, promotion sweeps)"
      - from: CONFIRMED
        to: EXCUSED
        trigger: "POST /conf/bookings/{id}/attendance with outcome=EXCUSED"
        actor: Teacher | FrontOfficeStaff | SchoolAdmin
        preconditions: ["window.status in {IN_PROGRESS, COMPLETED}"]
        side_effects:
          - "create AttendanceRecord(EXCUSED); recompute attendance_risk_score (EXCUSED weight 0.25); no strike"

  - entity: InterpreterRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [CANCELLED, UNFILLED]
    transitions:
      - from: REQUESTED
        to: ASSIGNED
        trigger: "POST /conf/interpreter-requests/{id}/assign"
        actor: FrontOfficeStaff | SchoolAdmin
        preconditions:
          - "request.status == REQUESTED (else ERR_INVALID_STATE)"
          - "booking.status == CONFIRMED (else ERR_INVALID_STATE)"
          - "chosen interpreter ACTIVE (else ERR_TEACHER_INACTIVE-class ERR_INVALID_STATE)"
          - "interpreter.languages contains request.language (else ERR_LANGUAGE_NOT_COVERED)"
          - "channel support: request.channel_required == IN_PERSON requires supports_in_person; VIRTUAL requires supports_virtual (else ERR_CHANNEL_NOT_ALLOWED)"
          - "no half-open overlap with interpreter's other ASSIGNED|CONFIRMED assignments (else ERR_INTERPRETER_OVERLAP)"
          - "fatigue: longest zero-gap run of assignments including the new one <= max_consecutive_minutes (else ERR_INTERPRETER_FATIGUE)"
          - "capacity: committed_in_window + assigned_minutes <= interpreter_window_capacity (else ERR_INTERPRETER_CAPACITY_EXCEEDED)"
          - "auto-assign (no interpreter_id): candidate = ACTIVE, language covered, channel supported, not in declined_interpreter_ids; ranked by committed_minutes ASC, then created_at ASC, then created_seq ASC; first candidate passing all checks wins; empty pool -> ERR_NO_ELIGIBLE_INTERPRETER"
        side_effects:
          - "set interpreter_id; Interpreter.committed_minutes += assigned_minutes"
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /conf/interpreter-requests/{id}/accept"
        actor: Interpreter
        preconditions:
          - "caller X-User-ID == request.interpreter_id (else ERR_FORBIDDEN)"
          - "request.status == ASSIGNED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: ASSIGNED
        to: REQUESTED
        trigger: "POST /conf/interpreter-requests/{id}/decline"
        actor: Interpreter
        preconditions:
          - "caller X-User-ID == request.interpreter_id"
          - "request.status == ASSIGNED"
        side_effects:
          - "declined_interpreter_ids += current interpreter_id; interpreter_id -> null"
          - "Interpreter.committed_minutes -= assigned_minutes"
      - from: [REQUESTED, ASSIGNED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /conf/interpreter-requests/{id}/cancel, or system (booking cancelled/rescheduled, teacher deactivation, family restriction, student withdrawal)"
        actor: FrontOfficeStaff | SchoolAdmin | system
        preconditions: []
        side_effects:
          - "if status was ASSIGNED: Interpreter.committed_minutes -= assigned_minutes (CONFIRMED retains committed minutes for pay; minutes stay committed until window COMPLETED|ARCHIVED)"
      - from: REQUESTED
        to: UNFILLED
        trigger: "system (window lock)"
        actor: system
        preconditions: []
        side_effects: ["create OutreachTask(kind=LANGUAGE_ACCESS, status=OPEN) for the family"]

  - entity: WaitlistEntry
    field: status
    initial_state: WAITING
    terminal_states: [CLAIMED, EXPIRED, WITHDRAWN, EXHAUSTED]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "system (promotion selector on a slot becoming OPEN, or run-ops sweep)"
        actor: system
        preconditions:
          - "entry.status == WAITING; entry.teacher_id == slot.teacher_id; entry.window_id == slot.window_id"
          - "channel compatible: channel_pref == EITHER or matches slot.channel_allowed (slot EITHER accepts any pref)"
          - "slot not in entry.declined_slot_ids"
          - "booking preconditions would pass for this entry on this slot (link exists, no duplicate, caps, family gap rule)"
          - "entry has minimal priority_score among... NO — highest: selector ranks candidates priority_score DESC, tie created_at ASC; first eligible wins"
        side_effects:
          - "slot OPEN -> HELD; offered_slot_id set; offer_expires_at = clock + window.waitlist_offer_ttl_hours; offers_made_count += 1"
      - from: OFFERED
        to: CLAIMED
        trigger: "POST /conf/waitlist-entries/{id}/claim"
        actor: FamilyGuardian | FrontOfficeStaff | SchoolAdmin
        preconditions:
          - "entry.status == OFFERED (else ERR_NO_ACTIVE_OFFER)"
          - "logical clock <= offer_expires_at (inclusive; else ERR_OFFER_EXPIRED)"
          - "FamilyGuardian caller owns entry.family_id"
          - "booking validations re-run against the offered slot (link, duplicate, caps, family gap, channel of chosen channel input)"
        side_effects:
          - "create Booking (CONFIRMED) on offered slot; slot HELD -> BOOKED"
          - "if interpreter_language supplied, auto-create InterpreterRequest"
          - "recompute family_compactness_score and window counters"
      - from: OFFERED
        to: WAITING
        trigger: "POST /conf/waitlist-entries/{id}/decline-offer, or system run-ops expiry sweep (offer_expires_at < clock)"
        actor: FamilyGuardian | FrontOfficeStaff | SchoolAdmin | system
        preconditions:
          - "offers_made_count < 2 (MAX_OFFERS); otherwise transitions to EXHAUSTED instead"
        side_effects:
          - "declined_slot_ids += offered_slot_id; offered_slot_id -> null; offer_expires_at -> null"
          - "slot HELD -> OPEN and promotion sweep re-runs (this entry is ineligible for the same slot)"
      - from: OFFERED
        to: EXHAUSTED
        trigger: "system (decline or expiry when offers_made_count == 2)"
        actor: system
        preconditions: []
        side_effects: ["slot HELD -> OPEN; promotion sweep re-runs"]
      - from: WAITING
        to: WITHDRAWN
        trigger: "POST /conf/waitlist-entries/{id}/withdraw, or system (family restricted, student withdrawn, teacher deactivated)"
        actor: FamilyGuardian | FrontOfficeStaff | SchoolAdmin | system
        preconditions: ["entry.status in {WAITING, OFFERED} (OFFERED withdraw releases the HELD slot -> OPEN with promotion sweep)"]
        side_effects: ["recompute window waitlist_waiting_count"]
      - from: [WAITING, OFFERED]
        to: EXPIRED
        trigger: "system (window lock)"
        actor: system
        preconditions: []
        side_effects: ["OFFERED entries release HELD slot -> OPEN (no promotion; window is locking)"]

  - entity: Interpreter
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /conf/interpreters/{id} with status=INACTIVE"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "InterpreterRequests ASSIGNED to this interpreter -> REQUESTED (interpreter_id -> null, committed_minutes -= assigned_minutes); CONFIRMED requests are honored and unchanged"
      - from: INACTIVE
        to: ACTIVE
        trigger: "PATCH /conf/interpreters/{id} with status=ACTIVE"
        actor: SchoolAdmin
        preconditions: []
        side_effects: []

  - entity: OutreachTask
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: OPEN
        to: CONTACTED
        trigger: "POST /conf/outreach-tasks/{id}/contact"
        actor: FrontOfficeStaff | SchoolAdmin
        preconditions: ["task.status == OPEN (else ERR_INVALID_STATE)"]
        side_effects: ["attempts_count += 1"]
      - from: CONTACTED
        to: CONTACTED
        trigger: "POST /conf/outreach-tasks/{id}/contact"
        actor: FrontOfficeStaff | SchoolAdmin
        preconditions: []
        side_effects: ["attempts_count += 1"]
      - from: [OPEN, CONTACTED]
        to: RESOLVED
        trigger: "POST /conf/outreach-tasks/{id}/resolve"
        actor: FrontOfficeStaff | SchoolAdmin
        preconditions: []
        side_effects: []
      - from: [OPEN, CONTACTED]
        to: DISMISSED
        trigger: "POST /conf/outreach-tasks/{id}/dismiss"
        actor: FrontOfficeStaff | SchoolAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: window-config-update-stale
    parent_entity: ConferenceWindow
    write_endpoint: "PATCH /conf/windows/{id}"
    occ_field: expected_window_version
    description: |
      Updating a ConferenceWindow's configuration against a version the client
      observed earlier is rejected when the window's version has since advanced
      (e.g., another admin edited caps or a generate-slots run bumped it).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: window-slot-generation-stale
    parent_entity: ConferenceWindow
    write_endpoint: "POST /conf/windows/{id}/generate-slots"
    occ_field: expected_window_version
    description: |
      Running slot generation against a stale ConferenceWindow version is
      rejected: generation destroys and recreates the slot grid, so the caller
      must have observed the current version (which advances on every prior
      generation and on every config edit).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: booking-reschedule-stale
    parent_entity: Booking
    write_endpoint: "POST /conf/bookings/{id}/reschedule"
    occ_field: expected_booking_version
    description: |
      Rescheduling a Booking whose version has advanced since the client read
      it is rejected. This captures the create-with-supersede pattern: a prior
      reschedule already produced a successor, so the current writer's view of
      the booking is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: slot_grid_generation
    trigger: "POST /conf/windows/{id}/generate-slots (window PUBLISHED, expected_window_version matches)"
    algorithm: interval_merge
    formula: |
      constants: BREAK_EVERY = 4, BREAK_EXTRA_MINUTES = 15.
      Eligible teachers: Teacher.status == ACTIVE and (grade_band == window.format or grade_band == BOTH).
      For each day_window d, for each eligible teacher:
        t = d.start_at; placed = 0
        while t + slot_length_minutes <= d.end_at:
            emit TimeSlot(window, teacher, day_label=d.date, start=t, end=t+L, status=OPEN,
                          channel_allowed = EITHER if supports_in_person and supports_virtual
                                          else IN_PERSON if supports_in_person
                                          else VIRTUAL if supports_virtual)
            placed += 1
            t = t + slot_length_minutes + buffer_minutes
            if placed % BREAK_EVERY == 0: t = t + BREAK_EXTRA_MINUTES
      Regeneration (slots exist): allowed only when no booking references any slot of this window
      (else ERR_SLOTS_ALREADY_BOOKED); existing slots -> RETIRED and a fresh grid is created.
      Teachers with supports_in_person == false and supports_virtual == false are skipped.
    input_set: "ACTIVE teachers matching format; day_windows of this window"
    constants: { BREAK_EVERY: 4, BREAK_EXTRA_MINUTES: 15 }
    precision: "integer minutes; datetimes exact to the second"

  - name: teacher_utilization_pct
    trigger: "GET /conf/teachers/{id}/summary?window_id=..."
    algorithm: forward_looking
    formula: |
      bookable_slots = count(TimeSlot of teacher in window with status in {OPEN, BLOCKED, HELD, BOOKED})  # excludes RETIRED
      booked = count(status == BOOKED); held = count(status == HELD)
      waiting = count(WaitlistEntry of (teacher, window) with status == WAITING)
      booked_pct = round_half_up(100 * booked / bookable_slots, 2)   # 0.00 when bookable_slots == 0
    input_set: "TimeSlots and WaitlistEntries for (teacher, window)"
    constants: { WAITLIST_CLAIM_RATE: 0.5 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: booked
        when: "actual utilization reported as booked_utilization_pct"
        difference: "counts BOOKED slots only"
      - name: projected
        when: "forward-looking utilization reported as projected_utilization_pct"
        difference: "projected_pct = round_half_up(100 * (booked + held + ceil(waiting * WAITLIST_CLAIM_RATE)) / bookable_slots, 2); same data yields a strictly larger number whenever held + expected claims > 0"

  - name: family_attendance_risk
    trigger: "after every AttendanceRecord creation for a booking of this family; after clear-strikes (strike_count only)"
    algorithm: aggregation
    formula: |
      strict = 1.0 * count(AttendanceRecord with outcome == NO_SHOW over all bookings of family)
      weighted = 1.0 * count(NO_SHOW) + 0.5 * count(LATE) + 0.25 * count(EXCUSED)
      no_show_strike_count = max(0, count(NO_SHOW) - strikes_cleared_total)
    input_set: "lifetime AttendanceRecords of the family's bookings (any window, any booking status)"
    constants: { W_NO_SHOW: 1.0, W_LATE: 0.5, W_EXCUSED: 0.25 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: strict
        when: "stored as Family.attendance_risk_strict; also feeds waitlist risk penalty"
        difference: "only NO_SHOW counts"
      - name: weighted
        when: "stored as Family.attendance_risk_score"
        difference: "same records produce a larger value whenever LATE or EXCUSED records exist (e.g. 1 NO_SHOW + 1 LATE + 1 EXCUSED -> strict 1.00 vs weighted 1.75)"

  - name: waitlist_priority_score
    trigger: "WaitlistEntry creation; run-ops refresh; sibling booking confirm; family risk change"
    algorithm: weighted_scoring
    formula: |
      score = 100
            + 50 * (1 if StudentTeacherLink(student, teacher).required_conference else 0)
            + 15 * min(count(siblings of student with a CONFIRMED booking in this window), 2)
            - 10 * min(floor(family.attendance_risk_strict), 5)
            + 5  * min(floor(hours_since_entry_created_at / 24), 4)
      floor at 0. Siblings = other Students with same family_id.
    input_set: "the entry's student/teacher link, family's strict risk, sibling bookings in window, entry created_at vs logical clock"
    constants: { BASE: 100, REQUIRED_BONUS: 50, SIBLING_BONUS: 15, SIBLING_CAP: 2, RISK_PENALTY_PER_POINT: 10, RISK_CAP: 5, WAIT_BONUS_PER_DAY: 5, WAIT_CAP_DAYS: 4 }
    precision: "2 decimal places, round_half_up"

  - name: sibling_compactness_score
    trigger: "after every Booking mutation (create, cancel, reschedule, claim) for the (family, window) pair; result stored on every booking of that family in that window as family_compactness_score"
    algorithm: aggregation
    formula: |
      Let B = bookings of (family, window) with status in {CONFIRMED, COMPLETED, NO_SHOW}, sorted by slot.start_at ASC
      (ties impossible: the family gap rule forbids overlapping/equal-start bookings).
      score = sum over adjacent pairs (b1, b2):
          gap_minutes = minutes between b1.slot.end_at and b2.slot.start_at
          tier = 1 if gap_minutes <= 15 else 3 if gap_minutes <= 45 else 8
          points = tier * (2 if b1.channel != b2.channel else 1)
      Single-booking families score 0.00.
    input_set: "non-terminal bookings of the family in the window with their slots and channels"
    constants: { TIER1_MAX_MIN: 15, TIER1_PTS: 1, TIER2_MAX_MIN: 45, TIER2_PTS: 3, TIER3_PTS: 8, CHANNEL_SWITCH_MULT: 2 }
    precision: "2 decimal places, round_half_up"

  - name: interpreter_window_capacity
    trigger: "evaluated on every interpreter assignment check; exposed on GET /conf/interpreters/{id}/summary"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned (circular-looking dependency):
        (1) committed_in_window = sum(assigned_minutes of ASSIGNED|CONFIRMED InterpreterRequests of this interpreter in this window)
        (2) break_allowance = BREAK_ALLOWANCE_PER_RUN * floor(committed_in_window / RUN_LENGTH_MINUTES)
        (3) capacity_minutes = max(0, base_minutes_per_window - break_allowance)
        (4) headroom_minutes = capacity_minutes - committed_in_window
        (5) eligibility: new assignment allowed iff committed_in_window + new assigned_minutes <= capacity_minutes
      Because capacity depends on committed (step 2 consumes step 1), the order MUST NOT be reversed.
    input_set: "ASSIGNED|CONFIRMED requests of (interpreter, window)"
    constants: { RUN_LENGTH_MINUTES: 45, BREAK_ALLOWANCE_PER_RUN: 10 }
    precision: "integer minutes"

  - name: interpreter_fatigue_run
    trigger: "evaluated on every interpreter assignment check (assign endpoint)"
    algorithm: chronological
    formula: |
      Take all ASSIGNED|CONFIRMED assignments of the interpreter plus the candidate, each an interval
      [slot.start_at, slot.end_at); sort by start_at ASC (tie-break: created_at ASC).
      Merge into runs where the next interval starts exactly when the previous ends (zero gap).
      run_length = sum of minutes in each run. Allowed iff max(run_length) <= max_consecutive_minutes.
    input_set: "interpreter's ASSIGNED|CONFIRMED requests across ALL non-archived windows"
    constants: {}
    precision: "integer minutes"

  - name: interpreter_pay_estimate
    trigger: "GET /conf/interpreters/{id}/summary?window_id=..."
    algorithm: aggregation
    formula: |
      Rounding order is pinned: round PER ASSIGNMENT, then sum.
      For each CONFIRMED InterpreterRequest of (interpreter, window):
          billable_units = ceil(assigned_minutes / BILL_UNIT_MINUTES)
          pay_cents = round_half_up(billable_units * BILL_UNIT_MINUTES * hourly_rate_cents / 60)
      pay_estimate_cents = sum(pay_cents)
      (The alternative order — sum minutes, then round once — yields a different total and is NOT used.)
    input_set: "CONFIRMED requests of (interpreter, window)"
    constants: { BILL_UNIT_MINUTES: 15 }
    precision: "integer cents; per-assignment round_half_up then integer sum"

  - name: family_gap_requirement
    trigger: "booking create, reschedule, and waitlist claim/promotion eligibility for a family"
    algorithm: interval_merge
    formula: |
      required_gap(a.channel, b.channel) =
          0                        if both VIRTUAL
          window.buffer_minutes    if both IN_PERSON
          window.travel_minutes    if channels differ
      For the candidate booking c and every existing booking b of the same family in the window
      with status in {CONFIRMED, COMPLETED, NO_SHOW}: the pair conflicts unless
          c.slot.start_at >= b.slot.end_at + required_gap(b.channel, c.channel)
       OR b.slot.start_at >= c.slot.end_at + required_gap(c.channel, b.channel)
      Boundary: a gap exactly EQUAL to required_gap is allowed (>= semantics).
    input_set: "family's non-terminal bookings in the window"
    constants: {}
    precision: "integer minutes; datetimes exact to the second"

  - name: waitlist_promotion_selector
    trigger: "any TimeSlot transition into OPEN while window.status == BOOKING_OPEN; run-ops sweep"
    algorithm: weighted_scoring
    formula: |
      candidates = WaitlistEntry with status == WAITING, teacher_id == slot.teacher_id, window_id == slot.window_id,
                   slot.id not in declined_slot_ids, channel_pref compatible
                   (pref EITHER always; pref IN_PERSON needs slot.channel_allowed in {IN_PERSON, EITHER}; VIRTUAL likewise),
                   and all booking preconditions satisfiable (link, duplicate, caps, family gap).
      ranking = priority_score DESC, tie created_at ASC, final tie created_seq ASC.
      Offer the first ranked candidate that passes all eligibility checks (skip ineligible candidates
      and continue down the ranking). Empty pool -> slot stays OPEN.
    input_set: "WAITING entries of (teacher, window)"
    constants: {}
    precision: "n/a (selector)"

  - name: attendance_report
    trigger: "GET /conf/windows/{id}/attendance-report"
    algorithm: aggregation
    formula: |
      counts over bookings of the window grouped by status.
      attendance_rate_pct = round_half_up(100 * COMPLETED / (COMPLETED + NO_SHOW), 2)
      no_show_rate_pct    = round_half_up(100 * NO_SHOW / (COMPLETED + NO_SHOW), 2)
      When COMPLETED + NO_SHOW == 0 both rates are 0.00.
      open_outreach_tasks = count(OutreachTask of window with status in {OPEN, CONTACTED}).
    input_set: "all Bookings and OutreachTasks of the window (any status)"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: no_show_strike_restriction
    trigger: "after each NO_SHOW AttendanceRecord (manual or run-ops auto)"
    algorithm: threshold
    formula: |
      recompute no_show_strike_count (see family_attendance_risk)
      if Family.status == ACTIVE and no_show_strike_count >= triggering window's no_show_strike_threshold:
          Family -> RESTRICTED (cascade per Family state machine)
      Boundary: strike_count == threshold triggers; threshold - 1 does not (>= semantics).
    input_set: "lifetime NO_SHOW records minus strikes_cleared_total"
    constants: {}
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the five declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "caller's role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "entity-backed ownership: FamilyGuardian acts only on own family/students/bookings/waitlist entries; Teacher only on own slots/bookings; Interpreter only on own requests", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "scoped endpoints (bookings, waitlist, slots block/unblock, attendance, interpreter accept/decline, family PATCH/GET, family students)" }
  - { priority: 4, category: existence, check: "request body well-formed: required fields present, types valid, enum members valid, ranges valid (grade_level 0..12, positive minutes/caps)", error_id: ERR_VALIDATION, http_status: 422, applies_to: "all endpoints with a request body" }
  - { priority: 5, category: existence, check: "path parameters resolve to existing resources, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 6, category: existence, check: "OCC: expected_window_version / expected_booking_version equals the entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /conf/windows/{id}, POST /conf/windows/{id}/generate-slots, POST /conf/bookings/{id}/reschedule" }
  - { priority: 7, category: state, check: "window status allows the operation: bookings/cancel/reschedule/waitlist-join need BOOKING_OPEN; publish needs DRAFT; open-booking needs PUBLISHED; lock needs BOOKING_OPEN; start needs LOCKED; complete needs IN_PROGRESS; archive needs COMPLETED; generate-slots needs PUBLISHED; slot block/unblock needs PUBLISHED or BOOKING_OPEN; attendance needs IN_PROGRESS or COMPLETED", error_id: ERR_INVALID_WINDOW_STATE, http_status: 409, applies_to: "window-gated endpoints" }
  - { priority: 8, category: state, check: "entity state allows the operation: slot OPEN for booking / BLOCKED for unblock / OFFERED entry for claim; booking CONFIRMED (or NO_SHOW for staff reschedule); request ASSIGNED for accept/decline; family ACTIVE for self-service (ERR_FAMILY_RESTRICTED); teacher ACTIVE for booking (ERR_TEACHER_INACTIVE); slot availability (ERR_SLOT_NOT_AVAILABLE); offer presence (ERR_NO_ACTIVE_OFFER); grid fields immutable once slots exist (ERR_WINDOW_GRID_LOCKED); regeneration blocked by existing bookings (ERR_SLOTS_ALREADY_BOOKED)", error_id: "ERR_INVALID_STATE | ERR_FAMILY_RESTRICTED | ERR_TEACHER_INACTIVE | ERR_SLOT_NOT_AVAILABLE | ERR_NO_ACTIVE_OFFER | ERR_WINDOW_GRID_LOCKED | ERR_SLOTS_ALREADY_BOOKED", http_status: 409, applies_to: "state-gated endpoints" }
  - { priority: 9, category: business_safety, check: "interpreter fatigue: longest zero-gap run of assignments including candidate <= max_consecutive_minutes", error_id: ERR_INTERPRETER_FATIGUE, http_status: 422, applies_to: "POST /conf/interpreter-requests/{id}/assign" }
  - { priority: 10, category: business_temporal, check: "time gates: open-booking requires clock >= booking_open_at (ERR_BOOKING_WINDOW_NOT_OPEN); lock requires clock >= booking_close_at (ERR_BOOKING_WINDOW_NOT_CLOSED); family cancel/reschedule requires clock <= slot.start_at - cancel_cutoff_hours (ERR_CANCELLATION_CUTOFF); waitlist claim requires clock <= offer_expires_at inclusive (ERR_OFFER_EXPIRED); day_windows end > start (ERR_INVALID_DAY_WINDOW); family cross-booking gap rule per family_gap_requirement (ERR_FAMILY_SCHEDULE_CONFLICT); interpreter half-open overlap (ERR_INTERPRETER_OVERLAP)", error_id: "ERR_BOOKING_WINDOW_NOT_OPEN | ERR_BOOKING_WINDOW_NOT_CLOSED | ERR_CANCELLATION_CUTOFF | ERR_OFFER_EXPIRED | ERR_INVALID_DAY_WINDOW | ERR_FAMILY_SCHEDULE_CONFLICT | ERR_INTERPRETER_OVERLAP", http_status: 422, applies_to: "temporal endpoints" }
  - { priority: 11, category: business_constraint, check: "uniqueness and format rules: one CONFIRMED booking per (student, teacher) per window and, for ELEMENTARY windows, at most one CONFIRMED booking per student per window (ERR_DUPLICATE_BOOKING); one WAITING|OFFERED waitlist entry per (student, teacher, window) and none when a CONFIRMED booking exists for that pair (ERR_DUPLICATE_WAITLIST_ENTRY); one link per (student, teacher) (ERR_DUPLICATE_TEACHER_LINK); booking.channel allowed by slot.channel_allowed and teacher supports flags (ERR_CHANNEL_NOT_ALLOWED); interpreter language coverage (ERR_LANGUAGE_NOT_COVERED); at most one non-terminal InterpreterRequest per booking (ERR_ALREADY_HAS_INTERPRETER_REQUEST)", error_id: "ERR_DUPLICATE_BOOKING | ERR_DUPLICATE_WAITLIST_ENTRY | ERR_DUPLICATE_TEACHER_LINK | ERR_CHANNEL_NOT_ALLOWED | ERR_LANGUAGE_NOT_COVERED | ERR_ALREADY_HAS_INTERPRETER_REQUEST", http_status: 409, applies_to: "booking, waitlist, link, interpreter-request endpoints" }
  - { priority: 12, category: business_referential, check: "body-referenced ids exist (ERR_NOT_FOUND); student belongs to acting family (ERR_FORBIDDEN at p3 for guardians); student ENROLLED (ERR_STUDENT_NOT_BOOKABLE); StudentTeacherLink exists between student and slot's teacher — ELEMENTARY requires is_homeroom == true (ERR_TEACHER_NOT_LINKED)", error_id: "ERR_NOT_FOUND | ERR_STUDENT_NOT_BOOKABLE | ERR_TEACHER_NOT_LINKED", http_status: 422, applies_to: "booking create/reschedule/claim, waitlist join, link create, interpreter-request create" }
  - { priority: 13, category: business_capacity, check: "capacity: teacher daily CONFIRMED count < min(window.teacher_daily_conf_cap, teacher.daily_conf_cap_override if set) (ERR_TEACHER_DAY_FULL); family window CONFIRMED count < window.family_conf_cap (ERR_FAMILY_LIMIT_REACHED); interpreter per-window capacity per interpreter_window_capacity (ERR_INTERPRETER_CAPACITY_EXCEEDED); auto-assign empty candidate pool (ERR_NO_ELIGIBLE_INTERPRETER)", error_id: "ERR_TEACHER_DAY_FULL | ERR_FAMILY_LIMIT_REACHED | ERR_INTERPRETER_CAPACITY_EXCEEDED | ERR_NO_ELIGIBLE_INTERPRETER", http_status: 422, applies_to: "booking create/reschedule/claim, waitlist join, interpreter assign" }
  - { priority: 14, category: state, check: "archive guard: no OutreachTask of window in OPEN or CONTACTED", error_id: ERR_OPEN_OUTREACH_TASKS, http_status: 409, applies_to: "POST /conf/windows/{id}/archive" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/conf/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [SchoolAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all time-gated rules evaluate against this clock"]

  # --- ConferenceWindow ---
  - method: POST
    path: "/conf/windows"
    description: "Create a conference window (status DRAFT)"
    roles: [SchoolAdmin]
    code: 201
    input: [name, term_label, format, slot_length_minutes, buffer_minutes, travel_minutes, day_windows, booking_open_at, booking_close_at, teacher_daily_conf_cap, "family_conf_cap?", "cancel_cutoff_hours?", "waitlist_offer_ttl_hours?", "no_show_strike_threshold?", "auto_no_show_grace_hours?"]
    output: ConferenceWindow
    side_effects: ["status=DRAFT, ops_run_index=0, all counters 0, version=1"]
  - method: GET
    path: "/conf/windows"
    description: "List windows with filters and pagination"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher, FamilyGuardian, Interpreter]
    code: 200
    input: ["status?", "format?", "limit?", "offset?"]
    output: ConferenceWindow[]
    side_effects: []
  - method: GET
    path: "/conf/windows/{id}"
    description: "Get one window"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher, FamilyGuardian, Interpreter]
    code: 200
    input: []
    output: ConferenceWindow
    side_effects: []
  - method: PATCH
    path: "/conf/windows/{id}"
    description: "Update window config. DRAFT: all fields. PUBLISHED: non-grid fields only (grid fields slot_length_minutes/buffer_minutes/day_windows rejected once slots exist -> ERR_WINDOW_GRID_LOCKED). OCC via expected_window_version."
    roles: [SchoolAdmin]
    code: 200
    input: [expected_window_version, "name?", "booking_open_at?", "booking_close_at?", "teacher_daily_conf_cap?", "family_conf_cap?", "cancel_cutoff_hours?", "waitlist_offer_ttl_hours?", "no_show_strike_threshold?", "auto_no_show_grace_hours?", "travel_minutes?", "slot_length_minutes?", "buffer_minutes?", "day_windows?"]
    output: ConferenceWindow
    side_effects: ["increments ConferenceWindow.version by 1"]
  - method: POST
    path: "/conf/windows/{id}/publish"
    description: "DRAFT -> PUBLISHED"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: ConferenceWindow
    side_effects: ["increments ConferenceWindow.version by 1"]
  - method: POST
    path: "/conf/windows/{id}/generate-slots"
    description: "Slice day_windows into per-teacher TimeSlots per slot_grid_generation. OCC via expected_window_version. Re-generation retires old grid and is refused once any booking exists (ERR_SLOTS_ALREADY_BOOKED)."
    roles: [SchoolAdmin]
    code: 200
    input: [expected_window_version]
    output: ConferenceWindow
    side_effects: ["creates TimeSlot rows", "recomputes slots_* counters", "increments ConferenceWindow.version by 1"]
  - method: POST
    path: "/conf/windows/{id}/open-booking"
    description: "PUBLISHED -> BOOKING_OPEN (requires clock >= booking_open_at and slots generated)"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: ConferenceWindow
    side_effects: ["increments ConferenceWindow.version by 1"]
  - method: POST
    path: "/conf/windows/{id}/lock"
    description: "BOOKING_OPEN -> LOCKED (requires clock >= booking_close_at); unfills requests and expires waitlist entries"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: ConferenceWindow
    side_effects: ["REQUESTED InterpreterRequests -> UNFILLED + LANGUAGE_ACCESS outreach", "WAITING/OFFERED WaitlistEntries -> EXPIRED (HELD slots -> OPEN)", "increments ConferenceWindow.version by 1"]
  - method: POST
    path: "/conf/windows/{id}/start"
    description: "LOCKED -> IN_PROGRESS"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: ConferenceWindow
    side_effects: ["increments ConferenceWindow.version by 1"]
  - method: POST
    path: "/conf/windows/{id}/complete"
    description: "IN_PROGRESS -> COMPLETED"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: ConferenceWindow
    side_effects: ["increments ConferenceWindow.version by 1"]
  - method: POST
    path: "/conf/windows/{id}/archive"
    description: "COMPLETED -> ARCHIVED; blocked while OPEN/CONTACTED outreach tasks exist (ERR_OPEN_OUTREACH_TASKS)"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: ConferenceWindow
    side_effects: ["increments ConferenceWindow.version by 1"]
  - method: POST
    path: "/conf/windows/{id}/run-ops"
    description: "Ops checkpoint: ops_run_index += 1; expire OFFERED entries with offer_expires_at < clock (slot HELD -> OPEN + promotion re-run); auto-NO_SHOW CONFIRMED bookings whose slot.end_at + auto_no_show_grace_hours <= clock while window IN_PROGRESS or COMPLETED; refresh WAITING priority_score"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: ConferenceWindow
    side_effects: ["offer expiry sweep", "auto-no-show sweep with full NO_SHOW cascade", "priority refresh", "increments ConferenceWindow.version by 1"]
  - method: GET
    path: "/conf/windows/{id}/slots"
    description: "List slots of a window with filters; sorted by start_at ASC then created_at ASC"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher, FamilyGuardian, Interpreter]
    code: 200
    input: ["teacher_id?", "status?", "day_label?", "channel_allowed?", "limit?", "offset?"]
    output: TimeSlot[]
    side_effects: []
  - method: GET
    path: "/conf/windows/{id}/attendance-report"
    description: "Computed attendance report per attendance_report calculation"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 200
    input: []
    output: { window_id: string, bookings_confirmed: integer, bookings_completed: integer, bookings_no_show: integer, bookings_excused: integer, bookings_cancelled: integer, bookings_rescheduled: integer, attendance_rate_pct: number, no_show_rate_pct: number, open_outreach_tasks: integer }
    side_effects: []

  # --- Teacher ---
  - method: POST
    path: "/conf/teachers"
    description: "Create a teacher (status ACTIVE)"
    roles: [SchoolAdmin]
    code: 201
    input: [full_name, email, grade_band, subjects, "room_location?", "supports_in_person?", "supports_virtual?", "daily_conf_cap_override?"]
    output: Teacher
    side_effects: ["status=ACTIVE, version=1"]
  - method: GET
    path: "/conf/teachers"
    description: "List teachers"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher, FamilyGuardian, Interpreter]
    code: 200
    input: ["status?", "grade_band?", "limit?", "offset?"]
    output: Teacher[]
    side_effects: []
  - method: GET
    path: "/conf/teachers/{id}"
    description: "Get one teacher"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher, FamilyGuardian, Interpreter]
    code: 200
    input: []
    output: Teacher
    side_effects: []
  - method: PATCH
    path: "/conf/teachers/{id}"
    description: "Update teacher; status=INACTIVE runs the deactivation cascade (retire slots, cancel bookings, cancel requests, withdraw waitlist entries)"
    roles: [SchoolAdmin]
    code: 200
    input: ["full_name?", "room_location?", "supports_in_person?", "supports_virtual?", "daily_conf_cap_override?", "status?"]
    output: Teacher
    side_effects: ["deactivation cascade per Teacher state machine", "increments Teacher.version by 1"]
  - method: GET
    path: "/conf/teachers/{id}/slots"
    description: "List slots of a teacher (reverse reachability for TimeSlot.teacher_id); sorted by start_at ASC then created_at ASC"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher]
    code: 200
    input: ["window_id?", "status?", "limit?", "offset?"]
    output: TimeSlot[]
    side_effects: []
  - method: GET
    path: "/conf/teachers/{id}/teacher-links"
    description: "List links of a teacher (reverse reachability for StudentTeacherLink.teacher_id)"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher]
    code: 200
    input: ["limit?", "offset?"]
    output: StudentTeacherLink[]
    side_effects: []
  - method: GET
    path: "/conf/teachers/{id}/summary"
    description: "Computed utilization summary per teacher_utilization_pct (window_id required)"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher]
    code: 200
    input: [window_id]
    output: { teacher_id: string, window_id: string, bookable_slots: integer, booked_slots: integer, held_slots: integer, open_slots: integer, waiting_entries: integer, booked_utilization_pct: number, projected_utilization_pct: number }
    side_effects: []

  # --- Family ---
  - method: POST
    path: "/conf/families"
    description: "Register a family (status ACTIVE)"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 201
    input: [primary_guardian_name, email, "phone?", "preferred_language?"]
    output: Family
    side_effects: ["status=ACTIVE, strike fields 0, version=1"]
  - method: GET
    path: "/conf/families/{id}"
    description: "Get one family (FamilyGuardian limited to own id)"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 200
    input: []
    output: Family
    side_effects: []
  - method: PATCH
    path: "/conf/families/{id}"
    description: "Update family contact fields (FamilyGuardian limited to own id)"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 200
    input: ["primary_guardian_name?", "email?", "phone?", "preferred_language?"]
    output: Family
    side_effects: ["increments Family.version by 1"]
  - method: POST
    path: "/conf/families/{id}/clear-strikes"
    description: "RESTRICTED -> ACTIVE; strikes_cleared_total += current no_show_strike_count"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 200
    input: []
    output: Family
    side_effects: ["no_show_strike_count recomputes to 0", "status -> ACTIVE", "increments Family.version by 1"]
  - method: GET
    path: "/conf/families/{id}/students"
    description: "List students of a family (reverse reachability for Student.family_id)"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 200
    input: ["limit?", "offset?"]
    output: Student[]
    side_effects: []
  - method: POST
    path: "/conf/families/{id}/students"
    description: "Register a student under a family"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 201
    input: [full_name, grade_level]
    output: Student
    side_effects: ["enrollment_status=ENROLLED"]

  # --- Student ---
  - method: GET
    path: "/conf/students/{id}"
    description: "Get one student"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: POST
    path: "/conf/students/{id}/withdraw"
    description: "ENROLLED -> WITHDRAWN with cancellation cascade"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 200
    input: []
    output: Student
    side_effects: ["future CONFIRMED bookings -> CANCELLED (STUDENT_WITHDRAWN) with promotion sweeps", "open interpreter requests on them -> CANCELLED", "WAITING/OFFERED waitlist entries -> WITHDRAWN"]
  - method: GET
    path: "/conf/students/{id}/teacher-links"
    description: "List links of a student (reverse reachability for StudentTeacherLink.student_id)"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 200
    input: ["limit?", "offset?"]
    output: StudentTeacherLink[]
    side_effects: []
  - method: POST
    path: "/conf/students/{id}/teacher-links"
    description: "Link a student to a teacher (unique per pair -> ERR_DUPLICATE_TEACHER_LINK)"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 201
    input: [teacher_id, "is_homeroom?", "required_conference?"]
    output: StudentTeacherLink
    side_effects: []
  - method: DELETE
    path: "/conf/teacher-links/{id}"
    description: "Remove a student-teacher link"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 204
    input: []
    output: null
    side_effects: []

  # --- TimeSlot ---
  - method: GET
    path: "/conf/slots/{id}"
    description: "Get one slot"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher, FamilyGuardian, Interpreter]
    code: 200
    input: []
    output: TimeSlot
    side_effects: []
  - method: POST
    path: "/conf/slots/{id}/block"
    description: "OPEN -> BLOCKED (Teacher limited to own slots)"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher]
    code: 200
    input: ["reason?"]
    output: TimeSlot
    side_effects: ["recomputes window slots_open_count", "increments TimeSlot.version by 1"]
  - method: POST
    path: "/conf/slots/{id}/unblock"
    description: "BLOCKED -> OPEN; if window BOOKING_OPEN the promotion selector may immediately move it to HELD"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher]
    code: 200
    input: []
    output: TimeSlot
    side_effects: ["promotion sweep", "recomputes window counters", "increments TimeSlot.version by 1"]

  # --- Booking ---
  - method: POST
    path: "/conf/bookings"
    description: "Family self-service or staff on-behalf booking of an OPEN slot. teacher/window/family derived from slot+student. Auto-creates InterpreterRequest when interpreter_language non-null."
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 201
    input: [slot_id, student_id, channel, "interpreter_language?"]
    output: Booking
    side_effects: ["slot OPEN -> BOOKED", "optional InterpreterRequest auto-create (REQUESTED)", "recompute family_compactness_score", "recompute window counters"]
  - method: GET
    path: "/conf/bookings"
    description: "List bookings with filters (reverse reachability for all Booking FKs including self-FK rescheduled_from_booking_id); sorted by created_at ASC"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher, FamilyGuardian]
    code: 200
    input: ["window_id?", "family_id?", "student_id?", "teacher_id?", "slot_id?", "rescheduled_from_booking_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: GET
    path: "/conf/bookings/{id}"
    description: "Get one booking (Teacher limited to own bookings; FamilyGuardian to own family)"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher, FamilyGuardian]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: POST
    path: "/conf/bookings/{id}/cancel"
    description: "CONFIRMED -> CANCELLED; family callers honor cancel cutoff, staff bypass"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 200
    input: ["reason?"]
    output: Booking
    side_effects: ["slot BOOKED -> OPEN + promotion sweep", "open InterpreterRequest -> CANCELLED", "recompute compactness and counters", "increments Booking.version by 1"]
  - method: POST
    path: "/conf/bookings/{id}/reschedule"
    description: "CONFIRMED (family/staff) or NO_SHOW (staff) -> RESCHEDULED with successor booking on new_slot_id. OCC via expected_booking_version."
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 200
    input: [new_slot_id, expected_booking_version, "channel?"]
    output: Booking
    side_effects: ["old booking -> RESCHEDULED, increments old Booking.version by 1", "successor Booking created (version 1, rescheduled_from_booking_id set)", "old slot OPEN + promotion sweep; new slot BOOKED", "old request CANCELLED + new REQUESTED request when interpreter_language present", "recompute compactness and counters"]
  - method: POST
    path: "/conf/bookings/{id}/attendance"
    description: "Mark attendance: ATTENDED|LATE -> COMPLETED, NO_SHOW -> NO_SHOW with strike cascade, EXCUSED -> EXCUSED"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher]
    code: 200
    input: [outcome, "note?"]
    output: Booking
    side_effects: ["create AttendanceRecord", "recompute family risk fields", "NO_SHOW: strike threshold check + possible RESTRICTED cascade + OutreachTask(NO_SHOW_FOLLOW_UP)", "increments Booking.version by 1"]

  # --- Interpreter ---
  - method: POST
    path: "/conf/interpreters"
    description: "Create an interpreter (status ACTIVE)"
    roles: [SchoolAdmin]
    code: 201
    input: [full_name, languages, max_consecutive_minutes, base_minutes_per_window, hourly_rate_cents, "supports_in_person?", "supports_virtual?"]
    output: Interpreter
    side_effects: ["status=ACTIVE, committed_minutes=0, version=1"]
  - method: GET
    path: "/conf/interpreters"
    description: "List interpreters"
    roles: [SchoolAdmin, FrontOfficeStaff, Interpreter]
    code: 200
    input: ["status?", "language?", "limit?", "offset?"]
    output: Interpreter[]
    side_effects: []
  - method: GET
    path: "/conf/interpreters/{id}"
    description: "Get one interpreter (Interpreter limited to own id)"
    roles: [SchoolAdmin, FrontOfficeStaff, Interpreter]
    code: 200
    input: []
    output: Interpreter
    side_effects: []
  - method: PATCH
    path: "/conf/interpreters/{id}"
    description: "Update interpreter; status=INACTIVE bounces ASSIGNED requests back to REQUESTED"
    roles: [SchoolAdmin]
    code: 200
    input: ["full_name?", "languages?", "max_consecutive_minutes?", "base_minutes_per_window?", "hourly_rate_cents?", "supports_in_person?", "supports_virtual?", "status?"]
    output: Interpreter
    side_effects: ["ASSIGNED requests -> REQUESTED (committed_minutes decremented)", "increments Interpreter.version by 1"]
  - method: GET
    path: "/conf/interpreters/{id}/summary"
    description: "Computed per-window capacity and pay summary (interpreter_window_capacity + interpreter_pay_estimate)"
    roles: [SchoolAdmin, FrontOfficeStaff, Interpreter]
    code: 200
    input: [window_id]
    output: { interpreter_id: string, window_id: string, committed_minutes_in_window: integer, break_allowance_minutes: integer, capacity_minutes: integer, headroom_minutes: integer, confirmed_assignments: integer, pay_estimate_cents: integer }
    side_effects: []

  # --- InterpreterRequest ---
  - method: POST
    path: "/conf/interpreter-requests"
    description: "Manual interpreter request for a CONFIRMED booking without a non-terminal request"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 201
    input: [booking_id, language]
    output: InterpreterRequest
    side_effects: ["status=REQUESTED, assigned_minutes = slot length, channel_required = booking.channel"]
  - method: GET
    path: "/conf/interpreter-requests"
    description: "List interpreter requests (reverse reachability for booking_id, window_id, interpreter_id FKs)"
    roles: [SchoolAdmin, FrontOfficeStaff, Interpreter, FamilyGuardian]
    code: 200
    input: ["booking_id?", "window_id?", "interpreter_id?", "status?", "language?", "limit?", "offset?"]
    output: InterpreterRequest[]
    side_effects: []
  - method: GET
    path: "/conf/interpreter-requests/{id}"
    description: "Get one interpreter request"
    roles: [SchoolAdmin, FrontOfficeStaff, Interpreter, FamilyGuardian]
    code: 200
    input: []
    output: InterpreterRequest
    side_effects: []
  - method: POST
    path: "/conf/interpreter-requests/{id}/assign"
    description: "Assign interpreter explicitly or via auto-selector (least committed_minutes, tie created_at ASC, declined ids excluded); REQUESTED -> ASSIGNED"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 200
    input: ["interpreter_id?"]
    output: InterpreterRequest
    side_effects: ["Interpreter.committed_minutes += assigned_minutes", "increments InterpreterRequest.version by 1"]
  - method: POST
    path: "/conf/interpreter-requests/{id}/accept"
    description: "ASSIGNED -> CONFIRMED (assigned interpreter only)"
    roles: [Interpreter]
    code: 200
    input: []
    output: InterpreterRequest
    side_effects: ["increments InterpreterRequest.version by 1"]
  - method: POST
    path: "/conf/interpreter-requests/{id}/decline"
    description: "ASSIGNED -> REQUESTED; interpreter added to declined_interpreter_ids"
    roles: [Interpreter]
    code: 200
    input: ["reason?"]
    output: InterpreterRequest
    side_effects: ["Interpreter.committed_minutes -= assigned_minutes", "interpreter_id -> null", "increments InterpreterRequest.version by 1"]
  - method: POST
    path: "/conf/interpreter-requests/{id}/cancel"
    description: "REQUESTED|ASSIGNED|CONFIRMED -> CANCELLED"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 200
    input: ["reason?"]
    output: InterpreterRequest
    side_effects: ["ASSIGNED: committed_minutes -= assigned_minutes", "increments InterpreterRequest.version by 1"]

  # --- WaitlistEntry ---
  - method: POST
    path: "/conf/waitlist-entries"
    description: "Join the waitlist for (student, teacher) in a window"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 201
    input: [window_id, student_id, teacher_id, channel_pref]
    output: WaitlistEntry
    side_effects: ["status=WAITING, offers_made_count=0, priority_score computed", "recompute window waitlist_waiting_count"]
  - method: GET
    path: "/conf/waitlist-entries"
    description: "List waitlist entries (reverse reachability for window_id, family_id, student_id, teacher_id, offered_slot_id FKs); sorted by created_at ASC"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 200
    input: ["window_id?", "family_id?", "student_id?", "teacher_id?", "offered_slot_id?", "status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []
  - method: GET
    path: "/conf/waitlist-entries/{id}"
    description: "Get one waitlist entry"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []
  - method: POST
    path: "/conf/waitlist-entries/{id}/claim"
    description: "OFFERED -> CLAIMED; creates the Booking on the offered HELD slot (clock <= offer_expires_at inclusive)"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 201
    input: ["channel?", "interpreter_language?"]
    output: Booking
    side_effects: ["slot HELD -> BOOKED", "Booking CONFIRMED created", "optional InterpreterRequest auto-create", "recompute compactness and counters"]
  - method: POST
    path: "/conf/waitlist-entries/{id}/decline-offer"
    description: "OFFERED -> WAITING (offers_made_count < 2) or EXHAUSTED (== 2); slot released and re-offered to next candidate"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["declined_slot_ids += slot", "slot HELD -> OPEN + promotion re-run", "increments WaitlistEntry.version by 1"]
  - method: POST
    path: "/conf/waitlist-entries/{id}/withdraw"
    description: "WAITING|OFFERED -> WITHDRAWN"
    roles: [SchoolAdmin, FrontOfficeStaff, FamilyGuardian]
    code: 200
    input: ["reason?"]
    output: WaitlistEntry
    side_effects: ["OFFERED: slot HELD -> OPEN + promotion re-run", "recompute waitlist_waiting_count", "increments WaitlistEntry.version by 1"]

  # --- AttendanceRecord ---
  - method: GET
    path: "/conf/attendance-records"
    description: "List attendance records (reverse reachability for AttendanceRecord.booking_id)"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher, FamilyGuardian]
    code: 200
    input: ["booking_id?", "outcome?", "limit?", "offset?"]
    output: AttendanceRecord[]
    side_effects: []
  - method: GET
    path: "/conf/attendance-records/{id}"
    description: "Get one attendance record"
    roles: [SchoolAdmin, FrontOfficeStaff, Teacher, FamilyGuardian]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: []

  # --- OutreachTask ---
  - method: GET
    path: "/conf/outreach-tasks"
    description: "List outreach tasks (reverse reachability for family_id, window_id, booking_id FKs)"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 200
    input: ["family_id?", "window_id?", "booking_id?", "status?", "kind?", "limit?", "offset?"]
    output: OutreachTask[]
    side_effects: []
  - method: GET
    path: "/conf/outreach-tasks/{id}"
    description: "Get one outreach task"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 200
    input: []
    output: OutreachTask
    side_effects: []
  - method: POST
    path: "/conf/outreach-tasks"
    description: "Manual outreach task for a family; window_id optional (copied onto the task for archive-guard scoping)"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 201
    input: [family_id, kind, "booking_id?", "window_id?", "note?"]
    output: OutreachTask
    side_effects: ["status=OPEN, attempts_count=0"]
  - method: POST
    path: "/conf/outreach-tasks/{id}/contact"
    description: "OPEN|CONTACTED -> CONTACTED; attempts_count += 1"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 200
    input: ["note?"]
    output: OutreachTask
    side_effects: ["increments OutreachTask.version by 1"]
  - method: POST
    path: "/conf/outreach-tasks/{id}/resolve"
    description: "OPEN|CONTACTED -> RESOLVED"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 200
    input: ["note?"]
    output: OutreachTask
    side_effects: ["increments OutreachTask.version by 1"]
  - method: POST
    path: "/conf/outreach-tasks/{id}/dismiss"
    description: "OPEN|CONTACTED -> DISMISSED"
    roles: [SchoolAdmin, FrontOfficeStaff]
    code: 200
    input: ["reason?"]
    output: OutreachTask
    side_effects: ["increments OutreachTask.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or entity-backed caller acting on a resource it does not own" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed request: missing required field, bad type, invalid enum member, out-of-range value" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the entity's current version (OCC)" }
  - { id: ERR_INVALID_WINDOW_STATE, http: 409, condition: "ConferenceWindow.status does not allow the requested operation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is not in a valid state for the requested transition" }
  - { id: ERR_FAMILY_RESTRICTED, http: 409, condition: "Family status RESTRICTED blocks family self-service booking and waitlist join" }
  - { id: ERR_TEACHER_INACTIVE, http: 409, condition: "Teacher status INACTIVE blocks new bookings against that teacher's slots" }
  - { id: ERR_SLOT_NOT_AVAILABLE, http: 409, condition: "Slot is not OPEN for the requested booking/block operation (BLOCKED, HELD, BOOKED, or RETIRED)" }
  - { id: ERR_NO_ACTIVE_OFFER, http: 409, condition: "WaitlistEntry is not OFFERED; claim/decline-offer requires an active offer" }
  - { id: ERR_BOOKING_WINDOW_NOT_OPEN, http: 422, condition: "open-booking attempted before booking_open_at on the logical clock" }
  - { id: ERR_BOOKING_WINDOW_NOT_CLOSED, http: 422, condition: "lock attempted before booking_close_at on the logical clock" }
  - { id: ERR_CANCELLATION_CUTOFF, http: 422, condition: "Family self-cancel/reschedule attempted after slot.start_at - cancel_cutoff_hours" }
  - { id: ERR_OFFER_EXPIRED, http: 422, condition: "Waitlist claim attempted with logical clock strictly after offer_expires_at" }
  - { id: ERR_INVALID_DAY_WINDOW, http: 422, condition: "day_windows entry has end_at <= start_at or malformed date" }
  - { id: ERR_FAMILY_SCHEDULE_CONFLICT, http: 409, condition: "Candidate booking violates the family channel-dependent gap rule against an existing family booking" }
  - { id: ERR_INTERPRETER_OVERLAP, http: 409, condition: "Interpreter has an ASSIGNED|CONFIRMED assignment whose half-open interval overlaps the candidate" }
  - { id: ERR_INTERPRETER_FATIGUE, http: 422, condition: "Assignment would create a zero-gap run longer than max_consecutive_minutes" }
  - { id: ERR_INTERPRETER_CAPACITY_EXCEEDED, http: 422, condition: "Assignment would exceed interpreter_window_capacity for the window" }
  - { id: ERR_LANGUAGE_NOT_COVERED, http: 422, condition: "Interpreter's languages do not include the request language" }
  - { id: ERR_NO_ELIGIBLE_INTERPRETER, http: 422, condition: "Auto-assign found no candidate passing language, channel, overlap, fatigue, and capacity checks" }
  - { id: ERR_DUPLICATE_BOOKING, http: 409, condition: "A CONFIRMED booking already exists for (student, teacher) in this window; in ELEMENTARY windows also fires when the student already has any CONFIRMED booking in the window" }
  - { id: ERR_DUPLICATE_WAITLIST_ENTRY, http: 409, condition: "A WAITING|OFFERED entry already exists for (student, teacher, window), or a CONFIRMED booking exists for the pair" }
  - { id: ERR_DUPLICATE_TEACHER_LINK, http: 409, condition: "A StudentTeacherLink already exists for (student, teacher)" }
  - { id: ERR_CHANNEL_NOT_ALLOWED, http: 422, condition: "Requested channel incompatible with slot.channel_allowed / teacher supports flags / interpreter channel support" }
  - { id: ERR_ALREADY_HAS_INTERPRETER_REQUEST, http: 409, condition: "Booking already has a non-terminal InterpreterRequest" }
  - { id: ERR_STUDENT_NOT_BOOKABLE, http: 422, condition: "Student enrollment_status is WITHDRAWN" }
  - { id: ERR_TEACHER_NOT_LINKED, http: 422, condition: "No StudentTeacherLink between student and the slot's teacher (ELEMENTARY: no is_homeroom link)" }
  - { id: ERR_TEACHER_DAY_FULL, http: 422, condition: "Teacher's CONFIRMED bookings on that day_label already equal the effective daily cap" }
  - { id: ERR_FAMILY_LIMIT_REACHED, http: 422, condition: "Family's CONFIRMED bookings in the window already equal window.family_conf_cap" }
  - { id: ERR_WINDOW_GRID_LOCKED, http: 409, condition: "Grid fields (slot_length_minutes, buffer_minutes, day_windows) cannot change once slots exist" }
  - { id: ERR_SLOTS_ALREADY_BOOKED, http: 409, condition: "Slot regeneration refused because bookings reference the existing grid" }
  - { id: ERR_OPEN_OUTREACH_TASKS, http: 409, condition: "Window archive blocked by OPEN or CONTACTED outreach tasks" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchoolAdmin
    description: "School administrator; superset of FrontOfficeStaff operations plus window lifecycle, teacher/interpreter management, slot generation, ops runs, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /conf/_clock/set_current_utc"
      - "POST /conf/windows + PATCH /conf/windows/{id}"
      - "POST /conf/windows/{id}/publish|generate-slots|open-booking|lock|start|complete|archive|run-ops"
      - "POST /conf/teachers, PATCH /conf/teachers/{id}"
      - "POST /conf/interpreters, PATCH /conf/interpreters/{id}"
    shared_operations:
      - "all FrontOfficeStaff operations (families, students, links, bookings, waitlist, interpreter-requests, outreach, attendance)"
      - "all read endpoints"
  - name: FrontOfficeStaff
    description: "Front office operator; registers families/students, manages links, books on behalf of families (bypasses cutoff and family restriction), assigns interpreters, marks attendance, works outreach"
    identity: opaque
    exclusive_operations:
      - "POST /conf/families, POST /conf/families/{id}/clear-strikes"
      - "POST /conf/students/{id}/withdraw"
      - "POST /conf/students/{id}/teacher-links, DELETE /conf/teacher-links/{id}"
      - "POST /conf/interpreter-requests, POST /conf/interpreter-requests/{id}/assign|cancel"
      - "POST /conf/outreach-tasks* (create/contact/resolve/dismiss)"
      - "GET /conf/windows/{id}/attendance-report"
    shared_operations:
      - "POST /conf/bookings, POST /conf/bookings/{id}/cancel|reschedule|attendance"
      - "POST /conf/waitlist-entries, POST /conf/waitlist-entries/{id}/claim|decline-offer|withdraw"
      - "POST /conf/slots/{id}/block|unblock"
      - "read endpoints in their role lists"
  - name: Teacher
    description: "Teacher self-service: own schedule, own slot blocks, attendance for own bookings"
    identity: "entity_backed:Teacher"
    exclusive_operations:
      - "POST /conf/bookings/{id}/attendance for bookings where booking.teacher_id == caller id (shared with staff)"
      - "POST /conf/slots/{id}/block|unblock for slots where slot.teacher_id == caller id (shared with staff)"
    shared_operations:
      - "GET /conf/teachers/{id}, GET /conf/teachers/{id}/slots|teacher-links|summary (own id)"
      - "GET /conf/windows*, GET /conf/slots/{id}"
      - "GET /conf/bookings, GET /conf/bookings/{id} (own bookings only)"
      - "GET /conf/attendance-records*"
  - name: FamilyGuardian
    description: "Family self-service: register students, book/cancel/reschedule own family conferences, join/claim/withdraw waitlist entries; blocked while RESTRICTED"
    identity: "entity_backed:Family"
    exclusive_operations:
      - "POST /conf/families/{id}/students for own family (shared with staff)"
      - "PATCH /conf/families/{id} contact fields for own family (shared with staff)"
    shared_operations:
      - "POST /conf/bookings, POST /conf/bookings/{id}/cancel|reschedule (own family, cutoff-bound)"
      - "POST /conf/waitlist-entries, POST /conf/waitlist-entries/{id}/claim|decline-offer|withdraw (own family)"
      - "GET /conf/families/{id}, GET /conf/families/{id}/students (own id)"
      - "GET /conf/students/{id}, GET /conf/students/{id}/teacher-links (own students)"
      - "GET /conf/bookings*, GET /conf/waitlist-entries*, GET /conf/interpreter-requests*, GET /conf/attendance-records* (own scope)"
      - "GET /conf/windows*, GET /conf/slots/{id}, GET /conf/teachers*"
  - name: Interpreter
    description: "Interpreter self-service: view and accept/decline own assignments"
    identity: "entity_backed:Interpreter"
    exclusive_operations:
      - "POST /conf/interpreter-requests/{id}/accept|decline where request.interpreter_id == caller id"
    shared_operations:
      - "GET /conf/interpreters/{id}, GET /conf/interpreters/{id}/summary (own id)"
      - "GET /conf/interpreter-requests* (requests assigned to caller or unassigned visibility for staff tools)"
      - "GET /conf/windows*, GET /conf/slots/{id}"
