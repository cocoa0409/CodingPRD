        grounds: [entities.PricingPolicy.common_fields, entities.PricingPolicy.fields.status, entities.PricingPolicy.fields.revision_number]
        distinguishing_aspect: "id is a bare UUID with no type prefix, created_at and updated_at carry three fractional digits, version starts at 1, and none of status / revision_number / reviewed_by_user_id can be set from the request body."
        test_recipe:
          setup: ["Empty DB; clock 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
