  - rule_id: compensating_invariant
    instances:

      - name: roster_move_reversal_restores_the_organization_salary_ledger_exactly
        grounds:
          - calculations.org_salary_commitment
          - state_machines.RosterMove.EXECUTED_to_REVERSED
          - state_machines.PlayerContract.TERMINATED_to_ACTIVE
          - entities.RosterMove.fields.released_cap_cents
          - entities.Organization.fields.uncommitted_salary_cents
        distinguishing_aspect: |
          Conserved quantity INVARIANT_SALARY: annual_salary_budget_cents ==
          committed_salary_cents + uncommitted_salary_cents must hold before, between and after the
          compensating action. Because the release records released_cap_cents from the contract's
          FROZEN provisional charge rather than recomputing it at reversal time, the reversal puts
          back exactly 9863014 cents and the ledger returns byte-for-byte to its pre-release values.
          The reversal deliberately does NOT resurrect the VOIDED deliverable, so the asymmetry is
          observable in the same test.
        test_recipe:
          setup:
            - "One league with min_roster_size 1; one organization with a 50000000-cent budget"
            - "Two ACTIVE contracts effective 2026-08-05 (12500000 and 10000000 cents), so committed is 22191781"
            - "One ACTIVE deal requiring 2 deliverables with one ASSIGNED deliverable on the second contract"
            - "A RELEASE RosterMove for the second player, APPROVED and then EXECUTED at clock 2026-08-20T00:00:00Z"
