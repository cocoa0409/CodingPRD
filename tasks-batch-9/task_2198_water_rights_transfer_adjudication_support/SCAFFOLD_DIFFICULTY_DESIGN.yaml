          500.00 against a transferable_af of 195.00, so priority 24
          (business_safety, 403) and priority 45 (business_fiscal, 422) are both
          violated by one call. The safety sanction must win with 403
          ERR_CLAIMANT_NOT_IN_GOOD_STANDING; restoring standing and repeating
          the identical call yields 422 ERR_TRANSFERABLE_VOLUME_EXCEEDED, so the
          pair is demonstrably ordered rather than coincidental.
