      - name: subscription_package_referencing_absent_engagement_returns_not_found
        claim_type: cross_reference_integrity
        grounds:
          - "§1.1 SubscriptionPackage.included_engagement_ids is an array of `FK -> Engagement.id` with length >= 2."
          - "§1.4 priority 32 resolves body-referenced ids -> ERR_ENGAGEMENT_NOT_FOUND (404)."
          - "complexity_profile.entity_topology: graph - SubscriptionPackage is the many-to-many junction across engagements."
        distinguishing_aspect: >-
          The junction entity is the only place where a FK arrives inside an
          array, so referential integrity has to be checked element-wise. This
          instance provokes the failure with one live id and one dead id, which
          is the case a naive "check the first element" implementation passes.
        test_recipe:
          setup:
            - "Grand Hall and artist 'Cadence Quartet' (routing 2026-09-01 -> 2026-12-31) exist."
            - "One PRESENTED engagement exists (Oct 11 2026), still DRAFT; no second engagement exists, so the second array element below can only be a dead id."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
