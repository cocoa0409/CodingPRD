              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/unavailability-windows"
              payload: { physician_id: "${p1_id}", start_date: "2026-09-08", end_date: "2026-09-08", kind: "VACATION" }
              as: Physician
              as_user_id: "${p1_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /api/unavailability-windows/${w1_id}/approve"
              as: SchedulerAdmin
            - call: "POST /api/unavailability-windows"
              payload: { physician_id: "${p1_id}", start_date: "2026-09-09", end_date: "2026-09-09", kind: "CME" }
              as: Physician
              as_user_id: "${p1_id}"
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { s1: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-09"
              as: SchedulerAdmin
              captures: { s2: $.data.0.id }
          trigger:
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${s1}", physician_id: "${p1_id}" }
