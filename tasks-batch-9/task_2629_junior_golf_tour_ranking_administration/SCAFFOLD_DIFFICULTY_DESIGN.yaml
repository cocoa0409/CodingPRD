            - "One REGIONAL 2-round tournament with field_size_limit 4, tee_group_size 2 and tee_interval_minutes 10, driven to FIELD_SET so all four entries are ACCEPTED."
            - "Round-1 cards already exist for e1 at 2026-09-10T13:05:00Z and for e2 at 2026-09-10T13:10:00Z."
