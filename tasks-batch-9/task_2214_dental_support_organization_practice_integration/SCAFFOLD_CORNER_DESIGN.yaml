# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 2214: Dental Support Organization Practice Integration
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7 surface. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# appear as `excluded_because:` stubs naming the covering §1.8 instance.
#
# The logical clock defaults to 2026-08-01T00:00:00Z; instances that do not set
# it rely on that default.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: affiliation_creation_returns_all_declared_fields
        claim_type: Creation
        grounds:
          - entities.Affiliation
          - endpoints["POST /dso/affiliations"]
          - response_envelope.success
        distinguishing_aspect: "A create with every required input returns HTTP 201, status DRAFT, earnout_unallocated_cents seeded to the full pool of 90000000, and version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock stands at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
          assert:
            - "HTTP 201 with response_type object and meta.api_request_id present"
            - "Affiliation.${aff_id}.status == DRAFT and earnout_measurement_state == NOT_OPEN"
            - "Affiliation.${aff_id}.earnout_unallocated_cents == 90000000, earnout_reserved_cents == 0, earnout_settled_cents == 0"
            - "Affiliation.${aff_id}.repricing_round == 0 and practice_count == 0 and version == 1"
            - "Affiliation.${aff_id}.diligence_opened_at == null, signed_date == null, close_date == null"

      - name: affiliation_retrieval_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints["GET /dso/affiliations/{affiliation_id}"]
          - entities.Affiliation.fields.purchase_price_cents
        distinguishing_aspect: "GET by id echoes exactly the stored figures without recomputation: purchase_price_cents 450000000 and baseline_ebitda_cents 90000000."
        test_recipe:
          setup:
            - "One Affiliation in DRAFT created with purchase_price_cents 450000000."
          setup_api_calls:
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
          trigger:
            - call: "GET /dso/affiliations/${aff_id}"
              payload: {}
              as: DsoFinanceController
          assert:
            - "HTTP 200 and data.id == ${aff_id}"
            - "data.purchase_price_cents == 450000000 and data.baseline_ebitda_cents == 90000000 and data.baseline_net_collections_cents == 400000000"
            - "data.status == DRAFT and data.version == 1"

      - name: practice_listing_filtered_and_paginated
        claim_type: Listing
        grounds:
          - endpoints["GET /dso/practices"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two practices on one affiliation, limit 1 returns one row with total_count 2 and has_more true; offset 1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "One Affiliation in DRAFT with two Practices attached, created in a fixed order."
          setup_api_calls:
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
            - call: "POST /dso/conversion-vendors"
              payload: { name: "ChartBridge Conversions", max_concurrent_windows: 3 }
              as: DsoIntegrationLead
              captures: { vendor_id: "$.data.id" }
            - call: "POST /dso/practices"
              payload: { affiliation_id: "${aff_id}", conversion_vendor_id: "${vendor_id}", name: "Elm Street Dental", state_code: "IL", charts_total_expected: 5000 }
              as: DsoIntegrationLead
              captures: { p1_id: "$.data.id" }
            - call: "POST /dso/practices"
              payload: { affiliation_id: "${aff_id}", conversion_vendor_id: "${vendor_id}", name: "Oak Park Dental", state_code: "IL", charts_total_expected: 4000 }
              as: DsoIntegrationLead
              captures: { p2_id: "$.data.id" }
          trigger:
            - call: "GET /dso/practices"
              payload: { affiliation_id: "${aff_id}", limit: 1, offset: 0 }
              as: DsoIntegrationLead
            - call: "GET /dso/practices"
              payload: { affiliation_id: "${aff_id}", limit: 1, offset: 1 }
              as: DsoIntegrationLead
          assert:
            - "The first list returns HTTP 200, response_type array, exactly 1 row whose id == ${p1_id}, total_count == 2, has_more == true"
            - "The second list returns exactly 1 row whose id == ${p2_id}, total_count == 2, has_more == false"
            - "Rows are ordered by created_at ASC"
            - "Affiliation.${aff_id}.practice_count == 2"

      - name: affiliation_not_found_for_unknown_identifier
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors.ERR_AFFILIATION_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown UUID on the affiliation GET returns ERR_AFFILIATION_NOT_FOUND with HTTP 404 rather than an empty body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /dso/affiliations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DsoDealCounsel
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with response_type error and data.error_id == ERR_AFFILIATION_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: affiliation_missing_required_earnout_pool_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
          - entities.Affiliation.fields.earnout_pool_cents
        distinguishing_aspect: "Omitting the required earnout_pool_cents input returns ERR_INVALID_REQUEST with HTTP 400 and creates no Affiliation row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /dso/affiliations returns total_count == 0"

      - name: doctor_employment_comp_model_default_applied
        claim_type: Defaults
        grounds:
          - entities.DoctorEmployment.fields.comp_model
          - endpoints["POST /dso/doctor-employments"]
        distinguishing_aspect: "Omitting the optional comp_model stores the declared default MONTHLY_MIN_GUARANTEE, and the other defaults land as employment_status OFFERED, offer_accepted false, records_custody_state HELD_BY_PRACTICE."
        test_recipe:
          setup:
            - "One Affiliation in DRAFT with one Practice in IL and one Doctor licensed in IL."
          setup_api_calls:
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
            - call: "POST /dso/conversion-vendors"
              payload: { name: "ChartBridge Conversions", max_concurrent_windows: 3 }
              as: DsoIntegrationLead
              captures: { vendor_id: "$.data.id" }
            - call: "POST /dso/practices"
              payload: { affiliation_id: "${aff_id}", conversion_vendor_id: "${vendor_id}", name: "Elm Street Dental", state_code: "IL", charts_total_expected: 5000 }
              as: DsoIntegrationLead
              captures: { prac_id: "$.data.id" }
            - call: "POST /dso/doctors"
              payload: { full_name: "Ana Reyes", npi: "1710000001", license_number: "IL-DDS-4410", license_state: "IL" }
              as: DsoIntegrationLead
              captures: { doc_id: "$.data.id" }
          trigger:
            - call: "POST /dso/doctor-employments"
              payload: { practice_id: "${prac_id}", doctor_id: "${doc_id}", base_salary_monthly_cents: 1800000, collections_pct_bps: 3000, legacy_annual_comp_cents: 24000000, post_close_term_months: 36, non_compete_months: 24, non_compete_radius_miles: 10 }
              as: DsoIntegrationLead
              captures: { emp_id: "$.data.id" }
          assert:
            - "DoctorEmployment.${emp_id}.comp_model == MONTHLY_MIN_GUARANTEE"
            - "DoctorEmployment.${emp_id}.employment_status == OFFERED and offer_accepted == false"
            - "DoctorEmployment.${emp_id}.records_custody_state == HELD_BY_PRACTICE and non_compete_enforcement_state == NOT_APPLICABLE"
            - "DoctorEmployment.${emp_id}.is_harmonized == false and harmonized_annual_comp_cents == null"
            - "Doctor.${doc_id}.specialty == GENERAL and is_seller_owner == false (their own declared defaults)"

      - name: practice_computed_fields_derived_at_creation
        claim_type: Computed Fields
        grounds:
          - entities.Practice.fields.integration_posture
          - entities.Practice.fields.charts_migrated_count
          - calculations.practice_posture
        distinguishing_aspect: "A freshly created Practice carries the derived posture PRE_CLOSE from clause 1 of practice_posture and zeroed counters, none of which the request body can set."
        test_recipe:
          setup:
            - "One Affiliation in DRAFT and one ConversionVendor."
          setup_api_calls:
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
            - call: "POST /dso/conversion-vendors"
              payload: { name: "ChartBridge Conversions", max_concurrent_windows: 3 }
              as: DsoIntegrationLead
              captures: { vendor_id: "$.data.id" }
          trigger:
            - call: "POST /dso/practices"
              payload: { affiliation_id: "${aff_id}", conversion_vendor_id: "${vendor_id}", name: "Elm Street Dental", state_code: "IL", charts_total_expected: 5000 }
              as: DsoIntegrationLead
              captures: { prac_id: "$.data.id" }
          assert:
            - "Practice.${prac_id}.affiliation_status == PENDING and integration_posture == PRE_CLOSE"
            - "Practice.${prac_id}.active_doctor_count == 0, charts_migrated_count == 0, pending_credentialing_count == 0, denied_enrollment_count == 0, quarantined_batch_count == 0"
            - "Practice.${prac_id}.clinical_coverage_gap == false and staffing_model_state == LEGACY and fte_hygiene_ratio_bps == null"
            - "Affiliation.${aff_id}.practice_count == 1 (derived counter on the parent)"

      - name: conversion_vendor_system_fields_generated_on_create
        claim_type: System Fields
        grounds:
          - entities.ConversionVendor
          - endpoints["POST /dso/conversion-vendors"]
        distinguishing_aspect: "The server mints id, created_at, updated_at and version 1 for a ConversionVendor and derives active_window_count 0; none of these appear in the endpoint input list."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /dso/conversion-vendors"
              payload: { name: "ChartBridge Conversions", max_concurrent_windows: 3 }
              as: DsoIntegrationLead
              captures: { vendor_id: "$.data.id" }
          assert:
            - "ConversionVendor.${vendor_id}.id is a UUID with no type prefix"
            - "ConversionVendor.${vendor_id}.version == 1 and created_at == updated_at"
            - "ConversionVendor.${vendor_id}.active_window_count == 0 and max_concurrent_windows == 3"

      - name: fee_schedule_item_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.FeeScheduleItem
          - endpoints["GET /dso/payer-contracts/{id}/fee-schedule-items"]
        distinguishing_aspect: "FeeScheduleItem is declared common_fields false, so it exposes only id and created_at plus its own fields, has no version or updated_at, and §1.5 offers no update or delete route for it."
        test_recipe:
          setup:
            - "One Affiliation CLOSED at 2026-09-01T00:00:00Z with one AFFILIATED IL Practice and one LEGACY PayerContract carrying one priced procedure."
          setup_api_calls:
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DsoIntegrationLead
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
            - call: "POST /dso/conversion-vendors"
              payload: { name: "ChartBridge Conversions", max_concurrent_windows: 3 }
              as: DsoIntegrationLead
              captures: { vendor_id: "$.data.id" }
            - call: "POST /dso/practices"
              payload: { affiliation_id: "${aff_id}", conversion_vendor_id: "${vendor_id}", name: "Elm Street Dental", state_code: "IL", charts_total_expected: 5000 }
              as: DsoIntegrationLead
              captures: { prac_id: "$.data.id" }
            - call: "POST /dso/doctors"
              payload: { full_name: "Ana Reyes", npi: "1710000001", license_number: "IL-DDS-4410", license_state: "IL", specialty: "GENERAL", is_seller_owner: true }
              as: DsoIntegrationLead
              captures: { doc_id: "$.data.id" }
            - call: "POST /dso/doctor-employments"
              payload: { practice_id: "${prac_id}", doctor_id: "${doc_id}", base_salary_monthly_cents: 1800000, collections_pct_bps: 3000, comp_model: "MONTHLY_MIN_GUARANTEE", legacy_annual_comp_cents: 24000000, post_close_term_months: 36, non_compete_months: 24, non_compete_radius_miles: 10 }
              as: DsoIntegrationLead
              captures: { emp_id: "$.data.id" }
            - call: "POST /dso/affiliations/${aff_id}/advance-diligence"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/service-agreements"
              payload: { practice_id: "${prac_id}", fee_model: "PCT_OF_COLLECTIONS", mgmt_fee_bps: 1800 }
              as: DsoDealCounsel
              captures: { msa_id: "$.data.id" }
            - call: "POST /dso/service-agreements/${msa_id}/line-items"
              payload: { service_code: "SVC-RCM-01", service_domain: "BILLING", monthly_fee_cents: 250000 }
              as: DsoDealCounsel
            - call: "POST /dso/service-agreements/${msa_id}/submit-legal-review"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/affiliations/${aff_id}/sign"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/service-agreements/${msa_id}/make-effective"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/doctor-employments/${emp_id}/accept-offer"
              payload: {}
              as: Dentist
              as_user_id: "${doc_id}"
            - call: "POST /dso/affiliations/${aff_id}/close"
              payload: {}
              as: DsoIntegrationLead
            - call: "POST /dso/payer-contracts"
              payload: { practice_id: "${prac_id}", payer_name: "Statewide Dental Plan" }
              as: DsoFinanceController
              captures: { pc_id: "$.data.id" }
            - call: "POST /dso/payer-contracts/${pc_id}/fee-schedule-items"
              payload: { procedure_code: "D0120", legacy_allowed_cents: 5503, dso_allowed_cents: 4900, annual_volume: 100 }
              as: DsoFinanceController
              captures: { fsi_id: "$.data.id" }
          trigger:
            - call: "GET /dso/payer-contracts/${pc_id}/fee-schedule-items"
              payload: {}
              as: DsoFinanceController
          assert:
            - "The single row has id == ${fsi_id} and a created_at value"
            - "The row exposes no version field and no updated_at field"
            - "The row has line_impact_cents == -39195 and annual_volume == 100"
            - "No PATCH, PUT or DELETE route exists for /dso/payer-contracts/{id}/fee-schedule-items in §1.5"

      - name: service_agreement_invalid_fee_model_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ServiceAgreement.fields.fee_model
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "fee_model accepts only PCT_OF_COLLECTIONS or FIXED_MONTHLY, so the near-miss value PERCENT_OF_COLLECTIONS returns ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup:
            - "One Affiliation in DILIGENCE with one Practice in IL and one OFFERED DoctorEmployment."
          setup_api_calls:
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
            - call: "POST /dso/conversion-vendors"
              payload: { name: "ChartBridge Conversions", max_concurrent_windows: 3 }
              as: DsoIntegrationLead
              captures: { vendor_id: "$.data.id" }
            - call: "POST /dso/practices"
              payload: { affiliation_id: "${aff_id}", conversion_vendor_id: "${vendor_id}", name: "Elm Street Dental", state_code: "IL", charts_total_expected: 5000 }
              as: DsoIntegrationLead
              captures: { prac_id: "$.data.id" }
            - call: "POST /dso/affiliations/${aff_id}/advance-diligence"
              payload: {}
              as: DsoDealCounsel
          trigger:
            - call: "POST /dso/service-agreements"
              payload: { practice_id: "${prac_id}", fee_model: "PERCENT_OF_COLLECTIONS", mgmt_fee_bps: 1800 }
              as: DsoDealCounsel
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /dso/service-agreements with practice_id == ${prac_id} returns total_count == 0"

      - name: payer_enrollment_unknown_contract_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors.ERR_PAYER_CONTRACT_NOT_FOUND
          - endpoints["POST /dso/payer-enrollments"]
        distinguishing_aspect: "The body foreign key payer_contract_id is resolved before any business rule, so an unknown contract id returns ERR_PAYER_CONTRACT_NOT_FOUND with HTTP 404 even though doctor_employment_id is valid."
        test_recipe:
          setup:
            - "One Affiliation CLOSED at 2026-09-01T00:00:00Z with one ACTIVE DoctorEmployment and no PayerContract at all."
          setup_api_calls:
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DsoIntegrationLead
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
            - call: "POST /dso/conversion-vendors"
              payload: { name: "ChartBridge Conversions", max_concurrent_windows: 3 }
              as: DsoIntegrationLead
              captures: { vendor_id: "$.data.id" }
            - call: "POST /dso/practices"
              payload: { affiliation_id: "${aff_id}", conversion_vendor_id: "${vendor_id}", name: "Elm Street Dental", state_code: "IL", charts_total_expected: 5000 }
              as: DsoIntegrationLead
              captures: { prac_id: "$.data.id" }
            - call: "POST /dso/doctors"
              payload: { full_name: "Ana Reyes", npi: "1710000001", license_number: "IL-DDS-4410", license_state: "IL", specialty: "GENERAL", is_seller_owner: true }
              as: DsoIntegrationLead
              captures: { doc_id: "$.data.id" }
            - call: "POST /dso/doctor-employments"
              payload: { practice_id: "${prac_id}", doctor_id: "${doc_id}", base_salary_monthly_cents: 1800000, collections_pct_bps: 3000, comp_model: "MONTHLY_MIN_GUARANTEE", legacy_annual_comp_cents: 24000000, post_close_term_months: 36, non_compete_months: 24, non_compete_radius_miles: 10 }
              as: DsoIntegrationLead
              captures: { emp_id: "$.data.id" }
            - call: "POST /dso/affiliations/${aff_id}/advance-diligence"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/service-agreements"
              payload: { practice_id: "${prac_id}", fee_model: "PCT_OF_COLLECTIONS", mgmt_fee_bps: 1800 }
              as: DsoDealCounsel
              captures: { msa_id: "$.data.id" }
            - call: "POST /dso/service-agreements/${msa_id}/line-items"
              payload: { service_code: "SVC-RCM-01", service_domain: "BILLING", monthly_fee_cents: 250000 }
              as: DsoDealCounsel
            - call: "POST /dso/service-agreements/${msa_id}/submit-legal-review"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/affiliations/${aff_id}/sign"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/service-agreements/${msa_id}/make-effective"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/doctor-employments/${emp_id}/accept-offer"
              payload: {}
              as: Dentist
              as_user_id: "${doc_id}"
            - call: "POST /dso/affiliations/${aff_id}/close"
              payload: {}
              as: DsoIntegrationLead
          trigger:
            - call: "POST /dso/payer-enrollments"
              payload: { payer_contract_id: "00000000-0000-4000-8000-000000000000", doctor_employment_id: "${emp_id}", effective_date: "2027-02-13T00:00:00Z" }
              as: DsoIntegrationLead
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == ERR_PAYER_CONTRACT_NOT_FOUND"
            - "GET /dso/payer-enrollments with doctor_employment_id == ${emp_id} returns total_count == 0"

      - name: practice_unknown_conversion_vendor_reference_rejected
        claim_type: Foreign key references validated
        grounds:
          - validations[priority=5]
          - errors.ERR_CONVERSION_VENDOR_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology carries both parents as body foreign keys, so a valid affiliation_id with an unknown conversion_vendor_id returns ERR_CONVERSION_VENDOR_NOT_FOUND and no Practice row is created."
        test_recipe:
          setup:
            - "One Affiliation in DRAFT and no ConversionVendor rows."
          setup_api_calls:
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
          trigger:
            - call: "POST /dso/practices"
              payload: { affiliation_id: "${aff_id}", conversion_vendor_id: "00000000-0000-4000-8000-000000000000", name: "Elm Street Dental", state_code: "IL", charts_total_expected: 5000 }
              as: DsoIntegrationLead
              captures: { err: "$.data.error_id" }
          assert:
