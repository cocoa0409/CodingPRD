          assert:
            - "call 1: 403 ERR_FORBIDDEN_SCOPE - camp B's director reaches camp A's evaluation; the scope rule at priority 17 answers before the cycle-state rule at priority 23 that would also have refused the edit"
            - "call 2: 403 ERR_FORBIDDEN_SCOPE on a plain read - scope is not a write-only concern"
            - "call 3: 403 ERR_FORBIDDEN_SCOPE - the MEMBER holds a seat but not the lead seat"
            - "call 4: 200 - the lead starts the visit, AccreditationVisit.${visit_id}.status == IN_PROGRESS"
            - "call 5: 403 ERR_FORBIDDEN_SCOPE - the unseated visitor has the right role and a real Visitor row but no ASSIGNED seat on this visit"
            - "call 6: 200 - the seated MEMBER may score, StandardEvaluation.${ev_a_id}.visitor_score == MET and visit_status == SCORED and scored_by_visitor_id == ${member_id}"
            - "call 7: 403 ERR_FORBIDDEN_SCOPE - finalize-scoring narrows back to the lead seat, so the same MEMBER who was just allowed to score is refused here"
            - "StandardEvaluation.${ev_a_id}.self_score is still MET and self_status is unchanged by the refused call 1"

      - name: the_officer_who_scheduled_the_visit_cannot_also_issue_the_decision
