        test_recipe:
          setup: ["PLUS HVAC plan included 2; ACTIVE membership with two SEASONAL completions already; third SEASONAL visit ON_SITE"]
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
