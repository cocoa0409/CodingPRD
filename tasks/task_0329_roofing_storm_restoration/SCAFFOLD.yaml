    input: [trade, squares, unit_price_cents, "waste_factor_pct?", "expected_estimate_version?"]
    output: EstimateLineItem
    side_effects: ["line_cost_cents computed; estimate line_subtotal_cents/final_total_cents recomputed"]

  - method: GET
