  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_state_beats_payment_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_CLAIM_NOT_PAYABLE]
          - errors[ERR_PAYMENT_EXCEEDS_OUTSTANDING]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): the payment request
          violates BOTH the claim-state rule (claim DENIED) and the fiscal cap
          (999,999c > 0 outstanding); priority 6 state beats priority 10 fiscal,
          so ERR_CLAIM_NOT_PAYABLE (409) is returned, not ERR_PAYMENT_EXCEEDS_OUTSTANDING.
        test_recipe:
          setup:
            - "Claim WATER driven to DENIED: completed inspection, INITIAL estimate submitted (claim NEGOTIATING), adjuster denies -> claim DENIED; no invoice exists, outstanding_balance_cents == 0"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "WTR-DEMO", trade: "DEMOLITION", kind: "LABOR", unit: "SF", unit_price_cents: 200, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-D", coverage_a_limit_cents: 100000000, deductible_type: "FLAT", flat_deductible_cents: 100000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "INITIAL", assignee_id: "tech-7", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: FieldTechnician, captures: { insp_id: $.data.id } }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "a.jpg", captured_at: "2026-05-02T09:05:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "b.jpg", captured_at: "2026-05-02T09:06:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "MOISTURE_PROOF", file_ref: "c.jpg", captured_at: "2026-05-02T09:07:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/readings", payload: { area: "kitchen", material: "drywall", reading_value: 20, dry_standard: 12, recorded_at: "2026-05-02T09:10:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/complete", payload: {}, as: FieldTechnician }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ESTIMATING" }, as: ContractorAdmin, captures: { cl_v: $.data.version } }
            - { call: "POST /v1/claims/${cl_id}/estimates", payload: { expected_claim_version: "${cl_v}" }, as: Estimator, captures: { est_id: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p1}", qty: 100 }, as: Estimator }
            - { call: "POST /v1/estimates/${est_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /v1/estimates/${est_id}/deny", payload: {}, as: Adjuster }
          trigger:
            - { call: "POST /v1/claims/${cl_id}/payments", payload: { type: "CUSTOMER_BALANCE", amount_cents: 999999 }, as: ContractorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_CLAIM_NOT_PAYABLE  # state (p6) beats fiscal (p10) even though 999,999c also exceeds the 0 outstanding balance"
      - name: inspection_constraint_beats_price_window_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_INSPECTION_INCOMPLETE]
          - errors[ERR_PRICE_WINDOW_VIOLATION]
        distinguishing_aspect: |
          Error-category pair (business_constraint vs business_temporal): the
          submit violates BOTH the completed-inspection constraint (none exists)
          and the price-window rule (entry effective 2026-06-01 does not cover
          date_of_loss 2026-03-10); priority 8 constraint beats priority 9
          temporal, so ERR_INSPECTION_INCOMPLETE is returned.
        test_recipe:
          setup:
            - "Claim WATER in ESTIMATING with NO inspection at all; estimate holds one line priced from an entry whose window starts after the date_of_loss"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "LATE-1", trade: "GENERAL", kind: "LABOR", unit: "EA", unit_price_cents: 500, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }, as: ContractorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-T", coverage_a_limit_cents: 100000000, deductible_type: "FLAT", flat_deductible_cents: 100000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ESTIMATING" }, as: ContractorAdmin, captures: { cl_v: $.data.version } }
            - { call: "POST /v1/claims/${cl_id}/estimates", payload: { expected_claim_version: "${cl_v}" }, as: Estimator, captures: { est_id: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p1}", qty: 10 }, as: Estimator }
          trigger:
            - { call: "POST /v1/estimates/${est_id}/submit", payload: {}, as: Estimator, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INSPECTION_INCOMPLETE  # constraint (p8) beats temporal (p9) even though the line's price window also misses the date_of_loss"

  - rule_id: boundary_precision_check
    instances:
      - name: o_and_p_at_exactly_three_trades
        grounds:
          - calculations.overhead_profit
          - entities.Carrier.fields.o_and_p_min_trades
        distinguishing_aspect: |
          Metric: distinct-trade count. The gate is >= 3 (not > 3): at exactly 3
          trades O&P computes 63c on a 300c eligible base (30 overhead + 33
          compounded profit); at 2 trades it is 0. Reached via POST lines.
        test_recipe:
          setup:
            - "Carrier tax 0, O&P 0.10/0.10 min 3; three eligible 100c entries of trades TA/TB/TC; claim FIRE in ESTIMATING with completed inspection; estimate with two lines (TA qty 1, TB qty 1)"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "ZeroTax Mutual", tax_rate: 0, overhead_rate: 0.10, profit_rate: 0.10, o_and_p_min_trades: 3 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "TA-1", trade: "TA", kind: "LABOR", unit: "EA", unit_price_cents: 100, o_and_p_eligible: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { pa: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "TB-1", trade: "TB", kind: "LABOR", unit: "EA", unit_price_cents: 100, o_and_p_eligible: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { pb: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "TC-1", trade: "TC", kind: "LABOR", unit: "EA", unit_price_cents: 100, o_and_p_eligible: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { pc: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Sam Owner", email: "sam@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-B", coverage_a_limit_cents: 5000000, deductible_type: "FLAT", flat_deductible_cents: 50000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "FIRE", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "INITIAL", assignee_id: "tech-8", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: FieldTechnician, captures: { insp_id: $.data.id } }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "a.jpg", captured_at: "2026-05-02T09:05:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "b.jpg", captured_at: "2026-05-02T09:06:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "LOSS_OVERVIEW", file_ref: "c.jpg", captured_at: "2026-05-02T09:07:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/complete", payload: {}, as: FieldTechnician }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ESTIMATING" }, as: ContractorAdmin, captures: { cl_v: $.data.version } }
            - { call: "POST /v1/claims/${cl_id}/estimates", payload: { expected_claim_version: "${cl_v}" }, as: Estimator, captures: { est_id: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${pa}", qty: 1 }, as: Estimator }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${pb}", qty: 1 }, as: Estimator }
            - { call: "GET /v1/estimates/${est_id}", payload: {}, as: Estimator, captures: { onp_2: $.data.overhead_profit_total_cents } }
          trigger:
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${pc}", qty: 1 }, as: Estimator }
            - { call: "GET /v1/estimates/${est_id}", payload: {}, as: Estimator, captures: { onp_3: $.data.overhead_profit_total_cents, grand_3: $.data.grand_total_cents } }
          assert:
            - "captured onp_2 == 0  # 2 trades < 3: gate closed"
            - "captured onp_3 == 63  # exactly 3 trades (>= boundary inclusive): OH round(300*0.10)=30 + profit round(330*0.10)=33"
            - "captured grand_3 == 363"
      - name: ordinance_bucket_exact_remaining_fully_covers
        grounds:
          - calculations.ordinance_law_waterfall
          - entities.CodeUpgrade.fields.covered_cents
          - errors[ERR_ORDINANCE_CAP_EXHAUSTED]
        distinguishing_aspect: |
          Metric: cents remaining in the ordinance bucket. An item costing exactly
          the remaining 100,000c is FULLY covered (remaining >= cost semantics);
          the next 1c item hits ERR_ORDINANCE_CAP_EXHAUSTED. Reached via
          POST /v1/code-upgrades/{id}/approve — different endpoint, different metric.
        test_recipe:
          setup:
            - "Policy coverage_a 2,500,000, ordinance pct 0.10 (250,000), flat cap 300,000 -> limit = 250,000; claim HAIL in INTAKE (non-terminal)"
            - "CodeUpgrade A estimated 150,000 APPROVED (remaining 100,000); CodeUpgrade B estimated exactly 100,000; CodeUpgrade C estimated 1"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Sam Owner", email: "sam@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-X", coverage_a_limit_cents: 2500000, deductible_type: "FLAT", flat_deductible_cents: 50000, recoverable_depreciation: true, ordinance_coverage_pct: 0.10, ordinance_flat_cap_cents: 300000, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id, ord_limit: $.data.ordinance_limit_cents } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "HAIL", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/code-upgrades", payload: { code_citation: "IRC R905.1", description: "Ice barrier underlayment", estimated_cost_cents: 150000 }, as: Estimator, captures: { cu_a: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/code-upgrades", payload: { code_citation: "NEC 210.12", description: "AFCI breakers", estimated_cost_cents: 100000 }, as: Estimator, captures: { cu_b: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/code-upgrades", payload: { code_citation: "IECC R402", description: "Insulation top-up", estimated_cost_cents: 1 }, as: Estimator, captures: { cu_c: $.data.id } }
            - { call: "POST /v1/code-upgrades/${cu_a}/approve", payload: {}, as: Adjuster, captures: { a_cov: $.data.covered_cents } }
          trigger:
            - { call: "POST /v1/code-upgrades/${cu_b}/approve", payload: {}, as: Adjuster, captures: { b_cov: $.data.covered_cents, b_resp: $.data.customer_responsibility_cents } }
            - { call: "GET /v1/claims/${cl_id}/financial-summary", payload: {}, as: Adjuster, captures: { consumed: $.data.ordinance_consumed_cents } }
            - { call: "POST /v1/code-upgrades/${cu_c}/approve", payload: {}, as: Adjuster, captures: { err: $.data.error_id } }
          assert:
            - "captured ord_limit == 250000  # min(round(0.10*2,500,000), 300,000)"
            - "captured a_cov == 150000"
            - "captured b_cov == 100000 and b_resp == 0  # exact remaining: >= semantics cover fully, no customer share"
            - "captured consumed == 250000  # bucket exactly exhausted, not over"
            - "captured err == ERR_ORDINANCE_CAP_EXHAUSTED  # remaining == 0 rejects the 1c item"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: estimate_submit_gated_by_completed_inspection
        grounds:
          - state_machines.Estimate.DRAFT_to_SUBMITTED
          - state_machines.Inspection.SCHEDULED_to_COMPLETED
          - errors[ERR_INSPECTION_INCOMPLETE]
        distinguishing_aspect: |
          Entity pair Inspection -> Estimate: with only a SCHEDULED inspection on
          the claim, submit fails with ERR_INSPECTION_INCOMPLETE; after the
          inspection reaches COMPLETED, the same submit succeeds and moves the
          claim ESTIMATING -> NEGOTIATING.
        test_recipe:
          setup:
            - "Claim WATER in ESTIMATING; one SCHEDULED (not completed) inspection; estimate with one valid line"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "WTR-DEMO", trade: "DEMOLITION", kind: "LABOR", unit: "SF", unit_price_cents: 200, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-G", coverage_a_limit_cents: 100000000, deductible_type: "FLAT", flat_deductible_cents: 100000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "INITIAL", assignee_id: "tech-9", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: FieldTechnician, captures: { insp_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ESTIMATING" }, as: ContractorAdmin, captures: { cl_v: $.data.version } }
            - { call: "POST /v1/claims/${cl_id}/estimates", payload: { expected_claim_version: "${cl_v}" }, as: Estimator, captures: { est_id: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p1}", qty: 100 }, as: Estimator }
          trigger:
            - { call: "POST /v1/estimates/${est_id}/submit", payload: {}, as: Estimator, captures: { err: $.data.error_id } }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "a.jpg", captured_at: "2026-05-02T09:05:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "b.jpg", captured_at: "2026-05-02T09:06:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "MOISTURE_PROOF", file_ref: "c.jpg", captured_at: "2026-05-02T09:07:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/readings", payload: { area: "kitchen", material: "drywall", reading_value: 18, dry_standard: 12, recorded_at: "2026-05-02T09:10:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/complete", payload: {}, as: FieldTechnician }
            - { call: "POST /v1/estimates/${est_id}/submit", payload: {}, as: Estimator, captures: { st: $.data.status } }
            - { call: "GET /v1/claims/${cl_id}", payload: {}, as: Estimator, captures: { cl_status: $.data.status } }
          assert:
            - "captured err == ERR_INSPECTION_INCOMPLETE  # SCHEDULED inspection does not satisfy the gate"
            - "captured st == SUBMITTED  # same estimate submits once the inspection is COMPLETED"
            - "captured cl_status == NEGOTIATING  # INITIAL submit bubble-up"
      - name: invoice_creation_locks_approved_estimates
        grounds:
          - state_machines.Estimate.APPROVED_to_LOCKED
          - state_machines.Invoice.initial_state
          - errors[ERR_DUPLICATE_ACTIVE_INVOICE]
        distinguishing_aspect: |
          Entity pair Estimate -> Invoice: invoice creation is only legal once
          the claim is COMPLETE (itself gated by an approved estimate upstream),
          and it force-locks every APPROVED estimate; a second invoice create on
          the same claim is rejected with ERR_DUPLICATE_ACTIVE_INVOICE.
        test_recipe:
          setup:
            - "FIRE claim COMPLETE: one-line estimate 2500 @ 200c = 500,000c APPROVED, WA signed (no direct pay), work started and completed"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "ZeroTax Mutual", tax_rate: 0 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "GEN-1", trade: "GENERAL", kind: "LABOR", unit: "EA", unit_price_cents: 200, default_depreciation_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Sam Owner", email: "sam@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-L", coverage_a_limit_cents: 5000000, deductible_type: "FLAT", flat_deductible_cents: 50000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "FIRE", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "INITIAL", assignee_id: "tech-10", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: FieldTechnician, captures: { insp_id: $.data.id } }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "a.jpg", captured_at: "2026-05-02T09:05:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "b.jpg", captured_at: "2026-05-02T09:06:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "LOSS_OVERVIEW", file_ref: "c.jpg", captured_at: "2026-05-02T09:07:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/complete", payload: {}, as: FieldTechnician }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ESTIMATING" }, as: ContractorAdmin, captures: { cl_v: $.data.version } }
            - { call: "POST /v1/claims/${cl_id}/estimates", payload: { expected_claim_version: "${cl_v}" }, as: Estimator, captures: { est_id: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p1}", qty: 2500 }, as: Estimator }
            - { call: "POST /v1/estimates/${est_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /v1/estimates/${est_id}/approve", payload: {}, as: Adjuster }
            - { call: "POST /v1/claims/${cl_id}/work-authorizations", payload: { direct_pay_assignment: false, deductible_acknowledged: true }, as: ContractorAdmin, captures: { wa_id: $.data.id } }
            - { call: "POST /v1/work-authorizations/${wa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /v1/claims/${cl_id}/start-work", payload: {}, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/complete-work", payload: {}, as: ContractorAdmin }
          trigger:
            - { call: "POST /v1/claims/${cl_id}/invoices", payload: {}, as: ContractorAdmin, captures: { inv_id: $.data.id, inv_total: $.data.total_cents } }
            - { call: "GET /v1/claims/${cl_id}/estimates", payload: {}, as: ContractorAdmin, captures: { est_status: $.data.0.status } }
            - { call: "POST /v1/claims/${cl_id}/invoices", payload: {}, as: ContractorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured inv_total == 500000  # final variant with no actuals recorded == provisional"
            - "captured est_status == LOCKED  # invoice creation froze the approved estimate"
            - "captured err == ERR_DUPLICATE_ACTIVE_INVOICE"

  - rule_id: resource_temporal_overlap
    instances:
      - name: price_list_half_open_window_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_PRICE_WINDOW_OVERLAP]
          - entities.PriceListEntry.fields.effective_from
        distinguishing_aspect: |
          Resource PriceListEntry, half-open interval semantics: per
          (carrier, category_code) the window [effective_from, effective_to) may
          touch (B.effective_from == A.effective_to is accepted) but any interior
          intersection (C.from = 2026-05-31 < A.to = 2026-06-01) is rejected.
        test_recipe:
          setup:
            - "Carrier with entry A category WTR-DEMO effective [2026-01-01, 2026-06-01)"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "WTR-DEMO", trade: "DEMOLITION", kind: "LABOR", unit: "SF", unit_price_cents: 200, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }, as: ContractorAdmin, captures: { ea_id: $.data.id } }
          trigger:
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "WTR-DEMO", trade: "DEMOLITION", kind: "LABOR", unit: "SF", unit_price_cents: 210, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { eb_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "WTR-DEMO", trade: "DEMOLITION", kind: "LABOR", unit: "SF", unit_price_cents: 220, effective_from: "2026-05-31T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: ContractorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured eb_id is a non-null UUID  # adjacency allowed: 2026-06-01 == A.effective_to, half-open windows do not intersect"
            - "captured err == ERR_PRICE_WINDOW_OVERLAP  # [2026-05-31, 2026-09-01) intersects A's window by one day"
      - name: inspection_schedule_travel_buffer_conflict
        grounds:
          - validations[priority=8]
          - errors[ERR_INSPECTION_SCHEDULE_CONFLICT]
          - entities.Inspection.fields.assignee_id
        distinguishing_aspect: |
          Resource Inspection (per assignee), buffer-gap interval semantics: two
          windows conflict when new_start < existing_end + 30min AND new_end >
          existing_start - 30min. An exactly-30-minute gap (10:30 after 10:00) is
          allowed; a 15-minute gap is rejected. Different interval arithmetic
          than the half-open price-list rule.
        test_recipe:
          setup:
            - "Claim WATER in ASSESSING; inspection I1 for assignee tech-X scheduled [09:00, 10:00)"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-S", coverage_a_limit_cents: 100000000, deductible_type: "FLAT", flat_deductible_cents: 100000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "INITIAL", assignee_id: "tech-X", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: FieldTechnician, captures: { i1: $.data.id } }
          trigger:
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "VERIFICATION", assignee_id: "tech-X", scheduled_start: "2026-05-02T10:30:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: FieldTechnician, captures: { i2: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "VERIFICATION", assignee_id: "tech-X", scheduled_start: "2026-05-02T10:15:00Z", scheduled_end: "2026-05-02T11:00:00Z" }, as: FieldTechnician, captures: { err: $.data.error_id } }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "VERIFICATION", assignee_id: "tech-Y", scheduled_start: "2026-05-02T09:30:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FieldTechnician, captures: { i3: $.data.id } }
          assert:
            - "captured i2 is a non-null UUID  # exactly 30-minute gap after I1 satisfies the buffer boundary (not < end+30)"
            - "captured err == ERR_INSPECTION_SCHEDULE_CONFLICT  # 10:15 < 10:00+30min violates the buffer"
            - "captured i3 is a non-null UUID  # different assignee: no conflict even fully overlapping"

  - rule_id: compensating_invariant
    instances:
      - name: payment_clear_and_return_preserve_invoice_balance
        grounds:
          - calculations.claim_payment_posture
          - state_machines.Payment.CLEARED_to_RETURNED
          - state_machines.Payment.ISSUED_to_CLEARED
          - state_machines.Invoice.ISSUED_to_SETTLED
        distinguishing_aspect: |
          Conserved quantity: invoice balance — total_cents == outstanding_cents
          + sum(CLEARED payment amounts) at every checkpoint: issue (500,000 =
          500,000 + 0), clear advance (= 50,000 + 450,000), RETURN clawback
          (= 500,000 + 0 again — full restoration, no drift), re-clear, then
          deductible clear settles the invoice and closes the claim.
