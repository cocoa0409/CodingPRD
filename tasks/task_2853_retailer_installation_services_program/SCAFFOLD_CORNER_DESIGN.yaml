        grounds:
          - errors.ERR_STALE_INSTALLER_VERSION
          - errors.ERR_REMOVAL_NOT_ELIGIBLE
          - validations[priority=11]
          - validations[priority=33]
          - concurrency_rules.installer-remove-stale-installer
          - endpoints[POST /installers/{id}/remove]
          - entities.Installer.fields.removal_eligible
        distinguishing_aspect: "A freshly activated installer has removal_eligible false, so removal is refused twice for different reasons: an expected_installer_version one ahead of the truth fails at priority 11 with ERR_STALE_INSTALLER_VERSION (412), and the correct version then fails at priority 33 with ERR_REMOVAL_NOT_ELIGIBLE (409)."
        test_recipe:
          setup:
            - "One installer credentialed, verified, background-checked and ACTIVE in METRO-02, with no ScorecardEvent at all — so composite_score is the BASE_SCORE 85, rolling_event_count is 0 and removal_eligible is false."
