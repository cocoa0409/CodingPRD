              payload: { preorder_id: "${p2}", crew_id: "${c2}", appointment_type: "DROP_BURY", window_start_at: "2026-10-05T10:00:00Z", window_end_at: "2026-10-05T13:00:00Z", expected_crew_version: "${cv2}" }
              as: InstallCoordinator
