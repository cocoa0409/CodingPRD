      - name: error_quote_empty_on_submit
        claim_type: violation_to_error
        grounds:
          - validations[priority=6a]
          - errors[ERR_QUOTE_EMPTY]
        excluded_because:
          difficulty_instance: quote_submit_with_zero_line_items_rejected
          rationale: "ERR_QUOTE_EMPTY trigger is asserted as the primary observable of the named §1.8 boundary instance."

