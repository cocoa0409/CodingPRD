            - "Clock at 2026-09-03T00:00:00Z; one platform; one COMPLIANT US/USD acquirer; MCC 5411; STANDARD program."
            - "One FINALIZED empty batch dated 2026-09-02, finalized at 2026-09-03T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
