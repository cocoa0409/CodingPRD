              captures: { d2_v: $.data.version }
            - call: "POST /preservation/meetings"
              payload: { meeting_date: "2026-09-01T00:00:00Z", location: "City Hall", agenda_capacity: 2 }
              as: PreservationStaff
              captures: { m_id: $.data.id }
            - call: "POST /preservation/hearings"
              payload: { application_id: "${d1_id}", meeting_id: "${m_id}", notice_posted_at: "2026-08-10T00:00:00Z" }
              as: PreservationStaff
              captures: { h1_id: $.data.id }
            - call: "POST /preservation/hearings"
              payload: { application_id: "${d2_id}", meeting_id: "${m_id}", notice_posted_at: "2026-08-10T00:00:00Z" }
              as: PreservationStaff
