# =============================================================================
# SCAFFOLD.yaml — task_2954 Automated Grocery Fulfillment Center Operations
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  2954. Automated Grocery Fulfillment Center Operations (Kroger Ocado customer fulfillment center): order slotting into delivery waves by route and time window, robotic grid retrieval sequencing and pick-station assignment, temperature-zone segregation across ambient, chilled and frozen totes, substitution logic and customer approval before dispatch, weighted item picking with tolerance and price adjustment, tote consolidation, van loading sequence and route optimization, capacity release management for delivery slots and surge pricing, inventory accuracy audits and grid maintenance windows

domain_name: automated-grocery-fulfillment-center-operations
api_prefix: "/"

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  difficulty_level: expert_plus
  difficulty_rationale: |
    The scenario spans nine coupled sub-domains (wave slotting, grid retrieval
    sequencing, pick-station assignment, temperature-zone segregation,
    substitution approval, catchweight pricing, tote consolidation, van loading
    and route optimisation, slot capacity release and surge pricing, inventory
    accuracy audits, grid maintenance windows). Difficulty is concentrated in
    the couplings, not the surface: a single short pick propagates four hops to
    a derived wave posture that gates loading; the same audit counts yield two
    legitimately different accuracy scores that disagree on the AUDIT_HOLD gate;
    and the order charge waterfall is circular-looking (fee tier depends on
    subtotal, discount tier depends on subtotal + fee) so evaluation order must
    be pinned to make the cents well-defined.

  complexity_layers:
    - optimistic_concurrency        # OCC on OrderLine.version and CustomerOrder.version
    - cascading_side_effects        # 4-hop chains from short pick and from order cancel
    - dual_variant_calculation      # provisional vs final catchweight; unit- vs sku-weighted accuracy
    - selector_policy               # pick-station selection, substitute-SKU selection, waitlist promotion

  entity_topology: flat
  # All 15 entities are peers addressed at top level (/customer-orders, /order-lines,
  # /pick-tasks, /totes, …) and linked by explicit foreign keys carried in request
  # bodies. No entity is addressed through a nested parent path segment.

  state_machine_shape: cyclic
  # Tote: OPEN -> SEALED -> OPEN (unseal to insert an approved substitute).
  # OrderLine: PENDING -> SHORT -> PENDING (substitution approved re-opens the line).
  # GridZone: OPERATIONAL -> MAINTENANCE -> OPERATIONAL and OPERATIONAL -> AUDIT_HOLD -> OPERATIONAL.
  # CustomerOrder additionally carries two independent state dimensions
  # (fulfillment_status x billing_status) that advance without lockstep.
  # DeliveryWave.posture is a derived aggregate over children that gates them.

  relationship_patterns:
    - one_to_many          # DeliveryRoute -> DeliverySlot, CustomerOrder -> OrderLine, DeliveryWave -> Tote
    - self_referential     # SubstitutionProposal.supersedes_proposal_id -> SubstitutionProposal.id
    - cross_aggregate      # PickTask spans OrderLine, InventorySku, GridZone, PickStation and Tote

  role_model: segregation_of_duties
  # The WavePlanner X-User-ID that consolidated a wave may not be the X-User-ID
  # that dispatches it; the two operational steps must be performed by different
  # operators. Roles are otherwise peer-scoped (each owns a distinct resource set).

  consistency_model: immediate
  # Every derived field (slot ledger, order totals, wave posture, SKU on-hand,
  # zone accuracy scores, station tote counts) is reconciled inside the same
  # request that mutates its sources.

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table (15 entities, flat topology)
# -----------------------------------------------------------------------------
entities:

  # --- configuration -------------------------------------------------------
  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - name: route_code
        type: string
        source: input
        description: "Human-readable route identifier, unique across DeliveryRoute."
        constraints: "1-32 chars; unique; ERR_INVALID_REQUEST when blank or duplicated"
      - name: service_area_name
        type: string
        source: input
        description: "Name of the geographic service area the van covers."
        constraints: "1-80 chars"
      - name: van_capacity_totes
        type: integer
        source: input
        description: "Maximum number of totes one van on this route can carry."
        constraints: ">= 1 and <= 400"
      - name: base_delivery_fee_cents
        type: integer
        source: input
        description: "Pre-surge delivery fee in cents used by order_charge_waterfall step 2."
        constraints: ">= 0 and <= 5000"
      - name: per_km_cost_cents
        type: integer
        source: input
        description: "Transport cost per kilometre in cents used by wave_transport_cost."
        constraints: ">= 1 and <= 2000"

  - name: DockBay
    parent: null
    common_fields: true
    fields:
      - name: bay_code
        type: string
        source: input
        description: "Human-readable dock bay identifier, unique across DockBay."
        constraints: "1-32 chars; unique"
      - name: parallel_van_capacity
        type: integer
        source: input
        description: "Number of vans that may occupy this bay over one instant; the aggregate-capacity bound in resource_temporal_overlap for dock loading windows."
        constraints: ">= 1 and <= 6"

  - name: GridZone
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: "Human-readable grid zone identifier, unique across GridZone; also the deterministic sort key in retrieval_sequence."
        constraints: "1-32 chars; unique"
      - name: temperature_zone
        type: enum
        source: input
        description: "Temperature class of everything stored in this grid zone."
        constraints: "one of {AMBIENT, CHILLED, FROZEN}"
      - name: bot_count
        type: integer
        source: input
        description: "Number of retrieval bots serving this zone."
        constraints: ">= 1 and <= 1200"
      - name: status
        type: enum
        source: computed
        description: "Operational posture of the zone; gates PickTask retrieval and contributes to DeliveryWave.posture."
        default: OPERATIONAL
        constraints: "one of {OPERATIONAL, MAINTENANCE, AUDIT_HOLD}; MAINTENANCE written by MaintenanceWindow activate, AUDIT_HOLD written by zone_inventory_accuracy, OPERATIONAL restored by MaintenanceWindow complete or by a passing audit"
      - name: accuracy_score_unit_weighted
        type: number
        source: computed
        description: "Unit-weighted inventory accuracy score from zone_inventory_accuracy; null until the zone has been audited at least once."
        default: null
        constraints: "4 decimal places, round_half_up; range 0.0000-1.0000"
      - name: accuracy_score_sku_weighted
        type: number
        source: computed
        description: "SKU-weighted inventory accuracy score from zone_inventory_accuracy; null until the zone has been audited at least once."
        default: null
        constraints: "4 decimal places, round_half_up; range 0.0000-1.0000"
      - name: last_audited_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent audit-counts call on this zone; null before the first audit."
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"

  - name: PickStation
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: "Human-readable pick station identifier, unique across PickStation."
        constraints: "1-32 chars; unique"
      - name: temperature_zone_capability
        type: array
        source: input
        description: "Temperature classes this station may handle; the eligibility filter in pick_station_assignment."
        constraints: "non-empty array of distinct members of {AMBIENT, CHILLED, FROZEN}"
      - name: max_concurrent_totes
        type: integer
        source: input
        description: "Maximum number of OPEN totes that may sit at this station at once."
        constraints: ">= 1 and <= 24"
      - name: current_tote_count
        type: integer
        source: computed
        description: "COUNT of Tote rows with pick_station_id == this station and status == OPEN."
        default: 0
        constraints: ">= 0 and <= max_concurrent_totes"
      - name: status
        type: enum
        source: computed
        description: "IDLE when current_tote_count == 0, otherwise ACTIVE."
        default: IDLE
        constraints: "one of {IDLE, ACTIVE}"

  - name: InventorySku
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: "Human-readable SKU identifier, unique across InventorySku; secondary sort key in retrieval_sequence."
        constraints: "1-32 chars; unique"
      - name: name
        type: string
        source: input
        description: "Customer-facing product name."
        constraints: "1-120 chars"
      - name: grid_zone_id
        type: string
        source: input
        description: "FK -> GridZone.id; the zone that physically stores this SKU."
        constraints: "must reference an existing GridZone whose temperature_zone equals this SKU's temperature_zone"
      - name: temperature_zone
        type: enum
        source: input
        description: "Temperature class of the product; drives tote segregation and station eligibility."
        constraints: "one of {AMBIENT, CHILLED, FROZEN}"
      - name: substitution_group_code
        type: string
        source: input
        description: "Interchangeability group; substitute_sku_selector only considers SKUs sharing this code."
        constraints: "1-32 chars"
      - name: is_catchweight
        type: boolean
        source: input
        description: "True when the item is sold by measured weight, so line price is finalised from the picked weight."
        default: false
      - name: unit_price_cents
        type: integer
        source: input
        description: "Price per unit in cents; used for non-catchweight lines and as the substitute price-distance key."
        constraints: ">= 1 and <= 500000"
      - name: price_per_kg_cents
        type: integer
        source: input
        description: "Price per kilogram in cents; required when is_catchweight is true, must be omitted otherwise."
        default: null
        constraints: ">= 1 and <= 500000 when present"
      - name: nominal_weight_grams
        type: integer
        source: input
        description: "Declared per-unit weight in grams; required when is_catchweight is true, must be omitted otherwise."
        default: null
        constraints: ">= 1 and <= 100000 when present"
      - name: weight_tolerance_pct
        type: number
        source: input
        description: "Fractional tolerance allowed between the nominal and picked weight; required when is_catchweight is true."
        default: null
        constraints: "> 0 and <= 0.50, at most 4 decimal places, when present"
      - name: physical_units
        type: integer
        source: input
        description: "Units physically present in the grid; adjusted by audit counts and by completed picks."
        constraints: ">= 0 and <= 1000000"
      - name: allocated_units
        type: integer
        source: computed
        description: "SUM of PickTask.allocated_units over PickTask rows with sku_id == this SKU and status IN {QUEUED, RETRIEVING}."
        default: 0
        constraints: ">= 0"
      - name: on_hand_units
        type: integer
        source: computed
        description: "physical_units - allocated_units; the conserved quantity in sku_unit_ledger."
        constraints: ">= 0"
      - name: last_count_system_units
        type: integer
        source: computed
        description: "physical_units observed immediately before the most recent audit count on this SKU; null before the first count."
        default: null
      - name: last_count_counted_units
        type: integer
        source: computed
        description: "Units counted by the most recent audit count on this SKU; null before the first count."
        default: null
      - name: last_count_variance_units
        type: integer
        source: computed
        description: "last_count_counted_units - last_count_system_units; null before the first count."
        default: null

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - name: grid_zone_id
        type: string
        source: input
        description: "FK -> GridZone.id; the zone taken out of service by this window."
        constraints: "must reference an existing GridZone"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the maintenance interval."
        constraints: "ISO 8601 UTC with three fractional digits; strictly before window_end"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the maintenance interval."
        constraints: "ISO 8601 UTC with three fractional digits; strictly after window_start"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the maintenance window."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, ACTIVE, COMPLETED}"

  - name: DeliverySlot
    parent: null
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> DeliveryRoute.id; the route this delivery slot serves."
        constraints: "must reference an existing DeliveryRoute"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the customer-facing delivery time window; also the lead-time reference in slot_surge_multiplier."
        constraints: "ISO 8601 UTC with three fractional digits; strictly before window_end"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the customer-facing delivery time window."
        constraints: "ISO 8601 UTC with three fractional digits; strictly after window_start"
      - name: total_capacity_units
        type: integer
        source: input
        description: "Total slot capacity in delivery units; the conserved quantity in slot_capacity_ledger."
        constraints: ">= 1 and <= 5000"
      - name: withheld_units
        type: integer
        source: input
        description: "Units held back from sale; reduced by release-capacity and raised by withhold-capacity."
        default: 0
        constraints: ">= 0 and <= total_capacity_units"
      - name: held_units
        type: integer
        source: computed
        description: "SUM of SlotBooking.units over bookings with delivery_slot_id == this slot and status == HELD."
        default: 0
        constraints: ">= 0"
      - name: confirmed_units
        type: integer
        source: computed
        description: "SUM of SlotBooking.units over bookings with delivery_slot_id == this slot and status == CONFIRMED."
        default: 0
        constraints: ">= 0"
      - name: available_units
        type: integer
        source: computed
        description: "total_capacity_units - withheld_units - held_units - confirmed_units."
        constraints: ">= 0"
      - name: surge_multiplier
        type: number
        source: computed
        description: "Current surge multiplier from slot_surge_multiplier, recomputed whenever the slot ledger or the logical clock moves."
        default: 1.00
        constraints: "2 decimal places, round_half_up; >= 1.00 and <= 1.80"

  # --- customer side -------------------------------------------------------
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login e-mail, unique across CustomerAccount."
        constraints: "must contain '@'; unique"
      - name: full_name
        type: string
        source: input
        description: "Customer display name."
        constraints: "1-120 chars"
      - name: loyalty_tier
        type: enum
        source: input
        description: "Loyalty tier used by order_charge_waterfall step 3 to pick the discount schedule."
        default: BASIC
        constraints: "one of {BASIC, PLUS, PREMIER}"
      - name: home_route_id
        type: string
        source: input
        description: "FK -> DeliveryRoute.id; the only route this customer may book slots on."
        constraints: "must reference an existing DeliveryRoute"

  - name: CustomerOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: computed
        description: "FK -> CustomerAccount.id; taken from the X-User-ID header of the creating Customer, never from the body."
        constraints: "must reference an existing CustomerAccount"
      - name: wave_id
        type: string
        source: computed
        description: "FK -> DeliveryWave.id; set by slot-orders, null while the order is not yet waved."
        default: null
      - name: stop_distance_km
        type: number
        source: input
        description: "Road distance in kilometres from the fulfillment centre to this delivery stop; the per-stop input to wave_transport_cost and the stop-ordering key in wave_loading_sequence."
        constraints: ">= 0.01 and <= 99.99, exactly 2 decimal places"
      - name: fulfillment_status
        type: enum
        source: computed
        description: "Physical fulfillment dimension of the order; advances independently of billing_status."
        default: DRAFT
        constraints: "one of {DRAFT, SLOTTED, WAVED, PICKING, CONSOLIDATED, LOADED, DISPATCHED, CANCELLED}"
      - name: billing_status
        type: enum
        source: computed
        description: "Money dimension of the order; advances independently of fulfillment_status."
        default: PENDING_AUTH
        constraints: "one of {PENDING_AUTH, AUTHORIZED, ADJUSTED, CAPTURED, REVERSED}"
      - name: merchandise_subtotal_cents
        type: integer
        source: computed
        description: "Step 1 of order_charge_waterfall: sum of per-line rounded prices over lines with line_status IN {PENDING, PICKED}."
        default: 0
        constraints: ">= 0"
      - name: delivery_fee_cents
        type: integer
        source: computed
        description: "Step 2 of order_charge_waterfall; null while the order has no SlotBooking in {HELD, CONFIRMED}."
        default: null
        constraints: ">= 0 when present"
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: "Step 3 of order_charge_waterfall; null while delivery_fee_cents is null."
        default: null
        constraints: ">= 0 when present"
      - name: order_total_cents
        type: integer
        source: computed
        description: "Step 4 of order_charge_waterfall; null while delivery_fee_cents is null."
        default: null
        constraints: ">= 0 when present"
      - name: authorized_amount_cents
        type: integer
        source: computed
        description: "order_total_cents snapshotted when billing_status first became AUTHORIZED; null before that."
        default: null
      - name: captured_amount_cents
        type: integer
        source: computed
        description: "order_total_cents snapshotted when billing_status became CAPTURED; null before that."
        default: null
      - name: dispatch_blocked
        type: boolean
        source: computed
        description: "True when at least one OrderLine of this order has substitution_resolution == PENDING; the RESTRICTED driver in wave_posture."
        default: false
      - name: open_substitution_count
        type: integer
        source: computed
        description: "COUNT of SubstitutionProposal rows whose order_line_id belongs to this order and whose status IN {DRAFT, PROPOSED}."
        default: 0
        constraints: ">= 0"

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> CustomerOrder.id; the order this line belongs to."
        constraints: "must reference an existing CustomerOrder"
      - name: sku_id
        type: string
        source: input
        description: "FK -> InventorySku.id; the SKU originally ordered on this line (never rewritten by a substitution)."
        constraints: "must reference an existing InventorySku"
      - name: ordered_qty
        type: integer
        source: input
        description: "Units ordered on this line."
        constraints: ">= 1 and <= 200"
      - name: nominal_weight_grams
        type: integer
        source: computed
        description: "InventorySku.nominal_weight_grams snapshotted at line creation; null for non-catchweight lines."
        default: null
      - name: line_status
        type: enum
        source: computed
        description: "Pick outcome dimension of the line."
        default: PENDING
        constraints: "one of {PENDING, PICKED, SHORT, CANCELLED}"
      - name: substitution_resolution
        type: enum
        source: computed
        description: "Customer-facing resolution state of a shortage on this line; PENDING is what blocks dispatch."
        default: NOT_REQUIRED
        constraints: "one of {NOT_REQUIRED, PENDING, SUBSTITUTED, SHORTAGE_ACCEPTED}"
      - name: provisional_line_price_cents
        type: integer
        source: computed
        description: "Provisional variant of order_line_catchweight_price, written at line creation."
        constraints: ">= 0"
      - name: final_line_price_cents
        type: integer
        source: computed
        description: "Final variant of order_line_catchweight_price, written when the line's pick completes or an approved substitute is priced; null until then."
        default: null
        constraints: ">= 0 when present"
      - name: picked_units
        type: integer
        source: computed
        description: "Units actually picked for this line by the completing PickTask; null before completion."
        default: null
      - name: picked_weight_grams
        type: integer
        source: computed
        description: "Measured total weight in grams reported by the completing PickTask; null for non-catchweight lines and before completion."
        default: null

  - name: SlotBooking
    parent: null
    common_fields: true
    fields:
      - name: delivery_slot_id
        type: string
        source: input
        description: "FK -> DeliverySlot.id; the slot whose capacity this booking occupies."
        constraints: "must reference an existing DeliverySlot"
      - name: customer_order_id
        type: string
        source: input
        description: "FK -> CustomerOrder.id; the order this booking reserves capacity for."
        constraints: "must reference an existing CustomerOrder; at most one booking per (delivery_slot_id, customer_order_id) pair in status IN {HELD, CONFIRMED, WAITLISTED}"
      - name: units
        type: integer
        source: input
        description: "Delivery units this booking occupies on the slot."
        constraints: ">= 1 and <= 500"
      - name: status
        type: enum
        source: computed
        description: "Booking lifecycle; only HELD and CONFIRMED occupy slot capacity."
        default: HELD
        constraints: "one of {HELD, CONFIRMED, WAITLISTED, RELEASED, BUMPED}"
      - name: quoted_fee_cents
        type: integer
        source: computed
        description: "round_half_up(DeliveryRoute.base_delivery_fee_cents * surge_multiplier_at_booking) captured at booking creation."
        constraints: ">= 0"
      - name: surge_multiplier_at_booking
        type: number
        source: computed
        description: "DeliverySlot.surge_multiplier evaluated at booking creation and frozen thereafter; the multiplier order_charge_waterfall step 2 uses."
        constraints: "2 decimal places, round_half_up; >= 1.00 and <= 1.80"

  # --- fulfillment side ----------------------------------------------------
  - name: DeliveryWave
    parent: null
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> DeliveryRoute.id; the route the wave's van will drive."
        constraints: "must reference an existing DeliveryRoute"
      - name: delivery_slot_id
        type: string
        source: input
        description: "FK -> DeliverySlot.id; the slot whose orders this wave fulfils; at most one wave per delivery_slot_id."
        constraints: "must reference an existing DeliverySlot whose route_id equals this wave's route_id; unique across DeliveryWave"
      - name: dock_bay_id
        type: string
        source: computed
        description: "FK -> DockBay.id; set by assign-dock, null before that."
        default: null
      - name: wave_code
        type: string
        source: input
        description: "Human-readable wave identifier, unique across DeliveryWave."
        constraints: "1-32 chars; unique"
      - name: cutoff_at
        type: datetime
        source: input
        description: "Instant after which no further orders may be slotted into this wave."
        constraints: "ISO 8601 UTC with three fractional digits; strictly before the slot's window_start"
      - name: load_start
        type: datetime
        source: computed
        description: "Inclusive start of the wave's dock occupation interval, set by assign-dock; null before that."
        default: null
      - name: load_end
        type: datetime
        source: computed
        description: "Exclusive end of the wave's dock occupation interval, set by assign-dock; null before that."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Wave lifecycle."
        default: FORMING
        constraints: "one of {FORMING, PICKING, CONSOLIDATED, LOADING, DISPATCHED}"
      - name: posture
        type: enum
        source: computed
        description: "Derived aggregate from wave_posture over the wave's grid zones and member orders; gates tote and loading operations."
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: order_count
        type: integer
        source: computed
        description: "COUNT of CustomerOrder rows with wave_id == this wave and fulfillment_status != CANCELLED."
        default: 0
        constraints: ">= 0"
      - name: tote_count
        type: integer
        source: computed
        description: "COUNT of Tote rows with wave_id == this wave and status IN {OPEN, SEALED, CONSOLIDATED, LOADED}."
        default: 0
        constraints: ">= 0 and <= DeliveryRoute.van_capacity_totes"
      - name: load_sequence
        type: array
        source: computed
        description: "Ordered list of Tote.id strings produced by wave_loading_sequence; empty until loading-sequence runs."
        default: []
        constraints: "each element is the id of a Tote whose wave_id equals this wave"
      - name: transport_cost_cents
        type: integer
        source: computed
        description: "Output of wave_transport_cost; null until loading-sequence runs."
        default: null
        constraints: ">= 0 when present"
      - name: consolidated_by_user_id
        type: string
        source: computed
        description: "Opaque X-User-ID of the WavePlanner that ran consolidate; the segregation-of-duties comparison target at dispatch."
        default: null

  - name: Tote
    parent: null
    common_fields: true
    fields:
      - name: wave_id
        type: string
        source: input
        description: "FK -> DeliveryWave.id; the wave this tote is being filled for."
        constraints: "must reference an existing DeliveryWave"
      - name: pick_station_id
        type: string
        source: input
        description: "FK -> PickStation.id; the station where this tote is filled."
        constraints: "must reference an existing PickStation whose temperature_zone_capability contains this tote's temperature_zone"
      - name: tote_code
        type: string
        source: input
        description: "Human-readable tote identifier, unique across Tote."
        constraints: "1-32 chars; unique"
      - name: temperature_zone
        type: enum
        source: input
        description: "Temperature class this tote is segregated for; a PickTask may only be assigned to a tote of its SKU's temperature_zone."
        constraints: "one of {AMBIENT, CHILLED, FROZEN}"
      - name: status
        type: enum
        source: computed
        description: "Tote lifecycle; OPEN and SEALED alternate while the wave is still PICKING."
        default: OPEN
        constraints: "one of {OPEN, SEALED, CONSOLIDATED, LOADED}"
      - name: assigned_line_count
        type: integer
        source: computed
        description: "COUNT of PickTask rows with tote_id == this tote and status IN {QUEUED, RETRIEVING, COMPLETED, SHORT}."
        default: 0
        constraints: ">= 0"

  - name: PickTask
    parent: null
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: computed
        description: "FK -> OrderLine.id; the line this retrieval serves."
        constraints: "must reference an existing OrderLine"
      - name: sku_id
        type: string
        source: computed
        description: "FK -> InventorySku.id; the SKU actually being retrieved, which differs from OrderLine.sku_id on a substitute task."
        constraints: "must reference an existing InventorySku"
      - name: grid_zone_id
        type: string
        source: computed
        description: "FK -> GridZone.id; copied from the retrieved SKU's grid_zone_id at task creation."
        constraints: "must reference an existing GridZone"
      - name: pick_station_id
        type: string
        source: computed
        description: "FK -> PickStation.id; chosen by pick_station_assignment at task creation."
        constraints: "must reference an existing PickStation"
      - name: tote_id
        type: string
        source: computed
        description: "FK -> Tote.id; bound by assign-tote, null before that."
        default: null
      - name: sequence_index
        type: integer
        source: computed
        description: "1-based position of this task in retrieval_sequence within its wave."
        constraints: ">= 1"
      - name: allocated_units
        type: integer
        source: computed
        description: "Units reserved against the SKU while this task is in {QUEUED, RETRIEVING}; equals OrderLine.ordered_qty at creation."
        constraints: ">= 1"
      - name: picked_units
        type: integer
        source: computed
        description: "Units actually retrieved, reported at completion; null before completion."
        default: null
        constraints: ">= 0 and <= allocated_units when present"
      - name: actual_weight_grams
        type: integer
        source: computed
        description: "Measured weight in grams reported at completion; null for non-catchweight SKUs."
        default: null
        constraints: ">= 0 when present"
      - name: status
        type: enum
        source: computed
        description: "Retrieval lifecycle."
        default: QUEUED
        constraints: "one of {QUEUED, RETRIEVING, COMPLETED, SHORT, CANCELLED}"

  - name: SubstitutionProposal
    parent: null
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: input
        description: "FK -> OrderLine.id; the short line this proposal offers a substitute for."
        constraints: "must reference an existing OrderLine whose line_status == SHORT"
      - name: substitute_sku_id
        type: string
        source: input
        description: "FK -> InventorySku.id; the SKU offered in place of the ordered one."
        constraints: "must reference an existing InventorySku sharing the ordered SKU's temperature_zone and substitution_group_code"
      - name: supersedes_proposal_id
        type: string
        source: input
        description: "FK -> SubstitutionProposal.id; the DECLINED or EXPIRED proposal on the same line that this one replaces; null for the first proposal on a line."
        default: null
        constraints: "when present must reference a SubstitutionProposal with the same order_line_id and status IN {DECLINED, EXPIRED}"
      - name: round_no
        type: integer
        source: computed
        description: "1 for the first proposal on a line; one more than the highest existing round_no on that line thereafter."
        constraints: ">= 1"
      - name: proposed_price_delta_cents
        type: integer
        source: computed
        description: "(substitute InventorySku.unit_price_cents * OrderLine.ordered_qty) - OrderLine.provisional_line_price_cents; may be negative."
      - name: status
        type: enum
        source: computed
        description: "Proposal lifecycle; DRAFT and PROPOSED are the statuses that keep the line's substitution_resolution PENDING visible to the wave posture."
        default: DRAFT
        constraints: "one of {DRAFT, PROPOSED, APPROVED, DECLINED, EXPIRED}"
      - name: expires_at
        type: datetime
        source: computed
        description: "Logical-clock instant after which the customer may no longer approve; set by propose to clock_now + PROPOSAL_TTL_MINUTES; null while DRAFT."
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"

# -----------------------------------------------------------------------------
# §1.2 State Machine Table (9 machines; CustomerOrder carries two parallel
# dimensions, Tote / OrderLine / GridZone carry cycles, DeliveryWave carries a
# derived posture that gates its children)
# -----------------------------------------------------------------------------
state_machines:

  # === CustomerOrder — parallel dimension A: fulfillment_status ============
  - entity: CustomerOrder
    dimension: fulfillment_status
    initial_state: DRAFT
    terminal_states: [DISPATCHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SLOTTED
        trigger: "POST /slot-bookings/{bookingId}/confirm, or system promotion of a WAITLISTED booking to CONFIRMED inside the order-cancel cascade"
        actor: Customer
        preconditions:
          - "the booking's customer_order_id == this order"
          - "booking.status == HELD (customer confirm) or booking.status == WAITLISTED (system promotion)"
          - "order.merchandise_subtotal_cents >= MINIMUM_ORDER_CENTS"
        side_effects:
          - "booking.status -> CONFIRMED"
          - "DeliverySlot.held_units / confirmed_units / available_units recomputed by slot_capacity_ledger"
          - "DeliverySlot.surge_multiplier recomputed by slot_surge_multiplier"
          - "order.billing_status PENDING_AUTH -> AUTHORIZED (dimension B), authorized_amount_cents = order_total_cents"
          - "increments CustomerOrder.version by 1"
      - from: SLOTTED
        to: DRAFT
        trigger: "POST /delivery-slots/{slotId}/withhold-capacity that bumps this order's CONFIRMED SlotBooking"
        actor: FulfillmentAdmin
        preconditions:
          - "the order has a SlotBooking on this slot with status == CONFIRMED"
          - "that booking is selected by the bump selector (CONFIRMED bookings ordered created_at DESC, then units ASC, bumped one at a time until available_units >= 0)"
          - "order.wave_id is null (a waved order is past the point of no return and is never bumped)"
        side_effects:
          - "booking.status CONFIRMED -> BUMPED"
          - "order.billing_status AUTHORIZED -> PENDING_AUTH (dimension B), authorized_amount_cents = null"
          - "delivery_fee_cents, loyalty_discount_cents and order_total_cents revert to null because the order no longer has a booking in {HELD, CONFIRMED}"
          - "DeliverySlot.confirmed_units / available_units recomputed by slot_capacity_ledger, then surge_multiplier recomputed"
          - "increments CustomerOrder.version by 1"
      - from: SLOTTED
        to: WAVED
        trigger: "POST /delivery-waves/{waveId}/slot-orders"
        actor: WavePlanner
        preconditions:
          - "wave.status == FORMING"
          - "clock_now < wave.cutoff_at"
          - "the order has a SlotBooking with status == CONFIRMED whose delivery_slot_id == wave.delivery_slot_id (else ERR_WAVE_SLOT_MISMATCH)"
          - "the order's CustomerAccount.home_route_id == wave.route_id (else ERR_ROUTE_MISMATCH)"
        side_effects:
          - "order.wave_id = wave.id"
          - "wave.order_count recomputed"
          - "increments CustomerOrder.version by 1"
      - from: WAVED
        to: PICKING
        trigger: "POST /delivery-waves/{waveId}/start-picking"
        actor: WavePlanner
        preconditions:
          - "wave.status == FORMING and wave.order_count >= 1"
          - "for every OrderLine of the order with line_status == PENDING: InventorySku.on_hand_units >= OrderLine.ordered_qty (else ERR_INSUFFICIENT_INVENTORY)"
          - "pick_station_assignment yields a non-empty candidate pool for every such line (else ERR_NO_ELIGIBLE_PICK_STATION)"
        side_effects:
          - "wave.status FORMING -> PICKING"
          - "one PickTask created in QUEUED per PENDING OrderLine, with sku_id = OrderLine.sku_id, grid_zone_id = sku.grid_zone_id, pick_station_id from pick_station_assignment, sequence_index from retrieval_sequence, allocated_units = OrderLine.ordered_qty"
          - "InventorySku.allocated_units and on_hand_units recomputed by sku_unit_ledger"
          - "increments CustomerOrder.version by 1"
      - from: PICKING
        to: CONSOLIDATED
        trigger: "POST /delivery-waves/{waveId}/consolidate"
        actor: WavePlanner
        preconditions:
          - "wave.status == PICKING and wave.posture != FROZEN"
          - "every PickTask of the wave has status IN {COMPLETED, SHORT, CANCELLED}"
          - "COUNT(Tote WHERE wave_id == wave.id AND status == SEALED) >= 1 (else ERR_NO_TOTES_TO_CONSOLIDATE)"
        side_effects:
          - "every Tote of the wave with status == SEALED -> CONSOLIDATED"
          - "wave.status PICKING -> CONSOLIDATED, wave.consolidated_by_user_id = X-User-ID"
          - "order_charge_waterfall re-run; if order_total_cents changed and billing_status IN {AUTHORIZED, ADJUSTED} then billing_status -> ADJUSTED"
          - "increments CustomerOrder.version by 1"
      - from: CONSOLIDATED
        to: LOADED
        trigger: "POST /delivery-waves/{waveId}/loading-sequence"
        actor: WavePlanner
        preconditions:
          - "wave.status == CONSOLIDATED"
          - "wave.dock_bay_id is not null (else ERR_DOCK_NOT_ASSIGNED)"
          - "wave.posture == OPEN — FROZEN yields ERR_WAVE_FROZEN, RESTRICTED yields ERR_ORDER_DISPATCH_BLOCKED"
        side_effects:
          - "wave.load_sequence and wave.transport_cost_cents computed by wave_loading_sequence and wave_transport_cost"
          - "every Tote of the wave with status == CONSOLIDATED -> LOADED"
          - "wave.status CONSOLIDATED -> LOADING"
          - "increments CustomerOrder.version by 1"
      - from: LOADED
        to: DISPATCHED
        trigger: "POST /delivery-waves/{waveId}/dispatch"
        actor: WavePlanner
        preconditions:
          - "wave.status == LOADING"
          - "X-User-ID != wave.consolidated_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "wave.status LOADING -> DISPATCHED"
          - "order.billing_status -> CAPTURED (dimension B), captured_amount_cents = order_total_cents"
          - "increments CustomerOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /customer-orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "the acting Customer's X-User-ID == order.customer_id, or the actor is FulfillmentAdmin"
        side_effects:
          - "every OrderLine of the order with line_status IN {PENDING, SHORT} -> CANCELLED"
          - "every SlotBooking of the order with status IN {HELD, CONFIRMED, WAITLISTED} -> RELEASED (cascade hop 1)"
          - "increments CustomerOrder.version by 1"
        note: "Cancel from DRAFT leaves billing_status at PENDING_AUTH because no authorisation exists yet."
      - from: SLOTTED
        to: CANCELLED
        trigger: "POST /customer-orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "the acting Customer's X-User-ID == order.customer_id, or the actor is FulfillmentAdmin"
        side_effects:
          - "every OrderLine of the order with line_status IN {PENDING, SHORT} -> CANCELLED"
          - "cascade hop 1: every SlotBooking of the order with status IN {HELD, CONFIRMED, WAITLISTED} -> RELEASED"
          - "cascade hop 2: because those bookings left {HELD, CONFIRMED}, DeliverySlot.held_units / confirmed_units / available_units are recomputed by slot_capacity_ledger and surge_multiplier is recomputed by slot_surge_multiplier"
          - "cascade hop 3: because available_units rose, the slot's waitlist promotion selector picks at most one SlotBooking with status == WAITLISTED and units <= available_units and flips it to CONFIRMED"
          - "cascade hop 4: because that booking became CONFIRMED, its CustomerOrder moves fulfillment_status DRAFT -> SLOTTED and billing_status PENDING_AUTH -> AUTHORIZED with authorized_amount_cents = its order_total_cents"
          - "order.billing_status -> REVERSED when it was IN {AUTHORIZED, ADJUSTED} (dimension B)"
          - "increments CustomerOrder.version by 1"
      - from: WAVED
        to: CANCELLED
        trigger: "POST /customer-orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "the acting Customer's X-User-ID == order.customer_id, or the actor is FulfillmentAdmin"
          - "the order's wave.status == FORMING"
        side_effects:
          - "same four-hop booking / slot / waitlist / promoted-order cascade as the SLOTTED -> CANCELLED transition"
          - "order.wave_id = null, wave.order_count recomputed, wave.posture recomputed"
          - "order.billing_status -> REVERSED when it was IN {AUTHORIZED, ADJUSTED}"
          - "increments CustomerOrder.version by 1"

  # === CustomerOrder — parallel dimension B: billing_status ================
  - entity: CustomerOrder
    dimension: billing_status
    initial_state: PENDING_AUTH
    terminal_states: [CAPTURED, REVERSED]
    transitions:
      - from: PENDING_AUTH
        to: AUTHORIZED
        trigger: "POST /slot-bookings/{bookingId}/confirm, or system promotion of a WAITLISTED booking inside the order-cancel cascade"
        actor: Customer
        preconditions:
          - "order_charge_waterfall has produced a non-null order_total_cents"
        side_effects:
          - "authorized_amount_cents = order_total_cents"
        note: "Advances in the same request as fulfillment_status DRAFT -> SLOTTED, but the two dimensions are independent thereafter."
      - from: AUTHORIZED
        to: ADJUSTED
        trigger: "POST /pick-tasks/{taskId}/complete, POST /substitution-proposals/{proposalId}/approve, POST /order-lines/{lineId}/accept-shortage, or POST /delivery-waves/{waveId}/consolidate"
        actor: PickOperator
        preconditions:
          - "the re-run of order_charge_waterfall yields an order_total_cents different from the current stored value"
        side_effects:
          - "merchandise_subtotal_cents, delivery_fee_cents, loyalty_discount_cents and order_total_cents rewritten"
          - "authorized_amount_cents left unchanged so the adjustment delta stays observable"
      - from: ADJUSTED
        to: ADJUSTED
        trigger: "any further POST /pick-tasks/{taskId}/complete, POST /substitution-proposals/{proposalId}/approve or POST /order-lines/{lineId}/accept-shortage that changes order_total_cents"
        actor: PickOperator
        preconditions:
          - "the re-run of order_charge_waterfall yields an order_total_cents different from the current stored value"
        side_effects:
          - "order totals rewritten; billing_status stays ADJUSTED"
        note: "Self-loop: an order may be re-adjusted any number of times before dispatch."
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /delivery-waves/{waveId}/dispatch"
        actor: WavePlanner
        preconditions:
          - "order.fulfillment_status == LOADED"
        side_effects:
          - "captured_amount_cents = order_total_cents"
      - from: ADJUSTED
        to: CAPTURED
        trigger: "POST /delivery-waves/{waveId}/dispatch"
        actor: WavePlanner
        preconditions:
          - "order.fulfillment_status == LOADED"
        side_effects:
          - "captured_amount_cents = order_total_cents"
      - from: AUTHORIZED
        to: PENDING_AUTH
        trigger: "POST /delivery-slots/{slotId}/withhold-capacity that bumps this order's CONFIRMED SlotBooking"
        actor: FulfillmentAdmin
        preconditions:
          - "the order's fulfillment_status == SLOTTED and its booking on this slot is the one selected by the bump selector"
        side_effects:
          - "authorized_amount_cents = null"
          - "order.fulfillment_status SLOTTED -> DRAFT (dimension A)"
          - "delivery_fee_cents, loyalty_discount_cents and order_total_cents revert to null"
          - "increments CustomerOrder.version by 1"
      - from: AUTHORIZED
        to: REVERSED
        trigger: "POST /customer-orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "order.fulfillment_status IN {SLOTTED, WAVED}"
        side_effects:
          - "authorized_amount_cents left unchanged; captured_amount_cents stays null"
      - from: ADJUSTED
        to: REVERSED
        trigger: "POST /customer-orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "order.fulfillment_status IN {SLOTTED, WAVED}"
        side_effects:
          - "authorized_amount_cents left unchanged; captured_amount_cents stays null"

  # === OrderLine — cyclic (PENDING -> SHORT -> PENDING) ====================
  - entity: OrderLine
    dimension: line_status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: PICKED
        trigger: "POST /pick-tasks/{taskId}/complete with picked_units == task.allocated_units"
        actor: PickOperator
        preconditions:
          - "task.status == RETRIEVING and task.order_line_id == this line"
          - "when the retrieved InventorySku.is_catchweight is true: actual_weight_grams is present and abs(actual_weight_grams - line.nominal_weight_grams * line.ordered_qty) / (line.nominal_weight_grams * line.ordered_qty) <= sku.weight_tolerance_pct (else ERR_WEIGHT_OUT_OF_TOLERANCE)"
        side_effects:
          - "line.picked_units = task.picked_units, line.picked_weight_grams = task.actual_weight_grams"
          - "line.final_line_price_cents written by the final variant of order_line_catchweight_price"
          - "InventorySku.physical_units -= task.picked_units and the task leaves the allocated set, so sku_unit_ledger keeps on_hand_units unchanged"
          - "order_charge_waterfall re-run on the parent order; billing_status AUTHORIZED -> ADJUSTED when order_total_cents changed"
          - "Tote.assigned_line_count recomputed"
      - from: PENDING
        to: SHORT
        trigger: "POST /pick-tasks/{taskId}/complete with picked_units < task.allocated_units"
        actor: PickOperator
        preconditions:
          - "task.status == RETRIEVING and task.order_line_id == this line"
          - "picked_units >= 0"
        side_effects:
          - "cascade hop 1: because the task ended SHORT, line.line_status -> SHORT and line.substitution_resolution NOT_REQUIRED -> PENDING; line.final_line_price_cents stays null"
          - "cascade hop 2: because the line's substitution_resolution became PENDING, substitute_sku_selector runs and, when its candidate pool is non-empty, a SubstitutionProposal is created in DRAFT with round_no = 1"
          - "cascade hop 3: because a DRAFT proposal now exists on a line of this order, CustomerOrder.open_substitution_count and dispatch_blocked are recomputed (dispatch_blocked -> true), order_charge_waterfall drops the SHORT line from merchandise_subtotal_cents and billing_status AUTHORIZED -> ADJUSTED"
          - "cascade hop 4: because a member order became dispatch_blocked, wave_posture recomputes DeliveryWave.posture OPEN -> RESTRICTED"
          - "InventorySku.physical_units -= task.picked_units; the task leaves the allocated set"
      - from: SHORT
        to: PENDING
        trigger: "POST /substitution-proposals/{proposalId}/approve"
        actor: Customer
        preconditions:
          - "proposal.status == PROPOSED and clock_now < proposal.expires_at"
          - "proposal.order_line_id == this line and line.substitution_resolution == PENDING"
        side_effects:
          - "line.substitution_resolution -> SUBSTITUTED, line.line_status SHORT -> PENDING, line.picked_units -> null"
          - "line.final_line_price_cents = substitute InventorySku.unit_price_cents * line.ordered_qty"
          - "a new PickTask is created in QUEUED with sku_id = proposal.substitute_sku_id, allocating substitute units through sku_unit_ledger"
          - "CustomerOrder.dispatch_blocked recomputed (false when no other line is PENDING resolution) and order_charge_waterfall re-run"
          - "DeliveryWave.posture recomputed by wave_posture"
        note: "This edge closes the PENDING -> SHORT -> PENDING cycle on a single OrderLine row."
      - from: SHORT
        to: CANCELLED
        trigger: "POST /order-lines/{lineId}/accept-shortage"
        actor: Customer
        preconditions:
          - "line.line_status == SHORT and line.substitution_resolution == PENDING (else ERR_LINE_NOT_SHORT)"
          - "the acting Customer's X-User-ID == the line's CustomerOrder.customer_id"
        side_effects:
          - "line.substitution_resolution -> SHORTAGE_ACCEPTED"
          - "every SubstitutionProposal on this line with status IN {DRAFT, PROPOSED} -> EXPIRED"
          - "CustomerOrder.open_substitution_count and dispatch_blocked recomputed; order_charge_waterfall re-run"
          - "DeliveryWave.posture recomputed by wave_posture"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /customer-orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "the parent order's fulfillment_status IN {DRAFT, SLOTTED, WAVED}"
        side_effects:
          - "any PickTask on this line with status IN {QUEUED, RETRIEVING} -> CANCELLED, releasing its allocation"

  # === PickTask — branching terminal set ==================================
  - entity: PickTask
    initial_state: QUEUED
    terminal_states: [COMPLETED, SHORT, CANCELLED]
    transitions:
      - from: QUEUED
        to: RETRIEVING
        trigger: "POST /pick-tasks/{taskId}/start-retrieval"
        actor: PickOperator
        preconditions:
          - "task.tote_id is not null (else ERR_TOTE_NOT_ASSIGNED)"
          - "GridZone(task.grid_zone_id).status == OPERATIONAL (else ERR_ZONE_NOT_OPERATIONAL) — a cross-entity dependency on the zone's own state machine"
          - "the task's DeliveryWave.status == PICKING"
        side_effects:
          - "task.status QUEUED -> RETRIEVING; the task stays inside the InventorySku allocated set"
      - from: QUEUED
        to: QUEUED
        trigger: "POST /pick-tasks/{taskId}/assign-tote"
        actor: PickOperator
        preconditions:
          - "task.status == QUEUED (else ERR_INVALID_STATE)"
          - "Tote(tote_id).status == OPEN and Tote.wave_id == the task's wave"
          - "Tote.temperature_zone == InventorySku(task.sku_id).temperature_zone (else ERR_TEMPERATURE_ZONE_MISMATCH)"
        side_effects:
          - "task.tote_id = tote_id; Tote.assigned_line_count recomputed"
        note: "Self-loop on QUEUED: re-assigning a different OPEN tote before retrieval starts is legitimate."
      - from: RETRIEVING
        to: COMPLETED
        trigger: "POST /pick-tasks/{taskId}/complete with picked_units == allocated_units"
        actor: PickOperator
        preconditions:
          - "picked_units == task.allocated_units"
          - "catchweight tolerance satisfied per order_line_catchweight_price"
        side_effects:
          - "OrderLine PENDING -> PICKED with the full side-effect chain declared on that transition"
          - "InventorySku.physical_units -= picked_units; allocated_units recomputed; on_hand_units unchanged"
      - from: RETRIEVING
        to: SHORT
        trigger: "POST /pick-tasks/{taskId}/complete with picked_units < allocated_units"
        actor: PickOperator
        preconditions:
          - "0 <= picked_units < task.allocated_units"
        side_effects:
          - "OrderLine PENDING -> SHORT with the four-hop cascade declared on that transition"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /pick-tasks/{taskId}/cancel"
        actor: PickOperator
        preconditions:
          - "the task's DeliveryWave.status == PICKING"
        side_effects:
          - "the task leaves the InventorySku allocated set, so sku_unit_ledger restores allocated_units and on_hand_units to their pre-allocation values with zero drift"
          - "Tote.assigned_line_count recomputed"
      - from: RETRIEVING
        to: CANCELLED
        trigger: "POST /pick-tasks/{taskId}/cancel"
        actor: PickOperator
        preconditions:
          - "the task's DeliveryWave.status == PICKING"
        side_effects:
          - "the task leaves the InventorySku allocated set; InventorySku.physical_units unchanged"

  # === Tote — cyclic (OPEN -> SEALED -> OPEN) =============================
  - entity: Tote
    initial_state: OPEN
    terminal_states: [LOADED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /totes/{toteId}/seal"
        actor: PickOperator
        preconditions:
          - "every PickTask with tote_id == this tote has status IN {COMPLETED, SHORT, CANCELLED}"
          - "the tote's DeliveryWave.status == PICKING and posture != FROZEN (else ERR_WAVE_FROZEN)"
        side_effects:
          - "PickStation.current_tote_count decremented; PickStation.status recomputed"
      - from: SEALED
        to: OPEN
        trigger: "POST /totes/{toteId}/unseal"
        actor: PickOperator
        preconditions:
          - "the tote's DeliveryWave.status == PICKING and posture != FROZEN (else ERR_WAVE_FROZEN)"
          - "PickStation.current_tote_count < PickStation.max_concurrent_totes (else ERR_STATION_TOTE_CAPACITY_EXCEEDED)"
        side_effects:
          - "PickStation.current_tote_count incremented; PickStation.status recomputed"
        note: "Closes the OPEN -> SEALED -> OPEN cycle; used to insert an approved substitute item into an already-sealed tote."
      - from: SEALED
        to: CONSOLIDATED
        trigger: "POST /delivery-waves/{waveId}/consolidate"
        actor: WavePlanner
        preconditions:
          - "wave.status == PICKING and wave.posture != FROZEN"
        side_effects:
          - "wave.status PICKING -> CONSOLIDATED"
      - from: CONSOLIDATED
        to: LOADED
        trigger: "POST /delivery-waves/{waveId}/loading-sequence"
        actor: WavePlanner
        preconditions:
          - "wave.status == CONSOLIDATED, wave.dock_bay_id is not null, wave.posture == OPEN"
        side_effects:
          - "the tote's id appears exactly once in wave.load_sequence at the position given by wave_loading_sequence"

  # === SlotBooking — branching initial state ==============================
  - entity: SlotBooking
    initial_state: HELD
    terminal_states: [RELEASED, BUMPED]
    transitions:
      - from: null
        to: HELD
        trigger: "POST /slot-bookings when slot.available_units >= units"
        actor: Customer
        preconditions:
          - "clock_now < slot.window_start (else ERR_SLOT_WINDOW_CLOSED)"
          - "slot.route_id == the acting CustomerAccount.home_route_id (else ERR_ROUTE_MISMATCH)"
          - "order.merchandise_subtotal_cents >= MINIMUM_ORDER_CENTS (else ERR_MINIMUM_ORDER_NOT_MET)"
          - "units <= slot.total_capacity_units - slot.withheld_units (else ERR_SLOT_UNITS_EXCEED_CAPACITY)"
          - "expected_order_version == order.version (else ERR_STALE_VERSION)"
        side_effects:
          - "surge_multiplier_at_booking = slot.surge_multiplier, quoted_fee_cents = round_half_up(route.base_delivery_fee_cents * surge_multiplier_at_booking)"
          - "slot ledger and surge recomputed; order_charge_waterfall run so delivery_fee_cents / loyalty_discount_cents / order_total_cents become non-null"
          - "increments CustomerOrder.version by 1"
      - from: null
        to: WAITLISTED
        trigger: "POST /slot-bookings when slot.available_units < units"
        actor: Customer
        preconditions:
          - "same preconditions as the HELD branch"
        side_effects:
          - "no slot capacity is occupied; slot.available_units unchanged"
          - "surge_multiplier_at_booking and quoted_fee_cents captured exactly as on the HELD branch"
          - "order_charge_waterfall run; order stays fulfillment_status DRAFT"
          - "increments CustomerOrder.version by 1"
        note: "Branch point: the same request yields HELD or WAITLISTED depending on the slot ledger, with divergent side-effect sets."
      - from: HELD
        to: CONFIRMED
        trigger: "POST /slot-bookings/{bookingId}/confirm"
        actor: Customer
        preconditions:
          - "booking.status == HELD"
          - "clock_now < slot.window_start"
          - "the acting Customer's X-User-ID == the booking's CustomerOrder.customer_id"
        side_effects:
          - "held_units / confirmed_units / available_units recomputed; surge recomputed"
          - "CustomerOrder fulfillment_status DRAFT -> SLOTTED and billing_status PENDING_AUTH -> AUTHORIZED"
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system waitlist promotion inside the order-cancel cascade or inside POST /delivery-slots/{slotId}/release-capacity"
        actor: system
        preconditions:
          - "slot.available_units >= booking.units after the ledger recompute"
          - "the booking is the unique winner of the waitlist promotion selector (created_at ASC, then units DESC, then quoted_fee_cents DESC)"
        side_effects:
          - "confirmed_units and available_units recomputed; surge recomputed"
          - "its CustomerOrder moves fulfillment_status DRAFT -> SLOTTED and billing_status PENDING_AUTH -> AUTHORIZED"
      - from: HELD
        to: RELEASED
        trigger: "POST /customer-orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "the booking's CustomerOrder is being cancelled"
        side_effects:
          - "held_units and available_units recomputed so slot_capacity_ledger balances with zero drift"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /customer-orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "the booking's CustomerOrder is being cancelled"
        side_effects:
          - "confirmed_units and available_units recomputed; waitlist promotion evaluated (cascade hops 2-4)"
      - from: WAITLISTED
        to: RELEASED
        trigger: "POST /customer-orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "the booking's CustomerOrder is being cancelled"
        side_effects:
          - "no ledger change; the booking simply leaves the waitlist"
      - from: CONFIRMED
        to: BUMPED
        trigger: "POST /delivery-slots/{slotId}/withhold-capacity"
        actor: FulfillmentAdmin
        preconditions:
          - "after raising withheld_units the slot ledger would drive available_units below zero"
          - "the booking is selected by the bump selector: CONFIRMED bookings ordered created_at DESC, then units ASC, bumped one at a time until available_units >= 0"
        side_effects:
          - "confirmed_units and available_units recomputed"
          - "its CustomerOrder fulfillment_status SLOTTED -> DRAFT (dimension A) and billing_status AUTHORIZED -> PENDING_AUTH (dimension B), authorized_amount_cents reset to null"
          - "increments CustomerOrder.version by 1"

  # === DeliveryWave — compound status + derived posture gate ===============
  - entity: DeliveryWave
    initial_state: FORMING
    terminal_states: [DISPATCHED]
    transitions:
      - from: FORMING
        to: PICKING
        trigger: "POST /delivery-waves/{waveId}/start-picking"
        actor: WavePlanner
        preconditions:
          - "wave.order_count >= 1 (else ERR_WAVE_HAS_NO_ORDERS)"
          - "wave.posture != FROZEN (else ERR_WAVE_FROZEN)"
          - "for every PENDING OrderLine of every WAVED member order the SKU has on_hand_units >= ordered_qty"
        side_effects:
          - "one QUEUED PickTask per PENDING OrderLine, sequenced by retrieval_sequence and stationed by pick_station_assignment"
          - "InventorySku.allocated_units raised and on_hand_units lowered by sku_unit_ledger"
          - "every WAVED member order moves fulfillment_status WAVED -> PICKING"
      - from: PICKING
        to: CONSOLIDATED
        trigger: "POST /delivery-waves/{waveId}/consolidate"
        actor: WavePlanner
        preconditions:
          - "every PickTask of the wave has status IN {COMPLETED, SHORT, CANCELLED}"
          - "COUNT(Tote WHERE wave_id == wave.id AND status == SEALED) >= 1 (else ERR_NO_TOTES_TO_CONSOLIDATE)"
          - "wave.posture != FROZEN (else ERR_WAVE_FROZEN)"
        side_effects:
          - "SEALED totes -> CONSOLIDATED; member orders PICKING -> CONSOLIDATED"
          - "wave.consolidated_by_user_id = X-User-ID (the segregation-of-duties anchor)"
          - "order_charge_waterfall re-run per member order"
      - from: CONSOLIDATED
        to: LOADING
        trigger: "POST /delivery-waves/{waveId}/loading-sequence"
        actor: WavePlanner
        preconditions:
          - "wave.dock_bay_id is not null (else ERR_DOCK_NOT_ASSIGNED)"
          - "no member CustomerOrder has dispatch_blocked == true, i.e. wave.posture == OPEN (else ERR_ORDER_DISPATCH_BLOCKED) — a cross-entity dependency on CustomerOrder state"
          - "wave.posture != FROZEN (else ERR_WAVE_FROZEN)"
        side_effects:
          - "wave.load_sequence = wave_loading_sequence output; wave.transport_cost_cents = wave_transport_cost output"
          - "CONSOLIDATED totes -> LOADED; member orders CONSOLIDATED -> LOADED"
      - from: LOADING
        to: DISPATCHED
        trigger: "POST /delivery-waves/{waveId}/dispatch"
        actor: WavePlanner
        preconditions:
          - "X-User-ID != wave.consolidated_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "member orders CONSOLIDATED/LOADED -> DISPATCHED and billing_status -> CAPTURED"
      - from: FORMING
        to: FORMING
        trigger: "POST /delivery-waves/{waveId}/slot-orders or POST /delivery-waves/{waveId}/assign-dock"
        actor: WavePlanner
        preconditions:
          - "for slot-orders: clock_now < wave.cutoff_at and every listed order is SLOTTED with a CONFIRMED booking on wave.delivery_slot_id"
          - "for assign-dock: the dock-bay aggregate-capacity overlap test passes"
        side_effects:
          - "order_count / posture recomputed (slot-orders) or dock_bay_id / load_start / load_end written (assign-dock)"
        note: "Self-loop: wave composition and dock scheduling both happen without leaving FORMING."

  # === SubstitutionProposal — branching terminal set =======================
  - entity: SubstitutionProposal
    initial_state: DRAFT
    terminal_states: [APPROVED, DECLINED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /substitution-proposals/{proposalId}/propose"
        actor: PickOperator
        preconditions:
          - "proposal.status == DRAFT"
          - "the proposal's OrderLine.substitution_resolution == PENDING"
          - "InventorySku(substitute_sku_id).on_hand_units >= OrderLine.ordered_qty (else ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "expires_at = clock_now + PROPOSAL_TTL_MINUTES minutes"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /substitution-proposals/{proposalId}/approve"
        actor: Customer
        preconditions:
          - "clock_now < proposal.expires_at (else ERR_PROPOSAL_EXPIRED)"
          - "the acting Customer's X-User-ID == the line's CustomerOrder.customer_id (else ERR_ORDER_NOT_OWNED)"
          - "the line's DeliveryWave.status == PICKING"
        side_effects:
          - "OrderLine SHORT -> PENDING with substitution_resolution -> SUBSTITUTED and final_line_price_cents rewritten"
          - "a substitute PickTask is created in QUEUED, allocating substitute units"
          - "CustomerOrder.dispatch_blocked / open_substitution_count recomputed; order_charge_waterfall re-run"
          - "DeliveryWave.posture recomputed"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /substitution-proposals/{proposalId}/decline"
        actor: Customer
        preconditions:
          - "clock_now < proposal.expires_at (else ERR_PROPOSAL_EXPIRED)"
          - "the acting Customer's X-User-ID == the line's CustomerOrder.customer_id"
        side_effects:
          - "OrderLine.substitution_resolution stays PENDING, so CustomerOrder.dispatch_blocked stays true and the wave posture stays RESTRICTED"
          - "CustomerOrder.open_substitution_count decremented"
        note: "Divergent branch: unlike APPROVED, this leaves the line short and the wave still blocked."
      - from: PROPOSED
        to: EXPIRED
        trigger: "POST /substitution-proposals/{proposalId}/expire"
        actor: WavePlanner
        preconditions:
          - "clock_now >= proposal.expires_at (else ERR_PROPOSAL_NOT_EXPIRED)"
        side_effects:
          - "OrderLine.substitution_resolution stays PENDING; CustomerOrder.open_substitution_count decremented"
      - from: DRAFT
        to: EXPIRED
        trigger: "POST /order-lines/{lineId}/accept-shortage"
        actor: Customer
        preconditions:
          - "the line's substitution_resolution == PENDING"
        side_effects:
          - "CustomerOrder.open_substitution_count decremented"
      - from: PROPOSED
        to: EXPIRED
        trigger: "POST /order-lines/{lineId}/accept-shortage"
        actor: Customer
        preconditions:
          - "the line's substitution_resolution == PENDING"
        side_effects:
          - "CustomerOrder.open_substitution_count decremented"

  # === GridZone — cyclic in two independent loops ==========================
  - entity: GridZone
    initial_state: OPERATIONAL
    terminal_states: []
    transitions:
      - from: OPERATIONAL
        to: MAINTENANCE
        trigger: "POST /maintenance-windows/{windowId}/activate"
        actor: GridEngineer
        preconditions:
          - "window.status == SCHEDULED"
          - "window.window_start <= clock_now < window.window_end"
          - "zone.status == OPERATIONAL"
        side_effects:
          - "every DeliveryWave with a PickTask in {QUEUED, RETRIEVING} on this zone recomputes posture to FROZEN by wave_posture"
      - from: MAINTENANCE
        to: OPERATIONAL
        trigger: "POST /maintenance-windows/{windowId}/complete"
        actor: GridEngineer
        preconditions:
          - "window.status == ACTIVE"
        side_effects:
          - "affected DeliveryWave postures recomputed by wave_posture (FROZEN -> RESTRICTED or OPEN)"
        note: "Closes the OPERATIONAL -> MAINTENANCE -> OPERATIONAL cycle."
      - from: OPERATIONAL
        to: AUDIT_HOLD
        trigger: "POST /grid-zones/{zoneId}/audit-counts producing accuracy_score_unit_weighted < ACCURACY_HOLD_THRESHOLD"
        actor: GridEngineer
        preconditions:
          - "zone.status == OPERATIONAL"
        side_effects:
          - "affected DeliveryWave postures recomputed to FROZEN"
      - from: AUDIT_HOLD
        to: OPERATIONAL
        trigger: "POST /grid-zones/{zoneId}/audit-counts producing accuracy_score_unit_weighted >= ACCURACY_HOLD_THRESHOLD"
        actor: GridEngineer
        preconditions:
          - "zone.status == AUDIT_HOLD"
        side_effects:
          - "affected DeliveryWave postures recomputed by wave_posture"
        note: "Closes the OPERATIONAL -> AUDIT_HOLD -> OPERATIONAL cycle; a second audit pass is the only way out."
      - from: AUDIT_HOLD
        to: AUDIT_HOLD
        trigger: "POST /grid-zones/{zoneId}/audit-counts producing accuracy_score_unit_weighted < ACCURACY_HOLD_THRESHOLD"
        actor: GridEngineer
        preconditions:
          - "zone.status == AUDIT_HOLD"
        side_effects:
          - "both accuracy scores and every counted SKU's physical_units rewritten; the hold persists"

  # === MaintenanceWindow — linear ==========================================
  - entity: MaintenanceWindow
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /maintenance-windows/{windowId}/activate"
        actor: GridEngineer
        preconditions:
          - "window.window_start <= clock_now < window.window_end"
          - "GridZone(grid_zone_id).status == OPERATIONAL (else ERR_ZONE_NOT_OPERATIONAL)"
        side_effects:
          - "GridZone.status OPERATIONAL -> MAINTENANCE, cascading into wave_posture"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /maintenance-windows/{windowId}/complete"
        actor: GridEngineer
        preconditions:
          - "window.status == ACTIVE"
        side_effects:
          - "GridZone.status MAINTENANCE -> OPERATIONAL, cascading into wave_posture"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: booking-create-stale-order
    parent_entity: CustomerOrder
    write_endpoint: "POST /slot-bookings"
    occ_field: "expected_order_version"
    description: |
      Creating a SlotBooking against a CustomerOrder whose version has advanced
      since the client last observed it is rejected. Re-slotting is a legitimate
      product operation: a second booking on a different slot supersedes the
      customer's earlier reservation, so a writer holding a stale view of the
      order would otherwise silently replace a reservation it never saw. The
      check is purely a stale-version comparison against CustomerOrder.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: proposal-create-stale-order-line
    parent_entity: OrderLine
    write_endpoint: "POST /substitution-proposals"
    occ_field: "expected_order_line_version"
    description: |
      Creating a SubstitutionProposal against an OrderLine whose version has
      advanced since the client last observed it is rejected. A new proposal on a
      line legitimately supersedes the line's previously DECLINED or EXPIRED
      proposal via supersedes_proposal_id, so a writer whose view of the line
      predates the previous round would open a round chain from a stale base.
      The check compares expected_order_line_version to OrderLine.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
global_constants:
  MINIMUM_ORDER_CENTS: 1000
  FREE_DELIVERY_THRESHOLD_CENTS: 10000
  LOYALTY_TIER_THRESHOLD_CENTS: 5000
  SURGE_FLOOR: 1.00
  SURGE_CEILING: 1.80
  MAINTENANCE_BUFFER_MINUTES: 15
  PROPOSAL_TTL_MINUTES: 120
  ACCURACY_HOLD_THRESHOLD: 0.9800
  ZONE_RANK: { FROZEN: 0, CHILLED: 1, AMBIENT: 2 }
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00.000Z"

calculations:

  - name: order_line_catchweight_price
    trigger: "provisional variant on POST /customer-orders/{orderId}/lines; final variant on POST /pick-tasks/{taskId}/complete (RETRIEVING -> COMPLETED) and on POST /substitution-proposals/{proposalId}/approve"
    algorithm: threshold
    formula: |
      # ---- provisional variant (written to OrderLine.provisional_line_price_cents) ----
      if sku.is_catchweight is false:
          provisional_line_price_cents = sku.unit_price_cents * line.ordered_qty
      else:
          nominal_total_grams = sku.nominal_weight_grams * line.ordered_qty
          provisional_line_price_cents =
              round_half_up(sku.price_per_kg_cents * nominal_total_grams / 1000)

      # ---- tolerance gate, evaluated at completion BEFORE the final variant ----
      if sku.is_catchweight is true:
          nominal_total_grams = line.nominal_weight_grams * line.ordered_qty
          deviation_ratio = abs(actual_weight_grams - nominal_total_grams) / nominal_total_grams
          if deviation_ratio > sku.weight_tolerance_pct:      # STRICTLY greater rejects
              raise ERR_WEIGHT_OUT_OF_TOLERANCE               # equality is ACCEPTED
      # ---- final variant (written to OrderLine.final_line_price_cents) ----
      if sku.is_catchweight is false:
          final_line_price_cents = sku.unit_price_cents * task.picked_units
      else:
          final_line_price_cents =
              round_half_up(sku.price_per_kg_cents * actual_weight_grams / 1000)
      # on an APPROVED substitution the final variant instead reads the substitute SKU:
      #     final_line_price_cents = substitute_sku.unit_price_cents * line.ordered_qty
    input_set: "Exactly one OrderLine. The provisional variant reads only the SKU snapshot fields captured at line creation; the final variant reads the completing PickTask's picked_units / actual_weight_grams. Lines with line_status == CANCELLED are never re-priced."
    constants:
      GRAMS_PER_KG: 1000
    precision: "integer cents, round_half_up on the single division by GRAMS_PER_KG; deviation_ratio is compared as an exact rational, never as a rounded percentage"
    variants:
      - name: provisional
        when: "at line creation, before any physical pick exists"
        difference: "prices the declared nominal weight (nominal_weight_grams * ordered_qty); this is the value that enters merchandise_subtotal_cents until the pick completes"
      - name: final
        when: "at pick completion, or when a substitution is approved"
        difference: "prices the measured actual_weight_grams (or the substitute SKU's unit price), so identical order input yields a different line price and forces billing_status AUTHORIZED -> ADJUSTED"

  - name: zone_inventory_accuracy
    trigger: "POST /grid-zones/{zoneId}/audit-counts"
    algorithm: weighted_scoring
    formula: |
      # counted_set is fixed BEFORE any physical_units are rewritten
      counted_set = [ sku for sku in InventorySku
                      if sku.grid_zone_id == zone.id
                      and sku.last_count_system_units is not null   # counted at least once
                      and sku.last_count_system_units > 0 ]         # zero-system SKUs excluded
      # for every sku in the payload: last_count_system_units = sku.physical_units BEFORE update,
      #                               last_count_counted_units = payload counted_units,
      #                               last_count_variance_units = counted - system,
      #                               then sku.physical_units = counted_units.

      total_variance = SUM over counted_set of abs(sku.last_count_variance_units)
      total_system   = SUM over counted_set of sku.last_count_system_units

      accuracy_score_unit_weighted = round_half_up(1 - total_variance / total_system, 4)

      accuracy_score_sku_weighted  = round_half_up(
          ( SUM over counted_set of (1 - abs(sku.last_count_variance_units)
                                         / sku.last_count_system_units) )
          / COUNT(counted_set), 4)

      # GATE — pinned to the unit-weighted variant only:
      if accuracy_score_unit_weighted < ACCURACY_HOLD_THRESHOLD:   # STRICTLY less
          zone.status = AUDIT_HOLD
      else:
          zone.status = OPERATIONAL      # clears a prior AUDIT_HOLD
      zone.last_audited_at = clock_now
    input_set: "InventorySku rows with grid_zone_id == the audited zone AND last_count_system_units != null AND last_count_system_units > 0, evaluated after this call's counts are recorded but using the pre-update physical_units as the system figure. SKUs in the zone that have never been counted are excluded; SKUs whose pre-update physical_units was 0 are excluded."
    constants:
      ACCURACY_HOLD_THRESHOLD: 0.9800
    precision: "4 decimal places, round_half_up, applied once to each score at the end; no intermediate rounding"
    variants:
      - name: unit_weighted
        when: "always computed; the only variant that drives the AUDIT_HOLD gate"
        difference: "pools all variance and all system units before dividing, so a large accurate SKU dominates a small inaccurate one"
      - name: sku_weighted
        when: "always computed; reported for operator dashboards only"
        difference: "averages per-SKU accuracy ratios, so every SKU carries equal weight; on identical counts the two scores diverge and can disagree about whether the zone breaches ACCURACY_HOLD_THRESHOLD"

  - name: order_charge_waterfall
    trigger: "POST /customer-orders/{orderId}/lines, POST /slot-bookings, POST /slot-bookings/{bookingId}/confirm, POST /pick-tasks/{taskId}/complete, POST /substitution-proposals/{proposalId}/approve, POST /order-lines/{lineId}/accept-shortage, POST /delivery-waves/{waveId}/consolidate, POST /customer-orders/{orderId}/cancel"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 — merchandise subtotal. Per-line prices are ALREADY integer cents
      # (order_line_catchweight_price rounds once per line); the subtotal is a pure
      # integer sum. Rounding order is therefore pinned as ROUND-PER-LINE-THEN-SUM.
      included = [ l for l in OrderLine if l.order_id == order.id
                   and l.line_status IN {PENDING, PICKED} ]        # SHORT and CANCELLED excluded
      merchandise_subtotal_cents = SUM over included of
          (l.final_line_price_cents if l.final_line_price_cents is not null
           else l.provisional_line_price_cents)

      # STEP 2 — delivery fee. Depends on STEP 1's output tier.
      booking = the SlotBooking of this order with status IN {HELD, CONFIRMED}
      if booking is null:
          delivery_fee_cents = null; loyalty_discount_cents = null; order_total_cents = null
          STOP
      delivery_fee_cents = round_half_up(route.base_delivery_fee_cents
                                         * booking.surge_multiplier_at_booking)
      if merchandise_subtotal_cents >= FREE_DELIVERY_THRESHOLD_CENTS:   # >= waives
          delivery_fee_cents = 0

      # STEP 3 — loyalty discount. Its TIER is keyed on subtotal + fee, i.e. on a
      # figure that already contains STEP 2's output. This is the circular-looking
      # dependency; the evaluation order above is the pinned resolution.
      pre_discount_total_cents = merchandise_subtotal_cents + delivery_fee_cents
      if customer.loyalty_tier == BASIC:
          loyalty_discount_pct = 0.00
      elif customer.loyalty_tier == PLUS:
          loyalty_discount_pct = 0.05 if pre_discount_total_cents >= LOYALTY_TIER_THRESHOLD_CENTS else 0.00
      else:   # PREMIER
          loyalty_discount_pct = 0.10 if pre_discount_total_cents >= LOYALTY_TIER_THRESHOLD_CENTS else 0.05
      loyalty_discount_cents = round_half_up(pre_discount_total_cents * loyalty_discount_pct)

      # STEP 4
      order_total_cents = pre_discount_total_cents - loyalty_discount_cents
    input_set: "OrderLine rows of the order with line_status IN {PENDING, PICKED}; the order's single SlotBooking in status IN {HELD, CONFIRMED}; the owning CustomerAccount.loyalty_tier; the booking's DeliverySlot's DeliveryRoute.base_delivery_fee_cents."
    constants:
      FREE_DELIVERY_THRESHOLD_CENTS: 10000
      LOYALTY_TIER_THRESHOLD_CENTS: 5000
      PLUS_DISCOUNT_PCT: 0.05
      PREMIER_DISCOUNT_PCT_HIGH: 0.10
      PREMIER_DISCOUNT_PCT_LOW: 0.05
    precision: "integer cents; round_half_up applied exactly twice — once on the fee multiplication in STEP 2 and once on the discount multiplication in STEP 3. Steps are evaluated 1 -> 2 -> 3 -> 4 and never re-entered."
    variants: []

  - name: wave_transport_cost
    trigger: "POST /delivery-waves/{waveId}/loading-sequence"
    algorithm: aggregation
    formula: |
      stops = [ o for o in CustomerOrder if o.wave_id == wave.id
                and o.fulfillment_status == CONSOLIDATED ]      # CANCELLED orders excluded
      # ROUNDING ORDER IS PINNED: round the per-stop cost to whole cents FIRST,
      # then sum the rounded integers. Summing the exact kilometre products and
      # rounding once at the end is explicitly NOT the rule and yields a
      # different total whenever two or more stops land on a half cent.
      per_stop = [ round_half_up(route.per_km_cost_cents * o.stop_distance_km)
                   for o in stops ]
      transport_cost_cents = SUM(per_stop)
    input_set: "CustomerOrder rows with wave_id == this wave AND fulfillment_status == CONSOLIDATED, evaluated at the instant loading-sequence runs (i.e. after consolidate moved them to CONSOLIDATED and before loading-sequence moves them to LOADED)."
    constants: {}
    precision: "integer cents; round_half_up applied once PER STOP, then an exact integer sum. Iteration order over `stops` does not affect the total because integer addition is associative, but the per-stop rounding is mandatory."
    variants: []

  - name: slot_surge_multiplier
    trigger: "recomputed on POST /delivery-slots, POST /slot-bookings, POST /slot-bookings/{bookingId}/confirm, POST /delivery-slots/{slotId}/release-capacity, POST /delivery-slots/{slotId}/withhold-capacity, POST /customer-orders/{orderId}/cancel and POST /_clock/set_current_utc"
    algorithm: tiered_pricing
    formula: |
      effective_capacity = max(1, slot.total_capacity_units - slot.withheld_units)
      utilization = (slot.held_units + slot.confirmed_units) / effective_capacity

      if utilization >= 0.85:      util_tier_add = 0.35      # >= , not >
      elif utilization >= 0.60:    util_tier_add = 0.15
      else:                        util_tier_add = 0.00

      lead_hours = floor( (slot.window_start - clock_now) / 3600 seconds )
      if lead_hours < 12:          lead_add = 0.20
      elif lead_hours < 36:        lead_add = 0.10
      else:                        lead_add = 0.00

      route_active_wave_count = COUNT(DeliveryWave WHERE route_id == slot.route_id
                                      AND status IN {FORMING, PICKING})
      congestion_add = 0.05 * min(3, route_active_wave_count)

      raw = 1.00 + util_tier_add + lead_add + congestion_add
      surge_multiplier = min(SURGE_CEILING, max(SURGE_FLOOR, round_half_up(raw, 2)))
    input_set: "The slot's own ledger fields (held_units, confirmed_units, withheld_units, total_capacity_units), the logical clock, and DeliveryWave rows on the same route_id with status IN {FORMING, PICKING}."
    constants:
      UTIL_TIER_HIGH: 0.85
      UTIL_TIER_MID: 0.60
      UTIL_HIGH_ADD: 0.35
      UTIL_MID_ADD: 0.15
      LEAD_SHORT_HOURS: 12
      LEAD_MID_HOURS: 36
      LEAD_SHORT_ADD: 0.20
      LEAD_MID_ADD: 0.10
      CONGESTION_ADD_PER_WAVE: 0.05
      CONGESTION_WAVE_CAP: 3
      SURGE_FLOOR: 1.00
      SURGE_CEILING: 1.80
    precision: "2 decimal places, round_half_up applied once to `raw` before the min/max clamp; utilization and lead_hours are exact rationals / floored integers, never pre-rounded"
    variants: []

  - name: slot_capacity_ledger
    trigger: "recomputed on every SlotBooking status change and on POST /delivery-slots/{slotId}/release-capacity and POST /delivery-slots/{slotId}/withhold-capacity"
    algorithm: aggregation
    formula: |
      held_units      = SUM(SlotBooking.units WHERE delivery_slot_id == slot.id AND status == HELD)
      confirmed_units = SUM(SlotBooking.units WHERE delivery_slot_id == slot.id AND status == CONFIRMED)
      available_units = slot.total_capacity_units - slot.withheld_units - held_units - confirmed_units

      # CONSERVED QUANTITY — delivery capacity units. This identity MUST hold after
      # every forward action and after every compensating action:
      #   slot.total_capacity_units
      #     == slot.withheld_units + held_units + confirmed_units + available_units
      # WAITLISTED, RELEASED and BUMPED bookings contribute zero to every term.
    input_set: "SlotBooking rows with delivery_slot_id == this slot, partitioned strictly by status: HELD into held_units, CONFIRMED into confirmed_units, and {WAITLISTED, RELEASED, BUMPED} into neither."
    constants: {}
    precision: "exact integers; no rounding"
    variants: []

  - name: sku_unit_ledger
    trigger: "recomputed on POST /delivery-waves/{waveId}/start-picking, POST /pick-tasks/{taskId}/complete, POST /pick-tasks/{taskId}/cancel, POST /substitution-proposals/{proposalId}/approve, POST /customer-orders/{orderId}/cancel and POST /grid-zones/{zoneId}/audit-counts"
    algorithm: aggregation
    formula: |
      allocated_units = SUM(PickTask.allocated_units
                            WHERE PickTask.sku_id == sku.id
                            AND PickTask.status IN {QUEUED, RETRIEVING})
      on_hand_units   = sku.physical_units - allocated_units

      # CONSERVED QUANTITY — physical inventory units:
      #   sku.physical_units == sku.on_hand_units + sku.allocated_units
      # Allocation (start-picking) moves units from on_hand to allocated with
      # physical_units untouched. Cancellation is the exact compensating action:
      # it returns them, restoring on_hand_units and allocated_units to their
      # pre-allocation values with zero drift. Completion lowers physical_units
      # by picked_units while removing the same task from the allocated set, so
      # on_hand_units is unchanged across a full-quantity completion.
    input_set: "PickTask rows with sku_id == this SKU and status IN {QUEUED, RETRIEVING}. Tasks in {COMPLETED, SHORT, CANCELLED} contribute zero."
    constants: {}
    precision: "exact integers; no rounding"
    variants: []

  - name: wave_posture
    trigger: "recomputed on every mutation of a PickTask, Tote, OrderLine, SubstitutionProposal, GridZone or member CustomerOrder that belongs to the wave"
    algorithm: constraint_propagation
    formula: |
      wave_zone_ids = { t.grid_zone_id for t in PickTask
                        if t.order_line_id belongs to an order with wave_id == wave.id
                        and t.status IN {QUEUED, RETRIEVING} }
      zone_hold_count = COUNT(GridZone z WHERE z.id IN wave_zone_ids
                              AND z.status IN {MAINTENANCE, AUDIT_HOLD})
      blocked_order_count = COUNT(CustomerOrder o WHERE o.wave_id == wave.id
                                  AND o.fulfillment_status != CANCELLED
                                  AND o.dispatch_blocked == true)

      if zone_hold_count > 0:            posture = FROZEN
      elif blocked_order_count > 0:      posture = RESTRICTED
      else:                              posture = OPEN

      # where CustomerOrder.dispatch_blocked is itself derived:
      #   dispatch_blocked = EXISTS OrderLine l (l.order_id == o.id
      #                             AND l.substitution_resolution == PENDING)
    input_set: "PickTask rows of the wave with status IN {QUEUED, RETRIEVING} (their GridZones), plus CustomerOrder rows with wave_id == this wave and fulfillment_status != CANCELLED."
    constants: {}
    precision: "exact enum; no rounding"
    variants: []

  - name: retrieval_sequence
    trigger: "POST /delivery-waves/{waveId}/start-picking"
    algorithm: topological
    formula: |
      pending_lines = [ l for l in OrderLine
                        if l.order_id IN member orders of the wave with fulfillment_status == WAVED
                        and l.line_status == PENDING ]
      # deterministic total order — frozen goods first to minimise thaw exposure
      sort pending_lines by:
        1. ZONE_RANK[ InventorySku(l.sku_id).temperature_zone ]  ASC   # FROZEN 0, CHILLED 1, AMBIENT 2
        2. GridZone( sku.grid_zone_id ).zone_code                ASC   # lexicographic
        3. InventorySku(l.sku_id).sku_code                       ASC   # lexicographic
        4. l.created_at                                          ASC   # final tie-break, never l.id
      PickTask.sequence_index = 1-based position in this order
    input_set: "OrderLine rows with line_status == PENDING belonging to member orders of the wave whose fulfillment_status == WAVED."
    constants:
      ZONE_RANK: { FROZEN: 0, CHILLED: 1, AMBIENT: 2 }
    precision: "exact integer index starting at 1"
    variants: []

  - name: pick_station_assignment
    trigger: "POST /delivery-waves/{waveId}/start-picking, and again when POST /substitution-proposals/{proposalId}/approve creates a substitute PickTask"
    algorithm: weighted_scoring
    formula: |
      # (a) ELIGIBILITY FILTER — explicit predicates only
      candidates = [ s for s in PickStation
                     if s.status IN {IDLE, ACTIVE}
                     and InventorySku(task.sku_id).temperature_zone IN s.temperature_zone_capability
                     and s.current_tote_count < s.max_concurrent_totes ]
      # (b) RANKING EXPRESSION
      sort candidates by: s.current_tote_count ASC, s.max_concurrent_totes DESC, s.station_code ASC
      # (c) TIE-BREAK when all three rank keys tie
      then by: s.created_at ASC          # never s.id
      # (d) EMPTY-POOL FALLBACK
      if candidates is empty: raise ERR_NO_ELIGIBLE_PICK_STATION (409)
      task.pick_station_id = candidates[0].id
    input_set: "All PickStation rows; the filter is evaluated against the station's live current_tote_count at the moment each task in the retrieval_sequence order is assigned, so earlier assignments in the same request are visible to later ones."
    constants: {}
    precision: "exact selection"
    variants: []

  - name: substitute_sku_selector
    trigger: "automatically inside POST /pick-tasks/{taskId}/complete when the task ends SHORT"
    algorithm: weighted_scoring
    formula: |
      original = InventorySku(line.sku_id)
      # (a) ELIGIBILITY FILTER
      candidates = [ c for c in InventorySku
                     if c.id != original.id
                     and c.temperature_zone == original.temperature_zone
                     and c.substitution_group_code == original.substitution_group_code
                     and GridZone(c.grid_zone_id).status == OPERATIONAL
                     and c.on_hand_units >= line.ordered_qty ]
      # (b) RANKING EXPRESSION — closest unit price to the ordered item
      sort candidates by: abs(c.unit_price_cents - original.unit_price_cents) ASC,
                          c.unit_price_cents ASC,
                          c.sku_code ASC
      # (c) TIE-BREAK when all three rank keys tie
      then by: c.created_at ASC          # never c.id
      # (d) EMPTY-POOL FALLBACK
      if candidates is empty:
          no SubstitutionProposal is created; the line keeps
          substitution_resolution == PENDING so the order stays dispatch_blocked
          and the customer must call POST /order-lines/{lineId}/accept-shortage.
      else:
          create SubstitutionProposal(status=DRAFT, substitute_sku_id=candidates[0].id,
              round_no = 1 + MAX(round_no over existing proposals on this line, default 0),
              proposed_price_delta_cents = candidates[0].unit_price_cents * line.ordered_qty
                                           - line.provisional_line_price_cents)
    input_set: "All InventorySku rows other than the ordered SKU, filtered on temperature_zone, substitution_group_code, owning zone status OPERATIONAL and on_hand_units >= line.ordered_qty."
    constants: {}
    precision: "exact selection; proposed_price_delta_cents is an exact integer difference and may be negative"
    variants: []

  - name: slot_waitlist_promotion
    trigger: "inside POST /customer-orders/{orderId}/cancel and POST /delivery-slots/{slotId}/release-capacity, after slot_capacity_ledger has been recomputed"
    algorithm: chronological
    formula: |
      # (a) ELIGIBILITY FILTER
      candidates = [ b for b in SlotBooking
                     if b.delivery_slot_id == slot.id
                     and b.status == WAITLISTED
                     and b.units <= slot.available_units ]
      # (b) RANKING EXPRESSION — strict first-come order
      sort candidates by: b.created_at ASC
      # (c) TIE-BREAK
      then by: b.units DESC, b.quoted_fee_cents DESC     # never b.id
      # (d) EMPTY-POOL FALLBACK
      if candidates is empty: no promotion occurs and available_units simply stays raised
      else: promote candidates[0] to CONFIRMED (exactly one per request), then STOP —
            the ledger is recomputed once more and no second promotion is attempted.
    input_set: "SlotBooking rows with delivery_slot_id == this slot AND status == WAITLISTED AND units <= the post-recompute available_units."
    constants:
      MAX_PROMOTIONS_PER_REQUEST: 1
    precision: "exact selection"
    variants: []

  - name: wave_loading_sequence
    trigger: "POST /delivery-waves/{waveId}/loading-sequence"
    algorithm: interval_merge
    formula: |
      # STOP ORDER — nearest stop served first
      stops = [ o for o in CustomerOrder if o.wave_id == wave.id
                and o.fulfillment_status == CONSOLIDATED ]
      sort stops by: o.stop_distance_km ASC, o.created_at ASC        # never o.id
      stop_sequence[o] = 1-based position in that order

      # LOADING ORDER — last-in-first-out against the stop order, cold chain first
      # within each stop so frozen totes sit in the freezer compartment.
      loadable = [ t for t in Tote if t.wave_id == wave.id and t.status == CONSOLIDATED ]
      stop_of(t) = the stop_sequence of the CustomerOrder that owns any PickTask
                   with tote_id == t.id; a tote holding tasks from several orders
                   takes the MAX stop_sequence among them; a tote holding no task
                   takes stop_sequence 0.
      sort loadable by: stop_of(t) DESC,
                        ZONE_RANK[t.temperature_zone] ASC,
                        t.tote_code ASC,
                        t.created_at ASC                            # never t.id
      wave.load_sequence = [ t.id for t in loadable ]   # ids are the PAYLOAD, not a sort key
    input_set: "CustomerOrder rows with wave_id == this wave AND fulfillment_status == CONSOLIDATED; Tote rows with wave_id == this wave AND status == CONSOLIDATED."
    constants:
      ZONE_RANK: { FROZEN: 0, CHILLED: 1, AMBIENT: 2 }
    precision: "exact ordering"
    variants: []

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
#
# Every request is validated top-to-bottom in this exact order. The FIRST rule
# whose condition is violated determines the response; no later rule is
# evaluated. Two deliberate priority collisions are designed in:
#   * priority 11 (ERR_INVALID_STATE) beats priority 14 (ERR_TEMPERATURE_ZONE_MISMATCH)
#   * priority 18 (ERR_ROUTE_MISMATCH) beats priority 33 (ERR_MINIMUM_ORDER_NOT_MET)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in §1.7 (FulfillmentAdmin, Customer, WavePlanner, PickOperator, GridEngineer)"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the role in X-User-Role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "when X-User-Role == Customer, X-User-ID resolves to an existing CustomerAccount.id (the role is entity_backed:CustomerAccount)"
    error_id: ERR_CUSTOMER_IDENTITY_UNKNOWN
    http_status: 403
    applies_to: "all endpoints whose roles include Customer"

  - priority: 5
    category: existence
    check: "every id embedded in the URL path exists, validated left-to-right; yields the resource-specific not-found code (ERR_ORDER_NOT_FOUND, ERR_ORDER_LINE_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_WAVE_NOT_FOUND, ERR_TOTE_NOT_FOUND, ERR_PICK_TASK_NOT_FOUND, ERR_PROPOSAL_NOT_FOUND, ERR_ZONE_NOT_FOUND, ERR_PICK_STATION_NOT_FOUND, ERR_DOCK_BAY_NOT_FOUND, ERR_SKU_NOT_FOUND, ERR_ROUTE_NOT_FOUND, ERR_CUSTOMER_ACCOUNT_NOT_FOUND, ERR_MAINTENANCE_WINDOW_NOT_FOUND)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"   # the concrete code enumerated in `check:` for the resource that failed to resolve
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 6
    category: existence
    check: "every foreign-key id supplied in the request body exists, validated in the order the fields are listed in the endpoint's input; yields the same resource-specific not-found code as priority 5"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"   # the concrete code enumerated in `check:` for the resource that failed to resolve
    http_status: 404
    applies_to: "all POST endpoints whose input contains an *_id field"

  - priority: 7
    category: auth
    check: "when X-User-Role == Customer, the CustomerOrder (or the OrderLine's / SlotBooking's owning CustomerOrder) referenced by path or body has customer_id == X-User-ID"
    error_id: ERR_ORDER_NOT_OWNED
    http_status: 403
    applies_to: "POST /customer-orders/{orderId}/lines, POST /customer-orders/{orderId}/cancel, POST /order-lines/{lineId}/accept-shortage, POST /slot-bookings, POST /slot-bookings/{bookingId}/confirm, POST /substitution-proposals/{proposalId}/approve, POST /substitution-proposals/{proposalId}/decline"

  - priority: 8
    category: existence
    check: "request body contains every required field, no unknown fields, correct JSON types, enum values drawn from the declared enum, integers non-negative where the field is a quantity or a money amount, decimals within their declared scale, ISO-8601 instants parseable and UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST endpoints"

  - priority: 9
    category: existence
    check: "limit is an integer in [1, 100] and offset is an integer >= 0 when supplied on a list endpoint"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all GET list endpoints"

  - priority: 10
    category: state
    check: "the OCC guard declared in §1.2.1: expected_order_version equals CustomerOrder.version on POST /slot-bookings, and expected_order_line_version equals OrderLine.version on POST /substitution-proposals"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /slot-bookings, POST /substitution-proposals"

  - priority: 11
    category: state
    check: "the target entity is in a state from which the requested §1.2 transition exists, and every same-entity precondition of that transition holds (e.g. tote.status == OPEN for seal, task.status == RETRIEVING for complete, wave.status == CONSOLIDATED for loading-sequence, booking.status == HELD for confirm)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all POST action endpoints"

  - priority: 12
    category: state
    check: "the DeliveryWave's computed posture is not FROZEN; a FROZEN posture (some GridZone serving an active PickTask of this wave is in MAINTENANCE or AUDIT_HOLD) blocks all wave-level and tote-level progression"
    error_id: ERR_WAVE_FROZEN
    http_status: 409
    applies_to: "POST /delivery-waves/{waveId}/consolidate, POST /delivery-waves/{waveId}/assign-dock, POST /delivery-waves/{waveId}/loading-sequence, POST /delivery-waves/{waveId}/dispatch, POST /totes, POST /totes/{toteId}/seal, POST /totes/{toteId}/unseal"

  - priority: 13
    category: business_safety
    check: "the GridZone that holds the SKU being retrieved has status == OPERATIONAL; a zone in MAINTENANCE or AUDIT_HOLD may not be entered by the robotic grid"
    error_id: ERR_ZONE_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /pick-tasks/{taskId}/start-retrieval, POST /delivery-waves/{waveId}/start-picking, POST /substitution-proposals/{proposalId}/approve"

  - priority: 14
    category: business_safety
    check: "cold-chain segregation: the tote's temperature_zone equals the SKU's temperature_zone; a CHILLED or FROZEN item may never be placed in a tote of a different zone"
    error_id: ERR_TEMPERATURE_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /pick-tasks/{taskId}/assign-tote"

  - priority: 15
    category: business_safety
    check: "the PickStation named in the request lists the new tote's temperature_zone in its temperature_zone_capability array"
    error_id: ERR_STATION_ZONE_UNSUPPORTED
    http_status: 409
    applies_to: "POST /totes"

  - priority: 16
    category: business_safety
    check: "for a catchweight SKU, abs(actual_weight_grams - nominal_weight_grams * ordered_qty) / (nominal_weight_grams * ordered_qty) <= sku.weight_tolerance_pct; equality at the bound is ACCEPTED, strictly greater is rejected"
    error_id: ERR_WEIGHT_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /pick-tasks/{taskId}/complete"

  - priority: 17
    category: business_safety
    check: "segregation of duties: the X-User-ID dispatching a wave differs from the DeliveryWave.consolidated_by_user_id recorded when the wave was consolidated"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /delivery-waves/{waveId}/dispatch"

  - priority: 18
    category: business_referential
    check: "the DeliverySlot's route_id equals the booked CustomerOrder's owning CustomerAccount.home_route_id"
    error_id: ERR_ROUTE_MISMATCH
    http_status: 409
    applies_to: "POST /slot-bookings"

  - priority: 19
    category: business_referential
    check: "an order being slotted into a wave has a SlotBooking in status CONFIRMED whose delivery_slot_id equals the wave's delivery_slot_id, and the wave's route_id equals that slot's route_id"
    error_id: ERR_WAVE_SLOT_MISMATCH
    http_status: 409
    applies_to: "POST /delivery-waves/{waveId}/slot-orders"

  - priority: 20
    category: business_referential
    check: "the substitute SKU is a different SKU in the same temperature_zone and the same substitution_group_code as the ordered SKU"
    error_id: ERR_SUBSTITUTE_NOT_COMPARABLE
    http_status: 422
    applies_to: "POST /substitution-proposals"

  - priority: 21
    category: business_referential
    check: "when supersedes_proposal_id is supplied it names a proposal on the SAME order_line_id whose status is DECLINED or EXPIRED"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /substitution-proposals"

  - priority: 22
    category: business_temporal
    check: "the proposed maintenance window does not overlap any existing window on the same GridZone in status SCHEDULED or ACTIVE once each interval is widened by MAINTENANCE_BUFFER_MINUTES on both sides: reject iff new.start < existing.end + 15min AND existing.start < new.end + 15min"
    error_id: ERR_MAINTENANCE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /maintenance-windows"

  - priority: 23
    category: business_temporal
    check: "aggregate dock concurrency: at every instant in the requested [load_start, load_end) half-open interval the number of OTHER DeliveryWave rows with dock_bay_id == this bay (any status; waves are never cancelled, so every assigned wave still occupies the bay) whose [load_start, load_end) interval overlaps is strictly less than dock_bay.parallel_van_capacity; touching intervals (existing.load_end == new.load_start) do NOT overlap"
    error_id: ERR_DOCK_BAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /delivery-waves/{waveId}/assign-dock"

  - priority: 24
    category: business_temporal
    check: "the DeliverySlot's booking window is still open: clock_now < slot.window_start"
    error_id: ERR_SLOT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /slot-bookings, POST /slot-bookings/{bookingId}/confirm"

  - priority: 25
    category: business_temporal
    check: "a proposal in PROPOSED status may be approved or declined only while clock_now < proposal.expires_at (ERR_PROPOSAL_EXPIRED); conversely POST /substitution-proposals/{proposalId}/expire requires clock_now >= proposal.expires_at (ERR_PROPOSAL_NOT_EXPIRED)"
    error_id: ERR_PROPOSAL_EXPIRED
    http_status: 409
    applies_to: "POST /substitution-proposals/{proposalId}/approve, POST /substitution-proposals/{proposalId}/decline, POST /substitution-proposals/{proposalId}/expire"

  - priority: 26
    category: business_constraint
    check: "a wave being consolidated has at least one Tote in status SEALED (ERR_NO_TOTES_TO_CONSOLIDATE); a wave being sequenced for loading has dock_bay_id != null (ERR_DOCK_NOT_ASSIGNED); a wave being slotted or started has at least one member order (ERR_WAVE_HAS_NO_ORDERS)"
    error_id: ERR_NO_TOTES_TO_CONSOLIDATE
    http_status: 409
    applies_to: "POST /delivery-waves/{waveId}/consolidate, POST /delivery-waves/{waveId}/loading-sequence, POST /delivery-waves/{waveId}/start-picking"

  - priority: 27
    category: business_constraint
    check: "the pick_station_assignment selector's candidate pool is non-empty (some station in IDLE or ACTIVE supports the SKU's temperature zone and has current_tote_count < max_concurrent_totes)"
    error_id: ERR_NO_ELIGIBLE_PICK_STATION
    http_status: 409
    applies_to: "POST /delivery-waves/{waveId}/start-picking, POST /substitution-proposals/{proposalId}/approve"

  - priority: 28
    category: business_constraint
    check: "creating a tote at a station would not push station.current_tote_count above station.max_concurrent_totes"
    error_id: ERR_STATION_TOTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /totes"

  - priority: 29
    category: business_constraint
    check: "no member CustomerOrder of the wave has dispatch_blocked == true (i.e. no OrderLine is left with substitution_resolution == PENDING)"
    error_id: ERR_ORDER_DISPATCH_BLOCKED
    http_status: 409
    applies_to: "POST /delivery-waves/{waveId}/loading-sequence, POST /delivery-waves/{waveId}/dispatch"

  - priority: 30
    category: business_constraint
    check: "the CustomerOrder has no existing SlotBooking in status HELD, CONFIRMED or WAITLISTED (ERR_DUPLICATE_SLOT_BOOKING); the PickTask being assigned a tote has tote_id == null and the tote being sealed has at least one PickTask (ERR_TOTE_NOT_ASSIGNED); the line accepting a shortage has substitution_resolution == PENDING (ERR_LINE_NOT_SHORT); the line has no proposal already in DRAFT or PROPOSED (ERR_PROPOSAL_ALREADY_OPEN)"
    error_id: ERR_DUPLICATE_SLOT_BOOKING
    http_status: 409
    applies_to: "POST /slot-bookings, POST /pick-tasks/{taskId}/assign-tote, POST /totes/{toteId}/seal, POST /order-lines/{lineId}/accept-shortage, POST /substitution-proposals"

  - priority: 31
    category: business_fiscal
    check: "the SKU has enough uncommitted stock: sku.on_hand_units >= the units the request would allocate (summed across all lines of the wave for start-picking)"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /delivery-waves/{waveId}/start-picking, POST /substitution-proposals/{proposalId}/approve"

  - priority: 32
    category: business_fiscal
    check: "delivery-slot capacity arithmetic stays inside the ledger: on POST /delivery-slots/{slotId}/withhold-capacity the requested delta units <= slot.total_capacity_units - slot.withheld_units, i.e. withholding may never push total withheld above the slot's physical capacity (ERR_WITHHELD_UNITS_EXCEEDED) — withholding MORE than the currently available_units is legal and deliberately drives available_units negative, which bumps CONFIRMED bookings; a booking's units <= slot.total_capacity_units - slot.withheld_units, otherwise it can never be satisfiable even from an empty slot (ERR_SLOT_UNITS_EXCEED_CAPACITY). A booking whose units merely exceed the CURRENT available_units is not an error — it is admitted as WAITLISTED."
    error_id: ERR_WITHHELD_UNITS_EXCEEDED
    http_status: 422
    applies_to: "POST /delivery-slots/{slotId}/withhold-capacity, POST /slot-bookings"

  - priority: 33
    category: business_fiscal
    check: "merchandise_subtotal_cents >= MINIMUM_ORDER_CENTS (1000) at the moment a slot booking is created"
    error_id: ERR_MINIMUM_ORDER_NOT_MET
    http_status: 422
    applies_to: "POST /slot-bookings"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
#
# api_prefix is "/", so every path below is also the full URL path.
# Every GET list endpoint accepts `limit?` (1..100, default 10) and `offset?`
# (>= 0, default 0) and returns the paginated envelope declared in §1.0.
# Filtered-list GETs double as the FK reverse-reachability channel for every
# FK declared in §1.1.
# -----------------------------------------------------------------------------
endpoints:

  # ---- test-driving: logical clock ----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary UTC instant so that lead-time, cutoff, maintenance-window and proposal-expiry rules are deterministic. The server's logical clock starts at exactly 2026-08-01T00:00:00.000Z on boot and MUST NOT fall back to real wall-clock time before the first call to this endpoint. Every `clock_now` reference in §1.3 and §1.4 reads this clock."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, GridEngineer, Customer]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "DeliverySlot.surge_multiplier recomputed for every slot by slot_surge_multiplier (lead_hours moves)"

  # ---- DeliveryRoute -------------------------------------------------------
  - method: POST
    path: "/delivery-routes"
    description: "Registers a delivery route with its van tote capacity and its pre-surge fee and per-kilometre transport cost."
    roles: [FulfillmentAdmin]
    code: 201
    input: [route_code, service_area_name, van_capacity_totes, base_delivery_fee_cents, per_km_cost_cents]
    output: DeliveryRoute
    side_effects: []

  - method: GET
    path: "/delivery-routes/{routeId}"
    description: "Reads one delivery route."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, GridEngineer, Customer]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []

  # ---- DockBay -------------------------------------------------------------
  - method: POST
    path: "/dock-bays"
    description: "Registers a loading dock bay and how many vans may occupy it at one instant."
    roles: [FulfillmentAdmin]
    code: 201
    input: [bay_code, parallel_van_capacity]
    output: DockBay
    side_effects: []

  - method: GET
    path: "/dock-bays/{bayId}"
    description: "Reads one dock bay."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, GridEngineer]
    code: 200
    input: []
    output: DockBay
    side_effects: []

  # ---- GridZone ------------------------------------------------------------
  - method: POST
    path: "/grid-zones"
    description: "Registers a robotic grid zone with its temperature class and bot count. The zone starts OPERATIONAL with both accuracy scores and last_audited_at null."
    roles: [FulfillmentAdmin]
    code: 201
    input: [zone_code, temperature_zone, bot_count]
    output: GridZone
    side_effects: []

  - method: GET
    path: "/grid-zones/{zoneId}"
    description: "Reads one grid zone including its computed status and both inventory-accuracy scores."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, GridEngineer]
    code: 200
    input: []
    output: GridZone
    side_effects: []

  - method: POST
    path: "/grid-zones/{zoneId}/audit-counts"
    description: "Records an inventory accuracy audit. `counts` is an array of objects `{ sku_id, counted_units }`; each named SKU must belong to this zone. Runs zone_inventory_accuracy, rewrites each SKU's physical_units to the counted figure, and drives the zone's status through the AUDIT_HOLD gate."
    roles: [GridEngineer]
    code: 200
    input: [counts]
    output: GridZone
    side_effects:
      - "for each counted SKU: last_count_system_units = pre-call physical_units, last_count_counted_units, last_count_variance_units set; physical_units = counted_units; on_hand_units recomputed by sku_unit_ledger"
      - "zone.accuracy_score_unit_weighted and accuracy_score_sku_weighted recomputed by zone_inventory_accuracy"
      - "zone.last_audited_at = clock_now"
      - "zone.status -> AUDIT_HOLD when accuracy_score_unit_weighted < 0.9800, else -> OPERATIONAL"
      - "wave_posture recomputed for every DeliveryWave with an active PickTask in this zone"

  # ---- PickStation ---------------------------------------------------------
  - method: POST
    path: "/pick-stations"
    description: "Registers a pick station, the temperature classes it may handle and how many open totes may sit at it. Starts IDLE with current_tote_count 0."
    roles: [FulfillmentAdmin]
    code: 201
    input: [station_code, temperature_zone_capability, max_concurrent_totes]
    output: PickStation
    side_effects: []

  - method: GET
    path: "/pick-stations/{stationId}"
    description: "Reads one pick station including its computed current_tote_count and status."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, GridEngineer]
    code: 200
    input: []
    output: PickStation
    side_effects: []

  # ---- InventorySku --------------------------------------------------------
  - method: POST
    path: "/inventory-skus"
    description: "Registers a SKU in a grid zone. price_per_kg_cents, nominal_weight_grams and weight_tolerance_pct are required when is_catchweight is true and MUST be omitted otherwise. The SKU's temperature_zone must equal its grid zone's temperature_zone."
    roles: [FulfillmentAdmin]
    code: 201
    input: [sku_code, name, grid_zone_id, temperature_zone, substitution_group_code, is_catchweight, unit_price_cents, "price_per_kg_cents?", "nominal_weight_grams?", "weight_tolerance_pct?", physical_units]
    output: InventorySku
    side_effects:
      - "allocated_units initialised to 0 and on_hand_units to physical_units by sku_unit_ledger"

  - method: GET
    path: "/inventory-skus/{skuId}"
    description: "Reads one SKU including its computed allocated_units, on_hand_units and last-count fields."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, GridEngineer, Customer]
    code: 200
    input: []
    output: InventorySku
    side_effects: []

  - method: GET
    path: "/inventory-skus"
    description: "Lists SKUs, optionally filtered by grid zone, temperature class or substitution group. Reverse-reachability channel for InventorySku.grid_zone_id."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, GridEngineer, Customer]
    code: 200
    input: ["grid_zone_id?", "temperature_zone?", "substitution_group_code?", "limit?", "offset?"]
    output: InventorySku[]
    side_effects: []

  # ---- MaintenanceWindow ---------------------------------------------------
  - method: POST
    path: "/maintenance-windows"
    description: "Schedules a grid maintenance window on one zone. Rejected when it overlaps an existing SCHEDULED or ACTIVE window on the same zone after both intervals are widened by MAINTENANCE_BUFFER_MINUTES (15) on each side. Starts SCHEDULED; the zone stays OPERATIONAL until the window is activated."
    roles: [GridEngineer]
    code: 201
    input: [grid_zone_id, window_start, window_end]
    output: MaintenanceWindow
    side_effects: []

  - method: GET
    path: "/maintenance-windows/{windowId}"
    description: "Reads one maintenance window."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, GridEngineer]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []

  - method: GET
    path: "/maintenance-windows"
    description: "Lists maintenance windows, optionally filtered by grid zone or status. Reverse-reachability channel for MaintenanceWindow.grid_zone_id."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, GridEngineer]
    code: 200
    input: ["grid_zone_id?", "status?", "limit?", "offset?"]
    output: MaintenanceWindow[]
    side_effects: []

  - method: POST
    path: "/maintenance-windows/{windowId}/activate"
    description: "Takes the zone out of service. SCHEDULED -> ACTIVE, and the GridZone goes OPERATIONAL -> MAINTENANCE."
    roles: [GridEngineer]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects:
      - "GridZone.status OPERATIONAL -> MAINTENANCE"
      - "wave_posture recomputed for every DeliveryWave with an active PickTask in this zone (may become FROZEN)"

  - method: POST
    path: "/maintenance-windows/{windowId}/complete"
    description: "Returns the zone to service. ACTIVE -> COMPLETED, and the GridZone goes MAINTENANCE -> OPERATIONAL."
    roles: [GridEngineer]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects:
      - "GridZone.status MAINTENANCE -> OPERATIONAL"
      - "wave_posture recomputed for every affected DeliveryWave (FROZEN may clear to RESTRICTED or OPEN)"

  # ---- DeliverySlot --------------------------------------------------------
  - method: POST
    path: "/delivery-slots"
    description: "Opens a delivery slot on a route with a customer-facing window and a capacity in delivery units. withheld_units may start above zero to hold capacity back from sale. surge_multiplier is computed immediately by slot_surge_multiplier."
    roles: [FulfillmentAdmin]
    code: 201
    input: [route_id, window_start, window_end, total_capacity_units, withheld_units]
    output: DeliverySlot
    side_effects:
      - "held_units and confirmed_units initialised to 0 and available_units computed by slot_capacity_ledger"
      - "surge_multiplier computed by slot_surge_multiplier"

  - method: GET
    path: "/delivery-slots/{slotId}"
    description: "Reads one delivery slot including its full capacity ledger and current surge multiplier."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, Customer]
    code: 200
    input: []
    output: DeliverySlot
    side_effects: []

  - method: GET
    path: "/delivery-slots"
    description: "Lists delivery slots, optionally filtered by route. Reverse-reachability channel for DeliverySlot.route_id."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, Customer]
    code: 200
    input: ["route_id?", "limit?", "offset?"]
    output: DeliverySlot[]
    side_effects: []

  - method: POST
    path: "/delivery-slots/{slotId}/release-capacity"
    description: "Capacity release management: lowers withheld_units by `units`, putting held-back capacity back on sale. Rejected when units > slot.withheld_units. After the ledger is recomputed, slot_waitlist_promotion promotes at most one WAITLISTED booking."
    roles: [FulfillmentAdmin]
    code: 200
    input: [units]
    output: DeliverySlot
    side_effects:
      - "withheld_units decreased by units, available_units recomputed by slot_capacity_ledger"
      - "at most one WAITLISTED SlotBooking promoted to CONFIRMED by slot_waitlist_promotion, cascading its CustomerOrder to SLOTTED / AUTHORIZED"
      - "surge_multiplier recomputed by slot_surge_multiplier"

  - method: POST
    path: "/delivery-slots/{slotId}/withhold-capacity"
    description: "Capacity release management in reverse: raises withheld_units by `units`. When the raise would drive available_units below zero, CONFIRMED bookings are BUMPED one at a time by the bump selector (created_at DESC, then units ASC) until available_units >= 0; each bumped booking's order falls back to DRAFT / PENDING_AUTH. Rejected with ERR_WITHHELD_UNITS_EXCEEDED when `units` exceeds total_capacity_units - withheld_units."
    roles: [FulfillmentAdmin]
    code: 200
    input: [units]
    output: DeliverySlot
    side_effects:
      - "withheld_units increased by units"
      - "zero or more CONFIRMED SlotBookings -> BUMPED by the bump selector"
      - "each bumped booking's CustomerOrder: fulfillment_status SLOTTED -> DRAFT, billing_status AUTHORIZED -> PENDING_AUTH, authorized_amount_cents / delivery_fee_cents / loyalty_discount_cents / order_total_cents back to null, version incremented"
      - "ledger recomputed by slot_capacity_ledger, then surge_multiplier by slot_surge_multiplier"

  # ---- CustomerAccount -----------------------------------------------------
  - method: POST
    path: "/customer-accounts"
    description: "Registers a customer account bound to exactly one home route; that route is the only one the customer may book delivery slots on."
    roles: [FulfillmentAdmin]
    code: 201
    input: [email, full_name, loyalty_tier, home_route_id]
    output: CustomerAccount
    side_effects: []

  - method: GET
    path: "/customer-accounts/{accountId}"
    description: "Reads one customer account."
    roles: [FulfillmentAdmin, WavePlanner, Customer]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []

  - method: GET
    path: "/customer-accounts"
    description: "Lists customer accounts, optionally filtered by home route or loyalty tier. Reverse-reachability channel for CustomerAccount.home_route_id."
    roles: [FulfillmentAdmin, WavePlanner]
    code: 200
    input: ["home_route_id?", "loyalty_tier?", "limit?", "offset?"]
    output: CustomerAccount[]
    side_effects: []

  # ---- CustomerOrder -------------------------------------------------------
  - method: POST
    path: "/customer-orders"
    description: "Opens a basket. customer_id is taken from the X-User-ID header, never from the body. Starts fulfillment_status DRAFT and billing_status PENDING_AUTH with a zero subtotal and null fee, discount and total."
    roles: [Customer]
    code: 201
    input: [stop_distance_km]
    output: CustomerOrder
    side_effects:
      - "customer_id = X-User-ID; merchandise_subtotal_cents = 0; delivery_fee_cents, loyalty_discount_cents and order_total_cents null; dispatch_blocked false; open_substitution_count 0"

  - method: GET
    path: "/customer-orders/{orderId}"
    description: "Reads one order including both status dimensions, the full charge waterfall and the dispatch_blocked flag."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, Customer]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: []

  - method: GET
    path: "/customer-orders"
    description: "Lists orders, optionally filtered by customer, wave or fulfillment status. Reverse-reachability channel for CustomerOrder.customer_id and CustomerOrder.wave_id."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, Customer]
    code: 200
    input: ["customer_id?", "wave_id?", "fulfillment_status?", "limit?", "offset?"]
    output: CustomerOrder[]
    side_effects: []

  - method: POST
    path: "/customer-orders/{orderId}/lines"
    description: "Adds a line to a DRAFT order. Snapshots the SKU's nominal_weight_grams onto the line for catchweight items, prices the line with the provisional variant of order_line_catchweight_price, and re-runs order_charge_waterfall on the order."
    roles: [Customer]
    code: 201
    input: [sku_id, ordered_qty]
    output: OrderLine
    side_effects:
      - "line_status PENDING, substitution_resolution NOT_REQUIRED, provisional_line_price_cents written, final_line_price_cents null"
      - "nominal_weight_grams snapshotted from the SKU when is_catchweight is true, else null"
      - "order.merchandise_subtotal_cents recomputed by order_charge_waterfall step 1 (fee / discount / total stay null while no booking exists)"
      - "increments CustomerOrder.version by 1"

  - method: POST
    path: "/customer-orders/{orderId}/cancel"
    description: "Cancels an order from DRAFT, SLOTTED or WAVED. Releases its SlotBooking, cancels every non-terminal PickTask (returning allocated units), cancels every PENDING line, reverses the authorization, and then promotes at most one WAITLISTED booking on the freed slot."
    roles: [Customer]
    code: 200
    input: []
    output: CustomerOrder
    side_effects:
      - "fulfillment_status -> CANCELLED; billing_status AUTHORIZED or ADJUSTED -> REVERSED (PENDING_AUTH stays PENDING_AUTH)"
      - "every OrderLine with line_status == PENDING -> CANCELLED"
      - "every PickTask of the order in {QUEUED, RETRIEVING} -> CANCELLED, its allocated_units returned via sku_unit_ledger"
      - "every SubstitutionProposal on the order's lines in {DRAFT, PROPOSED} -> EXPIRED"
      - "the order's SlotBooking in {HELD, CONFIRMED, WAITLISTED} -> RELEASED, slot ledger recomputed by slot_capacity_ledger"
      - "at most one WAITLISTED SlotBooking on that slot promoted to CONFIRMED by slot_waitlist_promotion, cascading its own order to SLOTTED / AUTHORIZED"
      - "slot.surge_multiplier recomputed; wave.order_count and wave_posture recomputed when the order was waved"
      - "increments CustomerOrder.version by 1"

  # ---- OrderLine -----------------------------------------------------------
  - method: GET
    path: "/order-lines/{lineId}"
    description: "Reads one order line including both price variants, its pick outcome and its substitution_resolution."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/order-lines"
    description: "Lists order lines, optionally filtered by order, SKU or line status. Reverse-reachability channel for OrderLine.order_id and OrderLine.sku_id."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, Customer]
    code: 200
    input: ["order_id?", "sku_id?", "line_status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/order-lines/{lineId}/accept-shortage"
    description: "The customer accepts the shortage instead of a substitute. Requires substitution_resolution == PENDING. The line goes SHORT -> CANCELLED with substitution_resolution SHORTAGE_ACCEPTED, every open proposal on the line EXPIRES, the line leaves the subtotal, and the order's dispatch_blocked clears once no PENDING resolution remains."
    roles: [Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects:
      - "line_status SHORT -> CANCELLED, substitution_resolution PENDING -> SHORTAGE_ACCEPTED"
      - "every SubstitutionProposal on this line in {DRAFT, PROPOSED} -> EXPIRED; order.open_substitution_count recomputed"
      - "order_charge_waterfall re-run (the cancelled line drops out of merchandise_subtotal_cents); billing_status AUTHORIZED -> ADJUSTED when order_total_cents changed"
      - "order.dispatch_blocked recomputed; wave_posture recomputed for the order's wave"
      - "increments CustomerOrder.version by 1"

  # ---- SlotBooking ---------------------------------------------------------
  - method: POST
    path: "/slot-bookings"
    description: "Books capacity on a delivery slot for an order. Admitted as HELD when slot.available_units >= units, otherwise as WAITLISTED (which occupies no capacity). Freezes the slot's current surge_multiplier onto the booking and quotes the fee from it. expected_order_version is the OCC guard on the parent CustomerOrder declared in §1.2.1."
    roles: [Customer]
    code: 201
    input: [delivery_slot_id, customer_order_id, units, expected_order_version]
    output: SlotBooking
    side_effects:
      - "status HELD when slot.available_units >= units, else WAITLISTED"
      - "surge_multiplier_at_booking = slot.surge_multiplier at this instant; quoted_fee_cents = round_half_up(route.base_delivery_fee_cents * surge_multiplier_at_booking)"
      - "slot ledger recomputed by slot_capacity_ledger, then surge_multiplier by slot_surge_multiplier"
      - "order_charge_waterfall re-run on the order, filling delivery_fee_cents, loyalty_discount_cents and order_total_cents once the booking is HELD"
      - "increments CustomerOrder.version by 1"

  - method: GET
    path: "/slot-bookings/{bookingId}"
    description: "Reads one slot booking including its frozen surge multiplier and quoted fee."
    roles: [FulfillmentAdmin, WavePlanner, Customer]
    code: 200
    input: []
    output: SlotBooking
    side_effects: []

  - method: GET
    path: "/slot-bookings"
    description: "Lists slot bookings, optionally filtered by slot, order or status. Reverse-reachability channel for SlotBooking.delivery_slot_id and SlotBooking.customer_order_id."
    roles: [FulfillmentAdmin, WavePlanner, Customer]
    code: 200
    input: ["delivery_slot_id?", "customer_order_id?", "status?", "limit?", "offset?"]
    output: SlotBooking[]
    side_effects: []

  - method: POST
    path: "/slot-bookings/{bookingId}/confirm"
    description: "Confirms a HELD booking, which slots the order: fulfillment_status DRAFT -> SLOTTED and billing_status PENDING_AUTH -> AUTHORIZED with authorized_amount_cents snapshotted from order_total_cents. Requires merchandise_subtotal_cents >= MINIMUM_ORDER_CENTS and clock_now < slot.window_start."
    roles: [Customer]
    code: 200
    input: []
    output: SlotBooking
    side_effects:
      - "status HELD -> CONFIRMED; slot ledger moves the units from held_units to confirmed_units"
      - "order.fulfillment_status DRAFT -> SLOTTED; order.billing_status PENDING_AUTH -> AUTHORIZED; authorized_amount_cents = order_total_cents"
      - "slot.surge_multiplier recomputed by slot_surge_multiplier"
      - "increments CustomerOrder.version by 1"

  # ---- DeliveryWave --------------------------------------------------------
  - method: POST
    path: "/delivery-waves"
    description: "Opens a delivery wave for one route and one delivery slot; at most one wave may exist per delivery_slot_id. Starts FORMING with posture OPEN, no dock, no orders and an empty load_sequence."
    roles: [WavePlanner]
    code: 201
    input: [route_id, delivery_slot_id, wave_code, cutoff_at]
    output: DeliveryWave
    side_effects:
      - "status FORMING, posture OPEN, order_count 0, tote_count 0, load_sequence [], transport_cost_cents null, dock_bay_id / load_start / load_end null"

  - method: GET
    path: "/delivery-waves/{waveId}"
    description: "Reads one wave including its computed posture, order and tote counts, load_sequence and transport cost."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator]
    code: 200
    input: []
    output: DeliveryWave
    side_effects: []

  - method: GET
    path: "/delivery-waves"
    description: "Lists waves, optionally filtered by route, delivery slot, dock bay or status. Reverse-reachability channel for DeliveryWave.route_id, DeliveryWave.delivery_slot_id and DeliveryWave.dock_bay_id."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator]
    code: 200
    input: ["route_id?", "delivery_slot_id?", "dock_bay_id?", "status?", "limit?", "offset?"]
    output: DeliveryWave[]
    side_effects: []

  - method: POST
    path: "/delivery-waves/{waveId}/slot-orders"
    description: "Order slotting: attaches one SLOTTED order to this FORMING wave. The order must hold a CONFIRMED SlotBooking on the wave's delivery_slot_id and the customer's home route must equal the wave's route. Rejected after wave.cutoff_at."
    roles: [WavePlanner]
    code: 200
    input: [customer_order_id]
    output: DeliveryWave
    side_effects:
      - "order.wave_id = wave.id; order.fulfillment_status SLOTTED -> WAVED"
      - "wave.order_count recomputed; wave.status stays FORMING"
      - "wave_posture recomputed"
      - "increments CustomerOrder.version by 1"

  - method: POST
    path: "/delivery-waves/{waveId}/assign-dock"
    description: "Reserves a dock bay for the wave's van over the half-open interval [load_start, load_end). Rejected when the bay's parallel_van_capacity would be exceeded at any instant by the set of overlapping waves already assigned to it. Adjacent intervals (existing.load_end == new.load_start) do not overlap. The wave stays FORMING."
    roles: [WavePlanner]
    code: 200
    input: [dock_bay_id, load_start, load_end]
    output: DeliveryWave
    side_effects:
      - "wave.dock_bay_id, wave.load_start and wave.load_end set; wave.status stays FORMING"

  - method: POST
    path: "/delivery-waves/{waveId}/start-picking"
    description: "Robotic grid retrieval sequencing: creates one QUEUED PickTask per PENDING OrderLine of every member order, orders them by retrieval_sequence, assigns each to a station by pick_station_assignment, and allocates the units against each SKU. Requires at least one member order, sufficient on-hand stock for every line, an operational zone for every line's SKU and a non-empty station pool."
    roles: [WavePlanner]
    code: 200
    input: []
    output: DeliveryWave
    side_effects:
      - "wave.status FORMING -> PICKING; every member order WAVED -> PICKING"
      - "one PickTask per PENDING OrderLine created in QUEUED with sequence_index from retrieval_sequence, pick_station_id from pick_station_assignment, grid_zone_id from the SKU, allocated_units = OrderLine.ordered_qty"
      - "InventorySku.allocated_units and on_hand_units recomputed by sku_unit_ledger"
      - "slot_surge_multiplier recomputed for every slot on this route (route_active_wave_count changes)"
      - "increments CustomerOrder.version by 1 for every member order"

  - method: POST
    path: "/delivery-waves/{waveId}/consolidate"
    description: "Tote consolidation: closes the picking phase once every PickTask of the wave is terminal and at least one Tote is SEALED. Moves every SEALED tote to CONSOLIDATED, records the acting X-User-ID as consolidated_by_user_id (the segregation-of-duties target at dispatch), and re-runs the charge waterfall on every member order. Blocked while posture == FROZEN."
    roles: [WavePlanner]
    code: 200
    input: []
    output: DeliveryWave
    side_effects:
      - "wave.status PICKING -> CONSOLIDATED; wave.consolidated_by_user_id = X-User-ID"
      - "every Tote of the wave with status == SEALED -> CONSOLIDATED; wave.tote_count recomputed"
      - "every member order PICKING -> CONSOLIDATED"
      - "order_charge_waterfall re-run per member order; billing_status AUTHORIZED -> ADJUSTED where order_total_cents changed"
      - "increments CustomerOrder.version by 1 for every member order"

  - method: POST
    path: "/delivery-waves/{waveId}/loading-sequence"
    description: "Van loading sequence and route optimization: computes stop_sequence over the member orders, the tote load_sequence by wave_loading_sequence, and the wave's transport_cost_cents by wave_transport_cost. Requires a dock assignment, no dispatch-blocked member order and posture != FROZEN."
    roles: [WavePlanner]
    code: 200
    input: []
    output: DeliveryWave
    side_effects:
      - "wave.status CONSOLIDATED -> LOADING; every CONSOLIDATED Tote -> LOADED; every member order CONSOLIDATED -> LOADED"
      - "wave.load_sequence written by wave_loading_sequence; wave.transport_cost_cents written by wave_transport_cost"
      - "increments CustomerOrder.version by 1 for every member order"

  - method: POST
    path: "/delivery-waves/{waveId}/dispatch"
    description: "Releases the van. Requires that the acting X-User-ID differs from wave.consolidated_by_user_id (segregation of duties), that no member order is dispatch_blocked and that posture != FROZEN. Captures every member order's money."
    roles: [WavePlanner]
    code: 200
    input: []
    output: DeliveryWave
    side_effects:
      - "wave.status LOADING -> DISPATCHED"
      - "every member order LOADED -> DISPATCHED; billing_status AUTHORIZED or ADJUSTED -> CAPTURED with captured_amount_cents = order_total_cents"
      - "slot_surge_multiplier recomputed for every slot on this route"
      - "increments CustomerOrder.version by 1 for every member order"

  # ---- Tote ----------------------------------------------------------------
  - method: POST
    path: "/totes"
    description: "Temperature-zone segregation: opens a tote of one temperature class at a pick station for a wave. The station must list that class in temperature_zone_capability and must have current_tote_count < max_concurrent_totes. Blocked while the wave's posture == FROZEN."
    roles: [PickOperator]
    code: 201
    input: [wave_id, pick_station_id, tote_code, temperature_zone]
    output: Tote
    side_effects:
      - "status OPEN, assigned_line_count 0"
      - "station.current_tote_count recomputed and station.status IDLE -> ACTIVE"
      - "wave.tote_count recomputed"

  - method: GET
    path: "/totes/{toteId}"
    description: "Reads one tote."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator]
    code: 200
    input: []
    output: Tote
    side_effects: []

  - method: GET
    path: "/totes"
    description: "Lists totes, optionally filtered by wave, pick station or status. Reverse-reachability channel for Tote.wave_id and Tote.pick_station_id."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator]
    code: 200
    input: ["wave_id?", "pick_station_id?", "status?", "limit?", "offset?"]
    output: Tote[]
    side_effects: []

  - method: POST
    path: "/totes/{toteId}/seal"
    description: "Seals an OPEN tote that has at least one assigned PickTask, releasing its slot at the station. Blocked while the wave's posture == FROZEN."
    roles: [PickOperator]
    code: 200
    input: []
    output: Tote
    side_effects:
      - "status OPEN -> SEALED"
      - "station.current_tote_count recomputed and station.status ACTIVE -> IDLE when it reaches 0"

  - method: POST
    path: "/totes/{toteId}/unseal"
    description: "Reopens a SEALED tote so a late substitute pick can still be dropped into it. Requires the wave to still be PICKING and the station to have spare capacity; this is the cyclic edge of the Tote machine. Blocked while the wave's posture == FROZEN."
    roles: [PickOperator]
    code: 200
    input: []
    output: Tote
    side_effects:
      - "status SEALED -> OPEN"
      - "station.current_tote_count recomputed and station.status IDLE -> ACTIVE"

  # ---- PickTask ------------------------------------------------------------
  - method: GET
    path: "/pick-tasks/{taskId}"
    description: "Reads one pick task including its retrieval sequence index, allocation and pick outcome."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator]
    code: 200
    input: []
    output: PickTask
    side_effects: []

  - method: GET
    path: "/pick-tasks"
    description: "Lists pick tasks, optionally filtered by order line, SKU, grid zone, pick station, tote or status. Reverse-reachability channel for every PickTask FK. Tasks are created only as a side effect of start-picking and of an approved substitution, so this is their sole discovery channel."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator]
    code: 200
    input: ["order_line_id?", "sku_id?", "grid_zone_id?", "pick_station_id?", "tote_id?", "status?", "limit?", "offset?"]
    output: PickTask[]
    side_effects: []

  - method: POST
    path: "/pick-tasks/{taskId}/assign-tote"
    description: "Binds a QUEUED task with tote_id == null to an OPEN tote. Cold-chain segregation applies: the tote's temperature_zone must equal the SKU's temperature_zone. The task stays QUEUED (self-loop)."
    roles: [PickOperator]
    code: 200
    input: [tote_id]
    output: PickTask
    side_effects:
      - "task.tote_id set; task.status stays QUEUED"
      - "tote.assigned_line_count recomputed"

  - method: POST
    path: "/pick-tasks/{taskId}/start-retrieval"
    description: "Sends the bots into the grid. Requires the task's GridZone.status == OPERATIONAL and a bound tote. QUEUED -> RETRIEVING."
    roles: [PickOperator]
    code: 200
    input: []
    output: PickTask
    side_effects:
      - "status QUEUED -> RETRIEVING"

  - method: POST
    path: "/pick-tasks/{taskId}/complete"
    description: "Weighted item picking: reports the retrieved units and, for a catchweight SKU, the measured actual_weight_grams (required for catchweight, forbidden otherwise). The tolerance gate runs first; then the final variant of order_line_catchweight_price rewrites the line price. picked_units == allocated_units completes the line; picked_units < allocated_units leaves it SHORT and fires the substitution cascade."
    roles: [PickOperator]
    code: 200
    input: [picked_units, "actual_weight_grams?"]
    output: PickTask
    side_effects:
      - "status RETRIEVING -> COMPLETED when picked_units == allocated_units, else -> SHORT"
      - "sku.physical_units reduced by picked_units; allocated_units and on_hand_units recomputed by sku_unit_ledger"
      - "line.picked_units / picked_weight_grams written; line.final_line_price_cents written by the final variant"
      - "line_status PENDING -> PICKED on a full pick; PENDING -> SHORT with substitution_resolution NOT_REQUIRED -> PENDING on a short pick"
      - "on a short pick, substitute_sku_selector runs and creates a DRAFT SubstitutionProposal when its candidate pool is non-empty; order.open_substitution_count and order.dispatch_blocked recomputed; wave_posture recomputed"
      - "order_charge_waterfall re-run; billing_status AUTHORIZED -> ADJUSTED when order_total_cents changed"
      - "increments CustomerOrder.version by 1"

  - method: POST
    path: "/pick-tasks/{taskId}/cancel"
    description: "Abandons a QUEUED or RETRIEVING retrieval. This is the exact compensating action for the allocation made by start-picking: the reserved units return to on_hand_units with no drift."
    roles: [PickOperator]
    code: 200
    input: []
    output: PickTask
    side_effects:
      - "status -> CANCELLED; allocated_units of this task leaves the sku_unit_ledger sum, restoring sku.on_hand_units"
      - "tote.assigned_line_count recomputed"

  # ---- SubstitutionProposal ------------------------------------------------
  - method: POST
    path: "/substitution-proposals"
    description: "Substitution logic: manually offers a comparable substitute for a line whose substitution_resolution == PENDING, used after an earlier proposal was DECLINED or EXPIRED. The substitute must be a different SKU in the same temperature_zone and substitution_group_code. supersedes_proposal_id, when given, must name a DECLINED or EXPIRED proposal on the same line. Rejected with ERR_PROPOSAL_ALREADY_OPEN while a DRAFT or PROPOSED proposal exists on the line. expected_order_line_version is the OCC guard on the parent OrderLine declared in §1.2.1."
    roles: [PickOperator]
    code: 201
    input: [order_line_id, substitute_sku_id, expected_order_line_version, "supersedes_proposal_id?"]
    output: SubstitutionProposal
    side_effects:
      - "status DRAFT; round_no = 1 + the highest existing round_no on the line (1 when none); expires_at null until proposed"
      - "proposed_price_delta_cents = substitute.unit_price_cents * line.ordered_qty - line.provisional_line_price_cents"
      - "order.open_substitution_count recomputed"
      - "increments OrderLine.version by 1"

  - method: GET
    path: "/substitution-proposals/{proposalId}"
    description: "Reads one substitution proposal including its round number, price delta and expiry."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, Customer]
    code: 200
    input: []
    output: SubstitutionProposal
    side_effects: []

  - method: GET
    path: "/substitution-proposals"
    description: "Lists substitution proposals, optionally filtered by line, substitute SKU, superseded proposal or status. Reverse-reachability channel for SubstitutionProposal.order_line_id, SubstitutionProposal.substitute_sku_id and the self-referential SubstitutionProposal.supersedes_proposal_id. Auto-created DRAFT proposals appear in no creation response, so this is their sole discovery channel."
    roles: [FulfillmentAdmin, WavePlanner, PickOperator, Customer]
    code: 200
    input: ["order_line_id?", "substitute_sku_id?", "supersedes_proposal_id?", "status?", "limit?", "offset?"]
    output: SubstitutionProposal[]
    side_effects: []

  - method: POST
    path: "/substitution-proposals/{proposalId}/propose"
    description: "Sends a DRAFT proposal to the customer for approval, starting its PROPOSAL_TTL_MINUTES (120) approval clock. DRAFT -> PROPOSED with expires_at = clock_now + 120 minutes."
    roles: [PickOperator]
    code: 200
    input: []
    output: SubstitutionProposal
    side_effects:
      - "status DRAFT -> PROPOSED; expires_at = clock_now + PROPOSAL_TTL_MINUTES"

  - method: POST
    path: "/substitution-proposals/{proposalId}/approve"
    description: "Customer approval before dispatch. Requires clock_now < expires_at, the substitute SKU's zone OPERATIONAL and enough on-hand stock. Creates a fresh QUEUED PickTask for the substitute SKU, returns the line to PENDING, reprices it from the substitute's unit price and clears the dispatch block."
    roles: [Customer]
    code: 200
    input: []
    output: SubstitutionProposal
    side_effects:
      - "status PROPOSED -> APPROVED"
      - "one new PickTask created in QUEUED with sku_id = substitute_sku_id, grid_zone_id from the substitute SKU, pick_station_id from pick_station_assignment, allocated_units = line.ordered_qty, sequence_index from retrieval_sequence"
      - "InventorySku.allocated_units and on_hand_units recomputed for the substitute SKU by sku_unit_ledger"
      - "line_status SHORT -> PENDING; substitution_resolution PENDING -> SUBSTITUTED; final_line_price_cents = substitute.unit_price_cents * line.ordered_qty"
      - "order.open_substitution_count and order.dispatch_blocked recomputed; wave_posture recomputed"
      - "order_charge_waterfall re-run; billing_status AUTHORIZED -> ADJUSTED when order_total_cents changed"
      - "increments CustomerOrder.version by 1"

  - method: POST
    path: "/substitution-proposals/{proposalId}/decline"
    description: "Customer rejects the substitute. PROPOSED -> DECLINED. The line stays SHORT with substitution_resolution PENDING, so the order remains dispatch_blocked until another proposal is approved or the shortage is accepted."
    roles: [Customer]
    code: 200
    input: []
    output: SubstitutionProposal
    side_effects:
      - "status PROPOSED -> DECLINED; the line keeps substitution_resolution == PENDING"
      - "order.open_substitution_count recomputed; order.dispatch_blocked stays true"

  - method: POST
    path: "/substitution-proposals/{proposalId}/expire"
    description: "Retires a proposal the customer never answered. Requires clock_now >= expires_at, otherwise ERR_PROPOSAL_NOT_EXPIRED. PROPOSED -> EXPIRED; the line keeps substitution_resolution == PENDING."
    roles: [WavePlanner]
    code: 200
    input: []
    output: SubstitutionProposal
    side_effects:
      - "status PROPOSED -> EXPIRED; the line keeps substitution_resolution == PENDING"
      - "order.open_substitution_count recomputed; order.dispatch_blocked stays true"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # --- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the five roles declared in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_CUSTOMER_IDENTITY_UNKNOWN
    http: 403
    condition: "X-User-Role == Customer but X-User-ID does not resolve to any CustomerAccount.id"
  - id: ERR_ORDER_NOT_OWNED
    http: 403
    condition: "the acting Customer's X-User-ID differs from the CustomerOrder.customer_id reached through the path or body"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID dispatching a wave equals DeliveryWave.consolidated_by_user_id"

  # --- not found -----------------------------------------------------------
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "the referenced DeliveryRoute id does not exist"
  - id: ERR_DOCK_BAY_NOT_FOUND
    http: 404
    condition: "the referenced DockBay id does not exist"
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "the referenced GridZone id does not exist"
  - id: ERR_PICK_STATION_NOT_FOUND
    http: 404
    condition: "the referenced PickStation id does not exist"
  - id: ERR_SKU_NOT_FOUND
    http: 404
    condition: "the referenced InventorySku id does not exist"
  - id: ERR_MAINTENANCE_WINDOW_NOT_FOUND
    http: 404
    condition: "the referenced MaintenanceWindow id does not exist"
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "the referenced DeliverySlot id does not exist"
  - id: ERR_CUSTOMER_ACCOUNT_NOT_FOUND
    http: 404
    condition: "the referenced CustomerAccount id does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "the referenced CustomerOrder id does not exist"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "the referenced OrderLine id does not exist"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "the referenced SlotBooking id does not exist"
  - id: ERR_WAVE_NOT_FOUND
    http: 404
    condition: "the referenced DeliveryWave id does not exist"
  - id: ERR_TOTE_NOT_FOUND
    http: 404
    condition: "the referenced Tote id does not exist"
  - id: ERR_PICK_TASK_NOT_FOUND
    http: 404
    condition: "the referenced PickTask id does not exist"
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: "the referenced SubstitutionProposal id does not exist"

  # --- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, unknown field, wrong JSON type, out-of-range number, undeclared enum value, unparseable instant, or a catchweight field supplied for a non-catchweight SKU (and vice versa)"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 100] or offset < 0 on a list endpoint"

  # --- concurrency ---------------------------------------------------------
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_order_version != CustomerOrder.version on POST /slot-bookings, or expected_order_line_version != OrderLine.version on POST /substitution-proposals"

  # --- state ---------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target entity is not in a state from which the requested transition exists, or a same-entity precondition of that transition fails"
  - id: ERR_WAVE_FROZEN
    http: 409
    condition: "the DeliveryWave's computed posture is FROZEN, blocking tote and wave progression"

  # --- safety / cold chain -------------------------------------------------
  - id: ERR_ZONE_NOT_OPERATIONAL
    http: 409
    condition: "the GridZone holding the SKU is in MAINTENANCE or AUDIT_HOLD and may not be entered"
  - id: ERR_TEMPERATURE_ZONE_MISMATCH
    http: 422
    condition: "the tote's temperature_zone differs from the SKU's temperature_zone"
  - id: ERR_STATION_ZONE_UNSUPPORTED
    http: 409
    condition: "the pick station does not list the tote's temperature_zone in temperature_zone_capability"
  - id: ERR_WEIGHT_OUT_OF_TOLERANCE
    http: 422
    condition: "the catchweight deviation ratio strictly exceeds the SKU's weight_tolerance_pct"

  # --- referential ---------------------------------------------------------
  - id: ERR_ROUTE_MISMATCH
    http: 409
    condition: "the DeliverySlot's route_id differs from the booking customer's home_route_id, or the wave's route_id differs from the slotted order's customer home route"
  - id: ERR_WAVE_SLOT_MISMATCH
    http: 409
    condition: "the order being slotted has no CONFIRMED SlotBooking on the wave's delivery_slot_id"
  - id: ERR_SUBSTITUTE_NOT_COMPARABLE
    http: 422
    condition: "the substitute SKU is the ordered SKU itself, or differs in temperature_zone or substitution_group_code"
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 422
    condition: "supersedes_proposal_id names a proposal on a different line or one whose status is not DECLINED or EXPIRED"

  # --- temporal ------------------------------------------------------------
  - id: ERR_MAINTENANCE_WINDOW_OVERLAP
    http: 409
    condition: "the proposed window overlaps a SCHEDULED or ACTIVE window on the same zone once both are widened by MAINTENANCE_BUFFER_MINUTES"
  - id: ERR_DOCK_BAY_CAPACITY_EXCEEDED
    http: 409
    condition: "the dock bay's parallel_van_capacity would be exceeded at some instant of the requested [load_start, load_end) interval"
  - id: ERR_SLOT_WINDOW_CLOSED
    http: 409
    condition: "clock_now >= DeliverySlot.window_start when booking or confirming"
  - id: ERR_PROPOSAL_EXPIRED
    http: 409
    condition: "clock_now >= SubstitutionProposal.expires_at when approving or declining"
  - id: ERR_PROPOSAL_NOT_EXPIRED
    http: 409
    condition: "clock_now < SubstitutionProposal.expires_at when calling expire"

  # --- constraint ----------------------------------------------------------
  - id: ERR_NO_TOTES_TO_CONSOLIDATE
    http: 409
    condition: "no Tote of the wave is SEALED at consolidate time"
  - id: ERR_DOCK_NOT_ASSIGNED
    http: 409
    condition: "loading-sequence called on a wave whose dock_bay_id is null"
  - id: ERR_WAVE_HAS_NO_ORDERS
    http: 409
    condition: "start-picking called on a wave with order_count == 0"
  - id: ERR_NO_ELIGIBLE_PICK_STATION
    http: 409
    condition: "pick_station_assignment's candidate pool is empty for some task being created"
  - id: ERR_STATION_TOTE_CAPACITY_EXCEEDED
    http: 409
    condition: "opening or unsealing a tote would push station.current_tote_count above max_concurrent_totes"
  - id: ERR_ORDER_DISPATCH_BLOCKED
    http: 409
    condition: "a member order of the wave has dispatch_blocked == true (some line's substitution_resolution is PENDING)"
  - id: ERR_DUPLICATE_SLOT_BOOKING
    http: 409
    condition: "the order already has a SlotBooking in HELD, CONFIRMED or WAITLISTED"
  - id: ERR_TOTE_NOT_ASSIGNED
    http: 409
    condition: "assign-tote called on a task that already has a tote, or seal called on a tote with no assigned PickTask"
  - id: ERR_LINE_NOT_SHORT
    http: 409
    condition: "accept-shortage called on a line whose substitution_resolution is not PENDING"
  - id: ERR_PROPOSAL_ALREADY_OPEN
    http: 409
    condition: "a DRAFT or PROPOSED proposal already exists on the line"

  # --- fiscal / capacity ---------------------------------------------------
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 409
    condition: "sku.on_hand_units is less than the units the request would allocate"
  - id: ERR_WITHHELD_UNITS_EXCEEDED
    http: 422
    condition: "withhold-capacity units exceed total_capacity_units - withheld_units, or release-capacity units exceed withheld_units"
  - id: ERR_SLOT_UNITS_EXCEED_CAPACITY
    http: 422
    condition: "a booking's units exceed total_capacity_units - withheld_units, making it unsatisfiable even from an empty slot"
  - id: ERR_MINIMUM_ORDER_NOT_MET
    http: 422
    condition: "merchandise_subtotal_cents < MINIMUM_ORDER_CENTS (1000) at booking or confirm time"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:

  - name: FulfillmentAdmin
    description: "Site administrator. Owns the static plant topology (routes, dock bays, grid zones, pick stations, SKUs), customer account registration, and delivery-slot capacity release management."
    identity: opaque
    exclusive_operations:
      - "POST /delivery-routes"
      - "POST /dock-bays"
      - "POST /grid-zones"
      - "POST /pick-stations"
      - "POST /inventory-skus"
      - "POST /delivery-slots"
      - "POST /delivery-slots/{slotId}/release-capacity"
      - "POST /delivery-slots/{slotId}/withhold-capacity"
      - "POST /customer-accounts"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET read endpoint except GET /customer-accounts which is shared only with WavePlanner"

  - name: Customer
    description: "The grocery shopper. Owns their own baskets, slot bookings and the approval decision on any substitution offered before dispatch."
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "POST /customer-orders"
      - "POST /customer-orders/{orderId}/lines"
      - "POST /customer-orders/{orderId}/cancel"
      - "POST /order-lines/{lineId}/accept-shortage"
      - "POST /slot-bookings"
      - "POST /slot-bookings/{bookingId}/confirm"
      - "POST /substitution-proposals/{proposalId}/approve"
      - "POST /substitution-proposals/{proposalId}/decline"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /delivery-routes/{routeId}, GET /inventory-skus, GET /inventory-skus/{skuId}, GET /delivery-slots, GET /delivery-slots/{slotId}, GET /customer-accounts/{accountId}, GET /customer-orders, GET /customer-orders/{orderId}, GET /order-lines, GET /order-lines/{lineId}, GET /slot-bookings, GET /slot-bookings/{bookingId}, GET /substitution-proposals, GET /substitution-proposals/{proposalId}"

  - name: WavePlanner
    description: "Wave planning and dispatch operator. Forms waves, slots orders into them, drives the wave lifecycle from picking through dispatch, and retires unanswered substitution proposals."
    identity: opaque
    exclusive_operations:
      - "POST /delivery-waves"
      - "POST /delivery-waves/{waveId}/slot-orders"
      - "POST /delivery-waves/{waveId}/assign-dock"
      - "POST /delivery-waves/{waveId}/start-picking"
      - "POST /delivery-waves/{waveId}/consolidate"
      - "POST /delivery-waves/{waveId}/loading-sequence"
      - "POST /delivery-waves/{waveId}/dispatch"
      - "POST /substitution-proposals/{proposalId}/expire"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET read endpoint"
    notes: "Segregation of duties: the X-User-ID that consolidated a wave may not dispatch it, so two distinct WavePlanner user ids are always required to complete a wave."

  - name: PickOperator
    description: "Pick-station and grid operator. Opens, seals and reopens totes, drives every PickTask through retrieval and completion, and offers substitutes for short lines."
    identity: opaque
    exclusive_operations:
      - "POST /totes"
      - "POST /totes/{toteId}/seal"
      - "POST /totes/{toteId}/unseal"
      - "POST /pick-tasks/{taskId}/assign-tote"
      - "POST /pick-tasks/{taskId}/start-retrieval"
      - "POST /pick-tasks/{taskId}/complete"
      - "POST /pick-tasks/{taskId}/cancel"
      - "POST /substitution-proposals"
      - "POST /substitution-proposals/{proposalId}/propose"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET read endpoint except GET /customer-accounts and GET /customer-accounts/{accountId}"

  - name: GridEngineer
    description: "Grid maintenance and inventory-accuracy engineer. Owns maintenance windows and audit counts — the only two levers that can take a grid zone out of service."
    identity: opaque
    exclusive_operations:
      - "POST /grid-zones/{zoneId}/audit-counts"
      - "POST /maintenance-windows"
      - "POST /maintenance-windows/{windowId}/activate"
      - "POST /maintenance-windows/{windowId}/complete"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /delivery-routes/{routeId}, GET /dock-bays/{bayId}, GET /grid-zones/{zoneId}, GET /pick-stations/{stationId}, GET /inventory-skus, GET /inventory-skus/{skuId}, GET /maintenance-windows, GET /maintenance-windows/{windowId}"
