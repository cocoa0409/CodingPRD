    roles: [InvestmentCommittee]
    code: 200
    input: []
    output: DueDiligenceReview
    side_effects: ["status -> COMPLETED", "increments DueDiligenceReview.version by 1"]

  - method: POST
    path: "/fof/vehicles/{id}/dd-reviews/{reviewId}/withdraw"
    description: "Withdraw a draft review"
    roles: [Analyst]
    code: 200
    input: []
    output: DueDiligenceReview
    side_effects: ["status -> WITHDRAWN", "increments DueDiligenceReview.version by 1"]

  # --- InvestmentProposal ---
  - method: POST
    path: "/fof/vehicles/{id}/proposals"
    description: "Create an InvestmentProposal in DRAFT (recommended_by = acting analyst)"
    roles: [Analyst]
    code: 201
    input: [program_id, pacing_plan_id, proposed_amount]
    output: InvestmentProposal
    side_effects: ["recommended_by_analyst_id set from X-User-ID"]

  - method: GET
    path: "/fof/vehicles/{id}/proposals"
    description: "List proposals for a vehicle"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "InvestmentProposal[]"
    side_effects: []

  - method: GET
    path: "/fof/proposals/{proposalId}"
    description: "Get one proposal"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: InvestmentProposal
    side_effects: []

  - method: POST
    path: "/fof/proposals/{id}/recommend"
    description: "Analyst recommends; runs concentration_check"
    roles: [Analyst]
    code: 200
    input: []
    output: InvestmentProposal
    side_effects: ["status -> RECOMMENDED", "concentration_* fields computed", "increments InvestmentProposal.version by 1"]

  - method: POST
    path: "/fof/proposals/{id}/ic-approve"
    description: "IC approves; enforces SoD + caps; spawns Commitment in PENDING_DOCS"
    roles: [InvestmentCommittee]
    code: 200
    input: []
    output: InvestmentProposal
    side_effects: ["status -> IC_APPROVED", "Commitment created (PENDING_DOCS, sized_amount = proposed_amount)", "increments InvestmentProposal.version by 1"]

  - method: POST
    path: "/fof/proposals/{id}/ic-reject"
    description: "IC rejects proposal"
    roles: [InvestmentCommittee]
    code: 200
    input: []
    output: InvestmentProposal
    side_effects: ["status -> IC_REJECTED", "increments InvestmentProposal.version by 1"]

  - method: POST
    path: "/fof/proposals/{id}/withdraw"
    description: "Analyst withdraws own draft proposal"
    roles: [Analyst]
    code: 200
    input: []
    output: InvestmentProposal
    side_effects: ["status -> WITHDRAWN", "increments InvestmentProposal.version by 1"]

  # --- Commitment ---
  - method: GET
    path: "/fof/programs/{id}/commitments"
    description: "List commitments for a program"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?, vehicle_id?"]
    output: "Commitment[]"
    side_effects: []

  - method: GET
    path: "/fof/programs/{id}/commitments/{commitmentId}"
    description: "Get one commitment"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: Commitment
    side_effects: []

  - method: POST
    path: "/fof/programs/{id}/commitments/{commitmentId}/execute"
    description: "Execute commitment documents (OCC-guarded; sizing/band/buffer checks)"
    roles: [OperationsAnalyst]
    code: 200
    input: [sized_amount, expected_program_version]
    output: Commitment
    side_effects: ["status -> EXECUTED", "executed_at set", "program aggregates recomputed", "increments FoFProgram.version by 1", "posture recomputed"]

  - method: POST
    path: "/fof/programs/{id}/commitments/{commitmentId}/reduce"
    description: "Reduce an EXECUTED commitment's size"
    roles: [OperationsAnalyst]
    code: 200
    input: [reduce_to]
    output: Commitment
    side_effects: ["status -> REDUCED, sized_amount = reduce_to", "unfunded_amount recomputed", "program aggregates recomputed", "increments FoFProgram.version by 1"]

  - method: POST
    path: "/fof/programs/{id}/commitments/{commitmentId}/cancel"
    description: "Cancel a PENDING_DOCS commitment"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: Commitment
    side_effects: ["status -> CANCELLED", "program aggregates recomputed", "increments FoFProgram.version by 1"]

  # --- CapitalCall ---
  - method: POST
    path: "/fof/programs/{id}/commitments/{commitmentId}/calls"
    description: "Issue a capital call against a commitment"
    roles: [OperationsAnalyst]
    code: 201
    input: [amount, purpose, due_date]
    output: CapitalCall
    side_effects: ["call_number assigned per-commitment monotonic", "issued_on set from server clock"]

  - method: GET
    path: "/fof/programs/{id}/commitments/{commitmentId}/calls"
    description: "List calls for a commitment"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "CapitalCall[]"
    side_effects: []

  - method: GET
    path: "/fof/calls/{callId}"
    description: "Get one capital call"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: CapitalCall
    side_effects: []

  - method: POST
    path: "/fof/calls/{callId}/pay"
    description: "Pay a capital call; appends ledger entry and recomputes aggregates + posture"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: CapitalCall
    side_effects: ["status -> PAID", "CashLedgerEntry CAPITAL_CALL_PAYMENT appended", "commitment.unfunded_amount reduced", "program deployed_total/unrestricted_cash recomputed", "increments FoFProgram.version by 1", "posture recomputed"]

  - method: POST
    path: "/fof/calls/{callId}/cancel"
    description: "Cancel an ISSUED call at or before its due date"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: CapitalCall
    side_effects: ["status -> CANCELLED"]

  # --- Distribution ---
  - method: POST
    path: "/fof/programs/{id}/commitments/{commitmentId}/distributions"
    description: "Record a PENDING distribution"
    roles: [OperationsAnalyst]
    code: 201
    input: [amount, distribution_type, received_at]
    output: Distribution
    side_effects: []

  - method: GET
    path: "/fof/programs/{id}/commitments/{commitmentId}/distributions"
    description: "List distributions for a commitment"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "Distribution[]"
    side_effects: []

  - method: GET
    path: "/fof/distributions/{distributionId}"
    description: "Get one distribution"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: Distribution
    side_effects: []

  - method: POST
    path: "/fof/distributions/{distributionId}/receive"
    description: "Mark distribution received; appends ledger entry"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: Distribution
    side_effects: ["status -> RECEIVED", "CashLedgerEntry DISTRIBUTION_RECEIPT appended", "program returned_total/unrestricted_cash recomputed", "increments FoFProgram.version by 1", "posture recomputed"]

  - method: POST
    path: "/fof/distributions/{distributionId}/cancel"
    description: "Cancel a PENDING distribution"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: Distribution
    side_effects: ["status -> CANCELLED"]

  # --- SecondaryBid ---
  - method: POST
    path: "/fof/programs/{id}/secondary-bids"
    description: "Propose a secondary purchase or sale"
    roles: [Analyst]
    code: 201
    input: [vehicle_id, side, nav_basis, price, "unfunded_assumed?", "linked_commitment_id?"]
    output: SecondaryBid
    side_effects: ["pricing_deviation_pct computed"]

  - method: GET
    path: "/fof/programs/{id}/secondary-bids"
    description: "List secondary bids"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?, side?"]
    output: "SecondaryBid[]"
    side_effects: []

  - method: GET
    path: "/fof/programs/{id}/secondary-bids/{bidId}"
    description: "Get one bid"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: SecondaryBid
    side_effects: []

  - method: POST
    path: "/fof/programs/{id}/secondary-bids/{bidId}/counter"
    description: "IC counters a proposed bid"
    roles: [InvestmentCommittee]
    code: 200
    input: []
    output: SecondaryBid
    side_effects: ["status -> COUNTERED", "increments SecondaryBid.version by 1"]

  - method: POST
    path: "/fof/programs/{id}/secondary-bids/{bidId}/accept"
    description: "CIO accepts a PROPOSED or COUNTERED bid subject to pricing bands"
    roles: [CIO]
    code: 200
    input: []
    output: SecondaryBid
    side_effects: ["status -> ACCEPTED", "increments SecondaryBid.version by 1"]

  - method: POST
    path: "/fof/programs/{id}/secondary-bids/{bidId}/settle"
    description: "Settle an ACCEPTED bid (OCC-guarded); moves cash and creates/reduces commitment"
    roles: [OperationsAnalyst]
    code: 200
    input: [expected_program_version]
    output: SecondaryBid
    side_effects: ["status -> SETTLED", "ledger entry appended (OUT for PURCHASE / IN for SALE)", "PURCHASE creates EXECUTED Commitment with unfunded_assumed; SALE reduces linked commitment", "program aggregates recomputed", "increments FoFProgram.version by 1", "posture recomputed"]

  - method: POST
    path: "/fof/programs/{id}/secondary-bids/{bidId}/reject"
    description: "CIO rejects a bid"
    roles: [CIO]
    code: 200
    input: []
    output: SecondaryBid
    side_effects: ["status -> REJECTED", "increments SecondaryBid.version by 1"]

  - method: POST
    path: "/fof/programs/{id}/secondary-bids/{bidId}/withdraw"
    description: "Analyst withdraws a proposed bid"
    roles: [Analyst]
    code: 200
    input: []
    output: SecondaryBid
    side_effects: ["status -> WITHDRAWN", "increments SecondaryBid.version by 1"]

  # --- HoldingSnapshot / LookThroughLine ---
  - method: POST
    path: "/fof/commitments/{id}/snapshots"
    description: "Record a quarterly holding snapshot in status PROVISIONAL"
    roles: [OperationsAnalyst]
    code: 201
    input: [as_of_quarter, reported_nav]
    output: HoldingSnapshot
    side_effects: ["status = PROVISIONAL", "reported_at stamped from server clock"]

  - method: GET
    path: "/fof/commitments/{id}/snapshots"
    description: "List snapshots for a commitment"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?, as_of_quarter?"]
    output: "HoldingSnapshot[]"
    side_effects: []

  - method: GET
    path: "/fof/snapshots/{snapshotId}"
    description: "Get one snapshot"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: HoldingSnapshot
    side_effects: []

  - method: POST
    path: "/fof/snapshots/{id}/finalize"
    description: "Finalize a provisional snapshot (requires is_final flag asserted at creation)"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: HoldingSnapshot
    side_effects: ["status -> FINAL", "PUBLISHED ValuationReport for same program/quarter -> RESTATED"]

  - method: POST
    path: "/fof/snapshots/{id}/restate"
    description: "Restate a FINAL snapshot"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: HoldingSnapshot
    side_effects: ["status -> RESTATED", "PUBLISHED ValuationReport for same program/quarter -> RESTATED"]

  - method: POST
    path: "/fof/snapshots/{id}/look-through-lines"
    description: "Append look-through exposure lines to a snapshot"
    roles: [OperationsAnalyst]
    code: 201
    input: [sector, geography, exposure_amount]
    output: LookThroughLine
    side_effects: []

  - method: GET
    path: "/fof/snapshots/{id}/look-through-lines"
    description: "List look-through lines for a snapshot"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, sector?, geography?"]
    output: "LookThroughLine[]"
    side_effects: []

  - method: GET
    path: "/fof/programs/{id}/look-through"
    description: "Aggregated look-through exposure by sector or geography across the program's latest quarter snapshots"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: [group_by, "as_of_quarter?"]
    output: "{ program_id: string, as_of_quarter: string, group_by: string, buckets: array }"
    side_effects: []

  # --- ValuationReport ---
  - method: POST
    path: "/fof/programs/{id}/valuation-reports"
    description: "Create an OPEN valuation report for a quarter"
    roles: [OperationsAnalyst]
    code: 201
    input: [as_of_quarter]
    output: ValuationReport
    side_effects: []

  - method: GET
    path: "/fof/programs/{id}/valuation-reports"
    description: "List valuation reports"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "ValuationReport[]"
    side_effects: []

  - method: GET
    path: "/fof/programs/{id}/valuation-reports/{reportId}"
    description: "Get one valuation report"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: ValuationReport
    side_effects: []

  - method: POST
    path: "/fof/programs/{id}/valuation-reports/{reportId}/publish"
    description: "Publish report; computes nav variants, IRR variants, and fee layering"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: ValuationReport
    side_effects: ["status -> PUBLISHED", "nav_provisional/nav_final/nav_reported computed", "irr_provisional_pct/irr_final_pct computed", "total_fee_burden_pct computed", "increments ValuationReport.version by 1"]

  # --- StaffUser directory (backs entity-backed roles) ---
  - method: POST
    path: "/fof/staff-users"
    description: "Register a staff user; the returned id is used as X-User-ID for the entity-backed role named by staff_role"
    roles: [CIO]
    code: 201
    input: [display_name, staff_role, email]
    output: StaffUser
    side_effects: []

  - method: GET
    path: "/fof/staff-users"
    description: "List staff users"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, staff_role?"]
    output: "StaffUser[]"
    side_effects: []

  - method: GET
    path: "/fof/staff-users/{staffUserId}"
    description: "Get one staff user"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: StaffUser
    side_effects: []

  # --- Test-driving (logical clock) ---
  - method: POST
    path: "/fof/_clock/set_current_utc"
    description: "Set the server's logical clock. Default at startup is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Drives issued_on, overdue sweeps, and forecast horizons."
    roles: [OperationsAnalyst]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["clock advanced", "overdue sweep runs: CapitalCall ISSUED with due_date + overdue_grace_days < current_utc -> OVERDUE", "posture recomputed for affected programs"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown role header or missing X-User-ID for an entity-backed role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per RBAC matrix" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-template resource id does not exist (checked left-to-right)" }
  - { id: ERR_REF_NOT_FOUND, http: 404, condition: "Body-referenced FK id (pacing_plan_id, linked_commitment_id, replacement_plan_id, program_id, vehicle_id) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum value, or non-positive amount" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_program_version does not match current FoFProgram.version on an OCC-guarded write" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's current state does not permit the requested transition" }
  - { id: ERR_POSTURE_GATED, http: 409, condition: "Program posture FROZEN/RESTRICTED blocks the requested write" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "IC approver and recommending analyst resolve to the same person (matching StaffUser.email) — segregation of duties" }
  - { id: ERR_DD_SCORE_TOO_LOW, http: 422, condition: "Latest DD review not COMPLETED or composite_score < 70 on vehicle approval" }
  - { id: ERR_BUFFER_BREACH, http: 422, condition: "Operation would leave unrestricted_cash below liquidity_buffer_min" }
  - { id: ERR_PREMIUM_CAP_EXCEEDED, http: 422, condition: "Secondary PURCHASE premium over nav_basis exceeds secondary_premium_cap_pct" }
  - { id: ERR_DISCOUNT_CAP_EXCEEDED, http: 422, condition: "Secondary SALE discount under nav_basis exceeds secondary_discount_cap_pct" }
  - { id: ERR_STRATEGY_CAP_EXCEEDED, http: 422, condition: "Post-trade strategy concentration exceeds strategy_cap_pct" }
  - { id: ERR_MANAGER_CAP_EXCEEDED, http: 422, condition: "Post-trade manager concentration exceeds manager_cap_pct" }
  - { id: ERR_VINTAGE_BAND_BREACH, http: 422, condition: "New commitment's vintage_year outside allowed band span" }
  - { id: ERR_SIZE_OUT_OF_BAND, http: 422, condition: "sized_amount outside +/-10% of proposed_amount" }
  - { id: ERR_PACING_CAPACITY_EXCEEDED, http: 422, condition: "proposed_amount exceeds remaining pacing target for the vehicle's vintage year" }
  - { id: ERR_MIX_SUM_INVALID, http: 422, condition: "target_strategy_mix weights do not sum to 1.0 or contain > 4 entries" }
  - { id: ERR_ACTIVE_PLAN_EXISTS, http: 409, condition: "Another pacing plan for this program is already APPROVED" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 422, condition: "Replacement plan is not in DRAFT or belongs to a different program" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 422, condition: "Referenced pacing plan is not APPROVED for this program" }
  - { id: ERR_OVERFUNDED, http: 422, condition: "Capital call pay amount exceeds commitment.unfunded_amount" }
  - { id: ERR_REDUCE_BELOW_PAID, http: 422, condition: "reduce_to below already-paid capital calls total" }
  - { id: ERR_CALL_OVERDUE, http: 422, condition: "Cancel attempted after due_date, or due_date not strictly after issued_on" }
  - { id: ERR_DUPLICATE_QUARTER, http: 409, condition: "Snapshot quarter already exists for commitment, or report quarter already exists for program" }
  - { id: ERR_NO_APPROVED_VEHICLE, http: 422, condition: "Manager approve/exit precondition on vehicles or commitments violated" }
  - { id: ERR_VEHICLE_NOT_APPROVED, http: 422, condition: "Proposal recommend requires FundVehicle.status == APPROVED" }
  - { id: ERR_MANAGER_NOT_ELIGIBLE, http: 422, condition: "Manager not in required status for the operation" }
  - { id: ERR_COMMITMENT_NOT_EXECUTED, http: 422, condition: "Operation requires Commitment in EXECUTED (or REDUCED where allowed)" }
  - { id: ERR_NO_SNAPSHOTS, http: 422, condition: "ValuationReport publish with no snapshots for the quarter" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CIO
    description: "Chief investment officer; owns program lifecycle, plan approval/supersede, manager approve/exit, secondary accept/reject, staff directory administration"
    identity: opaque
    exclusive_operations:
      - "POST /fof/programs"
      - "POST /fof/programs/{id}/open|suspend|resume|close"
      - "POST /fof/programs/{id}/pacing-plans/{pid}/approve|supersede"
      - "POST /fof/managers/{id}/approve|exit"
      - "POST /fof/programs/{id}/secondary-bids/{bid}/accept|reject"
      - "POST /fof/staff-users"
    shared_operations:
      - "All GET endpoints"

  - name: Analyst
    description: "Investment analyst; registers managers/vehicles, runs diligence drafts, creates and recommends proposals, proposes secondary bids. X-User-ID must equal the id of a StaffUser row with staff_role == ANALYST."
    identity: "entity_backed:StaffUser"
    exclusive_operations:
      - "POST /fof/managers"
      - "POST /fof/managers/{id}/vehicles"
      - "POST /fof/managers/{id}/vehicles/{vid}/begin-diligence"
      - "POST /fof/vehicles/{vid}/dd-reviews"
      - "PUT /fof/vehicles/{vid}/dd-reviews/{rid}"
      - "POST /fof/vehicles/{vid}/dd-reviews/{rid}/submit|resubmit|withdraw"
      - "POST /fof/vehicles/{vid}/proposals"
      - "POST /fof/proposals/{pid}/recommend|withdraw"
      - "POST /fof/programs/{id}/secondary-bids"
      - "POST /fof/programs/{id}/secondary-bids/{bid}/withdraw"
      - "POST /fof/programs/{id}/pacing-plans"
    shared_operations:
      - "All GET endpoints"

  - name: InvestmentCommittee
    description: "IC member; approves vehicles and proposals, counters secondaries; cannot act on proposals they recommended (SoD). X-User-ID must equal the id of a StaffUser row with staff_role == IC_MEMBER."
    identity: "entity_backed:StaffUser"
    exclusive_operations:
      - "POST /fof/managers/{id}/vehicles/{vid}/approve-vehicle|decline-vehicle|close-to-new"
      - "POST /fof/vehicles/{vid}/dd-reviews/{rid}/request-info|complete"
      - "POST /fof/proposals/{pid}/ic-approve|ic-reject"
      - "POST /fof/programs/{id}/secondary-bids/{bid}/counter"
    shared_operations:
      - "All GET endpoints"

  - name: OperationsAnalyst
    description: "Operations; executes/reduces/cancels commitments, manages calls/distributions/ledger, records snapshots and publishes valuation reports, settles secondaries, drives the test clock. X-User-ID must equal the id of a StaffUser row with staff_role == OPS_ANALYST."
    identity: "entity_backed:StaffUser"
    exclusive_operations:
      - "POST /fof/programs/{id}/ledger-entries"
      - "POST /fof/programs/{id}/commitments/{cid}/execute|reduce|cancel"
      - "POST /fof/programs/{id}/commitments/{cid}/calls|distributions"
      - "POST /fof/calls/{id}/pay|cancel"
      - "POST /fof/distributions/{id}/receive|cancel"
      - "POST /fof/commitments/{cid}/snapshots"
      - "POST /fof/snapshots/{sid}/finalize|restate"
      - "POST /fof/snapshots/{sid}/look-through-lines"
      - "POST /fof/programs/{id}/valuation-reports"
      - "POST /fof/programs/{id}/valuation-reports/{rid}/publish"
      - "POST /fof/programs/{id}/secondary-bids/{bid}/settle"
      - "POST /fof/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: ComplianceOfficer
    description: "Compliance; suspends/reinstates managers with cascade effects"
    identity: opaque
    exclusive_operations:
      - "POST /fof/managers/{id}/suspend|reinstate"
    shared_operations:
      - "All GET endpoints"

# =============================================================================
# Identity mapping note: X-User-ID for the entity-backed roles Analyst,
# InvestmentCommittee, and OperationsAnalyst MUST equal the id of a StaffUser
# row whose staff_role is ANALYST, IC_MEMBER, or OPS_ANALYST respectively.
# CIO and ComplianceOfficer are opaque roles; their X-User-ID is not resolved
# against any entity.
# =============================================================================
