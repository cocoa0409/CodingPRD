              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 400 with error_id ERR_INVALID_REQUEST, NOT 404 ERR_STATION_NOT_FOUND"
            - "GET /inspection-records returns meta.total_count == 0"
            - "control: supplying arrived_at 2026-08-05T09:00:00Z with the same unknown station_id returns 404 ERR_STATION_NOT_FOUND, so priority 8 does fire once the body is well formed"

      - name: violation_to_error_limit_above_one_hundred_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_5
          - errors.ERR_INVALID_PAGINATION
        distinguishing_aspect: "The pagination window is the closed range [1, 100] with offset >= 0: limit 101 is rejected 400 ERR_INVALID_PAGINATION while limit 100 is accepted, and a negative offset is rejected on the same rule."
        test_recipe:
          setup:
            - "Two water bodies exist so a successful list has something to return."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_1: $.data.id }
            - call: "POST /water-bodies"
              payload: { name: "Nilan Reservoir", state_code: "MT", water_body_class: "RESERVOIR", risk_tier: "LOW" }
              as: ProgramAdmin
              captures: { wb_2: $.data.id }
          trigger:
            - call: "GET /water-bodies"
              payload: { limit: 101, offset: 0 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 400 with error_id ERR_INVALID_PAGINATION"
            - "control: limit 100 offset 0 returns 200 with meta.total_count == 2 and has_more false"
            - "control: limit 0 returns 400 ERR_INVALID_PAGINATION"
            - "control: limit 10 offset -1 returns 400 ERR_INVALID_PAGINATION"
            - "control: GET /inspection-stations with limit 101 also returns 400 ERR_INVALID_PAGINATION, so the rule is not water-body specific"

      - name: satisfaction_to_pass_arrival_exactly_at_opens_at_is_inside_the_window
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_30
          - errors.ERR_STATION_OUTSIDE_OPERATING_HOURS
        distinguishing_aspect: "The operating window is half-open [opens_at, closes_at): an arrival stamped exactly opens_at is accepted and opens a record, while an arrival stamped exactly closes_at is rejected 409 ERR_STATION_OUTSIDE_OPERATING_HOURS."
        test_recipe:
          setup:
            - "Station with the single window [2026-08-05T08:00:00Z, 2026-08-05T17:00:00Z) and an ACTIVE inspector."
            - "Two vessels so each arrival gets its own record."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
