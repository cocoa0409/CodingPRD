scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_projection_versus_final_net_after_tier_drop
        grounds:
          - calculations.commission_entitlement
          - calculations.tier_multiplier_resolution
          - calculations.milestone_commission_amount
          - entities.StudentApplication.fields.projected_commission_cents
          - entities.StudentApplication.fields.net_commission_cents
          - endpoints["GET /recruitment/applications/{id}/commission-projection"]
        distinguishing_aspect: |
          Monetary variant pair: the provisional_forward_looking variant prices all four
          milestones with the single PLATINUM tier frozen at submission (484971 cents) while
          the final_chronological variant prices only the one milestone actually reached with
          the WATCH tier resolved at that milestone's own event date (85371 cents), so the
          two variants diverge by exactly 399600 cents on identical row data.
        test_recipe:
          setup:
            - "Logical clock starts at the mandated default 2026-08-01T00:00:00Z."
            - "Agency ag1 is vetting_state CLEARED, compliance_posture GOOD_STANDING."
            - "Contract c1 is ACTIVE for 2026-08-01..2027-07-31 with one rate card (400/500/200/150 bps, rate_cap 600, per_milestone_cap 150000, clawback_window 120) and an ACTIVE EXCLUSIVE IN territory."
            - "A first application on the non-commissionable foundation program ran the full milestone chain inside 2026-08-01..2026-08-10, so the scorecard for period 2026-08-01..2026-08-11 is PLATINUM (composite 1.0000)."
            - "Application a1 on program MSCS-2026 (tuition 2845700 cents) was submitted on 2026-08-12, i.e. strictly after the PLATINUM scorecard's period_end_date, so tier_snapshot_at_submission is PLATINUM."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Sunrise Education Consultants", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 2, sanctions_screen_passed: true, reference_check_count: 3 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/programs"
              payload: { code: "FOUND-2026", name: "Foundation Pathway", level: "UNDERGRADUATE", annual_tuition_cents: 1000000, term_start_date: "2026-08-03", census_date: "2026-08-06", persistence_check_date: "2026-08-10", commission_eligible: false, max_commission_bps: 1000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { prog0_id: "$.data.id" }
            - call: "POST /recruitment/programs"
              payload: { code: "MSCS-2026", name: "MSc Computer Science", level: "POSTGRADUATE", annual_tuition_cents: 2845700, term_start_date: "2026-09-01", census_date: "2026-09-30", persistence_check_date: "2027-02-15", commission_eligible: true, max_commission_bps: 1000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { prog1_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-2026-001", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id", c1_v: "$.data.version" }
            - call: "POST /recruitment/contracts/${c1_id}/commission-schedules"
              payload: { effective_from: "2026-08-01", effective_to: "2027-07-31", deposit_rate_bps: 400, enrollment_rate_bps: 500, census_rate_bps: 200, persistence_rate_bps: 150, rate_cap_bps: 600, per_milestone_cap_cents: 150000, clawback_window_days: 120, expected_contract_version: "${c1_v}" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { s1_id: "$.data.id" }
            - call: "POST /recruitment/contracts/${c1_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "EXCLUSIVE", start_date: "2026-08-01", end_date: "2027-07-31" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { t1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/training-certifications"
              payload: { module_code: "PROGRAM_ACCURACY", score: 92, issued_on: "2026-08-01" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/training-certifications"
              payload: { module_code: "PROHIBITED_CLAIMS", score: 88, issued_on: "2026-08-01" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/contracts/${c1_id}/lifecycle"
