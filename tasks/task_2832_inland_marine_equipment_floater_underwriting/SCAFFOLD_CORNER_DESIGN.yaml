      - name: corner_geo_tracking_required_on_low_tier_jobsite
        claim_type: Violation → Error
        grounds:
          - validations[priority=51]
          - errors[ERR_GEO_TRACKING_REQUIRED]
          - endpoints[POST /inland-marine/coverage-parts/{id}/equipment-items]
          - endpoints[POST /inland-marine/equipment-items/{id}/assign-jobsite]
          - endpoints[POST /inland-marine/jobsites/{id}/security-survey]
          - calculations.equipment_item_premium
        distinguishing_aspect: |
          The theft control fires on all three of its endpoints for the SAME grade-A
          excavator: create-with-jobsite is refused on a TIER_1 site, assign-jobsite is
          refused on that site, and once the untracked item is legitimately parked on a
          TIER_2 site a re-survey that would DOWNGRADE that site to TIER_1 is refused
          too, leaving the jobsite's controls unchanged at score 3.
        test_recipe:
          setup:
            - "One PUBLISHED RateRule: EXCAVATOR, T2_URBAN, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One SURVEYED Jobsite in T2_URBAN with fenced only (security_score 1, TIER_1)."
            - "One SURVEYED Jobsite in T2_URBAN with fenced + lighting + alarm_monitored (security_score 3, TIER_2)."
            - "One DRAFT Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 50000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart, valuation_basis ACV, per_item_limit_cents 20000000, aggregate_limit_cents 200000000."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
