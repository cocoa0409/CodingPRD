      - call: POST /aquarium/institutions
        payload: {name: Northport Marine Institute, institution_code: NPM, accreditation_status: ACCREDITED, welfare_audit_score: 80.0, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {inst_id: $.data.id}
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: WILD_COLLECTION, requested_count: 1, source_institution_id: '${inst_id}'}
        as: CuratorOfCollections
        captures: {ar_id: $.data.id, prov_score: $.data.sustainability_score}
      - call: POST /aquarium/acquisition-requests/${ar_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: POST /aquarium/permits
        payload: {acquisition_request_id: '${ar_id}', permit_type: IMPORT, authority_reference: NMFS-2026-1177, document_codes: [HEALTH_CERTIFICATE, ORIGIN_DECLARATION, IMPORT_LICENSE]}
        as: PermitOfficer
        captures: {pm_id: $.data.id}
      - call: POST /aquarium/permits/${pm_id}/submission
        payload: {}
        as: PermitOfficer
      - call: POST /aquarium/permits/${pm_id}/decisions
        payload: {decision: ISSUE, valid_from: '2026-08-01T00:00:00Z', valid_until: '2026-09-01T00:00:00Z'}
        as: ComplianceDirector
        as_user_id: dir-permit-officer
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v2: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_v2}'}
        as: ComplianceDirector
