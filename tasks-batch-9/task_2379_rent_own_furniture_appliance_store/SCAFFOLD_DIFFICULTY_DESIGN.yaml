      - name: late_fee_grace_day_boundary_three_versus_four_in_one_day_close
        grounds:
          - calculations.late_fee_assessment
          - entities.StateRtoRule.fields.late_fee_grace_days
          - endpoints["POST /stores/{id}/day-close"]
        distinguishing_aspect: |
          A single day-close run sees two agreements one day apart: the one due
          2026-08-08 is 4 days late and is charged 508 cents, the one due
          2026-08-09 is exactly 3 days late and is charged nothing, because the
          comparison is a STRICT days_late > late_fee_grace_days. An
