            - { call: "POST /pairings/${u3}/assign-judge", payload: { judge_id: "${j_e3}" }, as: TabStaff }
            - { call: "POST /rounds/${r2}/open-ballots", as: TabStaff }
            - { call: "GET /pairing-entries?pairing_id=${u1}", as: TabStaff, captures: { u1w: "$.data[0].entry_id", u1l: "$.data[1].entry_id" } }
            - { call: "POST /ballots", payload: { pairing_id: "${u1}", winner_entry_id: "${u1w}", speaker_points: { "${u1w}": 30, "${u1l}": 23 } }, as: Judge, as_user_id: "${j_e1}", captures: { bu1: $.data.id } }
            - { call: "POST /ballots/${bu1}/submit", as: Judge, as_user_id: "${j_e1}" }
            - { call: "POST /ballots/${bu1}/verify", as: TabStaff }
