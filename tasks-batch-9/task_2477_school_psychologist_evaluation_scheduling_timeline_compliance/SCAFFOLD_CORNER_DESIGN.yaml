              captures: { order1: $.data.id }
          assert:
            - "data.unit_price_cents == 1799 (tier_multiplier 1.00), base_cents == 17990"
            - "data.contract_discount_cents == 1259 (round_half_up(17990 * 0.07) == round_half_up(1259.3))"
            - "data.rush_surcharge_cents == 0 and data.handling_fee_cents == 1250"
            - "data.total_cost_cents == 17981 and data.auto_approved == true with status == APPROVED"

      - name: protocol_order_tier_boundary_lowers_total_across_threshold
        claim_type: tiered_pricing
        grounds:
          - calculations.protocol_order_total_cost
          - state_machines.ProtocolOrder.initial_state
        distinguishing_aspect: "TIER1_MIN_QTY is a hard boundary at 25 that drops BOTH the multiplier (1.00 -> 0.95) and the handling fee (1250 -> 0), so ordering ONE MORE booklet costs less in total (41404 for 24 vs 39734 for 25) and flips the order from SUBMITTED to auto-APPROVED."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one AssessmentInstrument with protocol_unit_cost_cents 1799."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
