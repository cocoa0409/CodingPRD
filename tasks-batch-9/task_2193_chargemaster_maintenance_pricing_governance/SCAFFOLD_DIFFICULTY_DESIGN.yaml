          - min_cost_basis_cents: 50000
            markup_bp: 24000
          - min_cost_basis_cents: 250000
            markup_bp: 18000
          min_medicare_multiple_bp: 12000
          market_cap_multiple_bp: 11000
          effective_from: '2026-01-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        captures:
          pr_lab_id: $.data.id
      - call: POST /chargemaster/payer-contracts
