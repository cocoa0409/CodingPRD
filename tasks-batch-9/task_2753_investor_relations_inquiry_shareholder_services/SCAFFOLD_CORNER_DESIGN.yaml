          - endpoints[POST /companies/{id}/recompute-posture]
        distinguishing_aspect: "disclosure_posture is recomputed from the whole activist set every time, not ratcheted: CRITICAL then WATCH on the same activist returns the company from BLACKOUT to OPEN, and a non-activist raised to CRITICAL leaves it OPEN."
