            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
            - *k_deny
            - *k_appeal
            - &k_req_dl
              call: "POST /vetpay/appeals/${a_id}/request-records"
