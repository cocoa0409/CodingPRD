scaffold_corner_design:
  # ===========================================================================
  # Section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: account_create_applies_defaults
        claim_type: creation_with_defaults
        grounds: [entities.CustomerAccount.fields.outstanding_cents, entities.CustomerAccount.fields.status]
        distinguishing_aspect: "Account created without outstanding_cents/recovery_credit_cents gets computed defaults 0/0 and status ACTIVE; server ignores client-supplied computed fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/accounts", payload: { company_name: "ACME-1", account_tier: "PREMIER", credit_limit_cents: 5000000 }, as: PlatformAdmin, captures: { ac1_id: $.data.id, ac1_out: $.data.outstanding_cents, ac1_rc: $.data.recovery_credit_cents } }
          assert:
            - "CustomerAccount.${ac1_id}.outstanding_cents == 0"
            - "CustomerAccount.${ac1_id}.recovery_credit_cents == 0"
            - "CustomerAccount.${ac1_id}.status == ACTIVE"
            - "CustomerAccount.${ac1_id}.version == 1"

      - name: account_create_missing_required_field_returns_invalid_request
        claim_type: required_field_violation
        grounds: [entities.CustomerAccount.fields.account_tier, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "Omitting required enum field account_tier on account creation fails with ERR_INVALID_REQUEST before any persistence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/accounts", payload: { company_name: "ACME-2", credit_limit_cents: 5000000 }, as: PlatformAdmin, captures: { ac2_err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: account_create_invalid_enum_rejected
        claim_type: type_constraint
        grounds: [entities.CustomerAccount.fields.account_tier, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "account_tier outside {STANDARD, PREMIER, FEDERAL} is rejected; enum membership is validated."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/accounts", payload: { company_name: "ACME-3", account_tier: "GOLD", credit_limit_cents: 5000000 }, as: PlatformAdmin, captures: { ac3_err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: get_account_not_found_returns_404
        claim_type: not_found
        grounds: ['errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET on a well-formed but nonexistent account id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/accounts/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { ac4_err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: list_accounts_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.CustomerAccount]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count plus has_more per the fixed envelope."
        test_recipe:
          setup: ["three accounts created"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "PG-1", account_tier: "STANDARD", credit_limit_cents: 1000 }, as: PlatformAdmin }
            - { call: "POST /api/accounts", payload: { company_name: "PG-2", account_tier: "STANDARD", credit_limit_cents: 1000 }, as: PlatformAdmin }
            - { call: "POST /api/accounts", payload: { company_name: "PG-3", account_tier: "STANDARD", credit_limit_cents: 1000 }, as: PlatformAdmin }
          trigger:
            - { call: "GET /api/accounts", payload: { limit: 2, offset: 0 }, as: PlatformAdmin }
          assert:
            - "response data length == 2 and total_count == 3 and has_more == true"

      - name: component_available_units_is_computed
        claim_type: computed_field
        grounds: [entities.Component.fields.available_units, entities.Component.fields.reserved_units]
        distinguishing_aspect: "available_units == stock_on_hand - reserved_units at creation (stock 7, reserved 0 -> 7); a client-supplied available_units value is ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/components", payload: { sku: "CMP-1", kind: "CPU", price_cents: 1000, lead_time_days: 2, stock_on_hand: 7, revision: "A01" }, as: PlatformAdmin, captures: { cm1_id: $.data.id, cm1_avail: $.data.available_units } }
          assert:
            - "Component.${cm1_id}.available_units == 7"
            - "Component.${cm1_id}.reserved_units == 0"

      - name: compatibility_rule_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.CompatibilityRule]
        distinguishing_aspect: "CompatibilityRule has common_fields: false — response carries id and created_at but no version and no updated_at; there is no update endpoint."
        test_recipe:
          setup: ["chassis and component exist"]
          setup_api_calls:
            - { call: "POST /api/chassis-models", payload: { model_code: "IR-1", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { ir_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "IR-C", kind: "CPU", price_cents: 1000, lead_time_days: 1, stock_on_hand: 1, revision: "A01" }, as: PlatformAdmin, captures: { ir_c: $.data.id } }
          trigger:
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${ir_l}", component_id: "${ir_c}", rule_type: "ALLOWED" }, as: PlatformAdmin, captures: { ir_id: $.data.id } }
          assert:
            - "response has id and created_at and no version key"
            - "no PATCH/PUT endpoint exists for /api/compatibility-rules"

      - name: fk_reverse_reachability_order_lines
        claim_type: parent_relationship
        grounds: [entities.OrderLine.fields.order_id, 'endpoints[GET /api/orders/{id}/lines]']
        distinguishing_aspect: "Children of an order are discoverable via the parent sub-resource GET and return an array of OrderLine."
        test_recipe:
          setup: ["account, chassis, component, ALLOWED rule, validated config, order with one line"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "FK-1", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { fk_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "FKL1", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { fk_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "FKC1", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { fk_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${fk_l}", component_id: "${fk_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${fk_a}"
                chassis_model_id: "${fk_l}"
                component_selections: [{ component_id: "${fk_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${fk_a}"
              captures: { fk_cf: $.data.id }
            - { call: "POST /api/orders", payload: { account_id: "${fk_a}", po_number: "PO-FK1" }, as: CustomerUser, as_user_id: "${fk_a}", captures: { fk_o: $.data.id } }
            - { call: "POST /api/orders/${fk_o}/lines", payload: { configuration_id: "${fk_cf}", qty: 2, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${fk_a}", captures: { fk_ol: $.data.id } }
          trigger:
            - { call: "GET /api/orders/${fk_o}/lines", payload: {}, as: CustomerUser, as_user_id: "${fk_a}" }
          assert:
            - "response is OrderLine[] of length 1 with element id == ${fk_ol} and qty == 2"

      - name: order_line_qty_zero_rejected
        claim_type: type_constraint
        grounds: ['validations[priority=19]', 'errors[ERR_INVALID_ORDER_QUANTITY]']
        distinguishing_aspect: "qty 0 violates the >= 1 bound — a zero-quantity boundary on the quantity metric distinct from stock thresholds."
        test_recipe:
          setup: ["account, chassis, component, rule, config exist"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "QZ-1", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { qz_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "QZL1", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { qz_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "QZC1", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { qz_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${qz_l}", component_id: "${qz_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${qz_a}"
                chassis_model_id: "${qz_l}"
                component_selections: [{ component_id: "${qz_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${qz_a}"
              captures: { qz_cf: $.data.id }
            - { call: "POST /api/orders", payload: { account_id: "${qz_a}", po_number: "PO-QZ" }, as: CustomerUser, as_user_id: "${qz_a}", captures: { qz_o: $.data.id } }
          trigger:
            - { call: "POST /api/orders/${qz_o}/lines", payload: { configuration_id: "${qz_cf}", qty: 0, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${qz_a}", captures: { qz_err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ORDER_QUANTITY (422)"
            - "Order.${qz_o} has zero lines"

  # ===========================================================================
  # Section 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: configuration_starts_in_draft
        claim_type: initial_state
        grounds: [state_machines.Configuration]
        distinguishing_aspect: "A freshly created configuration is DRAFT with compatibility_ok false before any validate call."
        test_recipe:
          setup: ["account, chassis, component exist"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "SM-1", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { sm1_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "SML1", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { sm1_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "SMC1", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { sm1_c: $.data.id } }
          trigger:
            - call: "POST /api/configurations"
              payload:
                account_id: "${sm1_a}"
                chassis_model_id: "${sm1_l}"
                component_selections: [{ component_id: "${sm1_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${sm1_a}"
              captures: { sm1_cf: $.data.id, sm1_st: $.data.status }
          assert:
            - "Configuration.${sm1_cf}.status == DRAFT"
            - "Configuration.${sm1_cf}.compatibility_ok == false"

      - name: validate_from_validated_is_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Configuration.DRAFT_to_VALIDATED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Re-validating an already VALIDATED configuration is an idempotency violation: second validate rejected with ERR_INVALID_STATE, no side effects."
        test_recipe:
          setup: ["account, chassis, component, ALLOWED rule, configuration VALIDATED"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "SM-2", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { sm2_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "SML2", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { sm2_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "SMC2", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { sm2_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${sm2_l}", component_id: "${sm2_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${sm2_a}"
                chassis_model_id: "${sm2_l}"
                component_selections: [{ component_id: "${sm2_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${sm2_a}"
              captures: { sm2_cf: $.data.id }
            - { call: "POST /api/configurations/${sm2_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${sm2_a}" }
          trigger:
            - { call: "POST /api/configurations/${sm2_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${sm2_a}", captures: { sm2_err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "Configuration.${sm2_cf}.status == VALIDATED"

      - name: superseded_configuration_is_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.Configuration, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "SUPERSEDED is terminal: validate/lock/unlock on a superseded configuration all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["configuration C-old exists DRAFT; a new configuration created with supersedes_configuration_id = C-old"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "SM-3", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { sm3_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "SML3", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { sm3_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "SMC3", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { sm3_c: $.data.id } }
            - call: "POST /api/configurations"
              payload:
                account_id: "${sm3_a}"
                chassis_model_id: "${sm3_l}"
                component_selections: [{ component_id: "${sm3_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${sm3_a}"
              captures: { sm3_old: $.data.id }
            - call: "POST /api/configurations"
              payload:
                account_id: "${sm3_a}"
                chassis_model_id: "${sm3_l}"
                component_selections: [{ component_id: "${sm3_c}", qty: 2 }]
                supersedes_configuration_id: "${sm3_old}"
              as: CustomerUser
              as_user_id: "${sm3_a}"
          trigger:
            - { call: "POST /api/configurations/${sm3_old}/validate", payload: {}, as: CustomerUser, as_user_id: "${sm3_a}", captures: { sm3_err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)   # SUPERSEDED is terminal"
            - "Configuration.${sm3_old}.status == SUPERSEDED"

      - name: cancel_draft_order_is_valid
        claim_type: valid_transition
        grounds: [state_machines.Order."build DRAFT"_to_"build CANCELLED"]
        distinguishing_aspect: "DRAFT -> CANCELLED is defined; cancelling a draft order succeeds with no outstanding_cents debit ever applied."
        test_recipe:
          setup: ["account; order created in DRAFT with no lines"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "SM-4", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { sm4_a: $.data.id } }
            - { call: "POST /api/orders", payload: { account_id: "${sm4_a}", po_number: "PO-SM4" }, as: CustomerUser, as_user_id: "${sm4_a}", captures: { sm4_o: $.data.id } }
          trigger:
            - { call: "POST /api/orders/${sm4_o}/cancel", payload: {}, as: CustomerUser, as_user_id: "${sm4_a}" }
          assert:
            - "Order.${sm4_o}.build_status == CANCELLED"
            - "CustomerAccount.${sm4_a}.outstanding_cents == 0"

      - name: cancel_built_order_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Order, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Cancel is defined only from build DRAFT or SUBMITTED; from BUILT it is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["fully built order (submitted, allocated, started, completed)"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "SM5", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { sm5_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "SML5", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { sm5_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "SMC5", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { sm5_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${sm5_l}", component_id: "${sm5_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${sm5_a}"
                chassis_model_id: "${sm5_l}"
                component_selections: [{ component_id: "${sm5_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${sm5_a}"
              captures: { sm5_cf: $.data.id }
            - { call: "POST /api/configurations/${sm5_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${sm5_a}", captures: { sm5_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${sm5_a}", po_number: "PO-SM5" }, as: CustomerUser, as_user_id: "${sm5_a}", captures: { sm5_o: $.data.id } }
            - { call: "POST /api/orders/${sm5_o}/lines", payload: { configuration_id: "${sm5_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${sm5_a}" }
            - { call: "POST /api/orders/${sm5_o}/submit", payload: { expected_configuration_version: "${sm5_cv}" }, as: CustomerUser, as_user_id: "${sm5_a}" }
            - call: "GET /api/orders/${sm5_o}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                sm5_j: $.data[0].id
            - { call: "POST /api/build-jobs/${sm5_j}/allocate", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${sm5_j}/start", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${sm5_j}/complete", payload: {}, as: FactoryOps }
          trigger:
            - { call: "POST /api/orders/${sm5_o}/cancel", payload: {}, as: CustomerUser, as_user_id: "${sm5_a}", captures: { sm5_err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "Order.${sm5_o}.build_status == BUILT"

      - name: ship_outside_window_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.DeploymentWave.RELEASED_to_SHIPPED, 'validations[priority=14]', 'errors[ERR_OUTSIDE_SHIP_WINDOW]']
        distinguishing_aspect: "Shipping before ship_window_start (clock still at 2026-09-01, window opens 2026-09-05) fails with ERR_OUTSIDE_SHIP_WINDOW; wave stays RELEASED."
        test_recipe:
          setup: ["built order; wave with window [2026-09-05, 2026-09-10) released; clock remains 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "SM6", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { sm6_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "SML6", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { sm6_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "SMC6", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { sm6_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${sm6_l}", component_id: "${sm6_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${sm6_a}"
                chassis_model_id: "${sm6_l}"
                component_selections: [{ component_id: "${sm6_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${sm6_a}"
              captures: { sm6_cf: $.data.id }
            - { call: "POST /api/configurations/${sm6_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${sm6_a}", captures: { sm6_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${sm6_a}", po_number: "PO-SM6" }, as: CustomerUser, as_user_id: "${sm6_a}", captures: { sm6_o: $.data.id } }
            - { call: "POST /api/orders/${sm6_o}/lines", payload: { configuration_id: "${sm6_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${sm6_a}" }
            - { call: "POST /api/orders/${sm6_o}/submit", payload: { expected_configuration_version: "${sm6_cv}" }, as: CustomerUser, as_user_id: "${sm6_a}" }
            - call: "GET /api/orders/${sm6_o}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                sm6_j: $.data[0].id
            - { call: "POST /api/build-jobs/${sm6_j}/allocate", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${sm6_j}/start", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${sm6_j}/complete", payload: {}, as: FactoryOps }
            - call: "POST /api/orders/${sm6_o}/deployment-waves"
              payload:
                wave_label: "W1"
                ship_window_start: "2026-09-05T00:00:00Z"
                ship_window_end: "2026-09-10T00:00:00Z"
                destinations: [{ employee_ref: "HQ", address: "1 Main St", units: 1 }]
              as: AccountManager
              captures: { sm6_w: $.data.id }
            - { call: "POST /api/deployment-waves/${sm6_w}/release", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /api/deployment-waves/${sm6_w}/ship", payload: {}, as: FactoryOps, captures: { sm6_err: $.data.error_id } }
          assert:
            - "error_id == ERR_OUTSIDE_SHIP_WINDOW (422)   # clock 2026-09-01 < window start 2026-09-05"
            - "DeploymentWave.${sm6_w}.status == RELEASED"

      - name: second_release_is_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DeploymentWave, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Releasing an already RELEASED wave is an idempotency violation rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["built order with a RELEASED wave"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "SM7", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { sm7_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "SML7", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { sm7_l: $.data.id } }
