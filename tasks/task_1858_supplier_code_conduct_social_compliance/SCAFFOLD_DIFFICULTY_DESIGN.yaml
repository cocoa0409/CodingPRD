            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
          trigger:
            - { call: "POST /audits/${au_id}/worker-interviews", payload: { interview_count: 9, forced_labor_indicators: false, recruitment_fee_indicators: false }, as: Auditor, as_user_id: "${aud_id}", captures: { err: $.data.error_id } }
            - { call: "POST /audits/${au_id}/worker-interviews", payload: { interview_count: 10, forced_labor_indicators: false, recruitment_fee_indicators: false }, as: Auditor, as_user_id: "${aud_id}", captures: { rec_count: $.data.interview_count } }
            - { call: "GET /audits/${au_id}/worker-interviews", payload: {}, as: ComplianceOfficer, captures: { first_count: "$.data[0].interview_count" } }
          assert:
            - "${err} == ERR_INTERVIEW_SAMPLE_TOO_SMALL (9 < ceil(sqrt(100)) = 10)"
            - "${rec_count} == 10 (exactly the minimum passes)"
            - "exactly one record exists afterwards and ${first_count} == 10 (the rejected attempt left no residue)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: audit_schedule_requires_auditable_supplier
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SUPPLIER_NOT_AUDITABLE]"
          - state_machines.Supplier.ONBOARDING_to_ACTIVE
        distinguishing_aspect: |
          Entity pair Audit -> Supplier: POST /audits is gated on the state of a
          DIFFERENT entity (the facility's supplier must be ACTIVE or PROBATION); an
          ONBOARDING supplier (no acknowledgment yet) blocks scheduling, and the same
          request succeeds after acknowledgment flips the supplier ACTIVE. The paired
          instance crosses a different pair (MutualRecognitionClaim -> Finding).
        test_recipe:
          setup:
            - "Code version PUBLISHED; supplier registered but ONBOARDING (no acknowledgment); facility US / 10 workers; auditor covers US"
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Mike Outfitters", country_code: "US", sector: "APPAREL" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Reno Cut", country_code: "US", worker_count: 10, processes: ["cutting"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
          trigger:
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "S Ann", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id, au_status: $.data.status } }
          assert:
            - "${err} == ERR_SUPPLIER_NOT_AUDITABLE while the supplier is ONBOARDING"
            - "after acknowledgment (supplier ACTIVE): ${au_id} is a created audit and ${au_status} == SCHEDULED"

      - name: claim_accept_blocked_by_open_zt_finding
        grounds:
          - state_machines.MutualRecognitionClaim.SUBMITTED_to_ACCEPTED
          - "errors[ERR_OPEN_ZT_FINDINGS_EXIST]"
          - state_machines.Finding
        distinguishing_aspect: |
          Entity pair MutualRecognitionClaim -> Finding (different pair than
          Audit -> Supplier): accepting a claim requires the ABSENCE of OPEN
          zero-tolerance findings at the facility; with the FAILED_ZT audit's finding
          still OPEN, ACCEPT is rejected even though score and staleness checks pass.
        test_recipe:
          setup:
            - "Supplier ACTIVE; facility US / 10 workers; audit FAILED_ZT with its ZERO_TOLERANCE(FORCED_LABOR) finding still OPEN; SMETA claim (score 80, date 2026-07-01, clock 2026-09-01) SUBMITTED"
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "November Foods", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "U Lan", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Fresno Pack", country_code: "US", worker_count: 10, processes: ["packing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "ZERO_TOLERANCE", category: "FORCED_LABOR", description: "Recruitment debt bondage" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_zt: $.data.id } }
            - { call: "POST /mutual-recognition-claims", payload: { facility_id: "${fac_id}", program_name: "SMETA", external_audit_ref: "EXT-900", external_audit_date: "2026-07-01T00:00:00Z", external_score: 80 }, as: SupplierContact, as_user_id: "${sup_id}", captures: { claim_id: $.data.id } }
          trigger:
            - { call: "POST /mutual-recognition-claims/${claim_id}/decide", payload: { decision: "ACCEPT" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /mutual-recognition-claims/${claim_id}", payload: {}, as: ComplianceOfficer, captures: { cl_status: $.data.status } }
          assert:
            - "${err} == ERR_OPEN_ZT_FINDINGS_EXIST (cross-entity gate: Finding.status == OPEN at the claim's facility)"
            - "${cl_status} == SUBMITTED (failed decide leaves the claim untouched)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: auditor_half_open_booking_overlap
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_AUDITOR_BOOKING_CONFLICT]"
        distinguishing_aspect: |
          Interval semantics: pure half-open overlap on the AUDITOR resource —
          touching windows ([09-01,09-05) then [09-05,09-08)) MUST be allowed, while a
          strictly intersecting window ([09-04,09-06)) MUST conflict. Different
          resource and different semantics than the facility 30-day buffer instance.
