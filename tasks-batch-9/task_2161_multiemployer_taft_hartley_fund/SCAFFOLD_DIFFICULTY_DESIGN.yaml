  - rule_id: priority_pair_validation_conflict
    instances:
      - name: superseded_report_state_beats_remittance_fiscal
        grounds:
          - validations[priority=45]
          - validations[priority=62]
          - errors[ERR_REPORT_NOT_REMITTABLE]
          - errors[ERR_REMITTANCE_EXCEEDS_BALANCE]
          - state_machines.ContributionReport.POSTED_to_SUPERSEDED
        distinguishing_aspect: |
          The colliding categories are `state` (priority 45) and `business_fiscal` (priority 62):
          a single remittance both targets a SUPERSEDED report and overshoots its
          outstanding balance, and the response must be ERR_REPORT_NOT_REMITTABLE with HTTP 409,
          never ERR_REMITTANCE_EXCEEDS_BALANCE with HTTP 422.
