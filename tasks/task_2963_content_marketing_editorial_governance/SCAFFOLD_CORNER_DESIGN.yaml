              as: ManagingEditor
              as_user_id: "me-2"
            - call: "GET /editorial/content-items/${item_id}/distributions"
              payload: {}
              as: ManagingEditor
              captures: { dist_id: "$.data[0].id", dist_state_before: "$.data[0].state" }
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00.000Z" }
              as: ManagingEditor
          trigger:
            - call: "POST /editorial/_ops/governance-sweep"
              payload: {}
              as: ManagingEditor
              captures: { a1: $.data.assets_expired, u1: $.data.usages_lapsed, s1: $.data.distributions_suppressed, d1: $.data.distributions_activated, f1: $.data.items_flagged_refresh, c1: $.data.claims_expired, g1: $.data.gates_breached, r1: $.data.campaigns_restricted, z1: $.data.campaigns_frozen }
            - call: "GET /editorial/content-items/${item_id}/distributions"
              payload: {}
              as: ManagingEditor
              captures: { state_after_1: "$.data[0].state", live_at_1: "$.data[0].went_live_at" }
            - call: "POST /editorial/_ops/governance-sweep"
              payload: {}
              as: ManagingEditor
              captures: { a2: $.data.assets_expired, u2: $.data.usages_lapsed, s2: $.data.distributions_suppressed, d2: $.data.distributions_activated, f2: $.data.items_flagged_refresh, c2: $.data.claims_expired, g2: $.data.gates_breached, r2: $.data.campaigns_restricted, z2: $.data.campaigns_frozen }
            - call: "GET /editorial/content-items/${item_id}/distributions"
              payload: {}
