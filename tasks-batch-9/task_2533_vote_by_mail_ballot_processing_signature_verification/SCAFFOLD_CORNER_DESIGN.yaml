# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for task 2533
# Vote-by-Mail Ballot Processing & Signature Verification (county elections office)
#
# Walked from references/claim-extraction-guide.md row-by-row against SCAFFOLD.yaml §1.1-§1.7.
# `section:` values are the guide's nine sections; `claim_type:` values are the guide's table rows.
# Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub
# and no test_recipe.
#
# Shared world used by most recipes (YAML anchors defined at first use, aliased afterwards):
#   election e1  : General Election 2026, election_date 2026-11-03, uocava deadline 2026-09-19,
#                  domestic deadline 2026-10-05, return_deadline_at 2026-11-03T20:00:00Z,
#                  postmark_grace_days 7 (default), cure_window_days 21 (default),
#                  postage_budget_cents 1000000
#   voter v1     : Vera Ames, DEM, domestic (uocava_status NONE), signature_on_file_count 1,
#                  last_signature_update_at 2026-01-05T00:00:00Z
#   reviewer rv1 : Rosa Vidal, DEM, TRAINED, training_completed_at 2026-06-01T00:00:00Z
#                  -> training_expires_at 2027-06-01T00:00:00Z (TRAINING_VALID_DAYS 365)
#   packet pk1   : 28 g domestic MATCH_SAME packet -> packet_postage_cents 141 (73 + 68)
#   logical clock: 2026-09-10T09:00:00Z during mailing, 2026-11-03T12:00:00Z during intake

scaffold_corner_design:

  - section: entities
    instances:

      - name: election_create_returns_declared_fields_and_pre_mail_posture
        claim_type: Creation
        grounds:
          - entities.Election
          - endpoints[POST /vote-by-mail/elections]
          - state_machines.Election.initial_state
          - response_envelope.success
        distinguishing_aspect: "POST /vote-by-mail/elections with only the seven required inputs returns 201 with posture PRE_MAIL, canvass_days 17, postmark_grace_days 7 and cure_window_days 21 supplied by declared defaults, and every computed counter at 0."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-09-10T09:00:00Z."
          setup_api_calls:
            - &c_clock_sep10
              call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: ElectionsAdmin
              captures: { clock_sep10: $.data.current_utc }
          trigger:
            - &c_election
              call: "POST /vote-by-mail/elections"
              payload: { name: "General Election 2026", election_date: "2026-11-03", uocava_send_deadline_date: "2026-09-19", domestic_send_deadline_date: "2026-10-05", return_deadline_at: "2026-11-03T20:00:00Z", postage_budget_cents: 1000000 }
              as: ElectionsAdmin
              captures: { e1: $.data.id }
          assert:
            - "HTTP 201; response_type == \"election\" and meta contains api_request_id and api_request_timestamp"
            - "Election.name == \"General Election 2026\", Election.election_date == \"2026-11-03\", Election.return_deadline_at == \"2026-11-03T20:00:00Z\""
            - "Election.posture == \"PRE_MAIL\" (state_machines.Election.initial_state)"
            - "Election.postmark_grace_days == 7 and Election.cure_window_days == 21 (omitted optional inputs take their declared defaults)"
            - "Election.canvass_days == 17 and Election.reconciliation_status == \"IN_BALANCE\""
            - "Election.packets_mailed_count == 0, envelopes_received_count == 0, countable_envelope_count == 0, attributable_ballot_count == 0, open_cure_count == 0, postage_committed_cents == 0, postage_actual_cents == 0"
            - "Election.separation_run_sequence == 0, Election.canvass_sweep_index == 0, Election.version == 1"

      - name: voter_create_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Voter.fields.registration_status
          - entities.Voter.fields.mailing_address
          - entities.Voter.fields.uocava_status
          - entities.Voter.fields.signature_on_file_count
          - endpoints[POST /vote-by-mail/voters]
        distinguishing_aspect: "Omitting registration_status, mailing_address, uocava_status and signature_on_file_count yields ACTIVE / null / NONE / 1 respectively, and both computed booleans start false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T09:00:00Z; no voters exist."
          setup_api_calls:
            - *c_clock_sep10
          trigger:
            - &c_voter1
              call: "POST /vote-by-mail/voters"
              payload: { full_name: "Vera Ames", party_affiliation: "DEM", residence_address: "11 Ash St, Springfield", last_signature_update_at: "2026-01-05T00:00:00Z" }
              as: ElectionsClerk
              captures: { v1: $.data.id, v1_v: $.data.version }
          assert:
            - "HTTP 201; Voter.registration_status == \"ACTIVE\""
            - "Voter.mailing_address == null and Voter.uocava_status == \"NONE\""
            - "Voter.signature_on_file_count == 1"
            - "Voter.permanent_absentee_active == false and Voter.provisional_ballot_eligible == false"
            - "Voter.version == 1 and Voter.created_at == Voter.updated_at"

      - name: voter_get_returns_stored_registration_record
        claim_type: Retrieval
        grounds:
          - entities.Voter
          - endpoints[GET /vote-by-mail/voters/{id}]
        distinguishing_aspect: "GET /vote-by-mail/voters/{id} echoes exactly the stored row — same id, full_name, party_affiliation, residence_address and last_signature_update_at as the create response — with no field mutation."
        test_recipe:
          setup:
            - "Voter v1 (Vera Ames) created at clock 2026-09-10T09:00:00Z."
          setup_api_calls:
            - *c_clock_sep10
            - *c_voter1
          trigger:
            - call: "GET /vote-by-mail/voters/${v1}"
              payload: {}
              as: ElectionsClerk
          assert:
            - "HTTP 200; response_type == \"voter\""
            - "Voter.id == ${v1} and Voter.full_name == \"Vera Ames\""
            - "Voter.party_affiliation == \"DEM\" and Voter.residence_address == \"11 Ash St, Springfield\""
            - "Voter.last_signature_update_at == \"2026-01-05T00:00:00Z\" and Voter.version == 1"

      - name: reviewer_training_expires_at_computed_as_completion_plus_365_days
        claim_type: Computed Fields
        grounds:
          - entities.Reviewer.fields.training_expires_at
          - calculations.reviewer_assignment_selection.constants.TRAINING_VALID_DAYS
          - endpoints[POST /vote-by-mail/reviewers]
        distinguishing_aspect: "training_expires_at is derived server-side as training_completed_at + 365 days == 2027-06-01T00:00:00Z and is never taken from the request body; both review counters start at 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T09:00:00Z; reviewer trained on 2026-06-01T00:00:00Z."
          setup_api_calls:
            - *c_clock_sep10
          trigger:
            - &c_reviewer1
              call: "POST /vote-by-mail/reviewers"
              payload: { full_name: "Rosa Vidal", party_affiliation: "DEM", training_status: "TRAINED", training_completed_at: "2026-06-01T00:00:00Z", curriculum_version: "SV-2026.1" }
              as: ElectionsAdmin
              captures: { rv1: $.data.id }
          assert:
            - "HTTP 201; Reviewer.training_status == \"TRAINED\""
            - "Reviewer.training_expires_at == \"2027-06-01T00:00:00Z\" (2026-06-01T00:00:00Z + TRAINING_VALID_DAYS 365)"
            - "Reviewer.active_review_count == 0 and Reviewer.completed_review_count == 0"
            - "Reviewer.curriculum_version == \"SV-2026.1\""

      - name: ballot_request_create_opens_pending_address_verification_and_bumps_voter_version
        claim_type: Creation
        grounds:
          - entities.BallotRequest
          - entities.AddressVerification.fields.ballot_request_id
          - endpoints[POST /vote-by-mail/ballot-requests]
          - state_machines.BallotRequest.initial_state
        distinguishing_aspect: "One POST /vote-by-mail/ballot-requests creates exactly one BallotRequest in RECEIVED with forwarding_class UNKNOWN, exactly one PENDING AddressVerification pointing back at it, and drives Voter.version from 1 to 2."
        test_recipe:
          setup:
            - "Election e1 and voter v1 exist; clock 2026-09-10T09:00:00Z; posture PRE_MAIL."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
          trigger:
            - &c_request1
              call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v1}", election_id: "${e1}", request_channel: "ONLINE", delivery_method: "MAIL", expected_voter_version: "${v1_v}" }
              as: ElectionsClerk
              captures: { br1: $.data.id }
            - &c_av1_lookup
              call: "GET /vote-by-mail/address-verifications"
              payload: { ballot_request_id: "${br1}" }
              as: ElectionsClerk
              captures: { av1: "$.data[0].id" }
            - call: "GET /vote-by-mail/voters/${v1}"
              payload: {}
              as: ElectionsClerk
          assert:
            - "HTTP 201; BallotRequest.status == \"RECEIVED\" and BallotRequest.forwarding_class == \"UNKNOWN\""
            - "BallotRequest.permanent_flag == false and BallotRequest.mailing_address_snapshot == null"
            - "GET /vote-by-mail/address-verifications?ballot_request_id=${br1} returns total_count == 1 with data[0].status == \"PENDING\" and data[0].ncoa_result == null"
            - "GET /vote-by-mail/voters/${v1} returns Voter.version == 2 (the request creation bumped the OCC parent)"
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=REQUEST_LOGGED returns total_count == 1 with data[0].ballot_content_disclosed == false"

      - name: ballot_requests_list_paginates_with_limit_offset_and_total_count
        claim_type: Listing
        grounds:
          - endpoints[GET /vote-by-mail/ballot-requests]
          - response_envelope.pagination
        distinguishing_aspect: "With three requests on e1, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and limit=2&offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "Election e1 with three voters v1, v2, v3, each holding one ballot request."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - call: "POST /vote-by-mail/voters"
              payload: { full_name: "Bram Cole", party_affiliation: "REP", residence_address: "22 Birch Rd, Springfield", last_signature_update_at: "2026-02-10T00:00:00Z" }
              as: ElectionsClerk
              captures: { v2: $.data.id, v2_v: $.data.version }
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v2}", election_id: "${e1}", request_channel: "PAPER", delivery_method: "MAIL", expected_voter_version: "${v2_v}" }
              as: ElectionsClerk
              captures: { br2: $.data.id }
            - call: "POST /vote-by-mail/voters"
              payload: { full_name: "Cleo Dunn", party_affiliation: "NPP", residence_address: "33 Cedar Ln, Springfield", last_signature_update_at: "2026-03-15T00:00:00Z" }
              as: ElectionsClerk
              captures: { v3: $.data.id, v3_v: $.data.version }
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v3}", election_id: "${e1}", request_channel: "PHONE", delivery_method: "MAIL", expected_voter_version: "${v3_v}" }
              as: ElectionsClerk
              captures: { br3: $.data.id }
          trigger:
            - call: "GET /vote-by-mail/ballot-requests"
              payload: { election_id: "${e1}", limit: 2, offset: 0 }
              as: ElectionsClerk
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /vote-by-mail/ballot-requests"
              payload: { election_id: "${e1}", limit: 2, offset: 2 }
              as: ElectionsClerk
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "First page: len(data) == 2, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second page: len(data) == 1, total_count == 3, limit == 2, offset == 2, has_more == false"
            - "The three ids across both pages are exactly {${br1}, ${br2}, ${br3}} with no repetition"

      - name: election_get_with_unknown_id_returns_election_not_found
        claim_type: Not Found
        grounds:
          - validations[ERR_ELECTION_NOT_FOUND]
          - endpoints[GET /vote-by-mail/elections/{id}]
        distinguishing_aspect: "A syntactically valid but unpersisted UUID on GET /vote-by-mail/elections/{id} returns 404 ERR_ELECTION_NOT_FOUND, not 400 and not an empty 200 body."
        test_recipe:
          setup:
            - "Election e1 exists so the table is non-empty; the probed id belongs to no row."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
          trigger:
            - call: "GET /vote-by-mail/elections/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: ElectionsClerk
              captures: { nf_err: $.data.error_id }
          assert:
            - "HTTP 404; response_type == \"error\" and data.error_id == \"ERR_ELECTION_NOT_FOUND\""
            - "data.message is a non-empty string and no Election row is created or mutated"

      - name: ballot_request_create_without_delivery_method_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[ERR_INVALID_REQUEST]
          - endpoints[POST /vote-by-mail/ballot-requests]
          - entities.BallotRequest.fields.delivery_method
        distinguishing_aspect: "delivery_method has source input with no default, so omitting it fails at priority 3 with ERR_INVALID_REQUEST before any AddressVerification row is created."
        test_recipe:
          setup:
            - "Election e1 and voter v1 exist; no ballot request yet."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
          trigger:
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v1}", election_id: "${e1}", request_channel: "ONLINE", expected_voter_version: "${v1_v}" }
              as: ElectionsClerk
              captures: { missing_field_err: $.data.error_id }
            - call: "GET /vote-by-mail/address-verifications"
              payload: { status: "PENDING" }
              as: ElectionsClerk
          assert:
            - "HTTP 400; data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /vote-by-mail/ballot-requests?voter_id=${v1} returns total_count == 0"
            - "GET /vote-by-mail/address-verifications returns total_count == 0 — the rejected create wrote nothing"
            - "GET /vote-by-mail/voters/${v1} still returns version == 1 (no OCC bump on a rejected write)"

      - name: ballot_request_create_with_unknown_delivery_method_enum_is_rejected
        claim_type: Type Constraints
        grounds:
          - validations[ERR_INVALID_REQUEST]
          - entities.BallotRequest.fields.delivery_method
        distinguishing_aspect: "delivery_method accepts only MAIL or EMAIL_UOCAVA; the out-of-set value \"FAX\" is rejected with ERR_INVALID_REQUEST at priority 3, ahead of the priority-9 eligibility rule."
        test_recipe:
          setup:
            - "Election e1 and voter v1 (uocava_status NONE) exist."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
          trigger:
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v1}", election_id: "${e1}", request_channel: "ONLINE", delivery_method: "FAX", expected_voter_version: "${v1_v}" }
              as: ElectionsClerk
              captures: { bad_enum_err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == \"ERR_INVALID_REQUEST\" (not ERR_DELIVERY_METHOD_NOT_ELIGIBLE)"
            - "GET /vote-by-mail/ballot-requests?voter_id=${v1} returns total_count == 0"

      - name: ballot_request_create_with_unknown_voter_returns_voter_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[ERR_VOTER_NOT_FOUND]
          - entities.BallotRequest.fields.voter_id
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology validates the voter_id foreign key on write: an unpersisted voter_id returns 404 ERR_VOTER_NOT_FOUND at priority 4, before the priority-5 OCC check on expected_voter_version."
        test_recipe:
          setup:
            - "Election e1 and voter v1 exist; the payload names a different, unpersisted voter id."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
          trigger:
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "11111111-1111-4111-8111-111111111111", election_id: "${e1}", request_channel: "ONLINE", delivery_method: "MAIL", expected_voter_version: "${v1_v}" }
              as: ElectionsClerk
              captures: { fk_err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == \"ERR_VOTER_NOT_FOUND\" (not ERR_STALE_VOTER_VERSION)"
            - "GET /vote-by-mail/ballot-requests returns total_count == 0"

      - name: envelope_intake_stamps_system_fields_from_the_logical_clock
        claim_type: System Fields
        grounds:
          - entities.ReturnEnvelope.fields.received_at
          - entities.ReturnEnvelope.fields.signature_status
          - entities.ReturnEnvelope.fields.custody_status
          - entities.ReturnEnvelope.fields.challenge_status
          - endpoints[POST /vote-by-mail/return-envelopes]
        distinguishing_aspect: "received_at is stamped from the logical clock (2026-11-03T12:00:00Z) rather than supplied by the client, and the three system-owned status dimensions start UNVERIFIED / SEALED / NONE with remade_from_envelope_id null."
        test_recipe:
          setup:
            - "Election e1 in MAILING posture with one dispatched 28 g domestic packet pk1 for voter v1; logical clock advanced to 2026-11-03T12:00:00Z, which is before return_deadline_at 2026-11-03T20:00:00Z."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
            - &c_av1_same
              call: "POST /vote-by-mail/address-verifications/${av1}/results"
              payload: { ncoa_result: "MATCH_SAME" }
              as: ElectionsClerk
            - &c_approve1
              call: "POST /vote-by-mail/ballot-requests/${br1}/approve"
              payload: {}
              as: ElectionsClerk
            - &c_batch1
              call: "POST /vote-by-mail/mailing-batches"
              payload: { election_id: "${e1}", batch_type: "DOMESTIC_INITIAL", scheduled_send_date: "2026-09-25" }
              as: ElectionsClerk
              captures: { mb1: $.data.id }
            - &c_packet1
              call: "POST /vote-by-mail/mailing-batches/${mb1}/packets"
              payload: { ballot_request_id: "${br1}", packet_weight_grams: 28 }
              as: ElectionsClerk
              captures: { pk1: $.data.id }
            - &c_seal1
              call: "POST /vote-by-mail/mailing-batches/${mb1}/seal"
              payload: {}
              as: ElectionsClerk
            - &c_dispatch1
              call: "POST /vote-by-mail/mailing-batches/${mb1}/dispatch"
              payload: {}
              as: ElectionsClerk
            - &c_clock_nov3
              call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T12:00:00Z" }
              as: ElectionsAdmin
              captures: { clock_nov3: $.data.current_utc }
          trigger:
            - &c_envelope1
              call: "POST /vote-by-mail/return-envelopes"
              payload: { ballot_packet_id: "${pk1}", intake_channel: "DROPBOX" }
              as: ElectionsClerk
              captures: { en1: $.data.id, en1_v: $.data.version }
          assert:
            - "HTTP 201; ReturnEnvelope.received_at == \"2026-11-03T12:00:00Z\" (logical clock, not wall clock)"
            - "ReturnEnvelope.signature_status == \"UNVERIFIED\", custody_status == \"SEALED\", challenge_status == \"NONE\""
            - "ReturnEnvelope.remade_from_envelope_id == null and ReturnEnvelope.separation_run_sequence == null"
            - "ReturnEnvelope.preliminary_timeliness == \"TIMELY\" (DROPBOX intake at or before return_deadline_at) and final_timeliness == null"
            - "ReturnEnvelope.review_round_count == 0, resolved_signature_confidence == null, version == 1"
            - "GET /vote-by-mail/ballot-packets/${pk1} returns status == \"RETURNED\" and GET /vote-by-mail/elections/${e1} returns posture == \"RECEIVING\", envelopes_received_count == 1"

      - name: cure_evidence_row_is_immutable_with_no_version_and_no_write_back_endpoint
        claim_type: Immutability
        grounds:
          - entities.CureEvidence
          - endpoints[POST /vote-by-mail/cure-notices/{id}/evidence]
          - endpoints[GET /vote-by-mail/cure-evidence/{id}]
        distinguishing_aspect: "CureEvidence is declared common_fields: false — the retrieved row carries no version and no updated_at field, and §1.5 exposes no PUT, PATCH or DELETE for it; only the CanvassSupervisor's adjudication can flip its computed accepted flag."
        test_recipe:
          setup:
            - "Envelope en1 driven to CURE_REQUIRED by a MISSING_SIGNATURE decision, a cure notice cn1 issued, and one evidence row submitted at clock 2026-11-03T12:00:00Z."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_reviewer1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
            - &c_review1
              call: "POST /vote-by-mail/return-envelopes/${en1}/signature-reviews"
              payload: {}
              as: ElectionsClerk
              captures: { sr1: $.data.id }
            - &c_decision_missing
              call: "POST /vote-by-mail/signature-reviews/${sr1}/decision"
              payload: { decision: "MISSING_SIGNATURE", notes: "no signature in the signature box" }
              as: SignatureReviewer
              as_user_id: "${rv1}"
            - &c_cure1
              call: "POST /vote-by-mail/return-envelopes/${en1}/cure-notices"
              payload: {}
              as: ElectionsClerk
              captures: { cn1: $.data.id }
          trigger:
            - &c_evidence1
              call: "POST /vote-by-mail/cure-notices/${cn1}/evidence"
              payload: { evidence_type: "SIGNED_AFFIDAVIT", submission_channel: "MAIL", affirmation_signed: true }
              as: ElectionsClerk
              captures: { ce1: $.data.id }
            - call: "GET /vote-by-mail/cure-evidence/${ce1}"
              payload: {}
              as: ElectionsClerk
          assert:
            - "HTTP 201; CureEvidence.cure_notice_id == ${cn1}, evidence_type == \"SIGNED_AFFIDAVIT\", submission_channel == \"MAIL\", affirmation_signed == true"
            - "CureEvidence.received_at == \"2026-11-03T12:00:00Z\" and CureEvidence.accepted == null and CureEvidence.deficiency_reason_code == null"
            - "The GET /vote-by-mail/cure-evidence/${ce1} body contains no \"version\" key and no \"updated_at\" key (common_fields: false)"
            - "§1.5 declares no PUT, PATCH or DELETE route under /vote-by-mail/cure-evidence — the row can only be superseded by submitting another evidence row"
            - "GET /vote-by-mail/cure-notices/${cn1} returns status == \"UNDER_EVIDENCE_REVIEW\" and evidence_submission_count == 1"

  - section: state_machines
    instances:

      - name: address_result_match_same_clears_the_request_and_stamps_same_address
        claim_type: Valid Transition
        grounds:
          - state_machines.AddressVerification.transitions.PENDING_to_CLEARED
          - state_machines.BallotRequest.transitions.RECEIVED_to_ADDRESS_CLEARED
          - endpoints[POST /vote-by-mail/address-verifications/{id}/results]
        distinguishing_aspect: "ncoa_result MATCH_SAME drives AddressVerification PENDING -> CLEARED with evaluated_at stamped from the logical clock and, in the same request, BallotRequest RECEIVED -> ADDRESS_CLEARED with forwarding_class SAME_ADDRESS and mailing_address_snapshot left null."
        test_recipe:
          setup:
            - "Election e1 in PRE_MAIL, voter v1, ballot request br1 in RECEIVED with its PENDING verification av1; clock 2026-09-10T09:00:00Z."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
          trigger:
            - *c_av1_same
            - call: "GET /vote-by-mail/ballot-requests/${br1}"
              payload: {}
              as: ElectionsClerk
          assert:
            - "HTTP 200; AddressVerification.status == \"CLEARED\" and AddressVerification.evaluated_at == \"2026-09-10T09:00:00Z\""
            - "BallotRequest.status == \"ADDRESS_CLEARED\" and BallotRequest.forwarding_class == \"SAME_ADDRESS\""
            - "BallotRequest.mailing_address_snapshot == null (only MATCH_FORWARDABLE snapshots an address)"
            - "GET /vote-by-mail/voters/${v1} returns permanent_absentee_active == false — no enrollment cascade on a cleared address"

      - name: approve_from_received_returns_request_state_invalid
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.BallotRequest.transitions.ADDRESS_CLEARED_to_APPROVED
          - validations[ERR_REQUEST_STATE_INVALID]
          - endpoints[POST /vote-by-mail/ballot-requests/{id}/approve]
        distinguishing_aspect: "approve requires status == ADDRESS_CLEARED; on a request still in RECEIVED it returns 409 ERR_REQUEST_STATE_INVALID and no PermanentAbsenteeEnrollment is created."
        test_recipe:
          setup:
            - "Ballot request br1 in RECEIVED — its address verification av1 is still PENDING."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
          trigger:
            - call: "POST /vote-by-mail/ballot-requests/${br1}/approve"
              payload: {}
              as: ElectionsClerk
              captures: { approve_err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == \"ERR_REQUEST_STATE_INVALID\""
            - "GET /vote-by-mail/ballot-requests/${br1} still returns status == \"RECEIVED\""
            - "GET /vote-by-mail/permanent-absentee-enrollments?voter_id=${v1} returns total_count == 0"
            - "GET /vote-by-mail/address-verifications/${av1} still returns status == \"PENDING\""

      - name: mailing_batch_starts_in_draft_with_derived_required_send_by_date
        claim_type: Initial State
        grounds:
          - state_machines.MailingBatch.initial_state
          - entities.MailingBatch.fields.required_send_by_date
          - endpoints[POST /vote-by-mail/mailing-batches]
        distinguishing_aspect: "A new DOMESTIC_INITIAL batch starts in DRAFT with packet_count 0, estimated_postage_cents 0, actual_postage_cents null and required_send_by_date copied from election.domestic_send_deadline_date == 2026-10-05, not from uocava_send_deadline_date."
        test_recipe:
          setup:
            - "Election e1 in PRE_MAIL; clock 2026-09-10T09:00:00Z; no batches yet."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
          trigger:
            - *c_batch1
          assert:
            - "HTTP 201; MailingBatch.status == \"DRAFT\" and MailingBatch.batch_type == \"DOMESTIC_INITIAL\""
            - "MailingBatch.required_send_by_date == \"2026-10-05\" (domestic deadline, not the 2026-09-19 UOCAVA deadline)"
            - "MailingBatch.packet_count == 0, estimated_postage_cents == 0, actual_postage_cents == null"
            - "MailingBatch.sealed_at == null and MailingBatch.dispatched_at == null"
            - "GET /vote-by-mail/elections/${e1} returns postage_committed_cents == 0 — creating a batch commits nothing"

      - name: packet_undeliverable_recomputes_election_accountability_counters
        claim_type: Side Effect Execution
        grounds:
          - state_machines.BallotPacket.transitions.MAILED_to_UNDELIVERABLE
          - calculations.ballot_accountability_reconciliation
          - endpoints[POST /vote-by-mail/ballot-packets/{id}/undeliverable]
        distinguishing_aspect: "Logging pk1 undeliverable moves it MAILED -> UNDELIVERABLE, shifts the election counters to undeliverable_packet_count 1 / outstanding_packet_count 0 while packets_mailed_count stays 1, keeps accountability_delta at 0, and appends exactly one PACKET_UNDELIVERABLE log entry."
        test_recipe:
          setup:
            - "Election e1 in MAILING with one dispatched 28 g packet pk1 in MAILED; voter v1 holds no permanent absentee enrollment."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
          trigger:
            - call: "POST /vote-by-mail/ballot-packets/${pk1}/undeliverable"
              payload: { undeliverable_reason_code: "NO_SUCH_ADDRESS" }
              as: ElectionsClerk
            - call: "GET /vote-by-mail/elections/${e1}/accountability"
              payload: {}
              as: ElectionsClerk
          assert:
            - "HTTP 200; BallotPacket.status == \"UNDELIVERABLE\" and BallotPacket.undeliverable_reason_code == \"NO_SUCH_ADDRESS\""
            - "accountability: packets_mailed_count == 1, undeliverable_packet_count == 1, outstanding_packet_count == 0, returned_packet_count == 0"
            - "accountability: accountability_delta == 0 and reconciliation_status == \"IN_BALANCE\""
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=PACKET_UNDELIVERABLE returns total_count == 1"
            - "GET /vote-by-mail/permanent-absentee-enrollments?voter_id=${v1} returns total_count == 0 — no enrollment exists to suspend"

      - name: second_dispatch_of_the_same_batch_returns_batch_state_invalid
        claim_type: Idempotency
        grounds:
          - state_machines.MailingBatch.transitions.SEALED_to_DISPATCHED
          - validations[ERR_BATCH_STATE_INVALID]
          - endpoints[POST /vote-by-mail/mailing-batches/{id}/dispatch]
        distinguishing_aspect: "Re-dispatching an already DISPATCHED batch returns 409 ERR_BATCH_STATE_INVALID and leaves dispatched_at, actual_postage_cents 141 and Election.postage_actual_cents 141 untouched — the postage is never added twice."
        test_recipe:
          setup:
            - "Batch mb1 dispatched once at clock 2026-09-10T09:00:00Z with a single 28 g domestic packet (packet_postage_cents 141)."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
          trigger:
            - call: "POST /vote-by-mail/mailing-batches/${mb1}/dispatch"
              payload: {}
              as: ElectionsClerk
              captures: { redispatch_err: $.data.error_id }
            - call: "GET /vote-by-mail/elections/${e1}/accountability"
              payload: {}
              as: ElectionsClerk
          assert:
            - "HTTP 409; data.error_id == \"ERR_BATCH_STATE_INVALID\""
            - "GET /vote-by-mail/mailing-batches/${mb1} returns status == \"DISPATCHED\", actual_postage_cents == 141 and dispatched_at == \"2026-09-10T09:00:00Z\""
            - "accountability: postage_actual_cents == 141 and packets_mailed_count == 1"
            - "GET /vote-by-mail/ballot-packets/${pk1} returns status == \"MAILED\" with mailed_at == \"2026-09-10T09:00:00Z\""

      - name: certified_election_refuses_further_child_writes_and_further_advances
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Election.terminal_states
          - state_machines.Election.transitions.CANVASS_LOCKED_to_CERTIFIED
          - validations[ERR_ELECTION_POSTURE_FORBIDS]
          - endpoints[POST /vote-by-mail/elections/{id}/posture-advance]
        distinguishing_aspect: "An election with no children walks PRE_MAIL -> MAILING -> RECEIVING -> CANVASS_LOCKED -> CERTIFIED; from CERTIFIED both a new mailing batch and a repeat posture-advance return 409 ERR_ELECTION_POSTURE_FORBIDS and the posture stays CERTIFIED."
        test_recipe:
          setup:
            - "A second election e2 (Special Election 2026) with no batches, no envelopes and no cure notices, advanced explicitly to CERTIFIED (reconciliation_status IN_BALANCE, open_cure_count 0, zero challenged envelopes)."
          setup_api_calls:
            - *c_clock_sep10
            - call: "POST /vote-by-mail/elections"
              payload: { name: "Special Election 2026", election_date: "2026-11-03", uocava_send_deadline_date: "2026-09-19", domestic_send_deadline_date: "2026-10-05", return_deadline_at: "2026-11-03T20:00:00Z", postage_budget_cents: 500000 }
              as: ElectionsAdmin
              captures: { e2: $.data.id }
            - call: "POST /vote-by-mail/elections/${e2}/posture-advance"
              payload: { target_posture: "MAILING" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/elections/${e2}/posture-advance"
              payload: { target_posture: "RECEIVING" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/elections/${e2}/posture-advance"
              payload: { target_posture: "CANVASS_LOCKED" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/elections/${e2}/posture-advance"
              payload: { target_posture: "CERTIFIED" }
              as: ElectionsAdmin
          trigger:
            - call: "POST /vote-by-mail/mailing-batches"
              payload: { election_id: "${e2}", batch_type: "SUPPLEMENTAL", scheduled_send_date: "2026-09-28" }
              as: ElectionsClerk
              captures: { locked_batch_err: $.data.error_id }
            - call: "POST /vote-by-mail/elections/${e2}/posture-advance"
              payload: { target_posture: "CERTIFIED" }
              as: ElectionsAdmin
              captures: { locked_advance_err: $.data.error_id }
          assert:
            - "Batch creation: HTTP 409 with data.error_id == \"ERR_ELECTION_POSTURE_FORBIDS\""
            - "Repeat advance: HTTP 409 with data.error_id == \"ERR_ELECTION_POSTURE_FORBIDS\" — CERTIFIED has no outgoing transition"
            - "GET /vote-by-mail/elections/${e2} returns posture == \"CERTIFIED\""
            - "GET /vote-by-mail/mailing-batches?election_id=${e2} returns total_count == 0"
            - "GET /vote-by-mail/transparency-log?election_id=${e2}&event_type=POSTURE_CHANGED returns total_count == 4"

      - name: cure_notice_adjudicate_from_issued_returns_cure_state_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CureNotice.transitions.UNDER_EVIDENCE_REVIEW_to_CURED
          - validations[ERR_CURE_STATE_INVALID]
          - endpoints[POST /vote-by-mail/cure-notices/{id}/adjudicate]
        distinguishing_aspect: "adjudicate is declared only from UNDER_EVIDENCE_REVIEW; fired on a notice still in ISSUED (no evidence submitted) it returns 409 ERR_CURE_STATE_INVALID, and the envelope stays CURE_REQUIRED with Election.open_cure_count still 1."
        test_recipe:
          setup:
            - "Envelope en1 in CURE_REQUIRED after a MISSING_SIGNATURE decision; cure notice cn1 in ISSUED with no evidence rows."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_reviewer1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
            - *c_review1
            - *c_decision_missing
            - *c_cure1
          trigger:
            - call: "POST /vote-by-mail/cure-notices/${cn1}/adjudicate"
              payload: { outcome: "CURE" }
              as: CanvassSupervisor
              captures: { cure_state_err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == \"ERR_CURE_STATE_INVALID\""
            - "GET /vote-by-mail/cure-notices/${cn1} returns status == \"ISSUED\", evidence_submission_count == 0, deficiency_count == 0, resolved_at == null"
            - "GET /vote-by-mail/return-envelopes/${en1} returns signature_status == \"CURE_REQUIRED\""
            - "GET /vote-by-mail/elections/${e1} returns open_cure_count == 1"
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=CURE_ADJUDICATED returns total_count == 0"

      - name: observer_check_in_before_the_window_opens_returns_window_not_active
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ObserverAccessSession.transitions.SCHEDULED_to_CHECKED_IN
          - validations[ERR_OBSERVER_WINDOW_NOT_ACTIVE]
          - endpoints[POST /vote-by-mail/observer-sessions/{id}/check-in]
        distinguishing_aspect: "Check-in demands window_start_at <= now < window_end_at; at clock 2026-09-10T09:00:00Z against a window starting 2026-11-03T14:00:00Z it returns 422 ERR_OBSERVER_WINDOW_NOT_ACTIVE and the session stays SCHEDULED."
        test_recipe:
          setup:
            - "Election e1 with a scheduled DEM observer session os1 for station INTAKE over the half-open window [2026-11-03T14:00:00Z, 2026-11-03T16:00:00Z); clock still 2026-09-10T09:00:00Z."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - &c_session_dem
              call: "POST /vote-by-mail/elections/${e1}/observer-sessions"
              payload: { observer_user_id: "obs-dem-1", observer_name: "Dana Ortiz", organization: "County DEM Committee", party_affiliation: "DEM", station_area: "INTAKE", window_start_at: "2026-11-03T14:00:00Z", window_end_at: "2026-11-03T16:00:00Z" }
              as: ElectionsClerk
              captures: { os1: $.data.id }
          trigger:
            - call: "POST /vote-by-mail/observer-sessions/${os1}/check-in"
              payload: {}
              as: Observer
              as_user_id: "obs-dem-1"
              captures: { window_err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == \"ERR_OBSERVER_WINDOW_NOT_ACTIVE\""
            - "GET /vote-by-mail/observer-sessions/${os1} returns status == \"SCHEDULED\""
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=OBSERVER_SESSION_OPENED returns total_count == 0"

      - name: remake_completion_voids_the_assigned_review_and_supersedes_the_original
        claim_type: Cross-entity
        grounds:
          - state_machines.SignatureReview.transitions.ASSIGNED_to_VOIDED
          - state_machines.ReturnEnvelope.transitions.SEALED_to_SUPERSEDED_BY_REMAKE
          - state_machines.RemakeRecord.transitions.OPEN_to_COMPLETED
          - endpoints[POST /vote-by-mail/remake-records/{id}/complete]
        distinguishing_aspect: "Completing remake rk1 while sr1 is still ASSIGNED drives sr1 to VOIDED and decrements Reviewer rv1.active_review_count from 1 back to 0 without touching completed_review_count, while the original envelope becomes SUPERSEDED_BY_REMAKE and a replacement envelope carrying remade_from_envelope_id == ${en1} is minted."
        test_recipe:
          setup:
            - "Envelope en1 in PENDING_REVIEW with review sr1 ASSIGNED to reviewer rv1 (created first, so the selector picks it); bipartisan remake team rvB (REP) + rvC (DEM), neither of whom reviewed en1; remake rk1 OPEN over the session [2026-11-03T13:00:00Z, 2026-11-03T14:00:00Z]."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_reviewer1
            - &c_reviewer_b
              call: "POST /vote-by-mail/reviewers"
              payload: { full_name: "Bo Reyes", party_affiliation: "REP", training_status: "TRAINED", training_completed_at: "2026-06-02T00:00:00Z", curriculum_version: "SV-2026.1" }
              as: ElectionsAdmin
              captures: { rvB: $.data.id }
            - &c_reviewer_c
              call: "POST /vote-by-mail/reviewers"
              payload: { full_name: "Cass Dole", party_affiliation: "DEM", training_status: "TRAINED", training_completed_at: "2026-06-03T00:00:00Z", curriculum_version: "SV-2026.1" }
              as: ElectionsAdmin
              captures: { rvC: $.data.id }
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
            - *c_review1
            - &c_envelope1_reread
              call: "GET /vote-by-mail/return-envelopes/${en1}"
              payload: {}
              as: ElectionsClerk
              captures: { en1_v2: $.data.version }
            - &c_remake1
              call: "POST /vote-by-mail/return-envelopes/${en1}/remakes"
              payload: { team_member_a_reviewer_id: "${rvB}", team_member_b_reviewer_id: "${rvC}", reason_code: "DAMAGED", session_start_at: "2026-11-03T13:00:00Z", session_end_at: "2026-11-03T14:00:00Z", expected_envelope_version: "${en1_v2}" }
              as: CanvassSupervisor
              captures: { rk1: $.data.id }
          trigger:
            - call: "POST /vote-by-mail/remake-records/${rk1}/complete"
              payload: { remade_serial: "RM-0001" }
              as: CanvassSupervisor
              captures: { rk1_replacement: $.data.remade_envelope_id }
            - call: "GET /vote-by-mail/signature-reviews/${sr1}"
              payload: {}
              as: CanvassSupervisor
            - call: "GET /vote-by-mail/reviewers/${rv1}"
              payload: {}
              as: CanvassSupervisor
          assert:
            - "HTTP 200; RemakeRecord.status == \"COMPLETED\", remade_serial == \"RM-0001\", completed_at == \"2026-11-03T12:00:00Z\", remade_envelope_id != null"
            - "SignatureReview ${sr1}.status == \"VOIDED\" with submitted_at == null and decision == null"
            - "Reviewer ${rv1}.active_review_count == 0 and completed_review_count == 0 (a voided review is not a completed one)"
            - "GET /vote-by-mail/return-envelopes/${en1} returns custody_status == \"SUPERSEDED_BY_REMAKE\""
            - "GET /vote-by-mail/return-envelopes?remade_from_envelope_id=${en1} returns total_count == 1 with data[0].id == ${rk1_replacement} and data[0].custody_status == \"SEALED\""
            - "GET /vote-by-mail/elections/${e1}/accountability returns attributable_ballot_count == 1 — the replacement takes the original's place, it does not add to it"
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=REMAKE_COMPLETED returns total_count == 1"

      - name: remake_void_from_open_leaves_the_original_envelope_and_review_untouched
        claim_type: Valid Transition
        grounds:
          - state_machines.RemakeRecord.transitions.OPEN_to_VOIDED
          - endpoints[POST /vote-by-mail/remake-records/{id}/void]
        distinguishing_aspect: "Voiding a remake that never COMPLETED runs no compensation: remade_envelope_id and completed_at stay null, the original envelope stays SEALED with its ASSIGNED review intact, and no replacement envelope is ever minted."
        test_recipe:
          setup:
            - "Remake rk1 OPEN on envelope en1 (still SEALED, review sr1 ASSIGNED to rv1)."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_reviewer1
            - *c_reviewer_b
            - *c_reviewer_c
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
            - *c_review1
            - *c_envelope1_reread
            - *c_remake1
          trigger:
            - call: "POST /vote-by-mail/remake-records/${rk1}/void"
              payload: { voided_reason_code: "OPENED_IN_ERROR" }
              as: CanvassSupervisor
          assert:
            - "HTTP 200; RemakeRecord.status == \"VOIDED\", voided_reason_code == \"OPENED_IN_ERROR\", remade_envelope_id == null, completed_at == null"
            - "GET /vote-by-mail/return-envelopes/${en1} returns custody_status == \"SEALED\" and signature_status == \"PENDING_REVIEW\""
            - "GET /vote-by-mail/signature-reviews/${sr1} returns status == \"ASSIGNED\""
            - "GET /vote-by-mail/return-envelopes?remade_from_envelope_id=${en1} returns total_count == 0"
            - "GET /vote-by-mail/elections/${e1}/accountability returns attributable_ballot_count == 1 (unchanged)"
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=REMAKE_VOIDED returns total_count == 1"

      - name: return_envelope_parallel_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.ReturnEnvelope.transitions.NONE_to_CHALLENGED
          - entities.ReturnEnvelope.fields.custody_status
          - entities.ReturnEnvelope.fields.challenge_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / return_envelope_three_parallel_state_dimensions
          rationale: "The named §1.8 instance drives all three ReturnEnvelope dimensions (signature, custody, challenge) and asserts the combined state after each independent move."

      - name: cure_notice_loops_issued_to_under_review_and_back
        claim_type: cyclic
        grounds:
          - state_machines.CureNotice.transitions.UNDER_EVIDENCE_REVIEW_to_ISSUED
          - entities.CureNotice.fields.deficiency_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / cure_notice_evidence_deficiency_cycle
          rationale: "The named §1.8 instance runs two DEFICIENT loops and asserts deficiency_count, evidence_submission_count and the frozen cure_deadline_at across the cycle."

      - name: batch_dispatch_cascades_to_packets_requests_and_election_posture
        claim_type: Cascade down
        grounds:
          - state_machines.BallotPacket.transitions.QUEUED_to_MAILED
          - state_machines.BallotRequest.transitions.APPROVED_to_MAILED
          - state_machines.Election.transitions.PRE_MAIL_to_MAILING
        excluded_because:
          difficulty_instance: transitive_cascade / batch_dispatch_packet_request_election_chain
          rationale: "The named §1.8 instance asserts every link of the dispatch cascade end-to-end, including the auto-advance of the election posture."

      - name: address_failure_suspends_enrollment_and_clears_the_voter_flag
        claim_type: Conditional cascade
        grounds:
          - state_machines.PermanentAbsenteeEnrollment.transitions.ACTIVE_to_SUSPENDED
          - state_machines.BallotRequest.transitions.RECEIVED_to_ADDRESS_HOLD
        excluded_because:
          difficulty_instance: transitive_cascade / address_failure_enrollment_suspension_voter_flag_chain
          rationale: "The named §1.8 instance asserts the threshold-gated suspension cascade and the Voter.permanent_absentee_active flip, including the no-op first failure."

      - name: envelope_intake_is_guarded_by_the_election_posture
        claim_type: guarded transitions
        grounds:
          - state_machines.BallotPacket.transitions.MAILED_to_RETURNED
          - validations[ERR_ELECTION_POSTURE_FORBIDS]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / envelope_intake_gated_by_election_posture
          rationale: "The named §1.8 instance tests intake on both sides of the CANVASS_LOCKED guard with the packet held in an otherwise valid state."

      - name: remake_void_after_completion_reverses_every_side_effect
        claim_type: Compensation
        grounds:
          - state_machines.RemakeRecord.transitions.COMPLETED_to_VOIDED
          - state_machines.ReturnEnvelope.transitions.SUPERSEDED_BY_REMAKE_to_SEALED
          - calculations.ballot_countability_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / attributable_ballot_count_conserved_across_remake_complete_then_void
          rationale: "The named §1.8 instance asserts the conserved attributable_ballot_count and every reversed side effect after complete-then-void."

  - section: calculations
    instances:

      - name: postage_tier_boundaries_at_28_57_85_and_86_grams
        claim_type: Correct Result
        grounds:
