scenario: "1021. Olive-Oil & Vinegar Tasting Shop: SKU & tasting-bar, fusti/refill & bottle, blend/gift set, subscription, freshness/harvest-date, wholesale, allergen, inventory"
domain_name: "olive-oil-vinegar-tasting-shop"
api_prefix: "/api"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "derived_field_reconciliation"
    - "selector_policy"
    - "optimistic_concurrency"

  entity_topology: graph
  # Product<->Product self-referential many-to-many via ProductComponent (gift sets / blends);
  # peer entities (Order, Fusti, Reservation, TastingSession) linked by explicit foreign keys,
  # no nesting-by-ownership in URL paths beyond reverse-reachability sub-resources.

  state_machine_shape: parallel
  # Order carries two independent axes (payment_status x fulfillment_status). WholesaleAccount
  # and Subscription are cyclic; Fusti is compound/guarded with auto-transitions.

  relationship_patterns:
    - self_referential      # ProductComponent: Product references Product
    - many_to_many          # gift set <-> member products
    - cross_aggregate       # Reservation bridges Order and Fusti; Order gates on WholesaleAccount/Fusti state

  role_model: peer_roles
  # Customer owns Member-scoped resources; ShopStaff / InventoryManager / WholesaleApprover own
  # disjoint operational surfaces; PlatformAdmin is the opaque superset operator.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique login/email of the customer."
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Display name."
      - name: member_type
        type: enum
        source: computed
        description: "RETAIL by default; flips to WHOLESALE when one of the member's WholesaleAccounts reaches APPROVED, and back to RETAIL if every WholesaleAccount is SUSPENDED/REJECTED."
        default: "RETAIL"
        constraints: "enum: RETAIL, WHOLESALE"
      - name: allergen_restrictions
        type: array
        source: input
        description: "Allergen tags the member cannot be served; each order line's product allergens are checked against this set."
        default: "[]"
        constraints: "items in enum: TREE_NUT, SULFITES"
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: "Store-credit balance in cents. Debited when an order is paid with use_wallet_credit; credited on cancellation refunds. Never negative."
        default: 0
        constraints: ">= 0"
      - name: loyalty_points
        type: integer
        source: computed
        description: "Loyalty points; accrued on order fulfillment, reversed on a fulfilled order's return-cancel."
        default: 0
        constraints: ">= 0"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Stock-keeping unit code."
        constraints: "unique; non-empty"
      - name: name
        type: string
        source: input
        description: "Product display name."
      - name: product_type
        type: enum
        source: input
        description: "Catalog classification; governs allowed order line_type and whether the product draws from a Fusti."
        constraints: "enum: BULK_OIL, BULK_VINEGAR, BOTTLE, ACCESSORY, GIFT_SET, BLEND"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Per-unit price for BOTTLE/ACCESSORY (UNIT lines) and per-component reference price used by BUNDLE pricing."
        default: 0
        constraints: ">= 0"
      - name: price_per_ml_cents
        type: number
        source: input
        description: "Price per millilitre in cents (may be fractional) for BULK_OIL/BULK_VINEGAR REFILL lines."
        default: 0
        constraints: ">= 0"
      - name: allergens
        type: array
        source: input
        description: "Allergen tags declared on this product."
        default: "[]"
        constraints: "items in enum: TREE_NUT, SULFITES"
      - name: shelf_life_days
        type: integer
        source: input
        description: "Days from harvest_date to best_by_date for BULK products; 0 for non-bulk."
        default: 0
        constraints: ">= 0"

  - name: ProductComponent
    parent: null
    common_fields: false
    fields:
      - name: set_product_id
        type: string
        source: input
        description: "FK -> Product.id; the GIFT_SET or BLEND product this component belongs to."
      - name: component_product_id
        type: string
        source: input
        description: "FK -> Product.id; the member product included in the set. Must not itself be a GIFT_SET/BLEND."
      - name: quantity
        type: integer
        source: input
        description: "Count of the component product bundled into one set."
        constraints: ">= 1"

  - name: Fusti
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the BULK_OIL/BULK_VINEGAR batch this vessel dispenses."
      - name: capacity_ml
        type: integer
        source: input
        description: "Physical vessel capacity in millilitres."
        constraints: ">= 1"
      - name: current_volume_ml
        type: integer
        source: computed
        description: "Physical volume presently in the vessel. Decremented only when a Reservation is COMMITTED; refilled to capacity on replenishment receive. Never negative."
        constraints: ">= 0"
      - name: reserved_volume_ml
        type: integer
        source: computed
        description: "Sum of volume_ml over this fusti's HELD Reservations. Incremented on reserve (order pay), decremented on commit (fulfill) and release (cancel)."
        default: 0
        constraints: ">= 0"
      - name: available_volume_ml
        type: integer
        source: computed
        description: "Derived: current_volume_ml - reserved_volume_ml. The volume a new reservation may draw."
      - name: reorder_point_ml
        type: integer
        source: input
        description: "When current_volume_ml <= reorder_point_ml after a commit, the fusti auto-transitions to LOW and a ReplenishmentOrder is created."
        constraints: ">= 0"
      - name: harvest_date
        type: datetime
        source: input
        description: "Harvest/crush date of the batch (ISO 8601 UTC)."
      - name: best_by_date
        type: datetime
        source: computed
        description: "Derived: harvest_date + Product.shelf_life_days."
      - name: first_draw_at
        type: datetime
        source: computed
        description: "Clock time of the first COMMITTED draw from this batch; null until first commit. Starts the sensory decay curve. Reset to null on replenishment receive."
        default: "null"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle/inventory posture of the vessel."
        default: "IN_SERVICE"
        constraints: "enum: IN_SERVICE, LOW, QUARANTINED, EMPTY, RETIRED"
      - name: label_freshness_score
        type: number
        source: computed
        description: "Variant A freshness (label method): round(max(0, 100 * (1 - elapsed_days/shelf_life_days)), 2) where elapsed_days = (clock_now - harvest_date) in days. Forward-looking straight-line interpolation to best_by_date."
      - name: sensory_freshness_score
        type: number
        source: computed
        description: "Variant B freshness (sensory method): equals label_freshness_score while first_draw_at is null; once opened, round(max(0, label_at_open - OPEN_DECAY_PER_DAY * days_open), 2) where label_at_open uses elapsed at first_draw_at and days_open = (clock_now - first_draw_at) in days. Chronological accelerated decay from the open event."
      - name: is_past_best_by
        type: boolean
        source: computed
        description: "Derived: clock_now >= best_by_date."

  - name: ReplenishmentOrder
    parent: null
    common_fields: true
    fields:
      - name: fusti_id
        type: string
        source: computed
        description: "FK -> Fusti.id; the vessel to be refilled. Set when auto-created by the LOW/EMPTY cascade."
      - name: product_id
        type: string
        source: computed
        description: "FK -> Product.id; copied from the fusti's product at creation."
      - name: requested_volume_ml
        type: integer
        source: computed
        description: "capacity_ml - current_volume_ml at the moment the fusti crossed the reorder point."
        constraints: ">= 0"
      - name: received_harvest_date
        type: datetime
        source: input
        description: "Harvest date of the incoming batch, supplied on receive; becomes the refilled fusti's harvest_date."
        default: "null"
      - name: status
        type: enum
        source: computed
        description: "REQUESTED on auto-creation; RECEIVED after the incoming batch is received."
        default: "REQUESTED"
        constraints: "enum: REQUESTED, RECEIVED"

  - name: WholesaleAccount
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member applying for wholesale terms. Taken from X-User-ID of the acting Customer."
      - name: business_name
        type: string
        source: input
        description: "Legal business name."
      - name: tax_id
        type: string
        source: input
        description: "Business tax identifier."
      - name: status
        type: enum
        source: computed
        description: "Approval lifecycle."
        default: "DRAFT"
        constraints: "enum: DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED, REJECTED, SUSPENDED"
      - name: tier
        type: enum
        source: computed
        description: "Wholesale discount tier; NONE until APPROVED. TIER_1=10%, TIER_2=20%, TIER_3=30% off order subtotal."
        default: "NONE"
        constraints: "enum: NONE, TIER_1, TIER_2, TIER_3"
      - name: rejection_reason
        type: string
        source: computed
        description: "Reason captured on REJECT or REQUEST_CHANGES; null otherwise."
        default: "null"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the purchasing member. Taken from X-User-ID of the acting Customer, or set by the renewing Subscription."
      - name: wholesale_account_id
        type: string
        source: input
        description: "FK -> WholesaleAccount.id; present when the order is placed under wholesale terms. Null for retail orders."
        default: "null"
      - name: lines
        type: array
        source: input
        description: "Order line objects: { line_type (UNIT|REFILL|BUNDLE), product_id, quantity, volume_ml? }. REFILL requires volume_ml and a BULK product; UNIT requires a BOTTLE/ACCESSORY product; BUNDLE requires a GIFT_SET/BLEND product."
        constraints: "non-empty"
      - name: payment_status
        type: enum
        source: computed
        description: "Payment axis (independent of fulfillment axis)."
        default: "UNPAID"
        constraints: "enum: UNPAID, PAID, REFUNDED"
      - name: fulfillment_status
        type: enum
        source: computed
        description: "Fulfillment axis (independent of payment axis)."
        default: "PENDING"
        constraints: "enum: PENDING, RESERVED, FULFILLED, CANCELLED"
      - name: provisional_subtotal_cents
        type: integer
        source: computed
        description: "Subtotal computed at order creation from current catalog prices (per calculation order_line_pricing, provisional variant)."
        constraints: ">= 0"
      - name: provisional_total_cents
        type: integer
        source: computed
        description: "Grand total computed at creation (order_total_settlement over provisional subtotal): discounted_subtotal + shipping_fee."
        constraints: ">= 0"
      - name: final_subtotal_cents
        type: integer
        source: computed
        description: "Subtotal recomputed at fulfillment with freshness markdown applied (order_line_pricing, final variant); null until FULFILLED."
        default: "null"
      - name: final_total_cents
        type: integer
        source: computed
        description: "Grand total recomputed at fulfillment; null until FULFILLED."
        default: "null"
      - name: discount_cents
        type: integer
        source: computed
        description: "Wholesale tier discount applied to subtotal: round_half_up(subtotal * tier_pct)."
        default: 0
      - name: shipping_fee_cents
        type: integer
        source: computed
        description: "0 when discounted_subtotal >= FREE_SHIP_THRESHOLD_CENTS, else FLAT_SHIP_CENTS. Evaluated against discounted_subtotal (pre-shipping)."
        default: 0
      - name: wallet_credit_applied_cents
        type: integer
        source: computed
        description: "Store credit consumed at pay: min(member.wallet_credit_cents, provisional_total_cents) when use_wallet_credit is true, else 0."
        default: 0
      - name: amount_charged_cents
        type: integer
        source: computed
        description: "External charge at pay: provisional_total_cents - wallet_credit_applied_cents."
        default: 0
      - name: amount_refunded_cents
        type: integer
        source: computed
        description: "Cumulative amount refunded on cancellation."
        default: 0
      - name: use_wallet_credit
        type: boolean
        source: input
        description: "If true, wallet credit is applied at pay time."
        default: "false"

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: computed
        description: "FK -> Order.id; the order that created this reservation."
      - name: fusti_id
        type: string
        source: computed
        description: "FK -> Fusti.id; the vessel selected (FEFO) to satisfy the REFILL line."
      - name: volume_ml
        type: integer
        source: computed
        description: "Volume held/drawn for the REFILL line."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "HELD at reserve (pay); COMMITTED at fulfill (draws volume); RELEASED at cancel (returns held volume)."
        default: "HELD"
        constraints: "enum: HELD, COMMITTED, RELEASED"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the subscribing member (from X-User-ID)."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product delivered each cycle."
      - name: quantity
        type: integer
        source: input
        description: "Units per cycle for UNIT/BUNDLE products."
        default: 1
        constraints: ">= 1"
      - name: volume_ml
        type: integer
        source: input
        description: "Millilitres per cycle for REFILL of a BULK product; null otherwise."
        default: "null"
      - name: cadence_days
        type: integer
        source: input
        description: "Days between renewals."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE initially; PAUSED/CANCELLED via transition; renew is an ACTIVE self-loop."
        default: "ACTIVE"
        constraints: "enum: ACTIVE, PAUSED, CANCELLED"
      - name: next_renewal_date
        type: datetime
        source: computed
        description: "clock_now + cadence_days at creation; advanced by cadence_days on each renew."
      - name: renewals_count
        type: integer
        source: computed
        description: "Number of completed renewals."
        default: 0
      - name: last_order_id
        type: string
        source: computed
        description: "FK -> Order.id; the most recent Order created by a renew; null before first renewal."
        default: "null"

  - name: TastingStation
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Station display name."

  - name: TastingSession
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> TastingStation.id; the station booked."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the booking member (from X-User-ID)."
      - name: start_at
        type: datetime
        source: input
        description: "Session start (ISO 8601 UTC)."
      - name: end_at
        type: datetime
        source: input
        description: "Session end; must be strictly after start_at."
      - name: party_size
        type: integer
        source: input
        description: "Number of guests."
        default: 1
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "Booking lifecycle."
        default: "BOOKED"
        constraints: "enum: BOOKED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Order
    initial_state: "payment_status=UNPAID, fulfillment_status=PENDING"
    terminal_states: ["fulfillment_status=CANCELLED", "payment_status=REFUNDED"]
    note: "Two independent axes. payment_status: UNPAID->PAID->REFUNDED. fulfillment_status: PENDING->RESERVED->FULFILLED, plus ->CANCELLED. pay advances BOTH UNPAID->PAID and PENDING->RESERVED atomically."
    transitions:
      - from: "payment_status=UNPAID, fulfillment_status=PENDING"
        to: "payment_status=PAID, fulfillment_status=RESERVED"
        trigger: "POST /orders/{id}/pay"
        actor: Customer
        preconditions:
          - "order.payment_status == UNPAID"
          - "order.fulfillment_status == PENDING"
          - "expected_order_version matches order.version"
          - "if wholesale_account_id set: that WholesaleAccount.status == APPROVED"
          - "for each REFILL line: an eligible FEFO Fusti exists with available_volume_ml >= line.volume_ml (see calculation fusti_selection)"
          - "no order line product allergen intersects member.allergen_restrictions"
          - "if use_wallet_credit: member.wallet_credit_cents >= 0 (partial application allowed)"
        side_effects:
          - "compute wallet_credit_applied_cents = min(member.wallet_credit_cents, provisional_total_cents) if use_wallet_credit else 0"
          - "member.wallet_credit_cents -= wallet_credit_applied_cents"
          - "amount_charged_cents = provisional_total_cents - wallet_credit_applied_cents"
          - "for each REFILL line: select FEFO Fusti, create Reservation(status=HELD, volume_ml); that Fusti.reserved_volume_ml += volume_ml (cascade: Order.pay -> Reservation HELD -> Fusti.reserved_volume_ml increased)"
          - "increments Order.version by 1"
      - from: "payment_status=PAID, fulfillment_status=RESERVED"
        to: "payment_status=PAID, fulfillment_status=FULFILLED"
        trigger: "POST /orders/{id}/fulfill"
        actor: ShopStaff
        preconditions:
          - "order.fulfillment_status == RESERVED"
          - "expected_order_version matches order.version"
          - "for each REFILL line's Reservation Fusti: status IN {IN_SERVICE, LOW} and is_past_best_by == false"
        side_effects:
          - "recompute final_subtotal_cents/final_total_cents via order_line_pricing final variant (freshness markdown per line)"
          - "reconcile: if provisional_total_cents > final_total_cents, member.wallet_credit_cents += (provisional_total_cents - final_total_cents); amount_refunded_cents += that delta"
          - "for each Reservation: HELD->COMMITTED; its Fusti.current_volume_ml -= volume_ml AND Fusti.reserved_volume_ml -= volume_ml; set Fusti.first_draw_at = clock_now if null (cascade hop 2)"
          - "if a Fusti.current_volume_ml <= reorder_point_ml after decrement: Fusti IN_SERVICE->LOW (cascade hop 3); if == 0: IN_SERVICE/LOW->EMPTY"
          - "if a Fusti transitioned to LOW or EMPTY: auto-create ReplenishmentOrder(status=REQUESTED, requested_volume_ml = capacity_ml - current_volume_ml) (cascade hop 4)"
          - "member.loyalty_points += floor(final_total_cents / 100) * POINTS_PER_DOLLAR"
          - "increments Order.version by 1"
      - from: "payment_status=PAID, fulfillment_status=RESERVED"
        to: "payment_status=REFUNDED, fulfillment_status=CANCELLED"
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "order.fulfillment_status == RESERVED"
          - "expected_order_version matches order.version"
        side_effects:
          - "for each HELD Reservation: HELD->RELEASED; its Fusti.reserved_volume_ml -= volume_ml; Fusti.current_volume_ml UNCHANGED (cascade: Order.cancel -> Reservation RELEASED -> Fusti.reserved_volume_ml decreased)"
          - "member.wallet_credit_cents += wallet_credit_applied_cents (restore exactly the wallet portion debited at pay)"
          - "amount_refunded_cents = provisional_total_cents"
          - "increments Order.version by 1"
      - from: "payment_status=UNPAID, fulfillment_status=PENDING"
        to: "payment_status=UNPAID, fulfillment_status=CANCELLED"
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "order.fulfillment_status == PENDING"
          - "expected_order_version matches order.version"
        side_effects:
          - "no reservations exist yet; no volume or wallet change"
          - "increments Order.version by 1"
      - from: "payment_status=PAID, fulfillment_status=FULFILLED"
        to: "payment_status=REFUNDED, fulfillment_status=CANCELLED"
        trigger: "POST /orders/{id}/cancel (return)"
        actor: ShopStaff
        preconditions:
          - "order.fulfillment_status == FULFILLED"
          - "expected_order_version matches order.version"
        side_effects:
          - "for each COMMITTED Reservation: its Fusti.current_volume_ml += volume_ml (restock returned volume)"
          - "member.wallet_credit_cents += final_total_cents (full refund to store credit)"
          - "member.loyalty_points -= floor(final_total_cents / 100) * POINTS_PER_DOLLAR (reverse the exact accrual)"
          - "amount_refunded_cents = final_total_cents"
          - "increments Order.version by 1"

  - entity: WholesaleAccount
    initial_state: DRAFT
    terminal_states: [REJECTED]
    note: "Cyclic: SUBMITTED->CHANGES_REQUESTED->SUBMITTED revision loop; APPROVED<->SUSPENDED reinstatement loop."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /wholesale-accounts/{id}/submit"
        actor: Customer
        preconditions: ["status == DRAFT", "acting member owns the account"]
        side_effects: ["increments WholesaleAccount.version by 1"]
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /wholesale-accounts/{id}/submit"
        actor: Customer
        preconditions: ["status == CHANGES_REQUESTED", "acting member owns the account"]
        side_effects: ["clear rejection_reason", "increments WholesaleAccount.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /wholesale-accounts/{id}/decision (decision=APPROVE)"
        actor: WholesaleApprover
        preconditions: ["status == SUBMITTED", "expected_wholesale_account_version matches version", "tier provided in {TIER_1,TIER_2,TIER_3}"]
        side_effects:
          - "set tier from request"
          - "Member.member_type -> WHOLESALE (cross-entity)"
          - "increments WholesaleAccount.version by 1"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /wholesale-accounts/{id}/decision (decision=REQUEST_CHANGES)"
        actor: WholesaleApprover
        preconditions: ["status == SUBMITTED", "expected_wholesale_account_version matches version"]
        side_effects: ["set rejection_reason", "increments WholesaleAccount.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /wholesale-accounts/{id}/decision (decision=REJECT)"
        actor: WholesaleApprover
        preconditions: ["status == SUBMITTED", "expected_wholesale_account_version matches version"]
        side_effects: ["set rejection_reason", "increments WholesaleAccount.version by 1"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /wholesale-accounts/{id}/decision (decision=SUSPEND)"
        actor: WholesaleApprover
        preconditions: ["status == APPROVED", "expected_wholesale_account_version matches version"]
        side_effects:
          - "if member has no other APPROVED WholesaleAccount: Member.member_type -> RETAIL (cross-entity)"
          - "increments WholesaleAccount.version by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /wholesale-accounts/{id}/decision (decision=REINSTATE)"
        actor: WholesaleApprover
        preconditions: ["status == SUSPENDED", "expected_wholesale_account_version matches version"]
        side_effects: ["Member.member_type -> WHOLESALE (cross-entity)", "increments WholesaleAccount.version by 1"]

  - entity: Fusti
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    note: "Compound/guarded with system auto-transitions on volume thresholds plus operator quarantine/retire. Cyclic: IN_SERVICE<->LOW, IN_SERVICE/LOW<->QUARANTINED."
    transitions:
      - from: IN_SERVICE
        to: LOW
        trigger: "system: order fulfill commit drops current_volume_ml <= reorder_point_ml (and > 0)"
        actor: system
        preconditions: ["current_volume_ml <= reorder_point_ml", "current_volume_ml > 0"]
        side_effects: ["auto-create ReplenishmentOrder(REQUESTED)"]
      - from: IN_SERVICE
        to: EMPTY
        trigger: "system: order fulfill commit drops current_volume_ml to 0"
        actor: system
        preconditions: ["current_volume_ml == 0"]
        side_effects: ["auto-create ReplenishmentOrder(REQUESTED)"]
      - from: LOW
        to: EMPTY
        trigger: "system: order fulfill commit drops current_volume_ml to 0"
        actor: system
        preconditions: ["current_volume_ml == 0"]
        side_effects: []
      - from: LOW
        to: IN_SERVICE
        trigger: "POST /replenishment-orders/{id}/receive"
        actor: ShopStaff
        preconditions: ["linked ReplenishmentOrder.status == REQUESTED"]
        side_effects:
          - "current_volume_ml = capacity_ml (refill)"
          - "harvest_date = received_harvest_date; best_by_date recomputed; first_draw_at = null"
          - "cascade: receive -> Fusti.current_volume_ml raised -> Fusti.status LOW->IN_SERVICE"
      - from: EMPTY
        to: IN_SERVICE
        trigger: "POST /replenishment-orders/{id}/receive"
        actor: ShopStaff
        preconditions: ["linked ReplenishmentOrder.status == REQUESTED"]
        side_effects: ["current_volume_ml = capacity_ml", "harvest_date = received_harvest_date; best_by_date recomputed; first_draw_at = null"]
      - from: IN_SERVICE
        to: QUARANTINED
        trigger: "POST /fusti/{id}/transition (action=QUARANTINE)"
        actor: InventoryManager
        preconditions: ["status == IN_SERVICE"]
        side_effects: []
      - from: LOW
        to: QUARANTINED
        trigger: "POST /fusti/{id}/transition (action=QUARANTINE)"
        actor: InventoryManager
        preconditions: ["status == LOW"]
        side_effects: []
      - from: QUARANTINED
        to: IN_SERVICE
        trigger: "POST /fusti/{id}/transition (action=RELEASE)"
        actor: InventoryManager
        preconditions: ["status == QUARANTINED", "current_volume_ml > reorder_point_ml"]
        side_effects: []
      - from: QUARANTINED
        to: LOW
        trigger: "POST /fusti/{id}/transition (action=RELEASE)"
        actor: InventoryManager
        preconditions: ["status == QUARANTINED", "current_volume_ml <= reorder_point_ml"]
        side_effects: []
      - from: QUARANTINED
        to: RETIRED
        trigger: "POST /fusti/{id}/transition (action=RETIRE)"
        actor: InventoryManager
        preconditions: ["status == QUARANTINED"]
        side_effects: []

  - entity: Reservation
    initial_state: HELD
    terminal_states: [COMMITTED, RELEASED]
    note: "Branching from HELD; created only as a side effect of order pay."
    transitions:
      - from: HELD
        to: COMMITTED
        trigger: "system: POST /orders/{id}/fulfill"
        actor: system
        preconditions: ["parent Order.fulfillment_status == RESERVED"]
        side_effects: ["Fusti.current_volume_ml -= volume_ml", "Fusti.reserved_volume_ml -= volume_ml", "Fusti.first_draw_at = clock_now if null"]
      - from: HELD
        to: RELEASED
        trigger: "system: POST /orders/{id}/cancel"
        actor: system
        preconditions: ["parent Order.fulfillment_status == RESERVED"]
        side_effects: ["Fusti.reserved_volume_ml -= volume_ml", "Fusti.current_volume_ml UNCHANGED"]

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    note: "Cyclic ACTIVE<->PAUSED; renew is an ACTIVE self-loop that creates an Order (cascade)."
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/transition (action=PAUSE)"
        actor: Customer
        preconditions: ["status == ACTIVE", "acting member owns the subscription"]
        side_effects: ["increments Subscription.version by 1"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/transition (action=RESUME)"
        actor: Customer
        preconditions: ["status == PAUSED", "acting member owns the subscription"]
        side_effects: ["increments Subscription.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/transition (action=CANCEL)"
        actor: Customer
        preconditions: ["status == ACTIVE", "acting member owns the subscription"]
        side_effects: ["increments Subscription.version by 1"]
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/transition (action=CANCEL)"
        actor: Customer
        preconditions: ["status == PAUSED", "acting member owns the subscription"]
        side_effects: ["increments Subscription.version by 1"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/transition (action=RENEW)"
        actor: ShopStaff
        preconditions: ["status == ACTIVE", "clock_now >= next_renewal_date"]
        side_effects:
          - "create Order(member_id=subscription.member_id, one line derived from product_id/quantity/volume_ml) in UNPAID/PENDING (cascade: renew -> Order created)"
          - "last_order_id = new order id"
          - "next_renewal_date += cadence_days; renewals_count += 1"
          - "increments Subscription.version by 1"

  - entity: TastingSession
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    note: "Branching lifecycle."
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /tasting-sessions/{id}/transition (action=CHECK_IN)"
        actor: ShopStaff
        preconditions: ["status == BOOKED"]
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /tasting-sessions/{id}/transition (action=COMPLETE)"
        actor: ShopStaff
        preconditions: ["status == CHECKED_IN"]
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /tasting-sessions/{id}/transition (action=CANCEL)"
        actor: Customer
        preconditions: ["status == BOOKED", "acting member owns the session"]
        side_effects: []
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /tasting-sessions/{id}/transition (action=NO_SHOW)"
        actor: ShopStaff
        preconditions: ["status == BOOKED", "clock_now >= start_at"]
        side_effects: []

  - entity: ReplenishmentOrder
    initial_state: REQUESTED
    terminal_states: [RECEIVED]
    note: "Auto-created by the Fusti LOW/EMPTY cascade; closed by receive."
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /replenishment-orders/{id}/receive"
        actor: ShopStaff
        preconditions: ["status == REQUESTED"]
        side_effects: ["refill linked Fusti to capacity; set harvest_date/best_by_date; Fusti -> IN_SERVICE (cascade hop 2)"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: subscription-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /subscriptions"
    occ_field: "expected_member_version"
    description: |
      Creating a Subscription against a Member whose version has advanced since
      the client last observed it is rejected as a stale-version write. A member
      may hold at most one ACTIVE Subscription per product; a new create
      legitimately supersedes (cancels) the prior ACTIVE one for the same
      product, so a second create carrying the member version observed before
      the first create must be rejected on the stale version rather than
      silently superseding an object the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fusti_selection
    trigger: "on POST /orders/{id}/pay, for each REFILL line"
    algorithm: selector_policy
    formula: |
      candidates = Fusti where product_id == line.product_id
                   AND status IN {IN_SERVICE, LOW}
                   AND is_past_best_by == false
                   AND available_volume_ml >= line.volume_ml
      rank by best_by_date ASC (FEFO); tie-break created_at ASC
      pick first; if candidates empty -> ERR_INSUFFICIENT_VOLUME
    input_set: "Fusti rows for the line's product in {IN_SERVICE, LOW} that are not past best_by and have enough available volume."
    constants: {}
    precision: "integer millilitres"

  - name: order_line_pricing
    trigger: "provisional at POST /orders; final at POST /orders/{id}/fulfill"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs with non-linear interaction (line_type branch, per-line rounding, tier selection)
      for each line:
        if line_type == UNIT:   line_cents = product.unit_price_cents * quantity
        if line_type == REFILL: line_cents = round_half_up(product.price_per_ml_cents * volume_ml)   # round PER LINE
        if line_type == BUNDLE: line_cents = gift_set_bundle_price(product)                          # see below
      subtotal = sum(line_cents over lines)
      # FINAL variant only: for each REFILL line whose committed Fusti.sensory_freshness_score < FRESHNESS_MARKDOWN_THRESHOLD,
      #   recompute that line_cents = round_half_up(product.price_per_ml_cents * volume_ml * (1 - FRESHNESS_MARKDOWN_PCT)) before summing.
    input_set: "All lines of the order. Provisional uses list prices; final applies per-line freshness markdown."
    constants:
      FRESHNESS_MARKDOWN_THRESHOLD: 70
      FRESHNESS_MARKDOWN_PCT: 0.15
    precision: "round_half_up to integer cents, per line before summing"
    variants:
      - name: provisional
        when: "at order creation"
        difference: "no freshness markdown; freshness state ignored"
      - name: final
        when: "at order fulfillment"
        difference: "each REFILL line whose committed fusti sensory_freshness_score < 70 is marked down 15% before the per-line round"

  - name: gift_set_bundle_price
    trigger: "when pricing a BUNDLE (GIFT_SET/BLEND) line, inside order_line_pricing"
    algorithm: aggregation
    formula: |
      # nested rounding where order matters — PIN: round each component then sum (NOT sum then round)
      price = 0
      for each ProductComponent c where set_product_id == bundle.id:
        comp = Product[c.component_product_id]
        component_cents = round_half_up(comp.unit_price_cents * c.quantity * (1 - GIFT_SET_DISCOUNT_PCT))
        price += component_cents
      return price
    input_set: "All ProductComponent rows whose set_product_id is the bundle product."
    constants:
      GIFT_SET_DISCOUNT_PCT: 0.10
    precision: "round_half_up per component to integer cents, THEN sum"

  - name: order_total_settlement
    trigger: "provisional at POST /orders; final at POST /orders/{id}/fulfill"
    algorithm: threshold
    formula: |
      # circular-looking: 'free shipping over threshold' vs shipping inside total.
      # PIN evaluation order: subtotal -> discount -> discounted_subtotal -> shipping(on discounted_subtotal) -> total
      tier_pct = 0 if no APPROVED wholesale_account else {TIER_1:0.10, TIER_2:0.20, TIER_3:0.30}[account.tier]
      discount = round_half_up(subtotal * tier_pct)
      discounted_subtotal = subtotal - discount
      shipping_fee = 0 if discounted_subtotal >= FREE_SHIP_THRESHOLD_CENTS else FLAT_SHIP_CENTS
      total = discounted_subtotal + shipping_fee
    input_set: "The order's subtotal from order_line_pricing and its wholesale tier."
    constants:
      FREE_SHIP_THRESHOLD_CENTS: 7500
      FLAT_SHIP_CENTS: 995
      TIER_1_PCT: 0.10
      TIER_2_PCT: 0.20
      TIER_3_PCT: 0.30
    precision: "round_half_up to integer cents on discount"

  - name: fusti_freshness
    trigger: "computed on every read of a Fusti (GET /fusti/{id})"
    algorithm: decay_function
    formula: |
      elapsed_days = (clock_now - harvest_date) / 86400 seconds
      label = round_half_up_2dp(max(0, 100 * (1 - elapsed_days / shelf_life_days)))
      if first_draw_at is null:
        sensory = label
      else:
        elapsed_open_days = (first_draw_at - harvest_date) / 86400
        label_at_open = round_half_up_2dp(max(0, 100 * (1 - elapsed_open_days / shelf_life_days)))
        days_open = (clock_now - first_draw_at) / 86400
        sensory = round_half_up_2dp(max(0, label_at_open - OPEN_DECAY_PER_DAY * days_open))
    input_set: "The single Fusti and its Product.shelf_life_days; clock_now."
    constants:
      OPEN_DECAY_PER_DAY: 2.5
    precision: "round_half_up to 2 decimal places"
    variants:
      - name: label_method
        when: "always (printed best-by interpolation)"
        difference: "straight-line to best_by regardless of when opened; forward-looking"
      - name: sensory_method
        when: "after first_draw_at is set"
        difference: "accelerated linear decay of 2.5 points/day measured from the open event; chronological — diverges from label once opened"

  - name: loyalty_accrual
    trigger: "on fulfill (+) and on fulfilled-order return-cancel (-)"
    algorithm: aggregation
    formula: |
      points_delta = floor(final_total_cents / 100) * POINTS_PER_DOLLAR
    input_set: "The order's final_total_cents."
    constants:
      POINTS_PER_DOLLAR: 1
    precision: "integer points"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for the endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "all path-referenced resources exist, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "all body-referenced FK resources exist (product_id, wholesale_account_id, station_id, component_product_id)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "POST /orders, POST /subscriptions, POST /fusti, POST /products/{id}/components, POST /tasting-sessions"
  - priority: 5
    category: business_referential
    check: "entity_backed Customer acts only on resources it owns (order.member_id / subscription.member_id / session.member_id / wholesale_account.member_id == X-User-ID)"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "Customer-owned mutations and reads"
  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: state
    check: "expected_<parent>_version matches the current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/pay, POST /orders/{id}/fulfill, POST /orders/{id}/cancel, POST /wholesale-accounts/{id}/decision, POST /subscriptions"
  - priority: 8
    category: business_constraint
    check: "request body field types/enums valid, required fields present, quantity/volume_ml >= 1, end_at > start_at"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST"
  - priority: 9
    category: business_constraint
    check: "order line volume_ml > 0 for REFILL lines (zero-volume refill rejected)"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "POST /orders, POST /orders/{id}/pay"
  - priority: 10
    category: business_referential
    check: "BUNDLE component_product_id must reference a non-set product; a GIFT_SET must have >= 1 component"
    error_id: ERR_INVALID_COMPONENT
    http_status: 422
    applies_to: "POST /products/{id}/components, POST /orders (BUNDLE lines)"
  - priority: 11
    category: business_safety
    check: "no order line product's allergens intersect the member's allergen_restrictions"
    error_id: ERR_ALLERGEN_CONFLICT
    http_status: 422
    applies_to: "POST /orders/{id}/pay"
  - priority: 12
    category: business_safety
    check: "on fulfill, each REFILL line's committed Fusti must not be past best_by"
    error_id: ERR_FUSTI_EXPIRED
    http_status: 422
    applies_to: "POST /orders/{id}/fulfill"
  - priority: 13
    category: state
    check: "on fulfill, each REFILL line's Fusti.status must be IN_SERVICE or LOW (not QUARANTINED/EMPTY/RETIRED)"
    error_id: ERR_FUSTI_QUARANTINED
    http_status: 409
    applies_to: "POST /orders/{id}/fulfill"
  - priority: 14
    category: business_temporal
    check: "new TastingSession must not fall within BUFFER_MINUTES (=15) of another non-cancelled session on the same station; collision iff the time gap between the sessions is strictly less than 15 minutes (a session starting exactly 15 minutes after a prior session ends is accepted)"
    error_id: ERR_STATION_UNAVAILABLE
    http_status: 409
    applies_to: "POST /tasting-sessions"
  - priority: 15
    category: business_temporal
    check: "new TastingSession interval [start_at,end_at) must not overlap any other non-cancelled session held by the same member on any station (bare half-open overlap, no buffer)"
    error_id: ERR_MEMBER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /tasting-sessions"
  - priority: 16
    category: business_temporal
    check: "TastingSession start_at must be strictly in the future relative to clock_now at booking"
    error_id: ERR_SESSION_IN_PAST
    http_status: 422
    applies_to: "POST /tasting-sessions"
  - priority: 17
    category: business_constraint
    check: "wholesale order (wholesale_account_id set) requires that WholesaleAccount.status == APPROVED"
    error_id: ERR_WHOLESALE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /orders, POST /orders/{id}/pay"
  - priority: 18
    category: business_constraint
    check: "each REFILL line has an eligible FEFO Fusti with available_volume_ml >= volume_ml"
    error_id: ERR_INSUFFICIENT_VOLUME
    http_status: 409
    applies_to: "POST /orders/{id}/pay"
  - priority: 19
    category: business_fiscal
    check: "product sku unique on create"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /products"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced"]

  - method: POST
    path: "/api/members"
    description: "Create a member."
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, "allergen_restrictions?"]
    output: Member
    side_effects: []
  - method: GET
    path: "/api/members/{id}"
    description: "Fetch a member (wallet, loyalty, type)."
    roles: [Customer, ShopStaff, InventoryManager, WholesaleApprover, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/api/products"
    description: "Create a catalog product/SKU."
    roles: [InventoryManager]
    code: 201
    input: [sku, name, product_type, "unit_price_cents?", "price_per_ml_cents?", "allergens?", "shelf_life_days?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/api/products/{id}"
    description: "Fetch a product."
    roles: [Customer, ShopStaff, InventoryManager, WholesaleApprover, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/api/products/{id}/components"
    description: "Add a component to a GIFT_SET/BLEND product."
    roles: [InventoryManager]
    code: 201
    input: [component_product_id, quantity]
    output: ProductComponent
    side_effects: []
  - method: GET
    path: "/api/products/{id}/components"
    description: "List the components of a set product (reverse-reachability for ProductComponent.set_product_id and component_product_id)."
    roles: [Customer, ShopStaff, InventoryManager, WholesaleApprover, PlatformAdmin]
    code: 200
    input: []
    output: ProductComponent[]
    side_effects: []

  - method: POST
    path: "/api/fusti"
    description: "Create a fusti (bulk vessel/batch) for a BULK product."
    roles: [InventoryManager]
    code: 201
    input: [product_id, capacity_ml, initial_volume_ml, reorder_point_ml, harvest_date]
    output: Fusti
    side_effects: ["best_by_date computed from harvest_date + product.shelf_life_days", "status IN_SERVICE, or LOW if initial_volume_ml <= reorder_point_ml"]
  - method: GET
    path: "/api/fusti/{id}"
    description: "Fetch a fusti including computed label_freshness_score / sensory_freshness_score / is_past_best_by / available_volume_ml."
    roles: [Customer, ShopStaff, InventoryManager, WholesaleApprover, PlatformAdmin]
    code: 200
    input: []
    output: Fusti
    side_effects: []
  - method: GET
    path: "/api/fusti"
    description: "List fusti, filterable (reverse-reachability for Fusti.product_id)."
    roles: [Customer, ShopStaff, InventoryManager, WholesaleApprover, PlatformAdmin]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: Fusti[]
    side_effects: []
  - method: POST
    path: "/api/fusti/{id}/transition"
    description: "Operator transition of a fusti (QUARANTINE / RELEASE / RETIRE)."
    roles: [InventoryManager]
    code: 200
    input: [action]
    output: Fusti
    side_effects: ["status change per §1.2"]

  - method: GET
    path: "/api/reservations/{id}"
    description: "Fetch a reservation."
    roles: [ShopStaff, InventoryManager, PlatformAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/api/reservations"
    description: "List reservations (reverse-reachability for Reservation.order_id and Reservation.fusti_id)."
    roles: [ShopStaff, InventoryManager, PlatformAdmin]
    code: 200
    input: ["order_id?", "fusti_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/api/replenishment-orders/{id}"
    description: "Fetch a replenishment order."
    roles: [ShopStaff, InventoryManager, PlatformAdmin]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: []
  - method: GET
    path: "/api/replenishment-orders"
    description: "List replenishment orders (reverse-reachability for fusti_id and product_id). Auto-created rows are discovered here."
    roles: [ShopStaff, InventoryManager, PlatformAdmin]
    code: 200
    input: ["fusti_id?", "product_id?", "status?", "limit?", "offset?"]
    output: ReplenishmentOrder[]
    side_effects: []
  - method: POST
    path: "/api/replenishment-orders/{id}/receive"
    description: "Receive an incoming batch; refills the linked fusti to capacity, sets harvest/best-by, and returns it to service."
    roles: [ShopStaff, InventoryManager]
    code: 200
    input: [received_harvest_date, "received_volume_ml?"]
    output: ReplenishmentOrder
    side_effects: ["refill Fusti to capacity", "Fusti LOW/EMPTY -> IN_SERVICE", "Fusti.first_draw_at = null"]

  - method: POST
    path: "/api/wholesale-accounts"
    description: "Apply for a wholesale account (Customer, for self)."
    roles: [Customer]
    code: 201
    input: [business_name, tax_id]
    output: WholesaleAccount
    side_effects: ["member_id set from X-User-ID; status DRAFT"]
  - method: GET
    path: "/api/wholesale-accounts/{id}"
    description: "Fetch a wholesale account."
    roles: [Customer, WholesaleApprover, PlatformAdmin]
    code: 200
    input: []
    output: WholesaleAccount
    side_effects: []
  - method: GET
    path: "/api/wholesale-accounts"
    description: "List wholesale accounts (reverse-reachability for member_id)."
    roles: [WholesaleApprover, PlatformAdmin]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: WholesaleAccount[]
    side_effects: []
  - method: POST
    path: "/api/wholesale-accounts/{id}/submit"
    description: "Submit or resubmit a wholesale application."
    roles: [Customer]
    code: 200
    input: []
    output: WholesaleAccount
    side_effects: ["DRAFT/CHANGES_REQUESTED -> SUBMITTED"]
  - method: POST
    path: "/api/wholesale-accounts/{id}/decision"
    description: "Approver decision on a wholesale account."
    roles: [WholesaleApprover]
    code: 200
    input: [decision, "tier?", "rejection_reason?", expected_wholesale_account_version]
    output: WholesaleAccount
    side_effects: ["status transition per §1.2", "Member.member_type recompute", "increments WholesaleAccount.version by 1"]

  - method: POST
    path: "/api/orders"
    description: "Create an order with lines; computes provisional pricing."
    roles: [Customer]
    code: 201
    input: [lines, "wholesale_account_id?", "use_wallet_credit?"]
    output: Order
    side_effects: ["member_id from X-User-ID", "provisional_subtotal_cents/provisional_total_cents computed"]
  - method: GET
    path: "/api/orders/{id}"
    description: "Fetch an order."
    roles: [Customer, ShopStaff, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/api/orders"
    description: "List orders (reverse-reachability for member_id and wholesale_account_id)."
    roles: [ShopStaff, PlatformAdmin]
    code: 200
    input: ["member_id?", "wholesale_account_id?", "payment_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/api/orders/{id}/pay"
    description: "Pay an order: applies wallet credit, reserves FEFO fusti volume."
    roles: [Customer]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["payment UNPAID->PAID, fulfillment PENDING->RESERVED", "create HELD Reservations; Fusti.reserved_volume_ml += volume", "member.wallet_credit_cents -= applied", "increments Order.version by 1"]
  - method: POST
    path: "/api/orders/{id}/fulfill"
    description: "Fulfill a reserved order: commits reservations, draws volume, settles final price, accrues loyalty."
    roles: [ShopStaff]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["fulfillment RESERVED->FULFILLED", "Reservations COMMITTED; Fusti volume drawn; LOW/EMPTY cascade + ReplenishmentOrder", "final pricing + wallet reconciliation", "loyalty accrual", "increments Order.version by 1"]
  - method: POST
    path: "/api/orders/{id}/cancel"
    description: "Cancel/return an order: releases or restocks volume and refunds."
    roles: [Customer, ShopStaff]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["release HELD (or restock COMMITTED) reservations", "wallet/loyalty refund per §1.2", "increments Order.version by 1"]

  - method: POST
    path: "/api/subscriptions"
    description: "Create a subscription; supersedes a prior ACTIVE subscription for the same product (OCC on member version)."
    roles: [Customer]
    code: 201
    input: [product_id, "quantity?", "volume_ml?", cadence_days, expected_member_version]
    output: Subscription
    side_effects: ["member_id from X-User-ID", "next_renewal_date = clock_now + cadence_days", "increments Member.version by 1", "prior ACTIVE subscription for same product -> CANCELLED"]
  - method: GET
    path: "/api/subscriptions/{id}"
    description: "Fetch a subscription."
    roles: [Customer, ShopStaff, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/api/subscriptions"
    description: "List subscriptions (reverse-reachability for member_id, product_id, last_order_id)."
    roles: [ShopStaff, PlatformAdmin]
    code: 200
    input: ["member_id?", "product_id?", "last_order_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/api/subscriptions/{id}/transition"
    description: "Transition a subscription (PAUSE/RESUME/CANCEL by owner Customer; RENEW by ShopStaff)."
    roles: [Customer, ShopStaff]
    code: 200
    input: [action]
    output: Subscription
    side_effects: ["status change per §1.2; RENEW creates an Order and advances next_renewal_date"]

  - method: POST
    path: "/api/tasting-stations"
    description: "Create a tasting-bar station."
    roles: [InventoryManager, PlatformAdmin]
    code: 201
    input: [name]
    output: TastingStation
    side_effects: []
  - method: POST
    path: "/api/tasting-sessions"
    description: "Book a tasting session; enforces station buffer and member no-overlap."
    roles: [Customer]
    code: 201
    input: [station_id, start_at, end_at, "party_size?"]
    output: TastingSession
    side_effects: ["member_id from X-User-ID; status BOOKED"]
  - method: GET
    path: "/api/tasting-sessions/{id}"
    description: "Fetch a tasting session."
    roles: [Customer, ShopStaff, PlatformAdmin]
    code: 200
    input: []
    output: TastingSession
    side_effects: []
  - method: GET
    path: "/api/tasting-sessions"
    description: "List tasting sessions (reverse-reachability for station_id and member_id)."
    roles: [ShopStaff, PlatformAdmin]
    code: 200
    input: ["station_id?", "member_id?", "status?", "limit?", "offset?"]
    output: TastingSession[]
    side_effects: []
  - method: POST
    path: "/api/tasting-sessions/{id}/transition"
    description: "Transition a session (CANCEL by owner Customer; CHECK_IN/COMPLETE/NO_SHOW by ShopStaff)."
    roles: [Customer, ShopStaff]
    code: 200
    input: [action]
    output: TastingSession
    side_effects: ["status change per §1.2"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the endpoint"
  - id: ERR_FORBIDDEN_NOT_OWNER
    http: 403
    condition: "Customer acting on a resource it does not own"
  - id: ERR_VALIDATION
    http: 422
    condition: "malformed body: missing required field, bad enum, bad type, end_at <= start_at"
  - id: ERR_INVALID_QUANTITY
    http: 422
    condition: "quantity or REFILL volume_ml is <= 0"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "member id not found"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product id not found"
  - id: ERR_FUSTI_NOT_FOUND
    http: 404
    condition: "fusti id not found"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order id not found"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "reservation id not found"
  - id: ERR_REPLENISHMENT_NOT_FOUND
    http: 404
    condition: "replenishment order id not found"
  - id: ERR_WHOLESALE_ACCOUNT_NOT_FOUND
    http: 404
    condition: "wholesale account id not found"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "subscription id not found"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "tasting station id not found"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "tasting session id not found"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the resource's current state"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the current version"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "product sku already exists"
  - id: ERR_INVALID_COMPONENT
    http: 422
    condition: "BUNDLE component references a set product, or a GIFT_SET has no components"
  - id: ERR_ALLERGEN_CONFLICT
    http: 422
    condition: "an order line product's allergens intersect the member's allergen_restrictions"
  - id: ERR_FUSTI_EXPIRED
    http: 422
    condition: "fulfilling a REFILL line whose committed fusti is past best_by"
  - id: ERR_FUSTI_QUARANTINED
    http: 409
    condition: "fulfilling a REFILL line whose fusti is QUARANTINED/EMPTY/RETIRED"
  - id: ERR_INSUFFICIENT_VOLUME
    http: 409
    condition: "no eligible FEFO fusti has enough available volume for a REFILL line"
  - id: ERR_WHOLESALE_NOT_APPROVED
    http: 409
    condition: "order references a wholesale account not in APPROVED status"
  - id: ERR_STATION_UNAVAILABLE
    http: 409
    condition: "new session is within BUFFER_MINUTES (=15) of another session on the same station (gap strictly < 15 minutes; exactly-15-minute gap accepted)"
  - id: ERR_MEMBER_DOUBLE_BOOKED
    http: 409
    condition: "new session overlaps another non-cancelled session held by the same member"
  - id: ERR_SESSION_IN_PAST
    http: 422
    condition: "session start_at is not strictly in the future"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "A retail or wholesale shopper acting as their own Member."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /api/orders"
      - "POST /api/orders/{id}/pay"
      - "POST /api/wholesale-accounts"
      - "POST /api/wholesale-accounts/{id}/submit"
      - "POST /api/subscriptions"
      - "POST /api/tasting-sessions"
    shared_operations:
      - "POST /api/orders/{id}/cancel (with ShopStaff)"
      - "POST /api/subscriptions/{id}/transition (PAUSE/RESUME/CANCEL)"
      - "POST /api/tasting-sessions/{id}/transition (CANCEL)"
      - "GET own member/orders/subscriptions/sessions/wholesale-accounts"
  - name: ShopStaff
    description: "Front-of-house/back-of-house operator: fulfills orders, receives stock, runs tastings, renews subscriptions."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/orders/{id}/fulfill"
      - "POST /api/replenishment-orders/{id}/receive"
    shared_operations:
      - "POST /api/orders/{id}/cancel (with Customer)"
      - "POST /api/subscriptions/{id}/transition (RENEW)"
      - "POST /api/tasting-sessions/{id}/transition (CHECK_IN/COMPLETE/NO_SHOW)"
  - name: InventoryManager
    description: "Manages catalog, components, and fusti inventory posture."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/products"
      - "POST /api/products/{id}/components"
      - "POST /api/fusti"
      - "POST /api/fusti/{id}/transition"
    shared_operations:
      - "POST /api/replenishment-orders/{id}/receive (with ShopStaff)"
      - "GET inventory resources"
  - name: WholesaleApprover
    description: "Reviews and decides wholesale account applications."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/wholesale-accounts/{id}/decision"
    shared_operations:
      - "GET /api/wholesale-accounts"
  - name: PlatformAdmin
    description: "Operational superset; provisions members and controls the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/members"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "POST /api/tasting-stations (with InventoryManager)"
      - "GET all resources"
