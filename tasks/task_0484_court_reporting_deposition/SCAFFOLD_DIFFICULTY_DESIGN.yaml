              as: ScheduleCoordinator
              captures: { rep_ff_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness W4", scheduled_start: "2026-06-14T09:00:00Z", scheduled_end: "2026-06-14T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_ee_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
