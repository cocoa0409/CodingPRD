      - name: dispute_upheld_cascades_four_links_result_ledger_seeding_scholarship
        depth: 4
        grounds:
          - state_machines.Match.dispute_UNDER_REVIEW_to_UPHELD
          - calculations.match_point_award
          - calculations.showcase_scholarship_award
          - entities.Season.fields.seeding_state
          - entities.Team.fields.seed_stale
          - entities.Student.fields.scholarship_award_state
          - conserved_quantity_invariants.season_match_point_pool_conservation
        distinguishing_aspect: |
          A different four-link chain along a different axis than its sibling: adjudication
          rather than enforcement. The corrected score (1) restates the match result, which
          (2) forces a revert-then-apply of the whole point ledger on both teams, which (3)
          invalidates the season's existing seed order, which (4) marks every nominated
          student's scholarship as needing recalculation. Link 4 is two entities away from the
          endpoint's own aggregate and is reachable only through links 2 and 3, and the pool
          must come out unchanged because the revert and the apply are equal in size.
