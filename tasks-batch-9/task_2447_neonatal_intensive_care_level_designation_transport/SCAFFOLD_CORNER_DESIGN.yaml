          assert:
            - "Referral.${ref_mat}.current_support_level == LEVEL_I, anticipated_need_level == LEVEL_III, level_basis == ANTICIPATED_NEED, maternal_transfer_preferred == true and triage_priority == 78.75"
            - "Referral.${ref_n}.triage_priority == 71.25 — strictly lower, which is what arms the preference"
            - "${e_maternal} == ERR_MATERNAL_TRANSFER_PREFERENCE with HTTP 409, and the inbound referral stays PENDING"
            - "The maternal acceptance succeeds on the same unit version: BedReservation.${res_mat}.status == HELD with bed_class STAFFED"
            - "BedReservation.${res_mat}.expires_at == 2026-08-01T12:00:00Z — 720 minutes for a maternal hold, not 240"
            - "NicuUnit.${unit_a}.available_bed_count == 0 and version == 3 (1, +1 PATCH, +1 acceptance)"

      - name: every_gate_satisfied_lets_the_acceptance_through
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_10
          - validations.priority_12
          - validations.priority_15
          - state_machines[Referral].transitions.accept
          - calculations.bed_ledger
        distinguishing_aspect: |
          The mirror image of every refusal above: authenticated, permitted,
