scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: create_tax_account_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.TaxAccount, endpoints]
        distinguishing_aspect: >
          POST /collections/tax-accounts with all required fields returns 201; response
          carries collection_status == ACTIVE_COLLECTION, total_balance_cents == 0,
          csed_protection_count == 0, version == 1, and a server-minted UUID id.
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "New Co", tin: "200000001", filing_status: "INDIVIDUAL", monthly_disposable_income_cents: 100000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
          assert:
            - "HTTP status == 201"
            - "TaxAccount.${acct}.collection_status == ACTIVE_COLLECTION"
            - "TaxAccount.${acct}.total_balance_cents == 0"
            - "TaxAccount.${acct}.version == 1"

      - name: get_tax_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.TaxAccount, "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /collections/tax-accounts/{unknown-uuid} returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /collections/tax-accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RevenueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_tax_account_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.TaxAccount.fields.tin, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /collections/tax-accounts without tin returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "No Tin", filing_status: "INDIVIDUAL", monthly_disposable_income_cents: 100000 }
              as: RevenueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_tax_account_bad_enum_returns_400
        claim_type: Type Constraints
        grounds: [entities.TaxAccount.fields.filing_status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "filing_status outside {INDIVIDUAL, BUSINESS} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Bad Enum", tin: "200000002", filing_status: "TRUST", monthly_disposable_income_cents: 100000 }
              as: RevenueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_tin_returns_409
        claim_type: Type Constraints
        grounds: [entities.TaxAccount.fields.tin, "validations[priority=5]", "errors[ERR_DUPLICATE_TIN]"]
        distinguishing_aspect: "Creating a second TaxAccount with an in-use tin returns ERR_DUPLICATE_TIN (409)."
        test_recipe:
          setup: ["One account already exists with tin 200000010."]
          setup_api_calls:
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "First", tin: "200000010", filing_status: "BUSINESS", monthly_disposable_income_cents: 100000 }
              as: RevenueOfficer
          trigger:
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Dup", tin: "200000010", filing_status: "BUSINESS", monthly_disposable_income_cents: 100000 }
              as: RevenueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_DUPLICATE_TIN"

      - name: tax_period_create_computes_csed_and_initial_balance
        claim_type: Computed Fields
        grounds: [entities.TaxPeriod.fields.csed_date, calculations.csed_date]
        distinguishing_aspect: >
          POST /collections/tax-periods with assessment_date 2010-01-15 returns csed_date
          == 2020-01-16T00:00:00.000Z (assessment + 3653 days), period_status == ASSESSED,
          balance_due_cents == assessed_tax_cents.
        test_recipe:
          setup: ["An account exists."]
          setup_api_calls:
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Csed Co", tin: "200000011", filing_status: "BUSINESS", monthly_disposable_income_cents: 100000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2009, assessed_tax_cents: 500000, assessment_date: "2010-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_id: $.data.id }
          assert:
            - "TaxPeriod.${period_id}.csed_date == 2020-01-16T00:00:00.000Z"
            - "TaxPeriod.${period_id}.period_status == ASSESSED"
            - "TaxPeriod.${period_id}.balance_due_cents == 500000"

      - name: list_tax_accounts_paginated_envelope
        claim_type: Listing
        grounds: [entities.TaxAccount, response_envelope]
        distinguishing_aspect: "GET /collections/tax-accounts returns an array response with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two accounts exist."]
          setup_api_calls:
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "L1", tin: "200000020", filing_status: "BUSINESS", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "L2", tin: "200000021", filing_status: "BUSINESS", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
          trigger:
            - call: "GET /collections/tax-accounts"
              payload: { limit: 1, offset: 0 }
              as: CaseReviewer
          assert:
            - "response_type == array"
            - "meta total_count >= 2 and has_more == true"

  # =================================================================
  - section: state_machines
    instances:
      - name: approve_already_approved_agreement_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.InstallmentAgreement.PROPOSED_to_APPROVED, "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an agreement already in APPROVED state returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["Account with period; an APPROVED MANUAL LONG_TERM agreement."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "ReAppr Co", tin: "200000030", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts/${acct}/recompute"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct}", agreement_type: "LONG_TERM", payment_method: "MANUAL", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-04-15T00:00:00.000Z", active_to: "2024-10-15T00:00:00.000Z", low_income_flag: false }
              as: RevenueOfficer
              captures: { agr: $.data.id }
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { v1: $.data.version }
            - call: "POST /collections/installment-agreements/${agr}/approve"
              payload: { expected_tax_account_version: "${v1}" }
              as: RevenueOfficer
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /collections/installment-agreements/${agr}/approve"
              payload: { expected_tax_account_version: "${v2}" }
              as: RevenueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: initial_state_agreement_is_proposed
        claim_type: Initial State
        grounds: [state_machines.InstallmentAgreement, entities.InstallmentAgreement.fields.status]
        distinguishing_aspect: "A freshly created InstallmentAgreement has status == PROPOSED and setup_fee_cents == 0."
        test_recipe:
          setup: ["An account with one period exists."]
          setup_api_calls:
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Init Co", tin: "200000031", filing_status: "BUSINESS", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
          trigger:
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct}", agreement_type: "LONG_TERM", payment_method: "MANUAL", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-04-15T00:00:00.000Z", active_to: "2024-10-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { agr: $.data.id }
          assert:
            - "InstallmentAgreement.${agr}.status == PROPOSED"
            - "InstallmentAgreement.${agr}.setup_fee_cents == 0"

      - name: reject_proposed_agreement_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.InstallmentAgreement.PROPOSED_to_REJECTED]
        distinguishing_aspect: "POST /installment-agreements/{id}/reject from PROPOSED -> REJECTED; no period or CSED change."
        test_recipe:
          setup: ["Account with period; a PROPOSED agreement."]
          setup_api_calls:
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Rej Co", tin: "200000032", filing_status: "BUSINESS", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_id: $.data.id }
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct}", agreement_type: "LONG_TERM", payment_method: "MANUAL", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-04-15T00:00:00.000Z", active_to: "2024-10-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { agr: $.data.id }
          trigger:
            - call: "POST /collections/installment-agreements/${agr}/reject"
              payload: {}
              as: RevenueOfficer
          assert:
            - "InstallmentAgreement.${agr}.status == REJECTED"
            - "TaxPeriod.${period_id}.period_status == ASSESSED"

      - name: terminal_lien_withdrawn_cannot_request_release
        claim_type: Terminal State Lockdown
        grounds: [state_machines.FederalTaxLien, "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A WITHDRAWN lien is terminal; request-release returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Account; a lien FILED then WITHDRAWN."]
          setup_api_calls:
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Wd Co", tin: "200000033", filing_status: "BUSINESS", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/liens"
              payload: { tax_account_id: "${acct}", filed_amount_cents: 500000 }
              as: RevenueOfficer
              captures: { lien_id: $.data.id }
            - call: "POST /collections/liens/${lien_id}/withdraw"
              payload: {}
              as: CaseReviewer
          trigger:
            - call: "POST /collections/liens/${lien_id}/request-release"
              payload: {}
              as: RevenueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cnc_create_then_revoke_flips_collection_status
        claim_type: Side Effect Execution
        grounds: [entities.CncDetermination, entities.TaxAccount.fields.collection_status]
        distinguishing_aspect: "Creating a CNC sets account collection_status == CNC; revoking flips it back to ACTIVE_COLLECTION."
        test_recipe:
          setup: ["An account exists."]
          setup_api_calls:
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Cnc Co", tin: "200000034", filing_status: "INDIVIDUAL", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/cnc-determinations"
              payload: { tax_account_id: "${acct}", hardship_reason: "NO_DISPOSABLE_INCOME" }
              as: RevenueOfficer
              captures: { cnc_id: $.data.id }
          trigger:
            - call: "POST /collections/cnc-determinations/${cnc_id}/revoke"
              payload: {}
              as: RevenueOfficer
          assert:
            - "Before revoke: TaxAccount.${acct}.collection_status == CNC"
            - "After revoke: CncDetermination.${cnc_id}.status == REVOKED and TaxAccount.${acct}.collection_status == ACTIVE_COLLECTION"

      - name: sweep_with_nothing_expired_returns_error
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=15]", "errors[ERR_NOTHING_TO_SWEEP]"]
        distinguishing_aspect: "sweep-expired-csed on an account whose only period's csed_date is far in the future returns ERR_NOTHING_TO_SWEEP (422)."
        test_recipe:
          setup: ["Account, period assessed 2024-01-15 (csed 2034); clock 2024-04-15 (nothing expired)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "NoSweep Co", tin: "200000035", filing_status: "BUSINESS", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
          trigger:
            - call: "POST /collections/tax-accounts/${acct}/sweep-expired-csed"
              payload: {}
              as: RevenueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_NOTHING_TO_SWEEP"

      - name: csed_suspension_adjacent_interval_allowed
        claim_type: Valid Transition
        grounds: ["validations[priority=12]", state_machines.CsedSuspension.OPEN_to_CLOSED, entities.CsedSuspension.fields.end_at]
        distinguishing_aspect: >
          Half-open adjacency: after a suspension is CLOSED with end_at 2024-04-15, opening a
          new suspension with start_at == 2024-04-15 on the same period is NOT an overlap and
          succeeds (201). Confirms the half-open geometry the overlap rule pins.
        test_recipe:
          setup: ["Account, period; a first suspension opened at 2024-01-15 then closed at 2024-04-15."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Adj Co", tin: "200000036", filing_status: "BUSINESS", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_id: $.data.id }
            - call: "POST /collections/csed-suspensions"
              payload: { tax_period_id: "${period_id}", reason: "MANUAL", start_at: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { susp1: $.data.id }
            - call: "POST /collections/csed-suspensions/${susp1}/close"
              payload: { end_at: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
          trigger:
            - call: "POST /collections/csed-suspensions"
              payload: { tax_period_id: "${period_id}", reason: "MANUAL", start_at: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { susp2: $.data.id }
          assert:
            - "HTTP status == 201"
            - "CsedSuspension.${susp2}.end_at is null"

      - name: error_oic_default_cascade_already_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.OfferInCompromise.EVALUATING_to_ACCEPTED]
        excluded_because:
          difficulty_instance: transitive_cascade / oic_accept_depth3_payment_abate_account_resolve_agreement_close
          rationale: "OIC accept cascade (payment + abatement + RESOLVED + agreement CLOSE) is asserted end-to-end by the named §1.8 instance."

  # =================================================================
  - section: calculations
    instances:
      - name: payment_allocation_oldest_first_across_periods
        claim_type: Correct Result
        grounds: [calculations.payment_allocation, entities.Payment]
        distinguishing_aspect: >
          With period A (assessment 2020-01-01, balance 600000) and period B (assessment
          2022-01-01, balance 400000), a single untargeted payment of 700000 fully satisfies
          A (balance 0, SATISFIED) and applies 100000 to B (balance 300000) — oldest
          assessment_date first.
        test_recipe:
          setup: ["Account; period A older with balance 600000; period B newer with balance 400000 (use targeted payments to set exact balances, then an untargeted payment)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2022-01-01T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Alloc Co", tin: "200000040", filing_status: "BUSINESS", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2019, assessed_tax_cents: 600000, assessment_date: "2020-01-01T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_a: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2021, assessed_tax_cents: 400000, assessment_date: "2022-01-01T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_b: $.data.id }
          trigger:
            - call: "POST /collections/payments"
              payload: { tax_account_id: "${acct}", amount_cents: 700000, payment_source: "MANUAL" }
              as: RevenueOfficer
          assert:
            - "TaxPeriod.${period_a}.balance_due_cents == 0 and period_status == SATISFIED"
            - "TaxPeriod.${period_b}.balance_due_cents == 300000"

      - name: rcp_mid_tier_multiplier_boundary
        claim_type: Constants Applied
        grounds: [calculations.reasonable_collection_potential, entities.OfferInCompromise.fields.rcp_cents]
        distinguishing_aspect: >
          With assessment_date 2018-05-24 (csed 2028-05-24) and clock 2024-04-15, remaining
          is 50 months (band 25..60 -> MULT_MID=24): rcp_cents == net_realizable_equity
          500000 + mdi 300000 * 24 == 7700000.
        test_recipe:
          setup: ["Account mdi 300000; one period assessed 1000000 on 2018-05-24; clock 2024-04-15."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "MidRcp Co", tin: "200000041", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2017, assessed_tax_cents: 1000000, assessment_date: "2018-05-24T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/offers"
              payload: { tax_account_id: "${acct}", offer_amount_cents: 7700000, net_realizable_equity_cents: 500000 }
              as: RevenueOfficer
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /collections/offers/${offer_id}/begin-evaluation"
              payload: {}
              as: CaseReviewer
          assert:
            - "OfferInCompromise.${offer_id}.rcp_cents == 7700000"

      - name: offer_below_rcp_rejected_on_accept
        claim_type: Variant Selection
        grounds: ["validations[priority=13]", "errors[ERR_OFFER_BELOW_RCP]", calculations.reasonable_collection_potential]
        distinguishing_aspect: >
          With rcp_cents 18500000 in EVALUATING and offer_amount 18499999 (rcp - 1), accept
          returns ERR_OFFER_BELOW_RCP (422) — the strictly-below side of the >= boundary.
        test_recipe:
          setup: ["Account mdi 300000, period assessed 1000000 on 2024-01-15; clock 2024-04-15; offer 18499999 moved to EVALUATING (rcp 18500000)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "BelowRcp Co", tin: "200000042", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/offers"
              payload: { tax_account_id: "${acct}", offer_amount_cents: 18499999, net_realizable_equity_cents: 500000 }
              as: RevenueOfficer
              as_user_id: "officer-sub-42"
              captures: { offer_id: $.data.id }
            - call: "POST /collections/offers/${offer_id}/begin-evaluation"
              payload: {}
              as: CaseReviewer
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /collections/offers/${offer_id}/accept"
              payload: { expected_tax_account_version: "${acct_v}" }
              as: CaseReviewer
              as_user_id: "reviewer-acc-42"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_OFFER_BELOW_RCP"

      - name: error_penalty_round_order_already_covered
        claim_type: Precision
        grounds: [calculations.accrued_penalty, calculations.accrued_interest]
        excluded_because:
          difficulty_instance: combinatorial_formula / penalty_round_per_month_vs_interest_sum_then_round
          rationale: "Per-month-round-then-sum vs sum-then-round precision is asserted by the named §1.8 instance."

  # =================================================================
  - section: validations
    instances:
      - name: payment_fk_mismatch_cross_account_period
        claim_type: Cross-entity validation
        grounds: ["validations[priority=4]", "errors[ERR_FK_MISMATCH]"]
        distinguishing_aspect: "Posting a payment whose tax_period_id belongs to a DIFFERENT account than tax_account_id returns ERR_FK_MISMATCH (409)."
        test_recipe:
          setup: ["Two accounts; period P belongs to account 1; payment names account 2 with tax_period_id = P."]
          setup_api_calls:
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "FkA", tin: "200000050", filing_status: "BUSINESS", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
              captures: { acct1: $.data.id }
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "FkB", tin: "200000051", filing_status: "BUSINESS", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
              captures: { acct2: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct1}", tax_year: 2023, assessed_tax_cents: 500000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_p: $.data.id }
          trigger:
            - call: "POST /collections/payments"
              payload: { tax_account_id: "${acct2}", amount_cents: 1000, payment_source: "MANUAL", tax_period_id: "${period_p}" }
              as: RevenueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_FK_MISMATCH"

      - name: ppia_payoff_shape_rejected_when_full_payoff
        claim_type: Violation -> Error
        grounds: ["validations[priority=10]", "errors[ERR_PAYOFF_SHAPE_INVALID]"]
        distinguishing_aspect: >
          Approving a PPIA whose monthly_payment_cents*term_months (1200000) is >= the
          account total_balance_cents (1033000) violates the PPIA partial-by-design shape
          and returns ERR_PAYOFF_SHAPE_INVALID (422).
        test_recipe:
          setup: ["Account, period assessed 1000000 on 2024-01-15; clock 2024-04-15; recompute -> balance 1033000; a PROPOSED PPIA with monthly 200000 * 6 = 1200000 (full payoff, wrong for PPIA)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Ppia Co", tin: "200000052", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts/${acct}/recompute"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct}", agreement_type: "PPIA", payment_method: "MANUAL", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-04-15T00:00:00.000Z", active_to: "2024-10-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { agr: $.data.id }
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /collections/installment-agreements/${agr}/approve"
              payload: { expected_tax_account_version: "${acct_v}" }
              as: RevenueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_PAYOFF_SHAPE_INVALID"

      - name: lien_release_blocked_when_balance_positive
        claim_type: Cross-entity validation
        grounds: ["validations[priority=14]", "errors[ERR_LIEN_RELEASE_BLOCKED]"]
        distinguishing_aspect: >
          approve-release on a RELEASE_PENDING lien while total_balance_cents > 0 and no
          active DDIA agreement returns ERR_LIEN_RELEASE_BLOCKED (409) — the blocked side of
          the cross-entity guard (the success side is the §1.8 instance).
        test_recipe:
          setup: ["Account, period assessed 1000000 on 2024-01-15; clock 2024-04-15; recompute -> balance 1033000; lien FILED then RELEASE_PENDING; no payment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "LienBlk Co", tin: "200000053", filing_status: "BUSINESS", monthly_disposable_income_cents: 0 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts/${acct}/recompute"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/liens"
              payload: { tax_account_id: "${acct}", filed_amount_cents: 1000000 }
              as: RevenueOfficer
              captures: { lien_id: $.data.id }
            - call: "POST /collections/liens/${lien_id}/request-release"
              payload: {}
              as: RevenueOfficer
          trigger:
            - call: "POST /collections/liens/${lien_id}/approve-release"
              payload: {}
              as: CaseReviewer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_LIEN_RELEASE_BLOCKED"

      - name: oic_accept_same_user_segregation_violation
        claim_type: Violation -> Error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: >
          Accepting an OIC with X-User-ID equal to submitted_by_user_id returns
          ERR_SEGREGATION_OF_DUTIES (409), even though the offer is in EVALUATING and >= RCP.
        test_recipe:
          setup: ["Account, period assessed 1000000 on 2024-01-15; clock 2024-04-15; offer 18500000 submitted by officer-X and moved to EVALUATING; accept attempted by officer-X via CaseReviewer role with the same user id."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "Sod Co", tin: "200000054", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/offers"
              payload: { tax_account_id: "${acct}", offer_amount_cents: 18500000, net_realizable_equity_cents: 500000 }
              as: RevenueOfficer
              as_user_id: "same-user-54"
              captures: { offer_id: $.data.id }
            - call: "POST /collections/offers/${offer_id}/begin-evaluation"
              payload: {}
              as: CaseReviewer
              as_user_id: "same-user-54"
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /collections/offers/${offer_id}/accept"
              payload: { expected_tax_account_version: "${acct_v}" }
              as: CaseReviewer
              as_user_id: "same-user-54"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"

