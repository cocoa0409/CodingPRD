# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Multi-Tiered System of Supports (MTSS/RTI)
# 9 rule blocks × 2 instances = 18 instances
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — two calculations on DIFFERENT entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: risk_band_cut_score_vs_percentile
        grounds:
          - calculations.risk_band_classification
          - entities.ScreeningScore.fields.risk_band
        distinguishing_aspect: |
          Risk-band classification on ScreeningScore (different entity domain from plan-level
          slope decisions): identical (raw_score, cohort) inputs yield TIER_3 under CUT_SCORE
          but TIER_1 under PERCENTILE because the cohort has many low performers.
        test_recipe:
          setup:
            - "District D, School S (grades 3-5), ScreeningWindow W (FALL, OPEN)"
            - "BenchmarkCutPoint for (FALL, grade=3, READING): tier2_max=120, tier3_max=90"
            - "10 grade-3 students enrolled; 9 already have READING raw_scores in {60..80} (below tier3)"
            - "Student X (grade 3) exists with no score yet"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 120, tier3_max_score: 90 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: PlatformAdmin
            # 9 low performers, each scoring 60 (below tier3_max=90) so cohort is bottom-heavy
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "L1", grade_level: 3 }
              as: SchoolRegistrar
              captures: { l1: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${l1}", subject: "READING", raw_score: 60 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "L2", grade_level: 3 }
              as: SchoolRegistrar
              captures: { l2: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${l2}", subject: "READING", raw_score: 60 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "L3", grade_level: 3 }
              as: SchoolRegistrar
              captures: { l3: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${l3}", subject: "READING", raw_score: 62 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "L4", grade_level: 3 }
              as: SchoolRegistrar
              captures: { l4: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${l4}", subject: "READING", raw_score: 65 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "L5", grade_level: 3 }
              as: SchoolRegistrar
              captures: { l5: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${l5}", subject: "READING", raw_score: 70 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "L6", grade_level: 3 }
              as: SchoolRegistrar
              captures: { l6: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${l6}", subject: "READING", raw_score: 72 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "L7", grade_level: 3 }
              as: SchoolRegistrar
              captures: { l7: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${l7}", subject: "READING", raw_score: 75 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "L8", grade_level: 3 }
              as: SchoolRegistrar
              captures: { l8: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${l8}", subject: "READING", raw_score: 78 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "L9", grade_level: 3 }
              as: SchoolRegistrar
              captures: { l9: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${l9}", subject: "READING", raw_score: 80 }
              as: Teacher
            # Target student X
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "X", grade_level: 3 }
              as: SchoolRegistrar
              captures: { x_id: $.data.id }
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${x_id}", subject: "READING", raw_score: 95 }
              as: Teacher
              captures: { x_band: $.data.risk_band }
          assert:
            - "CUT_SCORE variant: raw_score=95 vs tier3_max_score=90 → 95 > 90 so NOT TIER_3; 95 <= tier2_max_score=120 → risk_band == TIER_2"
            - "ScreeningScore.${x_band} == 'TIER_2'"
            - "Under PERCENTILE variant (computed for this assertion only): cohort = {60,60,62,65,70,72,75,78,80,95}, N=10, score 95 is rank 10, percentile = 10/11*100 = 90.9 ≥ TIER2_PCTILE=25 → would be TIER_1, proving variants diverge on identical inputs"

      - name: slope_decision_slope_vs_endpoint
        grounds:
          - calculations.slope_decision
          - entities.ProgressProbe.fields.slope_decision
        distinguishing_aspect: |
          Slope-decision on ProgressProbe (different entity domain from ScreeningScore risk band):
          same 4 trailing probes produce RESPONSIVE under the SLOPE variant (rising regression)
          but NON_RESPONSIVE under the ENDPOINT variant (latest score below aimline).
        test_recipe:
          setup:
            - "District D, School S, FALL cut point (tier2_max=130, tier3_max=90, grade=3, READING)"
            - "Student Y at grade 3 with baseline ScreeningScore raw_score=100 in SCORED FALL window, current_tier=TIER_2 (via ratified TierMovement)"
            - "Catalog entry: READING, TIER_2, grade 3-5, session_minutes=30, sessions_per_week=3, probe_frequency=WEEKLY"
            - "Interventionist I with capacity 600, subjects=[READING]"
            - "Plan P ACTIVE on Y with that entry + interventionist; weekly_minute_cost=90"
            - "probe_due_on is in the past so each probe is admissible"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 130, tier3_max_score: 90 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "Y", grade_level: 3 }
              as: SchoolRegistrar
              captures: { y_id: $.data.id, y_v0: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${y_id}", subject: "READING", raw_score: 100 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/score"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-09-01" }
              as: TeamLead
              captures: { m_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/convene"
              payload: {}
              as: TeamLead
            # Ratify the auto-proposed TIER_2 movement (created by /score cascade).
            # We need the movement id; list movements for student Y and capture the first.
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${y_id}/tier-movements"
              payload: {}
              as: TeamLead
              captures: { mv_id: "$.data[0].id" }
            # After /score cascade, Student.version has advanced (plan not yet created,
            # but the TierMovement auto-create incremented Student.version via list flow).
            # Read the student to get the current version.
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${y_id}"
              payload: {}
              as: TeamLead
              captures: { y_v1: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/ratify"
              payload: { movement_id: "${mv_id}", expected_student_version: "${y_v1}" }
              as: TeamLead
            # Interventionist and catalog entry
            - call: "POST /districts/${d_id}/intervention-catalog"
              payload: { title: "ReadNat", subject: "READING", tier_target: "TIER_2", grade_min: 3, grade_max: 5, session_minutes: 30, sessions_per_week: 3, probe_frequency: "WEEKLY" }
              as: DistrictCoordinator
              captures: { ce_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/interventionists"
              payload: { full_name: "I", weekly_minute_capacity: 600, subjects: ["READING"] }
              as: SchoolRegistrar
              captures: { i_id: $.data.id }
            # Read student again for OCC after ratify
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${y_id}"
              payload: {}
              as: TeamLead
              captures: { y_v2: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${y_id}/plans"
              payload: { catalog_entry_id: "${ce_id}", interventionist_id: "${i_id}", expected_student_version: "${y_v2}" }
              as: TeamLead
              captures: { p_id: $.data.id }
            # Advance clock past probe_due_on (started_on + 7 days = 2026-08-17)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: PlatformAdmin
            # Aimline: baseline=100, goal=130, WEEKLY → TOTAL_PROBES=8
            # k=1 aimline = 100 + 30*1/8 = 103.75 → 104 (round_half_up)
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${y_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-08-18", score: 102 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            # k=2 aimline = 100 + 30*2/8 = 107.5 → 108 (round_half_up)
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${y_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-08-25", score: 105 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            # k=3 aimline = 100 + 30*3/8 = 111.25 → 111
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${y_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-09-01", score: 109 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            # k=4 aimline = 100 + 30*4/8 = 115.0 → 115
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${y_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-09-08", score: 113 }
              as: InterventionistRole
              as_user_id: "${i_id}"
              captures: { probe4_decision: $.data.slope_decision, probe4_aimline: $.data.aimline_score }
          assert:
            # Trailing 4 probes (the entire window): scores=[102,105,109,113], aimlines=[104,108,111,115]
            # Slope of scores:  b = 18.5/5 = 3.7
            # Slope of aimlines: a = 18/5 = 3.6
            # 3.7 >= 3.6 → RESPONSIVE under SLOPE variant
            - "ProgressProbe.slope_decision == 'RESPONSIVE' (SLOPE variant: regression slope 3.7 >= aimline slope 3.6)"
            - "ProgressProbe.aimline_score == 115 (k=4, baseline=100, goal=130, TOTAL_PROBES=8)"
            - "Under ENDPOINT variant the same trailing window gives score=113 < aimline=115 → NON_RESPONSIVE; the two variants diverge on identical probe data"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — instances in DIFFERENT modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tier_movement_eligibility_multi_input
        grounds:
          - calculations.tier_movement_eligibility
          - validations[priority=9]
        distinguishing_aspect: |
          Mode (a) — ≥3 inputs with non-linear interaction (current_tier × latest_band × probe history).
          A TIER_2→TIER_3 movement is permitted either when latest_band==TIER_3 (screening path)
          OR when the last 4 probes are NON_RESPONSIVE and an ACTIVE plan exists (progress-monitoring path);
          the two paths have different evidence requirements and a single failing sub-clause flips the outcome.
        test_recipe:
          setup:
            - "District D, School S, student Z at TIER_2 (ratified movement), latest FALL window risk_band == TIER_2 (NOT TIER_3)"
            - "Z has an ACTIVE plan with 4 probes all NON_RESPONSIVE"
            - "Z has NO TIER_3 screen evidence"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 120, tier3_max_score: 90 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "Z", grade_level: 3 }
              as: SchoolRegistrar
              captures: { z_id: $.data.id }
            # Z screens into TIER_2 (raw_score=95, between 90 and 120)
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${z_id}", subject: "READING", raw_score: 95 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/score"
              payload: {}
              as: DistrictCoordinator
            # Ratify the auto-proposed TIER_2 movement
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-09-01" }
              as: TeamLead
              captures: { m_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/convene"
              payload: {}
              as: TeamLead
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${z_id}/tier-movements"
              payload: {}
              as: TeamLead
              captures: { mv_id: "$.data[0].id" }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${z_id}"
              payload: {}
              as: TeamLead
              captures: { z_v: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/ratify"
              payload: { movement_id: "${mv_id}", expected_student_version: "${z_v}" }
              as: TeamLead
            # Build a TIER_2 plan and run 4 NON_RESPONSIVE probes
            - call: "POST /districts/${d_id}/intervention-catalog"
              payload: { title: "MathBoost", subject: "READING", tier_target: "TIER_2", grade_min: 3, grade_max: 5, session_minutes: 30, sessions_per_week: 2, probe_frequency: "WEEKLY" }
              as: DistrictCoordinator
              captures: { ce_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/interventionists"
              payload: { full_name: "I", weekly_minute_capacity: 600, subjects: ["READING"] }
              as: SchoolRegistrar
              captures: { i_id: $.data.id }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${z_id}"
              payload: {}
              as: TeamLead
              captures: { z_v2: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${z_id}/plans"
              payload: { catalog_entry_id: "${ce_id}", interventionist_id: "${i_id}", expected_student_version: "${z_v2}" }
              as: TeamLead
              captures: { p_id: $.data.id }
            # 4 probes with FLAT scores so slope << aimline slope (aimline is rising 30/8=3.75/wk)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${z_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-08-18", score: 95 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${z_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-08-25", score: 95 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${z_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-09-01", score: 96 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${z_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-09-08", score: 96 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            # Read student for current OCC version
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${z_id}"
              payload: {}
              as: TeamLead
              captures: { z_v3: $.data.version }
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${z_id}/tier-movements"
              payload: { to_tier: "TIER_3", rationale: "4 consecutive non-responsive probes at TIER_2", expected_student_version: "${z_v3}" }
              as: TeamLead
              captures: { new_mv: $.data.id, new_mv_status: $.data.status }
          assert:
            - "TierMovement.${new_mv}.status == 'PROPOSED' (progress-monitoring path succeeded despite latest_band==TIER_2)"
            - "TierMovement.${new_mv}.from_tier == 'TIER_2' and to_tier == 'TIER_3'"
            - "Latest FALL risk_band is TIER_2 (raw 95 > tier3_max 90), so the screening path alone would NOT have authorized this movement"

      - name: fidelity_pct_per_week_then_average
        grounds:
          - calculations.fidelity_pct
          - entities.StudentPlan.fields.fidelity_pct
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. fidelity_pct rounds per-week (floor)
          then averages (floor), NOT sum-then-divide. 7 DELIVERED of 8 total sessions split
          4/5 then 3/3 yields 90 under the pinned order but 87 under naive sum-then-divide.
        test_recipe:
          setup:
            - "Plan P ACTIVE for student Q; catalog session_minutes=30, sessions_per_week=3 (weekly cost 90)"
            - "Two ISO weeks of sessions logged: week1 has 5 sessions (4 DELIVERED, 1 STUDENT_ABSENT); week2 has 3 sessions (all DELIVERED)"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "Q", grade_level: 4 }
              as: SchoolRegistrar
              captures: { q_id: $.data.id }
            - call: "POST /districts/${d_id}/intervention-catalog"
