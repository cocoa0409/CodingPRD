        grounds:
          - rbac.RetailAssociate.exclusive_operations
          - rbac.ProgramAdmin.exclusive_operations
          - rbac.CreditUnderwriter.exclusive_operations
          - validations.priority_5_ERR_UNAUTHORIZED
        distinguishing_aspect: |
          ProgramAdmin is deliberately NOT a blanket override: it cannot originate a loan or
          request a device unlock, an associate cannot publish a catalog model or file an
          underwriting decision, and a collections officer cannot touch the clock. The role gate
          at priority 5 also outranks every state rule — the decision attempt on an
          already-decided application returns ERR_UNAUTHORIZED, not ERR_APPLICATION_NOT_DECIDABLE.
        test_recipe:
          setup:
            - "Two PRIME applications decided at zero exposure (Handset B 89900, Handset C 49900); the first is originated so a DeviceUnit exists, the second is left APPROVED and un-originated."
