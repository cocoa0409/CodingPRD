# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2832 - Inland Marine & Equipment Floater Underwriting
#
# Every instance grounds exclusively in SCAFFOLD.yaml SS1.1-SS1.7. Every money
# literal below was produced by executing the relevant calculations[].formula
# with its declared constants over the pinned inputs (exact-rational product,
# single round_half_up where the formula says so).
#
# The logical clock starts at exactly 2026-08-01T00:00:00Z, so any chain that
# does not call POST /_clock/set_current_utc is rating at model year age
# 2026 - model_year.
# ===========================================================================

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: scheduled_versus_blanket_equipment_basis_divergence
        grounds:
          - calculations.coverage_part_equipment_premium
          - calculations.policy_written_premium
          - calculations.equipment_item_premium
          - entities.CoveragePart.fields.rating_basis
          - entities.Policy.fields.scheduled_basis_premium_cents
          - entities.Policy.fields.blanket_basis_premium_cents
          - endpoints.PATCH /inland-marine/coverage-parts/{id}
        distinguishing_aspect: |
          On one identical two-item schedule the SCHEDULED variant sums per-item
          premiums to 182304 while the BLANKET variant re-rates the 10000000
          blanket limit at the insured-value-weighted rate of 175 bp with the
          10600 bp blanket load, which is 185500 before the 500 bp coinsurance
          credit and 176225 after it, so the same policy writes 189596 on
          SCHEDULED and 183274 on BLANKET - a 6322-cent delta that no
          single-variant implementation can produce.
        test_recipe:
          setup:
            - "Two PUBLISHED rate cells in T2_URBAN: EXCAVATOR age band 0-5 at 180 bp grade A, GENERATOR age band 6-12 at 120 bp grade C."
            - "One DRAFT Policy, territory T2_URBAN, term 2026-08-01 to 2027-08-01 (term_days 365), minimum_premium_cents 100000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart on it: valuation_basis ACV, rating_basis SCHEDULED, deductible 100000, per_item_limit 20000000, aggregate_limit 200000000, blanket_limit 10000000, coinsurance_pct_bp 9000."
            - "Two RATED EquipmentItems on that part: E1 EXCAVATOR model_year 2022 original_cost 12000000 (age 4, insured 8160000) and E2 GENERATOR model_year 2018 original_cost 2000000 (age 8, insured 720000). Neither carries a geo tracker, neither sits on a jobsite, so applied_credit_bp is 0 on both."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "GENERATOR", territory_code: "T2_URBAN", age_band_min_years: 6, age_band_max_years: 12, base_rate_bp: 120, theft_hazard_grade: "C" }
              as: Actuary
              captures: { rr_gen: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_gen}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ridgeline Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000, blanket_limit_cents: 10000000, coinsurance_pct_bp: 9000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "E1 excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_e1: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "E2 generator", equipment_type: "GENERATOR", model_year: 2018, original_cost_cents: 2000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v2}" }
              as: Underwriter
              captures: { item_e2: $.data.id }
          trigger:
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/policies/${pol}/premium-summary"
              payload: {}
              as: Underwriter
            - call: "PATCH /inland-marine/coverage-parts/${cp}"
              payload: { rating_basis: "BLANKET" }
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
          assert:
            - "EquipmentItem.${item_e1}.insured_value_cents == 8160000"
            - "EquipmentItem.${item_e1}.applied_base_rate_bp == 180"
            - "EquipmentItem.${item_e1}.applied_credit_bp == 0"
            - "EquipmentItem.${item_e1}.rated_premium_cents == 173318"
            - "EquipmentItem.${item_e2}.insured_value_cents == 720000"
            - "EquipmentItem.${item_e2}.rated_premium_cents == 8986"
            - "after trigger[0]: CoveragePart.${cp}.rated_premium_cents == 182304"
            - "after trigger[0]: Policy.${pol}.sum_of_part_premiums_cents == 182304"
            - "after trigger[0]: Policy.${pol}.written_premium_cents == 189596"
            - "after trigger[0]: Policy.${pol}.total_insured_value_cents == 8880000"
            - "trigger[1] response: scheduled_basis_premium_cents == 189596"
            - "trigger[1] response: blanket_basis_premium_cents == 183274"
            - "trigger[1] response: written_premium_cents == 189596"
            - "trigger[1] response: minimum_premium_applied == false"
            - "trigger[1] response: referral_required == false"
            - "after trigger[2]: CoveragePart.${cp}.rating_basis == BLANKET"
            - "after trigger[3]: CoveragePart.${cp}.rated_premium_cents == 176225"
            - "after trigger[3]: Policy.${pol}.written_premium_cents == 183274"
            - "after trigger[3]: Policy.${pol}.scheduled_basis_premium_cents == 189596"
            - "after trigger[3]: Policy.${pol}.blanket_basis_premium_cents == 183274"
            - "Policy.${pol}.scheduled_basis_premium_cents - Policy.${pol}.blanket_basis_premium_cents == 6322"
            - "EquipmentItem.${item_e1}.rated_premium_cents and EquipmentItem.${item_e2}.rated_premium_cents are unchanged by trigger[2] and trigger[3] (the blanket variant does not touch item rows)"

      - name: repair_versus_total_loss_settlement_divergence
        grounds:
          - calculations.claim_settlement_amount
          - calculations.claim_loss_valuation
          - state_machines.Claim.INSPECTED_to_REPAIR_APPROVED
          - state_machines.Claim.INSPECTED_to_TOTAL_LOSS_DECLARED
          - entities.Claim.fields.repair_basis_settlement_cents
          - entities.Claim.fields.total_loss_basis_settlement_cents
          - endpoints.GET /inland-marine/claims/{id}/settlement-worksheet
        distinguishing_aspect: |
          On one inspected claim the REPAIR variant prices the 3000000 repair
          estimate to 2900000 while the TOTAL_LOSS variant prices the 8160000
          insured valuation to 8060000 - a 5160000 divergence driven by a
          different gross loss, not a ratio - and only the TOTAL_LOSS branch arms
          the salvage axis, so choosing REPAIR leaves salvage_status
          NOT_APPLICABLE and the item on risk.
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, written_premium_cents 180251, premium_balance_cents 180251."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart: ACV, SCHEDULED, deductible 100000, per_item_limit 20000000, aggregate_limit 200000000, aggregate_available 200000000."
            - "One ACTIVE EquipmentItem E1 on it: insured_value_cents 8160000, rated_premium_cents 173318."
            - "Logical clock at 2026-08-20T00:00:00Z; one INSPECTED Claim on E1 with repair_estimate_cents 3000000 and actual_value_at_loss_cents 8160000, inspected by user adj-1."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ridgeline Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "E1 excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_e1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${item_e1}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: UnderwritingManager
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp}", loss_date: "2026-08-15", loss_type: "COLLISION", equipment_item_id: "${item_e1}" }
              as: Underwriter
              captures: { clm: $.data.id }
            - call: "POST /inland-marine/claims/${clm}/inspect"
              payload: { repair_estimate_cents: 3000000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - call: "GET /inland-marine/claims/${clm}/settlement-worksheet"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/adjust"
              payload: { adjustment_basis: "REPAIR" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "trigger[0] response: valuation_at_loss_cents == 8160000"
            - "trigger[0] response: constructive_total_loss_threshold_cents == 6120000"
            - "trigger[0] response: constructive_total_loss_reached == false"
            - "trigger[0] response: underreporting_factor_bp == 10000"
            - "trigger[0] response: claim_limit_cents == 20000000"
            - "trigger[0] response: deductible_cents == 100000"
            - "trigger[0] response: loss_of_use_paid_cents == 0"
            - "trigger[0] response: repair_basis_settlement_cents == 2900000"
            - "trigger[0] response: total_loss_basis_settlement_cents == 8060000"
            - "trigger[0] response: repair_basis_selectable == true"
            - "trigger[0] response: aggregate_available_cents == 200000000"
            - "trigger[0] response: total_loss_basis_settlement_cents - repair_basis_settlement_cents == 5160000"
            - "after trigger[1]: Claim.${clm}.settlement_amount_cents == 2900000"
            - "after trigger[1]: Claim.${clm}.adjustment_basis == REPAIR"
            - "after trigger[1]: Claim.${clm}.adjustment_status == REPAIR_APPROVED"
            - "after trigger[1]: Claim.${clm}.salvage_status == NOT_APPLICABLE"
            - "after trigger[1]: Claim.${clm}.total_loss_basis_settlement_cents == 8060000 (the unchosen variant stays stored)"
            - "after trigger[1]: Claim.${clm}.declared_by_user_id == adj-1"
            - "after trigger[1]: EquipmentItem.${item_e1}.status == ACTIVE"
            - "after trigger[1]: CoveragePart.${cp}.rated_premium_cents == 173318"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: equipment_premium_five_factor_product_with_credit_cap
        grounds:
          - calculations.equipment_item_premium
          - calculations.equipment_insured_value
          - calculations.jobsite_security_tier
          - calculations.rate_rule_selection
          - entities.EquipmentItem.fields.applied_credit_bp
          - entities.Jobsite.fields.security_tier
        distinguishing_aspect: |
          One item premium is the product of five independent inputs - insured
          value 8160000, base rate 180 bp, ACV valuation factor 10000 bp, grade-A
          theft factor 11800 bp and the credit complement - rounded exactly once,
          and the credit input is itself the capped sum of two credits, so the
          four combinations 0 / 1500 / 1200 / min(2500, 1500+1200) yield 173318 /
          147321 / 152520 / 129989 where the fourth is strictly larger than the
          uncapped 2700 bp product would be.
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One SURVEYED Jobsite J3 in T2_URBAN with fenced, lighting, alarm_monitored and guarded_24h all true: security_score 5, security_tier TIER_3, security credit 1200 bp."
            - "One DRAFT Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, with one ACTIVE SCHEDULED_EQUIPMENT CoveragePart (ACV, SCHEDULED, per_item_limit 20000000, aggregate_limit 200000000)."
            - "Three RATED EquipmentItems, all EXCAVATOR model_year 2022 original_cost_cents 12000000 so all three carry insured_value_cents 8160000: I_PLAIN (no tracker, no jobsite), I_TRK (tracker, no jobsite), I_SEC (no tracker, on J3)."
            - "Logical clock untouched at 2026-08-01T00:00:00Z so age_years_at_rating is 4 on every item."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/jobsites"
              payload: { name: "J3 hardened yard", territory_code: "T2_URBAN" }
              as: Underwriter
              captures: { js3: $.data.id }
            - call: "POST /inland-marine/jobsites/${js3}/security-survey"
              payload: { fenced: true, lighting: true, alarm_monitored: true, guarded_24h: true }
              as: Underwriter
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ridgeline Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "I_PLAIN", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it_plain: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "I_TRK", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: true, expected_policy_version: "${pol_v2}" }
              as: Underwriter
              captures: { it_trk: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v3: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "I_SEC", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: false, assigned_jobsite_id: "${js3}", expected_policy_version: "${pol_v3}" }
              as: Underwriter
              captures: { it_sec: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v4: $.data.version }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "I_FULL", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: true, assigned_jobsite_id: "${js3}", expected_policy_version: "${pol_v4}" }
              as: Underwriter
              captures: { it_full: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
          assert:
            - "Jobsite.${js3}.security_score == 5"
            - "Jobsite.${js3}.security_tier == TIER_3"
            - "EquipmentItem.${it_plain}.age_years_at_rating == 4"
            - "EquipmentItem.${it_plain}.insured_value_cents == 8160000"
            - "EquipmentItem.${it_plain}.applied_credit_bp == 0"
            - "EquipmentItem.${it_plain}.rated_premium_cents == 173318"
            - "EquipmentItem.${it_trk}.applied_credit_bp == 1500"
            - "EquipmentItem.${it_trk}.rated_premium_cents == 147321"
            - "EquipmentItem.${it_sec}.applied_credit_bp == 1200"
            - "EquipmentItem.${it_sec}.rated_premium_cents == 152520"
            - "after trigger[0]: EquipmentItem.${it_full}.applied_credit_bp == 2500"
            - "after trigger[0]: EquipmentItem.${it_full}.rated_premium_cents == 129989"
            - "after trigger[0]: EquipmentItem.${it_full}.insured_value_cents == 8160000"
            - "after trigger[0]: EquipmentItem.${it_full}.applied_base_rate_bp == 180"
            - "after trigger[1]: CoveragePart.${cp}.rated_premium_cents == 603148"
            - "after trigger[1]: Policy.${pol}.sum_of_part_premiums_cents == 603148"
            - "after trigger[1]: Policy.${pol}.written_premium_cents == 627274"
            - "after trigger[1]: Policy.${pol}.total_insured_value_cents == 32640000"
            - "after trigger[1]: Policy.${pol}.referral_required == false"

      - name: transit_premium_three_limit_tier_keyed_on_pre_surcharge_base
        grounds:
          - calculations.transit_coverage_premium
          - calculations.policy_written_premium
          - entities.CoveragePart.fields.transit_owned_limit_cents
          - entities.CoveragePart.fields.transit_hired_limit_cents
          - entities.CoveragePart.fields.catastrophe_limit_cents
        distinguishing_aspect: |
          A transit part's premium combines three independent limits through two
          different rates and a tier index that is read off the summed,
          separately-rounded, PRE-surcharge base: part A (owned 10000000, hired
          4000000) bases at 103000 and lands in CAT_TIER_2 for 553000, while part
          B (owned 40000000, hired 8000000) bases at 336000 and crosses into
          CAT_TIER_3 for 1596000, so the same 900 bp surcharge cannot explain
          both.
        test_recipe:
          setup:
            - "One DRAFT Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, with no equipment at all."
            - "TRANSIT CoveragePart A: valuation_basis ACV, transit_owned_limit_cents 10000000, transit_hired_limit_cents 4000000, catastrophe_limit_cents 5000000, aggregate_limit_cents 200000000."
            - "TRANSIT CoveragePart B: valuation_basis ACV, transit_owned_limit_cents 40000000, transit_hired_limit_cents 8000000, catastrophe_limit_cents 9000000, aggregate_limit_cents 200000000."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ridgeline Haulage", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", aggregate_limit_cents: 200000000, transit_owned_limit_cents: 10000000, transit_hired_limit_cents: 4000000, catastrophe_limit_cents: 5000000 }
              as: Underwriter
              captures: { cp_a: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", aggregate_limit_cents: 200000000, transit_owned_limit_cents: 40000000, transit_hired_limit_cents: 8000000, catastrophe_limit_cents: 9000000 }
              as: Underwriter
              captures: { cp_b: $.data.id }
          trigger:
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/policies/${pol}/premium-summary"
              payload: {}
              as: Underwriter
          assert:
            - "CoveragePart.${cp_a}.rated_premium_cents == 553000"
            - "CoveragePart.${cp_b}.rated_premium_cents == 1596000"
            - "Policy.${pol}.sum_of_part_premiums_cents == 2149000"
            - "Policy.${pol}.written_premium_cents == 2234960"
            - "trigger[1] response: sum_of_part_premiums_cents == 2149000"
            - "trigger[1] response: expense_load_bp == 10400"
            - "trigger[1] response: written_premium_cents == 2234960"
            - "trigger[1] response: scheduled_basis_premium_cents == 2234960"
            - "trigger[1] response: blanket_basis_premium_cents == 2234960"
            - "trigger[1] response: minimum_premium_applied == false"
            - "trigger[1] response: referral_required == false"
            - "Policy.${pol}.total_insured_value_cents == 0"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: policy_suspend_and_cure_cycle_through_report_supersede
        grounds:
          - state_machines.Policy.IN_FORCE_to_SUSPENDED
          - state_machines.Policy.SUSPENDED_to_IN_FORCE
          - state_machines.ValueReport.DELINQUENT_to_SUPERSEDED
          - state_machines.ValueReport.SUBMITTED_to_PENALIZED
          - calculations.reporting_period_earned_premium
          - endpoints.POST /inland-marine/coverage-parts/{id}/reporting-sweep
        distinguishing_aspect: |
          The Policy re-enters a state it already left: IN_FORCE -> SUSPENDED is
          driven by a delinquency sweep on a child ValueReport and the reverse
          edge SUSPENDED -> IN_FORCE is driven by that report being SUPERSEDED,
          so the same policy row visits IN_FORCE twice with different
          premium_balance_cents (100000 then 121021) - a cycle no forward-only
          status ladder can express.
        test_recipe:
          setup:
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, term_days 365, minimum_premium_cents 100000, written_premium_cents 100000 (the minimum floor), premium_balance_cents 100000 from its INITIAL_PREMIUM entry."
