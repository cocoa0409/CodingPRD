      - name: verification_quota_pinned_to_pre_verification_snapshot
        grounds:
          - calculations.certification_verification_quota
          - calculations.edit_check_evaluation
          - entities.EditRun.fields.required_verified_quota
          - entities.EditRun.fields.snapshot_record_count
          - state_machines.EditException.OPEN_to_VERIFIED
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency with a pinned evaluation order.
          required_verified_quota is derived from snapshot_record_count, yet
          verifying an exception moves the record to CLEARED and would change any
          freshly recomputed reportable count. Because the base is frozen at run
          start, required_verified_quota stays 1 after the verification instead of
          collapsing to 0, and EditRun.snapshot_record_count stays 1 even though
          cleared_record_count moves 0 -> 1.
