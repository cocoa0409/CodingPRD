- rule_id: priority_pair_validation_conflict
  instances:
  - name: trial_state_check_at_fifty_outranks_the_window_check_at_seventysix
    grounds: validations.transition_legal_from_current_state (priority 50, ERR_TRIAL_NOT_IN_PROGRESS); validations.trial_window_elapsed
      (priority 76, ERR_TRIAL_WINDOW_NOT_ELAPSED); state_machines.TrialEngagement
    mechanism: A trial that was never started and whose end_at is still in the future violates both rules at once.
      The state check sits at priority 50 and the temporal check at 76, so the state error is the one returned; the
      clock is deliberately left three hours short of end_at so that the lower-priority rule is genuinely violated
      too.
    naive_implementation: Validate the temporal precondition before the state precondition (a natural order if the
      clock check is written inline at the top of the handler), returning ERR_TRIAL_WINDOW_NOT_ELAPSED.
    distinguishing_aspect: Both rules are violated by the same request and the response is ERR_TRIAL_NOT_IN_PROGRESS,
      not ERR_TRIAL_WINDOW_NOT_ELAPSED.
