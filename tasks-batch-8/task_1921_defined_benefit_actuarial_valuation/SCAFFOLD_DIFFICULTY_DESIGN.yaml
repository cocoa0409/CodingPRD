  # ===================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_pool_conservation_across_create_revoke
        grounds:
          - calculations.credit_balance_waterfall
          - entities.CreditBalanceLedger.fields.total_applied_to_date
          - state_machines.CreditBalanceElection.transitions.EFFECTIVE_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity Q1 (credit pool): carryover_balance +
          prefunding_balance + total_applied_to_date == 5000.00 invariant under
          an election create (forward) + revoke (compensating) pair — the pool
          neither leaks nor grows.
        test_recipe:
          setup:
            - "Family A plan with carryover 2000 / prefunding 3000 (Q1 baseline 5000.00); demand OPEN tentative 2839.98"
            - "Election of 1000.00 created then revoked within its window"
          setup_api_calls:
