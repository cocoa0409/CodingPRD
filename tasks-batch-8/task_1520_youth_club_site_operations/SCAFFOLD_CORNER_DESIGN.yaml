            - { call: "POST /behavior-incidents/${inc}/resolve-appeal", payload: { decision: "UPHELD" }, as: SiteDirector, as_user_id: "${d2}" }
          assert:
            - "first resolve (adjudicator d1): error_id == ERR_SEGREGATION_OF_DUTIES (403); suspension_status remains APPEALED"
            - "second resolve (d2, UPHELD): suspension_status == RESCINDED"
            - "Member.${m1}.status == ACTIVE (no other ACTIVE suspension) and behavior_points == 0 (rescinded incident un-counted)"

  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: c_occ_award_activate_stale_fund_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[award-activate-stale-fund]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential activations carrying the same observed fund version: the first succeeds (fund.version 1 -> 2), the second is rejected ERR_STALE_VERSION (412) — deterministic OCC, no parallelism."
        test_recipe:
          setup: ["fund budget 100000 (version captured at creation); ACTIVE member; awards aw1 and aw2 PENDING (caps 1000 each; creation does not touch the fund)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club S", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid A", date_of_birth: "2012-01-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /scholarship-funds"
              payload: { site_id: "${site_id}", name: "Fund S", budget_cents: 100000 }
              as: PlatformAdmin
              captures: { fund: $.data.id, fund_v: $.data.version }
            - call: "POST /scholarship-awards"
              payload: { fund_id: "${fund}", member_id: "${m1}", discount_pct: 0.50, weekly_cap_cents: 500, annual_cap_cents: 1000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { aw1: $.data.id }
            - call: "POST /scholarship-awards"
              payload: { fund_id: "${fund}", member_id: "${m1}", discount_pct: 0.25, weekly_cap_cents: 500, annual_cap_cents: 1000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { aw2: $.data.id }
          trigger:
            - { call: "POST /scholarship-awards/${aw1}/activate", payload: { expected_fund_version: "${fund_v}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /scholarship-awards/${aw2}/activate"
              payload: { expected_fund_version: "${fund_v}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first activate succeeds: aw1 ACTIVE; fund.version advanced to 2, reserved_cents == 1000"
            - "second activate with the SAME observed version: error_id == ERR_STALE_VERSION, http 412"
            - "aw2 remains PENDING; fund.reserved_cents remains 1000 (no partial mutation)"

      - name: c_occ_fee_payment_stale_member_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fee-payment-stale-member]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC pattern on a different parent (Member): two sequential payments carrying the version observed at approval — the first succeeds (balance 2500 -> 1500, version 2 -> 3), the second is rejected ERR_STALE_VERSION."
        test_recipe:
          setup: ["FREE-tier member approved; member version captured from the decide response"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club S", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid A", date_of_birth: "2012-01-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - call: "POST /members/${m1}/decide"
              payload: { decision: "APPROVE" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { mv: $.data.version }
          trigger:
            - { call: "POST /members/${m1}/fee-payments", payload: { amount_cents: 1000, expected_member_version: "${mv}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /members/${m1}/fee-payments"
              payload: { amount_cents: 1000, expected_member_version: "${mv}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first payment: fee_balance_cents == 1500 (2500 - 1000) and version == 3"
            - "second payment (stale version): error_id == ERR_STALE_VERSION, http 412; balance remains 1500"

      - name: c_cascading_side_effects_corner
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: transitive_cascade / credential_lapse_cancels_staff_assignment_flips_day_posture
          rationale: "Depth-3 cascade asserted end-to-end by the named §1.8 instance; the depth-2 withdraw cascade by transitive_cascade / member_withdraw_revokes_award_releases_fund_reservation."

      - name: c_ops_run_checkpoint_corner
        claim_type: ops_run_checkpoint
        grounds: ["complexity_profile.complexity_layers", "state_machines.ClubDay"]
        excluded_because:
          difficulty_instance: combinatorial_formula / scholarship_disbursement_nested_min_weekly_cap_then_annual_cap
          rationale: "Weekday-gated accrual at close asserted by the named §1.8 instance; close-sweep tally effects by compensating_invariant / attendance_tally_conservation_through_signin_signout_close."

