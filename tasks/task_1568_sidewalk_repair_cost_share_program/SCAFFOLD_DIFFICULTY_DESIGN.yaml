            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-B", work_window_start: "2026-10-15", work_window_end: "2026-11-15", bid_deadline: "2026-09-25T00:00:00Z" }, as: ProgramCoordinator, captures: { batchB: "$.data.id" } }
