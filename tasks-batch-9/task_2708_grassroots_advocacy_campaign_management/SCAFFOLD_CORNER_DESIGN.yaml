            - "GET /advocacy/message-variants as MessageStrategist -> response data is an empty array and meta total_count == 0"
            - "Campaign.${camp_id}.status == DRAFT"
            - "Campaign.${camp_id}.version == 1"

      - name: entity_backed_roles_cannot_act_for_another_partner_or_another_supporter
