      - name: secured_claim_on_abandoned_asset_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_COLLATERAL_NOT_ELIGIBLE]"]
        distinguishing_aspect: "Referential usability: an ABANDONED asset cannot serve as collateral for a newly filed SECURED claim — ERR_COLLATERAL_NOT_ELIGIBLE (an IDENTIFIED or LIQUIDATED asset is eligible)."
        test_recipe:
          setup: ["Case ACTIVE; asset abandoned (estimated 100, well under the authority limit, so no authorization needed)"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3037", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Scrap metal", asset_class: EQUIPMENT, estimated_value_cents: 100 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/abandon"
              payload: {}
              as: Receiver
          trigger:
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Secured Bank", creditor_type: SECURED, filed_amount_cents: 50000, collateral_asset_id: "${a1}" }
              as: Creditor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COLLATERAL_NOT_ELIGIBLE"

      - name: liquidation_with_mismatched_authorization_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_AUTHORIZATION_MISMATCH]"]
        distinguishing_aspect: "An above-limit liquidation carrying an authorization_id that points to an APPROVED request of the WRONG type (EXPENDITURE instead of ASSET_LIQUIDATION) fails with ERR_AUTHORIZATION_MISMATCH, not ERR_AUTHORIZATION_REQUIRED."
        test_recipe:
          setup: ["Case ACTIVE; cash 100000 (small asset liquidated); APPROVED EXPENDITURE authorization for 50000; big asset estimated 600000 (> limit 500000) still IDENTIFIED"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3038", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 100000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 100000 }
              as: Receiver
            - call: "POST /v1/authorization-requests"
              payload: { case_id: "${case_id}", request_type: EXPENDITURE, description: "Pay security vendor", amount_cents: 50000 }
              as: Receiver
              captures: { ar1: $.data.id }
            - call: "POST /v1/authorization-requests/${ar1}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Office building", asset_class: REAL_PROPERTY, estimated_value_cents: 600000 }
              as: Receiver
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /v1/assets/${a2}/liquidate"
              payload: { liquidation_value_cents: 550000, authorization_id: "${ar1}" }
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_AUTHORIZATION_MISMATCH — the linked request is APPROVED but has request_type EXPENDITURE, not ASSET_LIQUIDATION"

      - name: error_claim_barred_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLAIM_BARRED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / bar_date_exact_timestamp_accepted
          rationale: "Asserted as the failure leg of the named §1.8 instance (one second past the bar date)."

      - name: error_authorization_required_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUTHORIZATION_REQUIRED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / authority_limit_exact_equality_no_approval
          rationale: "Asserted as the failure leg of the named §1.8 instance (estimated 500001 > limit with no authorization)."

      - name: error_status_report_overdue_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_STATUS_REPORT_OVERDUE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / plan_create_temporal_beats_constraint
          rationale: "Asserted as the winning error of the named §1.8 instance."

      - name: error_report_period_overlap_and_gap_triggers
        claim_type: violation_to_error
        grounds: ["errors[ERR_REPORT_PERIOD_OVERLAP]", "errors[ERR_REPORT_PERIOD_GAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / status_report_period_contiguity_required
          rationale: "Both errors asserted in the named §1.8 instance's trigger chain."

      - name: error_fee_period_overlap_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_FEE_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / fee_application_period_overlap_half_open
          rationale: "Asserted as the failure leg of the named §1.8 instance."

      - name: error_discharge_blocked_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISCHARGE_BLOCKED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / discharge_requires_accepted_final_report
          rationale: "Asserted as the failure leg of the named §1.8 instance."

      - name: error_invalid_state_generic_triggers
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / fee_pay_state_beats_fiscal
          rationale: "Also asserted directly by corner instances asset_liquidate_from_liquidated_returns_invalid_state, asset_terminal_lockdown_abandon_after_liquidation, decide_on_decided_engagement_returns_invalid_state, and determine_from_allowed_returns_invalid_state."

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: receiver_cannot_decide_engagement
        claim_type: exclusive_operation_denial
        grounds: [roles.Court, roles.Receiver, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Segregation of duties: the Receiver who proposes an engagement cannot adjudicate it — POST /v1/engagements/{id}/decide as Receiver returns ERR_FORBIDDEN (only Court adjudicates)."
        test_recipe:
          setup: ["Case ACTIVE; engagement PROPOSED"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3039", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "L. Lawyer", firm_name: "Law LLP", role_type: COUNSEL, fee_arrangement: HOURLY, hourly_rate_cents: 20000, fee_cap_cents: 1000000 }
              as: Receiver
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /v1/engagements/${eng_id}/decide"
              payload: { decision: APPROVE }
              as: Receiver
              captures: { err: $.data.error_id }
            - call: "POST /v1/engagements/${eng_id}/decide"
              payload: { decision: APPROVE }
              as: Court
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_FORBIDDEN — filer cannot adjudicate"
            - "${st} == APPROVED — the same call by Court succeeds"

      - name: court_cannot_create_asset
        claim_type: exclusive_operation_denial
        grounds: [roles.Receiver, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The reverse segregation direction: the Court cannot perform Receiver administration — POST /v1/assets as Court returns ERR_FORBIDDEN."
        test_recipe:
          setup: ["Case ACTIVE"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3040", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Forklift", asset_class: EQUIPMENT, estimated_value_cents: 25000 }
              as: Court
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN"

      - name: creditor_can_file_claim_and_read_it
        claim_type: shared_operation_grant
        grounds: [roles.Creditor]
        distinguishing_aspect: "Shared operations granted: Creditor files its own claim (201, status FILED) and reads it back — no entity-backed ownership check applies (opaque identity)."
        test_recipe:
          setup: ["Case ACTIVE"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3041", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Self Filer", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 12345 }
              as: Creditor
              captures: { cid: $.data.id, st: $.data.status }
            - call: "GET /v1/claims/${cid}"
              as: Creditor
              captures: { amt: $.data.filed_amount_cents }
          assert:
            - "${st} == FILED and ${amt} == 12345"

      - name: receiver_cannot_set_clock
        claim_type: exclusive_operation_denial
        grounds: [roles.SystemAdmin, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The test-driving clock endpoint is exclusive to SystemAdmin: Receiver gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_fee_pay_stale_case_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fee-pay-stale-case]", "errors[ERR_STALE_CASE_VERSION]"]
        distinguishing_aspect: "OCC on Case.version for the fee-pay write endpoint: after a first successful pay advances the case version, a second pay carrying the previously observed version is rejected with ERR_STALE_CASE_VERSION (412); the first pay also demonstrates version increments by exactly 1."
        test_recipe:
          setup:
            - "Case ACTIVE; cash 300000; engagement APPROVED (cap 1000000) with two APPROVED applications: F1 100000 ([08-01, 08-31)) and F2 50000 ([09-01, 09-30))"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3042", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 300000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 300000 }
              as: Receiver
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "L. Lawyer", firm_name: "Law LLP", role_type: COUNSEL, fee_arrangement: HOURLY, hourly_rate_cents: 20000, fee_cap_cents: 1000000 }
              as: Receiver
              captures: { eng_id: $.data.id }
            - call: "POST /v1/engagements/${eng_id}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", time_entries: [ { hours: 5.0, rate_cents: 20000 } ], expenses_cents: 0 }
              as: Receiver
              captures: { f1: $.data.id }
            - call: "POST /v1/fee-applications/${f1}/decide"
              payload: { decision: APPROVE, approved_amount_cents: 100000 }
              as: Court
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", time_entries: [ { hours: 2.5, rate_cents: 20000 } ], expenses_cents: 0 }
              as: Receiver
              captures: { f2: $.data.id }
            - call: "POST /v1/fee-applications/${f2}/decide"
              payload: { decision: APPROVE, approved_amount_cents: 50000 }
              as: Court
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { v_obs: $.data.version }
          trigger:
            - call: "POST /v1/fee-applications/${f1}/pay"
              payload: { expected_case_version: "${v_obs}" }
              as: Receiver
              captures: { st1: $.data.status }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { v_after: $.data.version }
            - call: "POST /v1/fee-applications/${f2}/pay"
              payload: { expected_case_version: "${v_obs}" }
              as: Receiver
              captures: { err2: $.data.error_id }
          assert:
            - "${st1} == PAID — correct version succeeds"
            - "${v_after} == ${v_obs} + 1 — the pay incremented Case.version by exactly 1"
            - "${err2} == ERR_STALE_CASE_VERSION — the previously observed version is now stale"

      - name: occ_payment_pay_stale_case_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payment-pay-stale-case]", "errors[ERR_STALE_CASE_VERSION]"]
        distinguishing_aspect: "Same OCC rule family on the OTHER cash-debiting endpoint (distribution payment pay): a payment pay carrying a version captured before another pay landed is rejected with ERR_STALE_CASE_VERSION (412)."
        test_recipe:
          setup: ["Case with cash 50000; claims G1 30000, G2 20000 ALLOWED; plan APPROVED -> P1 30000 and P2 20000 SCHEDULED (same GENERAL class — free intra-class order)"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3043", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 50000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 50000 }
              as: Receiver
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor One", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 30000 }
              as: Creditor
              captures: { g1: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor Two", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 20000 }
              as: Creditor
              captures: { g2: $.data.id }
            - call: "POST /v1/claims/${g1}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 30000 }
              as: Receiver
            - call: "POST /v1/claims/${g2}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 20000 }
              as: Receiver
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 0 }
              as: Receiver
              captures: { plan_id: $.data.id }
            - call: "POST /v1/distribution-plans/${plan_id}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "GET /v1/claims/${g1}/payments"
              as: Receiver
              captures: { p1: "$.data[0].id" }
            - call: "GET /v1/claims/${g2}/payments"
              as: Receiver
              captures: { p2: "$.data[0].id" }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { v_obs: $.data.version }
          trigger:
            - call: "POST /v1/distribution-payments/${p1}/pay"
              payload: { expected_case_version: "${v_obs}" }
              as: Receiver
              captures: { st1: $.data.status }
            - call: "POST /v1/distribution-payments/${p2}/pay"
              payload: { expected_case_version: "${v_obs}" }
              as: Receiver
              captures: { err2: $.data.error_id }
          assert:
            - "${st1} == PAID — correct version succeeds"
            - "${err2} == ERR_STALE_CASE_VERSION — version advanced by the first pay, so the stale view is rejected"

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / plan_approval_case_to_payment_generation
          rationale: "N-level cascade chains are asserted end-to-end by both §1.8 transitive_cascade instances."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: dual_variant_calc / secured_claim_estimated_vs_realized_collateral
          rationale: "Both variants of both dual-variant calculations are asserted by the two §1.8 dual_variant_calc instances."

      - name: rate_threshold_layer_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: boundary_precision_check / authority_limit_exact_equality_no_approval
          rationale: "The authority-limit threshold trigger is asserted at its exact boundary by the named §1.8 instance; the fee-cap threshold is asserted by corner instance fee_cap_boundary_at_approval."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_liquidation_in_case_read
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, calculations.estate_cash_position]
        distinguishing_aspect: "Immediate consistency: the liquidate response itself carries status LIQUIDATED and liquidation_value_cents, and the very next GET /v1/cases/{id} reflects the incremented cash and marshalled value — no asynchronous lag."
        test_recipe:
          setup: ["Case ACTIVE; one asset IDENTIFIED (estimated 80000)"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3044", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Warehouse", asset_class: REAL_PROPERTY, estimated_value_cents: 80000 }
              as: Receiver
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 75000 }
              as: Receiver
              captures: { a_st: $.data.status, a_lv: $.data.liquidation_value_cents }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { cash: $.data.cash_on_hand_cents, mar: $.data.marshalled_value_cents }
          assert:
            - "${a_st} == LIQUIDATED and ${a_lv} == 75000 in the same response"
            - "${cash} == 75000 and ${mar} == 75000 immediately after (marshalled now reads the realized value)"
