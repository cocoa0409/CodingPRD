# =============================================================================
# PRD BENCHMARK SEED TABLES — Buying Club & Food Co-op Order Platform
# Sections §1.0 - §1.7. Difficulty design (§1.8) and corner design (§1.9)
# live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "942. Buying Club & Food Co-op Order (Azure style): catalog & drop-point/route, member order aggregation & minimum, split-case & pre-order cycle, coordinator commission & volunteer, cold/dry pallet consolidation, payment & reconciliation, substitution/shortage, membership"

domain_name: buying-club-food-coop
api_prefix: ""

# =============================================================================
# §0.3 COMPLEXITY PROFILE
# =============================================================================

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Every collection is
  # addressed at the top level (/order-lines, /drop-runs, ...); no child
  # entity is nested inside a parent path segment. Action endpoints hang off
  # the resource they act on (POST /cycles/{cycle_id}/lock), which is not
  # nesting: the acted-on entity is the path owner.

  state_machine_shape: parallel
  # MemberOrder carries two independent axes (status x payment_status).
  # Cycle carries a stored `status` plus a clock-derived `exception_state`.
  # RouteRun and DropRun both revert (QUALIFIED -> PLANNED / OPEN) when a
  # sibling's qualification changes. DropReconciliation auto-branches on a
  # computed variance and reverts VARIANCE_HELD -> BALANCED.

  relationship_patterns:
    - one_to_many
    - many_to_many          # Cycle x Route via RouteRun; Cycle x DropPoint via DropRun
    - self_referential      # DropRun.merged_into_drop_run_id, OrderLine.rolled_from_order_line_id
    - cross_aggregate       # CaseAggregate spans every MemberOrder on a RouteRun

  role_model: segregation_of_duties
  # The operator who prepares a DropReconciliation may not be the operator
  # who posts it. Enforced on X-User-ID, not on role.

  consistency_model: immediate

# =============================================================================
# §1.0 RESPONSE ENVELOPE (FIXED — VERBATIM)
# =============================================================================

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# GLOBAL CONSTANTS — every tunable named anywhere in this scaffold has its
# concrete value here. Nothing downstream may invent a number.
# =============================================================================

global_constants:
  # --- clock -----------------------------------------------------------------
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"

  # --- minimums (see §1.3 drop_qualification / route_qualification) ----------
  DROP_MINIMUM_DEFAULT_CENTS: 50000        # DropPoint.drop_minimum_cents default
  ROUTE_MINIMUM_DEFAULT_CENTS: 250000      # Route.route_minimum_cents default
  ROUTE_REEFER_SLOTS_DEFAULT: 2            # Route.reefer_slots default
  ROUTE_MAX_PALLETS_DEFAULT: 12            # Route.max_pallets default

  # --- split-case pricing ----------------------------------------------------
  SPLIT_CASE_FEE_PCT: 0.12
  SPLIT_CASE_FEE_MIN_CENTS: 25

  # --- pre-order cycle windows ----------------------------------------------
  EXCEPTION_WINDOW_HOURS: 48               # opens at Cycle.received_at
  ROUTE_TURNAROUND_HOURS: 48               # buffer between two cycles on one Route

  # --- substitution ----------------------------------------------------------
  SUBSTITUTION_TOLERANCE_PCT: 0.10
  SUBSTITUTION_RESPONSE_HOURS: 24

  # --- two-phase payment -----------------------------------------------------
  PAYMENT_AUTH_BUFFER_PCT: 0.10
  PAYMENT_VARIANCE_TOLERANCE_PCT: 0.15
  PAYMENT_VARIANCE_TOLERANCE_FLOOR_CENTS: 500

  # --- reconciliation --------------------------------------------------------
  RECON_VARIANCE_TOLERANCE_CENTS: 200

  # --- cold chain / pallets --------------------------------------------------
  REEFER_SURCHARGE_CENTS_PER_SLOT: 4500
  PALLET_MAX_WEIGHT_GRAMS: 900000
  PALLET_MAX_CUBE_CM3: 1600000
  REEFER_REQUIRED_TEMP_CLASSES: ["FROZEN", "CHILLED"]

  # --- coordinator commission ------------------------------------------------
  COMMISSION_BAND_1_MAX_CENTS: 100000
  COMMISSION_BAND_1_RATE: 0.03
  COMMISSION_BAND_2_MAX_CENTS: 300000
  COMMISSION_BAND_2_RATE: 0.05
  COMMISSION_BAND_3_RATE: 0.07
  COMMISSION_VOLUNTEER_MIN_HOURS: 4.0
  COMMISSION_VOLUNTEER_UNMET_MULTIPLIER: 0.50
  COMMISSION_STORE_CREDIT_BONUS_PCT: 0.10
  COMMISSION_CASH_FEE_PCT: 0.02
  COMMISSION_CASH_FEE_MIN_CENTS: 100

  # --- membership ------------------------------------------------------------
  COORDINATOR_MIN_TIER_RANK: 2
  MEMBERSHIP_TERM_DAYS: 365
  DUES_GRACE_DAYS: 14
  TIER_BASIC_RANK: 1
  TIER_BASIC_ANNUAL_DUES_CENTS: 3000
  TIER_BASIC_DISCOUNT_PCT: 0.00
  TIER_PLUS_RANK: 2
  TIER_PLUS_ANNUAL_DUES_CENTS: 9000
  TIER_PLUS_DISCOUNT_PCT: 0.05
  TIER_PRO_RANK: 3
  TIER_PRO_ANNUAL_DUES_CENTS: 18000
  TIER_PRO_DISCOUNT_PCT: 0.09

  # --- volunteer credits -----------------------------------------------------
  VOLUNTEER_CREDIT_CENTS_PER_HOUR: 1200
  VOLUNTEER_CREDIT_EXPIRY_DAYS: 180
  CREDIT_MAX_OFFSET_PCT: 0.50

  # --- ordering / rollover ---------------------------------------------------
  MAX_ORDER_LINE_UNITS: 500
  ROLLFORWARD_MAX_PER_DROP_RUN: 1
  ROLLOVER_PRICE_POLICY: "NEW_CYCLE_PRICE"

  # --- determinism -----------------------------------------------------------
  ALLOCATION_TIE_BREAK: "created_at ASC"
  MONEY_ROUNDING: "round_half_up to whole cents"

# =============================================================================
# BOUNDARY SEMANTICS — every window/threshold in this scaffold, pinned.
# =============================================================================

boundary_semantics:
  drop_minimum: "QUALIFIED iff DropRun.subtotal_cents >= DropPoint.drop_minimum_cents (INCLUSIVE)"
  route_minimum: "QUALIFIED iff RouteRun.aggregated_subtotal_cents > Route.route_minimum_cents (EXCLUSIVE / strictly greater)"
  cutoff: "Member order and line writes permitted iff clock < Cycle.cutoff_at (EXCLUSIVE upper bound; at the cutoff instant writes are refused)"
  price_binding: "Bound PriceVersion = the one with the greatest effective_from satisfying effective_from <= Cycle.cutoff_at (INCLUSIVE)"
  exception_window: "Cycle.exception_state == OPEN iff clock >= Cycle.received_at (INCLUSIVE) AND clock < Cycle.exception_deadline_at (EXCLUSIVE)"
  substitution_response: "Response accepted iff clock < SubstitutionOffer.respond_by (EXCLUSIVE)"
  substitution_tolerance: "within_tolerance iff offered_unit_price_cents <= round_half_up(original_unit_price_cents * 1.10) (INCLUSIVE)"
  payment_variance: "Within band iff (actual_total_cents - authorized_amount_cents) <= max(500, round_half_up(authorized_amount_cents * 0.15)) (INCLUSIVE)"
  recon_variance: "BALANCED iff abs(variance_cents) <= 200 (INCLUSIVE); otherwise VARIANCE_HELD"
  pallet_capacity: "A unit may join a pallet iff resulting weight_grams <= 900000 AND resulting cube_cm3 <= 1600000 (both INCLUSIVE); otherwise a new pallet of that temp_class is opened"
  reefer_capacity: "Accepted iff cold pallet count <= Route.reefer_slots (INCLUSIVE)"
  credit_offset_cap: "credit_applied_cents <= floor(pre_credit_total_cents * 0.50) (INCLUSIVE)"
  credit_expiry: "A CreditGrant is spendable iff clock < expires_at (EXCLUSIVE)"
  dues_grace: "Member remains ACTIVE while clock <= dues_paid_through + 14 days (INCLUSIVE)"
  volunteer_obligation: "met iff DropRun.verified_volunteer_hours >= 4.0 (INCLUSIVE)"
  commission_bands: "band1 iff base <= 100000 (INCLUSIVE); band2 iff 100000 < base <= 300000 (upper INCLUSIVE); band3 iff base > 300000"
  route_turnaround: "A Route may host a second Cycle iff new_cycle.opens_at >= existing_cycle.cutoff_at + 48h (INCLUSIVE)"
  order_line_quantity: "1 <= qty_units <= 500 (both INCLUSIVE)"

# =============================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE  (19 entities, flat topology)
# =============================================================================

entities:

  # ---------------------------------------------------------------- Member --
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: contact address, unique across all members
        constraints: unique; non-empty
      - name: full_name
        type: string
        source: input
        description: member display name
      - name: tier
        type: enum
        source: input
        description: membership tier purchased by the member
        default: BASIC
        constraints: one of BASIC, PLUS, PRO
      - name: tier_rank
        type: integer
        source: computed
        description: numeric rank of tier - BASIC=1, PLUS=2, PRO=3
      - name: discount_pct
        type: number
        source: computed
        description: order discount implied by tier - BASIC=0.00, PLUS=0.05, PRO=0.09
      - name: status
        type: enum
        source: system
        description: membership lifecycle state
        default: PENDING
        constraints: one of PENDING, ACTIVE, LAPSED
      - name: home_drop_point_id
        type: string
        source: input
        description: "FK -> DropPoint.id; the drop point this member normally orders through"
      - name: dues_paid_through
        type: datetime
        source: computed
        description: instant through which dues are paid; null until the first dues payment
      - name: dues_grace_until
        type: datetime
        source: computed
        description: dues_paid_through plus DUES_GRACE_DAYS (14); null while dues_paid_through is null
      - name: lifetime_dues_paid_cents
        type: integer
        source: computed
        description: running total of every dues payment and tier-upgrade proration accepted for this member
        default: 0
      - name: credit_balance_cents
        type: integer
        source: computed
        description: sum of CreditGrant.remaining_cents for this member over grants with status in ACTIVE or PARTIALLY_CONSUMED and clock < expires_at
        default: 0
      - name: is_coordinator
        type: boolean
        source: computed
        description: true iff at least one DropPoint names this member as coordinator_member_id
        default: false

  # ----------------------------------------------------------------- Route --
  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: short route code, unique
        constraints: unique; non-empty
      - name: name
        type: string
        source: input
        description: human-readable route name
      - name: reefer_slots
        type: integer
        source: input
        description: number of refrigerated pallet slots the truck on this route can carry
        default: 2
        constraints: ">= 0"
      - name: route_minimum_cents
        type: integer
        source: input
        description: aggregate order value a cycle must strictly exceed for this route to run
        default: 250000
        constraints: ">= 0"
      - name: max_pallets
        type: integer
        source: input
        description: total pallet positions on the truck across all temperature classes
        default: 12
        constraints: ">= 1"
      - name: cold_capable
        type: boolean
        source: computed
        description: true iff reefer_slots > 0; a route that is not cold_capable may not carry FROZEN or CHILLED items

  # ------------------------------------------------------------- DropPoint --
  - name: DropPoint
    parent: null
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; the route that serves this drop point"
      - name: name
        type: string
        source: input
        description: drop point name
      - name: coordinator_member_id
        type: string
        source: input
        description: "FK -> Member.id; the member acting as drop coordinator; nullable"
      - name: drop_minimum_cents
        type: integer
        source: input
        description: order value this drop must reach (inclusive) to qualify in a cycle
        default: 50000
        constraints: ">= 0"

  # ------------------------------------------------------------------ Item --
  - name: Item
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: catalog SKU, unique
        constraints: unique; non-empty
      - name: name
        type: string
        source: input
        description: catalog display name
      - name: temp_class
        type: enum
        source: input
        description: temperature class governing pallet partitioning and reefer demand
        constraints: one of FROZEN, CHILLED, DRY
      - name: case_pack_units
        type: integer
        source: input
        description: number of member-facing units the supplier packs in one case
        constraints: ">= 1"
      - name: unit_weight_grams
        type: integer
        source: input
        description: shipping weight of one unit
        constraints: ">= 1"
      - name: unit_cube_cm3
        type: integer
        source: input
        description: shipping cube of one unit
        constraints: ">= 1"
      - name: split_allowed
        type: boolean
        source: input
        description: whether members may order quantities that are not whole case multiples
        default: true
      - name: remainder_policy
        type: enum
        source: input
        description: how the last partial case of aggregated demand is resolved
        default: SHORT_FILL
        constraints: one of SHORT_FILL, ROUND_UP, DROP
      - name: status
        type: enum
        source: system
        description: catalog availability
        default: ACTIVE
        constraints: one of ACTIVE, DISCONTINUED

  # ---------------------------------------------------------- PriceVersion --
  - name: PriceVersion
    parent: null
    common_fields: false
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the item this price applies to"
      - name: effective_from
        type: datetime
        source: input
        description: instant from which this price is in force; unique per item
      - name: case_price_cents
        type: integer
        source: input
        description: supplier price for one whole case
        constraints: ">= 1"
      - name: split_unit_base_cents
        type: integer
        source: computed
        description: ceil(case_price_cents / Item.case_pack_units), the per-unit price before any split-case fee

  # ----------------------------------------------------------------- Cycle --
  - name: Cycle
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: cycle code, unique
        constraints: unique; non-empty
      - name: opens_at
        type: datetime
        source: input
        description: instant the cycle begins accepting member orders
      - name: cutoff_at
        type: datetime
        source: input
        description: instant member writes close; also the instant at which catalog prices bind
        constraints: must be strictly after opens_at
      - name: status
        type: enum
        source: system
        description: cycle lifecycle state
        default: OPEN
        constraints: one of OPEN, LOCKED, SUBMITTED, RECEIVED, CONSOLIDATED, DELIVERED, RECONCILED, CLOSED, CANCELLED
      - name: locked_at
        type: datetime
        source: system
        description: clock reading when the cycle was locked; null while OPEN
      - name: received_at
        type: datetime
        source: system
        description: clock reading when supplier goods were received; null before RECEIVED
      - name: exception_deadline_at
        type: datetime
        source: computed
        description: received_at plus EXCEPTION_WINDOW_HOURS (48); null before RECEIVED
      - name: exception_state
        type: enum
        source: computed
        description: NOT_STARTED before received_at, OPEN while clock is in the half-open exception window, CLOSED at or after exception_deadline_at
        default: NOT_STARTED
        constraints: one of NOT_STARTED, OPEN, CLOSED

  # -------------------------------------------------------------- RouteRun --
  - name: RouteRun
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> Cycle.id; the cycle this run belongs to"
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; the route being run"
      - name: status
        type: enum
        source: system
        description: route-run lifecycle state
        default: PLANNED
        constraints: one of PLANNED, QUALIFIED, DEFERRED, SUBMITTED, RECEIVED, CONSOLIDATED, DELIVERED
      - name: aggregated_subtotal_cents
        type: integer
        source: computed
        description: sum of subtotal_cents over DropRuns on this run whose status is OPEN or QUALIFIED; at hop 5 of the cycle lock no drop run is still OPEN, so from that point on it is exactly the QUALIFIED set
        default: 0
      - name: supplier_invoice_cents
        type: integer
        source: computed
        description: whole-case cost invoiced by the supplier for this run; 0 until recorded
        default: 0
      - name: freight_cents
        type: integer
        source: computed
        description: freight billed for this run; 0 until recorded
        default: 0
      - name: invoice_recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who recorded the supplier invoice; null before that
      - name: cold_pallet_count
        type: integer
        source: computed
        description: number of pallets on this run whose temp_class is FROZEN or CHILLED
        default: 0
      - name: dry_pallet_count
        type: integer
        source: computed
        description: number of DRY pallets on this run
        default: 0
      - name: reefer_slots_used
        type: integer
        source: computed
        description: equals cold_pallet_count; each cold pallet occupies one reefer slot on the truck
        default: 0
      - name: reefer_surcharge_cents
        type: integer
        source: computed
        description: reefer_slots_used multiplied by REEFER_SURCHARGE_CENTS_PER_SLOT (4500)
        default: 0
      - name: received_subtotal_cents
        type: integer
        source: computed
        description: sum over every OrderLine on this run of allocated_units multiplied by unit_price_cents, before tier discount
        default: 0

  # --------------------------------------------------------------- DropRun --
  - name: DropRun
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> Cycle.id; the cycle this drop run belongs to"
      - name: drop_point_id
        type: string
        source: input
        description: "FK -> DropPoint.id; the drop point being run"
      - name: route_run_id
        type: string
        source: system
        description: "FK -> RouteRun.id; the run of the drop point's route within the same cycle, created on demand"
      - name: coordinator_member_id
        type: string
        source: system
        description: "FK -> Member.id; snapshot of DropPoint.coordinator_member_id taken at drop-run creation; nullable"
      - name: merged_into_drop_run_id
        type: string
        source: system
        description: "FK -> DropRun.id; set when this drop run is merged into a neighbour on the same route run; null otherwise"
      - name: status
        type: enum
        source: system
        description: drop-run lifecycle state
        default: OPEN
        constraints: one of OPEN, QUALIFIED, MERGED, DEFERRED, ROLLED_FORWARD, SUBMITTED, RECEIVED, SETTLED, CANCELLED
      - name: subtotal_cents
        type: integer
        source: computed
        description: pre-discount order value on this drop run, summed over confirmed_units multiplied by unit_price_cents
        default: 0
      - name: discounted_subtotal_cents
        type: integer
        source: computed
        description: subtotal_cents less the sum of each member order's tier_discount_cents
        default: 0
      - name: received_subtotal_cents
        type: integer
        source: computed
        description: pre-discount value of what was actually allocated to this drop run's lines
        default: 0
      - name: verified_volunteer_hours
        type: number
        source: computed
        description: sum of hours over VolunteerShifts on this drop run whose status is VERIFIED
        default: 0
      - name: volunteer_obligation_met
        type: boolean
        source: computed
        description: true iff verified_volunteer_hours >= COMMISSION_VOLUNTEER_MIN_HOURS (4.0)
        default: false
      - name: freight_alloc_cents
        type: integer
        source: computed
        description: this drop run's share of the route run's freight_cents
        default: 0
      - name: reefer_alloc_cents
        type: integer
        source: computed
        description: this drop run's share of the route run's reefer_surcharge_cents
        default: 0
      - name: rollforward_count
        type: integer
        source: system
        description: number of times this drop run has been rolled forward into a later cycle
        default: 0

  # ----------------------------------------------------------- MemberOrder --
  - name: MemberOrder
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the ordering member"
      - name: drop_run_id
        type: string
        source: input
        description: "FK -> DropRun.id; the drop run this order is placed against"
      - name: status
        type: enum
        source: system
        description: fulfilment axis of the order
        default: DRAFT
        constraints: one of DRAFT, SUBMITTED, LOCKED, FILLED, SHORT_FILLED, DELIVERED, CLOSED, CANCELLED
      - name: payment_status
        type: enum
        source: system
        description: money axis of the order, independent of the fulfilment axis
        default: UNPAID
        constraints: one of UNPAID, AUTHORIZED, AUTH_FAILED, CAPTURED, PARTIALLY_REFUNDED, REFUNDED, VOIDED
      - name: gross_cents
        type: integer
        source: computed
        description: sum over this order's lines of allocated_units multiplied by unit_price_cents
        default: 0
      - name: split_fee_cents
        type: integer
        source: computed
        description: portion of gross_cents attributable to split-case fees
        default: 0
      - name: tier_discount_cents
        type: integer
        source: computed
        description: round_half_up(gross_cents multiplied by Member.discount_pct), computed once at order level
        default: 0
      - name: freight_alloc_cents
        type: integer
        source: computed
        description: this order's share of its drop run's freight_alloc_cents
        default: 0
      - name: reefer_alloc_cents
        type: integer
        source: computed
        description: this order's share of its route run's reefer_surcharge_cents
        default: 0
      - name: pre_credit_total_cents
        type: integer
        source: computed
        description: gross_cents less tier_discount_cents plus freight_alloc_cents plus reefer_alloc_cents
        default: 0
      - name: credit_applied_cents
        type: integer
        source: computed
        description: store credit consumed against this order, capped at floor(pre_credit_total_cents multiplied by 0.50)
        default: 0
      - name: actual_total_cents
        type: integer
        source: computed
        description: pre_credit_total_cents less credit_applied_cents; the amount the capture attempts
        default: 0
      - name: estimated_total_cents
        type: integer
        source: computed
        description: cutoff-time estimate of the order value from confirmed_units, before freight and reefer
        default: 0
      - name: authorized_amount_cents
        type: integer
        source: computed
        description: round_half_up(estimated_total_cents multiplied by 1.10); 0 until authorization succeeds
        default: 0
      - name: captured_cents
        type: integer
        source: computed
        description: total successfully captured on this order
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: total successfully refunded on this order
        default: 0

  # ------------------------------------------------------------- OrderLine --
  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: member_order_id
        type: string
        source: input
        description: "FK -> MemberOrder.id; the order this line belongs to"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the catalog item ordered"
      - name: qty_units
        type: integer
        source: input
        description: units the member asked for
        constraints: "1 <= qty_units <= 500"
      - name: rollover_opt_in
        type: boolean
        source: input
        description: whether unfilled units may be rolled into a later cycle
        default: false
      - name: substitution_pref
        type: enum
        source: input
        description: member's stance on supplier substitutions for this line
        default: APPROVAL_REQUIRED
        constraints: one of NONE, ANY_SUBSTITUTE, APPROVAL_REQUIRED
      - name: rolled_from_order_line_id
        type: string
        source: system
        description: "FK -> OrderLine.id; the earlier-cycle line whose unfilled units created this line; null for member-created lines"
      - name: status
        type: enum
        source: system
        description: line lifecycle state
        default: REQUESTED
        constraints: one of REQUESTED, CONFIRMED, FILLED, SHORT_FILLED, SUBSTITUTED, DROPPED, ROLLED_FORWARD, CANCELLED
      - name: bound_case_price_cents
        type: integer
        source: computed
        description: case_price_cents of the PriceVersion bound at cycle lock; 0 while REQUESTED
        default: 0
      - name: unit_price_cents
        type: integer
        source: computed
        description: per-unit price charged to the member, including the split-case fee when is_split_unit is true
        default: 0
      - name: is_split_unit
        type: boolean
        source: computed
        description: true iff qty_units is not an exact multiple of Item.case_pack_units
        default: false
      - name: split_fee_per_unit_cents
        type: integer
        source: computed
        description: the split-case fee component inside unit_price_cents; 0 when is_split_unit is false
        default: 0
      - name: confirmed_units
        type: integer
        source: computed
        description: units surviving the cycle-lock remainder policy; may exceed qty_units on the ROUND_UP overage line
        default: 0
      - name: allocated_units
        type: integer
        source: computed
        description: units actually allocated to this line from what the supplier delivered
        default: 0
      - name: short_units
        type: integer
        source: computed
        description: confirmed_units less allocated_units
        default: 0
      - name: allocation_remainder_rank
        type: integer
        source: computed
        description: 1-based rank of this line in the largest-remainder ordering used by the shortage allocation; 0 when no shortage occurred
        default: 0
      - name: line_gross_cents
        type: integer
        source: computed
        description: allocated_units multiplied by unit_price_cents
        default: 0

  # ---------------------------------------------------------- CaseAggregate --
  - name: CaseAggregate
    parent: null
    common_fields: true
    fields:
      - name: route_run_id
        type: string
        source: system
        description: "FK -> RouteRun.id; the run whose whole-case order this row belongs to"
      - name: item_id
        type: string
        source: system
        description: "FK -> Item.id; the aggregated item"
      - name: overage_order_line_id
        type: string
        source: system
        description: "FK -> OrderLine.id; under ROUND_UP, the line charged the rounded-up overage; null otherwise"
      - name: requested_units
        type: integer
        source: computed
        description: sum of qty_units over the CONFIRMED-eligible lines feeding this aggregate
        default: 0
      - name: cases_ordered
        type: integer
        source: computed
        description: whole cases actually ordered from the supplier after the remainder policy
        default: 0
      - name: covered_units
        type: integer
        source: computed
        description: cases_ordered multiplied by Item.case_pack_units
        default: 0
      - name: remainder_units
        type: integer
        source: computed
        description: requested_units modulo Item.case_pack_units, recorded before the policy resolves it
        default: 0
      - name: overage_units
        type: integer
        source: computed
        description: units added beyond requested_units when the policy is ROUND_UP; 0 otherwise
        default: 0
      - name: dropped_units
        type: integer
        source: computed
        description: units removed from member lines when the policy is DROP; 0 otherwise
        default: 0
      - name: policy_applied
        type: enum
        source: computed
        description: the Item.remainder_policy value in force when this aggregate was built
        constraints: one of SHORT_FILL, ROUND_UP, DROP
      - name: case_price_cents
        type: integer
        source: computed
        description: bound case price for the item at the cycle's cutoff instant
        default: 0
      - name: units_received
        type: integer
        source: computed
        description: sum of units_received over ReceiptLines against this aggregate
        default: 0

  # ------------------------------------------------------------ ReceiptLine --
  - name: ReceiptLine
    parent: null
    common_fields: true
    fields:
      - name: route_run_id
        type: string
        source: input
        description: "FK -> RouteRun.id; the run these goods arrived on"
      - name: case_aggregate_id
        type: string
        source: input
        description: "FK -> CaseAggregate.id; the ordered aggregate these goods satisfy"
      - name: substitute_item_id
        type: string
        source: input
        description: "FK -> Item.id; set when the supplier shipped a different item; null for a straight receipt"
      - name: cases_received
        type: integer
        source: input
        description: whole cases physically received
        constraints: ">= 0"
      - name: substitute_case_price_cents
        type: integer
        source: input
        description: case price the supplier billed for the substitute; required when substitute_item_id is set
      - name: units_received
        type: integer
        source: computed
        description: cases_received multiplied by the case_pack_units of the received item (substitute if present, else the ordered item)
        default: 0
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the warehouse operator who recorded this line

  # ------------------------------------------------------ SubstitutionOffer --
  - name: SubstitutionOffer
    parent: null
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: system
        description: "FK -> OrderLine.id; the member line being offered a substitute"
      - name: receipt_line_id
        type: string
        source: system
        description: "FK -> ReceiptLine.id; the receipt that introduced the substitute"
      - name: substitute_item_id
        type: string
        source: system
        description: "FK -> Item.id; the item actually shipped"
      - name: offered_units
        type: integer
        source: computed
        description: units of the substitute allocated to this line
        default: 0
      - name: original_unit_price_cents
        type: integer
        source: computed
        description: the line's bound unit_price_cents before substitution
        default: 0
      - name: offered_unit_price_cents
        type: integer
        source: computed
        description: per-unit price of the substitute, derived from substitute_case_price_cents by the split_unit_price rule
        default: 0
      - name: within_tolerance
        type: boolean
        source: computed
        description: true iff offered_unit_price_cents <= round_half_up(original_unit_price_cents multiplied by 1.10)
        default: false
      - name: respond_by
        type: datetime
        source: computed
        description: created_at plus SUBSTITUTION_RESPONSE_HOURS (24)
      - name: status
        type: enum
        source: system
        description: offer lifecycle state
        default: PENDING
        constraints: one of PENDING, APPROVED, DECLINED, AUTO_APPROVED, AUTO_DECLINED

  # ---------------------------------------------------------------- Pallet --
  - name: Pallet
    parent: null
    common_fields: true
    fields:
      - name: route_run_id
        type: string
        source: system
        description: "FK -> RouteRun.id; the run this pallet ships on"
      - name: temp_class
        type: enum
        source: computed
        description: temperature class of every unit on this pallet
        constraints: one of FROZEN, CHILLED, DRY
      - name: sequence_index
        type: integer
        source: computed
        description: 1-based index of this pallet within its temp_class on the run
        default: 1
      - name: weight_grams
        type: integer
        source: computed
        description: total shipping weight of the units on this pallet
        default: 0
      - name: cube_cm3
        type: integer
        source: computed
        description: total shipping cube of the units on this pallet
        default: 0
      - name: unit_count
        type: integer
        source: computed
        description: number of allocated units loaded onto this pallet
        default: 0
      - name: requires_reefer
        type: boolean
        source: computed
        description: true iff temp_class is FROZEN or CHILLED
        default: false
      - name: status
        type: enum
        source: system
        description: pallet lifecycle state
        default: BUILDING
        constraints: one of BUILDING, SEALED, DELIVERED

  # --------------------------------------------------------------- Payment --
  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: member_order_id
        type: string
        source: system
        description: "FK -> MemberOrder.id; the order this money movement belongs to"
      - name: kind
        type: enum
        source: system
        description: which phase of the two-phase payment this record represents
        constraints: one of AUTHORIZATION, CAPTURE, REFUND
      - name: method
        type: enum
        source: system
        description: instrument used
        default: CARD
        constraints: one of CARD, STORE_CREDIT
      - name: amount_cents
        type: integer
        source: computed
        description: signed-positive amount moved by this record
        default: 0
      - name: status
        type: enum
        source: system
        description: outcome of this money movement
        default: SUCCEEDED
        constraints: one of SUCCEEDED, FAILED, VOIDED

  # ---------------------------------------------------- DropReconciliation --
  - name: DropReconciliation
    parent: null
    common_fields: true
    fields:
      - name: drop_run_id
        type: string
        source: input
        description: "FK -> DropRun.id; the drop run being reconciled"
      - name: member_charges_cents
        type: integer
        source: computed
        description: sum over the drop run's orders of captured_cents less refunded_cents
        default: 0
      - name: supplier_cost_cents
        type: integer
        source: computed
        description: this drop run's share of its route run's supplier_invoice_cents
        default: 0
      - name: freight_alloc_cents
        type: integer
        source: computed
        description: copy of DropRun.freight_alloc_cents at draft time
        default: 0
      - name: reefer_alloc_cents
        type: integer
        source: computed
        description: copy of DropRun.reefer_alloc_cents at draft time
        default: 0
      - name: commission_cents
        type: integer
        source: computed
        description: net commission owed to the drop coordinator for this drop run
        default: 0
      - name: club_margin_cents
        type: integer
        source: computed
        description: the residual the club keeps, plus any variance absorbed by resolve-variance
        default: 0
      - name: variance_cents
        type: integer
        source: computed
        description: member_charges_cents less the sum of supplier, freight, reefer, commission and club margin
        default: 0
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who created this draft
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who posted it; null while unposted
      - name: posted_at
        type: datetime
        source: system
        description: clock reading at posting; null while unposted
      - name: status
        type: enum
        source: system
        description: reconciliation lifecycle state
        default: DRAFT
        constraints: one of DRAFT, BALANCED, VARIANCE_HELD, POSTED, VOID

  # ------------------------------------------------------ CommissionAccrual --
  - name: CommissionAccrual
    parent: null
    common_fields: true
    fields:
      - name: drop_run_id
        type: string
        source: system
        description: "FK -> DropRun.id; the drop run the commission was earned on"
      - name: coordinator_member_id
        type: string
        source: system
        description: "FK -> Member.id; the coordinator earning the commission"
      - name: base_subtotal_cents
        type: integer
        source: computed
        description: DropRun.received_subtotal_cents at accrual time, before tier discounts
        default: 0
      - name: rate_applied
        type: number
        source: computed
        description: the single flat band rate selected by base_subtotal_cents
        default: 0
      - name: volunteer_multiplier_applied
        type: number
        source: computed
        description: 1.00 when the drop run's volunteer obligation was met, otherwise 0.50
        default: 1
      - name: accrued_cents
        type: integer
        source: computed
        description: round_half_up(base_subtotal_cents multiplied by rate_applied multiplied by volunteer_multiplier_applied)
        default: 0
      - name: clawback_cents
        type: integer
        source: computed
        description: commission reversed by post-delivery refunds
        default: 0
      - name: net_cents
        type: integer
        source: computed
        description: accrued_cents less clawback_cents
        default: 0
      - name: payout_mode
        type: enum
        source: input
        description: how the coordinator elects to be paid; null before payout
        constraints: one of STORE_CREDIT, CASH
      - name: payout_value_cents
        type: integer
        source: computed
        description: what the coordinator actually receives after the store-credit bonus or the cash fee
        default: 0
      - name: status
        type: enum
        source: system
        description: accrual lifecycle state; an accrual is only ever created after delivery, so there is no path that voids one
        default: ACCRUED
        constraints: one of ACCRUED, ADJUSTED, PAID

  # -------------------------------------------------------- VolunteerShift --
  - name: VolunteerShift
    parent: null
    common_fields: true
    fields:
      - name: drop_run_id
        type: string
        source: input
        description: "FK -> DropRun.id; the drop run the hours were worked at"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the volunteering member"
      - name: credit_grant_id
        type: string
        source: system
        description: "FK -> CreditGrant.id; the grant minted on verification; null while LOGGED or REJECTED"
      - name: hours
        type: number
        source: input
        description: hours worked, in quarter-hour increments
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: shift lifecycle state
        default: LOGGED
        constraints: one of LOGGED, VERIFIED, REJECTED
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the coordinator or admin who verified or rejected the shift

  # ----------------------------------------------------------- CreditGrant --
  - name: CreditGrant
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member holding this credit"
      - name: source_member_order_id
        type: string
        source: system
        description: "FK -> MemberOrder.id; the order whose refund minted this grant; null for other sources"
      - name: source
        type: enum
        source: system
        description: what minted the grant
        default: ADJUSTMENT
        constraints: one of VOLUNTEER, REFUND, COMMISSION, ADJUSTMENT
      - name: amount_cents
        type: integer
        source: input
        description: face value of the grant
        constraints: ">= 1"
      - name: remaining_cents
        type: integer
        source: computed
        description: unspent portion of amount_cents
        default: 0
      - name: expires_at
        type: datetime
        source: input
        description: instant after which the grant may no longer be spent
      - name: status
        type: enum
        source: system
        description: grant lifecycle state
        default: ACTIVE
        constraints: one of ACTIVE, PARTIALLY_CONSUMED, CONSUMED, EXPIRED

# =============================================================================
# §1.2 STATE MACHINE TABLE
# =============================================================================

state_machines:

  # --------------------------------------------------------------- Member --
  - entity: Member
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /members/{member_id}/dues-payments"
        actor: ClubAdmin
        preconditions:
          - "amount_cents equals the annual dues of Member.tier multiplied by term_years"
          - "expected_member_version equals Member.version"
        side_effects:
          - "sets dues_paid_through to clock plus 365 multiplied by term_years days"
          - "sets dues_grace_until to dues_paid_through plus 14 days"
          - "increments lifetime_dues_paid_cents by amount_cents"
          - "runs the credit expiry sweep for this member"
          - "increments Member.version by 1"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /members/{member_id}/dues-payments"
        actor: ClubAdmin
        preconditions:
          - "amount_cents equals the annual dues of Member.tier multiplied by term_years"
          - "expected_member_version equals Member.version"
        side_effects:
          - "sets dues_paid_through to clock plus 365 multiplied by term_years days, measured from clock rather than from the stale dues_paid_through"
          - "sets dues_grace_until to dues_paid_through plus 14 days"
          - "increments lifetime_dues_paid_cents by amount_cents"
          - "runs the credit expiry sweep for this member"
          - "increments Member.version by 1"
        note: "the reinstatement leg; the same endpoint drives PENDING -> ACTIVE and LAPSED -> ACTIVE, which makes this axis cyclic"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /members/{member_id}/lapse"
        actor: ClubAdmin
        preconditions:
          - "Member.dues_grace_until is not null and clock is strictly after dues_grace_until"
        side_effects:
          - "increments Member.version by 1"
          - "every subsequent member-scoped write for this member is refused by the membership gate at validation priority 10 until dues are paid again"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /members/{member_id}/tier-changes"
        actor: ClubAdmin
        preconditions:
          - "new_tier differs from Member.tier"
          - "prorated_amount_cents equals the value produced by the tier_change_proration calculation"
          - "expected_member_version equals Member.version"
        side_effects:
          - "sets tier, tier_rank and discount_pct to the new tier's values"
          - "increments lifetime_dues_paid_cents by prorated_amount_cents"
          - "when the new tier_rank drops below COORDINATOR_MIN_TIER_RANK (2) and this member coordinates at least one DropPoint, every coordinator action on that drop point's drop runs is refused by the coordinator gate at validation priority 11"
          - "increments Member.version by 1"
        note: "a self-loop that changes the tier axis without changing the status axis"

  # ----------------------------------------------------------------- Item --
  - entity: Item
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /items/{item_id}/discontinue"
        actor: ClubAdmin
        preconditions:
          - "Item.status is ACTIVE"
        side_effects:
          - "increments Item.version by 1"
          - "already-CONFIRMED order lines are untouched; only new order lines are refused with ERR_ITEM_DISCONTINUED"

  # ---------------------------------------------------------------- Cycle --
  - entity: Cycle
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /cycles/{cycle_id}/lock"
        actor: ClubAdmin
        preconditions:
          - "Cycle.status is OPEN"
        side_effects:
          - "sets locked_at to the clock reading"
          - "HOP 1 - every MemberOrder on this cycle with status DRAFT moves to CANCELLED, and every MemberOrder with status SUBMITTED moves to LOCKED"
          - "HOP 2 - because an order moved to LOCKED, each of its OrderLines with status REQUESTED moves to CONFIRMED; bound_case_price_cents, unit_price_cents, split_fee_per_unit_cents, is_split_unit and confirmed_units are written by the price_binding and split_unit_price calculations using the PriceVersion in force at Cycle.cutoff_at"
          - "HOP 3 - because lines confirmed, one CaseAggregate row is created per (RouteRun, Item) pair over those lines, and the case_aggregation calculation writes cases_ordered, covered_units, remainder_units, overage_units and dropped_units; under ROUND_UP the overage line's confirmed_units is raised and overage_order_line_id is set; under DROP the trailing lines' confirmed_units are reduced and any line reduced to zero moves CONFIRMED -> DROPPED"
          - "HOP 4 - because confirmed_units settled, each MemberOrder's estimated_total_cents is recomputed and each DropRun's subtotal_cents and discounted_subtotal_cents are recomputed; each DropRun with status OPEN moves to QUALIFIED when subtotal_cents >= its DropPoint.drop_minimum_cents, otherwise to DEFERRED"
          - "HOP 5 - because drop qualification settled, each RouteRun's aggregated_subtotal_cents is recomputed over its QUALIFIED drop runs and the RouteRun moves PLANNED -> QUALIFIED when aggregated_subtotal_cents > its Route.route_minimum_cents, otherwise PLANNED -> DEFERRED"
          - "HOP 6 - because a RouteRun moved to DEFERRED, every DropRun on it with status QUALIFIED reverts to DEFERRED, every MemberOrder on those drop runs moves LOCKED -> CANCELLED, and every OrderLine on those orders moves CONFIRMED -> CANCELLED. No Payment can exist yet on this path - authorization requires the order to already be LOCKED, which only this same request achieves - so the authorization-voiding leg belongs to POST /cycles/{cycle_id}/cancel, not here"
          - "increments Cycle.version by 1"
        note: "the depth-6 cascade; each hop is caused by the hop above it, not by the lock itself"
      - from: LOCKED
        to: SUBMITTED
        trigger: "POST /cycles/{cycle_id}/submit"
        actor: ClubAdmin
        preconditions:
          - "Cycle.status is LOCKED"
          - "at least one RouteRun on this cycle has status QUALIFIED, otherwise ERR_ROUTE_MINIMUM_NOT_MET"
        side_effects:
          - "every RouteRun with status QUALIFIED moves to SUBMITTED"
          - "every DropRun with status QUALIFIED moves to SUBMITTED"
          - "increments Cycle.version by 1"
      - from: SUBMITTED
        to: RECEIVED
        trigger: "POST /cycles/{cycle_id}/receive"
        actor: WarehouseOperator
        preconditions:
          - "Cycle.status is SUBMITTED"
        side_effects:
          - "sets received_at to the clock reading and exception_deadline_at to received_at plus 48 hours"
          - "exception_state becomes OPEN because the clock now sits inside the half-open exception window"
          - "every RouteRun with status SUBMITTED moves to RECEIVED"
          - "every DropRun with status SUBMITTED moves to RECEIVED"
          - "increments Cycle.version by 1"
      - from: RECEIVED
        to: CONSOLIDATED
        trigger: "POST /cycles/{cycle_id}/consolidate"
        actor: WarehouseOperator
        preconditions:
          - "Cycle.status is RECEIVED"
          - "clock is at or after exception_deadline_at, otherwise ERR_EXCEPTION_WINDOW_OPEN"
          - "every Pallet on every RouteRun of this cycle has status SEALED, otherwise ERR_PALLETS_NOT_SEALED"
        side_effects:
          - "every SubstitutionOffer still in PENDING moves to AUTO_DECLINED, its offered_units are removed from the line's allocated_units, and the line moves to SHORT_FILLED or DROPPED accordingly"
          - "every RouteRun with status RECEIVED moves to CONSOLIDATED"
          - "increments Cycle.version by 1"
      - from: CONSOLIDATED
        to: DELIVERED
        trigger: "POST /cycles/{cycle_id}/deliver"
        actor: WarehouseOperator
        preconditions:
          - "Cycle.status is CONSOLIDATED"
        side_effects:
          - "every Pallet with status SEALED moves to DELIVERED"
          - "every RouteRun with status CONSOLIDATED moves to DELIVERED"
          - "every DropRun with status RECEIVED moves to SETTLED"
          - "every MemberOrder with status FILLED or SHORT_FILLED moves to DELIVERED"
          - "one CommissionAccrual with status ACCRUED is created per SETTLED DropRun that has a non-null coordinator_member_id, using the coordinator_commission calculation"
          - "increments Cycle.version by 1"
      - from: DELIVERED
        to: RECONCILED
        trigger: "POST /cycles/{cycle_id}/reconcile"
        actor: FinanceOfficer
        preconditions:
          - "Cycle.status is DELIVERED"
          - "every DropRun on this cycle with status SETTLED has a DropReconciliation with status POSTED, otherwise ERR_DROP_RECONCILIATION_INCOMPLETE"
        side_effects:
          - "increments Cycle.version by 1"
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /cycles/{cycle_id}/close"
        actor: ClubAdmin
        preconditions:
          - "Cycle.status is RECONCILED"
        side_effects:
          - "every MemberOrder with status DELIVERED moves to CLOSED"
          - "the global write gate at validation priority 9 activates - every mutating endpoint whose target resolves to this cycle now fails with ERR_CYCLE_CLOSED before any other business rule is evaluated"
          - "increments Cycle.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /cycles/{cycle_id}/cancel"
        actor: ClubAdmin
        preconditions:
          - "Cycle.status is OPEN"
        side_effects:
          - "every RouteRun on this cycle moves to DEFERRED"
          - "every DropRun on this cycle whose status is OPEN or QUALIFIED moves to CANCELLED"
          - "every MemberOrder on this cycle whose status is DRAFT, SUBMITTED or LOCKED moves to CANCELLED"
          - "every OrderLine on those orders whose status is REQUESTED or CONFIRMED moves to CANCELLED"
          - "every SUCCEEDED AUTHORIZATION Payment on those orders moves to VOIDED and the order's payment_status becomes VOIDED"
          - "increments Cycle.version by 1"
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /cycles/{cycle_id}/cancel"
        actor: ClubAdmin
        preconditions:
          - "Cycle.status is LOCKED"
        side_effects:
          - "identical to the OPEN -> CANCELLED side-effect set"
          - "increments Cycle.version by 1"

  # -------------------------------------------------------------- RouteRun --
  - entity: RouteRun
    initial_state: PLANNED
    terminal_states: [DEFERRED, DELIVERED]
    transitions:
      - from: PLANNED
        to: QUALIFIED
        trigger: "system, during POST /cycles/{cycle_id}/lock hop 5"
        actor: system
        preconditions:
          - "aggregated_subtotal_cents > Route.route_minimum_cents, strictly greater"
        side_effects:
          - "the run stays in the cycle; its QUALIFIED drop runs keep their orders"
          - "increments RouteRun.version by 1"
      - from: PLANNED
        to: DEFERRED
        trigger: "system, during POST /cycles/{cycle_id}/lock hop 5"
        actor: system
        preconditions:
          - "aggregated_subtotal_cents <= Route.route_minimum_cents"
        side_effects:
          - "drives hop 6 - the QUALIFIED drop runs on this run revert to DEFERRED and their orders cancel"
          - "increments RouteRun.version by 1"
        note: "the two PLANNED branches carry disjoint side-effect sets, which is what makes this machine non-linear"
      - from: QUALIFIED
        to: SUBMITTED
        trigger: "system, during POST /cycles/{cycle_id}/submit"
        actor: system
        preconditions:
          - "the parent Cycle is moving LOCKED -> SUBMITTED"
        side_effects:
          - "increments RouteRun.version by 1"
      - from: SUBMITTED
        to: RECEIVED
        trigger: "system, during POST /cycles/{cycle_id}/receive"
        actor: system
        preconditions:
          - "the parent Cycle is moving SUBMITTED -> RECEIVED"
        side_effects:
          - "receipt lines and pallet building become available on this run"
          - "increments RouteRun.version by 1"
      - from: RECEIVED
        to: CONSOLIDATED
        trigger: "system, during POST /cycles/{cycle_id}/consolidate"
        actor: system
        preconditions:
          - "every Pallet on this run has status SEALED"
        side_effects:
          - "increments RouteRun.version by 1"
      - from: CONSOLIDATED
        to: DELIVERED
        trigger: "system, during POST /cycles/{cycle_id}/deliver"
        actor: system
        preconditions:
          - "the parent Cycle is moving CONSOLIDATED -> DELIVERED"
        side_effects:
          - "increments RouteRun.version by 1"
      - from: PLANNED
        to: DEFERRED
        trigger: "system, during POST /cycles/{cycle_id}/cancel"
        actor: system
        preconditions:
          - "the parent Cycle is moving OPEN or LOCKED -> CANCELLED"
        side_effects:
          - "increments RouteRun.version by 1"
      - from: QUALIFIED
        to: DEFERRED
        trigger: "system, during POST /cycles/{cycle_id}/cancel"
        actor: system
        preconditions:
          - "the parent Cycle is moving LOCKED -> CANCELLED"
        side_effects:
          - "increments RouteRun.version by 1"

  # --------------------------------------------------------------- DropRun --
  - entity: DropRun
    initial_state: OPEN
    terminal_states: [MERGED, ROLLED_FORWARD, SETTLED, CANCELLED]
    transitions:
      - from: OPEN
        to: MERGED
        trigger: "POST /drop-runs/{drop_run_id}/merge"
        actor: DropCoordinator
        preconditions:
          - "Cycle.status is OPEN"
          - "the acting member is this drop run's coordinator_member_id and their tier_rank >= 2"
          - "target_drop_run_id names a different DropRun with status OPEN on the same route_run_id, otherwise ERR_MERGE_TARGET_INVALID"
          - "expected_drop_run_version equals this DropRun.version"
        side_effects:
          - "HOP 1 - sets merged_into_drop_run_id to the target and this drop run's subtotal_cents to 0"
          - "HOP 2 - because this drop run emptied, every MemberOrder whose drop_run_id was this run is repointed to the target drop run"
          - "HOP 3 - because the target gained orders, the target's subtotal_cents and discounted_subtotal_cents are recomputed"
          - "HOP 4 - because the target's subtotal changed, the RouteRun's aggregated_subtotal_cents is recomputed"
          - "increments DropRun.version by 1 on both this run and the target"
        note: "the depth-4 cascade, independent of the cycle-lock cascade"
      - from: OPEN
        to: QUALIFIED
        trigger: "system, during POST /cycles/{cycle_id}/lock hop 4"
        actor: system
        preconditions:
          - "subtotal_cents >= DropPoint.drop_minimum_cents, inclusive"
        side_effects:
          - "increments DropRun.version by 1"
      - from: OPEN
        to: DEFERRED
        trigger: "system, during POST /cycles/{cycle_id}/lock hop 4"
        actor: system
        preconditions:
          - "subtotal_cents < DropPoint.drop_minimum_cents"
        side_effects:
          - "every MemberOrder on this drop run moves LOCKED -> CANCELLED and its lines move CONFIRMED -> CANCELLED"
          - "this drop run's subtotal is excluded from the RouteRun aggregate computed in hop 5"
          - "increments DropRun.version by 1"
      - from: QUALIFIED
        to: DEFERRED
        trigger: "system, during POST /cycles/{cycle_id}/lock hop 6"
        actor: system
        preconditions:
          - "this drop run's RouteRun moved PLANNED -> DEFERRED in hop 5"
        side_effects:
          - "every MemberOrder on this drop run moves LOCKED -> CANCELLED"
          - "increments DropRun.version by 1"
        note: "the revert leg - a drop run that had already qualified is pulled back because a sibling aggregate failed"
      - from: QUALIFIED
        to: SUBMITTED
        trigger: "system, during POST /cycles/{cycle_id}/submit"
        actor: system
        preconditions:
          - "the drop run's RouteRun is moving QUALIFIED -> SUBMITTED"
        side_effects:
          - "increments DropRun.version by 1"
      - from: SUBMITTED
        to: RECEIVED
        trigger: "system, during POST /cycles/{cycle_id}/receive"
        actor: system
        preconditions:
          - "the drop run's RouteRun is moving SUBMITTED -> RECEIVED"
        side_effects:
          - "increments DropRun.version by 1"
      - from: RECEIVED
        to: SETTLED
        trigger: "system, during POST /cycles/{cycle_id}/deliver"
        actor: system
        preconditions:
          - "the drop run's RouteRun is moving CONSOLIDATED -> DELIVERED"
        side_effects:
          - "a CommissionAccrual with status ACCRUED is created when coordinator_member_id is not null"
          - "increments DropRun.version by 1"
      - from: DEFERRED
        to: ROLLED_FORWARD
        trigger: "POST /drop-runs/{drop_run_id}/roll-forward"
        actor: DropCoordinator
        preconditions:
          - "DropRun.status is DEFERRED"
          - "the acting member is this drop run's coordinator_member_id and their tier_rank >= 2"
          - "rollforward_count < ROLLFORWARD_MAX_PER_DROP_RUN (1), otherwise ERR_ROLLFORWARD_LIMIT"
          - "target_cycle_id names a Cycle with status OPEN whose cutoff_at is strictly after the source cycle's cutoff_at"
        side_effects:
          - "HOP 1 - increments rollforward_count by 1"
          - "HOP 2 - because the run rolled, a new DropRun with status OPEN is created on the target cycle for the same drop point, attaching to (or creating) the target cycle's RouteRun for the drop point's route; the new run inherits rollforward_count from the source run, so a chain of deferrals can be rolled forward only once in total"
          - "HOP 3 - because the new drop run exists, one new MemberOrder with status DRAFT is created on it for each member whose cancelled order on the source run carried at least one line with rollover_opt_in true"
          - "HOP 4 - because those orders exist, one new OrderLine with status REQUESTED and rolled_from_order_line_id set is created for each such line, carrying qty_units equal to the source line's short_units when the source line was SHORT_FILLED and its qty_units otherwise; the new line is priced at the target cycle's cutoff under ROLLOVER_PRICE_POLICY NEW_CYCLE_PRICE, so no price is carried over"
          - "HOP 5 - because the source lines were consumed, each source OrderLine with rollover_opt_in true moves to ROLLED_FORWARD"
          - "increments DropRun.version by 1"
        note: "the cross-cycle depth-5 cascade"
      - from: OPEN
        to: CANCELLED
        trigger: "system, during POST /cycles/{cycle_id}/cancel"
        actor: system
        preconditions:
          - "the parent Cycle is moving OPEN or LOCKED -> CANCELLED"
        side_effects:
          - "increments DropRun.version by 1"
      - from: QUALIFIED
        to: CANCELLED
        trigger: "system, during POST /cycles/{cycle_id}/cancel"
        actor: system
        preconditions:
          - "the parent Cycle is moving LOCKED -> CANCELLED"
        side_effects:
          - "increments DropRun.version by 1"

  # ----------------------------------------------------- MemberOrder.status --
  - entity: MemberOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /member-orders/{member_order_id}/submit"
        actor: Member
        preconditions:
          - "Cycle.status is OPEN and clock < Cycle.cutoff_at"
          - "the acting member owns this order"
          - "Member.status is ACTIVE"
          - "the order has at least one OrderLine with status REQUESTED"
        side_effects:
          - "recomputes the DropRun's subtotal_cents from the order's REQUESTED lines at the prices currently in force"
          - "increments MemberOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "system, during POST /cycles/{cycle_id}/lock hop 1"
        actor: system
        preconditions:
          - "the order was never submitted"
        side_effects:
          - "every OrderLine on the order moves REQUESTED -> CANCELLED"
          - "increments MemberOrder.version by 1"
      - from: SUBMITTED
        to: LOCKED
        trigger: "system, during POST /cycles/{cycle_id}/lock hop 1"
        actor: system
        preconditions:
          - "Cycle is moving OPEN -> LOCKED"
        side_effects:
          - "drives hop 2 - the order's REQUESTED lines confirm and bind their prices"
          - "increments MemberOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /member-orders/{member_order_id}/cancel"
        actor: Member
        preconditions:
          - "Cycle.status is OPEN"
          - "the acting member owns this order"
        side_effects:
          - "every OrderLine on the order moves REQUESTED -> CANCELLED"
          - "recomputes the DropRun's subtotal_cents"
          - "increments MemberOrder.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /member-orders/{member_order_id}/cancel"
        actor: Member
        preconditions:
          - "Cycle.status is OPEN"
          - "the acting member owns this order"
        side_effects:
          - "every OrderLine on the order moves REQUESTED -> CANCELLED"
          - "every SUCCEEDED AUTHORIZATION Payment on the order moves to VOIDED and payment_status becomes VOIDED, releasing any credit reserved by the authorization"
          - "recomputes the DropRun's subtotal_cents"
          - "increments MemberOrder.version by 1"
      - from: LOCKED
        to: CANCELLED
        trigger: "system, during POST /cycles/{cycle_id}/lock hop 6 or during POST /cycles/{cycle_id}/cancel"
        actor: system
        preconditions:
          - "the order's DropRun moved to DEFERRED or CANCELLED"
        side_effects:
          - "every OrderLine on the order moves CONFIRMED -> CANCELLED"
          - "every SUCCEEDED AUTHORIZATION Payment moves to VOIDED and payment_status becomes VOIDED; this leg only ever fires on the POST /cycles/{cycle_id}/cancel path, because an authorization cannot predate the lock that creates the LOCKED state"
          - "increments MemberOrder.version by 1"
      - from: LOCKED
        to: FILLED
        trigger: "system, during POST /receipt-lines"
        actor: system
        preconditions:
          - "every OrderLine on this order has allocated_units equal to confirmed_units"
        side_effects:
          - "recomputes gross_cents, split_fee_cents, tier_discount_cents and pre_credit_total_cents"
          - "increments MemberOrder.version by 1"
      - from: LOCKED
        to: SHORT_FILLED
        trigger: "system, during POST /receipt-lines"
        actor: system
        preconditions:
          - "at least one OrderLine on this order has allocated_units < confirmed_units"
        side_effects:
          - "recomputes gross_cents, split_fee_cents, tier_discount_cents and pre_credit_total_cents"
          - "increments MemberOrder.version by 1"
      - from: SHORT_FILLED
        to: FILLED
        trigger: "system, during POST /receipt-lines"
        actor: system
        preconditions:
          - "a later receipt line raised every line's allocated_units to its confirmed_units"
        side_effects:
          - "recomputes gross_cents and pre_credit_total_cents"
          - "increments MemberOrder.version by 1"
        note: "the fulfilment axis can move backwards toward FILLED as later receipts arrive"
      - from: FILLED
        to: DELIVERED
        trigger: "system, during POST /cycles/{cycle_id}/deliver"
        actor: system
        preconditions:
          - "the order's DropRun is moving RECEIVED -> SETTLED"
        side_effects:
          - "increments MemberOrder.version by 1"
      - from: SHORT_FILLED
        to: DELIVERED
        trigger: "system, during POST /cycles/{cycle_id}/deliver"
        actor: system
        preconditions:
          - "the order's DropRun is moving RECEIVED -> SETTLED"
        side_effects:
          - "increments MemberOrder.version by 1"
      - from: DELIVERED
        to: CLOSED
        trigger: "system, during POST /cycles/{cycle_id}/close"
        actor: system
        preconditions:
          - "the parent Cycle is moving RECONCILED -> CLOSED"
        side_effects:
          - "increments MemberOrder.version by 1"

  # ---------------------------------------------- MemberOrder.payment_status --
  - entity: MemberOrder
    initial_state: UNPAID
    terminal_states: [VOIDED, REFUNDED]
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "POST /member-orders/{member_order_id}/authorize with simulated_outcome SUCCEEDED"
        actor: FinanceOfficer
        preconditions:
          - "MemberOrder.status is LOCKED, FILLED or SHORT_FILLED"
          - "the parent Cycle.status is LOCKED, SUBMITTED, RECEIVED, CONSOLIDATED or DELIVERED"
        side_effects:
          - "creates a Payment with kind AUTHORIZATION, method CARD, status SUCCEEDED and amount_cents equal to authorized_amount_cents"
          - "writes authorized_amount_cents from the payment_authorization_estimate calculation"
          - "increments MemberOrder.version by 1"
      - from: UNPAID
        to: AUTH_FAILED
        trigger: "POST /member-orders/{member_order_id}/authorize with simulated_outcome FAILED"
        actor: FinanceOfficer
        preconditions:
          - "MemberOrder.status is LOCKED, FILLED or SHORT_FILLED"
        side_effects:
          - "creates a Payment with kind AUTHORIZATION, status FAILED and amount_cents equal to the computed authorized_amount_cents"
          - "leaves MemberOrder.authorized_amount_cents at 0"
          - "increments MemberOrder.version by 1"
      - from: AUTH_FAILED
        to: AUTHORIZED
        trigger: "POST /member-orders/{member_order_id}/authorize with simulated_outcome SUCCEEDED"
        actor: FinanceOfficer
        preconditions:
          - "MemberOrder.status is LOCKED, FILLED or SHORT_FILLED"
        side_effects:
          - "creates a second AUTHORIZATION Payment with status SUCCEEDED"
          - "writes authorized_amount_cents"
          - "increments MemberOrder.version by 1"
        note: "the retry leg makes this axis cyclic rather than a one-way pipeline"
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /member-orders/{member_order_id}/capture"
        actor: FinanceOfficer
        preconditions:
          - "MemberOrder.status is FILLED, SHORT_FILLED or DELIVERED"
          - "the parent Cycle.status is CONSOLIDATED or DELIVERED"
          - "the capture variance is inside the tolerance band, otherwise ERR_PAYMENT_VARIANCE_EXCEEDED"
        side_effects:
          - "runs the credit expiry sweep, then the credit_consumption_fifo calculation, writing credit_applied_cents and actual_total_cents"
          - "creates a Payment with kind CAPTURE, method STORE_CREDIT and amount_cents equal to credit_applied_cents when credit_applied_cents > 0"
          - "creates a Payment with kind CAPTURE, method CARD and amount_cents equal to actual_total_cents when actual_total_cents > 0"
          - "sets captured_cents to credit_applied_cents plus actual_total_cents"
          - "decrements the consumed CreditGrants' remaining_cents and moves each to PARTIALLY_CONSUMED or CONSUMED"
          - "increments MemberOrder.version by 1"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "system, during POST /member-orders/{member_order_id}/cancel, POST /cycles/{cycle_id}/lock hop 6 or POST /cycles/{cycle_id}/cancel"
        actor: system
        preconditions:
          - "the order is moving to CANCELLED"
        side_effects:
          - "every SUCCEEDED AUTHORIZATION Payment moves to VOIDED"
          - "authorized_amount_cents returns to 0"
          - "increments MemberOrder.version by 1"
      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "POST /member-orders/{member_order_id}/refund"
        actor: FinanceOfficer
        preconditions:
          - "amount_cents < captured_cents - refunded_cents"
          - "the drop run's DropReconciliation is not POSTED"
        side_effects:
          - "see the refund cascade documented on the CommissionAccrual machine"
          - "increments MemberOrder.version by 1"
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /member-orders/{member_order_id}/refund"
        actor: FinanceOfficer
        preconditions:
          - "amount_cents equals captured_cents - refunded_cents"
          - "the drop run's DropReconciliation is not POSTED"
        side_effects:
          - "see the refund cascade documented on the CommissionAccrual machine"
          - "increments MemberOrder.version by 1"
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /member-orders/{member_order_id}/refund"
        actor: FinanceOfficer
        preconditions:
          - "amount_cents equals captured_cents - refunded_cents"
        side_effects:
          - "see the refund cascade documented on the CommissionAccrual machine"
          - "increments MemberOrder.version by 1"

  # ------------------------------------------------------------- OrderLine --
  - entity: OrderLine
    initial_state: REQUESTED
    terminal_states: [FILLED, DROPPED, ROLLED_FORWARD, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "system, during POST /cycles/{cycle_id}/lock hop 2"
        actor: system
        preconditions:
          - "the owning MemberOrder moved SUBMITTED -> LOCKED"
          - "a PriceVersion for the item with effective_from <= Cycle.cutoff_at exists"
        side_effects:
          - "writes bound_case_price_cents, split_unit_base derived unit_price_cents, split_fee_per_unit_cents and is_split_unit"
          - "sets confirmed_units to qty_units, before the remainder policy in hop 3 adjusts it"
          - "increments OrderLine.version by 1"
      - from: CONFIRMED
        to: DROPPED
        trigger: "system, during POST /cycles/{cycle_id}/lock hop 3"
        actor: system
        preconditions:
          - "Item.remainder_policy is DROP and this line's confirmed_units was reduced to 0 by the trailing-line reduction"
        side_effects:
          - "sets confirmed_units and line_gross_cents to 0"
          - "increments OrderLine.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /order-lines/{order_line_id}/cancel"
        actor: Member
        preconditions:
          - "Cycle.status is OPEN and clock < Cycle.cutoff_at"
          - "the acting member owns the line's MemberOrder"
          - "expected_member_order_version equals MemberOrder.version"
        side_effects:
          - "recomputes the owning MemberOrder's estimated_total_cents and the DropRun's subtotal_cents"
          - "increments MemberOrder.version and OrderLine.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system, during POST /cycles/{cycle_id}/lock hop 6, POST /cycles/{cycle_id}/cancel or MemberOrder cancellation"
        actor: system
        preconditions:
          - "the owning MemberOrder moved to CANCELLED"
        side_effects:
          - "increments OrderLine.version by 1"
      - from: CONFIRMED
        to: FILLED
        trigger: "system, during POST /receipt-lines"
        actor: system
        preconditions:
          - "the shortage_allocation calculation assigned allocated_units equal to confirmed_units"
        side_effects:
          - "writes allocated_units, short_units 0 and line_gross_cents"
          - "increments OrderLine.version by 1"
      - from: CONFIRMED
        to: SHORT_FILLED
        trigger: "system, during POST /receipt-lines"
        actor: system
        preconditions:
          - "the shortage_allocation calculation assigned 0 < allocated_units < confirmed_units"
        side_effects:
          - "writes allocated_units, short_units and allocation_remainder_rank"
          - "increments OrderLine.version by 1"
      - from: CONFIRMED
        to: DROPPED
        trigger: "system, during POST /receipt-lines"
        actor: system
        preconditions:
          - "the shortage_allocation calculation assigned allocated_units 0"
        side_effects:
          - "sets short_units to confirmed_units and line_gross_cents to 0"
          - "increments OrderLine.version by 1"
      - from: SHORT_FILLED
        to: FILLED
        trigger: "system, during POST /receipt-lines"
        actor: system
        preconditions:
          - "a later receipt line raised allocated_units to confirmed_units"
        side_effects:
          - "sets short_units to 0"
          - "increments OrderLine.version by 1"
      - from: CONFIRMED
        to: SUBSTITUTED
        trigger: "system, during POST /receipt-lines or POST /substitution-offers/{substitution_offer_id}/approve"
        actor: system
        preconditions:
          - "a SubstitutionOffer for this line reached APPROVED or AUTO_APPROVED"
        side_effects:
          - "sets unit_price_cents to the offer's offered_unit_price_cents and allocated_units to the offer's offered_units"
          - "recomputes line_gross_cents and the owning MemberOrder's gross_cents"
          - "increments OrderLine.version by 1"
      - from: SHORT_FILLED
        to: ROLLED_FORWARD
        trigger: "system, during POST /drop-runs/{drop_run_id}/roll-forward hop 5"
        actor: system
        preconditions:
          - "rollover_opt_in is true and the source DropRun moved DEFERRED -> ROLLED_FORWARD"
        side_effects:
          - "increments OrderLine.version by 1"
      - from: CANCELLED
        to: ROLLED_FORWARD
        trigger: "system, during POST /drop-runs/{drop_run_id}/roll-forward hop 5"
        actor: system
        preconditions:
          - "rollover_opt_in is true and the line was cancelled by the drop run's deferral"
        side_effects:
          - "increments OrderLine.version by 1"
        note: "a deferred drop cancels its lines first; roll-forward then promotes exactly the opted-in ones out of CANCELLED"

  # ----------------------------------------------------- SubstitutionOffer --
  - entity: SubstitutionOffer
    initial_state: PENDING
    terminal_states: [APPROVED, DECLINED, AUTO_APPROVED, AUTO_DECLINED]
    transitions:
      - from: PENDING
        to: AUTO_APPROVED
        trigger: "system, at SubstitutionOffer creation during POST /receipt-lines"
        actor: system
        preconditions:
          - "the line's substitution_pref is ANY_SUBSTITUTE, or it is APPROVAL_REQUIRED and within_tolerance is true"
        side_effects:
          - "the OrderLine moves CONFIRMED -> SUBSTITUTED at the offered price"
          - "increments SubstitutionOffer.version by 1"
        note: "resolved inside the creating request; the offer never dwells in PENDING on this branch"
      - from: PENDING
        to: AUTO_DECLINED
        trigger: "system, at SubstitutionOffer creation during POST /receipt-lines"
        actor: system
        preconditions:
          - "the line's substitution_pref is NONE"
        side_effects:
          - "the substitute units are not allocated; the OrderLine keeps its original price and is short by the offered_units"
          - "increments SubstitutionOffer.version by 1"
      - from: PENDING
        to: APPROVED
        trigger: "POST /substitution-offers/{substitution_offer_id}/approve"
        actor: Member
        preconditions:
          - "the acting member owns the offer's OrderLine's MemberOrder"
          - "Cycle.exception_state is OPEN and clock < respond_by"
        side_effects:
          - "the OrderLine moves CONFIRMED -> SUBSTITUTED at offered_unit_price_cents"
          - "recomputes the owning MemberOrder's gross_cents, tier_discount_cents and pre_credit_total_cents"
          - "increments SubstitutionOffer.version by 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /substitution-offers/{substitution_offer_id}/decline"
        actor: Member
        preconditions:
          - "the acting member owns the offer's OrderLine's MemberOrder"
          - "Cycle.exception_state is OPEN and clock < respond_by"
        side_effects:
          - "offered_units are removed from the line's allocated_units and the line moves to SHORT_FILLED or DROPPED"
          - "recomputes the owning MemberOrder's gross_cents and pre_credit_total_cents"
          - "increments SubstitutionOffer.version by 1"
      - from: PENDING
        to: AUTO_DECLINED
        trigger: "system, during POST /cycles/{cycle_id}/consolidate"
        actor: system
        preconditions:
          - "the offer is still PENDING when the exception window closes"
        side_effects:
          - "silence declines - offered_units are removed from the line's allocated_units and the line moves to SHORT_FILLED or DROPPED"
          - "increments SubstitutionOffer.version by 1"

  # ---------------------------------------------------------------- Pallet --
  - entity: Pallet
    initial_state: BUILDING
    terminal_states: [DELIVERED]
    transitions:
      - from: BUILDING
        to: SEALED
        trigger: "POST /pallets/{pallet_id}/seal"
        actor: WarehouseOperator
        preconditions:
          - "Pallet.status is BUILDING"
          - "the parent Cycle.status is RECEIVED"
        side_effects:
          - "increments Pallet.version by 1"
      - from: SEALED
        to: DELIVERED
        trigger: "system, during POST /cycles/{cycle_id}/deliver"
        actor: system
        preconditions:
          - "the parent Cycle is moving CONSOLIDATED -> DELIVERED"
        side_effects:
          - "increments Pallet.version by 1"

  # --------------------------------------------------------------- Payment --
  - entity: Payment
    initial_state: SUCCEEDED
    terminal_states: [FAILED, VOIDED]
    transitions:
      - from: SUCCEEDED
        to: VOIDED
        trigger: "system, during MemberOrder cancellation"
        actor: system
        preconditions:
          - "Payment.kind is AUTHORIZATION and the owning MemberOrder is moving to CANCELLED"
        side_effects:
          - "increments Payment.version by 1"
    note: "a Payment is minted directly in SUCCEEDED or FAILED by the authorize, capture and refund endpoints; only an AUTHORIZATION can later be VOIDED"

  # ------------------------------------------------------ DropReconciliation --
  - entity: DropReconciliation
    initial_state: DRAFT
    terminal_states: [POSTED, VOID]
    transitions:
      - from: DRAFT
        to: BALANCED
        trigger: "system, inside POST /drop-reconciliations"
        actor: system
        preconditions:
          - "abs(variance_cents) <= RECON_VARIANCE_TOLERANCE_CENTS (200)"
        side_effects:
          - "increments DropReconciliation.version by 1"
        note: "the auto-branch fires inside the creating request; DRAFT is never observable at rest"
      - from: DRAFT
        to: VARIANCE_HELD
        trigger: "system, inside POST /drop-reconciliations"
        actor: system
        preconditions:
          - "abs(variance_cents) > RECON_VARIANCE_TOLERANCE_CENTS (200)"
        side_effects:
          - "increments DropReconciliation.version by 1"
      - from: VARIANCE_HELD
        to: BALANCED
        trigger: "POST /drop-reconciliations/{drop_reconciliation_id}/resolve-variance"
        actor: FinanceOfficer
        preconditions:
          - "DropReconciliation.status is VARIANCE_HELD"
          - "adjustment_cents equals the current variance_cents exactly"
        side_effects:
          - "adds adjustment_cents to club_margin_cents so that variance_cents becomes 0"
          - "increments DropReconciliation.version by 1"
        note: "the revert leg - a held reconciliation can return to BALANCED without being recreated"
      - from: BALANCED
        to: VARIANCE_HELD
        trigger: "system, during POST /member-orders/{member_order_id}/refund or POST /volunteer-shifts/{volunteer_shift_id}/verify"
        actor: system
        preconditions:
          - "a downstream recompute pushed abs(variance_cents) above 200"
        side_effects:
          - "increments DropReconciliation.version by 1"
      - from: BALANCED
        to: POSTED
        trigger: "POST /drop-reconciliations/{drop_reconciliation_id}/post"
        actor: FinanceOfficer
        preconditions:
          - "DropReconciliation.status is BALANCED"
          - "the acting X-User-ID differs from prepared_by_user_id, otherwise ERR_SEGREGATION_OF_DUTIES"
          - "the parent Cycle.status is DELIVERED"
        side_effects:
          - "sets posted_by_user_id and posted_at"
          - "the POSTED write gate at validation priority 12 activates for this drop run - refunds, receipt lines, commission payouts, volunteer verification and further reconciliation drafts on it are refused with ERR_RECONCILIATION_POSTED"
          - "increments DropReconciliation.version by 1"
      - from: BALANCED
        to: VOID
        trigger: "system, during a superseding POST /drop-reconciliations for the same drop run"
        actor: system
        preconditions:
          - "a new reconciliation draft is being created for the same drop_run_id"
        side_effects:
          - "increments DropReconciliation.version by 1"
      - from: VARIANCE_HELD
        to: VOID
        trigger: "system, during a superseding POST /drop-reconciliations for the same drop run"
        actor: system
        preconditions:
          - "a new reconciliation draft is being created for the same drop_run_id"
        side_effects:
          - "increments DropReconciliation.version by 1"

  # ------------------------------------------------------ CommissionAccrual --
  - entity: CommissionAccrual
    initial_state: ACCRUED
    terminal_states: [PAID]
    transitions:
      - from: ACCRUED
        to: ADJUSTED
        trigger: "system, during POST /member-orders/{member_order_id}/refund or POST /volunteer-shifts/{volunteer_shift_id}/verify"
        actor: system
        preconditions:
          - "clawback_cents or volunteer_multiplier_applied changed after accrual"
        side_effects:
          - "recomputes accrued_cents, clawback_cents and net_cents"
          - "increments CommissionAccrual.version by 1"
        note: |
          THE REFUND CASCADE (depth 4, independent of the cycle-lock cascade).
          HOP 1 - POST /member-orders/{member_order_id}/refund creates a Payment with kind REFUND
                  and status SUCCEEDED for amount_cents.
          HOP 2 - because that Payment exists, the MemberOrder's refunded_cents rises and its
                  payment_status moves CAPTURED -> PARTIALLY_REFUNDED or CAPTURED -> REFUNDED;
                  when destination is STORE_CREDIT a CreditGrant with source REFUND is also minted
                  and Member.credit_balance_cents rises by amount_cents.
          HOP 3 - because the order's net member charge fell, this CommissionAccrual recomputes
                  clawback_cents as round_half_up(amount_cents multiplied by rate_applied multiplied by
                  volunteer_multiplier_applied), net_cents as accrued_cents less clawback_cents,
                  and moves ACCRUED -> ADJUSTED.
          HOP 4 - because net_cents changed, the drop run's DropReconciliation that is not POSTED
                  recomputes commission_cents and member_charges_cents, recomputes variance_cents
                  and moves BALANCED -> VARIANCE_HELD when abs(variance_cents) > 200.
      - from: ACCRUED
        to: PAID
        trigger: "POST /commission-accruals/{commission_accrual_id}/payout"
        actor: FinanceOfficer
        preconditions:
          - "the drop run's DropReconciliation has status POSTED"
          - "when payout_mode is STORE_CREDIT the drop run's volunteer_obligation_met is true, otherwise ERR_VOLUNTEER_OBLIGATION_UNMET"
        side_effects:
          - "writes payout_mode and payout_value_cents from the commission_payout_value calculation"
          - "when payout_mode is STORE_CREDIT, mints a CreditGrant with source COMMISSION for payout_value_cents expiring 180 days after the clock reading"
          - "increments CommissionAccrual.version by 1"
      - from: ADJUSTED
        to: PAID
        trigger: "POST /commission-accruals/{commission_accrual_id}/payout"
        actor: FinanceOfficer
        preconditions:
          - "the drop run's DropReconciliation has status POSTED"
          - "when payout_mode is STORE_CREDIT the drop run's volunteer_obligation_met is true"
        side_effects:
          - "identical to the ACCRUED -> PAID side-effect set, computed on the adjusted net_cents"
          - "increments CommissionAccrual.version by 1"

  # -------------------------------------------------------- VolunteerShift --
  - entity: VolunteerShift
    initial_state: LOGGED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: LOGGED
        to: VERIFIED
        trigger: "POST /volunteer-shifts/{volunteer_shift_id}/verify"
        actor: DropCoordinator
        preconditions:
          - "VolunteerShift.status is LOGGED"
          - "the acting member is the drop run's coordinator_member_id with tier_rank >= 2, or the actor is ClubAdmin"
          - "the drop run's DropReconciliation is not POSTED"
        side_effects:
          - "sets verified_by_user_id"
          - "increments VolunteerShift.version by 1"
        note: |
          THE VOLUNTEER CASCADE (depth 4).
          HOP 1 - the shift moves LOGGED -> VERIFIED.
          HOP 2 - because a shift became VERIFIED, the DropRun's verified_volunteer_hours is
                  recomputed and volunteer_obligation_met is re-evaluated against 4.0 hours;
                  the same hop mints a CreditGrant with source VOLUNTEER for
                  round_half_up(hours multiplied by 1200) cents expiring 180 days after the clock,
                  raising Member.credit_balance_cents.
          HOP 3 - because volunteer_obligation_met flipped to true, any CommissionAccrual on that
                  drop run with status ACCRUED recomputes volunteer_multiplier_applied to 1.00,
                  recomputes accrued_cents and net_cents, and moves ACCRUED -> ADJUSTED.
          HOP 4 - because net_cents changed, the drop run's non-POSTED DropReconciliation
                  recomputes commission_cents and variance_cents and moves BALANCED -> VARIANCE_HELD
                  when abs(variance_cents) > 200.
      - from: LOGGED
        to: REJECTED
        trigger: "POST /volunteer-shifts/{volunteer_shift_id}/reject"
        actor: DropCoordinator
        preconditions:
          - "VolunteerShift.status is LOGGED"
          - "the acting member is the drop run's coordinator_member_id with tier_rank >= 2, or the actor is ClubAdmin"
        side_effects:
          - "sets verified_by_user_id"
          - "no CreditGrant is minted and verified_volunteer_hours is unchanged"
          - "increments VolunteerShift.version by 1"

  # ----------------------------------------------------------- CreditGrant --
  - entity: CreditGrant
    initial_state: ACTIVE
    terminal_states: [CONSUMED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: PARTIALLY_CONSUMED
        trigger: "system, during POST /member-orders/{member_order_id}/capture"
        actor: system
        preconditions:
          - "the credit_consumption_fifo calculation drew 0 < consumed < remaining_cents from this grant"
        side_effects:
          - "reduces remaining_cents by the consumed amount"
          - "increments CreditGrant.version by 1"
      - from: ACTIVE
        to: CONSUMED
        trigger: "system, during POST /member-orders/{member_order_id}/capture"
        actor: system
        preconditions:
          - "the credit_consumption_fifo calculation drew the whole remaining_cents from this grant"
        side_effects:
          - "sets remaining_cents to 0"
          - "increments CreditGrant.version by 1"
      - from: PARTIALLY_CONSUMED
        to: CONSUMED
        trigger: "system, during POST /member-orders/{member_order_id}/capture"
        actor: system
        preconditions:
          - "a later capture drew the rest of remaining_cents"
        side_effects:
          - "sets remaining_cents to 0"
          - "increments CreditGrant.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, credit expiry sweep at the start of POST /member-orders/{member_order_id}/capture, POST /credit-grants, POST /members/{member_id}/dues-payments and POST /commission-accruals/{commission_accrual_id}/payout"
        actor: system
        preconditions:
          - "clock >= expires_at"
        side_effects:
          - "remaining_cents is left untouched but the grant is excluded from Member.credit_balance_cents and from every future FIFO draw"
          - "increments CreditGrant.version by 1"
      - from: PARTIALLY_CONSUMED
        to: EXPIRED
        trigger: "system, credit expiry sweep"
        actor: system
        preconditions:
          - "clock >= expires_at"
        side_effects:
          - "the unspent remainder is forfeited"
          - "increments CreditGrant.version by 1"

# =============================================================================
# §1.2.1 CONCURRENCY RULES — OCC on the parent's `version`, four true races
# =============================================================================

concurrency_rules:
  - rule_id: line-create-stale-order
    parent_entity: MemberOrder
    write_endpoint: "POST /order-lines"
    occ_field: "expected_member_order_version"
    description: |
      Adding a second line to a MemberOrder is a legitimate operation that a
      strictly later request would also be allowed to perform, so no state
      precondition catches a writer working from a stale view. The order's
      version advances on every line create, cancel and quantity change, so a
      request whose expected_member_order_version no longer equals the stored
      version is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: receipt-create-stale-route-run
    parent_entity: RouteRun
    write_endpoint: "POST /receipt-lines"
    occ_field: "expected_route_run_version"
    description: |
      Recording a further receipt line against a RouteRun is legitimate on its
      own terms, so a warehouse operator holding a stale picture of the run is
      not caught by any state check. Each receipt line advances the run's
      version through the allocation cascade, so a stale
      expected_route_run_version is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reconciliation-create-supersede-stale-drop-run
    parent_entity: DropRun
    write_endpoint: "POST /drop-reconciliations"
    occ_field: "expected_drop_run_version"
    description: |
      Creating a reconciliation draft for a drop run legitimately supersedes
      any existing non-POSTED draft, which is voided. Because superseding is
      allowed, a strictly later duplicate create would also succeed; the guard
      is therefore the drop run's version, which advances whenever a refund,
      a verified shift or a further receipt changes the numbers being
      reconciled.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: credit-grant-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /credit-grants"
    occ_field: "expected_member_version"
    description: |
      Minting a further adjustment grant for a member is always legitimate, so
      the operation carries no state precondition that would catch a stale
      view. The member's version advances on every dues payment, tier change
      and credit expiry sweep, so a stale expected_member_version is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 CALCULATION RULES TABLE
# All money is integer cents. `round_half_up` means half-away-from-zero at the
# whole cent. Every ordering below is pinned; nothing falls back to `id`.
# =============================================================================

calculations:

  # ---------------------------------------------------------------- pricing --
  - name: price_binding
    trigger: "POST /cycles/{cycle_id}/lock hop 2, when an OrderLine moves REQUESTED -> CONFIRMED"
    algorithm: chronological
    formula: |
      candidates = [pv for pv in PriceVersion
                    if pv.item_id == line.item_id
                    and pv.effective_from <= cycle.cutoff_at]     # INCLUSIVE
      if candidates is empty: raise ERR_NO_EFFECTIVE_PRICE
      bound = the candidate with the greatest effective_from
              (effective_from is unique per item, so no tie-break is needed)
      line.bound_case_price_cents = bound.case_price_cents
    input_set: "every PriceVersion of the line's item; no status filter exists because PriceVersion is immutable and append-only"
    constants: {}
    precision: "integer cents"
    variants:
      - name: cutoff_bound
        when: "the pinned variant; used everywhere in this scaffold"
        difference: "the comparison instant is Cycle.cutoff_at, so a price published after a member added the line still binds that line"
      - name: add_time_bound
        when: "the rejected reading of the same prose"
        difference: "the comparison instant is OrderLine.created_at, which yields the older price whenever a PriceVersion lands between line creation and cutoff; the two variants disagree by exactly the price step"

  - name: split_unit_price
    trigger: "POST /cycles/{cycle_id}/lock hop 2, and again when a SubstitutionOffer prices a substitute"
    algorithm: tiered_pricing
    formula: |
      base = ceil(case_price_cents / item.case_pack_units)          # ceiling, not round
      if qty_units % item.case_pack_units == 0:
          is_split_unit          = false
          split_fee_per_unit     = 0
          unit_price_cents       = base
      else:
          is_split_unit          = true
          split_fee_per_unit     = max(SPLIT_CASE_FEE_MIN_CENTS,
                                       round_half_up(base * SPLIT_CASE_FEE_PCT))
          unit_price_cents       = base + split_fee_per_unit
    input_set: "the bound PriceVersion for the line's item and the line's own qty_units"
    constants:
      SPLIT_CASE_FEE_PCT: 0.12
      SPLIT_CASE_FEE_MIN_CENTS: 25
    precision: "integer cents; the ceiling on `base` happens FIRST, the fee is computed from the already-rounded base, and the two are then added"
    variants:
      - name: round_then_fee
        when: "the pinned order"
        difference: "base is rounded up to whole cents before the 12 percent fee is applied to it"
      - name: fee_then_round
        when: "the rejected order"
        difference: "round_half_up(case_price_cents / case_pack_units * 1.12) in one step; for case_price_cents 10000 over a 3-unit case this gives 3733 where the pinned order gives 3734"

  # ------------------------------------------------------- case arithmetic --
  - name: case_aggregation
    trigger: "POST /cycles/{cycle_id}/lock hop 3, once per (RouteRun, Item) pair"
    algorithm: waterfall_allocation
    formula: |
      lines = OrderLines with status CONFIRMED whose item_id == item and whose
              MemberOrder sits on a DropRun with status OPEN belonging to this RouteRun,
              ordered by OrderLine.created_at ASC
      requested_units = sum(line.qty_units for line in lines)
      full_cases      = requested_units // item.case_pack_units
      remainder_units = requested_units %  item.case_pack_units

      if remainder_units == 0:
          cases_ordered = full_cases; overage_units = 0; dropped_units = 0
      elif item.remainder_policy == SHORT_FILL:
          cases_ordered = full_cases; overage_units = 0; dropped_units = 0
          # every line keeps confirmed_units == qty_units; the shortfall is
          # resolved later by shortage_allocation against covered_units
      elif item.remainder_policy == ROUND_UP:
          cases_ordered = full_cases + 1
          overage_units = item.case_pack_units - remainder_units
          dropped_units = 0
          # the overage is charged whole to ONE line: the line with the greatest
          # qty_units; ties are broken by OrderLine.created_at ASC
          overage_line  = max(lines, key = (qty_units, -created_at_ordinal))
          overage_line.confirmed_units = overage_line.qty_units + overage_units
          overage_order_line_id = overage_line.id
      elif item.remainder_policy == DROP:
          cases_ordered = full_cases
          overage_units = 0
          dropped_units = remainder_units
          shortfall = remainder_units
          for line in lines ordered by created_at DESC:
              take = min(line.qty_units, shortfall)
              line.confirmed_units = line.qty_units - take
              shortfall -= take
              if line.confirmed_units == 0: line.status = DROPPED
              if shortfall == 0: break

      covered_units = cases_ordered * item.case_pack_units
      case_price_cents = the price_binding result for this item
    input_set: "CONFIRMED OrderLines on OPEN DropRuns of this RouteRun only; lines on DEFERRED or MERGED drop runs are excluded because merge repointed their orders before lock"
    constants: {}
    precision: "whole units"
    variants:
      - name: short_fill_floor
        when: "Item.remainder_policy is SHORT_FILL"
        difference: "cases_ordered = floor(requested / pack); the club buys less than members asked for and the members absorb the shortfall pro-rata"
      - name: round_up_ceiling
        when: "Item.remainder_policy is ROUND_UP"
        difference: "cases_ordered = ceil(requested / pack); the club buys more than members asked for and ONE member - the largest line - is charged the whole overage"

  # ---------------------------------------------------------- qualification --
  - name: drop_qualification
    trigger: "POST /cycles/{cycle_id}/lock hop 4"
    algorithm: threshold
    formula: |
      subtotal_cents = sum over MemberOrders on this DropRun with status LOCKED,
                       over their OrderLines with status CONFIRMED, of
                       line.confirmed_units * line.unit_price_cents
      discounted_subtotal_cents = subtotal_cents
                                - sum over those MemberOrders of tier_discount_cents
      QUALIFIED  iff subtotal_cents >= drop_point.drop_minimum_cents     # INCLUSIVE
      DEFERRED   otherwise
    input_set: "LOCKED MemberOrders only; DRAFT orders were cancelled in hop 1 and contribute nothing"
    constants:
      DROP_MINIMUM_DEFAULT_CENTS: 50000
    precision: "integer cents"
    variants:
      - name: pre_discount_basis
        when: "the pinned variant"
        difference: "qualification reads subtotal_cents, i.e. list value before any membership discount"
      - name: post_discount_basis
        when: "the rejected variant"
        difference: "qualification reads discounted_subtotal_cents; a drop sitting exactly on its minimum in list terms fails once a PLUS member's 5 percent discount is netted out"

  - name: route_qualification
    trigger: "POST /cycles/{cycle_id}/lock hop 5"
    algorithm: threshold
    formula: |
      aggregated_subtotal_cents = sum of DropRun.subtotal_cents over DropRuns on
                                  this RouteRun whose status is OPEN or QUALIFIED
                                  (at hop 5 none is still OPEN, so this is the
                                   QUALIFIED set; before the lock the same field is
                                   maintained live so a merge is observable)
      QUALIFIED  iff aggregated_subtotal_cents > route.route_minimum_cents   # STRICTLY GREATER
      DEFERRED   otherwise
    input_set: "OPEN and QUALIFIED DropRuns; DEFERRED drop runs and MERGED drop runs contribute nothing of their own, though a MERGED run's orders already count inside its merge target. At hop 5 the OPEN set is empty, so the qualification decision reads QUALIFIED drop runs only"
    constants:
      ROUTE_MINIMUM_DEFAULT_CENTS: 250000
    precision: "integer cents"
    variants:
      - name: qualified_only_strict
        when: "the pinned variant"
        difference: "only QUALIFIED drop runs enter the sum and the comparison is strictly greater, so a route landing exactly on its minimum is DEFERRED even though a drop landing exactly on its minimum QUALIFIES"
      - name: all_drops_inclusive
        when: "the rejected variant"
        difference: "DEFERRED drop runs are also summed and the comparison is >=; a route that the pinned rule defers can qualify under this reading"

  # ------------------------------------------------------------- allocation --
  - name: shortage_allocation
    trigger: "POST /receipt-lines, hop 2 of the receipt cascade"
    algorithm: waterfall_allocation
    formula: |
      lines = OrderLines feeding this CaseAggregate with status CONFIRMED or
              SHORT_FILLED and confirmed_units > 0
      total_demand = sum(line.confirmed_units)
      supply       = CaseAggregate.units_received   (cumulative across receipt lines)

      if supply >= total_demand:
          every line gets allocated_units = confirmed_units, rank 0
      else:
          exact_i     = line.confirmed_units * supply / total_demand      # exact rational
          base_i      = floor(exact_i)
          remainder_i = exact_i - base_i
          leftover    = supply - sum(base_i)
          ranked      = lines sorted by remainder_i DESC, then created_at ASC
          the first `leftover` entries of `ranked` each receive one extra unit
          allocated_i = base_i + (1 if within the first `leftover` else 0)
          allocation_remainder_rank = 1-based position in `ranked`
      short_units = confirmed_units - allocated_units
    input_set: "CONFIRMED and SHORT_FILLED lines of the aggregate; DROPPED and CANCELLED lines are excluded from total_demand and receive nothing"
    constants:
      ALLOCATION_TIE_BREAK: "created_at ASC"
    precision: "whole units; CONSERVATION - sum(allocated_units) == min(supply, total_demand) exactly"
    variants:
      - name: largest_remainder
        when: "the pinned variant"
        difference: "every line gets its floor share first and the leftover units go to the largest fractional remainders"
      - name: sequential_fill
        when: "the rejected variant"
        difference: "lines are filled to their full confirmed_units in created_at ASC order until supply runs out, which leaves late lines with zero while the pinned rule spreads the pain"

  - name: reefer_surcharge_allocation
    trigger: "POST /route-runs/{route_run_id}/build-pallets"
    algorithm: waterfall_allocation
    formula: |
      cold_pallet_count       = number of pallets built with temp_class in {FROZEN, CHILLED}
      reefer_slots_used       = cold_pallet_count
      reefer_surcharge_cents  = reefer_slots_used * REEFER_SURCHARGE_CENTS_PER_SLOT

      cold_i = for each MemberOrder on this RouteRun with status FILLED or SHORT_FILLED,
               sum over its OrderLines whose Item.temp_class is FROZEN or CHILLED of
               allocated_units * unit_price_cents
      total_cold = sum(cold_i)          # > 0 whenever a cold pallet exists
      exact_i     = reefer_surcharge_cents * cold_i / total_cold
      base_i      = floor(exact_i)
      leftover    = reefer_surcharge_cents - sum(base_i)
      ranked      = orders sorted by (exact_i - base_i) DESC, then MemberOrder.created_at ASC
      the first `leftover` entries each receive one extra cent
      MemberOrder.reefer_alloc_cents = base_i + (1 if within the first `leftover` else 0)
      DropRun.reefer_alloc_cents     = sum of its orders' reefer_alloc_cents
    input_set: "FILLED and SHORT_FILLED MemberOrders on the RouteRun; CANCELLED orders are excluded"
    constants:
      REEFER_SURCHARGE_CENTS_PER_SLOT: 4500
    precision: "integer cents; CONSERVATION - sum over the run's orders of reefer_alloc_cents == RouteRun.reefer_surcharge_cents exactly"
    variants:
      - name: by_cold_subtotal
        when: "the pinned variant"
        difference: "the pro-rata weight is the money value of each order's cold lines"
      - name: by_cold_weight
        when: "the rejected variant"
        difference: "the pro-rata weight is grams of cold product; a member ordering cheap heavy frozen goods pays far more under this reading than under the pinned one"

  - name: freight_allocation
    trigger: "POST /route-runs/{route_run_id}/supplier-invoice"
    algorithm: waterfall_allocation
    formula: |
      LEVEL 1 - RouteRun.freight_cents across its DropRuns whose status is
                RECEIVED, weighted by DropRun.subtotal_cents:
        exact_d   = freight_cents * drop.subtotal_cents / sum_of_subtotals
        base_d    = floor(exact_d)
        leftover  = freight_cents - sum(base_d)
        ranked    = drop runs sorted by (exact_d - base_d) DESC, then DropRun.created_at ASC
        the first `leftover` drop runs each take one extra cent
        DropRun.freight_alloc_cents = base_d + carry

      LEVEL 2 - each DropRun.freight_alloc_cents across its MemberOrders whose
                status is FILLED or SHORT_FILLED, weighted by MemberOrder.gross_cents,
                using the same floor-then-largest-remainder scheme with
                MemberOrder.created_at ASC as the tie-break.

      The rounding happens ONCE PER LEVEL. Level 2 divides the already-rounded
      integer DropRun.freight_alloc_cents, it does not re-divide the route total.
    input_set: "RECEIVED DropRuns at level 1; FILLED and SHORT_FILLED MemberOrders at level 2"
    constants: {}
    precision: "integer cents; CONSERVATION - sum over drop runs == RouteRun.freight_cents, and within each drop run sum over orders == DropRun.freight_alloc_cents"
    variants:
      - name: round_per_level
        when: "the pinned order"
        difference: "the route total is rounded into drop-level integers first, and those integers are then divided among orders"
      - name: single_pass_round
        when: "the rejected order"
        difference: "each order's share is computed directly from the route total as freight * order_gross / route_gross and rounded once; the two orders differ by a cent whenever a drop-level remainder is carried"

  # ---------------------------------------------------------- consolidation --
  - name: pallet_build
    trigger: "POST /route-runs/{route_run_id}/build-pallets"
    algorithm: constraint_propagation
    formula: |
      For each temp_class in the fixed order [FROZEN, CHILLED, DRY]:
        units = every allocated unit on this RouteRun belonging to an OrderLine
                whose Item.temp_class equals this class, expanded one row per unit,
                ordered by Item.sku ASC then OrderLine.created_at ASC
        open a Pallet with sequence_index 1, weight_grams 0, cube_cm3 0
        for each unit:
            if pallet.weight_grams + item.unit_weight_grams <= PALLET_MAX_WEIGHT_GRAMS
               and pallet.cube_cm3 + item.unit_cube_cm3 <= PALLET_MAX_CUBE_CM3:
                 add the unit to the current pallet
            else:
                 seal nothing, simply open the next Pallet of this class with
                 sequence_index incremented, and add the unit to it
        a class with zero units produces zero pallets
      requires_reefer = temp_class in {FROZEN, CHILLED}
      cold_pallet_count = count of pallets with requires_reefer true
      if cold_pallet_count > route.reefer_slots:        raise ERR_REEFER_CAPACITY_EXCEEDED
      if total pallet count > route.max_pallets:        raise ERR_PALLET_CAPACITY_EXCEEDED
    input_set: "allocated units only - a line's short_units and any DROPPED or CANCELLED line contribute nothing"
    constants:
      PALLET_MAX_WEIGHT_GRAMS: 900000
      PALLET_MAX_CUBE_CM3: 1600000
      REEFER_REQUIRED_TEMP_CLASSES: ["FROZEN", "CHILLED"]
    precision: "whole grams and whole cm3; both caps are INCLUSIVE, so a unit that lands exactly on a cap still fits"
    variants: []

  # ------------------------------------------------------- order money math --
  - name: member_order_totals
    trigger: "recomputed whenever an OrderLine's allocated_units or unit_price_cents changes, and at POST /member-orders/{member_order_id}/capture"
    algorithm: aggregation
    formula: |
      # evaluation order is pinned; the credit cap depends on a total that itself
      # depends on the discount, so the sequence below is not commutative
      STEP 1  gross_cents        = sum over the order's OrderLines with status
                                   FILLED, SHORT_FILLED or SUBSTITUTED of
                                   allocated_units * unit_price_cents
      STEP 2  split_fee_cents    = sum over those lines of
                                   allocated_units * split_fee_per_unit_cents
      STEP 3  tier_discount_cents = round_half_up(gross_cents * member.discount_pct)
                                   # ONE rounding at order level, not per line
      STEP 4  pre_credit_total_cents = gross_cents - tier_discount_cents
                                     + freight_alloc_cents + reefer_alloc_cents
      STEP 5  credit_cap          = floor(pre_credit_total_cents * CREDIT_MAX_OFFSET_PCT)
      STEP 6  want = apply_credit_cents when the capture request supplies it,
                     otherwise credit_cap
              credit_applied_cents = min(want, credit_cap, credit available by
                                         credit_consumption_fifo)
              # supplying apply_credit_cents above credit_cap is rejected by
              # validation priority 51 rather than silently clamped
      STEP 7  actual_total_cents  = pre_credit_total_cents - credit_applied_cents
    input_set: "FILLED, SHORT_FILLED and SUBSTITUTED lines; REQUESTED, CONFIRMED, DROPPED, ROLLED_FORWARD and CANCELLED lines contribute 0"
    constants:
      CREDIT_MAX_OFFSET_PCT: 0.50
      TIER_BASIC_DISCOUNT_PCT: 0.00
      TIER_PLUS_DISCOUNT_PCT: 0.05
      TIER_PRO_DISCOUNT_PCT: 0.09
    precision: "integer cents; the discount is rounded exactly once, on the order-level gross"
    variants:
      - name: discount_at_order_level
        when: "the pinned variant"
        difference: "one round_half_up on the summed gross"
      - name: discount_per_line
        when: "the rejected variant"
        difference: "round_half_up per line then sum; on a PLUS order of three lines at 3734, 3734 and 3735 cents the pinned rule discounts 560 while the per-line rule discounts 561"

  - name: payment_authorization_estimate
    trigger: "POST /member-orders/{member_order_id}/authorize"
    algorithm: forward_looking
    formula: |
      estimated_gross_cents   = sum over the order's OrderLines with status
                                CONFIRMED, FILLED, SHORT_FILLED or SUBSTITUTED of
                                confirmed_units * unit_price_cents
      estimated_discount      = round_half_up(estimated_gross_cents * member.discount_pct)
      estimated_total_cents   = estimated_gross_cents - estimated_discount
      authorized_amount_cents = round_half_up(estimated_total_cents
                                              * (1 + PAYMENT_AUTH_BUFFER_PCT))
    input_set: "confirmed_units, i.e. what the club intends to deliver; freight and the reefer surcharge are unknown at authorization time and are deliberately excluded, which is what the buffer covers"
    constants:
      PAYMENT_AUTH_BUFFER_PCT: 0.10
    precision: "integer cents"
    variants:
      - name: estimate_on_confirmed
        when: "the pinned variant, used at authorization"
        difference: "confirmed_units drive the number, so an order authorized before receiving is billed for what was ordered"
      - name: actual_on_allocated
        when: "the sibling computation at capture time"
        difference: "allocated_units drive the number and freight plus the reefer surcharge are added; identical inputs at order time therefore produce two different figures, and their gap is exactly what the variance band polices"

  - name: capture_variance_band
    trigger: "POST /member-orders/{member_order_id}/capture"
    algorithm: threshold
    formula: |
      variance_cents  = actual_total_cents - authorized_amount_cents
      tolerance_cents = max(PAYMENT_VARIANCE_TOLERANCE_FLOOR_CENTS,
                            round_half_up(authorized_amount_cents
                                          * PAYMENT_VARIANCE_TOLERANCE_PCT))
      if variance_cents <= tolerance_cents:  capture proceeds   # INCLUSIVE
      else:                                  raise ERR_PAYMENT_VARIANCE_EXCEEDED
      # a negative variance - the club is capturing less than it authorized -
      # is always inside the band
    input_set: "the single MemberOrder being captured"
    constants:
      PAYMENT_VARIANCE_TOLERANCE_PCT: 0.15
      PAYMENT_VARIANCE_TOLERANCE_FLOOR_CENTS: 500
    precision: "integer cents"
    variants: []

  - name: credit_consumption_fifo
    trigger: "POST /member-orders/{member_order_id}/capture, after the credit expiry sweep"
    algorithm: chronological
    formula: |
      eligible = CreditGrants of this member with status ACTIVE or
                 PARTIALLY_CONSUMED and clock < expires_at        # EXCLUSIVE
      ordered  = eligible sorted by expires_at ASC, then created_at ASC
      want     = credit_cap from member_order_totals STEP 5
      taken    = 0
      for grant in ordered:
          draw = min(grant.remaining_cents, want - taken)
          grant.remaining_cents -= draw
          grant.status = CONSUMED if grant.remaining_cents == 0
                         else PARTIALLY_CONSUMED
          taken += draw
          if taken == want: break
      credit_applied_cents = taken
    input_set: "ACTIVE and PARTIALLY_CONSUMED grants that have not reached expires_at; EXPIRED and CONSUMED grants are skipped"
    constants:
      CREDIT_MAX_OFFSET_PCT: 0.50
    precision: "integer cents; CONSERVATION - for any member, sum(amount_cents) == sum(remaining_cents) + total ever drawn + total forfeited on expiry"
    variants:
      - name: soonest_expiry_first
        when: "the pinned variant"
        difference: "grants are drained in expires_at ASC order so the credit closest to being lost is spent first"
      - name: oldest_grant_first
        when: "the rejected variant"
        difference: "grants are drained in created_at ASC order; when an older grant expires later than a newer one the two orders spend different grants and leave different remaining_cents behind"

  # --------------------------------------------------------- commission ----
  - name: coordinator_commission
    trigger: "POST /cycles/{cycle_id}/deliver, when a CommissionAccrual is created for a SETTLED DropRun"
    algorithm: tiered_pricing
    formula: |
      base_subtotal_cents = DropRun.received_subtotal_cents
                            # allocated_units * unit_price_cents, BEFORE tier discount
      if   base_subtotal_cents <= COMMISSION_BAND_1_MAX_CENTS: rate = COMMISSION_BAND_1_RATE
      elif base_subtotal_cents <= COMMISSION_BAND_2_MAX_CENTS: rate = COMMISSION_BAND_2_RATE
      else:                                                    rate = COMMISSION_BAND_3_RATE
      # FLAT BAND, not marginal - the whole base is multiplied by the single
      # rate of the band it lands in
      multiplier = 1.00 if DropRun.volunteer_obligation_met
                   else COMMISSION_VOLUNTEER_UNMET_MULTIPLIER
      accrued_cents  = round_half_up(base_subtotal_cents * rate * multiplier)
      clawback_cents = 0 at accrual time; raised later by the refund cascade to
                       round_half_up(refunded_amount * rate * multiplier)
      net_cents      = accrued_cents - clawback_cents
    input_set: "the DropRun's received_subtotal_cents, which counts only allocated units on FILLED, SHORT_FILLED and SUBSTITUTED lines"
    constants:
      COMMISSION_BAND_1_MAX_CENTS: 100000
      COMMISSION_BAND_1_RATE: 0.03
      COMMISSION_BAND_2_MAX_CENTS: 300000
      COMMISSION_BAND_2_RATE: 0.05
      COMMISSION_BAND_3_RATE: 0.07
      COMMISSION_VOLUNTEER_UNMET_MULTIPLIER: 0.50
      COMMISSION_VOLUNTEER_MIN_HOURS: 4.0
    precision: "integer cents; one round_half_up over the whole product, not per factor"
    variants:
      - name: received_pre_discount_base
        when: "the pinned variant"
        difference: "the base is what was actually delivered, valued at list prices; shortages shrink the commission automatically and clawback stays 0 unless a refund lands afterwards"
      - name: ordered_post_discount_base
        when: "the rejected variant"
        difference: "the base is the ordered subtotal net of tier discounts, with a clawback booked for the shortfall; on a drop that short-fills, the two readings differ both in the band selected and in the cents produced"

  - name: commission_payout_value
    trigger: "POST /commission-accruals/{commission_accrual_id}/payout"
    algorithm: threshold
    formula: |
      if payout_mode == STORE_CREDIT:
          payout_value_cents = round_half_up(net_cents
                               * (1 + COMMISSION_STORE_CREDIT_BONUS_PCT))
          a CreditGrant with source COMMISSION is minted for payout_value_cents,
          expiring at clock + VOLUNTEER_CREDIT_EXPIRY_DAYS (180) days
      if payout_mode == CASH:
          fee_cents = max(COMMISSION_CASH_FEE_MIN_CENTS,
                          round_half_up(net_cents * COMMISSION_CASH_FEE_PCT))
          payout_value_cents = net_cents - fee_cents
          no CreditGrant is minted
    input_set: "the single CommissionAccrual's net_cents"
    constants:
      COMMISSION_STORE_CREDIT_BONUS_PCT: 0.10
      COMMISSION_CASH_FEE_PCT: 0.02
      COMMISSION_CASH_FEE_MIN_CENTS: 100
      VOLUNTEER_CREDIT_EXPIRY_DAYS: 180
    precision: "integer cents"
    variants:
      - name: store_credit_with_bonus
        when: "payout_mode STORE_CREDIT, permitted only when the drop run's volunteer obligation is met"
        difference: "the coordinator receives 110 percent of net_cents, but as spendable credit rather than cash"
      - name: cash_net_of_fee
        when: "payout_mode CASH, always permitted"
        difference: "the coordinator receives net_cents less a 2 percent fee floored at 100 cents; for net_cents 3600 the two modes yield 3960 and 3528 from identical inputs"

  # ------------------------------------------------------------ membership --
  - name: tier_change_proration
    trigger: "POST /members/{member_id}/tier-changes"
    algorithm: decay_function
    formula: |
      old_annual = annual dues of the current tier
      new_annual = annual dues of new_tier
      if member.dues_paid_through is null or clock >= member.dues_paid_through:
          remaining_days = 0
      else:
          remaining_days = ceil((dues_paid_through - clock) / 86400 seconds)
          # CEILING, so the day on which the change is made counts as remaining
      if new_annual <= old_annual:
          prorated_amount_cents = 0            # downgrades are never refunded
      else:
          prorated_amount_cents = round_half_up((new_annual - old_annual)
                                                * remaining_days / MEMBERSHIP_TERM_DAYS)
    input_set: "the single Member row and the clock"
    constants:
      MEMBERSHIP_TERM_DAYS: 365
      TIER_BASIC_ANNUAL_DUES_CENTS: 3000
      TIER_PLUS_ANNUAL_DUES_CENTS: 9000
      TIER_PRO_ANNUAL_DUES_CENTS: 18000
    precision: "integer cents"
    variants:
      - name: ceiling_day_count
        when: "the pinned variant"
        difference: "remaining_days is the ceiling of the remaining fraction, so a member 200.4 days from expiry is charged for 201 days"
      - name: floor_day_count
        when: "the rejected variant"
        difference: "remaining_days is the floor; upgrading BASIC to PRO with 200.4 days left costs 8260 cents under the pinned rule and 8219 under this one"

  # -------------------------------------------------------- reconciliation --
  - name: drop_reconciliation_balance
    trigger: "POST /drop-reconciliations, and recomputed by the refund and volunteer cascades while the reconciliation is not POSTED"
    algorithm: aggregation
    formula: |
      member_charges_cents = sum over MemberOrders on this DropRun with
                             payment_status CAPTURED, PARTIALLY_REFUNDED or REFUNDED of
                             (captured_cents - refunded_cents)
      supplier_cost_cents  = the DropRun's share of RouteRun.supplier_invoice_cents,
                             allocated by the same two-level floor plus
                             largest-remainder scheme as freight_allocation LEVEL 1,
                             weighted by DropRun.subtotal_cents over RECEIVED drop runs
      freight_alloc_cents  = DropRun.freight_alloc_cents
      reefer_alloc_cents   = DropRun.reefer_alloc_cents
      commission_cents     = net_cents of this DropRun's CommissionAccrual, or 0 when none
      club_margin_cents    = member_charges_cents - supplier_cost_cents
                             - freight_alloc_cents - reefer_alloc_cents
                             - commission_cents
                             (plus any adjustment_cents absorbed by resolve-variance)
      variance_cents       = member_charges_cents
                             - (supplier_cost_cents + freight_alloc_cents
                                + reefer_alloc_cents + commission_cents
                                + club_margin_cents)
      status = BALANCED       if abs(variance_cents) <= RECON_VARIANCE_TOLERANCE_CENTS
               VARIANCE_HELD  otherwise
    input_set: "MemberOrders on the drop run whose payment_status is CAPTURED, PARTIALLY_REFUNDED or REFUNDED; UNPAID, AUTHORIZED, AUTH_FAILED and VOIDED orders contribute 0"
    constants:
      RECON_VARIANCE_TOLERANCE_CENTS: 200
    precision: "integer cents; CONSERVATION - at BALANCED, member_charges_cents equals supplier_cost_cents + freight_alloc_cents + reefer_alloc_cents + commission_cents + club_margin_cents exactly"
    variants: []

# =============================================================================
# CONSERVATION INVARIANTS — named quantities that a forward action and its
# compensating action must leave unchanged.
# =============================================================================

conservation_invariants:
  - id: units_conserved_on_allocation
    quantity: "for every CaseAggregate, sum over its lines of (allocated_units + short_units) == sum of confirmed_units, and sum of allocated_units == min(units_received, total_demand)"
    forward_action: "POST /receipt-lines"
    compensating_action: "a later POST /receipt-lines topping the aggregate up to full demand"
    note: "no unit may be invented or lost by the largest-remainder allocation"

  - id: aggregate_demand_conserved_on_line_reversal
    quantity: "CaseAggregate.requested_units for the (RouteRun, Item) pair, and DropRun.subtotal_cents"
    forward_action: "POST /order-lines"
    compensating_action: "POST /order-lines/{order_line_id}/cancel for the same line"
    note: "creating then cancelling a line before lock must leave both quantities exactly where they started"

  - id: member_credit_conserved_on_authorization_void
    quantity: "Member.credit_balance_cents plus the sum of CreditGrant.remaining_cents over the member's non-EXPIRED grants"
    forward_action: "POST /member-orders/{member_order_id}/authorize"
    compensating_action: "POST /member-orders/{member_order_id}/cancel, which voids the authorization"
    note: "an authorization reserves nothing permanently; voiding it must leave the member's credit position byte-identical"

  - id: reefer_surcharge_fully_allocated
    quantity: "RouteRun.reefer_surcharge_cents"
    forward_action: "POST /route-runs/{route_run_id}/build-pallets"
    compensating_action: "summing MemberOrder.reefer_alloc_cents across every order on the run"
    note: "the largest-remainder split must distribute every cent, never one more and never one fewer"

  - id: freight_fully_allocated_at_both_levels
    quantity: "RouteRun.freight_cents at level 1 and DropRun.freight_alloc_cents at level 2"
    forward_action: "POST /route-runs/{route_run_id}/supplier-invoice"
    compensating_action: "summing DropRun.freight_alloc_cents, then summing MemberOrder.freight_alloc_cents inside each drop run"
    note: "rounding once per level must not leak a cent at either level"

  - id: drop_ledger_balances_at_post
    quantity: "DropReconciliation.member_charges_cents"
    forward_action: "POST /drop-reconciliations"
    compensating_action: "POST /drop-reconciliations/{drop_reconciliation_id}/resolve-variance"
    note: "after resolve-variance the ledger identity holds exactly and variance_cents is 0"

# =============================================================================
# §1.4 VALIDATION RULES TABLE — evaluated strictly in ascending priority.
# Priorities 9 through 13 are WRITE GATES: once one fires, no lower-priority
# rung is evaluated at all. Priority 9 is the GLOBAL write gate.
# =============================================================================

validations:

  # --- 1-8 : envelope, identity, existence, shape ---------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role names one of the five roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: |
      Every id embedded in the path resolves to a stored row, checked left to right.
      The error_id is fixed per path segment, with no room for interpretation -
      {member_id} to ERR_MEMBER_NOT_FOUND, {drop_point_id} to ERR_DROP_POINT_NOT_FOUND,
      {item_id} to ERR_ITEM_NOT_FOUND, {price_version_id} to ERR_PRICE_VERSION_NOT_FOUND,
      {cycle_id} to ERR_CYCLE_NOT_FOUND, {route_run_id} to ERR_ROUTE_RUN_NOT_FOUND,
      {drop_run_id} to ERR_DROP_RUN_NOT_FOUND, {member_order_id} to ERR_MEMBER_ORDER_NOT_FOUND,
      {order_line_id} to ERR_ORDER_LINE_NOT_FOUND, {case_aggregate_id} to ERR_CASE_AGGREGATE_NOT_FOUND,
      {receipt_line_id} to ERR_RECEIPT_LINE_NOT_FOUND,
      {substitution_offer_id} to ERR_SUBSTITUTION_OFFER_NOT_FOUND,
      {pallet_id} to ERR_PALLET_NOT_FOUND, {payment_id} to ERR_PAYMENT_NOT_FOUND,
      {drop_reconciliation_id} to ERR_RECONCILIATION_NOT_FOUND,
      {commission_accrual_id} to ERR_COMMISSION_ACCRUAL_NOT_FOUND,
      {volunteer_shift_id} to ERR_VOLUNTEER_SHIFT_NOT_FOUND,
      {credit_grant_id} to ERR_CREDIT_GRANT_NOT_FOUND.
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: existence
    check: |
      Every foreign key supplied in the request body resolves to a stored row, checked
      in the order the fields appear in the endpoint's input list. The mapping is the
      same one rung 4 uses, extended to the body-only keys -
      route_id to ERR_ROUTE_NOT_FOUND, home_drop_point_id to ERR_DROP_POINT_NOT_FOUND,
      coordinator_member_id and member_id to ERR_MEMBER_NOT_FOUND,
      item_id and substitute_item_id to ERR_ITEM_NOT_FOUND,
      cycle_id and target_cycle_id to ERR_CYCLE_NOT_FOUND,
      drop_point_id to ERR_DROP_POINT_NOT_FOUND,
      route_run_id to ERR_ROUTE_RUN_NOT_FOUND,
      drop_run_id and target_drop_run_id to ERR_DROP_RUN_NOT_FOUND,
      member_order_id to ERR_MEMBER_ORDER_NOT_FOUND,
      case_aggregate_id to ERR_CASE_AGGREGATE_NOT_FOUND.
    error_id: ERR_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with FK fields in input"

  - priority: 6
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"

  - priority: 7
    category: business_constraint
    check: "every field the endpoint declares without a trailing question mark is present and of the declared type"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 8
    category: business_constraint
    check: "every enum-typed field carries a value from that field's declared member list - tier, temp_class, remainder_policy, substitution_pref, payout_mode, destination, simulated_outcome and every status filter on a list endpoint"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: all

  # --- 9-13 : ORDERED WRITE GATES -------------------------------------------
  - priority: 9
    category: state
    check: "GLOBAL WRITE GATE. The Cycle that the target resource resolves to - directly for a Cycle, or through RouteRun, DropRun, MemberOrder, OrderLine, CaseAggregate, ReceiptLine, SubstitutionOffer, Pallet, Payment, DropReconciliation, CommissionAccrual or VolunteerShift - does not have status CLOSED. This rung pre-empts every rung from 10 downwards, including all state, ownership, OCC and fiscal checks."
    error_id: ERR_CYCLE_CLOSED
    http_status: 409
    applies_to: "every mutating endpoint whose target resolves to a cycle"

  - priority: 10
    category: business_constraint
    check: "MEMBERSHIP GATE. The Member in scope - the acting member for member-owned writes, or the member_id in the body - does not have status LAPSED. Pre-empts every order, line and substitution rung below."
    error_id: ERR_MEMBERSHIP_LAPSED
    http_status: 403
    applies_to: "POST /member-orders, POST /order-lines, PATCH /order-lines/{order_line_id}, POST /order-lines/{order_line_id}/cancel, POST /member-orders/{member_order_id}/submit, POST /substitution-offers/{substitution_offer_id}/approve, POST /substitution-offers/{substitution_offer_id}/decline"

  - priority: 11
    category: auth
    check: "COORDINATOR GATE. When the acting role is DropCoordinator, that member's tier_rank is at least COORDINATOR_MIN_TIER_RANK (2). Pre-empts every coordinator-scoped rung below, including the ownership check at priority 27."
    error_id: ERR_COORDINATOR_INELIGIBLE
    http_status: 403
    applies_to: "POST /drop-runs, POST /drop-runs/{drop_run_id}/merge, POST /drop-runs/{drop_run_id}/roll-forward, POST /volunteer-shifts, POST /volunteer-shifts/{volunteer_shift_id}/verify, POST /volunteer-shifts/{volunteer_shift_id}/reject"

  - priority: 12
    category: business_fiscal
    check: "POSTED LEDGER GATE. The DropRun in scope has no DropReconciliation with status POSTED. Pre-empts the whole money family below - refunds, receipts, payouts, further drafts and volunteer verification."
    error_id: ERR_RECONCILIATION_POSTED
    http_status: 409
    applies_to: "POST /member-orders/{member_order_id}/refund, POST /receipt-lines, POST /drop-reconciliations, POST /drop-reconciliations/{drop_reconciliation_id}/resolve-variance, POST /volunteer-shifts/{volunteer_shift_id}/verify"

  - priority: 13
    category: state
    check: "CYCLE LOCK GATE. For member order and line writes the parent Cycle.status is OPEN. Substitution responses are the single carve-out - they are permitted while Cycle.status is RECEIVED and exception_state is OPEN. Pre-empts the cutoff rung at 14 and every ordering rung from 30 downwards."
    error_id: ERR_CYCLE_LOCKED
    http_status: 409
    applies_to: "POST /member-orders, POST /order-lines, PATCH /order-lines/{order_line_id}, POST /order-lines/{order_line_id}/cancel, POST /member-orders/{member_order_id}/submit, POST /member-orders/{member_order_id}/cancel"

  # --- 14-25 : temporal and state preconditions -----------------------------
  - priority: 14
    category: business_temporal
    check: "for member order and line writes on a Cycle still in status OPEN, the clock is strictly before Cycle.cutoff_at"
    error_id: ERR_CUTOFF_PASSED
    http_status: 409
    applies_to: "POST /member-orders, POST /order-lines, PATCH /order-lines/{order_line_id}, POST /order-lines/{order_line_id}/cancel, POST /member-orders/{member_order_id}/submit"

  - priority: 15
    category: state
    check: "the Cycle is in a from-state the requested transition declares in §1.2"
    error_id: ERR_INVALID_CYCLE_STATE
    http_status: 409
    applies_to: "POST /cycles/{cycle_id}/lock, /submit, /receive, /consolidate, /deliver, /reconcile, /close, /cancel"

  - priority: 16
    category: state
    check: "the MemberOrder is in a from-state the requested transition declares in §1.2, on both the fulfilment axis and the payment axis"
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "POST /member-orders/{member_order_id}/submit, /cancel, /authorize, /capture, /refund"

  - priority: 17
    category: state
    check: "the OrderLine is in a from-state the requested transition declares in §1.2"
    error_id: ERR_INVALID_LINE_STATE
    http_status: 409
    applies_to: "PATCH /order-lines/{order_line_id}, POST /order-lines/{order_line_id}/cancel"

  - priority: 18
    category: state
    check: "the DropRun is in a from-state the requested transition declares in §1.2 - OPEN for merge with the target also OPEN, DEFERRED for roll-forward, and OPEN, QUALIFIED, SUBMITTED, RECEIVED or SETTLED for logging a volunteer shift"
    error_id: ERR_INVALID_DROP_RUN_STATE
    http_status: 409
    applies_to: "POST /drop-runs/{drop_run_id}/merge, POST /drop-runs/{drop_run_id}/roll-forward, POST /volunteer-shifts"

  - priority: 19
    category: state
    check: "the RouteRun has status RECEIVED before receipt lines, the supplier invoice or pallet building are accepted"
    error_id: ERR_INVALID_ROUTE_RUN_STATE
    http_status: 409
    applies_to: "POST /receipt-lines, POST /route-runs/{route_run_id}/supplier-invoice, POST /route-runs/{route_run_id}/build-pallets"

  - priority: 20
    category: state
    check: "the SubstitutionOffer has status PENDING"
    error_id: ERR_INVALID_OFFER_STATE
    http_status: 409
    applies_to: "POST /substitution-offers/{substitution_offer_id}/approve, POST /substitution-offers/{substitution_offer_id}/decline"

  - priority: 21
    category: state
    check: "the DropReconciliation is in a from-state the requested transition declares - BALANCED for post, VARIANCE_HELD for resolve-variance"
    error_id: ERR_INVALID_RECONCILIATION_STATE
    http_status: 409
    applies_to: "POST /drop-reconciliations/{drop_reconciliation_id}/post, POST /drop-reconciliations/{drop_reconciliation_id}/resolve-variance"

  - priority: 22
    category: state
    check: "the CommissionAccrual has status ACCRUED or ADJUSTED, and the DropRun it belongs to has a DropReconciliation with status POSTED"
    error_id: ERR_INVALID_ACCRUAL_STATE
    http_status: 409
    applies_to: "POST /commission-accruals/{commission_accrual_id}/payout"

  - priority: 23
    category: state
    check: "the VolunteerShift has status LOGGED"
    error_id: ERR_INVALID_SHIFT_STATE
    http_status: 409
    applies_to: "POST /volunteer-shifts/{volunteer_shift_id}/verify, POST /volunteer-shifts/{volunteer_shift_id}/reject"

  - priority: 24
    category: state
    check: "the Pallet has status BUILDING"
    error_id: ERR_INVALID_PALLET_STATE
    http_status: 409
    applies_to: "POST /pallets/{pallet_id}/seal"

  - priority: 25
    category: business_referential
    check: "the OCC field the endpoint declares - expected_member_order_version, expected_route_run_version, expected_drop_run_version or expected_member_version - equals the stored version of the named parent"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /order-lines, PATCH /order-lines/{order_line_id}, POST /order-lines/{order_line_id}/cancel, POST /receipt-lines, POST /drop-reconciliations, POST /credit-grants, POST /drop-runs/{drop_run_id}/merge, POST /members/{member_id}/dues-payments, POST /members/{member_id}/tier-changes"

  # --- 26-27 : ownership, checked AFTER state and OCC -----------------------
  - priority: 26
    category: auth
    check: "when the acting role is Member, X-User-ID equals the MemberOrder.member_id of the order the target resolves to. Deliberately ordered after the state and OCC rungs, so a member touching another member's already-terminal line sees the state error rather than the ownership error."
    error_id: ERR_NOT_ORDER_OWNER
    http_status: 403
    applies_to: "POST /order-lines, PATCH /order-lines/{order_line_id}, POST /order-lines/{order_line_id}/cancel, POST /member-orders/{member_order_id}/submit, POST /member-orders/{member_order_id}/cancel, POST /substitution-offers/{substitution_offer_id}/approve, POST /substitution-offers/{substitution_offer_id}/decline"

  - priority: 27
    category: auth
    check: "when the acting role is DropCoordinator, X-User-ID equals the DropRun.coordinator_member_id of the drop run the target resolves to"
    error_id: ERR_NOT_DROP_COORDINATOR
    http_status: 403
    applies_to: "POST /drop-runs/{drop_run_id}/merge, POST /drop-runs/{drop_run_id}/roll-forward, POST /volunteer-shifts, POST /volunteer-shifts/{volunteer_shift_id}/verify, POST /volunteer-shifts/{volunteer_shift_id}/reject"

  # --- 28-31 : cold-chain safety, then catalog referential integrity --------
  - priority: 28
    category: business_safety
    check: "COLD CHAIN. The item's temp_class is DRY, or the Route serving the order's drop point has reefer_slots > 0. Ordered ahead of the discontinued-item check on purpose."
    error_id: ERR_ROUTE_NO_COLD_CHAIN
    http_status: 422
    applies_to: "POST /order-lines, PATCH /order-lines/{order_line_id}"

  - priority: 29
    category: business_safety
    check: "the number of pallets requiring a reefer does not exceed the Route's reefer_slots"
    error_id: ERR_REEFER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /route-runs/{route_run_id}/build-pallets"

  - priority: 30
    category: business_safety
    check: "the total pallet count on the run does not exceed the Route's max_pallets"
    error_id: ERR_PALLET_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /route-runs/{route_run_id}/build-pallets"

  - priority: 31
    category: business_referential
    check: "the Item has status ACTIVE"
    error_id: ERR_ITEM_DISCONTINUED
    http_status: 409
    applies_to: "POST /order-lines, PATCH /order-lines/{order_line_id}"

  - priority: 32
    category: business_referential
    check: "at least one PriceVersion exists for the item with effective_from at or before the cycle's cutoff_at"
    error_id: ERR_NO_EFFECTIVE_PRICE
    http_status: 409
    applies_to: "POST /order-lines, PATCH /order-lines/{order_line_id}"

  # --- 33-40 : constraint satisfaction --------------------------------------
  - priority: 33
    category: business_constraint
    check: "qty_units is an integer in [1, 500], and when the Item has split_allowed false, qty_units is an exact multiple of case_pack_units"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "POST /order-lines, PATCH /order-lines/{order_line_id}"

  - priority: 34
    category: business_constraint
    check: "no other OrderLine with status other than CANCELLED exists on this MemberOrder for the same item_id"
    error_id: ERR_DUPLICATE_LINE_FOR_ITEM
    http_status: 409
    applies_to: "POST /order-lines"

  - priority: 35
    category: business_constraint
    check: "no other MemberOrder with status other than CANCELLED exists for the same (member_id, drop_run_id) pair"
    error_id: ERR_DUPLICATE_ORDER_FOR_MEMBER
    http_status: 409
    applies_to: "POST /member-orders"

  - priority: 36
    category: business_temporal
    check: "POINT-COLLISION INTERVAL RULE. No other PriceVersion for this item_id carries the same effective_from instant; the item's price history is a partition of half-open intervals [effective_from, next.effective_from) and two versions sharing a left endpoint would make the partition ill-defined."
    error_id: ERR_PRICE_VERSION_OVERLAP
    http_status: 409
    applies_to: "POST /price-versions"

  - priority: 37
    category: business_temporal
    check: "BUFFERED-INTERVAL RULE. Creating the first DropRun for a (Cycle, Route) pair mints a RouteRun only when the route hosts no other RouteRun whose cycle window collides. Two cycle windows collide when new.opens_at < other.cutoff_at + 48 hours AND other.opens_at < new.cutoff_at + 48 hours. Unlike the point-collision rule at 36, adjacency is not enough - a 48-hour turnaround must separate the closed windows."
    error_id: ERR_ROUTE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /drop-runs"

  - priority: 38
    category: business_temporal
    check: "the Cycle.exception_state is OPEN and the clock is strictly before the offer's respond_by"
    error_id: ERR_EXCEPTION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /substitution-offers/{substitution_offer_id}/approve, POST /substitution-offers/{substitution_offer_id}/decline"

  - priority: 39
    category: business_temporal
    check: "the clock is at or after the Cycle's exception_deadline_at"
    error_id: ERR_EXCEPTION_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /cycles/{cycle_id}/consolidate"

  - priority: 40
    category: business_constraint
    check: "target_drop_run_id names a DropRun other than this one, on the same route_run_id, whose status is OPEN"
    error_id: ERR_MERGE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /drop-runs/{drop_run_id}/merge"

  - priority: 41
    category: business_constraint
    check: "rollforward_count is below ROLLFORWARD_MAX_PER_DROP_RUN (1) and target_cycle_id names a Cycle with status OPEN whose cutoff_at is strictly after the source cycle's cutoff_at"
    error_id: ERR_ROLLFORWARD_LIMIT
    http_status: 409
    applies_to: "POST /drop-runs/{drop_run_id}/roll-forward"

  - priority: 42
    category: business_constraint
    check: "AGGREGATE CAPACITY RULE. cases_received added to the aggregate's existing units_received does not push units_received above CaseAggregate.covered_units. Unlike the two interval rules at 36 and 37, this one polices a running total against a capacity rather than a geometry."
    error_id: ERR_RECEIPT_EXCEEDS_ORDERED
    http_status: 422
    applies_to: "POST /receipt-lines"

  - priority: 43
    category: business_constraint
    check: "substitute_case_price_cents is present and >= 1 whenever substitute_item_id is present, and absent whenever it is not"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /receipt-lines"

  - priority: 44
    category: business_constraint
    check: "every Pallet on every RouteRun of the cycle has status SEALED"
    error_id: ERR_PALLETS_NOT_SEALED
    http_status: 409
    applies_to: "POST /cycles/{cycle_id}/consolidate"

  - priority: 45
    category: business_constraint
    check: "the RouteRun's supplier_invoice_cents is greater than 0, i.e. the supplier invoice has been recorded"
    error_id: ERR_SUPPLIER_INVOICE_MISSING
    http_status: 409
    applies_to: "POST /route-runs/{route_run_id}/build-pallets"

  - priority: 46
    category: business_constraint
    check: "SEGREGATION OF DUTIES. The acting X-User-ID differs from the reconciliation's prepared_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /drop-reconciliations/{drop_reconciliation_id}/post"

  - priority: 47
    category: business_constraint
    check: "the parent Cycle has status DELIVERED"
    error_id: ERR_INVALID_CYCLE_STATE
    http_status: 409
    applies_to: "POST /drop-reconciliations/{drop_reconciliation_id}/post"

  - priority: 48
    category: business_constraint
    check: "adjustment_cents equals the reconciliation's current variance_cents exactly"
    error_id: ERR_VARIANCE_UNRESOLVED
    http_status: 422
    applies_to: "POST /drop-reconciliations/{drop_reconciliation_id}/resolve-variance"

  # --- 49-54 : fiscal, evaluated last ---------------------------------------
  - priority: 49
    category: business_fiscal
    check: "at least one RouteRun on the cycle has status QUALIFIED"
    error_id: ERR_ROUTE_MINIMUM_NOT_MET
    http_status: 409
    applies_to: "POST /cycles/{cycle_id}/submit"

  - priority: 50
    category: business_fiscal
    check: "every DropRun on the cycle with status SETTLED has a DropReconciliation with status POSTED"
    error_id: ERR_DROP_RECONCILIATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /cycles/{cycle_id}/reconcile"

  - priority: 51
    category: business_fiscal
    check: "apply_credit_cents, when supplied, is at most floor(pre_credit_total_cents multiplied by CREDIT_MAX_OFFSET_PCT)"
    error_id: ERR_CREDIT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /member-orders/{member_order_id}/capture"

  - priority: 52
    category: business_fiscal
    check: "the capture variance is inside the tolerance band computed by capture_variance_band"
    error_id: ERR_PAYMENT_VARIANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /member-orders/{member_order_id}/capture"

  - priority: 53
    category: business_fiscal
    check: "amount_cents is at least 1 and at most captured_cents less refunded_cents"
    error_id: ERR_REFUND_EXCEEDS_CAPTURE
    http_status: 422
    applies_to: "POST /member-orders/{member_order_id}/refund"

  - priority: 54
    category: business_fiscal
    check: "when payout_mode is STORE_CREDIT, the drop run's volunteer_obligation_met is true; payout_mode CASH carries no such requirement, so a coordinator who missed the volunteer obligation can still be paid, at the halved accrual"
    error_id: ERR_VOLUNTEER_OBLIGATION_UNMET
    http_status: 409
    applies_to: "POST /commission-accruals/{commission_accrual_id}/payout"

  - priority: 55
    category: business_fiscal
    check: "for POST /members/{member_id}/dues-payments, amount_cents equals the annual dues of the member's tier multiplied by term_years; for POST /members/{member_id}/tier-changes, prorated_amount_cents equals the tier_change_proration result"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /members/{member_id}/dues-payments, POST /members/{member_id}/tier-changes"

# =============================================================================
# §1.5 API ENDPOINT TABLE — 82 endpoints, flat topology.
# Read role set R5 = [ClubAdmin, DropCoordinator, Member, WarehouseOperator,
# FinanceOfficer] is spelled out on every read endpoint.
# =============================================================================

endpoints:

  # ------------------------------------------------------------- catalog ---
  - method: POST
    path: "/routes"
    description: "Create a delivery route with its reefer capacity and route minimum."
    roles: [ClubAdmin]
    code: 201
    input: ["code", "name", "reefer_slots?", "route_minimum_cents?", "max_pallets?"]
    output: Route
    side_effects: ["computes cold_capable from reefer_slots"]

  - method: GET
    path: "/routes"
    description: "List routes."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: Route[]
    side_effects: []

  - method: POST
    path: "/drop-points"
    description: "Create a drop point on a route and optionally name its coordinator."
    roles: [ClubAdmin]
    code: 201
    input: ["route_id", "name", "coordinator_member_id?", "drop_minimum_cents?"]
    output: DropPoint
    side_effects: ["sets Member.is_coordinator true on the named coordinator"]

  - method: GET
    path: "/drop-points"
    description: "List drop points, filterable by route or coordinator."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["route_id?", "coordinator_member_id?", "limit?", "offset?"]
    output: DropPoint[]
    side_effects: []

  - method: GET
    path: "/drop-points/{drop_point_id}"
    description: "Read one drop point."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: DropPoint
    side_effects: []

  - method: POST
    path: "/items"
    description: "Create a catalog item with its temperature class, case pack and remainder policy."
    roles: [ClubAdmin]
    code: 201
    input: ["sku", "name", "temp_class", "case_pack_units", "unit_weight_grams", "unit_cube_cm3", "split_allowed?", "remainder_policy?"]
    output: Item
    side_effects: []

  - method: GET
    path: "/items"
    description: "List catalog items."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["sku?", "temp_class?", "status?", "limit?", "offset?"]
    output: Item[]
    side_effects: []

  - method: GET
    path: "/items/{item_id}"
    description: "Read one catalog item."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: POST
    path: "/items/{item_id}/discontinue"
    description: "Retire an item from the catalog; already-confirmed lines are unaffected."
    roles: [ClubAdmin]
    code: 200
    input: []
    output: Item
    side_effects: ["Item.status ACTIVE -> DISCONTINUED", "increments Item.version by 1"]

  - method: POST
    path: "/price-versions"
    description: "Publish an effective-dated case price for an item. Immutable once written."
    roles: [ClubAdmin]
    code: 201
    input: [item_id, effective_from, case_price_cents]
    output: PriceVersion
    side_effects: ["computes split_unit_base_cents as ceil(case_price_cents / Item.case_pack_units)"]

  - method: GET
    path: "/price-versions"
    description: "List price versions, filterable by item."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["item_id?", "limit?", "offset?"]
    output: PriceVersion[]
    side_effects: []

  - method: GET
    path: "/price-versions/{price_version_id}"
    description: "Read one price version."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: PriceVersion
    side_effects: []

  # ---------------------------------------------------------- membership ---
  - method: POST
    path: "/members"
    description: "Register a member in status PENDING against a home drop point."
    roles: [ClubAdmin]
    code: 201
    input: ["email", "full_name", "home_drop_point_id", "tier?"]
    output: Member
    side_effects: ["derives tier_rank and discount_pct from tier"]

  - method: GET
    path: "/members"
    description: "List members, filterable by home drop point, status or tier."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["home_drop_point_id?", "status?", "tier?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: GET
    path: "/members/{member_id}"
    description: "Read one member, including the derived credit_balance_cents."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{member_id}/dues-payments"
    description: "Pay membership dues; moves PENDING or LAPSED to ACTIVE and extends dues_paid_through from the clock."
    roles: [ClubAdmin, Member]
    code: 200
    input: [amount_cents, term_years, expected_member_version]
    output: Member
    side_effects:
      - "runs the credit expiry sweep for this member"
      - "sets dues_paid_through and dues_grace_until"
      - "increments lifetime_dues_paid_cents"
      - "Member.status PENDING or LAPSED -> ACTIVE"
      - "increments Member.version by 1"

  - method: POST
    path: "/members/{member_id}/tier-changes"
    description: "Change membership tier; prorated_amount_cents must equal the tier_change_proration result."
    roles: [ClubAdmin, Member]
    code: 200
    input: [new_tier, prorated_amount_cents, expected_member_version]
    output: Member
    side_effects:
      - "rewrites tier, tier_rank and discount_pct"
      - "increments lifetime_dues_paid_cents by prorated_amount_cents"
      - "a downgrade below tier_rank 2 activates the coordinator gate at validation priority 11 on every drop run this member coordinates"
      - "increments Member.version by 1"

  - method: POST
    path: "/members/{member_id}/lapse"
    description: "Mark a member LAPSED once the dues grace period has passed."
    roles: [ClubAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["Member.status ACTIVE -> LAPSED", "increments Member.version by 1"]

  # --------------------------------------------------------------- cycle ---
  - method: POST
    path: "/cycles"
    description: "Open a new pre-order cycle."
    roles: [ClubAdmin]
    code: 201
    input: [code, opens_at, cutoff_at]
    output: Cycle
    side_effects: ["exception_state initialises to NOT_STARTED"]

  - method: GET
    path: "/cycles"
    description: "List cycles."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Cycle[]
    side_effects: []

  - method: GET
    path: "/cycles/{cycle_id}"
    description: "Read one cycle, including the clock-derived exception_state."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: Cycle
    side_effects: []

  - method: POST
    path: "/cycles/{cycle_id}/lock"
    description: "Close the cycle to member writes and run the six-hop aggregation cascade."
    roles: [ClubAdmin]
    code: 200
    input: []
    output: Cycle
    side_effects:
      - "Cycle.status OPEN -> LOCKED and locked_at set"
      - "hop 1 - DRAFT orders CANCELLED, SUBMITTED orders LOCKED"
      - "hop 2 - REQUESTED lines CONFIRMED with prices bound at cutoff_at"
      - "hop 3 - CaseAggregates created and the remainder policy applied"
      - "hop 4 - DropRuns QUALIFIED or DEFERRED against their drop minimum"
      - "hop 5 - RouteRuns QUALIFIED or DEFERRED against their route minimum"
      - "hop 6 - a DEFERRED RouteRun reverts its QUALIFIED DropRuns and cancels their orders and lines"
      - "increments Cycle.version by 1"

  - method: POST
    path: "/cycles/{cycle_id}/submit"
    description: "Send the qualified route runs to the supplier."
    roles: [ClubAdmin]
    code: 200
    input: []
    output: Cycle
    side_effects:
      - "Cycle.status LOCKED -> SUBMITTED"
      - "QUALIFIED RouteRuns and DropRuns move to SUBMITTED"
      - "increments Cycle.version by 1"

  - method: POST
    path: "/cycles/{cycle_id}/receive"
    description: "Record supplier arrival; stamps received_at and opens the 48-hour exception window."
    roles: [ClubAdmin, WarehouseOperator]
    code: 200
    input: []
    output: Cycle
    side_effects:
      - "Cycle.status SUBMITTED -> RECEIVED, received_at and exception_deadline_at set"
      - "exception_state becomes OPEN"
      - "SUBMITTED RouteRuns and DropRuns move to RECEIVED"
      - "increments Cycle.version by 1"

  - method: POST
    path: "/cycles/{cycle_id}/consolidate"
    description: "Close the exception window and freeze the pallet plan."
    roles: [ClubAdmin, WarehouseOperator]
    code: 200
    input: []
    output: Cycle
    side_effects:
      - "every still-PENDING SubstitutionOffer moves to AUTO_DECLINED and its units are removed from the line"
      - "Cycle.status RECEIVED -> CONSOLIDATED and RouteRuns follow"
      - "increments Cycle.version by 1"

  - method: POST
    path: "/cycles/{cycle_id}/deliver"
    description: "Deliver the cycle; settles drop runs and accrues coordinator commission."
    roles: [ClubAdmin, WarehouseOperator]
    code: 200
    input: []
    output: Cycle
    side_effects:
      - "Pallets SEALED -> DELIVERED, RouteRuns CONSOLIDATED -> DELIVERED, DropRuns RECEIVED -> SETTLED"
      - "MemberOrders FILLED or SHORT_FILLED -> DELIVERED"
      - "one CommissionAccrual with status ACCRUED per SETTLED DropRun with a coordinator"
      - "increments Cycle.version by 1"

  - method: POST
    path: "/cycles/{cycle_id}/reconcile"
    description: "Close the cycle's books once every settled drop has a posted reconciliation."
    roles: [ClubAdmin, FinanceOfficer]
    code: 200
    input: []
    output: Cycle
    side_effects: ["Cycle.status DELIVERED -> RECONCILED", "increments Cycle.version by 1"]

  - method: POST
    path: "/cycles/{cycle_id}/close"
    description: "Close the cycle and activate the global write gate on everything scoped to it."
    roles: [ClubAdmin]
    code: 200
    input: []
    output: Cycle
    side_effects:
      - "MemberOrders DELIVERED -> CLOSED"
      - "the global write gate at validation priority 9 becomes active"
      - "increments Cycle.version by 1"

  - method: POST
    path: "/cycles/{cycle_id}/cancel"
    description: "Abandon an unshipped cycle and unwind every order on it."
    roles: [ClubAdmin]
    code: 200
    input: []
    output: Cycle
    side_effects:
      - "RouteRuns move to DEFERRED, DropRuns and MemberOrders to CANCELLED, lines to CANCELLED"
      - "SUCCEEDED AUTHORIZATION Payments move to VOIDED"
      - "increments Cycle.version by 1"

  # ----------------------------------------------------------- route runs ---
  - method: GET
    path: "/route-runs"
    description: "List route runs, filterable by cycle or route."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["cycle_id?", "route_id?", "status?", "limit?", "offset?"]
    output: RouteRun[]
    side_effects: []

  - method: GET
    path: "/route-runs/{route_run_id}"
    description: "Read one route run, including its aggregate, freight and reefer figures."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: RouteRun
    side_effects: []

  - method: POST
    path: "/route-runs/{route_run_id}/supplier-invoice"
    description: "Record the supplier invoice and freight for a received run, then allocate freight down two levels."
    roles: [ClubAdmin, WarehouseOperator]
    code: 200
    input: [supplier_invoice_cents, freight_cents]
    output: RouteRun
    side_effects:
      - "writes supplier_invoice_cents, freight_cents and invoice_recorded_by_user_id"
      - "runs freight_allocation level 1 across the run's RECEIVED DropRuns and level 2 across each drop run's FILLED and SHORT_FILLED MemberOrders"
      - "increments RouteRun.version by 1"

  - method: POST
    path: "/route-runs/{route_run_id}/build-pallets"
    description: "Build the pallet plan per temperature class and allocate the reefer surcharge."
    roles: [ClubAdmin, WarehouseOperator]
    code: 200
    input: []
    output: RouteRun
    side_effects:
      - "creates Pallets with status BUILDING per the pallet_build calculation"
      - "writes cold_pallet_count, dry_pallet_count, reefer_slots_used and reefer_surcharge_cents"
      - "runs reefer_surcharge_allocation across the run's orders, writing MemberOrder.reefer_alloc_cents and DropRun.reefer_alloc_cents"
      - "increments RouteRun.version by 1"

  # ------------------------------------------------------------ drop runs ---
  - method: POST
    path: "/drop-runs"
    description: "Open a drop point's participation in a cycle, minting the cycle's RouteRun for that route on first use."
    roles: [ClubAdmin, DropCoordinator]
    code: 201
    input: [cycle_id, drop_point_id]
    output: DropRun
    side_effects:
      - "creates the RouteRun for (cycle_id, DropPoint.route_id) with status PLANNED when none exists, subject to the 48-hour route turnaround rule"
      - "snapshots coordinator_member_id from the drop point"

  - method: GET
    path: "/drop-runs"
    description: "List drop runs with every foreign key available as a filter."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["cycle_id?", "drop_point_id?", "route_run_id?", "coordinator_member_id?", "merged_into_drop_run_id?", "status?", "limit?", "offset?"]
    output: DropRun[]
    side_effects: []

  - method: GET
    path: "/drop-runs/{drop_run_id}"
    description: "Read one drop run, including its subtotals and volunteer figures."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: DropRun
    side_effects: []

  - method: POST
    path: "/drop-runs/{drop_run_id}/merge"
    description: "Fold a struggling drop into a neighbour on the same route run."
    roles: [ClubAdmin, DropCoordinator]
    code: 200
    input: [target_drop_run_id, expected_drop_run_version]
    output: DropRun
    side_effects:
      - "sets merged_into_drop_run_id and zeroes this run's subtotal_cents"
      - "repoints every MemberOrder to the target drop run"
      - "recomputes the target's subtotal_cents and the RouteRun's aggregated_subtotal_cents"
      - "increments DropRun.version by 1 on this run and on the target"

  - method: POST
    path: "/drop-runs/{drop_run_id}/roll-forward"
    description: "Carry a deferred drop's opted-in lines into a later open cycle at that cycle's prices."
    roles: [ClubAdmin, DropCoordinator]
    code: 200
    input: [target_cycle_id]
    output: DropRun
    side_effects:
      - "DropRun.status DEFERRED -> ROLLED_FORWARD and rollforward_count incremented"
      - "creates a DropRun on the target cycle, then a DRAFT MemberOrder per affected member, then a REQUESTED OrderLine per opted-in source line with rolled_from_order_line_id set"
      - "source lines move to ROLLED_FORWARD"
      - "increments DropRun.version by 1"

  # --------------------------------------------------------- member orders --
  - method: POST
    path: "/member-orders"
    description: "Open a member's draft order on a drop run."
    roles: [ClubAdmin, Member]
    code: 201
    input: [member_id, drop_run_id]
    output: MemberOrder
    side_effects: ["status DRAFT and payment_status UNPAID"]

  - method: GET
    path: "/member-orders"
    description: "List member orders on both axes."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["member_id?", "drop_run_id?", "status?", "payment_status?", "limit?", "offset?"]
    output: MemberOrder[]
    side_effects: []

  - method: GET
    path: "/member-orders/{member_order_id}"
    description: "Read one member order with its full money breakdown."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: MemberOrder
    side_effects: []

  - method: POST
    path: "/member-orders/{member_order_id}/submit"
    description: "Commit a draft order into the cycle."
    roles: [ClubAdmin, Member]
    code: 200
    input: []
    output: MemberOrder
    side_effects:
      - "status DRAFT -> SUBMITTED"
      - "recomputes the DropRun's subtotal_cents"
      - "increments MemberOrder.version by 1"

  - method: POST
    path: "/member-orders/{member_order_id}/cancel"
    description: "Withdraw an order while the cycle is still open."
    roles: [ClubAdmin, Member]
    code: 200
    input: []
    output: MemberOrder
    side_effects:
      - "status -> CANCELLED and every line -> CANCELLED"
      - "any SUCCEEDED AUTHORIZATION Payment -> VOIDED and payment_status -> VOIDED"
      - "recomputes the DropRun's subtotal_cents"
      - "increments MemberOrder.version by 1"

  - method: POST
    path: "/member-orders/{member_order_id}/authorize"
    description: "Authorize the estimated charge, which is the cutoff estimate plus a 10 percent buffer."
    roles: [ClubAdmin, FinanceOfficer]
    code: 200
    input: ["simulated_outcome?"]
    output: MemberOrder
    side_effects:
      - "creates a Payment with kind AUTHORIZATION and status SUCCEEDED or FAILED per simulated_outcome, which defaults to SUCCEEDED"
      - "payment_status UNPAID or AUTH_FAILED -> AUTHORIZED on success, UNPAID -> AUTH_FAILED on failure"
      - "writes estimated_total_cents and authorized_amount_cents"
      - "increments MemberOrder.version by 1"

  - method: POST
    path: "/member-orders/{member_order_id}/capture"
    description: "Capture the actual charge after receiving, applying store credit up to the 50 percent cap."
    roles: [ClubAdmin, FinanceOfficer]
    code: 200
    input: ["apply_credit_cents?"]
    output: MemberOrder
    side_effects:
      - "runs the credit expiry sweep, then credit_consumption_fifo and member_order_totals"
      - "creates up to two Payments with kind CAPTURE - one STORE_CREDIT and one CARD"
      - "payment_status AUTHORIZED -> CAPTURED and captured_cents written"
      - "consumed CreditGrants move to PARTIALLY_CONSUMED or CONSUMED"
      - "increments MemberOrder.version by 1"

  - method: POST
    path: "/member-orders/{member_order_id}/refund"
    description: "Refund part or all of a captured order to card or to store credit."
    roles: [ClubAdmin, FinanceOfficer]
    code: 200
    input: [amount_cents, destination]
    output: MemberOrder
    side_effects:
      - "creates a Payment with kind REFUND and status SUCCEEDED"
      - "payment_status CAPTURED -> PARTIALLY_REFUNDED or REFUNDED and refunded_cents raised"
      - "when destination is STORE_CREDIT, mints a CreditGrant with source REFUND expiring 180 days after the clock"
      - "recomputes the drop run's CommissionAccrual clawback_cents and net_cents, moving it ACCRUED -> ADJUSTED"
      - "recomputes any non-POSTED DropReconciliation, which may move BALANCED -> VARIANCE_HELD"
      - "increments MemberOrder.version by 1"

  # ----------------------------------------------------------- order lines --
  - method: POST
    path: "/order-lines"
    description: "Add a line to a draft or submitted order while the cycle is open."
    roles: [ClubAdmin, Member]
    code: 201
    input: [member_order_id, item_id, qty_units, expected_member_order_version, "rollover_opt_in?", "substitution_pref?"]
    output: OrderLine
    side_effects:
      - "status REQUESTED; prices are not bound until the cycle locks"
      - "recomputes the DropRun's subtotal_cents at the prices currently in force"
      - "increments MemberOrder.version by 1"

  - method: GET
    path: "/order-lines"
    description: "List order lines, filterable by order, item or rollover ancestor."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["member_order_id?", "item_id?", "rolled_from_order_line_id?", "status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: GET
    path: "/order-lines/{order_line_id}"
    description: "Read one order line with its bound price and allocation figures."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: PATCH
    path: "/order-lines/{order_line_id}"
    description: "Change a requested line's quantity, rollover election or substitution preference."
    roles: [ClubAdmin, Member]
    code: 200
    input: [expected_member_order_version, "qty_units?", "rollover_opt_in?", "substitution_pref?"]
    output: OrderLine
    side_effects:
      - "recomputes the DropRun's subtotal_cents"
      - "increments MemberOrder.version and OrderLine.version by 1"

  - method: POST
    path: "/order-lines/{order_line_id}/cancel"
    description: "Withdraw a requested line before the cycle locks."
    roles: [ClubAdmin, Member]
    code: 200
    input: [expected_member_order_version]
    output: OrderLine
    side_effects:
      - "status REQUESTED -> CANCELLED"
      - "recomputes the DropRun's subtotal_cents back to its pre-line value"
      - "increments MemberOrder.version and OrderLine.version by 1"

  # ------------------------------------------------- aggregation & receiving --
  - method: GET
    path: "/case-aggregates"
    description: "List the whole-case aggregates the cycle lock produced."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["route_run_id?", "item_id?", "overage_order_line_id?", "limit?", "offset?"]
    output: CaseAggregate[]
    side_effects: []

  - method: GET
    path: "/case-aggregates/{case_aggregate_id}"
    description: "Read one case aggregate, including the remainder policy actually applied."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: CaseAggregate
    side_effects: []

  - method: POST
    path: "/receipt-lines"
    description: "Record what the supplier actually delivered against one aggregate, optionally as a substitute item."
    roles: [ClubAdmin, WarehouseOperator]
    code: 201
    input: [route_run_id, case_aggregate_id, cases_received, expected_route_run_version, "substitute_item_id?", "substitute_case_price_cents?"]
    output: ReceiptLine
    side_effects:
      - "raises CaseAggregate.units_received"
      - "runs shortage_allocation over the aggregate's lines, writing allocated_units, short_units and allocation_remainder_rank"
      - "affected MemberOrders move LOCKED -> FILLED or LOCKED -> SHORT_FILLED and their money fields are recomputed"
      - "affected DropRuns and the RouteRun recompute received_subtotal_cents"
      - "when substitute_item_id is present, creates one SubstitutionOffer per affected line and resolves it immediately unless the line requires approval for an out-of-tolerance price"
      - "increments RouteRun.version by 1"

  - method: GET
    path: "/receipt-lines"
    description: "List receipt lines."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["route_run_id?", "case_aggregate_id?", "substitute_item_id?", "limit?", "offset?"]
    output: ReceiptLine[]
    side_effects: []

  - method: GET
    path: "/receipt-lines/{receipt_line_id}"
    description: "Read one receipt line."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: ReceiptLine
    side_effects: []

  - method: GET
    path: "/substitution-offers"
    description: "List substitution offers."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["order_line_id?", "receipt_line_id?", "substitute_item_id?", "status?", "limit?", "offset?"]
    output: SubstitutionOffer[]
    side_effects: []

  - method: GET
    path: "/substitution-offers/{substitution_offer_id}"
    description: "Read one substitution offer with its tolerance verdict and response deadline."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: SubstitutionOffer
    side_effects: []

  - method: POST
    path: "/substitution-offers/{substitution_offer_id}/approve"
    description: "Member accepts an out-of-tolerance substitute inside the exception window."
    roles: [Member]
    code: 200
    input: []
    output: SubstitutionOffer
    side_effects:
      - "status PENDING -> APPROVED and the OrderLine moves CONFIRMED -> SUBSTITUTED at the offered price"
      - "recomputes the owning MemberOrder's gross_cents, tier_discount_cents and pre_credit_total_cents"
      - "increments SubstitutionOffer.version by 1"

  - method: POST
    path: "/substitution-offers/{substitution_offer_id}/decline"
    description: "Member refuses a substitute inside the exception window."
    roles: [Member]
    code: 200
    input: []
    output: SubstitutionOffer
    side_effects:
      - "status PENDING -> DECLINED and the offered units leave the line's allocated_units"
      - "the OrderLine moves to SHORT_FILLED or DROPPED and the order's money fields are recomputed"
      - "increments SubstitutionOffer.version by 1"

  # ------------------------------------------------------------- pallets ---
  - method: GET
    path: "/pallets"
    description: "List pallets on a run, filterable by temperature class."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["route_run_id?", "temp_class?", "status?", "limit?", "offset?"]
    output: Pallet[]
    side_effects: []

  - method: GET
    path: "/pallets/{pallet_id}"
    description: "Read one pallet with its weight, cube and reefer flag."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: Pallet
    side_effects: []

  - method: POST
    path: "/pallets/{pallet_id}/seal"
    description: "Seal a built pallet; consolidation requires every pallet sealed."
    roles: [ClubAdmin, WarehouseOperator]
    code: 200
    input: []
    output: Pallet
    side_effects: ["status BUILDING -> SEALED", "increments Pallet.version by 1"]

  # ------------------------------------------------------------ payments ---
  - method: GET
    path: "/payments"
    description: "List payment records for an order."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["member_order_id?", "kind?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/payments/{payment_id}"
    description: "Read one payment record."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # ------------------------------------------------------ reconciliation ---
  - method: POST
    path: "/drop-reconciliations"
    description: "Draft a drop's ledger; supersedes and voids any earlier non-posted draft on the same drop run."
    roles: [ClubAdmin, FinanceOfficer]
    code: 201
    input: [drop_run_id, expected_drop_run_version]
    output: DropReconciliation
    side_effects:
      - "voids any existing DropReconciliation on the drop run whose status is BALANCED or VARIANCE_HELD"
      - "computes member_charges_cents, supplier_cost_cents, freight_alloc_cents, reefer_alloc_cents, commission_cents, club_margin_cents and variance_cents"
      - "auto-transitions DRAFT -> BALANCED or DRAFT -> VARIANCE_HELD inside this request"
      - "records prepared_by_user_id from the X-User-ID header"
      - "increments DropRun.version by 1"

  - method: GET
    path: "/drop-reconciliations"
    description: "List drop reconciliations."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["drop_run_id?", "status?", "limit?", "offset?"]
    output: DropReconciliation[]
    side_effects: []

  - method: GET
    path: "/drop-reconciliations/{drop_reconciliation_id}"
    description: "Read one drop reconciliation with its full ledger identity."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: DropReconciliation
    side_effects: []

  - method: POST
    path: "/drop-reconciliations/{drop_reconciliation_id}/post"
    description: "Post a balanced reconciliation; the poster must differ from the preparer."
    roles: [ClubAdmin, FinanceOfficer]
    code: 200
    input: []
    output: DropReconciliation
    side_effects:
      - "status BALANCED -> POSTED, posted_by_user_id and posted_at written"
      - "activates the POSTED ledger gate at validation priority 12 for this drop run"
      - "increments DropReconciliation.version by 1"

  - method: POST
    path: "/drop-reconciliations/{drop_reconciliation_id}/resolve-variance"
    description: "Absorb a held variance into club margin so the ledger identity closes."
    roles: [ClubAdmin, FinanceOfficer]
    code: 200
    input: [adjustment_cents]
    output: DropReconciliation
    side_effects:
      - "adds adjustment_cents to club_margin_cents and drives variance_cents to 0"
      - "status VARIANCE_HELD -> BALANCED"
      - "increments DropReconciliation.version by 1"

  # --------------------------------------------------------- commission ----
  - method: GET
    path: "/commission-accruals"
    description: "List coordinator commission accruals."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["drop_run_id?", "coordinator_member_id?", "status?", "limit?", "offset?"]
    output: CommissionAccrual[]
    side_effects: []

  - method: GET
    path: "/commission-accruals/{commission_accrual_id}"
    description: "Read one accrual with its band rate, volunteer multiplier and clawback."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: CommissionAccrual
    side_effects: []

  - method: POST
    path: "/commission-accruals/{commission_accrual_id}/payout"
    description: "Pay a coordinator in store credit at a 10 percent bonus or in cash net of a 2 percent fee."
    roles: [ClubAdmin, FinanceOfficer]
    code: 200
    input: [payout_mode]
    output: CommissionAccrual
    side_effects:
      - "runs the credit expiry sweep for the coordinator"
      - "writes payout_mode and payout_value_cents"
      - "status ACCRUED or ADJUSTED -> PAID"
      - "when payout_mode is STORE_CREDIT, mints a CreditGrant with source COMMISSION expiring 180 days after the clock"
      - "increments CommissionAccrual.version by 1"

  # --------------------------------------------------- volunteers & credit --
  - method: POST
    path: "/volunteer-shifts"
    description: "Log volunteer hours worked at a drop."
    roles: [ClubAdmin, DropCoordinator]
    code: 201
    input: [drop_run_id, member_id, hours]
    output: VolunteerShift
    side_effects: ["status LOGGED; no credit is minted and verified_volunteer_hours is unchanged until verification"]

  - method: GET
    path: "/volunteer-shifts"
    description: "List volunteer shifts."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["drop_run_id?", "member_id?", "credit_grant_id?", "status?", "limit?", "offset?"]
    output: VolunteerShift[]
    side_effects: []

  - method: GET
    path: "/volunteer-shifts/{volunteer_shift_id}"
    description: "Read one volunteer shift."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: []

  - method: POST
    path: "/volunteer-shifts/{volunteer_shift_id}/verify"
    description: "Verify logged hours, minting volunteer credit and re-testing the drop's volunteer obligation."
    roles: [ClubAdmin, DropCoordinator]
    code: 200
    input: []
    output: VolunteerShift
    side_effects:
      - "status LOGGED -> VERIFIED and verified_by_user_id written"
      - "mints a CreditGrant with source VOLUNTEER for round_half_up(hours multiplied by 1200) cents expiring 180 days after the clock, and links it through credit_grant_id"
      - "recomputes DropRun.verified_volunteer_hours and volunteer_obligation_met"
      - "when the obligation flips to met, any ACCRUED CommissionAccrual on the drop run recomputes and moves to ADJUSTED, which may push a BALANCED DropReconciliation to VARIANCE_HELD"
      - "increments VolunteerShift.version by 1"

  - method: POST
    path: "/volunteer-shifts/{volunteer_shift_id}/reject"
    description: "Reject logged hours; no credit is minted."
    roles: [ClubAdmin, DropCoordinator]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: ["status LOGGED -> REJECTED and verified_by_user_id written", "increments VolunteerShift.version by 1"]

  - method: POST
    path: "/credit-grants"
    description: "Mint an adjustment credit grant for a member."
    roles: [ClubAdmin]
    code: 201
    input: [member_id, amount_cents, expires_at, expected_member_version]
    output: CreditGrant
    side_effects:
      - "runs the credit expiry sweep for this member first, moving any grant past expires_at to EXPIRED"
      - "creates the grant with source ADJUSTMENT, status ACTIVE and remaining_cents equal to amount_cents"
      - "raises Member.credit_balance_cents"
      - "increments Member.version by 1"

  - method: GET
    path: "/credit-grants"
    description: "List a member's credit grants."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: ["member_id?", "source_member_order_id?", "status?", "limit?", "offset?"]
    output: CreditGrant[]
    side_effects: []

  - method: GET
    path: "/credit-grants/{credit_grant_id}"
    description: "Read one credit grant."
    roles: [ClubAdmin, DropCoordinator, Member, WarehouseOperator, FinanceOfficer]
    code: 200
    input: []
    output: CreditGrant
    side_effects: []

  # --------------------------------------------------------- test driving --
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the clock reads exactly 2026-05-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [ClubAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["re-derives every clock-dependent value on read - Cycle.exception_state, credit spendability and dues grace"]

# =============================================================================
# §1.6 ERROR CODE CATALOG
# =============================================================================

errors:

  # --- authentication and authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID is missing, empty, or names a role outside the five declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_ORDER_OWNER
    http: 403
    condition: "a Member acts on a MemberOrder, OrderLine or SubstitutionOffer belonging to a different member"
  - id: ERR_NOT_DROP_COORDINATOR
    http: 403
    condition: "a DropCoordinator acts on a DropRun whose coordinator_member_id is not their X-User-ID"

  # --- existence -------------------------------------------------------------
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "a member id in the path or body matches no Member"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "route_id matches no Route"
  - id: ERR_DROP_POINT_NOT_FOUND
    http: 404
    condition: "drop_point_id or home_drop_point_id matches no DropPoint"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "item_id or substitute_item_id matches no Item"
  - id: ERR_PRICE_VERSION_NOT_FOUND
    http: 404
    condition: "price_version_id matches no PriceVersion"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "cycle_id or target_cycle_id matches no Cycle"
  - id: ERR_ROUTE_RUN_NOT_FOUND
    http: 404
    condition: "route_run_id matches no RouteRun"
  - id: ERR_DROP_RUN_NOT_FOUND
    http: 404
    condition: "drop_run_id or target_drop_run_id matches no DropRun"
  - id: ERR_MEMBER_ORDER_NOT_FOUND
    http: 404
    condition: "member_order_id matches no MemberOrder"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "order_line_id matches no OrderLine"
  - id: ERR_CASE_AGGREGATE_NOT_FOUND
    http: 404
    condition: "case_aggregate_id matches no CaseAggregate"
  - id: ERR_RECEIPT_LINE_NOT_FOUND
    http: 404
    condition: "receipt_line_id matches no ReceiptLine"
  - id: ERR_SUBSTITUTION_OFFER_NOT_FOUND
    http: 404
    condition: "substitution_offer_id matches no SubstitutionOffer"
  - id: ERR_PALLET_NOT_FOUND
    http: 404
    condition: "pallet_id matches no Pallet"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "payment_id matches no Payment"
  - id: ERR_RECONCILIATION_NOT_FOUND
    http: 404
    condition: "drop_reconciliation_id matches no DropReconciliation"
  - id: ERR_COMMISSION_ACCRUAL_NOT_FOUND
    http: 404
    condition: "commission_accrual_id matches no CommissionAccrual"
  - id: ERR_VOLUNTEER_SHIFT_NOT_FOUND
    http: 404
    condition: "volunteer_shift_id matches no VolunteerShift"
  - id: ERR_CREDIT_GRANT_NOT_FOUND
    http: 404
    condition: "credit_grant_id matches no CreditGrant"

  # --- request shape ---------------------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "a required field is missing or mistyped; substitute_case_price_cents is absent while substitute_item_id is present; dues amount_cents or tier prorated_amount_cents does not equal the computed figure"
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "an enum-typed field or status filter carries a value outside that field's declared member list"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is outside [1, 100] or offset is negative"
  - id: ERR_INVALID_QUANTITY
    http: 422
    condition: "qty_units is outside [1, 500], or the item has split_allowed false and qty_units is not a whole multiple of case_pack_units"

  # --- write gates -----------------------------------------------------------
  - id: ERR_CYCLE_CLOSED
    http: 409
    condition: "GLOBAL GATE - the cycle the target resolves to has status CLOSED; raised before every other business rule"
  - id: ERR_MEMBERSHIP_LAPSED
    http: 403
    condition: "GATE - the member in scope has status LAPSED and the endpoint is an order, line or substitution write"
  - id: ERR_COORDINATOR_INELIGIBLE
    http: 403
    condition: "GATE - the acting DropCoordinator's tier_rank is below COORDINATOR_MIN_TIER_RANK (2)"
  - id: ERR_RECONCILIATION_POSTED
    http: 409
    condition: "GATE - the drop run in scope already carries a POSTED DropReconciliation and the endpoint would move money or receipts on it"
  - id: ERR_CYCLE_LOCKED
    http: 409
    condition: "GATE - an order or line write was attempted on a cycle no longer in status OPEN, outside the substitution carve-out"

  # --- state -----------------------------------------------------------------
  - id: ERR_INVALID_CYCLE_STATE
    http: 409
    condition: "the Cycle is not in a from-state the requested transition declares, or a reconciliation post was attempted while the cycle is not DELIVERED"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "the MemberOrder is not in a from-state the requested transition declares on the relevant axis"
  - id: ERR_INVALID_LINE_STATE
    http: 409
    condition: "the OrderLine is not in status REQUESTED when a patch or cancel was attempted"
  - id: ERR_INVALID_DROP_RUN_STATE
    http: 409
    condition: "the DropRun is not in a from-state the requested transition declares"
  - id: ERR_INVALID_ROUTE_RUN_STATE
    http: 409
    condition: "the RouteRun is not in status RECEIVED when a receipt, invoice or pallet build was attempted"
  - id: ERR_INVALID_OFFER_STATE
    http: 409
    condition: "the SubstitutionOffer is not in status PENDING"
  - id: ERR_INVALID_RECONCILIATION_STATE
    http: 409
    condition: "post was attempted on a reconciliation that is not BALANCED, or resolve-variance on one that is not VARIANCE_HELD"
  - id: ERR_INVALID_ACCRUAL_STATE
    http: 409
    condition: "payout was attempted on an accrual that is not ACCRUED or ADJUSTED, or on one whose drop run has no POSTED reconciliation"
  - id: ERR_INVALID_SHIFT_STATE
    http: 409
    condition: "verify or reject was attempted on a shift that is not LOGGED"
  - id: ERR_INVALID_PALLET_STATE
    http: 409
    condition: "seal was attempted on a pallet that is not BUILDING"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "an expected_*_version field does not equal the stored version of the named parent entity"

  # --- temporal --------------------------------------------------------------
  - id: ERR_CUTOFF_PASSED
    http: 409
    condition: "an order or line write reached a still-OPEN cycle at or after its cutoff_at"
  - id: ERR_EXCEPTION_WINDOW_CLOSED
    http: 409
    condition: "a substitution response arrived outside the cycle's exception window or at or after the offer's respond_by"
  - id: ERR_EXCEPTION_WINDOW_OPEN
    http: 409
    condition: "consolidation was attempted before the cycle's exception_deadline_at"
  - id: ERR_PRICE_VERSION_OVERLAP
    http: 409
    condition: "a PriceVersion already exists for this item with the same effective_from instant"
  - id: ERR_ROUTE_WINDOW_CONFLICT
    http: 409
    condition: "minting a RouteRun would put the route into two cycles whose windows are closer together than the 48-hour turnaround"

  # --- constraint satisfaction -----------------------------------------------
  - id: ERR_ROUTE_NO_COLD_CHAIN
    http: 422
    condition: "a FROZEN or CHILLED item was ordered through a drop point whose route has reefer_slots 0"
  - id: ERR_REEFER_CAPACITY_EXCEEDED
    http: 409
    condition: "the pallet plan needs more reefer slots than the Route provides"
  - id: ERR_PALLET_CAPACITY_EXCEEDED
    http: 409
    condition: "the pallet plan needs more pallet positions than Route.max_pallets"
  - id: ERR_ITEM_DISCONTINUED
    http: 409
    condition: "a line was created or patched against an Item with status DISCONTINUED"
  - id: ERR_NO_EFFECTIVE_PRICE
    http: 409
    condition: "no PriceVersion for the item has effective_from at or before the cycle's cutoff_at"
  - id: ERR_DUPLICATE_LINE_FOR_ITEM
    http: 409
    condition: "the order already carries a non-CANCELLED line for this item"
  - id: ERR_DUPLICATE_ORDER_FOR_MEMBER
    http: 409
    condition: "the member already has a non-CANCELLED order on this drop run"
  - id: ERR_MERGE_TARGET_INVALID
    http: 422
    condition: "the merge target is the source itself, sits on a different route run, or is not in status OPEN"
  - id: ERR_ROLLFORWARD_LIMIT
    http: 409
    condition: "the drop run has already been rolled forward once, or the target cycle is not OPEN with a later cutoff_at"
  - id: ERR_RECEIPT_EXCEEDS_ORDERED
    http: 422
    condition: "the receipt would push the aggregate's cumulative units_received above covered_units"
  - id: ERR_PALLETS_NOT_SEALED
    http: 409
    condition: "consolidation was attempted while at least one pallet on the cycle is still BUILDING"
  - id: ERR_SUPPLIER_INVOICE_MISSING
    http: 409
    condition: "pallet building was attempted before the run's supplier invoice was recorded"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID posting a reconciliation equals the prepared_by_user_id that drafted it"
  - id: ERR_VARIANCE_UNRESOLVED
    http: 422
    condition: "adjustment_cents does not equal the reconciliation's current variance_cents"

  # --- fiscal ----------------------------------------------------------------
  - id: ERR_ROUTE_MINIMUM_NOT_MET
    http: 409
    condition: "submission was attempted on a cycle whose every route run was deferred at the route minimum"
  - id: ERR_DROP_RECONCILIATION_INCOMPLETE
    http: 409
    condition: "cycle reconciliation was attempted while at least one settled drop run has no POSTED reconciliation"
  - id: ERR_CREDIT_CAP_EXCEEDED
    http: 422
    condition: "apply_credit_cents exceeds half of the order's pre_credit_total_cents"
  - id: ERR_PAYMENT_VARIANCE_EXCEEDED
    http: 409
    condition: "the capture amount overshoots the authorized amount by more than the tolerance band"
  - id: ERR_REFUND_EXCEEDS_CAPTURE
    http: 422
    condition: "amount_cents is below 1 or above captured_cents less refunded_cents"
  - id: ERR_VOLUNTEER_OBLIGATION_UNMET
    http: 409
    condition: "a STORE_CREDIT payout was requested on a drop run whose verified_volunteer_hours is below 4.0"

# =============================================================================
# §1.7 RBAC MATRIX
# =============================================================================

roles:
  - name: ClubAdmin
    description: "Runs the club - catalog, routes, drop points, membership admin and the cycle lifecycle. Superset operator who can stand in for any other role's write operations."
    identity: opaque
    exclusive_operations:
      - "POST /routes"
      - "POST /drop-points"
      - "POST /items"
      - "POST /items/{item_id}/discontinue"
      - "POST /price-versions"
      - "POST /members"
      - "POST /members/{member_id}/lapse"
      - "POST /cycles"
      - "POST /cycles/{cycle_id}/lock"
      - "POST /cycles/{cycle_id}/submit"
      - "POST /cycles/{cycle_id}/close"
      - "POST /cycles/{cycle_id}/cancel"
      - "POST /credit-grants"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every read endpoint"
      - "POST /members/{member_id}/dues-payments and /tier-changes, shared with Member"
      - "POST /drop-runs and the drop-run actions, shared with DropCoordinator"
      - "POST /member-orders, /order-lines and their actions, shared with Member"
      - "POST /receipt-lines, /route-runs/{route_run_id}/supplier-invoice, /build-pallets, /pallets/{pallet_id}/seal and the cycle receive, consolidate and deliver actions, shared with WarehouseOperator"
      - "POST /drop-reconciliations and its actions, /member-orders payment actions, /commission-accruals payout and /cycles/{cycle_id}/reconcile, shared with FinanceOfficer"
      - "POST /volunteer-shifts and its verify and reject actions, shared with DropCoordinator"

  - name: DropCoordinator
    description: "A member who runs a drop point. Acts only on drop runs whose coordinator_member_id is their own id, and only while holding tier_rank 2 or higher."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "every read endpoint"
      - "POST /drop-runs"
      - "POST /drop-runs/{drop_run_id}/merge"
      - "POST /drop-runs/{drop_run_id}/roll-forward"
      - "POST /volunteer-shifts"
      - "POST /volunteer-shifts/{volunteer_shift_id}/verify"
      - "POST /volunteer-shifts/{volunteer_shift_id}/reject"

  - name: Member
    description: "An ordering member. Acts only on their own orders, lines and substitution offers."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /substitution-offers/{substitution_offer_id}/approve"
      - "POST /substitution-offers/{substitution_offer_id}/decline"
    shared_operations:
      - "every read endpoint"
      - "POST /members/{member_id}/dues-payments"
      - "POST /members/{member_id}/tier-changes"
      - "POST /member-orders"
      - "POST /member-orders/{member_order_id}/submit"
      - "POST /member-orders/{member_order_id}/cancel"
      - "POST /order-lines"
      - "PATCH /order-lines/{order_line_id}"
      - "POST /order-lines/{order_line_id}/cancel"

  - name: WarehouseOperator
    description: "Runs receiving and consolidation. Records what the supplier delivered, the invoice and freight, builds and seals pallets."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "every read endpoint"
      - "POST /cycles/{cycle_id}/receive"
      - "POST /cycles/{cycle_id}/consolidate"
      - "POST /cycles/{cycle_id}/deliver"
      - "POST /route-runs/{route_run_id}/supplier-invoice"
      - "POST /route-runs/{route_run_id}/build-pallets"
      - "POST /receipt-lines"
      - "POST /pallets/{pallet_id}/seal"

  - name: FinanceOfficer
    description: "Runs the money. Authorizes, captures and refunds member orders, drafts and posts drop reconciliations and pays coordinators. Segregation of duties is enforced on X-User-ID, not on role - the officer who drafted a reconciliation may not post it, even though both actions are inside this role."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "every read endpoint"
      - "POST /member-orders/{member_order_id}/authorize"
      - "POST /member-orders/{member_order_id}/capture"
      - "POST /member-orders/{member_order_id}/refund"
      - "POST /drop-reconciliations"
      - "POST /drop-reconciliations/{drop_reconciliation_id}/post"
      - "POST /drop-reconciliations/{drop_reconciliation_id}/resolve-variance"
      - "POST /commission-accruals/{commission_accrual_id}/payout"
      - "POST /cycles/{cycle_id}/reconcile"

# =============================================================================
# LIST ORDERING — every GET list endpoint returns rows in a pinned order so a
# test may address `$.data[0]` deterministically.
# =============================================================================

list_ordering:
  default: "created_at ASC. Rows written inside one request share a created_at value to the millisecond; they are returned in the order the server wrote them, which every producing rule below pins explicitly."
  case_aggregates: "written in Item.sku ASC order during POST /cycles/{cycle_id}/lock hop 3"
  pallets: "written in temp_class order FROZEN, then CHILLED, then DRY, and within a class in ascending sequence_index, during POST /route-runs/{route_run_id}/build-pallets"
  substitution_offers: "written in OrderLine.created_at ASC order during POST /receipt-lines"
  order_lines: "created one per request, so created_at ASC is total"
  payments: "within one capture, the STORE_CREDIT record is written before the CARD record"
  credit_grants: "created one per request or one per verified shift, so created_at ASC is total"
  commission_accruals: "written in DropRun.created_at ASC order during POST /cycles/{cycle_id}/deliver"
