              payload: { locate_outcome: "LOCATED", employer_name: "Northcutt Welding" }
              as: CaseWorker
              captures: { h5_locate: "$.data.locate_status" }
            - call: "POST /child-support/cases/${caseh5}/paternity-actions"
              payload: { method: "VOLUNTARY_ACKNOWLEDGMENT" }
              as: CaseWorker
              captures: { h5_pa_status: "$.data.status" }
          assert:
            - "HTTP 409 and ${e_gc_locate} == ERR_GOOD_CAUSE_BARS_DISCLOSURE  # the flag lives on the case, not on the referral being created"
            - "${refg5_st} == DRAFT  # creating the interstate referral is NOT a disclosure and is allowed"
            - "HTTP 409 and ${e_gc_transmit} == ERR_GOOD_CAUSE_BARS_DISCLOSURE  # transmitting it would disclose party information"
            - "${g5_pa_status} == PENDING and ${g5_cs} == PATERNITY_PENDING  # good cause lets the case skip LOCATE entirely with an unlocated NCP"
            - "HTTP 409 and ${e_notlocated1} == ERR_NCP_NOT_LOCATED  # the same payload on the non-good-cause case is refused at locate_status NOT_NEEDED"
            - "${h5_cs} == LOCATE and ${h5_refcount} == 1  # the referral moves the case and sets the Participant to PENDING"
            - "HTTP 409 and ${e_notlocated2} == ERR_NCP_NOT_LOCATED  # PENDING is not LOCATED"
            - "${h5_locate} == LOCATED"
            - "${h5_pa_status} == PENDING  # only now does the paternity action open, from LOCATE"

      - name: modification_review_gates_unlock_in_sequence
        claim_type: cascading_validation
        grounds:
          - "validations[priority 24]"
          - "validations[priority 32]"
          - "validations[priority 25]"
          - "validations[priority 10 ERR_INVALID_REVIEW_STATUS]"
          - "errors[ERR_REVIEW_NOT_YET_ELIGIBLE]"
          - "errors[ERR_INFO_REQUEST_LIMIT]"
          - "errors[ERR_MODIFICATION_EFFECTIVE_DATE_NOT_LATER]"
          - "errors[ERR_INVALID_REVIEW_STATUS]"
          - "calculations.substantial_change_variance"
        distinguishing_aspect: >
          Four gates fire in strict sequence on one order, each reachable only
          because the previous one passed. A PERIODIC_36_MONTH review is refused
          before effective_date + 36 months while a PARTY_REQUEST review of the same
          order is exempt; the exempt review then bounces to INFO_PENDING three
          times because an income stays SELF_REPORTED, and the fourth information
          post is refused once info_request_count exceeds 2 - leaving that review
          permanently stuck, which is why the substantive path needs a second
          review. On the second review the effective_date gate is probed at equality
          (refused) and one month later (accepted), after which screening the now
          ORDER_PROPOSED review is refused with ERR_INVALID_REVIEW_STATUS.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z throughout - every gate here is data-driven, not clock-driven, except the eligibility date."
            - "CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD; ENTERED CURRENT_SUPPORT order effective 2026-08-01 with monthly_obligation_cents 75000."
            - "review_eligible_date is 2029-08-01 (effective_date + PERIODIC_REVIEW_MONTHS 36)."
            - "INFO_REQUEST_LIMIT is 2; VARIANCE_THRESHOLD_BP is 1500 and MIN_ABSOLUTE_CHANGE_CENTS is 5000."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Lucinda Farrow", ssn_last4: "6215", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpv6: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Desmond Farrow", ssn_last4: "6216", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpv6: "$.data.id" }
            - call: "POST /child-support/participants/${ncpv6}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpv6}", noncustodial_party_id: "${ncpv6}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casev6: "$.data.id" }
            - call: "POST /child-support/cases/${casev6}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casev6}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { orderv6: "$.data.id" }
            - call: "POST /child-support/orders/${orderv6}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${orderv6}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monv6: "$.data.monthly_obligation_cents" }
          trigger:
            - call: "POST /child-support/orders/${orderv6}/modification-reviews"
              payload: { trigger_type: "PERIODIC_36_MONTH" }
              as: CaseWorker
              captures: { e_noteligible: "$.data.error_id" }
            - call: "POST /child-support/orders/${orderv6}/modification-reviews"
