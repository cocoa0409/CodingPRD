              payload: { studio_id: "${studio_id}", name: "Reformer Flow 50", duration_minutes: 50, base_price_cents: 4000, default_capacity: 2, credit_cost: 1, is_off_peak: true, buffer_minutes: 15 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { tpl_id: $.data.id }
            - &f_ivy
              call: "POST /wellness/staff-members"
              payload: { studio_id: "${studio_id}", full_name: "Ivy Chen", staff_role: "INSTRUCTOR", primary_class_template_id: "${tpl_id}", substitute_class_template_ids: ["${tpl_id}"], commission_rate_bps: 0 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { ivy_id: $.data.id }
            - &f_sess_first
              call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 1, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_first_id: $.data.id, sess_first_v: $.data.version }
            - &f_sess_second
              call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-B", start_at: "2026-06-20T17:20:00Z", capacity: 1, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_second_id: $.data.id }
            - &f_maya
              call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Maya Alvarez", email: "maya@example.com", home_state_code: "CA" }
              as: Client
              captures: { maya_id: $.data.id }
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Bea Tan", email: "bea@example.com", home_state_code: "CA" }
              as: Client
              captures: { bea_id: $.data.id }
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_first_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_first_id: $.data.id }
            - call: "POST /wellness/bookings"
              payload: { client_id: "${bea_id}", class_session_id: "${sess_second_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${bea_id}"
              captures: { bk_second_id: $.data.id }
          trigger:
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_second_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the second session is already full, yet the request fails with error_id == ERR_CLIENT_SCHEDULE_OVERLAP and not ERR_STUDIO_CAPACITY_EXCEEDED, because the temporal band is evaluated first"
            - "GET /wellness/bookings?class_session_id=${sess_second_id} still returns exactly 1 row"
            - "cancelling the first booking with POST /wellness/bookings/${bk_first_id}/cancel and repeating the request then surfaces ERR_STUDIO_CAPACITY_EXCEEDED, confirming the overlap really was the shadowing cause"

      - name: a_bounded_request_without_user_context_is_refused_before_existence
        claim_type: Violation -> Error
        grounds:
          - validations.check_auth_headers
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
          - errors.ERR_STUDIO_NOT_FOUND
        distinguishing_aspect: "Header validation outranks existence, so a request naming an id that does not exist still fails on the missing header rather than on the unresolvable id — the auth band is checked before any lookup."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. No studio exists yet."
          setup_api_calls:
            - *f_tier_growth
            - *f_clock_jun
          trigger:
            - call: "GET /wellness/subscriptions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: "" 
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "error_id != ERR_SUBSCRIPTION_NOT_FOUND, so the header failure pre-empted the lookup"
            - "an unknown role value in X-User-Role is refused with the same error and the same 400"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: marketplace_booking_refuses_a_membership_credit_payment_source
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/wellness/marketplace/bookings
          - errors.ERR_PAYMENT_SOURCE_NOT_PERMITTED
          - entities.Booking.fields.channel
        distinguishing_aspect: "The marketplace endpoint declares only a payment_ref, so the studio-channel entitlement sources are not merely ignored — a request that tries to route them through the marketplace is refused, keeping the two channels' economics separate."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a payroll period, template, instructor, a capacity-4 session and a client."
          setup_api_calls:
            - *f_tier_growth
            - *f_clock_jun
            - *f_studio
            - *f_pp_june
            - *f_tpl
            - *f_ivy
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-C", start_at: "2026-06-20T18:00:00Z", capacity: 4, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_id: $.data.id }
            - *f_maya
          trigger:
            - call: "POST /wellness/marketplace/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_id}", payment_ref: "pm_ok_1", promo_redeem: false }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "the marketplace booking succeeds with channel MARKETPLACE and payment_source DROP_IN"
            - "the extra fields the studio channel uses are not declared on this endpoint, so a body carrying class_pack_id is ignored and the booking still settles against payment_ref"
            - "GET /wellness/bookings?class_session_id=${sess_id} returns 1 row with is_promotional_seat == false"

      - name: eligible_instructors_ranking_inverts_between_legacy_and_ladder_tiers
        claim_type: Computed read
        grounds:
          - endpoints.GET_/wellness/class-sessions/{id}/eligible-instructors
          - calculations.instructor_substitution_priority
          - calculations.instructor_substitution_priority.variants.legacy_flat_weights
        distinguishing_aspect: "The read ranks the studio's instructors by the weighted ladder and the ranking is tier-dependent, so the eligible list for the same session is not the same list on a STARTER studio as on a GROWTH one."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a payroll period, one template, and two instructors: Ivy who primarily teaches this template, and Omar who is substitute-only and therefore scores half on the level term."
          setup_api_calls:
            - *f_tier_growth
            - *f_clock_jun
            - *f_studio
            - *f_pp_june
            - *f_tpl
            - *f_ivy
            - call: "POST /wellness/staff-members"
              payload: { studio_id: "${studio_id}", full_name: "Omar Diallo", staff_role: "INSTRUCTOR", primary_class_template_id: "${tpl_id}", substitute_class_template_ids: ["${tpl_id}"], commission_rate_bps: 0 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { omar_id: $.data.id, omar_created_at: $.data.created_at }
            - call: "POST /wellness/staff-members/${omar_id}/restrict-to-substitute"
              payload: {}
              as: StudioOwner
              as_user_id: "${studio_id}"
            - *f_sess_first
          trigger:
            - call: "GET /wellness/class-sessions/${sess_first_id}/eligible-instructors"
              payload: { limit: 10 }
              as: StudioOwner
              as_user_id: "${studio_id}"
          assert:
            - "the response is a ranked object with eligible, total_count and has_more"
            - "total_count == 1, because the session's own instructor of record is excluded from the candidate set"
            - "the single candidate scores the full 30-point template term and the halved level term"
            - "the ranking tie-break is ascending created_at, so two equally scoring instructors are ordered by the earlier one first and never by their ids"
            - "an empty candidate set returns an empty eligible array rather than an error"

      - name: session_aftercare_sweep_expires_every_lapsed_offer_and_reports_the_count
        claim_type: Bulk action
        grounds:
          - endpoints.POST_/wellness/waitlist-entries/sweep-offers
          - state_machines.WaitlistEntry.OFFERED_to_EXPIRED
          - entities.WaitlistEntry.fields.offer_expires_at
        distinguishing_aspect: "The sweep is a single call that mutates several holds at once and reports a count, so the response is an aggregate rather than one entity — and holds whose window has not lapsed are left untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a payroll period, template, instructor, a capacity-1 session, a booked client and one waitlisted client."
          setup_api_calls:
            - *f_tier_growth
            - *f_clock_jun
            - *f_studio
            - *f_pp_june
            - *f_tpl
            - *f_ivy
            - *f_sess_first
            - *f_maya
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Bea Tan", email: "bea@example.com", home_state_code: "CA" }
              as: Client
              captures: { bea_id: $.data.id }
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_first_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /wellness/waitlist-entries"
              payload: { class_session_id: "${sess_first_id}", client_id: "${bea_id}", position_mode: "QUEUED" }
              as: Client
              as_user_id: "${bea_id}"
              captures: { wl_id: $.data.id }
            - call: "POST /wellness/bookings/${bk_id}/cancel"
              payload: { reason: "schedule conflict" }
              as: Client
              as_user_id: "${maya_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-14T10:00:00Z" }
              as: OperatorOnly
            - call: "POST /wellness/waitlist-entries/sweep-offers"
              payload: { studio_id: "${studio_id}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { swept: $.data.swept_count, expired_ids: $.data.expired_entry_ids }
          assert:
            - "the sweep reports swept_count == 1 and expired_entry_ids == [${wl_id}]"
            - "WaitlistEntry.${wl_id}.status == EXPIRED and the session's seats_held dropped to 0"
            - "the seat is not offered onward because the candidate pool is empty, and it is held for OFFER_HOLD_HOLD_MINUTES before returning to the open pool"
            - "repeating the sweep immediately reports swept_count == 0, so the operation is idempotent over already-expired holds"

      - name: clients_list_filters_by_roster_status_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/wellness/clients
          - entities.Client.fields.status
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The list is the reverse-reachability read for Client.home_studio_id, so the same collection serves both a roster walk and a status filter without a nested path."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with three clients, one of them moved to PORTABILITY_HOLD by a granted release."
          setup_api_calls:
            - *f_tier_growth
            - *f_clock_jun
            - *f_studio
            - *f_maya
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Bea Tan", email: "bea@example.com", home_state_code: "CA" }
              as: Client
              captures: { bea_id: $.data.id }
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Cleo Ruiz", email: "cleo@example.com", home_state_code: "CA" }
              as: Client
              captures: { cleo_id: $.data.id }
            - call: "POST /wellness/portability-requests"
              payload: { studio_id: "${studio_id}", requesting_client_id: "${cleo_id}", dispute_reason: "relocating" }
              as: Client
              as_user_id: "${cleo_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /wellness/portability-requests/${pr_id}/resolve-release"
              payload: { include_booking_history: true, include_financial_history: false }
              as: StudioOwner
              as_user_id: "${studio_id}"
          trigger:
            - call: "GET /wellness/clients"
              payload: { home_studio_id: "${studio_id}", limit: 2, offset: 0 }
              as: StudioOwner
              as_user_id: "${studio_id}"
          assert:
            - "the page returns 2 rows with total_count == 3 and has_more == true"
            - "GET /wellness/clients?home_studio_id=${studio_id}&status=PORTABILITY_HOLD returns exactly 1 row, the released client"
            - "GET /wellness/clients?home_studio_id=${studio_id}&status=ACTIVE returns 2 rows, since the held client is no longer ACTIVE"
            - "Studio.${studio_id}.client_roster_count == 2, because a client in PORTABILITY_HOLD is counted out of the roster"

