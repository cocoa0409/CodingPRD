      - name: notice_not_published_error_is_covered_by_the_cross_entity_difficulty_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NOTICE_NOT_PUBLISHED]
        excluded_because:
          difficulty_instance: asset_activation_requires_notice_packet_in_published_state
          rationale: "That instance triggers ERR_NOTICE_NOT_PUBLISHED with a DRAFT packet and then succeeds after publication, which is strictly stronger than a standalone triggerability test."

      - name: vendor_risk_error_is_covered_by_the_boundary_difficulty_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_VENDOR_RISK_TOO_HIGH]
        excluded_because:
          difficulty_instance: vendor_risk_score_exactly_at_gate_70_activates_while_80_is_refused
          rationale: "ERR_VENDOR_RISK_TOO_HIGH is raised there at the exact gate boundary, which subsumes a generic triggerability check."

      - name: program_posture_blocked_error_is_covered_by_the_priority_pair_difficulty_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PROGRAM_POSTURE_BLOCKED]
        excluded_because:
          difficulty_instance: posture_block_priority_9_outranks_vendor_risk_gate_priority_10
          rationale: "ERR_PROGRAM_POSTURE_BLOCKED is raised there while a priority-10 violation is also pending and then cleared once the program leaves FROZEN, so both the trigger and the release are already pinned."

      - name: segregation_of_duties_error_is_covered_by_the_priority_pair_difficulty_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: segregation_of_duties_priority_7_outranks_exposure_cap_priority_14
          rationale: "That instance raises ERR_SEGREGATION_OF_DUTIES while a priority-14 violation is also pending, and then retries with a second approver, so both polarities are already pinned."

      - name: notice_window_overlap_error_is_covered_by_the_resource_overlap_difficulty_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NOTICE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: notice_windows_are_half_open_so_abutting_packets_are_allowed
          rationale: "The overlap error and the abutting-is-legal case are both asserted there under the half-open interval semantics."

      - name: accommodation_window_conflict_error_is_covered_by_the_resource_overlap_difficulty_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ACCOMMODATION_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: accommodation_windows_are_closed_plus_24h_buffer_so_touching_windows_collide
          rationale: "That instance raises ERR_ACCOMMODATION_WINDOW_CONFLICT twice — for an overlapping window and for one that merely touches the 24-hour buffer — before finding the first admissible start date."

      - name: notification_outstanding_error_is_covered_by_the_parallel_state_difficulty_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NOTIFICATION_OUTSTANDING]
        excluded_because:
          difficulty_instance: incident_containment_and_notification_dimensions_advance_independently
          rationale: "The guard between the two incident dimensions is exercised there by attempting REMEDIATED while notification is still PENDING."

      - name: asset_still_active_error_is_covered_by_the_cross_entity_difficulty_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ASSET_STILL_ACTIVE]
        excluded_because:
          difficulty_instance: incident_remediation_requires_every_affected_asset_out_of_active
          rationale: "That instance raises ERR_ASSET_STILL_ACTIVE with one of two affected assets left ACTIVE and then succeeds once it is gated, covering both directions."

      - name: subject_class_mismatch_error_is_covered_by_the_priority_pair_difficulty_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SUBJECT_CLASS_MISMATCH]
        excluded_because:
          difficulty_instance: notice_lead_priority_11_outranks_subject_class_mismatch_priority_13
          rationale: "The mismatch is provoked there as the losing rule of the pair and then observed on its own once the lead is satisfied."

