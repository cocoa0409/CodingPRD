            - { call: "POST /stewardship/use-authorizations/${ua_id}/decide", payload: { decision: APPROVED_WITH_CONDITIONS, conditions: ["erosion control plan", "winter-only harvest"] }, as: StewardshipCoordinator }
          trigger:
