            - "Unit B is a NEW unit with title LENDER_HELD sitting in PENDING_FUNDING behind a FundingAdvance in REQUESTED that has deliberately not been funded."
            - "One ANNOUNCED FloorPlanAudit for 2026-08-10 to 2026-08-12, started at clock 2026-08-10 by FieldAuditor u-fa-1 with units_in_scope_count 1 (only unit A is floored), carrying one MISSING observation on unit A."
