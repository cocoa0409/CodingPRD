            - call: "POST /observation/video-feeds"
              payload: { station_id: "${st_q}", order_id: "${r1}", monitor_start_at: "2026-08-01T08:00:00Z", monitor_end_at: "2026-08-01T12:00:00Z" }
              as: RemoteObserver
