  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: booking_state_vs_inventory_priority_rejected
        grounds:
          - validations[priority=6.6]
          - validations[priority=11]
          - errors[ERR_BLOCK_NOT_CONTRACTED]
          - errors[ERR_BLOCK_INVENTORY_EXCEEDED]
        distinguishing_aspect: |
          Category pair {state, business_fiscal}: the booking violates both the
          block-state gate (NEGOTIATING, priority 6.6) and per-night inventory
          (25 > 20, priority 11); the state error ERR_BLOCK_NOT_CONTRACTED must
          win. The officials instance exercises the disjoint pair
          {business_safety, business_temporal}.
        test_recipe:
          setup:
            - "Event E; HotelBlock H in NEGOTIATING (never contracted): 20 rooms/night, rate 15000, nights 10-08..10-12, cutoff 2026-10-01"
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb_id: $.data.id } }
          trigger:
