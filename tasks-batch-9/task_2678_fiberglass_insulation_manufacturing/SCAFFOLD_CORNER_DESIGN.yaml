              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { batch1: "$.data.id" }
            - call: "POST /cullet-batches"
              payload: { plant_id: "${plant_id}", source_type: "EXTERNAL", mass_kg: 600.00, expected_plant_version: "${pv1}" }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { err_stale_plant: "$.data.error_id" }
            - call: "GET /plants/${plant_id}"
