      - name: val_evaluation_not_final_covered
        claim_type: cross_entity_validation
        grounds: ["validations[priority=8]", "errors[ERR_EVALUATION_NOT_FINAL]"]
        excluded_because:
          difficulty_instance: ce_order_requires_final_evaluation
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: val_funding_not_approved_covered
        claim_type: cross_entity_validation
        grounds: ["validations[priority=8]", "errors[ERR_FUNDING_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: ce_claim_requires_approved_authorization
          rationale: "Asserted as the failure path of the named §1.8 instance (and pp_referential_beats_fiscal_on_claim_submit)."
      # Error-catalog triggerability audit: ERR_UNAUTHENTICATED (val_missing_auth_headers),
      # ERR_STALE_VERSION (layer_occ_stale_version_rejected in complexity_layers),
      # ERR_FORBIDDEN_ROLE (rbac_*), ERR_VALIDATION (ent_*), ERR_NOT_FOUND (ent_*),
      # ERR_STALE_VERSION (layer_occ_*), ERR_INVALID_STATE (sm_*), ERR_PLAN_SUSPENDED
      # (val_plan_suspended_*), ERR_SEGREGATION_OF_DUTIES (val_segregation_*),
      # ERR_REFERRAL_NOT_ACCEPTED, ERR_EVALUATION_NOT_FINAL, ERR_ORDER_NOT_ACTIVE,
      # ERR_FUNDING_NOT_APPROVED, ERR_LOAN_STILL_ACTIVE, ERR_FUNDING_WINDOW_INVALID,
      # ERR_TRIAL_EXPIRED, ERR_SESSION_OVERLAP, ERR_SUBSCRIPTION_OVERLAP,
      # ERR_CATEGORY_MISMATCH, ERR_UNIT_NOT_AVAILABLE, ERR_NO_ELIGIBLE_UNIT,
      # ERR_PLAN_SESSION_CAP, ERR_ASSESSMENT_INCOMPLETE (x2), ERR_INSUFFICIENT_FUNDING
      # — every §1.6 error has at least one trigger instance here or in §1.8.

  # ==============================================================
  # Section: endpoints
  # ==============================================================
  - section: endpoints
    instances:
      - name: ep_list_pagination_defaults_and_params
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more; defaults are limit=10, offset=0."
        test_recipe:
          setup: ["model with 3 units"]
          setup_api_calls:
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-PG1", condition: "NEW" }, as: ClinicAdmin }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-PG2", condition: "NEW" }, as: ClinicAdmin }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-PG3", condition: "NEW" }, as: ClinicAdmin }
          trigger:
            - { call: "GET /api/device-units", payload: { device_model_id: "${m_id}", limit: 2, offset: 0 }, as: ClinicAdmin }
            - { call: "GET /api/device-units", payload: { device_model_id: "${m_id}", limit: 2, offset: 2 }, as: ClinicAdmin }
          assert:
            - "Page 1 returns 2 items with total_count == 3 and has_more == true"
            - "Page 2 returns 1 item with total_count == 3 and has_more == false"

      - name: ep_response_envelope_shape
        claim_type: retrieval
        grounds: [response_envelope]
        distinguishing_aspect: "Every success body carries meta.api_request_id, meta.api_request_timestamp, response_type, data; every error body carries response_type=error and data.error_id + data.message."
        test_recipe:
          setup: ["one client exists"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Envelope", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
          trigger:
            - { call: "GET /api/clients/${c_id}", as: IntakeCoordinator }
            - { call: "GET /api/clients/123e4567-e89b-42d3-a456-426614174000", as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "Success response: meta.api_request_id present, response_type == object, data holds the client"
            - "Error response: response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty"

      - name: ep_fk_reverse_referrals_of_client
        claim_type: retrieval
        grounds: [entities.Referral.fields.client_id, endpoints]
        distinguishing_aspect: "GET /api/clients/{id}/referrals (sub-resource form) returns exactly the client's referrals."
        test_recipe:
          setup: ["client with two referrals"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "FK Rev", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "PHYSICIAN", referring_party: "Dr. Z" }, as: IntakeCoordinator, captures: { r2: $.data.id } }
          trigger:
            - { call: "GET /api/clients/${c_id}/referrals", as: IntakeCoordinator }
          assert:
            - "Response data contains exactly ${r1} and ${r2}"

      - name: ep_fk_reverse_model_predecessors
        claim_type: retrieval
        grounds: [entities.DeviceModel.fields.successor_model_id]
        distinguishing_aspect: "Self-referential FK: model B points at successor A; GET /api/device-models/{A}/predecessors returns B."
        test_recipe:
          setup: ["model A; model B with successor_model_id = A"]
          setup_api_calls:
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { ma: $.data.id } }
            - { call: "POST /api/device-models", payload: { name: "Magna 4x", category: "MAGNIFIER", list_price_cents: 20000, successor_model_id: "${ma}" }, as: ClinicAdmin, captures: { mb: $.data.id } }
          trigger:
            - { call: "GET /api/device-models/${ma}/predecessors", as: ClinicAdmin, captures: { pred0: "$.data[0].id" } }
          assert:
            - "${pred0} == ${mb}"

      - name: ep_fk_reverse_repair_tickets_by_loan
        claim_type: retrieval
        grounds: [entities.RepairTicket.fields.loan_agreement_id]
        distinguishing_aspect: "GET /api/loan-agreements/{id}/repair-tickets finds the ticket that spawned the loan (1:1 -> array of length 1)."
        test_recipe:
          setup: ["repair ticket advanced to IN_REPAIR with needs_loaner (loan exists)"]
          setup_api_calls:
            - { call: "POST /api/device-models", payload: { name: "CCTV Pro 24", category: "CCTV", list_price_cents: 100000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-FK1", condition: "NEW" }, as: ClinicAdmin, captures: { u_broken: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-FK2", condition: "LOANER" }, as: ClinicAdmin }
            - { call: "POST /api/repair-tickets", payload: { device_unit_id: "${u_broken}", issue_description: "no image" }, as: RepairTechnician, captures: { t_id: $.data.id } }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "DIAGNOSE" }, as: RepairTechnician }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "START_REPAIR", needs_loaner: true }, as: RepairTechnician, captures: { loan_id: $.data.loan_agreement_id } }
          trigger:
            - { call: "GET /api/loan-agreements/${loan_id}/repair-tickets", as: RepairTechnician, captures: { t0: "$.data[0].id" } }
          assert:
            - "${t0} == ${t_id}"

      - name: ep_filtered_list_device_units_by_status
        claim_type: listing
        grounds: [endpoints]
        distinguishing_aspect: "Filtered list composes filters: status=IN_STOCK plus device_model_id returns only matching units."
        test_recipe:
          setup: ["model with one IN_STOCK unit and one DEPLOYED unit (allocated to an order)"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Filter", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-F1", condition: "NEW" }, as: ClinicAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-F2", condition: "NEW" }, as: ClinicAdmin, captures: { u2: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u2}" }, as: VisionSpecialist }
          trigger:
            - { call: "GET /api/device-units", payload: { device_model_id: "${m_id}", status: "IN_STOCK" }, as: ClinicAdmin, captures: { only: "$.data[0].id" } }
          assert:
            - "${only} == ${u1} and total_count == 1  # the DEPLOYED unit is filtered out"

  # ==============================================================
  # Section: rbac
  # ==============================================================
  - section: rbac
    instances:
      - name: rbac_evaluation_create_forbidden_for_billing
        claim_type: violation_to_error
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "BillingSpecialist calling the VisionSpecialist-exclusive POST /api/evaluations gets ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["client with ACCEPTED referral"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "RBAC One", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
          trigger:
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}" }, as: BillingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"

      - name: rbac_claim_create_forbidden_for_specialist
        claim_type: violation_to_error
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "VisionSpecialist calling the BillingSpecialist-exclusive POST /api/claims gets ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["empty database (role check precedes existence)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/claims", payload: { funding_authorization_id: "123e4567-e89b-42d3-a456-426614174000", device_order_id: "123e4567-e89b-42d3-a456-426614174001", service_date: "2026-05-10T00:00:00Z", lines: [ { line_type: "DEVICE", unit_price_cents: 100, quantity: 1 } ] }, as: VisionSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE  # role check (priority 2) precedes existence (priority 4)"

      - name: rbac_adjudicate_forbidden_for_coordinator
        claim_type: violation_to_error
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "FundingCoordinator cannot adjudicate (PayerAdjudicator-exclusive), even an authorization someone else submitted."
        test_recipe:
          setup: ["authorization SUBMITTED by fc-1"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "RBAC Adj", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "VR", payer_ref: "VR-RB", authorized_amount_cents: 9000, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-1", captures: { fa_id: $.data.id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/submit", payload: {}, as: FundingCoordinator, as_user_id: "fc-1" }
          trigger:
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: FundingCoordinator, as_user_id: "fc-2", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"

      - name: rbac_catalog_forbidden_for_specialist
        claim_type: violation_to_error
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "VisionSpecialist cannot create catalog models (ClinicAdmin-exclusive)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/device-models", payload: { name: "Rogue", category: "CCTV", list_price_cents: 1 }, as: VisionSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"

      - name: rbac_run_daily_forbidden_for_intake
        claim_type: violation_to_error
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "IntakeCoordinator cannot run the ops sweep (ClinicAdmin-exclusive)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/ops/run_daily", payload: {}, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"

      - name: rbac_loan_return_shared_by_technician_and_specialist
        claim_type: satisfaction_pass
        grounds: [roles, endpoints]
        distinguishing_aspect: "The shared operation POST /api/loan-agreements/{id}/return succeeds for both RepairTechnician and VisionSpecialist."
        test_recipe:
          setup: ["two repair tickets each with an ACTIVE loaner loan (two separate loaner units)"]
          setup_api_calls:
            - { call: "POST /api/device-models", payload: { name: "CCTV Pro 24", category: "CCTV", list_price_cents: 100000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-SH1", condition: "NEW" }, as: ClinicAdmin, captures: { ub1: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-SH2", condition: "NEW" }, as: ClinicAdmin, captures: { ub2: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-SH3", condition: "LOANER" }, as: ClinicAdmin }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-SH4", condition: "LOANER" }, as: ClinicAdmin }
            - { call: "POST /api/repair-tickets", payload: { device_unit_id: "${ub1}", issue_description: "issue one" }, as: RepairTechnician, captures: { t1: $.data.id } }
            - { call: "POST /api/repair-tickets/${t1}/advance", payload: { action: "DIAGNOSE" }, as: RepairTechnician }
            - { call: "POST /api/repair-tickets/${t1}/advance", payload: { action: "START_REPAIR", needs_loaner: true }, as: RepairTechnician, captures: { loan1: $.data.loan_agreement_id } }
            - { call: "POST /api/repair-tickets", payload: { device_unit_id: "${ub2}", issue_description: "issue two" }, as: RepairTechnician, captures: { t2: $.data.id } }
            - { call: "POST /api/repair-tickets/${t2}/advance", payload: { action: "DIAGNOSE" }, as: RepairTechnician }
            - { call: "POST /api/repair-tickets/${t2}/advance", payload: { action: "START_REPAIR", needs_loaner: true }, as: RepairTechnician, captures: { loan2: $.data.loan_agreement_id } }
          trigger:
            - { call: "POST /api/loan-agreements/${loan1}/return", payload: {}, as: RepairTechnician, captures: { st1: $.data.status } }
            - { call: "POST /api/loan-agreements/${loan2}/return", payload: {}, as: VisionSpecialist, captures: { st2: $.data.status } }
          assert:
            - "${st1} == RETURNED"
            - "${st2} == RETURNED"

  # ==============================================================
  # Section: complexity_layers
  # ==============================================================
  - section: complexity_layers
    instances:
      - name: layer_occ_stale_version_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[evaluation-create-stale-client]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: after one evaluation create bumps Client.version, a second create carrying the previously observed version is rejected 412 ERR_STALE_VERSION; refetching the version lets the create succeed and supersedes the first DRAFT evaluation."
        test_recipe:
          setup: ["client ACTIVE (version 2 after referral accept); observed version captured"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "OCC Test", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}" }, as: VisionSpecialist, captures: { err: $.data.error_id } }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v2: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v2}" }, as: VisionSpecialist, captures: { e2: $.data.id } }
            - { call: "GET /api/evaluations/${e1}", as: VisionSpecialist, captures: { e1_st: $.data.status } }
          assert:
            - "${c_v} == 2"
            - "${err} == ERR_STALE_VERSION  # the first create bumped Client.version to 3"
            - "${c_v2} == 3"
            - "Evaluation.${e2}.status == DRAFT"
            - "${e1_st} == SUPERSEDED  # supersede side effect of the fresh create"

      - name: layer_clock_default_time
        claim_type: correct_result
        grounds: [endpoints, calculations.trial_conversion_fee]
        distinguishing_aspect: "Before any set_current_utc call the logical clock is exactly 2026-05-01T00:00:00Z: dispensed_at stamps 2026-05-01 and trial_ends_at computes to 2026-05-15 for trial_days 14."
        test_recipe:
          setup: ["TRIAL order allocated without any clock manipulation"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Clock Def", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-CD", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "TRIAL", trial_days: 14 }, as: VisionSpecialist, captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist, captures: { disp: $.data.dispensed_at, ends: $.data.trial_ends_at } }
          assert:
            - "${disp} == 2026-05-01T00:00:00Z  # startup default, never wall-clock"
            - "${ends} == 2026-05-15T00:00:00Z"

      - name: layer_dual_variant_covered
        claim_type: correct_result
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: dvc_claim_provisional_vs_final
          rationale: "Dual-variant layer exercised by the named §1.8 instance and dvc_outcome_provisional_vs_final."
      - name: layer_cascading_side_effects_covered
        claim_type: side_effect_execution
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: tc_repair_loaner_cascade
          rationale: "N-level cascade exercised by the named §1.8 instance and tc_no_show_suspension_cascade."
      - name: layer_derived_field_reconciliation_covered
        claim_type: computed_fields
        grounds: [calculations.unit_pool_counts]
        excluded_because:
          difficulty_instance: ci_unit_account_conservation
          rationale: "Derived-field reconciliation on allocate/return asserted in the named §1.8 instance."

  # ==============================================================
  # Section: consistency_model
  # ==============================================================
  - section: consistency_model
    instances:
      - name: cm_immediate_visibility_after_mutation
        claim_type: correct_result
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the mutation response itself carries the new state, and a follow-up GET in the same test sees identical values (no lag, no read-repair)."
        test_recipe:
          setup: ["model exists"]
          setup_api_calls:
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-IM", condition: "NEW" }, as: ClinicAdmin, captures: { u_st: $.data.status } }
            - { call: "GET /api/device-models/${m_id}", as: ClinicAdmin, captures: { stock: $.data.in_stock_count, tot: $.data.total_count } }
          assert:
            - "${u_st} == IN_STOCK  # visible in the create response itself"
            - "${stock} == 1 and ${tot} == 1  # derived counts consistent on the immediate re-read"

  # ==============================================================
  # Section: errors
  # ==============================================================
  - section: errors
    instances:
      - name: err_http_status_mapping_distinctness
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "errors[ERR_FORBIDDEN_ROLE]", "errors[ERR_NOT_FOUND]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "The catalog's HTTP mapping is honored per error: 401 for missing auth, 403 for a forbidden role, 404 for a missing resource, 409 for an invalid state — asserted as status codes, not just error_ids."
        test_recipe:
          setup: ["client with an ACCEPTED referral"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "HTTP Map", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/clients", payload: { full_name: "No Role", date_of_birth: "1960-01-01" }, as: Anonymous, captures: { e401: $.data.error_id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "x" }, as: VisionSpecialist, captures: { e403: $.data.error_id } }
            - { call: "GET /api/clients/123e4567-e89b-42d3-a456-426614174000", as: IntakeCoordinator, captures: { e404: $.data.error_id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator, captures: { e409: $.data.error_id } }
          assert:
            - "${e401} == ERR_UNAUTHENTICATED with http status 401"
            - "${e403} == ERR_FORBIDDEN_ROLE with http status 403"
            - "${e404} == ERR_NOT_FOUND with http status 404"
            - "${e409} == ERR_INVALID_STATE with http status 409  # referral already ACCEPTED"
