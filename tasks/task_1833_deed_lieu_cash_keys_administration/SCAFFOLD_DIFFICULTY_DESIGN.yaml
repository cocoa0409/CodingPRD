            - { call: "POST /property-solutions/title-commitments/${tc_id}/receive", payload: { vested_owner_name: "A. Borrower" }, as: TitleOfficer, as_user_id: to_1 }
            - { call: "POST /property-solutions/title-commitments/${tc_id}/liens", payload: { lienholder_name: "HOA Corp", amount_cents: 50000, position: 2 }, as: TitleOfficer, as_user_id: to_1, captures: { lien_id: $.data.id } }
          trigger:
            - { call: "POST /property-solutions/cases/${case_id}/certify-title", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
            - { call: "GET /property-solutions/title-commitments/${tc_id}", as: TitleOfficer, as_user_id: to_1, captures: { tc_v: $.data.version } }
            - { call: "POST /property-solutions/title-commitments/${tc_id}/lien-releases", payload: { lien_id: "${lien_id}", settlement_amount_cents: 40000, expected_title_commitment_version: "${tc_v}" }, as: TitleOfficer, as_user_id: to_1, captures: { lien_st: $.data.status } }
            - { call: "POST /property-solutions/cases/${case_id}/certify-title", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { st: $.data.status } }
          assert:
            - "First certify-title (count 1) -> ERR_JUNIOR_LIENS_OUTSTANDING (422); case stays TITLE_REVIEW"
            - "JuniorLien.${lien_id}.status == RELEASED with settlement_amount_cents == 40000; commitment auto-CLEARED (unreleased_lien_count == 0)"
            - "Second certify-title (count 0) -> 200; case status TERMS_NEGOTIATION"

      - name: holdover_grace_day3_vs_day4
        grounds:
          - calculations.holdover_penalty_accrual
          - calculations.final_assistance_settlement
