        grounds:
          - validations[priority=26]
          - errors[ERR_STORAGE_CAPACITY_EXCEEDED]
          - endpoints[POST /nitrogen-ops/storage-assets/{id}/opening-balance]
        distinguishing_aspect: |
          An opening balance of 25000 tons on a 20000-ton tank is 409 ERR_STORAGE_CAPACITY_EXCEEDED and
          nothing is written: opening_balance_tons stays 0 and on_hand_tons stays 0.000, so the same
          ceiling that guards produce and deliver also guards the initial load.
        test_recipe:
          setup:
            - "One plant with one UREA tank of capacity_tons 20000 and no movements."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
