          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_CONTRACTOR_NOT_FOUND]
          - errors[ERR_PLACEMENT_NOT_FOUND]
          - errors[ERR_CREDENTIAL_NOT_FOUND]
