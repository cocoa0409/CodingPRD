  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: auth_precedes_existence_on_a_bogus_product_path
        grounds:
          - validations[priority=1]
          - validations[priority=3]
          - errors[ERR_MISSING_AUTH_CONTEXT]
          - errors[ERR_PRODUCT_NOT_FOUND]
        distinguishing_aspect: "An unauthenticated request naming a product id that was never issued violates both the auth rule and the existence rule, and the auth rule wins because it is priority 1 against priority 3 — the response is 401 and not 404."
        test_recipe:
          setup:
            - "Empty database; the logical clock is untouched at its 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImpactAuditor
          trigger:
            - call: "GET /impact-program/donation-products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NotARole
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_MISSING_AUTH_CONTEXT"
            - "error_id != ERR_PRODUCT_NOT_FOUND"
            - "the identical call carrying a declared role returns 404 ERR_PRODUCT_NOT_FOUND, proving the path really is unresolvable and only the ordering changed the answer"

      - name: state_precedes_capacity_on_a_frozen_season_commit
        grounds:
          - validations[priority=5]
          - validations[priority=15]
          - errors[ERR_SEASON_FROZEN]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: "A commit whose season has already frozen and whose partner also exceeds its capacity ceiling violates the temporal rule at priority 12 and the fiscal rule at priority 15, and the temporal rule wins — so the response is ERR_SEASON_FROZEN and the over-capacity condition is never reached."
        test_recipe:
          setup:
            - "A season is created at 2026-09-01T00:00:00Z and the clock is rolled past freezes_at so it becomes FROZEN."
            - "One APPROVED partner with an ACTIVE profile of 1 unit, and an existing APPROVED allocation of 1 unit that already fills it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q3", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z", freezes_at: "2026-09-15T00:00:00Z" }
