              payload: {}
              as: ProcurementOfficer
            - call: "GET /api/contracts/${ct_id}/option-orders"
              payload: {}
              as: ProcurementOfficer
              captures: { oo_id: $.data.0.id }
            - call: "GET /api/contracts/${ct_id}"
              payload: {}
              as: ProcurementOfficer
              captures: { ct_v: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/option-orders/${oo_id}/exercise"
              payload: { expected_contract_version: "${ct_v}" }
              as: ProcurementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "OptionOrder.${oo_id}.exercised_unit_price_cents remains null"

      - name: warranty_second_review_loop_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WarrantyClaim.APPROVED_to_UNDER_REVIEW, "errors[ERR_REVIEW_LOOP_EXHAUSTED]"]
        distinguishing_aspect: "The APPROVED -> UNDER_REVIEW revision loop is allowed exactly once; a second start-review from APPROVED fails with ERR_REVIEW_LOOP_EXHAUSTED."
        test_recipe:
          setup: ["ACCEPTED bus; claim approved, returned to review once, approved again"]
          setup_api_calls:
