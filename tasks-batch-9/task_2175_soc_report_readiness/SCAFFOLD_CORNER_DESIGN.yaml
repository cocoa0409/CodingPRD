        distinguishing_aspect: "control_ref is unique per engagement_id: a second control with control_ref K-01 on the same engagement is rejected with 409 ERR_DUPLICATE_RESOURCE, while the same control_ref on a different engagement is accepted."
        test_recipe:
          setup:
            - "Two engagements exist; the first already carries control K-01."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "First", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { e1: $.data.id }
            - call: "POST /soc/engagements"
              payload: { client_name: "Second", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { e2: $.data.id }
            - call: "POST /soc/controls"
              payload: { engagement_id: "${e1}", control_ref: "K-01", title: "Access provisioning", frequency: "MONTHLY" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { k1: $.data.id }
          trigger:
            - call: "POST /soc/controls"
              payload: { engagement_id: "${e1}", control_ref: "K-01", title: "Duplicate reference", frequency: "QUARTERLY" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { err: $.data.error_id }
            - call: "POST /soc/controls"
              payload: { engagement_id: "${e2}", control_ref: "K-01", title: "Same ref, other engagement", frequency: "QUARTERLY" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { k2: $.data.id }
          assert:
            - "${err} == ERR_DUPLICATE_RESOURCE with HTTP status 409"
            - "GET /soc/controls?engagement_id=${e1} returns total_count == 1"
            - "Control.${k2}.control_ref == K-01"
            - "Control.${k2}.engagement_id == ${e2}"

