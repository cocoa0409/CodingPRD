              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/sanctions-screenings"
              payload: { sanctions_source_id: "${src_id}", result: "HIT" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { scr_id: $.data.id }
          trigger:
            - call: "POST /sanctions-screenings/${scr_id}/resolve"
              payload: { resolution_note: "false positive confirmed against full SSN" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
            - call: "GET /providers/${p_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { sscore: $.data.sanction_score, cred_status: $.data.credentialing_status }
          assert:
            - "SanctionsScreening.${scr_id}.status == 'RESOLVED'"
            - "Provider.${p_id}.sanction_score == 0"
            - "Provider.${p_id}.credentialing_status == 'PENDING'"
