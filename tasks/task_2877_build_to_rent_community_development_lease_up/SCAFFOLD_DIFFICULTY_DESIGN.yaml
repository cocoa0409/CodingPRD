  - rule_id: priority_pair_validation_conflict
    instances:
      - name: signature_by_unauthorized_role_is_rejected_before_the_draft_lease_state_check
        grounds:
          - validations.priority_20_role_permitted_per_rbac
          - validations.priority_40_declared_transition_state
          - rbac.Household.exclusive_operations
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_INVALID_LEASE_STATE
        distinguishing_aspect: |
          The same request violates authorization (priority 20, ConstructionManager may not sign a
          lease) and lease state (priority 40, the lease is DRAFT and only PENDING_SIGNATURE may be
          signed). The ladder must surface ERR_UNAUTHORIZED / 403 and must not leak the fact that the
          lease is in the wrong state; the control call with the entitled Household caller against the
          same DRAFT lease then yields ERR_INVALID_LEASE_STATE / 409, proving the lower-priority
          violation was present all along and merely masked.
        test_recipe:
          setup:
            - "Community 'Larkfield' with plat APPROVED, posture OPEN and a PUBLISHED DETACHED schedule at 285000."
            - "One SECTIONS_RELEASED housing phase with one AVAILABLE DETACHED homesite."
