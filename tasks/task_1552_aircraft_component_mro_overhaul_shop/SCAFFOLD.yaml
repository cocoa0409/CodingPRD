  - { method: GET, path: "/mro/test-cells/{testCellId}", description: "Get test cell", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: TestCell, side_effects: [] }
  - { method: POST, path: "/mro/test-cells/{id}/bookings", description: "Book cell window (half-open; WO must be READY_FOR_TEST; ATA capability; overlap check)", roles: [CustomerServiceRep], code: 201, input: [work_order_id, start_time, end_time], output: TestCellBooking, side_effects: ["BOOKED; fee_cents computed per-booking rounding"] }
