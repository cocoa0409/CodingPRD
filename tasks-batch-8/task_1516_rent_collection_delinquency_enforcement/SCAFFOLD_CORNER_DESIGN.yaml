        claim_type: envelope_shape
        grounds: ["response_envelope"]
        distinguishing_aspect: "Success responses carry meta.api_request_id/api_request_timestamp + response_type 'object'; failures carry response_type 'error' with data.error_id and data.message."
        test_recipe:
