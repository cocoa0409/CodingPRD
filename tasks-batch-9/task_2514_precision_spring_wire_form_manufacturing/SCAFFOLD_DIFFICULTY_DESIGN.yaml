            - call: "POST /production-runs/${run_id}/fai"
              payload: { characteristic_id: "${cc_id}", measurements: [23.95, 24.00, 24.05] }
              as: QualityInspector
              as_user_id: "qi-01"
            - call: "POST /production-runs/${run_id}/fai-disposition"
              payload: { decision: "ACCEPT" }
              as: QualityInspector
              as_user_id: "qi-02"
            - call: "POST /stress-relief-ovens"
              payload: { oven_code: "OV-3", capacity_kg: 250.0, max_temp_c: 450.0 }
