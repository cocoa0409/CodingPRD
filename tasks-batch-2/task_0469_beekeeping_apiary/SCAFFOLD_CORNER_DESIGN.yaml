          trigger:
            - call: "POST /honey-lots"
              payload: { apiary_id: "${ap_id}", lot_code: "L1", floral_source: "BANANA" }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

  # =========================================================================
  # RBAC — peer-role denials, ownership enforcement
  # =========================================================================
  - section: rbac
    instances:
      - name: contract_coordinator_cannot_create_hive_forbidden
        claim_type: role_denial
        grounds:
          - roles.ContractCoordinator
          - roles.ApiaryManager
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "POST /hives is an ApiaryManager exclusive op; a ContractCoordinator calling it returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Apiary CA exists."]
          setup_api_calls:
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ContractCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"

      - name: apiary_manager_cannot_act_on_other_apiarys_hive
        claim_type: ownership_denial
        grounds:
          - roles.ApiaryManager
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "An ApiaryManager whose X-User-ID is apiary A2 calling POST /hives/{id}/quarantine on a hive owned by apiary A1 returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Apiary A1 with hive H1; Apiary A2 (different identity)."]
          setup_api_calls:
            - call: "POST /apiaries"
              payload: { name: "A1", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { a1_id: $.data.id }
            - call: "POST /apiaries"
              payload: { name: "A2", state_code: "CA", latitude: 38.6, longitude: -121.6, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { a2_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${a1_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${a1_id}"
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /hives/${h1_id}/quarantine"
              payload: {}
              as: ApiaryManager
              as_user_id: "${a2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: unauthenticated
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no/unknown X-User-Role returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /apiaries"
              payload: {}
              as: NoSuchRole
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"

      - name: state_apiarist_approve_exclusive_to_role
        claim_type: role_denial
        grounds:
          - roles.StateApiarist
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Registration approve is StateApiarist-exclusive; a ContractCoordinator approving returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Apiary CA with a PENDING registration; clock within window."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations"
              payload: { registration_number: "CA-001", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }
              as: StateApiarist
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /apiaries/${ap_id}/registrations/${reg_id}/approve"
              payload: {}
              as: ContractCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"

  # =========================================================================
  # Cross-cutting complexity layers — OCC, FK reverse-reach, derived reconciliation
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_contract_version_on_placement_confirm
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[placement-confirm-stale-contract]
          - errors[ERR_STALE_CONTRACT_VERSION]
          - entities.PollinationContract.fields.version
        distinguishing_aspect: "Confirming placement P2 with expected_contract_version equal to the version observed BEFORE P1's confirm (which bumped the contract version) returns ERR_STALE_CONTRACT_VERSION (412)."
        test_recipe:
          setup: ["Clock 2026-01-06; Apiary CA ACTIVE-registered; two inspected hives H1,H2; Contract C1 SIGNED max_hives_on_site=4 required 2; placements P1,P2 PROPOSED; P1 then CONFIRMED bumping contract version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations"
              payload: { registration_number: "CA-001", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }
              as: StateApiarist
              captures: { reg_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations/${reg_id}/approve"
              payload: {}
              as: StateApiarist
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /hives/${h1_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H2", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h2_id: $.data.id }
            - call: "POST /hives/${h2_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /pollination-contracts"
              payload: { grower_name: "A", orchard_state_code: "CA", bloom_start: "2026-02-04T00:00:00Z", bloom_end: "2026-03-06T00:00:00Z", required_strong_hives: 2, max_hives_on_site: 4, base_rate_cents: 20000 }
              as: ContractCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /pollination-contracts/${c1_id}/sign"
              payload: {}
              as: ContractCoordinator
              captures: { c1_v_stale: $.data.version }
            - call: "POST /pollination-contracts/${c1_id}/placements"
              payload: { hive_id: "${h1_id}", placement_start: "2026-02-04T00:00:00Z", removal_due: "2026-03-06T00:00:00Z" }
              as: ContractCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /pollination-contracts/${c1_id}/placements"
              payload: { hive_id: "${h2_id}", placement_start: "2026-02-04T00:00:00Z", removal_due: "2026-03-06T00:00:00Z" }
              as: ContractCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /hive-placements/${p1_id}/confirm"
              payload: { expected_contract_version: "${c1_v_stale}" }
              as: ContractCoordinator
          trigger:
            - call: "POST /hive-placements/${p2_id}/confirm"
              payload: { expected_contract_version: "${c1_v_stale}" }
              as: ContractCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_CONTRACT_VERSION"
            - "HivePlacement.${p2_id}.status == PROPOSED"

      - name: occ_correct_contract_version_confirm_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[placement-confirm-stale-contract]
          - entities.PollinationContract.fields.version
          - state_machines.HivePlacement.PROPOSED_to_CONFIRMED
        distinguishing_aspect: "Confirming with the current expected_contract_version succeeds and increments PollinationContract.version by 1 (the OCC happy path)."
        test_recipe:
          setup: ["Clock 2026-01-06; Apiary CA ACTIVE-registered; Hive H1 inspected; Contract C1 SIGNED; placement P1 PROPOSED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations"
              payload: { registration_number: "CA-001", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }
              as: StateApiarist
              captures: { reg_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations/${reg_id}/approve"
              payload: {}
              as: StateApiarist
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /hives/${h1_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /pollination-contracts"
              payload: { grower_name: "A", orchard_state_code: "CA", bloom_start: "2026-02-04T00:00:00Z", bloom_end: "2026-03-06T00:00:00Z", required_strong_hives: 1, max_hives_on_site: 4, base_rate_cents: 20000 }
              as: ContractCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /pollination-contracts/${c1_id}/sign"
              payload: {}
              as: ContractCoordinator
              captures: { c1_v0: $.data.version }
            - call: "POST /pollination-contracts/${c1_id}/placements"
              payload: { hive_id: "${h1_id}", placement_start: "2026-02-04T00:00:00Z", removal_due: "2026-03-06T00:00:00Z" }
              as: ContractCoordinator
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /hive-placements/${p1_id}/confirm"
              payload: { expected_contract_version: "${c1_v0}" }
              as: ContractCoordinator
              captures: { pst: $.data.status }
            - call: "GET /pollination-contracts/${c1_id}"
              payload: {}
              as: ContractCoordinator
              captures: { newv: $.data.version }
          assert:
            - "HivePlacement.${p1_id}.status == CONFIRMED"
            - "PollinationContract.${c1_id}.version == ${c1_v0} + 1"

      - name: fk_reverse_reachability_inspections_by_hive
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Inspection.fields.hive_id
          - endpoints
        distinguishing_aspect: "GET /hives/{id}/inspections returns the Inspection[] created under a hive (FK reverse-reachability for Inspection.hive_id), since cascade/append-only children are not in any create-response collection otherwise."
        test_recipe:
          setup: ["Apiary CA; Hive H1 with one inspection."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /hives/${h1_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
          trigger:
            - call: "GET /hives/${h1_id}/inspections"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
          assert:
            - "response total_count == 1"
            - "data[0].hive_id == ${h1_id}"

      - name: cascade_deadout_depth_excluded_difficulty
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Hive.health_status=ANY_NON_DEADOUT_to_health_status=DEADOUT
        excluded_because:
          difficulty_instance: transitive_cascade / deadout_cascade_hive_to_placement_to_contract_understaffed
          rationale: "The full depth-3 deadout cascade is exercised by the named §1.8 difficulty instance."

  # =========================================================================
  # Consistency model — immediate visibility
  # =========================================================================
  - section: consistency_model
    instances:
      - name: harvest_debit_visible_immediately_same_request
        claim_type: immediate
        grounds:
          - entities.HoneyLot.fields.gross_weight_kg
          - endpoints
        distinguishing_aspect: "POST /honey-lots/{id}/harvests returns the new Harvest, and an immediate GET /honey-lots/{id} reflects the gross_weight credit in the same logical step (immediate consistency)."
        test_recipe:
          setup: ["Apiary CA; Hive H1; HoneyLot L1 DRAFT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 6 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /honey-lots"
              payload: { apiary_id: "${ap_id}", lot_code: "L1", floral_source: "WILDFLOWER" }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /honey-lots/${l1_id}/harvests"
              payload: { hive_id: "${h1_id}", frames_pulled: 5, weight_kg: 15.0 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "GET /honey-lots/${l1_id}"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { gw: $.data.gross_weight_kg }
          assert:
            - "HoneyLot.${l1_id}.gross_weight_kg == 15.0"
