              as_user_id: "${ev_id}"
            - call: "POST /observations/${obs2_id}/submit"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "GET /evaluation-cycles/${cyc_id}"
              payload: {}
              as: HrAdmin
              captures: { cv1: $.data.version }
            - call: "POST /growth-measures"
              payload: { cycle_id: "${cyc_id}", measure_code: "STATE_ASSESSMENT", index_value: 1.51, coverage_pct: 100, expected_cycle_version: "${cv1}" }
              as: HrAdmin
              captures: { gm_id: $.data.id }
            - call: "POST /growth-measures/${gm_id}/certify"
              payload: {}
              as: HrAdmin
            - call: "POST /evaluation-cycles/${cyc_id}/submit"
              payload: {}
