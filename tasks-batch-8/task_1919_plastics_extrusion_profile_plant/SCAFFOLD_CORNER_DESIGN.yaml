              captures: { run: $.data.id }
            - { call: "POST /spc-samples", payload: { run_id: "${run}", dimension_name: "wall", measurements: [2.0, 2.02, 1.98] }, as: LineOperator }
            - { call: "POST /spc-samples", payload: { run_id: "${run}", dimension_name: "wall", measurements: [2.01, 1.99, 2.0] }, as: LineOperator }
          trigger:
            - call: "POST /runs/${run}/complete"
              payload: { good_length_mm: 4000000, good_weight_kg: 3000, trim_scrap_kg: 50 }
              as: LineOperator
              captures: { rg: $.data.regrind_lot_id }
            - { call: "GET /resin-lots/${rg}", payload: {}, as: LineOperator }
          assert:
            - "ProductionRun.${run}.regrind_lot_id is not null"
            - "ResinLot.${rg}.lot_kind == REGRIND, resin_type == PVC, color_family == RED"
            - "ResinLot.${rg}.received_kg == 50 and status == QC_PASSED and supplier_lot_ref == 'INHOUSE-' + run id"

      - name: exposure_reconciled_on_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.customer_open_exposure
          - state_machines.WorkOrder.CONFIRMED_to_CANCELLED
        distinguishing_aspect: "Customer.open_exposure_cents rises to 5,000,000 on confirm and returns to 0 on cancel — the derived aggregate tracks source mutations in both directions."
        test_recipe:
          setup: ["Order confirmed (exposure 5,000,000)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-06", index_cents_per_kg: 100.0 }, as: PlantManager }
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof}", die_code: "D-A", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die: $.data.id }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-RED25", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo: $.data.id }
            - { call: "POST /work-orders/${wo}/confirm", payload: {}, as: SalesEngineer }
          trigger:
            - { call: "POST /work-orders/${wo}/cancel", payload: {}, as: SalesEngineer }
            - { call: "GET /customers/${cust}", payload: {}, as: PlantManager }
          assert:
            - "Before cancel: Customer.${cust}.open_exposure_cents == 5000000"
            - "After cancel: open_exposure_cents == 0 and WorkOrder.${wo}.status == CANCELLED"

  - section: endpoints
    instances:
      - name: run_create_side_effects
        claim_type: side_effect_execution
        grounds:
          - endpoints
          - state_machines.BlendBatch.QC_RELEASED_to_CONSUMED
          - state_machines.ExtrusionLine.SETUP_to_RUNNING
          - state_machines.WorkOrder.SCHEDULED_to_IN_PRODUCTION
        distinguishing_aspect: "A single POST /runs applies all three declared side effects: batch CONSUMED, line RUNNING, order IN_PRODUCTION — verified via independent GETs."
        test_recipe:
          setup: ["Assignment ACTIVE with released batch (order SCHEDULED, line SETUP)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlantManager }
