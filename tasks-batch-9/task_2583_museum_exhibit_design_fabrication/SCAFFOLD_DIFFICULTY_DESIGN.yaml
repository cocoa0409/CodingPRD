      - name: the_deadline_instant_belongs_to_the_sweep_and_not_to_the_voter
        grounds:
          - validations.priority_46
          - validations.priority_35
          - state_machines.ReviewRound.OPEN_to_REVISION_REQUESTED
          - entities.ReviewRound.fields.swept_by_deadline
        distinguishing_aspect: |
          decision_deadline_at is a single instant that two rules read in
          opposite directions: a vote is accepted only while now is STRICTLY
          before it, and the sweep fires when now is >= it. At exactly
          2026-08-15T00:00:00Z both readings are exercised by the same clock
          value - the vote must be refused and the sweep must fire. One second
          earlier neither happens. The round-creation rule uses the same strict
          comparison from the other side, so a deadline equal to the current
          instant is refused outright. An implementation using > for the sweep
          and >= for the vote leaves the round permanently undecidable.
        test_recipe:
          setup:
            - "project in phase DESIGN_DEV; DESIGN_DEV package pkg2 IN_REVIEW with round 1, panel of three so required_vote_count is 2, decision_deadline_at 2026-08-15T00:00:00Z"
            - "one APPROVE vote already cast by cur-01, so cast_vote_count is 1 and the round is one vote short of quorum"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
