  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: seasonal_capacity_conservation_on_book_cancel
        grounds:
          - calculations.seasonal_capacity_consumption
          - state_machines.FlightSlot.BOOKED_to_CANCELLED_CLIENT
        distinguishing_aspect: |
          Conserved quantity: SeasonalCapacity.hours_committed. Forward
          action (book slot) adds N hours; compensating action (cancel_by_
