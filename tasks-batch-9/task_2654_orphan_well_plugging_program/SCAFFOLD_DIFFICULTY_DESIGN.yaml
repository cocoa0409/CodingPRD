  - rule_id: boundary_precision_check
    instances:
      - name: de_minimis_boe_exactly_at_180_passes_and_180_17_fails
        grounds:
          - calculations.orphan_classification_criteria
          - entities.Well.fields.cumulative_boe_60mo
          - entities.ProductionRecord.fields.gas_mcf
          - validations[priority=55]
          - errors.ERR_ORPHAN_CRITERIA_NOT_MET
        distinguishing_aspect: |
          150 bbl oil plus 180 mcf gas gives cumulative_boe_60mo exactly 180.00, which satisfies the
          inclusive <= 180.00 de-minimis test, while 150 bbl plus 181 mcf gives 180.17 (181/6 =
          30.1666... summed unrounded then rounded once) and fails - a one-mcf, 0.17-boe difference
          flips CONFIRM from success to ERR_ORPHAN_CRITERIA_NOT_MET.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "Operator 'Twin Buttes Gas' tier INDIVIDUAL, bond 5000000"
            - "Well WA and Well WB, both 2500 ft with methane 250 / groundwater 40 / population 8 / surface 2.0 so screening_score == 59.90, both with last_production_month 2024-01 so idle_months == 31"
            - "WA has one ProductionRecord for 2024-01 with 150 bbl and 180 mcf; WB has one for 2024-01 with 150 bbl and 181 mcf"
            - "both wells have a SUBMITTED OrphanDetermination"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Twin Buttes Gas", region_code: "NM", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "30-001-00900", operator_id: "${op_id}", spud_year: 1981, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0, last_production_month: "2024-01" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { wa_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "30-001-00901", operator_id: "${op_id}", spud_year: 1981, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0, last_production_month: "2024-01" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { wb_id: $.data.id }
            - call: "POST /wells/${wa_id}/production-records"
              payload: { month: "2024-01", oil_bbl: 150, gas_mcf: 180 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells/${wb_id}/production-records"
              payload: { month: "2024-01", oil_bbl: 150, gas_mcf: 181 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "GET /wells/${wa_id}"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { wa_v: $.data.version }
            - call: "POST /wells/${wa_id}/orphan-determinations"
              payload: { inspector_notes: "de-minimis production only", expected_well_version: "${wa_v}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { det_a_id: $.data.id }
            - call: "POST /orphan-determinations/${det_a_id}/submit"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "GET /wells/${wb_id}"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { wb_v: $.data.version }
            - call: "POST /wells/${wb_id}/orphan-determinations"
              payload: { inspector_notes: "marginal production", expected_well_version: "${wb_v}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { det_b_id: $.data.id }
            - call: "POST /orphan-determinations/${det_b_id}/submit"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
          trigger:
            - call: "POST /orphan-determinations/${det_a_id}/decision"
              payload: { action: "CONFIRM", rationale: "exactly at the de-minimis boundary" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
            - call: "POST /orphan-determinations/${det_b_id}/decision"
              payload: { action: "CONFIRM", rationale: "one mcf over the boundary" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
          assert:
            - "Well.${wa_id}.cumulative_boe_60mo == 180.00 and Well.${wb_id}.cumulative_boe_60mo == 180.17"
            - "Well.${wa_id}.idle_months == 31 and Well.${wb_id}.idle_months == 31"
            - "the WA decision returns HTTP 200; OrphanDetermination.${det_a_id}.status == CONFIRMED and Well.${wa_id}.status == ORPHAN_CONFIRMED"
            - "the WB decision returns HTTP 422 with error_id ERR_ORPHAN_CRITERIA_NOT_MET"
            - "OrphanDetermination.${det_b_id}.status == SUBMITTED and Well.${wb_id}.status == ORPHAN_CANDIDATE"
            - "Operator.${op_id}.orphan_candidate_count == 1"
      - name: bond_exactly_equal_to_requirement_is_compliant_one_cent_short_is_delinquent
        grounds:
          - calculations.operator_financial_assurance_requirement
          - state_machines.Operator.ACTIVE_to_DELINQUENT
          - entities.Operator.fields.bond_amount_cents
          - entities.Operator.fields.required_bond_cents
        distinguishing_aspect: |
          The deficiency test is strict (bond_amount_cents < required_bond_cents): an operator posting
          exactly 1250000 against a 1250000 requirement stays ACTIVE, while an operator posting
          1249999 against the same requirement flips to DELINQUENT - a one-cent difference on the
          equality boundary, on a different entity and calculation than the de-minimis instance.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "Operator EQ tier INDIVIDUAL with bond_amount_cents 1250000 and one 2500 ft well (required 250000, ACTIVE)"
            - "Operator SHORT tier INDIVIDUAL with bond_amount_cents 1249999 and one 2500 ft well (required 250000, ACTIVE)"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Equal Bond Operating", region_code: "TX", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 1250000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { eq_id: $.data.id }
            - call: "POST /operators"
              payload: { name: "One Cent Short Operating", region_code: "TX", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 1249999 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { short_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "42-001-01000", operator_id: "${eq_id}", spud_year: 1981, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 50, groundwater_depth_ft: 600, population_within_1000ft: 1, surface_disturbance_acres: 0.5 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells"
              payload: { api_well_number: "42-001-01001", operator_id: "${short_id}", spud_year: 1981, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 50, groundwater_depth_ft: 600, population_within_1000ft: 1, surface_disturbance_acres: 0.5 }
              as: FieldInspector
              as_user_id: "u_insp"
          trigger:
            - call: "POST /wells"
              payload: { api_well_number: "42-001-01002", operator_id: "${eq_id}", spud_year: 1969, total_depth_ft: 8000, casing_strings: 3, methane_scfd: 310, groundwater_depth_ft: 180, population_within_1000ft: 3, surface_disturbance_acres: 1.25 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells"
              payload: { api_well_number: "42-001-01003", operator_id: "${short_id}", spud_year: 1969, total_depth_ft: 8000, casing_strings: 3, methane_scfd: 310, groundwater_depth_ft: 180, population_within_1000ft: 3, surface_disturbance_acres: 1.25 }
              as: FieldInspector
              as_user_id: "u_insp"
          assert:
            - "before the trigger Operator.${eq_id}.required_bond_cents == 250000 and status == ACTIVE"
            - "before the trigger Operator.${short_id}.required_bond_cents == 250000 and status == ACTIVE"
            - "Operator.${eq_id}.required_bond_cents == 1250000 and status == ACTIVE (1250000 is not < 1250000)"
            - "Operator.${short_id}.required_bond_cents == 1250000 and status == DELINQUENT (1249999 < 1250000)"
            - "Operator.${eq_id}.active_well_count == 2 and Operator.${short_id}.active_well_count == 2"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: job_mobilization_gated_by_site_access_state_on_a_different_entity
        grounds:
          - state_machines.PluggingJob.SCHEDULED_to_MOBILIZED
          - state_machines.SiteAccess.REQUESTED_to_ENTRY_ORDERED
          - state_machines.Well.ACCESS_PENDING_to_ENTRY_ORDERED
          - validations[priority=50]
          - validations[priority=51]
        distinguishing_aspect: |
          The PluggingJob SCHEDULED -> MOBILIZED edge is blocked by the state of a SiteAccess row on
          the Well (access_status ACCESS_PENDING), not by anything on the PluggingJob itself; resolving
          the SiteAccess to ENTRY_ORDERED - which itself requires the statutory notice window to have
          closed - is what unblocks the job.
