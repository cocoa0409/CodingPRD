              as_user_id: "analyst-01"
          assert:
            - "AT SHIP: reserve_initial_cents 90000 == reserve_held_cents 90000 + reserve_liquidated_cents 0, reserve_status == HELD, status == SHIPPED"
            - "AFTER 0.4000: 90000 == 54000 + 36000, reserve_status == PARTIALLY_LIQUIDATED, status is still SHIPPED — the fulfilment axis does not move on a partial liquidation"
            - "AFTER 0.6000: round_half_up(90000 * 0.6000) == 54000 which exactly equals reserve_held_cents, so the cumulative liquidation reaches reserve_initial_cents: 90000 == 0 + 90000, reserve_status == LIQUIDATED and status == RECONCILED"
