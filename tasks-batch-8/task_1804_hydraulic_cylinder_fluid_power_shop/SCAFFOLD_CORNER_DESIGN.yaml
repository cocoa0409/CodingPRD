        distinguishing_aspect: "A call with no X-User-Role/X-User-ID headers fails ERR_UNAUTHENTICATED (401) even on a valid endpoint with a valid body — priority 2 precedes role and existence checks."
        test_recipe:
          setup: ["shop exists"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
