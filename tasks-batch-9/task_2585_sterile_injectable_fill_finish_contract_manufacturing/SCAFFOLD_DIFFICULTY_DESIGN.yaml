      - name: fill_weight_deviation_half_up_tie_and_strict_reject_boundary
        grounds:
          - calculations.in_process_check_result
          - entities.InProcessCheck.fields.max_absolute_deviation_pct
          - entities.InProcessCheck.fields.result
          - entities.ClientProject.fields.target_fill_weight_mg
        distinguishing_aspect: |
          Four FILL_WEIGHT rows on the same batch pin the exact rounding contract of
          max_absolute_deviation_pct: the deviation is rounded to 4 decimals with round_half_up
          BEFORE the tolerance comparisons, and the two comparisons have OPPOSITE strictness.
          599/20000 = 0.029950 is an exact decimal tie that must round UP to 0.0300 and therefore
          ALERT (a naive truncation, 2-decimal rounding, or banker's rounding yields 0.0299 and
          PASS), while 1000/20000 = 0.0500 sits exactly on FILL_WEIGHT_REJECT_TOL and must stay
          ALERT because that comparison is strict `>`. Only 1020/20000 = 0.0510 FAILs. The
          formula's `max over w` is also exercised with the maximum deviation NOT in the last
          position.
