              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-06T00:00:00Z" }
              as: ContentManager
              captures: { b3_id: $.data.id, b3_state: $.data.state }
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-05T12:00:00Z" }
              as: ContentManager
              captures: { b2_id: $.data.id, b2_ver: $.data.version }
