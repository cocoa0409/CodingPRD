            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-16T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan_y}", to_member_id: "${m_b}", transfer_type: "BENEFICIAL", effective_date: "2026-01-05T00:00:00Z", idempotency_key: "k-bnd-y", expected_loan_version: "${loan_y_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { tr_y: $.data.id }
          assert:
            - "Transfer.${tr_x}.days_late == 0 and late_fee_cents == 0 (deadline day is on time)"
            - "Transfer.${tr_y}.days_late == 1 and late_fee_cents == 2500 (one day past the deadline enters tier 1)"
            - "both transfers are CONFIRMED; only the day-11 report carries a fee"

      - name: borrower_inquiry_min_checkdigit_last_digit_rejects
        grounds:
          - calculations.min_check_digit
          - endpoints.GET_/registry/borrower-inquiries/{min}
          - errors.ERR_LOAN_NOT_FOUND
        distinguishing_aspect: |
          Metric: the MIN string itself on the borrower-inquiry endpoint (a
          different metric and endpoint than days_late). A MIN differing only
          in the 18th check digit (…130 vs the valid …130 payload's digit 0)
          must be rejected — the boundary is a single digit position at the end
          of an 18-digit identifier, and a valid prefix with a wrong check
          digit is 404, never a partial match.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Member A (org 1000000) ACTIVE with signer; registers one TX loan (serial 1 -> min 100000000000000016)."
          setup_api_calls:
