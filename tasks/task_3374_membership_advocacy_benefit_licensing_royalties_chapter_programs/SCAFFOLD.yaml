# =============================================================================
# SCAFFOLD.yaml — Membership Advocacy, Benefit Licensing Royalties &
# Chapter Programs (task_3374)
# §1.0–§1.7 only. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Membership Advocacy, Benefit Licensing Royalties & Chapter Programs (AARP): membership enrollment with age eligibility, household membership and multi-year pricing with automatic renewal, benefit provider licensing where insurers and service companies pay royalties to use the brand and reach members, provider oversight to ensure member-facing quality and complaint handling on licensed products, separation between the membership organization, its foundation and its lobbying activity with governance and accounting boundaries, publication distribution to members with advertising standards and circulation obligations, local chapter and volunteer program administration with tax preparation and driver safety courses, advocacy campaign operations at federal and state levels with member mobilization, member data usage restrictions in benefit marketing

domain_name: membership-advocacy-licensing
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit        # legal-entity fund separation, SoD approvals, audit invariants
  secondary_archetype: pricing_engine        # multi-year household pricing, tiered royalties, ad rate cards
  complexity_layers:
    - optimistic_concurrency                 # OCC on Provider.version and LicenseAgreement.version
    - cascading_side_effects                 # complaint escalation -> agreement probation -> provider suspension -> sibling probation
    - rate_threshold_triggers                # escalation-count thresholds, governance caps, capacity gates
    - scheduled_actions                      # logical clock + deferred auto-renewal batch sweep
  entity_topology: flat                      # peer entities joined by foreign keys; no nested creation trees
  state_machine_shape: cyclic                # LicenseAgreement ACTIVE<->PROBATION, Provider LICENSED<->SUSPENDED
  relationship_patterns:
    - one_to_many                            # Provider->Agreement->Statement; Household->Member/Term
    - cross_aggregate                        # FundTransfer spans LegalEntity boundary; Complaint spans Member x Agreement
  role_model: segregation_of_duties          # transfer requester != approver; provider reports, controller finalizes
  consistency_model: immediate               # all mutations + cascades visible in the same response / next read

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of the household's primary residence" }
      - { name: auto_renew_enabled, type: boolean, source: input, default: false, description: "When true, expiring ACTIVE terms are renewed automatically by the renewal batch" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | LAPSED — ACTIVE iff some MembershipTerm of this household covers the current clock date; see household_standing calculation" }
      - { name: primary_member_id, type: string, source: system, description: "id of the PRIMARY Member created atomically with the household" }
      - { name: secondary_member_id, type: string, source: system, description: "id of the optional SECONDARY Member; null when the household was created without one" }
      - { name: lifetime_collected_cents, type: integer, source: computed, default: 0, description: "Sum of paid_cents over all terms ever purchased by this household" }
      - { name: lifetime_refunded_cents, type: integer, source: computed, default: 0, description: "Sum of refunded_cents over all CANCELLED terms of this household" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; owning household (members are created only via POST /households)" }
      - { name: full_name, type: string, source: input, description: "Member's legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD); PRIMARY members must be >= 50 years old at enrollment" }
      - { name: role_in_household, type: enum, source: system, description: "PRIMARY | SECONDARY — derived from which creation slot the member occupies" }
      - { name: benefit_marketing_opt_out, type: boolean, source: input, default: false, description: "When true the member is excluded from every mobilization audience snapshot" }
      - { name: age_years, type: integer, source: computed, description: "Whole years between date_of_birth and the logical clock; a birthday falling exactly on the clock date counts as reached" }
      - { name: in_good_standing, type: boolean, source: computed, description: "True iff the member's Household.status == ACTIVE; recomputed whenever household standing recomputes" }

  - name: MembershipTerm
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; household that owns this term" }
      - { name: term_years, type: integer, source: input, description: "Term length; must be one of 1, 3, 5" }
      - { name: is_renewal, type: boolean, source: system, description: "True when created by the renewal batch; false for the initial purchase at household creation" }
      - { name: start_date, type: string, source: system, description: "ISO date; clock date at purchase, or the previous term's end_date for renewals" }
      - { name: end_date, type: string, source: computed, description: "ISO date; start_date advanced by term_years years. Coverage is half-open [start_date, end_date)" }
      - { name: purchased_at, type: datetime, source: system, description: "Logical-clock timestamp of purchase" }
      - { name: paid_cents, type: integer, source: computed, description: "Price charged, from membership_term_pricing" }
      - { name: refunded_cents, type: integer, source: system, default: 0, description: "Refund issued by cancellation; 0 until cancelled" }
      - { name: cancel_reason, type: enum, source: system, description: "VOLUNTARY | DECEASED; null until cancelled. Selects the refund variant" }
      - { name: cancelled_at, type: datetime, source: system, description: "Logical-clock timestamp of cancellation; null until cancelled" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RENEWED | LAPSED | CANCELLED" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the insurer or service company" }
      - { name: status, type: enum, source: system, description: "APPLICANT -> LICENSED <-> SUSPENDED. SUSPENDED is reached only by the escalation cascade; re-admission via POST admit" }
      - { name: royalty_balance_cents, type: integer, source: system, default: 0, description: "Running royalty ledger: +provisional_royalty_cents on statement submission, +delta_cents on finalize" }
      - { name: escalations_trailing_12mo, type: integer, source: computed, description: "Count of this provider's complaints with status ESCALATED and escalated_at >= clock - 365 days (inclusive)" }

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; licensing counterparty (path parameter of the creation endpoint)" }
      - { name: product_category, type: enum, source: input, description: "INSURANCE_HEALTH | INSURANCE_AUTO | INSURANCE_LIFE | FINANCIAL_SERVICES | TRAVEL_SERVICES | HOME_SERVICES" }
      - { name: effective_from, type: string, source: input, description: "ISO date the licensing window opens" }
      - { name: effective_to, type: string, source: input, description: "ISO date the licensing window closes; must be strictly after effective_from" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE <-> PROBATION -> TERMINATED" }
      - { name: probation_count, type: integer, source: system, default: 0, description: "How many times this agreement has entered PROBATION (manual or automatic)" }
      - { name: escalations_trailing_12mo, type: integer, source: computed, description: "Count of this agreement's complaints with status ESCALATED and escalated_at >= clock - 365 days (inclusive)" }
      - { name: recognized_royalty_cents, type: integer, source: system, default: 0, description: "Sum of final_royalty_cents over this agreement's FINALIZED statements" }
      - { name: provisional_outstanding_cents, type: integer, source: system, default: 0, description: "Sum of provisional_royalty_cents over this agreement's PROVISIONAL statements" }
      - { name: royalty_exposure_cents, type: integer, source: computed, description: "recognized_royalty_cents + provisional_outstanding_cents; invariant: equals provider.royalty_balance_cents contribution of this agreement" }

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - { name: license_agreement_id, type: string, source: system, description: "FK -> LicenseAgreement.id; agreement this statement reports against (path parameter)" }
      - { name: period_year, type: integer, source: input, description: "Calendar year of the reporting quarter, e.g. 2026" }
      - { name: period_quarter, type: integer, source: input, description: "Quarter number 1-4" }
      - { name: reported_sales_cents, type: integer, source: input, description: "Provider-reported gross licensed-product sales for the quarter" }
      - { name: audited_sales_cents, type: integer, source: input, description: "Audited sales figure supplied at finalize; null while PROVISIONAL" }
      - { name: provisional_royalty_cents, type: integer, source: computed, description: "Royalty on reported_sales_cents via royalty_marginal_tiers at submission" }
      - { name: final_royalty_cents, type: integer, source: computed, description: "Royalty recomputed on audited_sales_cents at finalize; null while PROVISIONAL" }
      - { name: delta_cents, type: integer, source: computed, description: "final_royalty_cents - provisional_royalty_cents posted to provider ledger at finalize; null while PROVISIONAL" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL -> FINALIZED | SUPERSEDED" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; complaining member (must equal X-User-ID for the Member role)" }
      - { name: license_agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id; the licensed product's agreement" }
      - { name: category, type: enum, source: input, description: "PRODUCT_QUALITY | BILLING | SERVICE | CLAIMS" }
      - { name: severity, type: enum, source: input, description: "LOW | HIGH" }
      - { name: description, type: string, source: input, description: "Free-text complaint narrative" }
      - { name: status, type: enum, source: system, description: "FILED -> UNDER_REVIEW -> RESOLVED | ESCALATED -> RESOLVED" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp of filing" }
      - { name: escalated_at, type: datetime, source: system, description: "Logical-clock timestamp of escalation; null until escalated. Drives trailing-365-day thresholds" }
      - { name: resolution_code, type: string, source: input, description: "Resolution code recorded on RESOLVE; optional" }

  - name: LegalEntity
    parent: null
    common_fields: true
    fields:
      - { name: kind, type: enum, source: input, description: "MEMBERSHIP_ORG | FOUNDATION | LOBBY_ARM; at most one entity per kind" }
      - { name: display_name, type: string, source: input, description: "Human-readable entity name" }
      - { name: balance_cents, type: integer, source: input, description: "Opening balance at creation; afterwards mutated only by EXECUTED fund transfers" }

  - name: FundTransfer
    parent: null
    common_fields: true
    fields:
      - { name: from_entity_id, type: string, source: input, description: "FK -> LegalEntity.id; source of funds" }
      - { name: to_entity_id, type: string, source: input, description: "FK -> LegalEntity.id; destination of funds" }
      - { name: amount_cents, type: integer, source: input, description: "Transfer amount; must be >= 1" }
      - { name: purpose, type: string, source: input, description: "Free-text purpose memo" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the GovernanceOfficer who requested the transfer" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceController who approved/rejected; null until decided" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL -> EXECUTED | REJECTED. APPROVE executes atomically (no separate execution step)" }
      - { name: from_balance_after_cents, type: integer, source: computed, description: "Source entity balance immediately after execution; null unless EXECUTED" }
      - { name: to_balance_after_cents, type: integer, source: computed, description: "Destination entity balance immediately after execution; null unless EXECUTED" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp of execution; null unless EXECUTED. Drives calendar-year cap windows" }

  - name: Publication
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Issue title" }
      - { name: publication_date, type: string, source: input, description: "ISO date the issue is distributed" }
      - { name: min_cpm_cents, type: integer, source: input, description: "Rate-card floor: minimum cost-per-thousand impressions an ad booking may be agreed at" }
      - { name: max_cpm_cents, type: integer, source: input, description: "Rate-card ceiling; must be >= min_cpm_cents" }
      - { name: circulation_count, type: integer, source: computed, description: "Distinct households with a term covering publication_date (see circulation_fulfillment); recomputed on every read" }

  - name: AdBooking
    parent: null
    common_fields: true
    fields:
      - { name: publication_id, type: string, source: system, description: "FK -> Publication.id; issue the ad runs in (path parameter)" }
      - { name: advertiser_name, type: string, source: input, description: "Advertiser name as printed on the insertion order" }
      - { name: category, type: enum, source: input, description: "TRAVEL | INSURANCE | HEALTH | FINANCE | RETAIL | TOBACCO | FIREARMS | POLITICAL. TOBACCO/FIREARMS/POLITICAL violate advertising standards" }
      - { name: agreed_cpm_cents, type: integer, source: input, description: "Negotiated cost-per-thousand; must lie within [min_cpm_cents, max_cpm_cents] inclusive" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "round_half_up(agreed_cpm_cents * circulation_count / 1000) evaluated at booking time" }
      - { name: status, type: enum, source: system, description: "BOOKED — standards validation happens at creation, so no review states exist" }

  - name: Chapter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Chapter name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of the chapter" }
      - { name: city, type: string, source: input, description: "City the chapter serves" }

  - name: CourseSession
    parent: null
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; hosting chapter (path parameter)" }
      - { name: course_kind, type: enum, source: input, description: "TAX_PREP | DRIVER_SAFETY" }
      - { name: instructor_name, type: string, source: input, description: "Volunteer instructor name; case-sensitive identity for double-booking checks" }
      - { name: start_time, type: datetime, source: input, description: "Session start (must be in the future at creation)" }
      - { name: end_time, type: datetime, source: input, description: "Session end; must be strictly after start_time" }
      - { name: capacity, type: integer, source: input, description: "Maximum enrollees; must be >= 1" }
      - { name: enrolled_member_ids, type: array, source: system, description: "Member ids enrolled; append-only via the enroll endpoint" }
      - { name: enrolled_count, type: integer, source: computed, description: "len(enrolled_member_ids)" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | HELD — lazily derived from the logical clock: HELD once clock >= end_time" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Campaign title" }
      - { name: level, type: enum, source: input, description: "FEDERAL | STATE" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code; required iff level == STATE, must be absent otherwise" }
      - { name: issue_area, type: string, source: input, description: "Policy issue area, e.g. HEALTHCARE, RETIREMENT" }
      - { name: start_date, type: string, source: input, description: "ISO date the campaign window opens" }
      - { name: end_date, type: string, source: input, description: "ISO date the campaign window closes; must be >= start_date" }
      - { name: sponsor_entity_id, type: string, source: input, description: "FK -> LegalEntity.id; sponsoring entity, whose kind MUST be LOBBY_ARM (advocacy is a lobbying-arm activity)" }
      - { name: computed_status, type: enum, source: computed, description: "UPCOMING | ACTIVE | CLOSED — derived from the logical clock vs [start_date, end_date] inclusive" }

  - name: MobilizationEvent
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; parent campaign (path parameter)" }
      - { name: channel, type: enum, source: input, description: "EMAIL | PHONE | MAIL" }
      - { name: audience_spec, type: object, source: input, description: "Audience filter. Allowed keys: state_code, min_age. Benefit-marketing keys (owns_licensed_product, benefit_product_category, provider_customer) are forbidden; any other key is malformed" }
      - { name: audience_count, type: integer, source: computed, description: "Snapshot at creation: members in good standing, not opted out, matching audience_spec" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Household
    field: status
    derivation: |
      Compound/derived standing, recomputed whenever a term of the household
      changes status or the renewal batch runs:
        ACTIVE iff exists a MembershipTerm t of this household with
          t.status == ACTIVE and t.start_date <= current_clock_date < t.end_date
        otherwise LAPSED.
      member.in_good_standing mirrors Household.status for every member of the
      household (cascading recompute, link 3 of the renewal cascade).

  - entity: MembershipTerm
    initial_state: ACTIVE
    terminal_states: [RENEWED, LAPSED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: RENEWED
        trigger: "POST /api/_batch/renewal_run (system sweep: end_date <= clock date and household.auto_renew_enabled)"
        actor: system
        preconditions:
          - "term.status == ACTIVE and term.end_date <= current clock date"
          - "household.auto_renew_enabled == true"
        side_effects:
          - "a new MembershipTerm is created: is_renewal=true, start_date = old end_date, end_date = start + term_years years, paid_cents from membership_term_pricing with loyalty discount"
          - "household.lifetime_collected_cents += new term paid_cents"
          - "household.status recomputed (stays ACTIVE); member.in_good_standing recomputed (link 3)"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /api/_batch/renewal_run (system sweep: end_date <= clock date and NOT auto_renew_enabled)"
        actor: system
        preconditions:
          - "term.status == ACTIVE and term.end_date <= current clock date"
          - "household.auto_renew_enabled == false"
        side_effects:
          - "household.status recomputed (becomes LAPSED if no other covering term)"
          - "member.in_good_standing recomputed -> false for every member of the household (link 3)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/membership-terms/{id}/cancel"
        actor: MemberServicesAgent
        preconditions:
          - "term.status == ACTIVE (else ERR_TERM_NOT_ACTIVE)"
        side_effects:
          - "refunded_cents computed by membership_cancel_refund (variant selected by reason)"
          - "cancel_reason and cancelled_at recorded"
          - "household.lifetime_refunded_cents += refunded_cents; household.version increments (cascade mutation)"
          - "household.status recomputed (may become LAPSED); member.in_good_standing recomputed"

  - entity: Provider
    initial_state: APPLICANT
    terminal_states: []
    transitions:
      - from: APPLICANT
        to: LICENSED
        trigger: "POST /api/providers/{id}/admit"
        actor: GovernanceOfficer
        preconditions: []
        side_effects:
          - "provider.version increments by 1"
      - from: LICENSED
        to: SUSPENDED
        trigger: "system (escalation cascade: provider-wide escalations_trailing_12mo reaches PROVIDER_SUSPENSION_THRESHOLD)"
        actor: system
        preconditions:
          - "provider.escalations_trailing_12mo >= 5 after the recompute triggered by a complaint escalation"
        side_effects:
          - "provider.version increments by 1"
          - "every ACTIVE LicenseAgreement of this provider transitions to PROBATION (probation_count += 1 each); agreements already in PROBATION or TERMINATED are untouched (conditional cascade)"
      - from: SUSPENDED
        to: LICENSED
        trigger: "POST /api/providers/{id}/admit (re-admission after remediation)"
        actor: GovernanceOfficer
        preconditions:
          - "provider.escalations_trailing_12mo < 5 at readmission time (else ERR_REINSTATE_BLOCKED)"
        side_effects:
          - "provider.version increments by 1"
          - "agreements in PROBATION are NOT auto-reinstated; each needs its own REINSTATE action"

  - entity: LicenseAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/license-agreements/{id}/transitions (action=ACTIVATE)"
        actor: GovernanceOfficer
        preconditions:
          - "provider.status == LICENSED (else ERR_PROVIDER_NOT_LICENSED)"
          - "effective_from <= clock date <= effective_to (else ERR_AGREEMENT_NOT_IN_WINDOW)"
          - "no other ACTIVE agreement exists for (provider_id, product_category) (else ERR_DUPLICATE_CATEGORY_AGREEMENT)"
        side_effects:
          - "agreement.version increments by 1"
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /api/license-agreements/{id}/transitions (action=PROBATE) OR system (escalation cascade: agreement escalations_trailing_12mo >= 3)"
        actor: OversightAnalyst | system
        preconditions:
          - "manual: none beyond state; automatic: escalations_trailing_12mo >= 3 after recompute"
        side_effects:
          - "probation_count += 1"
          - "agreement.version increments by 1"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /api/license-agreements/{id}/transitions (action=REINSTATE)"
        actor: OversightAnalyst
        preconditions:
          - "provider.status == LICENSED (else ERR_PROVIDER_NOT_LICENSED)"
          - "agreement.escalations_trailing_12mo < 3 (else ERR_REINSTATE_BLOCKED)"
        side_effects:
          - "agreement.version increments by 1"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /api/license-agreements/{id}/transitions (action=TERMINATE)"
        actor: GovernanceOfficer
        preconditions: []
        side_effects:
          - "agreement.version increments by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/license-agreements/{id}/transitions (action=TERMINATE)"
        actor: GovernanceOfficer
        preconditions: []
        side_effects:
          - "agreement.version increments by 1"
      - from: PROBATION
        to: TERMINATED
        trigger: "POST /api/license-agreements/{id}/transitions (action=TERMINATE)"
        actor: GovernanceOfficer
        preconditions: []
        side_effects:
          - "agreement.version increments by 1"

  - entity: RoyaltyStatement
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /api/royalty-statements/{id}/finalize"
        actor: FinanceController
        preconditions:
          - "statement.status == PROVISIONAL (else ERR_STATEMENT_NOT_PROVISIONAL)"
        side_effects:
          - "audited_sales_cents recorded; final_royalty_cents recomputed by royalty_marginal_tiers against prior quarters' effective sales (finalized -> audited, else reported)"
          - "delta_cents = final - provisional; provider.royalty_balance_cents += delta_cents"
          - "agreement.recognized_royalty_cents += final_royalty_cents; agreement.provisional_outstanding_cents -= provisional_royalty_cents (bucket conservation)"
          - "agreement.version increments by 1 (the bucket mutation is an agreement mutation)"
          - "provider.version increments by 1 (the balance posting is a provider mutation)"
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system (a new statement is submitted for the same (license_agreement_id, period_year, period_quarter))"
        actor: system
        preconditions:
          - "the superseding submission passes OCC on the agreement"
        side_effects:
          - "agreement.provisional_outstanding_cents -= superseded statement's provisional_royalty_cents"
          - "provider.royalty_balance_cents -= superseded statement's provisional_royalty_cents (correction posted before the new statement's provisional is added)"
          - "agreement.version increments by 1 (bucket reversal is an agreement mutation; the superseding submission increments it again per its own side effects)"

  - entity: Complaint
    initial_state: FILED
    terminal_states: [RESOLVED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/complaints/{id}/adjudicate (action=OPEN_REVIEW)"
        actor: OversightAnalyst
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /api/complaints/{id}/adjudicate (action=RESOLVE)"
        actor: OversightAnalyst
        preconditions: []
        side_effects:
          - "resolution_code recorded if supplied"
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /api/complaints/{id}/adjudicate (action=ESCALATE)"
        actor: OversightAnalyst
        preconditions:
          - "agreement.status in {ACTIVE, PROBATION} (else ERR_AGREEMENT_STATE at constraint level)"
        side_effects:
          - "escalated_at = current logical clock"
          - "LINK 1: agreement.escalations_trailing_12mo recomputed; if >= 3 and agreement ACTIVE -> agreement PROBATION (probation_count += 1)"
          - "LINK 2: provider.escalations_trailing_12mo recomputed; if >= 5 and provider LICENSED -> provider SUSPENDED"
          - "LINK 3: provider suspension cascades to every still-ACTIVE agreement of the provider -> PROBATION (probation_count += 1 each)"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /api/complaints/{id}/adjudicate (action=RESOLVE)"
        actor: OversightAnalyst
        preconditions: []
        side_effects:
          - "resolution_code recorded if supplied; the complaint stops counting toward escalation thresholds once RESOLVED (only ESCALATED complaints count)"

  - entity: FundTransfer
    initial_state: PENDING_APPROVAL
    terminal_states: [EXECUTED, REJECTED]
    transitions:
      - from: PENDING_APPROVAL
        to: EXECUTED
        trigger: "POST /api/fund-transfers/{id}/approve (decision=APPROVE)"
        actor: FinanceController
        preconditions:
          - "decided_by (X-User-ID) != requested_by_user_id (else ERR_SELF_APPROVAL)"
          - "direction pair permitted by the governance matrix (else ERR_PROHIBITED_ENTITY_PAIR)"
          - "amount_cents <= from_entity.balance_cents (else ERR_INSUFFICIENT_ENTITY_BALANCE)"
          - "per-transfer cap where applicable (else ERR_PER_TRANSFER_CAP_EXCEEDED)"
          - "calendar-year cumulative cap where applicable (else ERR_ANNUAL_CAP_EXCEEDED)"
        side_effects:
          - "from_entity.balance_cents -= amount_cents; to_entity.balance_cents += amount_cents (balance conservation invariant)"
          - "from_balance_after_cents / to_balance_after_cents recorded on the transfer"
          - "executed_at = current logical clock (calendar-year window anchor for caps)"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /api/fund-transfers/{id}/approve (decision=REJECT)"
        actor: FinanceController
        preconditions:
          - "decided_by (X-User-ID) != requested_by_user_id (else ERR_SELF_APPROVAL)"
        side_effects:
          - "decided_by_user_id recorded; balances untouched"

  - entity: Campaign
    field: computed_status
    derivation: |
      Lazily derived from the logical clock on every read (no mutation endpoints):
        UPCOMING iff clock date < start_date
        ACTIVE   iff start_date <= clock date <= end_date   (both bounds inclusive)
        CLOSED   iff clock date > end_date
      MobilizationEvent creation is rejected with ERR_CAMPAIGN_NOT_ACTIVE unless
      computed_status == ACTIVE at request time.

  - entity: CourseSession
    field: status
    derivation: |
      Lazily derived from the logical clock on every read:
        SCHEDULED iff clock < end_time
        HELD      iff clock >= end_time
      Enrollment is rejected with ERR_ENROLLMENT_CLOSED unless the session is
      SCHEDULED and start_time > clock at request time.

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-provider
    parent_entity: Provider
    write_endpoint: "POST /api/providers/{id}/license-agreements"
    occ_field: expected_provider_version
    description: |
      Creating a LicenseAgreement against a Provider whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created an agreement (which mutated the provider's
      version) and the current writer's view of the provider — including its
      admission state and existing category coverage — is therefore stale.
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412
  - rule_id: statement-create-stale-agreement
    parent_entity: LicenseAgreement
    write_endpoint: "POST /api/license-agreements/{id}/royalty-statements"
    occ_field: expected_agreement_version
    description: |
      Submitting a RoyaltyStatement against a LicenseAgreement whose version has
      advanced since the client last observed it is rejected. A submission for a
      quarter that already has a PROVISIONAL statement legitimately supersedes
      that statement, so a client holding a stale agreement version would
      unknowingly overwrite a fresher submission; the stale write is rejected
      instead of racing the supersede.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: membership_term_pricing
    trigger: "household creation (initial term) and renewal batch (renewal term)"
    algorithm: tiered_pricing
    formula: |
      discount = MULTI_YEAR_DISCOUNT[term_years] + (LOYALTY_RENEWAL_DISCOUNT if is_renewal else 0)
      effective_discount = min(DISCOUNT_CAP, discount)
      paid_cents = round_half_up(BASE_ANNUAL_CENTS * term_years * (1 - effective_discount))
      A secondary member adds 0 cents (household pricing covers up to two members).
    input_set: "the term being priced; is_renewal distinguishes initial purchase from renewal-batch purchase"
    constants:
      BASE_ANNUAL_CENTS: 1600
      MULTI_YEAR_DISCOUNT_1: 0.0
      MULTI_YEAR_DISCOUNT_3: 0.10
      MULTI_YEAR_DISCOUNT_5: 0.20
      LOYALTY_RENEWAL_DISCOUNT: 0.05
      DISCOUNT_CAP: 0.25
    precision: "integer cents, round_half_up applied once at the end"
    variants: []

  - name: membership_cancel_refund
    trigger: "POST /api/membership-terms/{id}/cancel"
    algorithm: aggregation
    formula: |
      months_used = (cancel_year - start_year) * 12 + (cancel_month - start_month) + 1
      (calendar months started, counting the cancellation month itself; the
      day-of-month is irrelevant — the current month is always consumed)
      VOLUNTARY (short-rate clawback of the multi-year discount):
        refund = max(0, paid_cents - months_used * BASE_MONTHLY_CENTS)
      DECEASED (pro-rata at the effective discounted monthly rate):
        effective_monthly_cents = round_half_up(paid_cents / (term_years * 12))
        refund = min(paid_cents, (term_years * 12 - months_used) * effective_monthly_cents)
      ROUNDING ORDER IS PINNED: derive the per-month basis FIRST
      (BASE_MONTHLY_CENTS = round_half_up(BASE_ANNUAL_CENTS / 12) = 133, or
      effective_monthly_cents = round_half_up(paid_cents / total_months)), THEN
      multiply by whole months. Rounding only the final product is a different,
      incorrect algorithm (1-year DECEASED: 1197 pinned vs 1200 unpinned).
    input_set: "the single term being cancelled; clock supplies the cancellation date"
    constants:
      BASE_ANNUAL_CENTS: 1600
      BASE_MONTHLY_CENTS: 133
    precision: "integer cents; per-month basis rounded round_half_up before multiplication"
    variants:
      - name: voluntary_short_rate
        when: "cancel reason == VOLUNTARY"
        difference: "refund = paid - months_used * 133 (undiscounted monthly basis claws back the multi-year discount)"
      - name: deceased_pro_rata
        when: "cancel reason == DECEASED"
        difference: "refund = unused_months * round_half_up(paid / total_months) (discount is preserved for the estate)"

  - name: royalty_marginal_tiers
    trigger: "royalty statement submission (provisional) and finalize (final)"
    algorithm: tiered_pricing
    formula: |
      Annual marginal tiers on the agreement's calendar-year sales accumulation:
        first 100,000,000 cents of YTD sales taxed at TIER1_RATE (0.08)
        next  up to 500,000,000 cents YTD taxed at TIER2_RATE (0.10)
        above 500,000,000 cents YTD taxed at TIER3_RATE (0.12)
      Statements are processed in chronological quarter order (period_year,
      period_quarter ASC). For statement s:
        ytd_before = sum of effective_sales over the agreement's statements of
                     the same calendar year with an earlier (year, quarter),
                     where effective_sales = audited_sales_cents if that
                     statement is FINALIZED else reported_sales_cents
        royalty(s) = tier1_room_after(ytd_before) ... i.e. marginal allocation
                     of s's sales figure against the tiers given ytd_before,
                     summed across crossed tiers, rounded round_half_up ONCE
                     per statement to integer cents.
      PROVISIONAL computation uses reported_sales_cents for s.
      FINAL computation (finalize endpoint) uses audited_sales_cents for s;
      LATER statements are NOT re-based — each statement's tier allocation is
      fixed at its own computation time (late-binding per statement).
    input_set: "statements of the same agreement and period_year with status in {PROVISIONAL, FINALIZED}; SUPERSEDED statements are excluded entirely"
    constants:
      TIER1_CAP_CENTS: 100000000
      TIER1_RATE: 0.08
      TIER2_CAP_CENTS: 500000000
      TIER2_RATE: 0.10
      TIER3_RATE: 0.12
    precision: "integer cents, round_half_up once per statement"
    variants:
      - name: provisional
        when: "at submission"
        difference: "computes on provider-reported sales; posts +provisional to provider.royalty_balance_cents"
      - name: final
        when: "at finalize"
        difference: "recomputes on audited sales; posts only delta = final - provisional to provider.royalty_balance_cents"

  - name: escalation_threshold_eval
    trigger: "complaint ESCALATE adjudication (and re-admission / reinstate precondition checks)"
    algorithm: threshold
    formula: |
      agreement.escalations_trailing_12mo =
        count of complaints with license_agreement_id == agreement.id,
        status == ESCALATED, and escalated_at >= (clock - 365 days)   [inclusive bound]
      provider.escalations_trailing_12mo = same count across ALL agreements of the provider
      Threshold crossings (>=, so exactly at the threshold fires):
        agreement count >= AGREEMENT_PROBATION_THRESHOLD and agreement ACTIVE  -> PROBATION
        provider  count >= PROVIDER_SUSPENSION_THRESHOLD and provider LICENSED -> SUSPENDED
    input_set: "complaints with status == ESCALATED only; a complaint resolved after escalation no longer counts toward either trailing threshold"
    constants:
      AGREEMENT_PROBATION_THRESHOLD: 3
      PROVIDER_SUSPENSION_THRESHOLD: 5
      TRAILING_WINDOW_DAYS: 365
    precision: "integer counts; datetime comparison inclusive at the exact 365-day boundary"
    variants: []

  - name: household_standing
    trigger: "term status changes (creation, cancel, renewal batch) and every read of Household.status / Member.in_good_standing"
    algorithm: aggregation
    formula: |
      Household.status = ACTIVE iff exists term t of the household with
        t.status == ACTIVE and t.start_date <= clock_date < t.end_date
      (half-open coverage; RENEWED terms cover only their own historical window)
      else LAPSED.
      member.in_good_standing = (household.status == ACTIVE) for each member of
      the household.
    input_set: "all MembershipTerm rows of the household regardless of status"
    constants: {}
    precision: "date comparison, half-open interval"
    variants: []

  - name: circulation_fulfillment
    trigger: "every read of a Publication and every ad-booking creation"
    algorithm: aggregation
    formula: |
      circulation_count = count of DISTINCT households having at least one term t with
        t.status in {ACTIVE, RENEWED} and t.start_date <= publication_date < t.end_date
      (a household with several covering terms counts once; CANCELLED and LAPSED
      terms never cover, regardless of when they flipped)
    input_set: "all MembershipTerm rows in the system"
    constants: {}
    precision: "integer count, distinct household dedupe, half-open interval"
    variants: []

  - name: ad_cost_estimate
    trigger: "ad-booking creation"
    algorithm: aggregation
    formula: |
      estimated_cost_cents = round_half_up(agreed_cpm_cents * circulation_count / 1000)
      where circulation_count is the publication's circulation_fulfillment value
      at booking time. circulation_count == 0 is rejected (ERR_NO_CIRCULATION_BASE)
      before this formula runs.
    input_set: "the booking plus its publication"
    constants: {}
    precision: "integer cents, round_half_up once"
    variants: []

  - name: fund_transfer_governance
    trigger: "fund-transfer approval"
    algorithm: threshold
    formula: |
      Direction matrix (anything not listed is prohibited -> ERR_PROHIBITED_ENTITY_PAIR):
        MEMBERSHIP_ORG -> FOUNDATION   : allowed, uncapped (grant-making)
        MEMBERSHIP_ORG -> LOBBY_ARM    : allowed, annual lobbying cap (below)
        FOUNDATION     -> MEMBERSHIP_ORG: allowed, per-transfer AND annual caps (below)
        FOUNDATION     -> LOBBY_ARM    : PROHIBITED (foundation money never funds lobbying)
        LOBBY_ARM      -> *            : PROHIBITED (lobbying arm never sends)
        same entity -> same entity     : PROHIBITED
      Balance check (all transfers): amount_cents <= from_entity.balance_cents.
      FOUNDATION -> MEMBERSHIP_ORG caps:
        per-transfer: amount_cents <= round_down(0.05 * foundation.balance_cents)   [current balance]
        annual:       sum(amount over EXECUTED foundation outflows with executed_at
                      in the calendar year of the clock) + amount_cents
                      <= round_down(0.15 * foundation.balance_cents)                [current balance]
      MEMBERSHIP_ORG -> LOBBY_ARM annual cap:
        dues_revenue_ytd = sum(paid_cents - refunded_cents) over ALL MembershipTerm
          rows with purchased_at in the calendar year of the clock (any status;
          refunds net out)
        sum(amount over EXECUTED membership->lobby transfers with executed_at in
            the calendar year of the clock) + amount_cents
            <= round_down(0.20 * dues_revenue_ytd)
      Fiscal check order is pinned: balance first, then per-transfer cap, then annual cap.
    input_set: "the transfer; the two LegalEntity rows; EXECUTED transfers of the same calendar year; all MembershipTerm rows purchased in the same calendar year"
    constants:
      FOUNDATION_PER_TRANSFER_CAP_PCT: 0.05
      FOUNDATION_ANNUAL_OUTFLOW_CAP_PCT: 0.15
      LOBBYING_ANNUAL_DUES_CAP_PCT: 0.20
    precision: "integer cents; cap amounts truncated (round_down) before comparison; <= comparison (exactly at cap passes)"
    variants: []

  - name: mobilization_audience_count
    trigger: "mobilization-event creation"
    algorithm: aggregation
    formula: |
      audience_count = count of Member rows where
        member.in_good_standing == true
        AND member.benefit_marketing_opt_out == false
        AND (audience_spec.state_code is absent OR household(member).state_code == audience_spec.state_code)
        AND (audience_spec.min_age is absent OR member.age_years >= audience_spec.min_age)
      The count is a SNAPSHOT frozen at creation; later opt-outs or standing
      changes do not mutate a stored MobilizationEvent.
    input_set: "all Member rows joined to their households"
    constants: {}
    precision: "integer count; >= comparison on min_age (exactly min_age is included)"
    variants: []

  - name: session_overlap_detection
    trigger: "course-session creation"
    algorithm: interval_merge
    formula: |
      TWO DISTINCT INTERVAL SEMANTICS:
      (1) Chapter room (same chapter_id): new [s, e) conflicts with existing
          [s', e') unless (e + BUFFER <= s') OR (e' + BUFFER <= s), with
          BUFFER = 30 minutes. An existing session ending 11:00 blocks a new
          start before 11:30; 11:30 exactly is allowed.
      (2) Instructor (same instructor_name, case-sensitive, across ALL chapters):
          plain half-open overlap: conflict iff s < e' AND s' < e. Adjacency is
          allowed (a session starting exactly when another of the instructor's
          sessions ends does NOT conflict); no buffer applies.
      Both checks run against sessions of any computed status (SCHEDULED or HELD
      alike — a past session still occupies its historical slot).
    input_set: "all CourseSession rows (any chapter for the instructor check; same-chapter rows for the room check)"
    constants:
      ROOM_TURNOVER_BUFFER_MINUTES: 30
    precision: "datetime comparison; buffer semantics for rooms, half-open adjacency for instructors"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is listed for the endpoint; for action endpoints the role must own the action (agreement transitions: ACTIVATE/TERMINATE are GovernanceOfficer-only, PROBATE/REINSTATE are OversightAnalyst-only)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership for entity-backed roles: ProviderManager X-User-ID == path provider id (agreement/statement writes); ChapterCoordinator X-User-ID == path chapter id (session creation); Member X-User-ID == body member_id (complaint filing, enrollment)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "entity-backed write endpoints"
  - priority: 4
    category: auth
    check: "Segregation of duties: fund-transfer approver X-User-ID != transfer.requested_by_user_id"
    error_id: ERR_SELF_APPROVAL
    http_status: 403
    applies_to: "POST /api/fund-transfers/{id}/approve"
  - priority: 5
    category: existence
    check: "Request schema: required fields present, enums valid, dates parse, effective_to > effective_from, end_time > start_time, max_cpm_cents >= min_cpm_cents, end_date >= start_date, campaign state_code present iff level == STATE, secondary_date_of_birth present iff secondary_full_name present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 6
    category: existence
    check: "Path ids exist (validated left to right), then body-supplied FK ids exist (member_id, license_agreement_id, sponsor_entity_id, from_entity_id, to_entity_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_provider_version == provider.version on agreement creation; expected_agreement_version == agreement.version on statement submission"
    error_id: "ERR_STALE_PROVIDER_VERSION | ERR_STALE_AGREEMENT_VERSION"
    http_status: 412
    applies_to: "POST /api/providers/{id}/license-agreements, POST /api/license-agreements/{id}/royalty-statements"
  - priority: 8
    category: state
    check: "Target-resource state precondition: term ACTIVE for cancel (ERR_TERM_NOT_ACTIVE); agreement transition valid from current status (ERR_AGREEMENT_STATE); statement PROVISIONAL for finalize (ERR_STATEMENT_NOT_PROVISIONAL); complaint transition valid from current status (ERR_COMPLAINT_STATE); transfer PENDING_APPROVAL for approve (ERR_TRANSFER_STATE); session SCHEDULED with start_time > clock for enroll (ERR_ENROLLMENT_CLOSED)"
    error_id: "ERR_TERM_NOT_ACTIVE | ERR_AGREEMENT_STATE | ERR_STATEMENT_NOT_PROVISIONAL | ERR_COMPLAINT_STATE | ERR_TRANSFER_STATE | ERR_ENROLLMENT_CLOSED"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 9
    category: state
    check: "Cross-entity state precondition: provider LICENSED for agreement create/activate/reinstate (ERR_PROVIDER_NOT_LICENSED); campaign computed_status == ACTIVE for mobilization (ERR_CAMPAIGN_NOT_ACTIVE); member in_good_standing for complaint filing and enrollment (ERR_MEMBER_NOT_ACTIVE)"
    error_id: "ERR_PROVIDER_NOT_LICENSED | ERR_CAMPAIGN_NOT_ACTIVE | ERR_MEMBER_NOT_ACTIVE"
    http_status: 409
    applies_to: "agreement, mobilization, complaint, enrollment endpoints"
  - priority: 10
    category: business_safety
    check: "Eligibility & compliance: primary member age_years >= 50 at enrollment (ERR_AGE_INELIGIBLE); fund-transfer direction permitted by the governance matrix (ERR_PROHIBITED_ENTITY_PAIR); campaign sponsor kind == LOBBY_ARM (ERR_SPONSOR_KIND_INVALID); mobilization audience_spec free of benefit-marketing keys (ERR_DATA_USE_RESTRICTED); ad category not in {TOBACCO, FIREARMS, POLITICAL} (ERR_AD_CATEGORY_RESTRICTED)"
    error_id: "ERR_AGE_INELIGIBLE | ERR_PROHIBITED_ENTITY_PAIR | ERR_SPONSOR_KIND_INVALID | ERR_DATA_USE_RESTRICTED | ERR_AD_CATEGORY_RESTRICTED"
    http_status: 422
    applies_to: "household creation, transfers, campaigns, mobilizations, ad bookings"
  - priority: 11
    category: business_constraint
    check: "Constraint satisfaction: term_years in {1,3,5} (ERR_INVALID_TERM_YEARS); legal-entity kind unique (ERR_ENTITY_KIND_EXISTS); agreement window contains clock date on activate (ERR_AGREEMENT_NOT_IN_WINDOW); no DRAFT/ACTIVE duplicate per (provider, category) on create, no second ACTIVE on activate (ERR_DUPLICATE_CATEGORY_AGREEMENT); no FINALIZED statement for the same quarter on submit (ERR_QUARTER_ALREADY_FINALIZED); reinstate/re-admit thresholds cleared (ERR_REINSTATE_BLOCKED); complaint filing or escalation against a DRAFT or TERMINATED agreement (ERR_AGREEMENT_STATE); chapter-room buffer overlap (ERR_SESSION_OVERLAP); instructor half-open overlap (ERR_INSTRUCTOR_DOUBLE_BOOKED); duplicate enrollment (ERR_ALREADY_ENROLLED); session capacity reached (ERR_SESSION_FULL)"
    error_id: "ERR_INVALID_TERM_YEARS | ERR_ENTITY_KIND_EXISTS | ERR_AGREEMENT_NOT_IN_WINDOW | ERR_DUPLICATE_CATEGORY_AGREEMENT | ERR_QUARTER_ALREADY_FINALIZED | ERR_REINSTATE_BLOCKED | ERR_SESSION_OVERLAP | ERR_INSTRUCTOR_DOUBLE_BOOKED | ERR_ALREADY_ENROLLED | ERR_SESSION_FULL"
    http_status: "422 | 409 | 422 | 409 | 409 | 422 | 409 | 409 | 409 | 409"
    applies_to: "various"
  - priority: 12
    category: business_fiscal
    check: "Fiscal checks in pinned order: transfer amount <= source balance (ERR_INSUFFICIENT_ENTITY_BALANCE); foundation per-transfer cap (ERR_PER_TRANSFER_CAP_EXCEEDED); foundation annual outflow cap and lobbying annual dues cap (ERR_ANNUAL_CAP_EXCEEDED); ad agreed_cpm_cents within rate card inclusive (ERR_RATE_CARD_VIOLATION); publication circulation > 0 for booking (ERR_NO_CIRCULATION_BASE)"
    error_id: "ERR_INSUFFICIENT_ENTITY_BALANCE | ERR_PER_TRANSFER_CAP_EXCEEDED | ERR_ANNUAL_CAP_EXCEEDED | ERR_RATE_CARD_VIOLATION | ERR_NO_CIRCULATION_BASE"
    http_status: 422
    applies_to: "transfers, ad bookings"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock / batch ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default (before any call) is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all lazily-computed date/clock derivations re-anchor (campaign status, session status, trailing windows)"]
  - method: POST
    path: "/api/_batch/renewal_run"
    description: "Renewal sweep: every ACTIVE MembershipTerm with end_date <= clock date is renewed (household auto_renew_enabled) or lapsed; household standing and member standing recompute"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { renewed_count: integer, lapsed_count: integer, renewed_term_ids: array, lapsed_term_ids: array }
    side_effects: ["term renewals/lapses per MembershipTerm machine", "household.status + member.in_good_standing recompute (cascade links 2-3)"]

  # --- households / members / terms ---
  - method: POST
    path: "/api/households"
    description: "Create household + PRIMARY member (+ optional SECONDARY member) + initial membership term atomically; age eligibility and pricing run here"
    roles: [MemberServicesAgent]
    code: 201
    input: [state_code, term_years, primary_full_name, primary_date_of_birth, "auto_renew_enabled?", "primary_benefit_marketing_opt_out?", "secondary_full_name?", "secondary_date_of_birth?", "secondary_benefit_marketing_opt_out?"]
    output: Household
    side_effects: ["Member rows created", "MembershipTerm created ACTIVE with computed paid_cents", "household.lifetime_collected_cents += paid_cents"]
  - method: GET
    path: "/api/households/{id}"
    description: "Read household incl. computed status and lifetime counters"
    roles: [MemberServicesAgent, PlatformAdmin]
    code: 200
    input: []
    output: Household
    side_effects: []
  - method: GET
    path: "/api/households/{id}/members"
    description: "List the household's members (reverse lookup for Member.household_id)"
    roles: [MemberServicesAgent, AdvocacyDirector, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: "/api/households/{id}/terms"
    description: "List the household's membership terms (reverse lookup for MembershipTerm.household_id)"
    roles: [MemberServicesAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: MembershipTerm[]
    side_effects: []
  - method: POST
    path: "/api/membership-terms/{id}/cancel"
    description: "Cancel an ACTIVE term; refund variant selected by reason"
    roles: [MemberServicesAgent]
    code: 200
    input: [reason]
    output: MembershipTerm
    side_effects: ["membership_cancel_refund runs", "household lifetime counters + standing recompute (cascade)"]

  # --- providers / agreements / royalty statements ---
  - method: POST
    path: "/api/providers"
    description: "Register a benefit provider (starts APPLICANT)"
    roles: [GovernanceOfficer]
    code: 201
    input: [legal_name]
    output: Provider
    side_effects: []
  - method: GET
    path: "/api/providers/{id}"
    description: "Read provider incl. royalty balance and trailing escalation count"
    roles: [GovernanceOfficer, ProviderManager, OversightAnalyst, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: POST
    path: "/api/providers/{id}/admit"
    description: "Admit APPLICANT -> LICENSED, or re-admit SUSPENDED -> LICENSED (threshold-gated)"
    roles: [GovernanceOfficer]
    code: 200
    input: []
    output: Provider
    side_effects: ["provider.status transition", "provider.version increments by 1"]
  - method: POST
    path: "/api/providers/{id}/license-agreements"
    description: "Draft a license agreement (OCC on provider version; provider must be LICENSED; no DRAFT/ACTIVE duplicate per category)"
    roles: [ProviderManager]
    code: 201
    input: [product_category, effective_from, effective_to, expected_provider_version]
    output: LicenseAgreement
    side_effects: ["provider.version increments by 1"]
  - method: GET
    path: "/api/providers/{id}/license-agreements"
    description: "List a provider's agreements (reverse lookup for LicenseAgreement.provider_id)"
    roles: [ProviderManager, GovernanceOfficer, OversightAnalyst, FinanceController, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LicenseAgreement[]
    side_effects: []
  - method: GET
    path: "/api/license-agreements/{id}"
    description: "Read agreement incl. royalty buckets and trailing escalation count"
    roles: [ProviderManager, GovernanceOfficer, OversightAnalyst, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []
  - method: POST
    path: "/api/license-agreements/{id}/transitions"
    description: "Drive the agreement state machine. action=ACTIVATE|TERMINATE are GovernanceOfficer-only; action=PROBATE|REINSTATE are OversightAnalyst-only"
    roles: [GovernanceOfficer, OversightAnalyst]
    code: 200
    input: [action]
    output: LicenseAgreement
    side_effects: ["per LicenseAgreement state machine", "agreement.version increments by 1 on success"]
  - method: POST
    path: "/api/license-agreements/{id}/royalty-statements"
    description: "Submit a quarterly royalty statement (OCC on agreement version; supersedes any PROVISIONAL statement for the same quarter; rejected if one is FINALIZED)"
    roles: [ProviderManager]
    code: 201
    input: [period_year, period_quarter, reported_sales_cents, expected_agreement_version]
    output: RoyaltyStatement
    side_effects: ["royalty_marginal_tiers provisional variant", "provider.royalty_balance_cents += provisional_royalty_cents", "agreement.provisional_outstanding_cents += provisional_royalty_cents", "prior PROVISIONAL statement for the same quarter -> SUPERSEDED with reversing postings", "agreement.version increments by 1"]
  - method: GET
    path: "/api/license-agreements/{id}/royalty-statements"
    description: "List an agreement's statements (reverse lookup for RoyaltyStatement.license_agreement_id)"
    roles: [ProviderManager, FinanceController, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RoyaltyStatement[]
    side_effects: []
  - method: POST
    path: "/api/royalty-statements/{id}/finalize"
    description: "Finalize a PROVISIONAL statement with audited sales (segregation of duties: the org's controller finalizes what the provider reported)"
    roles: [FinanceController]
    code: 200
    input: [audited_sales_cents]
    output: RoyaltyStatement
    side_effects: ["royalty_marginal_tiers final variant", "provider.royalty_balance_cents += delta_cents", "bucket conservation on the agreement (recognized += final; provisional_outstanding -= provisional)"]

  # --- complaints / oversight ---
  - method: POST
    path: "/api/complaints"
    description: "Member files a complaint against a licensed product's agreement (member must be in good standing; agreement must be ACTIVE or PROBATION)"
    roles: [Member]
    code: 201
    input: [member_id, license_agreement_id, category, severity, description]
    output: Complaint
    side_effects: []
  - method: GET
    path: "/api/complaints/{id}"
    description: "Read a complaint"
    roles: [OversightAnalyst, MemberServicesAgent, PlatformAdmin]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: GET
    path: "/api/complaints"
    description: "List complaints with filters (reverse lookup for Complaint.member_id and Complaint.license_agreement_id)"
    roles: [OversightAnalyst, MemberServicesAgent, PlatformAdmin]
    code: 200
    input: ["member_id?", "license_agreement_id?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: POST
    path: "/api/complaints/{id}/adjudicate"
    description: "Drive the complaint machine. action=OPEN_REVIEW|RESOLVE|ESCALATE; ESCALATE fires the oversight cascade"
    roles: [OversightAnalyst]
    code: 200
    input: [action, "resolution_code?"]
    output: Complaint
    side_effects: ["per Complaint state machine incl. agreement probation / provider suspension cascade on ESCALATE"]

  # --- legal entities / fund transfers (governance) ---
  - method: POST
    path: "/api/legal-entities"
    description: "Create one of the three legal entities (kind unique per system)"
    roles: [GovernanceOfficer]
    code: 201
    input: [kind, display_name, balance_cents]
    output: LegalEntity
    side_effects: []
  - method: GET
    path: "/api/legal-entities/{id}"
    description: "Read a legal entity incl. current balance"
    roles: [GovernanceOfficer, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: LegalEntity
    side_effects: []
  - method: POST
    path: "/api/fund-transfers"
    description: "Request a fund transfer between legal entities (PENDING_APPROVAL; requester recorded for SoD)"
    roles: [GovernanceOfficer]
    code: 201
    input: [from_entity_id, to_entity_id, amount_cents, purpose]
    output: FundTransfer
    side_effects: ["requested_by_user_id = caller X-User-ID"]
  - method: GET
    path: "/api/legal-entities/{id}/fund-transfers"
    description: "List transfers touching an entity (reverse lookup for FundTransfer.from_entity_id and FundTransfer.to_entity_id; matches either side)"
    roles: [GovernanceOfficer, FinanceController, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FundTransfer[]
    side_effects: []
  - method: POST
    path: "/api/fund-transfers/{id}/approve"
    description: "Approve (executes atomically, balances move) or reject a transfer; approver must differ from requester"
    roles: [FinanceController]
    code: 200
    input: [decision]
    output: FundTransfer
    side_effects: ["per FundTransfer machine; balance conservation invariant on EXECUTED"]

  # --- publications / advertising ---
  - method: POST
    path: "/api/publications"
    description: "Create a publication issue with rate card"
    roles: [StandardsReviewer]
    code: 201
    input: [title, publication_date, min_cpm_cents, max_cpm_cents]
    output: Publication
    side_effects: []
  - method: GET
    path: "/api/publications/{id}"
    description: "Read a publication incl. lazily recomputed circulation_count"
    roles: [StandardsReviewer, MemberServicesAgent, PlatformAdmin]
    code: 200
    input: []
    output: Publication
    side_effects: ["circulation_fulfillment recomputed at read"]
  - method: POST
    path: "/api/publications/{id}/ad-bookings"
    description: "Book an ad into an issue; advertising standards + rate card + circulation validated at creation"
    roles: [StandardsReviewer]
    code: 201
    input: [advertiser_name, category, agreed_cpm_cents]
    output: AdBooking
    side_effects: ["ad_cost_estimate computed against current circulation"]
  - method: GET
    path: "/api/publications/{id}/ad-bookings"
    description: "List an issue's ad bookings (reverse lookup for AdBooking.publication_id)"
    roles: [StandardsReviewer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AdBooking[]
    side_effects: []

  # --- chapters / course sessions ---
  - method: POST
    path: "/api/chapters"
    description: "Charter a local chapter"
    roles: [MemberServicesAgent]
    code: 201
    input: [name, state_code, city]
    output: Chapter
    side_effects: []
  - method: GET
    path: "/api/chapters/{id}"
    description: "Read a chapter"
    roles: [MemberServicesAgent, ChapterCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Chapter
    side_effects: []
  - method: POST
    path: "/api/chapters/{id}/course-sessions"
    description: "Schedule a tax-prep or driver-safety session (room-buffer and instructor overlap rules apply)"
    roles: [ChapterCoordinator]
    code: 201
    input: [course_kind, instructor_name, start_time, end_time, capacity]
    output: CourseSession
    side_effects: []
  - method: GET
    path: "/api/chapters/{id}/course-sessions"
    description: "List a chapter's sessions (reverse lookup for CourseSession.chapter_id)"
    roles: [ChapterCoordinator, MemberServicesAgent, Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CourseSession[]
    side_effects: []
  - method: POST
    path: "/api/course-sessions/{id}/enroll"
    description: "Enroll a member (self-enroll as Member or coordinator-assisted); capacity, standing, duplicate, and timing gates"
    roles: [Member, ChapterCoordinator]
    code: 200
    input: [member_id]
    output: CourseSession
    side_effects: ["member appended to enrolled_member_ids", "enrolled_count recomputed"]

  # --- advocacy campaigns / mobilization ---
  - method: POST
    path: "/api/campaigns"
    description: "Create an advocacy campaign; sponsor entity must be the LOBBY_ARM"
    roles: [AdvocacyDirector]
    code: 201
    input: [title, level, issue_area, start_date, end_date, sponsor_entity_id, "state_code?"]
    output: Campaign
    side_effects: []
  - method: GET
    path: "/api/campaigns/{id}"
    description: "Read a campaign incl. lazily derived computed_status"
    roles: [AdvocacyDirector, PlatformAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: ["computed_status derived from clock"]
  - method: GET
    path: "/api/campaigns"
    description: "List campaigns with filters (reverse lookup for Campaign.sponsor_entity_id)"
    roles: [AdvocacyDirector, PlatformAdmin]
    code: 200
    input: ["sponsor_entity_id?", "level?", "status?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []
  - method: POST
    path: "/api/campaigns/{id}/mobilizations"
    description: "Create a mobilization event; audience snapshot frozen at creation; campaign must be ACTIVE; benefit-marketing targeting keys forbidden"
    roles: [AdvocacyDirector]
    code: 201
    input: [channel, audience_spec]
    output: MobilizationEvent
    side_effects: ["mobilization_audience_count snapshot computed"]
  - method: GET
    path: "/api/campaigns/{id}/mobilizations"
    description: "List a campaign's mobilization events (reverse lookup for MobilizationEvent.campaign_id)"
    roles: [AdvocacyDirector, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: MobilizationEvent[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID header missing or role name not declared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for the endpoint or action, or entity-backed ownership mismatch (ProviderManager/ChapterCoordinator/Member acting on another's resource)" }
  - { id: ERR_SELF_APPROVAL, http: 403, condition: "Fund-transfer approver's X-User-ID equals the transfer's requested_by_user_id (segregation of duties)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-supplied FK id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, unparseable date, inverted ranges (effective_to <= effective_from, end_time <= start_time, max_cpm < min_cpm, end_date < start_date), conditional field violation (STATE campaign without state_code; secondary member without date_of_birth), unknown audience_spec key that is not a restricted benefit key" }
  - { id: ERR_STALE_PROVIDER_VERSION, http: 412, condition: "expected_provider_version != provider.version on agreement creation" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version != agreement.version on statement submission" }
  - { id: ERR_AGE_INELIGIBLE, http: 422, condition: "Primary member's age_years < 50 at enrollment (50th birthday exactly on the clock date IS eligible)" }
  - { id: ERR_INVALID_TERM_YEARS, http: 422, condition: "term_years not in {1, 3, 5}" }
  - { id: ERR_TERM_NOT_ACTIVE, http: 409, condition: "Cancel attempted on a term not in ACTIVE (RENEWED, LAPSED, or CANCELLED)" }
  - { id: ERR_PROVIDER_NOT_LICENSED, http: 409, condition: "Agreement create/activate/reinstate attempted while provider is APPLICANT or SUSPENDED" }
  - { id: ERR_DUPLICATE_CATEGORY_AGREEMENT, http: 409, condition: "A DRAFT or ACTIVE agreement already exists for (provider, product_category) on create; or another ACTIVE exists for the category on activate" }
  - { id: ERR_AGREEMENT_NOT_IN_WINDOW, http: 422, condition: "Activate attempted with clock date outside [effective_from, effective_to] inclusive" }
  - { id: ERR_AGREEMENT_STATE, http: 409, condition: "Agreement transition invalid from current status (e.g. ACTIVATE from PROBATION, any transition from TERMINATED); also complaint ESCALATE when the agreement is TERMINATED" }
  - { id: ERR_REINSTATE_BLOCKED, http: 422, condition: "REINSTATE attempted while agreement escalations_trailing_12mo >= 3, or provider re-admission while provider escalations_trailing_12mo >= 5" }
  - { id: ERR_QUARTER_ALREADY_FINALIZED, http: 409, condition: "Statement submission for (agreement, year, quarter) that already has a FINALIZED statement" }
  - { id: ERR_STATEMENT_NOT_PROVISIONAL, http: 409, condition: "Finalize attempted on a FINALIZED or SUPERSEDED statement" }
  - { id: ERR_COMPLAINT_STATE, http: 409, condition: "Complaint adjudication invalid from current status (e.g. RESOLVE from FILED, ESCALATE from ESCALATED or RESOLVED, anything from RESOLVED)" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Member not in good standing (household LAPSED) attempted to file a complaint or enroll in a session" }
  - { id: ERR_ENTITY_KIND_EXISTS, http: 409, condition: "A LegalEntity of this kind already exists" }
  - { id: ERR_PROHIBITED_ENTITY_PAIR, http: 422, condition: "Transfer direction forbidden by the governance matrix (e.g. FOUNDATION -> LOBBY_ARM, LOBBY_ARM as sender, self-transfer)" }
  - { id: ERR_TRANSFER_STATE, http: 409, condition: "Approve attempted on a transfer not in PENDING_APPROVAL" }
  - { id: ERR_INSUFFICIENT_ENTITY_BALANCE, http: 422, condition: "Transfer amount exceeds the source entity's current balance" }
  - { id: ERR_PER_TRANSFER_CAP_EXCEEDED, http: 422, condition: "FOUNDATION -> MEMBERSHIP_ORG transfer exceeds 5% of the foundation's current balance" }
  - { id: ERR_ANNUAL_CAP_EXCEEDED, http: 422, condition: "Calendar-year cumulative cap exceeded: foundation outflows > 15% of current balance, or membership->lobby transfers > 20% of net dues revenue YTD" }
  - { id: ERR_AD_CATEGORY_RESTRICTED, http: 422, condition: "Ad category in {TOBACCO, FIREARMS, POLITICAL} violates advertising standards" }
  - { id: ERR_RATE_CARD_VIOLATION, http: 422, condition: "agreed_cpm_cents outside [min_cpm_cents, max_cpm_cents] inclusive" }
  - { id: ERR_NO_CIRCULATION_BASE, http: 422, condition: "Ad booking on a publication whose circulation_count is 0" }
  - { id: ERR_SESSION_OVERLAP, http: 409, condition: "Chapter-room conflict: new session fails the 30-minute turnover buffer rule against an existing same-chapter session" }
  - { id: ERR_INSTRUCTOR_DOUBLE_BOOKED, http: 409, condition: "Instructor (case-sensitive name) has a half-open-overlapping session in ANY chapter" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "Enrollment would exceed capacity: enrolled_count == capacity already (the capacity-th enrollment succeeds)" }
  - { id: ERR_ALREADY_ENROLLED, http: 409, condition: "Member already present in the session's enrolled_member_ids" }
  - { id: ERR_ENROLLMENT_CLOSED, http: 409, condition: "Session is HELD (clock >= end_time) or start_time <= clock at enrollment time" }
  - { id: ERR_SPONSOR_KIND_INVALID, http: 422, condition: "Campaign sponsor entity's kind is not LOBBY_ARM" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 409, condition: "Mobilization attempted while campaign computed_status is UPCOMING or CLOSED" }
  - { id: ERR_DATA_USE_RESTRICTED, http: 422, condition: "audience_spec contains a benefit-marketing key (owns_licensed_product, benefit_product_category, provider_customer); member data may not be used for benefit marketing" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator; drives the logical clock and the renewal batch; read access across the surface"
    identity: opaque
    exclusive_operations: ["set logical clock", "run renewal batch"]
    shared_operations: ["read any resource"]
  - name: MemberServicesAgent
    description: "Membership org staff; runs enrollment, terms, chapters, and reads member data"
    identity: opaque
    exclusive_operations: ["create households (members + initial term)", "cancel membership terms", "charter chapters"]
    shared_operations: ["read households/members/terms/chapters/complaints/publications"]
  - name: Member
    description: "An enrolled member acting as themselves"
    identity: "entity_backed:Member"
    exclusive_operations: ["file complaints as self"]
    shared_operations: ["enroll self in course sessions", "read chapter sessions"]
  - name: ProviderManager
    description: "Staff of a benefit provider; manages that provider's own agreements and royalty reports"
    identity: "entity_backed:Provider"
    exclusive_operations: ["create license agreements for own provider", "submit royalty statements for own provider"]
    shared_operations: ["read own provider, agreements, statements"]
  - name: GovernanceOfficer
    description: "Org governance staff; admits providers, drives agreement lifecycle business side, creates legal entities, requests fund transfers"
    identity: opaque
    exclusive_operations: ["admit/re-admit providers", "agreement ACTIVATE and TERMINATE actions", "create legal entities", "request fund transfers"]
    shared_operations: ["read providers/agreements/entities/transfers"]
  - name: OversightAnalyst
    description: "Member-facing quality oversight; adjudicates complaints and drives probation actions"
    identity: opaque
    exclusive_operations: ["adjudicate complaints (OPEN_REVIEW/RESOLVE/ESCALATE)", "agreement PROBATE and REINSTATE actions"]
    shared_operations: ["read providers/agreements/complaints"]
  - name: FinanceController
    description: "Org finance; approves fund transfers (never requests them) and finalizes royalty statements (never submits them)"
    identity: opaque
    exclusive_operations: ["approve/reject fund transfers", "finalize royalty statements"]
    shared_operations: ["read providers/agreements/statements/entities/transfers"]
  - name: StandardsReviewer
    description: "Publication advertising standards and circulation desk"
    identity: opaque
    exclusive_operations: ["create publications", "book ads"]
    shared_operations: ["read publications/ad bookings"]
  - name: ChapterCoordinator
    description: "Volunteer coordinator of one chapter; schedules its sessions and assists enrollments"
    identity: "entity_backed:Chapter"
    exclusive_operations: ["create course sessions for own chapter"]
    shared_operations: ["read chapter/sessions", "enroll any member into sessions"]
  - name: AdvocacyDirector
    description: "Advocacy campaigns and member mobilization"
    identity: opaque
    exclusive_operations: ["create campaigns", "create mobilization events"]
    shared_operations: ["read campaigns/mobilizations/members"]
