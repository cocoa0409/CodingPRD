            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { item1: $.data.id }
            - call: "POST /chargemaster/charge-items/${item1}/reprice"
              payload: {}
