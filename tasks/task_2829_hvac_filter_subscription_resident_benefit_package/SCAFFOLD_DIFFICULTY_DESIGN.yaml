  - rule_id: cross_entity_state_dependency
    instances:

      - name: shipment_scheduling_blocked_by_discontinued_filtersku_state
        grounds:
          - validations.priority_19
          - errors.ERR_SKU_DISCONTINUED
          - state_machines.FilterSku.ACTIVE_to_DISCONTINUED
          - endpoints.POST_subscriptions_id_shipments
          - entities.Subscription.fields.assigned_sku_id
        distinguishing_aspect: |
          Gating entity = FilterSku (a catalog row that is not in the request path at all),
          gated operation = scheduling the next shipment on a Subscription. The subscription
          itself is perfectly ACTIVE and the requested date is cadence-legal; only the state
          of the referenced SKU decides the outcome, and a sibling subscription pointing at a
          still-ACTIVE SKU accepts the identical request.
