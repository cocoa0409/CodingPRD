            - "Call 3 succeeds at exactly the deadline (now >= submission_deadline is inclusive): status == PRESENTATION_LOCKED"
            - "Call 4 returns 409 ERR_REVIEW_CALENDAR_INVALID — 2026-09-05 is not strictly before review_window_start 2026-09-01"
            - "Call 5 succeeds: status back to OPEN, reopen_count == 1, submission_deadline == 2026-08-25T00:00:00Z"
