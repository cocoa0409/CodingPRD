    path: "/petfood/recall-actions/{id}/begin-effectiveness-check"
    description: "INITIATED -> EFFECTIVENESS_CHECK"
    roles: [QAApprover]
    code: 200
    input: []
    output: RecallAction
    side_effects: ["increments RecallAction.version by 1"]
  - method: POST
    path: "/petfood/recall-actions/{id}/record-effectiveness"
    description: "EFFECTIVENESS_CHECK -> COMPLETED; records effectiveness_pct"
    roles: [QAApprover]
    code: 200
    input: [effectiveness_pct]
    output: RecallAction
    side_effects: ["sets effectiveness_pct", "increments RecallAction.version by 1"]
  - method: POST
    path: "/petfood/recall-actions/{id}/close"
    description: "COMPLETED -> CLOSED; recomputes formula flag and brand count"
    roles: [QAApprover]
    code: 200
    input: []
    output: RecallAction
    side_effects: ["recomputes Formula.open_recall_flag", "recomputes BrandOwner.open_recall_count", "increments RecallAction.version by 1"]
  - method: POST
    path: "/petfood/recall-actions/{id}/terminate"
    description: "INITIATED -> TERMINATED; compensating cascade returns lots/batches to pre-recall states"
    roles: [QAApprover]
    code: 200
    input: []
    output: RecallAction
    side_effects: ["compensating cascade: RECALLED lots -> QUARANTINED; RECALLED batches -> ON_HOLD", "recomputes Formula.open_recall_flag", "recomputes BrandOwner.open_recall_count", "increments RecallAction.version by 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog (30 errors)
# ---------------------------------------------------------------------------
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers, or undeclared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint per RBAC matrix" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or FK body reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or enum outside declared set" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition does not exist from the entity's current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Entity is in a terminal state; all further transitions rejected" }
  - { id: ERR_STALE_FORMULA_VERSION, http: 412, condition: "expected_formula_version does not match the Formula's current version (OCC)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: approver/rejecter is the user who submitted the approval request" }
  - { id: ERR_SUPPLIER_NOT_APPROVED, http: 422, condition: "Supplier.approval_state != APPROVED at pairing-approval time" }
  - { id: ERR_SUPPLIER_SUSPENDED, http: 422, condition: "Batch release requires every APPROVED pairing's Supplier to itself be APPROVED; a suspended supplier blocks release" }
  - { id: ERR_OPEN_RECALL, http: 422, condition: "Formula.open_recall_flag is true; lock, registration acceptance, and batch release are blocked" }
  - { id: ERR_INGREDIENT_INACTIVE, http: 422, condition: "A referenced Ingredient has status RETIRED" }
  - { id: ERR_UNAPPROVED_INGREDIENT_SOURCE, http: 422, condition: "No APPROVED SupplierIngredientApproval covers every formula ingredient" }
  - { id: ERR_INCLUSION_SUM_INVALID, http: 422, condition: "FormulaIngredient inclusion_pct sum deviates from 100.00 by more than 0.01" }
  - { id: ERR_SUBSTANTIATION_UNMET, http: 422, condition: "Adequacy-basis gate failed: FORMULATION lacks COMPLIANT profile, or FEEDING_TRIAL lacks PASSED protocol" }
  - { id: ERR_LINE_SCHEDULE_CONFLICT, http: 409, condition: "Requested production window overlaps another active batch on the same line (half-open 8h intervals)" }
  - { id: ERR_BEST_BY_INVALID, http: 422, condition: "best_by_date not strictly after the production date" }
  - { id: ERR_LABEL_REVISION_STALE, http: 422, condition: "label_revision_ref differs from Formula.revision_number at approval time" }
  - { id: ERR_COMPLAINT_SCORE_HOLD, http: 422, condition: "BrandOwner.complaint_score >= 70.0 blocks StateRegistration approval" }
  - { id: ERR_YIELD_VARIANCE_HOLD, http: 422, condition: "|yield_variance_pct| > 5.00 without QualityAnalyst override" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "Uniqueness constraint violated (fein, aafco_name, fsma_facility_id, protocol_code, brand-scoped formula_code, formula-scoped state_code)" }
  - { id: ERR_TRIAL_NOT_FULLY_ENROLLED, http: 422, condition: "start-trial requires enrolled_count >= animal_count" }
  - { id: ERR_TRIAL_COMPLETION_LOW, http: 422, condition: "record-verdict for PASSED requires completion_ratio >= 0.75; lower ratios route to FAILED (no error) — this error raised only when caller requests explicit pass override" }
  - { id: ERR_ADVERSE_CLOSE_FORBIDDEN, http: 422, condition: "close-no-action forbidden when adverse_event_flag is true" }
  - { id: ERR_RECALL_NO_LOTS, http: 422, condition: "begin-effectiveness-check requires affected_lot_count > 0" }
  - { id: ERR_RECALL_SCOPE_EMPTY, http: 422, condition: "Recall initiation found no in-scope batches or lots" }
  - { id: ERR_EFFECTIVENESS_RANGE, http: 422, condition: "effectiveness_pct outside [0, 100]" }
  - { id: ERR_SAMPLE_PENDING, http: 422, condition: "ga-reports generation requires at least one LabSample with verdict != PENDING" }
  - { id: ERR_PROFILE_BASIS_MISMATCH, http: 422, condition: "NutrientProfile created for a FEEDING_TRIAL-basis formula, or trial created for a FORMULATION-basis formula" }
  - { id: ERR_PAGINATION, http: 400, condition: "limit outside [1,100] or offset < 0" }

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix (8 roles)
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Co-manufacturer platform operator; owns master data for brands, suppliers, ingredients registry bootstrap and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /petfood/brand-owners"
      - "POST /petfood/suppliers"
      - "POST /petfood/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: FormulationScientist
    description: "R&D scientist; owns formulas, ingredient masters, nutrient profiles"
    identity: "opaque"
    exclusive_operations:
      - "POST /petfood/ingredients"
      - "POST /petfood/brand-owners/{id}/formulas"
      - "POST /petfood/formulas/{id}/ingredients"
      - "POST /petfood/formulas/{id}/submit-nutrient-review"
      - "POST /petfood/formulas/{id}/nutrient-profiles"
    shared_operations:
      - "GET formula/ingredient/supplier endpoints"
  - name: QAApprover
    description: "Quality assurance approver; decides approvals, substantiation, locks, recalls; must differ from the requester on SoD-guarded operations"
    identity: "opaque"
    exclusive_operations:
      - "POST /petfood/suppliers/{id}/approve"
      - "POST /petfood/suppliers/{id}/suspend"
      - "POST /petfood/supplier-ingredient-approvals/{id}/approve"
      - "POST /petfood/supplier-ingredient-approvals/{id}/reject"
      - "POST /petfood/supplier-ingredient-approvals/{id}/revoke"
      - "POST /petfood/formulas/{id}/request-revision"
      - "POST /petfood/formulas/{id}/substantiate"
      - "POST /petfood/formulas/{id}/lock"
      - "POST /petfood/formulas/{id}/withdraw"
      - "POST /petfood/feeding-trial-protocols/{id}/record-verdict"
      - "POST /petfood/feeding-trial-protocols/{id}/abort"
      - "POST /petfood/complaint-cases/{id}/escalate"
      - "All /petfood/recall-actions* POST endpoints"
    shared_operations:
      - "GET endpoints"
      - "POST /petfood/production-batches/{id}/complete (override flag)"
  - name: QualityAnalyst
    description: "QA analyst; requests supplier-ingredient approvals, runs batch holds, lab samples, GA reports, complaint intake/triage"
    identity: "opaque"
    exclusive_operations:
      - "POST /petfood/supplier-ingredient-approvals"
      - "POST /petfood/production-batches/{id}/hold"
      - "POST /petfood/production-batches/{id}/resume"
      - "POST /petfood/production-batches/{id}/reject"
      - "POST /petfood/production-batches/{id}/lab-samples"
      - "POST /petfood/production-batches/{id}/ga-reports"
      - "POST /petfood/complaint-cases"
      - "POST /petfood/complaint-cases/{id}/triage"
      - "POST /petfood/complaint-cases/{id}/open-investigation"
      - "POST /petfood/complaint-cases/{id}/resolve"
      - "POST /petfood/complaint-cases/{id}/close-no-action"
    shared_operations:
      - "GET endpoints"
      - "POST /petfood/production-batches/{id}/complete"
  - name: TrialCoordinator
    description: "Feeding-trial operations lead; owns protocol lifecycle from creation through observation"
    identity: "opaque"
    exclusive_operations:
      - "POST /petfood/formulas/{id}/feeding-trial-protocols"
      - "POST /petfood/feeding-trial-protocols/{id}/open-enrollment"
      - "POST /petfood/feeding-trial-protocols/{id}/enroll"
      - "POST /petfood/feeding-trial-protocols/{id}/start-trial"
      - "POST /petfood/feeding-trial-protocols/{id}/complete-observation"
    shared_operations:
      - "GET trial endpoints"
  - name: ProductionPlanner
    description: "Supply-chain planner; creates and releases production batches"
    identity: "opaque"
    exclusive_operations:
      - "POST /petfood/formulas/{formula_id}/production-batches"
      - "POST /petfood/production-batches/{id}/release"
    shared_operations:
      - "GET batch/formula endpoints"
  - name: LineOperator
    description: "Production line operator; starts/completes runs and cuts lots"
    identity: "opaque"
    exclusive_operations:
      - "POST /petfood/production-batches/{id}/start-run"
      - "POST /petfood/production-batches/{id}/lots"
    shared_operations:
      - "POST /petfood/production-batches/{id}/complete"
      - "GET batch endpoints"
  - name: RegulatoryAffairs
    description: "Brand-side regulatory affairs specialist; submits and resubmits state registrations"
    identity: "entity_backed:BrandOwner"
    exclusive_operations:
      - "POST /petfood/formulas/{id}/state-registrations"
      - "POST /petfood/state-registrations/{id}/resubmit"
    shared_operations:
      - "GET registration/formula endpoints"
  - name: StateRegulator
    description: "State feed-control official; reviews and decides state registrations"
    identity: "opaque"
    exclusive_operations:
      - "POST /petfood/state-registrations/{id}/accept-for-review"
      - "POST /petfood/state-registrations/{id}/approve"
      - "POST /petfood/state-registrations/{id}/reject"
    shared_operations:
      - "GET registration endpoints"
