      - name: business_code_uniqueness_is_global_for_models_but_scoped_per_chain_for_configurations
        claim_type: Violation -> Error
        grounds:
          - validations[priority=39]
          - errors[ERR_DUPLICATE_RESOURCE_CODE]
          - entities.ChainConfiguration.config_code
        distinguishing_aspect: "The uniqueness scope differs by code: model_code and account_code are global (a second FRY-900 is 409) while config_code is unique only per chain_account_id, so the same CFG-1 is accepted for a second chain account and rejected only on a repeat within the same account."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ELECTRIC model FRY-900; two chain accounts CHN-1 (volume 250) and CHN-2 (volume 60)."
