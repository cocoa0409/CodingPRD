  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: furnace_half_open_window_adjacency
        grounds:
          - calculations.workcenter_selection
          - validations[priority=15]
          - entities.FurnaceCharge.fields.planned_unload
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [planned_load_start, planned_unload) on
          the Furnace resource — a charge starting exactly at another's unload
          (12:00 == 12:00) is legal adjacency, while a strictly interior overlap
          is rejected. Different resource and different interval semantics than
          the work-center turnaround rule.
        test_recipe:
          setup:
            - "Alloy AISI-4140; heat H-5401 CERT_VERIFIED; 6 billets; FUR-1 UP"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-5401", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 6 } ] }, as: SawOperator, captures: { b1: "$.data[0].id", b2: "$.data[1].id", b3: "$.data[2].id", b4: "$.data[3].id", b5: "$.data[4].id", b6: "$.data[5].id" } }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}", "${b2}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T12:00:00Z" }, as: FurnaceOperator, captures: { chg_a: "$.data.id" } }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b3}", "${b4}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T12:00:00Z", planned_unload: "2026-08-02T16:00:00Z" }, as: FurnaceOperator, captures: { chg_b: "$.data.id" } }
          trigger:
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b5}", "${b6}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T10:00:00Z", planned_unload: "2026-08-02T11:00:00Z" }, as: FurnaceOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "charge A [08:00,12:00) created: 201"
            - "charge B [12:00,16:00) created: 201 — adjacency at exactly planned_unload is legal under half-open semantics"
            - "charge C [10:00,11:00) rejected: error_id == ERR_FURNACE_WINDOW_OVERLAP, HTTP 409"

      - name: workcenter_turnaround_buffer_gap
        grounds:
          - calculations.workcenter_selection
          - validations[priority=15]
          - errors[ERR_WORKCENTER_WINDOW_OVERLAP]
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource: ForgeRun windows
          on a WorkCenter require a mandatory 30-minute turnaround buffer —
          adjacency that was legal for furnace charges (gap == 0) is illegal
          here, and only a gap >= 30 minutes passes (exactly 30 allowed).
        test_recipe:
          setup:
            - "Alloy AISI-4140; DIE-19 exists; WC-1/WC-2 PRESS 500t UP; WO-16 and WO-17 released"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /die-sets", payload: { die_set_code: "DIE-19", part_family: "FLG-4", wear_limit_hits: 300, max_resinks: 2 }, as: DieShopTechnician, captures: { die_id: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-1", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc1: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-2", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc2: "$.data.id" } }
            - { call: "POST /work-orders", payload: { order_number: "WO-16", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 4, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_p: "$.data.id", wo_pv: "$.data.version" } }
            - { call: "POST /work-orders", payload: { order_number: "WO-17", customer_name: "BetaForge", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 4, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_q: "$.data.id", wo_qv: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_p}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 4, expected_work_order_version: "${wo_pv}", work_center_id: "${wc1}" }, as: ForgeOperator, captures: { run_a: "$.data.id" } }
            - { call: "GET /work-orders/${wo_p}", payload: {}, as: SalesPlanner, captures: { wo_pv2: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_q}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 4, expected_work_order_version: "${wo_qv}", work_center_id: "${wc2}" }, as: ForgeOperator, captures: { run_d: "$.data.id" } }
          trigger:
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_p}", die_set_id: "${die_id}", planned_start: "2026-08-03T10:45:00Z", planned_end: "2026-08-03T12:00:00Z", planned_qty: 4, expected_work_order_version: "${wo_pv2}", work_center_id: "${wc1}" }, as: ForgeOperator, captures: { err: "$.data.error_id" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_p}", die_set_id: "${die_id}", planned_start: "2026-08-03T11:00:00Z", planned_end: "2026-08-03T12:30:00Z", planned_qty: 4, expected_work_order_version: "${wo_pv2}", work_center_id: "${wc1}" }, as: ForgeOperator, captures: { run_c: "$.data.id" } }
          assert:
            - "run A on WC-1 [09:00,10:30] created; run D on WC-2 same window created (different resource, no conflict)"
            - "run B at 10:45 rejected: 10:45 < 10:30 + 30min -> error_id == ERR_WORKCENTER_WINDOW_OVERLAP, HTTP 409"
            - "run C at 11:00 created: gap exactly 30 minutes is allowed (boundary inclusive)"
            - "failed run B did not bump WorkOrder.version (C succeeds with the same captured version ${wo_pv2})"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: heat_weight_conservation_across_charge_cycles
        grounds:
          - entities.MillHeat.fields.remaining_weight_lbs
          - calculations.heat_remaining_weight
          - state_machines.Billet.CHARGED_to_DISCHARGED
        distinguishing_aspect: |
          Conserved quantity: MASS. Invariant received_weight_lbs ==
          remaining_weight_lbs + sum(cut_weight_lbs over all billets) must hold
          after every step of a charge -> discharge -> scrap cycle; the forward
          (charge) and compensating (discharge) actions leave
          remaining_weight_lbs drift-free at 100.00.
        test_recipe:
          setup:
            - "Alloy AISI-4140; heat H-5501 CERT_VERIFIED, received 200.00 lbs, bar 2.50 lbs/in"
            - "4 billets cut at 10.0 in (25.00 lbs each) -> remaining 100.00"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-5501", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 200.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 10.0, quantity: 4 } ] }, as: SawOperator, captures: { b1: "$.data[0].id", b2: "$.data[1].id", b3: "$.data[2].id", b4: "$.data[3].id" } }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}", "${b2}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T12:00:00Z" }, as: FurnaceOperator, captures: { chg_id: "$.data.id" } }
            - { call: "GET /mill-heats/${heat_id}", payload: {}, as: PlantManager, captures: { rem_after_charge: "$.data.remaining_weight_lbs" } }
            - { call: "POST /furnace-charges/${chg_id}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${chg_id}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /furnace-charges/${chg_id}/discharge", payload: {}, as: FurnaceOperator }
            - { call: "GET /mill-heats/${heat_id}", payload: {}, as: PlantManager, captures: { rem_after_discharge: "$.data.remaining_weight_lbs" } }
            - { call: "POST /billets/${b3}/scrap", payload: { reason: "dropped, dented" }, as: SawOperator }
            - { call: "GET /mill-heats/${heat_id}", payload: {}, as: PlantManager, captures: { rem_after_scrap: "$.data.remaining_weight_lbs", heat_status: "$.data.status" } }
            - { call: "GET /mill-heats/${heat_id}/billets", payload: {}, as: PlantManager, captures: { w1: "$.data[0].cut_weight_lbs", w2: "$.data[1].cut_weight_lbs", w3: "$.data[2].cut_weight_lbs", w4: "$.data[3].cut_weight_lbs" } }
          assert:
            - "rem_after_charge == 100.00 (charging moves no mass)"
            - "rem_after_discharge == 100.00 (discharge compensates charge with zero drift)"
            - "rem_after_scrap == 100.00 (scrapped billet weight does NOT return to the heat)"
            - "invariant: 200.00 == 100.00 + (25.00 + 25.00 + 25.00 + 25.00) at every checkpoint"
            - "heat status still CERT_VERIFIED, not DEPLETED: b1/b2 are DISCHARGED and b4 is CUT (blocking states), only b3 is SCRAPPED"

      - name: run_cancel_restores_workcenter_window
        grounds:
          - state_machines.ForgeRun.SCHEDULED_to_CANCELLED
          - calculations.workcenter_selection
        distinguishing_aspect: |
          Conserved quantity: SCHEDULED MINUTES. Sum of (planned_end -
          planned_start) over non-CANCELLED runs on WC-1 returns to exactly
          180 minutes after create(+90)/cancel(-90)/create(+90); the freed
          window is provably reusable because an identical-window run is
          accepted after the cancel. Different conserved quantity type (time
          vs mass) than the heat-weight invariant.
        test_recipe:
          setup:
            - "Alloy AISI-4140; DIE-20 exists; WC-1 UP; WO-18 released (version tracked via GETs)"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /die-sets", payload: { die_set_code: "DIE-20", part_family: "FLG-4", wear_limit_hits: 300, max_resinks: 2 }, as: DieShopTechnician, captures: { die_id: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-1", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc_id: "$.data.id" } }
            - { call: "POST /work-orders", payload: { order_number: "WO-18", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 4, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_id: "$.data.id", wo_v: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 4, expected_work_order_version: "${wo_v}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_a: "$.data.id" } }
            - { call: "GET /work-orders/${wo_id}", payload: {}, as: SalesPlanner, captures: { wo_v2: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T11:00:00Z", planned_end: "2026-08-03T12:30:00Z", planned_qty: 4, expected_work_order_version: "${wo_v2}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_b: "$.data.id" } }
          trigger:
            - { call: "POST /forge-runs/${run_a}/cancel", payload: {}, as: ForgeOperator, captures: { a_status: "$.data.status" } }
            - { call: "GET /work-orders/${wo_id}", payload: {}, as: SalesPlanner, captures: { wo_v3: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 4, expected_work_order_version: "${wo_v3}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_c: "$.data.id", c_wc: "$.data.work_center_id" } }
          assert:
