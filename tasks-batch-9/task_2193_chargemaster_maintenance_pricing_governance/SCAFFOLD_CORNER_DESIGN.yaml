  - section: endpoints
    instances:
      - name: facility_create_read_patch_and_list_round_trip_with_every_default_materialised
        claim_type: standard_crud
        grounds:
          - endpoints[POST /chargemaster/facilities]
          - endpoints[GET /chargemaster/facilities/{facility_id}]
          - endpoints[PATCH /chargemaster/facilities/{facility_id}]
          - entities.Facility
          - validations[priority=39]
        distinguishing_aspect: "A facility created with only name and cms_certification_number materialises all five governance defaults (NEAREST_DOLLAR, 40000, 10500, 90, STRICT_CODE) with posture OPEN and transparency_status NEEDS_REFRESH at version 1; a second facility reusing CCN-0001 returns ERR_DUPLICATE_KEY; and a single PATCH carrying the observed version rewrites three of those fields at once and bumps the version to 2, visible in the same response and on re-read."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z."
            - "One facility CCN-0001 created with every optional configuration field omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001" }
              as: SystemAdmin
              captures: { fac: $.data.id, rm: $.data.rounding_mode, limit_bp: $.data.aggregate_markup_limit_bp, growth: $.data.volume_growth_bp, lookback: $.data.impact_lookback_days, dup_mode: $.data.duplicate_detection_mode, posture: $.data.chargemaster_posture, v1: $.data.version }
          trigger:
            - call: "GET /chargemaster/facilities/${fac}"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { read_rm: $.data.rounding_mode, read_v: $.data.version, read_status: $.data.transparency_status }
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General Annex", cms_certification_number: "CCN-0001" }
              as: SystemAdmin
              captures: { e_dup: $.data.error_id }
            - call: "PATCH /chargemaster/facilities/${fac}"
              payload: { expected_facility_version: "${read_v}", rounding_mode: "PSYCHOLOGICAL_99", aggregate_markup_limit_bp: 25000, duplicate_detection_mode: "FUZZY_DESCRIPTION" }
              as: SystemAdmin
              captures: { patched_rm: $.data.rounding_mode, patched_limit: $.data.aggregate_markup_limit_bp, patched_mode: $.data.duplicate_detection_mode, v2: $.data.version }
            - call: "GET /chargemaster/facilities/${fac}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { reread_rm: $.data.rounding_mode, reread_growth: $.data.volume_growth_bp, reread_v: $.data.version }
          assert:
            - "${rm} == NEAREST_DOLLAR and ${limit_bp} == 40000 and ${growth} == 10500 and ${lookback} == 90 and ${dup_mode} == STRICT_CODE"
            - "${posture} == OPEN and ${v1} == 1"
            - "${read_rm} == NEAREST_DOLLAR and ${read_v} == 1 and ${read_status} == NEEDS_REFRESH"
            - "${e_dup} == ERR_DUPLICATE_KEY with HTTP 409 (cms_certification_number is globally unique)"
            - "${patched_rm} == PSYCHOLOGICAL_99 and ${patched_limit} == 25000 and ${patched_mode} == FUZZY_DESCRIPTION"
            - "${v2} == 2"
            - "${reread_rm} == PSYCHOLOGICAL_99 and ${reread_growth} == 10500 and ${reread_v} == 2"
            - "Facility.${fac}.active_item_count == 0 and Facility.${fac}.aggregate_markup_ratio_bp == 0"
            - "Facility.${fac}.published_transparency_file_id == null"
            - "listing facilities returns total_count 1"

      - name: contract_creation_and_termination_both_stale_computed_analyses_and_signoff_needs_a_computed_one
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /chargemaster/payer-contracts]
          - endpoints[POST /chargemaster/payer-contracts/{payer_contract_id}/terminate]
          - endpoints[POST /chargemaster/price-change-analyses]
          - endpoints[POST /chargemaster/price-change-analyses/{analysis_id}/sign-off]
          - calculations.payer_impact_delta
          - validations[priority=13]
        distinguishing_aspect: "Both payer-contract writes carry the same cross-entity side effect — creating BCBS and later terminating AETNA each flip every COMPUTED analysis of the facility to STALE — and sign-off is a conditional action that returns ERR_INVALID_ANALYSIS_STATE on a STALE analysis. The recomputed analyses show the LESSER_OF_FEE_SCHEDULE cap producing a zero delta (both 120000 and 144000 percent amounts exceed the 100000 fee schedule) and the terminated AETNA contract dropping out of the FORWARD_PROJECTED set entirely."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001 (NEAREST_CENT), revenue code 0300, department CC-100 (mgr_cath), COST_PLUS_MARKUP rule with the default tiers."
            - "ACTIVE item CDM-1001: cost 100000, gross 240000."
            - "PayerContract AETNA / COMMERCIAL PERCENT_OF_CHARGE 4000 bp, 2026-01-01..2026-12-31, trailing_units 100 (ACTIVE)."
            - "ChangeRequest from mgr_cath proposing cost 120000 (new gross 288000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
