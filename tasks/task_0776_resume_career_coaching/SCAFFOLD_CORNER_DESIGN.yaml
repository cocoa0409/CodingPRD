  - section: cross_cutting
    instances:
      - name: occ_stale_order_version_on_second_booking_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[session-book-stale-order]", "errors[ERR_STALE_VERSION]", "validations[priority=11]"]
        distinguishing_aspect: "After a successful booking advances Order.version, a second booking still carrying the pre-booking expected_order_version is rejected with ERR_STALE_VERSION (412) — two strictly sequential requests."
        test_recipe:
          setup:
            - "PRO plan with 2 included sessions; confirmed order; version v0 captured before any booking; one session booked at v0 (version now advanced)."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 2, guarantee_type: "NONE" }
