# =============================================================================
# PRD Benchmark Scaffold — Seed Tables (§1.0 – §1.7)
# Task 2312 — Consumer Affairs & Product Quality Contact Center
# Difficulty target: expert_plus (harder than Expert band)
# =============================================================================

scenario: |
  2312. Consumer Affairs & Product Quality Contact Center (consumer packaged goods consumer
  relations): contact intake across phone, email, social and web with product identification
  from batch codes, complaint categorization by type including foreign material, illness,
  packaging and quality with severity triage, adverse event and illness reports escalated to
  regulatory and quality with required reporting evaluation, sample retrieval requests from
  consumers with shipping kits and chain-of-custody handling, goodwill resolution with coupon,
  refund and replacement authority tiers, complaint rate monitoring per million units by plant,
  line and code date, trend detection triggering quality investigations and potential recall
  evaluation, response templates, approval controls and consumer sentiment reporting

domain_name: consumer-affairs-quality-contact
api_prefix: "/"

# -----------------------------------------------------------------------------
# Complexity profile (§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: workflow orchestration
  difficulty: expert_plus
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Two independent state dimensions on Complaint (handling_status x regulatory_status) run in
    parallel; SignalMembership is a true many-to-many junction between Complaint and TrendSignal;
    Complaint.duplicate_of_complaint_id is self-referential; goodwill ledgers are maintained on
    both Consumer and ProductionLot (cross-aggregate derived fields). Every quantitative rule has
    a provisional (intake-time) and an adjudicated (triage-time) variant.

# -----------------------------------------------------------------------------
# §1.0 Response envelope (FIXED — do not modify)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table (15 entities)
# -----------------------------------------------------------------------------
entities:

  - name: StaffUser
    parent: null
    common_fields: true
    description: An internal actor. Backs the CareAgent / CareSupervisor / QualityLead / RegulatoryOfficer roles via the X-User-ID header.
    fields:
      - name: staff_code
        type: string
        source: input
        required: true
        description: Unique human-readable staff identifier.
        constraints: "1..32 chars, unique across StaffUser"
      - name: full_name
        type: string
        source: input
        required: true
        description: Display name.
      - name: role
        type: enum
        source: input
        required: true
        description: "The single role this staff member holds."
        constraints: "one of CARE_AGENT | CARE_SUPERVISOR | QUALITY_LEAD | REGULATORY_OFFICER"
      - name: authority_tier
        type: enum
        source: input
        required: false
        default: TIER_1
        description: Maximum goodwill authority tier this staff member may approve.
        constraints: "one of TIER_1 | TIER_2 | TIER_3"
      - name: is_active
        type: boolean
        source: input
        required: false
        default: true
        description: Inactive staff cannot act; requests stamped with an inactive staff id are rejected.

  - name: Consumer
    parent: null
    common_fields: true
    description: The external person who contacted the company. Backs the Consumer role.
    fields:
      - name: external_ref
        type: string
        source: input
        required: true
        description: Unique consumer reference from the CRM.
        constraints: "unique across Consumer"
      - name: full_name
        type: string
        source: input
        required: true
        description: Consumer name.
      - name: email
        type: string
        source: input
        required: false
        default: null
        description: Contact email.
      - name: phone
        type: string
        source: input
        required: false
        default: null
        description: Contact phone.
      - name: postal_code
        type: string
        source: input
        required: false
        default: null
        description: Shipping postal code; required before a sample kit can ship.
      - name: is_vulnerable_flag
        type: boolean
        source: input
        required: false
        default: false
        description: Consumer belongs to a vulnerable cohort (minor, elderly, immunocompromised).
      - name: sentiment_index
        type: number
        source: computed
        required: true
        description: "Recomputed on every read of GET /consumers/{id} by calculation consumer_sentiment_index (agent_view variant)."
        constraints: "0.00..100.00, 2dp"
      - name: goodwill_authorized_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: Running total of payout_cents over all remedies ever APPROVED for this consumer.
      - name: goodwill_outstanding_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: Approved-but-not-yet-fulfilled goodwill for this consumer.
      - name: goodwill_paid_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: Fulfilled goodwill for this consumer.
      - name: goodwill_voided_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: "Goodwill reversed after approval or after fulfilment. Invariant: paid + outstanding + voided == authorized."
      - name: open_kit_count
        type: integer
        source: computed
        required: true
        default: 0
        description: Number of SampleKits for this consumer in REQUESTED / SHIPPED / IN_TRANSIT_INBOUND / RECEIVED.
      - name: complaint_count
        type: integer
        source: computed
        required: true
        default: 0
        description: Number of Complaints filed by this consumer, excluding those in DUPLICATE.

  - name: Plant
    parent: null
    common_fields: true
    description: A manufacturing plant.
    fields:
      - name: plant_code
        type: string
        source: input
        required: true
        description: Unique plant code.
        constraints: "unique across Plant"
      - name: name
        type: string
        source: input
        required: true
        description: Plant name.
      - name: region
        type: enum
        source: input
        required: true
        description: Region code.
        constraints: "one of MW | NE | SE | WEST"
      - name: oversight_posture
        type: enum
        source: computed
        required: true
        default: NORMAL
        description: "Derived by calculation plant_oversight_posture from the plant's TrendSignal population (compound state)."
        constraints: "one of NORMAL | WATCH | INVESTIGATION_HOLD"
      - name: open_investigation_count
        type: integer
        source: computed
        required: true
        default: 0
        description: TrendSignals scoped to this plant in INVESTIGATION_OPEN or RECALL_EVALUATION.
      - name: recall_initiated_count
        type: integer
        source: computed
        required: true
        default: 0
        description: TrendSignals scoped to this plant in RECALL_INITIATED.

  - name: ProductionLine
    parent: Plant
    common_fields: true
    description: A packaging/production line inside a plant.
    fields:
      - name: plant_id
        type: string
        source: input
        required: true
        description: "FK -> Plant.id; immutable after creation."
      - name: line_code
        type: string
        source: input
        required: true
        description: Line code.
        constraints: "unique within plant_id"
      - name: nominal_units_per_hour
        type: integer
        source: input
        required: true
        description: Rated throughput.
        constraints: ">= 1"
      - name: lot_count
        type: integer
        source: computed
        required: true
        default: 0
        description: Number of ProductionLots produced on this line.

  - name: Product
    parent: null
    common_fields: true
    description: A finished-goods SKU.
    fields:
      - name: sku
        type: string
        source: input
        required: true
        description: Unique SKU code.
        constraints: "unique across Product"
      - name: name
        type: string
        source: input
        required: true
        description: Product name.
      - name: category
        type: enum
        source: input
        required: true
        description: Merchandising category.
        constraints: "one of SNACK | BEVERAGE | DAIRY | NON_FOOD"
      - name: is_regulated_food
        type: boolean
        source: input
        required: true
        description: When true, severity scoring applies the regulated multiplier and illness complaints are auto-escalated to regulatory.
      - name: unit_retail_price_cents
        type: integer
        source: input
        required: true
        description: Retail price of one consumer unit, in cents.
        constraints: ">= 1"
      - name: units_per_case
        type: integer
        source: input
        required: true
        description: Consumer units per shipping case.
        constraints: ">= 1"

  - name: ProductionLot
    parent: null
    common_fields: true
    description: A single production run identified by a batch code and a code date. The denominator for complaint-rate monitoring.
    fields:
      - name: product_id
        type: string
        source: input
        required: true
        description: "FK -> Product.id; immutable after creation."
      - name: production_line_id
        type: string
        source: input
        required: true
        description: "FK -> ProductionLine.id; immutable after creation."
      - name: batch_code
        type: string
        source: input
        required: true
        description: Batch code exactly as printed on pack.
      - name: normalized_batch_code
        type: string
        source: computed
        required: true
        description: "Uppercased batch_code with every non-alphanumeric character removed (calculation batch_code_resolution)."
      - name: code_date
        type: datetime
        source: input
        required: true
        description: Production code date (UTC midnight).
      - name: units_produced
        type: integer
        source: input
        required: true
        description: Consumer units produced in this lot; complaint-rate denominator.
        constraints: ">= 0"
      - name: release_status
        type: enum
        source: computed
        required: true
        default: RELEASED
        description: Quality disposition of the lot.
        constraints: "one of RELEASED | HOLD | WITHDRAWN"
      - name: linked_complaint_count
        type: integer
        source: computed
        required: true
        default: 0
        description: "Total complaints ever linked to this lot. Invariant: linked_complaint_count == provisional_complaint_count + adjudicated_complaint_count + duplicate_complaint_count."
      - name: provisional_complaint_count
        type: integer
        source: computed
        required: true
        default: 0
        description: Linked complaints that are not DUPLICATE and have no adjudicated severity yet.
      - name: adjudicated_complaint_count
        type: integer
        source: computed
        required: true
        default: 0
        description: Linked complaints that are not DUPLICATE and carry an adjudicated severity.
      - name: duplicate_complaint_count
        type: integer
        source: computed
        required: true
        default: 0
        description: Linked complaints currently in handling_status DUPLICATE.
      - name: goodwill_charged_cents
        type: integer
        source: computed
        required: true
        default: 0
        description: Sum of payout_cents of remedies FULFILLED against complaints linked to this lot; decremented when such a remedy is voided after fulfilment.

  - name: Contact
    parent: null
    common_fields: true
    description: One inbound consumer touch on one channel. A contact may spawn zero, one or many complaints.
    fields:
      - name: consumer_id
        type: string
        source: input
        required: true
        description: "FK -> Consumer.id; immutable after creation."
      - name: channel
        type: enum
        source: input
        required: true
        description: Intake channel.
        constraints: "one of PHONE | EMAIL | SOCIAL | WEB"
      - name: received_at
        type: datetime
        source: input
        required: true
        description: When the contact arrived. Must not be in the future relative to the logical clock.
      - name: raw_message
        type: string
        source: input
        required: true
        description: Verbatim consumer text or call summary.
        constraints: "1..4000 chars"
      - name: handle_or_address
        type: string
        source: input
        required: false
        default: null
        description: Social handle / email / phone the contact came from.
      - name: status
        type: enum
        source: computed
        required: true
        default: OPEN
        description: Contact lifecycle.
        constraints: "one of OPEN | LOGGED | CLOSED_NO_COMPLAINT"
      - name: complaint_count
        type: integer
        source: computed
        required: true
        default: 0
        description: Complaints created from this contact.
      - name: intake_agent_ref
        type: string
        source: system
        required: true
        description: "Actor stamp: the StaffUser.id taken from the X-User-ID header at creation. Audit-only, not a navigable relationship."

  - name: Complaint
    parent: null
    common_fields: true
    description: A categorized consumer complaint. Carries TWO independent state dimensions (handling_status and regulatory_status) that advance independently of one another.
    fields:
      - name: contact_id
        type: string
        source: input
        required: true
        description: "FK -> Contact.id; immutable after creation."
      - name: consumer_id
        type: string
        source: computed
        required: true
        description: "FK -> Consumer.id; copied from the parent Contact at creation."
      - name: product_id
        type: string
        source: computed
        required: false
        default: null
        description: "FK -> Product.id; resolved from the reported batch code, or copied from the resolved lot."
      - name: lot_id
        type: string
        source: computed
        required: false
        default: null
        description: "FK -> ProductionLot.id; resolved by calculation batch_code_resolution."
      - name: duplicate_of_complaint_id
        type: string
        source: computed
        required: false
        default: null
        description: "FK -> Complaint.id; self-referential pointer set when this complaint is marked a duplicate."
      - name: responded_template_id
        type: string
        source: computed
        required: false
        default: null
        description: "FK -> ResponseTemplate.id; the template used for the consumer response."
      - name: reported_batch_code
        type: string
        source: input
        required: false
        default: null
        description: Batch code as read by the consumer off the pack; normalized before matching.
      - name: pack_code_date
        type: datetime
        source: input
        required: false
        default: null
        description: Code date read off the pack; the tie-breaker when a normalized batch code matches more than one lot.
      - name: complaint_type
        type: enum
        source: input
        required: true
        description: Primary complaint category.
        constraints: "one of FOREIGN_MATERIAL | ILLNESS | PACKAGING | QUALITY"
      - name: foreign_object_class
        type: enum
        source: input
        required: false
        default: NONE
        description: Hazard class of the foreign object described by the consumer.
        constraints: "one of NONE | SOFT | HARD_BLUNT | HARD_SHARP"
      - name: medical_attention_sought
        type: boolean
        source: input
        required: false
        default: false
        description: Consumer sought medical attention.
      - name: hospitalization
        type: boolean
        source: input
        required: false
        default: false
        description: Consumer was hospitalized.
      - name: symptom_codes
        type: array
        source: input
        required: false
        default: []
        description: Reported symptom codes; only the first SYMPTOM_CODE_CAP entries score.
        constraints: "array of string, 0..12 entries, each 1..16 chars"
      - name: units_claimed
        type: integer
        source: input
        required: false
        default: 1
        description: Consumer units affected; caps refund and replacement goodwill.
        constraints: "1..100"
      - name: product_identification_status
        type: enum
        source: computed
        required: true
        default: UNRESOLVED
        description: Outcome of batch-code resolution.
        constraints: "one of UNRESOLVED | RESOLVED"
      - name: provisional_severity_score
        type: number
        source: computed
        required: true
        description: "calculation complaint_severity_score, variant intake_provisional. 2dp."
      - name: provisional_severity_band
        type: enum
        source: computed
        required: true
        description: Band derived from provisional_severity_score.
        constraints: "one of S1 | S2 | S3 | S4"
      - name: adjudicated_severity_score
        type: number
        source: computed
        required: false
        default: null
        description: "calculation complaint_severity_score, variant triage_adjudicated. Null until triage. 2dp."
      - name: adjudicated_severity_band
        type: enum
        source: computed
        required: false
        default: null
        description: Band derived from adjudicated_severity_score.
        constraints: "one of S1 | S2 | S3 | S4, or null"
      - name: effective_severity_band
        type: enum
        source: computed
        required: true
        description: adjudicated_severity_band when present, otherwise provisional_severity_band.
        constraints: "one of S1 | S2 | S3 | S4"
      - name: handling_status
        type: enum
        source: computed
        required: true
        default: INTAKE
        description: Care-workflow dimension.
        constraints: "one of INTAKE | TRIAGED | AWAITING_SAMPLE | IN_RESOLUTION | ON_QUALITY_HOLD | RESOLVED | CLOSED | DUPLICATE"
      - name: regulatory_status
        type: enum
        source: computed
        required: true
        default: NOT_APPLICABLE
        description: Regulatory dimension, advanced independently of handling_status.
        constraints: "one of NOT_APPLICABLE | ESCALATED | REPORTABLE | NOT_REPORTABLE | SUBMITTED"
      - name: pre_hold_handling_status
        type: enum
        source: computed
        required: false
        default: null
        description: The handling_status the complaint occupied immediately before entering ON_QUALITY_HOLD; used to return it on hold release.
        constraints: "one of TRIAGED | AWAITING_SAMPLE | IN_RESOLUTION, or null"
      - name: responded_at
        type: datetime
        source: computed
        required: false
        default: null
        description: When the templated consumer response was sent.
      - name: triaged_by_ref
        type: string
        source: computed
        required: false
        default: null
        description: "Actor stamp: StaffUser.id that adjudicated severity. Audit-only, not a navigable relationship."
      - name: created_by_ref
        type: string
        source: system
        required: true
        description: "Actor stamp: StaffUser.id from the X-User-ID header at creation. Audit-only, not a navigable relationship."
      - name: linked_signal_count
        type: integer
        source: computed
        required: true
        default: 0
        description: Number of SignalMemberships that reference this complaint.

  - name: SampleKit
    parent: null
    common_fields: true
    description: A retrieval kit mailed to a consumer to recover the complained-of product, with chain-of-custody handling.
    fields:
      - name: complaint_id
        type: string
        source: input
        required: true
        description: "FK -> Complaint.id; immutable after creation."
      - name: consumer_id
        type: string
        source: computed
        required: true
        description: "FK -> Consumer.id; copied from the complaint at creation."
      - name: kit_code
        type: string
        source: input
        required: true
        description: Unique kit code printed on the label.
        constraints: "unique across SampleKit"
      - name: seal_id_issued
        type: string
        source: input
        required: true
        description: Tamper-seal identifier packed with the kit.
      - name: status
        type: enum
        source: computed
        required: true
        default: REQUESTED
        description: Kit lifecycle.
        constraints: "one of REQUESTED | SHIPPED | IN_TRANSIT_INBOUND | RECEIVED | LAB_ACCEPTED | EXPIRED | CANCELLED"
      - name: shipped_at
        type: datetime
        source: computed
        required: false
        default: null
        description: When the kit was dispatched to the consumer.
      - name: expected_return_by
        type: datetime
        source: computed
        required: false
        default: null
        description: shipped_at + KIT_RETURN_WINDOW_DAYS. Past this instant an ops run expires the kit.
      - name: occupied_from
        type: datetime
        source: computed
        required: false
        default: null
        description: shipped_at minus KIT_COOLDOWN_HOURS; start of the closed interval during which this consumer cannot hold another kit.
      - name: occupied_until
        type: datetime
        source: computed
        required: false
        default: null
        description: expected_return_by plus KIT_COOLDOWN_HOURS; end (inclusive) of that closed interval.
      - name: received_at
        type: datetime
        source: computed
        required: false
        default: null
        description: When the lab logged the inbound kit.
      - name: seal_id_returned
        type: string
        source: computed
        required: false
        default: null
        description: Seal observed on the LAB_RECEIVED custody event.
      - name: transit_hours
        type: number
        source: computed
        required: false
        default: null
        description: Hours between the CARRIER_PICKUP and LAB_RECEIVED custody events, 2dp.
      - name: chain_integrity_status
        type: enum
        source: computed
        required: true
        default: PENDING
        description: "calculation custody_chain_integrity projection over the kit's custody events."
        constraints: "one of PENDING | INTACT | BROKEN"
      - name: disposition
        type: enum
        source: computed
        required: true
        default: PENDING
        description: Lab usability verdict; forced to UNUSABLE when the chain is BROKEN.
        constraints: "one of PENDING | USABLE | UNUSABLE"
      - name: custody_event_count
        type: integer
        source: computed
        required: true
        default: 0
        description: Number of appended custody events.

  - name: CustodyEvent
    parent: SampleKit
    common_fields: false
    description: An immutable append-only chain-of-custody record. No version, no updated_at, no mutation endpoint.
    fields:
      - name: id
        type: string
        source: system
        required: true
        description: Server-generated identifier.
      - name: created_at
        type: datetime
        source: system
        required: true
        description: Server insert timestamp (logical clock).
      - name: sample_kit_id
        type: string
        source: input
        required: true
        description: "FK -> SampleKit.id; immutable."
      - name: sequence_no
        type: integer
        source: computed
        required: true
        description: 1-based append position within the kit's chain.
      - name: event_type
        type: enum
        source: input
        required: true
        description: Custody step being recorded.
        constraints: "one of KIT_ISSUED | CONSUMER_SEALED | CARRIER_PICKUP | LAB_RECEIVED | LAB_OPENED"
      - name: occurred_at
        type: datetime
        source: input
        required: true
        description: Physical time of the custody step; must be >= the previous event's occurred_at.
      - name: actor_label
        type: string
        source: input
        required: true
        description: Free-text label of the physical custodian.
      - name: seal_id_observed
        type: string
        source: input
        required: false
        default: null
        description: Seal identifier read at this step.
      - name: notes
        type: string
        source: input
        required: false
        default: null
        description: Observation notes.

  - name: Remedy
    parent: null
    common_fields: true
    description: A goodwill resolution offered to the consumer, subject to authority tiers and segregation-of-duties approval.
    fields:
      - name: complaint_id
        type: string
        source: input
        required: true
        description: "FK -> Complaint.id; immutable after creation."
      - name: consumer_id
        type: string
        source: computed
        required: true
        description: "FK -> Consumer.id; copied from the complaint at creation."
      - name: remedy_type
        type: enum
        source: input
        required: true
        description: Form of goodwill.
        constraints: "one of COUPON | REFUND | REPLACEMENT"
      - name: requested_value_cents
        type: integer
        source: input
        required: true
        description: Value the agent asks for, in cents; capped per remedy_type by calculation goodwill_authorization.
        constraints: "1..999999"
      - name: base_value_cents
        type: integer
        source: computed
        required: true
        description: Capped and credited base value before uplift.
      - name: uplift_pct
        type: number
        source: computed
        required: true
        description: Uplift rate selected from base_value_cents alone, 2dp.
      - name: uplift_cents
        type: integer
        source: computed
        required: true
        description: round_half_up(base_value_cents * uplift_pct) in whole cents.
      - name: payout_cents
        type: integer
        source: computed
        required: true
        description: base_value_cents + uplift_cents.
      - name: authority_tier_required
        type: enum
        source: computed
        required: true
        description: Tier a decider must hold to approve this remedy, banded from payout_cents.
        constraints: "one of TIER_1 | TIER_2 | TIER_3"
      - name: kit_returned_credit_applied
        type: boolean
        source: computed
        required: true
        default: false
        description: True when the SAMPLE_RETURN_CREDIT_CENTS was added because the complaint's kit reached LAB_ACCEPTED.
      - name: status
        type: enum
        source: computed
        required: true
        default: DRAFT
        description: Remedy approval lifecycle; cyclic through REVISION_REQUESTED.
        constraints: "one of DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | REJECTED | FULFILLED | SUPERSEDED | VOIDED_BY_HOLD | VOIDED_AFTER_FULFILLMENT"
      - name: revision_count
        type: integer
        source: computed
        required: true
        default: 0
        description: Times this remedy has been sent back for revision; capped at MAX_REMEDY_REVISIONS.
      - name: authored_by_ref
        type: string
        source: system
        required: true
        description: "Actor stamp: StaffUser.id from X-User-ID at creation. Audit-only, not a navigable relationship."
      - name: decided_by_ref
        type: string
        source: computed
        required: false
        default: null
        description: "Actor stamp: StaffUser.id that decided the remedy. Must differ from authored_by_ref. Audit-only."
      - name: fulfilled_at
        type: datetime
        source: computed
        required: false
        default: null
        description: When the goodwill was issued.

  - name: RegulatoryReport
    parent: null
    common_fields: true
    description: A regulatory escalation record for an adverse event, illness or injury complaint, with a reportability determination and a submission deadline.
    fields:
      - name: complaint_id
        type: string
        source: input
        required: true
        description: "FK -> Complaint.id; immutable after creation. At most one non-WITHDRAWN report per complaint."
      - name: report_kind
        type: enum
        source: input
        required: true
        description: Escalation category.
        constraints: "one of ADVERSE_EVENT | ILLNESS_CLUSTER | FOREIGN_MATERIAL_INJURY"
      - name: status
        type: enum
        source: computed
        required: true
        default: OPEN
        description: Determination and submission lifecycle.
        constraints: "one of OPEN | DETERMINED_REPORTABLE | DETERMINED_NOT_REPORTABLE | SUBMITTED | WITHDRAWN"
      - name: escalated_at
        type: datetime
        source: computed
        required: true
        description: Logical-clock instant the report was opened.
      - name: due_at
        type: datetime
        source: computed
        required: true
        description: "calculation regulatory_due_at: escalated_at + 24h when the complaint's effective band is S1, else + 72h."
      - name: determination_note
        type: string
        source: computed
        required: false
        default: null
        description: Rationale recorded with the reportability determination.
      - name: determined_by_ref
        type: string
        source: computed
        required: false
        default: null
        description: "Actor stamp: StaffUser.id that made the determination. Audit-only."
      - name: submitted_by_ref
        type: string
        source: computed
        required: false
        default: null
        description: "Actor stamp: StaffUser.id that submitted to the agency; must differ from determined_by_ref. Audit-only."
      - name: submitted_at
        type: datetime
        source: computed
        required: false
        default: null
        description: Logical-clock instant of agency submission.
      - name: submitted_late
        type: boolean
        source: computed
        required: false
        default: null
        description: "True when submitted_at > due_at (strict). Null until submission."
      - name: agency_reference
        type: string
        source: computed
        required: false
        default: null
        description: Agency acknowledgement reference captured at submission.

  - name: TrendSignal
    parent: null
    common_fields: true
    description: A detected complaint-rate excursion at LOT, LINE or PLANT scope over a half-open time window, which may escalate to a recall evaluation.
    fields:
      - name: scope_level
        type: enum
        source: input
        required: true
        description: Aggregation scope of this signal.
        constraints: "one of LOT | LINE | PLANT"
      - name: plant_id
        type: string
        source: input
        required: true
        description: "FK -> Plant.id; always populated regardless of scope_level."
      - name: production_line_id
        type: string
        source: input
        required: false
        default: null
        description: "FK -> ProductionLine.id; required when scope_level is LINE or LOT, else must be null."
      - name: lot_id
        type: string
        source: input
        required: false
        default: null
        description: "FK -> ProductionLot.id; required when scope_level is LOT, else must be null."
      - name: window_start
        type: datetime
        source: input
        required: true
        description: Inclusive start of the detection window.
      - name: window_end
        type: datetime
        source: input
        required: true
        description: Exclusive end of the detection window; must be strictly after window_start.
      - name: weighted_complaint_count
        type: number
        source: computed
        required: true
        description: Severity-weighted complaint count inside the window, 2dp.
      - name: units_in_scope
        type: integer
        source: computed
        required: true
        description: Sum of units_produced over lots in scope; the ppm denominator.
      - name: observed_rate_ppm
        type: number
        source: computed
        required: true
        description: "calculation trend_signal_evaluation: weighted_complaint_count / units_in_scope * 1000000, 2dp."
      - name: threshold_ppm
        type: number
        source: computed
        required: true
        description: The scope-specific threshold that was compared against observed_rate_ppm.
      - name: status
        type: enum
        source: computed
        required: true
        default: DETECTED
        description: Investigation lifecycle (branching).
        constraints: "one of DETECTED | INVESTIGATION_OPEN | DISMISSED | RECALL_EVALUATION | CLOSED_NO_ACTION | RECALL_INITIATED"
      - name: detection_source
        type: enum
        source: computed
        required: true
        description: How the signal came to exist.
        constraints: "one of OPS_RUN | MANUAL"
      - name: membership_count
        type: integer
        source: computed
        required: true
        default: 0
        description: Complaints attached to this signal via SignalMembership.
      - name: opened_by_ref
        type: string
        source: computed
        required: false
        default: null
        description: "Actor stamp: StaffUser.id that opened the investigation. Audit-only."

  - name: SignalMembership
    parent: TrendSignal
    common_fields: false
    description: Immutable many-to-many junction recording which complaint contributed which severity weight to which signal. No version, no update endpoint.
    fields:
      - name: id
        type: string
        source: system
        required: true
        description: Server-generated identifier.
      - name: created_at
        type: datetime
        source: system
        required: true
        description: Server insert timestamp (logical clock).
      - name: trend_signal_id
        type: string
        source: system
        required: true
        description: "FK -> TrendSignal.id; immutable."
      - name: complaint_id
        type: string
        source: system
        required: true
        description: "FK -> Complaint.id; immutable."
      - name: severity_weight
        type: number
        source: computed
        required: true
        description: SEVERITY_WEIGHT of the complaint's effective band at the moment of detection, 2dp.
      - name: included_variant
        type: enum
        source: computed
        required: true
        description: Which severity variant supplied the weight.
        constraints: "one of PROVISIONAL | ADJUDICATED"

  - name: ResponseTemplate
    parent: null
    common_fields: true
    description: An approved consumer-response template, gated by complaint type and severity band.
    fields:
      - name: template_code
        type: string
        source: input
        required: true
        description: Unique template code.
        constraints: "unique across ResponseTemplate"
      - name: title
        type: string
        source: input
        required: true
        description: Template title.
      - name: body
        type: string
        source: input
        required: true
        description: Template body text.
        constraints: "1..4000 chars"
      - name: applies_to_type
        type: enum
        source: input
        required: true
        description: Complaint type this template may answer; ANY matches all types.
        constraints: "one of FOREIGN_MATERIAL | ILLNESS | PACKAGING | QUALITY | ANY"
      - name: max_band_allowed
        type: enum
        source: input
        required: true
        description: Most severe band this template may answer; S1 is the most severe, S4 the least.
        constraints: "one of S1 | S2 | S3 | S4"
      - name: requires_supervisor_approval
        type: boolean
        source: input
        required: false
        default: false
        description: When true only CareSupervisor may send this template.
      - name: status
        type: enum
        source: computed
        required: true
        default: DRAFT
        description: Publication lifecycle.
        constraints: "one of DRAFT | ACTIVE | RETIRED"
      - name: usage_count
        type: integer
        source: computed
        required: true
        default: 0
        description: Number of complaints answered with this template.

# -----------------------------------------------------------------------------
# §1.2 State Machine Table (10 machines; 2 parallel dimensions on Complaint)
# -----------------------------------------------------------------------------
state_machines:

  - entity: Contact
    dimension: status
    initial_state: OPEN
    terminal_states: [CLOSED_NO_COMPLAINT]
    shape: branching
    transitions:
      - from: OPEN
        to: LOGGED
        trigger: "POST /complaints"
        actor: CareAgent
        preconditions:
          - "Contact.status is OPEN or LOGGED"
        side_effects:
          - "Contact.complaint_count += 1"
          - "Consumer.complaint_count += 1"
      - from: LOGGED
        to: LOGGED
        trigger: "POST /complaints"
        actor: CareAgent
        preconditions:
          - "Contact.status is LOGGED"
        side_effects:
          - "Contact.complaint_count += 1"
          - "Consumer.complaint_count += 1"
      - from: OPEN
        to: CLOSED_NO_COMPLAINT
        trigger: "POST /contacts/{id}/close-no-complaint"
        actor: CareAgent
        preconditions:
          - "Contact.complaint_count == 0"
        side_effects: []

  - entity: Complaint
    dimension: handling_status
    initial_state: INTAKE
    terminal_states: [CLOSED]
    shape: cyclic
    description: |
      Care-workflow dimension. Cycles exist through ON_QUALITY_HOLD (hold then release returns the
      complaint to pre_hold_handling_status) and through DUPLICATE (mark then unmark restores).
    transitions:
      - from: INTAKE
        to: TRIAGED
        trigger: "POST /complaints/{id}/triage"
        actor: CareSupervisor
        preconditions:
          - "Complaint.handling_status is INTAKE"
          - "Complaint.product_identification_status is RESOLVED"
        side_effects:
          - "adjudicated_severity_score / adjudicated_severity_band computed via complaint_severity_score variant triage_adjudicated"
          - "effective_severity_band switches to adjudicated_severity_band"
          - "ProductionLot.provisional_complaint_count -= 1, ProductionLot.adjudicated_complaint_count += 1"
          - "when adjudicated_severity_band is S1 or S2 and complaint_type is ILLNESS or FOREIGN_MATERIAL: a RegulatoryReport is auto-created and regulatory_status becomes ESCALATED"
          - "when adjudicated_severity_band is S1: the linked ProductionLot moves RELEASED -> HOLD"
          - "Plant.oversight_posture is re-derived"
      - from: TRIAGED
        to: AWAITING_SAMPLE
        trigger: "POST /sample-kits"
        actor: CareAgent
        preconditions:
          - "Complaint.handling_status is TRIAGED"
        side_effects:
          - "Consumer.open_kit_count += 1"
      - from: AWAITING_SAMPLE
        to: IN_RESOLUTION
        trigger: "POST /sample-kits/{id}/lab-accept"
        actor: QualityLead
        preconditions:
          - "SampleKit.status is RECEIVED"
        side_effects:
          - "Consumer.open_kit_count -= 1"
      - from: AWAITING_SAMPLE
        to: IN_RESOLUTION
        trigger: "POST /sample-kits/{id}/cancel"
        actor: CareSupervisor
        preconditions:
          - "SampleKit.status is REQUESTED or SHIPPED"
        side_effects:
          - "Consumer.open_kit_count -= 1"
      - from: TRIAGED
        to: IN_RESOLUTION
        trigger: "POST /complaints/{id}/respond"
        actor: CareAgent
        preconditions:
          - "Complaint.handling_status is TRIAGED"
          - "ResponseTemplate.status is ACTIVE"
          - "the linked ProductionLot.release_status is not WITHDRAWN"
        side_effects:
          - "Complaint.responded_at set to the logical clock; responded_template_id set"
          - "ResponseTemplate.usage_count += 1"
      - from: IN_RESOLUTION
        to: ON_QUALITY_HOLD
        trigger: "POST /complaints/{id}/quality-hold"
        actor: QualityLead
        preconditions:
          - "Complaint.handling_status is TRIAGED, AWAITING_SAMPLE or IN_RESOLUTION"
        side_effects:
          - "pre_hold_handling_status records the departing state"
          - "every Remedy on this complaint in DRAFT, SUBMITTED, REVISION_REQUESTED or APPROVED moves to VOIDED_BY_HOLD"
          - "for each remedy voided from APPROVED: Consumer.goodwill_outstanding_cents -= payout_cents and Consumer.goodwill_voided_cents += payout_cents"
      - from: ON_QUALITY_HOLD
        to: IN_RESOLUTION
        trigger: "POST /complaints/{id}/release-hold"
        actor: QualityLead
        preconditions:
          - "Complaint.handling_status is ON_QUALITY_HOLD"
          - "no TrendSignal containing this complaint is in RECALL_EVALUATION"
        side_effects:
          - "handling_status returns to pre_hold_handling_status; pre_hold_handling_status cleared"
      - from: IN_RESOLUTION
        to: RESOLVED
        trigger: "POST /complaints/{id}/resolve"
        actor: CareAgent
        preconditions:
          - "Complaint.handling_status is IN_RESOLUTION"
          - "Complaint.responded_at is not null"
          - "no Remedy on this complaint is in DRAFT, SUBMITTED, REVISION_REQUESTED or APPROVED"
        side_effects: []
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /complaints/{id}/close"
        actor: CareSupervisor
        preconditions:
          - "Complaint.handling_status is RESOLVED"
          - "Complaint.regulatory_status is NOT_APPLICABLE, NOT_REPORTABLE or SUBMITTED"
        side_effects: []
      - from: INTAKE
        to: DUPLICATE
        trigger: "POST /complaints/{id}/mark-duplicate"
        actor: CareSupervisor
        preconditions:
          - "Complaint.handling_status is INTAKE or TRIAGED"
          - "the target complaint exists, is not itself DUPLICATE, and is a different complaint"
          - "the target complaint has the same consumer_id"
        side_effects:
          - "duplicate_of_complaint_id set"
          - "ProductionLot.duplicate_complaint_count += 1 and the matching provisional/adjudicated bucket -= 1"
          - "Consumer.complaint_count -= 1"
      - from: TRIAGED
        to: DUPLICATE
        trigger: "POST /complaints/{id}/mark-duplicate"
        actor: CareSupervisor
        preconditions:
          - "Complaint.handling_status is TRIAGED"
        side_effects:
          - "duplicate_of_complaint_id set"
          - "ProductionLot.duplicate_complaint_count += 1 and adjudicated_complaint_count -= 1"
          - "Consumer.complaint_count -= 1"
      - from: DUPLICATE
        to: INTAKE
        trigger: "POST /complaints/{id}/unmark-duplicate"
        actor: CareSupervisor
        preconditions:
          - "Complaint.handling_status is DUPLICATE"
          - "Complaint.adjudicated_severity_score is null"
        side_effects:
          - "duplicate_of_complaint_id cleared"
          - "ProductionLot.duplicate_complaint_count -= 1 and provisional_complaint_count += 1"
          - "Consumer.complaint_count += 1"
      - from: DUPLICATE
        to: TRIAGED
        trigger: "POST /complaints/{id}/unmark-duplicate"
        actor: CareSupervisor
        preconditions:
          - "Complaint.handling_status is DUPLICATE"
          - "Complaint.adjudicated_severity_score is not null"
        side_effects:
          - "duplicate_of_complaint_id cleared"
          - "ProductionLot.duplicate_complaint_count -= 1 and adjudicated_complaint_count += 1"
          - "Consumer.complaint_count += 1"

  - entity: Complaint
    dimension: regulatory_status
    initial_state: NOT_APPLICABLE
    terminal_states: [SUBMITTED]
    shape: parallel
    description: |
      Second, independent dimension on the same entity. It advances only through RegulatoryReport
      transitions and never blocks or is blocked by handling_status, except that CLOSED requires
      this dimension to be out of ESCALATED / REPORTABLE.
    transitions:
      - from: NOT_APPLICABLE
        to: ESCALATED
        trigger: "POST /complaints/{id}/triage (auto) or POST /regulatory-reports (manual)"
        actor: RegulatoryOfficer
        preconditions:
          - "Complaint.handling_status is not DUPLICATE"
          - "no non-WITHDRAWN RegulatoryReport already exists for this complaint"
        side_effects:
          - "RegulatoryReport created in OPEN with escalated_at = logical clock and due_at from regulatory_due_at"
      - from: ESCALATED
        to: REPORTABLE
        trigger: "POST /regulatory-reports/{id}/determine with determination REPORTABLE"
        actor: RegulatoryOfficer
        preconditions:
          - "RegulatoryReport.status is OPEN"
        side_effects:
          - "RegulatoryReport.status becomes DETERMINED_REPORTABLE; determined_by_ref stamped"
      - from: ESCALATED
        to: NOT_REPORTABLE
        trigger: "POST /regulatory-reports/{id}/determine with determination NOT_REPORTABLE"
        actor: RegulatoryOfficer
        preconditions:
          - "RegulatoryReport.status is OPEN"
          - "the complaint's effective_severity_band is not S1"
        side_effects:
          - "RegulatoryReport.status becomes DETERMINED_NOT_REPORTABLE; determined_by_ref stamped"
      - from: REPORTABLE
        to: SUBMITTED
        trigger: "POST /regulatory-reports/{id}/submit"
        actor: RegulatoryOfficer
        preconditions:
          - "RegulatoryReport.status is DETERMINED_REPORTABLE"
          - "the submitting staff id differs from determined_by_ref"
        side_effects:
          - "RegulatoryReport.status becomes SUBMITTED; submitted_at set; submitted_late = submitted_at > due_at"
      - from: ESCALATED
        to: NOT_APPLICABLE
        trigger: "POST /regulatory-reports/{id}/withdraw"
        actor: RegulatoryOfficer
        preconditions:
          - "RegulatoryReport.status is OPEN, DETERMINED_REPORTABLE or DETERMINED_NOT_REPORTABLE"
        side_effects:
          - "RegulatoryReport.status becomes WITHDRAWN; the complaint's regulatory_status resets to NOT_APPLICABLE"

  - entity: SampleKit
    dimension: status
    initial_state: REQUESTED
    terminal_states: [LAB_ACCEPTED, EXPIRED, CANCELLED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: SHIPPED
        trigger: "POST /sample-kits/{id}/ship"
        actor: CareAgent
        preconditions:
          - "SampleKit.status is REQUESTED"
          - "Consumer.postal_code is not null"
          - "no other SampleKit for the same consumer has an occupied interval containing the prospective shipped_at"
        side_effects:
          - "shipped_at set to the logical clock; expected_return_by = shipped_at + KIT_RETURN_WINDOW_DAYS"
          - "occupied_from = shipped_at - KIT_COOLDOWN_HOURS; occupied_until = expected_return_by + KIT_COOLDOWN_HOURS"
          - "a KIT_ISSUED CustodyEvent is appended automatically at sequence_no 1"
      - from: SHIPPED
        to: IN_TRANSIT_INBOUND
        trigger: "POST /sample-kits/{id}/custody-events with event_type CARRIER_PICKUP"
        actor: CareAgent
        preconditions:
          - "SampleKit.status is SHIPPED"
          - "the preceding custody event is CONSUMER_SEALED"
        side_effects: []
      - from: IN_TRANSIT_INBOUND
        to: RECEIVED
        trigger: "POST /sample-kits/{id}/receive"
        actor: QualityLead
        preconditions:
          - "SampleKit.status is IN_TRANSIT_INBOUND"
          - "a LAB_RECEIVED CustodyEvent has been appended"
        side_effects:
          - "received_at set; transit_hours computed; seal_id_returned copied from the LAB_RECEIVED event"
          - "chain_integrity_status re-projected via custody_chain_integrity"
      - from: RECEIVED
        to: LAB_ACCEPTED
        trigger: "POST /sample-kits/{id}/lab-accept"
        actor: QualityLead
        preconditions:
          - "SampleKit.status is RECEIVED"
          - "custody_event_count == 5"
        side_effects:
          - "disposition set to USABLE when chain_integrity_status is INTACT, otherwise forced to UNUSABLE"
          - "Complaint.handling_status moves AWAITING_SAMPLE -> IN_RESOLUTION"
          - "Consumer.open_kit_count -= 1"
      - from: SHIPPED
        to: EXPIRED
        trigger: "POST /quality-ops-runs"
        actor: QualityLead
        preconditions:
          - "the logical clock is strictly after expected_return_by"
        side_effects:
          - "disposition forced to UNUSABLE; chain_integrity_status forced to BROKEN"
          - "Complaint.handling_status moves AWAITING_SAMPLE -> IN_RESOLUTION"
          - "Consumer.open_kit_count -= 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /sample-kits/{id}/cancel"
        actor: CareSupervisor
        preconditions:
          - "SampleKit.status is REQUESTED or SHIPPED"
        side_effects:
          - "Complaint.handling_status moves AWAITING_SAMPLE -> IN_RESOLUTION"
          - "Consumer.open_kit_count -= 1"
      - from: SHIPPED
        to: CANCELLED
        trigger: "POST /sample-kits/{id}/cancel"
        actor: CareSupervisor
        preconditions:
          - "SampleKit.status is SHIPPED"
        side_effects:
          - "Complaint.handling_status moves AWAITING_SAMPLE -> IN_RESOLUTION"
          - "Consumer.open_kit_count -= 1"

  - entity: Remedy
    dimension: status
    initial_state: DRAFT
    terminal_states: [REJECTED, FULFILLED, SUPERSEDED, VOIDED_BY_HOLD, VOIDED_AFTER_FULFILLMENT]
    shape: cyclic
    description: |
      SUBMITTED -> REVISION_REQUESTED -> SUBMITTED is a genuine cycle, bounded by
      MAX_REMEDY_REVISIONS. FULFILLED is terminal for the happy path but can still be reversed
      into VOIDED_AFTER_FULFILLMENT, which is itself terminal.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /remedies/{id}/submit"
        actor: CareAgent
        preconditions:
          - "Remedy.status is DRAFT or REVISION_REQUESTED"
          - "the parent Complaint is not ON_QUALITY_HOLD, RESOLVED, CLOSED or DUPLICATE"
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /remedies/{id}/submit"
        actor: CareAgent
        preconditions:
          - "Remedy.status is REVISION_REQUESTED"
          - "Remedy.revision_count <= MAX_REMEDY_REVISIONS"
        side_effects: []
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /remedies/{id}/decide with decision REQUEST_REVISION"
        actor: CareSupervisor
        preconditions:
          - "Remedy.status is SUBMITTED"
          - "the deciding staff id differs from authored_by_ref"
          - "Remedy.revision_count < MAX_REMEDY_REVISIONS"
        side_effects:
          - "revision_count += 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /remedies/{id}/decide with decision APPROVE"
        actor: CareSupervisor
        preconditions:
          - "Remedy.status is SUBMITTED"
          - "the deciding staff id differs from authored_by_ref"
          - "the deciding staff authority_tier rank >= authority_tier_required rank"
          - "the linked SampleKit, if any, is not in REQUESTED, SHIPPED or IN_TRANSIT_INBOUND"
        side_effects:
          - "decided_by_ref stamped"
          - "Consumer.goodwill_authorized_cents += payout_cents; Consumer.goodwill_outstanding_cents += payout_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /remedies/{id}/decide with decision REJECT"
        actor: CareSupervisor
        preconditions:
          - "Remedy.status is SUBMITTED"
          - "the deciding staff id differs from authored_by_ref"
        side_effects:
          - "decided_by_ref stamped"
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /remedies/{id}/fulfill"
        actor: CareSupervisor
        preconditions:
          - "Remedy.status is APPROVED"
          - "the parent Complaint is not ON_QUALITY_HOLD"
        side_effects:
          - "fulfilled_at set"
          - "Consumer.goodwill_outstanding_cents -= payout_cents; Consumer.goodwill_paid_cents += payout_cents"
          - "ProductionLot.goodwill_charged_cents += payout_cents when the complaint has a resolved lot"
      - from: APPROVED
        to: VOIDED_BY_HOLD
        trigger: "POST /complaints/{id}/quality-hold"
        actor: QualityLead
        preconditions:
          - "Remedy.status is DRAFT, SUBMITTED, REVISION_REQUESTED or APPROVED"
        side_effects:
          - "Consumer.goodwill_outstanding_cents -= payout_cents; Consumer.goodwill_voided_cents += payout_cents (only for the APPROVED case)"
      - from: FULFILLED
        to: VOIDED_AFTER_FULFILLMENT
        trigger: "POST /remedies/{id}/void"
        actor: CareSupervisor
        preconditions:
          - "Remedy.status is APPROVED or FULFILLED"
          - "the parent Complaint is not CLOSED"
        side_effects:
          - "Consumer.goodwill_paid_cents -= payout_cents; Consumer.goodwill_voided_cents += payout_cents"
          - "ProductionLot.goodwill_charged_cents -= payout_cents"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /remedies"
        actor: CareAgent
        preconditions:
          - "a new Remedy is created on the same complaint while this one is in DRAFT, SUBMITTED or REVISION_REQUESTED"
        side_effects:
          - "the older remedy is retired so that at most one live remedy exists per complaint"

  - entity: RegulatoryReport
    dimension: status
    initial_state: OPEN
    terminal_states: [SUBMITTED, WITHDRAWN]
    shape: branching
    transitions:
      - from: OPEN
        to: DETERMINED_REPORTABLE
        trigger: "POST /regulatory-reports/{id}/determine"
        actor: RegulatoryOfficer
        preconditions:
          - "RegulatoryReport.status is OPEN"
          - "determination is REPORTABLE"
        side_effects:
          - "Complaint.regulatory_status becomes REPORTABLE"
      - from: OPEN
        to: DETERMINED_NOT_REPORTABLE
        trigger: "POST /regulatory-reports/{id}/determine"
        actor: RegulatoryOfficer
        preconditions:
          - "RegulatoryReport.status is OPEN"
          - "determination is NOT_REPORTABLE"
          - "the complaint's effective_severity_band is not S1"
        side_effects:
          - "Complaint.regulatory_status becomes NOT_REPORTABLE"
      - from: DETERMINED_REPORTABLE
        to: SUBMITTED
        trigger: "POST /regulatory-reports/{id}/submit"
        actor: RegulatoryOfficer
        preconditions:
          - "RegulatoryReport.status is DETERMINED_REPORTABLE"
          - "the submitting staff id differs from determined_by_ref"
        side_effects:
          - "submitted_at set; submitted_late computed strictly against due_at"
          - "Complaint.regulatory_status becomes SUBMITTED"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /regulatory-reports/{id}/withdraw"
        actor: RegulatoryOfficer
        preconditions:
          - "RegulatoryReport.status is not SUBMITTED and not WITHDRAWN"
        side_effects:
          - "Complaint.regulatory_status resets to NOT_APPLICABLE"
      - from: DETERMINED_NOT_REPORTABLE
        to: WITHDRAWN
        trigger: "POST /regulatory-reports/{id}/withdraw"
        actor: RegulatoryOfficer
        preconditions:
          - "RegulatoryReport.status is DETERMINED_NOT_REPORTABLE"
        side_effects:
          - "Complaint.regulatory_status resets to NOT_APPLICABLE"

  - entity: TrendSignal
    dimension: status
    initial_state: DETECTED
    terminal_states: [DISMISSED, CLOSED_NO_ACTION, RECALL_INITIATED]
    shape: branching
    transitions:
      - from: DETECTED
        to: INVESTIGATION_OPEN
        trigger: "POST /trend-signals/{id}/open-investigation"
        actor: QualityLead
        preconditions:
          - "TrendSignal.status is DETECTED"
          - "TrendSignal.membership_count >= 1"
        side_effects:
          - "opened_by_ref stamped"
          - "Plant.open_investigation_count += 1 and Plant.oversight_posture re-derived to WATCH or INVESTIGATION_HOLD"
      - from: DETECTED
        to: DISMISSED
        trigger: "POST /trend-signals/{id}/dismiss"
        actor: QualityLead
        preconditions:
          - "TrendSignal.status is DETECTED"
        side_effects:
          - "Plant.oversight_posture re-derived"
      - from: INVESTIGATION_OPEN
        to: RECALL_EVALUATION
        trigger: "POST /trend-signals/{id}/escalate-recall-evaluation"
        actor: QualityLead
        preconditions:
          - "TrendSignal.status is INVESTIGATION_OPEN"
          - "at least one member complaint has effective_severity_band S1 or S2"
        side_effects:
          - "every member complaint not in RESOLVED, CLOSED or DUPLICATE moves to ON_QUALITY_HOLD, voiding its live remedies"
          - "for LOT-scope signals the lot moves to HOLD; for LINE/PLANT scope every RELEASED lot in scope moves to HOLD"
          - "Plant.oversight_posture re-derived to INVESTIGATION_HOLD"
      - from: INVESTIGATION_OPEN
        to: CLOSED_NO_ACTION
        trigger: "POST /trend-signals/{id}/close-no-action"
        actor: QualityLead
        preconditions:
          - "TrendSignal.status is INVESTIGATION_OPEN or RECALL_EVALUATION"
        side_effects:
          - "Plant.open_investigation_count -= 1; oversight_posture re-derived"
          - "lots placed on HOLD by this signal alone return to RELEASED"
      - from: RECALL_EVALUATION
        to: CLOSED_NO_ACTION
        trigger: "POST /trend-signals/{id}/close-no-action"
        actor: QualityLead
        preconditions:
          - "TrendSignal.status is RECALL_EVALUATION"
        side_effects:
          - "Plant.open_investigation_count -= 1; oversight_posture re-derived"
          - "lots placed on HOLD by this signal alone return to RELEASED"
      - from: RECALL_EVALUATION
        to: RECALL_INITIATED
        trigger: "POST /trend-signals/{id}/initiate-recall"
        actor: QualityLead
        preconditions:
          - "TrendSignal.status is RECALL_EVALUATION"
          - "every member complaint whose regulatory_status is REPORTABLE has a SUBMITTED RegulatoryReport"
        side_effects:
          - "every lot in scope moves to WITHDRAWN"
          - "Plant.recall_initiated_count += 1; oversight_posture forced to INVESTIGATION_HOLD"

  - entity: ProductionLot
    dimension: release_status
    initial_state: RELEASED
    terminal_states: [WITHDRAWN]
    shape: cyclic
    transitions:
      - from: RELEASED
        to: HOLD
        trigger: "POST /production-lots/{id}/hold, or an S1 triage, or a recall escalation"
        actor: QualityLead
        preconditions:
          - "ProductionLot.release_status is RELEASED"
        side_effects: []
      - from: HOLD
        to: RELEASED
        trigger: "POST /production-lots/{id}/release"
        actor: QualityLead
        preconditions:
          - "ProductionLot.release_status is HOLD"
          - "no TrendSignal covering this lot is in INVESTIGATION_OPEN or RECALL_EVALUATION"
        side_effects: []
      - from: HOLD
        to: WITHDRAWN
        trigger: "POST /production-lots/{id}/withdraw or POST /trend-signals/{id}/initiate-recall"
        actor: QualityLead
        preconditions:
          - "ProductionLot.release_status is HOLD"
        side_effects:
          - "consumer responses referencing this lot are blocked from that point on"

  - entity: Plant
    dimension: oversight_posture
    initial_state: NORMAL
    terminal_states: []
    shape: compound
    description: |
      Never set directly. Re-derived from the plant's TrendSignal population by calculation
      plant_oversight_posture after every signal transition.
    transitions:
      - from: NORMAL
        to: WATCH
        trigger: "any TrendSignal for this plant entering INVESTIGATION_OPEN"
        actor: QualityLead
        preconditions:
          - "no signal for this plant is in RECALL_EVALUATION or RECALL_INITIATED"
        side_effects: []
      - from: WATCH
        to: INVESTIGATION_HOLD
        trigger: "any TrendSignal for this plant entering RECALL_EVALUATION or RECALL_INITIATED"
        actor: QualityLead
        preconditions: []
        side_effects:
          - "new ProductionLot creation for this plant's lines is rejected"
      - from: WATCH
        to: NORMAL
        trigger: "the last INVESTIGATION_OPEN signal for this plant leaving that state"
        actor: QualityLead
        preconditions:
          - "open_investigation_count reaches 0 and recall_initiated_count is 0"
        side_effects: []
      - from: INVESTIGATION_HOLD
        to: WATCH
        trigger: "the last RECALL_EVALUATION signal closing with no action"
        actor: QualityLead
        preconditions:
          - "recall_initiated_count is 0 and at least one INVESTIGATION_OPEN signal remains"
        side_effects: []

  - entity: ResponseTemplate
    dimension: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: linear
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /response-templates/{id}/activate"
        actor: CareSupervisor
        preconditions:
          - "ResponseTemplate.status is DRAFT"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /response-templates/{id}/retire"
        actor: CareSupervisor
        preconditions:
          - "ResponseTemplate.status is ACTIVE"
        side_effects:
          - "the template can no longer be selected on POST /complaints/{id}/respond"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (optimistic concurrency only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - id: remedy-create-stale-complaint
    parent_entity: Complaint
    child_entity: Remedy
    write_endpoint: "POST /remedies"
    occ_field: expected_complaint_version
    version_field: "Complaint.version"
    error_id: ERR_STALE_COMPLAINT_VERSION
    http_status: 412
    guarantee: |
      A remedy may only be authored against the exact Complaint revision the author last read.
      Every write that mutates a complaint (triage, respond, hold, release-hold, duplicate marking)
      increments Complaint.version. A POST /remedies whose expected_complaint_version no longer
      matches Complaint.version is rejected with ERR_STALE_COMPLAINT_VERSION (412) and no Remedy row
      is created.
    justification: |
      Creating a remedy is not naturally idempotent-safe: a second create legitimately SUPERSEDES the
      first live remedy on the same complaint, so a blind retry silently discards work. Pinning the
      parent revision is the only way for an author to assert that the severity band, lot linkage and
      hold state they priced the goodwill against are still the ones on file.
    serialization: "Deterministic ordering, when required, is by created_at ASC; never by id."

  - id: custody-event-append-stale-kit
    parent_entity: SampleKit
    child_entity: CustodyEvent
    write_endpoint: "POST /sample-kits/{id}/custody-events"
    occ_field: expected_sample_kit_version
    version_field: "SampleKit.version"
    error_id: ERR_STALE_SAMPLE_KIT_VERSION
    http_status: 412
    guarantee: |
      A custody event may only be appended against the exact SampleKit revision the appender last
      read. Each successful append increments SampleKit.version, so a stale
      expected_sample_kit_version is rejected with ERR_STALE_SAMPLE_KIT_VERSION (412) and the chain
      is left untouched.
    justification: |
      The custody chain is an append-only ledger whose REQUIRED_SEQUENCE and monotonic occurred_at
      are both position-dependent. A second, sequential append with a refreshed version legitimately
      succeeds; only an append written against a superseded view of the chain is wrong, because the
      appender's belief about the current sequence position is what the ledger's integrity rests on.
    serialization: "Deterministic ordering, when required, is by created_at ASC; never by id."

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table (10 calculations, 4 with variants)
# -----------------------------------------------------------------------------
calculations:

  - name: complaint_severity_score
    description: |
      Severity score and band for a complaint. Two variants: the intake_provisional score is the
      raw additive hazard score (at intake the product may not be identified at all, so no
      regulatory or vulnerability weighting can be justified), while the triage_adjudicated score
      applies the vulnerability and regulated-food multipliers SEQUENTIALLY, rounding to 2 decimal
      places after EACH multiplication.
    trigger: "POST /complaints (intake_provisional); POST /complaints/{id}/triage (triage_adjudicated)"
    inputs:
      - "Complaint.complaint_type"
      - "Complaint.foreign_object_class"
      - "Complaint.medical_attention_sought"
      - "Complaint.hospitalization"
      - "Complaint.symptom_codes"
      - "Complaint.vulnerable_consumer"
      - "Consumer.is_vulnerable_flag (adjudicated variant only)"
      - "Product.is_regulated_food via the resolved lot (adjudicated variant only)"
    algorithm: weighted_scoring
    formula: |
      symptom_units = min(count(symptom_codes), SYMPTOM_CODE_CAP)
      additive =   TYPE_POINTS[complaint_type]
                 + OBJECT_POINTS[foreign_object_class]
                 + (MEDICAL_ATTENTION_POINTS if medical_attention_sought else 0)
                 + (HOSPITALIZATION_POINTS  if hospitalization          else 0)
                 + SYMPTOM_POINTS_PER_CODE * symptom_units

      # variant intake_provisional
      provisional_score = round_half_up(additive, 2)

      # variant triage_adjudicated  (STEPWISE — the rounding order is normative)
      vulnerable_effective = Complaint.vulnerable_consumer OR Consumer.is_vulnerable_flag
      step_1 = round_half_up(additive * (VULNERABLE_MULTIPLIER if vulnerable_effective else 1), 2)
      step_2 = round_half_up(step_1   * (REGULATED_MULTIPLIER  if Product.is_regulated_food else 1), 2)
      adjudicated_score = step_2

      band(score) = S1 if score >= BAND_S1_MIN
                    else S2 if score >= BAND_S2_MIN
                    else S3 if score >= BAND_S3_MIN
                    else S4
      effective_severity_band = adjudicated_severity_band if adjudicated_severity_score is not null
                                else provisional_severity_band
    constants:
      TYPE_POINTS: { FOREIGN_MATERIAL: 40, ILLNESS: 50, PACKAGING: 20, QUALITY: 10 }
      OBJECT_POINTS: { NONE: 0, SOFT: 5, HARD_BLUNT: 15, HARD_SHARP: 30 }
      MEDICAL_ATTENTION_POINTS: 25
      HOSPITALIZATION_POINTS: 35
      SYMPTOM_POINTS_PER_CODE: 3.5
      SYMPTOM_CODE_CAP: 4
      VULNERABLE_MULTIPLIER: 1.15
      REGULATED_MULTIPLIER: 1.075
      BAND_S1_MIN: 90
      BAND_S2_MIN: 60
      BAND_S3_MIN: 30
    precision: "2 decimal places, round_half_up, applied after EACH multiplier (never once at the end); the score is not capped at 100"
    variants:
      - name: intake_provisional
        when: "at POST /complaints, before any triage"
        difference: "Neither multiplier is applied; the score is the raw additive hazard total."
      - name: triage_adjudicated
        when: "at POST /complaints/{id}/triage"
        difference: |
          Applies VULNERABLE_MULTIPLIER (from the complaint flag OR the consumer's cohort flag) and
          then REGULATED_MULTIPLIER (from the resolved lot's product), rounding after each step.
          A single fused multiplication produces a different cent in the general case.

  - name: lot_complaint_rate_ppm
    description: Complaints per million units produced for one production lot, with a provisional and an adjudicated numerator.
    trigger: "GET /production-lots/{id}/complaint-rate; also recomputed inside POST /quality-ops-runs"
    inputs:
      - "ProductionLot.units_produced"
      - "the lot's linked Complaints and their handling_status / adjudicated_severity_score"
    algorithm: aggregation
    formula: |
      # variant provisional  — every complaint on the books
      numerator_provisional = count(complaints where lot_id = lot AND handling_status != DUPLICATE)

      # variant adjudicated  — only complaints whose severity has been adjudicated at triage
      numerator_adjudicated = count(complaints where lot_id = lot
                                    AND handling_status != DUPLICATE
                                    AND adjudicated_severity_score is not null)

      if units_produced == 0:
          rate_ppm = 0.00
          rate_undefined = true
      else:
          rate_ppm = round_half_up(numerator / units_produced * 1000000, 2)
          rate_undefined = false
    constants:
      PPM_SCALE: 1000000
    precision: "2 decimal places, round_half_up; a zero denominator yields 0.00 with rate_undefined = true (never an error, never a division)"
    variants:
      - name: provisional
        when: "variant query parameter omitted or set to provisional"
        difference: "Counts every non-duplicate complaint, triaged or not."
      - name: adjudicated
        when: "variant query parameter set to adjudicated"
        difference: "Counts only complaints carrying an adjudicated severity score."

  - name: trend_signal_evaluation
    description: |
      Severity-weighted complaint-rate excursion detection over a rolling half-open window, applied
      at LOT then LINE then PLANT scope with a narrowest-scope-wins waterfall so that the same
      complaint is never counted into two signals.
    trigger: "POST /quality-ops-runs (scope waterfall); POST /trend-signals (single explicit scope)"
    inputs:
      - "the logical clock"
      - "Complaint.created_at, handling_status, effective_severity_band, lot_id"
      - "ProductionLot.units_produced, production_line_id"
      - "ProductionLine.plant_id"
    algorithm: threshold
    formula: |
      window = [clock - TREND_WINDOW_DAYS, clock)          # half-open on Complaint.created_at
      eligible(c) = c.lot_id is not null
                    AND c.handling_status != DUPLICATE
                    AND window_start <= c.created_at < window_end

      weighted(scope) = sum over eligible complaints in scope of
                          SEVERITY_WEIGHT[c.effective_severity_band]
      units(scope)    = sum of units_produced over the lots in scope
      rate(scope)     = 0.00 if units(scope) == 0
                        else round_half_up(weighted(scope) / units(scope) * 1000000, 2)

      fires(scope) = weighted(scope) >= MIN_WEIGHTED_COUNT
                     AND rate(scope) >= THRESHOLD_PPM[scope_level]

      # waterfall — narrowest scope wins
      for each lot  in ascending (code_date, created_at):        if fires(LOT)  -> emit; consume that lot's complaints and units
      for each line in ascending (line_code, created_at):        if fires(LINE) over the UNCONSUMED remainder -> emit; consume it
      for each plant in ascending (plant_code, created_at):      if fires(PLANT) over the UNCONSUMED remainder -> emit

      # emission
      A SignalMembership is inserted for every contributing complaint, stamped with
      severity_weight and included_variant (ADJUDICATED when adjudicated_severity_score is not
      null, else PROVISIONAL). If an existing signal for the identical scope key AND identical
      window is in DETECTED, it is refreshed in place instead of duplicated.
    constants:
      TREND_WINDOW_DAYS: 30
      SEVERITY_WEIGHT: { S1: 3, S2: 2, S3: 1, S4: 0 }
      THRESHOLD_PPM: { LOT: 25.0, LINE: 12.0, PLANT: 6.0 }
      MIN_WEIGHTED_COUNT: 3.0
      PPM_SCALE: 1000000
    precision: "rates to 2 decimal places, round_half_up; weighted counts to 2 decimal places; both threshold comparisons are inclusive (>=)"

  - name: goodwill_authorization
    description: |
      Value, uplift, payout and required authority tier for a goodwill remedy. The evaluation order
      is circular-looking and therefore pinned: the uplift RATE is selected from base_value_cents
      alone, never from the payout it helps produce, and the authority tier is banded from the
      final payout.
    trigger: "POST /remedies; recomputed on POST /remedies/{id}/submit"
    inputs:
      - "Remedy.remedy_type"
      - "Remedy.requested_value_cents"
      - "Product.unit_retail_price_cents via the complaint's resolved lot"
      - "Complaint.units_claimed"
      - "the complaint's SampleKit status (for the return credit)"
    algorithm: tiered_pricing
    formula: |
      if remedy_type == COUPON:
          base = requested_value_cents
      elif remedy_type == REFUND:
          base = min(requested_value_cents, unit_retail_price_cents * units_claimed)
          if the complaint's SampleKit is in LAB_ACCEPTED:
              base = base + SAMPLE_RETURN_CREDIT_CENTS      # kit_returned_credit_applied = true
      else:  # REPLACEMENT — requested_value_cents is ignored entirely
          base = round_half_up(unit_retail_price_cents
                               * min(units_claimed, REPLACEMENT_UNIT_CAP)
                               * REPLACEMENT_HANDLING_MULTIPLIER, 0)

      # STEP ORDER IS NORMATIVE: the rate is keyed on `base`, never on `payout`.
      uplift_pct   = 0.00 if base <  UPLIFT_MID_MIN
                     else 0.10 if base < UPLIFT_HIGH_MIN
                     else 0.05
      uplift_cents = round_half_up(base * uplift_pct, 0)
      payout_cents = base + uplift_cents

      authority_tier_required = TIER_1 if payout_cents <= TIER_1_MAX_CENTS
                                else TIER_2 if payout_cents <= TIER_2_MAX_CENTS
                                else TIER_3
      if payout_cents > GOODWILL_MAX_PAYOUT_CENTS: reject with ERR_GOODWILL_ABOVE_MAX
    constants:
      SAMPLE_RETURN_CREDIT_CENTS: 799
      REPLACEMENT_UNIT_CAP: 3
      REPLACEMENT_HANDLING_MULTIPLIER: 1.15
      UPLIFT_MID_MIN: 1000
      UPLIFT_HIGH_MIN: 5000
      TIER_1_MAX_CENTS: 2500
      TIER_2_MAX_CENTS: 7500
      GOODWILL_MAX_PAYOUT_CENTS: 25000
    precision: |
      Money is whole cents; every intermediate money value is rounded half-up to 0 decimal places
      the moment it is produced. uplift_pct is exact to 2 decimal places. The uplift band is
      deliberately non-monotonic in the request: base 4999 pays out 5499 while base 5000 pays out
      only 5250, because the 5000-and-over band carries the smaller rate.
    variants:
      - name: without_sample_credit
        when: "the complaint has no SampleKit in LAB_ACCEPTED"
        difference: "REFUND base is the raw capped value."
      - name: with_sample_credit
        when: "the complaint's SampleKit reached LAB_ACCEPTED before the remedy was created"
        difference: |
          REFUND base gains SAMPLE_RETURN_CREDIT_CENTS BEFORE the uplift band is chosen, so the
          credit can push the base across UPLIFT_HIGH_MIN and thereby LOWER the uplift rate.

  - name: consumer_sentiment_index
    description: |
      A 0..100 sentiment score per consumer, recomputed on every read. Complaint penalties decay
      by half once a complaint is old enough; goodwill and timely responses earn credits.
    trigger: "GET /consumers/{id} (agent_view); GET /consumers/{id}/sentiment (variant selectable)"
    inputs:
      - "the logical clock"
      - "the consumer's non-DUPLICATE Complaints inside the lookback window, with effective_severity_band and adjudicated_severity_score"
      - "the consumer's FULFILLED Remedies"
      - "the consumer's complaints with responded_at set"
    algorithm: decay_function
    formula: |
      in_window(c) = c.handling_status != DUPLICATE
                     AND c.created_at >= clock - LOOKBACK_DAYS
      age_days(c)  = floor((clock - c.created_at) / 1 day)

      raw_penalty(c) = BAND_PENALTY[c.effective_severity_band]
                       + (PROVISIONAL_SURCHARGE if c.adjudicated_severity_score is null else 0)

      # variant agent_view — decay applied
      penalty(c) = raw_penalty(c) * DECAY_FACTOR  if age_days(c) >= DECAY_AFTER_DAYS
                   else raw_penalty(c)
      # variant executive_view — no decay; raw_penalty(c) is used directly

      credits = REMEDY_FULFILLED_CREDIT * count(FULFILLED remedies for this consumer)
                + RESPONSE_CREDIT * count(in-window complaints with responded_at not null)

      index = clamp(round_half_up(NEUTRAL_BASE - sum(penalty(c)) + credits, 2), 0.00, 100.00)
    constants:
      NEUTRAL_BASE: 50
      BAND_PENALTY: { S1: 20, S2: 12, S3: 6, S4: 3 }
      PROVISIONAL_SURCHARGE: 5
      DECAY_AFTER_DAYS: 90
      DECAY_FACTOR: 0.5
      LOOKBACK_DAYS: 180
      REMEDY_FULFILLED_CREDIT: 8
      RESPONSE_CREDIT: 4
      INDEX_MIN: 0.00
      INDEX_MAX: 100.00
    precision: "2 decimal places, round_half_up, then clamped to [0.00, 100.00]. The decay boundary is inclusive: exactly DECAY_AFTER_DAYS old already decays."
    variants:
      - name: agent_view
        when: "GET /consumers/{id}, or GET /consumers/{id}/sentiment with view omitted or agent_view"
        difference: "Penalties older than DECAY_AFTER_DAYS are halved."
      - name: executive_view
        when: "GET /consumers/{id}/sentiment?view=executive_view"
        difference: "No decay is applied; every in-window penalty counts at full weight."

  - name: custody_chain_integrity
    description: Event-replay projection over a sample kit's append-only custody log, producing chain_integrity_status, transit_hours and the lab disposition.
    trigger: "POST /sample-kits/{id}/custody-events; POST /sample-kits/{id}/receive; POST /sample-kits/{id}/lab-accept"
    inputs:
      - "the kit's CustodyEvents ordered by sequence_no"
      - "SampleKit.seal_id_issued"
    algorithm: projection
    formula: |
      events = the kit's CustodyEvents ordered by sequence_no ASC
      chain is INTACT only when ALL of:
        (1) event_type[i] == REQUIRED_SEQUENCE[i] for every appended position i
        (2) count(events) == len(REQUIRED_SEQUENCE)
        (3) occurred_at is non-decreasing across the ordered events
        (4) the CONSUMER_SEALED event's seal_id_observed == SampleKit.seal_id_issued
        (5) the LAB_RECEIVED  event's seal_id_observed == SampleKit.seal_id_issued
        (6) transit_hours <= MAX_TRANSIT_HOURS
      otherwise BROKEN; while fewer than len(REQUIRED_SEQUENCE) events exist and no rule above is
      already violated, the status stays PENDING.

      transit_hours = round_half_up(
          (LAB_RECEIVED.occurred_at - CARRIER_PICKUP.occurred_at) in hours, 2)

      disposition at lab-accept = USABLE if chain_integrity_status == INTACT else UNUSABLE
    constants:
      REQUIRED_SEQUENCE: [KIT_ISSUED, CONSUMER_SEALED, CARRIER_PICKUP, LAB_RECEIVED, LAB_OPENED]
      MAX_TRANSIT_HOURS: 240
    precision: "transit_hours to 2 decimal places, round_half_up; the MAX_TRANSIT_HOURS comparison is inclusive, so exactly 240.00 hours is still INTACT"

  - name: batch_code_resolution
    description: Resolve the consumer's spoken or typed batch code to exactly one ProductionLot, using the pack code date as the disambiguator.
    trigger: "POST /complaints; POST /complaints/{id}/identify-product; POST /production-lots (to stamp normalized_batch_code)"
    inputs:
      - "Complaint.reported_batch_code"
      - "Complaint.pack_code_date"
      - "ProductionLot.normalized_batch_code, ProductionLot.code_date"
    algorithm: projection
    formula: |
      normalize(s) = uppercase(s) with every character that is not [A-Z0-9] removed
      candidates = lots where normalized_batch_code == normalize(reported_batch_code)

      if reported_batch_code is null or candidates is empty:
          product_identification_status = UNRESOLVED; lot_id = null; product_id unchanged
      elif count(candidates) == 1:
          product_identification_status = RESOLVED; lot_id and product_id set from that lot
      else:
          narrowed = candidates where code_date == pack_code_date   (only when pack_code_date given)
          if count(narrowed) == 1: RESOLVED from narrowed[0]
          else: reject with ERR_BATCH_CODE_AMBIGUOUS
    constants:
      NORMALIZE_PATTERN: "[^A-Z0-9]"
    precision: "exact string comparison after normalization; no fuzzy matching, no prefix matching"

  - name: plant_oversight_posture
    description: Compound plant-level posture derived from the plant's TrendSignal population; never settable directly.
    trigger: "every TrendSignal status transition, and POST /quality-ops-runs"
    inputs:
      - "the statuses of all TrendSignals whose plant_id is this plant"
    algorithm: constraint_propagation
    formula: |
      signals = TrendSignals where plant_id == plant.id
      recall_initiated_count    = count(signals in RECALL_INITIATED)
      open_investigation_count  = count(signals in INVESTIGATION_OPEN or RECALL_EVALUATION)

      oversight_posture = INVESTIGATION_HOLD if any signal is in RECALL_EVALUATION or RECALL_INITIATED
                          else WATCH  if open_investigation_count >= 1
                          else NORMAL
    constants:
      WATCH_MIN_OPEN_INVESTIGATIONS: 1
    precision: "integer counts; the derivation is re-run to a fixed point after each transition, in the same request"

  - name: regulatory_due_at
    description: Submission deadline for a regulatory report, and the lateness verdict at submission.
    trigger: "POST /regulatory-reports and the auto-escalation inside POST /complaints/{id}/triage; evaluated again at POST /regulatory-reports/{id}/submit"
    inputs:
      - "the logical clock at escalation"
      - "Complaint.effective_severity_band at escalation"
      - "the logical clock at submission"
    algorithm: chronological
    formula: |
      escalated_at = clock at escalation
      due_at = escalated_at + (S1_DEADLINE_HOURS if effective_severity_band == S1
                               else STANDARD_DEADLINE_HOURS)
      at submission: submitted_late = (submitted_at > due_at)     # STRICTLY after
    constants:
      S1_DEADLINE_HOURS: 24
      STANDARD_DEADLINE_HOURS: 72
    precision: "millisecond-precision UTC instants; the deadline comparison is strict, so submitting at exactly due_at is on time"

  - name: sample_kit_retention_window
    description: |
      The return deadline and the per-consumer exclusivity interval for a sample kit. The
      exclusivity interval is CLOSED at both ends, unlike the half-open trend-detection window, so
      an instant exactly equal to occupied_until still collides.
    trigger: "POST /sample-kits/{id}/ship; re-evaluated by POST /quality-ops-runs"
    inputs:
      - "the logical clock at shipment"
      - "the consumer's other SampleKits and their occupied_from / occupied_until"
    algorithm: interval_merge
    formula: |
      shipped_at        = clock at shipment
      expected_return_by = shipped_at + KIT_RETURN_WINDOW_DAYS
      occupied_from      = shipped_at         - KIT_COOLDOWN_HOURS
      occupied_until     = expected_return_by + KIT_COOLDOWN_HOURS

      collides(other) = other.occupied_from <= shipped_at <= other.occupied_until   # CLOSED
      shipment is refused with ERR_KIT_INTERVAL_CONFLICT when any other kit of the same
      consumer in REQUESTED, SHIPPED, IN_TRANSIT_INBOUND or RECEIVED collides.

      an ops run expires the kit when clock > expected_return_by (strictly after)
    constants:
      KIT_RETURN_WINDOW_DAYS: 14
      KIT_COOLDOWN_HOURS: 48
    precision: "millisecond-precision UTC instants; the exclusivity comparison is inclusive at both ends, the expiry comparison is strict"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (45 rules, strictly ordered)
# The server evaluates rules in ascending priority and returns the FIRST failure.
# -----------------------------------------------------------------------------
validations:

  # --- auth -------------------------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID header present on every request except POST /_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: A missing or blank X-User-ID header is rejected before anything else is inspected.
  - priority: 2
    category: auth
    check: "the X-User-ID header resolves to an existing StaffUser or Consumer, and that record has is_active true where applicable"
    error_id: ERR_UNKNOWN_ACTOR
    http_status: 401
    applies_to: all
    description: An unresolvable or deactivated actor cannot act.
  - priority: 3
    category: auth
    check: "the actor's role appears in the endpoint's §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: Role gate. Evaluated before any path id is looked up, so an unauthorized caller learns nothing about existence.

  # --- existence --------------------------------------------------------------
  - priority: 4
    category: existence
    check: "every {id} path parameter resolves to an existing row of the expected entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Expands to ERR_CONSUMER_NOT_FOUND, ERR_PLANT_NOT_FOUND, ERR_PRODUCTION_LINE_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_PRODUCTION_LOT_NOT_FOUND, ERR_CONTACT_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_SAMPLE_KIT_NOT_FOUND, ERR_REMEDY_NOT_FOUND, ERR_REGULATORY_REPORT_NOT_FOUND, ERR_TREND_SIGNAL_NOT_FOUND, ERR_RESPONSE_TEMPLATE_NOT_FOUND, ERR_STAFF_USER_NOT_FOUND."
  - priority: 5
    category: existence
    check: "every foreign-key field in the request body resolves to an existing row of the referenced entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /production-lines, POST /production-lots, POST /contacts, POST /complaints, POST /sample-kits, POST /remedies, POST /regulatory-reports, POST /trend-signals, POST /complaints/{id}/respond, POST /complaints/{id}/mark-duplicate"
    description: Body-level referential existence, checked after path-level existence.
  - priority: 6
    category: existence
    check: "the referenced duplicate target complaint exists and is not the complaint being marked"
    error_id: ERR_DUPLICATE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /complaints/{id}/mark-duplicate"
    description: A complaint cannot be its own duplicate, and the target must exist.

  # --- schema -----------------------------------------------------------------
  - priority: 7
    category: schema
    check: "all required body fields for the endpoint are present"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
    description: Required-field presence.
  - priority: 8
    category: schema
    check: "every enum field carries one of its declared values and every numeric field falls inside its declared range"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
    description: Type, enum-membership and range checking.
  - priority: 9
    category: schema
    check: "pagination limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all list endpoints"
    description: Pagination envelope constraints from §1.0.
  - priority: 10
    category: schema
    check: "fields declared source: computed or source: system are not accepted from the client; if supplied they are ignored, never stored"
    error_id: null
    http_status: null
    applies_to: "all POST and PATCH endpoints"
    description: Server-owned fields are silently dropped rather than rejected.
  - priority: 11
    category: schema
    check: "unique fields are unique — staff_code, external_ref, plant_code, sku, kit_code, template_code, and line_code within a plant"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /staff-users, POST /consumers, POST /plants, POST /production-lines, POST /products, POST /sample-kits, POST /response-templates"
    description: Uniqueness conflict.

  # --- optimistic concurrency -------------------------------------------------
  - priority: 12
    category: concurrency
    check: "expected_complaint_version equals the parent Complaint's current version"
    error_id: ERR_STALE_COMPLAINT_VERSION
    http_status: 412
    applies_to: "POST /remedies"
    description: "§1.2.1 rule remedy-create-stale-complaint. Checked after existence and schema, before any state rule, so a stale read is reported even when the complaint has also moved into a blocking state."
  - priority: 13
    category: concurrency
    check: "expected_sample_kit_version equals the parent SampleKit's current version"
    error_id: ERR_STALE_SAMPLE_KIT_VERSION
    http_status: 412
    applies_to: "POST /sample-kits/{id}/custody-events"
    description: "§1.2.1 rule custody-event-append-stale-kit."

  # --- state ------------------------------------------------------------------
  - priority: 14
    category: state
    check: "the Contact is OPEN or LOGGED when a complaint is created from it"
    error_id: ERR_CONTACT_CLOSED
    http_status: 409
    applies_to: "POST /complaints"
    description: A contact closed with no complaint cannot later spawn one.
  - priority: 15
    category: state
    check: "the Contact has complaint_count == 0 when it is closed with no complaint"
    error_id: ERR_CONTACT_HAS_COMPLAINTS
    http_status: 409
    applies_to: "POST /contacts/{id}/close-no-complaint"
    description: Closing as no-complaint is only valid for an empty contact.
  - priority: 16
    category: state
    check: "the Complaint's handling_status permits the requested handling transition per §1.2"
    error_id: ERR_COMPLAINT_STATE_INVALID
    http_status: 409
    applies_to: "POST /complaints/{id}/triage, /respond, /resolve, /close, /quality-hold, /release-hold, /mark-duplicate, /unmark-duplicate, /identify-product"
    description: Handling-dimension transition guard, including terminal CLOSED lockdown.
  - priority: 17
    category: state
    check: "the Complaint's regulatory_status permits the requested regulatory transition per §1.2"
    error_id: ERR_REGULATORY_STATE_INVALID
    http_status: 409
    applies_to: "POST /regulatory-reports, POST /regulatory-reports/{id}/determine, /submit, /withdraw"
    description: Regulatory-dimension transition guard, independent of handling_status.
  - priority: 18
    category: state
    check: "the Remedy is in a status that permits the requested transition per §1.2"
    error_id: ERR_REMEDY_STATE_INVALID
    http_status: 409
    applies_to: "POST /remedies/{id}/submit, /decide, /fulfill, /void"
    description: "Remedy lifecycle guard. Deliberately ranked ABOVE the authority-tier fiscal rule, so a remedy that is both in the wrong state and beyond the decider's tier reports the state error."
  - priority: 19
    category: state
    check: "the SampleKit is in a status that permits the requested transition per §1.2"
    error_id: ERR_SAMPLE_KIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /sample-kits/{id}/ship, /receive, /lab-accept, /cancel, POST /sample-kits/{id}/custody-events"
    description: Kit lifecycle guard, including EXPIRED / CANCELLED / LAB_ACCEPTED terminal lockdown.
  - priority: 20
    category: state
    check: "the TrendSignal is in a status that permits the requested transition per §1.2"
    error_id: ERR_TREND_SIGNAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /trend-signals/{id}/open-investigation, /dismiss, /escalate-recall-evaluation, /initiate-recall, /close-no-action"
    description: Investigation lifecycle guard.
  - priority: 21
    category: state
    check: "the ProductionLot's release_status permits the requested transition per §1.2"
    error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /production-lots/{id}/hold, /release, /withdraw"
    description: Lot disposition guard, including WITHDRAWN terminal lockdown.
  - priority: 22
    category: state
    check: "the ResponseTemplate's status permits the requested transition per §1.2"
    error_id: ERR_TEMPLATE_STATE_INVALID
    http_status: 409
    applies_to: "POST /response-templates/{id}/activate, /retire"
    description: Template publication guard.
  - priority: 23
    category: state
    check: "the RegulatoryReport is OPEN when a determination is recorded, and DETERMINED_REPORTABLE when it is submitted"
    error_id: ERR_REPORT_STATE_INVALID
    http_status: 409
    applies_to: "POST /regulatory-reports/{id}/determine, /submit, /withdraw"
    description: Report lifecycle guard, separate from the complaint's regulatory dimension.
  - priority: 24
    category: state
    check: "the complaint's product_identification_status is RESOLVED before triage"
    error_id: ERR_PRODUCT_UNIDENTIFIED
    http_status: 409
    applies_to: "POST /complaints/{id}/triage"
    description: A complaint with no identified lot cannot be adjudicated, because the regulated multiplier and the rate denominator are both unknown.

  # --- business_safety --------------------------------------------------------
  - priority: 25
    category: business_safety
    check: "a NOT_REPORTABLE determination is refused when the complaint's effective_severity_band is S1"
    error_id: ERR_S1_MUST_BE_REPORTABLE
    http_status: 422
    applies_to: "POST /regulatory-reports/{id}/determine"
    description: The most severe band cannot be determined non-reportable.
  - priority: 26
    category: business_safety
    check: "the complaint's linked ProductionLot is not WITHDRAWN when a templated response is sent"
    error_id: ERR_LOT_WITHDRAWN
    http_status: 409
    applies_to: "POST /complaints/{id}/respond"
    description: "Once a lot is withdrawn, canned consumer messaging about it is frozen. Ranked ABOVE the template-eligibility referential rules so that a withdrawn lot masks a template mismatch."
  - priority: 27
    category: business_safety
    check: "no TrendSignal containing this complaint is in RECALL_EVALUATION when a quality hold is released"
    error_id: ERR_RECALL_EVALUATION_ACTIVE
    http_status: 409
    applies_to: "POST /complaints/{id}/release-hold"
    description: A complaint under active recall evaluation stays on hold.
  - priority: 28
    category: business_safety
    check: "no TrendSignal covering this lot is in INVESTIGATION_OPEN or RECALL_EVALUATION when the lot is released from hold"
    error_id: ERR_SIGNAL_INVESTIGATION_ACTIVE
    http_status: 409
    applies_to: "POST /production-lots/{id}/release"
    description: A lot cannot be released back to trade while an investigation covering it is live.
  - priority: 29
    category: business_safety
    check: "every member complaint whose regulatory_status is REPORTABLE has a SUBMITTED RegulatoryReport before a recall is initiated"
    error_id: ERR_REGULATORY_SUBMISSION_PENDING
    http_status: 409
    applies_to: "POST /trend-signals/{id}/initiate-recall"
    description: Recalls cannot precede the regulatory filings they depend on.
  - priority: 30
    category: business_safety
    check: "at least one member complaint has effective_severity_band S1 or S2 before a recall evaluation is opened"
    error_id: ERR_SEVERITY_TOO_LOW_FOR_RECALL
    http_status: 422
    applies_to: "POST /trend-signals/{id}/escalate-recall-evaluation"
    description: Low-severity trends are investigated but never escalated to recall evaluation.
  - priority: 31
    category: business_safety
    check: "the complaint's SampleKit, if any, is not in REQUESTED, SHIPPED or IN_TRANSIT_INBOUND when a remedy is approved"
    error_id: ERR_SAMPLE_KIT_IN_FLIGHT
    http_status: 409
    applies_to: "POST /remedies/{id}/decide"
    description: Goodwill is not approved while physical evidence is still in transit.

  - priority: 32
    category: business_safety
    check: "the owning Plant.oversight_posture is not INVESTIGATION_HOLD when a new production lot is registered"
    error_id: ERR_PLANT_UNDER_INVESTIGATION_HOLD
    http_status: 409
    applies_to: "POST /production-lots"
    description: "A plant frozen by a live recall evaluation cannot book new production. The blocking state lives two entities away — Plant.oversight_posture is itself derived from the plant's TrendSignal population."

  # --- business_temporal ------------------------------------------------------
  - priority: 33
    category: business_temporal
    check: "Contact.received_at is not after the logical clock"
    error_id: ERR_RECEIVED_AT_IN_FUTURE
    http_status: 422
    applies_to: "POST /contacts"
    description: Contacts cannot be logged in the future.
  - priority: 34
    category: business_temporal
    check: "the consumer holds no other SampleKit whose closed [occupied_from, occupied_until] interval contains the prospective shipped_at"
    error_id: ERR_KIT_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /sample-kits/{id}/ship"
    description: "One kit per consumer at a time, plus a cooldown. Ranked ABOVE the address-completeness constraint rule so an interval collision masks a missing postal code."
  - priority: 35
    category: business_temporal
    check: "a custody event's occurred_at is not before the previous event's occurred_at"
    error_id: ERR_CUSTODY_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /sample-kits/{id}/custody-events"
    description: The custody log must be chronologically non-decreasing.
  - priority: 36
    category: business_temporal
    check: "a manually raised TrendSignal window does not overlap an existing DETECTED / INVESTIGATION_OPEN / RECALL_EVALUATION signal for the same scope key; half-open windows that merely touch are allowed"
    error_id: ERR_SIGNAL_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /trend-signals"
    description: "Overlap test is a_start < b_end AND b_start < a_end, so [Jul-01, Aug-01) and [Aug-01, Aug-15) coexist."

  # --- business_constraint ----------------------------------------------------
  - priority: 37
    category: business_constraint
    check: "window_end is strictly after window_start"
    error_id: ERR_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /trend-signals"
    description: Empty or inverted windows are refused.
  - priority: 38
    category: business_constraint
    check: "Consumer.postal_code is present before a kit ships"
    error_id: ERR_CONSUMER_ADDRESS_MISSING
    http_status: 422
    applies_to: "POST /sample-kits/{id}/ship"
    description: A kit cannot be dispatched without a shipping postal code.
  - priority: 39
    category: business_constraint
    check: "the appended custody event_type matches REQUIRED_SEQUENCE at the next sequence position"
    error_id: ERR_CUSTODY_SEQUENCE_INVALID
    http_status: 422
    applies_to: "POST /sample-kits/{id}/custody-events"
    description: Custody steps cannot be skipped, reordered or repeated.
  - priority: 40
    category: business_constraint
    check: "Remedy.revision_count is below MAX_REMEDY_REVISIONS before another revision is requested"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /remedies/{id}/decide"
    description: The revision cycle is bounded; after the cap the supervisor must approve or reject.
  - priority: 41
    category: business_constraint
    check: "scope_level, production_line_id and lot_id are mutually consistent — LOT requires both, LINE requires the line and forbids the lot, PLANT forbids both"
    error_id: ERR_SCOPE_SHAPE_INVALID
    http_status: 422
    applies_to: "POST /trend-signals"
    description: Scope shape consistency for manually raised signals.
  - priority: 42
    category: business_referential
    check: "the chosen ResponseTemplate is ACTIVE and its applies_to_type is the complaint's complaint_type or ANY"
    error_id: ERR_TEMPLATE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /complaints/{id}/respond"
    description: Templates are type-gated.
  - priority: 43
    category: business_referential
    check: "the chosen ResponseTemplate's max_band_allowed is no less severe than the complaint's effective_severity_band (S1 most severe, S4 least)"
    error_id: ERR_TEMPLATE_BAND_TOO_LOW
    http_status: 422
    applies_to: "POST /complaints/{id}/respond"
    description: A mild-band template cannot answer a severe complaint.
  - priority: 44
    category: business_referential
    check: "the duplicate target complaint belongs to the same consumer and is not itself DUPLICATE"
    error_id: ERR_DUPLICATE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /complaints/{id}/mark-duplicate"
    description: Duplicate chains are one level deep and never cross consumers.

  # --- business_fiscal --------------------------------------------------------
  - priority: 45
    category: business_fiscal
    check: "the deciding staff member's authority_tier rank is at least the remedy's authority_tier_required rank, the decider differs from the author, and payout_cents does not exceed GOODWILL_MAX_PAYOUT_CENTS"
    error_id: ERR_AUTHORITY_TIER_INSUFFICIENT
    http_status: 403
    applies_to: "POST /remedies/{id}/decide"
    description: "Goodwill authority ceiling. Expands to ERR_SEGREGATION_OF_DUTIES (409) when decider == author and to ERR_GOODWILL_ABOVE_MAX (422) when the payout exceeds the ceiling — that ceiling check also runs at POST /remedies. Ranked last, so every state and safety rule masks it."

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table (79 endpoints)
# Every request carries X-User-ID except POST /_clock/set_current_utc.
# -----------------------------------------------------------------------------
endpoints:

  # --- logical clock ----------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the server's logical clock. Test-driving endpoint. Default clock when never set: 2026-08-01T00:00:00Z."
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects:
      - "all subsequent timestamp stamping, age, decay, window and deadline evaluation uses this instant"

  # --- staff ------------------------------------------------------------------
  - method: POST
    path: /staff-users
    description: Register an internal actor.
    roles: [SystemAdmin]
    code: 201
    input: [staff_code, full_name, role, "authority_tier?", "is_active?"]
    output: StaffUser
    side_effects: []
  - method: GET
    path: /staff-users
    description: List staff.
    roles: [SystemAdmin]
    code: 200
    input: ["role?", "authority_tier?", "is_active?", "limit?", "offset?"]
    output: StaffUser[]
    side_effects: []
  - method: GET
    path: /staff-users/{id}
    description: Fetch one staff member.
    roles: [SystemAdmin]
    code: 200
    input: []
    output: StaffUser
    side_effects: []

  # --- consumers --------------------------------------------------------------
  - method: POST
    path: /consumers
    description: Create a consumer record.
    roles: [CareAgent, CareSupervisor]
    code: 201
    input: [external_ref, full_name, "email?", "phone?", "postal_code?", "is_vulnerable_flag?"]
    output: Consumer
    side_effects:
      - "sentiment_index initialised to NEUTRAL_BASE"
  - method: GET
    path: /consumers
    description: List consumers.
    roles: [CareAgent, CareSupervisor, QualityLead]
    code: 200
    input: ["external_ref?", "is_vulnerable_flag?", "limit?", "offset?"]
    output: Consumer[]
    side_effects: []
  - method: GET
    path: /consumers/{id}
    description: Fetch one consumer; sentiment_index is recomputed on read using the agent_view variant.
    roles: [CareAgent, CareSupervisor, QualityLead, Consumer]
    code: 200
    input: []
    output: Consumer
    side_effects:
      - "consumer_sentiment_index (agent_view) recomputed against the current logical clock"
  - method: PATCH
    path: /consumers/{id}
    description: Update mutable consumer contact details.
    roles: [CareAgent, CareSupervisor]
    code: 200
    input: ["email?", "phone?", "postal_code?", "is_vulnerable_flag?"]
    output: Consumer
    side_effects:
      - "version increments"
  - method: GET
    path: /consumers/{id}/sentiment
    description: Computed sentiment read with a selectable variant.
    roles: [CareSupervisor, QualityLead]
    code: 200
    input: ["view?"]
    output: { consumer_id: string, view: string, penalty_total: number, credit_total: number, sentiment_index: number, complaint_count_in_window: integer }
    side_effects: []

  # --- plants / lines / products / lots ---------------------------------------
  - method: POST
    path: /plants
    description: Create a plant.
    roles: [SystemAdmin]
    code: 201
    input: [plant_code, name, region]
    output: Plant
    side_effects: []
  - method: GET
    path: /plants
    description: List plants.
    roles: [SystemAdmin, QualityLead, CareSupervisor]
    code: 200
    input: ["region?", "oversight_posture?", "limit?", "offset?"]
    output: Plant[]
    side_effects: []
  - method: GET
    path: /plants/{id}
    description: Fetch one plant with its derived oversight posture.
    roles: [SystemAdmin, QualityLead, CareSupervisor]
    code: 200
    input: []
    output: Plant
    side_effects: []
  - method: POST
    path: /production-lines
    description: Create a production line under a plant.
    roles: [SystemAdmin]
    code: 201
    input: [plant_id, line_code, nominal_units_per_hour]
    output: ProductionLine
    side_effects:
      - "Plant is the parent; line_code must be unique within the plant"
  - method: GET
    path: /plants/{id}/production-lines
    description: List the lines of one plant.
    roles: [SystemAdmin, QualityLead, CareSupervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductionLine[]
    side_effects: []
  - method: GET
    path: /production-lines/{id}
    description: Fetch one production line.
    roles: [SystemAdmin, QualityLead, CareSupervisor]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []
  - method: POST
    path: /products
    description: Create a product SKU.
    roles: [SystemAdmin]
    code: 201
    input: [sku, name, category, is_regulated_food, unit_retail_price_cents, units_per_case]
    output: Product
    side_effects: []
  - method: GET
    path: /products
    description: List products.
    roles: [SystemAdmin, QualityLead, CareSupervisor, CareAgent]
    code: 200
    input: ["sku?", "category?", "is_regulated_food?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: /products/{id}
    description: Fetch one product.
    roles: [SystemAdmin, QualityLead, CareSupervisor, CareAgent]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: /production-lots
    description: Register a production lot; stamps normalized_batch_code.
    roles: [SystemAdmin, QualityLead]
    code: 201
    input: [product_id, production_line_id, batch_code, code_date, units_produced]
    output: ProductionLot
    side_effects:
      - "normalized_batch_code computed via batch_code_resolution"
      - "ProductionLine.lot_count += 1"
      - "rejected when the owning Plant.oversight_posture is INVESTIGATION_HOLD"
  - method: GET
    path: /production-lots
    description: List production lots with filters.
    roles: [SystemAdmin, QualityLead, CareSupervisor, CareAgent]
    code: 200
    input: ["product_id?", "production_line_id?", "normalized_batch_code?", "release_status?", "limit?", "offset?"]
    output: ProductionLot[]
    side_effects: []
  - method: GET
    path: /production-lots/{id}
    description: Fetch one production lot with its complaint-count buckets and goodwill ledger.
    roles: [SystemAdmin, QualityLead, CareSupervisor, CareAgent]
    code: 200
    input: []
    output: ProductionLot
    side_effects: []
  - method: GET
    path: /production-lots/{id}/complaint-rate
    description: Computed complaints-per-million-units read for one lot, with a selectable numerator variant.
    roles: [QualityLead, CareSupervisor]
    code: 200
    input: ["variant?"]
    output: { production_lot_id: string, variant: string, numerator: integer, units_produced: integer, rate_ppm: number, rate_undefined: boolean }
    side_effects: []
  - method: POST
    path: /production-lots/{id}/hold
    description: Place a lot on quality hold.
    roles: [QualityLead]
    code: 200
    input: ["reason?"]
    output: ProductionLot
