  # ===========================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: booking_confirm_cancel_ledger_conservation
        grounds:
          - calculations.case_cost_ledger
          - state_machines.ServiceBooking.HELD_to_CONFIRMED
          - state_machines.ServiceBooking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: case authorized funds, pinned as
          total_paid_cents + total_committed_cents + total_released_cents.
          Confirming a 135000 booking then cancelling it leaves the sum at
          135000 in both snapshots (0+135000+0 before, 0+0+135000 after) — the
