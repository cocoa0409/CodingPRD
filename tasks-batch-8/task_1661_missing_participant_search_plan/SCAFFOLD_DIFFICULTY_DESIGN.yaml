            - "After reopen: TerminationCase.${c_rv}.status == DISTRIBUTION_IN_PROGRESS (cycle edge taken; case processes the restored participant again)"

  - rule_id: transitive_cascade
    instances:
      - name: locate_triggers_restoration_ledger_cascade
        grounds:
          - state_machines.Participant.MISSING_to_LOCATED
          - state_machines.Participant.FORFEITED_to_RESTORED
          - state_machines.Forfeiture.RECORDED_to_RESTORED
          - calculations.fund_conservation
        distinguishing_aspect: |
          Depth-4 chain with a single trigger (POST /participants/{id}/locate):
          participant MISSING -> LOCATED causes distribution_status FORFEITED ->
          RESTORED, which causes the Forfeiture RECORDED -> RESTORED with its
          computed amount, which causes the case ledger recompute
          (forfeited_cents -800000, remaining_undistributed_cents +800000,
          resolved_participant_count -1). Each hop is caused by the previous hop,
          not by the original call.
        test_recipe:
          setup:
            - "Case (NOMINAL) in DISTRIBUTION_IN_PROGRESS; single participant 800000 vested 100%, MISSING, search exhausted and documented, forfeiture RECORDED at 800000 (case forfeited_cents == 800000, remaining_undistributed_cents == 0, resolved_participant_count == 1)."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Cascade Co 401k", sponsor_ein: "123456789", plan_number: "050", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_ca: "$.data.id", c_ca_v: "$.data.version" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_ca}", full_name: "Cas Cade", ssn: "500000001", mailing_address: "1 C St", account_balance_cents: 800000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_ca: "$.data.id" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_ca}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_ca_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_ca}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "GET /termination-cases/${c_ca}", payload: {}, as: PlanAdministrator, captures: { c_ca_v2: "$.data.version" } }
