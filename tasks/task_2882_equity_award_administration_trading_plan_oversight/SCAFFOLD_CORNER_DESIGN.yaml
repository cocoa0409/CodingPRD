              as_user_id: "admin-1"
          trigger:
            - call: "GET /participants"
              payload: { limit: 0 }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "GET /participants"
              payload: { limit: 101 }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "GET /participants"
              payload: { limit: 1, offset: 0 }
              as: PlanAdministrator
              as_user_id: "admin-1"
          assert:
            - "the limit 0 call returns HTTP 400 with error_id ERR_INVALID_PAGINATION"
            - "the limit 101 call returns HTTP 400 with error_id ERR_INVALID_PAGINATION"
            - "the limit 1 call returns HTTP 200 with exactly 1 row, total_count == 2 and has_more == true"

      - name: exercise_price_mismatch_on_nso_revise_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - errors[ERR_EXERCISE_PRICE_MISMATCH]
          - state_machines.Grant.PENDING_APPROVAL_to_CHANGES_REQUESTED
