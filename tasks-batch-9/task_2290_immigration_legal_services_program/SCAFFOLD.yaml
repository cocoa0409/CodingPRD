# =============================================================================
# PRD Benchmark Seed Tables — task_2290_immigration_legal_services_program
# Sections §1.0 – §1.7 (difficulty design §1.8 and corner design §1.9 live in
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  2290. Immigration Legal Services Program (nonprofit immigration legal services provider): intake screening for legal eligibility, case type and urgency with capacity-based acceptance criteria, accreditation and authorization requirements for non-attorney representatives with recognition of the organization, case assignment across staff attorneys, accredited representatives and pro bono volunteers with supervision requirements, evidence gathering, declaration preparation and interpretation services in the client's language, filing deadlines, biometric appointments and hearing calendar management with conflict tracking, detained client representation with facility access and expedited timelines, client communication about risk, alternatives and case outcomes with informed decision documentation, grant reporting on cases served and outcomes with client confidentiality protections

domain_name: immigration-legal-services

# Flat/graph topology: resource collections are top-level siblings (no single
# owning root aggregate), so the api prefix is the server root.
api_prefix: "/"

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  difficulty_notes: |
    Density drivers, not volume drivers:
    (1) Two disagreeing readiness determinations over the SAME evidence set
        (weighted vs strict checklist) gate the same READY_TO_FILE transition
        on different matters (detained vs non-detained).
    (2) Urgency scoring anchors on either the statutory deadline alone or on the
        earliest calendar event across ALL of the client's open matters, so the
        same intake row scores differently depending on the variant selected by
        `detained`.
    (3) Capacity is a two-pool waterfall (reserved-detained pool + general pool)
        whose general pool free count EXCLUDES the reserved block, so a cycle can
        report available_slot_count > 0 and still reject a non-detained
        acceptance.
    (4) Three overlap geometries coexist on the calendar: half-open with an
        asymmetric travel buffer (Representative), fully-closed touching-conflicts
        (client across matters), and a per-calendar-date aggregate slot count
        (DetentionFacility).
    (5) Two four-hop cascades from different triggers (recognition lapse;
        accepted-intake withdrawal with waitlist promotion) must leave two named
        conserved quantities exactly restored.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Client legal name as written on filings."
        constraints: "1..160 characters, non-blank"
      - name: preferred_language_code
        type: string
        source: input
        description: "Language the client is counseled and read back to."
        constraints: "lowercase ISO 639-1 two-letter code"
      - name: country_of_birth_code
        type: string
        source: input
        description: "Country of birth."
        constraints: "uppercase ISO 3166-1 alpha-2 code"
      - name: a_number
        type: string
        source: input
        description: "Alien registration number when one exists."
        default: null
        constraints: "nullable; when present must match ^A[0-9]{9}$ and be unique across Client rows"
      - name: date_of_birth
        type: string
        source: input
        description: "Date of birth, ISO 8601 calendar date."
        constraints: "YYYY-MM-DD; must be strictly before the logical clock date"
      - name: household_size
        type: integer
        source: input
        description: "Persons in the client household, used by the indigency test."
        constraints: ">= 1"
      - name: annual_household_income_cents
        type: integer
        source: input
        description: "Annual household income in whole cents."
        constraints: ">= 0"
      - name: fpl_percent
        type: number
        source: computed
        description: "Income as a percent of the federal poverty guideline for household_size; see calculations.indigency_fpl_percent."
        constraints: "2 decimal places, round_half_up"
      - name: confidentiality_consent_scope
        type: enum
        source: input
        description: "How far client-identifying data may travel outside the program."
        default: PROGRAM_ONLY
        constraints: "one of {NONE, PROGRAM_ONLY, FUNDER_AGGREGATE, FUNDER_IDENTIFIED}"
      - name: interpreter_required
        type: boolean
        source: computed
        description: "True exactly when preferred_language_code != 'en'."
      - name: open_matter_count
        type: integer
        source: computed
        description: "Count of CaseMatter rows with client_id == this Client and representation_status != 'WITHDRAWN_FROM'."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Client program status; set to CLOSED when open_matter_count reaches 0 after having been positive."
        default: ACTIVE
        constraints: "one of {ACTIVE, CLOSED}"

  - name: ProgramCapacityCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_label
        type: string
        source: input
        description: "Human label of the funding/capacity period."
        constraints: "unique across ProgramCapacityCycle rows, 1..60 characters"
      - name: period_start_date
        type: string
        source: input
        description: "First calendar date covered by the cycle, inclusive."
        constraints: "YYYY-MM-DD"
      - name: period_end_date
        type: string
        source: input
        description: "Last calendar date covered by the cycle, inclusive."
        constraints: "YYYY-MM-DD; must be strictly after period_start_date"
      - name: total_case_slots
        type: integer
        source: input
        description: "Total accepted-case capacity for the cycle."
        constraints: ">= 1"
      - name: reserved_detained_slots
        type: integer
        source: input
        description: "Sub-block of total_case_slots usable only by detained intakes."
        constraints: ">= 0 and <= total_case_slots"
      - name: general_slots_consumed
        type: integer
        source: computed
        description: "Count of CaseMatter rows in this cycle with slot_pool_consumed == 'GENERAL' and representation_status != 'WITHDRAWN_FROM'."
        default: 0
      - name: detained_slots_consumed
        type: integer
        source: computed
        description: "Count of CaseMatter rows in this cycle with slot_pool_consumed == 'DETAINED_RESERVED' and representation_status != 'WITHDRAWN_FROM'."
        default: 0
      - name: available_slot_count
        type: integer
        source: computed
        description: "total_case_slots - general_slots_consumed - detained_slots_consumed."
        default: 0
      - name: waitlisted_count
        type: integer
        source: computed
        description: "Count of IntakeScreening rows in this cycle with status == 'WAITLISTED'."
        default: 0
      - name: utilization_ratio
        type: number
        source: computed
        description: "(general_slots_consumed + detained_slots_consumed) / total_case_slots; see calculations.cycle_capacity_posture."
        constraints: "4 decimal places, round_half_up"
      - name: capacity_posture
        type: enum
        source: computed
        description: "Derived gate on acceptance decisions; see calculations.cycle_capacity_posture."
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: posture_override_until_utc
        type: datetime
        source: input
        description: "While the logical clock is strictly before this instant, a computed FROZEN posture is reported and enforced as RESTRICTED."
        default: null
        constraints: "nullable ISO 8601 UTC with three fractional digits"
      - name: checkpoint_epoch
        type: integer
        source: computed
        description: "Increments by 1 on every capacity checkpoint run."
        default: 0
      - name: last_checkpoint_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent checkpoint run; null before the first run."
        default: null

  - name: DetentionFacility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Detention facility name."
        constraints: "1..120 characters, unique across DetentionFacility rows"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Immigration court jurisdiction the facility sits in."
        constraints: "uppercase, 2..8 characters"
      - name: visit_lead_time_hours
        type: integer
        source: input
        description: "Minimum hours between the logical clock and the start of a FACILITY_VISIT event."
        default: 48
        constraints: ">= 0"
      - name: max_daily_visit_slots
        type: integer
        source: input
        description: "Maximum FACILITY_VISIT events with status in {SCHEDULED, CONFIRMED} per calendar date at this facility."
        constraints: ">= 0"
      - name: expedited_filing_days
        type: integer
        source: input
        description: "Days added to the acceptance date to derive a detained matter's expedited filing deadline."
        default: 21
        constraints: ">= 1"
      - name: access_credential_required
        type: boolean
        source: input
        description: "When true, the assigned representative must hold an unexpired facility access credential to be scheduled for a FACILITY_VISIT."
        default: true
      - name: status
        type: enum
        source: input
        description: "Facility access posture; settable only at creation."
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED_ACCESS, CLOSED}"

  - name: OrganizationRecognition
    parent: null
    common_fields: true
    fields:
      - name: recognition_number
        type: string
        source: input
        description: "Recognition identifier issued to the organization."
        constraints: "unique across OrganizationRecognition rows, 1..40 characters"
      - name: effective_date
        type: string
        source: input
        description: "First date the recognition is effective, inclusive."
        constraints: "YYYY-MM-DD"
      - name: expiry_date
        type: string
        source: input
        description: "Last date the recognition is effective, inclusive."
        constraints: "YYYY-MM-DD; must be strictly after effective_date"
      - name: authorized_forums
        type: array
        source: input
        description: "Forums the organization is recognized to appear before; an Accreditation can never exceed this set."
        constraints: "non-empty subset of {USCIS, EOIR_IMMIGRATION_COURT, BIA, ASYLUM_OFFICE}"
      - name: status
        type: enum
        source: computed
        description: "Recognition lifecycle state; see state_machines.OrganizationRecognition."
        default: ACTIVE
        constraints: "one of {ACTIVE, CONDITIONAL, LAPSED, WITHDRAWN}"
      - name: conditional_reason_code
        type: enum
        source: input
        description: "Why the recognition was placed in CONDITIONAL; null in every other state."
        default: null
        constraints: "nullable; one of {ANNUAL_REPORT_LATE, STAFFING_DEFICIENCY, COMPLAINT_UNDER_REVIEW}"
      - name: suspended_accreditation_count
        type: integer
        source: computed
        description: "Count of Accreditation rows with recognition_id == this row and status == 'SUSPENDED_BY_RECOGNITION'."
        default: 0
      - name: lapsed_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the transition into LAPSED; null unless status == 'LAPSED'."
        default: null

  - name: Representative
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Representative name."
        constraints: "1..120 characters, non-blank"
      - name: rep_type
        type: enum
        source: input
        description: "Category of representative, which decides supervision and authorization requirements."
        constraints: "one of {STAFF_ATTORNEY, ACCREDITED_REP, PRO_BONO_VOLUNTEER, LAW_GRADUATE}"
      - name: bar_number
        type: string
        source: input
        description: "State bar number."
        default: null
        constraints: "required non-null when rep_type == 'STAFF_ATTORNEY'; must be null for every other rep_type"
      - name: languages
        type: array
        source: input
        description: "Languages the representative can counsel in."
        constraints: "non-empty array of lowercase ISO 639-1 two-letter codes"
      - name: max_case_load
        type: integer
        source: input
        description: "Cap on concurrent ACTIVE assignments with role_on_case in {LEAD, CO_COUNSEL}."
        default: 25
        constraints: ">= 0"
      - name: max_supervisees
        type: integer
        source: input
        description: "Cap on concurrent supervision links pointing at this representative's ACTIVE SUPERVISOR assignments."
        default: 10
        constraints: ">= 0"
      - name: weekly_capacity_hours
        type: number
        source: input
        description: "Contracted weekly hours, reported to funders."
        default: 40
        constraints: "> 0, 2 decimal places"
      - name: active_case_load
        type: integer
        source: computed
        description: "Count of CaseAssignment rows with representative_id == this row, status == 'ACTIVE' and role_on_case in {LEAD, CO_COUNSEL}."
        default: 0
      - name: supervisee_count
        type: integer
        source: computed
        description: "Count of CaseAssignment rows with status == 'ACTIVE' whose supervision_link_id points at an ACTIVE SUPERVISOR assignment of this representative."
        default: 0
      - name: supervision_required
        type: boolean
        source: computed
        description: "True exactly when rep_type in {ACCREDITED_REP, PRO_BONO_VOLUNTEER, LAW_GRADUATE}."
      - name: authorization_status
        type: enum
        source: computed
        description: "Derived authorization to hold case work; see calculations.representative_authorization_status."
        default: UNAUTHORIZED
        constraints: "one of {AUTHORIZED_ATTORNEY, AUTHORIZED_ACCREDITED, AUTHORIZED_SUPERVISED, AUTHORIZATION_SUSPENDED, UNAUTHORIZED}"
      - name: facility_access_credential_expires_on
        type: string
        source: input
        description: "Last date the representative's detention-facility access credential is valid."
        default: null
        constraints: "nullable YYYY-MM-DD"
      - name: status
        type: enum
        source: input
        description: "Employment/volunteer status."
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE, SUSPENDED}"

  - name: Accreditation
    parent: Representative
    common_fields: true
    fields:
      - name: representative_id
        type: string
        source: input
        description: "FK -> Representative.id; the non-attorney representative being accredited."
      - name: recognition_id
        type: string
        source: input
        description: "FK -> OrganizationRecognition.id; the organizational recognition this accreditation hangs from."
      - name: approved_by_representative_id
        type: string
        source: computed
        description: "FK -> Representative.id; the SupervisingAttorney who approved (or most recently renewed) this accreditation."
        default: null
      - name: accreditation_type
        type: enum
        source: input
        description: "PARTIAL accreditation is limited to USCIS and ASYLUM_OFFICE; FULL may also cover EOIR_IMMIGRATION_COURT and BIA."
        constraints: "one of {PARTIAL, FULL}"
      - name: requested_forums
        type: array
        source: input
        description: "Forums requested at filing time."
        constraints: "non-empty subset of {USCIS, EOIR_IMMIGRATION_COURT, BIA, ASYLUM_OFFICE}"
      - name: authorized_forums
        type: array
        source: computed
        description: "Effective forum grant; see calculations.accreditation_forum_grant."
        default: []
      - name: status
        type: enum
        source: computed
        description: "Accreditation lifecycle state; see state_machines.Accreditation."
        default: PENDING
        constraints: "one of {PENDING, APPROVED, EXPIRING, RENEWAL_PENDING, SUSPENDED_BY_RECOGNITION, EXPIRED, REVOKED, DENIED}"
      - name: effective_date
        type: string
        source: computed
        description: "Logical-clock calendar date of the approval that put this row into APPROVED."
        default: null
        constraints: "nullable YYYY-MM-DD"
      - name: expiry_date
        type: string
        source: computed
        description: "effective_date + ACCREDITATION_TERM_DAYS; see calculations.accreditation_forum_grant."
        default: null
        constraints: "nullable YYYY-MM-DD"
      - name: renewal_round
        type: integer
        source: computed
        description: "Number of completed renewals; increments by 1 on every RENEWAL_PENDING -> APPROVED transition."
        default: 0
      - name: decision_reason_code
        type: enum
        source: input
        description: "Reason attached to the APPROVE, DENY or REVOKE decision."
        default: null
        constraints: "nullable; one of {CREDENTIALS_VERIFIED, TRAINING_INCOMPLETE, BACKGROUND_ADVERSE, CONDUCT_VIOLATION, VOLUNTARY_SURRENDER, RECOGNITION_LAPSE}"

  - name: IntakeScreening
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the person screened."
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ProgramCapacityCycle.id; the capacity cycle this screening competes in."
      - name: screener_representative_id
        type: string
        source: computed
        description: "FK -> Representative.id; the IntakeScreener whose X-User-ID performed the DRAFT -> SCREENED transition."
        default: null
      - name: decided_by_representative_id
        type: string
        source: computed
        description: "FK -> Representative.id; the SupervisingAttorney whose X-User-ID performed the acceptance decision."
        default: null
      - name: facility_id
        type: string
        source: input
        description: "FK -> DetentionFacility.id; required non-null when detained is true, must be null otherwise."
        default: null
      - name: case_type
        type: enum
        source: input
        description: "Relief or proceeding type identified at screening."
        constraints: "one of {ASYLUM_DEFENSIVE, ASYLUM_AFFIRMATIVE, U_VISA, VAWA_SELF_PETITION, SIJS, DACA_RENEWAL, NATURALIZATION, ADJUSTMENT_OF_STATUS, BOND_HEARING, REMOVAL_DEFENSE_OTHER}"
      - name: detained
        type: boolean
        source: input
        description: "True when the client is in immigration detention at screening time."
        default: false
      - name: statutory_deadline_date
        type: string
        source: input
        description: "Hard statutory or regulatory filing deadline known at screening."
        default: null
        constraints: "nullable YYYY-MM-DD"
      - name: one_year_bar_applies
        type: boolean
        source: input
        description: "True when the asylum one-year filing bar is in play."
        default: false
      - name: prior_removal_order
        type: boolean
        source: input
        description: "True when an outstanding removal order exists."
        default: false
      - name: unaccompanied_minor
        type: boolean
        source: input
        description: "True when the client is an unaccompanied minor."
        default: false
      - name: legal_eligibility_verdict
        type: enum
        source: computed
        description: "Screening verdict on legal and financial eligibility; see calculations.legal_eligibility_verdict."
        default: PENDING
        constraints: "one of {PENDING, ELIGIBLE, INELIGIBLE_NO_RELIEF, INELIGIBLE_INCOME, INELIGIBLE_JURISDICTION}"
      - name: urgency_score
        type: number
        source: computed
        description: "Composite urgency points; see calculations.intake_urgency_score."
        default: null
        constraints: "nullable, 0.00..100.00, 2 decimal places, round_half_up"
      - name: urgency_tier
        type: enum
        source: computed
        description: "Band of urgency_score; gates acceptance while the cycle posture is RESTRICTED or FROZEN."
        default: null
        constraints: "nullable; one of {ROUTINE, ELEVATED, URGENT, EMERGENCY}"
      - name: urgency_variant_applied
        type: enum
        source: computed
        description: "Which anchor variant of calculations.intake_urgency_score produced urgency_score."
        default: null
        constraints: "nullable; one of {STRICT_STATUTORY, CALENDAR_INCLUSIVE}"
      - name: urgency_anchor_date
        type: string
        source: computed
        description: "The anchor date the applied urgency variant resolved to; null when the variant found no anchor."
        default: null
        constraints: "nullable YYYY-MM-DD"
      - name: status
        type: enum
        source: computed
        description: "Intake lifecycle state; see state_machines.IntakeScreening."
        default: DRAFT
        constraints: "one of {DRAFT, SCREENED, ACCEPTED, WAITLISTED, DECLINED, REFERRED_OUT, WITHDRAWN, WAITLIST_EXPIRED}"
      - name: decision_reason_code
        type: enum
        source: input
        description: "Reason recorded with the SCREENED -> {ACCEPTED, WAITLISTED, DECLINED, REFERRED_OUT} decision."
        default: null
        constraints: "nullable; one of {ACCEPTED_ON_MERIT, ACCEPTED_DETAINED_PRIORITY, CAPACITY_FULL, OUTSIDE_SERVICE_AREA, NO_LEGAL_RELIEF, INCOME_ABOVE_THRESHOLD, CONFLICT_OF_INTEREST, CLIENT_WITHDREW}"
      - name: referral_partner_code
        type: string
        source: input
        description: "Partner organization the client was referred to."
        default: null
        constraints: "nullable; required non-null when the decision is REFER_OUT"
      - name: waitlist_rank
        type: integer
        source: computed
        description: "1-based position among WAITLISTED intakes of the same cycle ordered by created_at ASC; null unless status == 'WAITLISTED'."
        default: null
      - name: waitlist_expires_at_utc
        type: datetime
        source: computed
        description: "Logical clock at waitlisting plus WAITLIST_TTL_DAYS; null unless status == 'WAITLISTED'."
        default: null
      - name: screened_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the DRAFT -> SCREENED transition."
        default: null
      - name: decided_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the decision that left SCREENED (or of waitlist promotion)."
        default: null

  - name: CaseMatter
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: computed
        description: "FK -> Client.id; copied from the accepted IntakeScreening."
      - name: intake_id
        type: string
        source: computed
        description: "FK -> IntakeScreening.id; the accepted screening that created this matter."
      - name: cycle_id
        type: string
        source: computed
        description: "FK -> ProgramCapacityCycle.id; the cycle whose slot this matter consumes."
      - name: principal_matter_id
        type: string
        source: computed
        description: "FK -> CaseMatter.id; the principal applicant's matter when this matter is a derivative filing, else null."
        default: null
      - name: facility_id
        type: string
        source: computed
        description: "FK -> DetentionFacility.id; copied from the accepted IntakeScreening, null when not detained."
        default: null
      - name: case_type
        type: enum
        source: computed
        description: "Copied verbatim from IntakeScreening.case_type."
        constraints: "same enum as IntakeScreening.case_type"
      - name: forum
        type: enum
        source: computed
        description: "Adjudicating forum derived from case_type; see calculations.matter_forum_and_deadlines."
        constraints: "one of {USCIS, EOIR_IMMIGRATION_COURT, BIA, ASYLUM_OFFICE}"
      - name: detained
        type: boolean
        source: computed
        description: "Copied verbatim from IntakeScreening.detained."
      - name: representation_status
        type: enum
        source: computed
        description: "Staffing dimension of the matter; evolves independently of filing_status. See state_machines.CaseMatter."
        default: UNSTAFFED
        constraints: "one of {UNSTAFFED, STAFFED, SUPERVISED_STAFFED, COVERAGE_GAP, WITHDRAWN_FROM}"
      - name: filing_status
        type: enum
        source: computed
        description: "Filing dimension of the matter; evolves independently of representation_status. See state_machines.CaseMatter."
        default: PRE_FILING
        constraints: "one of {PRE_FILING, EVIDENCE_GATHERING, READY_TO_FILE, FILED, RFE_PENDING, DECIDED, APPEALED, CLOSED_NO_FILING}"
      - name: slot_pool_consumed
        type: enum
        source: computed
        description: "Which capacity pool this matter drew from; see calculations.capacity_slot_waterfall."
        constraints: "one of {DETAINED_RESERVED, GENERAL, NONE}"
      - name: statutory_deadline_date
        type: string
        source: computed
        description: "Copied from IntakeScreening.statutory_deadline_date."
        default: null
        constraints: "nullable YYYY-MM-DD"
      - name: expedited_deadline_date
        type: string
        source: computed
        description: "Detained-only expedited deadline; see calculations.matter_forum_and_deadlines."
        default: null
        constraints: "nullable YYYY-MM-DD"
      - name: effective_filing_deadline_date
        type: string
        source: computed
        description: "Earliest non-null of statutory_deadline_date and expedited_deadline_date; see calculations.matter_forum_and_deadlines."
        default: null
        constraints: "nullable YYYY-MM-DD"
      - name: readiness_index_weighted
        type: number
        source: computed
        description: "Verified evidence weight share; see calculations.matter_readiness_index."
        default: 0
        constraints: "0.0000..1.0000, 4 decimal places, round_half_up"
      - name: readiness_ready_strict
        type: boolean
        source: computed
        description: "Strict checklist readiness verdict; see calculations.matter_readiness_index."
        default: false
      - name: evidence_blocking_count
        type: integer
        source: computed
        description: "Count of blocking evidence rows; see calculations.matter_readiness_index."
        default: 0
      - name: readiness_gate_applied
        type: enum
        source: computed
        description: "Which readiness variant last gated a READY_TO_FILE attempt on this matter."
        default: null
        constraints: "nullable; one of {EVIDENCE_WEIGHTED_GATE, CHECKLIST_STRICT_GATE}"
      - name: interpretation_cost_cents
        type: integer
        source: computed
        description: "Sum of billable_cents over COMPLETED InterpretationSession rows of this matter; see calculations.interpretation_cost_rollup."
        default: 0
      - name: direct_hours_logged
        type: number
        source: computed
        description: "Sum of CaseAssignment.direct_hours_logged over all assignments of this matter."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: supervision_hours_logged
        type: number
        source: computed
        description: "Sum of CaseAssignment.supervision_hours_logged over all assignments of this matter."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: coverage_gap_flag
        type: boolean
        source: computed
        description: "Set true when the matter loses its ACTIVE LEAD assignment through an authorization cascade; cleared when a LEAD assignment is activated again."
        default: false
      - name: outcome
        type: enum
        source: computed
        description: "Case outcome recorded with the transition into DECIDED or CLOSED_NO_FILING."
        default: null
        constraints: "nullable; one of {GRANTED, DENIED, ADMINISTRATIVELY_CLOSED, WITHDRAWN, TERMINATED, REFERRED_TO_COURT}"
      - name: outcome_recorded_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant the outcome was recorded."
        default: null
      - name: closed_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant representation_status became WITHDRAWN_FROM."
        default: null

  - name: CaseAssignment
    parent: null
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> CaseMatter.id; the matter being staffed."
      - name: representative_id
        type: string
        source: input
        description: "FK -> Representative.id; the person taking the role."
      - name: supervision_link_id
        type: string
        source: computed
        description: "FK -> CaseAssignment.id; the ACTIVE SUPERVISOR assignment supervising this assignment, null when supervision is not required."
        default: null
      - name: role_on_case
        type: enum
        source: input
        description: "Role this assignment carries on the matter."
        constraints: "one of {LEAD, CO_COUNSEL, SUPERVISOR, INTERPRETER_COORDINATOR}"
      - name: status
        type: enum
        source: computed
        description: "Assignment lifecycle state; see state_machines.CaseAssignment."
        default: PROPOSED
        constraints: "one of {PROPOSED, ACTIVE, SUSPENDED, RELEASED}"
      - name: supervision_source
        type: enum
        source: computed
        description: "How supervision_link_id was resolved; see calculations.supervisor_auto_selection."
        default: NOT_REQUIRED
        constraints: "one of {NOT_REQUIRED, EXPLICIT_LINK, AUTO_SELECTED}"
      - name: direct_hours_logged
        type: number
        source: computed
        description: "Cumulative direct client-service hours logged against this assignment."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: supervision_hours_logged
        type: number
        source: computed
        description: "Cumulative supervision hours logged against this assignment."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: assigned_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant the assignment row was created."
      - name: activated_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent transition into ACTIVE."
        default: null
      - name: released_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the transition into RELEASED."
        default: null
      - name: release_reason_code
        type: enum
        source: input
        description: "Reason recorded on the transition into RELEASED or SUSPENDED."
        default: null
        constraints: "nullable; one of {CLIENT_WITHDREW, MATTER_CLOSED, RECOGNITION_LAPSE, CASELOAD_REBALANCE, AUTHORIZATION_REVOKED, SUPERSEDED_BY_NEW_LEAD, VOLUNTEER_UNAVAILABLE}"

  - name: EvidenceItem
    parent: CaseMatter
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> CaseMatter.id; the matter this evidence supports."
      - name: item_type
        type: enum
        source: input
        description: "Category of the evidence item."
        constraints: "one of {IDENTITY_DOCUMENT, COUNTRY_CONDITIONS, MEDICAL_RECORD, POLICE_REPORT, WITNESS_STATEMENT, TAX_RECORD, CERTIFICATION_LETTER}"
      - name: tier
        type: enum
        source: input
        description: "Whether the item is mandatory for the filing package."
        constraints: "one of {REQUIRED, SUPPORTING, OPTIONAL}"
      - name: weight_points
        type: integer
        source: input
        description: "Evidentiary weight used by the weighted readiness index."
        constraints: "1..10"
      - name: source_language_code
        type: string
        source: input
        description: "Language the item is written in."
        constraints: "lowercase ISO 639-1 two-letter code"
      - name: requires_translation
        type: boolean
        source: computed
        description: "True exactly when source_language_code != 'en'."
      - name: status
        type: enum
        source: computed
        description: "Evidence lifecycle state; see state_machines.EvidenceItem."
        default: REQUESTED
        constraints: "one of {REQUESTED, RECEIVED, TRANSLATED, VERIFIED, REJECTED, WAIVED}"
      - name: due_date
        type: string
        source: input
        description: "Date the item is expected from the client."
        constraints: "YYYY-MM-DD"
      - name: received_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the transition into RECEIVED."
        default: null
      - name: verified_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the transition into VERIFIED."
        default: null
      - name: rejection_round
        type: integer
        source: computed
        description: "Number of times this item has entered REJECTED."
        default: 0
      - name: disposition_reason_code
        type: enum
        source: input
        description: "Reason recorded on a REJECT or WAIVE transition."
        default: null
        constraints: "nullable; one of {ILLEGIBLE, UNTRANSLATED, INCONSISTENT_WITH_DECLARATION, UNOBTAINABLE_COUNTRY_CONDITIONS, CLIENT_SAFETY_RISK, DUPLICATE}"

  - name: Declaration
    parent: CaseMatter
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> CaseMatter.id; the matter the declaration belongs to."
      - name: preparer_assignment_id
        type: string
        source: input
        description: "FK -> CaseAssignment.id; the assignment whose representative drafted the declaration."
      - name: reviewer_assignment_id
        type: string
        source: computed
        description: "FK -> CaseAssignment.id; the assignment whose representative reviewed and certified the declaration."
        default: null
      - name: readback_session_id
        type: string
        source: computed
        description: "FK -> InterpretationSession.id; the DECLARATION_READBACK session in which the declaration was read back to the client."
        default: null
      - name: language_code
        type: string
        source: input
        description: "Language the declaration was taken in."
        constraints: "lowercase ISO 639-1 two-letter code"
      - name: word_count
        type: integer
        source: input
        description: "Word count of the current draft."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "Declaration lifecycle state; see state_machines.Declaration."
        default: DRAFT
        constraints: "one of {DRAFT, IN_REVIEW, REVISION_REQUESTED, CERTIFIED, WITHDRAWN}"
      - name: revision_round
        type: integer
        source: computed
        description: "Number of times this declaration has entered REVISION_REQUESTED."
        default: 0
      - name: readback_completed
        type: boolean
        source: computed
        description: "True exactly when readback_session_id points at an InterpretationSession with status == 'COMPLETED' and purpose == 'DECLARATION_READBACK'."
        default: false
      - name: revision_reason_code
        type: enum
        source: input
        description: "Reason recorded on the transition into REVISION_REQUESTED."
        default: null
        constraints: "nullable; one of {FACTUAL_GAP, LANGUAGE_MISMATCH, MISSING_READBACK, EVIDENCE_INCONSISTENCY, SUPERVISION_REQUIRED}"
      - name: certified_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the transition into CERTIFIED."
        default: null

  - name: InterpretationSession
    parent: CaseMatter
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> CaseMatter.id; the matter the session serves."
      - name: interpreter_representative_id
        type: string
        source: input
        description: "FK -> Representative.id; the in-house interpreter, required non-null when interpreter_source in {STAFF, VOLUNTEER} and must be null when interpreter_source in {CONTRACT, TELEPHONIC}."
        default: null
      - name: language_code
        type: string
        source: input
        description: "Language interpreted."
        constraints: "lowercase ISO 639-1 two-letter code"
      - name: interpreter_source
        type: enum
        source: input
        description: "Where the interpreter comes from; drives the hourly rate."
        constraints: "one of {STAFF, VOLUNTEER, CONTRACT, TELEPHONIC}"
      - name: purpose
        type: enum
        source: input
        description: "What the session is for."
        constraints: "one of {INTAKE, DECLARATION_READBACK, RIGHTS_COUNSELING, HEARING_PREP, FACILITY_VISIT}"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Planned start instant."
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: "Planned end instant."
        constraints: "ISO 8601 UTC with three fractional digits; must be strictly after scheduled_start_utc"
      - name: actual_minutes
        type: integer
        source: input
        description: "Minutes actually interpreted, supplied on the COMPLETE transition."
        default: null
        constraints: "nullable; >= 1 when supplied"
      - name: billed_minutes
        type: integer
        source: computed
        description: "Rounded-up billable minutes; see calculations.interpretation_cost_rollup."
        default: 0
      - name: billable_cents
        type: integer
        source: computed
        description: "Cost of this session in whole cents; see calculations.interpretation_cost_rollup."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Session lifecycle state; see state_machines.InterpretationSession."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, NO_SHOW, CANCELLED}"
      - name: closure_reason_code
        type: enum
        source: input
        description: "Reason recorded on a CANCEL or MARK_NO_SHOW transition."
        default: null
        constraints: "nullable; one of {CLIENT_UNAVAILABLE, INTERPRETER_UNAVAILABLE, FACILITY_DENIED_ACCESS, HEARING_CONTINUED, LANGUAGE_MISMATCH}"

  - name: CalendarEvent
    parent: CaseMatter
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> CaseMatter.id; the matter the event belongs to."
      - name: facility_id
        type: string
        source: input
        description: "FK -> DetentionFacility.id; required non-null when event_type == 'FACILITY_VISIT', must be null otherwise."
        default: null
      - name: assigned_representative_id
        type: string
        source: input
        description: "FK -> Representative.id; the representative who must appear; null only for FILING_DEADLINE events."
        default: null
      - name: continued_from_event_id
        type: string
        source: computed
        description: "FK -> CalendarEvent.id; the CONTINUED predecessor this event replaces, null for originally scheduled events."
        default: null
      - name: event_type
        type: enum
        source: input
        description: "Kind of calendar obligation."
        constraints: "one of {BIOMETRICS, MASTER_CALENDAR_HEARING, INDIVIDUAL_HEARING, ASYLUM_INTERVIEW, FILING_DEADLINE, FACILITY_VISIT}"
      - name: starts_at_utc
        type: datetime
        source: input
        description: "Event start instant."
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: ends_at_utc
        type: datetime
        source: input
        description: "Event end instant."
        constraints: "ISO 8601 UTC with three fractional digits; must be strictly after starts_at_utc"
      - name: location_code
        type: string
        source: input
        description: "Physical location identifier used by the travel-buffer rule."
        constraints: "uppercase, 2..12 characters"
      - name: travel_buffer_minutes
        type: integer
        source: computed
        description: "Buffer applied after this event when comparing against another location; see calculations.calendar_conflict_scan."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Event lifecycle state; see state_machines.CalendarEvent."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CONFIRMED, CONTINUED, COMPLETED, MISSED, CANCELLED}"
      - name: reschedule_count
        type: integer
        source: computed
        description: "Number of successful reschedule operations on this row."
        default: 0
      - name: coverage_gap_flag
        type: boolean
        source: computed
        description: "Set true when the event falls inside COVERAGE_GAP_LOOKAHEAD_DAYS of a matter that lost its ACTIVE LEAD through an authorization cascade."
        default: false
      - name: client_conflict_waived
        type: boolean
        source: input
        description: "When true, the closed-interval client overlap rule is not enforced for this event because the client attends remotely."
        default: false

  - name: InformedDecision
    parent: CaseMatter
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> CaseMatter.id; the matter the decision governs."
      - name: counseled_by_assignment_id
        type: string
        source: input
        description: "FK -> CaseAssignment.id; the assignment whose representative counseled the client."
      - name: readback_session_id
        type: string
        source: input
        description: "FK -> InterpretationSession.id; the RIGHTS_COUNSELING session in which risks and alternatives were interpreted."
        default: null
      - name: decision_type
        type: enum
        source: input
        description: "The course of action the client chose."
        constraints: "one of {FILE_AFFIRMATIVE, PURSUE_RELIEF_IN_COURT, ACCEPT_VOLUNTARY_DEPARTURE, APPEAL_DECISION, WITHDRAW_CASE, DECLINE_RELIEF}"
      - name: risks_disclosed
        type: array
        source: input
        description: "Risks explicitly disclosed to the client."
        constraints: "non-empty subset of {REMOVAL_RISK, DETENTION_RISK, BAR_TO_FUTURE_RELIEF, FEE_LOSS, CRIMINAL_EXPOSURE, FAMILY_SEPARATION, DATA_DISCLOSURE}"
      - name: alternatives_disclosed
        type: array
        source: input
        description: "Alternatives explicitly presented to the client."
        constraints: "non-empty subset of {DO_NOTHING, SEEK_OTHER_COUNSEL, ALTERNATIVE_RELIEF_PATH, VOLUNTARY_DEPARTURE, ADMINISTRATIVE_CLOSURE, APPEAL}"
      - name: counseling_language_code
        type: string
        source: input
        description: "Language the counseling was delivered in."
        constraints: "lowercase ISO 639-1 two-letter code"
      - name: language_match_verified
        type: boolean
        source: computed
        description: "True when counseling_language_code == Client.preferred_language_code, or when readback_session_id points at a COMPLETED session whose language_code equals Client.preferred_language_code."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Informed-decision lifecycle state; see state_machines.InformedDecision."
        default: PENDING
        constraints: "one of {PENDING, DOCUMENTED, SUPERSEDED, REVOKED}"
      - name: acknowledged_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant the client acknowledged, i.e. the transition into DOCUMENTED."
        default: null
      - name: superseded_by_decision_id
        type: string
        source: computed
        description: "FK -> InformedDecision.id; the later decision of the same decision_type that superseded this one."
        default: null
      - name: revocation_reason_code
        type: enum
        source: input
        description: "Reason recorded on the transition into REVOKED."
        default: null
        constraints: "nullable; one of {CLIENT_CHANGED_MIND, NEW_FACTS, COUNSEL_ERROR, LANGUAGE_ACCESS_DEFECT}"

  - name: GrantReport
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ProgramCapacityCycle.id; the capacity cycle whose matters are reported."
      - name: grant_code
        type: string
        source: input
        description: "Funder grant identifier."
        constraints: "uppercase, 2..24 characters"
      - name: period_start_date
        type: string
        source: input
        description: "First reported calendar date, inclusive."
        constraints: "YYYY-MM-DD; must be >= ProgramCapacityCycle.period_start_date"
      - name: period_end_date
        type: string
        source: input
        description: "Last reported calendar date, inclusive."
        constraints: "YYYY-MM-DD; must be > period_start_date and <= ProgramCapacityCycle.period_end_date"
      - name: disclosure_level
        type: enum
        source: input
        description: "How much client-identifying detail the report may carry."
        constraints: "one of {AGGREGATE_ONLY, DEIDENTIFIED_CASE_LEVEL, IDENTIFIED_WITH_CONSENT}"
      - name: status
        type: enum
        source: computed
        description: "Report lifecycle state; see state_machines.GrantReport."
        default: DRAFT
        constraints: "one of {DRAFT, GENERATED, SUBMITTED, AMENDED}"
      - name: cases_served_count
        type: integer
        source: computed
        description: "Count of reported matters; see calculations.grant_reimbursement_rollup."
        default: 0
      - name: outcomes_summary
        type: object
        source: computed
        description: "Map from CaseMatter.outcome value (plus the key 'NOT_YET_DECIDED') to the count of reported matters carrying it."
        default: {}
      - name: consent_verified_count
        type: integer
        source: computed
        description: "Count of reported matters whose Client.confidentiality_consent_scope satisfies disclosure_level; see calculations.grant_confidentiality_partition."
        default: 0
      - name: suppressed_case_count
        type: integer
        source: computed
        description: "cases_served_count - consent_verified_count; these matters appear only inside aggregate counts."
        default: 0
      - name: base_reimbursable_cents
        type: integer
        source: computed
        description: "Sum of per-matter direct-service reimbursement before surcharge; see calculations.grant_reimbursement_rollup."
        default: 0
      - name: supervision_surcharge_cents
        type: integer
        source: computed
        description: "Surcharge whose tier rate is selected from base_reimbursable_cents ONLY; see calculations.grant_reimbursement_rollup."
        default: 0
      - name: total_reimbursable_cents
        type: integer
        source: computed
        description: "base_reimbursable_cents + supervision_surcharge_cents."
        default: 0
      - name: allocated_line_total_cents
        type: integer
        source: computed
        description: "Sum of the per-matter largest-remainder allocation; invariant: equals total_reimbursable_cents."
        default: 0
      - name: rounding_remainder_cents
        type: integer
        source: computed
        description: "Cents redistributed by the largest-remainder pass; see calculations.grant_reimbursement_rollup."
        default: 0
      - name: amendment_round
        type: integer
        source: computed
        description: "Number of times this report has entered AMENDED."
        default: 0
      - name: generated_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent GENERATE run."
        default: null
      - name: submitted_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the transition into SUBMITTED."
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: IntakeScreening
    initial_state: DRAFT
    terminal_states: [DECLINED, REFERRED_OUT, WITHDRAWN, WAITLIST_EXPIRED]
    shape: branching_fork_with_divergent_side_effects
    transitions:
      - from: DRAFT
        to: SCREENED
        trigger: "POST /intake-screenings/{intake_id}/screen"
        actor: IntakeScreener
        preconditions:
          - "Client.status == 'ACTIVE' for IntakeScreening.client_id"
          - "logical clock date is within [ProgramCapacityCycle.period_start_date, ProgramCapacityCycle.period_end_date] inclusive for IntakeScreening.cycle_id"
          - "if IntakeScreening.detained is true then IntakeScreening.facility_id is non-null and DetentionFacility.status != 'CLOSED'"
          - "IntakeScreening.status == 'DRAFT'"
        side_effects:
          - "set screener_representative_id = X-User-ID of the acting IntakeScreener"
          - "recompute Client.fpl_percent via calculations.indigency_fpl_percent"
          - "set legal_eligibility_verdict via calculations.legal_eligibility_verdict"
          - "set urgency_variant_applied, urgency_anchor_date, urgency_score and urgency_tier via calculations.intake_urgency_score"
          - "set screened_at_utc = logical clock"
          - "increment IntakeScreening.version by 1"
      - from: SCREENED
        to: ACCEPTED
        trigger: "POST /intake-screenings/{intake_id}/decide with decision == 'ACCEPT'"
        actor: SupervisingAttorney
        preconditions:
          - "legal_eligibility_verdict == 'ELIGIBLE'"
          - "X-User-ID != IntakeScreening.screener_representative_id (segregation of duties)"
          - "ProgramCapacityCycle.capacity_posture (after calculations.cycle_capacity_posture, override applied) != 'FROZEN', unless IntakeScreening.detained is true AND urgency_tier == 'EMERGENCY'"
          - "if the effective posture is 'RESTRICTED' then urgency_tier IN {URGENT, EMERGENCY}"
          - "calculations.capacity_slot_waterfall resolves a pool whose free count is > 0"
          - "decision_reason_code IN {ACCEPTED_ON_MERIT, ACCEPTED_DETAINED_PRIORITY}"
        side_effects:
          - "set decided_by_representative_id = X-User-ID, decided_at_utc = logical clock"
          - "create one CaseMatter with client_id, intake_id, cycle_id, facility_id, case_type and detained copied from this intake; representation_status = 'UNSTAFFED'; filing_status = 'PRE_FILING'; slot_pool_consumed = the pool resolved by calculations.capacity_slot_waterfall; principal_matter_id = the decide payload's principal_matter_id (null when omitted)"
          - "set CaseMatter.forum, CaseMatter.expedited_deadline_date and CaseMatter.effective_filing_deadline_date via calculations.matter_forum_and_deadlines"
          - "recompute ProgramCapacityCycle.general_slots_consumed, detained_slots_consumed, available_slot_count, utilization_ratio and capacity_posture via calculations.cycle_capacity_posture"
          - "recompute Client.open_matter_count; when it becomes >= 1 set Client.status = 'ACTIVE'"
          - "increment IntakeScreening.version, ProgramCapacityCycle.version and Client.version by 1 each"
        note: "The only transition that consumes a capacity slot. INV-CAPACITY-SLOTS must hold after it."
      - from: SCREENED
        to: WAITLISTED
        trigger: "POST /intake-screenings/{intake_id}/decide with decision == 'WAITLIST'"
        actor: SupervisingAttorney
        preconditions:
          - "legal_eligibility_verdict == 'ELIGIBLE'"
          - "X-User-ID != IntakeScreening.screener_representative_id (segregation of duties)"
          - "decision_reason_code == 'CAPACITY_FULL'"
        side_effects:
          - "set waitlist_rank = 1 + count(IntakeScreening rows of the same cycle_id with status == 'WAITLISTED')"
          - "set waitlist_expires_at_utc = logical clock + WAITLIST_TTL_DAYS days"
          - "set decided_by_representative_id = X-User-ID, decided_at_utc = logical clock"
          - "recompute ProgramCapacityCycle.waitlisted_count; no slot is consumed and capacity_posture is unchanged"
          - "increment IntakeScreening.version and ProgramCapacityCycle.version by 1 each"
      - from: SCREENED
        to: DECLINED
        trigger: "POST /intake-screenings/{intake_id}/decide with decision == 'DECLINE'"
        actor: SupervisingAttorney
        preconditions:
          - "X-User-ID != IntakeScreening.screener_representative_id (segregation of duties)"
          - "decision_reason_code IN {NO_LEGAL_RELIEF, INCOME_ABOVE_THRESHOLD, OUTSIDE_SERVICE_AREA, CONFLICT_OF_INTEREST}"
        side_effects:
          - "set decided_by_representative_id = X-User-ID, decided_at_utc = logical clock"
          - "increment IntakeScreening.version by 1"
        note: "No CaseMatter is created and no slot is consumed — divergent side-effect set versus the ACCEPT branch."
      - from: SCREENED
        to: REFERRED_OUT
        trigger: "POST /intake-screenings/{intake_id}/decide with decision == 'REFER_OUT'"
        actor: SupervisingAttorney
        preconditions:
          - "X-User-ID != IntakeScreening.screener_representative_id (segregation of duties)"
          - "referral_partner_code is non-null in the request payload"
          - "decision_reason_code IN {OUTSIDE_SERVICE_AREA, CONFLICT_OF_INTEREST, NO_LEGAL_RELIEF}"
        side_effects:
          - "set referral_partner_code, decided_by_representative_id = X-User-ID, decided_at_utc = logical clock"
          - "increment IntakeScreening.version by 1"
      - from: WAITLISTED
        to: ACCEPTED
        trigger: "system event: waitlist promotion during POST /capacity-cycles/{cycle_id}/checkpoint, or the slot-release hop of the accepted-intake withdrawal cascade"
        actor: system
        preconditions:
          - "logical clock < waitlist_expires_at_utc"
          - "the recomputed ProgramCapacityCycle.capacity_posture is IN {OPEN, RESTRICTED}"
          - "when the recomputed posture is 'RESTRICTED', urgency_tier IN {URGENT, EMERGENCY}"
          - "calculations.capacity_slot_waterfall resolves a pool whose free count is > 0"
          - "this row has the lowest waitlist_rank among promotable WAITLISTED rows of the cycle, tie-break created_at ASC"
        side_effects:
          - "set decided_at_utc = logical clock; decision_reason_code = 'ACCEPTED_ON_MERIT'; waitlist_rank = null; waitlist_expires_at_utc = null"
          - "create one CaseMatter exactly as in the SCREENED -> ACCEPTED transition"
          - "recompute the cycle capacity fields via calculations.cycle_capacity_posture and re-rank the remaining WAITLISTED rows by created_at ASC"
          - "recompute Client.open_matter_count"
          - "increment IntakeScreening.version, ProgramCapacityCycle.version and Client.version by 1 each"
      - from: WAITLISTED
        to: WAITLIST_EXPIRED
        trigger: "system event: POST /capacity-cycles/{cycle_id}/checkpoint"
        actor: system
        preconditions:
          - "logical clock >= waitlist_expires_at_utc"
        side_effects:
          - "set waitlist_rank = null"
          - "recompute ProgramCapacityCycle.waitlisted_count and re-rank remaining WAITLISTED rows by created_at ASC"
          - "increment IntakeScreening.version and ProgramCapacityCycle.version by 1 each"
        note: "Expiry is evaluated strictly before promotion within a single checkpoint run."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /intake-screenings/{intake_id}/withdraw"
        actor: IntakeScreener
        preconditions:
          - "IntakeScreening.status == 'DRAFT'"
        side_effects:
          - "set decision_reason_code = 'CLIENT_WITHDREW', decided_at_utc = logical clock"
          - "increment IntakeScreening.version by 1"
      - from: SCREENED
        to: WITHDRAWN
        trigger: "POST /intake-screenings/{intake_id}/withdraw"
        actor: IntakeScreener
        preconditions:
          - "IntakeScreening.status == 'SCREENED'"
        side_effects:
          - "set decision_reason_code = 'CLIENT_WITHDREW', decided_at_utc = logical clock"
          - "increment IntakeScreening.version by 1"
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /intake-screenings/{intake_id}/withdraw"
        actor: ClientPortalUser
        preconditions:
          - "X-User-ID == IntakeScreening.client_id"
        side_effects:
          - "set waitlist_rank = null, waitlist_expires_at_utc = null, decision_reason_code = 'CLIENT_WITHDREW'"
          - "recompute ProgramCapacityCycle.waitlisted_count and re-rank remaining WAITLISTED rows by created_at ASC"
          - "increment IntakeScreening.version and ProgramCapacityCycle.version by 1 each"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /intake-screenings/{intake_id}/withdraw"
        actor: IntakeScreener
        preconditions:
          - "IntakeScreening.status == 'ACCEPTED'"
          - "the CaseMatter with intake_id == this row has filing_status != 'FILED' and filing_status != 'DECIDED' and filing_status != 'APPEALED'"
        side_effects:
          - "CASCADE-B hop 1 (caused by this transition): the CaseMatter M with M.intake_id == this row gets representation_status = 'WITHDRAWN_FROM', filing_status = 'CLOSED_NO_FILING', outcome = 'WITHDRAWN', outcome_recorded_at_utc = logical clock, closed_at_utc = logical clock"
          - "CASCADE-B hop 2 (caused by hop 1): because M left staffing, every CaseAssignment A with A.matter_id == M.id and A.status IN {PROPOSED, ACTIVE, SUSPENDED} becomes RELEASED with release_reason_code = 'CLIENT_WITHDREW' and released_at_utc = logical clock; each affected Representative has active_case_load and supervisee_count recomputed and authorization_status re-derived"
          - "CASCADE-B hop 3 (caused by hop 1): because M.representation_status became 'WITHDRAWN_FROM', M no longer counts against its pool, so ProgramCapacityCycle.general_slots_consumed or detained_slots_consumed is decremented and available_slot_count, utilization_ratio and capacity_posture are recomputed via calculations.cycle_capacity_posture"
          - "CASCADE-B hop 4 (caused by hop 3): because the recomputed posture left 'FROZEN', the promotable WAITLISTED IntakeScreening of the same cycle with the lowest waitlist_rank (tie-break created_at ASC) is promoted WAITLISTED -> ACCEPTED, which itself creates a CaseMatter and re-consumes a pool slot"
          - "recompute Client.open_matter_count; when it reaches 0 set Client.status = 'CLOSED'"
          - "increment IntakeScreening.version, CaseMatter.version, ProgramCapacityCycle.version and Client.version by 1 each"
        note: "Compensating action for SCREENED -> ACCEPTED. INV-CAPACITY-SLOTS and INV-CASELOAD must both be restored."

  - entity: CaseMatter
    initial_state: "representation_status = UNSTAFFED; filing_status = PRE_FILING"
    terminal_states: ["representation_status = WITHDRAWN_FROM", "filing_status = CLOSED_NO_FILING"]
    shape: parallel_dimensions
    note: |
      Two independent state dimensions live on the same row. `representation_status`
      is driven only by CaseAssignment transitions and authorization cascades;
      `filing_status` is driven only by POST /case-matters/{matter_id}/advance-filing.
      Neither dimension constrains the other except where a precondition says so.
    transitions:
      - from: "representation_status = UNSTAFFED"
        to: "representation_status = STAFFED"
        trigger: "POST /case-assignments/{assignment_id}/transition with action == 'ACTIVATE' on a LEAD assignment whose representative has supervision_required == false"
        actor: SupervisingAttorney
        preconditions:
          - "CaseAssignment.role_on_case == 'LEAD' and CaseAssignment.status == 'PROPOSED'"
          - "Representative.supervision_required == false"
        side_effects:
          - "set CaseMatter.representation_status = 'STAFFED' and coverage_gap_flag = false"
          - "increment CaseMatter.version by 1"
      - from: "representation_status = UNSTAFFED"
        to: "representation_status = SUPERVISED_STAFFED"
        trigger: "POST /case-assignments/{assignment_id}/transition with action == 'ACTIVATE' on a LEAD assignment whose representative has supervision_required == true"
        actor: SupervisingAttorney
        preconditions:
          - "CaseAssignment.role_on_case == 'LEAD' and CaseAssignment.status == 'PROPOSED'"
          - "CaseAssignment.supervision_link_id points at a CaseAssignment with status == 'ACTIVE' and role_on_case == 'SUPERVISOR' on the same matter"
        side_effects:
          - "set CaseMatter.representation_status = 'SUPERVISED_STAFFED' and coverage_gap_flag = false"
          - "recompute the supervising Representative.supervisee_count"
          - "increment CaseMatter.version by 1"
      - from: "representation_status IN {STAFFED, SUPERVISED_STAFFED}"
        to: "representation_status = COVERAGE_GAP"
        trigger: "system event: the assignment-suspension hop of the recognition-lapse cascade, or POST /case-assignments/{assignment_id}/transition with action == 'SUSPEND' on the only ACTIVE LEAD assignment"
        actor: system
        preconditions:
          - "no CaseAssignment on the matter has status == 'ACTIVE' and role_on_case == 'LEAD' after the suspension"
        side_effects:
          - "set CaseMatter.representation_status = 'COVERAGE_GAP' and coverage_gap_flag = true"
          - "every Declaration of the matter with status == 'IN_REVIEW' moves to REVISION_REQUESTED with revision_reason_code = 'SUPERVISION_REQUIRED' and revision_round incremented by 1"
          - "every CalendarEvent of the matter with status IN {SCHEDULED, CONFIRMED} whose starts_at_utc is within COVERAGE_GAP_LOOKAHEAD_DAYS days after the logical clock gets coverage_gap_flag = true"
          - "increment CaseMatter.version by 1"
      - from: "representation_status = COVERAGE_GAP"
        to: "representation_status IN {STAFFED, SUPERVISED_STAFFED}"
        trigger: "POST /case-assignments/{assignment_id}/transition with action == 'ACTIVATE' on a replacement LEAD assignment"
        actor: SupervisingAttorney
        preconditions:
          - "the activated assignment has role_on_case == 'LEAD'"
        side_effects:
          - "set representation_status = 'SUPERVISED_STAFFED' when the new lead has supervision_required == true, else 'STAFFED'"
          - "set coverage_gap_flag = false and clear coverage_gap_flag on every CalendarEvent of the matter"
          - "increment CaseMatter.version by 1"
        note: "Cycle: STAFFED -> COVERAGE_GAP -> STAFFED is reachable any number of times."
      - from: "representation_status IN {UNSTAFFED, STAFFED, SUPERVISED_STAFFED, COVERAGE_GAP}"
        to: "representation_status = WITHDRAWN_FROM"
        trigger: "POST /case-matters/{matter_id}/withdraw-representation"
        actor: SupervisingAttorney
        preconditions:
          - "CaseMatter.filing_status != 'FILED' or the request carries withdrawal_motion_filed == true"
          - "an InformedDecision of this matter with decision_type == 'WITHDRAW_CASE' and status == 'DOCUMENTED' exists"
        side_effects:
          - "set representation_status = 'WITHDRAWN_FROM', closed_at_utc = logical clock; filing_status becomes 'CLOSED_NO_FILING' unless it is already 'DECIDED'"
          - "every CaseAssignment of the matter with status IN {PROPOSED, ACTIVE, SUSPENDED} becomes RELEASED with release_reason_code = 'MATTER_CLOSED'; affected Representative.active_case_load and supervisee_count are recomputed"
          - "the matter stops counting against its pool, so ProgramCapacityCycle counters and capacity_posture are recomputed via calculations.cycle_capacity_posture"
          - "recompute Client.open_matter_count; when it reaches 0 set Client.status = 'CLOSED'"
          - "increment CaseMatter.version, ProgramCapacityCycle.version and Client.version by 1 each"
      - from: "filing_status = PRE_FILING"
        to: "filing_status = EVIDENCE_GATHERING"
        trigger: "POST /case-matters/{matter_id}/advance-filing with target_filing_status == 'EVIDENCE_GATHERING'"
        actor: CaseRepresentative
        preconditions:
          - "CaseMatter.representation_status IN {STAFFED, SUPERVISED_STAFFED}"
          - "at least one EvidenceItem with matter_id == this matter and tier == 'REQUIRED' exists"
        side_effects:
          - "recompute readiness_index_weighted, readiness_ready_strict and evidence_blocking_count via calculations.matter_readiness_index"
          - "increment CaseMatter.version by 1"
      - from: "filing_status = EVIDENCE_GATHERING"
        to: "filing_status = READY_TO_FILE"
        trigger: "POST /case-matters/{matter_id}/advance-filing with target_filing_status == 'READY_TO_FILE'"
        actor: CaseRepresentative
        preconditions:
          - "CaseMatter.representation_status IN {STAFFED, SUPERVISED_STAFFED}"
          - "a Declaration of this matter with status == 'CERTIFIED' exists"
          - "the readiness gate of calculations.matter_readiness_index selected by CaseMatter.detained passes"
        side_effects:
          - "set readiness_gate_applied to the variant that was evaluated"
          - "recompute readiness_index_weighted, readiness_ready_strict and evidence_blocking_count via calculations.matter_readiness_index"
          - "increment CaseMatter.version by 1"
      - from: "filing_status = READY_TO_FILE"
        to: "filing_status = EVIDENCE_GATHERING"
        trigger: "POST /case-matters/{matter_id}/advance-filing with target_filing_status == 'EVIDENCE_GATHERING'"
        actor: CaseRepresentative
        preconditions:
          - "CaseMatter.filing_status == 'READY_TO_FILE'"
        side_effects:
          - "recompute readiness_index_weighted, readiness_ready_strict and evidence_blocking_count via calculations.matter_readiness_index"
          - "increment CaseMatter.version by 1"
        note: "Revert edge; makes the filing dimension non-linear independently of the RFE cycle."
      - from: "filing_status = READY_TO_FILE"
        to: "filing_status = FILED"
        trigger: "POST /case-matters/{matter_id}/advance-filing with target_filing_status == 'FILED'"
        actor: CaseRepresentative
        preconditions:
          - "an InformedDecision of this matter with status == 'DOCUMENTED' and decision_type IN {FILE_AFFIRMATIVE, PURSUE_RELIEF_IN_COURT} exists"
          - "logical clock date <= CaseMatter.effective_filing_deadline_date, or effective_filing_deadline_date is null"
        side_effects:
          - "every CalendarEvent of the matter with event_type == 'FILING_DEADLINE' and status IN {SCHEDULED, CONFIRMED} becomes COMPLETED"
          - "increment CaseMatter.version by 1"
      - from: "filing_status = FILED"
        to: "filing_status = RFE_PENDING"
        trigger: "POST /case-matters/{matter_id}/advance-filing with target_filing_status == 'RFE_PENDING'"
        actor: CaseRepresentative
        preconditions:
          - "CaseMatter.filing_status == 'FILED'"
          - "rfe_response_due_date is supplied in the request payload"
        side_effects:
          - "set statutory_deadline_date = rfe_response_due_date and recompute effective_filing_deadline_date via calculations.matter_forum_and_deadlines"
          - "create one CalendarEvent of event_type 'FILING_DEADLINE' at 00:00:00.000Z on rfe_response_due_date with location_code 'MAIL', assigned_representative_id null and status 'SCHEDULED'"
          - "increment CaseMatter.version by 1"
      - from: "filing_status = RFE_PENDING"
        to: "filing_status = FILED"
        trigger: "POST /case-matters/{matter_id}/advance-filing with target_filing_status == 'FILED'"
        actor: CaseRepresentative
        preconditions:
          - "evidence_blocking_count == 0 after recomputation via calculations.matter_readiness_index"
          - "logical clock date <= CaseMatter.effective_filing_deadline_date"
        side_effects:
          - "every CalendarEvent of the matter with event_type == 'FILING_DEADLINE' and status IN {SCHEDULED, CONFIRMED} becomes COMPLETED"
          - "increment CaseMatter.version by 1"
        note: "Cycle: FILED -> RFE_PENDING -> FILED may repeat."
      - from: "filing_status IN {FILED, RFE_PENDING}"
        to: "filing_status = DECIDED"
        trigger: "POST /case-matters/{matter_id}/advance-filing with target_filing_status == 'DECIDED'"
        actor: CaseRepresentative
        preconditions:
          - "outcome is supplied in the request payload and is IN {GRANTED, DENIED, ADMINISTRATIVELY_CLOSED, TERMINATED, REFERRED_TO_COURT}"
        side_effects:
          - "set outcome and outcome_recorded_at_utc = logical clock"
          - "every CalendarEvent of the matter with status IN {SCHEDULED, CONFIRMED} and event_type != 'FACILITY_VISIT' becomes CANCELLED"
          - "increment CaseMatter.version by 1"
      - from: "filing_status = DECIDED"
        to: "filing_status = APPEALED"
        trigger: "POST /case-matters/{matter_id}/advance-filing with target_filing_status == 'APPEALED'"
        actor: CaseRepresentative
        preconditions:
          - "CaseMatter.outcome == 'DENIED'"
          - "an InformedDecision of this matter with decision_type == 'APPEAL_DECISION' and status == 'DOCUMENTED' exists"
          - "appeal_due_date is supplied in the request payload"
        side_effects:
          - "set forum = 'BIA', statutory_deadline_date = appeal_due_date, outcome = null, outcome_recorded_at_utc = null and recompute effective_filing_deadline_date"
          - "increment CaseMatter.version by 1"
      - from: "filing_status = APPEALED"
        to: "filing_status = DECIDED"
        trigger: "POST /case-matters/{matter_id}/advance-filing with target_filing_status == 'DECIDED'"
        actor: CaseRepresentative
        preconditions:
          - "outcome is supplied in the request payload"
        side_effects:
          - "set outcome and outcome_recorded_at_utc = logical clock"
          - "increment CaseMatter.version by 1"
        note: "Cycle: DECIDED -> APPEALED -> DECIDED may repeat."

  - entity: OrganizationRecognition
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: CONDITIONAL
        trigger: "POST /organization-recognitions/{recognition_id}/transition with action == 'CONDITION'"
        actor: ProgramDirector
        preconditions:
          - "conditional_reason_code is supplied in the request payload"
        side_effects:
          - "set conditional_reason_code"
          - "re-derive authorization_status for every Representative holding an Accreditation of this recognition via calculations.representative_authorization_status"
          - "increment OrganizationRecognition.version by 1"
      - from: CONDITIONAL
        to: ACTIVE
        trigger: "POST /organization-recognitions/{recognition_id}/transition with action == 'REINSTATE'"
        actor: ProgramDirector
        preconditions:
          - "logical clock date <= expiry_date"
        side_effects:
          - "set conditional_reason_code = null"
          - "re-derive authorization_status for every Representative holding an Accreditation of this recognition"
          - "increment OrganizationRecognition.version by 1"
        note: "Cycle: ACTIVE -> CONDITIONAL -> ACTIVE."
      - from: "ACTIVE or CONDITIONAL"
        to: LAPSED
        trigger: "POST /organization-recognitions/{recognition_id}/transition with action == 'LAPSE'"
        actor: ProgramDirector
        preconditions:
          - "OrganizationRecognition.status IN {ACTIVE, CONDITIONAL}"
        side_effects:
          - "CASCADE-A hop 0: set status = 'LAPSED', lapsed_at_utc = logical clock, conditional_reason_code = null"
          - "CASCADE-A hop 1 (caused by hop 0): every Accreditation A with A.recognition_id == this row and A.status IN {APPROVED, EXPIRING, RENEWAL_PENDING} moves to SUSPENDED_BY_RECOGNITION with decision_reason_code = 'RECOGNITION_LAPSE'; suspended_accreditation_count is set to the resulting count"
          - "CASCADE-A hop 2 (caused by hop 1): because those accreditations no longer qualify, every Representative whose re-derived calculations.representative_authorization_status now yields 'AUTHORIZATION_SUSPENDED' has each of its CaseAssignment rows with status == 'ACTIVE' moved to SUSPENDED with release_reason_code = 'RECOGNITION_LAPSE'; active_case_load and supervisee_count are recomputed for every affected Representative"
          - "CASCADE-A hop 3 (caused by hop 2): because those suspensions removed the only ACTIVE LEAD assignment, every affected CaseMatter moves representation_status to 'COVERAGE_GAP' and sets coverage_gap_flag = true"
          - "CASCADE-A hop 4 (caused by hop 3): because those matters entered COVERAGE_GAP, every Declaration of theirs with status == 'IN_REVIEW' moves to REVISION_REQUESTED with revision_reason_code = 'SUPERVISION_REQUIRED' and revision_round incremented by 1, and every CalendarEvent of theirs with status IN {SCHEDULED, CONFIRMED} starting within COVERAGE_GAP_LOOKAHEAD_DAYS days after the logical clock gets coverage_gap_flag = true"
          - "increment version by 1 on OrganizationRecognition and on every mutated Accreditation, CaseAssignment, Representative, CaseMatter, Declaration and CalendarEvent"
        note: "Depth-4 transitive cascade; each hop is caused by the preceding hop, not by the original request."
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /organization-recognitions/{recognition_id}/transition with action == 'REINSTATE'"
        actor: ProgramDirector
        preconditions:
          - "logical clock date <= expiry_date"
        side_effects:
          - "set lapsed_at_utc = null"
          - "every Accreditation with status == 'SUSPENDED_BY_RECOGNITION' whose expiry_date >= logical clock date returns to APPROVED; those whose expiry_date < logical clock date move to EXPIRED; suspended_accreditation_count becomes 0"
          - "every CaseAssignment suspended with release_reason_code == 'RECOGNITION_LAPSE' whose representative is again authorized returns to ACTIVE; affected Representative.active_case_load and supervisee_count are recomputed"
          - "every CaseMatter that regains an ACTIVE LEAD assignment leaves COVERAGE_GAP as described in state_machines.CaseMatter"
          - "increment version by 1 on every mutated row"
        note: "Cycle: ACTIVE -> LAPSED -> ACTIVE. Compensating action for the LAPSE cascade."
      - from: "ACTIVE, CONDITIONAL or LAPSED"
        to: WITHDRAWN
        trigger: "POST /organization-recognitions/{recognition_id}/transition with action == 'WITHDRAW'"
        actor: ProgramDirector
        preconditions:
          - "OrganizationRecognition.status != 'WITHDRAWN'"
        side_effects:
          - "every Accreditation of this recognition with status != 'REVOKED' moves to REVOKED with decision_reason_code = 'RECOGNITION_LAPSE'"
          - "every CaseAssignment of every affected Representative with status IN {PROPOSED, ACTIVE, SUSPENDED} moves to RELEASED with release_reason_code = 'AUTHORIZATION_REVOKED'"
          - "affected Representative.active_case_load, supervisee_count and authorization_status are recomputed; affected CaseMatter rows follow state_machines.CaseMatter into COVERAGE_GAP"
          - "increment version by 1 on every mutated row"

  - entity: Accreditation
    initial_state: PENDING
    terminal_states: [EXPIRED, REVOKED, DENIED]
    shape: cyclic
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /accreditations/{accreditation_id}/transition with action == 'APPROVE'"
        actor: SupervisingAttorney
        preconditions:
          - "OrganizationRecognition.status IN {ACTIVE, CONDITIONAL} for Accreditation.recognition_id"
          - "X-User-ID != Accreditation.representative_id (no self-approval)"
          - "the acting Representative has rep_type == 'STAFF_ATTORNEY' and authorization_status == 'AUTHORIZED_ATTORNEY'"
          - "calculations.accreditation_forum_grant yields a non-empty authorized_forums set"
        side_effects:
          - "set approved_by_representative_id = X-User-ID, decision_reason_code = 'CREDENTIALS_VERIFIED'"
          - "set effective_date = logical clock date, expiry_date and authorized_forums via calculations.accreditation_forum_grant"
          - "re-derive Representative.authorization_status via calculations.representative_authorization_status"
          - "increment Accreditation.version and Representative.version by 1 each"
      - from: PENDING
        to: DENIED
        trigger: "POST /accreditations/{accreditation_id}/transition with action == 'DENY'"
        actor: SupervisingAttorney
        preconditions:
          - "decision_reason_code IN {TRAINING_INCOMPLETE, BACKGROUND_ADVERSE}"
          - "X-User-ID != Accreditation.representative_id"
        side_effects:
          - "set decision_reason_code and approved_by_representative_id = X-User-ID"
          - "increment Accreditation.version by 1"
      - from: APPROVED
        to: EXPIRING
        trigger: "system event: POST /capacity-cycles/{cycle_id}/checkpoint"
        actor: system
        preconditions:
          - "logical clock date >= expiry_date - ACCREDITATION_EXPIRING_WINDOW_DAYS and logical clock date <= expiry_date"
        side_effects:
          - "increment Accreditation.version by 1"
          - "Representative.authorization_status is unchanged because EXPIRING still qualifies"
      - from: EXPIRING
        to: RENEWAL_PENDING
        trigger: "POST /accreditations/{accreditation_id}/renew"
        actor: SupervisingAttorney
        preconditions:
          - "expected_recognition_version in the request body equals OrganizationRecognition.version"
          - "OrganizationRecognition.status IN {ACTIVE, CONDITIONAL}"
          - "logical clock date <= expiry_date"
        side_effects:
          - "increment OrganizationRecognition.version by 1"
          - "increment Accreditation.version by 1"
      - from: RENEWAL_PENDING
        to: APPROVED
        trigger: "POST /accreditations/{accreditation_id}/transition with action == 'APPROVE'"
        actor: SupervisingAttorney
        preconditions:
          - "OrganizationRecognition.status IN {ACTIVE, CONDITIONAL}"
          - "X-User-ID != Accreditation.representative_id"
        side_effects:
          - "increment renewal_round by 1"
          - "set effective_date = logical clock date and recompute expiry_date and authorized_forums via calculations.accreditation_forum_grant"
          - "set approved_by_representative_id = X-User-ID"
          - "re-derive Representative.authorization_status"
          - "increment Accreditation.version and Representative.version by 1 each"
        note: "Cycle: APPROVED -> EXPIRING -> RENEWAL_PENDING -> APPROVED."
      - from: "APPROVED, EXPIRING or RENEWAL_PENDING"
        to: SUSPENDED_BY_RECOGNITION
        trigger: "cascade hop 1 of POST /organization-recognitions/{recognition_id}/transition with action IN {LAPSE, WITHDRAW}"
        actor: system
        preconditions:
          - "OrganizationRecognition.status became 'LAPSED' in this request"
        side_effects:
          - "set decision_reason_code = 'RECOGNITION_LAPSE'"
          - "re-derive Representative.authorization_status, which yields 'AUTHORIZATION_SUSPENDED' when no other qualifying Accreditation remains"
          - "increment Accreditation.version and Representative.version by 1 each"
      - from: SUSPENDED_BY_RECOGNITION
        to: APPROVED
        trigger: "cascade hop 1 of POST /organization-recognitions/{recognition_id}/transition with action == 'REINSTATE'"
        actor: system
        preconditions:
          - "OrganizationRecognition.status became 'ACTIVE' in this request"
          - "logical clock date <= Accreditation.expiry_date"
        side_effects:
          - "clear decision_reason_code"
          - "re-derive Representative.authorization_status"
          - "increment Accreditation.version and Representative.version by 1 each"
      - from: "APPROVED, EXPIRING, RENEWAL_PENDING or SUSPENDED_BY_RECOGNITION"
        to: EXPIRED
        trigger: "system event: POST /capacity-cycles/{cycle_id}/checkpoint, or recognition REINSTATE evaluated after expiry_date"
        actor: system
        preconditions:
          - "logical clock date > Accreditation.expiry_date"
        side_effects:
          - "re-derive Representative.authorization_status, which yields 'UNAUTHORIZED' for an ACCREDITED_REP with no remaining qualifying Accreditation"
          - "every CaseAssignment of that Representative with status == 'ACTIVE' moves to SUSPENDED with release_reason_code = 'AUTHORIZATION_REVOKED'; affected CaseMatter rows follow state_machines.CaseMatter into COVERAGE_GAP"
          - "increment version by 1 on every mutated row"
      - from: "APPROVED, EXPIRING, RENEWAL_PENDING or SUSPENDED_BY_RECOGNITION"
        to: REVOKED
        trigger: "POST /accreditations/{accreditation_id}/transition with action == 'REVOKE'"
        actor: SupervisingAttorney
        preconditions:
          - "decision_reason_code IN {CONDUCT_VIOLATION, VOLUNTARY_SURRENDER}"
          - "X-User-ID != Accreditation.representative_id"
        side_effects:
          - "set decision_reason_code and approved_by_representative_id = X-User-ID"
          - "re-derive Representative.authorization_status"
          - "every CaseAssignment of that Representative with status IN {PROPOSED, ACTIVE} moves to RELEASED with release_reason_code = 'AUTHORIZATION_REVOKED'; affected Representative.active_case_load is recomputed and affected CaseMatter rows follow state_machines.CaseMatter into COVERAGE_GAP"
          - "increment version by 1 on every mutated row"

  - entity: CaseAssignment
    initial_state: PROPOSED
    terminal_states: [RELEASED]
    shape: branching_with_revert
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /case-assignments/{assignment_id}/transition with action == 'ACTIVATE'"
        actor: SupervisingAttorney
        preconditions:
          - "Representative.status == 'ACTIVE' and Representative.authorization_status NOT IN {AUTHORIZATION_SUSPENDED, UNAUTHORIZED}"
          - "CaseMatter.representation_status != 'WITHDRAWN_FROM'"
          - "Representative.active_case_load < Representative.max_case_load when role_on_case IN {LEAD, CO_COUNSEL}"
          - "when Representative.supervision_required == true, supervision_link_id is non-null and points at an ACTIVE SUPERVISOR assignment on the same matter whose Representative.supervisee_count < max_supervisees"
          - "when role_on_case == 'LEAD' and CaseMatter.forum IN {EOIR_IMMIGRATION_COURT, BIA}, Representative.authorization_status == 'AUTHORIZED_ATTORNEY' or the qualifying Accreditation has accreditation_type == 'FULL' and authorized_forums contains CaseMatter.forum"
        side_effects:
          - "set activated_at_utc = logical clock"
          - "when role_on_case == 'LEAD', every other CaseAssignment of the matter with role_on_case == 'LEAD' and status IN {PROPOSED, ACTIVE, SUSPENDED} moves to RELEASED with release_reason_code = 'SUPERSEDED_BY_NEW_LEAD'"
          - "recompute Representative.active_case_load and, for the supervisor, supervisee_count"
          - "advance CaseMatter.representation_status per state_machines.CaseMatter"
          - "increment CaseAssignment.version, Representative.version and CaseMatter.version by 1 each"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /case-assignments/{assignment_id}/transition with action == 'SUSPEND', or hop 2 of the recognition LAPSE cascade"
        actor: SupervisingAttorney
        preconditions:
          - "CaseAssignment.status == 'ACTIVE'"
          - "release_reason_code is supplied when the actor is SupervisingAttorney"
        side_effects:
          - "recompute Representative.active_case_load and supervisee_count"
          - "when this was the only ACTIVE LEAD assignment, CaseMatter moves to COVERAGE_GAP per state_machines.CaseMatter"
          - "increment CaseAssignment.version, Representative.version and CaseMatter.version by 1 each"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /case-assignments/{assignment_id}/transition with action == 'ACTIVATE', or the recognition REINSTATE cascade"
        actor: SupervisingAttorney
        preconditions:
          - "Representative.authorization_status NOT IN {AUTHORIZATION_SUSPENDED, UNAUTHORIZED}"
          - "Representative.active_case_load < Representative.max_case_load when role_on_case IN {LEAD, CO_COUNSEL}"
          - "CaseMatter.representation_status != 'WITHDRAWN_FROM'"
        side_effects:
          - "set activated_at_utc = logical clock and release_reason_code = null"
          - "recompute Representative.active_case_load and supervisee_count"
          - "advance CaseMatter.representation_status per state_machines.CaseMatter"
          - "increment CaseAssignment.version, Representative.version and CaseMatter.version by 1 each"
        note: "Revert edge; ACTIVE -> SUSPENDED -> ACTIVE may repeat."
      - from: "PROPOSED, ACTIVE or SUSPENDED"
        to: RELEASED
        trigger: "POST /case-assignments/{assignment_id}/transition with action == 'RELEASE', the matter-withdrawal cascade, or the accepted-intake withdrawal cascade"
        actor: SupervisingAttorney
        preconditions:
          - "CaseAssignment.status != 'RELEASED'"
          - "release_reason_code is supplied when the actor is SupervisingAttorney"
          - "no CaseAssignment with supervision_link_id == this assignment has status IN {PROPOSED, ACTIVE} when role_on_case == 'SUPERVISOR'"
        side_effects:
          - "set released_at_utc = logical clock"
          - "recompute Representative.active_case_load and supervisee_count"
          - "when this was the only ACTIVE LEAD assignment, CaseMatter moves to COVERAGE_GAP per state_machines.CaseMatter"
          - "increment CaseAssignment.version, Representative.version and CaseMatter.version by 1 each"
        note: "Compensating action for ACTIVATE. INV-CASELOAD must be restored exactly."

  - entity: EvidenceItem
    initial_state: REQUESTED
    terminal_states: [VERIFIED, WAIVED]
    shape: cyclic
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /evidence-items/{item_id}/transition with action == 'RECEIVE'"
        actor: CaseRepresentative
        preconditions:
          - "CaseMatter.representation_status IN {STAFFED, SUPERVISED_STAFFED}"
        side_effects:
          - "set received_at_utc = logical clock"
          - "recompute CaseMatter.readiness_index_weighted, readiness_ready_strict and evidence_blocking_count via calculations.matter_readiness_index"
          - "increment EvidenceItem.version and CaseMatter.version by 1 each"
      - from: RECEIVED
        to: TRANSLATED
        trigger: "POST /evidence-items/{item_id}/transition with action == 'TRANSLATE'"
        actor: CaseRepresentative
        preconditions:
          - "EvidenceItem.requires_translation == true"
        side_effects:
          - "recompute the CaseMatter readiness fields via calculations.matter_readiness_index"
          - "increment EvidenceItem.version and CaseMatter.version by 1 each"
      - from: "RECEIVED or TRANSLATED"
        to: VERIFIED
        trigger: "POST /evidence-items/{item_id}/transition with action == 'VERIFY'"
        actor: CaseRepresentative
        preconditions:
          - "EvidenceItem.requires_translation == false or EvidenceItem.status == 'TRANSLATED'"
        side_effects:
          - "set verified_at_utc = logical clock"
          - "recompute the CaseMatter readiness fields via calculations.matter_readiness_index"
          - "increment EvidenceItem.version and CaseMatter.version by 1 each"
      - from: "RECEIVED or TRANSLATED"
        to: REJECTED
        trigger: "POST /evidence-items/{item_id}/transition with action == 'REJECT'"
        actor: CaseRepresentative
        preconditions:
          - "disposition_reason_code IN {ILLEGIBLE, UNTRANSLATED, INCONSISTENT_WITH_DECLARATION, DUPLICATE}"
        side_effects:
          - "increment rejection_round by 1 and set disposition_reason_code"
          - "recompute the CaseMatter readiness fields; evidence_blocking_count rises because REJECTED rows are blocking"
          - "increment EvidenceItem.version and CaseMatter.version by 1 each"
      - from: REJECTED
        to: REQUESTED
        trigger: "POST /evidence-items/{item_id}/transition with action == 'REREQUEST'"
        actor: CaseRepresentative
        preconditions:
          - "EvidenceItem.status == 'REJECTED'"
          - "new_due_date is supplied in the request payload and is >= logical clock date"
        side_effects:
          - "set due_date = new_due_date, received_at_utc = null and disposition_reason_code = null"
          - "recompute the CaseMatter readiness fields"
          - "increment EvidenceItem.version and CaseMatter.version by 1 each"
        note: "Cycle: RECEIVED -> REJECTED -> REQUESTED -> RECEIVED may repeat."
      - from: "REQUESTED, RECEIVED, TRANSLATED or REJECTED"
        to: WAIVED
        trigger: "POST /evidence-items/{item_id}/transition with action == 'WAIVE'"
        actor: SupervisingAttorney
        preconditions:
          - "disposition_reason_code IN {UNOBTAINABLE_COUNTRY_CONDITIONS, CLIENT_SAFETY_RISK, DUPLICATE}"
        side_effects:
          - "set disposition_reason_code"
          - "recompute the CaseMatter readiness fields; WAIVED rows leave both the numerator and the denominator of readiness_index_weighted"
          - "increment EvidenceItem.version and CaseMatter.version by 1 each"

  - entity: Declaration
    initial_state: DRAFT
    terminal_states: [CERTIFIED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /declarations/{declaration_id}/transition with action == 'SUBMIT_FOR_REVIEW'"
        actor: CaseRepresentative
        preconditions:
          - "X-User-ID == the Representative of Declaration.preparer_assignment_id"
          - "CaseAssignment.status == 'ACTIVE' for preparer_assignment_id"
          - "CaseMatter.representation_status IN {STAFFED, SUPERVISED_STAFFED}"
          - "Declaration.language_code == Client.preferred_language_code, or a COMPLETED InterpretationSession of this matter with purpose == 'DECLARATION_READBACK' and language_code == Client.preferred_language_code exists"
        side_effects:
          - "when a qualifying COMPLETED DECLARATION_READBACK session exists, set readback_session_id to the one with the latest scheduled_start_utc (tie-break created_at ASC) and readback_completed = true"
          - "increment Declaration.version by 1"
      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /declarations/{declaration_id}/transition with action == 'REQUEST_REVISION', or hop 4 of the recognition LAPSE cascade, or the CaseMatter COVERAGE_GAP transition"
        actor: SupervisingAttorney
        preconditions:
          - "Declaration.status == 'IN_REVIEW'"
          - "revision_reason_code is supplied when the actor is SupervisingAttorney"
        side_effects:
          - "increment revision_round by 1 and set revision_reason_code"
          - "increment Declaration.version by 1"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /declarations/{declaration_id}/transition with action == 'RESUME_DRAFT'"
        actor: CaseRepresentative
        preconditions:
          - "X-User-ID == the Representative of Declaration.preparer_assignment_id"
          - "word_count is supplied in the request payload"
        side_effects:
          - "set word_count from the payload and revision_reason_code = null"
          - "increment Declaration.version by 1"
        note: "Cycle: DRAFT -> IN_REVIEW -> REVISION_REQUESTED -> DRAFT may repeat without bound."
      - from: IN_REVIEW
        to: CERTIFIED
        trigger: "POST /declarations/{declaration_id}/transition with action == 'CERTIFY'"
        actor: SupervisingAttorney
        preconditions:
          - "reviewer_assignment_id is supplied in the request payload and points at a CaseAssignment with status == 'ACTIVE' and matter_id == Declaration.matter_id"
          - "the Representative of the supplied reviewer_assignment_id != the Representative of Declaration.preparer_assignment_id (segregation of duties)"
          - "the Representative of the supplied reviewer_assignment_id has rep_type == 'STAFF_ATTORNEY' and authorization_status == 'AUTHORIZED_ATTORNEY'"
          - "Declaration.readback_completed == true when Client.interpreter_required == true"
          - "no EvidenceItem of the matter has status == 'REJECTED' with disposition_reason_code == 'INCONSISTENT_WITH_DECLARATION'"
        side_effects:
          - "set reviewer_assignment_id and certified_at_utc = logical clock"
          - "recompute CaseMatter.readiness_index_weighted, readiness_ready_strict and evidence_blocking_count via calculations.matter_readiness_index"
          - "increment Declaration.version and CaseMatter.version by 1 each"
      - from: "DRAFT, IN_REVIEW or REVISION_REQUESTED"
        to: WITHDRAWN
        trigger: "POST /declarations/{declaration_id}/transition with action == 'WITHDRAW'"
        actor: SupervisingAttorney
        preconditions:
          - "Declaration.status != 'CERTIFIED'"
        side_effects:
          - "set readback_session_id = null and readback_completed = false"
          - "increment Declaration.version by 1"

  - entity: InterpretationSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /interpretation-sessions/{session_id}/transition with action == 'COMPLETE'"
        actor: CaseRepresentative
        preconditions:
          - "actual_minutes is supplied in the request payload and is >= 1"
          - "logical clock >= InterpretationSession.scheduled_start_utc"
          - "CaseMatter.representation_status != 'WITHDRAWN_FROM'"
        side_effects:
          - "set actual_minutes, then billed_minutes and billable_cents via calculations.interpretation_cost_rollup"
          - "recompute CaseMatter.interpretation_cost_cents as the sum of billable_cents over COMPLETED sessions of the matter (per-session rounding first, then summation)"
          - "when purpose == 'DECLARATION_READBACK', every Declaration of the matter with status == 'IN_REVIEW' and language_code == this session's language_code gets readback_session_id = this session and readback_completed = true"
          - "increment InterpretationSession.version and CaseMatter.version by 1 each"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /interpretation-sessions/{session_id}/transition with action == 'MARK_NO_SHOW'"
        actor: CaseRepresentative
        preconditions:
          - "logical clock >= InterpretationSession.scheduled_end_utc"
          - "closure_reason_code IN {CLIENT_UNAVAILABLE, FACILITY_DENIED_ACCESS}"
        side_effects:
          - "set closure_reason_code; billed_minutes = 0 and billable_cents = 0 so CaseMatter.interpretation_cost_cents is unchanged"
          - "increment InterpretationSession.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /interpretation-sessions/{session_id}/transition with action == 'CANCEL'"
        actor: CaseRepresentative
        preconditions:
          - "logical clock < InterpretationSession.scheduled_start_utc"
          - "closure_reason_code IN {INTERPRETER_UNAVAILABLE, HEARING_CONTINUED, LANGUAGE_MISMATCH, CLIENT_UNAVAILABLE}"
        side_effects:
          - "set closure_reason_code; billed_minutes = 0 and billable_cents = 0"
          - "every Declaration whose readback_session_id == this session returns readback_completed = false and readback_session_id = null"
          - "increment InterpretationSession.version and every affected Declaration.version by 1"

  - entity: CalendarEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED, CONTINUED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /calendar-events/{event_id}/transition with action == 'CONFIRM'"
        actor: CaseRepresentative
        preconditions:
          - "CalendarEvent.status == 'SCHEDULED'"
          - "assigned_representative_id is non-null and that Representative.authorization_status NOT IN {AUTHORIZATION_SUSPENDED, UNAUTHORIZED}"
          - "when event_type == 'FACILITY_VISIT' and DetentionFacility.access_credential_required == true, the assigned Representative.facility_access_credential_expires_on is non-null and >= the calendar date of starts_at_utc"
        side_effects:
          - "increment CalendarEvent.version by 1"
      - from: "SCHEDULED or CONFIRMED"
        to: COMPLETED
        trigger: "POST /calendar-events/{event_id}/transition with action == 'COMPLETE'"
        actor: CaseRepresentative
        preconditions:
          - "logical clock >= CalendarEvent.ends_at_utc"
        side_effects:
          - "increment CalendarEvent.version by 1"
      - from: "SCHEDULED or CONFIRMED"
        to: MISSED
        trigger: "POST /calendar-events/{event_id}/transition with action == 'MARK_MISSED'"
        actor: SupervisingAttorney
        preconditions:
          - "logical clock >= CalendarEvent.ends_at_utc"
        side_effects:
          - "when event_type IN {MASTER_CALENDAR_HEARING, INDIVIDUAL_HEARING} the matter's coverage_gap_flag is set true"
          - "increment CalendarEvent.version and CaseMatter.version by 1 each"
      - from: "SCHEDULED or CONFIRMED"
        to: CONTINUED
        trigger: "POST /calendar-events/{event_id}/transition with action == 'CONTINUE'"
        actor: SupervisingAttorney
        preconditions:
          - "event_type IN {MASTER_CALENDAR_HEARING, INDIVIDUAL_HEARING, ASYLUM_INTERVIEW}"
          - "successor_starts_at_utc and successor_ends_at_utc are supplied in the request payload and successor_starts_at_utc > CalendarEvent.ends_at_utc"
          - "the successor interval passes every semantics of calculations.calendar_conflict_scan"
        side_effects:
          - "create one successor CalendarEvent copying matter_id, facility_id, assigned_representative_id, event_type, location_code and client_conflict_waived, with continued_from_event_id = this event, status = 'SCHEDULED' and the supplied interval"
          - "recompute travel_buffer_minutes on the successor via calculations.calendar_conflict_scan"
          - "increment CalendarEvent.version by 1 on this row and mint the successor at version 1"
      - from: "SCHEDULED or CONFIRMED"
        to: CANCELLED
        trigger: "POST /calendar-events/{event_id}/transition with action == 'CANCEL', or the CaseMatter transition into filing_status DECIDED"
        actor: SupervisingAttorney
        preconditions:
          - "CalendarEvent.status IN {SCHEDULED, CONFIRMED}"
        side_effects:
          - "when event_type == 'FACILITY_VISIT', the facility's per-date aggregate slot count drops by 1 so a previously rejected same-date visit becomes schedulable"
          - "increment CalendarEvent.version by 1"

  - entity: InformedDecision
    initial_state: PENDING
    terminal_states: [SUPERSEDED, REVOKED]
    shape: branching
    transitions:
      - from: PENDING
        to: DOCUMENTED
        trigger: "POST /informed-decisions/{decision_id}/transition with action == 'ACKNOWLEDGE'"
        actor: ClientPortalUser
        preconditions:
          - "X-User-ID == CaseMatter.client_id for InformedDecision.matter_id"
          - "InformedDecision.language_match_verified == true"
          - "CaseMatter.representation_status IN {STAFFED, SUPERVISED_STAFFED}"
        side_effects:
          - "set acknowledged_at_utc = logical clock"
          - "increment InformedDecision.version by 1"
      - from: DOCUMENTED
        to: SUPERSEDED
        trigger: "system event: POST /informed-decisions creating a later decision with the same decision_type on the same matter"
        actor: system
        preconditions:
          - "the new InformedDecision has the same matter_id and decision_type"
        side_effects:
          - "set superseded_by_decision_id = the new decision"
          - "increment InformedDecision.version by 1"
      - from: "PENDING or DOCUMENTED"
        to: REVOKED
        trigger: "POST /informed-decisions/{decision_id}/transition with action == 'REVOKE'"
        actor: SupervisingAttorney
        preconditions:
          - "revocation_reason_code is supplied in the request payload"
          - "CaseMatter.filing_status != 'FILED' when decision_type IN {FILE_AFFIRMATIVE, PURSUE_RELIEF_IN_COURT}"
        side_effects:
          - "set revocation_reason_code"
          - "increment InformedDecision.version by 1"

  - entity: GrantReport
    initial_state: DRAFT
    terminal_states: []
    shape: cyclic
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "POST /grant-reports/{report_id}/transition with action == 'GENERATE'"
        actor: GrantAnalyst
        preconditions:
          - "GrantReport.status == 'DRAFT'"
          - "when disclosure_level == 'IDENTIFIED_WITH_CONSENT', every reported matter's Client.confidentiality_consent_scope == 'FUNDER_IDENTIFIED'"
        side_effects:
          - "set cases_served_count, outcomes_summary, consent_verified_count and suppressed_case_count via calculations.grant_confidentiality_partition"
          - "set base_reimbursable_cents, supervision_surcharge_cents, total_reimbursable_cents, allocated_line_total_cents and rounding_remainder_cents via calculations.grant_reimbursement_rollup"
          - "set generated_at_utc = logical clock"
          - "increment GrantReport.version by 1"
      - from: GENERATED
        to: SUBMITTED
        trigger: "POST /grant-reports/{report_id}/transition with action == 'SUBMIT'"
        actor: GrantAnalyst
        preconditions:
          - "GrantReport.allocated_line_total_cents == GrantReport.total_reimbursable_cents"
          - "suppressed_case_count == 0 when disclosure_level == 'IDENTIFIED_WITH_CONSENT'"
        side_effects:
          - "set submitted_at_utc = logical clock"
          - "increment GrantReport.version by 1"
      - from: SUBMITTED
        to: AMENDED
        trigger: "POST /grant-reports/{report_id}/transition with action == 'AMEND'"
        actor: GrantAnalyst
        preconditions:
          - "GrantReport.status == 'SUBMITTED'"
        side_effects:
          - "increment amendment_round by 1 and set submitted_at_utc = null"
          - "increment GrantReport.version by 1"
      - from: AMENDED
        to: GENERATED
        trigger: "POST /grant-reports/{report_id}/transition with action == 'GENERATE'"
        actor: GrantAnalyst
        preconditions:
          - "GrantReport.status == 'AMENDED'"
        side_effects:
          - "recompute every derived money and count field exactly as in the DRAFT -> GENERATED transition"
          - "set generated_at_utc = logical clock"
          - "increment GrantReport.version by 1"
        note: "Cycle: GENERATED -> SUBMITTED -> AMENDED -> GENERATED. INV-GRANT-ALLOCATION must hold after every GENERATE."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on a parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: lead-assignment-create-stale-matter
    parent_entity: CaseMatter
    write_endpoint: "POST /case-assignments"
    occ_field: "expected_matter_version"
    description: |
      Creating a CaseAssignment against a CaseMatter whose version has advanced
      since the client last observed it is rejected. A newly activated LEAD
      assignment legitimately supersedes the prior LEAD (releasing it with
      release_reason_code SUPERSEDED_BY_NEW_LEAD), so a writer holding a stale
      view of the matter would otherwise silently displace staffing it never saw.
    error_id: ERR_STALE_MATTER_VERSION
    http_status: 412

  - rule_id: informed-decision-create-stale-matter
    parent_entity: CaseMatter
    write_endpoint: "POST /informed-decisions"
    occ_field: "expected_matter_version"
    description: |
      Creating an InformedDecision against a CaseMatter whose version has
      advanced since the client last observed it is rejected. A new decision of
      the same decision_type legitimately supersedes the prior DOCUMENTED one, so
      a stale writer would otherwise supersede counseling it never read.
    error_id: ERR_STALE_MATTER_VERSION
    http_status: 412

  - rule_id: accreditation-renew-stale-recognition
    parent_entity: OrganizationRecognition
    write_endpoint: "POST /accreditations/{accreditation_id}/renew"
    occ_field: "expected_recognition_version"
    description: |
      Renewing an Accreditation whose OrganizationRecognition version has
      advanced since the client last observed it is rejected. Renewal legitimately
      re-derives the forum grant from the recognition's current authorized_forums,
      so a stale view could mint a term that exceeds what the organization is
      currently recognized for.
    error_id: ERR_STALE_RECOGNITION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: indigency_fpl_percent
    trigger: "POST /clients (initial value) and the IntakeScreening DRAFT -> SCREENED transition (refresh)"
    algorithm: threshold
    formula: |
      guideline_cents = FPL_BASE_CENTS + (Client.household_size - 1) * FPL_INCREMENT_CENTS
      Client.fpl_percent = round_half_up(Client.annual_household_income_cents / guideline_cents * 100, 2)
      indigency_eligible = (Client.fpl_percent <= FPL_ELIGIBILITY_CEILING_PERCENT)   # inclusive at exactly 200.00
    input_set: "The single Client row referenced by IntakeScreening.client_id. No other rows participate."
    constants:
      FPL_BASE_CENTS: 1508000
      FPL_INCREMENT_CENTS: 532000
      FPL_ELIGIBILITY_CEILING_PERCENT: 200.00
    precision: "fpl_percent: 2 decimal places, round_half_up. Comparison against the ceiling uses the rounded value."
    variants: []
    note: "Boundary: fpl_percent exactly 200.00 is eligible; 200.01 is not."

  - name: legal_eligibility_verdict
    trigger: "IntakeScreening DRAFT -> SCREENED transition"
    algorithm: constraint_propagation
    formula: |
      # Evaluated top to bottom; the FIRST matching clause wins and no later clause is considered.
      if IntakeScreening.case_type == 'NATURALIZATION' and IntakeScreening.prior_removal_order == true:
          verdict = 'INELIGIBLE_NO_RELIEF'
      elif IntakeScreening.detained == true and DetentionFacility.jurisdiction_code
           not in SERVED_JURISDICTIONS:
          verdict = 'INELIGIBLE_JURISDICTION'
      elif indigency_eligible == false and IntakeScreening.case_type not in FEE_EXEMPT_CASE_TYPES:
          verdict = 'INELIGIBLE_INCOME'
      elif IntakeScreening.case_type == 'ASYLUM_AFFIRMATIVE' and IntakeScreening.one_year_bar_applies == true
           and IntakeScreening.unaccompanied_minor == false:
          verdict = 'INELIGIBLE_NO_RELIEF'
      else:
          verdict = 'ELIGIBLE'
    input_set: "The IntakeScreening row, its Client (for indigency_eligible from calculations.indigency_fpl_percent) and, when detained, its DetentionFacility."
    constants:
      SERVED_JURISDICTIONS: ["TX-ELP", "AZ-ELO", "CA-ADL", "LA-JEN", "GA-ATL"]
      FEE_EXEMPT_CASE_TYPES: ["ASYLUM_DEFENSIVE", "ASYLUM_AFFIRMATIVE", "U_VISA", "VAWA_SELF_PETITION", "SIJS", "BOND_HEARING"]
    precision: "n/a — enum output"
    variants: []
    note: "Clause order is normative: a detained client outside the served jurisdictions is INELIGIBLE_JURISDICTION even when their income also fails."

  - name: intake_urgency_score
    trigger: "IntakeScreening DRAFT -> SCREENED transition; recomputed at the start of POST /intake-screenings/{intake_id}/decide and at waitlist promotion"
    algorithm: weighted_scoring
    formula: |
      # Step 1 — variant selection (see variants[] below) fixes anchor_date.
      # Step 2 — horizon points.
      if anchor_date is null:
          horizon_points = 0.00
      else:
          horizon_days = (anchor_date - logical_clock_date) in whole days   # may be negative
          if horizon_days <= 0:
              horizon_points = HORIZON_POINTS_CAP
          else:
              horizon_points = max(0.00, round_half_up(
                  HORIZON_POINTS_CAP * (1 - horizon_days / HORIZON_SPAN_DAYS), 2))
      # Step 3 — additive factors, then a single clamp at 100.00.
      raw = BASE_CASE_TYPE_POINTS[IntakeScreening.case_type]
          + (DETAINED_POINTS            if IntakeScreening.detained            else 0)
          + (UNACCOMPANIED_MINOR_POINTS if IntakeScreening.unaccompanied_minor else 0)
          + (PRIOR_REMOVAL_POINTS       if IntakeScreening.prior_removal_order else 0)
          + (ONE_YEAR_BAR_POINTS        if IntakeScreening.one_year_bar_applies else 0)
          + horizon_points
      IntakeScreening.urgency_score = round_half_up(min(100.00, raw), 2)
      # Step 4 — tier bands, inclusive lower bounds.
      urgency_tier = 'EMERGENCY' if urgency_score >= TIER_EMERGENCY_MIN
                else 'URGENT'    if urgency_score >= TIER_URGENT_MIN
                else 'ELEVATED'  if urgency_score >= TIER_ELEVATED_MIN
                else 'ROUTINE'
    input_set: |
      Always the IntakeScreening row itself. The CALENDAR_INCLUSIVE variant additionally reads
      CalendarEvent rows with status IN {SCHEDULED, CONFIRMED} and event_type IN
      {MASTER_CALENDAR_HEARING, INDIVIDUAL_HEARING, ASYLUM_INTERVIEW, BIOMETRICS} whose
      matter_id belongs to a CaseMatter with client_id == IntakeScreening.client_id and
      filing_status NOT IN {DECIDED, CLOSED_NO_FILING}. FILING_DEADLINE events are excluded.
    constants:
      BASE_CASE_TYPE_POINTS:
        BOND_HEARING: 42
        ASYLUM_DEFENSIVE: 40
        REMOVAL_DEFENSE_OTHER: 38
        SIJS: 30
        ASYLUM_AFFIRMATIVE: 26
        VAWA_SELF_PETITION: 24
        U_VISA: 22
        DACA_RENEWAL: 14
        ADJUSTMENT_OF_STATUS: 12
        NATURALIZATION: 8
      DETAINED_POINTS: 25
      UNACCOMPANIED_MINOR_POINTS: 15
      PRIOR_REMOVAL_POINTS: 10
      ONE_YEAR_BAR_POINTS: 8
      HORIZON_POINTS_CAP: 30
      HORIZON_SPAN_DAYS: 84
      TIER_ELEVATED_MIN: 45.00
      TIER_URGENT_MIN: 65.00
      TIER_EMERGENCY_MIN: 85.00
    precision: "urgency_score: 2 decimal places, round_half_up. horizon_points is rounded to 2 decimals BEFORE being added, then the sum is rounded once more."
    variants:
      - name: STRICT_STATUTORY
        when: "IntakeScreening.detained == false"
        difference: "anchor_date = IntakeScreening.statutory_deadline_date (null when absent). Calendar events are ignored entirely, so a client with an imminent hearing on a sibling matter still scores from the statutory deadline only."
      - name: CALENDAR_INCLUSIVE
        when: "IntakeScreening.detained == true"
        difference: "anchor_date = the earliest of IntakeScreening.statutory_deadline_date and the calendar date of the earliest qualifying CalendarEvent.starts_at_utc in the input_set (ties resolved to the same date; null only when both sources are empty). This routinely yields an earlier anchor, larger horizon_points and a higher tier for byte-identical intake fields."
    note: "Dual-variant instance #1 — subject domain is IntakeScreening urgency. urgency_variant_applied records which branch ran and urgency_anchor_date records the resolved anchor."

  - name: cycle_capacity_posture
    trigger: "IntakeScreening acceptance, waitlisting, withdrawal and promotion; CaseMatter withdraw-representation; POST /capacity-cycles/{cycle_id}/checkpoint"
    algorithm: aggregation
    formula: |
      general_slots_consumed  = count(CaseMatter M : M.cycle_id == cycle.id
                                      and M.slot_pool_consumed == 'GENERAL'
                                      and M.representation_status != 'WITHDRAWN_FROM')
      detained_slots_consumed = count(CaseMatter M : M.cycle_id == cycle.id
                                      and M.slot_pool_consumed == 'DETAINED_RESERVED'
                                      and M.representation_status != 'WITHDRAWN_FROM')
      available_slot_count = cycle.total_case_slots - general_slots_consumed - detained_slots_consumed
      waitlisted_count = count(IntakeScreening I : I.cycle_id == cycle.id and I.status == 'WAITLISTED')
      utilization_ratio = round_half_up(
          (general_slots_consumed + detained_slots_consumed) / cycle.total_case_slots, 4)
      computed_posture = 'FROZEN'     if utilization_ratio >= POSTURE_FROZEN_MIN
                    else 'RESTRICTED' if utilization_ratio >= POSTURE_RESTRICTED_MIN
                    else 'OPEN'
      # Override is a reporting AND enforcement downgrade, never an upgrade.
      if computed_posture == 'FROZEN'
         and cycle.posture_override_until_utc is not null
         and logical_clock < cycle.posture_override_until_utc:
          capacity_posture = 'RESTRICTED'
      else:
          capacity_posture = computed_posture
    input_set: "All CaseMatter rows of the cycle regardless of filing_status; representation_status == 'WITHDRAWN_FROM' is the only exclusion. All IntakeScreening rows of the cycle for waitlisted_count."
    constants:
      POSTURE_RESTRICTED_MIN: 0.8000
      POSTURE_FROZEN_MIN: 0.9500
    precision: "utilization_ratio: 4 decimal places, round_half_up. Threshold comparisons use the ROUNDED value, so 0.79995 rounds to 0.8000 and does trip RESTRICTED."
    variants: []
    note: "Boundary instance: utilization_ratio exactly 0.8000 is RESTRICTED (>=), exactly 0.9500 is FROZEN (>=)."

  - name: capacity_slot_waterfall
    trigger: "IntakeScreening SCREENED -> ACCEPTED and WAITLISTED -> ACCEPTED transitions"
    algorithm: waterfall_allocation
    formula: |
      detained_pool_free = max(0, cycle.reserved_detained_slots - cycle.detained_slots_consumed)
      general_pool_free   = max(0, cycle.total_case_slots
                                  - cycle.reserved_detained_slots
                                  - cycle.general_slots_consumed)
      pool_order = ['DETAINED_RESERVED', 'GENERAL'] if IntakeScreening.detained else ['GENERAL']
      for pool in pool_order:
          if free_count(pool) > 0:
              CaseMatter.slot_pool_consumed = pool
              stop
      else:
          reject with ERR_NO_SLOT_AVAILABLE
    input_set: "The ProgramCapacityCycle counters produced by calculations.cycle_capacity_posture immediately before the acceptance."
    constants:
      WAITLIST_TTL_DAYS: 30
    precision: "integer counts only"
    variants: []
    note: |
      general_pool_free deliberately subtracts reserved_detained_slots, so a non-detained
      acceptance can be rejected with ERR_NO_SLOT_AVAILABLE while
      cycle.available_slot_count is still strictly positive (the free slots all sit
      inside the reserved detained block). Detained intakes drain the reserved block
      first and only spill into the general pool when the reserved block is empty.

  - name: matter_forum_and_deadlines
    trigger: "IntakeScreening SCREENED -> ACCEPTED / WAITLISTED -> ACCEPTED (initial), CaseMatter advance-filing into RFE_PENDING and APPEALED (refresh)"
    algorithm: constraint_propagation
    formula: |
      forum = FORUM_BY_CASE_TYPE[CaseMatter.case_type]
      if CaseMatter.detained == true and CaseMatter.facility_id is not null:
          expedited_deadline_date = date(IntakeScreening.decided_at_utc) + DetentionFacility.expedited_filing_days days
      else:
          expedited_deadline_date = null
      candidates = [d for d in (statutory_deadline_date, expedited_deadline_date) if d is not null]
      effective_filing_deadline_date = min(candidates) if candidates else null
    input_set: "The CaseMatter row, its accepted IntakeScreening (for decided_at_utc and statutory_deadline_date) and, when detained, its DetentionFacility."
    constants:
      FORUM_BY_CASE_TYPE:
        ASYLUM_DEFENSIVE: EOIR_IMMIGRATION_COURT
        REMOVAL_DEFENSE_OTHER: EOIR_IMMIGRATION_COURT
        BOND_HEARING: EOIR_IMMIGRATION_COURT
        ASYLUM_AFFIRMATIVE: ASYLUM_OFFICE
        U_VISA: USCIS
        VAWA_SELF_PETITION: USCIS
        SIJS: USCIS
        DACA_RENEWAL: USCIS
        NATURALIZATION: USCIS
        ADJUSTMENT_OF_STATUS: USCIS
    precision: "whole calendar dates, UTC"
    variants: []

  - name: representative_authorization_status
    trigger: "POST /representatives, PATCH /representatives/{representative_id}, every Accreditation transition, every OrganizationRecognition transition, POST /capacity-cycles/{cycle_id}/checkpoint"
    algorithm: constraint_propagation
    formula: |
      # Evaluated top to bottom; first match wins.
      if Representative.status == 'SUSPENDED':
          status = 'AUTHORIZATION_SUSPENDED'
      elif Representative.rep_type == 'STAFF_ATTORNEY':
          status = 'AUTHORIZED_ATTORNEY' if (Representative.status == 'ACTIVE'
                                             and Representative.bar_number is not null)
                   else 'UNAUTHORIZED'
      elif Representative.rep_type == 'ACCREDITED_REP':
          qualifying = [A for A in Accreditation
                        if A.representative_id == Representative.id
                        and A.status IN {'APPROVED', 'EXPIRING', 'RENEWAL_PENDING'}
                        and OrganizationRecognition(A.recognition_id).status IN {'ACTIVE', 'CONDITIONAL'}
                        and logical_clock_date <= A.expiry_date]
          if Representative.status == 'ACTIVE' and len(qualifying) >= 1:
              status = 'AUTHORIZED_ACCREDITED'
          elif exists A with A.representative_id == Representative.id
               and A.status == 'SUSPENDED_BY_RECOGNITION':
              status = 'AUTHORIZATION_SUSPENDED'
          else:
              status = 'UNAUTHORIZED'
      else:   # PRO_BONO_VOLUNTEER, LAW_GRADUATE
          status = 'AUTHORIZED_SUPERVISED' if Representative.status == 'ACTIVE' else 'UNAUTHORIZED'
    input_set: "The Representative row, all Accreditation rows pointing at it and the OrganizationRecognition of each."
    constants: {}
    precision: "n/a — enum output"
    variants: []
    note: "The qualifying-accreditation set is an explicit enum filter, not 'a valid accreditation'."

  - name: accreditation_forum_grant
    trigger: "Accreditation PENDING -> APPROVED and RENEWAL_PENDING -> APPROVED transitions"
    algorithm: constraint_propagation
    formula: |
      type_ceiling = PARTIAL_FORUM_CEILING if Accreditation.accreditation_type == 'PARTIAL'
                     else FULL_FORUM_CEILING
      authorized_forums = sorted(set(Accreditation.requested_forums)
                                 & set(OrganizationRecognition.authorized_forums)
                                 & set(type_ceiling))
      if authorized_forums is empty: reject with ERR_FORUM_NOT_AUTHORIZED
      expiry_date = effective_date + ACCREDITATION_TERM_DAYS days
    input_set: "The Accreditation row and its OrganizationRecognition."
    constants:
      PARTIAL_FORUM_CEILING: ["USCIS", "ASYLUM_OFFICE"]
      FULL_FORUM_CEILING: ["USCIS", "ASYLUM_OFFICE", "EOIR_IMMIGRATION_COURT", "BIA"]
      ACCREDITATION_TERM_DAYS: 1095
      ACCREDITATION_EXPIRING_WINDOW_DAYS: 90
    precision: "array output sorted ascending by forum name; whole calendar dates"
    variants: []
    note: "Empty-set boundary: a PARTIAL request for only EOIR_IMMIGRATION_COURT intersects to the empty set and is rejected."

  - name: supervisor_auto_selection
    trigger: "POST /case-assignments when the payload omits supervision_link_id and the named Representative has supervision_required == true and role_on_case IN {LEAD, CO_COUNSEL}"
    algorithm: weighted_scoring
    formula: |
      # (a) eligibility filter — explicit predicate over entity fields
      candidates = [ S in CaseAssignment :
            S.matter_id == payload.matter_id
        and S.status == 'ACTIVE'
        and S.role_on_case == 'SUPERVISOR'
        and Representative(S.representative_id).rep_type == 'STAFF_ATTORNEY'
        and Representative(S.representative_id).status == 'ACTIVE'
        and Representative(S.representative_id).authorization_status == 'AUTHORIZED_ATTORNEY'
        and Representative(S.representative_id).supervisee_count
              < Representative(S.representative_id).max_supervisees
        and Client(CaseMatter(S.matter_id).client_id).preferred_language_code
              in Representative(S.representative_id).languages ]
      # (b) ranking expression, ascending
      # (c) tie-break chain, applied in order
      order_by:
        1. Representative(S.representative_id).supervisee_count                                   ASC
        2. (Representative(S.representative_id).max_supervisees
            - Representative(S.representative_id).supervisee_count)                               DESC
        3. Representative(S.representative_id).active_case_load                                   ASC
        4. S.created_at                                                                           ASC
      # (d) empty-pool fallback
      if candidates is empty: reject with ERR_NO_ELIGIBLE_SUPERVISOR
      else: CaseAssignment.supervision_link_id = candidates[0].id
            CaseAssignment.supervision_source  = 'AUTO_SELECTED'
    input_set: "All CaseAssignment rows of the target matter with status == 'ACTIVE' and role_on_case == 'SUPERVISOR', joined to their Representative and to the matter's Client."
    constants: {}
    precision: "integer comparisons; created_at compared at millisecond resolution"
    variants:
      - name: EXPLICIT_LINK
        when: "the POST /case-assignments payload supplies supervision_link_id"
        difference: "No selection runs. The supplied assignment must itself satisfy every clause of the eligibility filter, otherwise ERR_SUPERVISION_LINK_INELIGIBLE. supervision_source = 'EXPLICIT_LINK'."
    note: "Selector determinism: eligibility filter, ranking expression, tie-break chain ending at created_at ASC, and empty-pool error are all pinned. Random id values are never consulted."

  - name: matter_readiness_index
    trigger: "Every EvidenceItem transition, Declaration IN_REVIEW -> CERTIFIED, and every POST /case-matters/{matter_id}/advance-filing"
    algorithm: weighted_scoring
    formula: |
      counted = [E in EvidenceItem : E.matter_id == matter.id and E.status != 'WAIVED']
      denominator_points = sum(E.weight_points for E in counted)
      numerator_points   = sum(E.weight_points for E in counted if E.status == 'VERIFIED')
      readiness_index_weighted = 0.0000 if denominator_points == 0
                                 else round_half_up(numerator_points / denominator_points, 4)
      required_total = count(E in EvidenceItem : E.matter_id == matter.id and E.tier == 'REQUIRED')
      required_open  = count(E in EvidenceItem : E.matter_id == matter.id and E.tier == 'REQUIRED'
                                                and E.status NOT IN {'VERIFIED', 'WAIVED'})
      readiness_ready_strict = (required_total >= 1) and (required_open == 0)
      evidence_blocking_count = required_open
                              + count(E in EvidenceItem : E.matter_id == matter.id and E.status == 'REJECTED')
    input_set: "All EvidenceItem rows of the matter. WAIVED rows leave BOTH the numerator and the denominator of readiness_index_weighted, but a WAIVED REQUIRED row still counts toward required_total, so waiving the last REQUIRED item keeps readiness_ready_strict reachable."
    constants:
      READY_TO_FILE_WEIGHTED_MIN: 0.7500
    precision: "readiness_index_weighted: 4 decimal places, round_half_up; the gate comparison uses the rounded value"
    variants:
      - name: EVIDENCE_WEIGHTED_GATE
        when: "CaseMatter.detained == true, evaluated on the EVIDENCE_GATHERING -> READY_TO_FILE transition"
        difference: "Passes when readiness_index_weighted >= READY_TO_FILE_WEIGHTED_MIN, even while required_open > 0. Unverified REQUIRED items do not block. Failure raises ERR_MATTER_NOT_READY."
      - name: CHECKLIST_STRICT_GATE
        when: "CaseMatter.detained == false, evaluated on the EVIDENCE_GATHERING -> READY_TO_FILE transition"
        difference: "Passes only when readiness_ready_strict == true, regardless of how high readiness_index_weighted is. Failure raises ERR_BLOCKING_EVIDENCE_OUTSTANDING."
    note: |
      Dual-variant instance #2 — subject domain is CaseMatter filing readiness, a different
      entity domain from calculations.intake_urgency_score. The two gates disagree on the SAME
      evidence set: an 8-point REQUIRED item still REQUESTED alongside 24 points of VERIFIED
      SUPPORTING evidence yields readiness_index_weighted == 0.7500 (passes the weighted gate)
      while readiness_ready_strict == false (fails the strict gate), and the two failures raise
      DIFFERENT error ids.

  - name: interpretation_cost_rollup
    trigger: "InterpretationSession SCHEDULED -> COMPLETED transition"
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER — round per session first, then sum. Summing unrounded
      # session amounts and rounding once at the end is INCORRECT and produces a
      # different value in cents.
      # Step 1 — per session
      billed_minutes = max(MINIMUM_BILLED_MINUTES,
                           ceil(actual_minutes / BILLING_INCREMENT_MINUTES) * BILLING_INCREMENT_MINUTES)
      rate = RATE_CENTS_PER_HOUR[InterpretationSession.interpreter_source]
      surcharge_pct = 0.00 if InterpretationSession.language_code in COMMON_LANGUAGES
                      else RARE_LANGUAGE_SURCHARGE_PCT
      billable_cents = round_half_up(rate * (billed_minutes / 60) * (1 + surcharge_pct))   # to whole cents
      # Step 2 — roll up
      CaseMatter.interpretation_cost_cents =
          sum(S.billable_cents for S in InterpretationSession
              if S.matter_id == matter.id and S.status == 'COMPLETED')
    input_set: "All InterpretationSession rows of the matter with status == 'COMPLETED'. SCHEDULED, NO_SHOW and CANCELLED sessions contribute exactly 0."
    constants:
      MINIMUM_BILLED_MINUTES: 30
      BILLING_INCREMENT_MINUTES: 15
      RATE_CENTS_PER_HOUR:
        STAFF: 0
        VOLUNTEER: 0
        CONTRACT: 9500
        TELEPHONIC: 6200
      COMMON_LANGUAGES: ["es", "fr", "pt", "zh", "ar"]
      RARE_LANGUAGE_SURCHARGE_PCT: 0.15
    precision: "billable_cents: whole cents, round_half_up, computed ONCE PER SESSION. CaseMatter.interpretation_cost_cents is an exact integer sum of already-rounded session values."
    variants: []
    note: |
      Combinatorial mode (b) — nested rounding where order matters. Worked check: two CONTRACT
      sessions, language 'ht' (not in COMMON_LANGUAGES), actual_minutes 22 each. billed_minutes
      = max(30, ceil(22/15)*15) = max(30, 30) = 30. Per session: 9500 * 0.5 * 1.15 = 5462.5 ->
      round_half_up -> 5463. Rolled up: 5463 + 5463 = 10926. The forbidden order (sum 5462.5 +
      5462.5 = 10925.0, then round) yields 10925 — one cent lower.

  - name: calendar_conflict_scan
    trigger: "POST /calendar-events, POST /calendar-events/{event_id}/reschedule, and the successor creation of a CalendarEvent CONTINUE transition"
    algorithm: interval_merge
    formula: |
      travel_buffer_minutes = BUFFER_BY_EVENT_TYPE[candidate.event_type]
      # --- Semantics A: Representative occupation, HALF-OPEN with an asymmetric travel buffer
      if candidate.assigned_representative_id is not null:
          for X in CalendarEvent where X.assigned_representative_id == candidate.assigned_representative_id
                                   and X.status IN {'SCHEDULED', 'CONFIRMED'}
                                   and X.id != candidate.id:
              buffer = BUFFER_BY_EVENT_TYPE[X.event_type] if X.location_code != candidate.location_code else 0
              x_end_effective = X.ends_at_utc + buffer minutes
              if candidate.starts_at_utc < x_end_effective and X.starts_at_utc < candidate.ends_at_utc:
                  reject with ERR_REPRESENTATIVE_CALENDAR_CONFLICT
      # --- Semantics B: client occupation across ALL of the client's matters, FULLY CLOSED, no buffer
      if candidate.client_conflict_waived == false:
          client_id = CaseMatter(candidate.matter_id).client_id
          for X in CalendarEvent where CaseMatter(X.matter_id).client_id == client_id
                                   and X.status IN {'SCHEDULED', 'CONFIRMED'}
                                   and X.event_type != 'FILING_DEADLINE'
                                   and candidate.event_type != 'FILING_DEADLINE'
                                   and X.id != candidate.id:
              if candidate.starts_at_utc <= X.ends_at_utc and X.starts_at_utc <= candidate.ends_at_utc:
                  reject with ERR_CLIENT_CALENDAR_CONFLICT
      # --- Semantics C: facility per-calendar-date AGGREGATE capacity, not pairwise
      if candidate.event_type == 'FACILITY_VISIT':
          F = DetentionFacility(candidate.facility_id)
          same_day = count(X in CalendarEvent : X.facility_id == F.id
                                            and X.event_type == 'FACILITY_VISIT'
                                            and X.status IN {'SCHEDULED', 'CONFIRMED'}
                                            and date(X.starts_at_utc) == date(candidate.starts_at_utc)
                                            and X.id != candidate.id)
          if same_day >= F.max_daily_visit_slots:
              reject with ERR_FACILITY_VISIT_SLOTS_EXHAUSTED
    input_set: "CalendarEvent rows with status IN {SCHEDULED, CONFIRMED} only. CONTINUED, COMPLETED, MISSED and CANCELLED rows never occupy a resource."
    constants:
      MAX_RESCHEDULES_PER_EVENT: 3
      COVERAGE_GAP_LOOKAHEAD_DAYS: 14
      BUFFER_BY_EVENT_TYPE:
        FACILITY_VISIT: 90
        INDIVIDUAL_HEARING: 60
        MASTER_CALENDAR_HEARING: 45
        ASYLUM_INTERVIEW: 45
        BIOMETRICS: 30
        FILING_DEADLINE: 0
      DAY_BOUNDARY: "UTC calendar date of starts_at_utc"
    precision: "instants compared at millisecond resolution; buffers applied in whole minutes"
    variants: []
    note: |
      Three different interval geometries on three different resource entities:
      A (Representative) is half-open, so an event starting exactly at another's buffered end
      does NOT conflict; B (Client, across matters) is fully closed, so an event starting exactly
      at another's end DOES conflict; C (DetentionFacility) is not an interval comparison at all
      but a per-UTC-date aggregate count, and with max_daily_visit_slots == 0 every visit is
      rejected regardless of timing. Semantics A is evaluated before B, and B before C.

  - name: case_hours_rollup
    trigger: "POST /case-assignments/{assignment_id}/log-hours"
    algorithm: aggregation
    formula: |
      if payload.hours_kind == 'DIRECT':
          CaseAssignment.direct_hours_logged =
              round_half_up(CaseAssignment.direct_hours_logged + payload.hours, 2)
      else:   # 'SUPERVISION'
          CaseAssignment.supervision_hours_logged =
              round_half_up(CaseAssignment.supervision_hours_logged + payload.hours, 2)
      CaseMatter.direct_hours_logged =
          round_half_up(sum(A.direct_hours_logged for A in CaseAssignment if A.matter_id == matter.id), 2)
      CaseMatter.supervision_hours_logged =
          round_half_up(sum(A.supervision_hours_logged for A in CaseAssignment if A.matter_id == matter.id), 2)
    input_set: "All CaseAssignment rows of the matter regardless of status, including RELEASED ones, because logged service time is never un-reported to the funder."
    constants:
      MAX_HOURS_PER_LOG_ENTRY: 12.00
    precision: "2 decimal places, round_half_up, applied on each accumulation and again on each rollup"
    variants: []
    note: "SUPERVISION hours may only be logged against an assignment with role_on_case == 'SUPERVISOR'; DIRECT hours only against LEAD, CO_COUNSEL or INTERPRETER_COORDINATOR."

  - name: grant_confidentiality_partition
    trigger: "GrantReport DRAFT -> GENERATED and AMENDED -> GENERATED transitions"
    algorithm: aggregation
    formula: |
      reported = [M in CaseMatter :
            M.cycle_id == report.cycle_id
        and date(IntakeScreening(M.intake_id).decided_at_utc) >= report.period_start_date
        and date(IntakeScreening(M.intake_id).decided_at_utc) <= report.period_end_date
        and M.representation_status != 'WITHDRAWN_FROM' ]
      ordered by M.created_at ASC
      cases_served_count = len(reported)
      outcomes_summary = { outcome_value : count(M in reported if M.outcome == outcome_value)
                           for outcome_value in {GRANTED, DENIED, ADMINISTRATIVELY_CLOSED,
                                                 WITHDRAWN, TERMINATED, REFERRED_TO_COURT} }
                         plus key 'NOT_YET_DECIDED' : count(M in reported if M.outcome is null)
      required_scope = CONSENT_REQUIREMENT[report.disclosure_level]
      consent_verified_count = count(M in reported
          if Client(M.client_id).confidentiality_consent_scope in required_scope)
      suppressed_case_count = cases_served_count - consent_verified_count
    input_set: |
      CaseMatter rows of the report's cycle whose accepted IntakeScreening.decided_at_utc falls
      on a calendar date inside [period_start_date, period_end_date] INCLUSIVE on both ends.
      Matters with representation_status == 'WITHDRAWN_FROM' are excluded entirely, so a
      withdrawn matter never appears in either cases_served_count or outcomes_summary.
    constants:
      CONSENT_REQUIREMENT:
        AGGREGATE_ONLY: ["PROGRAM_ONLY", "FUNDER_AGGREGATE", "FUNDER_IDENTIFIED"]
        DEIDENTIFIED_CASE_LEVEL: ["FUNDER_AGGREGATE", "FUNDER_IDENTIFIED"]
        IDENTIFIED_WITH_CONSENT: ["FUNDER_IDENTIFIED"]
    precision: "integer counts; outcomes_summary values sum to cases_served_count"
    variants: []
    note: "Clients whose consent_scope is NONE are always suppressed, even under AGGREGATE_ONLY."

  - name: grant_reimbursement_rollup
    trigger: "GrantReport DRAFT -> GENERATED and AMENDED -> GENERATED transitions"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS NORMATIVE. The surcharge tier looks CIRCULAR (a surcharge that
      # depends on a total that includes the surcharge); it is pinned to break the cycle:
      # the tier is selected from base_reimbursable_cents ONLY, never from
      # total_reimbursable_cents.
      # Step 1 — line set: `reported`, ordered by M.created_at ASC (see grant_confidentiality_partition)
      # Step 2 — per-matter base, rounded PER MATTER, then summed
      matter_direct_cents[M]  = round_half_up(DIRECT_RATE_CENTS_PER_HOUR * M.direct_hours_logged)
      base_reimbursable_cents = sum(matter_direct_cents[M] for M in reported)
      # Step 3 — tier selected from base_reimbursable_cents ONLY
      tier_rate = 0.00 if base_reimbursable_cents <  SURCHARGE_TIER_1_MIN
             else 0.06 if base_reimbursable_cents <  SURCHARGE_TIER_2_MIN
             else 0.09
      supervision_surcharge_cents = round_half_up(base_reimbursable_cents * tier_rate)
      # Step 4 — total
      total_reimbursable_cents = base_reimbursable_cents + supervision_surcharge_cents
      # Step 5 — largest-remainder allocation of the TOTAL across the line set
      sum_hours = sum(M.direct_hours_logged for M in reported)
      if sum_hours == 0:
          allocated_line_total_cents = 0
          rounding_remainder_cents   = 0
      else:
          ideal[M]  = total_reimbursable_cents * (M.direct_hours_logged / sum_hours)   # exact rational
          floor_[M] = floor(ideal[M])
          rem[M]    = ideal[M] - floor_[M]
          leftover  = total_reimbursable_cents - sum(floor_[M] for M in reported)
          give 1 extra cent to the `leftover` matters with the largest rem[M],
              tie-break on equal rem[M] by M.created_at ASC
          allocated_line_total_cents = sum(floor_[M] for M in reported) + leftover
          rounding_remainder_cents   = leftover
    input_set: "Exactly the `reported` line set of calculations.grant_confidentiality_partition, in M.created_at ASC order. Suppressed matters still contribute their hours and money; suppression affects only identifying disclosure, never the arithmetic."
    constants:
      DIRECT_RATE_CENTS_PER_HOUR: 12500
      SURCHARGE_TIER_1_MIN: 500000
      SURCHARGE_TIER_2_MIN: 2000000
    precision: "All money in whole cents. matter_direct_cents is rounded PER MATTER before summation. supervision_surcharge_cents is rounded ONCE from the already-summed base. The largest-remainder pass uses exact rational ideals, never pre-rounded ones."
    variants: []
    note: |
      Combinatorial mode (c) — circular-looking dependency with a pinned evaluation order.
      Boundary: base_reimbursable_cents exactly 500000 selects tier_rate 0.06 (>=), exactly
      2000000 selects 0.09 (>=). Empty line set (cases_served_count == 0) yields every money
      field 0 and MUST NOT raise.

  - name: invariant_capacity_slot_conservation
    trigger: "asserted after every transition that touches ProgramCapacityCycle counters"
    algorithm: aggregation
    formula: |
      # Global identity that must hold at the end of EVERY request:
      cycle.general_slots_consumed + cycle.detained_slots_consumed + cycle.available_slot_count
          == cycle.total_case_slots
      # Compensation identity: ACCEPT followed by its compensating WITHDRAW of the same
      # IntakeScreening must restore the 5-tuple exactly, with no waitlist promotion drift:
      (general_slots_consumed, detained_slots_consumed, available_slot_count,
       utilization_ratio, capacity_posture)_after_withdraw
          == (…)_before_accept
      #   …provided no waitlist promotion fired. When a promotion DOES fire, the identity
      #   becomes: consumed totals unchanged from immediately after the ACCEPT, because the
      #   released slot is immediately re-consumed by the promoted intake.
    input_set: "The ProgramCapacityCycle row and all CaseMatter rows of that cycle."
    constants: {}
    precision: "exact integers; utilization_ratio compared at 4 decimal places"
    variants: []
    note: "Conserved quantity #1: the partition of total_case_slots into general-consumed, detained-consumed and available."

  - name: invariant_active_caseload_conservation
    trigger: "asserted after every CaseAssignment transition and every cascade that mutates assignments"
    algorithm: aggregation
    formula: |
      # Global identity that must hold at the end of EVERY request:
      sum(R.active_case_load for R in Representative)
          == count(A in CaseAssignment : A.status == 'ACTIVE'
                                     and A.role_on_case IN {'LEAD', 'CO_COUNSEL'})
      sum(R.supervisee_count for R in Representative)
          == count(A in CaseAssignment : A.status == 'ACTIVE' and A.supervision_link_id is not null)
      # Compensation identity: ACTIVATE followed by its compensating RELEASE on the same
      # assignment restores Representative.active_case_load and supervisee_count to their
      # pre-ACTIVATE values for every Representative involved.
    input_set: "All Representative rows and all CaseAssignment rows."
    constants: {}
    precision: "exact integers"
    variants: []
    note: "Conserved quantity #2: the count of active lead/co-counsel engagements, denormalized onto Representative."

  - name: invariant_grant_allocation_conservation
    trigger: "asserted after every GrantReport GENERATE transition"
    algorithm: aggregation
    formula: |
      report.allocated_line_total_cents == report.total_reimbursable_cents
      report.total_reimbursable_cents  == report.base_reimbursable_cents + report.supervision_surcharge_cents
      report.suppressed_case_count     == report.cases_served_count - report.consent_verified_count
      sum(outcomes_summary.values())   == report.cases_served_count
      # AMEND followed by re-GENERATE over an unchanged line set reproduces byte-identical
      # money fields — the largest-remainder pass is deterministic, so no cent drifts.
    input_set: "The GrantReport row after a GENERATE run."
    constants: {}
    precision: "exact integers"
    variants: []
    note: "Conserved quantity #3: total reimbursable cents against its per-matter allocation."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table
# Evaluated STRICTLY in ascending `priority` order. The first rule that fails
# determines the response; no later rule is evaluated. Rules that share a
# priority number cannot both fail on the same request.
# Category bands: 1-4 auth | 5-13 existence | 14-21 state |
#                 22-31 business_safety | 32-40 business_fiscal
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "Request carries a resolvable actor role from §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "No role header, or a role name outside the §1.7 matrix. Evaluated before any path id is looked up."

  - priority: 2
    category: auth
    check: "The actor role appears in the endpoint's `roles:` list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
    description: |
      CONFLICT PAIR 1 (auth vs existence), high side. A ClientPortalUser calling
      POST /case-assignments with matter_id set to a non-existent uuid violates BOTH
      this rule and priority 6 (ERR_MATTER_NOT_FOUND). Priority 2 wins: the response is
      ERR_ROLE_NOT_PERMITTED / 403, and the server must not disclose whether the matter exists.

  - priority: 3
    category: auth
    check: "An entity_backed actor is scoped to its own rows: a CaseRepresentative may only act on a CaseMatter where it holds a CaseAssignment with status IN {PROPOSED, ACTIVE, SUSPENDED}; a ClientPortalUser may only read rows whose client_id equals its own Client id"
    error_id: ERR_ACTOR_NOT_ON_CASE
    http_status: 403
    applies_to: "all case-matter-scoped and client-scoped endpoints"
    description: "Row-level scoping for entity_backed roles. Runs after role membership so a permitted-but-unscoped actor still gets 403 with a distinct id."

  - priority: 4
    category: auth
    check: "The actor's backing Representative row has status == 'ACTIVE'"
    error_id: ERR_REPRESENTATIVE_INACTIVE
    http_status: 403
    applies_to: "all endpoints whose roles include IntakeScreener, SupervisingAttorney or CaseRepresentative"
    description: "A SUSPENDED or SEPARATED Representative retains its role name but loses all write authority, including on cases it still nominally holds."

  - priority: 5
    category: existence
    check: "Every uuid path segment resolves to an existing row of the expected entity"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Generic path-id resolution. Entity-specific 404 ids at priorities 6-11 take precedence where they are defined."

  - priority: 6
    category: existence
    check: "matter_id in the path or body resolves to an existing CaseMatter"
    error_id: ERR_MATTER_NOT_FOUND
    http_status: 404
    applies_to: "POST /case-assignments, POST /evidence-items, POST /declarations, POST /interpretation-sessions, POST /calendar-events, POST /informed-decisions, all /case-matters/{matter_id}/* endpoints"
    description: "CONFLICT PAIR 1 (auth vs existence), low side. Loses to priority 2."

  - priority: 7
    category: existence
    check: "client_id resolves to an existing Client"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /intake-screenings, GET /clients/{client_id}, PATCH /clients/{client_id}"
    description: "Checked before any eligibility or indigency arithmetic runs."

  - priority: 8
    category: existence
    check: "representative_id resolves to an existing Representative"
    error_id: ERR_REPRESENTATIVE_NOT_FOUND
    http_status: 404
    applies_to: "POST /case-assignments, POST /accreditations, POST /calendar-events, POST /declarations"
    description: "Applies to every field that names a Representative, including assigned_representative_id, interpreter_representative_id and approved_by_representative_id."

  - priority: 9
    category: existence
    check: "cycle_id resolves to an existing ProgramCapacityCycle"
    error_id: ERR_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "POST /intake-screenings, POST /grant-reports, GET /capacity-cycles/{cycle_id}"
    description: "Intake screening cannot be created without a capacity cycle to consume slots from."

  - priority: 10
    category: existence
    check: "facility_id, when supplied and non-null, resolves to an existing DetentionFacility"
    error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /intake-screenings, POST /case-matters/{matter_id}/set-facility, POST /calendar-events"
    description: "A null facility_id is legal for a non-detained client and skips this rule entirely."

  - priority: 11
    category: existence
    check: "supervision_link_id, when supplied, resolves to an existing CaseAssignment row"
    error_id: ERR_SUPERVISION_LINK_NOT_FOUND
    http_status: 404
    applies_to: "POST /case-assignments, POST /case-assignments/{assignment_id}/relink-supervision"
    description: |
      CONFLICT PAIR 2 (existence vs state), high side. Supplying a supervision_link_id that
      does not exist while the target matter's representation_status is already 'CLOSED_OUT'
      violates BOTH this rule and priority 15 (ERR_MATTER_CLOSED). Priority 11 wins:
      ERR_SUPERVISION_LINK_NOT_FOUND / 404.

  - priority: 12
    category: existence
    check: "The organization has exactly one OrganizationRecognition row and it is resolvable when a non-attorney representative or accreditation is involved"
    error_id: ERR_RECOGNITION_NOT_FOUND
    http_status: 404
    applies_to: "POST /accreditations, POST /accreditations/{accreditation_id}/renew, POST /case-assignments"
    description: "Without a recognition row, no ACCREDITED_REPRESENTATIVE can be authorized at all."

  - priority: 13
    category: existence
    check: "Enum-typed input values are members of their declared enum, and required body fields are present and non-null"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"
    description: "Shape and enum-membership validation. Runs after id resolution so that a request with both a bad enum and a dangling id reports the 404 first."

  - priority: 14
    category: state
    check: "The requested transition (from_state, action) exists in the entity's §1.2 transition table"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all /transition, /screen, /decide, /withdraw, /advance-filing, /withdraw-representation, /reschedule, /renew and /checkpoint endpoints"
    description: "Structural transition legality, checked before any transition-specific precondition."

  - priority: 15
    category: state
    check: "CaseMatter.representation_status != 'WITHDRAWN_FROM'"
    error_id: ERR_MATTER_CLOSED
    http_status: 409
    applies_to: "POST /case-assignments, POST /evidence-items, POST /declarations, POST /interpretation-sessions, POST /calendar-events, POST /case-matters/{matter_id}/advance-filing, POST /case-assignments/{assignment_id}/log-hours"
    description: "CONFLICT PAIR 2 (existence vs state), low side. Loses to priority 11."

  - priority: 16
    category: state
    check: "IntakeScreening.status == 'ACCEPTED' before a CaseMatter may reference its intake_id"
    error_id: ERR_INTAKE_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /intake-screenings/{intake_id}/decide with decision == 'ACCEPT'"
    description: |
      SCREENING, WAITLISTED, DECLINED and REFERRED_OUT intakes cannot produce a matter.
      The same ACCEPT branch additionally rejects a supplied principal_matter_id whose
      CaseMatter.client_id differs from the accepted intake's client_id, with
      ERR_DERIVATIVE_CLIENT_MISMATCH / 422 — a derivative filing must belong to the same
      household member record as its principal, and this check runs after the state gate
      above so a DECLINED intake with a bad principal link still reports
      ERR_INTAKE_NOT_ACCEPTED.

  - priority: 17
    category: state
    check: "CaseAssignment.status == 'ACTIVE' before hours may be logged or supervision relinked against it"
    error_id: ERR_ASSIGNMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /case-assignments/{assignment_id}/log-hours, POST /case-assignments/{assignment_id}/relink-supervision"
    description: "PROPOSED, SUSPENDED and RELEASED assignments accrue nothing."

  - priority: 18
    category: state
    check: "The weighted gate variant: on a DETAINED matter's EVIDENCE_GATHERING -> READY_TO_FILE transition, readiness_index_weighted must be >= READY_TO_FILE_WEIGHTED_MIN. Separately, the matter must already be in READY_TO_FILE before target_filing_status == 'FILED' is accepted"
    error_id: ERR_MATTER_NOT_READY
    http_status: 409
    applies_to: "POST /case-matters/{matter_id}/advance-filing with target_filing_status IN {READY_TO_FILE, FILED}"
    description: |
      CONFLICT PAIR 3 (state vs business_safety), high side. Advancing a DETAINED matter to
      READY_TO_FILE while its weighted readiness index is below 0.7500 AND its LEAD
      representative's accreditation does not cover the matter's forum violates BOTH this rule
      and priority 24 (ERR_FORUM_NOT_AUTHORIZED). Priority 18 wins: ERR_MATTER_NOT_READY / 409.
      Boundary: readiness_index_weighted exactly 0.7500 passes (>=), 0.7499 fails.

  - priority: 19
    category: state
    check: "The strict-checklist gate variant: on a non-detained matter's EVIDENCE_GATHERING -> READY_TO_FILE transition, no REQUIRED EvidenceItem may remain outside {VERIFIED, WAIVED} and no EvidenceItem may be REJECTED"
    error_id: ERR_BLOCKING_EVIDENCE_OUTSTANDING
    http_status: 409
    applies_to: "POST /case-matters/{matter_id}/advance-filing with target_filing_status == 'READY_TO_FILE'"
    description: "The detained variant of the same transition is governed by the weighted threshold and raises ERR_MATTER_NOT_READY instead, so the two variants fail with different error ids on identical evidence."

  - priority: 20
    category: state
    check: "OrganizationRecognition.status IN {'ACTIVE', 'CONDITIONAL'} whenever an ACCREDITED_REPRESENTATIVE is being newly engaged"
    error_id: ERR_RECOGNITION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /case-assignments, POST /accreditations, POST /accreditations/{accreditation_id}/renew"
    description: "LAPSED, SUSPENDED or REVOKED recognition strips authorization from every accredited representative; CONDITIONAL still permits engagement but caps forum scope."

  - priority: 21
    category: state
    check: "GrantReport.status IN {'DRAFT', 'AMENDED'} before a GENERATE action, and == 'GENERATED' before a SUBMIT action"
    error_id: ERR_REPORT_STATE_INVALID
    http_status: 409
    applies_to: "POST /grant-reports/{report_id}/transition"
    description: "A SUBMITTED report is immutable until an AMEND action reopens it."

  - priority: 22
    category: business_safety
    check: "A Representative with rep_type == 'ACCREDITED_REPRESENTATIVE' or 'PRO_BONO_VOLUNTEER' and supervision_required == true must resolve a supervision link, either supplied or auto-selected, before its assignment may be created"
    error_id: ERR_NO_ELIGIBLE_SUPERVISOR
    http_status: 422
    applies_to: "POST /case-assignments"
    description: "Empty-pool boundary of calculations.supervisor_auto_selection: when the candidate list is empty the request is rejected rather than silently creating an unsupervised assignment."

  - priority: 23
    category: business_safety
    check: "A supplied supervision_link_id must satisfy every clause of the supervisor eligibility filter, including the client-language clause"
    error_id: ERR_SUPERVISION_LINK_INELIGIBLE
    http_status: 422
    applies_to: "POST /case-assignments, POST /case-assignments/{assignment_id}/relink-supervision"
    description: "An explicitly named supervisor is held to exactly the same predicate as an auto-selected one; the two paths differ only in ranking, never in eligibility."

  - priority: 24
    category: business_safety
    check: "The lead representative's authorization_status and accreditation forum grant must cover CaseMatter.forum"
    error_id: ERR_FORUM_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /case-matters/{matter_id}/advance-filing, POST /case-assignments"
    description: |
      CONFLICT PAIR 3 (state vs business_safety), low side. Loses to priority 18.
      A PARTIAL accreditation never grants EOIR_IMMIGRATION_COURT, so a PARTIAL-accredited
      lead on a removal-defense matter always fails here. This rule presupposes a lead to
      examine: a matter in COVERAGE_GAP, whose LEAD assignment was RELEASED or SUSPENDED by
      an authorization cascade, has no lead to authorize and fails the same advance-filing
      call with ERR_LEAD_NOT_ASSIGNED / 409 before the forum grant is ever computed.

  - priority: 25
    category: business_safety
    check: "Representative.supervisee_count < Representative.max_supervisees for the resolved supervisor"
    error_id: ERR_SUPERVISEE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /case-assignments, POST /case-assignments/{assignment_id}/transition with action == 'ACTIVATE'"
    description: "Boundary: a supervisor with supervisee_count exactly equal to max_supervisees is rejected; one below is accepted and lands exactly on the cap."

  - priority: 26
    category: business_safety
    check: "Representative.active_case_load < Representative.max_case_load for the named representative when role_on_case IN {LEAD, CO_COUNSEL}"
    error_id: ERR_CASELOAD_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /case-assignments, POST /case-assignments/{assignment_id}/transition with action == 'ACTIVATE'"
    description: |
      CONFLICT PAIR 4 (business_safety vs business_fiscal), high side. Activating an assignment
      for a representative already at max_case_load, on a matter whose ProgramCapacityCycle
      posture is FROZEN, violates BOTH this rule and priority 34 (ERR_CYCLE_CAPACITY_FROZEN).
      Priority 26 wins: ERR_CASELOAD_CAP_EXCEEDED / 422.

  - priority: 27
    category: business_safety
    check: "Exactly one CaseAssignment per matter may hold role_on_case == 'LEAD' with status IN {PROPOSED, ACTIVE, SUSPENDED}"
    error_id: ERR_LEAD_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /case-assignments"
    description: "A RELEASED lead frees the slot, which is how a COVERAGE_GAP matter is re-staffed."

  - priority: 28
    category: business_safety
    check: "The Representative certifying a Declaration must not be the Representative that prepared it, and must be a STAFF_ATTORNEY with authorization_status == 'AUTHORIZED_ATTORNEY'"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /declarations/{declaration_id}/transition with action == 'CERTIFY'"
    description: "Preparer and certifier must be distinct rows. Self-certification is rejected even when the preparer is itself a fully authorized staff attorney."

  - priority: 29
    category: business_safety
    check: "A Declaration may not be certified until its client read-back has been recorded with an interpretation session in the client's preferred language, unless the client's language is 'en'"
    error_id: ERR_READBACK_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /declarations/{declaration_id}/transition with action == 'CERTIFY'"
    description: "Cross-entity dependency: Declaration certification depends on a COMPLETED InterpretationSession whose language_code equals Client.preferred_language_code and whose purpose == 'DECLARATION_READBACK'."

  - priority: 30
    category: business_safety
    check: "Calendar conflict scan passes all three geometries of calculations.calendar_conflict_scan, in the order representative -> client -> facility"
    error_id: ERR_REPRESENTATIVE_CALENDAR_CONFLICT
    http_status: 409
    applies_to: "POST /calendar-events, POST /calendar-events/{event_id}/reschedule"
    description: "Fails with ERR_REPRESENTATIVE_CALENDAR_CONFLICT, ERR_CLIENT_CALENDAR_CONFLICT or ERR_FACILITY_VISIT_SLOTS_EXHAUSTED depending on which geometry trips first; the ordering is normative so a request violating two geometries reports the representative one."

  - priority: 31
    category: business_safety
    check: "A FACILITY_VISIT event must start at least DetentionFacility.visit_lead_time_hours after the current logical clock, and the acting representative's facility_access_credential_expires_on must be on or after the event's UTC calendar date when DetentionFacility.access_credential_required is true"
    error_id: ERR_FACILITY_LEAD_TIME_NOT_MET
    http_status: 422
    applies_to: "POST /calendar-events, POST /calendar-events/{event_id}/reschedule"
    description: "Boundary: a start instant exactly lead_time_hours after now is accepted; one millisecond earlier is rejected."

  - priority: 32
    category: business_fiscal
    check: "An InformedDecision may only be recorded when risks_disclosed and alternatives_disclosed are both non-empty, and Client.confidentiality_consent_scope != 'NONE'"
    error_id: ERR_CONSENT_SCOPE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /informed-decisions, POST /informed-decisions/{decision_id}/transition"
    description: "Consent scope ordering is PROGRAM_ONLY < FUNDER_AGGREGATE < FUNDER_IDENTIFIED, with NONE below all three and never sufficient."

  - priority: 33
    category: business_fiscal
    check: "IntakeScreening acceptance requires a slot from calculations.capacity_slot_waterfall: a detained intake draws from reserved_detained_slots then the general pool; a non-detained intake draws only from general_pool_free"
    error_id: ERR_NO_SLOT_AVAILABLE
    http_status: 409
    applies_to: "POST /intake-screenings/{intake_id}/decide with decision == 'ACCEPT'"
    description: "Because general_pool_free excludes the reserved detained block, a non-detained ACCEPT can be rejected while ProgramCapacityCycle.available_slot_count is still greater than zero."

  - priority: 34
    category: business_fiscal
    check: "ProgramCapacityCycle.capacity_posture != 'FROZEN' for any action that consumes a slot or activates a case assignment"
    error_id: ERR_CYCLE_CAPACITY_FROZEN
    http_status: 409
    applies_to: "POST /intake-screenings/{intake_id}/decide, POST /case-assignments, POST /case-assignments/{assignment_id}/transition with action == 'ACTIVATE'"
    description: |
      CONFLICT PAIR 4 (business_safety vs business_fiscal), low side. Loses to priority 26.
      Boundary: utilization_ratio exactly 0.9500 is FROZEN and rejected; 0.9499 is RESTRICTED
      and accepted. A cycle whose posture_override_until_utc is in the future downgrades FROZEN
      to RESTRICTED and passes.

  - priority: 35
    category: business_fiscal
    check: "Client.fpl_percent must be <= FPL_ELIGIBILITY_CEILING_PERCENT, or the case_type must appear in FEE_EXEMPT_CASE_TYPES, for a legal-eligibility verdict of ELIGIBLE"
    error_id: ERR_INDIGENCY_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /intake-screenings, POST /intake-screenings/{intake_id}/decide"
    description: "Boundary: exactly 200.00 percent of FPL is inside the ceiling (<=); 200.01 is outside."

  - priority: 36
    category: business_fiscal
    check: "hours per log entry must be > 0.00 and <= MAX_HOURS_PER_LOG_ENTRY, and hours_kind must match the assignment's role_on_case"
    error_id: ERR_HOURS_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /case-assignments/{assignment_id}/log-hours"
    description: "Boundary: exactly 12.00 hours is accepted, 12.01 is rejected, 0.00 is rejected. SUPERVISION hours against a non-SUPERVISOR assignment is rejected with the same id."

  - priority: 37
    category: business_fiscal
    check: "GrantReport period_start_date <= period_end_date, and both dates must fall inside the referenced ProgramCapacityCycle's [period_start_date, period_end_date] window inclusive"
    error_id: ERR_REPORT_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /grant-reports, POST /grant-reports/{report_id}/transition"
    description: "Boundary: period_start_date exactly equal to period_end_date is a legal one-day report; a start equal to the cycle's own period_start_date is inside the window."

  - priority: 38
    category: business_fiscal
    check: "The optimistic-concurrency token supplied on the endpoint must equal the current version of the named parent row"
    error_id: ERR_STALE_MATTER_VERSION
    http_status: 412
    applies_to: "POST /case-assignments, POST /informed-decisions, POST /accreditations/{accreditation_id}/renew"
    description: "Raises ERR_STALE_MATTER_VERSION for expected_matter_version against CaseMatter.version, and ERR_STALE_RECOGNITION_VERSION for expected_recognition_version against OrganizationRecognition.version. Checked last so that every cheaper rejection is reported before the caller is told to refetch."

  - priority: 39
    category: business_fiscal
    check: "Every invariant in calculations.invariant_capacity_slot_conservation, invariant_active_caseload_conservation and invariant_grant_allocation_conservation holds after the write"
    error_id: ERR_INVARIANT_VIOLATION
    http_status: 500
    applies_to: "all mutating endpoints"
    description: "Post-write assertion. A violation indicates a server defect and the transaction is rolled back; no partially applied cascade is ever persisted."# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# api_prefix is "/" — every collection is a top-level sibling, matching the
# graph entity_topology declared in complexity_profile.
# Every list endpoint accepts the §1.0 pagination fields (limit, offset) and
# returns total_count / has_more in meta. Query params written with a trailing
# "?" are optional. Every endpoint path and every `action`/`decision`/
# `target_filing_status` value used here appears verbatim in a §1.2 trigger.
# ---------------------------------------------------------------------------
endpoints:
  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an explicit UTC instant. The startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, expiry, lead-time and window rule in this scaffold reads the logical clock, never the host clock."
    roles: [ProgramDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "sets the logical clock; mutates no entity and fires no cascade"
      - "subsequent evaluations of Accreditation.expiry_date windows, CalendarEvent lead times, IntakeScreening.waitlist_expires_at_utc and ProgramCapacityCycle.posture_override_until_utc all read the new instant"

  # --- Client ---------------------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Registers a prospective client with household, language and consent data."
    roles: [ProgramDirector, IntakeScreener]
    code: 201
    input: [full_name, preferred_language_code, country_of_birth_code, date_of_birth, household_size, annual_household_income_cents, "a_number?", "confidentiality_consent_scope?", "interpreter_required?"]
    output: Client
    side_effects:
      - "computes Client.fpl_percent via calculations.indigency_fpl_percent"
      - "sets status = 'PROSPECTIVE', open_matter_count = 0, version = 1"
      - "defaults confidentiality_consent_scope to 'PROGRAM_ONLY' and interpreter_required to (preferred_language_code != 'en')"

  - method: GET
    path: "/clients"
    description: "Lists clients."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, GrantAnalyst]
    code: 200
    input: ["status?", "preferred_language_code?", "confidentiality_consent_scope?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  - method: GET
    path: "/clients/{client_id}"
    description: "Reads one client, including the computed fpl_percent and open_matter_count."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, CaseRepresentative, GrantAnalyst, ClientPortalUser]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: PATCH
    path: "/clients/{client_id}"
    description: "Updates household composition, income, language, consent scope or status."
    roles: [ProgramDirector, IntakeScreener]
    code: 200
    input: ["household_size?", "annual_household_income_cents?", "preferred_language_code?", "confidentiality_consent_scope?", "interpreter_required?", "status?"]
    output: Client
    side_effects:
      - "recomputes Client.fpl_percent via calculations.indigency_fpl_percent when household_size or annual_household_income_cents changes"
      - "narrowing confidentiality_consent_scope changes suppressed_case_count on the NEXT GrantReport GENERATE and leaves already-generated reports untouched"
      - "increments Client.version by 1"
      - "never retroactively changes an already-decided IntakeScreening.legal_eligibility_verdict"

  # --- ProgramCapacityCycle -------------------------------------------------
  - method: POST
    path: "/capacity-cycles"
    description: "Opens a funded capacity cycle with a total slot pool and a reserved detained sub-pool."
    roles: [ProgramDirector]
    code: 201
    input: [cycle_label, period_start_date, period_end_date, total_case_slots, reserved_detained_slots]
    output: ProgramCapacityCycle
    side_effects:
      - "sets general_slots_consumed = 0, detained_slots_consumed = 0, waitlisted_count = 0, available_slot_count = total_case_slots, utilization_ratio = 0.0000"
      - "computes capacity_posture via calculations.cycle_capacity_posture, yielding 'OPEN' on an empty cycle"
      - "sets checkpoint_epoch = 1 and last_checkpoint_utc = logical clock"
      - "rejects reserved_detained_slots > total_case_slots with ERR_VALIDATION; reserved_detained_slots == total_case_slots is legal and leaves general_pool_free permanently 0"

  - method: GET
    path: "/capacity-cycles"
    description: "Lists capacity cycles."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, GrantAnalyst]
    code: 200
    input: ["capacity_posture?", "limit?", "offset?"]
    output: ProgramCapacityCycle[]
    side_effects: []

  - method: GET
    path: "/capacity-cycles/{cycle_id}"
    description: "Reads one cycle with its live slot partition, utilization_ratio, capacity_posture and checkpoint_epoch. This is the read that asserts calculations.invariant_capacity_slot_conservation."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, GrantAnalyst]
    code: 200
    input: []
    output: ProgramCapacityCycle
    side_effects: []

  - method: POST
    path: "/capacity-cycles/{cycle_id}/posture-override"
    description: "Grants a time-boxed director override that downgrades a FROZEN posture to RESTRICTED until an explicit instant."
    roles: [ProgramDirector]
    code: 200
    input: [posture_override_until_utc, override_reason_code]
    output: ProgramCapacityCycle
    side_effects:
      - "sets posture_override_until_utc and recomputes capacity_posture via calculations.cycle_capacity_posture"
      - "an override instant strictly after the logical clock downgrades FROZEN to RESTRICTED, but never downgrades RESTRICTED to OPEN"
      - "an override instant at or before the logical clock leaves posture untouched"
      - "increments ProgramCapacityCycle.version by 1"

  - method: POST
    path: "/capacity-cycles/{cycle_id}/checkpoint"
    description: "Runs the cycle's time-driven sweep: waitlist expiry, then waitlist promotion, then accreditation expiry-window advancement. This is the only endpoint that fires the system-actor transitions declared in §1.2, and it is idempotent for a fixed logical clock."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ProgramCapacityCycle
    side_effects:
      - "PHASE 1 — expiry: every WAITLISTED IntakeScreening of this cycle whose waitlist_expires_at_utc is at or before the logical clock moves to WAITLIST_EXPIRED, waitlist_rank is cleared, and the remaining WAITLISTED rows are re-ranked by created_at ASC"
      - "PHASE 2 — promotion, evaluated strictly after PHASE 1: while calculations.capacity_slot_waterfall still resolves a free pool and the recomputed capacity_posture is IN {OPEN, RESTRICTED}, the promotable WAITLISTED row with the lowest waitlist_rank (tie-break created_at ASC) moves to ACCEPTED, creating a CaseMatter and consuming a slot; under RESTRICTED only rows with urgency_tier IN {URGENT, EMERGENCY} are promotable"
      - "PHASE 3 — credential aging: every APPROVED Accreditation inside its expiry window moves to EXPIRING, and every APPROVED, EXPIRING, RENEWAL_PENDING or SUSPENDED_BY_RECOGNITION Accreditation past its expiry_date moves to EXPIRED, re-deriving Representative.authorization_status and suspending that representative's ACTIVE assignments"
      - "recomputes utilization_ratio and capacity_posture via calculations.cycle_capacity_posture, increments checkpoint_epoch by 1 and sets last_checkpoint_utc = logical clock"
      - "increments ProgramCapacityCycle.version by 1 plus the version of every row the sweep mutated"
      - "an expired waitlist row is NEVER promoted, because PHASE 1 runs first — the phase order is normative and observable"

  # --- DetentionFacility ----------------------------------------------------
  - method: POST
    path: "/detention-facilities"
    description: "Registers a detention facility with its visit lead time, daily visit slot ceiling and expedited filing window."
    roles: [ProgramDirector]
    code: 201
    input: [name, jurisdiction_code, visit_lead_time_hours, max_daily_visit_slots, expedited_filing_days, "access_credential_required?"]
    output: DetentionFacility
    side_effects:
      - "sets status = 'OPEN'"
      - "max_daily_visit_slots = 0 is legal and makes every FACILITY_VISIT at that facility fail the aggregate geometry of calculations.calendar_conflict_scan regardless of timing"

  - method: GET
    path: "/detention-facilities"
    description: "Lists detention facilities."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, CaseRepresentative]
    code: 200
    input: ["jurisdiction_code?", "status?", "limit?", "offset?"]
    output: DetentionFacility[]
    side_effects: []

  - method: GET
    path: "/detention-facilities/{facility_id}"
    description: "Reads one facility."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, CaseRepresentative]
    code: 200
    input: []
    output: DetentionFacility
    side_effects: []

  # --- OrganizationRecognition ---------------------------------------------
  - method: POST
    path: "/organization-recognitions"
    description: "Records the organization's recognition, the root authority every non-attorney representative derives from."
    roles: [ProgramDirector]
    code: 201
    input: [recognition_number, effective_date, expiry_date, authorized_forums]
    output: OrganizationRecognition
    side_effects:
      - "sets status = 'ACTIVE', suspended_accreditation_count = 0, lapsed_at_utc = null, conditional_reason_code = null"
      - "rejects a second row whose status != 'WITHDRAWN' with ERR_RECOGNITION_ALREADY_EXISTS"

  - method: GET
    path: "/organization-recognitions"
    description: "Lists recognition rows."
    roles: [ProgramDirector, SupervisingAttorney, GrantAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OrganizationRecognition[]
    side_effects: []

  - method: GET
    path: "/organization-recognitions/{recognition_id}"
    description: "Reads the recognition row including its version, which is the OCC token source consumed by POST /accreditations/{accreditation_id}/renew."
    roles: [ProgramDirector, SupervisingAttorney, GrantAnalyst]
    code: 200
    input: []
    output: OrganizationRecognition
    side_effects: []

  - method: POST
    path: "/organization-recognitions/{recognition_id}/transition"
    description: "Drives the recognition lifecycle. Actions: CONDITION, REINSTATE, LAPSE, WITHDRAW. LAPSE is the trigger of the depth-4 CASCADE-A chain."
    roles: [ProgramDirector]
    code: 200
    input: [action, "conditional_reason_code?"]
    output: OrganizationRecognition
    side_effects:
      - "CONDITION moves ACTIVE -> CONDITIONAL, requires conditional_reason_code, and re-derives authorization_status for every Representative holding an Accreditation of this recognition — a CONDITIONAL recognition caps forum scope without suspending anyone"
      - "REINSTATE moves CONDITIONAL -> ACTIVE or LAPSED -> ACTIVE and requires the logical clock date to be at or before expiry_date"
      - "LAPSE runs CASCADE-A hops 0 through 4 exactly as declared in state_machines.OrganizationRecognition: status -> LAPSED, then qualifying Accreditations -> SUSPENDED_BY_RECOGNITION, then those representatives' ACTIVE CaseAssignments -> SUSPENDED, then their CaseMatters -> COVERAGE_GAP, then those matters' IN_REVIEW Declarations -> REVISION_REQUESTED and their near-term CalendarEvents flagged"
      - "REINSTATE from LAPSED partially compensates CASCADE-A: accreditations still inside their expiry_date return to APPROVED while those past it move to EXPIRED, suspended assignments whose representative is again authorized return to ACTIVE, and matters that regain an ACTIVE LEAD leave COVERAGE_GAP — Declarations pushed to REVISION_REQUESTED are NOT restored, so the cascade is deliberately not fully reversible"
      - "WITHDRAW is terminal: every non-REVOKED Accreditation moves to REVOKED and every affected CaseAssignment to RELEASED"
      - "increments OrganizationRecognition.version by 1 plus the version of every row the cascade mutated"

  # --- Representative -------------------------------------------------------
  - method: POST
    path: "/representatives"
    description: "Registers a staff attorney, accredited representative, pro bono volunteer or interpreter."
    roles: [ProgramDirector]
    code: 201
    input: [full_name, rep_type, languages, max_case_load, max_supervisees, weekly_capacity_hours, "bar_number?", "facility_access_credential_expires_on?"]
    output: Representative
    side_effects:
      - "sets active_case_load = 0, supervisee_count = 0, status = 'ACTIVE'"
      - "derives supervision_required = (rep_type != 'STAFF_ATTORNEY')"
      - "computes authorization_status via calculations.representative_authorization_status, which yields 'AUTHORIZED_ATTORNEY' for a STAFF_ATTORNEY with a bar_number and 'UNAUTHORIZED' for every rep_type that still needs an APPROVED Accreditation"
      - "rejects a STAFF_ATTORNEY without bar_number with ERR_VALIDATION"
      - "max_supervisees = 0 is legal and makes the representative permanently ineligible as a supervisor, which is how the empty-candidate-pool boundary of calculations.supervisor_auto_selection is reached"

  - method: GET
    path: "/representatives"
    description: "Lists representatives; the filters mirror the eligibility clauses of calculations.supervisor_auto_selection."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, CaseRepresentative]
    code: 200
    input: ["rep_type?", "status?", "authorization_status?", "language_code?", "limit?", "offset?"]
    output: Representative[]
    side_effects: []

  - method: GET
    path: "/representatives/{representative_id}"
    description: "Reads one representative, including the denormalized active_case_load and supervisee_count asserted by calculations.invariant_active_caseload_conservation."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, CaseRepresentative]
    code: 200
    input: []
    output: Representative
    side_effects: []

  - method: PATCH
    path: "/representatives/{representative_id}"
    description: "Updates capacity ceilings, language competencies, facility credential expiry or employment status."
    roles: [ProgramDirector]
    code: 200
    input: ["languages?", "max_case_load?", "max_supervisees?", "weekly_capacity_hours?", "facility_access_credential_expires_on?", "status?"]
    output: Representative
    side_effects:
      - "lowering max_case_load below the current active_case_load is accepted and leaves the representative over cap: it blocks further ACTIVATE with ERR_CASELOAD_CAP_EXCEEDED but never auto-releases existing work"
      - "lowering max_supervisees below the current supervisee_count behaves the same way against ERR_SUPERVISEE_CAP_EXCEEDED and immediately empties the candidate pool of calculations.supervisor_auto_selection"
      - "removing a language from languages makes the representative ineligible as a supervisor for clients who speak it, without touching assignments already held"
      - "setting status to 'SUSPENDED' or 'SEPARATED' moves every CaseAssignment of this representative with status IN {PROPOSED, ACTIVE} to SUSPENDED with release_reason_code = 'AUTHORIZATION_REVOKED', recomputes active_case_load and supervisee_count, and moves every matter that lost its only ACTIVE LEAD into COVERAGE_GAP"
      - "re-derives authorization_status via calculations.representative_authorization_status"
      - "increments Representative.version by 1 plus the version of every row it mutated"

  # --- Accreditation --------------------------------------------------------
  - method: POST
    path: "/accreditations"
    description: "Files an accreditation request for a non-attorney representative under the organization's recognition."
    roles: [ProgramDirector, SupervisingAttorney]
    code: 201
    input: [representative_id, recognition_id, accreditation_type, requested_forums]
    output: Accreditation
    side_effects:
      - "sets status = 'PENDING', renewal_round = 0, authorized_forums = [], effective_date = null, expiry_date = null"
      - "rejects when OrganizationRecognition.status is not IN {ACTIVE, CONDITIONAL} with ERR_RECOGNITION_NOT_ACTIVE"
      - "rejects a target whose rep_type == 'STAFF_ATTORNEY' with ERR_ACCREDITATION_NOT_APPLICABLE"

  - method: GET
    path: "/accreditations"
    description: "Lists accreditations, filterable by every foreign key the entity carries."
    roles: [ProgramDirector, SupervisingAttorney, GrantAnalyst]
    code: 200
    input: ["representative_id?", "recognition_id?", "approved_by_representative_id?", "status?", "accreditation_type?", "limit?", "offset?"]
    output: Accreditation[]
    side_effects: []

  - method: GET
    path: "/accreditations/{accreditation_id}"
    description: "Reads one accreditation with its granted authorized_forums and term dates."
    roles: [ProgramDirector, SupervisingAttorney, GrantAnalyst]
    code: 200
    input: []
    output: Accreditation
    side_effects: []

  - method: POST
    path: "/accreditations/{accreditation_id}/transition"
    description: "Drives the accreditation decision surface. Actions: APPROVE, DENY, REVOKE. APPROVE is legal from both PENDING and RENEWAL_PENDING, closing the APPROVED -> EXPIRING -> RENEWAL_PENDING -> APPROVED cycle."
    roles: [SupervisingAttorney, ProgramDirector]
    code: 200
    input: [action, "decision_reason_code?"]
    output: Accreditation
    side_effects:
      - "APPROVE computes authorized_forums, effective_date and expiry_date via calculations.accreditation_forum_grant, and rejects an empty forum intersection with ERR_FORUM_GRANT_EMPTY"
      - "APPROVE sets approved_by_representative_id to the acting X-User-ID, which must differ from Accreditation.representative_id, else ERR_SEGREGATION_OF_DUTIES"
      - "APPROVE from RENEWAL_PENDING additionally increments renewal_round by 1"
      - "REVOKE moves every CaseAssignment of that representative with status IN {PROPOSED, ACTIVE} to RELEASED with release_reason_code = 'AUTHORIZATION_REVOKED' and pushes the affected matters into COVERAGE_GAP"
      - "re-derives Representative.authorization_status via calculations.representative_authorization_status on every action"
      - "increments Accreditation.version and Representative.version by 1 each"

  - method: POST
    path: "/accreditations/{accreditation_id}/renew"
    description: "Opens a renewal round on an EXPIRING accreditation, moving it to RENEWAL_PENDING. Optimistically concurrency-controlled on the parent OrganizationRecognition, because the renewal re-reads that row's authorized_forums ceiling."
    roles: [SupervisingAttorney, ProgramDirector]
    code: 200
    input: [expected_recognition_version, requested_forums]
    output: Accreditation
    side_effects:
      - "rejects with ERR_STALE_RECOGNITION_VERSION / 412 when expected_recognition_version != OrganizationRecognition.version"
      - "increments OrganizationRecognition.version by 1 on success, so a second renewal attempt holding the same token fails"
      - "rejects when OrganizationRecognition.status is not IN {ACTIVE, CONDITIONAL} with ERR_RECOGNITION_NOT_ACTIVE, and when the logical clock date is past Accreditation.expiry_date with ERR_INVALID_STATE_TRANSITION"
      - "records requested_forums for the pending round; the grant itself is computed on the subsequent APPROVE against the recognition's CURRENT authorized_forums, so a recognition narrowed between renew and approve narrows the renewed term"
      - "increments Accreditation.version by 1"

  # --- IntakeScreening ------------------------------------------------------
  - method: POST
    path: "/intake-screenings"
    description: "Opens an intake screening in DRAFT against a named capacity cycle. No eligibility or urgency figure is computed until the screen step."
    roles: [ProgramDirector, IntakeScreener]
    code: 201
    input: [client_id, cycle_id, case_type, detained, "facility_id?", "statutory_deadline_date?", "one_year_bar_applies?", "prior_removal_order?", "unaccompanied_minor?"]
    output: IntakeScreening
    side_effects:
      - "sets status = 'DRAFT', legal_eligibility_verdict = null, urgency_score = null, urgency_tier = null, waitlist_rank = null"
      - "rejects detained = true with a null facility_id via ERR_FACILITY_REQUIRED_FOR_DETAINED"
      - "consumes no capacity slot"

  - method: GET
    path: "/intake-screenings"
    description: "Lists intake screenings, filterable by every foreign key the entity carries."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, GrantAnalyst]
    code: 200
    input: ["client_id?", "cycle_id?", "screener_representative_id?", "decided_by_representative_id?", "facility_id?", "status?", "urgency_tier?", "limit?", "offset?"]
    output: IntakeScreening[]
    side_effects: []

  - method: GET
    path: "/intake-screenings/{intake_id}"
    description: "Reads one screening with its computed eligibility verdict, urgency figures and waitlist position."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, GrantAnalyst, ClientPortalUser]
    code: 200
    input: []
    output: IntakeScreening
    side_effects: []

  - method: POST
    path: "/intake-screenings/{intake_id}/screen"
    description: "Completes the screening interview, moving DRAFT -> SCREENED and fixing the eligibility verdict and urgency score. The acting screener is recorded and is thereafter barred from deciding the same screening."
    roles: [IntakeScreener, ProgramDirector]
    code: 200
    input: []
    output: IntakeScreening
    side_effects:
      - "sets screener_representative_id = the acting X-User-ID and screened_at_utc = logical clock"
      - "recomputes Client.fpl_percent via calculations.indigency_fpl_percent, then legal_eligibility_verdict via calculations.legal_eligibility_verdict using its first-matching-clause order"
      - "sets urgency_variant_applied, urgency_anchor_date, urgency_score and urgency_tier via calculations.intake_urgency_score, selecting the STRICT_STATUTORY variant when detained is false and CALENDAR_INCLUSIVE when detained is true"
      - "requires the logical clock date to sit inside the cycle's [period_start_date, period_end_date] window inclusive"
      - "increments IntakeScreening.version by 1"

  - method: POST
    path: "/intake-screenings/{intake_id}/decide"
    description: "The four-way intake decision fork. decision is one of ACCEPT, WAITLIST, DECLINE, REFER_OUT — each branch has a different required-field set and a different side-effect set. Segregation of duties: the decider must not be the screener."
    roles: [SupervisingAttorney, ProgramDirector]
    code: 200
    input: [decision, decision_reason_code, "referral_partner_code?", "principal_matter_id?"]
    output: IntakeScreening
    side_effects:
      - "every branch sets decided_by_representative_id = the acting X-User-ID and decided_at_utc = logical clock, and rejects with ERR_SEGREGATION_OF_DUTIES when that id equals screener_representative_id"
      - "ACCEPT requires legal_eligibility_verdict == 'ELIGIBLE', resolves a pool via calculations.capacity_slot_waterfall, and CREATES one CaseMatter with representation_status = 'UNSTAFFED', filing_status = 'PRE_FILING', slot_pool_consumed = the resolved pool and principal_matter_id from the payload; the new matter is discoverable only through GET /case-matters filtered by intake_id"
      - "ACCEPT recomputes the cycle's consumed counters, available_slot_count, utilization_ratio and capacity_posture via calculations.cycle_capacity_posture, and increments Client.open_matter_count"
      - "ACCEPT rejects with ERR_NO_SLOT_AVAILABLE when the applicable sub-pool is exhausted, and with ERR_CYCLE_CAPACITY_FROZEN when the effective posture is FROZEN unless the screening is detained with urgency_tier == 'EMERGENCY'"
      - "WAITLIST requires decision_reason_code == 'CAPACITY_FULL', sets waitlist_rank = 1 + the count of WAITLISTED rows in the cycle and waitlist_expires_at_utc = logical clock + WAITLIST_TTL_DAYS days, increments ProgramCapacityCycle.waitlisted_count, and consumes NO slot"
      - "DECLINE creates no CaseMatter, consumes no slot and requires a decision_reason_code from the decline set"
      - "REFER_OUT additionally requires a non-null referral_partner_code, else ERR_VALIDATION"
      - "ACCEPT is also legal from WAITLISTED, where it is the manual waitlist promotion and re-ranks the remaining WAITLISTED rows by created_at ASC"
      - "increments IntakeScreening.version, and on the ACCEPT and WAITLIST branches ProgramCapacityCycle.version and Client.version, by 1 each"

  - method: POST
    path: "/intake-screenings/{intake_id}/withdraw"
    description: "Withdraws a screening at the client's request. Legal from DRAFT, SCREENED, WAITLISTED and ACCEPTED; from ACCEPTED it is the compensating action for the slot-consuming ACCEPT and fires the depth-4 CASCADE-B chain."
    roles: [IntakeScreener, ProgramDirector, ClientPortalUser]
    code: 200
    input: []
    output: IntakeScreening
    side_effects:
      - "sets decision_reason_code = 'CLIENT_WITHDREW' and decided_at_utc = logical clock"
      - "a ClientPortalUser may call this only when X-User-ID equals IntakeScreening.client_id, else ERR_ACTOR_NOT_ON_CASE"
      - "from WAITLISTED it clears waitlist_rank and waitlist_expires_at_utc, decrements waitlisted_count and re-ranks the remaining WAITLISTED rows by created_at ASC"
      - "from ACCEPTED it runs CASCADE-B hop 1: the derived CaseMatter gets representation_status = 'WITHDRAWN_FROM', filing_status = 'CLOSED_NO_FILING', outcome = 'WITHDRAWN', closed_at_utc = logical clock"
      - "CASCADE-B hop 2 (caused by hop 1): every CaseAssignment of that matter with status IN {PROPOSED, ACTIVE, SUSPENDED} moves to RELEASED with release_reason_code = 'CLIENT_WITHDREW', and each affected Representative's active_case_load and supervisee_count are recomputed"
      - "CASCADE-B hop 3 (caused by hop 1): the slot recorded in CaseMatter.slot_pool_consumed is returned to that pool, and available_slot_count, utilization_ratio and capacity_posture are recomputed via calculations.cycle_capacity_posture"
      - "CASCADE-B hop 4 (caused by hop 3): the freed slot promotes the lowest-waitlist_rank promotable WAITLISTED screening of the same cycle to ACCEPTED, which itself creates a CaseMatter and re-consumes the slot; when no promotable row exists the slot simply stays available"
      - "rejects from ACCEPTED when the derived matter's filing_status IN {FILED, DECIDED, APPEALED} with ERR_INVALID_STATE_TRANSITION"
      - "recomputes Client.open_matter_count and sets Client.status = 'CLOSED' when it reaches 0"
      - "increments IntakeScreening.version, and on the ACCEPTED branch CaseMatter.version, ProgramCapacityCycle.version and Client.version, by 1 each"

  # --- CaseMatter (created only by the intake ACCEPT branch) -----------------
  - method: GET
    path: "/case-matters"
    description: "Lists case matters, filterable by every foreign key the entity carries including the self-referential derivative link. This is the only discovery channel for a matter minted by the intake ACCEPT cascade."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, CaseRepresentative, GrantAnalyst]
    code: 200
    input: ["client_id?", "intake_id?", "cycle_id?", "principal_matter_id?", "facility_id?", "representation_status?", "filing_status?", "detained?", "coverage_gap_flag?", "limit?", "offset?"]
    output: CaseMatter[]
    side_effects: []

  - method: GET
    path: "/case-matters/{matter_id}"
    description: "Reads one matter with both parallel status dimensions, the readiness figures of calculations.matter_readiness_index, the rolled-up hours and interpretation cost, and the version that is the OCC token for assignment and informed-decision creation."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, CaseRepresentative, GrantAnalyst, ClientPortalUser]
    code: 200
    input: []
    output: CaseMatter
    side_effects: []

  - method: POST
    path: "/case-matters/{matter_id}/set-facility"
    description: "Attaches, moves or clears the detention facility for a matter. This re-derives the expedited filing deadline AND flips which readiness gate variant applies, because the gate keys on CaseMatter.detained."
    roles: [ProgramDirector, SupervisingAttorney]
    code: 200
    input: [detained, "facility_id?"]
    output: CaseMatter
    side_effects:
      - "recomputes expedited_deadline_date and effective_filing_deadline_date via calculations.matter_forum_and_deadlines against the NEW facility's expedited_filing_days"
      - "recomputes readiness_index_weighted, readiness_ready_strict, evidence_blocking_count and readiness_gate_applied via calculations.matter_readiness_index under the newly applicable gate variant, so releasing a client from detention can make an already-READY_TO_FILE matter fail its next transition with a DIFFERENT error id than it would have failed with while detained"
      - "rejects detained = true with a null facility_id via ERR_FACILITY_REQUIRED_FOR_DETAINED"
      - "rejects any change while filing_status IN {FILED, RFE_PENDING} with ERR_FACILITY_CHANGE_AFTER_FILING"
      - "increments CaseMatter.version by 1"

  - method: POST
    path: "/case-matters/{matter_id}/advance-filing"
    description: "Drives the filing_status dimension only. target_filing_status is one of EVIDENCE_GATHERING, READY_TO_FILE, FILED, RFE_PENDING, DECIDED, APPEALED. The same target value means different things from different origins: FILED from READY_TO_FILE is the initial filing, FILED from RFE_PENDING is the RFE response; EVIDENCE_GATHERING from PRE_FILING is the forward step, from READY_TO_FILE it is the revert."
    roles: [CaseRepresentative, SupervisingAttorney, ProgramDirector]
    code: 200
    input: [target_filing_status, "outcome?", "rfe_response_due_date?", "appeal_due_date?"]
    output: CaseMatter
    side_effects:
      - "PRE_FILING -> EVIDENCE_GATHERING requires representation_status IN {STAFFED, SUPERVISED_STAFFED} — a cross-dimension precondition — and at least one REQUIRED EvidenceItem on the matter"
      - "EVIDENCE_GATHERING -> READY_TO_FILE requires a CERTIFIED Declaration and evaluates the gate variant selected by CaseMatter.detained: the detained EVIDENCE_WEIGHTED_GATE fails with ERR_MATTER_NOT_READY while the non-detained CHECKLIST_STRICT_GATE fails with ERR_BLOCKING_EVIDENCE_OUTSTANDING on identical evidence; readiness_gate_applied records which ran"
      - "READY_TO_FILE -> EVIDENCE_GATHERING is the revert edge and always succeeds from READY_TO_FILE"
      - "READY_TO_FILE -> FILED requires a DOCUMENTED InformedDecision with decision_type IN {FILE_AFFIRMATIVE, PURSUE_RELIEF_IN_COURT} and the logical clock date at or before effective_filing_deadline_date; it COMPLETES every SCHEDULED or CONFIRMED FILING_DEADLINE CalendarEvent of the matter"
      - "FILED -> RFE_PENDING requires rfe_response_due_date, sets statutory_deadline_date to it, recomputes effective_filing_deadline_date, and CREATES one FILING_DEADLINE CalendarEvent at 00:00:00.000Z on that date with location_code 'MAIL' — discoverable only through GET /calendar-events filtered by matter_id"
      - "RFE_PENDING -> FILED requires evidence_blocking_count == 0 after recomputation; the FILED -> RFE_PENDING -> FILED cycle may repeat without bound"
      - "{FILED, RFE_PENDING} -> DECIDED requires outcome and CANCELS every SCHEDULED or CONFIRMED CalendarEvent of the matter whose event_type != 'FACILITY_VISIT'"
      - "DECIDED -> APPEALED requires outcome == 'DENIED', a DOCUMENTED APPEAL_DECISION InformedDecision and appeal_due_date; it sets forum = 'BIA' and CLEARS outcome, so the matter must be decided again"
      - "APPEALED -> DECIDED requires outcome; the DECIDED -> APPEALED -> DECIDED cycle may repeat without bound"
      - "the representation_status dimension is never touched by this endpoint"
      - "increments CaseMatter.version by 1, invalidating any outstanding expected_matter_version token"

  - method: POST
    path: "/case-matters/{matter_id}/withdraw-representation"
    description: "Withdraws the organization from representing the client on this matter. Terminal on the representation dimension and the only endpoint that closes a matter without withdrawing the underlying intake."
    roles: [SupervisingAttorney, ProgramDirector]
    code: 200
    input: ["withdrawal_motion_filed?", "reason_code?"]
    output: CaseMatter
    side_effects:
      - "requires a DOCUMENTED InformedDecision of this matter with decision_type == 'WITHDRAW_CASE', else ERR_CONSENT_SCOPE_INSUFFICIENT"
      - "requires filing_status != 'FILED' unless withdrawal_motion_filed == true"
      - "sets representation_status = 'WITHDRAWN_FROM' and closed_at_utc = logical clock; filing_status becomes 'CLOSED_NO_FILING' unless it is already 'DECIDED'"
      - "releases every CaseAssignment with status IN {PROPOSED, ACTIVE, SUSPENDED} with release_reason_code = 'MATTER_CLOSED' and recomputes each Representative's active_case_load and supervisee_count"
      - "returns the consumed slot to CaseMatter.slot_pool_consumed and recomputes the cycle counters and capacity_posture via calculations.cycle_capacity_posture"
      - "recomputes Client.open_matter_count and sets Client.status = 'CLOSED' when it reaches 0"
      - "increments CaseMatter.version, ProgramCapacityCycle.version and Client.version by 1 each"

  # --- CaseAssignment -------------------------------------------------------
  - method: POST
    path: "/case-assignments"
    description: "Assigns a representative to a matter in a named role, resolving supervision either explicitly or by deterministic auto-selection. Optimistically concurrency-controlled on the parent CaseMatter."
    roles: [SupervisingAttorney, ProgramDirector]
    code: 201
    input: [matter_id, representative_id, role_on_case, expected_matter_version, "supervision_link_id?"]
    output: CaseAssignment
    side_effects:
      - "rejects with ERR_STALE_MATTER_VERSION / 412 when expected_matter_version != CaseMatter.version"
      - "increments CaseMatter.version by 1 on success, so a second create holding the same token fails"
      - "resolves supervision via calculations.supervisor_auto_selection when supervision_link_id is omitted and the named representative has supervision_required == true, recording supervision_source as 'AUTO_SELECTED' or 'EXPLICIT_LINK'"
      - "rejects with ERR_NO_ELIGIBLE_SUPERVISOR when the candidate pool is empty, and with ERR_SUPERVISION_LINK_INELIGIBLE when an explicitly supplied link fails the same predicate"
      - "sets status = 'PROPOSED', assigned_at_utc = logical clock, direct_hours_logged = 0.00, supervision_hours_logged = 0.00"
      - "enforces at most one LEAD per matter with status IN {PROPOSED, ACTIVE, SUSPENDED} via ERR_LEAD_ALREADY_ASSIGNED"
      - "does NOT change Representative.active_case_load — the counters move only on ACTIVATE"

  - method: GET
    path: "/case-assignments"
    description: "Lists case assignments, filterable by every foreign key the entity carries including the self-referential supervision link. This is the only discovery channel for the supervisor row auto-selected at create time."
    roles: [ProgramDirector, IntakeScreener, SupervisingAttorney, CaseRepresentative, GrantAnalyst]
    code: 200
    input: ["matter_id?", "representative_id?", "supervision_link_id?", "role_on_case?", "status?", "limit?", "offset?"]
    output: CaseAssignment[]
    side_effects: []

  - method: GET
    path: "/case-assignments/{assignment_id}"
    description: "Reads one assignment with its supervision link, source and logged hours."
    roles: [ProgramDirector, SupervisingAttorney, CaseRepresentative]
    code: 200
    input: []
    output: CaseAssignment
    side_effects: []

  - method: POST
    path: "/case-assignments/{assignment_id}/transition"
    description: "Drives the assignment lifecycle. Actions: ACTIVATE, SUSPEND, RELEASE. ACTIVATE is legal from both PROPOSED and SUSPENDED, so ACTIVE -> SUSPENDED -> ACTIVE is a genuine cycle whose re-entry re-checks every ceiling."
    roles: [SupervisingAttorney, ProgramDirector]
    code: 200
    input: [action, "release_reason_code?"]
    output: CaseAssignment
    side_effects:
      - "ACTIVATE requires Representative.status == 'ACTIVE' and authorization_status NOT IN {AUTHORIZATION_SUSPENDED, UNAUTHORIZED}, active_case_load < max_case_load for LEAD and CO_COUNSEL, and a resolvable supervision link when supervision_required == true"
      - "ACTIVATE of a LEAD on a matter whose forum IN {EOIR_IMMIGRATION_COURT, BIA} additionally requires an AUTHORIZED_ATTORNEY or a FULL accreditation whose authorized_forums contains that forum, else ERR_FORUM_NOT_AUTHORIZED"
      - "ACTIVATE sets activated_at_utc, RELEASES any other LEAD assignment of the matter with release_reason_code = 'SUPERSEDED_BY_NEW_LEAD', increments Representative.active_case_load and the supervisor's supervisee_count, and advances CaseMatter.representation_status to STAFFED or SUPERVISED_STAFFED depending on the lead's supervision_required flag"
      - "SUSPEND and RELEASE decrement exactly the counters ACTIVATE incremented, satisfying calculations.invariant_active_caseload_conservation"
      - "SUSPEND or RELEASE of the only ACTIVE LEAD moves CaseMatter.representation_status to COVERAGE_GAP and sets coverage_gap_flag = true; RESTAFFING is possible only by ACTIVATING a replacement LEAD"
      - "RELEASE of a SUPERVISOR assignment is rejected while any assignment with supervision_link_id pointing at it still has status IN {PROPOSED, ACTIVE} — the supervisees must be relinked or released first"
      - "SUSPEND and RELEASE require release_reason_code when the actor is a SupervisingAttorney"
      - "increments CaseAssignment.version, Representative.version and CaseMatter.version by 1 each"

  - method: POST
    path: "/case-assignments/{assignment_id}/relink-supervision"
    description: "Repoints a supervised assignment at a different supervisor assignment on the same matter. This is the escape hatch that lets a supervisor assignment be released."
    roles: [SupervisingAttorney, ProgramDirector]
    code: 200
    input: [supervision_link_id]
    output: CaseAssignment
    side_effects:
      - "validates the new link against the full eligibility predicate of calculations.supervisor_auto_selection, including the client-language clause, else ERR_SUPERVISION_LINK_INELIGIBLE"
      - "decrements the old supervisor's supervisee_count and increments the new supervisor's, keeping calculations.invariant_active_caseload_conservation intact"
      - "sets supervision_source = 'EXPLICIT_LINK'"
      - "requires CaseAssignment.status == 'ACTIVE', else ERR_ASSIGNMENT_NOT_ACTIVE"
      - "increments CaseAssignment.version and both Representative.version rows by 1 each"

  - method: POST
    path: "/case-assignments/{assignment_id}/log-hours"
    description: "Logs direct legal service or supervision time against an ACTIVE assignment. Logged direct hours are the money input to grant reimbursement."
    roles: [CaseRepresentative, SupervisingAttorney, ProgramDirector]
    code: 200
    input: [hours, hours_kind, service_date]
    output: CaseAssignment
    side_effects:
      - "accumulates and rolls up via calculations.case_hours_rollup onto both CaseAssignment and CaseMatter, rounding to 2 decimals at each step"
      - "rejects hours <= 0.00 or > MAX_HOURS_PER_LOG_ENTRY with ERR_HOURS_OUT_OF_RANGE; exactly 12.00 is accepted"
      - "rejects hours_kind == 'SUPERVISION' against an assignment whose role_on_case != 'SUPERVISOR', and hours_kind == 'DIRECT' against a SUPERVISOR assignment, with ERR_HOURS_OUT_OF_RANGE"
      - "hours logged on a later-RELEASED assignment still count toward grant reporting, because service already delivered is never un-reported"
      - "increments CaseAssignment.version and CaseMatter.version by 1 each"

  # --- EvidenceItem ---------------------------------------------------------
  - method: POST
    path: "/evidence-items"
    description: "Adds a REQUIRED or SUPPORTING evidence item to a matter's gathering checklist, with the weight it carries in the weighted readiness index."
    roles: [CaseRepresentative, SupervisingAttorney, ProgramDirector]
    code: 201
    input: [matter_id, item_type, tier, weight_points, "source_language_code?", "requires_translation?", "due_date?"]
    output: EvidenceItem
    side_effects:
      - "sets status = 'REQUESTED', rejection_round = 0, received_at_utc = null, verified_at_utc = null"
      - "recomputes CaseMatter.readiness_index_weighted, readiness_ready_strict and evidence_blocking_count via calculations.matter_readiness_index"
      - "rejects weight_points <= 0 with ERR_VALIDATION"
      - "increments CaseMatter.version by 1"

  - method: GET
    path: "/evidence-items"
    description: "Lists evidence items for a matter."
    roles: [ProgramDirector, SupervisingAttorney, CaseRepresentative, GrantAnalyst]
    code: 200
    input: ["matter_id?", "tier?", "status?", "requires_translation?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []

  - method: POST
    path: "/evidence-items/{item_id}/transition"
    description: "Drives the evidence lifecycle. Actions: RECEIVE, TRANSLATE, VERIFY, REJECT, REREQUEST, WAIVE. RECEIVED -> REJECTED -> REQUESTED -> RECEIVED is an unbounded cycle."
    roles: [CaseRepresentative, SupervisingAttorney, ProgramDirector]
    code: 200
    input: [action, "disposition_reason_code?", "new_due_date?"]
    output: EvidenceItem
    side_effects:
      - "RECEIVE sets received_at_utc and requires the matter to be IN {STAFFED, SUPERVISED_STAFFED}"
      - "TRANSLATE is legal only when requires_translation == true, and VERIFY from RECEIVED is legal only when requires_translation == false"
      - "REJECT requires disposition_reason_code from the rejection set and increments rejection_round; a REJECTED row is blocking, so evidence_blocking_count rises"
      - "REREQUEST requires new_due_date at or after the logical clock date, clears received_at_utc and disposition_reason_code, and returns the row to REQUESTED"
      - "WAIVE is legal from REQUESTED, RECEIVED, TRANSLATED and REJECTED and requires disposition_reason_code from the waiver set; a WAIVED row leaves BOTH the numerator and the denominator of readiness_index_weighted, so waiving a low-weight unverified item RAISES the index while waiving a high-weight VERIFIED item LOWERS it"
      - "every action recomputes CaseMatter.readiness_index_weighted, readiness_ready_strict and evidence_blocking_count via calculations.matter_readiness_index"
      - "a REJECT with disposition_reason_code == 'INCONSISTENT_WITH_DECLARATION' blocks the matter's Declaration CERTIFY until the item leaves REJECTED"
      - "increments EvidenceItem.version and CaseMatter.version by 1 each"

  # --- Declaration ----------------------------------------------------------
  - method: POST
    path: "/declarations"
    description: "Starts a client declaration draft in a named language, attributed to the preparer's assignment."
    roles: [CaseRepresentative, SupervisingAttorney, ProgramDirector]
    code: 201
    input: [matter_id, preparer_assignment_id, language_code, "word_count?"]
    output: Declaration
    side_effects:
      - "sets status = 'DRAFT', revision_round = 0, readback_completed = false, reviewer_assignment_id = null, readback_session_id = null"
      - "rejects a preparer_assignment_id whose matter_id differs from the declaration's matter_id with ERR_ASSIGNMENT_MATTER_MISMATCH"
      - "rejects a preparer assignment whose status != 'ACTIVE' with ERR_ASSIGNMENT_NOT_ACTIVE"

  - method: GET
    path: "/declarations"
    description: "Lists declarations, filterable by every foreign key the entity carries."
    roles: [ProgramDirector, SupervisingAttorney, CaseRepresentative]
    code: 200
    input: ["matter_id?", "preparer_assignment_id?", "reviewer_assignment_id?", "readback_session_id?", "status?", "language_code?", "limit?", "offset?"]
    output: Declaration[]
    side_effects: []

  - method: POST
    path: "/declarations/{declaration_id}/transition"
    description: "Drives the declaration lifecycle. Actions: SUBMIT_FOR_REVIEW, REQUEST_REVISION, RESUME_DRAFT, CERTIFY, WITHDRAW. DRAFT -> IN_REVIEW -> REVISION_REQUESTED -> DRAFT is an unbounded cycle, and each pass increments revision_round."
    roles: [CaseRepresentative, SupervisingAttorney, ProgramDirector]
    code: 200
    input: [action, "reviewer_assignment_id?", "word_count?", "revision_reason_code?"]
    output: Declaration
    side_effects:
      - "SUBMIT_FOR_REVIEW requires the acting X-User-ID to be the preparer assignment's representative and requires either language_code == Client.preferred_language_code or a COMPLETED DECLARATION_READBACK InterpretationSession of this matter in the client's language, else ERR_READBACK_NOT_COMPLETED"
      - "SUBMIT_FOR_REVIEW binds readback_session_id to the qualifying session with the latest scheduled_start_utc (tie-break created_at ASC) and sets readback_completed = true"
      - "REQUEST_REVISION requires revision_reason_code from a SupervisingAttorney actor and increments revision_round"
      - "RESUME_DRAFT requires the preparer as actor and a word_count in the payload, and clears revision_reason_code"
      - "CERTIFY requires reviewer_assignment_id pointing at an ACTIVE assignment on the same matter whose representative is BOTH different from the preparer's representative AND a STAFF_ATTORNEY with authorization_status == 'AUTHORIZED_ATTORNEY', else ERR_SEGREGATION_OF_DUTIES"
      - "CERTIFY additionally requires readback_completed == true whenever Client.interpreter_required == true, else ERR_READBACK_NOT_COMPLETED, and requires that no EvidenceItem of the matter is REJECTED with disposition_reason_code == 'INCONSISTENT_WITH_DECLARATION'"
      - "CERTIFY sets certified_at_utc and is the precondition for the matter's EVIDENCE_GATHERING -> READY_TO_FILE step"
      - "WITHDRAW is legal from DRAFT, IN_REVIEW and REVISION_REQUESTED, clears readback_session_id and readback_completed, and is terminal"
      - "increments Declaration.version by 1, and on CERTIFY also CaseMatter.version"

  # --- InterpretationSession ------------------------------------------------
  - method: POST
    path: "/interpretation-sessions"
    description: "Schedules an interpretation session for a matter in the client's language, for intake, evidence review, declaration read-back, counseling or a hearing."
    roles: [CaseRepresentative, SupervisingAttorney, ProgramDirector]
    code: 201
    input: [matter_id, language_code, interpreter_source, purpose, scheduled_start_utc, scheduled_end_utc, "interpreter_representative_id?"]
    output: InterpretationSession
    side_effects:
      - "sets status = 'SCHEDULED', actual_minutes = null, billed_minutes = null, billable_cents = 0"
      - "requires interpreter_representative_id when interpreter_source IN {STAFF, VOLUNTEER} and requires it to be null when interpreter_source IN {CONTRACT, TELEPHONIC}, else ERR_INTERPRETER_SOURCE_MISMATCH"
      - "requires the named interpreter's languages to contain language_code, else ERR_INTERPRETER_LANGUAGE_MISMATCH"
      - "rejects scheduled_end_utc at or before scheduled_start_utc with ERR_VALIDATION"

  - method: GET
    path: "/interpretation-sessions"
    description: "Lists interpretation sessions, filterable by every foreign key the entity carries."
    roles: [ProgramDirector, SupervisingAttorney, CaseRepresentative, GrantAnalyst]
    code: 200
    input: ["matter_id?", "interpreter_representative_id?", "purpose?", "status?", "language_code?", "limit?", "offset?"]
    output: InterpretationSession[]
    side_effects: []

  - method: POST
    path: "/interpretation-sessions/{session_id}/transition"
    description: "Closes out an interpretation session. Actions: COMPLETE, MARK_NO_SHOW, CANCEL. All three are terminal, and they differ in the clock window they require."
    roles: [CaseRepresentative, SupervisingAttorney, ProgramDirector]
    code: 200
    input: [action, "actual_minutes?", "closure_reason_code?"]
    output: InterpretationSession
    side_effects:
      - "COMPLETE requires actual_minutes >= 1 and the logical clock at or after scheduled_start_utc; it computes billed_minutes and billable_cents via calculations.interpretation_cost_rollup, rounding PER SESSION"
      - "COMPLETE re-rolls CaseMatter.interpretation_cost_cents as the exact integer sum of the already-rounded billable_cents of the matter's COMPLETED sessions — summing unrounded amounts and rounding once at the end gives a different total"
      - "COMPLETE of a DECLARATION_READBACK session sets readback_session_id and readback_completed = true on every IN_REVIEW Declaration of the matter sharing its language_code"
      - "MARK_NO_SHOW requires the logical clock at or after scheduled_end_utc; CANCEL requires the logical clock strictly before scheduled_start_utc — so a session inside its own window can be COMPLETED but neither no-showed nor cancelled"
      - "MARK_NO_SHOW and CANCEL set billed_minutes = 0 and billable_cents = 0 and leave CaseMatter.interpretation_cost_cents unchanged"
      - "CANCEL also clears readback_session_id and sets readback_completed = false on every Declaration that had bound this session, which can retroactively block a CERTIFY that was previously reachable"
      - "increments InterpretationSession.version, and where mutated CaseMatter.version and each Declaration.version, by 1 each"

  # --- CalendarEvent --------------------------------------------------------
  - method: POST
    path: "/calendar-events"
    description: "Books a hearing, biometrics appointment, asylum interview, facility visit or filing deadline against a matter, running the three-geometry conflict scan."
    roles: [CaseRepresentative, SupervisingAttorney, ProgramDirector]
    code: 201
    input: [matter_id, event_type, starts_at_utc, ends_at_utc, location_code, "assigned_representative_id?", "facility_id?", "client_conflict_waived?"]
    output: CalendarEvent
    side_effects:
      - "runs calculations.calendar_conflict_scan in the normative order representative -> client -> facility, raising ERR_REPRESENTATIVE_CALENDAR_CONFLICT, ERR_CLIENT_CALENDAR_CONFLICT or ERR_FACILITY_VISIT_SLOTS_EXHAUSTED at the FIRST geometry that trips, so a request violating two geometries always reports the representative one"
      - "sets travel_buffer_minutes from BUFFER_BY_EVENT_TYPE, status = 'SCHEDULED', reschedule_count = 0, coverage_gap_flag = false, continued_from_event_id = null"
      - "a FACILITY_VISIT requires facility_id and must start at least DetentionFacility.visit_lead_time_hours after the logical clock, else ERR_FACILITY_LEAD_TIME_NOT_MET; a start exactly at the lead-time boundary is accepted"
      - "when DetentionFacility.access_credential_required is true, the assigned representative's facility_access_credential_expires_on must be non-null and at or after the event's UTC calendar date, else ERR_FACILITY_CREDENTIAL_EXPIRED"
      - "a FILING_DEADLINE event is exempt from the client geometry entirely and carries a zero travel buffer, so it can share a window with a hearing for the same client"

  - method: GET
    path: "/calendar-events"
    description: "Lists calendar events, filterable by every foreign key the entity carries including the self-referential continuance chain. This is the only discovery channel for a CONTINUE successor and for the FILING_DEADLINE event minted by the RFE transition."
    roles: [ProgramDirector, SupervisingAttorney, CaseRepresentative, ClientPortalUser]
    code: 200
    input: ["matter_id?", "facility_id?", "assigned_representative_id?", "continued_from_event_id?", "event_type?", "status?", "coverage_gap_flag?", "limit?", "offset?"]
    output: CalendarEvent[]
    side_effects: []

  - method: POST
    path: "/calendar-events/{event_id}/reschedule"
    description: "Moves a SCHEDULED event to a new window, re-running the full conflict scan against the new interval. A CONFIRMED event must be transitioned rather than rescheduled."
    roles: [CaseRepresentative, SupervisingAttorney, ProgramDirector]
    code: 200
    input: [starts_at_utc, ends_at_utc, "location_code?", "assigned_representative_id?", "client_conflict_waived?"]
    output: CalendarEvent
    side_effects:
      - "requires CalendarEvent.status == 'SCHEDULED', else ERR_INVALID_STATE_TRANSITION"
      - "re-runs calculations.calendar_conflict_scan with this event's own row excluded from every geometry, so an event may always be moved onto a window that overlaps only itself"
      - "re-derives travel_buffer_minutes and re-applies the FACILITY_VISIT lead-time and credential checks against the new interval"
      - "increments reschedule_count by 1 and rejects once reschedule_count would exceed MAX_RESCHEDULES_PER_EVENT with ERR_RESCHEDULE_LIMIT_REACHED"
      - "increments CalendarEvent.version by 1"

  - method: POST
    path: "/calendar-events/{event_id}/transition"
    description: "Drives the calendar event lifecycle. Actions: CONFIRM, COMPLETE, MARK_MISSED, CONTINUE, CANCEL."
    roles: [CaseRepresentative, SupervisingAttorney, ProgramDirector]
    code: 200
    input: [action, "successor_starts_at_utc?", "successor_ends_at_utc?", "reason_code?"]
    output: CalendarEvent
    side_effects:
      - "CONFIRM requires a non-null assigned_representative_id whose authorization_status is NOT IN {AUTHORIZATION_SUSPENDED, UNAUTHORIZED}, plus a valid facility credential for a FACILITY_VISIT"
      - "COMPLETE and MARK_MISSED both require the logical clock at or after ends_at_utc; MARK_MISSED on a MASTER_CALENDAR_HEARING or INDIVIDUAL_HEARING additionally sets CaseMatter.coverage_gap_flag = true"
      - "CONTINUE is legal only for MASTER_CALENDAR_HEARING, INDIVIDUAL_HEARING and ASYLUM_INTERVIEW, requires successor_starts_at_utc strictly after this event's ends_at_utc, and CREATES a successor CalendarEvent with continued_from_event_id set to this row, inheriting matter_id, facility_id, assigned_representative_id, event_type, location_code and client_conflict_waived at status 'SCHEDULED' and version 1"
      - "the CONTINUE successor is validated against the full three-geometry conflict scan and is discoverable only through GET /calendar-events filtered by continued_from_event_id, because the response returns the predecessor"
      - "CANCEL is legal from SCHEDULED and CONFIRMED; a cancelled FACILITY_VISIT releases its per-date facility slot, so a previously rejected same-date visit becomes bookable"
      - "CONTINUED, COMPLETED, MISSED and CANCELLED events all stop occupying representative and client intervals"
      - "increments CalendarEvent.version by 1, plus CaseMatter.version when the matter was flagged"

  # --- InformedDecision -----------------------------------------------------
  - method: POST
    path: "/informed-decisions"
    description: "Records counseling about risk, alternatives and likely outcome, in the language the counseling actually occurred in. Optimistically concurrency-controlled on the parent CaseMatter."
    roles: [CaseRepresentative, SupervisingAttorney, ProgramDirector]
    code: 201
    input: [matter_id, counseled_by_assignment_id, decision_type, risks_disclosed, alternatives_disclosed, counseling_language_code, expected_matter_version, "readback_session_id?"]
    output: InformedDecision
    side_effects:
      - "rejects with ERR_STALE_MATTER_VERSION / 412 when expected_matter_version != CaseMatter.version"
      - "increments CaseMatter.version by 1 on success"
      - "requires at least one CERTIFIED Declaration on the matter, else ERR_DECLARATION_NOT_CERTIFIED"
      - "rejects empty risks_disclosed or empty alternatives_disclosed, and rejects Client.confidentiality_consent_scope == 'NONE', with ERR_CONSENT_SCOPE_INSUFFICIENT"
      - "sets language_match_verified = (counseling_language_code == Client.preferred_language_code); when false a readback_session_id naming a COMPLETED session of this matter in the client's language is required and sets language_match_verified = true, else ERR_COUNSELING_LANGUAGE_UNVERIFIED"
      - "sets status = 'PENDING' and superseded_by_decision_id = null — a decision is NOT documented until the client acknowledges it"
      - "SUPERSEDES the existing DOCUMENTED decision of the same matter_id and decision_type, setting that row's superseded_by_decision_id to this new row and moving it to SUPERSEDED"

  - method: GET
    path: "/informed-decisions"
    description: "Lists informed decisions, filterable by every foreign key the entity carries including the self-referential supersession link."
    roles: [ProgramDirector, SupervisingAttorney, CaseRepresentative, ClientPortalUser]
    code: 200
    input: ["matter_id?", "counseled_by_assignment_id?", "readback_session_id?", "superseded_by_decision_id?", "decision_type?", "status?", "limit?", "offset?"]
    output: InformedDecision[]
    side_effects: []

  - method: POST
    path: "/informed-decisions/{decision_id}/transition"
    description: "Drives the informed-decision lifecycle. Actions: ACKNOWLEDGE, REVOKE. ACKNOWLEDGE is the client's own act and is what turns counseling into the DOCUMENTED record that filing depends on."
    roles: [ClientPortalUser, SupervisingAttorney, ProgramDirector]
    code: 200
    input: [action, "revocation_reason_code?"]
    output: InformedDecision
    side_effects:
      - "ACKNOWLEDGE is available only to a ClientPortalUser whose X-User-ID equals the matter's client_id, requires language_match_verified == true and a matter IN {STAFFED, SUPERVISED_STAFFED}, and sets acknowledged_at_utc = logical clock"
      - "ACKNOWLEDGE moving a FILE_AFFIRMATIVE or PURSUE_RELIEF_IN_COURT decision to DOCUMENTED is the precondition for the matter's READY_TO_FILE -> FILED step"
      - "REVOKE is available to a SupervisingAttorney, requires revocation_reason_code, and is rejected when the matter is already FILED and the decision_type IN {FILE_AFFIRMATIVE, PURSUE_RELIEF_IN_COURT}"
      - "increments InformedDecision.version by 1"

  # --- GrantReport ----------------------------------------------------------
  - method: POST
    path: "/grant-reports"
    description: "Opens a grant report draft for a funder code, a reporting period and a disclosure level."
    roles: [GrantAnalyst, ProgramDirector]
    code: 201
    input: [cycle_id, grant_code, period_start_date, period_end_date, disclosure_level]
    output: GrantReport
    side_effects:
      - "sets status = 'DRAFT', amendment_round = 0, outcomes_summary = {} and every count and money field to 0"
      - "rejects period_start_date > period_end_date, or a period outside the cycle's own [period_start_date, period_end_date] window, with ERR_REPORT_PERIOD_INVALID; a one-day period where start equals end is legal"

  - method: GET
    path: "/grant-reports"
    description: "Lists grant reports."
    roles: [GrantAnalyst, ProgramDirector]
    code: 200
    input: ["cycle_id?", "grant_code?", "disclosure_level?", "status?", "limit?", "offset?"]
    output: GrantReport[]
    side_effects: []

  - method: GET
    path: "/grant-reports/{report_id}"
    description: "Reads one grant report with its case counts, outcome histogram, suppression counts and the money fields asserted by calculations.invariant_grant_allocation_conservation."
    roles: [GrantAnalyst, ProgramDirector]
    code: 200
    input: []
    output: GrantReport
    side_effects: []

  - method: POST
    path: "/grant-reports/{report_id}/transition"
    description: "Drives the grant report lifecycle. Actions: GENERATE, SUBMIT, AMEND. GENERATE is legal from both DRAFT and AMENDED, closing the GENERATED -> SUBMITTED -> AMENDED -> GENERATED cycle."
    roles: [GrantAnalyst, ProgramDirector]
    code: 200
    input: [action, "amendment_reason_code?"]
    output: GrantReport
    side_effects:
      - "GENERATE runs calculations.grant_confidentiality_partition to fix cases_served_count, outcomes_summary, consent_verified_count and suppressed_case_count over a period window that is INCLUSIVE at both ends, excluding WITHDRAWN_FROM matters entirely"
      - "GENERATE then runs calculations.grant_reimbursement_rollup, selecting the surcharge tier from base_reimbursable_cents ONLY and allocating total_reimbursable_cents across the line set by largest remainder with a created_at ASC tie-break"
      - "GENERATE under disclosure_level == 'IDENTIFIED_WITH_CONSENT' rejects with ERR_CONSENT_SCOPE_INSUFFICIENT unless every reported client has confidentiality_consent_scope == 'FUNDER_IDENTIFIED'"
      - "GENERATE over an empty line set sets every count and money field to 0 and MUST NOT raise"
      - "SUBMIT requires allocated_line_total_cents == total_reimbursable_cents and, under IDENTIFIED_WITH_CONSENT, suppressed_case_count == 0; it sets submitted_at_utc"
      - "AMEND increments amendment_round by 1 and clears submitted_at_utc; a re-GENERATE over an unchanged line set reproduces byte-identical money fields, because the largest-remainder pass is deterministic"
      - "increments GrantReport.version by 1"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# Grouped auth -> not-found -> state -> business-safety -> business-fiscal ->
# concurrency -> invariant. Every id below is raised by at least one §1.5
# endpoint and appears in at least one §1.4 rule or §1.2 precondition.
# ---------------------------------------------------------------------------
errors:
  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "No actor role header, or a role name outside the §1.7 matrix."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The actor's role is not listed in the called endpoint's roles."
  - id: ERR_ACTOR_NOT_ON_CASE
    http: 403
    condition: "An entity_backed actor acted outside its own rows: a CaseRepresentative with no PROPOSED, ACTIVE or SUSPENDED assignment on the matter, or a ClientPortalUser whose X-User-ID is not the matter's or screening's client_id."
  - id: ERR_REPRESENTATIVE_INACTIVE
    http: 403
    condition: "The acting Representative's status is SUSPENDED or SEPARATED, so it retains its role name but no write authority."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The same identity attempted both halves of a two-person control: deciding an intake it screened, approving or revoking its own accreditation, or certifying a declaration it prepared."

  # --- not found ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A uuid path segment does not resolve to a row of the expected entity and no entity-specific 404 applies."
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client_id does not resolve to a Client."
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "cycle_id does not resolve to a ProgramCapacityCycle."
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "A non-null facility_id does not resolve to a DetentionFacility."
  - id: ERR_RECOGNITION_NOT_FOUND
    http: 404
    condition: "recognition_id does not resolve to an OrganizationRecognition, or no recognition row exists when a non-attorney representative needs one."
  - id: ERR_REPRESENTATIVE_NOT_FOUND
    http: 404
    condition: "representative_id, interpreter_representative_id or assigned_representative_id does not resolve to a Representative."
  - id: ERR_MATTER_NOT_FOUND
    http: 404
    condition: "matter_id does not resolve to a CaseMatter."
  - id: ERR_SUPERVISION_LINK_NOT_FOUND
    http: 404
    condition: "A supplied supervision_link_id does not resolve to a CaseAssignment row."

  # --- shape ---
  - id: ERR_VALIDATION
    http: 422
    condition: "A required body field is absent or null, an enum value is outside its declared set, a numeric field violates its declared bound (weight_points <= 0, reserved_detained_slots > total_case_slots), or an interval has ends_at_utc at or before starts_at_utc."

  # --- state ---
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The (from_state, action) pair does not appear in the entity's §1.2 transition table — including a renew past expiry_date, a reschedule of a CONFIRMED event, a CANCEL after scheduled_start_utc, a COMPLETE before scheduled_start_utc, and an intake withdrawal whose matter is already FILED, DECIDED or APPEALED."
  - id: ERR_MATTER_CLOSED
    http: 409
    condition: "The target CaseMatter has representation_status WITHDRAWN_FROM, so no child row may be created and no hours may be logged against it."
  - id: ERR_INTAKE_NOT_ACCEPTED
    http: 409
    condition: "An operation required an IntakeScreening in ACCEPTED but found SCREENING, DRAFT, SCREENED, WAITLISTED, DECLINED, REFERRED_OUT, WAITLIST_EXPIRED or WITHDRAWN."
  - id: ERR_ASSIGNMENT_NOT_ACTIVE
    http: 409
    condition: "Hours were logged, supervision relinked, or a declaration attributed against a CaseAssignment whose status is not ACTIVE."
  - id: ERR_ASSIGNMENT_MATTER_MISMATCH
    http: 409
    condition: "A preparer_assignment_id, reviewer_assignment_id, counseled_by_assignment_id or supervision_link_id points at an assignment belonging to a different CaseMatter."
  - id: ERR_MATTER_NOT_READY
    http: 409
    condition: "The weighted readiness gate of a DETAINED matter failed (readiness_index_weighted < 0.7500), or a FILED transition was attempted from a filing_status other than READY_TO_FILE or RFE_PENDING."
  - id: ERR_BLOCKING_EVIDENCE_OUTSTANDING
    http: 409
    condition: "The strict-checklist gate of a NON-DETAINED matter failed: a REQUIRED EvidenceItem is outside {VERIFIED, WAIVED}, or some EvidenceItem is REJECTED. Also raised for RFE_PENDING -> FILED while evidence_blocking_count > 0."
  - id: ERR_RECOGNITION_NOT_ACTIVE
    http: 409
    condition: "OrganizationRecognition.status is LAPSED, WITHDRAWN or otherwise outside {ACTIVE, CONDITIONAL} while an accreditation is being filed, renewed or approved."
  - id: ERR_RECOGNITION_ALREADY_EXISTS
    http: 409
    condition: "A second OrganizationRecognition row with status != WITHDRAWN was requested."
  - id: ERR_ACCREDITATION_NOT_APPLICABLE
    http: 409
    condition: "An accreditation was filed for a Representative whose rep_type is STAFF_ATTORNEY."
  - id: ERR_DECLARATION_NOT_CERTIFIED
    http: 409
    condition: "An InformedDecision was recorded on a matter with no CERTIFIED Declaration."
  - id: ERR_READBACK_NOT_COMPLETED
    http: 409
    condition: "A declaration was submitted for review or certified without a COMPLETED DECLARATION_READBACK InterpretationSession in the client's preferred language while Client.interpreter_required is true."
  - id: ERR_REPORT_STATE_INVALID
    http: 409
    condition: "A GENERATE was attempted from a status other than DRAFT or AMENDED, a SUBMIT from a status other than GENERATED, or an AMEND from a status other than SUBMITTED."
  - id: ERR_REPORT_PERIOD_INVALID
    http: 422
    condition: "period_start_date > period_end_date, or the period falls outside the referenced cycle's own inclusive [period_start_date, period_end_date] window."
  - id: ERR_FACILITY_CHANGE_AFTER_FILING
    http: 409
    condition: "set-facility was called while filing_status is FILED or RFE_PENDING, which would retroactively move the expedited deadline of an already-filed matter."
  - id: ERR_DERIVATIVE_CLIENT_MISMATCH
    http: 422
    condition: "principal_matter_id names a matter belonging to a different Client than the derivative matter's own client_id."
  - id: ERR_LEAD_ALREADY_ASSIGNED
    http: 409
    condition: "A second LEAD assignment was created for a matter that already has one with status IN {PROPOSED, ACTIVE, SUSPENDED}."
  - id: ERR_LEAD_NOT_ASSIGNED
    http: 409
    condition: "A transition required exactly one ACTIVE LEAD assignment on the matter and found none."
  - id: ERR_RESCHEDULE_LIMIT_REACHED
    http: 409
    condition: "reschedule_count would exceed MAX_RESCHEDULES_PER_EVENT (3)."

  # --- business safety ---
  - id: ERR_NO_ELIGIBLE_SUPERVISOR
    http: 422
    condition: "calculations.supervisor_auto_selection produced an empty candidate pool for a representative with supervision_required == true — every SUPERVISOR assignment on the matter failed at least one clause (inactive, unauthorized, at supervisee cap, or lacking the client's language)."
  - id: ERR_SUPERVISION_LINK_INELIGIBLE
    http: 422
    condition: "An explicitly supplied supervision_link_id exists but fails the supervisor eligibility predicate, including the client-language clause."
  - id: ERR_SUPERVISEE_CAP_EXCEEDED
    http: 422
    condition: "The resolved supervisor's supervisee_count is already equal to its max_supervisees. Boundary: one below the cap succeeds and lands exactly on it."
  - id: ERR_CASELOAD_CAP_EXCEEDED
    http: 422
    condition: "The named representative's active_case_load is already equal to its max_case_load for a LEAD or CO_COUNSEL role, including on the SUSPENDED -> ACTIVE re-entry edge."
  - id: ERR_FORUM_NOT_AUTHORIZED
    http: 422
    condition: "The LEAD representative is neither an AUTHORIZED_ATTORNEY nor the holder of a FULL accreditation whose authorized_forums contains CaseMatter.forum. A PARTIAL accreditation never grants EOIR_IMMIGRATION_COURT or BIA."
  - id: ERR_FORUM_GRANT_EMPTY
    http: 422
    condition: "calculations.accreditation_forum_grant intersected requested_forums, the accreditation_type ceiling and the recognition's authorized_forums to the empty set."
  - id: ERR_REPRESENTATIVE_CALENDAR_CONFLICT
    http: 409
    condition: "Geometry A of calculations.calendar_conflict_scan tripped: the assigned representative's half-open buffered interval overlaps another SCHEDULED or CONFIRMED event. A start exactly at the buffered end does NOT conflict."
  - id: ERR_CLIENT_CALENDAR_CONFLICT
    http: 409
    condition: "Geometry B tripped: a fully closed interval of the same client, across all of that client's matters, overlaps. A start exactly at another event's end DOES conflict. FILING_DEADLINE events are exempt."
  - id: ERR_FACILITY_VISIT_SLOTS_EXHAUSTED
    http: 409
    condition: "Geometry C tripped: the facility already holds max_daily_visit_slots FACILITY_VISIT events on that UTC calendar date. With max_daily_visit_slots == 0 every visit is rejected."
  - id: ERR_FACILITY_LEAD_TIME_NOT_MET
    http: 422
    condition: "A FACILITY_VISIT starts less than DetentionFacility.visit_lead_time_hours after the logical clock. Exactly at the boundary is accepted."
  - id: ERR_FACILITY_CREDENTIAL_EXPIRED
    http: 422
    condition: "The facility requires an access credential and the assigned representative's facility_access_credential_expires_on is null or earlier than the event's UTC calendar date."
  - id: ERR_FACILITY_REQUIRED_FOR_DETAINED
    http: 422
    condition: "detained is true but facility_id is null on an intake screening or a set-facility call."
  - id: ERR_INTERPRETER_SOURCE_MISMATCH
    http: 422
    condition: "interpreter_representative_id was supplied for a CONTRACT or TELEPHONIC session, or omitted for a STAFF or VOLUNTEER session."
  - id: ERR_INTERPRETER_LANGUAGE_MISMATCH
    http: 422
    condition: "The named interpreter's languages array does not contain the session's language_code."
  - id: ERR_COUNSELING_LANGUAGE_UNVERIFIED
    http: 422
    condition: "counseling_language_code differs from Client.preferred_language_code and no COMPLETED interpretation session of this matter in the client's language was supplied."
  - id: ERR_CONSENT_SCOPE_INSUFFICIENT
    http: 422
    condition: "Client.confidentiality_consent_scope is NONE or below the level a disclosure requires: recording an informed decision, withdrawing representation without a DOCUMENTED WITHDRAW_CASE decision, or generating an IDENTIFIED_WITH_CONSENT report over clients who are not FUNDER_IDENTIFIED."

  # --- business fiscal ---
  - id: ERR_NO_SLOT_AVAILABLE
    http: 409
    condition: "calculations.capacity_slot_waterfall found no free pool. A non-detained acceptance can hit this while ProgramCapacityCycle.available_slot_count is still positive, because the remaining slots sit inside the reserved detained block."
  - id: ERR_CYCLE_CAPACITY_FROZEN
    http: 409
    condition: "The cycle's effective capacity_posture is FROZEN (utilization_ratio >= 0.9500 with no live override) and the request would consume a slot or activate an assignment. Exactly 0.9500 is FROZEN; 0.9499 is RESTRICTED."
  - id: ERR_INDIGENCY_CEILING_EXCEEDED
    http: 422
    condition: "Client.fpl_percent exceeds FPL_ELIGIBILITY_CEILING_PERCENT (200.00) and the case_type is not fee-exempt. Exactly 200.00 is inside the ceiling."
  - id: ERR_HOURS_OUT_OF_RANGE
    http: 422
    condition: "hours <= 0.00, hours > MAX_HOURS_PER_LOG_ENTRY (12.00), or hours_kind does not match the assignment's role_on_case. Exactly 12.00 is accepted."

  # --- concurrency (OCC) ---
  - id: ERR_STALE_MATTER_VERSION
    http: 412
    condition: "expected_matter_version does not equal the current CaseMatter.version on POST /case-assignments or POST /informed-decisions. The caller must refetch the matter and retry."
  - id: ERR_STALE_RECOGNITION_VERSION
    http: 412
    condition: "expected_recognition_version does not equal the current OrganizationRecognition.version on POST /accreditations/{accreditation_id}/renew."

  # --- invariant ---
  - id: ERR_INVARIANT_VIOLATION
    http: 500
    condition: "A post-write assertion in calculations.invariant_capacity_slot_conservation, invariant_active_caseload_conservation or invariant_grant_allocation_conservation failed. The transaction is rolled back and no partial cascade is persisted."

# ---------------------------------------------------------------------------
# §1.7 RBAC Permission Matrix
# Six roles. Segregation of duties is structural: the screener who screens an
# intake may not decide it, the supervisor who certifies a declaration may not
# have prepared it, and no representative may approve or revoke its own
# accreditation. entity_backed roles carry X-User-ID resolving to a row of the
# named entity and may only touch rows reachable from that row.
# ---------------------------------------------------------------------------
roles:
  - name: ProgramDirector
    description: >-
      Program administration. Owns the organization's recognition record, the
      capacity cycles that gate acceptance, the detention-facility registry,
      the representative roster, and the accreditation lifecycle. Holds the
      only two levers that can loosen a capacity freeze (posture-override) or
      advance the program's system clock of record (checkpoint). Not backed by
      a Representative row, so it never appears as an assignee, an interpreter,
      a declaration preparer or a supervisor, and therefore can never be the
      counterparty in a segregation-of-duties pair.
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /capacity-cycles"
      - "POST /capacity-cycles/{cycle_id}/posture-override"
      - "POST /capacity-cycles/{cycle_id}/checkpoint"
      - "POST /detention-facilities"
      - "POST /organization-recognitions"
      - "POST /organization-recognitions/{recognition_id}/transition"
      - "POST /representatives"
      - "PATCH /representatives/{representative_id}"
      - "POST /accreditations"
      - "POST /accreditations/{accreditation_id}/transition"
      - "POST /accreditations/{accreditation_id}/renew"
      - "POST /case-matters/{matter_id}/set-facility"
      - "POST /case-matters/{matter_id}/withdraw-representation"
    shared_operations:
      - "POST /clients and PATCH /clients/{client_id} (with IntakeScreener)"
      - "POST /case-assignments and POST /case-assignments/{assignment_id}/transition (with SupervisingAttorney)"
      - "POST /case-assignments/{assignment_id}/relink-supervision (with SupervisingAttorney)"
      - "POST /intake-screenings/{intake_id}/decide and /withdraw (with IntakeScreener)"
      - "POST /grant-reports and POST /grant-reports/{report_id}/transition (with GrantAnalyst)"
      - "All GET list and GET single reads on every collection (with all roles, unfiltered)"

  - name: IntakeScreener
    description: >-
      Front-door staff. Registers clients, runs the legal-eligibility and
      urgency screen, and records the capacity-based acceptance decision that
      mints a CaseMatter. Backed by a Representative row so that the identity
      recorded in IntakeScreening.screened_by_representative_id can be compared
      against the decider: a screener may run /screen or /decide but never both
      on the same intake row.
    identity: "entity_backed:Representative"
    exclusive_operations:
      - "POST /intake-screenings"
      - "POST /intake-screenings/{intake_id}/screen"
    shared_operations:
      - "POST /clients and PATCH /clients/{client_id} (with ProgramDirector)"
      - "POST /intake-screenings/{intake_id}/decide and /withdraw (with ProgramDirector)"
      - "POST /interpretation-sessions and its /transition (with SupervisingAttorney, CaseRepresentative)"
      - "GET /clients, /intake-screenings, /capacity-cycles, /detention-facilities (with all roles)"

  - name: SupervisingAttorney
    description: >-
      Authorized attorney who supervises accredited representatives and pro
      bono volunteers. Staffs matters, resolves supervision links, certifies
      declarations, and countersigns the informed-decision record. May not
      certify a declaration whose preparer_assignment_id resolves to its own
      Representative row, and may not act on a matter where it holds no
      assignment.
    identity: "entity_backed:Representative"
    exclusive_operations:
      - "POST /declarations/{declaration_id}/transition with action == 'CERTIFY'"
      - "POST /calendar-events/{event_id}/transition with action == 'CONTINUE'"
    shared_operations:
      - "POST /case-assignments, its /transition and /relink-supervision (with ProgramDirector)"
      - "POST /case-matters/{matter_id}/advance-filing (with CaseRepresentative)"
      - "POST /evidence-items and its /transition (with CaseRepresentative)"
      - "POST /declarations and its non-CERTIFY transitions (with CaseRepresentative)"
      - "POST /interpretation-sessions and its /transition (with IntakeScreener, CaseRepresentative)"
      - "POST /calendar-events, /reschedule and its other transitions (with CaseRepresentative)"
      - "POST /informed-decisions (with CaseRepresentative)"
      - "POST /case-assignments/{assignment_id}/log-hours (with CaseRepresentative)"
      - "All GET reads (with all roles)"

  - name: CaseRepresentative
    description: >-
      Any representative carrying a matter: staff attorney, accredited
      representative, or pro bono volunteer. Does the day-to-day work —
      evidence, declarations, interpretation, calendar, filing advancement, and
      hours. Scoped to matters on which it holds a PROPOSED, ACTIVE or
      SUSPENDED CaseAssignment; anything else is ERR_ACTOR_NOT_ON_CASE. Cannot
      certify its own declaration, cannot staff itself onto a matter, and
      cannot lift a capacity freeze.
    identity: "entity_backed:Representative"
    exclusive_operations: []
    shared_operations:
      - "POST /case-matters/{matter_id}/advance-filing (with SupervisingAttorney)"
      - "POST /evidence-items and its /transition (with SupervisingAttorney)"
      - "POST /declarations and its non-CERTIFY transitions (with SupervisingAttorney)"
      - "POST /interpretation-sessions and its /transition (with IntakeScreener, SupervisingAttorney)"
      - "POST /calendar-events, /reschedule and its non-CONTINUE transitions (with SupervisingAttorney)"
      - "POST /informed-decisions (with SupervisingAttorney)"
      - "POST /case-assignments/{assignment_id}/log-hours (with SupervisingAttorney)"
      - "GET reads scoped to its own matters and their children (with all roles)"

  - name: GrantAnalyst
    description: >-
      Funder-reporting staff. Builds the aggregate case-served and outcome
      report and the reimbursement rollup under a confidentiality partition,
      then submits and amends it. Read-only on case substance: it may never
      create, transition or staff a matter, and its client-level reads honour
      the report's disclosure_level partition rather than returning raw
      identifiers.
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /grant-reports and POST /grant-reports/{report_id}/transition (with ProgramDirector)"
      - "GET /grant-reports, /case-matters, /case-assignments, /capacity-cycles, /clients (with all roles)"

  - name: ClientPortalUser
    description: >-
      The client, or an authorized family member acting for a detained client.
      Backed by a Client row: every read is filtered to matters whose client_id
      equals its own X-User-ID, and its single write is the acknowledgement half
      of the informed-decision record — the client acknowledges, the
      representative documents. Never sees another client's row, never sees
      internal capacity or grant aggregates.
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /informed-decisions/{decision_id}/transition with action == 'ACKNOWLEDGE'"
    shared_operations:
      - "GET /clients/{client_id} for its own row only (with all roles)"
      - "GET /case-matters, /calendar-events, /informed-decisions, /interpretation-sessions filtered to its own client_id (with all roles)"
