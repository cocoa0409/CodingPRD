      - name: marketing_budget_ceiling_error
        claim_type: error_triggerable
        grounds:
          - errors.ERR_MARKETING_BUDGET_EXCEEDED
          - validations[priority 12 ERR_MARKETING_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          The fiscal ceiling on marketing: approving or settling a spend that would push
          DistributionDeal.marketing_committed_cents above marketing_budget_cents must be a 422.
        excluded_because:
          difficulty_instance: spend_decide_state_beats_marketing_budget
          rationale: |
            §1.8 priority_pair_validation_conflict.spend_decide_state_beats_marketing_budget triggers
            this error id directly on the decide path (after separating it from the state 409) and the
            same §1.8 fixture walks the committed-total up to the budget, so the error is already
            reachable and its inclusive ceiling already pinned. §1.9 validations
            .every_priority_satisfied_lets_the_write_through additionally asserts the accepted case at
            exactly the ceiling.

  - section: rbac
    instances:
      - name: each_role_performs_its_own_exclusive_operations
        claim_type: role_exclusive_operations
        grounds:
          - rbac[LabelAdmin].exclusive_operations
          - rbac[DistributionPartner].exclusive_operations
          - rbac[RoyaltyAnalyst].exclusive_operations
          - rbac[BusinessAffairs].exclusive_operations
          - rbac[Artist].exclusive_operations
        distinguishing_aspect: |
          One end-to-end chain in which all five roles are load-bearing: LabelAdmin sets up and executes,
          DistributionPartner reports, RoyaltyAnalyst accepts and prepares, BusinessAffairs issues, and
          the Artist objects. Every hand-off is an operation exclusive to that role, so an implementation
          that collapses two roles into one cannot complete the chain, and one that accepts any role
          everywhere cannot be distinguished from a correct one without the paired denial instance.
        test_recipe:
          setup:
            - "an empty database at the 2026-08-01 clock"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4000, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 0, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000260", title: "Five Hands", planned_release_date: "2026-02-01", formats: ["DIGITAL"], advance_share_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-R1-0001" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /artist-agreements"
              payload: { artist_id: "${artist_id}", release_id: "${rel1_id}", royalty_rate_pct: 0.1000, escalated_royalty_rate_pct: 0.1000, advance_amount_cents: 0, recording_costs_cents: 0, recording_recoupable_pct: 0.0000, marketing_recoup_share_pct: 0.0000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { agr_id: $.data.id }
            - call: "POST /artist-agreements/${agr_id}/activate"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
          trigger:
            - call: "POST /dsp-revenue-reports"
              payload: { deal_id: "${deal_id}", dsp_code: "STRM", period_start: "2026-04-01", period_end: "2026-06-30" }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /dsp-revenue-reports/${rep_id}/lines"
              payload: { release_id: "${rel1_id}", territory_code: "US", tier: "PREMIUM", stream_count: 250000 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "POST /dsp-revenue-reports/${rep_id}/submit"
              payload: {}
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { rep_gross: $.data.gross_receipts_cents, rep_net: $.data.net_receipts_cents }
            - call: "GET /distribution-deals/${deal_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { deal_v: $.data.version }
            - call: "POST /dsp-revenue-reports/${rep_id}/accept"
              payload: { expected_deal_version: "${deal_v}" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { rep_status: $.data.status }
            - call: "POST /artist-statements"
              payload: { artist_agreement_id: "${agr_id}", period_start: "2026-04-01", period_end: "2026-06-30", basis_variant: "FINAL" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { stmt_id: $.data.id }
            - call: "POST /artist-statements/${stmt_id}/prepare"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { stmt_net: $.data.net_payable_cents, stmt_prep: $.data.prepared_by_user_id }
            - call: "POST /artist-statements/${stmt_id}/issue"
              payload: {}
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
              captures: { stmt_issuer: $.data.issued_by_user_id, stmt_deadline: $.data.objection_deadline }
            - call: "POST /artist-statements/${stmt_id}/object"
              payload: { objection_reason_code: "MISSING_REVENUE", objection_disputed_amount_cents: 1000, objection_narrative: "One territory looks under-reported." }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { stmt_status: $.data.status, stmt_filed: $.data.objection_filed_at }
          assert:
            - "${rep_gross} == 100000 == round_half_up(250000 * 4000 / 10000) and ${rep_net} == 85000 == 100000 - round_half_up(100000 * 0.1500)"
            - "${rep_status} == \"ACCEPTED\": only RoyaltyAnalyst can accept, and the report's own line now carries net_receipts_cents 85000"
            - "${stmt_net} == 8500 == round_half_up(85000 * 0.1000) with ${stmt_prep} == \"analyst-01\""
            - "${stmt_issuer} == \"biz-affairs-01\" != ${stmt_prep} and ${stmt_deadline} == \"2026-08-31T00:00:00.000Z\""
            - "${stmt_status} == \"OBJECTED\" with ${stmt_filed} == \"2026-08-01T00:00:00.000Z\" and objection_disputed_amount_cents 1000 <= net_payable 8500"
            - "every call in the chain used the single role that declares it exclusively; no step was reachable from two different roles"

      - name: cross_role_exclusive_operations_are_rejected
        claim_type: cross_role_denial
        grounds:
          - rbac[LabelAdmin].exclusive_operations
          - rbac[DistributionPartner].exclusive_operations
          - rbac[RoyaltyAnalyst].exclusive_operations
          - rbac[BusinessAffairs].exclusive_operations
          - rbac[Artist].exclusive_operations
          - validations[priority 2]
        distinguishing_aspect: |
          Every denial is issued against a path id that does not exist, so a 403 proves the role gate
          runs at priority 2 — BEFORE the priority-3 path lookup — and therefore leaks nothing about
          which ids are real. Nine pairings cover each role attempting another role's exclusive
          operation, including the two BusinessAffairs / RoyaltyAnalyst directions that a naive
          "back-office can do back-office work" implementation collapses.
        test_recipe:
          setup:
            - "no business fixture is needed, because the role gate precedes every lookup; the only setup call exists so that the two OCC payload values below are real server-observed versions rather than invented literals"
            - "both expected_*_version values carry that same captured version on purpose — the requests never reach the priority-7 OCC guard, so the value cannot influence the outcome and every one of them must still be a 403"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Gate Probe", legal_entity: "Gate Probe Ltd", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id, any_version: $.data.version }
          trigger:
            - call: "POST /artist-statements/00000000-0000-4000-8000-000000000000/issue"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { e_admin_issue: $.data.error_id }
            - call: "POST /marketing-spends/00000000-0000-4000-8000-000000000000/decide"
              payload: { decision: "APPROVE" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { e_analyst_decide: $.data.error_id }
            - call: "POST /artist-statements/00000000-0000-4000-8000-000000000000/prepare"
              payload: {}
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
              captures: { e_ba_prepare: $.data.error_id }
            - call: "POST /dsp-revenue-reports/00000000-0000-4000-8000-000000000000/accept"
              payload: { expected_deal_version: "${any_version}" }
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
              captures: { e_ba_accept: $.data.error_id }
            - call: "POST /artist-statements/00000000-0000-4000-8000-000000000000/finalize"
              payload: {}
              as: Artist
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { e_artist_finalize: $.data.error_id }
            - call: "POST /physical-runs/00000000-0000-4000-8000-000000000000/liquidate-reserve"
              payload: { expected_run_version: "${any_version}", liquidation_pct: 0.5000 }
              as: Artist
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { e_artist_liquidate: $.data.error_id }
            - call: "POST /distributors"
              payload: { name: "Rogue Setup", legal_entity: "Rogue Setup Ltd", default_returns_reserve_pct: 0.1000 }
              as: DistributionPartner
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { e_partner_create: $.data.error_id }
            - call: "POST /dsp-revenue-reports/00000000-0000-4000-8000-000000000000/submit"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { e_admin_submit: $.data.error_id }
            - call: "POST /artist-statements/00000000-0000-4000-8000-000000000000/object"
              payload: { objection_reason_code: "RATE_DISPUTE", objection_disputed_amount_cents: 1, objection_narrative: "Not my statement." }
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
              captures: { e_ba_object: $.data.error_id }
          assert:
            - "all nine responses are HTTP 403 with error_id \"ERR_ROLE_NOT_PERMITTED\": ${e_admin_issue}, ${e_analyst_decide}, ${e_ba_prepare}, ${e_ba_accept}, ${e_artist_finalize}, ${e_artist_liquidate}, ${e_partner_create}, ${e_admin_submit}, ${e_ba_object}"
            - "NONE of them is a 404, even though every path id is a well-formed UUID that does not exist: priority 2 precedes priority 3"
            - "the two OCC-carrying calls are 403 and never 412 or 400, even though ${any_version} is a genuine version of a completely unrelated Distributor row: priority 2 precedes priorities 5 and 7"
            - "no row was created by the DistributionPartner attempt at POST /distributors: the response carries no id, and the only readable distributor is still the Gate Probe fixture"

      - name: distribution_partner_cannot_ship_another_distributors_run
        claim_type: peer_roles
        grounds:
          - rbac[DistributionPartner].identity
          - validations[priority 4]
          - endpoints[POST /physical-runs/{id}/ship]
          - endpoints[POST /physical-runs/{id}/record-returns]
        distinguishing_aspect: |
          DistributionPartner is entity_backed:Distributor, so its scope is the run's OWN
          distributor_id — not merely "any distributor". Two partners hold the same role and the same
          endpoint permission, and the only difference is the run's distributor_id, so the denial cannot
          be produced by a role check. The record-returns path is checked as well because ownership must
          be re-evaluated per call and not cached from whoever shipped.
        test_recipe:
          setup:
            - "two Distributors A and B, one EXECUTED deal on A, one RELEASED cassette release and one MANUFACTURED run of 1000 units at 200 cents owned by A"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Harbourside Physical", legal_entity: "Harbourside Physical Ltd", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_a_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Kettle Row Distribution", legal_entity: "Kettle Row Distribution GmbH", default_returns_reserve_pct: 0.2000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_b_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_a_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 0, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000261", title: "Tape Only", planned_release_date: "2026-02-01", formats: ["CASSETTE"], advance_share_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-R3-0001" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /physical-runs"
              payload: { release_id: "${rel1_id}", distributor_id: "${dist_a_id}", units_planned: 1000, unit_manufacturing_cost_cents: 200, window_start: "2026-04-01", window_end: "2026-06-30" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { run_id: $.data.id }
            - call: "POST /physical-runs/${run_id}/manufacture"
              payload: { units_manufactured: 1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { run_v: $.data.version }
          trigger:
            - call: "POST /physical-runs/${run_id}/ship"
              payload: { units_shipped: 900, wholesale_unit_price_cents: 700 }
              as: DistributionPartner
              as_user_id: "${dist_b_id}"
              captures: { e_ship: $.data.error_id }
            - call: "POST /physical-runs/${run_id}/ship"
              payload: { units_shipped: 900, wholesale_unit_price_cents: 700 }
              as: DistributionPartner
              as_user_id: "${dist_a_id}"
              captures: { run_net: $.data.physical_net_receipts_cents, run_reserve: $.data.reserve_initial_cents }
            - call: "POST /physical-runs/${run_id}/record-returns"
              payload: { returned_units: 50 }
              as: DistributionPartner
              as_user_id: "${dist_b_id}"
              captures: { e_returns: $.data.error_id }
            - call: "POST /physical-runs/${run_id}/record-returns"
              payload: { returned_units: 50 }
              as: DistributionPartner
              as_user_id: "${dist_a_id}"
              captures: { run_returned: $.data.units_returned, run_net2: $.data.physical_net_receipts_cents }
            - call: "GET /physical-runs/${run_id}"
              payload: {}
              as: DistributionPartner
              as_user_id: "${dist_b_id}"
          assert:
            - "${e_ship} == \"ERR_NOT_RESOURCE_OWNER\" with HTTP 403 for partner B, whose role DOES permit POST /physical-runs/{id}/ship — only the run's distributor_id differs"
            - "the same body from partner A succeeds: ${run_net} == 430000 == 900 * 700 - 1000 * 200 and ${run_reserve} == 63000 == round_half_up(630000 * 0.1000) using A's default, never B's 0.2000"
            - "${e_returns} == \"ERR_NOT_RESOURCE_OWNER\" too: ownership is re-checked on record-returns and not inherited from the successful ship"
            - "partner A's identical return is accepted: ${run_returned} == 50 and ${run_net2} == 400000 == (900 - 50) * 700 - 200000"
            - "the run's version advanced by exactly 2 from ${run_v} across the four trigger calls: the two 403s wrote nothing"
            - "partner B CAN still read the run through the shared GET /physical-runs/{id}: the ownership scope constrains writes, not the shared reads"

