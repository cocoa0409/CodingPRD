  - rule_id: boundary_precision_check
    instances:
      - name: cottage_cap_admission_at_exactly_the_cap
        grounds:
          - calculations.cottage_cap_projection
          - validations[priority=45]
          - errors.ERR_COTTAGE_CAP_EXCEEDED
          - entities.Cook.fields.cap_status
        distinguishing_aspect: |
          A three-point boundary walk on `projected_cents <= cap` with a four-cent step, against a
          6001-cent cap: 5997 admits (four below), 6005 rejects (four over), and 6001 admits
          because equality is explicitly allowed. Any implementation using `<` instead of `<=`
          passes the first two points and fails the third. The instance also pins the second
          boundary in the same calculation: cap_status stays UNDER_CAP the whole time because
          nothing has been captured, so in-flight money must not classify the cook as CAP_REACHED.
        test_recipe:
          setup:
            - "StatePolicy NH exists with cottage_food_annual_cap_cents 6001."
            - "Cook Lena is ACTIVE and CLEAR in NH with ytd_cottage_revenue_cents 0 and weekly_capacity_meals 10."
            - "MenuItem BIG at 1999 cents and MenuItem TINY at 4 cents are both APPROVED."
            - "One OPEN ProductionWindow with capacity_meals 10; the clock is at the default 2026-08-01T00:00:00Z."
