      - name: reskilling_enrollment_gated_by_bench_spell_escalation_state
        grounds:
          - validations[priority=10]
          - errors[ERR_BENCH_SPELL_STATE_INVALID]
          - state_machines.BenchSpell.ESCALATED_L1_to_RESKILLING
          - entities.BenchSpell.fields.state
          - entities.ReskillingProgram.fields.seats_taken
          - endpoints[POST /reskilling-programs/{id}/enrollments]
        distinguishing_aspect: |
          Entity pair RESKILLINGPROGRAM ← BENCHSPELL: the enrolment request names only the
          consultant, yet it is refused while that consultant's open bench spell is still
          MONITORING and accepted after a bench-run escalates the SAME spell to ESCALATED_L1 —
          the gate is the state of a row the caller never mentions.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group with default level_targets (CONSULTANT L1 threshold 14 days), one CLOUD_ARCH skill."
            - "One CONSULTANT-level consultant, never staffed, so BenchSpell #1 is open in MONITORING with started_on 2026-08-03."
            - "One PLANNED ReskillingProgram on that skill, cohort 2026-09-01..2026-09-30, seat_capacity 2 (its status never blocks: PLANNED is admissible for enrolment)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c1_id: $.data.id }
            - call: "POST /reskilling-programs"
              payload: { skill_id: "${sk_id}", target_proficiency_level: 4, cohort_start_on: "2026-09-01", cohort_end_on: "2026-09-30", seat_capacity: 2 }
              as: ResourceManager
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /reskilling-programs/${rp_id}/enrollments"
              payload: { consultant_id: "${c1_id}" }
              as: ResourceManager
              captures: { err_spell: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T00:00:00Z" }
              as: ResourceManager
            - call: "POST /bench-runs"
              payload: {}
              as: ResourceManager
            - call: "POST /reskilling-programs/${rp_id}/enrollments"
              payload: { consultant_id: "${c1_id}" }
              as: ResourceManager
              captures: { bs_id: $.data.id, bs_state: $.data.state }
          assert:
            - "the first enrolment returned 409 with ${err_spell} == ERR_BENCH_SPELL_STATE_INVALID; ReskillingProgram.${rp_id}.seats_taken == 0 and status == PLANNED afterwards"
            - "the bench-run at 2026-08-17 moved the spell to ESCALATED_L1 with age_days == 14 and escalation_count == 1"
            - "the second enrolment returned 200 with ${bs_state} == RESKILLING for BenchSpell ${bs_id} — the same spell row the first attempt could not move"
            - "BenchSpell.${bs_id}.reskilling_program_id == ${rp_id} and investment_started_on == 2026-08-17"
            - "ReskillingProgram.${rp_id}.seats_taken == 1 and status is STILL PLANNED — enrolment does not start the cohort, only a bench-run on or after 2026-09-01 does"
            - "Consultant.${c1_id}.availability_status == RESKILLING"
            - "PracticeGroup.${pg_id}.bench_headcount == 1, own_bench_ratio == 1.0000 and posture == FROZEN both before and after the enrolment — bench_headcount counts RESKILLING, so the posture does not move"

  - rule_id: resource_temporal_overlap
