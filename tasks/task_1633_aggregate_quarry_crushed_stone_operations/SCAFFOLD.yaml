# =============================================================================
# SCAFFOLD.yaml — Aggregate Quarry & Crushed-Stone Operations
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Aggregate Quarry & Crushed-Stone Operations (Martin Marietta style quarry): pit/bench plan & drilling program, product gradation & stockpile inventory by spec, scale-house ticketing & royalty per ton, plant run-hour & crusher circuit yield, MSHA inspection & training record, reclamation bond & permit acreage, haul-truck queue & scale accuracy, freight-inclusive pricing zone

domain_name: aggregate-quarry-ops
api_prefix: ""   # flat API — no global prefix segment; every collection is top-level

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating     # site posture (MSHA/bond/permit) gates blasting, disturbance, and shipping
  secondary_archetype: quota_allocation        # stockpile tonnage reserved by confirmed orders, backorder sweep on production
  complexity_layers:
    - optimistic_concurrency                   # OCC on Stockpile / RoyaltyAgreement / SalesOrder versions
    - cascading_side_effects                   # citation->posture->bench->shotplan hold cascade; run->stockpile->order sweep
    - dual_variant_calculation                 # design-vs-reconciled blast tonnage; provisional-vs-final royalty
    - rate_threshold_triggers                  # royalty YTD tier, calibration tolerance, over-shipment tolerance
  entity_topology: flat                        # peer collections joined by FK references; no nested URL paths
  state_machine_shape: posture_driven          # QuarrySite.posture is derived from citations/bond and gates child ops
  relationship_patterns:
    - one_to_many                              # site->benches, inspection->citations, stockpile->gradation tests
    - self_referential                         # RoyaltyAgreement.supersedes_agreement_id amendment chain
    - cross_aggregate                          # ScaleTicket spans SalesOrder + Stockpile + Scale + TruckQueueEntry
  role_model: segregation_of_duties            # submitter!=approver, reporter!=confirmer, generator!=issuer (by X-User-ID)
  consistency_model: immediate                 # every mutation (incl. cascades) visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (20 entities, flat topology)
# =============================================================================
entities:
  - name: QuarrySite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Quarry site name" }
      - { name: permitted_acres, type: number, source: input, description: "Total acres authorized by the mining permit; disturbance may not exceed this", constraints: "> 0" }
      - { name: bond_rate_per_acre_usd, type: number, source: input, description: "Reclamation bond rate per disturbed acre set by the permit", constraints: "> 0" }
      - { name: disturbed_acres, type: number, source: computed, description: "Sum of Bench.acreage for benches of this site with status in {RELEASED, ON_HOLD, MINED_OUT, RECLAMATION_IN_PROGRESS}; PLANNED and RECLAIMED excluded" }
      - { name: bond_required_usd, type: number, source: computed, description: "Phased bond requirement: acres in {RELEASED, ON_HOLD, MINED_OUT} x bond_rate_per_acre_usd x 1.0 plus acres in RECLAMATION_IN_PROGRESS x rate x 0.5" }
      - { name: bond_posted_usd, type: number, source: computed, description: "Sum over ReclamationBond of (amount_usd - released_usd) for bonds with status in {POSTED, PARTIALLY_RELEASED}" }
      - { name: bond_adequacy, type: enum, source: computed, description: "ADEQUATE iff bond_posted_usd >= bond_required_usd, else DEFICIENT", constraints: "ADEQUATE | DEFICIENT" }
      - { name: posture, type: enum, source: computed, description: "OPERATING | RESTRICTED | SUSPENDED — derived per calculations.posture_derivation; recomputed synchronously on citation create/abate/vacate, bond create/release, bench transitions, and POST /sites/{id}/recompute-posture", constraints: "OPERATING | RESTRICTED | SUSPENDED" }

  - name: Bench
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> QuarrySite.id; owning site" }
      - { name: bench_label, type: string, source: input, description: "Human label, e.g. 'BENCH-1400'" }
      - { name: elevation_ft, type: number, source: input, description: "Bench floor elevation; release enforces top-down ordering (higher benches must be mined out first)" }
      - { name: acreage, type: number, source: input, description: "Disturbed acres this bench represents once released", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "PLANNED | RELEASED | ON_HOLD | MINED_OUT | RECLAMATION_IN_PROGRESS | RECLAIMED", constraints: "enum set as listed" }
      - { name: hold_reason, type: string, source: system, description: "Reason recorded when benched is held; 'MSHA_SUSPENSION' marks auto-holds from the posture cascade (auto-resumed on posture recovery), other values are manual holds resumed only via /resume", default: null }

  - name: ShotPlan
    parent: null
    common_fields: true
    fields:
      - { name: bench_id, type: string, source: input, description: "FK -> Bench.id; bench being drilled/shot" }
      - { name: hole_count, type: integer, source: input, description: "Designed number of blast holes", constraints: ">= 1" }
      - { name: burden_ft, type: number, source: input, description: "Burden per hole in feet", constraints: "> 0" }
      - { name: spacing_ft, type: number, source: input, description: "Spacing between holes in feet", constraints: "> 0" }
      - { name: hole_depth_ft, type: number, source: input, description: "Design hole depth in feet", constraints: "> 0" }
      - { name: explosive_per_hole_lbs, type: number, source: input, description: "Design explosive load per hole", constraints: "> 0" }
      - { name: drilled_hole_count, type: integer, source: system, description: "Holes reported drilled; set by complete-drilling, reset to 0 by redrill", default: 0 }
      - { name: loaded_explosive_lbs, type: number, source: system, description: "Actual explosive loaded; set by /load payload", default: null }
      - { name: estimated_tons, type: number, source: computed, description: "Design blast tonnage per calculations.blast_tonnage_estimate (1 decimal, round_half_up)" }
      - { name: powder_factor, type: number, source: computed, description: "loaded_explosive_lbs (or design hole_count x explosive_per_hole_lbs before load) / estimated_tons, 2 decimals round_half_up" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DRILLING | DRILLED | LOADED | FIRED | ON_HOLD | CANCELLED", constraints: "enum set as listed" }
      - { name: hold_return_state, type: enum, source: system, description: "State captured when the posture cascade auto-holds this plan; auto-resume returns to it", default: null, constraints: "APPROVED | DRILLING | DRILLED | LOADED | null" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at /submit; segregation-of-duties reference for /approve" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID captured at /approve", default: null }
      - { name: fired_at, type: datetime, source: system, description: "Logical-clock timestamp at /fire", default: null }

  - name: Muckpile
    parent: null
    common_fields: true
    fields:
      - { name: shot_plan_id, type: string, source: system, description: "FK -> ShotPlan.id; created 1:1 by the FIRED transition" }
      - { name: estimated_tons, type: number, source: computed, description: "Copied from ShotPlan.estimated_tons at creation" }
      - { name: actual_fed_tons, type: number, source: computed, description: "Sum of input_tons over PlantRuns (production_status in {COMPLETED, RECONCILED-pending-void excluded are VOIDED/CANCELLED}) drawing this muckpile; reconciled-actual variant of blast tonnage", default: 0 }
      - { name: remaining_tons, type: number, source: computed, description: "estimated_tons - actual_fed_tons; reaching exactly 0 auto-transitions status to DEPLETED", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | DEPLETED; DEPLETED auto at remaining_tons == 0, auto-reopens to OPEN if a run void restores tonnage", constraints: "OPEN | DEPLETED" }

  - name: ProductSpec
    parent: null
    common_fields: true
    fields:
      - { name: spec_code, type: string, source: input, description: "Gradation spec code, e.g. 'ASTM-57'", constraints: "unique across all specs" }
      - { name: category, type: enum, source: input, description: "COARSE | FINE | RIPRAP; RIPRAP is exempt from fuel surcharge in delivered pricing", constraints: "COARSE | FINE | RIPRAP" }
      - { name: gradation_bands, type: array, source: input, description: "Array of {sieve: string, min_pct: number, max_pct: number}; inclusive pass band per sieve", constraints: "at least one band; min_pct <= max_pct" }
      - { name: base_price_per_ton, type: number, source: input, description: "List material price per ton used by delivered_price_quote", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED; RETIRED blocks new orders and new plant output credit to its stockpiles", constraints: "ACTIVE | RETIRED" }

  - name: Stockpile
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> QuarrySite.id" }
      - { name: product_spec_id, type: string, source: input, description: "FK -> ProductSpec.id; one stockpile per (site_id, product_spec_id)" }
      - { name: capacity_tons, type: number, source: input, description: "Physical capacity; on_hand_tons may never exceed it", constraints: "> 0" }
      - { name: on_hand_tons, type: number, source: computed, description: "Physical tons: + plant-run output credits, + adjustments, - ticket net draws, reversed by run void / ticket void", default: 0 }
      - { name: reserved_tons, type: number, source: computed, description: "Sum of unfulfilled commitment for orders in CONFIRMED/IN_FULFILLMENT resolved to this stockpile", default: 0 }
      - { name: available_tons, type: number, source: computed, description: "on_hand_tons - reserved_tons; invariant maintained by every mutation", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | QUARANTINED | CLOSED; OPEN<->QUARANTINED driven by confirmed gradation tests", constraints: "OPEN | QUARANTINED | CLOSED" }

  - name: GradationTest
    parent: null
    common_fields: true
    fields:
      - { name: stockpile_id, type: string, source: input, description: "FK -> Stockpile.id" }
      - { name: sampled_at, type: datetime, source: input, description: "Sample timestamp (ISO8601)" }
      - { name: sieve_results, type: array, source: input, description: "Array of {sieve: string, pct_passing: number}; must cover every band sieve of the pile's spec" }
      - { name: result, type: enum, source: computed, description: "PASS iff every sieve's pct_passing within [min_pct, max_pct] inclusive, else FAIL", constraints: "PASS | FAIL" }
      - { name: status, type: enum, source: system, description: "REPORTED | CONFIRMED | VOIDED", constraints: "REPORTED | CONFIRMED | VOIDED" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID at create; SoD reference for /confirm" }
      - { name: confirmed_by_user_id, type: string, source: system, description: "X-User-ID at /confirm", default: null }

  - name: Scale
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> QuarrySite.id" }
      - { name: scale_code, type: string, source: input, description: "Scale identifier, e.g. 'TRUCK-01'", constraints: "unique within site" }
      - { name: scale_type, type: enum, source: input, description: "TRUCK (scale-house ticketing) | BELT (plant feed)", constraints: "TRUCK | BELT" }
      - { name: status, type: enum, source: system, description: "CERTIFIED | OUT_OF_SERVICE; driven by calibration events", constraints: "CERTIFIED | OUT_OF_SERVICE" }
      - { name: certified_through, type: string, source: system, description: "Last day of certification (date, inclusive) = calibrated_on + 180 days from latest non-VOIDED PASS calibration; null when never certified", default: null }

  - name: ScaleCalibration
    parent: null
    common_fields: true
    fields:
      - { name: scale_id, type: string, source: input, description: "FK -> Scale.id" }
      - { name: calibrated_on, type: string, source: input, description: "Calibration date (YYYY-MM-DD)" }
      - { name: as_found_error_pct, type: number, source: input, description: "As-found percent error vs test weights" }
      - { name: as_left_error_pct, type: number, source: input, description: "As-left percent error; PASS iff abs(as_left_error_pct) <= 0.25 inclusive" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL from as_left_error_pct tolerance", constraints: "PASS | FAIL" }
      - { name: status, type: enum, source: system, description: "RECORDED | VOIDED", constraints: "RECORDED | VOIDED" }

  - name: PlantRun
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> QuarrySite.id" }
      - { name: muckpile_id, type: string, source: input, description: "FK -> Muckpile.id; feed source (must be OPEN at start)" }
      - { name: belt_scale_id, type: string, source: input, description: "FK -> Scale.id; belt scale measuring input_tons (must be CERTIFIED and in-date at start)" }
      - { name: circuit_line, type: enum, source: input, description: "PRIMARY | SECONDARY; overlap/cooldown rules apply per circuit_line", constraints: "PRIMARY | SECONDARY" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock timestamp at /start", default: null }
      - { name: ended_at, type: datetime, source: system, description: "Logical-clock timestamp at /complete", default: null }
      - { name: run_hours, type: number, source: computed, description: "(ended_at - started_at) in hours, 2 decimals", default: null }
      - { name: input_tons, type: number, source: system, description: "Belt-scale feed tons reported at /complete", default: null }
      - { name: reconciled_input_tons, type: number, source: system, description: "Independent reconciled feed figure supplied at /reconcile", default: null }
      - { name: outputs, type: array, source: system, description: "Array of {stockpile_id, product_spec_id, tons} credited at /complete", default: [] }
      - { name: yield_summary, type: object, source: computed, description: "Per output spec: {spec_code: {measured_pct, design_pct, variance_pts}} per calculations.crusher_circuit_yield", default: null }
      - { name: production_status, type: enum, source: system, description: "SCHEDULED | RUNNING | COMPLETED | VOIDED | CANCELLED (parallel dimension 1)", constraints: "enum set as listed" }
      - { name: reconciliation_status, type: enum, source: system, description: "UNRECONCILED | RECONCILED | DISPUTED (parallel dimension 2, independent of production_status)", constraints: "enum set as listed" }

  - name: FreightZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Freight pricing zone code", constraints: "unique" }
      - { name: distance_miles, type: number, source: input, description: "One-way haul distance", constraints: "> 0" }
      - { name: base_freight_per_ton, type: number, source: input, description: "Flat freight component per delivered ton", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE; INACTIVE blocks new orders", constraints: "ACTIVE | INACTIVE" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> QuarrySite.id; shipping site" }
      - { name: product_spec_id, type: string, source: input, description: "FK -> ProductSpec.id" }
      - { name: freight_zone_id, type: string, source: input, description: "FK -> FreightZone.id" }
      - { name: customer_name, type: string, source: input, description: "Customer account name" }
      - { name: quantity_tons, type: number, source: input, description: "Ordered tons", constraints: "> 0" }
      - { name: stockpile_id, type: string, source: system, description: "FK -> Stockpile.id; resolved at /confirm via selector (site_id + product_spec_id, status OPEN)", default: null }
      - { name: quoted_material_per_ton, type: number, source: computed, description: "Material component from calculations.delivered_price_quote at quote time (2 dp)" }
      - { name: quoted_freight_per_ton, type: number, source: computed, description: "Freight component at quote time (2 dp)" }
      - { name: quoted_surcharge_per_ton, type: number, source: computed, description: "Fuel surcharge component at quote time (2 dp; 0.00 for RIPRAP)" }
      - { name: quoted_unit_delivered_per_ton, type: number, source: computed, description: "Sum of the three quoted components (2 dp)" }
      - { name: quoted_total_usd, type: number, source: computed, description: "quoted_unit_delivered_per_ton x quantity_tons, 2 dp round_half_up" }
      - { name: prices_pinned, type: boolean, source: system, description: "false while QUOTED (reprice allowed); true from /confirm onward — quoted_* fields freeze (version-pinning on approval)", default: false }
      - { name: fulfilled_tons, type: number, source: computed, description: "Sum of net_tons over COMPLETED tickets for this order; reaching >= quantity_tons auto-completes the order", default: 0 }
      - { name: status, type: enum, source: system, description: "QUOTED | CONFIRMED | BACKORDERED | IN_FULFILLMENT | COMPLETED | CANCELLED", constraints: "enum set as listed" }

  - name: ScaleTicket
    parent: null
    common_fields: true
    fields:
      - { name: queue_entry_id, type: string, source: input, description: "FK -> TruckQueueEntry.id; the weigh-in event for this queue entry" }
      - { name: sales_order_id, type: string, source: input, description: "FK -> SalesOrder.id; order being fulfilled (must be CONFIRMED or IN_FULFILLMENT)" }
      - { name: scale_id, type: string, source: input, description: "FK -> Scale.id; truck scale used (must be CERTIFIED with certified_through >= today at weigh-in and weigh-out)" }
      - { name: site_id, type: string, source: system, description: "FK -> QuarrySite.id; copied from the queue entry" }
      - { name: stockpile_id, type: string, source: system, description: "FK -> Stockpile.id; copied from the sales order" }
      - { name: truck_id, type: string, source: system, description: "Truck identifier copied from the queue entry" }
      - { name: gross_lbs, type: number, source: input, description: "Loaded weight at weigh-in", constraints: "> 0" }
      - { name: tare_lbs, type: number, source: system, description: "Empty weight captured at weigh-out", default: null }
      - { name: net_tons, type: number, source: computed, description: "round((gross_lbs - tare_lbs)/2000, 3) round_half_up at weigh-out", default: null }
      - { name: tare_variance_pct, type: number, source: computed, description: "abs(tare_lbs - certified_tare_lbs)/certified_tare_lbs x 100 vs queue entry certified tare", default: null }
      - { name: royalty_provisional_usd, type: number, source: computed, description: "round(net_tons x active agreement base_rate_per_ton, 2) accrued at weigh-out (provisional variant)", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp at weigh-out; drives royalty statement period membership", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | COMPLETED | VOIDED", constraints: "OPEN | COMPLETED | VOIDED" }
      - { name: void_reason, type: string, source: system, description: "Reason recorded at /void", default: null }

  - name: RoyaltyAgreement
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> QuarrySite.id" }
      - { name: landowner_name, type: string, source: input, description: "Royalty payee" }
      - { name: base_rate_per_ton, type: number, source: input, description: "Royalty $/ton up to tier_threshold_tons of annual cumulative tonnage", constraints: "> 0" }
      - { name: tier_threshold_tons, type: number, source: input, description: "Annual (calendar-year) cumulative tons at which the tier rate begins (marginal, tons beyond threshold only)", constraints: "> 0" }
      - { name: tier_rate_per_ton, type: number, source: input, description: "Royalty $/ton for tons beyond tier_threshold_tons", constraints: "> 0" }
      - { name: effective_from, type: string, source: input, description: "First date (YYYY-MM-DD) this agreement version covers" }
      - { name: effective_to, type: string, source: system, description: "Set to the superseding amendment's effective_from; null while ACTIVE", default: null }
      - { name: supersedes_agreement_id, type: string, source: system, description: "FK -> RoyaltyAgreement.id; self-referential amendment chain pointer, null for the original", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | TERMINATED", constraints: "ACTIVE | SUPERSEDED | TERMINATED" }

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> QuarrySite.id" }
      - { name: period_start, type: string, source: input, description: "Statement period start date (inclusive, YYYY-MM-DD)" }
      - { name: period_end, type: string, source: input, description: "Statement period end date (exclusive, YYYY-MM-DD); half-open [period_start, period_end)" }
      - { name: royalty_agreement_id, type: string, source: system, description: "FK -> RoyaltyAgreement.id; ACTIVE agreement pinned at generation (version-pinning)" }
      - { name: tons_sold, type: number, source: computed, description: "Sum of net_tons over COMPLETED tickets with completed_at in [period_start, period_end)" }
      - { name: ytd_tons_before, type: number, source: computed, description: "Calendar-year cumulative tons before this period = sum of tons_sold over same-site non-VOID statements whose period_start is in the same calendar year and earlier than this period_start (tie-break: created_at ASC)" }
      - { name: ytd_tons_after, type: number, source: computed, description: "ytd_tons_before + tons_sold" }
      - { name: royalty_due_usd, type: number, source: computed, description: "Final-variant royalty: per-ticket marginal-tier amount rounded per ticket (2 dp round_half_up) then summed, per calculations.royalty_amount" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOID", constraints: "DRAFT | ISSUED | PAID | VOID" }
      - { name: generated_by_user_id, type: string, source: system, description: "X-User-ID at generation; SoD reference for /issue" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID at /issue", default: null }
      - { name: issued_on, type: string, source: system, description: "Date (from logical clock) at /issue", default: null }
      - { name: due_on, type: string, source: computed, description: "issued_on + 30 days", default: null }
      - { name: paid_on, type: string, source: system, description: "Date supplied at /pay", default: null }
      - { name: penalty_usd, type: number, source: computed, description: "0.00 if paid_on <= due_on, else round(royalty_due_usd x 0.05, 2)", default: null }

  - name: MshaInspection
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> QuarrySite.id" }
      - { name: inspection_type, type: enum, source: input, description: "REGULAR | SPOT | COMPLAINT", constraints: "REGULAR | SPOT | COMPLAINT" }
      - { name: opened_on, type: string, source: system, description: "Date (logical clock) the inspection was opened" }
      - { name: closed_on, type: string, source: system, description: "Date at /close", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; close requires every citation ABATED or VACATED", constraints: "OPEN | CLOSED" }

  - name: MshaCitation
    parent: null
    common_fields: true
    fields:
      - { name: msha_inspection_id, type: string, source: input, description: "FK -> MshaInspection.id (inspection must be OPEN)" }
      - { name: citation_code, type: string, source: input, description: "30 CFR citation code, e.g. '56.14100'" }
      - { name: s_and_s, type: boolean, source: input, description: "Significant-and-substantial flag; overdue S&S citations suspend the site" }
      - { name: abatement_due_on, type: string, source: input, description: "Abatement deadline date (YYYY-MM-DD); overdue iff < current logical date while status == ISSUED" }
      - { name: abated_on, type: string, source: system, description: "Date supplied at /abate", default: null }
      - { name: status, type: enum, source: system, description: "ISSUED | ABATED | VACATED", constraints: "ISSUED | ABATED | VACATED" }

  - name: TrainingRecord
    parent: null
    common_fields: true
    fields:
      - { name: miner_name, type: string, source: input, description: "Miner display name" }
      - { name: miner_user_id, type: string, source: input, description: "Opaque user id of the miner; matched against X-User-ID at shot firing" }
      - { name: course_type, type: enum, source: input, description: "NEW_MINER | ANNUAL_REFRESHER | TASK_TRAINING; firing requires current TASK_TRAINING", constraints: "NEW_MINER | ANNUAL_REFRESHER | TASK_TRAINING" }
      - { name: completed_on, type: string, source: input, description: "Course completion date (YYYY-MM-DD)" }
      - { name: expires_on, type: string, source: computed, description: "completed_on + 12 months" }
      - { name: is_current, type: boolean, source: computed, description: "true iff expires_on >= current logical date (inclusive)" }

  - name: ReclamationBond
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> QuarrySite.id" }
      - { name: surety_name, type: string, source: input, description: "Surety company issuing the bond" }
      - { name: amount_usd, type: number, source: input, description: "Face amount of the bond instrument", constraints: "> 0" }
      - { name: released_usd, type: number, source: system, description: "Cumulative released amount via /release", default: 0 }
      - { name: status, type: enum, source: system, description: "POSTED | PARTIALLY_RELEASED | FULLY_RELEASED; FULLY_RELEASED when released_usd == amount_usd", constraints: "POSTED | PARTIALLY_RELEASED | FULLY_RELEASED" }

  - name: TruckQueueEntry
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> QuarrySite.id; scale-house queue of this site" }
      - { name: truck_id, type: string, source: input, description: "External truck identifier; at most one active entry per truck per site" }
      - { name: priority_class, type: enum, source: input, description: "CONTRACT | SPOT | INTERNAL; dispatch priority CONTRACT > SPOT > INTERNAL", constraints: "CONTRACT | SPOT | INTERNAL" }
      - { name: certified_tare_lbs, type: number, source: input, description: "Registered empty weight used by the tare-variance check", constraints: "> 0" }
      - { name: max_payload_lbs, type: number, source: input, description: "Legal payload; net weight may not exceed it", constraints: "> 0" }
      - { name: queued_at, type: datetime, source: system, description: "Logical-clock timestamp at entry creation; dispatch tie-break" }
      - { name: scale_ticket_id, type: string, source: system, description: "FK -> ScaleTicket.id; set when weigh-in creates the ticket, null before", default: null }
      - { name: status, type: enum, source: system, description: "QUEUED | AT_SCALE_IN | LOADING | AT_SCALE_OUT | EXITED | NO_SHOW", constraints: "enum set as listed" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: QuarrySite
    field: posture
    derivation: |
      Derived field (posture_driven shape), recomputed synchronously after every
      citation create/abate/vacate, bond create/release, bench transition, and
      POST /sites/{id}/recompute-posture, in this pinned order:
        (1) recompute disturbed_acres from bench statuses,
        (2) recompute bond_required_usd (phased rate) and bond_posted_usd,
        (3) recompute bond_adequacy,
        (4) posture = SUSPENDED if any citation (via site's inspections) has
            status ISSUED and s_and_s == true and abatement_due_on < current date;
            else RESTRICTED if bond_adequacy == DEFICIENT or any citation has
            status ISSUED; else OPERATING.
      Transition side effects: entering SUSPENDED auto-holds every bench in
      RELEASED (hold_reason='MSHA_SUSPENSION') and every shot plan of those
      benches in {APPROVED, DRILLING, DRILLED, LOADED} (hold_return_state set);
      leaving SUSPENDED for OPERATING or RESTRICTED auto-releases benches whose
      hold_reason == 'MSHA_SUSPENSION' and auto-resumes their ON_HOLD shot plans
      to hold_return_state. Manually held benches (other hold_reason) are untouched.

  - entity: Bench
    initial_state: PLANNED
    terminal_states: [RECLAIMED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /benches/{id}/release"
        actor: SiteManager
        preconditions:
          - "site posture == OPERATING (ERR_SITE_POSTURE_BLOCKED)"
          - "every bench of the same site with elevation_ft > this.elevation_ft has status in {MINED_OUT, RECLAMATION_IN_PROGRESS, RECLAIMED} (ERR_BENCH_SEQUENCE_VIOLATION)"
          - "disturbed_acres after release (current + this.acreage) <= site.permitted_acres (ERR_PERMIT_ACREAGE_EXCEEDED)"
        side_effects:
          - "site disturbed_acres += acreage; bond_required_usd recomputed; posture recomputed (may drop to RESTRICTED if bond becomes DEFICIENT)"
      - from: RELEASED
        to: ON_HOLD
        trigger: "POST /benches/{id}/hold (payload reason)"
        actor: SiteManager
        preconditions: []
        side_effects:
          - "hold_reason = payload reason"
      - from: RELEASED
        to: ON_HOLD
        trigger: "system (site posture enters SUSPENDED — cascade link 2)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_reason = 'MSHA_SUSPENSION'; every ShotPlan on this bench in {APPROVED, DRILLING, DRILLED, LOADED} -> ON_HOLD with hold_return_state = prior status (cascade link 3)"
      - from: ON_HOLD
        to: RELEASED
        trigger: "POST /benches/{id}/resume (manual holds) OR system auto-resume when posture leaves SUSPENDED and hold_reason == 'MSHA_SUSPENSION'"
        actor: SiteManager | system
        preconditions:
          - "manual resume: site posture != SUSPENDED (ERR_SITE_POSTURE_BLOCKED)"
        side_effects:
          - "hold_reason = null; every ShotPlan ON_HOLD on this bench returns to its hold_return_state, hold_return_state = null"
      - from: RELEASED
        to: MINED_OUT
        trigger: "POST /benches/{id}/mark-mined-out"
        actor: SiteManager
        preconditions:
          - "no ShotPlan on this bench with status in {APPROVED, DRILLING, DRILLED, LOADED, ON_HOLD} (ERR_ACTIVE_SHOT_PLAN)"
        side_effects:
          - "site bond_required_usd unchanged in phase (still full rate); posture recomputed"
      - from: MINED_OUT
        to: RECLAMATION_IN_PROGRESS
        trigger: "POST /benches/{id}/start-reclamation"
        actor: SiteManager
        preconditions:
          - "site posture != SUSPENDED (ERR_SITE_POSTURE_BLOCKED)"
        side_effects:
          - "bond_required_usd recomputed: this bench's acres now at 0.5 x rate; posture recomputed"
      - from: RECLAMATION_IN_PROGRESS
        to: RECLAIMED
        trigger: "POST /benches/{id}/complete-reclamation"
        actor: SiteManager
        preconditions:
          - "site posture != SUSPENDED evaluated against the PRE-transition posture (ERR_SITE_POSTURE_BLOCKED)"
        side_effects:
          - "pinned evaluation order: recompute disturbed_acres (this bench now excluded), then bond_required_usd, then bond_adequacy, then posture — a reclamation that cures DEFICIENT flips posture RESTRICTED -> OPERATING in the same request"

  - entity: ShotPlan
    initial_state: DRAFT
    terminal_states: [FIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /shot-plans/{id}/submit"
        actor: BlastForeman
        preconditions: []
        side_effects:
          - "submitted_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /shot-plans/{id}/approve"
        actor: SiteManager
        preconditions:
          - "bench.status == RELEASED (ERR_BENCH_NOT_RELEASED)"
          - "site posture in {OPERATING, RESTRICTED} (ERR_SITE_POSTURE_BLOCKED)"
          - "segregation of duties: X-User-ID != submitted_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
      - from: APPROVED
        to: DRILLING
        trigger: "POST /shot-plans/{id}/start-drilling"
        actor: BlastForeman
        preconditions:
          - "bench.status == RELEASED (ERR_BENCH_NOT_RELEASED)"
          - "site posture in {OPERATING, RESTRICTED} (ERR_SITE_POSTURE_BLOCKED)"
        side_effects: []
      - from: DRILLING
        to: DRILLED
        trigger: "POST /shot-plans/{id}/complete-drilling (payload drilled_hole_count)"
        actor: BlastForeman
        preconditions:
          - "bench.status == RELEASED (ERR_BENCH_NOT_RELEASED)"
          - "drilled_hole_count >= hole_count (ERR_HOLES_INCOMPLETE)"
        side_effects:
          - "drilled_hole_count = payload value"
      - from: DRILLED
        to: DRILLING
        trigger: "POST /shot-plans/{id}/redrill (re-drill loop: collapsed/flooded holes)"
        actor: BlastForeman
        preconditions:
          - "bench.status == RELEASED (ERR_BENCH_NOT_RELEASED)"
          - "site posture != SUSPENDED (ERR_SITE_POSTURE_BLOCKED)"
        side_effects:
          - "drilled_hole_count = 0"
      - from: DRILLED
        to: LOADED
        trigger: "POST /shot-plans/{id}/load (payload loaded_explosive_lbs)"
        actor: BlastForeman
        preconditions:
          - "bench.status == RELEASED (ERR_BENCH_NOT_RELEASED)"
        side_effects:
          - "loaded_explosive_lbs = payload; powder_factor recomputed from actual load"
      - from: LOADED
        to: FIRED
        trigger: "POST /shot-plans/{id}/fire"
        actor: BlastForeman
        preconditions:
          - "bench.status == RELEASED (ERR_BENCH_NOT_RELEASED)"
          - "site posture == OPERATING (ERR_SITE_POSTURE_BLOCKED)"
          - "business_safety: a TrainingRecord exists with miner_user_id == X-User-ID, course_type == TASK_TRAINING, is_current == true (ERR_TRAINING_EXPIRED)"
          - "business_temporal: current logical-clock UTC hour in [8, 17) — blast window (ERR_OUTSIDE_BLAST_WINDOW)"
        side_effects:
          - "fired_at = current logical timestamp"
          - "create Muckpile (status OPEN, estimated_tons = this.estimated_tons, remaining_tons = estimated_tons, actual_fed_tons = 0) — cascade-created child discoverable via GET /muckpiles?shot_plan_id="
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /shot-plans/{id}/cancel"
        actor: BlastForeman
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /shot-plans/{id}/cancel"
        actor: BlastForeman
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /shot-plans/{id}/cancel"
        actor: BlastForeman
        preconditions: []
        side_effects: []
      - from: "{APPROVED, DRILLING, DRILLED, LOADED}"
        to: ON_HOLD
        trigger: "system (site posture enters SUSPENDED — cascade link 3)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_return_state = prior status"
      - from: ON_HOLD
        to: "{hold_return_state}"
        trigger: "system (site posture leaves SUSPENDED — cascade resume)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_return_state = null"

  - entity: Muckpile
    initial_state: OPEN
    terminal_states: [DEPLETED]
    transitions:
      - from: OPEN
        to: DEPLETED
        trigger: "system (PlantRun /complete debits remaining_tons to exactly 0)"
        actor: system
        preconditions:
          - "remaining_tons == 0 after the debit (boundary: exactly zero)"
        side_effects: []
      - from: DEPLETED
        to: OPEN
        trigger: "system (PlantRun /void restores input_tons to remaining_tons)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Stockpile
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: QUARANTINED
        trigger: "system (GradationTest /confirm with result FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "blocks new order confirmation and weigh-in against this pile (ERR_STOCKPILE_QUARANTINED)"
      - from: QUARANTINED
        to: OPEN
        trigger: "system (GradationTest /confirm with result PASS and no later confirmed non-VOIDED FAIL exists for this pile — latest confirmed decides; selector: max sampled_at, tie-break max created_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /stockpiles/{id}/close"
        actor: SiteManager
        preconditions:
          - "on_hand_tons == 0 and reserved_tons == 0 (ERR_STOCKPILE_NOT_EMPTY)"
        side_effects: []
      - from: QUARANTINED
        to: CLOSED
        trigger: "POST /stockpiles/{id}/close"
        actor: SiteManager
        preconditions:
          - "on_hand_tons == 0 and reserved_tons == 0 (ERR_STOCKPILE_NOT_EMPTY)"
        side_effects: []
      - from: QUARANTINED
        to: OPEN
        trigger: "system (GradationTest /void of the latest confirmed FAIL, when the remaining latest confirmed non-VOIDED test is a PASS or none exists — re-evaluate latest-confirmed selector)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: QUARANTINED
        trigger: "system (GradationTest /void of a PASS that unmasks a later confirmed FAIL — same re-evaluation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GradationTest
    initial_state: REPORTED
    terminal_states: [CONFIRMED, VOIDED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /gradation-tests/{id}/confirm"
        actor: QCTechnician
        preconditions:
          - "segregation of duties: X-User-ID != reported_by_user_id (ERR_SOD_VIOLATION)"
          - "stockpile.status != CLOSED (ERR_INVALID_STATE)"
        side_effects:
          - "confirmed_by_user_id = X-User-ID"
          - "result FAIL -> stockpile -> QUARANTINED; result PASS -> stockpile -> OPEN iff no later confirmed non-VOIDED FAIL (latest-confirmed selector)"
      - from: REPORTED
        to: VOIDED
        trigger: "POST /gradation-tests/{id}/void"
        actor: QCTechnician
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: VOIDED
        trigger: "POST /gradation-tests/{id}/void"
        actor: QCTechnician
        preconditions: []
        side_effects:
          - "stockpile quarantine status re-evaluated from remaining confirmed non-VOIDED tests (latest-confirmed selector)"

  - entity: Scale
    initial_state: OUT_OF_SERVICE
    terminal_states: []
    transitions:
      - from: OUT_OF_SERVICE
        to: CERTIFIED
        trigger: "system (ScaleCalibration created with result PASS)"
        actor: system
        preconditions: []
        side_effects:
          - "certified_through = calibrated_on + 180 days"
      - from: CERTIFIED
        to: CERTIFIED
        trigger: "system (newer ScaleCalibration PASS supersedes certification window)"
        actor: system
        preconditions: []
        side_effects:
          - "certified_through = new calibrated_on + 180 days"
      - from: CERTIFIED
        to: OUT_OF_SERVICE
        trigger: "system (ScaleCalibration created with result FAIL, OR latest PASS calibration voided leaving no non-VOIDED PASS)"
        actor: system
        preconditions: []
        side_effects:
          - "certified_through recomputed from remaining non-VOIDED PASS calibrations; null if none"
      - from: OUT_OF_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system (ScaleCalibration FAIL while already out of service)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ScaleCalibration
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /scale-calibrations/{id}/void"
        actor: QuarryAdmin
        preconditions: []
        side_effects:
          - "scale certification recomputed from remaining non-VOIDED calibrations (compensation: voiding the latest PASS flips scale to OUT_OF_SERVICE unless an older non-VOIDED PASS remains)"

  - entity: PlantRun
    initial_state: "production_status=SCHEDULED, reconciliation_status=UNRECONCILED"
    terminal_states: ["production_status in {VOIDED, CANCELLED} with reconciliation_status RECONCILED-or-UNRECONCILED as last set"]
    parallel_dimensions: "production_status (SCHEDULED->RUNNING->COMPLETED->{VOIDED}; SCHEDULED->CANCELLED) x reconciliation_status (UNRECONCILED->{RECONCILED, DISPUTED}; DISPUTED->RECONCILED) evolve independently on the same row"
    transitions:
      - from: "production SCHEDULED"
        to: "production RUNNING"
        trigger: "POST /plant-runs/{id}/start"
        actor: PlantOperator
        preconditions:
          - "site posture in {OPERATING, RESTRICTED} (ERR_SITE_POSTURE_BLOCKED)"
          - "muckpile.status == OPEN (ERR_MUCKPILE_DEPLETED)"
          - "belt scale status == CERTIFIED and certified_through >= current date (ERR_SCALE_NOT_CERTIFIED)"
          - "circuit free: no other run with same site+circuit_line in production RUNNING, and no COMPLETED run on same circuit with ended_at + 30 minutes > current time (ERR_CIRCUIT_OVERLAP)"
        side_effects:
          - "started_at = current logical timestamp"
      - from: "production RUNNING"
        to: "production COMPLETED"
        trigger: "POST /plant-runs/{id}/complete (payload input_tons, outputs[])"
        actor: PlantOperator
        preconditions:
          - "output balance: abs(sum(outputs.tons) - input_tons) / input_tons <= 0.03 inclusive (ERR_OUTPUT_IMBALANCE)"
          - "input_tons <= muckpile.remaining_tons (ERR_MUCKPILE_DEPLETED)"
          - "each output stockpile: status == OPEN (ERR_STOCKPILE_QUARANTINED) and product spec status == ACTIVE (ERR_SPEC_RETIRED)"
          - "each output stockpile: on_hand_tons + tons <= capacity_tons (ERR_STOCKPILE_CAPACITY_EXCEEDED)"
          - "each output stockpile belongs to this run's site and its product_spec_id matches the pile's spec (ERR_INVALID_REQUEST)"
        side_effects:
          - "ended_at = current logical timestamp; run_hours computed; input_tons/outputs stored"
          - "cascade link 1: muckpile.actual_fed_tons += input_tons; remaining_tons -= input_tons; auto DEPLETED at exactly 0"
          - "cascade link 1: each output stockpile on_hand_tons += tons (available_tons recomputed)"
          - "yield_summary computed per calculations.crusher_circuit_yield"
          - "cascade link 2: allocation sweep per calculations.stockpile_availability — for each credited stockpile, BACKORDERED orders of its site+spec promote to CONFIRMED in created_at ASC order (tie: quantity_tons ASC, then customer_name ASC) while available_tons >= order.quantity_tons; strict FIFO — stop at first non-fitting order; each promotion sets stockpile_id, pins prices, reserved_tons += quantity_tons"
      - from: "production COMPLETED"
        to: "production VOIDED"
        trigger: "POST /plant-runs/{id}/void"
        actor: PlantOperator
        preconditions:
          - "reconciliation_status == UNRECONCILED (ERR_INVALID_STATE once RECONCILED or DISPUTED)"
          - "reversal absorbable: each credited stockpile on_hand_tons >= credited tons (ERR_REVERSAL_BLOCKED)"
        side_effects:
          - "compensation: each stockpile on_hand_tons -= credited tons; muckpile.remaining_tons += input_tons and actual_fed_tons -= input_tons (muckpile DEPLETED -> OPEN if it was depleted)"
      - from: "production SCHEDULED"
        to: "production CANCELLED"
        trigger: "POST /plant-runs/{id}/cancel"
        actor: PlantOperator
        preconditions: []
        side_effects: []
      - from: "reconciliation UNRECONCILED"
        to: "reconciliation RECONCILED"
        trigger: "POST /plant-runs/{id}/reconcile (payload reconciled_input_tons)"
        actor: PlantOperator
        preconditions:
          - "production_status == COMPLETED (ERR_INVALID_STATE)"
          - "abs(reconciled_input_tons - input_tons)/input_tons <= 0.02 inclusive; out-of-tolerance routes to DISPUTED instead (threshold branch, not an error)"
        side_effects:
          - "reconciled_input_tons stored"
      - from: "reconciliation UNRECONCILED"
        to: "reconciliation DISPUTED"
        trigger: "POST /plant-runs/{id}/reconcile with out-of-tolerance reconciled_input_tons"
        actor: PlantOperator
        preconditions:
          - "production_status == COMPLETED"
        side_effects:
          - "reconciled_input_tons stored"
      - from: "reconciliation DISPUTED"
        to: "reconciliation RECONCILED"
        trigger: "POST /plant-runs/{id}/reconcile with corrected in-tolerance reconciled_input_tons"
        actor: PlantOperator
        preconditions:
          - "production_status == COMPLETED"
          - "abs(reconciled_input_tons - input_tons)/input_tons <= 0.02 inclusive"
        side_effects:
          - "reconciled_input_tons overwritten with corrected value"

  - entity: FreightZone
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /freight-zones/{id}/deactivate"
        actor: QuarryAdmin
        preconditions: []
        side_effects:
          - "new order creation against this zone rejected (ERR_ZONE_INACTIVE); existing orders unaffected (pinned prices)"

  - entity: ProductSpec
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /product-specs/{id}/retire"
        actor: QuarryAdmin
        preconditions: []
        side_effects:
          - "new order creation rejected (ERR_SPEC_RETIRED); plant-run output credit to its stockpiles rejected (ERR_SPEC_RETIRED); existing orders unaffected"

  - entity: SalesOrder
    initial_state: QUOTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /sales-orders/{id}/confirm"
        actor: SalesAgent
        preconditions:
          - "product spec status == ACTIVE (ERR_SPEC_RETIRED)"
          - "freight zone status == ACTIVE (ERR_ZONE_INACTIVE)"
          - "resolved stockpile (site+spec selector) exists and status == OPEN (ERR_STOCKPILE_QUARANTINED)"
          - "branch condition: stockpile.available_tons >= quantity_tons routes to CONFIRMED; otherwise routes to BACKORDERED (no error)"
        side_effects:
          - "prices_pinned = true (quoted_* frozen — version-pinning on approval)"
          - "stockpile_id set; stockpile.reserved_tons += quantity_tons"
      - from: QUOTED
        to: BACKORDERED
        trigger: "POST /sales-orders/{id}/confirm with available_tons < quantity_tons"
        actor: SalesAgent
        preconditions:
          - "same as QUOTED->CONFIRMED except the availability branch"
        side_effects:
          - "prices_pinned = true; stockpile_id set; no reservation made"
      - from: BACKORDERED
        to: CONFIRMED
        trigger: "system (allocation sweep on stockpile credit — PlantRun complete or manual adjustment)"
        actor: system
        preconditions:
          - "available_tons >= quantity_tons at this order's position in the FIFO sweep"
          - "stockpile.status == OPEN"
        side_effects:
          - "stockpile.reserved_tons += quantity_tons"
      - from: CONFIRMED
        to: IN_FULFILLMENT
        trigger: "system (first ScaleTicket weigh-out completes against this order)"
        actor: system
        preconditions: []
        side_effects:
          - "fulfilled_tons += ticket.net_tons; stockpile reserved_tons recomputed = max(0, quantity_tons - fulfilled_tons)"
      - from: IN_FULFILLMENT
        to: COMPLETED
        trigger: "system (ticket weigh-out brings fulfilled_tons >= quantity_tons — boundary: equality completes)"
        actor: system
        preconditions:
          - "fulfilled_tons >= quantity_tons after the draw"
        side_effects:
          - "stockpile.reserved_tons for this order -> 0"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "compensation: stockpile.reserved_tons -= quantity_tons"
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects: []
      - from: IN_FULFILLMENT
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "compensation: stockpile.reserved_tons -= max(0, quantity_tons - fulfilled_tons); fulfilled_tons stays (shipped tons remain billable)"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /sales-orders/{id}/reprice (OCC: expected_sales_order_version)"
        actor: SalesAgent
        preconditions:
          - "expected_sales_order_version == version (ERR_STALE_VERSION)"
        side_effects:
          - "quoted_* recomputed from current spec/zone price book; version += 1"

  - entity: ScaleTicket
    initial_state: OPEN
    terminal_states: [VOIDED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /scale-tickets/{id}/weigh-out (payload tare_lbs, allow_tare_variance?)"
        actor: ScaleHouseOperator
        preconditions:
          - "queue entry status == AT_SCALE_OUT (ERR_INVALID_STATE)"
          - "site posture in {OPERATING, RESTRICTED} (ERR_SITE_POSTURE_BLOCKED)"
          - "scale.status == CERTIFIED and certified_through >= current date (ERR_SCALE_NOT_CERTIFIED)"
          - "tare variance: abs(tare_lbs - entry.certified_tare_lbs)/entry.certified_tare_lbs <= 0.02 unless payload allow_tare_variance == true (ERR_TARE_VARIANCE)"
          - "net weight legal: gross_lbs - tare_lbs <= entry.max_payload_lbs (ERR_TRUCK_OVERWEIGHT)"
          - "an ACTIVE royalty agreement covers current date (effective_from <= today and (effective_to is null or effective_to > today)) (ERR_ROYALTY_AGREEMENT_REQUIRED)"
          - "over-shipment guard: order.fulfilled_tons + net_tons <= round(order.quantity_tons x 1.10, 3) inclusive (ERR_OVER_SHIPMENT)"
        side_effects:
          - "net_tons, tare_variance_pct computed; completed_at = current logical timestamp; royalty_provisional_usd = round(net_tons x agreement.base_rate_per_ton, 2)"
          - "stockpile.on_hand_tons -= net_tons (available_tons recomputed)"
          - "order.fulfilled_tons += net_tons; order CONFIRMED -> IN_FULFILLMENT on first draw; order -> COMPLETED when fulfilled_tons >= quantity_tons; reserved_tons recomputed = max(0, quantity_tons - fulfilled_tons)"
          - "queue entry AT_SCALE_OUT -> EXITED"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /scale-tickets/{id}/void (payload void_reason)"
        actor: SiteManager
        preconditions:
          - "no RoyaltyStatement with status in {DRAFT, ISSUED, PAID} whose [period_start, period_end) contains completed_at (ERR_STATEMENT_LOCKED)"
        side_effects:
          - "compensation: stockpile.on_hand_tons += net_tons; order.fulfilled_tons -= net_tons; reserved_tons recomputed = max(0, quantity_tons - fulfilled_tons); order COMPLETED -> IN_FULFILLMENT if it had auto-completed"
          - "royalty_provisional_usd excluded from all subsequent statement sweeps (VOIDED tickets never enter royalty_amount input set)"

  - entity: RoyaltyAgreement
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /royalty-agreements/{id}/amendments (create-with-supersede)"
        actor: FinanceClerk
        preconditions:
          - "state: this agreement must be ACTIVE (ERR_INVALID_STATE otherwise — a second amendment against an already-superseded agreement is a state failure, not a race)"
        side_effects:
          - "this agreement: status SUPERSEDED, effective_to = payload effective_from, version += 1"
          - "new RoyaltyAgreement created ACTIVE with payload rates, effective_from = payload, supersedes_agreement_id = this id"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /royalty-agreements/{id}/terminate"
        actor: FinanceClerk
        preconditions: []
        side_effects:
          - "subsequent weigh-outs with no other ACTIVE covering agreement fail ERR_ROYALTY_AGREEMENT_REQUIRED"

  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /royalty-statements/{id}/issue"
        actor: SiteManager
        preconditions:
          - "segregation of duties: X-User-ID != generated_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "issued_by_user_id = X-User-ID; issued_on = current logical date; due_on = issued_on + 30 days"
      - from: ISSUED
        to: PAID
        trigger: "POST /royalty-statements/{id}/pay (payload paid_on)"
        actor: FinanceClerk
        preconditions: []
        side_effects:
          - "penalty_usd computed: 0.00 if paid_on <= due_on else round(royalty_due_usd x 0.05, 2)"
      - from: DRAFT
        to: VOID
        trigger: "POST /royalty-statements/{id}/void"
        actor: FinanceClerk
        preconditions: []
        side_effects:
          - "period becomes available for regeneration; VOID statements excluded from ytd_tons_before of later statements"

  - entity: MshaInspection
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /msha-inspections/{id}/close"
        actor: SafetyOfficer
        preconditions:
          - "every citation of this inspection has status in {ABATED, VACATED} (ERR_OPEN_CITATIONS)"
        side_effects:
          - "closed_on = current logical date"

  - entity: MshaCitation
    initial_state: ISSUED
    terminal_states: [ABATED, VACATED]
    transitions:
      - from: ISSUED
        to: ABATED
        trigger: "POST /msha-citations/{id}/abate (payload abated_on)"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "site posture recomputed; if posture leaves SUSPENDED, auto-release/auto-resume cascade fires for MSHA_SUSPENSION holds"
      - from: ISSUED
        to: VACATED
        trigger: "POST /msha-citations/{id}/vacate"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "site posture recomputed (same cascade as abate)"

  - entity: ReclamationBond
    initial_state: POSTED
    terminal_states: [FULLY_RELEASED]
    transitions:
      - from: POSTED
        to: PARTIALLY_RELEASED
        trigger: "POST /reclamation-bonds/{id}/release (payload release_amount_usd < amount_usd - released_usd; OCC: expected_reclamation_bond_version)"
        actor: FinanceClerk
        preconditions:
          - "expected_reclamation_bond_version == version (ERR_STALE_VERSION)"
          - "post-release coverage: (site bond_posted_usd - release_amount_usd) >= site bond_required_usd (ERR_BOND_BELOW_REQUIRED)"
        side_effects:
          - "released_usd += release_amount_usd; version += 1; site bond_posted_usd recomputed; posture recomputed"
      - from: POSTED
        to: FULLY_RELEASED
        trigger: "POST /reclamation-bonds/{id}/release (release_amount_usd == amount_usd - released_usd; boundary: equality; OCC)"
        actor: FinanceClerk
        preconditions:
          - "expected_reclamation_bond_version == version (ERR_STALE_VERSION)"
          - "post-release coverage: (site bond_posted_usd - release_amount_usd) >= site bond_required_usd (ERR_BOND_BELOW_REQUIRED)"
        side_effects:
          - "released_usd = amount_usd; version += 1; site recomputed"
      - from: PARTIALLY_RELEASED
        to: FULLY_RELEASED
        trigger: "POST /reclamation-bonds/{id}/release (release_amount_usd == remaining; OCC)"
        actor: FinanceClerk
        preconditions:
          - "expected_reclamation_bond_version == version (ERR_STALE_VERSION)"
          - "post-release coverage check as above (ERR_BOND_BELOW_REQUIRED)"
        side_effects:
          - "released_usd = amount_usd; version += 1; site recomputed"
      - from: PARTIALLY_RELEASED
        to: PARTIALLY_RELEASED
        trigger: "POST /reclamation-bonds/{id}/release (release_amount_usd < remaining; OCC)"
        actor: FinanceClerk
        preconditions:
          - "expected_reclamation_bond_version == version (ERR_STALE_VERSION)"
          - "post-release coverage check as above (ERR_BOND_BELOW_REQUIRED)"
        side_effects:
          - "released_usd += release_amount_usd; version += 1; site recomputed"

  - entity: TruckQueueEntry
    initial_state: QUEUED
    terminal_states: [EXITED, NO_SHOW]
    transitions:
      - from: QUEUED
        to: AT_SCALE_IN
        trigger: "POST /queue-entries/call-next (selector: site entries with status QUEUED; rank priority_class CONTRACT > SPOT > INTERNAL, tie-break queued_at ASC then truck_id ASC; empty pool -> ERR_QUEUE_EMPTY)"
        actor: ScaleHouseOperator
        preconditions: []
        side_effects: []
      - from: AT_SCALE_IN
        to: LOADING
        trigger: "system (POST /scale-tickets weigh-in against this entry)"
        actor: ScaleHouseOperator
        preconditions:
          - "ticket preconditions (scale certified, order confirmable, stockpile OPEN, posture allows) all pass"
        side_effects:
          - "scale_ticket_id = created ticket id"
      - from: LOADING
        to: AT_SCALE_OUT
        trigger: "POST /queue-entries/{id}/begin-scale-out"
        actor: ScaleHouseOperator
        preconditions: []
        side_effects: []
      - from: AT_SCALE_OUT
        to: EXITED
        trigger: "system (POST /scale-tickets/{id}/weigh-out completes the ticket)"
        actor: ScaleHouseOperator
        preconditions: []
        side_effects: []
      - from: QUEUED
        to: NO_SHOW
        trigger: "POST /queue-entries/{id}/mark-no-show"
        actor: ScaleHouseOperator
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: stockpile-adjustment-occ
    parent_entity: Stockpile
    write_endpoint: "POST /stockpiles/{id}/adjustments"
    occ_field: expected_stockpile_version
    description: |
      A manual inventory adjustment carries the stockpile version the client
      last observed; if the stockpile's version has advanced since (any credit,
      draw, reservation, or prior adjustment), the adjustment is rejected as
      stale. Adjustments do not read each other's results, so without the OCC
      check a stale write would silently succeed — the version precondition is
      the only thing that makes the second writer's intent well-defined.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: bond-release-occ
    parent_entity: ReclamationBond
    write_endpoint: "POST /reclamation-bonds/{id}/release"
    occ_field: expected_reclamation_bond_version
    description: |
      A partial bond release carries the bond version the client last observed.
      A release does not depend on reading any other release's result (each is
      an independent decrement validated only against site coverage), so when
      the bond's version has advanced since the client read it (a prior release
      already drew the remaining amount down), the stale release is rejected.
      Release from PARTIALLY_RELEASED is legal, so no state precondition
      catches the stale write — only the version check does.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-reprice-occ
    parent_entity: SalesOrder
    write_endpoint: "POST /sales-orders/{id}/reprice"
    occ_field: expected_sales_order_version
    description: |
      Repricing a QUOTED order recomputes and supersedes the quote terms the
      client last observed. If the order's version has advanced since (a prior
      reprice already replaced those terms), the reprice is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: blast_tonnage_estimate
    trigger: "ShotPlan creation (design variant); recomputed as reconciliation whenever a PlantRun drawing the muckpile completes or is voided (reconciled variant)"
    algorithm: aggregation
    formula: |
      DESIGN variant (ShotPlan.estimated_tons, Muckpile.estimated_tons):
        volume_yd3 = hole_count * burden_ft * spacing_ft * hole_depth_ft / 27
        estimated_tons = round_half_up(volume_yd3 * ROCK_DENSITY_T_PER_YD3, 1)
      RECONCILED variant (Muckpile.actual_fed_tons):
        actual_fed_tons = sum of input_tons over PlantRuns with production_status
        == COMPLETED or reconciliation_status in {UNRECONCILED, DISPUTED,
        RECONCILED} that draw this muckpile, excluding VOIDED and CANCELLED runs
      powder_factor = round_half_up(loaded_explosive_lbs_or_design_load / estimated_tons, 2)
        where design_load = hole_count * explosive_per_hole_lbs (used before /load)
      The two variants legitimately diverge: design is geometric, reconciled is
      belt-measured; identical blast data yields different tons.
    input_set: "ShotPlan geometry fields; PlantRuns with production_status == COMPLETED (any reconciliation_status), excluding VOIDED and CANCELLED"
    constants:
      ROCK_DENSITY_T_PER_YD3: 1.6
      YD3_PER_FT3: 27
    precision: "tons: 1 decimal round_half_up; powder_factor: 2 decimals round_half_up"
    variants:
      - name: design
        when: "at ShotPlan creation / Muckpile creation"
        difference: "geometric estimate from pattern dimensions x in-situ density"
      - name: reconciled
        when: "after plant runs feed the muckpile"
        difference: "belt-measured actual fed tons; diverges from design by dilution/recovery"

  - name: muckpile_remaining
    trigger: "PlantRun /complete (debit) and /void (restore) touching the muckpile"
    algorithm: chronological
    formula: |
      remaining_tons = estimated_tons - actual_fed_tons
      Debits apply in completed_at order (chronological); a void removes its own
      run's contribution regardless of order. Boundary: remaining_tons reaching
      exactly 0 auto-transitions Muckpile to DEPLETED; a void that raises
      remaining_tons above 0 reopens DEPLETED -> OPEN.
    input_set: "same PlantRun set as blast_tonnage_estimate reconciled variant"
    precision: "1 decimal round_half_up"

  - name: delivered_price_quote
    trigger: "SalesOrder creation (quote), POST /sales-orders/{id}/reprice (re-quote); /confirm freezes the quoted_* fields (version-pinning)"
    algorithm: tiered_pricing
    formula: |
      Combinatorial, 3+ inputs with non-linear interaction; pinned evaluation order:
        (1) material_per_ton = round_half_up(base_price_per_ton * volume_factor, 2)
            where volume_factor = 1.00 if quantity_tons <= 100
                                  0.95 if 100 < quantity_tons <= 1000
                                  0.90 if quantity_tons > 1000
            (average-rate: the single factor applies to ALL tons)
        (2) freight_per_ton = round_half_up(zone.base_freight_per_ton, 2)
        (3) subtotal = material_per_ton + freight_per_ton   (rounded components)
        (4) surcharge_per_ton = 0.00 if spec.category == RIPRAP
            else round_half_up(subtotal * surcharge_pct, 2)
            where surcharge_pct = 0.08 if subtotal < 20.00
                                  0.12 if 20.00 <= subtotal < 40.00
                                  0.15 if subtotal >= 40.00
        (5) unit_delivered_per_ton = material_per_ton + freight_per_ton + surcharge_per_ton
        (6) total_usd = round_half_up(unit_delivered_per_ton * quantity_tons, 2)
    input_set: "ProductSpec.base_price_per_ton + category, FreightZone.base_freight_per_ton, SalesOrder.quantity_tons; price-book values as of quote time (at_quote variant) or as re-derived at confirm time before pinning (at_confirm variant)"
    constants:
      VOLUME_TIER_1_MAX: 100
      VOLUME_TIER_2_MAX: 1000
      VOLUME_FACTOR_T1: 1.00
      VOLUME_FACTOR_T2: 0.95
      VOLUME_FACTOR_T3: 0.90
      SURCHARGE_TIER_1_MAX: 20.00
      SURCHARGE_TIER_2_MAX: 40.00
      SURCHARGE_PCT_T1: 0.08
      SURCHARGE_PCT_T2: 0.12
      SURCHARGE_PCT_T3: 0.15
    precision: "all money 2 decimals round_half_up; rounding order pinned in steps (1)-(6): round per component, then sum"
    variants:
      - name: at_quote
        when: "order creation and /reprice"
        difference: "uses the current spec base price and zone rate"
      - name: at_confirm
        when: "/confirm freezes quoted_* (prices_pinned = true)"
        difference: "identical inputs after pinning produce the pinned values even if the price book later changes; a pre-confirm reprice after a price-book change yields different numbers than the original quote"

  - name: royalty_amount
    trigger: "ticket weigh-out (provisional variant); RoyaltyStatement generation (final variant)"
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL variant (ScaleTicket.royalty_provisional_usd, at weigh-out):
        royalty_provisional_usd = round_half_up(net_tons * agreement.base_rate_per_ton, 2)
      FINAL variant (RoyaltyStatement.royalty_due_usd, at generation):
        tickets = COMPLETED (never VOIDED) tickets for the site with completed_at
          in [period_start, period_end), ordered by completed_at ASC, tie-break
          created_at ASC (chronological — order matters because of the YTD tier)
        ytd = ytd_tons_before (sum of tons_sold over same-site non-VOID statements
          with period_start in the same calendar year and strictly earlier
          period_start; tie-break created_at ASC)
        per ticket, in order:
          below = max(0, min(net_tons, agreement.tier_threshold_tons - ytd))
          above = net_tons - below
          ticket_royalty = round_half_up(below * base_rate + above * tier_rate, 2)
          ytd += net_tons
        royalty_due_usd = sum(ticket_royalty)   # per-ticket round, THEN sum — pinned
        tons_sold = sum(net_tons); ytd_tons_after = ytd_tons_before + tons_sold
      Rounding order is pinned: round each ticket's royalty to cents, then sum.
      Summing tons first and rounding once yields different cents and is wrong.
      The two variants diverge exactly when the YTD tier is crossed inside the
      period (provisional never applies the tier rate).
    input_set: "ScaleTickets status == COMPLETED (VOIDED excluded) with completed_at in [period_start, period_end); prior non-VOID statements of same site in same calendar year with earlier period_start"
    precision: "money 2 decimals round_half_up per ticket; tons 3 decimals"
    variants:
      - name: provisional
        when: "weigh-out accrual"
        difference: "flat base rate per ticket, no YTD tier awareness"
      - name: final
        when: "statement generation"
        difference: "marginal tier applied against calendar-year cumulative tonnage; per-ticket rounding then sum"

  - name: stockpile_availability
    trigger: "every mutation of on_hand_tons or reserved_tons (run complete/void, ticket weigh-out/void, adjustment, order confirm/cancel, allocation sweep)"
    algorithm: aggregation
    formula: |
      available_tons = on_hand_tons - reserved_tons   (invariant at all times)
      Order reservation eligibility at /confirm: available_tons >= quantity_tons
      (boundary: equality confirms).
      Allocation sweep (on any stockpile credit):
        eligibility: SalesOrder.status == BACKORDERED, same site_id, same
          product_spec_id as the credited stockpile, stockpile.status == OPEN
        rank: created_at ASC; tie-break quantity_tons ASC, then customer_name ASC
        semantics: strict FIFO — promote (CONFIRM + reserve) while the head of
          the ranked queue fits; stop at the first order that does not fit
          (no skipping).
    input_set: "SalesOrders status BACKORDERED for the site+spec; the credited stockpile"
    precision: "tons 3 decimals"

  - name: disturbed_acreage_and_bond
    trigger: "bench release / mined-out / start-reclamation / complete-reclamation / hold-resume no-ops; bond create/release"
    algorithm: aggregation
    formula: |
      Circular-looking dependency with pinned evaluation order (per request):
        (1) disturbed_acres = sum(Bench.acreage) over benches with status in
            {RELEASED, ON_HOLD, MINED_OUT, RECLAMATION_IN_PROGRESS}
        (2) bond_required_usd = rate * (acres in {RELEASED, ON_HOLD, MINED_OUT})
            + rate * 0.5 * (acres in RECLAMATION_IN_PROGRESS)
        (3) bond_posted_usd = sum(amount_usd - released_usd) over bonds with
            status in {POSTED, PARTIALLY_RELEASED}
        (4) bond_adequacy = ADEQUATE iff bond_posted_usd >= bond_required_usd
        (5) posture per calculations.posture_derivation
      Transition guards (e.g., complete-reclamation requires posture !=
      SUSPENDED) evaluate against the PRE-transition posture; the recompute in
      steps (1)-(5) applies only after the transition commits. Recomputing
      posture with the new acreage BEFORE checking the guard would be the
      circular misreading — the pinned order forbids it.
    input_set: "benches of the site by status; bonds of the site by status"
    precision: "acres 1 decimal; money 2 decimals round_half_up"

  - name: crusher_circuit_yield
    trigger: "PlantRun /complete"
    algorithm: weighted_scoring
    formula: |
      For each output row i: measured_pct_i = round_half_up(100 * tons_i / input_tons, 1)
      design_pct by circuit_line (applies per output spec category):
        PRIMARY:   COARSE 65.0, FINE 35.0, RIPRAP 50.0
        SECONDARY: COARSE 55.0, FINE 45.0, RIPRAP 60.0
      variance_pts_i = round_half_up(measured_pct_i - design_pct_i(category_of_spec_i), 1)
      yield_summary = { spec_code: {measured_pct, design_pct, variance_pts} }
    input_set: "outputs array of the completing run; input_tons > 0"
    constants: {}
    precision: "percents 1 decimal round_half_up"

  - name: scale_net_tons
    trigger: "ScaleTicket weigh-out"
    algorithm: aggregation
    formula: |
      net_tons = round_half_up((gross_lbs - tare_lbs) / 2000, 3)
      tare_variance_pct = round_half_up(abs(tare_lbs - certified_tare_lbs) / certified_tare_lbs * 100, 2)
      variance <= 2.00 passes; > 2.00 requires allow_tare_variance == true.
      royalty_provisional_usd = round_half_up(net_tons * base_rate_per_ton, 2)
    input_set: "ticket gross_lbs, payload tare_lbs, queue entry certified_tare_lbs, active agreement base rate"
    constants:
      LBS_PER_TON: 2000
      TARE_VARIANCE_TOLERANCE_PCT: 2.00
    precision: "net_tons 3 decimals round_half_up; variance 2 decimals"

  - name: gradation_result
    trigger: "GradationTest creation (result computed at create, immutable thereafter)"
    algorithm: threshold
    formula: |
      For every band of the pile's spec: PASS_sieve iff min_pct <= pct_passing <= max_pct
      (INCLUSIVE bounds — a measurement exactly on min_pct or max_pct passes).
      result = PASS iff every band passes, else FAIL.
      sieve_results must cover exactly the spec's band sieves (ERR_INVALID_REQUEST otherwise).
    input_set: "payload sieve_results vs ProductSpec.gradation_bands of the pile's spec"
    precision: "percents compared as given (1 decimal recommended)"

  - name: statement_penalty
    trigger: "POST /royalty-statements/{id}/pay"
    algorithm: threshold
    formula: |
      due_on = issued_on + 30 days
      penalty_usd = 0.00 if paid_on <= due_on
                    else round_half_up(royalty_due_usd * 0.05, 2)
      Boundary: paying exactly on due_on incurs no penalty.
    input_set: "statement issued_on, payload paid_on, royalty_due_usd"
    constants:
      PAYMENT_TERM_DAYS: 30
      LATE_PENALTY_PCT: 0.05
    precision: "money 2 decimals round_half_up"

  - name: queue_dispatch_selector
    trigger: "POST /queue-entries/call-next"
    algorithm: weighted_scoring
    formula: |
      eligibility: entries of the payload site with status == QUEUED
      rank: priority_class CONTRACT > SPOT > INTERNAL
      tie-break: queued_at ASC, then truck_id ASC (string compare; ids are never
        used for business ordering)
      empty pool -> ERR_QUEUE_EMPTY
      The selected entry transitions QUEUED -> AT_SCALE_IN.
    input_set: "TruckQueueEntries of the site with status QUEUED"
    precision: "n/a"

  - name: training_currency
    trigger: "ShotPlan /fire safety check; TrainingRecord read"
    algorithm: threshold
    formula: |
      expires_on = completed_on + 12 months
      is_current = (expires_on >= current logical date)   # inclusive boundary
      Firing requires: exists TrainingRecord with miner_user_id == X-User-ID and
      course_type == TASK_TRAINING and is_current == true.
    input_set: "TrainingRecords matching miner_user_id and course_type"
    precision: "date granularity"

  - name: certification_window
    trigger: "ScaleCalibration create/void; scale checks at ticket weigh-in/out and run start"
    algorithm: threshold
    formula: |
      On PASS calibration create: scale.status = CERTIFIED,
        certified_through = calibrated_on + 180 days (inclusive last valid day)
      On FAIL create: scale.status = OUT_OF_SERVICE
      On void of the latest non-VOIDED PASS: recompute from remaining non-VOIDED
        PASS calibrations (max calibrated_on); OUT_OF_SERVICE if none remain.
      Scale usable iff status == CERTIFIED and certified_through >= current date.
    input_set: "non-VOIDED ScaleCalibrations of the scale"
    precision: "date granularity"

  - name: posture_derivation
    trigger: "citation create/abate/vacate, bond create/release, bench transitions, POST /sites/{id}/recompute-posture"
    algorithm: threshold
    formula: |
      Evaluated after disturbed_acreage_and_bond steps (1)-(4):
        SUSPENDED  if exists MshaCitation of the site with status == ISSUED and
                   s_and_s == true and abatement_due_on < current logical date
        RESTRICTED else if bond_adequacy == DEFICIENT
                   or exists MshaCitation of the site with status == ISSUED
        OPERATING  otherwise
      Posture gates: bench /release and shot /fire require OPERATING; bench
      resume, reclamation start/complete, shot approve/drilling/load, run start,
      ticket weigh-in/out require non-SUSPENDED (see §1.2 preconditions).
      Entering SUSPENDED fires the bench/shotplan hold cascade; leaving
      SUSPENDED fires the MSHA_SUSPENSION-scoped resume cascade.
    input_set: "citations via the site's inspections; bond fields; current logical date"
    precision: "date granularity"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID header present and non-empty", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role is listed in the endpoint's roles (endpoint-level authorization)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: request, check: "Required fields present; types valid; enum values in declared sets; numeric constraints (> 0 etc.) satisfied; sieve_results cover the spec's band sieves", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a body" }
  - { priority: 4, category: existence, check: "Path ids and body FK ids resolve to existing resources, validated left-to-right (path first, then body in input order)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints" }
  - { priority: 5, category: state, check: "Target resource's own state permits the transition (incl. terminal lockdown: no transitions out of terminal states)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action/transition endpoints" }
  - { priority: 6, category: state, check: "Cross-entity posture gate: site posture meets the endpoint's minimum (OPERATING-only: bench release, shot fire; non-SUSPENDED: resume/reclamation/approve/drilling/load/run-start/weigh-in/weigh-out)", error_id: ERR_SITE_POSTURE_BLOCKED, http_status: 409, applies_to: "bench transitions, shot-plan transitions, plant-run start, ticket weigh-in/out" }
  - { priority: 7, category: business_safety, check: "Regulatory gates: firing user holds current TASK_TRAINING (ERR_TRAINING_EXPIRED); bench release keeps disturbed acreage within permitted_acres (ERR_PERMIT_ACREAGE_EXCEEDED)", error_id: "ERR_TRAINING_EXPIRED | ERR_PERMIT_ACREAGE_EXCEEDED", http_status: 409, applies_to: "shot fire; bench release" }
  - { priority: 8, category: business_temporal, check: "Time-window gates: blast window UTC hour in [8,17) (ERR_OUTSIDE_BLAST_WINDOW); scale CERTIFIED with certified_through >= today at weigh-in, weigh-out, run start (ERR_SCALE_NOT_CERTIFIED)", error_id: "ERR_OUTSIDE_BLAST_WINDOW | ERR_SCALE_NOT_CERTIFIED", http_status: 422, applies_to: "shot fire; ticket weigh-in/out; run start" }
  - { priority: 9, category: business_referential, check: "Linked entities in required state: bench RELEASED for shot ops (ERR_BENCH_NOT_RELEASED); muckpile OPEN at run start and remaining_tons sufficient at complete (ERR_MUCKPILE_DEPLETED); stockpile OPEN for confirm/weigh-in/run credit (ERR_STOCKPILE_QUARANTINED); spec ACTIVE (ERR_SPEC_RETIRED); zone ACTIVE (ERR_ZONE_INACTIVE); ACTIVE agreement covering today at weigh-out or period at generate (ERR_ROYALTY_AGREEMENT_REQUIRED); no statement in {DRAFT,ISSUED,PAID} covers voided ticket's completed_at (ERR_STATEMENT_LOCKED); all citations terminal before inspection close (ERR_OPEN_CITATIONS); no live shot plans before mined-out (ERR_ACTIVE_SHOT_PLAN)", error_id: "ERR_BENCH_NOT_RELEASED | ERR_MUCKPILE_DEPLETED | ERR_STOCKPILE_QUARANTINED | ERR_SPEC_RETIRED | ERR_ZONE_INACTIVE | ERR_ROYALTY_AGREEMENT_REQUIRED | ERR_STATEMENT_LOCKED | ERR_OPEN_CITATIONS | ERR_ACTIVE_SHOT_PLAN", http_status: 409, applies_to: "cross-entity gated endpoints" }
  - { priority: 10, category: business_constraint, check: "Uniqueness/overlap/SoD/physical-balance: one stockpile per (site,spec) (ERR_STOCKPILE_EXISTS); one ACTIVE agreement per site (ERR_AGREEMENT_ALREADY_ACTIVE); one active queue entry per truck per site (ERR_TRUCK_ALREADY_QUEUED); statement periods half-open non-overlapping (ERR_STATEMENT_PERIOD_OVERLAP) and generated in chronological order (ERR_STATEMENT_NOT_CHRONOLOGICAL); circuit overlap/30-min cooldown (ERR_CIRCUIT_OVERLAP); bench top-down elevation sequence (ERR_BENCH_SEQUENCE_VIOLATION); SoD same-user bans on approve/confirm/issue (ERR_SOD_VIOLATION, 403); drilled_hole_count >= hole_count (ERR_HOLES_INCOMPLETE, 422); run output balance within 3% inclusive (ERR_OUTPUT_IMBALANCE, 422); tare variance <= 2% unless overridden (ERR_TARE_VARIANCE, 422)", error_id: "ERR_STOCKPILE_EXISTS | ERR_AGREEMENT_ALREADY_ACTIVE | ERR_TRUCK_ALREADY_QUEUED | ERR_STATEMENT_PERIOD_OVERLAP | ERR_STATEMENT_NOT_CHRONOLOGICAL | ERR_CIRCUIT_OVERLAP | ERR_BENCH_SEQUENCE_VIOLATION | ERR_SOD_VIOLATION | ERR_HOLES_INCOMPLETE | ERR_OUTPUT_IMBALANCE | ERR_TARE_VARIANCE", http_status: 409, applies_to: "various" }
  - { priority: 11, category: business_fiscal, check: "Inventory/capacity/money: run credit within stockpile capacity (ERR_STOCKPILE_CAPACITY_EXCEEDED); adjustment may not drop on_hand below reserved (ERR_ADJUSTMENT_BELOW_RESERVED); over-shipment beyond 110% of quantity (ERR_OVER_SHIPMENT); net weight over truck max_payload (ERR_TRUCK_OVERWEIGHT); bond release keeps coverage >= required (ERR_BOND_BELOW_REQUIRED); stockpile close requires zero on_hand and zero reserved (ERR_STOCKPILE_NOT_EMPTY); call-next on empty queue (ERR_QUEUE_EMPTY)", error_id: "ERR_STOCKPILE_CAPACITY_EXCEEDED | ERR_ADJUSTMENT_BELOW_RESERVED | ERR_OVER_SHIPMENT | ERR_TRUCK_OVERWEIGHT | ERR_BOND_BELOW_REQUIRED | ERR_STOCKPILE_NOT_EMPTY | ERR_QUEUE_EMPTY", http_status: 409, applies_to: "various" }
  - { priority: 12, category: concurrency, check: "OCC: expected_<parent>_version equals the parent entity's current version on OCC-guarded writes (evaluated after all state/business checks)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /stockpiles/{id}/adjustments; POST /sales-orders/{id}/reprice; POST /reclamation-bonds/{id}/release" }

# =============================================================================
# §1.5 API Endpoint Table (104 endpoints, flat collections)
# =============================================================================
endpoints:
  # --- QuarrySite ---
  - { method: POST, path: "/sites", description: "Create a quarry site", roles: [QuarryAdmin], code: 201, input: [name, permitted_acres, bond_rate_per_acre_usd], output: QuarrySite, side_effects: ["posture OPERATING; disturbed_acres/bond_required_usd/bond_posted_usd = 0; bond_adequacy ADEQUATE"] }
  - { method: GET, path: "/sites", description: "List sites (paginated)", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["limit?", "offset?"], output: "QuarrySite[]", side_effects: [] }
  - { method: GET, path: "/sites/{id}", description: "Get one site incl. computed posture/bond/acreage fields", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: QuarrySite, side_effects: [] }
  - { method: POST, path: "/sites/{id}/recompute-posture", description: "Re-derive posture/bond fields from current citations, bonds, benches, and the logical clock; fires hold/resume cascades on posture change", roles: [SiteManager, SafetyOfficer], code: 200, input: [], output: QuarrySite, side_effects: ["posture_derivation; entering SUSPENDED auto-holds RELEASED benches and their shot plans; leaving SUSPENDED auto-resumes MSHA_SUSPENSION holds"] }

  # --- Bench ---
  - { method: POST, path: "/benches", description: "Plan a bench (pit/bench plan)", roles: [SiteManager], code: 201, input: [site_id, bench_label, elevation_ft, acreage], output: Bench, side_effects: ["status PLANNED"] }
  - { method: GET, path: "/benches", description: "List benches", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["site_id?", "status?", "limit?", "offset?"], output: "Bench[]", side_effects: [] }
  - { method: GET, path: "/benches/{id}", description: "Get one bench", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: Bench, side_effects: [] }
  - { method: POST, path: "/benches/{id}/release", description: "Release a planned bench for mining (top-down sequence + permit acreage + posture gates)", roles: [SiteManager], code: 200, input: [], output: Bench, side_effects: ["status RELEASED; site disturbed_acres += acreage; bond_required_usd and posture recomputed"] }
  - { method: POST, path: "/benches/{id}/hold", description: "Manually hold a released bench", roles: [SiteManager], code: 200, input: [reason], output: Bench, side_effects: ["status ON_HOLD; hold_reason = reason"] }
  - { method: POST, path: "/benches/{id}/resume", description: "Resume a held bench (blocked while site SUSPENDED)", roles: [SiteManager], code: 200, input: [], output: Bench, side_effects: ["status RELEASED; hold_reason null; ON_HOLD shot plans of this bench resume to hold_return_state"] }
  - { method: POST, path: "/benches/{id}/mark-mined-out", description: "Declare bench mined out (requires no live shot plans)", roles: [SiteManager], code: 200, input: [], output: Bench, side_effects: ["status MINED_OUT; posture recomputed"] }
  - { method: POST, path: "/benches/{id}/start-reclamation", description: "Begin reclamation (acres move to 0.5x bond rate phase)", roles: [SiteManager], code: 200, input: [], output: Bench, side_effects: ["status RECLAMATION_IN_PROGRESS; bond_required_usd recomputed; posture recomputed"] }
  - { method: POST, path: "/benches/{id}/complete-reclamation", description: "Complete reclamation (acres leave disturbed set; may restore bond adequacy)", roles: [SiteManager], code: 200, input: [], output: Bench, side_effects: ["status RECLAIMED; disturbed_acres/bond_required_usd/bond_adequacy/posture recomputed in pinned order"] }

  # --- ShotPlan (drilling program) ---
  - { method: POST, path: "/shot-plans", description: "Create a drill/blast plan on a bench; design tonnage computed", roles: [BlastForeman], code: 201, input: [bench_id, hole_count, burden_ft, spacing_ft, hole_depth_ft, explosive_per_hole_lbs], output: ShotPlan, side_effects: ["status DRAFT; estimated_tons per blast_tonnage_estimate (design variant); drilled_hole_count 0"] }
  - { method: GET, path: "/shot-plans", description: "List shot plans", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["bench_id?", "status?", "limit?", "offset?"], output: "ShotPlan[]", side_effects: [] }
  - { method: GET, path: "/shot-plans/{id}", description: "Get one shot plan", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: ShotPlan, side_effects: [] }
  - { method: POST, path: "/shot-plans/{id}/submit", description: "Submit plan for review", roles: [BlastForeman], code: 200, input: [], output: ShotPlan, side_effects: ["status SUBMITTED; submitted_by_user_id recorded"] }
  - { method: POST, path: "/shot-plans/{id}/approve", description: "Approve plan (SoD: approver != submitter)", roles: [SiteManager], code: 200, input: [], output: ShotPlan, side_effects: ["status APPROVED; approved_by_user_id recorded"] }
  - { method: POST, path: "/shot-plans/{id}/start-drilling", description: "Begin drilling", roles: [BlastForeman], code: 200, input: [], output: ShotPlan, side_effects: ["status DRILLING"] }
  - { method: POST, path: "/shot-plans/{id}/complete-drilling", description: "Report all holes drilled", roles: [BlastForeman], code: 200, input: [drilled_hole_count], output: ShotPlan, side_effects: ["status DRILLED; drilled_hole_count stored"] }
  - { method: POST, path: "/shot-plans/{id}/redrill", description: "Re-open drilling (cave-in/re-drill loop); drilled count resets", roles: [BlastForeman], code: 200, input: [], output: ShotPlan, side_effects: ["status DRILLING; drilled_hole_count = 0"] }
  - { method: POST, path: "/shot-plans/{id}/load", description: "Load explosives", roles: [BlastForeman], code: 200, input: [loaded_explosive_lbs], output: ShotPlan, side_effects: ["status LOADED; powder_factor recomputed from actual load"] }
  - { method: POST, path: "/shot-plans/{id}/fire", description: "Fire the shot (posture OPERATING + current blaster training + blast window); creates the muckpile", roles: [BlastForeman], code: 200, input: [], output: ShotPlan, side_effects: ["status FIRED; fired_at set; Muckpile created OPEN with estimated_tons = plan estimated_tons"] }
  - { method: POST, path: "/shot-plans/{id}/cancel", description: "Cancel a plan from DRAFT/SUBMITTED/APPROVED", roles: [BlastForeman], code: 200, input: [], output: ShotPlan, side_effects: ["status CANCELLED"] }

  # --- Muckpile ---
  - { method: GET, path: "/muckpiles", description: "List muckpiles (reverse-reachability for ShotPlan FK)", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["shot_plan_id?", "status?", "limit?", "offset?"], output: "Muckpile[]", side_effects: [] }
  - { method: GET, path: "/muckpiles/{id}", description: "Get one muckpile", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: Muckpile, side_effects: [] }

  # --- ProductSpec (gradation specs) ---
  - { method: POST, path: "/product-specs", description: "Create a product gradation spec", roles: [QuarryAdmin], code: 201, input: [spec_code, category, gradation_bands, base_price_per_ton], output: ProductSpec, side_effects: ["status ACTIVE"] }
  - { method: GET, path: "/product-specs", description: "List specs", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "ProductSpec[]", side_effects: [] }
  - { method: GET, path: "/product-specs/{id}", description: "Get one spec", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: ProductSpec, side_effects: [] }
  - { method: POST, path: "/product-specs/{id}/retire", description: "Retire a spec (blocks new orders and new plant credit)", roles: [QuarryAdmin], code: 200, input: [], output: ProductSpec, side_effects: ["status RETIRED"] }

  # --- Stockpile ---
  - { method: POST, path: "/stockpiles", description: "Create a stockpile for a spec at a site (unique per site+spec)", roles: [SiteManager], code: 201, input: [site_id, product_spec_id, capacity_tons], output: Stockpile, side_effects: ["status OPEN; on_hand/reserved/available = 0"] }
  - { method: GET, path: "/stockpiles", description: "List stockpiles", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["site_id?", "product_spec_id?", "status?", "limit?", "offset?"], output: "Stockpile[]", side_effects: [] }
  - { method: GET, path: "/stockpiles/{id}", description: "Get one stockpile", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: Stockpile, side_effects: [] }
  - { method: POST, path: "/stockpiles/{id}/adjustments", description: "Manual inventory adjustment (OCC-guarded); positive deltas trigger the backorder allocation sweep", roles: [SiteManager], code: 200, input: [delta_tons, reason, expected_stockpile_version], output: Stockpile, side_effects: ["on_hand_tons += delta_tons; available recomputed; allocation sweep when delta_tons > 0 and status OPEN; version += 1"] }
  - { method: POST, path: "/stockpiles/{id}/close", description: "Close an empty stockpile", roles: [SiteManager], code: 200, input: [], output: Stockpile, side_effects: ["status CLOSED"] }

  # --- GradationTest ---
  - { method: POST, path: "/gradation-tests", description: "Report a sieve analysis on a stockpile; PASS/FAIL computed at create", roles: [QCTechnician], code: 201, input: [stockpile_id, sampled_at, sieve_results], output: GradationTest, side_effects: ["status REPORTED; result computed per gradation_result; reported_by_user_id recorded"] }
  - { method: GET, path: "/gradation-tests", description: "List gradation tests", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["stockpile_id?", "status?", "limit?", "offset?"], output: "GradationTest[]", side_effects: [] }
  - { method: GET, path: "/gradation-tests/{id}", description: "Get one gradation test", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: GradationTest, side_effects: [] }
  - { method: POST, path: "/gradation-tests/{id}/confirm", description: "Confirm a reported test (SoD: confirmer != reporter); FAIL quarantines the pile, PASS may release it", roles: [QCTechnician], code: 200, input: [], output: GradationTest, side_effects: ["status CONFIRMED; stockpile OPEN<->QUARANTINED transition per latest-confirmed selector"] }
  - { method: POST, path: "/gradation-tests/{id}/void", description: "Void a test; quarantine re-evaluated from remaining confirmed tests", roles: [QCTechnician], code: 200, input: [], output: GradationTest, side_effects: ["status VOIDED; stockpile quarantine re-evaluated"] }

  # --- Scale / ScaleCalibration (scale accuracy) ---
  - { method: POST, path: "/scales", description: "Register a truck or belt scale", roles: [QuarryAdmin], code: 201, input: [site_id, scale_code, scale_type], output: Scale, side_effects: ["status OUT_OF_SERVICE until a PASS calibration"] }
  - { method: GET, path: "/scales", description: "List scales", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["site_id?", "scale_type?", "status?", "limit?", "offset?"], output: "Scale[]", side_effects: [] }
  - { method: GET, path: "/scales/{id}", description: "Get one scale", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: Scale, side_effects: [] }
  - { method: POST, path: "/scale-calibrations", description: "Record a calibration; PASS (|as_left| <= 0.25) certifies the scale for 180 days, FAIL takes it out of service", roles: [QuarryAdmin], code: 201, input: [scale_id, calibrated_on, as_found_error_pct, as_left_error_pct], output: ScaleCalibration, side_effects: ["status RECORDED; result computed; scale status/certified_through updated per certification_window"] }
  - { method: GET, path: "/scale-calibrations", description: "List calibrations", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["scale_id?", "status?", "limit?", "offset?"], output: "ScaleCalibration[]", side_effects: [] }
  - { method: GET, path: "/scale-calibrations/{id}", description: "Get one calibration", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: ScaleCalibration, side_effects: [] }
  - { method: POST, path: "/scale-calibrations/{id}/void", description: "Void a calibration (compensation: certification recomputed from remaining calibrations)", roles: [QuarryAdmin], code: 200, input: [], output: ScaleCalibration, side_effects: ["status VOIDED; scale certification recomputed"] }

  # --- PlantRun (run hours & crusher circuit yield) ---
  - { method: POST, path: "/plant-runs", description: "Schedule a plant run drawing a muckpile on a crusher circuit", roles: [PlantOperator], code: 201, input: [site_id, muckpile_id, belt_scale_id, circuit_line], output: PlantRun, side_effects: ["production_status SCHEDULED; reconciliation_status UNRECONCILED"] }
  - { method: GET, path: "/plant-runs", description: "List plant runs", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["site_id?", "muckpile_id?", "belt_scale_id?", "circuit_line?", "production_status?", "limit?", "offset?"], output: "PlantRun[]", side_effects: [] }
  - { method: GET, path: "/plant-runs/{id}", description: "Get one plant run", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: PlantRun, side_effects: [] }
  - { method: POST, path: "/plant-runs/{id}/start", description: "Start a scheduled run (belt scale certified, muckpile OPEN, circuit free with 30-min cooldown)", roles: [PlantOperator], code: 200, input: [], output: PlantRun, side_effects: ["production_status RUNNING; started_at = logical clock"] }
  - { method: POST, path: "/plant-runs/{id}/complete", description: "Close a run with belt input tons and per-stockpile outputs; credits inventory, debits muckpile, computes yield, runs allocation sweep", roles: [PlantOperator], code: 200, input: [input_tons, outputs], output: PlantRun, side_effects: ["production_status COMPLETED; ended_at/run_hours; muckpile debit (+auto-DEPLETED at 0); stockpile credits; yield_summary; backorder allocation sweep"] }
  - { method: POST, path: "/plant-runs/{id}/reconcile", description: "Reconcile belt input against an independent figure; within 2% -> RECONCILED, else DISPUTED (threshold branch, not an error)", roles: [PlantOperator], code: 200, input: [reconciled_input_tons], output: PlantRun, side_effects: ["reconciliation_status RECONCILED or DISPUTED"] }
  - { method: POST, path: "/plant-runs/{id}/void", description: "Void a COMPLETED-but-UNRECONCILED run; reverses all credits and restores the muckpile", roles: [PlantOperator], code: 200, input: [], output: PlantRun, side_effects: ["production_status VOIDED; stockpile credits reversed; muckpile restored (DEPLETED may reopen to OPEN)"] }
  - { method: POST, path: "/plant-runs/{id}/cancel", description: "Cancel a SCHEDULED run", roles: [PlantOperator], code: 200, input: [], output: PlantRun, side_effects: ["production_status CANCELLED"] }

  # --- FreightZone ---
  - { method: POST, path: "/freight-zones", description: "Create a freight-inclusive pricing zone", roles: [QuarryAdmin], code: 201, input: [zone_code, distance_miles, base_freight_per_ton], output: FreightZone, side_effects: ["status ACTIVE"] }
  - { method: GET, path: "/freight-zones", description: "List zones", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "FreightZone[]", side_effects: [] }
  - { method: GET, path: "/freight-zones/{id}", description: "Get one zone", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: FreightZone, side_effects: [] }
  - { method: POST, path: "/freight-zones/{id}/deactivate", description: "Deactivate a zone (blocks new orders; pinned quotes unaffected)", roles: [QuarryAdmin], code: 200, input: [], output: FreightZone, side_effects: ["status INACTIVE"] }

  # --- SalesOrder ---
  - { method: POST, path: "/sales-orders", description: "Create a quote (delivered price computed from spec/zone price book)", roles: [SalesAgent], code: 201, input: [site_id, product_spec_id, freight_zone_id, customer_name, quantity_tons], output: SalesOrder, side_effects: ["status QUOTED; quoted_* computed per delivered_price_quote; fulfilled_tons 0; prices_pinned false"] }
  - { method: GET, path: "/sales-orders", description: "List orders", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["site_id?", "product_spec_id?", "freight_zone_id?", "stockpile_id?", "status?", "limit?", "offset?"], output: "SalesOrder[]", side_effects: [] }
  - { method: GET, path: "/sales-orders/{id}", description: "Get one order", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: SalesOrder, side_effects: [] }
  - { method: POST, path: "/sales-orders/{id}/confirm", description: "Confirm a quote: pins prices, resolves stockpile, reserves tons if available else BACKORDERED", roles: [SalesAgent], code: 200, input: [], output: SalesOrder, side_effects: ["status CONFIRMED (+ reservation) or BACKORDERED; prices_pinned = true; stockpile_id resolved"] }
  - { method: POST, path: "/sales-orders/{id}/cancel", description: "Cancel an order; releases the unfulfilled reservation", roles: [SalesAgent], code: 200, input: [], output: SalesOrder, side_effects: ["status CANCELLED; reserved_tons compensation per state"] }
  - { method: POST, path: "/sales-orders/{id}/reprice", description: "Re-quote a QUOTED order from the current price book (OCC-guarded)", roles: [SalesAgent], code: 200, input: [expected_sales_order_version], output: SalesOrder, side_effects: ["quoted_* recomputed; version += 1"] }

  # --- ScaleTicket (scale-house ticketing) ---
  - { method: POST, path: "/scale-tickets", description: "Weigh-in: open a ticket for a queue entry called to the scale", roles: [ScaleHouseOperator], code: 201, input: [queue_entry_id, sales_order_id, scale_id, gross_lbs], output: ScaleTicket, side_effects: ["status OPEN; site_id/stockpile_id/truck_id copied; queue entry AT_SCALE_IN -> LOADING"] }
  - { method: GET, path: "/scale-tickets", description: "List tickets", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["site_id?", "sales_order_id?", "stockpile_id?", "scale_id?", "queue_entry_id?", "status?", "limit?", "offset?"], output: "ScaleTicket[]", side_effects: [] }
  - { method: GET, path: "/scale-tickets/{id}", description: "Get one ticket", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: ScaleTicket, side_effects: [] }
  - { method: POST, path: "/scale-tickets/{id}/weigh-out", description: "Weigh-out: capture tare, compute net tons, draw stockpile, fulfill order, accrue provisional royalty, exit truck", roles: [ScaleHouseOperator], code: 200, input: [tare_lbs, "allow_tare_variance?"], output: ScaleTicket, side_effects: ["status COMPLETED; net_tons/tare_variance_pct/royalty_provisional_usd computed; stockpile on_hand -= net; order fulfilled += net (auto IN_FULFILLMENT/COMPLETED); reserved recomputed; queue entry -> EXITED"] }
  - { method: POST, path: "/scale-tickets/{id}/void", description: "Void a completed ticket (blocked once a live statement covers its date); full compensation", roles: [SiteManager], code: 200, input: [void_reason], output: ScaleTicket, side_effects: ["status VOIDED; stockpile on_hand += net; order fulfilled -= net (COMPLETED may revert to IN_FULFILLMENT); reserved recomputed"] }

  # --- RoyaltyAgreement ---
  - { method: POST, path: "/royalty-agreements", description: "Create the landowner royalty agreement for a site (one ACTIVE per site)", roles: [FinanceClerk], code: 201, input: [site_id, landowner_name, base_rate_per_ton, tier_threshold_tons, tier_rate_per_ton, effective_from], output: RoyaltyAgreement, side_effects: ["status ACTIVE"] }
  - { method: GET, path: "/royalty-agreements", description: "List agreements", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["site_id?", "supersedes_agreement_id?", "status?", "limit?", "offset?"], output: "RoyaltyAgreement[]", side_effects: [] }
  - { method: GET, path: "/royalty-agreements/{id}", description: "Get one agreement", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: RoyaltyAgreement, side_effects: [] }
  - { method: POST, path: "/royalty-agreements/{id}/amendments", description: "Amend an ACTIVE agreement: creates the superseding ACTIVE version (create-with-supersede)", roles: [FinanceClerk], code: 201, input: [base_rate_per_ton, tier_threshold_tons, tier_rate_per_ton, effective_from], output: RoyaltyAgreement, side_effects: ["old agreement SUPERSEDED with effective_to = new effective_from and version += 1; new agreement ACTIVE with supersedes_agreement_id = old id"] }
  - { method: POST, path: "/royalty-agreements/{id}/terminate", description: "Terminate an ACTIVE agreement", roles: [FinanceClerk], code: 200, input: [], output: RoyaltyAgreement, side_effects: ["status TERMINATED"] }

  # --- RoyaltyStatement (royalty per ton) ---
  - { method: POST, path: "/royalty-statements", description: "Generate the statement for a period: chronological per-ticket marginal-tier royalty, rounded per ticket then summed", roles: [FinanceClerk], code: 201, input: [site_id, period_start, period_end], output: RoyaltyStatement, side_effects: ["status DRAFT; royalty_agreement_id pinned to ACTIVE agreement; tons_sold/ytd_tons_before/ytd_tons_after/royalty_due_usd computed per royalty_amount (final variant); generated_by_user_id recorded"] }
  - { method: GET, path: "/royalty-statements", description: "List statements", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["site_id?", "royalty_agreement_id?", "status?", "limit?", "offset?"], output: "RoyaltyStatement[]", side_effects: [] }
  - { method: GET, path: "/royalty-statements/{id}", description: "Get one statement", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: RoyaltyStatement, side_effects: [] }
  - { method: POST, path: "/royalty-statements/{id}/issue", description: "Issue a DRAFT statement (SoD: issuer != generator)", roles: [SiteManager], code: 200, input: [], output: RoyaltyStatement, side_effects: ["status ISSUED; issued_on = logical date; due_on = issued_on + 30 days"] }
  - { method: POST, path: "/royalty-statements/{id}/pay", description: "Record payment; late payment accrues 5% penalty", roles: [FinanceClerk], code: 200, input: [paid_on], output: RoyaltyStatement, side_effects: ["status PAID; penalty_usd per statement_penalty"] }
  - { method: POST, path: "/royalty-statements/{id}/void", description: "Void a DRAFT statement so the period can be regenerated", roles: [FinanceClerk], code: 200, input: [], output: RoyaltyStatement, side_effects: ["status VOID; excluded from later ytd_tons_before"] }

  # --- MSHA inspection / citations ---
  - { method: POST, path: "/msha-inspections", description: "Open an MSHA inspection", roles: [SafetyOfficer], code: 201, input: [site_id, inspection_type], output: MshaInspection, side_effects: ["status OPEN; opened_on = logical date"] }
  - { method: GET, path: "/msha-inspections", description: "List inspections", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["site_id?", "status?", "limit?", "offset?"], output: "MshaInspection[]", side_effects: [] }
  - { method: GET, path: "/msha-inspections/{id}", description: "Get one inspection", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: MshaInspection, side_effects: [] }
  - { method: POST, path: "/msha-inspections/{id}/close", description: "Close an inspection (requires all citations terminal)", roles: [SafetyOfficer], code: 200, input: [], output: MshaInspection, side_effects: ["status CLOSED; closed_on set"] }
  - { method: POST, path: "/msha-citations", description: "Issue a citation under an open inspection; an already-overdue S&S citation suspends the site immediately", roles: [SafetyOfficer], code: 201, input: [msha_inspection_id, citation_code, s_and_s, abatement_due_on], output: MshaCitation, side_effects: ["status ISSUED; site posture recomputed; entering SUSPENDED fires the bench/shotplan hold cascade"] }
  - { method: GET, path: "/msha-citations", description: "List citations", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["msha_inspection_id?", "status?", "limit?", "offset?"], output: "MshaCitation[]", side_effects: [] }
  - { method: GET, path: "/msha-citations/{id}", description: "Get one citation", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: MshaCitation, side_effects: [] }
  - { method: POST, path: "/msha-citations/{id}/abate", description: "Abate a citation; posture recomputed (may lift SUSPENDED and fire resume cascade)", roles: [SafetyOfficer], code: 200, input: [abated_on], output: MshaCitation, side_effects: ["status ABATED; abated_on stored; posture recompute + resume cascade"] }
  - { method: POST, path: "/msha-citations/{id}/vacate", description: "Vacate a citation; posture recomputed", roles: [SafetyOfficer], code: 200, input: [], output: MshaCitation, side_effects: ["status VACATED; posture recompute + resume cascade"] }

  # --- TrainingRecord ---
  - { method: POST, path: "/training-records", description: "Record MSHA Part 46 training; expires_on = completed_on + 12 months", roles: [SafetyOfficer], code: 201, input: [miner_name, miner_user_id, course_type, completed_on], output: TrainingRecord, side_effects: ["expires_on computed; is_current vs logical clock"] }
  - { method: GET, path: "/training-records", description: "List training records", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["miner_user_id?", "course_type?", "limit?", "offset?"], output: "TrainingRecord[]", side_effects: [] }
  - { method: GET, path: "/training-records/{id}", description: "Get one training record", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: TrainingRecord, side_effects: [] }

  # --- ReclamationBond ---
  - { method: POST, path: "/reclamation-bonds", description: "Post a surety bond instrument", roles: [FinanceClerk], code: 201, input: [site_id, surety_name, amount_usd], output: ReclamationBond, side_effects: ["status POSTED; released_usd 0; site bond_posted_usd/adequacy/posture recomputed"] }
  - { method: GET, path: "/reclamation-bonds", description: "List bonds", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["site_id?", "status?", "limit?", "offset?"], output: "ReclamationBond[]", side_effects: [] }
  - { method: GET, path: "/reclamation-bonds/{id}", description: "Get one bond", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: ReclamationBond, side_effects: [] }
  - { method: POST, path: "/reclamation-bonds/{id}/release", description: "Release bond amount (coverage must stay >= bond_required_usd; OCC-guarded)", roles: [FinanceClerk], code: 200, input: [release_amount_usd, expected_reclamation_bond_version], output: ReclamationBond, side_effects: ["released_usd += amount; status PARTIALLY_RELEASED or FULLY_RELEASED at equality; version += 1; site recomputed"] }

  # --- TruckQueueEntry (haul-truck queue) ---
  - { method: POST, path: "/queue-entries", description: "Truck arrival: join the scale-house queue (one active entry per truck per site)", roles: [ScaleHouseOperator], code: 201, input: [site_id, truck_id, priority_class, certified_tare_lbs, max_payload_lbs], output: TruckQueueEntry, side_effects: ["status QUEUED; queued_at = logical clock"] }
  - { method: GET, path: "/queue-entries", description: "List queue entries", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: ["site_id?", "scale_ticket_id?", "truck_id?", "status?", "limit?", "offset?"], output: "TruckQueueEntry[]", side_effects: [] }
  - { method: GET, path: "/queue-entries/{id}", description: "Get one queue entry", roles: [QuarryAdmin, SiteManager, BlastForeman, PlantOperator, ScaleHouseOperator, QCTechnician, SalesAgent, FinanceClerk, SafetyOfficer], code: 200, input: [], output: TruckQueueEntry, side_effects: [] }
  - { method: POST, path: "/queue-entries/call-next", description: "Dispatch the next truck per the queue_dispatch_selector (priority class, then queued_at, then truck_id)", roles: [ScaleHouseOperator], code: 200, input: [site_id], output: TruckQueueEntry, side_effects: ["selected entry QUEUED -> AT_SCALE_IN"] }
  - { method: POST, path: "/queue-entries/{id}/begin-scale-out", description: "Loaded truck proceeds to the outbound scale", roles: [ScaleHouseOperator], code: 200, input: [], output: TruckQueueEntry, side_effects: ["status LOADING -> AT_SCALE_OUT"] }
  - { method: POST, path: "/queue-entries/{id}/mark-no-show", description: "Mark a QUEUED truck as no-show", roles: [ScaleHouseOperator], code: 200, input: [], output: TruckQueueEntry, side_effects: ["status NO_SHOW"] }

  # --- Test-driving logical clock (outside the business surface) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (ISO8601). Default at server startup before any set call is exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to wall-clock time. All date/time-dependent rules (blast window, certification windows, training expiry, statement periods, citation overdue) read this clock.", roles: [QuarryAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced; no automatic recomputes — use /sites/{id}/recompute-posture to re-derive posture after clock moves"] }

# =============================================================================
# §1.6 Error Code Catalog (40 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role missing/unknown or X-User-ID missing" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, enum outside declared set, non-positive number, or sieve_results not covering the spec bands" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not resolve (checked left-to-right)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's own state does not permit the transition (incl. terminal lockdown)" }
  - { id: ERR_SITE_POSTURE_BLOCKED, http: 409, condition: "Site posture below the endpoint's minimum (OPERATING-only or non-SUSPENDED gate)" }
  - { id: ERR_TRAINING_EXPIRED, http: 409, condition: "Firing user lacks a current TASK_TRAINING record" }
  - { id: ERR_PERMIT_ACREAGE_EXCEEDED, http: 409, condition: "Bench release would push disturbed_acres beyond permitted_acres" }
  - { id: ERR_OUTSIDE_BLAST_WINDOW, http: 422, condition: "Fire attempted outside UTC hour [8,17)" }
  - { id: ERR_SCALE_NOT_CERTIFIED, http: 409, condition: "Scale not CERTIFIED or certified_through before current date at weigh-in/weigh-out/run start" }
  - { id: ERR_BENCH_NOT_RELEASED, http: 409, condition: "Shot-plan operation requires bench status RELEASED" }
  - { id: ERR_BENCH_SEQUENCE_VIOLATION, http: 409, condition: "Releasing a bench while a higher-elevation bench of the site is not yet MINED_OUT/RECLAMATION_IN_PROGRESS/RECLAIMED" }
  - { id: ERR_ACTIVE_SHOT_PLAN, http: 409, condition: "mark-mined-out while a shot plan on the bench is in {APPROVED, DRILLING, DRILLED, LOADED, ON_HOLD}" }
  - { id: ERR_HOLES_INCOMPLETE, http: 422, condition: "complete-drilling with drilled_hole_count < hole_count" }
  - { id: ERR_MUCKPILE_DEPLETED, http: 409, condition: "Run start on a DEPLETED muckpile, or run complete with input_tons > remaining_tons" }
  - { id: ERR_STOCKPILE_EXISTS, http: 409, condition: "Second stockpile for the same (site_id, product_spec_id)" }
  - { id: ERR_STOCKPILE_QUARANTINED, http: 409, condition: "Order confirm, ticket weigh-in, or run output credit against a QUARANTINED stockpile" }
  - { id: ERR_STOCKPILE_NOT_EMPTY, http: 409, condition: "Close with on_hand_tons != 0 or reserved_tons != 0" }
  - { id: ERR_STOCKPILE_CAPACITY_EXCEEDED, http: 409, condition: "Run credit or adjustment would push on_hand_tons above capacity_tons" }
  - { id: ERR_ADJUSTMENT_BELOW_RESERVED, http: 409, condition: "Negative adjustment would drop on_hand_tons below reserved_tons" }
  - { id: ERR_SPEC_RETIRED, http: 409, condition: "Order create/confirm or run output credit against a RETIRED spec" }
  - { id: ERR_ZONE_INACTIVE, http: 409, condition: "Order create/confirm against an INACTIVE freight zone" }
  - { id: ERR_OVER_SHIPMENT, http: 409, condition: "Weigh-out would push fulfilled_tons beyond round(quantity_tons x 1.10, 3)" }
  - { id: ERR_TRUCK_OVERWEIGHT, http: 422, condition: "gross_lbs - tare_lbs exceeds the truck's max_payload_lbs" }
  - { id: ERR_TARE_VARIANCE, http: 422, condition: "Observed tare differs from certified tare by > 2% without allow_tare_variance" }
  - { id: ERR_STATEMENT_LOCKED, http: 409, condition: "Voiding a ticket whose completed_at falls in a statement period with status DRAFT/ISSUED/PAID" }
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 409, condition: "New statement period overlaps an existing non-VOID statement (half-open comparison)" }
  - { id: ERR_STATEMENT_NOT_CHRONOLOGICAL, http: 409, condition: "New statement period_start earlier than an existing non-VOID statement's period_end for the site" }
  - { id: ERR_ROYALTY_AGREEMENT_REQUIRED, http: 409, condition: "No ACTIVE agreement covers the weigh-out date or the statement period" }
  - { id: ERR_AGREEMENT_ALREADY_ACTIVE, http: 409, condition: "Creating an agreement while the site already has an ACTIVE one (use amendments)" }
  - { id: ERR_BOND_BELOW_REQUIRED, http: 409, condition: "Bond release would leave bond_posted_usd below bond_required_usd" }
  - { id: ERR_OPEN_CITATIONS, http: 409, condition: "Inspection close while any citation is still ISSUED" }
  - { id: ERR_OUTPUT_IMBALANCE, http: 422, condition: "Run outputs diverge from input_tons by more than 3% (inclusive tolerance)" }
  - { id: ERR_CIRCUIT_OVERLAP, http: 409, condition: "Another run RUNNING on the same circuit, or last COMPLETED run ended < 30 minutes ago (cooldown)" }
  - { id: ERR_TRUCK_ALREADY_QUEUED, http: 409, condition: "Truck already has an active queue entry (QUEUED/AT_SCALE_IN/LOADING/AT_SCALE_OUT) at the site" }
  - { id: ERR_QUEUE_EMPTY, http: 409, condition: "call-next with no QUEUED entries for the site" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: approver==submitter, confirmer==reporter, or issuer==generator (same X-User-ID)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_REVERSAL_BLOCKED, http: 409, condition: "Run void would drive a credited stockpile's on_hand_tons below zero (tons already shipped)" }

# =============================================================================
# §1.7 RBAC Matrix (all roles opaque; SoD enforced by X-User-ID comparison)
# =============================================================================
roles:
  - name: QuarryAdmin
    description: "Platform/configuration operator: sites, specs, zones, scales, calibrations, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /sites; POST /product-specs (+/retire); POST /freight-zones (+/deactivate); POST /scales; POST /scale-calibrations (+/void); POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: SiteManager
    description: "Quarry manager: bench lifecycle, shot-plan approval, stockpile administration, ticket voids, statement issue, posture recompute"
    identity: opaque
    exclusive_operations:
      - "POST /benches (+ release/hold/resume/mark-mined-out/start-reclamation/complete-reclamation); POST /shot-plans/{id}/approve; POST /stockpiles (+/adjustments, /close); POST /scale-tickets/{id}/void; POST /royalty-statements/{id}/issue"
    shared_operations: ["all GET endpoints", "POST /sites/{id}/recompute-posture (with SafetyOfficer)"]
  - name: BlastForeman
    description: "Drill-and-blast foreman: shot plan creation and field advancement through firing"
    identity: opaque
    exclusive_operations:
      - "POST /shot-plans (+ submit/start-drilling/complete-drilling/redrill/load/fire/cancel)"
    shared_operations: ["all GET endpoints"]
  - name: PlantOperator
    description: "Crusher plant operator: plant run lifecycle and reconciliation"
    identity: opaque
    exclusive_operations:
      - "POST /plant-runs (+ start/complete/reconcile/void/cancel)"
    shared_operations: ["all GET endpoints"]
  - name: ScaleHouseOperator
    description: "Scale-house clerk: truck queue dispatch, weigh-in, weigh-out"
    identity: opaque
    exclusive_operations:
      - "POST /queue-entries (+ call-next, begin-scale-out, mark-no-show); POST /scale-tickets; POST /scale-tickets/{id}/weigh-out"
    shared_operations: ["all GET endpoints"]
  - name: QCTechnician
    description: "Quality-control technician: gradation sampling and confirmation (SoD: confirmer != reporter)"
    identity: opaque
    exclusive_operations:
      - "POST /gradation-tests (+ confirm, void)"
    shared_operations: ["all GET endpoints"]
  - name: SalesAgent
    description: "Sales desk: quotes, confirmation, cancellation, repricing"
    identity: opaque
    exclusive_operations:
      - "POST /sales-orders (+ confirm, cancel, reprice)"
    shared_operations: ["all GET endpoints"]
  - name: FinanceClerk
    description: "Finance: royalty agreements and amendments, statement generation/payment/void, reclamation bonds"
    identity: opaque
    exclusive_operations:
      - "POST /royalty-agreements (+ amendments, terminate); POST /royalty-statements (+ pay, void); POST /reclamation-bonds (+ release)"
    shared_operations: ["all GET endpoints"]
  - name: SafetyOfficer
    description: "MSHA compliance: inspections, citations, training records"
    identity: opaque
    exclusive_operations:
      - "POST /msha-inspections (+ close); POST /msha-citations (+ abate, vacate); POST /training-records"
    shared_operations: ["all GET endpoints", "POST /sites/{id}/recompute-posture (with SiteManager)"]




