        distinguishing_aspect: "After an IVT-breach auto-pause, RESUME fails with ERR_FRAUD_HOLD while fraud_posture == BREACH; CLEAR_FRAUD (self-transition) then RESUME succeeds and paused creatives return to LIVE."
