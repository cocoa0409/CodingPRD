      - name: endpoint_waitlist_entry_reachable_from_both_parents
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_svh_care_units_id_waitlist_entries
          - endpoints.GET_svh_applicants_id_waitlist_entries
          - calculations.waitlist_queue_order
        distinguishing_aspect: |
          One WaitlistEntry row is reachable from both of its parents and the two reverse reads use
          DIFFERENT orderings: the applicant-scoped list is listed_at ASC then created_at ASC (so the
          unit-1 entry leads), while the unit-scoped list is queue_position ASC (so the CLASS_1
          applicant scoring 1280 leads the CLASS_4 applicant scoring 105 even though the CLASS_4 entry
          was created first). A single shared ordering would put the wrong row at index 0 in exactly
          one of the two reads.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with two CERTIFIED NURSING units, Nursing A and Nursing B, each licensed_bed_count 2."
            - "Applicant Ada (service_connected_disability_pct 80, wartime, 8 years residency) is ELIGIBLE and queues on Nursing A first, then on Nursing B."
            - "Applicant Bo (service_connected_disability_pct 0, no wartime service, 1 year residency) is ELIGIBLE and queues on Nursing B BEFORE Ada does."
            - "No clinical assessments are submitted, so acuity_pts is 0 for both, and the clock equals both application_received_dates so tenure_pts is 0."
