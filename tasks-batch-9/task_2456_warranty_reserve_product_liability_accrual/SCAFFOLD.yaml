# =============================================================================
# task_2456 — Warranty Reserve & Product Liability Accrual
# Durable-goods manufacturer finance: warranty accrual, campaign/recall specific
# accruals, extended service contract deferral, supplier recovery, product
# liability IBNR reserve, and reserve rollforward disclosure.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2456. Warranty Reserve & Product Liability Accrual (durable goods manufacturer finance): warranty accrual estimation from historical claim rates by product family, vintage and failure mode with cost per claim, new product launch accrual with limited history using engineering estimates and analogous product data, reserve adequacy analysis with actual-versus-expected claim development and trend adjustment, specific accruals for known campaigns, recalls and field actions with cost estimates by remedy option, extended service contract revenue deferral and recognition separate from base warranty accrual, supplier recovery estimation where a component defect drives claims with recovery collectability assessment, product liability reserve for asserted and incurred-but-not-reported claims with actuarial input, disclosure of warranty reserve rollforward and significant campaign exposures

domain_name: warranty-reserve-liability-accrual
api_prefix: /warranty

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is addressed at `/warranty/<collection>/{id}`; parentage is
  # expressed exclusively through FK body fields, never through nested URLs.

  state_machine_shape: cyclic
  # AccrualPeriod (ACTUARIAL_REVIEW -> ANALYSIS_LOCKED), WarrantyAccrual
  # (PROPOSED -> DRAFT), SupplierRecovery (NEGOTIATION -> ASSERTED) and
  # LiabilityReserve (ACTUARY_REVIEWED -> DRAFT) all loop backwards; FieldAction
  # additionally carries two independent state dimensions on one row
  # (approval_state x execution_state).

  relationship_patterns:
    - one_to_many
    - self_referential   # ProductFamily.analog_family_id -> ProductFamily.id
    - cross_aggregate    # SupplierRecovery spans Supplier / FailureMode / FieldAction

  role_model: segregation_of_duties
  # The user who proposes an accrual may not post it; the user who submits a
  # field action may not decide it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 59 endpoints / 38 error codes / 11 calculations (3 dual-variant)
  # / 6 state machines / 3 OCC rules.

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AccrualPeriod
    parent: null
    common_fields: true
    fields:
      - { name: period_code, type: string, source: input, description: "Fiscal period code, format `YYYY-QN`", constraints: "unique across all AccrualPeriod rows; lexical order equals chronological order" }
      - { name: period_start_date, type: string, source: input, description: "First calendar day of the period, `YYYY-MM-DD`" }
      - { name: period_end_date, type: string, source: input, description: "Last calendar day of the period, `YYYY-MM-DD`", constraints: "must be strictly after period_start_date" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ANALYSIS_LOCKED | ACTUARIAL_REVIEW | CLOSED" }
      - { name: locked_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent OPEN->ANALYSIS_LOCKED transition" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the ACTUARIAL_REVIEW->CLOSED transition" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of ACTUARIAL_REVIEW->ANALYSIS_LOCKED reopen transitions executed on this period" }
      - { name: rollforward_generated, type: boolean, source: computed, default: false, description: "True once at least one ReserveRollforward row exists with period_id == this period" }
      - { name: significant_exposure_count, type: integer, source: computed, default: 0, description: "Count of FieldAction rows with approved_period_id == this period, approval_state == APPROVED and specific_accrual_cents >= SIGNIFICANT_EXPOSURE_THRESHOLD_CENTS" }
      - { name: requires_significant_exposure_disclosure, type: boolean, source: computed, default: false, description: "True when significant_exposure_count >= 1" }

  - name: ProductFamily
    parent: null
    common_fields: true
    fields:
      - { name: family_code, type: string, source: input, description: "Product family code", constraints: "unique across all ProductFamily rows" }
      - { name: name, type: string, source: input, description: "Human-readable family name" }
      - { name: launch_date, type: string, source: input, description: "First customer shipment date, `YYYY-MM-DD`" }
      - { name: base_warranty_months, type: integer, source: input, description: "Length of the base (non-extended) warranty in months", constraints: ">= 1" }
      - { name: standard_cost_per_claim_cents, type: integer, source: input, description: "Family-level standard cost per warranty claim, used by the ANALOG_BLEND accrual variant", constraints: ">= 1" }
      - { name: engineering_estimate_rate_ppm, type: integer, source: input, default: null, description: "Engineering-estimated lifetime claim rate in claims per million units; required for ANALOG_BLEND accruals", constraints: "null or >= 0" }
      - { name: analog_family_id, type: string, source: input, default: null, description: "FK -> ProductFamily.id; analogous predecessor family whose observed lifetime claim rate feeds the ANALOG_BLEND variant", constraints: "null, or an existing ProductFamily.id that is not this row's own id" }
      - { name: reserve_cap_cents, type: integer, source: input, description: "Governance ceiling on warranty_reserve_balance_cents for this family", constraints: ">= 1" }
      - { name: observed_history_months, type: integer, source: computed, default: 0, description: "max(ClaimObservation.months_in_service_to) across all ClaimObservation rows whose vintage belongs to this family; 0 when none exist" }
      - { name: observed_exposure_units, type: integer, source: computed, default: 0, description: "Sum of ProductVintage.units_shipped over vintages with family_id == this family and exposure_status IN {ACTIVE, EXPIRED}" }
      - { name: units_sold_lifetime, type: integer, source: computed, default: 0, description: "Alias metric equal to observed_exposure_units; used by the product-liability IBNR exposure floor" }
      - { name: history_maturity_status, type: enum, source: computed, default: LIMITED, description: "LIMITED | MATURE — output of calculations.history_maturity_classification" }
      - { name: warranty_reserve_balance_cents, type: integer, source: computed, default: 0, description: "Output of calculations.family_reserve_balance" }
      - { name: reserve_posture, type: enum, source: computed, default: NORMAL, description: "NORMAL | ELEVATED | CONSTRAINED — output of calculations.family_reserve_posture" }

  - name: ProductVintage
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> ProductFamily.id; product family this production cohort belongs to" }
      - { name: vintage_code, type: string, source: input, description: "Production cohort code (e.g. model year `MY2024`)", constraints: "unique within family_id" }
      - { name: units_shipped, type: integer, source: input, description: "Units shipped in this cohort; the exposure denominator for claim rates", constraints: ">= 1" }
      - { name: ship_period_code, type: string, source: input, description: "period_code of the AccrualPeriod in which the cohort shipped, `YYYY-QN`" }
      - { name: warranty_expiry_date, type: string, source: input, description: "Calendar date on which base warranty coverage ends for this cohort, `YYYY-MM-DD`" }
      - { name: exposure_status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE when logical_now < warranty_expiry_date, otherwise EXPIRED; recomputed on ProductVintage create and on every POST /warranty/_clock/set_current_utc" }

  - name: FailureMode
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> ProductFamily.id; family whose design exhibits this failure mode" }
      - { name: mode_code, type: string, source: input, description: "Failure mode code", constraints: "unique within family_id" }
      - { name: description, type: string, source: input, description: "Engineering description of the failure mode" }
      - { name: severity, type: enum, source: input, description: "COSMETIC | FUNCTIONAL | SAFETY" }
      - { name: cost_per_claim_cents, type: integer, source: input, description: "Average total cost to remedy one claim of this failure mode", constraints: ">= 1" }
      - { name: supplier_id, type: string, source: input, default: null, description: "FK -> Supplier.id; component supplier whose defect drives this failure mode; null when the root cause is in-house" }

  - name: ClaimObservation
    parent: null
    common_fields: false
    fields:
      - { name: vintage_id, type: string, source: input, description: "FK -> ProductVintage.id; cohort the observed claims came from" }
      - { name: failure_mode_id, type: string, source: input, description: "FK -> FailureMode.id; failure mode the observed claims were coded to" }
      - { name: observation_period_code, type: string, source: input, description: "period_code of the AccrualPeriod in which these claims were paid, `YYYY-QN`" }
      - { name: months_in_service_from, type: integer, source: input, description: "Inclusive lower bound of the months-in-service development bucket", constraints: ">= 0" }
      - { name: months_in_service_to, type: integer, source: input, description: "Exclusive upper bound of the months-in-service development bucket", constraints: "> months_in_service_from" }
      - { name: claim_count, type: integer, source: input, description: "Number of claims observed in this bucket", constraints: ">= 0" }
      - { name: paid_cost_cents, type: integer, source: input, description: "Cash cost actually paid for those claims", constraints: ">= 0" }

  - name: WarrantyAccrual
    parent: null
    common_fields: true
    fields:
      - { name: period_id, type: string, source: input, description: "FK -> AccrualPeriod.id; period in which the accrual is being estimated" }
      - { name: vintage_id, type: string, source: input, description: "FK -> ProductVintage.id; cohort being accrued for" }
      - { name: method, type: enum, source: input, description: "HISTORICAL_RATE | ANALOG_BLEND — selects the calculations.warranty_accrual_amount variant" }
      - { name: elapsed_exposure_bps, type: integer, source: input, description: "Fraction of the cohort's warranty exposure already earned, in basis points", constraints: "0 <= elapsed_exposure_bps <= 10000" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PROPOSED | POSTED | SUPERSEDED" }
      - { name: revision_index, type: integer, source: system, default: 0, description: "Number of PROPOSED->DRAFT revise transitions executed on this row" }
      - { name: expected_claim_rate_ppm, type: integer, source: computed, default: 0, description: "Lifetime claim rate in claims per million units used by the selected variant" }
      - { name: cost_per_claim_basis_cents, type: integer, source: computed, default: 0, description: "Cost-per-claim basis applied: FailureMode.cost_per_claim_cents weighted for HISTORICAL_RATE, ProductFamily.standard_cost_per_claim_cents for ANALOG_BLEND" }
      - { name: paid_to_date_cents, type: integer, source: computed, default: 0, description: "Sum of ClaimObservation.paid_cost_cents over all observations of this accrual's vintage_id" }
      - { name: accrued_amount_cents, type: integer, source: computed, default: 0, description: "Output of calculations.warranty_accrual_amount, floored at 0" }
      - { name: proposed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the WarrantyAnalyst who executed the most recent DRAFT->PROPOSED transition" }
      - { name: posted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ReserveController who executed PROPOSED->POSTED" }

  - name: AdequacyReview
    parent: null
    common_fields: true
    fields:
      - { name: period_id, type: string, source: input, description: "FK -> AccrualPeriod.id; period as of which adequacy is measured" }
      - { name: family_id, type: string, source: input, description: "FK -> ProductFamily.id; family under review" }
      - { name: expected_to_date_cents, type: integer, source: computed, default: 0, description: "Earned portion of POSTED accruals for the family — step 1 of calculations.adequacy_trend_adjustment" }
      - { name: actual_paid_cents, type: integer, source: computed, default: 0, description: "Cash claims paid through the review period — step 2 of calculations.adequacy_trend_adjustment" }
      - { name: ave_ratio_bps, type: integer, source: computed, default: 0, description: "actual-versus-expected ratio in basis points — step 3 input" }
      - { name: trend_adjustment_bps, type: integer, source: computed, default: 0, description: "Trend tier selected from ave_ratio_bps — step 4" }
      - { name: remaining_base_cents, type: integer, source: computed, default: 0, description: "Unearned portion of POSTED accruals for the family — step 5 base" }
      - { name: adjusted_remaining_cents, type: integer, source: computed, default: 0, description: "remaining_base_cents after applying trend_adjustment_bps — step 6" }
      - { name: recommended_true_up_cents, type: integer, source: computed, default: 0, description: "Signed change-in-estimate recommendation — step 7 output" }
      - { name: adequacy_status, type: enum, source: computed, default: SUFFICIENT, description: "REDUNDANT | SUFFICIENT | DEFICIENT — selected together with trend_adjustment_bps" }
      - { name: true_up_applied, type: boolean, source: system, default: false, description: "True once POST /warranty/adequacy-reviews/{reviewId}/apply-true-up has succeeded on this row" }
      - { name: applied_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ReserveController who applied the true-up" }

  - name: FieldAction
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> ProductFamily.id; family targeted by the campaign, recall or bulletin" }
      - { name: action_code, type: string, source: input, description: "Field action code", constraints: "unique across all FieldAction rows" }
      - { name: action_type, type: enum, source: input, description: "SERVICE_CAMPAIGN | SAFETY_RECALL | FIELD_BULLETIN" }
      - { name: is_safety_recall, type: boolean, source: computed, default: false, description: "True exactly when action_type == SAFETY_RECALL" }
      - { name: affected_build_start_date, type: string, source: input, description: "Inclusive first build date of the affected population, `YYYY-MM-DD`" }
      - { name: affected_build_end_date, type: string, source: input, description: "Inclusive last build date of the affected population, `YYYY-MM-DD`", constraints: ">= affected_build_start_date" }
      - { name: affected_unit_count, type: integer, source: input, description: "Units in scope of the remedy", constraints: ">= 1" }
      - { name: regulatory_notice_filed, type: boolean, source: input, default: false, description: "Whether the regulator notice for this action has been filed" }
      - { name: selected_remedy_option_id, type: string, source: system, default: null, description: "FK -> RemedyOption.id; the remedy option whose cost drives specific_accrual_cents" }
      - { name: specific_accrual_cents, type: integer, source: computed, default: 0, description: "Output of calculations.field_action_specific_accrual; 0 while selected_remedy_option_id is null" }
      - { name: executed_cost_cents, type: integer, source: system, default: 0, description: "Cash cost actually incurred, accumulated by execution-progress calls" }
      - { name: approval_state, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | REJECTED — approval dimension" }
      - { name: execution_state, type: enum, source: system, default: NOT_STARTED, description: "NOT_STARTED | IN_PROGRESS | COMPLETED — execution dimension, independent of approval_state" }
      - { name: approved_period_id, type: string, source: system, default: null, description: "FK -> AccrualPeriod.id; period whose status was OPEN or ANALYSIS_LOCKED when the APPROVED decision was recorded" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the QualityEngineer who executed DRAFT->SUBMITTED" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ReserveController who recorded the APPROVED or REJECTED decision" }

  - name: RemedyOption
    parent: null
    common_fields: true
    fields:
      - { name: field_action_id, type: string, source: input, description: "FK -> FieldAction.id; field action this candidate remedy belongs to" }
      - { name: option_code, type: string, source: input, description: "Remedy option code", constraints: "unique within field_action_id" }
      - { name: remedy_class, type: enum, source: input, description: "PERMANENT_REPAIR | INTERIM_REPAIR | PART_REPLACEMENT | BUYBACK" }
      - { name: parts_cost_cents, type: integer, source: input, description: "Parts cost per remedied unit", constraints: ">= 0" }
      - { name: labor_hours_centi, type: integer, source: input, description: "Labor per remedied unit in hundredths of an hour (150 == 1.50 h)", constraints: ">= 0" }
      - { name: admin_cost_cents, type: integer, source: input, description: "Administrative/notification cost per unit in scope", constraints: ">= 0" }
      - { name: expected_take_rate_bps, type: integer, source: input, description: "Expected share of the affected population that will present for this remedy, in basis points", constraints: "0 <= expected_take_rate_bps <= 10000" }
      - { name: is_engineering_approved, type: boolean, source: input, default: false, description: "Whether engineering has released this option for field use" }
      - { name: per_unit_expected_cents, type: integer, source: computed, default: 0, description: "Take-rate-weighted per-unit cost rounded to whole cents — intermediate output of calculations.field_action_specific_accrual" }

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> ProductFamily.id; family covered by the extended service contract" }
      - { name: contract_number, type: string, source: input, description: "Extended service contract number", constraints: "unique across all ServiceContract rows" }
      - { name: sold_date, type: string, source: input, description: "Date the contract was sold, `YYYY-MM-DD`" }
      - { name: term_months, type: integer, source: input, description: "Coverage term in months", constraints: ">= 1" }
      - { name: total_contract_price_cents, type: integer, source: input, description: "Gross price collected from the customer", constraints: ">= 1" }
      - { name: recognition_method, type: enum, source: input, description: "STRAIGHT_LINE | CLAIMS_PATTERN — selects the calculations.service_contract_recognition variant" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CANCELLED | EXPIRED" }
      - { name: months_elapsed, type: integer, source: computed, default: 0, description: "Whole months from sold_date to the logical clock, clamped to [0, term_months]" }
      - { name: recognized_revenue_cents, type: integer, source: computed, default: 0, description: "Cumulative recognized revenue under the selected variant" }
      - { name: deferred_revenue_cents, type: integer, source: computed, default: 0, description: "total_contract_price_cents - recognized_revenue_cents - refunded_revenue_cents" }
      - { name: refunded_revenue_cents, type: integer, source: system, default: 0, description: "Pro-rata refund paid out on cancellation; 0 while status == ACTIVE" }
      - { name: cancelled_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the ACTIVE->CANCELLED transition" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: supplier_code, type: string, source: input, description: "Supplier code", constraints: "unique across all Supplier rows" }
      - { name: name, type: string, source: input, description: "Supplier legal name" }
      - { name: credit_rating, type: enum, source: input, description: "AAA | BBB | CCC | D — external credit rating that seeds collectability" }
      - { name: annual_purchase_volume_cents, type: integer, source: input, description: "Annual spend with this supplier; the base for the contractual recovery cap", constraints: ">= 0" }
      - { name: contractual_recovery_cap_bps, type: integer, source: input, description: "Contractual ceiling on annual recoveries as basis points of annual_purchase_volume_cents", constraints: "0 <= contractual_recovery_cap_bps <= 10000" }
      - { name: gross_asserted_recovery_cents, type: integer, source: computed, default: 0, description: "Sum of asserted_amount_cents over SupplierRecovery rows with this supplier_id and status IN {ASSERTED, NEGOTIATION, SETTLED, WRITTEN_OFF}" }
      - { name: open_recovery_asset_cents, type: integer, source: computed, default: 0, description: "Sum of recognized_recovery_cents over SupplierRecovery rows with this supplier_id and status IN {ASSERTED, NEGOTIATION}" }
      - { name: realized_recovery_cents, type: integer, source: computed, default: 0, description: "Sum of recognized_recovery_cents over SupplierRecovery rows with this supplier_id and status == SETTLED" }
      - { name: written_off_recovery_cents, type: integer, source: computed, default: 0, description: "Sum of asserted_amount_cents over SupplierRecovery rows with this supplier_id and status == WRITTEN_OFF" }
      - { name: closed_recovery_count, type: integer, source: computed, default: 0, description: "Count of SupplierRecovery rows with this supplier_id and status IN {SETTLED, WRITTEN_OFF}" }
      - { name: realization_bps, type: integer, source: computed, default: 10000, description: "Output of calculations.supplier_collectability_rating step 1" }
      - { name: collectability_rating, type: enum, source: computed, default: HIGH, description: "HIGH | MEDIUM | LOW | IMPAIRED — output of calculations.supplier_collectability_rating" }

  - name: SupplierRecovery
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; counterparty the claim is asserted against" }
      - { name: failure_mode_id, type: string, source: input, description: "FK -> FailureMode.id; component defect that drives the claims being recovered" }
      - { name: field_action_id, type: string, source: input, default: null, description: "FK -> FieldAction.id; campaign or recall whose cost is being recovered; null for ordinary warranty claim recovery" }
      - { name: asserted_amount_cents, type: integer, source: input, description: "Gross amount claimed from the supplier", constraints: ">= 1" }
      - { name: settled_amount_cents, type: integer, source: system, default: null, description: "Amount agreed at settlement; null until status == SETTLED" }
      - { name: valuation_variant, type: enum, source: computed, default: EXPECTED_VALUE, description: "EXPECTED_VALUE | CONTRACTUAL_FLOOR — which calculations.supplier_recovery_recognized variant produced recognized_recovery_cents" }
      - { name: collectability_rating_at_valuation, type: enum, source: computed, default: HIGH, description: "Supplier.collectability_rating snapshot used by the most recent valuation" }
      - { name: recognized_recovery_cents, type: integer, source: computed, default: 0, description: "Output of calculations.supplier_recovery_recognized" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ASSERTED | NEGOTIATION | SETTLED | WRITTEN_OFF" }
      - { name: assert_count, type: integer, source: system, default: 0, description: "Number of transitions into ASSERTED (initial assertion plus re-assertions)" }
      - { name: supplier_response_note, type: string, source: system, default: null, description: "Free text recorded by the SupplierRep on the ASSERTED->NEGOTIATION transition" }
      - { name: settled_period_id, type: string, source: system, default: null, description: "FK -> AccrualPeriod.id; period whose status was OPEN or ANALYSIS_LOCKED when the recovery closed as SETTLED" }

  - name: LiabilityReserve
    parent: null
    common_fields: true
    fields:
      - { name: period_id, type: string, source: input, description: "FK -> AccrualPeriod.id; period the product-liability reserve is measured for" }
      - { name: family_id, type: string, source: input, description: "FK -> ProductFamily.id; family the reserve covers" }
      - { name: reported_claim_count, type: integer, source: input, description: "Number of asserted product-liability claims reported to date", constraints: ">= 0" }
      - { name: asserted_case_reserve_cents, type: integer, source: input, description: "Legal department case reserves for asserted claims", constraints: ">= 0" }
      - { name: reporting_lag_months, type: integer, source: input, description: "Actuarial average reporting lag in months, driving the IBNR frequency factor", constraints: "0 <= reporting_lag_months <= 24" }
      - { name: severity_trend_bps, type: integer, source: input, description: "Actuarial severity trend in basis points applied to average case severity", constraints: "-5000 <= severity_trend_bps <= 10000" }
      - { name: avg_case_severity_cents, type: integer, source: computed, default: 0, description: "asserted_case_reserve_cents per reported claim; 0 when reported_claim_count == 0" }
      - { name: lag_factor_bps, type: integer, source: computed, default: 0, description: "Capped IBNR frequency factor derived from reporting_lag_months" }
      - { name: ibnr_claim_count, type: integer, source: computed, default: 0, description: "Estimated incurred-but-not-reported claim count" }
      - { name: ibnr_reserve_cents, type: integer, source: computed, default: 0, description: "Output of calculations.ibnr_liability_reserve after floor/cap clamping" }
      - { name: total_liability_reserve_cents, type: integer, source: computed, default: 0, description: "asserted_case_reserve_cents + ibnr_reserve_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTUARY_REVIEWED | BOOKED" }
      - { name: return_count, type: integer, source: system, default: 0, description: "Number of ACTUARY_REVIEWED->DRAFT return transitions executed on this row" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the Actuary who recorded the REVIEWED decision" }

  - name: ReserveRollforward
    parent: null
    common_fields: false
    fields:
      - { name: period_id, type: string, source: input, description: "FK -> AccrualPeriod.id; period this disclosure snapshot describes" }
      - { name: beginning_balance_cents, type: integer, source: computed, description: "ending_balance_cents of the rollforward of the immediately preceding CLOSED period; 0 when none exists" }
      - { name: accruals_cents, type: integer, source: computed, description: "Sum of WarrantyAccrual.accrued_amount_cents where period_id == this period and status == POSTED" }
      - { name: campaign_accruals_cents, type: integer, source: computed, description: "Sum of FieldAction.specific_accrual_cents where approved_period_id == this period and approval_state == APPROVED" }
      - { name: changes_in_estimate_cents, type: integer, source: computed, description: "Sum of AdequacyReview.recommended_true_up_cents where period_id == this period and true_up_applied == true" }
      - { name: claims_paid_cents, type: integer, source: computed, description: "Sum of ClaimObservation.paid_cost_cents where observation_period_code == AccrualPeriod.period_code of this period" }
      - { name: supplier_recoveries_cents, type: integer, source: computed, description: "Sum of SupplierRecovery.recognized_recovery_cents where settled_period_id == this period and status == SETTLED" }
      - { name: ending_balance_cents, type: integer, source: computed, description: "beginning + accruals + campaign_accruals + changes_in_estimate - claims_paid + supplier_recoveries" }
      - { name: significant_exposure_count, type: integer, source: computed, description: "Snapshot of AccrualPeriod.significant_exposure_count at generation time" }
      - { name: generated_by_user_id, type: string, source: system, description: "X-User-ID of the ReserveController who generated the snapshot" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: AccrualPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ANALYSIS_LOCKED
        trigger: "POST /warranty/periods/{periodId}/lock-analysis"
        actor: ReserveController
        preconditions:
          - "AccrualPeriod.status == OPEN"
        side_effects:
          - "AccrualPeriod.locked_at = logical_now"
          - "increments AccrualPeriod.version by 1"
        note: "Analysis lock stops new claim observations from being coded into the period."

      - from: ANALYSIS_LOCKED
        to: ACTUARIAL_REVIEW
        trigger: "POST /warranty/periods/{periodId}/open-actuarial-review"
        actor: ReserveController
        preconditions:
          - "AccrualPeriod.status == ANALYSIS_LOCKED"
          - "zero WarrantyAccrual rows exist with period_id == this AccrualPeriod.id and status IN {DRAFT, PROPOSED}; otherwise ERR_UNPOSTED_ACCRUALS_REMAIN"
        side_effects:
          - "increments AccrualPeriod.version by 1"

      - from: ACTUARIAL_REVIEW
        to: ANALYSIS_LOCKED
        trigger: "POST /warranty/periods/{periodId}/reopen-analysis"
        actor: ReserveController
        preconditions:
          - "AccrualPeriod.status == ACTUARIAL_REVIEW"
        side_effects:
          - "AccrualPeriod.reopen_count += 1"
          - "AccrualPeriod.locked_at = logical_now"
          - "every LiabilityReserve row with period_id == this AccrualPeriod.id and status == ACTUARY_REVIEWED transitions to DRAFT with return_count += 1 and reviewed_by_user_id = null (conditional cascade: rows already BOOKED and rows already DRAFT are untouched)"
          - "increments AccrualPeriod.version by 1"
        note: "Cyclic revision loop: actuarial review can be handed back to the analysis stage."

      - from: ACTUARIAL_REVIEW
        to: CLOSED
        trigger: "POST /warranty/periods/{periodId}/close"
        actor: ReserveController
        preconditions:
          - "AccrualPeriod.status == ACTUARIAL_REVIEW"
          - "AccrualPeriod.rollforward_generated == true; otherwise ERR_ROLLFORWARD_MISSING"
          - "every LiabilityReserve row with period_id == this AccrualPeriod.id has status == BOOKED; otherwise ERR_LIABILITY_RESERVE_NOT_BOOKED (cross-entity guard on LiabilityReserve)"
        side_effects:
          - "AccrualPeriod.closed_at = logical_now"
          - "increments AccrualPeriod.version by 1"

  # ---------------------------------------------------------------------------
  - entity: WarrantyAccrual
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /warranty/accruals"
        actor: WarrantyAnalyst
        preconditions:
          - "referenced AccrualPeriod.status IN {OPEN, ANALYSIS_LOCKED}; otherwise ERR_PERIOD_CLOSED"
          - "payload expected_period_version == AccrualPeriod.version; otherwise ERR_STALE_PERIOD_VERSION"
          - "referenced ProductVintage.exposure_status == ACTIVE; otherwise ERR_VINTAGE_EXPOSURE_EXPIRED"
          - "at least one FailureMode row exists with family_id == ProductVintage.family_id; otherwise ERR_NO_FAILURE_MODES_DEFINED"
          - "method/maturity gate per validations priority 22 and 23"
          - "zero WarrantyAccrual rows exist with the same (period_id, vintage_id) and status IN {DRAFT, PROPOSED}; otherwise ERR_DUPLICATE_ACCRUAL"
        side_effects:
          - "computes WarrantyAccrual.expected_claim_rate_ppm, cost_per_claim_basis_cents, paid_to_date_cents and accrued_amount_cents via calculations.warranty_accrual_amount"
          - "increments AccrualPeriod.version by 1"

      - from: DRAFT
        to: PROPOSED
        trigger: "POST /warranty/accruals/{accrualId}/propose"
        actor: WarrantyAnalyst
        preconditions:
          - "WarrantyAccrual.status == DRAFT"
          - "referenced AccrualPeriod.status IN {OPEN, ANALYSIS_LOCKED}; otherwise ERR_PERIOD_CLOSED"
        side_effects:
          - "WarrantyAccrual.proposed_by_user_id = X-User-ID of the caller"
          - "recomputes WarrantyAccrual.accrued_amount_cents via calculations.warranty_accrual_amount against current ClaimObservation data"

      - from: PROPOSED
        to: DRAFT
        trigger: "POST /warranty/accruals/{accrualId}/revise"
        actor: WarrantyAnalyst
        preconditions:
          - "WarrantyAccrual.status == PROPOSED"
          - "referenced AccrualPeriod.status IN {OPEN, ANALYSIS_LOCKED}; otherwise ERR_PERIOD_CLOSED"
        side_effects:
          - "WarrantyAccrual.revision_index += 1"
          - "WarrantyAccrual.proposed_by_user_id = null"
        note: "Cyclic revision loop on WarrantyAccrual."

      - from: PROPOSED
        to: POSTED
        trigger: "POST /warranty/accruals/{accrualId}/post"
        actor: ReserveController
        preconditions:
          - "WarrantyAccrual.status == PROPOSED"
          - "referenced AccrualPeriod.status == ANALYSIS_LOCKED; otherwise ERR_INVALID_STATE_TRANSITION (cross-entity guard on AccrualPeriod)"
          - "X-User-ID != WarrantyAccrual.proposed_by_user_id; otherwise ERR_SEGREGATION_OF_DUTIES"
          - "recomputed ProductFamily.warranty_reserve_balance_cents including this accrual is <= ProductFamily.reserve_cap_cents; otherwise ERR_RESERVE_CAP_EXCEEDED"
        side_effects:
          - "WarrantyAccrual.posted_by_user_id = X-User-ID of the caller"
          - "every other WarrantyAccrual row with the same (period_id, vintage_id) and status == POSTED transitions to SUPERSEDED"
          - "recomputes ProductFamily.warranty_reserve_balance_cents via calculations.family_reserve_balance"
          - "because warranty_reserve_balance_cents changed, recomputes ProductFamily.reserve_posture via calculations.family_reserve_posture"

      - from: POSTED
        to: SUPERSEDED
        trigger: "system — a later WarrantyAccrual for the same (period_id, vintage_id) reaches POSTED"
        actor: system
        preconditions:
          - "WarrantyAccrual.status == POSTED"
          - "another WarrantyAccrual row with the same (period_id, vintage_id) is transitioning PROPOSED -> POSTED"
        side_effects:
          - "the superseded row's accrued_amount_cents leaves the calculations.family_reserve_balance POSTED filter"
        note: "Supersede conservation: the family reserve balance moves by exactly (new.accrued_amount_cents - old.accrued_amount_cents)."

  # ---------------------------------------------------------------------------
  - entity: FieldAction
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      # ---- approval dimension -------------------------------------------------
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /warranty/field-actions/{fieldActionId}/submit"
        actor: QualityEngineer
        preconditions:
          - "FieldAction.approval_state == DRAFT"
          - "FieldAction.selected_remedy_option_id != null; otherwise ERR_INVALID_STATE_TRANSITION"
          - "if FieldAction.is_safety_recall == true then the RemedyOption referenced by selected_remedy_option_id has remedy_class == PERMANENT_REPAIR; otherwise ERR_SAFETY_REMEDY_REQUIRED"
        side_effects:
          - "FieldAction.submitted_by_user_id = X-User-ID of the caller"
        note: "approval_state dimension; execution_state is untouched."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty/field-actions/{fieldActionId}/decision with decision == APPROVED"
        actor: ReserveController
        preconditions:
          - "FieldAction.approval_state == SUBMITTED"
          - "X-User-ID != FieldAction.submitted_by_user_id; otherwise ERR_SEGREGATION_OF_DUTIES"
          - "if FieldAction.is_safety_recall == true then FieldAction.regulatory_notice_filed == true; otherwise ERR_REGULATORY_NOTICE_MISSING"
          - "the booking-period selector of calculations.booking_period_selection returns a period; otherwise ERR_NO_OPEN_PERIOD"
        side_effects:
          - "HOP 1: FieldAction.decided_by_user_id = X-User-ID; FieldAction.approved_period_id = booking period selected by calculations.booking_period_selection; FieldAction.specific_accrual_cents recomputed via calculations.field_action_specific_accrual"
          - "HOP 2: because FieldAction.specific_accrual_cents now enters the approval_state == APPROVED filter, ProductFamily.warranty_reserve_balance_cents is recomputed via calculations.family_reserve_balance"
          - "HOP 3: because ProductFamily.warranty_reserve_balance_cents changed, ProductFamily.reserve_posture is recomputed via calculations.family_reserve_posture"
          - "HOP 4: because ProductFamily.reserve_posture became CONSTRAINED in HOP 3, every WarrantyAccrual row whose vintage_id belongs to a ProductVintage with family_id == this family and whose status == PROPOSED transitions to DRAFT with revision_index += 1 and proposed_by_user_id = null (no effect when HOP 3 left reserve_posture at NORMAL or ELEVATED)"
          - "AccrualPeriod.significant_exposure_count and requires_significant_exposure_disclosure are recomputed for the approved_period_id"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /warranty/field-actions/{fieldActionId}/decision with decision == REJECTED"
        actor: ReserveController
        preconditions:
          - "FieldAction.approval_state == SUBMITTED"
          - "X-User-ID != FieldAction.submitted_by_user_id; otherwise ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "FieldAction.decided_by_user_id = X-User-ID of the caller"
          - "FieldAction.specific_accrual_cents = 0"
          - "FieldAction.approved_period_id remains null, so ProductFamily.warranty_reserve_balance_cents is unchanged"
        note: "Branching fork: APPROVED and REJECTED carry disjoint side-effect sets."

      - from: REJECTED
        to: DRAFT
        trigger: "POST /warranty/field-actions/{fieldActionId}/select-remedy"
        actor: QualityEngineer
        preconditions:
          - "FieldAction.approval_state == REJECTED"
          - "payload expected_field_action_version == FieldAction.version; otherwise ERR_STALE_FIELD_ACTION_VERSION"
        side_effects:
          - "FieldAction.selected_remedy_option_id = the option resolved by calculations.remedy_option_selection"
          - "FieldAction.specific_accrual_cents recomputed via calculations.field_action_specific_accrual"
          - "FieldAction.submitted_by_user_id = null; FieldAction.decided_by_user_id = null"
          - "increments FieldAction.version by 1"
        note: "Cyclic loop: a rejected action returns to DRAFT for re-work."

      - from: DRAFT
        to: DRAFT
        trigger: "POST /warranty/field-actions/{fieldActionId}/select-remedy"
        actor: QualityEngineer
        preconditions:
          - "FieldAction.approval_state == DRAFT"
          - "payload expected_field_action_version == FieldAction.version; otherwise ERR_STALE_FIELD_ACTION_VERSION"
        side_effects:
          - "FieldAction.selected_remedy_option_id = the option resolved by calculations.remedy_option_selection (a new selection supersedes any prior selection)"
          - "FieldAction.specific_accrual_cents and RemedyOption.per_unit_expected_cents recomputed via calculations.field_action_specific_accrual"
          - "increments FieldAction.version by 1"

      # ---- execution dimension ------------------------------------------------
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /warranty/field-actions/{fieldActionId}/execution-progress with to_execution_state == IN_PROGRESS"
        actor: QualityEngineer
        preconditions:
          - "FieldAction.execution_state == NOT_STARTED"
          - "FieldAction.approval_state == APPROVED; otherwise ERR_EXECUTION_BEFORE_APPROVAL"
        side_effects:
          - "FieldAction.executed_cost_cents += incurred_cost_cents from the payload (default 0)"
        note: "Parallel dimension: execution_state advances while approval_state stays APPROVED."

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /warranty/field-actions/{fieldActionId}/execution-progress with to_execution_state == COMPLETED"
        actor: QualityEngineer
        preconditions:
          - "FieldAction.execution_state == IN_PROGRESS"
        side_effects:
          - "FieldAction.executed_cost_cents += incurred_cost_cents from the payload (default 0)"
          - "recomputes ProductFamily.warranty_reserve_balance_cents via calculations.family_reserve_balance (the completed action's executed_cost_cents now enters the deduction term)"
          - "because ProductFamily.warranty_reserve_balance_cents changed, recomputes ProductFamily.reserve_posture"

  # ---------------------------------------------------------------------------
  - entity: SupplierRecovery
    initial_state: DRAFT
    terminal_states: [SETTLED, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ASSERTED
        trigger: "POST /warranty/supplier-recoveries/{recoveryId}/assert"
        actor: WarrantyAnalyst
        preconditions:
          - "SupplierRecovery.status == DRAFT"
          - "referenced Supplier.collectability_rating != IMPAIRED; otherwise ERR_SUPPLIER_IMPAIRED (cross-entity guard on Supplier)"
          - "if SupplierRecovery.field_action_id != null then that FieldAction.approval_state == APPROVED; otherwise ERR_FIELD_ACTION_NOT_APPROVED (cross-entity guard on FieldAction)"
        side_effects:
          - "SupplierRecovery.asserted_amount_cents = payload revised_asserted_amount_cents when supplied, otherwise unchanged"
          - "SupplierRecovery.assert_count += 1"
          - "SupplierRecovery.valuation_variant = EXPECTED_VALUE; recognized_recovery_cents and collectability_rating_at_valuation recomputed via calculations.supplier_recovery_recognized"
          - "recomputes Supplier.gross_asserted_recovery_cents and Supplier.open_recovery_asset_cents"

      - from: NEGOTIATION
        to: ASSERTED
        trigger: "POST /warranty/supplier-recoveries/{recoveryId}/assert"
        actor: WarrantyAnalyst
        preconditions:
          - "SupplierRecovery.status == NEGOTIATION"
          - "referenced Supplier.collectability_rating != IMPAIRED; otherwise ERR_SUPPLIER_IMPAIRED"
        side_effects:
          - "SupplierRecovery.asserted_amount_cents = payload revised_asserted_amount_cents when supplied, otherwise unchanged"
          - "SupplierRecovery.assert_count += 1"
          - "SupplierRecovery.supplier_response_note = null"
          - "recognized_recovery_cents recomputed under the EXPECTED_VALUE variant"
          - "recomputes Supplier.gross_asserted_recovery_cents and Supplier.open_recovery_asset_cents"
        note: "Cyclic negotiation round: the claim is re-asserted at a revised amount."

      - from: ASSERTED
        to: NEGOTIATION
        trigger: "POST /warranty/supplier-recoveries/{recoveryId}/respond"
        actor: SupplierRep
        preconditions:
          - "SupplierRecovery.status == ASSERTED"
          - "X-User-ID == SupplierRecovery.supplier_id; otherwise ERR_SUPPLIER_SCOPE_VIOLATION"
        side_effects:
          - "SupplierRecovery.supplier_response_note = payload response_note"
          - "recognized_recovery_cents recomputed under the EXPECTED_VALUE variant"

      - from: ASSERTED
        to: SETTLED
        trigger: "POST /warranty/supplier-recoveries/{recoveryId}/close with outcome == SETTLED"
        actor: ReserveController
        preconditions:
          - "SupplierRecovery.status IN {ASSERTED, NEGOTIATION}"
          - "payload settled_amount_cents <= SupplierRecovery.asserted_amount_cents; otherwise ERR_SETTLEMENT_EXCEEDS_ASSERTED"
          - "the booking-period selector of calculations.booking_period_selection returns a period; otherwise ERR_NO_OPEN_PERIOD"
        side_effects:
          - "HOP 1: SupplierRecovery.settled_amount_cents = payload settled_amount_cents; settled_period_id = booking period; valuation_variant = CONTRACTUAL_FLOOR; recognized_recovery_cents recomputed under the CONTRACTUAL_FLOOR variant"
          - "HOP 2: because this row left {ASSERTED, NEGOTIATION} and entered SETTLED, Supplier.open_recovery_asset_cents, Supplier.realized_recovery_cents and Supplier.closed_recovery_count are recomputed"
          - "HOP 3: because Supplier.closed_recovery_count and Supplier.realized_recovery_cents changed, Supplier.realization_bps and Supplier.collectability_rating are recomputed via calculations.supplier_collectability_rating"
          - "HOP 4: because Supplier.collectability_rating changed in HOP 3, every other SupplierRecovery row with the same supplier_id and status IN {ASSERTED, NEGOTIATION} is re-valued under the EXPECTED_VALUE variant, updating recognized_recovery_cents and collectability_rating_at_valuation (processed in created_at ASC order; exactly one re-valuation pass, no iteration to a fixed point)"
          - "HOP 5: because the HOP 4 re-valuations changed those rows' recognized_recovery_cents, Supplier.open_recovery_asset_cents is recomputed once more"

      - from: NEGOTIATION
        to: SETTLED
        trigger: "POST /warranty/supplier-recoveries/{recoveryId}/close with outcome == SETTLED"
        actor: ReserveController
        preconditions:
          - "SupplierRecovery.status == NEGOTIATION"
          - "payload settled_amount_cents <= SupplierRecovery.asserted_amount_cents; otherwise ERR_SETTLEMENT_EXCEEDS_ASSERTED"
          - "the booking-period selector of calculations.booking_period_selection returns a period; otherwise ERR_NO_OPEN_PERIOD"
        side_effects:
          - "identical HOP 1..HOP 5 chain as the ASSERTED -> SETTLED transition"

      - from: ASSERTED
        to: WRITTEN_OFF
        trigger: "POST /warranty/supplier-recoveries/{recoveryId}/close with outcome == WRITTEN_OFF"
        actor: ReserveController
        preconditions:
          - "SupplierRecovery.status IN {ASSERTED, NEGOTIATION}"
        side_effects:
          - "SupplierRecovery.settled_amount_cents = 0; recognized_recovery_cents = 0; valuation_variant = CONTRACTUAL_FLOOR"
          - "recomputes Supplier.open_recovery_asset_cents, Supplier.written_off_recovery_cents and Supplier.closed_recovery_count"
          - "because closed_recovery_count and written_off_recovery_cents changed, Supplier.realization_bps and Supplier.collectability_rating are recomputed"
          - "because Supplier.collectability_rating changed, every other SupplierRecovery row with the same supplier_id and status IN {ASSERTED, NEGOTIATION} is re-valued under EXPECTED_VALUE in created_at ASC order, then Supplier.open_recovery_asset_cents is recomputed once more"
        note: "Compensating action for assert: gross_asserted_recovery_cents is conserved, the amount moves from open_recovery_asset_cents into written_off_recovery_cents."

      - from: NEGOTIATION
        to: WRITTEN_OFF
        trigger: "POST /warranty/supplier-recoveries/{recoveryId}/close with outcome == WRITTEN_OFF"
        actor: ReserveController
        preconditions:
          - "SupplierRecovery.status == NEGOTIATION"
        side_effects:
          - "identical to the ASSERTED -> WRITTEN_OFF side-effect chain"

  # ---------------------------------------------------------------------------
  - entity: LiabilityReserve
    initial_state: DRAFT
    terminal_states: [BOOKED]
    transitions:
      - from: DRAFT
        to: ACTUARY_REVIEWED
        trigger: "POST /warranty/liability-reserves/{reserveId}/actuarial-decision with decision == REVIEWED"
        actor: Actuary
        preconditions:
          - "LiabilityReserve.status == DRAFT"
          - "referenced AccrualPeriod.status IN {ANALYSIS_LOCKED, ACTUARIAL_REVIEW}; otherwise ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "LiabilityReserve.reviewed_by_user_id = X-User-ID of the caller"
          - "recomputes avg_case_severity_cents, lag_factor_bps, ibnr_claim_count, ibnr_reserve_cents and total_liability_reserve_cents via calculations.ibnr_liability_reserve"

      - from: ACTUARY_REVIEWED
        to: DRAFT
        trigger: "POST /warranty/liability-reserves/{reserveId}/actuarial-decision with decision == RETURNED"
        actor: Actuary
        preconditions:
          - "LiabilityReserve.status == ACTUARY_REVIEWED"
        side_effects:
          - "LiabilityReserve.return_count += 1"
          - "LiabilityReserve.reviewed_by_user_id = null"
        note: "Cyclic loop on LiabilityReserve."

      - from: ACTUARY_REVIEWED
        to: BOOKED
        trigger: "POST /warranty/liability-reserves/{reserveId}/book"
        actor: ReserveController
        preconditions:
          - "LiabilityReserve.status == ACTUARY_REVIEWED"
          - "referenced AccrualPeriod.status == ACTUARIAL_REVIEW; otherwise ERR_INVALID_STATE_TRANSITION"
          - "X-User-ID != LiabilityReserve.reviewed_by_user_id; otherwise ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "the row now satisfies the AccrualPeriod close guard 'every LiabilityReserve is BOOKED'"

  # ---------------------------------------------------------------------------
  - entity: ServiceContract
    initial_state: ACTIVE
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /warranty/service-contracts/{contractId}/cancel"
        actor: WarrantyAnalyst
        preconditions:
          - "ServiceContract.status == ACTIVE"
        side_effects:
          - "ServiceContract.refunded_revenue_cents = ServiceContract.deferred_revenue_cents evaluated immediately before this transition"
          - "ServiceContract.deferred_revenue_cents = 0"
          - "ServiceContract.cancelled_at = logical_now"
          - "ServiceContract.recognized_revenue_cents is frozen at its pre-cancellation value and no longer tracks the logical clock"
        note: "Compensating action for revenue recognition: recognized + deferred + refunded == total_contract_price_cents holds before and after."

      - from: ACTIVE
        to: EXPIRED
        trigger: "system — POST /warranty/_clock/set_current_utc advances the logical clock so that months_elapsed >= term_months"
        actor: system
        preconditions:
          - "ServiceContract.status == ACTIVE"
          - "recomputed ServiceContract.months_elapsed >= ServiceContract.term_months"
        side_effects:
          - "ServiceContract.recognized_revenue_cents = total_contract_price_cents; deferred_revenue_cents = 0"
        note: "Clock-driven auto-transition; processed in created_at ASC order across all ACTIVE contracts."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: accrual-create-stale-period
    parent_entity: AccrualPeriod
    write_endpoint: "POST /warranty/accruals"
    occ_field: "expected_period_version"
    description: |
      Creating a WarrantyAccrual against an AccrualPeriod whose version has
      advanced since the client last read it is rejected. This captures the case
      where another writer has already created an accrual in the period (which
      legitimately changes what the period's accrual set contains and therefore
      what a duplicate check would see) and the current writer's view of the
      period is stale.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

  - rule_id: rollforward-generate-stale-period
    parent_entity: AccrualPeriod
    write_endpoint: "POST /warranty/periods/{periodId}/rollforward"
    occ_field: "expected_period_version"
    description: |
      Generating a ReserveRollforward disclosure snapshot against an
      AccrualPeriod whose version has advanced since the client last read it is
      rejected. A previously generated snapshot legitimately supersedes the
      client's view of the period's disclosure state, so the second generation
      request carries a stale version.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

  - rule_id: remedy-select-stale-field-action
    parent_entity: FieldAction
    write_endpoint: "POST /warranty/field-actions/{fieldActionId}/select-remedy"
    occ_field: "expected_field_action_version"
    description: |
      Selecting a remedy option on a FieldAction whose version has advanced
      since the client last read it is rejected. A new selection legitimately
      supersedes the prior selection and rewrites specific_accrual_cents, so the
      writer must prove it observed the selection that is currently in force.
    error_id: ERR_STALE_FIELD_ACTION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
# Global rounding convention: `round_half_up(x)` rounds a rational to the nearest
# integer, ties away from zero. Every monetary field is an integer count of cents;
# every rate field is an integer count of basis points (bps, 1/10000) or parts per
# million (ppm, 1/1000000). No floating-point intermediate is ever persisted.
calculations:

  - name: history_maturity_classification
    trigger: "on POST /warranty/product-families, PATCH /warranty/product-families/{familyId}, POST /warranty/vintages, POST /warranty/claim-observations, and POST /warranty/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      observed_history_months = 0 when no ClaimObservation row exists whose vintage_id
        belongs to a ProductVintage with family_id == F.id,
        otherwise max(ClaimObservation.months_in_service_to) over those rows
      observed_exposure_units = sum(ProductVintage.units_shipped) over ProductVintage rows
        with family_id == F.id and exposure_status IN {ACTIVE, EXPIRED}
      units_sold_lifetime = observed_exposure_units
      history_maturity_status =
        MATURE  when observed_history_months >= HISTORY_MATURITY_MONTHS
                 and observed_exposure_units >= HISTORY_MATURITY_UNITS
        LIMITED otherwise
    input_set: "All ClaimObservation rows of the family's vintages (ClaimObservation is append-only and has no status field, so every row counts) and all ProductVintage rows of the family regardless of exposure_status."
    constants:
      HISTORY_MATURITY_MONTHS: 12
      HISTORY_MATURITY_UNITS: 5000
    precision: "integer months and integer units; both comparisons are `>=`, so exactly 12 months and exactly 5000 units already classify as MATURE"

  - name: warranty_accrual_amount
    trigger: "on POST /warranty/accruals and on POST /warranty/accruals/{accrualId}/propose"
    algorithm: forward_looking
    formula: |
      V = ProductVintage referenced by WarrantyAccrual.vintage_id
      F = ProductFamily referenced by V.family_id
      paid_to_date_cents = sum(ClaimObservation.paid_cost_cents) over ClaimObservation
        rows with vintage_id == V.id

      # ---- variant HISTORICAL_RATE -------------------------------------------
      M_set = FailureMode rows with family_id == F.id for which at least one
              ClaimObservation row exists with (vintage_id == V.id,
              failure_mode_id == that FailureMode.id), enumerated in mode_code ASC
      for each M in M_set:
        claim_count_m = sum(ClaimObservation.claim_count) over rows with
                        (vintage_id == V.id, failure_mode_id == M.id)
        rate_ppm_m    = round_half_up(claim_count_m * 1000000 / V.units_shipped)
        ult_claims_m  = round_half_up(rate_ppm_m * V.units_shipped
                                      * LIFETIME_DEVELOPMENT_FACTOR_BPS
                                      / (1000000 * 10000))
        mode_gross_m  = ult_claims_m * M.cost_per_claim_cents
      gross_ultimate_cents = sum over M_set of mode_gross_m
      expected_claim_rate_ppm = sum over M_set of rate_ppm_m
      total_ult_claims = sum over M_set of ult_claims_m
      cost_per_claim_basis_cents = 0 when total_ult_claims == 0,
        otherwise round_half_up(gross_ultimate_cents / total_ult_claims)

      # ---- variant ANALOG_BLEND ----------------------------------------------
      A = ProductFamily referenced by F.analog_family_id
      analog_claims = sum(ClaimObservation.claim_count) over rows whose vintage_id
        belongs to a ProductVintage with family_id == A.id
      analog_units = sum(ProductVintage.units_shipped) over ProductVintage rows with
        family_id == A.id and exposure_status IN {ACTIVE, EXPIRED}
      analog_rate_ppm = 0 when analog_units == 0,
        otherwise round_half_up(analog_claims * 1000000 / analog_units)
      analog_ultimate_ppm = round_half_up(analog_rate_ppm
                                          * LIFETIME_DEVELOPMENT_FACTOR_BPS / 10000)
      blended_rate_ppm = round_half_up(
          (F.engineering_estimate_rate_ppm * ANALOG_BLEND_ENG_WEIGHT_BPS
           + analog_ultimate_ppm * (10000 - ANALOG_BLEND_ENG_WEIGHT_BPS)) / 10000 )
        # PINNED: the two weighted terms are added as exact rationals and the SUM is
        # rounded exactly once. Rounding each weighted term before adding is wrong.
      expected_claim_rate_ppm = blended_rate_ppm
      ult_claims = round_half_up(blended_rate_ppm * V.units_shipped / 1000000)
      cost_per_claim_basis_cents = F.standard_cost_per_claim_cents
      gross_ultimate_cents = ult_claims * F.standard_cost_per_claim_cents

      # ---- both variants ------------------------------------------------------
      accrued_amount_cents = max(0, gross_ultimate_cents - paid_to_date_cents)
    input_set: "HISTORICAL_RATE reads only ClaimObservation rows of this accrual's own vintage_id; ANALOG_BLEND reads no observation of this vintage other than paid_to_date_cents, and instead reads the analog family's observations across all of its vintages."
    constants:
      LIFETIME_DEVELOPMENT_FACTOR_BPS: 25000
      ANALOG_BLEND_ENG_WEIGHT_BPS: 6000
    precision: "whole cents; rate_ppm_m and ult_claims_m are rounded per failure mode BEFORE summing (round-then-sum, not sum-then-round)"
    variants:
      - name: HISTORICAL_RATE
        when: "WarrantyAccrual.method == HISTORICAL_RATE; permitted only when ProductFamily.history_maturity_status == MATURE"
        difference: "Frequency is measured per failure mode from this vintage's own claim history and each mode is priced at FailureMode.cost_per_claim_cents, so the mix of failure modes drives the answer."
      - name: ANALOG_BLEND
        when: "WarrantyAccrual.method == ANALOG_BLEND; permitted whenever ProductFamily.analog_family_id and ProductFamily.engineering_estimate_rate_ppm are both non-null, including for MATURE families"
        difference: "Frequency is a 60/40 blend of the engineering estimate and the analog family's developed rate, and every claim is priced at the single family-level ProductFamily.standard_cost_per_claim_cents. For a MATURE family with an analog basis both variants are legal on identical data and return different accrued_amount_cents."

  - name: field_action_specific_accrual
    trigger: "on POST /warranty/field-actions/{fieldActionId}/select-remedy and on POST /warranty/field-actions/{fieldActionId}/decision with decision == APPROVED"
    algorithm: aggregation
    formula: |
      R = RemedyOption referenced by FieldAction.selected_remedy_option_id
      per_unit_labor_cents = round_half_up(R.labor_hours_centi
                                          * LABOR_RATE_CENTS_PER_HOUR / 100)
      per_unit_gross_cents = R.parts_cost_cents + per_unit_labor_cents
                             + R.admin_cost_cents
      R.per_unit_expected_cents = round_half_up(per_unit_gross_cents
                                               * R.expected_take_rate_bps / 10000)
      FieldAction.specific_accrual_cents = R.per_unit_expected_cents
                                           * FieldAction.affected_unit_count
    input_set: "Exactly one RemedyOption — the one referenced by selected_remedy_option_id. Non-selected options of the same field action contribute nothing."
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 9500
    precision: |
      Whole cents. ROUNDING ORDER IS PINNED AND OBSERVABLE: the take-rate weighting
      is rounded to whole cents PER UNIT first, and the rounded per-unit figure is
      then multiplied by affected_unit_count. The alternative order — multiplying the
      unrounded per-unit gross by affected_unit_count and by the take rate and
      rounding once at the end — is WRONG and yields a different total whenever
      per_unit_gross_cents * expected_take_rate_bps is not a multiple of 10000.

  - name: remedy_option_selection
    trigger: "on POST /warranty/field-actions/{fieldActionId}/select-remedy"
    algorithm: selector_policy
    formula: |
      # explicit form: the caller supplies remedy_option_id
      when payload.remedy_option_id is present:
        candidate = RemedyOption with id == payload.remedy_option_id
                    (absent -> ERR_REMEDY_OPTION_NOT_FOUND)
        # check order follows validations priority 17 before priority 20
        FieldAction.is_safety_recall == true
          and candidate.remedy_class != PERMANENT_REPAIR -> ERR_SAFETY_REMEDY_REQUIRED
        candidate.field_action_id != FieldAction.id -> ERR_REMEDY_OPTION_MISMATCH
        selected = candidate

      # implicit form: the caller omits remedy_option_id and the server selects
      when payload.remedy_option_id is absent:
        (a) eligibility filter — RemedyOption rows with
              field_action_id == FieldAction.id
              AND is_engineering_approved == true
              AND expected_take_rate_bps >= 1
              AND (FieldAction.is_safety_recall == false
                   OR remedy_class == PERMANENT_REPAIR)
        (b) ranking expression — per_unit_expected_cents ASC, where
            per_unit_expected_cents is computed by
            calculations.field_action_specific_accrual for each candidate
        (c) tie-break — expected_take_rate_bps ASC, then created_at ASC
        (d) empty candidate set -> ERR_NO_ELIGIBLE_REMEDY_OPTION (422); no field of
            FieldAction is mutated and FieldAction.version is not incremented
    input_set: "RemedyOption rows belonging to this field action only."
    constants: {}
    precision: "integer cents; `id` is never a ranking or tie-break input"

  - name: booking_period_selection
    trigger: "on POST /warranty/field-actions/{fieldActionId}/decision with decision == APPROVED and on POST /warranty/supplier-recoveries/{recoveryId}/close with outcome == SETTLED"
    algorithm: selector_policy
    formula: |
      (a) eligibility filter — AccrualPeriod rows with status IN {OPEN, ANALYSIS_LOCKED}
      (b) ranking expression — period_code DESC (period_code is `YYYY-QN`, so lexical
          order equals chronological order)
      (c) tie-break — period_code is unique, so a tie is impossible; should two rows
          ever share a period_code, created_at ASC decides
      (d) empty candidate set -> ERR_NO_OPEN_PERIOD (422)
    input_set: "All AccrualPeriod rows; ACTUARIAL_REVIEW and CLOSED periods are excluded from the candidate set."
    constants: {}
    precision: "exact string comparison on period_code; `id` is never a ranking input"

  - name: family_reserve_balance
    trigger: "on PROPOSED->POSTED of any WarrantyAccrual of the family, on FieldAction SUBMITTED->APPROVED, on FieldAction IN_PROGRESS->COMPLETED, and on POST /warranty/adequacy-reviews/{reviewId}/apply-true-up"
    algorithm: aggregation
    formula: |
      posted_accrual_total = sum(WarrantyAccrual.accrued_amount_cents) over
        WarrantyAccrual rows with status == POSTED whose vintage_id belongs to a
        ProductVintage with family_id == F.id
      approved_campaign_total = sum(FieldAction.specific_accrual_cents) over
        FieldAction rows with family_id == F.id and approval_state == APPROVED
      applied_true_up_total = sum(AdequacyReview.recommended_true_up_cents) over
        AdequacyReview rows with family_id == F.id and true_up_applied == true
      completed_execution_total = sum(FieldAction.executed_cost_cents) over
        FieldAction rows with family_id == F.id and execution_state == COMPLETED
      warranty_reserve_balance_cents = posted_accrual_total
                                     + approved_campaign_total
                                     + applied_true_up_total
                                     - completed_execution_total
    input_set: "Status filters are exhaustive and exclusive: WarrantyAccrual rows in DRAFT, PROPOSED or SUPERSEDED contribute nothing; FieldAction rows in DRAFT, SUBMITTED or REJECTED contribute nothing to approved_campaign_total; AdequacyReview rows with true_up_applied == false contribute nothing; SupplierRecovery never contributes (recoveries are a separate asset, not a reserve offset)."
    constants: {}
    precision: "exact integer cents; the aggregation is a full recompute from source rows on every trigger, never an incremental delta"

  - name: family_reserve_posture
    trigger: "immediately after every evaluation of calculations.family_reserve_balance"
    algorithm: threshold
    formula: |
      ratio_bps = round_half_up(max(0, F.warranty_reserve_balance_cents) * 10000
                                / F.reserve_cap_cents)
      reserve_posture = CONSTRAINED when ratio_bps >= POSTURE_CONSTRAINED_BPS
                        ELEVATED    when ratio_bps >= POSTURE_ELEVATED_BPS
                        NORMAL      otherwise
    input_set: "ProductFamily.warranty_reserve_balance_cents and ProductFamily.reserve_cap_cents (constrained to >= 1, so the division is always defined)."
    constants:
      POSTURE_ELEVATED_BPS: 8000
      POSTURE_CONSTRAINED_BPS: 10000
    precision: "integer basis points; both comparisons are `>=`, so a balance exactly equal to the cap yields CONSTRAINED and a balance exactly 80% of the cap yields ELEVATED"

  - name: adequacy_trend_adjustment
    trigger: "on POST /warranty/adequacy-reviews"
    algorithm: chronological
    formula: |
      P  = AccrualPeriod referenced by AdequacyReview.period_id
      FA = ProductFamily referenced by AdequacyReview.family_id
      A_set = WarrantyAccrual rows with status == POSTED whose vintage_id belongs to a
              ProductVintage with family_id == FA.id, enumerated in created_at ASC

      STEP 1  for each a in A_set:
                earned_a = round_half_up(a.accrued_amount_cents
                                         * a.elapsed_exposure_bps / 10000)
              expected_to_date_cents = sum over A_set of earned_a
      STEP 2  actual_paid_cents = sum(ClaimObservation.paid_cost_cents) over
                ClaimObservation rows whose vintage_id belongs to a ProductVintage
                with family_id == FA.id AND observation_period_code <= P.period_code
                (inclusive lexical upper bound)
      STEP 3  expected_to_date_cents == 0 -> ERR_NO_EXPECTED_BASE (422), nothing persisted
              ave_ratio_bps = round_half_up(actual_paid_cents * 10000
                                            / expected_to_date_cents)
      STEP 4  tier selected from ave_ratio_bps computed in STEP 3:
                ave_ratio_bps <= 8000   -> trend_adjustment_bps = -1000, adequacy_status = REDUNDANT
                ave_ratio_bps <= 12000  -> trend_adjustment_bps = 0,     adequacy_status = SUFFICIENT
                ave_ratio_bps <= 15000  -> trend_adjustment_bps = 1500,  adequacy_status = DEFICIENT
                otherwise               -> trend_adjustment_bps = 3000,  adequacy_status = DEFICIENT
      STEP 5  remaining_base_cents = sum over A_set of
                (a.accrued_amount_cents - earned_a)   # reuses STEP 1's rounded earned_a
      STEP 6  adjusted_remaining_cents = round_half_up(remaining_base_cents
                                          * (10000 + trend_adjustment_bps) / 10000)
      STEP 7  recommended_true_up_cents =
                (adjusted_remaining_cents - remaining_base_cents)
                + (actual_paid_cents - expected_to_date_cents)
    input_set: |
      Only POSTED accruals of the family enter STEP 1 and STEP 5 — DRAFT, PROPOSED
      and SUPERSEDED rows are excluded, and accruals of OTHER periods are included
      because the reserve is measured cumulatively. STEP 2's window is every
      observation period up to and including P.period_code.
    constants:
      TREND_TIER_REDUNDANT_MAX_BPS: 8000
      TREND_TIER_SUFFICIENT_MAX_BPS: 12000
      TREND_TIER_DEFICIENT_MAX_BPS: 15000
    precision: |
      Whole cents; earned_a is rounded PER ACCRUAL before summing. EVALUATION ORDER IS
      PINNED to break an apparent circularity: the trend tier in STEP 4 is selected
      from the ratio computed in STEP 3 against the PRE-true-up posted-accrual base,
      and STEP 6 applies that tier to STEP 5's remaining base. Applying the true-up
      later changes ProductFamily.warranty_reserve_balance_cents but MUST NOT re-run
      STEPS 1-7; the review row is an immutable snapshot of the numbers as of its
      creation.

  - name: service_contract_recognition
    trigger: "on POST /warranty/service-contracts, on POST /warranty/_clock/set_current_utc, and on POST /warranty/service-contracts/{contractId}/cancel"
    algorithm: decay_function
    formula: |
      whole_months_between(d0, d1) =
        12 * (year(d1) - year(d0)) + (month(d1) - month(d0))
        - (1 when day(d1) < day(d0) else 0)
      months_elapsed = min(term_months,
                           max(0, whole_months_between(sold_date, date(logical_now))))

      # ---- variant STRAIGHT_LINE ---------------------------------------------
      recognized_revenue_cents = round_half_up(total_contract_price_cents
                                               * months_elapsed / term_months)

      # ---- variant CLAIMS_PATTERN --------------------------------------------
      elapsed_bps = round_half_up(months_elapsed * 10000 / term_months)
      cum_bps = 1000  when elapsed_bps <= 2500
                3000  when elapsed_bps <= 5000
                6000  when elapsed_bps <= 7500
                10000 otherwise
      recognized_revenue_cents = round_half_up(total_contract_price_cents
                                               * cum_bps / 10000)

      # ---- both variants ------------------------------------------------------
      deferred_revenue_cents = total_contract_price_cents
                               - recognized_revenue_cents - refunded_revenue_cents
      when status == CANCELLED: recognized_revenue_cents is frozen at its value
        immediately before the cancel transition, refunded_revenue_cents holds the
        refund, and deferred_revenue_cents == 0
      when status == EXPIRED: recognized_revenue_cents == total_contract_price_cents
        and deferred_revenue_cents == 0
    input_set: "One ServiceContract row and the logical clock. No warranty accrual, claim observation or field action ever affects extended-service-contract revenue; the two ledgers are strictly separate."
    constants:
      CLAIMS_CURVE_Q1_BPS: 1000
      CLAIMS_CURVE_Q2_BPS: 3000
      CLAIMS_CURVE_Q3_BPS: 6000
      CLAIMS_CURVE_Q4_BPS: 10000
    precision: "whole cents, round_half_up; the curve buckets use inclusive upper bounds, so elapsed_bps exactly 2500 recognizes 1000 bps and exactly 5000 recognizes 3000 bps"
    variants:
      - name: STRAIGHT_LINE
        when: "ServiceContract.recognition_method == STRAIGHT_LINE"
        difference: "Revenue accrues in equal monthly slices, so recognition is exactly proportional to months_elapsed and is 0 at inception."
      - name: CLAIMS_PATTERN
        when: "ServiceContract.recognition_method == CLAIMS_PATTERN"
        difference: "Revenue follows a four-step front-loaded claims-cost curve, recognizing 1000 bps at inception (infant-mortality claims) and jumping at quartile boundaries. For identical price, term, sold_date and clock position the two variants return different recognized_revenue_cents and different deferred_revenue_cents."

  - name: ibnr_liability_reserve
    trigger: "on POST /warranty/liability-reserves and on POST /warranty/liability-reserves/{reserveId}/actuarial-decision with decision == REVIEWED"
    algorithm: weighted_scoring
    formula: |
      FA = ProductFamily referenced by LiabilityReserve.family_id
      avg_case_severity_cents = 0 when reported_claim_count == 0,
        otherwise round_half_up(asserted_case_reserve_cents / reported_claim_count)
      lag_factor_bps = min(LAG_FACTOR_CAP_BPS,
                           LAG_FACTOR_PER_MONTH_BPS * reporting_lag_months)
      ibnr_claim_count = round_half_up(reported_claim_count * lag_factor_bps / 10000)
      trended_severity_cents = round_half_up(avg_case_severity_cents
                                             * (10000 + severity_trend_bps) / 10000)
      raw_ibnr_cents = ibnr_claim_count * trended_severity_cents
      cap_cents = round_half_up(asserted_case_reserve_cents * IBNR_CAP_BPS / 10000)
      floor_cents = FA.units_sold_lifetime * IBNR_FLOOR_CENTS_PER_UNIT
      ibnr_reserve_cents = max(floor_cents, min(raw_ibnr_cents, cap_cents))
      total_liability_reserve_cents = asserted_case_reserve_cents + ibnr_reserve_cents
    input_set: "Four request-supplied actuarial inputs on the LiabilityReserve row plus ProductFamily.units_sold_lifetime. No ClaimObservation, WarrantyAccrual or FieldAction row participates — product-liability reserves are measured independently of the warranty reserve."
    constants:
      LAG_FACTOR_PER_MONTH_BPS: 1200
      LAG_FACTOR_CAP_BPS: 6000
      IBNR_CAP_BPS: 15000
      IBNR_FLOOR_CENTS_PER_UNIT: 25
    precision: |
      Whole cents. CLAMP ORDER IS PINNED: the cap is applied to the raw IBNR first
      (inner `min`), then the exposure floor is applied to that capped value (outer
      `max`). The floor therefore WINS over the cap and ibnr_reserve_cents may exceed
      IBNR_CAP_BPS of asserted_case_reserve_cents whenever the family's unit exposure
      is large relative to its case reserves.

  - name: supplier_recovery_recognized
    trigger: "on POST /warranty/supplier-recoveries, on the assert / respond / close transitions of SupplierRecovery, and on any re-valuation cascade triggered by a change to Supplier.collectability_rating"
    algorithm: threshold
    formula: |
      S = Supplier referenced by SupplierRecovery.supplier_id
      cap_cents = round_half_up(S.annual_purchase_volume_cents
                                * S.contractual_recovery_cap_bps / 10000)
      collectability_rating_at_valuation = S.collectability_rating

      # ---- variant EXPECTED_VALUE --------------------------------------------
      collectability_bps = COLLECTABILITY_BPS[S.collectability_rating]
      recognized_recovery_cents = min(cap_cents,
        round_half_up(asserted_amount_cents * collectability_bps / 10000))

      # ---- variant CONTRACTUAL_FLOOR -----------------------------------------
      recognized_recovery_cents = min(cap_cents, settled_amount_cents)

      when status == WRITTEN_OFF: recognized_recovery_cents = 0
    input_set: "One SupplierRecovery row and its Supplier. The cap is a supplier-level annual ceiling applied per recovery row, not shared across rows."
    constants:
      COLLECTABILITY_BPS: { HIGH: 9000, MEDIUM: 6000, LOW: 2500, IMPAIRED: 0 }
    precision: "whole cents, round_half_up applied before the cap `min`"
    variants:
      - name: EXPECTED_VALUE
        when: "SupplierRecovery.status IN {DRAFT, ASSERTED, NEGOTIATION}"
        difference: "Probability-weights the full asserted claim by the supplier's collectability rating, so the recoverable asset moves whenever the supplier's rating moves, even with no change to the claim itself."

      - name: CONTRACTUAL_FLOOR
        when: "SupplierRecovery.status == SETTLED"
        difference: "Uses the agreed settled amount with no probability weighting, so an identical asserted_amount_cents on an identical supplier yields a different recognized_recovery_cents than the EXPECTED_VALUE variant did one transition earlier."

  - name: supplier_collectability_rating
    trigger: "on POST /warranty/suppliers and on every SupplierRecovery transition into SETTLED or WRITTEN_OFF"
    algorithm: threshold
    formula: |
      base_rating = HIGH     when credit_rating == AAA
                    MEDIUM   when credit_rating == BBB
                    LOW      when credit_rating == CCC
                    IMPAIRED when credit_rating == D
      denom = realized_recovery_cents + written_off_recovery_cents
      realization_bps = 10000 when denom == 0,
        otherwise round_half_up(realized_recovery_cents * 10000 / denom)
      collectability_rating =
        base_rating                  when closed_recovery_count == 0
        base_rating                  when realization_bps >= REALIZATION_HOLD_BPS
        downgrade(base_rating, 1)    when realization_bps >= REALIZATION_WATCH_BPS
        downgrade(base_rating, 2)    otherwise
      downgrade ladder: HIGH -> MEDIUM -> LOW -> IMPAIRED, floored at IMPAIRED
    input_set: "Supplier.credit_rating plus the SETTLED and WRITTEN_OFF recovery aggregates on the same Supplier row. Rows still in DRAFT, ASSERTED or NEGOTIATION do not affect the rating."
    constants:
      REALIZATION_HOLD_BPS: 7500
      REALIZATION_WATCH_BPS: 4000
    precision: "integer basis points; both comparisons are `>=`, so realization_bps exactly 7500 holds the base rating and exactly 4000 downgrades by one notch"

  - name: reserve_rollforward_disclosure
    trigger: "on POST /warranty/periods/{periodId}/rollforward"
    algorithm: aggregation
    formula: |
      P = AccrualPeriod referenced by periodId
      prior = the ReserveRollforward row whose period's period_code is the greatest
              period_code strictly less than P.period_code among AccrualPeriod rows
              with status == CLOSED that have at least one ReserveRollforward row;
              when two ReserveRollforward rows exist for that same period, the one
              with the greatest created_at wins
      beginning_balance_cents = 0 when no such prior row exists,
                                otherwise prior.ending_balance_cents
      accruals_cents = sum(WarrantyAccrual.accrued_amount_cents) over rows with
        period_id == P.id and status == POSTED
      campaign_accruals_cents = sum(FieldAction.specific_accrual_cents) over rows with
        approved_period_id == P.id and approval_state == APPROVED
      changes_in_estimate_cents = sum(AdequacyReview.recommended_true_up_cents) over
        rows with period_id == P.id and true_up_applied == true
      claims_paid_cents = sum(ClaimObservation.paid_cost_cents) over rows with
        observation_period_code == P.period_code
      supplier_recoveries_cents = sum(SupplierRecovery.recognized_recovery_cents) over
        rows with settled_period_id == P.id and status == SETTLED
      ending_balance_cents = beginning_balance_cents + accruals_cents
                           + campaign_accruals_cents + changes_in_estimate_cents
                           - claims_paid_cents + supplier_recoveries_cents
      significant_exposure_count = count of FieldAction rows with
        approved_period_id == P.id, approval_state == APPROVED and
        specific_accrual_cents >= SIGNIFICANT_EXPOSURE_THRESHOLD_CENTS
    input_set: "Every aggregate is scoped to this period by an explicit foreign key (period_id / approved_period_id / settled_period_id) or by period_code equality, with the status filter written out in full. SUPERSEDED accruals, REJECTED field actions, unapplied adequacy reviews and non-SETTLED recoveries are all excluded."
    constants:
      SIGNIFICANT_EXPOSURE_THRESHOLD_CENTS: 50000000
    precision: "exact integer cents; no rounding occurs because every input is already an integer count of cents"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST violated rule decides the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "`X-User-Role` and `X-User-ID` headers are both present and `X-User-Role` is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting `X-User-Role` appears in the endpoint's `roles:` list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "when `X-User-Role == SupplierRep`, `X-User-ID` equals SupplierRecovery.supplier_id of the targeted recovery (and, for list reads, the `supplier_id` filter must equal `X-User-ID`)"
    error_id: ERR_SUPPLIER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /warranty/supplier-recoveries/{recoveryId}/respond, GET /warranty/supplier-recoveries/{recoveryId}, GET /warranty/supplier-recoveries"

  - priority: 4
    category: existence
    check: "every id embedded in the request path resolves to an existing row, validated left-to-right"
    error_id: "ERR_PERIOD_NOT_FOUND | ERR_FAMILY_NOT_FOUND | ERR_VINTAGE_NOT_FOUND | ERR_FAILURE_MODE_NOT_FOUND | ERR_CLAIM_OBSERVATION_NOT_FOUND | ERR_ACCRUAL_NOT_FOUND | ERR_ADEQUACY_REVIEW_NOT_FOUND | ERR_FIELD_ACTION_NOT_FOUND | ERR_SERVICE_CONTRACT_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_RECOVERY_NOT_FOUND | ERR_LIABILITY_RESERVE_NOT_FOUND | ERR_ROLLFORWARD_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint whose path contains an id segment"

  - priority: 5
    category: business_constraint
    check: "request body contains every required field of the endpoint's `input:`, contains no unknown field, and every value satisfies its declared type, enum member set and numeric range (including `observation_period_code` matching the `YYYY-QN` shape, `months_in_service_to > months_in_service_from`, `period_end_date > period_start_date`, `affected_build_end_date >= affected_build_start_date`, and every bps field within 0..10000 unless the entity declares a wider range)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every POST and PATCH endpoint"

  - priority: 6
    category: existence
    check: "every foreign-key id supplied in the request body resolves to an existing row, and `observation_period_code` matches the `period_code` of an existing AccrualPeriod"
    error_id: "ERR_PERIOD_NOT_FOUND | ERR_FAMILY_NOT_FOUND | ERR_VINTAGE_NOT_FOUND | ERR_FAILURE_MODE_NOT_FOUND | ERR_FIELD_ACTION_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_REMEDY_OPTION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /warranty/product-families, PATCH /warranty/product-families/{familyId}, POST /warranty/vintages, POST /warranty/failure-modes, POST /warranty/claim-observations, POST /warranty/accruals, POST /warranty/adequacy-reviews, POST /warranty/field-actions, POST /warranty/field-actions/{fieldActionId}/remedy-options, POST /warranty/field-actions/{fieldActionId}/select-remedy, POST /warranty/service-contracts, POST /warranty/supplier-recoveries, POST /warranty/liability-reserves"

  - priority: 7
    category: business_referential
    check: "ProductFamily.analog_family_id, when supplied, is not the id of the row being created or patched"
    error_id: ERR_SELF_ANALOG_REFERENCE
    http_status: 422
    applies_to: "PATCH /warranty/product-families/{familyId}"

  - priority: 8
    category: business_constraint
    check: "the code field is unique within its declared scope — AccrualPeriod.period_code globally, ProductFamily.family_code globally, FieldAction.action_code globally, ServiceContract.contract_number globally, Supplier.supplier_code globally, ProductVintage.vintage_code within family_id, FailureMode.mode_code within family_id, RemedyOption.option_code within field_action_id"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /warranty/periods, POST /warranty/product-families, POST /warranty/vintages, POST /warranty/failure-modes, POST /warranty/field-actions, POST /warranty/field-actions/{fieldActionId}/remedy-options, POST /warranty/service-contracts, POST /warranty/suppliers"

  - priority: 9
    category: state
    check: "payload `expected_period_version` equals the current AccrualPeriod.version"
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412
    applies_to: "POST /warranty/accruals, POST /warranty/periods/{periodId}/rollforward"

  - priority: 10
    category: state
    check: "payload `expected_field_action_version` equals the current FieldAction.version"
    error_id: ERR_STALE_FIELD_ACTION_VERSION
    http_status: 412
    applies_to: "POST /warranty/field-actions/{fieldActionId}/select-remedy"

  - priority: 11
    category: state
    check: "the AccrualPeriod that scopes the mutation — the row referenced by `period_id`, by the target row's `period_id`, or by `observation_period_code` — has status != CLOSED"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /warranty/claim-observations, POST /warranty/accruals, POST /warranty/accruals/{accrualId}/propose, POST /warranty/accruals/{accrualId}/revise, POST /warranty/accruals/{accrualId}/post, POST /warranty/adequacy-reviews, POST /warranty/adequacy-reviews/{reviewId}/apply-true-up, POST /warranty/liability-reserves, POST /warranty/liability-reserves/{reserveId}/actuarial-decision, POST /warranty/liability-reserves/{reserveId}/book, POST /warranty/periods/{periodId}/rollforward"

  - priority: 12
    category: state
    check: "the target row is in a `from:` state that §1.2 declares for the requested transition (including AccrualPeriod.status == ANALYSIS_LOCKED for accrual posting, AccrualPeriod.status IN {ANALYSIS_LOCKED, ACTUARIAL_REVIEW} for actuarial review, AccrualPeriod.status == ACTUARIAL_REVIEW for booking, FieldAction.selected_remedy_option_id != null for submit, and terminal-state lockdown on WarrantyAccrual.SUPERSEDED / SupplierRecovery.{SETTLED, WRITTEN_OFF} / LiabilityReserve.BOOKED / AccrualPeriod.CLOSED / ServiceContract.{CANCELLED, EXPIRED})"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 13
    category: state
    check: "zero WarrantyAccrual rows exist with period_id == this period and status IN {DRAFT, PROPOSED}"
    error_id: ERR_UNPOSTED_ACCRUALS_REMAIN
    http_status: 409
    applies_to: "POST /warranty/periods/{periodId}/open-actuarial-review"

  - priority: 14
    category: state
    check: "AccrualPeriod.rollforward_generated == true"
    error_id: ERR_ROLLFORWARD_MISSING
    http_status: 409
    applies_to: "POST /warranty/periods/{periodId}/close"

  - priority: 15
    category: state
    check: "every LiabilityReserve row with period_id == this period has status == BOOKED"
    error_id: ERR_LIABILITY_RESERVE_NOT_BOOKED
    http_status: 409
    applies_to: "POST /warranty/periods/{periodId}/close"

  - priority: 16
    category: state
    check: "FieldAction.approval_state == APPROVED before the execution dimension may leave NOT_STARTED"
    error_id: ERR_EXECUTION_BEFORE_APPROVAL
    http_status: 409
    applies_to: "POST /warranty/field-actions/{fieldActionId}/execution-progress"

  - priority: 17
    category: business_safety
    check: "when FieldAction.is_safety_recall == true, the remedy option being selected (explicitly or by the selector) has remedy_class == PERMANENT_REPAIR, and the option referenced by selected_remedy_option_id still has remedy_class == PERMANENT_REPAIR at submit time"
    error_id: ERR_SAFETY_REMEDY_REQUIRED
    http_status: 422
    applies_to: "POST /warranty/field-actions/{fieldActionId}/select-remedy, POST /warranty/field-actions/{fieldActionId}/submit"

  - priority: 18
    category: business_safety
    check: "when FieldAction.is_safety_recall == true, FieldAction.regulatory_notice_filed == true before an APPROVED decision may be recorded"
    error_id: ERR_REGULATORY_NOTICE_MISSING
    http_status: 422
    applies_to: "POST /warranty/field-actions/{fieldActionId}/decision"

  - priority: 19
    category: business_constraint
    check: "segregation of duties — `X-User-ID` differs from WarrantyAccrual.proposed_by_user_id when posting an accrual, from FieldAction.submitted_by_user_id when deciding a field action, and from LiabilityReserve.reviewed_by_user_id when booking a liability reserve"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /warranty/accruals/{accrualId}/post, POST /warranty/field-actions/{fieldActionId}/decision, POST /warranty/liability-reserves/{reserveId}/book"

  - priority: 20
    category: business_referential
    check: "the RemedyOption supplied as `remedy_option_id` has field_action_id equal to the field action in the path"
    error_id: ERR_REMEDY_OPTION_MISMATCH
    http_status: 422
    applies_to: "POST /warranty/field-actions/{fieldActionId}/select-remedy"

  - priority: 21
    category: business_referential
    check: "at least one FailureMode row exists with family_id == the accrual vintage's family_id"
    error_id: ERR_NO_FAILURE_MODES_DEFINED
    http_status: 422
    applies_to: "POST /warranty/accruals"

  - priority: 22
    category: business_referential
    check: "when method == ANALOG_BLEND, the vintage's ProductFamily has both analog_family_id != null and engineering_estimate_rate_ppm != null"
    error_id: ERR_ANALOG_BASIS_MISSING
    http_status: 422
    applies_to: "POST /warranty/accruals"

  - priority: 23
    category: business_referential
    check: "when SupplierRecovery.field_action_id != null, that FieldAction has approval_state == APPROVED"
    error_id: ERR_FIELD_ACTION_NOT_APPROVED
    http_status: 422
    applies_to: "POST /warranty/supplier-recoveries/{recoveryId}/assert"

  - priority: 24
    category: business_constraint
    check: "when method == HISTORICAL_RATE, the vintage's ProductFamily has history_maturity_status == MATURE (observed_history_months >= 12 AND observed_exposure_units >= 5000)"
    error_id: ERR_INSUFFICIENT_CLAIM_HISTORY
    http_status: 422
    applies_to: "POST /warranty/accruals"

  - priority: 25
    category: business_constraint
    check: "the referenced ProductVintage has exposure_status == ACTIVE"
    error_id: ERR_VINTAGE_EXPOSURE_EXPIRED
    http_status: 422
    applies_to: "POST /warranty/accruals"

  - priority: 26
    category: business_constraint
    check: "zero WarrantyAccrual rows exist with the same (period_id, vintage_id) and status IN {DRAFT, PROPOSED}"
    error_id: ERR_DUPLICATE_ACCRUAL
    http_status: 409
    applies_to: "POST /warranty/accruals"

  - priority: 27
    category: business_constraint
    check: "zero LiabilityReserve rows exist with the same (period_id, family_id) and status IN {DRAFT, ACTUARY_REVIEWED, BOOKED}"
    error_id: ERR_DUPLICATE_LIABILITY_RESERVE
    http_status: 409
    applies_to: "POST /warranty/liability-reserves"

  - priority: 28
    category: business_constraint
    check: "the referenced Supplier has collectability_rating != IMPAIRED"
    error_id: ERR_SUPPLIER_IMPAIRED
    http_status: 422
    applies_to: "POST /warranty/supplier-recoveries/{recoveryId}/assert"

  - priority: 29
    category: business_constraint
    check: "when `remedy_option_id` is omitted, the eligibility filter of calculations.remedy_option_selection yields at least one RemedyOption"
    error_id: ERR_NO_ELIGIBLE_REMEDY_OPTION
    http_status: 422
    applies_to: "POST /warranty/field-actions/{fieldActionId}/select-remedy"

  - priority: 30
    category: business_constraint
    check: "the eligibility filter of calculations.booking_period_selection yields at least one AccrualPeriod with status IN {OPEN, ANALYSIS_LOCKED}"
    error_id: ERR_NO_OPEN_PERIOD
    http_status: 422
    applies_to: "POST /warranty/field-actions/{fieldActionId}/decision, POST /warranty/supplier-recoveries/{recoveryId}/close"

  - priority: 31
    category: business_constraint
    check: "STEP 1 of calculations.adequacy_trend_adjustment produces expected_to_date_cents > 0"
    error_id: ERR_NO_EXPECTED_BASE
    http_status: 422
    applies_to: "POST /warranty/adequacy-reviews"

  - priority: 32
    category: business_temporal
    check: |
      HALF-OPEN interval geometry — the new development bucket
      [months_in_service_from, months_in_service_to) must not intersect the bucket of
      any existing ClaimObservation row with the SAME (vintage_id, failure_mode_id).
      Two buckets intersect exactly when new.from < existing.to AND existing.from < new.to.
      Adjacency is therefore LEGAL: an existing [0,12) accepts a new [12,24) and a new
      [24,36) but rejects [11,13) and rejects [0,12) itself.
    error_id: ERR_OBSERVATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /warranty/claim-observations"

  - priority: 33
    category: business_temporal
    check: |
      CLOSED interval geometry WITH A BUFFER — the new affected-build window
      [affected_build_start_date, affected_build_end_date] (both endpoints inclusive)
      must not intersect any existing FieldAction window on the SAME family_id with
      approval_state IN {DRAFT, SUBMITTED, APPROVED} after that existing window is
      expanded by FIELD_ACTION_QUIET_BUFFER_DAYS = 30 calendar days on BOTH sides.
      Conflict condition: new.start <= existing.end + 30 days
      AND existing.start - 30 days <= new.end. Adjacency is therefore ILLEGAL and any
      gap of 30 days or less is also illegal; a gap of 31 days or more is accepted.
      FieldAction rows with approval_state == REJECTED are excluded from the check.
    error_id: ERR_FIELD_ACTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /warranty/field-actions"

  - priority: 34
    category: business_temporal
    check: "ServiceContract.sold_date >= the referenced ProductFamily.launch_date"
    error_id: ERR_CONTRACT_PRECEDES_LAUNCH
    http_status: 422
    applies_to: "POST /warranty/service-contracts"

  - priority: 35
    category: business_fiscal
    check: "when outcome == SETTLED, payload settled_amount_cents <= SupplierRecovery.asserted_amount_cents"
    error_id: ERR_SETTLEMENT_EXCEEDS_ASSERTED
    http_status: 422
    applies_to: "POST /warranty/supplier-recoveries/{recoveryId}/close"

  - priority: 36
    category: business_fiscal
    check: "the ProductFamily.warranty_reserve_balance_cents that calculations.family_reserve_balance would return with this accrual counted as POSTED is <= ProductFamily.reserve_cap_cents (field-action approvals and adequacy true-ups are deliberately NOT cap-gated, because they are legal obligations rather than discretionary estimates)"
    error_id: ERR_RESERVE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /warranty/accruals/{accrualId}/post"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- AccrualPeriod --------------------------------------------------------
  - method: POST
    path: "/warranty/periods"
    description: "Open a new fiscal accrual period in status OPEN."
    roles: [ReserveController]
    code: 201
    input: [period_code, period_start_date, period_end_date]
    output: AccrualPeriod
    side_effects: ["creates AccrualPeriod with status = OPEN, reopen_count = 0, version = 1"]

  - method: GET
    path: "/warranty/periods/{periodId}"
    description: "Read one accrual period including its computed disclosure counters."
    roles: [ReserveController, WarrantyAnalyst, QualityEngineer, Actuary]
    code: 200
    input: []
    output: AccrualPeriod
    side_effects: []

  - method: POST
    path: "/warranty/periods/{periodId}/lock-analysis"
    description: "Transition OPEN -> ANALYSIS_LOCKED."
    roles: [ReserveController]
    code: 200
    input: []
    output: AccrualPeriod
    side_effects: ["sets locked_at = logical_now", "increments AccrualPeriod.version by 1"]

  - method: POST
    path: "/warranty/periods/{periodId}/open-actuarial-review"
    description: "Transition ANALYSIS_LOCKED -> ACTUARIAL_REVIEW; rejected while any DRAFT or PROPOSED accrual remains in the period."
    roles: [ReserveController]
    code: 200
    input: []
    output: AccrualPeriod
    side_effects: ["increments AccrualPeriod.version by 1"]

  - method: POST
    path: "/warranty/periods/{periodId}/reopen-analysis"
    description: "Cyclic transition ACTUARIAL_REVIEW -> ANALYSIS_LOCKED; returns every ACTUARY_REVIEWED liability reserve of the period to DRAFT."
    roles: [ReserveController]
    code: 200
    input: []
    output: AccrualPeriod
    side_effects:
      - "reopen_count += 1; locked_at = logical_now"
      - "cascades LiabilityReserve ACTUARY_REVIEWED -> DRAFT with return_count += 1"
      - "increments AccrualPeriod.version by 1"

  - method: POST
    path: "/warranty/periods/{periodId}/close"
    description: "Transition ACTUARIAL_REVIEW -> CLOSED; requires a generated rollforward and every liability reserve of the period BOOKED."
    roles: [ReserveController]
    code: 200
    input: []
    output: AccrualPeriod
    side_effects: ["sets closed_at = logical_now", "increments AccrualPeriod.version by 1"]

  - method: POST
    path: "/warranty/periods/{periodId}/rollforward"
    description: "Generate the immutable warranty-reserve rollforward disclosure snapshot for the period."
    roles: [ReserveController]
    code: 201
    input: [expected_period_version]
    output: ReserveRollforward
    side_effects:
      - "creates ReserveRollforward via calculations.reserve_rollforward_disclosure"
      - "sets AccrualPeriod.rollforward_generated = true"
      - "increments AccrualPeriod.version by 1"

  - method: GET
    path: "/warranty/rollforwards/{rollforwardId}"
    description: "Read one rollforward disclosure snapshot."
    roles: [ReserveController, WarrantyAnalyst, Actuary]
    code: 200
    input: []
    output: ReserveRollforward
    side_effects: []

  - method: GET
    path: "/warranty/rollforwards"
    description: "List rollforward snapshots, optionally filtered by period."
    roles: [ReserveController, WarrantyAnalyst, Actuary]
    code: 200
    input: ["period_id?", "limit?", "offset?"]
    output: ReserveRollforward[]
    side_effects: []

  # ---- ProductFamily / ProductVintage / FailureMode -------------------------
  - method: POST
    path: "/warranty/product-families"
    description: "Register a durable-goods product family."
    roles: [WarrantyAnalyst]
    code: 201
    input: ["family_code", "name", "launch_date", "base_warranty_months", "standard_cost_per_claim_cents", "reserve_cap_cents", "engineering_estimate_rate_ppm?", "analog_family_id?"]
    output: ProductFamily
    side_effects: ["evaluates calculations.history_maturity_classification (LIMITED with zero observations) and calculations.family_reserve_posture (NORMAL at balance 0)"]

  - method: PATCH
    path: "/warranty/product-families/{familyId}"
    description: "Update engineering/analog/governance attributes of a product family."
    roles: [WarrantyAnalyst]
    code: 200
    input: ["name?", "base_warranty_months?", "standard_cost_per_claim_cents?", "engineering_estimate_rate_ppm?", "analog_family_id?", "reserve_cap_cents?"]
    output: ProductFamily
    side_effects:
      - "re-evaluates calculations.history_maturity_classification"
      - "re-evaluates calculations.family_reserve_posture against the new reserve_cap_cents"
      - "increments ProductFamily.version by 1"

  - method: GET
    path: "/warranty/product-families/{familyId}"
    description: "Read one product family including reserve balance, posture and maturity."
    roles: [WarrantyAnalyst, ReserveController, QualityEngineer, Actuary]
    code: 200
    input: []
    output: ProductFamily
    side_effects: []

  - method: GET
    path: "/warranty/product-families"
    description: "List product families, optionally filtered by analog predecessor or maturity."
    roles: [WarrantyAnalyst, ReserveController, QualityEngineer, Actuary]
    code: 200
    input: ["analog_family_id?", "history_maturity_status?", "limit?", "offset?"]
    output: ProductFamily[]
    side_effects: []

  - method: POST
    path: "/warranty/vintages"
    description: "Register a production cohort (vintage) under a product family."
    roles: [WarrantyAnalyst]
    code: 201
    input: [family_id, vintage_code, units_shipped, ship_period_code, warranty_expiry_date]
    output: ProductVintage
    side_effects:
      - "computes exposure_status from the logical clock"
      - "re-evaluates calculations.history_maturity_classification for the family"

  - method: GET
    path: "/warranty/vintages/{vintageId}"
    description: "Read one production cohort."
    roles: [WarrantyAnalyst, ReserveController, QualityEngineer, Actuary]
    code: 200
    input: []
    output: ProductVintage
    side_effects: []

  - method: GET
    path: "/warranty/vintages"
    description: "List production cohorts, optionally filtered by family or exposure status."
    roles: [WarrantyAnalyst, ReserveController, QualityEngineer, Actuary]
    code: 200
    input: ["family_id?", "exposure_status?", "limit?", "offset?"]
    output: ProductVintage[]
    side_effects: []

  - method: POST
    path: "/warranty/failure-modes"
    description: "Register a failure mode with its cost per claim and optional responsible component supplier."
    roles: [WarrantyAnalyst]
    code: 201
    input: ["family_id", "mode_code", "description", "severity", "cost_per_claim_cents", "supplier_id?"]
    output: FailureMode
    side_effects: []

  - method: GET
    path: "/warranty/failure-modes/{failureModeId}"
    description: "Read one failure mode."
    roles: [WarrantyAnalyst, ReserveController, QualityEngineer, Actuary]
    code: 200
    input: []
    output: FailureMode
    side_effects: []

  - method: GET
    path: "/warranty/failure-modes"
    description: "List failure modes, optionally filtered by family or supplier."
    roles: [WarrantyAnalyst, ReserveController, QualityEngineer, Actuary]
    code: 200
    input: ["family_id?", "supplier_id?", "limit?", "offset?"]
    output: FailureMode[]
    side_effects: []

  # ---- ClaimObservation -----------------------------------------------------
  - method: POST
    path: "/warranty/claim-observations"
    description: "Append an immutable historical claim observation for one (vintage, failure mode, months-in-service bucket)."
    roles: [WarrantyAnalyst]
    code: 201
    input: [vintage_id, failure_mode_id, observation_period_code, months_in_service_from, months_in_service_to, claim_count, paid_cost_cents]
    output: ClaimObservation
    side_effects: ["re-evaluates calculations.history_maturity_classification for the vintage's family"]

  - method: GET
    path: "/warranty/claim-observations/{observationId}"
    description: "Read one claim observation."
    roles: [WarrantyAnalyst, ReserveController, QualityEngineer, Actuary]
    code: 200
    input: []
    output: ClaimObservation
    side_effects: []

  - method: GET
    path: "/warranty/claim-observations"
    description: "List claim observations, optionally filtered by vintage or failure mode."
    roles: [WarrantyAnalyst, ReserveController, QualityEngineer, Actuary]
    code: 200
    input: ["vintage_id?", "failure_mode_id?", "limit?", "offset?"]
    output: ClaimObservation[]
    side_effects: []

  # ---- WarrantyAccrual ------------------------------------------------------
  - method: POST
    path: "/warranty/accruals"
    description: "Create a DRAFT warranty accrual for one (period, vintage) under the chosen estimation method. OCC-guarded on the period."
    roles: [WarrantyAnalyst]
    code: 201
    input: [period_id, vintage_id, method, elapsed_exposure_bps, expected_period_version]
    output: WarrantyAccrual
    side_effects:
      - "computes expected_claim_rate_ppm, cost_per_claim_basis_cents, paid_to_date_cents and accrued_amount_cents via calculations.warranty_accrual_amount"
      - "increments AccrualPeriod.version by 1"

  - method: GET
    path: "/warranty/accruals/{accrualId}"
    description: "Read one warranty accrual including its computed amount."
    roles: [WarrantyAnalyst, ReserveController, Actuary]
    code: 200
    input: []
    output: WarrantyAccrual
    side_effects: []

  - method: GET
    path: "/warranty/accruals"
    description: "List warranty accruals, optionally filtered by period, vintage or status."
    roles: [WarrantyAnalyst, ReserveController, Actuary]
    code: 200
    input: ["period_id?", "vintage_id?", "status?", "limit?", "offset?"]
    output: WarrantyAccrual[]
    side_effects: []

  - method: POST
    path: "/warranty/accruals/{accrualId}/propose"
    description: "Transition DRAFT -> PROPOSED and re-run the accrual estimate against current claim data."
    roles: [WarrantyAnalyst]
    code: 200
    input: []
    output: WarrantyAccrual
    side_effects: ["sets proposed_by_user_id = X-User-ID", "recomputes accrued_amount_cents"]

  - method: POST
    path: "/warranty/accruals/{accrualId}/revise"
    description: "Cyclic transition PROPOSED -> DRAFT for re-estimation."
    roles: [WarrantyAnalyst]
    code: 200
    input: []
    output: WarrantyAccrual
    side_effects: ["revision_index += 1", "clears proposed_by_user_id"]

  - method: POST
    path: "/warranty/accruals/{accrualId}/post"
    description: "Transition PROPOSED -> POSTED under segregation of duties, superseding any prior POSTED accrual for the same (period, vintage)."
    roles: [ReserveController]
    code: 200
    input: []
    output: WarrantyAccrual
    side_effects:
      - "sets posted_by_user_id = X-User-ID"
      - "cascades any prior POSTED accrual for the same (period_id, vintage_id) to SUPERSEDED"
      - "recomputes ProductFamily.warranty_reserve_balance_cents and then ProductFamily.reserve_posture"

  # ---- AdequacyReview -------------------------------------------------------
  - method: POST
    path: "/warranty/adequacy-reviews"
    description: "Run actual-versus-expected reserve adequacy analysis for one (period, family) and snapshot the trend-adjusted true-up recommendation."
    roles: [WarrantyAnalyst]
    code: 201
    input: [period_id, family_id]
    output: AdequacyReview
    side_effects: ["evaluates calculations.adequacy_trend_adjustment STEPS 1-7 and persists every intermediate"]

  - method: GET
    path: "/warranty/adequacy-reviews/{reviewId}"
    description: "Read one adequacy review snapshot."
    roles: [WarrantyAnalyst, ReserveController, Actuary]
    code: 200
    input: []
    output: AdequacyReview
    side_effects: []

  - method: GET
    path: "/warranty/adequacy-reviews"
    description: "List adequacy reviews, optionally filtered by period or family."
    roles: [WarrantyAnalyst, ReserveController, Actuary]
    code: 200
    input: ["period_id?", "family_id?", "limit?", "offset?"]
    output: AdequacyReview[]
    side_effects: []

  - method: POST
    path: "/warranty/adequacy-reviews/{reviewId}/apply-true-up"
    description: "Book the review's recommended change in estimate into the family reserve."
    roles: [ReserveController]
    code: 200
    input: []
    output: AdequacyReview
    side_effects:
      - "sets true_up_applied = true and applied_by_user_id = X-User-ID"
      - "because the row entered the true_up_applied filter, recomputes ProductFamily.warranty_reserve_balance_cents"
      - "because the balance changed, recomputes ProductFamily.reserve_posture"

  # ---- FieldAction / RemedyOption -------------------------------------------
  - method: POST
    path: "/warranty/field-actions"
    description: "Open a service campaign, safety recall or field bulletin in approval_state DRAFT and execution_state NOT_STARTED."
    roles: [QualityEngineer]
    code: 201
    input: ["family_id", "action_code", "action_type", "affected_build_start_date", "affected_build_end_date", "affected_unit_count", "regulatory_notice_filed?"]
    output: FieldAction
    side_effects: ["computes is_safety_recall from action_type", "enforces the 30-day buffered build-window conflict check"]

  - method: GET
    path: "/warranty/field-actions/{fieldActionId}"
    description: "Read one field action including both state dimensions and its specific accrual."
    roles: [QualityEngineer, ReserveController, WarrantyAnalyst, Actuary]
    code: 200
    input: []
    output: FieldAction
    side_effects: []

  - method: GET
    path: "/warranty/field-actions"
    description: "List field actions, optionally filtered by family, selected remedy, approving period or approval state."
    roles: [QualityEngineer, ReserveController, WarrantyAnalyst, Actuary]
    code: 200
    input: ["family_id?", "selected_remedy_option_id?", "approved_period_id?", "approval_state?", "limit?", "offset?"]
    output: FieldAction[]
    side_effects: []

  - method: POST
    path: "/warranty/field-actions/{fieldActionId}/remedy-options"
    description: "Add a candidate remedy option with its per-unit cost estimate and expected take rate."
    roles: [QualityEngineer]
    code: 201
    input: ["option_code", "remedy_class", "parts_cost_cents", "labor_hours_centi", "admin_cost_cents", "expected_take_rate_bps", "is_engineering_approved?"]
    output: RemedyOption
    side_effects: ["computes per_unit_expected_cents via calculations.field_action_specific_accrual"]

  - method: GET
    path: "/warranty/field-actions/{id}/remedy-options"
    description: "List the candidate remedy options of one field action."
    roles: [QualityEngineer, ReserveController, WarrantyAnalyst, Actuary]
    code: 200
    input: ["limit?", "offset?"]
    output: RemedyOption[]
    side_effects: []

  - method: POST
    path: "/warranty/field-actions/{fieldActionId}/select-remedy"
    description: "Select the remedy that drives the specific accrual, either explicitly or by the server-side cheapest-eligible selector. OCC-guarded on the field action; also returns a REJECTED action to DRAFT."
    roles: [QualityEngineer]
    code: 200
    input: ["expected_field_action_version", "remedy_option_id?"]
    output: FieldAction
    side_effects:
      - "sets selected_remedy_option_id per calculations.remedy_option_selection"
      - "recomputes RemedyOption.per_unit_expected_cents and FieldAction.specific_accrual_cents"
      - "when approval_state == REJECTED, resets it to DRAFT and clears submitted_by_user_id / decided_by_user_id"
      - "increments FieldAction.version by 1"

  - method: POST
    path: "/warranty/field-actions/{fieldActionId}/submit"
    description: "Transition approval_state DRAFT -> SUBMITTED."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: FieldAction
    side_effects: ["sets submitted_by_user_id = X-User-ID"]

  - method: POST
    path: "/warranty/field-actions/{fieldActionId}/decision"
    description: "Record the SUBMITTED -> APPROVED or SUBMITTED -> REJECTED branch under segregation of duties; APPROVED books the specific accrual and drives the four-hop reserve cascade."
    roles: [ReserveController]
    code: 200
    input: [decision]
    output: FieldAction
    side_effects:
      - "APPROVED: sets approved_period_id via calculations.booking_period_selection, recomputes specific_accrual_cents, then ProductFamily.warranty_reserve_balance_cents, then ProductFamily.reserve_posture, then reverts every PROPOSED accrual of the family to DRAFT when the posture became CONSTRAINED"
      - "APPROVED: recomputes AccrualPeriod.significant_exposure_count and requires_significant_exposure_disclosure"
      - "REJECTED: sets specific_accrual_cents = 0 and leaves approved_period_id null"

  - method: POST
    path: "/warranty/field-actions/{fieldActionId}/execution-progress"
    description: "Advance the independent execution dimension NOT_STARTED -> IN_PROGRESS -> COMPLETED and accumulate incurred cost."
    roles: [QualityEngineer]
    code: 200
    input: ["to_execution_state", "incurred_cost_cents?"]
    output: FieldAction
    side_effects:
      - "executed_cost_cents += incurred_cost_cents"
      - "on COMPLETED: recomputes ProductFamily.warranty_reserve_balance_cents and then ProductFamily.reserve_posture"

  # ---- ServiceContract ------------------------------------------------------
  - method: POST
    path: "/warranty/service-contracts"
    description: "Sell an extended service contract and set up its revenue deferral schedule, kept strictly separate from the base warranty accrual."
    roles: [WarrantyAnalyst]
    code: 201
    input: [family_id, contract_number, sold_date, term_months, total_contract_price_cents, recognition_method]
    output: ServiceContract
    side_effects: ["evaluates calculations.service_contract_recognition at the current logical clock"]

  - method: GET
    path: "/warranty/service-contracts/{contractId}"
    description: "Read one extended service contract including recognized and deferred revenue."
    roles: [WarrantyAnalyst, ReserveController, Actuary]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: GET
    path: "/warranty/service-contracts"
    description: "List extended service contracts, optionally filtered by family or status."
    roles: [WarrantyAnalyst, ReserveController, Actuary]
    code: 200
    input: ["family_id?", "status?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []

  - method: POST
    path: "/warranty/service-contracts/{contractId}/cancel"
    description: "Cancel an ACTIVE contract, refunding exactly the unearned (deferred) balance."
    roles: [WarrantyAnalyst]
    code: 200
    input: []
    output: ServiceContract
    side_effects:
      - "refunded_revenue_cents = pre-cancel deferred_revenue_cents; deferred_revenue_cents = 0; cancelled_at = logical_now"
      - "freezes recognized_revenue_cents so it no longer tracks the logical clock"

  # ---- Supplier / SupplierRecovery ------------------------------------------
  - method: POST
    path: "/warranty/suppliers"
    description: "Register a component supplier with its credit rating and contractual recovery cap."
    roles: [WarrantyAnalyst]
    code: 201
    input: [supplier_code, name, credit_rating, annual_purchase_volume_cents, contractual_recovery_cap_bps]
    output: Supplier
    side_effects: ["evaluates calculations.supplier_collectability_rating with zero closed history, so collectability_rating = base_rating"]

  - method: GET
    path: "/warranty/suppliers/{supplierId}"
    description: "Read one supplier including its recovery aggregates and collectability rating."
    roles: [WarrantyAnalyst, ReserveController, Actuary]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: POST
    path: "/warranty/supplier-recoveries"
    description: "Open a DRAFT supplier recovery claim for a component-defect-driven failure mode, optionally tied to a field action."
    roles: [WarrantyAnalyst]
    code: 201
    input: ["supplier_id", "failure_mode_id", "asserted_amount_cents", "field_action_id?"]
    output: SupplierRecovery
    side_effects: ["evaluates calculations.supplier_recovery_recognized under the EXPECTED_VALUE variant"]

  - method: GET
    path: "/warranty/supplier-recoveries/{recoveryId}"
    description: "Read one supplier recovery claim."
    roles: [WarrantyAnalyst, ReserveController, Actuary, SupplierRep]
    code: 200
    input: []
    output: SupplierRecovery
    side_effects: []

  - method: GET
    path: "/warranty/supplier-recoveries"
    description: "List supplier recovery claims, optionally filtered by supplier, failure mode, field action or settlement period."
    roles: [WarrantyAnalyst, ReserveController, Actuary, SupplierRep]
    code: 200
    input: ["supplier_id?", "failure_mode_id?", "field_action_id?", "settled_period_id?", "status?", "limit?", "offset?"]
    output: SupplierRecovery[]
    side_effects: []

  - method: POST
    path: "/warranty/supplier-recoveries/{recoveryId}/assert"
    description: "Assert (or, from NEGOTIATION, re-assert at a revised amount) the recovery claim against the supplier."
    roles: [WarrantyAnalyst]
    code: 200
    input: ["revised_asserted_amount_cents?"]
    output: SupplierRecovery
    side_effects:
      - "assert_count += 1; clears supplier_response_note"
      - "re-values recognized_recovery_cents under EXPECTED_VALUE"
      - "recomputes Supplier.gross_asserted_recovery_cents and Supplier.open_recovery_asset_cents"

  - method: POST
    path: "/warranty/supplier-recoveries/{recoveryId}/respond"
    description: "Supplier acknowledges the claim and moves it into NEGOTIATION. Restricted to the owning supplier."
    roles: [SupplierRep]
    code: 200
    input: [response_note]
    output: SupplierRecovery
    side_effects: ["sets supplier_response_note", "re-values recognized_recovery_cents under EXPECTED_VALUE"]

  - method: POST
    path: "/warranty/supplier-recoveries/{recoveryId}/close"
    description: "Close the claim as SETTLED at an agreed amount or as WRITTEN_OFF; drives the five-hop supplier re-rating cascade."
    roles: [ReserveController]
    code: 200
    input: ["outcome", "settled_amount_cents?"]
    output: SupplierRecovery
    side_effects:
      - "SETTLED: sets settled_amount_cents and settled_period_id, switches valuation_variant to CONTRACTUAL_FLOOR"
      - "recomputes Supplier aggregates, then Supplier.realization_bps and Supplier.collectability_rating, then re-values every other {ASSERTED, NEGOTIATION} recovery of the supplier in created_at ASC order, then recomputes Supplier.open_recovery_asset_cents once more"

  # ---- LiabilityReserve -----------------------------------------------------
  - method: POST
    path: "/warranty/liability-reserves"
    description: "Create a DRAFT product-liability reserve for one (period, family) from asserted case reserves plus actuarial IBNR inputs."
    roles: [Actuary]
    code: 201
    input: [period_id, family_id, reported_claim_count, asserted_case_reserve_cents, reporting_lag_months, severity_trend_bps]
    output: LiabilityReserve
    side_effects: ["evaluates calculations.ibnr_liability_reserve"]

  - method: GET
    path: "/warranty/liability-reserves/{reserveId}"
    description: "Read one product-liability reserve."
    roles: [Actuary, ReserveController, WarrantyAnalyst]
    code: 200
    input: []
    output: LiabilityReserve
    side_effects: []

  - method: GET
    path: "/warranty/liability-reserves"
    description: "List product-liability reserves, optionally filtered by period or family."
    roles: [Actuary, ReserveController, WarrantyAnalyst]
    code: 200
    input: ["period_id?", "family_id?", "status?", "limit?", "offset?"]
    output: LiabilityReserve[]
    side_effects: []

  - method: POST
    path: "/warranty/liability-reserves/{reserveId}/actuarial-decision"
    description: "Record the actuary's REVIEWED (DRAFT -> ACTUARY_REVIEWED) or RETURNED (ACTUARY_REVIEWED -> DRAFT) decision."
    roles: [Actuary]
    code: 200
    input: [decision]
    output: LiabilityReserve
    side_effects:
      - "REVIEWED: sets reviewed_by_user_id = X-User-ID and re-runs calculations.ibnr_liability_reserve"
      - "RETURNED: return_count += 1 and clears reviewed_by_user_id"

  - method: POST
    path: "/warranty/liability-reserves/{reserveId}/book"
    description: "Transition ACTUARY_REVIEWED -> BOOKED under segregation of duties; required before the period can close."
    roles: [ReserveController]
    code: 200
    input: []
    output: LiabilityReserve
    side_effects: ["satisfies the AccrualPeriod close guard for this period"]

  # ---- Test-driving surface -------------------------------------------------
  - method: POST
    path: "/warranty/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Advancing the clock re-evaluates ProductVintage.exposure_status, ProductFamily.history_maturity_classification, and ServiceContract recognition (auto-transitioning ACTIVE -> EXPIRED in created_at ASC order once months_elapsed >= term_months)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "recomputes ProductVintage.exposure_status for every vintage"
      - "recomputes ServiceContract.months_elapsed / recognized_revenue_cents / deferred_revenue_cents for every ACTIVE contract"
      - "auto-transitions ACTIVE -> EXPIRED for contracts whose months_elapsed >= term_months"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth / authorization -------------------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "the acting role is not listed in the endpoint's roles" }
  - { id: ERR_SUPPLIER_SCOPE_VIOLATION, http: 403, condition: "a SupplierRep acts on or filters a SupplierRecovery whose supplier_id differs from its X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the acting X-User-ID equals the proposer of the accrual, the submitter of the field action, or the reviewer of the liability reserve" }

  # ---- request shape --------------------------------------------------------
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, unknown field, wrong type, enum value outside the declared member set, or numeric value outside the declared range" }

  # ---- existence ------------------------------------------------------------
  - { id: ERR_PERIOD_NOT_FOUND, http: 404, condition: "periodId / period_id / observation_period_code does not resolve to an AccrualPeriod" }
  - { id: ERR_FAMILY_NOT_FOUND, http: 404, condition: "familyId / family_id / analog_family_id does not resolve to a ProductFamily" }
  - { id: ERR_VINTAGE_NOT_FOUND, http: 404, condition: "vintageId / vintage_id does not resolve to a ProductVintage" }
  - { id: ERR_FAILURE_MODE_NOT_FOUND, http: 404, condition: "failureModeId / failure_mode_id does not resolve to a FailureMode" }
  - { id: ERR_CLAIM_OBSERVATION_NOT_FOUND, http: 404, condition: "observationId does not resolve to a ClaimObservation" }
  - { id: ERR_ACCRUAL_NOT_FOUND, http: 404, condition: "accrualId does not resolve to a WarrantyAccrual" }
  - { id: ERR_ADEQUACY_REVIEW_NOT_FOUND, http: 404, condition: "reviewId does not resolve to an AdequacyReview" }
  - { id: ERR_FIELD_ACTION_NOT_FOUND, http: 404, condition: "fieldActionId / field_action_id does not resolve to a FieldAction" }
  - { id: ERR_REMEDY_OPTION_NOT_FOUND, http: 404, condition: "remedy_option_id does not resolve to a RemedyOption" }
  - { id: ERR_SERVICE_CONTRACT_NOT_FOUND, http: 404, condition: "contractId does not resolve to a ServiceContract" }
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "supplierId / supplier_id does not resolve to a Supplier" }
  - { id: ERR_RECOVERY_NOT_FOUND, http: 404, condition: "recoveryId does not resolve to a SupplierRecovery" }
  - { id: ERR_LIABILITY_RESERVE_NOT_FOUND, http: 404, condition: "reserveId does not resolve to a LiabilityReserve" }
  - { id: ERR_ROLLFORWARD_NOT_FOUND, http: 404, condition: "rollforwardId does not resolve to a ReserveRollforward" }

  # ---- optimistic concurrency ----------------------------------------------
  - { id: ERR_STALE_PERIOD_VERSION, http: 412, condition: "expected_period_version does not equal the current AccrualPeriod.version" }
  - { id: ERR_STALE_FIELD_ACTION_VERSION, http: 412, condition: "expected_field_action_version does not equal the current FieldAction.version" }

  # ---- state ----------------------------------------------------------------
  - { id: ERR_PERIOD_CLOSED, http: 409, condition: "the AccrualPeriod scoping the mutation has status == CLOSED" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "the target row is not in a declared `from:` state for the requested transition, including every terminal-state lockdown" }
  - { id: ERR_UNPOSTED_ACCRUALS_REMAIN, http: 409, condition: "opening actuarial review while a DRAFT or PROPOSED accrual still exists in the period" }
  - { id: ERR_ROLLFORWARD_MISSING, http: 409, condition: "closing a period whose rollforward_generated is false" }
  - { id: ERR_LIABILITY_RESERVE_NOT_BOOKED, http: 409, condition: "closing a period that still has a LiabilityReserve in DRAFT or ACTUARY_REVIEWED" }
  - { id: ERR_EXECUTION_BEFORE_APPROVAL, http: 409, condition: "advancing the execution dimension while approval_state != APPROVED" }

  # ---- safety / compliance -------------------------------------------------
  - { id: ERR_SAFETY_REMEDY_REQUIRED, http: 422, condition: "a SAFETY_RECALL selects or submits a remedy option whose remedy_class != PERMANENT_REPAIR" }
  - { id: ERR_REGULATORY_NOTICE_MISSING, http: 422, condition: "approving a SAFETY_RECALL whose regulatory_notice_filed is false" }

  # ---- referential ---------------------------------------------------------
  - { id: ERR_SELF_ANALOG_REFERENCE, http: 422, condition: "analog_family_id equals the id of the ProductFamily being patched" }
  - { id: ERR_REMEDY_OPTION_MISMATCH, http: 422, condition: "the explicitly supplied remedy option belongs to a different field action" }
  - { id: ERR_NO_FAILURE_MODES_DEFINED, http: 422, condition: "accruing for a vintage whose family has no FailureMode row" }
  - { id: ERR_ANALOG_BASIS_MISSING, http: 422, condition: "method == ANALOG_BLEND while the family lacks analog_family_id or engineering_estimate_rate_ppm" }
  - { id: ERR_FIELD_ACTION_NOT_APPROVED, http: 422, condition: "asserting a recovery whose linked FieldAction has approval_state != APPROVED" }

  # ---- business constraints -----------------------------------------------
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "a code field collides within its declared uniqueness scope" }
  - { id: ERR_INSUFFICIENT_CLAIM_HISTORY, http: 422, condition: "method == HISTORICAL_RATE while the family's history_maturity_status is LIMITED" }
  - { id: ERR_VINTAGE_EXPOSURE_EXPIRED, http: 422, condition: "accruing for a ProductVintage whose exposure_status is EXPIRED" }
  - { id: ERR_DUPLICATE_ACCRUAL, http: 409, condition: "a DRAFT or PROPOSED accrual already exists for the same (period_id, vintage_id)" }
  - { id: ERR_DUPLICATE_LIABILITY_RESERVE, http: 409, condition: "a LiabilityReserve already exists for the same (period_id, family_id)" }
  - { id: ERR_SUPPLIER_IMPAIRED, http: 422, condition: "asserting a recovery against a Supplier whose collectability_rating is IMPAIRED" }
  - { id: ERR_NO_ELIGIBLE_REMEDY_OPTION, http: 422, condition: "the server-side remedy selector's eligibility filter yields an empty candidate set" }
  - { id: ERR_NO_OPEN_PERIOD, http: 422, condition: "the booking-period selector finds no AccrualPeriod with status IN {OPEN, ANALYSIS_LOCKED}" }
  - { id: ERR_NO_EXPECTED_BASE, http: 422, condition: "an adequacy review would divide by an expected_to_date_cents of 0" }

  # ---- temporal -----------------------------------------------------------
  - { id: ERR_OBSERVATION_WINDOW_OVERLAP, http: 409, condition: "a new half-open months-in-service bucket intersects an existing bucket for the same (vintage_id, failure_mode_id)" }
  - { id: ERR_FIELD_ACTION_WINDOW_CONFLICT, http: 409, condition: "a new closed affected-build window falls within 30 calendar days of a non-REJECTED field action window on the same family" }
  - { id: ERR_CONTRACT_PRECEDES_LAUNCH, http: 422, condition: "ServiceContract.sold_date is earlier than the family's launch_date" }

  # ---- fiscal --------------------------------------------------------------
  - { id: ERR_SETTLEMENT_EXCEEDS_ASSERTED, http: 422, condition: "settled_amount_cents exceeds the recovery's asserted_amount_cents" }
  - { id: ERR_RESERVE_CAP_EXCEEDED, http: 422, condition: "posting an accrual would drive warranty_reserve_balance_cents above the family's reserve_cap_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: WarrantyAnalyst
    description: "Warranty engineering-finance analyst: maintains product/claim reference data, estimates accruals, runs adequacy analysis, sells and cancels extended service contracts, and asserts supplier recovery claims."
    identity: opaque
    exclusive_operations:
      - "POST /warranty/product-families"
      - "PATCH /warranty/product-families/{familyId}"
      - "POST /warranty/vintages"
      - "POST /warranty/failure-modes"
      - "POST /warranty/claim-observations"
      - "POST /warranty/accruals"
      - "POST /warranty/accruals/{accrualId}/propose"
      - "POST /warranty/accruals/{accrualId}/revise"
      - "POST /warranty/adequacy-reviews"
      - "POST /warranty/service-contracts"
      - "POST /warranty/service-contracts/{contractId}/cancel"
      - "POST /warranty/suppliers"
      - "POST /warranty/supplier-recoveries"
      - "POST /warranty/supplier-recoveries/{recoveryId}/assert"
    shared_operations:
      - "every GET except GET /warranty/rollforwards* which it shares with ReserveController and Actuary only"

  - name: ReserveController
    description: "Reserve controller in corporate accounting: owns the period calendar, posts accruals, decides field actions, books liability reserves, closes recovery claims, applies true-ups and issues the rollforward disclosure. Cannot author the estimates it approves."
    identity: opaque
    exclusive_operations:
      - "POST /warranty/periods"
      - "POST /warranty/periods/{periodId}/lock-analysis"
      - "POST /warranty/periods/{periodId}/open-actuarial-review"
      - "POST /warranty/periods/{periodId}/reopen-analysis"
      - "POST /warranty/periods/{periodId}/close"
      - "POST /warranty/periods/{periodId}/rollforward"
      - "POST /warranty/accruals/{accrualId}/post"
      - "POST /warranty/adequacy-reviews/{reviewId}/apply-true-up"
      - "POST /warranty/field-actions/{fieldActionId}/decision"
      - "POST /warranty/supplier-recoveries/{recoveryId}/close"
      - "POST /warranty/liability-reserves/{reserveId}/book"
    shared_operations:
      - "every GET endpoint"

  - name: QualityEngineer
    description: "Product quality engineer: opens campaigns, recalls and bulletins, prices remedy options, selects the remedy, submits for approval and drives field execution."
    identity: opaque
    exclusive_operations:
      - "POST /warranty/field-actions"
      - "POST /warranty/field-actions/{fieldActionId}/remedy-options"
      - "POST /warranty/field-actions/{fieldActionId}/select-remedy"
      - "POST /warranty/field-actions/{fieldActionId}/submit"
      - "POST /warranty/field-actions/{fieldActionId}/execution-progress"
    shared_operations:
      - "GET /warranty/periods/{periodId}, GET /warranty/product-families*, GET /warranty/vintages*, GET /warranty/failure-modes*, GET /warranty/claim-observations*, GET /warranty/field-actions*"

  - name: Actuary
    description: "Consulting actuary: creates and reviews product-liability reserves including IBNR, and reads the warranty ledger for context. Cannot book its own review."
    identity: opaque
    exclusive_operations:
      - "POST /warranty/liability-reserves"
      - "POST /warranty/liability-reserves/{reserveId}/actuarial-decision"
    shared_operations:
      - "every GET endpoint"

  - name: SupplierRep
    description: "Portal user acting as one component supplier; may acknowledge a recovery claim asserted against that supplier and read only that supplier's claims."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /warranty/supplier-recoveries/{recoveryId}/respond"
    shared_operations:
      - "GET /warranty/supplier-recoveries/{recoveryId} and GET /warranty/supplier-recoveries, both scoped to X-User-ID == supplier_id"

  - name: PlatformAdmin
    description: "Operations account that controls the server's logical clock; holds no business authority over reserves."
    identity: opaque
    exclusive_operations:
      - "POST /warranty/_clock/set_current_utc"
    shared_operations: []
