  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: held_locally_constraint_outranks_patron_balance_fiscal_gate_on_intake
        grounds:
          - validations[priority=55]
          - validations[priority=80]
          - errors[ERR_HELD_LOCALLY]
          - errors[ERR_PATRON_BALANCE_EXCEEDED]
          - entities.BibItem.fields.local_holding_status
          - entities.Patron.fields.unpaid_balance_cents
          - entities.Patron.fields.unpaid_balance_cap_cents
        distinguishing_aspect: |
          The conflicting pair is business_constraint (priority 55, ERR_HELD_LOCALLY, 422) against
          business_fiscal (priority 80, ERR_PATRON_BALANCE_EXCEEDED, 402) on POST /ill/requests: with
          both conditions true in one payload the response is ERR_HELD_LOCALLY, and the second call
          proves the fiscal rule really was armed by returning ERR_PATRON_BALANCE_EXCEEDED once the
          holdings clause is satisfied.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Patron P-8008 with unpaid_balance_cap_cents 5000 and a migrated UNPAID_CHARGE of 9000 cents, so unpaid_balance_cents 9000 exceeds the cap while provisional_risk_score is only 9 — well under STANDING_BLOCK_THRESHOLD, and Patron.status is still ACTIVE."
            - "BibItem HELD-1 with local_holding_status HELD_AVAILABLE and licensed_access_status NONE."
            - "BibItem NOTHELD-1 with local_holding_status NONE and licensed_access_status NONE, identical in every other respect."
            - "A LOAN rota with one ACTIVE NORTHU entry, so nothing downstream of intake can fail for want of a lender."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-8008", full_name: "Hana Staff", email: "hana@u.edu", patron_type: "STAFF", department: "ARCH", max_open_requests: 5, max_concurrent_loans: 3, unpaid_balance_cap_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/patrons/${patron_id}/infraction-records"
              payload: { kind: "UNPAID_CHARGE", unpaid_amount_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { unpaid_now: $.data.unpaid_balance_cents, prov_now: $.data.provisional_risk_score }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Concrete Design Handbook", item_type: "BOOK", publication_year: 2018, isbn: "978-0-000-00003-5", local_holding_status: "HELD_AVAILABLE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_held_id: $.data.id }
            - call: "POST /ill/bib-items"
              payload: { title: "Timber Design Handbook", item_type: "BOOK", publication_year: 2018, isbn: "978-0-000-00004-2", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_notheld_id: $.data.id }
          trigger:
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_held_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { err_both: $.data.error_id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_notheld_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { err_fiscal: $.data.error_id }
