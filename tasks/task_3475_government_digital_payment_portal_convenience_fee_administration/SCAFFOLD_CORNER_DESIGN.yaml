              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and err_id == ERR_FORBIDDEN_FOR_ROLE"
            - "StatutoryAuthorization.${authz_id}.status remains DRAFT"

      - name: platform_admin_cannot_confirm_deposit
        claim_type: Violation → Error
