              captures: { err: $.data.error_id }
          assert:
            - "the review response error_id == \"ERR_NODE_NOT_DECAYED\""
            - "the review response http status is 409"
            - "LessonNode.${n11}.state == \"BRONZE\""

  - rule_id: resource_temporal_overlap
    instances:
      - name: streak_repair_window_closed_interval
        grounds:
          - calculations.ComputeStreakRepairCost
          - validations[priority=16]
          - state_machines.StreakState.transitions.BROKEN_to_REPAIRED
        distinguishing_aspect: |
          The repair window is a closed interval anchored on the streak's focus_date, so a repair sent
          exactly REPAIR_WINDOW_DAYS after focus_date is still inside the window while one sent an hour
          later collides with the closed boundary and is refused.
        test_recipe:
          setup:
            - "Ada holds a BROKEN streak whose focus_date is 2026-09-01, with 40 gems and no repairs this month"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /_inject/gems"
              payload: { learner_id: "${ada}", gems: 40 }
              as: PlatformAdmin
            - call: "POST /_events/auto-transition"
              payload: { event_type: "STREAK_DAY_CLOSE" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_events/auto-transition"
              payload: { event_type: "STREAK_DAY_CLOSE" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_events/auto-transition"
              payload: { event_type: "STREAK_DAY_CLOSE" }
              as: PlatformAdmin
            - call: "GET /streak-states?learner_id=${ada}"
              payload: { learner_id: "${ada}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { st: $.data.0.id, st_v: $.data.0.version }
          trigger:
            - call: "POST /streak-states/${st}/repair"
              payload: { expected_streak_version: "${st_v}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { repaired_state: $.data.status, st_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_events/auto-transition"
              payload: { event_type: "STREAK_DAY_CLOSE" }
              as: PlatformAdmin
            - call: "POST /streak-states/${st}/repair"
              payload: { expected_streak_version: "${st_v2}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { err: $.data.error_id }
          assert:
            - "the first repair returned status REPAIRED, so the closed window admitted the request within half a day of focus_date"
            - "the second repair error_id == \"ERR_REPAIR_WINDOW_EXPIRED\""
            - "the second repair http status is 422, since the clock stands past focus_date plus REPAIR_WINDOW_DAYS"
            - "Learner.${ada}.gems_balance == 39"
