    instances:

      - name: analyst_slot_conflict_uses_buffered_half_open_intervals
        grounds:
          - validations.priority_20
          - errors.ERR_ANALYST_SLOT_CONFLICT
          - calculations.interview_incentive_amount.constants.DEBRIEF_BUFFER_MINUTES
          - entities.Analyst.fields.committed_minutes
          - entities.Analyst.fields.open_interview_count
        distinguishing_aspect: |
          Resource: the Analyst's calendar. Interval semantics: half-open
          [start, end + DEBRIEF_BUFFER_MINUTES). Interview i1 occupies
          [14:00, 15:15). A request starting at exactly 15:00 overlaps and must be
          rejected even though the raw booked intervals only touch; a request
          starting at exactly 15:15 touches the buffered end and must be accepted.
          Naive raw-interval overlap accepts the 15:00 request; closed-interval
          comparison rejects the 15:15 request.
