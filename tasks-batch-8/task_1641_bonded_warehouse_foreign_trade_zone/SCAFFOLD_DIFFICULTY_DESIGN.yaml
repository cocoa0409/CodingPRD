              captures: { err: "$.data.error_id" }
          assert:
            - "attaching to the FILED entry -> ERR_ENTRY_NOT_OPEN (http 409)"
            - "no second withdrawal is persisted: GET /zones/withdrawals?weekly_entry_id=${e} returns total_count == 1 (only W1)"

      - name: admit_requires_zone_active
        grounds:
          - state_machines.Admission.SUBMITTED_to_ADMITTED
          - state_machines.Zone.ACTIVE_to_SUSPENDED
          - errors[ERR_ZONE_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair (Admission, Zone): the SUBMITTED -> ADMITTED transition is
          gated on the parent zone's status == ACTIVE; suspending the zone
          blocks admission even though the admission itself is in a valid
          from-state. Different pair from the sibling (Withdrawal, WeeklyEntry).
        test_recipe:
          setup:
            - "Zone; admission SUBMITTED; zone then SUSPENDED by the operator"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Gate Zone 2", zone_code: "Z-X2", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/${z}/transition"
              payload: { to_status: "SUSPENDED" }
              as: ZoneOperator
          trigger:
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "admit under a SUSPENDED zone -> ERR_ZONE_NOT_ACTIVE (http 409)"
            - "Admission.${a}.status remains SUBMITTED; no lot created (GET /zones/lots?zone_id=${z} total_count == 0)"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: weekly_entry_half_open_window_overlap
        grounds:
          - validations[priority=8]
          - entities.WeeklyEntry.fields.week_end_date
          - errors[ERR_WEEK_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the zone's weekly-entry calendar:
          [week_start, week_start+7d) — an interior start (08-05 inside
          [08-03, 08-10)) conflicts, but a start exactly equal to the existing
          end (08-10) is legal adjacency. Sibling instance uses CLOSED interval
          semantics on a different resource (AccessBadge).
        test_recipe:
          setup:
            - "Zone; weekly entry E1 created with week_start_date 2026-08-03T00:00:00Z (week_end computed 2026-08-10T00:00:00Z)"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Overlap Zone", zone_code: "Z-OV", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/weekly-entries"
              payload: { zone_id: "${z}", week_start_date: "2026-08-03T00:00:00Z" }
              as: Importer
              as_user_id: "imp-1"
              captures: { e1: "$.data.id" }
          trigger:
            - call: "POST /zones/weekly-entries"
              payload: { zone_id: "${z}", week_start_date: "2026-08-05T00:00:00Z" }
              as: Importer
              as_user_id: "imp-1"
              captures: { err_mid: "$.data.error_id" }
            - call: "POST /zones/weekly-entries"
              payload: { zone_id: "${z}", week_start_date: "2026-08-10T00:00:00Z" }
              as: Importer
              as_user_id: "imp-1"
              captures: { e3: $.data.id, e3_end: "$.data.week_end_date" }
          assert:
            - "week_start 2026-08-05 (inside [08-03, 08-10)) -> ERR_WEEK_WINDOW_OVERLAP (http 409)"
            - "week_start 2026-08-10 == E1.week_end_date is ACCEPTED (201) — half-open semantics permit exact adjacency"
            - "WeeklyEntry.${e3}.week_end_date == 2026-08-17T00:00:00Z (start + 7 days)"
            - "GET /zones/weekly-entries?zone_id=${z} returns total_count == 2"

      - name: badge_closed_interval_window_overlap
        grounds:
          - validations[priority=8]
          - entities.AccessBadge.fields.valid_until
          - errors[ERR_BADGE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          CLOSED interval semantics on AccessBadge (a different resource from
          the sibling WeeklyEntry): validity [valid_from, valid_until] is
          inclusive at both ends, so a new badge whose valid_from TOUCHES the
          existing badge's valid_until (2026-08-31T00:00:00Z) conflicts, while a
          start one day later is legal — opposite adjacency treatment from the
          half-open weekly window.
        test_recipe:
          setup:
            - "Zone; badge B1 for 'Ada Lovelace' valid [2026-08-01T00:00:00Z, 2026-08-31T00:00:00Z]"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Badge Zone", zone_code: "Z-BDG", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/access-badges"
              payload: { zone_id: "${z}", holder_name: "Ada Lovelace", valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-08-31T00:00:00Z" }
              as: ZoneOperator
              captures: { b1: "$.data.id" }
          trigger:
            - call: "POST /zones/access-badges"
              payload: { zone_id: "${z}", holder_name: "Ada Lovelace", valid_from: "2026-08-31T00:00:00Z", valid_until: "2026-09-30T00:00:00Z" }
              as: ZoneOperator
              captures: { err_touch: "$.data.error_id" }
            - call: "POST /zones/access-badges"
              payload: { zone_id: "${z}", holder_name: "Ada Lovelace", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-30T00:00:00Z" }
              as: ZoneOperator
              captures: { b3: "$.data.id" }
          assert:
            - "valid_from 2026-08-31T00:00:00Z touching B1.valid_until -> ERR_BADGE_WINDOW_OVERLAP (http 409) — closed intervals treat the shared instant as a conflict"
            - "valid_from 2026-09-01T00:00:00Z is ACCEPTED (201): Badge.${b3} created with status ACTIVE"
            - "GET /zones/access-badges?zone_id=${z}&holder_name=Ada Lovelace returns total_count == 2"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lot_unit_conservation_on_cancel
        grounds:
          - state_machines.Withdrawal.FILED_to_CANCELLED
          - entities.InventoryLot.fields.admitted_quantity
          - entities.InventoryLot.fields.cumulative_withdrawn
        distinguishing_aspect: |
          Conserved quantity: merchandise UNITS. Forward action (file) paired
          with its compensating action (cancel) restores the pinned invariant
          admitted_quantity == quantity_on_hand + cumulative_withdrawn +
          cumulative_consumed with zero drift. Sibling instance conserves a
          different quantity (weekly-entry dollar totals).
        test_recipe:
          setup:
            - "Zone; lot (HTS 8708.29, qty 10, unit 1221, NPF) ADMITTED"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Units Zone", zone_code: "Z-UNT", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Auto parts", hts_code: "8708.29", quantity: 10, unit_value_cents: 1221, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
          trigger:
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "CONSUMPTION", quantity: 4 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w: "$.data.id" }
            - call: "POST /zones/withdrawals/${w}/file"
              as: Importer
              as_user_id: "imp-1"
            - call: "GET /zones/lots/${lot}"
              as: ZoneOperator
              captures: { onhand_mid: $.data.quantity_on_hand, withdrawn_mid: "$.data.cumulative_withdrawn" }
            - call: "POST /zones/withdrawals/${w}/cancel"
              as: Importer
              as_user_id: "imp-1"
            - call: "GET /zones/lots/${lot}"
              as: ZoneOperator
              captures: { onhand_end: $.data.quantity_on_hand, withdrawn_end: $.data.cumulative_withdrawn, consumed_end: $.data.cumulative_consumed, lot_status: "$.data.status" }
          assert:
            - "after file: quantity_on_hand == 6 and cumulative_withdrawn == 4   (10 == 6 + 4 + 0)"
            - "after cancel: quantity_on_hand == 10, cumulative_withdrawn == 0, cumulative_consumed == 0, status == IN_ZONE  (10 == 10 + 0 + 0 — compensation leaves zero unit drift)"
            - "Withdrawal.${w}.status == CANCELLED and duty_outcome == NONE"

      - name: entry_dollar_totals_conservation_on_cancel
        grounds:
          - calculations.weekly_entry_settlement
          - state_machines.Withdrawal.FILED_to_CANCELLED
          - entities.WeeklyEntry.fields.entered_value_cents
        distinguishing_aspect: |
          Conserved quantity: entry DOLLAR totals (different quantity type from
          the sibling's merchandise units). Filing an attached withdrawal raises
          entered_value_cents/duty_total_cents/MPF fields; cancelling it (entry
          still OPEN) restores every monetary field to exactly 0 — no drift in
          the derived dollar aggregates.
        test_recipe:
          setup:
            - "Zone; lot (HTS 8542.31 rate 0.04, qty 10, unit 4000, NPF); weekly entry E for the default-clock week; withdrawal W (qty 2, CONSUMPTION) attached to E"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Totals Zone", zone_code: "Z-TOT", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Processors", hts_code: "8542.31", quantity: 10, unit_value_cents: 4000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
            - call: "POST /zones/weekly-entries"
              payload: { zone_id: "${z}", week_start_date: "2026-07-27T00:00:00Z" }
              as: Importer
              as_user_id: "imp-1"
              captures: { e: "$.data.id" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "CONSUMPTION", quantity: 2, weekly_entry_id: "${e}" }
              as: Importer
              as_user_id: "imp-1"
              captures: { w: "$.data.id" }
            - call: "POST /zones/withdrawals/${w}/file"
              as: Importer
              as_user_id: "imp-1"
            - call: "GET /zones/weekly-entries/${e}"
              as: ZoneOperator
              captures: { ev_mid: $.data.entered_value_cents, dt_mid: $.data.duty_total_cents, mpf_mid: "$.data.mpf_cents" }
          trigger:
            - call: "POST /zones/withdrawals/${w}/cancel"
              as: Importer
              as_user_id: "imp-1"
            - call: "GET /zones/weekly-entries/${e}"
              as: ZoneOperator
              captures: { ev_end: $.data.entered_value_cents, dt_end: $.data.duty_total_cents, mu_end: $.data.mpf_uncapped_cents, mpf_end: $.data.mpf_cents, psm_end: $.data.per_shipment_mpf_cents, sav_end: "$.data.mpf_savings_cents" }
          assert:
            - "mid-flight: entered_value_cents == 8000 (2 x 4000), duty_total_cents == 320 (round(8000 x 0.04)), mpf_cents == 3000 (uncapped 28 floored to MIN)"
            - "after cancel: entered_value_cents == 0, duty_total_cents == 0, mpf_uncapped_cents == 0, mpf_cents == 0, per_shipment_mpf_cents == 0, mpf_savings_cents == 0 (empty member set pins all monetary fields to 0)"
            - "the file/cancel pair leaves the entry's dollar totals exactly as before the pair — conservation with zero drift"
