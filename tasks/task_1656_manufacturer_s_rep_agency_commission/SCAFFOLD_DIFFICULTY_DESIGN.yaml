          assert:
            - "after reject: status == REJECTED; after resubmit: status == SUBMITTED (REJECTED->SUBMITTED loop traversed)"
            - "after approve: protection_start == 2026-08-01T00:00:00Z and protection_end == 2027-01-28T00:00:00Z (+180d)"
            - "after renew: status stays APPROVED (self-loop), renewals_used == 1, protection_end == 2027-04-28T00:00:00Z (+90d)"

      - name: statement_dispute_resolve_cycle
        grounds:
          - state_machines.CommissionStatement.IN_RECONCILIATION_to_DISPUTED
          - state_machines.CommissionStatement.DISPUTED_to_IN_RECONCILIATION
          - state_machines.CommissionStatement.IN_RECONCILIATION_to_SETTLED
          - calculations.statement_line_matching
          - calculations.draw_recovery_waterfall
