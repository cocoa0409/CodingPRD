              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s2_id}", item_id: "${item_id}", on_hand_units: 30, size_on_hand: [{ size_code: "S", units: 8 }, { size_code: "M", units: 10 }, { size_code: "L", units: 8 }, { size_code: "XL", units: 4 }], min_units: 8, max_units: 24, weekly_forecast_units: 5, trailing_4wk_sales_units: 16 }
