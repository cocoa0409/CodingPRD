        distinguishing_aspect: |
          Depth-3 chain triggered by adjudication: adjudicate -> report
          CONFIRMED_VIOLATION (link 1) -> assignment REJECTED_AFTER_FLAG with
          payment VOID (link 2, caused by link 1's side effect) -> contributor
          SUSPENDED plus expenses DENIED plus rights REVERTED (link 3, caused
          by link 2's side effect). Distinct trigger from the batch-release
          cascade.
