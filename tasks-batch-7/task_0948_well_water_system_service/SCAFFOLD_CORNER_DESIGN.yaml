            - "EmergencyTicket.${tkt_c}.intake_at == 2026-06-01T09:37:00.000Z and EmergencyTicket.${tkt_c}.dispatched_at == 2026-06-01T10:15:00.000Z and EmergencyTicket.${tkt_c}.response_minutes == 38"
            - "EmergencyTicket.${tkt_b}.dispatch_status == DIAGNOSED and EmergencyTicket.${tkt_b}.authorization_status == PRE_AUTHORIZED"
            - "EmergencyTicket.${tkt_c}.dispatch_status == DIAGNOSED and EmergencyTicket.${tkt_c}.authorization_status == PENDING"
