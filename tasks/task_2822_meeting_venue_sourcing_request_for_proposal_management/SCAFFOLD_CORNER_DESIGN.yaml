      - state_machines.VenueShortlistEntry.SHORTLISTED_to_ELIMINATED
      - entities.MeetingEvent.fields.best_total_cost_usd
      distinguishing_aspect: 'shortlisted_venue_count is a filtered aggregate, not a row count: of the four entries on the event it counts only those in SHORTLISTED / INSPECTION_SCHEDULED / INSPECTED / RFP_ISSUED / AWARDED, so the never-promoted CANDIDATE and the eliminated entry are both excluded and the count reads 2 while GET /sourcing/shortlist-entries still returns 4 rows.'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - RateBenchmark (TIER_1, USER_CONFERENCE) at 260.00 ADR.
