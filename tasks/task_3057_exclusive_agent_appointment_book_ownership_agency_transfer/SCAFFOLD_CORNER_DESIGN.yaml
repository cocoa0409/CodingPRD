# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3057_exclusive_agent_appointment_book_ownership_agency_transfer
#
# Breadth probe: every testable claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no recipe.
# =============================================================================
scaffold_corner_design:
- section: entities
  instances:
  - name: agency_create_returns_declared_fields_and_starts_approved
    claim_type: Creation
    grounds:
    - entities.Agency
    - endpoints.POST_/agency-network/agencies
    distinguishing_aspect: A freshly created agency comes back 201 with status APPROVED, version 1 and system-minted id/created_at/updated_at; status is never client-supplied.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Empty database."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-101
          name: Alpha Agency
          region_code: W
          market_need_score: 55
        as: AppointingExecutive
        captures:
          ag_id: $.data.id
      trigger:
      - call: GET /agency-network/agencies/${ag_id}
        payload: {}
        as: AppointingExecutive
      assert:
      - the create response status is 201 and response_type is object
      - Agency.${ag_id}.status == APPROVED and version == 1
      - Agency.${ag_id}.region_code == "W" and market_need_score == 55
  - name: agreement_get_round_trips_commission_schedule
    claim_type: Retrieval
    grounds:
    - entities.Agreement.fields.commission_schedule
    - endpoints.GET_/agency-network/agreements/{id}
    distinguishing_aspect: The nested commission_schedule object round-trips through GET exactly as posted, including the three per-line new/renewal pairs.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE with owner agent Cal and a live agreement."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-102
          name: CA-102
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal RT
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/agreements
        payload:
          agent_id: ${cal_id}
          agency_id: ${cali_id}
          agreement_type: EXCLUSIVE_AGENT
          commission_schedule: "{ AUTO: { new: 0.15, renewal: 0.10 }, HOME: { new: 0.12, renewal: 0.08 }, LIFE: { new: 0.25, renewal: 0.15 } }"
        as: FieldManager
        captures:
          ag_id: $.data.id
      trigger:
      - call: GET /agency-network/agreements/${ag_id}
        payload: {}
        as: FieldManager
      assert:
      - the response status is 200
      - "Agreement.${ag_id}.commission_schedule.AUTO == { new: 0.15, renewal: 0.10 }"
      - Agreement.${ag_id}.commission_schedule.HOME.new == 0.12 and LIFE.new == 0.25
      - Agreement.${ag_id}.status == UNDER_REVIEW
  - name: agents_list_paginates_total_count_and_has_more
    claim_type: Listing
    grounds:
    - endpoints.GET_/agency-network/agents
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: With three agents on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Three agents injected."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: A One
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          a1: $.data.id
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: A Two
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: A Three
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
      trigger:
      - call: GET /agency-network/agents
        payload:
          limit: 2
          offset: 0
        as: FieldManager
      assert:
      - the response status is 200 and response_type is array
      - the page returns exactly 2 rows with total_count == 3 and has_more == true
      - GET /agency-network/agents?limit=2&offset=2 returns 1 row with has_more == false
  - name: err_agency_not_found_on_unknown_id
    claim_type: Not Found
    grounds:
    - endpoints.GET_/agency-network/agencies/{id}
    - errors[ERR_AGENCY_NOT_FOUND]
    - validations[priority=3]
    distinguishing_aspect: A syntactically valid but unallocated agency id produces the entity-specific 404 ERR_AGENCY_NOT_FOUND, not a generic 404.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. No agency created."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      trigger:
      - call: GET /agency-network/agencies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
        as: AppointingExecutive
        captures:
          e: $.data.error_id
      assert:
      - the response status is 404
      - response error_id == ERR_AGENCY_NOT_FOUND
  - name: agency_create_missing_required_region_code_rejected
    claim_type: Required Fields
    grounds:
    - entities.Agency.fields.agency_code
    - errors[ERR_UNAUTHENTICATED]
    - endpoints.POST_/agency-network/agencies
    distinguishing_aspect: Omitting the required region_code on agency creation is rejected with a 400 invalid-request error before any row is written.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Empty database."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      trigger:
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-103
          name: No Region
          market_need_score: 55
        as: AppointingExecutive
      assert:
      - the response status is 400 and the request is rejected (missing required region_code)
      - no Agency with agency_code CA-103 is created
  - name: agency_create_ignores_client_supplied_system_fields
    claim_type: System Fields
    grounds:
    - entities.Agency.fields.id
    - entities.Agency.fields.status
    - entities.Agency.fields.version
    distinguishing_aspect: "Server-minted fields are never taken from the client: a payload smuggling id/status/version still yields a server UUID, status APPROVED and version 1."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Empty database."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      trigger:
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-104
          name: Smuggle
          region_code: W
          market_need_score: 55
        as: AppointingExecutive
        captures:
          ag_id: $.data.id
      assert:
      - the created Agency.${ag_id}.status == APPROVED and version == 1
      - Agency.${ag_id}.id != "attacker-supplied-id"
  - name: policy_cancel_from_cancelled_returns_invalid_state
    claim_type: Invalid Transitions
    grounds:
    - state_machines.Policy.OPEN_to_CANCELLED
    - validations[priority=4]
    - errors[ERR_ALREADY_TERMINAL]
    distinguishing_aspect: "CANCELLED is terminal for Policy: a second cancel from CANCELLED is refused with ERR_ALREADY_TERMINAL and no side effect fires."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE; open policy CA-P10 already cancelled once."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-105
          name: CA-105
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal Canc
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P10
          product_line: AUTO
          annual_premium_cents: 200000
          is_new_business: false
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
        captures:
          p: $.data.id
      trigger:
      - call: POST /agency-network/policies/${p}/cancel
        payload: {}
        as: AgencyPrincipal
        as_user_id: ${cali_id}
        captures:
          e: $.data.error_id
      assert:
      - the first cancel succeeded; the second from CANCELLED returns error_id == ERR_ALREADY_TERMINAL
      - Agency.${cali_id}.exposure_inforce_cents is unchanged by the refused cancel
- section: state_machines
  instances:
  - name: staff_appoint_from_terminated_returns_already_terminal
    claim_type: Terminal State Lockdown
    grounds:
    - state_machines.StaffMember.ACTIVE_to_TERMINATED
    - errors[ERR_ALREADY_TERMINAL]
    - validations[priority=4]
    distinguishing_aspect: Once a StaffMember is TERMINATED no transition is possible; re-appointing returns ERR_ALREADY_TERMINAL.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Oak ACTIVE; staffer Otto appointed ACTIVE."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-106
          name: CA-106
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          oak_id: $.data.id
          oak_v0: $.data.version
      - call: POST /agency-network/agencies/${oak_id}/activate
        payload:
          expected_agency_version: ${oak_v0}
        as: AppointingExecutive
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Oak Owner
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          oak_agent: $.data.id
      - call: POST /agency-network/agreements
        payload:
          agent_id: ${oak_agent}
          agency_id: ${oak_id}
          agreement_type: EXCLUSIVE_AGENT
          commission_schedule: "{ AUTO: { new: 0.15, renewal: 0.10 }, HOME: { new: 0.12, renewal: 0.08 }, LIFE: { new: 0.25, renewal: 0.15 } }"
        as: FieldManager
        captures:
          ag: $.data.id
      - call: POST /agency-network/staff
        payload:
          full_name: Otto
          role_title: CSR
          allocation_units: '6'
          sponsoring_agreement_id: ${ag}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
        captures:
          s: $.data.id
      - call: POST /agency-network/staff/${s}/appoint
        payload: {}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
      trigger:
      - call: POST /agency-network/staff/${s}/appoint
        payload: {}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
        captures:
          e: $.data.error_id
      assert:
      - re-appointing an already-ACTIVE then TERMINATED member returns error_id == ERR_ALREADY_TERMINAL
  - name: agreement_transcribe_requires_license_and_transitioning_agent
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.Agreement.UNDER_REVIEW_to_ACTIVE
    - validations[priority=5]
    - errors[ERR_LICENSED_REQUIRED]
    distinguishing_aspect: Transcribing an agreement whose owner agent has no LICENSED license is refused with ERR_LICENSED_REQUIRED and the agreement stays UNDER_REVIEW.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE; new agent Vera APPOINTED but NOT_LICENSED; agreement drafted."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-107
          name: CA-107
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
      - call: POST /agency-network/appointment-applications
        payload:
          state_code: CA
          market_need_score: 55
          candidate_assessment_score: 80
          market_odds_score: 80
          creation_channel: FIELD
        as: FieldManager
        captures:
          app: $.data.id
      - call: POST /agency-network/appointment-applications/${app}/assess
        payload: {}
        as: FieldManager
      - call: POST /agency-network/appointment-applications/${app}/approve
        payload: {}
        as: AppointingExecutive
      - call: POST /agency-network/appointment-applications/${app}/appoint
        payload: {}
        as: FieldManager
        captures:
          vera: $.data.id
          vera_v0: $.data.version
      - call: POST /agency-network/agreements
        payload:
          agent_id: ${vera}
          agency_id: ${cali_id}
          agreement_type: EXCLUSIVE_AGENT
          commission_schedule: "{ AUTO: { new: 0.15, renewal: 0.10 }, HOME: { new: 0.12, renewal: 0.08 }, LIFE: { new: 0.25, renewal: 0.15 } }"
        as: FieldManager
        captures:
          ag: $.data.id
      trigger:
      - call: POST /agency-network/agreements/${ag}/transcribe
        payload:
          expected_agent_version: ${vera_v0}
        as: FieldManager
        captures:
          e: $.data.error_id
      assert:
      - the transcribe is refused with error_id == ERR_LICENSED_REQUIRED (the agent is NOT_LICENSED)
      - after POST /agents/${vera}/read-license the same transcribe succeeds and Agreement.${ag}.status == ACTIVE
  - name: agency_activate_twice_returns_invalid_state
    claim_type: Invalid Transitions
    grounds:
    - state_machines.Agency.APPROVED_to_ACTIVE
    - validations[priority=4]
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Agency.APPROVED_to_ACTIVE is only valid once; re-activating an ACTIVE agency returns ERR_INVALID_STATE.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali already ACTIVE."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-108
          name: CA-108
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
        captures:
          cali_v1: $.data.version
      trigger:
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v1}
        as: AppointingExecutive
        captures:
          e: $.data.error_id
      assert:
      - the second activation returns error_id == ERR_INVALID_STATE
      - Agency.${cali_id}.term_start_date is not re-stamped by the refused call
  - name: claim_settle_cascade_covered_by_difficulty
    claim_type: Side Effect Execution
    grounds:
    - state_machines.Claim.OPEN_to_PAID
    - calculations.loss_ratio
    excluded_because:
      difficulty_instance: claim_settle_cascade_loss_ratio_performance
      rationale: The depth-4 claim→policy→agency→loss_ratio→performance_status cascade is asserted end-to-end by that §1.8 instance.
- section: calculations
  instances:
  - name: appointment_priority_weighted_literal_90
    claim_type: Correct Result
    grounds:
    - calculations.appointment_priority
    - constants.W_ODDS
    distinguishing_aspect: With all three inputs at 90 the weighted score is exactly 90 (0.4*90+0.3*90+0.3*90), pinning round_half_up on the final sum.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. App with odds 70, assessment 95, need 85."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/appointment-applications
        payload:
          state_code: CA
          market_need_score: 85
          candidate_assessment_score: 95
          market_odds_score: 70
          creation_channel: DIGITAL
        as: FieldManager
        captures:
          app: $.data.id
      trigger:
      - call: POST /agency-network/appointment-applications/${app}/assess
        payload: {}
        as: FieldManager
      assert:
      - AppointmentApplication.${app}.appointment_priority == 84 (0.4*70 + 0.3*95 + 0.3*85 == 82.0, round_half_up)
      - AppointmentApplication.${app}.required_action == PROCEED
  - name: marketing_allowance_carryover_leading_variant
    claim_type: Variant Divergence
    grounds:
    - calculations.marketing_allowance_utilization
    - entities.Agreement.fields.allowance_carryover_cents
    distinguishing_aspect: The carryover-leading variant adds the prior carryover before the pool is capped, so exposure 3,000,000 with carryover 25,000 yields a pool of 145,000.00 versus 120,000.00 exposure-only.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE with 3,000,000 cents OPEN exposure and a prior 25,000.00 carryover."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-109
          name: CA-109
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal Carry
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P11
          product_line: HOME
          annual_premium_cents: 3000000
          is_new_business: false
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
      trigger:
      - call: GET /agency-network/agencies/${cali_id}
        payload: {}
        as: AgencyPrincipal
        as_user_id: ${cali_id}
      assert:
      - the pool base is min(3000000*0.04, 250000.00) == 120000.00
      - with a prior 25,000.00 carryover the pool is 145000.00, never the exposure-only 120000.00
      - the carryover-leading variant alone produces 145000.00
  - name: loss_ratio_paid_basis_variant_selection
    claim_type: Variant Selection
    grounds:
    - calculations.loss_ratio
    - calculations.agency_paid_claims_cents
    - entities.Agency.fields.loss_ratio
    distinguishing_aspect: "The paid_basis variant is selected: a DENIED claim contributes 0.00, so loss_ratio stays 0.00 whereas the reserve_basis variant would count the 40,000.00 reserve."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE with a 500,000-cent OPEN policy and a 40,000-cent claim to deny."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-110
          name: CA-110
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal Liab
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P12
          product_line: AUTO
          annual_premium_cents: 500000
          is_new_business: false
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
        captures:
          p: $.data.id
      - call: POST /agency-network/claims
        payload:
          policy_id: ${p}
          claim_amount_cents: 40000
        as: ClaimsAdjuster
        captures:
          cl: $.data.id
      trigger:
      - call: POST /agency-network/claims/${cl}/deny
        payload: {}
        as: ClaimsAdjuster
      - call: GET /agency-network/agencies/${cali_id}
        payload: {}
        as: AppointingExecutive
      assert:
      - after deny Claim.${cl}.policy_paid_cents == 0.00
      - Agency.${cali_id}.loss_ratio == 0.00 (paid basis), never the reserve-basis reading
  - name: refusal_schedule_missing_line_on_agreement
    claim_type: Precondition Enforcement
    grounds:
    - errors[ERR_SCHEDULE_MISSING]
    - validations[priority=6]
    - entities.Agreement.fields.commission_schedule
    distinguishing_aspect: An agreement whose schedule omits LIFE is refused with ERR_SCHEDULE_MISSING because the scaffold requires a {new, renewal} pair for AUTO, HOME and LIFE.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE; owner agent Cal ACTIVE."
      setup_api_calls:
