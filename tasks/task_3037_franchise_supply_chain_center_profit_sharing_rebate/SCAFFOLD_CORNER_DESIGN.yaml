              as: SupplyChainAdmin
              captures: { store_a1: $.data.id }
            - call: "POST /supply-centers/${center_id}/stores/${store_a1}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-A2", operator_name: "A2", credit_limit_cents: 100000 }
              as: SupplyChainAdmin
              captures: { store_a2: $.data.id }
            - call: "POST /supply-centers/${center_id}/stores/${store_a2}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
