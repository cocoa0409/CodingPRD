            - "PurchaseTransaction.${t3_id}.accrual_status == \"ACCRUED\""
            - "Member.${m3_id}.available_points == 226"
            - "Member.${m3_id}.lifetime_points == 226"
            - "GET /point-ledger-entries?member_id=${m3_id}&entry_type=ACCRUAL returns meta total_count == 1, data[0].points_delta == 226 and data[0].lot_expires_at == \"2026-09-30T23:59:59.999Z\""

      - name: settlement_admin_fee_is_taken_from_the_pre_fee_reimbursement
        grounds:
          - calculations.settlement_batch_reimbursement
          - state_machines.SettlementBatch.DRAFT_to_SUBMITTED
          - entities.SettlementBatch.fields.pre_fee_reimbursement_cents
          - concurrency_rules[settlement-batch-create-stale-site]
        distinguishing_aspect: |
          Mode (c): the admin fee looks circular because it is a percentage of a
          reimbursement that is itself net of the fee, so the scaffold pins the
          order — fee = 1.5% of the PRE-FEE 12750 = 191, giving 12559. Taking
          1.5% of gross_discount_cents instead yields 225 and a reimbursement of
          12525, and taking it from the final value is undefined; both are
          falsified by this test.
        test_recipe:
          setup:
            - "Banner B_SET on defaults; cycles 2026-08 and 2026-09 exist; clock at 2026-08-05T10:00:00Z."
