  # --- Training ---
  - method: POST
    path: "/group-training-sessions"
    description: "Schedule a formation training session (moves group FORMING -> TRAINING; requires member_count == 5; manager slot overlap with 30-min buffer enforced)"
    roles: [CenterManager]
    code: 201
    input: [peer_group_id, center_manager_id, start_time, end_time]
    output: GroupTrainingSession
    side_effects: ["first session: group FORMING -> TRAINING"]

  - method: GET
