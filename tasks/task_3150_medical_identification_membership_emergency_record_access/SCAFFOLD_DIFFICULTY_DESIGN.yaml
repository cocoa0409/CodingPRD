# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3150_medical_identification_membership_emergency_record_access
#
# Depth probe: every §0.5 Difficulty Rule the scaffold claims, with ≥2
# instances per rule, each grounded in §1.1–§1.7 of SCAFFOLD.yaml and carrying
# a fully structured test_recipe executable from empty-DB.
#
# The single setup anchor used throughout (pinned by the clock default):
#   empty-DB → POST /medical-id/_clock/set_current_utc (2026-09-01T00:00:00Z)
# Enrollment dates in fixtures are always relative to that anchor.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (order pricing on ProductOrder vs disclosure scope on
  # AccessEvent).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: lifetime_free_first_sync_order_provisional_free_final_paid_when_second_confirms
        grounds:
          - calculations.order_pricing
          - entities.Member.fields.first_lifetime_sync_order_consumed
          - entities.ProductOrder.fields.price_cents
          - state_machines.ProductOrder.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Dual-variant on the ProductOrder/pricing domain: two PENDING
          SYNC_WITH_RECORD orders for the same LIFETIME member both carry the
          provisional price 0 (free-first-order rule), but confirming one sets
          Member.first_lifetime_sync_order_consumed, so the second order's
          FINAL price re-prices to base - 25% = 9000 while the first stays 0 —
          same product input, two variants, different numbers.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. LIFETIME member L enrolled. Catalog product P at 12000 cents with max_engrave_chars 40. Member L has one VERIFIED record item ('Diabetes', CRITICAL) so SYNC engraving is non-empty. Two PENDING SYNC_WITH_RECORD orders O1, O2 on P, both provisionally priced 0."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/products"
              payload: { product_sku: "BR-STL", product_name: "Stainless Bracelet", base_price_cents: 12000, max_engrave_chars: 40 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Lou Lifetime", email: "lou@x.com", membership_tier: "LIFETIME", date_of_birth: "1980-01-01" }
              as: PlatformAdmin
              captures: { m_id: $.data.id, m_v0: $.data.version }
            - call: "POST /medical-id/members/${m_id}/record-items"
              payload: { item_kind: "CONDITION", label: "Diabetes", detail: "Type 1", severity: "CRITICAL", provider_document_ref: "doc-1" }
              as: Member
              as_user_id: "${m_id}"
              captures: { item_id: $.data.id }
            - call: "GET /medical-id/members/${m_id}/record-items/${item_id}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { ticket_id: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${ticket_id}/resolve"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "POST /medical-id/members/${m_id}/orders"
              payload: { product_id: "${prod_id}", engraving_text: "ignored", engrave_mode: "SYNC_WITH_RECORD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /medical-id/members/${m_id}/orders"
              payload: { product_id: "${prod_id}", engraving_text: "ignored", engrave_mode: "SYNC_WITH_RECORD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o2_id: $.data.id }
            - call: "GET /medical-id/members/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_v1: $.data.version }
          trigger:
            - call: "POST /medical-id/members/${m_id}/orders/${o1_id}/confirm"
              payload: { expected_member_version: "${m_v1}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /medical-id/members/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_v2: $.data.version }
            - call: "POST /medical-id/members/${m_id}/orders/${o2_id}/confirm"
              payload: { expected_member_version: "${m_v2}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "ProductOrder.${o1_id}.price_cents == 0 (final, free first SYNC order for LIFETIME)"
            - "ProductOrder.${o2_id}.price_cents == 9000 (final = 12000 - 25%% = 9000; the provisional 0 is NOT carried into confirm)"
            - "Member.${m_id}.first_lifetime_sync_order_consumed == true"
            - "Member.${m_id}.balance_cents == 50000 + 0 + 9000 == 59000 (LIFETIME enrollment fee + both confirmed orders)"

      - name: disclosure_scope_standard_vs_cognitive_escalated_same_credential
        grounds:
          - calculations.disclosure_scope
          - entities.AccessEvent.fields.disclosed_scope
          - entities.AccessEvent.fields.is_escalated
          - entities.Member.fields.has_cognitive_condition
        distinguishing_aspect: |
          Dual-variant on the AccessEvent/disclosure domain (different entity
          domain from order pricing): the SAME BASIC-tier responder credential
          looking up two members gets disclosed_scope == {CONDITIONS,
          MEDICATIONS, ALLERGIES} for the non-cognitive member but {CONDITIONS,
          MEDICATIONS, ALLERGIES, CONTACTS} plus EMERGENCY_ONLY directives for
          the cognitive member, with is_escalated flipping false -> true —
          identical request shape, two variants, different scope.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member A (no cognitive condition) and member B (with a VERIFIED COGNITIVE condition) both ACTIVE. Both have one emergency contact and one STORED directive with release_scope == EMERGENCY_ONLY. Responder R with BASIC tier, expires_on 2027-01-01."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Ann Plain", email: "ann@x.com", membership_tier: "STANDARD", date_of_birth: "1990-06-15" }
              as: PlatformAdmin
              captures: { ma_id: $.data.id, ma_code: $.data.identifier_code }
            - call: "POST /medical-id/members"
              payload: { full_name: "Bob Cog", email: "bob@x.com", membership_tier: "STANDARD", date_of_birth: "1955-03-02" }
              as: PlatformAdmin
              captures: { mb_id: $.data.id, mb_code: $.data.identifier_code }
            - call: "POST /medical-id/members/${mb_id}/record-items"
              payload: { item_kind: "CONDITION", condition_kind: "COGNITIVE", label: "Dementia", detail: "Alzheimer's", severity: "HIGH", provider_document_ref: "doc-b1" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { mb_item: $.data.id }
            - call: "GET /medical-id/members/${mb_id}/record-items/${mb_item}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { mb_ticket: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${mb_ticket}/resolve"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "POST /medical-id/members/${ma_id}/contacts"
              payload: { contact_name: "Ann Sister", phone: "+15550001111", priority_rank: 1 }
              as: Member
              as_user_id: "${ma_id}"
            - call: "POST /medical-id/members/${mb_id}/contacts"
              payload: { contact_name: "Bob Son", phone: "+15550002222", priority_rank: 1 }
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /medical-id/members/${ma_id}/directives"
              payload: { directive_type: "DNR", document_ref: "dnr-a", release_scope: "EMERGENCY_ONLY" }
              as: Member
              as_user_id: "${ma_id}"
              captures: { ma_dir: $.data.id }
            - call: "POST /medical-id/members/${mb_id}/directives"
              payload: { directive_type: "DNR", document_ref: "dnr-b", release_scope: "EMERGENCY_ONLY" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { mb_dir: $.data.id }
            - call: "POST /medical-id/responders"
              payload: { agency_name: "Metro EMS", credential_code: "EMS-B-001", access_tier: "BASIC", expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { resp_id: $.data.id }
          trigger:
            - call: "POST /medical-id/access-events"
              payload: { credential_code: "EMS-B-001", identifier_code: "${ma_code}", lookup_method: "IDENTIFIER" }
              as: Responder
              as_user_id: "${resp_id}"
              captures: { ev_a: $.data.id }
            - call: "POST /medical-id/access-events"
              payload: { credential_code: "EMS-B-001", identifier_code: "${mb_code}", lookup_method: "IDENTIFIER" }
              as: Responder
              as_user_id: "${resp_id}"
              captures: { ev_b: $.data.id }
          assert:
            - "AccessEvent.${ev_a}.disclosed_scope == [\"CONDITIONS\", \"MEDICATIONS\", \"ALLERGIES\"] (BASIC base scope, no CONTACTS, no DIRECTIVES)"
            - "AccessEvent.${ev_a}.is_escalated == false"
            - "AccessEvent.${ev_b}.disclosed_scope contains CONDITIONS, MEDICATIONS, ALLERGIES, CONTACTS and DIRECTIVES (cognitive escalation)"
            - "AccessEvent.${ev_b}.is_escalated == true"
            - "AdvanceDirective.${ma_dir}.status == STORED (not released: EMERGENCY_ONLY excluded for non-cognitive member)"
            - "AdvanceDirective.${mb_dir}.status == RELEASED (EMERGENCY_ONLY released under cognitive escalation)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: membership_fee_dependent_cognitive_premium_branch_order
        grounds:
          - calculations.membership_fee
          - entities.GuardianLink
          - entities.Member.fields.has_cognitive_condition
        distinguishing_aspect: |
          Mode (a): a formula with >=3 inputs and non-linear interaction —
          renewal fee branches on tier (PREMIUM base 7500), on an ACTIVE
          GuardianLink (dependent factor 0.5 applied to base only), and on
          has_cognitive_condition (flat +1000 added AFTER the factor), pinned
          evaluation order: round_half_up(7500 * 0.5) + 1000 == 4750. An
          implementation that surcharges before the factor computes 4250;
          one that factors the surcharge computes the same wrong 4250 — only
          the pinned order yields 4750.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Adult guardian G (STANDARD, ACTIVE). Dependent D: PREMIUM tier, MINOR, enrolled by admin, with a VERIFIED COGNITIVE condition (has_cognitive_condition true), and an ACTIVE GuardianLink from G to D. D lapses to SUSPENDED via the clock, then renews with wallet 0 and amount_paid 4750."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Gail Guardian", email: "gail@x.com", membership_tier: "STANDARD", date_of_birth: "1975-04-10" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Dan Dependent", email: "dan@x.com", membership_tier: "PREMIUM", date_of_birth: "2015-08-20" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /medical-id/members/${d_id}/guardian-links"
              payload: { guardian_member_id: "${g_id}", relation_label: "mother" }
              as: PlatformAdmin
              captures: { link_id: $.data.id }
            - call: "POST /medical-id/members/${d_id}/record-items"
              payload: { item_kind: "CONDITION", condition_kind: "COGNITIVE", label: "Autism", detail: "non-verbal", severity: "HIGH", provider_document_ref: "doc-d1" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { d_item: $.data.id }
            - call: "GET /medical-id/members/${d_id}/record-items/${d_item}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { d_ticket: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${d_ticket}/resolve"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2028-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /medical-id/members/${d_id}/renew"
              payload: { amount_paid_cents: 4750 }
              as: Guardian
              as_user_id: "${g_id}"
          assert:
            - "Member.${d_id}.status == ACTIVE (SUSPENDED -> ACTIVE on renewal)"
            - "the renewal fee charged == 4750 == round_half_up(7500 * 0.5) + 1000 (dependent factor applied to PREMIUM base only, cognitive surcharge added after)"
            - "Member.${d_id}.wallet_credit_cents == 0 (wallet applied first; payment covers the remainder)"
            - "Member.${d_id}.expires_on == 2030-09-02 (renewal date + 24 PREMIUM term months)"
            - "a new PENDING RENEWAL reminder exists with due_on == 2030-08-03 (expires_on - 30 days)"

      - name: engraving_sync_rounding_tail_truncation_severity_then_created_at
        grounds:
          - calculations.engraving_sync
          - entities.ProductOrder.fields.engraving_text
          - entities.ProductOrder.fields.synced_revision
        distinguishing_aspect: |
          Mode (b): truncation/rounding where ORDER matters — the engraving
          line list is ranked by severity (CRITICAL > HIGH > MEDIUM > LOW)
          with created_at ASC tie-break, then tail-truncated to fit
          max_engrave_chars; a different line ordering drops different labels
          from the engraving. Distinct mode from instance 1's branching
          formula (mode a).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member S with three VERIFIED items created in order: 'LowA' (LOW), 'HighB' (HIGH), 'CritC' (CRITICAL). Product P with max_engrave_chars == 18 — enough for 'CritC | HighB' (13 chars) but not 'CritC | HighB | LowA' (20 chars). SYNC_WITH_RECORD order O placed on P."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/products"
              payload: { product_sku: "TAG-S", product_name: "Small Tag", base_price_cents: 3000, max_engrave_chars: 18 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Sam Sync", email: "sam@x.com", membership_tier: "STANDARD", date_of_birth: "1988-12-01" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /medical-id/members/${m_id}/record-items"
              payload: { item_kind: "ALLERGY", label: "LowA", detail: "mild", severity: "LOW", provider_document_ref: "d1" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it1: $.data.id }
            - call: "POST /medical-id/members/${m_id}/record-items"
              payload: { item_kind: "CONDITION", label: "HighB", detail: "serious", severity: "HIGH", provider_document_ref: "d2" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it2: $.data.id }
            - call: "POST /medical-id/members/${m_id}/record-items"
              payload: { item_kind: "MEDICATION", label: "CritC", detail: "critical med", severity: "CRITICAL", provider_document_ref: "d3" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it3: $.data.id }
            - call: "GET /medical-id/members/${m_id}/record-items/${it1}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { t1: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${t1}/resolve"
              payload: { decision: "APPROVE", decision_note: "ok" }
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "GET /medical-id/members/${m_id}/record-items/${it2}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { t2: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${t2}/resolve"
              payload: { decision: "APPROVE", decision_note: "ok" }
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "GET /medical-id/members/${m_id}/record-items/${it3}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { t3: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${t3}/resolve"
              payload: { decision: "APPROVE", decision_note: "ok" }
              as: RecordVerifier
              as_user_id: "rv-1"
          trigger:
            - call: "POST /medical-id/members/${m_id}/orders"
              payload: { product_id: "${prod_id}", engraving_text: "client text ignored", engrave_mode: "SYNC_WITH_RECORD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
          assert:
            - "ProductOrder.${o_id}.engraving_text == \"CritC | HighB\" (severity rank first regardless of creation order; LOW line tail-truncated to fit 18 chars)"
            - "ProductOrder.${o_id}.synced_revision == Member.${m_id}.record_revision"
            - "ProductOrder.${o_id}.engraving_text does NOT contain \"LowA\" — truncation drops the lowest-severity line, not the latest-created"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine: two non-linear machines on DIFFERENT
  # entities.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: record_item_reject_resubmit_cycle_increments_submission_round
        grounds:
          - state_machines.MedicalRecordItem.REJECTED_to_PENDING_VERIFICATION
          - entities.VerificationTicket.fields.submission_round
          - endpoints.POST_/medical-id/members/{memberId}/record-items/{itemId}/submit-for-verification
        distinguishing_aspect: |
          Cycle on MedicalRecordItem (PENDING_VERIFICATION -> REJECTED ->
          PENDING_VERIFICATION -> VERIFIED): the same item loops through
          verification twice; each resubmission opens a NEW VerificationTicket
          whose submission_round increments 1 -> 2 while the old REJECTED
          ticket stays terminal.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE STANDARD member M with one record item whose round-1 ticket was REJECTED (item status REJECTED)."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Rita Round", email: "rita@x.com", membership_tier: "STANDARD", date_of_birth: "1992-02-02" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /medical-id/members/${m_id}/record-items"
              payload: { item_kind: "ALLERGY", label: "Peanuts", detail: "anaphylaxis", severity: "CRITICAL", provider_document_ref: "doc-r1" }
              as: Member
              as_user_id: "${m_id}"
              captures: { item_id: $.data.id }
            - call: "GET /medical-id/members/${m_id}/record-items/${item_id}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { t1: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${t1}/resolve"
              payload: { decision: "REJECT", decision_note: "illegible scan" }
              as: RecordVerifier
              as_user_id: "rv-1"
          trigger:
            - call: "POST /medical-id/members/${m_id}/record-items/${item_id}/submit-for-verification"
              payload: { provider_document_ref: "doc-r2-better-scan" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /medical-id/members/${m_id}/record-items/${item_id}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { t2_round: "$.data[1].submission_round" }
          assert:
            - "MedicalRecordItem.${item_id}.status == PENDING_VERIFICATION (cycle returned to the initial state)"
            - "VerificationTicket.${t1}.status == REJECTED (old ticket terminal, unchanged)"
            - "the second ticket's submission_round == 2 and status == OPEN"
            - "GET .../tickets returns exactly 2 tickets for the item, ordered round 1 then round 2"

      - name: dispute_review_loop_return_to_queue_before_corrected_resolution
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_OPEN
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_CORRECTED
        distinguishing_aspect: |
          Cycle on Dispute (different entity from MedicalRecordItem): OPEN ->
          UNDER_REVIEW -> OPEN -> UNDER_REVIEW -> RESOLVED_CORRECTED — the
          return-to-queue loop runs before terminal resolution, and the
          CORRECTED resolution cascades a full record-item supersede.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE STANDARD member M with one VERIFIED record item and an OPEN dispute against it."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Drew Dispute", email: "drew@x.com", membership_tier: "STANDARD", date_of_birth: "1985-07-07" }
              as: PlatformAdmin
              captures: { m_id: $.data.id, m_rev0: $.data.record_revision }
            - call: "POST /medical-id/members/${m_id}/record-items"
              payload: { item_kind: "MEDICATION", label: "Warfarin 5mg", detail: "daily", severity: "HIGH", provider_document_ref: "doc-w1" }
              as: Member
              as_user_id: "${m_id}"
              captures: { item_id: $.data.id }
            - call: "GET /medical-id/members/${m_id}/record-items/${item_id}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { t1: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${t1}/resolve"
              payload: { decision: "APPROVE", decision_note: "ok" }
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "POST /medical-id/members/${m_id}/disputes"
              payload: { record_item_id: "${item_id}", claim_text: "dose is 2mg not 5mg" }
              as: Member
              as_user_id: "${m_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /medical-id/disputes/${disp_id}/claim-for-review"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "POST /medical-id/disputes/${disp_id}/return-to-queue"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "POST /medical-id/disputes/${disp_id}/claim-for-review"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "POST /medical-id/disputes/${disp_id}/resolve"
              payload: { resolution: "CORRECTED", resolution_note: "provider confirms 2mg" }
              as: RecordVerifier
              as_user_id: "rv-1"
          assert:
            - "Dispute.${disp_id}.status == RESOLVED_CORRECTED after traversing OPEN -> UNDER_REVIEW -> OPEN -> UNDER_REVIEW"
            - "MedicalRecordItem.${item_id}.status == SUPERSEDED"
            - "a new MedicalRecordItem exists for member ${m_id} in PENDING_VERIFICATION with a new OPEN VerificationTicket (round 1)"
            - "Member.${m_id}.record_revision has advanced beyond its value at dispute open"

  # ===========================================================================
  # Rule 4 — transitive_cascade: two cascades, depth >=3 and depth >=2,
  # from DIFFERENT triggering transitions.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: verify_cognitive_item_cascades_to_flag_eligibility_and_escalated_access
        grounds:
          - state_machines.MedicalRecordItem.PENDING_VERIFICATION_to_VERIFIED
          - entities.Member.fields.has_cognitive_condition
          - calculations.disclosure_scope
          - state_machines.AdvanceDirective.STORED_to_RELEASED
        distinguishing_aspect: |
          Depth-3 chain triggered by ticket resolve: verify a COGNITIVE item
          (hop 1) recomputes Member.has_cognitive_condition (hop 2), which
          changes the eligibility predicate for wandering cases AND the
          disclosure_scope escalation on the next access event (hop 3), which
          in turn flips an EMERGENCY_ONLY AdvanceDirective STORED -> RELEASED
          (hop 4). Each hop is caused by the previous link, not by the
          resolve call directly.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE member M with one PENDING_VERIFICATION COGNITIVE item, one emergency contact, one STORED EMERGENCY_ONLY directive, and BASIC responder R. Before verification, has_cognitive_condition == false."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Cara Cascade", email: "cara@x.com", membership_tier: "STANDARD", date_of_birth: "1960-01-30" }
              as: PlatformAdmin
              captures: { m_id: $.data.id, m_code: $.data.identifier_code }
            - call: "POST /medical-id/members/${m_id}/record-items"
              payload: { item_kind: "CONDITION", condition_kind: "COGNITIVE", label: "Dementia", detail: "wanders", severity: "HIGH", provider_document_ref: "doc-c1" }
              as: Member
              as_user_id: "${m_id}"
              captures: { item_id: $.data.id }
            - call: "POST /medical-id/members/${m_id}/contacts"
              payload: { contact_name: "Cara Daughter", phone: "+15550003333", priority_rank: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /medical-id/members/${m_id}/directives"
              payload: { directive_type: "HEALTHCARE_PROXY", document_ref: "proxy-c", release_scope: "EMERGENCY_ONLY" }
              as: Member
              as_user_id: "${m_id}"
              captures: { dir_id: $.data.id }
            - call: "POST /medical-id/responders"
              payload: { agency_name: "County EMS", credential_code: "EMS-B-777", access_tier: "BASIC", expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { resp_id: $.data.id }
            - call: "GET /medical-id/members/${m_id}/record-items/${item_id}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { t1: "$.data[0].id" }
            - call: "POST /medical-id/members/${m_id}/wandering-cases"
              payload: { opened_via: "SELF_REPORT" }
              as: HotlineOperator
              as_user_id: "op-1"
              captures: { deny_err: $.data.error_id }
          trigger:
            - call: "POST /medical-id/verification-tickets/${t1}/resolve"
              payload: { decision: "APPROVE", decision_note: "provider letter received" }
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "POST /medical-id/access-events"
              payload: { credential_code: "EMS-B-777", identifier_code: "${m_code}", lookup_method: "IDENTIFIER" }
              as: Responder
              as_user_id: "${resp_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /medical-id/members/${m_id}/wandering-cases"
              payload: { opened_via: "HOTLINE_ESCALATION" }
              as: HotlineOperator
              as_user_id: "op-1"
              captures: { case_id: $.data.id }
          assert:
            - "the pre-verification wandering-case attempt was denied with error_id == ERR_WANDERING_NOT_ELIGIBLE (has_cognitive_condition was false)"
            - "Member.${m_id}.has_cognitive_condition == true after the verify (hop 1 -> hop 2)"
            - "AccessEvent.${ev_id}.is_escalated == true and disclosed_scope includes CONTACTS and DIRECTIVES (hop 2 -> hop 3)"
            - "AdvanceDirective.${dir_id}.status == RELEASED (hop 3 -> hop 4)"
            - "WanderingCase.${case_id}.status == OPEN (eligibility now satisfied)"

      - name: member_cancel_cascades_to_orders_disputes_links
        grounds:
          - state_machines.Member.ACTIVE_to_CANCELLED
          - state_machines.ProductOrder.PENDING_to_CANCELLED
          - state_machines.Dispute.OPEN_to_DISMISSED
          - entities.GuardianLink.fields.status
        distinguishing_aspect: |
          Depth-2+ fan-in chain from a DIFFERENT trigger (member cancel, not
          record verify): cancel (hop 1) cancels PENDING orders, dismisses
          OPEN disputes, and revokes GuardianLinks (hop 2); the dispute
          dismissal in turn prevents any further review-round transitions on
          it (hop 2 consequence: terminal lockdown), and the refunded order
          money lands in wallet_credit_cents only for CONFIRMED orders.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Adult guardian G and dependent D (MINOR, ACTIVE GuardianLink G->D). D has: one PENDING order, one CONFIRMED order (price 3000, balance debited), one OPEN dispute, two PENDING reminders."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/products"
              payload: { product_sku: "BR-K", product_name: "Kids Band", base_price_cents: 3000, max_engrave_chars: 30 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Gus Guard", email: "gus@x.com", membership_tier: "STANDARD", date_of_birth: "1970-05-05" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Dee Minor", email: "dee@x.com", membership_tier: "STANDARD", date_of_birth: "2016-01-15" }
              as: PlatformAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /medical-id/members/${d_id}/guardian-links"
              payload: { guardian_member_id: "${g_id}", relation_label: "father" }
              as: PlatformAdmin
              captures: { link_id: $.data.id }
            - call: "POST /medical-id/members/${d_id}/record-items"
              payload: { item_kind: "ALLERGY", label: "Bee stings", detail: "epi-pen", severity: "CRITICAL", provider_document_ref: "doc-bee" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { d_item: $.data.id }
            - call: "POST /medical-id/members/${d_id}/disputes"
              payload: { record_item_id: "${d_item}", claim_text: "severity overstated" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { d_disp: $.data.id }
            - call: "POST /medical-id/members/${d_id}/orders"
              payload: { product_id: "${prod_id}", engraving_text: "Dee - bee allergy", engrave_mode: "MANUAL" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { o_pending: $.data.id }
            - call: "POST /medical-id/members/${d_id}/orders"
              payload: { product_id: "${prod_id}", engraving_text: "Dee backup band", engrave_mode: "MANUAL" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { o_confirm: $.data.id }
            - call: "GET /medical-id/members/${d_id}"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
              captures: { d_v1: $.data.version }
            - call: "POST /medical-id/members/${d_id}/orders/${o_confirm}/confirm"
              payload: { expected_member_version: "${d_v1}" }
              as: Guardian
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /medical-id/members/${d_id}/cancel"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
          assert:
            - "Member.${d_id}.status == CANCELLED"
            - "ProductOrder.${o_pending}.status == CANCELLED with no wallet refund (never debited)"
            - "ProductOrder.${o_confirm}.status == CANCELLED"
            - "Member.${d_id}.wallet_credit_cents == 3000 (confirmed order refunded to wallet; balance zeroed by the cancel cascade)"
            - "Dispute.${d_disp}.status == DISMISSED and POST /medical-id/disputes/${d_disp}/claim-for-review now fails with ERR_INVALID_STATE (terminal lockdown)"
            - "GuardianLink.${link_id}.status == REVOKED (both endpoints of the link are touched: dependent cancelled)"
            - "every PENDING reminder for ${d_id} has status == CANCELLED"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict: two dual-failure conflicts on
  # DIFFERENT error-category pairs.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_member_inactive_trumps_safety_responder_auth_on_access
        grounds:
          - validations.priority_8_business_safety
          - validations.priority_9_business_safety
          - errors.ERR_RESPONDER_AUTH_FAILED
          - errors.ERR_MEMBER_NOT_DISCLOSABLE
        distinguishing_aspect: |
          Pair business_safety (priority 8, responder credential) vs
          business_safety (priority 9, member disclosability): an access event
          with an EXPIRED responder credential AND a CANCELLED member must
          fail with ERR_RESPONDER_AUTH_FAILED (priority 8 wins within the
          same category by declared order) — never ERR_MEMBER_NOT_DISCLOSABLE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M enrolled then CANCELLED (identifier known). Responder R with expires_on 2026-08-01 (expired relative to the logical clock)."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Pat Prio", email: "pat@x.com", membership_tier: "STANDARD", date_of_birth: "1979-09-09" }
              as: PlatformAdmin
              captures: { m_id: $.data.id, m_code: $.data.identifier_code }
            - call: "POST /medical-id/responders"
              payload: { agency_name: "Old EMS", credential_code: "EMS-OLD-1", access_tier: "FULL", expires_on: "2026-08-01" }
              as: PlatformAdmin
              captures: { resp_id: $.data.id }
            - call: "POST /medical-id/members/${m_id}/cancel"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /medical-id/access-events"
              payload: { credential_code: "EMS-OLD-1", identifier_code: "${m_code}", lookup_method: "IDENTIFIER" }
              as: Responder
              as_user_id: "${resp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 with error_id == ERR_RESPONDER_AUTH_FAILED — priority 8 (credential auth) beats priority 9 (member disclosable)"
            - "no AccessEvent with outcome == GRANTED exists for member ${m_id}; the DENIED event's reason_code == ERR_RESPONDER_AUTH_FAILED"

      - name: state_transition_wrong_state_trumps_fiscal_occ_on_order_confirm
        grounds:
          - validations.priority_6_state
          - validations.priority_16_business_fiscal
          - errors.ERR_INVALID_STATE
          - errors.ERR_STALE_VERSION
          - concurrency_rules[order-confirm-stale-member]
        distinguishing_aspect: |
          Pair state (priority 6) vs business_fiscal (priority 16, OCC):
          confirming an order that is already CONFIRMED while ALSO sending a
          stale expected_member_version must fail with ERR_INVALID_STATE —
          the state precondition is evaluated before the OCC version check, a
          different category pair from instance 1's safety-vs-safety.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE STANDARD member M with a CONFIRMED order O (confirmed when member version was v1; member version has since advanced to v1+1 via the confirm itself)."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/products"
              payload: { product_sku: "BR-M", product_name: "Mid Band", base_price_cents: 5000, max_engrave_chars: 40 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Sue State", email: "sue@x.com", membership_tier: "STANDARD", date_of_birth: "1995-11-11" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /medical-id/members/${m_id}/orders"
              payload: { product_id: "${prod_id}", engraving_text: "Sue band", engrave_mode: "MANUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
            - call: "GET /medical-id/members/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_v: $.data.version }
            - call: "POST /medical-id/members/${m_id}/orders/${o_id}/confirm"
              payload: { expected_member_version: "${m_v}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /medical-id/members/${m_id}/orders/${o_id}/confirm"
              payload: { expected_member_version: "${m_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_INVALID_STATE (order already CONFIRMED — state priority 6 evaluated before OCC priority 16)"
            - "error_id is NOT ERR_STALE_VERSION even though expected_member_version is also stale"
            - "ProductOrder.${o_id}.status remains CONFIRMED and Member.${m_id}.balance_cents is unchanged by the rejected call"

  # ===========================================================================
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT metrics,
  # reachable through DIFFERENT endpoints.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: reminder_dispatch_due_on_equal_today_is_sent_inclusive
        grounds:
          - calculations.reminder_schedule
          - state_machines.Reminder.PENDING_to_SENT
          - endpoints.POST_/medical-id/_reminders/dispatch
        distinguishing_aspect: |
          Inclusive date boundary on the reminder dispatch metric: a reminder
          whose due_on == current logical date IS sent (due_on <= today), one
          due tomorrow is NOT — the >= vs > distinction flips the outcome on
          the exact-boundary reminder through the dispatch endpoint.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member M enrolled on 2026-09-01 (expires_on 2027-09-01; RENEWAL reminder due_on 2027-08-02). Clock advanced to exactly 2027-08-02."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Bea Boundary", email: "bea@x.com", membership_tier: "STANDARD", date_of_birth: "1991-03-03" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/_reminders/dispatch"
              payload: {}
              as: PlatformAdmin
              captures: { early_sent: $.data.sent_count }
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2027-08-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /medical-id/_reminders/dispatch"
              payload: {}
              as: PlatformAdmin
              captures: { sent_count: $.data.sent_count }
          assert:
            - "the 2027-08-01 dispatch sent 0 RENEWAL reminders (due_on 2027-08-02 > today: not yet due)"
            - "the 2027-08-02 dispatch sends exactly the RENEWAL reminder (due_on == today is INCLUSIVE) and its status becomes SENT with sent_on == 2027-08-02"

      - name: access_rate_soft_cap_flags_at_eleventh_grant_not_tenth
        grounds:
          - calculations.access_audit_rate
          - endpoints.POST_/medical-id/access-events
        distinguishing_aspect: |
