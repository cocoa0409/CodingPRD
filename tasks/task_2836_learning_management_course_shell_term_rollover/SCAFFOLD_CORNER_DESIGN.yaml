              captures: { a_state: $.data.provisioning_state, a_active: $.data.active_enrollment_count, a_util: $.data.seat_utilization_pct, a_of: $.data.overflow_flag }
            - call: "GET /course-shells/${shell_b}"
              payload: {}
              as: LmsAdmin
              captures: { b_state: $.data.provisioning_state, b_active: $.data.active_enrollment_count, b_util: $.data.seat_utilization_pct }
            - call: "GET /enrollments/${e1}"
              payload: {}
              as: Registrar
              captures: { e1_state: $.data.enrollment_state }
            - call: "GET /enrollments/${e4}"
              payload: {}
              as: Registrar
              captures: { e4_state: $.data.enrollment_state }
            - call: "GET /course-shells"
              payload: { term_id: "${term_id}", provisioning_state: "CONCLUDED" }
              as: LmsAdmin
              captures: { first_shell: "$.data[0].id", second_shell: "$.data[1].id" }
          assert:
            - "${head_before} == 4 and ${pub_before} == 1 before the close"
            - "${term_state} == CLOSED, ${head_after} == 0 (decremented by exactly the 4 rows completed) and ${pub_after} == 0"
            - "${a_state} == ${b_state} == CONCLUDED — hop 1 catches PUBLISHED and PROVISIONED shells alike"
            - "${a_active} == 0 with ${a_util} == 0.00 and ${a_of} == false; ${b_active} == 0 with ${b_util} == 0.00 — hop 3 zeroed both shells' derived seat fields"
            - "${e1_state} == ${e4_state} == COMPLETED — hop 2 reached the enrollments of BOTH shells, including the one that was never published"
            - "the CONCLUDED list returns 2 rows with ${first_shell} == ${shell_a} and ${second_shell} == ${shell_b} — hop 1 processes shells in created_at ASC order"

      - name: the_term_close_cascade_skips_terminal_shells_and_non_active_enrollment_rows
        claim_type: conditional_cascade
        grounds:
          - state_machines.AcademicTerm.lifecycle_state.GRADING_to_CLOSED
          - state_machines.CourseShell.provisioning_state.REQUESTED_to_REJECTED
        distinguishing_aspect: "The cascade is state-filtered on both hops: hop 1 only touches shells IN {PROVISIONED, PUBLISHED}, so a REJECTED shell stays REJECTED; hop 2 only touches enrollments with state ACTIVE, so a DROPPED row and a WAITLISTED row survive the close untouched. An implementation that closes 'all shells' or completes 'all enrollments' fails on the two survivors."
        test_recipe:
          setup:
            - "Term 2026FA. Shell A is PUBLISHED with base_seat_cap 3 and holds one ACTIVE row, one DROPPED row and one WAITLISTED row. Shell R was rejected at provisioning."
            - "The drop happens BEFORE the waitlisted row is created, so the drop's promotion cascade finds an empty queue and the WAITLISTED row is still waiting at close time."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-6011", full_name: "Leslie Lamport", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS900-01", shell_type: "OFFICIAL", base_seat_cap: 3 }
              as: LmsAdmin
              captures: { shell_a: $.data.id }
            - call: "POST /course-shells/${shell_a}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /course-shells/${shell_a}/publish"
              payload: {}
              as: LmsAdmin
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS900-99", shell_type: "OFFICIAL", base_seat_cap: 3 }
              as: LmsAdmin
              captures: { shell_r: $.data.id }
            - call: "POST /course-shells/${shell_r}/provisioning-decisions"
              payload: { decision: "REJECT", reason: "duplicate section" }
              as: LmsAdmin
              captures: { r_state0: $.data.provisioning_state }
            - call: "POST /people"
              payload: { sis_person_id: "S-6014", full_name: "Learner N", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { p1: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6015", full_name: "Learner O", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { p2: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6016", full_name: "Learner P", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { p3: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_a}", person_id: "${p1}", role: "STUDENT" }
              as: Registrar
              captures: { e_active: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_a}", person_id: "${p2}", role: "STUDENT" }
              as: Registrar
              captures: { e_drop: $.data.id }
            - call: "POST /enrollments/${e_drop}/transitions"
              payload: { action: "DROP", reason: "schedule conflict" }
              as: Registrar
              captures: { drop_state0: $.data.enrollment_state }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_a}", person_id: "${p3}", role: "STUDENT", requested_state: "WAITLISTED" }
              as: Registrar
              captures: { e_wait: $.data.id, wait_state0: $.data.enrollment_state, wait_pos0: $.data.waitlist_position }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "FINALS" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "GRADING" }
              as: Registrar
              captures: { head_before: $.data.total_active_enrollments }
          trigger:
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "CLOSED" }
              as: Registrar
              captures: { term_state: $.data.lifecycle_state, head_after: $.data.total_active_enrollments }
            - call: "GET /course-shells/${shell_r}"
              payload: {}
              as: LmsAdmin
              captures: { r_state1: $.data.provisioning_state, r_reason: $.data.reject_reason }
            - call: "GET /course-shells/${shell_a}"
              payload: {}
              as: LmsAdmin
              captures: { a_state: $.data.provisioning_state, a_wl: $.data.waitlisted_enrollment_count }
            - call: "GET /enrollments/${e_active}"
              payload: {}
              as: Registrar
              captures: { active_after: $.data.enrollment_state }
            - call: "GET /enrollments/${e_drop}"
              payload: {}
              as: Registrar
              captures: { drop_after: $.data.enrollment_state, dropped_at: $.data.dropped_at }
            - call: "GET /enrollments/${e_wait}"
              payload: {}
              as: Registrar
              captures: { wait_after: $.data.enrollment_state, wait_pos1: $.data.waitlist_position }
          assert:
            - "${r_state0} == REJECTED, ${drop_state0} == DROPPED, ${wait_state0} == WAITLISTED with ${wait_pos0} == 1, and ${head_before} == 1 (only the surviving ACTIVE row)"
            - "${term_state} == CLOSED and ${head_after} == 0 — decremented by 1, the count of rows hop 2 actually completed"
            - "${r_state1} == REJECTED with ${r_reason} == \"duplicate section\" — a terminal shell is not swept into CONCLUDED"
            - "${a_state} == CONCLUDED and ${a_wl} == 1 — the waitlist count is NOT zeroed by the close; only active_enrollment_count is"
            - "${active_after} == COMPLETED — the one ACTIVE row was completed"
            - "${drop_after} == DROPPED with ${dropped_at} == \"2026-08-01T00:00:00Z\" — untouched, not force-completed"
            - "${wait_after} == WAITLISTED with ${wait_pos1} == 1 — a waitlisted student is neither promoted nor completed by the close"

      - name: dispute_resolution_bubbles_up_to_the_passback_and_the_terms_amendment_count
        claim_type: bubble_up
        grounds:
          - state_machines.GradeDispute.dispute_state
          - calculations.passback_points_ledger
        excluded_because:
          difficulty_instance: upheld_grade_dispute_releases_the_escrow_with_a_zero_drift_two_hundred_fifty_point_ledger
          rationale: "That §1.8 compensating_invariant instance already drives an OPEN dispute to UPHELD and asserts the bubble-up chain end to end: the dispute's resolution releases the escrowed points, the parent GradePassback's disputed_held_points returns to 0 with accepted_points restored, and the AcademicTerm's open_amendment_count falls back to 0 so the term can close. Re-testing the bubble-up here would duplicate that ledger walk with no new distinguishing aspect."

      - name: suspending_a_tool_integration_adjusts_placements_shells_and_the_term
        claim_type: cross_entity
        grounds:
          - state_machines.ToolIntegration.approval_state.APPROVED_to_SUSPENDED
          - state_machines.ToolPlacement.placement_state.ACTIVE_to_BLOCKED
        excluded_because:
          difficulty_instance: tool_suspension_cascades_four_hops_from_placement_to_term_published_count
          rationale: "That §1.8 transitive_cascade instance suspends an APPROVED tool and verifies every downstream entity it touches — placements move ACTIVE -> BLOCKED, each affected CourseShell's blocked_placement_count rises and publish_readiness flips false, and the AcademicTerm's published_shell_count drops. It is the same cross-entity claim at greater depth."

      - name: merge_apply_keeps_the_terms_headcount_reconciled_with_its_shells
        claim_type: ledger_sync
        grounds:
          - state_machines.MergeRequest.merge_state.APPROVED_to_APPLIED
          - calculations.enrollment_seat_ledger
        excluded_because:
          difficulty_instance: merge_apply_and_reverse_conserve_the_terms_active_student_headcount_at_thirteen
          rationale: "That §1.8 compensating_invariant instance asserts the ledger identity term.total_active_enrollments == SUM(shell.active_enrollment_count) before the merge, after APPLY and after REVERSE, holding at 13 throughout. The ancestor-field reconciliation claim is fully covered there."

      - name: reversing_a_failed_rollover_undoes_every_side_effect_without_drift
        claim_type: compensation
        grounds:
          - state_machines.RolloverJob.job_state.FAILED_to_COMPENSATED
          - state_machines.MergeRequest.merge_state.APPLIED_to_REVERSED
        excluded_because:
          difficulty_instance: rollover_compensation_returns_the_source_target_pair_to_five_hundred_seventy_stored_megabytes
          rationale: "That §1.8 compensating_invariant instance drives a RolloverJob to FAILED and then COMPENSATED, asserting that every copied ContentItem is zeroed to copy_state SKIPPED with storage_mb 0.00, that the target shell's storage returns to its pre-copy value, that the source is untouched and that the copied_* tallies survive as audit residue. No compensation behaviour is left untested."

      - name: cross_entity_guards_block_transitions_when_the_other_entity_is_in_the_wrong_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.GradePassback.passback_state.STAGED_to_SUBMITTED
          - state_machines.ToolPlacement.placement_state.REQUESTED_to_ACTIVE
        excluded_because:
          difficulty_instance: grade_passback_submit_depends_on_the_academic_terms_continuity_posture
          rationale: "Both §1.8 cross_entity_state_dependency instances are exactly this claim: grade_passback_submit_depends_on_the_academic_terms_continuity_posture proves SUBMIT is gated on a sibling AcademicTerm dimension (ERR_TERM_POSTURE_FROZEN, then success once the posture leaves CONTINUITY_MODE), and tool_placement_activation_depends_on_the_tool_integrations_approval_and_version proves ACTIVATE is gated on the parent ToolIntegration's approval_state and approved_version (ERR_TOOL_NOT_APPROVED then ERR_TOOL_VERSION_DRIFT then success)."

  # ===========================================================================
  # 3. Calculations  (9 rules; algorithms projection, aggregation,
  #    tiered_pricing, constraint_propagation, weighted_scoring, threshold)
  # ===========================================================================
  - section: calculations
    instances:

      - name: retention_schedule_computes_access_end_and_purge_horizon_for_all_three_classes
        claim_type: correct_result
        grounds:
          - calculations.retention_purge_schedule
          - entities.AcademicTerm.fields.student_access_end_at
          - entities.AcademicTerm.fields.retention_purge_at
          - endpoints[PATCH /academic-terms/{id}]
        distinguishing_aspect: "Four exact instants from one term. The EXTENDED horizon is the discriminator: 1825 days from 2027-01-10 spans the leap day 2028-02-29, so it lands on 2032-01-09, not 2032-01-10. An implementation that adds 5 calendar years instead of 1825 days produces the 10th and fails."
        test_recipe:
          setup:
            - "One term with term_end_at 2026-12-11T00:00:00Z, access_grace_days 30 and retention_class STANDARD; the retention class and grace are then re-patched three times."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", access_grace_days: 30, retention_class: "STANDARD" }
              as: Registrar
              captures: { term_id: $.data.id, access_end: $.data.student_access_end_at, purge_std: $.data.retention_purge_at, v0: $.data.version }
          trigger:
            - call: "PATCH /academic-terms/${term_id}"
              payload: { retention_class: "EXTENDED" }
              as: Registrar
              captures: { access_end2: $.data.student_access_end_at, purge_ext: $.data.retention_purge_at, v1: $.data.version }
            - call: "PATCH /academic-terms/${term_id}"
              payload: { retention_class: "LEGAL_HOLD" }
              as: Registrar
              captures: { access_end3: $.data.student_access_end_at, purge_hold: $.data.retention_purge_at, v2: $.data.version }
            - call: "PATCH /academic-terms/${term_id}"
              payload: { retention_class: "STANDARD", access_grace_days: 0 }
              as: Registrar
              captures: { access_end4: $.data.student_access_end_at, purge_std2: $.data.retention_purge_at, v3: $.data.version }
          assert:
            - "${access_end} == \"2027-01-10T23:59:59Z\" — 2026-12-11 + 30 days, snapped to 23:59:59 (ACCESS_END_TIME_OF_DAY), never 00:00:00"
            - "${purge_std} == \"2028-01-10T23:59:59Z\" — RETENTION_DAYS_STANDARD 365 added to student_access_end_at (2028 is a leap year but 2028-02-29 is not spanned)"
            - "${purge_ext} == \"2032-01-09T23:59:59Z\" — RETENTION_DAYS_EXTENDED 1825 days spans 2028-02-29, so the day-of-month slips to the 9th"
            - "${access_end2} == ${access_end3} == \"2027-01-10T23:59:59Z\" — step 1 is independent of retention_class"
            - "${purge_hold} is null — LEGAL_HOLD has no horizon at all, which is what makes PURGE unreachable"
            - "${access_end4} == \"2026-12-11T23:59:59Z\" and ${purge_std2} == \"2027-12-11T23:59:59Z\" — access_grace_days 0 collapses onto the term_end_at calendar day"
            - "${v0} == 1, ${v1} == 2, ${v2} == 3, ${v3} == 4 — each recompute is a versioned write"

      - name: grade_percentage_rounds_half_up_at_the_third_decimal_and_never_truncates
        claim_type: precision
        grounds:
          - calculations.final_grade_percentage
          - endpoints[POST /_grade-records]
          - entities.Enrollment.fields.provisional_grade_pct
        distinguishing_aspect: "Two grade records one hundredth of a point apart straddle the rounding decision: 71.24 / 800 = 8.90500 rounds half-up to 8.91 while 71.23 / 800 = 8.90375 rounds to 8.90. Truncation gives 8.90 for both, so the pair pins the rounding MODE rather than merely the decimal width. A third row pins a repeating decimal (33.3333... -> 33.33)."
        test_recipe:
          setup:
            - "Term 2026FA in PLANNING; one PROVISIONED OFFICIAL shell with an 800.00-point ASSIGNMENT and a 300.00-point QUIZ; three ACTIVE STUDENT enrollments."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-6020", full_name: "Grace Hopper", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "MA110-01", shell_type: "OFFICIAL", base_seat_cap: 5 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "ASSIGNMENT", title: "Term Project", points_possible: 800.00, storage_mb: 0.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_big: $.data.id }
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "QUIZ", title: "Midterm", points_possible: 300.00, storage_mb: 0.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_mid: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6020", full_name: "Learner Q", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { pa: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6021", full_name: "Learner R", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { pb: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6022", full_name: "Learner S", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { pc: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${pa}", role: "STUDENT" }
              as: Registrar
              captures: { ea: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${pb}", role: "STUDENT" }
              as: Registrar
              captures: { eb: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${pc}", role: "STUDENT" }
              as: Registrar
              captures: { ec: $.data.id }
          trigger:
            - call: "POST /_grade-records"
              payload: { enrollment_id: "${ea}", content_item_id: "${item_big}", earned_points: 71.24 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { pct_up: $.data.provisional_grade_pct, gpp_a: $.data.graded_points_possible, earned_a: $.data.earned_points_total }
            - call: "POST /_grade-records"
              payload: { enrollment_id: "${eb}", content_item_id: "${item_big}", earned_points: 71.23 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { pct_down: $.data.provisional_grade_pct, gpp_b: $.data.graded_points_possible }
            - call: "POST /_grade-records"
              payload: { enrollment_id: "${ec}", content_item_id: "${item_mid}", earned_points: 100.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { pct_rep: $.data.provisional_grade_pct, gpp_c: $.data.graded_points_possible }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { total_pts: $.data.total_points_possible }
          assert:
            - "${earned_a} == 71.24 and ${gpp_a} == 800.00 — graded_points_possible counts only the ONE graded item, not the shell's 1100.00"
            - "${pct_up} == 8.91  # 71.24 / 800.00 * 100 = 8.90500 -> round_half_up 8.91; truncation would give 8.90"
            - "${pct_down} == 8.90  # 71.23 / 800.00 * 100 = 8.90375 -> 8.90; the pair pins the rounding mode, not the width"
            - "${gpp_b} == 800.00 and ${gpp_c} == 300.00 — each enrollment's denominator is its own graded set"
            - "${pct_rep} == 33.33  # 100.00 / 300.00 * 100 = 33.3333... -> 33.33"
            - "${total_pts} == 1100.00 — the shell-wide denominator that the FINAL variant would use instead"

      - name: regrading_an_item_re_sums_the_gradebook_instead_of_double_counting_it
        claim_type: aggregation
        grounds:
          - calculations.final_grade_percentage
          - endpoints[POST /_grade-records]
          - entities.Enrollment.fields.earned_points_total
          - entities.Enrollment.fields.graded_points_possible
        distinguishing_aspect: "The running totals must be a SUM OVER grade records, not an accumulator: overwriting the record for item I1 from 80.00 to 90.00 must move earned_points_total 130.00 -> 140.00 and leave graded_points_possible at 200.00. An accumulating implementation reports 220.00 earned and 300.00 possible."
        test_recipe:
          setup:
            - "Term 2026FA in PLANNING; one PROVISIONED OFFICIAL shell with two 100.00-point items; one ACTIVE STUDENT enrollment."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-6023", full_name: "Jean Sammet", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "MA120-01", shell_type: "OFFICIAL", base_seat_cap: 5 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "ASSIGNMENT", title: "Lab 1", points_possible: 100.00, storage_mb: 0.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { i1: $.data.id }
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "ASSIGNMENT", title: "Lab 2", points_possible: 100.00, storage_mb: 0.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { i2: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6023", full_name: "Learner T", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { stud_id: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${stud_id}", role: "STUDENT" }
              as: Registrar
              captures: { enr_id: $.data.id, enr_v0: $.data.version }
          trigger:
            - call: "POST /_grade-records"
              payload: { enrollment_id: "${enr_id}", content_item_id: "${i1}", earned_points: 80.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { earned1: $.data.earned_points_total, gpp1: $.data.graded_points_possible, pct1: $.data.provisional_grade_pct }
            - call: "POST /_grade-records"
              payload: { enrollment_id: "${enr_id}", content_item_id: "${i2}", earned_points: 50.00 }
              as: Instructor
              as_user_id: "${prof_id}"
