# =============================================================================
# §1.9 Scaffold Corner Design — Utility Rate Case & Cost-of-Service Filing
# Breadth index: every testable claim of §1.1–§1.7 not already covered by
# §1.8. Sections and claim_type values follow references/claim-extraction-guide.md.
# Instances already exercised as the failure path of a §1.8 instance are
# emitted as excluded_because stubs. All chains replay from empty-DB.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities (Table 1)
  # ===========================================================================
  - section: entities
    instances:
      - name: rate_case_creation_defaults_and_envelope
        claim_type: creation
        grounds: [entities.RateCase, "endpoints[POST /api/v1/rate-cases]"]
        distinguishing_aspect: "A valid create returns 201 with the fixed success envelope (meta.api_request_id, meta.api_request_timestamp, response_type=object) and system defaults: status DRAFT, overdue_data_request_count 0, assented_proposal_count 0, version 1, created_at == the logical clock default 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["Empty database; logical clock untouched (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id, st: $.data.status, odc: $.data.overdue_data_request_count, apc: $.data.assented_proposal_count, v: $.data.version, ca: $.data.created_at } }
          assert:
            - "HTTP 201; envelope has meta.api_request_id and meta.api_request_timestamp; response_type == object"
            - "${st} == DRAFT; ${odc} == 0; ${apc} == 0; ${v} == 1"
            - "${ca} == 2026-08-01T00:00:00Z (logical clock default, not wall clock)"
            - "RateCase.${rc}.discovery_close_at is null and authorized_revenue_requirement_cents is null"

      - name: missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=0]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field case_number (no default in §1.1) is a request-shape failure: ERR_INVALID_REQUEST with HTTP 400, before any auth/role evaluation content matters."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/v1/rate-cases", payload: { utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: get_nonexistent_case_child_resources_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_RATE_CASE_NOT_FOUND]", "errors[ERR_ADJUSTMENT_NOT_FOUND]", "errors[ERR_FILING_NOT_FOUND]"]
        distinguishing_aspect: "Existence checks on single-resource GETs return the resource-specific 404 code; three representatives of the thirteen-code family."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/v1/rate-cases/11111111-1111-4111-8111-111111111111", payload: {}, as: UtilityFiler, captures: { err1: $.data.error_id } }
            - { call: "GET /api/v1/adjustments/22222222-2222-4222-8222-222222222222", payload: {}, as: UtilityFiler, captures: { err2: $.data.error_id } }
            - { call: "GET /api/v1/compliance-filings/33333333-3333-4333-8333-333333333333", payload: {}, as: UtilityFiler, captures: { err3: $.data.error_id } }
          assert:
            - "${err1} == ERR_RATE_CASE_NOT_FOUND (404)"
            - "${err2} == ERR_ADJUSTMENT_NOT_FOUND (404)"
            - "${err3} == ERR_FILING_NOT_FOUND (404)"

      - name: get_nonexistent_remaining_resources_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_INTERVENOR_NOT_FOUND]", "errors[ERR_ENTRY_NOT_FOUND]", "errors[ERR_ITEM_NOT_FOUND]", "errors[ERR_CLASS_NOT_FOUND]", "errors[ERR_DATA_REQUEST_NOT_FOUND]", "errors[ERR_PROPOSAL_NOT_FOUND]", "errors[ERR_SIGNATORY_NOT_FOUND]", "errors[ERR_ASSET_NOT_FOUND]", "errors[ERR_AMORT_ENTRY_NOT_FOUND]"]
        distinguishing_aspect: "The remaining nine resource-specific 404 codes each fire on a bogus UUID GET; every entity type has its own code rather than a generic 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/v1/intervenors/11111111-1111-4111-8111-111111111111", payload: {}, as: UtilityFiler, captures: { e1: $.data.error_id } }
            - { call: "GET /api/v1/test-year-entries/22222222-2222-4222-8222-222222222222", payload: {}, as: UtilityFiler, captures: { e2: $.data.error_id } }
            - { call: "GET /api/v1/rate-base-items/33333333-3333-4333-8333-333333333333", payload: {}, as: UtilityFiler, captures: { e3: $.data.error_id } }
            - { call: "GET /api/v1/customer-classes/44444444-4444-4444-8444-444444444444", payload: {}, as: UtilityFiler, captures: { e4: $.data.error_id } }
            - { call: "GET /api/v1/data-requests/55555555-5555-4555-8555-555555555555", payload: {}, as: UtilityFiler, captures: { e5: $.data.error_id } }
            - { call: "GET /api/v1/settlement-proposals/66666666-6666-4666-8666-666666666666", payload: {}, as: UtilityFiler, captures: { e6: $.data.error_id } }
            - { call: "GET /api/v1/settlement-signatories/77777777-7777-4777-8777-777777777777", payload: {}, as: UtilityFiler, captures: { e7: $.data.error_id } }
            - { call: "GET /api/v1/regulatory-assets/88888888-8888-4888-8888-888888888888", payload: {}, as: UtilityFiler, captures: { e8: $.data.error_id } }
            - { call: "GET /api/v1/amortization-entries/99999999-9999-4999-8999-999999999999", payload: {}, as: UtilityFiler, captures: { e9: $.data.error_id } }
          assert:
            - "${e1} == ERR_INTERVENOR_NOT_FOUND"
            - "${e2} == ERR_ENTRY_NOT_FOUND"
            - "${e3} == ERR_ITEM_NOT_FOUND"
            - "${e4} == ERR_CLASS_NOT_FOUND"
            - "${e5} == ERR_DATA_REQUEST_NOT_FOUND"
            - "${e6} == ERR_PROPOSAL_NOT_FOUND"
            - "${e7} == ERR_SIGNATORY_NOT_FOUND"
            - "${e8} == ERR_ASSET_NOT_FOUND"
            - "${e9} == ERR_AMORT_ENTRY_NOT_FOUND"

      - name: computed_and_system_fields_on_create
        claim_type: computed_fields
        grounds: [entities.RateBaseItem.fields.net_rate_base_cents, entities.TestYearEntry.fields.adjusted_amount_cents, entities.TestYearEntry.fields.status]
        distinguishing_aspect: "Computed fields are derived server-side at creation and visible in the 201 response: net_rate_base_cents = 3,000,000,000 - 500,000,000 + 100,000,000 - 200,000,000 = 2,400,000,000; adjusted_amount_cents mirrors booked at creation; status fields start at DRAFT; version starts at 1."
        test_recipe:
          setup: ["Case DRAFT (canonical numbers)"]
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
          trigger:
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Generation plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { net: $.data.net_rate_base_cents, st1: $.data.status, v1: $.data.version } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { adj: $.data.adjusted_amount_cents, st2: $.data.status, ca: $.data.created_at } }
          assert:
            - "${net} == 2400000000; ${st1} == DRAFT; ${v1} == 1"
            - "${adj} == 1000000000 (== booked, no adjustments yet); ${st2} == DRAFT"
            - "${ca} == 2026-08-01T00:00:00Z (system-stamped from the logical clock)"

      - name: pagination_limit_offset_has_more
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /api/v1/intervenors]"]
        distinguishing_aspect: "Pagination envelope fields total_count and has_more respond to limit/offset: with 3 intervenors, limit=2 yields 2 rows + has_more true; offset=2 yields 1 row + has_more false; default limit is 10."
        test_recipe:
          setup: ["Case DRAFT with three intervenors (AAA, BBB, CCC) registered"]
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/intervenors", payload: { rate_case_id: "${rc}", party_name: "AAA Industrial Group", representative_name: "Rae Torres", contact_email: "rae@aaa.example" }, as: IntervenorRep, captures: { i1: $.data.id } }
            - { call: "POST /api/v1/intervenors", payload: { rate_case_id: "${rc}", party_name: "BBB Consumer Advocates", representative_name: "Sam Cho", contact_email: "sam@bbb.example" }, as: IntervenorRep, captures: { i2: $.data.id } }
            - { call: "POST /api/v1/intervenors", payload: { rate_case_id: "${rc}", party_name: "CCC Farmers Cooperative", representative_name: "Lee Park", contact_email: "lee@ccc.example" }, as: IntervenorRep, captures: { i3: $.data.id } }
          trigger:
            - { call: "GET /api/v1/intervenors", payload: { rate_case_id: "${rc}", limit: 2, offset: 0 }, as: UtilityFiler }
            - { call: "GET /api/v1/intervenors", payload: { rate_case_id: "${rc}", limit: 2, offset: 2 }, as: UtilityFiler }
          assert:
            - "Page 1: exactly 2 rows; total_count == 3; has_more == true"
            - "Page 2: exactly 1 row; total_count == 3; has_more == false"
            - "Row order across pages follows the pinned creation order (AAA, BBB, CCC)"

      - name: fk_reverse_reachability_filtered_lists
        claim_type: parent_relationships
        grounds: ["endpoints[GET /api/v1/adjustments]", "endpoints[GET /api/v1/data-requests]", entities.Adjustment.fields.test_year_entry_id, entities.DataRequest.fields.issuing_intervenor_id]
        distinguishing_aspect: "Every FK is reverse-reachable via the child's filtered list: adjustments by test_year_entry_id and data-requests by issuing_intervenor_id return exactly the rows of that parent."
        test_recipe:
          setup:
            - "Canonical case in DISCOVERY; E1 carries exactly one adjustment A1 (ACCEPTED via the filing cascade); I1 issued one data request DR1; I2 has issued none"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "901", category: "DEPRECIATION", booked_amount_cents: 400000000 }, as: UtilityFiler, captures: { e2: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "902", category: "TAXES", booked_amount_cents: 200000000 }, as: UtilityFiler, captures: { e3: $.data.id } }
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc}", test_year_entry_id: "${e1}", amount_cents: 50000000, reason: "Annualize pension cost" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a1: $.data.id } }
            - { call: "POST /api/v1/adjustments/${a1}/verify", payload: {}, as: UtilityFiler, as_user_id: "uf_bob" }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Generation plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rb1: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rb1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/deficiency-review", payload: { outcome: "ACCEPTED" }, as: CommissionStaff }
            - { call: "POST /api/v1/rate-cases/${rc}/open-discovery", payload: {}, as: CommissionStaff }
            - { call: "POST /api/v1/intervenors", payload: { rate_case_id: "${rc}", party_name: "AAA Industrial Group", representative_name: "Rae Torres", contact_email: "rae@aaa.example" }, as: IntervenorRep, captures: { i1: $.data.id } }
            - { call: "POST /api/v1/intervenors", payload: { rate_case_id: "${rc}", party_name: "BBB Consumer Advocates", representative_name: "Sam Cho", contact_email: "sam@bbb.example" }, as: IntervenorRep, captures: { i2: $.data.id } }
            - { call: "POST /api/v1/data-requests", payload: { rate_case_id: "${rc}", subject: "Pension normalization", body: "Produce workpapers supporting adjustment A1", issuing_intervenor_id: "${i1}" }, as: IntervenorRep, as_user_id: "${i1}", captures: { dr1: $.data.id } }
          trigger:
            - { call: "GET /api/v1/adjustments", payload: { test_year_entry_id: "${e1}" }, as: UtilityFiler }
            - { call: "GET /api/v1/adjustments", payload: { test_year_entry_id: "${e2}" }, as: UtilityFiler }
            - { call: "GET /api/v1/data-requests", payload: { issuing_intervenor_id: "${i1}" }, as: UtilityFiler }
            - { call: "GET /api/v1/data-requests", payload: { issuing_intervenor_id: "${i2}" }, as: UtilityFiler }
          assert:
            - "adjustments?test_year_entry_id=${e1} returns exactly 1 row with id == ${a1} (ACCEPTED after the filing cascade)"
            - "adjustments?test_year_entry_id=${e2} returns 0 rows (total_count 0)"
            - "data-requests?issuing_intervenor_id=${i1} returns exactly 1 row with id == ${dr1}"
            - "data-requests?issuing_intervenor_id=${i2} returns 0 rows"

      - name: invalid_enum_value_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.TestYearEntry.fields.category, "validations[priority=0]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "category is a closed enum {O_AND_M, DEPRECIATION, TAXES}; 'CAPEX' is rejected with ERR_INVALID_REQUEST (400) at request-shape validation."
        test_recipe:
          setup: ["Case DRAFT"]
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
          trigger:
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "903", category: "CAPEX", booked_amount_cents: 100 }, as: UtilityFiler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (400); no TestYearEntry row is created"

      - name: duplicate_case_number_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=10]", "errors[ERR_CASE_NUMBER_NOT_UNIQUE]", entities.RateCase.fields.case_number]
        distinguishing_aspect: "case_number uniqueness is global across cases: the second create with 'UR-2026-104' fails with ERR_CASE_NUMBER_NOT_UNIQUE (422) while a different number succeeds."
        test_recipe:
          setup: ["Case UR-2026-104 exists"]
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
          trigger:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Duplicate Docket Co", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 800, proposed_revenue_requirement_cents: 100000000, allocation_method: "ENERGY_AVERAGE" }, as: UtilityFiler, captures: { err: $.data.error_id } }
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-105", utility_name: "Other State Gas", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 800, proposed_revenue_requirement_cents: 100000000, allocation_method: "ENERGY_AVERAGE" }, as: UtilityFiler, captures: { rc2: $.data.id } }
          assert:
            - "First duplicate attempt: ${err} == ERR_CASE_NUMBER_NOT_UNIQUE (422)"
            - "Distinct case_number: 201 created (${rc2} != ${rc})"

      - name: duplicate_class_code_within_case_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=10]", "errors[ERR_CLASS_CODE_NOT_UNIQUE]", entities.CustomerClass.fields.class_code]
        distinguishing_aspect: "class_code uniqueness is scoped to the case: duplicate within the case fails (ERR_CLASS_CODE_NOT_UNIQUE, 422); the same class_code under a DIFFERENT case succeeds (case-scoped, not global)."
        test_recipe:
          setup: ["Case A (UR-2026-104) and case B (UR-2026-999), both DRAFT; case A has a RESIDENTIAL class"]
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rca: $.data.id } }
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-999", utility_name: "Other State Gas", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 800, proposed_revenue_requirement_cents: 100000000, allocation_method: "ENERGY_AVERAGE" }, as: UtilityFiler, captures: { rcb: $.data.id } }
            - { call: "POST /api/v1/customer-classes", payload: { rate_case_id: "${rca}", class_code: "RESIDENTIAL", customer_count: 20000, monthly_kwh_per_customer: 500, annual_kwh: 120000000, coincident_peak_kw: 120000, average_demand_kw: 80000, present_customer_charge_cents: 800, present_tiers: [ { up_to_kwh: 300, rate_mills: 700 }, { up_to_kwh: 600, rate_mills: 900 }, { up_to_kwh: null, rate_mills: 1100 } ] }, as: UtilityFiler, captures: { cls_res: $.data.id } }
          trigger:
            - { call: "POST /api/v1/customer-classes", payload: { rate_case_id: "${rca}", class_code: "RESIDENTIAL", customer_count: 5, monthly_kwh_per_customer: 100, annual_kwh: 6000, coincident_peak_kw: 10, average_demand_kw: 5, present_customer_charge_cents: 100, present_tiers: [ { up_to_kwh: null, rate_mills: 500 } ] }, as: UtilityFiler, captures: { err: $.data.error_id } }
            - { call: "POST /api/v1/customer-classes", payload: { rate_case_id: "${rcb}", class_code: "RESIDENTIAL", customer_count: 5, monthly_kwh_per_customer: 100, annual_kwh: 6000, coincident_peak_kw: 10, average_demand_kw: 5, present_customer_charge_cents: 100, present_tiers: [ { up_to_kwh: null, rate_mills: 500 } ] }, as: UtilityFiler, captures: { cls_b: $.data.id } }
          assert:
            - "Same case + same class_code: ${err} == ERR_CLASS_CODE_NOT_UNIQUE (422)"
            - "Same class_code in another case: 201 created (${cls_b} present)"

  # ===========================================================================
  # Section: state_machines (Table 2)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: locked_entry_is_terminal_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TestYearEntry, "errors[ERR_INVALID_ENTRY_STATE]"]
        distinguishing_aspect: "LOCKED is terminal: both a second lock and a reopen on a LOCKED entry are rejected with ERR_INVALID_ENTRY_STATE, and no transition list admits LOCKED as a from-state."
        test_recipe:
          setup: ["Case DRAFT; E1 SUBMITTED then LOCKED"]
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler }
          trigger:
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler, captures: { err1: $.data.error_id } }
            - { call: "POST /api/v1/test-year-entries/${e1}/reopen", payload: {}, as: UtilityFiler, captures: { err2: $.data.error_id } }
          assert:
            - "${err1} == ERR_INVALID_ENTRY_STATE (second lock)"
            - "${err2} == ERR_INVALID_ENTRY_STATE (reopen from terminal LOCKED)"
            - "TestYearEntry.${e1}.status == LOCKED after both rejections"

      - name: intervenor_double_withdraw_rejected
        claim_type: terminal_state_lockdown
