  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: duplicate_sku_and_enrollment_and_entitlement
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_SKU]
          - errors[ERR_DUPLICATE_ENROLLMENT]
          - errors[ERR_DUPLICATE_ENTITLEMENT]
        distinguishing_aspect: "All three uniqueness errors trigger: duplicate product sku, duplicate agreement enrollment_number, duplicate (agreement, product) entitlement."
        test_recipe:
          setup: ["one product SKU DUP1, one agreement E-DUP-1 ACTIVE, one entitlement for (agreement, DUP1) exist"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Dup Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-DUP-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/products"
              payload: { sku: "DUP1", name: "Dup Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${prod_id}", quantity: 3 }
