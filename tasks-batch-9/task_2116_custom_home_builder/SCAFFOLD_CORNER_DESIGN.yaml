        test_recipe:
          setup:
            - "Project is UNDER_CONSTRUCTION with an OPEN allowance line whose selection_deadline is 2026-08-15T00:00:00.000Z."
            - "The logical clock has been moved to 2026-08-16T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
