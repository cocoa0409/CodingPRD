    path: "/premium-items/{premiumItemId}/receipts"
    entity: PremiumItem
    purpose: "Receive more units from the vendor: units_received_qty and on_hand_qty both rise by the received quantity, which keeps the unit conservation invariant intact and may bring a DEPLETED premium back to AVAILABLE."
    roles: [DevelopmentCoordinator]
    input: [received_qty]
    output: PremiumItem
    status: 200
    errors: [ERR_VALIDATION, ERR_PREMIUM_NOT_FOUND, ERR_UNAUTHORIZED]

  # ---------------------------------------------------------------- pledges
  - method: POST
    path: "/pledges"
    entity: Pledge
    purpose: "Record a pledge taken on the phones. Runs the premium allocation waterfall exactly once: candidates are the premiums the amount qualifies for, ranked by tier threshold descending then fair market value ascending then sku, and the first in-stock candidate is reserved. The donor's deductible is the pledge less that premium's fair market value."
    roles: [DevelopmentCoordinator]
    input: [drive_id, donor_name, amount_cents, "shift_id?", "wants_premium?"]
    output: Pledge
    status: 201
    errors: [ERR_VALIDATION, ERR_DRIVE_NOT_ACTIVE, ERR_SHIFT_DRIVE_MISMATCH, ERR_DRIVE_NOT_FOUND, ERR_SHIFT_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: "/pledges/{pledgeId}"
    entity: Pledge
    purpose: "Read one pledge with both state dimensions, its selected premium and its deductible amount."
    roles: [ProgramDirector, DevelopmentCoordinator]
    input: []
    output: Pledge
    status: 200
    errors: [ERR_PLEDGE_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: "/pledges"
    entity: Pledge
    purpose: "List pledges, filterable by drive, taking shift, selected premium and either state dimension."
    roles: [ProgramDirector, DevelopmentCoordinator]
    input: ["drive_id?", "shift_id?", "premium_item_id?", "payment_status?", "premium_status?", "limit?", "offset?"]
    output: "Pledge[]"
    status: 200
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: "/pledges/{pledgeId}/payment"
    entity: Pledge
    purpose: "Settle a pending pledge as PAID or LAPSED. A lapse releases any reserved premium unit back to stock."
    roles: [DevelopmentCoordinator]
    input: [outcome]
    output: Pledge
    status: 200
    errors: [ERR_VALIDATION, ERR_INVALID_STATE, ERR_PLEDGE_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: "/pledges/{pledgeId}/refund"
    entity: Pledge
    purpose: "Refund a paid pledge. Compensating action: a shipped premium is returned to stock and a reserved one released, so the premium unit conservation invariant and the drive's money conservation invariant both hold exactly as before the payment."
    roles: [DevelopmentCoordinator]
    input: []
    output: Pledge
    status: 200
    errors: [ERR_INVALID_STATE, ERR_PLEDGE_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: "/pledges/{pledgeId}/premium-fulfillment"
    entity: Pledge
    purpose: "SHIP the reserved premium to a paid donor, or WAIVE it and release the unit back to stock."
    roles: [DevelopmentCoordinator]
    input: [action]
    output: Pledge
    status: 200
    errors: [ERR_VALIDATION, ERR_PREMIUM_NOT_RESERVED, ERR_PLEDGE_NOT_PAID, ERR_PREMIUM_OUT_OF_STOCK, ERR_PLEDGE_NOT_FOUND, ERR_UNAUTHORIZED]

errors:
  # --- structural (400) ---
  - error_id: ERR_VALIDATION
    http_status: 400
    message: "Request body failed structural validation."
    raised_by: "Any write endpoint: missing required field, unknown enum value, out-of-range number, start_minute + duration_minutes > 1440, or out-of-range pagination parameter."
  # --- authorization (403) ---
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Caller's role may not perform this operation."
    raised_by: "Every endpoint whose roles list excludes the caller's role, and any request without X-User-ID."
  - error_id: ERR_NOT_PROPOSAL_OWNER
    http_status: 403
    message: "Only the proposal's author may perform this operation."
    raised_by: "PATCH /program-proposals/{proposalId}, POST /program-proposals/{proposalId}/submit, POST /program-proposals/{proposalId}/withdraw"
  - error_id: ERR_NOT_BOARD_OPERATOR
    http_status: 403
    message: "Only the episode's board operator may log or submit its playlist."
    raised_by: "POST /episodes/{episodeId}/playlist-entries, POST /episodes/{episodeId}/submit-log"
  - error_id: ERR_NOT_COMMITTEE_MEMBER
    http_status: 403
    message: "Voter does not hold a programming-committee seat."
    raised_by: "POST /program-proposals/{proposalId}/votes"
  - error_id: ERR_SELF_VOTE_FORBIDDEN
    http_status: 403
    message: "A committee member may not vote on a proposal they authored."
    raised_by: "POST /program-proposals/{proposalId}/votes"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The officer who cleared this spot's copy may not adjudicate an incident against it."
    raised_by: "POST /compliance-incidents/{incidentId}/adjudicate"
  # --- existence (404) ---
  - error_id: ERR_VOLUNTEER_NOT_FOUND
    http_status: 404
    message: "Volunteer does not exist."
    raised_by: "Any endpoint addressing or referencing a volunteer."
  - error_id: ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    message: "Certification record does not exist."
    raised_by: "GET/POST /certifications/{certificationId}/*"
  - error_id: ERR_PROPOSAL_NOT_FOUND
    http_status: 404
    message: "Program proposal does not exist."
    raised_by: "Any endpoint addressing a proposal."
  - error_id: ERR_VOTE_NOT_FOUND
    http_status: 404
    message: "Committee vote does not exist."
    raised_by: "GET /committee-votes/{voteId}"
  - error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    message: "Program does not exist."
    raised_by: "Any endpoint addressing or referencing a program."
  - error_id: ERR_GRID_NOT_FOUND
    http_status: 404
    message: "Schedule grid does not exist."
    raised_by: "Any endpoint addressing a grid."
  - error_id: ERR_SLOT_NOT_FOUND
    http_status: 404
    message: "Slot assignment does not exist."
    raised_by: "Any endpoint addressing or referencing a slot assignment."
  - error_id: ERR_EPISODE_NOT_FOUND
    http_status: 404
    message: "Episode does not exist."
    raised_by: "Any endpoint addressing or referencing an episode."
  - error_id: ERR_PLAYLIST_ENTRY_NOT_FOUND
    http_status: 404
    message: "Playlist entry does not exist."
    raised_by: "GET /playlist-entries/{entryId}"
  - error_id: ERR_SPOT_NOT_FOUND
    http_status: 404
    message: "Underwriting spot does not exist."
    raised_by: "Any endpoint addressing or referencing a spot."
  - error_id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    message: "Compliance incident does not exist."
    raised_by: "Any endpoint addressing or referencing an incident, including POST /certifications/{certificationId}/revoke."
  - error_id: ERR_DRIVE_NOT_FOUND
    http_status: 404
    message: "Membership drive does not exist."
    raised_by: "Any endpoint addressing or referencing a drive."
  - error_id: ERR_SHIFT_NOT_FOUND
    http_status: 404
    message: "Phone-bank shift does not exist."
    raised_by: "Any endpoint addressing or referencing a shift."
  - error_id: ERR_PREMIUM_NOT_FOUND
    http_status: 404
    message: "Premium item does not exist."
    raised_by: "GET /premium-items/{premiumItemId}, POST /premium-items/{premiumItemId}/receipts"
  - error_id: ERR_PLEDGE_NOT_FOUND
    http_status: 404
    message: "Pledge does not exist."
    raised_by: "Any endpoint addressing a pledge."
  # --- concurrency (412) ---
  - error_id: ERR_STALE_GRID_VERSION
    http_status: 412
    message: "expected_grid_version does not match the grid's current version."
    raised_by: "POST /schedule-grids/{gridId}/slot-assignments, POST /schedule-grids/{gridId}/publish"
  - error_id: ERR_STALE_PROPOSAL_VERSION
    http_status: 412
    message: "expected_proposal_version does not match the proposal's current version."
    raised_by: "POST /program-proposals/{proposalId}/decide"
  - error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    message: "expected_program_version does not match the program's current version."
    raised_by: "POST /programs/{programId}/cancel"
  # --- conflict (409) ---
  - error_id: ERR_DUPLICATE_KEY
    http_status: 409
    message: "A natural key (email, season_code, sku or playlist sequence number) is already taken."
    raised_by: "POST /volunteers, PATCH /volunteers/{volunteerId}, POST /schedule-grids, POST /premium-items, POST /episodes/{episodeId}/playlist-entries"
  - error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    message: "This member has already voted in the proposal's current review round."
    raised_by: "POST /program-proposals/{proposalId}/votes"
  - error_id: ERR_PROGRAM_ALREADY_EXISTS
    http_status: 409
    message: "A program has already been created from this proposal."
    raised_by: "POST /program-proposals/{proposalId}/decide"
  - error_id: ERR_INVALID_STATE
    http_status: 409
    message: "The entity's current state does not permit this transition."
    raised_by: "Every transition endpoint."
  - error_id: ERR_GRID_NOT_MUTABLE
    http_status: 409
    message: "The schedule grid is published or superseded and can no longer be edited."
    raised_by: "POST /schedule-grids/{gridId}/slot-assignments, POST /schedule-grids/{gridId}/publish, POST /slot-assignments/{assignmentId}/confirm, /release, /reinstate"
  - error_id: ERR_SLOT_CONFLICT
    http_status: 409
    message: "The requested window collides with a live occupation once the 2-minute station-identification buffer is applied."
    raised_by: "POST /schedule-grids/{gridId}/slot-assignments, POST /slot-assignments/{assignmentId}/reinstate"
  - error_id: ERR_SENIORITY_MARGIN_UNMET
    http_status: 409
    message: "The challenger's host does not outrank the incumbent's host by the required 5.00 seniority points."
    raised_by: "POST /schedule-grids/{gridId}/slot-assignments"
  - error_id: ERR_TENTATIVE_SLOTS_PRESENT
    http_status: 409
    message: "The grid still has tentative occupations and cannot be published."
    raised_by: "POST /schedule-grids/{gridId}/publish"
  - error_id: ERR_PROGRAM_RESTRICTED
    http_status: 409
    message: "The program's compliance standing is RESTRICTED and it may not be scheduled or aired."
    raised_by: "POST /slot-assignments/{assignmentId}/confirm, /reinstate, POST /episodes, POST /episodes/{episodeId}/air-result"
  - error_id: ERR_PROPOSAL_NOT_IN_REVIEW
    http_status: 409
    message: "The proposal is not in committee review."
    raised_by: "POST /program-proposals/{proposalId}/votes, POST /program-proposals/{proposalId}/decide"
  - error_id: ERR_LOG_NOT_PENDING
    http_status: 409
    message: "The episode's playlist log is not open."
    raised_by: "POST /episodes/{episodeId}/playlist-entries, POST /episodes/{episodeId}/submit-log"
  - error_id: ERR_PUBLIC_FILE_NOT_REQUIRED
    http_status: 409
    message: "This spot owes no outstanding public-file entry."
    raised_by: "POST /underwriting-spots/{spotId}/public-file-posting"
  - error_id: ERR_RETAKE_TOO_SOON
    http_status: 409
    message: "The 14-day retake cooling-off window has not elapsed."
    raised_by: "POST /certifications/{certificationId}/retake"
  - error_id: ERR_MAX_ATTEMPTS_REACHED
    http_status: 409
    message: "The certification has already been attempted three times."
    raised_by: "POST /certifications/{certificationId}/retake"
  - error_id: ERR_DRIVE_NOT_ACTIVE
    http_status: 409
    message: "The membership drive is not active."
    raised_by: "POST /phone-bank-shifts, POST /pledges"
  - error_id: ERR_PLEDGES_PENDING
    http_status: 409
    message: "The drive still has pledges awaiting settlement."
    raised_by: "POST /membership-drives/{driveId}/close"
  - error_id: ERR_SHIFT_CONFLICT
    http_status: 409
    message: "The volunteer already works a shift whose closed interval touches or overlaps this one."
    raised_by: "POST /phone-bank-shifts"
  - error_id: ERR_PHONE_LINE_CAPACITY
    http_status: 409
    message: "Every phone line on the drive is already staffed for part of the requested window."
    raised_by: "POST /phone-bank-shifts"
  - error_id: ERR_PREMIUM_NOT_RESERVED
    http_status: 409
    message: "The pledge has no reserved premium to fulfil."
    raised_by: "POST /pledges/{pledgeId}/premium-fulfillment"
  - error_id: ERR_PLEDGE_NOT_PAID
    http_status: 409
    message: "A premium may only be shipped against a paid pledge."
    raised_by: "POST /pledges/{pledgeId}/premium-fulfillment"
  - error_id: ERR_PREMIUM_OUT_OF_STOCK
    http_status: 409
    message: "No unit of the reserved premium is on hand."
    raised_by: "POST /pledges/{pledgeId}/premium-fulfillment"
  - error_id: ERR_NOT_EDITABLE
    http_status: 409
    message: "The record's current state does not allow amendment."
    raised_by: "PATCH /program-proposals/{proposalId}, PATCH /underwriting-spots/{spotId}, PATCH /volunteers/{volunteerId}"
  # --- unprocessable (422) ---
  - error_id: ERR_INVALID_INTERVAL
    http_status: 422
    message: "The interval's end is not strictly after its start."
    raised_by: "POST /schedule-grids, POST /underwriting-spots, PATCH /underwriting-spots/{spotId}, POST /underwriting-spots/{spotId}/submit-for-review, POST /membership-drives, POST /phone-bank-shifts"
  - error_id: ERR_SLOT_PROGRAM_MISMATCH
    http_status: 422
    message: "The named slot assignment belongs to a different program."
    raised_by: "POST /episodes"
  - error_id: ERR_EPISODE_SLOT_MISMATCH
    http_status: 422
    message: "The scheduled start does not match the slot's weekday and start minute."
    raised_by: "POST /episodes"
  - error_id: ERR_SHIFT_DRIVE_MISMATCH
    http_status: 422
    message: "The named phone-bank shift belongs to a different drive."
    raised_by: "POST /pledges"
  - error_id: ERR_INCIDENT_TARGET_REQUIRED
    http_status: 422
    message: "The incident's category requires a target that was not supplied."
    raised_by: "POST /compliance-incidents"
  - error_id: ERR_REVOCATION_UNSUPPORTED
    http_status: 422
    message: "Revocation requires a substantiated incident against this certification's holder."
    raised_by: "POST /certifications/{certificationId}/revoke"
  - error_id: ERR_PROPOSER_NOT_CERTIFIED
    http_status: 422
    message: "The proposal's author is not a certified programmer."
    raised_by: "POST /program-proposals/{proposalId}/submit"
  - error_id: ERR_VOTER_INELIGIBLE
    http_status: 422
    message: "A suspended or resigned volunteer may not vote."
    raised_by: "POST /program-proposals/{proposalId}/votes"
  - error_id: ERR_OPERATOR_NOT_CERTIFIED
    http_status: 422
    message: "The board operator holds no live board-operation certification."
    raised_by: "POST /episodes, POST /episodes/{episodeId}/air-result"
  - error_id: ERR_VOLUNTEER_NOT_ELIGIBLE
    http_status: 422
    message: "A suspended or resigned volunteer may not be rostered."
    raised_by: "POST /phone-bank-shifts"
  - error_id: ERR_SHIFT_OUTSIDE_DRIVE_WINDOW
    http_status: 422
    message: "The shift falls outside the drive's window."
    raised_by: "POST /phone-bank-shifts"
  - error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    message: "Too few ballots were cast in the current review round to reach quorum."
    raised_by: "POST /program-proposals/{proposalId}/decide"
  - error_id: ERR_COMMITTEE_UNDERSTAFFED
    http_status: 422
    message: "Fewer than three seated committee members are available."
    raised_by: "POST /program-proposals/{proposalId}/open-review"
  - error_id: ERR_GRID_EMPTY
    http_status: 422
    message: "The grid has no assigned airtime and cannot be published."
    raised_by: "POST /schedule-grids/{gridId}/publish"
  - error_id: ERR_DIVERSITY_QUOTA_UNMET
    http_status: 422
    message: "The grid's public-affairs share is below the 8.00 percent minimum."
    raised_by: "POST /schedule-grids/{gridId}/publish"
  - error_id: ERR_WEEK_MINUTES_EXCEEDED
    http_status: 422
    message: "The grid's assigned minutes would exceed the 10080 minutes in a broadcast week."
    raised_by: "POST /schedule-grids/{gridId}/slot-assignments"
  - error_id: ERR_PLAYLIST_EMPTY
    http_status: 422
    message: "A music program's playlist log cannot be submitted empty."
    raised_by: "POST /episodes/{episodeId}/submit-log"
  - error_id: ERR_EDITED_COPY_STILL_NONCOMPLIANT
    http_status: 422
    message: "The edited copy still screens at or above the editable risk threshold."
    raised_by: "POST /underwriting-spots/{spotId}/review"
  - error_id: ERR_POLITICAL_COPY_UNCENSORABLE
    http_status: 422
    message: "Political-candidate copy may not be edited."
    raised_by: "POST /underwriting-spots/{spotId}/review"

roles:
  - name: ProgramDirector
    backing: opaque
    description: "Runs the schedule. Owns grid construction, slot occupation, episode scheduling, air results, periodic performance review and program cancellation, and chairs the committee by opening reviews and tallying decisions."
    exclusive_operations:
      - "POST /schedule-grids"
      - "POST /schedule-grids/{gridId}/slot-assignments"
      - "POST /schedule-grids/{gridId}/publish"
      - "POST /slot-assignments/{assignmentId}/confirm"
      - "POST /slot-assignments/{assignmentId}/release"
      - "POST /slot-assignments/{assignmentId}/reinstate"
      - "POST /episodes"
      - "POST /episodes/{episodeId}/air-result"
      - "POST /programs/{programId}/performance-reviews"
      - "POST /programs/{programId}/cancel"
      - "POST /program-proposals/{proposalId}/open-review"
      - "POST /program-proposals/{proposalId}/decide"
    shared_operations:
      - "POST /program-proposals (shared with Volunteer)"
      - "PATCH /volunteers/{volunteerId} (shared with TrainingCoordinator)"
      - "POST /compliance-incidents (shared with ComplianceOfficer)"
      - "POST /operations/daily-sweep (shared with ComplianceOfficer)"
      - "every GET"
  - name: CommitteeMember
    backing: "entity_backed:Volunteer"
    description: "A seated programming-committee member. X-User-ID is the Volunteer.id, and committee_seat must be true. May cast exactly one ballot per proposal per review round and may never vote on a proposal they authored."
    exclusive_operations:
      - "POST /program-proposals/{proposalId}/votes"
    shared_operations:
      - "GET /program-proposals, GET /committee-votes, GET /volunteers, GET /programs, GET /schedule-grids, GET /slot-assignments"
  - name: Volunteer
    backing: "entity_backed:Volunteer"
    description: "A rank-and-file volunteer programmer. X-User-ID is the Volunteer.id. Authors and revises their own proposals and logs the playlist for episodes they board-operate."
    exclusive_operations:
      - "PATCH /program-proposals/{proposalId}"
      - "POST /program-proposals/{proposalId}/submit"
      - "POST /program-proposals/{proposalId}/withdraw"
      - "POST /episodes/{episodeId}/playlist-entries"
      - "POST /episodes/{episodeId}/submit-log"
    shared_operations:
      - "POST /program-proposals (shared with ProgramDirector)"
      - "every GET except the compliance and premium collections"
  - name: ComplianceOfficer
    backing: opaque
    description: "Guards the regulator-facing record. Reviews underwriting copy, records public-file postings, certifies playlist logs, adjudicates and remediates incidents and revokes certifications. X-User-ID is stored as reviewed_by_user_id and adjudicated_by_user_id, and the segregation-of-duties rule bars the officer who cleared a spot from adjudicating an incident against it."
    exclusive_operations:
      - "POST /underwriting-spots/{spotId}/review"
      - "POST /underwriting-spots/{spotId}/public-file-posting"
      - "POST /episodes/{episodeId}/log-decision"
      - "POST /compliance-incidents/{incidentId}/adjudicate"
      - "POST /compliance-incidents/{incidentId}/remediate"
      - "POST /certifications/{certificationId}/revoke"
    shared_operations:
      - "POST /compliance-incidents (shared with ProgramDirector)"
      - "POST /operations/daily-sweep (shared with ProgramDirector)"
      - "every GET"
  - name: TrainingCoordinator
    backing: opaque
    description: "Runs the training pipeline. Enrols volunteers, opens and grades certification records, schedules retakes and seats members on the committee."
    exclusive_operations:
      - "POST /volunteers"
      - "POST /volunteers/{volunteerId}/certifications"
      - "POST /certifications/{certificationId}/exam-results"
      - "POST /certifications/{certificationId}/retake"
    shared_operations:
      - "PATCH /volunteers/{volunteerId} (shared with ProgramDirector)"
      - "GET /volunteers, GET /certifications"
  - name: DevelopmentCoordinator
    backing: opaque
    description: "Runs fundraising. Owns underwriting spot drafting, membership drives, phone-bank rostering, premium inventory and pledge settlement and fulfilment."
    exclusive_operations:
      - "POST /underwriting-spots"
      - "PATCH /underwriting-spots/{spotId}"
      - "POST /underwriting-spots/{spotId}/submit-for-review"
      - "POST /membership-drives"
      - "POST /membership-drives/{driveId}/activate"
      - "POST /membership-drives/{driveId}/close"
      - "POST /phone-bank-shifts"
      - "POST /phone-bank-shifts/{shiftId}/close"
      - "POST /premium-items"
      - "POST /premium-items/{premiumItemId}/receipts"
      - "POST /pledges"
      - "POST /pledges/{pledgeId}/payment"
      - "POST /pledges/{pledgeId}/refund"
      - "POST /pledges/{pledgeId}/premium-fulfillment"
    shared_operations:
      - "GET /volunteers, GET /programs, GET /underwriting-spots, GET /membership-drives, GET /phone-bank-shifts, GET /premium-items, GET /pledges"
