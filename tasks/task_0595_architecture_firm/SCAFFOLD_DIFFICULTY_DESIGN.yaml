            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CA", weight_bp: 2000, milestone_name: "CA", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /contracts/${ct}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
            - call: "POST /phases/${sd}/state"
              payload: { to_status: "ACTIVE" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases/${sd}/state"
              payload: { to_status: "COMPLETED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases/${dd}/state"
              payload: { to_status: "ACTIVE" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "PATCH /phases/${dd}"
              payload: { percent_complete: 60 }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /expenses"
              payload: { project_id: "${proj}", staff_member_id: "${arch_id}", category: "PRINTING", amount_cents: 100000, reimbursable: true, markup_bp: 1000 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { exp: $.data.id }
            - call: "POST /expenses/${exp}/state"
              payload: { to_status: "APPROVED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "GET /contracts/${ct}"
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ct_ver: $.data.version }
            - call: "POST /invoices"
              payload: { contract_id: "${ct}", period_end: "2026-06-30T00:00:00Z", expected_contract_version: "${ct_ver}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /invoices/${inv}/state"
              payload: { to_status: "ISSUED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "GET /contracts/${ct}"
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { billed_after_issue: $.data.billed_fee_to_date_cents, wip_after_issue: $.data.wip_balance_cents }
            - call: "POST /invoices/${inv}/state"
              payload: { to_status: "VOID" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
            - call: "GET /contracts/${ct}"
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { billed_after_void: $.data.billed_fee_to_date_cents, wip_after_void: $.data.wip_balance_cents }
          assert:
            - "before issue: Contract.${ct}.earned_to_date_cents == 3200000, billed_fee_to_date_cents == 0, wip_balance_cents == 3200000"
            - "after issue: Contract.${ct}.earned_to_date_cents == 3200000, billed_fee_to_date_cents == 3200000, wip_balance_cents == 0"
            - "after issue: Expense.${exp}.status == BILLED and Expense.${exp}.invoice_id == ${inv}"
            - "after void: Contract.${ct}.earned_to_date_cents == 3200000, billed_fee_to_date_cents == 0, wip_balance_cents == 3200000"
            - "after void: Expense.${exp}.status == APPROVED and Expense.${exp}.invoice_id == null"
            - "in all three snapshots: earned_to_date_cents == billed_fee_to_date_cents + wip_balance_cents"
            - "Invoice.${inv}.status == VOID and Invoice.${inv}.fee_billed_cents == 3200000 (the frozen figures are not erased)"

      - name: time_entry_reversal_restores_approved_hours_and_labor_cost_identity
        grounds:
          - state_machines.TimeEntry.APPROVED_to_SUBMITTED
          - calculations.project_labor_rollup
          - entities.Project.fields.approved_hours
          - entities.Project.fields.labor_cost_cents
          - entities.Project.fields.budget_posture
        distinguishing_aspect: |
          Conserved quantity #2 is LABOUR HOURS (not money) — pinned as
          Project.approved_hours == sum of TimeEntry.hours over entries with status == APPROVED
          on the project. Approving the 8.0-hour entry drives approved_hours 0 -> 8.0,
          labor_cost_cents 0 -> 80000 and posture WITHIN_BUDGET -> OVER_BUDGET (budget 80000);
          the compensating APPROVED -> SUBMITTED reversal drives all three exactly back to
          0 / 0 / WITHIN_BUDGET, leaving no residue.
        test_recipe:
          setup:
            - "An executed PERCENT_OF_CONSTRUCTION project with labor_budget_cents 80000 and an architect whose cost_rate_cents_per_hour is 10000."
            - "One APPROVED 8.0-hour TimeEntry (cost 80000 cents) so Project.approved_hours == 8.0, labor_cost_cents == 80000 and budget_posture == OVER_BUDGET."
            - "No invoice has been issued, so the reversal precondition holds."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Avery Architect", title: "ARCHITECT", billing_rate_cents_per_hour: 20000, cost_rate_cents_per_hour: 10000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { arch_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "REV-001", name: "Reversal Ridge", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 80000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /contracts"
              payload: { project_id: "${proj}", fee_basis: "PERCENT_OF_CONSTRUCTION", review_clock_basis: "CALENDAR_DAYS", construction_cost_estimate_cents: 100000000, fee_rate_bp: 1000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2000, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { sd: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "DD", weight_bp: 2000, milestone_name: "DD", milestone_due_at: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CD", weight_bp: 4000, milestone_name: "CD", milestone_due_at: "2026-10-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CA", weight_bp: 2000, milestone_name: "CA", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /contracts/${ct}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
            - call: "POST /phases/${sd}/state"
              payload: { to_status: "ACTIVE" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /time-entries"
              payload: { phase_id: "${sd}", staff_member_id: "${arch_id}", start_utc: "2026-05-04T09:00:00Z", end_utc: "2026-05-04T17:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { te: $.data.id }
            - call: "POST /time-entries/${te}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /time-entries/${te}/state"
              payload: { to_status: "APPROVED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
          trigger:
            - call: "GET /projects/${proj}"
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { hours_before: $.data.approved_hours, posture_before: $.data.budget_posture }
            - call: "POST /time-entries/${te}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "GET /projects/${proj}"
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { hours_after: $.data.approved_hours, posture_after: $.data.budget_posture }
          assert:
            - "before reversal: Project.${proj}.approved_hours == 8.0, labor_cost_cents == 80000, budget_posture == OVER_BUDGET"
            - "after reversal: TimeEntry.${te}.status == SUBMITTED and TimeEntry.${te}.approved_by_user_id == null"
            - "after reversal: Project.${proj}.approved_hours == 0 and Project.${proj}.labor_cost_cents == 0"
            - "after reversal: Project.${proj}.budget_posture == WITHIN_BUDGET"
            - "after reversal: Project.${proj}.approved_hours == sum of TimeEntry.hours over APPROVED entries == 0"
