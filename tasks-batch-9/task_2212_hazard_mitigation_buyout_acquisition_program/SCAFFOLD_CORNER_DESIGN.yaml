      - name: a_third_return_pushes_the_appraisal_past_the_revision_limit_on_resubmission
        claim_type: cyclic
        grounds:
          - validations.priority_63
          - global_constants.MAX_APPRAISAL_REVISIONS
          - state_machines.Appraisal
        distinguishing_aspect: |
          The SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED cycle is traversed three times; the
          limit is checked on submit with a strict > comparison against revision_count, so the third
          submission (revision_count 2) still succeeds and only the fourth (revision_count 3) returns
          409 ERR_APPRAISAL_REVISION_LIMIT, leaving the appraisal parked in RETURNED_FOR_REVISION.
