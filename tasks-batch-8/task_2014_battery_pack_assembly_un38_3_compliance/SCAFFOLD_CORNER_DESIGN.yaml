            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { pack_id: $.data.id }
          trigger:
            # weld_count=7, amps=80.5, pulse=13, profile A (base 12), force=30 (factor=1.0)
            # raw = 7 * 80.5 * 0.013 * 12 = 7*80.5 = 563.5; 563.5*0.013 = 7.3255; 7.3255*12 = 87.906
            # force_factor = 1.0 → 87.906 → round HALF_UP 2dp → 87.91
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records"
              payload: { weld_count: 7, current_amps: 80.5, pulse_ms: 13, electrode_force_n: 30.0, weld_profile_used: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { heat: $.data.heat_dose_j }
          assert:
            - "WeldingParameterRecord.heat_dose_j == 87.91"

