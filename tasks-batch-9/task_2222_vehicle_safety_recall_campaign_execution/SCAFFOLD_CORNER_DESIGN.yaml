            - "response.data.error_id == \"ERR_SUPERSEDED_CAMPAIGN_INVALID\""
            - "GET /recall-campaigns/${old_camp_id} still shows campaign_status == \"DRAFT\""
            - "GET /recall-campaigns with supersedes_campaign_id == ${old_camp_id} returns total_count == 0"

