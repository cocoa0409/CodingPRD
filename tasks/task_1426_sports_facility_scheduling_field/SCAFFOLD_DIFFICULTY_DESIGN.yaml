          trigger:
            - { call: "POST /permits/${p_id}/confirm", payload: {}, as: OrgCoordinator, as_user_id: "${o_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_PERMIT_STATE (NOT ERR_DEPOSIT_NOT_PAID): state gate p7 precedes fiscal gate p11"
            - "Permit.${p_id}.status remains CANCELLED; no side effects fired"

