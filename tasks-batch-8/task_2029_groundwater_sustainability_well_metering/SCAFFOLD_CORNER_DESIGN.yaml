# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Task 2029 — Groundwater Sustainability & Well Metering Program
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: account_creation_applies_defaults_and_fixed_clock
        claim_type: creation
        grounds: [entities.WaterUserAccount, "endpoints[POST /water-user-accounts]", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "A freshly created account starts ACTIVE with all computed counters zeroed, version 1, current_water_year taken from the logical clock's calendar year, and created_at equal to the fixed startup clock default 2026-08-01T00:00:00.000Z (the clock was never set in this test)."
        test_recipe:
          setup: ["Empty DB; logical clock never set (startup default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "New Pumper", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct: $.data.id, st: $.data.status, cwy: $.data.current_water_year, ext: $.data.extracted_af_ytd, pend: $.data.pending_extraction_af, cred: $.data.credit_balance_af, tout: $.data.transfer_out_af_ytd, tres: $.data.transfer_reserved_af, pbal: $.data.penalty_balance_cents, ver: $.data.version, cat: $.data.created_at }
          assert:
            - "status == ACTIVE (captured ${st}); version == 1 (captured ${ver})"
            - "extracted_af_ytd == 0.000, pending_extraction_af == 0.000, credit_balance_af == 0.000, transfer_out_af_ytd == 0.000, transfer_reserved_af == 0.000, penalty_balance_cents == 0 (captured ${ext}, ${pend}, ${cred}, ${tout}, ${tres}, ${pbal})"
            - "current_water_year == 2026 (captured ${cwy}) and created_at == 2026-08-01T00:00:00.000Z (captured ${cat}): the logical clock defaults to the fixed startup instant, never wall-clock"

      - name: account_creation_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.WaterUserAccount.fields.extracted_af_ytd]
        distinguishing_aspect: "Client-supplied values for computed fields are ignored on creation: passing extracted_af_ytd 999 still yields a stored 0.000."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Sneaky Pumper", account_type: "AGRICULTURAL", base_allocation_af: 100.000, extracted_af_ytd: 999.000 }
              as: WaterMaster
              captures: { acct: $.data.id, ext: $.data.extracted_af_ytd }
          assert:
            - "Creation succeeds (201) and stored extracted_af_ytd == 0.000 (captured ${ext}); the input value 999.000 was ignored"

      - name: well_creation_monitoring_missing_threshold_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Well.fields.minimum_threshold_ft, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "minimum_threshold_ft is conditionally required: a MONITORING well registered without it fails with ERR_INVALID_REQUEST, while a PRODUCTION well must not carry it (second leg also ERR_INVALID_REQUEST)."
        test_recipe:
          setup: ["Account WA (ACTIVE) exists"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Agency Monitor", account_type: "MUNICIPAL", base_allocation_af: 1000.000 }
              as: WaterMaster
              captures: { acct_wa: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { account_id: "${acct_wa}", well_type: "MONITORING", location_description: "MW-no-threshold" }
              as: WellOwner
              as_user_id: "${acct_wa}"
              captures: { err_1: $.data.error_id }
            - call: "POST /wells"
              payload: { account_id: "${acct_wa}", well_type: "PRODUCTION", location_description: "PW-with-threshold", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_wa}"
              captures: { err_2: $.data.error_id }
          assert:
            - "MONITORING without minimum_threshold_ft: captured ${err_1} == ERR_INVALID_REQUEST"
            - "PRODUCTION with minimum_threshold_ft present: captured ${err_2} == ERR_INVALID_REQUEST (field forbidden for non-monitoring wells)"

      - name: get_well_returns_persisted_fields
        claim_type: retrieval
        grounds: [entities.Well, "endpoints[GET /wells/{wellId}]"]
        distinguishing_aspect: "GET /wells/{wellId} echoes the stored entity: well_type, account_id, initial status REGISTERED, meter_serial null."
        test_recipe:
          setup: ["Account WR (ACTIVE) with one REGISTERED PRODUCTION well"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper WR", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_wr: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_wr}", well_type: "PRODUCTION", location_description: "Parcel WR" }
              as: WellOwner
              as_user_id: "${acct_wr}"
              captures: { well_wr: $.data.id }
          trigger:
            - call: "GET /wells/${well_wr}"
              as: WaterMaster
              captures: { g_type: $.data.well_type, g_status: $.data.status, g_acct: $.data.account_id, g_meter: $.data.meter_serial }
          assert:
            - "well_type == PRODUCTION (captured ${g_type}); status == REGISTERED (captured ${g_status})"
            - "account_id == ${acct_wr} (captured ${g_acct}); meter_serial == null (captured ${g_meter})"

      - name: not_found_family_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ACCOUNT_NOT_FOUND]", "errors[ERR_WELL_NOT_FOUND]", "errors[ERR_REPORT_NOT_FOUND]", "errors[ERR_TRANSFER_NOT_FOUND]", "errors[ERR_ASSESSMENT_NOT_FOUND]", "errors[ERR_SNAPSHOT_NOT_FOUND]", "errors[ERR_ANNUAL_REPORT_NOT_FOUND]"]
        distinguishing_aspect: "Every entity family's single-resource or action endpoint returns its domain-specific 404 error for a random, never-created UUID."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /water-user-accounts/11111111-1111-4111-8111-111111111111"
              as: WaterMaster
              captures: { e_acct: $.data.error_id }
            - call: "GET /wells/22222222-2222-4222-8222-222222222222"
              as: WaterMaster
              captures: { e_well: $.data.error_id }
            - call: "GET /extraction-reports/33333333-3333-4333-8333-333333333333"
              as: WaterMaster
              captures: { e_rep: $.data.error_id }
            - call: "GET /transfer-orders/44444444-4444-4444-8444-444444444444"
              as: WaterMaster
              captures: { e_tr: $.data.error_id }
            - call: "GET /penalty-assessments/55555555-5555-4555-8555-555555555555"
              as: WaterMaster
              captures: { e_pa: $.data.error_id }
            - call: "POST /basin-condition-snapshots/66666666-6666-4666-8666-666666666666/publish"
              as: WaterMaster
              captures: { e_snap: $.data.error_id }
            - call: "POST /annual-state-reports/77777777-7777-4777-8777-777777777777/submit"
              as: WaterMaster
              captures: { e_ann: $.data.error_id }
          assert:
            - "captured ${e_acct} == ERR_ACCOUNT_NOT_FOUND; ${e_well} == ERR_WELL_NOT_FOUND; ${e_rep} == ERR_REPORT_NOT_FOUND; ${e_tr} == ERR_TRANSFER_NOT_FOUND"
            - "captured ${e_pa} == ERR_ASSESSMENT_NOT_FOUND; ${e_snap} == ERR_SNAPSHOT_NOT_FOUND; ${e_ann} == ERR_ANNUAL_REPORT_NOT_FOUND"

      - name: list_wells_paginates_with_limit_offset
        claim_type: listing
        grounds: ["endpoints[GET /wells]", response_envelope]
        distinguishing_aspect: "Pagination envelope: limit=2 returns the first 2 of 3 wells with total_count 3 and has_more true; offset=2 returns the final 1 with has_more false. Default sort is created_at ASC with request-arrival tie-break."
        test_recipe:
          setup: ["Account WP (ACTIVE) with 3 REGISTERED PRODUCTION wells w1, w2, w3 created in that order"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper WP", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_wp: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_wp}", well_type: "PRODUCTION", location_description: "P-1" }
              as: WellOwner
              as_user_id: "${acct_wp}"
              captures: { wp_1: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_wp}", well_type: "PRODUCTION", location_description: "P-2" }
              as: WellOwner
              as_user_id: "${acct_wp}"
              captures: { wp_2: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_wp}", well_type: "PRODUCTION", location_description: "P-3" }
              as: WellOwner
              as_user_id: "${acct_wp}"
              captures: { wp_3: $.data.id }
          trigger:
            - call: "GET /wells?account_id=${acct_wp}&limit=2&offset=0"
              as: WaterMaster
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /wells?account_id=${acct_wp}&limit=2&offset=2"
              as: WaterMaster
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "Page 1: data length == 2, first id == ${wp_1} (captured ${page1_first}), second id == ${wp_2} (captured ${page1_second}); envelope total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page 2: data length == 1, id == ${wp_3} (captured ${page2_first}); total_count == 3, has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: domestic_well_activates_without_meter
        claim_type: valid_transition
        grounds: [state_machines.Well.REGISTERED_to_ACTIVE]
        distinguishing_aspect: "Domestic-well exemption: a DOMESTIC well transitions REGISTERED -> ACTIVE via activate without any meter installation, while its meter_serial stays null."
        test_recipe:
          setup: ["Account WD (ACTIVE) with one REGISTERED DOMESTIC well"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Household WD", account_type: "DOMESTIC", base_allocation_af: 2.000 }
              as: WaterMaster
              captures: { acct_wd: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_wd}", well_type: "DOMESTIC", location_description: "Home parcel" }
              as: WellOwner
              as_user_id: "${acct_wd}"
              captures: { well_wd: $.data.id }
          trigger:
            - call: "POST /wells/${well_wd}/activate"
              as: WaterMaster
              captures: { st: $.data.status, meter: $.data.meter_serial }
          assert:
            - "Well.${well_wd}.status == ACTIVE (captured ${st}) directly from REGISTERED — the metering exemption path"
            - "meter_serial == null (captured ${meter})"

      - name: production_well_activate_without_meter_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Well.METER_INSTALLED_to_ACTIVE, "errors[ERR_INVALID_WELL_STATE]"]
        distinguishing_aspect: "Meter installation requirement: a PRODUCTION well still in REGISTERED cannot be activated; the agency must verify an installed meter first (METER_INSTALLED -> ACTIVE only)."
        test_recipe:
          setup: ["Account WM (ACTIVE) with one REGISTERED PRODUCTION well (no meter)"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper WM", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_wm: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_wm}", well_type: "PRODUCTION", location_description: "Parcel WM" }
              as: WellOwner
              as_user_id: "${acct_wm}"
              captures: { well_wm: $.data.id }
          trigger:
            - call: "POST /wells/${well_wm}/activate"
              as: WaterMaster
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_INVALID_WELL_STATE: PRODUCTION wells reach ACTIVE only from METER_INSTALLED"

      - name: verify_already_verified_report_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ExtractionReport.SUBMITTED_to_VERIFIED, "errors[ERR_INVALID_REPORT_STATE]"]
        distinguishing_aspect: "VERIFIED is terminal: a second verify is rejected with ERR_INVALID_REPORT_STATE and the ledger is not double-counted."
        test_recipe:
          setup: ["Account WV (ACTIVE) with ACTIVE PRODUCTION well; report (2026, month 6, 10.000 af) already VERIFIED"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper WV", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_wv: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_wv}", well_type: "PRODUCTION", location_description: "Parcel WV" }
              as: WellOwner
              as_user_id: "${acct_wv}"
              captures: { well_wv: $.data.id }
            - call: "POST /wells/${well_wv}/install-meter"
              payload: { meter_serial: "M-WV1" }
              as: WellOwner
              as_user_id: "${acct_wv}"
            - call: "POST /wells/${well_wv}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_wv}", water_year: 2026, month: 6, reported_af: 10.000 }
              as: WellOwner
              as_user_id: "${acct_wv}"
              captures: { rep_wv: $.data.id }
            - call: "POST /extraction-reports/${rep_wv}/verify"
              as: WaterMaster
          trigger:
            - call: "POST /extraction-reports/${rep_wv}/verify"
              as: WaterMaster
              captures: { err: $.data.error_id }
            - call: "GET /water-user-accounts/${acct_wv}"
              as: WaterMaster
              captures: { ext: $.data.extracted_af_ytd }
          assert:
            - "captured ${err} == ERR_INVALID_REPORT_STATE"
            - "extracted_af_ytd == 10.000 (captured ${ext}): the rejected verify did not double-count"

      - name: cancel_settled_transfer_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.TransferOrder.ACCEPTED_to_SETTLED, "errors[ERR_INVALID_TRANSFER_STATE]"]
        distinguishing_aspect: "SETTLED is terminal: a seller attempting to cancel an already-settled order is rejected with ERR_INVALID_TRANSFER_STATE and no reservation/credit movement occurs."
        test_recipe:
          setup: ["Seller TS-1 (allocation 100.000), buyer TB-1 (50.000); transfer qty 5.000 window [2026-08-01, 2026-10-01) fully SETTLED under default NORMAL condition"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller TS-1", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_ts: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer TB-1", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_tb: $.data.id }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_ts}", buyer_account_id: "${acct_tb}", quantity_af: 5.000, unit_price_cents: 9000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_ts}"
              captures: { tr_ts: $.data.id }
            - call: "POST /transfer-orders/${tr_ts}/accept"
              as: WellOwner
              as_user_id: "${acct_tb}"
            - call: "POST /transfer-orders/${tr_ts}/settle"
              as: WaterMaster
          trigger:
            - call: "POST /transfer-orders/${tr_ts}/cancel"
              as: WellOwner
              as_user_id: "${acct_ts}"
              captures: { err: $.data.error_id }
            - call: "GET /water-user-accounts/${acct_tb}"
              as: WaterMaster
              captures: { tb_credit: $.data.credit_balance_af }
          assert:
            - "captured ${err} == ERR_INVALID_TRANSFER_STATE"
            - "buyer credit_balance_af == 5.000 (captured ${tb_credit}): settlement effects were not undone"

      - name: publish_already_published_snapshot_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.BasinConditionSnapshot.DRAFT_to_PUBLISHED, "errors[ERR_INVALID_SNAPSHOT_STATE]"]
        distinguishing_aspect: "PUBLISHED is terminal: publishing the same snapshot twice fails the second time with ERR_INVALID_SNAPSHOT_STATE."
        test_recipe:
          setup: ["No monitoring data needed; snapshot with empty input set (condition NORMAL) created and published"]
          setup_api_calls:
            - call: "POST /basin-condition-snapshots"
              as: WaterMaster
              captures: { snap_pp: $.data.id }
            - call: "POST /basin-condition-snapshots/${snap_pp}/publish"
              as: WaterMaster
          trigger:
            - call: "POST /basin-condition-snapshots/${snap_pp}/publish"
              as: WaterMaster
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_INVALID_SNAPSHOT_STATE"

      - name: acknowledge_acknowledged_annual_report_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.AnnualStateReport.SUBMITTED_to_ACKNOWLEDGED, "errors[ERR_INVALID_ANNUAL_REPORT_STATE]"]
        distinguishing_aspect: "ACKNOWLEDGED is terminal: a second acknowledge is rejected with ERR_INVALID_ANNUAL_REPORT_STATE."
        test_recipe:
          setup: ["Water year 2026 closed (no accounts exist; close is a no-op); annual report for 2026 generated, submitted, acknowledged"]
          setup_api_calls:
            - call: "POST /admin/close-water-year"
              payload: { water_year: 2026 }
              as: WaterMaster
            - call: "POST /annual-state-reports"
              payload: { water_year: 2026 }
              as: WaterMaster
              captures: { ann_1: $.data.id }
            - call: "POST /annual-state-reports/${ann_1}/submit"
              as: WaterMaster
            - call: "POST /annual-state-reports/${ann_1}/acknowledge"
              as: StateRegulator
          trigger:
            - call: "POST /annual-state-reports/${ann_1}/acknowledge"
              as: StateRegulator
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_INVALID_ANNUAL_REPORT_STATE"

      - name: penalty_creation_records_assessor_and_debits_balance
        claim_type: initial_state
        grounds: [entities.PenaltyAssessment.fields.assessed_by, entities.PenaltyAssessment.fields.status, calculations.overdraft_penalty_cents]
        distinguishing_aspect: "A new PenaltyAssessment starts ASSESSED, stamps assessed_by from the EnforcementOfficer's X-User-ID, applies the flat LATE_REPORT fee of 10000 cents, and immediately debits the account ledger."
        test_recipe:
          setup: ["Account PA-1 (ACTIVE) exists"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper PA-1", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_pa: $.data.id }
          trigger:
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_pa}", reason: "LATE_REPORT", water_year: 2026 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { pa_id: $.data.id, pa_status: $.data.status, pa_by: $.data.assessed_by, pa_amt: $.data.amount_cents }
            - call: "GET /water-user-accounts/${acct_pa}"
              as: WaterMaster
              captures: { bal: $.data.penalty_balance_cents }
          assert:
            - "status == ASSESSED (captured ${pa_status}); assessed_by == eo-1 (captured ${pa_by}); amount_cents == 10000 (captured ${pa_amt})"
            - "account.penalty_balance_cents == 10000 (captured ${bal})"

      - name: snapshot_creation_supersedes_existing_draft
        claim_type: side_effect_execution
        grounds: [state_machines.BasinConditionSnapshot.DRAFT_to_DISCARDED]
        distinguishing_aspect: "Creating a new snapshot auto-DISCARDs the previous DRAFT (supersede): after two creates, the first snapshot is DISCARDED and only the second remains DRAFT; list order is created_at ASC with request-arrival tie-break."
        test_recipe:
          setup: ["Empty DB (no readings: both snapshots compute the empty-set fallback condition NORMAL)"]
          setup_api_calls: []
          trigger:
            - call: "POST /basin-condition-snapshots"
              as: WaterMaster
              captures: { snap_1: $.data.id }
            - call: "POST /basin-condition-snapshots"
              as: WaterMaster
              captures: { snap_2: $.data.id }
            - call: "GET /basin-condition-snapshots"
              as: WaterMaster
              captures: { first_id: "$.data[0].id", first_status: "$.data[0].status", second_id: "$.data[1].id", second_status: "$.data[1].status" }
          assert:
            - "First-created snapshot ${snap_1} appears first in the list (captured ${first_id}) with status DISCARDED (captured ${first_status})"
            - "Second snapshot ${snap_2} (captured ${second_id}) remains DRAFT (captured ${second_status})"
            - "Both snapshots computed the empty-input-set fallback: condition == NORMAL with breach_pct null"

      - name: suspended_account_cannot_register_well
        claim_type: guarded_transition
        grounds: ["validations[priority=6]", state_machines.WaterUserAccount.ACTIVE_to_SUSPENDED, entities.Well.fields.account_id]
        distinguishing_aspect: "Cross-entity gate (Well -> WaterUserAccount pair): once the account is SUSPENDED via OCC-guarded PATCH, well registration is rejected with ERR_ACCOUNT_NOT_ACTIVE."
        test_recipe:
          setup: ["Account WS created (ACTIVE, version 1)"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper WS", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_ws: $.data.id, ws_v: $.data.version }
          trigger:
            - call: "PATCH /water-user-accounts/${acct_ws}"
              payload: { status: "SUSPENDED", expected_account_version: "${ws_v}" }
              as: WaterMaster
              captures: { ws_status: $.data.status }
            - call: "POST /wells"
              payload: { account_id: "${acct_ws}", well_type: "PRODUCTION", location_description: "Parcel WS" }
              as: WellOwner
              as_user_id: "${acct_ws}"
              captures: { err: $.data.error_id }
          assert:
            - "PATCH succeeded: status == SUSPENDED (captured ${ws_status})"
            - "captured ${err} == ERR_ACCOUNT_NOT_ACTIVE: the Well write is gated by the WaterUserAccount's state"

      - name: appeal_paid_assessment_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PenaltyAssessment.ASSESSED_to_APPEALED, "errors[ERR_INVALID_ASSESSMENT_STATE]"]
        distinguishing_aspect: "Appeal is allowed only from ASSESSED: an assessment already PAID rejects the appeal with ERR_INVALID_ASSESSMENT_STATE."
        test_recipe:
          setup: ["Account PP-1 (ACTIVE) with a LATE_REPORT assessment (10000 cents) already PAID"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper PP-1", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_pp: $.data.id }
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_pp}", reason: "LATE_REPORT", water_year: 2026 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { pa_pp: $.data.id }
            - call: "POST /penalty-assessments/${pa_pp}/pay"
              as: WellOwner
              as_user_id: "${acct_pp}"
          trigger:
            - call: "POST /penalty-assessments/${pa_pp}/appeal"
              payload: { grounds: "too late" }
              as: WellOwner
              as_user_id: "${acct_pp}"
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_INVALID_ASSESSMENT_STATE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: late_flag_boundary_day_15_vs_day_16
        claim_type: boundary_edge
        grounds: [calculations.report_late_flag, entities.ExtractionReport.fields.late_flag]
        distinguishing_aspect: "The reporting deadline is inclusive through the 15th: a June report submitted 2026-07-10 has late_flag false; the same report submitted once the clock is 2026-08-01 (past 2026-07-16T00:00:00Z) has late_flag true."
        test_recipe:
          setup:
            - "Clock set to 2026-07-10T12:00:00Z before any writes"
            - "Account WL (ACTIVE; current_water_year 2026) with two ACTIVE PRODUCTION wells WL-1 and WL-2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T12:00:00Z" }
              as: WaterMaster
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper WL", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_wl: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_wl}", well_type: "PRODUCTION", location_description: "WL-1" }
              as: WellOwner
              as_user_id: "${acct_wl}"
              captures: { well_wl1: $.data.id }
            - call: "POST /wells/${well_wl1}/install-meter"
              payload: { meter_serial: "M-WL1" }
              as: WellOwner
              as_user_id: "${acct_wl}"
            - call: "POST /wells/${well_wl1}/activate"
              as: WaterMaster
            - call: "POST /wells"
              payload: { account_id: "${acct_wl}", well_type: "PRODUCTION", location_description: "WL-2" }
              as: WellOwner
              as_user_id: "${acct_wl}"
              captures: { well_wl2: $.data.id }
            - call: "POST /wells/${well_wl2}/install-meter"
              payload: { meter_serial: "M-WL2" }
              as: WellOwner
              as_user_id: "${acct_wl}"
            - call: "POST /wells/${well_wl2}/activate"
              as: WaterMaster
          trigger:
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_wl1}", water_year: 2026, month: 6, reported_af: 5.000 }
              as: WellOwner
              as_user_id: "${acct_wl}"
              captures: { late_early: $.data.late_flag }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_wl2}", water_year: 2026, month: 6, reported_af: 5.000 }
              as: WellOwner
              as_user_id: "${acct_wl}"
              captures: { late_late: $.data.late_flag }
          assert:
            - "Report filed 2026-07-10 for June: late_flag == false (captured ${late_early}) — before the 2026-07-16T00:00:00Z boundary"
            - "Report filed 2026-08-01 for June: late_flag == true (captured ${late_late})"

      - name: carryover_credit_applies_cap_at_year_close
        claim_type: constants_applied
        grounds: [calculations.carryover_credit_af, "endpoints[POST /admin/close-water-year]"]
        distinguishing_aspect: "Year-end carryover is min(unused, 0.25 * base_allocation): allocation 100.000 with 30.000 verified extraction leaves unused 70.000, but the cap binds and exactly 25.000 af is credited; the extraction counter resets and the water year advances."
        test_recipe:
          setup: ["Account WY (ACTIVE, allocation 100.000) with ACTIVE PRODUCTION well; report (2026, month 6, 30.000 af) VERIFIED"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper WY", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_wy: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_wy}", well_type: "PRODUCTION", location_description: "Parcel WY" }
              as: WellOwner
              as_user_id: "${acct_wy}"
              captures: { well_wy: $.data.id }
            - call: "POST /wells/${well_wy}/install-meter"
              payload: { meter_serial: "M-WY1" }
              as: WellOwner
              as_user_id: "${acct_wy}"
            - call: "POST /wells/${well_wy}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_wy}", water_year: 2026, month: 6, reported_af: 30.000 }
              as: WellOwner
              as_user_id: "${acct_wy}"
              captures: { rep_wy: $.data.id }
            - call: "POST /extraction-reports/${rep_wy}/verify"
              as: WaterMaster
          trigger:
            - call: "POST /admin/close-water-year"
              payload: { water_year: 2026 }
              as: WaterMaster
              captures: { closed_year: $.data.closed_water_year, rolled: $.data.accounts_rolled, carry_total: $.data.total_carryover_af }
            - call: "GET /water-user-accounts/${acct_wy}"
              as: WaterMaster
              captures: { wy_credit: $.data.credit_balance_af, wy_ext: $.data.extracted_af_ytd, wy_cwy: $.data.current_water_year }
          assert:
            - "close response: closed_water_year == 2026, accounts_rolled == 1, total_carryover_af == 25.000 (captured ${closed_year}, ${rolled}, ${carry_total})"
            - "account.credit_balance_af == 25.000 (captured ${wy_credit}): min(70.000, 0.25 * 100.000) — the cap, not the unused volume"
            - "extracted_af_ytd == 0.000 and current_water_year == 2027 (captured ${wy_ext}, ${wy_cwy})"

      - name: critical_curtailment_reduces_effective_allocation
        claim_type: boundary_edge
        grounds: [calculations.effective_allocation_af, "validations[priority=26]"]
        distinguishing_aspect: "Under a PUBLISHED CRITICAL condition the curtailment factor 0.80 applies: a seller with base allocation 100.000 may propose exactly 80.000 af but an 85.000-af proposal fails with ERR_INSUFFICIENT_AVAILABLE_WATER."
        test_recipe:
          setup:
            - "Agency account AG with 4 ACTIVE MONITORING wells (threshold 100.0), readings 130/125/60/55 on 2026-07-15; snapshot created and PUBLISHED -> CRITICAL"
            - "Seller CS (allocation 100.000, no extraction); buyer CB-1 (allocation 50.000)"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Agency Monitor", account_type: "MUNICIPAL", base_allocation_af: 1000.000 }
              as: WaterMaster
              captures: { acct_ag: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-1", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_1: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-2", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_2: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-3", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_3: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-4", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_4: $.data.id }
            - call: "POST /wells/${mw_1}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_2}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_3}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_4}/activate"
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_1}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 130.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_2}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 125.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_3}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 60.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_4}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 55.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /basin-condition-snapshots"
              as: WaterMaster
              captures: { snap_cc: $.data.id }
            - call: "POST /basin-condition-snapshots/${snap_cc}/publish"
              as: WaterMaster
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller CS", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_cs: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer CB-1", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_cb: $.data.id }
          trigger:
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_cs}", buyer_account_id: "${acct_cb}", quantity_af: 85.000, unit_price_cents: 9000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_cs}"
              captures: { err_over: $.data.error_id }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_cs}", buyer_account_id: "${acct_cb}", quantity_af: 80.000, unit_price_cents: 9000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_cs}"
              captures: { tr_ok: $.data.id, tr_ok_status: $.data.status }
          assert:
            - "85.000-af proposal rejected: captured ${err_over} == ERR_INSUFFICIENT_AVAILABLE_WATER (effective allocation is 100.000 * 0.80 = 80.000)"
            - "80.000-af proposal accepted: captured ${tr_ok_status} == PROPOSED (id ${tr_ok}) — the curtailed quantity exactly equals the cap and >= semantics admit it"

      - name: annual_report_aggregates_from_persisted_records
        claim_type: correct_result
        grounds: [calculations.annual_report_aggregates, entities.AnnualStateReport]
        distinguishing_aspect: "Annual aggregation reads persisted records only: two verified reports (10.000 + 20.000 af under NORMAL -> fees 30000 + 60000), one paid LATE_REPORT penalty (10000), no overdraft assessments, and no published snapshot (final_basin_condition null)."
        test_recipe:
          setup:
            - "Account AR (allocation 100.000) with ACTIVE PRODUCTION well; reports (2026, month 6, 10.000) and (2026, month 7, 20.000) both VERIFIED under default NORMAL condition"
            - "One LATE_REPORT assessment (10000 cents, water_year 2026) created and PAID"
            - "Water year 2026 closed"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper AR", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_ar: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ar}", well_type: "PRODUCTION", location_description: "Parcel AR" }
              as: WellOwner
              as_user_id: "${acct_ar}"
              captures: { well_ar: $.data.id }
            - call: "POST /wells/${well_ar}/install-meter"
              payload: { meter_serial: "M-AR1" }
              as: WellOwner
              as_user_id: "${acct_ar}"
            - call: "POST /wells/${well_ar}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_ar}", water_year: 2026, month: 6, reported_af: 10.000 }
              as: WellOwner
              as_user_id: "${acct_ar}"
              captures: { rep_ar1: $.data.id }
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_ar}", water_year: 2026, month: 7, reported_af: 20.000 }
              as: WellOwner
              as_user_id: "${acct_ar}"
              captures: { rep_ar2: $.data.id }
            - call: "POST /extraction-reports/${rep_ar1}/verify"
              as: WaterMaster
            - call: "POST /extraction-reports/${rep_ar2}/verify"
              as: WaterMaster
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_ar}", reason: "LATE_REPORT", water_year: 2026 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { pa_ar: $.data.id }
            - call: "POST /penalty-assessments/${pa_ar}/pay"
              as: WellOwner
              as_user_id: "${acct_ar}"
            - call: "POST /admin/close-water-year"
              payload: { water_year: 2026 }
              as: WaterMaster
          trigger:
            - call: "POST /annual-state-reports"
              payload: { water_year: 2026 }
              as: WaterMaster
              captures: { an_total: $.data.total_extracted_af, an_reports: $.data.verified_report_count, an_fees: $.data.total_pumping_fees_cents, an_od: $.data.overdraft_assessment_count, an_assessed: $.data.penalties_assessed_cents, an_collected: $.data.penalties_collected_cents, an_cond: $.data.final_basin_condition, an_status: $.data.status }
          assert:
            - "total_extracted_af == 30.000 and verified_report_count == 2 (captured ${an_total}, ${an_reports})"
            - "total_pumping_fees_cents == 90000 (captured ${an_fees}): 10.000*3000 + 20.000*3000 at NORMAL multiplier 1.00"
            - "overdraft_assessment_count == 0; penalties_assessed_cents == 10000; penalties_collected_cents == 10000 (captured ${an_od}, ${an_assessed}, ${an_collected})"
            - "final_basin_condition == null (captured ${an_cond}): no PUBLISHED snapshot exists; status == DRAFT (captured ${an_status})"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_CONTEXT]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID (Anonymous) is rejected with ERR_MISSING_AUTH_CONTEXT before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /water-user-accounts"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_MISSING_AUTH_CONTEXT (http 400)"

      - name: state_regulator_cannot_register_well
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", "roles[StateRegulator]"]
        distinguishing_aspect: "StateRegulator is read-only for writes: POST /wells with the StateRegulator role is rejected with ERR_FORBIDDEN_ROLE even with a well-formed payload."
        test_recipe:
          setup: ["Account SR-1 (ACTIVE) exists"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper SR-1", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_sr: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { account_id: "${acct_sr}", well_type: "PRODUCTION", location_description: "Parcel SR" }
              as: StateRegulator
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_FORBIDDEN_ROLE (http 403)"

      - name: wellowner_cannot_meter_anothers_well
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_OWNERSHIP_MISMATCH]", "roles[WellOwner]"]
        distinguishing_aspect: "Ownership check: the WellOwner role may only act on wells of its own account — user ${acct_ob} installing a meter on ${acct_oa}'s well is rejected with ERR_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["Accounts OA and OB (both ACTIVE); OA owns REGISTERED PRODUCTION well OW"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Owner A", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_oa: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Owner B", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_ob: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_oa}", well_type: "PRODUCTION", location_description: "Parcel OA" }
              as: WellOwner
              as_user_id: "${acct_oa}"
              captures: { well_oa: $.data.id }
          trigger:
            - call: "POST /wells/${well_oa}/install-meter"
              payload: { meter_serial: "M-HACK" }
              as: WellOwner
              as_user_id: "${acct_ob}"
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_OWNERSHIP_MISMATCH (http 403)"

      - name: report_for_wrong_water_year_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_REPORT_YEAR_MISMATCH]"]
        distinguishing_aspect: "Reports are accepted only for the account's current water year (2026 at default clock): water_year 2025 is rejected with ERR_REPORT_YEAR_MISMATCH."
        test_recipe:
          setup: ["Account WZ (ACTIVE, current_water_year 2026) with ACTIVE PRODUCTION well"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper WZ", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_wz: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_wz}", well_type: "PRODUCTION", location_description: "Parcel WZ" }
              as: WellOwner
              as_user_id: "${acct_wz}"
              captures: { well_wz: $.data.id }
            - call: "POST /wells/${well_wz}/install-meter"
              payload: { meter_serial: "M-WZ1" }
              as: WellOwner
              as_user_id: "${acct_wz}"
            - call: "POST /wells/${well_wz}/activate"
              as: WaterMaster
          trigger:
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_wz}", water_year: 2025, month: 6, reported_af: 5.000 }
