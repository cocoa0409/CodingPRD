          - entities.AnnualWorkPlan.fields.assessment_revenue_forecast_cents
        distinguishing_aspect: |
          The canonical plan is built to sit exactly on two ceilings at once: ADMINISTRATION 150000 ==
          15 percent of 1000000 and CONTINGENCY_RESERVE 100000 == 10 percent of 1000000, both of which
          must be accepted because the comparisons are <=. The forecast side aggregates across two
          statements of the FY2027 period only — 824500 + 340000 = 1164500 — giving funding_ratio
          1.1645, and the five per-category rollups must each equal their own line.
        test_recipe:
          setup:
            - "canonical district ACTIVE, st1 filed at 824500 and st2 filed at 340000, the other two statements NOT_FILED at 0"
            - "plan FY2027 in DRAFT with lines SALES_AND_MARKETING 650000, ADMINISTRATION 150000, CONTINGENCY_RESERVE 100000, DESTINATION_EVENTS 100000"
          setup_api_calls:
