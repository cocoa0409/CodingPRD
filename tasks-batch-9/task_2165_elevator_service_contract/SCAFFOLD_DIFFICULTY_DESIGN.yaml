      - name: performance_score_exactly_at_trigger_threshold_blocks_renegotiation
        grounds:
          - calculations.contract_performance_score
          - validations[priority=122]
          - errors[ERR_RENEGOTIATION_NOT_WARRANTED]
          - entities.ServiceContract.fields.performance_score
          - endpoints[POST /elevator-program/renegotiations]
        distinguishing_aspect: |
          METRIC 1 — a numeric threshold crossing on contract_performance_score, reached through
          POST /elevator-program/renegotiations. The score lands on exactly 75.00
          (0.50*100.00 + 0.25*100.00 + 0.25*0.00 - 0.00) and the gate is `score < 75.00` strictly, so
          75.00 is refused; a score of 74.99 or lower would be accepted.
        test_recipe:
          setup:
            - "One ACTIVE contract with one car, no downtime windows and no out-of-service callbacks, so August uptime is exactly 100.00."
            - "Exactly one CLEARED August callback, answered in 30 minutes against a 60-minute SLA, so response_pct is exactly 100.00."
            - "Exactly one August MaintenanceVisit left SCHEDULED and swept to MISSED, so visit_pct is exactly 0.00."
            - "penalty_balance_cents is 0, so the drag term is 0.00."
            - "Logical clock at 2026-09-15T00:00:00Z, making 2026-08 the score month."
