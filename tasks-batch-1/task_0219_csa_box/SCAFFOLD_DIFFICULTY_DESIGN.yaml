  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: season_capacity_strict_less_than_boundary
        grounds:
          - validations[priority=14]
          - state_machines.Subscription.PENDING_PAYMENT_to_CONFIRMED
          - entities.Season.fields.confirmed_share_count
        distinguishing_aspect: |
          Numeric-threshold boundary on confirm: with total_share_capacity 2 and confirmed_share_count 1, a confirm
          SUCCEEDS (1 < 2); the next confirm at confirmed_share_count 2 FAILS (2 < 2 is false) with ERR_SEASON_CAPACITY_FULL.
        test_recipe:
          setup:
            - "OPEN season capacity 2, signup open; two PENDING_PAYMENT subscriptions on distinct members; first confirmed (count 1)"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S11", week_count: 12, first_delivery_date: "2026-07-01T00:00:00Z", signup_close_date: "2026-12-30T00:00:00Z", total_share_capacity: 2 }
              as: FarmManager
