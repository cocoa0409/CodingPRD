            - "${flmkt} == 15000"
            - "${src} == 'STANDARD'"
            - "${aid} == null"

      - name: effective_floor_bundle_exception_applies_only_to_bundle_listings
        claim_type: input_set_filtering
        grounds: ["calculations.effective_map_floor"]
        distinguishing_aspect: "A BUNDLE exception is gated on the caller's is_bundle flag: the same product, channel and instant return STANDARD 15000 with is_bundle false and EXCEPTION 13000 with is_bundle true."
        test_recipe:
          setup: ["APPROVED BUNDLE exception over [2026-08-10, 2026-08-25) scoped ALL at 13000 on SKU-AUDIO-1."]
          setup_api_calls:
