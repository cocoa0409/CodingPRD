              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1_scrap: "$.data.fired_scrap_units" }
            - call: "GET /production-runs/${r1}"
              payload: {}
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { r1_status: "$.data.status", r1_scrap: "$.data.scrap_units" }
          assert:
            - "Overfire branch: ${krh_base} == 38.88 == 0.62 * (1140 - 900) / 10 + 4.0 * 6.0, and ${krh_dev} == 12.00 == |1140 - 1050| / 10 + |6.0 - 3.0|"
            - "${lh_cdi} == 38.88 at centerline position 3, ${lh_grade} == OVERFIRE_SCRAP because 38.88 > 20.00 + 6.00"
            - "${lh_color} == 100.00 - 50.0 + 3.2 * 18.88 = 110.42 clamps to the ceiling"
            - "${lh_status} == SCRAP and ${lh_avail} == 0"
            - "Underfire branch: ${krc_base} == 7.72 == 0.62 * 6 + 4.0 * 1.0, ${krc_dev} == 11.00, ${lc_cdi} == 7.72, ${lc_grade} == UNDERFIRE_SCRAP because 7.72 < 20.00 - 6.00"
            - "${lc_color} == 10.70 == 50.0 + 3.2 * (7.72 - 20.00), which is inside the clamp, and ${lc_status} == SCRAP"
            - "${p1_scrap} == 19200 - both branches accumulated into the same plant counter"
            - "${r1_status} == FIRED with ${r1_scrap} == 9600 - the run still reaches FIRED even though its lot is scrap"

