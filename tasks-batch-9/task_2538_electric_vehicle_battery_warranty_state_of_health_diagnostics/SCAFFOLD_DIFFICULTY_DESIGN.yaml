      - name: settlement_admin_fee_tier_keyed_on_oem_share_not_remedy_cost
        mode: "c - circular-looking dependency with a pinned evaluation order"
        grounds:
          - calculations.claim_settlement
          - calculations.remedy_cost_estimate
          - entities.WarrantyClaim.fields.admin_fee_cents
          - entities.WarrantyClaim.fields.oem_share_cents
          - entities.WarrantyClaim.fields.proration_factor
        distinguishing_aspect: |
          The admin fee looks self-referential - it is tiered on oem_share_cents, which is
          remedy_cost_cents minus owner_share_cents, which is remedy_cost_cents times a factor, and
          remedy_cost_cents itself carries a hazmat line - so a naive implementation tiers on
          remedy_cost_cents 508847 and charges 15000; the pinned order tiers on the POST-proration
          oem_share_cents 237479 and charges 7500, and that fee never re-enters the proration base.
        test_recipe:
          setup:
            - "Same reference price book and the same three faulted modules, so remedy_cost_cents is again exactly 508847."
            - "Vehicle in service 2018-01-15 with an assessed odometer of 108000 -> 102 elapsed months (6 over the 96-month term, 12-month goodwill allowance -> 0.5000) and 8000 miles over the 100000-mile term (15000-mile allowance -> 0.5333); the worse axis wins, so proration_factor = 0.5333."
