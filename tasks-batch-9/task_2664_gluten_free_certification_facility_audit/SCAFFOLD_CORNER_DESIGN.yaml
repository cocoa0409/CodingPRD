          - validations.priority_26
          - errors.ERR_INGREDIENT_NOT_APPROVED
          - state_machines.Product.formula_dimension.transitions.DRAFT_to_CLEARED.preconditions
        distinguishing_aspect: |
          With one line linked the count gate is satisfied and the next gate applies: EVERY
          referenced ingredient must be APPROVED, so a single DRAFT line blocks the clearance.
          This is the cross-entity validation pattern - the product is legal, the ingredient is
          not - and it must be reported as ERR_INGREDIENT_NOT_APPROVED, not as an ingredient
          state error.
        test_recipe:
          setup:
            - "One applicant, one facility, one supplier and one DRAFT INHERENTLY_GF ingredient that was never submitted."
