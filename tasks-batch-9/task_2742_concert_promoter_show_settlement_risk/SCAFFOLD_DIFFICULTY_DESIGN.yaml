          held fixed at 200000 across two shows, the BINDING LEG SWITCHES purely because the base
          changed — base 1000010 gives cap 50001 < share 100000 (cap binds) while base 5000000
          gives cap 250000 > share 100000 (share binds). This is an evaluation-order/circularity
