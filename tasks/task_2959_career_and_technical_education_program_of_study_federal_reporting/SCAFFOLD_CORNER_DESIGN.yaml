            - "${p1f_st} == DRAFT and ${p1f_rr} == 0"
            - "${pi_f} == MONITORING and ${pi_miss} == 0"
            - "GET /cte/improvement-plans with performance_indicator_id == ${pi_id} reports total_count == 2"

      - name: dependents_read_returns_the_transitive_prerequisite_closure
        claim_type: computed_read
        grounds:
          - endpoints[GET /cte/sequence-courses/{id}/dependents]
          - entities.SequenceCourse.fields.depth_from_root
          - entities.SequenceCourse.fields.prerequisite_course_id
        distinguishing_aspect: |
          The dependents read is the only computed read over the prerequisite graph, and it must return the TRANSITIVE
          closure rather than the direct children: the root course has one direct dependent that itself has a dependent,
          plus a second direct dependent, so the closure is three rows while a direct-children implementation returns two.
          depth_from_root is asserted on all four rows in the same pass, which pins the graph the closure walked.
        test_recipe:
          setup:
            - "One DRAFT ProgramOfStudy with a four-course prerequisite graph: A at position 1 with no prerequisite, B at position 2 whose prerequisite is A, C at position 3 whose prerequisite is B, and E at position 4 whose prerequisite is A."
            - "A, B and E are SECONDARY and C is POSTSECONDARY, so no priority-20 segment clause is engaged."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "48.0508", title: "Welding Technology", cluster: "MANUFACTURING", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "WLD-A", title: "Welding Fundamentals", segment: "SECONDARY", position: 1, credit_hours: 4.00, status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { a_id: $.data.id, a_dep: $.data.depth_from_root }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "WLD-B", title: "Shielded Metal Arc", segment: "SECONDARY", position: 2, credit_hours: 3.00, prerequisite_course_id: "${a_id}", status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { b_id: $.data.id, b_dep: $.data.depth_from_root }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "WLD-C", title: "Dual-Credit Pipe Welding", segment: "POSTSECONDARY", position: 3, credit_hours: 3.00, prerequisite_course_id: "${b_id}", status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { c_id: $.data.id, c_dep: $.data.depth_from_root }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "WLD-E", title: "Blueprint Reading", segment: "SECONDARY", position: 4, credit_hours: 2.00, prerequisite_course_id: "${a_id}", status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { e_id: $.data.id, e_dep: $.data.depth_from_root }
          trigger:
            - call: "GET /cte/sequence-courses/${a_id}/dependents"
              payload: { limit: 10, offset: 0 }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { na: $.meta.total_count, ha: $.meta.has_more }
            - call: "GET /cte/sequence-courses/${b_id}/dependents"
              payload: { limit: 10, offset: 0 }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { nb: $.meta.total_count }
            - call: "GET /cte/sequence-courses/${c_id}/dependents"
              payload: { limit: 10, offset: 0 }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { nc: $.meta.total_count }
            - call: "GET /cte/sequence-courses/${e_id}/dependents"
              payload: { limit: 10, offset: 0 }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { ne: $.meta.total_count }
          assert:
            - "${a_dep} == 0 and ${b_dep} == 1 and ${c_dep} == 2 and ${e_dep} == 1"
            - "${na} == 3 and ${ha} == false"
            - "the dependents payload for ${a_id} contains exactly the ids ${b_id}, ${c_id} and ${e_id}"
            - "${nb} == 1"
            - "${nc} == 0 and ${ne} == 0"
            - "response response_type == array for every one of the four reads"

