  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: review_stale_event_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[event-review-stale-version]
          - errors.ERR_STALE_EVENT_VERSION
        distinguishing_aspect: "OCC on SafetyEvent.version: after a DISMISS advances the version, a REOPEN carrying the pre-dismiss version is rejected 412 ERR_STALE_EVENT_VERSION; carrying the current version succeeds."
        test_recipe:
          setup:
            - "Clock set; base setup; one MEDIUM event IN_REVIEW then DISMISSED."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - *c_drv
            - *c_veh
            - *c_pol
            - *c_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "MEDIUM", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_occ: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_occ}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_occ: $.data.id }
            - call: "POST /api/footage-clips/${cl_occ}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_occ}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_occ}"
              payload: {}
              as: SafetyManager
              captures: { ev_occ_v: $.data.version }
            - call: "POST /api/safety-events/${ev_occ}/review"
              payload: { action: "DISMISS", rationale: "first pass", expected_event_version: "${ev_occ_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { ev_occ_v2: $.data.version }
          trigger:
            - call: "POST /api/safety-events/${ev_occ}/review"
              payload: { action: "REOPEN", rationale: "stale view", expected_event_version: "${ev_occ_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { err_occ: $.data.error_id }
            - call: "POST /api/safety-events/${ev_occ}/review"
              payload: { action: "REOPEN", rationale: "fresh view", expected_event_version: "${ev_occ_v2}" }
              as: SafetyManager
              as_user_id: "sm-1"
          assert:
            - "stale REOPEN: HTTP 412 and err_occ == ERR_STALE_EVENT_VERSION"
            - "SafetyEvent.${ev_occ}.status stays DISMISSED after the 412 and review_count == 1"
            - "fresh REOPEN: HTTP 200, status IN_REVIEW, review_count == 2"

      - name: policy_patch_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[camera-policy-update-stale-version]
          - errors.ERR_STALE_POLICY_VERSION
        distinguishing_aspect: "OCC on CameraPolicy.version: a first patch advances the version; a second patch replaying the original version is rejected 412 ERR_STALE_POLICY_VERSION with no field changes applied."
        test_recipe:
          setup:
            - "Clock set; fleet exists; one DRAFT policy at version 1."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - call: "POST /api/camera-policies"
              payload: { fleet_id: "${fleet_id}", name: "Draft Policy", retention_days_standard: 30, retention_days_collision: 180, daily_upload_cap_mb: 100, inward_capture_enabled: true, distraction_detection_enabled: true, seatbelt_detection_enabled: true, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_occ: $.data.id, pol_occ_v: $.data.version }
          trigger:
            - call: "PATCH /api/camera-policies/${pol_occ}"
              payload: { expected_policy_version: "${pol_occ_v}", daily_upload_cap_mb: 150 }
              as: PlatformAdmin
              captures: { pol_occ_v2: $.data.version }
            - call: "PATCH /api/camera-policies/${pol_occ}"
              payload: { expected_policy_version: "${pol_occ_v}", daily_upload_cap_mb: 999 }
              as: PlatformAdmin
              captures: { err_pocc: $.data.error_id }
          assert:
            - "first patch: HTTP 200 and pol_occ_v2 == pol_occ_v + 1"
            - "second patch: HTTP 412 and err_pocc == ERR_STALE_POLICY_VERSION"
            - "CameraPolicy.${pol_occ}.daily_upload_cap_mb == 150 (stale patch applied nothing)"

      - name: confirm_cascade_chain_claim
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SafetyEvent.IN_REVIEW_to_CONFIRMED
        excluded_because:
