        excluded_because:
          difficulty_instance: boundary_precision_check / confidence_score_auto_accept_threshold_cap_and_rounding_edges
          rationale: "The named §1.8 instance walks the 0.72 threshold, the 0.10 on-file cap and the 4-decimal round_half_up edge in one recipe."

