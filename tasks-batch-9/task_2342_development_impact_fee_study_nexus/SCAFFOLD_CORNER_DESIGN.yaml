          Two allocated components of the same study each get their own SINGLE_FAMILY line,
          which is legal because uniqueness is per component rather than per study. The
          sub-resource read must return only the addressed component's line with the fee
          derived from THAT component's adopted cost: 254168 under PARKS (101667 * 2.5000)
          and 249669 under ROADS (247197 * 1.0100 = 249668.97), so an implementation that
          joins on the study returns two rows and fails.
