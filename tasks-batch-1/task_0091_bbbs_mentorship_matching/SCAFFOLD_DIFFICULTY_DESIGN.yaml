            - call: "POST /matches/${m_id}/meetings"
              payload: { scheduled_start: "2026-01-02T10:00:00Z", scheduled_end: "2026-01-02T11:00:00Z", location: "X" }
              as: MatchSpecialist
              captures: { mtg_id: $.data.id }
