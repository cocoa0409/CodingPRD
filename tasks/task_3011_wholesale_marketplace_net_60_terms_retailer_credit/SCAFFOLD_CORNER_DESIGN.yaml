            - "Order.${o_id}.status remains PLACED"
      - name: unauthenticated_and_risk_analyst_denied
        claim_type: role_denial
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Missing role header yields ERR_UNAUTHENTICATED (401) on any endpoint; RiskAnalyst calling the PlatformAdmin-exclusive verify endpoint yields ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["one registered PENDING retailer"]
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Auth Retail", store_type: "ONLINE", address: "24 Auth Ave", lat: 52.5, lng: -112.5, storefront_proof_url: "https://proof/a1", resale_certificate_no: "RC-A1" }
              as: Anonymous
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "RiskAnalyst verify attempt rejected with error_id == ERR_UNAUTHORIZED (HTTP 403)"
            - "a request with no X-User-Role header is rejected with error_id == ERR_UNAUTHENTICATED (HTTP 401) before any role check"

