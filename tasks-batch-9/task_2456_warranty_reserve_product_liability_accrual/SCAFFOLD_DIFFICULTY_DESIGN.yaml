              as: WarrantyAnalyst
              captures: { fam_c_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_c_id}", vintage_code: "C-MY2024", units_shipped: 3000, ship_period_code: "2024-Q1", warranty_expiry_date: "2028-12-31" }
              as: WarrantyAnalyst
