            - "After submit of ${rel_two}: Subscription.${sub_id}.releases_used == 2"
            - "After withdraw of ${rel_two}: Subscription.${sub_id}.releases_used == 1"
            - "Release.${rel_two}.status == DRAFT"
            - "Release.${rel_two}.submitted_at == null"
            - "Release.${rel_one}.status == SUBMITTED"
            - "GET /api/releases?artist_id=${artist_id}&status=SUBMITTED returns exactly 1 row"

