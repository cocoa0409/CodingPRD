        test_recipe:
          setup: ["BASE + FY2027 APPROVED plan with PLAN10; project X APPROVED 30,000,000 months 1-12 (2,500,000/mo <= 3,000,000 cap); project E PROPOSED is_emergency, 10,000,000 months 1-6"]
