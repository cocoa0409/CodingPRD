          - state_machines.Loan.payment_status.transitions.DELINQUENT_to_DEFAULT
        excluded_because:
          difficulty_instance: transitive_cascade / default_declaration_cascades_loan_to_sponsor_to_apps_to_scope_lines
          rationale: "The four-level cascade (Loan -> Borrower -> sibling LoanApplications -> their RehabLineItems) is the entire assertion set of the named §1.8 instance, including the untouched-terminal-child arm."
      - name: all_lines_fully_released_bubbles_the_loan_to_complete
        claim_type: bubble_up
        grounds:
          - state_machines.Loan.construction_status.transitions.IN_PROGRESS_to_COMPLETE
        excluded_because:
          difficulty_instance: transitive_cascade / fund_cascade_allocation_to_line_completion_to_construction_complete
          rationale: "The named §1.8 instance funds the last outstanding allocation and asserts DrawLineItem -> RehabLineItem FULLY_RELEASED -> Loan.construction_status COMPLETE end to end."
      - name: superseding_an_approved_draw_reverses_the_reservation
        claim_type: compensation
        grounds:
          - state_machines.DrawRequest.transitions.APPROVED_to_SUPERSEDED
        excluded_because:
          difficulty_instance: compensating_invariant / superseding_an_approved_draw_unreserves_the_holdback_exactly
          rationale: "The named §1.8 instance asserts reserved_release_cents returning to undisbursed_holdback_cents to the cent with commitment_balance_check_cents == 0 and every DrawLineItem.approved_amount_cents cleared to null."
      - name: the_loans_three_axes_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.Loan.payment_status
          - state_machines.Loan.construction_status
          - state_machines.Loan.exit_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / loan_three_parallel_axes_advance_independently
          rationale: "The named §1.8 instance drives payment_status, construction_status and exit_status along different paths on one loan and asserts the combined triple after each write."
      - name: closing_onto_a_property_that_is_no_longer_under_contract
        claim_type: guarded_transitions
        grounds:
          - state_machines.Property.transitions.UNDER_CONTRACT_to_BORROWER_OWNED
          - errors[ERR_PROPERTY_STATE_INVALID]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / second_close_on_the_same_property_is_gated_by_the_property_state
          rationale: "The named §1.8 instance closes a second application onto an already BORROWER_OWNED property and asserts ERR_PROPERTY_STATE_INVALID with no second Loan row."
      - name: draw_review_reads_the_contractors_payable_flag
        claim_type: cross_entity
        grounds:
          - state_machines.DrawRequest.transitions.INSPECTED_to_APPROVED
          - errors[ERR_CONTRACTOR_NOT_PAYABLE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / draw_review_reads_contractor_payable_derived_from_the_clock_per_allocation
          rationale: "The named §1.8 instance advances the clock past one contractor's license expiry and asserts that the same review call flips from success to ERR_CONTRACTOR_NOT_PAYABLE per allocation."
      - name: closing_fires_all_four_declared_side_effects_and_nothing_more
        claim_type: side_effect_execution
        grounds:
          - state_machines.LoanApplication
          - endpoints[POST /lending/applications/{id}/close]
          - entities.Loan
          - entities.LedgerEntry
          - entities.Property
        distinguishing_aspect: "The single APPROVED -> CLOSED transition lists four side effects and each one is observable in the same call: the Loan is created at the decision commitment, the three money buckets are seeded from the alloc_* fields, exactly one INITIAL_FUNDING ledger entry equal to alloc_initial_funding_cents is written (not one entry per bucket), and the Property is cascaded to BORROWER_OWNED - while nothing outside that list fires, so there is no RESERVE_SWEEP entry and no InterestAccrualPeriod row."
