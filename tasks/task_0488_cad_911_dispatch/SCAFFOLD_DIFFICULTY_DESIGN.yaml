              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125550140", ali_grid_x: 55, ali_grid_y: 55, incident_type: "ASSAULT_IN_PROGRESS" }
              as: Calltaker
              captures: { incA_id: $.data.id, incA_v: $.data.version }
            - call: "POST /incidents/${incA_id}/assignments"
              payload: { expected_incident_version: "${incA_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { asgA_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125550141", ali_grid_x: 56, ali_grid_y: 55, incident_type: "ASSAULT_IN_PROGRESS" }
              as: Calltaker
              captures: { incB_id: $.data.id, incB_v: $.data.version }
          trigger:
            - call: "POST /incidents/${incB_id}/assignments"
              payload: { expected_incident_version: "${incB_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNIT_NOT_AVAILABLE"
            - "HTTP status == 409"

      - name: incident_unit_duplicate_assignment_no_self_overlap
        grounds:
          - validations[priority=12]
          - entities.Assignment.fields.incident_id
          - entities.Assignment.fields.unit_id
          - errors[ERR_DUPLICATE_ASSIGNMENT]
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (the Incident<->Unit assignment slot):
          the same Unit may not occupy two non-CANCELLED assignment slots on the SAME incident — a
          re-dispatch of an already-cleared-then-cancelled distinction; here a CLEARED assignment frees
          the unit but a still-open assignment on the same incident blocks re-dispatch with ERR_DUPLICATE_ASSIGNMENT.
        test_recipe:
          setup:
            - "POLICE agency, one PATROL unit; ASSAULT incident; unit dispatched then CLEARED (assignment CLEARED, unit AVAILABLE again, still on same incident)."
          setup_api_calls:
