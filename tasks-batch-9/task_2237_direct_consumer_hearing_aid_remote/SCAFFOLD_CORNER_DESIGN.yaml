            - "data.approved_by_user_id == \"co-2\""
            - "data.decided_at == \"2026-08-03T10:05:00Z\""
            - "GET /patients/${pat_ov} returns data.status == \"SCREENING_IN_PROGRESS\", data.open_mandatory_flag_count == 0, data.advisory_weight_total == 0.0"
            - "GET /screening-sessions/${scr_ov} returns data.status == \"INVALIDATED\" and data.invalidated_reason == \"PROVIDER_OVERRIDE\""
            - "GET /patients/${pat_ov}/screening-sessions?status=DRAFT returns total_count == 1 and data[0].attempt_ordinal == 2"

