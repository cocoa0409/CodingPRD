              as_user_id: "u_strategist_1"
              captures: { plan_status: $.data.status, ramp_status: $.data.ramp_status, new_branch_id: $.data.opened_branch_id }
            - call: "GET /distribution/branches/${new_branch_id}"
              payload: {}
