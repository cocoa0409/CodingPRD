# §1.9 Scaffold Corner Design — breadth probe over §1.1–§1.7 of SCAFFOLD.yaml.
# Taxonomy is fixed by references/claim-extraction-guide.md: the nine sections below
# and their claim_type rows. Instances already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry an `excluded_because:` stub and no test_recipe.
scaffold_corner_design:

  - section: entities
    instances:

      - name: entity_clinician_create_returns_full_row_with_zeroed_workload_ledger
        claim_type: creation
        grounds:
          - entities.Clinician
          - endpoints[POST /cds/clinicians]
          - response_envelope
        distinguishing_aspect: "A create with every declared input field returns 201 and a Clinician whose computed workload ledger is zeroed (assigned 0, remaining == capacity 600, open 0) and whose version is 1."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: POST /cds/clinicians
              payload: { full_name: "Ada Sponsor MD", npi: "1000000001", specialty: "CARDIOLOGY", credential: "MD", authorized_roles: ["ClinicalSponsor", "PeerReviewer"], employment_status: "ACTIVE", review_workload_capacity_minutes: 600 }
              as: SystemAdmin
              captures: { c_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Clinician.full_name == \"Ada Sponsor MD\" and Clinician.npi == \"1000000001\""
            - "Clinician.specialty == CARDIOLOGY and Clinician.credential == MD"
            - "Clinician.authorized_roles == [\"ClinicalSponsor\", \"PeerReviewer\"]"
            - "Clinician.review_workload_capacity_minutes == 600"
            - "Clinician.review_workload_assigned_minutes == 0"
            - "Clinician.review_workload_remaining_minutes == 600"
            - "Clinician.open_assignment_count == 0"
            - "Clinician.version == 1 and Clinician.created_at == \"2026-08-01T00:00:00Z\""

      - name: entity_clinician_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /cds/clinicians/{id}]
          - entities.Clinician
        distinguishing_aspect: "GET /cds/clinicians/{id} echoes exactly the row created by the prior POST — same id, same npi, same zeroed ledger — with no field drift."
        test_recipe:
          setup:
            - "One Clinician registered with capacity 480 (the declared default)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Rex Reviewer DO", npi: "1000000004", specialty: "EMERGENCY", credential: "DO", authorized_roles: ["PeerReviewer"] }
              as: SystemAdmin
              captures: { rev_id: $.data.id }
          trigger:
            - call: GET /cds/clinicians/${rev_id}
              payload: {}
              as: SystemAdmin
          assert:
            - "HTTP 200"
            - "Clinician.id == ${rev_id}"
            - "Clinician.npi == \"1000000004\" and Clinician.specialty == EMERGENCY"
            - "Clinician.review_workload_capacity_minutes == 480 and Clinician.review_workload_remaining_minutes == 480"
            - "Clinician.version == 1"

      - name: entity_content_request_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /cds/content-requests]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three requests stored and limit 2 / offset 0, the envelope reports total_count 3, has_more true, limit 2, offset 0 and returns exactly 2 rows; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One sponsor and three ContentRequest rows, all in INTAKE_SUBMITTED."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Ada Sponsor MD", npi: "1000000001", specialty: "CARDIOLOGY", credential: "MD", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: POST /cds/content-requests
              payload: { title: "Sepsis bundle order set", request_type: "ORDER_SET", clinical_domain: "INTERNAL_MEDICINE", urgency: "ROUTINE", evidence_grade: "B", clinical_sponsor_id: "${sponsor_id}", evidence_citations: [{ citation: "Surviving Sepsis 2021", doi: "10.1097/CCM.0000000000005337", peer_reviewed: true, publication_year: 2021 }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
            - call: POST /cds/content-requests
              payload: { title: "Anticoagulation dosing alert", request_type: "ALERT", clinical_domain: "CARDIOLOGY", urgency: "EXPEDITED", evidence_grade: "A", clinical_sponsor_id: "${sponsor_id}", evidence_citations: [{ citation: "CHEST 2020 anticoagulation", doi: "10.1016/j.chest.2020.01.001", peer_reviewed: true, publication_year: 2020 }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
            - call: POST /cds/content-requests
              payload: { title: "Pediatric fluid order set", request_type: "BOTH", clinical_domain: "PEDIATRICS", urgency: "ROUTINE", evidence_grade: "C", clinical_sponsor_id: "${sponsor_id}", evidence_citations: [{ citation: "Local pediatric protocol", doi: null, peer_reviewed: false, publication_year: 2025 }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
          trigger:
            - call: GET /cds/content-requests?limit=2&offset=0
              payload: {}
              as: SystemAdmin
              captures:
                first_title: "$.data[0].title"
          assert:
            - "HTTP 200"
            - "envelope total_count == 3, has_more == true, limit == 2, offset == 0"
            - "len(data) == 2"
            - "a follow-up GET /cds/content-requests?limit=2&offset=2 returns len(data) == 1 with total_count == 3 and has_more == false"
            - "a follow-up GET /cds/content-requests?clinical_domain=PEDIATRICS returns total_count == 1"

      - name: entity_order_set_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /cds/order-sets/{id}]
          - errors[ERR_ORDER_SET_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid UUID that matches no OrderSet row returns 404 ERR_ORDER_SET_NOT_FOUND, not 200 with a null body."
        test_recipe:
          setup:
            - "Empty database except the logical clock."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: GET /cds/order-sets/00000000-0000-4000-8000-000000000000
              payload: {}
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_ORDER_SET_NOT_FOUND"

      - name: entity_content_request_missing_evidence_citations_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.ContentRequest.fields.evidence_citations
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "evidence_citations is source input with no default and constraint length >= 1, so omitting it returns 400 ERR_INVALID_REQUEST and persists no ContentRequest."
        test_recipe:
          setup:
            - "One sponsor registered; no content requests yet."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Ada Sponsor MD", npi: "1000000001", specialty: "CARDIOLOGY", credential: "MD", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
          trigger:
            - call: POST /cds/content-requests
              payload: { title: "Sepsis bundle order set", request_type: "ORDER_SET", clinical_domain: "INTERNAL_MEDICINE", urgency: "ROUTINE", evidence_grade: "B", clinical_sponsor_id: "${sponsor_id}" }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "a follow-up GET /cds/content-requests returns total_count == 0"

      - name: entity_clinician_create_omitting_optional_fields_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Clinician.fields.employment_status
          - entities.Clinician.fields.review_workload_capacity_minutes
          - entities.Clinician.fields.review_workload_assigned_minutes
        distinguishing_aspect: "Omitting employment_status and review_workload_capacity_minutes yields ACTIVE and 480 respectively, and remaining_minutes is derived as 480 - 0 rather than left null."
        test_recipe:
          setup:
            - "Empty database; clock pinned."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: POST /cds/clinicians
              payload: { full_name: "Dee Default RN", specialty: "NURSING", credential: "RN", authorized_roles: ["PeerReviewer"] }
              as: SystemAdmin
              captures: { c_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Clinician.employment_status == ACTIVE"
            - "Clinician.review_workload_capacity_minutes == 480"
            - "Clinician.review_workload_assigned_minutes == 0 and Clinician.review_workload_remaining_minutes == 480"
            - "Clinician.open_assignment_count == 0"
            - "Clinician.npi == null"

      - name: entity_alert_required_approval_votes_computed_from_severity_tier_at_creation
        claim_type: computed_fields
        grounds:
          - entities.Alert.fields.required_approval_votes
          - calculations.artifact_quorum_evaluation.constants.ALERT_REQUIRED_VOTES
        distinguishing_aspect: "A TIER_1_HARD_STOP alert is created with required_approval_votes == 3 and approval_cast_count == 0; the value is derived from ALERT_REQUIRED_VOTES[severity_tier], never supplied by the caller."
        test_recipe:
          setup:
            - "A ContentRequest in TRIAGE_ACCEPTED with a registered builder."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Ada Sponsor MD", npi: "1000000001", specialty: "CARDIOLOGY", credential: "MD", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Cyd Chair MD", npi: "1000000002", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Bo Builder MD", npi: "1000000003", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["InformaticsBuilder"] }
              as: SystemAdmin
              captures: { builder_id: $.data.id }
            - call: POST /cds/content-requests
              payload: { title: "Potassium hard stop", request_type: "ALERT", clinical_domain: "INTERNAL_MEDICINE", urgency: "SAFETY_URGENT", evidence_grade: "A", clinical_sponsor_id: "${sponsor_id}", patient_safety_flag: true, evidence_citations: [{ citation: "ISMP high alert list 2024", doi: "10.1000/ismp.2024", peer_reviewed: true, publication_year: 2024 }, { citation: "NEJM hyperkalemia 2019", doi: "10.1056/NEJMra1900123", peer_reviewed: true, publication_year: 2019 }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
            - call: POST /cds/content-requests/${cr_id}/triage
              payload: { decision: "ACCEPT", triage_note: "Safety priority" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
          trigger:
            - call: POST /cds/content-requests/${cr_id}/alerts
              payload: { name: "Potassium hard stop", firing_criteria: { trigger_event: "ORDER_ENTRY", expression: "potassium_iv_rate > 10 mEq/hr" }, severity_tier: "TIER_1_HARD_STOP", designed_by_clinician_id: "${builder_id}", override_reason_codes: ["CLINICAL_JUDGMENT", "PATIENT_SPECIFIC_PLAN"], hard_stop_justification: "Fatal arrhythmia risk documented in ISMP list" }
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
              captures: { alert_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Alert.required_approval_votes == 3"
            - "Alert.approval_cast_count == 0"
            - "Alert.review_state == DRAFT and Alert.lifecycle_state == UNPUBLISHED"
            - "Alert.override_reason_required == true"
            - "Alert.lifetime_fire_count == 0 and Alert.windowed_fire_count == 0 and Alert.unwindowed_fire_count == 0"

      - name: entity_content_request_system_fields_are_server_generated_at_intake
        claim_type: system_fields
        grounds:
          - entities.ContentRequest.fields.status
          - entities.ContentRequest.fields.priority_score_basis
          - response_envelope
        distinguishing_aspect: "status INTAKE_SUBMITTED, priority_score_basis INTAKE_PROVISIONAL, return_count 0, version 1 and created_at equal to the pinned clock are all produced by the server; the caller supplies none of them."
        test_recipe:
          setup:
            - "One sponsor; clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Ada Sponsor MD", npi: "1000000001", specialty: "CARDIOLOGY", credential: "MD", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
          trigger:
            - call: POST /cds/content-requests
              payload: { title: "Sepsis bundle order set", request_type: "ORDER_SET", clinical_domain: "INTERNAL_MEDICINE", urgency: "ROUTINE", evidence_grade: "B", clinical_sponsor_id: "${sponsor_id}", evidence_citations: [{ citation: "Surviving Sepsis 2021", doi: "10.1097/CCM.0000000000005337", peer_reviewed: true, publication_year: 2021 }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
          assert:
            - "HTTP 201"
            - "ContentRequest.status == INTAKE_SUBMITTED"
            - "ContentRequest.priority_score_basis == INTAKE_PROVISIONAL"
            - "ContentRequest.priority_score == 30.00"
            - "ContentRequest.peer_reviewed_citation_count == 1"
            - "ContentRequest.return_count == 0 and ContentRequest.triage_note == null"
            - "ContentRequest.version == 1 and ContentRequest.created_at == \"2026-08-01T00:00:00Z\""

      - name: entity_downtime_event_unknown_scope_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.DowntimeEvent.fields.scope
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "scope is constrained to SYSTEM_WIDE / ORDER_SETS_ONLY / ALERTS_ONLY, so the near-miss member ORDER_SETS is rejected with 400 ERR_INVALID_REQUEST and no DowntimeEvent row is created."
        test_recipe:
          setup:
            - "Empty database; clock pinned."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: POST /cds/downtime-events
              payload: { scope: "ORDER_SETS", mode: "READ_ONLY", window_start: "2026-08-10T02:00:00Z", window_end: "2026-08-10T06:00:00Z", planned: true, reason: "EHR upgrade" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: entity_order_set_item_is_immutable_with_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.OrderSetItem
          - endpoints[POST /cds/order-sets/{id}/items]
          - endpoints[GET /cds/order-sets/{id}/items]
        distinguishing_aspect: "OrderSetItem declares common_fields false, so the create response and the list rows carry no version and no updated_at, and §1.5 declares no PATCH/PUT/DELETE for the resource."
        test_recipe:
          setup:
            - "A DRAFT OrderSet built on an accepted request."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Ada Sponsor MD", npi: "1000000001", specialty: "CARDIOLOGY", credential: "MD", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Cyd Chair MD", npi: "1000000002", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Bo Builder MD", npi: "1000000003", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["InformaticsBuilder"] }
              as: SystemAdmin
              captures: { builder_id: $.data.id }
            - call: POST /cds/vendor-releases
              payload: { vendor_name: "Medisafe", release_label: "2026.08", content_domain: "DRUG_INTERACTION", received_at: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              captures: { vr_id: $.data.id }
            - call: POST /cds/content-requests
              payload: { title: "Sepsis bundle order set", request_type: "ORDER_SET", clinical_domain: "INTERNAL_MEDICINE", urgency: "ROUTINE", evidence_grade: "B", clinical_sponsor_id: "${sponsor_id}", evidence_citations: [{ citation: "Surviving Sepsis 2021", doi: "10.1097/CCM.0000000000005337", peer_reviewed: true, publication_year: 2021 }, { citation: "JAMA sepsis bundles 2018", doi: "10.1001/jama.2018.0001", peer_reviewed: true, publication_year: 2018 }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
            - call: POST /cds/content-requests/${cr_id}/triage
              payload: { decision: "ACCEPT", triage_note: "Accepted for build" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { cr_v: $.data.version }
            - call: POST /cds/content-requests/${cr_id}/order-sets
              payload: { expected_content_request_version: "${cr_v}", name: "Sepsis bundle v1", specialty: "INTERNAL_MEDICINE", pinned_vendor_release_id: "${vr_id}", built_by_clinician_id: "${builder_id}" }
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
              captures: { os_id: $.data.id }
          trigger:
            - call: POST /cds/order-sets/${os_id}/items
              payload: { orderable_code: "LAB-LACT", display_name: "Lactate, serum", item_category: "LAB", sequence_index: 1 }
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
              captures: { item_id: $.data.id }
          assert:
            - "HTTP 201"
            - "the OrderSetItem response body contains no version key and no updated_at key"
            - "OrderSetItem.order_set_id == ${os_id} and OrderSetItem.sequence_index == 1"
            - "OrderSetItem.default_selected == false and OrderSetItem.high_alert_medication == false and OrderSetItem.default_dose == null"
            - "GET /cds/order-sets/${os_id}/items returns 1 row and that row likewise carries no version key"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint whose path resolves to an OrderSetItem"

      - name: entity_override_event_is_immutable_and_only_reachable_through_ingest
        claim_type: immutability
        grounds:
          - entities.OverrideEvent
          - endpoints[POST /_events/alert-firings]
          - endpoints[GET /cds/alerts/{id}/override-events]
        distinguishing_aspect: "OverrideEvent declares common_fields false: rows appear only via the firing-ingest endpoint, carry ingest_batch_seq 0..n-1 with no version field, and §1.5 exposes no endpoint that mutates one."
        test_recipe:
          setup:
            - "An ACTIVE TIER_2_INTERRUPTIVE alert with two declared override reason codes."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Ada Sponsor MD", npi: "1000000001", specialty: "CARDIOLOGY", credential: "MD", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Cyd Chair MD", npi: "1000000002", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Bo Builder MD", npi: "1000000003", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["InformaticsBuilder"] }
              as: SystemAdmin
              captures: { builder_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Sam Specialty MD", npi: "1000000005", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["SpecialtyApprover"] }
              as: SystemAdmin
              captures: { spec_id: $.data.id }
            - call: POST /cds/content-requests
              payload: { title: "Lactate follow-up alert", request_type: "ALERT", clinical_domain: "INTERNAL_MEDICINE", urgency: "ROUTINE", evidence_grade: "B", clinical_sponsor_id: "${sponsor_id}", evidence_citations: [{ citation: "Surviving Sepsis 2021", doi: "10.1097/CCM.0000000000005337", peer_reviewed: true, publication_year: 2021 }, { citation: "JAMA sepsis bundles 2018", doi: "10.1001/jama.2018.0001", peer_reviewed: true, publication_year: 2018 }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
            - call: POST /cds/content-requests/${cr_id}/triage
              payload: { decision: "ACCEPT", triage_note: "Accepted for build" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: POST /cds/content-requests/${cr_id}/alerts
              payload: { name: "Repeat lactate reminder", firing_criteria: { trigger_event: "LAB_RESULT", expression: "lactate > 2.0 and no_repeat_in_6h" }, severity_tier: "TIER_2_INTERRUPTIVE", designed_by_clinician_id: "${builder_id}", override_reason_codes: ["CLINICAL_JUDGMENT", "PATIENT_REFUSED"] }
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
              captures: { alert_id: $.data.id }
            - call: POST /cds/review-assignments
              payload: { reviewer_id: "${spec_id}", review_kind: "SPECIALTY_APPROVAL", alert_id: "${alert_id}" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra_id: $.data.id }
            - call: POST /cds/review-assignments/${ra_id}/cast
              payload: { vote: "APPROVE", comment: "Firing logic sound" }
              as: SpecialtyApprover
              as_user_id: "${spec_id}"
            - call: POST /cds/alerts/${alert_id}/activate
              payload: { activation_note: "Go live" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
          trigger:
            - call: POST /_events/alert-firings
              payload: { alert_id: "${alert_id}", fired_at_start: "2026-08-02T00:00:00Z", interval_seconds: 3600, fire_count: 3, override_count: 2, distinct_clinician_count: 2, override_reason_code: "CLINICAL_JUDGMENT" }
              as: SystemAdmin
              captures: { made: $.data.created_event_count }
          assert:
            - "HTTP 201"
            - "created_event_count == 3 and override_event_count == 2 and distinct_clinician_count == 2"
            - "first_fired_at == \"2026-08-02T00:00:00Z\" and last_fired_at == \"2026-08-02T02:00:00Z\""
            - "GET /cds/alerts/${alert_id}/override-events returns 3 rows with ingest_batch_seq 0, 1, 2"
            - "every returned OverrideEvent row carries severity_tier_snapshot TIER_2_INTERRUPTIVE and no version key"
            - "§1.5 declares no endpoint that updates or deletes an OverrideEvent"

