      - { name: court_id, type: string, source: system, description: "FK -> Court.id; booked court" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; booking member" }
      - { name: start_time, type: datetime, source: input, description: "ISO 8601 UTC start of the booked interval" }
      - { name: end_time, type: datetime, source: input, description: "ISO 8601 UTC end of the booked interval (half-open [start, end))" }
      - { name: guest_count, type: integer, source: input, description: "Guests declared at booking", default: 0, constraints: ">= 0" }
      - { name: actual_guest_count, type: integer, source: system, description: "Guests recorded at check-in; null until checked in" }
      - { name: uses_ball_machine, type: boolean, source: input, description: "Whether this reservation uses the court's ball machine", default: false }
      - { name: is_peak, type: boolean, source: computed, description: "True when start_time hour (UTC) is within [PEAK_START_HOUR, PEAK_END_HOUR)" }
      - { name: credits_used, type: integer, source: computed, description: "Court credits consumed by this reservation; 0 when paid by cash" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Charge computed at booking and posted to the member ledger" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Charge recomputed at completion from actuals; null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: BOOKED, constraints: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }

