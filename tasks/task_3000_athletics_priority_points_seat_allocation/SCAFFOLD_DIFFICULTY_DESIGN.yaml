  - rule_id: boundary_precision_check
    instances:
      - name: loyalty_multiplier_at_exactly_five_consecutive_years
        grounds:
          - calculations.priority_point_score
          - calculations.priority_point_score.constants.LOYALTY_STREAK_THRESHOLD
          - calculations.priority_point_score.constants.LOYALTY_MULTIPLIER
          - entities.Donor.fields.consecutive_giving_years
        distinguishing_aspect: |
          Two donors reach an identical 5,000,000-cent cumulative total and an
          identical 62.50 tiered base, but one has a streak of exactly
          LOYALTY_STREAK_THRESHOLD (5) and the other of 4. The comparison is
          `>=`, so the first earns the 1.10 multiplier and one more streak year
          and scores 93.75 while the second scores 82.50: an off-by-one on the
          threshold, or dropping the streak recount at the first gap, moves the
          answer by exactly 11.25.
