# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of every testable claim in
# SCAFFOLD.yaml §1.1-§1.7 not already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Sections and claim_type values follow references/claim-extraction-guide.md.
# Logical clock defaults to 2026-09-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: complainant_creation_system_fields
        claim_type: creation
        grounds: [entities.Complainant]
        distinguishing_aspect: "POST /eeoc/complainants returns 201 with server-minted id (UUID, no prefix), created_at == logical clock, version == 1."
        test_recipe:
          setup: ["empty DB; default clock 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Casey One", email: "c1@x.com" }
              as: IntakeOfficer
              captures: { cmp_1: $.data.id, cmp_1_v: $.data.version, cmp_1_created: $.data.created_at }
          assert:
            - "response code 201; id is a UUID; created_at == 2026-09-01T00:00:00.000Z (logical clock, 3 fractional digits); version == 1"
      - name: employer_band_recomputed_on_patch
        claim_type: computed_fields
        grounds: [entities.Employer.fields.size_band, calculations.employer_size_band_classification]
        distinguishing_aspect: "size_band is computed, never client-set: 90 -> FROM_20_TO_100 at creation; PATCH to 101 -> FROM_101_TO_200; PATCH to 14 -> UNDER_15; each PATCH increments version by exactly 1."
        test_recipe:
          setup: ["one employer at 90 staff"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Band Co", state_code: "FL", employee_count_current: 90 }
              as: IntakeOfficer
              captures: { emp_b2: $.data.id, emp_b2_band: $.data.size_band }
          trigger:
            - call: "PATCH /eeoc/employers/${emp_b2}"
              payload: { employee_count_current: 101 }
              as: IntakeOfficer
              captures: { emp_b2_band2: $.data.size_band, emp_b2_v2: $.data.version }
            - call: "PATCH /eeoc/employers/${emp_b2}"
              payload: { employee_count_current: 14 }
              as: IntakeOfficer
              captures: { emp_b2_band3: $.data.size_band, emp_b2_v3: $.data.version }
          assert:
            - "creation: size_band == FROM_20_TO_100, version == 1"
            - "after PATCH 101: size_band == FROM_101_TO_200, version == 2"
            - "after PATCH 14: size_band == UNDER_15, version == 3"
      - name: deferral_agency_deadline_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.DeferralAgency.fields.filing_deadline_days, "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "filing_deadline_days accepts only 180 or 300; 200 is rejected at the priority-3 schema check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /eeoc/deferral-agencies"
              payload: { state_code: "CA", agency_name: "CA FEPA", filing_deadline_days: 200, work_sharing_policy: "DUAL_FILE_DEFAULT", covers_age: true }
              as: PlatformAdmin
              captures: { err_deadline: $.data.error_id }
          assert:
            - "err_deadline == ERR_VALIDATION_FAILED (400)"
      - name: deferral_agency_duplicate_state_rejected
        claim_type: type_constraints
        grounds: [entities.DeferralAgency.fields.state_code, "errors[ERR_DUPLICATE_AGENCY_STATE]"]
        distinguishing_aspect: "state_code is unique across DeferralAgency; a second CA agency is rejected ERR_DUPLICATE_AGENCY_STATE (409)."
        test_recipe:
          setup: ["CA agency exists"]
          setup_api_calls:
            - call: "POST /eeoc/deferral-agencies"
              payload: { state_code: "CA", agency_name: "CA FEPA", filing_deadline_days: 300, work_sharing_policy: "DUAL_FILE_DEFAULT", covers_age: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /eeoc/deferral-agencies"
              payload: { state_code: "CA", agency_name: "CA Second Agency", filing_deadline_days: 180, work_sharing_policy: "EEOC_RETAINS_ALL", covers_age: false }
              as: PlatformAdmin
              captures: { err_dup_agency: $.data.error_id }
          assert:
            - "err_dup_agency == ERR_DUPLICATE_AGENCY_STATE (409)"
      - name: charge_received_date_stamped_from_clock
        claim_type: system_fields
        grounds: [entities.Charge.fields.received_date]
        distinguishing_aspect: "received_date is stamped from the logical clock at intake, not from any client field: with the clock at 2026-10-15 the charge reports received_date 2026-10-15."
        test_recipe:
          setup: ["employer and complainant exist; clock set to 2026-10-15 before intake"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Stamp Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_st: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Casey Two", email: "c2@x.com" }
              as: IntakeOfficer
              captures: { cmp_2: $.data.id }
            - call: "POST /eeoc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_2}", employer_id: "${emp_st}", basis_codes: ["RACE"], incident_date: "2026-08-01", harm_description: "fired", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_st_received: $.data.received_date }
          assert:
            - "received_date == 2026-10-15 (the logical clock date), charge DOCKETED (deadline 2027-01-28 under STANDARD_180)"
      - name: charge_snapshot_immune_to_employer_patch
        claim_type: computed_fields
        grounds: [entities.Charge.fields.employee_count_at_incident, entities.Charge.fields.covered_bases, calculations.timeliness_deadline_resolution]
        distinguishing_aspect: "jurisdiction uses ONLY the employee_count_at_incident snapshot: PATCHing the employer down to 4 staff afterwards neither re-screens nor un-dockets the charge."
        test_recipe:
          setup: ["charge docketed with snapshot 90 against a 90-staff employer"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Shrink Co", state_code: "FL", employee_count_current: 90 }
              as: IntakeOfficer
              captures: { emp_sh: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Casey Three", email: "c3@x.com" }
              as: IntakeOfficer
              captures: { cmp_3: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_3}", employer_id: "${emp_sh}", basis_codes: ["RACE"], incident_date: "2026-06-01", harm_description: "fired", employee_count_at_incident: 90 }
              as: IntakeOfficer
              captures: { chg_sh: $.data.id, chg_sh_status: $.data.case_status }
          trigger:
            - call: "PATCH /eeoc/employers/${emp_sh}"
              payload: { employee_count_current: 4 }
              as: IntakeOfficer
              captures: { emp_sh_band: $.data.size_band }
            - call: "GET /eeoc/charges/${chg_sh}"
              as: Director
              captures: { chg_sh_status2: $.data.case_status, chg_sh_owner: $.data.investigation_owner }
          assert:
            - "employer size_band now UNDER_15"
            - "charge remains DOCKETED with investigation_owner EEOC and covered_bases [RACE] — the 90-person snapshot governs"
      - name: evidence_request_due_date_computed_30_days
        claim_type: computed_fields
        grounds: [entities.EvidenceRequest.fields.due_date]
        distinguishing_aspect: "due_date == issued_date + EVIDENCE_RESPONSE_WINDOW_DAYS (30): a request issued at the 2026-09-01 default clock is due 2026-10-01."
        test_recipe:
          setup: ["UNDER_INVESTIGATION charge with assigned investigator inv-020"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Due Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_due: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Casey Four", email: "c4@x.com" }
              as: IntakeOfficer
              captures: { cmp_4: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_4}", employer_id: "${emp_due}", basis_codes: ["SEX"], incident_date: "2026-06-01", harm_description: "demoted", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_due: $.data.id }
            - call: "POST /eeoc/charges/${chg_due}/mediation-cases"
              as: IntakeOfficer
              captures: { med_due: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_due}/respond"
              payload: { response: "DECLINED" }
              as: ChargingParty
              as_user_id: "${cmp_4}"
            - call: "GET /eeoc/charges/${chg_due}"
              as: Director
              captures: { inv_due: $.data.investigation_case_id }
            - call: "POST /eeoc/investigation-cases/${inv_due}/assign"
              payload: { investigator_user_id: "inv-020" }
              as: Director
          trigger:
            - call: "POST /eeoc/investigation-cases/${inv_due}/evidence-requests"
              payload: { request_type: "POSITION_STATEMENT" }
              as: Investigator
              as_user_id: "inv-020"
              captures: { erq_due_issued: $.data.issued_date, erq_due_date: $.data.due_date, erq_due_status: $.data.status }
          assert:
            - "issued_date == 2026-09-01 and due_date == 2026-10-01 (exactly +30 days), status == PENDING"
      - name: rts_deadline_computed_90_days
        claim_type: computed_fields
        grounds: [entities.RightToSueNotice.fields.court_filing_deadline]
        excluded_because:
          difficulty_instance: rts_elapsed_179_vs_180
          rationale: "The difficulty recipe asserts court_filing_deadline == 2027-05-29 for issued_date 2027-02-28 (exactly +90 days)."
      - name: mediation_round_number_capped
        claim_type: computed_fields
        grounds: [entities.MediationCase.fields.round_number]
        excluded_because:
          difficulty_instance: charge_mediation_investigation_cycle
          rationale: "The cycle recipe asserts round_number 1 then 2 and the ERR_MEDIATION_ROUND_EXHAUSTED rejection of a third case."
      - name: charge_list_pagination_and_filters
        claim_type: listing
        grounds: ["endpoints: GET /eeoc/charges", response_envelope.pagination_defaults]
        distinguishing_aspect: "default limit is 10 with has_more/offset semantics: 11 docketed charges page as 10 + 1; employer_id filter narrows to that employer's rows only."
        test_recipe:
          setup: ["one employer, one complainant, 11 charges (incidents 2026-06-01 through 2026-06-11, all timely)"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Page Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_pg: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Casey Five", email: "c5@x.com" }
              as: IntakeOfficer
              captures: { cmp_5: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_5}", employer_id: "${emp_pg}", basis_codes: ["RACE"], incident_date: "2026-06-01", harm_description: "c1", employee_count_at_incident: 40 }
              as: IntakeOfficer
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_5}", employer_id: "${emp_pg}", basis_codes: ["RACE"], incident_date: "2026-06-02", harm_description: "c2", employee_count_at_incident: 40 }
              as: IntakeOfficer
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_5}", employer_id: "${emp_pg}", basis_codes: ["RACE"], incident_date: "2026-06-03", harm_description: "c3", employee_count_at_incident: 40 }
              as: IntakeOfficer
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_5}", employer_id: "${emp_pg}", basis_codes: ["RACE"], incident_date: "2026-06-04", harm_description: "c4", employee_count_at_incident: 40 }
              as: IntakeOfficer
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_5}", employer_id: "${emp_pg}", basis_codes: ["RACE"], incident_date: "2026-06-05", harm_description: "c5", employee_count_at_incident: 40 }
              as: IntakeOfficer
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_5}", employer_id: "${emp_pg}", basis_codes: ["RACE"], incident_date: "2026-06-06", harm_description: "c6", employee_count_at_incident: 40 }
              as: IntakeOfficer
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_5}", employer_id: "${emp_pg}", basis_codes: ["RACE"], incident_date: "2026-06-07", harm_description: "c7", employee_count_at_incident: 40 }
              as: IntakeOfficer
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_5}", employer_id: "${emp_pg}", basis_codes: ["RACE"], incident_date: "2026-06-08", harm_description: "c8", employee_count_at_incident: 40 }
              as: IntakeOfficer
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_5}", employer_id: "${emp_pg}", basis_codes: ["RACE"], incident_date: "2026-06-09", harm_description: "c9", employee_count_at_incident: 40 }
              as: IntakeOfficer
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_5}", employer_id: "${emp_pg}", basis_codes: ["RACE"], incident_date: "2026-06-10", harm_description: "c10", employee_count_at_incident: 40 }
              as: IntakeOfficer
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_5}", employer_id: "${emp_pg}", basis_codes: ["RACE"], incident_date: "2026-06-11", harm_description: "c11", employee_count_at_incident: 40 }
              as: IntakeOfficer
          trigger:
            - call: "GET /eeoc/charges"
              as: Director
            - call: "GET /eeoc/charges"
              payload: { offset: 10 }
              as: Director
            - call: "GET /eeoc/charges"
              payload: { employer_id: "${emp_pg}", status: "DOCKETED" }
              as: Director
          assert:
            - "first page: exactly 10 rows, total_count 11, has_more true (default limit 10)"
            - "offset 10 page: exactly 1 row, has_more false"
            - "filtered query returns 11 rows, all with employer_id == ${emp_pg} and case_status DOCKETED"
      - name: disclosure_record_append_only_no_version
        claim_type: immutability
        grounds: [entities.DisclosureRecord]
        distinguishing_aspect: "DisclosureRecord has common_fields false: rows expose id + created_at only (no version, no updated_at) and no update/delete endpoint exists."
        test_recipe:
          setup: ["one DOCKETED charge (hold NONE)"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Audit Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_au: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Casey Six", email: "c6@x.com" }
              as: IntakeOfficer
              captures: { cmp_6: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_6}", employer_id: "${emp_au}", basis_codes: ["RACE"], incident_date: "2026-06-01", harm_description: "fired", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_au: $.data.id }
          trigger:
            - call: "POST /eeoc/charges/${chg_au}/disclosures"
              payload: { legal_basis: "PARTY_CONSENT", target_description: "charging party's attorney" }
              as: Director
              captures: { drec_1: $.data.id }
            - call: "GET /eeoc/charges/${chg_au}/disclosures"
              as: Director
          assert:
            - "disclosure row has id and created_at == 2026-09-01T00:00:00.000Z; response carries no version or updated_at field"
            - "accessor_role == Director, legal_basis == PARTY_CONSENT, disclosed_at == 2026-09-01"
      - name: interview_stamps_logging_investigator
        claim_type: system_fields
        grounds: [entities.WitnessInterview.fields.investigator_user_id]
        distinguishing_aspect: "investigator_user_id is system-stamped from X-User-ID of the acting Investigator and must equal the case assignee."
        test_recipe:
          setup: ["UNDER_INVESTIGATION charge assigned to inv-021"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Wit Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_wi: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Casey Seven", email: "c7@x.com" }
              as: IntakeOfficer
              captures: { cmp_7: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_7}", employer_id: "${emp_wi}", basis_codes: ["RACE"], incident_date: "2026-06-01", harm_description: "fired", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_wi: $.data.id }
            - call: "POST /eeoc/charges/${chg_wi}/mediation-cases"
              as: IntakeOfficer
              captures: { med_wi: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_wi}/respond"
              payload: { response: "DECLINED" }
              as: ChargingParty
              as_user_id: "${cmp_7}"
            - call: "GET /eeoc/charges/${chg_wi}"
              as: Director
              captures: { inv_wi: $.data.investigation_case_id }
            - call: "POST /eeoc/investigation-cases/${inv_wi}/assign"
              payload: { investigator_user_id: "inv-021" }
              as: Director
          trigger:
            - call: "POST /eeoc/investigation-cases/${inv_wi}/interviews"
              payload: { witness_name: "W1", interview_start: "2026-09-05T10:00:00Z", interview_end: "2026-09-05T11:00:00Z", summary: "corroborates" }
              as: Investigator
              as_user_id: "inv-021"
              captures: { int_wi_logger: $.data.investigator_user_id }
          assert:
            - "interview investigator_user_id == inv-021 (stamped from the header)"
            - "interview logging moved the investigation OPEN -> GATHERING"
  - section: state_machines
    instances:
      - name: charge_intake_lands_docketed
        claim_type: initial_state
        grounds: [state_machines.Charge]
        excluded_because:
          difficulty_instance: timeliness_deadline_180_vs_300_deferral
          rationale: "The CA trigger call asserts a fresh charge lands DOCKETED with TIMELY_CONFIRMED — the initial-state claim."
      - name: charge_delegated_to_fepa_exclusive_route
        claim_type: valid_transition
        grounds: [state_machines.Charge, entities.Charge.fields.investigation_owner, entities.DeferralAgency.fields.work_sharing_policy]
        distinguishing_aspect: "FEPA_EXCLUSIVE work-sharing routes the charge to DELEGATED_TO_FEPA at intake: investigation_owner FEPA, dual_filed true, no InvestigationCase is auto-created, and a mediation offer is rejected."
        test_recipe:
          setup: ["NY agency (300 days, FEPA_EXCLUSIVE); NY employer; charge incident 2026-03-04 (timely under 300 days at the 2026-09-01 default clock)"]
          setup_api_calls:
            - call: "POST /eeoc/deferral-agencies"
              payload: { state_code: "NY", agency_name: "NY FEPA", filing_deadline_days: 300, work_sharing_policy: "FEPA_EXCLUSIVE", covers_age: true }
              as: PlatformAdmin
            - call: "POST /eeoc/employers"
              payload: { legal_name: "NY Co", state_code: "NY", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_ny: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Casey Eight", email: "c8@x.com" }
              as: IntakeOfficer
              captures: { cmp_8: $.data.id }
          trigger:
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_8}", employer_id: "${emp_ny}", basis_codes: ["SEX"], incident_date: "2026-03-04", harm_description: "harassment", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_ny: $.data.id, chg_ny_status: $.data.case_status, chg_ny_owner: $.data.investigation_owner, chg_ny_dual: $.data.dual_filed, chg_ny_inv: $.data.investigation_case_id }
            - call: "POST /eeoc/charges/${chg_ny}/mediation-cases"
              as: IntakeOfficer
              captures: { med_ny_error: $.data.error_id }
          assert:
            - "case_status == DELEGATED_TO_FEPA, investigation_owner == FEPA, dual_filed == true"
            - "investigation_case_id is null (EEOC does not investigate FEPA-routed charges)"
            - "mediation offer on a DELEGATED_TO_FEPA charge rejected: med_ny_error == ERR_INVALID_STATE"
      - name: decline_from_docketed_creates_investigation
        claim_type: side_effect_execution
        grounds: [state_machines.Charge.DOCKETED_to_UNDER_INVESTIGATION, state_machines.MediationCase.OFFERED_to_DECLINED]
        distinguishing_aspect: "a single DECLINED response (either party) closes the mediation OFFERED -> DECLINED, moves the charge DOCKETED -> UNDER_INVESTIGATION, and auto-creates an OPEN InvestigationCase with null assignee."
        test_recipe:
          setup: ["DOCKETED charge with an OFFERED mediation case"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Decline Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_dc: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Casey Nine", email: "c9@x.com" }
              as: IntakeOfficer
              captures: { cmp_9: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_9}", employer_id: "${emp_dc}", basis_codes: ["RACE"], incident_date: "2026-06-01", harm_description: "fired", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_dc: $.data.id }
            - call: "POST /eeoc/charges/${chg_dc}/mediation-cases"
              as: IntakeOfficer
              captures: { med_dc: $.data.id }
          trigger:
            - call: "POST /eeoc/mediation-cases/${med_dc}/respond"
              payload: { response: "DECLINED" }
              as: RespondentRep
              as_user_id: "${emp_dc}"
              captures: { med_dc_status: $.data.status, med_dc_resp: $.data.respondent_response }
            - call: "GET /eeoc/charges/${chg_dc}"
              as: Director
              captures: { chg_dc_status: $.data.case_status, inv_dc: $.data.investigation_case_id }
            - call: "GET /eeoc/investigation-cases/${inv_dc}"
              as: Director
              captures: { inv_dc_status: $.data.status, inv_dc_assignee: $.data.assigned_investigator_id }
          assert:
            - "mediation DECLINED with respondent_response == DECLINED and complainant_response still PENDING"
            - "charge case_status == UNDER_INVESTIGATION"
            - "investigation auto-created: status OPEN, assigned_investigator_id null"
      - name: second_response_same_party_rejected
        claim_type: invalid_transition
        grounds: [state_machines.MediationCase]
        distinguishing_aspect: "a party whose response is already recorded cannot respond again — the second respond from the same party fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["OFFERED mediation; charging party has already ACCEPTED"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Twice Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_tw: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Casey Ten", email: "c10@x.com" }
              as: IntakeOfficer
