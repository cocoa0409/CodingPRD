        conserved_quantity: "the sheet's allowance consumption budget lmc_absolute_weight_delta_kg"
        invariant_formula: |
          lmc_absolute_weight_delta_kg == round2(sum of abs(weight_delta_kg)
                                          over LastMinuteChange rows with status == APPLIED)
          # REVERSED rows contribute 0 to BOTH running totals, so the full
          # allowance becomes spendable again:
          remaining_allowance = lmc_allowance_kg - lmc_absolute_weight_delta_kg
        grounds:
          - calculations.calculate_lmc_allowance
          - state_machines.LastMinuteChange.transitions.APPLIED_to_REVERSED
