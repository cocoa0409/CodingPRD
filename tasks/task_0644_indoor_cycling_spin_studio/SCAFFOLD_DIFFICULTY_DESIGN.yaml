# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Indoor Cycling / Spin Studio — grounds resolve into SCAFFOLD.yaml §1.1–§1.7
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: pack_refund_class_pack_unused_value
        grounds:
          - calculations.pack_refund_amount
          - state_machines.CreditPack.ACTIVE_to_REFUNDED
          - entities.CreditPack.fields.remaining_credits
        distinguishing_aspect: "CreditPack refund (CLASS_PACK) is count-based unused_value on the CreditPack domain; the second dual-variant instance scores on a different domain (Member strikes), satisfying §0.5's different-entity-domain clause."
        test_recipe:
          setup:
            - "A studio and a member exist; member buys a 10-credit CLASS_PACK for 10000 cents expiring 2026-12-31, then consumes 3 credits via 3 attended rides; remaining_credits == 7."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
              captures: { bike1_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 2, label: "A2" }
              as: StudioManager
              captures: { bike2_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 3, label: "A3" }
              as: StudioManager
              captures: { bike3_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "m1@x.com", full_name: "Mem One", home_studio_id: "${studio_id}" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${member_id}", kind: "CLASS_PACK", purchased_credits: 10, price_cents: 10000, expires_at: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { pack_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-02T10:00:00Z", end_utc: "2026-06-02T11:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:30:00Z" }
              as: StudioManager
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations/${r1_id}/check-in"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-03T10:00:00Z", end_utc: "2026-06-03T11:00:00Z" }
              as: StudioManager
              captures: { s2_id: $.data.id, s2_v: $.data.version }
            - call: "POST /studios/${studio_id}/sessions/${s2_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s2_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T10:30:00Z" }
              as: StudioManager
            - call: "POST /studios/${studio_id}/sessions/${s2_id}/reservations/${r2_id}/check-in"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-04T10:00:00Z", end_utc: "2026-06-04T11:00:00Z" }
              as: StudioManager
              captures: { s3_id: $.data.id, s3_v: $.data.version }
            - call: "POST /studios/${studio_id}/sessions/${s3_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s3_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T10:30:00Z" }
              as: StudioManager
            - call: "POST /studios/${studio_id}/sessions/${s3_id}/reservations/${r3_id}/check-in"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "GET /credit-packs/${pack_id}"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { pack_v: $.data.version }
          trigger:
            - call: "POST /credit-packs/${pack_id}/refund"
              payload: { expected_pack_version: "${pack_v}" }
              as: StudioManager
              captures: { refunded_pack_v: $.data.version }
          assert:
            - "CreditPack.${pack_id}.status == REFUNDED"
            - "CreditPack.${pack_id}.remaining_credits == 7"
            - "Member.${member_id}.wallet_credit_cents == 7000"

      - name: member_strike_threshold_count
        grounds:
          - calculations.member_active_strike_count
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - entities.PenaltyCharge.fields.counts_as_strike
        distinguishing_aspect: "Strike scoring is a trailing-window COUNT over PenaltyCharge on the Member domain — a different entity domain from the cents-based pack refund, so the two dual-variant calcs operate on different subjects per §0.5."
        test_recipe:
          setup:
            - "A member accrues 3 strike-bearing penalty charges within 30 days; the 3rd suspends the account (>= threshold)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
              captures: { bike1_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "m1@x.com", full_name: "Mem One", home_studio_id: "${studio_id}" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${member_id}", kind: "CLASS_PACK", purchased_credits: 10, price_cents: 10000, expires_at: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { pack_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-05T18:00:00Z", end_utc: "2026-06-05T19:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-06T18:00:00Z", end_utc: "2026-06-06T19:00:00Z" }
              as: StudioManager
              captures: { s2_id: $.data.id, s2_v: $.data.version }
            - call: "POST /studios/${studio_id}/sessions/${s2_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s2_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-07T18:00:00Z", end_utc: "2026-06-07T19:00:00Z" }
              as: StudioManager
              captures: { s3_id: $.data.id, s3_v: $.data.version }
            - call: "POST /studios/${studio_id}/sessions/${s3_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s3_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
              as: StudioManager
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations/${r1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T12:00:00Z" }
              as: StudioManager
            - call: "POST /studios/${studio_id}/sessions/${s2_id}/reservations/${r2_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T12:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studios/${studio_id}/sessions/${s3_id}/reservations/${r3_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
          assert:
            - "Member.${member_id}.active_strike_count == 3"
            - "Member.${member_id}.account_status == SUSPENDED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: retail_total_tier_then_wallet_split
        grounds:
          - calculations.retail_order_total
          - entities.RetailOrder.fields.wallet_applied_cents
          - entities.RetailOrder.fields.card_charged_cents
        distinguishing_aspect: "Mode (a): >=3 inputs (quantity tier, unit price, wallet balance) with non-linear interaction — tier selection branches on quantity then min() clamps the wallet split — distinct from the round-order instance which is mode (b)."
        test_recipe:
          setup:
            - "Product priced 1000 cents, stock 10; member with wallet_credit_cents == 2000 (from a prior penalty waive); order quantity 6 -> 10% tier, pay_from_wallet true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
              captures: { bike1_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "m1@x.com", full_name: "Mem One", home_studio_id: "${studio_id}" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /studios/${studio_id}/products"
              payload: { sku: "BOTTLE", name: "Water Bottle", unit_price_cents: 1000, stock_qty: 10 }
              as: StudioManager
              captures: { product_id: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${member_id}", kind: "CLASS_PACK", purchased_credits: 10, price_cents: 10000, expires_at: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { pack_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-05T18:00:00Z", end_utc: "2026-06-05T19:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
              as: StudioManager
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations/${r1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { late_charge_member: $.data.member_id }
            - call: "GET /penalty-charges"
              payload: { member_id: "${member_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { charge_id: $.data.0.id }
            - call: "POST /penalty-charges/${charge_id}/waive"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /retail-orders"
              payload: { member_id: "${member_id}", studio_id: "${studio_id}", product_id: "${product_id}", quantity: 6, pay_from_wallet: true }
              as: Member
              as_user_id: "${member_id}"
              captures: { order_id: $.data.id }
          assert:
            - "RetailOrder.${order_id}.subtotal_cents == 6000"
            - "RetailOrder.${order_id}.wallet_applied_cents == 2000"
            - "RetailOrder.${order_id}.card_charged_cents == 3400"
            - "Member.${member_id}.wallet_credit_cents == 0"

      - name: pack_refund_round_per_credit_then_multiply
        grounds:
          - calculations.pack_refund_amount
          - entities.CreditPack.fields.price_cents
          - entities.CreditPack.fields.purchased_credits
        distinguishing_aspect: "Mode (b): rounding order is pinned — round per-credit value FIRST (round_half_up(price/purchased)) THEN multiply by remaining; 'sum then round' would give a different cent total, so the order is load-bearing — distinct from mode (a) above."
        test_recipe:
          setup:
            - "CLASS_PACK price 10000 over 3 credits -> per-credit value rounds to 3333; member consumed 1 credit, remaining 2; refund = 3333*2 = 6666 (NOT round(10000*2/3)=6667)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
              captures: { bike1_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "m1@x.com", full_name: "Mem One", home_studio_id: "${studio_id}" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${member_id}", kind: "CLASS_PACK", purchased_credits: 3, price_cents: 10000, expires_at: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { pack_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-02T10:00:00Z", end_utc: "2026-06-02T11:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:30:00Z" }
              as: StudioManager
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations/${r1_id}/check-in"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "GET /credit-packs/${pack_id}"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { pack_v: $.data.version }
          trigger:
            - call: "POST /credit-packs/${pack_id}/refund"
              payload: { expected_pack_version: "${pack_v}" }
              as: StudioManager
          assert:
            - "Member.${member_id}.wallet_credit_cents == 6666"
            - "CreditPack.${pack_id}.remaining_credits == 2"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_parallel_attendance_and_billing_dims
        grounds:
          - state_machines.Reservation.BOOKED_to_ATTENDED
          - state_machines.Reservation.CREDIT_HELD_to_CREDIT_CONSUMED
          - entities.Reservation.fields.attendance_status
          - entities.Reservation.fields.billing_status
        distinguishing_aspect: "Reservation carries two independent state dimensions (attendance_status x billing_status) that advance on the same row; check-in advances both. This parallel shape is on Reservation; the second non-linear machine is the CreditPack cycle on a different entity."
        test_recipe:
          setup:
            - "A booked reservation exists with attendance=BOOKED, billing=CREDIT_HELD; clock is inside the check-in window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
              captures: { bike1_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "m1@x.com", full_name: "Mem One", home_studio_id: "${studio_id}" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${member_id}", kind: "CLASS_PACK", purchased_credits: 5, price_cents: 5000, expires_at: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { pack_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-02T10:00:00Z", end_utc: "2026-06-02T11:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:30:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations/${r1_id}/check-in"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { att: $.data.attendance_status, bil: $.data.billing_status }
          assert:
            - "Reservation.${r1_id}.attendance_status == ATTENDED"
            - "Reservation.${r1_id}.billing_status == CREDIT_CONSUMED"
            - "Member.${member_id}.completed_ride_count == 1"

      - name: credit_pack_active_exhausted_active_cycle
        grounds:
          - state_machines.CreditPack.ACTIVE_to_EXHAUSTED
          - state_machines.CreditPack.EXHAUSTED_to_ACTIVE
          - entities.CreditPack.fields.status
        distinguishing_aspect: "CreditPack exhibits a true cycle ACTIVE->EXHAUSTED->ACTIVE: a 1-credit pack exhausts on booking then returns to ACTIVE when an early-cancel restores the credit — a cyclic shape on a different entity than the parallel-dim Reservation."
        test_recipe:
          setup:
            - "A 1-credit CLASS_PACK becomes EXHAUSTED after one booking; the booking is then early-cancelled, restoring the credit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
