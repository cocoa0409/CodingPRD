            - "WriteDownRequest.${wdr_id}.status == APPLIED"
            - "TimeEntry.${te1_id}.status == WRITTEN_DOWN"
            - "TimeEntry.${te2_id}.status == WRITTEN_DOWN"
            - "TimeEntry.${te3_id}.status == WRITTEN_DOWN"
