# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Air Freight Forwarding & Consolidation
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: quoted_vs_final_chargeable_weight
        grounds:
          - calculations.chargeable_weight
          - calculations.charge_line_total
          - state_machines.MasterWaybill.OPEN_FOR_CONSOLIDATION_to_TENDERED
        distinguishing_aspect: |
          House-waybill rating domain variant: the SAME waybill rated QUOTED from
          declared_volume_m3 (0.60 m3) yields chargeable 100.0 kg / total 475.00,
          while the FINAL variant at tender rated from measured_volume_m3 (0.90 m3)
          yields 150.0 kg / 700.00 — identical waybill, different numbers purely
          from the volume-source variant.
        test_recipe:
          setup:
            - "Shipper ACME is KNOWN; rate agreement for SFO->NRT: tiers [0:5.00, 45:4.50, 100:4.00], min 250.00, fuel 12.5%, security 25.00, spot 7.5%, valid 2026-01-01..2027-01-01"
            - "Booking UA838 SFO->NRT 500 kg / 50 m3 OPEN; MAWB 180-12345675 OPEN_FOR_CONSOLIDATION"
            - "HWB-8001: gross 80.0 kg, declared 0.60 m3, 5 pieces, non-DG, screening CLEARED"
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id "} }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 5.00 }, { min_weight_kg: 45, rate_per_kg: 4.50 }, { min_weight_kg: 100, rate_per_kg: 4.00 } ], min_charge_amount: 250.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0.075, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id "} }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id "} }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-8001", origin_code: "SFO", destination_code: "NRT", pieces: 5, gross_weight_kg: 80.0, declared_volume_m3: 0.60, dg_flag: false }, as: ForwarderOps, captures: { hw1: "$.data.id "} }
            - { call: "POST /air-freight/house-waybills/${hw1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}/screening-records", as: ForwarderOps, captures: { sr1: "$.data[0].id "} }
            - { call: "POST /air-freight/screening-records/${sr1}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version "} }
          trigger:
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hw1}", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps, captures: { cw_q: "$.data.chargeable_weight_kg", tot_q: "$.data.total_charge_amount "} }
            - { call: "POST /air-freight/house-waybills/${hw1}/measure", payload: { measured_volume_m3: 0.90 }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/tender", payload: { tender_window_start_utc: "2026-08-09T12:00:00Z", tender_window_end_utc: "2026-08-09T13:00:00Z" }, as: CapacityPlanner, captures: { mb_w: "$.data.total_chargeable_weight_kg", mb_f: "$.data.total_freight_amount "} }
          assert:
            - "consolidation response (QUOTED variant): chargeable_weight_kg == 100.0 and total_charge_amount == 475.00 (captured ${cw_q} == 100.0, ${tot_q} == 475.00)"
            - "HouseWaybill.${hw1} after tender: weight_basis == FINAL, chargeable_weight_kg == 150.0"
            - "HouseWaybill.${hw1} after tender: freight_amount == 600.00, fuel_surcharge_amount == 75.00, security_fee_amount == 25.00, spot_surcharge_amount == 0, total_charge_amount == 700.00"
            - "tender response (captured ${mb_w} == 150.0, ${mb_f} == 700.00); FlightBooking.${bk1}.consumed_weight_kg == 150.0"

      - name: standard_vs_declared_value_liability
        grounds:
          - calculations.liability_limit
          - state_machines.Claim.FILED
        distinguishing_aspect: |
          Claim liability domain variant (different domain from waybill rating):
          identical claims (3000.00, DAMAGE) on two 100 kg delivered waybills —
          the surcharge-unpaid waybill yields STANDARD limit 2970.00
          (22 SDR x 1.35 x 100 kg), the surcharge-paid waybill yields
          DECLARED_VALUE limit 3000.00 (min(3000, 5000)).
        test_recipe:
          setup:
            - "Shipper ACME KNOWN; SFO->NRT agreement as in base fixture; booking 500/50 OPEN; MAWB open"
            - "HWB-STD: gross 100.0 kg, declared 0.50 m3, declared_value 0, surcharge unpaid; HWB-DCL: same but declared_value 5000.00 with surcharge paid; both CLEARED, CONSOLIDATED (chargeable 100.0 kg each), measured 0.50 m3, TENDERED, flown and DELIVERED at 2026-08-11T09:00:00Z"
            - "logical clock set to 2026-08-11T12:00:00Z (within both filing windows)"
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id "} }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 5.00 }, { min_weight_kg: 45, rate_per_kg: 4.50 }, { min_weight_kg: 100, rate_per_kg: 4.00 } ], min_charge_amount: 250.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0.075, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id "} }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id "} }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-STD", origin_code: "SFO", destination_code: "NRT", pieces: 4, gross_weight_kg: 100.0, declared_volume_m3: 0.50, dg_flag: false, declared_value_amount: 0, declared_value_surcharge_paid: false }, as: ForwarderOps, captures: { hw_std: "$.data.id "} }
            - { call: "POST /air-freight/house-waybills/${hw_std}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hw_std}/screening-records", as: ForwarderOps, captures: { sr_std: "$.data[0].id "} }
            - { call: "POST /air-freight/screening-records/${sr_std}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version "} }
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hw_std}", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-DCL", origin_code: "SFO", destination_code: "NRT", pieces: 4, gross_weight_kg: 100.0, declared_volume_m3: 0.50, dg_flag: false, declared_value_amount: 5000.00, declared_value_surcharge_paid: true }, as: ForwarderOps, captures: { hw_dcl: "$.data.id "} }
            - { call: "POST /air-freight/house-waybills/${hw_dcl}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hw_dcl}/screening-records", as: ForwarderOps, captures: { sr_dcl: "$.data[0].id "} }
            - { call: "POST /air-freight/screening-records/${sr_dcl}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv2: "$.data.version "} }
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hw_dcl}", expected_master_waybill_version: "${mv2}" }, as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills/${hw_std}/measure", payload: { measured_volume_m3: 0.50 }, as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills/${hw_dcl}/measure", payload: { measured_volume_m3: 0.50 }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/tender", payload: { tender_window_start_utc: "2026-08-09T12:00:00Z", tender_window_end_utc: "2026-08-09T13:00:00Z" }, as: CapacityPlanner }
            - { call: "POST /air-freight/master-waybills/${mb1}/milestone-events", payload: { event_code: "DEPARTED", event_time_utc: "2026-08-10T10:00:00Z" }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/milestone-events", payload: { event_code: "ARRIVED", event_time_utc: "2026-08-10T22:00:00Z" }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/milestone-events", payload: { event_code: "DELIVERED", event_time_utc: "2026-08-11T09:00:00Z" }, as: ForwarderOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T12:00:00Z" }, as: ForwarderOps }
          trigger:
            - { call: "POST /air-freight/claims", payload: { hwb_id: "${hw_std}", claim_type: "DAMAGE", claimed_amount: 3000.00 }, as: ForwarderOps, captures: { lim_std: "$.data.liability_limit_amount", bas_std: "$.data.liability_basis "} }
            - { call: "POST /air-freight/claims", payload: { hwb_id: "${hw_dcl}", claim_type: "DAMAGE", claimed_amount: 3000.00 }, as: ForwarderOps, captures: { lim_dcl: "$.data.liability_limit_amount", bas_dcl: "$.data.liability_basis "} }
          assert:
            - "STANDARD claim: liability_basis == STANDARD and liability_limit_amount == 2970.00 (captured ${bas_std}, ${lim_std})"
            - "DECLARED_VALUE claim: liability_basis == DECLARED_VALUE and liability_limit_amount == 3000.00 (captured ${bas_dcl}, ${lim_dcl})"
            - "the two variants differ on identical claim input: ${lim_std} != ${lim_dcl}"

  - rule_id: combinatorial_formula
    instances:
      - name: weight_break_tiered_freight_selection
        grounds:
          - calculations.freight_rate_selection
        distinguishing_aspect: |
          Mode (a) non-linear tier selection with >= 3 inputs (chargeable weight,
          weight_breaks, min_charge_amount): the freight line is min over
          per-tier max(min_charge, rate x weight) — the 100-kg break wins below
          its own break point (480.00 at 120 kg beats the 45-kg tier's 540.00),
          and the min-charge floor binds at 60 kg only if tiers allow (270.00).
        test_recipe:
          setup:
            - "Shipper ACME KNOWN; SFO->NRT agreement tiers [0:5.00, 45:4.50, 100:4.00], min 250.00, fuel 12.5%, security 25.00, spot 7.5%"
            - "Booking UA838 500/50 OPEN; MAWB open"
            - "HWB-X: gross 120.0, declared 0.50 m3 (chargeable 120.0); HWB-Y: gross 60.0, declared 0.30 m3 (chargeable 60.0); both CLEARED"
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id "} }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 5.00 }, { min_weight_kg: 45, rate_per_kg: 4.50 }, { min_weight_kg: 100, rate_per_kg: 4.00 } ], min_charge_amount: 250.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0.075, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id "} }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id "} }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-X", origin_code: "SFO", destination_code: "NRT", pieces: 6, gross_weight_kg: 120.0, declared_volume_m3: 0.50, dg_flag: false }, as: ForwarderOps, captures: { hwx: "$.data.id "} }
            - { call: "POST /air-freight/house-waybills/${hwx}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwx}/screening-records", as: ForwarderOps, captures: { srx: "$.data[0].id "} }
            - { call: "POST /air-freight/screening-records/${srx}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-Y", origin_code: "SFO", destination_code: "NRT", pieces: 3, gross_weight_kg: 60.0, declared_volume_m3: 0.30, dg_flag: false }, as: ForwarderOps, captures: { hwy: "$.data.id "} }
            - { call: "POST /air-freight/house-waybills/${hwy}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwy}/screening-records", as: ForwarderOps, captures: { sry: "$.data[0].id "} }
            - { call: "POST /air-freight/screening-records/${sry}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version "} }
          trigger:
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwx}", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps, captures: { fx: "$.data.freight_amount", tx: "$.data.total_charge_amount "} }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv2: "$.data.version "} }
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwy}", expected_master_waybill_version: "${mv2}" }, as: ForwarderOps, captures: { fy: "$.data.freight_amount", ty: "$.data.total_charge_amount "} }
          assert:
            - "HWB-X at 120.0 kg: freight_amount == 480.00 (100-kg break: max(250, 4.00x120) beats 45-kg tier max(250, 4.50x120)=540.00), total_charge_amount == 565.00 (captured ${fx}, ${tx})"
            - "HWB-Y at 60.0 kg: freight_amount == 270.00 (45-kg tier max(250, 4.50x60); 0-kg tier 300.00 loses), total_charge_amount == 328.75 (captured ${fy}, ${ty})"

      - name: per_line_rounding_then_sum
        grounds:
          - calculations.charge_line_total
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode from tiered selection): each
          charge line is rounded 2dp ROUND_HALF_UP before summation. Rate 3.33 x
          45.5 kg = 151.515 raw: pinned order yields 151.52 + 22.73 + 10.01 =
          184.26; the forbidden sum-then-round order would yield 184.25.
        test_recipe:
          setup:
            - "Shipper BETA KNOWN; LAX->JFK agreement tiers [0:3.33], min 0.00, fuel 15%, security 10.01, spot 0"
            - "Booking LAX->JFK 500/50 OPEN; MAWB open"
            - "HWB-R: gross 45.5 kg, declared 0.20 m3 (chargeable 45.5), CLEARED"
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Beta Freight", account_code: "BETA" }, as: ForwarderOps, captures: { sh1: "$.data.id "} }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "LAX", destination_code: "JFK", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 3.33 } ], min_charge_amount: 0.00, fuel_surcharge_pct: 0.15, security_fee_amount: 10.01, spot_surcharge_pct: 0, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "DL", flight_number: "DL100", origin_code: "LAX", destination_code: "JFK", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id "} }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-99999999" }, as: CapacityPlanner, captures: { mb1: "$.data.id "} }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-R", origin_code: "LAX", destination_code: "JFK", pieces: 2, gross_weight_kg: 45.5, declared_volume_m3: 0.20, dg_flag: false }, as: ForwarderOps, captures: { hw1: "$.data.id "} }
            - { call: "POST /air-freight/house-waybills/${hw1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}/screening-records", as: ForwarderOps, captures: { sr1: "$.data[0].id "} }
            - { call: "POST /air-freight/screening-records/${sr1}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version "} }
          trigger:
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hw1}", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps, captures: { f: "$.data.freight_amount", fu: "$.data.fuel_surcharge_amount", sf: "$.data.security_fee_amount", tot: "$.data.total_charge_amount "} }
          assert:
            - "freight_amount == 151.52 (round_half_up of 151.515), fuel_surcharge_amount == 22.73 (round of 151.52 x 0.15 = 22.728), security_fee_amount == 10.01 (captured ${f}, ${fu}, ${sf})"
            - "total_charge_amount == 184.26 — the per-line-rounded sum; sum-then-round of raw components (184.25) is the forbidden order (captured ${tot})"

  - rule_id: non_linear_state_machine
    instances:
      - name: house_waybill_screening_revision_cycle
        grounds:
          - state_machines.HouseWaybill.DRAFT_to_SCREENING
          - state_machines.HouseWaybill.SCREENING_to_SCREENING_REJECTED
          - state_machines.HouseWaybill.SCREENING_REJECTED_to_DRAFT
          - state_machines.HouseWaybill.SCREENING_to_CLEARED
        distinguishing_aspect: |
          HouseWaybill is cyclic (SCREENING -> SCREENING_REJECTED -> DRAFT ->
          SCREENING -> CLEARED): a dangerous-goods rejection sends the waybill
          back to DRAFT for correction, and a resubmission creates fresh
          screening records judged by latest-record-per-type.
        test_recipe:
          setup:
            - "Shipper ACME KNOWN (dg gate passes); no rate agreement or booking needed for this instance"
            - "HWB-DG1: dg_flag true, DRAFT"
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-DG1", origin_code: "SFO", destination_code: "NRT", pieces: 2, gross_weight_kg: 20.0, declared_volume_m3: 0.10, dg_flag: true }, as: ForwarderOps, captures: { hw1: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hw1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}/screening-records", as: ForwarderOps, captures: { sec1: "$.data[0].id", dg1: "$.data[1].id" } }
          trigger:
            - { call: "POST /air-freight/screening-records/${dg1}/resolve", payload: { outcome: "REJECTED", rejection_reason: "DG declaration missing packing instruction" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}", as: ForwarderOps, captures: { st_after_rej: "$.data.status" } }
            - { call: "POST /air-freight/house-waybills/${hw1}/recall", as: ForwarderOps, captures: { st_after_recall: "$.data.status" } }
            - { call: "POST /air-freight/house-waybills/${hw1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}/screening-records", as: ForwarderOps, captures: { sec2: "$.data[2].id", dg2: "$.data[3].id" } }
            - { call: "POST /air-freight/screening-records/${sec2}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}", as: ForwarderOps, captures: { st_mid: "$.data.status" } }
            - { call: "POST /air-freight/screening-records/${dg2}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
          assert:
            - "after DG rejection: status == SCREENING_REJECTED (captured ${st_after_rej}); Shipper.${sh1}.screening_rejection_count == 1"
            - "after recall: status == DRAFT (captured ${st_after_recall})"
            - "resubmission appended a fresh record pair: indices [2] SECURITY and [3] DANGEROUS_GOODS, both PENDING at capture time"
            - "after clearing only SECURITY: status still SCREENING (captured ${st_mid}) — DANGEROUS_GOODS gate unmet"
            - "after clearing DANGEROUS_GOODS: HouseWaybill.${hw1}.status == CLEARED (cycle DRAFT->SCREENING->SCREENING_REJECTED->DRAFT->SCREENING->CLEARED completed)"

      - name: claim_counteroffer_rebuttal_cycle
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_COUNTERED
          - state_machines.Claim.COUNTERED_to_UNDER_REVIEW
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - state_machines.Claim.APPROVED_to_SETTLED
        distinguishing_aspect: |
          Claim is branching + cyclic (different entity than HouseWaybill):
          UNDER_REVIEW forks to APPROVED / DENIED / COUNTERED, and COUNTERED
          loops back to UNDER_REVIEW on rebuttal (review_round_count increments)
          before finally settling at the liability-capped amount 2376.00.
        test_recipe:
          setup:
            - "Base SFO->NRT fixture; HWB-C1 gross 80.0 kg, declared 0.60 m3, declared_value 0 (STANDARD liability: 22 x 1.35 x 80 = 2376.00), CLEARED, CONSOLIDATED, measured 0.60, TENDERED, DEPARTED/ARRIVED/DELIVERED at 2026-08-11T09:00:00Z; clock 2026-08-11T12:00:00Z"
            - "Claim filed: DAMAGE, claimed_amount 3000.00, status FILED"
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 100, rate_per_kg: 4.00 } ], min_charge_amount: 250.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-C1", origin_code: "SFO", destination_code: "NRT", pieces: 5, gross_weight_kg: 80.0, declared_volume_m3: 0.60, dg_flag: false, declared_value_amount: 0, declared_value_surcharge_paid: false }, as: ForwarderOps, captures: { hw1: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hw1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}/screening-records", as: ForwarderOps, captures: { sr1: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${sr1}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hw1}", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills/${hw1}/measure", payload: { measured_volume_m3: 0.60 }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/tender", payload: { tender_window_start_utc: "2026-08-09T12:00:00Z", tender_window_end_utc: "2026-08-09T13:00:00Z" }, as: CapacityPlanner }
            - { call: "POST /air-freight/master-waybills/${mb1}/milestone-events", payload: { event_code: "DEPARTED", event_time_utc: "2026-08-10T10:00:00Z" }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/milestone-events", payload: { event_code: "ARRIVED", event_time_utc: "2026-08-10T22:00:00Z" }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/milestone-events", payload: { event_code: "DELIVERED", event_time_utc: "2026-08-11T09:00:00Z" }, as: ForwarderOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T12:00:00Z" }, as: ForwarderOps }
            - { call: "POST /air-freight/claims", payload: { hwb_id: "${hw1}", claim_type: "DAMAGE", claimed_amount: 3000.00 }, as: ForwarderOps, captures: { cl1: "$.data.id" } }
          trigger:
            - { call: "POST /air-freight/claims/${cl1}/start-review", as: ClaimsAdjuster }
            - { call: "POST /air-freight/claims/${cl1}/resolve-review", payload: { outcome: "COUNTERED", counter_amount: 1500.00 }, as: ClaimsAdjuster, captures: { st_ctr: "$.data.status", amt_ctr: "$.data.counter_amount" } }
            - { call: "POST /air-freight/claims/${cl1}/rebut", as: ForwarderOps, captures: { st_reb: "$.data.status", rounds: "$.data.review_round_count" } }
            - { call: "POST /air-freight/claims/${cl1}/resolve-review", payload: { outcome: "APPROVED", approved_amount: 2376.00 }, as: ClaimsAdjuster }
            - { call: "POST /air-freight/claims/${cl1}/settle", as: ClaimsAdjuster, captures: { st_fin: "$.data.status", amt_fin: "$.data.approved_amount" } }
          assert:
            - "after counteroffer: status == COUNTERED, counter_amount == 1500.00 (captured ${st_ctr}, ${amt_ctr})"
            - "after rebuttal: status == UNDER_REVIEW and review_round_count == 1 (captured ${st_reb}, ${rounds})"
            - "after settle: status == SETTLED and approved_amount == 2376.00 (the liability-capped approval) (captured ${st_fin}, ${amt_fin})"

  - rule_id: transitive_cascade
    instances:
      - name: booking_cancel_cascade_depth3
        grounds:
          - state_machines.FlightBooking.OPEN_to_CANCELLED
          - state_machines.MasterWaybill.OPEN_FOR_CONSOLIDATION_to_VOID
          - state_machines.HouseWaybill.CONSOLIDATED_to_CLEARED
        distinguishing_aspect: |
          Depth-3 cascade triggered by booking cancellation (link 1: MAWB ->
          VOID; link 2, caused by the voiding: attached HWB -> CLEARED detached
          and zeroed; link 3, caused by the detachment: booking consumed_* and
          utilization recomputed to 0.0) — an unconsolidated CLEARED waybill on
          no MAWB is untouched.
        test_recipe:
          setup:
            - "Base SFO->NRT fixture; booking UA838 500/50 OPEN; MAWB 180-12345675 OPEN_FOR_CONSOLIDATION"
            - "HWB-A (gross 80.0, declared 0.60) CLEARED then CONSOLIDATED into the MAWB (chargeable 100.0); booking consumed_weight_kg == 100.0"
            - "HWB-B (gross 10.0, declared 0.05) CLEARED but never consolidated"
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 5.00 }, { min_weight_kg: 45, rate_per_kg: 4.50 }, { min_weight_kg: 100, rate_per_kg: 4.00 } ], min_charge_amount: 250.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0.075, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-A", origin_code: "SFO", destination_code: "NRT", pieces: 5, gross_weight_kg: 80.0, declared_volume_m3: 0.60, dg_flag: false }, as: ForwarderOps, captures: { hwa: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hwa}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwa}/screening-records", as: ForwarderOps, captures: { sra: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${sra}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwa}", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-B", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { hwb: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hwb}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwb}/screening-records", as: ForwarderOps, captures: { srb: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${srb}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
          trigger:
            - { call: "POST /air-freight/flight-bookings/${bk1}/cancel", as: CapacityPlanner, captures: { bk_status: "$.data.status", bk_consumed: "$.data.consumed_weight_kg", bk_util: "$.data.utilization_pct" } }
          assert:
            - "link 1: MasterWaybill.${mb1}.status == VOID"
            - "link 2: HouseWaybill.${hwa}.status == CLEARED, mawb_id == null, total_charge_amount == 0, weight_basis == UNRATED"
            - "link 3 (captured on cancel response): FlightBooking.${bk1}.status == CANCELLED, consumed_weight_kg == 0.0, utilization_pct == 0.0 (${bk_status}, ${bk_consumed}, ${bk_util})"
            - "unconsolidated HouseWaybill.${hwb}.status == CLEARED unchanged (detached cascade touched only attached waybills)"

      - name: screening_rejection_demerit_suspension_depth3
        grounds:
          - state_machines.HouseWaybill.SCREENING_to_SCREENING_REJECTED
          - state_machines.Shipper.KNOWN_to_SUSPENDED
          - calculations.demerit_suspension
        distinguishing_aspect: |
          Depth-3 cascade with a different trigger (screening resolution, not
          booking cancellation): a single REJECTED resolution mutates the HWB
          (link 1), which increments the shipper's demerit counter (link 2),
          which at >= 3 flips the shipper KNOWN -> SUSPENDED (link 3) — and the
          suspension then gates a subsequent dg submission with
          ERR_SHIPPER_NOT_KNOWN.
        test_recipe:
          setup:
            - "Shipper ACME KNOWN"
            - "HWB-R1, HWB-R2, HWB-R3 each submitted (SECURITY record PENDING each)"
            - "HWB-DG4: dg_flag true, still DRAFT (not yet submitted)"
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-R1", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { r1: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${r1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${r1}/screening-records", as: ForwarderOps, captures: { srr1: "$.data[0].id" } }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-R2", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { r2: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${r2}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${r2}/screening-records", as: ForwarderOps, captures: { srr2: "$.data[0].id" } }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-R3", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { r3: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${r3}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${r3}/screening-records", as: ForwarderOps, captures: { srr3: "$.data[0].id" } }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-DG4", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: true }, as: ForwarderOps, captures: { dg4: "$.data.id" } }
          trigger:
            - { call: "POST /air-freight/screening-records/${srr1}/resolve", payload: { outcome: "REJECTED", rejection_reason: "untraceable box" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/shippers/${sh1}", as: ForwarderOps, captures: { c1: "$.data.screening_rejection_count", k1: "$.data.known_shipper_status" } }
            - { call: "POST /air-freight/screening-records/${srr2}/resolve", payload: { outcome: "REJECTED", rejection_reason: "untraceable box" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/shippers/${sh1}", as: ForwarderOps, captures: { c2: "$.data.screening_rejection_count", k2: "$.data.known_shipper_status" } }
            - { call: "POST /air-freight/screening-records/${srr3}/resolve", payload: { outcome: "REJECTED", rejection_reason: "untraceable box" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/shippers/${sh1}", as: ForwarderOps, captures: { c3: "$.data.screening_rejection_count", k3: "$.data.known_shipper_status" } }
            - { call: "POST /air-freight/house-waybills/${dg4}/submit", as: ForwarderOps, captures: { gate_err: "$.data.error_id" } }
          assert:
            - "after rejection 1: screening_rejection_count == 1, known_shipper_status == KNOWN (captured ${c1}, ${k1})"
            - "after rejection 2: screening_rejection_count == 2, known_shipper_status == KNOWN (captured ${c2}, ${k2})"
            - "after rejection 3 (inclusive boundary): screening_rejection_count == 3, known_shipper_status == SUSPENDED (captured ${c3}, ${k3}); HWB-R1/R2/R3 all SCREENING_REJECTED"
            - "suspension gates the dg submission: captured ${gate_err} == ERR_SHIPPER_NOT_KNOWN"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_consolidation
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: the consolidation request
          violates both (waybill still in SCREENING; dg waybill with shipper now
          SUSPENDED) and the state error ERR_HWB_NOT_CLEARED (priority 5) must
          win over ERR_SHIPPER_NOT_KNOWN (priority 6).
