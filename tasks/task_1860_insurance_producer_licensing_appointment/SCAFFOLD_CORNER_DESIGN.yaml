          rationale: "Asserted as the blocked release (err_hold) of the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: ce_credit_review_by_finance_ops_forbidden
        claim_type: role_exclusive_denied
        grounds: ["roles[LicensingCoordinator].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "CE review is exclusive to LicensingCoordinator; FinanceOps gets ERR_FORBIDDEN before any state check."
        test_recipe:
          setup: ["producer with license and one REPORTED credit"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3030", full_name: "RBAC CE", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "POST /api/ce-credits"
              payload: { license_id: "${lic}", provider_name: "CEU", course_title: "X", category: "GENERAL", credit_hours: 5, completed_on: "2026-06-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { cr: $.data.id }
          trigger:
            - call: "POST /api/ce-credits/${cr}/review"
              payload: { decision: "ACCEPT" }
              as: FinanceOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (http 403)"
            - "CECredit.${cr}.status == REPORTED (unchanged)"

      - name: producer_cannot_release_commission_forbidden
        claim_type: role_exclusive_denied
        grounds: ["roles[ComplianceOfficer].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Commission release is exclusive to ComplianceOfficer; the Producer role is denied even on its own entry (role check precedes ownership logic)."
        test_recipe:
          setup: ["producer with license; application submitted -> HELD entry (APPOINTMENT_PENDING)"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3031", full_name: "RBAC Release", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p}", state_code: "CA", line_of_authority: "LIFE", applicant_name: "R", premium_cents: 1000000 }
              as: LicensingCoordinator
              captures: { app: $.data.id }
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app}" }
              as: LicensingCoordinator
              captures: { e: "$.data[0].id" }
          trigger:
            - call: "POST /api/commission-entries/${e}/release"
              as: Producer
              as_user_id: "${p}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (http 403)"
            - "CommissionEntry.${e}.status == HELD"

      - name: producer_reading_other_producer_forbidden
        claim_type: ownership_scope
        grounds: ["roles[Producer]", "validations[priority=5]"]
        distinguishing_aspect: "Entity-backed ownership: Producer role may GET its own record but reading another producer's record yields ERR_FORBIDDEN."
        test_recipe:
          setup: ["two producers P1 and P2"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3032", full_name: "Self", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p1: $.data.id }
            - call: "POST /api/producers"
              payload: { npn: "NPN-3033", full_name: "Other", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p2: $.data.id }
          trigger:
            - call: "GET /api/producers/${p1}"
              as: Producer
              as_user_id: "${p1}"
              captures: { ok_id: $.data.id }
            - call: "GET /api/producers/${p2}"
              as: Producer
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "ok_id == ${p1} (self-read succeeds)"
            - "err == ERR_FORBIDDEN (cross-producer read denied)"

      - name: sod_maker_confirm_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=3]", "errors[ERR_SOD_VIOLATION]", state_machines.RegulatoryAction]
        distinguishing_aspect: "Maker-checker: the officer who created the action cannot confirm it (ERR_SOD_VIOLATION); a different officer confirms successfully."
        test_recipe:
          setup: ["producer; one REPORTED FINE action created by officer-a"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3034", full_name: "SoD Target", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/regulatory-actions"
              payload: { producer_id: "${p}", state_code: "CA", action_type: "FINE", fine_amount_cents: 5000, effective_date: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ra: $.data.id, maker: $.data.created_by_user_id }
          trigger:
            - call: "POST /api/regulatory-actions/${ra}/confirm"
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { err: $.data.error_id }
            - call: "POST /api/regulatory-actions/${ra}/confirm"
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { st: $.data.status, decider: $.data.decided_by_user_id }
          assert:
            - "maker == officer-a and err == ERR_SOD_VIOLATION (http 403)"
            - "st == CONFIRMED and decider == officer-b"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: stale_version_occ_license_renew_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[license-renew-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: renew carrying expected_license_version one behind the observed version yields 412 ERR_STALE_VERSION; the same call with the current version succeeds."
        test_recipe:
          setup: ["producer with CA license (ce 0/0, exp 2026-09-01) at version 1; clock default (inside renewal window)"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3035", full_name: "OCC Renew", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2026-09-01T00:00:00Z", ce_required_hours: 0, ce_ethics_required_hours: 0 }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "GET /api/licenses/${lic}"
              as: LicensingCoordinator
              captures: { lic_v: $.data.version }
          trigger:
            - call: "POST /api/licenses/${lic}/renew"
              payload: { expected_license_version: "${lic_v} - 1" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /api/licenses/${lic}/renew"
              payload: { expected_license_version: "${lic_v}" }
              as: LicensingCoordinator
              captures: { st: $.data.status, rc: $.data.renewed_count, v2: $.data.version }
          assert:
            - "err == ERR_STALE_VERSION (http 412) for the stale request"
            - "st == ACTIVE and rc == 1 and v2 == ${lic_v} + 1 for the current-version request"

      - name: stale_version_occ_inquiry_response_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[inquiry-response-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: the clock sweep advances the inquiry's version (OPEN -> OVERDUE); a response carrying the pre-sweep version yields 412, while re-reading and responding with the fresh version succeeds (late response allowed)."
        test_recipe:
          setup: ["producer; OPEN inquiry (version 1) created at 2026-08-01; clock swept to 2026-09-01 -> OVERDUE (version 2)"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3036", full_name: "OCC Inquiry", resident_state_code: "TX" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/inquiries"
              payload: { producer_id: "${p}", state_code: "TX", reference_number: "INQ-3036" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { inq: $.data.id, inq_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CarrierAdmin
          trigger:
            - call: "POST /api/inquiries/${inq}/response"
              payload: { response_text: "stale", expected_inquiry_version: "${inq_v1}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "GET /api/inquiries/${inq}"
              as: ComplianceOfficer
              captures: { inq_v2: $.data.version, inq_st: $.data.status }
            - call: "POST /api/inquiries/${inq}/response"
              payload: { response_text: "fresh", expected_inquiry_version: "${inq_v2}" }
              as: ComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "err == ERR_STALE_VERSION (http 412) — the sweep legitimately advanced the version"
            - "inq_st == OVERDUE and inq_v2 == ${inq_v1} + 1"
            - "st == RESPONSE_SUBMITTED with the fresh version"

      - name: license_at_exact_expiration_instant_not_swept
        claim_type: scheduled_actions
        grounds: [state_machines.License.ACTIVE_to_EXPIRED, calculations.renewal_window]
        distinguishing_aspect: "The sweep uses strict >: with the clock at exactly the expiration instant the license is still ACTIVE. Also proves the startup default clock is exactly 2026-08-01T00:00:00Z without any set_current_utc call."
        test_recipe:
          setup: ["producer with license expiring exactly 2026-08-01T00:00:00Z (the default clock); no set_current_utc call made before the first read"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3037", full_name: "Exact Expiry", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2026-08-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "GET /api/licenses/${lic}"
              as: LicensingCoordinator
              captures: { st_default: $.data.status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "GET /api/licenses/${lic}"
              as: LicensingCoordinator
              captures: { st_equal: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: CarrierAdmin
            - call: "GET /api/licenses/${lic}"
              as: LicensingCoordinator
              captures: { st_after: $.data.status }
          assert:
            - "st_default == ACTIVE (default clock equals expiration; no wall-clock fallback)"
            - "st_equal == ACTIVE (strict > sweep: equality is not expiry)"
            - "st_after == EXPIRED (one second past expiration)"

      - name: cascade_chains_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.License, state_machines.RegulatoryInquiry]
        excluded_because:
          difficulty_instance: "transitive_cascade / regulatory_confirm_cascade_depth3"
          rationale: "Both cascade chains (confirm-driven and clock-driven) are asserted hop-by-hop in §1.8 instances regulatory_confirm_cascade_depth3 and inquiry_overdue_cascade_depth2."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: mutation_immediately_visible_in_same_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, response_envelope]
        distinguishing_aspect: "Immediate consistency: the mutation response itself carries the new state, and a subsequent GET returns identical values (no lag) — including cascaded derived fields."
        test_recipe:
          setup: ["producer with license + ACTIVE appointment; one APPROVED application"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3038", full_name: "Immediate", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { producer_id: "${p}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt: $.data.id }
            - call: "POST /api/appointments/${appt}/file"
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p}", state_code: "CA", line_of_authority: "LIFE", applicant_name: "I", premium_cents: 1000000 }
              as: LicensingCoordinator
              captures: { app: $.data.id }
            - call: "POST /api/applications/${app}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
          trigger:
            - call: "POST /api/applications/${app}/issue"
              as: LicensingCoordinator
              captures: { st: $.data.status, issued: $.data.issued_at }
            - call: "GET /api/applications/${app}"
              as: LicensingCoordinator
              captures: { st_get: $.data.status, issued_get: $.data.issued_at }
            - call: "GET /api/producers/${p}"
              as: LicensingCoordinator
              captures: { ytd_get: $.data.ytd_issued_premium_cents }
          assert:
            - "st == ISSUED and issued == 2026-08-01T00:00:00Z in the mutation response itself"
            - "st_get == ISSUED and issued_get == issued (GET agrees with the mutation response)"
            - "ytd_get == 1000000 (derived field reconciled within the same request scope)"
