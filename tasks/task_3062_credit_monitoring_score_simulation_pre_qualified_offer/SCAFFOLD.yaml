    side_effects:
      - "archive_status = ARCHIVED on the consumer"
      - "transition every non-terminal ConsentRecord for this consumer to NOT_SEALED"
      - "supersede every non-CANCELLED BureauSnapshot for this consumer"
      - "revert every PreQualificationDecision in status ELIGIBLE or PREQUALIFIED to ELIGIBLE"
      - "recompute Consumer.monitoring_posture"

  - method: POST
    path: "/credit/consumers/{id}/bureau-snapshots"
    description: "Refresh the soft-pull bureau data for a consumer. The submitted factor_codes array is the pull-result census: an empty array is a census with no entries. When at least one ScoreTierThreshold is ACTIVE, every submitted factor_code must appear in one of their factor_catalog arrays; when none is ACTIVE the check is skipped."
    roles: [BureauConnector, PlatformAdmin]
    code: 201
    input: [score, added_account_count, total_revolving_balance_cents, credit_limit_total_cents, factor_codes, expected_consumer_version]
    output: BureauSnapshot
    side_effects:
      - "supersede the consumer's ACTIVE BureauSnapshot"
      - "when factor_codes has at least one entry: create BureauSnapshot(snapshot_ordinal = score_version + 1, status = ACTIVE) from the census entry"
      - "when factor_codes is empty: write the row as status = CANCELLED and refuse the pull with ERR_PULL_RESULT_EMPTY"
      - "recompute consumer.score_version, current_score, previous_score, utilization_pct"
      - "create one ScoreFactorExplanation per normalized factor_code"
      - "score_alert_threshold → possibly create ScoreAlert"
      - "increments Consumer.version by 1"

