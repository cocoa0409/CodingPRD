        claim_type: role_denial
        grounds:
                 - "roles"
                 - "state_machines.DeliveryRoute"
        distinguishing_aspect: "Driver role shares set-status but may only COMPLETE own routes: target_status CANCELLED by the assigned driver is ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Route DISPATCHED with driver d1"]
          setup_api_calls:
            - { call: "POST /api/drivers", payload: { driver_name: "D-RB2", cdl_class: "A", hazmat_endorsements: [ { endorsement_class: "NONFLAMMABLE_GAS", expiry_date: "2027-01-01" } ], medical_card_expiry: "2027-01-01" }, as: LogisticsCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 8, window_end_hour: 12, stops: [ { stop_name: "S1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /api/routes/${ro}/assign-driver", payload: { driver_id: "${d1}" }, as: LogisticsCoordinator }
            - { call: "POST /api/routes/${ro}/dispatch", payload: {}, as: LogisticsCoordinator }
          trigger:
            - { call: "POST /api/routes/${ro}/set-status", payload: { target_status: "CANCELLED" }, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE; route remains DISPATCHED"

      - name: segregation_filler_cannot_analyze_own_fill
        claim_type: role_denial
        grounds:
                 - "validations[priority=9]"
                 - "errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]"
        distinguishing_aspect: "Segregation of duties on identity, not role: a LabAnalyst whose X-User-ID equals the lot's completed_by_user_id is rejected even though the role is correct."
        test_recipe:
          setup: ["Lot completed by user op-1, AWAITING_ANALYSIS"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-RB3" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-RB3-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "op-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1", captures: { an: $.data.id } }
          assert:
            - "Recorder == completed_by (op-1): error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION (403)"
            - "Different recorder (lab-1): analysis created, result PASS, lot RELEASED"

      - name: override_actor_must_differ_from_recorder
        claim_type: role_denial
        grounds:
                 - "validations[priority=9]"
                 - "state_machines.PurityAnalysis.RECORDED_to_OVERRIDDEN"
        distinguishing_aspect: "Second segregation link: the override actor must differ from the recorder even with the correct QualityManager role; a different QualityManager succeeds."
        test_recipe:
          setup: ["MARGINAL analysis recorded by lab-1 on an AWAITING_ANALYSIS lot"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-RB4" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-RB4-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 15 } ] }, as: LabAnalyst, as_user_id: "lab-1", captures: { an: $.data.id } }
          trigger:
            - { call: "POST /api/purity-analyses/${an}/override", payload: {}, as: QualityManager, as_user_id: "lab-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/purity-analyses/${an}/override", payload: {}, as: QualityManager, as_user_id: "qm-1", captures: { ok_an: $.data.id } }
          assert:
            - "Override actor == recorder (lab-1): error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "Override actor qm-1: analysis OVERRIDDEN with result PASS_OVERRIDE; lot RELEASED"

  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_tank_patch_fresh_then_stale
        claim_type: optimistic_concurrency
        grounds:
                 - "concurrency_rules[tank-config-stale-version]"
        distinguishing_aspect: "PATCH with the observed version succeeds and bumps it; replaying the same expected_tank_version afterwards is a deterministic 412."
        test_recipe:
          setup: ["One tank at version 1 (no other tank mutations in between)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CL1" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id, tv: $.data.version } }
          trigger:
            - { call: "PATCH /api/tanks/${t}", payload: { reorder_point_liters: 600, expected_tank_version: "${tv}" }, as: PlantManager, captures: { tv2: $.data.version } }
            - { call: "PATCH /api/tanks/${t}", payload: { reorder_point_liters: 700, expected_tank_version: "${tv}" }, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "Fresh PATCH: 200, reorder_point_liters == 600, version == ${tv} + 1"
            - "Stale PATCH (same version again): error_id == ERR_STALE_VERSION (412); reorder_point stays 600"

      - name: occ_customer_patch_fresh_then_stale
        claim_type: optimistic_concurrency
        grounds:
                 - "concurrency_rules[customer-credit-stale-version]"
        distinguishing_aspect: "PATCH /api/customers/{id} with the observed version succeeds and bumps it; replaying the same expected_customer_version afterwards is a deterministic 412 on a second parent entity (distinct OCC rule from the tank)."
        test_recipe:
          setup: ["Customer created; version captured from the create response"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_name: "C-CL2", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id, cv: $.data.version } }
          trigger:
            - { call: "PATCH /api/customers/${cu}", payload: { credit_limit_cents: 200000, expected_customer_version: "${cv}" }, as: BillingClerk, captures: { cv2: $.data.version } }
            - { call: "PATCH /api/customers/${cu}", payload: { credit_limit_cents: 300000, expected_customer_version: "${cv}" }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "Fresh PATCH: 200, credit_limit_cents == 200000, version == ${cv} + 1"
            - "Stale replay: error_id == ERR_STALE_VERSION (412); credit_limit_cents stays 200000"

      - name: occ_replenishment_supersede_and_stale_create
        claim_type: optimistic_concurrency
        grounds:
                 - "concurrency_rules[replenishment-create-stale-installation]"
                 - "state_machines.ReplenishmentOrder.PENDING_to_SUPERSEDED"
        distinguishing_aspect: "CREATE-with-supersede: a fresh create supersedes the prior PENDING order (SUPERSEDED with superseded_by_order_id set), while a create carrying the pre-first-create version is refused 412."
        test_recipe:
          setup: ["ACTIVE installation; version observed after activation"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_name: "C-CL3", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/bulk-installations", payload: { customer_id: "${cu}", product_code: "O2", capacity_liters: 5000, initial_level_liters: 2000, reorder_point_liters: 400, max_order_qty_liters: 3000 }, as: PlantManager, captures: { inst: $.data.id } }
            - { call: "POST /api/bulk-installations/${inst}/set-status", payload: { target_status: "INSTALLED" }, as: PlantManager }
            - { call: "POST /api/bulk-installations/${inst}/set-status", payload: { target_status: "ACTIVE" }, as: PlantManager }
            - { call: "GET /api/bulk-installations/${inst}", as: LogisticsCoordinator, captures: { iv1: $.data.version } }
          trigger:
            - { call: "POST /api/replenishment-orders", payload: { installation_id: "${inst}", scheduled_delivery_at: "2026-08-05T08:00:00Z", expected_installation_version: "${iv1}" }, as: LogisticsCoordinator, captures: { o1: $.data.id, qty1: $.data.requested_qty_liters } }
            - { call: "POST /api/replenishment-orders", payload: { installation_id: "${inst}", scheduled_delivery_at: "2026-08-06T08:00:00Z", expected_installation_version: "${iv1}" }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /api/bulk-installations/${inst}", as: LogisticsCoordinator, captures: { iv2: $.data.version } }
            - { call: "POST /api/replenishment-orders", payload: { installation_id: "${inst}", scheduled_delivery_at: "2026-08-06T08:00:00Z", expected_installation_version: "${iv2}" }, as: LogisticsCoordinator, captures: { o2: $.data.id } }
          assert:
            - "First create: 201, requested_qty_liters == 3000 (min(5000-2000, 20000, 3000))"
            - "Replayed stale version: error_id == ERR_STALE_VERSION (412)"
            - "Fresh create supersedes: ReplenishmentOrder.${o1}.status == SUPERSEDED with superseded_by_order_id == ${o2}; ${o2} is PENDING"

      - name: low_level_flag_reconciles_on_readings
        claim_type: derived_field_reconciliation
        grounds:
                 - "entities.StorageTank.fields.low_level_flag"
                 - "calculations.telemetry_level_reconciliation"
        distinguishing_aspect: "low_level_flag flips exactly at the reorder_point boundary (<=): 500 -> true at 500, false again at 501; every reading recomputes it."
        test_recipe:
          setup: ["Tank level 5000, reorder_point 500"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CL4" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /api/telemetry-readings", payload: { tank_id: "${t}", measured_level_liters: 500, measured_at: "2026-08-01T01:00:00Z", source: "IOT_SENSOR" }, as: ProductionOperator }
            - { call: "GET /api/tanks/${t}", as: ProductionOperator, captures: { f1: $.data.low_level_flag } }
            - { call: "POST /api/telemetry-readings", payload: { tank_id: "${t}", measured_level_liters: 501, measured_at: "2026-08-01T02:00:00Z", source: "IOT_SENSOR" }, as: ProductionOperator }
            - { call: "GET /api/tanks/${t}", as: ProductionOperator, captures: { f2: $.data.low_level_flag } }
          assert:
            - "At level == reorder_point (500): low_level_flag == true (inclusive <=)"
            - "At level 501: low_level_flag == false"

      - name: auto_replenishment_created_on_low_installation_level
        claim_type: derived_field_reconciliation
        grounds:
                 - "calculations.replenishment_order_qty"
                 - "endpoints"
        distinguishing_aspect: "A reading at or below reorder_point on an ACTIVE installation auto-creates exactly one PENDING order (qty via the nested-min rule, scheduled at clock + 24h); a second low reading while one is PENDING creates nothing."
        test_recipe:
          setup: ["ACTIVE installation: cap 5000, level 2000, reorder 400, max order 3000; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_name: "C-CL5", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/bulk-installations", payload: { customer_id: "${cu}", product_code: "O2", capacity_liters: 5000, initial_level_liters: 2000, reorder_point_liters: 400, max_order_qty_liters: 3000 }, as: PlantManager, captures: { inst: $.data.id } }
            - { call: "POST /api/bulk-installations/${inst}/set-status", payload: { target_status: "INSTALLED" }, as: PlantManager }
            - { call: "POST /api/bulk-installations/${inst}/set-status", payload: { target_status: "ACTIVE" }, as: PlantManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /api/telemetry-readings", payload: { installation_id: "${inst}", measured_level_liters: 350, measured_at: "2026-08-01T01:00:00Z", source: "IOT_SENSOR" }, as: LogisticsCoordinator }
            - { call: "GET /api/replenishment-orders", as: LogisticsCoordinator }
            - { call: "POST /api/telemetry-readings", payload: { installation_id: "${inst}", measured_level_liters: 300, measured_at: "2026-08-01T02:00:00Z", source: "IOT_SENSOR" }, as: LogisticsCoordinator }
            - { call: "GET /api/replenishment-orders", as: LogisticsCoordinator }
          assert:
            - "After the 350 reading: exactly one PENDING ReplenishmentOrder for ${inst} with requested_qty_liters == 3000 (min(5000-350, 20000, 3000)) and scheduled_delivery_at == 2026-08-02T06:00:00Z (clock + 24h)"
            - "After the 300 reading: still exactly one PENDING order (no duplicate while PENDING exists)"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate
        grounds:
                 - "complexity_profile"
                 - "endpoints"
        distinguishing_aspect: "Immediate consistency: the POST response body and a subsequent GET agree field-for-field; an over-payment against a zero balance is rejected with ERR_INVALID_REQUEST and leaves version untouched."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { account_name: "C-CM1", billing_variant: "GRACE_PERIOD", free_days: 3, credit_limit_cents: 50000 }, as: BillingClerk, captures: { cu: $.data.id, v: $.data.version, out0: $.data.outstanding_balance_cents } }
            - { call: "GET /api/customers/${cu}", as: BillingClerk, captures: { g_v: $.data.version, g_out: $.data.outstanding_balance_cents } }
            - { call: "POST /api/customers/${cu}/payments", payload: { amount_cents: 1 }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "POST response shows status ACTIVE, outstanding_balance_cents == 0, version == 1"
            - "GET agrees: same id, version == 1, outstanding == 0"
            - "Payment of 1 cent against a zero balance: error_id == ERR_INVALID_REQUEST; version still 1 and outstanding still 0 afterwards"
