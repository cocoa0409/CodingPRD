      - name: patch_agency_capacity_below_active_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_CAPACITY_BELOW_ACTIVE]"]
        distinguishing_aspect: "Shrinking weekly_capacity below the live active_referral_count (2) is rejected with ERR_CAPACITY_BELOW_ACTIVE; shrinking to exactly the active count succeeds (>= comparison)."
        test_recipe:
