      - name: brand_manager_who_submitted_line_cannot_brand_approve
        claim_type: "segregation of duties"
        grounds:
          - roles.BrandManager
          - entities.LicensedLine.fields.submitted_by_user_id
          - errors.ERR_SOD_VIOLATION
          - state_machines.LicensedLine.BRAND_REVIEW_to_APPROVED
        distinguishing_aspect: "Segregation of duties inside a single role: bm-1 submitted the line, so bm-1 cannot BRAND_APPROVE it (403 ERR_SOD_VIOLATION); bm-2 — same role, different person — approves successfully."
        test_recipe:
