        distinguishing_aspect: "The reviewing coordinator's X-User-ID must differ from PublicWarning.drafted_by_user_id: coord-1 reviewing its own draft gets HTTP 403 ERR_SEGREGATION_OF_DUTIES while coord-2 succeeds."
        test_recipe:
