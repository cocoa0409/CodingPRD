        distinguishing_aspect: "When the award's only non-VOIDED QEI reaches UNWOUND, the award auto-transitions ACTIVE -> COMPLIANCE_PERIOD_CLOSED and its ACTIVE benefits agreement is CLOSED — a bubble-up nobody requested. The chain also shows the duplicate-open guard (ERR_UNWIND_ALREADY_OPEN) and a put exercise priced at the flat 100,000 cent floor."
        test_recipe:
          setup:
            - "Canonical single-QEI structure: award 5,000,000,000 signed 2026-09-01; QEI 100,000,000 issued 2026-09-01 (fees 5,000,000 at the 500bps tier, net 95,000,000); one QLICI of 85,000,000 to a SEVERE-tract QALICB; uninvested cash 10,000,000."
            - "All seven annual tests recorded as PASS at each 365-day year end: 2027-09-01, 2028-08-31, 2029-08-31, 2030-08-31, 2031-08-31, 2032-08-30, 2033-08-30 (direct tracing 85,000,000/95,000,000 = 89.47 >= 85.00 each year)."
            - "The clock ends at 2033-08-30, exactly 2555 days after issuance, so the option window is open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Gulf Coast CDE", certification_number: "CDE-2869-109", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
