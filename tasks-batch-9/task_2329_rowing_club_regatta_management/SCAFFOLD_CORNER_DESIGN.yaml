scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_member_creation_returns_full_row_with_computed_access_level
        claim_type: creation
        grounds:
          - entities.Member
          - endpoints[POST /boathouse/members]
        distinguishing_aspect: "POST /boathouse/members with every declared input present returns 201 and echoes all input fields while system and computed fields (membership_status ACTIVE, dues_balance_cents 0, logged_session_count 0, boathouse_access_level FULL) are server-set."
        test_recipe:
          setup:
            - "empty database, logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls: []
          trigger:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH", "ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z", coxswain_cert_expires_at: "2027-01-01T00:00:00Z", coach_cert_expires_at: "2027-01-01T00:00:00Z", safety_launch_cert_expires_at: "2027-01-01T00:00:00Z", launch_supervision_limit: 3 }
              as: ClubAdmin
              captures: { m_id: $.data.id }
            - call: "GET /boathouse/members/${m_id}"
              payload: {}
              as: ClubAdmin
          assert:
            - "the create call returns HTTP 201 with response_type == object"
            - "Member.${m_id}.full_name == Cora Coach, tier == COMPETITIVE, body_weight_kg == 78.0, launch_supervision_limit == 3 and club_roles == [COACH, ATHLETE]"
            - "Member.${m_id}.membership_status == ACTIVE, dues_balance_cents == 0, logged_session_count == 0 and boathouse_access_level == FULL"
            - "the GET returns the identical field values as the create response"

      - name: corner_member_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.Member.club_roles
          - entities.Member.launch_supervision_limit
          - entities.Member.swim_test_passed_on
        distinguishing_aspect: "Omitting every optional input yields club_roles == [], launch_supervision_limit == 2 and null for all three certification instants plus swim_test_passed_on."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /boathouse/members"
              payload: { full_name: "Plain Member", tier: "RECREATIONAL", body_weight_kg: 70.0 }
              as: ClubAdmin
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.club_roles == []"
            - "Member.${m_id}.launch_supervision_limit == 2"
            - "Member.${m_id}.swim_test_passed_on == null, coxswain_cert_expires_at == null, coach_cert_expires_at == null and safety_launch_cert_expires_at == null"
            - "Member.${m_id}.membership_status == ACTIVE"

      - name: corner_member_system_fields_generated_at_creation
        claim_type: system_fields
        grounds:
          - entities.Member
          - endpoints[POST /boathouse/members]
        distinguishing_aspect: "id, created_at, updated_at and version are server-generated on creation: version == 1 on a freshly created Member and membership_status is set by the state machine's initial_state rather than by input."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /boathouse/members"
              payload: { full_name: "Sys Fields", tier: "LEARN_TO_ROW", body_weight_kg: 64.0 }
              as: ClubAdmin
              captures: { m_id: $.data.id, m_v: $.data.version }
          assert:
            - "Member.${m_id}.id is a non-empty server-generated string and equals ${m_id}"
            - "Member.${m_id}.version == 1 and ${m_v} == 1"
            - "Member.${m_id}.created_at and updated_at are both populated and equal 2026-08-01T00:00:00Z, the logical clock"
            - "the response envelope carries meta.api_request_id and meta.api_request_timestamp"

      - name: corner_shell_condition_indices_and_slot_units_are_computed
        claim_type: computed_fields
        grounds:
          - entities.Shell.condition_index_conservative
          - entities.Shell.condition_index_optimistic
          - entities.Shell.slot_units
          - calculations.shell_condition_index
        distinguishing_aspect: "A hull with no damage reports is created with condition_index_conservative == 100 and condition_index_optimistic == 100, and slot_units is derived from boat_class (2 for a 4+) rather than supplied."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Quad Star", boat_class: "4+", hull_weight_kg: 51.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { s_id: $.data.id }
          assert:
            - "Shell.${s_id}.condition_index_conservative == 100 and condition_index_optimistic == 100"
            - "Shell.${s_id}.slot_units == 2 (CLASS_SLOT_UNITS for 4+)"
            - "Shell.${s_id}.status == AVAILABLE and tier_restriction == ANY"

      - name: corner_shell_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /boathouse/shells]
        distinguishing_aspect: "With three hulls stored, GET /boathouse/shells?limit=2&offset=0 returns 2 rows with total_count == 3 and has_more == true, and offset=2 returns the remaining 1 row with has_more == false."
        test_recipe:
          setup:
            - "three hulls created in a known order"
          setup_api_calls:
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Hull A", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { a_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Hull B", boat_class: "1X", hull_weight_kg: 14.2, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { b_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Quad Star", boat_class: "4+", hull_weight_kg: 51.0, home_bay: "BAY-2" }
              as: ClubAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /boathouse/shells"
              payload: { limit: 2, offset: 0 }
              as: ClubAdmin
            - call: "GET /boathouse/shells"
              payload: { limit: 2, offset: 2 }
              as: ClubAdmin
            - call: "GET /boathouse/shells"
              payload: { boat_class: "1X" }
              as: ClubAdmin
          assert:
            - "the first call returns exactly 2 rows with total_count == 3 and has_more == true, ordered created_at ASC so the first row is ${a_id}"
            - "the second call returns exactly 1 row (${c_id}) with total_count == 3 and has_more == false"
            - "the third call returns exactly 2 rows, ${a_id} and ${b_id}, with total_count == 2 and has_more == false"
            - "every list response carries response_type == array"

      - name: corner_member_get_unknown_id_returns_404_member_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_MEMBER_NOT_FOUND]
        distinguishing_aspect: "A GET on a syntactically valid but absent member id returns HTTP 404 with data.error_id == ERR_MEMBER_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "one member exists so the collection is non-empty"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Plain Member", tier: "RECREATIONAL", body_weight_kg: 70.0 }
              as: ClubAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /boathouse/members/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ClubAdmin
          assert:
            - "the call returns HTTP 404 with data.error_id == ERR_MEMBER_NOT_FOUND and a non-empty data.message"
            - "GET /boathouse/members/${m_id} still returns HTTP 200, proving only the unknown id is rejected"

      - name: corner_member_create_missing_body_weight_returns_422
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.Member.body_weight_kg
        distinguishing_aspect: "body_weight_kg has source input with no default, so omitting it returns HTTP 422 ERR_INVALID_REQUEST and creates no Member row."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /boathouse/members"
              payload: { full_name: "No Weight", tier: "RECREATIONAL" }
              as: ClubAdmin
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /boathouse/members returns total_count == 0"

      - name: corner_shell_create_unknown_boat_class_enum_returns_422
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - entities.Shell.boat_class
        distinguishing_aspect: "boat_class is constrained to 1X, 2X, 4+ and 8+, so the value 3X returns HTTP 422 ERR_INVALID_REQUEST and no hull is stored."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Odd Boat", boat_class: "3X", hull_weight_kg: 20.0, home_bay: "BAY-1" }
              as: ClubAdmin
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /boathouse/shells returns total_count == 0"

      - name: corner_dues_invoice_billable_months_out_of_range_returns_422
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - entities.DuesInvoice.billable_months
        distinguishing_aspect: "billable_months is constrained to the integer range 1..12, so 13 returns HTTP 422 ERR_INVALID_REQUEST while 12 is accepted."
        test_recipe:
          setup:
            - "one RECREATIONAL member"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Rita Rower", tier: "RECREATIONAL", body_weight_kg: 70.0 }
              as: ClubAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /boathouse/dues-invoices"
              payload: { member_id: "${m_id}", season_year: 2026, billable_months: 13, due_at: "2026-09-01T00:00:00Z" }
              as: ClubAdmin
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /boathouse/members/${m_id}/dues-invoices returns total_count == 0 and Member.${m_id}.dues_balance_cents == 0"

      - name: corner_dues_invoice_unknown_member_fk_returns_404
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_MEMBER_NOT_FOUND]
          - entities.DuesInvoice.member_id
        distinguishing_aspect: "DuesInvoice declares Member as its parent, so a body FK naming an absent member returns HTTP 404 ERR_MEMBER_NOT_FOUND rather than 422."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /boathouse/dues-invoices"
              payload: { member_id: "00000000-0000-0000-0000-0000000000ff", season_year: 2026, billable_months: 12, due_at: "2026-09-01T00:00:00Z" }
              as: ClubAdmin
          assert:
            - "the call returns HTTP 404 with data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: corner_water_condition_reading_immutable_row_with_computed_posture
        claim_type: immutability
        grounds:
          - entities.WaterConditionReading
          - calculations.water_posture_evaluation
        distinguishing_aspect: "WaterConditionReading is declared common_fields: false — §1.5 exposes only a create and two reads for it, so cold_water_flag and posture are frozen at creation and a re-read returns byte-identical values."
        test_recipe:
          setup:
            - "one member acting as SafetyOfficer"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Sam Officer", tier: "COMPETITIVE", body_weight_kg: 80.0 }
              as: ClubAdmin
              captures: { officer_id: $.data.id }
          trigger:
            - call: "POST /boathouse/water-condition-readings"
              payload: { observed_at: "2026-08-01T05:00:00Z", air_temp_c: 20.0, water_temp_c: 18.0, wind_speed_kt: 5.0, visibility_m: 3000, traffic_pattern: "STANDARD_COUNTERCLOCKWISE" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
              captures: { reading_id: $.data.id }
            - call: "GET /boathouse/water-condition-readings/${reading_id}"
              payload: {}
              as: SafetyOfficer
              as_user_id: "${officer_id}"
          assert:
            - "WaterConditionReading.${reading_id}.cold_water_flag == false and posture == OPEN at creation"
            - "the GET returns identical air_temp_c 20.0, water_temp_c 18.0, wind_speed_kt 5.0, visibility_m 3000, cold_water_flag false and posture OPEN"
            - "§1.5 declares no PATCH, PUT or DELETE for /boathouse/water-condition-readings, so the row is immutable by construction"

      - name: corner_regatta_entries_list_filters_by_regatta_and_status
        claim_type: listing
        grounds:
          - endpoints[GET /boathouse/regatta-entries]
        distinguishing_aspect: "GET /boathouse/regatta-entries filtered by regatta_id returns only that regatta's entries, and adding status=DRAFT narrows to the single undeclared entry."
        test_recipe:
          setup:
            - "one coach, two 1X hulls, two HOME regattas, one DRAFT entry in each regatta plus a second DRAFT entry in the first regatta"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Row One", tier: "COMPETITIVE", body_weight_kg: 82.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Hull A", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_a_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Hull B", boat_class: "1X", hull_weight_kg: 14.2, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_b_id: $.data.id }
            - call: "POST /boathouse/regattas"
              payload: { name: "Club Head Race", host_club: "Home RC", venue_kind: "HOME", race_date_at: "2026-08-12T08:00:00Z", entry_deadline_at: "2026-08-10T00:00:00Z", scratch_deadline_at: "2026-08-11T00:00:00Z", weigh_in_opens_at: "2026-08-12T06:00:00Z", weigh_in_closes_at: "2026-08-12T07:00:00Z" }
              as: ClubAdmin
              captures: { reg1_id: $.data.id }
            - call: "POST /boathouse/regattas"
              payload: { name: "Autumn Sprints", host_club: "Home RC", venue_kind: "HOME", race_date_at: "2026-09-12T08:00:00Z", entry_deadline_at: "2026-09-10T00:00:00Z", scratch_deadline_at: "2026-09-11T00:00:00Z", weigh_in_opens_at: "2026-09-12T06:00:00Z", weigh_in_closes_at: "2026-09-12T07:00:00Z" }
              as: ClubAdmin
              captures: { reg2_id: $.data.id }
            - call: "POST /boathouse/regatta-entries"
              payload: { regatta_id: "${reg1_id}", shell_id: "${shell_a_id}", event_code: "M1X_OPEN", boat_class: "1X", seed_time_seconds: 380.0 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { e1_id: $.data.id, e1_v: $.data.version }
            - call: "POST /boathouse/regatta-entries"
              payload: { regatta_id: "${reg1_id}", shell_id: "${shell_b_id}", event_code: "M1X_OPEN", boat_class: "1X", seed_time_seconds: 385.0 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /boathouse/regatta-entries"
              payload: { regatta_id: "${reg2_id}", shell_id: "${shell_a_id}", event_code: "M1X_OPEN", boat_class: "1X", seed_time_seconds: 390.0 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { e3_id: $.data.id }
            - call: "POST /boathouse/regatta-entries/${e1_id}/lineup"
              payload: { expected_regatta_entry_version: "${e1_v}", seats: [{ member_id: "${r1_id}", seat_number: 1, seat_role: "ROWER" }] }
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "GET /boathouse/regatta-entries"
              payload: { regatta_id: "${reg1_id}" }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "GET /boathouse/regatta-entries"
              payload: { regatta_id: "${reg1_id}", status: "DRAFT" }
              as: Coach
              as_user_id: "${coach_id}"
          assert:
            - "the first call returns total_count == 2 containing ${e1_id} and ${e2_id} and excluding ${e3_id}"
            - "the second call returns total_count == 1 containing only ${e2_id}, since ${e1_id} has advanced to LINEUP_DECLARED"
            - "RegattaEntry.${e1_id}.status == LINEUP_DECLARED and RegattaEntry.${e2_id}.status == DRAFT"

  - section: state_machines
    instances:
      - name: corner_regatta_entry_initial_state_is_draft_with_zero_fees
        claim_type: initial_state
        grounds:
          - state_machines.RegattaEntry
          - entities.RegattaEntry.status
        distinguishing_aspect: "A freshly created RegattaEntry starts in the declared initial_state DRAFT with submitted_at null and all four fee fields at 0, since fees are only computed at submit."
        test_recipe:
          setup:
            - "one certified coach, one 1X hull, one HOME regatta OPEN_FOR_ENTRY"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /boathouse/regattas"
              payload: { name: "Club Head Race", host_club: "Home RC", venue_kind: "HOME", race_date_at: "2026-08-12T08:00:00Z", entry_deadline_at: "2026-08-10T00:00:00Z", scratch_deadline_at: "2026-08-11T00:00:00Z", weigh_in_opens_at: "2026-08-12T06:00:00Z", weigh_in_closes_at: "2026-08-12T07:00:00Z" }
              as: ClubAdmin
              captures: { regatta_id: $.data.id }
          trigger:
            - call: "POST /boathouse/regatta-entries"
              payload: { regatta_id: "${regatta_id}", shell_id: "${shell_id}", event_code: "M1X_OPEN", boat_class: "1X", seed_time_seconds: 380.0 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { entry_id: $.data.id }
          assert:
            - "RegattaEntry.${entry_id}.status == DRAFT"
            - "RegattaEntry.${entry_id}.submitted_at == null, refund_cents == null, rack_tier == null and trailer_load_id == null"
            - "RegattaEntry.${entry_id}.base_fee_cents == 0, transport_levy_cents == 0, late_fee_cents == 0 and total_fee_cents == 0"
            - "Regatta.${regatta_id}.status == OPEN_FOR_ENTRY and net_fee_cents == 0"

      - name: corner_major_damage_report_side_effects_on_creation
        claim_type: side_effect_execution
        grounds:
          - state_machines.Shell.AVAILABLE_to_DAMAGED
          - state_machines.DamageReport
          - calculations.shell_condition_index
        distinguishing_aspect: "Filing one MAJOR report against an undamaged hull leaves the report in its initial_state REPORTED, drives the Shell AVAILABLE -> DAMAGED, and sets severity_points to 18 so both condition indices read exactly 82."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default, one certified coach as reporter, one AVAILABLE 1X hull with no prior reports"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
          trigger:
            - call: "POST /boathouse/damage-reports"
              payload: { shell_id: "${shell_id}", reported_by_member_id: "${coach_id}", severity: "MAJOR", narrative: "cracked rib at station 4" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { report_id: $.data.id }
          assert:
            - "DamageReport.${report_id}.status == REPORTED with reported_at == 2026-08-01T00:00:00Z and severity_points == 18"
            - "Shell.${shell_id}.status == DAMAGED"
            - "Shell.${shell_id}.condition_index_conservative == 82 and condition_index_optimistic == 82 (100 minus an undecayed MAJOR contribution of 18)"

      - name: corner_member_status_transition_active_to_active_returns_409
        claim_type: invalid_transitions
        grounds:
          - validations[priority=22]
          - errors[ERR_INVALID_STATUS_TRANSITION]
          - state_machines.Member
        distinguishing_aspect: "ACTIVE -> ACTIVE is not a declared Member transition, so requesting to_status=ACTIVE on an ACTIVE member returns HTTP 409 ERR_INVALID_STATUS_TRANSITION and leaves membership_status untouched."
        test_recipe:
          setup:
            - "one ACTIVE member"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Rita Rower", tier: "RECREATIONAL", body_weight_kg: 70.0 }
              as: ClubAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /boathouse/members/${m_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ClubAdmin
          assert:
            - "the call returns HTTP 409 with data.error_id == ERR_INVALID_STATUS_TRANSITION"
            - "Member.${m_id}.membership_status == ACTIVE and boathouse_access_level == FULL, unchanged"

      - name: corner_member_withdrawn_is_terminal_and_reactivation_returns_409
        claim_type: terminal_state_lockdown
        grounds:
          - validations[priority=8]
          - errors[ERR_ALREADY_TERMINAL]
          - state_machines.Member.ACTIVE_to_WITHDRAWN
        distinguishing_aspect: "WITHDRAWN is Member's only terminal state, so after ACTIVE -> WITHDRAWN a to_status=ACTIVE request returns HTTP 409 ERR_ALREADY_TERMINAL — the terminal check at priority 8 outranks the transition-legality check at priority 22."
        test_recipe:
          setup:
            - "one member already driven ACTIVE -> WITHDRAWN"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Gone Rower", tier: "RECREATIONAL", body_weight_kg: 70.0 }
              as: ClubAdmin
              captures: { m_id: $.data.id }
            - call: "POST /boathouse/members/${m_id}/status-transitions"
              payload: { to_status: "WITHDRAWN" }
              as: ClubAdmin
          trigger:
            - call: "POST /boathouse/members/${m_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ClubAdmin
          assert:
            - "the call returns HTTP 409 with data.error_id == ERR_ALREADY_TERMINAL"
            - "Member.${m_id}.membership_status == WITHDRAWN and boathouse_access_level == NONE"

      - name: corner_session_launch_before_clearance_returns_409_not_cleared
