              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /mint/production-runs/${run1}/start"
              as: ProductionPlanner
            - call: "POST /mint/production-runs/${run1}/inspect"
              payload: { outcome: "PASS", good_pieces: 9800 }
              as: QualityInspector
            - call: "POST /mint/error-coin-cases"
              payload: { production_run_id: "${run1}", error_pieces: 200 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "DENVER", press_line: "P1", planned_start: "2026-10-05T10:00:00Z", planned_end: "2026-10-05T12:00:00Z", planned_quantity: 5000 }
              as: ProductionPlanner
              captures: { run2: $.data.id }
          trigger:
            - call: "POST /mint/production-runs/${run2}/start"
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_QUALITY_THRESHOLD_BREACH (200 / (9800 + 200) == 0.02 >= 0.02)"
            - "ProductionRun.${run2}.status remains PLANNED"

      - name: error_rate_just_below_threshold_passes
        claim_type: correct_result
        grounds: ["calculations.error_rate_threshold"]
        distinguishing_aspect: "One piece under the boundary: 199 / 10000 == 0.0199 < 0.02 does NOT breach; the next run starts normally."
        test_recipe:
