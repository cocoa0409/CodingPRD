  - name: cdispecialist_cannot_finalize_coding
    claim_type: rbac_denial
    grounds:
    - roles.HIMCoder
    - endpoints[POST /api/cdi-programs/{programId}/patient-cases/{caseId}/finalize-coding]
    distinguishing_aspect: CDISpecialist attempts finalize-coding -> ERR_UNAUTHORIZED (segregation of duties).
    test_recipe:
      setup:
      - discharged case
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 1
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
          cv: $.data.version
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 2
        as: CDIManager
      trigger:
      - call: POST /api/patient-cases/${case}/finalize-coding
        payload:
          coder_drg_code: A
          coder_drg_weight: 1.0
          expected_case_version: ${cv}
        as: CDISpecialist
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_UNAUTHORIZED
  - name: compliance_auditor_can_create_denial_target_but_not_policy
    claim_type: rbac_shared_vs_exclusive
    grounds:
    - roles.ComplianceAuditor
    - roles.CDIManager
    distinguishing_aspect: ComplianceAuditor can POST /denial-risk-targets (shared) but cannot POST /escalation-policies (CDIManager exclusive).
    test_recipe:
      setup:
      - program
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      trigger:
      - call: POST /api/denial-risk-targets
        payload:
          cdi_program_id: ${prog}
          drg_code: A
          required_evidence_tags:
          - t
          severity_floor: 2
          active_from_period: 0
          active_to_period: 10
        as: ComplianceAuditor
        captures:
          tgt: $.data.id
      - call: POST /api/escalation-policies
        payload:
          cdi_program_id: ${prog}
          name: EP
          response_due_periods: 1
          escalation_stage_periods: 1
          max_escalation_stage: 1
          is_default: true
        as: ComplianceAuditor
        captures:
          err: $.data.error_id
      assert:
      - DenialRiskTarget.${tgt} created (201)
      - error_id == ERR_UNAUTHORIZED
- section: cross_cutting_complexity_layers
  instances:
  - name: occ_finalize_coding_stale_version
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[patient-case-finalize-stale-version]
    distinguishing_aspect: Stale expected_case_version on finalize-coding returns 412 ERR_STALE_VERSION; fresh version succeeds.
    test_recipe:
      setup:
      - discharged case; client observed version v_observed; another writer mutates the case (clock advance does not touch case, so use an AGREE response to bump case.version)
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/escalation-policies
        payload:
          cdi_program_id: ${prog}
          name: EP
          response_due_periods: 10
          escalation_stage_periods: 10
          max_escalation_stage: 1
          is_default: true
        as: CDIManager
        captures:
          ep: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 1
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
          v_obs: $.data.version
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-queries
        payload:
          cdi_review_id: ${rev}
          provider_id: ${prov}
          escalation_policy_id: ${ep}
          query_text: t
          clinical_indicators:
          - x
          proposed_drg_code: B
          proposed_drg_weight: 2.0
          proposed_soi: 2
          proposed_rom: 2
        as: CDISpecialist
        captures:
          q: $.data.id
          q_ver: $.data.version
      - call: POST /api/cdi-queries/${q}/send
        payload:
          expected_query_version: ${q_ver}
        as: CDISpecialist
      - call: POST /api/cdi-queries/${q}/responses
        payload:
          response_type: AGREE
          response_text: ok
        as: Provider
        as_user_id: ${prov}
      - call: GET /api/cdi-reviews/${rev}
        payload: {}
        as: CDISpecialist
        captures:
          rev_v: $.data.version
      - call: POST /api/cdi-reviews/${rev}/close
        payload:
          closed_reason: OPPORTUNITY_CAPTURED
          expected_review_version: ${rev_v}
        as: CDISpecialist
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 2
        as: CDIManager
      trigger:
      - call: POST /api/patient-cases/${case}/finalize-coding
        payload:
          coder_drg_code: B
          coder_drg_weight: 2.0
          expected_case_version: ${v_obs}
        as: HIMCoder
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_STALE_VERSION
  - name: occ_query_send_stale_version_after_edit
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[query-send-stale-version]
    distinguishing_aspect: Caller reads DRAFT query at v=N, edit bumps to v=N+1, send with expected_query_version=N -> 412.
    test_recipe:
