      - name: duty_release_restores_member_and_mark_boat_minute_ledgers
        conserved_quantity: "integer volunteer minutes on two independent ledgers at once: sum over ClubMembers of assigned_duty_minutes == sum over MarkBoats of committed_minutes restricted to boat-bearing rows == sum of duty_minutes over DutyAssignment rows with status in PROPOSED or CONFIRMED, per calculations.duty_minutes_ledger"
        forward_action: "POST /duty-assignments creating an 8-hour MARK_BOAT_DRIVER duty, then POST /duty-assignments/{id}/confirm, which must move neither ledger"
        compensating_action: "POST /duty-assignments/{id}/release, which must subtract exactly duty_minutes from BOTH ledgers and leave the sibling duty intact"
        grounds:
          - calculations.duty_minutes_ledger
          - state_machines.DutyAssignment.status.CONFIRMED_to_RELEASED
          - endpoints.POST_duty_assignments_id_release
          - entities.ClubMember.fields.assigned_duty_minutes
          - entities.MarkBoat.fields.committed_minutes
        distinguishing_aspect: |
          A different KIND of conserved quantity from the scoring invariant: integer capacity minutes,
          and the same release has to settle TWO ledgers on two different entity types at once, one on a
          person and one on a vessel. Two traps are built in. First, confirming between create and
          release must be a no-op on both ledgers, because PROPOSED rows already counted; an
          implementation that adds minutes at confirm reads 960 on the member and then goes NEGATIVE or
          leaves 480 residue after the release. Second, a sibling duty from a different driver occupies
          the same 8 hours on the same mark boat, so a release that recomputes the boat ledger as zero
          instead of subtracting exactly 480 is caught by the surviving 480.
        test_recipe:
          setup:
            - "Three club members: the regatta chair and two mark boat drivers."
            - "A regatta in status SI_PUBLISHED chartering one mark boat with the default concurrent_assignment_limit 2 and turnaround_buffer_minutes 20."
            - "Driver one and driver two each hold a MARK_BOAT_DRIVER duty on that boat over the half-open window [12:00, 20:00) on 2026-08-05, worth 480 minutes each; the second is accepted because only one widened window intersects it, which is below the limit of 2."
            - "Driver one duty is then CONFIRMED, which by contract moves neither ledger."
            - "Before the trigger: driver one 480, driver two 480, mark boat 960."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Kit Marsh", email: "kit.marsh@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_v1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Ada Nunn", email: "ada.nunn@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_v2: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Duty Ledger Regatta", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg_v2: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "SI", body_summary: "Sailing instructions revision 1", effective_utc: "2026-07-15T00:00:00Z", expected_regatta_version: "${reg_v2}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/mark-boats", payload: { regatta_id: "${reg}", call_sign: "MB-BRAVO", crew_capacity: 4 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { mb: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_v1}", mark_boat_id: "${mb}", position: "MARK_BOAT_DRIVER", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d_1: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_v2}", mark_boat_id: "${mb}", position: "MARK_BOAT_DRIVER", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d_2: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments/${d_1}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
          trigger:
            - { call: "POST /regatta-ops/duty-assignments/${d_1}/release", payload: { release_reason_code: "ILLNESS" }, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "DutyAssignment.${d_1}.status == RELEASED with duty_minutes still 480 and release_reason_code ILLNESS, so the row keeps its magnitude for audit"
            - "member ledger settled exactly: ClubMember.${m_v1}.assigned_duty_minutes == 0, its pre-create value, with no negative residue"
            - "mark boat ledger settled exactly: MarkBoat.${mb}.committed_minutes == 480, not 0 and not 960, because the sibling duty ${d_2} still stands"
            - "the sibling is untouched: DutyAssignment.${d_2}.status == PROPOSED with duty_minutes 480 and ClubMember.${m_v2}.assigned_duty_minutes == 480"
            - "the identity holds: 0 + 480 on the member side equals 480 on the boat side equals the single non-RELEASED 480-minute row"
            - "confirming was a no-op on both ledgers: DutyAssignment.${d_1}.version == 2 from the confirm alone, while the ledger values before the trigger were 480, 480 and 960"
            - "ClubMember.${m_v1}.version == 3: one increment at enrolment, one at duty create and one at release"
            - "GET /regatta-ops/duty-assignments?mark_boat_id=${mb} returns total_count 2, so the RELEASED row remains queryable"
