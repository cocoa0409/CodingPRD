# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules x >=2 instances. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: recycling_credit_provisional_vs_final
        grounds:
          - calculations.recycling_credit
          - state_machines.RecyclingBatch.ACCUMULATING_to_SEALED
          - state_machines.RecyclingBatch.SEALED_to_PICKED_UP
        distinguishing_aspect: |
          RecyclingBatch fiscal domain: the provisional variant (per-item estimated
          weights x per-category rates, per-item rounding then sum) and the final
          variant (actual total scale weight x tiered single rate) value the SAME
          five items differently — 45 cents vs 64 cents.
        test_recipe:
          setup:
            - "Batch of 5 REJECT items: 3 CHILDRENS + 2 ACCESSORIES, swept into a 50kg recycling batch"
            - "Clock at default 2026-08-01T00:00:00Z; sorting volunteer checked in on a SORTING shift"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 2 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "Donor A", item_count_declared: 5 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: CHILDRENS, season: ALL_SEASON, quality_grade: REJECT }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: CHILDRENS, season: ALL_SEASON, quality_grade: REJECT }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: CHILDRENS, season: ALL_SEASON, quality_grade: REJECT }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ACCESSORIES, season: ALL_SEASON, quality_grade: REJECT }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ACCESSORIES, season: ALL_SEASON, quality_grade: REJECT }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/recycling-batches", payload: { recycler_name: "TexCycle", capacity_kg: 50 }, as: ProgramAdmin, captures: { rb_id: $.data.id } }
            - { call: "POST /closet/recycling-batches/${rb_id}/sweep", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /closet/recycling-batches/${rb_id}/seal", payload: {}, as: ProgramAdmin, as_user_id: "admin-1", captures: { prov: $.data.provisional_credit_cents, est_w: $.data.est_weight_kg } }
            - { call: "POST /closet/recycling-batches/${rb_id}/pickup", payload: { actual_weight_kg: 1.60 }, as: ProgramAdmin, as_user_id: "admin-2", captures: { fin: $.data.final_credit_cents } }
          assert:
            - "est_w == 1.30"
            - "prov == 45  (3*round_half_up(0.30*38)=33 plus 2*round_half_up(0.20*30)=12)"
            - "fin == 64  (round_half_up(1.60*40); 1.60kg < 100kg tier)"
            - "prov != fin for the identical item set"
            - "RecyclingBatch.${rb_id}.status == PICKED_UP"

      - name: zone_turnover_current_vs_average_basis
        grounds:
          - calculations.inventory_turnover
          - entities.StorageZone.fields.current_stock
        distinguishing_aspect: |
          StorageZone analytics domain (distinct from RecyclingBatch fiscal): with
          identical inputs the current-basis denominator (live stock 2) yields 1.0000
          while the average-basis denominator (mean of window-start 0 and current 2)
          yields 2.0000.
        test_recipe:
          setup:
            - "Zone ZA capacity 100; 4 GOOD ADULT_TOPS items stocked then 2 distributed to one client in a single visit"
            - "All events at default clock, inside the trailing 28d window"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 2 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZA", season_policy: ALL_SEASON, capacity_items: 100 }, as: ProgramAdmin, captures: { z_id: $.data.id } }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "Donor B", item_count_declared: 4 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i1: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i2: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i3: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i4: $.data.id } }
            - { call: "POST /closet/items/${i1}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/items/${i2}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/items/${i3}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/items/${i4}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/clients", payload: { full_name: "Client A", household_size: 3 }, as: Volunteer, as_user_id: "${v1_id}", captures: { c_id: $.data.id } }
            - { call: "POST /closet/clients/${c_id}/visits", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { vs_id: $.data.id } }
            - { call: "POST /closet/visits/${vs_id}/lines", payload: { item_id: "${i1}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/visits/${vs_id}/lines", payload: { item_id: "${i2}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/visits/${vs_id}/checkout", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
          trigger:
            - { call: "GET /closet/reports/impact", payload: { zone_id: "${z_id}" }, as: ProgramAdmin, captures: { t_cur: $.data.turnover_current_basis, t_avg: $.data.turnover_average_basis, s_start: $.data.stock_at_window_start, wd: $.data.window_distributed } }
          assert:
            - "wd == 2 and s_start == 0  (2 + 2 - 4)"
            - "t_cur == 1.0000  (2 / max(1, 2))"
            - "t_avg == 2.0000  (2 / round_half_up((0 + 2) / 2) = 2/1)"
            - "t_cur != t_avg for identical underlying data"

  - rule_id: combinatorial_formula
    instances:
      - name: visit_allowance_nested_min_tier_voucher
        grounds:
          - calculations.visit_item_allowance
          - state_machines.Voucher.ISSUED_to_REDEEMED
        distinguishing_aspect: |
          Mode (a): >=3 inputs (household_size, eligibility_tier, voucher bonus) with
          nested min() and a conditional HARDSHIP branch — hh4 HARDSHIP + 3-bonus
          voucher lands exactly on HARD_VISIT_CAP 24, while hh10 STANDARD clamps at
          HOUSEHOLD_CAP 16.
        test_recipe:
          setup:
            - "Partner with quota 10; client A hh=4 HARDSHIP holding a 3-bonus voucher; client B hh=10 STANDARD"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/referral-partners", payload: { name: "Agency A", base_voucher_quota: 10 }, as: ProgramAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /closet/clients", payload: { full_name: "A", household_size: 4, eligibility_tier: HARDSHIP }, as: Volunteer, as_user_id: "${v1_id}", captures: { ca_id: $.data.id } }
            - { call: "POST /closet/clients", payload: { full_name: "B", household_size: 10 }, as: Volunteer, as_user_id: "${v1_id}", captures: { cb_id: $.data.id } }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${ca_id}", bonus_items: 3, expires_at: "2026-09-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}", captures: { vo_id: $.data.id } }
          trigger:
            - { call: "POST /closet/clients/${ca_id}/visits", payload: { voucher_id: "${vo_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { ga_a: $.data.general_allowance, vb_a: $.data.voucher_bonus_applied } }
            - { call: "POST /closet/clients/${cb_id}/visits", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { ga_b: $.data.general_allowance, vb_b: $.data.voucher_bonus_applied } }
          assert:
            - "ga_a == 24  (min(24, round_half_up(min(16, 8+2*3) * 1.5) + 3) = min(24, 21+3))"
            - "vb_a == 3"
            - "ga_b == 16  (min(24, min(16, 8+2*9)))"
            - "vb_b == 0"

      - name: recycling_credit_per_item_rounding_order
        grounds:
          - calculations.recycling_credit
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned per-item-then-sum — three CHILDRENS
          items yield 33 cents (3 x round_half_up(11.4)); the alternative
          sum-then-round order would yield 34 (round_half_up(34.2)).
        test_recipe:
          setup:
            - "Batch of 3 REJECT CHILDRENS items swept into a recycling batch and sealed"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "Donor C", item_count_declared: 3 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: CHILDRENS, season: ALL_SEASON, quality_grade: REJECT }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: CHILDRENS, season: ALL_SEASON, quality_grade: REJECT }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: CHILDRENS, season: ALL_SEASON, quality_grade: REJECT }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/recycling-batches", payload: { recycler_name: "TexCycle", capacity_kg: 50 }, as: ProgramAdmin, captures: { rb_id: $.data.id } }
            - { call: "POST /closet/recycling-batches/${rb_id}/sweep", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /closet/recycling-batches/${rb_id}/seal", payload: {}, as: ProgramAdmin, as_user_id: "admin-1", captures: { prov: $.data.provisional_credit_cents, est_w: $.data.est_weight_kg } }
          assert:
            - "est_w == 0.90"
            - "prov == 33  (per-item rounding pinned; NOT 34 from aggregate rounding)"

      - name: voucher_quota_carryover_recursive
        grounds:
          - calculations.voucher_quota_carryover
          - entities.ReferralPartner.fields.current_month_quota
        distinguishing_aspect: |
          Mode (c): circular-looking dependency quota(m) = base + f(quota(m-1),
          issued(m-1)) is pinned to chronological month-ascending evaluation from the
          anchor month — Aug issues 7 of 10, so Sep quota is 13 and Oct quota is 11.
        test_recipe:
          setup:
            - "Partner base_voucher_quota 10 created at default clock (2026-08); 7 vouchers issued in Aug, 12 in Sep"
          setup_api_calls:
            - { call: "POST /closet/referral-partners", payload: { name: "Agency C", base_voucher_quota: 10 }, as: ProgramAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 2 }, as: ProgramAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /closet/referral-partners/${p_id}", payload: {}, as: ProgramAdmin, captures: { q_sep: $.data.current_month_quota, i_sep0: $.data.vouchers_issued_current_month } }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2027-01-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}" }
            - { call: "POST /closet/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /closet/referral-partners/${p_id}", payload: {}, as: ProgramAdmin, captures: { q_oct: $.data.current_month_quota, i_oct: $.data.vouchers_issued_current_month } }
          assert:
            - "q_sep == 13  (10 + min(5, 10-7))"
            - "i_sep0 == 0 at Sep 1"
            - "q_oct == 11  (10 + min(5, 13-12))"
            - "i_oct == 0 at Oct 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: item_quarantine_cycle_and_reject_branch
        grounds:
          - state_machines.Item.STOCKED_to_QUARANTINED
          - state_machines.Item.QUARANTINED_to_STOCKED
          - state_machines.Item.QUARANTINED_to_REJECTED
        distinguishing_aspect: |
          Item is cyclic: STOCKED -> QUARANTINED -> STOCKED loops are legal, and the
          same QUARANTINED state also branches to REJECTED — a non-linear machine on
          Item (distinct entity from the VolunteerShift cycle).
        test_recipe:
          setup:
            - "Zone cap 10; batch of 2 GOOD items stocked; lead volunteer registered"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/volunteers", payload: { full_name: "Lead One", is_lead: true }, as: ProgramAdmin, captures: { lead_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 2 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZQ", season_policy: ALL_SEASON, capacity_items: 10 }, as: ProgramAdmin, captures: { z_id: $.data.id } }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "Donor D", item_count_declared: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i1: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_BOTTOMS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i2: $.data.id } }
            - { call: "POST /closet/items/${i1}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/items/${i2}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
          trigger:
            - { call: "POST /closet/items/${i1}/quarantine", payload: {}, as: VolunteerLead, as_user_id: "${lead_id}" }
            - { call: "POST /closet/items/${i1}/release-quarantine", payload: { outcome: RESTOCK }, as: VolunteerLead, as_user_id: "${lead_id}", captures: { i1_st: $.data.status } }
            - { call: "POST /closet/items/${i2}/quarantine", payload: {}, as: VolunteerLead, as_user_id: "${lead_id}" }
            - { call: "POST /closet/items/${i2}/release-quarantine", payload: { outcome: REJECT }, as: VolunteerLead, as_user_id: "${lead_id}", captures: { i2_st: $.data.status } }
            - { call: "GET /closet/storage-zones/${z_id}", payload: {}, as: ProgramAdmin, captures: { z_stock: $.data.current_stock } }
          assert:
            - "i1_st == STOCKED  (completed the STOCKED -> QUARANTINED -> STOCKED loop)"
            - "i2_st == REJECTED  (branch from the same QUARANTINED state)"
            - "z_stock == 1  (only item 1 physically on the shelf)"

      - name: shift_open_locked_open_cycle
        grounds:
          - state_machines.VolunteerShift.OPEN_to_LOCKED
          - state_machines.VolunteerShift.LOCKED_to_OPEN
        distinguishing_aspect: |
          VolunteerShift is cyclic: OPEN -> LOCKED at capacity and LOCKED -> OPEN on
          cancellation — an auto-transition loop on a different entity than Item.
        test_recipe:
          setup:
            - "Two volunteers; one capacity-1 shift on 2026-08-05"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol Two", is_lead: false }, as: ProgramAdmin, captures: { v2_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T12:00:00Z", role_type: FLOOR, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su1: $.data.id } }
            - { call: "GET /closet/shifts/${sh_id}", payload: {}, as: ProgramAdmin, captures: { st_after_fill: $.data.status } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su1}/cancel", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "GET /closet/shifts/${sh_id}", payload: {}, as: ProgramAdmin, captures: { st_after_cancel: $.data.status } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v2_id}" }, as: Volunteer, as_user_id: "${v2_id}", captures: { su2: $.data.id } }
            - { call: "GET /closet/shifts/${sh_id}", payload: {}, as: ProgramAdmin, captures: { st_final: $.data.status } }
          assert:
            - "st_after_fill == LOCKED"
            - "st_after_cancel == OPEN  (cycle back)"
            - "st_final == LOCKED  (second cycle entry)"

  - rule_id: transitive_cascade
    instances:
      - name: checkout_item_zone_posture_cascade
        grounds:
          - state_machines.ClientVisit.CHECKED_IN_to_CHECKED_OUT
          - state_machines.Item.RESERVED_to_DISTRIBUTED
          - calculations.zone_posture
        distinguishing_aspect: |
          Depth-3 chain from POST /visits/{id}/checkout: line/item RESERVED ->
          DISTRIBUTED (hop 1) decrements zone.current_stock (hop 2), and the stock
          crossing below capacity recomputes zone.posture FULL -> AVAILABLE (hop 3).
        test_recipe:
          setup:
            - "Zone cap 2 holding 2 stocked GOOD items (posture FULL); client checked in with 1 line reserved"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZC", season_policy: ALL_SEASON, capacity_items: 2 }, as: ProgramAdmin, captures: { z_id: $.data.id } }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "Donor E", item_count_declared: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i1: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i2: $.data.id } }
            - { call: "POST /closet/items/${i1}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/items/${i2}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "GET /closet/storage-zones/${z_id}", payload: {}, as: ProgramAdmin, captures: { posture_pre: $.data.posture } }
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { c_id: $.data.id } }
            - { call: "POST /closet/clients/${c_id}/visits", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { vs_id: $.data.id } }
            - { call: "POST /closet/visits/${vs_id}/lines", payload: { item_id: "${i1}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { ln1: $.data.id } }
          trigger:
            - { call: "POST /closet/visits/${vs_id}/checkout", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "GET /closet/storage-zones/${z_id}", payload: {}, as: ProgramAdmin, captures: { z_stock: $.data.current_stock, posture_post: $.data.posture } }
            - { call: "GET /closet/items/${i1}", payload: {}, as: ProgramAdmin, captures: { i1_st: $.data.status } }
          assert:
            - "posture_pre == FULL  (2 >= 2)"
            - "i1_st == DISTRIBUTED  (hop 1)"
            - "z_stock == 1  (hop 2)"
            - "posture_post == AVAILABLE  (hop 3: 1 < ceil(0.8*2)=2)"

      - name: rotation_phaseout_phasein_posture_cascade
        grounds:
          - state_machines.SeasonalRotation.SCHEDULED_to_COMPLETED
          - state_machines.Item.STOCKED_to_OFF_SEASON
          - state_machines.Item.OFF_SEASON_to_STOCKED
          - calculations.seasonal_rotation_moves
        distinguishing_aspect: |
          Depth-3 chain from POST /seasonal-rotations/{id}/execute (a different
          trigger than checkout): each item move (hop 1) debits/credits
          zone.current_stock (hop 2) and flips zone.posture (hop 3); a second
          rotation executes the capacity-gated phase-in selector.
        test_recipe:
          setup:
            - "Zone ZW WINTER-policy cap 2 holding 2 WINTER items (FULL); rotation R1 target SUMMER, then rotation R2 target WINTER"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZW", season_policy: WINTER, capacity_items: 2 }, as: ProgramAdmin, captures: { z_id: $.data.id } }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "Donor F", item_count_declared: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: COATS, season: WINTER, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i1: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: COATS, season: WINTER, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i2: $.data.id } }
            - { call: "POST /closet/items/${i1}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/items/${i2}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/seasonal-rotations", payload: { target_season: SUMMER, window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }, as: ProgramAdmin, captures: { r1_id: $.data.id } }
            - { call: "POST /closet/seasonal-rotations", payload: { target_season: WINTER, window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }, as: ProgramAdmin, captures: { r2_id: $.data.id } }
          trigger:
            - { call: "POST /closet/seasonal-rotations/${r1_id}/execute", payload: {}, as: ProgramAdmin, captures: { r1_out: $.data.moved_out_count, r1_in: $.data.moved_in_count } }
            - { call: "GET /closet/storage-zones/${z_id}", payload: {}, as: ProgramAdmin, captures: { st_mid: $.data.current_stock, po_mid: $.data.posture } }
            - { call: "POST /closet/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /closet/seasonal-rotations/${r2_id}/execute", payload: {}, as: ProgramAdmin, captures: { r2_out: $.data.moved_out_count, r2_in: $.data.moved_in_count } }
            - { call: "GET /closet/storage-zones/${z_id}", payload: {}, as: ProgramAdmin, captures: { st_end: $.data.current_stock, po_end: $.data.posture } }
            - { call: "GET /closet/items/${i1}", payload: {}, as: ProgramAdmin, captures: { i1_st: $.data.status } }
          assert:
            - "r1_out == 2 and r1_in == 0  (phase-out cascade: item -> stock 0 -> posture)"
            - "st_mid == 0 and po_mid == AVAILABLE"
            - "r2_out == 0 and r2_in == 2  (phase-in selector restocks both, created_at ASC)"
            - "st_end == 2 and po_end == FULL"
            - "i1_st == STOCKED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: item_restock_state_beats_zone_full_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=16]
        distinguishing_aspect: |
          Category pair state vs business_constraint: stocking an already-STOCKED
          item into a FULL zone violates both rules; the state error
          ERR_INVALID_STATE (priority 7) must win over ERR_ZONE_FULL (priority 16).
        test_recipe:
          setup:
            - "Zone cap 1 already holding 1 stocked item (posture FULL); the stocked item is the request target"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/storage-zones", payload: { zone_code: "Z1", season_policy: ALL_SEASON, capacity_items: 1 }, as: ProgramAdmin, captures: { z_id: $.data.id } }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "Donor G", item_count_declared: 1 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i1: $.data.id } }
            - { call: "POST /closet/items/${i1}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
          trigger:
            - { call: "POST /closet/items/${i1}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE  (not ERR_ZONE_FULL, although the zone is also FULL)"

      - name: voucher_expired_temporal_beats_client_mismatch_referential
        grounds:
          - validations[priority=13]
          - validations[priority=31]
        distinguishing_aspect: |
          Category pair business_temporal vs business_referential (distinct from the
          state/constraint pair): redeeming an expired voucher issued to a DIFFERENT
          client violates both rules; ERR_VOUCHER_EXPIRED (priority 13) must win
          over ERR_VOUCHER_CLIENT_MISMATCH (priority 31).
        test_recipe:
          setup:
            - "Partner; voucher for client B expiring 2026-08-10; clock advanced past expiry; redemption attempted on client A's check-in"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/referral-partners", payload: { name: "Agency B", base_voucher_quota: 5 }, as: ProgramAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /closet/clients", payload: { full_name: "A", household_size: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { ca_id: $.data.id } }
            - { call: "POST /closet/clients", payload: { full_name: "B", household_size: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { cb_id: $.data.id } }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${cb_id}", bonus_items: 2, expires_at: "2026-08-10T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}", captures: { vo_id: $.data.id } }
            - { call: "POST /closet/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /closet/clients/${ca_id}/visits", payload: { voucher_id: "${vo_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VOUCHER_EXPIRED  (not ERR_VOUCHER_CLIENT_MISMATCH, although the voucher belongs to client B)"

  - rule_id: boundary_precision_check
    instances:
      - name: cooldown_exactly_14_days_allowed
        grounds:
