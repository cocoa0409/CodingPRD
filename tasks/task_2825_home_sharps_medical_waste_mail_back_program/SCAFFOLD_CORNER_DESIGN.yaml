              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog}", cadence_days: 30, kits_authorized: 3 }
              as: ProgramAdmin
              captures: { enr_d: $.data.id }
            - call: "POST /sharps/enrollments/${enr_d}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr_d}/sponsor-decision"
              payload: { decision: "APPROVE" }
