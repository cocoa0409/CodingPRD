            - "the same call at clock 2026-08-26T00:00:00.001Z instead returns HTTP 409 ERR_PROTEST_UNTIMELY with no fee debited"

      - name: corner_responsibility_review_by_the_responsiveness_decider_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=22]
