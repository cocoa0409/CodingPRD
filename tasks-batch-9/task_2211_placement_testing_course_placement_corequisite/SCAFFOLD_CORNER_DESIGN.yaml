      - name: proctor_identity_is_bound_per_session_and_the_open_window_closes_inclusively
        claim_type: Triggerable
        grounds: ["errors[ERR_NOT_ASSIGNED_PROCTOR]", "errors[ERR_ADMINISTRATION_WINDOW_PASSED]", "validations[priority=11]", state_machines.TestAdministration]
        distinguishing_aspect: |
          Every proctor action is bound to the ONE session it belongs to: the assigned
          proctor of session H2 is a stranger to session H1, and the binding is checked
          on the status change, the check-in and the scoring alike. Separately,
          SCHEDULED -> OPEN dies at clock >= ends_at, so a session may never be opened
          at the very instant it was supposed to end.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "TestAdministration H1 (room T61, MATH, proctor-61, 2026-08-01T00:00:00Z-02:00:00Z, capacity 5) and H2 (room T62, MATH, proctor-61, 2026-08-01T03:00:00Z-05:00:00Z, capacity 5) — 240 proctored minutes on 2026-08-01, well under the 480-minute daily cap, and distinct rooms."
            - "Student SP1 with no prior attempts."
          setup_api_calls:
            - call: "POST /test-administrations"
              payload: { room_code: "T61", subject_area: "MATH", proctor_user_id: "proctor-61", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T02:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { h1: $.data.id, h1_status: $.data.status }
            - call: "POST /test-administrations"
              payload: { room_code: "T62", subject_area: "MATH", proctor_user_id: "proctor-61", starts_at: "2026-08-01T03:00:00Z", ends_at: "2026-08-01T05:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { h2: $.data.id }
            - call: "POST /students"
              payload: { student_number: "SP1", full_name: "Student P One", race_ethnicity_code: "BLACK" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sp1: $.data.id }
          trigger:
            - call: "POST /test-administrations/${h1}/status"
              payload: { target_status: "OPEN" }
              as: Proctor
              as_user_id: "proctor-62"
              captures: { e_open: $.data.error_id }
            - call: "POST /test-administrations/${h1}/status"
              payload: { target_status: "OPEN" }
              as: Proctor
              as_user_id: "proctor-61"
              captures: { h1_open: $.data.status }
            - call: "POST /test-attempts"
              payload: { student_id: "${sp1}", administration_id: "${h1}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { ap1: $.data.id, ap1_state: $.data.state }
            - call: "POST /test-attempts/${ap1}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-62"
              captures: { e_checkin: $.data.error_id }
            - call: "POST /test-attempts/${ap1}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-61"
              captures: { ap1_in: $.data.state }
            - call: "POST /test-attempts/${ap1}/score"
              payload: { raw_score: 100 }
              as: Proctor
              as_user_id: "proctor-62"
              captures: { e_score: $.data.error_id }
            - call: "POST /test-attempts/${ap1}/score"
              payload: { raw_score: 100 }
              as: Proctor
              as_user_id: "proctor-61"
              captures: { ap1_scored: $.data.state, ap1_scaled: $.data.scaled_score }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T05:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /test-administrations/${h2}/status"
              payload: { target_status: "OPEN" }
              as: Proctor
              as_user_id: "proctor-61"
              captures: { e_window: $.data.error_id }
            - call: "GET /test-administrations/${h2}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { h2_status: $.data.status, h2_booked: $.data.seats_booked }
          assert:
            - "${h1_status} == \"SCHEDULED\" (setup)"
            - "${e_open} == \"ERR_NOT_ASSIGNED_PROCTOR\" with HTTP 403 at priority 11 — proctor-62 holds the Proctor role but is not THIS session's proctor, so the failure is actor-binding, not ERR_UNAUTHORIZED"
            - "${h1_open} == \"OPEN\", ${ap1_state} == \"BOOKED\", ${ap1_in} == \"CHECKED_IN\", ${ap1_scored} == \"SCORED\" and ${ap1_scaled} == 625 — the satisfaction legs by the assigned proctor; 100 * 6.25 == 625"
            - "${e_checkin} == \"ERR_NOT_ASSIGNED_PROCTOR\" and ${e_score} == \"ERR_NOT_ASSIGNED_PROCTOR\" — the binding is re-checked on every attempt-level action, not only at the session status change"
            - "${e_window} == \"ERR_ADMINISTRATION_WINDOW_PASSED\" with HTTP 422 at clock == ends_at exactly — the guard is clock >= ends_at, so the closing instant is already too late even for the correctly assigned proctor"
            - "${h2_status} == \"SCHEDULED\" and ${h2_booked} == 0 — the refused open left the session in its initial state"

      - name: ownership_evidence_and_supersede_guards_each_answer_their_own_code
        claim_type: Triggerable
        grounds: ["errors[ERR_NOT_RESOURCE_OWNER]", "errors[ERR_NO_VERIFIABLE_EVIDENCE]", "errors[ERR_DETERMINATION_SUPERSEDED]", "validations[priority=11]"]
        distinguishing_aspect: |
          A Student may edit their OWN measures and nobody else's, which is a 403
          ownership failure rather than a role failure. Promoting the evidence axis
          needs real evidence: a SELF_REPORTED transcript scores the same 31.3 as a
          VERIFIED one but cannot back a VERIFIED evidence_state. And once a
          determination has been superseded it is frozen — the evidence endpoint
          answers 409 even though the caller, the role and the evidence are all fine.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Course MATH-050 and one ACTIVE rule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0)."
            - "Student SO1 with hs_gpa 2.50 SELF_REPORTED (transcript 2025-06-01T00:00:00Z) and Student SO2 with hs_gpa 2.50 VERIFIED (same date)."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule: $.data.id }
            - call: "POST /placement-rules/${rule}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /students"
              payload: { student_number: "SO1", full_name: "Student O One", race_ethnicity_code: "HISPANIC", hs_gpa: 2.50, hs_transcript_status: "SELF_REPORTED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { so1: $.data.id, so1_v: $.data.version }
            - call: "POST /students"
              payload: { student_number: "SO2", full_name: "Student O Two", race_ethnicity_code: "WHITE", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { so2: $.data.id, so2_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${so1}", subject_area: "MATH", expected_student_version: "${so1_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { d_so1: $.data.id, d_so1_conf: $.data.confidence_score, d_so1_measure: $.data.measure_type_used }
            - call: "POST /placement-determinations"
              payload: { student_id: "${so2}", subject_area: "MATH", expected_student_version: "${so2_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { d_so2a: $.data.id }
          trigger:
            - call: "POST /placement-determinations/${d_so1}/evidence"
              payload: { target_evidence_state: "VERIFIED", note: "Student says the transcript is accurate." }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_evidence: $.data.error_id }
            - call: "POST /students/${so2}/measures"
              payload: { hs_gpa: 3.00 }
              as: Student
              as_user_id: "${so1}"
              captures: { e_owner: $.data.error_id }
            - call: "POST /students/${so1}/measures"
              payload: { hs_gpa: 2.75 }
              as: Student
              as_user_id: "${so1}"
              captures: { own_gpa: $.data.hs_gpa, own_status: $.data.hs_transcript_status }
            - call: "GET /students/${so2}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { so2_v2: $.data.version, so2_gpa: $.data.hs_gpa }
            - call: "POST /placement-determinations"
              payload: { student_id: "${so2}", subject_area: "MATH", expected_student_version: "${so2_v2}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { d_so2b: $.data.id }
            - call: "POST /placement-determinations/${d_so2a}/evidence"
              payload: { target_evidence_state: "VERIFIED" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_superseded: $.data.error_id }
            - call: "POST /placement-determinations/${d_so2b}/evidence"
              payload: { target_evidence_state: "VERIFIED" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { ok_evidence: $.data.evidence_state, ok_placement: $.data.placement_state }
            - call: "GET /placement-determinations/${d_so2a}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { d_so2a_state: $.data.placement_state, d_so2a_evidence: $.data.evidence_state }
          assert:
            - "${d_so1_conf} == 31.3 and ${d_so1_measure} == \"TRANSCRIPT_GPA\" (setup) — SELF_REPORTED transcripts DO feed the confidence formula, which is why the evidence gate has to be separate"
            - "${e_evidence} == \"ERR_NO_VERIFIABLE_EVIDENCE\" with HTTP 422 — a TRANSCRIPT_GPA determination needs hs_transcript_status == VERIFIED, and SELF_REPORTED is not enough"
            - "${e_owner} == \"ERR_NOT_RESOURCE_OWNER\" with HTTP 403 at priority 11, NOT ERR_UNAUTHORIZED — Student IS a permitted role on POST /students/{student_id}/measures, so the failure is ownership"
            - "${own_gpa} == 2.75 and ${own_status} == \"SELF_REPORTED\" — the satisfaction leg: the same Student role succeeds on their OWN record"
            - "${so2_gpa} == 2.50 — the refused cross-student write changed nothing"
            - "${e_superseded} == \"ERR_DETERMINATION_SUPERSEDED\" with HTTP 409 — the first determination was superseded by the second, and a superseded row is frozen on BOTH axes even though SO2's transcript is VERIFIED"
            - "${ok_evidence} == \"VERIFIED\" and ${ok_placement} == \"PROVISIONAL\" — the live determination accepts the very same request"
            - "${d_so2a_state} == \"SUPERSEDED\" and ${d_so2a_evidence} == \"UNVERIFIED\" — the refused promotion left the frozen row's evidence axis alone"

      - name: an_expired_override_is_still_issued_and_a_revoked_one_answers_first
        claim_type: Triggerable
        grounds: ["errors[ERR_OVERRIDE_EXPIRED]", "errors[ERR_OVERRIDE_CONSUMED]", "validations[priority=8]", "validations[priority=21]"]
        distinguishing_aspect: |
          POST /prerequisite-overrides does NOT reject a past expires_at, so an override
          can be minted already stale and sits in ISSUED until something reads it —
          which makes ERR_OVERRIDE_EXPIRED (422, priority 21) reachable only through
          this door. The state-based refusal is a DIFFERENT code with a DIFFERENT status
          (409, priority 8), and an override that is both revoked and expired answers
          the state one.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Courses MATH-050 and MATH-100 with an ACTIVE BLOCKING PREREQUISITE edge MATH-100 -> MATH-050 (min_grade C)."
            - "One ACTIVE rule TRANSCRIPT_GPA -> MATH-100 (min_hs_gpa 2.0); Section s110 of MATH-100 (room R795, capacity 5) OPEN."
            - "Student SOE (hs_gpa 2.50 VERIFIED, transcript 2025-06-01T00:00:00Z) placed into MATH-100 and holding NO MATH-050 credit, so the prerequisite closure returns UNMET."
