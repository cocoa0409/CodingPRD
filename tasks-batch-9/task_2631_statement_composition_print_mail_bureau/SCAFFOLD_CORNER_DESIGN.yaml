          rationale: "That instance closes a job and asserts every billing field plus the assessed penalty the close writes, so the close endpoint's side effects are already pinned."

      - name: print_run_abort_side_effects_are_covered_by_the_difficulty_design
        claim_type: action_endpoint
        grounds: [endpoints.POST_print_runs_id_abort]
        excluded_because:
          difficulty_instance: print_run_abort_unwinds_a_four_link_chain
          rationale: "That instance asserts the four-link unwind the abort triggers - run status, press ledger, piece rewind and job status - which is exactly this endpoint's side-effect list."

  - section: errors
    instances:

      - name: not_found_family_returns_each_entitys_own_error_id
        claim_type: error_triggerable
        grounds: [errors.ERR_CLIENT_NOT_FOUND, errors.ERR_INSERT_STOCK_NOT_FOUND, errors.ERR_ENROLLMENT_NOT_FOUND, errors.ERR_JOB_NOT_FOUND, errors.ERR_MAIL_PIECE_NOT_FOUND, errors.ERR_PRESS_LINE_NOT_FOUND, errors.ERR_PRINT_RUN_NOT_FOUND, errors.ERR_ENTRY_FACILITY_NOT_FOUND, errors.ERR_PRESORT_BATCH_NOT_FOUND, errors.ERR_RETURN_NOT_FOUND, errors.ERR_DR_SITE_NOT_FOUND]
        distinguishing_aspect: "Each path-id lookup reports its own entity's 404 rather than one shared generic not-found code, so eleven structurally identical GETs return eleven distinct error_ids."
        test_recipe:
          setup:
            - "An empty system apart from the logical clock; every id below is a well-formed UUID that matches no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "GET /bureau/clients/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: BureauAdmin
              captures: { x1_client: "$.data.error_id" }
            - call: "GET /bureau/insert-stocks/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: BureauAdmin
              captures: { x1_insert: "$.data.error_id" }
            - call: "GET /bureau/paperless-enrollments/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ClientLiaison
              captures: { x1_enrollment: "$.data.error_id" }
            - call: "GET /bureau/composition-jobs/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: CompositionOperator
              captures: { x1_job: "$.data.error_id" }
            - call: "GET /bureau/mail-pieces/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: IntegrityAuditor
              captures: { x1_piece: "$.data.error_id" }
            - call: "GET /bureau/press-lines/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ProductionScheduler
              captures: { x1_line: "$.data.error_id" }
            - call: "GET /bureau/print-runs/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ProductionScheduler
              captures: { x1_run: "$.data.error_id" }
            - call: "GET /bureau/entry-facilities/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: PostageController
              captures: { x1_facility: "$.data.error_id" }
            - call: "GET /bureau/presort-batches/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: PostageController
              captures: { x1_batch: "$.data.error_id" }
            - call: "GET /bureau/undeliverable-returns/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: IntegrityAuditor
              captures: { x1_return: "$.data.error_id" }
            - call: "GET /bureau/dr-sites/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: BureauAdmin
              captures: { x1_site: "$.data.error_id" }
          assert:
            - "Every call returns HTTP 404 with the envelope's response_type set to the error shape"
            - "${x1_client} == ERR_CLIENT_NOT_FOUND, ${x1_insert} == ERR_INSERT_STOCK_NOT_FOUND, ${x1_enrollment} == ERR_ENROLLMENT_NOT_FOUND, ${x1_job} == ERR_JOB_NOT_FOUND"
            - "${x1_piece} == ERR_MAIL_PIECE_NOT_FOUND, ${x1_line} == ERR_PRESS_LINE_NOT_FOUND, ${x1_run} == ERR_PRINT_RUN_NOT_FOUND, ${x1_facility} == ERR_ENTRY_FACILITY_NOT_FOUND"
            - "${x1_batch} == ERR_PRESORT_BATCH_NOT_FOUND, ${x1_return} == ERR_RETURN_NOT_FOUND, ${x1_site} == ERR_DR_SITE_NOT_FOUND"
            - "All eleven ids are distinct, so no endpoint falls back to a neighbouring entity's code"

      - name: second_dr_site_creation_is_rejected_as_already_existing
        claim_type: error_triggerable
        grounds: [errors.ERR_DR_SITE_ALREADY_EXISTS, validations.ERR_DR_SITE_ALREADY_EXISTS]
        distinguishing_aspect: "The DrSite is a system singleton rather than a per-client row: a second creation with a different site_code is refused with 409 even though nothing about the payload duplicates the first."
        test_recipe:
          setup:
            - "One DrSite DR-X2-PRIMARY already exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/dr-sites"
              payload: { site_code: "DR-X2-PRIMARY", replication_lag_minutes: 5 }
              as: BureauAdmin
              captures: { x2_site_id: "$.data.id" }
          trigger:
            - call: "POST /bureau/dr-sites"
              payload: { site_code: "DR-X2-SECONDARY", replication_lag_minutes: 7 }
              as: BureauAdmin
              captures: { x2_error: "$.data.error_id" }
            - call: "GET /bureau/dr-sites/${x2_site_id}"
              payload: {}
              as: BureauAdmin
              captures: { x2_only_code: "$.data.site_code" }
          assert:
            - "HTTP 409 with ${x2_error} == ERR_DR_SITE_ALREADY_EXISTS — a distinct site_code does not make it a duplicate-code error"
            - "${x2_only_code} == DR-X2-PRIMARY — the singleton still holds the first row and no second site exists to read"
            - "The surviving row is unchanged: DrSite.${x2_site_id}.replication_lag_minutes == 5 with readiness_status UNTESTED"

      - name: return_intake_rejects_a_duplicate_a_reclassification_and_a_suppressed_piece
        claim_type: error_triggerable
        grounds: [errors.ERR_RETURN_DUPLICATE, errors.ERR_RETURN_INVALID_STATE, errors.ERR_PIECE_NOT_SCANNABLE]
        distinguishing_aspect: "Three different guards on the same return queue fire on one job: one return per piece (409 duplicate), classify only from SCANNED (409 invalid state), and no return at all against a SUPPRESSED piece (409 not scannable)."
        test_recipe:
          setup:
            - "Client CL-X3 (dr_readiness_required false) with ACTIVE template T-X3 (FIRST_CLASS, sheets_per_document 1)."
            - "Account ABC4002 is paperless-enrolled and confirmed before composition, so its piece composes SUPPRESSED; account ABC4001 composes as a normal PRINT piece."
            - "A return is already scanned and classified against the printed piece."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-X3", name: "Return Queue Reinsurance", dr_readiness_required: false }
              as: BureauAdmin
              captures: { x3_client_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${x3_client_id}", template_code: "T-X3", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { x3_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${x3_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/paperless-enrollments"
              payload: { client_id: "${x3_client_id}", account_ref: "ABC4002", channel: "EMAIL" }
              as: ClientLiaison
            - call: "POST /bureau/clients/${x3_client_id}/paperless-sync"
              payload: { confirm_pending_account_refs: ["ABC4002"] }
              as: ClientLiaison
            - call: "POST /bureau/data-files"
              payload: { client_id: "${x3_client_id}", file_name: "x3.csv", format_spec_code: "DELIMITED", declared_record_count: 2, declared_control_total_cents: 8000 }
              as: ClientLiaison
              captures: { x3_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${x3_file_id}", account_ref: "ABC4001", sequence_no: 1, statement_amount_cents: 4000, address_line1: "3900 Queue Quay", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3901" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${x3_file_id}", account_ref: "ABC4002", sequence_no: 2, statement_amount_cents: 4000, address_line1: "3902 Queue Quay", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3902" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${x3_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${x3_file_id}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${x3_file_id}", template_id: "${x3_template_id}", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { x3_job_id: "$.data.id" }
            - call: "GET /bureau/mail-pieces?composition_job_id=${x3_job_id}&piece_status=COMPOSED"
              payload: {}
              as: IntegrityAuditor
              captures: { x3_print_piece: "$.data[0].id" }
            - call: "GET /bureau/mail-pieces?composition_job_id=${x3_job_id}&piece_status=SUPPRESSED"
              payload: {}
              as: IntegrityAuditor
              captures: { x3_suppressed_piece: "$.data[0].id" }
            - call: "POST /bureau/undeliverable-returns"
              payload: { mail_piece_id: "${x3_print_piece}", reason_code: "VACANT" }
              as: IntegrityAuditor
              captures: { x3_return_id: "$.data.id" }
            - call: "POST /bureau/undeliverable-returns/${x3_return_id}/classify"
              payload: {}
              as: IntegrityAuditor
              captures: { x3_disposition: "$.data.disposition" }
          trigger:
            - call: "POST /bureau/undeliverable-returns"
              payload: { mail_piece_id: "${x3_print_piece}", reason_code: "REFUSED" }
              as: IntegrityAuditor
              captures: { x3_duplicate_error: "$.data.error_id" }
            - call: "POST /bureau/undeliverable-returns/${x3_return_id}/classify"
              payload: { corrected_address_line1: "4000 Second Thought Street", corrected_postal_code: "30304" }
              as: IntegrityAuditor
              captures: { x3_state_error: "$.data.error_id" }
            - call: "POST /bureau/undeliverable-returns"
              payload: { mail_piece_id: "${x3_suppressed_piece}", reason_code: "VACANT" }
              as: IntegrityAuditor
              captures: { x3_scannable_error: "$.data.error_id" }
          assert:
            - "${x3_disposition} == UNRESOLVED — classify with no corrections takes the unresolved fork"
            - "HTTP 409 with ${x3_duplicate_error} == ERR_RETURN_DUPLICATE: at most one return per piece, regardless of a different reason_code"
            - "HTTP 409 with ${x3_state_error} == ERR_RETURN_INVALID_STATE and the return still reads UNRESOLVED — a second classify cannot overwrite the first fork or apply the late corrections"
            - "HTTP 409 with ${x3_scannable_error} == ERR_PIECE_NOT_SCANNABLE for the SUPPRESSED piece, which was never mailed"
            - "GET /bureau/mail-pieces/${x3_print_piece}/undeliverable-returns returns total_count == 1 and GET /bureau/mail-pieces/${x3_suppressed_piece}/undeliverable-returns returns total_count == 0"

      - name: sealed_batch_rejects_a_second_seal_a_closed_facility_and_a_malformed_window
        claim_type: error_triggerable
        grounds: [errors.ERR_BATCH_NOT_OPEN, errors.ERR_ENTRY_FACILITY_CLOSED, errors.ERR_INVALID_INDUCTION_WINDOW]
