scenario: |
  generate task hard than expert level! 1229. Municipal Aquatics Program & Pool Pass (city parks aquatics division): season pass & daily admission pricing by residency, swim lesson level placement & session scheduling, lifeguard certification & shift staffing to bather load, pool chemistry logging & closure criteria, swim team/lap lane allocation conflicts, party/facility rental booking, weather closure & rain-check policy, incident reporting & rescue documentation

domain_name: municipal-aquatics
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility display name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: max_bather_capacity, type: integer, source: input, description: "Hard cap on simultaneous bathers; must be >= 1" }
      - { name: lap_lane_count, type: integer, source: input, description: "Number of lap lanes available for allocation; must be >= 0" }
      - { name: current_bather_count, type: integer, source: computed, description: "Derived count of active Admissions and Rentals occupying the facility; starts at 0; maintained via gate-entry and rental-checkin side effects" }
      - { name: required_lifeguard_count, type: integer, source: computed, description: "ceil(current_bather_count / BATHERS_PER_GUARD); recalculated on every bather-count change" }
      - { name: operational_status, type: enum, source: system, description: "OPEN | RESTRICTED | CLOSED_CHEMISTRY | CLOSED_WEATHER | CLOSED_STAFFING | CLOSED_SEASON — derived posture gating gate entries, lesson starts, rental checkins" }
      - { name: chemistry_state, type: enum, source: system, description: "IN_RANGE | WARNING | OUT_OF_RANGE — derived from most recent ChemistryLog" }
      - { name: chemistry_out_of_range_since, type: datetime, source: system, description: "ISO timestamp of the first OUT_OF_RANGE ChemistryLog in the current OUT_OF_RANGE streak; null when chemistry_state != OUT_OF_RANGE", default: null }

  - name: MembershipSeason
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; season is scoped to one facility" }
      - { name: season_name, type: string, source: input, description: "e.g. Summer 2026" }
      - { name: start_date, type: datetime, source: input, description: "First day passes are valid (inclusive, ISO date)" }
      - { name: end_date, type: datetime, source: input, description: "Last day passes are valid (inclusive, ISO date); must be > start_date" }
      - { name: resident_pass_price_cents, type: integer, source: input, description: "Season pass price for RESIDENT pass holders; >= 0" }
      - { name: non_resident_pass_price_cents, type: integer, source: integer, description: "Season pass price for NON_RESIDENT pass holders; >= resident_pass_price_cents" }
      - { name: resident_daily_price_cents, type: integer, source: input, description: "Per-day gate admission price for RESIDENT" }
      - { name: non_resident_daily_price_cents, type: integer, source: input, description: "Per-day gate admission price for NON_RESIDENT" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | CLOSED" }

  - name: PassHolder
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patron full name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Used for age-tier classification (CHILD < 18, ADULT 18-61, SENIOR >= 62)" }
      - { name: residency_status, type: enum, source: input, description: "RESIDENT | NON_RESIDENT — residency proof is out of scope; clerk attests at registration" }
      - { name: email, type: string, source: input, description: "Unique contact email" }
      - { name: strike_count, type: integer, source: system, description: "Cumulative count of confirmed incident reports involving this holder; incremented by IncidentReport confirmation", default: 0 }
      - { name: banned_until, type: datetime, source: system, description: "If non-null and >= current logical clock, all admissions, enrollments, and rentals for this holder are rejected", default: null }

  - name: SeasonPass
    parent: PassHolder
    common_fields: true
    fields:
      - { name: pass_holder_id, type: string, source: input, description: "FK -> PassHolder.id; owner" }
      - { name: season_id, type: string, source: input, description: "FK -> MembershipSeason.id" }
      - { name: purchase_price_cents, type: integer, source: computed, description: "Snapshot of season's resident/non-resident pass price at purchase based on holder residency" }
      - { name: refunded_cents, type: integer, source: system, description: "Running total of rain-check refunds credited against this pass", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | REFUNDED | REVOKED" }

  - name: DailyAdmission
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility where admission is granted" }
      - { name: pass_holder_id, type: string, source: input, description: "FK -> PassHolder.id" }
      - { name: season_pass_id, type: string, source: input, description: "FK -> SeasonPass.id; null when paying the daily gate price", default: null }
      - { name: admission_date, type: datetime, source: input, description: "Calendar day of admission (ISO date)" }
      - { name: charge_cents, type: integer, source: computed, description: "0 when a valid SeasonPass covers the day; otherwise the residency- and age-tier-adjusted daily price" }
      - { name: entered_at, type: datetime, source: system, description: "Timestamp of gate check-in; null until entry", default: null }
      - { name: exited_at, type: datetime, source: system, description: "Timestamp of gate check-out; null while inside", default: null }
      - { name: status, type: enum, source: system, description: "ISSUED | ENTERED | EXITED | RAIN_CHECKED | VOID" }

  - name: SwimLessonLevel
    parent: null
    common_fields: true
    fields:
      - { name: level_code, type: string, source: input, description: "e.g. L1, L2, L3, L4 — unique" }
      - { name: display_name, type: string, source: input, description: "Human name e.g. 'Water Acclimation'" }
      - { name: min_age_years, type: integer, source: input, description: "Minimum age on session start_date; >= 0" }
      - { name: prerequisite_level_id, type: string, source: input, description: "FK -> SwimLessonLevel.id; null for entry level", default: null }
      - { name: capacity_per_session, type: integer, source: input, description: "Max enrollments per LessonSession; >= 1" }

  - name: LessonSession
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: level_id, type: string, source: input, description: "FK -> SwimLessonLevel.id" }
      - { name: season_id, type: string, source: input, description: "FK -> MembershipSeason.id; session must run inside the season window" }
      - { name: start_datetime, type: datetime, source: input, description: "First class start (ISO)" }
      - { name: end_datetime, type: datetime, source: input, description: "Last class end (ISO); must be > start_datetime" }
      - { name: lanes_required, type: integer, source: input, description: "Lap lanes consumed while session runs; >= 1" }
      - { name: enrolled_count, type: integer, source: system, description: "Derived count of LessonEnrollments in status ENROLLED", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: LessonEnrollment
    parent: LessonSession
    common_fields: true
    fields:
      - { name: lesson_session_id, type: string, source: input, description: "FK -> LessonSession.id" }
      - { name: pass_holder_id, type: string, source: input, description: "FK -> PassHolder.id" }
      - { name: placement_evidence_level_id, type: string, source: input, description: "FK -> SwimLessonLevel.id; the level the student has already passed; used to verify prerequisite", default: null }
      - { name: status, type: enum, source: system, description: "ENROLLED | WAITLISTED | COMPLETED | DROPPED" }
      - { name: waitlist_position, type: integer, source: system, description: "1-based position among WAITLISTED enrollments ordered by created_at ASC; null when not WAITLISTED", default: null }

  - name: Lifeguard
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Guard name" }
      - { name: certification_id, type: string, source: input, description: "Certifying body credential id (e.g. Red Cross LG-XXXX)" }
      - { name: cert_expires_on, type: datetime, source: input, description: "Certification expiry date (ISO)" }
      - { name: cert_status, type: enum, source: system, description: "ACTIVE | EXPIRED | SUSPENDED — derived from cert_expires_on vs current clock and manual suspension" }
      - { name: hired_on, type: datetime, source: input, description: "Employment start (ISO date)" }

  - name: LifeguardShift
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: lifeguard_id, type: string, source: input, description: "FK -> Lifeguard.id" }
      - { name: shift_start, type: datetime, source: input, description: "ISO datetime" }
      - { name: shift_end, type: datetime, source: input, description: "ISO datetime; > shift_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COVERED | NO_SHOW | CANCELLED" }

  - name: ChemistryLog
    parent: Facility
    common_fields: false
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: recorded_at, type: datetime, source: input, description: "ISO timestamp the sample was taken" }
      - { name: free_chlorine_ppm, type: number, source: input, description: "Free chlorine reading (ppm); valid range [1.0, 5.0]" }
      - { name: ph, type: number, source: input, description: "pH reading; valid range [7.2, 7.8]" }
      - { name: combined_chlorine_ppm, type: number, source: input, description: "Combined chlorine (ppm); must be <= 0.4" }
      - { name: classification, type: enum, source: computed, description: "IN_RANGE | WARNING | OUT_OF_RANGE — derived from thresholds; OUT_OF_RANGE when any of (free_chlorine < 1.0 OR > 5.0) OR (ph < 7.2 OR > 7.8); WARNING when combined_chlorine > 0.4 and not OUT_OF_RANGE" }
      - { name: recorded_by_lifeguard_id, type: string, source: input, description: "FK -> Lifeguard.id; certifying guard" }

  - name: LaneAllocation
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: purpose, type: enum, source: input, description: "LAP_SWIM | SWIM_TEAM | LESSON — what the lanes are reserved for" }
      - { name: start_datetime, type: datetime, source: input, description: "ISO" }
      - { name: end_datetime, type: datetime, source: input, description: "ISO; > start_datetime" }
      - { name: lane_count, type: integer, source: input, description: "Number of lanes reserved; >= 1" }
      - { name: owning_lesson_session_id, type: string, source: input, description: "FK -> LessonSession.id; required when purpose=LESSON, otherwise null", default: null }
      - { name: status, type: enum, source: system, description: "RESERVED | RELEASED | CANCELLED" }

  - name: FacilityRental
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: pass_holder_id, type: string, source: input, description: "FK -> PassHolder.id; the renting patron" }
      - { name: party_size, type: integer, source: input, description: "Expected attendees; >= 1; consumes bather capacity at checkin" }
      - { name: start_datetime, type: datetime, source: input, description: "ISO" }
      - { name: end_datetime, type: datetime, source: input, description: "ISO; > start_datetime" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "Rental quote at creation; depends on duration, residency, and facility" }
      - { name: final_price_cents, type: integer, source: computed, description: "Final price at check-out, includes overtime surcharge when exit exceeds end_datetime" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | CHECKED_IN | COMPLETED | CANCELLED | REJECTED" }

  - name: IncidentReport
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: reporting_lifeguard_id, type: string, source: input, description: "FK -> Lifeguard.id; must hold ACTIVE cert at submission time" }
      - { name: involved_pass_holder_id, type: string, source: input, description: "FK -> PassHolder.id; the patron involved in the incident" }
      - { name: incident_type, type: enum, source: input, description: "RESCUE | FIRST_AID | RULE_VIOLATION | EQUIPMENT_FAILURE" }
      - { name: occurred_at, type: datetime, source: input, description: "ISO timestamp of incident" }
      - { name: severity, type: enum, source: input, description: "MINOR | MODERATE | MAJOR" }
      - { name: narrative, type: string, source: input, description: "Free-text description" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CONFIRMED | DISMISSED" }

  - name: PoolClosureEvent
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: closure_reason, type: enum, source: input, description: "WEATHER | CHEMISTRY | STAFFING_SHORTAGE | SEASON_END" }
      - { name: started_at, type: datetime, source: input, description: "ISO start of closure window" }
      - { name: ended_at, type: datetime, source: system, description: "ISO end of closure; null while closed", default: null }
      - { name: rain_check_issuance, type: enum, source: computed, description: "FULL_REFUND | PRO_RATA_CREDIT | NONE — derived from closure_reason and elapsed minutes the patron was inside (FULL_REFUND when WEATHER and elapsed <= 60, PRO_RATA_CREDIT when WEATHER and elapsed > 60, NONE otherwise)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESOLVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Facility
    initial_state: OPEN
    terminal_states: [CLOSED_SEASON]
    transitions:
      - from: OPEN
        to: CLOSED_CHEMISTRY
        trigger: "system (ChemistryLog classified OUT_OF_RANGE)"
        actor: system
        preconditions:
          - "new ChemistryLog.classification == OUT_OF_RANGE"
        side_effects:
          - "PoolClosureEvent created with closure_reason=CHEMISTRY"
          - "All LaneAllocations overlapping closure window -> CANCELLED (only those with status=RESERVED)"
          - "All FacilityRentals with status=CHECKED_IN are forced to COMPLETED with final_price=quoted_price (overtime waived)"
          - "All DailyAdmissions with status=ENTERED -> EXITED with exited_at=now (no refund)"
          - "current_bather_count := 0"

      - from: [OPEN, RESTRICTED]
        to: CLOSED_WEATHER
        trigger: "POST /facilities/{id}/closures (closure_reason=WEATHER)"
        actor: AquaticsManager
        preconditions:
          - "Facility not already in a CLOSED_* status"
        side_effects:
          - "PoolClosureEvent created with closure_reason=WEATHER"
          - "All DailyAdmissions status=ENTERED -> RAIN_CHECKED; refund or pro-rata credit issued to SeasonPass.refunded_cents or as cash refund per rain_check_issuance policy"
          - "All LaneAllocations overlapping window -> CANCELLED"
          - "All FacilityRentals status=CHECKED_IN -> COMPLETED with overtime waived"
          - "All FacilityRentals status=APPROVED with start_datetime inside closure window -> CANCELLED (full refund)"
          - "current_bather_count := 0"

      - from: OPEN
        to: CLOSED_STAFFING
        trigger: "system (LifeguardShift change causes scheduled guards < required_lifeguard_count)"
        actor: system
        preconditions:
          - "scheduled lifeguards for current hour < required_lifeguard_count AND current_bather_count > 0"
        side_effects:
          - "PoolClosureEvent created with closure_reason=STAFFING_SHORTAGE"
          - "All DailyAdmissions status=ENTERED -> EXITED (no refund)"
          - "LaneAllocations overlapping window -> CANCELLED"

      - from: [CLOSED_CHEMISTRY, CLOSED_WEATHER, CLOSED_STAFFING]
        to: OPEN
        trigger: "POST /facilities/{id}/reopen"
        actor: AquaticsManager
        preconditions:
          - "all PoolClosureEvents with status=ACTIVE for this facility have ended_at non-null OR are being resolved by this call"
          - "if closure_reason == CHEMISTRY: most recent ChemistryLog.classification == IN_RANGE"
          - "if closure_reason == STAFFING_SHORTAGE: scheduled lifeguards for the next 2 hours >= required_lifeguard_count"
        side_effects:
          - "Active PoolClosureEvent.status -> RESOLVED with ended_at=now"
          - "Facility.operational_status := OPEN"

      - from: [OPEN, RESTRICTED]
        to: CLOSED_SEASON
        trigger: "system (clock advances past MembershipSeason.end_date AND no future PUBLISHED season exists)"
        actor: system
        preconditions: []
        side_effects:
          - "All SeasonPasses with status=ACTIVE and season.end_date < now -> status unchanged but unusable for new admissions"
          - "All future LessonSessions -> CANCELLED"

      - from: OPEN
        to: RESTRICTED
        trigger: "system (ChemistryLog classified WARNING)"
        actor: system
        preconditions:
          - "new ChemistryLog.classification == WARNING"
        side_effects:
          - "Facility.chemistry_state := WARNING; new LessonSession starts blocked; admissions still allowed"

      - from: RESTRICTED
        to: OPEN
        trigger: "system (ChemistryLog classified IN_RANGE)"
        actor: system
        preconditions:
          - "new ChemistryLog.classification == IN_RANGE"
        side_effects: []

  - entity: MembershipSeason
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /seasons/{id}/publish"
        actor: AquaticsManager
        preconditions:
          - "resident_pass_price_cents <= non_resident_pass_price_cents"
          - "resident_daily_price_cents <= non_resident_daily_price_cents"
          - "no other PUBLISHED season for same facility overlaps [start_date, end_date]"
        side_effects:
          - "SeasonPass purchases become allowed"

      - from: PUBLISHED
        to: CLOSED
        trigger: "system (clock advances past end_date) OR POST /seasons/{id}/close"
        actor: system
        preconditions: []
        side_effects:
          - "SeasonPass purchases rejected"
          - "Facility transitions to CLOSED_SEASON if no future PUBLISHED season"

  - entity: SeasonPass
    initial_state: ACTIVE
    terminal_states: [REFUNDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /passes/{id}/refund"
        actor: AquaticsManager
        preconditions:
          - "current clock < season.end_date"
          - "SeasonPass.status == ACTIVE"
        side_effects:
          - "refunded_cents := purchase_price_cents (full refund only mid-season is out of scope)"
          - "Future DailyAdmissions referencing this pass are rejected"

      - from: ACTIVE
        to: REVOKED
        trigger: "system (PassHolder.banned_until set to a future timestamp)"
        actor: system
        preconditions:
          - "holder incident-driven ban activated"
        side_effects:
          - "Existing DailyAdmissions with status=ISSUED for this holder -> VOID"

  - entity: DailyAdmission
    initial_state: ISSUED
    terminal_states: [EXITED, RAIN_CHECKED, VOID]
    transitions:
      - from: ISSUED
        to: ENTERED
        trigger: "POST /admissions/{id}/enter"
        actor: GateAttendant
        preconditions:
          - "Facility.operational_status IN {OPEN, RESTRICTED}"
          - "Facility.current_bather_count < Facility.max_bather_capacity"
          - "PassHolder.banned_until IS NULL OR banned_until < now"
          - "admission_date == current calendar date"
        side_effects:
          - "Facility.current_bather_count += 1"
          - "Facility.required_lifeguard_count recomputed"
          - "entered_at := now"

      - from: ENTERED
        to: EXITED
        trigger: "POST /admissions/{id}/exit"
        actor: GateAttendant
        preconditions: []
        side_effects:
          - "Facility.current_bather_count -= 1"
          - "Facility.required_lifeguard_count recomputed"
          - "exited_at := now"

      - from: ENTERED
        to: RAIN_CHECKED
        trigger: "system (facility CLOSED_WEATHER transition)"
        actor: system
        preconditions: []
        side_effects:
          - "Facility.current_bather_count -= 1"
          - "Rain-check issuance per PoolClosureEvent.rain_check_issuance: FULL_REFUND -> charge_cents refunded in full; PRO_RATA_CREDIT -> refund 50% rounded half-up to cents; NONE -> no refund"
          - "if admission was tied to a SeasonPass, SeasonPass.refunded_cents is NOT incremented (season pass admissions have charge_cents=0)"

      - from: ISSUED
        to: VOID
        trigger: "system (pass revoked or holder banned before entry)"
        actor: system
        preconditions: []
        side_effects:
          - "charge refunded in full if charge_cents > 0"

  - entity: LessonSession
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /lesson-sessions/{id}/schedule"
        actor: AquaticsManager
        preconditions:
          - "Facility.operational_status == OPEN"
          - "overlapping LaneAllocations at facility leave >= lanes_required free lanes for every instant in [start_datetime, end_datetime)"
          - "start_datetime >= season.start_date AND end_datetime <= season.end_date + 1 day"
        side_effects:
          - "LaneAllocation created with purpose=LESSON, owning_lesson_session_id=this session, lane_count=lanes_required"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system (clock >= start_datetime)"
        actor: system
        preconditions:
          - "Facility.operational_status IN {OPEN, RESTRICTED}"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (clock >= end_datetime)"
        actor: system
        preconditions: []
        side_effects:
          - "LaneAllocation owning_lesson_session_id=this -> RELEASED"
          - "All LessonEnrollments status=ENROLLED -> COMPLETED"

      - from: [DRAFT, SCHEDULED]
        to: CANCELLED
        trigger: "POST /lesson-sessions/{id}/cancel"
        actor: AquaticsManager
        preconditions: []
        side_effects:
          - "LaneAllocation owning_lesson_session_id=this -> CANCELLED"
          - "All LessonEnrollments -> DROPPED"

  - entity: LessonEnrollment
    initial_state: ENROLLED
    terminal_states: [COMPLETED, DROPPED]
    transitions:
      - from: ENROLLED
        to: WAITLISTED
        trigger: "system (session.enrolled_count would exceed level.capacity_per_session)"
        actor: system
        preconditions: []
        side_effects:
          - "waitlist_position := 1 + count of existing WAITLISTED enrollments for this session"

      - from: WAITLISTED
        to: ENROLLED
        trigger: "system (an ENROLLED enrollment dropped and waitlist head promoted)"
        actor: system
        preconditions:
          - "this enrollment has the lowest waitlist_position among WAITLISTED"
        side_effects:
          - "session.enrolled_count += 1"
          - "waitlist_position := null"
          - "remaining WAITLISTED enrollments re-numbered (positions shift up by 1)"

      - from: [ENROLLED, WAITLISTED]
        to: DROPPED
        trigger: "POST /enrollments/{id}/drop"
        actor: PassHolder
        preconditions:
          - "X-User-ID == enrollment.pass_holder_id OR caller is AquaticsManager"
        side_effects:
          - "if previously ENROLLED: session.enrolled_count -= 1"
          - "if previously ENROLLED: promote waitlist head (WAITLISTED -> ENROLLED) per rule above"
          - "if previously ENROLLED: pro-rata refund issued when >= 50% of session time remains (refund = ceil(purchase_price * remaining_classes / total_classes)); zero refund otherwise"

      - from: ENROLLED
        to: COMPLETED
        trigger: "system (parent LessonSession -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Lifeguard
    initial_state: ACTIVE
    terminal_states: [EXPIRED, SUSPENDED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock > cert_expires_on)"
        actor: system
        preconditions: []
        side_effects:
          - "All future LifeguardShifts for this guard with status=SCHEDULED -> CANCELLED"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /lifeguards/{id}/suspend"
        actor: AquaticsManager
        preconditions:
          - "reason must be provided (e.g. failed audit)"
        side_effects:
          - "All future LifeguardShifts for this guard with status=SCHEDULED -> CANCELLED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /lifeguards/{id}/reinstate"
        actor: AquaticsManager
        preconditions:
          - "cert_expires_on > current clock"
        side_effects: []

  - entity: LifeguardShift
    initial_state: SCHEDULED
    terminal_states: [COVERED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COVERED
        trigger: "POST /shifts/{id}/check-in"
        actor: Lifeguard
        preconditions:
          - "X-User-ID == shift.lifeguard_id"
          - "Lifeguard.cert_status == ACTIVE"
          - "current clock <= shift_start + 15 minutes"
        side_effects:
          - "Facility scheduled-guard count for shift window incremented"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (clock > shift_start + 15 min AND no check-in)"
        actor: system
        preconditions: []
        side_effects:
          - "Facility scheduled-guard count decremented"
          - "If this leaves guards < required AND bathers > 0 -> Facility -> CLOSED_STAFFING"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shifts/{id}/cancel OR system (guard expired/suspended)"
        actor: AquaticsManager
        preconditions: []
        side_effects:
          - "Facility scheduled-guard count decremented"

  - entity: LaneAllocation
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: RESERVED
        to: RELEASED
        trigger: "POST /lane-allocations/{id}/release OR system (owning LessonSession -> COMPLETED)"
        actor: AquaticsManager
        preconditions: []
        side_effects: []

      - from: RESERVED
        to: CANCELLED
        trigger: "system (owning LessonSession CANCELLED or Facility closure)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FacilityRental
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /rentals/{id}/approve"
        actor: AquaticsManager
        preconditions:
          - "Facility.operational_status IN {OPEN, RESTRICTED}"
          - "party_size <= Facility.max_bather_capacity"
          - "no overlapping APPROVED or CHECKED_IN FacilityRental at the same facility (whole-facility exclusive use)"
          - "sum of lane_count over overlapping RESERVED LaneAllocations + 0 (rental requires zero RESERVED lanes overlap) == 0; rentals require the entire lane pool"
        side_effects:
          - "quoted_price_cents locked"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /rentals/{id}/reject"
        actor: AquaticsManager
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: CHECKED_IN
        trigger: "POST /rentals/{id}/check-in"
        actor: GateAttendant
        preconditions:
          - "Facility.operational_status IN {OPEN, RESTRICTED}"
          - "Facility.current_bather_count + party_size <= Facility.max_bather_capacity"
          - "current clock >= start_datetime AND current clock <= end_datetime"
        side_effects:
          - "Facility.current_bather_count += party_size"
          - "Facility.required_lifeguard_count recomputed"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /rentals/{id}/check-out"
        actor: GateAttendant
        preconditions: []
        side_effects:
          - "Facility.current_bather_count -= party_size"
          - "final_price_cents := quoted_price_cents + overtime_cents where overtime_cents = ceil((actual_exit - end_datetime)/15min) * OVERTIME_PER_15MIN_CENTS, zero if actual_exit <= end_datetime"

      - from: [REQUESTED, APPROVED]
        to: CANCELLED
        trigger: "POST /rentals/{id}/cancel"
        actor: PassHolder
        preconditions:
          - "X-User-ID == rental.pass_holder_id OR caller is AquaticsManager"
        side_effects:
          - "if previously APPROVED and cancelled < 72h before start_datetime, a 25% cancellation fee is withheld (rounded half-up to cents); otherwise full refund"

  - entity: IncidentReport
    initial_state: DRAFT
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /incident-reports/{id}/submit"
        actor: Lifeguard
        preconditions:
          - "X-User-ID == report.reporting_lifeguard_id"
          - "Lifeguard.cert_status == ACTIVE at submission time"
        side_effects: []

      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /incident-reports/{id}/confirm"
        actor: AquaticsManager
        preconditions: []
        side_effects:
          - "PassHolder.strike_count += 1"
          - "If severity == MAJOR OR PassHolder.strike_count >= 3: PassHolder.banned_until := now + BAN_DAYS_PER_MAJOR days (30 days)"

      - from: SUBMITTED
        to: DISMISSED
        trigger: "POST /incident-reports/{id}/dismiss"
        actor: AquaticsManager
        preconditions: []
        side_effects: []

  - entity: PoolClosureEvent
    initial_state: ACTIVE
    terminal_states: [RESOLVED]
    transitions:
      - from: ACTIVE
        to: RESOLVED
        trigger: "POST /facilities/{id}/reopen OR POST /closures/{id}/resolve"
        actor: AquaticsManager
        preconditions: []
        side_effects:
          - "ended_at := now"
          - "Facility posture recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: rental-approve-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /rentals/{id}/approve"
    occ_field: "expected_facility_version"
    description: |
      Approving a FacilityRental against a Facility whose version has advanced
      since the client last observed it is rejected. A just-completed ChemistryLog
      POST may have transitioned the facility OUT_OF_RANGE (which forbids new
      APPROVED rentals) or bumped required_lifeguard_count; the approving client
      therefore must be acting on a current view of the facility.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: lesson-schedule-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /lesson-sessions/{id}/schedule"
    occ_field: "expected_facility_version"
    description: |
      Scheduling a LessonSession against a Facility whose version has advanced
      since the client last observed it is rejected. A lane-allocation release or
      a bather-count change may have invalidated the lane availability that the
      scheduler relied on.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: daily_admission_price
    trigger: "POST /admissions (when season_pass_id is null)"
    algorithm: tiered_pricing
    formula: |
      base = season.resident_daily_price_cents if holder.residency_status == RESIDENT
             else season.non_resident_daily_price_cents
      age_years = (current_date - holder.date_of_birth).years (floor)
      if age_years < 18: charge = ceil(base * CHILD_MULTIPLIER)
      elif age_years >= 62: charge = ceil(base * SENIOR_MULTIPLIER)
      else: charge = base
      # rounding pin: apply multiplier to the integer base then ceil to the cent
    input_set: "current PUBLISHED MembershipSeason for facility on admission_date; the PassHolder"
    constants:
      CHILD_MULTIPLIER: 0.60
      SENIOR_MULTIPLIER: 0.75
    precision: "integer cents; multiplier applied to integer base, ceil to nearest cent"
    variants:
      - name: with_season_pass
        when: "season_pass_id is provided AND pass.status == ACTIVE AND pass.season_id == current PUBLISHED season.id"
        difference: "charge_cents = 0 (admission covered by prepaid pass); multiplier logic skipped"
      - name: with_grace_window
        when: "admission_date within [season.start_date - 7d, season.start_date) — early-bird window"
        difference: "EARLY_BIRD_DISCOUNT_PCT applied to the computed base before age-tier multiplier (order matters: residency base -> early-bird discount -> age multiplier -> ceil)"

  - name: rental_quote
    trigger: "POST /rentals (compute quoted_price_cents); POST /rentals/{id}/check-out (compute final_price_cents)"
    algorithm: tiered_pricing
    formula: |
      hours = ceil((end_datetime - start_datetime) / 3600s)   # partial hours round UP
      base_rate = RENTAL_BASE_PER_HOUR_CENTS * hours
      residency_multiplier = 1.0 if holder.residency_status == RESIDENT else NON_RESIDENT_RENTAL_MULTIPLIER
      # rounding pin: apply residency multiplier first, round half-up to cents
      subtotal = round_half_up(base_rate * residency_multiplier, 2)
      party_fee = max(0, party_size - INCLUDED_PARTY_SIZE) * EXTRA_PERSON_CENTS
      quoted_price_cents = subtotal + party_fee
      # final at checkout:
      if actual_exit <= end_datetime:
        overtime_cents = 0
      else:
        overtime_blocks = ceil((actual_exit - end_datetime) / 900s)  # 15-min blocks
        overtime_cents = overtime_blocks * OVERTIME_PER_15MIN_CENTS
      final_price_cents = quoted_price_cents + overtime_cents
    input_set: "the PassHolder; the Facility; rental window"
    constants:
      RENTAL_BASE_PER_HOUR_CENTS: 15000
      NON_RESIDENT_RENTAL_MULTIPLIER: 1.50
      INCLUDED_PARTY_SIZE: 25
      EXTRA_PERSON_CENTS: 300
      OVERTIME_PER_15MIN_CENTS: 5000
    precision: "integer cents; round_half_up to cent after each multiplication step (residency multiplier BEFORE adding party fee)"
    variants:
      - name: quoted
        when: "at rental creation; no actual_exit known"
        difference: "overtime_cents = 0"
      - name: final
        when: "at check-out with actual_exit known"
        difference: "overtime computed and added; weather-forced early exit WAIVES overtime even when actual_exit > end_datetime"

  - name: bather_load_staffing_requirement
    trigger: "any change to Facility.current_bather_count"
    algorithm: threshold
    formula: |
      if current_bather_count == 0:
        required_lifeguard_count = 0
      elif current_bather_count <= 50:
        required_lifeguard_count = 2
      else:
        required_lifeguard_count = 2 + ceil((current_bather_count - 50) / BATHERS_PER_ADDITIONAL_GUARD)
    input_set: "Facility.current_bather_count only"
    constants:
      BATHERS_PER_ADDITIONAL_GUARD: 25
    precision: "integer; ceil on fractional"
    variants:
      - name: standard
        when: "operational_status == OPEN"
        difference: "formula as written"
      - name: restricted_posture
        when: "operational_status == RESTRICTED"
        difference: "required_lifeguard_count is raised by +1 (chemistry warning margin) before comparing against scheduled guards"

  - name: chemistry_classification
    trigger: "POST /facilities/{id}/chemistry-logs"
    algorithm: threshold
    formula: |
      if free_chlorine_ppm < 1.0 OR free_chlorine_ppm > 5.0 OR ph < 7.2 OR ph > 7.8:
        classification = OUT_OF_RANGE
      elif combined_chlorine_ppm > 0.4:
        classification = WARNING
      else:
        classification = IN_RANGE
    input_set: "the new ChemistryLog's three readings"
    constants:
      FC_MIN: 1.0
      FC_MAX: 5.0
      PH_MIN: 7.2
      PH_MAX: 7.8
      CC_WARN: 0.4
    precision: "comparisons are strict inequality at boundary: fc == 1.0 is IN_RANGE, fc == 0.99 is OUT_OF_RANGE; ph == 7.8 is IN_RANGE, ph == 7.81 is OUT_OF_RANGE"
    variants:
      - name: closure_streak
        when: "two or more consecutive OUT_OF_RANGE readings"
        difference: "second consecutive OUT_OF_RANGE sets chemistry_out_of_range_since to the FIRST reading's recorded_at; reopen requires TWO consecutive IN_RANGE readings to clear, not one"

  - name: rain_check_refund
    trigger: "system on DailyAdmission ENTERED -> RAIN_CHECKED"
    algorithm: waterfall_allocation
    formula: |
      elapsed_min = (closure_started_at - admission.entered_at) / 60s, floor to integer minute
      if closure_reason == WEATHER AND elapsed_min <= 60:
        refund = admission.charge_cents   # FULL_REFUND
      elif closure_reason == WEATHER AND elapsed_min > 60:
        refund = round_half_up(admission.charge_cents * 0.50, 0)   # PRO_RATA_CREDIT 50%
      else:
        refund = 0   # NONE — chemistry/staffing closures do not refund
      # Season-pass admissions have charge_cents=0, so refund=0 automatically (no double-refund of the pass itself)
    input_set: "the DailyAdmission; the PoolClosureEvent"
    constants:
      FULL_REFUND_ELAPSED_MIN: 60
      PRO_RATA_FRACTION: 0.50
    precision: "integer cents; round_half_up"

  - name: waitlist_promotion_order
    trigger: "an ENROLLED LessonEnrollment transitions to DROPPED"
    algorithm: chronological
    formula: |
      candidates = LessonEnrollments WHERE lesson_session_id == session.id AND status == WAITLISTED
      winner = candidate with lowest waitlist_position
      ties broken by created_at ASC (earliest enrollee wins); waitlist_position assigned 1..N at enrollment time
    input_set: "WAITLISTED enrollments for the session, ordered by waitlist_position ASC"
    precision: "integer positions"
    variants: []

  - name: lesson_refund
    trigger: "LessonEnrollment ENROLLED -> DROPPED"
    algorithm: waterfall_allocation
    formula: |
      total_classes = number of distinct class datetimes in LessonSession schedule window
      elapsed_classes = count of class datetimes with datetime < current clock
      remaining_classes = total_classes - elapsed_classes
      if remaining_classes / total_classes >= 0.5:
        refund_cents = ceil(paid_amount * remaining_classes / total_classes)
      else:
        refund_cents = 0
    input_set: "the LessonSession, the LessonEnrollment"
    precision: "integer cents; ceil to cent"
    variants: []

  - name: rental_cancellation_fee
    trigger: "FacilityRental APPROVED -> CANCELLED"
    algorithm: threshold
    formula: |
      hours_to_start = (start_datetime - now) / 3600s, fractional
      if hours_to_start < 72:
        cancellation_fee_cents = round_half_up(quoted_price_cents * 0.25, 0)
      else:
        cancellation_fee_cents = 0
    input_set: "the FacilityRental"
    constants:
      CANCEL_FEE_FRACTION: 0.25
      CANCEL_FEE_WINDOW_HOURS: 72
    precision: "integer cents; round_half_up; comparison is strict `<` — exactly 72.0 hours before start means NO fee"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header is present and one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-ID header is present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 3, category: auth, check: "Role is permitted for this endpoint per RBAC", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path-templated ids resolve to existing resources (left-to-right: facility -> session -> enrollment)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Request-body FK references resolve (pass_holder_id, season_id, level_id, lifeguard_id, lesson_session_id, owning_lesson_session_id, placement_evidence_level_id, involved_pass_holder_id, reporting_lifeguard_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "Target resource's current state permits the requested transition per §1.2", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 7, category: state, check: "OCC: expected_<parent>_version matches parent's current version on guarded endpoints", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /rentals/{id}/approve", "POST /lesson-sessions/{id}/schedule"] }
  - { priority: 8, category: business_safety, check: "Facility not in CLOSED_* when operation admits, checks-in, schedules, or approves (admissions enter, rentals check-in, rental approve, lesson schedule)", error_id: ERR_FACILITY_CLOSED, http_status: 409, applies_to: ["POST /admissions/{id}/enter", "POST /rentals/{id}/check-in", "POST /rentals/{id}/approve", "POST /lesson-sessions/{id}/schedule"] }
  - { priority: 9, category: business_safety, check: "PassHolder.banned_until is null OR in the past when admitting, enrolling, or renting", error_id: ERR_HOLDER_BANNED, http_status: 409, applies_to: ["POST /admissions", "POST /admissions/{id}/enter", "POST /enrollments", "POST /rentals"] }
  - { priority: 10, category: business_safety, check: "Lifeguard cert_status == ACTIVE when submitting IncidentReport or checking-in a shift", error_id: ERR_GUARD_NOT_CERTIFIED, http_status: 409, applies_to: ["POST /incident-reports/{id}/submit", "POST /shifts/{id}/check-in"] }
  - { priority: 11, category: business_temporal, check: "Rental window does not overlap another APPROVED/CHECKED_IN rental at the same facility (whole-facility exclusive); half-open intervals [start, end); touching endpoints are NOT a conflict", error_id: ERR_RENTAL_OVERLAP, http_status: 409, applies_to: ["POST /rentals/{id}/approve"] }
  - { priority: 12, category: business_temporal, check: "LessonSession scheduling leaves enough free lanes: sum of lane_count over overlapping RESERVED LaneAllocations + new lanes_required <= facility.lap_lane_count; half-open intervals [start, end)", error_id: ERR_LANE_CAPACITY_EXCEEDED, http_status: 409, applies_to: ["POST /lesson-sessions/{id}/schedule", "POST /lane-allocations"] }
  - { priority: 13, category: business_temporal, check: "LessonSession window lies inside its MembershipSeason [start_date, end_date] (inclusive)", error_id: ERR_SESSION_OUTSIDE_SEASON, http_status: 422, applies_to: ["POST /lesson-sessions", "POST /lesson-sessions/{id}/schedule"] }
  - { priority: 14, category: business_temporal, check: "Admission admission_date is today (server logical clock) and season is PUBLISHED on that date", error_id: ERR_ADMISSION_DATE_INVALID, http_status: 422, applies_to: ["POST /admissions"] }
  - { priority: 15, category: business_temporal, check: "LifeguardShift.shift_start < shift_end AND both within [now - 1h, +60 days]", error_id: ERR_SHIFT_WINDOW_INVALID, http_status: 422, applies_to: ["POST /shifts"] }
  - { priority: 16, category: business_constraint, check: "Enrollment level prerequisite satisfied: placement_evidence_level_id == level.prerequisite_level_id OR prerequisite_level_id is null; holder age >= level.min_age_years on session start", error_id: ERR_PREREQUISITE_NOT_MET, http_status: 422, applies_to: ["POST /enrollments"] }
  - { priority: 17, category: business_constraint, check: "MembershipSeason publish: resident prices <= non-resident prices; season window does not overlap another PUBLISHED season for the same facility (half-open [start_date, end_date+1d))", error_id: ERR_SEASON_OVERLAP, http_status: 409, applies_to: ["POST /seasons/{id}/publish"] }
  - { priority: 18, category: business_constraint, check: "ChemistryLog numeric inputs in plausible bounds (0 <= fc <= 10, 6.0 <= ph <= 9.0, 0 <= cc <= 5) — outside this range is malformed input, not water chemistry", error_id: ERR_CHEMISTRY_INPUT_INVALID, http_status: 422, applies_to: ["POST /facilities/{id}/chemistry-logs"] }
  - { priority: 19, category: business_fiscal, check: "Rental approval: party_size <= Facility.max_bather_capacity; no RESERVED LaneAllocation overlaps rental window (rentals require exclusive lane use)", error_id: ERR_RENTAL_CAPACITY, http_status: 409, applies_to: ["POST /rentals/{id}/approve"] }
  - { priority: 20, category: business_fiscal, check: "Admission enter: current_bather_count < max_bather_capacity", error_id: ERR_FACILITY_AT_CAPACITY, http_status: 409, applies_to: ["POST /admissions/{id}/enter"] }
  - { priority: 21, category: business_fiscal, check: "Rental check-in: current_bather_count + party_size <= max_bather_capacity", error_id: ERR_FACILITY_AT_CAPACITY, http_status: 409, applies_to: ["POST /rentals/{id}/check-in"] }
  - { priority: 22, category: business_constraint, check: "Enum fields match declared members exactly (case-sensitive); numeric inputs honor min/max; required fields present", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is 2026-05-01T00:00:00Z. Test-driving endpoint outside the business surface."
    roles: [AquaticsManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["time-dependent system transitions re-evaluated"]

  # --- facility ---
  - method: POST
    path: "/facilities"
    description: "Create a Facility"
    roles: [AquaticsManager]
    code: 201
    input: [name, address, max_bather_capacity, lap_lane_count]
    output: Facility
    side_effects: []

  - method: GET
    path: "/facilities/{id}"
    description: "Read a Facility including computed posture"
    roles: [AquaticsManager, GateAttendant, Lifeguard, PassHolder]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: GET
    path: "/facilities"
    description: "List Facilities"
    roles: [AquaticsManager, GateAttendant, Lifeguard, PassHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: Facility[]
    side_effects: []

  - method: GET
    path: "/facilities/{id}/chemistry-logs"
    description: "List ChemistryLogs for a Facility (newest first)"
    roles: [AquaticsManager, Lifeguard, GateAttendant]
    code: 200
    input: ["limit?", "offset?"]
    output: ChemistryLog[]
    side_effects: []

  - method: GET
    path: "/facilities/{id}/closures"
    description: "List PoolClosureEvents for a Facility"
    roles: [AquaticsManager, Lifeguard, GateAttendant, PassHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: PoolClosureEvent[]
    side_effects: []

  - method: POST
    path: "/facilities/{id}/chemistry-logs"
    description: "Record a ChemistryLog; classification computed; may trigger closure cascade"
    roles: [Lifeguard, AquaticsManager]
    code: 201
    input: [recorded_at, free_chlorine_ppm, ph, combined_chlorine_ppm, recorded_by_lifeguard_id]
    output: ChemistryLog
    side_effects:
      - "chemistry_classification computed"
      - "if OUT_OF_RANGE -> Facility OPEN -> CLOSED_CHEMISTRY (with all side effects)"
      - "if WARNING -> Facility OPEN -> RESTRICTED"
      - "if IN_RANGE and prior WARNING -> RESTRICTED -> OPEN"
      - "increments Facility.version by 1"

  - method: POST
    path: "/facilities/{id}/closures"
    description: "Manually declare a closure (typically WEATHER)"
    roles: [AquaticsManager]
    code: 201
    input: [closure_reason, started_at]
    output: PoolClosureEvent
    side_effects:
      - "Facility -> CLOSED_<reason> transition with all side effects"
      - "rain-check issuance for ENTERED DailyAdmissions when reason=WEATHER"
      - "increments Facility.version by 1"

  - method: POST
    path: "/facilities/{id}/reopen"
    description: "Resolve active closures and return Facility to OPEN"
    roles: [AquaticsManager]
    code: 200
    input: []
    output: Facility
    side_effects:
      - "all ACTIVE PoolClosureEvents for facility -> RESOLVED with ended_at=now"
      - "Facility -> OPEN"
      - "increments Facility.version by 1"

  # --- season ---
  - method: POST
    path: "/seasons"
    description: "Create a MembershipSeason in DRAFT"
    roles: [AquaticsManager]
    code: 201
    input: [facility_id, season_name, start_date, end_date, resident_pass_price_cents, non_resident_pass_price_cents, resident_daily_price_cents, non_resident_daily_price_cents]
    output: MembershipSeason
    side_effects: []

  - method: GET
    path: "/seasons/{id}"
    description: "Read a MembershipSeason"
    roles: [AquaticsManager, GateAttendant, PassHolder, Lifeguard]
    code: 200
    input: []
    output: MembershipSeason
    side_effects: []

  - method: GET
    path: "/seasons"
    description: "List MembershipSeasons (filterable by facility_id)"
    roles: [AquaticsManager, GateAttendant, PassHolder, Lifeguard]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: MembershipSeason[]
    side_effects: []

  - method: GET
    path: "/seasons/{id}/passes"
    description: "List SeasonPasses purchased against a MembershipSeason"
    roles: [AquaticsManager, GateAttendant]
    code: 200
    input: []
    output: SeasonPass[]
    side_effects: []

  - method: POST
    path: "/seasons/{id}/publish"
    description: "Publish a season (validates pricing and overlap)"
    roles: [AquaticsManager]
    code: 200
    input: []
    output: MembershipSeason
