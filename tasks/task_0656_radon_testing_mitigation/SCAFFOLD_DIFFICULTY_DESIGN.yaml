# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Radon Testing & Mitigation — 9 rule_ids × 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_continuous_monitor_valid_vs_all_hours_mean
        grounds:
          - calculations.radon_result_average
          - entities.RadonTest.fields.warmup_hours_dropped
          - entities.RadonTest.fields.hourly_readings
          - state_machines.RadonTest.RETRIEVED_to_RESULT_READY
        distinguishing_aspect: |
          On a CONTINUOUS_MONITOR test the valid-hours mean (drop first 4 warm-up
          hours) is 3.5 pCi/L → NO_ACTION, while the all-hours mean of the same
          readings is 4.0 pCi/L → ACTION_RECOMMENDED; the correct variant is
          valid-hours and the test asserts the divergence flips action_outcome.
        test_recipe:
          setup:
            - "Inspector ACTIVE; Property OPEN at clock default 2026-04-01T00:00:00Z."
            - "A CONTINUOUS_MONITOR INITIAL test placed and retrieved with hourly_readings = [9,9,9,9, 3.5*44], warmup_hours_dropped=4."
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", nrpp_license_id: "NRPP-001" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 Radon Way", foundation_type: "BASEMENT", floor_area_sqft: 2200 }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "CONTINUOUS_MONITOR", purpose: "INITIAL", placement_window_hours: 48, warmup_hours_dropped: 4 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { test_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /radon-tests/${test_id}/retrieve"
              payload: { hourly_readings: [9,9,9,9,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5,3.5] }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /radon-tests/${test_id}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { res: $.data.result_pci_l, outcome: $.data.action_outcome }
          assert:
            - "RadonTest.${test_id}.result_pci_l == 3.5"
            - "RadonTest.${test_id}.action_outcome == NO_ACTION"
            - "Property.${prop_id}.latest_result_pci_l == 3.5"

      - name: dvc_warranty_refund_straight_line_vs_step_tier
        grounds:
          - calculations.warranty_refund
          - entities.Warranty.fields.refund_method
          - entities.Warranty.fields.covered_system_price_cents
          - state_machines.Warranty.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          For the same covered_system_price_cents=410550 and 90 elapsed days of a
          1825-day term, STRAIGHT_LINE refund = 390304 cents whereas STEP_TIER
          refund (frac<0.25 band → 90%) = 369495 cents; the refund_method field
          selects which, and the two diverge on the Warranty entity (a domain
          distinct from RadonTest averaging).
        test_recipe:
          setup:
            - "A fully cleared JOB A warranty (covered_system_price_cents=410550, term_days=1825, refund_method=STEP_TIER) started_at 2026-04-03T00:00:00Z."
            - "Clock advanced to 2026-07-02T00:00:00Z (90 days elapsed)."
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", nrpp_license_id: "NRPP-010" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew One", max_jobs_per_day: 2 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "2 Radon Way", foundation_type: "BASEMENT", floor_area_sqft: 2200 }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { t_init: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /radon-tests/${t_init}/retrieve"
              payload: { lab_integrated_pci_l: 6.0 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /radon-tests/${t_init}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /mitigation-jobs"
              payload: { property_id: "${prop_id}", triggering_test_id: "${t_init}", system_design: "SUB_SLAB_DEPRESSURIZATION", num_suction_points: 3, has_sump_pump: true, is_rush: true, warranty_refund_method: "STEP_TIER" }
              as: MitigationDesigner
              captures: { job_id: $.data.id }
            - call: "POST /mitigation-jobs/${job_id}/quote"
              payload: {}
              as: MitigationDesigner
              captures: { dep_req: $.data.deposit_required_cents, total: $.data.quote_total_cents }
            - call: "POST /payment-records"
              payload: { mitigation_job_id: "${job_id}", kind: "DEPOSIT", amount_cents: 123165 }
              as: ClientContact
            - call: "POST /payment-records"
              payload: { mitigation_job_id: "${job_id}", kind: "BALANCE", amount_cents: 287385 }
              as: ClientContact
            - call: "GET /properties/${prop_id}"
              as: ClientContact
              captures: { prop_v: $.data.version }
            - call: "POST /mitigation-jobs/${job_id}/schedule"
              payload: { crew_id: "${crew_id}", install_start_utc: "2026-04-03T08:00:00Z", install_end_utc: "2026-04-03T12:00:00Z", expected_property_version: "${prop_v}" }
              as: MitigationDesigner
            - call: "POST /permits"
              payload: { mitigation_job_id: "${job_id}", jurisdiction_code: "CTY-1", permit_number: "P-1001" }
              as: ComplianceOfficer
            - call: "POST /mitigation-jobs/${job_id}/complete-install"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "POST_MITIGATION", mitigation_job_id: "${job_id}", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { t_post: $.data.id }
            - call: "POST /radon-tests/${t_post}/retrieve"
              payload: { lab_integrated_pci_l: 1.5 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /radon-tests/${t_post}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /warranties"
              as: ClientContact
              captures: { warr_id: '$.data[0].id' }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /warranties/${warr_id}"
              as: ClientContact
              captures: { warr_v: $.data.version, rm: $.data.refund_method }
          trigger:
            - call: "POST /warranties/${warr_id}/cancel"
              payload: { expected_warranty_version: "${warr_v}" }
              as: ClientContact
              captures: { refund: $.data.refund_paid_cents }
          assert:
            - "Warranty.${warr_id}.refund_method == STEP_TIER"
            - "Warranty.${warr_id}.refund_paid_cents == 369495"
            - "Warranty.${warr_id}.coverage_status == CANCELLED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_quote_tiered_nonlinear_three_plus_inputs
        grounds:
          - calculations.mitigation_quote
          - entities.Property.fields.foundation_type
          - entities.Property.fields.floor_area_sqft
          - entities.MitigationJob.fields.num_suction_points
          - entities.MitigationJob.fields.has_sump_pump
        distinguishing_aspect: |
          Mode (a): quote_subtotal = base(foundation) + max(points-1,0)*45000 +
          (sump?32000:0) + tiered area surcharge — five interacting inputs with a
          nonlinear tiered area term; BASEMENT/2200sqft/3pts/sump = 357000 cents.
        test_recipe:
          setup:
            - "Property BASEMENT, 2200 sqft (tier 2). ACTION_RECOMMENDED INITIAL test exists."
            - "Job designed with 3 suction points, sump pump true, is_rush false."
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", nrpp_license_id: "NRPP-020" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "3 Radon Way", foundation_type: "BASEMENT", floor_area_sqft: 2200 }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { t_init: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /radon-tests/${t_init}/retrieve"
              payload: { lab_integrated_pci_l: 6.0 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /radon-tests/${t_init}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /mitigation-jobs"
              payload: { property_id: "${prop_id}", triggering_test_id: "${t_init}", num_suction_points: 3, has_sump_pump: true, is_rush: false }
              as: MitigationDesigner
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /mitigation-jobs/${job_id}/quote"
              payload: {}
              as: MitigationDesigner
              captures: { sub: $.data.quote_subtotal_cents, total: $.data.quote_total_cents }
          assert:
            - "MitigationJob.${job_id}.quote_subtotal_cents == 357000"
            - "MitigationJob.${job_id}.rush_surcharge_cents == 0"
            - "MitigationJob.${job_id}.quote_total_cents == 357000"
            - "MitigationJob.${job_id}.deposit_required_cents == 107100"

      - name: cf_quote_rush_surcharge_keyed_off_subtotal_order_pinned
        grounds:
          - calculations.mitigation_quote
          - entities.MitigationJob.fields.is_rush
          - entities.MitigationJob.fields.rush_surcharge_cents
          - entities.MitigationJob.fields.quote_total_cents
        distinguishing_aspect: |
          Mode (c): rush_surcharge_cents = round_half_up(0.15 * subtotal) and
          deposit = round_half_up(0.30 * total) — surcharge is keyed off the
          fully-resolved subtotal so evaluation order is pinned (subtotal →
          surcharge → total → deposit); same job as cf instance 1 but is_rush=true
          yields subtotal 357000, surcharge 53550, total 410550, deposit 123165.
        test_recipe:
          setup:
            - "Same BASEMENT/2200/3pts/sump property and ACTION test as the standard quote, but is_rush=true."
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", nrpp_license_id: "NRPP-021" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "4 Radon Way", foundation_type: "BASEMENT", floor_area_sqft: 2200, is_real_estate_transaction: true, closing_deadline_utc: "2026-05-01T00:00:00Z" }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { t_init: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /radon-tests/${t_init}/retrieve"
              payload: { lab_integrated_pci_l: 6.0 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /radon-tests/${t_init}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /mitigation-jobs"
              payload: { property_id: "${prop_id}", triggering_test_id: "${t_init}", num_suction_points: 3, has_sump_pump: true, is_rush: true }
              as: MitigationDesigner
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /mitigation-jobs/${job_id}/quote"
              payload: {}
              as: MitigationDesigner
              captures: { surcharge: $.data.rush_surcharge_cents, total: $.data.quote_total_cents }
          assert:
            - "MitigationJob.${job_id}.quote_subtotal_cents == 357000"
            - "MitigationJob.${job_id}.rush_surcharge_cents == 53550"
            - "MitigationJob.${job_id}.quote_total_cents == 410550"
            - "MitigationJob.${job_id}.deposit_required_cents == 123165"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_job_retest_rework_reschedule_cycle
        grounds:
          - state_machines.MitigationJob.RETEST_PENDING_to_REWORK
          - state_machines.MitigationJob.REWORK_to_SCHEDULED
          - state_machines.RadonTest.RETRIEVED_to_RESULT_READY
        distinguishing_aspect: |
          MitigationJob exhibits a cycle RETEST_PENDING→REWORK→SCHEDULED: a failing
          POST_MITIGATION retest (ACTION_RECOMMENDED) drives the job to REWORK, and
          a re-schedule returns it to SCHEDULED, re-entering the install loop on the
          same job id (no new deposit).
        test_recipe:
          setup:
            - "JOB A installed and a POST_MITIGATION test placed/retrieved (RETEST_PENDING)."
            - "balance fully paid; the post-mit retest yields ACTION_RECOMMENDED (lab 5.0)."
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", nrpp_license_id: "NRPP-030" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew C30", max_jobs_per_day: 2 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "5 Radon Way", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { t_init: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /radon-tests/${t_init}/retrieve"
              payload: { lab_integrated_pci_l: 6.0 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /radon-tests/${t_init}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /mitigation-jobs"
              payload: { property_id: "${prop_id}", triggering_test_id: "${t_init}", num_suction_points: 1, has_sump_pump: false, is_rush: false }
              as: MitigationDesigner
              captures: { job_id: $.data.id }
            - call: "POST /mitigation-jobs/${job_id}/quote"
              payload: {}
              as: MitigationDesigner
            - call: "POST /payment-records"
              payload: { mitigation_job_id: "${job_id}", kind: "DEPOSIT", amount_cents: 45000 }
              as: ClientContact
            - call: "POST /payment-records"
              payload: { mitigation_job_id: "${job_id}", kind: "BALANCE", amount_cents: 105000 }
              as: ClientContact
            - call: "GET /properties/${prop_id}"
              as: ClientContact
              captures: { prop_v: $.data.version }
            - call: "POST /mitigation-jobs/${job_id}/schedule"
              payload: { crew_id: "${crew_id}", install_start_utc: "2026-04-03T08:00:00Z", install_end_utc: "2026-04-03T12:00:00Z", expected_property_version: "${prop_v}" }
              as: MitigationDesigner
            - call: "POST /permits"
              payload: { mitigation_job_id: "${job_id}", jurisdiction_code: "CTY-1", permit_number: "P-3001" }
              as: ComplianceOfficer
            - call: "POST /mitigation-jobs/${job_id}/complete-install"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "POST_MITIGATION", mitigation_job_id: "${job_id}", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { t_post: $.data.id }
            - call: "POST /radon-tests/${t_post}/retrieve"
              payload: { lab_integrated_pci_l: 5.0 }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /radon-tests/${t_post}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { outcome: $.data.action_outcome }
            - call: "GET /mitigation-jobs/${job_id}"
              as: MitigationDesigner
              captures: { job_status: $.data.status }
            - call: "GET /properties/${prop_id}"
              as: ClientContact
              captures: { prop_v2: $.data.version }
            - call: "POST /mitigation-jobs/${job_id}/schedule"
              payload: { crew_id: "${crew_id}", install_start_utc: "2026-04-05T08:00:00Z", install_end_utc: "2026-04-05T12:00:00Z", expected_property_version: "${prop_v2}" }
              as: MitigationDesigner
              captures: { job_status2: $.data.status }
          assert:
            - "RadonTest.${t_post}.action_outcome == ACTION_RECOMMENDED"
            - "MitigationJob.${job_id}.status == SCHEDULED after the re-schedule (was REWORK after record-result)"
            - "MitigationJob.${job_id}.deposit_paid_cents == 45000 unchanged by rework"

      - name: nlsm_warranty_parallel_coverage_and_claim_dimensions
        grounds:
          - state_machines.Warranty.NONE_to_CLAIM_OPEN
          - state_machines.Warranty.ACTIVE_to_CANCELLED
          - entities.Warranty.fields.coverage_status
          - entities.Warranty.fields.claim_status
        distinguishing_aspect: |
          Warranty carries two independent dimensions: opening a claim moves
          claim_status NONE→CLAIM_OPEN while coverage_status stays ACTIVE, proving
          the dimensions evolve independently on one row (parallel, not linear).
        test_recipe:
          setup:
            - "A cleared JOB A warranty (coverage_status ACTIVE, claim_status NONE)."
            - "A RECURRING retest with result 2.5 pCi/L (>= guarantee_ceiling 2.0) makes Property.latest_result_pci_l = 2.5."
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", nrpp_license_id: "NRPP-040" }
