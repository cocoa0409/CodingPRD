      - name: the_role_gate_runs_before_the_path_is_resolved_and_the_identity_gate_runs_before_that
        claim_type: unauthorized_role
        grounds:
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_2
          - validations.priority_4
        distinguishing_aspect: |
          Three checks are stacked in a fixed order and each one is observable
          separately. First identity: a mutating call with no X-User-ID is 401 even
          when the role is perfectly authorised. Then authorisation: a role missing
          from the endpoint's list is 403 BEFORE any path segment is resolved, so an
          unauthorised caller pointing at an all-zero project id gets 403 and not 404
          - the API must not leak existence to callers who cannot act. Finally the
          reads: every GET is open to all six roles and is not a mutating request, so
          a GET with no X-User-ID still succeeds. An implementation that resolves the
          path first, or that demands a user id on reads, is caught by two of these
          five probes.
        test_recipe:
          setup:
            - "project in DESIGN_DEV with one case in DRAFT"
