scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: inventory_net_volume_intake_versus_settlement_basis
        grounds:
          - calculations.inventory_net_sellable_volume
          - entities.InventoryLot.fields.basis
          - entities.InventoryLot.fields.net_sellable_cubic_yards
          - state_machines.InventoryLot.AVAILABLE_to_QUARANTINED
        distinguishing_aspect: |
          This instance's two variants diverge on the VOLUME domain (cubic yards of stockpile):
          intake_basis charges the full shrinkage_factor against gross_cubic_yards, while
          settlement_basis charges only shrinkage_factor/2 against (gross - withdrawn), so the
          identical physical 100.00-cubic-yard lot at 20% moisture reports 85.50 before the
          moisture reading and 90.25 after it.
        test_recipe:
          setup:
            - "One Material (density 1000, shrinkage_factor 0.10) with an EFFECTIVE price row."
            - "One InventoryLot scaled in at gross 100.00 cubic yards and 20% intake moisture, nothing withdrawn or reserved."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "MULCH-BROWN", name: "Brown Hardwood Mulch", offered_forms: [BULK, BAGGED], seasonal_category: "MULCH", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 20.0 }
              as: YardAdmin
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /inventory-lots/${lot_id}/moisture-readings"
              payload: { current_moisture_pct: 20.0, set_quarantine: false }
              as: YardAdmin
          assert:
            - "Before the trigger, InventoryLot.${lot_id}.basis == INTAKE and net_sellable_cubic_yards == 85.50"
            - "After the trigger, InventoryLot.${lot_id}.basis == SETTLEMENT and net_sellable_cubic_yards == 90.25"
            - "The variant switch moves the sellable volume by exactly +4.75 cubic yards on unchanged physical inputs"
            - "InventoryLot.${lot_id}.status == AVAILABLE and withdrawn_gross_cubic_yards == 0.0"
            - "Material.${mat_id}.available_net_cubic_yards == 90.25 after the trigger"

      - name: order_total_quoted_at_confirm_versus_final_at_delivery
        grounds:
          - calculations.order_line_pricing
          - calculations.order_charge_assembly
          - state_machines.MaterialOrder.DRAFT_to_CONFIRMED
          - state_machines.DeliveryLoad.DISPATCHED_to_DELIVERED
          - entities.MaterialOrder.fields.quoted_total_cents
          - entities.MaterialOrder.fields.final_total_cents
        distinguishing_aspect: |
          This instance's two variants diverge on the MONEY domain and are selected by lifecycle
          position, not by a stored flag: quoted_at_confirm prices the line off the price row
          effective at quote_locked_at (3333 cents, no surcharge) while final_at_delivery prices
          the same 20.00 cubic yards off the row effective at the dispatch instant (4000 cents
          plus a 10% seasonal surcharge), so quoted_total_cents 84410 and final_total_cents
          105750 differ by 21340 cents on identical order input.
        test_recipe:
          setup:
            - "Material at 1000 lb/cubic-yard, 15% moisture; price row P1 effective 2026-07-01 at 3333 cents/cubic-yard with no surcharge."
            - "Stockpile lot of 100.00 gross cubic yards at 15% moisture (90.00 net sellable)."
            - "Contractor account with a 5,000,000-cent credit line; DELIVERY order for CLASS_A access, 10.0 haul miles, one BULK line of 20.00 cubic yards, confirmed at the default clock."
            - "A seasonal price row P2 effective 2026-08-15 at 4000 cents/cubic-yard with a 10% surcharge is filed after the confirm, and the clock is then advanced to 2026-08-20."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "MULCH-BROWN", name: "Brown Hardwood Mulch", offered_forms: [BULK, BAGGED], seasonal_category: "MULCH", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 3333, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Verde Landscapes", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "DELIVERY", delivery_address: "18 Jobsite Rd", driveway_access_class: "CLASS_A", delivery_distance_miles: 10.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 20.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { line_id: $.data.id }
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "GET /materials/${mat_id}"
              payload: {}
              as: YardAdmin
              captures: { mat_ver2: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-08-15T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 4000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 10.0, expected_material_version: "${mat_ver2}" }
              as: YardAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: YardAdmin
            - call: "POST /delivery-trucks"
              payload: { truck_code: "T-101", axle_class: "TRI_AXLE", max_payload_lb: 40000, bed_capacity_cubic_yards: 25.0, min_driveway_access_class: "CLASS_C" }
              as: DispatchPlanner
              captures: { truck_id: $.data.id }
            - call: "POST /delivery-loads"
              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 20.0, window_start: "2026-08-20T08:00:00.000Z", window_end: "2026-08-20T12:00:00.000Z" }
              as: DispatchPlanner
              captures: { load_id: $.data.id }
            - call: "POST /delivery-loads/${load_id}/dispatch"
              payload: {}
              as: DispatchPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /delivery-loads/${load_id}/deliver"
              payload: { actual_net_cubic_yards: 20.0, driveway_protection_used: true }
              as: DispatchPlanner
              as_user_id: "planner-1"
          assert:
            - "MaterialOrder.${ord_id}.quoted_total_cents == 84410"
            - "MaterialOrder.${ord_id}.final_total_cents == 105750"
            - "OrderLine.${line_id}.line_price_cents == 66660 and OrderLine.${line_id}.final_line_price_cents == 88000"
            - "MaterialOrder.${ord_id}.fulfillment_status == FULFILLED and settlement_status == UNBILLED"
            - "ContractorAccount.${acct_id}.credit_used_cents == 105750"

  - rule_id: combinatorial_formula
    instances:
      - name: truck_fit_three_input_minimum_binds_on_driveway_cap
        grounds:
          - calculations.truck_load_fit
          - entities.DeliveryLoad.fields.max_allowed_cubic_yards
          - entities.DeliveryLoad.fields.planned_payload_lb
          - validations[priority=23]
        distinguishing_aspect: |
          Combinatorial mode (a): a single non-linear MIN over three independently-sourced
          inputs — truck geometry (14.0 bed cubic yards), legal weight converted to volume
          through the moisture-adjusted density (FLOOR_2DP(12000 / 860.00) = 13.95), and the
          site's driveway cap (CLASS_B = 12.0) — where the third input is the binding one, so
          max_allowed_cubic_yards is 12.00 and a 12.5-cubic-yard load is rejected on volume
          while its 10750-lb payload is still legal.
        test_recipe:
          setup:
            - "Material at 800 lb/cubic-yard and 22.5% moisture, so effective density is 860.00 lb/cubic-yard."
            - "Stockpile lot of 100.00 gross cubic yards at 22.5% intake moisture (83.25 net sellable)."
            - "CONFIRMED DELIVERY order for CLASS_B access with one 30.00-cubic-yard BULK line."
            - "One TANDEM truck with max_payload_lb 12000, bed_capacity_cubic_yards 14.0 and min_driveway_access_class CLASS_C."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-57", name: "#57 Washed Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 800, shrinkage_factor: 0.10, moisture_pct: 22.5, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 22.5 }
              as: YardAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Stonebridge Hardscape", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "DELIVERY", delivery_address: "44 Narrow Lane", driveway_access_class: "CLASS_B", delivery_distance_miles: 5.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 30.0 }
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /delivery-trucks"
              payload: { truck_code: "T-202", axle_class: "TANDEM", max_payload_lb: 12000, bed_capacity_cubic_yards: 14.0, min_driveway_access_class: "CLASS_C" }
              as: DispatchPlanner
              captures: { truck_id: $.data.id }
          trigger:
            - call: "POST /delivery-loads"
              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 12.0, window_start: "2026-08-02T08:00:00.000Z", window_end: "2026-08-02T10:00:00.000Z" }
              as: DispatchPlanner
              captures: { load_id: $.data.id }
            - call: "POST /delivery-loads"
              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 12.5, window_start: "2026-08-03T08:00:00.000Z", window_end: "2026-08-03T10:00:00.000Z" }
              as: DispatchPlanner
          assert:
            - "Material.${mat_id}.effective_density_lb_per_cubic_yard == 860.00"
            - "The first trigger returns 201 with DeliveryLoad.${load_id}.max_allowed_cubic_yards == 12.00 and planned_payload_lb == 10320"
            - "DeliveryLoad.${load_id}.status == PLANNED"
            - "The second trigger returns 422 with error_id ERR_LOAD_EXCEEDS_TRUCK_CAPACITY (12.5 > MIN(14.0, 12.0)) even though its 10750-lb payload is under the 12000-lb ceiling"
            - "No second DeliveryLoad row exists for MaterialOrder.${ord_id}"

      - name: per_line_rounding_before_summation_with_min_load_fee_and_axle_base
        grounds:
          - calculations.order_line_pricing
          - calculations.order_charge_assembly
          - entities.MaterialOrder.fields.bulk_subtotal_cents
          - entities.MaterialOrder.fields.min_load_fee_cents
          - entities.MaterialOrder.fields.delivery_fee_cents
        distinguishing_aspect: |
          Combinatorial mode (b): the value depends on the pinned ORDER of operations across
          three interacting terms rather than on one MIN — each BULK line is extended at full
          precision and rounded individually (5374 + 8957 = 14331) instead of rounded once after
          summation (14332), the minimum-load fee is then decided on that post-discount bulk
          figure, and the delivery fee's axle base is drawn from the driveway access class, so
          quoted_total_cents is 45591 and no other evaluation order reproduces it.
        test_recipe:
          setup:
            - "Material priced at 3333 cents/cubic-yard bulk, 899 cents/bag bagged, with a 7.5% seasonal surcharge on bulk only."
            - "Stockpile lot of 200.00 gross cubic yards at 15% moisture (180.00 net sellable)."
            - "DRAFT DELIVERY order for CLASS_B access at 12.4 haul miles carrying BULK lines of 1.50 and 2.50 cubic yards plus a BAGGED line of 10 bags."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "MULCH-BLACK", name: "Black Dyed Mulch", offered_forms: [BULK, BAGGED], seasonal_category: "MULCH", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 3333, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 7.5, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 200.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Cedar Ridge Lawn", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "DELIVERY", delivery_address: "9 Cedar Ct", driveway_access_class: "CLASS_B", delivery_distance_miles: 12.4 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 1.5 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { line_a: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 2.5 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { line_b: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BAGGED", quantity: 10 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { line_c: $.data.id }
          trigger:
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
          assert:
            - "OrderLine.${line_a}.line_price_cents == 5374 and OrderLine.${line_b}.line_price_cents == 8957"
            - "OrderLine.${line_a}.unit_price_cents == 3583"
            - "MaterialOrder.${ord_id}.bulk_subtotal_cents == 14331 (NOT 14332, which is the sum-then-round result)"
            - "MaterialOrder.${ord_id}.bagged_subtotal_cents == 8990 and OrderLine.${line_c}.line_volume_cubic_yards == 0.37"
            - "MaterialOrder.${ord_id}.volume_discount_pct == 0.0 and volume_discount_cents == 0"
            - "MaterialOrder.${ord_id}.min_load_fee_cents == 7500 and delivery_fee_cents == 14770"
            - "MaterialOrder.${ord_id}.quoted_total_cents == 45591"

  - rule_id: non_linear_state_machine
    instances:
      - name: material_order_parallel_dimensions_move_independently
        grounds:
          - state_machines.MaterialOrder.ALLOCATED_to_FULFILLED
          - state_machines.MaterialOrder.UNBILLED_to_INVOICED
          - state_machines.MaterialOrder.INVOICED_to_CREDIT_MEMO_ISSUED
          - entities.MaterialOrder.fields.fulfillment_status
          - entities.MaterialOrder.fields.settlement_status
        distinguishing_aspect: |
          Non-linearity of the PARALLEL kind: MaterialOrder carries two stored dimensions, and a
          claim settlement drives settlement_status INVOICED -> CREDIT_MEMO_ISSUED while
          fulfillment_status stays FULFILLED — no single-axis machine can express the resulting
          combined state (FULFILLED, CREDIT_MEMO_ISSUED).
        test_recipe:
          setup:
            - "Material at 2000 cents/cubic-yard; stockpile lot of 100.00 gross cubic yards at 15% moisture."
            - "Account with a 5,000,000-cent line; DELIVERY order (CLASS_A, 4.0 miles) with one BULK line of 10.00 cubic yards."
            - "The order is confirmed, loaded on a TRI_AXLE truck, dispatched by planner-1, delivered in full, and invoiced."
            - "A 30000-cent DRIVEWAY_DAMAGE claim is filed against the load (delivered without driveway protection, so the deductible is 0) and approved at 20000 cents by adjuster-1."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "SOIL-TOP", name: "Screened Topsoil", offered_forms: [BULK], seasonal_category: "SOIL", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Northgate Grounds", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "DELIVERY", delivery_address: "3 Northgate Way", driveway_access_class: "CLASS_A", delivery_distance_miles: 4.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 10.0 }
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /delivery-trucks"
              payload: { truck_code: "T-303", axle_class: "TRI_AXLE", max_payload_lb: 20000, bed_capacity_cubic_yards: 15.0, min_driveway_access_class: "CLASS_C" }
              as: DispatchPlanner
              captures: { truck_id: $.data.id }
            - call: "POST /delivery-loads"
              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 10.0, window_start: "2026-08-02T08:00:00.000Z", window_end: "2026-08-02T12:00:00.000Z" }
              as: DispatchPlanner
              captures: { load_id: $.data.id }
            - call: "POST /delivery-loads/${load_id}/dispatch"
              payload: {}
              as: DispatchPlanner
              as_user_id: "planner-1"
            - call: "POST /delivery-loads/${load_id}/deliver"
              payload: { actual_net_cubic_yards: 10.0, driveway_protection_used: false }
              as: DispatchPlanner
              as_user_id: "planner-1"
            - call: "POST /material-orders/${ord_id}/invoice"
              payload: {}
              as: CreditManager
            - call: "POST /claim-cases"
              payload: { material_order_id: "${ord_id}", claim_type: "DRIVEWAY_DAMAGE", claimed_amount_cents: 30000, description: "Apron cracked by the tri-axle", delivery_load_id: "${load_id}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claim-cases/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-1"
            - call: "POST /claim-cases/${claim_id}/decide"
              payload: { decision: "APPROVE", approved_amount_cents: 20000 }
              as: ClaimsAdjuster
              as_user_id: "adjuster-1"
          trigger:
            - call: "POST /claim-cases/${claim_id}/settle"
              payload: {}
              as: CreditManager
          assert:
            - "MaterialOrder.${ord_id}.quoted_total_cents == 42700 and final_total_cents == 42700"
            - "ClaimCase.${claim_id}.payable_cents == 20000 and invoice_offset_cents == 20000"
            - "MaterialOrder.${ord_id}.settlement_status == CREDIT_MEMO_ISSUED"
            - "MaterialOrder.${ord_id}.fulfillment_status == FULFILLED (unchanged by the settlement)"
            - "MaterialOrder.${ord_id}.credit_memo_cents == 20000"
            - "ContractorAccount.${acct_id}.credit_used_cents == 22700"

      - name: claim_case_cycles_through_info_requested_twice
        grounds:
          - state_machines.ClaimCase.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.ClaimCase.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.ClaimCase.fields.review_round
          - validations[priority=16]
        distinguishing_aspect: |
          Non-linearity of the CYCLIC kind: the same UNDER_REVIEW state is re-entered twice
          through INFO_REQUESTED, and the loop counter review_round reaches exactly 3 — a
          progress field no acyclic machine can produce, and one that keeps the second loop from
          being indistinguishable from the first.
        test_recipe:
          setup:
            - "A delivered DELIVERY order (10.00 cubic yards at 2000 cents) with a SPILLAGE claim of 12000 cents already under adjuster review (review_round 1)."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "SALT-BULK", name: "Bulk Rock Salt", offered_forms: [BULK], seasonal_category: "SALT", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: true }
              as: YardAdmin
