          One POST /appointments violates three rules at once: the plan is SUSPENDED
          (state, priority 45), the patient is on a steering hold (priority 75) and the
          requested window 1080 + 240 == 1320 runs past the 1140 close minute
          (business_temporal, priority 94). Only the lowest number may surface, so the
          answer must be ERR_PLAN_SUSPENDED. Because the clock-window check is the one most
