      - claim_type: aggregation_window_and_pool
        name: nationality_mix_window_excludes_stale_and_unscanned_itineraries
        grounds:
          - calculations.terminal_nationality_mix
          - endpoints["GET /terminals/{terminal_id}/nationality-mix"]
          - entities.Terminal.fields.scanned_itinerary_count_30d
        distinguishing_aspect: |
          The mix pool is itineraries with scan_status IN {SCANNED, AMENDED} whose scanned_at lies within
          30 days of the CURRENT clock, so advancing the clock past the window MUST drop older scans out
          of the denominator, an UNSCANNED itinerary MUST never count, and an empty pool MUST yield an
          EMPTY OBJECT with count 0 rather than a division by zero. Shares are FLOORED, so three equal
          nationalities give 3333 each and do not sum to 10000.
        test_recipe:
          setup:
            - "Terminal SIN in SG with no itineraries"
            - "Three itineraries scanned at 2026-08-01 with nationalities CN, IN and JP, plus one UNSCANNED CN itinerary"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "GET /terminals/${t_sin}/nationality-mix"
              as: TerminalAdmin
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0113", nationality_code: "CN", boarding_pass_barcode: "BP-0113", departure_terminal_id: "${t_sin}", departure_utc: "2026-09-25T10:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_cn: $.data.id }
            - call: "POST /itineraries/${it_cn}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0113" }
              as: SalesAssociate
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0114", nationality_code: "IN", boarding_pass_barcode: "BP-0114", departure_terminal_id: "${t_sin}", departure_utc: "2026-09-25T11:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_in: $.data.id }
            - call: "POST /itineraries/${it_in}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0114" }
              as: SalesAssociate
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0115", nationality_code: "JP", boarding_pass_barcode: "BP-0115", departure_terminal_id: "${t_sin}", departure_utc: "2026-09-25T12:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_jp: $.data.id }
            - call: "POST /itineraries/${it_jp}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0115" }
              as: SalesAssociate
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0116", nationality_code: "CN", boarding_pass_barcode: "BP-0116", departure_terminal_id: "${t_sin}", departure_utc: "2026-09-25T13:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_unscanned: $.data.id }
          trigger:
            - call: "GET /terminals/${t_sin}/nationality-mix"
              as: TerminalAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: TerminalAdmin
            - call: "GET /terminals/${t_sin}/nationality-mix"
              as: TerminalAdmin
          assert:
            - "the pre-itinerary nationality-mix call returns scanned_itinerary_count 0 and mix_bps {}"
            - "the second nationality-mix call returns scanned_itinerary_count 3, not 4 - the UNSCANNED itinerary is outside the pool"
            - "the second nationality-mix call returns mix_bps.CN == 3333, mix_bps.IN == 3333 and mix_bps.JP == 3333"
            - "the three floored shares sum to 9999, which is correct and MUST NOT be normalised to 10000"
            - "Terminal.${t_sin}.scanned_itinerary_count_30d == 3 after the second call"
            - "the third nationality-mix call, 31 days after the scans, returns scanned_itinerary_count 0 and mix_bps {}"
            - "Terminal.${t_sin}.traveler_nationality_mix == {} after the window has passed"

      - claim_type: threshold_boundary
        name: shrinkage_tolerance_at_exactly_two_percent_closes_the_audit_clean
        grounds:
          - calculations.unaccounted_goods_duty_assessment
          - state_machines.CustomsAudit.SUBMITTED_to_CLOSED_CLEAN
          - state_machines.CustomsAudit.SUBMITTED_to_CLOSED_ASSESSED
          - errors.ERR_COUNTED_QTY_EXCEEDS_EXPECTED
        distinguishing_aspect: |
          The tolerance is FLOOR(expected * 200 / 10000), and assessable_qty is
          max(0, shrinkage - tolerance): a shrinkage of exactly 2 on 100 units is fully absorbed, so the
          fork MUST take the CLOSED_CLEAN branch with assessed_duty_cents 0, NO write-off movement and an
          unchanged terminal liability. One unit more crosses the threshold and takes the CLOSED_ASSESSED
          branch, whose write-off is -shrinkage_qty (3), NOT -assessable_qty (1).
        test_recipe:
          setup:
            - "Terminal HKG in HK, one LISTED ELECTRONICS product at 20000 cents / 700 bps with 100 units"
            - "ConcessionAgreement 2026-08 for HKG, activated and then closed after the clock passes the period end"
            - "Two audits for period 2026-08 on the same stock item, prepared by user-stock-01"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "HKG", name: "Hong Kong Duty Free", country_code: "HK", sealed_bag_regime: "ICAO_STEB", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_hkg: $.data.id }
            - call: "POST /brands"
              payload: { name: "Meridian Timepieces", category: "ELECTRONICS" }
              as: TerminalAdmin
              captures: { b_mer: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_mer}", sku: "MER-WATCH-01", category: "ELECTRONICS", unit_price_cents: 20000, duty_rate_bps: 0, vat_rate_bps: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_watch: $.data.id }
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_hkg}", product_id: "${p_watch}" }
              as: StockController
              captures: { si_watch: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_watch}", movement_type: "RECEIPT", qty_delta: 100 }
              as: StockController
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_hkg}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
              captures: { ag_hkg: $.data.id }
            - call: "POST /concession-agreements/${ag_hkg}/activate"
              payload: {}
              as: TerminalAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: TerminalAdmin
            - call: "POST /concession-agreements/${ag_hkg}/close-period"
              payload: {}
              as: TerminalAdmin
            - call: "POST /customs-audits"
              payload: { terminal_id: "${t_hkg}", stock_item_id: "${si_watch}", period_code: "2026-08" }
              as: StockController
              as_user_id: "user-stock-01"
              captures: { au_clean: $.data.id }
            - call: "POST /customs-audits"
              payload: { terminal_id: "${t_hkg}", stock_item_id: "${si_watch}", period_code: "2026-08" }
              as: StockController
              as_user_id: "user-stock-01"
              captures: { au_assessed: $.data.id }
          trigger:
            - call: "POST /customs-audits/${au_clean}/submit"
              payload: { counted_qty: 101 }
              as: StockController
              as_user_id: "user-stock-01"
            - call: "POST /customs-audits/${au_clean}/submit"
              payload: { counted_qty: 98 }
              as: StockController
              as_user_id: "user-stock-01"
            - call: "POST /customs-audits/${au_clean}/close"
              payload: {}
              as: CustomsAuditor
              as_user_id: "user-audit-01"
            - call: "POST /customs-audits/${au_assessed}/submit"
              payload: { counted_qty: 97 }
              as: StockController
              as_user_id: "user-stock-01"
            - call: "POST /customs-audits/${au_assessed}/close"
              payload: {}
              as: CustomsAuditor
              as_user_id: "user-audit-01"
          assert:
            - "the submit with counted_qty 101 returns HTTP 422 with error_id ERR_COUNTED_QTY_EXCEEDS_EXPECTED"
            - "the submit with counted_qty 98 returns HTTP 200 and CustomsAudit.${au_clean}.expected_qty_snapshot == 100"
            - "CustomsAudit.${au_clean}.round_count == 1 - a rejected submit does not advance the loop counter"
            - "the first close returns HTTP 200 and CustomsAudit.${au_clean}.status == CLOSED_CLEAN"
            - "CustomsAudit.${au_clean}.shrinkage_qty == 2 and CustomsAudit.${au_clean}.assessable_qty == 0"
            - "CustomsAudit.${au_clean}.assessed_duty_cents == 0"
            - "CustomsAudit.${au_clean}.auditor_user_id == user-audit-01"
            - "Terminal.${t_hkg}.unaccounted_duty_liability_cents == 0 after the clean close"
            - "BondedStockItem.${si_watch}.on_hand_qty == 100 after the clean close - no write-off movement was appended"
            - "BondedStockItem.${si_watch}.last_reconciled_at == 2026-09-01T00:00:00Z after the clean close"
            - "the second close returns HTTP 200 and CustomsAudit.${au_assessed}.status == CLOSED_ASSESSED"
            - "CustomsAudit.${au_assessed}.shrinkage_qty == 3 and CustomsAudit.${au_assessed}.assessable_qty == 1"
            - "CustomsAudit.${au_assessed}.assessed_duty_cents == 1400"
            - "Terminal.${t_hkg}.unaccounted_duty_liability_cents == 1400"
            - "BondedStockItem.${si_watch}.on_hand_qty == 97 - the write-off is -shrinkage_qty, not -assessable_qty"
            - "BondedStockItem.${si_watch}.duty_suspended_value_cents == 135800"

  # =====================================================================
  # SECTION 4 - From Table 4 (Validations)
  # =====================================================================
  - section: validations
    instances:
      - claim_type: priority_ordering_auth_ladder
        name: auth_ladder_rejects_unauthenticated_then_forbidden_role_then_non_owner
        grounds:
          - validations[priority=10]
          - validations[priority=20]
          - validations[priority=25]
          - roles.Passenger
        distinguishing_aspect: |
          The first three rungs of the ladder MUST fire in priority order regardless of what else is
          wrong with the request: missing headers give 401 ERR_UNAUTHENTICATED even on an unknown id, a
          wrong role gives 403 ERR_FORBIDDEN_ROLE even with an invalid body, and a Passenger whose
          X-User-ID is not the target itinerary gives 403 ERR_NOT_ITINERARY_OWNER even when the body's
          stock_item_id does not exist (priority 25 outranks the existence check at 35).
        test_recipe:
          setup:
            - "Terminal SIN in SG and one itinerary owned by a different passenger"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0117", nationality_code: "CN", boarding_pass_barcode: "BP-0117", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-25T10:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_117: $.data.id, it_117_v: $.data.version }
          trigger:
            - call: "GET /terminals/00000000-0000-4000-8000-000000000009"
              as: TerminalAdmin
            - call: "POST /terminals"
              payload: { iata_code: "XX" }
              as: SalesAssociate
            - call: "POST /pre-orders"
              payload: { itinerary_id: "${it_117}", stock_item_id: "00000000-0000-4000-8000-00000000000a", qty: 1, program: "PICKUP_ON_DEPARTURE", reservation_window_start: "2026-08-10T00:00:00Z", reservation_window_end: "2026-08-12T00:00:00Z", expected_stock_item_version: "${it_117_v}" }
              as: Passenger
              as_user_id: "not-the-owner"
          assert:
            - "the GET sent WITHOUT the X-User-Role and X-User-ID headers returns HTTP 401 with error_id ERR_UNAUTHENTICATED, not 404 - priority 10 outranks the existence check"
            - "the same GET sent with an X-User-Role that is not one of the five declared roles also returns HTTP 401 ERR_UNAUTHENTICATED"
            - "the POST /terminals sent as SalesAssociate returns HTTP 403 with error_id ERR_FORBIDDEN_ROLE, not 422 - priority 20 outranks the schema check at 45"
            - "the POST /pre-orders sent as Passenger with X-User-ID not-the-owner returns HTTP 403 with error_id ERR_NOT_ITINERARY_OWNER, not 404 ERR_STOCK_ITEM_NOT_FOUND"
            - "no Terminal and no PreOrder is created by any of the three calls"

      - claim_type: cross_entity_validation
        name: domestic_itinerary_and_barcode_mismatch_are_rejected_at_scan
        grounds:
          - validations[priority=78]
          - errors.ERR_ITINERARY_NOT_INTERNATIONAL
          - errors.ERR_BOARDING_PASS_MISMATCH
          - endpoints["POST /itineraries"]
        distinguishing_aspect: |
          is_international is DERIVED at creation as (destination_country != departure terminal's
          country_code), so an SG-to-SG itinerary at a Singapore terminal MUST be created successfully
          with is_international false and then be refused at scan with 422
          ERR_ITINERARY_NOT_INTERNATIONAL. A barcode that does not match the stored one MUST give 422
          ERR_BOARDING_PASS_MISMATCH and MUST NOT move scan_status or touch the terminal's mix.
        test_recipe:
          setup:
            - "Terminal SIN in SG"
            - "One domestic SG-to-SG itinerary and one international SG-to-AU itinerary"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0118", nationality_code: "SG", boarding_pass_barcode: "BP-0118", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-25T10:00:00Z", destination_country: "SG", final_destination_country: "SG" }
              as: SalesAssociate
              captures: { it_dom: $.data.id }
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0119", nationality_code: "CN", boarding_pass_barcode: "BP-0119", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-25T11:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_intl: $.data.id }
          trigger:
            - call: "POST /itineraries/${it_dom}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0118" }
              as: SalesAssociate
            - call: "POST /itineraries/${it_intl}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0118" }
              as: SalesAssociate
            - call: "POST /itineraries/${it_intl}/scan-boarding-pass"
