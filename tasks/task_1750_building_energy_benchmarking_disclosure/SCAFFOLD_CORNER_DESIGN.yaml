        test_recipe:
          setup:
            - "owner, verifier, OPEN cycle c27 (tolerance 5)"
            - "building 40000 sqft OFFICE (units 20000+10000 both consented, common 10000 -> completeness 100.00), one NATURAL_GAS record of 40000 therms -> 4000000 kBtu -> site_eui 100.00; report VERIFIED (verified_site_eui 100.00)"
