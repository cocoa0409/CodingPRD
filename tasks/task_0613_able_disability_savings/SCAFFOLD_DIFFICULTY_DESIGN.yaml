            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /able/accounts/${acct_id}/reinstate"
              payload: {}
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
