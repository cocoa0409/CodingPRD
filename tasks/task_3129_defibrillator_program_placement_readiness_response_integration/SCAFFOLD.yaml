    side_effects: ["status → ACCEPTED", "EmergencyEvent.status → CLOSED"]

  - method: POST
    path: "/api/case-reviews/{reviewId}/reopen"
    description: "Reopen submitted review"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: CaseReview
    side_effects: ["status → DRAFT"]

  # --- ReplenishmentOrder ---
  - method: GET
    path: "/api/replenishment-orders/{orderId}"
    description: "Get ReplenishmentOrder"
    roles: [PlatformAdmin, ProgramManager]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: []

  - method: GET
    path: "/api/replenishment-orders"
    description: "List replenishment orders (filterable)"
    roles: [PlatformAdmin, ProgramManager]
    code: 200
    input: ["campus_id?", "emergency_event_id?", "received_lot_id?", "status?", "limit?", "offset?"]
    output: ReplenishmentOrder[]
    side_effects: []

  - method: POST
    path: "/api/replenishment-orders/{orderId}/receive"
    description: "Receive replenishment — creates ConsumableLot"
    roles: [ProgramManager]
    code: 200
    input: [lot_code, manufacturer_expires_at]
    output: ReplenishmentOrder
    side_effects: ["status → RECEIVED", "New ConsumableLot created with quantity=order.quantity"]

  - method: POST
    path: "/api/replenishment-orders/{orderId}/cancel"
    description: "Cancel order"
    roles: [ProgramManager]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: ["status → CANCELLED"]

  # --- Coverage / Response time ---
  - method: GET
    path: "/api/campuses/{campusId}/coverage-report"
    description: "Compute per-zone coverage with both response-time variants"
    roles: [PlatformAdmin, ProgramManager, MedicalDirector]
    code: 200
    input: []
    output: { coverage_pct: integer, per_zone: array }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not authorized for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource id not found in path scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload or missing required field" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version mismatch on OCC-guarded write" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource in wrong state for operation" }
  - { id: ERR_MEDICAL_DIRECTION_CONFLICT, http: 422, condition: "CaseReview reviewer is Campus medical director, or acceptor equals reviewer" }
  - { id: ERR_PRESCRIPTION_REQUIRED, http: 422, condition: "DeviceModel requires prescription and none active for device" }
  - { id: ERR_RESPONDER_NOT_CERTIFIED, http: 422, condition: "Responder certification expired or status not ACTIVE" }
  - { id: ERR_TEMPORAL_WINDOW_VIOLATION, http: 422, condition: "Action outside allowed time window" }
  - { id: ERR_INCOMPATIBLE_REFERENCE, http: 422, condition: "FK target incompatible (wrong model, wrong role, wrong campus)" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Cabinet occupied or training session full" }
  - { id: ERR_LOT_UNAVAILABLE, http: 409, condition: "Lot empty or expired" }
  - { id: ERR_REPLENISHMENT_INVALID, http: 422, condition: "Replenishment receive payload invalid or order not PENDING" }
  - { id: ERR_CABINET_NOT_EMPTY, http: 409, condition: "Cabinet already occupied at install" }
  - { id: ERR_DEVICE_NOT_READY, http: 409, condition: "Commission or return_to_service attempted while readiness_posture != READY" }
  - { id: ERR_DEVICE_IN_EVENT, http: 409, condition: "Device has open EmergencyEvent; operation blocked" }
  - { id: ERR_EVENT_ALREADY_ACKED, http: 409, condition: "EmergencyEvent already acknowledged by another responder" }
  - { id: ERR_EVENT_NOT_RESPONDING, http: 409, condition: "Resolve attempted while event not in RESPONDING" }
  - { id: ERR_INSPECTION_OVERDUE, http: 409, condition: "Submit attempted after scheduled_for + 7 days" }
  - { id: ERR_INSPECTION_CHECKLIST_INCOMPLETE, http: 422, condition: "checklist_items missing required entries" }
  - { id: ERR_SESSION_ALREADY_STARTED, http: 409, condition: "Cancel/enroll attempted after starts_at" }
  - { id: ERR_SESSION_NOT_ENDED, http: 409, condition: "Complete attempted before ends_at" }
  - { id: ERR_TRAINING_FULL, http: 409, condition: "Enroll would exceed session capacity" }
  - { id: ERR_INSTRUCTOR_ROLE_INVALID, http: 422, condition: "instructor_id is not MEDICAL_DIRECTOR or PROGRAM_MANAGER" }
  - { id: ERR_CASE_REVIEW_INCOMPLETE, http: 422, condition: "Submit without outcome_code/hospital_reviewer/device_data_retrieved" }
  - { id: ERR_PADS_NOT_CONSUMED, http: 409, condition: "close_no_patient attempted when pads_consumed=true" }
  - { id: ERR_SERIAL_NUMBER_CONFLICT, http: 409, condition: "serial_number already registered on campus" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator with full read and catalog-write access"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /device-models"
      - "POST /campuses"
    shared_operations:
      - "All GET endpoints"

  - name: ProgramManager
    description: "Campus program manager; owns devices, lots, cabinets, training"
    identity: opaque
    exclusive_operations:
      - "POST /campuses/{id}/zones"
      - "POST /campuses/{id}/zones/{id}/cabinets"
      - "POST /campuses/{id}/devices"
      - "POST /campuses/{id}/devices/{id}/install"
      - "POST /campuses/{id}/devices/{id}/commission"
      - "POST /campuses/{id}/devices/{id}/send_to_maintenance"
      - "POST /campuses/{id}/devices/{id}/decommission"
      - "POST /campuses/{id}/consumable-lots"
      - "POST /campuses/{id}/devices/{id}/installs"
      - "POST /campuses/{id}/installs/{id}/remove"
      - "POST /campuses/{id}/responders"
      - "POST /campuses/{id}/training-sessions*"
      - "POST /campuses/{id}/replenishment-orders/{id}/receive"
      - "POST /campuses/{id}/replenishment-orders/{id}/cancel"
    shared_operations:
      - "GET endpoints within campus"

  - name: Inspector
    description: "Readiness inspector; performs and records inspections"
    identity: "entity_backed:Responder"
    exclusive_operations:
      - "POST /campuses/{id}/devices/{id}/inspections"
      - "POST /campuses/{id}/inspections/{id}/submit"
      - "POST /campuses/{id}/devices/{id}/return_to_service"
    shared_operations:
      - "GET endpoints within campus"

  - name: MedicalDirector
    description: "Physician medical director; performs case reviews"
    identity: "entity_backed:Responder"
    exclusive_operations:
      - "POST /campuses/{id}/emergency-events/{id}/case-reviews"
      - "POST /campuses/{id}/case-reviews/{id}/submit"
      - "POST /campuses/{id}/case-reviews/{id}/accept"
      - "POST /campuses/{id}/case-reviews/{id}/reopen"
    shared_operations:
      - "GET endpoints within campus"

  - name: Responder
    description: "Certified on-site responder; acknowledges and resolves events"
    identity: "entity_backed:Responder"
    exclusive_operations:
      - "POST /campuses/{id}/emergency-events/{id}/acknowledge"
      - "POST /campuses/{id}/emergency-events/{id}/resolve"
      - "POST /campuses/{id}/emergency-events/{id}/close_no_patient"
    shared_operations:
      - "GET emergency events"

  - name: System
    description: "Automated device integration (self-test webhook)"
    identity: opaque
    exclusive_operations:
      - "POST /campuses/{id}/devices/{id}/self-test-reports"
    shared_operations: []

  - name: Anonymous
    description: "Unauthenticated cabinet sensor (cabinet open event)"
    identity: opaque
    exclusive_operations:
      - "POST /campuses/{id}/cabinets/{id}/open"
    shared_operations: []
