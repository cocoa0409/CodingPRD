  - section: rbac
    instances:
      - name: buyer_treasury_cannot_open_a_program
        claim_type: unauthorized_denial
        grounds:
          - roles.BuyerTreasury
          - roles.BuyerAdmin.exclusive_operations
          - endpoints[POST /buyer-programs/{id}/open]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          Programme configuration is BuyerAdmin-exclusive: the treasury officer of the very same
          buyer must be refused with 403 ERR_UNAUTHORIZED even though the programme is in DRAFT and
          the transition would otherwise be legal, and the programme must stay DRAFT at version 1.
        test_recipe:
          setup:
            - "One Buyer with one DRAFT programme"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Role Split Buyer", tax_id: "339990001", credit_limit_cents: 100000000, self_funding_enabled: true }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Role Split Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200, min_days_early: 5, concentration_cap_pct: 100.00, funding_policy: "SELF_ONLY" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id", v_create: "$.data.version" }
          trigger:
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerTreasury
              as_user_id: "${buyer_id}"
              captures: { err_open: "$.data.error_id" }
          assert:
            - "err_open == ERR_UNAUTHORIZED with HTTP 403"
            - "BuyerProgram.${program_id}.status is still DRAFT and version is still ${v_create} == 1"
            - "the same call as BuyerAdmin with the same X-User-ID would succeed - the refusal is about the role, not the buyer"

      - name: offer_acceptance_role_depends_on_the_offers_current_status
        claim_type: unauthorized_denial
        grounds:
          - validations[priority=2]
          - roles.BuyerAdmin.exclusive_operations
          - roles.Supplier.exclusive_operations
          - endpoints[POST /discount-offers/{id}/accept]
          - state_machines.DiscountOffer
        distinguishing_aspect: |
          The one endpoint POST /discount-offers/{id}/accept has a status-dependent permitted role:
          a NAMED offer may be accepted only by the BuyerAdmin and a COUNTERED offer only by the
          Supplier. Both wrong-side attempts must return 403 ERR_UNAUTHORIZED - not
          ERR_INVALID_STATE, because the offer is in a state that admits acceptance, just not by that
          caller - and the right-side call on the same COUNTERED offer must then succeed at the
          countered rate.
        test_recipe:
          setup:
            - "Buyer with an OPEN SUPPLIER_NAMED programme (bounds 200..1200, cap 100.00) and one fully onboarded Supplier"
            - "A LIVE session and two invoices: RBA-A of 50000 and RBA-B of 60000, both due 2026-09-30"
            - "Both invoices carry offers named at 900 bps; the offer on RBA-B has been countered by the buyer at 700 bps and is therefore COUNTERED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Accept Role Buyer", tax_id: "340001112", credit_limit_cents: 100000000, self_funding_enabled: true }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Accept Role Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200, min_days_early: 5, concentration_cap_pct: 100.00, funding_policy: "SELF_ONLY" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /suppliers"
              payload: { legal_name: "Accept Role Supply", tax_id_last4: "1919", remittance_email: "ar@acceptrole.example" }
              as: PlatformOps
              captures: { supplier_id: "$.data.id" }
            - call: "POST /suppliers/${supplier_id}/onboarding/submit"
              payload: {}
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/bank-accounts"
              payload: { routing_number: "021000021", account_last4: "4321" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { bank_id: "$.data.id", md_code: "$.data.micro_deposit_code" }
            - call: "POST /bank-accounts/${bank_id}/micro-deposit/confirm"
              payload: { code: "${md_code}" }
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/idv/adjudicate"
              payload: { decision: "PASSED", identity_score: 90 }
              as: PlatformOps
            - call: "POST /auction-sessions"
              payload: { program_id: "${program_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-31T00:00:00Z" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { session_id: "$.data.id" }
            - call: "POST /payable-files"
              payload: { program_id: "${program_id}", filename: "AP-ACCEPTROLE.csv", declared_row_count: 2, declared_total_cents: 110000, rows: [ { invoice_number: "RBA-A", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 50000, tax_rate_bps: 0 } ] }, { invoice_number: "RBA-B", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 60000, tax_rate_bps: 0 } ] } ] }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { file_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
