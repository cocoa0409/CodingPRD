      - name: corner_rbac_shared_reads_are_visible_to_every_listed_role
        claim_type: behavior_defined
        grounds:
          - roles.RegulatorOps.shared_operations
          - roles.PooledPlanProvider.shared_operations
          - roles.AdoptingEmployer.shared_operations
          - roles.ServiceProvider.shared_operations
          - roles.IndependentAuditor.shared_operations
          - endpoints[GET /pep/plan-documents/{id}]
          - endpoints[GET /pep/payroll-batches/{id}]
        distinguishing_aspect: "Reads are deliberately wider than writes: the plan document is legible to all five roles, while the payroll batch is legible to the four roles with a stake in contributions and not to the auditor's read set. The interesting part is that widening the reader set does not change the body — the same batch read by the employer that filed it, by the recordkeeper that validated it, by the pooled plan provider and by the regulator is byte-identical apart from the per-request envelope metadata."
