              as: StudioManager
              captures: { prof_id: $.data.id }
            - call: "POST /studio/rush-tier-rules"
              payload: { tier: "RUSH", multiplier_bp: 20000, sla_hours: 72, surcharge_breach_cents: 15000, included_revision_rounds: 1, per_round_cents: 30000 }
              as: StudioManager
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/clients/${cli_id}/credit-adjustments"
              payload: { amount_cents: 10000000, reason: "seed" }
              as: StudioManager
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P", upc: "012345678901", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60, rush_tier: "RUSH" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /studio/clients/${cli_id}/activate"
              payload: {}
              as: StudioManager
            - call: "GET /studio/clients/${cli_id}"
              as: StudioManager
              captures: { cli_ver: $.data.version }
            - call: "POST /studio/projects/${proj_id}/book"
              payload: { expected_client_version: "${cli_ver}" }
              as: Client
              as_user_id: "${cli_id}"
            - call: "POST /studio/projects/${proj_id}/begin-intake"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/source-assets"
              payload: { filename: "a.wav", sha256: "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc", sample_rate_hz: 44100, bit_depth: 24, duration_seconds: 60.0, channels: 2 }
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /studio/source-assets/${sa_id}/qc-pass"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/qc/complete"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/start-mastering"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { r1_id: $.data.current_revision_round_id, pv1: $.data.version }
            - call: "POST /studio/projects/${proj_id}/rounds/${r1_id}/submit"
              payload: { expected_project_version: "${pv1}" }
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/rounds/${r1_id}/reject"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
              captures: { r2_id: $.data.id, pv2: $.data.version }
            - call: "POST /studio/projects/${proj_id}/rounds/${r2_id}/submit"
              payload: { expected_project_version: "${pv2}" }
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/rounds/${r2_id}/reject"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
              captures: { r3_id: $.data.id, pv3: $.data.version }
            - call: "POST /studio/projects/${proj_id}/rounds/${r3_id}/submit"
              payload: { expected_project_version: "${pv3}" }
              as: Engineer
              as_user_id: "${eng_id}"
          trigger:
            - call: "POST /studio/projects/${proj_id}/rounds/${r3_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
          assert:
            # base=1*120000*2.0 = 240000; extra_rounds = 3-1 = 2 → 60000; breach = 0 → total = 300000
            - "Project.${proj_id}.final_price_cents == 300000"
            - "Project.${proj_id}.revision_round_count == 3"

      - name: recall_fee_mode_b_nested_rounding_order
        grounds:
          - calculations.compute_recall_fee
        distinguishing_aspect: |
          Mode (b): compute_recall_fee pins rounding order — bytes FIRST ceil to GB,
          THEN multiplied by tier rate, THEN min-fee applied LAST. For a 1.5 GB bundle
          at COLD tier (2000 cents/GB): ceil(1.5)=2 → 2*2000=4000 cents. A different
          rounding order (e.g., 1.5 * 2000 = 3000 then round) yields a different
          number. The scaffold explicitly pins ceil-before-multiply.
        test_recipe:
