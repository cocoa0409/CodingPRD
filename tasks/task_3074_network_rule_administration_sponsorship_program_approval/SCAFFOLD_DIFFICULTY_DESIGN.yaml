scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: fine_regional_override_vs_global_base
        grounds:
          - calculations.fine_tier_selection
          - entities.NetworkRule.fields.regional_override_of_rule_id
          - entities.RuleViolation.fields.fine_cents
        distinguishing_aspect: |
          Same subject region, same rule_code, same severity and transaction amount: assessing the violation
          against the GLOBAL base rule yields 50000 cents (tier 3 x1), while assessing an identical violation
          under the EU regional override (whose schedule differs) yields 20000 cents — the variant selects a
          different fine_schedule source and produces a different fine for identical violation inputs.
        test_recipe:
          setup:
            - "Member M in region EU, ACTIVE"
            - "GLOBAL rule R-AML-1 PUBLISHED, effective_from 2026-09-01T00:00:00Z, schedule [{1..9999:1000},{10000..99999:10000},{100000..null:50000}]"
            - "EU regional override of R-AML-1 PUBLISHED, effective_from 2026-09-01T00:00:00Z, schedule [{1..99999:5000},{100000..null:20000}]"
            - "Two violations V1 (cited against the GLOBAL rule) and V2 (cited against the EU override rule) on member M, severity MINOR, transaction_amount_minor 150000"
            - "Assessor (ra-2) differs from citer (ra-1) for both violations"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "EU Bank", member_kind: "BOTH", region: "EU" }
              as: NetworkOperator
              captures: { m_eu: $.data.id }
            - call: "POST /network/members/${m_eu}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/rules"
              payload:
                rule_code: "R-AML-1"
                title: "AML reporting"
                body: "base"
                region_scope: "GLOBAL"
                effective_from: "2026-09-01T00:00:00Z"
                fine_schedule:
                  - { min_amount_minor: 1, max_amount_minor: 9999, fine_cents: 1000 }
                  - { min_amount_minor: 10000, max_amount_minor: 99999, fine_cents: 10000 }
                  - { min_amount_minor: 100000, max_amount_minor: ~, fine_cents: 50000 }
              as: RulesAdministrator
              captures: { r_global: $.data.id }
            - call: "POST /network/rules/${r_global}/publish"
              payload: {}
              as: RulesAdministrator
            - call: "POST /network/rules"
              payload:
                rule_code: "R-AML-1-EU"
                title: "AML reporting EU"
                body: "eu variation"
                region_scope: "EU"
                regional_override_of_rule_id: "${r_global}"
                effective_from: "2026-09-01T00:00:00Z"
                fine_schedule:
                  - { min_amount_minor: 1, max_amount_minor: 99999, fine_cents: 5000 }
                  - { min_amount_minor: 100000, max_amount_minor: ~, fine_cents: 20000 }
              as: RulesAdministrator
              captures: { r_eu: $.data.id }
            - call: "POST /network/rules/${r_eu}/publish"
              payload: {}
              as: RulesAdministrator
            - call: "POST /network/rule-violations"
              payload: { rule_id: "${r_global}", subject_member_id: "${m_eu}", severity: "MINOR", transaction_amount_minor: 150000 }
              as: RulesAdministrator
              as_user_id: "ra-1"
              captures: { v1: $.data.id }
            - call: "POST /network/rule-violations"
              payload: { rule_id: "${r_eu}", subject_member_id: "${m_eu}", severity: "MINOR", transaction_amount_minor: 150000 }
              as: RulesAdministrator
              as_user_id: "ra-1"
              captures: { v2: $.data.id }
          trigger:
            - call: "POST /network/rule-violations/${v1}/assess"
              payload: {}
              as: RulesAdministrator
              as_user_id: "ra-2"
            - call: "POST /network/rule-violations/${v2}/assess"
              payload: {}
              as: RulesAdministrator
              as_user_id: "ra-2"
          assert:
            - "RuleViolation.${v1}.fine_cents == 50000"
            - "RuleViolation.${v2}.fine_cents == 20000"
            - "RuleViolation.${v1}.status == ASSESSED"
            - "RuleViolation.${v2}.status == ASSESSED"

      - name: dispute_liability_initial_vs_arbitration
        grounds:
          - calculations.dispute_liability
          - state_machines.DisputeCase.DECIDED_to_ARBITRATION_REQUESTED
          - state_machines.DisputeCase.ARBITRATION_REQUESTED_to_ARBITRATION_DECIDED
        distinguishing_aspect: |
          Two disputes with identical 200000-cent transactions, both initially decided for the ISSUER: the one
          closed without arbitration leaves the acquirer liable 201500 cents, while the one escalated through
          arbitration (outcome again ISSUER) leaves the acquirer liable 226500 cents — the arbitration variant
          adds ARBITRATION_FEE_CENTS=25000 to the losing side on top of the identical base outcome.
        test_recipe:
          setup:
            - "Issuer member I (ACTIVE), acquirer member A (ACTIVE), merchant Mc boarded directly under A"
            - "Dispute D1: amount 200000, decided ISSUER, then closed without arbitration"
            - "Dispute D2: amount 200000, decided ISSUER, arbitration requested by acquirer A, arbitrated ISSUER"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "Issuer Bank", member_kind: "ISSUER", region: "NA" }
              as: NetworkOperator
              captures: { m_i: $.data.id }
            - call: "POST /network/members/${m_i}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/members"
              payload: { legal_name: "Acquirer Bank", member_kind: "ACQUIRER", region: "NA" }
              as: NetworkOperator
              captures: { m_a: $.data.id }
            - call: "POST /network/members/${m_a}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/merchants"
              payload: { acquirer_member_id: "${m_a}", mcc: "5411", region: "NA", declared_monthly_volume_cents: 100000000 }
              as: SponsorshipManager
              captures: { mc: $.data.id }
            - call: "POST /network/disputes"
              payload: { reason_code: "10.4", issuer_member_id: "${m_i}", acquirer_member_id: "${m_a}", merchant_id: "${mc}", transaction_amount_cents: 200000, currency: "USD" }
              as: Member
              as_user_id: "${m_i}"
              captures: { d1: $.data.id }
            - call: "POST /network/disputes"
              payload: { reason_code: "10.4", issuer_member_id: "${m_i}", acquirer_member_id: "${m_a}", merchant_id: "${mc}", transaction_amount_cents: 200000, currency: "USD" }
              as: Member
              as_user_id: "${m_i}"
              captures: { d2: $.data.id }
            - call: "POST /network/disputes/${d1}/decide"
              payload: { winning_side: "ISSUER" }
              as: DisputeAnalyst
            - call: "POST /network/disputes/${d1}/close"
              payload: {}
              as: DisputeAnalyst
            - call: "POST /network/disputes/${d2}/decide"
              payload: { winning_side: "ISSUER" }
              as: DisputeAnalyst
            - call: "POST /network/disputes/${d2}/request-arbitration"
              payload: {}
              as: Member
              as_user_id: "${m_a}"
            - call: "POST /network/disputes/${d2}/arbitrate"
              payload: { winning_side: "ISSUER" }
              as: DisputeAnalyst
          assert:
            - "dispute_liability(D1).acquirer_liability_cents == 201500"
            - "dispute_liability(D2).acquirer_liability_cents == 226500"
            - "DisputeCase.${d1}.status == CLOSED"
            - "DisputeCase.${d2}.status == ARBITRATION_DECIDED"

  - rule_id: combinatorial_formula
    instances:
      - name: interchange_quote_qualification_scope_fallback
        grounds:
          - calculations.interchange_fee
          - entities.InterchangeRate.fields.data_quality_tier
          - entities.InterchangeRate.fields.region_scope
        distinguishing_aspect: |
          Mode (a) combinatorial formula with >=3 inputs and non-linear interaction: the quote jointly
          branches on data-quality qualification (token x avs_match), region-scope preference (EU beats
          GLOBAL), effective_from recency, and downward tier fallback — a premium-qualified EU transaction
          selects the EU ENHANCED row by fallback (7000+120=7120 cents), a tokenless EU transaction selects
          the EU STANDARD row (5000+100=5100), and a premium-qualified NA transaction falls back to the
          GLOBAL STANDARD row (4000+50=4050), all on the same 100000-cent amount.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z"
            - "Published effective rates for mcc 5411 CARD_NOT_PRESENT: GLOBAL/STANDARD 400bp+50c (eff 2026-09-01), EU/STANDARD 500bp+100c (eff 2026-09-02), EU/ENHANCED 700bp+120c (eff 2026-09-03); no PREMIUM rows anywhere"
          setup_api_calls:
            - call: "POST /network/interchange-rates"
              payload: { merchant_category: "5411", transaction_type: "CARD_NOT_PRESENT", data_quality_tier: "STANDARD", rate_basis_points: 400, fixed_fee_cents: 50, region_scope: "GLOBAL", effective_from: "2026-09-01T00:00:00Z" }
              as: PricingAnalyst
              captures: { r_gs: $.data.id }
            - call: "POST /network/interchange-rates/${r_gs}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /network/interchange-rates"
              payload: { merchant_category: "5411", transaction_type: "CARD_NOT_PRESENT", data_quality_tier: "STANDARD", rate_basis_points: 500, fixed_fee_cents: 100, region_scope: "EU", effective_from: "2026-09-02T00:00:00Z" }
              as: PricingAnalyst
              captures: { r_es: $.data.id }
            - call: "POST /network/interchange-rates/${r_es}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /network/interchange-rates"
              payload: { merchant_category: "5411", transaction_type: "CARD_NOT_PRESENT", data_quality_tier: "ENHANCED", rate_basis_points: 700, fixed_fee_cents: 120, region_scope: "EU", effective_from: "2026-09-03T00:00:00Z" }
              as: PricingAnalyst
              captures: { r_ee: $.data.id }
            - call: "POST /network/interchange-rates/${r_ee}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: NetworkOperator
          trigger:
            - call: "POST /network/interchange-rates/quote"
              payload: { mcc: "5411", transaction_type: "CARD_NOT_PRESENT", region: "EU", amount_cents: 100000, token: "tok_1", avs_match: true }
              as: PricingAnalyst
              captures: { q1_fee: $.data.fee_cents, q1_tier: $.data.qualified_tier, q1_rate: $.data.applied_rate_id }
            - call: "POST /network/interchange-rates/quote"
              payload: { mcc: "5411", transaction_type: "CARD_NOT_PRESENT", region: "EU", amount_cents: 100000 }
              as: PricingAnalyst
              captures: { q2_fee: $.data.fee_cents, q2_tier: $.data.qualified_tier }
            - call: "POST /network/interchange-rates/quote"
              payload: { mcc: "5411", transaction_type: "CARD_NOT_PRESENT", region: "NA", amount_cents: 100000, token: "tok_1", avs_match: true }
              as: PricingAnalyst
              captures: { q3_fee: $.data.fee_cents, q3_tier: $.data.qualified_tier }
          assert:
            - "quote1.fee_cents == 7120 and qualified_tier == PREMIUM and applied_rate_id == ${r_ee} (EU ENHANCED via downward fallback beats GLOBAL)"
            - "quote2.fee_cents == 5100 and qualified_tier == STANDARD"
            - "quote3.fee_cents == 4050 and qualified_tier == PREMIUM (fallback to GLOBAL STANDARD in NA)"

      - name: dispute_window_inclusive_vs_exclusive_boundary
        grounds:
          - calculations.dispute_filing_windows
          - validations[priority=8]
        distinguishing_aspect: |
          Mode (a) boundary-branching formula over three inputs (phase, filing_clock, logical now) with a
          non-linear interaction: the evidence window is INCLUSIVE (submission exactly at filing_clock+30d
          is admitted) while the arbitration window is EXCLUSIVE (a request exactly at filing_clock+45d is
          rejected) — identical 'at the exact deadline' inputs produce opposite outcomes on the two windows
          of the same dispute lifecycle.
        test_recipe:
          setup:
            - "Issuer I and acquirer A ACTIVE; merchant Mc under A"
            - "Dispute D opened at logical 2026-09-01T00:00:00Z"
            - "Logical clock advanced to exactly 2026-10-01T00:00:00Z (filing_clock + 30 days)"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "I Bank", member_kind: "ISSUER", region: "NA" }
              as: NetworkOperator
              captures: { m_i: $.data.id }
            - call: "POST /network/members/${m_i}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/members"
              payload: { legal_name: "A Bank", member_kind: "ACQUIRER", region: "NA" }
              as: NetworkOperator
              captures: { m_a: $.data.id }
            - call: "POST /network/members/${m_a}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/merchants"
              payload: { acquirer_member_id: "${m_a}", mcc: "5411", region: "NA", declared_monthly_volume_cents: 100000000 }
              as: SponsorshipManager
              captures: { mc: $.data.id }
            - call: "POST /network/disputes"
              payload: { reason_code: "13.1", issuer_member_id: "${m_i}", acquirer_member_id: "${m_a}", merchant_id: "${mc}", transaction_amount_cents: 50000, currency: "USD" }
              as: Member
              as_user_id: "${m_i}"
              captures: { d1: $.data.id }
            - call: "POST /network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: NetworkOperator
          trigger:
            - call: "POST /network/disputes/${d1}/evidence"
              payload: { evidence_type: "PROOF_OF_DELIVERY", document_ref: "doc-1" }
              as: Member
              as_user_id: "${m_a}"
            - call: "POST /network/disputes/${d1}/decide"
              payload: { winning_side: "ACQUIRER" }
              as: DisputeAnalyst
            - call: "POST /network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/disputes/${d1}/request-arbitration"
              payload: {}
              as: Member
              as_user_id: "${m_i}"
              captures: { arb_err: $.data.error_id }
          assert:
            - "Evidence submitted exactly at filing_clock+30d is ADMITTED (inclusive boundary): DisputeCase.${d1}.status == DECIDED was reachable only after evidence moved it to EVIDENCE_SUBMITTED"
            - "Arbitration requested exactly at decision_filing_clock+45d is REJECTED (exclusive boundary): arb_err == ERR_WINDOW_EXPIRED"
            - "DisputeCase.${d1}.status == DECIDED"

  - rule_id: non_linear_state_machine
    instances:
      - name: member_suspend_reinstate_cycle
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Member.SUSPENDED_to_ACTIVE
          - state_machines.Participant.ACTIVE_to_SUSPENDED
          - state_machines.BinRange.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Cyclic state machine on Member (ACTIVE -> SUSPENDED -> ACTIVE) where the loop drives a matching
          cycle on sponsored Participants and owned BinRanges: after suspend both are SUSPENDED, and after
          reinstate all three return to ACTIVE — a revert loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Issuer/sponsor member M ACTIVE; participant P under M approved ACTIVE; BIN range B of M REQUESTED then force-approved via a production-enabled program G"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "Both Bank", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m_b: $.data.id }
            - call: "POST /network/members/${m_b}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "Part Co", sponsor_member_id: "${m_b}", program_name: "PartProg" }
              as: SponsorshipManager
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/approve"
              payload: {}
              as: SponsorshipManager
            - call: "POST /network/programs"
              payload: { name: "CoreCard", program_type: "CARD_PRODUCT", product_code: "CC1", owner_member_id: "${m_b}" }
              as: CertificationEngineer
              captures: { g1: $.data.id, g1_v: $.data.version }
            - call: "POST /network/programs/${g1}/certification-tests"
              payload: { scope: "NEW_PRODUCT" }
              as: CertificationEngineer
              captures: { ct1: $.data.id }
            - call: "POST /network/certification-tests/${ct1}/pass"
              payload: {}
              as: CertificationEngineer
            - call: "POST /network/programs/${g1}/approve"
              payload: { expected_program_version: "${g1_v}" }
              as: CertificationEngineer
            - call: "POST /network/programs/${g1}/enable-production"
              payload: {}
              as: CertificationEngineer
            - call: "POST /network/bin-ranges"
              payload: { bin_prefix: "411111", issuer_member_id: "${m_b}" }
              as: NetworkOperator
              captures: { b1: $.data.id }
            - call: "POST /network/bin-ranges/${b1}/approve"
              payload: { program_id: "${g1}" }
              as: NetworkOperator
          trigger:
            - call: "POST /network/members/${m_b}/suspend"
              payload: { reason: "AUDIT" }
              as: NetworkOperator
            - call: "POST /network/members/${m_b}/reinstate"
              payload: {}
              as: NetworkOperator
          assert:
            - "Member.${m_b}.status == ACTIVE"
            - "Participant.${p1}.status == ACTIVE (cycled SUSPENDED in between)"
            - "BinRange.${b1}.status == ACTIVE (cycled SUSPENDED in between)"
            - "Member.${m_b}.suspension_reason == null"

      - name: dispute_evidence_arbitration_loop
        grounds:
          - state_machines.DisputeCase.OPENED_to_EVIDENCE_SUBMITTED
          - state_machines.DisputeCase.DECIDED_to_ARBITRATION_REQUESTED
          - state_machines.DisputeCase.ARBITRATION_REQUESTED_to_ARBITRATION_DECIDED
          - state_machines.DisputeCase.ARBITRATION_DECIDED_to_CLOSED
        distinguishing_aspect: |
          Branching fork-join on DisputeCase: from DECIDED the workflow forks into {CLOSED directly,
          ARBITRATION_REQUESTED -> ARBITRATION_DECIDED -> CLOSED} with divergent side effects (arbitration
          overwrites winning_side and adds the arbitration fee), and the arbitration outcome REVERSES the
          initial decision — winning_side flips from ISSUER to ACQUIRER on the same case.
        test_recipe:
          setup:
            - "Issuer I and acquirer A ACTIVE; merchant Mc under A; dispute D opened by I for 80000 cents"
            - "D decided ISSUER; acquirer A requests arbitration; arbitration decides ACQUIRER"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "I Bank", member_kind: "ISSUER", region: "EU" }
              as: NetworkOperator
              captures: { m_i: $.data.id }
            - call: "POST /network/members/${m_i}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/members"
              payload: { legal_name: "A Bank", member_kind: "ACQUIRER", region: "EU" }
              as: NetworkOperator
              captures: { m_a: $.data.id }
            - call: "POST /network/members/${m_a}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/merchants"
              payload: { acquirer_member_id: "${m_a}", mcc: "5812", region: "EU", declared_monthly_volume_cents: 50000000 }
              as: SponsorshipManager
              captures: { mc: $.data.id }
            - call: "POST /network/disputes"
              payload: { reason_code: "10.4", issuer_member_id: "${m_i}", acquirer_member_id: "${m_a}", merchant_id: "${mc}", transaction_amount_cents: 80000, currency: "EUR" }
              as: Member
              as_user_id: "${m_i}"
              captures: { d1: $.data.id }
            - call: "POST /network/disputes/${d1}/evidence"
              payload: { evidence_type: "TRANSACTION_RECORD", document_ref: "doc-t1" }
              as: Member
              as_user_id: "${m_a}"
          trigger:
            - call: "POST /network/disputes/${d1}/decide"
              payload: { winning_side: "ISSUER" }
              as: DisputeAnalyst
              captures: { d1_w1: $.data.winning_side }
            - call: "POST /network/disputes/${d1}/request-arbitration"
              payload: {}
              as: Member
              as_user_id: "${m_a}"
            - call: "POST /network/disputes/${d1}/arbitrate"
              payload: { winning_side: "ACQUIRER" }
              as: DisputeAnalyst
              captures: { d1_w2: $.data.winning_side }
            - call: "POST /network/disputes/${d1}/close"
              payload: {}
              as: DisputeAnalyst
          assert:
            - "First decision winning_side == ISSUER"
            - "Arbitration overwrites winning_side to ACQUIRER on the same DisputeCase.${d1}"
            - "DisputeCase.${d1}.status == CLOSED"
            - "Post-arbitration issuer liability == 25500 (CASE_PROCESSING_FEE 500 + ARBITRATION_FEE 25000)"

  - rule_id: transitive_cascade
    instances:
      - name: member_suspend_depth3_cascade
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Participant.ACTIVE_to_SUSPENDED
          - state_machines.Merchant
          - entities.Participant.fields.sponsor_member_id
          - entities.Merchant.fields.participant_id
        distinguishing_aspect: |
          Depth-3 cascade: suspending Member M suspends Participant P (hop 1), and P's suspension itself
          suspends Merchant Mc (hop 2 mutation caused by hop 1, not by the original call), while M's own
          BinRange B suspends as a sibling hop — each link caused by the previous link.
        test_recipe:
          setup:
            - "Member M (BOTH) ACTIVE; Participant P sponsored by M and approved; Merchant Mc under P"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "Cascade Bank", member_kind: "BOTH", region: "APAC" }
              as: NetworkOperator
              captures: { m_b: $.data.id }
            - call: "POST /network/members/${m_b}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "P Co", sponsor_member_id: "${m_b}", program_name: "PP" }
              as: SponsorshipManager
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/approve"
              payload: {}
              as: SponsorshipManager
            - call: "POST /network/merchants"
              payload: { participant_id: "${p1}", mcc: "5411", region: "APAC", declared_monthly_volume_cents: 10000000 }
              as: SponsorshipManager
              captures: { mc: $.data.id }
          trigger:
            - call: "POST /network/members/${m_b}/suspend"
              payload: { reason: "COMPLIANCE_HOLD" }
              as: NetworkOperator
          assert:
            - "Member.${m_b}.status == SUSPENDED"
            - "Participant.${p1}.status == SUSPENDED"
            - "Merchant.${mc}.status == SUSPENDED (suspended only because P was suspended — depth 3)"
            - "Member.${m_b}.suspension_reason == 'COMPLIANCE_HOLD'"

      - name: fraud_escalation_suspends_acquirer_depth2
        grounds:
          - state_machines.RemediationPlan.OVERDUE_to_ESCALATED
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.FraudProgramCycle.SCHEDULED_to_COMPLETED
          - calculations.acquirer_fraud_rate
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: escalating an overdue ACQUIRER-subject RemediationPlan
          suspends the Member (hop 1), whose suspension itself suspends its sponsored Participants (hop 2,
          caused by the member transition, not by the escalate call) — a propagation chain distinct from the
          direct suspend endpoint.
        test_recipe:
          setup:
            - "Acquirer member A ACTIVE with sponsored participant P (ACTIVE); merchant Mc under P, declared volume 1000000 cents"
            - "Confirmed fraud of 10000 cents against Mc inside cycle C1 window [2026-09-01, 2026-09-16): acquirer rate = 10000*10000/1000000 = 100 bps >= 50 threshold"
            - "Cycle C1 evaluated at 2026-09-20 -> RemediationPlan RP (subject ACQUIRER A) created OPEN, due 2026-09-20+60d = 2026-11-19"
            - "Logical clock advanced past due date; cycle C2 (later window) evaluated -> RP swept to OVERDUE"
          setup_api_calls:
            - call: "POST /network/members"
