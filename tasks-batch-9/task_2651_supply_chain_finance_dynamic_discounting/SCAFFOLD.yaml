scenario: |
  Generate task harder than expert level!

  2651. Supply Chain Finance & Dynamic Discounting (C2FO style platform): buyer approved-payables
  file ingestion with invoice validation and dispute suppression, supplier onboarding with identity
  verification and bank account validation, discount rate discovery through supplier-named rates or
  fixed programs with acceptance windows, funding source selection between buyer self-funding and
  third-party funders, early payment execution with settlement timing and remittance advice,
  accounting treatment considerations for trade payable classification, supplier concentration and
  buyer credit limit monitoring, program adoption analytics and rate optimization

domain_name: supply-chain-finance-dynamic-discounting
api_prefix: ""

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - selector_policy
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  entity_topology_note: |
    Fourteen peer entities linked by explicit foreign keys. URL paths are single-collection
    (`/invoices/{id}`, `/discount-offers/{id}`, `/early-payments/{id}`); nesting appears only for
    reverse-reachability reads and for action sub-paths. No entity is addressed through a
    multi-level ownership chain.

  state_machine_shape: parallel
  state_machine_shape_note: |
    EarlyPayment carries three independent state axes on one row (funding_status,
    settlement_status, accounting_status). DiscountOffer is cyclic (NAMED -> COUNTERED -> NAMED
    negotiation rounds). Supplier is a branching fork-join (VERIFYING forks into an identity axis
    and a bank axis and joins into ACTIVE). Invoice has a revert edge (SUPPRESSED -> ELIGIBLE).

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic_note: "Dispute.reason_code discriminates buyer-file suppression from operator-raised disputes; both live on one Dispute row."

  role_model: segregation_of_duties
  role_model_note: |
    BuyerAdmin owns rate discovery (program config, sessions, counters, accepting supplier-named
    rates, dispute intake). BuyerTreasury owns cash movement (funding source selection, execution,
    settlement confirmation, accounting classification). Neither role may perform the other's
    exclusive operations even though both authenticate as the same Buyer id.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Buyer
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered name of the buying organisation
        constraints: "1..200 chars"
      - name: tax_id
        type: string
        source: input
        description: buyer tax identifier, unique across all Buyer rows
        constraints: "exactly 9 digits; uniqueness violation -> ERR_INVALID_REQUEST"
      - name: credit_limit_cents
        type: integer
        source: input
        description: ceiling on the sum of self-funded early payments the buyer may hold open
        constraints: ">= 0"
      - name: credit_used_cents
        type: integer
        source: computed
        description: "output of calculations.buyer_self_funding_utilisation; sum of EarlyPayment.net_payment_cents over BUYER_SELF payments whose funding_status IN {RESERVED, DEPLOYED}"
        default: 0
      - name: self_funding_enabled
        type: boolean
        source: input
        description: when false the buyer may never select BUYER_SELF as a funding source
        default: true
      - name: reclass_days_threshold
        type: integer
        source: input
        description: days_early above which a funder-financed early payment defaults to DEBT_RECLASSIFIED
        default: 30
        constraints: ">= 0"
      - name: reclass_apr_threshold_bps
        type: integer
        source: input
        description: accepted APR in basis points above which a funder-financed early payment defaults to DEBT_RECLASSIFIED
        default: 900
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: buyer platform standing
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}; set to SUSPENDED by the cascade on POST /buyer-programs/{id}/status action=CLOSE when, after that close, zero BuyerProgram rows of this buyer hold status IN {DRAFT, OPEN, PAUSED}"

  - name: BuyerProgram
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: buyer_id
        type: string
        source: input
        description: "FK -> Buyer.id; the buyer that owns and funds this discounting programme"
      - name: name
        type: string
        source: input
        description: programme label shown to suppliers
        constraints: "1..120 chars"
      - name: program_type
        type: enum
        source: input
        description: rate-discovery mechanism for this programme
        constraints: "one of {SUPPLIER_NAMED, FIXED_RATE}"
      - name: fixed_apr_bps
        type: integer
        source: input
        description: the single APR (basis points) every offer must carry when program_type == FIXED_RATE; MUST be null when program_type == SUPPLIER_NAMED
        default: null
        constraints: "when program_type == FIXED_RATE: 1..5000 and required; when SUPPLIER_NAMED: must be null"
      - name: max_acceptable_apr_bps
        type: integer
        source: input
        description: upper bound on any offered_apr_bps or counter_apr_bps; lowered by calculations.rate_optimisation_ceiling when rate_posture leaves DISCOVERY
        constraints: "200..5000"
      - name: min_days_early
        type: integer
        source: input
        description: minimum days_early an early payment must achieve to be executable under this programme
        default: 5
        constraints: ">= 1"
      - name: concentration_cap_pct
        type: number
        source: input
        description: maximum share (percent, 2 decimals) of programme face value one supplier may hold in AWARDED or EARLY_PAID state
        default: 60.00
        constraints: "0.01..100.00"
      - name: funding_policy
        type: enum
        source: input
        description: which funding sources POST /early-payments may select and in what order
        default: SELF_THEN_FUNDER
        constraints: "one of {SELF_ONLY, FUNDER_ONLY, SELF_THEN_FUNDER}"
      - name: status
        type: enum
        source: system
        description: programme lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, OPEN, PAUSED, CLOSED}"
      - name: eligible_invoice_count
        type: integer
        source: computed
        description: "denominator of calculations.program_adoption_rate; count of Invoice rows on this programme whose status IN {ELIGIBLE, OFFERED, AWARDED, EARLY_PAID}"
        default: 0
      - name: adopted_invoice_count
        type: integer
        source: computed
        description: "numerator of calculations.program_adoption_rate; count of Invoice rows on this programme whose status == EARLY_PAID"
        default: 0
      - name: adoption_rate_pct
        type: number
        source: computed
        description: "output of calculations.program_adoption_rate, 2 decimals"
        default: 0.00
      - name: weighted_avg_accepted_apr_bps
        type: integer
        source: computed
        description: "output of calculations.weighted_avg_accepted_apr; face-weighted mean accepted APR over EARLY_PAID invoices of this programme"
        default: 0
      - name: rate_posture
        type: enum
        source: computed
        description: "threshold band of adoption_rate_pct per calculations.program_adoption_rate; gates calculations.rate_optimisation_ceiling"
        default: DISCOVERY
        constraints: "one of {DISCOVERY, OPTIMISED, THROTTLED}"

  - name: AuctionSession
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> BuyerProgram.id; the programme whose acceptance window this session occupies"
      - name: opens_at
        type: datetime
        source: input
        description: inclusive start of the acceptance window (ISO 8601 UTC)
      - name: closes_at
        type: datetime
        source: input
        description: exclusive end of the acceptance window (ISO 8601 UTC)
        constraints: "strictly after opens_at"
      - name: status
        type: enum
        source: system
        description: session lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, LIVE, CLOSED, CANCELLED}"
      - name: named_offer_count
        type: integer
        source: computed
        description: "count of DiscountOffer rows whose session_id == this session and status IN {NAMED, COUNTERED, ACCEPTED}"
        default: 0
      - name: clearing_apr_bps
        type: integer
        source: computed
        description: "output of calculations.session_clearing_apr, written once when status becomes CLOSED; 0 when no offer on the session ever reached ACCEPTED"
        default: 0

  - name: Supplier
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered supplier name; snapshotted onto RemittanceAdvice at execution
        constraints: "1..200 chars"
      - name: tax_id_last4
        type: string
        source: input
        description: last four characters of the supplier tax identifier, used by identity verification
        constraints: "exactly 4 digits"
      - name: remittance_email
        type: string
        source: input
        description: destination for remittance advice; when null every RemittanceAdvice for this supplier is created with delivery_status BOUNCED
        default: null
      - name: onboarding_status
        type: enum
        source: system
        description: fork-join roll-up over idv_status and bank_status
        default: DRAFT
        constraints: "one of {DRAFT, VERIFYING, ACTIVE, REJECTED, SUSPENDED}"
      - name: idv_status
        type: enum
        source: system
        description: identity-verification axis, advanced only by POST /suppliers/{id}/idv/adjudicate
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, PENDING, MANUAL_REVIEW, PASSED, FAILED}"
      - name: bank_status
        type: enum
        source: computed
        description: mirror of the supplier's non-REPLACED BankAccount row's status; NOT_STARTED while the supplier has no BankAccount row
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, MICRO_DEPOSIT_SENT, VERIFIED, FAILED}"
      - name: identity_score
        type: integer
        source: system
        description: score returned by the identity provider at adjudication; 0 until idv_status leaves PENDING
        default: 0
        constraints: "0..100"
      - name: idv_verified_at
        type: datetime
        source: system
        description: logical-clock instant at which idv_status became PASSED; null otherwise
        default: null
      - name: payment_ready_at
        type: datetime
        source: system
        description: logical-clock instant at which onboarding_status became ACTIVE (both axes complete); null otherwise
        default: null
      - name: sanctions_hold
        type: boolean
        source: system
        description: compliance flag set by POST /suppliers/{id}/sanctions-hold; blocks every offer and payment action for this supplier
        default: false
      - name: verified_account_last4
        type: string
        source: computed
        description: account_last4 copied from the supplier's BankAccount row at the moment that row reached VERIFIED; null before then
        default: null

  - name: BankAccount
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the supplier that owns this settlement account"
      - name: routing_number
        type: string
        source: input
        description: nine-digit clearing routing number
        constraints: "exactly 9 digits"
      - name: account_last4
        type: string
        source: input
        description: last four digits of the settlement account number
        constraints: "exactly 4 digits"
      - name: micro_deposit_code
        type: string
        source: system
        description: six-digit code the platform pushes with the micro deposit; the supplier echoes it to POST /bank-accounts/{id}/micro-deposit/confirm
        constraints: "always the literal string derived as the zero-padded decimal of (routing_number last 3 digits concatenated with account_last4 first 3 digits)"
      - name: micro_deposit_attempts
        type: integer
        source: computed
        description: number of POST /bank-accounts/{id}/micro-deposit/confirm calls made against this row, successful or not
        default: 0
      - name: status
        type: enum
        source: system
        description: bank-verification axis for this account row
        default: MICRO_DEPOSIT_SENT
        constraints: "one of {MICRO_DEPOSIT_SENT, VERIFIED, FAILED, REPLACED}"

  - name: ApprovedPayableFile
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> BuyerProgram.id; the programme the ingested payables join"
      - name: filename
        type: string
        source: input
        description: buyer-supplied name of the approved-payables extract
        constraints: "1..200 chars"
      - name: declared_row_count
        type: integer
        source: input
        description: row count the buyer's AP system claims the file contains
        constraints: ">= 1"
      - name: declared_total_cents
        type: integer
        source: input
        description: face total the buyer's AP system claims the file contains, over ALL rows including rows the platform will reject
        constraints: ">= 1"
      - name: computed_total_cents
        type: integer
        source: computed
        description: "sum of calculations.invoice_face_from_lines over every row in the submitted payload, accepted or rejected"
      - name: accepted_row_count
        type: integer
        source: computed
        description: number of rows that produced an Invoice row
      - name: rejected_row_count
        type: integer
        source: computed
        description: number of rows that failed row-level validation and produced no Invoice row
      - name: rejection_reasons
        type: array
        source: computed
        description: "ordered array of objects { row_index: integer, reason: enum } for each rejected row, sorted by row_index ASC; row_index is the zero-based position of the row inside the submitted rows array; reason one of {SUPPLIER_UNKNOWN, DUPLICATE_INVOICE_NUMBER, NON_POSITIVE_AMOUNT, DUE_DATE_NOT_AFTER_APPROVAL, EMPTY_LINES}"
      - name: suppressed_row_count
        type: integer
        source: computed
        description: number of accepted rows whose suppression_flag was true, each of which produced an Invoice in SUPPRESSED plus an auto-raised Dispute
      - name: ingest_status
        type: enum
        source: computed
        description: file-level outcome derived from accepted_row_count and rejected_row_count
        constraints: "one of {ACCEPTED, PARTIALLY_ACCEPTED, REJECTED}; ACCEPTED when rejected_row_count == 0, REJECTED when accepted_row_count == 0, PARTIALLY_ACCEPTED otherwise"

  - name: Invoice
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: file_id
        type: string
        source: system
        description: "FK -> ApprovedPayableFile.id; the ingestion event that created this invoice"
      - name: program_id
        type: string
        source: system
        description: "FK -> BuyerProgram.id; copied from the ingesting file's program_id"
      - name: supplier_id
        type: string
        source: system
        description: "FK -> Supplier.id; resolved from the file row's supplier_id"
      - name: invoice_number
        type: string
        source: system
        description: buyer AP document number; unique per (program_id, supplier_id)
        constraints: "1..40 chars; duplicate within (program_id, supplier_id) rejects the row with reason DUPLICATE_INVOICE_NUMBER"
      - name: face_amount_cents
        type: integer
        source: computed
        description: "output of calculations.invoice_face_from_lines over this invoice's InvoiceLine rows"
      - name: face_covered_cents
        type: integer
        source: computed
        description: "sum of EarlyPayment.face_covered_cents over this invoice's EarlyPayment rows whose funding_status IN {RESERVED, DEPLOYED, RELEASED}"
        default: 0
      - name: remaining_face_cents
        type: integer
        source: computed
        description: "face_amount_cents - face_covered_cents; the conserved quantity of invariants.invoice_face_conservation"
      - name: approval_date
        type: datetime
        source: system
        description: date the buyer approved the payable (ISO 8601 UTC, midnight)
      - name: net_due_date
        type: datetime
        source: system
        description: contractual net-terms maturity date (ISO 8601 UTC, midnight); must be strictly after approval_date
      - name: status
        type: enum
        source: system
        description: invoice lifecycle state within the discounting programme
        default: ELIGIBLE
        constraints: "one of {ELIGIBLE, SUPPRESSED, OFFERED, AWARDED, EARLY_PAID, MATURED}"
      - name: dispute_suppressed
        type: boolean
        source: computed
        description: true while at least one Dispute row on this invoice has status OPEN
        default: false
      - name: accepted_apr_bps
        type: integer
        source: computed
        description: offered_apr_bps of the DiscountOffer on this invoice that reached ACCEPTED; 0 while no offer is accepted
        default: 0
      - name: provisional_discount_cents
        type: integer
        source: computed
        description: "output of calculations.early_payment_discount variant PAY_DATE_BASIS, written when the invoice's EarlyPayment reaches funding_status DEPLOYED"
        default: 0
      - name: final_discount_cents
        type: integer
        source: computed
        description: "output of calculations.early_payment_discount variant VALUE_DATE_BASIS, written when the invoice's EarlyPayment reaches settlement_status CONFIRMED"
        default: 0
      - name: discount_true_up_cents
        type: integer
        source: computed
        description: final_discount_cents - provisional_discount_cents; signed, written at settlement confirmation
        default: 0

  - name: InvoiceLine
    parent: Invoice
    common_fields: false
    entity_kind: configuration
    fields:
      - name: invoice_id
        type: string
        source: system
        description: "FK -> Invoice.id; the invoice this line belongs to"
      - name: line_no
        type: integer
        source: system
        description: 1-based position of the line within the ingested row; the pinned iteration order of calculations.invoice_face_from_lines
        constraints: ">= 1, unique per invoice_id, contiguous from 1"
      - name: line_amount_cents
        type: integer
        source: system
        description: pre-tax line amount in cents
        constraints: "> 0; a row containing any line with line_amount_cents <= 0 is rejected with reason NON_POSITIVE_AMOUNT"
      - name: tax_rate_bps
        type: integer
        source: system
        description: line tax rate in basis points
        constraints: "0..3000"
      - name: line_tax_cents
        type: integer
        source: computed
        description: "round_half_up(line_amount_cents * tax_rate_bps / 10000) evaluated per line before any summation"
      - name: line_total_cents
        type: integer
        source: computed
        description: line_amount_cents + line_tax_cents

  - name: Dispute
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the payable whose amount or delivery the buyer contests"
      - name: reason_code
        type: enum
        source: input
        description: why the payable is contested
        constraints: "one of {BUYER_FILE_SUPPRESSION, SHORT_SHIPMENT, PRICE_VARIANCE, GOODS_REJECTED}; BUYER_FILE_SUPPRESSION may only be written by the ingestion cascade, never by POST /invoices/{id}/disputes"
      - name: disputed_amount_cents
        type: integer
        source: input
        description: contested portion of the invoice face; the full face when the dispute originates from file suppression
        constraints: "1..Invoice.face_amount_cents"
      - name: status
        type: enum
        source: system
        description: dispute lifecycle state
        default: OPEN
        constraints: "one of {OPEN, WITHDRAWN, RESOLVED_UPHELD, RESOLVED_REJECTED}"
      - name: resolution_note
        type: string
        source: input
        description: free-text note supplied at POST /disputes/{id}/resolve; null while OPEN
        default: null

  - name: DiscountOffer
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the payable this offer prices"
      - name: session_id
        type: string
        source: input
        description: "FK -> AuctionSession.id; the acceptance window this offer is bound to"
      - name: supplier_id
        type: string
        source: computed
        description: "FK -> Supplier.id; copied from the invoice's supplier_id at creation"
      - name: offered_apr_bps
        type: integer
        source: input
        description: APR in basis points the supplier is willing to pay for early settlement; overwritten on each POST /discount-offers/{id}/rename
        constraints: "1..BuyerProgram.max_acceptable_apr_bps; must equal BuyerProgram.fixed_apr_bps when program_type == FIXED_RATE"
      - name: requested_pay_date
        type: datetime
        source: input
        description: date the supplier asks to be paid (ISO 8601 UTC, midnight); the projected execution_date used by the provisional discount
        constraints: "strictly before Invoice.net_due_date and not before the logical clock date"
      - name: acceptance_deadline
        type: datetime
        source: input
        description: instant after which this offer may no longer be accepted; the acceptance window is half-open [created_at, acceptance_deadline)
        constraints: "strictly after the logical clock at creation and not after AuctionSession.closes_at"
      - name: counter_apr_bps
        type: integer
        source: input
        description: APR the buyer counters with; null while status == NAMED and never lowered below offered_apr_bps
        default: null
      - name: counter_round
        type: integer
        source: computed
        description: number of completed COUNTERED -> NAMED negotiation cycles on this offer row
        default: 0
      - name: status
        type: enum
        source: system
        description: negotiation state of this offer
        default: NAMED
        constraints: "one of {NAMED, COUNTERED, ACCEPTED, EXPIRED, SUPERSEDED, VOIDED_BY_SUPPRESSION}"
      - name: accepted_apr_bps
        type: integer
        source: computed
        description: the APR actually locked at acceptance - offered_apr_bps when accepted from NAMED, counter_apr_bps when accepted from COUNTERED; 0 until ACCEPTED
        default: 0
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock instant at which status became ACCEPTED; null otherwise
        default: null

  - name: Funder
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered name of the third-party funder
        constraints: "1..200 chars"
      - name: capital_limit_cents
        type: integer
        source: input
        description: hard ceiling on the aggregate of ACTIVE FunderCommitment amounts covering any single instant
        constraints: "> 0"
      - name: min_apr_bps
        type: integer
        source: input
        description: lowest accepted APR this funder will finance; part of the eligibility filter of calculations.funder_selection
        constraints: "1..5000"
      - name: fee_spread_bps
        type: integer
        source: input
        description: funder-specific spread added to the tier rate in calculations.funder_fee
        constraints: "0..500"
      - name: max_single_invoice_cents
        type: integer
        source: input
        description: largest Invoice.face_amount_cents this funder will finance in one early payment
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: funder participation state
        default: ACTIVE
        constraints: "one of {ACTIVE, PAUSED, WITHDRAWN}"
      - name: encumbered_capital_cents
        type: integer
        source: computed
        description: "sum of EarlyPayment.net_payment_cents over this funder's payments whose funding_status IN {RESERVED, DEPLOYED}; the conserved quantity of invariants.funder_capital_conservation"
        default: 0
      - name: available_capital_cents
        type: integer
        source: computed
        description: "output of calculations.funder_available_capital; committed_at(clock date) - encumbered_capital_cents, floored at 0"
        default: 0

  - name: FunderCommitment
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: funder_id
        type: string
        source: input
        description: "FK -> Funder.id; the funder pledging this capital tranche"
      - name: committed_amount_cents
        type: integer
        source: input
        description: capital pledged for every instant inside the closed interval [effective_from, effective_to]
        constraints: "> 0"
      - name: effective_from
        type: datetime
        source: input
        description: inclusive first date the tranche is available (ISO 8601 UTC, midnight)
      - name: effective_to
        type: datetime
        source: input
        description: inclusive last date the tranche is available (ISO 8601 UTC, midnight)
        constraints: "not before effective_from"
      - name: status
        type: enum
        source: system
        description: tranche lifecycle state
        default: ACTIVE
        constraints: "one of {ACTIVE, EXPIRED}"

  - name: EarlyPayment
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> DiscountOffer.id; the accepted offer this payment settles"
      - name: invoice_id
        type: string
        source: computed
        description: "FK -> Invoice.id; copied from the offer's invoice_id at creation"
      - name: funder_id
        type: string
        source: computed
        description: "FK -> Funder.id; the funder chosen by calculations.funder_selection; null when funding_source == BUYER_SELF"
        default: null
      - name: funding_source
        type: enum
        source: computed
        description: which balance sheet supplies the cash, resolved by calculations.funding_source_resolution
        constraints: "one of {BUYER_SELF, FUNDER}"
      - name: accepted_apr_bps
        type: integer
        source: computed
        description: copied from DiscountOffer.accepted_apr_bps at creation and never re-read afterwards
      - name: face_covered_cents
        type: integer
        source: computed
        description: portion of Invoice.face_amount_cents this payment retires; always the whole face (partial early payment is out of scope)
      - name: requested_pay_date
        type: datetime
        source: computed
        description: copied from DiscountOffer.requested_pay_date at creation; the projected execution date of the provisional discount
      - name: execution_date
        type: datetime
        source: system
        description: logical-clock date at which POST /early-payments/{id}/execute ran; null before execution
        default: null
      - name: value_date
        type: datetime
        source: computed
        description: execution_date + SETTLEMENT_LAG_DAYS; the basis date of the VALUE_DATE_BASIS discount variant; null before execution
        default: null
      - name: days_early
        type: integer
        source: computed
        description: "output of calculations.days_early for the variant in force at the last recomputation"
        default: 0
      - name: discount_amount_cents
        type: integer
        source: computed
        description: "output of calculations.early_payment_discount; PAY_DATE_BASIS at creation and at execution, VALUE_DATE_BASIS at settlement confirmation"
      - name: funder_fee_cents
        type: integer
        source: computed
        description: "output of calculations.funder_fee; always 0 when funding_source == BUYER_SELF"
        default: 0
      - name: net_payment_cents
        type: integer
        source: computed
        description: "output of calculations.net_payment; face_amount_cents - discount_amount_cents - funder_fee_cents"
      - name: funding_status
        type: enum
        source: system
        description: cash axis; independent of settlement_status and accounting_status
        default: RESERVED
        constraints: "one of {RESERVED, DEPLOYED, RELEASED, VOID}"
      - name: settlement_status
        type: enum
        source: system
        description: remittance axis; independent of funding_status and accounting_status
        default: UNSENT
        constraints: "one of {UNSENT, REMITTED, CONFIRMED, FAILED}"
      - name: accounting_status
        type: enum
        source: system
        description: trade-payable classification axis; advances independently of the other two axes and may be set at any funding_status including VOID
        default: UNCLASSIFIED
        constraints: "one of {UNCLASSIFIED, TRADE_PAYABLE, DEBT_RECLASSIFIED}"
      - name: default_accounting_status
        type: enum
        source: computed
        description: "output of calculations.accounting_classification_default; the value POST /early-payments/{id}/accounting-classification accepts without an override_reason"
        constraints: "one of {TRADE_PAYABLE, DEBT_RECLASSIFIED}"
      - name: override_reason
        type: string
        source: input
        description: mandatory justification when the classification submitted differs from default_accounting_status
        default: null

  - name: RemittanceAdvice
    parent: EarlyPayment
    common_fields: false
    entity_kind: event
    fields:
      - name: early_payment_id
        type: string
        source: system
        description: "FK -> EarlyPayment.id; the execution event that produced this advice"
      - name: advice_number
        type: string
        source: system
        description: "human-readable advice reference, the literal concatenation 'RA-' + Invoice.invoice_number + '-' + zero-padded 2-digit count of prior RemittanceAdvice rows on the same invoice plus one"
      - name: supplier_legal_name
        type: string
        source: computed
        description: snapshot of Supplier.legal_name taken at execution; never refreshed afterwards
      - name: supplier_account_last4
        type: string
        source: computed
        description: snapshot of Supplier.verified_account_last4 taken at execution; never refreshed afterwards
      - name: gross_face_cents
        type: integer
        source: computed
        description: snapshot of Invoice.face_amount_cents at execution
      - name: discount_cents
        type: integer
        source: computed
        description: snapshot of EarlyPayment.discount_amount_cents at execution (PAY_DATE_BASIS value)
      - name: fee_cents
        type: integer
        source: computed
        description: snapshot of EarlyPayment.funder_fee_cents at execution
      - name: net_paid_cents
        type: integer
        source: computed
        description: snapshot of EarlyPayment.net_payment_cents at execution
      - name: value_date
        type: datetime
        source: computed
        description: snapshot of EarlyPayment.value_date at execution
      - name: delivery_status
        type: enum
        source: computed
        description: SENT when the supplier had a non-null remittance_email at execution, BOUNCED otherwise
        constraints: "one of {SENT, BOUNCED}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: BuyerProgram
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /buyer-programs/{id}/open"
        actor: BuyerAdmin
        preconditions:
          - "buyer_programs.status == DRAFT"
          - "Buyer.status == ACTIVE for the programme's buyer_id"
          - "when program_type == FIXED_RATE, fixed_apr_bps is non-null and <= max_acceptable_apr_bps"
        side_effects:
          - "sets BuyerProgram.status = OPEN"
          - "recomputes BuyerProgram.eligible_invoice_count, adopted_invoice_count, adoption_rate_pct via calculations.program_adoption_rate (all 0 / 0.00 on a fresh programme)"
          - "increments BuyerProgram.version by 1"
      - from: OPEN
        to: PAUSED
        trigger: "POST /buyer-programs/{id}/status with action=PAUSE"
        actor: BuyerAdmin
        preconditions: ["BuyerProgram.status == OPEN"]
        side_effects:
          - "sets BuyerProgram.status = PAUSED"
          - "increments BuyerProgram.version by 1"
        note: "PAUSED blocks POST /discount-offers and POST /early-payments but leaves already-ACCEPTED offers executable."
      - from: PAUSED
        to: OPEN
        trigger: "POST /buyer-programs/{id}/status with action=RESUME"
        actor: BuyerAdmin
        preconditions: ["BuyerProgram.status == PAUSED"]
        side_effects:
          - "sets BuyerProgram.status = OPEN"
          - "increments BuyerProgram.version by 1"
        note: "The PAUSED -> OPEN edge is what makes this machine cyclic; a programme may be paused and resumed any number of times."
      - from: OPEN
        to: CLOSED
        trigger: "POST /buyer-programs/{id}/status with action=CLOSE"
        actor: BuyerAdmin
        preconditions: ["BuyerProgram.status IN {OPEN, PAUSED}"]
        side_effects:
          - "sets BuyerProgram.status = CLOSED"
          - "cascade hop 1: every AuctionSession of this programme with status IN {SCHEDULED, LIVE} becomes CANCELLED, in created_at ASC order"
          - "cascade hop 2: because those sessions left {SCHEDULED, LIVE}, every DiscountOffer bound to them with status IN {NAMED, COUNTERED} becomes EXPIRED, in created_at ASC order"
          - "cascade hop 3: because zero BuyerProgram rows of this buyer now hold status IN {DRAFT, OPEN, PAUSED}, Buyer.status becomes SUSPENDED"
          - "increments BuyerProgram.version by 1"
      - from: PAUSED
        to: CLOSED
        trigger: "POST /buyer-programs/{id}/status with action=CLOSE"
        actor: BuyerAdmin
        preconditions: ["BuyerProgram.status IN {OPEN, PAUSED}"]
        side_effects:
          - "identical cascade to the OPEN -> CLOSED edge"
          - "increments BuyerProgram.version by 1"

  - entity: AuctionSession
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LIVE
        trigger: "system sweep step 2 of POST /_clock/set_current_utc, when new clock >= opens_at and new clock < closes_at"
        actor: system
        preconditions: ["AuctionSession.status == SCHEDULED", "BuyerProgram.status IN {OPEN, PAUSED}"]
        side_effects: ["sets AuctionSession.status = LIVE", "increments AuctionSession.version by 1"]
      - from: LIVE
        to: CLOSED
        trigger: "system sweep step 2 of POST /_clock/set_current_utc, when new clock >= closes_at"
        actor: system
        preconditions: ["AuctionSession.status IN {SCHEDULED, LIVE}"]
        side_effects:
          - "sets AuctionSession.status = CLOSED"
          - "writes AuctionSession.clearing_apr_bps via calculations.session_clearing_apr"
          - "cascade: every DiscountOffer on this session with status IN {NAMED, COUNTERED} becomes EXPIRED, in created_at ASC order"
          - "increments AuctionSession.version by 1"
      - from: SCHEDULED
        to: CLOSED
        trigger: "system sweep step 2 of POST /_clock/set_current_utc, when new clock >= closes_at (window skipped entirely)"
        actor: system
        preconditions: ["AuctionSession.status == SCHEDULED"]
        side_effects: ["identical to the LIVE -> CLOSED edge; clearing_apr_bps is 0 because no offer was ever accepted"]
      - from: LIVE
        to: CANCELLED
        trigger: "POST /auction-sessions/{id}/close with mode=CANCEL"
        actor: BuyerAdmin
        preconditions: ["AuctionSession.status IN {SCHEDULED, LIVE}", "zero DiscountOffer rows on this session hold status ACCEPTED"]
        side_effects:
          - "sets AuctionSession.status = CANCELLED"
          - "cascade: every DiscountOffer on this session with status IN {NAMED, COUNTERED} becomes EXPIRED, in created_at ASC order"
          - "increments AuctionSession.version by 1"
      - from: LIVE
        to: CLOSED
        trigger: "POST /auction-sessions/{id}/close with mode=SETTLE"
        actor: BuyerAdmin
        preconditions: ["AuctionSession.status == LIVE"]
        side_effects: ["identical to the system LIVE -> CLOSED edge"]
        note: "Operator-driven early close; distinguished from mode=CANCEL by writing clearing_apr_bps and by permitting ACCEPTED offers to exist."

  - entity: Supplier
    shape: branching
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: VERIFYING
        trigger: "POST /suppliers/{id}/onboarding/submit"
        actor: Supplier
        preconditions: ["Supplier.onboarding_status == DRAFT", "Supplier.sanctions_hold == false"]
        side_effects:
          - "sets Supplier.onboarding_status = VERIFYING"
          - "forks the identity axis: sets Supplier.idv_status = PENDING"
          - "leaves the bank axis untouched: Supplier.bank_status stays NOT_STARTED until POST /suppliers/{id}/bank-accounts is called"
          - "increments Supplier.version by 1"
        note: "This is the fork point of the diamond. The two axes advance through disjoint endpoints and write disjoint field sets."
      - from: VERIFYING
        to: VERIFYING
        trigger: "POST /suppliers/{id}/idv/adjudicate with decision IN {PASSED, MANUAL_REVIEW}"
        actor: PlatformOps
        preconditions: ["Supplier.onboarding_status == VERIFYING", "Supplier.idv_status IN {PENDING, MANUAL_REVIEW}"]
        side_effects:
          - "identity branch only: sets Supplier.idv_status = decision, Supplier.identity_score = supplied identity_score"
          - "when decision == PASSED also sets Supplier.idv_verified_at = logical clock instant"
          - "join check: when idv_status == PASSED AND bank_status == VERIFIED, onboarding_status becomes ACTIVE and payment_ready_at is stamped"
          - "increments Supplier.version by 1"
      - from: VERIFYING
        to: ACTIVE
        trigger: "join of the identity and bank axes, evaluated at the end of POST /suppliers/{id}/idv/adjudicate and of POST /bank-accounts/{id}/micro-deposit/confirm"
        actor: system
        preconditions: ["Supplier.idv_status == PASSED", "Supplier.bank_status == VERIFIED", "Supplier.sanctions_hold == false"]
        side_effects:
          - "sets Supplier.onboarding_status = ACTIVE"
          - "sets Supplier.payment_ready_at = logical clock instant"
          - "increments Supplier.version by 1"
        note: "Join point of the diamond; reachable from either branch completing last."
      - from: VERIFYING
        to: REJECTED
        trigger: "POST /suppliers/{id}/idv/adjudicate with decision=FAILED"
        actor: PlatformOps
        preconditions: ["Supplier.onboarding_status == VERIFYING", "Supplier.idv_status IN {PENDING, MANUAL_REVIEW}"]
        side_effects:
          - "sets Supplier.idv_status = FAILED and Supplier.onboarding_status = REJECTED"
          - "cascade: the supplier's non-REPLACED BankAccount row, if any, becomes FAILED and Supplier.bank_status mirrors FAILED"
          - "increments Supplier.version by 1"
        note: "The identity branch failing short-circuits the join; the bank branch is abandoned rather than joined."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /suppliers/{id}/sanctions-hold with hold=true"
        actor: PlatformOps
        preconditions: ["Supplier.onboarding_status IN {DRAFT, VERIFYING, ACTIVE}"]
        side_effects:
          - "sets Supplier.sanctions_hold = true and Supplier.onboarding_status = SUSPENDED"
          - "increments Supplier.version by 1"
        note: "Existing ACCEPTED offers and RESERVED early payments are NOT voided; the hold blocks new actions only."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /suppliers/{id}/sanctions-hold with hold=false"
        actor: PlatformOps
        preconditions: ["Supplier.onboarding_status == SUSPENDED", "Supplier.idv_status == PASSED", "Supplier.bank_status == VERIFIED"]
        side_effects:
          - "sets Supplier.sanctions_hold = false and Supplier.onboarding_status = ACTIVE"
          - "increments Supplier.version by 1"
      - from: SUSPENDED
        to: VERIFYING
        trigger: "POST /suppliers/{id}/sanctions-hold with hold=false"
        actor: PlatformOps
        preconditions: ["Supplier.onboarding_status == SUSPENDED", "NOT (idv_status == PASSED AND bank_status == VERIFIED)"]
        side_effects:
          - "sets Supplier.sanctions_hold = false and Supplier.onboarding_status = VERIFYING"
          - "increments Supplier.version by 1"
        note: "Releasing the hold returns the supplier to whichever pre-hold state its two axes justify, never past the join."

  - entity: BankAccount
    shape: cyclic
    initial_state: MICRO_DEPOSIT_SENT
    terminal_states: [REPLACED]
    transitions:
      - from: MICRO_DEPOSIT_SENT
        to: VERIFIED
        trigger: "POST /bank-accounts/{id}/micro-deposit/confirm with a code equal to BankAccount.micro_deposit_code"
        actor: Supplier
        preconditions:
          - "BankAccount.status == MICRO_DEPOSIT_SENT"
          - "BankAccount.micro_deposit_attempts < MAX_MICRO_DEPOSIT_ATTEMPTS"
          - "Supplier.sanctions_hold == false"
        side_effects:
          - "increments BankAccount.micro_deposit_attempts by 1"
          - "sets BankAccount.status = VERIFIED"
          - "sets Supplier.bank_status = VERIFIED and Supplier.verified_account_last4 = BankAccount.account_last4"
          - "join check: when Supplier.idv_status == PASSED, Supplier.onboarding_status becomes ACTIVE and payment_ready_at is stamped"
          - "increments BankAccount.version and Supplier.version by 1 each"
      - from: MICRO_DEPOSIT_SENT
        to: MICRO_DEPOSIT_SENT
        trigger: "POST /bank-accounts/{id}/micro-deposit/confirm with a code different from BankAccount.micro_deposit_code, where micro_deposit_attempts + 1 < MAX_MICRO_DEPOSIT_ATTEMPTS"
        actor: Supplier
        preconditions: ["BankAccount.status == MICRO_DEPOSIT_SENT", "BankAccount.micro_deposit_attempts < MAX_MICRO_DEPOSIT_ATTEMPTS"]
        side_effects:
          - "increments BankAccount.micro_deposit_attempts by 1"
          - "leaves BankAccount.status = MICRO_DEPOSIT_SENT (the row re-arms for another attempt)"
          - "leaves Supplier.bank_status = MICRO_DEPOSIT_SENT"
          - "increments BankAccount.version by 1; Supplier.version is NOT incremented because no Supplier field changed"
        note: "This MICRO_DEPOSIT_SENT -> MICRO_DEPOSIT_SENT self-edge is the cycle in this machine; a supplier retries on the same account row rather than creating a new one."
      - from: MICRO_DEPOSIT_SENT
        to: FAILED
        trigger: "POST /bank-accounts/{id}/micro-deposit/confirm with a code different from BankAccount.micro_deposit_code, where micro_deposit_attempts + 1 == MAX_MICRO_DEPOSIT_ATTEMPTS"
        actor: Supplier
        preconditions: ["BankAccount.status == MICRO_DEPOSIT_SENT", "BankAccount.micro_deposit_attempts < MAX_MICRO_DEPOSIT_ATTEMPTS"]
        side_effects:
          - "increments BankAccount.micro_deposit_attempts by 1 (reaching MAX_MICRO_DEPOSIT_ATTEMPTS)"
          - "sets BankAccount.status = FAILED and Supplier.bank_status = FAILED"
          - "increments BankAccount.version and Supplier.version by 1 each"
        note: "Any further confirm call on this row is rejected with ERR_MICRO_DEPOSIT_ATTEMPTS_EXHAUSTED; the supplier must POST a replacement account row."
      - from: FAILED
        to: REPLACED
        trigger: "POST /suppliers/{id}/bank-accounts creating a newer account row for the same supplier"
        actor: Supplier
        preconditions: ["BankAccount.status IN {MICRO_DEPOSIT_SENT, VERIFIED, FAILED}"]
        side_effects: ["identical to the VERIFIED -> REPLACED edge"]
      - from: VERIFIED
        to: REPLACED
        trigger: "POST /suppliers/{id}/bank-accounts creating a newer account row for the same supplier"
        actor: Supplier
        preconditions: ["BankAccount.status IN {MICRO_DEPOSIT_SENT, VERIFIED, FAILED}"]
        side_effects:
          - "sets the prior BankAccount.status = REPLACED"
          - "sets Supplier.bank_status = MICRO_DEPOSIT_SENT (mirroring the new row) and Supplier.verified_account_last4 = null"
          - "cascade: when Supplier.onboarding_status was ACTIVE it drops back to VERIFYING and payment_ready_at is cleared to null"
          - "increments the prior BankAccount.version and Supplier.version by 1 each"

  - entity: ApprovedPayableFile
    shape: branching
    initial_state: ACCEPTED
    terminal_states: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED]
    transitions:
      - from: "(none - created directly in a terminal state)"
        to: ACCEPTED
        trigger: "POST /payable-files where every submitted row passes row-level validation"
        actor: BuyerAdmin
        preconditions:
          - "BuyerProgram.status == OPEN"
          - "declared_row_count == accepted_row_count (rows rejected for row-level reasons are excluded from both control totals)"
          - "declared_total_cents == computed_total_cents (sum of calculations.invoice_face_from_lines over the accepted rows only)"
        side_effects:
          - "creates one Invoice per accepted row, in submitted-row order, each with its InvoiceLine rows in line_no ASC order"
          - "each Invoice starts in SUPPRESSED with dispute_suppressed = true when its row carried suppression_flag = true, and in ELIGIBLE otherwise"
          - "for each suppressed row also creates a Dispute with reason_code BUYER_FILE_SUPPRESSION, status OPEN and disputed_amount_cents equal to the invoice face"
          - "recomputes BuyerProgram.eligible_invoice_count, adopted_invoice_count, adoption_rate_pct, rate_posture via calculations.program_adoption_rate"
          - "increments BuyerProgram.version by 1"
      - from: "(none - created directly in a terminal state)"
        to: PARTIALLY_ACCEPTED
        trigger: "POST /payable-files where at least one row passes and at least one row fails row-level validation"
        actor: BuyerAdmin
        preconditions: ["same as the ACCEPTED edge"]
        side_effects:
          - "same as the ACCEPTED edge for accepted rows only"
          - "records each failure in rejection_reasons, sorted by row_index ASC"
      - from: "(none - created directly in a terminal state)"
        to: REJECTED
        trigger: "POST /payable-files where every submitted row fails row-level validation"
        actor: BuyerAdmin
        preconditions: ["same as the ACCEPTED edge"]
        side_effects:
          - "creates no Invoice rows"
          - "records every failure in rejection_reasons"
          - "leaves BuyerProgram counters unchanged"
    note: "Ingestion is synchronous, so the file row is persisted directly in its terminal state; there is no RECEIVED or VALIDATING state to observe."

  - entity: Invoice
    shape: branching
    initial_state: ELIGIBLE
    terminal_states: [EARLY_PAID, MATURED]
    transitions:
      - from: ELIGIBLE
        to: OFFERED
        trigger: "POST /discount-offers"
        actor: Supplier
        preconditions:
          - "Invoice.status == ELIGIBLE"
          - "Invoice.dispute_suppressed == false"
          - "BuyerProgram.status == OPEN"
          - "AuctionSession.status == LIVE"
          - "Supplier.onboarding_status == ACTIVE and Supplier.sanctions_hold == false"
        side_effects:
          - "creates the DiscountOffer in NAMED"
          - "sets Invoice.status = OFFERED"
          - "increments Invoice.version by 1 (the OCC anchor of concurrency_rules.offer-create-stale-invoice)"
      - from: OFFERED
        to: AWARDED
        trigger: "POST /discount-offers/{id}/accept"
        actor: BuyerAdmin
        preconditions: ["Invoice.status == OFFERED", "the offer being accepted has invoice_id == this invoice"]
        side_effects:
          - "sets Invoice.status = AWARDED and Invoice.accepted_apr_bps = DiscountOffer.accepted_apr_bps"
          - "increments Invoice.version by 1"
      - from: AWARDED
        to: EARLY_PAID
        trigger: "POST /early-payments/{id}/settlement/confirm"
        actor: BuyerTreasury
        preconditions: ["Invoice.status == AWARDED", "the EarlyPayment being confirmed has invoice_id == this invoice"]
        side_effects:
          - "sets Invoice.status = EARLY_PAID"
          - "writes Invoice.final_discount_cents from calculations.early_payment_discount variant VALUE_DATE_BASIS and Invoice.discount_true_up_cents = final_discount_cents - provisional_discount_cents"
          - "cascade hop: because Invoice.status became EARLY_PAID, BuyerProgram.adopted_invoice_count increments and adoption_rate_pct / rate_posture are recomputed"
          - "increments Invoice.version by 1"
      - from: ELIGIBLE
        to: SUPPRESSED
        trigger: "POST /invoices/{id}/disputes"
        actor: BuyerAdmin
        preconditions: ["Invoice.status IN {ELIGIBLE, OFFERED, AWARDED}", "Invoice.dispute_suppressed == false"]
        side_effects:
          - "sets Invoice.dispute_suppressed = true and Invoice.status = SUPPRESSED"
          - "increments Invoice.version by 1"
      - from: OFFERED
        to: SUPPRESSED
        trigger: "POST /invoices/{id}/disputes"
        actor: BuyerAdmin
        preconditions: ["Invoice.status IN {ELIGIBLE, OFFERED, AWARDED}", "Invoice.dispute_suppressed == false"]
        side_effects:
          - "sets Invoice.dispute_suppressed = true and Invoice.status = SUPPRESSED"
          - "cascade hop 2: because Invoice.status became SUPPRESSED, every DiscountOffer on this invoice with status IN {NAMED, COUNTERED, ACCEPTED} becomes VOIDED_BY_SUPPRESSION, in created_at ASC order"
          - "increments Invoice.version by 1"
      - from: AWARDED
        to: SUPPRESSED
        trigger: "POST /invoices/{id}/disputes"
        actor: BuyerAdmin
        preconditions: ["Invoice.status IN {ELIGIBLE, OFFERED, AWARDED}", "Invoice.dispute_suppressed == false"]
        side_effects:
          - "sets Invoice.dispute_suppressed = true and Invoice.status = SUPPRESSED"
          - "cascade hop 2: because Invoice.status became SUPPRESSED, every DiscountOffer on this invoice with status IN {NAMED, COUNTERED, ACCEPTED} becomes VOIDED_BY_SUPPRESSION, in created_at ASC order"
          - "cascade hop 3: because the ACCEPTED offer became VOIDED_BY_SUPPRESSION, its EarlyPayment rows with funding_status IN {RESERVED, DEPLOYED} become VOID; for funding_source FUNDER this decrements Funder.encumbered_capital_cents by net_payment_cents and recomputes Funder.available_capital_cents, and for BUYER_SELF it decrements Buyer.credit_used_cents by net_payment_cents"
          - "cascade hop 4: because the EarlyPayment funding_status became VOID it leaves the {RESERVED, DEPLOYED, RELEASED} set, so Invoice.face_covered_cents drops to 0 and Invoice.remaining_face_cents returns to face_amount_cents, restoring invariants.invoice_face_conservation"
          - "increments Invoice.version by 1"
        note: "The deepest cascade in the scaffold: Dispute -> Invoice -> DiscountOffer -> EarlyPayment (+ Funder / Buyer ledger) -> Invoice face ledger."
      - from: SUPPRESSED
        to: ELIGIBLE
        trigger: "POST /disputes/{id}/resolve with resolution IN {WITHDRAWN, REJECTED}"
        actor: BuyerAdmin
        preconditions: ["Invoice.status == SUPPRESSED", "after this resolution zero Dispute rows on this invoice hold status OPEN"]
        side_effects:
          - "sets Invoice.dispute_suppressed = false and Invoice.status = ELIGIBLE"
          - "does NOT resurrect offers that were voided by the suppression; the supplier must name a new rate"
          - "increments Invoice.version by 1"
        note: "The revert edge that makes this machine non-linear; an invoice may be suppressed and released repeatedly."
      - from: SUPPRESSED
        to: MATURED
        trigger: "POST /disputes/{id}/resolve with resolution=UPHELD"
        actor: BuyerAdmin
        preconditions: ["Invoice.status == SUPPRESSED"]
        side_effects:
          - "sets Invoice.status = MATURED (the payable leaves the discounting programme and will be paid on net terms)"
          - "recomputes BuyerProgram.eligible_invoice_count, adoption_rate_pct and rate_posture because the invoice left the eligible set"
          - "increments Invoice.version by 1"
      - from: ELIGIBLE
        to: MATURED
        trigger: "system sweep step 4 of POST /_clock/set_current_utc, when new clock date > net_due_date"
        actor: system
        preconditions: ["Invoice.status IN {ELIGIBLE, OFFERED}"]
        side_effects:
          - "sets Invoice.status = MATURED"
          - "cascade: every DiscountOffer on this invoice with status IN {NAMED, COUNTERED} becomes EXPIRED"
          - "recomputes BuyerProgram.eligible_invoice_count, adoption_rate_pct and rate_posture"
          - "increments Invoice.version by 1"
      - from: OFFERED
        to: MATURED
        trigger: "system sweep step 4 of POST /_clock/set_current_utc, when new clock date > net_due_date"
        actor: system
        preconditions: ["Invoice.status IN {ELIGIBLE, OFFERED}"]
        side_effects: ["identical to the ELIGIBLE -> MATURED edge"]
      - from: OFFERED
        to: OFFERED
        trigger: "POST /discount-offers naming a fresh rate on an invoice that already carries a NAMED or COUNTERED offer"
        actor: Supplier
        preconditions:
          - "Invoice.status == OFFERED"
          - "Invoice.dispute_suppressed == false"
          - "BuyerProgram.status == OPEN and AuctionSession.status == LIVE"
          - "zero DiscountOffer rows on this invoice hold status ACCEPTED"
          - "expected_invoice_version equals the invoice's current version (concurrency_rules.offer-create-stale-invoice)"
        side_effects:
          - "the prior DiscountOffer rows on this invoice with status IN {NAMED, COUNTERED} become SUPERSEDED, in created_at ASC order"
          - "creates the new DiscountOffer in NAMED"
          - "leaves Invoice.status = OFFERED but increments Invoice.version by 1, which is what makes any further create carrying the old expected_invoice_version stale"
        note: "Self-edge on the invoice; the observable change is the supersede cascade plus the version bump, not the status."

  - entity: Dispute
    shape: branching
    initial_state: OPEN
    terminal_states: [WITHDRAWN, RESOLVED_UPHELD, RESOLVED_REJECTED]
    transitions:
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/resolve with resolution=WITHDRAWN"
        actor: BuyerAdmin
        preconditions: ["Dispute.status == OPEN"]
        side_effects:
          - "sets Dispute.status = WITHDRAWN and Dispute.resolution_note"
          - "cascade: drives the Invoice SUPPRESSED -> ELIGIBLE edge when no other OPEN dispute remains"
          - "increments Dispute.version by 1"
      - from: OPEN
        to: RESOLVED_REJECTED
        trigger: "POST /disputes/{id}/resolve with resolution=REJECTED"
        actor: PlatformOps
        preconditions: ["Dispute.status == OPEN"]
        side_effects:
          - "sets Dispute.status = RESOLVED_REJECTED and Dispute.resolution_note"
          - "cascade: drives the Invoice SUPPRESSED -> ELIGIBLE edge when no other OPEN dispute remains"
          - "increments Dispute.version by 1"
      - from: OPEN
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve with resolution=UPHELD"
        actor: PlatformOps
        preconditions: ["Dispute.status == OPEN"]
        side_effects:
          - "sets Dispute.status = RESOLVED_UPHELD and Dispute.resolution_note"
          - "cascade: drives the Invoice SUPPRESSED -> MATURED edge"
          - "increments Dispute.version by 1"

  - entity: DiscountOffer
    shape: cyclic
    initial_state: NAMED
    terminal_states: [EXPIRED, SUPERSEDED, VOIDED_BY_SUPPRESSION]
    transitions:
      - from: NAMED
        to: COUNTERED
        trigger: "POST /discount-offers/{id}/counter"
        actor: BuyerAdmin
        preconditions:
          - "DiscountOffer.status == NAMED"
          - "AuctionSession.status == LIVE and the logical clock is inside [opens_at, closes_at)"
          - "BuyerProgram.status == OPEN"
          - "BuyerProgram.program_type == SUPPLIER_NAMED (a FIXED_RATE programme has nothing to negotiate)"
          - "counter_apr_bps > DiscountOffer.offered_apr_bps and counter_apr_bps <= BuyerProgram.max_acceptable_apr_bps"
          - "DiscountOffer.counter_round < MAX_COUNTER_ROUNDS"
        side_effects:
          - "sets DiscountOffer.status = COUNTERED and DiscountOffer.counter_apr_bps"
          - "increments DiscountOffer.version by 1 (the OCC anchor of concurrency_rules.payment-create-stale-offer)"
      - from: COUNTERED
        to: NAMED
        trigger: "POST /discount-offers/{id}/rename"
        actor: Supplier
        preconditions:
          - "DiscountOffer.status == COUNTERED"
          - "AuctionSession.status == LIVE and the logical clock is inside [opens_at, closes_at)"
          - "the new offered_apr_bps > the previous offered_apr_bps and <= BuyerProgram.max_acceptable_apr_bps"
          - "DiscountOffer.counter_round + 1 <= MAX_COUNTER_ROUNDS"
        side_effects:
          - "overwrites DiscountOffer.offered_apr_bps with the new rate"
          - "increments DiscountOffer.counter_round by 1 and clears counter_apr_bps to null"
          - "sets DiscountOffer.status = NAMED"
          - "increments DiscountOffer.version by 1"
        note: "This COUNTERED -> NAMED edge closes the negotiation cycle; the pair (counter, rename) may repeat until counter_round reaches MAX_COUNTER_ROUNDS."
      - from: NAMED
        to: ACCEPTED
        trigger: "POST /discount-offers/{id}/accept"
        actor: BuyerAdmin
        preconditions:
          - "DiscountOffer.status == NAMED"
          - "the logical clock instant is inside the half-open window [AuctionSession.opens_at, AuctionSession.closes_at) and AuctionSession.status == LIVE"
          - "BuyerProgram.status == OPEN"
          - "Supplier.onboarding_status == ACTIVE, Supplier.bank_status == VERIFIED and Supplier.sanctions_hold == false"
          - "Invoice.dispute_suppressed == false"
          - "the projected concentration from calculations.supplier_concentration variant FACE_BASIS does not exceed BuyerProgram.concentration_cap_pct"
        side_effects:
          - "sets DiscountOffer.status = ACCEPTED, accepted_apr_bps = offered_apr_bps, accepted_at = logical clock instant"
          - "drives the Invoice OFFERED -> AWARDED edge"
          - "increments AuctionSession.named_offer_count is NOT performed here; named_offer_count already counts ACCEPTED"
          - "increments DiscountOffer.version by 1"
        note: "From NAMED only BuyerAdmin may accept - the buyer is taking the supplier's named rate."
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /discount-offers/{id}/accept"
        actor: Supplier
        preconditions:
          - "DiscountOffer.status == COUNTERED"
          - "the logical clock instant is inside the half-open window [AuctionSession.opens_at, AuctionSession.closes_at) and AuctionSession.status == LIVE"
          - "BuyerProgram.status == OPEN"
          - "Supplier.onboarding_status == ACTIVE, Supplier.bank_status == VERIFIED and Supplier.sanctions_hold == false"
          - "Invoice.dispute_suppressed == false"
          - "the projected concentration from calculations.supplier_concentration variant FACE_BASIS does not exceed BuyerProgram.concentration_cap_pct"
        side_effects:
          - "sets DiscountOffer.status = ACCEPTED, accepted_apr_bps = counter_apr_bps, accepted_at = logical clock instant"
          - "drives the Invoice OFFERED -> AWARDED edge"
          - "increments DiscountOffer.version by 1"
        note: "From COUNTERED only Supplier may accept - the supplier is taking the buyer's counter. The accepted rate therefore comes from a different field than on the NAMED edge."
      - from: NAMED
        to: EXPIRED
        trigger: "AuctionSession close or cancel cascade, or the Invoice maturity sweep"
        actor: system
        preconditions: ["DiscountOffer.status IN {NAMED, COUNTERED}"]
        side_effects: ["sets DiscountOffer.status = EXPIRED", "increments DiscountOffer.version by 1"]
      - from: COUNTERED
        to: EXPIRED
        trigger: "AuctionSession close or cancel cascade, or the Invoice maturity sweep"
        actor: system
        preconditions: ["DiscountOffer.status IN {NAMED, COUNTERED}"]
        side_effects: ["sets DiscountOffer.status = EXPIRED", "increments DiscountOffer.version by 1"]
      - from: NAMED
        to: SUPERSEDED
        trigger: "POST /discount-offers creating a newer offer on the same invoice"
        actor: Supplier
        preconditions: ["DiscountOffer.status IN {NAMED, COUNTERED}"]
        side_effects: ["sets DiscountOffer.status = SUPERSEDED", "increments DiscountOffer.version by 1"]
      - from: ACCEPTED
        to: VOIDED_BY_SUPPRESSION
        trigger: "POST /invoices/{id}/disputes cascade hop 2"
        actor: system
        preconditions: ["DiscountOffer.status IN {NAMED, COUNTERED, ACCEPTED}"]
        side_effects:
          - "sets DiscountOffer.status = VOIDED_BY_SUPPRESSION"
          - "cascade hop 3: the offer's EarlyPayment rows with funding_status IN {RESERVED, DEPLOYED} become VOID"
          - "increments DiscountOffer.version by 1"

  - entity: Funder
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /funders/{id}/pause with action=PAUSE"
        actor: Funder
        preconditions: ["Funder.status == ACTIVE"]
        side_effects:
          - "sets Funder.status = PAUSED, removing the funder from the eligibility filter of calculations.funder_selection"
          - "leaves encumbered_capital_cents untouched - existing reservations continue to settle"
          - "increments Funder.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /funders/{id}/pause with action=RESUME"
        actor: Funder
        preconditions: ["Funder.status == PAUSED"]
        side_effects: ["sets Funder.status = ACTIVE", "increments Funder.version by 1"]
        note: "The PAUSED -> ACTIVE edge makes this machine cyclic."
      - from: PAUSED
        to: WITHDRAWN
        trigger: "POST /funders/{id}/pause with action=WITHDRAW"
        actor: PlatformOps
        preconditions: ["Funder.status IN {ACTIVE, PAUSED}", "Funder.encumbered_capital_cents == 0"]
        side_effects:
          - "sets Funder.status = WITHDRAWN"
          - "cascade: every ACTIVE FunderCommitment of this funder becomes EXPIRED, in created_at ASC order"
          - "recomputes Funder.available_capital_cents to 0"
          - "increments Funder.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /funders/{id}/pause with action=WITHDRAW"
        actor: PlatformOps
        preconditions: ["Funder.status IN {ACTIVE, PAUSED}", "Funder.encumbered_capital_cents == 0"]
        side_effects: ["identical to the PAUSED -> WITHDRAWN edge"]

  - entity: FunderCommitment
    shape: linear
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep step 5 of POST /_clock/set_current_utc, when new clock date > effective_to"
        actor: system
        preconditions: ["FunderCommitment.status == ACTIVE"]
        side_effects:
          - "sets FunderCommitment.status = EXPIRED"
          - "recomputes Funder.available_capital_cents via calculations.funder_available_capital"
          - "increments FunderCommitment.version and Funder.version by 1 each"
      - from: ACTIVE
        to: EXPIRED
        trigger: "Funder WITHDRAWN cascade"
        actor: system
        preconditions: ["FunderCommitment.status == ACTIVE"]
        side_effects: ["identical to the clock-sweep edge"]

  - entity: EarlyPayment
    shape: parallel
    parallel_dimensions:
      funding_status:
        initial_state: RESERVED
        terminal_states: [RELEASED, VOID]
        note: "cash axis - which balance sheet is standing behind the payment right now"
      settlement_status:
        initial_state: UNSENT
        terminal_states: [CONFIRMED, FAILED]
        note: "remittance axis - whether the money has left and whether the bank confirmed it"
      accounting_status:
        initial_state: UNCLASSIFIED
        terminal_states: []
        note: "classification axis - never terminal; the controller may re-classify at any time, including after funding_status VOID"
    initial_state: RESERVED
    terminal_states: [RELEASED, VOID]
    transitions:
      - from: "(none - created directly)"
        to: RESERVED
        trigger: "POST /early-payments"
        actor: BuyerTreasury
        preconditions:
          - "DiscountOffer.status == ACCEPTED"
          - "Invoice.status == AWARDED and Invoice.dispute_suppressed == false"
          - "BuyerProgram.status == OPEN"
          - "Supplier.onboarding_status == ACTIVE, Supplier.bank_status == VERIFIED, Supplier.sanctions_hold == false"
          - "expected_offer_version equals DiscountOffer.version (concurrency_rules.payment-create-stale-offer)"
          - "calculations.days_early on the PAY_DATE_BASIS variant is >= BuyerProgram.min_days_early"
          - "calculations.funding_source_resolution yields a source; when it yields none the request is rejected"
        side_effects:
          - "any prior EarlyPayment row on the same offer with funding_status IN {RESERVED, DEPLOYED} becomes VOID and its encumbrance is released (funder or buyer, per its own funding_source)"
          - "creates the row with funding_status RESERVED, settlement_status UNSENT, accounting_status UNCLASSIFIED"
          - "writes funding_source, funder_id, accepted_apr_bps, face_covered_cents, requested_pay_date, days_early, discount_amount_cents (PAY_DATE_BASIS), funder_fee_cents, net_payment_cents and default_accounting_status"
          - "for funding_source FUNDER: increments Funder.encumbered_capital_cents by net_payment_cents and recomputes Funder.available_capital_cents"
          - "for funding_source BUYER_SELF: increments Buyer.credit_used_cents by net_payment_cents"
          - "sets Invoice.face_covered_cents = face_amount_cents and Invoice.remaining_face_cents = 0"
          - "increments DiscountOffer.version by 1"
      - from: RESERVED
        to: DEPLOYED
        trigger: "POST /early-payments/{id}/execute"
        actor: BuyerTreasury
        preconditions:
          - "EarlyPayment.funding_status == RESERVED"
          - "EarlyPayment.settlement_status == UNSENT"
          - "Invoice.dispute_suppressed == false"
          - "Supplier.sanctions_hold == false"
          - "the logical clock date is not after Invoice.net_due_date"
        side_effects:
          - "sets funding_status = DEPLOYED and execution_date = logical clock date"
          - "sets value_date = execution_date + SETTLEMENT_LAG_DAYS"
          - "recomputes days_early, discount_amount_cents (still PAY_DATE_BASIS, now against the actual execution_date), funder_fee_cents and net_payment_cents; the encumbrance on Funder or Buyer is adjusted by the delta"
          - "settlement axis advances on the same call: settlement_status UNSENT -> REMITTED"
          - "creates exactly one RemittanceAdvice snapshotting supplier_legal_name, supplier_account_last4, gross_face_cents, discount_cents, fee_cents, net_paid_cents and value_date, with delivery_status SENT when Supplier.remittance_email is non-null and BOUNCED otherwise"
          - "writes Invoice.provisional_discount_cents = discount_amount_cents"
          - "increments EarlyPayment.version by 1"
        note: "The two axes both move here, but they are still independent: settlement can subsequently fail while funding stays DEPLOYED until the fail endpoint voids it, and accounting_status is untouched."
      - from: DEPLOYED
        to: RELEASED
        trigger: "POST /early-payments/{id}/settlement/confirm"
        actor: BuyerTreasury
        preconditions:
          - "EarlyPayment.funding_status == DEPLOYED"
          - "EarlyPayment.settlement_status == REMITTED"
          - "the logical clock date is not before EarlyPayment.value_date"
        side_effects:
          - "settlement axis: settlement_status REMITTED -> CONFIRMED"
          - "funding axis: funding_status DEPLOYED -> RELEASED; for FUNDER this decrements Funder.encumbered_capital_cents by net_payment_cents, for BUYER_SELF it decrements Buyer.credit_used_cents by net_payment_cents"
          - "recomputes discount_amount_cents on the VALUE_DATE_BASIS variant and rewrites days_early, funder_fee_cents and net_payment_cents from it"
          - "cascade hop 2: because settlement_status became CONFIRMED, Invoice.status AWARDED -> EARLY_PAID and Invoice.final_discount_cents / discount_true_up_cents are written"
          - "cascade hop 3: because Invoice.status became EARLY_PAID, BuyerProgram.adopted_invoice_count increments and adoption_rate_pct / weighted_avg_accepted_apr_bps / rate_posture are recomputed"
          - "cascade hop 4: because adoption_rate_pct crossed a band boundary and rate_posture left DISCOVERY, BuyerProgram.max_acceptable_apr_bps is rewritten by calculations.rate_optimisation_ceiling"
          - "increments EarlyPayment.version and Invoice.version by 1 each, and BuyerProgram.version by 1"
        note: "The deepest calculation-driven cascade: EarlyPayment -> Invoice -> BuyerProgram counters -> BuyerProgram rate ceiling."
      - from: DEPLOYED
        to: VOID
        trigger: "POST /early-payments/{id}/settlement/fail"
        actor: PlatformOps
        preconditions:
          - "EarlyPayment.funding_status == DEPLOYED"
          - "EarlyPayment.settlement_status == REMITTED"
        side_effects:
          - "settlement axis: settlement_status REMITTED -> FAILED"
          - "funding axis: funding_status DEPLOYED -> VOID; for FUNDER this decrements Funder.encumbered_capital_cents by net_payment_cents, for BUYER_SELF it decrements Buyer.credit_used_cents by net_payment_cents"
          - "compensation: Invoice.face_covered_cents returns to 0 and Invoice.remaining_face_cents returns to face_amount_cents, restoring invariants.invoice_face_conservation"
          - "compensation: Invoice.status stays AWARDED, Invoice.provisional_discount_cents returns to 0, and the DiscountOffer stays ACCEPTED so a replacement payment may be created"
          - "the RemittanceAdvice row is retained unchanged as the audit record of the failed remittance"
          - "increments EarlyPayment.version and Invoice.version by 1 each"
      - from: RESERVED
        to: VOID
        trigger: "POST /early-payments superseding this row on the same offer, or the POST /invoices/{id}/disputes suppression cascade"
        actor: system
        preconditions: ["EarlyPayment.funding_status IN {RESERVED, DEPLOYED}"]
        side_effects:
          - "sets funding_status = VOID, leaving settlement_status and accounting_status untouched"
          - "releases the encumbrance on Funder.encumbered_capital_cents or Buyer.credit_used_cents according to this row's own funding_source"
          - "restores Invoice.face_covered_cents and Invoice.remaining_face_cents"
          - "increments EarlyPayment.version by 1"
      - from: UNCLASSIFIED
        to: TRADE_PAYABLE
        trigger: "POST /early-payments/{id}/accounting-classification with classification=TRADE_PAYABLE"
        actor: BuyerTreasury
        preconditions:
          - "EarlyPayment exists (any funding_status and any settlement_status, including VOID and FAILED)"
          - "when classification != default_accounting_status, override_reason is a non-empty string"
        side_effects:
          - "sets accounting_status = TRADE_PAYABLE and stores override_reason when supplied"
          - "increments EarlyPayment.version by 1"
        note: "Accounting axis; no funding or settlement precondition, which is what makes this dimension independent."
      - from: UNCLASSIFIED
        to: DEBT_RECLASSIFIED
        trigger: "POST /early-payments/{id}/accounting-classification with classification=DEBT_RECLASSIFIED"
        actor: BuyerTreasury
        preconditions: ["same as the UNCLASSIFIED -> TRADE_PAYABLE edge"]
        side_effects:
          - "sets accounting_status = DEBT_RECLASSIFIED and stores override_reason when supplied"
          - "increments EarlyPayment.version by 1"
      - from: TRADE_PAYABLE
        to: DEBT_RECLASSIFIED
        trigger: "POST /early-payments/{id}/accounting-classification with classification=DEBT_RECLASSIFIED"
        actor: BuyerTreasury
        preconditions: ["same as the UNCLASSIFIED -> TRADE_PAYABLE edge"]
        side_effects: ["rewrites accounting_status and override_reason", "increments EarlyPayment.version by 1"]
        note: "Re-classification is permitted without limit; the accounting axis has no terminal state."
      - from: DEBT_RECLASSIFIED
        to: TRADE_PAYABLE
        trigger: "POST /early-payments/{id}/accounting-classification with classification=TRADE_PAYABLE"
        actor: BuyerTreasury
        preconditions: ["same as the UNCLASSIFIED -> TRADE_PAYABLE edge"]
        side_effects: ["rewrites accounting_status and override_reason", "increments EarlyPayment.version by 1"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent entity's `version`)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: offer-create-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /discount-offers"
    occ_field: "expected_invoice_version"
    description: |
      Naming a rate on an Invoice whose version has advanced since the client last read it is
      rejected. This captures the case where another writer has already created an offer on the
      same invoice - that offer legitimately supersedes any earlier NAMED or COUNTERED offer per
      the Invoice OFFERED -> OFFERED self-edge - so the current writer's view of the invoice, and
      therefore of which offer it is superseding, is stale.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412
  - rule_id: payment-create-stale-offer
    parent_entity: DiscountOffer
    write_endpoint: "POST /early-payments"
    occ_field: "expected_offer_version"
    description: |
      Creating an EarlyPayment against a DiscountOffer whose version has advanced since the client
      last read it is rejected. A new EarlyPayment legitimately supersedes a prior RESERVED or
      DEPLOYED payment on the same offer (the buyer is switching funding source before the money
      moves), so a second create with the same observed offer version would silently void a
      reservation the client never saw; the stale-version check makes the outcome deterministic.
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
global_constants:
  DAY_COUNT_BASIS: 360
  SETTLEMENT_LAG_DAYS: 2
  MAX_COUNTER_ROUNDS: 3
  MAX_MICRO_DEPOSIT_ATTEMPTS: 3
  SESSION_COOLDOWN_MINUTES: 60
  ADOPTION_OPTIMISED_PCT: 25.00
  ADOPTION_THROTTLED_PCT: 60.00
  OPTIMISED_FACTOR_PCT: 90
  THROTTLED_FACTOR_PCT: 75
  MIN_FLOOR_APR_BPS: 200
  FUNDER_APR_SPREAD_CAP_BPS: 400
  FUNDER_CAPACITY_BONUS: 150
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
rounding_convention: |
  `round_half_up(x)` means: scale to the target precision, then round a value whose fractional part
  is exactly 0.5 away from zero (2916.5 -> 2917, -2916.5 -> -2917). Every monetary result is an
  integer number of cents; every percentage result carries exactly 2 decimals; every APR result is
  an integer number of basis points.

calculations:
  - name: invoice_face_from_lines
    trigger: "POST /payable-files, once per submitted row, before the row is accepted or rejected"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round per line, THEN sum. The alternative order
      # (sum the pre-tax amounts, then apply a blended rate once) is explicitly
      # NOT the rule and produces a different cent total for the same input.
      face = 0
      for line in invoice_lines sorted by line_no ASC:
          line.line_tax_cents   = round_half_up(line.line_amount_cents * line.tax_rate_bps / 10000)
          line.line_total_cents = line.line_amount_cents + line.line_tax_cents
          face = face + line.line_total_cents
      return face
    input_set: "every InvoiceLine of the row, in line_no ASC order; no line is excluded, and a row with zero lines is rejected with reason EMPTY_LINES before this calculation runs"
    constants: {}
    precision: "integer cents; round_half_up applied once per line and never to the sum"
    worked_example: |
      Lines (33333 @ 875bps), (33333 @ 875bps), (33334 @ 875bps):
        per line: 2917 + 2917 + 2917 tax  ->  36250 + 36250 + 36251 = 108751
        sum-then-round (WRONG order):     ->  100000 + 8750        = 108750
      The pinned order yields 108751.

  - name: days_early
    trigger: "inside calculations.early_payment_discount, at EarlyPayment creation, execution and settlement confirmation"
    algorithm: threshold
    formula: |
      # basis_date depends on the variant selected by early_payment_discount
      return (Invoice.net_due_date.date() - basis_date.date()).days
    input_set: "one Invoice and one EarlyPayment; whole calendar days, no business-day adjustment"
    constants: {}
    precision: "integer days; may be 0 (which fails BuyerProgram.min_days_early) but never negative because requested_pay_date and execution_date are both constrained to be at or before net_due_date"
    variants:
      - name: PAY_DATE_BASIS
        when: "at EarlyPayment creation basis_date = DiscountOffer.requested_pay_date; at execution basis_date = EarlyPayment.execution_date"
        difference: "ignores the two-day settlement lag, so the supplier is charged for the days between the pay instruction and maturity"
      - name: VALUE_DATE_BASIS
        when: "at settlement confirmation basis_date = EarlyPayment.value_date (= execution_date + SETTLEMENT_LAG_DAYS)"
        difference: "charges only for the days the funds were actually out, i.e. SETTLEMENT_LAG_DAYS fewer days than PAY_DATE_BASIS"

  - name: early_payment_discount
    trigger: "POST /early-payments (PAY_DATE_BASIS), POST /early-payments/{id}/execute (PAY_DATE_BASIS), POST /early-payments/{id}/settlement/confirm (VALUE_DATE_BASIS)"
    algorithm: tiered_pricing
    formula: |
      d = calculations.days_early(variant)
      return round_half_up(Invoice.face_amount_cents * EarlyPayment.accepted_apr_bps * d
                           / (10000 * DAY_COUNT_BASIS))
    input_set: "the single Invoice referenced by the EarlyPayment; accepted_apr_bps is the value frozen on the EarlyPayment at creation and is never re-read from the offer"
    constants:
      DAY_COUNT_BASIS: 360
      SETTLEMENT_LAG_DAYS: 2
    precision: "integer cents, round_half_up applied once to the whole product"
    variants:
      - name: PAY_DATE_BASIS
        when: "creation and execution - the value written to EarlyPayment.discount_amount_cents and copied to Invoice.provisional_discount_cents"
        difference: "days_early measured from the pay instruction date"
      - name: VALUE_DATE_BASIS
        when: "settlement confirmation - the value written to Invoice.final_discount_cents"
        difference: "days_early measured from value_date, i.e. SETTLEMENT_LAG_DAYS shorter, so the discount is strictly smaller for any positive APR; the signed gap lands in Invoice.discount_true_up_cents"
    worked_example: |
      face 108751, apr 800bps, net_due_date 2026-09-30, execution_date 2026-08-05:
        PAY_DATE_BASIS   d = 56 -> round_half_up(108751*800*56/3600000) = round_half_up(1353.3457) = 1353
        VALUE_DATE_BASIS d = 54 -> round_half_up(108751*800*54/3600000) = round_half_up(1305.0120) = 1305
        discount_true_up_cents = 1305 - 1353 = -48

  - name: funder_fee
    trigger: "POST /early-payments, POST /early-payments/{id}/execute and POST /early-payments/{id}/settlement/confirm, immediately after early_payment_discount"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER. The tier is keyed on the PRE-FEE net, never on the
      # final net_payment_cents. Keying it on the final net would be circular
      # (fee -> net -> tier -> fee) and, at amounts near a bracket edge, resolves to
      # a different tier and therefore a different fee.
      pre_fee_net_cents = Invoice.face_amount_cents - EarlyPayment.discount_amount_cents
      if EarlyPayment.funding_source == BUYER_SELF:
          return 0
      if   pre_fee_net_cents <  5000000: tier_bps = 45
      elif pre_fee_net_cents < 25000000: tier_bps = 30
      else:                              tier_bps = 18
      effective_bps = tier_bps + Funder.fee_spread_bps
      return round_half_up(pre_fee_net_cents * effective_bps / 10000)
    input_set: "one EarlyPayment plus the Funder selected for it; brackets are half-open [lower, upper)"
    constants:
      FEE_TIER_BPS_UNDER_5M: 45
      FEE_TIER_BPS_5M_TO_25M: 30
      FEE_TIER_BPS_25M_AND_OVER: 18
    precision: "integer cents, round_half_up applied once"
    worked_example: |
      face 25661600, apr 1000bps, d 90 -> discount = 641540, pre_fee_net = 25020060
        pinned order: pre_fee_net 25020060 >= 25000000 -> tier 18 (+0 spread)
                      fee = round_half_up(45036.108) = 45036 ; net = 24975024
        circular order (WRONG): net 24975024 < 25000000 -> tier 30
                      fee = round_half_up(75060.18) = 75060 ; net = 24945000
      The pinned order yields net_payment_cents 24975024.

  - name: net_payment
    trigger: "immediately after calculations.funder_fee on every recomputation of an EarlyPayment"
    algorithm: aggregation
    formula: |
      return Invoice.face_amount_cents
             - EarlyPayment.discount_amount_cents
             - EarlyPayment.funder_fee_cents
    input_set: "one EarlyPayment"
    constants: {}
    precision: "integer cents; no rounding, all three terms are already whole cents"

  - name: funder_selection
    trigger: "inside calculations.funding_source_resolution whenever FUNDER is a candidate source"
    algorithm: weighted_scoring
    formula: |
      projected_value_date = DiscountOffer.requested_pay_date + SETTLEMENT_LAG_DAYS
      pre_fee_net_cents    = Invoice.face_amount_cents - EarlyPayment.discount_amount_cents

      # (a) ELIGIBILITY FILTER - an explicit predicate over entity fields
      eligible = [ f for f in Funder
                   if f.status == ACTIVE
                   and f.min_apr_bps <= EarlyPayment.accepted_apr_bps
                   and f.max_single_invoice_cents >= Invoice.face_amount_cents
                   and committed_at(f, projected_value_date) - f.encumbered_capital_cents
                       >= pre_fee_net_cents ]

      # (b) RANKING EXPRESSION - three inputs, non-linear via min() and a state branch
      def score(f):
          spread_gain = 2 * min(FUNDER_APR_SPREAD_CAP_BPS,
                                EarlyPayment.accepted_apr_bps - f.min_apr_bps)
          fee_drag    = 3 * f.fee_spread_bps
          depth_bonus = FUNDER_CAPACITY_BONUS if (
                            committed_at(f, projected_value_date) - f.encumbered_capital_cents
                            >= 2 * pre_fee_net_cents) else 0
          return spread_gain - fee_drag + depth_bonus

      # (c) TIE-BREAKS, applied in order
      #   1. higher score(f)
      #   2. lower f.fee_spread_bps
      #   3. earlier f.created_at (ASC) - never f.id
      # (d) EMPTY-POOL FALLBACK: return no winner; funding_source_resolution then
      #     raises ERR_NO_ELIGIBLE_FUNDER (422).
      return first of sorted(eligible, key=(-score, fee_spread_bps, created_at))
    input_set: "every Funder row; committed_at(f, d) = sum of FunderCommitment.committed_amount_cents for funder f with status ACTIVE and effective_from <= d <= effective_to"
    constants:
      FUNDER_APR_SPREAD_CAP_BPS: 400
      FUNDER_CAPACITY_BONUS: 150
    precision: "score is an integer; no rounding required"
    worked_example: |
      accepted_apr 900bps, face 1000000, discount 7500, pre_fee_net 992500
        F1 (min_apr 600, spread 30, free capital 60000000): 2*min(400,300)=600 - 90 + 150 = 660
        F2 (min_apr 500, spread 18, free capital  1500000): 2*min(400,400)=800 -  54 +   0 = 746
      F2 wins (746 > 660) even though F1 has far more capital, because the depth bonus
      requires >= 2x the pre-fee net and F1's larger spread costs 3 points per bp.
      F2's fee: tier 45 (pre_fee_net < 5000000) + spread 18 = 63bps
                -> round_half_up(992500*63/10000) = round_half_up(6252.75) = 6253
                -> net_payment_cents = 992500 - 6253 = 986247

  - name: funding_source_resolution
    trigger: "POST /early-payments, after early_payment_discount has produced the provisional discount"
    algorithm: waterfall_allocation
    formula: |
      pre_fee_net_cents = Invoice.face_amount_cents - EarlyPayment.discount_amount_cents
      if   BuyerProgram.funding_policy == SELF_ONLY:        order = [BUYER_SELF]
      elif BuyerProgram.funding_policy == FUNDER_ONLY:      order = [FUNDER]
      else:                                                order = [BUYER_SELF, FUNDER]

      for source in order:                       # strict left-to-right waterfall
          if source == BUYER_SELF:
              if Buyer.self_funding_enabled and (
                     Buyer.credit_used_cents + pre_fee_net_cents <= Buyer.credit_limit_cents):
                  return (BUYER_SELF, funder_id=null)
          else:
              w = calculations.funder_selection()
              if w is not None:
                  return (FUNDER, funder_id=w.id)

      # Fallback: the error is the one belonging to the LAST source in `order`,
      # never the first. SELF_THEN_FUNDER that fails on credit and then finds no
      # eligible funder therefore reports ERR_NO_ELIGIBLE_FUNDER, not
      # ERR_BUYER_CREDIT_LIMIT_EXCEEDED.
      if order[-1] == FUNDER:      raise ERR_NO_ELIGIBLE_FUNDER            # 422
      if not Buyer.self_funding_enabled: raise ERR_SELF_FUNDING_DISABLED   # 409
      raise ERR_BUYER_CREDIT_LIMIT_EXCEEDED                                # 402
    input_set: "one Buyer, one BuyerProgram, one Invoice and the full Funder table"
    constants: {}
    precision: "not numeric; returns an enum plus an optional funder_id"

  - name: buyer_self_funding_utilisation
    trigger: "recomputed in full after every EarlyPayment funding_status change and after every net_payment recomputation"
    algorithm: aggregation
    formula: |
      Buyer.credit_used_cents =
          sum(ep.net_payment_cents
              for ep in EarlyPayment
              if ep.funding_source == BUYER_SELF
              and ep.funding_status IN {RESERVED, DEPLOYED}
              and Invoice[ep.invoice_id].program_id in the buyer's programmes)
    input_set: "EarlyPayment rows with funding_source BUYER_SELF and funding_status IN {RESERVED, DEPLOYED}; RELEASED and VOID rows are excluded, so a settled or voided payment frees the credit"
    constants: {}
    precision: "integer cents; full recompute rather than incremental delta, so no drift is possible"

  - name: funder_available_capital
    trigger: "recomputed after every FunderCommitment create/expire, every EarlyPayment funding_status change and every clock advance"
    algorithm: interval_merge
    formula: |
      def committed_at(f, d):
          # CLOSED interval on both ends: a tranche with effective_to == d still counts.
          return sum(c.committed_amount_cents for c in FunderCommitment
                     if c.funder_id == f.id and c.status == ACTIVE
                     and c.effective_from.date() <= d <= c.effective_to.date())

      Funder.available_capital_cents =
          max(0, committed_at(Funder, logical_clock.date()) - Funder.encumbered_capital_cents)
    input_set: "ACTIVE FunderCommitment rows of one funder covering the logical clock date; EXPIRED tranches are excluded"
    constants: {}
    precision: "integer cents, floored at 0"
    note: "Aggregate-capacity semantics: tranches on one funder may cover the same instant, and the funder's exposure at that instant is their sum, capped by Funder.capital_limit_cents at create time."

  - name: supplier_concentration
    trigger: "checked on POST /discount-offers/{id}/accept (FACE_BASIS) and reported by GET /buyer-programs/{id}/analytics (FUNDED_BASIS)"
    algorithm: aggregation
    formula: |
      # denominator - identical for both variants at the programme level
      denom_face = sum(i.face_amount_cents for i in Invoice
                       if i.program_id == p and i.status IN {ELIGIBLE, OFFERED, AWARDED, EARLY_PAID})

      # FACE_BASIS - committed face already locked to this supplier
      num_face   = sum(i.face_amount_cents for i in Invoice
                       if i.program_id == p and i.supplier_id == s
                       and i.status IN {AWARDED, EARLY_PAID})

      # FUNDED_BASIS - cash actually deployed to this supplier
      num_funded = sum(ep.net_payment_cents for ep in EarlyPayment
                       if Invoice[ep.invoice_id].program_id == p
                       and Invoice[ep.invoice_id].supplier_id == s
                       and ep.funding_status IN {DEPLOYED, RELEASED})
      den_funded = sum(ep.net_payment_cents for ep in EarlyPayment
                       if Invoice[ep.invoice_id].program_id == p
                       and ep.funding_status IN {DEPLOYED, RELEASED})

      pct(num, den) = 0.00 if den == 0 else round_half_up(100 * num / den, 2)

      # acceptance gate - FORWARD-LOOKING: adds the invoice about to be awarded
      projected_pct = pct(num_face + Invoice.face_amount_cents, denom_face)
      reject when projected_pct > BuyerProgram.concentration_cap_pct
    input_set: "FACE_BASIS reads Invoice rows only, filtered by the two status sets above; FUNDED_BASIS reads EarlyPayment rows only, filtered by funding_status IN {DEPLOYED, RELEASED}"
    constants: {}
    precision: "percent with exactly 2 decimals, round_half_up; comparison against concentration_cap_pct uses strict > so a projected share exactly equal to the cap is allowed"
    variants:
      - name: FACE_BASIS
        when: "the acceptance gate on POST /discount-offers/{id}/accept, and the analytics field concentration_top_supplier_face_pct"
        difference: "measures gross invoice face committed to the supplier, so it counts an AWARDED invoice at full face before any cash moves and before any discount or funder fee is deducted"
      - name: FUNDED_BASIS
        when: "the analytics field concentration_top_supplier_funded_pct"
        difference: "measures net cash deployed, so the same portfolio yields a different percentage: discounts and funder fees shrink each supplier's numerator by a different proportion, and AWARDED-but-unexecuted invoices are excluded entirely"

  - name: program_adoption_rate
    trigger: "recomputed at POST /payable-files, POST /buyer-programs/{id}/open, on every Invoice status change, and read by GET /buyer-programs/{id}/analytics"
    algorithm: threshold
    formula: |
      eligible = count(i for i in Invoice if i.program_id == p
                       and i.status IN {ELIGIBLE, OFFERED, AWARDED, EARLY_PAID})
      adopted  = count(i for i in Invoice if i.program_id == p and i.status == EARLY_PAID)

      adoption_rate_pct = 0.00 if eligible == 0 else round_half_up(100 * adopted / eligible, 2)

      if   adoption_rate_pct <  25.00: rate_posture = DISCOVERY
      elif adoption_rate_pct <  60.00: rate_posture = OPTIMISED     # inclusive lower edge
      else:                            rate_posture = THROTTLED     # inclusive lower edge
    input_set: "Invoice rows of one programme; SUPPRESSED and MATURED invoices are excluded from BOTH numerator and denominator, so suppressing an invoice raises the adoption rate of the remainder"
    constants:
      ADOPTION_OPTIMISED_PCT: 25.00
      ADOPTION_THROTTLED_PCT: 60.00
    precision: "percent with exactly 2 decimals, round_half_up; band edges are >= (25.00 is OPTIMISED, 59.99 is OPTIMISED, 60.00 is THROTTLED)"
    note: "The empty-programme edge is pinned: eligible == 0 yields exactly 0.00 and DISCOVERY, never a division error and never null."

  - name: weighted_avg_accepted_apr
    trigger: "recomputed whenever an Invoice of the programme enters or leaves EARLY_PAID"
    algorithm: weighted_scoring
    formula: |
      paid = [i for i in Invoice if i.program_id == p and i.status == EARLY_PAID]
      if not paid: return 0
      return round_half_up(sum(i.accepted_apr_bps * i.face_amount_cents for i in paid)
                           / sum(i.face_amount_cents for i in paid))
    input_set: "Invoice rows with status EARLY_PAID on one programme; face-weighted, therefore order-independent and needing no tie-break"
    constants: {}
    precision: "integer basis points, round_half_up applied once to the quotient"

  - name: rate_optimisation_ceiling
    trigger: "at the end of calculations.program_adoption_rate, whenever rate_posture is recomputed"
    algorithm: threshold
    formula: |
      if rate_posture == DISCOVERY:
          candidate = BuyerProgram.max_acceptable_apr_bps          # unchanged
      elif rate_posture == OPTIMISED:
          candidate = max(MIN_FLOOR_APR_BPS,
                          floor(weighted_avg_accepted_apr_bps * OPTIMISED_FACTOR_PCT / 100))
      else:  # THROTTLED
          candidate = max(MIN_FLOOR_APR_BPS,
                          floor(weighted_avg_accepted_apr_bps * THROTTLED_FACTOR_PCT / 100))
      # MONOTONE: the ceiling never rises again once tightened.
      BuyerProgram.max_acceptable_apr_bps = min(BuyerProgram.max_acceptable_apr_bps, candidate)
    input_set: "one BuyerProgram plus its weighted_avg_accepted_apr_bps"
    constants:
      OPTIMISED_FACTOR_PCT: 90
      THROTTLED_FACTOR_PCT: 75
      MIN_FLOOR_APR_BPS: 200
    precision: "integer basis points; floor (not round) on the factor product"
    worked_example: |
      max_acceptable_apr_bps 1200, one EARLY_PAID invoice at 1000bps, adoption 25.00 -> OPTIMISED
        candidate = max(200, floor(1000*90/100)) = 900 ; min(1200, 900) = 900

  - name: session_clearing_apr
    trigger: "when an AuctionSession reaches CLOSED, by operator close or by the clock sweep"
    algorithm: weighted_scoring
    formula: |
      accepted = [o for o in DiscountOffer if o.session_id == s and o.status == ACCEPTED]
      if not accepted: return 0
      return round_half_up(sum(o.accepted_apr_bps * Invoice[o.invoice_id].face_amount_cents
                               for o in accepted)
                           / sum(Invoice[o.invoice_id].face_amount_cents for o in accepted))
    input_set: "DiscountOffer rows on one session whose status is exactly ACCEPTED at the instant of close; EXPIRED, SUPERSEDED and VOIDED_BY_SUPPRESSION offers are excluded"
    constants: {}
    precision: "integer basis points, round_half_up applied once; 0 when the accepted set is empty"

  - name: accounting_classification_default
    trigger: "POST /early-payments, written to EarlyPayment.default_accounting_status and never recomputed afterwards"
    algorithm: threshold
    formula: |
      if EarlyPayment.funding_source == BUYER_SELF:
          return TRADE_PAYABLE
      if (EarlyPayment.days_early > Buyer.reclass_days_threshold
          or EarlyPayment.accepted_apr_bps > Buyer.reclass_apr_threshold_bps):
          return DEBT_RECLASSIFIED
      return TRADE_PAYABLE
    input_set: "one EarlyPayment plus the Buyer that owns the programme; days_early is the PAY_DATE_BASIS value frozen at creation"
    constants: {}
    precision: "not numeric; both threshold comparisons are strict >, so days_early exactly equal to reclass_days_threshold stays TRADE_PAYABLE"

# ---------------------------------------------------------------------------
# Compensating-action invariants (conserved quantities)
# ---------------------------------------------------------------------------
invariants:
  - name: invoice_face_conservation
    conserved_quantity: "gross invoice face value"
    formula: |
      for every Invoice i:
        i.face_amount_cents == i.remaining_face_cents
                             + sum(ep.face_covered_cents for ep in EarlyPayment
                                   if ep.invoice_id == i.id
                                   and ep.funding_status IN {RESERVED, DEPLOYED, RELEASED})
    forward_action: "POST /early-payments (RESERVED) then POST /early-payments/{id}/execute (DEPLOYED) - face_covered_cents rises to the full face and remaining_face_cents falls to 0"
    compensating_action: "POST /early-payments/{id}/settlement/fail - funding_status leaves the {RESERVED, DEPLOYED, RELEASED} set, so face_covered_cents returns to 0 and remaining_face_cents returns to face_amount_cents"
    drift_check: "after forward + compensating the equality must hold with remaining_face_cents back at its original value; a residual of even 1 cent is a failure"
  - name: funder_capital_conservation
    conserved_quantity: "funder capital pool covering the clock date"
    formula: |
      for every Funder f:
        committed_at(f, logical_clock.date())
            == f.available_capital_cents + f.encumbered_capital_cents
        where f.encumbered_capital_cents == sum(ep.net_payment_cents for ep in EarlyPayment
                                                if ep.funder_id == f.id
                                                and ep.funding_status IN {RESERVED, DEPLOYED})
    forward_action: "POST /early-payments choosing this funder - encumbered_capital_cents rises by net_payment_cents and available_capital_cents falls by the same amount"
    compensating_action: "the POST /invoices/{id}/disputes suppression cascade (funding_status -> VOID) or POST /early-payments/{id}/settlement/fail - encumbered_capital_cents falls back and available_capital_cents is restored"
    drift_check: "the sum available + encumbered must equal committed_at(f, clock) both before the forward action and after the compensating action; the execute-time discount recomputation must adjust encumbrance by exactly the net_payment delta or the sum drifts"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of {BuyerAdmin, BuyerTreasury, Supplier, Funder, PlatformOps}, and X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the role in X-User-Role appears in the endpoint's roles list; on POST /discount-offers/{id}/accept the permitted role additionally depends on the offer's current status (Supplier may accept a COUNTERED offer, BuyerAdmin may accept a NAMED offer, and neither may accept the other's)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request shape: every required body field present, types correct, enum values in range, integers non-negative where declared, ISO-8601 timestamps parseable, and every declared window has its start strictly before its end - evaluated before any database lookup"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "every path parameter resolves to a live row, validated left-to-right along the path; the first unresolved segment decides the error id (ERR_BUYER_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_SUPPLIER_NOT_FOUND, ERR_BANK_ACCOUNT_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_OFFER_NOT_FOUND, ERR_FUNDER_NOT_FOUND, ERR_EARLY_PAYMENT_NOT_FOUND)"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: existence
    check: "resource scope: when X-User-Role is Supplier, X-User-ID must equal the supplier_id on the addressed Supplier, BankAccount, Invoice, DiscountOffer or EarlyPayment; when it is Funder, X-User-ID must equal the addressed Funder.id or the funder_id on the addressed EarlyPayment; when it is BuyerAdmin or BuyerTreasury, X-User-ID must equal the buyer_id reachable from the addressed BuyerProgram, AuctionSession, ApprovedPayableFile, Invoice, Dispute, DiscountOffer or EarlyPayment. The scope test is only meaningful once the row exists, so it is evaluated AFTER the addressed id has resolved: an id that resolves to no row is the 404 of priority 4 or priority 6, never this 403"
    error_id: ERR_FORBIDDEN_RESOURCE_SCOPE
    http_status: 403
    applies_to: "every endpoint that addresses a scoped resource by path parameter or body foreign key"
  - priority: 6
    category: existence
    check: "every top-level foreign key supplied in the request body resolves to a live row (program_id, session_id, supplier_id, bank_account_id, invoice_id, offer_id, funder_id); reported with the same not-found error ids as priority 4. A supplier_id nested inside a POST /payable-files row is NOT covered here: an unresolvable row-level supplier_id is a row-level rejection with reason SUPPLIER_UNKNOWN, never a 404"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "POST /buyer-programs, POST /auction-sessions, POST /payable-files, POST /discount-offers, POST /early-payments, POST /funders/{id}/commitments"
  - priority: 7
    category: business_referential
    check: "the target Invoice is not suppressed: Invoice.status != SUPPRESSED and no Dispute on it holds status OPEN. Checked AHEAD of the generic invoice-state check (priority 11) on purpose - a SUPPRESSED invoice state is a derived consequence of an OPEN dispute, so the dispute-specific error is the actionable one and must win over ERR_INVALID_STATE"
    error_id: ERR_INVOICE_DISPUTE_SUPPRESSED
    http_status: 409
    applies_to: "POST /discount-offers, POST /discount-offers/{id}/counter, POST /discount-offers/{id}/rename, POST /discount-offers/{id}/accept, POST /early-payments"
  - priority: 8
    category: state
    check: "the BuyerProgram governing the request holds status == OPEN; DRAFT, PAUSED and CLOSED all reject"
    error_id: ERR_PROGRAM_NOT_OPEN
    http_status: 409
    applies_to: "POST /auction-sessions, POST /payable-files, POST /discount-offers, POST /discount-offers/{id}/counter, POST /discount-offers/{id}/rename, POST /discount-offers/{id}/accept, POST /early-payments"
  - priority: 9
    category: state
    check: "the AuctionSession referenced by the request holds status == LIVE and the logical clock is inside [opens_at, closes_at)"
    error_id: ERR_SESSION_NOT_LIVE
    http_status: 409
    applies_to: "POST /discount-offers, POST /discount-offers/{id}/counter, POST /discount-offers/{id}/rename"
  - priority: 10
    category: state
    check: "the addressed resource is not already in a terminal state for the axis this operation writes (DiscountOffer in ACCEPTED/EXPIRED/SUPERSEDED/VOIDED_BY_SUPPRESSION, Dispute in WITHDRAWN/RESOLVED_UPHELD/RESOLVED_REJECTED, EarlyPayment with funding_status VOID or settlement_status CONFIRMED/FAILED, BankAccount in VERIFIED/FAILED/REPLACED, AuctionSession in CLOSED/CANCELLED, BuyerProgram in CLOSED); a repeated trigger on a terminal resource is therefore idempotency-hostile and reports this error"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 11
    category: state
    check: "the addressed resource satisfies the §1.2 preconditions of the requested transition (non-terminal but wrong source state, or a fork-join precondition such as Supplier.idv_status == PASSED not yet met); the SUPPRESSED-invoice case is excluded here because priority 7 already owns it"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 12
    category: state
    check: "expected_invoice_version equals the current Invoice.version of the invoice named in the body"
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412
    applies_to: "POST /discount-offers"
  - priority: 13
    category: state
    check: "expected_offer_version equals the current DiscountOffer.version of the offer named in the body"
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
    applies_to: "POST /early-payments"
  - priority: 14
    category: business_safety
    check: "the Supplier that owns the invoice has sanctions_hold == false. A supplier under a compliance hold is also, necessarily, not ACTIVE - so this rule and priority 15 fire together, and the compliance cause must be the one reported"
    error_id: ERR_SUPPLIER_SANCTIONS_HOLD
    http_status: 403
    applies_to: "POST /suppliers/{id}/onboarding/submit, POST /suppliers/{id}/bank-accounts, POST /discount-offers, POST /discount-offers/{id}/counter, POST /discount-offers/{id}/rename, POST /discount-offers/{id}/accept, POST /early-payments, POST /early-payments/{id}/execute"
  - priority: 15
    category: business_referential
    check: "the Supplier that owns the invoice has onboarding_status == ACTIVE, bank_status == VERIFIED and a non-null payment_ready_at"
    error_id: ERR_SUPPLIER_NOT_PAYMENT_READY
    http_status: 409
    applies_to: "POST /discount-offers, POST /discount-offers/{id}/accept, POST /early-payments, POST /early-payments/{id}/execute"
  - priority: 16
    category: business_temporal
    check: "the logical clock is strictly before DiscountOffer.acceptance_deadline (half-open window: an instant exactly equal to the deadline is already closed)"
    error_id: ERR_ACCEPTANCE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /discount-offers/{id}/accept"
  - priority: 17
    category: business_temporal
    check: "the requested [opens_at, closes_at) window neither overlaps, nor falls within SESSION_COOLDOWN_MINUTES (60) of, any AuctionSession on the same programme whose status is SCHEDULED or LIVE. Exclusive occupancy with a buffer: conflict when new.opens_at < existing.closes_at + 60min AND existing.opens_at < new.closes_at + 60min. Abutting windows (new.opens_at == existing.closes_at) therefore still conflict, and a 60-minute gap exactly equal to the cooldown does NOT conflict"
    error_id: ERR_SESSION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /auction-sessions"
  - priority: 18
    category: business_constraint
    check: "the declared control totals of the payable file match the accepted rows: declared_row_count == accepted_row_count and declared_total_cents == computed_total_cents, where computed_total_cents is the sum of the accepted rows calculated face_amount_cents. Rows rejected for row-level reasons are excluded from both sides, so a file whose rejected rows are exactly the difference still passes"
    error_id: ERR_FILE_TOTALS_MISMATCH
    http_status: 422
    applies_to: "POST /payable-files"
  - priority: 19
    category: business_constraint
    check: "the APR being named, countered or accepted lies within [MIN_FLOOR_APR_BPS (200), BuyerProgram.max_acceptable_apr_bps] inclusive. Re-checked at acceptance against the CURRENT programme bounds, which calculations.rate_optimisation_ceiling may have tightened after the offer was named"
    error_id: ERR_APR_OUT_OF_PROGRAM_BOUNDS
    http_status: 422
    applies_to: "POST /discount-offers, POST /discount-offers/{id}/counter, POST /discount-offers/{id}/rename, POST /discount-offers/{id}/accept"
  - priority: 20
    category: business_constraint
    check: "days_early computed on PAY_DATE_BASIS is >= BuyerProgram.min_days_early, and the pay date is not after Invoice.net_due_date"
    error_id: ERR_INSUFFICIENT_DAYS_EARLY
    http_status: 422
    applies_to: "POST /discount-offers, POST /early-payments, POST /early-payments/{id}/execute"
  - priority: 21
    category: business_constraint
    check: "DiscountOffer.counter_round is strictly below MAX_COUNTER_ROUNDS (3) before a counter is recorded"
    error_id: ERR_COUNTER_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /discount-offers/{id}/counter"
  - priority: 22
    category: business_constraint
    check: "BankAccount.micro_deposit_attempts is strictly below MAX_MICRO_DEPOSIT_ATTEMPTS (3) before a confirmation code is evaluated"
    error_id: ERR_MICRO_DEPOSIT_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /bank-accounts/{id}/micro-deposit/confirm"
  - priority: 23
    category: business_constraint
    check: "when the requested accounting classification differs from EarlyPayment.default_accounting_status, override_reason is present and non-empty after trimming"
    error_id: ERR_RECLASS_OVERRIDE_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /early-payments/{id}/accounting-classification"
  - priority: 24
    category: business_constraint
    check: "when calculations.funding_source_resolution lands on BUYER_SELF as the only candidate, Buyer.self_funding_enabled is true"
    error_id: ERR_SELF_FUNDING_DISABLED
    http_status: 409
    applies_to: "POST /early-payments"
  - priority: 25
    category: business_constraint
    check: "the forward-looking FACE_BASIS supplier share, including the invoice about to be awarded, is not strictly greater than BuyerProgram.concentration_cap_pct; a projected share exactly equal to the cap passes"
    error_id: ERR_CONCENTRATION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /discount-offers/{id}/accept"
  - priority: 26
    category: business_fiscal
    check: "aggregate capacity over closed intervals: for the new tranche, at every instant t in [effective_from, effective_to] taken from the set {new.effective_from} union {existing boundary points inside the new interval}, committed_at(funder, t) + new.committed_amount_cents must be <= Funder.capital_limit_cents. Overlap alone is legal - only the summed exposure at an instant can fail"
    error_id: ERR_FUNDER_CAPITAL_OVERCOMMITTED
    http_status: 409
    applies_to: "POST /funders/{id}/commitments"
  - priority: 27
    category: business_fiscal
    check: "calculations.funder_selection returned a winner when FUNDER is the last candidate source in the waterfall"
    error_id: ERR_NO_ELIGIBLE_FUNDER
    http_status: 422
    applies_to: "POST /early-payments"
  - priority: 28
    category: business_fiscal
    check: "Buyer.credit_used_cents + pre_fee_net_cents <= Buyer.credit_limit_cents when the resolved funding source is BUYER_SELF; exact equality is allowed"
    error_id: ERR_BUYER_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /early-payments, POST /early-payments/{id}/execute"

validation_priority_pairs:
  - pair_id: program-state-beats-credit-capacity
    higher: {priority: 8, category: state, error_id: ERR_PROGRAM_NOT_OPEN}
    lower: {priority: 28, category: business_fiscal, error_id: ERR_BUYER_CREDIT_LIMIT_EXCEEDED}
    single_request_that_violates_both: "POST /early-payments on an accepted offer whose programme has since been PAUSED, for a self-funding buyer whose remaining headroom is smaller than the pre-fee net"
    expected_error_id: ERR_PROGRAM_NOT_OPEN
  - pair_id: sanctions-beats-payment-readiness
    higher: {priority: 14, category: business_safety, error_id: ERR_SUPPLIER_SANCTIONS_HOLD}
    lower: {priority: 15, category: business_referential, error_id: ERR_SUPPLIER_NOT_PAYMENT_READY}
    single_request_that_violates_both: "POST /discount-offers for a supplier whose sanctions_hold is true, which also forced onboarding_status to SUSPENDED and therefore fails the payment-readiness check"
    expected_error_id: ERR_SUPPLIER_SANCTIONS_HOLD
  - pair_id: acceptance-window-beats-apr-bounds
    higher: {priority: 16, category: business_temporal, error_id: ERR_ACCEPTANCE_WINDOW_CLOSED}
    lower: {priority: 19, category: business_constraint, error_id: ERR_APR_OUT_OF_PROGRAM_BOUNDS}
    single_request_that_violates_both: "POST /discount-offers/{id}/accept after the clock passes acceptance_deadline on an offer whose named APR now sits above the programme ceiling tightened by rate_optimisation_ceiling"
    expected_error_id: ERR_ACCEPTANCE_WINDOW_CLOSED

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table  (api_prefix is "", so every path below is absolute)
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/buyers"
    description: "Register a buyer (the corporate obligor whose approved payables fund the programme)."
    roles: [PlatformOps]
    code: 201
    input: [legal_name, tax_id, credit_limit_cents, "self_funding_enabled?", "reclass_days_threshold?", "reclass_apr_threshold_bps?"]
    output: Buyer
    side_effects: ["creates the Buyer in status ACTIVE with credit_used_cents = 0"]
  - method: GET
    path: "/buyers/{id}"
    description: "Read one buyer including live self-funding credit utilisation."
    roles: [PlatformOps, BuyerAdmin, BuyerTreasury]
    code: 200
    input: []
    output: Buyer
    side_effects: []
  - method: GET
    path: "/buyers/{id}/programs"
    description: "List the discounting programmes of one buyer (reverse lookup for BuyerProgram.buyer_id)."
    roles: [PlatformOps, BuyerAdmin, BuyerTreasury]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BuyerProgram[]
    side_effects: []
  - method: POST
    path: "/buyer-programs"
    description: "Create a dynamic-discounting programme in DRAFT. program_type is SUPPLIER_NAMED (suppliers name their own rate) or FIXED_RATE (fixed_apr_bps is mandatory and every offer must match it)."
    roles: [BuyerAdmin]
    code: 201
    input: [buyer_id, name, program_type, max_acceptable_apr_bps, "fixed_apr_bps?", "min_days_early?", "concentration_cap_pct?", "funding_policy?"]
    output: BuyerProgram
    side_effects: ["creates the BuyerProgram in status DRAFT with all analytics counters at 0, adoption_rate_pct 0.00 and rate_posture DISCOVERY"]
  - method: GET
    path: "/buyer-programs/{id}"
    description: "Read one programme including its current APR ceiling and rate posture."
    roles: [BuyerAdmin, BuyerTreasury, PlatformOps]
    code: 200
    input: []
    output: BuyerProgram
    side_effects: []
  - method: POST
    path: "/buyer-programs/{id}/open"
    description: "Open a DRAFT programme for offers."
    roles: [BuyerAdmin]
    code: 200
    input: []
    output: BuyerProgram
    side_effects: ["drives the BuyerProgram DRAFT -> OPEN edge", "runs calculations.program_adoption_rate and calculations.rate_optimisation_ceiling"]
  - method: POST
    path: "/buyer-programs/{id}/status"
    description: "Change programme lifecycle state. action is PAUSE (OPEN -> PAUSED), RESUME (PAUSED -> OPEN) or CLOSE (OPEN or PAUSED -> CLOSED)."
    roles: [BuyerAdmin]
    code: 200
    input: [action]
    output: BuyerProgram
    side_effects: ["drives the matching BuyerProgram edge", "on CLOSE cascades SCHEDULED/LIVE sessions to CANCELLED and their NAMED/COUNTERED offers to EXPIRED", "on CLOSE may cascade Buyer.status to SUSPENDED when no DRAFT/OPEN/PAUSED programme of that buyer remains"]
  - method: GET
    path: "/buyer-programs/{id}/analytics"
    description: "Programme adoption and rate-optimisation read model. Returns eligible_invoice_count, adopted_invoice_count, adoption_rate_pct, rate_posture, weighted_avg_accepted_apr_bps, max_acceptable_apr_bps, concentration_top_supplier_face_pct, concentration_top_supplier_funded_pct and concentration_cap_pct."
    roles: [BuyerAdmin, BuyerTreasury, PlatformOps]
    code: 200
    input: []
    output: ProgramAnalytics
    side_effects: ["reads calculations.program_adoption_rate, calculations.weighted_avg_accepted_apr and both variants of calculations.supplier_concentration; writes nothing"]
  - method: GET
    path: "/buyer-programs/{id}/auction-sessions"
    description: "List the auction windows of one programme (reverse lookup for AuctionSession.program_id)."
    roles: [BuyerAdmin, BuyerTreasury, Supplier, PlatformOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AuctionSession[]
    side_effects: []
  - method: GET
    path: "/buyer-programs/{id}/payable-files"
    description: "List the approved-payables files ingested into one programme (reverse lookup for ApprovedPayableFile.program_id)."
    roles: [BuyerAdmin, BuyerTreasury, PlatformOps]
    code: 200
    input: ["ingest_status?", "limit?", "offset?"]
    output: ApprovedPayableFile[]
    side_effects: []
  - method: POST
    path: "/auction-sessions"
    description: "Schedule an auction window on an OPEN programme. Windows are exclusive and half-open [opens_at, closes_at) with a mandatory 60-minute cooldown between consecutive windows on the same programme."
    roles: [BuyerAdmin]
    code: 201
    input: [program_id, opens_at, closes_at]
    output: AuctionSession
    side_effects: ["creates the AuctionSession in status SCHEDULED", "enforces validation priority 17 (ERR_SESSION_WINDOW_CONFLICT)"]
  - method: POST
    path: "/auction-sessions/{id}/close"
    description: "Close an auction window early. mode=SETTLE moves LIVE -> CLOSED and stamps clearing_apr_bps; mode=CANCEL moves SCHEDULED or LIVE -> CANCELLED."
    roles: [BuyerAdmin]
    code: 200
    input: [mode]
    output: AuctionSession
    side_effects: ["drives the AuctionSession close or cancel edge", "cascades every NAMED/COUNTERED offer on the session to EXPIRED in created_at ASC order", "on SETTLE runs calculations.session_clearing_apr"]
  - method: POST
    path: "/suppliers"
    description: "Register a supplier in DRAFT, before identity verification."
    roles: [PlatformOps]
    code: 201
    input: [legal_name, tax_id_last4, "remittance_email?"]
    output: Supplier
    side_effects: ["creates the Supplier with onboarding_status DRAFT, idv_status NOT_STARTED, bank_status NOT_STARTED and sanctions_hold false"]
  - method: GET
    path: "/suppliers/{id}"
    description: "Read one supplier including both onboarding axes and the compliance flag."
    roles: [PlatformOps, Supplier, BuyerAdmin, BuyerTreasury]
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - method: POST
    path: "/suppliers/{id}/onboarding/submit"
    description: "Submit onboarding, moving DRAFT -> VERIFYING and forking the identity and bank verification axes."
    roles: [Supplier, PlatformOps]
    code: 200
    input: []
    output: Supplier
    side_effects: ["drives the Supplier DRAFT -> VERIFYING edge and sets idv_status = PENDING"]
  - method: POST
    path: "/suppliers/{id}/idv/adjudicate"
    description: "Record the identity-verification outcome. decision is PASSED, MANUAL_REVIEW or FAILED."
    roles: [PlatformOps]
    code: 200
    input: [decision, "identity_score?"]
    output: Supplier
    side_effects: ["writes idv_status, identity_score and idv_verified_at", "evaluates the fork-join: when idv_status == PASSED and bank_status == VERIFIED the supplier becomes ACTIVE and payment_ready_at is stamped"]
  - method: POST
    path: "/suppliers/{id}/sanctions-hold"
    description: "Place or lift a compliance hold. hold=true forces onboarding_status to SUSPENDED; hold=false returns the supplier to ACTIVE when both onboarding axes are still complete, otherwise to VERIFYING."
    roles: [PlatformOps]
    code: 200
    input: [hold]
    output: Supplier
    side_effects: ["writes sanctions_hold and drives the matching Supplier edge"]
  - method: POST
    path: "/suppliers/{id}/bank-accounts"
    description: "Add a settlement bank account and start micro-deposit verification. Any earlier account of the same supplier in status FAILED becomes REPLACED."
    roles: [Supplier, PlatformOps]
    code: 201
    input: [routing_number, account_last4]
    output: BankAccount
    side_effects: ["creates the BankAccount in status MICRO_DEPOSIT_SENT with micro_deposit_attempts 0", "sets Supplier.bank_status = MICRO_DEPOSIT_SENT", "cascades any FAILED account of this supplier to REPLACED"]
  - method: GET
    path: "/suppliers/{id}/bank-accounts"
    description: "List the bank accounts of one supplier (reverse lookup for BankAccount.supplier_id)."
    roles: [Supplier, PlatformOps, BuyerTreasury]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BankAccount[]
    side_effects: []
  - method: POST
    path: "/bank-accounts/{id}/micro-deposit/confirm"
    description: "Confirm the micro-deposit code. A correct code verifies the account; a wrong code with attempts remaining stays in MICRO_DEPOSIT_SENT (the retry self-edge); the third wrong code fails the account."
    roles: [Supplier, PlatformOps]
    code: 200
    input: [code]
    output: BankAccount
    side_effects: ["increments micro_deposit_attempts", "drives the BankAccount verify / retry / fail edge", "mirrors the outcome to Supplier.bank_status and verified_account_last4", "evaluates the supplier fork-join on success"]
  - method: POST
    path: "/payable-files"
    description: "Ingest an approved-payables file. rows is an array of {invoice_number, approval_date, net_due_date, supplier_id, suppression_flag?, lines:[{line_no, line_amount_cents, tax_rate_bps}]}. Each row is validated and priced independently; the file's control totals are then reconciled against the accepted rows only."
    roles: [BuyerAdmin]
    code: 201
    input: [program_id, filename, declared_row_count, declared_total_cents, rows]
    output: ApprovedPayableFile
    side_effects: ["creates one Invoice plus its InvoiceLine rows per accepted row and runs calculations.invoice_face_from_lines for each", "rows carrying suppression_flag = true land in Invoice status SUPPRESSED and auto-raise a Dispute with reason_code BUYER_FILE_SUPPRESSION", "sets ingest_status to ACCEPTED, PARTIALLY_ACCEPTED or REJECTED and records rejection_reasons", "runs calculations.program_adoption_rate for the programme", "enforces validation priority 18 (ERR_FILE_TOTALS_MISMATCH)"]
  - method: GET
    path: "/invoices"
    description: "List invoices filtered by file, programme, supplier or status (reverse lookup for Invoice.file_id, Invoice.program_id and Invoice.supplier_id)."
    roles: [BuyerAdmin, BuyerTreasury, Supplier, PlatformOps]
    code: 200
    input: ["file_id?", "program_id?", "supplier_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Read one invoice including the face ledger and both discount variants."
    roles: [BuyerAdmin, BuyerTreasury, Supplier, PlatformOps]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices/{id}/lines"
    description: "List the priced lines of one invoice (reverse lookup for InvoiceLine.invoice_id)."
    roles: [BuyerAdmin, BuyerTreasury, Supplier, PlatformOps]
    code: 200
    input: []
    output: InvoiceLine[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/disputes"
    description: "Raise a dispute on an invoice. reason_code is BUYER_FILE_SUPPRESSION, QUANTITY_SHORT, PRICE_VARIANCE or GOODS_REJECTED."
    roles: [BuyerAdmin, PlatformOps]
    code: 201
    input: [reason_code, disputed_amount_cents, "resolution_note?"]
    output: Dispute
    side_effects: ["creates the Dispute in status OPEN", "cascade hop 1: sets Invoice.dispute_suppressed = true and Invoice.status = SUPPRESSED", "cascade hop 2: every DiscountOffer on the invoice in NAMED/COUNTERED/ACCEPTED becomes VOIDED_BY_SUPPRESSION in created_at ASC order", "cascade hop 3: every EarlyPayment on those offers with funding_status IN {RESERVED, DEPLOYED} becomes VOID, releasing funder encumbrance or buyer credit", "cascade hop 4: Invoice.face_covered_cents and remaining_face_cents are restored and calculations.program_adoption_rate is recomputed"]
  - method: GET
    path: "/invoices/{id}/disputes"
    description: "List the disputes raised on one invoice (reverse lookup for Dispute.invoice_id)."
    roles: [BuyerAdmin, BuyerTreasury, Supplier, PlatformOps]
    code: 200
    input: ["status?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "Resolve an OPEN dispute. resolution is WITHDRAWN or REJECTED (the invoice returns to ELIGIBLE once no OPEN dispute remains) or UPHELD (the invoice is written off to MATURED)."
    roles: [BuyerAdmin, PlatformOps]
    code: 200
    input: [resolution, "resolution_note?"]
    output: Dispute
    side_effects: ["drives the matching Dispute edge", "drives the Invoice SUPPRESSED -> ELIGIBLE revert edge when no other OPEN dispute remains, or SUPPRESSED -> MATURED on UPHELD", "recomputes calculations.program_adoption_rate"]
  - method: POST
    path: "/discount-offers"
    description: "Name a discount rate on an eligible invoice inside a LIVE auction session. Requires expected_invoice_version; a newer offer supersedes any NAMED or COUNTERED offer already on the invoice."
    roles: [Supplier]
    code: 201
    input: [invoice_id, session_id, offered_apr_bps, requested_pay_date, acceptance_deadline, expected_invoice_version]
    output: DiscountOffer
    side_effects: ["creates the DiscountOffer in status NAMED with counter_round 0", "supersedes prior NAMED/COUNTERED offers on the same invoice in created_at ASC order", "drives the Invoice ELIGIBLE -> OFFERED edge, or the OFFERED -> OFFERED self-edge when the invoice was already offered", "increments Invoice.version by 1", "increments AuctionSession.named_offer_count"]
  - method: GET
    path: "/discount-offers"
    description: "List offers filtered by invoice, session, supplier or status (reverse lookup for DiscountOffer.invoice_id, DiscountOffer.session_id and DiscountOffer.supplier_id)."
    roles: [BuyerAdmin, BuyerTreasury, Supplier, PlatformOps]
    code: 200
    input: ["invoice_id?", "session_id?", "supplier_id?", "status?", "limit?", "offset?"]
    output: DiscountOffer[]
    side_effects: []
  - method: GET
    path: "/discount-offers/{id}"
    description: "Read one offer including its negotiation round counter and acceptance window."
    roles: [BuyerAdmin, BuyerTreasury, Supplier, PlatformOps]
    code: 200
    input: []
    output: DiscountOffer
    side_effects: []
  - method: POST
    path: "/discount-offers/{id}/counter"
    description: "Buyer counters a NAMED offer with a different APR, moving the offer to COUNTERED. Permitted only while counter_round is below MAX_COUNTER_ROUNDS (3)."
    roles: [BuyerAdmin]
    code: 200
    input: [counter_apr_bps]
    output: DiscountOffer
    side_effects: ["drives the DiscountOffer NAMED -> COUNTERED edge and stores counter_apr_bps", "increments DiscountOffer.version by 1"]
  - method: POST
    path: "/discount-offers/{id}/rename"
    description: "Supplier re-names its rate on a COUNTERED offer, closing one negotiation cycle and returning the offer to NAMED."
    roles: [Supplier]
    code: 200
    input: [offered_apr_bps, "requested_pay_date?"]
    output: DiscountOffer
    side_effects: ["drives the DiscountOffer COUNTERED -> NAMED edge", "increments counter_round by 1 and clears counter_apr_bps", "increments DiscountOffer.version by 1"]
  - method: POST
    path: "/discount-offers/{id}/accept"
    description: "Accept an offer, awarding the invoice. From NAMED only BuyerAdmin may accept (locking offered_apr_bps); from COUNTERED only Supplier may accept (locking counter_apr_bps). The acceptance window is half-open, so an instant exactly equal to acceptance_deadline is closed."
    roles: [BuyerAdmin, Supplier]
    code: 200
    input: []
    output: DiscountOffer
    side_effects: ["drives the matching DiscountOffer accept edge and stamps accepted_apr_bps and accepted_at", "drives the Invoice OFFERED -> AWARDED edge and copies accepted_apr_bps onto the invoice", "enforces validation priority 25 (ERR_CONCENTRATION_CAP_EXCEEDED) using the forward-looking FACE_BASIS share", "increments DiscountOffer.version by 1"]
  - method: POST
    path: "/funders"
    description: "Register a third-party funder with its capital ceiling, minimum acceptable APR, fee spread and per-invoice cap."
    roles: [PlatformOps]
    code: 201
    input: [legal_name, capital_limit_cents, min_apr_bps, fee_spread_bps, max_single_invoice_cents]
    output: Funder
    side_effects: ["creates the Funder in status ACTIVE with encumbered_capital_cents 0 and available_capital_cents 0 (no tranche committed yet)"]
  - method: GET
    path: "/funders/{id}"
    description: "Read one funder including live available and encumbered capital."
    roles: [PlatformOps, Funder, BuyerTreasury]
    code: 200
    input: []
    output: Funder
    side_effects: []
  - method: POST
    path: "/funders/{id}/pause"
    description: "Change funder participation. action is PAUSE (ACTIVE -> PAUSED), RESUME (PAUSED -> ACTIVE) or WITHDRAW (ACTIVE or PAUSED -> WITHDRAWN)."
    roles: [PlatformOps, Funder]
    code: 200
    input: [action]
    output: Funder
    side_effects: ["drives the matching Funder edge", "on WITHDRAW cascades every ACTIVE FunderCommitment of this funder to EXPIRED and recomputes available capital"]
  - method: POST
    path: "/funders/{id}/commitments"
    description: "Commit a capital tranche over a closed interval [effective_from, effective_to]. Tranches may overlap; only the summed exposure at an instant is capped by capital_limit_cents."
    roles: [Funder, PlatformOps]
    code: 201
    input: [committed_amount_cents, effective_from, effective_to]
    output: FunderCommitment
    side_effects: ["creates the FunderCommitment in status ACTIVE", "runs calculations.funder_available_capital", "enforces validation priority 26 (ERR_FUNDER_CAPITAL_OVERCOMMITTED)"]
  - method: GET
    path: "/funders/{id}/commitments"
    description: "List the capital tranches of one funder (reverse lookup for FunderCommitment.funder_id)."
    roles: [Funder, PlatformOps, BuyerTreasury]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FunderCommitment[]
    side_effects: []
  - method: POST
    path: "/early-payments"
    description: "Reserve an early payment against an ACCEPTED offer. Requires expected_offer_version. The funding source is resolved by the programme's funding_policy waterfall and, when a funder is used, by the funder selector; a new reservation supersedes any prior RESERVED or DEPLOYED payment on the same offer."
    roles: [BuyerTreasury]
    code: 201
    input: [offer_id, expected_offer_version]
    output: EarlyPayment
    side_effects: ["creates the EarlyPayment with funding_status RESERVED, settlement_status UNSENT and accounting_status UNCLASSIFIED", "runs calculations.early_payment_discount on PAY_DATE_BASIS, then funder_fee, then net_payment", "runs calculations.funding_source_resolution and, if needed, funder_selection", "runs calculations.accounting_classification_default", "encumbers funder capital or buyer self-funding credit", "sets Invoice.face_covered_cents and remaining_face_cents", "voids any prior RESERVED/DEPLOYED EarlyPayment on the same offer and releases its encumbrance", "increments DiscountOffer.version by 1"]
  - method: GET
    path: "/early-payments"
    description: "List early payments filtered by offer, invoice, funder or either status axis (reverse lookup for EarlyPayment.offer_id, EarlyPayment.invoice_id and EarlyPayment.funder_id)."
    roles: [BuyerAdmin, BuyerTreasury, Supplier, Funder, PlatformOps]
    code: 200
    input: ["offer_id?", "invoice_id?", "funder_id?", "funding_status?", "settlement_status?", "limit?", "offset?"]
    output: EarlyPayment[]
    side_effects: []
  - method: GET
    path: "/early-payments/{id}"
    description: "Read one early payment including all three state axes and the full cash breakdown."
    roles: [BuyerAdmin, BuyerTreasury, Supplier, Funder, PlatformOps]
    code: 200
    input: []
    output: EarlyPayment
    side_effects: []
  - method: POST
    path: "/early-payments/{id}/execute"
    description: "Execute the payment instruction. execution_date is always the logical clock date at the moment of this call (never client-supplied); value_date is execution_date + SETTLEMENT_LAG_DAYS (2). Move the clock with POST /_clock/set_current_utc to choose the execution date."
    roles: [BuyerTreasury]
    code: 200
    input: []
    output: EarlyPayment
    side_effects: ["drives the EarlyPayment funding_status RESERVED -> DEPLOYED edge and settlement_status UNSENT -> REMITTED edge", "recomputes calculations.early_payment_discount on PAY_DATE_BASIS with the real execution_date, then funder_fee and net_payment, and adjusts encumbrance by the net delta", "stamps execution_date, value_date and days_early", "creates the RemittanceAdvice row with delivery_status SENT when Supplier.remittance_email is non-null and BOUNCED otherwise", "increments EarlyPayment.version by 1"]
  - method: POST
    path: "/early-payments/{id}/settlement/confirm"
    description: "Confirm settlement on the value date. Switches the discount to VALUE_DATE_BASIS and books the true-up."
    roles: [BuyerTreasury, PlatformOps]
    code: 200
    input: []
    output: EarlyPayment
    side_effects: ["drives settlement_status REMITTED -> CONFIRMED and funding_status DEPLOYED -> RELEASED", "recomputes calculations.early_payment_discount on VALUE_DATE_BASIS and writes Invoice.final_discount_cents and Invoice.discount_true_up_cents", "drives the Invoice AWARDED -> EARLY_PAID edge", "releases funder encumbrance or buyer credit", "recomputes calculations.program_adoption_rate, weighted_avg_accepted_apr and rate_optimisation_ceiling", "leaves the RemittanceAdvice row untouched - it was raised and delivered at execution time", "increments EarlyPayment.version by 1"]
  - method: POST
    path: "/early-payments/{id}/settlement/fail"
    description: "Record a failed settlement (returned payment). This is the compensating action for both conserved quantities."
    roles: [BuyerTreasury, PlatformOps]
    code: 200
    input: [failure_reason]
    output: EarlyPayment
    side_effects: ["drives settlement_status REMITTED -> FAILED and funding_status DEPLOYED -> VOID", "restores Invoice.face_covered_cents to 0 and remaining_face_cents to face_amount_cents", "releases funder encumbrance or buyer self-funding credit in full", "returns the Invoice to AWARDED so a new reservation is possible", "increments EarlyPayment.version by 1"]
  - method: POST
    path: "/early-payments/{id}/accounting-classification"
    description: "Record the trade-payable versus debt classification. classification is TRADE_PAYABLE or DEBT_RECLASSIFIED; any value differing from default_accounting_status requires a non-empty override_reason."
    roles: [BuyerTreasury]
    code: 200
    input: [classification, "override_reason?"]
    output: EarlyPayment
    side_effects: ["rewrites accounting_status and override_reason on the third (non-terminal) state axis", "increments EarlyPayment.version by 1"]
  - method: GET
    path: "/early-payments/{id}/remittance-advices"
    description: "List the remittance advices generated for one early payment (reverse lookup for RemittanceAdvice.early_payment_id)."
    roles: [BuyerTreasury, Supplier, PlatformOps]
    code: 200
    input: []
    output: RemittanceAdvice[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock to any UTC instant. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z, the fixed startup default; the server never falls back to real wall-clock time. Advancing the clock runs the sweep described in side_effects, in the numbered order given."
    roles: [PlatformOps]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["step 1: store the new logical clock instant", "step 2: open every SCHEDULED AuctionSession whose opens_at has arrived and close every SCHEDULED/LIVE session whose closes_at has passed, in opens_at ASC order", "step 3: expire every NAMED/COUNTERED DiscountOffer on a session closed in step 2, in created_at ASC order", "step 4: mature every ELIGIBLE/OFFERED Invoice whose net_due_date has passed, in net_due_date ASC then created_at ASC order; SUPPRESSED invoices are held out of the sweep and mature only when their dispute is resolved UPHELD", "step 5: expire every ACTIVE FunderCommitment whose effective_to has passed and recompute calculations.funder_available_capital"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or the role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted for this endpoint, including a BuyerAdmin trying to accept a COUNTERED offer or a Supplier trying to accept a NAMED offer"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body: missing required field, wrong type, enum value out of range, negative amount, unparseable timestamp, or a window whose start is not strictly before its end"
  - id: ERR_FORBIDDEN_RESOURCE_SCOPE
    http: 403
    condition: "the acting identity is authenticated and role-permitted but the addressed resource belongs to a different buyer, supplier or funder"
  - id: ERR_BUYER_NOT_FOUND
    http: 404
    condition: "no Buyer row for the given path parameter or body buyer_id"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "no BuyerProgram row for the given path parameter or body program_id"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "no AuctionSession row for the given path parameter or body session_id"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "no Supplier row for the given path parameter; an unresolvable supplier_id nested inside a payable-file row is not a 404 but a row-level rejection with reason SUPPLIER_UNKNOWN"
  - id: ERR_BANK_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no BankAccount row for the given path parameter"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "no Invoice row for the given path parameter or body invoice_id"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "no Dispute row for the given path parameter"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "no DiscountOffer row for the given path parameter or body offer_id"
  - id: ERR_FUNDER_NOT_FOUND
    http: 404
    condition: "no Funder row for the given path parameter"
  - id: ERR_EARLY_PAYMENT_NOT_FOUND
    http: 404
    condition: "no EarlyPayment row for the given path parameter"
  - id: ERR_INVOICE_DISPUTE_SUPPRESSED
    http: 409
    condition: "the target invoice is SUPPRESSED or carries an OPEN dispute; reported ahead of the generic invoice-state error"
  - id: ERR_PROGRAM_NOT_OPEN
    http: 409
    condition: "the governing BuyerProgram is DRAFT, PAUSED or CLOSED rather than OPEN"
  - id: ERR_SESSION_NOT_LIVE
    http: 409
    condition: "the auction session is not LIVE, or the logical clock is outside [opens_at, closes_at)"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the addressed resource is already terminal on the axis this operation writes; the second identical trigger reports this instead of succeeding idempotently"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the resource is non-terminal but in the wrong source state for the requested transition, or a fork-join precondition is not yet satisfied"
  - id: ERR_STALE_INVOICE_VERSION
    http: 412
    condition: "expected_invoice_version does not equal the current Invoice.version"
  - id: ERR_STALE_OFFER_VERSION
    http: 412
    condition: "expected_offer_version does not equal the current DiscountOffer.version"
  - id: ERR_SUPPLIER_SANCTIONS_HOLD
    http: 403
    condition: "the supplier carries sanctions_hold = true"
  - id: ERR_SUPPLIER_NOT_PAYMENT_READY
    http: 409
    condition: "the supplier is not ACTIVE, has no VERIFIED bank account, or has a null payment_ready_at"
  - id: ERR_ACCEPTANCE_WINDOW_CLOSED
    http: 409
    condition: "the logical clock is at or after DiscountOffer.acceptance_deadline"
  - id: ERR_SESSION_WINDOW_CONFLICT
    http: 409
    condition: "the requested auction window overlaps, abuts, or falls within 60 minutes of another SCHEDULED/LIVE session on the same programme"
  - id: ERR_FILE_TOTALS_MISMATCH
    http: 422
    condition: "declared_row_count != accepted_row_count or declared_total_cents != computed_total_cents"
  - id: ERR_APR_OUT_OF_PROGRAM_BOUNDS
    http: 422
    condition: "the named, countered or accepted APR is below 200 bps or above the programme's current max_acceptable_apr_bps, or differs from fixed_apr_bps on a FIXED_RATE programme"
  - id: ERR_INSUFFICIENT_DAYS_EARLY
    http: 422
    condition: "days_early on PAY_DATE_BASIS is below BuyerProgram.min_days_early, or the pay date is after the invoice net_due_date"
  - id: ERR_COUNTER_ROUNDS_EXHAUSTED
    http: 409
    condition: "counter_round has already reached MAX_COUNTER_ROUNDS (3)"
  - id: ERR_MICRO_DEPOSIT_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "micro_deposit_attempts has already reached MAX_MICRO_DEPOSIT_ATTEMPTS (3)"
  - id: ERR_RECLASS_OVERRIDE_REASON_REQUIRED
    http: 422
    condition: "the requested classification differs from default_accounting_status and override_reason is missing or blank"
  - id: ERR_SELF_FUNDING_DISABLED
    http: 409
    condition: "the funding waterfall resolves to BUYER_SELF as the only candidate but Buyer.self_funding_enabled is false"
  - id: ERR_CONCENTRATION_CAP_EXCEEDED
    http: 409
    condition: "the forward-looking FACE_BASIS supplier share, including the invoice about to be awarded, is strictly greater than BuyerProgram.concentration_cap_pct"
  - id: ERR_FUNDER_CAPITAL_OVERCOMMITTED
    http: 409
    condition: "summed committed capital at some instant inside the requested tranche would exceed Funder.capital_limit_cents"
  - id: ERR_NO_ELIGIBLE_FUNDER
    http: 422
    condition: "no ACTIVE funder passes the eligibility filter when FUNDER is the last candidate in the waterfall"
  - id: ERR_BUYER_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "self-funding this payment would push Buyer.credit_used_cents above Buyer.credit_limit_cents"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# ---------------------------------------------------------------------------
roles:
  - name: BuyerAdmin
    description: "Buyer-side programme owner. Configures programmes and auction windows, ingests approved-payables files, negotiates rates, accepts supplier-named rates and raises or resolves disputes. Owns rate discovery, never cash movement."
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /buyer-programs"
      - "POST /buyer-programs/{id}/open"
      - "POST /buyer-programs/{id}/status"
      - "POST /auction-sessions"
      - "POST /auction-sessions/{id}/close"
      - "POST /payable-files"
      - "POST /discount-offers/{id}/counter"
      - "accepting a NAMED DiscountOffer via POST /discount-offers/{id}/accept"
    shared_operations:
      - "POST /invoices/{id}/disputes (with PlatformOps)"
      - "POST /disputes/{id}/resolve (with PlatformOps)"
      - "every GET on buyers, programmes, sessions, files, invoices, disputes, offers and early payments of its own buyer"
  - name: BuyerTreasury
    description: "Buyer-side treasury officer. Reserves, executes, settles and classifies early payments. Owns cash movement, never rate discovery - it cannot configure a programme, counter an offer or accept a rate."
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /early-payments"
      - "POST /early-payments/{id}/execute"
      - "POST /early-payments/{id}/accounting-classification"
    shared_operations:
      - "POST /early-payments/{id}/settlement/confirm (with PlatformOps)"
      - "POST /early-payments/{id}/settlement/fail (with PlatformOps)"
      - "every GET on buyers, programmes, invoices, offers, funders, commitments, bank accounts and early payments of its own buyer"
  - name: Supplier
    description: "Selling party. Completes onboarding, registers and verifies a bank account, names discount rates, re-names after a buyer counter, and accepts a buyer counter."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /discount-offers"
      - "POST /discount-offers/{id}/rename"
      - "accepting a COUNTERED DiscountOffer via POST /discount-offers/{id}/accept"
    shared_operations:
      - "POST /suppliers/{id}/onboarding/submit (with PlatformOps)"
      - "POST /suppliers/{id}/bank-accounts (with PlatformOps)"
      - "POST /bank-accounts/{id}/micro-deposit/confirm (with PlatformOps)"
      - "GET on its own supplier record, bank accounts, invoices, disputes, offers, early payments and remittance advices"
  - name: Funder
    description: "Third-party capital provider. Commits capital tranches and pauses or withdraws participation; never touches invoices, offers or programmes."
    identity: "entity_backed:Funder"
    exclusive_operations: []
    shared_operations:
      - "POST /funders/{id}/pause (with PlatformOps)"
      - "POST /funders/{id}/commitments (with PlatformOps)"
      - "GET on its own funder record, commitments and the early payments it funds"
  - name: PlatformOps
    description: "Platform operator. Onboards buyers, suppliers and funders, adjudicates identity verification, places compliance holds, drives the logical clock, and may act as settlement back-office. Cannot create programmes, name or accept rates, or reserve or execute payments."
    identity: "opaque"
    exclusive_operations:
      - "POST /buyers"
      - "POST /suppliers"
      - "POST /suppliers/{id}/idv/adjudicate"
      - "POST /suppliers/{id}/sanctions-hold"
      - "POST /funders"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /suppliers/{id}/onboarding/submit (with Supplier)"
      - "POST /suppliers/{id}/bank-accounts (with Supplier)"
      - "POST /bank-accounts/{id}/micro-deposit/confirm (with Supplier)"
      - "POST /funders/{id}/pause and POST /funders/{id}/commitments (with Funder)"
      - "POST /invoices/{id}/disputes and POST /disputes/{id}/resolve (with BuyerAdmin)"
      - "POST /early-payments/{id}/settlement/confirm and .../settlement/fail (with BuyerTreasury)"
      - "read access to every collection"

# ---------------------------------------------------------------------------
# List conventions (apply to every endpoint whose `output:` is `<Entity>[]`)
# ---------------------------------------------------------------------------
list_conventions:
  default_ordering: "created_at ASC; rows created inside one request (for example the Invoice rows of a single payable file, or the InvoiceLine rows of one invoice) keep the order in which they were submitted, which for InvoiceLine is line_no ASC. Ordering never uses `id`."
  pagination: "limit defaults to 10 with min 1 and max 100; offset defaults to 0 with min 0; the envelope's meta carries total_count and has_more."
  filters: "all filter parameters are optional and combine with AND; an unknown filter value returns an empty list rather than an error."
