        grounds:
          - calculations.clawback_recovery_amount
          - entities.ComplianceAudit.fields.noncompliant_share
          - entities.ComplianceAudit.fields.penalty_multiplier
        distinguishing_aspect: |
          PENALTY_TIER_BREAKPOINTS are inclusive on the upper edge, so a noncompliant share of
          exactly 0.5000 must select 1.25 and not 1.50. A two-location award with one failed location
          hits that edge exactly, and the recovery arithmetic then exercises the two separate
          roundings: base_recovery = round(1215002 * 1/2) = 607501, then
          round(607501 * 1.25) = 759376 (the .25 remainder must not round up), clamped by
          disbursed_to_date_cents which does not bind here.
