            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-7007", units_received: 20, size_received: [{ size_code: "S", units: 4 }, { size_code: "M", units: 7 }, { size_code: "L", units: 6 }, { size_code: "XL", units: 3 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
