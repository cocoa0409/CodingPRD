            - call: "POST /stores/${store8}/consignments/run"
              payload: { window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T23:00:00Z" }
              as: StoreManager
              captures: { settle_in: $.data }
            - call: "POST /stores/${store8}/consignments/run"
              payload: { window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T20:30:00Z" }
              as: StoreManager
