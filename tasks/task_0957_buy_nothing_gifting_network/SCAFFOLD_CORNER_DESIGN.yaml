      - name: group_full_boundary_rejects_third_approval
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_GROUP_FULL]", "entities.NeighborhoodGroup.fields.roster_status"]
        distinguishing_aspect: "Boundary at member_count == capacity: with capacity 2 and 2 APPROVED members, the third approve is rejected with ERR_GROUP_FULL; the second approve (1 -> 2) still succeeds."
        test_recipe:
          setup: ["APPROVAL_REQUIRED group capacity 2; M1, M2, M3 each REQUESTED"]
          setup_api_calls:
            - call: "POST /v1/members"
              payload: { email: "gf1@x.com", display_name: "M1" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /v1/members"
