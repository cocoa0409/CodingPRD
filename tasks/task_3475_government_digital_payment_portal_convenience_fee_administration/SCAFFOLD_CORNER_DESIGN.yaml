          - entities.ServiceCatalogItem.fields.min_amount_cents
        distinguishing_aspect: "Amount 99 against min_amount_cents 100 fails 422 ERR_AMOUNT_OUT_OF_RANGE; the bounds are inclusive so 100 itself passes this check."
        test_recipe:
          setup:
