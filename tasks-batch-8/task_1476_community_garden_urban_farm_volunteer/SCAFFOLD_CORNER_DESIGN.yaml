            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z1", planned_start_at: "2026-08-20T10:00:00Z", planned_end_at: "2026-08-20T11:00:00Z", planned_gallons: 50, expected_season_version: "${sv}" }, as: GardenAdmin, captures: { irr_id: $.data.id } }
            - { call: "POST /api/irrigation-schedules/${irr_id}/log-meter", payload: { gallons_actual: 45 }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "RESERVED" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "PLANTED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "GROWING" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "HARVESTING" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "RECONCILIATION" }, as: GardenAdmin }
          trigger:
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "CLOSED" }, as: GardenAdmin, captures: { err_close: $.data.error_id } }
            - { call: "POST /api/irrigation-schedules/${irr_id}/transition", payload: { to_state: "RECONCILED" }, as: GardenAdmin, captures: { irr_st: $.data.status } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "CLOSED" }, as: GardenAdmin, captures: { st_closed: $.data.status } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin, captures: { err_term: $.data.error_id } }
