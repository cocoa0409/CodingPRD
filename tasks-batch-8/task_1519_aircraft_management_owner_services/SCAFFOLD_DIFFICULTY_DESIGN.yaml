              captures: { stmt_id: $.data.id }
          assert:
            - "MonthlyStatement.${stmt_id}.mixed_owner_share_cents == 50001"
            - "MonthlyStatement.${stmt_id}.mixed_charter_share_cents == 49999"
            - "MonthlyStatement.${stmt_id}.mixed_owner_share_cents + MonthlyStatement.${stmt_id}.mixed_charter_share_cents == 100000"

      - name: management_fee_pre_fee_subtotal_order
        grounds:
          - calculations.management_fee_assessment
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the statement grand total
          includes the management fee, but the fee is pinned to the PRE-FEE
          accrual subtotal (680000, which itself contains the 250000 of
          CHARTER_DIRECT costs) and computed BEFORE the charter offset is
          applied — fee = 500000 + round_half_up(0.10 x 680000) = 568000, even
          though the same statement carries a 552500 charter offset. An
          implementation that nets the offset first (fee basis 127500) or that
          lets the fee enter its own basis produces a different fee.
        test_recipe:
          setup:
            - "Agreement ACTIVE with monthly_management_fee_cents=500000, variable_fee_pct=0.10, charter_owner_share_pct=0.85"
            - "Expenses E1 FUEL 250000 (service 2026-08-05, paid 2026-08-07) and E2 CREW 180000 (service 2026-08-15, unpaid); the two CHARTER_DIRECT expenses below bring the August accrual subtotal to 680000"
            - "QUALIFIED crew pair + ACCEPTED INSURANCE_COI; CHARTER trip (quote 900000) COMPLETED with CHARTER_DIRECT costs 200000 + 50000: owner_credit 552500"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N500JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
            - call: "POST /expenses"
              payload: { aircraft_id: "${a_id}", category: FUEL, amount_cents: 250000, service_date: "2026-08-05", paid_date: "2026-08-07", vendor_name: "Meridian Fuel", tax_use: OWNER_USE }
              as: FinanceController
