            - { call: "POST /household-payroll/workers/${w1_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w1_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w1_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", effective_from: "2026-01-01", expected_worker_version: "${w1_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w1_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "F Two", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w2_id: "$.data.id" } }
            - { call: "POST /household-payroll/workers/${w1_id}/terminate", as: HouseholdClient, as_user_id: "${e_id}" }
          trigger:
            - { call: "GET /household-payroll/employers/${e_id}/workers", payload: { status: "TERMINATED" }, as: PayrollAdmin, captures: { term0: "$.data[0].id" } }
            - { call: "GET /household-payroll/employers/${e_id}/workers", payload: { status: "ACTIVE" }, as: PayrollAdmin }
          assert:
