      - name: award_rows_created_at_start_judging
        claim_type: side_effect_execution
        grounds: ["state_machines.Event.REGISTRATION_LOCKED_to_JUDGING", "entities.Award"]
        distinguishing_aspect: "start-judging materializes the PENDING award structure deterministically: JUDGED depth-2 class -> 2 CLASS_PLACE rows; BOTH depth-1 class -> 1 CLASS_PLACE + 1 PEOPLES_CHOICE; PC class -> 1 PEOPLES_CHOICE; plus exactly 1 BEST_OF_SHOW."
        test_recipe:
          setup: ["Event with three classes (JUDGED depth 2, BOTH depth 1, PEOPLES_CHOICE depth 1) in REGISTRATION_LOCKED; zero registrations"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Awards", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "JCLS", name: "Judged", min_year: 1950, max_year: 1975, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "JUDGED", award_depth: 2 }, as: Organizer, captures: { cj: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "BCLS", name: "Both", min_year: 1976, max_year: 1995, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "BOTH", award_depth: 1 }, as: Organizer, captures: { cb: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "PCLS", name: "Peoples", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cp: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/lock-registration", payload: {}, as: Organizer }
          trigger:
            - { call: "POST /events/${ev}/start-judging", payload: {}, as: Organizer, captures: { life: $.data.lifecycle_status } }
            - { call: "GET /awards", payload: { event_id: "${ev}" }, as: Organizer }
          assert:
            - "lifecycle == TABULATING (judged classes have no CHECKED_IN registrations, so they are vacuously complete and the event auto-advances)"
            - "GET /awards?event_id=${ev} returns 6 PENDING rows: [CLASS_PLACE p1, CLASS_PLACE p2] for JCLS, [CLASS_PLACE p1, PEOPLES_CHOICE] for BCLS, [PEOPLES_CHOICE] for PCLS, then [BEST_OF_SHOW] with class_id null"
            - "every row has winner_registration_id null and status PENDING"

