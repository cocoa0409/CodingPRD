scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_provisional_vs_final_on_personnel
        grounds:
          - calculations.commission_estimate_vs_final
          - state_machines.Order.IN_PROGRESS_to_COMPLETED
          - state_machines.Order.COMPLETED_to_ACCEPTED_BY_CUSTOMER
          - entities.SettlementLedgerEntry.fields.kind
          - entities.ServicePersonnel.fields.tier
        distinguishing_aspect: |
          Operates on the ServicePersonnel domain (commission/tier ledger). Provisional commission
          uses tier observed AT Order.completed_at; final commission uses tier observed AT
          Order.accepted_at. A low rating posted between the two timestamps drops tier and produces
          a strictly different final number, posted as a delta BONUS/REVERSAL entry — distinct from
          the rating-score variant below which is on a different entity.
        test_recipe:
          setup:
            - "Create one ServicePersonnel A whose rating_count=4 (BRONZE because below MIN_SAMPLE_COUNT=5), tier=BRONZE"
            - "Create one customer, one service item base_price_cents=10000, area matches"
            - "Walk an Order through to COMPLETED for personnel A (gross_price_cents=20000, duration=2h)"
            - "Provisional ledger entry should be COMMISSION amount=14000"
            - "Before customer-accept: post a separate qualifying COMPLETED→customer-accept flow for personnel A 4 more times all with 5/5/5 ratings to lift rating_count >= 5 and rating_score == 5.0 → tier PLATINUM"
            - "Final-accept the original Order"
          trigger:
            - "POST /dsd/orders/{original_id}/customer-accept"
          assert:
            - "SettlementLedgerEntry rows for personnel A linked to original Order have COMMISSION.amount_cents == 14000 AND a follow-up BONUS.amount_cents == 2800 (final 16800 − provisional 14000)"
            - "Customer.wallet_credit_cents unchanged by the customer-accept transition"

      - name: rating_score_aggregation_on_personnel_vs_rating_record
        grounds:
          - calculations.personnel_rating_score
          - calculations.rating_composite
          - state_machines.OrderRating.NONE_to_OPEN
          - state_machines.OrderRating.NONE_to_CLOSED
          - entities.OrderRating.fields.composite_score
          - entities.ServicePersonnel.fields.rating_score
        distinguishing_aspect: |
          Operates on a different domain (Rating entity vs ServicePersonnel aggregate). The per-rating
          composite_score is a single-row weighted average over the OrderRating record; the
          personnel_rating_score is the cumulative running average across the personnel's lifetime
          ratings. Same numeric inputs produce different observable fields — rating.composite_score
          vs personnel.rating_score — and use different variants (per-row weighted vs incremental
          running average).
        test_recipe:
          setup:
            - "ServicePersonnel B with rating_count=0, rating_score=0"
            - "Drive two completed-and-accepted orders for personnel B"
          trigger:
            - "POST /dsd/orders/{first}/rate with quality=5,punctuality=3,attitude=1"
            - "POST /dsd/orders/{second}/rate with quality=5,punctuality=5,attitude=5"
          assert:
            - "First OrderRating.composite_score == 3.6 (0.5*5+0.3*3+0.2*1 = 2.5+0.9+0.2)"
            - "Second OrderRating.composite_score == 5.0"
            - "After both ratings, ServicePersonnel B.rating_score == 4.3 ((3.6+5.0)/2 rounded to 4 dp)"
            - "ServicePersonnel B.rating_count == 2"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dispatch_selection_weighted_ranking_mode_a
        grounds:
          - calculations.dispatch_selection
          - state_machines.Order.PENDING_DISPATCH_to_DISPATCHED
          - entities.ServicePersonnel.fields.tier
          - entities.ServicePersonnel.fields.rating_score
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs and non-linear interaction. The ranking expression combines
          tier_priority (categorical lookup), rating_score (continuous), and -distance_km (geographic),
          with a conditional tie-break on ServicePersonnel.id ASCII. Eligibility predicate further
          conjoins ≥8 boolean predicates (status, skill match, distance, workload, gender, age range,
          language, exclusion). Non-linear because tier_priority gates rating_score gates distance —
          a lower-tier higher-rated personnel does NOT beat a higher-tier lower-rated personnel.
        test_recipe:
          setup:
            - "Create 3 ACTIVE personnel inside the customer's service radius all matching the required skill"
            - "Personnel P1: tier=GOLD, rating_score=4.9000, id='aaaa…'"
            - "Personnel P2: tier=PLATINUM, rating_score=4.5000, id='bbbb…'"
            - "Personnel P3: tier=PLATINUM, rating_score=4.5000, id='aaab…'"
            - "Create an Order in PENDING_DISPATCH"
          trigger:
            - "POST /dsd/orders/{id}/dispatch"
          assert:
            - "Order.assigned_personnel_id == P3.id (P2 and P3 tie on (tier,rating); ASCII tie-break selects P3 because 'aaab…' < 'bbbb…'); P1 is NOT chosen despite higher rating because tier dominates"

      - name: settlement_payout_sum_then_round_tax_mode_b
        grounds:
          - calculations.settlement_cycle_payout
          - entities.SettlementLedgerEntry.fields.kind
          - entities.SettlementLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins SUM-THEN-ROUND tax (sum
          all eligible entries first, then apply TAX_RATE and round_half_up once) — the alternative
          (round per entry then sum) yields different cents when multiple entries have non-divisible
          remainders. Distinct from instance mode (a) above which has no rounding step.
        test_recipe:
          setup:
            - "ServicePersonnel C with three COMMISSION entries in cycle 2026-05 amounts 3333, 3334, 3333 cents (sum=10000)"
            - "All withheld_until <= current_time"
          trigger:
            - "POST /dsd/_sweep/settlement {cycle_id='2026-05'}"
          assert:
            - "A TAX entry of amount_cents == -1000 is posted (10000 * 0.10 = 1000, single round_half_up)"
            - "A PAYOUT entry of amount_cents == -9000 is posted"
            - "Per-entry-rounded alternative (333+333+333=999) would produce TAX=-999 — the scaffold REJECTS that order"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_dispatch_revert_cycle
        grounds:
          - state_machines.Order.PENDING_DISPATCH_to_DISPATCHED
          - state_machines.Order.DISPATCHED_to_PENDING_DISPATCH
        distinguishing_aspect: |
          Cycle on the Order entity: PENDING_DISPATCH → DISPATCHED → PENDING_DISPATCH on personnel
          rejection or deadline expiry, with dispatch_round incrementing each loop. Re-dispatch can
          loop multiple times. Distinct entity domain from the InsuranceClaim instance below.
        test_recipe:
          setup:
            - "Create an Order in PENDING_DISPATCH with at least two eligible personnel"
          trigger:
            - "POST /dsd/orders/{id}/dispatch"
            - "POST /dsd/orders/{id}/reject (as the first assigned personnel)"
            - "POST /dsd/orders/{id}/dispatch (second round)"
          assert:
            - "After cycle, Order.status == DISPATCHED AND Order.dispatch_round == 2"
            - "First-rejected personnel is NOT the second-round assignee (exclusion enforced)"

      - name: insurance_claim_branching_decision
        grounds:
          - state_machines.InsuranceClaim.FILED_to_APPROVED
          - state_machines.InsuranceClaim.FILED_to_REJECTED
          - state_machines.InsuranceClaim.APPROVED_to_PAID
          - state_machines.InsuranceClaim.REJECTED_to_ARCHIVED
          - state_machines.InsuranceClaim.PAID_to_ARCHIVED
        distinguishing_aspect: |
          Branching fork-join on a different entity (InsuranceClaim): FILED forks into {APPROVED →
          PAID → ARCHIVED} or {REJECTED → ARCHIVED}; the two branches carry different side-effects
          (APPROVED writes paid_amount_cents; REJECTED forces paid_amount_cents=0). Distinct from
          the Order cycle in shape (branch vs cycle) and entity domain.
        test_recipe:
          setup:
            - "Open an InsuranceClaim, attach 2 evidence items, file it (status FILED)"
          trigger:
            - "POST /dsd/_events/insurance-decision {claim_id, decision='REJECTED', amount_cents=0}"
            - "POST /dsd/claims/{id}/archive"
          assert:
            - "InsuranceClaim.status == ARCHIVED via the REJECTED branch"
            - "InsuranceClaim.paid_amount_cents == 0"
            - "No mark-paid call was required on this branch — confirms branching divergence"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recert_sweep_to_personnel_suspend_to_orders_revert_depth3
        grounds:
          - state_machines.SkillCertification.ACTIVE_to_EXPIRED
          - state_machines.ServicePersonnel.ACTIVE_to_SUSPENDED
          - state_machines.Order.DISPATCHED_to_PENDING_DISPATCH
          - entities.ServicePersonnel.fields.skill_tags
        distinguishing_aspect: |
          Depth-3 chain triggered by /dsd/_sweep/recertification:
          (A) SkillCertification.ACTIVE → EXPIRED (cert expiry); which causes
          (B) ServicePersonnel.skill_tags becomes empty → ServicePersonnel.ACTIVE → SUSPENDED; which causes
          (C) every Order assigned to that personnel in DISPATCHED reverts to PENDING_DISPATCH with
              assigned_personnel_id=null. Each link is caused by the previous link, not directly by
              the original sweep trigger.
        test_recipe:
          setup:
            - "Personnel A with one ACTIVE cert whose expires_at = current_time + 60s"
            - "Personnel A is ACTIVE; an Order assigned to A is DISPATCHED with dispatch_deadline_at far in the future"
          trigger:
            - "POST /dsd/_clock/advance {seconds: 120}"
            - "POST /dsd/_sweep/recertification"
          assert:
            - "Certification.status == EXPIRED (hop 1)"
            - "Personnel A.skill_tags == [] AND Personnel A.status == SUSPENDED (hop 2 caused by hop 1, not by the sweep directly mutating personnel)"
            - "Order.status == PENDING_DISPATCH AND Order.assigned_personnel_id == null (hop 3 caused by hop 2)"
            - "An AuditLogEntry action_type=DISPATCH_EXPIRED exists for the Order"

      - name: refund_to_ledger_reversal_to_wallet_credit_depth2
        grounds:
          - state_machines.Order.COMPLETED_to_REFUNDED
          - entities.SettlementLedgerEntry.fields.kind
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: |
          Depth-2 chain triggered by /dsd/orders/{id}/refund (a DIFFERENT triggering transition than
          the recert sweep above):
          (A) Order.COMPLETED → REFUNDED; which causes
          (B) post a REVERSAL ledger entry whose amount equals minus the original COMMISSION and
              credit the gross_price_cents into Customer.wallet_credit_cents. The hop from (A) to
              (B) is causal and writes two DIFFERENT downstream fields (ledger entry creation +
              wallet balance increment).
        test_recipe:
          setup:
            - "An Order in COMPLETED state with one COMMISSION ledger entry amount=14000 cents posted for personnel A"
            - "Customer.wallet_credit_cents starts at 0; Order.gross_price_cents=20000"
            - "current_time < completed_at + 72h"
          trigger:
            - "POST /dsd/orders/{id}/refund"
          assert:
            - "Order.status == REFUNDED"
            - "A new SettlementLedgerEntry kind=REVERSAL amount_cents=-14000 exists for personnel A (hop B-1)"
            - "Customer.wallet_credit_cents == 20000 (hop B-2)"
            - "Sum of (COMMISSION + REVERSAL) across this order's entries == 0 (compensating invariant)"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_refund
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - state_machines.Order.COMPLETED_to_REFUNDED
        distinguishing_aspect: |
          Pair: `state` (priority 4 ERR_INVALID_STATE — Order not in COMPLETED) vs `business_temporal`
          (priority 7 ERR_COMPLAINT_PERIOD_EXPIRED — refund after 72h). When BOTH fail (e.g., Order
          is in PENDING_DISPATCH AND beyond 72h since some unrelated timestamp), the state check at
          priority 4 wins.
        test_recipe:
          setup:
            - "An Order in PENDING_DISPATCH (NOT COMPLETED) — refund precondition #1 violated"
            - "Advance the clock so that 'completed_at + 72h' (had it been completed) would have been in the past"
          trigger:
            - "POST /dsd/orders/{id}/refund"
          assert:
            - "Response error_id == ERR_INVALID_STATE (state check fires before temporal check)"
            - "Response http status == 409"

      - name: business_safety_vs_business_referential_on_checkin_and_submit
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.Order.ACCEPTED_to_IN_PROGRESS
          - state_machines.Order.DRAFT_to_PENDING_DISPATCH
        distinguishing_aspect: |
          Pair: `business_safety` (priority 5 ERR_NOT_ASSIGNED — personnel acting on order they
          don't own) vs `business_referential` (priority 6 ERR_AREA_NOT_SERVICED — customer area
          outside item's service_areas). Distinct from the state-vs-temporal pair above. When both
          would fail (personnel-with-wrong-id submits an order whose area is mismatched), the
          higher-priority business_safety check fires first.
        test_recipe:
          setup:
            - "Customer C in area_code='X' (NOT in ServiceItem.service_areas)"
            - "Personnel P with id != Order.assigned_personnel_id calls checkin"
            - "(Construct two independent endpoints so each pair is testable separately; this case targets checkin where P acts on an order assigned to a different personnel AND that order's customer happens to be in an area mismatch with the requested item — assert priority 5 fires first)"
          trigger:
            - "POST /dsd/orders/{id}/checkin with X-User-ID = P.id ≠ assigned_personnel_id"
          assert:
            - "Response error_id == ERR_NOT_ASSIGNED (priority 5)"
            - "Response http status == 403"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tier_boundary_at_4_5_exactly
        grounds:
          - calculations.performance_tier
          - entities.ServicePersonnel.fields.rating_score
          - validations[priority=8]
        distinguishing_aspect: |
          Numeric threshold metric: tier transitions use `>=` not `>`. rating_score == 4.5000 with
          rating_count >= 5 MUST land in GOLD (not SILVER). Endpoint: POST /dsd/orders/{id}/rate
          (which triggers tier recompute via the rate→aggregation→tier cascade).
        test_recipe:
          setup:
            - "Personnel P with rating_count=4 and rating_score chosen so that one more rating with composite 4.5 yields cumulative average exactly 4.5000"
            - "Specifically: prior 4 ratings each composite_score=4.5 → rating_score=4.5000, count=4"
            - "Drive a fifth ACCEPTED_BY_CUSTOMER Order"
          trigger:
            - "POST /dsd/orders/{id}/rate {quality=5,punctuality=4,attitude=4} → composite=0.5*5+0.3*4+0.2*4 = 4.5000"
          assert:
            - "After the rate call, Personnel P.rating_count == 5 AND Personnel P.rating_score == 4.5000"
            - "Personnel P.tier == GOLD (boundary >=4.5 lands GOLD, NOT SILVER)"

      - name: empty_set_no_eligible_personnel
        grounds:
          - calculations.dispatch_selection
          - validations[priority=8]
          - state_machines.Order.PENDING_DISPATCH_to_DISPATCHED
        distinguishing_aspect: |
          Empty-collection boundary on a different metric (set cardinality, not numeric threshold)
          and a different endpoint (POST /dsd/orders/{id}/dispatch). When the eligibility predicate
          filters every candidate out, the candidate set is empty and dispatch MUST fail with
          ERR_NO_ELIGIBLE_PERSONNEL.
        test_recipe:
          setup:
            - "Create an Order whose ServiceItem.required_skill_tag has zero personnel certified for it"
          trigger:
            - "POST /dsd/orders/{id}/dispatch"
          assert:
            - "Response error_id == ERR_NO_ELIGIBLE_PERSONNEL"
            - "Response http status == 422"
            - "Order.status remains PENDING_DISPATCH AND Order.dispatch_round == 0"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_dispatch_requires_personnel_active_pair_order_personnel
        grounds:
          - calculations.dispatch_selection
          - state_machines.Order.PENDING_DISPATCH_to_DISPATCHED
          - state_machines.ServicePersonnel.PENDING_VERIFICATION_to_ACTIVE
          - entities.ServicePersonnel.fields.status
        distinguishing_aspect: |
          Cross-entity pair Order↔ServicePersonnel: Order.PENDING_DISPATCH→DISPATCHED only succeeds
          if at least one candidate has ServicePersonnel.status == ACTIVE (the eligibility filter).
          The transition on Order depends on the state field of a different entity.
        test_recipe:
          setup:
            - "Only candidate personnel for the order is in SUSPENDED state"
          trigger:
            - "POST /dsd/orders/{id}/dispatch"
          assert:
            - "Response error_id == ERR_NO_ELIGIBLE_PERSONNEL"
            - "Suspending the only eligible personnel before dispatch is what causes the failure — confirms cross-entity dependency"

      - name: personnel_activate_requires_active_cert_pair_personnel_certification
        grounds:
          - state_machines.ServicePersonnel.PENDING_VERIFICATION_to_ACTIVE
          - state_machines.SkillCertification.PENDING_to_ACTIVE
          - entities.SkillCertification.fields.status
        distinguishing_aspect: |
          A DIFFERENT cross-entity pair (ServicePersonnel↔SkillCertification): Personnel cannot move
          PENDING_VERIFICATION→ACTIVE unless at least one of its SkillCertification rows is in
          ACTIVE state.
        test_recipe:
          setup:
            - "Create Personnel P (PENDING_VERIFICATION), verify identity, set health_cert_expires_at in the future"
            - "Create one SkillCertification linked to P but DO NOT approve it (stays PENDING)"
          trigger:
            - "POST /dsd/personnel/{P.id}/activate"
          assert:
            - "Response error_id == ERR_INVALID_STATE"
            - "Approving the cert first (POST /certifications/{id}/approve) then activate succeeds — confirms the dependency on SkillCertification.status"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dispatch_window_lead_time_half_open_interval_on_order
        grounds:
          - validations[priority=7]
          - state_machines.Order.DRAFT_to_PENDING_DISPATCH
          - entities.Order.fields.scheduled_start_at
        distinguishing_aspect: |
          Interval semantics #1: closed-lower-bound lead-time check on Order. The rule
          'scheduled_start_at >= current_time + 1 hour' uses inclusive equality at the boundary
          (exactly 60 minutes ahead is allowed; 59:59 is rejected). The geometric treatment is a
          single half-open interval [current_time + 1h, ∞).
        test_recipe:
          setup:
            - "Customer C with valid area and active service item"
            - "Order in DRAFT, scheduled_start_at = current_time + 59 minutes"
          trigger:
            - "POST /dsd/orders/{id}/submit"
          assert:
            - "Response error_id == ERR_LEAD_TIME_TOO_SHORT (boundary violated by 1 minute)"
            - "Retrying with scheduled_start_at = current_time + 60 minutes succeeds → Order.status == PENDING_DISPATCH (inclusive boundary)"

      - name: dispatch_workload_capacity_aggregate_limit_on_personnel
        grounds:
          - calculations.dispatch_selection
          - entities.ServicePersonnel.fields.workload_active_orders
        distinguishing_aspect: |
          Different interval semantics: aggregate-capacity overlap on a different resource
          (ServicePersonnel.workload_active_orders < 5). Instead of a single time-interval check
          this is a count-based aggregate over many concurrent intervals (active orders held by the
          personnel). Strict-less-than 5 means a personnel at exactly 5 is excluded from the
          candidate pool — different arithmetic (strict <) than the inclusive >= on lead time, and
          different resource (Personnel vs Order).
        test_recipe:
          setup:
            - "Personnel P has 5 orders already in {DISPATCHED, ACCEPTED, IN_PROGRESS} — workload_active_orders == 5"
            - "Personnel P is the only candidate matching the required skill for a new Order"
          trigger:
            - "POST /dsd/orders/{id}/dispatch"
          assert:
            - "Response error_id == ERR_NO_ELIGIBLE_PERSONNEL (P fails MAX_WORKLOAD < 5 boundary)"
            - "Cancel one of P's active orders, workload drops to 4, retry dispatch → succeeds"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: commission_plus_reversal_sums_to_zero
        grounds:
          - state_machines.Order.IN_PROGRESS_to_COMPLETED
          - state_machines.Order.COMPLETED_to_REFUNDED
          - entities.SettlementLedgerEntry.fields.amount_cents
          - calculations.commission_estimate_vs_final
        distinguishing_aspect: |
          Conserved quantity #1: `sum(SettlementLedgerEntry.amount_cents WHERE order_id == X AND
          kind IN {COMMISSION, BONUS, REVERSAL})` for any refunded order MUST equal 0 after refund.
          The forward action (complete → commission posted) and compensating action (refund →
          reversal posted) leave this sum invariant.
        test_recipe:
          setup:
            - "Drive an Order to COMPLETED (provisional COMMISSION amount=14000 posted; no BONUS yet)"
            - "Customer has not yet customer-accepted"
            - "current_time < completed_at + 72h"
          trigger:
            - "POST /dsd/orders/{id}/refund"
          assert:
            - "sum of {COMMISSION, BONUS, REVERSAL} amounts for this order == 0 (literal: 14000 + (-14000) = 0)"
            - "Order.status == REFUNDED"

      - name: cancel_refunds_full_gross_price_to_wallet
        grounds:
          - state_machines.Order.DISPATCHED_to_CANCELLED
          - state_machines.Order.ACCEPTED_to_CANCELLED
          - state_machines.Order.PENDING_DISPATCH_to_CANCELLED
          - entities.Customer.fields.wallet_credit_cents
          - entities.Order.fields.gross_price_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: the customer-side cash-equivalent invariant
          `Order.gross_price_cents + Customer.wallet_credit_cents` MUST remain unchanged across the
          cancel transition. The customer is made whole through wallet credit (no out-of-pocket
          drift). Distinct from the ledger-sum invariant above (which concerns the personnel-side
          ledger, not the customer wallet).
        test_recipe:
          setup:
            - "Customer C with wallet_credit_cents=0"
            - "Order O in DISPATCHED state with gross_price_cents=20000"
            - "current_time < scheduled_start_at − 2h"
          trigger:
            - "POST /dsd/orders/{id}/cancel"
          assert:
            - "Order.status == CANCELLED"
            - "Customer C.wallet_credit_cents == 20000 (exactly Order.gross_price_cents was credited)"
            - "Conserved quantity check: (post.gross_price_cents + post.wallet_credit_cents) - (pre.gross_price_cents + pre.wallet_credit_cents) == 0"
