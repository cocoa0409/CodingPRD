          setup:
            - "Logical clock parked at 2026-08-10T00:00:00Z, inside the 7-day inspection period that ends 2026-08-17T00:00:00Z."
            - "One unlicensed wholesaler, one STANDARD-tier lead, one FINALIZED AGGRESSIVE analysis."
            - "One SIGNED purchase contract at purchase_price_cents 18000000 and earnest_money_cents 500000, structure_election ASSIGNMENT_ELECTED, with a HELD earnest money deposit."
            - "One cash buyer with VERIFIED funds 25500000, one ACCEPTED offer at buyer_price_cents 20160000 with buyer_deposit_cents 1000000, and one PENDING_SETTLEMENT assignment agreement."
