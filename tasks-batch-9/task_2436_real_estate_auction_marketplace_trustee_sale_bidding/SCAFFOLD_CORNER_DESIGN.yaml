      - name: all_county_exclusion_suspends_bidder_and_lift_restores
        claim_type: cross_entity
        grounds:
          - state_machines.Bidder.REGISTERED_to_SUSPENDED
          - state_machines.Bidder.SUSPENDED_to_REGISTERED
          - endpoints[POST /eligibility-exclusions]
          - endpoints[POST /eligibility-exclusions/{id}/lift]
          - calculations.bidder_risk_score
        distinguishing_aspect: "An exclusion scoped to ALL and already effective flips the bidder's own registration_status to SUSPENDED and re-scores screen_risk_score to 20; lifting it restores REGISTERED and a score of 0 — the scope keyword, not the existence of the row, is what drives the bidder's machine."
        test_recipe:
          setup:
            - "One VERIFIED, REGISTERED bidder with no exclusions and screen_risk_score 0; the clock is 2026-09-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bidders"
              payload: { legal_name: "Scope Test Bidder LLC", email: "s@scope.example", mailing_address: "3 Scope Rd, Oakland CA" }
              as: Anonymous
              captures: { bidder_id: $.data.id }
            - call: "POST /bidders/${bidder_id}/identity-verification"
              payload: { decision: "VERIFIED", document_reference: "KYC-SCOPE-1" }
              as: ComplianceOfficer
              captures: { reg_before: $.data.registration_status, score_before: $.data.screen_risk_score }
          trigger:
            - call: "POST /eligibility-exclusions"
              payload: { bidder_id: "${bidder_id}", exclusion_type: "SANCTIONS_LIST", effective_at: "2026-09-10T00:00:00Z", notes: "national list match" }
              as: ComplianceOfficer
              captures: { exclusion_id: $.data.id, scope: $.data.county_code }
            - call: "POST /eligibility-exclusions/${exclusion_id}/lift"
              payload: { notes: "false positive cleared by manual review" }
              as: ComplianceOfficer
              captures: { lifted_status: $.data.status, lifted_at: $.data.lifted_at }
          assert:
            - "${reg_before} == REGISTERED and ${score_before} == 0"
            - "${scope} == ALL (the omitted county_code defaults to the widest scope)"
            - "Immediately after the exclusion: Bidder.${bidder_id}.registration_status == SUSPENDED and screen_risk_score == 20"
            - "${lifted_status} == LIFTED and ${lifted_at} == 2026-09-10T00:00:00Z"
            - "After the lift: Bidder.${bidder_id}.registration_status == REGISTERED and screen_risk_score == 0"
            - "GET /bidders/${bidder_id}/eligibility-exclusions returns total_count == 1 with status == LIFTED"

