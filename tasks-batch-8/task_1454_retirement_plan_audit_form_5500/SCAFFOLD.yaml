# =============================================================================
# SCAFFOLD.yaml — Retirement Plan Audit & Form 5500 Preparation (ERISA)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml /
# SCAFFOLD_CORNER_DESIGN.yaml and are NOT emitted here.
# =============================================================================

scenario: |
  Retirement Plan Audit & Form 5500 Preparation (ERISA plan auditor): participant
  count determination & audit requirement threshold, trust statement & contribution
  testing support, nondiscrimination & coverage test results integration, schedule
  preparation (H/I/C/A) & service provider fee disclosure, late contribution
  identification & lost earnings calculation, filing deadline & extension, auditor
  findings & corrective distribution, DOL/IRS correction program filing

domain_name: retirement-plan-audit-5500
api_prefix: /plan-audit

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FK ids carried in bodies)
# =============================================================================
entities:
  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_ein, type: string, source: input, description: "Employer identification number of the plan sponsor; (sponsor_ein, plan_number) plan-years must not overlap" }
      - { name: plan_number, type: string, source: input, description: "Three-digit plan number (e.g. '001')" }
      - { name: plan_name, type: string, source: input, description: "Formal plan name" }
      - { name: plan_year_start, type: string, source: input, description: "ISO date; plan year begins (inclusive lower bound of half-open plan-year interval)" }
      - { name: plan_year_end, type: string, source: input, description: "ISO date; day after plan year ends (exclusive upper bound); for a calendar PY2025 this is 2026-01-01" }
      - { name: plan_type, type: enum, source: input, description: "DC | DB | DC_401K", constraints: "one of DC, DB, DC_401K" }
      - { name: funding_arrangement, type: enum, source: input, description: "TRUST | INSURANCE | SPLIT", constraints: "SPLIT = part trust, part insurance; drives Schedule A requirement" }
      - { name: prior_year_schedule_type, type: enum, source: input, description: "H | I | NONE_FIRST_YEAR; what the plan filed as last year (drives 80-120 election eligibility)" }
      - { name: use_80120_election, type: boolean, source: input, default: false, description: "Sponsor elects the 80-120 participant rule when eligible" }
      - { name: status, type: enum, source: system, description: "DRAFT | DATA_COLLECTION | TESTING | FIELDWORK | REPORT_ISSUED | COMPLETED" }
      - { name: participant_count_beginning, type: integer, source: computed, description: "Eligible participant count as of plan_year_start per participant_count_determination; null until first recompute" }
      - { name: audit_required, type: boolean, source: computed, description: "True when IQPA audit report is mandatory for this filing; null until first recompute" }
      - { name: required_schedule_type, type: enum, source: computed, description: "H (large plan) | I (small plan); null until first recompute" }
      - { name: remittance_standard_days, type: integer, source: computed, description: "Business-day remittance standard: 7 when required_schedule_type == I, else 3; null until first recompute" }
      - { name: auditor_report_ref, type: string, source: input, default: null, description: "Reference to the attached IQPA audit report; set via attach_audit_report" }
      - { name: posture, type: enum, source: computed, description: "ON_TRACK | AT_RISK | BLOCKED; derived aggregate gating filing readiness (see posture_rule calculation)" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; the engagement this census record belongs to" }
      - { name: external_ref, type: string, source: input, description: "Sponsor-side participant reference; unique per engagement" }
      - { name: eligibility_date, type: string, source: input, description: "ISO date the employee met eligibility" }
      - { name: entry_date, type: string, source: input, description: "ISO date the employee entered the plan" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "ACTIVE | SEPARATED_WITH_BALANCE | SEPARATED_NO_BALANCE | RETIRED_WITH_BALANCE | DECEASED" }
      - { name: is_eligible, type: boolean, source: input, description: "Eligible to participate as of plan_year_start" }
      - { name: is_hce, type: boolean, source: input, description: "Highly compensated employee flag for ADP/ACP tests" }
      - { name: compensation_cy_cents, type: integer, source: input, description: "Current-year gross compensation in cents (test denominator)" }
      - { name: deferral_amount_cy_cents, type: integer, source: input, description: "Current-year elective deferrals in cents (test numerator)" }
      - { name: opening_balance_cents, type: integer, source: input, description: "Account balance at plan_year_start in cents" }
      - { name: account_balance_cents, type: integer, source: computed, description: "opening_balance_cents + matched contributions + executed corrective deposits - executed corrective distributions; voided actions excluded" }

  - name: Contribution
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; must belong to the same engagement" }
      - { name: type, type: enum, source: input, description: "ELECTIVE_DEFERRAL | EMPLOYER_MATCH | EMPLOYER_PROFIT_SHARING | ROLLOVER" }
      - { name: payroll_date, type: string, source: input, description: "ISO date amounts were withheld / payable" }
      - { name: deposit_date, type: string, source: input, description: "ISO date amounts were remitted to the trust" }
      - { name: amount_cents, type: integer, source: input, description: "Contribution amount in cents (> 0)" }
      - { name: match_status, type: enum, source: system, description: "UNMATCHED | MATCHED — parallel dimension 1 (trust reconciliation)" }
      - { name: timeliness_status, type: enum, source: system, description: "PENDING | ON_TIME | LATE | CORRECTED — parallel dimension 2 (remittance timing); independent of match_status" }
      - { name: trust_statement_id, type: string, source: system, default: null, description: "FK -> TrustStatement.id; set by match, cleared by unmatch" }
      - { name: business_days_elapsed, type: integer, source: computed, default: null, description: "Business days strictly after payroll_date through deposit_date (weekends excluded); null until scanned" }

  - name: TrustStatement
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: period_start, type: string, source: input, description: "ISO date; closed-interval lower bound of statement coverage" }
      - { name: period_end, type: string, source: input, description: "ISO date; closed-interval upper bound (inclusive)" }
      - { name: custodian, type: string, source: input, description: "Custodian / trustee name" }
      - { name: certification, type: enum, source: input, description: "CERTIFIED | UNCERTIFIED; certified statements demand full-plan-year gapless coverage" }
      - { name: reported_deposit_total_cents, type: integer, source: input, description: "Total deposits per the trust statement" }
      - { name: matched_contribution_cents, type: integer, source: computed, description: "Sum of amount_cents over contributions with match_status MATCHED and trust_statement_id == this statement" }
      - { name: adjustment_cents, type: integer, source: system, default: 0, description: "Reconciliation adjustment recorded at resolve" }
      - { name: unreconciled_deposit_cents, type: integer, source: computed, description: "= reported_deposit_total_cents - matched_contribution_cents - adjustment_cents" }
      - { name: status, type: enum, source: system, description: "IMPORTED | RECONCILED | DISCREPANCY | RESOLVED" }

  - name: NondiscriminationTestResult
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: test_type, type: enum, source: input, description: "ADP | ACP | COVERAGE_410B" }
      - { name: testing_method, type: enum, source: input, default: "CURRENT_YEAR", description: "CURRENT_YEAR | PRIOR_YEAR (ADP/ACP only)" }
      - { name: hce_avg_pct, type: number, source: computed, default: null, description: "Average deferral/contribution percentage of HCE group, 2dp half-up; null for COVERAGE_410B" }
      - { name: nhce_avg_pct, type: number, source: computed, default: null, description: "Average percentage of NHCE group, 2dp half-up; null for COVERAGE_410B" }
      - { name: max_allowed_hce_pct, type: number, source: computed, default: null, description: "max(1.25 x nhce_avg, min(2 x nhce_avg, nhce_avg + 2.00)); null for COVERAGE_410B" }
      - { name: coverage_ratio_pct, type: number, source: computed, default: null, description: "(benefiting NHCE / total NHCE) / (benefiting HCE / total HCE) x 100, 2dp half-up; null for ADP/ACP" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL" }
      - { name: excess_contribution_cents, type: integer, source: computed, default: 0, description: "ADP/ACP refund required by leveling method; 0 on PASS" }
      - { name: correction_deadline, type: string, source: computed, description: "ISO date; last day of the plan year following the plan year tested" }
      - { name: is_current_official, type: boolean, source: computed, description: "True on the latest FINAL result per (engagement, test_type); earlier FINAL results flip to false and status SUPERSEDED" }
      - { name: status, type: enum, source: system, description: "COMPUTED | FINAL | SUPERSEDED" }

  - name: LateContributionAssessment
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id" }
      - { name: contribution_id, type: string, source: system, description: "FK -> Contribution.id; one assessment per late contribution" }
      - { name: payroll_date, type: string, source: system, description: "Copied from the contribution at scan time" }
      - { name: deposit_date, type: string, source: system, description: "Copied from the contribution at scan time" }
      - { name: amount_cents, type: integer, source: system, description: "Copied from the contribution at scan time (late principal)" }
      - { name: business_days_late, type: integer, source: computed, description: "business_days_elapsed - remittance_standard_days" }
      - { name: lost_earnings_vfcp_cents, type: integer, source: computed, description: "Lost earnings under VFCP variant at scan rate; informational until a corrective action picks a variant" }
      - { name: severity_hint, type: enum, source: computed, description: "HIGH when business_days_late > 10, else MEDIUM; used for the auto-created finding" }
      - { name: status, type: enum, source: system, description: "ASSESSED | CONFIRMED | DISMISSED | CORRECTED" }

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: source, type: enum, source: system, description: "AUDITOR_MANUAL | LATE_DEPOSIT_AUTO | TEST_FAILURE_AUTO" }
      - { name: category, type: enum, source: input, description: "LATE_REMITTANCE | NONDISCRIMINATION_FAILURE | RECONCILIATION_BREAK | FEE_DISCLOSURE_GAP | FILING_DEFECT" }
      - { name: severity, type: enum, source: input, description: "HIGH | MEDIUM | LOW" }
      - { name: description, type: string, source: input, description: "Finding narrative" }
      - { name: contribution_id, type: string, source: input, default: null, description: "FK -> Contribution.id; optional link for LATE_REMITTANCE findings" }
      - { name: test_result_id, type: string, source: input, default: null, description: "FK -> NondiscriminationTestResult.id; optional link for NONDISCRIMINATION_FAILURE findings" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | CORRECTION_IN_PROGRESS | CORRECTED | VERIFIED_CLOSED | WAIVED" }

  - name: CorrectiveAction
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: finding_id, type: string, source: input, description: "FK -> AuditFinding.id; finding must be ACKNOWLEDGED or CORRECTION_IN_PROGRESS" }
      - { name: assessment_id, type: string, source: input, default: null, description: "FK -> LateContributionAssessment.id; required for LOST_EARNINGS_DEPOSIT, must be CONFIRMED" }
      - { name: participant_id, type: string, source: input, default: null, description: "FK -> Participant.id; required for CORRECTIVE_DISTRIBUTION and QNEC_CONTRIBUTION" }
      - { name: action_type, type: enum, source: input, description: "LOST_EARNINGS_DEPOSIT | CORRECTIVE_DISTRIBUTION | QNEC_CONTRIBUTION | QMAC_CONTRIBUTION | FEE_REDISCLOSURE" }
      - { name: principal_cents, type: integer, source: input, description: "Principal being corrected (late amount / excess amount) in cents (> 0)" }
      - { name: earnings_variant, type: enum, source: input, default: "VFCP", description: "VFCP | EPCRS; selects the lost_earnings_on_late_deposit variant" }
      - { name: earnings_cents, type: integer, source: computed, default: 0, description: "Computed per lost_earnings_on_late_deposit for LOST_EARNINGS_DEPOSIT; 0 for other types" }
      - { name: excise_tax_cents, type: integer, source: computed, default: 0, description: "10% of principal for CORRECTIVE_DISTRIBUTION executed after plan_year_end + 2.5 months; else 0" }
      - { name: total_amount_cents, type: integer, source: computed, description: "principal_cents + earnings_cents" }
      - { name: planned_execution_date, type: string, source: input, description: "ISO date used as the correction date in the earnings computation" }
      - { name: executed_date, type: string, source: system, default: null, description: "ISO date of execution (logical clock date at execute)" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of creator; drives segregation-of-duties check at approve" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approver" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | EXECUTED | VERIFIED | REJECTED | VOIDED" }

  - name: Form5500Filing
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; at most one filing per engagement ever" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULES_COMPLETE | READY_TO_FILE | FILED | ACCEPTED | REJECTED | AMENDED_DRAFT" }
      - { name: is_amendment, type: boolean, source: system, default: false, description: "True once an amendment has been submitted" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; drives segregation-of-duties check at mark_ready" }
      - { name: original_due_date, type: string, source: computed, description: "Last day of 7th month after plan year end, weekend-rolled forward (Saturday/Sunday -> Monday)" }
      - { name: effective_due_date, type: string, source: computed, description: "extended_due_date of the active GRANTED/USED extension if any, else original_due_date" }
      - { name: filed_date, type: string, source: system, default: null, description: "ISO date of submission (logical clock date at submit)" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "filed_date > effective_due_date at submit" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "DFVCP penalty when is_late and submitted with late_with_dfvcp: min(1000 x days_late, cap); cap 75000 (Schedule I) / 200000 (Schedule H)" }
      - { name: has_active_extension, type: boolean, source: computed, default: false, description: "True while a GRANTED extension exists" }

  - name: ScheduleEntry
    parent: null
    common_fields: true
    fields:
      - { name: filing_id, type: string, source: input, description: "FK -> Form5500Filing.id" }
      - { name: schedule_type, type: enum, source: input, description: "H | I | C | A" }
      - { name: line_item, type: string, source: input, description: "Schedule line identifier (e.g. 'H-2b total assets', 'C-1c service provider')" }
      - { name: amount_cents, type: integer, source: input, description: "Reported amount in cents (0 allowed for informational lines)" }
      - { name: payload, type: object, source: input, default: null, description: "Optional structured data; for Schedule C entries carries service_provider_fee_ids: array of ServiceProviderFee ids that MUST belong to the filing's engagement" }
      - { name: status, type: enum, source: system, description: "DRAFT | VERIFIED | LOCKED" }

  - name: ServiceProviderFee
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: provider_name, type: string, source: input, description: "Service provider legal name; aggregation key" }
      - { name: service_code, type: enum, source: input, description: "RECORDKEEPING | INVESTMENT_MANAGEMENT | LEGAL | AUDIT | CONSULTING | TPA | CUSTODIAL | OTHER" }
      - { name: compensation_type, type: enum, source: input, description: "DIRECT | INDIRECT | ELIGIBLE_INDIRECT" }
      - { name: amount_cents, type: integer, source: input, description: "Compensation received in cents (> 0)" }
      - { name: reportable_on_schedule_c, type: boolean, source: computed, description: "True when the provider's engagement-wide direct + non-eligible-indirect total >= 500000 cents" }

  - name: FilingExtension
    parent: null
    common_fields: true
    fields:
      - { name: filing_id, type: string, source: input, description: "FK -> Form5500Filing.id; one active extension per filing" }
      - { name: filed_date, type: string, source: input, description: "ISO date Form 5558 was filed" }
      - { name: extended_due_date, type: string, source: computed, description: "15th day of (original_due_date month + 3), weekend-rolled forward" }
      - { name: status, type: enum, source: system, description: "GRANTED | USED | EXPIRED" }

  - name: CorrectionProgramFiling
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: program, type: enum, source: input, description: "VFCP | EPCRS_SCP | EPCRS_VCP | EPCRS_AUDIT_CAP | DFVCP" }
      - { name: linked_finding_ids, type: array, source: input, description: "FK -> AuditFinding.id; array of finding ids being corrected through this program; all must belong to the engagement" }
      - { name: government_fee_cents, type: integer, source: input, description: "Program filing fee in cents (>= 0)" }
      - { name: status, type: enum, source: system, description: "DRAFTED | SUBMITTED | APPROVED | REJECTED | WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Engagement
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: DATA_COLLECTION
        trigger: "POST /plan-audit/engagements/{id}/activate"
        actor: SponsorAdmin
        preconditions: []
        side_effects: ["increments Engagement.version by 1"]
      - from: DATA_COLLECTION
        to: TESTING
        trigger: "POST /plan-audit/engagements/{id}/begin_testing"
        actor: TPASpecialist
        preconditions: []
        side_effects: ["increments Engagement.version by 1"]
      - from: TESTING
        to: FIELDWORK
        trigger: "POST /plan-audit/engagements/{id}/begin_fieldwork"
        actor: PlanAuditor
        preconditions:
          - "participant_count_beginning != null else ERR_PARTICIPANT_COUNT_REQUIRED"
        side_effects: ["increments Engagement.version by 1"]
      - from: FIELDWORK
        to: REPORT_ISSUED
        trigger: "POST /plan-audit/engagements/{id}/issue_report"
        actor: PlanAuditor
        preconditions:
          - "participant_count_beginning != null else ERR_PARTICIPANT_COUNT_REQUIRED"
          - "no NondiscriminationTestResult of this engagement may be in status COMPUTED else ERR_TEST_NOT_FINAL (every run test must be FINAL or SUPERSEDED before the report issues)"
        side_effects: ["increments Engagement.version by 1"]
      - from: FIELDWORK
        to: DATA_COLLECTION
        trigger: "POST /plan-audit/engagements/{id}/reopen_data_collection"
        actor: EngagementManager
        preconditions: []
        side_effects: ["increments Engagement.version by 1"]
        note: "cycle: new evidence returns the engagement to data collection"
      - from: REPORT_ISSUED
        to: FIELDWORK
        trigger: "POST /plan-audit/engagements/{id}/reopen_fieldwork"
        actor: EngagementManager
        preconditions: []
        side_effects: ["increments Engagement.version by 1"]
        note: "cycle: report reopen for additional procedures"
      - from: REPORT_ISSUED
        to: COMPLETED
        trigger: "POST /plan-audit/engagements/{id}/complete"
        actor: EngagementManager
        preconditions:
          - "FIRST: no AuditFinding in status OPEN / ACKNOWLEDGED / CORRECTION_IN_PROGRESS / CORRECTED else ERR_OPEN_FINDINGS_REMAIN"
          - "SECOND: if a Form5500Filing exists for the engagement it must have status ACCEPTED else ERR_INVALID_STATE_TRANSITION"
        side_effects: ["increments Engagement.version by 1"]
        note: "precondition order is pinned: the findings sweep is evaluated before the filing-status check"

  - entity: Contribution
    initial_state: "match_status=UNMATCHED, timeliness_status=PENDING"
    terminal_states: []
    note: "Two independent state dimensions on one entity (parallel dimensions). match_status evolves via match/unmatch; timeliness_status evolves via late-deposit-scan and corrective execution. Neither dimension gates the other."
    transitions:
      - from: "match_status=UNMATCHED"
        to: "match_status=MATCHED"
        trigger: "POST /plan-audit/contributions/{id}/match"
        actor: SponsorAdmin
        preconditions:
          - "trust_statement_id resolves to a TrustStatement of the same engagement else ERR_NOT_FOUND / ERR_STATEMENT_PERIOD_MISMATCH"
          - "contribution.deposit_date within [period_start, period_end] (closed interval) else ERR_STATEMENT_PERIOD_MISMATCH"
          - "statement status in {IMPORTED, DISCREPANCY} else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "trust_statement_id set; statement.matched_contribution_cents += amount_cents"
          - "statement.unreconciled_deposit_cents recomputed"
          - "Participant.account_balance_cents recomputed (matched contribution included)"
      - from: "match_status=MATCHED"
        to: "match_status=UNMATCHED"
        trigger: "POST /plan-audit/contributions/{id}/unmatch"
        actor: SponsorAdmin
        preconditions: []
        side_effects:
          - "trust_statement_id cleared; statement.matched_contribution_cents -= amount_cents [link 1]"
          - "statement.unreconciled_deposit_cents recomputed; if statement was RECONCILED and unreconciled != 0 it reverts to DISCREPANCY [link 2]"
          - "statement entering DISCREPANCY recomputes Engagement.posture (may become BLOCKED) [link 3]"
          - "Participant.account_balance_cents recomputed"
      - from: "timeliness_status=PENDING"
        to: "timeliness_status=ON_TIME"
        trigger: "POST /plan-audit/engagements/{id}/late-deposit-scan"
        actor: "TPASpecialist | PlanAuditor"
        preconditions: ["engagement.remittance_standard_days != null else ERR_PARTICIPANT_COUNT_REQUIRED"]
        side_effects: ["business_days_elapsed set"]
      - from: "timeliness_status=PENDING"
        to: "timeliness_status=LATE"
        trigger: "POST /plan-audit/engagements/{id}/late-deposit-scan"
        actor: "TPASpecialist | PlanAuditor"
        preconditions: ["business_days_elapsed > engagement.remittance_standard_days"]
        side_effects:
          - "a LateContributionAssessment (ASSESSED) is created for this contribution if none exists"
      - from: "timeliness_status=LATE"
        to: "timeliness_status=CORRECTED"
        trigger: "system (automatic when the linked LOST_EARNINGS_DEPOSIT corrective action reaches EXECUTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "timeliness_status=ON_TIME"
        to: "timeliness_status=LATE"
        trigger: "POST /plan-audit/engagements/{id}/late-deposit-scan (re-scan after remittance_standard_days changes)"
        actor: "TPASpecialist | PlanAuditor"
        preconditions: ["remittance standard recomputed to a smaller value"]
        side_effects: ["a LateContributionAssessment (ASSESSED) is created if none exists"]
        note: "cycle across the two dimensions: a re-scan can reclassify; a VOIDED correction does not revert timeliness"

  - entity: TrustStatement
    initial_state: IMPORTED
    terminal_states: []
    transitions:
      - from: IMPORTED
        to: RECONCILED
        trigger: "POST /plan-audit/trust-statements/{id}/reconcile"
        actor: TPASpecialist
        preconditions: ["unreconciled_deposit_cents == 0"]
        side_effects: ["Engagement.posture recomputed"]
      - from: IMPORTED
        to: DISCREPANCY
        trigger: "POST /plan-audit/trust-statements/{id}/reconcile"
        actor: TPASpecialist
        preconditions: ["unreconciled_deposit_cents != 0"]
        side_effects:
          - "Engagement.posture recomputed (DISCREPANCY forces BLOCKED)"
          - "if certification == CERTIFIED and union of the engagement's statements does not cover [plan_year_start, plan_year_end - 1 day] gaplessly, statement stays DISCREPANCY with gap note"
      - from: DISCREPANCY
        to: RESOLVED
        trigger: "POST /plan-audit/trust-statements/{id}/resolve"
        actor: EngagementManager
        preconditions: []
        side_effects:
          - "adjustment_cents recorded; unreconciled_deposit_cents recomputed"
          - "Engagement.posture recomputed"
      - from: DISCREPANCY
        to: RECONCILED
        trigger: "POST /plan-audit/trust-statements/{id}/reconcile (after matching the missing contributions)"
        actor: TPASpecialist
        preconditions: ["unreconciled_deposit_cents == 0"]
        side_effects: ["Engagement.posture recomputed"]
        note: "cycle: DISCREPANCY -> RECONCILED via re-reconcile; RECONCILED -> DISCREPANCY via unmatch"

  - entity: NondiscriminationTestResult
    initial_state: COMPUTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: COMPUTED
        to: FINAL
        trigger: "POST /plan-audit/test-results/{id}/finalize"
        actor: PlanAuditor
        preconditions: []
        side_effects:
          - "any prior FINAL result for the same (engagement_id, test_type) flips to SUPERSEDED with is_current_official=false; this result becomes is_current_official=true"
          - "if result == FAIL: an AuditFinding (source=TEST_FAILURE_AUTO, category=NONDISCRIMINATION_FAILURE, severity=HIGH, status=OPEN) is created [link 1]"
          - "the new OPEN HIGH finding recomputes Engagement.posture to BLOCKED [link 2]"
          - "posture entering BLOCKED reverts any Form5500Filing of this engagement in READY_TO_FILE back to SCHEDULES_COMPLETE [link 3]"

  - entity: LateContributionAssessment
    initial_state: ASSESSED
    terminal_states: [DISMISSED, CORRECTED]
    transitions:
      - from: ASSESSED
        to: CONFIRMED
        trigger: "POST /plan-audit/late-contribution-assessments/{id}/confirm"
        actor: PlanAuditor
        preconditions: []
        side_effects:
          - "an AuditFinding (source=LATE_DEPOSIT_AUTO, category=LATE_REMITTANCE, severity=severity_hint, status=OPEN, contribution_id=assessment.contribution_id) is created [link 1]"
          - "the new OPEN finding recomputes Engagement.posture (HIGH forces BLOCKED) [link 2]"
          - "posture entering BLOCKED reverts any Form5500Filing of this engagement in READY_TO_FILE back to SCHEDULES_COMPLETE [link 3]"
      - from: ASSESSED
        to: DISMISSED
        trigger: "POST /plan-audit/late-contribution-assessments/{id}/dismiss"
        actor: PlanAuditor
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CORRECTED
        trigger: "system (automatic when the linked LOST_EARNINGS_DEPOSIT corrective action reaches EXECUTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED, WAIVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /plan-audit/findings/{id}/acknowledge"
        actor: SponsorAdmin
        preconditions: []
        side_effects: []
      - from: OPEN
        to: WAIVED
        trigger: "POST /plan-audit/findings/{id}/waive"
        actor: EngagementManager
        preconditions:
          - "severity != HIGH else ERR_WAIVER_NOT_ALLOWED"
          - "justification non-empty else ERR_INVALID_REQUEST"
        side_effects: ["Engagement.posture recomputed"]
      - from: ACKNOWLEDGED
        to: WAIVED
        trigger: "POST /plan-audit/findings/{id}/waive"
        actor: EngagementManager
        preconditions: ["severity != HIGH else ERR_WAIVER_NOT_ALLOWED"]
        side_effects: ["Engagement.posture recomputed"]
      - from: ACKNOWLEDGED
        to: CORRECTION_IN_PROGRESS
        trigger: "system (automatic when a linked CorrectiveAction reaches APPROVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CORRECTION_IN_PROGRESS
        to: CORRECTED
        trigger: "system (automatic when all linked non-REJECTED/non-VOIDED CorrectiveActions reach EXECUTED or VERIFIED, with at least one such action)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CORRECTED
        to: CORRECTION_IN_PROGRESS
        trigger: "system (automatic when a linked CorrectiveAction in EXECUTED is VOIDED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "cycle: voiding a completed correction reopens the correction loop"
      - from: CORRECTED
        to: VERIFIED_CLOSED
        trigger: "POST /plan-audit/findings/{id}/verify_close"
        actor: PlanAuditor
        preconditions:
          - "all linked non-VOIDED CorrectiveActions have status VERIFIED else ERR_INVALID_STATE_TRANSITION"
        side_effects: ["Engagement.posture recomputed"]

  - entity: CorrectiveAction
    initial_state: PROPOSED
    terminal_states: [VERIFIED, REJECTED, VOIDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /plan-audit/corrective-actions/{id}/approve"
        actor: EngagementManager
        preconditions:
          - "finding.status in {ACKNOWLEDGED, CORRECTION_IN_PROGRESS} else ERR_CORRECTION_NOT_ALLOWED"
          - "X-User-ID != proposed_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "approved_by_user_id set"
          - "finding ACKNOWLEDGED -> CORRECTION_IN_PROGRESS"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /plan-audit/corrective-actions/{id}/void with reason starting 'REJECT:'"
        actor: EngagementManager
        preconditions: []
        side_effects: []
        note: "REJECTED is terminal; sponsor proposes a fresh action instead"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /plan-audit/corrective-actions/{id}/execute"
        actor: SponsorAdmin
        preconditions:
          - "for CORRECTIVE_DISTRIBUTION: total_amount_cents <= participant.account_balance_cents else ERR_DISTRIBUTION_EXCEEDS_BALANCE"
        side_effects:
          - "executed_date = logical clock date"
          - "excise_tax_cents computed for CORRECTIVE_DISTRIBUTION (10% of principal when executed_date > plan_year_end + 2.5 months)"
          - "Participant.account_balance_cents recomputed (deposit types credit, distribution debits total_amount_cents)"
          - "linked LateContributionAssessment (if any) -> CORRECTED; contribution timeliness -> CORRECTED"
          - "finding auto -> CORRECTED when all linked actions EXECUTED/VERIFIED"
      - from: EXECUTED
        to: VERIFIED
        trigger: "POST /plan-audit/corrective-actions/{id}/verify"
        actor: PlanAuditor
        preconditions: []
        side_effects: []
      - from: EXECUTED
        to: VOIDED
        trigger: "POST /plan-audit/corrective-actions/{id}/void"
        actor: EngagementManager
        preconditions: []
        side_effects:
          - "compensation: Participant.account_balance_cents reversed by exactly total_amount_cents (deposit types debited, distributions credited)"
          - "linked finding CORRECTED -> CORRECTION_IN_PROGRESS"
          - "linked LateContributionAssessment stays CORRECTED (no revert)"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /plan-audit/corrective-actions/{id}/void"
        actor: EngagementManager
        preconditions: []
        side_effects: []

  - entity: Form5500Filing
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SCHEDULES_COMPLETE
        trigger: "POST /plan-audit/filings/{id}/mark_schedules_complete"
        actor: TPASpecialist
        preconditions:
          - "required schedule set present: {engagement.required_schedule_type} plus C when any fee reportable plus A when funding_arrangement in {INSURANCE, SPLIT} else ERR_SCHEDULE_INCOMPLETE"
          - "every entry of a required schedule_type has status VERIFIED or LOCKED else ERR_SCHEDULE_NOT_VERIFIED"
        side_effects: []
      - from: AMENDED_DRAFT
        to: SCHEDULES_COMPLETE
        trigger: "POST /plan-audit/filings/{id}/mark_schedules_complete"
        actor: TPASpecialist
        preconditions: ["same required-schedule rules as from DRAFT"]
        side_effects: []
      - from: SCHEDULES_COMPLETE
        to: READY_TO_FILE
        trigger: "POST /plan-audit/filings/{id}/mark_ready"
        actor: EngagementManager
        preconditions:
          - "Engagement.posture != BLOCKED else ERR_ENGAGEMENT_BLOCKED"
          - "X-User-ID != created_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects: []
      - from: READY_TO_FILE
        to: SCHEDULES_COMPLETE
        trigger: "system (automatic when Engagement.posture enters BLOCKED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "posture-driven revert; cascaded from finding creation / test failure / unreconciled statement"
      - from: READY_TO_FILE
        to: FILED
        trigger: "POST /plan-audit/filings/{id}/submit"
        actor: EngagementManager
        preconditions:
          - "engagement.status == REPORT_ISSUED else ERR_INVALID_STATE_TRANSITION"
          - "engagement.audit_required == true implies engagement.auditor_report_ref != null else ERR_AUDIT_REPORT_MISSING"
          - "logical clock date <= effective_due_date, unless late_with_dfvcp == true, else ERR_FILING_DEADLINE_PASSED"
          - "late_with_dfvcp == true implies a CorrectionProgramFiling with program=DFVCP exists for the engagement else ERR_DFVCP_FILING_REQUIRED"
          - "no active extension in EXPIRED state blocks submit: an EXPIRED extension is informational only"
        side_effects:
          - "filed_date = logical clock date; is_late and penalty_cents computed (dfvcp_penalty)"
          - "all VERIFIED ScheduleEntries -> LOCKED"
          - "active GRANTED FilingExtension -> USED"
          - "is_amendment set true when submitted from an amendment cycle"
      - from: FILED
        to: ACCEPTED
        trigger: "POST /plan-audit/filings/{id}/record_disposition with outcome=ACCEPTED"
        actor: System
        preconditions: []
        side_effects: []
      - from: FILED
        to: REJECTED
        trigger: "POST /plan-audit/filings/{id}/record_disposition with outcome=REJECTED"
        actor: System
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /plan-audit/filings/{id}/reopen"
        actor: TPASpecialist
        preconditions: []
        side_effects: []
        note: "cycle: rejected filing returns to DRAFT for correction"
      - from: ACCEPTED
        to: AMENDED_DRAFT
        trigger: "POST /plan-audit/filings/{id}/amendments"
        actor: TPASpecialist
        preconditions:
          - "expected_filing_version == current Form5500Filing.version else ERR_STALE_FILING_VERSION"
        side_effects:
          - "increments Form5500Filing.version by 1"
        note: "amendment cycle: AMENDED_DRAFT -> SCHEDULES_COMPLETE -> READY_TO_FILE -> FILED -> ACCEPTED/REJECTED"

  - entity: ScheduleEntry
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /plan-audit/schedule-entries/{id}/verify"
        actor: PlanAuditor
        preconditions:
          - "filing status in {DRAFT, SCHEDULES_COMPLETE, AMENDED_DRAFT} else ERR_INVALID_STATE_TRANSITION"
          - "payload.service_provider_fee_ids (when present) all belong to the filing's engagement else ERR_FOREIGN_REFERENCE"
        side_effects: []
      - from: VERIFIED
        to: LOCKED
        trigger: "system (automatic on filing submit)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FilingExtension
    initial_state: GRANTED
    terminal_states: [USED, EXPIRED]
    transitions:
      - from: GRANTED
        to: USED
        trigger: "system (automatic on filing submit while extension active)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GRANTED
        to: EXPIRED
        trigger: "system (evaluated on read and on POST /_clock/set_current_utc when logical clock date > extended_due_date and filing not in {FILED, ACCEPTED})"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CorrectionProgramFiling
    initial_state: DRAFTED
    terminal_states: [APPROVED, WITHDRAWN]
    transitions:
      - from: DRAFTED
        to: SUBMITTED
        trigger: "POST /plan-audit/correction-program-filings/{id}/submit"
        actor: EngagementManager
        preconditions:
          - "every finding in linked_finding_ids has status in {CORRECTED, VERIFIED_CLOSED} else ERR_INVALID_STATE_TRANSITION"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /plan-audit/correction-program-filings/{id}/record_decision with outcome=APPROVED"
        actor: System
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plan-audit/correction-program-filings/{id}/record_decision with outcome=REJECTED"
        actor: System
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /plan-audit/correction-program-filings/{id}/submit"
        actor: EngagementManager
        preconditions: ["linked findings still in {CORRECTED, VERIFIED_CLOSED}"]
        side_effects: []
        note: "cycle: rejected program filing may be cured and resubmitted"
      - from: DRAFTED
        to: WITHDRAWN
        trigger: "POST /plan-audit/correction-program-filings/{id}/record_decision with outcome=WITHDRAWN"
        actor: System
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: test-result-supersede-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /plan-audit/test-results"
    occ_field: expected_engagement_version
    description: |
      Creating a NondiscriminationTestResult against an Engagement whose version
      has advanced since the client last observed it is rejected. Finalizing a
      result flips the prior official result of the same test_type to SUPERSEDED,
      so the client must hold a current view of the engagement before adding a
      new result that may supersede it.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

  - rule_id: filing-amend-stale-filing
    parent_entity: Form5500Filing
    write_endpoint: "POST /plan-audit/filings/{id}/amendments"
    occ_field: expected_filing_version
    description: |
      Amending an ACCEPTED Form5500Filing whose version has advanced since the
      client last observed it is rejected. An amendment legitimately supersedes
      the accepted snapshot, so a writer holding a stale filing version loses
      with ERR_STALE_FILING_VERSION.
    error_id: ERR_STALE_FILING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: participant_count_determination
    trigger: "POST /plan-audit/engagements/{id}/recompute_participant_count"
    algorithm: threshold
    input_set: |
      Participants of the engagement with is_eligible == true AND status in
      {ACTIVE, RETIRED_WITH_BALANCE} (always counted), or status in
      {SEPARATED_WITH_BALANCE, DECEASED} AND account_balance_cents > 0.
      SEPARATED_NO_BALANCE and zero-balance separated/deceased participants are
      excluded. Snapshot is taken as-of plan_year_start; entry dates are not
      re-evaluated (the census record is the beginning-of-year record).
    formula: |
      count = |eligible input set|
      if variant STANDARD (or election ineligible):
        audit_required   = (count >= AUDIT_THRESHOLD)          # >=, boundary-inclusive
        required_schedule_type = H if audit_required else I
      if variant EIGHTY_120_ELECTION and eligible
         (prior_year_schedule_type == I and EIGHTY_120_LOW <= count <= EIGHTY_120_HIGH):
        audit_required = false; required_schedule_type = I     # elected small-plan treatment
      if variant EIGHTY_120_ELECTION and not eligible: fall back to STANDARD
      remittance_standard_days = SMALL_PLAN_SAFE_HARBOR_DAYS if required_schedule_type == I
                                 else LARGE_PLAN_ADMIN_FEASIBLE_DAYS
    constants:
      AUDIT_THRESHOLD: 100
      EIGHTY_120_LOW: 80
      EIGHTY_120_HIGH: 120
      SMALL_PLAN_SAFE_HARBOR_DAYS: 7
      LARGE_PLAN_ADMIN_FEASIBLE_DAYS: 3
    precision: "integer counts; comparisons are exact"
    variants:
      - name: STANDARD
        when: "use_80120_election == false, or election not eligible"
        difference: "hard threshold at count >= 100; a 110-participant plan with prior-year Schedule I is a LARGE plan (H + audit)"
      - name: EIGHTY_120_ELECTION
        when: "use_80120_election == true AND prior_year_schedule_type == I AND 80 <= count <= 120"
        difference: "same 110-participant census files as SMALL plan (Schedule I, no audit) — divergent audit_required and remittance_standard_days (7 vs 3) for identical census data"

  - name: late_deposit_business_days
    trigger: "POST /plan-audit/engagements/{id}/late-deposit-scan"
    algorithm: chronological
    input_set: "All contributions of the engagement (re-scan reclassifies ON_TIME/LATE when remittance_standard_days changed); weekends (Saturday, Sunday) are the only non-business days"
    formula: |
      business_days_elapsed = count of days d with payroll_date < d <= deposit_date and weekday(d) in Mon..Fri
      is_late = business_days_elapsed > engagement.remittance_standard_days   # strictly greater; exactly-at-standard is ON_TIME
      business_days_late = business_days_elapsed - remittance_standard_days (only on LATE)
    constants: {}
    precision: "integer days; boundary at business_days_elapsed == remittance_standard_days is TIMELY"

  - name: lost_earnings_on_late_deposit
    trigger: "scan (informational VFCP figure on the assessment) and CorrectiveAction creation for LOST_EARNINGS_DEPOSIT"
    algorithm: tiered_pricing
    input_set: "Late principal P = contribution.amount_cents; segment 1 = payroll_date -> deposit_date; segment 2 = deposit_date -> correction_date (planned_execution_date of the corrective action)"
    formula: |
      # Pinned rounding order (mode b): round EACH segment to cents half-up, THEN sum.
      # Per-segment rounding then summing differs from summing raw values then rounding.
      rate = VFCP_UNDERPAYMENT_ANNUAL_PCT if variant VFCP else plan earnings rate (EPCRS_PLAN_ANNUAL_PCT)
      seg1 = round_half_up_cents(P * rate/100 * days(payroll_date, deposit_date) / 365)
      seg2 = round_half_up_cents(P * rate/100 * days(deposit_date, correction_date) / 365)
      lost_earnings_cents = seg1 + seg2
    constants:
      VFCP_UNDERPAYMENT_ANNUAL_PCT: 8.0
      EPCRS_PLAN_ANNUAL_PCT: 5.0
      DAY_BASIS: 365
    precision: "cents; round_half_up per segment, then sum (never sum-then-round)"
    variants:
      - name: VFCP
        when: "earnings_variant == VFCP (DOL Voluntary Fiduciary Correction Program)"
        difference: "uses the IRS s6621 underpayment rate (8.0%) for both segments"
      - name: EPCRS
        when: "earnings_variant == EPCRS (IRS correction program)"
        difference: "uses the plan's actual earnings rate proxy (5.0%) for both segments — identical dates and principal yield a lower figure than VFCP"

  - name: adp_test
    trigger: "POST /plan-audit/test-results with test_type=ADP (ACP uses the same shape on match/after-tax amounts)"
    algorithm: tiered_pricing
    input_set: "Participants with is_eligible == true AND status in {ACTIVE, SEPARATED_WITH_BALANCE, RETIRED_WITH_BALANCE} AND compensation_cy_cents > 0; DECEASED and SEPARATED_NO_BALANCE excluded"
    formula: |
      # Mode (a): >=3 inputs with nested min/max and a conditional branch.
      ADR(p) = round_half_up(deferral_amount_cy_cents * 100 / compensation_cy_cents, 4dp)
      nhce_avg = round_half_up(mean ADR over is_hce == false, 2dp)
      hce_avg  = round_half_up(mean ADR over is_hce == true, 2dp)
      max_allowed_hce_pct = max(1.25 * nhce_avg, min(2 * nhce_avg, nhce_avg + 2.00))   # each factor rounded 2dp half-up
      result = PASS if hce_avg <= max_allowed_hce_pct else FAIL                         # <= boundary-inclusive
    constants:
      AGGREGATE_LIMIT_FACTOR: 1.25
      ALT_LIMIT_MULTIPLIER: 2
      ALT_LIMIT_SPREAD: 2.00
    precision: "percentages at 2dp round_half_up; comparisons on rounded values"

  - name: adp_excess_leveling
    trigger: "inside adp_test when result == FAIL"
    algorithm: waterfall_allocation
    input_set: "HCEs in the ADP input set, ordered by ADR descending; ties break by Participant.created_at ascending, then external_ref ascending"
    formula: |
      # Mode (c): circular-looking dependency with pinned evaluation order.
      # (1) total ADR points to shed S = (hce_avg - max_allowed) * hce_count, 2dp half-up.
      # (2) Leveling: reduce the highest-ADR HCE until S points are shed or that ADR reaches
      #     the next-highest ADR; then reduce the top pair jointly, etc.
      # (3) excess_contribution_cents = sum over reduced HCEs of
      #     round_half_up_cents(adr_reduction_pct_points / 100 * compensation_cy_cents),
      #     rounded per participant, then summed.
      # (4) ACP (if run afterwards) MUST consume post-refund deferral figures — evaluation
      #     order ADP-refund-then-ACP is pinned; reversing the order is a defect.
      # (5) correction_deadline = last day of the plan year following the tested plan year.
    constants:
      EXCISE_TAX_PCT: 10
      EXCISE_WINDOW_MONTHS: 2.5
    precision: "cents; per-participant round_half_up then sum"

  - name: coverage_ratio_410b
    trigger: "POST /plan-audit/test-results with test_type=COVERAGE_410B"
    algorithm: threshold
    input_set: "All participants of the engagement; benefiting means is_eligible == true"
    formula: |
      ratio_pct = round_half_up( (benefiting_NHCE / total_NHCE) / (benefiting_HCE / total_HCE) * 100, 2dp )
      result = PASS if ratio_pct >= 70.00 else FAIL      # >= boundary-inclusive
      if total_HCE == 0 or total_NHCE == 0: ERR_INVALID_REQUEST (test not meaningful)
    constants:
      COVERAGE_RATIO_PASS_PCT: 70.00
    precision: "2dp round_half_up; comparison on rounded value"

  - name: schedule_c_fee_aggregation
    trigger: "POST /plan-audit/service-provider-fees (per-fee flag) and POST /plan-audit/engagements/{id}/compute-fee-disclosure (aggregate)"
    algorithm: aggregation
    input_set: "All ServiceProviderFee rows of the engagement, grouped by provider_name (exact string match)"
    formula: |
      per provider: reportable_total = sum(amount_cents where compensation_type in {DIRECT, INDIRECT})
      reportable_on_schedule_c(provider) = reportable_total >= SCHEDULE_C_THRESHOLD_CENTS   # >= boundary-inclusive
      ELIGIBLE_INDIRECT amounts are excluded from the threshold test (memo-only)
      compute-fee-disclosure upserts one DRAFT ScheduleEntry (schedule_type=C, line_item='C-1c <provider_name>') per reportable provider onto the given filing
    constants:
      SCHEDULE_C_THRESHOLD_CENTS: 500000
    precision: "integer cents; exact"

  - name: filing_deadline_and_extension
    trigger: "Form5500Filing creation; FilingExtension creation; submit lateness evaluation"
    algorithm: chronological
    input_set: "engagement.plan_year_end; logical clock date at submit"
    formula: |
      original_due_date_raw  = last day of the 7th month after plan year end
                               (plan_year_end 2026-01-01 i.e. PY2025 -> 2026-07-31)
      original_due_date      = weekend roll-forward of raw (Saturday/Sunday -> following Monday; weekdays only, no holiday calendar)
      extended_due_date_raw  = 15th day of month (original_due_date_raw.month + 3), year rolling over
      extended_due_date      = weekend roll-forward of extended_due_date_raw
      effective_due_date     = extended_due_date if an extension in {GRANTED, USED} exists else original_due_date
      is_late                = filed_date > effective_due_date          # strictly greater; filing ON the due date is timely
    constants:
      EXTENSION_MONTHS: 2.5
    precision: "date granularity; boundary at filed_date == effective_due_date is TIMELY"

  - name: dfvcp_penalty
    trigger: "filing submit when is_late == true and late_with_dfvcp == true"
    algorithm: threshold
    input_set: "filed_date, effective_due_date, engagement.required_schedule_type"
    formula: |
      days_late = calendar days from effective_due_date to filed_date
      raw = 1000 * days_late                                            # $10.00 per day, in cents
      cap = 75000 if engagement.required_schedule_type == I else 200000 # $750 small plan / $2,000 large plan
      penalty_cents = min(raw, cap)                                     # cap boundary-inclusive
    constants:
      DFVCP_PER_DAY_CENTS: 1000
      DFVCP_CAP_SMALL_CENTS: 75000
      DFVCP_CAP_LARGE_CENTS: 200000
    precision: "integer cents"

  - name: trust_reconciliation_difference
    trigger: "contribution match/unmatch, statement resolve, statement reconcile"
    algorithm: aggregation
    input_set: "Contributions of the engagement with match_status == MATCHED and trust_statement_id == statement.id"
    formula: |
      matched_contribution_cents   = sum(amount_cents over the input set)
      unreconciled_deposit_cents   = reported_deposit_total_cents - matched_contribution_cents - adjustment_cents
      reconcile: unreconciled == 0 -> RECONCILED else DISCREPANCY       # exact zero equality, signed
    constants: {}
    precision: "integer cents; signed (negative unreconciled = over-matched)"

  - name: posture_rule
    trigger: "any mutation of AuditFinding, NondiscriminationTestResult, TrustStatement, or Form5500Filing of the engagement"
    algorithm: constraint_propagation
    input_set: "all findings, current-official test results, trust statements, and the filing of the engagement"
    formula: |
      BLOCKED if (a) any AuditFinding with status OPEN and severity HIGH, or
                 (b) any NondiscriminationTestResult is_current_official with status FINAL and result FAIL, or
                 (c) any TrustStatement with status DISCREPANCY
      else AT_RISK if (a) any AuditFinding in {OPEN, ACKNOWLEDGED, CORRECTION_IN_PROGRESS, CORRECTED}, or
                      (b) a filing exists with logical clock date > effective_due_date and status not in {FILED, ACCEPTED}
      else ON_TRACK
      Side effect of ENTERING BLOCKED: any filing in READY_TO_FILE reverts to SCHEDULES_COMPLETE.
    constants: {}
    precision: "enum; deterministic given the input set"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's allowed role list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path and body resource ids must exist, validated left-to-right; FK ids in bodies must belong to the same engagement scope as the parent resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "Target resource must be in a state allowing the transition (covers ERR_INVALID_STATE_TRANSITION, ERR_AMENDMENT_NOT_ALLOWED, ERR_CORRECTION_NOT_ALLOWED, ERR_ASSESSMENT_NOT_CONFIRMED, ERR_PARTICIPANT_COUNT_REQUIRED, ERR_TEST_NOT_FINAL, ERR_ENGAGEMENT_BLOCKED)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Compliance guards: segregation of duties (proposer != approver; preparer != readiness approver), HIGH findings not waivable, audit-required filing cannot submit without attached IQPA report"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_WAIVER_NOT_ALLOWED | ERR_AUDIT_REPORT_MISSING"
    http_status: 409
    applies_to: "approve, waive, mark_ready, submit"
  - priority: 6
    category: business_temporal
    check: "Temporal rules: plan-year half-open overlap per (sponsor_ein, plan_number); trust-statement closed-interval overlap per engagement; deposit_date >= payroll_date; filing deadline / extension expiry"
    error_id: "ERR_PLAN_YEAR_OVERLAP | ERR_STATEMENT_PERIOD_OVERLAP | ERR_INVALID_DATE_ORDER | ERR_FILING_DEADLINE_PASSED | ERR_EXTENSION_EXPIRED"
    http_status: 409
    applies_to: "engagement create, trust-statement create, contribution create, filing submit, extension create"
  - priority: 7
    category: business_referential
    check: "Referential integrity: matched statement period covers deposit_date; Schedule C payload fee ids belong to the filing's engagement; late_with_dfvcp submit requires an existing DFVCP CorrectionProgramFiling"
    error_id: "ERR_STATEMENT_PERIOD_MISMATCH | ERR_FOREIGN_REFERENCE | ERR_DFVCP_FILING_REQUIRED"
    http_status: 422
    applies_to: "match, schedule-entry create/verify, filing submit"
  - priority: 8
    category: business_constraint
    check: "Uniqueness and completeness: participant external_ref unique per engagement; one Form5500Filing per engagement; one active FilingExtension per filing; required schedule set complete and verified"
    error_id: "ERR_DUPLICATE_PARTICIPANT_REF | ERR_FILING_ALREADY_EXISTS | ERR_EXTENSION_ALREADY_EXISTS | ERR_SCHEDULE_INCOMPLETE | ERR_SCHEDULE_NOT_VERIFIED"
    http_status: 409
    applies_to: "participant create, filing create, extension create, mark_schedules_complete"
  - priority: 9
    category: business_fiscal
    check: "Money sufficiency: corrective distribution total must not exceed the participant's account balance"
    error_id: ERR_DISTRIBUTION_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "corrective-action execute"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Engagement lifecycle ---
  - { method: POST, path: "/plan-audit/engagements", description: "Create an audit engagement (one plan, one plan year)", roles: [SponsorAdmin], code: 201, input: [sponsor_ein, plan_number, plan_name, plan_year_start, plan_year_end, plan_type, funding_arrangement, prior_year_schedule_type, "use_80120_election?"], output: Engagement, side_effects: ["status=DRAFT; posture=ON_TRACK; ERR_PLAN_YEAR_OVERLAP on half-open plan-year overlap per (sponsor_ein, plan_number)"] }
  - { method: GET, path: "/plan-audit/engagements", description: "List engagements", roles: [Any], code: 200, input: ["sponsor_ein?", "status?", "posture?", "limit?", "offset?"], output: "Engagement[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/engagements/{id}", description: "Get an engagement (posture and computed fields fresh)", roles: [Any], code: 200, input: [], output: Engagement, side_effects: [] }
  - { method: POST, path: "/plan-audit/engagements/{id}/activate", description: "DRAFT -> DATA_COLLECTION", roles: [SponsorAdmin], code: 200, input: [], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/plan-audit/engagements/{id}/begin_testing", description: "DATA_COLLECTION -> TESTING", roles: [TPASpecialist], code: 200, input: [], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/plan-audit/engagements/{id}/begin_fieldwork", description: "TESTING -> FIELDWORK (requires participant count)", roles: [PlanAuditor], code: 200, input: [], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/plan-audit/engagements/{id}/attach_audit_report", description: "Attach the IQPA audit report reference", roles: [PlanAuditor], code: 200, input: [auditor_report_ref], output: Engagement, side_effects: ["auditor_report_ref set; increments Engagement.version by 1"] }
  - { method: POST, path: "/plan-audit/engagements/{id}/issue_report", description: "FIELDWORK -> REPORT_ISSUED", roles: [PlanAuditor], code: 200, input: [], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/plan-audit/engagements/{id}/reopen_data_collection", description: "FIELDWORK -> DATA_COLLECTION (cycle)", roles: [EngagementManager], code: 200, input: [], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/plan-audit/engagements/{id}/reopen_fieldwork", description: "REPORT_ISSUED -> FIELDWORK (cycle)", roles: [EngagementManager], code: 200, input: [], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/plan-audit/engagements/{id}/complete", description: "REPORT_ISSUED -> COMPLETED", roles: [EngagementManager], code: 200, input: [], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/plan-audit/engagements/{id}/recompute_participant_count", description: "Run participant_count_determination; refreshes count, audit_required, required_schedule_type, remittance_standard_days", roles: [TPASpecialist], code: 200, input: [], output: Engagement, side_effects: ["participant_count_beginning, audit_required, required_schedule_type, remittance_standard_days recomputed; increments Engagement.version by 1; allowed only while status in {DRAFT, DATA_COLLECTION, TESTING, FIELDWORK}"] }
  - { method: POST, path: "/plan-audit/engagements/{id}/late-deposit-scan", description: "Classify contribution timeliness and create LateContributionAssessments for late deposits", roles: [TPASpecialist, PlanAuditor], code: 200, input: [], output: "LateContributionAssessment[]", side_effects: ["timeliness_status transitions; LateContributionAssessment (ASSESSED) created per newly-late contribution; requires remittance_standard_days != null else ERR_PARTICIPANT_COUNT_REQUIRED"] }
  - { method: POST, path: "/plan-audit/engagements/{id}/compute-fee-disclosure", description: "Aggregate provider fees and upsert Schedule C DRAFT entries onto the given filing", roles: [TPASpecialist], code: 200, input: [filing_id], output: "{ reportable_provider_count: integer, reportable_total_cents: integer, schedule_entry_ids: array }", side_effects: ["DRAFT ScheduleEntry per reportable provider on the filing"] }

  # --- Participants ---
  - { method: POST, path: "/plan-audit/participants", description: "Create one census participant", roles: [SponsorAdmin], code: 201, input: [engagement_id, external_ref, eligibility_date, entry_date, is_eligible, is_hce, compensation_cy_cents, deferral_amount_cy_cents, opening_balance_cents, "status?"], output: Participant, side_effects: ["status defaults ACTIVE; ERR_DUPLICATE_PARTICIPANT_REF on duplicate external_ref within the engagement"] }
  - { method: POST, path: "/plan-audit/participants/bulk-import", description: "Create `count` participants from a uniform template; external_ref = external_ref_prefix + '-' + zero-padded 3-digit ordinal (001..count)", roles: [SponsorAdmin], code: 201, input: [engagement_id, count, external_ref_prefix, template], output: "Participant[]", side_effects: ["template keys: eligibility_date, entry_date, is_eligible, is_hce, compensation_cy_cents, deferral_amount_cy_cents, opening_balance_cents; atomic — any duplicate ref aborts the whole import with ERR_DUPLICATE_PARTICIPANT_REF"] }
  - { method: GET, path: "/plan-audit/participants", description: "List participants", roles: [Any], code: 200, input: ["engagement_id?", "status?", "is_hce?", "is_eligible?", "limit?", "offset?"], output: "Participant[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/participants/{id}", description: "Get a participant", roles: [Any], code: 200, input: [], output: Participant, side_effects: [] }
  - { method: PATCH, path: "/plan-audit/participants/{id}", description: "Update census attributes (separation, HCE reclassification, balance true-up)", roles: [SponsorAdmin], code: 200, input: ["status?", "is_eligible?", "is_hce?", "compensation_cy_cents?", "deferral_amount_cy_cents?", "opening_balance_cents?"], output: Participant, side_effects: ["account_balance_cents recomputed; increments Participant.version by 1"] }

  # --- Contributions & trust ---
  - { method: POST, path: "/plan-audit/contributions", description: "Record a contribution", roles: [SponsorAdmin], code: 201, input: [engagement_id, participant_id, type, payroll_date, deposit_date, amount_cents], output: Contribution, side_effects: ["match_status=UNMATCHED, timeliness_status=PENDING; ERR_INVALID_DATE_ORDER when deposit_date < payroll_date"] }
  - { method: GET, path: "/plan-audit/contributions", description: "List contributions", roles: [Any], code: 200, input: ["engagement_id?", "participant_id?", "trust_statement_id?", "match_status?", "timeliness_status?", "limit?", "offset?"], output: "Contribution[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/contributions/{id}", description: "Get a contribution", roles: [Any], code: 200, input: [], output: Contribution, side_effects: [] }
  - { method: POST, path: "/plan-audit/contributions/{id}/match", description: "Match a contribution to a trust statement deposit", roles: [SponsorAdmin], code: 200, input: [trust_statement_id], output: Contribution, side_effects: ["match_status -> MATCHED; statement matched/unreconciled recomputed; participant balance recomputed"] }
  - { method: POST, path: "/plan-audit/contributions/{id}/unmatch", description: "Unmatch a previously matched contribution", roles: [SponsorAdmin], code: 200, input: [], output: Contribution, side_effects: ["match_status -> UNMATCHED; statement may revert RECONCILED -> DISCREPANCY; posture recomputed; participant balance recomputed"] }
  - { method: POST, path: "/plan-audit/trust-statements", description: "Import a trust statement", roles: [SponsorAdmin], code: 201, input: [engagement_id, period_start, period_end, custodian, certification, reported_deposit_total_cents], output: TrustStatement, side_effects: ["status=IMPORTED; ERR_STATEMENT_PERIOD_OVERLAP on closed-interval overlap within the engagement"] }
  - { method: GET, path: "/plan-audit/trust-statements", description: "List trust statements", roles: [Any], code: 200, input: ["engagement_id?", "status?", "limit?", "offset?"], output: "TrustStatement[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/trust-statements/{id}", description: "Get a trust statement", roles: [Any], code: 200, input: [], output: TrustStatement, side_effects: [] }
  - { method: POST, path: "/plan-audit/trust-statements/{id}/reconcile", description: "Recompute reconciliation and flip IMPORTED/DISCREPANCY -> RECONCILED or DISCREPANCY", roles: [TPASpecialist], code: 200, input: [], output: TrustStatement, side_effects: ["status per trust_reconciliation_difference; posture recomputed"] }
  - { method: POST, path: "/plan-audit/trust-statements/{id}/resolve", description: "Record an adjustment resolving a discrepancy", roles: [EngagementManager], code: 200, input: [adjustment_cents, note], output: TrustStatement, side_effects: ["DISCREPANCY -> RESOLVED; adjustment_cents recorded; posture recomputed"] }

  # --- Nondiscrimination testing ---
  - { method: POST, path: "/plan-audit/test-results", description: "Compute a nondiscrimination/coverage test (OCC on Engagement)", roles: [TPASpecialist], code: 201, input: [engagement_id, test_type, "testing_method?", expected_engagement_version], output: NondiscriminationTestResult, side_effects: ["runs adp_test / coverage_ratio_410b; status=COMPUTED; increments Engagement.version by 1; ERR_STALE_ENGAGEMENT_VERSION on version mismatch"] }
  - { method: GET, path: "/plan-audit/test-results", description: "List test results", roles: [Any], code: 200, input: ["engagement_id?", "test_type?", "status?", "is_current_official?", "limit?", "offset?"], output: "NondiscriminationTestResult[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/test-results/{id}", description: "Get a test result", roles: [Any], code: 200, input: [], output: NondiscriminationTestResult, side_effects: [] }
  - { method: POST, path: "/plan-audit/test-results/{id}/finalize", description: "COMPUTED -> FINAL; supersedes prior official result; FAIL auto-creates a HIGH finding", roles: [PlanAuditor], code: 200, input: [], output: NondiscriminationTestResult, side_effects: ["supersede prior FINAL of same test_type; FAIL -> AuditFinding(OPEN,HIGH) -> posture BLOCKED -> READY_TO_FILE filing reverts"] }

  # --- Late contribution assessments ---
  - { method: GET, path: "/plan-audit/late-contribution-assessments", description: "List late contribution assessments", roles: [Any], code: 200, input: ["engagement_id?", "contribution_id?", "status?", "limit?", "offset?"], output: "LateContributionAssessment[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/late-contribution-assessments/{id}", description: "Get an assessment", roles: [Any], code: 200, input: [], output: LateContributionAssessment, side_effects: [] }
  - { method: POST, path: "/plan-audit/late-contribution-assessments/{id}/confirm", description: "Confirm a late deposit; auto-creates the audit finding", roles: [PlanAuditor], code: 200, input: [], output: LateContributionAssessment, side_effects: ["ASSESSED -> CONFIRMED; AuditFinding created; posture recomputed"] }
  - { method: POST, path: "/plan-audit/late-contribution-assessments/{id}/dismiss", description: "Dismiss an assessment as not late", roles: [PlanAuditor], code: 200, input: [reason], output: LateContributionAssessment, side_effects: ["ASSESSED -> DISMISSED"] }

  # --- Findings ---
  - { method: POST, path: "/plan-audit/findings", description: "Create a manual audit finding", roles: [PlanAuditor], code: 201, input: [engagement_id, category, severity, description, "contribution_id?", "test_result_id?"], output: AuditFinding, side_effects: ["status=OPEN; source=AUDITOR_MANUAL; posture recomputed"] }
  - { method: GET, path: "/plan-audit/findings", description: "List findings", roles: [Any], code: 200, input: ["engagement_id?", "status?", "severity?", "category?", "contribution_id?", "test_result_id?", "limit?", "offset?"], output: "AuditFinding[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/findings/{id}", description: "Get a finding", roles: [Any], code: 200, input: [], output: AuditFinding, side_effects: [] }
  - { method: POST, path: "/plan-audit/findings/{id}/acknowledge", description: "Sponsor acknowledges a finding", roles: [SponsorAdmin], code: 200, input: [], output: AuditFinding, side_effects: ["OPEN -> ACKNOWLEDGED"] }
  - { method: POST, path: "/plan-audit/findings/{id}/waive", description: "Waive a non-HIGH finding with justification", roles: [EngagementManager], code: 200, input: [justification], output: AuditFinding, side_effects: ["-> WAIVED; posture recomputed; ERR_WAIVER_NOT_ALLOWED on HIGH"] }
  - { method: POST, path: "/plan-audit/findings/{id}/verify_close", description: "Auditor verifies and closes a corrected finding", roles: [PlanAuditor], code: 200, input: [], output: AuditFinding, side_effects: ["CORRECTED -> VERIFIED_CLOSED; posture recomputed"] }

  # --- Corrective actions ---
  - { method: POST, path: "/plan-audit/corrective-actions", description: "Propose a corrective action against a non-terminal finding (OPEN, ACKNOWLEDGED, or CORRECTION_IN_PROGRESS); approval is what requires acknowledgment", roles: [SponsorAdmin], code: 201, input: [engagement_id, finding_id, action_type, principal_cents, planned_execution_date, "participant_id?", "assessment_id?", "earnings_variant?"], output: CorrectiveAction, side_effects: ["status=PROPOSED; earnings_cents computed for LOST_EARNINGS_DEPOSIT; ERR_ASSESSMENT_NOT_CONFIRMED when assessment_id not CONFIRMED; ERR_CORRECTION_NOT_ALLOWED when finding is CORRECTED, VERIFIED_CLOSED, or WAIVED"] }
  - { method: GET, path: "/plan-audit/corrective-actions", description: "List corrective actions", roles: [Any], code: 200, input: ["engagement_id?", "finding_id?", "participant_id?", "assessment_id?", "status?", "limit?", "offset?"], output: "CorrectiveAction[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/corrective-actions/{id}", description: "Get a corrective action", roles: [Any], code: 200, input: [], output: CorrectiveAction, side_effects: [] }
  - { method: POST, path: "/plan-audit/corrective-actions/{id}/approve", description: "Approve a proposed action (SoD: approver != proposer)", roles: [EngagementManager], code: 200, input: [], output: CorrectiveAction, side_effects: ["PROPOSED -> APPROVED; finding -> CORRECTION_IN_PROGRESS"] }
  - { method: POST, path: "/plan-audit/corrective-actions/{id}/execute", description: "Execute an approved action; applies balance effects", roles: [SponsorAdmin], code: 200, input: [], output: CorrectiveAction, side_effects: ["APPROVED -> EXECUTED; executed_date from logical clock; excise tax computed; participant balance applied; assessment/contribution -> CORRECTED; finding may auto-CORRECT"] }
  - { method: POST, path: "/plan-audit/corrective-actions/{id}/verify", description: "Auditor verifies an executed action", roles: [PlanAuditor], code: 200, input: [], output: CorrectiveAction, side_effects: ["EXECUTED -> VERIFIED"] }
  - { method: POST, path: "/plan-audit/corrective-actions/{id}/void", description: "Void an action; on EXECUTED reverses balance effects exactly", roles: [EngagementManager], code: 200, input: [reason], output: CorrectiveAction, side_effects: ["-> VOIDED (or REJECTED when reason starts 'REJECT:' from PROPOSED); compensating balance reversal; finding may revert to CORRECTION_IN_PROGRESS"] }

  # --- Service provider fees (Schedule C) ---
  - { method: POST, path: "/plan-audit/service-provider-fees", description: "Record a service provider fee", roles: [SponsorAdmin], code: 201, input: [engagement_id, provider_name, service_code, compensation_type, amount_cents], output: ServiceProviderFee, side_effects: ["reportable_on_schedule_c recomputed for this provider's rows"] }
  - { method: GET, path: "/plan-audit/service-provider-fees", description: "List service provider fees", roles: [Any], code: 200, input: ["engagement_id?", "provider_name?", "service_code?", "reportable_on_schedule_c?", "limit?", "offset?"], output: "ServiceProviderFee[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/service-provider-fees/{id}", description: "Get a fee row", roles: [Any], code: 200, input: [], output: ServiceProviderFee, side_effects: [] }

  # --- Form 5500 filing ---
  - { method: POST, path: "/plan-audit/filings", description: "Create the engagement's Form 5500 filing (one per engagement)", roles: [TPASpecialist], code: 201, input: [engagement_id], output: Form5500Filing, side_effects: ["status=DRAFT; original_due_date/effective_due_date computed; created_by_user_id from X-User-ID; ERR_FILING_ALREADY_EXISTS when a filing already exists"] }
  - { method: GET, path: "/plan-audit/filings", description: "List filings", roles: [Any], code: 200, input: ["engagement_id?", "status?", "limit?", "offset?"], output: "Form5500Filing[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/filings/{id}", description: "Get a filing", roles: [Any], code: 200, input: [], output: Form5500Filing, side_effects: [] }
  - { method: POST, path: "/plan-audit/schedule-entries", description: "Add a schedule line (H/I/C/A) to a filing", roles: [TPASpecialist], code: 201, input: [filing_id, schedule_type, line_item, amount_cents, "payload?"], output: ScheduleEntry, side_effects: ["status=DRAFT; ERR_FOREIGN_REFERENCE when payload.service_provider_fee_ids point outside the filing's engagement"] }
  - { method: GET, path: "/plan-audit/schedule-entries", description: "List schedule entries", roles: [Any], code: 200, input: ["filing_id?", "schedule_type?", "status?", "limit?", "offset?"], output: "ScheduleEntry[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/schedule-entries/{id}", description: "Get a schedule entry", roles: [Any], code: 200, input: [], output: ScheduleEntry, side_effects: [] }
  - { method: POST, path: "/plan-audit/schedule-entries/{id}/verify", description: "Auditor verifies a schedule entry", roles: [PlanAuditor], code: 200, input: [], output: ScheduleEntry, side_effects: ["DRAFT -> VERIFIED"] }
  - { method: POST, path: "/plan-audit/filings/{id}/mark_schedules_complete", description: "DRAFT/AMENDED_DRAFT -> SCHEDULES_COMPLETE when required set verified", roles: [TPASpecialist], code: 200, input: [], output: Form5500Filing, side_effects: [] }
  - { method: POST, path: "/plan-audit/filings/{id}/mark_ready", description: "SCHEDULES_COMPLETE -> READY_TO_FILE (SoD: caller != filing creator; posture must not be BLOCKED)", roles: [EngagementManager], code: 200, input: [], output: Form5500Filing, side_effects: [] }
  - { method: POST, path: "/plan-audit/filings/{id}/submit", description: "Submit to EFAST2; computes lateness and DFVCP penalty", roles: [EngagementManager], code: 200, input: ["late_with_dfvcp?"], output: Form5500Filing, side_effects: ["READY_TO_FILE -> FILED; filed_date set; schedules LOCKED; extension USED; penalty computed when late"] }
  - { method: POST, path: "/plan-audit/filings/{id}/record_disposition", description: "Record the EFAST2 disposition (ACCEPTED / REJECTED)", roles: [System], code: 200, input: [outcome, "rejection_reason?"], output: Form5500Filing, side_effects: ["FILED -> ACCEPTED | REJECTED"] }
  - { method: POST, path: "/plan-audit/filings/{id}/reopen", description: "REJECTED -> DRAFT for correction", roles: [TPASpecialist], code: 200, input: [], output: Form5500Filing, side_effects: [] }
  - { method: POST, path: "/plan-audit/filings/{id}/amendments", description: "Amend an ACCEPTED filing (OCC on filing version)", roles: [TPASpecialist], code: 200, input: [expected_filing_version, amendment_reason], output: Form5500Filing, side_effects: ["ACCEPTED -> AMENDED_DRAFT; increments Form5500Filing.version by 1; ERR_AMENDMENT_NOT_ALLOWED from other states; ERR_STALE_FILING_VERSION on mismatch"] }

  # --- Filing extension (Form 5558) ---
  - { method: POST, path: "/plan-audit/filing-extensions", description: "File Form 5558; granted immediately with computed extended due date", roles: [TPASpecialist], code: 201, input: [filing_id, filed_date], output: FilingExtension, side_effects: ["status=GRANTED; extended_due_date computed; ERR_EXTENSION_ALREADY_EXISTS when an active (GRANTED) extension exists; ERR_INVALID_STATE_TRANSITION when filing already FILED/ACCEPTED; ERR_EXTENSION_EXPIRED when logical clock date > filing.original_due_date"] }
  - { method: GET, path: "/plan-audit/filing-extensions", description: "List extensions", roles: [Any], code: 200, input: ["filing_id?", "status?", "limit?", "offset?"], output: "FilingExtension[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/filing-extensions/{id}", description: "Get an extension", roles: [Any], code: 200, input: [], output: FilingExtension, side_effects: [] }

  # --- DOL/IRS correction programs ---
  - { method: POST, path: "/plan-audit/correction-program-filings", description: "Draft a VFCP/EPCRS/DFVCP filing", roles: [EngagementManager], code: 201, input: [engagement_id, program, linked_finding_ids, government_fee_cents], output: CorrectionProgramFiling, side_effects: ["status=DRAFTED; linked findings must belong to the engagement else ERR_NOT_FOUND"] }
  - { method: GET, path: "/plan-audit/correction-program-filings", description: "List correction program filings", roles: [Any], code: 200, input: ["engagement_id?", "program?", "status?", "linked_finding_ids?", "limit?", "offset?"], output: "CorrectionProgramFiling[]", side_effects: [] }
  - { method: GET, path: "/plan-audit/correction-program-filings/{id}", description: "Get a correction program filing", roles: [Any], code: 200, input: [], output: CorrectionProgramFiling, side_effects: [] }
  - { method: POST, path: "/plan-audit/correction-program-filings/{id}/submit", description: "Submit to the agency; all linked findings must be CORRECTED or VERIFIED_CLOSED", roles: [EngagementManager], code: 200, input: [], output: CorrectionProgramFiling, side_effects: ["DRAFTED/REJECTED -> SUBMITTED"] }
  - { method: POST, path: "/plan-audit/correction-program-filings/{id}/record_decision", description: "Record agency decision (APPROVED / REJECTED / WITHDRAWN)", roles: [System], code: 200, input: [outcome, "notes?"], output: CorrectionProgramFiling, side_effects: ["SUBMITTED -> APPROVED | REJECTED; DRAFTED -> WITHDRAWN"] }

  # --- Logical clock (test-driving endpoint) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. Setting the clock re-evaluates time-driven rules (extension EXPIRED, posture AT_RISK deadline arm)", roles: [System], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["extensions past extended_due_date with unfiled returns -> EXPIRED"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not in the endpoint's allowed roles" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (or FK points outside the engagement scope)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, non-positive amount, empty justification, invalid enum" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource not in a state that allows the requested transition" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same X-User-ID attempted two SoD-paired steps (propose/approve corrective action; create/mark_ready filing)" }
  - { id: ERR_PLAN_YEAR_OVERLAP, http: 409, condition: "Half-open [plan_year_start, plan_year_end) overlaps another engagement with the same (sponsor_ein, plan_number); adjacency is allowed" }
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 409, condition: "Closed [period_start, period_end] overlaps another statement of the same engagement; adjacency (next.start == prev.end + 1 day) is allowed" }
  - { id: ERR_STATEMENT_PERIOD_MISMATCH, http: 422, condition: "Contribution deposit_date outside the target statement's closed period, or statement belongs to another engagement" }
  - { id: ERR_INVALID_DATE_ORDER, http: 422, condition: "deposit_date earlier than payroll_date" }
  - { id: ERR_DUPLICATE_PARTICIPANT_REF, http: 409, condition: "external_ref already used by another participant of the same engagement" }
  - { id: ERR_FILING_ALREADY_EXISTS, http: 409, condition: "Engagement already has a Form5500Filing" }
  - { id: ERR_AUDIT_REPORT_MISSING, http: 409, condition: "audit_required engagement submitting a filing without an attached IQPA audit report" }
  - { id: ERR_FILING_DEADLINE_PASSED, http: 409, condition: "Submit with logical clock date > effective_due_date without late_with_dfvcp=true" }
  - { id: ERR_DFVCP_FILING_REQUIRED, http: 422, condition: "late_with_dfvcp=true but no CorrectionProgramFiling with program=DFVCP exists for the engagement" }
  - { id: ERR_EXTENSION_ALREADY_EXISTS, http: 409, condition: "An active (GRANTED) extension already exists for the filing" }
  - { id: ERR_EXTENSION_EXPIRED, http: 409, condition: "Form 5558 extension requested when the logical clock date is already past the filing's original_due_date (extensions must be filed by the original deadline), or an operation relies on an extension whose extended_due_date has passed" }
  - { id: ERR_SCHEDULE_INCOMPLETE, http: 409, condition: "Required schedule type (H or I, plus C when reportable fees exist, plus A when INSURANCE/SPLIT) has no entries" }
  - { id: ERR_SCHEDULE_NOT_VERIFIED, http: 409, condition: "A required schedule entry is still DRAFT at mark_schedules_complete" }
  - { id: ERR_FOREIGN_REFERENCE, http: 422, condition: "Schedule C payload references ServiceProviderFee ids of a different engagement" }
  - { id: ERR_DISTRIBUTION_EXCEEDS_BALANCE, http: 422, condition: "Corrective distribution total exceeds the participant's account_balance_cents" }
  - { id: ERR_WAIVER_NOT_ALLOWED, http: 409, condition: "Waive attempted on a HIGH severity finding" }
  - { id: ERR_CORRECTION_NOT_ALLOWED, http: 409, condition: "Corrective action created/approved against a finding not in ACKNOWLEDGED/CORRECTION_IN_PROGRESS" }
  - { id: ERR_ASSESSMENT_NOT_CONFIRMED, http: 409, condition: "LOST_EARNINGS_DEPOSIT references an assessment not in CONFIRMED status" }
  - { id: ERR_OPEN_FINDINGS_REMAIN, http: 409, condition: "Engagement completion attempted with findings not yet VERIFIED_CLOSED or WAIVED" }
  - { id: ERR_PARTICIPANT_COUNT_REQUIRED, http: 409, condition: "Operation requires a computed participant count (recompute_participant_count not yet run)" }
  - { id: ERR_TEST_NOT_FINAL, http: 409, condition: "issue_report attempted while a current-official test result is still COMPUTED" }
  - { id: ERR_ENGAGEMENT_BLOCKED, http: 409, condition: "Engagement posture BLOCKED gates filing readiness" }
  - { id: ERR_STALE_ENGAGEMENT_VERSION, http: 412, condition: "expected_engagement_version does not match the engagement's current version" }
  - { id: ERR_STALE_FILING_VERSION, http: 412, condition: "expected_filing_version does not match the filing's current version" }
  - { id: ERR_AMENDMENT_NOT_ALLOWED, http: 409, condition: "Amendment attempted on a filing not in ACCEPTED status" }

# =============================================================================
# §1.7 RBAC Matrix (all roles opaque; SoD enforced via tracked X-User-ID)
# =============================================================================
roles:
  - name: SponsorAdmin
    description: "Plan sponsor operations staff: census, contributions, trust statements, fees; proposes and executes corrective actions; acknowledges findings"
    identity: opaque
    exclusive_operations:
      - "POST /plan-audit/engagements, POST .../activate"
      - "POST /plan-audit/participants, POST .../participants/bulk-import, PATCH .../participants/{id}"
      - "POST /plan-audit/contributions, POST .../contributions/{id}/match, POST .../contributions/{id}/unmatch"
      - "POST /plan-audit/trust-statements"
      - "POST /plan-audit/service-provider-fees"
      - "POST /plan-audit/findings/{id}/acknowledge"
      - "POST /plan-audit/corrective-actions, POST .../corrective-actions/{id}/execute"
    shared_operations: ["GET endpoints (as Any)"]
  - name: TPASpecialist
    description: "Third-party administrator: participant counts, nondiscrimination testing, late-deposit scans, fee disclosure, schedule preparation, filing assembly, extensions, amendments"
    identity: opaque
    exclusive_operations:
      - "POST /plan-audit/engagements/{id}/begin_testing, .../recompute_participant_count, .../compute-fee-disclosure"
      - "POST /plan-audit/test-results"
      - "POST /plan-audit/trust-statements/{id}/reconcile"
      - "POST /plan-audit/filings, POST /plan-audit/schedule-entries, POST .../mark_schedules_complete, POST .../reopen, POST .../amendments"
      - "POST /plan-audit/filing-extensions"
    shared_operations:
      - "POST /plan-audit/engagements/{id}/late-deposit-scan (shared with PlanAuditor)"
      - "GET endpoints (as Any)"
  - name: PlanAuditor
    description: "Independent qualified public accountant: fieldwork, test finalization, findings, assessment confirmation, verification steps"
    identity: opaque
    exclusive_operations:
      - "POST /plan-audit/engagements/{id}/begin_fieldwork, .../attach_audit_report, .../issue_report"
      - "POST /plan-audit/test-results/{id}/finalize"
      - "POST /plan-audit/findings, POST .../findings/{id}/verify_close"
      - "POST /plan-audit/late-contribution-assessments/{id}/confirm, .../dismiss"
      - "POST /plan-audit/corrective-actions/{id}/verify"
      - "POST /plan-audit/schedule-entries/{id}/verify"
    shared_operations:
      - "POST /plan-audit/engagements/{id}/late-deposit-scan (shared with TPASpecialist)"
      - "GET endpoints (as Any)"
  - name: EngagementManager
    description: "Firm partner / sponsor officer with approval authority: corrective action approval, waivers, filing readiness and submission, discrepancy resolution, completion, correction program filings"
    identity: opaque
    exclusive_operations:
      - "POST /plan-audit/engagements/{id}/reopen_data_collection, .../reopen_fieldwork, .../complete"
      - "POST /plan-audit/trust-statements/{id}/resolve"
      - "POST /plan-audit/findings/{id}/waive"
      - "POST /plan-audit/corrective-actions/{id}/approve, .../void"
      - "POST /plan-audit/filings/{id}/mark_ready, .../submit"
      - "POST /plan-audit/correction-program-filings, .../submit"
    shared_operations: ["GET endpoints (as Any)"]
  - name: System
    description: "Automation: EFAST2 disposition, agency decisions, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /plan-audit/filings/{id}/record_disposition"
      - "POST /plan-audit/correction-program-filings/{id}/record_decision"
      - "POST /_clock/set_current_utc"
    shared_operations: []
  - name: Any
    description: "All authenticated roles share read access"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
