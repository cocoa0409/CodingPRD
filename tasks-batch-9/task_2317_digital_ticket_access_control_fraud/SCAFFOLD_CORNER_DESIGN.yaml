                barcode_anchor_at: "2026-09-13T18:00:00Z"
                doors_open_at: "2026-09-13T18:00:00Z"
                event_start_at: "2026-09-13T19:00:00Z"
                transfer_window_closes_at: "2026-09-13T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev2_id: $.data.id }
            - call: "POST /events/${ev2_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 200, face_value_reference_cents: 8750 }
              as: VenueAdmin
