  - method: GET
    path: "/library/rental-sets"
    description: "List rental sets"
    roles: [LibraryAdmin, LibraryClerk, ReturnsClerk, BillingManager, RightsAdvisor, Customer]
    code: 200
    input: ["work_id?", "limit?", "offset?"]
    output: "RentalSet[]"
    side_effects: []
  - method: GET
    path: "/library/rental-sets/{id}"
    description: "Get rental set"
    roles: [LibraryAdmin, LibraryClerk, ReturnsClerk, BillingManager, RightsAdvisor, Customer]
    code: 200
    input: []
    output: RentalSet
    side_effects: []
