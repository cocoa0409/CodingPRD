            - { call: "POST /lease-buyouts/financing-facilities/${fac_id}/pledges", payload: { lease_stream_id: "${ls_id_a}", pledge_start_date: "2026-09-01", pledge_end_date: "2031-08-31", expected_facility_version: "${fac_v1}" }, as: TreasuryOfficer, captures: { pledge_a: $.data.id } }
          trigger:
            - { call: "POST /lease-buyouts/financing-facilities/${fac_id}/pledges", payload: { lease_stream_id: "${ls_id_b}", pledge_start_date: "2026-09-01", pledge_end_date: "2031-08-31", expected_facility_version: "${fac_v1}" }, as: TreasuryOfficer, captures: { err_id: $.data.error_id } }
            - { call: "GET /lease-buyouts/financing-facilities/${fac_id}", payload: {}, as: TreasuryOfficer, captures: { fac_v2: $.data.version } }
            - { call: "POST /lease-buyouts/financing-facilities/${fac_id}/pledges", payload: { lease_stream_id: "${ls_id_b}", pledge_start_date: "2026-09-01", pledge_end_date: "2031-08-31", expected_facility_version: "${fac_v2}" }, as: TreasuryOfficer, captures: { pledge_b: $.data.id, pledge_b_status: $.data.status } }
            - { call: "GET /lease-buyouts/financing-facilities/${fac_id}", payload: {}, as: TreasuryOfficer, captures: { pledged_count: $.data.pledged_stream_count } }
          assert:
            - "the second pledge attempt returns status 412"
            - "${err_id} == ERR_STALE_FACILITY_VERSION"
            - "${err_id} != ERR_BORROWING_BASE_DEFICIT"
            - "${err_id} != ERR_PLEDGE_PERIOD_OVERLAP"
            - "${fac_v2} != ${fac_v1}"
            - "the retry with the refreshed version returns status 201"
            - "${pledge_b_status} == PLEDGED"
            - "${pledge_b} != ${pledge_a}"
            - "${pledged_count} == 2"
      - name: derived_field_reconciliation_parent_counters_fall_back_when_a_deal_is_terminated_and_a_dispute_dismissed
        claim_type: derived_field_reconciliation
        grounds:
          - entities[Portfolio].active_deal_count
          - entities[Landowner].open_dispute_count
          - endpoints[POST /lease-buyouts/deals/{id}/terminate]
          - endpoints[POST /lease-buyouts/disputes/{id}/transitions]
          - complexity_profile.cross_cutting_complexity_layers[derived_field_reconciliation]
        distinguishing_aspect: |
          Both counters are trivially correct on the way up; the defect is that they are usually
          implemented as increment-only. This instance moves two different parents in the *decreasing*
          direction from two different child lifecycles in one run - a deal reaching the terminal
          TERMINATED stage from DILIGENCE and a dispute reaching the terminal DISMISSED status - and requires the
          parents to be reconciled, not merely incremented. The paired lease-stream fields make the
          check independent of the counters themselves: acquisition_status must return to PROSPECT and
          servicing_status to PERFORMING, so a system that decrements counters but leaves the stream pinned
          under offer or impaired still fails.
        test_recipe:
          setup:
            - "a portfolio with one active deal at DILIGENCE (offer accepted, capital RESERVED) whose landowner has one OPEN access dispute on the same stream"
          setup_api_calls:
            - { call: "POST /lease-buyouts/portfolios", payload: { name: "Northeast Tower Aggregation", program_code: "NE-AGG-01", total_capital_cents: 50000000 }, as: PlatformAdmin, captures: { pf_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-1042", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_id: $.data.id } }
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_id: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies", payload: { carrier_name: "Vantage Wireless", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t1_id: $.data.id } }
            - { call: "GET /lease-buyouts/lease-streams/${ls_id}", payload: {}, as: AcquisitionAnalyst, captures: { ls_v: $.data.version } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/valuations", payload: { method: "LUMP_SUM_PERPETUAL", expected_lease_stream_version: "${ls_v}" }, as: AcquisitionAnalyst, captures: { val_id: $.data.id } }
            - { call: "POST /lease-buyouts/stream-valuations/${val_id}/approve", payload: {}, as: PortfolioManager, as_user_id: "pm-alice" }
            - { call: "POST /lease-buyouts/deals", payload: { portfolio_id: "${pf_id}", lease_stream_id: "${ls_id}", valuation_id: "${val_id}", easement_type: "PERPETUAL_EASEMENT", revenue_share_bps: 2500 }, as: AcquisitionAnalyst, captures: { deal_id: $.data.id } }
            - { call: "POST /lease-buyouts/deals/${deal_id}/outreach", payload: {}, as: AcquisitionAnalyst }
            - { call: "POST /lease-buyouts/deals/${deal_id}/offers", payload: { offer_type: "LUMP_SUM", amount_cents: 36000000, expires_at: "2026-09-30T00:00:00Z" }, as: AcquisitionAnalyst, captures: { offer_id: $.data.id } }
            - { call: "POST /lease-buyouts/offers/${offer_id}/transitions", payload: { action: "SEND" }, as: AcquisitionAnalyst }
            - { call: "POST /lease-buyouts/offers/${offer_id}/transitions", payload: { action: "ACCEPT" }, as: Landowner, as_user_id: "${lo_id}" }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/disputes", payload: { dispute_type: "ACCESS_OBSTRUCTION", description: "locked gate blocked the crew" }, as: Landowner, as_user_id: "${lo_id}", captures: { disp_id: $.data.id } }
            - { call: "GET /lease-buyouts/portfolios/${pf_id}", payload: {}, as: PlatformAdmin, captures: { deals_before: $.data.active_deal_count } }
            - { call: "GET /lease-buyouts/landowners/${lo_id}", payload: {}, as: AcquisitionAnalyst, captures: { disputes_before: $.data.open_dispute_count } }
          trigger:
            - { call: "POST /lease-buyouts/deals/${deal_id}/terminate", payload: { reason: "landowner withdrew from talks" }, as: PortfolioManager, as_user_id: "pm-bob", captures: { stage_after: $.data.stage } }
            - { call: "POST /lease-buyouts/disputes/${disp_id}/transitions", payload: { action: "DISMISS" }, as: PlatformAdmin }
            - { call: "GET /lease-buyouts/portfolios/${pf_id}", payload: {}, as: PlatformAdmin, captures: { deals_after: $.data.active_deal_count, committed_after: $.data.committed_capital_cents } }
            - { call: "GET /lease-buyouts/landowners/${lo_id}", payload: {}, as: AcquisitionAnalyst, captures: { disputes_after: $.data.open_dispute_count } }
            - { call: "GET /lease-buyouts/lease-streams/${ls_id}", payload: {}, as: AcquisitionAnalyst, captures: { acq_after: $.data.acquisition_status, svc_after: $.data.servicing_status } }
          assert:
            - "${deals_before} == 1"
            - "${disputes_before} == 1"
            - "${stage_after} == TERMINATED"
            - "${deals_after} == 0"
            - "${disputes_after} == 0"
            - "${committed_after} == 0"
            - "${acq_after} == PROSPECT"
            - "${svc_after} == PERFORMING"
            - "GET /lease-buyouts/disputes/${disp_id} as PlatformAdmin reports data.status DISMISSED"
      - name: cascading_side_effects_one_adjudication_moves_stream_pledge_and_facility
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.cross_cutting_complexity_layers[cascading_side_effects]
          - state_machines[DisputeCase]
          - entities[FinancingFacility].compliance_state
        excluded_because:
          difficulty_instance: transitive_cascade / dispute_upheld_cascades_stream_impairment_pledge_ineligibility_and_facility_deficit
          rationale: "That §1.8 instance is the maximal form of this layer: a single UPHOLD has to impair the lease stream, make the collateral pledge ineligible, shrink the borrowing base below the advances already drawn and flip the facility to DEFICIT, with every hop asserted. A generic cascade check would only re-test the first hop."
      - name: dual_variant_calculation_lump_sum_and_prepaid_diverge_on_the_same_stream
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.cross_cutting_complexity_layers[dual_variant_calculation]
          - calculations[stream_value]
          - entities[StreamValuation].method
        excluded_because:
          difficulty_instance: dual_variant_calc / valuation_method_variant_divergence_lump_sum_vs_prepaid
          rationale: "That §1.8 instance already values one identical stream under both methods and pins the two literal results plus both max_bid ceilings, which is the strongest available statement of this layer; a separate corner case would restate it with weaker asserts."
      - name: rate_threshold_triggers_capital_posture_flips_at_the_declared_utilization_bound
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.cross_cutting_complexity_layers[rate_threshold_triggers]
          - calculations[portfolio_capital_ledger]
          - entities[Portfolio].capital_posture
        excluded_because:
          difficulty_instance: boundary_precision_check / portfolio_posture_boundary_utilization_8998_then_exactly_9000
          rationale: "That §1.8 instance drives utilization to 8998 bps (still CONSTRAINED) and then to exactly 9000 bps (FROZEN), which is precisely the threshold this layer describes and already fixes the >= versus > question."
  - section: consistency_model
    instances:
      - name: immediate_the_close_response_itself_reports_the_disbursed_ledger_before_any_re_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /lease-buyouts/deals/{id}/close]
          - entities[Deal].escrow_disbursed_cents
          - entities[Portfolio].deployed_capital_cents
          - state_machines[Deal]
        distinguishing_aspect: |
          Closing is the fan-out point of the whole system: it moves the deal to CLOSED, the capital state
          to DISBURSED, the escrow from funded to disbursed plus holdback, the portfolio from committed to
          deployed and the stream to ACQUIRED with rent redirection served. That is exactly the workload an
          implementer is tempted to push onto a background task or to reconcile lazily on the next read.
          Under an immediate consistency model the POST response body must already carry the final values,
          and a re-read in a later request must return the identical ones - so the test compares captures
          taken from the write response against captures taken from the subsequent GETs field by field.
        test_recipe:
          setup:
            - "a deal cleared to close: escrow funded, title cleared with no exceptions, no mortgage, valuation approved by pm-alice"
          setup_api_calls:
            - { call: "POST /lease-buyouts/portfolios", payload: { name: "Northeast Tower Aggregation", program_code: "NE-AGG-01", total_capital_cents: 200000000 }, as: PlatformAdmin, captures: { pf_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-1042", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_id_a: $.data.id } }
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id_a: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id_a}", landowner_id: "${lo_id_a}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_id_a: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id_a}/tenancies", payload: { carrier_name: "Vantage Wireless", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t1_id_a: $.data.id } }
            - { call: "GET /lease-buyouts/lease-streams/${ls_id_a}", payload: {}, as: AcquisitionAnalyst, captures: { ls_v_a: $.data.version } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id_a}/valuations", payload: { method: "LUMP_SUM_PERPETUAL", expected_lease_stream_version: "${ls_v_a}" }, as: AcquisitionAnalyst, captures: { val_id_a: $.data.id } }
            - { call: "POST /lease-buyouts/stream-valuations/${val_id_a}/approve", payload: {}, as: PortfolioManager, as_user_id: "pm-alice" }
            - { call: "POST /lease-buyouts/deals", payload: { portfolio_id: "${pf_id}", lease_stream_id: "${ls_id_a}", valuation_id: "${val_id_a}", easement_type: "PERPETUAL_EASEMENT", revenue_share_bps: 2500 }, as: AcquisitionAnalyst, captures: { deal_id_a: $.data.id } }
            - { call: "POST /lease-buyouts/deals/${deal_id_a}/outreach", payload: {}, as: AcquisitionAnalyst }
            - { call: "POST /lease-buyouts/deals/${deal_id_a}/offers", payload: { offer_type: "LUMP_SUM", amount_cents: 36000000, expires_at: "2026-09-30T00:00:00Z" }, as: AcquisitionAnalyst, captures: { offer_id_a: $.data.id } }
            - { call: "POST /lease-buyouts/offers/${offer_id_a}/transitions", payload: { action: "SEND" }, as: AcquisitionAnalyst }
            - { call: "POST /lease-buyouts/offers/${offer_id_a}/transitions", payload: { action: "ACCEPT" }, as: Landowner, as_user_id: "${lo_id_a}" }
            - { call: "POST /lease-buyouts/deals/${deal_id_a}/title-reports", payload: { snda_required: false }, as: AcquisitionAnalyst, captures: { tr_id_a: $.data.id } }
            - { call: "POST /lease-buyouts/title-reports/${tr_id_a}/transitions", payload: { action: "RECORD_FINDINGS", exception_count: 0, mortgage_present: false }, as: TitleOfficer }
            - { call: "POST /lease-buyouts/deals/${deal_id_a}/escrow-funding", payload: {}, as: TreasuryOfficer }
          trigger:
            - { call: "POST /lease-buyouts/deals/${deal_id_a}/close", payload: { recording_ref: "BK1420-PG318" }, as: PortfolioManager, as_user_id: "pm-bob", captures: { stage_w: $.data.stage, capital_w: $.data.capital_state, ref_w: $.data.recording_ref, disbursed_w: $.data.escrow_disbursed_cents, holdback_w: $.data.escrow_holdback_cents, easement_w: $.data.easement_status } }
            - { call: "GET /lease-buyouts/deals/${deal_id_a}", payload: {}, as: PortfolioManager, captures: { stage_r: $.data.stage, capital_r: $.data.capital_state, ref_r: $.data.recording_ref, disbursed_r: $.data.escrow_disbursed_cents, holdback_r: $.data.escrow_holdback_cents } }
            - { call: "GET /lease-buyouts/portfolios/${pf_id}", payload: {}, as: PlatformAdmin, captures: { deployed_r: $.data.deployed_capital_cents, committed_r: $.data.committed_capital_cents } }
            - { call: "GET /lease-buyouts/lease-streams/${ls_id_a}", payload: {}, as: AcquisitionAnalyst, captures: { acq_r: $.data.acquisition_status, redirect_r: $.data.rent_redirection_status } }
          assert:
            - "the close call returns status 200"
            - "${stage_w} == CLOSED"
            - "${capital_w} == DISBURSED"
            - "${ref_w} == BK1420-PG318"
            - "${easement_w} == RECORDED"
            - "${stage_r} == ${stage_w}"
            - "${capital_r} == ${capital_w}"
            - "${ref_r} == ${ref_w}"
            - "${disbursed_r} == ${disbursed_w}"
            - "${holdback_r} == ${holdback_w}"
            - "${committed_r} == 0"
            - "${deployed_r} equals the deal's total_commitment_cents reported in the same close response"
            - "${acq_r} == ACQUIRED"
            - "${redirect_r} == SENT"
            - "no second call was needed to make any of these values appear: every field above was already final in the close response body"
