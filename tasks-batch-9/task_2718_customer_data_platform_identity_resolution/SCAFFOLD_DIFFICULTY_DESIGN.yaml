            - "Profile.${p3_id}.resolution_status == RESOLVED"
            - "Profile.${p4_id}.resolution_status == RESOLVED"

      - name: propagate_with_zero_qualifying_destinations_verifies_immediately
        grounds:
          - state_machines.DeletionRequest.RECEIVED_to_VERIFIED
          - state_machines.Profile.DELETION_PENDING_to_DELETED
          - state_machines.ConsentRecord.ACTIVE_to_TOMBSTONED
          - entities.DeletionRequest.fields.total_vendor_task_count
