              captures: { b2_err: $.data.error_id }
          assert:
            - "plan A attach succeeds: DeliveryPlan.${b2_plana}.applied_coupon_codes == [\"MIN1K\"]"
            - "plan A estimated_total_cents == 950 after the FLAT 50 coupon"
            - "b2_err == \"ERR_SUBTOTAL_BELOW_COUPON_MIN\" with HTTP 422"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lock_substitution_requires_substitute_product_in_stock
        grounds:
          - calculations.lock_evaluation_pipeline
          - calculations.availability_derivation
          - entities.Product.fields.substitute_product_id
        distinguishing_aspect: |
          Entity pair PlanLine -> Product (twice removed): the line's fulfillment
          path depends on the state of a SECOND Product entity (the substitute);
          the original is OUT_OF_STOCK (0 on-hand), the substitute is IN_STOCK,
          so the lock rewrites product_id, prices at the substitute's 700 cents,
          and reserves on the substitute's placement.
        test_recipe:
          setup:
            - "Logical clock default. Customer; product ORIG price 1000, placement with 0 units (never stocked); substitute SUB price 700 stocked 10; ORIG.substitute_product_id = SUB."
            - "One subscription on ORIG qty 1 start 2026-09-10; plan generated for 2026-09."
          setup_api_calls:
            - *d1_clock
            - &x1_cust
              call: "POST /sns/customers"
              payload: { email: "xd1@x.com", full_name: "Xd One", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { x1_cust: $.data.id }
            - &x1_sub_prod
              call: "POST /sns/products"
              payload: { sku: "XD-1S", name: "XD Substitute", region: "US-WEST" }
              as: PlatformAdmin
              captures: { x1_subp: $.data.id }
            - call: "POST /sns/products/${x1_subp}/price-events"
              payload: { price_cents: 700, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${x1_subp}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { x1_subpl: $.data.id }
            - call: "POST /sns/inventory-placements/${x1_subpl}/receive"
              payload: { units: 10 }
              as: PlatformAdmin
            - &x1_orig
              call: "POST /sns/products"
              payload: { sku: "XD-1O", name: "XD Original", region: "US-WEST", substitute_product_id: "${x1_subp}" }
              as: PlatformAdmin
              captures: { x1_origp: $.data.id }
            - call: "POST /sns/products/${x1_origp}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${x1_origp}", region: "US-WEST" }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${x1_cust}", product_id: "${x1_origp}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${x1_cust}"
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { x1_plan: "$.data[0].id" }
          trigger:
            - call: "POST /sns/delivery-plans/${x1_plan}/lock"
              payload: {}
              as: Customer
              as_user_id: "${x1_cust}"
            - call: "GET /sns/delivery-plans/${x1_plan}/lines"
              payload: {}
              as: Customer
              as_user_id: "${x1_cust}"
              captures: { x1_line_prod: "$.data[0].product_id" }
          assert:
            - "x1_line_prod == x1_subp (the substitute Product.id)"
            - "the line's was_substituted == true and unit_price_cents == 700"
            - "DeliveryPlan.${x1_plan}.charged_total_cents == 700"
            - "the substitute's placement has reserved_units == 1 and on_hand_units == 9"

      - name: plan_generation_excludes_paused_subscriptions_and_suspended_customers
        grounds:
          - calculations.delivery_consolidation_grouping
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Customer.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair DeliveryPlan -> Subscription (and DeliveryPlan -> Customer):
          a PAUSED subscription contributes no PlanLine to the generated plan,
          and a SUSPENDED customer gets no plan at all — plan content depends on
          the live state of two other entity types.
        test_recipe:
          setup:
            - "Logical clock default. Customer X (ACTIVE) with two subscriptions, one PAUSED. Customer Y SUSPENDED with one ACTIVE subscription."
            - "All subscriptions start 2026-09-10 on a stocked, priced product."
          setup_api_calls:
            - *d1_clock
            - &x2_custx
              call: "POST /sns/customers"
              payload: { email: "xd2x@x.com", full_name: "Xd Two X", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { x2_custx: $.data.id }
            - &x2_custy
              call: "POST /sns/customers"
              payload: { email: "xd2y@x.com", full_name: "Xd Two Y", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { x2_custy: $.data.id }
            - &x2_prod
              call: "POST /sns/products"
              payload: { sku: "XD-2", name: "XD Product 2", region: "US-WEST" }
              as: PlatformAdmin
              captures: { x2_prod: $.data.id }
            - call: "POST /sns/products/${x2_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${x2_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { x2_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${x2_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${x2_custx}", product_id: "${x2_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${x2_custx}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${x2_custx}", product_id: "${x2_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${x2_custx}"
              captures: { x2_sub_paused: $.data.id }
            - call: "POST /sns/subscriptions/${x2_sub_paused}/pause"
              payload: {}
              as: Customer
              as_user_id: "${x2_custx}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${x2_custy}", product_id: "${x2_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${x2_custy}"
            - call: "POST /sns/customers/${x2_custy}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { x2_plans_count: $.data }
          assert:
            - "generate-plans returns exactly 1 plan (customer X only)"
            - "customer X's plan contains exactly 1 PlanLine (the PAUSED subscription contributes none)"
            - "GET /sns/customers/${x2_custy}/delivery-plans returns an empty array"
            - "the PAUSED subscription's next_delivery_date is unchanged (still 2026-09-10) while the included one advanced to 2026-10-10"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: promotion_windows_half_open_overlap_but_adjacency_allowed
        grounds:
          - validations[priority=9]
          - errors[ERR_PROMOTION_WINDOW_OVERLAP]
          - entities.Promotion.fields.starts_on
        distinguishing_aspect: |
          Resource: Promotion (per bonus product); interval semantics: half-open
          [starts_on, ends_on). A window starting 2026-09-15 collides with an
          ACTIVE [2026-09-01, 2026-10-01) promotion (ERR_PROMOTION_WINDOW_OVERLAP),
          while a window starting exactly 2026-10-01 (adjacent at the exclusive
          bound) is accepted.
        test_recipe:
          setup:
            - "Logical clock default. Bonus product exists. Promotion A [2026-09-01, 2026-10-01) ACTIVE."
          setup_api_calls:
            - *d1_clock
            - &o1_prod
              call: "POST /sns/products"
              payload: { sku: "OV-1", name: "OV Bonus", region: "US-WEST" }
              as: PlatformAdmin
              captures: { o1_prod: $.data.id }
            - &o1_promo
              call: "POST /sns/promotions"
              payload: { bonus_product_id: "${o1_prod}", min_line_count: 3, starts_on: "2026-09-01", ends_on: "2026-10-01" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sns/promotions"
              payload: { bonus_product_id: "${o1_prod}", min_line_count: 2, starts_on: "2026-09-15", ends_on: "2026-11-01" }
              as: PlatformAdmin
              captures: { o1_err: $.data.error_id }
            - call: "POST /sns/promotions"
              payload: { bonus_product_id: "${o1_prod}", min_line_count: 2, starts_on: "2026-10-01", ends_on: "2026-11-01" }
              as: PlatformAdmin
              captures: { o1_promo_c: $.data.id }
          assert:
            - "o1_err == \"ERR_PROMOTION_WINDOW_OVERLAP\" with HTTP 409"
            - "the adjacent [2026-10-01, 2026-11-01) promotion is created with HTTP 201"
            - "Promotion.${o1_promo_c}.promotion_status == ACTIVE"

      - name: price_event_equal_effective_from_collides_closed_point_semantics
        grounds:
          - validations[priority=9]
          - errors[ERR_PRICE_EVENT_NOT_MONOTONIC]
          - entities.PriceEvent.fields.effective_from
        distinguishing_aspect: |
          Resource: Product price history; interval semantics: strict point
          ordering (derived effective windows are closed at their start), so an
          event whose effective_from EQUALS an existing boundary collides —
          unlike the promotion rule where adjacency at the boundary is allowed.
        test_recipe:
          setup:
            - "Logical clock default. Product with one price event effective 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *d1_clock
            - &o2_prod
              call: "POST /sns/products"
              payload: { sku: "OV-2", name: "OV Product 2", region: "US-WEST" }
              as: PlatformAdmin
              captures: { o2_prod: $.data.id }
            - call: "POST /sns/products/${o2_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sns/products/${o2_prod}/price-events"
              payload: { price_cents: 1100, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { o2_err: $.data.error_id }
            - call: "POST /sns/products/${o2_prod}/price-events"
              payload: { price_cents: 1100, effective_from: "2026-09-01T00:00:01Z" }
              as: PlatformAdmin
          assert:
            - "o2_err == \"ERR_PRICE_EVENT_NOT_MONOTONIC\" with HTTP 409"
            - "the event one second later is accepted with HTTP 201"
            - "GET /sns/products/${o2_prod}/price-events returns exactly 2 events"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: damage_refund_preserves_gross_line_total_invariant
        grounds:
          - calculations.damage_refund_amount
          - entities.DeliveryPlan.fields.gross_line_total_cents
          - entities.DeliveryPlan.fields.refunded_total_cents
        distinguishing_aspect: |
          Conserved quantity: money. Forward action locks 3 lines x 950 = 2850
          gross; the compensating refund of one damaged line moves 950 into
          refunded_total_cents, and gross_line_total_cents == SHIPPED lines
          (1900) + refunded (950) == 2850 holds with zero drift.
        test_recipe:
          setup:
            - "Logical clock default. Customer, product price 1000 stocked 50; three subscriptions qty 1; plan generated, locked (tier 0.05, gross 2850), shipped, delivered."
          setup_api_calls:
            - *d1_clock
            - &i1_cust
              call: "POST /sns/customers"
              payload: { email: "ci1@x.com", full_name: "Ci One", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { i1_cust: $.data.id }
            - &i1_prod
              call: "POST /sns/products"
              payload: { sku: "CI-1", name: "CI Product 1", region: "US-WEST" }
              as: PlatformAdmin
              captures: { i1_prod: $.data.id }
            - call: "POST /sns/products/${i1_prod}/price-events"
