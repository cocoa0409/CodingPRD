# =============================================================================
# Task 1888 — Construction Loan Draw Administration — §1.8 Test Targeting Index
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: progress_percent_dual_basis
        grounds:
          - calculations.loan_progress_percent
          - entities.Loan.fields.inspection_percent_complete
          - entities.Loan.fields.cost_percent_complete
        distinguishing_aspect: |
          Progress is dual-variant on the LOAN/progress domain: identical funded
          state yields inspection_percent_complete 50.00 (inspection_based variant)
          but cost_percent_complete 12.50 (cost_based variant) — two valid
          algorithms, same data, different numbers.
        test_recipe:
          setup:
            - "Loan L (commitment 100000000, reserve 200000, 1200 bps ACTUAL_360) with lines BL-A 40000000, BL-B 30000000, BL-C contingency 10000000"
            - "Draw D1 [2026-03-01, 2026-03-31) with one WORK_COMPLETED line on BL-A requested 10000000, verified invoice 10000000, verified conditional waiver 10000000"
            - "Inspection for D1 ACCEPTED with percent_complete_reported 50.00, completed 2026-03-21"
            - "D1 APPROVED then FUNDED: approved 10000000, retainage 500000 (milestone 5%), funded net 9500000"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 200000, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "FRAM", description: "Framing", original_amount_cents: 30000000 }, as: LenderAdmin }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "CONT", description: "Contingency", original_amount_cents: 10000000, is_contingency: true }, as: LenderAdmin }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
            - { call: "POST /draws/${d_id}/fund", payload: {}, as: LoanServicer }
          trigger:
            - { call: "GET /loans/${l_id}", as: LoanServicer }
          assert:
            - "Loan.${l_id}.inspection_percent_complete == 50.00"
            - "Loan.${l_id}.cost_percent_complete == 12.50"
            - "Loan.${l_id}.milestone_reached == true"
            - "Loan.${l_id}.principal_disbursed_cents == 9500000"
            - "Loan.${l_id}.retained_cents == 500000"

      - name: interest_day_count_convention_divergence
        grounds:
          - calculations.interest_accrual
        distinguishing_aspect: |
          Interest accrual is dual-variant on the INTEREST RESERVE domain: two
          loans identical except day_count_convention accrue over the same dates
          [2026-01-31, 2026-03-01) — ACTUAL_360 counts 29 days (due 91833) while
          THIRTY_360 counts 31 days (due 98167).
        test_recipe:
          setup:
            - "Two loans LA (ACTUAL_360) and LB (THIRTY_360), each with one budget line 40000000 and one FUNDED draw netting principal_disbursed_cents 9500000 (approved 10000000, retainage 500000 at milestone 50.00)"
            - "Both loans: commitment 100000000, rate 1200 bps, reserve 200000"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 200000, maturity_date: "2027-12-31", day_count_convention: "ACTUAL_360" }, as: LenderAdmin, captures: { la_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${la_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bla_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${la_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { da_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${da_id}", budget_line_id: "${bla_a}", line_type: "WORK_COMPLETED", requested_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${da_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doca_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${da_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doca_w: $.data.id } }
            - { call: "POST /draw-documents/${doca_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doca_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${da_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${da_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${la_id}", draw_id: "${da_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { inspa_id: $.data.id } }
            - { call: "POST /inspections/${inspa_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${inspa_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${da_id}/approve", payload: {}, as: CreditOfficer }
            - { call: "POST /draws/${da_id}/fund", payload: {}, as: LoanServicer }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 200000, maturity_date: "2027-12-31", day_count_convention: "THIRTY_360" }, as: LenderAdmin, captures: { lb_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${lb_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { blb_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${lb_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { db_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${db_id}", budget_line_id: "${blb_a}", line_type: "WORK_COMPLETED", requested_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${db_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { docb_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${db_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { docb_w: $.data.id } }
            - { call: "POST /draw-documents/${docb_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${docb_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${db_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${db_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${lb_id}", draw_id: "${db_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { inspb_id: $.data.id } }
            - { call: "POST /inspections/${inspb_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${inspb_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${db_id}/approve", payload: {}, as: CreditOfficer }
            - { call: "POST /draws/${db_id}/fund", payload: {}, as: LoanServicer }
          trigger:
            - { call: "POST /loans/${la_id}/interest-accruals", payload: { period_start_date: "2026-01-31", period_end_date: "2026-03-01" }, as: LoanServicer, captures: { due_a: $.data.interest_due_cents, days_a: $.data.days_counted } }
            - { call: "POST /loans/${lb_id}/interest-accruals", payload: { period_start_date: "2026-01-31", period_end_date: "2026-03-01" }, as: LoanServicer, captures: { due_b: $.data.interest_due_cents, days_b: $.data.days_counted } }
          assert:
            - "days ACTUAL_360 == 29 and days THIRTY_360 == 31 for identical dates"
            - "LA interest_due_cents == 91833"
            - "LB interest_due_cents == 98167"
            - "LA.interest_reserve_balance_cents == 108167 (200000 - 91833)"
            - "LB.interest_reserve_balance_cents == 101833 (200000 - 98167)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three different modes: b, c, a)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: retainage_rounding_per_line_then_sum
        grounds:
          - calculations.retainage_withholding
        distinguishing_aspect: |
          Mode (b) nested rounding: retainage is rounded per line item then
          summed. Two lines approved 105 each at 10% yield 11 + 11 = 22;
          sum-then-round of the same inputs yields round(210 * 0.10) = 21.
        test_recipe:
          setup:
            - "Loan with lines BL-X 10000 and BL-Y 10000 (commitment 1000000, reserve 0, milestone default 50.00 not reached)"
            - "Draw with two WORK_COMPLETED lines requested 105 each; verified invoice 210 and conditional waiver 210"
            - "ACCEPTED inspection at 40.00 percent (per-line inspection cap floor(10000*0.40)=4000 does not bind)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Tiny Works Inc", contact_email: "t@tiny.example", entity_type: "CORPORATION" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 1000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "X1", description: "Line X", original_amount_cents: 10000 }, as: LenderAdmin, captures: { bl_x: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "Y1", description: "Line Y", original_amount_cents: 10000 }, as: LenderAdmin, captures: { bl_y: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_x}", line_type: "WORK_COMPLETED", requested_cents: 105 }, as: Borrower, as_user_id: "${b_id}", captures: { dli_x: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_y}", line_type: "WORK_COMPLETED", requested_cents: 105 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Tiny GC", amount_cents: 210, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Tiny GC", amount_cents: 210, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 40.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
          trigger:
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
          assert:
            - "DrawLineItem.${dli_x}.approved_cents == 105 and retainage_cents == 11"
            - "DrawRequest.${d_id}.retainage_total_cents == 22 (per-line-then-sum), not 21 (sum-then-round)"
            - "DrawRequest.${d_id}.effective_retainage_pct == 10.00"
            - "DrawRequest.${d_id}.milestone_applied == false"

      - name: interest_capitalization_evaluation_order
        grounds:
          - calculations.interest_accrual
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: capitalized interest joins the
          NEXT run's balance base. Run 1 (reserve 50000): due 95000, paid 50000,
          capitalized 45000. Run 2 base is 9545000 -> due 95450, all capitalized
          (reserve 0). Total capitalized 140450 — any other evaluation order
          (e.g., including the current run's shortfall in its own base) differs.
        test_recipe:
          setup:
            - "Loan reserve 50000, 1200 bps ACTUAL_360, one line 40000000, one FUNDED draw netting principal 9500000 (approved 10000000 at milestone 50.00, retainage 500000)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 50000, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
            - { call: "POST /draws/${d_id}/fund", payload: {}, as: LoanServicer }
          trigger:
            - { call: "POST /loans/${l_id}/interest-accruals", payload: { period_start_date: "2026-04-01", period_end_date: "2026-05-01" }, as: LoanServicer, captures: { due1: $.data.interest_due_cents, paid1: $.data.paid_from_reserve_cents, cap1: $.data.capitalized_cents } }
            - { call: "POST /loans/${l_id}/interest-accruals", payload: { period_start_date: "2026-05-01", period_end_date: "2026-05-31" }, as: LoanServicer, captures: { due2: $.data.interest_due_cents, paid2: $.data.paid_from_reserve_cents, cap2: $.data.capitalized_cents } }
          assert:
            - "Run 1: interest_due_cents == 95000, paid_from_reserve_cents == 50000, capitalized_cents == 45000"
            - "Run 2 base includes run-1 shortfall: interest_due_cents == 95450, paid_from_reserve_cents == 0, capitalized_cents == 95450"
            - "Loan.${l_id}.interest_capitalized_cents == 140450"
            - "Loan.${l_id}.interest_reserve_balance_cents == 0"
            - "Loan.${l_id}.interest_reserve_depleted == true"

      - name: stored_materials_min_of_caps
        grounds:
          - calculations.stored_materials_advance_cap
          - calculations.draw_line_approval_amount
        distinguishing_aspect: |
          Mode (a) non-linear multi-input: approved stored-materials amount is
          min(requested, cost headroom, inspection cap, floor(invoice * 75%)).
          Here 150000 wins from the invoice-percentage cap while requested
          (200000), headroom (1000000), and inspection cap (400000) all exceed it.
        test_recipe:
          setup:
            - "Loan (milestone not reached; inspection 40.00) with line BL-S original 1000000"
            - "Draw with one STORED_MATERIALS line: requested 200000, invoice value 200000, insurance ref present"
            - "Verified conditional waiver 200000; no INVOICE doc needed (work-line coverage is 0)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "MATS", description: "Materials", original_amount_cents: 1000000 }, as: LenderAdmin, captures: { bl_s: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_s}", line_type: "STORED_MATERIALS", requested_cents: 200000, stored_material_invoice_cents: 200000, insurance_certificate_ref: "CERT-77", stored_location: "Bonded warehouse, Lot 9" }, as: Borrower, as_user_id: "${b_id}", captures: { dli_s: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 200000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 40.00, completed_date: "2026-03-21", stored_materials_observed_cents: 200000 }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
          trigger:
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
          assert:
            - "DrawLineItem.${dli_s}.approved_cents == 150000 (floor(200000 * 75%) binds)"
            - "DrawLineItem.${dli_s}.retainage_cents == 15000 (10% standard, milestone not reached)"
            - "DrawLineItem.${dli_s}.net_fundable_cents == 135000"
            - "DrawRequest.${d_id}.status == APPROVED"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: draw_revision_cycle_resubmit
        grounds:
          - state_machines.DrawRequest.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.DrawRequest.REVISION_REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
          DrawRequest is cyclic: UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED
          -> UNDER_REVIEW. The borrower edits the draw (adds a line item) while
          in REVISION_REQUESTED and resubmits through the same submit endpoint.
        test_recipe:
          setup:
            - "Loan OPEN with line BL-A 40000000; draw D [2026-03-01, 2026-03-31) with one line, submitted and UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 5000000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
          trigger:
            - { call: "POST /draws/${d_id}/request-revision", payload: { revision_notes: "Add roofing line" }, as: DrawProcessor }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 2500000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
          assert:
            - "After request-revision: DrawRequest.${d_id}.status == REVISION_REQUESTED and revision_notes == 'Add roofing line'"
            - "Line item creation succeeds while REVISION_REQUESTED (mutable window)"
            - "After resubmit: status == SUBMITTED; requested_total_cents == 7500000"
            - "After second start-review: status == UNDER_REVIEW (cycle closed)"

      - name: conversion_decline_branch_vs_convert_branch
        grounds:
          - state_machines.ConversionReview.REQUESTED_to_DECLINED
          - state_machines.ConversionReview.APPROVED_to_CONVERTED
          - state_machines.Loan.OPEN_to_CONVERTED
        distinguishing_aspect: |
          ConversionReview is a branching fork (REQUESTED -> DECLINED with no
          side effects vs REQUESTED -> APPROVED -> CONVERTED with a full loan
          cascade) on a different entity than the DrawRequest cycle. After a
          DECLINED branch a fresh review may be opened and driven to CONVERTED.
        test_recipe:
          setup:
            - "Loan OPEN, reserve 95000, one budget line BL-A 40000000 ACTIVE, no draws"
            - "A completion inspection (no draw_id) ACCEPTED with percent_complete_reported 100.00"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 95000, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", scheduled_date: "2026-06-15" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 100.00, completed_date: "2026-06-16" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /conversion-reviews", payload: { loan_id: "${l_id}" }, as: Borrower, as_user_id: "${b_id}", captures: { cr1_id: $.data.id } }
            - { call: "POST /conversion-reviews/${cr1_id}/review", payload: { decision: "DECLINED", reason: "Appraisal stale" }, as: CreditOfficer }
            - { call: "POST /conversion-reviews", payload: { loan_id: "${l_id}" }, as: Borrower, as_user_id: "${b_id}", captures: { cr2_id: $.data.id } }
            - { call: "POST /conversion-reviews/${cr2_id}/review", payload: { decision: "APPROVED" }, as: CreditOfficer }
          trigger:
            - { call: "POST /conversion-reviews/${cr2_id}/convert", payload: { permanent_interest_rate_annual_bps: 650, permanent_term_months: 360 }, as: LoanServicer }
          assert:
            - "ConversionReview.${cr1_id}.status == DECLINED (terminal; no loan side effects fired on that branch)"
            - "ConversionReview.${cr2_id}.status == CONVERTED with permanent_interest_rate_annual_bps == 650"
            - "Loan.${l_id}.status == CONVERTED and permanent_term_months == 360"
            - "BudgetLine.${bl_a}.status == CLOSED (cascade)"
            - "Loan.${l_id}.interest_reserve_balance_cents == 0 and interest_reserve_swept_cents == 95000 (SWEEP)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2+)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: fund_cascade_three_levels
        grounds:
          - state_machines.DrawRequest.APPROVED_to_FUNDED
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /draws/{id}/fund: DrawRequest -> FUNDED
          causes DrawLineItem.funded_cents to be set, which causes BudgetLine
          disbursed/retained/approved_unfunded recomputation, which causes Loan
          principal/retained/cost_percent recomputation. Each link is caused by
          the previous link, not a fan-out of the original call.
        test_recipe:
          setup:
            - "Draw D1 APPROVED on loan L: BL-A requested/approved 10000000, retainage 500000 (milestone 50.00 inspection), net 9500000"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}", captures: { dli_a: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
          trigger:
            - { call: "POST /draws/${d_id}/fund", payload: {}, as: LoanServicer }
          assert:
            - "Link 1: DrawRequest.${d_id}.status == FUNDED and funded_total_cents == 9500000"
            - "Link 2: DrawLineItem.${dli_a}.funded_cents == 9500000"
            - "Link 3: BudgetLine.${bl_a}.disbursed_cents == 9500000, retained_cents == 500000, approved_unfunded_cents == 0"
            - "Link 4: Loan.${l_id}.principal_disbursed_cents == 9500000, retained_cents == 500000, cost_percent_complete == 25.00"

      - name: release_pay_cascade
        grounds:
          - state_machines.RetainageRelease.APPROVED_to_PAID
        distinguishing_aspect: |
          Different trigger (POST /retainage-releases/{id}/pay), depth >= 2:
          RetainageRelease -> PAID causes BudgetLine retained->disbursed transfer,
          which causes Loan aggregate recomputation and latches
          retainage_fully_released once retained_cents reaches 0.
        test_recipe:
          setup:
            - "Loan L with FUNDED draw D1 (BL-A disbursed 9500000, retained 500000; milestone_reached true)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
            - { call: "POST /draws/${d_id}/fund", payload: {}, as: LoanServicer }
            - { call: "POST /retainage-releases", payload: { loan_id: "${l_id}", budget_line_id: "${bl_a}", amount_cents: 500000, reason: "Milestone reduction release" }, as: Borrower, as_user_id: "${b_id}", captures: { rr_id: $.data.id } }
            - { call: "POST /retainage-releases/${rr_id}/review", payload: { decision: "APPROVED" }, as: CreditOfficer }
          trigger:
            - { call: "POST /retainage-releases/${rr_id}/pay", payload: {}, as: LoanServicer }
          assert:
            - "Link 1: RetainageRelease.${rr_id}.status == PAID"
            - "Link 2: BudgetLine.${bl_a}.retained_cents == 0 and disbursed_cents == 10000000"
            - "Link 3: Loan.${l_id}.retained_cents == 0, principal_disbursed_cents == 10000000, retainage_fully_released == true"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: budget_line_create_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_LOAN_NOT_OPEN]
          - errors[ERR_COMMITMENT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: adding a budget line to a
          TERMINATED loan with an amount that would also exceed the commitment
          must fail with ERR_LOAN_NOT_OPEN (priority 6), not
          ERR_COMMITMENT_EXCEEDED (priority 11).
        test_recipe:
          setup:
            - "Loan L (commitment 100000000) TERMINATED immediately after creation (zero activity)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/terminate", payload: {}, as: LenderAdmin }
          trigger:
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 200000000 }, as: LenderAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LOAN_NOT_OPEN (state category beats business_fiscal)"
            - "no BudgetLine is created for loan ${l_id}"

      - name: approve_safety_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_LIEN_WAIVER_UNVERIFIED]
          - errors[ERR_INSPECTION_STALE]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: at draw approve,
          missing waiver coverage (safety, priority 7) and a stale accepted
          inspection (temporal, priority 8) both hold; the response must be
          ERR_LIEN_WAIVER_UNVERIFIED.
        test_recipe:
          setup:
            - "Draw D UNDER_REVIEW on loan L: one line requested 100000 on BL-A (1000000), verified invoice 100000, NO waiver documents"
            - "Inspection for D ACCEPTED but completed_date 2026-02-20 lies outside period [2026-03-01, 2026-03-31] (stale)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 1000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-02-19" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 40.00, completed_date: "2026-02-20" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
          trigger:
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LIEN_WAIVER_UNVERIFIED (business_safety beats business_temporal)"
            - "DrawRequest.${d_id}.status remains UNDER_REVIEW"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: milestone_exactly_50_reduced_retainage
        grounds:
          - calculations.retainage_withholding
          - calculations.loan_progress_percent
          - entities.Loan.fields.retainage_milestone_pct
        distinguishing_aspect: |
          Metric: inspection percent complete at the milestone boundary via
          POST /draws/{id}/approve. 49.99 does NOT trigger the reduction (draw 1
          retainage 10000 at 10%); exactly 50.00 DOES (draw 2 retainage 5000 at
          5%) — the comparison is >=, not >.
        test_recipe:
          setup:
            - "Loan L (milestone 50.00, retainage 10.00 -> 5.00) with BL-A 1000000"
            - "Draw 1 [2026-03-01, 2026-03-31): line requested 100000, inspection 49.99 ACCEPTED, docs verified -> APPROVED"
