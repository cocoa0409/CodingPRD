            - "DrugLot.${lot_sep}.units_committed == 1, units_available == 0, status == 'DEPLETED'"
            - "${dp_three_lot} == ${lot_oct} — the depleted LOT-SEP is filtered out by status and by units_available"
            - "DrugLot.${lot_oct}.units_committed == 3 and units_available == 2 and status == 'AVAILABLE'"
            - "${dp_six_lot} == ${lot_nov} — LOT-OCT's remaining 2 cannot cover 6 and no split with LOT-NOV is permitted"
            - "DrugLot.${lot_oct}.units_available is still 2 after the third request — untouched, proving no partial fill"
            - "DrugLot.${lot_nov}.units_committed == 6 and units_available == 4 and status == 'AVAILABLE'"
            - "All three preparations report status == 'REQUESTED' and appointment_id == ${ap1}"

      - name: selector_gives_up_after_nine_grid_candidates_even_though_a_later_start_is_legal
        claim_type: constraint_propagation
        grounds:
          - calculations.staggered_start_assignment
          - calculations.staggered_start_assignment.constants.STAGGER_CANDIDATE_COUNT
          - validations[priority 111]
          - errors[ERR_NO_CHAIR_CAPACITY]
        distinguishing_aspect: |
          The candidate list is exactly nine grid steps wide and the search stops there.
          With the center opening at 420, one visit occupying [420, 660) on the only chair
          and a 15-minute turnover buffer, every candidate 420, 435, ... 540 collides, so
          a request for 420 raises ERR_NO_CHAIR_CAPACITY — yet the very same request at
          675 succeeds, because 675 == 660 + 15 clears the buffered window and 675 + 240
          still fits inside the close of 1140. An implementation that searched to the end
          of the day would silently place the first request at 675.
        test_recipe:
          setup:
            - "One center with open_minute 420, close_minute 1140, turnover_buffer_minutes 15 and stagger_grid_minutes 15; exactly ONE chair A1; one nurse on 420-1140 with acuity_capacity_points 6."
            - "Patient BLOCK holds a booked visit on 2026-08-10 with start_minute 420 and chair_minutes 240, i.e. [420, 660)."
            - "Patient LATE has an ACTIVE plan of the same drug and no appointment yet."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 420, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 420, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-BLOCK", full_name: "Pat Block", weight_kg: 70 }
              as: Scheduler
              captures: { pt_block: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-LATE", full_name: "Pat Late", weight_kg: 70 }
              as: Scheduler
              captures: { pt_late: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_block}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl_block: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_late}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl_late: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt_block}", treatment_plan_id: "${pl_block}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 420, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap_block: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt_late}", treatment_plan_id: "${pl_late}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 420, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { err_capacity: $.data.error_id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt_late}", treatment_plan_id: "${pl_late}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 675, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap_late: $.data.id }
          assert:
            - "Appointment.${ap_block}.start_minute == 420, end_minute == 660, chair_id == ${ch1}"
            - "First trigger HTTP status == 409 and ${err_capacity} == 'ERR_NO_CHAIR_CAPACITY' (not ERR_NO_NURSE_ON_SHIFT, not ERR_NURSE_ACUITY_EXCEEDED)"
            - "The nine candidates 420, 435, 450, 465, 480, 495, 510, 525, 540 all collide with [420, 660) under the buffered rule, so the chair pool is empty at every one"
            - "Second trigger HTTP status == 201 with Appointment.${ap_late}.start_minute == 675 and end_minute == 915"
            - "675 == 660 + 15 is legal because the buffer is appended to the end of both intervals, and 675 + 240 == 915 <= 1140"
            - "Appointment.${ap_late}.chair_id == ${ch1} and nurse_id == ${nr1} — the same chair and nurse the search rejected nine times"
            - "Chair.${ch1}.committed_minutes == 480 and Nurse.${nr1}.assigned_acuity_points == 6 after both bookings"
            - "GET /appointments filtered by patient_id == ${pt_late} returns exactly 1 row"

      - name: one_sweep_expires_the_authorization_at_the_inclusive_instant_and_still_no_shows_the_visit
        claim_type: chronological
        grounds:
          - calculations.daily_sweep_run
          - calculations.daily_sweep_run.constants.NO_SHOW_GRACE_MINUTES
          - calculations.daily_sweep_run.constants.AUTH_VALIDITY_DAYS
          - state_machines[AuthorizationRequest].transitions[APPROVED -> EXPIRED]
        distinguishing_aspect: |
          Two authorizations are approved one second apart, so their expires_at instants
          straddle the sweep clock: step 2 uses <= and catches the one whose expires_at is
          exactly 2026-08-31T00:00:00Z while leaving the 00:00:01 sibling APPROVED. The
          same single sweep must ALSO run step 4 and mark the first appointment NO_SHOW
          with its full strike cascade — one call, two ordered steps touching the same row,
          and expired_authorization_count and no_show_count both 1. An implementation that
          returns after the first step that changes anything reports one of them as 0.
        test_recipe:
          setup:
            - "One center, one chair, one nurse, the standing drug, a MID template and two patients each with an ACTIVE plan; no lots and no preparations, so steps 1 and 3 must report 0."
            - "Visit A is booked for 2026-08-10 at 540 and left TENTATIVE; visit B is booked for 2026-09-15 at 540. Each gets an authorization request submitted and APPROVED, the first at clock 2026-08-01T00:00:00Z (expires_at 2026-08-31T00:00:00Z) and the second at 2026-08-01T00:00:01Z (expires_at 2026-08-31T00:00:01Z)."
            - "The clock is then set to 2026-08-31T00:00:00Z and the sweep is run for service_date 2026-08-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
