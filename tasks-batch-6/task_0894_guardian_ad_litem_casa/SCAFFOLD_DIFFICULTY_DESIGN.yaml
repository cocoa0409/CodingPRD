# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Guardian-ad-Litem & CASA Volunteer Management — Expert
# 9 rule_ids x 2 instances = 18 instances.
# Reusable onboarding chain "ACTIVE volunteer + ASSIGNED case" is inlined per
# instance (each instance drives from empty-DB).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: expense_provisional_vs_final_diverge
        grounds:
          - calculations.expense_reimbursement
          - entities.ExpenseClaim.fields.estimated_reimbursement_cents
          - entities.ExpenseClaim.fields.final_reimbursement_cents
          - state_machines.ExpenseClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Dual-variant on the ExpenseClaim (cost) domain: the PROVISIONAL flat-rate estimate
          (12000c) and the FINAL tiered+capped amount (10700c) differ for the SAME inputs
          (120 miles, 6000c other).
        test_recipe:
          setup:
            - "Clock 2026-06-01. Supervisor S1; Volunteer V1 sworn in (bg cleared, 30 training hrs)."
            - "Case C1 owned by S1, budget 20000c, V1 assigned (ASSIGNED)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}", reimbursement_budget_cents: 20000 }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}", captures: { a1_id: "$.data.id" } }
          trigger:
            - { call: "POST /expense-claims", payload: { case_id: "${c1_id}", period_month: "2026-06", total_miles: 120, other_expense_cents: 6000 }, as: Volunteer, as_user_id: "${v1_id}", captures: { ec1_id: "$.data.id", est1: "$.data.estimated_reimbursement_cents" } }
            - { call: "POST /expense-claims/${ec1_id}/approve", payload: {}, as: Supervisor, as_user_id: "${s1_id}", captures: { fin1: "$.data.final_reimbursement_cents" } }
          assert:
            - "ExpenseClaim.${ec1_id}.estimated_reimbursement_cents == 12000"
            - "ExpenseClaim.${ec1_id}.final_reimbursement_cents == 10700"
            - "final_reimbursement_cents (10700) != estimated_reimbursement_cents (12000)"

      - name: compliance_standard_vs_strict_diverge
        grounds:
          - calculations.case_contact_compliance
          - entities.Case.fields.contact_compliance_pct
          - entities.Case.fields.audit_compliance_pct
          - state_machines.Case.ASSIGNED_to_CLOSED
        distinguishing_aspect: |
          Dual-variant on the Case (compliance) domain — a DIFFERENT entity than ExpenseClaim:
          STANDARD (IN_PERSON+VIDEO) yields 66.5 while STRICT (IN_PERSON only) yields 50.0 for
          the identical set of logged visits.
        test_recipe:
          setup:
            - "Clock 2026-06-01. S1, V1 sworn in, C1 (S1) with V1 assigned in June (REQUIRED_MONTHS spans 2026-06..2026-07)."
            - "June visits: 2 IN_PERSON + 1 VIDEO; July visit: 1 IN_PERSON. All by V1, non-overlapping."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}" }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}", captures: { a1_id: "$.data.id" } }
            - { call: "POST /cases/${c1_id}/visits", payload: { contact_type: "IN_PERSON", contact_start: "2026-06-05T10:00:00Z", contact_end: "2026-06-05T11:00:00Z", miles: 12 }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /cases/${c1_id}/visits", payload: { contact_type: "IN_PERSON", contact_start: "2026-06-12T10:00:00Z", contact_end: "2026-06-12T11:00:00Z", miles: 12 }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /cases/${c1_id}/visits", payload: { contact_type: "VIDEO", contact_start: "2026-06-20T10:00:00Z", contact_end: "2026-06-20T10:30:00Z", miles: 0 }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /cases/${c1_id}/visits", payload: { contact_type: "IN_PERSON", contact_start: "2026-07-03T10:00:00Z", contact_end: "2026-07-03T11:00:00Z", miles: 12 }, as: Volunteer, as_user_id: "${v1_id}" }
          trigger:
            - { call: "GET /cases/${c1_id}", payload: {}, as: Supervisor, as_user_id: "${s1_id}", captures: { std_pct: "$.data.contact_compliance_pct" } }
            - { call: "POST /cases/${c1_id}/close", payload: { outcome: "REUNIFICATION" }, as: Supervisor, as_user_id: "${s1_id}", captures: { strict_pct: "$.data.audit_compliance_pct" } }
          assert:
            - "Case.${c1_id}.contact_compliance_pct == 66.5"
            - "Case.${c1_id}.audit_compliance_pct == 50.0"
            - "STANDARD (66.5) != STRICT (50.0)"

  - rule_id: combinatorial_formula
    instances:
      - name: expense_final_tiered_nonlinear_mode_a
        grounds:
          - calculations.expense_reimbursement
          - state_machines.ExpenseClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (a): FINAL amount is a >=3-input non-linear formula — tiered per-mile rate
          selection (100@50c + 20@35c = 5700), min() other-cap (6000->5000), min() monthly cap
          (10700<15000) — giving 10700c, not a linear miles*rate.
        test_recipe:
          setup:
            - "Clock 2026-06-01. S1, V1 sworn in, C1 (S1) budget 20000c, V1 assigned."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}", reimbursement_budget_cents: 20000 }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}", captures: { a1_id: "$.data.id" } }
            - { call: "POST /expense-claims", payload: { case_id: "${c1_id}", period_month: "2026-06", total_miles: 120, other_expense_cents: 6000 }, as: Volunteer, as_user_id: "${v1_id}", captures: { ec1_id: "$.data.id" } }
          trigger:
            - { call: "POST /expense-claims/${ec1_id}/approve", payload: {}, as: Supervisor, as_user_id: "${s1_id}", captures: { fin1: "$.data.final_reimbursement_cents" } }
          assert:
            - "ExpenseClaim.${ec1_id}.final_reimbursement_cents == 10700"

      - name: compliance_rounding_order_mode_b
        grounds:
          - calculations.case_contact_compliance
          - entities.Case.fields.contact_compliance_pct
        distinguishing_aspect: |
          Mode (b): pinned rounding order — round EACH month_score to 2 decimals then aggregate
          gives 66.5; rounding the raw ratios only at the end would give 66.7. The scaffold pins
          per-month-first, so the observable value is 66.5.
        test_recipe:
          setup:
            - "Same visit set as compliance dual-variant: June 2 IN_PERSON + 1 VIDEO; July 1 IN_PERSON; clock 2026-07-05."
            - "STANDARD raw scores: m06=1.0, m07=0.3333; per-month-rounded sum=(1.00+0.33)=1.33; /2*100=66.5."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}" }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "POST /cases/${c1_id}/visits", payload: { contact_type: "IN_PERSON", contact_start: "2026-06-05T10:00:00Z", contact_end: "2026-06-05T11:00:00Z", miles: 12 }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /cases/${c1_id}/visits", payload: { contact_type: "IN_PERSON", contact_start: "2026-06-12T10:00:00Z", contact_end: "2026-06-12T11:00:00Z", miles: 12 }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /cases/${c1_id}/visits", payload: { contact_type: "VIDEO", contact_start: "2026-06-20T10:00:00Z", contact_end: "2026-06-20T10:30:00Z", miles: 0 }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /cases/${c1_id}/visits", payload: { contact_type: "IN_PERSON", contact_start: "2026-07-03T10:00:00Z", contact_end: "2026-07-03T11:00:00Z", miles: 12 }, as: Volunteer, as_user_id: "${v1_id}" }
          trigger:
            - { call: "GET /cases/${c1_id}", payload: {}, as: Supervisor, as_user_id: "${s1_id}", captures: { std_pct: "$.data.contact_compliance_pct" } }
          assert:
            - "Case.${c1_id}.contact_compliance_pct == 66.5"
            - "value is NOT 66.7 (end-only rounding is rejected)"

  - rule_id: non_linear_state_machine
    instances:
      - name: court_report_revision_cycle
        grounds:
          - state_machines.CourtReport.SUBMITTED_to_RETURNED
          - state_machines.CourtReport.RETURNED_to_DRAFT
          - entities.CourtReport.fields.revision_count
        distinguishing_aspect: |
          CourtReport is CYCLIC: SUBMITTED->RETURNED->DRAFT->SUBMITTED loops back, and
          revision_count increments to 1 on the RETURNED->DRAFT hop — not a linear pipeline.
        test_recipe:
          setup:
            - "Clock 2026-06-01. S1, V1 sworn+assigned to C1. Hearing H1 SCHEDULED 2026-07-20T09:00:00Z. Draft report R1 for H1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}" }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "POST /cases/${c1_id}/hearings", payload: { hearing_type: "STATUS", scheduled_at: "2026-07-20T09:00:00Z" }, as: Supervisor, as_user_id: "${s1_id}", captures: { h1_id: "$.data.id" } }
            - { call: "POST /cases/${c1_id}/court-reports", payload: { hearing_id: "${h1_id}", content_summary: "v1", recommendation: "keep placement" }, as: Volunteer, as_user_id: "${v1_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /court-reports/${r1_id}/submit", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
          trigger:
            - { call: "POST /court-reports/${r1_id}/review", payload: { decision: "RETURN", comments: "add detail" }, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "POST /court-reports/${r1_id}/revise", payload: { content_summary: "v2" }, as: Volunteer, as_user_id: "${v1_id}", captures: { rc: "$.data.revision_count", st_after_revise: "$.data.status" } }
            - { call: "POST /court-reports/${r1_id}/submit", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /court-reports/${r1_id}/review", payload: { decision: "APPROVE" }, as: Supervisor, as_user_id: "${s1_id}", captures: { st_final: "$.data.status" } }
          assert:
            - "after revise: CourtReport.${r1_id}.status == DRAFT and revision_count == 1"
            - "after re-submit+approve: CourtReport.${r1_id}.status == APPROVED"

      - name: expense_branching_forkjoin
        grounds:
          - state_machines.ExpenseClaim.SUBMITTED_to_APPROVED
          - state_machines.ExpenseClaim.SUBMITTED_to_REJECTED
          - entities.Case.fields.reimbursement_committed_cents
        distinguishing_aspect: |
          ExpenseClaim SUBMITTED forks to {APPROVED, REJECTED} with DIVERGENT side-effects —
          APPROVE pins final_reimbursement_cents and commits budget; REJECT leaves final null and
          budget untouched. Different entity than the cyclic CourtReport.
        test_recipe:
          setup:
            - "Clock 2026-06-01. S1, V1 sworn+assigned to C1 (budget 20000). Two SUBMITTED claims X and Y (each 120mi/6000c)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}", reimbursement_budget_cents: 20000 }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "POST /expense-claims", payload: { case_id: "${c1_id}", period_month: "2026-06", total_miles: 120, other_expense_cents: 6000 }, as: Volunteer, as_user_id: "${v1_id}", captures: { ecx_id: "$.data.id" } }
            - { call: "POST /expense-claims", payload: { case_id: "${c1_id}", period_month: "2026-07", total_miles: 120, other_expense_cents: 6000 }, as: Volunteer, as_user_id: "${v1_id}", captures: { ecy_id: "$.data.id" } }
          trigger:
            - { call: "POST /expense-claims/${ecx_id}/approve", payload: {}, as: Supervisor, as_user_id: "${s1_id}", captures: { finx: "$.data.final_reimbursement_cents", stx: "$.data.status" } }
            - { call: "POST /expense-claims/${ecy_id}/reject", payload: { reason: "duplicate" }, as: Supervisor, as_user_id: "${s1_id}", captures: { finy: "$.data.final_reimbursement_cents", sty: "$.data.status" } }
            - { call: "GET /cases/${c1_id}", payload: {}, as: Supervisor, as_user_id: "${s1_id}", captures: { committed: "$.data.reimbursement_committed_cents" } }
          assert:
            - "ExpenseClaim.${ecx_id}.status == APPROVED and final_reimbursement_cents == 10700"
            - "ExpenseClaim.${ecy_id}.status == REJECTED and final_reimbursement_cents == null"
            - "Case.${c1_id}.reimbursement_committed_cents == 10700 (only the APPROVED branch committed)"

  - rule_id: transitive_cascade
    instances:
      - name: volunteer_deactivate_cascade_depth3
        grounds:
          - state_machines.Volunteer.ACTIVE_to_INACTIVE
          - state_machines.CaseAssignment.ACTIVE_to_ENDED
          - state_machines.Case.ASSIGNED_to_UNASSIGNED
          - state_machines.CourtReport.DRAFT_to_VOIDED
        distinguishing_aspect: |
          Depth-3 chain: Volunteer->INACTIVE (L1) ends its ACTIVE CaseAssignment and its Case
          ->UNASSIGNED (L2, caused by L1), and the now-UNASSIGNED Case's DRAFT CourtReport
          ->VOIDED (L3, caused by L2 — not by the deactivate directly).
        test_recipe:
          setup:
            - "Clock 2026-06-01. S1, V1 sworn+assigned to C1. Hearing H1 SCHEDULED. Report R1 left in DRAFT."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
