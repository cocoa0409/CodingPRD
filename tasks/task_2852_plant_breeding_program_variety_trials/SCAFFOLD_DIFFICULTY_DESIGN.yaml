              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-5001", generation_number: 6, seed_inventory_g: 500000, disease_resistance_scores: { RUST: 8, SDS: 7 }, quality_trait_values: { PROTEIN_PCT: 13.4 } }
              as: BreedingScientist
              captures: { line_id: $.data.id }
            - call: "POST /breeding-lines/${line_id}/stewardship-agreements"
              payload: { approved_markets: ["US_CORNBELT", "CA_PRAIRIE"], regulatory_dossier_ref: "DOS-2852-05", grower_agreement_ref: "GA-2852-05", effective_from: "2026-09-01", effective_to: "2029-09-01" }
              as: RegulatoryOfficer
              as_user_id: "ro-1"
              captures: { agr_id: $.data.id }
            - call: "POST /stewardship-agreements/${agr_id}/submit"
              payload: {}
              as: RegulatoryOfficer
              as_user_id: "ro-1"
            - call: "POST /stewardship-agreements/${agr_id}/review"
              payload: { outcome: "APPROVE" }
              as: RegulatoryOfficer
              as_user_id: "ro-2"
            - call: "POST /seed-increase-lots"
              payload: { line_id: "${line_id}", target_market: "US_CORNBELT", market_allocations: [{ market_code: "US_CORNBELT", demand_kg: 4000 }], launch_year: 2028 }
              as: SupplyPlanner
              captures: { lot1_id: $.data.id }
            - call: "POST /seed-increase-lots/${lot1_id}/start-production"
              payload: {}
              as: SupplyPlanner
            - call: "POST /seed-increase-lots"
              payload: { line_id: "${line_id}", target_market: "CA_PRAIRIE", market_allocations: [{ market_code: "CA_PRAIRIE", demand_kg: 9000 }], launch_year: 2028 }
              as: SupplyPlanner
              captures: { lot2_id: $.data.id }
          trigger:
            - call: "POST /stewardship-agreements/${agr_id}/suspend"
              payload: { suspension_reason: "refuge compliance audit failed in CA_PRAIRIE" }
              as: RegulatoryOfficer
              as_user_id: "ro-3"
          assert:
            - "L1: StewardshipAgreement.${agr_id}.status == SUSPENDED and suspension_reason is stored"
            - "L2: BreedingLine.${line_id}.stewardship_status == SUSPENDED while pipeline_stage stays NURSERY"
            - "L3: SeedIncreaseLot.${lot1_id}.status == ON_HOLD and hold_reason == STEWARDSHIP_SUSPENDED (IN_PRODUCTION was caught, not only RESERVED)"
            - "L3: SeedIncreaseLot.${lot2_id}.status == ON_HOLD and hold_reason == STEWARDSHIP_SUSPENDED"
            - "L4: BreedingLine.${line_id}.planned_launch_units_bags == 0 and BreedingProgram.${prog_id}.pre_commercial_units_bags == 0"
            - "no refund happened: BreedingLine.${line_id}.seed_inventory_g == 148750 and reserved_seed_g == 351250 (108125 + 243125), unlike the CANCELLED path"
            - "POST /seed-increase-lots for the same line -> ERR_STEWARDSHIP_SUSPENDED (409)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: restricted_stage_gate_outranks_site_capacity_overflow
        grounds:
          - validations[priority=26]
          - validations[priority=44]
          - calculations.site_capacity_peak_and_posture
          - endpoints["POST /trial-series/{id}/entries"]
        distinguishing_aspect: |
          One request violates priority 26 (RESTRICTED site will not take a
          STAGE_1 entry) and priority 44 (the post-insertion peak of 63 exceeds
          the 60-plot capacity) at the same time, and only ERR_SITE_RESTRICTED_STAGE
          may be returned. The pair is isolated by a twin request from a STAGE_2
          series, which clears rung 26 and then surfaces
          ERR_SITE_PLOT_CAPACITY_EXCEEDED - so an implementation that checks
          capacity first is caught by the first call and one that ignores
          capacity entirely is caught by the second.
        test_recipe:
          setup:
            - "One program, one objective, three lines."
            - "Site RS1 with total_plot_capacity 60 holding one ENTERED entry of 51 plots for the whole season, so utilisation is exactly 0.85 and capacity_posture is RESTRICTED."
            - "Two further series exist over the same site: RS-B at stage STAGE_1 and RS-C at stage STAGE_2, both with replication_count 3."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy Priority", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
