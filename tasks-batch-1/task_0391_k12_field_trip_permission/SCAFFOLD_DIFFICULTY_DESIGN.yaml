            - call: "POST /students"
              payload: { full_name: "S6", grade_level: 5, home_school_code: "SCH1" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_a: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "Library", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "ELEMENTARY", depart_at: "2026-09-11T09:00:00Z", return_at: "2026-09-11T11:00:00Z", capacity: 5, base_fee_cents: 1000, transport_cost_cents: 0, deposit_cents: 0 }
              as: Teacher
