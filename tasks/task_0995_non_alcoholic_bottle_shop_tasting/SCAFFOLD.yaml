    code: 200
    input: ["limit?", "offset?"]
    output: ClubSubscription[]
    side_effects: []
  - method: GET
    path: "/nabs/members/{id}/special-orders"
    description: "Reverse-reachability: special orders of member"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: SpecialOrder[]
    side_effects: []
  - method: GET
