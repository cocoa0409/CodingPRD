  - rule_id: compensating_invariant
    instances:
      - name: lot_units_conserved_across_allocate_and_release
        grounds:
          - entities.InventoryLot.fields.units_available
          - state_machines.Allocation.ACCEPTED_to_RELEASED
          - calculations.calc_allocation_credit
        distinguishing_aspect: |
          Conserved quantity = LOT UNITS: units_built == units_available +
          sum(allocated_units over active allocations) + sum(committed_units
          over RELEASED/EXPIRED/SUPERSEDED allocations) must hold after the
          forward action (allocate 10 of 10 -> available 0) AND after its
          compensation (release -> available 10) with zero drift.
        test_recipe:
          setup:
            - "Season 2026 in ALLOCATION; 10-unit lot of GX-100; channel BigBox"
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "BigBox", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 10 }, as: PlannerAdmin, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
          trigger:
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 10, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "GET /grillops/seasons/${s_id}/lots", as: PlannerAdmin, captures: { avail_after_alloc: "$.data[0].units_available" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { a_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "RELEASE", expected_allocation_version: "${a_v2}" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { rel_st: "$.data.status", rel_units: "$.data.allocated_units" } }
            - { call: "GET /grillops/seasons/${s_id}/lots", as: PlannerAdmin, captures: { avail_after_release: "$.data[0].units_available" } }
          assert:
            - "captured avail_after_alloc == 0 (forward action moved all 10 units into the reservation)"
            - "captured rel_st == RELEASED and rel_units == 0 (allocated := committed == 0)"
            - "captured avail_after_release == 10 (compensation restored the pool exactly)"
            - "invariant: units_built(10) == units_available(10) + active allocated(0) + inactive committed(0) — no drift after allocate+release"

      - name: assembler_active_count_conserved_across_assign_and_complete
        grounds:
          - entities.Assembler.fields.active_job_count
          - state_machines.AssemblyJob.REQUESTED_to_SCHEDULED
          - state_machines.AssemblyJob.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity = CARDINALITY OF A SET (different conserved
          quantity than lot units): assembler.active_job_count must equal the
          count of that assembler's jobs in {SCHEDULED, IN_PROGRESS} after every
          forward/compensating pair — assign(+1)/cancel(-1) and
          assign(+1)/complete(-1) both return the counter to its baseline.
        test_recipe:
