                  - { category: MANAGEMENT_FEE_EXPENSE, month_index: 1, budget_amount_cents: 120000 }
                  - { category: OTHER_OPEX, month_index: 1, budget_amount_cents: 90000 }
                  - { category: CAPITAL, month_index: 1, budget_amount_cents: 36000000 }
              as: AssetManager
              as_user_id: "am-1"
              captures: { rent_m1: "$.data[0].id", rent_m2: "$.data[1].id", rent_m3: "$.data[2].id", rent_m4: "$.data[3].id", cam_m1: "$.data[12].id", cam_m2: "$.data[13].id", cam_m3: "$.data[14].id", cam_m4: "$.data[15].id" }
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/business-plans/${pl1}/approve", payload: {}, as: PortfolioDirector }
            - { call: "POST /api/actuals-reports", payload: { plan_id: "${pl1}", month_index: 1, lines: [ { budget_line_id: "${rent_m1}", actual_amount_cents: 3000000 }, { budget_line_id: "${cam_m1}", actual_amount_cents: 500000 } ] }, as: PropertyManager, as_user_id: "${pm1}", captures: { ar1: $.data.id } }
            - { call: "POST /api/actuals-reports/${ar1}/accept", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/actuals-reports", payload: { plan_id: "${pl1}", month_index: 2, lines: [ { budget_line_id: "${rent_m2}", actual_amount_cents: 3000000 }, { budget_line_id: "${cam_m2}", actual_amount_cents: 500000 } ] }, as: PropertyManager, as_user_id: "${pm1}", captures: { ar2: $.data.id } }
            - { call: "POST /api/actuals-reports/${ar2}/accept", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/actuals-reports", payload: { plan_id: "${pl1}", month_index: 3, lines: [ { budget_line_id: "${rent_m3}", actual_amount_cents: 3000000 }, { budget_line_id: "${cam_m3}", actual_amount_cents: 500000 } ] }, as: PropertyManager, as_user_id: "${pm1}", captures: { ar3: $.data.id } }
            - { call: "POST /api/actuals-reports/${ar3}/accept", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/actuals-reports", payload: { plan_id: "${pl1}", month_index: 4, lines: [ { budget_line_id: "${rent_m4}", actual_amount_cents: 3000000 }, { budget_line_id: "${cam_m4}", actual_amount_cents: 500000 } ] }, as: PropertyManager, as_user_id: "${pm1}", captures: { ar4: $.data.id } }
            - { call: "POST /api/actuals-reports/${ar4}/accept", payload: {}, as: AssetManager, as_user_id: "am-1" }
          trigger:
            - { call: "GET /api/business-plans/${pl1}/variance-summary", payload: {}, as: Analyst, captures: { sum_trailing: $.data.annualized_actual_noi_cents, sum_budget: $.data.total_budget_noi_cents } }
          assert:
            - "variance-summary.annualized_actual_noi_cents == 30000000 (TRAILING_ACTUALS: round_half_up(10000000 * 12 / 4))"
            - "variance-summary.total_budget_noi_cents == 31860000 (BUDGET_BASELINE: 38,550,000 - 6,690,000)"
            - "sum_trailing != sum_budget — identical inputs, two valid variants, different numbers"

      - name: valuation_external_vs_internal_cap
        grounds:
          - calculations.implied_valuation
          - entities.Valuation.fields.implied_value_cents
        distinguishing_aspect: |
          Entity domain = Valuation (distinct from the BusinessPlan NOI domain of the sibling
          instance): same asset state (trailing NOI 30,000,000) yields EXTERNAL_APPRAISAL
          implied 520,000,000 vs INTERNAL_CAP implied 500,000,000.
        test_recipe:
