            - "After that sweep QualityIssue.${iss_id}.status == SUBMITTED with triage_breached == true and triaged_at still null"
            - "Response is 200 with response.data.status == TRIAGED, triaged_at == 2026-08-05T00:00:00Z and triage_breached == true (the sweep's flag is not cleared by the late triage)"
            - "QualityIssue.${iss_id}.triage_due_at == 2026-08-04T00:00:00Z and correction_due_at is null — the correction clock is anchored on accepted_at, which has not happened"
            - "QualityIssue.${iss_id}.correction_breached == false"
            - "Department.${dept_id}.overdue_correction_count == 0, risk_points == 0, compliance_posture == OPEN — only ACCEPTED issues flagged correction_breached contribute"
            - "Dataset.${ds_id}.publication_status == PUBLISHED and currency_status == CURRENT (2026-08-05 is before next_due_at 2026-08-08T00:00:00Z)"

