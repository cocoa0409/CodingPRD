            - "the sweep on the 2027-03-08 anniversary week flips CreditAccount.${a1_id}.account_status to CHARGED_OFF"

      - name: validation_requested_limit_above_absolute_cap_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_CREDIT_REQUEST_ABOVE_CAP]"]
        distinguishing_aspect: "A requested_limit_cents above the appendix cap is rejected outright with ERR_CREDIT_REQUEST_ABOVE_CAP 402 before any scoring runs, while a request at the cap is accepted and adjudicated normally."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; technician T"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
