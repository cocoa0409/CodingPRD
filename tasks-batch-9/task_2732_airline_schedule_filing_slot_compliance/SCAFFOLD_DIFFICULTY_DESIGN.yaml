      - name: slot_transaction_transfer_and_exchange_branches_join_at_executed_with_divergent_effects
        grounds:
          - state_machines.SlotTransaction.PROPOSED_to_COUNTERPARTY_ACCEPTED
          - state_machines.SlotTransaction.COUNTERPARTY_ACCEPTED_to_EXECUTED
          - state_machines.SlotHolding.HELD_to_TRANSFERRED_OUT
          - entities.SlotTransaction.fields.successor_slot_holding_id
          - entities.SlotHolding.fields.historic_predecessor_holding_id
          - concurrency_rules[slot_transaction_propose_occ]
        distinguishing_aspect: |
          BRANCHING FORK-JOIN on the SlotTransaction entity (not FlightLeg, not ScheduleVersion): both
          branches leave COUNTERPARTY_ACCEPTED for the same EXECUTED join state, but the TRANSFER branch
          moves its offered holding HELD -> TRANSFERRED_OUT and mints a successor holding
          (successor_slot_holding_id non-null) while the EXCHANGE branch keeps both holdings HELD, swaps
          their carrier_id and leaves successor_slot_holding_id null.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE, is_home_carrier true) and counterparty PT (PT)."
            - "FRA is LEVEL_3_COORDINATED with gate_count 2; season W26 is OPEN."
            - "Three DEPARTURE SlotHoldings at FRA in season W26, all days_of_week \"1\" and series_weeks 5 but at three DIFFERENT slot times so no series conflict arises: 08:00Z held by HX, 09:00Z held by HX, 10:00Z held by PT. All have historic_precedence false."
            - "No FlightLeg is attached to any of them, so the branch difference is observed purely at holding level."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /carriers"
              payload: { iata_code: "PT", icao_code: "PTA", country_code: "PT", is_home_carrier: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { partner_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_a_id: "$.data.id", sh_a_version: "$.data.version" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T09:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_b_id: "$.data.id", sh_b_version: "$.data.version" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${partner_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T10:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_c_id: "$.data.id" }
          trigger:
            - call: "POST /slot-transactions"
              payload: { kind: "TRANSFER", counterparty_carrier_id: "${partner_carrier_id}", offered_slot_holding_id: "${sh_a_id}", response_deadline_utc: "2026-08-20T23:59:59Z", expected_slot_holding_version: "${sh_a_version}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { t1_id: "$.data.id" }
            - call: "POST /slot-transactions/${t1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: PartnerCarrier
              as_user_id: "${partner_carrier_id}"
            - call: "POST /slot-transactions/${t1_id}/approve"
              payload: { decision: "APPROVE" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { succ_id: "$.data.successor_slot_holding_id" }
            - call: "POST /slot-transactions"
              payload: { kind: "EXCHANGE", counterparty_carrier_id: "${partner_carrier_id}", offered_slot_holding_id: "${sh_b_id}", counter_slot_holding_id: "${sh_c_id}", response_deadline_utc: "2026-08-20T23:59:59Z", expected_slot_holding_version: "${sh_b_version}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { t2_id: "$.data.id" }
            - call: "POST /slot-transactions/${t2_id}/respond"
              payload: { decision: "ACCEPT" }
              as: PartnerCarrier
              as_user_id: "${partner_carrier_id}"
            - call: "POST /slot-transactions/${t2_id}/approve"
              payload: { decision: "APPROVE" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
          assert:
            - "SlotTransaction.${t1_id}.status == EXECUTED and SlotTransaction.${t2_id}.status == EXECUTED — both branches join at the same terminal state"
            - "TRANSFER branch: SlotHolding.${sh_a_id}.holding_status == TRANSFERRED_OUT and retains_historic_precedence == false and pending_transaction_id == null"
            - "TRANSFER branch: SlotTransaction.${t1_id}.successor_slot_holding_id == ${succ_id} and is not null"
            - "TRANSFER branch: SlotHolding.${succ_id}.carrier_id == ${partner_carrier_id}, holding_status == HELD, historic_predecessor_holding_id == ${sh_a_id}, slot_time_utc == \"2026-11-02T08:00:00Z\", days_of_week == \"1\", series_weeks == 5, planned_operations == 5, attached_operations == 0"
            - "EXCHANGE branch: SlotTransaction.${t2_id}.successor_slot_holding_id == null — no successor holding was minted"
            - "EXCHANGE branch: SlotHolding.${sh_b_id}.holding_status == HELD and carrier_id == ${partner_carrier_id}"
            - "EXCHANGE branch: SlotHolding.${sh_c_id}.holding_status == HELD and carrier_id == ${home_carrier_id}"
            - "EXCHANGE branch: SlotHolding.${sh_b_id}.slot_time_utc == \"2026-11-02T09:00:00Z\" and SlotHolding.${sh_c_id}.slot_time_utc == \"2026-11-02T10:00:00Z\" — each row keeps its own time"
            - "GET /slot-holdings?historic_predecessor_holding_id=${sh_a_id} returns exactly 1 row and GET /slot-holdings?historic_predecessor_holding_id=${sh_b_id} returns 0 rows"
            - "exactly one of the two branches moved a holding out of HELD and exactly one minted a successor holding, proving the per-branch side-effect sets diverge"

  # =====================================================================
  # RULE 4 — transitive_cascade
  # Instance 1 = depth 5, triggered by FlightLeg.FILED_to_REFILE_REQUIRED
  #              (PATCH retime of a filed leg).
  # Instance 2 = depth 4, triggered by
  #              SlotTransaction.COUNTERPARTY_ACCEPTED_to_EXECUTED
  #              (coordinator approval of a TRANSFER).
  # Every link is CAUSED BY the previous link, never a fan-out sibling.
  # =====================================================================
  - rule_id: transitive_cascade
    instances:

      - name: retiming_a_filed_leg_cascades_five_levels_to_filing_submission_rejection
        grounds:
          - state_machines.FlightLeg.FILED_to_REFILE_REQUIRED
          - state_machines.ScheduleVersion.CLEAN_to_BLOCKED
          - state_machines.FilingSubmission.ACKNOWLEDGED_to_REJECTED
          - state_machines.ScheduleVersion.FILED_to_VALIDATED
          - calculations.slot_utilization_credit
          - calculations.schedule_compliance_score
        distinguishing_aspect: |
          Triggering transition is FlightLeg FILED -> REFILE_REQUIRED via PATCH retime, and the chain is
          five links deep where each link is the CAUSE of the next: L1 slot ids nulled -> L2 holding
          attached_operations 4->3 and utilization_pct_as_filed 80.00->60.00 -> L3 at_risk_of_loss
          false->true -> L4 version at_risk_slot_count 0->1, score 100.00->77.00, compliance_state
          CLEAN->BLOCKED -> L5 the ACKNOWLEDGED FilingSubmission moves to REJECTED and
          filing_charge_accrued_cents is reversed 22815->0.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE); FRA LEVEL_3_COORDINATED gate_count 2; MUC LEVEL_2_FACILITATED gate_count 3."
            - "Season W26 is OPEN."
            - "One FRA DEPARTURE SlotHolding at 2026-11-02T08:00:00Z, days_of_week \"1\", series_weeks 5 -> planned_operations 5."
            - "Four FRA->MUC Monday legs 08:00Z->09:00Z on 2026-11-02/09/16/23, all assigned to D-AHXA and all attached to the holding -> attached_operations 4, utilization_pct_as_filed 80.00, at_risk_of_loss false, schedule_compliance_score 100.00, compliance_state CLEAN."
            - "ScheduleVersion W26-R1 validated by usr-comp-1; an EXPEDITED IATA_SSIM submission (changed_leg_count 4, total_charge_cents 22815) transmitted by usr-file-1 and then acknowledged ACCEPT, so it is ACKNOWLEDGED, filing_status is FILED, all four legs are FILED and filing_charge_accrued_cents is 22815."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${fra_id}", registration: "D-AHXA", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240, maintenance_check_required: false }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { ac1_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-R1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-02T08:00:00Z", arr_utc: "2026-11-02T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg1_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-09T08:00:00Z", arr_utc: "2026-11-09T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg2_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-16T08:00:00Z", arr_utc: "2026-11-16T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg3_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-23T08:00:00Z", arr_utc: "2026-11-23T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg4_id: "$.data.id" }
            - call: "POST /flight-legs/${leg1_id}/assign-aircraft"
              payload: { aircraft_id: "${ac1_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg2_id}/assign-aircraft"
              payload: { aircraft_id: "${ac1_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg3_id}/assign-aircraft"
              payload: { aircraft_id: "${ac1_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg4_id}/assign-aircraft"
              payload: { aircraft_id: "${ac1_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg1_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg2_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg3_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg4_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /schedule-versions/${sv_id}/validate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
            - call: "POST /filing-submissions"
              payload: { schedule_version_id: "${sv_id}", distribution_system: "IATA_SSIM", change_window: "EXPEDITED" }
              as: FilingAgent
              as_user_id: "usr-file-1"
              captures: { sub_id: "$.data.id" }
            - call: "POST /filing-submissions/${sub_id}/transmit"
              payload: {}
              as: FilingAgent
              as_user_id: "usr-file-1"
            - call: "POST /filing-submissions/${sub_id}/acknowledge"
              payload: { outcome: "ACCEPT" }
              as: FilingAgent
              as_user_id: "usr-file-1"
          trigger:
            - call: "PATCH /flight-legs/${leg4_id}"
              payload: { dep_utc: "2026-11-23T10:00:00Z", arr_utc: "2026-11-23T11:00:00Z" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "L1 — FlightLeg.${leg4_id}.status == REFILE_REQUIRED, dep_utc == \"2026-11-23T10:00:00Z\", departure_slot_holding_id == null and arrival_slot_holding_id == null"
            - "L2 — SlotHolding.${sh_id}.attached_operations == 3 and utilization_pct_as_filed == 60.00 (was 4 and 80.00), caused by L1"
            - "L3 — SlotHolding.${sh_id}.at_risk_of_loss == true (was false), caused by L2 crossing below UTILIZATION_THRESHOLD_PCT 80.00 while still HELD with attached_operations >= 1"
            - "L4 — ScheduleVersion.${sv_id}.at_risk_slot_count == 1, unslotted_leg_count == 1, schedule_compliance_score == 77.00 and compliance_state == BLOCKED, caused by L3"
            - "L5 — FilingSubmission.${sub_id}.status == REJECTED with rejection_reason == \"SCHEDULE_BLOCKED\", caused by L4"
            - "L5 — ScheduleVersion.${sv_id}.filing_charge_accrued_cents == 0, reversed from 22815 by the L5 rejection"
            - "L5 — ScheduleVersion.${sv_id}.filing_status == VALIDATED (was FILED) and FlightLeg.${leg1_id}.status == FlightLeg.${leg2_id}.status == FlightLeg.${leg3_id}.status == SLOT_BACKED, while FlightLeg.${leg4_id} stays REFILE_REQUIRED (conditional cascade skips it)"
            - "SlotHolding.${sh_id}.utilization_pct == 0.00 throughout — no SlotUtilizationRecord exists, so the as_operated variant is untouched by this cascade"
            - "no PassengerNotificationObligation was created because booked_first + booked_business + booked_economy == 0 on ${leg4_id}"

      - name: approving_a_slot_transfer_cascades_four_levels_to_codeshare_resync_flag
        grounds:
          - state_machines.SlotTransaction.COUNTERPARTY_ACCEPTED_to_EXECUTED
          - state_machines.SlotHolding.HELD_to_TRANSFERRED_OUT
          - state_machines.FlightLeg.FILED_to_REFILE_REQUIRED
          - state_machines.ScheduleVersion.CLEAN_to_WARNED
          - entities.FilingSubmission.fields.resync_required
        distinguishing_aspect: |
          A DIFFERENT triggering transition from instance 1 — SlotTransaction COUNTERPARTY_ACCEPTED ->
          EXECUTED via coordinator approval, not a PATCH retime — producing a four-link chain: L1 offered
          holding HELD -> TRANSFERRED_OUT with a successor minted -> L2 its two FILED legs become
          REFILE_REQUIRED -> L3 version unslotted_leg_count 0->2, score 100.00->84.00, compliance_state
