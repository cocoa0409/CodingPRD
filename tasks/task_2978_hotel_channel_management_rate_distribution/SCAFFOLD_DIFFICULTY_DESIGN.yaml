              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { ota1_conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${ota1_conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "BRAND", channel_kind: "DIRECT_BRAND", commission_bp: 0 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /distribution/channels/${brand_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://brand.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { brand_conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${brand_conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-11" }
              as: RevenueManager
              captures: { inv_11_id: $.data.id }
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-12" }
              as: RevenueManager
            - call: "GET /distribution/room-types/${king_id}"
              payload: {}
              as: RevenueManager
              captures: { king_v1: $.data.version }
            - call: "POST /distribution/room-types/${king_id}/allocations"
              payload: { channel_id: "${ota1_id}", allocated_units: 6, start_date: "2026-09-10", end_date: "2026-09-12", expected_room_type_version: "${king_v1}" }
              as: RevenueManager
              captures: { ota1_alloc_id: $.data.id }
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${brand_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-11", nights: 1 }
              as: RevenueManager
              captures: { res_1_id: $.data.id }
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${brand_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-11", nights: 1 }
              as: RevenueManager
              captures: { res_2_id: $.data.id }
            - call: "GET /distribution/room-types/${king_id}"
