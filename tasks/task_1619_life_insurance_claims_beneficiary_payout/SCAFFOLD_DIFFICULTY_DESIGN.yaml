            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Roe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Alice Roe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { cl_v: $.data.version } }
            - { call: "POST /beneficiary-claims/${bc}/elections", payload: { option: "RETAINED_ASSET_ACCOUNT", expected_claim_version: "${cl_v}" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { el: $.data.id } }
            - { call: "POST /payout-elections/${el}/confirm", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims/${cl}/execute-payment", payload: {}, as: ClaimsApprover, as_user_id: "approver-1" }
            - { call: "GET /retained-asset-accounts", payload: { claim_id: "${cl}" }, as: ClaimsApprover, captures: { acct: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /retained-asset-accounts/${acct}/withdrawals", payload: { amount_cents: 4000000 }, as: ClaimsApprover, as_user_id: "approver-1", captures: { bal1: $.data.balance_cents, wd1: $.data.withdrawn_total_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /retained-asset-accounts/${acct}/withdrawals", payload: { amount_cents: 6000000 }, as: ClaimsApprover, as_user_id: "approver-1", captures: { bal2: $.data.balance_cents, wd2: $.data.withdrawn_total_cents, st2: $.data.status, int2: $.data.interest_paid_cents } }
          assert:
            - "After partial withdrawal: balance_cents == 6000000, withdrawn_total_cents == 4000000, status OPEN (6000000 + 4000000 == 10000000 == deposited_cents)"
            - "After final withdrawal: balance_cents == 0, withdrawn_total_cents == 10000000, status == CLOSED (0 + 10000000 == deposited_cents — invariant holds)"
            - "interest_paid_cents == 45113 (compound on closing balance 6000000 x ((1+0.03/12)^3 - 1) = 45112.59); interest is posted outside the principal invariant"

      - name: legal_hold_roundtrip_conserves_payable_liability
        grounds:
          - entities.Claim.fields.total_payable_cents
          - state_machines.Claim.APPROVED_to_LEGAL_HOLD
          - state_machines.Claim.LEGAL_HOLD_to_APPROVED
          - state_machines.PayoutElection.SUSPENDED_to_ELECTED
        distinguishing_aspect: |
          Conserved quantity: claim payable liability (different quantity than RAA
          cash principal). The forward action (rival filing -> hold) plus its
          compensating action (rival withdrawal + incumbent re-validation ->
          release) restore hold_return_state APPROVED with total_payable_cents
          bit-identical (25068493) and every allocation restored; the only
          sanctioned drift is the election dropping CONFIRMED -> ELECTED
          (re-confirmation required).
        test_recipe:
          setup:
            - "Identical to rival_beneficiary_filing_cascade up to the hold: IL policy face 25000000, Alice 60%/Bob 40%, approved 2026-04-10 (total 25068493; Alice 15041096, Bob 10027397), Alice's LUMP_SUM election CONFIRMED then SUSPENDED by the hold"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-INV-2", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 25000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 60, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des_a: $.data.id } }
            - { call: "GET /policies/${pol}", payload: {}, as: PolicyAdministrator, captures: { pol_v2: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Bob Doe", beneficiary_type: "PRIMARY", share_percent: 40, effective_date: "2024-03-01", expected_policy_version: "${pol_v2}" }, as: PolicyAdministrator, captures: { des_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des_a}", claimant_name: "Alice Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc_a: $.data.id } }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des_b}", claimant_name: "Bob Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc_b: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc_a}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /beneficiary-claims/${bc_b}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-10T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { cl_v: $.data.version, total_pre: $.data.total_payable_cents } }
            - { call: "POST /beneficiary-claims/${bc_a}/elections", payload: { option: "LUMP_SUM", expected_claim_version: "${cl_v}" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { el: $.data.id } }
            - { call: "POST /payout-elections/${el}/confirm", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des_a}", claimant_name: "Eve Smith", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc_eve: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc_eve}/withdraw", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /beneficiary-claims/${bc_a}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "GET /claims/${cl}", payload: {}, as: ClaimsExaminer, captures: { cl_status: $.data.status, total_post: $.data.total_payable_cents } }
            - { call: "GET /beneficiary-claims/${bc_a}", payload: {}, as: ClaimsExaminer, captures: { bc_a_status: $.data.status, bc_a_alloc: $.data.allocated_amount_cents } }
            - { call: "GET /beneficiary-claims/${bc_a}/elections", payload: {}, as: ClaimsExaminer, captures: { el_status: "$.data[0].status" } }
          assert:
            - "Claim.${cl}.status == APPROVED (restored via hold_return_state) and hold_return_state == null"
            - "total_payable_cents before hold == after release == 25068493 (no liability drift from the dispute round trip)"
            - "BeneficiaryClaim.${bc_a} restored to PAYABLE with allocated_amount_cents == 15041096 (allocation re-run is deterministic over the unchanged total)"
            - "PayoutElection.${el}.status == ELECTED (CONFIRMED was lost through SUSPENDED; re-confirmation is the sanctioned one-way drift)"
            - "15041096 + 10027397 == 25068493 (allocation conservation)"
