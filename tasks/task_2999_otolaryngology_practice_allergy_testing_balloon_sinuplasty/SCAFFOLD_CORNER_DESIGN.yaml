  # ===========================================================================
  # SECTION 6 — ERRORS
  # Table 6 of the claim-extraction guide declares no claim-type rows, so every
  # instance below uses the guide's violation_to_error label, exactly as the
  # SKILL example does.
  # ===========================================================================
  - section: errors
    instances:

      - name: entity_not_found_returns_404_for_every_path_parameter
        claim_type: violation_to_error
        grounds:
          - errors.ERR_PAYER_POLICY_NOT_FOUND
          - errors.ERR_PATIENT_NOT_FOUND
          - errors.ERR_ALLERGY_TEST_ORDER_NOT_FOUND
          - errors.ERR_REACTION_EVENT_NOT_FOUND
          - errors.ERR_IMMUNOTHERAPY_VIAL_NOT_FOUND
          - errors.ERR_IMMUNOTHERAPY_DOSE_NOT_FOUND
          - errors.ERR_SINUPLASTY_CASE_NOT_FOUND
          - errors.ERR_DIAGNOSTIC_STUDY_NOT_FOUND
          - errors.ERR_DEVICE_DISPENSE_NOT_FOUND
          - errors.ERR_ENDOSCOPE_ASSET_NOT_FOUND
          - errors.ERR_SUPPLY_LOT_NOT_FOUND
          - errors.ERR_SURGERY_CENTER_BLOCK_NOT_FOUND
          - errors.ERR_PROCEDURE_BOOKING_NOT_FOUND
          - validations[priority 4]
        distinguishing_aspect: "All thirteen entity-scoped 404s are separate error ids, one per entity, and a body-borne FK raises the same id as the path parameter of the same entity — so POST /patients with an unknown payer_policy_id is ERR_PAYER_POLICY_NOT_FOUND, not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "No rows are needed: every trigger references a syntactically well-formed but unknown id."
          setup_api_calls: []
          trigger:
            - call: "GET /payer-policies/pol_absent_2999"
              payload: {}
              as: PracticeAdmin
            - call: "GET /patients/pat_absent_2999"
              payload: {}
              as: PracticeAdmin
            - call: "GET /allergy-test-orders/ord_absent_2999"
              payload: {}
              as: AllergyNurse
            - call: "GET /reaction-events/evt_absent_2999"
              payload: {}
              as: AllergyNurse
            - call: "GET /immunotherapy-vials/vial_absent_2999"
              payload: {}
              as: AllergyNurse
            - call: "GET /immunotherapy-doses/dose_absent_2999"
              payload: {}
              as: AllergyNurse
            - call: "GET /sinuplasty-cases/case_absent_2999"
              payload: {}
              as: Otolaryngologist
            - call: "GET /diagnostic-studies/study_absent_2999"
              payload: {}
              as: Audiologist
            - call: "GET /device-dispenses/disp_absent_2999"
              payload: {}
              as: Audiologist
            - call: "GET /endoscopes/scope_absent_2999"
              payload: {}
              as: SterileProcessingTech
            - call: "GET /supply-lots/lot_absent_2999"
              payload: {}
              as: PracticeAdmin
            - call: "GET /surgery-center-blocks/block_absent_2999"
              payload: {}
              as: PracticeAdmin
            - call: "GET /procedure-bookings/booking_absent_2999"
              payload: {}
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { payer_policy_id: "pol_absent_2999", mrn: "MRN-10234", full_name: "Fk Probe", date_of_birth: "1970-01-01" }
              as: PracticeAdmin
          assert:
            - "Every one of the thirteen GETs returns HTTP 404"
            - "The ids are entity-specific and distinct in order: error.id == \"ERR_PAYER_POLICY_NOT_FOUND\", \"ERR_PATIENT_NOT_FOUND\", \"ERR_ALLERGY_TEST_ORDER_NOT_FOUND\", \"ERR_REACTION_EVENT_NOT_FOUND\", \"ERR_IMMUNOTHERAPY_VIAL_NOT_FOUND\", \"ERR_IMMUNOTHERAPY_DOSE_NOT_FOUND\", \"ERR_SINUPLASTY_CASE_NOT_FOUND\", \"ERR_DIAGNOSTIC_STUDY_NOT_FOUND\", \"ERR_DEVICE_DISPENSE_NOT_FOUND\", \"ERR_ENDOSCOPE_ASSET_NOT_FOUND\", \"ERR_SUPPLY_LOT_NOT_FOUND\", \"ERR_SURGERY_CENTER_BLOCK_NOT_FOUND\", \"ERR_PROCEDURE_BOOKING_NOT_FOUND\""
            - "The final POST returns HTTP 404 with error.id == \"ERR_PAYER_POLICY_NOT_FOUND\" — a body FK is resolved by priority 5 to the same entity-specific 404, and no Patient row is created"
            - "Every failure carries the declared error envelope: response_type == \"error\" and a non-empty error.message"

