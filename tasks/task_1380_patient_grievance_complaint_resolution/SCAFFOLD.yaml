  # --- ResponseLetter ---
  - method: POST
    path: "/api/patient-cases/{id}/response-letters"
    description: "Draft a response letter (grievance: requires FINDINGS_ACCEPTED; complaint: requires RESPONSE_DRAFTING). One non-terminal letter per case."
    roles: [DepartmentInvestigator]
    code: 201
    input: [sections, body_summary]
    output: ResponseLetter
    side_effects: ["supersedes_letter_id links to most recent SUPERSEDED letter if any"]
  - method: GET
    path: "/api/response-letters"
    description: "List letters"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "case_id?", "status?", "supersedes_letter_id?"]
    output: "ResponseLetter[]"
    side_effects: []
  - method: GET
    path: "/api/response-letters/{id}"
    description: "Get a letter"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: []
    output: ResponseLetter
    side_effects: []
  - method: POST
    path: "/api/response-letters/{id}/submit-review"
    description: "Submit letter for review (content standard enforced)"
    roles: [DepartmentInvestigator]
    code: 200
    input: []
    output: ResponseLetter
    side_effects: ["DRAFT/RETURNED -> IN_REVIEW; case -> RESPONSE_REVIEW"]
  - method: POST
    path: "/api/response-letters/{id}/approve"
    description: "Approve letter (SoD + co-sign + escalation gate)"
    roles: [PatientRelationsDirector, QualityRiskOfficer]
    code: 200
