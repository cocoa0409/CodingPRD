scaffold_corner_design:
  # ==========================================================================
  # Section: entities — basic CRUD, defaults, system fields
  # ==========================================================================
  - section: entities
    instances:
      - name: member_creation_with_defaults
        claim_type: creation
        grounds: [entities.Member]
        distinguishing_aspect: "POST /cob/members with all required fields returns 201; default values applied (employer_size=0, custodial_decree_on_file=false, medicare_entitlement_reason=NONE); status starts ENROLLED; common fields populated."
        test_recipe:
          setup:
            - "Empty DB; clock default 2026-05-01"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
          trigger:
            - call: "POST /cob/members"
              payload: { member_external_id: "MD", full_name: "D", date_of_birth: "1990-01-01", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
          assert:
            - "Member.${mid}.status == ENROLLED"
            - "Member.${mid}.custodial_decree_on_file == false"
            - "Member.${mid}.medicare_entitlement_reason == NONE"
            - "Member.${mid}.other_coverage_count == 0"
            - "Member.${mid}.version == 1"

      - name: member_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Member", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent member UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
          trigger:
            - call: "GET /cob/members/{00000000-0000-0000-0000-000000000000}"
              payload: {}
              as: COBAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: member_list_pagination
        claim_type: listing
        grounds: [entities.Member, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /cob/members returns pagination envelope with limit/offset/total_count/has_more; default limit=10."
        test_recipe:
          setup: ["Create 3 members"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "A", full_name: "A", date_of_birth: "1980-01-01", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
            - call: "POST /cob/members"
              payload: { member_external_id: "B", full_name: "B", date_of_birth: "1980-01-01", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
            - call: "POST /cob/members"
              payload: { member_external_id: "C", full_name: "C", date_of_birth: "1980-01-01", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
          trigger:
            - call: "GET /cob/members"
              payload: {}
              as: COBAnalyst
          assert:
            - "response contains pagination fields limit, offset, total_count, has_more"
            - "total_count == 3"

      - name: coverage_invalid_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_COVERAGE_WINDOW]"]
        distinguishing_aspect: "POST /cob/members/{id}/coverages with effective_from >= effective_to returns ERR_INVALID_COVERAGE_WINDOW 400."
        test_recipe:
          setup: ["Member created"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "W", full_name: "W", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "X", plan_name: "X", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", effective_from: "2026-12-31", effective_to: "2026-01-01", verification_source: "MEMBER_SURVEY" }
              as: COBAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_COVERAGE_WINDOW"
            - "http_status == 400"

      - name: claimline_immutable_after_claim_paid
        claim_type: state_constraint
        grounds: [entities.ClaimLine, state_machines.Claim]
        distinguishing_aspect: "ClaimLine cannot be added once claim is PAID (state must be RECEIVED for line additions)."
        test_recipe:
          setup: ["Claim adjudicated and paid"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/providers"
              payload: { npi: "8888888888", legal_name: "P", tin: "T" }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /cob/members"
              payload: { member_external_id: "MI", full_name: "I", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "OWN", plan_name: "Own", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1980-01-01", effective_from: "2026-01-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { cown: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cown}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
              payload: { as_of_service_date: "2026-02-01", expected_member_version: "${mv}" }
              as: COBAnalyst
              captures: { pdid: $.data.id }
            - call: "POST /cob/members/${mid}/primacy-determinations/${pdid}/finalize"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/claims"
              payload: { member_id: "${mid}", provider_id: "${pid}", claim_external_id: "CI", service_date: "2026-02-10", received_date: "2026-02-12", total_billed_cents: 10000 }
              as: ClaimsExaminer
              captures: { clid: $.data.id }
            - call: "POST /cob/claims/${clid}/lines"
              payload: { line_number: 1, procedure_code: "X", billed_cents: 10000, allowed_cents: 8000 }
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/pay"
              payload: {}
              as: ClaimsExaminer
          trigger:
            - call: "POST /cob/claims/${clid}/lines"
              payload: { line_number: 2, procedure_code: "Y", billed_cents: 1000, allowed_cents: 800 }
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

  # ==========================================================================
  # Section: state_machines — invalid transitions, initial state, terminal
  # ==========================================================================
  - section: state_machines
    instances:
      - name: coverage_initial_state_pending_verification
        claim_type: initial_state
        grounds: [state_machines.Coverage, entities.Coverage.fields.verification_status]
        distinguishing_aspect: "Newly created Coverage starts in PENDING_VERIFICATION."
        test_recipe:
          setup: ["Member exists"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "IN", full_name: "I", date_of_birth: "1980-01-01", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "P", plan_name: "P", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", effective_from: "2026-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cstate: $.data.verification_status }
          assert:
            - "verification_status == PENDING_VERIFICATION"

      - name: coverage_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Coverage]
        distinguishing_aspect: "After Coverage is VERIFIED, a second /verify call is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Coverage verified"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "TL", full_name: "T", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "P", plan_name: "P", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", effective_from: "2026-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cid}/verify"
              payload: {}
              as: COBAnalyst
          trigger:
            - call: "POST /cob/members/${mid}/coverages/${cid}/verify"
              payload: {}
              as: COBAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: claim_cannot_skip_adjudicate_to_pay
        claim_type: invalid_transition
        grounds: [state_machines.Claim.ADJUDICATED_to_PAID]
        distinguishing_aspect: "Calling /pay on a claim still in RECEIVED is rejected."
        test_recipe:
          setup: ["Claim created but not adjudicated"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/providers"
              payload: { npi: "1212121212", legal_name: "P", tin: "T" }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /cob/members"
              payload: { member_external_id: "SK", full_name: "S", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/claims"
              payload: { member_id: "${mid}", provider_id: "${pid}", claim_external_id: "CS", service_date: "2026-02-10", received_date: "2026-02-12", total_billed_cents: 10000 }
              as: ClaimsExaminer
              captures: { clid: $.data.id }
          trigger:
            - call: "POST /cob/claims/${clid}/pay"
              payload: {}
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: recovery_escalate_before_due_date_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.RecoveryRequest.ISSUED_to_ESCALATED", "errors[ERR_NOT_PAST_DUE]"]
        distinguishing_aspect: "Escalating a recovery request before due_date returns ERR_NOT_PAST_DUE."
        test_recipe:
          setup: ["Recovery request issued; current clock < due_date"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cob/providers"
              payload: { npi: "1313131313", legal_name: "P", tin: "T" }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /cob/members"
              payload: { member_external_id: "ED", full_name: "E", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "OWN", plan_name: "Own", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1980-01-01", effective_from: "2026-01-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { cown: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cown}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "G", plan_name: "G", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", policy_holder_gender: "MALE", effective_from: "2025-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cg: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cg}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
              payload: { as_of_service_date: "2026-02-01", expected_member_version: "${mv}" }
              as: COBAnalyst
              captures: { pdid: $.data.id }
            - call: "POST /cob/members/${mid}/primacy-determinations/${pdid}/finalize"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/claims"
              payload: { member_id: "${mid}", provider_id: "${pid}", claim_external_id: "CE", service_date: "2026-02-10", received_date: "2026-02-12", total_billed_cents: 50000 }
              as: ClaimsExaminer
              captures: { clid: $.data.id }
            - call: "POST /cob/claims/${clid}/lines"
              payload: { line_number: 1, procedure_code: "X", billed_cents: 50000, allowed_cents: 40000, primary_paid_cents: 0 }
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/pay"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/adjustments"
              payload: { cause: "NEW_COVERAGE_DISCOVERED", triggering_determination_id: "${pdid}" }
              as: ClaimsExaminer
              captures: { aid: $.data.id }
            - call: "POST /cob/claims/${clid}/adjustments/${aid}/apply"
              payload: {}
              as: ClaimsExaminer
              captures: { over_amt: $.data.overpayment_cents }
            - call: "POST /cob/claims/${clid}/reopen"
              payload: {}
              as: RecoverySpecialist
            - call: "POST /cob/claims/${clid}/readjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/repay"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/recovery-requests"
              payload: { provider_id: "${pid}", amount_cents: "${over_amt}" }
              as: RecoverySpecialist
              captures: { rid: $.data.id }
            - call: "POST /cob/claims/${clid}/recovery-requests/${rid}/issue"
              payload: {}
              as: RecoverySpecialist
          trigger:
            - call: "POST /cob/claims/${clid}/recovery-requests/${rid}/escalate"
              payload: {}
              as: RecoverySpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_PAST_DUE"
            - "http_status == 409"

  # ==========================================================================
  # Section: validations — required fields, RBAC, priority
  # ==========================================================================
  - section: validations
    instances:
      - name: missing_required_field_rejected
        claim_type: violation_to_error
        grounds: ["validations", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cob/members without member_external_id returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
          trigger:
            - call: "POST /cob/members"
              payload: { full_name: "NoExt", date_of_birth: "1980-01-01", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: member_self_cannot_verify_coverage
        claim_type: rbac_denial
        grounds: ["roles", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "MemberSelf cannot call /coverages/{id}/verify (only COBAnalyst may)."
        test_recipe:
          setup: ["Member + coverage"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "RB", full_name: "R", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "P", plan_name: "P", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", effective_from: "2026-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /cob/members/${mid}/coverages/${cid}/verify"
              payload: {}
              as: MemberSelf
              as_user_id: "${mid}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED"
            - "http_status == 403"

      - name: claim_examiner_cannot_close_claim
        claim_type: rbac_denial
        grounds: ["roles", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "ClaimsExaminer cannot call /close (RecoverySpecialist's exclusive op) — segregation of duties."
        test_recipe:
          setup: ["Claim in REPAID state"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/providers"
              payload: { npi: "1414141414", legal_name: "P", tin: "T" }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /cob/members"
              payload: { member_external_id: "SD", full_name: "S", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "OWN", plan_name: "Own", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1980-01-01", effective_from: "2026-01-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { cown: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cown}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "G", plan_name: "G", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", policy_holder_gender: "MALE", effective_from: "2025-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cg: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cg}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
              payload: { as_of_service_date: "2026-02-01", expected_member_version: "${mv}" }
              as: COBAnalyst
              captures: { pdid: $.data.id }
            - call: "POST /cob/members/${mid}/primacy-determinations/${pdid}/finalize"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/claims"
              payload: { member_id: "${mid}", provider_id: "${pid}", claim_external_id: "CSD", service_date: "2026-02-10", received_date: "2026-02-12", total_billed_cents: 50000 }
              as: ClaimsExaminer
              captures: { clid: $.data.id }
            - call: "POST /cob/claims/${clid}/lines"
              payload: { line_number: 1, procedure_code: "X", billed_cents: 50000, allowed_cents: 40000, primary_paid_cents: 0 }
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/pay"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/adjustments"
              payload: { cause: "NEW_COVERAGE_DISCOVERED", triggering_determination_id: "${pdid}" }
              as: ClaimsExaminer
              captures: { aid: $.data.id }
            - call: "POST /cob/claims/${clid}/adjustments/${aid}/apply"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/reopen"
              payload: {}
              as: RecoverySpecialist
            - call: "POST /cob/claims/${clid}/readjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/repay"
              payload: {}
              as: ClaimsExaminer
          trigger:
            - call: "POST /cob/claims/${clid}/close"
              payload: {}
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED"
            - "http_status == 403"

  # ==========================================================================
  # Section: calculations — known-input known-output
  # ==========================================================================
  - section: calculations
    instances:
      - name: msp_age_based_large_employer
        claim_type: correct_result
        grounds: [calculations.msp_determination]
        distinguishing_aspect: "Age 65+ AND active employer size >= threshold → MEDICARE_SECONDARY (rule 4)."
        test_recipe:
          setup: ["Member age 70, ACTIVE, employer_size=50"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "MA", full_name: "A", date_of_birth: "1955-01-01", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 50, medicare_entitlement_reason: "AGE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/msp-questionnaires"
              payload: { respondent_role: "SELF", has_employer_group_health: true, employer_size: 50, disability_flag: false, esrd_flag: false }
              as: COBAnalyst
              captures: { qid: $.data.id }
          trigger:
            - call: "POST /cob/members/${mid}/msp-questionnaires/${qid}/adjudicate"
              payload: {}
              as: COBAnalyst
              captures: { r: $.data.msp_result }
          assert:
            - "MSPQuestionnaire.${qid}.msp_result == MEDICARE_SECONDARY"

      - name: msp_no_group_health
        claim_type: correct_result
        grounds: [calculations.msp_determination]
        distinguishing_aspect: "No employer group health → MEDICARE_PRIMARY (rule 1 fires immediately)."
        test_recipe:
          setup: ["Member 70, retired"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "MR1", full_name: "R", date_of_birth: "1955-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "RETIRED", employer_size: 0, medicare_entitlement_reason: "AGE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/msp-questionnaires"
              payload: { respondent_role: "SELF", has_employer_group_health: false, employer_size: 0, disability_flag: false, esrd_flag: false }
              as: COBAnalyst
              captures: { qid: $.data.id }
          trigger:
            - call: "POST /cob/members/${mid}/msp-questionnaires/${qid}/adjudicate"
              payload: {}
              as: COBAnalyst
              captures: { r: $.data.msp_result }
          assert:
            - "MSPQuestionnaire.${qid}.msp_result == MEDICARE_PRIMARY"

  # ==========================================================================
  # Section: errors — verify triggerability
  # ==========================================================================
  - section: errors
    instances:
      - name: error_survey_expired
        claim_type: violation_to_error
        grounds: ["errors[ERR_SURVEY_EXPIRED]"]
        distinguishing_aspect: "Responding to a survey past due_at returns ERR_SURVEY_EXPIRED."
        test_recipe:
          setup: ["Survey sent at clock=T0; clock advanced past T0+30 days"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "SE", full_name: "S", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/member-surveys"
              payload: {}
              as: COBAnalyst
              captures: { sid: $.data.id }
            - call: "POST /cob/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cob/members/${mid}/member-surveys/${sid}/respond"
              payload: { response_payload: "yes" }
              as: MemberSelf
              as_user_id: "${mid}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SURVEY_EXPIRED"
            - "http_status == 409"

      - name: error_member_disenrolled_blocks_writes
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEMBER_DISENROLLED]"]
        distinguishing_aspect: "Posting a coverage for a disenrolled member returns ERR_MEMBER_DISENROLLED."
        test_recipe:
          setup: ["Member disenrolled"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "DM", full_name: "D", date_of_birth: "1980-01-01", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "TERMINATED" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/disenroll"
              payload: {}
              as: EligibilityAnalyst
          trigger:
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "P", plan_name: "P", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", effective_from: "2026-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_DISENROLLED"
            - "http_status == 409"

  # ==========================================================================
  # Section: endpoints — action endpoints, computed reads
  # ==========================================================================
  - section: endpoints
    instances:
      - name: savings_period_close_snapshots_totals
        claim_type: computed_read
        grounds: [calculations.savings_period_aggregation, endpoints.COBSavingsPeriod]
        distinguishing_aspect: "Closing a savings period snapshots totals (avoided, recovered, adjusted count) at close time."
        test_recipe:
          setup: ["Period opened covering 2026-01-01 to 2026-01-31; clock advanced past end"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cob/savings-periods"
              payload: { period_start_date: "2026-01-01", period_end_date: "2026-01-31" }
              as: COBAuditor
              captures: { spid: $.data.id }
            - call: "POST /cob/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cob/savings-periods/${spid}/close"
              payload: {}
              as: COBAuditor
              captures: { sp_posture: $.data.posture }
          assert:
            - "COBSavingsPeriod.${spid}.posture == CLOSED"
            - "COBSavingsPeriod.${spid}.total_claims_adjusted == 0"

      - name: clock_default_is_2026_05_01
        claim_type: cross_cutting_layer
        grounds: [endpoints.Clock, complexity_profile.complexity_layers]
        distinguishing_aspect: "Server default clock (before any set_current_utc call) is 2026-05-01T00:00:00Z."
        test_recipe:
          setup: ["Fresh server startup; no set_current_utc call"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "CD", full_name: "D", date_of_birth: "1980-01-01", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /cob/members/${mid}/member-surveys"
              payload: {}
              as: COBAnalyst
              captures: { sent: $.data.sent_at, due: $.data.due_at }
          assert:
            - "MemberSurvey sent_at == 2026-05-01T00:00:00Z  # default clock"
            - "MemberSurvey due_at == 2026-05-31T00:00:00Z  # sent_at + 30 days"

  # ==========================================================================
  # Section: cross-cutting — OCC, derived fields
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_config_create
        claim_type: cross_cutting_layer
        grounds: ["concurrency_rules[cob-config-create-supersede-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a new config with stale expected_active_config_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Active config v1; bump it by creating v2; now try creating another with v1's old version"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
              captures: { cfg1_v: $.data.version }
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v2", dependent_primacy_rule: "GENDER_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30, expected_active_config_version: "${cfg1_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v3", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 25, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30, expected_active_config_version: "${cfg1_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION"
            - "http_status == 412"

      - name: member_other_coverage_count_reconciled
        claim_type: derived_field_reconciliation
        grounds: [entities.Member.fields.other_coverage_count, complexity_profile.complexity_layers]
        distinguishing_aspect: "Member.other_coverage_count stays consistent: 0 on create, +1 on coverage verify, unchanged on coverage reject, recomputed on multiple verifies."
        test_recipe:
          setup: ["Member with one coverage verified, then a second verified"]
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "DR", full_name: "D", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "A", plan_name: "A", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", effective_from: "2026-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { ca: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${ca}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "B", plan_name: "B", coverage_kind: "MEDICAID", subscriber_relationship: "SELF", policy_holder_dob: "1980-01-01", effective_from: "2026-01-01", verification_source: "MEMBER_SURVEY" }
              as: COBAnalyst
              captures: { cb: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cb}/verify"
              payload: {}
              as: COBAnalyst
          trigger:
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { cnt: $.data.other_coverage_count }
          assert:
            - "Member.${mid}.other_coverage_count == 2"
