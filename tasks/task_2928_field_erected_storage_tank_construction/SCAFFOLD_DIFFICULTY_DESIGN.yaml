      - name: withdrawal_rate_temporal_outranks_permit_volume_fiscal
        grounds:
          - validations.priority_50
          - validations.priority_51
          - calculations.withdrawal_rate_envelope
          - calculations.water_volume_ledger
        distinguishing_aspect: |
          A different category pair on a different endpoint: business_temporal (priority 50)
          against business_fiscal (priority 51) on POST /water-withdrawals. The new
          reservation simultaneously overdraws the permit (only 100000 gal remain, 200000
          requested) and pushes the instantaneous rate to 1000 gpm against a 900 gpm limit;
          the temporal capacity error is the one that must surface.
        test_recipe:
          setup:
            - "A small permit: 500000 gal permitted, 900 gpm concurrent limit, expiring 2027-06-30."
            - "One RESERVED withdrawal of 400000 gal at 600 gpm covering 2026-08-11T00:00Z to 2026-08-11T12:00Z, leaving 100000 gal and 300 gpm of headroom."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /water-sources"
              payload: { source_name: "Municipal Tap", source_type: "MUNICIPAL", permitted_volume_gal: 500000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id }
            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
              captures: { tank_v: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 500000, disposal_method: "DISCHARGE_TO_POTW", hold_hours: 24, expected_tank_version: "${tank_v}" }
              as: ProjectEngineer
              captures: { plan_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v1: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T00:00:00Z", window_end_utc: "2026-08-11T12:00:00Z", rate_gpm: 600, reserved_volume_gal: 400000, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
              captures: { wd1_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v2: $.data.version }
          trigger:
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T06:00:00Z", window_end_utc: "2026-08-11T18:00:00Z", rate_gpm: 400, reserved_volume_gal: 200000, expected_water_source_version: "${ws_v2}" }
              as: ErectionSuperintendent
          assert:
            - "the response is 409 ERR_WITHDRAWAL_CAPACITY_CONFLICT, not 409 ERR_PERMITTED_VOLUME_EXCEEDED"
            - "WaterSource.${ws_id}.available_volume_gal is still 100000.00 (the requested 200000 really does overdraw it)"
            - "WaterSource.${ws_id}.reserved_volume_gal is still 400000.00 and version is unchanged"
            - "no second WaterWithdrawal row exists for HydrotestPlan.${plan_id}"

