# =============================================================================
# §1.9 Scaffold Corner Design — task_2830_portable_restroom_restroom_trailer_rental
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Sections and claim_type values are
# taken from references/claim-extraction-guide.md; no category is invented here.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub and deliberately no test_recipe.
#
# Shared conventions (identical to the difficulty design):
#   * the logical clock is repositioned as the FIRST setup call of every recipe;
#     2026-08-03 is a Monday, 2026-08-10 and 2026-08-17 are the following Mondays,
#     2026-08-11 is a Tuesday.
#   * "make the site placeable" prefix = POST /placement-permits (PLACEMENT) ->
#     /submit -> /approve, which walks ServiceSite.site_posture RESTRICTED -> OPEN.
#   * "00000000-0000-0000-0000-000000000000" is the canonical never-minted id.
#   * as_user_id is written explicitly only where the audit identity is load-bearing
#     (ChargeEvent.assessed_by_user_id / resolved_by_user_id, CustomerContact scope).
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_rental_account_returns_201_with_zeroed_credit_ledger
        claim_type: creation
        grounds:
          - entities.RentalAccount
          - endpoints["POST /rental-accounts"]
          - entities.RentalAccount.fields.open_credit_balance_cents
          - entities.RentalAccount.fields.billing_hold
        distinguishing_aspect: "A POST carrying every declared input returns 201 with those inputs echoed and both computed ledger fields at their zero state; no §1.8 instance asserts the bare creation contract of RentalAccount."
        test_recipe:
          setup:
            - "Empty database. Only the logical clock is positioned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
              captures: { clock_now: $.data.current_utc }
          trigger:
            - call: "POST /rental-accounts"
              payload: { legal_name: "Alder Creek Rentals", account_type: "EVENT", credit_terms_days: 45, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_name: $.data.legal_name, acct_type: $.data.account_type, acct_terms: $.data.credit_terms_days, acct_status: $.data.status, acct_balance: $.data.open_credit_balance_cents, acct_hold: $.data.billing_hold, acct_version: $.data.version }
          assert:
            - "${clock_now} == 2026-08-03T08:00:00.000Z"
            - "HTTP status is 201"
            - "${acct_name} == Alder Creek Rentals, ${acct_type} == EVENT, ${acct_terms} == 45, ${acct_status} == ACTIVE"
            - "${acct_balance} == 0 and ${acct_hold} == false"
            - "${acct_version} == 1 and ${acct_id} is a server-minted uuid the request never supplied"

      - name: get_service_site_returns_stored_fields_with_derived_posture_restricted
        claim_type: retrieval
        grounds:
          - endpoints["GET /service-sites/{id}"]
          - entities.ServiceSite.fields.permit_status
          - entities.ServiceSite.fields.site_posture
          - entities.ServiceSite.fields.deployed_unit_count
        distinguishing_aspect: "A read-back of a freshly created site returns byte-identical inputs plus the three computed fields at their empty-permit values (NONE / RESTRICTED / 0)."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T08:00:00Z, one account, one site with every optional input supplied explicitly and no permits filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Alder Creek Rentals", account_type: "EVENT", credit_terms_days: 45 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Alder Creek Fairway", jurisdiction_code: "OR-LA-CITY", access_class: "STAIR_ACCESS", right_of_way_required: true, gate_open_minute: 420, gate_close_minute: 1140, max_truck_length_ft: 30 }
              as: SalesRep
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: PermitCoordinator
              captures: { r_account: $.data.account_id, r_label: $.data.site_label, r_juris: $.data.jurisdiction_code, r_access: $.data.access_class, r_row: $.data.right_of_way_required, r_open: $.data.gate_open_minute, r_close: $.data.gate_close_minute, r_maxlen: $.data.max_truck_length_ft, r_permit: $.data.permit_status, r_posture: $.data.site_posture, r_deployed: $.data.deployed_unit_count }
          assert:
            - "${r_account} == ${acct_id}, ${r_label} == Alder Creek Fairway, ${r_juris} == OR-LA-CITY"
            - "${r_access} == STAIR_ACCESS, ${r_row} == true, ${r_open} == 420, ${r_close} == 1140, ${r_maxlen} == 30"
            - "${r_permit} == NONE and ${r_posture} == RESTRICTED — no filing exists for either required kind"
            - "${r_deployed} == 0"

      - name: list_site_permits_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /service-sites/{id}/permits"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three permits on one site, fetched with limit 2 offset 0 and then limit 2 offset 2, must report total_count 3 with has_more true then false; §1.8 never exercises pagination."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T08:00:00Z, one account, one site, three permit filings on that site (two PLACEMENT and one RIGHT_OF_WAY), all left in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Willow Bend Municipal", account_type: "MUNICIPAL", credit_terms_days: 45 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Willow Bend Park", jurisdiction_code: "OH-FR-CITY", access_class: "OPEN_LOT", right_of_way_required: true, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-9001", effective_from: "2026-08-01", effective_to: "2026-10-31" }
              as: PermitCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "RIGHT_OF_WAY", authority_ref: "RW-9001", effective_from: "2026-08-01", effective_to: "2026-10-31" }
              as: PermitCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-9002", effective_from: "2026-09-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { p3_id: $.data.id }
          trigger:
            - call: "GET /service-sites/${site_id}/permits"
              payload: { limit: 2, offset: 0 }
              as: PermitCoordinator
              captures: { page1: $.data }
            - call: "GET /service-sites/${site_id}/permits"
              payload: { limit: 2, offset: 2 }
              as: PermitCoordinator
              captures: { page2: $.data }
            - call: "GET /service-sites/${site_id}/permits"
              payload: { permit_kind: "RIGHT_OF_WAY" }
              as: PermitCoordinator
              captures: { row_only: $.data }
          assert:
            - "${page1} has length 2 and the envelope reports limit 2, offset 0, total_count 3, has_more true"
            - "${page2} has length 1 and the envelope reports limit 2, offset 2, total_count 3, has_more false"
            - "the union of ${page1} and ${page2} is exactly {${p1_id}, ${p2_id}, ${p3_id}} with no duplicates"
            - "${row_only} has length 1 and its single element id == ${p2_id}, with total_count 1 — the filter is applied before pagination"
            - "response_type == array on all three responses"

      - name: get_rental_contract_with_unknown_id_returns_contract_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - endpoints["GET /rental-contracts/{id}"]
        distinguishing_aspect: "A well-formed but never-minted uuid on the contract read path yields ERR_CONTRACT_NOT_FOUND with HTTP 404 and the error envelope shape, not a 500 or an empty 200."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T08:00:00Z and an otherwise empty database — nothing must exist for this probe."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /rental-contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesRep
              captures: { nf_error: $.data.error_id, nf_message: $.data.message }
          assert:
            - "${nf_error} == ERR_CONTRACT_NOT_FOUND with HTTP 404"
            - "response_type == error and the payload carries exactly error_id and message"
            - "${nf_message} is a non-empty human-readable string"

      - name: create_asset_unit_missing_required_unit_class_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /asset-units"]
          - entities.AssetUnit.fields.unit_class
        distinguishing_aspect: "unit_class has source input and no default, so omitting it must produce ERR_INVALID_REQUEST with HTTP 400 and persist no AssetUnit row."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T08:00:00Z, empty yard."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /asset-units"
              payload: { asset_tag: "SP-000", yard_code: "YD-1", tare_length_ft: 8 }
              as: PlatformAdmin
              captures: { missing_error: $.data.error_id }
          assert:
            - "${missing_error} == ERR_INVALID_REQUEST with HTTP 400"
            - "no AssetUnit with asset_tag SP-000 exists afterwards"

      - name: create_service_site_omitting_optional_inputs_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ServiceSite.fields.right_of_way_required
          - entities.ServiceSite.fields.gate_open_minute
          - entities.ServiceSite.fields.gate_close_minute
          - entities.ServiceSite.fields.max_truck_length_ft
          - endpoints["POST /service-sites"]
        distinguishing_aspect: "Sending only the four required inputs must yield right_of_way_required false, gate window 0..1440 and max_truck_length_ft 24 — the exact defaults declared in §1.1, not nulls."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T08:00:00Z and one account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Cobblestone Events", account_type: "EVENT" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, terms_default: $.data.credit_terms_days, status_default: $.data.status }
          trigger:
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Cobblestone Square", jurisdiction_code: "NY-NY-CITY", access_class: "CRANE_ONLY" }
              as: SalesRep
              captures: { d_row: $.data.right_of_way_required, d_open: $.data.gate_open_minute, d_close: $.data.gate_close_minute, d_maxlen: $.data.max_truck_length_ft, d_permit: $.data.permit_status, d_posture: $.data.site_posture, d_deployed: $.data.deployed_unit_count }
          assert:
            - "${terms_default} == 30 and ${status_default} == ACTIVE — RentalAccount defaults also apply"
            - "${d_row} == false, ${d_open} == 0, ${d_close} == 1440, ${d_maxlen} == 24"
            - "${d_permit} == NONE and ${d_posture} == RESTRICTED and ${d_deployed} == 0"
            - "no field comes back null: every omitted optional resolved to its declared default"

      - name: service_site_deployed_unit_count_is_derived_from_deployment_state
        claim_type: computed_fields
        grounds:
          - entities.ServiceSite.fields.deployed_unit_count
          - state_machines.UnitDeployment.RESERVED_to_DEPLOYED
          - endpoints["POST /rental-contracts/{id}/activate"]
        distinguishing_aspect: "deployed_unit_count counts only UnitDeployment rows in state DEPLOYED, so it stays 0 while the deployment is RESERVED and becomes 1 the moment activation promotes it — it is never taken from a request field."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account, site made placeable (posture OPEN), one STANDARD_PORTABLE asset (tare 8 ft)."
            - "CONSTRUCTION contract 40 / freq 3 / no ada quoted to 5 STANDARD + 2 HANDWASH, one RESERVED deployment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Stonegate Builders", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Stonegate Pad 1", jurisdiction_code: "NC-WA-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-9101", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-9101" }
              as: ComplianceOfficer
            - call: "POST /asset-units"
              payload: { asset_tag: "SP-311", unit_class: "STANDARD_PORTABLE", yard_code: "YD-3", tare_length_ft: 8 }
              as: PlatformAdmin
              captures: { asset_id: $.data.id, asset_status_initial: $.data.status }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 40, event_duration_hours: 8, service_frequency_per_week: 3, season_code: "OFF", construction_phase: "SITEWORK", ada_required: false }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
              captures: { quoted: $.data.quoted_cents }
            - call: "POST /unit-deployments"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-08-03", deploy_to: "2026-09-30" }
              as: DispatchPlanner
              captures: { dep_id: $.data.id, dep_state_initial: $.data.state, dep_site: $.data.site_id, dep_reloc: $.data.relocation_count }
          trigger:
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: DispatchPlanner
              captures: { count_before: $.data.deployed_unit_count }
            - call: "POST /rental-contracts/${contract_id}/activate"
              payload: {}
              as: SalesRep
              captures: { fs_after: $.data.fulfillment_state }
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: DispatchPlanner
              captures: { count_after: $.data.deployed_unit_count }
            - call: "GET /asset-units/${asset_id}"
              payload: {}
              as: DispatchPlanner
              captures: { asset_status_after: $.data.status }
          assert:
            - "${quoted} == 91500 and ${dep_state_initial} == RESERVED, ${dep_site} == ${site_id}, ${dep_reloc} == 0"
            - "${asset_status_initial} == IN_YARD"
            - "${count_before} == 0 — a RESERVED deployment does not count"
            - "${fs_after} == ACTIVE and ${count_after} == 1"
            - "${asset_status_after} == DEPLOYED and UnitDeployment.${dep_id}.state == DEPLOYED"

      - name: rental_account_id_created_at_and_version_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.RentalAccount
          - complexity_profile.consistency_model
          - endpoints["POST /rental-accounts"]
          - endpoints["GET /rental-accounts/{id}"]
        distinguishing_aspect: "id, created_at, updated_at and version are absent from the endpoint's input: list, so they must be minted by the server and be identical on an immediate read-back."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T08:00:00Z, empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rental-accounts"
              payload: { legal_name: "Redstone Municipal Works", account_type: "MUNICIPAL", credit_terms_days: 0 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, created: $.data.created_at, updated: $.data.updated_at, ver: $.data.version }
            - call: "GET /rental-accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acct_id_read: $.data.id, created_read: $.data.created_at, updated_read: $.data.updated_at, ver_read: $.data.version }
          assert:
            - "${acct_id} is a uuid and ${ver} == 1"
            - "${created} == 2026-08-03T08:00:00.000Z and ${updated} == 2026-08-03T08:00:00.000Z — timestamps come from the logical clock, never from wall-clock time"
            - "${acct_id_read} == ${acct_id}, ${created_read} == ${created}, ${updated_read} == ${updated}, ${ver_read} == ${ver}"
            - "credit_terms_days == 0 was accepted as a declared enum member of {0, 15, 30, 45} and did not fall back to the default 30"

      - name: create_rental_contract_with_invalid_enum_season_code_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.RentalContract.fields.season_code
          - entities.RentalContract.fields.headcount
          - entities.RentalContract.fields.construction_phase
        distinguishing_aspect: "Three separate shape violations on the same endpoint — a non-member enum, an out-of-range integer and the EVENT-requires-EVENT_NA conditional rule — must each return ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T08:00:00Z, one account and one site."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Bramble Hollow Fairs", account_type: "EVENT", credit_terms_days: 15 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Bramble Hollow Field", jurisdiction_code: "VA-FA-CITY", access_class: "OPEN_LOT" }
              as: SalesRep
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "EVENT", term_start: "2026-08-14", term_end: "2026-08-16", headcount: 250, event_duration_hours: 10, service_frequency_per_week: 3, season_code: "WINTER", construction_phase: "EVENT_NA", ada_required: true }
              as: SalesRep
              captures: { enum_error: $.data.error_id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "EVENT", term_start: "2026-08-14", term_end: "2026-08-16", headcount: 20001, event_duration_hours: 10, service_frequency_per_week: 3, season_code: "PEAK", construction_phase: "EVENT_NA", ada_required: true }
              as: SalesRep
              captures: { range_error: $.data.error_id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "EVENT", term_start: "2026-08-14", term_end: "2026-08-16", headcount: 250, event_duration_hours: 10, service_frequency_per_week: 3, season_code: "PEAK", construction_phase: "VERTICAL", ada_required: true }
              as: SalesRep
              captures: { conditional_error: $.data.error_id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "EVENT", term_start: "2026-08-16", term_end: "2026-08-14", headcount: 250, event_duration_hours: 10, service_frequency_per_week: 3, season_code: "PEAK", construction_phase: "EVENT_NA", ada_required: true }
              as: SalesRep
              captures: { ordering_error: $.data.error_id }
          assert:
            - "${enum_error} == ERR_INVALID_REQUEST with HTTP 400 — WINTER is not in {PEAK, SHOULDER, OFF}"
            - "${range_error} == ERR_INVALID_REQUEST — headcount 20001 exceeds the declared 1..20000 range"
            - "${conditional_error} == ERR_INVALID_REQUEST — an EVENT contract must pass construction_phase EVENT_NA"
            - "${ordering_error} == ERR_INVALID_REQUEST — term_end 2026-08-14 is before term_start 2026-08-16"
            - "GET /rental-contracts?account_id=${acct_id} returns total_count 0: none of the four refused requests persisted a row"

      - name: quote_line_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.QuoteLine
          - endpoints["GET /rental-contracts/{id}/quote-lines"]
          - entities.QuoteLine.fields.is_superseded
        distinguishing_aspect: "QuoteLine is declared common_fields: false, so its rows carry no version and §1.5 exposes no update or delete endpoint for them — correction happens by superseding, never by mutation."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account, site, CONSTRUCTION contract 60 / freq 2 / ada true, quoted once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Kestrel Constructors", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Kestrel Yard", jurisdiction_code: "ID-AD-CITY", access_class: "OPEN_LOT" }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 60, event_duration_hours: 8, service_frequency_per_week: 2, season_code: "SHOULDER", construction_phase: "VERTICAL", ada_required: true }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
              captures: { quoted: $.data.quoted_cents }
          trigger:
            - call: "GET /rental-contracts/${contract_id}/quote-lines"
              payload: { is_superseded: false }
              as: SalesRep
              captures: { lines: $.data }
          assert:
            - "${quoted} == 181500 and ${lines} has length 3"
            - "the three lines are (STANDARD_PORTABLE, 9, 14500, 130500), (ADA_PORTABLE, 1, 22500, 22500), (HANDWASH_STATION, 3, 9500, 28500) in that declared class order"
            - "every element of ${lines} has escalated_cents == 0 and is_superseded == false"
            - "no element of ${lines} carries a version field — QuoteLine is common_fields: false"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint for QuoteLine: the only way to change a line set is the supersede self-loop on POST /rental-contracts/{id}/quote"

      - name: create_service_site_with_unknown_account_id_returns_account_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_ACCOUNT_NOT_FOUND]
          - entities.ServiceSite.fields.account_id
        distinguishing_aspect: "The body foreign key account_id is resolved before any business rule runs, so a never-minted uuid yields ERR_ACCOUNT_NOT_FOUND with HTTP 404 rather than a dangling site row."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T08:00:00Z, no accounts at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-sites"
              payload: { account_id: "00000000-0000-0000-0000-000000000000", site_label: "Orphan Lot", jurisdiction_code: "TX-DA-CITY", access_class: "OPEN_LOT" }
              as: SalesRep
              captures: { fk_error: $.data.error_id }
          assert:
            - "${fk_error} == ERR_ACCOUNT_NOT_FOUND with HTTP 404"
            - "no ServiceSite with site_label Orphan Lot exists afterwards"

      - name: service_visit_rerun_of_visit_id_reverse_lookup_returns_the_linked_rerun
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - entities.ServiceVisit.fields.rerun_of_visit_id
          - state_machines.ServiceVisit.MISSED_to_RERUN_SCHEDULED
          - endpoints["GET /service-visits"]
          - endpoints["POST /service-visits/{id}/schedule-rerun"]
        distinguishing_aspect: "The self-referential FK ServiceVisit.rerun_of_visit_id is written only by the system on schedule-rerun and must be reverse-reachable through GET /service-visits?rerun_of_visit_id=..., which returns exactly the one RERUN child."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account, placeable site, MON route capacity 20, CONSTRUCTION contract 60 / freq 2 / ada true quoted (13 units), ACTIVE schedule."
            - "One SERVICE visit on 2026-08-10 (480..540) marked MISSED, which minted a MISSED_SERVICE_CREDIT charge."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Larkspur Civil", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Larkspur Reach", jurisdiction_code: "KS-JO-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-9201", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-9201" }
              as: ComplianceOfficer
            - call: "POST /routes"
              payload: { route_code: "RT-MON-30", service_day: "MON", truck_capacity_units: 20, waste_capacity_gallons: 3000 }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 60, event_duration_hours: 8, service_frequency_per_week: 2, season_code: "SHOULDER", construction_phase: "VERTICAL", ada_required: true }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
            - call: "POST /service-schedules"
              payload: { contract_id: "${contract_id}", route_id: "${route_id}", service_day: "MON", window_start_minute: 480, window_end_minute: 600 }
              as: DispatchPlanner
              captures: { schedule_id: $.data.id }
            - call: "POST /service-visits"
              payload: { schedule_id: "${schedule_id}", visit_kind: "SERVICE", scheduled_date: "2026-08-10", window_start_minute: 480, window_end_minute: 540 }
              as: DispatchPlanner
              captures: { orig_visit_id: $.data.id, orig_rerun_fk: $.data.rerun_of_visit_id }
            - call: "POST /service-visits/${orig_visit_id}/mark-missed"
              payload: { missed_reason: "access road washed out" }
              as: DispatchPlanner
              captures: { orig_state_missed: $.data.state }
          trigger:
            - call: "POST /service-visits/${orig_visit_id}/schedule-rerun"
              payload: { rerun_date: "2026-08-17", window_start_minute: 480, window_end_minute: 540 }
              as: DispatchPlanner
              captures: { rerun_id: $.data.id, rerun_kind: $.data.visit_kind, rerun_state: $.data.state, rerun_fk: $.data.rerun_of_visit_id, rerun_route: $.data.route_id, rerun_schedule: $.data.schedule_id }
            - call: "GET /service-visits?rerun_of_visit_id=${orig_visit_id}"
              payload: {}
              as: DispatchPlanner
              captures: { children: $.data }
            - call: "GET /service-visits/${orig_visit_id}"
              payload: {}
              as: DispatchPlanner
              captures: { orig_state_after: $.data.state }
            - call: "GET /rental-contracts/${contract_id}"
              payload: {}
              as: SalesRep
              captures: { credit_after_rerun: $.data.credit_accrued_cents }
          assert:
            - "${orig_rerun_fk} == null on the first-run visit and ${orig_state_missed} == MISSED"
            - "HTTP status is 201; ${rerun_kind} == RERUN, ${rerun_state} == PLANNED, ${rerun_fk} == ${orig_visit_id}"
            - "${rerun_route} == ${route_id} and ${rerun_schedule} == ${schedule_id} — both denormalized from the original"
            - "${children} has length 1 and its single element id == ${rerun_id}, with total_count 1"
            - "${orig_state_after} == RERUN_SCHEDULED"
            - "${credit_after_rerun} == 62413 — booking the re-run does NOT reverse the missed-service credit"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: permit_submit_advances_draft_to_submitted_and_stamps_the_filer
        claim_type: valid_transition
        grounds:
          - state_machines.PlacementPermit.DRAFT_to_SUBMITTED
          - endpoints["POST /placement-permits/{id}/submit"]
        excluded_because:
          difficulty_instance: permit_reject_resubmit_cycle_increments_revision_round_to_limit
          rationale: "That §1.8 instance walks DRAFT -> SUBMITTED as the first hop of its cycle and already asserts status SUBMITTED, revision_round 0 -> 1, submitted_by_user_id == X-User-ID and the site rolling to PENDING/RESTRICTED. A second happy-path submit test would assert nothing new."

      - name: approving_a_permit_still_in_draft_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PlacementPermit.SUBMITTED_to_APPROVED
          - validations[priority=20]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "The approve trigger is declared only from SUBMITTED, so calling it on a DRAFT row must return ERR_INVALID_STATE_TRANSITION (409) and leave the site's posture untouched — the from-state guard, not the role guard, is what fires."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account, site, one PLACEMENT permit left in DRAFT (never submitted)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Sable Ridge Events", account_type: "EVENT", credit_terms_days: 15 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Sable Ridge Lawn", jurisdiction_code: "CO-DE-CITY", access_class: "OPEN_LOT" }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-9301", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id, permit_status_initial: $.data.status }
          trigger:
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-9301" }
              as: ComplianceOfficer
              captures: { bad_transition: $.data.error_id }
            - call: "GET /placement-permits/${permit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { status_after: $.data.status, round_after: $.data.revision_round }
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture_after: $.data.site_posture, permit_status_after: $.data.permit_status }
          assert:
            - "${permit_status_initial} == DRAFT"
            - "${bad_transition} == ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "${status_after} == DRAFT and ${round_after} == 0 — the refused call wrote nothing"
            - "${posture_after} == RESTRICTED and ${permit_status_after} == PENDING (a DRAFT filing maps to PENDING in the roll-up)"

      - name: newly_created_placement_permit_starts_in_draft_with_revision_round_zero
        claim_type: initial_state
        grounds:
          - state_machines.PlacementPermit.initial_state
          - entities.PlacementPermit.fields.revision_round
          - entities.PlacementPermit.fields.rejection_reason
          - entities.PlacementPermit.fields.submitted_by_user_id
        distinguishing_aspect: "Creation must land the row exactly on the declared initial_state DRAFT with revision_round 0 and both audit fields null; the client cannot pick a starting status because status is not in the endpoint's input."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account and site, no permits yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Foxglove Municipal", account_type: "MUNICIPAL", credit_terms_days: 45 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Foxglove Commons", jurisdiction_code: "MN-HE-CITY", access_class: "GATED", gate_open_minute: 480, gate_close_minute: 1020 }
              as: SalesRep
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-9401", effective_from: "2026-08-01", effective_to: "2026-11-30" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id, st: $.data.status, rr: $.data.revision_round, rej: $.data.rejection_reason, sub_by: $.data.submitted_by_user_id }
          assert:
            - "HTTP status is 201 and ${st} == DRAFT"
            - "${rr} == 0, ${rej} == null, ${sub_by} == null"
            - "GET /service-sites/${site_id} now reports permit_status PENDING and site_posture RESTRICTED"

      - name: resubmitting_an_expired_permit_is_refused_by_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PlacementPermit.terminal_states
          - state_machines.PlacementPermit.APPROVED_to_EXPIRED
          - endpoints["POST /_clock/set_current_utc"]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "EXPIRED is the PlacementPermit terminal state and is reached only by the clock sweep, so once the sweep fires no trigger — not even the REJECTED -> SUBMITTED refile path — may leave it, and the site is left BLOCKED."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account, site, one PLACEMENT permit with effective_to 2026-08-05, submitted and approved so the site is OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Juniper Fairgrounds", account_type: "EVENT", credit_terms_days: 15 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Juniper Infield", jurisdiction_code: "AZ-MA-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1200, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-9501", effective_from: "2026-08-01", effective_to: "2026-08-05" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-9501" }
              as: ComplianceOfficer
              captures: { st_approved: $.data.status }
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: PermitCoordinator
              captures: { posture_open: $.data.site_posture }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { now2: $.data.current_utc, expired_n: $.data.expired_permit_count, blocked_n: $.data.blocked_site_count, suspended_n: $.data.suspended_schedule_count }
            - call: "GET /placement-permits/${permit_id}"
              payload: {}
              as: PermitCoordinator
              captures: { st_expired: $.data.status }
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: PermitCoordinator
              captures: { posture_blocked: $.data.site_posture, permit_status_expired: $.data.permit_status }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: { submission_note: "please renew" }
              as: PermitCoordinator
              captures: { locked_error: $.data.error_id }
          assert:
            - "${st_approved} == APPROVED and ${posture_open} == OPEN before the clock moves"
            - "${now2} == 2026-08-06T00:00:00.000Z, ${expired_n} == 1, ${blocked_n} == 1, ${suspended_n} == 0"
            - "${st_expired} == EXPIRED — the sweep fired because 2026-08-06 > effective_to 2026-08-05"
            - "${permit_status_expired} == EXPIRED and ${posture_blocked} == BLOCKED"
            - "${locked_error} == ERR_INVALID_STATE_TRANSITION with HTTP 409 and the permit stays EXPIRED with its revision_round unchanged at 1"

      - name: approving_an_already_approved_permit_a_second_time_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.PlacementPermit.SUBMITTED_to_APPROVED
          - validations[priority=20]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "The approve action is not idempotent: replaying it on an APPROVED row must return ERR_INVALID_STATE_TRANSITION (409) rather than a second 200, and must leave revision_round, version and the derived site posture untouched."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account, site, one PLACEMENT permit submitted and approved once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
