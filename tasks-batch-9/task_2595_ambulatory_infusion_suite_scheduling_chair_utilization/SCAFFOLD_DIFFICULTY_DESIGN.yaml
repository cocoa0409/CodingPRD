              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Iron Sucrose", is_biosimilar: false, base_administration_minutes: 60, min_administration_minutes: 45, premedication_minutes: 0, observation_minutes_first_dose: 30, observation_minutes_subsequent: 15, acuity_points: 1, prep_stability_minutes: 120, unit_cost_cents: 12000, requires_lab_gate: false }
              as: Pharmacist
              captures: { dr3: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr3}", lot_number: "LOT-EARLY", units_received: 1, expires_on: "2026-11-01T00:00:00Z" }
              as: Pharmacist
              captures: { lt_early: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr3}", lot_number: "LOT-LATE", units_received: 3, expires_on: "2026-12-01T00:00:00Z" }
              as: Pharmacist
              captures: { lt_late: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr3}", dose_tier: "LOW" }
              as: Scheduler
              captures: { tp3: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr3}", dose_mg_per_kg: 5, total_cycles: 4, premed_waived: false }
