            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
          trigger:
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T08:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_INVALID_WINDOW (empty window)"

      - name: cn_val_first_qualify_score_65_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SUPPLIER_NOT_QUALIFIABLE]"
          - "constants.QUALIFY_MIN_AUDIT_SCORE"
        distinguishing_aspect: "First qualification with audit_score 65 (< 70) fails 422 — the same score that later fails requalification at the stricter 80 threshold (contrast with §1.8 nsm_supplier_requalification_cycle)."
        test_recipe:
          setup: ["Supplier SUP-K-39 created (PENDING_AUDIT)."]
          setup_api_calls:
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-K-39", isolate_type: "PEA", committed_volume_kg: 100, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 540, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "QUALIFICATION", target_status: "QUALIFIED", audit_score: 65 }
