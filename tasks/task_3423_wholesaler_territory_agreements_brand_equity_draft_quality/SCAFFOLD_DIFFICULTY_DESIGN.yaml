              as: BrewerAdmin
            - call: "POST /retail-accounts"
              payload: { name: "Cascade Bar 1", state_code: "TX", serving_wholesaler_id: "${wx_id}" }
              as: BrewerAdmin
              captures: { ax1_id: $.data.id }
            - call: "POST /retail-accounts"
              payload: { name: "Cascade Bar 2", state_code: "TX", serving_wholesaler_id: "${wx_id}" }
              as: BrewerAdmin
              captures: { ax2_id: $.data.id }
            - call: "POST /retail-accounts"
              payload: { name: "Cascade Bar 3", state_code: "TX", serving_wholesaler_id: "${wx_id}" }
              as: BrewerAdmin
              captures: { ax3_id: $.data.id }
            - call: "POST /allocation-events"
              payload: { brand_code: "BUD-LTD", total_qty_cases: 300 }
              as: BrewerAdmin
              captures: { evc_id: $.data.id }
            - call: "POST /allocation-events/${evc_id}/requests"
              payload: { requested_qty_cases: 200 }
              as: WholesalerPrincipal
              as_user_id: "${wx_id}"
            - call: "POST /allocation-events/${evc_id}/lock"
              payload: {}
              as: BrewerAdmin
          trigger:
            - call: "POST /draft-audits"
              payload: { account_id: "${ax1_id}", conducted_at: "2026-09-01T00:00:00Z", line_cleaning_last_at: "2026-08-25T00:00:00Z", kegs: [{ brand_code: "BUD-LTD", filled_at: "2026-05-03T00:00:00Z", volume_bbl: 15 }] }
              as: DraftAuditor
            - call: "POST /draft-audits"
              payload: { account_id: "${ax2_id}", conducted_at: "2026-09-01T00:00:00Z", line_cleaning_last_at: "2026-08-25T00:00:00Z", kegs: [{ brand_code: "BUD-LTD", filled_at: "2026-05-03T00:00:00Z", volume_bbl: 15 }] }
              as: DraftAuditor
            - call: "POST /draft-audits"
              payload: { account_id: "${ax3_id}", conducted_at: "2026-09-01T00:00:00Z", line_cleaning_last_at: "2026-08-25T00:00:00Z", kegs: [{ brand_code: "BUD-LTD", filled_at: "2026-05-03T00:00:00Z", volume_bbl: 15 }] }
              as: DraftAuditor
            - call: "GET /allocation-events/${evc_id}"
              payload: {}
              as: BrewerAdmin
            - call: "GET /wholesalers/${wx_id}"
              payload: {}
              as: BrewerCompliance
            - call: "GET /retail-accounts/${ax1_id}"
              payload: {}
              as: BrewerAdmin
            - call: "GET /retail-accounts/${ax2_id}"
              payload: {}
              as: BrewerAdmin
            - call: "GET /retail-accounts/${ax3_id}"
              payload: {}
              as: BrewerAdmin
          assert:
            - "Each of the three audits returns result == CRITICAL_FAIL and critical_keg_flag == true (121-day keg >= 120)"
            - "RetailAccount.${ax1_id}, .${ax2_id}, .${ax3_id} all reach SERVICE_SUSPENDED (link 1)"
