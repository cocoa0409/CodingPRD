            - { call: "POST /leasing/utilization-surveys/${survey}/finalize", as: GSAPropertyManager }
            - { call: "GET /leasing/occupancy-agreements/${oa}/space-reduction-actions", as: GSAAdmin, captures: { act: "$.data[0].id" } }
