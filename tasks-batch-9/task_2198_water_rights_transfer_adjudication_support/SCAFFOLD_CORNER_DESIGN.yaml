          assert:
            - "HTTP 200; filing_status DECREED; objection_count 1."
            - "base starts at min(100.00, 87.77) == 87.77 — the examiner recommendation floors the claim."
            - "Objection haircut: round(87.77 * 0.9, 3) == 78.993."
            - "Priority-mismatch haircut applies because |1901-05-01 - 1900-04-29| == 367 days > 366: round(78.993 * 0.9, 3) == 71.094."
            - "decreed_af 71.09 == round(71.094, 2). The values 81.00 (haircutting claimed_af), 87.77 (no haircuts), 78.99 (objection only) and 79.00 must NOT appear."
            - "priority_rank 1 (sole DECREED claim) and the docket bubbles up to DECREE_ENTERED with total_decreed_af 71.09."

      - name: calc_decreed_volume_priority_tolerance_boundary_366_versus_367_days
        claim_type: constants_applied
        grounds:
          - calculations.decreed_volume
          - calculations.decreed_volume.precision
        distinguishing_aspect: >-
          Two claims on two rights with the SAME recorded priority date differ by
          one calendar day in the claimed date and land on opposite sides of the
          strict 366-day tolerance: 366 days decrees the full 100.00 while 367
          days decrees 90.00. The one-day-earlier claim is also the senior one, so
          the haircut lands on rank 1.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; docket SNK-ADJ-02 with filing deadline 2026-04-01T00:00:00Z."
            - "Rights R1 and R2 both recorded at priority 1901-05-01T00:00:00Z with METER evidence and activated."
          setup_api_calls:
