        distinguishing_aspect: "Enrollment and ClinicalReview form a lasting cycle rather than a one-way pipeline: PENDING_CLINICAL_REVIEW to AWAITING_TRANSITION_REVIEW, then back to PENDING_CLINICAL_REVIEW on a denied handoff, and the review row itself cycles CONDUCTED back to SUBMITTED so the same row can be walked round more than once."
