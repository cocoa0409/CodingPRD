        grounds:
          - calculations.wait_time
          - entities.VehicleClass.fields.included_wait_minutes
          - entities.Reservation.fields.chargeable_wait_minutes
          - state_machines.Reservation.ON_LOCATION_to_PASSENGER_ABOARD
        distinguishing_aspect: "Numeric threshold boundary on wait minutes via POST /reservations/{id}/wait-events: arrived 12:05:00, boarded 12:20:00 => raw 15 == grace 15 => chargeable 0 (>= grace, not >); the first chargeable minute would be at 16."
        test_recipe:
          setup:
            - "SEDAN grace 15; reservation EN_ROUTE then arrived, dispatched chauffeur."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com", negotiated_discount_pct: 0, default_gratuity_pct: 0 }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200, included_wait_minutes: 15 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /chauffeurs"
              payload: { full_name: "Dana", home_market_code: "SFO" }
              as: DispatchAdmin
              captures: { drv: $.data.id }
            - call: "POST /vehicles"
              payload: { vehicle_class_id: "${sedan}", plate: "BLK-5" }
              as: DispatchAdmin
              captures: { veh: $.data.id }
