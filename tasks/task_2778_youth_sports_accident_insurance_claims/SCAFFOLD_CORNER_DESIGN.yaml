            - call: "POST /league-policies/${pol_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /league-policies/${pol_id}/run-off"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "before the triggers: LeaguePolicy.${pol_id}.status == CANCELLED with cancel_reason recorded and coverage_posture == FROZEN"
            - "all three trigger calls return HTTP 409 with data.error_id == ERR_INVALID_POLICY_STATE"
            - "after all three: LeaguePolicy.${pol_id}.status is still CANCELLED and its version did not advance across the three rejected calls"

      - name: enrollment_withdrawal_applies_every_declared_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - endpoints[POST /enrollments/{enrollment_id}/withdraw]
          - entities.Enrollment.fields.coverage_status
          - entities.Participant.fields.enrolled_policy_count
        distinguishing_aspect: "Withdrawal declares four side effects - status WITHDRAWN, withdrawn_on_date set from the logical clock, coverage_status WITHDRAWN_NO_COVERAGE, and the participant's roster counters recomputed. All four must land from one call; asserting each separately catches a server that flips the status but leaves the derived coverage_status or the participant counters stale."
        test_recipe:
          setup: ["One league, one BASEBALL_U12 classification and one ACTIVE policy; one participant ENROLLED with no claim of any kind, so the open-claims guard at priority 40 does not fire."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /leagues"
