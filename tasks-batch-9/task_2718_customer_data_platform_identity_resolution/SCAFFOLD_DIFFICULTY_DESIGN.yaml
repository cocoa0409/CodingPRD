  # =============================================================================
  # RULE 7 — cross_entity_state_dependency
  # Differentiation required by §0.5: DIFFERENT entity pairs. Instance 1 is Activation depending on
  # Segment (governance lifecycle); instance 2 is DeletionRequest depending on SuppressionEntry
  # (legal-hold lifecycle). No entity is shared between the two pairs.
  # =============================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: activation_dispatch_depends_on_segment_governance_state
        grounds:
          - validations[priority=30]
          - errors[ERR_GOVERNANCE_NOT_APPROVED]
          - state_machines.Segment.APPROVED_to_GOVERNANCE_EXPIRED
          - state_machines.Activation.DISPATCHED_to_PAUSED
          - endpoints[POST /cdp/retention-runs]
        distinguishing_aspect: |
          Entity pair Activation -> Segment: an Activation's own status is untouched (it stays
          DRAFT) yet dispatch flips from success to ERR_GOVERNANCE_NOT_APPROVED purely because the
          PARENT Segment aged out of APPROVED into GOVERNANCE_EXPIRED, and the sibling activation
          that had already dispatched is dragged to PAUSED / GOVERNANCE_EXPIRED by the same clock
          move.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem GOV_SRC and one PROMOTED batch of a single fully valid record in postal 10001 carrying an EMAIL/MARKETING OPT_IN signal, so one RESOLVED / NORMAL Profile with EMAIL activatable exists."
            - "Two ACTIVE EMAIL Destinations DEST_GOV_A and DEST_GOV_B, each with min_audience_size 1 and daily_hash_quota 1000, so the k-anonymity and quota gates never fire."
            - "One Segment SEG_GOV with criteria postal_code EQ 10001 and governance_valid_days 1, APPROVED at 2026-08-01T00:00:00Z, so governance_expires_at is 2026-08-02T00:00:00Z."
            - "Two DRAFT Activations of SEG_GOV, act_a on DEST_GOV_A and act_b on DEST_GOV_B, both for the window 2026-08-05T00:00:00Z..2026-08-05T02:00:00Z (separate destinations, so no cooldown or concurrency interaction)."
            - "act_a is dispatched while the segment is still APPROVED, proving the same call succeeds in the satisfied state."
            - "The clock is then moved to 2026-08-03T00:00:00Z and one retention run is executed, expiring the segment approval."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "GOV_SRC"
                display_name: "Loyalty Governance Feed"
                channel_type: "LOYALTY"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
                batch_label: "Governance Single"
                records:
                  - external_id: "G1"
                    email_raw: "g1@example.com"
                    phone_raw: "+1 (555) 140-0001"
                    loyalty_number: "LY00001301"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-12T10:00:00Z"
                    consent_signals:
                      - { channel: "EMAIL", purpose: "MARKETING", consent_state: "OPT_IN" }
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/ingest-batches/${batch_id}/promote"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/destinations"
              payload:
                code: "DEST_GOV_A"
                platform_kind: "ADVERTISING"
                channel: "EMAIL"
