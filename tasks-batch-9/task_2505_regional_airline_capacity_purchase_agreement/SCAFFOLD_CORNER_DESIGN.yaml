  # ===========================================================================
  # Guide section 6 — Errors (every catalog entry must be triggerable)
  # ===========================================================================
  - section: errors
    instances:
      - name: request_without_credentials_rejected_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints[GET /cpa/agreements]
        distinguishing_aspect: "Authentication is checked at priority 1, before any role or existence check, so a credential-less read of a populated collection is a 401 and never a 200 or a 403."
        test_recipe:
          setup:
            - "One DRAFT agreement exists so the collection is non-empty."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
          trigger:
            - call: "GET /cpa/agreements"
              payload: {}
              as: "(request sent with no X-Role and no X-User-ID header)"
          assert:
            - "HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\" and data.data == null per the §1.0 envelope"
            - "The same GET as CPAAdministrator returns HTTP 200 with total_count == 1"

      - name: unknown_path_ids_return_entity_specific_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_PILOT_NOT_FOUND]
          - errors[ERR_SCHEDULE_CYCLE_NOT_FOUND]
          - errors[ERR_FLIGHT_LEG_NOT_FOUND]
          - errors[ERR_CANCELLATION_CLAIM_NOT_FOUND]
          - errors[ERR_PASSTHROUGH_CLAIM_NOT_FOUND]
          - errors[ERR_SCORECARD_NOT_FOUND]
          - errors[ERR_BRAND_AUDIT_NOT_FOUND]
          - errors[ERR_NEGOTIATION_NOT_FOUND]
        distinguishing_aspect: "Each entity owns its own 404 code, so the identical unknown UUID probed against nine different read endpoints yields nine distinct error_ids and never the generic ERR_REFERENCE_NOT_FOUND, which is reserved for body FKs."
        test_recipe:
          setup:
            - "Empty database is sufficient; no fixture rows are needed."
          setup_api_calls: []
          trigger:
            - call: "GET /cpa/agreements/00000000-0000-4000-8000-000000000101"
              payload: {}
              as: CPAAdministrator
            - call: "GET /cpa/pilots/00000000-0000-4000-8000-000000000102"
              payload: {}
              as: CPAAdministrator
            - call: "GET /cpa/schedule-cycles/00000000-0000-4000-8000-000000000103"
              payload: {}
              as: CPAAdministrator
            - call: "GET /cpa/flight-legs/00000000-0000-4000-8000-000000000104"
              payload: {}
              as: CPAAdministrator
            - call: "GET /cpa/cancellation-claims/00000000-0000-4000-8000-000000000105"
              payload: {}
              as: CPAAdministrator
            - call: "GET /cpa/pass-through-claims/00000000-0000-4000-8000-000000000106"
              payload: {}
              as: CPAAdministrator
            - call: "GET /cpa/scorecards/00000000-0000-4000-8000-000000000107"
              payload: {}
              as: CPAAdministrator
            - call: "GET /cpa/brand-audits/00000000-0000-4000-8000-000000000108"
              payload: {}
              as: CPAAdministrator
            - call: "GET /cpa/extension-negotiations/00000000-0000-4000-8000-000000000109"
              payload: {}
              as: CPAAdministrator
          assert:
