              captures: { dsp: $.data.id }
            - call: "POST /disputes/${dsp}/request-evidence"
              payload: { required_item_type: "ADDRESS_PROOF" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { rounds: $.data.round_count, req: $.data.required_item_type }
            - call: "POST /disputes/${dsp}/evidence"
              payload: { item_type: "ADDRESS_PROOF", reference: "doc://address-proof/9911" }
              as: ShipperUser
