  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_error_beats_safety_error
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - state_machines.ShiftAssignment.SIGNED_UP_to_CONFIRMED
        distinguishing_aspect: |
          Category pair {state, business_safety}: confirming a CANCELLED junior
          assignment without a supervisor fails BOTH the state precondition
          (ERR_ASSIGNMENT_INVALID_STATE, priority 8) and the safety precondition
          (ERR_SUPERVISION_REQUIRED, priority 9); priority 8 must win.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; junior volunteer J (born 2011-06-15, age 15) fully ACTIVE via a minimum_age-14 role placement"
            - "Shift S: 2026-08-10T08:00:00Z-12:00:00Z, capacity 5, PUBLISHED, role minimum_age 14"
