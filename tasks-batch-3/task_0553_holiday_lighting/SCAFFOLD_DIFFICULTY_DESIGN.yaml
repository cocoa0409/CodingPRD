  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: job_start_requires_routeday_dispatched
        grounds:
          - state_machines.Job.SCHEDULED_to_IN_PROGRESS
          - entities.RouteDay.fields.status
          - errors[ERR_ROUTE_DAY_NOT_DISPATCHED]
        distinguishing_aspect: |
          Entity pair Job x RouteDay: Job SCHEDULED->IN_PROGRESS is gated on the linked RouteDay being
          DISPATCHED. With the route day still PLANNED, start is refused with ERR_ROUTE_DAY_NOT_DISPATCHED
          and the job stays SCHEDULED.
        test_recipe:
          setup:
            - "An ACTIVE contract; a SCHEDULED job booked onto a route day that is NOT dispatched (PLANNED)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Nan Owner", service_address: "14 Point St", roofline_feet: 155 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /jobs"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL", scheduled_date: "2026-11-28T09:00:00Z" }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew E", home_zone: "N", daily_stop_capacity: 5 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /route-days"
              payload: { crew_id: "${crew_id}", service_date: "2026-11-28T00:00:00Z", zone: "N", max_stops: 5 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-assignments"
              payload: { route_day_id: "${rd_id}", job_id: "${job_id}", window_start: "2026-11-28T09:00:00Z", window_end: "2026-11-28T11:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /jobs/${job_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_ROUTE_DAY_NOT_DISPATCHED"
            - "Job.${job_id}.status == SCHEDULED"

      - name: storage_retrieve_requires_contract_active
        grounds:
          - state_machines.StorageRecord.STORED_to_RETRIEVED
          - entities.SeasonalContract.fields.status
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair StorageRecord x SeasonalContract (a different pair than Job x RouteDay): StorageRecord
          STORED->RETRIEVED is gated on the parent contract being ACTIVE. After the contract is CANCELLED, the
          STORED record cannot be retrieved (ERR_CONTRACT_NOT_ACTIVE) and stays STORED.
        test_recipe:
          setup:
            - "An ACTIVE contract with lights STORED in a bin; the contract is then CANCELLED (storage record stays STORED)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Oli Owner", service_address: "15 Harbor St", roofline_feet: 165 }
              as: SalesRep
              captures: { cust_id: $.data.id }
