      - name: defect_basket_exact_equality_produces_zero_adjustment
        grounds:
          - calculations.defect_price_adjustment
          - entities.PurchaseSaleAgreement.fields.aggregate_defect_basket
          - entities.PurchaseSaleAgreement.fields.defect_adjustment_amount
          - state_machines.PurchaseSaleAgreement.CURATIVE_OPEN_to_CURATIVE_CLOSED
          - endpoints[POST /psas/{id}/close-curative]
        boundary:
          metric: aggregate_defect_basket_consumption
          comparator: "<="
          at_value: 16000.00
          below_value: 15500.00
          above_value: 16500.00
        distinguishing_aspect: |
          Exactly-at-the-basket case for the money metric aggregate_defect_basket_consumption
          on POST /psas/{id}/close-curative. Two UNCURED defects of 10.0000 and 7.5000 net
          mineral acres give gross values 12000.00 and 9000.00, per-defect deductibles of
          2500.00 each, and net values 9500.00 and 6500.00 that sum to exactly 16000.00. The
          comparator is <=, so an exactly-consumed basket yields defect_adjustment_amount
          0.00 and adjusted_purchase_price 48000.00 rather than any deduction; one cent more
          of net defect value would deduct.
