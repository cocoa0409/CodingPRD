  # ===========================================================================
  # Section 5 — Endpoints (from claim-extraction-guide §5)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: program_amend_stale_version_rejected
        claim_type: conditional_action
        grounds:
          - concurrency_rules[program-amend-stale-version]
          - errors[ERR_STALE_PROGRAM_VERSION]
        distinguishing_aspect: |
          PUT /supplier-programs/{id} with stale expected_program_version
          returns 412 ERR_STALE_PROGRAM_VERSION.
        test_recipe:
          setup: ["Program P exists in DRAFT; client observed version V"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/suppliers"
              payload: { legal_name: "S" }
              as: CoopAdmin
              captures: { s_id: $.data.id }
            - call: "POST /coop/suppliers/${s_id}/supplier-programs"
              payload:
                program_code: "P-OCC"
                exclusivity_required: false
                exclusivity_threshold_pct: 0
                tier_schedule: [{ min_qty: 0, rate_bps: 100 }]
                holdback_policy: "FLAT"
              as: SupplierRep
              as_user_id: "${s_id}"
              captures: { p_id: $.data.id, p_v: $.data.version }
            # First amendment succeeds and bumps version.
            - call: "PUT /coop/supplier-programs/${p_id}"
              payload: { expected_program_version: "${p_v}", holdback_policy: "RISK_ADJUSTED" }
              as: SupplierRep
              as_user_id: "${s_id}"
          trigger:
            # Second amendment reusing the OLD version should fail.
            - call: "PUT /coop/supplier-programs/${p_id}"
              payload: { expected_program_version: "${p_v}", holdback_policy: "FLAT" }
              as: SupplierRep
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_PROGRAM_VERSION"
            - "HTTP status == 412"
            - "SupplierProgram.negotiation_round == 1   # only first amendment counted"

      - name: distribution_calculate_stale_version_rejected
        claim_type: conditional_action
        grounds:
          - concurrency_rules[distribution-recalc-stale-version]
          - errors[ERR_STALE_DISTRIBUTION_VERSION]
        distinguishing_aspect: |
          POST /distributions/{id}/calculate with stale
          expected_distribution_version returns 412 ERR_STALE_DISTRIBUTION_VERSION.
        test_recipe:
          setup: ["Distribution D exists; version observed"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/distributions"
              payload: {}
              as: FinanceOfficer
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /coop/distributions/${d_id}/calculate"
              payload: { expected_distribution_version: "${d_v}" }
              as: FinanceOfficer
          trigger:
            # Distribution is now CALCULATED (version bumped). To attempt re-calculate
            # we'd need status==DRAFT, but OCC is the focused check; simulate by
            # creating a second distribution and trying with the first's stale version.
            - call: "POST /coop/distributions"
              payload: {}
              as: FinanceOfficer
              captures: { d2_id: $.data.id, d2_v: $.data.version }
            - call: "POST /coop/distributions/${d2_id}/calculate"
              payload: { expected_distribution_version: "${d_v}" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            # d2's current version is fresh (just created), but we sent the stale d_v
            # from the first distribution. If d_v happens to equal d2_v numerically,
            # the test is ambiguous; but distinct entities have independent version
            # sequences starting at 1, so d_v could equal d2_v. To make this robust,
            # use an expression ${d2_v} - 1 for the deliberate stale case.
            - "error_id == ERR_STALE_DISTRIBUTION_VERSION OR second calculate returns successfully if d_v == d2_v"
            # Note: cleaner formulation uses ${d2_v} - 1. See next instance for the
            # canonical deliberate-stale OCC test.

      - name: distribution_calculate_deliberate_stale_version
        claim_type: conditional_action
        grounds:
          - concurrency_rules[distribution-recalc-stale-version]
          - errors[ERR_STALE_DISTRIBUTION_VERSION]
        distinguishing_aspect: |
          Calculate with expected_distribution_version = current_version - 1
          is deterministically rejected with 412.
        test_recipe:
          setup: ["Distribution D created; current version V"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/distributions"
              payload: {}
              as: FinanceOfficer
              captures: { d_id: $.data.id, d_v: $.data.version }
          trigger:
            - call: "POST /coop/distributions/${d_id}/calculate"
              payload: { expected_distribution_version: "${d_v} - 1" }
