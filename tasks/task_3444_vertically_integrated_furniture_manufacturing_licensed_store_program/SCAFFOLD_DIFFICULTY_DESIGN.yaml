              as: ProductionPlanner
              captures: { c1_avail: $.data.available_units, c1_lic: $.data.licensee_reserved_units, c1_ws: $.data.wholesale_reserved_units }
          assert:
            - "after CLEARANCE advance: lifecycle == CLEARANCE and credit_used_cents unchanged at 179800 (no cascade fires mid-lifecycle)"
