  - rule_id: boundary_precision_check
    instances:

      - name: peer_group_band_upper_bound_is_inclusive_on_submit_application
        grounds:
          - calculations.peer_group_assignment
          - entities.PeerGroup.fields.max_monthly_redemption_cents
          - validations[priority=37]
          - errors[ERR_NO_PEER_GROUP_MATCH]
        distinguishing_aspect: |
          Both band bounds are inclusive and the band_width tie-break is exercised
          at the exact shared bound: a vendor reporting exactly the upper bound
          20000000 matches PG-SUPER-A (width 15000000) rather than the equally
          eligible PG-SUPER-B (width 20000000), while 4999999 (one cent below the
          lower bound) matches nothing at all.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z"
            - "PG-SUPER-A covers SUPERMARKET volume [5000000, 20000000]; PG-SUPER-B covers SUPERMARKET volume [20000000, 40000000]; the bands touch at exactly 20000000"
            - "Four SUPERMARKET applicants exist, reporting 4999999, 5000000, 20000000 and 20000001 cents, none of them yet submitted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
              as: VendorUnitSupervisor
              captures: { pg_a: $.data.id }
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-B", store_type: "SUPERMARKET", min_monthly_redemption_cents: 20000000, max_monthly_redemption_cents: 40000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 2.0 }
              as: VendorUnitSupervisor
              captures: { pg_b: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Below Lower Bound", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 4999999 }
              as: VendorUnitAnalyst
              captures: { v_lo_minus: $.data.id }
