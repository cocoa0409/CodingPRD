    input: [expected_enrollment_version, day_of_week, start_minute, end_minute]
    output: CurfewWindow
    side_effects: ["overlap validation", "increments EMEnrollment.version by 1"]
  - method: GET
    path: "/em-enrollments/{id}/curfew-windows"
