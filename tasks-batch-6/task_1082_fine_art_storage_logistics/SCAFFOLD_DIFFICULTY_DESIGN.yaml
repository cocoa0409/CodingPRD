              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_POLICY_NOT_ACTIVE"
            - "response.http_status == 409"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_buffered_overlap
        grounds:
          - validations[priority=17]
          - entities.TransportJob.fields.crew_id
          - state_machines.TransportJob.SCHEDULED_to_IN_PROGRESS
        distinguishing_aspect: |
          RiggingCrew overlap uses closed intervals plus a SETUP_BUFFER_MINUTES=60 buffer: job1
          09:00-11:00 and job2 11:30-12:30 have a 30-minute gap (< 60) and therefore collide
          with ERR_CREW_UNAVAILABLE — buffered semantics.
        test_recipe:
          setup:
            - "one crew; two artworks and crates; job1 09:00-11:00 scheduled"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Rigging Co", client_type: "DEALER", billing_email: "ap@rigging.example" }
              as: Registrar
              captures: { client_id: $.data.id }
