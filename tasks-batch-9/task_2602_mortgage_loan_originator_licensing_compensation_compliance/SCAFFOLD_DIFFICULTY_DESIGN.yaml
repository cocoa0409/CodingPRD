# =============================================================================
# 1.8 Scaffold Difficulty Design - Test Targeting Index
# Task 2602: Mortgage Loan Originator Licensing & Compensation Compliance
#
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 only; the logical clock starts at 2026-08-01T00:00:00Z
# and is moved only through POST /_clock/set_current_utc.
# Operator user ids used throughout: analyst-1 (LicensingAnalyst),
# designer-1 (CompensationDesigner), officer-1 / officer-2 (ComplianceOfficer),
# ops-1 (LoanOperations), exam-1 (ExaminationCoordinator), admin-1 (PlatformAdmin).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: ce_attribution_variant_flips_ce_satisfied
        grounds:
          - calculations.ce_compliance_evaluation
          - entities.CeCreditRecord.fields.attributed_year
          - entities.LicenseRegistration.fields.ce_satisfied
        distinguishing_aspect: |
          Licensing/education domain: the SAME four CeCreditRecord rows yield total_hours 8 with
          ce_satisfied true under MAKEUP_ATTRIBUTION and total_hours 7 with ce_satisfied false
          under CALENDAR_YEAR_ATTRIBUTION, because the 1-hour make-up credit completed
          2027-01-15 is attributed to 2026 by one variant and to 2027 by the other.
        test_recipe:
          setup:
            - "One Originator (NMLS 1100001, EMPLOYED) with one CA LicenseRegistration in PENDING,
               required_ce_hours 8, ce_reporting_year 2026."
            - "Four CeCourses approved in CA: FEDERAL_LAW 3h, ETHICS 2h, NONTRADITIONAL 2h,
               ELECTIVE 1h."
            - "Three non-make-up credits completed in June 2026 (3 + 2 + 2 = 7 hours) plus one
               make-up ELECTIVE credit completed 2027-01-15 filed for reporting_period_year 2026."
          setup_api_calls:
            - call: "POST /originators"
              payload: { nmls_unique_id: "1100001", legal_name: "Dana Reyes", hire_date: "2024-03-01T00:00:00Z", employment_status: "EMPLOYED" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-40188", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026, required_ce_hours: 8 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id }
            - call: "POST /ce-courses"
              payload: { course_code: "CE-FED-3H", credit_hours: 3, category: "FEDERAL_LAW", approved_state_codes: ["CA"], successive_year_blocked: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { course_fed: $.data.id }
            - call: "POST /ce-courses"
              payload: { course_code: "CE-ETH-2H", credit_hours: 2, category: "ETHICS", approved_state_codes: ["CA"], successive_year_blocked: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { course_eth: $.data.id }
            - call: "POST /ce-courses"
              payload: { course_code: "CE-NT-2H", credit_hours: 2, category: "NONTRADITIONAL", approved_state_codes: ["CA"], successive_year_blocked: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { course_nt: $.data.id }
            - call: "POST /ce-courses"
              payload: { course_code: "CE-ELEC-1H", credit_hours: 1, category: "ELECTIVE", approved_state_codes: ["CA"], successive_year_blocked: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { course_elec: $.data.id }
            - call: "POST /ce-credits"
              payload: { originator_id: "${orig_id}", ce_course_id: "${course_fed}", completion_date: "2026-06-10T00:00:00Z", reporting_period_year: 2026, is_makeup: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ce-credits"
              payload: { originator_id: "${orig_id}", ce_course_id: "${course_eth}", completion_date: "2026-06-11T00:00:00Z", reporting_period_year: 2026, is_makeup: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ce-credits"
              payload: { originator_id: "${orig_id}", ce_course_id: "${course_nt}", completion_date: "2026-06-12T00:00:00Z", reporting_period_year: 2026, is_makeup: false }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-20T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /ce-credits"
              payload: { originator_id: "${orig_id}", ce_course_id: "${course_elec}", completion_date: "2027-01-15T00:00:00Z", reporting_period_year: 2026, is_makeup: true }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { credit_makeup: $.data.id }
          trigger:
            - call: "GET /originators/${orig_id}/ce-compliance"
              payload: { attribution_variant: "MAKEUP_ATTRIBUTION", reporting_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { makeup_total: $.data.total_hours, makeup_sat: $.data.ce_satisfied, makeup_fed: $.data.federal_law_hours }
            - call: "GET /originators/${orig_id}/ce-compliance"
              payload: { attribution_variant: "CALENDAR_YEAR_ATTRIBUTION", reporting_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { cal_total: $.data.total_hours, cal_sat: $.data.ce_satisfied, cal_fed: $.data.federal_law_hours }
          assert:
            - "${makeup_total} == 8"
            - "${makeup_sat} == true"
            - "${cal_total} == 7"
            - "${cal_sat} == false"
            - "${makeup_total} - ${cal_total} == 1"
            - "${makeup_fed} == 3 and ${cal_fed} == 3 (the FEDERAL_LAW minimum is met under both
               variants, so the flip is caused only by the make-up credit's attributed_year)"
            - "CeCreditRecord.${credit_makeup}.attributed_year == 2026"
            - "CeCreditRecord.${credit_makeup}.credit_status == APPLIED"
            - "LicenseRegistration.${lic_id}.ce_hours_applied == 8 (persisted with
               MAKEUP_ATTRIBUTION per POST /ce-credits side effects)"

      - name: comp_accrual_provisional_locked_vs_final_funded_divergence
        grounds:
          - calculations.originator_compensation_accrual
          - entities.CompensationRecord.fields.variant
          - state_machines.CompensationRecord.ACCRUED_to_RECONCILED
        distinguishing_aspect: |
          Money/ledger domain on CompensationRecord (not the CE hours of the sibling instance):
          PROVISIONAL prices locked_amount_cents 20000000 at 105 bps -> accrued_cents 210000,
          FINAL prices funded_amount_cents 20500000 at 105 bps -> accrued_cents 215250, so the
          reconciliation delta is exactly +5250 cents on identical loan data.
        test_recipe:
          setup:
            - "Authorised CA originator with an ACTIVE CompensationPlan (base_basis_points 105,
               min_fee_cents 100000, max_fee_cents 900000, volume_tier_enabled true,
               concession_absorption_enabled false) assigned over
               [2026-08-01T00:00:00Z, 2026-12-31T00:00:00Z]."
            - "One loan locked at 20000000 cents and funded at 20500000 cents, closed with
               file_quality_score 95 and hours_worked_pct 80 so the tier adder is 0."
          setup_api_calls:
            - call: "POST /originators"
              payload: { nmls_unique_id: "1100002", legal_name: "Ivan Poole", hire_date: "2024-04-01T00:00:00Z", employment_status: "EMPLOYED" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-40190", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026, required_ce_hours: 8 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-ALPHA", effective_at: "2026-08-01T00:00:00Z", expected_license_registration_version: "${lic_v0}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { spon_id: $.data.id }
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compensation-plans"
              payload: { plan_name: "Std 105bps Tiered", base_basis_points: 105, min_fee_cents: 100000, max_fee_cents: 900000, volume_tier_enabled: true, concession_absorption_enabled: false }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "LOAN_VOLUME_UNITS", weight_pct: 60, justification_text: "Closed unit count over the period, a permissible non-terms variable." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "FILE_QUALITY_SCORE", weight_pct: 40, justification_text: "Documented file quality audit score, a permissible non-terms variable." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "Weights total 100 and no terms-based variable is present." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { orig_v1: $.data.version }
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${plan_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_originator_version: "${orig_v1}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BW-2602-01", product_type: "FIXED_30", requested_amount_cents: 20000000, par_rate_bps: 650 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /loan-applications/${loan_id}/lock"
              payload: { note_rate_bps: 650, locked_amount_cents: 20000000 }
              as: Originator
              as_user_id: "${orig_id}"
            - call: "POST /loan-applications/${loan_id}/close"
              payload: { funded_amount_cents: 20500000, funded_at: "2026-09-01T00:00:00Z", lender_paid_comp_cents: 215250, borrower_paid_comp_cents: 0, file_quality_score: 95, hours_worked_pct: 80 }
              as: LoanOperations
              as_user_id: "ops-1"
            - call: "GET /compensation-records"
              payload: { loan_application_id: "${loan_id}", variant: "PROVISIONAL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rec_id: "$.data[0].id", prov_accrued: "$.data[0].accrued_cents", prov_tier: "$.data[0].tier_bps_adder" }
          trigger:
            - call: "POST /originators/${orig_id}/compensation-reconciliations"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rec_count: $.data.reconciled_count, total_final: $.data.total_final_cents, total_delta: $.data.total_delta_cents }
          assert:
            - "${prov_accrued} == 210000"
            - "${prov_tier} == 0"
            - "${rec_count} == 1"
            - "${total_final} == 215250"
            - "${total_delta} == 5250"
            - "CompensationRecord.${rec_id}.variant == FINAL"
            - "CompensationRecord.${rec_id}.accrued_cents == 215250"
            - "CompensationRecord.${rec_id}.paid_cents == 215250"
            - "CompensationRecord.${rec_id}.status == RECONCILED"
            - "LoanApplication.${loan_id}.compensation_status == RECONCILED"
            - "Originator.${orig_id}.lifetime_accrued_cents == 215250"
            - "Originator.${orig_id}.net_compensation_cents == 215250"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: reconciliation_round_per_line_then_sum_beats_sum_then_round
        grounds:
          - calculations.originator_compensation_accrual.precision
          - endpoints[POST /originators/{id}/compensation-reconciliations]
        distinguishing_aspect: |
          Mode (b) - order of operations inside one aggregation. Two identical lines each price to
          the exact half-cent 105010.5, so rounding per line then summing gives 210022 while
          summing then rounding once gives 210021. The scaffold pins round-per-line, so the
          run-level total_final_cents must be 210022 and the 1-cent gap is the only observable.
        test_recipe:
          setup:
            - "Authorised CA originator with an ACTIVE plan: base_basis_points 105,
               min_fee_cents 100000, max_fee_cents 900000, volume_tier_enabled false,
               concession_absorption_enabled false, assigned over
               [2026-08-01T00:00:00Z, 2026-12-31T00:00:00Z]."
            - "Two loans, each locked and funded at 10001000 cents so each raw line is
               10001000 * 105 / 10000 = 105010.5 cents."
          setup_api_calls:
            - call: "POST /originators"
              payload: { nmls_unique_id: "1100003", legal_name: "Mara Quinn", hire_date: "2024-05-01T00:00:00Z", employment_status: "EMPLOYED" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-40191", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026, required_ce_hours: 8 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-ALPHA", effective_at: "2026-08-01T00:00:00Z", expected_license_registration_version: "${lic_v0}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compensation-plans"
              payload: { plan_name: "Flat 105bps", base_basis_points: 105, min_fee_cents: 100000, max_fee_cents: 900000, volume_tier_enabled: false, concession_absorption_enabled: false }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "LOAN_VOLUME_UNITS", weight_pct: 100, justification_text: "Closed unit count only; no term of the transaction participates." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "Single permissible variable at weight 100." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { orig_v1: $.data.version }
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${plan_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_originator_version: "${orig_v1}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BW-2602-11", product_type: "FIXED_30", requested_amount_cents: 10001000, par_rate_bps: 640 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { loan_a: $.data.id }
            - call: "POST /loan-applications/${loan_a}/lock"
              payload: { note_rate_bps: 640, locked_amount_cents: 10001000 }
              as: Originator
              as_user_id: "${orig_id}"
            - call: "POST /loan-applications/${loan_a}/close"
              payload: { funded_amount_cents: 10001000, funded_at: "2026-09-01T00:00:00Z", lender_paid_comp_cents: 105011, borrower_paid_comp_cents: 0, file_quality_score: 95, hours_worked_pct: 80 }
              as: LoanOperations
              as_user_id: "ops-1"
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BW-2602-12", product_type: "FIXED_30", requested_amount_cents: 10001000, par_rate_bps: 640 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { loan_b: $.data.id }
            - call: "POST /loan-applications/${loan_b}/lock"
              payload: { note_rate_bps: 640, locked_amount_cents: 10001000 }
              as: Originator
              as_user_id: "${orig_id}"
            - call: "POST /loan-applications/${loan_b}/close"
              payload: { funded_amount_cents: 10001000, funded_at: "2026-09-02T00:00:00Z", lender_paid_comp_cents: 105011, borrower_paid_comp_cents: 0, file_quality_score: 95, hours_worked_pct: 80 }
              as: LoanOperations
              as_user_id: "ops-1"
          trigger:
            - call: "POST /originators/${orig_id}/compensation-reconciliations"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rec_count: $.data.reconciled_count, total_final: $.data.total_final_cents, total_delta: $.data.total_delta_cents }
            - call: "GET /compensation-records"
              payload: { originator_id: "${orig_id}", variant: "FINAL", limit: 10, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { line0: "$.data[0].accrued_cents", line1: "$.data[1].accrued_cents" }
          assert:
            - "${line0} == 105011"
            - "${line1} == 105011"
            - "${rec_count} == 2"
            - "${total_final} == 210022"
            - "${total_delta} == 0"
            - "${total_final} != 210021 (sum-then-round would produce 210021; the per-line
               round_half_up mandated by calculations.originator_compensation_accrual.precision
               produces 210022)"
            - "Originator.${orig_id}.lifetime_accrued_cents == 210022"
            - "Originator.${orig_id}.net_compensation_cents == 210022"
            - "Originator.${orig_id}.exposure_score == 0 and monitoring_status == STANDARD
               (no dual pay, zero rate spread, no approved exception, no clawback)"

      - name: pricing_exception_bracket_pinned_to_pre_absorption_commission
        grounds:
          - calculations.pricing_exception_net_impact
          - endpoints[POST /pricing-exceptions/{id}/decisions]
        distinguishing_aspect: |
          Mode (c) - a formula whose input looks like its own output. The absorption bracket is
          keyed on the PRE-absorption commission 500000 (>= CONCESSION_BRACKET_CENTS 300000, so
          ABSORB_HIGH_PCT 50) giving comp_impact_cents 225000; feeding the post-absorption net
          275000 back into step 2 would fall in the LOW bracket and give 112500. Only the pinned
          order reproduces 225000.
        test_recipe:
          setup:
            - "Authorised CA originator with an ACTIVE plan: base_basis_points 200,
               min_fee_cents 100000, max_fee_cents 900000, volume_tier_enabled false,
               concession_absorption_enabled true."
            - "One LOCKED loan at 25000000 cents, so the concession cap is
               floor(25000000 * 2 / 100) = 500000 cents."
            - "A SUBMITTED PricingException for a 450000-cent concession, reason_code
               COMPETITIVE_MATCH, decided by a ComplianceOfficer who is not the requester."
          setup_api_calls:
            - call: "POST /originators"
              payload: { nmls_unique_id: "1100004", legal_name: "Owen Vance", hire_date: "2024-06-01T00:00:00Z", employment_status: "EMPLOYED" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-40192", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026, required_ce_hours: 8 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-ALPHA", effective_at: "2026-08-01T00:00:00Z", expected_license_registration_version: "${lic_v0}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compensation-plans"
              payload: { plan_name: "200bps Absorbing", base_basis_points: 200, min_fee_cents: 100000, max_fee_cents: 900000, volume_tier_enabled: false, concession_absorption_enabled: true }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "HOURS_WORKED", weight_pct: 100, justification_text: "Hours worked on the file; a permissible non-terms variable under the plan policy." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "Permissible variable only; weights sum to 100." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { orig_v1: $.data.version }
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${plan_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_originator_version: "${orig_v1}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BW-2602-21", product_type: "FIXED_30", requested_amount_cents: 25000000, par_rate_bps: 660 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /loan-applications/${loan_id}/lock"
              payload: { note_rate_bps: 660, locked_amount_cents: 25000000 }
              as: Originator
              as_user_id: "${orig_id}"
            - call: "POST /loan-applications/${loan_id}/pricing-exceptions"
