- rule_id: resource_temporal_overlap
  instances:
  - name: supply_contract_half_open_month_windows_allow_adjacency
    grounds:
    - entities.SupplyContract.fields.start_month
    - entities.SupplyContract.fields.end_month
    - validations[priority=14]
    - errors.ERR_CONTRACT_WINDOW_OVERLAP
    distinguishing_aspect: 'Interval semantics are half-open over months, so a contract starting in

      the month after an existing contract''s last contracted month is accepted

      while one starting inside that month is rejected — adjacency is legal

      and collision is not, on two contracts for the same SKU.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Partner HELIOS qualified and holding one contract on SKU AC-100-PCIE spanning 2026-01 through 2026-03.
      setup_api_calls:
