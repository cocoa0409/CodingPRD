      - name: corner_val_credit_application_after_expiry_is_rejected
        claim_type: Violation -> Error
        grounds: ["validations[priority=58]", "errors[ERR_CREDIT_EXPIRED]", "calculations.credit_expiry"]
        distinguishing_aspect: "Rung 58 requires the clock to be STRICTLY BEFORE expires_at: a credit granted 2026-05-01 and applied at 2026-10-29 — one day past its 180-day window — returns ERR_CREDIT_EXPIRED, not ERR_INSUFFICIENT_CREDIT."
        test_recipe:
          setup: ["One ACTIVE member with a 3000-cent credit granted 2026-05-01 and a 1000-cent open charge; the clock is at 2026-10-29."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
