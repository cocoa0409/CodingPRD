scaffold_difficulty_design:
  # =================================================================
  # Rule 1 - dual_variant_calc (different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_pricing_insured_vs_cash_variant
        grounds:
          - calculations.claim_patient_responsibility
          - entities.Claim.fields.patient_resp_cents
          - entities.Claim.fields.insurer_paid_cents
        distinguishing_aspect: |
          Same item and quantity produce different Claim money under the two
          pricing variants: INSURED (Medicare fee-schedule basis, 20% per-line
          coinsurance) yields patient_resp 370.00 with insurer 1480.00, while
          CASH_HSA (retail basis, 100% patient) yields patient_resp 3000.00.
          Entity domain: Claim/SupplyOrder pricing (distinct from the
          ResupplyProgram adherence domain of the sibling instance).
        test_recipe:
          setup:
            - "MCR plan (MEDICARE_DMEPOS, coinsurance 0.20, cycle 3) and CASH plan (CASH_HSA, 1.00, 1) exist"
            - "ITM_OST: A4419 OSTOMY, pack 1850/10 (unit 185.00), retail 300, max 60, no PA, sizes [45MM,57MM], covers both plans"
            - "Patient A on MCR (HSA 0.00) and Patient B on CASH (HSA 5000.00), both ACTIVE, both with ACTIVE Rx A4419 monthly 20 and CURRENT OSTOMY fit profile 45MM"
            - "StockLevel for ITM_OST on_hand 500"
            - "Each patient has a DELIVERED order with one line ITM_OST qty 10"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/payer-plans", payload: { name: "Self-Pay HSA", plan_type: CASH_HSA, coinsurance_pct: 1.00, cycle_months: 1, is_active: true }, as: PlatformAdmin, captures: { pln_cash: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln_mcr}", "${pln_cash}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM", "57MM"] }, as: PlatformAdmin, captures: { itm_ost: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm_ost}", on_hand_qty: 500 }, as: PlatformAdmin }
            - { call: "POST /api/patients", payload: { full_name: "Pat MCR", date_of_birth: "1955-03-02", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt_a: $.data.id } }
            - { call: "POST /api/patients/${pt_a}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_a_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt_a}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt_a}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_a_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/patients", payload: { full_name: "Pat CASH", date_of_birth: "1980-07-11", payer_plan_id: "${pln_cash}", hsa_initial_credit_cents: 500000 }, as: IntakeCoordinator, captures: { pt_b: $.data.id } }
            - { call: "POST /api/patients/${pt_b}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_b_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt_b}", hcpcs_code: "A4419", prescriber_npi: "1234567890", monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt_b}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_b_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt_a}" }, as: Patient, as_user_id: "${pt_a}", captures: { ord_a: $.data.id, ord_a_v: $.data.version } }
            - { call: "POST /api/orders/${ord_a}/lines", payload: { formulary_item_id: "${itm_ost}", size_code: "45MM", quantity: 10, expected_order_version: "${ord_a_v}" }, as: Patient, as_user_id: "${pt_a}" }
            - { call: "POST /api/orders/${ord_a}/submit", payload: {}, as: Patient, as_user_id: "${pt_a}" }
            - { call: "POST /api/shipments", payload: { order_id: "${ord_a}" }, as: FulfillmentAgent, captures: { shp_a: $.data.id } }
            - { call: "POST /api/shipments/${shp_a}/release", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp_a}/ship", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp_a}/deliver", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/orders", payload: { patient_id: "${pt_b}" }, as: Patient, as_user_id: "${pt_b}", captures: { ord_b: $.data.id, ord_b_v: $.data.version } }
            - { call: "POST /api/orders/${ord_b}/lines", payload: { formulary_item_id: "${itm_ost}", size_code: "45MM", quantity: 10, expected_order_version: "${ord_b_v}" }, as: Patient, as_user_id: "${pt_b}" }
            - { call: "POST /api/orders/${ord_b}/submit", payload: {}, as: Patient, as_user_id: "${pt_b}" }
            - { call: "POST /api/shipments", payload: { order_id: "${ord_b}" }, as: FulfillmentAgent, captures: { shp_b: $.data.id } }
            - { call: "POST /api/shipments/${shp_b}/release", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp_b}/ship", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp_b}/deliver", payload: {}, as: FulfillmentAgent }
          trigger:
            - { call: "POST /api/claims", payload: { order_id: "${ord_a}" }, as: BillingSpecialist, captures: { clm_a: $.data.id, resp_a: $.data.patient_resp_cents, allow_a: $.data.total_allowed_cents } }
            - { call: "POST /api/claims", payload: { order_id: "${ord_b}" }, as: BillingSpecialist, captures: { clm_b: $.data.id, resp_b: $.data.patient_resp_cents, allow_b: $.data.total_allowed_cents } }
            - { call: "POST /api/claims/${clm_a}/submit", payload: {}, as: BillingSpecialist }
            - { call: "POST /api/claims/${clm_a}/adjudicate", payload: { outcome: PAID }, as: BillingSpecialist, captures: { ins_a: $.data.insurer_paid_cents } }
          assert:
            - "Claim.${clm_a}.total_allowed_cents == 1850.00 (185.00 x 10, insured allowance basis)"
            - "Claim.${clm_a}.patient_resp_cents == 370.00 (round(1850.00 x 0.20, 2))"
            - "Claim.${clm_b}.total_allowed_cents == 3000.00 (retail basis 300 x 10)"
            - "Claim.${clm_b}.patient_resp_cents == 3000.00 (CASH_HSA: 100% of retail)"
            - "after PAID adjudication Claim.${clm_a}.insurer_paid_cents == 1480.00"
            - "Claim.${clm_b}.insurer_paid_cents == 0 (never billed to a payer)"

      - name: adherence_provisional_vs_final_variant
        grounds:
          - calculations.adherence_scores
          - entities.ResupplyProgram.fields.adherence_score_provisional
          - entities.ResupplyProgram.fields.adherence_score_final
        distinguishing_aspect: |
          Identical program history scores differently under the two adherence
          variants: provisional (forward-looking, SHIPPED counts) == 0.67 while
          final (chronological, DELIVERED only) == 0.33 with 3 cycles due,
          1 delivered, 1 in transit. Entity domain: ResupplyProgram adherence
          (distinct from the Claim pricing domain of the sibling instance).
        test_recipe:
          setup:
            - "MCR plan, ITM_OST (no PA), stock 500, ACTIVE patient with Rx A4419 monthly 20 and OSTOMY fit 45MM"
            - "ResupplyProgram OSTOMY frequency_days 30 start 2026-05-01"
            - "Cycle 1 confirmed at 2026-05-01, shipped, DELIVERED 2026-05-03"
            - "Cycle 2 confirmed at 2026-06-02, SHIPPED 2026-06-04 (in transit)"
            - "Logical clock at 2026-07-15: cycles_due = floor(75/30)+1 = 3"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln_mcr}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm_ost: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm_ost}", on_hand_qty: 500 }, as: PlatformAdmin }
            - { call: "POST /api/patients", payload: { full_name: "Pat ADH", date_of_birth: "1962-01-19", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/resupply-programs", payload: { patient_id: "${pt}", category: OSTOMY, frequency_days: 30, start_date: "2026-05-01" }, as: IntakeCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /api/resupply-programs/${prog}/confirm-cycle", payload: {}, as: Patient, as_user_id: "${pt}", captures: { ord1: $.data.id } }
            - { call: "POST /api/shipments", payload: { order_id: "${ord1}" }, as: FulfillmentAgent, captures: { shp1: $.data.id } }
            - { call: "POST /api/shipments/${shp1}/release", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp1}/ship", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shipments/${shp1}/deliver", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/resupply-programs/${prog}/confirm-cycle", payload: {}, as: Patient, as_user_id: "${pt}", captures: { ord2: $.data.id } }
            - { call: "POST /api/shipments", payload: { order_id: "${ord2}" }, as: FulfillmentAgent, captures: { shp2: $.data.id } }
            - { call: "POST /api/shipments/${shp2}/release", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shipments/${shp2}/ship", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /api/resupply-programs/${prog}", payload: {}, as: IntakeCoordinator, captures: { prov: $.data.adherence_score_provisional, fin: $.data.adherence_score_final } }
          assert:
            - "ResupplyProgram.${prog}.adherence_score_provisional == 0.67 ((1 delivered + 1 in-transit) / 3 due)"
            - "ResupplyProgram.${prog}.adherence_score_final == 0.33 (1 delivered / 3 due)"
            - "adherence_score_provisional != adherence_score_final for identical history"
            - "ResupplyProgram.${prog}.status == ACTIVE (final 0.33 would suspend only via the return cascade; score read alone does not suspend)"

  # =================================================================
  # Rule 2 - combinatorial_formula (different modes)
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quantity_allowance_nested_min_mode_a
        grounds:
          - calculations.resupply_quantity_allowance
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction - nested min over
          rx_cap (monthly_quantity x plan.cycle_months), item max_units_per_cycle,
          and PA approved_units, with a conditional branch on plan type. The
          Medicare patient binds at the item cap (30) while the COMMERCIAL
          patient with identical Rx and PA binds at the Rx cap (20) because
          cycle_months differs (3 vs 1).
        test_recipe:
          setup:
            - "MCR plan (cycle_months 3) and COM plan (COMMERCIAL, 0.10, cycle_months 1)"
            - "ITM_WND: A6250 WOUND, pack 999/8, retail 650, max_units_per_cycle 30, requires_pa true, sizes [4X4], covers both plans"
            - "Patient A (MCR) and Patient B (COM), both ACTIVE with Rx A6250 monthly 20, WOUND fit 4X4, and APPROVED PA approved_units 45 window [2026-05-01, 2026-08-31]"
            - "Each has an ACTIVE WOUND program (freq 30, start 2026-05-01)"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/payer-plans", payload: { name: "Commercial PPO", plan_type: COMMERCIAL, coinsurance_pct: 0.10, cycle_months: 1, is_active: true }, as: PlatformAdmin, captures: { pln_com: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A6250", name: "Wound dressing", category: WOUND, covered_plan_ids: ["${pln_mcr}", "${pln_com}"], pack_fee_cents: 999, pack_size: 8, retail_price_cents: 650, max_units_per_cycle: 30, requires_pa: true, size_codes: ["4X4"] }, as: PlatformAdmin, captures: { itm_wnd: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat A", date_of_birth: "1958-05-05", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt_a: $.data.id } }
            - { call: "POST /api/patients/${pt_a}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_a_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt_a}", hcpcs_code: "A6250", prescriber_npi: "1234567890", diagnosis_codes: ["L89.1"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt_a}", category: WOUND, size_code: "4X4", measured_on: "2026-04-20", expected_patient_version: "${pt_a_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/prior-authorizations", payload: { patient_id: "${pt_a}", hcpcs_code: "A6250", approved_units: 45, valid_from: "2026-05-01", valid_to: "2026-08-31" }, as: PriorAuthSpecialist, captures: { pa_a: $.data.id } }
            - { call: "POST /api/prior-authorizations/${pa_a}/decision", payload: { outcome: APPROVED }, as: PriorAuthSpecialist }
            - { call: "POST /api/resupply-programs", payload: { patient_id: "${pt_a}", category: WOUND, frequency_days: 30, start_date: "2026-05-01" }, as: IntakeCoordinator, captures: { prog_a: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat B", date_of_birth: "1975-09-30", payer_plan_id: "${pln_com}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt_b: $.data.id } }
            - { call: "POST /api/patients/${pt_b}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_b_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt_b}", hcpcs_code: "A6250", prescriber_npi: "1234567890", monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt_b}", category: WOUND, size_code: "4X4", measured_on: "2026-04-20", expected_patient_version: "${pt_b_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/prior-authorizations", payload: { patient_id: "${pt_b}", hcpcs_code: "A6250", approved_units: 45, valid_from: "2026-05-01", valid_to: "2026-08-31" }, as: PriorAuthSpecialist, captures: { pa_b: $.data.id } }
            - { call: "POST /api/prior-authorizations/${pa_b}/decision", payload: { outcome: APPROVED }, as: PriorAuthSpecialist }
            - { call: "POST /api/resupply-programs", payload: { patient_id: "${pt_b}", category: WOUND, frequency_days: 30, start_date: "2026-05-01" }, as: IntakeCoordinator, captures: { prog_b: $.data.id } }
          trigger:
            - { call: "POST /api/resupply-programs/${prog_a}/confirm-cycle", payload: {}, as: Patient, as_user_id: "${pt_a}", captures: { ord_a: $.data.id } }
            - { call: "POST /api/resupply-programs/${prog_b}/confirm-cycle", payload: {}, as: Patient, as_user_id: "${pt_b}", captures: { ord_b: $.data.id } }
            - { call: "GET /api/orders/${ord_a}/lines", payload: {}, as: IntakeCoordinator, captures: { qty_a: "$.data[0].quantity" } }
            - { call: "GET /api/orders/${ord_b}/lines", payload: {}, as: IntakeCoordinator, captures: { qty_b: "$.data[0].quantity" } }
          assert:
            - "order ${ord_a} line quantity == 30 (min(20x3=60, item 30, PA 45) binds at item cap)"
            - "order ${ord_b} line quantity == 20 (min(20x1=20, item 30, PA 45) binds at Rx cap)"
            - "SupplyOrder.${ord_a}.fulfillment_status == SUBMITTED and origin == PROGRAM_CYCLE"

      - name: line_rounding_order_pinned_mode_b
        grounds:
          - calculations.unit_allowance_proration
          - entities.OrderLine.fields.line_allowed_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters - the scaffold pins
          per-unit-first rounding: round_half_up(999/8, 2) = 124.88 then
          x 3 = 374.64. The forbidden single-round order
          round_half_up(999 x 3 / 8, 2) would yield 374.63; the test asserts
          374.64, so an implementation using the wrong order fails by 0.01.
        test_recipe:
          setup:
            - "MCR plan; ITM_WND pack_fee 999 pack_size 8 (unit 124.88), retail 650, max 30, requires_pa false here (sibling item config without PA), sizes [4X4], covers MCR"
            - "ACTIVE patient with Rx A6250 monthly 20 and WOUND fit 4X4"
            - "DRAFT manual order exists"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A6250", name: "Wound dressing", category: WOUND, covered_plan_ids: ["${pln_mcr}"], pack_fee_cents: 999, pack_size: 8, retail_price_cents: 650, max_units_per_cycle: 30, requires_pa: false, size_codes: ["4X4"] }, as: PlatformAdmin, captures: { itm_wnd: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat RND", date_of_birth: "1966-12-01", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A6250", prescriber_npi: "1234567890", diagnosis_codes: ["L89.1"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: WOUND, size_code: "4X4", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm_wnd}", size_code: "4X4", quantity: 3, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}", captures: { ln: $.data.id, ln_unit: $.data.unit_allowance_cents, ln_amt: $.data.line_allowed_cents } }
          assert:
            - "OrderLine.${ln}.unit_allowance_cents == 124.88 (round_half_up(999/8, 2))"
            - "OrderLine.${ln}.line_allowed_cents == 374.64 (124.88 x 3; NOT 374.63 from single-round ordering)"

  # =================================================================
  # Rule 3 - non_linear_state_machine (different entities)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: prior_auth_denial_appeal_cycle
        grounds:
          - state_machines.PriorAuthorization.DENIED_to_APPEALED
          - state_machines.PriorAuthorization.APPEALED_to_DENIED
          - state_machines.PriorAuthorization.APPEALED_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on PriorAuthorization: SUBMITTED -> DENIED -> APPEALED
          -> DENIED -> APPEALED -> APPROVED traverses the cycle twice; the
          sibling instance's non-linearity is a parallel-dimensions machine on
          a different entity (SupplyOrder), not a cycle.
        test_recipe:
          setup:
            - "MCR plan; ACTIVE patient"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat PA", date_of_birth: "1959-02-14", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "POST /api/prior-authorizations", payload: { patient_id: "${pt}", hcpcs_code: "A6250", approved_units: 45, valid_from: "2026-05-01", valid_to: "2026-08-31" }, as: PriorAuthSpecialist, captures: { pa: $.data.id } }
          trigger:
            - { call: "POST /api/prior-authorizations/${pa}/decision", payload: { outcome: DENIED }, as: PriorAuthSpecialist }
            - { call: "POST /api/prior-authorizations/${pa}/appeal", payload: {}, as: PriorAuthSpecialist }
            - { call: "POST /api/prior-authorizations/${pa}/decision", payload: { outcome: DENIED }, as: PriorAuthSpecialist }
            - { call: "POST /api/prior-authorizations/${pa}/appeal", payload: {}, as: PriorAuthSpecialist }
            - { call: "POST /api/prior-authorizations/${pa}/decision", payload: { outcome: APPROVED }, as: PriorAuthSpecialist, captures: { st: $.data.status, ac: $.data.appeal_count, ver: $.data.version } }
          assert:
            - "PriorAuthorization.${pa}.status == APPROVED after two full DENIED -> APPEALED loops"
            - "PriorAuthorization.${pa}.appeal_count == 2"
            - "PriorAuthorization.${pa}.version == 6 (create + 5 transitions)"

      - name: order_parallel_fulfillment_billing_dimensions
        grounds:
          - state_machines.SupplyOrder
          - entities.SupplyOrder.fields.fulfillment_status
          - entities.SupplyOrder.fields.billing_status
        distinguishing_aspect: |
          Parallel state dimensions on SupplyOrder: fulfillment_status reaches
          terminal FULFILLED and never moves again while billing_status
          independently walks CLAIM_DRAFT -> CLAIM_SUBMITTED -> CLAIM_DENIED ->
          APPEAL_PENDING -> PAID_SETTLED. The sibling instance is a cycle on
          PriorAuthorization, a different non-linear shape on a different entity.
        test_recipe:
          setup:
            - "MCR plan; ITM_OST no-PA, stock 500; ACTIVE patient with Rx A4419 and fit 45MM; order qty 10 submitted, shipped, DELIVERED (fulfillment FULFILLED)"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln_mcr}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm_ost: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm_ost}", on_hand_qty: 500 }, as: PlatformAdmin }
            - { call: "POST /api/patients", payload: { full_name: "Pat PAR", date_of_birth: "1970-06-06", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm_ost}", size_code: "45MM", quantity: 10, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/orders/${ord}/submit", payload: {}, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/shipments", payload: { order_id: "${ord}" }, as: FulfillmentAgent, captures: { shp: $.data.id } }
            - { call: "POST /api/shipments/${shp}/release", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp}/ship", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp}/deliver", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/claims", payload: { order_id: "${ord}" }, as: BillingSpecialist, captures: { clm: $.data.id } }
            - { call: "POST /api/claims/${clm}/submit", payload: {}, as: BillingSpecialist }
          trigger:
            - { call: "POST /api/claims/${clm}/adjudicate", payload: { outcome: DENIED }, as: BillingSpecialist }
            - { call: "GET /api/orders/${ord}", payload: {}, as: BillingSpecialist, captures: { ful1: $.data.fulfillment_status, bil1: $.data.billing_status } }
            - { call: "POST /api/claims/${clm}/appeal", payload: {}, as: BillingSpecialist }
            - { call: "POST /api/claims/${clm}/adjudicate", payload: { outcome: PAID }, as: BillingSpecialist }
            - { call: "GET /api/orders/${ord}", payload: {}, as: BillingSpecialist, captures: { ful2: $.data.fulfillment_status, bil2: $.data.billing_status } }
          assert:
            - "SupplyOrder.${ord}.fulfillment_status == FULFILLED at every observation (never leaves FULFILLED)"
            - "billing_status walked CLAIM_DENIED after first denial, then PAID_SETTLED after appeal + PAID"
            - "Claim.${clm}.status == PAID and Claim.${clm}.insurer_paid_cents == 1480.00"

  # =================================================================
  # Rule 4 - transitive_cascade (different triggers; depths 3 and 2)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: denial_final_hsa_floor_cascade
        grounds:
          - state_machines.Claim.APPEALED_to_DENIED_FINAL
          - calculations.claim_patient_responsibility
          - calculations.hsa_balance
        distinguishing_aspect: |
          Depth-3 cascade triggered by claim adjudication: Claim APPEALED ->
          DENIED_FINAL (A) mutates SupplyOrder.billing_status -> PATIENT_BILLED
          (B); the billing mutation posts an HSA DEBIT of 1850.00 (C); the
          debit drives balance 2000 -> 150 < REORDER_FLOOR_CENTS 500,
          which itself suspends the patient's ACTIVE ResupplyProgram (D). The
          sibling cascade starts from a different trigger (shipment return).
        test_recipe:
          setup:
            - "MCR plan; ITM_OST no-PA, stock 500; ACTIVE patient (HSA 2000.00 cents) with Rx A4419 and fit 45MM"
            - "ACTIVE ResupplyProgram (INCONTINENCE, never confirmed)"
            - "Order qty 10 DELIVERED; claim created, submitted, DENIED once, APPEALED"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln_mcr}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm_ost: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm_ost}", on_hand_qty: 500 }, as: PlatformAdmin }
            - { call: "POST /api/patients", payload: { full_name: "Pat CASC", date_of_birth: "1957-04-22", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 2000 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/resupply-programs", payload: { patient_id: "${pt}", category: INCONTINENCE, frequency_days: 30, start_date: "2026-05-01" }, as: IntakeCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm_ost}", size_code: "45MM", quantity: 10, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/orders/${ord}/submit", payload: {}, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/shipments", payload: { order_id: "${ord}" }, as: FulfillmentAgent, captures: { shp: $.data.id } }
            - { call: "POST /api/shipments/${shp}/release", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp}/ship", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp}/deliver", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/claims", payload: { order_id: "${ord}" }, as: BillingSpecialist, captures: { clm: $.data.id } }
            - { call: "POST /api/claims/${clm}/submit", payload: {}, as: BillingSpecialist }
            - { call: "POST /api/claims/${clm}/adjudicate", payload: { outcome: DENIED }, as: BillingSpecialist }
            - { call: "POST /api/claims/${clm}/appeal", payload: {}, as: BillingSpecialist }
            - { call: "GET /api/patients/${pt}/hsa-accounts", payload: {}, as: BillingSpecialist, captures: { hsa: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/claims/${clm}/adjudicate", payload: { outcome: DENIED }, as: BillingSpecialist, captures: { cst: $.data.status, cresp: $.data.patient_resp_cents } }
            - { call: "GET /api/hsa-accounts/${hsa}", payload: {}, as: BillingSpecialist, captures: { bal: $.data.balance_cents } }
            - { call: "GET /api/resupply-programs/${prog}", payload: {}, as: IntakeCoordinator, captures: { pst: $.data.status, preason: $.data.suspend_reason } }
            - { call: "GET /api/orders/${ord}", payload: {}, as: BillingSpecialist, captures: { bil: $.data.billing_status } }
          assert:
            - "Claim.${clm}.status == DENIED_FINAL"
            - "Claim.${clm}.patient_resp_cents == 1850.00 (full allowed amount shifts to patient)"
            - "SupplyOrder.${ord}.billing_status == PATIENT_BILLED"
            - "HSAAccount.${hsa}.balance_cents == 150 (2000 - 1850 debit posted by the cascade)"
            - "ResupplyProgram.${prog}.status == SUSPENDED and suspend_reason == HSA_FLOOR_BREACH (150.00 < 500 floor)"

      - name: return_adherence_suspend_cascade
        grounds:
          - state_machines.Shipment.SHIPPED_to_RETURNED
          - calculations.adherence_scores
        distinguishing_aspect: |
          Depth-2 cascade triggered by shipment return (different trigger from
          the claim-adjudication cascade): Shipment SHIPPED -> RETURNED (A)
          forces adherence recompute on the ResupplyProgram (B: final drops to
          0.33 with 3 due, 1 delivered, 1 returned), and that recompute itself
          drives the program to SUSPENDED (C) because final < 0.50.
        test_recipe:
          setup:
            - "MCR plan; ITM_OST no-PA, stock 500; ACTIVE patient with Rx A4419, fit 45MM"
            - "Program OSTOMY freq 30 start 2026-05-01; cycle 1 DELIVERED 2026-05-03; cycle 2 SHIPPED 2026-06-04; clock at 2026-07-15 (3 cycles due)"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln_mcr}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm_ost: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm_ost}", on_hand_qty: 500 }, as: PlatformAdmin }
            - { call: "POST /api/patients", payload: { full_name: "Pat RET", date_of_birth: "1963-08-08", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/resupply-programs", payload: { patient_id: "${pt}", category: OSTOMY, frequency_days: 30, start_date: "2026-05-01" }, as: IntakeCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /api/resupply-programs/${prog}/confirm-cycle", payload: {}, as: Patient, as_user_id: "${pt}", captures: { ord1: $.data.id } }
            - { call: "POST /api/shipments", payload: { order_id: "${ord1}" }, as: FulfillmentAgent, captures: { shp1: $.data.id } }
            - { call: "POST /api/shipments/${shp1}/release", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp1}/ship", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shipments/${shp1}/deliver", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/resupply-programs/${prog}/confirm-cycle", payload: {}, as: Patient, as_user_id: "${pt}", captures: { ord2: $.data.id } }
            - { call: "POST /api/shipments", payload: { order_id: "${ord2}" }, as: FulfillmentAgent, captures: { shp2: $.data.id } }
            - { call: "POST /api/shipments/${shp2}/release", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shipments/${shp2}/ship", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/shipments/${shp2}/return", payload: {}, as: FulfillmentAgent, captures: { sst: $.data.status } }
            - { call: "GET /api/resupply-programs/${prog}", payload: {}, as: IntakeCoordinator, captures: { pst: $.data.status, pfin: $.data.adherence_score_final, preason: $.data.suspend_reason } }
          assert:
            - "Shipment.${shp2}.status == RETURNED"
            - "ResupplyProgram.${prog}.adherence_score_final == 0.33 (1 delivered / 3 due; returned cycle is non-adherent)"
            - "ResupplyProgram.${prog}.status == SUSPENDED with suspend_reason == LOW_ADHERENCE (cascade from the recompute, not from the return directly)"

  # =================================================================
  # Rule 5 - priority_pair_validation_conflict (different category pairs)
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_cancelled_order_submit
        grounds:
          - validations[priority=4]
          - validations[priority=8]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): submitting a CANCELLED order
          whose CASH_HSA estimated responsibility (3000.00) also exceeds the HSA
          balance (100.00) must return the priority-4 state error
          ERR_ORDER_NOT_DRAFT, never the priority-8 ERR_INSUFFICIENT_HSA.
        test_recipe:
          setup:
            - "CASH plan; ITM_OST covers it (retail 300); ACTIVE patient with HSA balance 100 cents, Rx A4419, fit 45MM"
            - "Order with one line qty 10 (est. responsibility 3000 cents > 100 cents), then cancelled while DRAFT"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Self-Pay HSA", plan_type: CASH_HSA, coinsurance_pct: 1.00, cycle_months: 1, is_active: true }, as: PlatformAdmin, captures: { pln_cash: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln_cash}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm_ost: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat PR1", date_of_birth: "1982-11-11", payer_plan_id: "${pln_cash}", hsa_initial_credit_cents: 100 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm_ost}", size_code: "45MM", quantity: 10, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/orders/${ord}/cancel", payload: {}, as: Patient, as_user_id: "${pt}" }
          trigger:
            - { call: "POST /api/orders/${ord}/submit", payload: {}, as: Patient, as_user_id: "${pt}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_NOT_DRAFT (priority 4 state beats priority 8 business_fiscal)"
            - "SupplyOrder.${ord}.fulfillment_status == CANCELLED (unchanged; no side effects fired)"

      - name: safety_vs_constraint_on_line_add
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: |
          Category pair (business_safety, business_constraint) - different pair
          from the sibling's (state, business_fiscal): adding a line with no
          covering Prescription (safety) AND a missing/mismatched fit profile
          (constraint) must return ERR_NO_VALID_PRESCRIPTION, never
          ERR_SIZE_MISMATCH.
        test_recipe:
          setup:
            - "MCR plan; ITM_WND covers it; ACTIVE patient with NO Rx for A6250 and NO WOUND fit profile"
            - "DRAFT manual order exists"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A6250", name: "Wound dressing", category: WOUND, covered_plan_ids: ["${pln_mcr}"], pack_fee_cents: 999, pack_size: 8, retail_price_cents: 650, max_units_per_cycle: 30, requires_pa: false, size_codes: ["4X4"] }, as: PlatformAdmin, captures: { itm_wnd: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat PR2", date_of_birth: "1971-03-15", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm_wnd}", size_code: "4X4", quantity: 1, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_VALID_PRESCRIPTION (priority 5 business_safety beats priority 6 business_constraint)"
            - "no OrderLine created (order still has zero lines)"

  # =================================================================
  # Rule 6 - boundary_precision_check (different metrics, endpoints)
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: resupply_window_exact_day_boundary
        grounds:
          - calculations.next_eligible_date
          - validations[priority=7]
        distinguishing_aspect: |
          Metric: days. confirm-cycle uses >=: at clock exactly equal to
          next_eligible_date (2026-06-02) the confirm succeeds, while one day
          earlier (2026-06-01) fails with ERR_RESUPPLY_WINDOW_NOT_OPEN.
