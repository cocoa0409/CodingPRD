  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bill_billing_period_overlap_closed_interval
        grounds:
          - validations[priority=5.1]
          - errors[ERR_BILLING_PERIOD_OVERLAP]
          - entities.Bill.fields.from_read_id
          - entities.Bill.fields.to_read_id
        distinguishing_aspect: |
          CLOSED read-date interval on the PremiseMeter resource: a second bill whose window
          [2026-02-15, 2026-03-15] touches/overlaps the first bill's window [2026-01-15, 2026-02-15] on
          the same meter (shared endpoint 2026-02-15 collides) is rejected ERR_BILLING_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "RES account, SET meter, three reads at 2026-01-15, 2026-02-15, 2026-03-15; one bill already created/issued for window [r1,r2]."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-20T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-O1", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /pga-schedules"
              payload: { effective_month: "2026-02", customer_class: "RESIDENTIAL", commodity_rate_cents_per_therm: 40, supplier_refund_cents_per_therm: 5 }
              as: BillingAdmin
            - call: "POST /pga-schedules"
