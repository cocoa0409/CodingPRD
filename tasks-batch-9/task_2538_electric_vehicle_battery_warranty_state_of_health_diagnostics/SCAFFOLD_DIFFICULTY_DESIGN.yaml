            - "SohAssessment.${asm1_id}.superseded == true after A2 is created"
            - "SohAssessment.${asm2_id}.superseded == false"
            - "SohAssessment.${asm2_id}.retention_pct == 70.00  # faulting modules does not move the TELEMATICS basis"
            - "the first resubmit returns 200; WarrantyClaim.${claim_id}.adjudication_status == SUBMITTED"
            - "WarrantyClaim.${claim_id}.assessment_id == ${asm2_id}"
            - "WarrantyClaim.${claim_id}.recommended_remedy == PACK_REPLACEMENT  # was MODULE_REPLACEMENT before the cycle"
            - "WarrantyClaim.${claim_id}.recommendation_basis == MODULE_ALLOWANCE"
            - "WarrantyClaim.${claim_id}.info_request_round == 1 immediately after the first resubmit  # the cycle does not reset the counter"
            - "the second request-info returns 200 with info_request_round == 2"
            - "the second resubmit returns 200 with adjudication_status == SUBMITTED and info_request_round == 2"
            - "the third request-info returns 409 ERR_INFO_REQUEST_LIMIT_EXCEEDED even though adjudication_status is SUBMITTED"
            - "WarrantyClaim.${claim_id}.adjudication_status == SUBMITTED and info_request_round == 2 after the refused third request"

      - name: thermal_event_parallel_containment_and_notification_dimensions
        entity: ThermalEvent
        shape: parallel
        grounds:
          - state_machines.ThermalEvent.DETECTED_to_ISOLATED
          - state_machines.ThermalEvent.ISOLATED_to_PACK_QUARANTINED
          - state_machines.ThermalEvent.PACK_QUARANTINED_to_CONTAINMENT_CLOSED
          - state_machines.ThermalEvent.PENDING_to_FILED
          - calculations.regulatory_notification_deadline
          - entities.ThermalEvent.fields.event_status
          - validations[priority=24]
        distinguishing_aspect: |
          A different entity from the claim cycle, and a different non-linearity: the containment and
          regulatory dimensions advance independently, yet the closing containment step is GATED on
          the other dimension - step 3 is refused with ERR_NOTIFICATION_STILL_PENDING while
          notification_status is PENDING and succeeds unchanged after the filing, and only then does
          the derived event_status flip from OPEN to COMPLETE.
        test_recipe:
          setup:
            - "Default logical clock 2026-08-01T00:00:00Z; an S3 event detected 2026-07-30T00:00:00Z therefore has notification_deadline_at = detected_at + 72 h = 2026-08-02T00:00:00Z and is still filable on time."
            - "One vehicle with its pack installed and an L3 technician who can run the containment steps."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center", hv_certification_level: "L3", has_pack_lift: true }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/service-centers/${center_id}/technicians"
              payload: { full_name: "Tech A" }
              as: ProgramAdmin
              captures: { tech_a_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000009", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-0009", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "POST /battery-warranty/thermal-events"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", severity: "S3", detected_at: "2026-07-30T00:00:00Z", source: "TELEMATICS", affected_module_positions: [4] }
              as: TelematicsGateway
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /battery-warranty/thermal-events/${event_id}/containment-step"
              payload: { step_index: 1, step_note: "HV isolated" }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
            - call: "POST /battery-warranty/thermal-events/${event_id}/containment-step"
              payload: { step_index: 3, step_note: "premature close" }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
            - call: "POST /battery-warranty/thermal-events/${event_id}/containment-step"
              payload: { step_index: 2, step_note: "pack quarantined" }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
            - call: "POST /battery-warranty/thermal-events/${event_id}/containment-step"
              payload: { step_index: 3, step_note: "close attempt before filing" }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
            - call: "POST /battery-warranty/thermal-events/${event_id}/regulatory-notification"
              payload: { reporting_service_center_id: "${center_id}", regulator_reference: "NHTSA-2026-0091" }
              as: RegulatoryLiaison
              as_user_id: "reg-001"
            - call: "POST /battery-warranty/thermal-events/${event_id}/containment-step"
              payload: { step_index: 3, step_note: "containment closed" }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
          assert:
            - "at creation ThermalEvent.${event_id}.containment_status == DETECTED and notification_status == PENDING"
            - "ThermalEvent.${event_id}.notification_deadline_at == 2026-08-02T00:00:00Z"
            - "BatteryPack.${pack_id}.status == QUARANTINED and damaged_defective == true and hazmat_classification == UN3536 at creation"
            - "Vehicle.${veh_id}.status == IMMOBILIZED and warranty_hold == true at creation"
            - "step_index 1 returns 200: containment_status == ISOLATED, containment_steps_completed == 1"
            - "the out-of-order step_index 3 returns 409 ERR_CONTAINMENT_STEP_OUT_OF_ORDER and leaves containment_steps_completed == 1"
            - "step_index 2 returns 200: containment_status == PACK_QUARANTINED, containment_steps_completed == 2"
            - "the in-order step_index 3 BEFORE the filing returns 409 ERR_NOTIFICATION_STILL_PENDING and leaves containment_steps_completed == 2"
            - "the regulatory filing returns 200: notification_status == FILED, notification_filed_at == 2026-08-01T00:00:00Z, regulator_reference == NHTSA-2026-0091, reporting_service_center_id == ${center_id}"
            - "ServiceCenter.${center_id}.late_notification_count == 0 and compliance_score == 100  # filed inside the window"
            - "ThermalEvent.${event_id}.event_status == OPEN while containment_status was still PACK_QUARANTINED even though the notification dimension had settled"
            - "the repeated in-order step_index 3 AFTER the filing returns 200: containment_status == CONTAINMENT_CLOSED, containment_steps_completed == 3"
            - "ThermalEvent.${event_id}.event_status == COMPLETE only after BOTH dimensions are terminal"

  - rule_id: transitive_cascade
    instances:
      - name: s4_thermal_event_cascades_pack_to_vehicle_to_consents_to_campaign_closure
        depth: 4
        trigger_kind: "POST /battery-warranty/thermal-events (severity S4)"
        grounds:
          - state_machines.BatteryPack.IN_SERVICE_to_QUARANTINED
          - state_machines.Vehicle.ACTIVE_to_IMMOBILIZED
          - state_machines.RemediationConsent.PENDING_to_EXPIRED
          - state_machines.RemediationCampaign.LIMITED_RELEASE_to_CLOSED
          - entities.RemediationCampaign.fields.open_consent_count
          - entities.Vehicle.fields.warranty_hold
        distinguishing_aspect: |
          A single POST propagates four causally-chained links across four different entities -
          pack QUARANTINED because the event is S4, vehicle IMMOBILIZED because its installed pack
          left service, the consent EXPIRED because its vehicle became immobilized, and the campaign
          auto-CLOSED because that expiry emptied its open-consent set - and the chain only reaches
          link 4 because the campaign targets CHARGING rather than THERMAL_MANAGEMENT, which would
          have diverted it to SUSPENDED (a state that never auto-closes).
        test_recipe:
          setup:
            - "One vehicle (model MX-90, region US-WEST) with its NEW pack installed, so the pack is IN_SERVICE and the vehicle ACTIVE."
            - "A CHARGING campaign targeting MX-90 with applies_to_pack_type ANY and pilot_region_codes [US-WEST], released LIMITED, which solicits exactly one PENDING consent - the only eligible vehicle - so solicited_consent_count == 1 and open_consent_count == 1."
            - "No other vehicle exists, so the campaign's open set has exactly one member and reaching 0 is observable."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center" }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/service-centers/${center_id}/technicians"
              payload: { full_name: "Tech A" }
              as: ProgramAdmin
              captures: { tech_a_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000011", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10", model_code: "MX-90", region_code: "US-WEST" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-0011", pack_type: "NEW", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "POST /battery-warranty/remediation-campaigns"
