# §1.9 Scaffold Corner Design - breadth probe for task 2841
# Extended School Year & Compensatory Services.
# Walked row-by-row against references/claim-extraction-guide.md over this
# scaffold's §1.1-§1.7 surface. Corners already asserted by a
# SCAFFOLD_DIFFICULTY_DESIGN.yaml instance carry an `excluded_because:` stub.
scaffold_corner_design:
  - section: entities
    instances:
      - name: student_creation_populates_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.Student
          - endpoints.POST_/esy/students
          - entities.Student.fields.esy_eligibility_status
          - entities.Student.fields.pending_award_minutes
          - entities.Student.fields.stay_put_active
        distinguishing_aspect: "A freshly created Student returns 201 with every declared computed field at its documented default (esy_eligibility_status NOT_DETERMINED, four minute counters 0/0/0, both booleans false) and version == 1."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2027-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
          trigger:
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, home_school_code: "MS-014", transportation_required: true }
              as: CaseManager
              captures: { s1_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Student.${s1_id}.student_number == \"S-2841-001\""
            - "Student.${s1_id}.grade_band == MS_6_8"
            - "Student.${s1_id}.primary_disability == AUTISM"
            - "Student.${s1_id}.iep_weekly_minutes_total == 250"
            - "Student.${s1_id}.transportation_required == true"
            - "Student.${s1_id}.esy_eligibility_status == NOT_DETERMINED"
            - "Student.${s1_id}.pending_award_minutes == 0"
            - "Student.${s1_id}.outstanding_owed_minutes == 0"
            - "Student.${s1_id}.delivered_makeup_minutes_total == 0"
            - "Student.${s1_id}.esy_service_alert == false"
            - "Student.${s1_id}.stay_put_active == false"
            - "Student.${s1_id}.version == 1"

      - name: student_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Student
          - endpoints.GET_/esy/students/{student_id}
        distinguishing_aspect: "GET /esy/students/{student_id} returns the same id, student_number and iep_weekly_minutes_total the create call returned, and does not bump version."
        test_recipe:
          setup:
            - "One Student row created via POST /esy/students; no other write since."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, home_school_code: "MS-014", transportation_required: true }
              as: CaseManager
              captures: { s1_id: $.data.id, s1_v: $.data.version }
          trigger:
            - call: "GET /esy/students/${s1_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 200"
            - "response.data.id == ${s1_id}"
            - "Student.${s1_id}.student_number == \"S-2841-001\""
            - "Student.${s1_id}.home_school_code == \"MS-014\""
            - "Student.${s1_id}.iep_weekly_minutes_total == 250"
            - "Student.${s1_id}.version == ${s1_v}"

      - name: transportation_run_listing_paginates_with_limit_and_offset
        claim_type: listing
        grounds:
          - entities.TransportationRun
          - endpoints.GET_/esy/programs/{id}/transportation-runs
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three runs under one program, limit=2&offset=0 returns 2 rows with total_count == 3 and has_more == true, and limit=2&offset=2 returns 1 row with has_more == false."
        test_recipe:
          setup:
            - "One PLANNING EsyProgram with three SCHEDULED TransportationRun rows on three distinct instructional dates, created in route order R1, R2, R3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /esy/transportation-runs"
              payload: { program_id: "${p1_id}", route_code: "R1", service_date: "2027-06-14", window_start_time: "07:00", window_end_time: "07:45", vehicle_capacity_seats: 12 }
              as: ProgramCoordinator
              captures: { run1_id: $.data.id }
            - call: "POST /esy/transportation-runs"
              payload: { program_id: "${p1_id}", route_code: "R2", service_date: "2027-06-15", window_start_time: "07:00", window_end_time: "07:45", vehicle_capacity_seats: 12 }
              as: ProgramCoordinator
              captures: { run2_id: $.data.id }
            - call: "POST /esy/transportation-runs"
              payload: { program_id: "${p1_id}", route_code: "R3", service_date: "2027-06-16", window_start_time: "07:00", window_end_time: "07:45", vehicle_capacity_seats: 12 }
              as: ProgramCoordinator
              captures: { run3_id: $.data.id }
          trigger:
            - call: "GET /esy/programs/${p1_id}/transportation-runs"
              payload: { limit: 2, offset: 0 }
              as: CaseManager
            - call: "GET /esy/programs/${p1_id}/transportation-runs"
              payload: { limit: 2, offset: 2 }
              as: CaseManager
          assert:
            - "First trigger: HTTP 200 and response_type == \"array\""
            - "First trigger: response.data length == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "First trigger: response.data[0].id == ${run1_id} and response.data[1].id == ${run2_id} (created_at ASC)"
            - "Second trigger: response.data length == 1, total_count == 3, has_more == false, offset == 2"
            - "Second trigger: response.data[0].id == ${run3_id}"

      - name: student_path_id_unknown_returns_student_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_STUDENT_NOT_FOUND]
          - validations.priority_5_path_not_found
          - endpoints.GET_/esy/students/{student_id}
        distinguishing_aspect: "A syntactically valid but unknown student_id in the path yields ERR_STUDENT_NOT_FOUND with HTTP 404, not 422 and not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
          trigger:
            - call: "GET /esy/students/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CaseManager
          assert:
            - "HTTP 404"
            - "response.data.error_id == ERR_STUDENT_NOT_FOUND"
            - "response.response_type == \"error\""

      - name: program_creation_missing_required_instructional_weekdays_rejected
        claim_type: required_fields
        grounds:
          - entities.EsyProgram.fields.instructional_weekdays
          - validations.priority_7_ERR_INVALID_REQUEST
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/esy/programs
        distinguishing_aspect: "Omitting instructional_weekdays - an input field with no declared default - returns ERR_INVALID_REQUEST 422 and persists no EsyProgram row."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", daily_minutes_cap: 90 }
              as: ProgramCoordinator
          assert:
            - "HTTP 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "No EsyProgram row exists (a later GET /esy/programs/{any id} cannot resolve; the create returned no id)"

      - name: program_and_student_omitted_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.EsyProgram.fields.blackout_dates
          - entities.EsyProgram.fields.cancelled_dates
          - entities.Student.fields.transportation_required
          - endpoints.POST_/esy/programs
          - endpoints.POST_/esy/students
        distinguishing_aspect: "Omitting blackout_dates yields [] (and cancelled_dates [] as a system field), and omitting transportation_required yields false - the declared defaults, not null."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027 No Blackouts", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90 }
              as: ProgramCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-002", first_name: "Ben", last_name: "Okafor", grade_band: "MS_6_8", primary_disability: "SPECIFIC_LEARNING_DISABILITY", iep_weekly_minutes_total: 250, home_school_code: "MS-014" }
              as: CaseManager
              captures: { s2_id: $.data.id }
          assert:
            - "Both triggers: HTTP 201"
            - "EsyProgram.${p2_id}.blackout_dates == []"
            - "EsyProgram.${p2_id}.cancelled_dates == []"
            - "EsyProgram.${p2_id}.instructional_days_count == 24"
            - "EsyProgram.${p2_id}.instructional_week_count == 6"
            - "EsyProgram.${p2_id}.status == PLANNING"
            - "Student.${s2_id}.transportation_required == false"

      - name: commitment_computed_minute_fields_ignore_client_supplied_values
        claim_type: computed_fields
        grounds:
          - entities.ServiceCommitment.fields.planned_total_minutes
          - entities.ServiceCommitment.fields.weekly_minutes_committed
          - entities.ServiceCommitment.fields.daily_minutes
          - calculations.esy_service_minutes_plan
        excluded_because:
          difficulty_instance: combinatorial_formula / minute_plan_round_per_week_then_sum_beats_sum_then_round
          rationale: "That instance pins planned_total_minutes == 1376, weekly_minutes_committed == 229 and daily_minutes == 57 from iep_weekly_minutes alone, which is exactly the computed-field claim: the three minute fields are server-derived and no client value participates."

      - name: student_and_program_type_constraint_violations_rejected
        claim_type: type_constraints
        grounds:
          - entities.Student.fields.grade_band
          - entities.Student.fields.iep_weekly_minutes_total
          - entities.EsyProgram.fields.session_end_date
          - validations.priority_7_ERR_INVALID_REQUEST
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An out-of-enum grade_band, an iep_weekly_minutes_total of 0 (below the declared 1..3000 range) and a session_end_date before session_start_date each return ERR_INVALID_REQUEST 422."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
          trigger:
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-090", first_name: "Ada", last_name: "Reyes", grade_band: "GRADE_7", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, home_school_code: "MS-014" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-091", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 0, home_school_code: "MS-014" }
              as: CaseManager
            - call: "POST /esy/programs"
              payload: { name: "Backwards Session", school_year: "2026-2027", session_start_date: "2027-07-23", session_end_date: "2027-06-14", instructional_weekdays: ["MON"], daily_minutes_cap: 90 }
              as: ProgramCoordinator
          assert:
            - "Trigger 1: HTTP 422 and response.data.error_id == ERR_INVALID_REQUEST (grade_band outside PRE_K|K_5|MS_6_8|HS_9_12)"
            - "Trigger 2: HTTP 422 and response.data.error_id == ERR_INVALID_REQUEST (iep_weekly_minutes_total below the 1..3000 range)"
            - "Trigger 3: HTTP 422 and response.data.error_id == ERR_INVALID_REQUEST (session_end_date < session_start_date)"

      - name: commitment_creation_with_unknown_program_id_returns_404
        claim_type: parent_relationships
        grounds:
          - entities.ServiceCommitment.fields.program_id
          - errors[ERR_PROGRAM_NOT_FOUND]
          - validations.priority_6_body_fk_not_found
          - endpoints.POST_/esy/service-commitments
        distinguishing_aspect: "A body foreign key that resolves to no EsyProgram returns ERR_PROGRAM_NOT_FOUND 404 and is checked before the priority-21 eligibility rule, even though the referenced Student is not ESY-eligible either."
        test_recipe:
          setup:
            - "One Student with esy_eligibility_status NOT_DETERMINED; no EsyProgram rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-002", first_name: "Ben", last_name: "Okafor", grade_band: "MS_6_8", primary_disability: "SPECIFIC_LEARNING_DISABILITY", iep_weekly_minutes_total: 250, home_school_code: "MS-014" }
              as: CaseManager
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /esy/service-commitments"
              payload: { program_id: "00000000-0000-0000-0000-000000000000", student_id: "${s2_id}", service_type: "SPECIALIZED_INSTRUCTION", iep_weekly_minutes: 250, staffing_ratio: "ONE_TO_THREE" }
              as: CaseManager
          assert:
            - "HTTP 404"
            - "response.data.error_id == ERR_PROGRAM_NOT_FOUND"
            - "response.data.error_id != ERR_STUDENT_NOT_ESY_ELIGIBLE (priority 6 precedes priority 21)"
            - "Student.${s2_id}.pending_award_minutes == 0"

      - name: provider_creation_stamps_system_fields_and_initial_version
        claim_type: system_fields
        grounds:
          - entities.Provider
          - entities.Provider.fields.status
          - entities.Provider.fields.assigned_weekly_minutes
          - endpoints.POST_/esy/providers
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted on POST /esy/providers - version == 1, status == ACTIVE and assigned_weekly_minutes == 0 despite none of them being accepted as input."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock pinned to 2027-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /esy/providers"
              payload: { full_name: "Nina Torres", role_type: "SPED_TEACHER", credential_expires_on: "2028-06-30", rate_cents_per_minute: 150, max_weekly_minutes: 1200 }
              as: ProgramCoordinator
              captures: { pr1_id: $.data.id, pr1_created: $.data.created_at }
          assert:
            - "HTTP 201"
            - "Provider.${pr1_id}.id is a non-empty server-generated string"
            - "Provider.${pr1_id}.created_at == \"2027-06-01T00:00:00Z\" and updated_at == \"2027-06-01T00:00:00Z\""
            - "Provider.${pr1_id}.version == 1"
            - "Provider.${pr1_id}.status == ACTIVE"
            - "Provider.${pr1_id}.assigned_weekly_minutes == 0"
            - "Provider.${pr1_id}.rate_cents_per_minute == 150"

  - section: state_machines
    instances:
      - name: staffing_lock_requires_at_least_one_assigned_commitment
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EsyProgram.PLANNING_to_STAFFING_LOCKED
          - validations.priority_9_ERR_INVALID_STATE
          - entities.ServiceCommitment.fields.status
          - endpoints.POST_/esy/programs/{program_id}/status
        distinguishing_aspect: "With one PLANNED commitment and zero ProviderAssignment rows the PLANNING -> STAFFING_LOCKED transition returns ERR_INVALID_STATE 409 and leaves status PLANNING; after the first ACTIVE assignment flips the commitment to ASSIGNED the identical call returns 200."
        test_recipe:
          setup:
            - "Clock 2027-06-01T00:00:00Z; Student S1 ELIGIBLE via a FINALIZED PROBE_BASED determination; PLANNING program P1 with one OPEN federal FundAllocation, one ACTIVE Provider and one PLANNED ServiceCommitment carrying no assignment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, home_school_code: "MS-014", transportation_required: true }
              as: CaseManager
              captures: { s1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s1_id}", school_year: "2026-2027", analysis_variant: "PROBE_BASED", skill_probes: [{ skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "MATH_COMPUTATION", pre_break_mastery_pct: 100, post_break_mastery_pct: 74, recoupment_days_observed: 22, trials_count: 4 }] }
              as: CaseManager
              captures: { d1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations/${d1_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/eligibility-determinations/${d1_id}/parent-response"
              payload: { response: "AGREE" }
              as: ParentGuardian
              as_user_id: "${s1_id}"
            - call: "POST /esy/eligibility-determinations/${d1_id}/finalize"
              payload: {}
              as: SpedDirector
              as_user_id: "dir-001"
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /esy/fund-allocations"
              payload: { program_id: "${p1_id}", fund_source: "IDEA_611_FEDERAL", budget_code: "611-ESY-01", authorized_amount_cents: 25000000 }
              as: SpedDirector
              captures: { f1_id: $.data.id }
            - call: "POST /esy/providers"
              payload: { full_name: "Nina Torres", role_type: "SPED_TEACHER", credential_expires_on: "2028-06-30", rate_cents_per_minute: 150, max_weekly_minutes: 1200 }
              as: ProgramCoordinator
              captures: { pr1_id: $.data.id }
            - call: "POST /esy/service-commitments"
              payload: { program_id: "${p1_id}", student_id: "${s1_id}", service_type: "SPECIALIZED_INSTRUCTION", iep_weekly_minutes: 250, staffing_ratio: "ONE_TO_THREE" }
              as: CaseManager
              captures: { c1_id: $.data.id, c1_v: $.data.version }
          trigger:
            - call: "POST /esy/programs/${p1_id}/status"
              payload: { target_status: "STAFFING_LOCKED" }
              as: ProgramCoordinator
            - call: "POST /esy/provider-assignments"
              payload: { commitment_id: "${c1_id}", provider_id: "${pr1_id}", weekday: "MON", start_time: "09:00", end_time: "10:00", effective_from: "2027-06-14", effective_to: "2027-07-23", covered_weekly_minutes: 229, expected_commitment_version: "${c1_v}" }
              as: ProgramCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /esy/programs/${p1_id}/status"
              payload: { target_status: "STAFFING_LOCKED" }
              as: ProgramCoordinator
          assert:
            - "Trigger 1: HTTP 409 and response.data.error_id == ERR_INVALID_STATE"
            - "After trigger 1: EsyProgram.${p1_id}.status == PLANNING"
            - "Trigger 2: HTTP 201 and ProviderAssignment.${a1_id}.status == ACTIVE"
            - "After trigger 2: ServiceCommitment.${c1_id}.status == ASSIGNED and version == ${c1_v} + 1"
            - "Trigger 3: HTTP 200 and EsyProgram.${p1_id}.status == STAFFING_LOCKED"

      - name: newly_created_rows_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.EsyProgram.initial_state
          - state_machines.ServiceCommitment.initial_state
          - state_machines.TransportationRun.initial_state
          - state_machines.FundAllocation.initial_state
          - state_machines.DueProcessRecord.initial_state
          - state_machines.EligibilityDetermination.initial_state
        distinguishing_aspect: "Six create endpoints stamp exactly the declared initial_state: EsyProgram PLANNING, EligibilityDetermination DRAFT, FundAllocation OPEN, TransportationRun SCHEDULED, ServiceCommitment PLANNED, DueProcessRecord OPEN - none of them accepts status as input."
        test_recipe:
          setup:
            - "Clock 2027-06-01T00:00:00Z; Student S1 made ELIGIBLE by a FINALIZED PROBE_BASED determination so that a ServiceCommitment can be created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, home_school_code: "MS-014", transportation_required: true }
              as: CaseManager
              captures: { s1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s1_id}", school_year: "2026-2027", analysis_variant: "PROBE_BASED", skill_probes: [{ skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "MATH_COMPUTATION", pre_break_mastery_pct: 100, post_break_mastery_pct: 74, recoupment_days_observed: 22, trials_count: 4 }] }
              as: CaseManager
              captures: { d1_id: $.data.id, d1_status: $.data.status }
            - call: "POST /esy/eligibility-determinations/${d1_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/eligibility-determinations/${d1_id}/parent-response"
              payload: { response: "AGREE" }
              as: ParentGuardian
              as_user_id: "${s1_id}"
            - call: "POST /esy/eligibility-determinations/${d1_id}/finalize"
              payload: {}
              as: SpedDirector
              as_user_id: "dir-001"
          trigger:
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              captures: { p1_id: $.data.id, p1_status: $.data.status }
            - call: "POST /esy/fund-allocations"
              payload: { program_id: "${p1_id}", fund_source: "IDEA_611_FEDERAL", budget_code: "611-ESY-01", authorized_amount_cents: 25000000 }
              as: SpedDirector
              captures: { f1_id: $.data.id }
            - call: "POST /esy/transportation-runs"
              payload: { program_id: "${p1_id}", route_code: "R1", service_date: "2027-06-14", window_start_time: "07:00", window_end_time: "07:45", vehicle_capacity_seats: 12 }
              as: ProgramCoordinator
              captures: { run1_id: $.data.id }
            - call: "POST /esy/service-commitments"
              payload: { program_id: "${p1_id}", student_id: "${s1_id}", service_type: "SPECIALIZED_INSTRUCTION", iep_weekly_minutes: 250, staffing_ratio: "ONE_TO_THREE" }
              as: CaseManager
              captures: { c1_id: $.data.id }
            - call: "POST /esy/due-process-records"
              payload: { student_id: "${s1_id}", record_type: "COMPLAINT", filed_on: "2027-06-01", allegation_summary: "Parent alleges ESY minutes were not delivered." }
              as: ComplianceOfficer
              captures: { dp1_id: $.data.id }
          assert:
            - "EligibilityDetermination.${d1_id} was created with status DRAFT (${d1_status} == DRAFT)"
            - "EsyProgram.${p1_id}.status == PLANNING"
            - "FundAllocation.${f1_id}.status == OPEN and available_cents == 25000000"
            - "TransportationRun.${run1_id}.status == SCHEDULED and seats_committed == 0"
            - "ServiceCommitment.${c1_id}.status == PLANNED and delivered_minutes == 0 and compensable_owed_minutes == 0"
            - "DueProcessRecord.${dp1_id}.status == OPEN and resolution_note == null and resolved_at == null"
            - "Student.${s1_id}.stay_put_active == true (the OPEN COMPLAINT raises stay-put)"

      - name: cancel_day_on_a_planning_program_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.EsyProgram.OPEN_to_OPEN
          - validations.priority_9_ERR_INVALID_STATE
          - endpoints.POST_/esy/programs/{program_id}/cancel-day
        distinguishing_aspect: "cancel-day is declared only for the OPEN -> OPEN transition, so invoking it on a PLANNING program returns ERR_INVALID_STATE 409, appends nothing to cancelled_dates and synthesizes no ServiceLog."
        test_recipe:
          setup:
            - "Clock 2027-06-01T00:00:00Z; one PLANNING EsyProgram P1; the target date 2027-06-14 IS an instructional date, so priority 20 cannot fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              captures: { p1_id: $.data.id, p1_v: $.data.version }
          trigger:
            - call: "POST /esy/programs/${p1_id}/cancel-day"
              payload: { service_date: "2027-06-14", cancellation_reason: "WEATHER closure drill" }
              as: ProgramCoordinator
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "EsyProgram.${p1_id}.cancelled_dates == []"
            - "EsyProgram.${p1_id}.instructional_days_count == 22"
            - "EsyProgram.${p1_id}.status == PLANNING and version == ${p1_v}"

      - name: resolved_due_process_record_rejects_further_status_change
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DueProcessRecord.OPEN_to_RESOLVED
          - state_machines.DueProcessRecord.terminal_states
          - validations.priority_9_ERR_INVALID_STATE
          - endpoints.PATCH_/esy/due-process-records/{record_id}
        distinguishing_aspect: "RESOLVED is a terminal state: a second PATCH asking for DISMISSED returns ERR_INVALID_STATE 409 and neither status nor resolution_note changes."
        test_recipe:
          setup:
            - "Clock 2027-06-01T00:00:00Z; Student S1 with one DueProcessRecord already PATCHed from OPEN to RESOLVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, home_school_code: "MS-014", transportation_required: true }
              as: CaseManager
              captures: { s1_id: $.data.id }
            - call: "POST /esy/due-process-records"
              payload: { student_id: "${s1_id}", record_type: "COMPLAINT", filed_on: "2027-06-01", allegation_summary: "Parent alleges ESY minutes were not delivered." }
              as: ComplianceOfficer
              captures: { dp1_id: $.data.id }
            - call: "PATCH /esy/due-process-records/${dp1_id}"
              payload: { status: "RESOLVED", resolution_note: "Investigation closed with corrective action." }
              as: ComplianceOfficer
              captures: { dp1_v: $.data.version }
          trigger:
            - call: "PATCH /esy/due-process-records/${dp1_id}"
              payload: { status: "DISMISSED", resolution_note: "Reclassified as dismissed." }
              as: ComplianceOfficer
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "DueProcessRecord.${dp1_id}.status == RESOLVED"
            - "DueProcessRecord.${dp1_id}.resolution_note == \"Investigation closed with corrective action.\""
            - "DueProcessRecord.${dp1_id}.version == ${dp1_v}"
            - "Student.${s1_id}.stay_put_active == false"

      - name: second_finalize_on_a_finalized_determination_rejected
        claim_type: idempotency
        grounds:
          - state_machines.EligibilityDetermination.PARENT_AGREED_to_FINALIZED
          - state_machines.EligibilityDetermination.terminal_states
          - validations.priority_9_ERR_INVALID_STATE
          - endpoints.POST_/esy/eligibility-determinations/{determination_id}/finalize
        distinguishing_aspect: "The same finalize trigger applied twice fails on the second attempt with ERR_INVALID_STATE 409 (state, not segregation-of-duties) and does not re-stamp finalized_by_user_id or re-write Student.esy_eligibility_status."
        test_recipe:
          setup:
            - "Clock 2027-06-01T00:00:00Z; determination D1 of Student S1 already FINALIZED by user dir-001 after analysis by cm-001; Student.esy_eligibility_status == ELIGIBLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, home_school_code: "MS-014", transportation_required: true }
              as: CaseManager
              captures: { s1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s1_id}", school_year: "2026-2027", analysis_variant: "PROBE_BASED", skill_probes: [{ skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "MATH_COMPUTATION", pre_break_mastery_pct: 100, post_break_mastery_pct: 74, recoupment_days_observed: 22, trials_count: 4 }] }
              as: CaseManager
              captures: { d1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations/${d1_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/eligibility-determinations/${d1_id}/parent-response"
              payload: { response: "AGREE" }
              as: ParentGuardian
              as_user_id: "${s1_id}"
            - call: "POST /esy/eligibility-determinations/${d1_id}/finalize"
              payload: {}
              as: SpedDirector
              as_user_id: "dir-001"
              captures: { d1_v: $.data.version }
          trigger:
            - call: "POST /esy/eligibility-determinations/${d1_id}/finalize"
              payload: {}
              as: SpedDirector
              as_user_id: "dir-002"
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "EligibilityDetermination.${d1_id}.status == FINALIZED"
            - "EligibilityDetermination.${d1_id}.finalized_by_user_id == \"dir-001\""
            - "EligibilityDetermination.${d1_id}.version == ${d1_v}"
            - "Student.${s1_id}.esy_eligibility_status == ELIGIBLE"

      - name: program_planning_to_closed_is_a_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.EsyProgram.PLANNING_to_CLOSED
          - endpoints.POST_/esy/programs/{program_id}/status
          - entities.EsyProgram.fields.status
        distinguishing_aspect: "PLANNING -> CLOSED is declared without any commitment precondition, so a program with zero commitments closes with HTTP 200, status CLOSED and version incremented by exactly 1."
        test_recipe:
          setup:
            - "Clock 2027-06-01T00:00:00Z; one PLANNING EsyProgram with no ServiceCommitment rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /esy/programs"
              payload: { name: "Cancelled Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90 }
              as: ProgramCoordinator
              captures: { p3_id: $.data.id, p3_v: $.data.version }
          trigger:
            - call: "POST /esy/programs/${p3_id}/status"
              payload: { target_status: "CLOSED" }
              as: ProgramCoordinator
          assert:
            - "HTTP 200"
            - "EsyProgram.${p3_id}.status == CLOSED"
            - "EsyProgram.${p3_id}.version == ${p3_v} + 1"

      - name: cancel_day_side_effect_chain_synthesizes_logs_and_cancels_runs
        claim_type: side_effect_execution
        grounds:
          - state_machines.EsyProgram.OPEN_to_OPEN
          - state_machines.TransportationRun.SCHEDULED_to_CANCELLED
          - calculations.commitment_minutes_ledger
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_day_cascades_log_to_commitment_to_student_alert_threshold
          rationale: "That instance asserts every declared side effect of the OPEN -> OPEN cancel-day transition: cancelled_dates append, one SYSTEM_DAY_CANCELLATION MISSED_DISTRICT log per ACTIVE commitment, the commitment and student ledger recomputes, the esy_service_alert flip and the SCHEDULED -> CANCELLED run fan-out."

      - name: determination_objection_loop_is_reenterable
        claim_type: cyclic
        grounds:
          - state_machines.EligibilityDetermination.PARENT_REVIEW_to_DRAFT
          - entities.EligibilityDetermination.fields.objection_round_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / determination_objection_cycle_returns_to_draft_and_reanalyzes
          rationale: "That instance drives PARENT_REVIEW -> DRAFT -> PARENT_REVIEW twice, asserting objection_round_count growth, the analyzed_by_user_id clear and the absence of any loop cap."

      - name: award_negotiation_and_delivery_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.CompensatoryAward.negotiation_status
          - state_machines.CompensatoryAward.delivery_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / award_parallel_dimensions_and_fulfilled_to_in_progress_cycle
          rationale: "That instance walks both CompensatoryAward dimensions and asserts the combined (negotiation_status, delivery_status) pair after each write, including the FULFILLED -> IN_PROGRESS reopen."

      - name: makeup_session_outcome_fork_paths_each_apply_their_own_effects
        claim_type: branching
        grounds:
          - state_machines.MakeupSession.SCHEDULED_to_DELIVERED
          - state_machines.MakeupSession.SCHEDULED_to_NO_SHOW_PARENT
          - state_machines.MakeupSession.SCHEDULED_to_CANCELLED_DISTRICT
        excluded_because:
          difficulty_instance: non_linear_state_machine / makeup_session_branch_fork_has_divergent_side_effect_sets
          rationale: "That instance exercises all three outcome branches from SCHEDULED and asserts the divergent side-effect sets (charge posting, no-show forfeiture counter, deadline extension)."

      - name: makeup_void_compensates_every_original_side_effect
        claim_type: compensation
        grounds:
          - state_machines.MakeupSession.DELIVERED_to_VOIDED
          - calculations.award_delivery_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / owed_minutes_conservation_survives_a_voided_delivery
          rationale: "That instance asserts the before/after reconciliation of remaining_owed_minutes, delivered_minutes and the fund's available_cents across DELIVERED -> VOIDED with no drift."

      - name: commitment_activation_is_guarded_by_the_programs_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.ServiceCommitment.ASSIGNED_to_ACTIVE
          - state_machines.EsyProgram.STAFFING_LOCKED_to_OPEN
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / commitment_activation_requires_open_program
          rationale: "That instance is exactly the cross-entity guard: ASSIGNED -> ACTIVE is refused with ERR_INVALID_STATE while the parent program is STAFFING_LOCKED and succeeds once it is OPEN."

  - section: calculations
    instances:
      - name: award_input_set_excludes_parent_caused_and_voided_logs
        claim_type: input_set_filtering
        grounds:
          - calculations.compensatory_award_minutes
          - calculations.commitment_minutes_ledger
          - entities.CompensatoryAward.fields.verified_missed_log_count
          - entities.CompensatoryAward.fields.excluded_log_count
          - state_machines.ServiceLog.VERIFIED_to_VOIDED
        distinguishing_aspect: "Of four logs on the same commitment only the VERIFIED MISSED_DISTRICT row feeds the award: computed_minutes == 60, verified_missed_log_count == 1 and excluded_log_count == 3 (MISSED_PARENT, MISSED_STUDENT_ABSENT and the VOIDED PARTIAL row)."
