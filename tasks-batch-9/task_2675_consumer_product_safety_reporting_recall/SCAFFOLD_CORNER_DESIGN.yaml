      - name: notice_release_is_gated_by_schedule_then_by_embargo_in_that_order
        claim_type: Violation -> Error
        grounds:
          - validations[22]
          - validations[23]
          - errors.ERR_NOTICE_NOT_DUE
          - errors.ERR_EMBARGO_ACTIVE
        distinguishing_aspect: |
          Two temporal gates on one endpoint whose ORDER is observable: a press
          release that is both un-due and embargoed must report the schedule first
          (priority 22), and only once the clock passes scheduled_for does the
          embargo become the reported reason. Both comparisons are non-strict, so
          the instants that must succeed are exactly the boundary instants — clock
          == scheduled_for still fails (on the embargo) and clock == embargo_until
          finally passes.
        test_recipe:
          setup:
            - "fixture chain F1 to an APPROVED recall at clock 2026-03-13T00:00:00Z"
