scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 - dual_variant_calc: two dual-variant calculations on different
  # entity domains (CoreDepositInvoice ledger vs WarrantyClaim labor).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: core_credit_provisional_vs_graded_final
        grounds:
          - calculations.core_provisional_credit
          - calculations.core_grade_and_credit
          - entities.CoreDepositInvoice.fields.provisional_credit_cents
          - entities.CoreDepositInvoice.fields.final_credit_cents
        distinguishing_aspect: |
          Same invoice and same deposit (50000c): the provisional estimate at
          issuance (round(50000*0.8)=40000) and the graded final credit after a
          clean grade-A on-time inspection (50000) are two valid algorithm
          variants that produce different values on the CoreDepositInvoice
          ledger domain.
        test_recipe:
          setup:
            - "One RemanOrder for a MIN spec model (core_deposit_cents 50000, no required parts) driven to SHIPPED at default clock 2026-08-01T00:00:00Z; invoice auto-created OPEN"
            - "Core returned same day and inspected with zero findings"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
            - call: "POST /api/reman-orders/${o_id}/ship"
              as: RemanPlanner
            - call: "GET /api/core-deposit-invoices?reman_order_id=${o_id}"
              as: Any
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /api/core-units"
              payload: { core_deposit_invoice_id: "${inv_id}", dock_code: "DOCK-1", dock_start_utc: "2026-08-01T10:00:00Z", dock_end_utc: "2026-08-01T11:00:00Z" }
              as: CoreIntakeClerk
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /api/core-units/${c_id}/inspect"
              payload: { case_cracked: false, findings: [] }
              as: CoreInspector
            - call: "GET /api/core-deposit-invoices/${inv_id}"
              as: Any
          assert:
            - "CoreDepositInvoice.${inv_id}.provisional_credit_cents == 40000"
            - "CoreDepositInvoice.${inv_id}.final_credit_cents == 50000"
            - "CoreDepositInvoice.${inv_id}.provisional_credit_cents != CoreDepositInvoice.${inv_id}.final_credit_cents"
            - "CoreDepositInvoice.${inv_id}.status == SETTLED_FULL"

      - name: labor_allowance_book_vs_actual_policy
        grounds:
          - calculations.warranty_labor_allowance
          - entities.WarrantyClaim.fields.allowance_policy
          - entities.WarrantyClaim.fields.labor_allowance_cents
        distinguishing_aspect: |
          Same model (flat_rate_hours 6.0, cap 90000c) and same installer rate
          (12000c/h): BOOK_HOURS pays 72000c while ACTUAL_HOURS with 5.0 claimed
          hours pays 60000c - two valid variants on the WarrantyClaim domain
          (distinct from the invoice ledger domain of the sibling instance).
        test_recipe:
          setup:
            - "One RemanOrder (MIN spec, flat_rate_hours 6.0, labor_cap_cents 90000) driven to SHIPPED at default clock"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
            - call: "POST /api/reman-orders/${o_id}/ship"
              as: RemanPlanner
          trigger:
            - call: "POST /api/warranty-claims"
              payload: { reman_order_id: "${o_id}", failure_code: "GEAR_CLUNK", claimed_labor_hours: 5.0, installer_labor_rate_cents: 12000, allowance_policy: "BOOK_HOURS" }
              as: Installer
              as_user_id: "inst-1"
              captures: { cl_book: "$.data.id" }
            - call: "POST /api/warranty-claims/${cl_book}/approve"
              as: WarrantyAdjuster
            - call: "POST /api/warranty-claims"
              payload: { reman_order_id: "${o_id}", failure_code: "GEAR_CLUNK", claimed_labor_hours: 5.0, installer_labor_rate_cents: 12000, allowance_policy: "ACTUAL_HOURS" }
              as: Installer
              as_user_id: "inst-1"
              captures: { cl_act: "$.data.id" }
            - call: "POST /api/warranty-claims/${cl_act}/approve"
              as: WarrantyAdjuster
              captures: { act_allowance: "$.data.labor_allowance_cents" }
          assert:
            - "WarrantyClaim.${cl_book}.labor_allowance_cents == 72000"
            - "WarrantyClaim.${cl_act}.labor_allowance_cents == 60000"
            - "WarrantyClaim.${cl_book}.labor_allowance_cents != WarrantyClaim.${cl_act}.labor_allowance_cents"

  # ===========================================================================
  # Rule 2 - combinatorial_formula: mode (a) conditional/tiered core credit,
  # mode (b) pinned nested-rounding dyno score. Different modes.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: core_credit_grade_late_branch_composition
        grounds:
          - calculations.core_grade_and_credit
          - state_machines.CoreDepositInvoice.transitions.AWAITING_GRADE_to_SETTLED_PARTIAL
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (grade tier from deduction score, lateness tier
          from days_late, case flag) interact non-linearly - grade B alone
          yields 37500c, but composed with the 31-45 day late factor the same
          deposit yields round(50000*0.75*0.75)=28125c.
        test_recipe:
          setup:
            - "One SHIPPED order (deposit 50000c); logical clock advanced 35 days past issuance before the core is registered; inspection finds SENSOR_HARNESS_MISSING (weight 10 -> grade B)"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
            - call: "POST /api/reman-orders/${o_id}/ship"
              as: RemanPlanner
            - call: "GET /api/core-deposit-invoices?reman_order_id=${o_id}"
              as: Any
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/core-units"
              payload: { core_deposit_invoice_id: "${inv_id}", dock_code: "DOCK-1", dock_start_utc: "2026-09-05T10:00:00Z", dock_end_utc: "2026-09-05T11:00:00Z" }
              as: CoreIntakeClerk
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /api/core-units/${c_id}/inspect"
              payload: { case_cracked: false, findings: ["SENSOR_HARNESS_MISSING"] }
              as: CoreInspector
          assert:
            - "CoreUnit.${c_id}.grade == B"
            - "CoreUnit.${c_id}.deduction_score == 10"
            - "CoreUnit.${c_id}.days_late == 35"
            - "CoreDepositInvoice.${inv_id}.final_credit_cents == 28125"
            - "CoreDepositInvoice.${inv_id}.forfeited_cents == 21875"
            - "CoreDepositInvoice.${inv_id}.status == SETTLED_PARTIAL"

      - name: dyno_score_per_gear_rounding_pinned
        grounds:
          - calculations.dyno_shift_quality_score
          - entities.DynoTestRun.fields.shift_quality_score
          - entities.DynoTestRun.fields.verdict
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned - each per-gear penalty is
          rounded to 2dp BEFORE summation. A 5.01 kPa deviation on gear 1 yields
          penalty 10.02 and score 89.98 (MARGINAL), while 5.00 yields exactly
          90.00 (PASS); sum-then-round would flip boundary outcomes.
        test_recipe:
          setup:
            - "One order in DYNO_QUEUE with a covering dyno booking; pinned dyno targets [200,220,240,260]"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
          trigger:
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [194.99, 220, 240, 260] }
              as: DynoOperator
              captures: { r_id: "$.data.id" }
          assert:
            - "DynoTestRun.${r_id}.shift_quality_score == 89.98"
            - "DynoTestRun.${r_id}.verdict == MARGINAL"
            - "RemanOrder.${o_id}.status == DYNO_QUEUE"
            - "RemanOrder.${o_id}.dyno_attempts_used == 1"

  # ===========================================================================
  # Rule 3 - non_linear_state_machine: RemanOrder rework cycle vs
  # CoreDepositInvoice dispute cycle. Different entities.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reman_order_rework_recycle_to_dyno_queue
        grounds:
          - state_machines.RemanOrder.transitions.DYNO_QUEUE_to_REWORK
          - state_machines.RemanOrder.transitions.REWORK_to_DYNO_QUEUE
        distinguishing_aspect: |
          RemanOrder has a true cycle: a FAIL dyno run sends DYNO_QUEUE ->
          REWORK (cal superseded), and a fresh calibration draft + verify loops
          REWORK -> DYNO_QUEUE; cal_generation increments on each loop.
        test_recipe:
          setup:
            - "One order in DYNO_QUEUE with a long covering booking; cal_generation == 1"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-05T00:00:00Z" }
              as: RemanTechnician
          trigger:
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [185, 220, 240, 260] }
              as: DynoOperator
              captures: { r1_verdict: "$.data.verdict" }
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.2, -0.1, 0.2, 0.1], tcm_flash_version: "TF-2026.08b" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
          assert:
            - "DynoTestRun verdict for attempt 1 == FAIL (score 70.0)"
            - "RemanOrder.${o_id}.status == DYNO_QUEUE"
            - "RemanOrder.${o_id}.cal_generation == 2"
            - "RemanOrder.${o_id}.cal_status == VERIFIED"
            - "RemanOrder.${o_id}.tcm_flash_version_applied == TF-2026.08b"
            - "RemanOrder.${o_id}.dyno_attempts_used == 1"

      - name: invoice_dispute_reinspection_cycle
        grounds:
          - state_machines.CoreDepositInvoice.transitions.SETTLED_PARTIAL_to_DISPUTED
          - state_machines.CoreDepositInvoice.transitions.DISPUTED_to_AWAITING_GRADE
          - state_machines.CoreUnit.transitions.GRADED_to_RE_INSPECTION
        distinguishing_aspect: |
          CoreDepositInvoice (different entity than RemanOrder) cycles
          AWAITING_GRADE -> SETTLED_PARTIAL -> DISPUTED -> AWAITING_GRADE when a
          dispute orders re-inspection; the re-grade can then settle FULL.
        test_recipe:
          setup:
            - "One SHIPPED order (deposit 50000c); core registered on-time and graded B (SENSOR_HARNESS_MISSING) -> invoice SETTLED_PARTIAL at 37500c"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
            - call: "POST /api/reman-orders/${o_id}/ship"
              as: RemanPlanner
            - call: "GET /api/core-deposit-invoices?reman_order_id=${o_id}"
              as: Any
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /api/core-units"
              payload: { core_deposit_invoice_id: "${inv_id}", dock_code: "DOCK-1", dock_start_utc: "2026-08-01T10:00:00Z", dock_end_utc: "2026-08-01T11:00:00Z" }
              as: CoreIntakeClerk
              captures: { c_id: "$.data.id" }
            - call: "POST /api/core-units/${c_id}/inspect"
              payload: { case_cracked: false, findings: ["SENSOR_HARNESS_MISSING"] }
              as: CoreInspector
            - call: "POST /api/core-deposit-invoices/${inv_id}/dispute"
              as: CoreIntakeClerk
          trigger:
            - call: "POST /api/core-deposit-invoices/${inv_id}/resolve-dispute"
              payload: { action: "REINSPECT" }
              as: ProgramAdmin
            - call: "POST /api/core-units/${c_id}/inspect"
              payload: { case_cracked: false, findings: [] }
              as: CoreInspector
          assert:
            - "CoreDepositInvoice.${inv_id}.status == SETTLED_FULL"
            - "CoreDepositInvoice.${inv_id}.final_credit_cents == 50000"
            - "CoreDepositInvoice.${inv_id}.forfeited_cents == 0"
            - "CoreUnit.${c_id}.status == GRADED"
            - "CoreUnit.${c_id}.grade == A"
            - "RemanOrder.${o_id}.core_settlement_status == CLOSED"

  # ===========================================================================
  # Rule 4 - transitive_cascade: depth-3 dyno-fail chain vs depth-2
  # grade-settle-close chain. Different triggering transitions.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dyno_final_fail_release_restock_promotion_chain
        grounds:
          - state_machines.RemanOrder.transitions.DYNO_QUEUE_to_ENGINEERING_REVIEW
          - calculations.parts_reservation_allocation
          - entities.HardPart.fields.qty_reserved
        distinguishing_aspect: |
          Depth-3 chain triggered by the 3rd FAIL dyno run: run -> order1
          ENGINEERING_REVIEW -> order1's reservations released on HardPart ->
          availability increase auto-promotes waiting order2 PART_HOLD ->
          ASSEMBLY with fresh reservations. Each link is caused by the previous
          link, not by the original POST.
        test_recipe:
          setup:
            - "Model FULL requires 2x PUMP; P1 DIRECT on_hand 3; P2 ADAPTED on_hand 1"
            - "order1 holds 2x P1 (availability 1) and sits in DYNO_QUEUE having already failed twice"
            - "order2 attempted kit-reserve, found no candidate with availability >= 2, and is in PART_HOLD"
          setup_api_calls:
            - call: "POST /api/transmission-models"
