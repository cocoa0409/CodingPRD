  - rule_id: priority_pair_validation_conflict
    instances:
      - name: build_slot_order_state_outranks_line_capacity_returns_409
        grounds:
          - validations[priority=10]
          - validations[priority=59]
          - errors[ERR_ORDER_NOT_ENGINEERED]
          - errors[ERR_LINE_CAPACITY_EXCEEDED]
          - calculations.line_committed_days_ledger
        distinguishing_aspect: |
          One POST /packaging-oem/build-slots request violates a `state` row (priority 10,
          ERR_ORDER_NOT_ENGINEERED - the order is still DRAFT) and a `business_fiscal` row
          (priority 59, ERR_LINE_CAPACITY_EXCEEDED - 20 requested days against a 10-day quarter);
          the state row wins, so the response is ERR_ORDER_NOT_ENGINEERED and never the fiscal code.
        test_recipe:
          setup:
            - "Customer 'Northwind Beverages' region NA, product_variation_pct 4.00"
            - "ProductionLine LINE-A OPEN, machine_family FILLER, capacity_days_per_quarter 10, committed_slot_days 0"
            - "ProductTrial PASSED; MachineOrder created but NOT engineered (fulfillment_status DRAFT, version 1)"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/production-lines"
              payload: { line_code: "LINE-A", machine_family: "FILLER", changeover_buffer_days: 5, capacity_days_per_quarter: 10 }
              as: PlatformAdmin
              captures: { line_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_trial_id: "${trial_id}", equipment_price_cents: 70000000, change_parts_price_cents: 3000000, guarantee_basis: "NAMEPLATE" }
              as: ApplicationEngineer
              captures: { order_id: $.data.id, order_v: $.data.version }
          trigger:
            - call: "POST /packaging-oem/build-slots"
              payload: { machine_order_id: "${order_id}", production_line_id: "${line_id}", start_date: "2026-08-06", requested_slot_days: 20, expected_machine_order_version: "${order_v}" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_ENGINEERED"
            - "response.data.error_id != ERR_LINE_CAPACITY_EXCEEDED"
            - "GET /packaging-oem/build-slots?machine_order_id=${order_id} returns an empty list"
