    input: []
    output: Client
    side_effects: ["health_score recomputed via account_health_score"]
  - method: GET
    path: "/clients"
    description: "List clients; filter by reseller_id (reverse-reachability for Client.reseller_id)"
    roles: [AgencyAdmin, AccountManager, Reseller]
    code: 200
    input: ["reseller_id?", "status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: POST
    path: "/clients/{id}/pause"
    description: "Pause an ACTIVE client"
    roles: [AgencyAdmin, AccountManager]
    code: 200
    input: []
    output: Client
