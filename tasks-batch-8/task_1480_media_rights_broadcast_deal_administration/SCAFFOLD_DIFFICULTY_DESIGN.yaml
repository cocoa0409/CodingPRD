      - call: POST /rights-assets
        payload:
          asset_code: MLB-2026
          competition_name: MLB
          season_label: '2026'
          season_start_date: '2026-04-01T00:00:00Z'
          season_end_date: '2026-11-01T23:59:59Z'
          total_package_pool: 2
          guaranteed_rating_basis_points: 4000
        as: RightsManager
        captures:
          asset_id: $.data.id
      - call: POST /broadcasters
        payload:
          legal_name: TBS Sports
          home_territory: US
          platform_classes:
          - LINEAR_TV
          credit_rating: INVESTMENT_GRADE
        as: RightsManager
        captures:
          b_id: $.data.id
      - call: POST /broadcasters/${b_id}/accredit
        payload: {}
        as: RightsManager
      - call: POST /packages
        payload:
          package_code: MLB-US-A
          territory_code: US
          platform_class: LINEAR_TV
          window_start: '2026-04-01T00:00:00Z'
          window_end: '2026-11-01T23:59:59Z'
          exclusivity_class: EXCLUSIVE
          minimum_bid_cents: 100000000
          games_committed: 10
          asset_id: ${asset_id}
        as: RightsManager
        captures:
          pkg_id: $.data.id
      - call: POST /rights-assets/${asset_id}/lock-packages
        payload: {}
        as: RightsManager
      - call: POST /packages/${pkg_id}/bids
        payload:
          bidder_id: ${b_id}
          offered_fee_cents: 100000000
          upfront_pct: 0.1
          escalator_rate_pct: 0.0
