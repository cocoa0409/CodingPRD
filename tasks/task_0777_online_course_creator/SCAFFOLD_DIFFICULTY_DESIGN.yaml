            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "Course A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "SUBSCRIPTION", amount_cents: 5000, billing_interval_days: 30 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /enrollments/${enrollment_id}/invoices"
              payload: { cycle_start: "2026-04-01T00:00:00Z", cycle_end: "2026-05-01T00:00:00Z" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments/${enrollment_id}/invoices"
