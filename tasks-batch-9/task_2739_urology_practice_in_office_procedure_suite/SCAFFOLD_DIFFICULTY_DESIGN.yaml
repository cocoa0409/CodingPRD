            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T14:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /urology/procedure-cases/${case_id}/schedule"
              payload: { expected_room_version: "${room_v1}" }
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "POST /urology/procedure-cases/${case_id}/clearance-review"
              payload: { decision: "CLEAR" }
              as: ProcedureNurse
              as_user_id: "${rn_id}"
            - call: "POST /urology/procedure-cases/${case_id}/clearance-review"
              payload: { decision: "BLOCK", block_reason_code: "ANTICOAG_HOLD_INCOMPLETE" }
              as: Urologist
              as_user_id: "${uro_id}"
            - call: "POST /urology/procedure-cases/${case_id}/clearance-review"
              payload: { decision: "CLEAR" }
              as: ProcedureNurse
              as_user_id: "${rn_id}"
            - call: "POST /urology/procedure-cases/${case_id}/reschedule"
              payload: { scheduled_start_at: "2026-09-14T16:00:00Z" }
              as: Scheduler
