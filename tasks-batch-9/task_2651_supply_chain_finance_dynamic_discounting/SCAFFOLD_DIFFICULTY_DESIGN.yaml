            - call: "POST /early-payments/${ep_id}/accounting-classification"
              payload: { classification: "DEBT_RECLASSIFIED" }
              as: BuyerTreasury
              as_user_id: "${buyer_id}"
              captures: { class_final: "$.data.accounting_status" }
          assert:
            - "${default_class} == DEBT_RECLASSIFIED (days_early 56 > 30) while accounting_status starts UNCLASSIFIED"
            - "${no_reason_error} == ERR_RECLASS_OVERRIDE_REASON_REQUIRED with HTTP 422 (TRADE_PAYABLE differs from the default)"
            - "${class_after} == TRADE_PAYABLE and ${funding_after_class} == RESERVED (the accounting axis moved without touching the funding axis)"
            - "${funding_exec} == DEPLOYED, ${settle_exec} == REMITTED, ${class_exec} == TRADE_PAYABLE (execute advances two axes and leaves the third)"
            - "EarlyPayment.${ep_id}.days_early == 56, discount_amount_cents == 1353, funder_fee_cents == 0, net_payment_cents == 107398, value_date == 2026-08-07"
            - "${funding_fail} == VOID, ${settle_fail} == FAILED, ${class_fail} == TRADE_PAYABLE"
            - "${class_final} == DEBT_RECLASSIFIED with no override_reason required, accepted even though funding_status is the terminal VOID"
            - "Buyer.${buyer_id}.credit_used_cents == 0 after the failure and Invoice.${invoice_id}.status == AWARDED"

      - name: supplier_onboarding_fork_join_of_identity_and_bank_axes
        grounds:
          - state_machines.Supplier.VERIFYING_to_VERIFYING
          - state_machines.Supplier.VERIFYING_to_ACTIVE
          - state_machines.BankAccount.MICRO_DEPOSIT_SENT_to_FAILED
          - validations[priority=22]
          - entities.Supplier.fields.payment_ready_at
          - global_constants.MAX_MICRO_DEPOSIT_ATTEMPTS
        distinguishing_aspect: |
          A fork-join rather than a loop: onboarding_status leaves VERIFYING only when BOTH the
          identity axis (idv_status) and the bank axis (bank_status) have completed, and the join
          is evaluated at the end of whichever call finishes last, so bank-then-identity and
          identity-then-bank both reach ACTIVE. A supplier whose bank axis dies after three wrong
          micro-deposit codes stays in VERIFYING forever even with idv_status PASSED, and the
          fourth confirmation attempt is refused before the code is even compared.
        test_recipe:
          setup:
            - "Two DRAFT suppliers S and T; logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /suppliers"
              payload: { legal_name: "Join Order Supplier S", tax_id_last4: "1234", remittance_email: "ar@joins.example" }
              as: PlatformOps
              captures: { s_id: "$.data.id" }
            - call: "POST /suppliers"
              payload: { legal_name: "Dead Bank Supplier T", tax_id_last4: "5678" }
              as: PlatformOps
              captures: { t_id: "$.data.id" }
            - call: "POST /suppliers/${s_id}/onboarding/submit"
              payload: {}
              as: Supplier
              as_user_id: "${s_id}"
              captures: { s_submitted: "$.data.onboarding_status" }
            - call: "POST /suppliers/${t_id}/onboarding/submit"
              payload: {}
              as: Supplier
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /suppliers/${s_id}/idv/adjudicate"
              payload: { decision: "MANUAL_REVIEW", identity_score: 55 }
              as: PlatformOps
              captures: { s_after_mr: "$.data.onboarding_status", s_idv_mr: "$.data.idv_status" }
            - call: "POST /suppliers/${s_id}/bank-accounts"
              payload: { routing_number: "021000021", account_last4: "4321" }
              as: Supplier
              as_user_id: "${s_id}"
              captures: { s_bank_id: "$.data.id", s_md_code: "$.data.micro_deposit_code" }
            - call: "POST /bank-accounts/${s_bank_id}/micro-deposit/confirm"
              payload: { code: "${s_md_code}" }
              as: Supplier
              as_user_id: "${s_id}"
              captures: { s_bank_status: "$.data.status" }
            - call: "GET /suppliers/${s_id}"
              payload: {}
              as: PlatformOps
              captures: { s_half_joined: "$.data.onboarding_status" }
            - call: "POST /suppliers/${s_id}/idv/adjudicate"
              payload: { decision: "PASSED", identity_score: 87 }
              as: PlatformOps
              captures: { s_joined: "$.data.onboarding_status", s_ready: "$.data.payment_ready_at" }
            - call: "POST /suppliers/${t_id}/idv/adjudicate"
              payload: { decision: "PASSED", identity_score: 84 }
              as: PlatformOps
              captures: { t_after_idv: "$.data.onboarding_status" }
            - call: "POST /suppliers/${t_id}/bank-accounts"
              payload: { routing_number: "011000015", account_last4: "8899" }
              as: Supplier
              as_user_id: "${t_id}"
              captures: { t_bank_id: "$.data.id" }
            - call: "POST /bank-accounts/${t_bank_id}/micro-deposit/confirm"
              payload: { code: "000000" }
              as: Supplier
              as_user_id: "${t_id}"
              captures: { t_try1: "$.data.status", t_attempts1: "$.data.micro_deposit_attempts" }
            - call: "POST /bank-accounts/${t_bank_id}/micro-deposit/confirm"
              payload: { code: "111111" }
              as: Supplier
              as_user_id: "${t_id}"
              captures: { t_try2: "$.data.status", t_attempts2: "$.data.micro_deposit_attempts" }
            - call: "POST /bank-accounts/${t_bank_id}/micro-deposit/confirm"
              payload: { code: "222222" }
              as: Supplier
              as_user_id: "${t_id}"
              captures: { t_try3: "$.data.status", t_attempts3: "$.data.micro_deposit_attempts" }
            - call: "POST /bank-accounts/${t_bank_id}/micro-deposit/confirm"
              payload: { code: "015889" }
              as: Supplier
              as_user_id: "${t_id}"
              captures: { t_exhausted_error: "$.data.error_id" }
          assert:
            - "${s_submitted} == VERIFYING with idv_status PENDING and bank_status PENDING"
            - "${s_after_mr} == VERIFYING and ${s_idv_mr} == MANUAL_REVIEW (the self-loop keeps the supplier in VERIFYING)"
            - "${s_bank_status} == VERIFIED and ${s_half_joined} == VERIFYING (one completed axis does not fire the join)"
            - "${s_joined} == ACTIVE and ${s_ready} is non-null (the join fires on the call that completes the last axis)"
            - "${t_after_idv} == VERIFYING with idv_status PASSED and bank_status PENDING (identity-first order also waits)"
            - "${t_try1} == MICRO_DEPOSIT_SENT with ${t_attempts1} == 1, ${t_try2} == MICRO_DEPOSIT_SENT with ${t_attempts2} == 2, ${t_try3} == FAILED with ${t_attempts3} == 3"
            - "${t_exhausted_error} == ERR_MICRO_DEPOSIT_ATTEMPTS_EXHAUSTED with HTTP 409, even though 015889 is T's correct code"
            - "GET /suppliers/${t_id} -> onboarding_status VERIFYING, bank_status FAILED, payment_ready_at null"

  - rule_id: transitive_cascade
    instances:
      - name: dispute_suppression_cascades_four_hops_and_releases_funder_capital
        grounds:
          - state_machines.Invoice.ELIGIBLE_to_SUPPRESSED
          - state_machines.DiscountOffer.ACCEPTED_to_VOIDED_BY_SUPPRESSION
          - state_machines.EarlyPayment.RESERVED_to_VOID
          - state_machines.Dispute.OPEN_to_RESOLVED_REJECTED
          - invariants.invoice_face_conservation
          - invariants.funder_capital_conservation
          - endpoints POST /invoices/{id}/disputes
        distinguishing_aspect: |
          Depth 4 from a single write, triggered by POST /invoices/{id}/disputes: Dispute created ->
          hop 1 Invoice AWARDED -> SUPPRESSED with dispute_suppressed true -> hop 2 the ACCEPTED
          offer -> VOIDED_BY_SUPPRESSION -> hop 3 the DEPLOYED EarlyPayment -> VOID -> hop 4 the
          funder's encumbrance and the invoice face ledger unwind. Only non-terminal offers are
          touched: the earlier SUPERSEDED offer keeps its status, the settlement axis is deliberately
          left at REMITTED, and resolving the dispute REJECTED walks the invoice back to ELIGIBLE
          without resurrecting either the offer or the payment.
        test_recipe:
          setup:
            - "FUNDER_ONLY programme OPEN with max_acceptable_apr_bps 1200; LIVE session 2026-08-02..2026-08-31"
            - "One ACTIVE funder: min_apr_bps 500, fee_spread_bps 0, capital_limit 60000000, tranche 60000000 over 2026-08-01..2026-12-31"
            - "One onboarded supplier, one invoice of face 1000000 with net_due_date 2026-09-04"
            - "Offer O1 at 700 bps superseded by offer O2 at 900 bps; O2 ACCEPTED; EarlyPayment executed at clock 2026-08-05"
