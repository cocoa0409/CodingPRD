            - call: "GET /audition-slots/00000000-0000-4000-8000-000000000999"
              as: RegistrarStaff
              captures: { e_slot: "$.data.error_id" }
            - call: "GET /auditions/00000000-0000-4000-8000-000000000999"
              as: RegistrarStaff
              captures: { e_audition: "$.data.error_id" }
            - call: "GET /panel-scores/00000000-0000-4000-8000-000000000999"
              as: ArtisticDirector
              captures: { e_score: "$.data.error_id" }
            - call: "GET /seat-assignments/00000000-0000-4000-8000-000000000999"
              as: ArtisticDirector
              captures: { e_seat: "$.data.error_id" }
            - call: "GET /tuition-accounts/00000000-0000-4000-8000-000000000999"
              as: FinanceOfficer
              captures: { e_acct: "$.data.error_id" }
            - call: "GET /event-participations/00000000-0000-4000-8000-000000000999"
              as: RegistrarStaff
              captures: { e_part: "$.data.error_id" }
            - call: "POST /auditions/00000000-0000-4000-8000-000000000999/adjudicate"
