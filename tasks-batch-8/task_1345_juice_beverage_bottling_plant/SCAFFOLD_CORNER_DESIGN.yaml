          setup_api_calls: []
          trigger:
            - { call: "POST /v1/customer-accounts", payload: { name: "VerCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id, v0: $.data.version } }
