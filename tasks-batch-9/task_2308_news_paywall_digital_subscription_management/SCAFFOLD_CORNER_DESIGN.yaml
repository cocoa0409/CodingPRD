            - "Subscription.${sub_ex}.dunning_status == FAILED_FINAL and Subscription.${sub_ex}.next_retry_on == null"
            - "Subscription.${sub_ex}.lifecycle_status == CANCELLED_NONPAY and Subscription.${sub_ex}.access_until == 2026-10-04"
            - "the response status is 409 and error_id == ERR_DUNNING_EXHAUSTED"
            - "error_id != ERR_INVOICE_NOT_PAYABLE and error_id != ERR_SUBSCRIPTION_TERMINAL"
            - "PaymentAttempt rows on Invoice.${inv_ex2} == 2"
            - "Reader.${rd_ex}.entitlement_source == NONE and Reader.${rd_ex}.churn_risk_band == SEVERE"

      - name: draft_plan_cannot_take_a_subscription
        claim_type: triggerability
        grounds:
          - validations[priority=21]
          - errors[ERR_PLAN_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / subscription_cannot_be_created_on_draft_plan_rejected
          rationale: "That instance triggers ERR_PLAN_NOT_ACTIVE on a DRAFT plan and then shows the same request succeeding after activation."

      - name: seat_not_invited_state_error
        claim_type: triggerability
        grounds:
          - validations[priority=32]
          - errors[ERR_SEAT_NOT_INVITED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / seat_state_check_outranks_domain_check_rejected
          rationale: "ERR_SEAT_NOT_INVITED is the asserted winner there, on a seat the EXPIRY pass moved out of INVITED."

      - name: price_notice_window_too_short_error
        claim_type: triggerability
        grounds:
          - validations[priority=34]
          - errors[ERR_PRICE_NOTICE_WINDOW_TOO_SHORT]
        excluded_because:
          difficulty_instance: boundary_precision_check / price_notice_window_boundary_thirty_days_exactly
          rationale: "Triggered at 29 days there, immediately beside the accepted 30-day case."

      - name: save_offer_limit_exceeded_error
        claim_type: triggerability
        grounds:
          - validations[priority=38]
          - errors[ERR_SAVE_OFFER_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / save_offer_limit_outranks_discount_cap_rejected
          rationale: "The second pitch inside one flow raises exactly this error there."

      - name: group_subscription_not_active_error
        claim_type: triggerability
        grounds:
          - validations[priority=41]
          - errors[ERR_GROUP_SUBSCRIPTION_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / seat_cannot_activate_while_funding_subscription_paused_rejected
          rationale: "Seat activation is refused there because the funding institutional subscription is PAUSED."

      - name: hold_buffer_violation_error
        claim_type: triggerability
        grounds:
          - validations[priority=51]
          - errors[ERR_HOLD_BUFFER_VIOLATION]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / hold_closed_interval_plus_buffer_admits_and_rejects
          rationale: "The buffered-conflict rejection is one half of that instance's admit/reject pair."

      - name: seat_capacity_exceeded_error
        claim_type: triggerability
        grounds:
          - validations[priority=56]
          - errors[ERR_SEAT_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / seat_half_open_intervals_admit_adjacency_but_cap_aggregate
          rationale: "The aggregate-concurrency refusal is asserted there against an admitted adjacent seat."

  # RBAC audit: one allow claim per role family, one deny claim per denial mechanism
  # (role-not-listed, entity_backed ownership, segregation of duties on the regulated
  # price pipeline).
  - section: rbac
    instances:
      - name: reader_cannot_open_a_subscription_or_run_the_batch_denied
        claim_type: deny
        grounds:
          - validations[priority=2]
          - roles.SubscriptionOpsAgent.exclusive_operations
          - endpoints[POST /paywall/subscriptions]
          - endpoints[POST /paywall/billing-runs]
        distinguishing_aspect: "Opening a subscription and running the nightly batch are SubscriptionOpsAgent exclusives: a Reader is refused 403 ERR_UNAUTHORIZED on both even with a perfectly valid body, and the very same body succeeds for the ops agent - so the refusal is about the role, not the payload."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z, one ACTIVE DIGITAL_ONLY plan, one registered reader."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital RBAC", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_rb: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_rb}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_rb_v: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "rbac@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_rb: "$.data.id" }
          trigger:
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_rb}", offer_plan_id: "${plan_rb}", expected_offer_plan_version: "${plan_rb_v}" }
              as: Reader
              as_user_id: "${rd_rb}"
              captures: { e_sub_role: "$.data.error_id" }
            - call: "POST /paywall/billing-runs"
              payload: { scope: "FULL" }
              as: Reader
              as_user_id: "${rd_rb}"
              captures: { e_run_role: "$.data.error_id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_rb}", offer_plan_id: "${plan_rb}", expected_offer_plan_version: "${plan_rb_v}" }
              as: SubscriptionOpsAgent
              captures: { sub_rb: "$.data.id" }
          assert:
            - "the first two calls return 403 with ${e_sub_role} == ERR_UNAUTHORIZED and ${e_run_role} == ERR_UNAUTHORIZED"
            - "no Subscription and no Invoice row existed after the two refusals"
            - "the third call returns 201 with Subscription.${sub_rb}.lifecycle_status == PENDING_ACTIVATION"
            - "OfferPlan.${plan_rb}.active_subscription_count == 0 (the plan counter only follows activation, not creation)"

      - name: group_admin_cannot_touch_another_groups_seats_rejected
        claim_type: deny
        grounds:
          - validations[priority=2]
          - roles.GroupAdmin.identity
          - endpoints[POST /paywall/group-accounts/{id}/seats]
          - endpoints[POST /paywall/seats/{id}/reclaim]
        distinguishing_aspect: "GroupAdmin is entity_backed on GroupAccount, so ownership - not role membership - is the discriminator: admin B is refused 403 on both the seat invite under group A's path and the reclaim of group A's seat, while admin A performs both."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; one ACTIVE INSTITUTIONAL_SEAT plan; group A on a.test with capacity 2 and an ACTIVE funding subscription; group B on b.test; one registered reader student@a.test."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Seats RBAC", bundle_type: "INSTITUTIONAL_SEAT", intro_price_cents: 5000, intro_cycles: 1, standard_price_cents: 5000, standard_from_cycle: 2, cycle_days: 30, per_seat_price_cents: 400 }
              as: RevenueManager
              captures: { plan_ga: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_ga}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_ga_v: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "bursar@a.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_ga_admin: "$.data.id" }
            - call: "POST /paywall/readers"
              payload: { email: "student@a.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_ga_s: "$.data.id" }
            - call: "POST /paywall/group-accounts"
              payload: { name: "Group A", admin_email: "bursar@a.test", allowed_email_domain: "a.test", seat_capacity: 2, offer_plan_id: "${plan_ga}" }
              as: SubscriptionOpsAgent
              captures: { grp_a: "$.data.id", grp_a_v: "$.data.version" }
            - call: "POST /paywall/group-accounts"
              payload: { name: "Group B", admin_email: "bursar@b.test", allowed_email_domain: "b.test", seat_capacity: 2, offer_plan_id: "${plan_ga}" }
              as: SubscriptionOpsAgent
              captures: { grp_b: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_ga_admin}", offer_plan_id: "${plan_ga}", expected_offer_plan_version: "${plan_ga_v}", group_account_id: "${grp_a}" }
              as: SubscriptionOpsAgent
              captures: { sub_ga: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_ga}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_ga: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_ga}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 5000 }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/group-accounts/${grp_a}/seats"
              payload: { reader_id: "${rd_ga_s}", starts_on: "2026-09-02", expected_group_account_version: "${grp_a_v}" }
              as: GroupAdmin
              as_user_id: "${grp_b}"
              captures: { e_seat_own: "$.data.error_id" }
            - call: "POST /paywall/group-accounts/${grp_a}/seats"
              payload: { reader_id: "${rd_ga_s}", starts_on: "2026-09-02", expected_group_account_version: "${grp_a_v}" }
              as: GroupAdmin
              as_user_id: "${grp_a}"
              captures: { seat_ga: "$.data.id" }
            - call: "POST /paywall/seats/${seat_ga}/reclaim"
              payload: {}
              as: GroupAdmin
              as_user_id: "${grp_b}"
              captures: { e_reclaim_own: "$.data.error_id" }
            - call: "POST /paywall/seats/${seat_ga}/reclaim"
              payload: {}
              as: GroupAdmin
              as_user_id: "${grp_a}"
          assert:
            - "${e_seat_own} == ERR_UNAUTHORIZED with status 403 and no Seat row was created (GroupAccount.${grp_a}.seats_assigned_count stayed 0, version stayed ${grp_a_v})"
            - "the owning admin's invite returns 201 with Seat.${seat_ga}.status == INVITED and GroupAccount.${grp_a}.seats_assigned_count == 1"
            - "${e_reclaim_own} == ERR_UNAUTHORIZED with status 403 and Seat.${seat_ga}.status is still INVITED"
            - "the owning admin's reclaim returns 200 with Seat.${seat_ga}.status == RECLAIMED, ends_on == 2026-09-02 or the clock date per the reclaim rule, and GroupAccount.${grp_a}.seats_available_count == 2"
            - "capacity invariant holds after every step: seat_capacity == seats_assigned_count + seats_available_count"

      - name: holds_and_cancellations_shared_but_scoped_to_the_owning_reader
        claim_type: allow
        grounds:
          - roles.Reader.shared_operations
          - roles.SubscriptionOpsAgent.shared_operations
          - validations[priority=2]
        distinguishing_aspect: "Hold creation and cancellation start are shared operations: the owning Reader and the ops agent both succeed on the same subscription, yet a second Reader carrying their own X-User-ID is refused 403 on the identical body - the shared grant is per-resource, not global."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; ACTIVE DIGITAL_ONLY subscription owned by reader A (cycle 1 of 499 paid); reader B registered with no subscription."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Shared", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_sh: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_sh}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_sh_v: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "owner@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_sh_a: "$.data.id" }
            - call: "POST /paywall/readers"
              payload: { email: "stranger@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_sh_b: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_sh_a}", offer_plan_id: "${plan_sh}", expected_offer_plan_version: "${plan_sh_v}" }
              as: SubscriptionOpsAgent
              captures: { sub_sh: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_sh}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_sh: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_sh}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 499 }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/subscriptions/${sub_sh}/holds"
              payload: { hold_type: "PAUSE_BILLING", start_date: "2026-09-20", end_date: "2026-09-26" }
              as: Reader
              as_user_id: "${rd_sh_a}"
              captures: { hold_sh: "$.data.id" }
            - call: "POST /paywall/subscriptions/${sub_sh}/holds"
              payload: { hold_type: "PAUSE_BILLING", start_date: "2026-10-10", end_date: "2026-10-16" }
              as: Reader
              as_user_id: "${rd_sh_b}"
              captures: { e_hold_own: "$.data.error_id" }
            - call: "POST /paywall/subscriptions/${sub_sh}/cancellation-requests"
              payload: { reason_code: "PRICE" }
              as: SubscriptionOpsAgent
              captures: { cr_sh: "$.data.id" }
          assert:
            - "the owner's hold returns 201 with Hold.${hold_sh}.status == SCHEDULED"
            - "${e_hold_own} == ERR_UNAUTHORIZED with status 403 and Hold rows on Subscription.${sub_sh} == 1"
            - "the ops agent's cancellation start returns 201 with CancellationRequest.${cr_sh}.status == INITIATED and initiated_on == 2026-09-01"
            - "Subscription.${sub_sh}.lifecycle_status is still ACTIVE (starting the flow does not schedule the cancellation)"

      - name: price_change_apply_by_the_noticing_officer_rejected
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=3]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints[POST /paywall/offer-plans/{id}/price-change/apply]
        distinguishing_aspect: "Both officers hold the identical ComplianceOfficer role, so only the X-User-ID recorded in notice_sent_by_user_id separates them: the noticing officer gets 403 ERR_SEGREGATION_OF_DUTIES (not ERR_UNAUTHORIZED), and priority 3 fires ahead of the effective-date check at priority 35."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; ACTIVE DIGITAL_ONLY plan with a SCHEDULED increase to 1799 effective 2026-10-15 whose notices were dispatched by officer-1."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital SoD", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_sd: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_sd}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_sd_v1: "$.data.version" }
            - call: "POST /paywall/offer-plans/${plan_sd}/price-change"
              payload: { pending_price_cents: 1799, pending_effective_on: "2026-10-15", grandfather_policy: "NONE", expected_offer_plan_version: "${plan_sd_v1}" }
              as: RevenueManager
              captures: { plan_sd_v2: "$.data.version" }
            - call: "POST /paywall/offer-plans/${plan_sd}/price-change/notices"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { noticed_by: "$.data.notice_sent_by_user_id" }
          trigger:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /paywall/offer-plans/${plan_sd}/price-change/apply"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { e_sod: "$.data.error_id" }
            - call: "POST /paywall/offer-plans/${plan_sd}/price-change/apply"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { plan_sd_v4: "$.data.version" }
          assert:
            - "${noticed_by} == officer-1 and OfferPlan.${plan_sd}.price_change_state == NOTICE_SENT after setup"
            - "the first apply returns 403 with ${e_sod} == ERR_SEGREGATION_OF_DUTIES and not ERR_UNAUTHORIZED"
            - "after the refusal OfferPlan.${plan_sd}.standard_price_cents is still 1499 and price_change_state is still NOTICE_SENT"
            - "the second officer's apply returns 200 with standard_price_cents == 1799, price_change_state == APPLIED and ${plan_sd_v4} greater than ${plan_sd_v2}"

  # Cross-cutting complexity layers declared in the scaffold's complexity_profile.
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_offer_plan_version_rejected_on_subscription_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency.subscription-create-stale-plan
          - validations[priority=19]
          - errors[ERR_STALE_OFFER_PLAN_VERSION]
        distinguishing_aspect: "A price-change scheduled between read and write bumps OfferPlan.version, so the version captured at activation is stale: the create fails 412 ERR_STALE_OFFER_PLAN_VERSION (not 404, not 409) and the retry with the freshly read version succeeds - proving the guard compares versions rather than merely requiring the field."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; ACTIVE DIGITAL_ONLY plan whose version was captured right after activation and then bumped by a scheduled price change."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital OCC", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_oc: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_oc}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_oc_stale: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "occ@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_oc: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_oc}/price-change"
              payload: { pending_price_cents: 1699, pending_effective_on: "2026-10-20", grandfather_policy: "ALL_EXISTING", expected_offer_plan_version: "${plan_oc_stale}" }
              as: RevenueManager
              captures: { plan_oc_fresh: "$.data.version" }
          trigger:
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_oc}", offer_plan_id: "${plan_oc}", expected_offer_plan_version: "${plan_oc_stale}" }
              as: SubscriptionOpsAgent
              captures: { e_occ_plan: "$.data.error_id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_oc}", offer_plan_id: "${plan_oc}", expected_offer_plan_version: "${plan_oc_fresh}" }
              as: SubscriptionOpsAgent
              captures: { sub_oc: "$.data.id" }
          assert:
            - "the first create returns 412 with ${e_occ_plan} == ERR_STALE_OFFER_PLAN_VERSION"
            - "no Subscription and no Invoice row exists after the refusal, and OfferPlan.${plan_oc}.version is unchanged at ${plan_oc_fresh}"
            - "${plan_oc_fresh} equals ${plan_oc_stale} + 1"
            - "the retry returns 201 with Subscription.${sub_oc}.lifecycle_status == PENDING_ACTIVATION, cycle_index == 1 and version == 1"

