      - name: domestic_incident_quorum_requires_a_legal_seat
        claim_type: correct_result
        grounds:
          - calculations.team_quorum_evaluation
          - entities.ThreatCase.fields.missing_disciplines
          - entities.ThreatCase.fields.quorum_met
          - errors[ERR_QUORUM_NOT_MET]
          - calculations.behavioral_risk_score
          - endpoints[POST /threat-cases/{threat_case_id}/team-assignments]
          - endpoints[POST /threat-cases/{threat_case_id}/convene]
        distinguishing_aspect: |
          The conditional required set is driven by incident_type and not only by weapon involvement:
          a weaponless TYPE_4_DOMESTIC report with injury_level NONE requires LEGAL but not CLINICAL, so
          the HR/SECURITY/OPERATIONS roster that is a perfect quorum for a TYPE_2_CLIENT case reports
          missing_disciplines ["LEGAL"] here, and adding the legal seat alone unlocks convene with
