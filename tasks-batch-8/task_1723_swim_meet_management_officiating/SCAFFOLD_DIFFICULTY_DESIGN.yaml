            - "${en_st} == SCRATCHED  # hop 2"
            - "${lane_st} == VOIDED  # hop 3"
            - "${cnt} == 0  # derived counter follows the cascade"

  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: entry_state_vs_temporal_priority
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_MEET_NOT_ACCEPTING_ENTRIES]
          - errors[ERR_ENTRY_DEADLINE_PASSED]
        distinguishing_aspect: |
          Category pair state vs business_temporal: one POST /entries that violates both
          (meet SEEDED; clock past entry_deadline_utc) MUST return the state error
          ERR_MEET_NOT_ACCEPTING_ENTRIES, never ERR_ENTRY_DEADLINE_PASSED — priority 6 beats 8.
        test_recipe:
          setup:
            - "Meet fully SEEDED (one verified entry exists); logical clock at 2026-08-11, past the 2026-08-10 deadline"
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "PC1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw A", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_a: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw B", birth_date: "2014-04-11", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_b: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_a}", seed_time_cs: 2900 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en_a: "$.data.id" } }
            - { call: "POST /entries/${en_a}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: Any }
            - { call: "POST /meets/${meet_id}/close-entries", payload: {}, as: MeetDirector, captures: { meet_v: "$.data.version" } }
            - { call: "POST /meets/${meet_id}/seed", payload: { expected_meet_version: "${meet_v}" }, as: MeetDirector }
          trigger:
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_b}", seed_time_cs: 2950 }, as: TeamCoach, as_user_id: "${team_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_MEET_NOT_ACCEPTING_ENTRIES  # state (p6) wins over deadline (p8) even though both fail"
      - name: assignment_safety_vs_constraint_priority
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_CERTIFICATION_INVALID]
          - errors[ERR_OFFICIAL_ASSIGNMENT_CONFLICT]
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint (different pair than
          state-vs-temporal): one assignment request whose official both lacks the
          STROKE_TURN_JUDGE certification AND has an overlapping CONFIRMED assignment MUST
          return ERR_CERTIFICATION_INVALID — priority 7 beats 13.
        test_recipe:
          setup:
            - "Official offX holds only STARTER certification and is CONFIRMED on event A [540,570); event B [555,585) overlaps on the same session_date"
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "PC2", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev_a: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 2, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "BACKSTROKE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3200, session_date: "2026-08-15", scheduled_start_minute: 555, scheduled_end_minute: 585 }, as: MeetDirector, captures: { ev_b: "$.data.id" } }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Off X", lsc_membership_id: "LSC-X1", certifications: ["STARTER"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_x: "$.data.id" } }
            - { call: "POST /events/${ev_a}/official-assignments", payload: { official_id: "${off_x}", role_on_deck: "STARTER" }, as: MeetDirector, captures: { oa_x: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_x}/confirm", payload: {}, as: DeckOfficial, as_user_id: "${off_x}" }
          trigger:
            - { call: "POST /events/${ev_b}/official-assignments", payload: { official_id: "${off_x}", role_on_deck: "STROKE_TURN_JUDGE" }, as: MeetDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CERTIFICATION_INVALID  # safety (p7) wins over overlap constraint (p13) even though both fail"

  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  - rule_id: boundary_precision_check
    instances:
      - name: qualifying_time_equality_boundary
        grounds:
          - entities.SwimEvent.fields.qualifying_time_cs
          - state_machines.EventEntry.note
          - entities.EventEntry.fields.qualification_status
        distinguishing_aspect: |
          Metric: seed time vs qualifying cut (endpoint POST /entries/{id}/verify): seed exactly
          equal to the cut (3000 == 3000) VERIFIES; one centisecond slower (3001) is REJECTED —
          the <= boundary is exact, on a different metric and endpoint than the timing-delta pair.
        test_recipe:
          setup:
            - "Meet ENTRIES_OPEN; event with qualifying_time_cs 3000; two entries seeded exactly 3000 and 3001"
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "BP1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw E", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_e: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw F", birth_date: "2014-04-11", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_f: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_e}", seed_time_cs: 3000 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en_e: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_f}", seed_time_cs: 3001 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en_f: "$.data.id" } }
          trigger:
            - { call: "POST /entries/${en_e}/verify", payload: {}, as: MeetDirector, captures: { q_e: "$.data.qualification_status" } }
            - { call: "POST /entries/${en_f}/verify", payload: {}, as: MeetDirector, captures: { q_f: "$.data.qualification_status" } }
          assert:
            - "${q_e} == VERIFIED  # equality qualifies (seed_time_cs <= qualifying_time_cs)"
            - "${q_f} == REJECTED  # 1cs slower than the cut"
      - name: timing_delta_threshold_30_vs_31
        grounds:
          - calculations.timing_reconciliation
          - entities.Meet.fields.timing_delta_threshold_cs
          - state_machines.LaneAssignment.PENDING_READINGS_to_AUTO_CONFIRMED
          - state_machines.LaneAssignment.PENDING_READINGS_to_MANUAL_REVIEW
        distinguishing_aspect: |
          Metric: |pad - rounded backup mean| in centiseconds (endpoint POST
          /lane-assignments/{id}/readings): delta exactly 30 auto-confirms (<= threshold),
          delta 31 forces MANUAL_REVIEW — exact boundary on a different metric and endpoint
          than the qualifying-time pair.
        test_recipe:
          setup:
            - "Event IN_PROGRESS with two seeded lanes; threshold default 30cs"
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "BP2", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw A", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_a: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw B", birth_date: "2014-04-11", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_b: "$.data.id" } }
