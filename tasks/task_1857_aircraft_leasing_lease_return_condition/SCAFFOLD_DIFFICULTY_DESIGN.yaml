            - { call: "POST /leasing/utilization-reports/${rep}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/reserve-claims", payload: { maintenance_event_ref: "APU-1", claimed_amount_cents: 560000 }, as: LesseeRep, as_user_id: "${les}", captures: { clA: "$.data.id"} }
            - { call: "POST /leasing/reserve-claims/${clA}/decide", payload: { decision: "APPROVE", approved_amount_cents: 560000 }, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/reserve-claims", payload: { maintenance_event_ref: "APU-2", claimed_amount_cents: 1 }, as: LesseeRep, as_user_id: "${les}", captures: { clB: "$.data.id"} }
            - { call: "POST /leasing/reserve-claims/${clB}/decide", payload: { decision: "APPROVE", approved_amount_cents: 1 }, as: LessorAdmin }
          trigger:
            - { call: "POST /leasing/reserve-claims/${clA}/pay", payload: {}, as: FinanceManager, captures: { stA: "$.data.status"} }
            - { call: "GET /leasing/leases/${lease}", payload: {}, as: LessorAdmin, captures: { bal: "$.data.reserve_balance_cents"} }
            - { call: "POST /leasing/reserve-claims/${clB}/pay", payload: {}, as: FinanceManager, captures: { errB: "$.data.error_id"} }
          assert:
            - "claim A payment of exactly the balance succeeds: status == PAID and reserve_balance_cents == 0 (>= boundary is inclusive)"
            - "claim B payment of 1 cent against balance 0 is rejected with ERR_RESERVE_BALANCE_EXCEEDED"

      - name: begin_negotiation_zero_pending_gate
        grounds:
          - validations[priority=8]
          - state_machines.ReturnCase.INSPECTION_to_NEGOTIATION
        distinguishing_aspect: |
          Zero-count boundary on the pending-items metric via the advance endpoint —
          a different metric (collection cardinality) and a different endpoint than
          the reserve-balance boundary: exactly 1 item left PENDING blocks entry to
          NEGOTIATION; 0 pending allows it.
        test_recipe:
          setup:
            - "ReturnCase in INSPECTION with inspector booked 2026-08-01; AIRFRAME, ENGINE, INTERIOR inspected COMPLIANT; PAINT still PENDING"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-N4", model: "B737-800", manufacture_date: "2014-08-23" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-N4" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "AIRWORTHINESS_CERT", doc_reference: "AC-N4" }, as: LessorAdmin, captures: { d2: "$.data.id"} }
            - { call: "POST /leasing/documents/${d2}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "ENGINE_LOG", doc_reference: "EL-N4" }, as: LessorAdmin, captures: { d3: "$.data.id"} }
            - { call: "POST /leasing/documents/${d3}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "LLP_STATUS", doc_reference: "LLP-N4" }, as: LessorAdmin, captures: { d4: "$.data.id"} }
            - { call: "POST /leasing/documents/${d4}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "November Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "RECORDS_VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "INSPECTION" }, as: LessorAdmin }
            - { call: "POST /leasing/inspectors", payload: { full_name: "Iris Nspect", license_number: "LIC-005" }, as: LessorAdmin, captures: { insp: "$.data.id"} }
            - { call: "POST /leasing/return-cases/${rc}/inspection-bookings", payload: { inspector_id: "${insp}", booking_date: "2026-08-01" }, as: LessorAdmin }
            - { call: "GET /leasing/return-cases/${rc}/checklist-items", payload: {}, as: LessorAdmin, captures: { it_air: "$.data[0].id", it_eng: "$.data[1].id", it_int: "$.data[2].id", it_pnt: "$.data[3].id"} }
            - { call: "POST /leasing/checklist-items/${it_air}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_eng}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_int}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
          trigger:
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "NEGOTIATION" }, as: LessorAdmin, captures: { err: "$.data.error_id"} }
            - { call: "POST /leasing/checklist-items/${it_pnt}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "NEGOTIATION" }, as: LessorAdmin, captures: { st: "$.data.status"} }
          assert:
            - "with exactly 1 PENDING item the advance is rejected with ERR_CHECKLIST_INCOMPLETE (zero-count boundary: 1 pending fails)"
            - "after the last item is inspected (0 pending/rectified) the same advance succeeds: status == NEGOTIATION"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: lease_activation_requires_aircraft_available
        grounds:
          - state_machines.Lease.DRAFT_to_ACTIVE
          - validations[priority=9]
          - errors[ERR_AIRCRAFT_NOT_AVAILABLE]
        distinguishing_aspect: |
          Entity pair Lease -> Aircraft: activation of a non-overlapping lease is
          still rejected because the aircraft is ON_LEASE (unavailable), independent
          of the temporal overlap rule which passes for these dates.
        test_recipe:
          setup:
            - "Aircraft with VERIFIED BIRTH_RECORD; lease 1 ACTIVE [2026-08-01, 2027-08-01) (aircraft ON_LEASE); lease 2 DRAFT [2027-09-01, 2028-09-01) with an ACTIVE lessee — dates disjoint from lease 1"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-P5", model: "A321neo", manufacture_date: "2020-06-15" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-P5" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Papa Air" }, as: LessorAdmin, captures: { les1: "$.data.id"} }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Papa2 Air" }, as: LessorAdmin, captures: { les2: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les1}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease1: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease1}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les2}", start_date: "2027-09-01", end_date: "2028-09-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease2: "$.data.id"} }
          trigger:
            - { call: "POST /leasing/leases/${lease2}/activate", payload: {}, as: LessorAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "activation rejected with ERR_AIRCRAFT_NOT_AVAILABLE (aircraft ON_LEASE) even though the dates do not overlap lease 1"

      - name: novation_legal_approval_requires_proposed_lessee_active
        grounds:
          - state_machines.NovationRequest.CREDIT_APPROVED_to_APPROVED
          - validations[priority=9]
          - errors[ERR_LESSEE_NOT_ACTIVE]
        distinguishing_aspect: |
          Different entity pair NovationRequest -> Lessee: the proposed lessee's
          status is re-validated at legal approval; suspending the proposed lessee
          between credit and legal review flips the legal approval to
          ERR_LESSEE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "ACTIVE lease held by lessee A; lessee B ACTIVE at request time; NovationRequest NOVATION to B credit-approved by cred_1; B then SUSPENDED"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-Q6", model: "B737-800", manufacture_date: "2012-02-29" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-Q6" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Quebec Air" }, as: LessorAdmin, captures: { lesA: "$.data.id"} }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Quebec2 Air" }, as: LessorAdmin, captures: { lesB: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${lesA}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/novation-requests", payload: { request_type: "NOVATION", proposed_lessee_id: "${lesB}" }, as: LesseeRep, as_user_id: "${lesA}", captures: { nr: "$.data.id"} }
            - { call: "POST /leasing/novation-requests/${nr}/review", payload: { decision: "APPROVE" }, as: CreditOfficer, as_user_id: "cred_1" }
            - { call: "POST /leasing/lessees/${lesB}/status", payload: { to: "SUSPENDED" }, as: CreditOfficer, as_user_id: "cred_2" }
          trigger:
            - { call: "POST /leasing/novation-requests/${nr}/review", payload: { decision: "APPROVE" }, as: LegalApprover, as_user_id: "legal_1", captures: { err: "$.data.error_id"} }
          assert:
            - "legal approval rejected with ERR_LESSEE_NOT_ACTIVE because the proposed lessee was suspended after credit approval"
            - "NovationRequest.status remains CREDIT_APPROVED (no partial transition)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: lease_overlap_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_LEASE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource Aircraft with half-open interval semantics [start_date, end_date):
          a lease starting exactly at another's end_date is adjacent and allowed,
          while any strict interior intersection is rejected.
        test_recipe:
          setup:
            - "Aircraft with VERIFIED BIRTH_RECORD; one ACTIVE lessee; DRAFT lease A [2026-08-01, 2027-08-01) and DRAFT lease B [2027-08-01, 2028-08-01) (adjacent: B.start == A.end)"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-R7", model: "A330-900", manufacture_date: "2022-03-10" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-R7" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Romeo Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { leaseA: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2027-08-01", end_date: "2028-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { leaseB: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2027-06-01", end_date: "2028-06-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { leaseC: "$.data.id"} }
          trigger:
            - { call: "POST /leasing/leases/${leaseB}/activate", payload: {}, as: LessorAdmin, captures: { stB: "$.data.status"} }
            - { call: "POST /leasing/leases/${leaseC}/activate", payload: {}, as: LessorAdmin, captures: { errC: "$.data.error_id"} }
          assert:
            - "lease B activation succeeds (adjacency at 2027-08-01 == A.end is NOT an overlap under half-open semantics): status == ACTIVE"
            - "lease C activation rejected with ERR_LEASE_PERIOD_OVERLAP (interior intersection with ACTIVE lease B)"

      - name: inspector_daily_capacity
        grounds:
          - validations[priority=8]
          - errors[ERR_INSPECTOR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Different resource (Inspector) and different interval semantics than the
          lease rule: discrete-day aggregate capacity (max 1 booking per inspector
          per calendar date) rather than half-open interval intersection — a second
          booking on the same date conflicts, the next date does not.
        test_recipe:
          setup:
            - "ReturnCase in INSPECTION (records verified); inspector I registered; first booking for I on 2026-08-01 created successfully"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-S8", model: "B737-800", manufacture_date: "2013-01-17" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-S8" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "AIRWORTHINESS_CERT", doc_reference: "AC-S8" }, as: LessorAdmin, captures: { d2: "$.data.id"} }
            - { call: "POST /leasing/documents/${d2}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "ENGINE_LOG", doc_reference: "EL-S8" }, as: LessorAdmin, captures: { d3: "$.data.id"} }
            - { call: "POST /leasing/documents/${d3}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "LLP_STATUS", doc_reference: "LLP-S8" }, as: LessorAdmin, captures: { d4: "$.data.id"} }
            - { call: "POST /leasing/documents/${d4}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Sierra Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "RECORDS_VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "INSPECTION" }, as: LessorAdmin }
            - { call: "POST /leasing/inspectors", payload: { full_name: "Iris Nspect", license_number: "LIC-006" }, as: LessorAdmin, captures: { insp: "$.data.id"} }
            - { call: "POST /leasing/return-cases/${rc}/inspection-bookings", payload: { inspector_id: "${insp}", booking_date: "2026-08-01" }, as: LessorAdmin, captures: { bk1: "$.data.id"} }
          trigger:
            - { call: "POST /leasing/return-cases/${rc}/inspection-bookings", payload: { inspector_id: "${insp}", booking_date: "2026-08-01" }, as: LessorAdmin, captures: { err: "$.data.error_id"} }
            - { call: "POST /leasing/return-cases/${rc}/inspection-bookings", payload: { inspector_id: "${insp}", booking_date: "2026-08-02" }, as: LessorAdmin, captures: { bk2: "$.data.id"} }
          assert:
            - "second booking for the same inspector on the same date is rejected with ERR_INSPECTOR_DOUBLE_BOOKED (capacity 1 per day)"
            - "booking the same inspector on 2026-08-02 succeeds (capacity is per discrete calendar day)"

  - rule_id: compensating_invariant
    instances:
      - name: reserve_pay_reverse_restores_balance
        grounds:
          - state_machines.ReserveClaim.APPROVED_to_PAID
          - state_machines.ReserveClaim.PAID_to_APPROVED
          - entities.Lease.fields.reserve_balance_cents
        distinguishing_aspect: |
          Conserved quantity: reserve money. Pay (forward) then reverse-payment
          (compensating) must restore the invariant reserve_balance_cents ==
          reserve_accrued_cents - reserve_reimbursed_cents - reserve_forfeited_cents
          with zero drift (560000 after the pair, exactly as before the pair).
        test_recipe:
          setup:
            - "ACTIVE lease with accepted report (accrued 560000) and claim approved 60000"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-T9", model: "A320-200", manufacture_date: "2016-04-30" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-T9" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Tango Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 100.0, flight_cycles: 20 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id"} }
            - { call: "POST /leasing/utilization-reports/${rep}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/reserve-claims", payload: { maintenance_event_ref: "LG-OH-1", claimed_amount_cents: 60000 }, as: LesseeRep, as_user_id: "${les}", captures: { cl: "$.data.id"} }
            - { call: "POST /leasing/reserve-claims/${cl}/decide", payload: { decision: "APPROVE", approved_amount_cents: 60000 }, as: LessorAdmin }
            - { call: "POST /leasing/reserve-claims/${cl}/pay", payload: {}, as: FinanceManager }
          trigger:
            - { call: "POST /leasing/reserve-claims/${cl}/reverse-payment", payload: {}, as: FinanceManager, captures: { st: "$.data.status"} }
            - { call: "GET /leasing/leases/${lease}", payload: {}, as: LessorAdmin, captures: { acc: "$.data.reserve_accrued_cents", rei: "$.data.reserve_reimbursed_cents", forf: "$.data.reserve_forfeited_cents", bal: "$.data.reserve_balance_cents"} }
          assert:
            - "after pay: balance had been 500000 (560000 - 60000); after reverse-payment the claim is APPROVED again"
            - "invariant holds with zero drift: reserve_accrued_cents == 560000, reserve_reimbursed_cents == 0, reserve_forfeited_cents == 0, reserve_balance_cents == 560000"

      - name: utilization_accept_void_restores_totals
        grounds:
          - state_machines.UtilizationReport.SUBMITTED_to_ACCEPTED
          - state_machines.UtilizationReport.ACCEPTED_to_VOIDED
          - calculations.aircraft_utilization_totals
        distinguishing_aspect: |
          Different conserved quantity than reserve money: cumulative aircraft
          utilization. Accept (forward) then void (compensating) must leave
          total_flight_hours/total_flight_cycles and reserve_accrued_cents exactly at
          their pre-accept values (0 / 0 / 0).
        test_recipe:
          setup:
            - "ACTIVE lease on an aircraft with zero totals; report 2026-08 of 100.0 h / 20 cycles SUBMITTED"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-U1", model: "E190", manufacture_date: "2011-06-06" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-U1" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Uniform Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 100.0, flight_cycles: 20 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id"} }
          trigger:
            - { call: "POST /leasing/utilization-reports/${rep}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin, captures: { posted: "$.data.posted_accrual_cents"} }
            - { call: "POST /leasing/utilization-reports/${rep}/void", payload: {}, as: LessorAdmin, captures: { st: "$.data.status"} }
            - { call: "GET /leasing/aircraft/${ac}", payload: {}, as: LessorAdmin, captures: { hrs: "$.data.total_flight_hours", cyc: "$.data.total_flight_cycles"} }
            - { call: "GET /leasing/leases/${lease}", payload: {}, as: LessorAdmin, captures: { acc: "$.data.reserve_accrued_cents"} }
          assert:
            - "accept posted posted_accrual_cents == 560000 and had raised aircraft totals to 100.0 h / 20 cycles"
            - "after void: report status == VOIDED, Aircraft.total_flight_hours == 0, total_flight_cycles == 0, Lease.reserve_accrued_cents == 0"
            - "invariant holds: totals equal the sum over ACCEPTED reports, which is the empty set after the compensating void"
