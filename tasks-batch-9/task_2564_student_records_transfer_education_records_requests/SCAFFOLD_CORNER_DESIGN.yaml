            - "AmendmentRequest.${amend_c}.status == \"DENIED\" and hearing_due_at == \"2026-08-31T00:00:00.000Z\""
            - "FileComponent.${c_acad}.amendment_count == 0 (no GRANT ever landed)"

      - name: segregation_of_duties_outranks_hearing_not_held_then_terminality
        claim_type: priority_ordering
        grounds:
          - validations.priority_24_segregation_of_amendment_duties
          - validations.priority_55_amendment_state_permits_action
          - entities.AmendmentRequest.fields.initial_decided_by_user_id
          - entities.AmendmentRequest.fields.hearing_decided_by_user_id
          - errors.ERR_HEARING_NOT_HELD
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_STATEMENT_ALREADY_FILED
          - errors.ERR_AMENDMENT_TERMINAL
        distinguishing_aspect: "On one HEARING_SCHEDULED amendment at a clock before hearing_end_at, officer-2 gets ERR_HEARING_NOT_HELD / 409 while officer-1 — who issued the initial denial — gets ERR_SEGREGATION_OF_DUTIES / 403 from the identical call, proving the priority-24 identity band is evaluated before the priority-55 state band; after the hearing the UPHELD path then distinguishes a second statement (ERR_STATEMENT_ALREADY_FILED) from any other action on the terminal row (ERR_AMENDMENT_TERMINAL)."
        test_recipe:
          setup:
            - "CA rule, SEND01, one minor student with guardian-noor, ACADEMIC collected at 10 pages."
            - "officer-1 denies the amendment on 2026-08-01; the parent requests a hearing; officer-1 schedules Marion Vetter for 2026-08-20T09:00Z-11:00Z."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/hearing-officers"
              payload: { full_name: "Marion Vetter", credential: "RETIRED_ADMINISTRATOR" }
              as: SystemAdmin
              captures: { officer_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Noor", last_name: "Rahimi", dob: "2012-03-15", grade_level: 8, has_iep: false, guardian_user_id: "guardian-noor" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "GET /records-office/students/${student_id}/cumulative-files"
              payload: {}
              as: RecordsOfficer
              captures: { file_id: "$.data[0].id" }
            - call: "GET /records-office/cumulative-files/${file_id}/components"
              payload: {}
              as: RecordsOfficer
              captures: { c_acad: "$.data[0].id" }
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${c_acad}"
              payload: { status: "COLLECTED", page_count: 10, redacted_page_count: 0 }
              as: RecordsClerk
            - call: "POST /records-office/students/${student_id}/amendment-requests"
              payload: { contested_component_id: "${c_acad}", contested_field: "attendance_total", requested_change: "Reduce unexcused absences to 3", rationale: "Two absences were medically excused" }
              as: Parent
              as_user_id: "guardian-noor"
              captures: { amend_id: "$.data.id" }
            - call: "POST /records-office/amendment-requests/${amend_id}/decisions"
              payload: { outcome: "DENY", decision_note: "Attendance clerk confirmed the record" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "POST /records-office/amendment-requests/${amend_id}/hearing-requests"
              payload: {}
              as: Parent
              as_user_id: "guardian-noor"
            - call: "POST /records-office/amendment-requests/${amend_id}/hearing-schedules"
              payload: { hearing_officer_id: "${officer_id}", hearing_start_at: "2026-08-20T09:00:00Z", hearing_end_at: "2026-08-20T11:00:00Z" }
              as: RecordsOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /records-office/amendment-requests/${amend_id}/decisions"
              payload: { outcome: "DENY", decision_note: "Too early" }
              as: RecordsOfficer
              as_user_id: "officer-2"
            - call: "POST /records-office/amendment-requests/${amend_id}/decisions"
              payload: { outcome: "DENY", decision_note: "Too early and same officer" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "POST /records-office/_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T11:00:00Z" }
              as: SystemAdmin
            - call: "POST /records-office/amendment-requests/${amend_id}/decisions"
              payload: { outcome: "DENY", decision_note: "Same officer after the hearing" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "POST /records-office/amendment-requests/${amend_id}/decisions"
              payload: { outcome: "DENY", decision_note: "Panel upheld the record" }
              as: RecordsOfficer
              as_user_id: "officer-2"
            - call: "POST /records-office/amendment-requests/${amend_id}/statements"
              payload: { statement_text: "The family disagrees with the attendance findings." }
              as: Parent
              as_user_id: "guardian-noor"
            - call: "POST /records-office/amendment-requests/${amend_id}/statements"
              payload: { statement_text: "A second statement." }
              as: Parent
              as_user_id: "guardian-noor"
            - call: "POST /records-office/amendment-requests/${amend_id}/decisions"
              payload: { outcome: "GRANT" }
              as: RecordsOfficer
              as_user_id: "officer-2"
          assert:
            - "trigger call 1 returns HTTP 409 with data.error_id == \"ERR_HEARING_NOT_HELD\""
            - "trigger call 2 returns HTTP 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\" (identity band beats the not-held state check)"
            - "trigger call 4 returns HTTP 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\""
            - "trigger call 5 returns HTTP 200 with status == \"UPHELD\" and hearing_decided_by_user_id == \"officer-2\" while initial_decided_by_user_id == \"officer-1\""
            - "trigger call 6 returns HTTP 200 with status == \"STATEMENT_FILED\" and statement_filed_at == \"2026-08-20T11:00:00.000Z\""
            - "FileComponent.${c_acad}.statement_of_disagreement_present == true and page_count == 11 and disclosable_page_count == 11"
            - "CumulativeFile.${file_id}.total_page_count == 11 and included_page_count == 11"
            - "trigger call 7 returns HTTP 409 with data.error_id == \"ERR_STATEMENT_ALREADY_FILED\""
            - "trigger call 8 returns HTTP 409 with data.error_id == \"ERR_AMENDMENT_TERMINAL\""
            - "FileComponent.${c_acad}.amendment_count == 0 and status == \"COLLECTED\""

      - name: component_lifecycle_target_guards_and_missing_parents
        claim_type: cascading_validation
        grounds:
          - validations.priority_52_component_state_permits_action
          - validations.priority_10_path_entities_exist
          - endpoints.PATCH_cumulative_files_components
          - errors.ERR_COMPONENT_NOT_COLLECTED
          - errors.ERR_COMPONENT_ALREADY_CERTIFIED
          - errors.ERR_COMPONENT_NOT_EXCLUDED
          - errors.ERR_FILE_COMPONENT_NOT_FOUND
          - errors.ERR_CUMULATIVE_FILE_NOT_FOUND
        distinguishing_aspect: "The single PATCH endpoint refuses five different ways depending on target status and path ids — CERTIFIED against a PENDING component, CERTIFIED against an already-certified one, COLLECTED against a CERTIFIED (non-excluded) one, an unknown component under a real file, and a real component under an unknown file — and none of the five bumps CumulativeFile.version, while the following exclude+reinstate pair bumps it exactly twice and restores the page-custody identity."
        test_recipe:
          setup:
            - "CA rule, SEND01 and one has_iep false student, whose creation minted one CumulativeFile and four components."
            - "ACADEMIC is collected at 10 pages and certified; HEALTH is left PENDING."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Omar", last_name: "Duarte", dob: "2012-04-16", grade_level: 8, has_iep: false, guardian_user_id: "guardian-omar" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "GET /records-office/students/${student_id}/cumulative-files"
              payload: {}
              as: RecordsOfficer
              captures: { file_id: "$.data[0].id" }
            - call: "GET /records-office/cumulative-files/${file_id}/components"
              payload: {}
              as: RecordsOfficer
              captures: { c_acad: "$.data[0].id", c_health: "$.data[1].id" }
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${c_acad}"
              payload: { status: "COLLECTED", page_count: 10, redacted_page_count: 2 }
              as: RecordsClerk
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${c_acad}"
              payload: { status: "CERTIFIED" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "GET /records-office/cumulative-files/${file_id}"
              payload: {}
              as: RecordsOfficer
              captures: { file_v_before: "$.data.version" }
          trigger:
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${c_health}"
              payload: { status: "CERTIFIED" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${c_acad}"
              payload: { status: "CERTIFIED" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${c_acad}"
              payload: { status: "COLLECTED", page_count: 10 }
              as: RecordsClerk
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/00000000-0000-0000-0000-0000000000bb"
              payload: { status: "CERTIFIED" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "PATCH /records-office/cumulative-files/00000000-0000-0000-0000-0000000000cc/components/${c_acad}"
              payload: { status: "CERTIFIED" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${c_acad}"
              payload: { status: "EXCLUDED", exclusion_reason: "SEALED_BY_COURT" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${c_acad}"
              payload: { status: "COLLECTED" }
              as: RecordsOfficer
              as_user_id: "officer-1"
          assert:
            - "trigger call 1 returns HTTP 409 with data.error_id == \"ERR_COMPONENT_NOT_COLLECTED\""
            - "trigger call 2 returns HTTP 409 with data.error_id == \"ERR_COMPONENT_ALREADY_CERTIFIED\""
            - "trigger call 3 returns HTTP 409 with data.error_id == \"ERR_COMPONENT_NOT_EXCLUDED\""
            - "trigger call 4 returns HTTP 404 with data.error_id == \"ERR_FILE_COMPONENT_NOT_FOUND\""
            - "trigger call 5 returns HTTP 404 with data.error_id == \"ERR_CUMULATIVE_FILE_NOT_FOUND\""
            - "after calls 1-5 GET /records-office/cumulative-files/${file_id} still reports version == ${file_v_before} and total_page_count == 10 and included_page_count == 10 and excluded_page_count == 0 and disclosable_page_count == 8"
            - "trigger call 6 returns HTTP 200 with FileComponent.${c_acad}.status == \"EXCLUDED\" and exclusion_reason == \"SEALED_BY_COURT\""
            - "after call 6 CumulativeFile.${file_id}.total_page_count == 10 and included_page_count == 0 and excluded_page_count == 10"
            - "trigger call 7 returns HTTP 200 with FileComponent.${c_acad}.status == \"COLLECTED\" and exclusion_reason == null"
            - "after call 7 CumulativeFile.${file_id}.included_page_count == 10 and excluded_page_count == 0 and version == ${file_v_before} + 2"
            - "FileComponent.${c_health}.status == \"PENDING\" and page_count == 0"

      - name: optout_deadline_versus_rights_transfer_priority
        claim_type: priority_ordering
        grounds:
          - validations.priority_21_rights_have_transferred_to_student
          - validations.priority_82_directory_optout_within_grace_window
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / rights_transferred_beats_optout_window
          rationale: >
            The §1.8 priority_pair_validation_conflict instance already pins the ordering between the
            identity band (ERR_RIGHTS_TRANSFERRED, priority 21) and the opt-out deadline band
            (ERR_OPTOUT_WINDOW_CLOSED, priority 82) on the same PATCH
            /students/{student_id}/directory-optout call, with both violations simultaneously true.
            A §1.9 duplicate would assert the identical error precedence.

      - name: review_appointment_room_interval_temporal_conflict
        claim_type: temporal_validation
        grounds:
          - validations.priority_70_inspection_room_interval_free
          - entities.ReviewAppointment.fields.start_at
        excluded_because:
          difficulty_instance: resource_temporal_overlap / inspection_room_closed_interval_with_buffer
          rationale: >
            The §1.8 resource_temporal_overlap instance already walks the closed, 15-minute-padded
            room interval at the exact padded edge and one millisecond outside it, covering both the
            ERR_ROOM_DOUBLE_BOOKED violation and the adjacent acceptance.

      - name: mark_ready_requires_complete_file_cross_entity
        claim_type: cross_entity_validation
