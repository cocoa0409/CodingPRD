              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /material-orders/${ord_id}/cancel"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /material-orders/${ord_id}/cancel"
              payload: {}
              as: Contractor
