            - { call: "POST /milk-bank/pasteurization-runs/${r1}/complete", payload: {}, as: ProcessingTechnician, as_user_id: "u-tech-1" }
            - { call: "GET /milk-bank/pasteurization-runs/${r1}/readings", payload: { qualifies: true }, as: QualityAssuranceOfficer, as_user_id: "u-qa-1" }
          assert:
            - "first response: data.qualifies == false (62.4 is below MIN_HOLD_CELSIUS)"
            - "second response: data.qualifies == true (62.5 is exactly MIN_HOLD_CELSIUS)"
            - "third response: data.qualifies == true (65.0 is exactly MAX_HOLD_CELSIUS)"
            - "fourth response: data.qualifies == false (65.1 is above MAX_HOLD_CELSIUS)"
            - "PasteurizationRun.${r1}.reading_count == 5"
            - "PasteurizationRun.${r1}.longest_hold_seconds == 600"
            - "PasteurizationRun.${r1}.thermal_status == FAILED"
            - "PasteurizationRun.${r1}.peak_celsius == 65.1"
            - "PasteurizationRun.${r1}.run_status == COMPLETED"
            - "PasteurizationRun.${r1}.release_eligibility == BLOCKED"
            - "last response: total_count == 3 and data[0].offset_seconds == 600 and data[1].offset_seconds == 1200 and data[2].offset_seconds == 2400"

      - name: dispense_fee_tier_boundary_at_exactly_2000_prior_ml
        claim_type: tiered_pricing
        grounds:
          - calculations.dispense_fee_allocation
          - entities.Dispense.fields.tier_discount_pct
          - entities.Dispense.fields.gross_fee_cents
          - entities.SubsidyProgram.fields.consumed_cents
        distinguishing_aspect: "The tier is read from the PRE-fill cumulative volume: a first 2000 ml fill is priced at tier 0.00 (9600 cents gross) even though it lands exactly on DISCOUNT_TIER_1_ML, and only the following 500 ml fill sees prior_ml == 2000 and earns 0.05, giving round_half_up(2400 * 0.95) = 2280 gross, 1368 subsidy at 60% coverage and 912 payer due."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z for intake, then 2026-08-10T10:05:00Z from run completion onwards."
