# =============================================================================
# §1.9 Scaffold Corner Design — task_2337_individual_artist_fellowship_grants
#
# Breadth probe. Every testable claim §1.1–§1.7 declares that §1.8 does not
# already cover, walked section-by-section against
# references/claim-extraction-guide.md (its nine sections are the `section:`
# values, its per-section rows the `claim_type:` values).
#
# Call objects use the same structured form as §1.8: `call` (a §1.5 endpoint),
# `payload` (a subset of that endpoint's declared `input:`), `as` (a §1.7 role),
# optional `as_user_id`, optional `captures` (jsonpaths into `output:`).
#
# Two reusable fixture chains, written once with YAML anchors and aliased
# everywhere else:
#
#   n_*  "CornerMain" — FY2027 LITERARY_ARTS cycle, budget 6_000_000,
#        allocation 2_000_000, base 1_500_000, a 3-seat panel with regions
#        [NORTH, CENTRAL, SOUTH] and ONE application by Cleo Amari
#        (NORTH, tin_status ON_FILE, residency from 2023-01-10).
#        quorum_min_reviews = max(3, ceil(3*0.60)) = 3, seated_count 3 <
#        TRIM_MIN_SEATS 5 so the FINAL variant does NOT trim:
#        weighted scores 8.00 / 6.60 / 7.30 -> provisional == final == 7.30,
#        score_spread 1.40 (< 2.50, no reopen).
#        readiness 3/3 seats * 3/3 regions * no conflict * no specialist = 100.00
#        assessment on 1_500_000 -> 0.085 -> 127_500, committed 1_627_500
#        tin ON_FILE -> withholding rate 0.0, so installments are
#        600_000 / 525_000 / 375_000 with withholding 0 and net == gross,
#        scheduled 2027-01-01 / 2027-05-01 / 2027-08-29,
#        final_report_due_at 2027-12-31 + 60d = 2028-02-29,
#        acceptance_deadline_at 2026-10-16 + 14d = 2026-10-30.
#
#   t_*  "CornerTwoSlot" — same shape but allocation 1_800_000 and FOUR
#        applications: appA (Dara Holt, NORTH) and appB (Emil Roux, SOUTH)
#        both SCORED, appC (Fay Ling, NORTH) left in DRAFT, appD (Gus Pran,
#        SOUTH, residency from 2024-10-16 = 23 months) determined INELIGIBLE.
#        appA final 7.30, appB final 7.00 (spread 2.00). Slate ranks appA
#        first. 1_800_000 - 1_500_000 = 300_000 remaining, which is BELOW
#        min_prorated_award_cents 500_000 -> the rank-2 slot is unfundable.
#        Diversity pool = {appA, appB}: hhi 0.5000, score 125*0.5 = 62.50.
#
# Every expected value below is a pre-computed literal.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # SECTION: entities
  # ===========================================================================
  - section: entities
    instances:

      - name: cycle_creation_seeds_status_reserve_available_and_posture
        claim_type: creation
        grounds:
          - entities.FellowshipCycle
          - endpoints[POST /grants/cycles]
          - calculations.cycle_budget_posture
        distinguishing_aspect: |
          A freshly created cycle is not a blank row: status DRAFT, reserve_cents
          300_000 (5% of 6_000_000), committed_cents 0 and available_cents
          5_700_000 with posture OPEN must already be present in the 201 body,
          so an implementation that only computes the ledger on the first award
          returns nulls or zeros for reserve_cents/available_cents and fails.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-09-01"
          setup_api_calls:
            - &n_clock { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
          trigger:
            - &n_cycle
              call: "POST /grants/cycles"
              payload:
                name: "FY2027 Fellowships (corner fixture)"
                fiscal_year: 2027
                application_open_at: "2026-08-15T00:00:00Z"
                application_deadline_at: "2026-10-15T23:59:59Z"
                grant_period_start: "2027-01-01T00:00:00Z"
                grant_period_end: "2027-12-31T00:00:00Z"
                total_budget_cents: 6000000
                base_award_cents: 1500000
                min_prorated_award_cents: 500000
                residency_min_months: 24
                award_blackout_years: 3
                proration_policy: PRORATE
                max_review_rounds: 2
                acceptance_window_days: 14
                appeal_window_days: 30
                final_report_due_offset_days: 60
              as: ProgramOfficer
              as_user_id: "officer-1"
              captures: { cyc: "$.data.id" }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "data.status == \"DRAFT\", data.posture == \"OPEN\""
            - "data.funded_total_cents == 0, data.admin_assessment_rate == 0.0, data.admin_assessment_cents == 0"
            - "data.reserve_cents == 300000 (RESERVE_RATE 0.05 applies in DRAFT)"
            - "data.committed_cents == 0 and data.available_cents == 5700000"
            - "data.unresolved_breach_count == 0 and data.blocking_conflict_count == 0"
            - "data.id is a bare UUID with no type prefix, data.version == 1, created_at == updated_at"

      - name: omitted_optional_cycle_policy_fields_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.FellowshipCycle.fields.proration_policy
          - entities.FellowshipCycle.fields.max_review_rounds
          - entities.FellowshipCycle.fields.acceptance_window_days
          - entities.FellowshipCycle.fields.appeal_window_days
          - entities.FellowshipCycle.fields.final_report_due_offset_days
        distinguishing_aspect: |
          All five policy knobs are optional with declared defaults; a body that
          omits every one of them must come back PRORATE / 2 / 14 / 30 / 60
          rather than null, so an implementation that stores the absent keys as
          null (and later divides or adds days with them) fails on the read.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-09-01"
          setup_api_calls:
            - *n_clock
          trigger:
            - call: "POST /grants/cycles"
              payload:
                name: "FY2028 Fellowships (defaults probe)"
                fiscal_year: 2028
                application_open_at: "2027-08-15T00:00:00Z"
                application_deadline_at: "2027-10-15T23:59:59Z"
                grant_period_start: "2028-01-01T00:00:00Z"
                grant_period_end: "2028-12-31T00:00:00Z"
                total_budget_cents: 4000000
                base_award_cents: 1000000
                min_prorated_award_cents: 400000
                residency_min_months: 24
                award_blackout_years: 3
              as: ProgramOfficer
              as_user_id: "officer-1"
          assert:
            - "data.proration_policy == \"PRORATE\""
            - "data.max_review_rounds == 2"
            - "data.acceptance_window_days == 14"
            - "data.appeal_window_days == 30"
            - "data.final_report_due_offset_days == 60"
            - "data.reserve_cents == 200000 and data.available_cents == 3800000 (the defaults do not disturb the ledger)"

      - name: submitted_application_read_returns_the_frozen_applicant_snapshot
        claim_type: retrieval
        grounds:
          - entities.Application.fields.sealed_alias
          - entities.Application.fields.residency_months_at_deadline
          - entities.Application.fields.applicant_legal_name
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          The GET must echo everything submit froze: sealed_alias LIT-2027-0001
          minted off discipline.submitted_sequence_counter, residency
          45 months measured at the 2026-10-15 deadline (not at the 2026-09-01
          submit instant, which would give 43), blackout_gap_years null for a
          first-time applicant, and the denormalized name/region — an
          implementation that recomputes residency at read time or numbers the
          alias from the Application id fails.
        test_recipe:
          setup:
            - "CornerMain cycle OPEN with one LITERARY_ARTS discipline requiring 2 samples"
            - "Cleo Amari resident since 2023-01-10, tin_status ON_FILE, not a student"
            - "Two MANUSCRIPT_PAGES samples attached, then the application submitted at 2026-09-01"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - &n_disc
              call: "POST /grants/discipline-categories"
              payload:
                cycle_id: "${cyc}"
                code: LITERARY_ARTS
                alias_prefix: "LIT"
                allocation_cents: 2000000
                required_work_sample_count: 2
                allowed_media: [MANUSCRIPT_PAGES, AUDIO]
                required_panel_seats: 3
                required_regions: [NORTH, CENTRAL, SOUTH]
                max_total_duration_seconds: 600
                max_concurrent_panels: 1
              as: ProgramOfficer
              as_user_id: "officer-1"
              captures: { disc: "$.data.id" }
            - &n_open { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: OPEN }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &n_art
              call: "POST /grants/artists"
              payload: { legal_name: "Cleo Amari", email: "cleo.amari@example.org", residency_start_date: "2023-01-10", residency_county: "Harbor", region: NORTH, is_enrolled_student: false, tin_status: ON_FILE }
              as: ProgramOfficer
              as_user_id: "officer-1"
              captures: { art: "$.data.id" }
            - &n_app
              call: "POST /grants/applications"
              payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", artist_id: "${art}", artist_statement: "Prose poems about harbour towns and the ferries that no longer run.", career_narrative: "Twelve years of small-press publication and two library residencies." }
              as: Artist
              as_user_id: "${art}"
              captures: { app: "$.data.id" }
            - &n_ws1 { call: "POST /grants/work-samples", payload: { application_id: "${app}", medium: MANUSCRIPT_PAGES, ordinal: 1, page_count: 11, contains_identifying_metadata: false }, as: Artist, as_user_id: "${art}", captures: { ws1: "$.data.id" } }
            - &n_ws2 { call: "POST /grants/work-samples", payload: { application_id: "${app}", medium: MANUSCRIPT_PAGES, ordinal: 2, page_count: 8, contains_identifying_metadata: false }, as: Artist, as_user_id: "${art}", captures: { ws2: "$.data.id" } }
            - &n_sub { call: "POST /grants/applications/${app}/submit", payload: {}, as: Artist, as_user_id: "${art}" }
          trigger:
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/discipline-categories/${disc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "data.status == \"SUBMITTED\" and data.anonymity_status == \"SEALED\""
            - "data.sealed_alias == \"LIT-2027-0001\""
            - "data.submitted_at == \"2026-09-01T00:00:00.000Z\""
            - "data.residency_months_at_deadline == 45 (2023-01-10 to the 2026-10-15 deadline)"
            - "data.blackout_gap_years == null (the artist has no last_award_fiscal_year)"
            - "data.applicant_legal_name == \"Cleo Amari\" and data.applicant_region == \"NORTH\""
            - "data.work_sample_count == 2, data.valid_review_count == 0, data.assigned_panel_id == null"
            - "The discipline read shows submitted_sequence_counter == 1 and eligible_application_count == 0"

      - name: application_list_reports_total_count_and_has_more_across_two_pages
        claim_type: listing
        grounds:
          - endpoints[GET /grants/applications]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With exactly three applications in the cycle, limit=2&offset=0 must
          return 2 rows with total_count 3 and has_more true, and
          limit=2&offset=2 must return 1 row with has_more false — total_count
          reporting the page length (2) or has_more computed as
          "len(page) == limit" both fail on the second read.
        test_recipe:
          setup:
            - "CornerMain through submit, so one SUBMITTED application exists"
            - "Two further artists each open a DRAFT application in the same cycle"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - { call: "POST /grants/artists", payload: { legal_name: "Hana Ito", email: "hana.ito@example.org", residency_start_date: "2022-05-04", residency_county: "Harbor", region: CENTRAL }, as: ProgramOfficer, as_user_id: "officer-1", captures: { art_h: "$.data.id" } }
            - { call: "POST /grants/applications", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", artist_id: "${art_h}", artist_statement: "Short fiction cycle set in a shuttered cannery.", career_narrative: "Two decades of workshop teaching and journal publication." }, as: Artist, as_user_id: "${art_h}", captures: { app_h: "$.data.id" } }
            - { call: "POST /grants/artists", payload: { legal_name: "Ivo Serra", email: "ivo.serra@example.org", residency_start_date: "2021-03-19", residency_county: "Ridge", region: SOUTH }, as: ProgramOfficer, as_user_id: "officer-1", captures: { art_i: "$.data.id" } }
            - { call: "POST /grants/applications", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", artist_id: "${art_i}", artist_statement: "A verse sequence on transhumance and border roads.", career_narrative: "Fifteen years of translation and two chapbooks." }, as: Artist, as_user_id: "${art_i}", captures: { app_i: "$.data.id" } }
          trigger:
            - { call: "GET /grants/applications", payload: { cycle_id: "${cyc}", limit: 2, offset: 0 }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications", payload: { cycle_id: "${cyc}", limit: 2, offset: 2 }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications", payload: { cycle_id: "${cyc}", status: DRAFT }, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "First read: response_type == \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second read: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "Third read: len(data) == 2 and total_count == 2 — the status filter is applied before pagination counting"
            - "No application appears on both the first and the second page"

      - name: unknown_path_ids_return_the_entity_specific_not_found_error
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_APPEAL_NOT_FOUND]
        distinguishing_aspect: |
          Every one of the fourteen entities must map its own 404 code; a shared
          ERR_NOT_FOUND, or a 500 from an unguarded lookup, fails. The same
          syntactically valid UUID is used everywhere, so only the route decides
          the code.
        test_recipe:
          setup:
            - "Empty database — no row of any entity exists"
          setup_api_calls: []
          trigger:
            - { call: "GET /grants/cycles/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/discipline-categories/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/artists/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/work-samples/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/panels/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/panelists/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/conflicts/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/reviews/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/recommendation-slots/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/awards/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/payment-installments/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/final-reports/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/appeals/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The fourteen reads return 404 with error_id ERR_CYCLE_NOT_FOUND, ERR_DISCIPLINE_CATEGORY_NOT_FOUND, ERR_ARTIST_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_WORK_SAMPLE_NOT_FOUND, ERR_PANEL_NOT_FOUND, ERR_PANELIST_NOT_FOUND, ERR_CONFLICT_NOT_FOUND, ERR_REVIEW_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_AWARD_NOT_FOUND, ERR_INSTALLMENT_NOT_FOUND, ERR_FINAL_REPORT_NOT_FOUND and ERR_APPEAL_NOT_FOUND respectively"
            - "Every failing response has response_type == \"error\" and still carries meta.api_request_id"

      - name: application_create_without_artist_statement_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /grants/applications]
          - entities.Application.fields.artist_statement
          - validations[priority=30]
        distinguishing_aspect: |
          artist_statement and career_narrative are both required inputs with no
          default; omitting one must fail at priority 30 with ERR_INVALID_REQUEST
          (400) before any FK resolution at priority 45, so an implementation
          that persists the row with a null narrative, or that reports a
          NOT_FOUND for the sibling ids, fails.
        test_recipe:
          setup:
            - "CornerMain cycle OPEN with a LITERARY_ARTS discipline and one registered artist"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
          trigger:
            - { call: "POST /grants/applications", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", artist_id: "${art}", career_narrative: "Twelve years of small-press publication." }, as: Artist, as_user_id: "${art}" }
            - { call: "POST /grants/applications", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", artist_id: "00000000-0000-4000-8000-000000000000", artist_statement: "Prose poems about harbour towns." }, as: Artist, as_user_id: "${art}" }
          assert:
            - "First trigger: 400 ERR_INVALID_REQUEST (artist_statement missing) and no Application row is created"
            - "Second trigger: 400 ERR_INVALID_REQUEST as well — the missing career_narrative is caught at priority 30, ahead of the unknown artist_id that priority 45 would otherwise report"
            - "GET /grants/applications?cycle_id={cyc} returns total_count == 0"

      - name: enum_and_range_constraints_are_enforced_on_write
        claim_type: type_constraints
        grounds:
          - entities.FellowshipCycle.fields.proration_policy
          - entities.WorkSample.fields.medium
          - entities.WorkSample.fields.ordinal
        distinguishing_aspect: |
          Three separate constraint kinds must all reject at priority 30: an
          out-of-enum proration_policy, an out-of-enum work-sample medium, and
          ordinal 0 against the declared ">= 1" range. An implementation that
          only type-checks JSON primitives accepts all three and fails.
        test_recipe:
          setup:
            - "CornerMain cycle OPEN with a DRAFT application that has no samples yet"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
          trigger:
            - call: "POST /grants/cycles"
              payload: { name: "Bad policy", fiscal_year: 2028, application_open_at: "2027-08-15T00:00:00Z", application_deadline_at: "2027-10-15T23:59:59Z", grant_period_start: "2028-01-01T00:00:00Z", grant_period_end: "2028-12-31T00:00:00Z", total_budget_cents: 4000000, base_award_cents: 1000000, min_prorated_award_cents: 400000, residency_min_months: 24, award_blackout_years: 3, proration_policy: SKIP }
              as: ProgramOfficer
              as_user_id: "officer-1"
            - { call: "POST /grants/work-samples", payload: { application_id: "${app}", medium: SCULPTURE, ordinal: 1 }, as: Artist, as_user_id: "${art}" }
            - { call: "POST /grants/work-samples", payload: { application_id: "${app}", medium: MANUSCRIPT_PAGES, ordinal: 0, page_count: 4 }, as: Artist, as_user_id: "${art}" }
          assert:
            - "All three triggers return 400 ERR_INVALID_REQUEST"
            - "GET /grants/work-samples?application_id={app} returns total_count == 0"
            - "The DRAFT application still reports work_sample_count == 0"

      - name: work_sample_count_is_derived_from_child_rows_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.Application.fields.work_sample_count
          - state_machines.WorkSample.PENDING_SCREEN_to_REJECTED
        distinguishing_aspect: |
          work_sample_count is source: computed — it must read 2 after two
          creates, 3 after a third, and drop back to 2 when one sample is
          screened REJECTED. An implementation that stores a counter only on
          insert (never on the REJECTED cascade) reports 3 on the last read and
          fails.
        test_recipe:
          setup:
            - "CornerMain cycle OPEN, one DRAFT application with two MANUSCRIPT_PAGES samples"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
          trigger:
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/work-samples", payload: { application_id: "${app}", medium: AUDIO, ordinal: 3, duration_seconds: 240, contains_identifying_metadata: false }, as: Artist, as_user_id: "${art}", captures: { ws3: "$.data.id" } }
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/work-samples/${ws3}/screen", payload: { disposition: REJECTED }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "First read: work_sample_count == 2"
            - "Second read: work_sample_count == 3"
            - "The screen call returns the sample in status REJECTED with screened_by == \"officer-1\""
            - "Third read: work_sample_count == 2 — the REJECTED cascade decremented the derived count"
            - "GET /grants/work-samples?application_id={app} still returns total_count == 3 (the rejected row is retained, not deleted)"

      - name: artist_patch_does_not_rewrite_the_already_frozen_snapshot
        claim_type: system_fields
        grounds:
          - entities.Artist.fields.tin_status
          - entities.Application.fields.applicant_legal_name
          - endpoints[PATCH /grants/artists/{artist_id}]
        distinguishing_aspect: |
          A PATCH must bump only the Artist row: version 1 -> 2 with created_at
          unchanged, while the Application's applicant_legal_name,
          applicant_region and residency_months_at_deadline keep the values
          frozen at submit. An implementation that reads those three fields
          through a join to Artist shows "Cleo Amari-Vance" / SOUTH / 22 and
          fails.
        test_recipe:
          setup:
            - "CornerMain through submit; the application snapshot reads Cleo Amari / NORTH / 45 months"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
          trigger:
            - { call: "PATCH /grants/artists/${art}", payload: { legal_name: "Cleo Amari-Vance", region: SOUTH, residency_start_date: "2024-12-01" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/artists/${art}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The PATCH response shows legal_name \"Cleo Amari-Vance\", region \"SOUTH\", version == 2, and updated_at strictly greater than created_at"
            - "The application still reports applicant_legal_name == \"Cleo Amari\", applicant_region == \"NORTH\" and residency_months_at_deadline == 45"
            - "The application's own version is unchanged by the artist PATCH"
            - "The artist read confirms tin_status is still \"ON_FILE\" (an absent PATCH key is not treated as null)"

      - name: work_sample_under_an_unknown_application_returns_application_not_found
        claim_type: parent_relationships
        grounds:
          - entities.WorkSample.parent
          - validations[priority=45]
          - errors[ERR_APPLICATION_NOT_FOUND]
        distinguishing_aspect: |
          WorkSample's parent is Application, and the parent id arrives in the
          body rather than the path; priority 45 must still resolve it and return
          ERR_APPLICATION_NOT_FOUND (404), not a 400 or a dangling child row.
        test_recipe:
          setup:
            - "CornerMain cycle OPEN with one registered artist and no application"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
          trigger:
            - { call: "POST /grants/work-samples", payload: { application_id: "00000000-0000-4000-8000-000000000000", medium: MANUSCRIPT_PAGES, ordinal: 1, page_count: 6 }, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "404 ERR_APPLICATION_NOT_FOUND"
            - "GET /grants/work-samples returns total_count == 0"

      - name: body_foreign_keys_are_validated_across_the_flat_topology
        claim_type: foreign_key_validation
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=45]
          - errors[ERR_DISCIPLINE_CATEGORY_NOT_FOUND]
          - errors[ERR_PANEL_NOT_FOUND]
        distinguishing_aspect: |
          The topology is flat, so almost every association is a body-level
          foreign key: an unknown discipline_category_id on a panel, an unknown
          panel_id on a panelist and an unknown cycle_id on a discipline must
          each surface the *referenced* entity's 404 code — an implementation
          that reports the request's own entity ("ERR_PANEL_NOT_FOUND" for the
          bad discipline reference) fails.
        test_recipe:
          setup:
            - "CornerMain cycle OPEN with one LITERARY_ARTS discipline"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
          trigger:
            - { call: "POST /grants/panels", payload: { cycle_id: "${cyc}", discipline_category_id: "00000000-0000-4000-8000-000000000000", required_seats: 3, required_regions: [NORTH, CENTRAL, SOUTH], deliberation_window_start: "2026-11-01T00:00:00Z", deliberation_window_end: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/panelists", payload: { panel_id: "00000000-0000-4000-8000-000000000000", person_email: "ghost@example.org", full_name: "Ghost Reader", region: NORTH, expertise_codes: [LITERARY_ARTS] }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/discipline-categories", payload: { cycle_id: "00000000-0000-4000-8000-000000000000", code: VISUAL_ARTS, alias_prefix: "VIS", allocation_cents: 500000, required_work_sample_count: 3, allowed_media: [IMAGE_SET], required_panel_seats: 3, required_regions: [NORTH] }, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "404 ERR_DISCIPLINE_CATEGORY_NOT_FOUND, 404 ERR_PANEL_NOT_FOUND and 404 ERR_CYCLE_NOT_FOUND respectively"
            - "GET /grants/panels?cycle_id={cyc} returns total_count == 0 and GET /grants/discipline-categories?cycle_id={cyc} still returns total_count == 1"

  # ===========================================================================
  # SECTION: state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: cycle_open_transition_recomputes_the_reserve_band
        claim_type: valid_transition
        grounds:
          - state_machines.FellowshipCycle.DRAFT_to_OPEN
          - calculations.cycle_budget_posture
        distinguishing_aspect: |
          DRAFT -> OPEN must leave the cycle at reserve 300_000 / available
          5_700_000 / posture OPEN and bump version to exactly 2 (the status
          change is the only write to the cycle row since creation — adding a
          discipline does not touch it), so an implementation that zeroes the
          reserve on open, or that mutates the cycle when a discipline is added,
          fails.
        test_recipe:
          setup:
            - "CornerMain cycle in DRAFT with one LITERARY_ARTS discipline allocating 2_000_000"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
          trigger:
            - *n_open
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "data.status == \"OPEN\""
            - "data.reserve_cents == 300000, data.committed_cents == 0, data.available_cents == 5700000"
            - "data.posture == \"OPEN\" (available 5_700_000 >= base_award_cents 1_500_000)"
            - "data.version == 2 and updated_at > created_at"

      - name: opening_a_cycle_with_no_discipline_returns_cycle_has_no_disciplines
        claim_type: precondition_enforcement
        grounds:
          - state_machines.FellowshipCycle.DRAFT_to_OPEN
          - validations[error_id=ERR_CYCLE_HAS_NO_DISCIPLINES]
        distinguishing_aspect: |
          The same request must fail and then succeed with nothing changed but
          the existence of one DisciplineCategory, proving the precondition is
          evaluated per request rather than at creation; the failing attempt must
          also leave status DRAFT (no half-applied transition).
        test_recipe:
          setup:
            - "CornerMain cycle in DRAFT with no DisciplineCategory yet"
          setup_api_calls:
            - *n_clock
            - *n_cycle
          trigger:
            - { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: OPEN }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - *n_disc
            - *n_open
          assert:
            - "First trigger: 409 ERR_CYCLE_HAS_NO_DISCIPLINES"
            - "The read after the failure shows status still \"DRAFT\" and version still 1"
            - "After the discipline exists the identical status call returns 200 with status \"OPEN\""

      - name: closing_a_cycle_before_the_deadline_returns_deadline_not_reached
        claim_type: precondition_enforcement
        grounds:
          - state_machines.FellowshipCycle.OPEN_to_CLOSED
          - validations[error_id=ERR_DEADLINE_NOT_REACHED]
        distinguishing_aspect: |
          The clock is the only thing that changes between the rejected and the
          accepted attempt: at 2026-09-01 (before application_deadline_at
          2026-10-15T23:59:59Z) the close must fail, at 2026-10-16 it must
          succeed. An implementation comparing against grant_period_start, or
          using strict ">" on a clock exactly at the deadline, fails.
        test_recipe:
          setup:
            - "CornerMain cycle OPEN, clock at 2026-09-01, one SUBMITTED application"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
          trigger:
            - { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: CLOSED }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &n_clock16 { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-16T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &n_close { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: CLOSED }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "First trigger: 409 ERR_DEADLINE_NOT_REACHED and the cycle stays OPEN"
            - "After the clock moves to 2026-10-16 the close returns 200 with status \"CLOSED\""
            - "The SUBMITTED application is untouched by the close: status still \"SUBMITTED\", sealed_alias still \"LIT-2027-0001\""

      - name: panel_review_requires_every_submission_to_carry_a_determination
        claim_type: precondition_enforcement
        grounds:
          - state_machines.FellowshipCycle.CLOSED_to_PANEL_REVIEW
          - state_machines.Application.SUBMITTED_to_ELIGIBLE
          - validations[error_id=ERR_APPLICATION_STATE_INVALID]
        distinguishing_aspect: |
          A CLOSED cycle with one still-SUBMITTED application must refuse
          PANEL_REVIEW with ERR_APPLICATION_STATE_INVALID and then accept it once
          the determination lands; the determination itself must increment
          discipline.eligible_application_count from 0 to 1 (submit alone must
          not have counted it).
        test_recipe:
          setup:
            - "CornerMain closed at 2026-10-16 with one SUBMITTED application awaiting determination"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
          trigger:
            - { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: PANEL_REVIEW }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &n_elig { call: "POST /grants/applications/${app}/eligibility", payload: { determination: ELIGIBLE }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/discipline-categories/${disc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - &n_pr { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: PANEL_REVIEW }, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "First trigger: 409 ERR_APPLICATION_STATE_INVALID and the cycle stays \"CLOSED\""
            - "The determination returns status \"ELIGIBLE\" with eligibility_determined_by == \"officer-1\" and notified_at still null"
            - "The discipline read shows eligible_application_count == 1"
            - "The repeated status call now returns 200 with status \"PANEL_REVIEW\""

      - name: newly_created_panel_starts_forming_with_zero_derived_counters
        claim_type: initial_state
        grounds:
          - state_machines.Panel.initial_state
          - entities.Panel.fields.readiness_score
          - entities.Panel.fields.quorum_min_reviews
        distinguishing_aspect: |
          A brand-new 3-seat panel must read status FORMING, seated_count 0,
          region_coverage_count 0, readiness_score 0.00, quorum_met false and
          assigned_application_count 0 — but quorum_min_reviews must already be
          3, because max(3, ceil(3*0.60)) does not depend on who is seated. An
          implementation that leaves quorum_min_reviews null until the first seat
          fails.
        test_recipe:
          setup:
            - "CornerMain in PANEL_REVIEW with one ELIGIBLE application"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
          trigger:
            - &n_panel
              call: "POST /grants/panels"
              payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", required_seats: 3, required_regions: [NORTH, CENTRAL, SOUTH], deliberation_window_start: "2026-11-01T00:00:00Z", deliberation_window_end: "2026-12-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "officer-1"
              captures: { pan: "$.data.id" }
          assert:
            - "data.status == \"FORMING\", data.round_number == 0, data.seated_count == 0"
            - "data.region_coverage_count == 0, data.readiness_score == 0.00, data.quorum_met == false"
            - "data.quorum_min_reviews == 3 (max(3, ceil(3*0.60)))"
            - "data.blocking_conflict_count == 0, data.reopen_required == false, data.assigned_application_count == 0"
            - "data.chartered_by == null and data.slate_submitted_at == null"

      - name: charter_assigns_only_eligible_unassigned_applications_of_the_discipline
        claim_type: side_effect_execution
        grounds:
          - state_machines.Panel.FORMING_to_CHARTERED
          - state_machines.Application.ELIGIBLE_to_UNDER_REVIEW
          - calculations.panel_readiness_score
        distinguishing_aspect: |
          Chartering with three seated panelists covering NORTH/CENTRAL/SOUTH
          must produce readiness 100.00 and assign exactly the ONE ELIGIBLE
          application: the co-resident DRAFT application in the same cycle and
          discipline must keep assigned_panel_id null, so assigned_application_count
          is 1 and not 2. An implementation that assigns every application of the
          discipline fails.
        test_recipe:
          setup:
            - "CornerMain in PANEL_REVIEW with one ELIGIBLE application and one never-submitted DRAFT application in the same discipline"
            - "A 3-seat panel with one panelist per required region, each carrying LITERARY_ARTS expertise"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - { call: "POST /grants/artists", payload: { legal_name: "Jun Park", email: "jun.park@example.org", residency_start_date: "2020-02-02", residency_county: "Harbor", region: CENTRAL }, as: ProgramOfficer, as_user_id: "officer-1", captures: { art_j: "$.data.id" } }
            - { call: "POST /grants/applications", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", artist_id: "${art_j}", artist_statement: "An unfinished novel in letters.", career_narrative: "Nine years of literary translation." }, as: Artist, as_user_id: "${art_j}", captures: { app_j: "$.data.id" } }
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - &n_pl1 { call: "POST /grants/panelists", payload: { panel_id: "${pan}", person_email: "chair.north@example.org", full_name: "Kira Vale", region: NORTH, expertise_codes: [LITERARY_ARTS], is_chair: true }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pl1: "$.data.id" } }
            - &n_pl2 { call: "POST /grants/panelists", payload: { panel_id: "${pan}", person_email: "reader.central@example.org", full_name: "Lev Ostrom", region: CENTRAL, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pl2: "$.data.id" } }
            - &n_pl3 { call: "POST /grants/panelists", payload: { panel_id: "${pan}", person_email: "reader.south@example.org", full_name: "Mira Sol", region: SOUTH, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pl3: "$.data.id" } }
            - &n_seat1 { call: "POST /grants/panelists/${pl1}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - &n_seat2 { call: "POST /grants/panelists/${pl2}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - &n_seat3 { call: "POST /grants/panelists/${pl3}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          trigger:
            - &n_charter { call: "POST /grants/panels/${pan}/charter", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app_j}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The charter response shows status \"CHARTERED\", seated_count == 3, region_coverage_count == 3, readiness_score == 100.00, quorum_met == true, chartered_by == \"officer-1\""
            - "assigned_application_count == 1"
            - "The eligible application is now \"UNDER_REVIEW\" with assigned_panel_id == the panel id"
            - "The DRAFT application still reports status \"DRAFT\" and assigned_panel_id == null"

      - name: review_submission_side_effects_land_on_three_rows_at_once
        claim_type: side_effect_execution
        grounds:
          - state_machines.Review.DRAFT_to_SUBMITTED
          - entities.Panelist.fields.review_submitted_count
          - entities.Application.fields.valid_review_count
        distinguishing_aspect: |
          One submit must stamp submitted_at, write weighted_score, increment the
          author's review_submitted_count and recompute the application's
          valid_review_count and provisional_composite_score. After the first
          submit alone the provisional score must be 8.00 (mean of a single
          counted review), which distinguishes an implementation that only
          recomputes at close-round (it would report null).
        test_recipe:
          setup:
            - "CornerMain chartered panel with the round open"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - &n_round { call: "POST /grants/panels/${pan}/open-round", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          trigger:
            - &n_rev1 { call: "POST /grants/reviews", payload: { application_id: "${app}", panelist_id: "${pl1}", artistic_excellence: 9, work_sample_quality: 8, career_impact: 7, public_value: 6, comments: "Assured voice, uneven middle section." }, as: Panelist, as_user_id: "${pl1}", captures: { rv1: "$.data.id" } }
            - &n_srev1 { call: "POST /grants/reviews/${rv1}/submit", payload: {}, as: Panelist, as_user_id: "${pl1}" }
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/panelists/${pl1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The created review reads status \"DRAFT\", round_number == 1, weighted_score == null, submitted_at == null"
            - "The submit response reads status \"SUBMITTED\", weighted_score == 8.00 and submitted_at == \"2026-10-16T00:00:00.000Z\""
            - "The panel's round_number is 1 and the application read shows valid_review_count == 1 and provisional_composite_score == 8.00"
            - "final_composite_score and score_spread are still null before close-round"
            - "The panelist read shows review_submitted_count == 1 and status \"SEATED\""

      - name: close_round_without_quorum_returns_insufficient_reviews
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Panel.SCORING_to_DELIBERATING
          - validations[error_id=ERR_INSUFFICIENT_REVIEWS]
          - entities.Panel.fields.quorum_min_reviews
        distinguishing_aspect: |
          With two of three counted reviews the close must fail on
          ERR_INSUFFICIENT_REVIEWS (quorum_min_reviews 3) and the panel must stay
          SCORING with final_composite_score still null; the third submit then
          makes the identical call succeed. An implementation that compares
          against seated_count-1, or that scores on a partial round, fails.
        test_recipe:
          setup:
            - "CornerMain scoring round open with two submitted reviews (weighted 8.00 and 6.60)"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
            - *n_srev1
            - &n_rev2 { call: "POST /grants/reviews", payload: { application_id: "${app}", panelist_id: "${pl2}", artistic_excellence: 7, work_sample_quality: 7, career_impact: 6, public_value: 5, comments: "Competent but conventional." }, as: Panelist, as_user_id: "${pl2}", captures: { rv2: "$.data.id" } }
            - &n_srev2 { call: "POST /grants/reviews/${rv2}/submit", payload: {}, as: Panelist, as_user_id: "${pl2}" }
          trigger:
            - { call: "POST /grants/panels/${pan}/close-round", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - &n_rev3 { call: "POST /grants/reviews", payload: { application_id: "${app}", panelist_id: "${pl3}", artistic_excellence: 8, work_sample_quality: 6, career_impact: 8, public_value: 7, comments: "Strong career trajectory." }, as: Panelist, as_user_id: "${pl3}", captures: { rv3: "$.data.id" } }
            - &n_srev3 { call: "POST /grants/reviews/${rv3}/submit", payload: {}, as: Panelist, as_user_id: "${pl3}" }
            - &n_closeround { call: "POST /grants/panels/${pan}/close-round", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "First close: 409 ERR_INSUFFICIENT_REVIEWS"
            - "The read after the failure shows the application still \"UNDER_REVIEW\" with valid_review_count == 2, provisional_composite_score == 7.30 and final_composite_score == null"
            - "The second close returns 200 with panel status \"DELIBERATING\" and reopen_required == false"
            - "The application is now \"SCORED\" with final_composite_score == 7.30, score_spread == 1.40 and review_round_number == 1"

      - name: repeated_settled_actions_each_report_their_own_entity_state_error
        claim_type: idempotency
        grounds:
          - validations[priority=65]
          - state_machines.Panelist.NOMINATED_to_SEATED
          - state_machines.WorkSample.PENDING_SCREEN_to_CLEARED
          - state_machines.ConflictDeclaration.DECLARED_to_WAIVED
        distinguishing_aspect: |
          Five different second attempts must each name their own entity:
          re-submitting the application gives ERR_APPLICATION_STATE_INVALID,
          re-seating gives ERR_PANELIST_STATE_INVALID, re-screening a sample
          gives ERR_WORK_SAMPLE_STATE_INVALID, re-screening a conflict gives
          ERR_CONFLICT_STATE_INVALID and re-chartering gives
          ERR_PANEL_STATE_INVALID. A single shared ERR_INVALID_STATE, or a
          silently idempotent 200, fails.
        test_recipe:
          setup:
            - "CornerMain chartered panel; the application is UNDER_REVIEW and both samples are still PENDING_SCREEN"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
          trigger:
            - { call: "POST /grants/applications/${app}/submit", payload: {}, as: Artist, as_user_id: "${art}" }
            - { call: "POST /grants/panelists/${pl1}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/work-samples/${ws1}/screen", payload: { disposition: CLEARED }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/work-samples/${ws1}/screen", payload: { disposition: CLEARED }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/conflicts", payload: { panelist_id: "${pl2}", application_id: "${app}", relationship_type: CO_AUTHOR, disclosure_note: "We co-edited an anthology in 2019." }, as: Panelist, as_user_id: "${pl2}", captures: { cf_n: "$.data.id" } }
            - { call: "POST /grants/conflicts/${cf_n}/screen", payload: { disposition: WAIVED, override_justification: "Single anthology credit six years ago; no ongoing professional relationship." }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/conflicts/${cf_n}/screen", payload: { disposition: WAIVED, override_justification: "Single anthology credit six years ago; no ongoing professional relationship." }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/panels/${pan}/charter", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "Re-submit: 409 ERR_APPLICATION_STATE_INVALID (the application is UNDER_REVIEW)"
            - "Re-seat: 409 ERR_PANELIST_STATE_INVALID (the panelist is SEATED)"
            - "First screen: 200 with status \"CLEARED\" and screened_by == \"officer-1\"; second screen: 409 ERR_WORK_SAMPLE_STATE_INVALID"
            - "The conflict is created with severity \"DISCRETIONARY\"; the first screen returns status \"WAIVED\"; the second returns 409 ERR_CONFLICT_STATE_INVALID"
            - "Re-charter: 409 ERR_PANEL_STATE_INVALID, and the panel still reports assigned_application_count == 1 (no second assignment pass ran)"

      - name: withdrawn_application_is_terminal_and_rejects_every_later_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Application.terminal_states
          - state_machines.Application.DRAFT_to_WITHDRAWN
          - errors[ERR_APPLICATION_STATE_INVALID]
        distinguishing_aspect: |
          Withdrawal from DRAFT must reject the samples (work_sample_count back
          to 0) and then refuse both submit and a second withdraw with
          ERR_APPLICATION_STATE_INVALID. An implementation treating WITHDRAWN as
          just another non-final state lets the submit through and mints a
          sealed_alias, which the assert catches.
        test_recipe:
          setup:
            - "CornerMain cycle OPEN with one DRAFT application carrying two PENDING_SCREEN samples"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
          trigger:
            - { call: "POST /grants/applications/${app}/withdraw", payload: {}, as: Artist, as_user_id: "${art}" }
            - { call: "GET /grants/work-samples/${ws1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/applications/${app}/submit", payload: {}, as: Artist, as_user_id: "${art}" }
            - { call: "POST /grants/applications/${app}/withdraw", payload: {}, as: Artist, as_user_id: "${art}" }
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The withdraw returns 200 with status \"WITHDRAWN\" and work_sample_count == 0"
            - "The sample read shows status \"REJECTED\""
            - "Both later actions return 409 ERR_APPLICATION_STATE_INVALID"
            - "The final read still shows status \"WITHDRAWN\", sealed_alias == null and submitted_at == null"

      - name: triggers_absent_from_the_transition_table_are_rejected_per_entity
        claim_type: invalid_transitions
        grounds:
          - state_machines.FellowshipCycle.OPEN_to_CLOSED
          - state_machines.Panel.CHARTERED_to_SCORING
          - validations[priority=65]
        distinguishing_aspect: |
          OPEN -> AWARDED, close-round on a FORMING panel and an eligibility
          determination on a DRAFT application are all absent from the tables and
          must each fail at priority 65 with the entity's own state error. The
          eligibility case is the discriminator: priority 65 fires
          ERR_APPLICATION_STATE_INVALID even though the cycle-state rule at
          priority 70 (which wants CLOSED or PANEL_REVIEW) is also violated.
        test_recipe:
          setup:
            - "CornerMain cycle OPEN, one DRAFT application, one FORMING panel with no seats"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - { call: "POST /grants/panels", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", required_seats: 3, required_regions: [NORTH, CENTRAL, SOUTH], deliberation_window_start: "2026-11-01T00:00:00Z", deliberation_window_end: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pan_x: "$.data.id" } }
          trigger:
            - { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: AWARDED }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/panels/${pan_x}/close-round", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/applications/${app}/eligibility", payload: { determination: ELIGIBLE }, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "409 ERR_CYCLE_STATE_INVALID — OPEN -> AWARDED is not a declared transition"
            - "409 ERR_PANEL_STATE_INVALID — close-round is only defined from SCORING"
            - "409 ERR_APPLICATION_STATE_INVALID (priority 65), NOT ERR_CYCLE_STATE_INVALID (priority 70)"
            - "The cycle is still \"OPEN\", the panel still \"FORMING\" and the application still \"DRAFT\""

      - name: cancelling_an_open_cycle_withdraws_draft_and_submitted_applications
        claim_type: cascade_down
        grounds:
          - state_machines.FellowshipCycle.OPEN_to_CANCELLED
          - state_machines.Application.SUBMITTED_to_WITHDRAWN
          - calculations.cycle_budget_posture
        distinguishing_aspect: |
          Cancellation must sweep BOTH the DRAFT and the SUBMITTED application to
          WITHDRAWN in created_at ASC order, reject their pending samples, and
          drive posture to FROZEN while the ledger stays at reserve 300_000 /
          committed 0. An implementation that only cascades to DRAFT rows, or
          that leaves posture OPEN, fails.
        test_recipe:
          setup:
            - "CornerMain cycle OPEN with one SUBMITTED application (created first) and one DRAFT application"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - { call: "POST /grants/artists", payload: { legal_name: "Jun Park", email: "jun.park@example.org", residency_start_date: "2020-02-02", residency_county: "Harbor", region: CENTRAL }, as: ProgramOfficer, as_user_id: "officer-1", captures: { art_j2: "$.data.id" } }
            - { call: "POST /grants/applications", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", artist_id: "${art_j2}", artist_statement: "An unfinished novel in letters.", career_narrative: "Nine years of literary translation." }, as: Artist, as_user_id: "${art_j2}", captures: { app_j2: "$.data.id" } }
          trigger:
            - { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: CANCELLED }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app_j2}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/work-samples/${ws2}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The status response shows status \"CANCELLED\" and posture \"FROZEN\""
            - "reserve_cents == 300000, committed_cents == 0, funded_total_cents == 0 (cancellation is not a fiscal event)"
            - "Both applications now read status \"WITHDRAWN\""
            - "The submitted application's sample reads status \"REJECTED\""

      - name: clock_advance_past_the_acceptance_window_forfeits_the_unaccepted_offer
        claim_type: side_effect_execution
        grounds:
          - state_machines.Award.OFFERED_to_FORFEITED
          - endpoints[POST /_clock/set_current_utc]
          - validations[error_id=ERR_ACCEPTANCE_DEADLINE_PASSED]
        distinguishing_aspect: |
          One clock call at 2026-11-01 must report the award in
          forfeited_award_ids and unwind four rows: award FORFEITED, application
          NOT_AWARDED, slot VOIDED and the cycle ledger back to funded_total 0 /
          committed 0 / available 5_700_000. The late accept then reports
          ERR_ACCEPTANCE_DEADLINE_PASSED (priority 64) rather than the generic
          state error at priority 65.
        test_recipe:
          setup:
            - "CornerMain through board approval: award OFFERED with acceptance_deadline_at 2026-10-30 and the cycle in BOARD_REVIEW"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
            - *n_srev1
            - *n_rev2
            - *n_srev2
            - *n_rev3
            - *n_srev3
            - *n_closeround
            - &n_board { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: BOARD_REVIEW }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &n_getpan { call: "GET /grants/panels/${pan}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1", captures: { pan_v: "$.data.version" } }
            - &n_slate { call: "POST /grants/panels/${pan}/slate", payload: { ranked_application_ids: ["${app}"], expected_panel_version: "${pan_v}" }, as: Panelist, as_user_id: "${pl1}" }
            - &n_getslot { call: "GET /grants/recommendation-slots", payload: { application_id: "${app}" }, as: ProgramOfficer, as_user_id: "officer-1", captures: { slot: "$.data[0].id" } }
            - &n_getcyc { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1", captures: { cyc_v: "$.data.version" } }
            - &n_approve { call: "POST /grants/recommendation-slots/${slot}/board-action", payload: { action: APPROVE, expected_cycle_version: "${cyc_v}" }, as: CouncilBoardMember, as_user_id: "board-1" }
            - &n_getaw { call: "GET /grants/awards", payload: { application_id: "${app}" }, as: ProgramOfficer, as_user_id: "officer-1", captures: { aw: "$.data[0].id" } }
