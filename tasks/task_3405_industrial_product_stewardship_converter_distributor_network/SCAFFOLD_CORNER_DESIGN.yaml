            - "fc-1 activation: 200, RebateProgram.${prog_id}.status == ACTIVE"

  # ===========================================================================
  - section: errors
    instances:
      - name: err_order_compliance_blocked_trigger
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ORDER_COMPLIANCE_BLOCKED
        excluded_because:
          difficulty_instance: order_fulfillment_and_compliance_axes_move_independently
          rationale: "Asserted as the failure path of the named §1.8 instance (advance on FLAGGED order returns it)."

      - name: err_ltb_window_closed_trigger
        claim_type: violation_to_error
        grounds:
          - errors.ERR_LTB_WINDOW_CLOSED
        excluded_because:
          difficulty_instance: ltb_deadline_inclusive_at_exact_deadline
          rationale: "Asserted as the failure path one second past the deadline in the named §1.8 instance."

      - name: err_bench_capacity_exceeded_trigger
        claim_type: violation_to_error
        grounds:
          - errors.ERR_BENCH_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: bench_capacity_admits_exactly_eight_hours
          rationale: "Asserted on the 8.5h tipping booking in the named §1.8 instance."

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: orders_list_paginates_with_total_count_and_has_more
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/stewardship/orders
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three orders, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count spans the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Clock 2026-10-01. ACTIVE formulation; distributor agreement; three orders created."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - *k_clear
            - *k_decide
            - *k_dist
            - *k_ag_std
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 1, requested_ship_date: "2026-11-01T00:00:00Z", expected_price_agreement_version: "${ag_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "GET /stewardship/price-agreements/${ag_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag_v2: $.data.version }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 2, requested_ship_date: "2026-11-02T00:00:00Z", expected_price_agreement_version: "${ag_v2}" }
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "GET /stewardship/price-agreements/${ag_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag_v3: $.data.version }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 3, requested_ship_date: "2026-11-03T00:00:00Z", expected_price_agreement_version: "${ag_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
          trigger:
            - call: "GET /stewardship/orders"
              payload: { distributor_id: "${dist_id}", limit: 2, offset: 0 }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "GET /stewardship/orders"
              payload: { distributor_id: "${dist_id}", limit: 2, offset: 2 }
              as: ChannelManager
              as_user_id: "cm-1"
          assert:
            - "page 1: response_type array, exactly 2 rows, total_count == 3, has_more == true"
            - "page 2: exactly 1 row, total_count == 3, has_more == false"
            - "no filters: GET /stewardship/orders returns 3 rows with default limit 10 / offset 0"

      - name: occ_successor_create_with_stale_formulation_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[successor-create-stale-formulation]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on Formulation.version: the first successor create succeeds and bumps the predecessor to version 2; a second create still carrying expected_formulation_version from before is rejected 412 ERR_STALE_VERSION — two strictly sequential requests, no overlap."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Root formulation F-100 at version 1."
          setup_api_calls:
            - *k_clock
            - *k_form
          trigger:
            - call: "POST /stewardship/formulations/${f_id}/successors"
              payload: { product_code: "F-100R", name: "Reformulated base", base_polymer_family: "acrylic", expected_formulation_version: "${f_v}" }
              as: ProductManager
              captures: { fs_id: $.data.id }
            - call: "POST /stewardship/formulations/${f_id}/successors"
              payload: { product_code: "F-100R2", name: "Second reformulation", base_polymer_family: "acrylic", expected_formulation_version: "${f_v}" }
              as: ProductManager
              captures: { stale_err: $.data.error_id }
          assert:
            - "first successor: 201 (${fs_id}); predecessor version now 2"
            - "second successor with stale expected version ${f_v}: 412 ERR_STALE_VERSION (actual ${stale_err})"

      - name: occ_authorization_create_with_stale_converter_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[authorization-create-stale-converter]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on Converter.version via POST /converter-authorizations: a first grant succeeds and bumps the converter; a second grant with the pre-first version fails 412 even though the converter is still AUTHORIZED and the window would not overlap (different capability)."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Converter AUTHORIZED; version captured at authorization."
          setup_api_calls:
            - *k_clock
            - call: "POST /stewardship/converters"
              payload: { name: "ConvertOne GmbH", home_territory_code: "DE" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { conv_id: $.data.id }
            - call: "POST /stewardship/converters/${conv_id}/record-audit"
              payload: { audit_score: 80, audit_standard: "ISO9001" }
              as: QualityAuditor
              as_user_id: "qa-1"
            - call: "POST /stewardship/converters/${conv_id}/authorize"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { conv_v: $.data.version }
          trigger:
            - call: "POST /stewardship/converter-authorizations"
              payload: { converter_id: "${conv_id}", capability: "SLITTING", territory_code: "DE", valid_from: "2026-10-01T00:00:00Z", valid_to: "2027-04-01T00:00:00Z", expected_converter_version: "${conv_v}" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { az1: $.data.id }
            - call: "POST /stewardship/converter-authorizations"
              payload: { converter_id: "${conv_id}", capability: "LAMINATION", territory_code: "DE", valid_from: "2026-10-01T00:00:00Z", valid_to: "2027-04-01T00:00:00Z", expected_converter_version: "${conv_v}" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { stale2_err: $.data.error_id }
          assert:
            - "first grant: 201 (${az1}); Converter.${conv_id}.version incremented"
            - "second grant with stale version: 412 ERR_STALE_VERSION (actual ${stale2_err})"

      - name: occ_order_create_with_stale_agreement_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-create-stale-agreement]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on PriceAgreement.version via POST /orders: the first order succeeds and bumps the agreement; a second order with the pre-first version fails 412 even though every business field of the agreement is unchanged."
        test_recipe:
          setup:
            - "Clock 2026-10-01. ACTIVE formulation; distributor STANDARD agreement at version 1."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - *k_clear
            - *k_decide
            - *k_dist
            - *k_ag_std
          trigger:
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 1, requested_ship_date: "2026-11-01T00:00:00Z", expected_price_agreement_version: "${ag_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { oo1: $.data.id }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 1, requested_ship_date: "2026-11-01T00:00:00Z", expected_price_agreement_version: "${ag_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { stale3_err: $.data.error_id }
          assert:
            - "first order: 201 (${oo1})"
            - "second order with stale expected version ${ag_v}: 412 ERR_STALE_VERSION (actual ${stale3_err})"

      - name: active_clearance_count_reconciles_across_jurisdictions
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Formulation.fields.active_clearance_count
          - state_machines.JurisdictionClearance.SUBMITTED_to_CLEARED
        distinguishing_aspect: "The denormalized counter tracks each decision: 0 at creation, 1 after the DE clearance clears, 2 after a second US clearance clears — recomputed per event, readable immediately."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Formulation DRAFT; jurisdictions DE and US."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - call: "POST /stewardship/jurisdictions"
              payload: { code: "US", name: "United States", declaration_threshold_ppm: 500, full_disclosure_threshold_ppm: 5000 }
              as: PlatformAdmin
              captures: { jur_us: $.data.id }
            - *k_clear
          trigger:
            - call: "POST /stewardship/clearances/${cl_id}/decision"
              payload: { decision: "CLEARED" }
              as: RegulatoryManager
              as_user_id: "rm-1"
            - call: "POST /stewardship/clearances"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_us}", disclosure_package_level: "EXEMPT" }
              as: ProductManager
              captures: { cl_us: $.data.id }
            - call: "POST /stewardship/clearances/${cl_us}/decision"
              payload: { decision: "CLEARED" }
              as: RegulatoryManager
              as_user_id: "rm-1"
          assert:
            - "before any decision: Formulation.${f_id}.active_clearance_count == 0"
            - "after DE CLEARED: active_clearance_count == 1 and status ACTIVE (first-clearance bubble-up)"
            - "after US CLEARED: active_clearance_count == 2"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a mutation's effects are visible in the very next read — the record-audit response and a following GET agree on status AUDIT_RECORDED, quality_audit_score 88 and audited_by qa-3, with version advanced exactly once."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Converter created (version 1, APPLIED)."
          setup_api_calls:
            - *k_clock
            - call: "POST /stewardship/converters"
              payload: { name: "ConvertOne GmbH", home_territory_code: "DE" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { conv_id: $.data.id }
          trigger:
            - call: "POST /stewardship/converters/${conv_id}/record-audit"
              payload: { audit_score: 88, audit_standard: "ISO9001" }
              as: QualityAuditor
              as_user_id: "qa-3"
              captures: { post_status: $.data.status, post_v: $.data.version }
            - call: "GET /stewardship/converters/${conv_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { get_v: $.data.version }
          assert:
            - "mutation response: status == AUDIT_RECORDED (actual ${post_status}), version == 2 (actual ${post_v})"
            - "immediately following GET: identical status/score/audited_by and version == 2 (actual ${get_v}) — no lag, no recompute drift"
