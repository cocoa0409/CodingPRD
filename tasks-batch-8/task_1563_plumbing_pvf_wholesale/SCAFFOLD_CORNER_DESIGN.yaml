        test_recipe:
          setup: ["slot capacity 100; order submitted (version ${ov}); no booking yet"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 5 }, as: WarehouseLead }
            - { call: "POST /pvf/branches/${b}/delivery-slots", payload: { truck_label: "T1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z", capacity_cubes: 100 }, as: BranchManager, captures: { slot: $.data.id } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep, captures: { ov: $.data.version } }
          trigger:
            - call: "POST /pvf/orders/${ord}/delivery-booking"
              payload: { slot_id: "${slot}", expected_order_version: "${ov} - 1" }
              as: CounterRep
              captures: { err: $.data.error_id }
            - call: "POST /pvf/orders/${ord}/delivery-booking"
              payload: { slot_id: "${slot}", expected_order_version: "${ov}" }
              as: CounterRep
              captures: { ov2: $.data.version, slotref: $.data.delivery_slot_id }
          assert:
            - "stale version: error_id == ERR_STALE_ORDER_VERSION with http 412; slot.booked_cubes unchanged (0)"
            - "current version: 200, delivery_slot_id == ${slot}, order version == ${ov} + 1"

      - name: occ_stale_substitute_decision_rejected
