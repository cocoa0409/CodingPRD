  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_cure_payment
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - state_machines.RecoveryCase.CURE_PENDING_to_CURE_EXPIRED
        distinguishing_aspect: |
          Category pair state x business_fiscal: the case has already auto-transitioned
          to CURE_EXPIRED, so a cure payment of 1c violates BOTH the state precondition
          (case not CURE_PENDING) and the fiscal floor (1 < 186,500c cure amount);
          priority 5 must win -> ERR_INVALID_CASE_STATE, never ERR_PAYMENT_INSUFFICIENT.
        test_recipe:
          setup:
            - "Case CURE_PENDING with cure_amount 186,500c; clock advanced to 2026-05-16 (past deadline 2026-05-15T00:00:00Z) so the case auto-transitioned to CURE_EXPIRED"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "SF", state_code: "CA", email: "sf@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000016", governing_state_code: "CA", principal_balance_cents: 2000000, apr_bps: 1200, monthly_payment_cents: 45000, missed_installments: 3, accrued_interest_cents: 60000, late_fees_cents: 12000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_REPO_FEE", amount_cents: 35000 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_STORAGE", amount_cents: 4500 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
          trigger:
            - { call: "POST /recovery-cases/${c_id}/cure-payments", payload: { amount_cents: 1 }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_CASE_STATE  (priority 5 state beats priority 9 fiscal)"
            - "err != ERR_PAYMENT_INSUFFICIENT"
      - name: license_beats_capacity_on_assignment
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: |
          Category pair business_safety x business_constraint (different pair than
          instance 1): the explicitly-named agent is BOTH license-mismatched (TX-only
          license vs CA-governed loan) AND at capacity (max 1, already holding one
          ASSIGNED assignment); priority 6 must win -> ERR_AGENT_LICENSE_MISMATCH,
          never ERR_AGENT_CAPACITY_EXCEEDED.
