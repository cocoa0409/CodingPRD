          assert:
            - "${enChip_status} == \"APPROVED\" and ${enChip_award} == null: on a CHIPPER_DAY program the very same payload without vendor_invoice_cents is legal"
            - "HTTP 422 on the trigger and ${err} == \"ERR_MISSING_VENDOR_INVOICE\" — not 400 ERR_INVALID_REQUEST, because vendor_invoice_cents is an optional input"
            - "SupportProgram.${grant}.budget_remaining_cents is still 500000, reserved_slots == 0 and version is still ${grant_v1}"
            - "${pA_hardship} == false and ${pA_class} == \"HIGH\""
            - "Repeating the trigger with vendor_invoice_cents 200000 returns 200 with status APPROVED, award_before_bonus_cents == 120000, bonus_pct == 0.05, hardship_bonus_cents == 0, award_cents == 120000, reserved_amount_cents == 120000 and SupportProgram.${grant}.budget_remaining_cents == 380000"

      - name: complete_state_gate_outranks_zone_coverage_gate
        claim_type: Cascading validation
        grounds:
          - validations.priority_40
          - validations.priority_56
          - errors[ERR_ZONE_COVERAGE_INCOMPLETE]
          - state_machines.Inspection.NOTICED_to_COMPLETED_FAIL.preconditions
        distinguishing_aspect: |
          Completion runs a ladder of dependent validations: while the inspection is still SCHEDULED the
          answer is 409 ERR_INVALID_STATE regardless of zone coverage; once NOTICED with only two of the
          three zones recorded the answer becomes 422 ERR_ZONE_COVERAGE_INCOMPLETE; only after the third
          zone exists is the FAIL result evaluated at all. Each rung must be cleared before the next is
          reachable, so a flat validation set that reports coverage first is distinguishable.
        test_recipe:
          setup:
            - "Active cycle; one HIGH-risk parcel; an inspection scheduled for 2026-08-20T15:00:00Z that is NOT yet noticed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4601", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { pA: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${pA}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/complete"
              payload: { result: "FAIL", violation_notice_method: "CERTIFIED_MAIL" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { rung1_err: "$.data.error_id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 5.0 }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.0 }
              as: Inspector
              as_user_id: "${insp1}"
          trigger:
            - call: "POST /fire-district/inspections/${ins1}/complete"
              payload: { result: "FAIL", violation_notice_method: "CERTIFIED_MAIL" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { rung2_err: "$.data.error_id" }
          assert:
            - "Rung 1 (SCHEDULED, zero zones) returned HTTP 409 with ${rung1_err} == \"ERR_INVALID_STATE\" — the state gate answered even though coverage was also unmet"
            - "Rung 2 (the trigger: NOTICED, two zones) returns HTTP 422 with ${rung2_err} == \"ERR_ZONE_COVERAGE_INCOMPLETE\""
            - "GET /fire-district/zone-evaluations with inspection_id ${ins1} returns total_count == 2 and Inspection.${ins1}.status == \"NOTICED\" with result == null and completed_at_utc == null"
            - "Parcel.${pA}.compliance_status is still \"PENDING_INSPECTION\" and risk_score_basis is still \"INTAKE_PROVISIONAL\": no cascade ran"
            - "Adding the third ZoneEvaluation (zone ZONE_2, measured_clearance_ft 118.0) and repeating the trigger returns 200 with result FAIL, measured_veg_points == 94.31 and max_deficiency_severity == \"MAJOR\""

  # ==========================================================================
  - section: endpoints
    instances:

      - name: parcel_create_read_update_list_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /fire-district/parcels]
          - endpoints[GET /fire-district/parcels/{parcel_id}]
          - endpoints[PATCH /fire-district/parcels/{parcel_id}]
          - endpoints[GET /fire-district/parcels]
        distinguishing_aspect: |
          The Parcel CRUD surface round-trips: a create returns the intake-scored row, the read returns
          it byte-for-byte, a PATCH of a NON-scoring field (owner_email) bumps version WITHOUT touching
          risk_score, a PATCH of scoring fields rescores to the clamped ceiling 100.00 / EXTREME, and the
          risk_class list filter then finds the row under its NEW band and not its old one. There is no
          delete verb in §1.5 — the inventory is append-only — so the D leg must be absent.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one parcel created with the HIGH intake configuration (slope 30, BRUSH, CLASS_B roof, GATED, hazard_zone HIGH)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4701", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id", created_score: "$.data.risk_score", created_class: "$.data.risk_class", v1: "$.data.version" }
            - call: "GET /fire-district/parcels/${p1}"
              payload: {}
              as: ProgramAdmin
              captures: { read_score: "$.data.risk_score", read_basis: "$.data.risk_score_basis" }
            - call: "PATCH /fire-district/parcels/${p1}"
              payload: { expected_parcel_version: "${v1}", owner_email: "ann.reyes@example.com" }
              as: ProgramAdmin
              captures: { v2: "$.data.version", score_after_email: "$.data.risk_score" }
          trigger:
            - call: "PATCH /fire-district/parcels/${p1}"
              payload: { expected_parcel_version: "${v2}", slope_pct: 50, vegetation_type: "MIXED_CONIFER", roof_class: "NONE", access_constraint: "LOCKED_GATE", hazard_zone: "VERY_HIGH" }
              as: ProgramAdmin
              captures: { v3: "$.data.version", new_score: "$.data.risk_score", new_class: "$.data.risk_class" }
          assert:
            - "${created_score} == 63.83, ${created_class} == \"HIGH\", ${v1} == 1 and ${read_score} == 63.83 with ${read_basis} == \"INTAKE_PROVISIONAL\""
            - "${v2} == 2 and ${score_after_email} == 63.83 — owner_email is not a scoring field, so the row is versioned without rescoring"
            - "${v3} == 3, ${new_score} == 100.00 and ${new_class} == \"EXTREME\": the weighted raw 91.00 is lifted by the VERY_HIGH surcharge and clamped at the 100.00 ceiling"
            - "GET /fire-district/parcels with risk_class \"EXTREME\" returns total_count == 1 containing ${p1}; the same read with risk_class \"HIGH\" returns total_count == 0"
            - "risk_score_basis is still \"INTAKE_PROVISIONAL\" after the rescore: a PATCH never promotes the row to POST_INSPECTION_VERIFIED"
            - "No DELETE verb exists for /fire-district/parcels/{parcel_id}; the row cannot be removed"

      - name: inspection_action_endpoints_drive_declared_transitions
        claim_type: Action endpoint
        excluded_because:
          difficulty_instance: inspection_denial_reschedule_loop_terminates_in_abandoned
          rationale: |
            That §1.8 non_linear_state_machine instance already walks notice, access-denial, reschedule
            and the second access-denial in one chain, asserting the transition each action endpoint
            triggers and the precondition each one enforces.

      - name: cycle_metrics_returns_null_rate_with_no_eligible_parcels
        claim_type: Computed read
        grounds:
          - endpoints[GET /fire-district/inspection-cycles/{cycle_id}/metrics]
          - calculations.program_compliance_metrics
          - entities.InspectionCycle.fields.epoch
        distinguishing_aspect: |
          The metrics endpoint computes on read and never persists: with the district holding exactly one
          PENDING_INSPECTION parcel and one EXEMPT parcel — both excluded from numerator AND denominator —
          it returns eligible_parcel_count 0 with compliance_rate_pct null (NOT 0.00), all three survival
          fields null, and echoes the untouched cycle epoch 0.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; an ACTIVE cycle; parcel A left PENDING_INSPECTION; parcel B flipped to EXEMPT via exemption_flag."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id", epoch0: "$.data.epoch" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4801", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { pA: "$.data.id", pA_status: "$.data.compliance_status" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4802", owner_name: "Ben Ortiz", owner_email: "ben@example.com", situs_address: "14 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "GRASS", slope_pct: 20, lot_area_sqft: 43560, hazard_zone: "MODERATE", access_constraint: "NONE" }
              as: ProgramAdmin
              captures: { pB: "$.data.id", pB_v1: "$.data.version" }
            - call: "PATCH /fire-district/parcels/${pB}"
              payload: { expected_parcel_version: "${pB_v1}", exemption_flag: true }
              as: ProgramAdmin
              captures: { pB_status: "$.data.compliance_status", pB_rank: "$.data.inspection_priority_rank" }
          trigger:
            - call: "GET /fire-district/inspection-cycles/${cyc}/metrics"
              payload: {}
              as: ProgramAdmin
              captures: { eligible: "$.data.eligible_parcel_count", compliant: "$.data.compliant_parcel_count", rate: "$.data.compliance_rate_pct", sc: "$.data.survived_compliant_pct", sn: "$.data.survived_noncompliant_pct", delta: "$.data.survival_delta_pp", epoch: "$.data.epoch" }
          assert:
            - "${pA_status} == \"PENDING_INSPECTION\"; ${pB_status} == \"EXEMPT\" and ${pB_rank} == null"
            - "${eligible} == 0 and ${compliant} == 0"
            - "${rate} == null — an empty eligible set yields null, which is a distinct value from 0.00"
            - "${sc} == null, ${sn} == null and ${delta} == null: every survival denominator is empty"
            - "${epoch} == 0 == ${epoch0}: a metrics read is a pure computation and does not advance the ops-run checkpoint"
            - "Repeating the identical GET returns byte-identical values, confirming nothing was persisted by the first read"

      - name: certificate_issue_permitted_on_exempt_parcel
        claim_type: Conditional action
        grounds:
          - endpoints[POST /fire-district/compliance-certificates/{certificate_id}/decision]
          - errors[ERR_PARCEL_NOT_INSPECTED]
          - entities.ComplianceCertificate.fields.snapshot_compliance_status
        distinguishing_aspect: |
          Issuance is allowed on either of two conditions — a passed inspection OR an exemption on record —
          so an EXEMPT parcel that was never inspected is issued a certificate whose snapshot pins
          compliance_status EXEMPT and risk_class HIGH, while the same request on a PENDING_INSPECTION
          parcel is refused. An implementation that gates on last_passed_inspection_at_utc alone fails.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; a HIGH-risk parcel that has never been inspected, flipped to EXEMPT; a REQUESTED certificate opened by the title agent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4901", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id", p1_v1: "$.data.version", p1_class: "$.data.risk_class" }
            - call: "PATCH /fire-district/parcels/${p1}"
              payload: { expected_parcel_version: "${p1_v1}", exemption_flag: true }
              as: ProgramAdmin
              captures: { p1_status: "$.data.compliance_status", p1_passed: "$.data.last_passed_inspection_at_utc" }
            - call: "POST /fire-district/parcels/${p1}/compliance-certificates"
              payload: { requester_kind: "LENDER", transaction_reference: "LOAN-5521" }
              as: TitleAgent
              captures: { cert1: "$.data.id", cert1_status: "$.data.status" }
          trigger:
            - call: "POST /fire-district/compliance-certificates/${cert1}/decision"
              payload: { decision: "ISSUE", note: "Exemption on file" }
              as: ProgramAdmin
              captures: { st: "$.data.status", issued: "$.data.issued_at_utc", expires: "$.data.expires_at_utc", snap_class: "$.data.snapshot_risk_class", snap_status: "$.data.snapshot_compliance_status" }
          assert:
            - "${p1_class} == \"HIGH\", ${p1_status} == \"EXEMPT\" and ${p1_passed} == null — there is no passed inspection anywhere in the chain"
            - "${cert1_status} == \"REQUESTED\" with every snapshot field null at request time"
            - "HTTP 200, ${st} == \"ISSUED\", ${issued} == \"2026-08-01T00:00:00Z\" and ${expires} == \"2026-10-30T23:59:59Z\" (90 whole days, end-of-day form)"
            - "${snap_class} == \"HIGH\" and ${snap_status} == \"EXEMPT\": the parcel posture is pinned at issuance"
            - "ComplianceCertificate.${cert1}.decision_note == \"Exemption on file\", revoked_at_utc == null and version == 2"
            - "The identical decision on a parcel left PENDING_INSPECTION instead returns 409 ERR_PARCEL_NOT_INSPECTED (see certificate_issue_on_never_inspected_parcel_rejected)"

      - name: discretionary_notice_links_parcel_inspection_and_prior_notice
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /fire-district/parcels/{parcel_id}/violation-notices]
          - state_machines.ViolationNotice.ISSUED_to_VOIDED
          - endpoints[GET /fire-district/violation-notices]
        distinguishing_aspect: |
          The discretionary notice endpoint links three references in one write: the path Parcel, the
          body inspection_id, and — self-referentially — the still-open notice it supersedes, which is
          driven to VOIDED with void_reason SUPERSEDED_BY_NEW_NOTICE while supersedes_notice_id on the new
          row points back at it. open_violation_count must stay 1 (one closed, one opened), never 2, and an
          unknown inspection_id must be refused before any of this happens.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; a HIGH-risk parcel failed on an INITIAL inspection, leaving one ISSUED notice from the FAIL cascade."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
