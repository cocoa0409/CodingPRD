        grounds: [state_machines.SubmissionCycle.OPEN_to_CLOSED, entities.SubmissionCycle.fields.effective_deadline_at, entities.SubmissionBatch.fields.late]
        distinguishing_aspect: "Approving the pending extension moves effective_deadline_at to the requested value; a transmit between the old and new deadlines is then on-time (late == false) and spawns no penalty."
