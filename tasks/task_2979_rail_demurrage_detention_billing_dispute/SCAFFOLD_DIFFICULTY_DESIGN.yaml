      - name: facility_spot_capacity_and_switch_buffer_are_separate_overlap_gates
        grounds:
          - validations.priority_60_facility_spot_and_switch_buffer
          - entities.Facility.fields.occupied_spot_count
          - entities.Facility.fields.car_spot_capacity
          - entities.Facility.fields.switch_buffer_minutes
          - entities.Facility.fields.last_switch_at
          - errors.ERR_FACILITY_SPOT_UNAVAILABLE
          - errors.ERR_FACILITY_SWITCH_BUFFER
        distinguishing_aspect: |
          One priority hosts two different overlap tests against the same shared
          resource, and they fail in sequence rather than together: while car A
          occupies the single spot the aggregate count test fires
          (ERR_FACILITY_SPOT_UNAVAILABLE), and once A leaves at 12:00:00Z the
          count test passes but a 120-minute switch buffer measured from
          last_switch_at fires instead (ERR_FACILITY_SWITCH_BUFFER at
          13:59:59.999Z, clear at exactly 14:00:00.000Z). The resource is
          therefore unavailable for two hours AFTER it is empty.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T14:00:00Z"
            - "one INDUSTRY_TRACK Facility with car_spot_capacity 1 and switch_buffer_minutes 120"
            - "cycle A is ACTUALLY_PLACED at 2026-08-03T10:00:00Z, so occupied_spot_count is 1 and last_switch_at is 2026-08-03T10:00:00.000Z"
