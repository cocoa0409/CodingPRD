        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_SLATE_UNDERFILLED]
        distinguishing_aspect: |
          Pair business_safety vs business_constraint: the lock request violates
          segregation-of-duties (locker == last entry adder) AND is underfilled
          (1 entry vs capacity 2); priority 8 safety wins over priority 10
          constraint, so ERR_SEGREGATION_OF_DUTIES surfaces, not
          ERR_SLATE_UNDERFILLED.
        test_recipe:
          setup:
