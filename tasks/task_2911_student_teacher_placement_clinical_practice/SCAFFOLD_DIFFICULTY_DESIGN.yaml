  - rule_id: cross_entity_state_dependency
    instances:
      - name: placement_confirmation_gated_on_cooperating_teacher_training_state
        grounds:
          - "state_machines.CooperatingTeacher"
          - "state_machines.Placement"
          - "validations[priority=22]"
          - "errors.ERR_TEACHER_TRAINING_EXPIRED"
          - "endpoints.POST /epp/placements/{placement_id}/confirm"
          - "entities.CooperatingTeacher.training_expires_on"
        distinguishing_aspect: |
          Entity pair: PLACEMENT depends on COOPERATING TEACHER. The placement's own row is untouched and
          perfectly confirmable - it is PROPOSED under an ACTIVE in-window agreement with a READY
          candidate - but the teacher's mentor training lapsed on 2026-11-15 (completed 2024-11-15 plus
          TRAINING_VALID_DAYS = 730), and the clock has moved to 2026-11-16. Reading the teacher lazily
          flips it QUALIFIED -> TRAINING_EXPIRED and the confirmation is refused. The routing call earlier
          in the setup succeeded because the clock was still 2026-08-01, which proves the dependency is on
          the *other* entity's clock-dependent state and not on any placement field. The sibling instance
          is the opposite arrangement - a child assessment depending on its parent placement's clinical
          state - so the entity pair and the direction of the dependency both differ.
        test_recipe:
          setup:
            - "Build the base fixture at clock 2026-08-01T00:00:00Z, but record the teacher's training completion on 2024-11-15 so training_expires_on is 2026-11-15."
            - "Route a 14-week placement while the teacher is still QUALIFIED, producing a PROPOSED placement."
            - "Advance the clock to 2026-11-16T00:00:00Z, one day past the teacher's training expiry."
