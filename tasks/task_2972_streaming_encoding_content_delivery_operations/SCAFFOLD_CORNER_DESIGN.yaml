        distinguishing_aspect: "Rule uniqueness is on the (region_code, subscription_tier, device_class_scope) triple only — a second '*'/ANY/ALL rule is ERR_DUPLICATE_ENTITLEMENT_RULE even with a different priority, yet the same '*'/ANY pair with device_class_scope TV_ONLY is accepted, taking entitlement_rule_count to 2."
