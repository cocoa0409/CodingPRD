          setup:
            - "Parcel P ACQUIRED; phase ACTIVE with 4 lots; agreement AG ACTIVE (min 1/quarter, scheduled 4); loan LN ACTIVE with one FUNDED draw (net 1890500); HOA formed and in DECLARANT_CONTROL with default threshold 7500bp"
