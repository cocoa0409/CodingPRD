            - { call: "POST /cart-runs/${r2}/recount", payload: { corrected_soiled_lines: [ { stock_id: "${s1}", pieces: 6 } ] }, as: UnitClerk, as_user_id: "${u1}", captures: { st2: $.data.status } }
            - { call: "POST /cart-runs/${r2}/dispute", payload: {}, as: UnitClerk, as_user_id: "${u1}", captures: { st3: $.data.status } }
            - { call: "POST /cart-runs/${r2}/recount", payload: { corrected_soiled_lines: [ { stock_id: "${s1}", pieces: 6 } ] }, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /cart-runs/${r2}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}", captures: { st4: $.data.status } }
