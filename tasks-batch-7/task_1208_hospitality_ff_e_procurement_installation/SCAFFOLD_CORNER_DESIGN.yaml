      - name: project_cancel_blocked_by_active_pos
        claim_type: precondition_enforcement
        grounds: ["state_machines.FFEProject.PROCUREMENT_to_CANCELLED", "errors[ERR_ACTIVE_POS_EXIST]"]
        distinguishing_aspect: "A project cannot be cancelled once a PO has reached READY_TO_SHIP or beyond; the guard inspects child PO fulfillment state."
        test_recipe:
