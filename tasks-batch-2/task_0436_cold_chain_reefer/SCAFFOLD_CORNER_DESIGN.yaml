scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_carrier_returns_201_with_defaults_applied
        claim_type: Creation
        grounds: [entities.Carrier, endpoints]
        distinguishing_aspect: "POST /carriers with only legal_name returns 201; fsma_registered defaults false, sanitary_training_current defaults false, liability_cap_cents defaults 5000000; id/created_at/version system-generated (version 1)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /carriers"
              payload: { legal_name: "Solo Carrier" }
              as: Carrier
              as_user_id: "carrier-c1"
              captures: { cid: $.data.id, fsma: $.data.fsma_registered, cap: $.data.liability_cap_cents, ver: $.data.version }
          assert:
            - "response status == 201"
            - "Carrier.${cid}.fsma_registered == false"
            - "Carrier.${cid}.sanitary_training_current == false"
            - "Carrier.${cid}.liability_cap_cents == 5000000"
            - "Carrier.${cid}.version == 1"

      - name: get_nonexistent_shipment_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Shipment", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /shipments/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /shipments/11111111-1111-4111-8111-111111111111"
              as: Shipper
              as_user_id: "shipper-c2"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_shipment_missing_cargo_class_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Shipment.fields.cargo_class", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /shipments missing the required cargo_class field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A carrier exists."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Req Carrier" }
              as: Carrier
              as_user_id: "carrier-c3"
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}" }
              as: Shipper
              as_user_id: "shipper-c3"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_shipment_invalid_cargo_class_enum_rejected
        claim_type: Type Constraints
        grounds: ["entities.Shipment.fields.cargo_class", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /shipments with cargo_class outside {FOOD,PHARMA,GENERAL} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A carrier exists."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Enum Carrier" }
              as: Carrier
              as_user_id: "carrier-c4"
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}", cargo_class: "LIVESTOCK" }
              as: Shipper
              as_user_id: "shipper-c4"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: shipper_user_id_stamped_from_header_input_ignored
        claim_type: System Fields
        grounds: [entities.Shipment.fields.shipper_user_id]
        distinguishing_aspect: "POST /shipments stamps shipper_user_id from X-User-ID; the field is source:system and not client-settable."
        test_recipe:
          setup: ["A carrier exists."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Stamp Carrier" }
              as: Carrier
              as_user_id: "carrier-c5"
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}", cargo_class: "GENERAL" }
              as: Shipper
              as_user_id: "shipper-c5"
              captures: { sid: $.data.id, owner: $.data.shipper_user_id }
          assert:
            - "Shipment.${sid}.shipper_user_id == shipper-c5 (stamped from X-User-ID)"

      - name: list_carriers_pagination_envelope
        claim_type: Listing
        grounds: [entities.Carrier, endpoints]
        distinguishing_aspect: "GET /carriers returns response_type array with pagination fields limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Two carriers exist."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "C-A" }
              as: PlatformAdmin
              as_user_id: "admin-c6"
            - call: "POST /carriers"
              payload: { legal_name: "C-B" }
              as: PlatformAdmin
              as_user_id: "admin-c6"
          trigger:
            - call: "GET /carriers"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-c6"
          assert:
            - "response_type == array"
            - "meta.total_count == 2 and has_more == true (limit 1 of 2)"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: dispatch_from_accepted_skipping_precool_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Shipment.PRECOOLED_to_IN_TRANSIT", "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_safety_on_dispatch_wrong_state_and_no_fsma
          rationale: "The state-priority dispatch-from-ACCEPTED rejection (ERR_INVALID_STATE) is exercised as the winning error of that §1.8 instance."

      - name: reject_an_already_rejected_shipment_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Shipment.TENDERED_to_REJECTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal; a second POST /shipments/{id}/reject returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A TENDERED shipment is rejected once."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Term Carrier" }
              as: Carrier
              as_user_id: "carrier-c7"
              captures: { cid: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}", cargo_class: "GENERAL" }
              as: Shipper
              as_user_id: "shipper-c7"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/reject"
              as: Carrier
              as_user_id: "carrier-c7"
          trigger:
            - call: "POST /shipments/${sid}/reject"
              as: Carrier
              as_user_id: "carrier-c7"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: new_shipment_starts_in_tendered
        claim_type: Initial State
        grounds: [entities.Shipment.fields.status, state_machines.Shipment]
        distinguishing_aspect: "A freshly created shipment has status == TENDERED and load_integrity_posture defaults to INTACT, precool_verified false."
        test_recipe:
          setup: ["A carrier exists."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Init Carrier" }
              as: Carrier
              as_user_id: "carrier-c8"
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}", cargo_class: "PHARMA" }
              as: Shipper
              as_user_id: "shipper-c8"
              captures: { st: $.data.status, pre: $.data.precool_verified }
          assert:
            - "Shipment.status == TENDERED"
            - "Shipment.precool_verified == false"

      - name: precool_verify_before_readings_returns_precool_incomplete
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Shipment.ACCEPTED_to_PRECOOLED", "validations[priority=9]", "errors[ERR_PRECOOL_INCOMPLETE]"]
        distinguishing_aspect: "precool-verify on an ACCEPTED shipment whose compartment has no in-band PRECOOL reading returns ERR_PRECOOL_INCOMPLETE (422)."
        test_recipe:
          setup: ["An ACCEPTED shipment with one compartment but no PRECOOL reading."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Pre Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-c9"
              captures: { cid: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lid: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${cid}", asset_tag: "RU-C9", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-c9"
              captures: { uid: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-c9"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/compartments"
              payload: { temp_lane_id: "${lid}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-c9"
            - call: "GET /shipments/${sid}"
              as: Carrier
              as_user_id: "carrier-c9"
              captures: { sv: $.data.version }
            - call: "POST /shipments/${sid}/accept"
              payload: { reefer_unit_id: "${uid}", expected_shipment_version: "${sv}" }
              as: Carrier
              as_user_id: "carrier-c9"
          trigger:
            - call: "POST /shipments/${sid}/precool-verify"
              as: Carrier
              as_user_id: "carrier-c9"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_PRECOOL_INCOMPLETE"

      - name: dispatch_food_with_lapsed_sanitary_training_returns_lapsed
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Shipment.PRECOOLED_to_IN_TRANSIT", "validations[priority=7]", "errors[ERR_SANITARY_TRAINING_LAPSED]"]
        distinguishing_aspect: "Dispatch of FOOD cargo when Carrier.sanitary_training_current == false (but fsma_registered true) returns ERR_SANITARY_TRAINING_LAPSED (422)."
        test_recipe:
          setup: ["A PRECOOLED FOOD shipment; carrier fsma_registered true, sanitary_training_current false."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "San Carrier", fsma_registered: true, sanitary_training_current: false }
              as: Carrier
              as_user_id: "carrier-c10"
              captures: { cid: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lid: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${cid}", asset_tag: "RU-C10", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-c10"
              captures: { uid: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-c10"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/compartments"
              payload: { temp_lane_id: "${lid}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-c10"
              captures: { compid: $.data.id }
            - call: "GET /shipments/${sid}"
              as: Carrier
              as_user_id: "carrier-c10"
              captures: { sv: $.data.version }
            - call: "POST /shipments/${sid}/accept"
              payload: { reefer_unit_id: "${uid}", expected_shipment_version: "${sv}" }
              as: Carrier
              as_user_id: "carrier-c10"
            - call: "POST /compartments/${compid}/readings"
              payload: { kind: "PRECOOL", offset_min: 0, temp_c: -20 }
              as: Carrier
              as_user_id: "carrier-c10"
            - call: "POST /shipments/${sid}/precool-verify"
              as: Carrier
              as_user_id: "carrier-c10"
          trigger:
            - call: "POST /shipments/${sid}/dispatch"
              as: Carrier
              as_user_id: "carrier-c10"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_SANITARY_TRAINING_LAPSED"

      - name: dispatch_with_undocumented_sanitation_returns_undocumented
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Shipment.PRECOOLED_to_IN_TRANSIT", "validations[priority=8]", "errors[ERR_SANITATION_UNDOCUMENTED]"]
        distinguishing_aspect: "Dispatch when the assigned ReeferUnit has no last_sanitation_at returns ERR_SANITATION_UNDOCUMENTED (422)."
        test_recipe:
          setup: ["A PRECOOLED FOOD shipment on a unit created without last_sanitation_at."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Undoc Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-c11"
              captures: { cid: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lid: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${cid}", asset_tag: "RU-C11", compartment_count: 1 }
              as: Carrier
              as_user_id: "carrier-c11"
              captures: { uid: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-c11"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/compartments"
              payload: { temp_lane_id: "${lid}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-c11"
              captures: { compid: $.data.id }
            - call: "GET /shipments/${sid}"
              as: Carrier
              as_user_id: "carrier-c11"
              captures: { sv: $.data.version }
            - call: "POST /shipments/${sid}/accept"
              payload: { reefer_unit_id: "${uid}", expected_shipment_version: "${sv}" }
              as: Carrier
              as_user_id: "carrier-c11"
            - call: "POST /compartments/${compid}/readings"
              payload: { kind: "PRECOOL", offset_min: 0, temp_c: -20 }
              as: Carrier
              as_user_id: "carrier-c11"
            - call: "POST /shipments/${sid}/precool-verify"
              as: Carrier
              as_user_id: "carrier-c11"
          trigger:
            - call: "POST /shipments/${sid}/dispatch"
              as: Carrier
              as_user_id: "carrier-c11"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_SANITATION_UNDOCUMENTED"

      - name: accept_with_unit_too_small_returns_unit_too_small
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Shipment.TENDERED_to_ACCEPTED", "validations[priority=10]", "errors[ERR_UNIT_TOO_SMALL]"]
        distinguishing_aspect: "Accept naming a 1-compartment unit for a 2-compartment shipment returns ERR_UNIT_TOO_SMALL (422) — note this fires only after the referential FK check passes (the unit exists)."
        test_recipe:
          setup: ["A TENDERED shipment with 2 compartments; a real 1-compartment unit."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Small Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-c12"
              captures: { cid: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lid: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${cid}", asset_tag: "RU-C12", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-c12"
              captures: { uid: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-c12"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/compartments"
              payload: { temp_lane_id: "${lid}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-c12"
            - call: "POST /shipments/${sid}/compartments"
              payload: { temp_lane_id: "${lid}", ordinal: 2 }
              as: Shipper
              as_user_id: "shipper-c12"
            - call: "GET /shipments/${sid}"
              as: Carrier
              as_user_id: "carrier-c12"
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /shipments/${sid}/accept"
              payload: { reefer_unit_id: "${uid}", expected_shipment_version: "${sv}" }
              as: Carrier
              as_user_id: "carrier-c12"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_UNIT_TOO_SMALL"

      - name: duplicate_compartment_ordinal_rejected
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_ORDINAL]", "entities.Compartment.fields.ordinal"]
        distinguishing_aspect: "Adding a second compartment with the same ordinal on one shipment returns ERR_DUPLICATE_ORDINAL (422)."
        test_recipe:
          setup: ["A TENDERED shipment with a compartment at ordinal 1."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Dup Carrier" }
              as: Carrier
              as_user_id: "carrier-c13"
              captures: { cid: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lid: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-c13"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/compartments"
              payload: { temp_lane_id: "${lid}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-c13"
          trigger:
            - call: "POST /shipments/${sid}/compartments"
              payload: { temp_lane_id: "${lid}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-c13"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_DUPLICATE_ORDINAL"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: lumper_fee_multitemp_surcharge_correct
        claim_type: Correct Result
        grounds: [calculations.lumper_fee, entities.StopEvent.fields.lumper_fee_cents]
        distinguishing_aspect: "Closing a stop with pallets_handled 12 and compartments_touched 3 yields lumper_fee_cents = 7500 + 12*350 + 2*2500 = 16700."
        test_recipe:
          setup: ["IN_TRANSIT shipment with a DELIVERY stop, arrived 0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Lump Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-c14"
              captures: { cid: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "CHILLED", setpoint_min_c: 0, setpoint_max_c: 4, regulated: true }
              as: PlatformAdmin
              captures: { lid: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${cid}", asset_tag: "RU-C14", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-c14"
              captures: { uid: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-c14"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/compartments"
              payload: { temp_lane_id: "${lid}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-c14"
              captures: { compid: $.data.id }
            - call: "POST /shipments/${sid}/stops"
              payload: { kind: "DELIVERY", appointment_min: 0, pallets_handled: 12, compartments_touched: 3 }
              as: Shipper
              as_user_id: "shipper-c14"
              captures: { stopid: $.data.id }
            - call: "GET /shipments/${sid}"
              as: Carrier
              as_user_id: "carrier-c14"
              captures: { sv: $.data.version }
            - call: "POST /shipments/${sid}/accept"
              payload: { reefer_unit_id: "${uid}", expected_shipment_version: "${sv}" }
              as: Carrier
              as_user_id: "carrier-c14"
            - call: "POST /compartments/${compid}/readings"
              payload: { kind: "PRECOOL", offset_min: 0, temp_c: 2 }
              as: Carrier
              as_user_id: "carrier-c14"
            - call: "POST /shipments/${sid}/precool-verify"
              as: Carrier
              as_user_id: "carrier-c14"
            - call: "POST /shipments/${sid}/dispatch"
              as: Carrier
              as_user_id: "carrier-c14"
            - call: "POST /shipments/${sid}/stops/${stopid}/arrive"
              payload: { arrived_min: 0 }
              as: Driver
              as_user_id: "driver-c14"
          trigger:
            - call: "POST /shipments/${sid}/stops/${stopid}/close"
              payload: { departed_min: 60, pallets_handled: 12, compartments_touched: 3 }
              as: Driver
              as_user_id: "driver-c14"
              captures: { lf: $.data.lumper_fee_cents, df: $.data.detention_fee_cents }
          assert:
            - "StopEvent.${stopid}.lumper_fee_cents == 16700"
            - "StopEvent.${stopid}.detention_fee_cents == 0 (dwell 60 < FREE_TIME_MIN 120)"
            - "Shipment.${sid}.total_lumper_fee_cents == 16700"

      - name: integrity_report_score_within_door_free_allowance
        claim_type: Correct Result
        grounds: [calculations.load_integrity_score, endpoints]
        distinguishing_aspect: "A delivered intact shipment (precool ok, 1 door-open within DOOR_FREE 2, zero degree-minutes) reports load_integrity_score == 100 via GET /shipments/{id}/integrity-report."
        test_recipe:
          setup: ["DELIVERED FROZEN shipment with one in-band TEMP series, 1 DOOR_OPEN event, precool ok."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Score Carrier", fsma_registered: true, sanitary_training_current: true }
