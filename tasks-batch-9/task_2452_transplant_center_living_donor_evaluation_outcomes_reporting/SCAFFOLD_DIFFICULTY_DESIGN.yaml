  - name: attestation_blocked_by_deferred_donor_evaluation
    grounds:
    - validations.priority_12.ERR_CLEARANCE_INCOMPLETE
    - state_machines.DonorEvaluation.SUBMITTED_to_DEFERRED
    - state_machines.DonorCandidate.advocacy.DISCLOSED_to_ATTESTED
    - calculations.donor_overall_status
    distinguishing_aspect: 'Entity pair DonorCandidate <-> DonorEvaluation: whether the advocate may attest
      depends on the state of a SIBLING entity''s rows (the two DonorEvaluation determinations), not on
      anything stored on the donor''s own advocacy dimension. The cooling-off clock is deliberately satisfied
      so the refusal can only come from the evaluation side.'
    test_recipe:
      setup:
      - A non-directed donor candidate with an assigned advocate, disclosed at the default clock 2026-08-01T00:00:00Z
        -> cooling_off_ends_at 2026-08-15T00:00:00Z
      - Its MEDICAL DonorEvaluation is CLEARED (risk_points 0)
      - Its PSYCHOSOCIAL DonorEvaluation was determined DEFERRED, so donor.psychosocial_status is DEFERRED
        and deferral_count is 1
      - The logical clock has been advanced to exactly 2026-08-15T00:00:00Z, so the cooling-off precondition
        is satisfied and ERR_COOLING_OFF_NOT_ELAPSED cannot fire
