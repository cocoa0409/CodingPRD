# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3421_independent_distributor_route_model_stale_product_credit
#
# Breadth probe over §1.1-§1.7 claims not exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Corner-local anchors (&c_*) are defined in
# the first instance that uses them. Corners already covered by §1.8 appear as
# excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: bakery_create_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.Bakery
          - endpoints.POST_/bakeries
        distinguishing_aspect: "A bakery created with name, capacity 100 and the four-sku catalog returns 201 with every field echoed, version 1, and system id/created_at/updated_at — nothing computed is missing."
        test_recipe:
          setup: ["Empty database; logical clock at the server default 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CompanyAdmin
          trigger:
            - &c_bakery
              call: "POST /bakeries"
              payload: { name: "Southwest Bakery", daily_capacity_units: 100, product_catalog: [{ sku: "WHT-24", display_name: "White 24oz", shelf_life_days: 5, list_price_cents: 320 }, { sku: "BUN-12", display_name: "Buns 12pk", shelf_life_days: 4, list_price_cents: 240 }, { sku: "RYE-09", display_name: "Rye 9-grain", shelf_life_days: 7, list_price_cents: 319 }, { sku: "BAG-06", display_name: "Bagels 6pk", shelf_life_days: 3, list_price_cents: 157 }] }
              as: CompanyAdmin
              captures: { bakery_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Bakery.${bakery_id}.name == \"Southwest Bakery\" and daily_capacity_units == 100"
            - "Bakery.${bakery_id}.product_catalog has 4 entries, first entry sku WHT-24 with shelf_life_days 5 and list_price_cents 320"
            - "Bakery.${bakery_id}.version == 1 and id/created_at/updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: distributor_create_applies_system_defaults
        claim_type: Defaults
        grounds:
          - entities.Distributor.fields.status
          - entities.Distributor.fields.classification_status
          - entities.Distributor.fields.account_standing
          - entities.Distributor.fields.trade_balance_cents
        distinguishing_aspect: "A distributor created with only legal_name and credit_limit_cents starts PROSPECT / INDEPENDENT_CONTRACTOR / GOOD with trade_balance_cents 0 — all four system/computed fields come from defaults, not the request."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *c_clock
          trigger:
            - &c_dist
              call: "POST /distributors"
              payload: { legal_name: "RoutePro LLC", credit_limit_cents: 200000 }
              as: CompanyAdmin
              captures: { dist_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Distributor.${dist_id}.status == PROSPECT"
            - "Distributor.${dist_id}.classification_status == INDEPENDENT_CONTRACTOR"
            - "Distributor.${dist_id}.account_standing == GOOD"
            - "Distributor.${dist_id}.trade_balance_cents == 0"

      - name: production_day_capacity_defaults_and_override
        claim_type: Defaults
        grounds:
          - entities.ProductionDay.fields.capacity_units
          - endpoints.POST_/bakeries/{id}/production-days
        distinguishing_aspect: "capacity_units is computed from capacity_override_units when supplied and from the bakery default otherwise: 100 without override, 40 with override 40 — two creations on consecutive dates show both branches."
        test_recipe:
          setup: ["Logical clock 2026-09-01; one bakery with daily_capacity_units 100."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
          trigger:
            - call: "POST /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-04" }
              as: CompanyAdmin
              captures: { pd_a: $.data.id }
            - call: "POST /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-05", capacity_override_units: 40 }
              as: CompanyAdmin
              captures: { pd_b: $.data.id }
          assert:
            - "ProductionDay.${pd_a}.capacity_units == 100 (default from bakery)"
            - "ProductionDay.${pd_b}.capacity_units == 40 (override honored)"
            - "both days start PLANNING with allocated_units == 0 and version == 1"

      - name: agreement_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/agreements/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated agreement id yields 404 ERR_NOT_FOUND from the path-existence check, not a 400 and not a business error."
        test_recipe:
          setup: ["Logical clock 2026-09-01; empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RouteOpsManager
              captures: { nf_err: $.data.error_id }
          assert:
            - "the response status is 404 and nf_err == ERR_NOT_FOUND"
            - "response_type is error and data carries error_id and message"

      - name: order_create_units_total_input_ignored
        claim_type: System Fields
        grounds:
          - entities.DailyOrder.fields.units_total
          - endpoints.POST_/distributors/{id}/orders
        distinguishing_aspect: "units_total is computed; a client-supplied units_total of 999 (and version 99) is ignored — the stored order shows units_total 15 (10+5) and version 1."
        test_recipe:
          setup: ["Active cash agreement for distributor D1; clock 2026-09-01."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - &c_terr
              call: "POST /territories"
              payload: { area_code: "DAL-N", list_price_cents: 25000000 }
              as: CompanyAdmin
              captures: { terr_id: $.data.id }
            - &c_terr_list
              call: "POST /territories/${terr_id}/list-for-sale"
              payload: {}
              as: CompanyAdmin
            - *c_dist
            - &c_agr
              call: "POST /agreements"
              payload: { territory_id: "${terr_id}", distributor_id: "${dist_id}", bakery_id: "${bakery_id}", purchase_price_cents: 1000000, financed_amount_cents: 0, discount_pct: 0.20, start_date: "2026-09-01", end_date: "2027-09-01" }
              as: RouteOpsManager
              captures: { agr_id: $.data.id, agr_v0: $.data.version }
            - &c_activate
              call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: RouteOpsManager
          trigger:
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-04", lines: [{ sku: "WHT-24", qty: 10 }, { sku: "BUN-12", qty: 5 }], units_total: 999, version: 99 }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "the response status is 201"
            - "DailyOrder.${ord_id}.units_total == 15 (computed), not 999"
            - "DailyOrder.${ord_id}.version == 1, not 99"
            - "DailyOrder.${ord_id}.status == DRAFT"

      - name: claim_create_missing_items_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.StaleReturnClaim.fields.items
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "items is required with no default; omitting it is a 400 ERR_INVALID_REQUEST from the shape check (P6), before any window or eligibility logic runs."
        test_recipe:
          setup: ["Active cash agreement for D1."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - *c_agr
            - *c_activate
          trigger:
            - call: "POST /distributors/${dist_id}/stale-claims"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { req_err: $.data.error_id }
          assert:
            - "the response status is 400 and req_err == ERR_INVALID_REQUEST"
            - "GET /distributors/${dist_id}/stale-claims returns 0 rows"

      - name: audit_score_out_of_range_returns_400
        claim_type: Type Constraints
        grounds:
          - errors.ERR_AUDIT_SCORE_RANGE
          - validations[priority=6]
        distinguishing_aspect: "Scores are bounded 0..100 inclusive: 101 and -1 both fail the range check with 400 ERR_AUDIT_SCORE_RANGE while 0 and 100 are accepted."
        test_recipe:
          setup: ["Active cash agreement with retail account; clock 2026-09-01."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - *c_agr
            - *c_activate
            - &c_acct
              call: "POST /distributors/${dist_id}/retail-accounts"
              payload: { store_name: "FreshMart Oak", delivery_weekdays: ["MON", "WED", "FRI"] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /retail-accounts/${acct_id}/audits"
              payload: { audit_date: "2026-09-01", shelf_stock_score: 101, rotation_score: 90, display_score: 90 }
              as: RouteOpsManager
              captures: { range_err: $.data.error_id }
            - call: "POST /retail-accounts/${acct_id}/audits"
              payload: { audit_date: "2026-09-01", shelf_stock_score: 100, rotation_score: 0, display_score: 90 }
              as: RouteOpsManager
          assert:
            - "the 101 audit returns 400 and range_err == ERR_AUDIT_SCORE_RANGE"
            - "the boundary audit with 100 and 0 succeeds (201): composite == round_half_up(0.4*100 + 0.3*0 + 0.3*90) == 67"
            - "RetailAccount.${acct_id}.audit_log has exactly 1 entry"

      - name: order_create_unknown_sku_returns_sku_unknown
        claim_type: Type Constraints
        grounds:
          - errors.ERR_SKU_UNKNOWN
          - validations[priority=9]
        distinguishing_aspect: "Catalog membership is enforced at order creation, not just at submit: sku XXX-99 absent from the bakery catalog fails with 422 ERR_SKU_UNKNOWN before the row is persisted."
        test_recipe:
          setup: ["Active cash agreement for D1; clock 2026-09-01."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - *c_agr
            - *c_activate
          trigger:
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-04", lines: [{ sku: "XXX-99", qty: 1 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { sku_err: $.data.error_id }
          assert:
            - "the response status is 422 and sku_err == ERR_SKU_UNKNOWN"
            - "GET /distributors/${dist_id}/orders returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: settled_transfer_rejects_second_settle
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TerritoryTransfer.PENDING_to_SETTLED
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "SETTLED is terminal: a second settle on the same transfer is 409 ERR_INVALID_STATE_TRANSITION and no fields move (payoff/payout not recomputed)."
        test_recipe:
          setup: ["Financed agreement ACTIVE (plan disbursed 2026-09-01, no payments); exit VOLUNTARY initiated at clock 2026-09-08; transfer settled once."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - &c_agr_fin
              call: "POST /agreements"
              payload: { territory_id: "${terr_id}", distributor_id: "${dist_id}", bakery_id: "${bakery_id}", purchase_price_cents: 1000000, financed_amount_cents: 52000, discount_pct: 0.20, start_date: "2026-09-01", end_date: "2027-09-01" }
              as: RouteOpsManager
              captures: { agrf_id: $.data.id, agrf_v0: $.data.version }
            - &c_plan
              call: "POST /agreements/${agrf_id}/financing-plans"
              payload: { financier_type: "COMPANY", principal_cents: 52000, annual_interest_rate: 0.10, term_weeks: 10, expected_agreement_version: "${agrf_v0}" }
              as: CreditAnalyst
              captures: { plan_id: $.data.id }
            - &c_disburse
              call: "POST /financing-plans/${plan_id}/disburse"
              payload: {}
              as: CreditAnalyst
            - &c_activate_fin
              call: "POST /agreements/${agrf_id}/activate"
              payload: {}
              as: RouteOpsManager
            - &c_clock0908
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T10:00:00Z" }
              as: CompanyAdmin
            - call: "POST /agreements/${agrf_id}/exit"
              payload: { mode: "VOLUNTARY" }
              as: RouteOpsManager
            - call: "GET /agreements/${agrf_id}/transfers"
              payload: {}
              as: CreditAnalyst
              captures: { tr_id: "$.data[0].id" }
            - call: "POST /transfers/${tr_id}/settle"
              payload: {}
              as: CreditAnalyst
          trigger:
            - call: "POST /transfers/${tr_id}/settle"
              payload: {}
              as: CreditAnalyst
              captures: { settle_err: $.data.error_id }
          assert:
            - "the second settle returns 409 and settle_err == ERR_INVALID_STATE_TRANSITION"
            - "TerritoryTransfer.${tr_id}.status == SETTLED with financing_payoff_cents still 52100 and distributor_payout_cents still 947900"

      - name: decide_on_needs_info_claim_not_reviewable
        claim_type: Invalid Transitions
        grounds:
          - state_machines.StaleReturnClaim.SUBMITTED_to_NEEDS_INFO
          - errors.ERR_CLAIM_NOT_REVIEWABLE
        distinguishing_aspect: "decide is only valid from SUBMITTED: a claim already moved to NEEDS_INFO rejects a second decide with 409 ERR_CLAIM_NOT_REVIEWABLE until the distributor resubmits."
        test_recipe:
          setup: ["WHT-24 x5 delivered 2026-09-04; claim WHT-24 x1 pulled 2026-09-10 already moved to NEEDS_INFO."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - *c_agr
            - *c_activate
            - &c_day0904
              call: "POST /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-04" }
              as: CompanyAdmin
              captures: { day0904_id: $.data.id, day0904_v: $.data.version }
            - &c_order_wht5
              call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-04", lines: [{ sku: "WHT-24", qty: 5 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_w5_id: $.data.id }
            - call: "POST /orders/${ord_w5_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /orders/${ord_w5_id}/confirm"
              payload: { expected_production_day_version: "${day0904_v}" }
              as: RouteOpsManager
            - &c_clock0904
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T08:00:00Z" }
              as: CompanyAdmin
            - call: "POST /production-days/${day0904_id}/close"
              payload: {}
              as: CompanyAdmin
            - call: "POST /orders/${ord_w5_id}/record-delivery"
              payload: { delivered_lines: [{ sku: "WHT-24", qty: 5 }] }
              as: Distributor
              as_user_id: "${dist_id}"
            - &c_clock0910
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T09:00:00Z" }
              as: CompanyAdmin
            - &c_claim_w1
              call: "POST /distributors/${dist_id}/stale-claims"
              payload: { items: [{ sku: "WHT-24", delivery_date: "2026-09-04", pulled_qty: 1, pull_date: "2026-09-10" }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { claim_w1_id: $.data.id }
            - call: "POST /stale-claims/${claim_w1_id}/decide"
              payload: { decision: "REQUEST_INFO", decision_note: "need pull photos" }
              as: RouteOpsManager
          trigger:
            - call: "POST /stale-claims/${claim_w1_id}/decide"
              payload: { decision: "APPROVE" }
              as: RouteOpsManager
              captures: { decide_err: $.data.error_id }
          assert:
            - "the second decide returns 409 and decide_err == ERR_CLAIM_NOT_REVIEWABLE"
            - "StaleReturnClaim.${claim_w1_id}.status == NEEDS_INFO (unchanged) and approved_credit_cents is null"

      - name: new_order_starts_draft_with_null_computed_fields
        claim_type: Initial State
        grounds:
          - state_machines.DailyOrder
          - entities.DailyOrder.fields.status
        distinguishing_aspect: "A created order is exactly DRAFT: submitted_on null, total_charge_cents null, shortage_credit_cents 0, cancelled_reason null — the forecast state precedes any firm commitment."
        test_recipe:
          setup: ["Active cash agreement for D1; clock 2026-09-01."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - *c_agr
            - *c_activate
          trigger:
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-04", lines: [{ sku: "BUN-12", qty: 3 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_i_id: $.data.id }
          assert:
            - "DailyOrder.${ord_i_id}.status == DRAFT"
            - "DailyOrder.${ord_i_id}.submitted_on is null and total_charge_cents is null"
            - "DailyOrder.${ord_i_id}.shortage_credit_cents == 0 and cancelled_reason is null"
            - "DailyOrder.${ord_i_id}.units_total == 3"

      - name: record_delivery_before_day_close_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DailyOrder.CONFIRMED_to_DELIVERED
          - errors.ERR_PRODUCTION_DAY_LOCKED
        distinguishing_aspect: "Delivery recording requires the production day CLOSED: against a PLANNING day the transition fails with 409 ERR_PRODUCTION_DAY_LOCKED and the trade ledger does not move."
        test_recipe:
          setup: ["CONFIRMED order for 2026-09-04 whose production day is still PLANNING; clock 2026-09-04."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - *c_agr
            - *c_activate
            - *c_day0904
            - *c_order_wht5
            - call: "POST /orders/${ord_w5_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /orders/${ord_w5_id}/confirm"
              payload: { expected_production_day_version: "${day0904_v}" }
              as: RouteOpsManager
            - *c_clock0904
          trigger:
            - call: "POST /orders/${ord_w5_id}/record-delivery"
              payload: { delivered_lines: [{ sku: "WHT-24", qty: 5 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { del_err: $.data.error_id }
          assert:
            - "the response status is 409 and del_err == ERR_PRODUCTION_DAY_LOCKED"
            - "DailyOrder.${ord_w5_id}.status == CONFIRMED and Distributor.${dist_id}.trade_balance_cents == 0"

      - name: cancel_submitted_order_releases_nothing
        claim_type: Conditional Cascade
        grounds:
          - state_machines.DailyOrder.SUBMITTED_to_CANCELLED
          - entities.ProductionDay.fields.allocated_units
        distinguishing_aspect: "The capacity-release side effect is conditional on the cancelled order having been CONFIRMED: cancelling a merely-SUBMITTED order leaves ProductionDay.allocated_units and version untouched."
        test_recipe:
          setup: ["Production day 2026-09-04 (allocated 0, version 1); a SUBMITTED order never confirmed."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - *c_agr
            - *c_activate
            - *c_day0904
            - *c_order_wht5
            - call: "POST /orders/${ord_w5_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /orders/${ord_w5_id}/cancel"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          assert:
            - "DailyOrder.${ord_w5_id}.status == CANCELLED and cancelled_reason == DISTRIBUTOR_CANCELLED"
            - "ProductionDay.${day0904_id}.allocated_units == 0 and version == 1 (no release side effect fired)"
            - "a second cancel returns 409 ERR_INVALID_STATE_TRANSITION (CANCELLED is terminal)"

      - name: claim_needs_info_resubmit_recomputes_provisional
        claim_type: Valid Transition (cyclic shape)
        grounds:
          - state_machines.StaleReturnClaim.NEEDS_INFO_to_SUBMITTED
          - calculations.stale_credit_amount
        distinguishing_aspect: "The SUBMITTED -> NEEDS_INFO -> SUBMITTED loop re-runs all validations and recomputes the provisional credit from the corrected items: 288 for BUN-12 x2, then 144 after resubmitting x1."
        test_recipe:
          setup: ["BUN-12 x10 delivered 2026-09-07 (cap week 37 = 320); claim filed 2026-09-11 for BUN-12 x2, moved to NEEDS_INFO."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - *c_agr
            - *c_activate
            - &c_day0907
              call: "POST /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-07" }
              as: CompanyAdmin
              captures: { day0907_id: $.data.id, day0907_v: $.data.version }
            - &c_order_bun10
              call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-07", lines: [{ sku: "BUN-12", qty: 10 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_b10_id: $.data.id }
            - call: "POST /orders/${ord_b10_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /orders/${ord_b10_id}/confirm"
              payload: { expected_production_day_version: "${day0907_v}" }
              as: RouteOpsManager
            - &c_clock0907
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T08:00:00Z" }
              as: CompanyAdmin
            - call: "POST /production-days/${day0907_id}/close"
              payload: {}
              as: CompanyAdmin
            - call: "POST /orders/${ord_b10_id}/record-delivery"
              payload: { delivered_lines: [{ sku: "BUN-12", qty: 10 }] }
              as: Distributor
              as_user_id: "${dist_id}"
            - &c_clock0911
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T09:00:00Z" }
              as: CompanyAdmin
            - call: "POST /distributors/${dist_id}/stale-claims"
              payload: { items: [{ sku: "BUN-12", delivery_date: "2026-09-07", pulled_qty: 2, pull_date: "2026-09-11" }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { claim_b_id: $.data.id, claim_b_prov: $.data.provisional_credit_cents }
            - call: "POST /stale-claims/${claim_b_id}/decide"
              payload: { decision: "REQUEST_INFO" }
              as: RouteOpsManager
          trigger:
            - call: "POST /stale-claims/${claim_b_id}/resubmit"
