  - { id: ERR_CUSTOM_LINE_NOT_DEPOSIT_PAID, http: 409, condition: "schedule-production requires production_status == DEPOSIT_PAID" }
  - { id: ERR_PRODUCT_UNAVAILABLE, http: 422, condition: "Product DISCONTINUED referenced by a new line" }
  - { id: ERR_PRODUCT_KIND_MISMATCH, http: 422, condition: "fabric_tier PREMIUM on a STOCK product or kind/option mismatch" }
  - { id: ERR_QUOTE_EXPIRED, http: 422, condition: "Line mutation or confirm after quote_expires_at" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "New production slot overlaps a non-CONSUMED slot on the same gallery (half-open arithmetic; adjacency allowed)" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 422, condition: "Daily route minute budget (duration + 30 buffer) would exceed gallery.daily_route_minutes_capacity" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 422, condition: "Return created more than 30 days after delivered_at" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Member email or trade account email already registered" }
  - { id: ERR_APPOINTMENT_EXISTS, http: 409, condition: "Order already has an appointment in SCHEDULED or OUT_FOR_DELIVERY" }
  - { id: ERR_CUSTOM_NON_RETURNABLE, http: 422, condition: "Return includes a CUSTOM line (custom items non-returnable; deposits forfeited)" }
  - { id: ERR_DEPOSIT_REQUIRED, http: 422, condition: "Confirm omitted deposit_payment_cents while deposit_due_cents > 0" }
  - { id: ERR_DEPOSIT_AMOUNT_MISMATCH, http: 422, condition: "deposit_payment_cents != deposit_due_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not match current Order.version on CONFIRMED-order line mutation" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated-enrollment principal (role header present, no persisted entity)"
    identity: opaque
    exclusive_operations: ["POST /members", "POST /trade-accounts"]
    shared_operations: ["GET /products/{id}"]
  - name: Member
    description: "Enrolled member acting on own resources"
    identity: "entity_backed:Member"
    exclusive_operations: ["POST /members/{id}/cancel"]
    shared_operations: ["GET /members/{id} (self)", "POST /members/{id}/renew (self)", "order CRUD on own orders", "POST /design-consultations (self)", "POST /returns (own orders)", "GET own consultations/appointments"]
  - name: TradeDesigner
    description: "Verified trade program designer acting on own account and orders"
    identity: "entity_backed:TradeAccount"
    exclusive_operations: []
    shared_operations: ["order CRUD on own trade orders", "POST /returns (own orders)", "GET /products/{id}"]
  - name: GalleryAssociate
    description: "Gallery staff: order operations for any customer, consultations, appointments, returns settlement, retail guest orders"
    identity: opaque
    exclusive_operations: ["POST /design-consultations/{id}/complete", "POST /returns/{id}/settle", "retail guest order creation"]
    shared_operations: ["order CRUD", "POST /delivery-appointments", "list endpoints", "GET /members/{id}"]
  - name: TradeReviewer
    description: "Trade program credential reviewer"
    identity: opaque
    exclusive_operations: ["POST /trade-accounts/{id}/verify"]
    shared_operations: []
  - name: ProductionPlanner
    description: "Custom upholstery production scheduler"
    identity: opaque
    exclusive_operations: ["POST /production-slots", "POST /production-slots/{id}/advance", "POST /orders/{id}/lines/{lineId}/schedule-production"]
    shared_operations: ["GET /galleries/{id}/production-slots", "GET /products/{id}/order-lines", "GET /orders/{id}/lines"]
  - name: HubOperator
    description: "Owned-hub white-glove delivery operator"
    identity: opaque
    exclusive_operations: ["POST /delivery-appointments/{id}/record-outcome"]
    shared_operations: ["POST /delivery-appointments", "GET /delivery-appointments*", "GET /galleries/{id}"]
  - name: PlatformAdmin
    description: "Platform operator: galleries, products, source books, ops-run and clock"
    identity: opaque
    exclusive_operations: ["POST /galleries", "POST /products", "POST /source-books", "POST /_clock/set_current_utc", "POST /_ops/run_daily_cycle"]
    shared_operations: ["all list/read endpoints", "POST /members/{id}/renew"]
