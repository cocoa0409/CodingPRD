scaffold_corner_design:
  # =====================================================================
  # Section: entities (Table 1 claims)
  # =====================================================================
  - section: entities
    instances:
      - name: project_create_defaults_applied
        claim_type: creation_defaults_computed
        grounds:
          - entities.Project.fields.safety_posture
          - entities.Project.fields.issued_permit_count
          - entities.Project.fields.open_deficiency_count
        distinguishing_aspect: "A freshly created Project starts with safety_posture NORMAL, both counters 0, current_active_plan_id null, and version 1 — client-supplied values for computed/system fields are ignored."
        test_recipe:
          setup: ["empty database; clock at startup default"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
          trigger:
            - { call: "POST /safety/projects", payload: { name: "U District Station", location: "Seattle", annual_hours_worked: 60000 }, as: SafetyManager, captures: { p: "$.data.id", posture: "$.data.safety_posture", ipc: "$.data.issued_permit_count", odc: "$.data.open_deficiency_count", v: "$.data.version", cap: "$.data.current_active_plan_id" } }
          assert:
            - "response 201; Project.${p}.safety_posture == 'NORMAL'"
            - "Project.${p}.issued_permit_count == 0 and open_deficiency_count == 0"
            - "Project.${p}.current_active_plan_id is null and version == 1"

      - name: entity_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_PROJECT_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but non-existent project id returns the typed 404, not a generic 400/500."
        test_recipe:
          setup: ["database contains at least one unrelated project (so the collection is non-empty)"]
          setup_api_calls:
            - { call: "POST /safety/projects", payload: { name: "Existing", location: "Seattle", annual_hours_worked: 10000 }, as: SafetyManager }
          trigger:
            - { call: "GET /safety/projects/00000000-0000-0000-0000-000000000000", payload: {}, as: SafetyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404 with error_id == ERR_PROJECT_NOT_FOUND"

      - name: safety_plan_revision_no_increments
        claim_type: computed_field
        grounds:
          - entities.SafetyPlan.fields.revision_no
        distinguishing_aspect: "revision_no is server-computed as 1 + count of pre-existing plans for the same project: first plan gets 1, second gets 2, regardless of client input."
        test_recipe:
          setup: ["one project exists"]
          setup_api_calls:
            - { call: "POST /safety/projects", payload: { name: "Ridge", location: "Kent", annual_hours_worked: 20000 }, as: SafetyManager, captures: { p: "$.data.id" } }
          trigger:
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl1: "$.data.id", r1: "$.data.revision_no", s1: "$.data.status" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-09-01", revision_notes: "rev2" }, as: SafetyManager, captures: { pl2: "$.data.id", r2: "$.data.revision_no" } }
          assert:
            - "SafetyPlan.${pl1}.revision_no == 1 and status == DRAFT"
            - "SafetyPlan.${pl2}.revision_no == 2"

      - name: worker_conditional_subcontractor_field_rejected
        claim_type: required_fields_conditional
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.Worker.fields.subcontractor_id
        distinguishing_aspect: "A DIRECT worker submitted WITH a subcontractor_id violates the conditional-field rule; a SUBCONTRACTOR worker WITHOUT one violates it symmetrically — both ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["project and subcontractor exist"]
          setup_api_calls:
            - { call: "POST /safety/projects", payload: { name: "Hill", location: "Renton", annual_hours_worked: 30000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/subcontractors", payload: { project_id: "${p}", company_name: "Amp", trade: "electrical" }, as: SafetyManager, captures: { s: "$.data.id" } }
          trigger:
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "Bad Direct", employer_type: "DIRECT", subcontractor_id: "${s}" }, as: SiteSuperintendent, captures: { err1: "$.data.error_id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "Bad Sub" }, as: SiteSuperintendent, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (DIRECT with subcontractor_id)"
            - "err2 == ERR_INVALID_REQUEST (missing employer_type entirely)"

  # =====================================================================
  # Section: state_machines (Table 2 claims)
  # =====================================================================
  - section: state_machines
    instances:
      - name: huddle_conduct_to_conducted_and_attendance
        claim_type: valid_transition_with_side_effects
        grounds:
          - state_machines.Huddle.SCHEDULED_to_CONDUCTED
        distinguishing_aspect: "conduct flips SCHEDULED -> CONDUCTED and stamps attendee_worker_ids + conducted_at from the request/clock."
        test_recipe:
          setup: ["project; worker ORIENTED (plan active + orientation done)"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Dockside", location: "Tacoma", annual_hours_worked: 45000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "P Quinn", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/workers/${w}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/huddles", payload: { project_id: "${p}", huddle_date: "2026-08-01", topics: "lift plan" }, as: SiteSuperintendent, captures: { h: "$.data.id" } }
          trigger:
            - { call: "POST /safety/huddles/${h}/conduct", payload: { attendee_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { hs: "$.data.status", ca: "$.data.conducted_at" } }
          assert:
            - "Huddle.${h}.status == CONDUCTED"
            - "Huddle.${h}.attendee_worker_ids == [${w}] and conducted_at == 2026-08-01T08:00:00Z (logical clock)"

      - name: certificate_verify_twice_rejected
        claim_type: idempotency_invalid_from
        grounds:
          - state_machines.TrainingCertificate.UNVERIFIED_to_VERIFIED
          - errors[ERR_CERTIFICATE_INVALID_STATE]
        distinguishing_aspect: "Verifying an already-VERIFIED certificate is rejected (idempotency guard on the transition); no second verification stamp."
        test_recipe:
          setup: ["project; worker; OSHA_10 certificate already VERIFIED by insp-1"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Central", location: "Seattle", annual_hours_worked: 25000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "Q Russo", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-2", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CERTIFICATE_INVALID_STATE (409)"

      - name: removed_worker_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Worker.CLEARED_to_REMOVED
          - state_machines.Subcontractor.PROBATION_to_REMOVED
          - errors[ERR_WORKER_INVALID_STATE]
        distinguishing_aspect: "After subcontractor removal cascades a worker to terminal REMOVED, every worker action (suspend shown here) is rejected with ERR_WORKER_INVALID_STATE."
        test_recipe:
          setup:
            - "Project with ACTIVE plan; subcontractor; ORIENTED sub-worker; two OPEN MAJOR deficiencies assigned to the sub (realtime 70); DEMOTE -> PROBATION; remove -> REMOVED (worker cascades to REMOVED)"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Eastgate", location: "Bellevue", annual_hours_worked: 55000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
            - { call: "POST /safety/subcontractors", payload: { project_id: "${p}", company_name: "Rusty Nails GC", trade: "carpentry" }, as: SafetyManager, captures: { s: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "R Sousa", employer_type: "SUBCONTRACTOR", subcontractor_id: "${s}" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/workers/${w}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/inspections", payload: { project_id: "${p}", inspection_type: "WEEKLY", due_date: "2026-08-10T17:00:00Z" }, as: SafetyInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /safety/inspections/${insp}/complete", payload: { findings_summary: "multiple" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "guardrail A", severity: "MAJOR", assigned_subcontractor_id: "${s}" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "guardrail B", severity: "MAJOR", assigned_subcontractor_id: "${s}" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/subcontractors/${s}/probation-review", payload: { action: "DEMOTE" }, as: SafetyManager }
            - { call: "POST /safety/subcontractors/${s}/remove", payload: { reason: "repeated deficiencies" }, as: SafetyManager }
          trigger:
            - { call: "POST /safety/workers/${w}/suspend", payload: { reason: "too late" }, as: SafetyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_WORKER_INVALID_STATE   # REMOVED is terminal"
            - "Worker.${w}.status == REMOVED (via cascade from subcontractor removal)"

      - name: imminent_danger_deficiency_freeze_cascade
        claim_type: cascade_down
        grounds:
          - calculations.project_posture
          - state_machines.Permit.ISSUED_to_SUSPENDED
          - state_machines.JobHazardAnalysis.APPROVED_to_RE_REVIEW_REQUIRED
        distinguishing_aspect: "Creating an IMMINENT_DANGER deficiency (second FROZEN cause, distinct from the CRITICAL-incident path in §1.8) freezes posture and suspends the ISSUED permit in the same create response chain."
        test_recipe:
          setup: ["project with ACTIVE plan; worker CLEARED; huddle CONDUCTED; JHA APPROVED; FALL_PROTECTION permit ISSUED; WEEKLY inspection COMPLETED"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Northgate", location: "Seattle", annual_hours_worked: 75000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "S Tran", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w}/clear", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/huddles", payload: { project_id: "${p}", huddle_date: "2026-08-01", topics: "roof" }, as: SiteSuperintendent, captures: { h: "$.data.id" } }
            - { call: "POST /safety/huddles/${h}/conduct", payload: { attendee_worker_ids: ["${w}"] }, as: SiteSuperintendent }
            - { call: "POST /safety/jhas", payload: { project_id: "${p}", huddle_id: "${h}", task_description: "roof edge", hazards: "fall", controls: "rails" }, as: SiteSuperintendent, captures: { j: "$.data.id" } }
            - { call: "POST /safety/jhas/${j}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "FALL_PROTECTION", work_start: "2026-08-02T08:00:00Z", work_end: "2026-08-02T16:00:00Z", authorized_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { pm: "$.data.id" } }
            - { call: "POST /safety/permits/${pm}/issue", payload: {}, as: SafetyManager }
            - { call: "POST /safety/inspections", payload: { project_id: "${p}", inspection_type: "DAILY", due_date: "2026-08-02T17:00:00Z" }, as: SafetyInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /safety/inspections/${insp}/complete", payload: { findings_summary: "scaffold tie-in missing" }, as: SafetyInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "scaffold could collapse", severity: "IMMINENT_DANGER" }, as: SafetyInspector, as_user_id: "insp-1", captures: { df: "$.data.id", due: "$.data.due_at" } }
            - { call: "GET /safety/projects/${p}", payload: {}, as: SafetyManager, captures: { posture: "$.data.safety_posture" } }
            - { call: "GET /safety/permits/${pm}", payload: {}, as: SafetyManager, captures: { pm_s: "$.data.status", pm_r: "$.data.suspension_reason" } }
            - { call: "GET /safety/jhas/${j}", payload: {}, as: SafetyManager, captures: { j_s: "$.data.status" } }
          assert:
            - "Deficiency.${df}.due_at == its created_at (IMMINENT_DANGER SLA is 0 days)"
            - "Project.${p}.safety_posture == FROZEN"
            - "Permit.${pm}.status == SUSPENDED with suspension_reason == 'POSTURE_FROZEN'"
            - "JobHazardAnalysis.${j}.status == RE_REVIEW_REQUIRED"

  # =====================================================================
  # Section: calculations (Table 3 claims)
  # =====================================================================
  - section: calculations
    instances:
      - name: osha_recordability_near_miss_not_recordable
        claim_type: correct_result
        grounds:
          - calculations.osha_recordability
        distinguishing_aspect: "A work-related NEAR_MISS with every determination flag false and days_away_from_work == 0 computes is_osha_recordable == false, and such an incident closes with no drug test."
        test_recipe:
          setup: ["project; worker; NEAR_MISS incident investigated"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Green Lake", location: "Seattle", annual_hours_worked: 35000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "T Ueda", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/incidents", payload: { project_id: "${p}", worker_id: "${w}", incident_type: "NEAR_MISS", severity: "MINOR", occurred_at: "2026-08-02T09:00:00Z", work_related: true, description: "falling tool missed worker" }, as: SiteSuperintendent, captures: { inc: "$.data.id" } }
            - { call: "POST /safety/incidents/${inc}/investigate", payload: { investigation_notes: "tethering gap" }, as: SafetyInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /safety/incidents/${inc}/determination", payload: { medical_treatment_beyond_first_aid: false, days_away_from_work: 0, restricted_duty: false, loss_of_consciousness: false, significant_diagnosis: false }, as: SafetyManager, as_user_id: "sm-1", captures: { rec: "$.data.is_osha_recordable" } }
            - { call: "POST /safety/incidents/${inc}/close", payload: {}, as: SafetyManager, captures: { st: "$.data.status" } }
          assert:
            - "Incident.${inc}.is_osha_recordable == false"
            - "Incident.${inc}.status == CLOSED without any drug test (not recordable -> no ERR_DRUG_TEST_REQUIRED)"

      - name: huddle_missed_auto_transition_on_sweep
        claim_type: auto_transition
        grounds:
          - state_machines.Huddle.SCHEDULED_to_MISSED
        distinguishing_aspect: "A huddle left SCHEDULED flips to MISSED exactly when the clock passes huddle_date + 1 day; conduct afterwards is rejected."
        test_recipe:
          setup: ["project; huddle dated 2026-08-02; clock then advanced to 2026-08-03T12:00:00Z"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Wallingford", location: "Seattle", annual_hours_worked: 15000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/huddles", payload: { project_id: "${p}", huddle_date: "2026-08-02", topics: "crane pick" }, as: SiteSuperintendent, captures: { h: "$.data.id" } }
          trigger:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: SafetyManager }
            - { call: "GET /safety/huddles/${h}", payload: {}, as: SafetyManager, captures: { hs: "$.data.status" } }
            - { call: "POST /safety/huddles/${h}/conduct", payload: { attendee_worker_ids: [] }, as: SiteSuperintendent, captures: { err: "$.data.error_id" } }
          assert:
            - "Huddle.${h}.status == MISSED after the sweep"
            - "conduct afterwards: error_id == ERR_HUDDLE_INVALID_STATE"

      - name: certificate_expiry_day_granularity
        claim_type: boundary_auto_transition
        grounds:
          - state_machines.TrainingCertificate.VERIFIED_to_EXPIRED
          - calculations.training_clearance_check
        distinguishing_aspect: "Expiry is inclusive at day granularity: the certificate is still VERIFIED at 2026-08-10T12:00Z on its 2026-08-10 expires_date, and flips to EXPIRED only at 2026-08-11T00:00:00Z."
        test_recipe:
          setup: ["project; worker; VERIFIED OSHA_10 certificate with expires_date 2026-08-10"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Madrona", location: "Seattle", annual_hours_worked: 18000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "U Vargas", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2026-08-10" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: SafetyManager }
            - { call: "GET /safety/training-certificates/${c1}", payload: {}, as: SafetyManager, captures: { s_mid: "$.data.status" } }
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: SafetyManager }
            - { call: "GET /safety/training-certificates/${c1}", payload: {}, as: SafetyManager, captures: { s_end: "$.data.status" } }
          assert:
            - "on expires_date at noon: status == VERIFIED (inclusive expiry day)"
            - "the next day: status == EXPIRED"

  # =====================================================================
  # Section: validations (Table 4 claims)
  # =====================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A write call with no X-User-ID / X-User-Role headers is rejected at priority 1 before any other processing."
        test_recipe:
          setup: ["database state irrelevant — auth precedes everything"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
          trigger:
            - { call: "POST /safety/projects", payload: { name: "NoAuth", location: "Seattle", annual_hours_worked: 10000 }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (test harness omits the headers for this call; 'Anonymous' denotes the header-less case)"

      - name: incident_close_requires_post_incident_drug_test
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_DRUG_TEST_REQUIRED]
        distinguishing_aspect: "Closing a recordable incident that has an involved worker is rejected until a RESULTED (NEGATIVE/POSITIVE) POST_INCIDENT drug test exists; a PENDING_RESULT record does not satisfy the gate."
        test_recipe:
          setup: ["project; worker; recordable incident in DETERMINATION_MADE (medical_treatment true); a POST_INCIDENT drug test exists but is still PENDING_RESULT"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "South Park", location: "Seattle", annual_hours_worked: 42000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "V Wells", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
