  - rule_id: boundary_precision_check
    instances:
      - name: bev_limit_half_up_rounding_and_inclusive_maneuver_boundaries
        grounds:
          - calculations.maneuver_acceptability_and_session_quality
          - entities.Maneuver.fields.bev_limit_ml
          - entities.Maneuver.fields.rejection_reasons
          - validations[priority=41]
          - errors[ERR_COACHING_NOTE_REQUIRED]
        distinguishing_aspect: |
          Three boundaries are pinned inside one endpoint: bev_limit_ml for fvc_l 3.190 is 160 because
          159.5 rounds half-up (not 159 from truncation), back_extrapolated_volume_ml 160 against a limit of
          160 passes because the comparison is <=, and expiratory_time_s exactly 15.0 satisfies EOFE_MIN_SEC
          without plateau_reached - while the neighbouring fvc_l 3.180 yields limit 159 and turns the very
          same 160 mL start volume into UNACCEPTABLE.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "device SPIRO-1 is AVAILABLE with a same-day PASS calibration, PASS biologic control, fresh filter and completed disinfection"
            - "order ORD-1 is DYSPNEA_EVALUATION / ROUTINE_CLINICAL with bronchodilator_requested false and no medication classes"
            - "session SESS-1 is SCHEDULED on SPIRO-1 with predicted_fev1_l 4.000"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-001", full_name: "Tessa Ng", role_type: "TECHNOLOGIST", credential: "RPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY", "DLCO", "PLETHYSMOGRAPHY"] }
              as: LabManager
