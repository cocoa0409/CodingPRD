        grounds:
          - state_machines.JournalEntry.DRAFT_to_POSTED
          - validations[priority=12]
          - errors[ERR_ENTRY_NOT_BALANCED]
          - endpoints["POST /ledger/journal-entries/{entryId}/post"]
        distinguishing_aspect: |
          Exact zero-difference boundary on the post endpoint: debits 50000 vs credits 49999 (off by
          one cent) must be rejected with ERR_ENTRY_NOT_BALANCED; abs(debit-credit)==0 is required,
          no tolerance. Metric = debit/credit equality.
        test_recipe:
          setup:
            - "Company with OPEN period; a DRAFT entry with debit Expense 50000 and credit Cash 49999 (unbalanced by 1 cent)."
