          assert:
            - "VehicleRun.${run_id}.status == DISPATCHED"
            - "TripReservation.${trip_id}.status == EN_ROUTE"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_safety_wheelchair_beats_constraint_seat
        grounds:
          - "validations[priority=13]"
          - "validations[priority=14]"
          - "errors[ERR_NO_WHEELCHAIR_CAPACITY]"
          - "errors[ERR_NO_SEAT_CAPACITY]"
          - state_machines.TripReservation.OFFERED_to_SCHEDULED
        distinguishing_aspect: |
          On one accept that violates BOTH the wheelchair-position check (business_safety, priority 13)
          and the ambulatory-seat check (business_constraint, priority 14), the lower-priority-number
          business_safety error ERR_NO_WHEELCHAIR_CAPACITY wins — category pair {business_safety, business_constraint}.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Certified rider. Run with total_wheelchair_positions=0 and total_ambulatory_seats=0."
            - "Trip needs_wheelchair=true with num_companions=1, so it needs 1 wheelchair position AND 1 ambulatory seat, both unavailable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /service-zones"
              payload: { zone_code: "ZA", name: "Zone A", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
