            - { call: "POST /endowment/donors", payload: { donor_name: "D PC2", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { pf_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${pf_fund}", donor_id: "${pf_donor}", external_ref: "PC2", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { pf_g1: $.data.id } }
            - { call: "POST /endowment/funds/${pf_fund}/activate", payload: {}, as: DevelopmentOfficer }
