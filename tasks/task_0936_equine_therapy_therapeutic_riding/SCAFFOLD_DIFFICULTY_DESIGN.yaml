          A DIFFERENT conserved quantity - HORSE CAPACITY (committed mounted minutes per
          MONDAY week), not money: cancelling a 90-minute session returns exactly 90 minutes,
          so a 30-minute booking that was refused at 240/240 succeeds immediately afterwards
          and the week lands on exactly 180.
