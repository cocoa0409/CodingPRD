scaffold_corner_design:

  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_rental_agreement_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.RentalAgreement", "endpoints"]
        distinguishing_aspect: "POST /rental-agreements with required fields and omitted protection_tier_code/declared_value_cents/proration_method returns 201 with lifecycle_status=QUOTED, billing_status=CURRENT, protection_tier_code=NONE, declared_value_cents=0, proration_method=CALENDAR_DAY."
        test_recipe:
          setup:
            - "A ContainerModel C16, a Depot, a C16 DepotInventory, and a Customer exist."
          setup_api_calls:
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "crt@x.com", full_name: "Cr T", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_id: $.data.id, ls: $.data.lifecycle_status, bs: $.data.billing_status, ptc: $.data.protection_tier_code, dv: $.data.declared_value_cents, pm: $.data.proration_method }
          assert:
            - "Response status == 201"
            - "RentalAgreement.${ag_id}.lifecycle_status == QUOTED and billing_status == CURRENT"
            - "RentalAgreement.${ag_id}.protection_tier_code == NONE, declared_value_cents == 0, proration_method == CALENDAR_DAY"

      - name: get_rental_agreement_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.RentalAgreement", "validations[priority=3]"]
        distinguishing_aspect: "GET /rental-agreements/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB (no agreements)."
          setup_api_calls: []
          trigger:
            - call: "GET /rental-agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_rental_agreement_missing_site_address_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.RentalAgreement.fields.site_address", "validations[priority=4]"]
        distinguishing_aspect: "POST /rental-agreements omitting the required site_address returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A ContainerModel, Depot, inventory, and Customer exist."
          setup_api_calls:
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "mr@x.com", full_name: "Miss R", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_rental_agreement_bad_size_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.RentalAgreement.fields.size_code", "validations[priority=4]"]
        distinguishing_aspect: "POST /rental-agreements with size_code='C99' (not in {C8,C12,C16}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A Depot and Customer exist."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "be@x.com", full_name: "Bad E", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C99", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: protection_plan_immutable_no_version_field
        claim_type: Immutability
        grounds: ["entities.ProtectionPlan"]
        distinguishing_aspect: "ProtectionPlan has common_fields:false — it exposes only id and created_at (no version), and there is no update endpoint for it in §1.5."
        test_recipe:
          setup:
            - "A ProtectionPlan tier BASIC exists."
          setup_api_calls:
            - call: "POST /protection-plans"
              payload: { tier_code: "BASIC", base_premium_cents: 1000, rate_bps: 50, min_premium_cents: 1500, coverage_cap_cents: 5000000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /protection-plans/${plan_id}"
              payload: {}
              as: Customer
              captures: { tc: $.data.tier_code }
          assert:
            - "Response status == 200 and ProtectionPlan.${plan_id}.tier_code == BASIC"
            - "Response data carries id and created_at but no version field; no PUT/PATCH endpoint exists for protection-plans"

      - name: depot_inventory_computed_fields_initialized
        claim_type: Computed Fields
        grounds: ["entities.DepotInventory.fields.available_units", "calculations.inventory_availability"]
        distinguishing_aspect: "A freshly created DepotInventory with total_units=3 reports reserved_units=0, committed_units=0, available_units=3; client-supplied values for the computed fields are ignored."
        test_recipe:
          setup:
            - "A Depot exists."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
          trigger:
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C12", total_units: 3 }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, avail: $.data.available_units, res: $.data.reserved_units, com: $.data.committed_units }
          assert:
            - "DepotInventory.${inv_id}.available_units == 3"
            - "DepotInventory.${inv_id}.reserved_units == 0 and committed_units == 0"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: hold_from_quoted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.RentalAgreement.ACTIVE_to_ON_HOLD", "validations[priority=6]"]
        distinguishing_aspect: "POST /rental-agreements/{id}/hold on a QUOTED (never-activated) agreement is rejected ERR_INVALID_STATE (409); the from-state must be ACTIVE."
        test_recipe:
          setup:
            - "A QUOTED agreement (not reserved/delivered) exists."
          setup_api_calls:
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "qh@x.com", full_name: "Q Hold", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${ag_id}/hold"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: cancel_from_cancelled_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.RentalAgreement.QUOTED_to_CANCELLED", "validations[priority=6]"]
        distinguishing_aspect: "A second POST /rental-agreements/{id}/cancel on an already-CANCELLED agreement is rejected ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup:
            - "A QUOTED agreement cancelled once (now CANCELLED)."
          setup_api_calls:
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "cc@x.com", full_name: "Can C", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_id: $.data.id }
            - call: "POST /rental-agreements/${ag_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /rental-agreements/${ag_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: successful_closeout_full_lifecycle
        claim_type: Valid Transition
        grounds:
          - state_machines.ContainerUnit.ON_SITE_to_RETURNED
          - state_machines.RentalAgreement.CLOSING_to_CLOSED
          - calculations.inventory_availability
        distinguishing_aspect: "A NONE-tier agreement paid to 0, request-closeout (CLOSING), unit return-to-depot (RETURNED), then close succeeds: lifecycle_status CLOSED, unit RELEASED, DepotInventory.committed_units back to 0."
        test_recipe:
          setup:
            - "ACTIVE NONE-tier C16 agreement delivered 2026-07-16 (balance 19171), paid to 0, then request-closeout and unit returned to depot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /protection-plans"
              payload: { tier_code: "NONE", base_premium_cents: 0, rate_bps: 0, min_premium_cents: 0, coverage_cap_cents: 0 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /crews"
              payload: { depot_id: "${depot_id}", name: "Crew A", setup_buffer_minutes: 30 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "fc@x.com", full_name: "Full C", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", protection_tier_code: "NONE", declared_value_cents: 0, proration_method: "CALENDAR_DAY", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /rental-agreements/${ag_id}/reserve"
              payload: { expected_agreement_version: "${ag_v}" }
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_id}/container-units"
              payload: {}
              as: DispatchOperator
              captures: { unit_id: "$.data[0].id" }
            - call: "POST /delivery-jobs"
              payload: { agreement_id: "${ag_id}", crew_id: "${crew_id}", container_unit_id: "${unit_id}", job_kind: "INITIAL_DELIVERY", window_start: "2026-07-16T09:00:00Z", window_end: "2026-07-16T11:00:00Z" }
              as: DispatchOperator
              captures: { job_id: $.data.id }
            - call: "POST /delivery-jobs/${job_id}/complete"
              payload: {}
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { vpay: $.data.version }
            - call: "POST /rental-agreements/${ag_id}/payments"
              payload: { amount_cents: 19171, expected_agreement_version: "${vpay}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /rental-agreements/${ag_id}/request-closeout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /container-units/${unit_id}/return-to-depot"
              payload: {}
              as: DispatchOperator
          trigger:
            - call: "POST /rental-agreements/${ag_id}/close"
              payload: {}
              as: BillingClerk
              captures: { ls: $.data.lifecycle_status }
            - call: "GET /container-units/${unit_id}"
              payload: {}
              as: DispatchOperator
              captures: { ustatus: $.data.status }
            - call: "GET /depot-inventory/${inv_id}"
              payload: {}
              as: DispatchOperator
              captures: { com: $.data.committed_units, avail: $.data.available_units }
          assert:
            - "RentalAgreement.${ag_id}.lifecycle_status == CLOSED"
            - "ContainerUnit.${unit_id}.status == RELEASED"
            - "DepotInventory.${inv_id}.committed_units == 0 and available_units == 1"

  # ===========================================================================
  # Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: protection_premium_floor_applies
        claim_type: Correct Result
        grounds: ["calculations.protection_premium", "entities.RentalAgreement.fields.monthly_premium_cents"]
        distinguishing_aspect: "A PLUS tier (base 1500, rate 80bps, min 2000) with declared_value_cents=10000 yields raw 1500 + round(80*10000/10000=80)=1580, below the 2000 floor, so monthly_premium_cents == 2000."
        test_recipe:
          setup:
            - "ACTIVE C16 agreement on PLUS protection with declared_value_cents=10000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /container-models"
              payload: { size_code: "C16", cubic_feet: 800, monthly_rate_cents: 19900, delivery_fee_cents: 8900, footprint_sqft: 160 }
              as: PlatformAdmin
            - call: "POST /protection-plans"
              payload: { tier_code: "PLUS", base_premium_cents: 1500, rate_bps: 80, min_premium_cents: 2000, coverage_cap_cents: 100000000 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C16", total_units: 1 }
              as: PlatformAdmin
            - call: "POST /crews"
              payload: { depot_id: "${depot_id}", name: "Crew A", setup_buffer_minutes: 30 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "fl@x.com", full_name: "Flo Or", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C16", protection_tier_code: "PLUS", declared_value_cents: 10000, proration_method: "CALENDAR_DAY", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /rental-agreements/${ag_id}/reserve"
              payload: { expected_agreement_version: "${ag_v}" }
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_id}/container-units"
              payload: {}
              as: DispatchOperator
              captures: { unit_id: "$.data[0].id" }
            - call: "POST /delivery-jobs"
              payload: { agreement_id: "${ag_id}", crew_id: "${crew_id}", container_unit_id: "${unit_id}", job_kind: "INITIAL_DELIVERY", window_start: "2026-07-16T09:00:00Z", window_end: "2026-07-16T11:00:00Z" }
              as: DispatchOperator
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /delivery-jobs/${job_id}/complete"
              payload: {}
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_id}"
              payload: {}
              as: BillingClerk
              captures: { prem: $.data.monthly_premium_cents }
          assert:
            - "RentalAgreement.${ag_id}.monthly_premium_cents == 2000 (floor applied; raw 1580 < min 2000)"

      - name: late_fee_cap_caps_at_half_balance
        claim_type: Constants Applied
        grounds: ["calculations.late_fee", "state_machines.RentalAgreement.CURRENT_to_PAST_DUE"]
        distinguishing_aspect: "On a small balance the tier1 late fee is capped at 50% of balance_due_cents (LATE_CAP_PCT=0.50): a C8 FIXED_30 agreement delivered 2026-07-16 has balance 3200 (proration 3200, delivery_fee 0); at 6 days overdue the uncapped tier1 gross would be 2700 but the cap min(2700, round(3200*0.50)=1600) wins, so the posted LATE_FEE is 1600."
        test_recipe:
          setup:
            - "An ACTIVE C8 NONE-tier FIXED_30 agreement delivered 2026-07-16 (balance 3200), unpaid, swept once at 6 days overdue."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /container-models"
              payload: { size_code: "C8", cubic_feet: 400, monthly_rate_cents: 6000, delivery_fee_cents: 0, footprint_sqft: 80 }
              as: PlatformAdmin
            - call: "POST /protection-plans"
              payload: { tier_code: "NONE", base_premium_cents: 0, rate_bps: 0, min_premium_cents: 0, coverage_cap_cents: 0 }
              as: PlatformAdmin
            - call: "POST /depots"
              payload: { name: "LA Depot", state_code: "CA", service_radius_miles: 50 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /depot-inventory"
              payload: { depot_id: "${depot_id}", size_code: "C8", total_units: 1 }
              as: PlatformAdmin
            - call: "POST /crews"
              payload: { depot_id: "${depot_id}", name: "Crew A", setup_buffer_minutes: 30 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "cap@x.com", full_name: "Cap P", state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", size_code: "C8", protection_tier_code: "NONE", declared_value_cents: 0, proration_method: "FIXED_30", site_address: "1 A St", site_clearance_sqft: 400 }
              as: DispatchOperator
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /rental-agreements/${ag_id}/reserve"
              payload: { expected_agreement_version: "${ag_v}" }
              as: DispatchOperator
            - call: "GET /rental-agreements/${ag_id}/container-units"
              payload: {}
              as: DispatchOperator
              captures: { unit_id: "$.data[0].id" }
            - call: "POST /delivery-jobs"
              payload: { agreement_id: "${ag_id}", crew_id: "${crew_id}", container_unit_id: "${unit_id}", job_kind: "INITIAL_DELIVERY", window_start: "2026-07-16T09:00:00Z", window_end: "2026-07-16T11:00:00Z" }
              as: DispatchOperator
              captures: { job_id: $.data.id }
            - call: "POST /delivery-jobs/${job_id}/complete"
              payload: {}
              as: DispatchOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-22T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_billing/run-late-sweep"
              payload: {}
              as: BillingClerk
            - call: "GET /rental-agreements/${ag_id}"
              payload: {}
              as: BillingClerk
              captures: { bs: $.data.billing_status }
            - call: "GET /rental-agreements/${ag_id}/charges?charge_type=LATE_FEE"
              payload: {}
              as: BillingClerk
          assert:
            - "RentalAgreement.${ag_id}.billing_status == PAST_DUE (6 days overdue, crossed grace)"
            - "The single posted LATE_FEE Charge for RentalAgreement.${ag_id} == 1600 (cap min(2700, round(3200*0.50)=1600) wins over the uncapped tier1 gross 2700)"

  # ===========================================================================
  # Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: error_inventory_row_missing_on_reserve
        claim_type: Violation → Error
        grounds: ["validations[priority=5]", "errors[ERR_INVENTORY_ROW_MISSING]"]
        distinguishing_aspect: "Reserving an agreement whose (depot_id, size_code) has no DepotInventory row returns ERR_INVENTORY_ROW_MISSING (422)."
        test_recipe:
          setup:
            - "A QUOTED C12 agreement at a depot that only stocks C16 (no C12 inventory row)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /container-models"
              payload: { size_code: "C12", cubic_feet: 600, monthly_rate_cents: 14900, delivery_fee_cents: 7900, footprint_sqft: 120 }
              as: PlatformAdmin
