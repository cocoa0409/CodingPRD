            - "after the PATCH: compressed_bale_volume_ft3 == 3.188, bales_per_truck == 1191, freight_cost_per_sqft == 0.041982, recovery_penalty_per_sqft == 0.018000, net_landed_cost_per_sqft == 0.059982"
            - "the PATCH left every other PL-B field alone: bale_volume_ft3 is still 25.5, bale_mass_kg 15.0 and bag_sqft 49.0 — only the ratio and the six derived figures moved"
            - "tighter compression cut freight from 0.067114 to 0.041982 while the recovery penalty grew from 0.002400 to 0.018000: the net still fell, which is exactly the trade-off the constants encode"

