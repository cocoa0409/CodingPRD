            - "${score_after_2} == 80 == 100 - (5 + 15) and ${st_after_2} == CERTIFIED — the floor comparison is strict (<), so exactly 80 does NOT suspend"
            - "${r3} == 100.00 and the third action is SUSPENSION (first branch wins: an ISSUED WRITTEN_WARNING exists), so ${score_after_3} == 55 and ${st_after_3} == SUSPENDED"
            - "${r4} == 100.00 with ${o4} == FAIL, yet GET /price-integrity/associates/${la1}/accountability-actions still returns total_count 3 — aisle A04 has no assigned_associate_id, so the empty-candidate fallback creates nothing"
