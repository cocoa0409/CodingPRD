  - section: validations
    instances:
      - name: intake_before_income_verification_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_9
          - errors.ERR_INCOME_NOT_VERIFIED
          - endpoints.POST_/rehab/applications
        distinguishing_aspect: "An applicant still in APPLIED cannot have an application intaken: the answer is 409 ERR_INCOME_NOT_VERIFIED, distinct from the 422 ERR_APPLICANT_OVER_INCOME that a certified-but-ineligible household gets, so the two failure modes are neither collapsed into one code nor given the same status."
        test_recipe:
          setup:
            - "one ProgramYear 2026 and one Applicant in APPLIED (income never verified)"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Odell Marsh", email: "odell@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000, household_assets_cents: 5000000, dependents_count: 2 }
