            - call: "POST /assignments"
              payload: { consultant_id: "${c1_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 1.00, start_date: "2026-08-03", end_date: "2026-08-29", category: "BILLABLE", expected_consultant_version: "${c1_v3}" }
              as: ResourceManager
              captures: { a3_id: $.data.id }
          trigger:
            - call: "POST /assignments/${a2_id}/confirm"
