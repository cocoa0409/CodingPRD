# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3366_donated_goods_processing_production_standards_mission_funding
# Breadth probe over §1.1–§1.7 claims not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (those appear as excluded_because stubs).
# Shared fixture shorthand: "standard" = TEXTILES target 60, hourly 1800,
# grade_price_map {A:1000,B:700,C:400}, floor 100, ceiling 5000.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: member_org_create_applies_defaults_system_fields_and_envelope
        claim_type: Creation
        grounds: [entities.MemberOrg, endpoints.POST_/donated-goods/member-orgs, response_envelope]
        distinguishing_aspect: "Creating an org without costing_method returns 201 with the STANDARD default, brand_license_status ACTIVE, all computed ledgers at their initial values, version 1, and the success envelope carrying meta.api_request_id and response_type object."
        test_recipe:
          setup: ["Empty database; logical clock at the 2026-09-01T00:00:00Z default."]
          setup_api_calls: []
          trigger:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Defaults", reserve_floor_cents: 1000, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          assert:
            - "response status 201; meta.api_request_id and meta.api_request_timestamp are present; response_type == object"
            - "MemberOrg.${org_id}.costing_method == STANDARD (default applied)"
            - "brand_license_status == ACTIVE, margin_health == HEALTHY, diversion_compliant == true, diversion_rate_bps == 10000 (empty denominator)"
            - "retail_margin_pool_cents == 0, reserved_cents == 0, contract_revenue_cents == 0, version == 1, and id/created_at/updated_at are non-null"

      - name: member_org_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET_/donated-goods/member-orgs/{id}", errors.ERR_NOT_FOUND]
        distinguishing_aspect: "A well-formed but unallocated UUID returns 404 ERR_NOT_FOUND with the error envelope, not a 400 or empty 200."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /donated-goods/member-orgs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 404 with data.error_id == ERR_NOT_FOUND (${err}) and data.message present"
            - "response_type == error"

      - name: donation_at_store_drop_issues_no_receipt
        claim_type: Computed Fields
        grounds: [entities.Donation.fields.receipt_issued, endpoints.POST_/donated-goods/donations]
        distinguishing_aspect: "A donation at a STORE_DROP site is created with receipt_issued false and receipt_token null — only ADC sites auto-issue donor receipts."
        test_recipe:
          setup: ["Org with one STORE_DROP site."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org SD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Drop Site", site_type: "STORE_DROP" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "Walk-in", item_count_declared: 3 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
          assert:
            - "Donation.${don_id}.receipt_issued == false and receipt_token is null"
            - "status == RECEIVED and receipt_fmv_total_cents is null until sort"

      - name: receipt_auto_issue_at_adc
        claim_type: Computed Fields
        grounds: [entities.Donation.fields.receipt_token]
        excluded_because:
          difficulty_instance: receipt_fmv_per_item_rounding_order
          rationale: "The ADC auto-issuance branch (receipt_issued true, token non-null) is asserted by that difficulty instance's sort flow."

      - name: sort_materializes_items_with_grade_driven_initial_states
        claim_type: Initial State
        grounds: [state_machines.DonatedItem, entities.DonatedItem.fields.status, "endpoints.POST_/donated-goods/donations/{id}/sort"]
        distinguishing_aspect: "Sort creates one item per payload entry; grade A/B/C items are born SORTED while UNSALABLE items are born directly SALVAGED — the initial state depends on the input grade."
        test_recipe:
          setup: ["Org with ADC site; donation declared 2."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Init", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site I", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DI", item_count_declared: 2 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "B", estimated_value_cents: 200, weight_lbs: 3 }, { category: "EWASTE", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 8 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
          assert:
            - "GET /donated-goods/donated-items?donation_id=${don_id}&status=SORTED returns exactly 1 row (the grade-B textile)"
            - "GET /donated-goods/donated-items?donation_id=${don_id}&status=SALVAGED returns exactly 1 row (the UNSALABLE e-waste) with price_cents null"
            - "Donation.${don_id}.status == SORTED and sorted_at is non-null"

      - name: donated_items_list_paginates_with_filters
        claim_type: Listing
        grounds: [endpoints.GET_/donated-goods/donated-items, response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "With 3 items on one donation, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false; the status filter narrows the counted set."
        test_recipe:
          setup: ["Org, ADC site, donation declared 3, sorted into 3 items (2 grade A, 1 UNSALABLE)."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Page", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site P", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DP", item_count_declared: 3 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 1 }, { category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 1 }, { category: "MEDIA", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 2 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
          trigger:
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}", limit: 2, offset: 0 }
              as: StoreAssociate
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}", limit: 2, offset: 2 }
              as: StoreAssociate
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}", status: "SALVAGED" }
              as: StoreAssociate
          assert:
            - "first page returns 2 rows with total_count == 3 and has_more == true"
            - "second page returns 1 row with total_count == 3 and has_more == false"
            - "status=SALVAGED returns exactly 1 row with total_count == 1"

      - name: member_org_create_with_client_supplied_id_rejected
        claim_type: System Fields
        grounds: [entities.MemberOrg, errors.ERR_INVALID_REQUEST, "validations[priority=1]"]
        distinguishing_aspect: "System-managed fields (id, version) supplied by the client make the request malformed: the server responds 400 ERR_INVALID_REQUEST rather than silently overriding them."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Bad", reserve_floor_cents: 0, diversion_floor_bps: 7500, id: "00000000-0000-0000-0000-000000000001" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 with data.error_id == ERR_INVALID_REQUEST (${err})"

      - name: territory_open_ended_window_accepted
        claim_type: Creation
        grounds: [entities.Territory.fields.effective_to, endpoints.POST_/donated-goods/territories]
        excluded_because:
          difficulty_instance: territory_half_open_adjacency
          rationale: "The adjacent 201 creation in that difficulty instance omits effective_to, exercising the open-ended default."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: sort_a_sorted_donation_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Donation.RECEIVED_to_SORTED, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "SORTED is terminal for a donation: a second sort is rejected with ERR_INVALID_STATE and no duplicate items are created."
        test_recipe:
          setup: ["Org, ADC site, donation declared 1 already sorted."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org S2", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site S2", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DS", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "MEDIA", condition_grade: "C", estimated_value_cents: 50, weight_lbs: 1 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
          trigger:
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "MEDIA", condition_grade: "C", estimated_value_cents: 50, weight_lbs: 1 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second sort rejected with ERR_INVALID_STATE (${err})"
            - "GET /donated-goods/donated-items?donation_id=${don_id} still returns exactly 1 row (no duplicates)"

      - name: sell_unpriced_item_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.DonatedItem.SORTED_to_ON_FLOOR, state_machines.DonatedItem.ON_FLOOR_to_SOLD, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "A SORTED item cannot skip pricing: sell from SORTED is an invalid transition even though SOLD is a real terminal state."
        test_recipe:
          setup: ["Org with standard, ADC site, one SORTED grade-A item (never priced)."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org UP", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site UP", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DU", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 1 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: StoreAssociate
              captures: { it: $.data.0.id }
          trigger:
            - call: "POST /donated-goods/donated-items/${it}/sell"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "sell rejected with ERR_INVALID_STATE (${err}); item remains SORTED and org pool unchanged at 0"

      - name: sell_sold_item_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.DonatedItem.ON_FLOOR_to_SOLD, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "SOLD is terminal: replaying the same sell request is not a silent success — the second attempt fails with ERR_INVALID_STATE and the margin is credited exactly once."
        test_recipe:
          setup: ["Org with standard and one ON_FLOOR grade-A item (price 1000, cost 30)."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Tw", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site Tw", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DT", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 1 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: StoreAssociate
              captures: { it: $.data.0.id }
            - call: "POST /donated-goods/donated-items/${it}/price"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /donated-goods/donated-items/${it}/sell"
              payload: {}
              as: StoreAssociate
            - call: "POST /donated-goods/donated-items/${it}/sell"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "first sell succeeds (200, status SOLD, sold_at non-null)"
            - "second sell rejected with ERR_INVALID_STATE (${err})"
            - "GET /donated-goods/member-orgs/${org_id} shows retail_margin_pool_cents == 970 (credited exactly once)"

      - name: run_close_twice_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ProcessingRun.OPEN_to_CLOSED, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED is terminal for a run: a second close is rejected with ERR_INVALID_STATE and the computed rates from the first close are not overwritten."
        test_recipe:
          setup: ["Org with standard and site; one run opened."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org RC", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site RC", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { std_id: $.data.id }
            - call: "POST /donated-goods/processing-runs"
              payload: { site_id: "${site_id}", production_standard_id: "${std_id}" }
              as: ProductionLead
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/processing-runs/${run_id}/close"
              payload: { item_count_processed: 120, unsalable_count: 0, labor_minutes: 120, labor_cost_cents: 3600 }
              as: ProductionLead
            - call: "POST /donated-goods/processing-runs/${run_id}/close"
              payload: { item_count_processed: 1, unsalable_count: 0, labor_minutes: 60, labor_cost_cents: 30 }
              as: ProductionLead
              captures: { err: $.data.error_id }
          assert:
            - "first close succeeds with net_rate_iph == 60.0"
            - "second close rejected with ERR_INVALID_STATE (${err})"
            - "GET /donated-goods/processing-runs/${run_id} still shows item_count_processed == 120 (not overwritten)"

      - name: add_items_to_sold_lot_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.SalvageLot.OPEN_to_SOLD, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "A SOLD lot is sealed forever: add-items after the sale is rejected with ERR_INVALID_STATE and the lot's totals stay frozen."
        test_recipe:
          setup: ["Org with two SALVAGED TEXTILES items (25.0 and 30.0 lbs); an OUTLET_BIN lot containing the first item, already SOLD."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org SL", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site SL", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DSL1", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don1_id: $.data.id }
            - call: "POST /donated-goods/donations/${don1_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 25.0 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don1_id}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { s1: $.data.0.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DSL2", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don2_id: $.data.id }
            - call: "POST /donated-goods/donations/${don2_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 30.0 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don2_id}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { s2: $.data.0.id }
            - call: "POST /donated-goods/salvage-lots"
              payload: { member_org_id: "${org_id}", channel: "OUTLET_BIN", item_ids: ["${s1}"] }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /donated-goods/salvage-lots/${lot_id}/sell"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /donated-goods/salvage-lots/${lot_id}/add-items"
              payload: { item_ids: ["${s2}"] }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "add-items rejected with ERR_INVALID_STATE (${err})"
            - "GET /donated-goods/member-orgs/${org_id}/salvage-lots shows the lot with item_count == 1 and total_weight_lbs == 25.0"
            - "item ${s2} still has salvage_lot_id null"

      - name: lot_sell_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.SalvageLot.OPEN_to_SOLD, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "SOLD is terminal for a lot: a repeated sell fails with ERR_INVALID_STATE and diversion/margin are credited exactly once."
        test_recipe:
          setup: ["Org with an OUTLET_BIN lot holding one 10-lb TEXTILES item."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org LS", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site LS", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DL", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 10.0 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { s1: $.data.0.id }
            - call: "POST /donated-goods/salvage-lots"
