            - "error_id == ERR_FORBIDDEN_ROLE (captured ${err})"
      - name: shared_get_endpoints_allow_any_role
        claim_type: role_shared_allowance
        grounds: ["roles.Any"]
        distinguishing_aspect: "GET list endpoints are shared: each of the six authenticated roles can list tools and receives 200."
        test_recipe:
          setup: ["one tool exists"]
          setup_api_calls:
            - { call: "POST /tools", payload: { tool_code: "T-R4", part_number: "P-R4", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer }
          trigger:
            - { call: "GET /tools", as: MaterialsPlanner }
            - { call: "GET /tools", as: ToolingEngineer }
            - { call: "GET /tools", as: PackagingEngineer }
            - { call: "GET /tools", as: PlantManager }
            - { call: "GET /tools", as: ProductionScheduler }
            - { call: "GET /tools", as: QualityInspector }
