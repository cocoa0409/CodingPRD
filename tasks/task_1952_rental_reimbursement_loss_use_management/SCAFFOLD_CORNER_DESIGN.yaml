  # ============================== 8. Cross-Cutting Complexity Layers
  - section: cross_cutting_complexity
    instances:
      - name: verification_create_stale_claim_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[verification-create-stale-claim]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Claim.version for the create-with-supersede verification write: a create carrying the pre-supersede version is rejected 412, the fresh-version retry succeeds, and the first PENDING verification lands SUPERSEDED."
        test_recipe:
          setup: ["Claim created (version 1)"]
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv1_id: $.data.id } }
          trigger:
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v2: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v2}" }, as: ClaimsAdjuster, captures: { cv3_id: $.data.id } }
            - { call: "GET /claims/${cl_id}/coverage-verifications", payload: {}, as: ClaimsAdjuster }
          assert:
            - "Stale arm: error_id == ERR_STALE_VERSION and http status == 412"
            - "Fresh arm: create succeeds 201"
            - "GET /claims/${cl_id}/coverage-verifications returns total_count == 2: CV1 SUPERSEDED, CV3 PENDING (the rejected create persisted nothing)"

      - name: extension_request_stale_reservation_version_rejected
