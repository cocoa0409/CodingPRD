        distinguishing_aspect: "Two-person rule on the Lot: the DistributionOperator whose X-User-ID is stored in excursion_flagged_by_user_id gets ERR_SEGREGATION_OF_DUTIES 403 on RELEASE, while a second operator succeeds."
        test_recipe:
          setup:
