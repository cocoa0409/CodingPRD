            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po_a}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_a_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc: $.data.id }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${lot_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - *cvB_clk_0900
            - *cvH_start
            - *cvB_clk_1000
            - *cvH_cool
            - *cvB_clk_1035
            - *cvH_demold
            - *cvH_list_units
            - *cvH_trim1
            - *cvH_outfit1
            - *cvH_inspect1
            - *cvH_trim2
            - *cvH_outfit2
            - *cvH_inspect2
          trigger:
            - call: "GET /warehouses/${wh}"
              payload: {}
