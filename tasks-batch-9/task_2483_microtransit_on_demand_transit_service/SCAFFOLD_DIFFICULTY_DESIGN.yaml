          equivalence violation WITHOUT touching the block state — a third completed non-WAV trip with
          wait 12 pulls nonwav_avg_wait_minutes from 4.00 to 8.00, so wav_equivalence_ratio moves
          2.500 -> 1.250 which is COMPLIANT at the inclusive WAV_EQUIVALENCE_MAX_RATIO boundary — and
