            - "submitted_by_user_id == bm-1 and the brand approver was bm-2 (segregation of duties held throughout)"

      - name: production_run_quality_hold_resume_cycle
        grounds:
          - state_machines.ProductionRun.PACKING_to_ON_HOLD
          - state_machines.ProductionRun.ON_HOLD_to_PACKING
          - state_machines.ProductionRun.PACKING_to_COMPLETED
          - calculations.packing_penalty
        distinguishing_aspect: "Cyclic machine on ProductionRun (third entity): a PACKING advance with variance 6 (> tolerance 5) diverts to ON_HOLD, and RESUME loops back to PACKING where a corrected advance completes — the penalty recorded at the hold (169 cents) is recomputed to 0 on the successful pass."
        test_recipe:
          setup:
