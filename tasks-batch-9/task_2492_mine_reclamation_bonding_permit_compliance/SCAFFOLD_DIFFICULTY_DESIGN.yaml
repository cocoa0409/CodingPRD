      - name: self_bond_leverage_ratio_equality_qualifies_one_cent_fails
        grounds:
          - calculations.operator_self_bond_capacity
          - entities.Operator.fields.self_bond_status
          - state_machines.Operator.self_bond_status.UNTESTED_to_QUALIFIED
          - state_machines.Operator.self_bond_status.UNTESTED_to_FAILED
        distinguishing_aspect: |
          Boundary metric 1 — the >= leverage comparison on money, reached
          through POST /mining/operators/{id}/financial-test: liabilities
          4000000.00 give a rounded threshold of exactly 10000000.00 and QUALIFY
          the operator, while liabilities 4000000.01 round the threshold up to
          10000000.03 and FAIL it, so the one-cent step flips the outcome.
        test_recipe:
          setup:
            - "Operator X: TNW 10000000.00, liabilities 4000000.00, net income 1000000.00, NET_WORTH_TEST."
            - "Operator Y: identical except liabilities 4000000.01."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Exact Edge Aggregates", tangible_net_worth: 10000000.00, fixed_assets_in_state: 6000000.00, total_liabilities: 4000000.00, net_income_prior_year: 1000000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { op11x_id: $.data.id }
            - call: "POST /mining/operators"
              payload: { legal_name: "One Cent Over Aggregates", tangible_net_worth: 10000000.00, fixed_assets_in_state: 6000000.00, total_liabilities: 4000000.01, net_income_prior_year: 1000000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { op11y_id: $.data.id }
          trigger:
            - call: "POST /mining/operators/${op11x_id}/financial-test"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/operators/${op11y_id}/financial-test"
              as: BondSpecialist
              as_user_id: "bs-001"
          assert:
            - "Operator.${op11x_id}.self_bond_status == QUALIFIED and self_bond_capacity_amount == 2500000.00"
            - "Operator.${op11y_id}.self_bond_status == FAILED and self_bond_capacity_amount == 0.00"
            - "Both operators keep registry_status ACTIVE and self_bond_exposure_amount 0.00"

      - name: incremental_bond_zero_acre_basis_floors_to_statutory_minimum
        grounds:
          - calculations.bond_required_amount
          - entities.Permit.fields.reclaimed_acres_credited
          - concurrency_rules[bond-recalculation-stale-permit]
          - calculations.permit_compliance_posture
        distinguishing_aspect: |
          Boundary metric 2 — a zero-quantity basis (an empty acreage set)
          reached through a different endpoint, POST
          /mining/permits/{id}/recalculate-bond: with disturbed 75.00 equal to
          reclaimed 75.00 the basis is 0 acres, so the subtotal is 0.00, the
          admin fee floors at 2500.00 and the required bond floors at the
          statutory 10000.00 instead of collapsing to zero.
        test_recipe:
          setup:
            - "An ISSUED permit whose bond_required_amount is 865998.00 under FULL_PLAN and whose bond_held_amount is 900000.00."
            - "Disturbance reported as 75.00 disturbed and 75.00 reclaimed acres — the incremental basis is 0."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Fully Reclaimed Sand Co", tangible_net_worth: 13000000.00, fixed_assets_in_state: 6500000.00, total_liabilities: 4500000.00, net_income_prior_year: 500000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { op12_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Sandhill Borrow Area", county: "Cherry", total_acres: 200.00 }
              as: ProgramDirector
              captures: { site12_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${site12_id}", operator_id: "${op12_id}", mining_plan_acres: 120.00, post_mining_land_use: "CROPLAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${op12_id}"
              captures: { permit12_id: $.data.id }
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${permit12_id}", estimator_firm: "Ridgeline Reclamation Engineers", estimator_license_no: "RE-4417", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6000.00 }
              as: Operator
              as_user_id: "${op12_id}"
              captures: { est12_id: $.data.id }
            - call: "GET /mining/permits/${permit12_id}"
              as: PermitReviewer
              captures: { p12v1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${est12_id}/accept"
              payload: { expected_permit_version: "${p12v1}" }
              as: PermitReviewer
            - call: "POST /mining/bond-instruments"
              payload: { permit_id: "${permit12_id}", instrument_type: "CASH", face_amount: 900000.00 }
              as: Operator
              as_user_id: "${op12_id}"
              captures: { inst12_id: $.data.id }
            - call: "POST /mining/bond-instruments/${inst12_id}/accept"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/permits/${permit12_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
            - call: "PATCH /mining/permits/${permit12_id}/disturbance"
              payload: { disturbed_acres: 75.00, reclaimed_acres_credited: 75.00 }
              as: Operator
              as_user_id: "${op12_id}"
            - call: "GET /mining/permits/${permit12_id}"
              as: BondSpecialist
              captures: { p12v2: $.data.version }
          trigger:
            - call: "POST /mining/permits/${permit12_id}/recalculate-bond"
              payload: { basis: "INCREMENTAL", expected_permit_version: "${p12v2}" }
              as: BondSpecialist
              as_user_id: "bs-001"
          assert:
            - "Permit.${permit12_id}.bond_basis == INCREMENTAL"
            - "Permit.${permit12_id}.bond_required_amount == 10000.00 (not 0.00 and not 2500.00)"
            - "Permit.${permit12_id}.bond_deficiency_amount == 0.00"
            - "Permit.${permit12_id}.compliance_posture == COMPLIANT"
            - "Permit.${permit12_id}.bond_held_amount == 900000.00 (recalculation never touches posted instruments)"

