              captures: { av_lot_id: $.data.id }
            - call: "POST /malt-lots/${av_lot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /malt-lots/${av_lot_id}/release"
              payload: { release_note: "COA on file" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${av_id}", requested_ship_date: "2026-09-05T00:00:00Z", purchase_order_ref: "PO-AV-D" }
              as: Brewer
              as_user_id: "${av_id}"
              captures: { av_draft_id: $.data.id }
            - call: "POST /sales-orders/${av_draft_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${av_lot_id}" }
              as: Brewer
              as_user_id: "${av_id}"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${av_id}", requested_ship_date: "2026-09-06T00:00:00Z", purchase_order_ref: "PO-AV-C" }
              as: Brewer
              as_user_id: "${av_id}"
              captures: { av_conf_id: $.data.id }
            - call: "POST /sales-orders/${av_conf_id}/lines"
              payload: { item_type: "MALT", quantity: 1500, uom: "LB", malt_lot_id: "${av_lot_id}" }
