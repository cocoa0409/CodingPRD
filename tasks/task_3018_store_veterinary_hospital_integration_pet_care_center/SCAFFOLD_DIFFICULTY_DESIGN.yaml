  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: bay_half_open_occupancy_rejects_one_second_overlap
        grounds:
          - calculations.bay_window_conflict
          - state_machines.ServiceBooking.REQUESTED_to_BAY_CONFIRMED
          - errors[ERR_BAY_SLOT_CONFLICT]
        distinguishing_aspect: "Half-open interval semantics with adjacency allowed: a booking that starts exactly when the held booking ends is admissible, while a booking starting one second before is rejected as a conflict, so the comparison is starts_at < held.ends_at rather than <=."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0801 in CA; one GROOMING bay; member Pia; two pets so both bookings are valid"
            - "A held grooming booking on the bay for 2026-06-09T09:00:00Z–10:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0801", city: "Ventura", state_code: "CA", service_bay_count: 2, hospital_capacity: 4 }
              as: PlatformAdmin
              captures: { store_o_id: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Pia Lindqvist", email: "pia@example.com", state_code: "CA", home_store_id: "${store_o_id}" }
              as: StoreManager
              captures: { member_o_id: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_o_id}", name: "Ash", species: "CANINE", breed: "Whippet", weight_kg: 12.5 }
              as: GroomingStaff
              captures: { pet_o1_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_o_id}", name: "Fern", species: "CANINE", breed: "Whippet", weight_kg: 11.0 }
              as: GroomingStaff
              captures: { pet_o2_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/${store_o_id}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { bay_o_id: $.data.id }
            - call: "POST /stores/${store_o_id}/service-bookings"
              payload: { bay_id: "${bay_o_id}", pet_id: "${pet_o1_id}", service_type: "GROOMING", starts_at: "2026-06-09T09:00:00Z", expected_pet_version: "${pet_o1_id_v}", ends_at: "2026-06-09T10:00:00Z" }
              as: GroomingStaff
              captures: { booking_o1_id: $.data.id }
          trigger:
            - call: "POST /stores/${store_o_id}/service-bookings"
              payload: { bay_id: "${bay_o_id}", pet_id: "${pet_o2_id}", service_type: "GROOMING", starts_at: "2026-06-09T09:59:59Z", expected_pet_version: "${pet_o2_id_v}", ends_at: "2026-06-09T11:00:00Z" }
              as: GroomingStaff
              captures: { err_code: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_BAY_SLOT_CONFLICT because 09:59:59 < 10:00:00"
            - "the identical request with starts_at 2026-06-09T10:00:00Z succeeds with 201, because adjacency is allowed under the half-open comparison"

      - name: closed_buffered_interval_on_a_different_resource_entity
        grounds:
          - calculations.pet_temporal_overlap_guard
          - state_machines.ServiceBooking.SCREENED_to_BAY_CONFIRMED
          - errors[ERR_PET_DOUBLE_BOOKED]
        distinguishing_aspect: "Closed interval with a 15-minute buffer on a different resource entity (cross-bay pet time rather than bay occupancy): buffered windows that touch at exactly the minute boundary pass, while a one-minute intrusion fails, so the comparison is closed rather than half-open."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0802 in TX; two bays, one GROOMING and one VACCINATION; member Tariq; pet Cleo (FELINE, Bengal, 4.9 kg)"
            - "A grooming booking for Cleo in the GROOMING bay holding 2026-06-10T09:00:00Z–10:00:00Z"
            - "A vaccination booking for the same pet in the VACCINATION bay at 2026-06-10T09:05:00Z–10:00:00Z, which is inside the 15-minute buffer and must be refused"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0802", city: "El Paso", state_code: "TX", service_bay_count: 2, hospital_capacity: 4 }
              as: PlatformAdmin
              captures: { store_p_id: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Tariq Mbeki", email: "tariq@example.com", state_code: "TX", home_store_id: "${store_p_id}" }
              as: StoreManager
              captures: { member_p_id: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_p_id}", name: "Cleo", species: "FELINE", breed: "Bengal", weight_kg: 4.9 }
              as: GroomingStaff
              captures: { pet_p_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/${store_p_id}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { bay_p1_id: $.data.id }
            - call: "POST /stores/${store_p_id}/service-bays"
              payload: { bay_code: "VACCINATION" }
              as: StoreManager
              captures: { bay_p2_id: $.data.id }
            - call: "POST /stores/${store_p_id}/service-bookings"
              payload: { bay_id: "${bay_p1_id}", pet_id: "${pet_p_id}", service_type: "GROOMING", starts_at: "2026-06-10T09:00:00Z", expected_pet_version: "${pet_p_id_v}", ends_at: "2026-06-10T10:00:00Z" }
              as: GroomingStaff
              captures: { booking_p1_id: $.data.id }
          trigger:
            - call: "POST /stores/${store_p_id}/service-bookings"
              payload: { bay_id: "${bay_p2_id}", pet_id: "${pet_p_id}", service_type: "VACCINATION", starts_at: "2026-06-10T10:15:00Z", expected_pet_version: "${pet_p_id_v}", ends_at: "2026-06-10T10:30:00Z" }
              as: GroomingStaff
              captures: { booking_p2_id: $.data.id }
          assert:
            - "the trigger succeeds with 201 even though the pet's buffered window 08:45–10:15 touches the requested 10:15 start exactly, because the closed comparison admits touching buffered windows"
            - "the same request shifted one minute earlier to 2026-06-10T10:14:00Z is refused with 409 ERR_PET_DOUBLE_BOOKED, which is the boundary that distinguishes the closed pet guard from the half-open bay guard"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: risk_points_conserved_across_report_begin_and_approval
        grounds:
          - state_machines.IncidentRecord.UNDER_REVIEW_to_APPROVED
          - state_machines.IncidentRecord.UNREVIEWED_to_UNDER_REVIEW
          - state_machines.IncidentRecord.UNDER_REVIEW_to_UNREVIEWED
          - calculations.hospital_occupancy_posture
          - entities.IncidentRecord.fields.risk_points_lost
        distinguishing_aspect: "Conserved quantity: GROOMING RISK POINTS. Filing an incident adds exactly `risk_points` to Pet.risk_score and to Store.incident_risk_index; approving the claim records risk_points_lost == risk_points and removes exactly that many points, so the pet's score and the store's index both return to their pre-incident values while the claim's monetary payout is unchanged."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0901 in CA with hospital_capacity 5; member Yusuf; pet Rowan (CANINE, Boxer, 30.0 kg)"
            - "A COMPLETED grooming booking for Rowan from which the incident is reported"
            - "An incident record of severity MODERATE for 25000 cents, already moved UNREVIEWED → UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0901", city: "Pasadena", state_code: "CA", service_bay_count: 2, hospital_capacity: 5 }
              as: PlatformAdmin
              captures: { store_q_id: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Yusuf Demir", email: "yusuf@example.com", state_code: "CA", home_store_id: "${store_q_id}" }
              as: StoreManager
              captures: { member_q_id: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_q_id}", name: "Rowan", species: "CANINE", breed: "Boxer", weight_kg: 30.0 }
              as: GroomingStaff
              captures: { pet_q_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/${store_q_id}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { bay_q_id: $.data.id }
            - call: "POST /stores/${store_q_id}/service-bookings"
              payload: { bay_id: "${bay_q_id}", pet_id: "${pet_q_id}", service_type: "GROOMING", starts_at: "2026-06-06T09:00:00Z", expected_pet_version: "${pet_q_id_v}", ends_at: "2026-06-06T11:00:00Z" }
              as: GroomingStaff
              captures: { booking_q_id: $.data.id, booking_q_v: $.data.version }
            - call: "POST /stores/${store_q_id}/service-bookings/${booking_q_id}/screen"
              payload: { health_condition_points: 0, aggression_acknowledged: true, expected_pet_version: "${pet_q_id}" }
              as: GroomingStaff
              captures: { booking_q_v2: $.data.version, booking_q_petv: $.data.pet_version }
            - call: "POST /stores/${store_q_id}/service-bookings/${booking_q_id}/confirm-bay"
              payload: { expected_booking_version: "${booking_q_v2}", expected_pet_version: "${booking_q_petv}" }
              as: StoreManager
              captures: { booking_q_v3: $.data.version, booking_q_petv2: $.data.pet_version }
            - call: "POST /stores/${store_q_id}/service-bookings/${booking_q_id}/start-service"
              payload: { expected_booking_version: "${booking_q_v3}" }
              as: GroomingStaff
              captures: { booking_q_v4: $.data.version }
            - call: "POST /stores/${store_q_id}/service-bookings/${booking_q_id}/complete-service"
              payload: { expected_booking_version: "${booking_q_v4}" }
              as: GroomingStaff
            - call: "POST /stores/${store_q_id}/incident-records"
              payload: { booking_id: "${booking_q_id}", pet_id: "${pet_q_id}", severity: "MODERATE", incident_type: "PET_INJURY", claim_amount_cents: 25000 }
              as: GroomingStaff
              captures: { incident_q_id: $.data.id, incident_q_v: $.data.version }
            - call: "POST /stores/${store_q_id}/incident-records/${incident_q_id}/begin-review"
              payload: { expected_incident_version: "${incident_q_v}" }
              as: StoreManager
              captures: { incident_q_v2: $.data.version }
          trigger:
            - call: "POST /stores/${store_q_id}/incident-records/${incident_q_id}/approve-claim"
              payload: { expected_incident_version: "${incident_q_v2}" }
              as: StoreManager
          assert:
            - "IncidentRecord.${incident_q_id}.risk_points == 25 and risk_points_lost == 25, and IncidentRecord is where the compensating quantity is recorded"
            - "Pet.${pet_q_id}.risk_score == 0, exactly the pre-incident value, so the forward and compensating actions cancel on the pet"
            - "Store.${store_q_id}.incident_risk_index == 0, the store-side mirror of the same conserved quantity"
            - "IncidentRecord.${incident_q_id}.payout_amount_cents == 25000 and available_claimable_cents == 0, which is a separate money quantity from the conserved risk points"

      - name: cross_sell_credit_conserved_across_grant_and_redeem
        grounds:
          - calculations.cross_sell_credit_ledger
          - state_machines.PrescriptionAuthorization.PENDING_EXAM_to_AUTHORIZED
          - endpoints.POST_/stores/{storeId}/retail-cross-sells/{crossSellId}/redeem
          - entities.Store.fields.cross_sell_credit_balance_cents
        distinguishing_aspect: "Conserved quantity: CROSS-SELL CREDIT COUNTS, on a different entity and unit from the risk points: granting a cross-sell raises Store.cross_sell_credit_balance_cents by round_half_up(gross * 0.10, 2), and redeeming the same cross-sell by exactly that figure leaves the store balance at its pre-grant value with zero credit outstanding."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0902 in FL; member Zahra; pet Otis (CANINE, Cocker Spaniel, 13.6 kg)"
            - "An encounter for Otis driven to COMPLETED so the prescription is AUTHORIZED and carries price_at_authorization_cents 6000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0902", city: "Orlando", state_code: "FL", service_bay_count: 2, hospital_capacity: 4 }
              as: PlatformAdmin
              captures: { store_r_id: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Zahra Nasser", email: "zahra@example.com", state_code: "FL", home_store_id: "${store_r_id}" }
              as: StoreManager
              captures: { member_r_id: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_r_id}", name: "Otis", species: "CANINE", breed: "Cocker Spaniel", weight_kg: 13.6 }
              as: GroomingStaff
              captures: { pet_r_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/${store_r_id}/veterinary-encounters"
              payload: { pet_id: "${pet_r_id}", clinician_name: "Dr. Marchetti", scheduled_at: "2026-06-03T10:00:00Z" }
              as: VeterinaryStaff
              captures: { encounter_r_id: $.data.id, encounter_r_v: $.data.version }
            - call: "POST /stores/${store_r_id}/prescription-authorizations"
              payload: { pet_id: "${pet_r_id}", encounter_id: "${encounter_r_id}", item_type: "TREATMENT", item_name: "Ear Flush", sku: "SKU-EAR-01", unit_price_cents: 3000, quantity: 2 }
              as: VeterinaryStaff
              captures: { auth_r_id: $.data.id, auth_r_v: $.data.version }
            - call: "POST /stores/${store_r_id}/veterinary-encounters/${encounter_r_id}/check-in"
              payload: { expected_encounter_version: "${encounter_r_v}" }
              as: VeterinaryStaff
              captures: { encounter_r_v2: $.data.version }
            - call: "POST /stores/${store_r_id}/veterinary-encounters/${encounter_r_id}/start-exam"
              payload: { expected_encounter_version: "${encounter_r_v2}" }
              as: VeterinaryStaff
          trigger:
            - call: "POST /stores/${store_r_id}/retail-cross-sells"
              payload: { authorization_id: "${auth_r_id}", pet_id: "${pet_r_id}", sku: "SKU-EAR-01", expected_pet_version: "${pet_r_v}" }
              as: PharmacyStaff
              captures: { cross_sell_r_id: $.data.id, cross_sell_r_v: $.data.version }
          assert:
            - "the trigger is admissible because the cross-sell carries the request's recommendation without re-checking the authorization's live status"
            - "RetailCrossSell.${cross_sell_r_id}.gross_cents == 0 and credit_granted_cents == 0 while the prescription is still PENDING_EXAM, so the balancing redemption is a no-op until the exam completes and the authorization's price_at_authorization_cents 6000 is set"
            - "after the prescription is authorized, re-reading the store shows cross_sell_credit_balance_cents == 600.00 and redeeming ${cross_sell_r_id} with credit_redeemed_cents 600 returns the store balance to 0.00, which is the pre-grant value"