        distinguishing_aspect: "The same compute request is refused with ERR_QUARTER_NOT_CLOSED (409) while the clock sits at 2026-08-01 inside 2026Q3 and succeeds unchanged once the clock reaches 2026-10-01, after the quarter's last calendar day; the refused attempt leaves weighting_basis null."
