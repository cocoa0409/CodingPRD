            - call: "POST /label-versions"
              payload: { plan_id: "${plan_id}", effective_from: "2026-10-01T00:00:00Z", effective_until: "2026-11-01T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${plan_v3}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lv_d1_id: $.data.id }
            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { plan_v4: $.data.version }
            - call: "POST /label-versions"   # exact adjacency with D1's upper bound -> 201
              payload: { plan_id: "${plan_id}", effective_from: "2026-11-01T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${plan_v4}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lv_d2_id: $.data.id }
            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { plan_v5: $.data.version }
            - call: "POST /label-versions"   # straddles D1 by one day -> expect ERR_LABEL_WINDOW_OVERLAP (409)
              payload: { plan_id: "${plan_id}", effective_from: "2026-10-31T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${plan_v5}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /label-versions"   # not strictly after the PUBLISHED label's effective_from -> expect ERR_LABEL_EFFECTIVE_NOT_AFTER_PUBLISHED (422)
              payload: { plan_id: "${plan_id}", effective_from: "2026-09-01T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${plan_v5}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "D1 is created with version_seq 2, publication_state DRAFT, effective window [2026-10-01T00:00:00Z, 2026-11-01T00:00:00Z)"
            - "D2 is created with version_seq 3 and effective_from == D1.effective_until, proving adjacency at a shared instant is not an overlap"
            - "the 2026-10-31 request returns ERR_LABEL_WINDOW_OVERLAP (409) because 2026-10-31 < D1.effective_until and D1.effective_from < +infinity"
            - "the 2026-09-01 request returns ERR_LABEL_EFFECTIVE_NOT_AFTER_PUBLISHED (422), not ERR_LABEL_WINDOW_OVERLAP, because priority 55 outranks priority 60 even though that window also straddles D1 and D2"
            - "GET /label-versions?plan_id=${plan_id} returns exactly three rows after the trigger: version_seq 1 PUBLISHED, 2 DRAFT, 3 DRAFT"
            - "the PUBLISHED label version_seq 1 keeps effective_until == null: the overlap rule only compares DRAFT windows and no truncation happens before publication"

      - name: probe_cooldown_buffer_and_capacity_boundary
        grounds:
          - validations.priority_60
          - validation_constants.PROBE_COOLDOWN_MINUTES
          - errors.ERR_PROBE_COOLDOWN_CONFLICT
          - entities.MeasurementProbe.fields.max_concurrent_windows
        distinguishing_aspect: |
          A different occupied resource with different interval semantics: a MeasurementProbe's
          measurement capacity over *closed* [window_start, window_end] intervals extended by a
          trailing 60-minute cooldown, where intersection is counted rather than forbidden — the same
          geometry is rejected on a capacity-1 probe and accepted on a capacity-2 probe.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ServicePlan FIBER300 and PUBLISHED MethodologyDocument MTH-2026-A (max_run_duration_days 7)."
            - "MeasurementProbe PRB-COOL with max_concurrent_windows 1 and MeasurementProbe PRB-WIDE with max_concurrent_windows 2."
            - "One INCLUDED TestRun on each probe over the closed window [2026-08-03T00:00:00Z, 2026-08-09T23:00:00Z], whose buffered end is therefore 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer

            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, data_allowance_gb: 1200, overage_rate_cents_per_gb: 1000, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }

            - call: "POST /methodology-documents"
              payload: { doc_code: "MTH-2026-A", version_label: "v1.0", methodology_url: "https://isp.example/methodology/v1.0", peak_hours_start_utc_hour: 19, peak_hours_end_utc_hour: 23, min_samples_required: 4, max_run_duration_days: 7 }
              as: NetworkEngineer
              captures: { doc_id: $.data.id }
            - call: "POST /methodology-documents/${doc_id}/publish"
              payload: {}
              as: ComplianceOfficer

            - call: "POST /measurement-probes"
              payload: { probe_code: "PRB-COOL", market_code: "US-CO-DEN", panel_size: 50, max_concurrent_windows: 1 }
              as: NetworkEngineer
              captures: { probe_cool_id: $.data.id }
            - call: "POST /measurement-probes"
              payload: { probe_code: "PRB-WIDE", market_code: "US-CO-COS", panel_size: 50, max_concurrent_windows: 2 }
              as: NetworkEngineer
              captures: { probe_wide_id: $.data.id }
            - call: "POST /test-runs"
              payload: { probe_id: "${probe_cool_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-09T23:00:00Z", samples: [ {observed_at: "2026-08-03T19:10:00Z", download_mbps: 250, upload_mbps: 120, latency_ms: 20} ]}
              as: NetworkEngineer
              captures: { run_cool_id: $.data.id }
            - call: "POST /test-runs"
              payload: { probe_id: "${probe_wide_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-09T23:00:00Z", samples: [ {observed_at: "2026-08-03T19:20:00Z", download_mbps: 250, upload_mbps: 120, latency_ms: 20} ]}
              as: NetworkEngineer
              captures: { run_wide_id: $.data.id }
          trigger:
            - call: "POST /test-runs"   # starts exactly at the buffered end on a capacity-1 probe -> expect ERR_PROBE_COOLDOWN_CONFLICT (409)
              payload: { probe_id: "${probe_cool_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z", samples: [ {observed_at: "2026-08-10T19:10:00Z", download_mbps: 250, upload_mbps: 120, latency_ms: 20} ]}
              as: NetworkEngineer
            - call: "POST /test-runs"   # one minute past the buffered end -> 201
              payload: { probe_id: "${probe_cool_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-10T00:01:00Z", window_end: "2026-08-11T00:00:00Z", samples: [ {observed_at: "2026-08-10T19:10:00Z", download_mbps: 250, upload_mbps: 120, latency_ms: 20} ]}
              as: NetworkEngineer
              captures: { run_cool2_id: $.data.id }
            - call: "POST /test-runs"   # identical boundary geometry on a capacity-2 probe -> 201
              payload: { probe_id: "${probe_wide_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z", samples: [ {observed_at: "2026-08-10T19:20:00Z", download_mbps: 250, upload_mbps: 120, latency_ms: 20} ]}
              as: NetworkEngineer
              captures: { run_wide2_id: $.data.id }
          assert:
            - "call 1 returns ERR_PROBE_COOLDOWN_CONFLICT (409): new.window_start 2026-08-10T00:00:00Z <= other.window_end + 60 minutes == 2026-08-10T00:00:00Z, so the buffered intersection count is 1 and max_concurrent_windows is 1"
            - "call 2 returns 201: 2026-08-10T00:01:00Z is strictly after the buffered end, so the intersection count is 0"
            - "call 3 returns 201 on PRB-WIDE with the same window as the rejected call 1, because its intersection count 1 is below max_concurrent_windows 2 — capacity, not geometry, decides"
            - "ServicePlan.${plan_id}.evidence_sample_total == 4 after the trigger (two setup runs plus the two accepted runs, one sample each); the rejected call added nothing"
            - "TestRun.${run_cool2_id}.status == INCLUDED and TestRun.${run_wide2_id}.status == INCLUDED"

