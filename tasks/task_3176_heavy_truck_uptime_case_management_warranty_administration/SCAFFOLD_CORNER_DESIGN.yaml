        distinguishing_aspect: "A CRITICAL/STOP_IMMEDIATELY fault event whose occurred_at is more than 30 minutes in the past cannot seed a Case — POST /cases with that fault_event_id returns 422 ERR_CRITICAL_FAULT_WINDOW_LAPSED."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T12:00:00Z. Fleet/Truck; FaultEvent occurred at 11:00:00Z (>30 min ago), severity CRITICAL, recommended_action STOP_IMMEDIATELY."]
