          trigger:
            - call: "GET /prize-awards?prize_fund_id=${pf_id}"
              payload: {}
              as: LeagueTreasurer
              as_user_id: "${tre_id}"
              captures: { pa1_id: "$.data[0].id", pa2_id: "$.data[1].id" }
            - call: "POST /prize-awards/${pa1_id}/reverse"
              payload: { reversal_reason: "Place 1 cheque returned unpresented by the bank" }
              as: LeagueTreasurer
              as_user_id: "${tre_id}"
            - call: "POST /prize-awards/${pa2_id}/reverse"
              payload: { reversal_reason: "Place 2 cheque recalled pending a standings audit" }
              as: LeagueTreasurer
              as_user_id: "${tre_id}"
          assert:
            - "before the first reversal: PrizeFund.${pf_id}.collected_prize_cents == 2800, paid_award_total_cents == 2580 and undistributed_balance_cents == 220 == 140 reserve + 80 admin fee"
            - "the place 1 award ${pa1_id} has team_id == ${t1_id}, place == 1, weight == 0.60 and amount_cents == 1548; the place 2 award ${pa2_id} has team_id == ${t2_id}, weight == 0.40 and amount_cents == 1032"
            - "after the first reversal: PrizeAward.${pa1_id}.status == REVERSED with reversal_reason == 'Place 1 cheque returned unpresented by the bank', while PrizeAward.${pa2_id}.status is still PAID"
            - "after the first reversal: PrizeFund.${pf_id}.paid_award_total_cents == 1032 and undistributed_balance_cents == 1768, so 1032 + 1768 == 2800 == collected_prize_cents"
            - "after the first reversal: PrizeFund.${pf_id}.status == PLAN_APPROVED with disbursed_at == null, and League.${lg_id}.status == SEASON_CLOSED - the fund and league revert on the FIRST reversal, not only when every award is reversed"
            - "after the second reversal: PrizeFund.${pf_id}.paid_award_total_cents == 0 and undistributed_balance_cents == 2800, the exact pre-disbursement value"
            - "after the second reversal: PrizeFund.${pf_id}.plan_basis_cents == 2800, reserve_cents == 140, admin_fee_cents == 80, net_distributable_cents == 2580 and place_count == 2 all survive as the audit trail"
            - "after the second reversal: PrizeAward.${pa1_id}.amount_cents == 1548 and PrizeAward.${pa2_id}.amount_cents == 1032 are preserved, not zeroed - only the status changed"
            - "PrizeFund.${pf_id}.collected_prize_cents == 2800 is never touched by disbursement or reversal, and PrizeFund.${pf_id}.plan_approved_by_user_id == ${sec_id} throughout"
            - "Team.${t1_id}.total_points == 8.0 and Team.${t2_id}.total_points == 0.0 across the whole compensating pair"
