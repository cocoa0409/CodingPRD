  - rule_id: priority_pair_validation_conflict
    instances:
      - name: reinstatement_not_suspended_409_beats_open_critical_nonconformance_422
        grounds:
          - validations.priority_13
          - validations.priority_21
          - errors.ERR_CERTIFICATE_NOT_SUSPENDED
          - errors.ERR_OPEN_CRITICAL_NONCONFORMANCE
          - state_machines.Certificate.SUSPENDED_to_REVOKED
          - endpoints."POST /gfco/certificates/{certificateId}/reinstatement"
        distinguishing_aspect: |
          The reinstatement call violates two independent rules at once - the certificate is
          REVOKED rather than SUSPENDED (priority 13, 409) and the applicant still carries an OPEN
          CRITICAL nonconformance against that certificate (priority 21, 422). Priority 13 must
          win, so the observable outcome is a 409 ERR_CERTIFICATE_NOT_SUSPENDED and never the 422.
          Priority 12 is deliberately scoped away from reinstatement so it cannot pre-empt this
          pair, and nothing about the certificate or the nonconformance may change.
        test_recipe:
          setup:
            - "The canonical certified product with a certificate issued at 2026-08-11T00:00:00Z (base_fee_cents 149000, total_fee_cents 178800)."
            - "A CRITICAL AIR_HANDLING nonconformance raised against that certificate (source_type SURVEILLANCE_RUN, certificate_id set), which suspends the certificate with suspension_reason CRITICAL_NONCONFORMANCE and freezes the label; the nonconformance is left OPEN."
            - "The certificate is then revoked with revocation_reason UNRESOLVED_NONCONFORMANCE, which is neither FRAUD nor REPEAT_FAILURE (so no posture override) and not VOLUNTARY_WITHDRAWAL (so no fee refund)."
