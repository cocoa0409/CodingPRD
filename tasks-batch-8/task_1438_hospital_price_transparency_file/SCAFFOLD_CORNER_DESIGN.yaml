            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${r1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/freeze", as: TransparencyOfficer, captures: { cy_v1: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cy}", file_format: "JSON", expected_publication_cycle_version: "${cy_v1}" }, as: TransparencyOfficer, captures: { f1: $.data.id } }
            - { call: "GET /transparency/publication-cycles/${cy}", as: TransparencyOfficer, captures: { cy_v2: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cy}", file_format: "CSV", expected_publication_cycle_version: "${cy_v2}" }, as: TransparencyOfficer, captures: { f2: $.data.id } }
          trigger:
