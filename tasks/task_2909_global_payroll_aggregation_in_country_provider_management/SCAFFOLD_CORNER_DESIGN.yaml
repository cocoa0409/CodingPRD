          difficulty_instance: funding_conversion_rounds_each_component_before_summing
          rationale: "That §1.8 instance pins every intermediate of the aggregation - the three rounded components, the subtotal, the 1.5 percent buffer and funded_source_minor 9543206 rather than 9543207 - so a separate correct-result test would assert the same literals."

