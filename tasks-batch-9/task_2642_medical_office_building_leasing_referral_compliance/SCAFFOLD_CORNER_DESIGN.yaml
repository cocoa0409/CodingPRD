            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
