      - name: bulk_order_below_the_identity_threshold_starts_identity_verified
        claim_type: initial_state
        grounds:
          - state_machines.BulkPurchaseOrder.initial_state
          - state_machines.BulkPurchaseOrder.PENDING_IDENTITY_to_IDENTITY_VERIFIED
          - calculations.bulk_order_total
          - entities.RiskPolicy.fields.bulk_identity_threshold_cents
        distinguishing_aspect: "The declared initial_state PENDING_IDENTITY is overridden at creation when the computed total falls under the 50000 threshold: 25 cards x 1000 = subtotal 25000 (exactly the 150 bps tier floor) + fee 375 = total 25375, so the order is already IDENTITY_VERIFIED with a null identity hash and can be approved without an ID."
        test_recipe:
          setup:
            - "One RetailStore with floor_posture OPEN. RiskPolicy at its defaults (bulk_identity_threshold_cents 50000, bulk_quantity_limit 25)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Bulk Below Threshold Store", region_code: "SW", address_line: "12 Bulk Blvd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
          trigger:
            - call: "POST /bulk-purchase-orders"
              payload: { store_id: "${store1_id}", card_quantity: 25, face_value_cents_each: 1000, purchaser_name: "Northline Staffing LLC", payment_method: "CORPORATE_ACH" }
              as: PosAssociate
              captures: { order_id: $.data.id, o_state: $.data.state, o_total: $.data.total_cents, o_fee: $.data.activation_fee_cents, o_bps: $.data.fee_rate_bps }
            - call: "POST /bulk-purchase-orders/${order_id}/decide"
              payload: { decision: "APPROVE", decision_note: "under the identity threshold" }
              as: RiskManager
              as_user_id: "risk-51"
              captures: { o_state2: $.data.state }
          assert:
            - "HTTP status == 201 for the create"
            - "${o_state} == IDENTITY_VERIFIED — the system moved PENDING_IDENTITY -> IDENTITY_VERIFIED at creation because total 25375 < 50000"
            - "BulkPurchaseOrder.${order_id}.face_value_subtotal_cents == 25000"
            - "${o_bps} == 150 — 25000 sits exactly on the lower edge of the 25000..99999 tier"
            - "${o_fee} == 375"
            - "${o_total} == 25375"
            - "BulkPurchaseOrder.${order_id}.card_quantity == 25 — exactly at bulk_quantity_limit, which is accepted"
            - "BulkPurchaseOrder.${order_id}.identity_id_number_hash == null and identity_id_type == null"
            - "${o_state2} == APPROVED — no ERR_IDENTITY_VERIFICATION_REQUIRED below the threshold"
            - "BulkPurchaseOrder.${order_id}.decided_by_user_id == risk-51 and info_request_count == 0"

      - name: gift_card_dimensions_change_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: gift_card_parallel_activation_and_posture_dimensions_diverge
          rationale: "That §1.8 instance already drives GiftCard to DEPLETED+FROZEN and then reverses a redemption to reach ACTIVE+FROZEN, asserting both dimensions independently at each checkpoint plus the balance and total_loaded_cents. A second parallel-dimension probe here would restate the same claim with weaker arithmetic."

      - name: floor_suspension_cascades_into_inactive_cards
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: rack_tamper_three_hop_cascade_suspends_store_and_voids_inactive_cards
          rationale: "That §1.8 instance already covers the full CardRack -> RetailStore -> GiftCard cascade, including the conditional part (only INACTIVE cards are VOIDED while the ACTIVE card is untouched) and the forced risk_posture := FROZEN side effect on the voided cards."

      - name: claim_approval_side_effects_reach_the_liability_period
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: claim_approval_four_hop_cascade_to_open_liability_period
          rationale: "That §1.8 instance already asserts every side effect of VictimClaim SUBMITTED -> APPROVED end to end: per-line recovery rounding, the original card's CLOSED transition, the replacement card's creation and balance, and the OPEN LiabilityPeriod's unauthorized_writeoff_cents."

      - name: rescind_compensates_every_approval_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: claim_rescind_conserves_net_funded_liability
          rationale: "That §1.8 instance already walks APPROVED -> RESCINDED and asserts the full compensation: the replacement card VOIDED/FROZEN with balance 0, the original card back to ACTIVE with its pre-approval balance and closed_at null, and unauthorized_writeoff_cents returned to 0."

  # ==========================================================================
  - section: calculations
    instances:

      - name: digital_score_declines_exactly_at_the_configured_decline_threshold
        claim_type: constants_applied
        grounds:
          - calculations.digital_issuance_risk_score
          - entities.RiskPolicy.fields.digital_decline_score_threshold
          - state_machines.IssuanceRequest.SUBMITTED_to_DECLINED
          - entities.IssuanceRequest.fields.decline_reason
          - entities.RetailStore.fields.declined_issuance_count
        distinguishing_aspect: "The decline band is read from RiskPolicy, not hardcoded: with digital_decline_score_threshold lowered to 70 a score of exactly 70 DECLINES (>=, not >), where the same request under the shipped default of 75 would only have been HELD_FOR_REVIEW. It also pins the rounding — 0.35*95 + 0.25*70 + 0.25*60 + 0.15*30 = 70.25 rounds half-up to 70, not up to 71."
        test_recipe:
          setup:
            - "One RetailStore with floor_posture OPEN."
            - "RiskPolicy updated so digital_decline_score_threshold is 70 (all other thresholds left at their defaults, so the hold band is still 45)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Digital Decline Store", region_code: "SE", address_line: "20 Decline Dr" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id, sv0: $.data.version }
            - call: "PUT /risk-policy"
              payload: { digital_decline_score_threshold: 70 }
              as: PlatformAdmin
              captures: { decline_thr: $.data.digital_decline_score_threshold, hold_thr: $.data.digital_hold_score_threshold }
            - call: "POST /issuance-requests"
              payload: { channel: "DIGITAL", face_value_cents: 30000, store_id: "${store1_id}", device_reputation_score: 5, email_age_days: 3, payment_risk_band: "HIGH", recipient_email_hash: "eh-decline-70" }
              as: PosAssociate
              captures: { ir_id: $.data.id }
          trigger:
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
              captures: { ir_state: $.data.state, ir_score: $.data.screening_score, ir_reason: $.data.decline_reason, ir_card: $.data.card_id }
          assert:
            - "${decline_thr} == 70 and ${hold_thr} == 45"
            - "HTTP status == 200"
            - "IssuanceRequest.${ir_id}.screening_components.device == 95 — max(0, 100 - 5)"
            - "IssuanceRequest.${ir_id}.screening_components.email == 70 — email_age_days 3 falls in the < 7 band"
            - "IssuanceRequest.${ir_id}.screening_components.payment == 60 — payment_risk_band HIGH"
            - "IssuanceRequest.${ir_id}.screening_components.amount == 30 — min(30, floor(30000/5000) * 5) is capped"
            - "IssuanceRequest.${ir_id}.screening_components.base == 70"
            - "IssuanceRequest.${ir_id}.screening_components.bulk_surcharge == 0 — bulk_order_id is null"
            - "${ir_score} == 70"
            - "${ir_state} == DECLINED — exactly at the threshold declines"
            - "${ir_reason} == DIGITAL_RISK_SCORE"
            - "${ir_card} == null — the declined branch mints no card"
            - "RetailStore.${store1_id}.declined_issuance_count == 1 and version > ${sv0}"
            - "GET /ledger-events returns total_count == 0 — no funding movement on the declined branch"

      - name: digital_score_rounds_half_up_at_two_point_five
        claim_type: precision
        grounds:
          - calculations.digital_issuance_risk_score
          - entities.IssuanceRequest.fields.screening_score
          - state_machines.IssuanceRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: "The weighted blend lands on an exact .5: 0.35*5 + 0.25*0 + 0.25*0 + 0.15*5 = 2.5, which must round HALF-UP to 3. Banker's rounding would store 2, and truncation would store 2 — only half-up yields 3."
        test_recipe:
          setup:
            - "Empty database, no store required — a DIGITAL request may omit store_id."
            - "RiskPolicy at its defaults."
          setup_api_calls:
            - call: "GET /risk-policy"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuance-requests"
              payload: { channel: "DIGITAL", face_value_cents: 5000, device_reputation_score: 95, email_age_days: 900, payment_risk_band: "LOW", recipient_email_hash: "eh-round-half-up" }
              as: PosAssociate
              captures: { ir_id: $.data.id }
          trigger:
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
              captures: { ir_score: $.data.screening_score, ir_state: $.data.state, card_id: $.data.card_id }
          assert:
            - "IssuanceRequest.${ir_id}.screening_components.device == 5"
            - "IssuanceRequest.${ir_id}.screening_components.email == 0 — email_age_days 900 is in the >= 365 band"
            - "IssuanceRequest.${ir_id}.screening_components.payment == 0 — LOW"
            - "IssuanceRequest.${ir_id}.screening_components.amount == 5 — min(30, floor(5000/5000) * 5)"
            - "IssuanceRequest.${ir_id}.screening_components.base == 3 — round_half_up(2.5), NOT 2"
            - "${ir_score} == 3"
            - "${ir_state} == APPROVED"
            - "GiftCard.${card_id}.channel == DIGITAL and store_id == null and rack_id == null"
            - "GiftCard.${card_id}.activation_state == ACTIVE and current_balance_cents == 5000"
            - "GiftCard.${card_id}.drain_risk_score_inquiry == 0 and drawdown_ratio == 0.00"

      - name: bulk_fee_tier_boundaries_straddle_24999_25000_and_500000
        claim_type: tiered_pricing
        grounds:
          - calculations.bulk_order_total
          - entities.BulkPurchaseOrder.fields.fee_rate_bps
          - entities.BulkPurchaseOrder.fields.activation_fee_cents
        distinguishing_aspect: "Three orders bracket two tier edges on the PRE-FEE subtotal: 24999 -> 0 bps / fee 0, 25000 -> 150 bps / fee 375, and 500000 -> 300 bps / fee 15000. The single cent between 24999 and 25000 changes the rate, and the top tier is inclusive at exactly 500000."
        test_recipe:
          setup:
            - "One RetailStore with floor_posture OPEN. RiskPolicy at its defaults (bulk_quantity_limit 25)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Tier Edge Store", region_code: "MW", address_line: "21 Tier Ter" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
          trigger:
            - call: "POST /bulk-purchase-orders"
              payload: { store_id: "${store1_id}", card_quantity: 1, face_value_cents_each: 24999, purchaser_name: "Edge Below LLC", payment_method: "CORPORATE_ACH" }
              as: PosAssociate
              captures: { o1: $.data.id, bps1: $.data.fee_rate_bps, fee1: $.data.activation_fee_cents, tot1: $.data.total_cents, st1: $.data.state }
            - call: "POST /bulk-purchase-orders"
              payload: { store_id: "${store1_id}", card_quantity: 1, face_value_cents_each: 25000, purchaser_name: "Edge At LLC", payment_method: "CORPORATE_ACH" }
              as: PosAssociate
              captures: { o2: $.data.id, bps2: $.data.fee_rate_bps, fee2: $.data.activation_fee_cents, tot2: $.data.total_cents, st2: $.data.state }
            - call: "POST /bulk-purchase-orders"
              payload: { store_id: "${store1_id}", card_quantity: 20, face_value_cents_each: 25000, purchaser_name: "Top Tier LLC", payment_method: "CREDIT" }
              as: PosAssociate
              captures: { o3: $.data.id, bps3: $.data.fee_rate_bps, fee3: $.data.activation_fee_cents, tot3: $.data.total_cents, st3: $.data.state }
          assert:
            - "BulkPurchaseOrder.${o1}.face_value_subtotal_cents == 24999"
            - "${bps1} == 0 and ${fee1} == 0 and ${tot1} == 24999"
            - "${st1} == IDENTITY_VERIFIED — 24999 is below the 50000 identity threshold"
            - "BulkPurchaseOrder.${o2}.face_value_subtotal_cents == 25000"
            - "${bps2} == 150 and ${fee2} == 375 and ${tot2} == 25375"
            - "${st2} == IDENTITY_VERIFIED"
            - "BulkPurchaseOrder.${o3}.face_value_subtotal_cents == 500000"
            - "${bps3} == 300 — the >= 500000 tier is inclusive at its floor"
            - "${fee3} == 15000 and ${tot3} == 515000"
            - "${st3} == PENDING_IDENTITY — 515000 is at or above the 50000 identity threshold"
            - "the fee is charged once on the whole order, so ${fee3} is 15000 rather than 20 per-card fees of 750"

      - name: hold_capacity_excludes_released_holds
        claim_type: input_set_filtering
        grounds:
          - calculations.hold_capacity_check
          - entities.RedemptionHold.fields.state
          - entities.GiftCard.fields.held_amount_cents
        distinguishing_aspect: "Only ACTIVE holds consume capacity: after a 6000 hold is RELEASED, a 9000 hold over the very same 00:00..06:00 window is accepted on a 10000 card. If released holds still counted, 6000 + 9000 > 10000 would have raised ERR_HOLD_CAPACITY_EXCEEDED."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 10000 cents."
            - "One RedemptionHold of 6000 cents over 00:00..06:00, already settled with disposition RELEASE."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Hold Filter Store", region_code: "NW", address_line: "22 Filter Rd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-HF", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-5301" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 10000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-53", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "GET /gift-cards/${card_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-53"
              captures: { cv1: $.data.version }
            - call: "POST /gift-cards/${card_id}/redemption-holds"
              payload: { amount_cents: 6000, hold_start: "2026-08-01T00:00:00Z", hold_expires_at: "2026-08-01T06:00:00Z", expected_gift_card_version: "${cv1}" }
              as: PosAssociate
              captures: { holdA_id: $.data.id }
            - call: "POST /redemption-holds/${holdA_id}/settle"
              payload: { disposition: "RELEASE", settle_note: "shopper changed their mind" }
              as: PosAssociate
              captures: { stateA: $.data.state }
            - call: "GET /gift-cards/${card_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-53"
              captures: { cv2: $.data.version, held2: $.data.held_amount_cents }
          trigger:
            - call: "POST /gift-cards/${card_id}/redemption-holds"
              payload: { amount_cents: 9000, hold_start: "2026-08-01T00:00:00Z", hold_expires_at: "2026-08-01T06:00:00Z", expected_gift_card_version: "${cv2}" }
              as: PosAssociate
              captures: { holdB_id: $.data.id, stateB: $.data.state }
          assert:
            - "${stateA} == RELEASED and ${held2} == 0"
            - "HTTP status == 201"
            - "${stateB} == ACTIVE"
            - "RedemptionHold.${holdB_id}.amount_cents == 9000"
            - "GiftCard.${card_id}.held_amount_cents == 9000 — only holdB counts"
            - "GiftCard.${card_id}.current_balance_cents == 10000 and available_balance_cents == 1000"
            - "GET /gift-cards/${card_id}/redemption-holds returns total_count == 2, one RELEASED and one ACTIVE"

      - name: rack_classification_uses_the_seal_break_threshold_at_two_and_three
        claim_type: correct_result
        grounds:
          - calculations.rack_tamper_classification
          - entities.RiskPolicy.fields.rack_seal_break_threshold
          - state_machines.CardRack.INTACT_to_SUSPECT
          - state_machines.CardRack.SUSPECT_to_TAMPERED
        distinguishing_aspect: "Seal breaks alone classify the rack even when nothing is missing: 2 breaks with a full 10-of-10 count yields SUSPECT (>= 1 branch), and 3 breaks yields TAMPERED (>= rack_seal_break_threshold), while missing_card_count stays 0 in both audits — the two conditions of branch 1 are OR-ed, not AND-ed."
        test_recipe:
          setup:
            - "One RetailStore with floor_posture OPEN and one CardRack with expected_card_count 10, never audited. No GiftCards exist, so the floor suspension has nothing to cascade into."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Seal Break Store", region_code: "SW", address_line: "23 Seal St" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-SB", expected_card_count: 10 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
          trigger:
            - call: "POST /card-racks/${rack1_id}/audits"
              payload: { observed_card_count: 10, seal_breaks_observed: 2 }
              as: PosAssociate
              captures: { state_a: $.data.tamper_state, missing_a: $.data.missing_card_count }
            - call: "POST /card-racks/${rack1_id}/audits"
              payload: { observed_card_count: 10, seal_breaks_observed: 3 }
              as: PosAssociate
              captures: { state_b: $.data.tamper_state, missing_b: $.data.missing_card_count }
            - call: "GET /stores/${store1_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-54"
              captures: { floor_b: $.data.floor_posture, tampered_b: $.data.tampered_rack_count }
          assert:
            - "${state_a} == SUSPECT — 2 breaks clears the >= 1 branch but not the threshold of 3"
            - "${missing_a} == 0 — max(0, 10 - 10)"
            - "${state_b} == TAMPERED — 3 breaks is exactly rack_seal_break_threshold"
            - "${missing_b} == 0 — nothing is missing, yet the rack is TAMPERED"
            - "CardRack.${rack1_id}.seal_breaks_observed == 3 and observed_card_count == 10"
            - "${floor_b} == SUSPENDED and ${tampered_b} == 1 — one TAMPERED rack outranks everything"
            - "RetailStore.${store1_id}.suspect_rack_count == 0 at the second checkpoint — the rack left SUSPECT"

      - name: store_floor_heightens_at_exactly_two_open_alerts_and_relaxes_on_dismissal
        claim_type: constants_applied
        grounds:
          - calculations.store_floor_posture
          - entities.RiskPolicy.fields.floor_heightened_alert_threshold
          - state_machines.RetailStore.OPEN_to_HEIGHTENED
          - state_machines.RetailStore.HEIGHTENED_to_OPEN
        distinguishing_aspect: "The floor tracks open_alert_count against floor_heightened_alert_threshold in both directions: one alert leaves the floor OPEN, the second (== 2) heightens it, and dismissing one alert drops the count back to 1 and the floor back to OPEN. A DISMISSED alert stops counting immediately."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack with expected_card_count 6, and two ACTIVE PHYSICAL GiftCards of 9000 cents each on that store."
          setup_api_calls:
