# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules x >=2 instances = 19 instances. Every instance is a fully structured
# test prototype: setup_api_calls drive empty-DB into the precondition state.
# Logical clock default before any set_current_utc call: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: mitigation_credits_provisional_vs_final_timing_lag
        grounds:
          - calculations.mitigation_credit_requirement
          - entities.MitigationPlan.fields.required_credits_by_type
          - entities.MitigationPlan.fields.final_credits_required_by_type
          - state_machines.MitigationPlan.APPROVED_to_CREDITS_SECURED
        distinguishing_aspect: |
          Dual variant on the MitigationPlan domain: the provisional computation at plan
          creation fixes location and lag multipliers at 1.0 (2.0 acres FORESTED_WETLAND ->
          6.00 credits), while the final computation at secure-credits 400 days after
          submission applies lag tier 1.10, so identical plan data yields 6.60 credits.
        test_recipe:
          setup:
            - "Applicant, VA site in watershed 18020101, issued APPROVED JURISDICTIONAL JD"
            - "Individual application (2.0 acres FORESTED_WETLAND) advanced to DECISION_PENDING with pir_score 17.25 FAVORABLE; comment period closed at 2026-10-02"
            - "BANK_CREDITS plan APPROVED; in-basin bank OPERATIONAL; 7.0 credits PURCHASED before the clock jump"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND", "STREAM"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Delineation confirmed forested wetland contiguous with Piney Branch" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 2.0 } ], project_purpose: "Regional stormwater facility", estimated_cost_dollars: 750000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /wetland-permits/applications/${app_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/alternatives-analyses", payload: { application_id: "${app_id}", avoidance_demonstrated: true, avoidance_narrative: "Upland bench siting avoids all waters", minimization_steps: ["Relocated outfall to upland bench", "Reduced footprint by 40 percent"], ledpa_conclusion: "PROPOSED_IS_LEDPA", offsite_alternatives_considered: 3 }, as: Applicant, as_user_id: "${ap_id}", captures: { aa_id: "$.data.id" } }
            - { call: "POST /wetland-permits/alternatives-analyses/${aa_id}/review", payload: { verdict: "ACCEPT" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_id}/publish-notice", payload: { comment_period_days: 30 }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /wetland-permits/applications/${app_id}/advance-to-decision", payload: {}, as: Reviewer, as_user_id: "rev-1", captures: { pir_seen: "$.data.pir_score" } }
            - { call: "POST /wetland-permits/mitigation-plans", payload: { application_id: "${app_id}", mechanism: "BANK_CREDITS" }, as: Applicant, as_user_id: "${ap_id}", captures: { plan_id: "$.data.id", prov_credits: "$.data.required_credits_by_type" } }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/review", payload: { verdict: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-banks", payload: { bank_name: "Shenandoah Mitigation Bank", sponsor_name: "Shenandoah Conservancy", state_code: "VA", service_area_watersheds: ["18020101"], credit_capacity: { FORESTED_WETLAND: 20 }, base_price_per_credit: { FORESTED_WETLAND: 30000 } }, as: SystemAdmin, captures: { bank_id: "$.data.id" } }
            - { call: "POST /wetland-permits/mitigation-banks/${bank_id}/approve", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/credit-transactions", payload: { bank_id: "${bank_id}", plan_id: "${plan_id}", resource_type: "FORESTED_WETLAND", credits: 7.0 }, as: Applicant, as_user_id: "${ap_id}", captures: { txn_id: "$.data.id" } }
            - { call: "POST /wetland-permits/credit-transactions/${txn_id}/purchase", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-10-06T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/secure-credits", payload: {}, as: Applicant, as_user_id: "${ap_id}", captures: { final_credits: "$.data.final_credits_required_by_type", plan_status: "$.data.status" } }
          assert:
            - "provisional required_credits_by_type == {FORESTED_WETLAND: 6.00} (2.0 * 3.0 * 1.0 * 1.0)"
            - "pir_seen == 17.25"
            - "final_credits_required_by_type == {FORESTED_WETLAND: 6.60} (2.0 * 3.0 * 1.0 * 1.10; lag 400 days in tier 366..730)"
            - "final != provisional: 6.60 != 6.00 for identical plan inputs"
            - "plan_status == CREDITS_SECURED (7.0 purchased >= 6.60 required)"

      - name: pir_score_standard_vs_atf_deterrence
        grounds:
          - calculations.public_interest_review_score
          - entities.PermitApplication.fields.pir_score
          - state_machines.PermitApplication.PUBLIC_NOTICE_OPEN_to_DECISION_PENDING
        distinguishing_aspect: |
          Dual variant on the PermitApplication domain: identical inputs (2.0 acres
          FORESTED_WETLAND, 2 minimization steps, cost 750000, no comments, no secured plan)
          yield pir_score 17.25 under the standard variant and 9.25 under the
          after-the-fact deterrence variant (harm term -15.0/acre plus flat -10.0).
        test_recipe:
          setup:
            - "Standard INDIVIDUAL application at DECISION_PENDING (pir computed first)"
            - "ATF_INDIVIDUAL application with confirmed enforcement case, linked via set-resolution, advanced to DECISION_PENDING second"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND", "STREAM"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Delineation confirmed jurisdiction" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 2.0 } ], project_purpose: "Regional stormwater facility", estimated_cost_dollars: 750000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_a: "$.data.id" } }
            - { call: "POST /wetland-permits/applications/${app_a}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_a}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_a}/screening", payload: { action: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/alternatives-analyses", payload: { application_id: "${app_a}", avoidance_demonstrated: true, avoidance_narrative: "Avoidance shown", minimization_steps: ["Step one", "Step two"], ledpa_conclusion: "PROPOSED_IS_LEDPA", offsite_alternatives_considered: 2 }, as: Applicant, as_user_id: "${ap_id}", captures: { aa_a: "$.data.id" } }
            - { call: "POST /wetland-permits/alternatives-analyses/${aa_a}/review", payload: { verdict: "ACCEPT" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_a}/publish-notice", payload: { comment_period_days: 30 }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /wetland-permits/applications/${app_a}/advance-to-decision", payload: {}, as: Reviewer, as_user_id: "rev-1", captures: { pir_a: "$.data.pir_score", outcome_a: "$.data.pir_outcome" } }
            - { call: "POST /wetland-permits/enforcement-cases", payload: { site_id: "${site_id}", responsible_applicant_id: "${ap_id}", unauthorized_fill_acres: 2.0, description: "Unpermitted fill placed in forested wetland" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { case_id: "$.data.id" } }
            - { call: "POST /wetland-permits/enforcement-cases/${case_id}/confirm-violation", payload: {}, as: EnforcementOfficer, as_user_id: "eo-2" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "ATF_INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 2.0 } ], project_purpose: "Regional stormwater facility", estimated_cost_dollars: 750000, enforcement_case_id: "${case_id}" }, as: Applicant, as_user_id: "${ap_id}", captures: { app_b: "$.data.id" } }
            - { call: "POST /wetland-permits/enforcement-cases/${case_id}/set-resolution", payload: { track: "AFTER_THE_FACT_PERMIT", atf_application_id: "${app_b}" }, as: EnforcementOfficer, as_user_id: "eo-2" }
            - { call: "POST /wetland-permits/applications/${app_b}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_b}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_b}/screening", payload: { action: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/alternatives-analyses", payload: { application_id: "${app_b}", avoidance_demonstrated: true, avoidance_narrative: "Avoidance shown", minimization_steps: ["Step one", "Step two"], ledpa_conclusion: "PROPOSED_IS_LEDPA", offsite_alternatives_considered: 2 }, as: Applicant, as_user_id: "${ap_id}", captures: { aa_b: "$.data.id" } }
            - { call: "POST /wetland-permits/alternatives-analyses/${aa_b}/review", payload: { verdict: "ACCEPT" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_b}/publish-notice", payload: { comment_period_days: 30 }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /wetland-permits/applications/${app_b}/advance-to-decision", payload: {}, as: Reviewer, as_user_id: "rev-1", captures: { pir_b: "$.data.pir_score", outcome_b: "$.data.pir_outcome" } }
          assert:
            - "pir_a == 17.25 and outcome_a == FAVORABLE (standard: 0.40*(-10) + 0.35*50 + 0.25*15)"
            - "pir_b == 9.25 and outcome_b == FAVORABLE (ATF: 0.40*(-30) + 0.35*50 + 0.25*15)"
            - "pir_a != pir_b for byte-identical impacts, steps, cost, and comment state"

  - rule_id: combinatorial_formula
    instances:
      - name: credit_requirement_multi_input_tiered
        grounds:
          - calculations.mitigation_credit_requirement
        distinguishing_aspect: |
          Mode (a): four inputs (impact acres, resource-type ratio, out-of-basin location
          multiplier 1.25, tiered lag multiplier 1.10) interact non-linearly; the pinned
          multiplication order base -> location -> lag -> ATF yields exactly 8.25 credits
          for 2.0 FORESTED_WETLAND acres served out-of-basin 400 days after submission.
        test_recipe:
          setup:
            - "Individual application (2.0 acres FORESTED_WETLAND) in ALTERNATIVES_REVIEW with AA ACCEPTED (plan creation requires only AA ACCEPTED, not decision-pending state)"
            - "BANK_CREDITS plan APPROVED; bank OPERATIONAL in state VA but serving only watershed 18020202 (out-of-basin for site watershed 18020101); 9.0 credits PURCHASED"
            - "Clock advanced to 2027-10-06 (400 days after the 2026-09-01 submission)"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND", "STREAM"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 2.0 } ], project_purpose: "Stormwater facility", estimated_cost_dollars: 750000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /wetland-permits/applications/${app_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/alternatives-analyses", payload: { application_id: "${app_id}", avoidance_demonstrated: true, avoidance_narrative: "Avoidance shown", minimization_steps: ["Step one", "Step two"], ledpa_conclusion: "PROPOSED_IS_LEDPA", offsite_alternatives_considered: 2 }, as: Applicant, as_user_id: "${ap_id}", captures: { aa_id: "$.data.id" } }
            - { call: "POST /wetland-permits/alternatives-analyses/${aa_id}/review", payload: { verdict: "ACCEPT" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-plans", payload: { application_id: "${app_id}", mechanism: "BANK_CREDITS" }, as: Applicant, as_user_id: "${ap_id}", captures: { plan_id: "$.data.id", prov_credits: "$.data.required_credits_by_type" } }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/review", payload: { verdict: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-banks", payload: { bank_name: "Rapidan Mitigation Bank", sponsor_name: "Rapidan Conservancy", state_code: "VA", service_area_watersheds: ["18020202"], credit_capacity: { FORESTED_WETLAND: 20 }, base_price_per_credit: { FORESTED_WETLAND: 30000 } }, as: SystemAdmin, captures: { bank_id: "$.data.id" } }
            - { call: "POST /wetland-permits/mitigation-banks/${bank_id}/approve", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/credit-transactions", payload: { bank_id: "${bank_id}", plan_id: "${plan_id}", resource_type: "FORESTED_WETLAND", credits: 9.0 }, as: Applicant, as_user_id: "${ap_id}", captures: { txn_id: "$.data.id" } }
            - { call: "POST /wetland-permits/credit-transactions/${txn_id}/purchase", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-10-06T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/secure-credits", payload: {}, as: Applicant, as_user_id: "${ap_id}", captures: { final_credits: "$.data.final_credits_required_by_type", plan_status: "$.data.status" } }
          assert:
            - "final_credits == {FORESTED_WETLAND: 8.25} (2.0 * 3.0 base * 1.25 out-of-basin * 1.10 lag tier 366..730, in pinned order)"
            - "provisional was {FORESTED_WETLAND: 6.00}"
            - "plan_status == CREDITS_SECURED (9.0 purchased >= 8.25)"

      - name: ilf_fee_per_line_rounding_order
        grounds:
          - calculations.in_lieu_fee_amount
          - entities.MitigationPlan.fields.ilf_fee_due_dollars
          - state_machines.MitigationPlan.APPROVED_to_CREDITS_SECURED
        distinguishing_aspect: |
          Mode (b): nested rounding order is load-bearing. Credits are rounded per line
          first (0.666 -> 0.67; 0.333 -> 0.33), each fee line is then rounded to cents,
          and only then summed: 0.67*40000 + 0.33*25000 = 35050.00. Sum-then-round would
          yield 34965.00 (26640 + 8325); the scaffold pins per-line rounding.
        test_recipe:
          setup:
            - "Site presenting EMERGENT_MARSH and STREAM; issued JD"
            - "INDIVIDUAL application with impacts EMERGENT_MARSH 0.333 and STREAM 0.333 in ALTERNATIVES_REVIEW with AA ACCEPTED"
            - "IN_LIEU_FEE plan created, SUBMITTED, APPROVED"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Blue Ridge Builders", organization_type: "CORPORATION", contact_email: "permits@brb.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Meadow Creek Lot", state_code: "VA", watershed_code: "18020101", total_acres: 12.0, resource_types_present: ["EMERGENT_MARSH", "STREAM"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "EMERGENT_MARSH", impact_acres: 0.333 }, { resource_type: "STREAM", impact_acres: 0.333 } ], project_purpose: "Access road crossing", estimated_cost_dollars: 300000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /wetland-permits/applications/${app_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/alternatives-analyses", payload: { application_id: "${app_id}", avoidance_demonstrated: true, avoidance_narrative: "Avoidance shown", minimization_steps: ["Step one", "Step two"], ledpa_conclusion: "PROPOSED_IS_LEDPA", offsite_alternatives_considered: 1 }, as: Applicant, as_user_id: "${ap_id}", captures: { aa_id: "$.data.id" } }
            - { call: "POST /wetland-permits/alternatives-analyses/${aa_id}/review", payload: { verdict: "ACCEPT" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-plans", payload: { application_id: "${app_id}", mechanism: "IN_LIEU_FEE" }, as: Applicant, as_user_id: "${ap_id}", captures: { plan_id: "$.data.id", fee_due: "$.data.ilf_fee_due_dollars" } }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/review", payload: { verdict: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/pay-in-lieu-fee", payload: { amount_dollars: 35050.00 }, as: Applicant, as_user_id: "${ap_id}", captures: { paid: "$.data.ilf_fee_paid_dollars", plan_status: "$.data.status" } }
          assert:
            - "required_credits_by_type == {EMERGENT_MARSH: 0.67, STREAM: 0.33} (per-line half-up rounding of 0.666 and 0.333)"
            - "fee_due == 35050.00 (0.67*40000 + 0.33*25000; NOT 34965.00)"
            - "paid == 35050.00 and plan_status == CREDITS_SECURED"

      - name: bank_pricing_pre_transaction_tier
        grounds:
          - calculations.bank_credit_pricing
          - entities.CreditTransaction.fields.total_price_dollars
        distinguishing_aspect: |
          Mode (c): the price tier depends on the depletion fraction, which the purchase
          itself advances — a circular-looking dependency. The scaffold pins evaluation on
          the PRE-transaction purchased fraction: at 9/20 sold, a 2.0-credit purchase pays
          the <0.5 tier price (60000.00); a post-transaction reading (11/20 = 0.55) would
