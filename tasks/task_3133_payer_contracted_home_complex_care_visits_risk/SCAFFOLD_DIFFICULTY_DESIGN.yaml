# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3133_payer_contracted_home_complex_care_visits_risk
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: burden_score_provisional_vs_final_diverge_on_same_member
        grounds:
          - calculations.chronic_condition_burden_provisional
          - calculations.chronic_condition_burden_final
          - entities.Member.fields.burden_score_provisional
          - entities.Member.fields.burden_score_final
          - entities.Member.fields.risk_tier
        distinguishing_aspect: |
          Same Member row, same claims history. The PROVISIONAL variant
          (claims-only) computes burden_score_provisional = 6 (CHF) + 3*2 (ED)
          + 5*1 (IP) = 17 → HIGH. After the first COMPLETED INITIAL_ASSESSMENT
          with discrepancies_found=2, high_risk_med_changes=1, fall_risk=4,
          home_hazards=2, adl_impairment=1, food_insecure=true,
          housing_instability=false, transportation=true, isolation=3, the
          FINAL variant yields 17 + (2*1 + 1*2) + (4*1 + 2*1 + 1*2) + (1*2 +
          0*3 + 1*1 + 3*1) = 17 + 4 + 8 + 6 = 35 → VERY_HIGH. Two variants,
          same input member, different scores and tiers. The entity domain is
          the Member risk stratification subsystem.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "CareProgram CP with service_geography_zips [75201]."
            - "PayerContract under CP (CAPITATED, pmpm 500000)."
            - "PCPProvider P with notification_opt_in=true."
            - "Clinician NP1 (NP, 75201, max 5)."
            - "Member M (CHF, 2 ED, 1 IP) — burden_score_provisional=17, risk_tier=HIGH."
            - "Enrollment E (ACTIVE) with CareTeam ACTIVE (primary_np_id=NP1)."
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"], urgent_response_sla_hours: 24 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "HealthPlan A", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000, quality_withhold_pct: 0.10, min_performance_threshold: 0.80 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "Dallas Family Medicine", notification_opt_in: true }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 5, urgent_response_qualified: true }
              as: PlatformAdmin
              captures: { np_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "SUB-001", full_name: "Marion Ruiz", date_of_birth: "1950-04-12T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 2, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id, member_v: $.data.version, provisional_score: $.data.burden_score_provisional, provisional_tier: $.data.risk_tier }
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${member_v}" }
              as: EngagementSpecialist
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${enr_id}/record-consent"
              payload: { consent_document_id: "DOC-12345" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${enr_id}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: EngagementSpecialist
          trigger:
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", visit_type: "INITIAL_ASSESSMENT", scheduled_start: "2026-09-02T09:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }
              as: CareCoordinator
              captures: { visit_id: $.data.id, visit_clinician_id: $.data.clinician_id }
            - call: "POST /visits/${visit_id}/depart"
              payload: {}
              as: Clinician
              as_user_id: "${visit_clinician_id}"
            - call: "POST /visits/${visit_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${visit_clinician_id}"
            - call: "POST /visits/${visit_id}/assessment"
              payload:
                medication_reconciliation: { medications_reviewed: 8, discrepancies_found: 2, high_risk_med_changes: 1 }
                safety_evaluation: { fall_risk_score: 4, home_hazard_count: 2, adl_impairment_count: 1 }
                social_needs_screening: { food_insecurity: true, housing_instability: false, transportation_barrier: true, social_isolation_score: 3 }
                pcp_coordination_note: "Discussed med changes with Dr. Patel; will fax summary."
              as: Clinician
              as_user_id: "${visit_clinician_id}"
            - call: "POST /visits/${visit_id}/assessment/submit"
              payload: {}
              as: Clinician
              as_user_id: "${visit_clinician_id}"
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${visit_clinician_id}"
            - call: "GET /members/${member_id}"
              payload: {}
              as: PerformanceAnalyst
              captures: { final_score: $.data.burden_score_final, final_tier: $.data.risk_tier }
          assert:
            - "Member.${member_id}.burden_score_provisional == 17"
            - "Member.${member_id}.burden_score_final == 35"
            - "Member.${member_id}.burden_score_final != Member.${member_id}.burden_score_provisional"
            - "Member.${member_id}.risk_tier == VERY_HIGH after completion (was HIGH on creation)"
            - "the response data of GET /members/${member_id} carries both burden_score_provisional AND burden_score_final simultaneously — the provisional is preserved, not overwritten"

      - name: capitated_vs_shared_savings_settlement_diverge_on_same_population
        grounds:
          - calculations.capitated_settlement_amount
          - calculations.shared_savings_settlement_amount
          - entities.PayerSettlement.fields.gross_capitation_cents
          - entities.PayerSettlement.fields.gross_savings_share_cents
          - entities.PayerSettlement.fields.net_payment_cents
        distinguishing_aspect: |
          Two PayerContracts in the same CareProgram but covering DISJOINT
          enrolled populations: one CAPITATED (pmpm 500000, withhold 10%,
          threshold 0.80) with one ACTIVE member; one SHARED_SAVINGS
          (baseline 600000, split 0.50, withhold 10%, threshold 0.80) with
          two ACTIVE members each carrying 450000 in observed MedicalCost
          rows for period 0. CAPITATED computes gross = 1 * 500000 = 500000,
          withhold = 50000, release = full (the single member's composite
          defaults to 1.0 because no urgent episodes or visits exist), net =
          500000 - 50000 + 50000 = 500000. SHARED_SAVINGS computes per-member
          delta = 600000 - 450000 = 150000, pooled = 300000, share =
          round_half_up(300000 * 0.50) = 150000, withhold = 15000, release =
          15000, net = 150000. The two variants run on the PayerSettlement /
          fiscal domain — distinct from the Member risk domain in the
          sibling instance. Same logical period, radically different
          settlement amounts and structure (capitation is per-member
          multiplicative; shared-savings is pooled, split, and floored).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "CareProgram CP (zips [75201])."
            - "Two PayerContracts on CP: CAP (CAPITATED, pmpm 500000, withhold 0.10, threshold 0.80) and SS (SHARED_SAVINGS, baseline 600000, split 0.50, withhold 0.10, threshold 0.80)."
            - "PCPProvider P; Clinician NP1 (NP, 75201)."
            - "Members M1 (attributed to CAP) and M2 (attributed to SS); both enrolled to ACTIVE."
            - "Member M2 has a MedicalCost row of 450000 for period 0; a second member M3 also on SS has a 450000 row."
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"], urgent_response_sla_hours: 24 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanCap", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000, quality_withhold_pct: 0.10, min_performance_threshold: 0.80 }
              as: ContractAdministrator
              captures: { cap_contract: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanSS", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "SHARED_SAVINGS", shared_savings_baseline_pmpm_cents: 600000, shared_savings_split_pct: 0.50, quality_withhold_pct: 0.10, min_performance_threshold: 0.80 }
              as: ContractAdministrator
              captures: { ss_contract: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM", notification_opt_in: true }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 5, urgent_response_qualified: true }
              as: PlatformAdmin
              captures: { np_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${cap_contract}", member_external_id: "CAP-001", full_name: "Cap Member", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { m_cap_id: $.data.id, m_cap_v: $.data.version }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${ss_contract}", member_external_id: "SS-001", full_name: "SS Member A", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { m_ss_a_id: $.data.id, m_ss_a_v: $.data.version }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${ss_contract}", member_external_id: "SS-002", full_name: "SS Member B", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["COPD"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 0 }
              as: PlatformAdmin
              captures: { m_ss_b_id: $.data.id, m_ss_b_v: $.data.version }
            - call: "POST /members/${m_cap_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${m_cap_v}" }
              as: EngagementSpecialist
              captures: { enr_cap: $.data.id }
            - call: "POST /enrollments/${enr_cap}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${enr_cap}/record-consent"
              payload: { consent_document_id: "DOC-CAP" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${enr_cap}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${enr_cap}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_cap}/activate"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /members/${m_ss_a_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${m_ss_a_v}" }
              as: EngagementSpecialist
              captures: { enr_ss_a: $.data.id }
            - call: "POST /enrollments/${enr_ss_a}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${enr_ss_a}/record-consent"
              payload: { consent_document_id: "DOC-SSA" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${enr_ss_a}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${enr_ss_a}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_ss_a}/activate"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /members/${m_ss_b_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${m_ss_b_v}" }
              as: EngagementSpecialist
              captures: { enr_ss_b: $.data.id }
            - call: "POST /enrollments/${enr_ss_b}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${enr_ss_b}/record-consent"
              payload: { consent_document_id: "DOC-SSB" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${enr_ss_b}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${enr_ss_b}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_ss_b}/activate"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /medical-costs"
              payload: { payer_contract_id: "${ss_contract}", member_id: "${m_ss_a_id}", period_index: 0, amount_cents: 450000, incurred_date: "2026-08-15T00:00:00Z" }
              as: ContractAdministrator
            - call: "POST /medical-costs"
              payload: { payer_contract_id: "${ss_contract}", member_id: "${m_ss_b_id}", period_index: 0, amount_cents: 450000, incurred_date: "2026-08-15T00:00:00Z" }
              as: ContractAdministrator
          trigger:
            - call: "POST /payer-contracts/${cap_contract}/settlements"
              payload: {}
              as: ContractAdministrator
              captures: { cap_settle: $.data.id, cap_gross: $.data.gross_capitation_cents, cap_net_prov: $.data.net_payment_cents }
            - call: "POST /payer-contracts/${cap_contract}/settlements/${cap_settle}/finalize"
              payload: {}
              as: ContractAdministrator
              captures: { cap_net: $.data.net_payment_cents, cap_withhold: $.data.quality_withhold_cents, cap_released: $.data.withhold_released_cents }
            - call: "POST /payer-contracts/${ss_contract}/settlements"
              payload: {}
              as: ContractAdministrator
              captures: { ss_settle: $.data.id, ss_gross: $.data.gross_savings_share_cents }
            - call: "POST /payer-contracts/${ss_contract}/settlements/${ss_settle}/finalize"
              payload: {}
              as: ContractAdministrator
              captures: { ss_net: $.data.net_payment_cents, ss_withhold: $.data.quality_withhold_cents, ss_released: $.data.withhold_released_cents }
          assert:
            - "PayerSettlement.${cap_settle}.gross_capitation_cents == 500000"
            - "PayerSettlement.${cap_settle}.quality_withhold_cents == 50000"
            - "PayerSettlement.${cap_settle}.withhold_released_cents == 50000"
            - "PayerSettlement.${cap_settle}.net_payment_cents == 500000"
            - "PayerSettlement.${cap_settle}.gross_savings_share_cents is null"
            - "PayerSettlement.${ss_settle}.gross_savings_share_cents == 150000"
            - "PayerSettlement.${ss_settle}.quality_withhold_cents == 15000"
            - "PayerSettlement.${ss_settle}.withhold_released_cents == 15000"
            - "PayerSettlement.${ss_settle}.net_payment_cents == 150000"
            - "PayerSettlement.${ss_settle}.gross_capitation_cents is null"
            - "PayerSettlement.${cap_settle}.net_payment_cents != PayerSettlement.${ss_settle}.net_payment_cents"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes (a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: composite_score_weighted_four_component_two_step_rounding
        grounds:
          - calculations.composite_performance_score
          - entities.PerformanceMeasurement.fields.composite_score
        distinguishing_aspect: |
          Mode (a): a ≥3-input formula with non-linear interaction (four
          weighted components, each derived from a conditional ratio that
          falls back to 1.0 on empty denominator). Member's counters:
          urgent_episodes_triggered=2, sla_met=2, avoided_ed=1,
          visits_completed=3, visits_no_show=1, visits_cancelled=0,
          pcp_coordination_rate=1.0. Per-component rounding:
          sla=round4(2/2)=1.0000, ed=round4(1/2)=0.5000,
          visit=round4(3/4)=0.7500, pcp=round4(1.0)=1.0000.
          Composite = round4(0.40*1.0000 + 0.30*0.5000 + 0.20*0.7500 +
          0.10*1.0000) = round4(0.40 + 0.15 + 0.15 + 0.10) = round4(0.80) =
          0.8000.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Standard ACTIVE enrollment for member M with NP1 assigned."
            - "Drive counters to (triggered=2, sla_met=1, avoided_ed=1, completed=3, no_show=1, cancelled=0)."
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"], urgent_response_sla_hours: 24 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000, quality_withhold_pct: 0.10, min_performance_threshold: 0.80 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM", notification_opt_in: true }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 10, urgent_response_qualified: true }
              as: PlatformAdmin
              captures: { np_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id, member_v: $.data.version }
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${member_v}" }
              as: EngagementSpecialist
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${enr_id}/record-consent"
              payload: { consent_document_id: "DOC-1" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${enr_id}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: EngagementSpecialist
            # First urgent episode: dispatch + arrive + resolve AVOIDED_ED (sla_met)
            - call: "POST /urgent-episodes"
              payload: { enrollment_id: "${enr_id}", trigger_source: "MEMBER_CALL" }
              as: CareCoordinator
              captures: { ep1_id: $.data.id }
            - call: "POST /urgent-episodes/${ep1_id}/dispatch"
              payload: {}
              as: CareCoordinator
              captures: { ep1_clin: $.data.dispatched_clinician_id }
            - call: "POST /urgent-episodes/${ep1_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${ep1_clin}"
            - call: "POST /urgent-episodes/${ep1_id}/resolve"
              payload: { resolved_outcome: "AVOIDED_ED" }
              as: Clinician
              as_user_id: "${ep1_clin}"
            # Second urgent episode: dispatch + arrive + resolve REFERRED_TO_ED (sla_met still true at arrive; ed_avoided not incremented)
            - call: "POST /urgent-episodes"
              payload: { enrollment_id: "${enr_id}", trigger_source: "PCP_ALERT" }
              as: CareCoordinator
              captures: { ep2_id: $.data.id }
            - call: "POST /urgent-episodes/${ep2_id}/dispatch"
              payload: {}
              as: CareCoordinator
              captures: { ep2_clin: $.data.dispatched_clinician_id }
            - call: "POST /urgent-episodes/${ep2_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${ep2_clin}"
            - call: "POST /urgent-episodes/${ep2_id}/resolve"
              payload: { resolved_outcome: "REFERRED_TO_ED" }
              as: Clinician
              as_user_id: "${ep2_clin}"
            # Three completed visits (each must complete: depart, arrive, assessment, submit, complete)
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", visit_type: "INITIAL_ASSESSMENT", scheduled_start: "2026-09-02T09:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }
              as: CareCoordinator
              captures: { v1: $.data.id, v1_clin: $.data.clinician_id }
            - call: "POST /visits/${v1}/depart"
              payload: {}
              as: Clinician
              as_user_id: "${v1_clin}"
            - call: "POST /visits/${v1}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${v1_clin}"
            - call: "POST /visits/${v1}/assessment"
              payload:
                medication_reconciliation: { medications_reviewed: 5, discrepancies_found: 1, high_risk_med_changes: 0 }
                safety_evaluation: { fall_risk_score: 2, home_hazard_count: 0, adl_impairment_count: 0 }
                social_needs_screening: { food_insecurity: false, housing_instability: false, transportation_barrier: false, social_isolation_score: 1 }
                pcp_coordination_note: "PCP informed."
              as: Clinician
              as_user_id: "${v1_clin}"
            - call: "POST /visits/${v1}/assessment/submit"
              payload: {}
