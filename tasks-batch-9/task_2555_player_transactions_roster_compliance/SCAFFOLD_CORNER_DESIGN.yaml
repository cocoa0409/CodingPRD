      - name: frozen_club_filing_creation_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_TEAM_TRANSACTIONS_FROZEN]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_club_safety_check_beats_cap_excess_on_filing_creation
          rationale: "That §1.8 instance already triggers ERR_TEAM_TRANSACTIONS_FROZEN on POST /transactions from a TRANSACTION_FROZEN club, and does so in the harder setting where the same call also breaches the cap — a plain single-violation repeat would add nothing."

      - name: approving_a_signing_for_a_player_who_failed_his_physical_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_PLAYER_FAILED_PHYSICAL]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / failed_physical_safety_check_beats_missing_ir_paperwork_on_approval
          rationale: "ERR_PLAYER_FAILED_PHYSICAL is already the returned error there, chosen over the lower-priority injury-paperwork violation that the same decide call also commits."

      - name: approving_a_signing_without_a_passed_physical_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_PHYSICAL_NOT_PASSED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / signing_approval_depends_on_unexpired_physical_exam_state
          rationale: "That instance triggers ERR_PHYSICAL_NOT_PASSED twice over — once with the exam still SCHEDULED and once after it EXPIRED — which strictly covers the single-shot version of this claim."

      - name: approving_an_ir_activation_without_filed_paperwork_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_INJURY_PAPERWORK_MISSING]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ir_activation_approval_depends_on_designation_return_window_state
          rationale: "That instance returns ERR_INJURY_PAPERWORK_MISSING from the IR_ACTIVATION decide while the designation is still ACTIVE, then shows the same call succeeding once a sweep opens the return window."

      - name: offering_a_contract_not_owned_by_the_sending_club_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_ASSET_NOT_OWNED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / trade_asset_admission_depends_on_contract_ownership_by_sender
          rationale: "ERR_ASSET_NOT_OWNED is exactly that instance's asserted outcome, on a PROPOSED trade with a current expected_trade_version so no other gate can be blamed."

      - name: overlapping_exam_windows_for_one_player_are_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors[ERR_EXAM_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / player_exam_windows_admit_abutment_but_reject_one_second_of_overlap
          rationale: "That instance pins the half-open boundary — abutting windows are admitted, one second of overlap yields ERR_EXAM_WINDOW_OVERLAP — which subsumes a bare overlap rejection."

      - name: a_second_concurrent_medical_review_for_one_club_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=31]
          - errors[ERR_MEDICAL_REVIEW_SLOT_TAKEN]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / club_medical_review_slots_collide_on_touching_deadline_endpoint
          rationale: "ERR_MEDICAL_REVIEW_SLOT_TAKEN is asserted there at the hardest point of the closed occupation interval, where the second review's window merely touches the first review's deadline instant."

  # ===========================================================================
  # RBAC (§1.7) — role_model: segregation_of_duties
  # ===========================================================================
  - section: rbac
    instances:
      - name: each_role_can_run_its_own_exclusive_operation
        claim_type: role_can_perform_its_operations
        grounds:
          - rbac.LeagueOfficer.exclusive_operations
          - rbac.TeamCapAnalyst.exclusive_operations
          - rbac.TeamMedicalOfficer.exclusive_operations
          - rbac.PlayerAgent.exclusive_operations
        distinguishing_aspect: "One recipe exercises the positive half of the matrix: each of the four roles performs an operation exclusive to it — player registration, filing creation, exam scheduling and tender response — and all four succeed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Harbor Kings (cap 500000000) exists with Ray Alder (UNROSTERED) and Dov Keller (400 accrued active days, RESTRICTED, UNROSTERED)."
            - "A RESTRICTED_TENDER at FIRST_ROUND has been issued to Dov Keller."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { rb_team_id: $.data.id, rb_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
