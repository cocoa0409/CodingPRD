              as: ProgramOperator
              as_user_id: "op1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T14:00:00Z" }
              as: ProgramOperator
            - call: "POST /dr/dispatch-events/${evt_id}/start"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/devices/${dev_id}/meter-readings"
              payload: { interval_start: "2026-06-01T14:00:00Z", interval_end: "2026-06-01T16:00:00Z", kw_load: 3.0, reading_type: "EVENT_WINDOW", dispatch_event_id: "${evt_id}" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /_clock/set_current_utc"
