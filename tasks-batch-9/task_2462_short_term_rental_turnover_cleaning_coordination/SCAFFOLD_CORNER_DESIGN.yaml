      - name: corner_val_booking_accepts_exactly_one_guest_cleanliness_review
        claim_type: Violation → Error
        grounds:
          - validations[priority=31]
          - errors.ERR_GUEST_REVIEW_ALREADY_SUBMITTED
          - entities.Booking.fields.cleanliness_rating
        distinguishing_aspect: |
          The review is a write-once system field: the first POST stamps cleanliness_rating and
          cleanliness_rated_at, and every later POST is refused with 409 even when the rating value
          is identical, so the endpoint is explicitly NOT idempotent. A rating outside 1..5 is a
          priority 3 shape failure instead, which distinguishes the uniqueness rule from the range
          check.
        test_recipe:
          setup:
            - "Property P1 with booking IN-1 whose checkin_at is 2026-08-08T21:00:00Z."
            - "Logical clock advanced to 2026-08-11T16:00:00Z, after the stay started."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com" }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id", r0: "$.data.cleanliness_rating", r0_at: "$.data.cleanliness_rated_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T16:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${b_in}/guest-review"
              payload: { cleanliness_rating: 6 }
              as: Coordinator
              captures: { e1: "$.data.error_id" }
            - call: "POST /bookings/${b_in}/guest-review"
              payload: { cleanliness_rating: 4 }
              as: Coordinator
              captures: { r1: "$.data.cleanliness_rating", r1_at: "$.data.cleanliness_rated_at" }
            - call: "POST /bookings/${b_in}/guest-review"
              payload: { cleanliness_rating: 4 }
              as: Coordinator
              captures: { e2: "$.data.error_id" }
            - call: "POST /bookings/${b_in}/guest-review"
              payload: { cleanliness_rating: 1 }
              as: Coordinator
              captures: { e3: "$.data.error_id" }
            - call: "GET /bookings/${b_in}"
              payload: {}
              as: Coordinator
              captures: { r_final: "$.data.cleanliness_rating", r_final_at: "$.data.cleanliness_rated_at" }
          assert:
            - "${r0} is null and ${r0_at} is null on a fresh booking"
            - "${e1} == ERR_INVALID_REQUEST (400) - 6 is outside the declared 1..5 range, and it leaves the field null"
            - "${r1} == 4 with HTTP 200 and ${r1_at} == 2026-08-11T16:00:00Z"
            - "${e2} == ERR_GUEST_REVIEW_ALREADY_SUBMITTED (409) - identical value, still refused"
            - "${e3} == ERR_GUEST_REVIEW_ALREADY_SUBMITTED (409)"
            - "${r_final} == 4 and ${r_final_at} == 2026-08-11T16:00:00Z - no later attempt overwrote the first review"

      - name: corner_val_audit_sampling_gauntlet_completion_duties_window_then_uniqueness
        claim_type: Cascading validation
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=27]
          - validations[priority=30]
          - validations[priority=9]
          - validations[priority=12]
        distinguishing_aspect: |
          Sampling an audit has to clear five checks in a fixed order, and the gauntlet walks them
          from the outside in so each refusal proves the previous check already passed: the
          turnover must be COMPLETED (13), the auditor's X-User-ID must not be the coordinator who
          assigned or any coordinator who reviewed (14), the sampling must be inside 72 hours of
          finished_at (27, tested at exactly the boundary and one minute past it), and only one
          non-VOIDED audit may exist (30). Finalization then adds the ownership check (9) and the
          terminal-state check (12).
