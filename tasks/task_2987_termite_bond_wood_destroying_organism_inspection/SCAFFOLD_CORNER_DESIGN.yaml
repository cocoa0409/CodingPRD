      - name: state_gate_rejects_a_wrong_start_state_for_licence_inspection_and_plan
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_INSPECTOR_STATE]
          - errors[ERR_INVALID_INSPECTION_STATE]
          - errors[ERR_INVALID_PLAN_STATE]
          - state_machines.Inspector
          - state_machines.Inspection
          - state_machines.TreatmentPlan
        distinguishing_aspect: >-
          Each entity has its OWN 409 state code; none of them is a shared generic conflict. The
          licence machine has no self-transition, so ACTIVE -> ACTIVE is undeclared and refused; a
          GRAPHED inspection refuses further findings; and a PROPOSED plan refuses an application
          while an APPROVED plan refuses a second approval.
        test_recipe:
          setup:
            - "P1 in FL, ACTIVE inspector I1 (WDO_INSPECTOR) and ACTIVE applicator A1 (TERMITE_APPLICATOR), a GRAPHED inspection INS1, and a PROPOSED plan PL1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "9 Marsh Lane", state_code: "FL", construction_type: "SLAB", square_footage: 1800, linear_footage: 160, year_built: 2001 }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { i1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Dale Ortiz", license_number: "FL-10002", license_state: "FL", license_categories: ["TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { a1: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${i1}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${i1}"
              captures: { ins1: $.data.id }
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${i1}"
            - call: "POST /treatment-plans"
              payload: { property_id: "${p1}", inspection_id: "${ins1}", applicator_id: "${a1}", method: "LIQUID_BARRIER", chemical_product_code: "FIPRO_9" }
              as: BranchManager
              captures: { pl1: $.data.id }
            - call: "GET /treatment-plans/${pl1}"
              payload: {}
              as: BranchManager
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /inspectors/${i1}/license-status"
              payload: { status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { e1: "$.data.error_id" }
            - call: "POST /inspections/${ins1}/findings"
              payload: { grid_ref: "C4", finding_type: "CONDUCIVE_CONDITION", organism: "NONE", conducive_code: "WOOD_TO_SOIL_CONTACT" }
              as: FieldInspector
              as_user_id: "${i1}"
              captures: { e2: "$.data.error_id" }
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${i1}"
              captures: { e3: "$.data.error_id" }
            - call: "POST /treatment-plans/${pl1}/applications"
              payload: { product_epa_number: "432-1234", gallons_applied: 10.00, concentration_pct: 0.06, expected_treatment_plan_version: "${v1}" }
              as: Applicator
              as_user_id: "${a1}"
              captures: { e4: "$.data.error_id" }
            - call: "POST /treatment-plans/${pl1}/approve"
              payload: {}
              as: BranchManager
            - call: "POST /treatment-plans/${pl1}/approve"
              payload: {}
              as: BranchManager
              captures: { e5: "$.data.error_id" }
          assert:
            - "ACTIVE -> ACTIVE on the licence returns 409 ERR_INVALID_INSPECTOR_STATE: the machine declares no self-transition, so a no-op re-assert is a conflict"
            - "adding a finding to a GRAPHED inspection returns 409 ERR_INVALID_INSPECTION_STATE, and re-completing the same graph returns the same code"
            - "an application against a PROPOSED plan returns 409 ERR_INVALID_PLAN_STATE even though the OCC version supplied is current — the state gate at priority 80 outranks nothing here, but the version check at priority 70 passed first, so the failure is genuinely about state"
            - "a second approve on the now-APPROVED plan returns 409 ERR_INVALID_PLAN_STATE"
            - "all three codes are distinct ids with http 409, and none of the refused calls bumps its target's version"

