              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WEIGHT_INVALID, HTTP 422"

      - name: outcome_before_drafted_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_OUTCOME_NOT_DRAFTED]"]
        distinguishing_aspect: "Outcomes require a DRAFTED prospect; recording one for a BOARD_READY prospect fails with ERR_OUTCOME_NOT_DRAFTED."
        test_recipe:
          setup: ["scout s, director d; prospect p BOARD_READY (not drafted)"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "QB", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
