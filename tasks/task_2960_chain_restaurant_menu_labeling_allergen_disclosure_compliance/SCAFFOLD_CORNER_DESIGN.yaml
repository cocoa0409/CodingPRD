            - "trigger[0] response data.violation_unit_count == 4"
            - "trigger[0] response data.base_penalty_cents == 300000 - 50000 * 4 * ENHANCED_MULTIPLIER, the multiplier applied before the fee"
            - "trigger[0] response data.admin_fee_cents == 36000 - 300000 > FEE_TIER_2_CEILING_CENTS so the 12% tier applies, not 8%"
            - "trigger[0] response data.penalty_total_cents == 336000"
