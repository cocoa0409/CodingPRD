          - concurrency_rules[rule_id=service-create-stale-citation]
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: "The second OCC-guarded endpoint derives required_hours from the balance at creation time, so the stale write must be refused before the hours are locked in; the same stale write is also issued by a non-owner rider and still returns 412, pinning the OCC rule at priority 8 ahead of the ownership rule at priority 9."
        test_recipe:
          setup:
            - "Citation C1 belongs to rider R1: total 9720, version 1. Rider R2 owns nothing."
            - "A 1500-cent direct payment moves the citation to version 2 with outstanding 8220, still OUTSTANDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, penalty_multiplier_bps: 12000, enforcement_policy: "CITATION_IMMEDIATE", max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/submit-for-signage"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T01:00:00Z", signs_verified_count: 10 }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/designate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /inspectors"
              payload: { badge_number: "B-100", display_name: "Inspector One", certification_expiry: "2027-01-01T00:00:00Z", status: "ACTIVE" }
              as: EnforcementPlanner
              captures: { i1: $.data.id }
            - call: "POST /riders"
              payload: { rider_ref: "R-100", display_name: "Rider One", demographic_band: "BAND_A", residence_geo_tract: "T-001", fare_assistance_enrolled: false }
              as: EnforcementPlanner
              captures: { r1: $.data.id }
            - call: "POST /riders"
              payload: { rider_ref: "R-200", display_name: "Rider Two", demographic_band: "BAND_B", residence_geo_tract: "T-002", fare_assistance_enrolled: false }
              as: EnforcementPlanner
              captures: { r2: $.data.id }
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z", planned_inspector_count: 3, sampling_method: "SYSTEMATIC_INTERVAL", target_sample_size: 5 }
              as: EnforcementPlanner
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T06:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-deployments/${d1}/activate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-encounters"
              payload: { deployment_id: "${d1}", inspector_id: "${i1}", rider_id: "${r1}", occurred_at: "2026-08-05T07:00:00Z", fare_media_type: "NONE", identity_capture_method: "GOVT_ID" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { e1: $.data.id }
            - call: "POST /citations"
              payload: { encounter_id: "${e1}" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /citations/${c1}/payments"
              payload: { amount_cents: 1500 }
              as: Rider
              as_user_id: "${r1}"
          trigger:
            - call: "POST /community-service-assignments"
              payload: { citation_id: "${c1}", partner_org_name: "Riverside Food Bank", expected_citation_version: "${cv1}" }
              as: Rider
              as_user_id: "${r1}"
              captures: { err_occ1: $.data.error_id }
            - call: "POST /community-service-assignments"
              payload: { citation_id: "${c1}", partner_org_name: "Riverside Food Bank", expected_citation_version: "${cv1}" }
              as: Rider
              as_user_id: "${r2}"
              captures: { err_occ2: $.data.error_id }
            - call: "GET /citations/${c1}"
              payload: {}
              as: Rider
              as_user_id: "${r1}"
              captures: { cv2: $.data.version }
            - call: "POST /community-service-assignments"
              payload: { citation_id: "${c1}", partner_org_name: "Riverside Food Bank", expected_citation_version: "${cv2}" }
              as: Rider
              as_user_id: "${r1}"
              captures: { cs1: $.data.id }
          assert:
            - "HTTP 412 with ${err_occ1} == ERR_STALE_CITATION_VERSION for the owner's stale write"
            - "HTTP 412 with ${err_occ2} == ERR_STALE_CITATION_VERSION for the non-owner's stale write: the OCC rule at priority 8 fires before the ownership rule at priority 9, so the response is not 403 ERR_NOT_RESOURCE_OWNER"
            - "after both refusals GET /community-service-assignments?citation_id=${c1} returns total_count == 0 and Citation.${c1}.version is still ${cv2} == 2 with settlement_status OUTSTANDING"
            - "the refreshed write returns HTTP 201 with CommunityServiceAssignment.${cs1}.required_hours == 6 (ceil(8220 / 1500) = ceil(5.48)), hours_completed 0, credited_cents 0, status ACTIVE"
            - "required_hours is 6 and not the 7 the stale 9720 view would have produced (ceil(6.48)), proving the hour count is derived after the version check"
            - "Citation.${c1} ends at version 3 with settlement_status SERVICE_ACTIVE and outstanding_balance_cents 8220"

      - name: appeal_grant_cascade_unwinds_every_settlement_artifact
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: appeal_grant_cascades_four_links_to_dismissal_reversal_ledger_row
          rationale: "The cascading_side_effects layer claim -- that one write propagates through a declared chain of dependent updates in order and stops where the chain ends -- is driven end to end by that §1.8 instance, which walks all four links of the appeal-grant cascade (citation DISMISSED, settlement WRITTEN_OFF with zero balance, ACTIVE plan and service assignment CANCELLED, DISMISSAL_REVERSAL ledger row) and asserts the money identity afterwards."

      - name: revenue_report_variants_are_selected_by_the_basis_parameter
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: revenue_recovery_accrual_and_cash_bases_diverge_on_same_window
          rationale: "The dual_variant_calculation layer claim -- two variants of one calculation over identical inputs producing different, individually correct results with an explicit selector -- is asserted by that §1.8 instance, which reads the same window twice under basis ACCRUAL and basis CASH and pins both figure sets plus the net-of-cost reconciliation."

      - name: designation_and_close_thresholds_gate_their_transitions
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: signage_compliance_exactly_nine_tenths_permits_designation
          rationale: "The rate_threshold_triggers layer claim -- a computed rate compared against a declared constant, with the exact-equality case admitted -- is asserted by that §1.8 boundary instance at SIGNAGE_MIN_PCT 0.9000, and its companion sample_adequacy_ratio_exactly_at_eight_tenths_closes_the_deployment covers the same pattern on SAMPLE_ADEQUACY_MIN 0.8000."

  # ==========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_readable_immediately_after_the_write_that_moved_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "The declared model is immediate, so the very next read after each write already reflects every computed field, counter, cascade and ledger aggregate -- there is no eventual-consistency window, no background recompute and no read-your-writes exception anywhere in the design."
