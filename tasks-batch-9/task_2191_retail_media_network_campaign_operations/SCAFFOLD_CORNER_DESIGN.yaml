        distinguishing_aspect: "Both engagements share shopper_hash sh_1 and the same product, so both are candidates; LAST_TOUCH credits only the latest (the 12:10 CLICK) with weight 1.0 and 50000 cents, while the sale row filed against the 12:05 IMPRESSION carries weight 0.0 and 0 cents, leaving Campaign.attributed_revenue_cents at exactly 50000."
        test_recipe:
          setup:
