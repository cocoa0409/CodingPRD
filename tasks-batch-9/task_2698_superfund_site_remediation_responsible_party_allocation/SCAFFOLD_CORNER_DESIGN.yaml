  # complexity_profile.complexity_layers declares optimistic_concurrency, cascading_side_effects,
  # dual_variant_calculation, derived_field_reconciliation and selector_policy. The first four have
  # rows in the cross-cutting table of the claim-extraction guide and are covered below; the fifth
  # (selector_policy) has no row of its own and is exercised as a calculation - see
  # corner_remedy_score_branch_flips_the_ranking_when_the_action_level_is_exceeded and the
  # ERR_NO_ELIGIBLE_REMEDY leg of corner_three_remedy_selection_refusals_on_one_signature_return_4XX.
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_stale_site_version_on_round_create_returns_4XX
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-round-create-stale-site]
          - endpoints[POST /sites/{id}/allocation-rounds]
          - errors[ERR_STALE_SITE_VERSION]
          - validations[priority=7]
        distinguishing_aspect: "The same expected_site_version value is used twice: it is current on the first round create and stale on the second, because creating the round bumped the site's version - so the replay that would have silently superseded an unseen round is refused with 412 instead."
        test_recipe:
          setup:
            - "Site LISTED with two PARTICIPATING parties and VERIFIED waste-in (3960 t class II and 40 t class IV) and an RI/FS under way, so a round can legitimately be opened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Kestrel Yard Drum Reconditioning", epa_region: 5, hrs_score: 52.80 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-KYD-0201" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Kestrel Yard Drum Co", party_type: "OWNER_OPERATOR", viability_score: 80 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_a: $.data.id }
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Yard Street Solvents", party_type: "GENERATOR", viability_score: 49 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_b: $.data.id }
            - call: "POST /prps/${prp_a}/notice"
              payload: { notice_reference: "GNL-2027-8501" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp_b}/notice"
              payload: { notice_reference: "GNL-2027-8502" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp_a}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
              as_user_id: "${prp_a}"
            - call: "POST /prps/${prp_b}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
