            - { call: "POST /pickups/${pk1}/void", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PICKUP_LOCKED_BY_WEIGH_TICKET and PickupEvent.${pk1}.status remains COMPLETED"
            - "Subscriber.${sub_a}.credit_balance_cents remains 240 (120 estimated + 120 adjustment: round(20 x 10 x 1.2) = 240)"

      - name: third_skip_in_quarter_returns_limit_exceeded
        claim_type: violation_to_error
        grounds: ["calculations.skip_allowance", "errors[ERR_SKIP_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "With the pickup SCHEDULED, the subscription ACTIVE, and the cutoff satisfied, the allowance boundary alone produces ERR_SKIP_LIMIT_EXCEEDED (pure fiscal gate)."
        test_recipe:
          setup: ["RES plan (allowance 2); weeks 2026-06-01/08/15 generated; first two skipped"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-08" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-15" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id", pk2: "$.data[1].id", pk3: "$.data[2].id" } }
            - { call: "POST /pickups/${pk1}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}" }
            - { call: "POST /pickups/${pk2}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}" }
          trigger:
            - { call: "POST /pickups/${pk3}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SKIP_LIMIT_EXCEEDED and PickupEvent.${pk3}.status remains SCHEDULED"

      - name: generate_stops_weekday_mismatch_returns_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_SERVICE_DATE_WEEKDAY_MISMATCH]", "validations[priority=10]"]
        distinguishing_aspect: "2026-06-02 is a Tuesday; generating a MON route for it -> ERR_SERVICE_DATE_WEEKDAY_MISMATCH, no pickups created."
        test_recipe:
          setup: ["RES subscription ACTIVE on a MON route"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
          trigger:
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-02" }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SERVICE_DATE_WEEKDAY_MISMATCH and GET /pickups?subscription_id returns zero rows"

      - name: billing_run_with_unweighed_commercial_returns_pending
        claim_type: violation_to_error
        grounds: ["calculations.weekly_invoice_amount", "errors[ERR_WEIGH_TICKET_PENDING]"]
        distinguishing_aspect: "A billing run covering a COMPLETED commercial pickup with no posted weigh ticket aborts entirely — no invoice is issued for anyone."
        test_recipe:
          setup: ["COM subscription; week 2026-06-01 completed at 0.5; no weigh ticket posted"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "COM", name: "Commercial", subscriber_type: "COMMERCIAL", bin_type: "BIN_240L", included_bins: 1, weekly_price_cents: 0, metered_base_cents: 3000, per_kg_rate_cents: 7, included_kg_per_week: 40, credit_rate_cents_per_kg: 5, skip_allowance_per_quarter: 4 }, as: OperationsManager, captures: { plan_com: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_240L", nominal_capacity_kg: 60 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_240L", nominal_capacity_kg: 60 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "c@x.com", full_name: "Com Sub", subscriber_type: "COMMERCIAL", address: "2 C St" }, as: Anonymous, captures: { sub_c: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_c}", plan_id: "${plan_com}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_c: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_c}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /billing/run", payload: { week_start_date: "2026-06-01" }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_WEIGH_TICKET_PENDING and GET /invoices?subscriber_id=${sub_c} returns zero rows"

      - name: redemption_with_zero_balance_returns_insufficient_credit
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_CREDIT]", "validations[priority=8]"]
        distinguishing_aspect: "Fiscal credit check (priority 8) precedes the stock constraint (priority 9): with zero balance AND zero stock the error is ERR_INSUFFICIENT_CREDIT."
        test_recipe:
          setup: ["RES subscription ACTIVE; no pickups, no stock, balance 0"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
          trigger:
            - { call: "POST /credit-redemptions", payload: { subscriber_id: "${sub_a}", bags: 1 }, as: Subscriber, as_user_id: "${sub_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_CREDIT (not ERR_INSUFFICIENT_STOCK)"

      - name: negative_adjustment_below_zero_returns_insufficient_credit
        claim_type: violation_to_error
        grounds: ["endpoints.POST /subscribers/{id}/credit-adjustments", "errors[ERR_INSUFFICIENT_CREDIT]"]
        distinguishing_aspect: "A manual adjustment that would drive credit_balance_cents negative is rejected; the ledger stays append-only with no partial write."
        test_recipe:
          setup: ["one subscriber with balance 0"]
          setup_api_calls:
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
          trigger:
            - { call: "POST /subscribers/${sub_a}/credit-adjustments", payload: { amount_cents: -100, reason: "clawback" }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_CREDIT and Subscriber.${sub_a}.credit_balance_cents == 0"

  # ============================================================== endpoints ==
  - section: endpoints
    instances:
      - name: pickups_list_filter_and_pagination
        claim_type: listing
        grounds: ["endpoints.GET /pickups", "response_envelope"]
        distinguishing_aspect: "Filter + paginate interact: 3 pickups for the subscription -> limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the remaining 1 with has_more false; status filter narrows to MISSED only."
        test_recipe:
          setup: ["RES subscription; weeks 2026-06-01/08/15 generated; first pickup marked MISSED"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-08" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-15" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/miss", payload: {}, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "GET /pickups?limit=2&offset=0", payload: { subscription_id: "${subs_a}" }, as: OperationsManager }
            - { call: "GET /pickups?limit=2&offset=2", payload: { subscription_id: "${subs_a}" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}", status: "MISSED" }, as: OperationsManager }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 row, has_more == false"
            - "status=MISSED filter: exactly 1 row (${pk1})"

      - name: billing_run_groups_subscriptions_and_is_idempotent
        claim_type: bulk_action
        grounds: ["calculations.weekly_invoice_amount", "endpoints.POST /billing/run"]
        distinguishing_aspect: "One subscriber with two ACTIVE subscriptions gets ONE invoice summing both (subtotal 2400); a second run for the same week issues nothing and reports the subscriber in skipped_subscriber_ids."
        test_recipe:
          setup: ["one RES subscriber with subscriptions on routes R1 and R2; both 2026-05-04 pickups completed at 0.5 (credits 100 + 100 = 200, SPRING x1.0)"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /routes", payload: { code: "R2", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route2: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs1: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route2}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs2: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-05-04" }, as: OperationsManager }
            - { call: "POST /routes/${route2}/generate-stops", payload: { service_date: "2026-05-04" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs1}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "GET /pickups", payload: { subscription_id: "${subs2}" }, as: OperationsManager, captures: { pk2: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /pickups/${pk2}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /billing/run", payload: { week_start_date: "2026-05-04" }, as: OperationsManager, captures: { run1_count: $.data.issued_count } }
            - { call: "GET /invoices", payload: { subscriber_id: "${sub_a}" }, as: OperationsManager, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /billing/run", payload: { week_start_date: "2026-05-04" }, as: OperationsManager, captures: { run2_count: $.data.issued_count } }
          assert:
            - "first run issued_count == 1 and exactly one invoice exists for ${sub_a} (both subscriptions grouped)"
            - "Invoice.${inv1}.subtotal_cents == 2400, credit_applied_cents == 200, total_cents == 2200"
            - "second run issued_count == 0 and skipped_subscriber_ids contains ${sub_a}"

      - name: response_envelope_shape_on_success_and_error
        claim_type: retrieval
        grounds: ["response_envelope"]
        distinguishing_aspect: "Success bodies carry meta.api_request_id, meta.api_request_timestamp, response_type object/array and data; error bodies carry response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "GET /subscribers/00000000-0000-4000-8000-000000000000", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "success response: meta.api_request_id present, response_type == 'object', data.id == ${sub_a}"
            - "error response: response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message present"

      - name: generate_stops_replay_is_idempotent
        claim_type: idempotency
        grounds: ["endpoints.POST /routes/{id}/generate-stops"]
        distinguishing_aspect: "Re-running generation for the same route+date creates nothing new (created_count 0) and leaves the existing pickup untouched."
        test_recipe:
          setup: ["RES subscription ACTIVE on route; week 2026-06-01 generated once"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager, captures: { gen1: $.data.created_count } }
          trigger:
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager, captures: { gen2: $.data.created_count } }
          assert:
            - "first run created_count == 1; replay created_count == 0"
            - "GET /pickups?subscription_id=${subs_a} still returns exactly 1 row"

      - name: impact_report_zero_for_new_subscriber
        claim_type: computed_read
        grounds: ["calculations.impact_report", "endpoints.GET /subscribers/{id}/impact"]
        distinguishing_aspect: "A subscriber with no pickups gets a well-defined zero report (empty input set, not an error)."
        test_recipe:
          setup: ["one subscriber, no subscriptions"]
          setup_api_calls:
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
          trigger:
            - { call: "GET /subscribers/${sub_a}/impact", payload: {}, as: Subscriber, as_user_id: "${sub_a}" }
          assert:
            - "impact == { total_kg_diverted: 0.0, total_co2e_kg: 0.0, pickups_completed: 0, contamination_tags_confirmed: 0 }"

  # ================================================================= errors ==
  - section: errors
    instances:
      - name: err_skip_cutoff_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SKIP_CUTOFF_PASSED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / skip_cutoff_exactly_at_48h_rejected"
          rationale: "Boundary failure and success sides both asserted there."
      - name: err_pause_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAUSE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / pause_windows_half_open_adjacency"
          rationale: "Adjacency-allowed and overlap-rejected arms both asserted there."
      - name: err_route_capacity_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROUTE_CAPACITY]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / route_capacity_aggregate_weekly_slot"
          rationale: "Reject-at-capacity and accept-after-cancel both asserted there."
      - name: err_insufficient_stock_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_STOCK]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / redemption_at_exact_stock_boundary"
          rationale: "Exact-boundary success and one-bag-over rejection both asserted there."
      - name: err_stale_version_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[plan-change-stale-subscription]"]
        excluded_because:
          difficulty_instance: "complexity_layers instance plan_change_occ_stale_and_fresh below"
          rationale: "Stale and fresh version arms asserted in the OCC corner instance."
      - name: err_subscription_not_active_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SUBSCRIPTION_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / pickup_skip_requires_subscription_active"
          rationale: "Asserted as the failure path of the named §1.8 instance."

  # ================================================================== rbac ==
  - section: rbac
    instances:
      - name: subscriber_cannot_create_routes_forbidden
        claim_type: role_denial
        grounds: ["roles.Subscriber", "endpoints.POST /routes", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /routes is OperationsManager-exclusive; a Subscriber caller -> 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["one subscriber"]
          setup_api_calls:
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
          trigger:
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: Subscriber, as_user_id: "${sub_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE"

      - name: driver_cannot_waive_contamination_tag_forbidden
        claim_type: role_denial
        grounds: ["roles.Driver", "endpoints.POST /contamination-tags/{id}/waive", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Waive is OperationsManager-only; the Driver role (any driver id, even one who did not tag) -> 403 ERR_FORBIDDEN_ROLE, distinct from the segregation-of-duties check."
        test_recipe:
          setup: ["RES subscription; week 2026-06-01 generated; pickup tagged by drv-1"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/contamination-tags", payload: { severity: "LOW", category: "PLASTIC" }, as: Driver, as_user_id: "drv-1", captures: { tag1: $.data.id } }
          trigger:
            - { call: "POST /contamination-tags/${tag1}/waive", payload: {}, as: Driver, as_user_id: "drv-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE and ContaminationTag.${tag1}.status remains TAGGED"

      - name: anonymous_cannot_read_subscriber_forbidden
        claim_type: role_denial
        grounds: ["roles.Anonymous", "endpoints.GET /subscribers/{id}", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Anonymous may only self-signup; reading a subscriber -> 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["one subscriber"]
          setup_api_calls:
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
          trigger:
            - { call: "GET /subscribers/${sub_a}", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE"

      - name: subscriber_cannot_skip_others_pickup_forbidden
        claim_type: role_denial
        grounds: ["roles.Subscriber", "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Ownership scoping: subscriber B's X-User-ID does not match the pickup's subscriber chain -> 403 ERR_FORBIDDEN_ROLE (not 404, not a state error)."
        test_recipe:
          setup: ["subscribers A and B; A has an ACTIVE subscription with week 2026-06-01 generated"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscribers", payload: { email: "b@x.com", full_name: "Sub B", subscriber_type: "RESIDENTIAL", address: "2 B St" }, as: Anonymous, captures: { sub_b: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
          trigger:
            - { call: "POST /pickups/${pk1}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_b}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE and PickupEvent.${pk1}.status remains SCHEDULED"

  # ==================================================== complexity_layers ==
  - section: complexity_layers
    instances:
      - name: plan_change_occ_stale_and_fresh
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-change-stale-subscription]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Fresh expected_subscription_version succeeds and bumps version (1 -> 2); replaying the same observed version is then stale -> 412 ERR_STALE_VERSION — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["RES and RES2 plans (both 1 bin); one ACTIVE subscription created at version 1"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /service-plans", payload: { code: "RES2", name: "Residential Plus", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1500, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 12, skip_allowance_per_quarter: 3 }, as: OperationsManager, captures: { plan_res2: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id, sub_v1: $.data.version } }
          trigger:
            - { call: "POST /subscriptions/${subs_a}/plan-change", payload: { new_plan_id: "${plan_res2}", expected_subscription_version: "${sub_v1}" }, as: OperationsManager, captures: { sub_v2: $.data.version } }
            - { call: "POST /subscriptions/${subs_a}/plan-change", payload: { new_plan_id: "${plan_res}", expected_subscription_version: "${sub_v1}" }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "first plan-change succeeds: Subscription.${subs_a}.plan_id == ${plan_res2} and version == 2 (incremented by 1)"
            - "second plan-change replaying the stale version: error_id == ERR_STALE_VERSION (412) and plan_id remains ${plan_res2}"

      - name: derived_credit_balance_reconciles_with_ledger
        claim_type: derived_field_reconciliation
        grounds: ["entities.Subscriber.fields.credit_balance_cents", "entities.CompostCreditEntry.fields.amount_cents"]
        distinguishing_aspect: "credit_balance_cents always equals the signed sum of CompostCreditEntry rows: after a +250 manual adjustment the read shows 250 and the ledger filter returns exactly one entry of +250."
        test_recipe:
          setup: ["one subscriber"]
          setup_api_calls:
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscribers/${sub_a}/credit-adjustments", payload: { amount_cents: 250, reason: "promo" }, as: OperationsManager }
          trigger:
            - { call: "GET /subscribers/${sub_a}", payload: {}, as: OperationsManager }
            - { call: "GET /credit-entries", payload: { subscriber_id: "${sub_a}" }, as: OperationsManager }
          assert:
            - "Subscriber.${sub_a}.credit_balance_cents == 250"
            - "ledger contains exactly 1 entry: entry_type MANUAL_ADJUSTMENT, amount_cents == 250, reason 'promo', season derived from the logical clock (2026-SPRING)"

  # ==================================================== consistency_model ==
  - section: consistency_model
    instances:
      - name: immediate_consistency_invoice_visible_in_same_epoch
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints.POST /billing/run"]
        distinguishing_aspect: "Immediate consistency: the invoice id returned by billing run is fully readable with final totals on the very next request — no reconciliation lag."
        test_recipe:
          setup: ["RES subscription; week 2026-05-04 completed at 0.5 (credit 100)"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-05-04" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /billing/run", payload: { week_start_date: "2026-05-04" }, as: OperationsManager }
            - { call: "GET /invoices", payload: { subscriber_id: "${sub_a}" }, as: OperationsManager, captures: { inv1: "$.data[0].id" } }
          assert:
            - "Invoice.${inv1} is immediately readable: status ISSUED, subtotal_cents == 1200, credit_applied_cents == 100, total_cents == 1100, due_date == 2026-05-18"
