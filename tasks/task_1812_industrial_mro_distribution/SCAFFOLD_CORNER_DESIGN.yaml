        distinguishing_aspect: "Creating an order from another account's APPROVED cart (customer_id B, source_cart_id of A's cart) fails with ERR_CART_CUSTOMER_MISMATCH."
        test_recipe:
          setup: ["Customers A and B; A's cart auto-approved (threshold 1,000,000)"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "CM-A", display_name: "Cart A", credit_limit_cents: 100000, approval_threshold_cents: 1000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { custA: $.data.id }
            - call: "POST /mro/customers"
              payload: { account_number: "CM-B", display_name: "Cart B", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { custB: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "CM-1", description: "Pin", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-CM", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
