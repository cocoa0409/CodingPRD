            - "${err_assign} == 'ERR_ASSIGNMENT_INVALID_STATE' with HTTP 409 and the assignment's release_reason is still 'ROUTE_REBALANCE'"
            - "Technician.${t2_id}.committed_minutes == 0 (released once, never twice)"
            - "PreventiveVisit.${v1_id}.visit_status == 'SCHEDULED' and assigned_technician_id == ${t2_id} (retained for audit)"

      - name: replaying_a_successful_trigger_is_rejected_on_the_second_attempt
        claim_type: idempotency
        grounds:
          - state_machines[ServiceContract].transitions[DRAFT->ACTIVE]
          - state_machines[ServiceCall].transitions[DISPATCHED->ON_SITE]
          - state_machines[PreventiveVisit].transitions[SCHEDULED->IN_PROGRESS]
          - validations[priority=21]
          - validations[priority=23]
          - validations[priority=24]
        distinguishing_aspect: "None of these endpoints is idempotent: activate, arrive and start each succeed once and then return their machine's state error, and the replay must not re-stamp arrived_at / started_at or re-bump the contract version."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH, units e1/e2, DRAFT GOLD/FULL contract, technicians T1 and T2."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-ID-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-ID-2", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 140000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Ravi Shah", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t2_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator, captures: { v_first: "$.data.version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator, captures: { err_activate: "$.data.error_id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_NOISE" }, as: ServiceCoordinator, captures: { call_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/dispatch", payload: { start_at: "2026-08-15T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:45:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}", captures: { arrived: "$.data.arrived_at" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:30:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}", captures: { err_arrive: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", window_start: "2026-08-15T12:00:00Z", window_end: "2026-08-15T13:30:00Z", technician_id: "${t2_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/start", as: FieldTechnician, as_user_id: "${t2_id}", captures: { started: "$.data.started_at" } }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/start", as: FieldTechnician, as_user_id: "${t2_id}", captures: { err_start: "$.data.error_id" } }
          assert:
            - "${v_first} == 2 and ${err_activate} == 'ERR_CONTRACT_INVALID_STATE' (409)"
            - "ServiceContract.${c_id}.version == 2 after the rejected replay"
            - "${arrived} == '2026-08-15T08:45:00Z' and ${err_arrive} == 'ERR_CALL_INVALID_STATE' (409)"
            - "ServiceCall.${call_id}.arrived_at is still '2026-08-15T08:45:00Z' and response_minutes is still 45 (not 90)"
            - "${started} == '2026-08-15T09:30:00Z' and ${err_start} == 'ERR_VISIT_INVALID_STATE' (409)"
            - "PreventiveVisit.${v1_id}.started_at is unchanged and its assignment is CONFIRMED exactly once"

      - name: renewed_contract_and_accepted_quote_are_both_locked_down
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[ServiceContract].terminal_states
          - state_machines[RenewalQuote].terminal_states
          - validations[priority=21]
          - validations[priority=29]
          - errors.ERR_QUOTE_NOT_ISSUED
        distinguishing_aspect: "After acceptance the contract is RENEWED and the quote is ACCEPTED, so suspend and re-quote both give ERR_CONTRACT_INVALID_STATE (with a freshly read expected_contract_version, proving the 412 gate passed) and a replayed accept gives ERR_QUOTE_NOT_ISSUED rather than a state error on the contract."
        test_recipe:
          setup:
            - "Clock 2026-08-15T12:00:00Z; club NORTH with one unit, ACTIVE GOLD/FULL contract (annual base 140000)."
            - "A renewal quote has been issued and accepted by the club, so the contract is RENEWED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-TL-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 140000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator, captures: { ver_active: "$.data.version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/renewal-quotes", payload: { expected_contract_version: "${ver_active}" }, as: ContractAdministrator, captures: { q1_id: "$.data.id" } }
            - { call: "POST /fleetcare/renewal-quotes/${q1_id}/accept", as: ClubManager, as_user_id: "${club_id}", captures: { q1_status: "$.data.status" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { ver_renewed: "$.data.version" } }
          trigger:
            - { call: "POST /fleetcare/contracts/${c_id}/suspend", payload: { reason: "TOO_LATE" }, as: ContractAdministrator, captures: { err_susp: "$.data.error_id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/renewal-quotes", payload: { expected_contract_version: "${ver_renewed}" }, as: ContractAdministrator, captures: { err_requote: "$.data.error_id" } }
            - { call: "POST /fleetcare/renewal-quotes/${q1_id}/accept", as: ClubManager, as_user_id: "${club_id}", captures: { err_accept: "$.data.error_id" } }
          assert:
            - "${q1_status} == 'ACCEPTED' and ${ver_renewed} == 4 (create 1, activate 2, quote 3, accept 4)"
            - "${err_susp} == 'ERR_CONTRACT_INVALID_STATE' with HTTP 409"
            - "${err_requote} == 'ERR_CONTRACT_INVALID_STATE' with HTTP 409 (not ERR_STALE_CONTRACT_VERSION)"
            - "${err_accept} == 'ERR_QUOTE_NOT_ISSUED' with HTTP 409"
            - "ServiceContract.${c_id}.status == 'RENEWED' and version == 4 (no rejected attempt bumped it)"
            - "exactly one RenewalQuote exists on ${c_id} and it is still ACCEPTED"

      - name: quote_decisions_are_refused_at_exactly_the_expiry_instant
        claim_type: precondition_enforcement
        grounds:
          - state_machines[RenewalQuote].transitions[ISSUED->ACCEPTED].preconditions
          - validations[priority=30]
          - errors.ERR_QUOTE_EXPIRED
          - calculations.renewal_quote_pricing.constants.QUOTE_VALIDITY_DAYS
        distinguishing_aspect: "The validity test is strict inequality: at the expires_at instant itself (issued 2026-08-15T12:00Z + 30 days = 2026-09-14T12:00:00Z) both accept and decline are 409 ERR_QUOTE_EXPIRED, while one minute earlier the accept succeeds."
        test_recipe:
          setup:
            - "Clock 2026-08-15T12:00:00Z; club NORTH with one unit and an ACTIVE GOLD/FULL contract."
            - "A renewal quote is issued at 12:00Z, so expires_at is 2026-09-14T12:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-QX-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 140000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator, captures: { ver_active: "$.data.version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/renewal-quotes", payload: { expected_contract_version: "${ver_active}" }, as: ContractAdministrator, captures: { q1_id: "$.data.id", q1_expires: "$.data.expires_at" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T12:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/renewal-quotes/${q1_id}/accept", as: ClubManager, as_user_id: "${club_id}", captures: { err_accept: "$.data.error_id" } }
            - { call: "POST /fleetcare/renewal-quotes/${q1_id}/decline", payload: { reason: "BUDGET" }, as: ClubManager, as_user_id: "${club_id}", captures: { err_decline: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T11:59:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/renewal-quotes/${q1_id}/accept", as: ClubManager, as_user_id: "${club_id}", captures: { ok_status: "$.data.status" } }
          assert:
            - "${q1_expires} == '2026-09-14T12:00:00Z'"
            - "${err_accept} == 'ERR_QUOTE_EXPIRED' with HTTP 409 and the quote stays ISSUED"
            - "${err_decline} == 'ERR_QUOTE_EXPIRED' with HTTP 409 and decline_reason stays null"
            - "the contract stays RENEWAL_QUOTED throughout both rejections"
            - "${ok_status} == 'ACCEPTED' with HTTP 200 one minute before expiry"
            - "ServiceContract.${c_id}.status == 'RENEWED' after the successful accept"

      - name: suspension_cascades_only_into_still_scheduled_visits
        claim_type: cascade_down
        grounds:
