# =============================================================================
# §1.8 Scaffold Difficulty Design — task_0992 Document Digitization Bureau
# 9 rules x 2 instances = 18 instances. All chains replay against §1.5 of the
# sibling SCAFFOLD.yaml. Numeric asserts are precomputed literals.
#
# Canonical pipeline (per-instance, empty DB):
#   client -> agreement -> batch(v1) -> box -> docs -> start-prep(v2)
#   -> start-scan(v3) -> scanner -> session open -> page-logs
#   -> GET batch (capture version) -> commit(v4) -> submit-qa(v5)
#   -> pass-qa(v6) -> index-records -> deliver(v7)
# Pricing constants: STANDARD 0.45 USD/page, VOLUME 0.30 USD/page.
# Precomputed: 100p STANDARD = 4500c; 25p = 1125c; 10p = 450c.
# VOLUME+RUSH x1.75 => 52.5c/page => round_half_up per doc: 1p -> 53c.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_pricing_provisional_includes_rejected_final_excludes
        grounds:
          - calculations.invoice_pricing
          - state_machines.Document.SCANNED_to_REJECTED
          - state_machines.Batch.INDEXING_to_DELIVERED
          - entities.Invoice.fields.page_subtotal_cents
        distinguishing_aspect: |
          Invoice-domain dual variant: the provisional variant's document set
          {SCANNED, QA_FAILED, INDEXED, DELIVERED, REJECTED} bills a REJECTED
          document's produced pages (6075 cents mid-pipeline), while the final
          variant's set {SCANNED, INDEXED, DELIVERED} removes the REJECTED
          document (5625 cents after delivery) — identical raw scan data, two
          valid algorithms, a 450-cent divergence.
        test_recipe:
          setup:
            - "Client (non-HIPAA) with STANDARD agreement (rush_multiplier 1.75, storage_free_days 10, storage_daily_rate_cents 55, retention_days 30, max_boxes_per_batch 5)"
            - "Batch with one box and three documents: d1 100p ocr 95, d2 25p ocr 90, d3 10p ocr 50"
            - "All three documents scanned and committed; batch advanced SCANNING -> QA -> INDEXING"
            - "d1 and d2 INDEXED; d3 REJECTED at index submission (ocr_confidence 50 < 70)"
            - "Reject allowance: 1 rejection <= max(1, floor(0.10*3)) = 1, so the batch is indexable"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Acme Legal", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "CONTRACT", pages: 100, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "INVOICE", pages: 25, contains_phi: false, ocr_confidence: 90 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d2: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 10, contains_phi: false, ocr_confidence: 50 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d3: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 100 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d2}", pages: 25 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d3}", pages: 10 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv: $.data.version } }
            - { call: "POST /scan-sessions/${ss}/commit", payload: { expected_batch_version: "${bv}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/pass-qa", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /documents/${d1}/index-records", payload: { metadata_json: { title: "T1", record_date: "2026-01-01", subject: "S1" }, ocr_text_ref: "ocr://t1" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /documents/${d2}/index-records", payload: { metadata_json: { title: "T2", record_date: "2026-01-02", subject: "S2" }, ocr_text_ref: "ocr://t2" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /documents/${d3}/index-records", payload: { metadata_json: { title: "T3", record_date: "2026-01-03", subject: "S3" }, ocr_text_ref: "ocr://t3" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "GET /batches/${bid}/invoices", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { inv: "$.data[0].id" } }
            - { call: "GET /invoices/${inv}", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { prov_subtotal: $.data.page_subtotal_cents } }
          trigger:
            - { call: "POST /batches/${bid}/deliver", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "GET /invoices/${inv}", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { final_subtotal: $.data.page_subtotal_cents } }
          assert:
            - "provisional read (batch INDEXING): ${prov_subtotal} == 6075  (4500 + 1125 + 450, REJECTED doc d3 included)"
            - "Document.${d3}.status == REJECTED"
            - "final read after deliver: ${final_subtotal} == 5625  (REJECTED doc excluded)"
            - "${final_subtotal} != ${prov_subtotal}  (divergence == 450)"
            - "Batch.${bid}.status == DELIVERED and Batch.${bid}.delivery_status == PARTIAL"

      - name: storage_fee_projected_vs_frozen_at_issue
        grounds:
          - calculations.storage_fee_projection
          - entities.Batch.fields.projected_storage_fee_cents
          - entities.Invoice.fields.storage_subtotal_cents
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Storage-domain dual variant (different entity domain from per-page
          invoice pricing): the projected variant evaluates accrual at the
          current logical clock and shrinks when a box is RETURNED, while the
          actual_at_issue variant froze 110 cents into the issued invoice —
          after the return the live projection reads 0 while the frozen invoice
          still reads 110.
        test_recipe:
          setup:
            - "Client (non-HIPAA), STANDARD agreement with storage_free_days 10, storage_daily_rate_cents 55, retention_days 30"
            - "Batch with one STORED box (600g on GENERAL slot cap 2000) and one 100-page document, fully delivered at clock 2026-05-10T00:00:00Z"
            - "disposition_at = 2026-06-09T00:00:00Z (retention 30d) — no sweep during this test"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Med Recs Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /shelf-slots", payload: { shelf_code: "SH-G1", zone: "GENERAL", capacity_grams: 2000 }, as: PlatformAdmin, captures: { slot: $.data.id } }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/shelf-assignments", payload: { shelf_slot_id: "${slot}" }, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "CONTRACT", pages: 100, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 100 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv: $.data.version } }
            - { call: "POST /scan-sessions/${ss}/commit", payload: { expected_batch_version: "${bv}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/pass-qa", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /documents/${d1}/index-records", payload: { metadata_json: { title: "T1", record_date: "2026-01-01", subject: "S1" }, ocr_text_ref: "ocr://t1" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /batches/${bid}/deliver", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /batches/${bid}", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { proj_at_issue: $.data.projected_storage_fee_cents } }
            - { call: "GET /batches/${bid}/invoices", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { inv: "$.data[0].id" } }
          trigger:
            - { call: "POST /invoices/${inv}/issue", payload: {}, as: BillingClerk, as_user_id: "bill-1" }
            - { call: "POST /boxes/${box1}/request-return", payload: {}, as: ClientUser, as_user_id: "${cid}" }
            - { call: "POST /boxes/${box1}/mark-returned", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-30T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /batches/${bid}", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { proj_after_return: $.data.projected_storage_fee_cents } }
            - { call: "GET /invoices/${inv}", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { frozen_storage: $.data.storage_subtotal_cents } }
          assert:
            - "projected at 2026-05-22 (elapsed 12d, free 10d -> 2 chargeable days x 55c): ${proj_at_issue} == 110"
            - "issued invoice storage frozen: ${frozen_storage} == 110"
            - "Box.${box1}.status == RETURNED after mark-returned"
            - "projected at 2026-05-30 after return: ${proj_after_return} == 0  (RETURNED boxes excluded)"
            - "${proj_after_return} != ${frozen_storage}  (projected variant diverges from frozen actual_at_issue)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: indexability_nested_allowance_floor_mode_a
        grounds:
          - calculations.batch_indexability
          - state_machines.Batch.INDEXING_to_DELIVERED
        distinguishing_aspect: |
          Mode (a) combinatorial: the deliver gate is a 3-input non-linear
          formula (total docs, rejected count, allowance max(1, floor(0.10*N)))
          with a conditional branch on document state; at N=10 the nested
          max/floor yields allowance exactly 1, so exactly 1 rejection keeps the
          batch deliverable and delivery_status flips to PARTIAL.
        test_recipe:
          setup:
            - "Client + STANDARD agreement (retention 30, max_boxes 20)"
            - "Batch with 10 one-page documents (d1..d10); all scanned and committed; batch in INDEXING"
            - "d1..d9 INDEXED; d10 (ocr_confidence 40) REJECTED at index submission"
            - "allowance = max(1, floor(0.10*10)) = 1; rejected count 1 <= 1 -> indexable"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Bulk Forms Inc", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 20 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 1, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 1, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d2: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 1, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d3: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 1, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d4: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 1, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d5: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 1, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d6: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 1, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d7: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 1, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d8: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 1, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d9: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 1, contains_phi: false, ocr_confidence: 40 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d10: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 1 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d2}", pages: 1 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d3}", pages: 1 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d4}", pages: 1 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d5}", pages: 1 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d6}", pages: 1 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d7}", pages: 1 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d8}", pages: 1 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d9}", pages: 1 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d10}", pages: 1 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv: $.data.version } }
            - { call: "POST /scan-sessions/${ss}/commit", payload: { expected_batch_version: "${bv}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/pass-qa", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /documents/${d1}/index-records", payload: { metadata_json: { title: "T", record_date: "2026-01-01", subject: "S" }, ocr_text_ref: "ocr://1" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /documents/${d2}/index-records", payload: { metadata_json: { title: "T", record_date: "2026-01-01", subject: "S" }, ocr_text_ref: "ocr://2" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /documents/${d3}/index-records", payload: { metadata_json: { title: "T", record_date: "2026-01-01", subject: "S" }, ocr_text_ref: "ocr://3" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /documents/${d4}/index-records", payload: { metadata_json: { title: "T", record_date: "2026-01-01", subject: "S" }, ocr_text_ref: "ocr://4" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /documents/${d5}/index-records", payload: { metadata_json: { title: "T", record_date: "2026-01-01", subject: "S" }, ocr_text_ref: "ocr://5" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /documents/${d6}/index-records", payload: { metadata_json: { title: "T", record_date: "2026-01-01", subject: "S" }, ocr_text_ref: "ocr://6" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /documents/${d7}/index-records", payload: { metadata_json: { title: "T", record_date: "2026-01-01", subject: "S" }, ocr_text_ref: "ocr://7" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /documents/${d8}/index-records", payload: { metadata_json: { title: "T", record_date: "2026-01-01", subject: "S" }, ocr_text_ref: "ocr://8" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /documents/${d9}/index-records", payload: { metadata_json: { title: "T", record_date: "2026-01-01", subject: "S" }, ocr_text_ref: "ocr://9" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /documents/${d10}/index-records", payload: { metadata_json: { title: "T", record_date: "2026-01-01", subject: "S" }, ocr_text_ref: "ocr://10" }, as: Indexer, as_user_id: "idx-1" }
          trigger:
            - { call: "POST /batches/${bid}/deliver", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "GET /batches/${bid}/invoices", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { inv: "$.data[0].id" } }
            - { call: "GET /invoices/${inv}", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { final_subtotal: $.data.page_subtotal_cents } }
          assert:
            - "Document.${d10}.status == REJECTED"
            - "Batch.${bid}.status == DELIVERED  (1 rejection <= allowance max(1, floor(1.0)) == 1)"
            - "Batch.${bid}.delivery_status == PARTIAL"
            - "final invoice subtotal: ${final_subtotal} == 405  (9 delivered 1-page docs x 45c; rejected doc removed at finalization)"

      - name: per_document_rounding_before_sum_mode_b
        grounds:
          - calculations.invoice_pricing
          - entities.Invoice.fields.page_subtotal_cents
        distinguishing_aspect: |
          Mode (b) combinatorial (different mode from the nested max/floor
          allowance): rounding order is pinned per-document-then-sum. At the
          VOLUME+RUSH rate of 52.5 cents/page, two 1-page documents yield
          round_half_up(52.5) + round_half_up(52.5) = 53 + 53 = 106 cents;
          the forbidden sum-then-round order would yield round_half_up(105.0)
          = 105 cents.
        test_recipe:
          setup:
            - "Client with VOLUME agreement (rush_multiplier 1.75, retention 30)"
            - "RUSH batch (admitted_rush 0 < 3) with two 1-page documents, both scanned and committed; batch still SCANNING"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Rush Jobs LLC", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
