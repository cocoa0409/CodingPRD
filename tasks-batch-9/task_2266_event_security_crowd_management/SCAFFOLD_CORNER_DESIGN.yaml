          window_end: '2026-09-12T22:30:00Z'
        as: StaffingCoordinator
        captures:
          a_p1: $.data.id
      - call: POST /event-security/post-assignments/${a_s1}/duty-events
        payload:
          action: CONFIRM
        as: StaffingCoordinator
      - call: POST /event-security/post-assignments/${a_p1}/duty-events
        payload:
          action: CONFIRM
        as: StaffingCoordinator
      trigger:
      - call: GET /event-security/staffing-plans/${plan_id}/coverage-summary
        payload: {}
        as: StaffingCoordinator
      - call: POST /event-security/staffing-plans/${plan_id}/lifecycle
        payload:
          action: ACTIVATE
        as: SecurityDirector
        as_user_id: director-1
      - call: GET /event-security/staffing-plans/${plan_id}/coverage-summary
        payload: {}
        as: StaffingCoordinator
      - call: GET /event-security/security-events/${event_id}
        payload: {}
        as: StaffingCoordinator
      assert:
      - 'before ACTIVATE: Post.${s1_id}.status == FILLED (clause 2, 1 >= 1) and Post.${p1_id}.status == PARTIALLY_STAFFED (clause 2 fails at 1 < 4, clause 3 does not apply on a PUBLISHED plan, clause 4
        matches because filled_guard_count > 0)'
      - 'before ACTIVATE: the coverage summary reports required_total_staff == 5, filled_total_staff == 2, coverage_ratio == 0.40, understaffed_post_count == 0 and readiness_posture == BLOCKED'
      - 'after ACTIVATE: Post.${p1_id}.status == UNDERSTAFFED — clause 3 now matches because the plan is ACTIVATED, and it outranks clause 4 even though filled_guard_count is still 1'
      - 'after ACTIVATE: Post.${s1_id}.status is still FILLED, because clause 2 precedes clause 3'
      - 'after ACTIVATE: the coverage summary reports understaffed_post_count == 1, coverage_ratio == 0.40, supervisor_coverage_ok == true and readiness_posture == BLOCKED'
      - 'after ACTIVATE: the coverage summary reports committed_cost_cents == 33000 (2 * 16500) and committed_guard_hours == 15.00'
      - 'after ACTIVATE: SecurityEvent.${event_id}.status == STAFFED (cascaded from the activation)'
      - 'after ACTIVATE: SecurityEvent.${event_id}.gate_posture == RESTRICTED — clause 3 of the gate ladder fires because the current plan is BLOCKED, and the event has left the pre-plan states so the clause
        is no longer skipped'
  - name: composite_threat_score_applies_declared_weights
    claim_type: constants_applied
    grounds:
    - calculations.composite_threat_score
    - calculations.composite_threat_score.constants
    excluded_because:
      difficulty_instance: threat_score_density_and_history_caps_applied_before_multiplication
      rationale: |
        That instance pins the full weight table AND the two caps in the same recipe, asserting that DENSITY_PRESSURE_CAP 25 and CROWD_FACTOR_CAP 1.35 are applied before the multiplication rather than after it — a strict superset of a plain weights-applied assertion.
  - name: required_staff_matrix_ceils_each_post_type_share
    claim_type: tiered_pricing
    grounds:
    - calculations.required_staff_matrix
    - calculations.required_staff_matrix.constants
    excluded_because:
      difficulty_instance: required_staff_matrix_ceil_per_share_before_summation
      rationale: |
        The pinned rounding order — four independent ceil() calls summed afterwards, versus the rejected ceil-then-split reading — is exactly that instance's subject, including the per-share integers and the resulting required_line_guards.
  - name: risk_tier_ladder_uses_inclusive_lower_bounds
    claim_type: threshold
    grounds:
    - calculations.risk_tier
    - calculations.risk_tier.constants
    excluded_because:
      difficulty_instance: risk_tier_boundary_score_exactly_fifty
      rationale: |
        That instance lands composite_threat_score on exactly 50.00 and on 49.99 to pin the inclusive-at-the-bottom comparison and the fact that the comparison runs on the two-decimal rounded score, which covers the whole tier ladder.
  - name: crowd_density_classification_thresholds
    claim_type: threshold
    grounds:
    - calculations.crowd_density_classification
    - calculations.crowd_density_classification.constants
    excluded_because:
      difficulty_instance: density_critical_threshold_exactly_four_persons_per_sqm
      rationale: |
        That instance walks the AMBER 2.0 / RED 3.2 / CRITICAL 4.0 ladder and lands exactly on the CRITICAL threshold, asserting the inclusive comparison and the 3-decimal rounding of the density itself.
  - name: crowd_density_rolling_mean_over_three_readings
    claim_type: decay_function
    grounds:
    - calculations.crowd_density_classification
    - entities.DensityReading.fields.rolling_level
    - entities.DensityReading.fields.effective_level
    excluded_because:
      difficulty_instance: density_effective_level_instantaneous_vs_rolling_window
      rationale: |
        The ROLLING_WINDOW_SIZE 3 mean, the single rounding after averaging, and the switch of effective_level from the instantaneous variant to the rolling variant at the third reading are all that instance's subject.
  - name: subcontracted_assignment_applies_markup_then_admin_fee
    claim_type: tiered_pricing
    grounds:
    - calculations.assignment_cost
    - calculations.assignment_cost.constants
    - entities.PostAssignment.fields.pay_basis
    excluded_because:
      difficulty_instance: subcontract_assignment_cost_three_level_rounding
      rationale: |
        The SUBCONTRACTED branch — markup applied to the already-rounded base+night subtotal, rounded again, and only then the flat SUBCONTRACT_ADMIN_FEE_CENTS added, with pay_basis SUBCONTRACT — is asserted there at all three rounding levels.
- section: validations
  instances:
  - name: lane_open_without_on_post_operator_returns_lane_unstaffed
    claim_type: violation_to_error
    grounds:
    - validations[priority=31]
    - errors.ERR_LANE_UNSTAFFED
    - state_machines.ScreeningLane.PLANNED_to_OPEN
    - calculations.lane_effective_throughput
    distinguishing_aspect: |
      ERR_LANE_UNSTAFFED is the only validation in §1.4 whose subject is a DERIVED counter on the target row rather than a stored field: assigned_operator_count is recomputed from ON_POST assignments on posts bound to the lane, so a lane with two CONFIRMED-and-BRIEFED operators who have not yet checked in still reads 0 and must be refused — the guards being rostered is not the same as the guards being on post.
    test_recipe:
      setup:
      - logical clock at 2026-09-12T16:30:00Z
      - Venue "Harbor Arena" (gross_capacity 8000, door_count 1) with zones ZF (FLOOR, 200 sqm), ZI (CONCOURSE, 100 sqm, ingress) and ZE (EXIT_CORRIDOR, 50 sqm); SecurityEvent with expected_attendance 200,
        doors_open_at 2026-09-12T17:00:00Z, event_start_at 18:30:00Z, event_end_at 22:30:00Z; RiskAssessment APPROVED at version 3 (composite_threat_score 3.75, T1, required_total_staff 5, required_supervisors
        1, required_screening_lanes 2, minimum_staffing_cost_floor_cents 36000); logical clock 2026-09-01T00:00:00Z
      - 'StaffingPlan ACTIVATED with budget_cents 500000 and four posts over 2026-09-12T15:00:00Z..22:30:00Z: S1 (SUPERVISOR, 1 guard, min_credential_level 3), I1 (INGRESS_SCREENING in ZI, 2 guards, bound
        to the BAG_CHECK lane), F1 (FLOOR, 1 guard) and E1 (EMERGENCY_EXIT, 1 guard) — required_total_staff 5'
