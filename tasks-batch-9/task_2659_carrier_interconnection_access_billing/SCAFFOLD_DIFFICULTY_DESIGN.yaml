- rule_id: boundary_precision_check
  instances:
  - name: blocking_pct_exactly_three_percent_triggers_augment
    grounds:
    - calculations.trunk_sizing_and_blocking
    - state_machines.TrunkGroup.NONE_to_AUGMENT_ORDERED
    - entities.TrafficMeasurement.fields.blocking_pct
    - endpoints.POST /interconnection/trunk-groups/{trunk_group_id}/traffic-measurements
    distinguishing_aspect: |
      Metric: TrafficMeasurement.blocking_pct against BLOCKING_THRESHOLD_PCT 3.00 with a strictly-less-than no-action branch, probed on POST /interconnection/trunk-groups/{trunk_group_id}/traffic-measurements. 299/10000 rounds to 2.99 and is inert while 300/10000 is exactly 3.00 and orders an augment, with the sizing inputs held constant so only the threshold moves. Different metric AND different endpoint from the reserve-tier floor instance of this rule.
    test_recipe:
      setup:
      - An EFFECTIVE agreement with poi_facility_capacity_trunks 192.
      - One IN_SERVICE TWO_WAY trunk group at DLLSTXCTDS0, 48 provisioned trunks, forecast 1200.00 CCS, augment_status NONE.
      - Logical clock at the 2026-08-01T00:00:00Z default.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      - call: POST /interconnection/negotiation-offers/${offer1_id}/accept
        payload: {}
        as: CarrierRepresentative
        as_user_id: ${car_id}
      - call: POST /interconnection/agreements/${agr_id}/activate
        payload: {}
        as: InterconnectionManager
      - *id001
      - *id002
      - *id003
      trigger:
      - call: POST /interconnection/trunk-groups/${tg1_id}/traffic-measurements
        payload:
          measurement_period_start: '2026-06-01T00:00:00.000Z'
          measurement_period_end: '2026-06-30T00:00:00.000Z'
          offered_calls: 10000
          blocked_calls: 299
          busy_hour_ccs: 2100.00
        as: NetworkPlanner
        captures:
          m_lo_id: $.data.id
      - call: POST /interconnection/trunk-groups/${tg1_id}/traffic-measurements
        payload:
          measurement_period_start: '2026-07-01T00:00:00.000Z'
          measurement_period_end: '2026-07-31T00:00:00.000Z'
          offered_calls: 10000
          blocked_calls: 300
          busy_hour_ccs: 2100.00
        as: NetworkPlanner
        captures:
          m_hi_id: $.data.id
      assert:
      - TrafficMeasurement.${m_lo_id}.blocking_pct == 2.99 and augment_triggered == false
      - TrafficMeasurement.${m_lo_id}.required_trunks_at_measurement == 68 (the shortfall existed; only the threshold held the order back)
      - TrafficMeasurement.${m_hi_id}.blocking_pct == 3.00 and augment_triggered == true
      - TrafficMeasurement.${m_hi_id}.required_trunks_at_measurement == 68, identical to the inert measurement
      - TrunkGroup.${tg1_id}.augment_status == AUGMENT_ORDERED and open_augment_order_count == 1
      - GET /interconnection/trunk-augment-orders filtered to the trunk group returns total_count 1 and its triggering_measurement_id == ${m_hi_id}
      - InterconnectionAgreement.${agr_id}.poi_augment_pending_count == 1
