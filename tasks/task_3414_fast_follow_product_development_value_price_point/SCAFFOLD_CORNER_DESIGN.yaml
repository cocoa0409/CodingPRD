              payload: {}
              as: PlatformAdmin
              captures: { env_err: $.data.error_id }
          assert:
            - "the response status is 404 and env_err == ERR_CONCEPT_NOT_FOUND"
            - "response_type == \"error\" and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present and non-null"

