  - section: rbac
    instances:

      - name: admin_cannot_stand_in_for_the_operator_roles_it_oversees
        claim_type: cross_role_denied
        grounds:
          - roles.ClearinghouseAdmin
          - validations.priority_2.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          Every step of the clearing pipeline is refused to ClearinghouseAdmin
          and then immediately succeeds for the role that owns it, and the
          denial is symmetric: the SettlementOfficer cannot onboard a retailer.
          The 403 must be ERR_FORBIDDEN_ROLE from priority 2, so it fires before
          any state or existence check — the submission is in exactly the right
          state for each refused call.
        test_recipe:
          setup:
            - "one manufacturer, one retailer, one ACTIVE offer, one POS basket and a RECEIVED submission of 1 coupon"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
