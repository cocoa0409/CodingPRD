              captures: { e_not_approved: $.data.error_id }
            - call: "POST /price-integrity/refund-claims/${claim_2}/settle"
              payload: { target_status: "DENIED" }
              as: CustomerServiceDesk
              captures: { e_no_reason: $.data.error_id }
            - call: "POST /price-integrity/refund-claims/${claim_1}/settle"
              payload: { target_status: "APPROVED" }
              as: CustomerServiceDesk
              captures: { st_approved: $.data.status }
            - call: "POST /price-integrity/refund-claims/${claim_1}/settle"
              payload: { target_status: "PAID" }
              as: CustomerServiceDesk
              captures: { st_paid: $.data.status, paid_at_1: $.data.paid_at }
            - call: "POST /price-integrity/refund-claims/${claim_1}/settle"
              payload: { target_status: "PAID" }
