          - entities.LucDetermination.fields.qualifying_spot_count
          - entities.LucDetermination.fields.basis_spot_id
        distinguishing_aspect: "The window comparison is inclusive on both ends: a 30-second spot on 2026-08-01 (exactly window_start_date) enters the candidate set while an identically priced spot on 2026-07-31 does not, so qualifying_spot_count is 1 and basis_spot_id names the 2026-08-01 spot."
        test_recipe:
          setup:
            - "The logical clock starts at 2026-07-25T09:00:00Z so both air dates are still in the future."
            - "One station with a PRIMARY election on 2026-09-15, whose window_start_date is 2026-08-01, and one EARLY_NEWS rate class at posted_rate_cents 100000."
            - "One classified issue advertiser holds two ACCEPTED single-spot PREPAY orders, one airing 2026-07-31 and one airing 2026-08-01, each charged 100000."
