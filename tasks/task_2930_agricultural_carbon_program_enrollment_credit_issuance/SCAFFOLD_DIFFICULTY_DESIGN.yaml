  - rule_id: non_linear_state_machine
    instances:
      - name: run_rejected_revise_qualified_resample_cycle
        grounds:
          - state_machines.QuantificationRun
          - state_machines.Verification
          - entities.QuantificationRun.fields.revision_count
          - entities.Verification.fields.resample_count
          - endpoints[POST /quantification-runs/{quantification_run_id}/revise]
          - endpoints[POST /verifications/{verification_id}/resample]
        distinguishing_aspect: |
          The run walks DRAFT -> SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED -> SUBMITTED
          (a QUALIFIED opinion is a self-loop that does NOT advance the run) -> VERIFIED, so the
          same state is entered twice by two different triggers while a second machine cycles
          PENDING -> QUALIFIED -> PENDING underneath it. revision_count 1 and resample_count 1
          prove the backward edges were traversed rather than the entity being recreated, and
          the recomputed net_removals_t after revise proves the calculation re-ran on re-entry.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; COVER_CROP standard v1; grower G1 ACTIVE; field F1 mapped_acres 1000.00 with the standard 2021-2025 practice history."
