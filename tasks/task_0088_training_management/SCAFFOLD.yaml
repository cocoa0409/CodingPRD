scenario: |
  Enterprise training management system: course catalog design with course-category hierarchy,
  course profile (objective/outline/duration/prerequisite), course-version control, on-shelf
  and off-shelf workflow, and course-tag-based searchability; instructor management with
  internal and external instructor roster, qualification and expertise tagging, instructor-fee
  standard, evaluation history, availability calendar, and blacklist handling; training session
  scheduling with session-mode (onsite/online/hybrid), classroom and online-room resource
  allocation, instructor-availability matching, conflict detection across sessions, capacity
  configuration, and session-cancellation rules; trainee enrollment with eligibility check
  (job-level/department/prerequisite-course), self-enrollment and assigned-enrollment modes,
  waitlist queue, enrollment-deadline enforcement, and approval workflow for charged courses;
  check-in / exam / evaluation with multi-channel check-in (QR/face/IP-range for online),
  session-during attendance sampling, post-session exam with question-bank composition,
  post-session evaluation survey, and result aggregation; credit accumulation with credit-rule
  configuration per course, multi-cycle credit pool (annual/biennial), credit-requirement by
  job-role, credit-shortfall warning, and credit-history archiving; certificate validity
  management with certificate-template configuration, eligibility rules (attendance +
  exam-pass), validity-period and renewal rules, electronic-certificate verification,
  expiration-approaching reminder, and re-certification workflow; event-driven synchronization
  with HR, IM, and learning-content-platform systems; audit logging for enrollment and credit
  adjustments.

domain_name: training-management
api_prefix: /training

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - version_pinning_on_approval
    - ops_run_checkpoint
    - derived_field_reconciliation

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CourseCategory
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the category.
        constraints: "1..80 chars; unique among siblings of the same parent_id"
      - name: parent_id
        type: string
        source: input
        description: Self-referential FK to another CourseCategory; null for root categories.
        default: null
        constraints: "Must not create a cycle; max depth 4 (root=depth 0)"
      - name: depth
        type: integer
        source: computed
        description: Computed depth from root; 0 for root categories.
        constraints: "0..4; recomputed on reparent"
      - name: course_count
        type: integer
        source: computed
        description: Denormalized count of Course rows whose category_id equals this category's id (regardless of course status). Recomputed on Course create/delete and on category reparent.
        default: 0

  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Stable human-readable identifier; immutable after creation.
        constraints: "^[A-Z]{2,6}-[0-9]{3,5}$; globally unique"
      - name: title
        type: string
        source: input
        description: Course title.
        constraints: "1..200 chars"
      - name: category_id
        type: string
        source: input
        description: FK to CourseCategory.id.
      - name: objective
        type: string
        source: input
        description: Free-text learning objective.
      - name: outline
        type: string
        source: input
        description: Free-text course outline (markdown).
      - name: duration_hours
        type: number
        source: input
        description: Nominal course duration in hours (decimal allowed, 1 fractional digit).
        constraints: "0.5..40.0"
      - name: prerequisite_course_ids
        type: array
        source: input
        description: Array of Course.id values that must be completed (final credit > 0) before enrollment.
        default: []
        constraints: "no cycles via prerequisite graph; max 5 entries"
      - name: tags
        type: array
        source: input
        description: Array of free-form lowercase tag strings used for searchability.
        default: []
        constraints: "each tag 2..32 chars, lowercase alphanumeric or hyphen; max 10 tags"
      - name: credit_value
        type: number
        source: input
        description: Base credit awarded for completion. Used as the constant in credit_award_calc.
        constraints: "0..20.0, 1 fractional digit"
      - name: is_charged
        type: boolean
        source: input
        description: If true, enrollment requires approval workflow.
        default: false
      - name: status
        type: enum
        source: computed
        description: Lifecycle status of the course.
        default: DRAFT
        constraints: "{DRAFT, PENDING_REVIEW, ON_SHELF, OFF_SHELF, ARCHIVED}"
      - name: current_version_no
        type: integer
        source: computed
        description: Points to the highest CourseVersion.version_no whose status=PUBLISHED. Used by enrollment.pinned_course_version_id.
        default: 0

  - name: CourseVersion
    parent: Course
    common_fields: false
    fields:
      - name: course_id
        type: string
        source: input
        description: FK to Course.id.
      - name: version_no
        type: integer
        source: computed
        description: Monotonically increasing integer per course, starting at 1.
      - name: snapshot
        type: object
        source: system
        description: Frozen copy of (objective, outline, duration_hours, prerequisite_course_ids, tags, credit_value) at the moment of publish.
      - name: status
        type: enum
        source: computed
        description: Version lifecycle.
        default: DRAFT
        constraints: "{DRAFT, PUBLISHED, SUPERSEDED}"
      - name: published_at
        type: datetime
        source: system
        description: Timestamp when status flipped to PUBLISHED; null otherwise.
        default: null

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Instructor display name.
      - name: instructor_type
        type: enum
        source: input
        description: Internal employee vs external contractor.
        constraints: "{INTERNAL, EXTERNAL}"
      - name: expertise_tags
        type: array
        source: input
        description: Array of lowercase tags. At least one must overlap with target course tags to be eligible for a session.
        default: []
      - name: qualifications
        type: array
        source: input
        description: Array of qualification certificate names (free-form strings).
        default: []
      - name: hourly_rate
        type: number
        source: input
        description: Base hourly rate in cents-as-integer? No — stored as decimal currency with 2dp.
        default: 0
        constraints: ">=0; INTERNAL instructors have hourly_rate=0 (no payout)"
      - name: travel_cost
        type: number
        source: input
        description: Flat travel cost per session for EXTERNAL instructors; 0 for INTERNAL.
        default: 0
        constraints: ">=0"
      - name: avg_evaluation_score
        type: number
        source: computed
        description: Average of EvaluationSurvey.aggregate_score for sessions taught by this instructor whose status=COMPLETED. Null when count is zero.
        default: null
      - name: status
        type: enum
        source: computed
        description: Roster status.
        default: ACTIVE
        constraints: "{ACTIVE, BLACKLISTED, RETIRED}"
      - name: blacklist_reason
        type: string
        source: input
        description: Non-empty only when status=BLACKLISTED.
        default: null

  - name: InstructorAvailability
    parent: Instructor
    common_fields: false
    fields:
      - name: instructor_id
        type: string
        source: input
        description: FK to Instructor.id.
      - name: start_at
        type: datetime
        source: input
        description: Window start (inclusive).
      - name: end_at
        type: datetime
        source: input
        description: Window end (exclusive). Must be strictly after start_at.
      - name: kind
        type: enum
        source: input
        description: Availability kind. AVAILABLE windows are required to schedule a session; BLOCKED windows reject overlap.
        constraints: "{AVAILABLE, BLOCKED}"

  - name: Session
    parent: Course
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: FK to Course.id.
      - name: pinned_course_version_id
        type: string
        source: computed
        description: FK to CourseVersion.id; pinned at session creation to course.current_version_no's CourseVersion. Immutable thereafter.
      - name: instructor_id
        type: string
        source: input
        description: FK to Instructor.id.
      - name: mode
        type: enum
        source: input
        description: Delivery mode.
        constraints: "{ONSITE, ONLINE, HYBRID}"
      - name: classroom_id
        type: string
        source: input
        description: FK to Classroom.id; required when mode in {ONSITE, HYBRID}; must be null when mode=ONLINE.
        default: null
      - name: online_room_id
        type: string
        source: input
        description: FK to OnlineRoom.id; required when mode in {ONLINE, HYBRID}; must be null when mode=ONSITE.
        default: null
      - name: start_at
        type: datetime
        source: input
        description: Scheduled session start (inclusive).
      - name: end_at
        type: datetime
        source: input
        description: Scheduled session end (exclusive); must be strictly after start_at and equal to start_at + course.duration_hours (within 1 minute tolerance).
      - name: capacity
        type: integer
        source: input
        description: Max confirmed enrollments.
        constraints: "1..500"
      - name: waitlist_capacity
        type: integer
        source: input
        description: Max waitlist queue length.
        default: 10
        constraints: "0..100"
      - name: enrollment_deadline
        type: datetime
        source: input
        description: After this instant, no new enrollments are accepted.
        constraints: "must be strictly before start_at"
      - name: status
        type: enum
        source: computed
        description: Session lifecycle.
        default: SCHEDULED
        constraints: "{SCHEDULED, ENROLLMENT_OPEN, ENROLLMENT_CLOSED, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: enrolled_count
        type: integer
        source: computed
        description: Number of Enrollment rows whose session_id=this and status=CONFIRMED.
        default: 0
      - name: waitlist_count
        type: integer
        source: computed
        description: Number of Enrollment rows whose session_id=this and status=WAITLISTED.
        default: 0
      - name: cancellation_fee_charged
        type: boolean
        source: computed
        description: True if session was cancelled within 48 hours of start_at; used by instructor_fee_calc compensating leg.
        default: false

  - name: Classroom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name (e.g., 'Building A Room 301').
        constraints: "unique"
      - name: capacity
        type: integer
        source: input
        description: Physical seat count.
        constraints: ">=1"
      - name: status
        type: enum
        source: input
        description: Room availability.
        default: ACTIVE
        constraints: "{ACTIVE, MAINTENANCE, RETIRED}"
      - name: setup_buffer_minutes
        type: integer
        source: input
        description: Minimum gap required between consecutive sessions in the same classroom.
        default: 30
        constraints: ">=0; <=240"

  - name: OnlineRoom
    parent: null
    common_fields: true
    fields:
      - name: platform
        type: string
        source: input
        description: e.g., 'zoom', 'teams'.
      - name: join_url
        type: string
        source: input
        description: Static join URL.
      - name: max_participants
        type: integer
        source: input
        description: Platform-imposed cap.
        constraints: ">=1"
      - name: status
        type: enum
        source: input
        description: Room availability.
        default: ACTIVE
        constraints: "{ACTIVE, RETIRED}"

  - name: Enrollment
    parent: Session
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: FK to Session.id.
      - name: trainee_id
        type: string
        source: input
        description: FK to Trainee.id.
      - name: mode
        type: enum
        source: input
        description: How the enrollment was created.
        constraints: "{SELF, ASSIGNED}"
      - name: status
        type: enum
        source: computed
        description: Enrollment lifecycle.
        default: PENDING_APPROVAL
        constraints: "{PENDING_APPROVAL, CONFIRMED, WAITLISTED, CANCELLED, NO_SHOW, COMPLETED, FAILED}"
      - name: waitlist_position
        type: integer
        source: computed
        description: 1-indexed position when status=WAITLISTED; null otherwise. Stable per session — when a CONFIRMED enrollment is cancelled, the head of the waitlist (lowest waitlist_position) is promoted; remaining positions shift down by 1.
        default: null
      - name: attendance_status
        type: enum
        source: computed
        description: Final attendance verdict after session completion.
        default: NOT_RECORDED
        constraints: "{NOT_RECORDED, PRESENT, ABSENT, PARTIAL}"
      - name: provisional_credit
        type: number
        source: computed
        description: Credit recorded at attendance recording (before exam result). Equals credit_award_calc.variants.provisional output.
        default: 0
      - name: final_credit
        type: number
        source: computed
        description: Credit recorded after both ExamAttempt and EvaluationSurvey are finalized. Equals credit_award_calc.variants.final output.
        default: 0

  - name: Trainee
    parent: null
    common_fields: true
    fields:
      - name: employee_no
        type: string
        source: input
        description: HR system identifier; unique.
      - name: full_name
        type: string
        source: input
        description: Display name.
      - name: department
        type: string
        source: input
        description: Department code.
      - name: job_level
        type: integer
        source: input
        description: Job-level rank used for eligibility (e.g., 1..10).
        constraints: "1..15"
      - name: status
        type: enum
        source: input
        description: Trainee employment status.
        default: ACTIVE
        constraints: "{ACTIVE, ON_LEAVE, OFFBOARDED}"

  - name: CheckIn
    parent: Session
    common_fields: false
    fields:
      - name: session_id
        type: string
        source: input
        description: FK to Session.id.
      - name: enrollment_id
        type: string
        source: input
        description: FK to Enrollment.id.
      - name: channel
        type: enum
        source: input
        description: Verification channel.
        constraints: "{QR, FACE, IP_RANGE}"
      - name: source_value
        type: string
        source: input
        description: For QR=token; for FACE=image_ref; for IP_RANGE=ipv4 dotted-quad. Validation rules differ per channel.
      - name: checked_in_at
        type: datetime
        source: system
        description: Server-stamped time of check-in.

  - name: ExamAttempt
    parent: Enrollment
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK to Enrollment.id.
      - name: questions
        type: array
        source: system
        description: Composed at attempt creation from the course's question bank using the composition rule (see exam_score_calc). Array of {question_id, weight, correct_answer, given_answer?}.
      - name: total_weight
        type: integer
        source: computed
        description: Sum of all question weights.
      - name: score
        type: number
        source: computed
        description: Result of exam_score_calc on questions, in [0,100], 2 decimal places.
        default: 0
      - name: passed
        type: boolean
        source: computed
        description: True iff score >= PASS_THRESHOLD (70).
        default: false
      - name: submitted_at
        type: datetime
        source: system
        description: Server-stamped submission time.
        default: null

  - name: EvaluationSurvey
    parent: Enrollment
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK to Enrollment.id.
      - name: content_score
        type: integer
        source: input
        description: 1..5 trainee rating of course content.
      - name: instructor_score
        type: integer
        source: input
        description: 1..5 rating of instructor.
      - name: logistics_score
        type: integer
        source: input
        description: 1..5 rating of logistics.
      - name: aggregate_score
        type: number
        source: computed
        description: Result of evaluation_aggregate_calc.

  - name: CreditPool
    parent: Trainee
    common_fields: true
    fields:
      - name: trainee_id
        type: string
        source: input
        description: FK to Trainee.id.
      - name: cycle_kind
        type: enum
        source: input
        description: Annual = single calendar year; Biennial = rolling 2-year window from cycle_start.
        constraints: "{ANNUAL, BIENNIAL}"
      - name: cycle_start
        type: datetime
        source: input
        description: Start of the cycle (inclusive).
      - name: cycle_end
        type: datetime
        source: computed
        description: cycle_start + 1y if ANNUAL, +2y if BIENNIAL (exclusive).
      - name: required_credits
        type: number
        source: input
        description: Required credit floor for this trainee's job-level during this cycle.
      - name: accumulated_credits
        type: number
        source: computed
        description: Sum of Enrollment.final_credit for this trainee across all enrollments whose session.start_at is within [cycle_start, cycle_end) AND enrollment.status=COMPLETED. Recomputed on every CreditAdjustment and on enrollment completion.
        default: 0
      - name: shortfall_warning_emitted
        type: boolean
        source: computed
        description: True after warning_threshold_calc emits a warning event (see sweep endpoint).
        default: false

  - name: CreditAdjustment
    parent: CreditPool
    common_fields: false
    fields:
      - name: credit_pool_id
        type: string
        source: input
        description: FK to CreditPool.id.
      - name: delta
        type: number
        source: input
        description: Positive (grant) or negative (revoke) adjustment.
      - name: reason
        type: string
        source: input
        description: Required free-text justification.
      - name: actor_role
        type: string
        source: system
        description: X-User-Role at time of adjustment.

  - name: CertificateTemplate
    parent: Course
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: FK to Course.id; one template per course.
        constraints: "unique on course_id"
      - name: validity_months
        type: integer
        source: input
        description: Validity period in months from issue.
        constraints: "1..120"
      - name: renewal_window_days
        type: integer
        source: input
        description: How many days before expiry a renewal is allowed.
        default: 30
        constraints: "1..180"
      - name: requires_attendance
        type: boolean
        source: input
        description: If true, enrollment.attendance_status must be PRESENT for issuance.
        default: true
      - name: requires_exam_pass
        type: boolean
        source: input
        description: If true, ExamAttempt.passed must be true.
        default: true

  - name: Certificate
    parent: Trainee
    common_fields: true
    fields:
      - name: trainee_id
        type: string
        source: input
        description: FK to Trainee.id.
      - name: certificate_template_id
        type: string
        source: input
        description: FK to CertificateTemplate.id.
      - name: source_enrollment_id
        type: string
        source: input
        description: FK to Enrollment.id; the enrollment that earned this certificate.
      - name: issued_at
        type: datetime
        source: system
        description: Issue timestamp.
      - name: expires_at
        type: datetime
        source: computed
        description: issued_at + template.validity_months.
      - name: status
        type: enum
        source: computed
        description: Validity lifecycle.
        default: VALID
        constraints: "{VALID, EXPIRING_SOON, EXPIRED, REVOKED, RENEWED}"
      - name: verification_code
        type: string
        source: system
        description: Externally verifiable opaque string; unique.

  - name: SyncEvent
    parent: null
    common_fields: false
    fields:
      - name: source_system
        type: enum
        source: input
        description: Originating system.
        constraints: "{HR, IM, LCP}"
      - name: event_type
        type: string
        source: input
        description: e.g., 'employee.updated', 'message.delivery_failed', 'content.version_pulled'.
      - name: payload
        type: object
        source: input
        description: Free-form JSON payload.
      - name: processed_at
        type: datetime
        source: system
        description: Server stamp when applied; null if not yet applied.
        default: null
      - name: outcome
        type: enum
        source: computed
        description: Application result.
        default: PENDING
        constraints: "{PENDING, APPLIED, REJECTED}"

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: subject_kind
        type: enum
        source: system
        description: Kind of subject being audited.
        constraints: "{ENROLLMENT, CREDIT_POOL}"
      - name: subject_id
        type: string
        source: system
        description: id of Enrollment or CreditPool depending on subject_kind.
      - name: actor_role
        type: string
        source: system
        description: X-User-Role at time of action.
      - name: actor_id
        type: string
        source: system
        description: X-User-ID at time of action.
      - name: action
        type: string
        source: system
        description: e.g., 'enrollment.created', 'enrollment.approved', 'credit.adjusted'.
      - name: before
        type: object
        source: system
        description: JSON snapshot of affected fields before mutation.
      - name: after
        type: object
        source: system
        description: JSON snapshot of affected fields after mutation.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Course
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /training/courses/{id}/submit-for-review"
        actor: CourseDesigner
        preconditions:
          - "objective is non-empty AND outline is non-empty"
          - "credit_value > 0"
        side_effects:
          - "no version snapshot yet"

      - from: PENDING_REVIEW
        to: DRAFT
        trigger: "POST /training/courses/{id}/reject"
        actor: TrainingAdmin
        preconditions:
          - "course.status == PENDING_REVIEW"
        side_effects:
          - "AuditLog written? No — Course changes are not audited (only ENROLLMENT and CREDIT_POOL are)."

      - from: PENDING_REVIEW
        to: ON_SHELF
        trigger: "POST /training/courses/{id}/publish"
        actor: TrainingAdmin
        preconditions:
          - "course.status == PENDING_REVIEW"
        side_effects:
          - "Create CourseVersion with version_no = (max existing version_no for this course) + 1, status=PUBLISHED, snapshot of mutable fields"
          - "Set course.current_version_no = new version_no"
          - "If a prior CourseVersion existed with status=PUBLISHED, transition it to SUPERSEDED (parallel state-machine transition on CourseVersion)"

      - from: ON_SHELF
        to: OFF_SHELF
        trigger: "POST /training/courses/{id}/unpublish"
        actor: TrainingAdmin
        preconditions:
          - "course.status == ON_SHELF"
        side_effects:
          - "No effect on existing Sessions already SCHEDULED or ENROLLMENT_OPEN (they continue with their pinned_course_version_id)"
          - "Block new Session creation for this course (validation)"

      - from: OFF_SHELF
        to: ON_SHELF
        trigger: "POST /training/courses/{id}/publish"
        actor: TrainingAdmin
        preconditions:
          - "course.status == OFF_SHELF"
          - "a CourseVersion with status=PUBLISHED exists"
        side_effects:
          - "Unblock new Session creation"

      - from: OFF_SHELF
        to: ARCHIVED
        trigger: "POST /training/courses/{id}/archive"
        actor: TrainingAdmin
        preconditions:
          - "course.status == OFF_SHELF"
          - "no Session whose course_id=this and whose status NOT IN {COMPLETED, CANCELLED}"
        side_effects:
          - "course is now read-only; any future request that references it for new Session or Enrollment is rejected"

  - entity: CourseVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "side-effect of Course publish transition"
        actor: system
        preconditions: ["parent Course transitioning DRAFT→PENDING_REVIEW→ON_SHELF"]
        side_effects:
          - "Set published_at = now()"
          - "Update course.current_version_no"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "side-effect of subsequent Course publish (creating a newer CourseVersion)"
        actor: system
        preconditions: ["a newer CourseVersion with status=PUBLISHED is being created"]
        side_effects:
          - "Old version remains queryable; cannot be pinned by new Sessions"

  - entity: Session
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ENROLLMENT_OPEN
        trigger: "POST /training/sessions/{id}/open-enrollment"
        actor: TrainingAdmin
        preconditions:
          - "session.status == SCHEDULED"
          - "course.status == ON_SHELF (cross-entity dependency: Session ↔ Course)"
          - "now() < enrollment_deadline"
        side_effects: []

      - from: ENROLLMENT_OPEN
        to: ENROLLMENT_CLOSED
        trigger: "system event when now() >= enrollment_deadline (driven by POST /training/_clock/advance and POST /training/_sweep/run)"
        actor: system
        preconditions:
          - "session.status == ENROLLMENT_OPEN"
          - "now() >= enrollment_deadline"
        side_effects:
          - "No further enrollment changes accepted (any POST to enroll returns ERR_ENROLLMENT_DEADLINE_PASSED)"

      - from: ENROLLMENT_CLOSED
        to: IN_PROGRESS
        trigger: "system event when now() >= start_at (driven by sweep)"
        actor: system
        preconditions:
          - "session.status == ENROLLMENT_CLOSED"
          - "now() >= start_at"
        side_effects:
          - "Check-in endpoints become active"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /training/sessions/{id}/complete"
        actor: TrainingAdmin
        preconditions:
          - "session.status == IN_PROGRESS"
          - "now() >= end_at"
        side_effects:
          - "Cascade depth-3 chain: For every Enrollment of this session in status=CONFIRMED, evaluate attendance_status from CheckIn rows; if attendance_status in {PRESENT, PARTIAL} set enrollment.status=COMPLETED, else NO_SHOW. Setting enrollment.status=COMPLETED triggers credit_award_calc which writes Enrollment.final_credit, which in turn triggers credit_pool_accumulation_calc recomputing the matching CreditPool.accumulated_credits."
          - "Instructor.avg_evaluation_score recomputed from EvaluationSurvey rows on completed enrollments"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /training/sessions/{id}/cancel"
        actor: TrainingAdmin
        preconditions:
          - "session.status IN {SCHEDULED, ENROLLMENT_OPEN, ENROLLMENT_CLOSED}"
        side_effects:
          - "All Enrollment rows for this session with status IN {PENDING_APPROVAL, CONFIRMED, WAITLISTED} transition to CANCELLED."
          - "If now() >= start_at - 48h at the moment of cancellation, set session.cancellation_fee_charged=true (compensating quantity is fee)."
          - "InstructorAvailability blocks for this session are released (cascade)."

      - from: ENROLLMENT_OPEN
        to: CANCELLED
        trigger: "POST /training/sessions/{id}/cancel"
        actor: TrainingAdmin
        preconditions: ["session.status == ENROLLMENT_OPEN"]
        side_effects:
          - "Identical cascade to SCHEDULED→CANCELLED"

      - from: ENROLLMENT_CLOSED
        to: CANCELLED
        trigger: "POST /training/sessions/{id}/cancel"
        actor: TrainingAdmin
        preconditions: ["session.status == ENROLLMENT_CLOSED"]
        side_effects:
          - "Identical cascade"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /training/sessions/{id}/cancel"
        actor: TrainingAdmin
        preconditions: ["session.status == IN_PROGRESS"]
        side_effects:
          - "Same cascade; cancellation_fee_charged=true (always, since IN_PROGRESS means start_at < now())"

  - entity: Enrollment
    initial_state: PENDING_APPROVAL
    terminal_states: [CANCELLED, NO_SHOW, COMPLETED, FAILED]
    transitions:
      - from: PENDING_APPROVAL
        to: CONFIRMED
        trigger: "POST /training/enrollments/{id}/approve OR auto-confirmation when course.is_charged=false AND session has capacity"
        actor: DepartmentManager | system
        preconditions:
          - "session.status == ENROLLMENT_OPEN"
          - "session.enrolled_count < session.capacity"
          - "trainee eligibility passes (job_level, department, prerequisite courses — see validations)"
        side_effects:
          - "Increment session.enrolled_count"
          - "AuditLog row written with subject_kind=ENROLLMENT"

      - from: PENDING_APPROVAL
        to: WAITLISTED
        trigger: "POST /training/enrollments (when session is full) OR system event when approval queue overflows"
        actor: system
        preconditions:
          - "session.enrolled_count == session.capacity"
          - "session.waitlist_count < session.waitlist_capacity"
        side_effects:
          - "Increment session.waitlist_count"
          - "Set enrollment.waitlist_position = session.waitlist_count (1-indexed after increment)"

      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system event when a CONFIRMED enrollment is cancelled, promoting waitlist head (cascade hop)"
        actor: system
        preconditions:
          - "this enrollment has the lowest waitlist_position among WAITLISTED rows for the session"
          - "session.status == ENROLLMENT_OPEN AND now() < session.enrollment_deadline"
        side_effects:
          - "Decrement session.waitlist_count, increment session.enrolled_count"
          - "Shift waitlist_position down by 1 for remaining WAITLISTED rows"

      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /training/enrollments/{id}/reject OR cascade from session.cancel"
        actor: DepartmentManager | system
        preconditions: []
        side_effects:
          - "AuditLog row"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /training/enrollments/{id}/cancel"
        actor: Trainee | DepartmentManager | system
        preconditions:
          - "now() < session.start_at"
        side_effects:
          - "Decrement session.enrolled_count"
          - "If waitlist non-empty AND now() < session.enrollment_deadline, promote head of waitlist (cascade hop into WAITLISTED→CONFIRMED, which itself triggers session.enrolled_count increment)"
          - "AuditLog row"

      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /training/enrollments/{id}/cancel OR cascade from session.cancel"
        actor: Trainee | DepartmentManager | system
        preconditions: []
        side_effects:
          - "Decrement session.waitlist_count"
          - "Shift waitlist_position down by 1 for rows with higher waitlist_position"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "system event during session complete cascade"
        actor: system
        preconditions:
          - "attendance_status IN {PRESENT, PARTIAL}"
        side_effects:
          - "Run credit_award_calc; write Enrollment.final_credit"
          - "Trigger credit_pool_accumulation_calc on the matching CreditPool (cascade depth-3 from session.complete)"
          - "If a CertificateTemplate exists for this course AND template.requires_exam_pass implies ExamAttempt.passed=true AND template.requires_attendance implies attendance_status=PRESENT, issue Certificate (status=VALID, expires_at = now() + validity_months)"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system event during session complete cascade"
        actor: system
        preconditions:
          - "attendance_status == ABSENT (no CheckIn rows OR explicit absence)"
        side_effects:
          - "final_credit stays at 0"

      - from: CONFIRMED
        to: FAILED
        trigger: "system event during session complete cascade"
        actor: system
        preconditions:
          - "attendance_status IN {PRESENT, PARTIAL} AND ExamAttempt.passed = false"
        side_effects:
          - "final_credit = credit_award_calc.variants.final output for failed exam path (= provisional_credit, not the full credit_value)"
          - "Trigger credit_pool_accumulation_calc"

  - entity: Certificate
    initial_state: VALID
    terminal_states: [REVOKED, RENEWED]
    transitions:
      - from: VALID
        to: EXPIRING_SOON
        trigger: "system event from sweep when expires_at - now() <= certificate_template.renewal_window_days"
        actor: system
        preconditions: ["status == VALID", "expires_at - now() <= renewal_window_days"]
        side_effects:
          - "Emit reminder SyncEvent (event_type='cert.expiring_soon', source_system=IM)"

      - from: EXPIRING_SOON
        to: EXPIRED
        trigger: "system event from sweep when now() >= expires_at"
        actor: system
        preconditions: ["now() >= expires_at"]
        side_effects: []

      - from: VALID
        to: EXPIRED
        trigger: "system event from sweep when now() >= expires_at and renewal window was never reached (shouldn't normally happen — defensive transition)"
        actor: system
        preconditions: ["now() >= expires_at"]
        side_effects: []

      - from: EXPIRING_SOON
        to: RENEWED
        trigger: "POST /training/certificates/{id}/renew"
        actor: Trainee
        preconditions:
          - "certificate.status == EXPIRING_SOON"
          - "a new Enrollment for the same course exists with status=COMPLETED and submitted within the renewal window"
        side_effects:
          - "Issue a new Certificate row with new expires_at = old_expires_at + validity_months (NOT now()+validity_months); old certificate stays as RENEWED"

      - from: VALID
        to: REVOKED
        trigger: "POST /training/certificates/{id}/revoke"
        actor: TrainingAdmin
        preconditions: []
        side_effects: []

      - from: EXPIRING_SOON
        to: REVOKED
        trigger: "POST /training/certificates/{id}/revoke"
        actor: TrainingAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two enrollments race when only one seat remains in the session capacity"
    guarantee: "At most one enrollment becomes CONFIRMED; the loser is placed on the waitlist if capacity permits, else rejected"
    error_id: ERR_SESSION_AT_CAPACITY
    http_status: 409
    serialization: "First-writer-wins on session.enrolled_count increment (compare-and-set against session.version)"

  - scenario: "Cancel and complete are issued on the same session simultaneously"
    guarantee: "Exactly one succeeds; the loser sees the new state"
    error_id: ERR_INVALID_SESSION_STATE
    http_status: 409
    serialization: "First-writer-wins on session.status"

  - scenario: "Two waitlist promotions race when one CONFIRMED enrollment is cancelled and an admin manually promotes another"
    guarantee: "At most one waitlist row is promoted to CONFIRMED per freed seat; the loser remains WAITLISTED"
    error_id: ERR_WAITLIST_PROMOTION_RACE
    http_status: 409
    serialization: "First-writer-wins on enrollment.status compare-and-set"

  - scenario: "Two Course publish operations race producing overlapping CourseVersion.version_no"
    guarantee: "Exactly one publish creates a new CourseVersion; the loser is rejected"
    error_id: ERR_COURSE_VERSION_RACE
    http_status: 409
    serialization: "First-writer-wins on course.current_version_no monotonic increment"

  - scenario: "Two CreditAdjustments are applied to the same CreditPool simultaneously"
    guarantee: "Both adjustments succeed serially but the accumulated_credits reflects exactly delta1+delta2 (no lost update)"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on credit_pool.version; loser must retry"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: credit_award_calc
    trigger: "Enrollment transitions to COMPLETED or FAILED during session.complete cascade; also recomputed when ExamAttempt is graded"
    algorithm: weighted_scoring
    formula: |
      # Domain: Enrollment.provisional_credit, Enrollment.final_credit
      # Pin evaluation order: 1) compute provisional_credit at attendance recording;
      # 2) compute final_credit at session.complete; final_credit overwrites provisional_credit.
      # Round step: compute raw float, then round_half_up to 1 decimal place (matches Course.credit_value precision).

      provisional_credit = course.credit_value * ATTENDANCE_FACTOR  # see below
      final_credit = course.credit_value * ATTENDANCE_FACTOR * EXAM_FACTOR

      where:
        ATTENDANCE_FACTOR =
          1.0  if attendance_status == PRESENT
          0.5  if attendance_status == PARTIAL
          0.0  if attendance_status == ABSENT
        EXAM_FACTOR =
          1.0  if ExamAttempt.passed == true
          0.5  if ExamAttempt.passed == false
          0.0  if ExamAttempt missing AND attendance_status != ABSENT  # treated as fail
    input_set: "Enrollment with status IN {CONFIRMED, COMPLETED, FAILED, NO_SHOW}; reads course.credit_value from session.pinned_course_version_id.snapshot.credit_value, NOT from current Course (version-pinning)"
    constants:
      PASS_THRESHOLD: 70
    precision: "1 decimal place, round_half_up"
    variants:
      - name: provisional
        when: "attendance has been recorded but ExamAttempt not yet finalized"
        difference: "Uses only ATTENDANCE_FACTOR; ignores exam outcome. Writes Enrollment.provisional_credit."
      - name: final
        when: "session.complete cascade and ExamAttempt.passed is decided"
        difference: "Multiplies in EXAM_FACTOR. Writes Enrollment.final_credit. For a PARTIAL+failed-exam enrollment, provisional=0.5*credit_value (e.g., 2.0) and final=0.5*0.5*credit_value=0.25*credit_value (e.g., 1.0) — different result."

  - name: instructor_fee_calc
    trigger: "Computed on demand via GET /training/sessions/{id}/instructor-fee; also evaluated on session.complete (forward leg) and on session.cancel (compensating leg)"
    algorithm: tiered_pricing
    formula: |
      # Pin evaluation order:
      # 1) effective_hours = ceil(course.duration_hours * 2) / 2  (round up to nearest half-hour)
      # 2) tier multiplier based on effective_hours:
      #      effective_hours in [0.5, 2.0]  -> 1.00
      #      effective_hours in (2.0, 5.0]  -> 0.95
      #      effective_hours >  5.0          -> 0.90
      # 3) base_fee = round(instructor.hourly_rate * effective_hours * tier_multiplier, 2)  # round AFTER multiply
      # 4) IF instructor.instructor_type == EXTERNAL: total = base_fee + instructor.travel_cost
      #    ELSE: total = 0  (INTERNAL fees are zeroed regardless of hourly_rate)
      # 5) compensating leg: if session.cancellation_fee_charged == true,
      #    the same total is still owed (forward + compensating sum to 0 drift only when
      #    cancellation_fee_charged == false; when true, drift is by design = full fee).
      total = base_fee + travel_cost  (or 0 for internal)
    input_set: "Session.status IN {COMPLETED, CANCELLED} on the forward leg; instructor.hourly_rate and travel_cost as of the session's pinned snapshot (frozen at session creation, not current instructor record)"
    constants:
      TIER_1_MAX: 2.0
      TIER_2_MAX: 5.0
      TIER_1_MULT: 1.00
      TIER_2_MULT: 0.95
      TIER_3_MULT: 0.90
    precision: "2 decimal places, round_half_up; rounding applied AFTER tier multiplier (round-then-add for travel_cost)"
    variants:
      - name: payable_internal
        when: "instructor_type == INTERNAL"
        difference: "total = 0; INTERNAL hours are tracked but not paid out"
      - name: payable_external
        when: "instructor_type == EXTERNAL"
        difference: "total = base_fee + travel_cost"

  - name: exam_score_calc
    trigger: "POST /training/exam-attempts/{id}/submit"
    algorithm: weighted_scoring
    formula: |
      # Pin: round per-question contributions first? NO — sum raw weights then divide,
      # round the FINAL percentage to 2 decimal places (round_half_up). Per-question rounding
      # would change last-cent results.
      total_weight = sum(q.weight for q in questions)
      correct_weight = sum(q.weight for q in questions if q.given_answer == q.correct_answer)
      score = round((correct_weight / total_weight) * 100.0, 2)   # round_half_up
      passed = score >= PASS_THRESHOLD  # boundary: 70.00 passes; 69.99 fails
    input_set: "All questions in ExamAttempt.questions; submission must include answers for every question or ERR_INCOMPLETE_EXAM is returned"
    constants:
      PASS_THRESHOLD: 70
    precision: "2 decimal places, round_half_up at final score; boundary is >=, not >"

  - name: evaluation_aggregate_calc
    trigger: "POST /training/evaluations on creation"
    algorithm: weighted_scoring
    formula: |
      aggregate_score = round(
        W_CONTENT * content_score
        + W_INSTRUCTOR * instructor_score
        + W_LOGISTICS * logistics_score,
        2
      )
    input_set: "Single EvaluationSurvey row inputs"
    constants:
      W_CONTENT: 0.4
      W_INSTRUCTOR: 0.3
      W_LOGISTICS: 0.3
    precision: "2 decimal places, round_half_up"

  - name: credit_pool_accumulation_calc
    trigger: "Recomputed on Enrollment status transition into {COMPLETED, FAILED, NO_SHOW, CANCELLED} and on every CreditAdjustment.create"
    algorithm: aggregation
    formula: |
      # Cascading derived field — depth-3 chain originates here:
      # Enrollment.status transition -> credit_award_calc -> credit_pool_accumulation_calc.
      accumulated_credits =
          SUM( e.final_credit
               FOR e IN Enrollment
               WHERE e.trainee_id == pool.trainee_id
                 AND e.status IN {COMPLETED, FAILED}
                 AND session_of(e).start_at >= pool.cycle_start
                 AND session_of(e).start_at <  pool.cycle_end )
        + SUM( a.delta FOR a IN CreditAdjustment WHERE a.credit_pool_id == pool.id )

      # Tie-break: aggregation is order-independent (commutative addition).
    input_set: "Enrollments whose session.start_at falls within [cycle_start, cycle_end), regardless of when the row was created; CreditAdjustments belonging to this pool"
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: warning_threshold_calc
    trigger: "POST /training/_sweep/run AND on every credit_pool_accumulation_calc execution"
    algorithm: threshold
    formula: |
      # Boundary precision: warning emitted when remaining time fraction <= 0.25 AND
      # accumulated_credits / required_credits < 0.5
      time_fraction_remaining = (pool.cycle_end - now()) / (pool.cycle_end - pool.cycle_start)
      credit_fraction = pool.accumulated_credits / pool.required_credits

      IF time_fraction_remaining <= TIME_TRIGGER  AND  credit_fraction < CREDIT_TRIGGER
        AND pool.shortfall_warning_emitted == false:
          set pool.shortfall_warning_emitted = true
          emit SyncEvent(event_type='credit.shortfall_warning', source_system=IM)
    input_set: "All CreditPool rows; evaluated per row independently"
    constants:
      TIME_TRIGGER: 0.25
      CREDIT_TRIGGER: 0.5
    precision: "fractions to full float precision; comparison is <= for time, < for credit (asymmetric — boundary trap)"

# =============================================================================
# 1.4 Validation Rules Table (priority order)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all except POST /training/certificates/verify/{verification_code}"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every referenced resource id in the URL path exists (validated left to right)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: existence
    check: "Every referenced foreign-key id in the request body resolves to an existing row"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST and PATCH endpoints with body references"

  - priority: 5
    category: state
    check: "Target resource is in the required state for this operation (per state-machine preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "When creating a Session, parent Course.status must be ON_SHELF (cross-entity)"
    error_id: ERR_COURSE_NOT_ON_SHELF
    http_status: 409
    applies_to: "POST /training/sessions"

  - priority: 7
    category: business_safety
    check: "Instructor.status must be ACTIVE (not BLACKLISTED or RETIRED) when assigned to a Session"
    error_id: ERR_INSTRUCTOR_BLACKLISTED
    http_status: 422
    applies_to: "POST /training/sessions, PATCH /training/sessions/{id}"

  - priority: 8
    category: business_safety
    check: "Instructor.expertise_tags must overlap (>=1) with Course.tags"
    error_id: ERR_INSTRUCTOR_EXPERTISE_MISMATCH
    http_status: 422
    applies_to: "POST /training/sessions, PATCH /training/sessions/{id}"

  - priority: 9
    category: business_referential
    check: "Trainee meets eligibility: trainee.job_level >= course.min_job_level (carried in course attribute when applicable; default min=1), trainee.status=ACTIVE, all course.prerequisite_course_ids present in Enrollments of the same trainee with status IN {COMPLETED, FAILED} AND final_credit > 0"
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /training/enrollments"

  - priority: 10
    category: business_temporal
    check: "Session resource non-overlap on Classroom: for the same classroom_id, no other Session (status NOT IN {CANCELLED}) may have a time interval [start_at, end_at + classroom.setup_buffer_minutes) overlapping this candidate. Buffer applied AFTER each session; intervals are half-open."
    error_id: ERR_CLASSROOM_CONFLICT
    http_status: 409
    applies_to: "POST /training/sessions, PATCH /training/sessions/{id}"

  - priority: 11
    category: business_temporal
    check: "Session resource non-overlap on OnlineRoom: aggregate-capacity rule — multiple Sessions may share an OnlineRoom in [start_at, end_at) provided their combined session.capacity at any point in time <= online_room.max_participants. Intervals are half-open. NO setup buffer applied to online rooms."
    error_id: ERR_ONLINE_ROOM_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /training/sessions, PATCH /training/sessions/{id}"

  - priority: 12
    category: business_temporal
    check: "Instructor availability: at least one InstructorAvailability with kind=AVAILABLE fully covers [start_at, end_at); no AVAILABILITY with kind=BLOCKED overlaps it"
    error_id: ERR_INSTRUCTOR_UNAVAILABLE
    http_status: 409
    applies_to: "POST /training/sessions, PATCH /training/sessions/{id}"

  - priority: 13
    category: business_temporal
    check: "POST /training/enrollments: now() must be strictly before session.enrollment_deadline AND session.status == ENROLLMENT_OPEN"
    error_id: ERR_ENROLLMENT_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /training/enrollments"

  - priority: 14
    category: business_constraint
    check: "Session capacity vs waitlist: when enrolled_count == capacity AND waitlist_count == waitlist_capacity, reject"
    error_id: ERR_SESSION_AT_CAPACITY
    http_status: 409
    applies_to: "POST /training/enrollments"

  - priority: 15
    category: business_constraint
    check: "Duplicate enrollment: same trainee cannot have two enrollments on the same Session whose status NOT IN {CANCELLED}"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /training/enrollments"

  - priority: 16
    category: business_constraint
    check: "Course publish requires existence of at least one CertificateTemplate when course.is_charged=true (charged courses must be eligible for certification)"
    error_id: ERR_CERT_TEMPLATE_MISSING
    http_status: 422
    applies_to: "POST /training/courses/{id}/publish"

  - priority: 17
    category: business_constraint
    check: "Course.prerequisite_course_ids must not form a cycle through any chain of length <=5"
    error_id: ERR_PREREQUISITE_CYCLE
    http_status: 422
    applies_to: "POST /training/courses, PATCH /training/courses/{id}"

  - priority: 18
    category: business_constraint
    check: "CourseCategory cycle prevention via parent_id (depth limit 4)"
    error_id: ERR_CATEGORY_CYCLE
    http_status: 422
    applies_to: "POST /training/course-categories, PATCH /training/course-categories/{id}"

  - priority: 19
    category: business_constraint
    check: "CheckIn channel/value coherence: channel=QR requires source_value to match a server-issued QR token; channel=IP_RANGE requires source_value to be an IPv4 in CIDR 10.0.0.0/8 OR 192.168.0.0/16; channel=FACE requires source_value to be non-empty image_ref"
    error_id: ERR_CHECKIN_INVALID
    http_status: 422
    applies_to: "POST /training/sessions/{id}/check-ins"

  - priority: 20
    category: business_constraint
    check: "ExamAttempt submission must include given_answer for every question in ExamAttempt.questions"
    error_id: ERR_INCOMPLETE_EXAM
    http_status: 422
    applies_to: "POST /training/exam-attempts/{id}/submit"

  - priority: 21
    category: business_constraint
    check: "Certificate renewal requires source enrollment whose session.start_at falls within (certificate.expires_at - renewal_window_days, certificate.expires_at]"
    error_id: ERR_RENEWAL_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /training/certificates/{id}/renew"

  - priority: 22
    category: business_fiscal
    check: "CreditAdjustment.delta must keep accumulated_credits >= 0 after application"
    error_id: ERR_CREDIT_NEGATIVE
    http_status: 422
    applies_to: "POST /training/credit-adjustments"

  - priority: 23
    category: business_constraint
    check: "Pagination params: limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"

  - priority: 24
    category: business_constraint
    check: "version field, when supplied for OCC, must match the current entity version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # Course Category
  - method: POST
    path: "/training/course-categories"
    description: "Create a course category."
    roles: [TrainingAdmin]
    code: 201
    input: [name, "parent_id?"]
    output: CourseCategory
    side_effects: [recompute depth from parent_id]

  - method: GET
    path: "/training/course-categories"
    description: "List course categories with optional filter by parent_id and tag-driven search."
    roles: [TrainingAdmin, CourseDesigner, DepartmentManager, Trainee]
    code: 200
    input: ["parent_id?", "limit?", "offset?"]
    output: CourseCategory[]
    side_effects: []

  - method: PATCH
    path: "/training/course-categories/{id}"
    description: "Rename a category or reparent it."
    roles: [TrainingAdmin]
    code: 200
    input: ["name?", "parent_id?", "version?"]
    output: CourseCategory
    side_effects: [recompute depth; cycle check]

  # Course
  - method: POST
    path: "/training/courses"
    description: "Create a course in DRAFT."
    roles: [CourseDesigner, TrainingAdmin]
    code: 201
    input: [code, title, category_id, objective, outline, duration_hours, "prerequisite_course_ids?", "tags?", credit_value, "is_charged?"]
    output: Course
    side_effects: [increment CourseCategory.course_count]

  - method: GET
    path: "/training/courses"
    description: "List courses with filters."
    roles: [TrainingAdmin, CourseDesigner, DepartmentManager, Trainee]
    code: 200
    input: ["status?", "category_id?", "tag?", "q?", "limit?", "offset?"]
    output: Course[]
    side_effects: []

  - method: GET
    path: "/training/courses/{id}"
    description: "Fetch course detail with current_version_no."
    roles: [TrainingAdmin, CourseDesigner, DepartmentManager, Trainee]
    code: 200
    input: []
    output: Course
    side_effects: []

  - method: PATCH
    path: "/training/courses/{id}"
    description: "Edit a course; only allowed while status=DRAFT."
    roles: [CourseDesigner, TrainingAdmin]
    code: 200
    input: ["title?", "objective?", "outline?", "duration_hours?", "prerequisite_course_ids?", "tags?", "credit_value?", "is_charged?", "version?"]
    output: Course
    side_effects: []

  - method: POST
    path: "/training/courses/{id}/submit-for-review"
    description: "DRAFT -> PENDING_REVIEW."
    roles: [CourseDesigner]
    code: 200
    input: []
    output: Course
    side_effects: [state transition]

  - method: POST
    path: "/training/courses/{id}/publish"
    description: "PENDING_REVIEW -> ON_SHELF OR OFF_SHELF -> ON_SHELF; creates or republishes CourseVersion."
    roles: [TrainingAdmin]
    code: 200
    input: []
    output: Course
    side_effects: [create CourseVersion, supersede previous, increment current_version_no]

  - method: POST
    path: "/training/courses/{id}/reject"
    description: "PENDING_REVIEW -> DRAFT."
    roles: [TrainingAdmin]
    code: 200
    input: []
    output: Course
    side_effects: []

  - method: POST
    path: "/training/courses/{id}/unpublish"
    description: "ON_SHELF -> OFF_SHELF."
    roles: [TrainingAdmin]
    code: 200
    input: []
    output: Course
    side_effects: []

  - method: POST
    path: "/training/courses/{id}/archive"
    description: "OFF_SHELF -> ARCHIVED."
    roles: [TrainingAdmin]
    code: 200
    input: []
    output: Course
    side_effects: []

  - method: GET
    path: "/training/courses/{id}/versions"
    description: "List versions for a course."
    roles: [TrainingAdmin, CourseDesigner]
    code: 200
    input: []
    output: CourseVersion[]
    side_effects: []

  # Instructor
  - method: POST
    path: "/training/instructors"
    description: "Create an instructor."
    roles: [TrainingAdmin]
    code: 201
    input: [full_name, instructor_type, "expertise_tags?", "qualifications?", "hourly_rate?", "travel_cost?"]
    output: Instructor
    side_effects: []

  - method: GET
    path: "/training/instructors"
    description: "List instructors with filter by tag and status."
    roles: [TrainingAdmin, CourseDesigner]
    code: 200
    input: ["expertise_tag?", "status?", "limit?", "offset?"]
    output: Instructor[]
    side_effects: []

  - method: PATCH
    path: "/training/instructors/{id}"
    description: "Update instructor profile."
    roles: [TrainingAdmin]
    code: 200
    input: ["full_name?", "expertise_tags?", "hourly_rate?", "travel_cost?", "version?"]
    output: Instructor
    side_effects: []

  - method: POST
    path: "/training/instructors/{id}/blacklist"
    description: "Move ACTIVE -> BLACKLISTED."
    roles: [TrainingAdmin]
    code: 200
    input: [blacklist_reason]
    output: Instructor
    side_effects: []

  - method: POST
    path: "/training/instructors/{id}/reinstate"
    description: "BLACKLISTED -> ACTIVE."
    roles: [TrainingAdmin]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  - method: POST
    path: "/training/instructors/{id}/availabilities"
    description: "Declare an availability window."
    roles: [TrainingAdmin]
    code: 201
    input: [start_at, end_at, kind]
    output: InstructorAvailability
    side_effects: []

  # Classroom / OnlineRoom
  - method: POST
    path: "/training/classrooms"
    description: "Create classroom."
    roles: [TrainingAdmin]
    code: 201
    input: [name, capacity, "setup_buffer_minutes?"]
    output: Classroom
    side_effects: []

  - method: POST
    path: "/training/online-rooms"
    description: "Create online room."
    roles: [TrainingAdmin]
    code: 201
    input: [platform, join_url, max_participants]
    output: OnlineRoom
    side_effects: []

  # Session
  - method: POST
    path: "/training/sessions"
    description: "Create a session SCHEDULED state; pins course_version_id."
    roles: [TrainingAdmin]
    code: 201
    input: [course_id, instructor_id, mode, "classroom_id?", "online_room_id?", start_at, end_at, capacity, "waitlist_capacity?", enrollment_deadline]
    output: Session
    side_effects: [pin pinned_course_version_id; conflict checks]

  - method: GET
    path: "/training/sessions"
    description: "List sessions."
    roles: [TrainingAdmin, CourseDesigner, DepartmentManager, Trainee]
    code: 200
    input: ["course_id?", "instructor_id?", "status?", "start_after?", "start_before?", "limit?", "offset?"]
    output: Session[]
    side_effects: []

  - method: GET
    path: "/training/sessions/{id}"
    description: "Fetch session."
    roles: [TrainingAdmin, CourseDesigner, DepartmentManager, Trainee]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: POST
    path: "/training/sessions/{id}/open-enrollment"
    description: "SCHEDULED -> ENROLLMENT_OPEN."
    roles: [TrainingAdmin]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: POST
    path: "/training/sessions/{id}/complete"
    description: "IN_PROGRESS -> COMPLETED; cascades enrollment completion, credit award, certificate issuance."
    roles: [TrainingAdmin]
    code: 200
    input: []
    output: Session
    side_effects: [enrollment.complete cascade, credit_award_calc, credit_pool_accumulation_calc, certificate issuance]

  - method: POST
    path: "/training/sessions/{id}/cancel"
    description: "Cancel session from any non-terminal state."
    roles: [TrainingAdmin]
    code: 200
    input: ["reason?"]
    output: Session
    side_effects: [cascade-cancel enrollments; possibly set cancellation_fee_charged]

  - method: GET
    path: "/training/sessions/{id}/instructor-fee"
    description: "Returns instructor_fee_calc result for the session."
    roles: [TrainingAdmin]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: POST
    path: "/training/sessions/{id}/check-ins"
    description: "Record a multi-channel check-in for an enrolled trainee."
    roles: [Trainee, TrainingAdmin]
    code: 201
    input: [enrollment_id, channel, source_value]
    output: CheckIn
    side_effects: [update enrollment.attendance_status when sampling rule triggers]

  # Enrollment
  - method: POST
    path: "/training/enrollments"
    description: "Self-enroll or assigned-enroll a trainee into a session."
    roles: [Trainee, DepartmentManager]
    code: 201
    input: [session_id, trainee_id, mode]
    output: Enrollment
    side_effects: [eligibility checks, capacity check, may go directly CONFIRMED or PENDING_APPROVAL or WAITLISTED]

  - method: GET
    path: "/training/enrollments"
    description: "List enrollments."
    roles: [TrainingAdmin, DepartmentManager, Trainee]
    code: 200
    input: ["session_id?", "trainee_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/training/enrollments/{id}/approve"
    description: "PENDING_APPROVAL -> CONFIRMED (charged courses)."
    roles: [DepartmentManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: [increment session.enrolled_count]

  - method: POST
    path: "/training/enrollments/{id}/reject"
    description: "PENDING_APPROVAL -> CANCELLED."
    roles: [DepartmentManager]
    code: 200
    input: ["reason?"]
    output: Enrollment
    side_effects: [AuditLog]

  - method: POST
    path: "/training/enrollments/{id}/cancel"
    description: "Cancel a CONFIRMED or WAITLISTED enrollment; promotes waitlist head when applicable."
    roles: [Trainee, DepartmentManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: [decrement counts; waitlist promotion cascade]

  - method: POST
    path: "/training/exam-attempts"
    description: "Create an exam attempt; server composes questions from question-bank."
    roles: [Trainee]
    code: 201
    input: [enrollment_id]
    output: ExamAttempt
    side_effects: []

  - method: POST
    path: "/training/exam-attempts/{id}/submit"
    description: "Submit answers; computes score via exam_score_calc."
    roles: [Trainee]
    code: 200
    input: [answers]
    output: ExamAttempt
    side_effects: [compute score, recompute Enrollment.final_credit when session COMPLETED]

  - method: POST
    path: "/training/evaluations"
    description: "Create EvaluationSurvey."
    roles: [Trainee]
    code: 201
    input: [enrollment_id, content_score, instructor_score, logistics_score]
    output: EvaluationSurvey
    side_effects: [evaluation_aggregate_calc; recompute instructor.avg_evaluation_score]

  # Credit
  - method: POST
    path: "/training/credit-pools"
    description: "Create credit pool for trainee for a cycle."
    roles: [TrainingAdmin]
    code: 201
    input: [trainee_id, cycle_kind, cycle_start, required_credits]
    output: CreditPool
    side_effects: [compute cycle_end]

  - method: GET
    path: "/training/credit-pools"
    description: "List credit pools."
    roles: [TrainingAdmin, DepartmentManager, Trainee]
    code: 200
    input: ["trainee_id?", "cycle_kind?", "limit?", "offset?"]
    output: CreditPool[]
    side_effects: []

  - method: GET
    path: "/training/credit-pools/{id}"
    description: "Fetch credit pool with accumulated_credits."
    roles: [TrainingAdmin, DepartmentManager, Trainee]
    code: 200
    input: []
    output: CreditPool
    side_effects: []

  - method: POST
    path: "/training/credit-adjustments"
    description: "Manual credit grant or revoke."
    roles: [TrainingAdmin]
    code: 201
    input: [credit_pool_id, delta, reason]
    output: CreditAdjustment
    side_effects: [recompute credit_pool_accumulation_calc, AuditLog]

  # Certificate
  - method: POST
    path: "/training/certificate-templates"
    description: "Create certificate template for a course."
    roles: [TrainingAdmin]
    code: 201
    input: [course_id, validity_months, "renewal_window_days?", "requires_attendance?", "requires_exam_pass?"]
    output: CertificateTemplate
    side_effects: []

  - method: GET
    path: "/training/certificates"
    description: "List certificates."
    roles: [TrainingAdmin, DepartmentManager, Trainee]
    code: 200
    input: ["trainee_id?", "status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []

  - method: GET
    path: "/training/certificates/{id}"
    description: "Fetch certificate."
    roles: [TrainingAdmin, DepartmentManager, Trainee]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  - method: POST
    path: "/training/certificates/{id}/renew"
    description: "Renew an EXPIRING_SOON certificate; old becomes RENEWED, new VALID emitted."
    roles: [Trainee]
    code: 201
    input: [source_enrollment_id]
    output: Certificate
    side_effects: [old certificate -> RENEWED; new Certificate row]

  - method: POST
    path: "/training/certificates/{id}/revoke"
    description: "Revoke certificate."
    roles: [TrainingAdmin]
    code: 200
    input: ["reason?"]
    output: Certificate
    side_effects: []

  - method: POST
    path: "/training/certificates/verify/{verification_code}"
    description: "Public verification — returns minimal data; no auth required."
    roles: [public]
    code: 200
    input: []
    output: object
    side_effects: []

  # Trainee
  - method: POST
    path: "/training/trainees"
    description: "Onboard a trainee."
    roles: [TrainingAdmin]
    code: 201
    input: [employee_no, full_name, department, job_level]
    output: Trainee
    side_effects: []

  - method: GET
    path: "/training/trainees/{id}"
    description: "Fetch trainee."
    roles: [TrainingAdmin, DepartmentManager, Trainee]
    code: 200
    input: []
    output: Trainee
    side_effects: []

  # Sync + Audit
  - method: POST
    path: "/training/_events/emit"
    description: "Test driver — emit a SyncEvent (HR/IM/LCP). Required to reach sync-applied state."
    roles: [TrainingAdmin]
    code: 201
    input: [source_system, event_type, payload]
    output: SyncEvent
    side_effects: [apply event; may mutate Trainee on HR employee.updated, etc.]

  - method: GET
    path: "/training/audit-logs"
    description: "Query audit log."
    roles: [TrainingAdmin]
    code: 200
    input: ["subject_kind?", "subject_id?", "action?", "limit?", "offset?"]
    output: AuditLog[]
    side_effects: []

  # Clock + sweep (test drivers)
  - method: POST
    path: "/training/_clock/advance"
    description: "Test driver — set server clock to provided ISO 8601 instant. Required to reach time-gated states (enrollment_deadline, session start_at, certificate expiry)."
    roles: [TrainingAdmin]
    code: 200
    input: [now]
    output: object
    side_effects: []

  - method: POST
    path: "/training/_sweep/run"
    description: "Test driver — runs the periodic sweep: ENROLLMENT_OPEN→ENROLLMENT_CLOSED (deadline passed), ENROLLMENT_CLOSED→IN_PROGRESS (start_at reached), Certificate VALID→EXPIRING_SOON/EXPIRED, warning_threshold_calc on credit pools."
    roles: [TrainingAdmin]
    code: 200
    input: []
    output: object
    side_effects: [bulk state transitions and event emissions]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "missing or empty X-User-ID/X-User-Role headers"

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "role lacks permission for this endpoint"

  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "URL path parameter references non-existent resource"

  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "request body references non-existent foreign-key id"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in required state for this operation"

  - id: ERR_INVALID_SESSION_STATE
    http: 409
    condition: "session state has advanced; concurrent transition lost the race"

  - id: ERR_COURSE_NOT_ON_SHELF
    http: 409
    condition: "attempting to create a Session for a Course whose status != ON_SHELF"

  - id: ERR_INSTRUCTOR_BLACKLISTED
    http: 422
    condition: "instructor.status != ACTIVE"

  - id: ERR_INSTRUCTOR_EXPERTISE_MISMATCH
    http: 422
    condition: "no tag overlap between instructor.expertise_tags and course.tags"

  - id: ERR_INSTRUCTOR_UNAVAILABLE
    http: 409
    condition: "no AVAILABLE window covers session interval, or BLOCKED window overlaps"

  - id: ERR_CLASSROOM_CONFLICT
    http: 409
    condition: "session time overlaps another session on the same classroom (with setup_buffer)"

  - id: ERR_ONLINE_ROOM_CAPACITY_EXCEEDED
    http: 409
    condition: "combined capacity in online room exceeds max_participants during overlap"

  - id: ERR_PREREQUISITE_NOT_MET
    http: 422
    condition: "trainee does not satisfy course prerequisites or job_level/department eligibility"

  - id: ERR_PREREQUISITE_CYCLE
    http: 422
    condition: "course prerequisite_course_ids would form a cycle"

  - id: ERR_CATEGORY_CYCLE
    http: 422
    condition: "course-category parent chain forms a cycle or exceeds depth 4"

  - id: ERR_ENROLLMENT_DEADLINE_PASSED
    http: 409
    condition: "now() >= session.enrollment_deadline at enrollment time"

  - id: ERR_SESSION_AT_CAPACITY
    http: 409
    condition: "session.enrolled_count == capacity AND waitlist_count == waitlist_capacity"

  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "trainee already has a non-CANCELLED enrollment for this session"

  - id: ERR_WAITLIST_PROMOTION_RACE
    http: 409
    condition: "another writer already promoted this waitlist row"

  - id: ERR_COURSE_VERSION_RACE
    http: 409
    condition: "concurrent publish lost version_no compare-and-set"

  - id: ERR_CERT_TEMPLATE_MISSING
    http: 422
    condition: "publishing a charged course without a CertificateTemplate"

  - id: ERR_CHECKIN_INVALID
    http: 422
    condition: "channel/source_value mismatch (QR token invalid, IP not in allowed CIDR, FACE image_ref empty)"

  - id: ERR_INCOMPLETE_EXAM
    http: 422
    condition: "submission missing answers for one or more questions"

  - id: ERR_RENEWAL_WINDOW_INVALID
    http: 422
    condition: "renewal source enrollment not within the renewal window"

  - id: ERR_CREDIT_NEGATIVE
    http: 422
    condition: "CreditAdjustment would drive accumulated_credits negative"

  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit or offset outside allowed ranges"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version field stale on PATCH"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TrainingAdmin
    description: "Operational administrator of the training platform; sets up courses, sessions, classrooms, online rooms, and runs sweeps and test drivers."
    identity: opaque
    exclusive_operations:
      - "POST /training/course-categories"
      - "PATCH /training/course-categories/{id}"
      - "POST /training/courses/{id}/publish"
      - "POST /training/courses/{id}/reject"
      - "POST /training/courses/{id}/unpublish"
      - "POST /training/courses/{id}/archive"
      - "POST /training/instructors"
      - "PATCH /training/instructors/{id}"
      - "POST /training/instructors/{id}/blacklist"
      - "POST /training/instructors/{id}/reinstate"
      - "POST /training/instructors/{id}/availabilities"
      - "POST /training/classrooms"
      - "POST /training/online-rooms"
      - "POST /training/sessions"
      - "POST /training/sessions/{id}/open-enrollment"
      - "POST /training/sessions/{id}/complete"
      - "POST /training/sessions/{id}/cancel"
      - "GET /training/sessions/{id}/instructor-fee"
      - "POST /training/credit-pools"
      - "POST /training/credit-adjustments"
      - "POST /training/certificate-templates"
      - "POST /training/certificates/{id}/revoke"
      - "POST /training/trainees"
      - "POST /training/_events/emit"
      - "GET /training/audit-logs"
      - "POST /training/_clock/advance"
      - "POST /training/_sweep/run"
    shared_operations:
      - "GET /training/* list and detail endpoints"
      - "POST /training/sessions/{id}/check-ins"

  - name: CourseDesigner
    description: "Authors and edits courses; cannot publish."
    identity: opaque
    exclusive_operations:
      - "POST /training/courses"
      - "PATCH /training/courses/{id}"
      - "POST /training/courses/{id}/submit-for-review"
    shared_operations:
      - "GET /training/courses, /training/courses/{id}, /training/courses/{id}/versions"
      - "GET /training/instructors, /training/sessions, /training/course-categories"

  - name: DepartmentManager
    description: "Approves/rejects enrollments for trainees in their department; can place assigned enrollments."
    identity: opaque
    exclusive_operations:
      - "POST /training/enrollments/{id}/approve"
      - "POST /training/enrollments/{id}/reject"
    shared_operations:
      - "POST /training/enrollments  (mode=ASSIGNED)"
      - "POST /training/enrollments/{id}/cancel"
      - "GET /training/enrollments, /training/credit-pools, /training/certificates, /training/sessions"

  - name: Trainee
    description: "End learner. Self-enrolls, checks in, takes exams, submits evaluations, renews certificates."
    identity: entity_backed:Trainee
    exclusive_operations:
      - "POST /training/exam-attempts"
      - "POST /training/exam-attempts/{id}/submit"
      - "POST /training/evaluations"
      - "POST /training/certificates/{id}/renew"
    shared_operations:
      - "POST /training/enrollments  (mode=SELF; trainee_id must equal X-User-ID)"
      - "POST /training/enrollments/{id}/cancel  (only own)"
      - "POST /training/sessions/{id}/check-ins  (only for own enrollment)"
      - "GET /training/courses, /training/sessions, /training/enrollments (filtered to own), /training/credit-pools (filtered to own), /training/certificates (filtered to own), /training/trainees/{id} (only own)"
