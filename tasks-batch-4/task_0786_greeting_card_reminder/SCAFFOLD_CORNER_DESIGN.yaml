        distinguishing_aspect: "GET /orders?account_id=..&limit=1 with two orders returns a one-element array with total_count 2 and has_more true."
        test_recipe:
          setup: ["Account with two draft orders."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "ep1@x.com", display_name: "EP1" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Ep", address_line1: "1 E", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
