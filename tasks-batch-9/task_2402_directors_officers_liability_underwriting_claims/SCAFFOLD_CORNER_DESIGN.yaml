            - call: "POST /dno/submissions/${sub_id}/quotes"
              payload: { expected_submission_version: "${sub_v}", offered_limit_usd: 10000000, offered_retention_usd: 250000, offered_side_c_sublimit_usd: 5000000, quote_valid_until: "2026-08-31T00:00:00Z" }
              as: Underwriter
              captures: { quote_id: "$.data.id" }
            - call: "GET /dno/quotes/${quote_id}/exclusion-terms"
              payload: {}
              as: Underwriter
              captures: { conduct_term_id: "$.data[0].id" }
            - call: "POST /dno/exclusion-terms/${conduct_term_id}/resolve"
              payload: { resolution: "AGREE" }
              as: RiskManager
              as_user_id: "${insured_id}"
            - call: "POST /dno/quotes/${quote_id}/accept"
              payload: {}
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dno/policies/${policy_id}/claims"
              payload: { claim_type: "SECURITIES_CLASS_ACTION", claimant_name: "Ridgeline Pension Trust", claimant_capacity: "THIRD_PARTY", wrongful_act_date: "2026-06-15T00:00:00Z", alleged_damages_usd: 6000000 }
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { claim_id: "$.data.id", claim_v0: "$.data.version" }
            - call: "POST /dno/claims/${claim_id}/coverage-decision"
              payload: { decision: "ACCEPT_WITH_ROR", allocation_method: "RELATIVE_EXPOSURE" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_v1: "$.data.version" }
            - call: "POST /dno/claims/${claim_id}/defense-invoices"
              payload: { law_firm_name: "Beltram & Coe LLP", invoice_reference: "INV-9001", billed_amount_usd: 100000, covered_matter_amount_usd: 100000, uncovered_matter_amount_usd: 0, mixed_matter_amount_usd: 0, insured_person_defendant_count: 2, entity_defendant_count: 1 }
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { invoice_id: "$.data.id" }
          trigger:
            - call: "POST /dno/claims/${claim_id}/settlement-proposals"
              payload: { expected_claim_version: "${claim_v0}", recommended_amount_usd: 1500000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /dno/defense-invoices/${invoice_id}/allocate"
              payload: { expected_claim_version: "${claim_v0}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /dno/defense-invoices/${invoice_id}/allocate"
              payload: { expected_claim_version: "${claim_v1}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /dno/claims/${claim_id}/settlement-proposals"
              payload: { expected_claim_version: "${claim_v1}", recommended_amount_usd: 1500000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "GET /dno/claims/${claim_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_v2: "$.data.version" }
            - call: "POST /dno/claims/${claim_id}/settlement-proposals"
              payload: { expected_claim_version: "${claim_v2}", recommended_amount_usd: 1500000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
          assert:
            - "the proposal carrying the at-notice token ${claim_v0} is 412 ERR_STALE_VERSION — the coverage decision already bumped the claim — and the claim stays COVERAGE_ACCEPTED with no proposal created"
            - "the allocate carrying ${claim_v0} is 412 ERR_STALE_VERSION too, and the invoice is still SUBMITTED with advanced_usd 0 — one refused OCC check leaves the whole waterfall unexecuted"
            - "the allocate carrying the current ${claim_v1} is 200: the invoice becomes ADVANCED with retention_applied_usd == 100000.00 and advanced_usd == 0.00, and the claim becomes DEFENSE_ADVANCING with retention_remaining_usd == 150000.00 and version ${claim_v1} + 1"
            - "the proposal that replays ${claim_v1} is now 412 ERR_STALE_VERSION — the allocation invalidated the token for the sibling write, because both §1.2.1 rules are parented on the same Claim"
            - "the proposal carrying the re-read ${claim_v2} is 201 with data.status == \"RECOMMENDED\", and the claim moves to SETTLEMENT_PENDING at version ${claim_v2} + 1"
            - "the claim's version advanced exactly three times across this instance (notice, coverage decision, allocation, proposal), never on a 412 and never on a read"
      - name: draft_submission_expires_on_the_ops_run_at_its_expiry_instant
        claim_type: scheduled_actions
        grounds:
          - state_machines.Submission.transitions.DRAFT_to_EXPIRED
          - entities.Submission.fields.expires_at
          - endpoints[POST /dno/ops-runs]
        distinguishing_aspect: |
          Submission expiry is not evaluated on read — it happens only when the epoch advancer runs,
          and its threshold is INCLUSIVE (clock >= expires_at). So an ops run one day early reports
          zero expiries and leaves the submission scoreable, while an ops run at exactly
          2026-10-30T00:00:00Z expires it and permanently closes the scoring path.
        test_recipe:
          setup:
            - "One insured with one disclosure package and one DRAFT submission created at 2026-08-01T00:00:00Z, hence expires_at 2026-10-30T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-11-01T00:00:00Z", requested_period_end: "2027-11-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-29T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dno/ops-runs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dno/ops-runs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
            - call: "GET /dno/submissions/${sub_id}"
              payload: {}
              as: Underwriter
          assert:
            - "the ops run at 2026-10-29 reports expired_submission_count == 0 and lapsed_quote_count == 0 — the sweep is one day short of expires_at"
            - "the ops run at exactly 2026-10-30T00:00:00Z reports expired_submission_count == 1 — the threshold is clock >= expires_at, so the boundary instant expires the submission"
            - "the score attempt is 409 ERR_INVALID_SUBMISSION_STATE — EXPIRED is terminal and the scoring trigger is not available from it"
            - "the final read shows status == \"EXPIRED\", risk_score == null, risk_band == null and version == 2 (the create plus the single ops-run write); the failed score did not bump it"
      - name: multi_level_bind_cascade
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Policy.transitions.None_to_INCEPTED
        excluded_because:
          difficulty_instance: transitive_cascade / bind_cascade_policy_parts_insured_capacity
          rationale: "The three-level chain quote -> submission -> policy -> coverage parts -> insured capacity ledger, and its ordering sensitivity, are verified end-to-end by the named §1.8 instance."
      - name: dual_variant_risk_scoring_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.governance_risk_assessment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / risk_score_indicative_vs_underwritten_diverge
          rationale: "Both variants and the delta between them are asserted with pre-computed literals by the named §1.8 instance."
  - section: consistency_model
    instances:
      - name: bind_response_already_reflects_every_derived_field
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /dno/quotes/{id}/accept]
          - calculations.bound_premium_exclusion_adjustment
          - calculations.entity_side_c_capacity
        distinguishing_aspect: |
          The declared consistency model is immediate, so the single most side-effect-heavy call in
          the system — the bind — must return a fully derived Policy in its OWN response body: policy
          number, adjusted gross premium, due date, aggregate ledger and tower posture, with nothing
          deferred to a later ops run or a lazy read. Reading the policy, its coverage parts and the
          grandparent insured immediately afterwards must reproduce the same values byte for byte,
          and the three coverage parts must already exist in their fixed order.
        test_recipe:
          setup:
            - "One BIOTECH insured with one disclosure package and one securities class action, an ELEVATED-scored submission for 10,000,000 / 250,000 / Side C 5,000,000, an OFFERED quote and its mandatory CONDUCT exclusion AGREED at premium_impact_pct 0.00; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
