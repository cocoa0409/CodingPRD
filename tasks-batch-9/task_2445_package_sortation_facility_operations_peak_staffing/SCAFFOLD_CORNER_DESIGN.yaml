      - name: superseded_assignment_contributes_no_lane_capacity
        claim_type: Input Set Filtering
        grounds:
          - calculations.lane_pressure
          - state_machines.ChuteAssignment.ACTIVE_to_SUPERSEDED
          - endpoints.POST_/sortation/chute-assignments
        distinguishing_aspect: "After a supersede the retired row still exists and still names the same chute, but only ACTIVE rows feed assigned_capacity_pph, so the lane stays at 3000 pph instead of double-counting C2 to 4800."
        test_recipe:
          setup:
            - "Center SC1 with chutes C1 (1200 pph) and C2 (1800 pph) and lane L-WEST assigned to both for 06:00-14:00, giving assigned_capacity_pph 3000"
