      - name: credit_overdraw_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_INSUFFICIENT_CREDIT]", "entities.IncentiveAccount.fields.credit_balance_cents"]
        distinguishing_aspect: "apply_credit_cents (3000) exceeding the incentive credit balance (2500) is rejected with ERR_INSUFFICIENT_CREDIT; the permit is not created."
        test_recipe:
          setup: ["TRANSIT patron with incentive account credited 2500 (50 accrued days, 1 block redeemed); OPEN quota-5 allocation"]
