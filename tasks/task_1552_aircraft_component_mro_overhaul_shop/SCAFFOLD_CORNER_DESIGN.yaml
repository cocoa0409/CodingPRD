      - name: pool_selector_lowest_cycles_then_created_at_tiebreak
        claim_type: correct_result
        grounds: [calculations.pool_unit_selector, state_machines.ExchangeAgreement.OPEN_to_FULFILLED]
        distinguishing_aspect: "Deterministic selector: three eligible pool units (cycles 200 / 50 / 50) are drawn in order 50(earliest created_at), 50(later created_at), 200 — never by id; eligibility excludes non-SERVICEABLE and non-IN_POOL units."
        test_recipe:
          setup:
            - "part PN-32-ACT; pool units SN-A (cycles_since_overhaul 200), SN-B (50, created at clock T0), SN-C (50, created at T0+1s); customer with high credit; three exchange agreements opened in order"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
