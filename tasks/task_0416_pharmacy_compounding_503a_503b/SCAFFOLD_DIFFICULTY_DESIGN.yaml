              payload: { facility_id: "${f_id}", component_name: "Naltrexone", lot_number: "N-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/prescriptions"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", patient_name: "Robin Vale", prescriber_npi: "1234567890", units_prescribed: 2, written_utc: "2026-06-01T00:00:00.000Z" }
              as: DispensingPharmacist
              captures: { rx_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "PRESCRIPTION", prescription_id: "${rx_id}" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 2 }
              as: CompoundingPharmacist
              as_user_id: "comp-user-1"
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch_id}", test_type: "POTENCY_ASSAY", measured_value: 100, lower_limit: 90, upper_limit: 110 }
              as: QualityAssurancePharmacist
              captures: { qc1_id: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${qc1_id}/begin"
              payload: {}
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests/${qc1_id}/record"
              payload: { measured_value: 100 }
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch_id}", test_type: "VISUAL_INSPECTION" }
              as: QualityAssurancePharmacist
              captures: { qc2_id: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${qc2_id}/begin"
              payload: {}
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests/${qc2_id}/record"
              payload: { pass: true }
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/quarantine"
              payload: {}
              as: CompoundingPharmacist
            - call: "GET /pharmacy-compounding/compounding-batches/${batch_id}"
              payload: {}
              as: QualityAssurancePharmacist
              captures: { batch_v: $.data.version }
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/release"
              payload: { expected_batch_version: "${batch_v}" }
              as: QualityAssurancePharmacist
              as_user_id: "qa-user-2"
            - call: "GET /pharmacy-compounding/finished-preparations?compounding_batch_id=${batch_id}"
              payload: {}
              as: DispensingPharmacist
              captures: { prep0_id: "$.data[0].id", prep1_id: "$.data[1].id" }
