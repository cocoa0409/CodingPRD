            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-11-04T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings/${b2}/cancel", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { f2: "$.data.cancellation_fee_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-12-03T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings/${b3}/cancel", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { f3: "$.data.cancellation_fee_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-12-04T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings/${b4}/cancel", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { f4: "$.data.cancellation_fee_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-01-02T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings/${b5}/cancel", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { f5: "$.data.cancellation_fee_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-01-03T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings/${b6}/cancel", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { f6: "$.data.cancellation_fee_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-01-25T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings/${b7}/cancel", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { f7: "$.data.cancellation_fee_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-01-26T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings/${b8}/cancel", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { f8: "$.data.cancellation_fee_cents", r8: "$.data.refund_cents", bd8: "$.data.balance_due_cents" } }
          assert: >-
            Every booking priced identically: ${net1} == 558720.
            The ladder, keyed on days_between(logical_now, 2027-02-01T15:00:00Z):
            ${f1} == 55872 at exactly 90 days (0.10 — the `>=` boundary holds),
            ${f2} == 139680 at 89 days (0.25),
            ${f3} == 139680 at exactly 60 days (0.25 boundary),
            ${f4} == 279360 at 59 days (0.50),
            ${f5} == 279360 at exactly 30 days (0.50 boundary),
            ${f6} == 446976 at 29 days (0.80),
            ${f7} == 446976 at exactly 7 days (0.80 boundary),
            ${f8} == 558720 at 6 days (LATE 1.00 — the whole net price).
            Every one of the eight reports ${sv1} == "TIER_SCHEDULE" (the event
            never left SCHEDULED), and because nothing was pre-paid the identity
            degenerates the same way at both ends of the ladder:
            ${r1} == 0 with ${bd1} == 55872 and ${r8} == 0 with
            ${bd8} == 558720.

      - name: component_line_rounding_order_is_covered_by_the_difficulty_suite
        claim_type: precision
        grounds: >-
          calculations.package_component_line_pricing precision
          ("round_half_up per line, applied before summation").
        excluded_because:
          difficulty_instance: component_line_rounding_before_summation_not_after
          rationale: >-
            The §0.5 combinatorial_formula instance already builds a package whose
            four component lines each carry a .5 fractional cent, so the
            round-then-sum total differs from the sum-then-round total, and pins
            both the per-line and the aggregate figures.

      - name: net_price_percentage_base_is_covered_by_the_difficulty_suite
        claim_type: correct_result
        grounds: >-
          calculations.booking_net_price formula (the volume discount is taken
          off the gross, and the commission and guarantee surcharge are both
          percentages of the DISCOUNTED subtotal rather than of the gross or of
          the final net).
        excluded_because:
          difficulty_instance: booking_net_price_percentages_keyed_on_discounted_subtotal_not_net
          rationale: >-
            The §0.5 combinatorial_formula instance already isolates the base of
            every percentage in the chain, including the surcharge tier selection
            on the discounted subtotal, which is a strict superset of anything a
            corner probe would add.

      - name: empty_component_collection_guard_is_covered_by_the_difficulty_suite
        claim_type: input_set_filtering
        grounds: >-
          calculations.package_component_line_pricing input_set (the package's
          PackageComponents) and validations[priority=59]
          ERR_PACKAGE_HAS_NO_COMPONENTS.
        excluded_because:
          difficulty_instance: pricing_package_with_zero_components_hits_empty_collection_guard
          rationale: >-
            The §0.5 boundary_precision_check instance already prices a package
            with zero components, asserts the 422 guard rather than a degenerate
            zero-priced package, and then shows one component is enough to make
            the same call succeed.

      - name: margin_report_variant_divergence_is_covered_by_the_difficulty_suite
        claim_type: variant_divergence
        grounds: >-
          calculations.event_margin_report variants PROVISIONAL and FINAL and
          complexity_profile.complexity_layers "dual_variant_calculation".
        excluded_because:
          difficulty_instance: margin_report_provisional_vs_final_same_event
          rationale: >-
            The §0.5 dual_variant_calc instance already reads both variants of the
            same event in the same state and asserts the full delta on
            revenue_cents, unsold_exposure_cents, net_margin_cents and
            margin_pct. The corner instance above deliberately claims the
            INPUT-SET filters instead, so the two do not overlap.

      - name: cancellation_variant_divergence_is_covered_by_the_difficulty_suite
        claim_type: variant_divergence
        grounds: >-
          calculations.booking_cancellation_settlement variants TIER_SCHEDULE and
          COST_RECOVERY with the selector Event.status.
        excluded_because:
          difficulty_instance: cancellation_fee_tier_schedule_vs_cost_recovery_same_booking_shape
          rationale: >-
            The §0.5 dual_variant_calc instance already cancels two
            identically-shaped bookings under a SCHEDULED and a POSTPONED
            fixture, so both the divergent fee arithmetic and the
            selector-by-event-status claim are covered; the corner instance above
            in this file only walks the TIER_SCHEDULE day boundaries.

  # ===========================================================================
  # §1.9 — validations
  # ===========================================================================
  - section: validations
    instances:

      - name: guaranteed_minimum_may_equal_but_not_exceed_the_contracted_units
        claim_type: violation_to_error
        grounds: >-
          validations[priority=65] ("guaranteed_minimum_units <=
          contracted_units") -> ERR_MINIMUM_EXCEEDS_CONTRACT 422 on
          POST /rights-deals.
        distinguishing_aspect: >-
          The rejected request overshoots by exactly one unit and the accepted one
          sits exactly ON the limit, so a `<` implementation fails the second call
          and a missing rule fails the first. Both calls are otherwise
          byte-identical, which isolates the comparison from every other rule on
          the endpoint.
        test_recipe:
          setup: "Canonical SCHEDULED event, no deals yet."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
          trigger:
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 20, guaranteed_minimum_units: 21, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { e_over: "$.data.error_id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 20, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { ok_id: "$.data.id", ok_min: "$.data.guaranteed_minimum_units", ok_st: "$.data.deal_status" } }
          assert: >-
            The 21-of-20 request answers 422 with
            ${e_over} == "ERR_MINIMUM_EXCEEDS_CONTRACT" and persists nothing.
            The 20-of-20 request answers 201: ${ok_id} is a fresh id,
            ${ok_min} == 20 and ${ok_st} == "DRAFT" — equality is inside the
            rule, not outside it.

      - name: a_recalled_block_frees_its_channel_for_a_replacement_block
        claim_type: cross_entity_validation
        grounds: >-
          validations[priority=66] ("no other AllocationBlock on the same
          rights_deal_id has the same channel with block_state IN {OPEN,
          EXHAUSTED}") -> ERR_DUPLICATE_CHANNEL_BLOCK 409 on
          POST /allocation-blocks; state_machines.AllocationBlock OPEN ->
          RECALLED; endpoints "POST /allocation-blocks/{id}/recall".
        distinguishing_aspect: >-
          The uniqueness test is scoped by state as well as by (deal, channel):
          the second CORPORATE block is refused while the first is OPEN, yet the
          identical third request succeeds once the first has been recalled. An
          implementation using a plain unique index on (rights_deal_id, channel)
          passes the rejection and fails the replacement, and one that ignores
          block_state fails only the replacement.
        test_recipe:
          setup: "Canonical event with a COMMITTED 40-unit deal (guaranteed_minimum 0) and no releases, so every block stays OPEN with allocated_units 0."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 0, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
          trigger:
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 10, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk1: "$.data.id", blk1_st: "$.data.block_state" } }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 25, priority_rank: 2 }, as: CommercialManager, as_user_id: u_pricer, captures: { e_dup: "$.data.error_id" } }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "TRAVEL_PARTNER", target_units: 25, priority_rank: 2 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_tp: "$.data.id" } }
            - { call: "POST /allocation-blocks/${blk1}/recall", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { blk1_st2: "$.data.block_state", blk1_recalled: "$.data.recalled_at" } }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 25, priority_rank: 3 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk3: "$.data.id", blk3_st: "$.data.block_state" } }
          assert: >-
            First CORPORATE block: 201 with ${blk1_st} == "OPEN".
            Second CORPORATE block on the same deal: 409 with
            ${e_dup} == "ERR_DUPLICATE_CHANNEL_BLOCK" — the collision is per
            (deal, channel), not per deal, which the TRAVEL_PARTNER block proves
            by answering 201 with a fresh ${blk_tp}.
            After the recall ${blk1_st2} == "RECALLED" with
            ${blk1_recalled} == "2026-08-01T00:00:00.000Z", and the third
            CORPORATE request — same deal, same channel — now answers 201 with a
            fresh ${blk3} and ${blk3_st} == "OPEN".

      - name: tranche_promises_are_aggregate_tested_against_the_contract
        claim_type: aggregate_validation
        grounds: >-
          validations[priority=67] ("sum of promised_units over this deal's
          tranches with tranche_state IN {PENDING, CONFIRMED, SHORT_CONFIRMED}
          plus the new promised_units is <= RightsDeal.contracted_units") ->
          ERR_TRANCHE_EXCEEDS_CONTRACT 422 on POST /release-tranches.
        distinguishing_aspect: >-
          The rule is a running SUM over siblings, not a per-request bound: a
          16-unit promise is refused after 25 units are already outstanding on a
          40-unit contract even though 16 is far below 40 on its own, and the
          15-unit promise that lands exactly on 40 is accepted. Any
          implementation that only compares the single request against
          contracted_units accepts the 16 and therefore oversubscribes the deal.
        test_recipe:
          setup: "Canonical event with a COMMITTED 40-unit deal (guaranteed_minimum 0)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 0, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
          trigger:
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 25, promised_release_at: "2026-09-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr1: "$.data.id", tr1_st: "$.data.tranche_state" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 16, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { e_sum: "$.data.error_id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 15, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr2: "$.data.id", tr2_units: "$.data.promised_units" } }
            - { call: "GET /release-tranches", payload: { rights_deal_id: "${deal_id}", limit: 10, offset: 0 }, as: RightsManager, as_user_id: u_rights, captures: { l1: "$.data[0].promised_units", l2: "$.data[1].promised_units" } }
          assert: >-
            The 25-unit promise is accepted (${tr1_st} == "PENDING").
            The 16-unit promise answers 422 with
            ${e_sum} == "ERR_TRANCHE_EXCEEDS_CONTRACT", because 25 + 16 > 40 —
            and nothing is persisted, which the final listing proves by returning
            exactly two rows, ${l1} == 25 and ${l2} == 15.
            The 15-unit promise answers 201 with ${tr2_units} == 15, landing the
            running total exactly on the 40-unit contract.

      - name: confirmed_units_must_land_between_one_and_the_promise
        claim_type: violation_to_error
        grounds: >-
          validations[priority=68] ("confirmed_units is between 1 and
          ReleaseTranche.promised_units inclusive") ->
          ERR_CONFIRMED_UNITS_OUT_OF_RANGE 422 on
          POST /release-tranches/{id}/confirm; state_machines.ReleaseTranche
          PENDING -> CONFIRMED (confirmed_units == promised_units) and
          PENDING -> SHORT_CONFIRMED (1 <= confirmed_units < promised_units).
        distinguishing_aspect: >-
          Both inclusive ends of the window are exercised on a live deal: 41
          against a 40-unit promise is refused by one unit, 40 confirms fully,
          and 1 on a sibling tranche short-confirms instead of being treated as a
          degenerate zero. The refusal is deliberately NOT a version problem — the
          call carries a freshly read expected_rights_deal_version, so an
          implementation that lets priority 31 answer first is caught.
        test_recipe:
          setup: "Canonical event with a COMMITTED 80-unit deal (guaranteed_minimum 0) and two 40-unit tranches promised."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 80, guaranteed_minimum_units: 0, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-09-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr1: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr2: "$.data.id" } }
          trigger:
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dv1: "$.data.version" } }
            - { call: "POST /release-tranches/${tr1}/confirm", payload: { confirmed_units: 41, expected_rights_deal_version: "${dv1}" }, as: RightsManager, as_user_id: u_rights, captures: { e_hi: "$.data.error_id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dv2: "$.data.version" } }
            - { call: "POST /release-tranches/${tr1}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${dv2}" }, as: RightsManager, as_user_id: u_rights, captures: { st_full: "$.data.tranche_state", cu_full: "$.data.confirmed_units" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dv3: "$.data.version" } }
            - { call: "POST /release-tranches/${tr2}/confirm", payload: { confirmed_units: 1, expected_rights_deal_version: "${dv3}" }, as: RightsManager, as_user_id: u_rights, captures: { st_short: "$.data.tranche_state", cu_short: "$.data.confirmed_units" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { rel: "$.data.released_units", st: "$.data.deal_status" } }
          assert: >-
            Confirming 41 against a 40-unit promise answers 422 with
            ${e_hi} == "ERR_CONFIRMED_UNITS_OUT_OF_RANGE" (not a 412 — the
            version was fresh) and leaves the tranche PENDING, which the next
            call proves by succeeding: ${cu_full} == 40 and
            ${st_full} == "CONFIRMED".
            The bottom of the window is inclusive too: confirming 1 unit of a
            40-unit promise answers 200 with ${cu_short} == 1 and
            ${st_short} == "SHORT_CONFIRMED".
            The deal then reads ${rel} == 41 with ${st} == "PARTIALLY_RELEASED",
            so only the two accepted confirmations moved released_units.
            The version reads also pin the OCC arithmetic: ${dv2} == ${dv1}
            (the rejected confirm did not touch the deal) while
            ${dv3} == ${dv2} + 1.

      - name: build_zone_code_must_be_one_of_the_events_declared_zones
        claim_type: cross_entity_validation
        grounds: >-
          validations[priority=61] ("zone_code is a member of
          Event.hospitality_zone_codes") -> ERR_ZONE_NOT_AT_VENUE 422 on
          POST /hospitality-builds.
        distinguishing_aspect: >-
          The membership test reaches into the PARENT event's array rather than
          checking a global enum, so the same zone_code is legal on one event and
          illegal on another: ZONE_C is rejected on the canonical two-zone event
          and accepted on a second event that declares it. Both requests are
          otherwise identical, and the rejected one comes first so a leaked
          persistence would show up in the second event's build list.
        test_recipe:
          setup: "Two SCHEDULED events — the canonical one with zones [ZONE_A, ZONE_B] and a second one with zones [ZONE_C]."
          setup_api_calls:
