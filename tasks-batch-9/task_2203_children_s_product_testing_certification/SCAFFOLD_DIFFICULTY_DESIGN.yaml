# =============================================================================
# §1.8 Scaffold Difficulty Design — task 2203 Children's Product Testing &
# Certification. Nine difficulty rules, each with at least two differentiated
# instances. Every setup_api_calls chain starts from an empty database.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_sampling_size_initial_forward_looking_versus_periodic_chronological
        grounds:
          - calculations.sampling_plan_required_sample_size
          - entities.SamplingPlan.fields.units_authorized
          - entities.SamplingPlan.fields.baseline_units_produced
          - endpoints "POST /compliance/products/{product_id}/sampling-plans"
        distinguishing_aspect: "Both variants are fed the SAME volume figure (6000 units): projected_annual_units is 6000 and baseline_units_produced is 6000. The INITIAL variant divides by 2500 and rounds UP then adds a base of 3, giving (3 + ceil(6000/2500)) = 6 per rule; the PERIODIC variant divides by 5000 and rounds DOWN then adds a base of 1, giving (1 + floor(6000/5000)) = 2 per rule. With one required rule and the durable-infant multiplier of 2, the authorizations are 12 and 4 — a delta of exactly 8 sample units from identical inputs. A single-variant implementation, or one that shares a divisor or a rounding direction, cannot produce both numbers."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register one lead-content rule (severity 9, periodic interval 12 months) and one durable-infant crib category with sampling_floor_units 4."
            - "Map the rule onto the category with applicability_condition ALWAYS, effective 2026-01-01."
            - "Register a crib product with projected_annual_units 6000, give it one painted component part, and scope it onto the FULL_PRODUCT_TEST path so required_rule_ids has exactly one member."
            - "Create an INITIAL plan (no baseline) and then a PERIODIC plan with baseline_units_produced 6000."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "LEAD-CONTENT-100"
                hazard_class: "LEAD_CONTENT"
                test_method_code: "CPSC-CH-E1002-08"
                limit_value: 100
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 12
                base_method_fee_cents: 18700
                component_reliance_allowed: true
                severity_weight: 9
              as: ComplianceAdministrator
              captures: { rule_lead_id: "$.data.id" }
            - call: "POST /compliance/product-categories"
              payload:
                category_code: "CRIB-FULL"
                display_name: "Full-size crib"
                durable_infant_product: true
                intended_age_max_months: 24
                sampling_floor_units: 4
              as: ComplianceAdministrator
              captures: { category_id: "$.data.id" }
            - call: "POST /compliance/category-rule-mappings"
              payload:
                category_id: "${category_id}"
                rule_id: "${rule_lead_id}"
                applicability_condition: "ALWAYS"
                effective_from: "2026-01-01T00:00:00Z"
              as: ComplianceAdministrator
            - call: "POST /compliance/suppliers"
              payload: { legal_name: "Northwind Plastics", country_code: "VN", reliance_agreement_state: "ON_FILE" }
              as: ComplianceAdministrator
              captures: { supplier_id: "$.data.id" }
            - call: "POST /compliance/products"
              payload:
                category_id: "${category_id}"
                model_name: "Aurora Crib 200"
                manufacture_site_code: "VN-HCM-04"
                projected_annual_units: 6000
                testing_budget_cents: 2000000
              as: ComplianceAdministrator
              captures: { product_id: "$.data.id" }
            - call: "POST /compliance/products/${product_id}/component-parts"
              payload:
                supplier_id: "${supplier_id}"
                part_name: "Painted side rail"
                material_class: "PAINTED_COATING"
                accessible_to_child: true
                small_part_when_detached: false
              as: ComplianceAdministrator
              captures: { part_painted_id: "$.data.id" }
            - call: "POST /compliance/products/${product_id}/submit-for-certification"
              payload: { evidence_path: "FULL_PRODUCT_TEST" }
              as: TestCoordinator
          trigger:
            - "POST /compliance/products/${product_id}/sampling-plans with plan_type INITIAL as TestCoordinator."
            - "POST /compliance/products/${product_id}/sampling-plans with plan_type PERIODIC and baseline_units_produced 6000 as TestCoordinator."
          assert:
            - "The INITIAL plan responds 201 with units_authorized == 12, units_committed == 0 and units_available == 12."
            - "The PERIODIC plan responds 201 with units_authorized == 4, units_committed == 0 and units_available == 4."
            - "The delta between the two authorizations is exactly 8 sample units even though both were computed from the volume figure 6000."
            - "Both plans report plan_state == \"DRAFT\" and resample_trigger == \"NONE\"."

      - name: dual_variant_corrective_scope_batch_scoped_versus_lot_traceback_diverges
        grounds:
          - calculations.noncompliance_corrective_scope_units
          - entities.NoncomplianceCase.fields.scope_variant
          - entities.NoncomplianceCase.fields.scope_units
          - endpoints "POST /compliance/noncompliance-cases/{case_id}/issue-stop-distribution"
        distinguishing_aspect: "This dual variant lives in the distribution domain, not the sampling domain, and its two branches differ in the CUTOFF INSTANT rather than in a divisor or rounding direction. Two cases on the same product see exactly the same two batches (500 units produced 2026-08-05, 300 units produced 2026-08-12). BATCH_SCOPED takes the failing order's window_start (2026-08-10) as the cutoff and captures 300 units; LOT_TRACEBACK walks back to the last REPORTED_PASS reported_at for the same rule (2026-08-02) and captures 800 units. The delta of 500 units is produced entirely by the variant selection, with identical batch data."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register two rules — lead content (severity 9) and phthalates (severity 7) — plus a durable-infant crib category, and map both rules ALWAYS onto it."
            - "Register an independent laboratory with concurrent_slot_capacity 6, a current undue-influence attestation, and accreditation for both rules."
            - "Register a product with one painted part, scope it onto FULL_PRODUCT_TEST, create and activate an INITIAL sampling plan."
            - "Book, start and pass one test order per rule inside 2026-08-01..2026-08-02, advancing the clock to 2026-08-02 before reporting so both passes carry reported_at 2026-08-02T00:00:00Z. The product reaches EVIDENCE_COMPLETE."
            - "Draft, issue and furnish a certificate for manufacture_date_month 2026-08, then record batch A (500 units, produced 2026-08-05) and batch B (300 units, produced 2026-08-12)."
            - "Book one further order per rule for the window 2026-08-10..2026-08-15, start both, then advance the clock to 2026-08-16 and report both as failing. Two noncompliance cases open, one per rule, over the identical batch set."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "LEAD-CONTENT-100"
                hazard_class: "LEAD_CONTENT"
                test_method_code: "CPSC-CH-E1002-08"
                limit_value: 100
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 12
                base_method_fee_cents: 18700
                component_reliance_allowed: true
                severity_weight: 9
              as: ComplianceAdministrator
              captures: { rule_lead_id: "$.data.id" }
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "PHTHALATE-1000"
                hazard_class: "PHTHALATES"
                test_method_code: "CPSC-CH-C1001-09-4"
                limit_value: 1000
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 12
                base_method_fee_cents: 24000
                component_reliance_allowed: true
                severity_weight: 7
              as: ComplianceAdministrator
              captures: { rule_phthalate_id: "$.data.id" }
            - call: "POST /compliance/product-categories"
              payload:
                category_code: "CRIB-FULL"
                display_name: "Full-size crib"
                durable_infant_product: true
                intended_age_max_months: 24
                sampling_floor_units: 4
              as: ComplianceAdministrator
              captures: { category_id: "$.data.id" }
            - call: "POST /compliance/category-rule-mappings"
              payload:
                category_id: "${category_id}"
                rule_id: "${rule_lead_id}"
                applicability_condition: "ALWAYS"
                effective_from: "2026-01-01T00:00:00Z"
              as: ComplianceAdministrator
            - call: "POST /compliance/category-rule-mappings"
              payload:
                category_id: "${category_id}"
                rule_id: "${rule_phthalate_id}"
                applicability_condition: "ALWAYS"
                effective_from: "2026-01-01T00:00:00Z"
              as: ComplianceAdministrator
            - call: "POST /compliance/suppliers"
              payload: { legal_name: "Northwind Plastics", country_code: "VN", reliance_agreement_state: "ON_FILE" }
              as: ComplianceAdministrator
              captures: { supplier_id: "$.data.id" }
            - call: "POST /compliance/laboratories"
              payload:
                lab_name: "Meridian Test Labs"
                accreditation_body_code: "ILAC-MRA"
                independence_class: "INDEPENDENT"
                concurrent_slot_capacity: 6
              as: ComplianceAdministrator
              captures: { lab_id: "$.data.id" }
            - call: "POST /compliance/laboratories/${lab_id}/independence-attestations"
              payload: { attestation_valid_through: "2027-01-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/laboratories/${lab_id}/accreditations"
              payload:
                rule_id: "${rule_lead_id}"
                valid_from: "2026-01-01T00:00:00Z"
                valid_through: "2027-01-01T00:00:00Z"
                fee_surcharge_basis_points: 0
              as: ComplianceAdministrator
            - call: "POST /compliance/laboratories/${lab_id}/accreditations"
              payload:
                rule_id: "${rule_phthalate_id}"
                valid_from: "2026-01-01T00:00:00Z"
                valid_through: "2027-01-01T00:00:00Z"
                fee_surcharge_basis_points: 0
              as: ComplianceAdministrator
            - call: "POST /compliance/products"
              payload:
                category_id: "${category_id}"
                model_name: "Aurora Crib 200"
                manufacture_site_code: "VN-HCM-04"
                projected_annual_units: 2000
                testing_budget_cents: 5000000
              as: ComplianceAdministrator
              captures: { product_id: "$.data.id" }
            - call: "POST /compliance/products/${product_id}/component-parts"
              payload:
                supplier_id: "${supplier_id}"
                part_name: "Painted side rail"
                material_class: "PAINTED_COATING"
                accessible_to_child: true
                small_part_when_detached: false
              as: ComplianceAdministrator
            - call: "POST /compliance/products/${product_id}/submit-for-certification"
              payload: { evidence_path: "FULL_PRODUCT_TEST" }
              as: TestCoordinator
            - call: "POST /compliance/products/${product_id}/sampling-plans"
              payload: { plan_type: "INITIAL" }
              as: TestCoordinator
              captures: { plan_id: "$.data.id" }
            - call: "POST /compliance/sampling-plans/${plan_id}/activate"
              payload: {}
              as: TestCoordinator
            - call: "POST /compliance/test-orders"
              payload:
                product_id: "${product_id}"
                sampling_plan_id: "${plan_id}"
                laboratory_id: "${lab_id}"
                rule_id: "${rule_lead_id}"
                sample_count: 2
                window_start: "2026-08-01T00:00:00Z"
                window_end: "2026-08-02T00:00:00Z"
              as: TestCoordinator
              captures: { order_lead_pass_id: "$.data.id" }
            - call: "POST /compliance/test-orders"
              payload:
                product_id: "${product_id}"
                sampling_plan_id: "${plan_id}"
                laboratory_id: "${lab_id}"
                rule_id: "${rule_phthalate_id}"
                sample_count: 2
                window_start: "2026-08-01T00:00:00Z"
                window_end: "2026-08-02T00:00:00Z"
              as: TestCoordinator
              captures: { order_phthalate_pass_id: "$.data.id" }
            - call: "POST /compliance/test-orders/${order_lead_pass_id}/start-testing"
              payload: {}
              as: LaboratoryUser
              as_user_id: "lab-user-meridian"
            - call: "POST /compliance/test-orders/${order_phthalate_pass_id}/start-testing"
              payload: {}
              as: LaboratoryUser
              as_user_id: "lab-user-meridian"
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/test-orders/${order_lead_pass_id}/report-result"
              payload: { measured_value: 40 }
              as: LaboratoryUser
              as_user_id: "lab-user-meridian"
            - call: "POST /compliance/test-orders/${order_phthalate_pass_id}/report-result"
              payload: { measured_value: 400 }
              as: LaboratoryUser
              as_user_id: "lab-user-meridian"
            - call: "GET /compliance/products/${product_id}"
              payload: {}
              as: CertificationOfficer
              captures: { product_version_after_pass: "$.data.version" }
            - call: "POST /compliance/products/${product_id}/certificates"
              payload:
                expected_product_version: "${product_version_after_pass}"
                certifier_legal_name: "Aurora Juvenile Products LLC"
                certifier_contact_email: "compliance@aurora-juvenile.example"
                manufacture_place: "Ho Chi Minh City, Vietnam"
                manufacture_date_month: "2026-08"
                testing_place: "Singapore"
              as: CertificationOfficer
              as_user_id: "officer-vale"
              captures: { certificate_id: "$.data.id" }
            - call: "POST /compliance/certificates/${certificate_id}/issue"
              payload: {}
              as: CertificationOfficer
              as_user_id: "officer-vale"
            - call: "POST /compliance/certificates/${certificate_id}/furnish"
              payload: {}
              as: DistributionManager
            - call: "POST /compliance/products/${product_id}/production-batches"
              payload:
                certificate_id: "${certificate_id}"
                batch_code: "AUR200-000501"
                produced_on: "2026-08-05T00:00:00Z"
                quantity: 500
                label_on_product: true
                label_on_packaging: true
                label_batch_code_printed: true
              as: DistributionManager
              captures: { batch_a_id: "$.data.id" }
            - call: "POST /compliance/products/${product_id}/production-batches"
              payload:
                certificate_id: "${certificate_id}"
                batch_code: "AUR200-000502"
                produced_on: "2026-08-12T00:00:00Z"
                quantity: 300
                label_on_product: true
                label_on_packaging: true
                label_batch_code_printed: true
              as: DistributionManager
              captures: { batch_b_id: "$.data.id" }
            - call: "POST /compliance/test-orders"
              payload:
                product_id: "${product_id}"
                sampling_plan_id: "${plan_id}"
                laboratory_id: "${lab_id}"
                rule_id: "${rule_lead_id}"
                sample_count: 2
                window_start: "2026-08-10T00:00:00Z"
                window_end: "2026-08-15T00:00:00Z"
              as: TestCoordinator
              captures: { order_lead_fail_id: "$.data.id" }
            - call: "POST /compliance/test-orders"
              payload:
                product_id: "${product_id}"
                sampling_plan_id: "${plan_id}"
                laboratory_id: "${lab_id}"
                rule_id: "${rule_phthalate_id}"
                sample_count: 2
                window_start: "2026-08-10T00:00:00Z"
                window_end: "2026-08-15T00:00:00Z"
              as: TestCoordinator
              captures: { order_phthalate_fail_id: "$.data.id" }
            - call: "POST /compliance/test-orders/${order_lead_fail_id}/start-testing"
              payload: {}
              as: LaboratoryUser
              as_user_id: "lab-user-meridian"
            - call: "POST /compliance/test-orders/${order_phthalate_fail_id}/start-testing"
              payload: {}
              as: LaboratoryUser
              as_user_id: "lab-user-meridian"
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/test-orders/${order_lead_fail_id}/report-result"
              payload: { measured_value: 250 }
              as: LaboratoryUser
              as_user_id: "lab-user-meridian"
            - call: "POST /compliance/test-orders/${order_phthalate_fail_id}/report-result"
              payload: { measured_value: 3000 }
              as: LaboratoryUser
              as_user_id: "lab-user-meridian"
            - call: "GET /compliance/noncompliance-cases"
              payload: { product_id: "${product_id}", failed_rule_id: "${rule_lead_id}" }
              as: DistributionManager
              captures: { case_lead_id: "$.data[0].id" }
            - call: "GET /compliance/noncompliance-cases"
              payload: { product_id: "${product_id}", failed_rule_id: "${rule_phthalate_id}" }
              as: DistributionManager
              captures: { case_phthalate_id: "$.data[0].id" }
          trigger:
            - "POST /compliance/noncompliance-cases/${case_lead_id}/issue-stop-distribution with scope_variant BATCH_SCOPED as DistributionManager."
            - "POST /compliance/noncompliance-cases/${case_phthalate_id}/issue-stop-distribution with scope_variant LOT_TRACEBACK as DistributionManager."
          assert:
            - "The BATCH_SCOPED case responds 200 with scope_variant == \"BATCH_SCOPED\", case_state == \"STOP_DISTRIBUTION_ISSUED\" and scope_units == 300, because its cutoff is the failing order's window_start 2026-08-10T00:00:00Z and only batch AUR200-000502 (produced 2026-08-12, 300 units) is at or after it."
            - "The LOT_TRACEBACK case responds 200 with scope_variant == \"LOT_TRACEBACK\" and scope_units == 800, because its cutoff is the last REPORTED_PASS reported_at for the phthalate rule, 2026-08-02T00:00:00Z, so both AUR200-000501 (500) and AUR200-000502 (300) are in scope."
            - "The two scope_units values differ by exactly 500 units although both cases were computed over the same two ProductionBatch rows."
            - "Neither call changed any ProductionBatch row: both batches remain distribution_state == \"STOP_DISTRIBUTION\" from the failing-result cascade, and Product.units_stopped == 800 for the whole exercise."

  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_mode_b_pinned_rounding_order_per_sample_before_multiplication
        grounds:
          - calculations.lab_test_line_fee_cents
          - entities.LabAccreditation.fields.fee_surcharge_basis_points
          - entities.Laboratory.fields.independence_class
          - entities.TestOrder.fields.line_fee_cents
        distinguishing_aspect: "Mode (b) — a PINNED ROUNDING ORDER. The base method fee 18700 cents, a 750-basis-point accreditation surcharge and the INDEPENDENT multiplier 1.00 give an exact per-sample amount of 20102.5 cents. Rounding half-up at the per-sample step first gives 20103, and 20103 x 3 samples = 60309. The plausible alternative order — multiply the exact per-sample amount by 3 and round the product — gives round_half_up(60307.5) = 60308. The scaffold pins the first order, so 60309 is the only correct answer and a one-cent discrepancy exposes the wrong order. Nothing about tier selection or a dependency chain is involved here; it is purely where the rounding boundary sits."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register a lead-content rule whose base_method_fee_cents is exactly 18700 so that the surcharge lands on a half-cent."
            - "Register a non-durable category with sampling_floor_units 1 and map the rule ALWAYS onto it."
            - "Register an INDEPENDENT laboratory (multiplier 1.00) with a current undue-influence attestation and an accreditation carrying fee_surcharge_basis_points 750."
            - "Register a product with projected_annual_units 2000, add one painted part, scope it onto FULL_PRODUCT_TEST, then create and activate an INITIAL plan whose units_authorized is 4."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "LEAD-CONTENT-100"
                hazard_class: "LEAD_CONTENT"
                test_method_code: "CPSC-CH-E1002-08"
                limit_value: 100
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 12
                base_method_fee_cents: 18700
                component_reliance_allowed: true
                severity_weight: 9
              as: ComplianceAdministrator
              captures: { rule_lead_id: "$.data.id" }
            - call: "POST /compliance/product-categories"
              payload:
                category_code: "TOY-RIDEON"
                display_name: "Ride-on toy"
                durable_infant_product: false
                intended_age_max_months: 48
                sampling_floor_units: 1
              as: ComplianceAdministrator
              captures: { category_id: "$.data.id" }
            - call: "POST /compliance/category-rule-mappings"
              payload:
                category_id: "${category_id}"
                rule_id: "${rule_lead_id}"
                applicability_condition: "ALWAYS"
                effective_from: "2026-01-01T00:00:00Z"
              as: ComplianceAdministrator
            - call: "POST /compliance/suppliers"
              payload: { legal_name: "Northwind Plastics", country_code: "VN", reliance_agreement_state: "ON_FILE" }
              as: ComplianceAdministrator
              captures: { supplier_id: "$.data.id" }
            - call: "POST /compliance/laboratories"
              payload:
                lab_name: "Meridian Test Labs"
                accreditation_body_code: "ILAC-MRA"
                independence_class: "INDEPENDENT"
                concurrent_slot_capacity: 4
              as: ComplianceAdministrator
              captures: { lab_id: "$.data.id" }
            - call: "POST /compliance/laboratories/${lab_id}/independence-attestations"
              payload: { attestation_valid_through: "2027-01-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/laboratories/${lab_id}/accreditations"
              payload:
                rule_id: "${rule_lead_id}"
                valid_from: "2026-01-01T00:00:00Z"
                valid_through: "2027-01-01T00:00:00Z"
                fee_surcharge_basis_points: 750
              as: ComplianceAdministrator
            - call: "POST /compliance/products"
              payload:
                category_id: "${category_id}"
                model_name: "Rover Ride-On 90"
                manufacture_site_code: "VN-HCM-04"
                projected_annual_units: 2000
                testing_budget_cents: 2000000
              as: ComplianceAdministrator
              captures: { product_id: "$.data.id" }
            - call: "POST /compliance/products/${product_id}/component-parts"
              payload:
                supplier_id: "${supplier_id}"
                part_name: "Painted body shell"
                material_class: "PAINTED_COATING"
                accessible_to_child: true
                small_part_when_detached: false
              as: ComplianceAdministrator
            - call: "POST /compliance/products/${product_id}/submit-for-certification"
              payload: { evidence_path: "FULL_PRODUCT_TEST" }
              as: TestCoordinator
            - call: "POST /compliance/products/${product_id}/sampling-plans"
              payload: { plan_type: "INITIAL" }
              as: TestCoordinator
              captures: { plan_id: "$.data.id", plan_units_authorized: "$.data.units_authorized" }
            - call: "POST /compliance/sampling-plans/${plan_id}/activate"
              payload: {}
              as: TestCoordinator
          trigger:
            - "POST /compliance/test-orders with sample_count 3, window 2026-08-10T00:00:00Z..2026-08-20T00:00:00Z and expedite_requested false, as TestCoordinator."
          assert:
            - "The response is 201 with line_fee_cents == 60309 (per_sample_cents 20103 multiplied by sample_count 3)."
            - "line_fee_cents is NOT 60308, which is what rounding the product 18700 * 1.075 * 3 = 60307.5 would give."
            - "invoice_total_cents == 60309, because expedite_requested is false and the product's evidence_path is FULL_PRODUCT_TEST so both the expedite fee and the reliance discount are 0."
            - "SamplingPlan.units_authorized == 4, units_committed == 3 and units_available == 1 after the booking."
            - "Laboratory.billed_fee_cents_total == 60309 and Laboratory.credited_fee_cents_total == 0."

      - name: combinatorial_mode_c_pinned_evaluation_order_expedite_tier_before_reliance_discount
        grounds:
          - calculations.test_order_invoice_total_cents
          - calculations.lab_test_line_fee_cents
          - entities.TestOrder.fields.invoice_total_cents
          - entities.Product.fields.evidence_path
