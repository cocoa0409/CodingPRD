            - "The error_ids are, in order: ERR_AGREEMENT_NOT_FOUND, ERR_PILOT_NOT_FOUND, ERR_SCHEDULE_CYCLE_NOT_FOUND, ERR_FLIGHT_LEG_NOT_FOUND, ERR_CANCELLATION_CLAIM_NOT_FOUND, ERR_PASSTHROUGH_CLAIM_NOT_FOUND, ERR_SCORECARD_NOT_FOUND, ERR_BRAND_AUDIT_NOT_FOUND, ERR_NEGOTIATION_NOT_FOUND"
