          assert:
            - "TrademarkEvidencePackage.${pkg_id}.status == CERTIFIED"
            - "TrademarkEvidencePackage.${pkg_id}.max_gap_years == 3"
            - "TrademarkEvidencePackage.${pkg_id}.continuous_use_coverage_pct == 33.33"
            - "AppraisalRecord.${apprA_id}.final_score == 70.00"
            - "AppraisalRecord.${apprA_id}.brand_heritage_counted == true"
            - "AppraisalRecord.${apprA_id}.recommended_disposition == PERMANENT"
            - "RecordSeries.${seriesA_id}.disposition_state == PERMANENT"
            - "RecordSeries.${seriesA_id}.current_appraisal_id == ${apprA_id}"
            - "AppraisalRecord.${apprB_id}.screening_score == 70.00"
            - "AppraisalRecord.${apprB_id}.final_score == 58.00"
            - "AppraisalRecord.${apprB_id}.brand_heritage_counted == false"
            - "AppraisalRecord.${apprB_id}.recommended_disposition == REVIEW"
            - "RecordSeries.${seriesB_id}.disposition_state == ELIGIBLE_FOR_DISPOSITION"

      - name: trademark_certify_rejects_zero_qualifying_evidence_then_accepts_one
        grounds:
          - calculations.continuous_use_coverage
          - validations[priority=47]
          - errors.ERR_NO_QUALIFYING_EVIDENCE
          - state_machines.TrademarkEvidencePackage.DRAFT_to_CERTIFIED
          - entities.TrademarkEvidencePackage.fields.qualifying_evidence_count
        distinguishing_aspect: |
          Metric: qualifying_evidence_count at the 0 / 1 boundary, on the DIFFERENT
          endpoint POST /trademark-evidence-packages/{id}/certify. The rejected package
          is not empty — it names a real ArchivalItem whose brand_use_year is null — so
          an implementation that merely counts evidence_item_ids passes 1 element
          through into gap arithmetic and divides against a coverage span. At exactly one
          qualifying item the same endpoint must certify (single year 2026 in span
          [2026, 2026]: covered 1, span 1, max_gap 0, coverage 100.00).
        test_recipe:
          setup:
            - "A processed Accession under one RecordSeries holding two ArchivalItems: item-N with brand_use_year omitted (null) and item-Y with brand_use_year 2026."
            - "Package P1 (DRAFT) with claimed_first_use_year 2026 and evidence_item_ids [item-N] -> exactly zero qualifying items."
            - "Package P2 (DRAFT) with claimed_first_use_year 2026 and evidence_item_ids [item-N, item-Y] -> exactly one qualifying item."
