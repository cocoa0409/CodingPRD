          assert:
            - "NavRecord.${nav2_id}.gross_asset_value == 200000.00 (price doubled)"
            - "NavRecord.${nav2_id}.expense_accrual_total == 0.27 — base is the prior FINAL TNA 99999.73, NOT the current GAV 200000.00"
            - "NavRecord.${nav2_id}.total_net_assets == 199999.73 and nav_per_share == 20.0000"

      - name: price_selection_latest_created_at_wins_tie
        claim_type: constants_applied
        grounds: [calculations.security_price_selection]
        distinguishing_aspect: "Selector determinism: two APPROVED LEVEL_1 observations for the same security/date (different sources) tie on level; the later created_at wins — never the id."
        test_recipe:
          setup: ["Base kit; EXCHANGE_CLOSE 100.00 created and approved at clock T+0; PRICING_SERVICE (declared LEVEL_1) 101.00 created and approved one minute later"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_a: "$.data.id" } }
            - { call: "POST /price-observations/${px_a}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:01:00Z" }, as: FundController }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 101.00, source: "PRICING_SERVICE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_b: "$.data.id" } }
