# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth walk of §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ==================================================== entities
  - section: entities
    instances:
      - name: create_cycle_success_initial_state
        claim_type: creation
        grounds: [entities.AdmissionCycle, state_machines.AdmissionCycle]
        distinguishing_aspect: "POST /enrollment/cycles with all required fields -> 201; status SETUP; all computed counts 0; version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
          assert:
            - "Response 201; data.status == SETUP; inquiry_count == application_count == admitted_count == deposited_count == enrolled_count == decisioned_count == 0; admit_rate == 0; version == 1"

      - name: create_cycle_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.AdmissionCycle.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field name -> ERR_INVALID_REQUEST (400); no cycle persisted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /enrollment/cycles"
              payload: { application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: program_default_auto_waitlist_flag_false
        claim_type: defaults
        grounds: [entities.Program.fields.auto_waitlist_activation]
        distinguishing_aspect: "Omitting auto_waitlist_activation on program create -> defaults to false in the response."
        test_recipe:
          setup: ["Cycle exists"]
          setup_api_calls:
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "DEF", capacity_seats: 4, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 1000000, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_auto: $.data.auto_waitlist_activation }
          assert:
            - "${p_auto} == false"
            - "seats_open == 4; scholarship_available_cents == 1000000; intake_posture == OPEN"

      - name: program_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Program.fields.scholarship_committed_cents, entities.Program.fields.seats_open]
        distinguishing_aspect: "Client-supplied values for computed fields (scholarship_committed_cents, seats_open) are ignored; server returns computed 0 / capacity."
        test_recipe:
          setup: ["Cycle exists"]
          setup_api_calls:
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "IGN", capacity_seats: 4, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 1000000, deposit_amount_cents: 50000, scholarship_committed_cents: 999999, seats_open: 0 }
              as: EnrollmentManager
              captures: { p_committed: $.data.scholarship_committed_cents, p_seats: $.data.seats_open }
          assert:
            - "${p_committed} == 0 (client 999999 ignored)"
            - "${p_seats} == 4 (client 0 ignored; computed = capacity_seats)"

      - name: applicant_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Applicant]
        distinguishing_aspect: "Client-supplied id and version are ignored; server mints a UUID id and sets version 1."
        test_recipe:
          setup: ["Cycle exists"]
          setup_api_calls:
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "Sys F", email: "sysf@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL", id: "11111111-1111-4111-8111-111111111111", version: 42 }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id, ap_v: $.data.version }
          assert:
            - "${ap_id} != 11111111-1111-4111-8111-111111111111 (server-minted UUID)"
            - "${ap_v} == 1 (client 42 ignored)"

      - name: get_application_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent application UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /enrollment/applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: application_bad_program_fk_not_found
        claim_type: parent_relationships
        grounds: [entities.Application.fields.program_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /enrollment/applications referencing a nonexistent program_id -> ERR_NOT_FOUND (404) even when applicant and cycle exist."
        test_recipe:
          setup: ["Cycle OPEN; one applicant"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "FKP", capacity_seats: 4, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "FK A", email: "fka@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "00000000-0000-4000-8000-000000000000", cycle_id: "${c_id}", academic_score: 80, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: list_applications_pagination
        claim_type: listing
        grounds: [entities.Application, response_envelope]
        distinguishing_aspect: "GET /enrollment/applications with limit=2 over 3 rows -> 2 items, total_count 3, has_more true; offset=2 -> 1 item, has_more false."
        test_recipe:
          setup: ["Cycle OPEN; three applicants each with one application"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "PAG", capacity_seats: 9, target_enrollment: 5, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "PG 1", email: "pg1@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { pg1: $.data.id }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "PG 2", email: "pg2@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { pg2: $.data.id }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "PG 3", email: "pg3@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { pg3: $.data.id }
            - { call: "POST /enrollment/applications", payload: { applicant_id: "${pg1}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 80, efc_cents: 5000000 }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications", payload: { applicant_id: "${pg2}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 81, efc_cents: 5000000 }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications", payload: { applicant_id: "${pg3}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 82, efc_cents: 5000000 }, as: AdmissionsOfficer }
          trigger:
            - call: "GET /enrollment/applications?limit=2"
              payload: {}
              as: AdmissionsOfficer
            - call: "GET /enrollment/applications?limit=2&offset=2"
              payload: {}
              as: AdmissionsOfficer
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page 2 (offset=2): 1 item, total_count == 3, has_more == false"
            - "Filter program_id=${p_id} returns the same total_count == 3"

      - name: create_applicant_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Applicant.fields.applicant_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "applicant_type 'GRAD' is not a declared enum member -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Cycle exists"]
          setup_api_calls:
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "Bad Enum", email: "be@x.com", applicant_type: "GRAD", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: application_score_out_of_range_rejected
        claim_type: type_constraints
        grounds: [entities.Application.fields.academic_score, "errors[ERR_SCORE_OUT_OF_RANGE]"]
        distinguishing_aspect: "academic_score 120 (> 100) on application create -> ERR_SCORE_OUT_OF_RANGE (422)."
        test_recipe:
          setup: ["Cycle OPEN; one applicant"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "RNG", capacity_seats: 4, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "Rng A", email: "rng@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 120, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SCORE_OUT_OF_RANGE, http 422"

  # ==================================================== state_machines
  - section: state_machines
    instances:
      - name: application_skip_to_admitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Application, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SUBMITTED -> ADMITTED skips the review pipeline -> ERR_INVALID_STATE; application remains SUBMITTED."
        test_recipe:
          setup: ["Cycle OPEN; one SUBMITTED application"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "SKP", capacity_seats: 4, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "Skip A", email: "skip@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 80, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /enrollment/applications/${app_id}/transition"
              payload: { to_status: "ADMITTED" }
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "Application remains SUBMITTED"

      - name: committee_review_submit_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.CommitteeReview.ASSIGNED_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED review a second time -> ERR_INVALID_STATE (terminal lockdown); submitted_read_count stays 1."
        test_recipe:
          setup: ["Cycle OPEN; application in COMMITTEE_REVIEW with one SUBMITTED review"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "IDM", capacity_seats: 4, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "Idem A", email: "idem@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 80, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r_id}/submit", payload: { score_academic: 80, score_fit: 80, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
          trigger:
            - call: "POST /enrollment/reviews/${r_id}/submit"
              payload: { score_academic: 99, score_fit: 99, recommendation: "DENY" }
              as: ApplicationReader
              as_user_id: "reader-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "Review still holds the first submission (score_academic 80, recommendation ADMIT); application.submitted_read_count == 1"

      - name: waitlist_entry_created_by_waitlist_decision
        claim_type: side_effect_execution
        grounds: [state_machines.Application.DECISION_PENDING_to_WAITLISTED, entities.WaitlistEntry]
        distinguishing_aspect: "DECISION_PENDING -> WAITLISTED creates exactly one ACTIVE WaitlistEntry with program_id copied from the application and rank_score computed from SUBMITTED reads only."
        test_recipe:
          setup: ["Cycle OPEN; application in DECISION_PENDING with 2 ADMIT reads, score 80"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "WLE", capacity_seats: 4, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "Wl A", email: "wl@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 80, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r1: $.data.id }
            - { call: "POST /enrollment/reviews/${r1}/submit", payload: { score_academic: 80, score_fit: 80, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r2: $.data.id }
            - { call: "POST /enrollment/reviews/${r2}/submit", payload: { score_academic: 80, score_fit: 80, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
          trigger:
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "WAITLISTED" }, as: AdmissionsOfficer }
            - call: "GET /enrollment/waitlist-entries?application_id=${app_id}"
              payload: {}
              as: AdmissionsOfficer
