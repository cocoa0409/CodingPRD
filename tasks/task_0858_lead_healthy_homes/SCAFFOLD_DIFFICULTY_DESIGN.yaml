            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/relocation-units"
              payload: { address: "200 Motel Way", bedroom_count: 2 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { u_id: $.data.id }
            - call: "POST /api/v1/relocation-placements"
              payload: { case_id: "${case_id}", relocation_unit_id: "${u_id}", start_date: "2026-06-01", end_date: "2026-06-05", occupant_count: 2 }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { plc1_id: $.data.id }
          trigger:
            - call: "POST /api/v1/relocation-placements"
              payload: { case_id: "${case_id}", relocation_unit_id: "${u_id}", start_date: "2026-06-07", end_date: "2026-06-10", occupant_count: 2 }
              as: CaseManager
              as_user_id: "cm-1"
            - call: "POST /api/v1/relocation-placements"
              payload: { case_id: "${case_id}", relocation_unit_id: "${u_id}", start_date: "2026-06-20", end_date: "2026-06-25", occupant_count: 2 }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { plc3_id: $.data.id }
          assert:
            - "The 06-07..06-10 placement (gap 2 days < buffer 3) fails with error_id == ERR_RELOCATION_OVERLAP and HTTP 409"
            - "The 06-20..06-25 placement (gap 15 days) returns 201 with RelocationPlacement.${plc3_id}.status == ACTIVE"

  # =========================================================================
  # RULE 9 — compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grant_money_conservation_on_approve_then_cancel
        grounds:
          - state_machines.RemediationProject.APPROVED_to_CANCELLED
          - calculations.grant_ledger
          - entities.GrantFund.fields.available_cents
          - entities.GrantFund.fields.reserved_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (available_cents): approving a project
          reserves 625000 (available 5000000 -> 4375000); cancelling it releases
          exactly 625000 so reserved_cents returns to 0 and available_cents
          returns to 5000000 (no drift).
        test_recipe:
          setup:
            - "A 2-hazard ISSUED order; contractor ACTIVE; grant total 5000000; project APPROVED (reserved 625000, available 4375000)."
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
