        distinguishing_aspect: "The first request is SUBMITTED - a non-terminal status - so a second request of the same account sharing one E.164 string is refused with ERR_ACTIVE_PORT_REQUEST_EXISTS (409); a request over a disjoint number set is accepted in the same state."
        test_recipe:
          setup:
