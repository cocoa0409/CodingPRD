      - a nomination of 2026-09-29..2026-10-10 (one overlapping day) is rejected with ERR_INTERVAL_OVERLAP
- rule_id: compensating_invariant
  instances:
  - name: claim_resolution_chargeback_commission_invariant
    grounds:
    - calculations.resolution_chargeback
    - calculations.commission_split_invariant
    - state_machines.Claim.PAID_to_OPEN
    - validations[priority=4]
    distinguishing_aspect: "The conserved quantity is the sub-producer released commission: after a resolve-driven chargeback the released amount plus the house remainder always re-sum to the house half (60000.00), so the payout conserved quantity is drift-free."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. A settled claim whose resolution chargeback drives the released ledger; split_base_cents pinned at 120,000.00 so house_half == 60000.00."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-009
          name: Cali Nine
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
        captures:
          cali_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal Nine Keeper
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P9
          product_line: AUTO
          annual_premium_cents: 800000
          is_new_business: false
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
        captures:
          p9: $.data.id
      - call: POST /agency-network/claims
        payload:
          policy_id: ${p9}
          claim_amount_cents: 40000
        as: ClaimsAdjuster
        captures:
          cl9: $.data.id
      - call: POST /agency-network/claims/${cl9}/settle
        payload: {}
        as: ClaimsAdjuster
      trigger:
      - call: POST /agency-network/claims/${cl9}/resolve
        payload: {}
        as: ClaimsAdjuster
        captures:
          st: $.data.status
      - call: GET /agency-network/claims/${cl9}
        payload: {}
        as: ClaimsAdjuster
        captures:
          paid: $.data.policy_paid_cents
      assert:
      - Claim.${cl9}.status == OPEN after resolve (the compensating action ran)
      - released_to_subproducer_cents + house_remaining_cents == 60000.00 (the conserved house half) with released 12000.00 and remainder 48000.00
      - the released ledger never falls below 0.00 after the 40000.00 chargeback floor is applied
  - name: book_transfer_settlement_invariant
    grounds:
    - calculations.book_transfer_settlement
    - state_machines.Policy.OPEN_to_OPEN
    - calculations.recompute_agency
    - endpoints.POST_/agency-network/agents/{id}/book-transfer
    distinguishing_aspect: "The conserved quantity is transferred policy exposure: after a book transfer the sum of OPEN policy annual_premium_cents across the from- and to-agencies is unchanged, so the reassignment conserves the named exposure quantity."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Three agencies with one OPEN policy each, all AUTO, total exposure 150,000 cents; a book transfer moves the ceasing book."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: R-01
          name: From Agency
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          from_id: $.data.id
          from_v0: $.data.version
      - call: POST /agency-network/agencies/${from_id}/activate
        payload:
          expected_agency_version: ${from_v0}
        as: AppointingExecutive
        captures:
          from_v1: $.data.version
      - call: POST /agency-network/agencies
        payload:
          agency_code: R-02
          name: To Agency
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          to_id: $.data.id
          to_v0: $.data.version
      - call: POST /agency-network/agencies/${to_id}/activate
        payload:
          expected_agency_version: ${to_v0}
        as: AppointingExecutive
        captures:
          to_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: From Keeper
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          fk_id: $.data.id
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: To Keeper
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          tk_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: R-P1
          product_line: AUTO
          annual_premium_cents: 150000
          is_new_business: false
          holder_agent_id: ${fk_id}
          owner_agency_id: ${from_id}
        as: FieldManager
        captures:
          rp1: $.data.id
      trigger:
      - call: POST /agency-network/agents/${fk_id}/book-transfer
        payload:
          from_agency_id: ${from_id}
          to_agency_id: ${to_id}
        as: AgencyPrincipal
        as_user_id: ${from_id}
        captures:
          x: $.data.id
      - call: GET /agency-network/agencies/${from_id}
        payload: {}
        as: AppointingExecutive
        captures:
          from_exp: $.data.exposure_inforce_cents
      - call: GET /agency-network/agencies/${to_id}
        payload: {}
        as: AppointingExecutive
        captures:
          to_exp: $.data.exposure_inforce_cents
      assert:
      - before the transfer from_exposure == 150000.00 and to_exposure == 0.00
      - after the transfer from_exposure + to_exposure == 150000.00 (exposure conserved across the reassignment)
      - BookTransfer settlement_payable_cents is derived from the transferred base, never from a drifted exposure
