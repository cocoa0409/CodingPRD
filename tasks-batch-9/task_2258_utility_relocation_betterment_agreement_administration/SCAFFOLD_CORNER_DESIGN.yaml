            - { call: "POST /uro/commitments/${sc1}/start-work", payload: {}, as: UtilityOwnerRep, as_user_id: "${o1}" }
            - { call: "POST /uro/commitments/${sc1}/report-complete", payload: { completion_note: "Complete inside the window." }, as: UtilityOwnerRep, as_user_id: "${o1}" }
            - { call: "POST /uro/conflicts/${c1}/certify-cleared", payload: { certification_note: "Clearance verified by field survey." }, as: UtilityCoordinator }
            - { call: "GET /uro/relocation-plans/${pl1}", payload: {}, as: AgreementOfficer, captures: { pl1v: "$.data.version" } }
            - { call: "POST /uro/agreements", payload: { plan_id: "${pl1}", expected_plan_version: "${pl1v}", not_to_exceed_cents: 45000000 }, as: AgreementOfficer, as_user_id: "officer-1", captures: { ag1: "$.data.id" } }
            - { call: "POST /uro/agreements/${ag1}/circulate", payload: {}, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "POST /uro/agreements/${ag1}/execute", payload: {}, as: AgreementOfficer, as_user_id: "officer-1", captures: { settle_dim: "$.data.settlement_status" } }
            - { call: "GET /uro/projects/${p1}", payload: {}, as: ProgramAdmin, captures: { proj_status: "$.data.status", open_conflicts: "$.data.open_conflict_count" } }
          trigger:
            - { call: "POST /uro/projects/${p1}/close", payload: { closure_note: "Attempting closure with an unsettled agreement." }, as: ProgramAdmin }
          assert:
            - "${proj_status} == UNDER_CONSTRUCTION, ${open_conflicts} == 0 and ${settle_dim} == NOT_STARTED"
            - "HTTP 409 with error_id ERR_PROJECT_CLOSE_BLOCKED (priority 31)"
            - "Project.${p1}.status stays UNDER_CONSTRUCTION and its version is unchanged"
            - "after POST /uro/agreements/${ag1}/void the identical close call returns 200 with status CLOSED, because VOIDED_OUT is an accepted terminal settlement state"
            - "in a variant where a DelayClaim of this project is left in status SUBMITTED, close returns 409 ERR_PROJECT_CLOSE_BLOCKED as well"

      - name: corner_settlement_dimension_rejects_actions_from_the_wrong_state
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_SETTLEMENT_STATE_INVALID]"]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / settlement_dimension_reenters_pending_after_two_audit_cycles_then_locks"
          rationale: "That instance drives the settlement dimension through both audit cycles and then asserts ERR_SETTLEMENT_STATE_INVALID for every action attempted on the SETTLED terminal, including the refusal to void it, which covers this error id and the priority-10 rule."

      - name: corner_trench_window_containment_is_enforced
        claim_type: Violation → Error
        grounds: ["validations[priority=24]", "errors[ERR_TRENCH_WINDOW_NOT_CONTAINED]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / joint_trench_slot_containment_is_inclusive_and_capacity_counts_overlaps"
          rationale: "That instance asserts the inclusive containment boundary on both edges of the trench opening and the one-day overshoot that produces ERR_TRENCH_WINDOW_NOT_CONTAINED, so this error id is already triggered there."

  # ===========================================================================
  - section: rbac
    instances:
      - name: each_role_exercises_its_own_exclusive_operations_along_one_chain
        claim_type: Exclusive Operations
        grounds: ["roles.ProgramAdmin", "roles.UtilityCoordinator", "roles.RightOfWayAdjudicator", "roles.AgreementOfficer", "roles.ExternalAuditor", "roles.ConstructionEngineer", "roles.UtilityOwnerRep"]
        distinguishing_aspect: "One chain in which all seven roles act, each only on operations its own row claims: the whole conflict-to-settlement lifecycle is reachable without any role borrowing another's authority, which is the positive half of the RBAC matrix and proves no route was accidentally locked to the wrong role."
        test_recipe:
          setup: ["ProgramAdmin has registered the project and the utility owner."]
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: "$.data.id" } }
