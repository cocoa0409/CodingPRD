            - { call: "GET /fraudops/loss-entries/${loss}", as: FraudOpsManager }
            - { call: "GET /fraudops/accounts/${acct}", as: FraudOpsManager }
          assert:
            - "tier before payment (${tier_mid}) == HIGH (rolling loss 110000 >= 100000)"
            - "LossEntry.${loss}.outstanding_cents == 0 (link 1: paid_cents applied to INV-LOSS)"
            - "LossEntry.${loss}.loss_status == FULLY_RECOVERED (link 2: auto-flip at outstanding == 0)"
            - "Account.${acct}.rolling_90d_loss_cents == 0 (FULLY_RECOVERED excluded from the rolling set)"
