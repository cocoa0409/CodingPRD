              as: PlatformAdmin
            - call: "GET /kidswear/members/${v14_m}"
              payload: {}
              as: BillingAgent
              captures: { v14_v: $.data.version }
          trigger:
            - call: "POST /kidswear/members/${v14_m}/credit-applications"
              payload: { charge_entry_id: "${v14_chg}", expected_member_version: "${v14_v}" }
              as: BillingAgent
              captures: { err_v14: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_v14 equals ERR_CREDIT_EXPIRED"
            - "CreditLedgerEntry.${v14_cre}.expires_at == 2026-10-28T00:00:00.000Z"
            - "CreditLedgerEntry.${v14_cre}.remaining_cents == 3000"
            - "ChargeLedgerEntry.${v14_chg}.net_due_cents == 1000"

