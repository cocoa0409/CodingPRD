scenario: 'Domestic Shoe Manufacturing & Content Claim Substantiation (New Balance): domestic factory production alongside overseas sourcing with model-level decisions on where each style is made, domestic
  content calculation supporting labeling claims with documentation of component origin and assembly labor, factory workforce skill development for stitching, lasting and assembly operations with training
  pipelines, small-batch and custom program production with individualized orders flowing through a mass production facility, material supply for domestic lines with limited domestic component availability,
  cost differential management where domestically made styles carry higher prices, government procurement contracts requiring domestic manufacture with compliance evidence, capacity allocation between domestic
  and imported lines during demand shifts

  '
domain_name: domestic-footwear-content-claims
api_prefix: /footwear
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Factory
  parent: null
  common_fields: true
  fields:
  - name: factory_name
    type: string
    source: input
    description: Display name of the production facility
  - name: location_type
    type: enum
    source: input
    constraints: DOMESTIC | OVERSEAS
    description: DOMESTIC = US factory; OVERSEAS = foreign sourcing plant
  - name: government_cleared
    type: boolean
    source: input
    default: false
    description: Whether the factory is cleared to produce government-contract footwear
  - name: weekly_capacity_units
    type: integer
    source: input
    constraints: '> 0'
    description: Total pairs the factory can produce per ISO week across all lines
  - name: line_count
    type: integer
    source: input
    constraints: '>= 1'
    description: Number of production lines; runs occupy line_index 1..line_count
  - name: labor_rate_cents_per_minute
    type: integer
    source: input
    constraints: '>= 0'
    description: Direct labor rate used by content and cost calculations
  - name: overhead_cents_per_pair
    type: integer
    source: input
    constraints: '>= 0'
    description: Factory overhead allocated per pair
  - name: status
    type: enum
    source: system
    constraints: ACTIVE | SUSPENDED
    description: ACTIVE on creation; SUSPENDED halts run actions and cascades to runs/orders
  - name: skill_coverage_certified_pct
    type: number
    source: computed
    description: Read-only workforce coverage per skill_coverage_score variant certified_only (1 decimal place)
  - name: skill_coverage_pipeline_pct
    type: number
    source: computed
    description: Read-only workforce coverage per skill_coverage_score variant pipeline_adjusted (1 decimal place)
- name: ShoeModel
  parent: null
  common_fields: true
  fields:
  - name: style_code
    type: string
    source: input
    constraints: unique across all models
    description: Public style identifier (e.g. 'M990v6')
  - name: production_policy
    type: enum
    source: input
    constraints: DOMESTIC_ONLY | IMPORT_ONLY | DUAL_SOURCE
    description: 'Model-level sourcing decision: which factory locations may produce this style'
  - name: base_price_cents
    type: integer
    source: input
    constraints: '> 0'
    description: Retail price of the import-line variant
  - name: import_cost_basis_cents
    type: integer
    source: input
    constraints: '> 0'
    description: Fully-loaded per-pair cost when the model is produced overseas; denominator of cost_differential_pricing
  - name: bom_lines
    type: array
    source: input
    constraints: '>= 1 line; immutable after creation'
    description: 'Bill of materials. Each line: { component_id (FK -> Component.id), quantity_per_pair (number > 0), sourcing_requirement (DOMESTIC_REQUIRED | DOMESTIC_PREFERRED | IMPORT_ALLOWED), planned_unit_cost_cents
      (integer >= 0), planned_is_domestic (boolean) }'
  - name: standard_stitching_minutes
    type: integer
    source: input
    constraints: '>= 0'
    description: Standard labor minutes per pair for the stitching operation
  - name: standard_lasting_minutes
    type: integer
    source: input
    constraints: '>= 0'
    description: Standard labor minutes per pair for the lasting operation
  - name: standard_assembly_minutes
    type: integer
    source: input
    constraints: '>= 0'
    description: Standard labor minutes per pair for the assembly operation
  - name: domestic_unit_cost_cents
    type: integer
    source: computed
    description: Read-only; null until a CERTIFIED report is created on a DOMESTIC run of this model, then equals that report's total_cost_cents (event-driven refresh at report creation)
  - name: domestic_price_cents
    type: integer
    source: computed
    description: Read-only; null until domestic_unit_cost_cents is set, then round_half_up(base_price_cents * domestic_unit_cost_cents / import_cost_basis_cents)
  - name: status
    type: enum
    source: system
    constraints: ACTIVE | DISCONTINUED
    description: ACTIVE on creation; DISCONTINUED is terminal
- name: Component
  parent: null
  common_fields: true
  fields:
  - name: component_name
    type: string
    source: input
    description: Catalog name, e.g. 'Full-grain leather upper'
  - name: component_type
    type: enum
    source: input
    constraints: UPPER | MIDSOLE | OUTSOLE | INSOLE | LACES | EYELETS | ADHESIVE | THREAD | OTHER
    description: Component category
- name: MaterialLot
  parent: null
  common_fields: true
  fields:
  - name: component_id
    type: string
    source: input
    description: FK -> Component.id; the catalog component this lot stocks
  - name: supplier_name
    type: string
    source: input
    description: Supplier legal name
  - name: is_domestic
    type: boolean
    source: input
    description: 'Claimed origin: true = US-origin material (must be backed by a SUPPLIER_ORIGIN_CERT evidence document for claims/audits)'
  - name: quantity_received
    type: integer
    source: input
    constraints: '> 0'
    description: Units received into stock
  - name: quantity_remaining
    type: integer
    source: computed
    description: Read-only = quantity_received - units consumed by runs in MATERIAL_RESERVED/IN_PRODUCTION/QUALITY_HOLD/COMPLETED (releases and pre-consumption cancellations re-credit)
  - name: unit_cost_cents
    type: integer
    source: input
    constraints: '>= 0'
    description: Actual per-unit cost of this lot
  - name: received_at
    type: datetime
    source: system
    description: Logical-clock timestamp at lot creation; primary FIFO key for fifo_lot_consumption
- name: ProductionRun
  parent: null
  common_fields: true
  fields:
  - name: model_id
    type: string
    source: input
    description: FK -> ShoeModel.id; the style this run produces
  - name: factory_id
    type: string
    source: input
    description: FK -> Factory.id; the facility this run occupies
  - name: run_type
    type: enum
    source: input
    constraints: STOCK | CUSTOM_BATCH | GOVERNMENT
    description: STOCK = replenishment; CUSTOM_BATCH = hosts individualized CustomOrders; GOVERNMENT = fulfills GovContracts
  - name: planned_units
    type: integer
    source: input
    constraints: '>= 1'
    description: Pairs this run will produce
  - name: line_index
    type: integer
    source: input
    constraints: 1 <= line_index <= factory.line_count
    description: Production line occupied for [start_day, end_day)
  - name: start_day
    type: string
    source: input
    constraints: ISO date YYYY-MM-DD
    description: First day the run occupies the line (inclusive)
  - name: end_day
    type: string
    source: input
    constraints: ISO date YYYY-MM-DD, strictly after start_day
    description: Day the run releases the line (exclusive; half-open window)
  - name: iso_week
    type: string
    source: input
    constraints: ISO week 'YYYY-Www'
    description: Capacity bucket week the run draws from
  - name: actual_stitching_minutes
    type: integer
    source: system
    description: Actual per-pair stitching minutes, recorded at completion; null until COMPLETED
  - name: actual_lasting_minutes
    type: integer
    source: system
    description: Actual per-pair lasting minutes; null until COMPLETED
  - name: actual_assembly_minutes
    type: integer
    source: system
    description: Actual per-pair assembly minutes; null until COMPLETED
  - name: consumed_lots
    type: array
    source: system
    description: 'Lot consumption written by reserve-materials, cleared by release-materials and by pre-consumption cancellation. Entries: { lot_id, component_id, units_consumed, unit_cost_cents, is_domestic
      }'
  - name: certified_unit_cost_cents
    type: integer
    source: computed
    description: Read-only per-pair cost incl. small-batch surcharge, computed by run_unit_cost at completion; null until COMPLETED
  - name: status
    type: enum
    source: system
    constraints: PLANNED | MATERIAL_RESERVED | IN_PRODUCTION | QUALITY_HOLD | COMPLETED | CANCELLED
    description: Run lifecycle; COMPLETED and CANCELLED are terminal
- name: DomesticContentReport
  parent: ProductionRun
  common_fields: true
  fields:
  - name: run_id
    type: string
    source: system
    description: FK -> ProductionRun.id; taken from the creation path
  - name: variant
    type: enum
    source: input
    constraints: PROVISIONAL | CERTIFIED
    description: PROVISIONAL = BOM planned costs + standard minutes; CERTIFIED = actual consumed lots + actual minutes (run must be COMPLETED)
  - name: material_cost_cents
    type: integer
    source: computed
    description: Per-pair material cost; per-line extended cost rounded half-up to integer cents BEFORE summing (pinned rounding order)
  - name: domestic_material_cost_cents
    type: integer
    source: computed
    description: Per-pair material cost from domestic sources (planned_is_domestic lines for PROVISIONAL; is_domestic consumed lots for CERTIFIED)
  - name: labor_cost_cents
    type: integer
    source: computed
    description: Per-pair labor = total minutes * factory.labor_rate_cents_per_minute
  - name: overhead_cost_cents
    type: integer
    source: computed
    description: Per-pair overhead = factory.overhead_cents_per_pair
  - name: domestic_value_cents
    type: integer
    source: computed
    description: US-content numerator = domestic_material_cost_cents + (labor_cost_cents + overhead_cost_cents when factory DOMESTIC else 0)
  - name: total_cost_cents
    type: integer
    source: computed
    description: Per-pair total = material_cost_cents + labor_cost_cents + overhead_cost_cents
  - name: us_content_pct
    type: number
    source: computed
    description: round_half_up to 2 decimals of 100 * domestic_value_cents / total_cost_cents
  - name: final_assembly_domestic
    type: boolean
    source: computed
    description: true iff the run's factory has location_type DOMESTIC
  - name: status
    type: enum
    source: system
    constraints: ACTIVE | SUPERSEDED
    description: Creating a new report of the same variant on the same run supersedes the previous ACTIVE one
- name: CustomOrder
  parent: null
  common_fields: true
  fields:
  - name: model_id
    type: string
    source: input
    description: FK -> ShoeModel.id; the base style being individualized
  - name: buyer_ref
    type: string
    source: input
    description: Opaque customer reference; when X-User-Role is CustomProgramCustomer it MUST equal X-User-ID
  - name: colorway
    type: string
    source: input
    description: Color code; 'STD' = standard colorway (no fee)
  - name: size
    type: string
    source: input
    description: Shoe size code
  - name: monogram
    type: string
    source: input
    description: Optional monogram text; presence adds MONOGRAM_FEE_CENTS
    constraints: optional
  - name: quantity_units
    type: integer
    source: input
    constraints: 1..12
    description: Pairs in this individualized order (small-batch ceiling MAX_CUSTOM_ORDER_UNITS = 12)
  - name: quoted_price_cents
    type: integer
    source: computed
    description: Read-only price quoted by custom_order_price at accept; null until ACCEPTED
  - name: production_run_id
    type: string
    source: system
    description: FK -> ProductionRun.id; nullable; set by schedule, cleared by cascade unschedule
  - name: production_status
    type: enum
    source: system
    constraints: SUBMITTED | ACCEPTED | SCHEDULED | IN_PRODUCTION | FULFILLED | CANCELLED
    description: Custom-order lifecycle; FULFILLED and CANCELLED are terminal
- name: LabelClaim
  parent: null
  common_fields: true
  fields:
  - name: model_id
    type: string
    source: input
    description: FK -> ShoeModel.id; the style the labeling claim describes
  - name: claim_type
    type: enum
    source: input
    constraints: MADE_IN_USA | MADE_IN_USA_OF_IMPORTED_MATERIALS | ASSEMBLED_IN_USA | IMPORTED
    description: Labeling claim asserted on packaging/marketing
  - name: report_id
    type: string
    source: system
    description: FK -> DomesticContentReport.id; nullable; pinned by substantiate to the CERTIFIED report that substantiates the claim, re-pointed by recompute cascades
  - name: substantiated_at
    type: datetime
    source: system
    description: Logical-clock time of the latest successful substantiate; null until first substantiation
  - name: published_at
    type: datetime
    source: system
    description: Logical-clock time of publish; null until PUBLISHED
  - name: status
    type: enum
    source: system
    constraints: DRAFT | SUBSTANTIATED | PUBLISHED | CHALLENGED | REVOKED
    description: Claim lifecycle; CHALLENGED may loop back to SUBSTANTIATED; REVOKED is terminal
- name: EvidenceDocument
  parent: null
  common_fields: true
  fields:
  - name: doc_type
    type: enum
    source: input
    constraints: SUPPLIER_ORIGIN_CERT | ASSEMBLY_LABOR_RECORD | COST_BREAKDOWN | CUSTOMS_ENTRY
    description: Kind of substantiation/compliance evidence
  - name: claim_id
    type: string
    source: input
    constraints: optional; exactly one of claim_id / material_lot_id / production_run_id MUST be set
    description: FK -> LabelClaim.id; set when the document substantiates a labeling claim
  - name: material_lot_id
    type: string
    source: input
    constraints: optional; mutually exclusive with the other two links
    description: FK -> MaterialLot.id; set for supplier origin certificates attached to a lot
  - name: production_run_id
    type: string
    source: input
    constraints: optional; mutually exclusive with the other two links
    description: FK -> ProductionRun.id; set for assembly labor records attached to a run
  - name: issuer
    type: string
    source: input
    description: Issuing party (supplier, plant HR office, customs broker)
  - name: valid_from
    type: string
    source: input
    constraints: ISO date YYYY-MM-DD
    description: First day the document is valid
  - name: valid_until
    type: string
    source: input
    constraints: ISO date YYYY-MM-DD, strictly after valid_from
    description: Last day the document is valid; a document is unexpired iff valid_until >= current logical-clock date
  - name: uploaded_by
    type: string
    source: system
    description: 'X-User-ID of the creator; segregation of duties: uploader may not verify or reject the document'
  - name: status
    type: enum
    source: system
    constraints: SUBMITTED | VERIFIED | REJECTED | EXPIRED
    description: SUBMITTED on creation; VERIFIED->REJECTED fires recompute cascades; VERIFIED->EXPIRED is system-driven when the clock passes valid_until; REJECTED and EXPIRED are terminal
- name: Worker
  parent: null
  common_fields: true
  fields:
  - name: factory_id
    type: string
    source: input
    description: FK -> Factory.id; the plant that employs this worker
  - name: full_name
    type: string
    source: input
    description: Worker name
  - name: status
    type: enum
    source: system
    constraints: ACTIVE | SUSPENDED
    description: ACTIVE on creation; SUSPENDED workers do not count toward run workforce requirements
  - name: certifications
    type: array
    source: system
    description: System-maintained list of { operation (STITCHING | LASTING | ASSEMBLY), level (1|2|3), cert_status (CERTIFIED | SUSPENDED) }; upserted when a TrainingEnrollment reaches CERTIFIED; cert_status
      flipped by the certification suspend/reinstate endpoints
- name: TrainingEnrollment
  parent: null
  common_fields: true
  fields:
  - name: worker_id
    type: string
    source: input
    description: FK -> Worker.id; the trainee
  - name: operation
    type: enum
    source: input
    constraints: STITCHING | LASTING | ASSEMBLY
    description: Operation being trained
  - name: target_level
    type: integer
    source: input
    constraints: 1..3
    description: Certification level granted on success
  - name: attempt_count
    type: integer
    source: system
    description: 0 at creation; +1 per record-assessment
  - name: last_score
    type: integer
    source: system
    description: Score of the latest assessment (0..100); null until first assessment
  - name: status
    type: enum
    source: system
    constraints: ENROLLED | REMEDIATION | CERTIFIED | FAILED
    description: ENROLLED -assessment>=80-> CERTIFIED; ENROLLED -assessment<80-> REMEDIATION; REMEDIATION -assessment>=80-> CERTIFIED; REMEDIATION -assessment<80-> FAILED; CERTIFIED and FAILED terminal
- name: CapacityAllocation
  parent: null
  common_fields: true
  fields:
  - name: factory_id
    type: string
    source: input
    description: FK -> Factory.id; the plant whose week is budgeted
  - name: iso_week
    type: string
    source: input
    constraints: ISO week 'YYYY-Www'; unique per (factory_id, iso_week)
    description: Capacity bucket week
  - name: total_reserved_units
    type: integer
    source: input
    constraints: 0 <= total <= factory.weekly_capacity_units
    description: Total pairs budgeted for the week; split between the domestic and import pools
  - name: domestic_reserved_units
    type: integer
    source: system
    description: 0 at creation; recomputed by capacity_waterfall at lock; moved by shift; pool drawn on by runs at DOMESTIC factories
  - name: import_reserved_units
    type: integer
    source: system
    description: = total_reserved_units at creation; recomputed at lock; moved by shift; pool drawn on by runs at OVERSEAS factories
  - name: status
    type: enum
    source: system
    constraints: OPEN | LOCKED | RECONCILED
    description: OPEN on creation (runs may not reserve); LOCKED after waterfall; RECONCILED terminal once no non-terminal runs remain in the week
- name: GovContract
  parent: null
  common_fields: true
  fields:
  - name: contract_number
    type: string
    source: input
    constraints: unique across all contracts
    description: Government contract identifier
  - name: model_id
    type: string
    source: input
    description: FK -> ShoeModel.id; the style the government is buying
  - name: factory_id
    type: string
    source: input
    description: FK -> Factory.id; the plant that will produce the contract volume
  - name: awarded_units
    type: integer
    source: input
    constraints: '>= 1'
    description: Pairs the contract obliges
  - name: fulfillment_start
    type: string
    source: input
    constraints: ISO date YYYY-MM-DD
    description: First day of the fulfillment window (INCLUSIVE — closed interval)
  - name: fulfillment_end
    type: string
    source: input
    constraints: ISO date YYYY-MM-DD, strictly after fulfillment_start
    description: Last day of the fulfillment window (INCLUSIVE — closed interval)
  - name: fulfilled_units
    type: integer
    source: system
    description: 0 until audit; at complete-audit set to the sum of planned_units over COMPLETED GOVERNMENT runs matching (model_id, factory_id)
  - name: audit_passed
    type: boolean
    source: system
    description: null until complete-audit; true -> CLOSED, false -> DEFAULTED
  - name: status
    type: enum
    source: system
    constraints: AWARDED | IN_FULFILLMENT | COMPLIANCE_AUDIT | CLOSED | DEFAULTED
    description: Contract lifecycle; CLOSED and DEFAULTED terminal
state_machines:
- entity: Factory
  initial_state: ACTIVE
  terminal_states: []
  transitions:
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /footwear/factories/{id}/suspend
    actor: PlatformAdmin
    preconditions:
    - factory.status == ACTIVE (else ERR_INVALID_STATE)
    side_effects:
    - 'Cascade hop 1: each ProductionRun with factory_id == this factory and status == IN_PRODUCTION -> QUALITY_HOLD (run.version +1)'
    - 'Cascade hop 1: each ProductionRun with factory_id == this factory and status == MATERIAL_RESERVED -> PLANNED (run.version +1), and that release itself re-credits every lot in run.consumed_lots (lot.quantity_remaining
      += units_consumed, lot.version +1) and clears run.consumed_lots (cascade hop 2)'
    - 'Cascade hop 2: each CustomOrder with production_status == SCHEDULED whose production_run_id is one of the reverted runs -> ACCEPTED with production_run_id = null (order.version +1)'
    note: Runs already COMPLETED/CANCELLED are untouched; QUALITY_HOLD runs keep their lots and their IN_PRODUCTION orders.
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /footwear/factories/{id}/reactivate
    actor: PlatformAdmin
    preconditions:
    - factory.status == SUSPENDED (else ERR_INVALID_STATE)
    side_effects: []
    note: 'No auto-resume: reverted runs stay PLANNED and held runs stay QUALITY_HOLD until explicit reserve/resume.'
- entity: ShoeModel
  initial_state: ACTIVE
  terminal_states:
  - DISCONTINUED
  transitions:
  - from: ACTIVE
    to: DISCONTINUED
    trigger: POST /footwear/models/{id}/discontinue
    actor: SourcingManager
    preconditions:
    - no ProductionRun of this model in PLANNED | MATERIAL_RESERVED | IN_PRODUCTION | QUALITY_HOLD (ERR_MODEL_HAS_OPEN_RUNS)
    - no LabelClaim of this model in PUBLISHED (ERR_MODEL_HAS_PUBLISHED_CLAIMS)
    side_effects:
    - each LabelClaim of this model in DRAFT | SUBSTANTIATED | CHALLENGED -> REVOKED (claim.version +1)
- entity: ProductionRun
  initial_state: PLANNED
  terminal_states:
  - COMPLETED
  - CANCELLED
  transitions:
  - from: PLANNED
    to: MATERIAL_RESERVED
    trigger: POST /footwear/production-runs/{id}/reserve-materials
    actor: ProductionPlanner
    preconditions:
    - run.status == PLANNED (else ERR_INVALID_STATE)
    - run.model.status == ACTIVE (ERR_MODEL_NOT_ACTIVE)
    - run.factory.status == ACTIVE (ERR_FACTORY_NOT_ACTIVE)
    - 'line window: no other run on same (factory_id, line_index) with status IN {MATERIAL_RESERVED, IN_PRODUCTION, QUALITY_HOLD} whose half-open [start_day, end_day) intersects this run''s (ERR_LINE_WINDOW_CONFLICT);
      touching boundaries (end_day == other.start_day) do NOT conflict'
    - 'materials: every BOM line fully allocatable per fifo_lot_consumption (ERR_DOMESTIC_MATERIAL_SHORTAGE for DOMESTIC_REQUIRED lines, else ERR_MATERIAL_SHORTAGE); allocation is atomic — no partial consumption'
    - 'capacity: a CapacityAllocation exists for (run.factory_id, run.iso_week) (ERR_ALLOCATION_NOT_FOUND) with status == LOCKED (ERR_ALLOCATION_NOT_LOCKED), and consumed + run.planned_units <= pool, where
      pool = domestic_reserved_units for DOMESTIC factories else import_reserved_units, and consumed = sum of planned_units over runs of (factory, iso_week) in {MATERIAL_RESERVED, IN_PRODUCTION, QUALITY_HOLD,
      COMPLETED}; equality is allowed (ERR_CAPACITY_WEEK_EXCEEDED)'
    side_effects:
    - 'fifo_lot_consumption consumes lots: run.consumed_lots written; each lot.quantity_remaining decremented (lot.version +1)'
    - run.version +1
  - from: MATERIAL_RESERVED
    to: PLANNED
    trigger: POST /footwear/production-runs/{id}/release-materials
    actor: ProductionPlanner
    preconditions:
    - run.status == MATERIAL_RESERVED (else ERR_INVALID_STATE)
    side_effects:
    - 'compensating release: each lot in run.consumed_lots re-credited (quantity_remaining += units_consumed, lot.version +1); run.consumed_lots cleared'
    - run.version +1
    note: reserve + release is the compensating pair that conserves lot.quantity_received (see compensating_invariant instances).
  - from: MATERIAL_RESERVED
    to: IN_PRODUCTION
    trigger: POST /footwear/production-runs/{id}/start
    actor: ProductionPlanner
    preconditions:
    - run.status == MATERIAL_RESERVED (else ERR_INVALID_STATE)
    - run.factory.status == ACTIVE (ERR_FACTORY_NOT_ACTIVE)
    - 'workforce: for each operation, count of workers at run.factory with worker.status == ACTIVE and a certification for that operation with cert_status == CERTIFIED >= REQUIRED_WORKERS_PER_RUN[op] (STITCHING
      2, LASTING 1, ASSEMBLY 1) (ERR_WORKFORCE_SHORTFALL)'
    side_effects:
    - each CustomOrder with production_run_id == run.id and production_status == SCHEDULED -> IN_PRODUCTION (order.version +1)
    - run.version +1
  - from: IN_PRODUCTION
    to: QUALITY_HOLD
    trigger: POST /footwear/production-runs/{id}/hold
    actor: ProductionPlanner | FactoryManager (own factory only)
    preconditions:
    - run.status == IN_PRODUCTION (else ERR_INVALID_STATE)
    - 'FactoryManager callers: run.factory_id == X-User-ID (ERR_FACTORY_OWNERSHIP_MISMATCH)'
    side_effects:
    - run.version +1
  - from: QUALITY_HOLD
    to: IN_PRODUCTION
    trigger: POST /footwear/production-runs/{id}/resume
    actor: ProductionPlanner | FactoryManager (own factory only)
    preconditions:
    - run.status == QUALITY_HOLD (else ERR_INVALID_STATE)
    - run.factory.status == ACTIVE (ERR_FACTORY_NOT_ACTIVE)
    - workforce requirement re-evaluated as in start (ERR_WORKFORCE_SHORTFALL)
    - 'FactoryManager callers: run.factory_id == X-User-ID (ERR_FACTORY_OWNERSHIP_MISMATCH)'
    side_effects:
    - run.version +1
  - from: IN_PRODUCTION
    to: COMPLETED
    trigger: POST /footwear/production-runs/{id}/complete
    actor: ProductionPlanner
    preconditions:
    - run.status == IN_PRODUCTION (else ERR_INVALID_STATE)
    side_effects:
    - actual_*_minutes stored from payload
    - run_unit_cost computed -> run.certified_unit_cost_cents
    - run.version +1
  - from: PLANNED
    to: CANCELLED
    trigger: POST /footwear/production-runs/{id}/cancel
    actor: ProductionPlanner
    preconditions:
    - run.status == PLANNED (else ERR_INVALID_STATE)
    side_effects:
    - run.version +1
  - from: MATERIAL_RESERVED
    to: CANCELLED
    trigger: POST /footwear/production-runs/{id}/cancel
    actor: ProductionPlanner
    preconditions:
    - run.status == MATERIAL_RESERVED (else ERR_INVALID_STATE)
    side_effects:
    - 'compensating release: lots re-credited and consumed_lots cleared exactly as release-materials'
    - each CustomOrder SCHEDULED on this run -> ACCEPTED, production_run_id = null (order.version +1)
    - run.version +1
  - from: QUALITY_HOLD
    to: CANCELLED
    trigger: POST /footwear/production-runs/{id}/cancel
    actor: ProductionPlanner
    preconditions:
    - run.status == QUALITY_HOLD (else ERR_INVALID_STATE)
    side_effects:
    - lots are NOT re-credited (materials already consumed physically); consumed_lots retained
    - each CustomOrder SCHEDULED or IN_PRODUCTION on this run -> ACCEPTED, production_run_id = null (order.version +1)
    - run.version +1
- entity: DomesticContentReport
  initial_state: ACTIVE
  terminal_states:
  - SUPERSEDED
  transitions:
  - from: ACTIVE
    to: SUPERSEDED
    trigger: 'system: a new DomesticContentReport of the same variant is created for the same run (via POST /footwear/production-runs/{id}/content-reports or via evidence-rejection recompute)'
    actor: system
    preconditions: []
    side_effects:
    - superseded report.version +1
    note: At most one ACTIVE report per (run, variant). Reports are otherwise immutable snapshots — no update endpoint exists.
- entity: CustomOrder
  initial_state: SUBMITTED
  terminal_states:
  - FULFILLED
  - CANCELLED
  transitions:
  - from: SUBMITTED
    to: ACCEPTED
    trigger: POST /footwear/custom-orders/{id}/accept
    actor: ProductionPlanner
    preconditions:
    - order.production_status == SUBMITTED (else ERR_INVALID_STATE)
    - order.model.status == ACTIVE (ERR_MODEL_NOT_ACTIVE)
    side_effects:
    - quoted_price_cents computed per custom_order_price
    - order.version +1
  - from: ACCEPTED
    to: SCHEDULED
    trigger: POST /footwear/custom-orders/{id}/schedule
    actor: ProductionPlanner
    preconditions:
    - order.production_status == ACCEPTED (else ERR_INVALID_STATE)
    - production_run_id resolves to an existing run (ERR_RUN_NOT_FOUND)
    - run.run_type == CUSTOM_BATCH (ERR_NOT_A_CUSTOM_RUN)
    - run.model_id == order.model_id (ERR_MODEL_MISMATCH)
    - run.factory.location_type == DOMESTIC (ERR_CUSTOM_REQUIRES_DOMESTIC)
    - run.status == MATERIAL_RESERVED (ERR_RUN_NOT_READY)
    - 'order slots: sum of quantity_units over orders with production_run_id == run.id and production_status IN {SCHEDULED, IN_PRODUCTION} + order.quantity_units <= run.planned_units; equality allowed (ERR_RUN_ORDER_CAPACITY_EXCEEDED)'
    side_effects:
    - order.production_run_id = run.id
    - order.version +1
  - from: SCHEDULED
    to: IN_PRODUCTION
    trigger: 'system: the linked run transitions MATERIAL_RESERVED -> IN_PRODUCTION'
    actor: system
    preconditions: []
    side_effects:
    - order.version +1
  - from: SCHEDULED
    to: ACCEPTED
    trigger: 'system: the linked run is reverted (factory suspension or run cancellation from MATERIAL_RESERVED/QUALITY_HOLD)'
    actor: system
    preconditions: []
    side_effects:
    - order.production_run_id = null
    - order.version +1
    note: This revert closes the ACCEPTED -> SCHEDULED -> ACCEPTED cycle.
  - from: IN_PRODUCTION
    to: ACCEPTED
    trigger: 'system: the linked run is cancelled from QUALITY_HOLD'
    actor: system
    preconditions: []
    side_effects:
    - order.production_run_id = null
    - order.version +1
  - from: IN_PRODUCTION
    to: FULFILLED
    trigger: POST /footwear/custom-orders/{id}/fulfill
    actor: ProductionPlanner
    preconditions:
    - order.production_status == IN_PRODUCTION (else ERR_INVALID_STATE)
    - linked run.status == COMPLETED (ERR_RUN_NOT_COMPLETED)
    side_effects:
    - order.version +1
  - from: SUBMITTED
    to: CANCELLED
    trigger: POST /footwear/custom-orders/{id}/cancel
    actor: ProductionPlanner | CustomProgramCustomer (own buyer_ref only)
    preconditions:
    - order.production_status == SUBMITTED (else ERR_INVALID_STATE)
    - 'CustomProgramCustomer callers: order.buyer_ref == X-User-ID (ERR_BUYER_REF_MISMATCH)'
    side_effects:
    - order.version +1
  - from: ACCEPTED
    to: CANCELLED
    trigger: POST /footwear/custom-orders/{id}/cancel
    actor: ProductionPlanner | CustomProgramCustomer (own buyer_ref only)
    preconditions:
    - order.production_status == ACCEPTED (else ERR_INVALID_STATE)
    - 'CustomProgramCustomer callers: order.buyer_ref == X-User-ID (ERR_BUYER_REF_MISMATCH)'
    side_effects:
    - order.version +1
  - from: SCHEDULED
    to: CANCELLED
    trigger: POST /footwear/custom-orders/{id}/cancel
    actor: ProductionPlanner | CustomProgramCustomer (own buyer_ref only)
    preconditions:
    - order.production_status == SCHEDULED (else ERR_INVALID_STATE)
    - 'CustomProgramCustomer callers: order.buyer_ref == X-User-ID (ERR_BUYER_REF_MISMATCH)'
    side_effects:
    - frees the order's slot on the linked run (slot accounting is derived, so no counter write)
    - order.version +1
- entity: LabelClaim
  initial_state: DRAFT
  terminal_states:
  - REVOKED
  transitions:
  - from: DRAFT
    to: SUBSTANTIATED
    trigger: POST /footwear/label-claims/{id}/substantiate
    actor: ComplianceOfficer
    preconditions:
    - claim.status == DRAFT (else ERR_INVALID_STATE)
    - report_id resolves to an existing report (ERR_REPORT_NOT_FOUND) with variant == CERTIFIED (ERR_REPORT_NOT_CERTIFIED) and status == ACTIVE (ERR_REPORT_NOT_ACTIVE)
    - report.run.model_id == claim.model_id (ERR_REPORT_MODEL_MISMATCH)
    - claim_threshold_check passes for claim.claim_type against report.us_content_pct and report.final_assembly_domestic (ERR_CONTENT_THRESHOLD_NOT_MET)
    - 'evidence: at least one VERIFIED unexpired SUPPLIER_ORIGIN_CERT and at least one VERIFIED unexpired ASSEMBLY_LABOR_RECORD with claim_id == claim.id (ERR_REQUIRED_EVIDENCE_MISSING)'
    side_effects:
    - claim.report_id = report.id; substantiated_at = current logical clock
    - claim.version +1
  - from: CHALLENGED
    to: SUBSTANTIATED
    trigger: POST /footwear/label-claims/{id}/substantiate
    actor: ComplianceOfficer
    preconditions:
    - identical to DRAFT -> SUBSTANTIATED (this is the re-substantiation loop that closes the PUBLISHED -> CHALLENGED -> SUBSTANTIATED cycle)
    side_effects:
    - claim.report_id = report.id; substantiated_at = current logical clock; published_at cleared to null
    - claim.version +1
  - from: SUBSTANTIATED
    to: PUBLISHED
    trigger: POST /footwear/label-claims/{id}/publish
    actor: ComplianceOfficer
    preconditions:
    - claim.status == SUBSTANTIATED (else ERR_INVALID_STATE)
    - claim.model.status == ACTIVE (ERR_MODEL_NOT_ACTIVE)
    - 'evidence freshness: every SUPPLIER_ORIGIN_CERT and ASSEMBLY_LABOR_RECORD counted at substantiation is still VERIFIED and unexpired at the current logical clock (ERR_EVIDENCE_STALE)'
    side_effects:
    - published_at = current logical clock
    - claim.version +1
  - from: SUBSTANTIATED
    to: CHALLENGED
    trigger: 'system: (a) a VERIFIED evidence document linked to this claim is rejected, or (b) a recompute cascade supersedes the claim''s pinned report and the new report fails claim_threshold_check'
    actor: system
    preconditions: []
    side_effects:
    - 'on path (b): claim.report_id is re-pointed to the superseding ACTIVE report before the threshold re-check'
    - each GovContract with model_id == claim.model_id and status == IN_FULFILLMENT -> COMPLIANCE_AUDIT (contract.version +1) — cascade hop 3
    - claim.version +1
  - from: PUBLISHED
    to: CHALLENGED
    trigger: 'system: same triggers as SUBSTANTIATED -> CHALLENGED'
    actor: system
    preconditions: []
    side_effects:
    - published_at cleared to null
    - each GovContract with model_id == claim.model_id and status == IN_FULFILLMENT -> COMPLIANCE_AUDIT (contract.version +1) — cascade hop 3
    - claim.version +1
  - from: DRAFT
    to: REVOKED
    trigger: POST /footwear/label-claims/{id}/revoke
    actor: ComplianceOfficer
    preconditions:
    - claim.status == DRAFT (else ERR_INVALID_STATE)
    side_effects:
    - claim.version +1
  - from: SUBSTANTIATED
    to: REVOKED
    trigger: POST /footwear/label-claims/{id}/revoke
    actor: ComplianceOfficer
    preconditions:
    - claim.status == SUBSTANTIATED (else ERR_INVALID_STATE)
    side_effects:
    - claim.version +1
  - from: CHALLENGED
    to: REVOKED
    trigger: POST /footwear/label-claims/{id}/revoke
    actor: ComplianceOfficer
    preconditions:
    - claim.status == CHALLENGED (else ERR_INVALID_STATE)
    side_effects:
    - claim.version +1
    note: 'PUBLISHED -> REVOKED is deliberately absent: a published claim must be challenged (evidence rejection or report recompute) before it can be revoked.'
- entity: EvidenceDocument
  initial_state: SUBMITTED
  terminal_states:
  - REJECTED
  - EXPIRED
  transitions:
  - from: SUBMITTED
    to: VERIFIED
    trigger: POST /footwear/evidence-documents/{id}/verify
    actor: ComplianceOfficer
    preconditions:
    - doc.status == SUBMITTED (else ERR_INVALID_STATE)
    - 'segregation of duties: doc.uploaded_by != X-User-ID (ERR_SELF_ATTESTATION_FORBIDDEN)'
    side_effects:
    - doc.version +1
  - from: SUBMITTED
    to: REJECTED
    trigger: POST /footwear/evidence-documents/{id}/reject
    actor: ComplianceOfficer
    preconditions:
    - doc.status == SUBMITTED (else ERR_INVALID_STATE)
    - 'segregation of duties: doc.uploaded_by != X-User-ID (ERR_SELF_ATTESTATION_FORBIDDEN)'
    side_effects:
    - doc.version +1
    note: Rejecting a merely-submitted document has no downstream effect; only VERIFIED -> REJECTED fires the recompute/challenge cascades.
  - from: VERIFIED
    to: REJECTED
    trigger: POST /footwear/evidence-documents/{id}/reject
    actor: ComplianceOfficer
    preconditions:
    - doc.status == VERIFIED (else ERR_INVALID_STATE)
    - 'segregation of duties: doc.uploaded_by != X-User-ID (ERR_SELF_ATTESTATION_FORBIDDEN)'
    side_effects:
    - 'Cascade hop 1 (origin cert on a lot): if doc.material_lot_id is set and doc_type == SUPPLIER_ORIGIN_CERT, then for every run whose consumed_lots reference that lot and which has an ACTIVE CERTIFIED
      report, the system creates a superseding CERTIFIED report recomputed with the lot''s consumed units treated as non-domestic (old report -> SUPERSEDED, run.version +1 for the mutation)'
    - 'Cascade hop 1 (labor record on a run): if doc.production_run_id is set and doc_type == ASSEMBLY_LABOR_RECORD and that run has an ACTIVE CERTIFIED report, the system creates a superseding CERTIFIED
      report recomputed with labor and overhead treated as non-domestic'
    - 'Cascade hop 2: for every LabelClaim with status IN {SUBSTANTIATED, PUBLISHED} on the model of any recomputed run: claim.report_id is re-pointed to the superseding ACTIVE report and claim_threshold_check
      is re-evaluated; on failure the claim -> CHALLENGED'
    - 'Cascade hop 2 (direct): if doc.claim_id is set, the linked claim (when SUBSTANTIATED or PUBLISHED) -> CHALLENGED'
    - 'Cascade hop 3: every GovContract with model_id of a claim that just became CHALLENGED and status == IN_FULFILLMENT -> COMPLIANCE_AUDIT'
    - doc.version +1
  - from: VERIFIED
    to: EXPIRED
    trigger: 'system: logical clock advances past valid_until (checked when the clock is set and whenever the document is read or counted)'
    actor: system
    preconditions: []
    side_effects:
    - doc.version +1
    note: 'Expiry never cascades: claims are not auto-challenged by expiry, but publish re-checks freshness and audits only count VERIFIED unexpired documents.'
- entity: Worker
  initial_state: ACTIVE
  terminal_states: []
  transitions:
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /footwear/workers/{id}/suspend
    actor: TrainingCoordinator
    preconditions:
    - worker.status == ACTIVE (else ERR_INVALID_STATE)
    side_effects:
    - 'cascade: for each run IN_PRODUCTION at worker.factory_id, re-evaluate the start-time workforce requirement without this worker; if any operation falls short the run -> QUALITY_HOLD (run.version +1)'
    - worker.version +1
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /footwear/workers/{id}/reinstate
    actor: TrainingCoordinator
    preconditions:
    - worker.status == SUSPENDED (else ERR_INVALID_STATE)
    side_effects:
    - worker.version +1
    note: Held runs are not auto-resumed.
- entity: TrainingEnrollment
  initial_state: ENROLLED
  terminal_states:
  - CERTIFIED
  - FAILED
  transitions:
  - from: ENROLLED
    to: CERTIFIED
    trigger: POST /footwear/training-enrollments/{id}/record-assessment
    actor: TrainingCoordinator
    preconditions:
    - enrollment.status == ENROLLED (else ERR_INVALID_STATE)
    - payload score >= 80 (TRAINING_PASS_SCORE); else the REMEDIATION edge fires
    side_effects:
    - attempt_count +1; last_score = score
    - 'worker.certifications upserted: entry for (operation) set to { level: target_level, cert_status: CERTIFIED } (worker.version +1)'
    - enrollment.version +1
  - from: ENROLLED
    to: REMEDIATION
    trigger: POST /footwear/training-enrollments/{id}/record-assessment
    actor: TrainingCoordinator
    preconditions:
    - enrollment.status == ENROLLED (else ERR_INVALID_STATE)
    - payload score < 80
    side_effects:
    - attempt_count +1; last_score = score
    - enrollment.version +1
  - from: REMEDIATION
    to: CERTIFIED
    trigger: POST /footwear/training-enrollments/{id}/record-assessment
    actor: TrainingCoordinator
    preconditions:
    - enrollment.status == REMEDIATION (else ERR_INVALID_STATE)
    - payload score >= 80
    side_effects:
    - attempt_count +1; last_score = score
    - worker.certifications upserted as in ENROLLED -> CERTIFIED (worker.version +1)
    - enrollment.version +1
    note: This edge closes the training retry loop ENROLLED -> REMEDIATION -> CERTIFIED.
  - from: REMEDIATION
    to: FAILED
    trigger: POST /footwear/training-enrollments/{id}/record-assessment
    actor: TrainingCoordinator
    preconditions:
    - enrollment.status == REMEDIATION (else ERR_INVALID_STATE)
    - payload score < 80
    side_effects:
    - attempt_count +1; last_score = score
    - enrollment.version +1
- entity: CapacityAllocation
  initial_state: OPEN
  terminal_states:
  - RECONCILED
  transitions:
  - from: OPEN
    to: LOCKED
    trigger: POST /footwear/capacity-allocations/{id}/lock
    actor: PlatformAdmin
    preconditions:
    - allocation.status == OPEN (else ERR_INVALID_STATE)
    side_effects:
    - 'capacity_waterfall computes domestic_reserved_units from demand buckets of runs already created for (factory_id, iso_week) in {PLANNED, MATERIAL_RESERVED}: GOVERNMENT first, then CUSTOM_BATCH, then
      STOCK; import_reserved_units = total_reserved_units - domestic_reserved_units'
    - for OVERSEAS factories domestic_reserved_units stays 0
    - allocation.version +1
  - from: LOCKED
    to: LOCKED
    trigger: POST /footwear/capacity-allocations/{id}/shift
    actor: PlatformAdmin
    preconditions:
    - allocation.status == LOCKED (else ERR_INVALID_STATE)
    - 'OCC: expected_allocation_version == allocation.version (ERR_STALE_ALLOCATION_VERSION)'
    - units >= 1 and units <= source bucket (source = import_reserved_units for TO_DOMESTIC, domestic_reserved_units for TO_IMPORT); equality allowed (ERR_SHIFT_EXCEEDS_SOURCE)
    - 'for TO_IMPORT: resulting domestic_reserved_units >= domestic_consumed, where domestic_consumed = sum of planned_units over runs of (factory, iso_week) in {MATERIAL_RESERVED, IN_PRODUCTION, QUALITY_HOLD,
      COMPLETED} (ERR_SHIFT_BELOW_CONSUMED)'
    side_effects:
    - 'domestic_reserved_units and import_reserved_units moved by units in the shift direction; invariant: their sum is unchanged and == total_reserved_units'
    - allocation.version +1
  - from: LOCKED
    to: RECONCILED
    trigger: POST /footwear/capacity-allocations/{id}/reconcile
    actor: PlatformAdmin
    preconditions:
    - allocation.status == LOCKED (else ERR_INVALID_STATE)
    - no run of (factory_id, iso_week) in {PLANNED, MATERIAL_RESERVED, IN_PRODUCTION, QUALITY_HOLD} (ERR_WEEK_RUNS_OPEN)
    side_effects:
    - allocation.version +1
- entity: GovContract
  initial_state: AWARDED
  terminal_states:
  - CLOSED
  - DEFAULTED
  transitions:
  - from: AWARDED
    to: IN_FULFILLMENT
    trigger: POST /footwear/gov-contracts/{id}/start-fulfillment
    actor: ComplianceOfficer
    preconditions:
    - contract.status == AWARDED (else ERR_INVALID_STATE)
    - contract.model.status == ACTIVE (ERR_MODEL_NOT_ACTIVE)
    - contract.model.production_policy == DOMESTIC_ONLY (ERR_POLICY_NOT_DOMESTIC_ONLY)
    - contract.factory.location_type == DOMESTIC and contract.factory.government_cleared == true (ERR_FACTORY_NOT_CLEARED)
    - contract.factory.status == ACTIVE (ERR_FACTORY_NOT_ACTIVE)
    - 'Berry compliance: an ACTIVE CERTIFIED report exists on a run of (contract.model_id, contract.factory_id) with us_content_pct == 100.00 (ERR_BERRY_CONTENT_NOT_PROVEN)'
    side_effects:
    - contract.version +1
  - from: IN_FULFILLMENT
    to: COMPLIANCE_AUDIT
    trigger: POST /footwear/gov-contracts/{id}/initiate-audit OR system cascade when a claim on contract.model_id becomes CHALLENGED
    actor: ComplianceOfficer | system
    preconditions:
    - contract.status == IN_FULFILLMENT (else ERR_INVALID_STATE; the cascade path silently skips contracts not IN_FULFILLMENT)
    side_effects:
    - contract.version +1
  - from: COMPLIANCE_AUDIT
    to: CLOSED
    trigger: POST /footwear/gov-contracts/{id}/complete-audit
    actor: ComplianceOfficer
    preconditions:
    - contract.status == COMPLIANCE_AUDIT (else ERR_INVALID_STATE)
    - 'audit outcome is PASS: fulfilled_units >= awarded_units AND every lot consumed by those runs carries >= 1 VERIFIED unexpired SUPPLIER_ORIGIN_CERT AND every such run carries >= 1 VERIFIED unexpired
      ASSEMBLY_LABOR_RECORD'
    side_effects:
    - fulfilled_units = sum of planned_units over COMPLETED GOVERNMENT runs matching (model_id, factory_id)
    - audit_passed = true
    - contract.version +1
  - from: COMPLIANCE_AUDIT
    to: DEFAULTED
    trigger: POST /footwear/gov-contracts/{id}/complete-audit
    actor: ComplianceOfficer
    preconditions:
    - contract.status == COMPLIANCE_AUDIT (else ERR_INVALID_STATE)
    - audit outcome is FAIL (any PASS condition unmet)
    side_effects:
    - fulfilled_units computed as above; audit_passed = false
    - contract.version +1
    note: 'complete-audit is outcome-computing, not outcome-asserting: the same endpoint lands in CLOSED or DEFAULTED depending on the evidence on file.'
concurrency_rules:
- rule_id: report-create-stale-run
  parent_entity: ProductionRun
  write_endpoint: POST /footwear/production-runs/{id}/content-reports
  occ_field: expected_run_version
  description: 'Creating a DomesticContentReport against a ProductionRun whose version has

    advanced since the client last observed it is rejected. A successful

    creation supersedes the prior ACTIVE report of the same variant (a

    legitimate supersede under the report lifecycle), so a writer holding a

    stale run version would otherwise supersede a report it never saw.

    '
  error_id: ERR_STALE_RUN_VERSION
  http_status: 412
- rule_id: allocation-shift-stale-version
  parent_entity: CapacityAllocation
  write_endpoint: POST /footwear/capacity-allocations/{id}/shift
  occ_field: expected_allocation_version
  description: 'Shifting units between the domestic and import pools of a

    CapacityAllocation whose version has advanced since the client last

    observed it is rejected. A successful shift legitimately re-splits the

    same total, so a stale writer would otherwise re-split pools it never saw

    (e.g. after a lock waterfall or a prior shift moved the buckets).

    '
  error_id: ERR_STALE_ALLOCATION_VERSION
  http_status: 412
calculations:
- name: fifo_lot_consumption
  trigger: POST /footwear/production-runs/{id}/reserve-materials
  algorithm: chronological
  formula: "for each bom_line in run.model.bom_lines (in BOM array order):\n  required_units = round_half_up_to_integer(bom_line.quantity_per_pair * run.planned_units)\n  eligible = lots where lot.component_id\
    \ == bom_line.component_id\n             and lot.quantity_remaining > 0\n             and (bom_line.sourcing_requirement != DOMESTIC_REQUIRED or lot.is_domestic == true)\n  if bom_line.sourcing_requirement\
    \ == DOMESTIC_PREFERRED:\n      order eligible as: all is_domestic == true lots first, then is_domestic == false lots\n  order each eligibility group by: lot.received_at ASC, tie-break lot.unit_cost_cents\
    \ ASC\n  consume sequentially until required_units satisfied; shortfall -> shortage error, whole reservation aborts\n  append { lot_id, component_id, units_consumed, unit_cost_cents, is_domestic } to\
    \ run.consumed_lots\n"
  input_set: MaterialLots matching the run model's BOM components; filtered by sourcing_requirement; only quantity_remaining > 0
  constants:
    REQUIRED_ROUNDING: round_half_up_to_integer
  precision: integer units
- name: content_calculation
  trigger: POST /footwear/production-runs/{id}/content-reports (variant chosen by payload); also system recompute on evidence rejection (CERTIFIED only)
  algorithm: aggregation
  formula: "# Rounding order is PINNED (mode-b): round each BOM line's extended cost to\n# integer cents first, then sum; compute the percentage last.\nif variant == PROVISIONAL:\n  for each bom_line: line_cost\
    \ = round_half_up(bom_line.quantity_per_pair * bom_line.planned_unit_cost_cents)\n  material_cost_cents        = sum(line_cost over all lines)\n  domestic_material_cost     = sum(line_cost over lines\
    \ with planned_is_domestic == true)\n  total_minutes = model.standard_stitching_minutes + standard_lasting_minutes + standard_assembly_minutes\nif variant == CERTIFIED:\n  material_cost_cents      \
    \  = round_half_up( sum(units_consumed * unit_cost_cents over run.consumed_lots) / run.planned_units )\n  domestic_material_cost     = round_half_up( sum(units_consumed * unit_cost_cents over consumed\
    \ entries with is_domestic == true) / run.planned_units )\n  total_minutes = run.actual_stitching_minutes + actual_lasting_minutes + actual_assembly_minutes\n# recompute overrides (evidence rejection):\
    \ a rejected origin cert forces its\n# lot's units into the non-domestic bucket; a rejected labor record forces\n# labor and overhead into the non-domestic bucket.\nlabor_cost_cents    = total_minutes\
    \ * factory.labor_rate_cents_per_minute\noverhead_cost_cents = factory.overhead_cents_per_pair\ntotal_cost_cents    = material_cost_cents + labor_cost_cents + overhead_cost_cents\ndomestic_value   \
    \   = domestic_material_cost + (labor_cost_cents + overhead_cost_cents if factory.location_type == DOMESTIC and labor_not_disputed else 0)\nus_content_pct      = round_half_up_2dp( 100 * domestic_value\
    \ / total_cost_cents )   # total_cost_cents == 0 -> us_content_pct = 0.00\nfinal_assembly_domestic = (factory.location_type == DOMESTIC)\n"
  input_set: 'PROVISIONAL: model BOM + standard minutes + factory rates. CERTIFIED: run.consumed_lots + actual minutes + factory rates; run must be COMPLETED.'
  constants:
    ROUNDING: round_half_up; per-line before sum; percentage last at 2dp
  precision: integer cents; percentage 2 decimal places, round_half_up
  variants:
  - name: provisional
    when: run not yet COMPLETED (also allowed after); planning-time estimate
    difference: uses BOM planned_unit_cost_cents and standard minutes — diverges from certified whenever actual lot prices or actual minutes differ from plan
  - name: certified
    when: run.status == COMPLETED (ERR_RUN_NOT_COMPLETED otherwise)
    difference: uses actual consumed lot costs and actual minutes; feeds claim substantiation, Berry checks, and model domestic pricing
- name: skill_coverage_score
  trigger: computed on read of Factory (fields skill_coverage_certified_pct / skill_coverage_pipeline_pct)
  algorithm: weighted_scoring
  formula: "for op in [STITCHING, LASTING, ASSEMBLY]:\n  required_op = REQUIRED_WORKERS_PER_RUN[op] * (count of runs at factory with status == IN_PRODUCTION)\n  if required_op == 0: coverage_op = 100 else:\n\
    \    available_certified_op = count of workers at factory with status == ACTIVE and certifications[op].cert_status == CERTIFIED\n    available_pipeline_op  = available_certified_op + PIPELINE_CREDIT\
    \ * (count of workers at factory with status == ACTIVE having an enrollment for op with status IN {ENROLLED, REMEDIATION})\n    coverage_op = min(100, round_half_up_0dp(100 * available / required_op))\n\
    score = round_half_up_1dp( coverage_STITCHING * 0.5 + coverage_LASTING * 0.3 + coverage_ASSEMBLY * 0.2 )\ncertified_only variant: uses available_certified_op  -> skill_coverage_certified_pct\npipeline_adjusted\
    \ variant: uses available_pipeline_op -> skill_coverage_pipeline_pct\n"
  input_set: Workers of the factory (status ACTIVE); runs of the factory in IN_PRODUCTION; open enrollments (ENROLLED | REMEDIATION)
  constants:
    REQUIRED_WORKERS_PER_RUN:
      STITCHING: 2
      LASTING: 1
      ASSEMBLY: 1
    OP_WEIGHTS:
      STITCHING: 0.5
      LASTING: 0.3
      ASSEMBLY: 0.2
    PIPELINE_CREDIT: 0.5
  precision: coverage_op integer (round_half_up); final score 1 decimal place, round_half_up
  variants:
  - name: certified_only
    when: always; the conservative roster view
    difference: counts only CERTIFIED certifications on ACTIVE workers
  - name: pipeline_adjusted
    when: always; the training-pipeline readiness view
    difference: adds 0.5 credit per ACTIVE worker with an open enrollment for the operation — diverges from certified_only whenever a factory has in-flight training but thin certification
- name: run_unit_cost
  trigger: POST /footwear/production-runs/{id}/complete -> run.certified_unit_cost_cents
  algorithm: tiered_pricing
  formula: "# Mode-(a) combinatorial: 4 inputs with non-linear interaction\n# (tiered rate selection keyed on planned_units, conditional exemption and\n# surcharge keyed on run_type).\nbase = per-pair actual\
    \ material (from run.consumed_lots: round_half_up(sum(units_consumed*unit_cost_cents)/planned_units))\n       + (actual_stitching_minutes + actual_lasting_minutes + actual_assembly_minutes) * factory.labor_rate_cents_per_minute\n\
    \       + factory.overhead_cents_per_pair\nif run_type == GOVERNMENT: surcharge_pct = 0.00\nelse:\n  if planned_units < 10:  surcharge_pct = 0.25\n  elif planned_units < 25: surcharge_pct = 0.15\n \
    \ elif planned_units < 50: surcharge_pct = 0.08\n  else:                    surcharge_pct = 0.00\n  if run_type == CUSTOM_BATCH: surcharge_pct += 0.05\ncertified_unit_cost_cents = round_half_up( base\
    \ * (1 + surcharge_pct) )\n"
  input_set: the completing run, its consumed lots, its factory
  constants:
    TIER_1_MAX_UNITS: 10
    TIER_2_MAX_UNITS: 25
    TIER_3_MAX_UNITS: 50
    TIER_1_PCT: 0.25
    TIER_2_PCT: 0.15
    TIER_3_PCT: 0.08
    CUSTOM_BATCH_EXTRA_PCT: 0.05
    GOVERNMENT_PCT: 0.0
  precision: integer cents, round_half_up after surcharge
- name: custom_order_price
  trigger: POST /footwear/custom-orders/{id}/accept -> order.quoted_price_cents
  algorithm: threshold
  formula: "# Mode-(c) circular-looking dependency, evaluation order PINNED:\n# the discount tier is keyed on the PRE-discount subtotal, never on the\n# discounted total. Compute subtotal -> pick tier ->\
    \ apply -> round.\nbase = model.domestic_price_cents if not null\n       else round_half_up(model.base_price_cents * CUSTOM_FALLBACK_MARKUP)\nfees = (MONOGRAM_FEE_CENTS if order.monogram present and\
    \ non-empty else 0)\n       + (COLORWAY_FEE_CENTS if order.colorway != \"STD\" else 0)\nsubtotal = base + fees                                  # per pair\nif subtotal >= DISCOUNT_TIER_1_MIN_CENTS:\
    \ discount = 0.10\nelif subtotal >= DISCOUNT_TIER_2_MIN_CENTS: discount = 0.05\nelse: discount = 0.00\nquoted_price_cents = round_half_up( subtotal * (1 - discount) ) * order.quantity_units\n"
  input_set: the order being accepted and its model's pricing fields
  constants:
    CUSTOM_FALLBACK_MARKUP: 1.15
    MONOGRAM_FEE_CENTS: 500
    COLORWAY_FEE_CENTS: 250
    DISCOUNT_TIER_1_MIN_CENTS: 20000
    DISCOUNT_TIER_1_PCT: 0.1
    DISCOUNT_TIER_2_MIN_CENTS: 12000
    DISCOUNT_TIER_2_PCT: 0.05
    MAX_CUSTOM_ORDER_UNITS: 12
  precision: integer cents, round_half_up; per-pair rounding BEFORE multiplying by quantity_units
- name: capacity_waterfall
  trigger: POST /footwear/capacity-allocations/{id}/lock
  algorithm: waterfall_allocation
  formula: "# Fills the domestic pool from domestic-line demand in strict bucket order;\n# each bucket partially fills if the pool runs out mid-bucket.\nif factory.location_type == OVERSEAS:\n  domestic_reserved_units\
    \ = 0\nelse:\n  demand[G] = sum planned_units over runs of (factory, iso_week) in {PLANNED, MATERIAL_RESERVED} with run_type == GOVERNMENT\n  demand[C] = same with run_type == CUSTOM_BATCH\n  demand[S]\
    \ = same with run_type == STOCK\n  remaining = total_reserved_units\n  domestic_reserved_units = 0\n  for bucket in [G, C, S]:   # strict priority order\n    take = min(remaining, demand[bucket])\n\
    \    domestic_reserved_units += take\n    remaining -= take\nimport_reserved_units = total_reserved_units - domestic_reserved_units\n"
  input_set: runs of (factory_id, iso_week) in {PLANNED, MATERIAL_RESERVED} at lock time, bucketed by run_type
  constants:
    BUCKET_ORDER:
    - GOVERNMENT
    - CUSTOM_BATCH
    - STOCK
  precision: integer units; no rounding (exact min arithmetic)
- name: cost_differential_pricing
  trigger: 'system: when a CERTIFIED report is created on a run whose factory is DOMESTIC -> refreshes the run model''s domestic_unit_cost_cents and domestic_price_cents (event-driven, last-created report
    wins)'
  algorithm: projection
  formula: 'model.domestic_unit_cost_cents = report.total_cost_cents

    model.domestic_price_cents = round_half_up( model.base_price_cents * report.total_cost_cents / model.import_cost_basis_cents )

    # A model with no CERTIFIED report on a DOMESTIC run keeps both fields null.

    '
  input_set: the newly created CERTIFIED report and its model
  constants: {}
  precision: integer cents, round_half_up
- name: claim_threshold_check
  trigger: POST /footwear/label-claims/{id}/substantiate; also re-evaluated by the recompute cascade (evidence rejection)
  algorithm: threshold
  formula: '# Boundary semantics are PINNED: thresholds are inclusive (>=).

    # pct is report.us_content_pct; dom = report.final_assembly_domestic.

    if claim_type == MADE_IN_USA:                      pass = dom and pct >= 95.00

    elif claim_type == MADE_IN_USA_OF_IMPORTED_MATERIALS: pass = dom and pct >= 70.00

    elif claim_type == ASSEMBLED_IN_USA:               pass = dom and pct >= 20.00

    elif claim_type == IMPORTED:                       pass = (not dom) or pct < 20.00

    # Berry (government) rule, used by GovContract start-fulfillment:

    #   berry_pass = pct == 100.00 on an ACTIVE CERTIFIED report of a run of

    #   (contract.model_id, contract.factory_id)

    '
  input_set: the claim's pinned report (CERTIFIED, ACTIVE)
  constants:
    MADE_IN_USA_MIN_PCT: 95.0
    MADE_IN_USA_OF_IMPORTED_MIN_PCT: 70.0
    ASSEMBLED_IN_USA_MIN_PCT: 20.0
    BERRY_REQUIRED_PCT: 100.0
  precision: comparison at exactly 2 decimal places as stored on the report
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers present; X-User-Role must be one of the declared roles
  error_id: ERR_MISSING_USER_CONTEXT
  http_status: 400
  applies_to: all endpoints
- priority: 2
  category: auth
  check: X-User-Role is listed in the endpoint's roles
  error_id: ERR_FORBIDDEN_ROLE
  http_status: 403
  applies_to: all endpoints
- priority: 3
  category: auth
  check: 'identity scoping: FactoryManager may hold/resume only runs of the factory whose id == X-User-ID (ERR_FACTORY_OWNERSHIP_MISMATCH); CustomProgramCustomer may create/cancel orders only with buyer_ref
    == X-User-ID (ERR_BUYER_REF_MISMATCH); evidence verify/reject requires uploaded_by != X-User-ID (ERR_SELF_ATTESTATION_FORBIDDEN)'
  error_id: ERR_FACTORY_OWNERSHIP_MISMATCH | ERR_BUYER_REF_MISMATCH | ERR_SELF_ATTESTATION_FORBIDDEN
  http_status: 403
  applies_to: run hold/resume; order create/cancel; evidence verify/reject
- priority: 4
  category: existence
  check: path ids resolved left-to-right; body-supplied FK references (model_id, factory_id, component_id, report_id, production_run_id, worker_id, claim_id, material_lot_id) must exist; bom_lines[].component_id
    must resolve
  error_id: ERR_{RESOURCE}_NOT_FOUND (ERR_FACTORY_NOT_FOUND, ERR_MODEL_NOT_FOUND, ERR_COMPONENT_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_RUN_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_CLAIM_NOT_FOUND,
    ERR_DOC_NOT_FOUND, ERR_WORKER_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND)
  http_status: 404
  applies_to: all endpoints
- priority: 5
  category: business_constraint
  check: 'request schema and simple semantics: required fields present; enums valid; numeric ranges honored (planned_units >= 1, quantity_units 1..12, score 0..100, units >= 1, target_level 1..3); end_day
    > start_day; valid_until > valid_from; fulfillment_end > fulfillment_start; exactly one evidence link set (ERR_DOC_LINK_AMBIGUOUS); clock may not move backwards (ERR_CLOCK_REGRESSION)'
  error_id: ERR_INVALID_REQUEST | ERR_DOC_LINK_AMBIGUOUS | ERR_CLOCK_REGRESSION
  http_status: 400
  applies_to: all endpoints
- priority: 6
  category: state
  check: 'target and cross-entity state preconditions: run/factory/model/report/claim/doc/worker/enrollment/allocation/contract in the state required by the transition (incl. run.model ACTIVE, run.factory
    ACTIVE, report CERTIFIED+ACTIVE for substantiate, allocation LOCKED for reserve/shift, contract AWARDED for start-fulfillment)'
  error_id: ERR_INVALID_STATE | ERR_FACTORY_NOT_ACTIVE | ERR_MODEL_NOT_ACTIVE | ERR_REPORT_NOT_CERTIFIED | ERR_REPORT_NOT_ACTIVE | ERR_RUN_NOT_COMPLETED | ERR_RUN_NOT_READY | ERR_ALLOCATION_NOT_LOCKED |
    ERR_WORKER_NOT_ACTIVE
  http_status: 409
  applies_to: all state-transition and state-dependent endpoints
- priority: 7
  category: business_safety
  check: 'regulatory/compliance, in this order: report-to-claim model match (ERR_REPORT_MODEL_MISMATCH — a claim may not be substantiated by another model''s report); claim_threshold_check for substantiate
    (ERR_CONTENT_THRESHOLD_NOT_MET); Berry 100.00% rule for start-fulfillment (ERR_BERRY_CONTENT_NOT_PROVEN); GOVERNMENT runs only on DOMESTIC government_cleared factories (ERR_GOV_RUN_REQUIRES_CLEARED_DOMESTIC_FACTORY);
    production_policy direction (ERR_POLICY_FORBIDS_IMPORT | ERR_POLICY_FORBIDS_DOMESTIC); contract start requires DOMESTIC_ONLY model (ERR_POLICY_NOT_DOMESTIC_ONLY) and cleared domestic factory (ERR_FACTORY_NOT_CLEARED);
    custom program is domestic-only (ERR_CUSTOM_REQUIRES_DOMESTIC)'
  error_id: ERR_REPORT_MODEL_MISMATCH | ERR_CONTENT_THRESHOLD_NOT_MET | ERR_BERRY_CONTENT_NOT_PROVEN | ERR_GOV_RUN_REQUIRES_CLEARED_DOMESTIC_FACTORY | ERR_POLICY_FORBIDS_IMPORT | ERR_POLICY_FORBIDS_DOMESTIC
    | ERR_POLICY_NOT_DOMESTIC_ONLY | ERR_FACTORY_NOT_CLEARED | ERR_CUSTOM_REQUIRES_DOMESTIC
  http_status: 422
  applies_to: substantiate, start-fulfillment, run create, order create, order schedule
- priority: 8
  category: business_temporal
  check: 'interval and freshness: production-line half-open window overlap at reserve (ERR_LINE_WINDOW_CONFLICT); contract closed-interval overlap at create (ERR_GOV_CONTRACT_WINDOW_CONFLICT); evidence
    freshness at publish (ERR_EVIDENCE_STALE)'
  error_id: ERR_LINE_WINDOW_CONFLICT | ERR_GOV_CONTRACT_WINDOW_CONFLICT | ERR_EVIDENCE_STALE
  http_status: 409
  applies_to: reserve-materials, gov-contract create, claim publish
- priority: 9
  category: business_constraint
  check: 'structural: FIFO material availability (ERR_MATERIAL_SHORTAGE | ERR_DOMESTIC_MATERIAL_SHORTAGE); workforce headcount at start/resume (ERR_WORKFORCE_SHORTFALL); uniqueness of style_code / contract_number
    / open claim per (model_id, claim_type) / allocation per (factory_id, iso_week) / open enrollment per (worker_id, operation); order-to-run model match (ERR_MODEL_MISMATCH); CUSTOM_BATCH run type (ERR_NOT_A_CUSTOM_RUN);
    open-run / published-claim guards on discontinue'
  error_id: ERR_MATERIAL_SHORTAGE | ERR_DOMESTIC_MATERIAL_SHORTAGE | ERR_WORKFORCE_SHORTFALL | ERR_STYLE_CODE_EXISTS | ERR_CONTRACT_NUMBER_EXISTS | ERR_CLAIM_ALREADY_EXISTS | ERR_ALLOCATION_ALREADY_EXISTS
    | ERR_ENROLLMENT_ALREADY_OPEN | ERR_MODEL_MISMATCH | ERR_NOT_A_CUSTOM_RUN | ERR_MODEL_HAS_OPEN_RUNS | ERR_MODEL_HAS_PUBLISHED_CLAIMS
  http_status: 409
  applies_to: create/reserve/start/resume/substantiate/schedule/discontinue endpoints as applicable
- priority: 10
  category: business_referential
  check: 'required linked evidence present at substantiate: >= 1 VERIFIED unexpired SUPPLIER_ORIGIN_CERT and >= 1 VERIFIED unexpired ASSEMBLY_LABOR_RECORD attached to the claim'
  error_id: ERR_REQUIRED_EVIDENCE_MISSING
  http_status: 422
  applies_to: POST /footwear/label-claims/{id}/substantiate
- priority: 11
  category: business_fiscal
  check: 'capacity and pool arithmetic: weekly allocation total within factory capacity (ERR_TOTAL_EXCEEDS_WEEKLY_CAPACITY); reserve pool check (ERR_CAPACITY_WEEK_EXCEEDED); order-slot pool (ERR_RUN_ORDER_CAPACITY_EXCEEDED);
    shift within source bucket and above consumed floor (ERR_SHIFT_EXCEEDS_SOURCE | ERR_SHIFT_BELOW_CONSUMED); week free of non-terminal runs at reconcile (ERR_WEEK_RUNS_OPEN)'
  error_id: ERR_TOTAL_EXCEEDS_WEEKLY_CAPACITY | ERR_CAPACITY_WEEK_EXCEEDED | ERR_RUN_ORDER_CAPACITY_EXCEEDED | ERR_SHIFT_EXCEEDS_SOURCE | ERR_SHIFT_BELOW_CONSUMED | ERR_WEEK_RUNS_OPEN
  http_status: 422
  applies_to: allocation create/lock/shift/reconcile, reserve-materials, order schedule
- priority: 12
  category: state
  check: 'OCC preconditions: expected_run_version == run.version on report create (ERR_STALE_RUN_VERSION, 412); expected_allocation_version == allocation.version on shift (ERR_STALE_ALLOCATION_VERSION,
    412)'
  error_id: ERR_STALE_RUN_VERSION | ERR_STALE_ALLOCATION_VERSION
  http_status: 412
  applies_to: POST /footwear/production-runs/{id}/content-reports, POST /footwear/capacity-allocations/{id}/shift
endpoints:
- method: POST
  path: /_clock/set_current_utc
  description: 'Advance the logical clock. The server default before any call is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock. Moving backwards is rejected (ERR_CLOCK_REGRESSION). Side
    effect: evidence documents whose valid_until is now in the past transition VERIFIED -> EXPIRED.'
  roles:
  - PlatformAdmin
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: string
  side_effects:
  - evidence expiry sweep (VERIFIED -> EXPIRED where valid_until < new clock date)
- method: POST
  path: /footwear/factories
  description: Create a factory (status ACTIVE, version 1)
  roles:
