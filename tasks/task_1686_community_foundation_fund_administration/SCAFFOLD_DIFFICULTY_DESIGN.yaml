              payload: { fund_id: "${fg_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 50000.00 }
              as: GiftOfficer
              captures: { fg_c: $.data.id }
            - call: "POST /contributions/${fg_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${fg_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /funds/${fg_id}/advisors"
              payload: { advisor_name: "Ada Advisor", email: "ada@x.com", advisor_kind: "PRIMARY" }
              as: FoundationAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /advisors/${a1_id}/accept"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /grantees"
              payload: { legal_name: "Loop Grantee", tax_id: "222333444", irs_subsection: "C3_501" }
              as: ComplianceOfficer
              captures: { gg_id: $.data.id }
            - call: "POST /grantees/${gg_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /grantees/${gg_id}/clear"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /funds/${fg_id}"
              as: FoundationAdmin
