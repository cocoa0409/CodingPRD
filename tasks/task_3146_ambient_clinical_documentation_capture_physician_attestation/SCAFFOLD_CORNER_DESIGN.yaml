  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: corner_patch_response_immediately_reflects_recompute
        claim_type: immediate_consistency
        grounds:
          - calculations.note_completeness_score
        distinguishing_aspect: "Immediate consistency: the PATCH response itself carries the recomputed completeness_score — no re-read needed to observe the effect."
        test_recipe:
          setup: ["Draft on CRITICAL+MINOR template, all fields empty (score 49)"]
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-CM1-1", full_name: "Pat Cm1" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-CM1-1", full_name: "Doc Cm1", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/note-templates"
              payload: { specialty_code: "CARD", template_version: "cm1", field_specs: [{ key: "chief_complaint", importance: "CRITICAL", required: true }, { key: "ros", importance: "MINOR", required: true }] }
              as: PlatformAdmin
              captures: { tpl: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "ROOM_SIGNAGE" }
              as: Patient
              as_user_id: "${pat}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_audio/simulate-transcription"
              payload: { audio_capture_id: "${cap}" }
              as: PlatformAdmin
            - call: "GET /ambient-clinical-documentation/encounters/${enc}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { enc_v: "$.data.version" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/note-drafts"
              payload: { template_id: "${tpl}", expected_encounter_version: "${enc_v}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { draft: "$.data.id", draft_v: "$.data.version" }
          trigger:
            - call: "PATCH /ambient-clinical-documentation/note-drafts/${draft}"
              payload: { expected_note_draft_version: "${draft_v}", field_updates: [{ field_key: "chief_complaint", field_value: "fever" }] }
              as: Physician
              as_user_id: "${phy}"
              captures: { score_inline: "$.data.completeness_score" }
          assert:
            - "score_inline == 95 in the PATCH response body itself (missing MINOR ros: 100-5), and version == 2"
