              payload: { order_id: "${o1_id}", carrier_name: "Gulf Freight", erection_stage: "PRIMARY_FRAME", component_marks: ["C-1", "C-2"], unload_window_start: "2026-09-18T08:00:00Z", unload_window_end: "2026-09-18T12:00:00Z", expected_order_version: "${o1_v_after_anch}" }
              as: LogisticsCoordinator
              captures: { load_prim_id: $.data.id }
          trigger:
            - call: "POST /shipment-loads/${load_prim_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /orders/${o1_id}/erection-sequence"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /shipment-loads/${load_anch_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /shipment-loads/${load_prim_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /orders/${o1_id}/erection-sequence"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "the first dispatch of ${load_prim_id} returns 409 with data.error_id == ERR_ERECTION_SEQUENCE_VIOLATION, not ERR_LOT_NOT_COMPLETE — the PRIMARY_FRAME_FAB lot is COMPLETE"
            - "ShipmentLoad.${load_prim_id}.status is still PLANNED with dispatched_at == null"
            - "the first erection-sequence read returns sequence \"ANCHORAGE>PRIMARY_FRAME\", next_dispatchable_stage ANCHORAGE, planned_load_count 2, dispatched_load_count 0 and blocked_load_count 1"
            - "dispatching ${load_anch_id} returns 200 with status DISPATCHED"
            - "the retry on ${load_prim_id} then returns 200 — a DISPATCHED predecessor no longer blocks"
            - "the second erection-sequence read returns next_dispatchable_stage NONE, planned_load_count 0, dispatched_load_count 2 and blocked_load_count 0"

      - name: quote_acceptance_past_the_builders_credit_ceiling_is_refused_with_402
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BUILDER_CREDIT_EXCEEDED]
          - calculations.builder_credit_ledger
        distinguishing_aspect: "The credit gate is the only 402 in the surface and it compares the whole quoted price against credit_available_cents with <=: a BRONZE builder holding a 5,000,000 c ceiling is refused an 8,854,873 c order, while a second builder whose ceiling is exactly 8,854,873 c accepts it and lands on credit_available_cents == 0."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS (freight_zone 3, max_authorized_builders 2)."
            - "Two AUTHORIZED BRONZE builders in TX-GULF: b_poor with credit_limit_cents 5000000 and b_rich with credit_limit_cents 8854873."
            - "Each owns an identical LOCKED configuration (100 ft clear span, 25 ft bays x 4, 24 ft eave, 1:12, PBR/POLAR_WHITE, R-19, estimated_frame_weight_lbs 49680.00) and no accessory kits, so both quotes price to 8854873 c at 240 freight miles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Thin Margin Builders", tier: "BRONZE", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { b_poor_id: $.data.id }
            - call: "POST /builders/${b_poor_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Exact Ceiling Builders", tier: "BRONZE", credit_limit_cents: 8854873 }
              as: PlatformAdmin
              captures: { b_rich_id: $.data.id }
            - call: "POST /builders/${b_rich_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b_poor_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg_poor_id: $.data.id }
            - call: "POST /building-configurations/${cfg_poor_id}/lock"
              payload: {}
              as: SalesEngineer
            - call: "POST /building-configurations"
              payload: { builder_id: "${b_rich_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg_rich_id: $.data.id }
            - call: "POST /building-configurations/${cfg_rich_id}/lock"
              payload: {}
              as: SalesEngineer
            - call: "POST /quotes"
              payload: { builder_id: "${b_poor_id}", configuration_id: "${cfg_poor_id}", freight_distance_miles: 240, adjustment_cents: 0 }
              as: SalesEngineer
              captures: { q_poor_id: $.data.id }
            - call: "POST /quotes/${q_poor_id}/issue"
              payload: {}
              as: SalesEngineer
            - call: "POST /quotes"
              payload: { builder_id: "${b_rich_id}", configuration_id: "${cfg_rich_id}", freight_distance_miles: 240, adjustment_cents: 0 }
              as: SalesEngineer
              captures: { q_rich_id: $.data.id }
            - call: "POST /quotes/${q_rich_id}/issue"
              payload: {}
              as: SalesEngineer
          trigger:
            - call: "POST /quotes/${q_poor_id}/accept"
              payload: { job_site_code: "SITE-P", requested_erection_start_date: "2026-09-15T00:00:00Z" }
              as: Builder
              as_user_id: "${b_poor_id}"
            - call: "POST /quotes/${q_rich_id}/accept"
              payload: { job_site_code: "SITE-R", requested_erection_start_date: "2026-09-15T00:00:00Z" }
              as: Builder
              as_user_id: "${b_rich_id}"
              captures: { o_rich_id: $.data.id }
          assert:
            - "both quotes carry quoted_price_cents == 8854873 with subtotal_cents 8693910, freight_cost_cents 160963 and total_discount_rate 0.00 (BRONZE 0.00 plus volume 0.00 below the 25000000 c tier)"
            - "the b_poor acceptance returns 402 with data.error_id == ERR_BUILDER_CREDIT_EXCEEDED"
            - "Builder.${b_poor_id} still reads credit_used_cents 0 and credit_available_cents 5000000, and Quote.${q_poor_id}.status is still ISSUED with accepted_at == null"
            - "no Order exists for ${q_poor_id}: GET /orders?quote_id=${q_poor_id} returns 0 rows"
            - "the b_rich acceptance returns 201 as ${o_rich_id}, because 8854873 <= 8854873 satisfies the gate"
            - "Builder.${b_rich_id} then reads credit_used_cents 8854873 and credit_available_cents 0, preserving used + available == limit"

      - name: configuration_must_be_locked_before_a_design_exists
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONFIGURATION_NOT_LOCKED]
        excluded_because:
          difficulty_instance: design_create_requires_configuration_locked
          rationale: "That §1.8 instance already drives POST /engineering-designs against a DRAFT configuration and asserts the 409 ERR_CONFIGURATION_NOT_LOCKED, then repeats the call after the lock to show the same payload succeeding."

      - name: release_needs_a_sealed_drawing_package
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DRAWINGS_NOT_SEALED]
        excluded_because:
          difficulty_instance: release_requires_drawing_package_sealed
          rationale: "That §1.8 instance releases an order whose package is still PENDING and asserts the 409 ERR_DRAWINGS_NOT_SEALED, so a duplicate positive trigger here would add nothing."

      - name: dispatch_needs_the_matching_lot_complete
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LOT_NOT_COMPLETE]
        excluded_because:
          difficulty_instance: dispatch_requires_matching_production_lot_complete
          rationale: "That §1.8 instance dispatches a PRIMARY_FRAME load while its PRIMARY_FRAME_FAB lot is only SCHEDULED and asserts the 409 ERR_LOT_NOT_COMPLETE, including the stage-to-lot-type mapping."

      - name: seal_needs_both_a_knee_and_a_base_detail
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONNECTION_DETAILS_INCOMPLETE]
        excluded_because:
          difficulty_instance: connection_details_incomplete_beats_seal_license_mismatch
          rationale: "That §1.8 priority-pair instance seals a design missing its BASE detail and asserts 422 ERR_CONNECTION_DETAILS_INCOMPLETE wins over the licence mismatch, which is a strictly stronger check than a bare trigger."

      - name: an_expired_quote_cannot_be_accepted
        claim_type: error_triggerable
        grounds:
          - errors[ERR_QUOTE_EXPIRED]
        excluded_because:
          difficulty_instance: quote_expired_beats_credit_exceeded_on_accept
          rationale: "That §1.8 instance moves the clock past valid_until and asserts 422 ERR_QUOTE_EXPIRED is returned ahead of the credit gate, which covers the trigger and its precedence together."

      - name: a_territory_admits_only_its_authorized_builder_quota
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TERRITORY_BUILDER_LIMIT]
        excluded_because:
          difficulty_instance: territory_builder_limit_boundary_at_second_and_third_authorization
          rationale: "That §1.8 boundary instance authorizes the second builder successfully and the third with 409 ERR_TERRITORY_BUILDER_LIMIT, so the trigger is already exercised at its exact edge."

      - name: a_design_cannot_be_revised_a_fourth_time
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REVISION_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: revision_limit_boundary_at_third_and_fourth_revise
          rationale: "That §1.8 boundary instance performs the third revise successfully and the fourth with 409 ERR_REVISION_LIMIT_REACHED against MAX_DESIGN_REVISIONS 3."

      - name: a_line_window_cannot_be_double_booked
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LINE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: production_line_half_open_window_with_paint_changeover_buffer
          rationale: "That §1.8 instance drives the half-open window and the colour changeover buffer on both sides, asserting 409 ERR_LINE_WINDOW_CONFLICT for the buffered collision and 201 for the abutting same-colour lot."

      - name: a_site_cannot_take_more_trucks_than_its_capacity
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SITE_UNLOAD_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: site_unload_closed_window_aggregate_capacity
          rationale: "That §1.8 instance fills a job site to its site_delivery_capacity with closed, endpoint-touching windows and asserts the aggregate 409 ERR_SITE_UNLOAD_CAPACITY_EXCEEDED on the next load."

      - name: a_quote_discount_deeper_than_the_adjustment_floor_is_refused
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ADJUSTMENT_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: adjustment_floor_at_exactly_twenty_percent_of_subtotal
          rationale: "That §1.8 boundary instance accepts an adjustment of exactly -20 percent of subtotal_cents and rejects one cent deeper with 422 ERR_ADJUSTMENT_LIMIT_EXCEEDED."

  - section: rbac
    instances:
      - name: requests_without_valid_role_headers_are_rejected_before_every_other_check
        claim_type: role_cannot_perform_others_operations
        grounds:
          - validations[priority=1, error_id=ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication sits at priority 1, ahead of role checks, body validation and existence: a call with no X-User-Role, with no X-User-ID, or with a role outside the eight declared ones is 401 ERR_UNAUTHENTICATED even when the target id does not exist, so it never degrades into a 404 or a 400."
        test_recipe:
          setup:
            - "One jurisdiction exists so that the fully-headed control call has something real to read."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
          trigger:
            - call: "GET /jurisdictions/${j1_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /jurisdictions/${j1_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /jurisdictions/${j1_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /jurisdictions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
            - call: "GET /jurisdictions/${j1_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "call 1 is issued with the X-User-Role header omitted entirely and returns 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "call 2 is issued with the X-User-ID header omitted and returns 401 ERR_UNAUTHENTICATED — both headers are mandatory"
            - "call 3 is issued with X-User-Role: PlantForeman, a role outside the eight declared ones, and returns 401 ERR_UNAUTHENTICATED rather than 403 ERR_FORBIDDEN_ROLE"
            - "call 4 is issued with no X-User-Role against an id that does not exist and still returns 401 ERR_UNAUTHENTICATED, not ERR_JURISDICTION_NOT_FOUND — priority 1 beats priority 4"
            - "call 5 carries both headers and returns 200 with data.code == TX-HARRIS, proving the endpoint itself is reachable"

      - name: operational_roles_cannot_reach_platform_admin_endpoints
        claim_type: role_cannot_perform_others_operations
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - validations[priority=2, error_id=ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Role enforcement sits at priority 2, ahead of body validation: a LogisticsCoordinator posting a production line is 403 ERR_FORBIDDEN_ROLE, and it stays 403 even when the body carries an unknown line_type that would otherwise be 400 ERR_INVALID_REQUEST. The same three endpoints answer normally for PlatformAdmin."
        test_recipe:
          setup:
            - "Empty database; only the acting role varies between the rejected and the accepted calls."
          setup_api_calls: []
          trigger:
            - call: "POST /production-lines"
              payload: { code: "PL-9", name: "Panel Line 9", line_type: "PANEL_ROLL" }
              as: LogisticsCoordinator
            - call: "POST /production-lines"
              payload: { code: "PL-9", name: "Panel Line 9", line_type: "LASER_TABLE" }
              as: LogisticsCoordinator
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: ProductionPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Engineer
            - call: "POST /production-lines"
              payload: { code: "PL-9", name: "Panel Line 9", line_type: "PANEL_ROLL" }
              as: PlatformAdmin
              captures: { pl9_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
          assert:
            - "all four non-admin calls return 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "the LASER_TABLE body is still 403, not 400 ERR_INVALID_REQUEST — priority 2 is evaluated before priority 3"
            - "no ProductionLine and no Jurisdiction row was created by the rejected calls, and the logical clock still reads the 2026-08-01T00:00:00Z startup default"
            - "the PlatformAdmin repeats return 201 for ${pl9_id} and ${j1_id}, so PL-9 was never taken by the rejected attempt"

      - name: sales_engineer_cannot_seal_and_sealing_engineer_cannot_quote
        claim_type: peer_roles
        grounds:
          - roles.SalesEngineer.exclusive_operations
          - roles.SealingEngineer.exclusive_operations
          - complexity_profile.role_model
        distinguishing_aspect: "The role model is peer, not hierarchical: neither of the two commercial and permitting roles can perform the other's exclusive write, and the 403 lands before the referenced ids are even resolved. Both roles nonetheless share every GET."
        test_recipe:
          setup:
            - "One jurisdiction exists for the shared read; the write payloads deliberately reference ids that do not exist."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
          trigger:
            - call: "POST /drawing-packages"
              payload: { design_id: "00000000-0000-4000-8000-000000000000", jurisdiction_id: "${j1_id}", sealing_license_state: "TX", sheet_count: 24 }
              as: SalesEngineer
            - call: "POST /quotes"
              payload: { builder_id: "00000000-0000-4000-8000-000000000000", configuration_id: "00000000-0000-4000-8000-000000000000", freight_distance_miles: 240 }
              as: SealingEngineer
            - call: "POST /building-configurations"
              payload: { builder_id: "00000000-0000-4000-8000-000000000000", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SealingEngineer
            - call: "GET /jurisdictions/${j1_id}"
              payload: {}
              as: SalesEngineer
            - call: "GET /jurisdictions/${j1_id}"
              payload: {}
              as: SealingEngineer
            - call: "GET /drawing-packages"
              payload: { limit: 5 }
              as: SalesEngineer
          assert:
            - "the SalesEngineer package attempt returns 403 ERR_FORBIDDEN_ROLE, not 404 ERR_DESIGN_NOT_FOUND"
            - "the SealingEngineer quote attempt returns 403 ERR_FORBIDDEN_ROLE, not 404 ERR_BUILDER_NOT_FOUND"
            - "the SealingEngineer configuration attempt returns 403 ERR_FORBIDDEN_ROLE — configuring buildings is the SalesEngineer's exclusive write"
            - "both shared reads return 200 with identical data payloads, and GET /drawing-packages returns 200 with an empty list for the SalesEngineer"
            - "no DrawingPackage, Quote or BuildingConfiguration row was created"

      - name: builder_cannot_accept_a_quote_issued_to_another_builder
        claim_type: peer_roles
        grounds:
          - validations[priority=8, error_id=ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.Builder.identity
        distinguishing_aspect: "The Builder role is entity_backed, so authorization is per-row: acting X-User-ID must equal quote.builder_id. A second authorized builder in the same territory is refused with 403 ERR_NOT_RESOURCE_OWNER, and a SalesEngineer — who created the quote — cannot accept it at all."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS with max_authorized_builders 2; two AUTHORIZED SILVER builders b1 and b2, both with 200000000 c ceilings."
            - "cfg1 belongs to b1 and is LOCKED; quote q1 is ISSUED to b1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Bayou Erectors", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /builders/${b2_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg1_id: $.data.id }
            - call: "POST /building-configurations/${cfg1_id}/lock"
              payload: {}
              as: SalesEngineer
            - call: "POST /quotes"
              payload: { builder_id: "${b1_id}", configuration_id: "${cfg1_id}", freight_distance_miles: 240, adjustment_cents: 0 }
              as: SalesEngineer
              captures: { q1_id: $.data.id }
            - call: "POST /quotes/${q1_id}/issue"
              payload: {}
              as: SalesEngineer
          trigger:
            - call: "POST /quotes/${q1_id}/accept"
              payload: { job_site_code: "SITE-B2", requested_erection_start_date: "2026-09-15T00:00:00Z" }
              as: Builder
              as_user_id: "${b2_id}"
            - call: "POST /quotes/${q1_id}/accept"
              payload: { job_site_code: "SITE-SE", requested_erection_start_date: "2026-09-15T00:00:00Z" }
              as: SalesEngineer
            - call: "POST /quotes/${q1_id}/accept"
              payload: { job_site_code: "SITE-A", requested_erection_start_date: "2026-09-15T00:00:00Z" }
              as: Builder
              as_user_id: "${b1_id}"
              captures: { o1_id: $.data.id }
          assert:
            - "b2's acceptance returns 403 with data.error_id == ERR_NOT_RESOURCE_OWNER even though b2 is AUTHORIZED in the same territory"
            - "the SalesEngineer's acceptance returns 403 with data.error_id == ERR_FORBIDDEN_ROLE — accepting is the Builder's exclusive operation"
            - "after both refusals Quote.${q1_id}.status is still ISSUED and Builder.${b2_id}.credit_used_cents == 0"
            - "b1's acceptance returns 201 as ${o1_id} with builder_id == ${b1_id} and job_site_code SITE-A"
            - "the ownership check is per-row, not per-territory: b2 was refused on ${q1_id} but could still accept a quote issued to itself"

      - name: the_submitting_engineer_must_not_review_their_own_design
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=7, error_id=ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - complexity_profile.role_model
        distinguishing_aspect: "Holding the EngineeringManager role is not sufficient: the review is refused with 403 ERR_SEGREGATION_OF_DUTIES when the acting X-User-ID equals design.submitted_by_user_id, and the identical call from a different user id succeeds. The check reads the stored submitter, so it survives across requests."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS; AUTHORIZED SILVER builder; LOCKED cfg1."
            - "Design d1 carries C-1, KNEE K-1 and BASE B-1 and was submitted by user u_eng_1, so submitted_by_user_id == u_eng_1 and status == SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
