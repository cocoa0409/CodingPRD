            - { call: "POST /assignments", payload: { mariner_id: "${m1_id}", manning_slot_id: "${s_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-08-10T00:00:00Z", planned_relief_date: "2026-11-10T00:00:00Z", local_join: false }, as: CrewingManager, captures: { a1_id: $.data.id } }
            - { call: "POST /assignments/${a1_id}/confirm", payload: {}, as: CrewingManager, captures: { a1_c_status: $.data.assignment_status, a1_c_travel: $.data.travel_status } }
            - { call: "POST /assignments/${a1_id}/travel-bookings", payload: { direction: "JOIN", payer: "VESSEL_OWNER", legs: [ { carrier: "UA", from_port: "SFO", to_port: "SIN", depart_at: "2026-08-09T10:00:00Z", arrive_at: "2026-08-10T02:00:00Z", base_fare_cents: 10000, markup_bps: 500 } ] }, as: CrewingManager, captures: { tb_id: $.data.id } }
            - { call: "POST /assignments/${a1_id}/travel-bookings/${tb_id}/book", payload: {}, as: CrewingManager }
