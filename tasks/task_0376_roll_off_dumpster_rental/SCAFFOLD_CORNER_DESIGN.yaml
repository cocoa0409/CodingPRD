  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_dispatch_stale_container_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispatch-delivery-stale-container]
          - errors[ERR_STALE_CONTAINER_VERSION]
        distinguishing_aspect: |
          A dispatch carrying expected_container_version equal to the can's
          creation version (1) after a retire+restore advanced it to 3, while the
          can is back IN_YARD, is rejected with 412 ERR_STALE_CONTAINER_VERSION.
        test_recipe:
          setup: ["A container created (version 1), retired then restored (now IN_YARD at version 3); a BOOKED order; the dispatcher still holds the stale version 1"]
          setup_api_calls:
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Occ1", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-OC1", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v0: $.data.version }
            - call: "POST /containers/${cont}/retire-asset"
              payload: {}
              as: YardAdmin
            - call: "POST /containers/${cont}/restore-asset"
              payload: {}
              as: YardAdmin
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "30 Main", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v0}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 412"
            - "trigger response data.error_id == ERR_STALE_CONTAINER_VERSION"
            - "RentalOrder.${ord}.logistics_status == BOOKED"

      - name: occ_dispatch_fresh_container_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispatch-delivery-stale-container]
          - entities.Container.fields.version
        distinguishing_aspect: "Re-reading the container after retire+restore (version 3) and dispatching with the fresh expected_container_version succeeds, advancing version to 4 and committing the can."
        test_recipe:
          setup: ["Same as occ_dispatch_stale_container_version but the dispatcher re-reads the fresh version 3 before dispatching"]
          setup_api_calls:
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Occ2", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-OC2", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id }
            - call: "POST /containers/${cont}/retire-asset"
              payload: {}
              as: YardAdmin
            - call: "POST /containers/${cont}/restore-asset"
              payload: {}
              as: YardAdmin
              captures: { cont_v_fresh: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "31 Main", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v_fresh}" }
              as: Dispatcher
              captures: { ls: $.data.logistics_status }
          assert:
            - "trigger response status == 200"
            - "RentalOrder.${ord}.logistics_status == SCHEDULED"
            - "Container.${cont}.status == ASSIGNED"
            - "Container.${cont}.current_order_id == ${ord}"

      - name: occ_route_stale_version_on_second_append
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[route-add-stop-stale-route]
          - errors[ERR_STALE_ROUTE_VERSION]
        distinguishing_aspect: |
          After appending stop A with expected_route_version equal to the route's
          create version (1) bumps it to 2, appending stop B still carrying the stale
          version 1 is rejected with 412 ERR_STALE_ROUTE_VERSION.
        test_recipe:
          setup: ["Two BOOKED orders with UNASSIGNED DELIVERY stops; a PLANNING route at version 1"]
          setup_api_calls:
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
