    - state_machines.Loan.UNDERWRITTEN_to_DELIVERED
    distinguishing_aspect: 'All changes are atomic per request: a GET immediately after delivery shows the loan DELIVERED, the pool balance incremented, and the pipeline value dropped, with no lag.'
