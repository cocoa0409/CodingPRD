          assert:
            - "${a1_access0} == UNVERIFIED and ${a1_disp0} == PENDING"
            - "${a1_access1} == CATALOG_DISCLOSED and ${a1_disp1} == PENDING (approval moves only the disclosure dimension)"
            - "${el_status0} == DRAFT and ${el_status1} == SUBMITTED"
            - "${a1_access2} == CATALOG_DISCLOSED and ${a1_disp2} == ELECTED (SUBMIT moves only the disposition dimension)"
            - "${a1_access3} == ACCESS_REVOKED and ${a1_disp3} == ELECTED (revocation does not reset the disposition dimension)"
            - "${disclosed_end} == 0, ${pending_end} == 1, ${disposed_end} == 0"
            - "Estate.${est_id}.inventory_total_count == 1 and inventory_total_count == ${pending_end} + ${disposed_end}"
            - "${phase_end} == AUTHORIZED"
            - "DispositionElection.${el_id}.status == SUBMITTED and executed_at is null"

      - name: estate_close_pins_the_phase_and_suppresses_further_derivation
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Estate.transitions[WIND_DOWN->CLOSED]
          - validations[priority=28]
        excluded_because:
          difficulty_instance: estate_phase_walks_back_from_wind_down_to_disclosure_then_pins_at_closed
          rationale: "The named §1.8 instance drives the estate through WIND_DOWN -> DISCLOSURE -> WIND_DOWN -> CLOSED and asserts both the pinning of CLOSED and the ERR_ESTATE_CLOSED lockdown of later writes."

  # ===========================================================================
  - section: calculations
    instances:

      - name: authority_resolution_returns_the_statutory_default_and_the_suspended_gate
        claim_type: Correct Result
        grounds:
          - calculations.platform_authority_precedence
          - endpoints[GET /estates/{estate_id}/authority-resolution]
        distinguishing_aspect: |
          With an empty candidate set the projection returns CATALOG_ONLY with basis
          STATUTORY_DEFAULT, clamp_reason NONE and controlling_directive_id null — never content —
          and once the platform is PATCHed to SUSPENDED step 0 short-circuits the whole ladder to
          resolved_scope NONE while still reporting basis STATUTORY_DEFAULT.
        test_recipe:
          setup:
            - "one PARTICIPATING SOCIAL platform"
            - "one Estate with no AuthorityDirective rows at all"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "SocialSphere", platform_type: "SOCIAL", form_code: "SS-FORM-2", review_window_days: 30, refund_policy: "NONE", supports_online_tool: true, supports_transfer: false, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: true, license_terminates_at_death: true, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_social_id: $.data.id, p_status0: $.data.status }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C20" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
          trigger:
            - call: "GET /estates/${est_id}/authority-resolution"
              payload: { platform_id: "${p_social_id}" }
              as: EstateAdmin
              captures: { r1_scope: $.data.resolved_scope, r1_basis: $.data.resolved_basis, r1_clamp: $.data.clamp_reason, r1_dir: $.data.controlling_directive_id }
            - call: "GET /estates/${est_id}/authority-resolution"
              payload: { platform_id: "${p_social_id}", asset_category: "SOCIAL_PROFILE" }
              as: EstateAdmin
              captures: { r2_scope: $.data.resolved_scope, r2_basis: $.data.resolved_basis, r2_cat: $.data.asset_category }
            - call: "PATCH /platforms/${p_social_id}"
              payload: { status: "SUSPENDED" }
              as: EstateAdmin
              captures: { p_status1: $.data.status }
            - call: "GET /estates/${est_id}/authority-resolution"
              payload: { platform_id: "${p_social_id}" }
              as: EstateAdmin
              captures: { r3_scope: $.data.resolved_scope, r3_basis: $.data.resolved_basis, r3_clamp: $.data.clamp_reason, r3_dir: $.data.controlling_directive_id }
          assert:
            - "${p_status0} == PARTICIPATING"
            - "${r1_scope} == CATALOG_ONLY, ${r1_basis} == STATUTORY_DEFAULT, ${r1_clamp} == NONE, ${r1_dir} is null"
            - "${r2_scope} == CATALOG_ONLY and ${r2_basis} == STATUTORY_DEFAULT and ${r2_cat} == SOCIAL_PROFILE"
            - "${p_status1} == SUSPENDED"
            - "${r3_scope} == NONE, ${r3_basis} == STATUTORY_DEFAULT, ${r3_clamp} == NONE, ${r3_dir} is null"
            - "the projection is read-only: Estate.${est_id}.version is unchanged by all three resolution reads"
            - "GET /estates/${est_id}/authority-resolution with an unknown platform_id returns HTTP 404 with error_id ERR_PLATFORM_NOT_FOUND"

      - name: an_online_tool_directive_is_dropped_when_the_platform_offers_no_tool
        claim_type: Input Set Filtering
        grounds:
          - calculations.platform_authority_precedence
          - validations[priority=46]
          - entities.Platform.fields.supports_online_tool
        distinguishing_aspect: |
          A rank-1 ONLINE_TOOL directive granting CATALOG_AND_CONTENT controls while the platform
          advertises an online tool, but after PATCHing supports_online_tool to false the directive is
          removed from the candidate set entirely — not merely down-ranked — so the rank-2
          WILL_PROVISION layer decides and the resolution changes to CATALOG_ONLY / WILL_PROVISION,
          while any new ONLINE_TOOL directive is refused with ERR_ONLINE_TOOL_UNSUPPORTED.
        test_recipe:
          setup:
            - "one CLOUD_STORAGE platform with supports_online_tool true and requires_court_order_for_content false"
            - "one Estate with a platform-specific ONLINE_TOOL directive (CATALOG_AND_CONTENT) and a catch-all WILL_PROVISION directive (CATALOG_ONLY)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C21" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/authority-directives"
              payload: { directive_type: "ONLINE_TOOL", scope: "CATALOG_AND_CONTENT", platform_id: "${p_cloud_id}", instrument_reference: "CloudVault legacy contact", executed_on: "2025-11-02" }
              as: CourtRegistrar
              captures: { dir_tool_id: $.data.id }
            - call: "POST /estates/${est_id}/authority-directives"
              payload: { directive_type: "WILL_PROVISION", scope: "CATALOG_ONLY", instrument_reference: "Will article 7.2", executed_on: "2025-06-01" }
              as: CourtRegistrar
              captures: { dir_will_id: $.data.id }
          trigger:
            - call: "GET /estates/${est_id}/authority-resolution"
              payload: { platform_id: "${p_cloud_id}" }
              as: EstateAdmin
              captures: { r1_scope: $.data.resolved_scope, r1_basis: $.data.resolved_basis, r1_dir: $.data.controlling_directive_id }
            - call: "PATCH /platforms/${p_cloud_id}"
              payload: { supports_online_tool: false }
              as: EstateAdmin
              captures: { p_tool_after: $.data.supports_online_tool }
            - call: "GET /estates/${est_id}/authority-resolution"
              payload: { platform_id: "${p_cloud_id}" }
              as: EstateAdmin
              captures: { r2_scope: $.data.resolved_scope, r2_basis: $.data.resolved_basis, r2_dir: $.data.controlling_directive_id }
            - call: "POST /estates/${est_id}/authority-directives"
              payload: { directive_type: "ONLINE_TOOL", scope: "CATALOG_AND_CONTENT", platform_id: "${p_cloud_id}", instrument_reference: "second legacy contact screen", executed_on: "2026-01-05" }
              as: CourtRegistrar
              captures: { e_tool_unsupported: $.data.error_id }
          assert:
            - "${r1_scope} == CATALOG_AND_CONTENT, ${r1_basis} == ONLINE_TOOL, ${r1_dir} == ${dir_tool_id}"
            - "${p_tool_after} == false"
            - "${r2_scope} == CATALOG_ONLY, ${r2_basis} == WILL_PROVISION, ${r2_dir} == ${dir_will_id}"
            - "AuthorityDirective.${dir_tool_id}.status is still RECORDED (the directive is filtered out of the candidate set, not superseded)"
            - "AuthorityDirective.${dir_tool_id}.precedence_rank == 1 and AuthorityDirective.${dir_will_id}.precedence_rank == 2"
            - "${e_tool_unsupported} == ERR_ONLINE_TOOL_UNSUPPORTED with HTTP 409"
            - "POST /estates/${est_id}/authority-directives with directive_type ONLINE_TOOL and platform_id omitted returns HTTP 409 with error_id ERR_ONLINE_TOOL_UNSUPPORTED"

      - name: financial_account_content_is_clamped_until_an_online_tool_grant_arrives
        claim_type: Constants Applied
        grounds:
          - calculations.asset_disclosure_level
          - state_machines.DigitalAsset.transitions[UNVERIFIED->CATALOG_DISCLOSED]
          - state_machines.DigitalAsset.transitions[CATALOG_DISCLOSED->CONTENT_DISCLOSED]
