scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: food_cost_fifo_chronological_vs_cheapest_lot
        grounds:
          - calculations.order_food_cost
          - calculations.fifo_inventory_consumption
          - state_machines.AggregatorOrder.PREPARING_to_FULFILLED
          - entities.IngredientLot.fields.unit_cost_cents_per_gram
        distinguishing_aspect: |
          food_cost_cents is the CHRONOLOGICAL FIFO actual cost of the specific lots drawn at
          routing (300g@8 + 100g@3 = 2700), which diverges from a forward-looking cheapest-lot
          estimate (400g@3 = 1200) for the identical 400g chicken draw — proving order_food_cost
          uses the recorded consumption slices, not the cheapest currently-available lot.
        test_recipe:
          setup:
            - "Brand B1 ACTIVE+LISTED with one menu item 'Wings' (chicken 200g/unit, FRYER, prep 8m, price 1000)."
            - "Stall S1 OPEN with one AVAILABLE FRYER and two chicken lots: lot1 received 2026-01-01 300g@8c/g, lot2 received 2026-01-02 300g@3c/g."
            - "ACTIVE lease binding B1 to S1 at priority_rank 1; logical clock 2026-01-05T00:00:00Z."
            - "Order O of 2x Wings (chicken need 400g) ingested, routed (FIFO drew lot1 300g + lot2 100g), then PREPARING."
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "S1", timezone: "America/Los_Angeles", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { s1_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "B1", owner_email: "b1@x.com", commission_rate_bps: 1500 }
              as: PlatformOps
              captures: { b1_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${s1_id}", brand_id: "${b1_id}", monthly_fee_cents: 100000, priority_rank: 1 }
              as: PlatformOps
              captures: { l1_id: $.data.id }
            - call: "POST /leases/${l1_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${s1_id}"
            - call: "POST /brands/${b1_id}/list"
              payload: {}
              as: BrandOwner
              as_user_id: "${b1_id}"
            - call: "POST /menu-items"
              payload: { brand_id: "${b1_id}", name: "Wings", price_cents: 1000, prep_minutes: 8, required_equipment_type: "FRYER" }
              as: BrandOwner
              as_user_id: "${b1_id}"
              captures: { wings_id: $.data.id }
            - call: "POST /menu-items/${wings_id}/recipe-components"
              payload: { ingredient_name: "chicken", quantity_grams: 200 }
              as: BrandOwner
              as_user_id: "${b1_id}"
            - call: "POST /equipment"
              payload: { stall_id: "${s1_id}", equipment_type: "FRYER", turnaround_buffer_minutes: 0 }
              as: StallOperator
              as_user_id: "${s1_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${s1_id}", ingredient_name: "chicken", received_at: "2026-01-01T00:00:00Z", unit_cost_cents_per_gram: 8, grams_received: 300 }
              as: StallOperator
              as_user_id: "${s1_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${s1_id}", ingredient_name: "chicken", received_at: "2026-01-02T00:00:00Z", unit_cost_cents_per_gram: 3, grams_received: 300 }
              as: StallOperator
              as_user_id: "${s1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformOps
            - call: "POST /orders"
              payload: { brand_id: "${b1_id}", aggregator: "DOORDASH", external_ref: "DD-1", line_items: [ { menu_item_id: "${wings_id}", qty: 2 } ] }
              as: AggregatorGateway
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/route"
              payload: {}
              as: PlatformOps
            - call: "POST /orders/${o_id}/start-prep"
              payload: {}
              as: StallOperator
              as_user_id: "${s1_id}"
          trigger:
            - call: "POST /orders/${o_id}/fulfill"
              payload: {}
              as: StallOperator
              as_user_id: "${s1_id}"
              captures: { fc: $.data.food_cost_cents }
          assert:
            - "AggregatorOrder.${o_id}.food_cost_cents == 2700"
            - "AggregatorOrder.${o_id}.food_cost_cents != 1200"
            - "AggregatorOrder.${o_id}.status == FULFILLED"

      - name: commission_forward_looking_on_brand_vs_food_cost_chronological_on_order
        grounds:
          - calculations.order_commission
          - calculations.order_food_cost
          - entities.VirtualBrand.fields.commission_rate_bps
          - state_machines.AggregatorOrder.INGESTED_to_ROUTED
        distinguishing_aspect: |
          commission is FORWARD-LOOKING risk/revenue accounting on the VirtualBrand domain
          (gross * rate_bps estimated at routing = 405 on a 2697 gross at 15%), whereas food_cost
          is CHRONOLOGICAL FIFO accounting on the AggregatorOrder's consumed-lot domain — two
          valid approaches on DIFFERENT entity domains producing independently-derived numbers.
        test_recipe:
          setup:
            - "Brand B2 ACTIVE+LISTED, commission_rate_bps 1500, with Wings (chicken 200g, FRYER, prep 8, price 1099) and Fries (potato 150g, FRYER, prep 5, price 499)."
            - "Stall S2 OPEN with one FRYER; chicken lot 300g@3 (recv 2026-01-01) + chicken lot 300g@5 (recv 2026-01-02); potato lot 500g@2 (recv 2026-01-01)."
            - "ACTIVE lease B2->S2 rank 1; clock 2026-01-05T00:00:00Z."
            - "Order O2 = 2x Wings + 1x Fries -> gross 2*1099+499 = 2697; routed (commission estimated)."
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "S2", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { s2_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "B2", owner_email: "b2@x.com", commission_rate_bps: 1500 }
              as: PlatformOps
              captures: { b2_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${s2_id}", brand_id: "${b2_id}", monthly_fee_cents: 100000, priority_rank: 1 }
              as: PlatformOps
              captures: { l2_id: $.data.id }
            - call: "POST /leases/${l2_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${s2_id}"
            - call: "POST /brands/${b2_id}/list"
              payload: {}
              as: BrandOwner
              as_user_id: "${b2_id}"
            - call: "POST /menu-items"
              payload: { brand_id: "${b2_id}", name: "Wings", price_cents: 1099, prep_minutes: 8, required_equipment_type: "FRYER" }
              as: BrandOwner
              as_user_id: "${b2_id}"
              captures: { w2_id: $.data.id }
            - call: "POST /menu-items/${w2_id}/recipe-components"
              payload: { ingredient_name: "chicken", quantity_grams: 200 }
              as: BrandOwner
              as_user_id: "${b2_id}"
            - call: "POST /menu-items"
              payload: { brand_id: "${b2_id}", name: "Fries", price_cents: 499, prep_minutes: 5, required_equipment_type: "FRYER" }
              as: BrandOwner
              as_user_id: "${b2_id}"
              captures: { f2_id: $.data.id }
            - call: "POST /menu-items/${f2_id}/recipe-components"
              payload: { ingredient_name: "potato", quantity_grams: 150 }
              as: BrandOwner
              as_user_id: "${b2_id}"
            - call: "POST /equipment"
              payload: { stall_id: "${s2_id}", equipment_type: "FRYER", turnaround_buffer_minutes: 0 }
              as: StallOperator
              as_user_id: "${s2_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${s2_id}", ingredient_name: "chicken", received_at: "2026-01-01T00:00:00Z", unit_cost_cents_per_gram: 3, grams_received: 300 }
              as: StallOperator
              as_user_id: "${s2_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${s2_id}", ingredient_name: "chicken", received_at: "2026-01-02T00:00:00Z", unit_cost_cents_per_gram: 5, grams_received: 300 }
              as: StallOperator
              as_user_id: "${s2_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${s2_id}", ingredient_name: "potato", received_at: "2026-01-01T00:00:00Z", unit_cost_cents_per_gram: 2, grams_received: 500 }
              as: StallOperator
              as_user_id: "${s2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformOps
            - call: "POST /orders"
              payload: { brand_id: "${b2_id}", aggregator: "UBER_EATS", external_ref: "UE-1", line_items: [ { menu_item_id: "${w2_id}", qty: 2 }, { menu_item_id: "${f2_id}", qty: 1 } ] }
              as: AggregatorGateway
              captures: { o2_id: $.data.id }
          trigger:
            - call: "POST /orders/${o2_id}/route"
              payload: {}
              as: PlatformOps
              captures: { comm: $.data.commission_cents }
          assert:
            - "AggregatorOrder.${o2_id}.gross_revenue_cents == 2697"
            - "AggregatorOrder.${o2_id}.commission_cents == 405"
            - "AggregatorOrder.${o2_id}.food_cost_cents == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: routing_min_max_eligibility_nonlinear
        grounds:
          - calculations.order_routing_selection
          - calculations.fifo_inventory_consumption
          - calculations.order_prep_window
          - state_machines.AggregatorOrder.INGESTED_to_ROUTED
        distinguishing_aspect: |
          MODE (a): routing eligibility is a 4-input non-linear AND over lease-status, stall OPEN,
          per-type AVAILABLE-equipment-with-free-window, and FIFO-inventory-sufficiency, then a
          priority_rank-ASC ranking — a stall passing 3 of 4 inputs is still excluded, so the
          result is not a linear sum of the inputs.
        test_recipe:
          setup:
            - "Brand B3 ACTIVE+LISTED with Wings (chicken 200g, FRYER, prep 8, price 1000)."
            - "Stall SA OPEN, rank 1 lease, FRYER AVAILABLE, but chicken inventory only 100g (insufficient for 200g need) -> fails input 4."
            - "Stall SB OPEN, rank 2 lease, FRYER AVAILABLE, chicken 500g (sufficient) -> passes all 4."
            - "Clock 2026-01-05T00:00:00Z; order O3 = 1x Wings (need 200g)."
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "SA", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { sa_id: $.data.id }
            - call: "POST /stalls"
              payload: { name: "SB", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { sb_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "B3", owner_email: "b3@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { b3_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${sa_id}", brand_id: "${b3_id}", monthly_fee_cents: 100000, priority_rank: 1 }
              as: PlatformOps
              captures: { la_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${sb_id}", brand_id: "${b3_id}", monthly_fee_cents: 100000, priority_rank: 2 }
              as: PlatformOps
              captures: { lb_id: $.data.id }
            - call: "POST /leases/${la_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${sa_id}"
            - call: "POST /leases/${lb_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${sb_id}"
            - call: "POST /brands/${b3_id}/list"
              payload: {}
              as: BrandOwner
              as_user_id: "${b3_id}"
            - call: "POST /menu-items"
              payload: { brand_id: "${b3_id}", name: "Wings", price_cents: 1000, prep_minutes: 8, required_equipment_type: "FRYER" }
              as: BrandOwner
              as_user_id: "${b3_id}"
              captures: { w3_id: $.data.id }
            - call: "POST /menu-items/${w3_id}/recipe-components"
              payload: { ingredient_name: "chicken", quantity_grams: 200 }
              as: BrandOwner
              as_user_id: "${b3_id}"
            - call: "POST /equipment"
              payload: { stall_id: "${sa_id}", equipment_type: "FRYER" }
              as: StallOperator
              as_user_id: "${sa_id}"
            - call: "POST /equipment"
              payload: { stall_id: "${sb_id}", equipment_type: "FRYER" }
              as: StallOperator
              as_user_id: "${sb_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${sa_id}", ingredient_name: "chicken", received_at: "2026-01-01T00:00:00Z", unit_cost_cents_per_gram: 4, grams_received: 100 }
              as: StallOperator
              as_user_id: "${sa_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${sb_id}", ingredient_name: "chicken", received_at: "2026-01-01T00:00:00Z", unit_cost_cents_per_gram: 4, grams_received: 500 }
              as: StallOperator
              as_user_id: "${sb_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformOps
            - call: "POST /orders"
              payload: { brand_id: "${b3_id}", aggregator: "DOORDASH", external_ref: "DD-3", line_items: [ { menu_item_id: "${w3_id}", qty: 1 } ] }
              as: AggregatorGateway
              captures: { o3_id: $.data.id }
          trigger:
            - call: "POST /orders/${o3_id}/route"
              payload: {}
              as: PlatformOps
              captures: { routed: $.data.routed_stall_id }
          assert:
            - "AggregatorOrder.${o3_id}.routed_stall_id == ${sb_id}"
            - "AggregatorOrder.${o3_id}.routed_stall_id != ${sa_id}"
            - "AggregatorOrder.${o3_id}.status == ROUTED"

      - name: prep_window_interval_then_summed_no_intermediate_rounding
        grounds:
          - calculations.order_prep_window
          - entities.EquipmentBooking.fields.start_minute
          - entities.EquipmentBooking.fields.end_minute
          - state_machines.AggregatorOrder.INGESTED_to_ROUTED
        distinguishing_aspect: |
          MODE (c): the booking window is a circular-looking dependency pinned to one evaluation
          order — end_minute = start_minute (= floor(clock_epoch_sec/60) = 29459520) + sum over
          line_items of prep_minutes*qty (8*2 + 5*1 = 21), so end_minute == 29459541; computing
          start from the window would be ill-defined without the pinned order.
        test_recipe:
          setup:
            - "Brand B4 ACTIVE+LISTED; Wings (FRYER prep 8) and Fries (FRYER prep 5); ample chicken+potato."
            - "Stall S4 OPEN, one FRYER, rank-1 lease; clock 2026-01-05T00:00:00Z (epoch minute 29459520)."
            - "Order O4 = 2x Wings + 1x Fries (FRYER minutes 8*2 + 5*1 = 21)."
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "S4", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { s4_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "B4", owner_email: "b4@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { b4_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${s4_id}", brand_id: "${b4_id}", monthly_fee_cents: 100000, priority_rank: 1 }
              as: PlatformOps
              captures: { l4_id: $.data.id }
            - call: "POST /leases/${l4_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${s4_id}"
            - call: "POST /brands/${b4_id}/list"
              payload: {}
              as: BrandOwner
              as_user_id: "${b4_id}"
            - call: "POST /menu-items"
              payload: { brand_id: "${b4_id}", name: "Wings", price_cents: 1000, prep_minutes: 8, required_equipment_type: "FRYER" }
              as: BrandOwner
              as_user_id: "${b4_id}"
              captures: { w4_id: $.data.id }
            - call: "POST /menu-items/${w4_id}/recipe-components"
              payload: { ingredient_name: "chicken", quantity_grams: 100 }
              as: BrandOwner
              as_user_id: "${b4_id}"
            - call: "POST /menu-items"
              payload: { brand_id: "${b4_id}", name: "Fries", price_cents: 500, prep_minutes: 5, required_equipment_type: "FRYER" }
              as: BrandOwner
              as_user_id: "${b4_id}"
              captures: { f4_id: $.data.id }
            - call: "POST /menu-items/${f4_id}/recipe-components"
              payload: { ingredient_name: "potato", quantity_grams: 100 }
              as: BrandOwner
              as_user_id: "${b4_id}"
            - call: "POST /equipment"
              payload: { stall_id: "${s4_id}", equipment_type: "FRYER" }
              as: StallOperator
              as_user_id: "${s4_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${s4_id}", ingredient_name: "chicken", received_at: "2026-01-01T00:00:00Z", unit_cost_cents_per_gram: 4, grams_received: 1000 }
              as: StallOperator
              as_user_id: "${s4_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${s4_id}", ingredient_name: "potato", received_at: "2026-01-01T00:00:00Z", unit_cost_cents_per_gram: 2, grams_received: 1000 }
              as: StallOperator
              as_user_id: "${s4_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformOps
            - call: "POST /orders"
              payload: { brand_id: "${b4_id}", aggregator: "DOORDASH", external_ref: "DD-4", line_items: [ { menu_item_id: "${w4_id}", qty: 2 }, { menu_item_id: "${f4_id}", qty: 1 } ] }
              as: AggregatorGateway
              captures: { o4_id: $.data.id }
          trigger:
            - call: "POST /orders/${o4_id}/route"
              payload: {}
              as: PlatformOps
              captures: { bk_id: $.data.booking_id }
          assert:
            - "EquipmentBooking.${bk_id}.start_minute == 29459520"
            - "EquipmentBooking.${bk_id}.end_minute == 29459541"
            - "EquipmentBooking.${bk_id}.status == HELD"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lease_suspend_reinstate_revert_cycle
        grounds:
          - state_machines.KitchenLease.ACTIVE_to_SUSPENDED
          - state_machines.KitchenLease.SUSPENDED_to_ACTIVE
          - entities.KitchenLease.fields.status
        distinguishing_aspect: |
          KitchenLease has a revert edge SUSPENDED->ACTIVE (reinstate), making its machine cyclic
          (ACTIVE->SUSPENDED->ACTIVE) rather than a forward-only pipeline — a property the Stall
          and Equipment machines do not exhibit on this entity.
        test_recipe:
          setup:
            - "Stall S5 OPEN; Brand B5; lease L5 ACTIVE binding B5->S5."
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "S5", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { s5_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "B5", owner_email: "b5@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { b5_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${s5_id}", brand_id: "${b5_id}", monthly_fee_cents: 100000, priority_rank: 1 }
              as: PlatformOps
              captures: { l5_id: $.data.id }
            - call: "POST /leases/${l5_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${s5_id}"
            - call: "POST /leases/${l5_id}/suspend"
              payload: {}
              as: PlatformOps
          trigger:
            - call: "POST /leases/${l5_id}/reinstate"
              payload: {}
              as: PlatformOps
              captures: { st: $.data.status }
          assert:
            - "KitchenLease.${l5_id}.status == ACTIVE"
            - "KitchenLease.${l5_id}.version == 4"

      - name: order_branch_fork_route_vs_reject_divergent_effects
        grounds:
          - state_machines.AggregatorOrder.INGESTED_to_ROUTED
          - state_machines.AggregatorOrder.INGESTED_to_REJECTED
          - entities.AggregatorOrder.fields.status
          - entities.AggregatorOrder.fields.booking_id
        distinguishing_aspect: |
          AggregatorOrder forks INGESTED->{ROUTED,REJECTED} with divergent side-effect sets: ROUTED
          creates a booking + deducts inventory, while REJECTED leaves booking_id null and consumes
          nothing — branching fork on a different entity than KitchenLease.
        test_recipe:
          setup:
            - "Brand B6 ACTIVE+LISTED with Wings; Stall S6 OPEN with FRYER + chicken inventory; clock 2026-01-05T00:00:00Z."
            - "Two ingested orders OR (to be rejected) and (for contrast) ample stock so OR could route."
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "S6", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { s6_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "B6", owner_email: "b6@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { b6_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${s6_id}", brand_id: "${b6_id}", monthly_fee_cents: 100000, priority_rank: 1 }
              as: PlatformOps
              captures: { l6_id: $.data.id }
            - call: "POST /leases/${l6_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${s6_id}"
            - call: "POST /brands/${b6_id}/list"
              payload: {}
              as: BrandOwner
              as_user_id: "${b6_id}"
            - call: "POST /menu-items"
              payload: { brand_id: "${b6_id}", name: "Wings", price_cents: 1000, prep_minutes: 8, required_equipment_type: "FRYER" }
              as: BrandOwner
              as_user_id: "${b6_id}"
              captures: { w6_id: $.data.id }
            - call: "POST /menu-items/${w6_id}/recipe-components"
              payload: { ingredient_name: "chicken", quantity_grams: 100 }
              as: BrandOwner
              as_user_id: "${b6_id}"
            - call: "POST /equipment"
              payload: { stall_id: "${s6_id}", equipment_type: "FRYER" }
              as: StallOperator
              as_user_id: "${s6_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${s6_id}", ingredient_name: "chicken", received_at: "2026-01-01T00:00:00Z", unit_cost_cents_per_gram: 4, grams_received: 1000 }
              as: StallOperator
              as_user_id: "${s6_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformOps
            - call: "POST /orders"
              payload: { brand_id: "${b6_id}", aggregator: "DOORDASH", external_ref: "DD-6", line_items: [ { menu_item_id: "${w6_id}", qty: 1 } ] }
              as: AggregatorGateway
