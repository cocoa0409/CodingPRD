      - name: insufficient_credit_rejects_batch_purchase_and_certificate_issuance_separately
        claim_type: violation_to_error
        grounds:
          - validations[priority=51]
          - errors.ERR_INSUFFICIENT_CREDIT
          - calculations.batch_purchase_price
          - calculations.certificate_issuance_fee
        distinguishing_aspect: |
          The 402 guard is evaluated against the exact amount each endpoint is about to debit, so the same
          provider can be too poor for one call and rich enough for the next: 3000 cents cannot cover a
          one-unit EXAM_ONLY batch at 3762, and the 38 cents left after that purchase cannot cover the
          CERT_ISSUANCE_FEE_CENTS 1500 at issuance. Both rejections must leave the ledger untouched — no
          partial debit, no batch and no certificate — and the retry after a top-up must succeed with the
          same body.
        test_recipe:
          setup:
            - "A jurisdiction with exam_fee_surcharge_pct 0.045 and requires_local_registration false, one ACTIVE EN form (80 items, cut 70), a 2-seat EN site, a REGISTERED EN proctor, one candidate."
            - "The provider has been credited exactly 3000 cents and nothing else — no batch has been purchased yet."
