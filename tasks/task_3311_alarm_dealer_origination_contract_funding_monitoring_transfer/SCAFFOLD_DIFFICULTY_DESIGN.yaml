          - state_machines.MonitoringAccount.transitions.UNPROVISIONED_to_PROVISIONED
          - validations[priority=9]
          - errors[ERR_MONITORING_NOT_PROVISIONED]
        distinguishing_aspect: |
          Contract's valid transition depends on a different entity's state: the
          PENDING_VALIDATION -> ACTIVE transition is gated on MonitoringAccount.provision_state
          being PROVISIONED (or an approved install waiver), crossing the
          Contract -> MonitoringAccount pair.
