              as: BatchScheduler
              captures: { bj: $.data.id, bj_v1: $.data.version }
            - call: "POST /toll-operations/customers/${c}/batch-jobs/${bj}/release"
              payload: { expected_batch_job_version: "${bj_v1}" }
              as: BatchScheduler
          trigger:
            # Client still has stale version bj_v1, but server bumped it. Try to release again with stale.
            # Note: release would also fail on state (already RELEASED), so we exercise OCC on a different
            # endpoint: try to cancel with the SAME expected version field? Cancel does not take OCC.
            # Instead, demonstrate stale-version via pricing agreement activate (which uses OCC):
            - call: "POST /toll-operations/customers/${c}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 5, tolling_per_kg_cents: 5, formulated_price_per_kg_cents: 0, effective_from: "2026-10-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
