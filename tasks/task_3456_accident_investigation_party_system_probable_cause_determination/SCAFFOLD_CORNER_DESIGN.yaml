              captures: { rp_past_id: $.data.id }
          trigger:
            - call: "POST /recorders/${rp_past_id}/readout-sessions"
              payload: { bench_id: "bench-9", window_start_utc: "2026-08-31T10:00:00Z", window_end_utc: "2026-08-31T12:00:00Z" }
              as: RecorderCustodian
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_WINDOW_IN_PAST"
            - "GET /recorders/${rp_past_id} shows readout_sessions == [] and status == SECURED"

      - name: pagination_limit_zero_returns_400
        claim_type: Triggerable
        grounds:
          - errors.ERR_INVALID_PAGINATION_PARAMETERS
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Pagination bounds are enforced on every list endpoint: limit=0 and limit=101 and offset=-1 each return 400 ERR_INVALID_PAGINATION_PARAMETERS, while the defaults (limit 10, offset 0) apply when omitted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one accident case exists."
          setup_api_calls:
            - *c_clock
            - *c_case
          trigger:
            - call: "GET /accident-cases"
              payload: { limit: 0 }
              as: DutyOfficer
              captures: { err_lim0: $.data.error_id }
            - call: "GET /accident-cases"
              payload: { limit: 101 }
              as: DutyOfficer
              captures: { err_lim101: $.data.error_id }
            - call: "GET /accident-cases"
              payload: { offset: -1 }
              as: DutyOfficer
              captures: { err_off: $.data.error_id }
          assert:
            - "err_lim0 == ERR_INVALID_PAGINATION_PARAMETERS (400)"
            - "err_lim101 == ERR_INVALID_PAGINATION_PARAMETERS (400)"
            - "err_off == ERR_INVALID_PAGINATION_PARAMETERS (400)"
            - "GET /accident-cases with no parameters returns 200 with 1 row, limit defaulting to 10 and offset to 0"

