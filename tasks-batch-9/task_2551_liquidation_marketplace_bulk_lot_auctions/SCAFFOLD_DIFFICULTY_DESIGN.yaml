              captures: { ba: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts/${ba}/qualification-decisions"
              payload: { decision: "QUALIFY", business_verified: true, approved_credit_limit_cents: 10000000 }
              as: TrustSafety
              as_user_id: "ts-1"
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Toys overstock P1", category_code: "TOYS", condition_grade: "NEW_OVERSTOCK" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lotp1: "$.data.id" }
            - call: "POST /liquidation/lots/${lotp1}/manifest-lines"
              payload: { sku: "TOY-P1", unit_count: 50, unit_retail_cents: 20000, declared_condition: "NEW" }
