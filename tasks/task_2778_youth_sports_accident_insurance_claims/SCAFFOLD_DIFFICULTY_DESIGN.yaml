  - rule_id: cross_entity_state_dependency
    instances:

      - name: injury_report_verification_guarded_by_sanctioned_activity_status
        grounds:
          - validations[priority=16]
          - errors[ERR_ACTIVITY_NOT_SANCTIONED]
          - state_machines.SanctionedActivity.PENDING_SANCTION_to_SANCTIONED
          - state_machines.InjuryReport.PENDING_VERIFICATION_to_VERIFIED
          - entities.SanctionedActivity.fields.status
        distinguishing_aspect: |
          The operation is on InjuryReport but the guard reads a DIFFERENT entity, SanctionedActivity:
          filing is permitted from any activity status except REJECTED, yet a VERIFY decision requires the
          activity to be SANCTIONED. The identical verification call fails with 422
          ERR_ACTIVITY_NOT_SANCTIONED while the activity is PENDING_SANCTION and succeeds - creating the
          Claim - once a league official sanctions the activity, with nothing about the InjuryReport row
