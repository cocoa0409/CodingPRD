            - { call: "GET /brands/${b1}", as: VerifierAdmin, captures: { cnt: $.data.verified_product_count, pts: $.data.lifetime_penalty_points } }
          assert:
            - "hop 1: LabelLicense status == SUSPENDED, suspend_reason == ENFORCEMENT, suspended_at == 2026-08-01T00:00:00Z"
            - "hop 2: Product enrollment_status == SUSPENDED"
            - "hop 3: Brand.verified_product_count == 0 (was 1 before the resolve)"
            - "case penalty_points == 15 and Brand.lifetime_penalty_points == 15 (independent of the license chain; still GOOD_STANDING)"

      - name: noncompliant_confirm_ingredient_product_cascade
        grounds:
          - state_machines.TestSample.RESULT_RECORDED_to_CONFIRMED
          - entities.Ingredient.fields.compliance_status
          - entities.Product.fields.confirmed_exposure_pct
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST /samples/{id}/confirm):
          a NON_COMPLIANT confirmation flips Ingredient.compliance_status to
          NON_COMPLIANT (hop 1); that ingredient flip recomputes the Product's
          exposure fields to 40.00 x 1.50 = 60.00 (hop 2).
        test_recipe:
          setup:
            - "Product UNDER_EVALUATION with ingredient A HIGH_RISK 40.00 (affidavit accepted) and B NON_CROP 60.00; INGREDIENT_INTAKE plan required == 1; one sample recorded at 1.50"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "A", crop_type: "HIGH_RISK", declared_weight_pct: 40.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ingA: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "B", crop_type: "NON_CROP", declared_weight_pct: 60.00 }, as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ingA}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { plan: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ingA}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
            - { call: "POST /samples/${s1}/record-result", payload: { result_gmo_pct: 1.50 }, as: LabAnalyst, as_user_id: "lab-1" }
          trigger:
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2", captures: { oc: $.data.outcome } }
            - { call: "GET /ingredients/${ingA}", as: VerifierAdmin, captures: { ics: $.data.compliance_status } }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { cexp: $.data.confirmed_exposure_pct, pexp: $.data.provisional_exposure_pct } }
          assert:
            - "trigger: sample outcome == NON_COMPLIANT (1.50 > 0.9)"
            - "hop 1: Ingredient.compliance_status == NON_COMPLIANT"
            - "hop 2: Product.confirmed_exposure_pct == 60.00 and provisional_exposure_pct == 60.00 (40.00 x 1.50; NON_CROP contributes 0)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sample_create_state_beats_referential
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_PLAN_NOT_ACTIVE]
          - errors[ERR_CROSS_REFERENCE_MISMATCH]
        distinguishing_aspect: |
          Error-category pair (state, business_referential): the plan is
          CANCELLED (state violation) AND the ingredient belongs to a different
          product (referential violation); priority 6 state wins over priority 7
          referential, so ERR_PLAN_NOT_ACTIVE must surface.
        test_recipe:
          setup:
            - "Product PA UNDER_EVALUATION; plan1 created then superseded by plan2, so plan1 is CANCELLED"
            - "Product PB (DRAFT) has ingredient IB; IB does not belong to PA"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "PA", gtin: "G-PA", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { pa: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${pa}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ingA: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ingA}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${pa}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${pa}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${pa}", as: VerifierAdmin, captures: { v1: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${pa}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${v1}" }, as: VerifierAdmin, captures: { plan1: $.data.id } }
            - { call: "GET /products/${pa}", as: VerifierAdmin, captures: { v2: $.data.version } }
