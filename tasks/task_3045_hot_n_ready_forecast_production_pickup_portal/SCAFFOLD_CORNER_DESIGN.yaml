      - name: paid_preorder_auto_readies_at_daypart_activation
        claim_type: side_effect_execution
        grounds:
          - state_machines.Daypart.PLANNED_to_ACTIVE
          - state_machines.LockerSlot.IDLE_to_OCCUPIED
        distinguishing_aspect: "When the clock reaches a PLANNED daypart's window while the store day is OPEN, the auto-activation cascade readies every PAID preorder: order becomes READY with a minted pickup code and occupies a locker slot — no crew action needed."
        test_recipe:
