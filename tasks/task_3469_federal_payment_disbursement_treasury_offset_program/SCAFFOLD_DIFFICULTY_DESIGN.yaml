              as: TreasuryOperator
          trigger:
            - call: "POST /payments/${pay_1}/execute"
              payload: {}
              as: TreasuryOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_PAYMENT_NOT_EXECUTABLE (priority-7 state failure)"
            - "error_id != ERR_DNP_FLAGGED_PAYMENT (the priority-8 safety failure loses despite also being true)"
            - "Payment.${pay_1}.processing_status remains HELD and total_offset_cents remains 0"

