              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /inspections"
              payload: { building_id: "${b_id}", window_start: "2026-03-01T00:00:00Z", window_end: "2026-03-05T00:00:00Z", inspected_on: "2026-03-03T00:00:00Z", deduction_points: [20,15,12], has_exigent_health_safety: false }
              as: StateHFA
              captures: { i_id: $.data.id }
            - call: "POST /inspections/${i_id}/conduct"
              payload: {}
              as: StateHFA
            - call: "GET /findings?inspection_id=${i_id}"
              payload: {}
              as: StateHFA
              captures: { f_id: "$.data[0].id" }
          trigger:
            - call: "POST /inspections/${i_id}/close"
              payload: {}
              as: StateHFA
              captures: { err: $.data.error_id }
            - call: "POST /findings/${f_id}/correct"
              payload: {}
              as: OwnerAgent
            - call: "POST /inspections/${i_id}/close"
              payload: {}
              as: StateHFA
              captures: { ok_status: $.data.status }
          assert:
            - "First close (Finding OPEN) returns 409 ERR_OPEN_FINDINGS_BLOCK_CLOSE"
            - "After correct, second close returns 200 and Inspection.${i_id}.status == CLOSED"

