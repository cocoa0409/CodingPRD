  - rule_id: transitive_cascade
    instances:
      - name: confirmation_flag_to_case_to_compliance_hold
        grounds:
          - state_machines.TradeConfirmation.RECEIVED_to_FLAGGED
          - entities.CoveredPerson.fields.compliance_hold
          - validations[priority=8]
        distinguishing_aspect: |
          Depth-3 chain originating at POST /trade-confirmations: ingest flags the
          confirmation (hop 1), the flag auto-opens a ViolationCase (hop 2, caused by hop 1),
          the case opening recomputes CoveredPerson.compliance_hold to true (hop 3, caused by
          hop 2), which then blocks a new preclearance submission with ERR_COMPLIANCE_HOLD.
          Different trigger than deal_activate_to_entry_to_auto_deny.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; subject policy/training current; no approvals, plans, windows, or restricted entries for BETA"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
