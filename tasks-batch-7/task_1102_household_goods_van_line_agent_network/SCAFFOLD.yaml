scenario: "1102. Household Goods Van Line Agent Network (United/Mayflower agent network): order registration & agent booking/hauling/origin/destination roles, tariff/estimate & binding vs non-binding rules, weight ticket & re-weigh request, valuation coverage & claim settlement, storage-in-transit & delivery spread window, crew/labor sourcing at each end, revenue split between agents & van line, dispute & arbitration program"

domain_name: household-goods-van-line
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the network agent company" }
      - { name: agent_code, type: string, source: input, description: "Unique 4-8 char agent code; unique across all agents", constraints: "unique" }
      - { name: capabilities, type: array, source: input, description: "Non-empty subset of [BOOKING, ORIGIN, HAULING, DESTINATION] the agent is certified to perform" }
      - { name: home_market, type: string, source: input, description: "Primary market metro name" }
      - { name: commission_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | PREFERRED | PREMIER — drives revenue split bonus in revenue_split_waterfall" }
      - { name: quality_score, type: integer, source: computed, default: 100, description: "Starts at 100; recomputed by claim chargeback cascade (see Claim pay side effects); floor 0" }
      - { name: ytd_linehaul_share_cents, type: integer, source: computed, default: 0, description: "Running ledger of split_amount_cents credited to this agent's assignments; incremented by RevenueStatement creation cascade" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED; initial ACTIVE" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Shipper full name" }
      - { name: email, type: string, source: input, description: "Shipper email; unique across customers", constraints: "unique" }
      - { name: phone, type: string, source: input, description: "Shipper phone" }
      - { name: status, type: enum, source: system, description: "ACTIVE only (set at creation); archival out of scope" }

  - name: Tariff
    parent: null
    common_fields: true
    fields:
      - { name: tariff_code, type: string, source: input, description: "Unique tariff code", constraints: "unique" }
      - { name: effective_start, type: datetime, source: input, description: "Start of effective window; half-open [effective_start, effective_end)" }
      - { name: effective_end, type: datetime, source: input, description: "End of effective window; must be > effective_start" }
      - { name: base_rate_cents_per_cwt, type: integer, source: input, description: "Linehaul base rate in cents per hundredweight before mileage-band multiplier" }
      - { name: mileage_bands, type: array, source: input, description: "Array of {min_miles, max_miles, rate_multiplier}; band selected when min_miles <= mileage < max_miles; last band max_miles inclusive; bands must tile without gaps or overlaps from 0" }
      - { name: fuel_surcharge_pct, type: number, source: input, description: "Fuel surcharge fraction applied to linehaul (e.g. 0.10)" }
      - { name: sit_daily_rate_cents_per_cwt, type: integer, source: input, description: "Storage-in-transit daily rate in cents per cwt" }
      - { name: hourly_labor_rate_cents, type: integer, source: input, description: "Crew labor rate in cents per worker-hour" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED; initial DRAFT; only PUBLISHED tariffs may be referenced by new orders" }

  - name: MoveOrder
    parent: null
    common_fields: true
    fields:
      - { name: order_number, type: string, source: system, description: "Sequential 'VL-000001' style registration number; identity only, never used in decisions" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the shipper" }
      - { name: tariff_id, type: string, source: input, description: "FK -> Tariff.id; must reference a PUBLISHED tariff whose effective window covers the order pickup_date" }
      - { name: pricing_mode, type: enum, source: input, description: "BINDING | NON_BINDING; immutable after registration" }
      - { name: origin_city, type: string, source: input, description: "Origin city" }
      - { name: origin_state, type: string, source: input, description: "Origin state code" }
      - { name: destination_city, type: string, source: input, description: "Destination city" }
      - { name: destination_state, type: string, source: input, description: "Destination state code" }
      - { name: mileage, type: integer, source: input, description: "Certified mileage origin to destination; > 0" }
      - { name: pickup_date, type: datetime, source: input, description: "Scheduled pickup date (00:00:00Z day precision)" }
      - { name: estimated_weight_lbs, type: integer, source: computed, description: "Copied from the latest ACCEPTED estimate's estimated_weight_lbs; null until an estimate is accepted" }
      - { name: actual_weight_lbs, type: integer, source: computed, description: "Net weight from the authoritative WeightTicket; null until first weighment" }
      - { name: authoritative_weight_ticket_id, type: string, source: system, description: "FK -> WeightTicket.id; the ticket currently governing charges; nullable until first weighment" }
      - { name: earliest_delivery_date, type: datetime, source: computed, description: "Computed at book via delivery_spread_window; null until BOOKED" }
      - { name: latest_delivery_date, type: datetime, source: computed, description: "Computed at book via delivery_spread_window; null until BOOKED" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical clock timestamp when delivery completed; null until DELIVERED" }
      - { name: collected_at_delivery_cents, type: integer, source: system, description: "Amount collected at delivery; recorded by deliver endpoint; null until DELIVERED" }
      - { name: final_charges_cents, type: integer, source: computed, description: "Final invoice per final_charges_and_delivery_cap; set at delivery (FINAL_BILLED); null before" }
      - { name: delivery_amount_due_cents, type: integer, source: computed, description: "Amount lawfully demandable at delivery; provisional at dispatch, final at delivery; null before dispatch" }
      - { name: deferred_balance_cents, type: integer, source: computed, description: "final_charges_cents - delivery_amount_due_cents at delivery; 0 for BINDING and whenever final <= 110% cap; null before delivery" }
      - { name: status, type: enum, source: system, description: "REGISTERED | BOOKED | IN_TRANSIT | IN_SIT | OUT_FOR_DELIVERY | DELIVERED | SETTLED | CLOSED | CANCELLED; initial REGISTERED" }
      - { name: billing_status, type: enum, source: system, description: "Independent billing axis: UNBILLED | PROVISIONALLY_BILLED | FINAL_BILLED | PAID; initial UNBILLED" }

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> MoveOrder.id; order this estimate prices" }
      - { name: supersedes_estimate_id, type: string, source: system, description: "FK -> Estimate.id; the prior ISSUED or ACCEPTED estimate this one replaced; null on first estimate" }
      - { name: estimate_kind, type: enum, source: input, description: "BINDING | NON_BINDING; must equal order pricing_mode" }
      - { name: estimated_weight_lbs, type: integer, source: input, description: "Estimated shipment weight in lbs; > 0" }
      - { name: packing_services_cents, type: integer, source: input, default: 0, description: "Flat packing accessorial in cents; >= 0" }
      - { name: linehaul_cents, type: integer, source: computed, description: "Rounded linehaul component per estimate_total (component-level rounding, pinned order)" }
      - { name: fuel_surcharge_cents, type: integer, source: computed, description: "Rounded fuel component per estimate_total" }
      - { name: valuation_premium_cents, type: integer, source: computed, description: "Snapshot of the order's ELECTED valuation coverage premium at issuance; 0 if none elected" }
      - { name: estimated_charges_cents, type: integer, source: computed, description: "Sum of the individually rounded components (round-per-component-then-sum)" }
      - { name: revision_number, type: integer, source: computed, description: "1 + superseded estimate's revision_number; 1 for the first estimate on an order" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock timestamp at creation" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at + ESTIMATE_VALIDITY_DAYS (30 days)" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACCEPTED | DECLINED | SUPERSEDED | EXPIRED | VOIDED; initial ISSUED" }

  - name: OrderAgentAssignment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> MoveOrder.id" }
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; agent holding this role" }
      - { name: role, type: enum, source: input, description: "BOOKING | ORIGIN | HAULING | DESTINATION" }
      - { name: split_pct, type: number, source: computed, description: "Effective linehaul split fraction for this role incl. commission tier bonus, snapshot at CONFIRMED" }
      - { name: split_amount_cents, type: integer, source: computed, description: "Credited linehaul + attributable accessorial share, written by RevenueStatement creation cascade; null until order DELIVERED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | RELEASED | COMPLETED; initial PROPOSED (BOOKING assignment auto-created CONFIRMED at registration)" }

  - name: ValuationCoverage
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> MoveOrder.id" }
      - { name: coverage_type, type: enum, source: input, description: "RELEASED_VALUE | FULL_VALUE_PROTECTION" }
      - { name: declared_value_cents, type: integer, source: input, default: 0, description: "Declared shipment value; must be > 0 when coverage_type is FULL_VALUE_PROTECTION; forced to 0 for RELEASED_VALUE" }
      - { name: deductible_cents, type: integer, source: input, default: 0, description: "One of 0, 25000, 50000; only meaningful for FULL_VALUE_PROTECTION" }
      - { name: premium_cents, type: integer, source: computed, description: "Per valuation_premium calculation; 0 for RELEASED_VALUE" }
      - { name: status, type: enum, source: system, description: "ELECTED | LOCKED | SUPERSEDED; initial ELECTED; LOCKED at dispatch; SUPERSEDED when a new coverage is elected pre-dispatch" }

  - name: WeightTicket
    parent: null
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> MoveOrder.id" }
      - { name: reweigh_request_id, type: string, source: system, description: "FK -> ReweighRequest.id; set only when ticket_kind is REWEIGH; null for ORIGINAL" }
      - { name: supersedes_ticket_id, type: string, source: system, description: "FK -> WeightTicket.id; the ticket this one replaces as evidence; null for the first ticket" }
      - { name: ticket_kind, type: enum, source: system, description: "ORIGINAL | REWEIGH" }
      - { name: scale_location, type: string, source: input, description: "Certified scale identifier" }
      - { name: weighed_at, type: datetime, source: input, description: "Timestamp of weighment" }
      - { name: tare_weight_lbs, type: integer, source: input, description: "Empty vehicle weight; > 0" }
      - { name: gross_weight_lbs, type: integer, source: input, description: "Loaded vehicle weight; must be >= tare_weight_lbs" }
      - { name: net_weight_lbs, type: integer, source: computed, description: "gross_weight_lbs - tare_weight_lbs" }

  - name: ReweighRequest
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> MoveOrder.id" }
      - { name: requested_by_role, type: enum, source: input, description: "CUSTOMER | BOOKING_AGENT — who demanded the re-weigh" }
      - { name: resulting_ticket_id, type: string, source: system, description: "FK -> WeightTicket.id; ticket produced by perform; null until PERFORMED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | PERFORMED | APPLIED | DECLINED_BY_CUSTOMER | CANCELLED | EXPIRED; initial REQUESTED" }

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Warehouse name" }
      - { name: market, type: string, source: input, description: "Metro market served" }
      - { name: capacity_cwt, type: integer, source: input, description: "Aggregate storage capacity in cwt; > 0" }
      - { name: occupied_cwt, type: integer, source: computed, default: 0, description: "Sum of stored_weight_cwt over SITLot rows with status IN_STORAGE at this warehouse; ledger-synced on check-in, release, and conversion" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE; initial ACTIVE" }

  - name: SITLot
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> MoveOrder.id" }
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id" }
      - { name: stored_weight_cwt, type: integer, source: computed, description: "ceil(order.actual_weight_lbs / 100) at check-in" }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical clock timestamp at check-in" }
      - { name: released_at, type: datetime, source: system, description: "Logical clock timestamp at release; null while IN_STORAGE" }
      - { name: days_stored, type: integer, source: computed, description: "floor((released_at or current clock) - checked_in_at, in whole days); read-time computed" }
      - { name: accrued_storage_cents, type: integer, source: computed, description: "Per sit_storage_accrual; live while IN_STORAGE, frozen at release or conversion" }
      - { name: status, type: enum, source: system, description: "IN_STORAGE | RELEASED | CONVERTED_PERMANENT; initial IN_STORAGE; auto-converts when days_stored >= SIT_MAX_DAYS (180)" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> MoveOrder.id" }
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; sourcing agent (the calling OriginAgent or DestinationAgent)" }
      - { name: service_end, type: enum, source: input, description: "ORIGIN | DESTINATION; must match the sourcing agent's assignment role on the order" }
      - { name: service_date, type: datetime, source: input, description: "Service day (00:00:00Z); must fall within [pickup_date, latest_delivery_date + 30 days] once order is BOOKED" }
      - { name: start_hour, type: integer, source: input, description: "Start hour 0-23; half-open interval [start_hour, end_hour)" }
      - { name: end_hour, type: integer, source: input, description: "End hour 1-24; must be > start_hour" }
      - { name: crew_size, type: integer, source: input, description: "Number of workers; >= 1" }
      - { name: labor_hours, type: integer, source: computed, description: "end_hour - start_hour" }
      - { name: invoice_amount_cents, type: integer, source: computed, description: "Per crew_labor_invoice; computed at creation from order tariff; frozen thereafter" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | INVOICED | CANCELLED; initial REQUESTED" }

  - name: RevenueStatement
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> MoveOrder.id; exactly one statement per order; created automatically at delivery" }
      - { name: linehaul_revenue_cents, type: integer, source: computed, description: "Final linehaul_cents + fuel_surcharge_cents basis for the split" }
      - { name: accessorial_revenue_cents, type: integer, source: computed, description: "Crew invoices + SIT accrual + valuation premium (informational total)" }
      - { name: booking_share_cents, type: integer, source: computed, description: "BOOKING role linehaul share per revenue_split_waterfall" }
      - { name: origin_share_cents, type: integer, source: computed, description: "ORIGIN role linehaul share per revenue_split_waterfall" }
      - { name: hauling_share_cents, type: integer, source: computed, description: "HAULING role linehaul share per revenue_split_waterfall (absorbs van-line floor deficit)" }
      - { name: destination_share_cents, type: integer, source: computed, description: "DESTINATION role linehaul share per revenue_split_waterfall" }
      - { name: van_line_share_cents, type: integer, source: computed, description: "Residual linehaul share plus valuation premium; floored at VAN_LINE_FLOOR_PCT of linehaul" }
      - { name: chargeback_total_cents, type: integer, source: computed, default: 0, description: "Cumulative claim settlements and arbitration adjustments charged back against the HAULING agent" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | RECONCILED; initial PROVISIONAL at creation" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> MoveOrder.id" }
      - { name: valuation_coverage_id, type: string, source: system, description: "FK -> ValuationCoverage.id; the LOCKED coverage in force at delivery, captured at filing" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock timestamp at filing" }
      - { name: description, type: string, source: input, description: "Loss/damage description" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Total amount claimed; > 0" }
      - { name: claimed_item_weight_lbs, type: integer, source: input, description: "Aggregate weight of claimed items; > 0; drives released-value cap" }
      - { name: offer_amount_cents, type: integer, source: system, description: "Current settlement offer; null until first offer" }
      - { name: offered_by_user_id, type: string, source: system, description: "X-User-ID of the ClaimsAdjuster who made the current offer; drives segregation-of-duties on pay" }
      - { name: settled_amount_cents, type: integer, source: system, description: "Final agreed or arbitrated amount; null until ACCEPTED" }
      - { name: round_count, type: integer, source: system, default: 0, description: "Number of offer rejections so far; hard cap MAX_CLAIM_ROUNDS (3)" }
      - { name: status, type: enum, source: system, description: "FILED | OFFER_MADE | DISPUTED | ACCEPTED | PAID | WITHDRAWN; initial FILED" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; exactly one of claim_id / revenue_statement_id must be present" }
      - { name: revenue_statement_id, type: string, source: input, description: "FK -> RevenueStatement.id; exactly one of claim_id / revenue_statement_id must be present" }
      - { name: opened_by_role, type: enum, source: system, description: "CUSTOMER | AGENT — derived from the caller's role" }
      - { name: filer_user_id, type: string, source: system, description: "X-User-ID of the filer" }
      - { name: subject_amount_cents, type: integer, source: input, description: "Amount in controversy; > 0" }
      - { name: responded_at, type: datetime, source: system, description: "Logical clock timestamp of van line response; null until RESPONSE_FILED" }
      - { name: responded_by_user_id, type: string, source: system, description: "X-User-ID of the responding VanLineAdmin; drives segregation-of-duties on decide" }
      - { name: escalated_at, type: datetime, source: system, description: "Logical clock timestamp of arbitration filing; null until ARBITRATION_DOCKETED" }
      - { name: filing_fee_cents, type: integer, source: computed, description: "Arbitration filing fee ARBITRATION_FILING_FEE_CENTS (25000), set at escalation" }
      - { name: decision_amount_cents, type: integer, source: system, description: "Arbitrator-awarded amount; null until DECIDED" }
      - { name: fee_allocated_to, type: enum, source: computed, description: "FILER | RESPONDENT | SPLIT per arbitration_fee_allocation; null until DECIDED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the Arbitrator; null until DECIDED" }
      - { name: status, type: enum, source: system, description: "OPENED | RESPONSE_FILED | ARBITRATION_DOCKETED | DECIDED | CLOSED | WITHDRAWN; initial OPENED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Agent
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /agents/{id}/suspend
        actor: VanLineAdmin
        preconditions: ["Agent.status == ACTIVE (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects: ["Agent.version += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /agents/{id}/reactivate
        actor: VanLineAdmin
        preconditions: ["Agent.status == SUSPENDED (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects: ["Agent.version += 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: POST /agents/{id}/suspend
        actor: VanLineAdmin
        preconditions: ["request payload terminal: true", "no OrderAgentAssignment for this agent in status PROPOSED or CONFIRMED on an order not in {DELIVERED, SETTLED, CLOSED, CANCELLED} (ERR_AGENT_HAS_OPEN_WORK)"]
        side_effects: ["Agent.version += 1"]

  - entity: Tariff
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: POST /tariffs/{id}/publish
        actor: VanLineAdmin
        preconditions:
          - "Tariff.status == DRAFT (else ERR_TRANSITION_NOT_ALLOWED)"
          - "No other PUBLISHED tariff whose [effective_start, effective_end) intersects this window; adjacency (existing.effective_end == this.effective_start) is allowed (ERR_TARIFF_WINDOW_OVERLAP)"
        side_effects: ["Tariff.version += 1"]

  - entity: MoveOrder
    initial_state: REGISTERED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: REGISTERED
        to: BOOKED
        trigger: POST /orders/{id}/book
        actor: BookingAgent
        preconditions:
          - "MoveOrder.status == REGISTERED (else ERR_ORDER_NOT_REGISTERED)"
          - "An Estimate with order_id == this order, status == ACCEPTED, estimate_kind == order.pricing_mode exists (ERR_NO_ACCEPTED_ESTIMATE)"
          - "A ValuationCoverage with order_id == this order, status == ELECTED exists (ERR_NO_VALUATION_COVERAGE)"
          - "CONFIRMED OrderAgentAssignments exist for all four roles (BOOKING auto-confirmed at registration; ORIGIN, HAULING, DESTINATION must be CONFIRMED) (ERR_AGENT_ROLES_INCOMPLETE)"
        side_effects:
          - "delivery_spread_window computed: earliest_delivery_date, latest_delivery_date set"
          - "MoveOrder.version += 1"
      - from: BOOKED
        to: IN_TRANSIT
        trigger: POST /orders/{id}/dispatch
        actor: HaulingAgent
        preconditions:
          - "MoveOrder.status == BOOKED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "A WeightTicket with order_id == this order and ticket_kind == ORIGINAL exists (ERR_WEIGHT_TICKET_REQUIRED)"
          - "Every CrewAssignment with order_id == this order, service_end == ORIGIN, status in {CONFIRMED} is COMPLETED (ERR_ORIGIN_SERVICES_INCOMPLETE)"
          - "current logical clock >= pickup_date (ERR_PICKUP_DATE_NOT_REACHED)"
        side_effects:
          - "ValuationCoverage with status ELECTED on this order -> LOCKED"
          - "billing_status UNBILLED -> PROVISIONALLY_BILLED; delivery_amount_due_cents provisionally set to estimated_charges_cents of the ACCEPTED estimate"
          - "MoveOrder.version += 1"
      - from: IN_TRANSIT
        to: IN_SIT
        trigger: POST /orders/{id}/sit-lots
        actor: HaulingAgent
        preconditions:
          - "MoveOrder.status == IN_TRANSIT (else ERR_ORDER_NOT_IN_TRANSIT)"
          - "Warehouse referenced by warehouse_id has status == ACTIVE (ERR_WAREHOUSE_INACTIVE)"
          - "warehouse.occupied_cwt + ceil(order.actual_weight_lbs/100) <= warehouse.capacity_cwt (ERR_WAREHOUSE_CAPACITY_EXCEEDED)"
        side_effects:
          - "SITLot created IN_STORAGE with stored_weight_cwt = ceil(actual_weight_lbs/100), checked_in_at = current logical clock"
          - "Warehouse.occupied_cwt += stored_weight_cwt (ledger sync; Warehouse.version += 1)"
          - "MoveOrder.version += 1"
      - from: IN_SIT
        to: OUT_FOR_DELIVERY
        trigger: POST /sit-lots/{id}/release
        actor: DestinationAgent
        preconditions:
          - "SITLot.status == IN_STORAGE after day-limit re-evaluation (ERR_LOT_NOT_IN_STORAGE when already RELEASED or auto-converted)"
          - "Confirming a release does not create a crew conflict — release itself has no crew check (crew rules live on crew-assignment confirm)"
        side_effects:
          - "SITLot -> RELEASED, released_at = current logical clock, accrued_storage_cents frozen per sit_storage_accrual"
          - "Warehouse.occupied_cwt -= stored_weight_cwt (compensating ledger sync; Warehouse.version += 1)"
          - "MoveOrder -> OUT_FOR_DELIVERY; MoveOrder.version += 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: POST /orders/{id}/deliver
        actor: DestinationAgent
        preconditions:
          - "MoveOrder.status in {IN_TRANSIT, OUT_FOR_DELIVERY} (else ERR_TRANSITION_NOT_ALLOWED)"
          - "No SITLot on this order with status IN_STORAGE (ERR_SHIPMENT_IN_STORAGE)"
          - "No ReweighRequest on this order with status == REQUESTED (ERR_REWEIGH_PENDING — customer must cancel the pending request first)"
          - "payload collected_at_delivery_cents == recomputed delivery_amount_due_cents (ERR_DELIVERY_PAYMENT_MISMATCH)"
        side_effects:
          - "final_charges_and_delivery_cap computed with authoritative weight; final_charges_cents, delivery_amount_due_cents, deferred_balance_cents set; collected_at_delivery_cents recorded; delivered_at = current logical clock"
          - "billing_status -> FINAL_BILLED; for BINDING orders billing_status continues to PAID within the same transition"
          - "Every ReweighRequest on this order with status == PERFORMED -> EXPIRED (conditional cascade; the customer let the re-weigh lapse, original weight stands)"
          - "RevenueStatement created PROVISIONAL (hop 1 cascade): revenue_split_waterfall computed, share fields written"
          - "Each CONFIRMED OrderAgentAssignment on this order -> COMPLETED with split_amount_cents written (hop 2 cascade, caused by statement creation)"
          - "Each completed assignment credits Agent.ytd_linehaul_share_cents += split_amount_cents (hop 3 cascade, caused by assignment mutation; Agent.version += 1 each)"
          - "MoveOrder.version += 1"
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: POST /orders/{id}/deliver
        actor: DestinationAgent
        preconditions: ["same as IN_TRANSIT -> DELIVERED"]
        side_effects: ["same as IN_TRANSIT -> DELIVERED"]
      - from: DELIVERED
        to: SETTLED
        trigger: POST /revenue-statements/{id}/finalize
        actor: VanLineAdmin
        preconditions: ["RevenueStatement.status == PROVISIONAL", "MoveOrder.status == DELIVERED"]
        side_effects:
          - "MoveOrder -> SETTLED; MoveOrder.version += 1 (caused by statement finalization)"
          - "Every CrewAssignment on this order with status COMPLETED -> INVOICED (cascade from statement finalization)"
      - from: SETTLED
        to: CLOSED
        trigger: POST /orders/{id}/close
        actor: VanLineAdmin
        preconditions:
          - "MoveOrder.status == SETTLED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "No Claim on this order with status in {FILED, OFFER_MADE, DISPUTED, ACCEPTED} (ERR_OPEN_CLAIMS_EXIST)"
          - "No Dispute referencing this order's claims or statement with status in {OPENED, RESPONSE_FILED, ARBITRATION_DOCKETED, DECIDED} (ERR_OPEN_DISPUTES_EXIST)"
        side_effects: ["MoveOrder.version += 1"]
      - from: REGISTERED
        to: CANCELLED
        trigger: POST /orders/{id}/cancel
        actor: BookingAgent
        preconditions: ["MoveOrder.status in {REGISTERED, BOOKED} (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects:
          - "ISSUED or ACCEPTED Estimates on this order -> VOIDED"
          - "ELECTED ValuationCoverage -> SUPERSEDED"
          - "PROPOSED or CONFIRMED OrderAgentAssignments -> RELEASED"
          - "REQUESTED or CONFIRMED CrewAssignments -> CANCELLED (compensation: crew hours returned to agent-date pool)"
          - "billing_status remains UNBILLED; MoveOrder.version += 1"
      - from: BOOKED
        to: CANCELLED
        trigger: POST /orders/{id}/cancel
        actor: BookingAgent
        preconditions: ["MoveOrder.status in {REGISTERED, BOOKED} (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects: ["same as REGISTERED -> CANCELLED"]

  - entity: Estimate
    initial_state: ISSUED
    terminal_states: [DECLINED, SUPERSEDED, EXPIRED, VOIDED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: POST /estimates/{id}/accept
        actor: Customer
        preconditions:
          - "Estimate.status == ISSUED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "MoveOrder.status == REGISTERED (ERR_ORDER_NOT_REGISTERED)"
          - "current logical clock <= Estimate.expires_at (ERR_ESTIMATE_EXPIRED; the estimate transitions to EXPIRED in the same rejection)"
        side_effects:
          - "MoveOrder.estimated_weight_lbs := Estimate.estimated_weight_lbs; MoveOrder.version += 1"
          - "Estimate.version += 1"
      - from: ISSUED
        to: DECLINED
        trigger: POST /estimates/{id}/decline
        actor: Customer
        preconditions: ["Estimate.status == ISSUED (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects: ["Estimate.version += 1"]
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (side effect of POST /orders/{id}/estimates creating a newer estimate on the same order)"
        actor: system
        preconditions: []
        side_effects: ["Estimate.version += 1"]
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (side effect of POST /orders/{id}/estimates while order still REGISTERED)"
        actor: system
        preconditions: []
        side_effects: ["MoveOrder.estimated_weight_lbs := null until the new estimate is ACCEPTED; Estimate.version += 1"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (evaluated when an accept is attempted with current logical clock > expires_at)"
        actor: system
        preconditions: []
        side_effects: ["Estimate.version += 1"]
      - from: ISSUED
        to: VOIDED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["Estimate.version += 1"]
      - from: ACCEPTED
        to: VOIDED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["Estimate.version += 1"]

  - entity: OrderAgentAssignment
    initial_state: PROPOSED
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: POST /order-agent-assignments/{id}/confirm
        actor: OriginAgent
        preconditions:
          - "Assignment.status == PROPOSED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "Acting X-User-ID == assignment.agent_id (ERR_FORBIDDEN_ROLE)"
          - "Agent.status == ACTIVE (ERR_AGENT_SUSPENDED)"
          - "MoveOrder.status == REGISTERED (ERR_ORDER_NOT_REGISTERED)"
        side_effects: ["split_pct snapshot computed (role base pct + commission tier bonus)", "Assignment.version += 1"]
      - from: PROPOSED
        to: RELEASED
        trigger: POST /order-agent-assignments/{id}/release
        actor: BookingAgent
        preconditions:
          - "Assignment.status == PROPOSED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "Assignment.role != BOOKING (booking assignment cannot be released) (ERR_TRANSITION_NOT_ALLOWED)"
          - "MoveOrder.status == REGISTERED (ERR_ORDER_NOT_REGISTERED)"
        side_effects: ["Assignment.version += 1"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["Assignment.version += 1"]
      - from: PROPOSED
        to: RELEASED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["Assignment.version += 1"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (deliver cascade at RevenueStatement creation)"
        actor: system
        preconditions: []
        side_effects: ["split_amount_cents written per revenue_split_waterfall", "Agent.ytd_linehaul_share_cents credited", "Assignment.version += 1"]

  - entity: ValuationCoverage
    initial_state: ELECTED
    terminal_states: [LOCKED, SUPERSEDED]
    transitions:
      - from: ELECTED
        to: LOCKED
        trigger: "system (dispatch side effect)"
        actor: system
        preconditions: []
        side_effects: ["ValuationCoverage.version += 1"]
      - from: ELECTED
        to: SUPERSEDED
        trigger: "system (side effect of POST /orders/{id}/valuation-coverages electing a replacement pre-dispatch, or order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["ValuationCoverage.version += 1"]

  - entity: ReweighRequest
    initial_state: REQUESTED
    terminal_states: [APPLIED, DECLINED_BY_CUSTOMER, CANCELLED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: PERFORMED
        trigger: POST /reweigh-requests/{id}/perform
        actor: HaulingAgent
        preconditions:
          - "ReweighRequest.status == REQUESTED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "MoveOrder.status in {IN_TRANSIT, IN_SIT} (ERR_ORDER_NOT_IN_TRANSIT)"
        side_effects:
          - "WeightTicket created with ticket_kind REWEIGH, reweigh_request_id = this request, supersedes_ticket_id = order.authoritative_weight_ticket_id"
          - "ReweighRequest.resulting_ticket_id := new ticket id; ReweighRequest.version += 1"
      - from: PERFORMED
        to: APPLIED
        trigger: POST /reweigh-requests/{id}/apply
        actor: Customer
        preconditions:
          - "ReweighRequest.status == PERFORMED (else ERR_REWEIGH_REQUEST_NOT_PERFORMED)"
          - "MoveOrder.status in {IN_TRANSIT, IN_SIT} (ERR_ORDER_NOT_IN_TRANSIT)"
        side_effects:
          - "MoveOrder.authoritative_weight_ticket_id := resulting_ticket_id; actual_weight_lbs recomputed; MoveOrder.version += 1"
          - "final_charges_and_delivery_cap recomputed; delivery_amount_due_cents refreshed (110% cap re-evaluated against new net weight)"
          - "ReweighRequest.version += 1"
      - from: PERFORMED
        to: DECLINED_BY_CUSTOMER
        trigger: POST /reweigh-requests/{id}/decline
        actor: Customer
        preconditions: ["ReweighRequest.status == PERFORMED (else ERR_REWEIGH_REQUEST_NOT_PERFORMED)"]
        side_effects: ["Original authoritative weight stands", "ReweighRequest.version += 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: POST /reweigh-requests/{id}/cancel
        actor: Customer
        preconditions: ["ReweighRequest.status == REQUESTED (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects: ["ReweighRequest.version += 1"]
      - from: PERFORMED
        to: EXPIRED
        trigger: "system (deliver cascade — re-weigh performed but never applied before delivery; original weight stands)"
        actor: system
        preconditions: []
        side_effects: ["ReweighRequest.version += 1"]

  - entity: SITLot
    initial_state: IN_STORAGE
    terminal_states: [RELEASED, CONVERTED_PERMANENT]
    transitions:
      - from: IN_STORAGE
        to: RELEASED
        trigger: POST /sit-lots/{id}/release
        actor: DestinationAgent
        preconditions:
          - "Day-limit rule is evaluated first: if days_stored >= SIT_MAX_DAYS (180) the lot transitions to CONVERTED_PERMANENT and the release is rejected (ERR_LOT_NOT_IN_STORAGE)"
          - "SITLot.status == IN_STORAGE (else ERR_LOT_NOT_IN_STORAGE)"
        side_effects: ["see MoveOrder IN_SIT -> OUT_FOR_DELIVERY transition"]
      - from: IN_STORAGE
        to: CONVERTED_PERMANENT
        trigger: "system (day-limit re-evaluation on any read or mutation of the lot once days_stored >= 180)"
        actor: system
        preconditions: []
        side_effects: ["accrued_storage_cents frozen at the 180-day cap", "Warehouse.occupied_cwt -= stored_weight_cwt (ledger sync; Warehouse.version += 1)", "SITLot.version += 1"]
        note: "deliver precondition ERR_SHIPMENT_IN_STORAGE blocks only on IN_STORAGE lots; a CONVERTED_PERMANENT lot has released warehouse capacity and does not block delivery — conversion models the shipment passing to permanent storage under a new contract."

  - entity: CrewAssignment
    initial_state: REQUESTED
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: POST /crew-assignments/{id}/confirm
        actor: OriginAgent
        preconditions:
          - "CrewAssignment.status == REQUESTED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "Acting X-User-ID == crew_assignment.agent_id (ERR_FORBIDDEN_ROLE)"
          - "No other CONFIRMED CrewAssignment with the same agent_id and service_date whose half-open [start_hour, end_hour) intersects this one; adjacency (end == start) allowed (ERR_CREW_SCHEDULE_CONFLICT)"
        side_effects: ["CrewAssignment.version += 1"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: POST /crew-assignments/{id}/complete
        actor: OriginAgent
        preconditions:
          - "CrewAssignment.status == CONFIRMED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "Acting X-User-ID == crew_assignment.agent_id (ERR_FORBIDDEN_ROLE)"
          - "MoveOrder.status not in {REGISTERED, CANCELLED} (ERR_TRANSITION_NOT_ALLOWED)"
        side_effects: ["CrewAssignment.version += 1"]
      - from: COMPLETED
        to: INVOICED
        trigger: "system (statement finalize cascade)"
        actor: system
        preconditions: []
        side_effects: ["CrewAssignment.version += 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: POST /crew-assignments/{id}/cancel
        actor: OriginAgent
        preconditions: ["CrewAssignment.status in {REQUESTED, CONFIRMED} (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects: ["CrewAssignment.version += 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /crew-assignments/{id}/cancel
        actor: OriginAgent
        preconditions: ["CrewAssignment.status in {REQUESTED, CONFIRMED} (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects: ["Confirmed crew-hours returned to the agent-date pool (compensating action)", "CrewAssignment.version += 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["CrewAssignment.version += 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["Confirmed crew-hours returned to the agent-date pool (compensating action)", "CrewAssignment.version += 1"]

  - entity: Claim
    initial_state: FILED
    terminal_states: [PAID, WITHDRAWN]
    transitions:
      - from: FILED
        to: OFFER_MADE
        trigger: POST /claims/{id}/offer
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status in {FILED, DISPUTED} (else ERR_TRANSITION_NOT_ALLOWED)"
          - "offer_amount_cents <= claim_settlement_cap (ERR_OFFER_EXCEEDS_VALUATION_CAP)"
        side_effects: ["offer_amount_cents and offered_by_user_id recorded", "Claim.version += 1"]
      - from: DISPUTED
        to: OFFER_MADE
        trigger: POST /claims/{id}/offer
        actor: ClaimsAdjuster
        preconditions: ["same as FILED -> OFFER_MADE"]
        side_effects: ["same as FILED -> OFFER_MADE"]
      - from: OFFER_MADE
        to: DISPUTED
        trigger: POST /claims/{id}/reject-offer
        actor: Customer
        preconditions:
          - "Claim.status == OFFER_MADE (else ERR_TRANSITION_NOT_ALLOWED)"
          - "round_count < MAX_CLAIM_ROUNDS (3) (ERR_CLAIM_ROUNDS_EXHAUSTED — further negotiation forbidden; customer must use the arbitration program)"
        side_effects: ["round_count += 1", "Claim.version += 1"]
      - from: OFFER_MADE
        to: ACCEPTED
        trigger: POST /claims/{id}/accept
        actor: Customer
        preconditions: ["Claim.status == OFFER_MADE (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects:
          - "settled_amount_cents := offer_amount_cents"
          - "RevenueStatement of this order: chargeback_total_cents += settled_amount_cents (cascade; statement.version += 1)"
          - "HAULING agent quality_score recomputed = max(0, 100 - floor(chargeback_total_cents / 10000)) (cascade hop 2, Agent.version += 1)"
          - "Claim.version += 1"
      - from: FILED
        to: ACCEPTED
        trigger: "system (arbitration decide cascade sets settled_amount_cents := decision_amount_cents)"
        actor: system
        preconditions: []
        side_effects: ["same cascades as OFFER_MADE -> ACCEPTED"]
      - from: DISPUTED
        to: ACCEPTED
        trigger: "system (arbitration decide cascade)"
        actor: system
        preconditions: []
        side_effects: ["same cascades as OFFER_MADE -> ACCEPTED"]
      - from: ACCEPTED
        to: PAID
        trigger: POST /claims/{id}/pay
        actor: VanLineAdmin
        preconditions:
          - "Claim.status == ACCEPTED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "Acting X-User-ID != offered_by_user_id (ERR_SEGREGATION_OF_DUTIES); when the accept came from arbitration, offered_by_user_id is the arbitrator's id"
        side_effects:
          - "Claim.version += 1"
          - "Any Dispute with claim_id == this claim and status in {OPENED, RESPONSE_FILED, ARBITRATION_DOCKETED, DECIDED} -> CLOSED (cascade)"
      - from: FILED
        to: WITHDRAWN
        trigger: POST /claims/{id}/withdraw
        actor: Customer
        preconditions: ["Claim.status in {FILED, OFFER_MADE, DISPUTED} (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects: ["Claim.version += 1"]
      - from: OFFER_MADE
        to: WITHDRAWN
        trigger: POST /claims/{id}/withdraw
        actor: Customer
        preconditions: ["Claim.status in {FILED, OFFER_MADE, DISPUTED} (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects: ["Claim.version += 1"]
      - from: DISPUTED
        to: WITHDRAWN
        trigger: POST /claims/{id}/withdraw
        actor: Customer
        preconditions: ["Claim.status in {FILED, OFFER_MADE, DISPUTED} (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects: ["Claim.version += 1"]

  - entity: RevenueStatement
    initial_state: PROVISIONAL
    terminal_states: [RECONCILED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: POST /revenue-statements/{id}/finalize
        actor: VanLineAdmin
        preconditions:
          - "RevenueStatement.status == PROVISIONAL (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "MoveOrder -> SETTLED (cascade; order.version += 1)"
          - "CrewAssignments COMPLETED -> INVOICED (cascade)"
          - "RevenueStatement.version += 1"
      - from: FINAL
        to: RECONCILED
        trigger: POST /revenue-statements/{id}/reconcile
        actor: VanLineAdmin
        preconditions:
          - "RevenueStatement.status == FINAL (else ERR_TRANSITION_NOT_ALLOWED)"
          - "No Dispute with revenue_statement_id == this statement and status in {OPENED, RESPONSE_FILED, ARBITRATION_DOCKETED, DECIDED} (ERR_OPEN_DISPUTES_EXIST)"
        side_effects: ["RevenueStatement.version += 1"]

  - entity: Dispute
    initial_state: OPENED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: OPENED
        to: RESPONSE_FILED
        trigger: POST /disputes/{id}/respond
        actor: VanLineAdmin
        preconditions: ["Dispute.status == OPENED (else ERR_TRANSITION_NOT_ALLOWED)"]
        side_effects: ["responded_at = current logical clock; responded_by_user_id recorded", "Dispute.version += 1"]
      - from: RESPONSE_FILED
        to: ARBITRATION_DOCKETED
        trigger: POST /disputes/{id}/escalate-to-arbitration
        actor: Customer
        preconditions:
          - "Dispute.status == RESPONSE_FILED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "Acting X-User-ID == filer_user_id (ERR_FORBIDDEN_ROLE)"
          - "current logical clock >= responded_at + MEDIATION_COOLING_OFF_DAYS (14 days) (ERR_MEDIATION_PERIOD_NOT_ELAPSED)"
        side_effects: ["filing_fee_cents := ARBITRATION_FILING_FEE_CENTS (25000); escalated_at set", "Dispute.version += 1"]
      - from: ARBITRATION_DOCKETED
        to: DECIDED
        trigger: POST /disputes/{id}/decide
        actor: Arbitrator
        preconditions:
          - "Dispute.status == ARBITRATION_DOCKETED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "Acting X-User-ID != responded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "0 <= decision_amount_cents <= subject_amount_cents (ERR_DECISION_OUT_OF_RANGE)"
        side_effects:
          - "fee_allocated_to computed per arbitration_fee_allocation; decided_by_user_id recorded"
          - "Claim disputes: Claim -> ACCEPTED with settled_amount_cents := decision_amount_cents and offered_by_user_id := decided_by_user_id (cascade; chargeback + quality_score cascades fire as in Claim accept)"
          - "Revenue disputes: RevenueStatement.chargeback_total_cents += decision_amount_cents (cascade adjustment)"
          - "Dispute.version += 1"
      - from: DECIDED
        to: CLOSED
        trigger: POST /disputes/{id}/close
        actor: VanLineAdmin
        preconditions:
          - "Dispute.status == DECIDED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "Claim disputes: the referenced Claim.status == PAID (ERR_CLAIM_NOT_PAID); revenue disputes: no additional condition"
        side_effects: ["Dispute.version += 1"]
      - from: OPENED
        to: WITHDRAWN
        trigger: POST /disputes/{id}/withdraw
        actor: Customer
        preconditions:
          - "Dispute.status in {OPENED, RESPONSE_FILED} (else ERR_TRANSITION_NOT_ALLOWED)"
          - "Acting X-User-ID == filer_user_id (ERR_FORBIDDEN_ROLE)"
        side_effects: ["Dispute.version += 1"]
      - from: RESPONSE_FILED
        to: WITHDRAWN
        trigger: POST /disputes/{id}/withdraw
        actor: Customer
        preconditions: ["same as OPENED -> WITHDRAWN"]
        side_effects: ["Dispute.version += 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: estimate-create-stale-order
    parent_entity: MoveOrder
    write_endpoint: "POST /orders/{id}/estimates"
    occ_field: expected_order_version
    description: |
      Creating an Estimate against a MoveOrder whose version has advanced since the
      client last observed it is rejected. A newer estimate legitimately supersedes
      any prior ISSUED or ACCEPTED estimate (Estimate SUPERSEDED transitions), so a
      writer holding a stale order version would supersede a revision it never saw.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: valuation-create-stale-order
    parent_entity: MoveOrder
    write_endpoint: "POST /orders/{id}/valuation-coverages"
    occ_field: expected_order_version
    description: |
      Electing a ValuationCoverage against a MoveOrder whose version has advanced
      since the client last observed it is rejected. A new election legitimately
      supersedes the ELECTED coverage, so a stale writer would replace a coverage
      it never observed.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: linehaul_charge
    description: "Weight-distance linehaul charge against the order's tariff. Two variants keyed on pricing_mode produce different results for identical physical data."
    trigger: "estimate issuance (estimated basis), dispatch (provisional), delivery and re-weigh apply (final basis)"
    algorithm: tiered_pricing
    formula: |
      cwt = ceil(weight_lbs / 100)                      # any nonzero remainder rounds up to the next cwt
      band = the unique mileage_bands entry with min_miles <= order.mileage < max_miles
             (final band: min_miles <= order.mileage <= max_miles)
      linehaul_cents = round_half_up(cwt * tariff.base_rate_cents_per_cwt * band.rate_multiplier)
    input_set: "weight_lbs = BINDING variant -> ACCEPTED estimate's estimated_weight_lbs; NON_BINDING variant -> order.actual_weight_lbs from the authoritative WeightTicket"
    constants:
      CWT_LBS: 100
    precision: "integer cents; round_half_up at the single final multiplication"
    variants:
      - name: binding_basis
        when: "order.pricing_mode == BINDING"
        difference: "weight_lbs is locked to the ACCEPTED estimate's estimated_weight_lbs; actual scale weight never changes the charge"
      - name: non_binding_basis
        when: "order.pricing_mode == NON_BINDING"
        difference: "weight_lbs is the authoritative actual_weight_lbs (original weighment or applied re-weigh)"

  - name: estimate_total
    description: "Total estimated charges. Component-level rounding order is pinned: each component is rounded to integer cents BEFORE summation; sum-then-round yields different cents and is forbidden."
    trigger: "POST /orders/{id}/estimates (on the new estimate)"
    algorithm: tiered_pricing
    formula: |
      step 1: linehaul_cents   = linehaul_charge(binding_or_non_binding estimated basis over estimated_weight_lbs)   # already integer cents
      step 2: fuel_surcharge_cents = round_half_up(linehaul_cents * tariff.fuel_surcharge_pct)
      step 3: valuation_premium_cents = premium of the order's ELECTED ValuationCoverage per valuation_premium (integer cents); 0 when no coverage elected
      step 4: packing_cents = estimate.packing_services_cents (already integer cents)
      step 5: estimated_charges_cents = linehaul_cents + fuel_surcharge_cents + valuation_premium_cents + packing_cents
      PINNED ROUNDING ORDER: every component is an integer-cent value before step 5; never round the sum.
    input_set: "the new estimate's estimated_weight_lbs + packing_services_cents; order's tariff; order's ELECTED valuation coverage at issuance time (snapshot)"
    constants:
      ESTIMATE_VALIDITY_DAYS: 30
    precision: "integer cents, round_half_up per component"
    variants:
      - name: no_coverage_elected
        when: "no ELECTED ValuationCoverage exists at issuance"
        difference: "valuation_premium_cents = 0"

  - name: valuation_premium
    description: "Valuation coverage premium. Tiered by deductible with a per-$100 rate."
    trigger: "POST /orders/{id}/valuation-coverages (on the new coverage)"
    algorithm: tiered_pricing
    formula: |
      if coverage_type == RELEASED_VALUE: premium_cents = 0
      else (FULL_VALUE_PROTECTION):
        units = ceil(declared_value_cents / 10000)             # whole $100 units, round up
        deductible_factor = DEDUCTIBLE_FACTOR[deductible_cents]  # {0: 1.00, 25000: 0.85, 50000: 0.70}
        premium_cents = round_half_up(units * FVP_RATE_PER_100_CENTS * deductible_factor)
    input_set: "the new coverage's coverage_type, declared_value_cents, deductible_cents"
    constants:
      FVP_RATE_PER_100_CENTS: 85
      DEDUCTIBLE_FACTOR: "{0: 1.00, 25000: 0.85, 50000: 0.70}"
    precision: "integer cents, round_half_up"
    variants:
      - name: released_value
        when: "coverage_type == RELEASED_VALUE"
        difference: "premium is always 0; carrier liability instead capped per-pound in claim_settlement_cap"

  - name: final_charges_and_delivery_cap
    description: "Final invoice and the federal 110% collection rule for non-binding estimates. Provisional (dispatch) and final (delivery) bases diverge."
    trigger: "POST /orders/{id}/dispatch (provisional), POST /orders/{id}/deliver and POST /reweigh-requests/{id}/apply (final/recomputed)"
    algorithm: threshold
    formula: |
      final_charges_cents = linehaul_cents + fuel_surcharge_cents + valuation_premium_cents + packing_cents
        where linehaul_cents/fuel use linehaul_charge over the authoritative weight (NON_BINDING)
        or the accepted-estimate components verbatim (BINDING: final == accepted estimated_charges_cents)
      cap_cents = round_half_up(1.10 * accepted_estimate.estimated_charges_cents)
      delivery_amount_due_cents = min(final_charges_cents, cap_cents)   # NON_BINDING
      delivery_amount_due_cents = final_charges_cents                    # BINDING
      deferred_balance_cents = final_charges_cents - delivery_amount_due_cents
      Boundary: when final_charges_cents == cap_cents exactly, the full amount is demandable
      (min is inclusive) and deferred_balance_cents == 0.
    input_set: "authoritative WeightTicket (NON_BINDING) or ACCEPTED estimate (BINDING); the order's latest ACCEPTED estimate for the cap; ELECTED/LOCKED valuation premium; packing from ACCEPTED estimate"
    constants:
      NON_BINDING_CAP_PCT: 1.10
    precision: "integer cents, round_half_up for the cap"
    variants:
      - name: provisional_at_dispatch
        when: "at dispatch, before any authoritative weight beyond the original weighment"
        difference: "delivery_amount_due_cents is provisionally the ACCEPTED estimate's estimated_charges_cents"
      - name: final_at_delivery
        when: "at delivery (and re-weigh apply)"
        difference: "recomputed against the authoritative weight; BINDING never changes"

  - name: delivery_spread_window
    description: "Earliest and latest contractual delivery dates from pickup date and mileage band."
    trigger: "POST /orders/{id}/book"
    algorithm: threshold
    formula: |
      (transit_days, spread_days) = SPREAD_TABLE entry with min_miles <= order.mileage < max_miles
        (final band inclusive of max_miles)
      earliest_delivery_date = pickup_date + transit_days days
      latest_delivery_date   = earliest_delivery_date + spread_days days
      Boundary: mileage == 500 selects the [500,1500) band, not the [0,500) band (min-inclusive).
    input_set: "order.mileage, order.pickup_date"
    constants:
      SPREAD_TABLE: "[{min_miles: 0, max_miles: 500, transit_days: 2, spread_days: 2}, {min_miles: 500, max_miles: 1500, transit_days: 4, spread_days: 3}, {min_miles: 1500, max_miles: 2500, transit_days: 6, spread_days: 4}, {min_miles: 2500, max_miles: 999999, transit_days: 8, spread_days: 5}]"
    precision: "whole days, date arithmetic at 00:00:00Z"
    variants: []

  - name: sit_storage_accrual
    description: "Storage-in-transit accrual with first-day-free and the 180-day permanent-storage cap."
    trigger: "read-time while IN_STORAGE; frozen at release or conversion"
    algorithm: threshold
    formula: |
      days_stored = floor(((released_at or current logical clock) - checked_in_at) / 86400 seconds)
      billable_days = min(days_stored, SIT_MAX_DAYS)
      accrued_storage_cents = stored_weight_cwt * tariff.sit_daily_rate_cents_per_cwt * billable_days
      Boundaries: same-day release -> days_stored == 0 -> accrued == 0.
      days_stored >= 180 -> lot CONVERTED_PERMANENT and accrual frozen at the 180-day cap.
    input_set: "the lot's stored_weight_cwt and checked_in_at; order's tariff sit_daily_rate_cents_per_cwt; logical clock"
    constants:
      SIT_MAX_DAYS: 180
    precision: "integer cents (all inputs integer)"
    variants: []

  - name: crew_labor_invoice
    description: "Crew invoice with daily overtime multiplier. Rounding order pinned: per-worker overtime rounded first, then multiplied by crew size."
    trigger: "POST /orders/{id}/crew-assignments (computed at creation, frozen thereafter)"
    algorithm: threshold
    formula: |
      labor_hours = end_hour - start_hour
      regular_hours = min(labor_hours, OT_THRESHOLD_HOURS)              # exactly 8 -> no overtime
      overtime_hours = max(0, labor_hours - OT_THRESHOLD_HOURS)
      per_worker_cents = regular_hours * rate + round_half_up(overtime_hours * rate * OT_MULTIPLIER)
      invoice_amount_cents = crew_size * per_worker_cents
      rate = order's tariff.hourly_labor_rate_cents
    input_set: "the crew assignment's start_hour, end_hour, crew_size; order's tariff"
    constants:
      OT_THRESHOLD_HOURS: 8
      OT_MULTIPLIER: 1.5
    precision: "integer cents; round_half_up on the per-worker overtime component only"
    variants: []

  - name: revenue_split_waterfall
    description: "Waterfall allocation of linehaul revenue across the four agent roles with commission-tier bonuses and a van-line floor. >=3 inputs with a conditional branch when the floor binds."
    trigger: "RevenueStatement creation at delivery"
    algorithm: waterfall_allocation
    formula: |
      L = statement.linehaul_revenue_cents            # final linehaul_cents + fuel_surcharge_cents
      effective_pct(role) = ROLE_BASE_PCT[role] + TIER_BONUS[agent.commission_tier of the CONFIRMED assignment for that role]
      Evaluate strictly in bucket order BOOKING, ORIGIN, HAULING, DESTINATION:
        share_i = round_half_up(L * effective_pct(role_i))
      van_line_share = L - (booking + origin + hauling + destination)
      floor = round_half_up(L * VAN_LINE_FLOOR_PCT)
      if van_line_share < floor:                      # conditional branch
        deficit = floor - van_line_share
        hauling_share_cents -= deficit                # deficit always absorbed by HAULING bucket (pinned; never pro-rata)
        van_line_share_cents = floor
      van_line_share_cents += valuation premium of the LOCKED coverage (premium flows to the van line)
      Attributable accessorials added to assignment.split_amount_cents (not to linehaul shares):
        ORIGIN assignment  += sum of invoice_amount_cents of COMPLETED origin crews
        DESTINATION assignment += sum of COMPLETED destination crews + accrued SIT storage
      Conservation invariant: booking + origin + hauling + destination + (van_line_share_cents - valuation_premium)
        == linehaul_revenue_cents at all times.
    input_set: "order final charges components; the four CONFIRMED OrderAgentAssignments and their agents' commission tiers; LOCKED valuation premium; COMPLETED crews; released SIT lots"
    constants:
      ROLE_BASE_PCT: "{BOOKING: 0.10, ORIGIN: 0.20, HAULING: 0.54, DESTINATION: 0.10}"
      TIER_BONUS: "{STANDARD: 0.00, PREFERRED: 0.01, PREMIER: 0.02}"
      VAN_LINE_FLOOR_PCT: 0.04
    precision: "integer cents; round_half_up per bucket in pinned bucket order; remainder absorbed by van-line residual then floor-adjusted via HAULING"
    variants: []

  - name: claim_settlement_cap
    description: "Maximum lawful settlement offer, dual-variant on the valuation coverage in force. Same claim data yields different caps under the two coverages."
    trigger: "POST /claims/{id}/offer (validation), claim filing (reference)"
    algorithm: threshold
    formula: |
      if coverage.coverage_type == RELEASED_VALUE:
        liability_cap_cents = RELEASED_VALUE_CENTS_PER_LB * claim.claimed_item_weight_lbs
      else (FULL_VALUE_PROTECTION):
        liability_cap_cents = max(coverage.declared_value_cents - coverage.deductible_cents, 0)
      max_offer_cents = min(claim.claimed_amount_cents, liability_cap_cents)
      Boundary: offer_amount_cents == max_offer_cents is allowed (inclusive cap).
    input_set: "the claim's claimed_amount_cents and claimed_item_weight_lbs; the captured ValuationCoverage"
    constants:
      RELEASED_VALUE_CENTS_PER_LB: 60
    precision: "integer cents"
    variants:
      - name: released_value_basis
        when: "LOCKED coverage is RELEASED_VALUE"
        difference: "cap scales with claimed item weight at 60 cents per lb regardless of declared value"
      - name: full_value_basis
        when: "LOCKED coverage is FULL_VALUE_PROTECTION"
        difference: "cap is declared value net of deductible, independent of item weight"

  - name: arbitration_fee_allocation
    description: "Filing-fee allocation from the arbitrator's decision relative to the amount in controversy."
    trigger: "POST /disputes/{id}/decide"
    algorithm: threshold
    formula: |
      ratio = decision_amount_cents / subject_amount_cents        # exact rational comparison
      if decision_amount_cents * 5 >= subject_amount_cents * 4: fee_allocated_to = RESPONDENT   # ratio >= 0.80 inclusive
      elif decision_amount_cents * 5 <= subject_amount_cents * 1: fee_allocated_to = FILER      # ratio <= 0.20 inclusive
      else: fee_allocated_to = SPLIT
      Boundaries: exactly 80% -> RESPONDENT; exactly 20% -> FILER. Integer cross-multiplication is pinned to avoid float drift.
    input_set: "dispute.decision_amount_cents, dispute.subject_amount_cents"
    constants:
      ARBITRATION_FILING_FEE_CENTS: 25000
      RESPONDENT_THRESHOLD_NUM: 4
      RESPONDENT_THRESHOLD_DEN: 5
      FILER_THRESHOLD_NUM: 1
      FILER_THRESHOLD_DEN: 5
    precision: "integer cross-multiplication, no rounding"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the eight declared roles; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list; for entity-backed roles the X-User-ID must resolve to an existing entity of the backing type"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership scoping: agent roles must hold the matching CONFIRMED/PROPOSED assignment (agent_id == X-User-ID, role matches caller's agent role) on the target order; Customer must equal order.customer_id; opaque roles exempt"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all order-scoped mutation endpoints"
  - priority: 4
    category: existence
    check: "Path-template resources exist, validated left to right; body-referenced ids (customer_id, tariff_id, agent_id, warehouse_id, claim_id, revenue_statement_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Request body is well-formed: required fields present, types correct, enum values in range, unknown fields rejected, gross_weight_lbs >= tare_weight_lbs, end_hour > start_hour, deductible_cents in {0, 25000, 50000}"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: state
    check: "Order state precondition for registration-phase writes (estimate create, valuation elect, agent assignment create/release/confirm): MoveOrder.status == REGISTERED"
    error_id: ERR_ORDER_NOT_REGISTERED
    http_status: 409
    applies_to: ["POST /orders/{id}/estimates", "POST /orders/{id}/valuation-coverages", "POST /orders/{id}/agent-assignments", "POST /order-agent-assignments/{id}/confirm", "POST /order-agent-assignments/{id}/release"]
  - priority: 7
    category: state
    check: "Book gates: ACCEPTED estimate of matching kind exists; ELECTED valuation coverage exists; all four role assignments CONFIRMED"
    error_id: ERR_NO_ACCEPTED_ESTIMATE
    http_status: 409
    applies_to: ["POST /orders/{id}/book"]
    description: "Three distinct failures map to ERR_NO_ACCEPTED_ESTIMATE / ERR_NO_VALUATION_COVERAGE / ERR_AGENT_ROLES_INCOMPLETE in this written order"
  - priority: 8
    category: state
    check: "Dispatch gates: status BOOKED; ORIGINAL weight ticket exists; origin crews completed"
    error_id: ERR_TRANSITION_NOT_ALLOWED
    http_status: 409
    applies_to: ["POST /orders/{id}/dispatch"]
    description: "Wrong-from-state -> ERR_TRANSITION_NOT_ALLOWED; missing weighment -> ERR_WEIGHT_TICKET_REQUIRED; open origin crews -> ERR_ORIGIN_SERVICES_INCOMPLETE, evaluated in that written order"
  - priority: 9
    category: state
    check: "Transit-phase gates: reweigh request/perform/apply and SIT check-in require status IN_TRANSIT (perform/apply also allow IN_SIT); deliver requires IN_TRANSIT or OUT_FOR_DELIVERY, no IN_STORAGE lot, no open reweigh request"
    error_id: ERR_ORDER_NOT_IN_TRANSIT
    http_status: 409
    applies_to: ["POST /orders/{id}/reweigh-requests", "POST /reweigh-requests/{id}/perform", "POST /reweigh-requests/{id}/apply", "POST /orders/{id}/sit-lots", "POST /orders/{id}/deliver"]
    description: "deliver wrong-from-state -> ERR_TRANSITION_NOT_ALLOWED; IN_STORAGE lot -> ERR_SHIPMENT_IN_STORAGE; open reweigh -> ERR_REWEIGH_PENDING, evaluated in that written order"
  - priority: 10
    category: state
    check: "Generic from-state precondition on all other action endpoints (accept/decline estimate, confirm/complete/cancel crew, offer/accept/reject/pay/withdraw claim, respond/escalate/decide/close/withdraw dispute, finalize/reconcile statement, release sit lot, publish tariff, suspend/reactivate agent)"
    error_id: ERR_TRANSITION_NOT_ALLOWED
    http_status: 409
    applies_to: "all action endpoints not covered by priorities 6-9"
  - priority: 11
    category: state
    check: "Specific sub-state gates: reweigh apply/decline require PERFORMED (ERR_REWEIGH_REQUEST_NOT_PERFORMED); chargeback and revenue-dispute filing require statement FINAL (ERR_STATEMENT_NOT_FINAL); dispute close on claim requires claim PAID (ERR_CLAIM_NOT_PAID); statement finalize requires PROVISIONAL (ERR_TRANSITION_NOT_ALLOWED); sit release requires IN_STORAGE after day-limit re-evaluation (ERR_LOT_NOT_IN_STORAGE)"
    error_id: ERR_REWEIGH_REQUEST_NOT_PERFORMED
    http_status: 409
    applies_to: ["POST /reweigh-requests/{id}/apply", "POST /reweigh-requests/{id}/decline", "POST /revenue-statements/{id}/chargebacks", "POST /disputes", "POST /disputes/{id}/close", "POST /revenue-statements/{id}/finalize", "POST /sit-lots/{id}/release"]
  - priority: 12
    category: state
    check: "Claim filing requires MoveOrder.status in {DELIVERED, SETTLED, CLOSED}"
    error_id: ERR_ORDER_NOT_DELIVERED
    http_status: 409
    applies_to: ["POST /orders/{id}/claims"]
  - priority: 13
    category: business_safety
    check: "Segregation of duties: claim pay caller X-User-ID != claim.offered_by_user_id; dispute decide caller X-User-ID != dispute.responded_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /claims/{id}/pay", "POST /disputes/{id}/decide"]
  - priority: 14
    category: business_temporal
    check: "Clock gates: dispatch requires clock >= pickup_date (ERR_PICKUP_DATE_NOT_REACHED); estimate accept requires clock <= expires_at (ERR_ESTIMATE_EXPIRED, and the estimate flips to EXPIRED); claim filing requires clock <= order.delivered_at + 270 days (ERR_CLAIM_WINDOW_EXPIRED); arbitration escalation requires clock >= responded_at + 14 days (ERR_MEDIATION_PERIOD_NOT_ELAPSED); crew service_date within [pickup_date, latest_delivery_date + 30 days] when order BOOKED or later (ERR_SERVICE_DATE_OUT_OF_WINDOW)"
    error_id: ERR_PICKUP_DATE_NOT_REACHED
    http_status: 422
    applies_to: ["POST /orders/{id}/dispatch", "POST /estimates/{id}/accept", "POST /orders/{id}/claims", "POST /disputes/{id}/escalate-to-arbitration", "POST /orders/{id}/crew-assignments"]
    description: "Each listed endpoint uses its own named error from this row's check text"
  - priority: 15
    category: business_constraint
    check: "Uniqueness and capacity: agent_code and customer email and tariff_code unique (ERR_DUPLICATE_*); one ORIGINAL weight ticket per order (ERR_ORIGINAL_WEIGHT_EXISTS); at most one non-terminal ReweighRequest per order and at most one APPLIED re-weigh per order (ERR_REWEIGH_ALREADY_USED); one open Dispute per claim or statement (ERR_DISPUTE_ALREADY_OPEN); claim round_count < 3 on reject-offer (ERR_CLAIM_ROUNDS_EXHAUSTED); estimate_kind == order.pricing_mode (ERR_ESTIMATE_KIND_MISMATCH); declared_value_cents > 0 for FVP coverage (ERR_INVALID_REQUEST); assigned agent ACTIVE (ERR_AGENT_SUSPENDED) and capability covers role (ERR_AGENT_CAPABILITY_MISSING); warehouse ACTIVE (ERR_WAREHOUSE_INACTIVE)"
    error_id: ERR_DUPLICATE_AGENT_CODE
    http_status: 409
    applies_to: ["POST /agents", "POST /customers", "POST /tariffs", "POST /orders/{id}/weight-tickets", "POST /orders/{id}/reweigh-requests", "POST /disputes", "POST /claims/{id}/reject-offer", "POST /orders/{id}/estimates", "POST /orders/{id}/valuation-coverages", "POST /orders/{id}/agent-assignments", "POST /orders/{id}/sit-lots"]
    description: "Each sub-check uses its own named error from this row's check text; uniqueness errors are ERR_DUPLICATE_AGENT_CODE / ERR_DUPLICATE_CUSTOMER_EMAIL / ERR_DUPLICATE_TARIFF_CODE"
  - priority: 16
    category: business_constraint
    check: "Interval conflicts: tariff publish window overlap vs PUBLISHED tariffs, half-open adjacency allowed (ERR_TARIFF_WINDOW_OVERLAP); crew confirm overlap vs same-agent same-date CONFIRMED crews, half-open [start_hour,end_hour), adjacency allowed (ERR_CREW_SCHEDULE_CONFLICT); SIT check-in aggregate capacity occupied_cwt + ceil(actual/100) <= capacity_cwt (ERR_WAREHOUSE_CAPACITY_EXCEEDED)"
    error_id: ERR_TARIFF_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /tariffs/{id}/publish", "POST /crew-assignments/{id}/confirm", "POST /orders/{id}/sit-lots"]
    description: "Each sub-check uses its own named error from this row's check text"
  - priority: 17
    category: business_referential
    check: "Cross-entity reference integrity at write time: order.tariff_id references a PUBLISHED tariff whose effective window covers pickup_date (ERR_TARIFF_NOT_PUBLISHED); dispute subject xor — exactly one of claim_id / revenue_statement_id present and the subject is in a disputable state: claim DISPUTED with round_count >= 1, statement FINAL (ERR_DISPUTE_SUBJECT_INVALID); crew service_end matches sourcing agent's role on the order (ERR_FORBIDDEN_ROLE via ownership row 3)"
    error_id: ERR_TARIFF_NOT_PUBLISHED
    http_status: 409
    applies_to: ["POST /orders", "POST /disputes", "POST /orders/{id}/crew-assignments"]
    description: "Order creation uses ERR_TARIFF_NOT_PUBLISHED; dispute creation uses ERR_DISPUTE_SUBJECT_INVALID"
  - priority: 18
    category: business_fiscal
    check: "Money gates: deliver collected_at_delivery_cents == recomputed delivery_amount_due_cents (ERR_DELIVERY_PAYMENT_MISMATCH); payment requires billing FINAL_BILLED with deferred_balance_cents > 0 (ERR_NO_BALANCE_DUE) and amount_cents == deferred_balance_cents (ERR_PAYMENT_AMOUNT_MISMATCH); claim offer <= claim_settlement_cap (ERR_OFFER_EXCEEDS_VALUATION_CAP); dispute decision within [0, subject_amount_cents] (ERR_DECISION_OUT_OF_RANGE)"
    error_id: ERR_DELIVERY_PAYMENT_MISMATCH
    http_status: 422
    applies_to: ["POST /orders/{id}/deliver", "POST /orders/{id}/payments", "POST /claims/{id}/offer", "POST /disputes/{id}/decide"]
    description: "Each sub-check uses its own named error from this row's check text"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z; before any set call the clock reads this default and never the wall clock."
    roles: [VanLineAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Re-evaluate SITLot day-limit conversions for lots in IN_STORAGE against the new clock"]

  # --- Agent ---
  - method: POST
    path: "/agents"
    description: "Register a network agent"
    roles: [VanLineAdmin]
    code: 201
    input: [legal_name, agent_code, capabilities, home_market, "commission_tier?"]
    output: Agent
    side_effects: ["status = ACTIVE", "quality_score = 100", "ytd_linehaul_share_cents = 0"]
  - method: GET
    path: "/agents"
    description: "List agents"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "status?", "capability?"]
    output: "Agent[]"
    side_effects: []
  - method: GET
    path: "/agents/{id}"
    description: "Get one agent"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: Agent
    side_effects: []
  - method: POST
    path: "/agents/{id}/suspend"
    description: "Suspend an agent (payload terminal: true terminates instead; allowed only from SUSPENDED with no open work)"
    roles: [VanLineAdmin]
    code: 200
    input: ["terminal?"]
    output: Agent
    side_effects: ["status ACTIVE -> SUSPENDED, or SUSPENDED -> TERMINATED when terminal: true"]
  - method: POST
    path: "/agents/{id}/reactivate"
    description: "Reactivate a suspended agent"
    roles: [VanLineAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: ["status SUSPENDED -> ACTIVE"]

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Register a shipper"
    roles: [VanLineAdmin, BookingAgent]
    code: 201
    input: [full_name, email, phone]
    output: Customer
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/customers"
    description: "List customers"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?"]
    output: "Customer[]"
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Get one customer"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Tariff ---
  - method: POST
    path: "/tariffs"
    description: "Create a tariff in DRAFT"
    roles: [VanLineAdmin]
    code: 201
    input: [tariff_code, effective_start, effective_end, base_rate_cents_per_cwt, mileage_bands, fuel_surcharge_pct, sit_daily_rate_cents_per_cwt, hourly_labor_rate_cents]
    output: Tariff
    side_effects: ["status = DRAFT"]
  - method: POST
    path: "/tariffs/{id}/publish"
    description: "Publish a tariff; rejects window overlap with other PUBLISHED tariffs (half-open adjacency allowed)"
    roles: [VanLineAdmin]
    code: 200
    input: []
    output: Tariff
    side_effects: ["status DRAFT -> PUBLISHED"]
  - method: GET
    path: "/tariffs"
    description: "List tariffs"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Tariff[]"
    side_effects: []
  - method: GET
    path: "/tariffs/{id}"
    description: "Get one tariff"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: Tariff
    side_effects: []

  # --- MoveOrder ---
  - method: POST
    path: "/orders"
    description: "Register a move order; auto-creates the CONFIRMED BOOKING assignment for the registering agent"
    roles: [BookingAgent]
    code: 201
    input: [customer_id, tariff_id, pricing_mode, origin_city, origin_state, destination_city, destination_state, mileage, pickup_date]
    output: MoveOrder
    side_effects:
      - "status = REGISTERED, billing_status = UNBILLED"
      - "OrderAgentAssignment created for role BOOKING with agent_id = X-User-ID, status CONFIRMED, split_pct snapshot computed"
  - method: GET
    path: "/orders"
    description: "List orders"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "tariff_id?", "authoritative_weight_ticket_id?", "status?"]
    output: "MoveOrder[]"
    side_effects: []
  - method: GET
    path: "/orders/{id}"
    description: "Get one order"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: MoveOrder
    side_effects: []
  - method: POST
    path: "/orders/{id}/book"
    description: "Book the order after estimate acceptance, valuation election, and full role staffing"
    roles: [BookingAgent]
    code: 200
    input: []
    output: MoveOrder
    side_effects: ["status REGISTERED -> BOOKED", "delivery_spread_window computed", "increments MoveOrder.version by 1"]
  - method: POST
    path: "/orders/{id}/dispatch"
    description: "Dispatch the shipment (requires original weighment and completed origin services)"
    roles: [HaulingAgent]
    code: 200
    input: []
    output: MoveOrder
    side_effects: ["status BOOKED -> IN_TRANSIT", "ELECTED valuation -> LOCKED", "billing_status -> PROVISIONALLY_BILLED with provisional delivery_amount_due_cents", "increments MoveOrder.version by 1"]
  - method: POST
    path: "/orders/{id}/deliver"
    description: "Complete delivery; collects exactly the capped delivery amount; fires statement/split cascades"
    roles: [DestinationAgent]
    code: 200
    input: [collected_at_delivery_cents]
    output: MoveOrder
    side_effects: ["status -> DELIVERED", "final charges + 110% cap + deferred balance computed", "open reweigh requests -> EXPIRED", "RevenueStatement created PROVISIONAL with revenue_split_waterfall", "CONFIRMED assignments -> COMPLETED with split_amount_cents", "Agent.ytd_linehaul_share_cents credited per assignment", "increments MoveOrder.version by 1"]
  - method: POST
    path: "/orders/{id}/close"
    description: "Close a settled order with no open claims or disputes"
    roles: [VanLineAdmin]
    code: 200
    input: []
    output: MoveOrder
    side_effects: ["status SETTLED -> CLOSED", "increments MoveOrder.version by 1"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a REGISTERED or BOOKED order; releases assignments, voids estimates, cancels crews (compensation)"
    roles: [BookingAgent, VanLineAdmin]
    code: 200
    input: []
    output: MoveOrder
    side_effects: ["status -> CANCELLED", "estimates ISSUED/ACCEPTED -> VOIDED", "ELECTED coverage -> SUPERSEDED", "PROPOSED/CONFIRMED assignments -> RELEASED", "REQUESTED/CONFIRMED crews -> CANCELLED", "increments MoveOrder.version by 1"]
  - method: POST
    path: "/orders/{id}/payments"
    description: "Collect the deferred balance of a NON_BINDING order after delivery"
    roles: [Customer, VanLineAdmin]
    code: 200
    input: [amount_cents]
    output: MoveOrder
    side_effects: ["billing_status FINAL_BILLED -> PAID when amount_cents == deferred_balance_cents", "increments MoveOrder.version by 1"]

  # --- Estimate ---
  - method: POST
    path: "/orders/{id}/estimates"
    description: "Issue an estimate; supersedes any ISSUED or ACCEPTED estimate on the order (OCC on order version)"
    roles: [BookingAgent]
    code: 201
    input: [estimate_kind, estimated_weight_lbs, "packing_services_cents?", expected_order_version]
    output: Estimate
    side_effects: ["prior ISSUED/ACCEPTED estimate -> SUPERSEDED and estimated_weight_lbs unlatched", "estimate_total computed with pinned component rounding", "issued_at/expires_at set", "increments MoveOrder.version by 1"]
  - method: GET
    path: "/estimates"
    description: "List estimates"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "supersedes_estimate_id?", "status?"]
    output: "Estimate[]"
    side_effects: []
  - method: GET
    path: "/estimates/{id}"
    description: "Get one estimate"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: Estimate
    side_effects: []
  - method: POST
    path: "/estimates/{id}/accept"
    description: "Customer accepts an issued estimate; expiry re-evaluation flips stale estimates to EXPIRED"
    roles: [Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: ["status ISSUED -> ACCEPTED", "order.estimated_weight_lbs latched", "increments MoveOrder.version by 1"]
  - method: POST
    path: "/estimates/{id}/decline"
    description: "Customer declines an issued estimate"
    roles: [Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: ["status ISSUED -> DECLINED"]

  # --- OrderAgentAssignment ---
  - method: POST
    path: "/orders/{id}/agent-assignments"
    description: "Propose an ORIGIN/HAULING/DESTINATION agent assignment (BOOKING is automatic at registration)"
    roles: [BookingAgent, VanLineAdmin]
    code: 201
    input: [agent_id, role]
    output: OrderAgentAssignment
    side_effects: ["status = PROPOSED"]
  - method: POST
    path: "/order-agent-assignments/{id}/confirm"
    description: "Assigned agent confirms its own assignment"
    roles: [OriginAgent, HaulingAgent, DestinationAgent]
    code: 200
    input: []
    output: OrderAgentAssignment
    side_effects: ["status PROPOSED -> CONFIRMED", "split_pct snapshot computed"]
  - method: POST
    path: "/order-agent-assignments/{id}/release"
    description: "Release a PROPOSED non-BOOKING assignment while the order is REGISTERED"
    roles: [BookingAgent, VanLineAdmin]
    code: 200
    input: []
    output: OrderAgentAssignment
    side_effects: ["status PROPOSED -> RELEASED"]
  - method: GET
    path: "/order-agent-assignments"
    description: "List assignments"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "agent_id?", "role?", "status?"]
    output: "OrderAgentAssignment[]"
    side_effects: []
  - method: GET
    path: "/order-agent-assignments/{id}"
    description: "Get one assignment"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: OrderAgentAssignment
    side_effects: []

  # --- ValuationCoverage ---
  - method: POST
    path: "/orders/{id}/valuation-coverages"
    description: "Elect valuation coverage; supersedes any ELECTED coverage pre-dispatch (OCC on order version)"
    roles: [BookingAgent, Customer]
    code: 201
    input: [coverage_type, "declared_value_cents?", "deductible_cents?", expected_order_version]
    output: ValuationCoverage
    side_effects: ["prior ELECTED coverage -> SUPERSEDED", "valuation_premium computed", "increments MoveOrder.version by 1"]
  - method: GET
    path: "/valuation-coverages"
    description: "List valuation coverages"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "status?"]
    output: "ValuationCoverage[]"
    side_effects: []
  - method: GET
    path: "/valuation-coverages/{id}"
    description: "Get one valuation coverage"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: ValuationCoverage
    side_effects: []

  # --- WeightTicket ---
  - method: POST
    path: "/orders/{id}/weight-tickets"
    description: "Record the ORIGINAL certified weighment (one per order); requires BOOKED or IN_TRANSIT"
    roles: [HaulingAgent]
    code: 201
    input: [scale_location, weighed_at, tare_weight_lbs, gross_weight_lbs]
    output: WeightTicket
    side_effects: ["net_weight_lbs computed", "order.authoritative_weight_ticket_id set and actual_weight_lbs recomputed", "increments MoveOrder.version by 1"]
  - method: GET
    path: "/weight-tickets"
    description: "List weight tickets"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "reweigh_request_id?", "supersedes_ticket_id?", "ticket_kind?"]
    output: "WeightTicket[]"
    side_effects: []
  - method: GET
    path: "/weight-tickets/{id}"
    description: "Get one weight ticket"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: WeightTicket
    side_effects: []

  # --- ReweighRequest ---
  - method: POST
    path: "/orders/{id}/reweigh-requests"
    description: "Demand a re-weigh before delivery; at most one per order lifecycle"
    roles: [Customer, BookingAgent]
    code: 201
    input: [requested_by_role]
    output: ReweighRequest
    side_effects: ["status = REQUESTED"]
  - method: POST
    path: "/reweigh-requests/{id}/perform"
    description: "Hauling agent performs the re-weigh, producing a REWEIGH WeightTicket"
    roles: [HaulingAgent]
    code: 200
    input: [scale_location, weighed_at, tare_weight_lbs, gross_weight_lbs]
    output: ReweighRequest
    side_effects: ["status REQUESTED -> PERFORMED", "REWEIGH WeightTicket created with supersedes_ticket_id = current authoritative ticket", "resulting_ticket_id set"]
  - method: POST
    path: "/reweigh-requests/{id}/apply"
    description: "Apply the re-weigh: authoritative weight switches and the 110% cap recomputes"
    roles: [Customer, VanLineAdmin]
    code: 200
    input: []
    output: ReweighRequest
    side_effects: ["status PERFORMED -> APPLIED", "order authoritative ticket switched", "final_charges_and_delivery_cap recomputed", "increments MoveOrder.version by 1"]
  - method: POST
    path: "/reweigh-requests/{id}/decline"
    description: "Customer declines the performed re-weigh; original weight stands"
    roles: [Customer]
    code: 200
    input: []
    output: ReweighRequest
    side_effects: ["status PERFORMED -> DECLINED_BY_CUSTOMER"]
  - method: POST
    path: "/reweigh-requests/{id}/cancel"
    description: "Cancel a pending re-weigh request"
    roles: [Customer, BookingAgent]
    code: 200
    input: []
    output: ReweighRequest
    side_effects: ["status REQUESTED -> CANCELLED"]
  - method: GET
    path: "/reweigh-requests"
    description: "List re-weigh requests"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "resulting_ticket_id?", "status?"]
    output: "ReweighRequest[]"
    side_effects: []
  - method: GET
    path: "/reweigh-requests/{id}"
    description: "Get one re-weigh request"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: ReweighRequest
    side_effects: []

  # --- Warehouse / SITLot ---
  - method: POST
    path: "/warehouses"
    description: "Register a SIT warehouse"
    roles: [VanLineAdmin]
    code: 201
    input: [name, market, capacity_cwt]
    output: Warehouse
    side_effects: ["status = ACTIVE", "occupied_cwt = 0"]
  - method: POST
    path: "/warehouses/{id}/deactivate"
    description: "Deactivate a warehouse (blocks new check-ins)"
    roles: [VanLineAdmin]
    code: 200
    input: []
    output: Warehouse
    side_effects: ["status ACTIVE -> INACTIVE"]
  - method: GET
    path: "/warehouses"
    description: "List warehouses"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Warehouse[]"
    side_effects: []
  - method: GET
    path: "/warehouses/{id}"
    description: "Get one warehouse"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: Warehouse
    side_effects: []
  - method: POST
    path: "/orders/{id}/sit-lots"
    description: "Check the shipment into storage-in-transit; aggregate capacity check on the warehouse"
    roles: [HaulingAgent, DestinationAgent]
    code: 201
    input: [warehouse_id]
    output: SITLot
    side_effects: ["lot IN_STORAGE with stored_weight_cwt", "Warehouse.occupied_cwt incremented (ledger sync)", "order IN_TRANSIT -> IN_SIT", "increments MoveOrder.version by 1"]
  - method: POST
    path: "/sit-lots/{id}/release"
    description: "Release the lot for delivery; day-limit re-evaluation may auto-convert the lot first"
    roles: [DestinationAgent]
    code: 200
    input: []
    output: SITLot
    side_effects: ["lot IN_STORAGE -> RELEASED with frozen accrual", "Warehouse.occupied_cwt decremented (compensating ledger sync)", "order IN_SIT -> OUT_FOR_DELIVERY", "increments MoveOrder.version by 1"]
  - method: GET
    path: "/sit-lots"
    description: "List SIT lots"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "warehouse_id?", "status?"]
    output: "SITLot[]"
    side_effects: []
  - method: GET
    path: "/sit-lots/{id}"
    description: "Get one SIT lot (day-limit re-evaluation applied on read)"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: SITLot
    side_effects: []

  # --- CrewAssignment ---
  - method: POST
    path: "/orders/{id}/crew-assignments"
    description: "Source crew labor at origin or destination; invoice computed at creation"
    roles: [OriginAgent, DestinationAgent]
    code: 201
    input: [service_end, service_date, start_hour, end_hour, crew_size]
    output: CrewAssignment
    side_effects: ["status = REQUESTED", "agent_id = X-User-ID", "labor_hours and invoice_amount_cents computed per crew_labor_invoice"]
  - method: POST
    path: "/crew-assignments/{id}/confirm"
    description: "Confirm a crew booking; half-open overlap check against the agent's CONFIRMED crews that date"
    roles: [OriginAgent, DestinationAgent]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status REQUESTED -> CONFIRMED"]
  - method: POST
    path: "/crew-assignments/{id}/complete"
    description: "Mark the crew service performed"
    roles: [OriginAgent, DestinationAgent]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status CONFIRMED -> COMPLETED"]
  - method: POST
    path: "/crew-assignments/{id}/cancel"
    description: "Cancel a REQUESTED or CONFIRMED crew; confirmed hours return to the agent-date pool"
    roles: [OriginAgent, DestinationAgent, BookingAgent]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status -> CANCELLED (compensating action)"]
  - method: GET
    path: "/crew-assignments"
    description: "List crew assignments"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "agent_id?", "service_end?", "status?"]
    output: "CrewAssignment[]"
    side_effects: []
  - method: GET
    path: "/crew-assignments/{id}"
    description: "Get one crew assignment"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []

  # --- RevenueStatement ---
  - method: GET
    path: "/revenue-statements"
    description: "List revenue statements"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "status?"]
    output: "RevenueStatement[]"
    side_effects: []
  - method: GET
    path: "/revenue-statements/{id}"
    description: "Get one revenue statement"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: RevenueStatement
    side_effects: []
  - method: POST
    path: "/revenue-statements/{id}/finalize"
    description: "Finalize the statement; cascades order SETTLED and crew INVOICED"
    roles: [VanLineAdmin]
    code: 200
    input: []
    output: RevenueStatement
    side_effects: ["status PROVISIONAL -> FINAL", "order DELIVERED -> SETTLED", "COMPLETED crews -> INVOICED", "increments RevenueStatement.version by 1"]
  - method: POST
    path: "/revenue-statements/{id}/chargebacks"
    description: "Post a manual chargeback against the HAULING agent on a FINAL statement"
    roles: [VanLineAdmin]
    code: 200
    input: [amount_cents, reason]
    output: RevenueStatement
    side_effects: ["chargeback_total_cents += amount_cents", "HAULING agent quality_score recomputed = max(0, 100 - floor(chargeback_total_cents / 10000))", "increments RevenueStatement.version by 1"]
  - method: POST
    path: "/revenue-statements/{id}/reconcile"
    description: "Reconcile a FINAL statement with no open disputes"
    roles: [VanLineAdmin]
    code: 200
    input: []
    output: RevenueStatement
    side_effects: ["status FINAL -> RECONCILED"]

  # --- Claim ---
  - method: POST
    path: "/orders/{id}/claims"
    description: "File a loss/damage claim after delivery; captures the LOCKED valuation coverage"
    roles: [Customer]
    code: 201
    input: [description, claimed_amount_cents, claimed_item_weight_lbs]
    output: Claim
    side_effects: ["status = FILED", "valuation_coverage_id captured from the order's LOCKED coverage", "filed_at = logical clock"]
  - method: GET
    path: "/claims"
    description: "List claims"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "valuation_coverage_id?", "status?"]
    output: "Claim[]"
    side_effects: []
  - method: GET
    path: "/claims/{id}"
    description: "Get one claim"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: POST
    path: "/claims/{id}/offer"
    description: "Adjuster makes a settlement offer; capped by claim_settlement_cap"
    roles: [ClaimsAdjuster]
    code: 200
    input: [offer_amount_cents]
    output: Claim
    side_effects: ["status FILED|DISPUTED -> OFFER_MADE", "offer_amount_cents and offered_by_user_id recorded"]
  - method: POST
    path: "/claims/{id}/accept"
    description: "Customer accepts the current offer; chargeback cascade fires"
    roles: [Customer]
    code: 200
    input: []
    output: Claim
    side_effects: ["status OFFER_MADE -> ACCEPTED", "settled_amount_cents := offer_amount_cents", "statement chargeback_total_cents += settled", "HAULING agent quality_score recomputed"]
  - method: POST
    path: "/claims/{id}/reject-offer"
    description: "Customer rejects the offer; negotiation round increments, hard cap 3 rounds"
    roles: [Customer]
    code: 200
    input: []
    output: Claim
    side_effects: ["status OFFER_MADE -> DISPUTED", "round_count += 1"]
  - method: POST
    path: "/claims/{id}/pay"
    description: "Van line pays the accepted claim; payer must differ from the offering adjuster (segregation)"
    roles: [VanLineAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["status ACCEPTED -> PAID", "open disputes on this claim -> CLOSED"]
  - method: POST
    path: "/claims/{id}/withdraw"
    description: "Customer withdraws an open claim"
    roles: [Customer]
    code: 200
    input: []
    output: Claim
    side_effects: ["status FILED|OFFER_MADE|DISPUTED -> WITHDRAWN"]

  # --- Dispute ---
  - method: POST
    path: "/disputes"
    description: "Open a dispute on a claim (post-rejection) or on a FINAL revenue statement (agent-side)"
    roles: [Customer, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent]
    code: 201
    input: ["claim_id?", "revenue_statement_id?", subject_amount_cents]
    output: Dispute
    side_effects: ["status = OPENED", "opened_by_role and filer_user_id recorded"]
  - method: GET
    path: "/disputes"
    description: "List disputes"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: ["limit?", "offset?", "claim_id?", "revenue_statement_id?", "status?"]
    output: "Dispute[]"
    side_effects: []
  - method: GET
    path: "/disputes/{id}"
    description: "Get one dispute"
    roles: [VanLineAdmin, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent, Customer, ClaimsAdjuster, Arbitrator]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/disputes/{id}/respond"
    description: "Van line files its response; starts the 14-day mediation cooling-off"
    roles: [VanLineAdmin]
    code: 200
    input: ["response_note?"]
    output: Dispute
    side_effects: ["status OPENED -> RESPONSE_FILED", "responded_at and responded_by_user_id recorded"]
  - method: POST
    path: "/disputes/{id}/escalate-to-arbitration"
    description: "Filer escalates after the cooling-off period; filing fee attaches"
    roles: [Customer, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status RESPONSE_FILED -> ARBITRATION_DOCKETED", "filing_fee_cents = 25000", "escalated_at set"]
  - method: POST
    path: "/disputes/{id}/decide"
    description: "Arbitrator renders the decision; fee allocation computed; claim disputes cascade the claim to ACCEPTED"
    roles: [Arbitrator]
    code: 200
    input: [decision_amount_cents]
    output: Dispute
    side_effects: ["status ARBITRATION_DOCKETED -> DECIDED", "fee_allocated_to computed per arbitration_fee_allocation", "claim dispute: Claim -> ACCEPTED with settled = decision (chargeback + quality cascades)", "revenue dispute: statement.chargeback_total_cents += decision"]
  - method: POST
    path: "/disputes/{id}/close"
    description: "Close a decided dispute after compliance (claim disputes require the claim PAID)"
    roles: [VanLineAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status DECIDED -> CLOSED"]
  - method: POST
    path: "/disputes/{id}/withdraw"
    description: "Filer withdraws an open or responded dispute"
    roles: [Customer, BookingAgent, OriginAgent, HaulingAgent, DestinationAgent]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status OPENED|RESPONSE_FILED -> WITHDRAWN"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing/invalid; role not among the eight declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's roles list, or entity-backed caller fails the ownership check (agent not the assigned agent for that role on the order; customer not the order's customer)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path or body-referenced resource id does not exist (validated left to right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, type mismatch, unknown field, enum out of range, gross < tare, end_hour <= start_hour, deductible outside {0,25000,50000}, FVP coverage with declared_value_cents <= 0" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version does not match the order's current version on estimate create or valuation elect (OCC)" }
  - { id: ERR_ORDER_NOT_REGISTERED, http: 409, condition: "Registration-phase write (estimate create, valuation elect, assignment create/confirm/release, estimate accept) while order is not REGISTERED" }
  - { id: ERR_NO_ACCEPTED_ESTIMATE, http: 409, condition: "Book attempted without an ACCEPTED estimate whose estimate_kind matches order.pricing_mode" }
  - { id: ERR_NO_VALUATION_COVERAGE, http: 409, condition: "Book attempted without an ELECTED valuation coverage" }
  - { id: ERR_AGENT_ROLES_INCOMPLETE, http: 409, condition: "Book attempted before ORIGIN, HAULING, and DESTINATION assignments are all CONFIRMED" }
  - { id: ERR_TRANSITION_NOT_ALLOWED, http: 409, condition: "Generic from-state violation on any action endpoint (e.g. dispatch from REGISTERED, accept of a DECLINED estimate, pay of a FILED claim, finalize of a non-PROVISIONAL statement)" }
  - { id: ERR_WEIGHT_TICKET_REQUIRED, http: 409, condition: "Dispatch attempted before any ORIGINAL WeightTicket exists on the order" }
  - { id: ERR_ORIGIN_SERVICES_INCOMPLETE, http: 409, condition: "Dispatch attempted while a CONFIRMED origin CrewAssignment is not yet COMPLETED" }
  - { id: ERR_ORDER_NOT_IN_TRANSIT, http: 409, condition: "Re-weigh request/perform/apply or SIT check-in while the order is not IN_TRANSIT (perform/apply also accept IN_SIT)" }
  - { id: ERR_SHIPMENT_IN_STORAGE, http: 409, condition: "Deliver attempted while a SITLot on the order is still IN_STORAGE" }
  - { id: ERR_REWEIGH_PENDING, http: 409, condition: "Deliver attempted while a ReweighRequest is still REQUESTED (never performed); the customer must cancel it first. A PERFORMED-but-unapplied re-weigh does not block delivery — it auto-expires" }
  - { id: ERR_REWEIGH_REQUEST_NOT_PERFORMED, http: 409, condition: "Re-weigh apply/decline attempted before perform" }
  - { id: ERR_STATEMENT_NOT_FINAL, http: 409, condition: "Chargeback posting or revenue-dispute filing on a statement that is not FINAL" }
  - { id: ERR_CLAIM_NOT_PAID, http: 409, condition: "Closing a claim dispute before the referenced claim is PAID" }
  - { id: ERR_LOT_NOT_IN_STORAGE, http: 409, condition: "Release of a SITLot already RELEASED or auto-converted to CONVERTED_PERMANENT by the 180-day rule" }
  - { id: ERR_ORDER_NOT_DELIVERED, http: 409, condition: "Claim filed before the order reached DELIVERED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Claim payer equals the offering adjuster, or arbitration decider equals the dispute responder (same X-User-ID)" }
  - { id: ERR_PICKUP_DATE_NOT_REACHED, http: 422, condition: "Dispatch before the order's pickup_date under the logical clock" }
  - { id: ERR_ESTIMATE_EXPIRED, http: 422, condition: "Accept attempted after expires_at; the estimate flips to EXPIRED in the same rejection" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "Claim filed more than 270 days after delivered_at" }
  - { id: ERR_MEDIATION_PERIOD_NOT_ELAPSED, http: 422, condition: "Arbitration escalation before responded_at + 14 days" }
  - { id: ERR_SERVICE_DATE_OUT_OF_WINDOW, http: 422, condition: "Crew service_date outside [pickup_date, latest_delivery_date + 30 days] on a BOOKED-or-later order" }
  - { id: ERR_DUPLICATE_AGENT_CODE, http: 409, condition: "agent_code already registered" }
  - { id: ERR_DUPLICATE_CUSTOMER_EMAIL, http: 409, condition: "customer email already registered" }
  - { id: ERR_DUPLICATE_TARIFF_CODE, http: 409, condition: "tariff_code already registered" }
  - { id: ERR_ORIGINAL_WEIGHT_EXISTS, http: 409, condition: "Second ORIGINAL weighment on the same order (further weighments require the re-weigh program)" }
  - { id: ERR_REWEIGH_ALREADY_USED, http: 409, condition: "A ReweighRequest already exists on this order in any non-terminal state, or one has already been APPLIED" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "A dispute on the same claim or statement is already OPENED/RESPONSE_FILED/ARBITRATION_DOCKETED/DECIDED" }
  - { id: ERR_CLAIM_ROUNDS_EXHAUSTED, http: 409, condition: "reject-offer when round_count == 3; the customer must use the arbitration program" }
  - { id: ERR_ESTIMATE_KIND_MISMATCH, http: 422, condition: "estimate_kind differs from order.pricing_mode" }
  - { id: ERR_AGENT_SUSPENDED, http: 409, condition: "Assignment to, or confirmation by, an agent whose status is SUSPENDED or TERMINATED" }
  - { id: ERR_AGENT_CAPABILITY_MISSING, http: 422, condition: "Assigned agent's capabilities do not include the assigned role" }
  - { id: ERR_AGENT_HAS_OPEN_WORK, http: 409, condition: "Agent termination while PROPOSED/CONFIRMED assignments exist on non-terminal orders" }
  - { id: ERR_WAREHOUSE_INACTIVE, http: 409, condition: "SIT check-in to an INACTIVE warehouse" }
  - { id: ERR_WAREHOUSE_CAPACITY_EXCEEDED, http: 409, condition: "SIT check-in would push occupied_cwt + ceil(actual_weight_lbs/100) above capacity_cwt (aggregate capacity semantics)" }
  - { id: ERR_TARIFF_WINDOW_OVERLAP, http: 409, condition: "Publishing a tariff whose [effective_start, effective_end) intersects another PUBLISHED tariff's window; adjacency allowed" }
  - { id: ERR_CREW_SCHEDULE_CONFLICT, http: 409, condition: "Crew confirm overlaps another CONFIRMED crew of the same agent on the same service_date (half-open intervals; adjacency allowed)" }
  - { id: ERR_TARIFF_NOT_PUBLISHED, http: 409, condition: "Order registration against a DRAFT tariff or a window not covering pickup_date" }
  - { id: ERR_DISPUTE_SUBJECT_INVALID, http: 422, condition: "Dispute with both/neither of claim_id and revenue_statement_id, or subject not in a disputable state (claim must be DISPUTED with round_count >= 1; statement must be FINAL)" }
  - { id: ERR_DELIVERY_PAYMENT_MISMATCH, http: 422, condition: "collected_at_delivery_cents differs from the recomputed delivery_amount_due_cents (110% cap)" }
  - { id: ERR_NO_BALANCE_DUE, http: 422, condition: "Payment posted when billing_status is not FINAL_BILLED or deferred_balance_cents == 0" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount_cents differs from deferred_balance_cents" }
  - { id: ERR_OFFER_EXCEEDS_VALUATION_CAP, http: 422, condition: "Offer exceeds claim_settlement_cap for the captured coverage (inclusive cap: offer == cap is allowed)" }
  - { id: ERR_DECISION_OUT_OF_RANGE, http: 422, condition: "Arbitration decision outside [0, subject_amount_cents]" }
  - { id: ERR_OPEN_CLAIMS_EXIST, http: 409, condition: "Order close while a claim is FILED, OFFER_MADE, DISPUTED, or ACCEPTED" }
  - { id: ERR_OPEN_DISPUTES_EXIST, http: 409, condition: "Order close or statement reconcile while a related dispute is OPENED, RESPONSE_FILED, ARBITRATION_DOCKETED, or DECIDED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VanLineAdmin
    description: "Van line headquarters operations staff; manages agents, tariffs, warehouses; finalizes statements; pays claims; responds to disputes"
    identity: opaque
    exclusive_operations: ["/agents write ops", "/tariffs write ops", "/warehouses write ops", "POST /revenue-statements/{id}/finalize", "POST /revenue-statements/{id}/chargebacks", "POST /revenue-statements/{id}/reconcile", "POST /claims/{id}/pay", "POST /disputes/{id}/respond", "POST /disputes/{id}/close", "POST /orders/{id}/close", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints", "POST /customers", "POST /orders/{id}/cancel", "POST /orders/{id}/payments", "POST /orders/{id}/agent-assignments", "POST /reweigh-requests/{id}/apply"]
  - name: BookingAgent
    description: "The agent that books the order; registers orders, issues estimates, assigns the other agents"
    identity: "entity_backed:Agent"
    exclusive_operations: ["POST /orders", "POST /orders/{id}/book", "POST /orders/{id}/estimates", "POST /order-agent-assignments/{id}/release"]
    shared_operations: ["all GET endpoints", "POST /customers", "POST /orders/{id}/cancel", "POST /orders/{id}/agent-assignments", "POST /orders/{id}/valuation-coverages", "POST /orders/{id}/reweigh-requests", "POST /reweigh-requests/{id}/cancel", "POST /crew-assignments/{id}/cancel", "POST /disputes", "POST /disputes/{id}/escalate-to-arbitration", "POST /disputes/{id}/withdraw"]
  - name: OriginAgent
    description: "Agent performing origin services (packing, loading); sources origin crews"
    identity: "entity_backed:Agent"
    exclusive_operations: ["origin-service crew creation and lifecycle (service_end = ORIGIN)"]
    shared_operations: ["all GET endpoints", "POST /order-agent-assignments/{id}/confirm", "POST /orders/{id}/crew-assignments", "POST /crew-assignments/{id}/confirm", "POST /crew-assignments/{id}/complete", "POST /crew-assignments/{id}/cancel", "POST /disputes", "POST /disputes/{id}/escalate-to-arbitration", "POST /disputes/{id}/withdraw"]
  - name: HaulingAgent
    description: "Agent hauling the shipment; records weighments, performs re-weighs, dispatches, may check into SIT"
    identity: "entity_backed:Agent"
    exclusive_operations: ["POST /orders/{id}/dispatch", "POST /orders/{id}/weight-tickets", "POST /reweigh-requests/{id}/perform"]
    shared_operations: ["all GET endpoints", "POST /order-agent-assignments/{id}/confirm", "POST /orders/{id}/sit-lots", "POST /disputes", "POST /disputes/{id}/escalate-to-arbitration", "POST /disputes/{id}/withdraw"]
  - name: DestinationAgent
    description: "Agent performing destination services; releases SIT lots, delivers, sources destination crews"
    identity: "entity_backed:Agent"
    exclusive_operations: ["POST /sit-lots/{id}/release", "POST /orders/{id}/deliver"]
    shared_operations: ["all GET endpoints", "POST /order-agent-assignments/{id}/confirm", "POST /orders/{id}/sit-lots", "POST /orders/{id}/crew-assignments", "POST /crew-assignments/{id}/confirm", "POST /crew-assignments/{id}/complete", "POST /crew-assignments/{id}/cancel", "POST /disputes", "POST /disputes/{id}/escalate-to-arbitration", "POST /disputes/{id}/withdraw"]
  - name: Customer
    description: "The shipper; accepts/declines estimates, elects valuation, requests re-weighs, files claims, negotiates and disputes"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /estimates/{id}/accept", "POST /estimates/{id}/decline", "POST /reweigh-requests/{id}/decline", "POST /orders/{id}/claims", "POST /claims/{id}/accept", "POST /claims/{id}/reject-offer", "POST /claims/{id}/withdraw"]
    shared_operations: ["all GET endpoints", "POST /orders/{id}/valuation-coverages", "POST /orders/{id}/reweigh-requests", "POST /reweigh-requests/{id}/cancel", "POST /reweigh-requests/{id}/apply", "POST /orders/{id}/payments", "POST /disputes", "POST /disputes/{id}/escalate-to-arbitration", "POST /disputes/{id}/withdraw"]
  - name: ClaimsAdjuster
    description: "Van line claims adjuster; issues settlement offers; may never pay a claim they offered on (segregation of duties)"
    identity: opaque
    exclusive_operations: ["POST /claims/{id}/offer"]
    shared_operations: ["all GET endpoints"]
  - name: Arbitrator
    description: "Neutral arbitration-program arbitrator; decides docketed disputes; may never decide a dispute the same operator responded to"
    identity: opaque
    exclusive_operations: ["POST /disputes/{id}/decide"]
    shared_operations: ["all GET endpoints"]
