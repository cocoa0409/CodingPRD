        as_user_id: ${analyst_tx}
      - call: POST /data-research/properties/${prop_ross}/lease-comparables
        payload:
          tenant_name: Harborline Logistics Inc
          lease_start: '2026-06-01T00:00:00Z'
          lease_end: '2027-06-01T00:00:00Z'
