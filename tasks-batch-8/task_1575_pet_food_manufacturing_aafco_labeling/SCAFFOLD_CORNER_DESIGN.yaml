              payload: { formula_code: "DF-001", product_name: "Deficient Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
