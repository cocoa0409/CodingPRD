        grounds:
          - validations.priority_83_ERR_NO_COUNT_LINES
          - validations.priority_84_ERR_COUNT_COVERAGE_BELOW_MIN
        distinguishing_aspect: "With zero lines both checks are violated — coverage is 0.00, far below 90.00 — but the emptiness check at priority 83 must run first, so the caller sees ERR_NO_COUNT_LINES rather than ERR_COUNT_COVERAGE_BELOW_MIN."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1, Item TEE-001 with a stock position at S100 so in_scope_position_count is 1."
            - "An OPEN ShrinkPeriod covering the window, so the lower-priority covering-period check at priority 64 is satisfied and cannot mask the ordering under test."
