      - name: a_company_delisted_after_registration_cannot_be_added_as_a_peer
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_23_ERR_PEER_COMPANY_DELISTED
          - errors[ERR_PEER_COMPANY_DELISTED]
          - endpoints[POST /exec-comp/companies/{id}/market-data]
          - entities.Company.fields.listing_status
        distinguishing_aspect: |
          Membership validity depends on the state of a different entity read at add time, not at registration:
          BRVO was ACTIVE when it was created, but once a market-data refresh flips listing_status to DELISTED the
          add is rejected with ERR_PEER_COMPANY_DELISTED (422), while CHRL — still ACTIVE — is accepted by the very
          next call against the same group.
        test_recipe:
          setup:
            - "ACME issuer plus BRVO and CHRL peers, all created with the default listing_status ACTIVE."
            - "A DRAFT RAW_MEDIAN peer group with no members."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Charlie Holdings", ticker: "CHRL", is_issuer: false, gics_sector: "TECH", revenue_usd: 12000000000, market_cap_usd: 30000000000, share_price_usd: 60.00, ceo_tdc_usd: 18000000 }
              as: CompConsultant
              captures: { charl_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
          trigger:
            - call: "POST /exec-comp/companies/${bravo_id}/market-data"
              payload: { listing_status: "DELISTED" }
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
              captures: { err_delisted: $.data.error_id }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${charl_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
              captures: { mem_c: $.data.id }
          assert:
            - "Company.${bravo_id}.listing_status == DELISTED"
            - "${err_delisted} == 'ERR_PEER_COMPANY_DELISTED' with HTTP status 422"
            - "the rejected add left PeerGroup.${pg_id}.version == 1 — no OCC bump on a failed write"
            - "the CHRL add returns 201 with PeerGroupMember.${mem_c}.status == ACCEPTED"
            - "PeerGroup.${pg_id}.accepted_member_count == 1"

      - name: an_engagement_window_starting_before_now_is_rejected_but_starting_exactly_now_is_not
