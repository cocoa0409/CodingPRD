      - name: fitness_determination_records_the_determining_auditor
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /carriers/{id}/fitness-determination]
          - entities.Carrier.fields.safety_fitness_status
          - entities.Carrier.fields.fitness_determined_by_user_id
        distinguishing_aspect: |
          Each determination overwrites status, timestamp AND the determining user id and bumps
          Carrier.version, which is what later makes the CAP decision by that same user a segregation
          violation; the second determination replaces auditor_bob with auditor_carl rather than
          keeping the first determiner.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (MEDIUM) at safety_fitness_status UNRATED with fitness_determined_by_user_id null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id, c1_version: $.data.version, initial_status: $.data.safety_fitness_status }
          trigger:
            - call: "POST /carriers/${c1_id}/fitness-determination"
              payload: { determination: "CONDITIONAL", basis_note: "Compliance review found HOS recordkeeping deficiencies." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_bob"
              captures: { st1: $.data.safety_fitness_status, by1: $.data.fitness_determined_by_user_id, at1: $.data.fitness_determined_at, v1: $.data.version }
            - call: "POST /carriers/${c1_id}/fitness-determination"
              payload: { determination: "UNSATISFACTORY", basis_note: "Follow-up review found unresolved brake defects." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_carl"
              captures: { st2: $.data.safety_fitness_status, by2: $.data.fitness_determined_by_user_id, v2: $.data.version }
          assert:
