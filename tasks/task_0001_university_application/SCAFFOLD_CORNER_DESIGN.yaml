# ============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# ----------------------------------------------------------------------------
# Companion file to SCAFFOLD.yaml. Enumerates testable claims surfaced by
# §1.1–§1.7 that §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) does not already
# cover. Taxonomy follows references/claim-extraction-guide.md. Names are
# unique across the union of difficulty + corner design files.
# ============================================================================
scaffold_corner_design:

  # ==========================================================================
  # Section 1 — Entities (Table 1)
  # ==========================================================================
  - section: entities
    instances:

      - name: entity_applicant_register_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - entities.Applicant
          - endpoints[POST /applicants/register]
        distinguishing_aspect: "POST /applicants/register with all required fields returns 201; response.data contains id, email, full_name, gpa, sat_total, profile_status (=DRAFT), created_at, updated_at, version=1."
        test_recipe:
          setup:
            - "Empty DB; server clock anywhere"
          setup_api_calls: []
          trigger:
            - call: "POST /applicants/register"
              payload: { email: "creation@x.com", full_name: "Creation Test", gpa: 3.5, sat_total: 1300 }
              as: Anonymous
              captures: { app_id: $.data.id, ps: $.data.profile_status, v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Applicant.${app_id}.profile_status == 'DRAFT'"
            - "Applicant.${app_id}.version == 1"
            - "response.data.id is a UUID with no type prefix"
            - "response.meta.api_request_id and response.meta.api_request_timestamp are present (envelope §1.0)"

      - name: entity_applicant_get_by_id_returns_stored_record
        claim_type: Retrieval
        grounds:
          - entities.Applicant
          - endpoints[GET /applicants/{id}]
        distinguishing_aspect: "GET /applicants/{id} as the owning Applicant returns the same fields persisted by POST /applicants/register."
        test_recipe:
          setup:
            - "One Applicant registered via POST /applicants/register"
          setup_api_calls:
            - call: "POST /applicants/register"
              payload: { email: "ret@x.com", full_name: "Ret Test", gpa: 3.3, sat_total: 1200 }
              as: Anonymous
              captures: { app_id: $.data.id }
          trigger:
            - call: "GET /applicants/${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { got_email: $.data.email, got_full_name: $.data.full_name }
          assert:
            - "HTTP status == 200"
            - "got_email == 'ret@x.com'"
            - "got_full_name == 'Ret Test'"

      - name: entity_application_list_paginated_with_total_and_has_more
        claim_type: Listing
        grounds:
          - entities.Application
          - endpoints[GET /applications]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /applications returns response_type=array with pagination fields limit, offset, total_count, has_more present, default limit=10."
        test_recipe:
          setup:
            - "One Applicant with three Applications across three schools"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "LIST-1", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /schools"
              payload: { name: "LIST-2", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /schools"
              payload: { name: "LIST-3", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { s3: $.data.id }
            - call: "POST /applicants/register"
              payload: { email: "lst@x.com", full_name: "List User", gpa: 3.4, sat_total: 1200 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${s1}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${s2}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${s3}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "GET /applications?limit=2&offset=0"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { items_len: $.data.items, has_more: $.data.has_more, total: $.data.total_count }
          assert:
            - "HTTP status == 200"
            - "response.data.total_count == 3"
            - "response.data.has_more == true (3 > 0+2)"
            - "len(response.data.items) == 2"

      - name: entity_applicant_not_found_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - endpoints[GET /applicants/{id}]
        distinguishing_aspect: "GET /applicants/{id} with a syntactically-valid UUID that resolves to no record returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup:
            - "One Applicant registered as the acting user (so auth passes)"
          setup_api_calls:
            - call: "POST /applicants/register"
              payload: { email: "nf@x.com", full_name: "NF", gpa: 3.0 }
              as: Anonymous
              captures: { acting_id: $.data.id }
          trigger:
            - call: "GET /applicants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Applicant
              as_user_id: "${acting_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == 'ERR_RESOURCE_NOT_FOUND'"

      - name: entity_applicant_register_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.Applicant.fields.gpa
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /applicants/register without gpa (a required input field) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /applicants/register"
              payload: { email: "miss@x.com", full_name: "Missing GPA" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == 'ERR_INVALID_REQUEST'"

      - name: entity_applicant_register_default_sat_total_null
        claim_type: Defaults
        grounds:
          - entities.Applicant.fields.sat_total
        distinguishing_aspect: "Omitting sat_total at registration applies default null; the applicant remains DRAFT until other fields satisfy READY conditions."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /applicants/register"
              payload: { email: "def@x.com", full_name: "Default Test", gpa: 3.0 }
              as: Anonymous
              captures: { app_id: $.data.id, sat: $.data.sat_total }
          assert:
            - "HTTP status == 201"
            - "Applicant.${app_id}.sat_total == null"

      - name: entity_applicant_profile_status_computed_starts_draft
        claim_type: Computed Fields
        grounds:
          - entities.Applicant.fields.profile_status
        distinguishing_aspect: "profile_status is server-computed; newly-registered Applicant has profile_status=DRAFT; setting it via input is ignored."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /applicants/register"
              payload: { email: "ps@x.com", full_name: "PS Test", gpa: 3.2, sat_total: 1200, profile_status: "READY" }
              as: Anonymous
              captures: { app_id: $.data.id, ps: $.data.profile_status }
          assert:
            - "HTTP status == 201"
            - "Applicant.${app_id}.profile_status == 'DRAFT' (input value ignored — computed field)"

      - name: entity_application_system_field_id_and_timestamps_minted
        claim_type: System Fields
        grounds:
          - entities.Application
        distinguishing_aspect: "Application.id, created_at, updated_at are server-minted; supplying them on input is ignored; id is a bare UUID with no type prefix."
        test_recipe:
          setup:
            - "Applicant + School exist"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "SYS-1", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /applicants/register"
              payload: { email: "sys@x.com", full_name: "Sys Test", gpa: 3.3 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR", id: "deadbeef-dead-4dea-8dea-deaddeaddead" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, created: $.data.created_at }
          assert:
            - "HTTP status == 201"
            - "app_id != 'deadbeef-dead-4dea-8dea-deaddeaddead' (system minted, not echoed)"
            - "app_id matches UUID format with no type prefix"
            - "created_at is an ISO 8601 UTC timestamp string"

      - name: entity_application_invalid_plan_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Application.fields.plan
          - validations[priority=7]
        distinguishing_aspect: "POST /applications with plan not in {EARLY_DECISION, EARLY_ACTION, REGULAR, ROLLING} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Applicant + School exist"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "TY-1", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /applicants/register"
              payload: { email: "ty@x.com", full_name: "Type Test", gpa: 3.3 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "EARLY_BIRD" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == 'ERR_INVALID_REQUEST'"

      - name: entity_application_gpa_out_of_range_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Applicant.fields.gpa
          - validations[priority=7]
        distinguishing_aspect: "POST /applicants/register with gpa > 4.0 is rejected with ERR_INVALID_REQUEST (constraint range)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants/register"
              payload: { email: "gpa@x.com", full_name: "GPA OOR", gpa: 4.5 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == 'ERR_INVALID_REQUEST'"

      - name: entity_application_rolling_plan_requires_school_rolling_open
        claim_type: Parent Relationships
        grounds:
          - entities.Application.fields.plan
          - entities.School.fields.rolling_open
          - validations[priority=7]
        distinguishing_aspect: "POST /applications with plan=ROLLING against a school whose rolling_open=false is rejected (constraint: ROLLING permitted only when target school's rolling_open=true)."
        test_recipe:
          setup:
            - "School with rolling_open=false (default)"
            - "Applicant exists"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "RO-NO", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /applicants/register"
              payload: { email: "ro@x.com", full_name: "Ro Test", gpa: 3.3 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "ROLLING" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == 'ERR_INVALID_REQUEST'"

      - name: entity_applicant_email_unique_lowercase_normalized
        claim_type: Type Constraints
        grounds:
          - entities.Applicant.fields.email
          - validations[priority=8]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: "Applicant.email is globally unique with case-insensitive normalization; registering the same email with different casing returns ERR_DUPLICATE_RESOURCE."
        test_recipe:
          setup:
            - "One Applicant already registered with email=dup@x.com"
          setup_api_calls:
            - call: "POST /applicants/register"
              payload: { email: "dup@x.com", full_name: "First", gpa: 3.0 }
              as: Anonymous
          trigger:
            - call: "POST /applicants/register"
              payload: { email: "DUP@X.com", full_name: "Second", gpa: 3.1 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_DUPLICATE_RESOURCE'"

      - name: entity_topology_flat_fk_validation_application_school_id
        claim_type: Parent Relationships
        grounds:
          - entities.Application.fields.school_id
          - validations[priority=5]
          - errors[ERR_FK_NOT_FOUND]
        distinguishing_aspect: "Flat topology FK integrity: POST /applications with school_id pointing to nonexistent school is rejected with ERR_FK_NOT_FOUND."
        test_recipe:
          setup:
            - "One Applicant registered"
          setup_api_calls:
            - call: "POST /applicants/register"
              payload: { email: "fk@x.com", full_name: "FK", gpa: 3.0 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "11111111-1111-4111-8111-111111111111", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == 'ERR_FK_NOT_FOUND'"

      - name: entity_application_applicant_school_unique_pair
        claim_type: Type Constraints
        grounds:
          - entities.Application.fields.school_id
          - validations[priority=8]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: "(applicant_id, school_id) is unique on Application — a second POST /applications with the same pair returns ERR_DUPLICATE_RESOURCE."
        test_recipe:
          setup:
            - "Applicant + School + one Application linking them already exist"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "UQ-AS", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /applicants/register"
              payload: { email: "uqas@x.com", full_name: "UQ", gpa: 3.0 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "EARLY_ACTION" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_DUPLICATE_RESOURCE'"

  # ==========================================================================
  # Section 2 — State Machines (Table 2)
  # ==========================================================================
  - section: state_machines
    instances:

      - name: state_machine_application_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.Application
          - entities.Application.fields.status
        distinguishing_aspect: "POST /applications creates Application.status == 'DRAFT' (initial_state of the Application machine)."
        test_recipe:
          setup:
            - "Applicant + School exist"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "INI-1", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /applicants/register"
              payload: { email: "ini@x.com", full_name: "Ini", gpa: 3.0 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "Application.${app_id}.status == 'DRAFT'"

      - name: state_machine_application_submit_from_draft_not_ready_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Application.transitions.DRAFT_to_SUBMITTED
          - entities.Applicant.fields.profile_status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /applications/{id}/submit when Applicant.profile_status=='DRAFT' (no Recommender row yet) is rejected with ERR_INVALID_STATE — precondition 'Applicant.profile_status == READY' fails."
        test_recipe:
          setup:
            - "Applicant whose profile is still DRAFT (no Recommender invited yet)"
            - "Application DRAFT exists; essay submitted"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "PR-NR", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "prnr@x.com", full_name: "PRNR", gpa: 3.0 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app_id}", prompt_code: "P", body: "essay" }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_INVALID_STATE'"

      - name: state_machine_application_invalid_transition_admitted_to_under_review
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /applications/{id}/start-review on an ADMITTED Application is rejected — only SUBMITTED and DEFERRED are valid from-states for that trigger."
        test_recipe:
          setup:
            - "Application driven through DRAFT→SUBMITTED→UNDER_REVIEW→ADMITTED"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "INV-T", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "invt@x.com", full_name: "InvT", gpa: 3.0 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "invtr@x.com", full_name: "InvTR", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /recommenders/${rec_id}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app_id}", prompt_code: "P", body: "essay" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app_id}", recommender_id: "${rec_id}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { letter_id: $.data.id }
            - call: "POST /recommendation-letters/${letter_id}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /recommendation-letters/${letter_id}/submit"
              payload: { body: "Letter body extending beyond two hundred characters with substantive content about the applicant's strengths in academic discipline and personal character demonstrated during instruction." }
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { v_review: $.data.version }
            - call: "POST /applications/${app_id}/decide"
