  - section: complexity_layers
    instances:
      - name: occ_rate_plan_activation_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rate-plan-activation-stale-site]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential activations based on the same observed Site.version: the first commits (version 1 -> 2); the second, still carrying version 1, is rejected ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["site (version 1 captured at creation) with two DRAFT plans P1, P2"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id, sv: $.data.version } }
            - { call: "POST /sites/${site_id}/rate-plans", payload: { mult_low: 1.1 }, as: NetworkAdmin, captures: { p1: $.data.id } }
            - { call: "POST /sites/${site_id}/rate-plans", payload: { mult_low: 1.2 }, as: NetworkAdmin, captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /sites/${site_id}/rate-plans/${p1}/transition", payload: { to: "ACTIVE", expected_site_version: "${sv}" }, as: NetworkAdmin, captures: { p1s: $.data.status } }
            - { call: "POST /sites/${site_id}/rate-plans/${p2}/transition", payload: { to: "ACTIVE", expected_site_version: "${sv}" }, as: NetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "P1 activation with the observed version succeeds (ACTIVE); Site.version advanced to 2"
            - "P2 activation carrying the stale version -> error_id == ERR_STALE_VERSION (412); P2 stays DRAFT"

      - name: occ_booking_extend_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-extend-stale-booking]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Extend with the version observed at creation succeeds and bumps Booking.version; a second extend replaying the same version is rejected ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["site 1 reservable stall; BOOKED booking arrival 2026-08-10, 1 night, version captured at creation"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-OC", full_name: "O Cee" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id, bv: $.data.version } }
          trigger:
            - { call: "POST /bookings/${b1}/extend", payload: { added_nights: 1, expected_booking_version: "${bv}" }, as: Driver, as_user_id: "${d1}", captures: { nc: $.data.night_count, q2: $.data.quoted_total_cents } }
            - { call: "POST /bookings/${b1}/extend", payload: { added_nights: 1, expected_booking_version: "${bv}" }, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "first extend: night_count == 2, quoted_total_cents == 9000 (extension night priced at current 4500)"
            - "second extend with the same version -> error_id == ERR_STALE_VERSION (412); night_count stays 2"

      - name: ops_run_epoch_idempotent_second_sweep
        claim_type: ops_run_checkpoint
        grounds: ['endpoints["POST /sites/{site_id}/ops-run"]', entities.Site.fields.ops_run_index]
        distinguishing_aspect: "The sweep is epoch-based: a second ops-run at the same clock marks nothing new; ops_run_index still increments (1 -> 2)."
        test_recipe:
          setup: ["site 1 reservable stall; BOOKED booking past its no-show deadline; one ops-run already executed at that clock"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-EP", full_name: "E Pee" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T16:00:01Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin, captures: { idx1: $.data.ops_run_index } }
          trigger:
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin, captures: { idx2: $.data.ops_run_index } }
            - { call: "GET /bookings/${b1}", payload: {}, as: NetworkAdmin, captures: { st: $.data.status, fee: $.data.fee_cents } }
          assert:
            - "ops_run_index 1 -> 2 across the two runs"
            - "booking stays NO_SHOW with fee_cents == 4500 (no double-charge, no duplicate strike: driver strikes_90d == 1)"

  - section: consistency_model
    instances:
      - name: booking_create_response_carries_full_assignment_and_quote
        claim_type: immediate
        grounds: ['endpoints["POST /bookings"]', calculations.stall_assignment_selector]
        distinguishing_aspect: "Immediate consistency: the 201 response itself carries the selector-chosen stall_id, pinned per_night_rates, quoted_total_cents, status BOOKED and version 1 — no follow-up read needed."
        test_recipe:
          setup: ["site (base 5000) with reservable stalls R01/R02"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-IC", full_name: "I Cee" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 2, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id, stall: $.data.stall_id, q: $.data.quoted_total_cents, st: $.data.status, v: $.data.version } }
          assert:
            - "response stall_id == ${s1} (lowest stall_number wins), status == BOOKED, version == 1"
            - "response quoted_total_cents == 9000 (2 nights x 4500) and per_night_rates pinned in the same response"

  - section: validations
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "No X-User-Role header at all -> ERR_UNAUTHENTICATED 401 on any endpoint (checked before authorization)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /sites", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (401)"

      - name: reserved_booking_on_first_come_stall_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_STALL_NOT_RESERVABLE]"]
        distinguishing_aspect: "An explicit stall_id from the wrong pool (is_reservable=false for a RESERVED booking) is rejected ERR_STALL_NOT_RESERVABLE even though the stall is free."
        test_recipe:
          setup: ["site with 1 first-come stall F01; driver; clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "F01", stall_class: "STANDARD", is_reservable: false }, as: NetworkAdmin, captures: { f1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-NR", full_name: "N Arr" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT", stall_id: "${f1}" }, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALL_NOT_RESERVABLE (409)"

      - name: checkin_before_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CHECKIN_WINDOW_NOT_OPEN]"]
        distinguishing_aspect: "Check-in at 14:59:59Z on arrival day (one second before checkin_open_at 15:00) -> ERR_CHECKIN_WINDOW_NOT_OPEN."
        test_recipe:
          setup: ["site 1 reservable stall; BOOKED booking arrival 2026-08-10; clock 2026-08-10T14:59:59Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-EW", full_name: "E Dub" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:59:59Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CHECKIN_WINDOW_NOT_OPEN (409)"

      - name: reserved_arrival_in_past_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_WINDOW_IN_PAST]"]
        distinguishing_aspect: "RESERVED arrival_date before the clock date -> ERR_WINDOW_IN_PAST (422); arrival equal to the clock date is allowed."
        test_recipe:
          setup: ["site 1 reservable stall; driver; clock 2026-08-10T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-PW", full_name: "P Dub" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-09", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { ok: $.data.id } }
          assert:
            - "arrival 2026-08-09 -> error_id == ERR_WINDOW_IN_PAST (422)"
            - "arrival 2026-08-10 (same day) -> 201 created"

      - name: waitlist_accept_after_offer_expiry_rejected
        claim_type: violation_to_error
        grounds: [state_machines.WaitlistEntry.OFFERED_to_PROMOTED, "errors[ERR_OFFER_EXPIRED]"]
        distinguishing_aspect: "Accept when clock is past offer_expires_at but no sweep has run yet -> ERR_OFFER_EXPIRED (the entry is still OFFERED; the time check, not a state flip, rejects)."
        test_recipe:
          setup: ["site 1 reservable stall; booking cancelled so entry E1 is OFFERED with offer_expires_at 2026-08-01T00:30:00Z; clock moved to 00:30:01 without an ops-run"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-OA", full_name: "O Aye" }, as: Anonymous, captures: { da: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-OW", full_name: "O Dub" }, as: Anonymous, captures: { dw1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${da}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${da}", captures: { ba: $.data.id } }
            - { call: "POST /waitlist-entries", payload: { driver_id: "${dw1}", site_id: "${site_id}", arrival_date: "2026-08-10", night_count: 1, stall_class: "STANDARD", payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${dw1}", captures: { e1: $.data.id } }
            - { call: "POST /bookings/${ba}/cancel", payload: {}, as: Driver, as_user_id: "${da}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:30:01Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /waitlist-entries/${e1}/accept", payload: {}, as: Driver, as_user_id: "${dw1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OFFER_EXPIRED (409); entry still OFFERED until a sweep runs"

      - name: extension_into_occupied_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_EXTENSION_CONFLICT]"]
        distinguishing_aspect: "Extending B1 (ends 2026-08-11T11:00Z) by a night collides with B2 already holding the stall from 2026-08-11T15:00Z -> ERR_EXTENSION_CONFLICT; B1's window is unchanged."
        test_recipe:
          setup: ["site 1 reservable stall; B1 (driver X) arrival 08-10, B2 (driver Y) arrival 08-11 on the same stall; B1 version captured"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-EX", full_name: "E Ex" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-EY", full_name: "E Wye" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id, bv: $.data.version } }
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-11", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}" }
          trigger:
            - { call: "POST /bookings/${b1}/extend", payload: { added_nights: 1, expected_booking_version: "${bv}" }, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
            - { call: "GET /bookings/${b1}", payload: {}, as: NetworkAdmin, captures: { nc: $.data.night_count } }
          assert:
            - "error_id == ERR_EXTENSION_CONFLICT (409)"
            - "B1 night_count remains 1 and version remains unchanged"

      - name: suspended_driver_cannot_create_booking
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_DRIVER_SUSPENDED]", calculations.driver_standing_eval]
        distinguishing_aspect: "A driver at 3 strikes (one EVICTION weight-2 plus one NO_SHOW weight-1) is SUSPENDED; a new booking create fails ERR_DRIVER_SUSPENDED."
        test_recipe:
          setup:
            - "site 1 reservable stall; driver with B1 checked in 08-10, swept OVERSTAY 08-11T11:31Z, force-evicted (2 strikes); B2 arrival 08-11 swept NO_SHOW at 16:00:01Z (3rd strike)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-SU", full_name: "S You" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-11", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T11:31:00Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-out", payload: { force: true }, as: SiteOperator, as_user_id: "op-alice" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T16:00:01Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
            - { call: "GET /drivers/${d1}", payload: {}, as: NetworkAdmin, captures: { stand: $.data.standing, strk: $.data.strikes_90d } }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-20", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "Driver.strikes_90d == 3 and standing == SUSPENDED"
            - "new booking -> error_id == ERR_DRIVER_SUSPENDED (409)"

