      - name: priority_ordering_between_two_simultaneously_violated_rules
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: visit_state_check_precedes_grant_funds_check_on_installation
          rationale: "All three §1.8 priority_pair_validation_conflict instances (this one, placement_safety_check_precedes_lot_type_mismatch_check and crew_interval_conflict_precedes_route_slot_exhaustion) already violate two rules at once and assert that the lower-priority error is suppressed, including the control legs that trigger each rule alone."

      - name: cascading_validation_order_between_state_and_fiscal_checks
        claim_type: cascading_validation
        excluded_because:
          difficulty_instance: visit_state_check_precedes_grant_funds_check_on_installation
          rationale: "The same §1.8 instance proves the state gate runs before the fiscal gate on POST /crr/installations, which is exactly the cascading-validation claim for this scaffold."

      - name: cross_entity_state_gates_on_dependent_creates
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: route_creation_depends_on_riskzone_assessment_state
          rationale: "The three §1.8 cross_entity_state_dependency instances already cover the state-of-another-entity gates (zone -> route, grant -> device lot, household -> escape plan) in both the valid and the invalid direction."

      - name: aggregate_capacity_without_intervals
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: zone_daily_slot_cap_is_pure_aggregate_capacity_without_intervals
          rationale: "The §1.8 resource_temporal_overlap instance already drives the zone daily-cap aggregate over multiple routes on one service_date and shows it ignores time-of-day intervals entirely."

  # =========================================================================
  # 5. From Table 5 (Endpoints)
  # =========================================================================
  - section: endpoints
    instances:
      - name: device_lot_receipt_read_and_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /crr/device-lots]
          - endpoints[GET /crr/device-lots/{id}]
          - endpoints[GET /crr/device-lots]
          - entities.DeviceLot
        distinguishing_aspect: "The create/read/list triple for the only entity with three interlocking quantity counters: the receipt sets on_hand_qty = received_qty with reserved_qty and consumed_qty at 0 and status AVAILABLE, and the same row is byte-identical when read back by id and when returned by the funding_grant_id-filtered list."
        test_recipe:
          setup:
            - "One ACTIVE grant funding SMOKE_10YR and CO_ALARM; no lots yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/partners"
              payload: { org_name: "Firesafe Trust", org_type: "NONPROFIT", contact_email: "grants@firesafe.example", agreement_signed: true }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /crr/grants"
              payload: { partner_id: "${p_id}", grant_code: "G-UNIT-1", authorized_cents: 500000, period_start_date: "2026-07-01", period_end_date: "2026-12-31", allowed_device_types: ["SMOKE_10YR", "CO_ALARM"], unit_rate_cents_by_type: { SMOKE_10YR: 2195, CO_ALARM: 3495 }, reimbursement_basis: "UNIT_RATE", reimbursement_pct: 87.5, indirect_rate_pct: 12.5, match_pct: 20.0 }
              as: GrantOfficer
              captures: { g_id: $.data.id }
            - call: "POST /crr/grants/${g_id}/activate"
              payload: {}
              as: GrantOfficer
          trigger:
            - call: "POST /crr/device-lots"
              payload: { funding_grant_id: "${g_id}", sku: "SKU-SM10-A", device_type: "SMOKE_10YR", unit_cost_cents: 1850, received_qty: 60, expiry_date: "2027-06-30" }
              as: GrantOfficer
              captures: { lot_id: $.data.id }
          assert:
            - "response.status == 201"
            - "DeviceLot.${lot_id}.funding_grant_id == ${g_id}"
