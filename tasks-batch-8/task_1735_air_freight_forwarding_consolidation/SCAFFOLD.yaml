# =============================================================================
# PRD Benchmark Scaffold — Air Freight Forwarding & Consolidation
# =============================================================================

scenario: |
  Air Freight Forwarding & Consolidation (Expeditors style forwarder): booking &
  capacity procurement with airlines, consolidation into master air waybill with
  house waybills, dangerous goods & security screening (known shipper) compliance,
  chargeable weight (dimensional) calculation, customs entry coordination &
  document handoff, transit milestone tracking & exception, rate agreement & spot
  surcharge, claim & liability limits

domain_name: air-freight-forwarding-consolidation
api_prefix: /air-freight

complexity_profile:
  primary_archetype: quota_allocation        # booked flight capacity competed for by consolidation
  secondary_archetype: compliance_audit      # known-shipper / DG screening gates, segregation of duties
  complexity_layers:
    - optimistic_concurrency                 # OCC on MasterWaybill.version for consolidation
    - cascading_side_effects                 # booking cancel -> MAWB void -> HWB detach -> capacity recompute
    - dual_variant_calculation               # QUOTED vs FINAL chargeable weight; STANDARD vs DECLARED_VALUE liability
    - rate_threshold_triggers                # spot surcharge at >= 85% utilization; demerit suspension at >= 3
  entity_topology: flat                      # peer entities linked by foreign keys; no URL nesting for ownership
  state_machine_shape: cyclic                # HWB screening revision loop; claim counteroffer loop; customs rework loop
  relationship_patterns:
    - one_to_many                            # booking -> MAWBs, MAWB -> HWBs, HWB -> screenings/entries/claims
    - cross_aggregate                        # HWB references both Shipper and MasterWaybill/FlightBooking lane
  role_model: segregation_of_duties          # screener must differ from submitter; ops/broker handoff split
  consistency_model: immediate               # all side effects visible in the same response / immediate GET

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Shipper
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shipper company name" }
      - { name: account_code, type: string, source: input, description: "Unique shipper account code", constraints: "unique across all shippers" }
      - { name: known_shipper_status, type: enum, source: system, default: UNVERIFIED, description: "Known-shipper compliance standing", constraints: "UNVERIFIED | KNOWN | SUSPENDED" }
      - { name: screening_rejection_count, type: integer, source: computed, default: 0, description: "Cumulative screening rejections on this shipper's house waybills; reset to 0 on reinstatement; >= 3 auto-suspends a KNOWN shipper" }

  - name: FlightBooking
    parent: null
    common_fields: true
    fields:
      - { name: airline_code, type: string, source: input, description: "Operating airline IATA code" }
      - { name: flight_number, type: string, source: input, description: "Flight number, e.g. UA838" }
      - { name: origin_code, type: string, source: input, description: "Origin airport IATA code" }
      - { name: destination_code, type: string, source: input, description: "Destination airport IATA code" }
      - { name: scheduled_departure_utc, type: datetime, source: input, description: "Scheduled departure instant (UTC)" }
      - { name: cutoff_utc, type: datetime, source: input, description: "Latest consolidation/booking cutoff; must be < scheduled_departure_utc" }
      - { name: booked_weight_kg, type: number, source: input, description: "Allotted weight capacity purchased from the airline (kg)", constraints: "> 0" }
      - { name: booked_volume_m3, type: number, source: input, description: "Allotted volume capacity purchased (cubic metres)", constraints: "> 0" }
      - { name: consumed_weight_kg, type: number, source: computed, default: 0, description: "Sum of chargeable_weight_kg over house waybills attached to non-VOID master waybills of this booking in CONSOLIDATED or later (pre-DELIVERED-terminal) states" }
      - { name: consumed_volume_m3, type: number, source: computed, default: 0, description: "Sum of effective_volume_m3 over the same house waybill set as consumed_weight_kg" }
      - { name: utilization_pct, type: number, source: computed, default: 0, description: "max(consumed_weight_kg/booked_weight_kg, consumed_volume_m3/booked_volume_m3) * 100, 2 decimal places round_half_up" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Booking lifecycle", constraints: "OPEN | CUTOFF_CLOSED | DEPARTED | CANCELLED" }

  - name: MasterWaybill
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> FlightBooking.id; the procured capacity this consolidation flies on" }
      - { name: mawb_number, type: string, source: input, description: "Airline master air waybill number", constraints: "unique across all master waybills" }
      - { name: total_chargeable_weight_kg, type: number, source: computed, default: 0, description: "Sum of chargeable_weight_kg over attached house waybills in CONSOLIDATED or TENDERED state" }
      - { name: total_volume_m3, type: number, source: computed, default: 0, description: "Sum of effective_volume_m3 over attached house waybills in CONSOLIDATED or TENDERED state" }
      - { name: total_freight_amount, type: number, source: computed, default: 0, description: "Sum of total_charge_amount over attached house waybills in CONSOLIDATED or TENDERED state" }
      - { name: tender_window_start_utc, type: datetime, source: input, description: "Terminal tender window start; null until tendered", constraints: "nullable" }
      - { name: tender_window_end_utc, type: datetime, source: input, description: "Terminal tender window end; null until tendered; must be > tender_window_start_utc", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Consolidation lifecycle", constraints: "DRAFT | OPEN_FOR_CONSOLIDATION | TENDERED | IN_TRANSIT | ARRIVED | DELIVERED | CLOSED | VOID" }

  - name: HouseWaybill
    parent: null
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: input, description: "FK -> Shipper.id; the customer this house waybill is issued for" }
      - { name: mawb_id, type: string, source: system, description: "FK -> MasterWaybill.id; null until consolidated", constraints: "nullable" }
      - { name: hwb_number, type: string, source: input, description: "Forwarder house waybill number", constraints: "unique across all house waybills" }
      - { name: origin_code, type: string, source: input, description: "Origin airport IATA code; must equal the booking's origin_code at consolidation" }
      - { name: destination_code, type: string, source: input, description: "Destination airport IATA code; must equal the booking's destination_code at consolidation" }
      - { name: pieces, type: integer, source: input, description: "Number of pieces", constraints: "> 0" }
      - { name: gross_weight_kg, type: number, source: input, description: "Actual gross weight (kg)", constraints: "> 0" }
      - { name: declared_volume_m3, type: number, source: input, description: "Shipper-declared volume (m3); basis of QUOTED chargeable weight", constraints: "> 0" }
      - { name: measured_volume_m3, type: number, source: input, description: "Warehouse-measured volume (m3) recorded via the measure endpoint; null until measured; basis of FINAL chargeable weight", constraints: "nullable" }
      - { name: effective_volume_m3, type: number, source: computed, default: 0, description: "measured_volume_m3 when set, otherwise declared_volume_m3" }
      - { name: chargeable_weight_kg, type: number, source: computed, default: 0, description: "max(gross_weight_kg, volume/DIM_FACTOR) rounded UP to the next 0.5 kg; 0 until rated at consolidation" }
      - { name: weight_basis, type: enum, source: system, default: UNRATED, description: "Which volume basis chargeable_weight_kg reflects", constraints: "UNRATED | QUOTED | FINAL" }
      - { name: dg_flag, type: boolean, source: input, default: false, description: "True when the commodity is dangerous goods requiring DANGEROUS_GOODS screening" }
      - { name: declared_value_amount, type: number, source: input, default: 0, description: "Shipper-declared value for carriage (USD)", constraints: ">= 0" }
      - { name: declared_value_surcharge_paid, type: boolean, source: input, default: false, description: "True when the shipper paid the declared-value surcharge; selects the DECLARED_VALUE liability variant" }
      - { name: freight_amount, type: number, source: computed, default: 0, description: "Weight-break rated freight line (2dp round_half_up)" }
      - { name: fuel_surcharge_amount, type: number, source: computed, default: 0, description: "round2(freight_amount * agreement.fuel_surcharge_pct)" }
      - { name: security_fee_amount, type: number, source: computed, default: 0, description: "Flat security fee copied from the applied rate agreement" }
      - { name: spot_surcharge_amount, type: number, source: computed, default: 0, description: "round2(freight_amount * agreement.spot_surcharge_pct) when spot_surcharge_applied, else 0" }
      - { name: spot_surcharge_applied, type: boolean, source: computed, default: false, description: "Locked at consolidation by the pre-assignment utilization snapshot; NOT re-evaluated at tender" }
      - { name: total_charge_amount, type: number, source: computed, default: 0, description: "freight_amount + fuel_surcharge_amount + security_fee_amount + spot_surcharge_amount (sum of already-rounded lines)" }
      - { name: rate_agreement_id, type: string, source: system, description: "FK -> RateAgreement.id; the agreement selected at rating time; null until rated", constraints: "nullable" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the ForwarderOps user who submitted the waybill to screening; null until submitted", constraints: "nullable" }
      - { name: delivered_at_utc, type: datetime, source: system, description: "event_time_utc of the DELIVERED milestone that delivered this waybill; null until delivered", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "House waybill lifecycle", constraints: "DRAFT | SCREENING | SCREENING_REJECTED | CLEARED | CONSOLIDATED | TENDERED | IN_TRANSIT | DELIVERED | CANCELLED" }

  - name: ScreeningRecord
    parent: null
    common_fields: true
    fields:
      - { name: hwb_id, type: string, source: system, description: "FK -> HouseWaybill.id; auto-created at submit" }
      - { name: screening_type, type: enum, source: system, description: "SECURITY (always required) | DANGEROUS_GOODS (required iff hwb.dg_flag)" , constraints: "SECURITY | DANGEROUS_GOODS" }
      - { name: result, type: enum, source: system, default: PENDING, description: "Screening outcome", constraints: "PENDING | CLEARED | REJECTED" }
      - { name: rejection_reason, type: string, source: input, description: "Reason recorded when outcome is REJECTED", constraints: "nullable" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who resolved the record; null while PENDING", constraints: "nullable" }

  - name: CustomsEntry
    parent: null
    common_fields: true
    fields:
      - { name: hwb_id, type: string, source: system, description: "FK -> HouseWaybill.id; taken from the creation path" }
      - { name: entry_type, type: enum, source: input, description: "Customs entry type", constraints: "INFORMAL | CONSUMPTION | TRANSIT" }
      - { name: broker_reference, type: string, source: input, description: "Broker entry reference; may be supplied at creation or at filing", constraints: "nullable" }
      - { name: rejection_reason, type: string, source: input, description: "Customs rejection reason recorded on REJECTED", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: PREPARING, description: "Entry lifecycle", constraints: "PREPARING | HANDED_OFF | FILED | REJECTED | RELEASED" }

  - name: RateAgreement
    parent: null
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: input, description: "FK -> Shipper.id; customer this tariff applies to" }
      - { name: origin_code, type: string, source: input, description: "Lane origin IATA code" }
      - { name: destination_code, type: string, source: input, description: "Lane destination IATA code" }
      - { name: weight_breaks, type: array, source: input, description: "List of {min_weight_kg, rate_per_kg} tiers; min_weight_kg values distinct and ascending; at least one tier" }
      - { name: min_charge_amount, type: number, source: input, description: "Minimum freight charge floor (USD)", constraints: ">= 0" }
      - { name: fuel_surcharge_pct, type: number, source: input, description: "Fuel surcharge fraction of freight, e.g. 0.125 = 12.5%", constraints: ">= 0" }
      - { name: security_fee_amount, type: number, source: input, description: "Flat security fee per house waybill (USD)", constraints: ">= 0" }
      - { name: spot_surcharge_pct, type: number, source: input, default: 0, description: "Spot surcharge fraction of freight applied when the booking utilization snapshot >= 85.00", constraints: ">= 0" }
      - { name: valid_from_utc, type: datetime, source: input, description: "Agreement validity window start (inclusive)" }
      - { name: valid_to_utc, type: datetime, source: input, description: "Agreement validity window end (exclusive); must be > valid_from_utc" }

  - name: MilestoneEvent
    parent: null
    common_fields: false
    fields:
      - { name: mawb_id, type: string, source: system, description: "FK -> MasterWaybill.id; taken from the creation path" }
      - { name: event_code, type: enum, source: input, description: "Transit milestone code", constraints: "DEPARTED | ARRIVED | DELIVERED | EXCEPTION" }
      - { name: event_time_utc, type: datetime, source: input, description: "When the milestone physically occurred (UTC)" }
      - { name: exception_code, type: enum, source: input, default: NONE, description: "Exception detail; required non-NONE iff event_code == EXCEPTION, must be NONE otherwise", constraints: "NONE | DAMAGE | SHORTAGE | DELAY | CUSTOMS_HOLD" }
      - { name: note, type: string, source: input, description: "Free-text note", constraints: "nullable" }
      - { name: out_of_order, type: boolean, source: computed, default: false, description: "True when the event's rank did not equal current MAWB rank + 1 at record time; such events never transition the MAWB" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: hwb_id, type: string, source: input, description: "FK -> HouseWaybill.id; the delivered waybill being claimed against" }
      - { name: claim_type, type: enum, source: input, description: "Claim category; selects the filing window", constraints: "DAMAGE | SHORTAGE | DELAY | LOSS" }
      - { name: claimed_amount, type: number, source: input, description: "Amount claimed (USD)", constraints: "> 0" }
      - { name: liability_basis, type: enum, source: system, description: "STANDARD (SDR/kg) or DECLARED_VALUE, selected from hwb.declared_value_surcharge_paid at filing", constraints: "STANDARD | DECLARED_VALUE" }
      - { name: liability_limit_amount, type: number, source: computed, description: "Maximum recoverable amount per the liability variant; stamped at filing" }
      - { name: approved_amount, type: number, source: system, description: "Final approved/settled amount; set at APPROVED (from input) or at accept-counter (from counter_amount); null otherwise", constraints: "nullable" }
      - { name: counter_amount, type: number, source: input, description: "Adjuster counteroffer amount; set when outcome COUNTERED", constraints: "nullable" }
      - { name: review_round_count, type: integer, source: computed, default: 0, description: "Number of rebuttal cycles (COUNTERED -> UNDER_REVIEW) this claim has gone through" }
      - { name: status, type: enum, source: system, default: FILED, description: "Claim lifecycle", constraints: "FILED | UNDER_REVIEW | COUNTERED | APPROVED | DENIED | SETTLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Shipper
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: KNOWN
        trigger: "POST /air-freight/shippers/{id}/verify-known-shipper"
        actor: ComplianceOfficer
        preconditions:
          - "known_shipper_status == UNVERIFIED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: KNOWN
        trigger: "POST /air-freight/shippers/{id}/verify-known-shipper"
        actor: ComplianceOfficer
        preconditions:
          - "known_shipper_status == SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "screening_rejection_count := 0 (reinstatement clears the demerit ledger)"
      - from: KNOWN
        to: SUSPENDED
        trigger: "system (automatic when a screening rejection raises screening_rejection_count to >= 3)"
        actor: system
        preconditions:
          - "screening_rejection_count after increment >= 3"
        side_effects:
          - "known_shipper_status := SUSPENDED; future dg submissions/consolidations gated by ERR_SHIPPER_NOT_KNOWN"

  - entity: FlightBooking
    initial_state: OPEN
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: OPEN
        to: CUTOFF_CLOSED
        trigger: "system (logical clock >= cutoff_utc; evaluated on POST /_clock/set_current_utc and lazily on read)"
        actor: system
        preconditions:
          - "current logical clock >= cutoff_utc"
        side_effects:
          - "status := CUTOFF_CLOSED; consolidation gate now rejects with ERR_BOOKING_NOT_OPEN"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /air-freight/flight-bookings/{id}/cancel"
        actor: CapacityPlanner
        preconditions:
          - "status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: every MasterWaybill with booking_id == this booking in DRAFT or OPEN_FOR_CONSOLIDATION or TENDERED -> VOID"
          - "Cascade link 2 (caused by each MAWB voiding): every attached HouseWaybill in CONSOLIDATED or TENDERED -> CLEARED with mawb_id := null, all amount fields := 0, spot flags := false, weight_basis := UNRATED; voided MAWB totals zeroed"
          - "Cascade link 3 (caused by the HWB detachments): booking consumed_weight_kg / consumed_volume_m3 / utilization_pct recomputed over the remaining attached set"
      - from: CUTOFF_CLOSED
        to: CANCELLED
        trigger: "POST /air-freight/flight-bookings/{id}/cancel"
        actor: CapacityPlanner
        preconditions:
          - "status == CUTOFF_CLOSED (else ERR_INVALID_STATE)"
        side_effects:
          - "Same three-link cascade as OPEN -> CANCELLED"
      - from: CUTOFF_CLOSED
        to: DEPARTED
        trigger: "system (automatic bubble-up when every MasterWaybill of this booking with status != VOID is in IN_TRANSIT, ARRIVED, DELIVERED, or CLOSED, and at least one such master waybill exists)"
        actor: system
        preconditions:
          - "count(MAWBs of booking with status NOT IN {VOID, DRAFT, OPEN_FOR_CONSOLIDATION, TENDERED}) >= 1 AND count(MAWBs of booking with status IN {DRAFT, OPEN_FOR_CONSOLIDATION, TENDERED}) == 0"
        side_effects: []

  - entity: MasterWaybill
    initial_state: DRAFT
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: DRAFT
        to: OPEN_FOR_CONSOLIDATION
        trigger: "POST /air-freight/master-waybills/{id}/open"
        actor: CapacityPlanner
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "FlightBooking of booking_id has status == OPEN (ERR_BOOKING_NOT_OPEN)"
        side_effects: []
      - from: OPEN_FOR_CONSOLIDATION
        to: TENDERED
        trigger: "POST /air-freight/master-waybills/{id}/tender"
        actor: CapacityPlanner
        preconditions:
          - "status == OPEN_FOR_CONSOLIDATION (else ERR_INVALID_STATE)"
          - "FlightBooking of booking_id has status IN {OPEN, CUTOFF_CLOSED} (ERR_BOOKING_NOT_OPEN)"
          - "at least one attached HouseWaybill in CONSOLIDATED state (ERR_NO_CONSOLIDATED_HOUSE_WAYBILLS)"
          - "every attached CONSOLIDATED HouseWaybill has measured_volume_m3 set (ERR_MEASURED_VOLUME_MISSING)"
          - "tender_window_end_utc > tender_window_start_utc (ERR_INVALID_REQUEST)"
          - "no other TENDERED MasterWaybill on the same booking whose window is within a 30-minute buffer: conflict iff new_start < existing_end + 30min AND new_end > existing_start - 30min (ERR_TENDER_WINDOW_CONFLICT)"
          - "re-rated FINAL capacity check: booking consumed recompute with FINAL weights must satisfy consumed_weight_kg <= booked_weight_kg AND consumed_volume_m3 <= booked_volume_m3 (ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "For each attached CONSOLIDATED HouseWaybill: weight_basis := FINAL; chargeable_weight_kg recomputed from measured_volume_m3; freight/fuel/security/spot amounts recomputed (spot_surcharge_applied stays locked from consolidation); status -> TENDERED"
          - "total_chargeable_weight_kg / total_volume_m3 / total_freight_amount recomputed"
          - "booking consumed_weight_kg / consumed_volume_m3 / utilization_pct recomputed"
      - from: TENDERED
        to: IN_TRANSIT
        trigger: "system (MilestoneEvent DEPARTED recorded with rank == current rank + 1)"
        actor: system
        preconditions:
          - "milestone rank rule: DEPARTED has rank 1; MAWB current rank is 0 while TENDERED"
        side_effects:
          - "Every attached HouseWaybill in TENDERED -> IN_TRANSIT"
          - "FlightBooking bubble-up re-evaluated for auto-DEPARTED"
      - from: IN_TRANSIT
        to: ARRIVED
        trigger: "system (MilestoneEvent ARRIVED, rank 2, recorded while current rank == 1)"
        actor: system
        preconditions:
          - "milestone rank rule satisfied"
        side_effects: []
      - from: ARRIVED
        to: DELIVERED
        trigger: "system (MilestoneEvent DELIVERED, rank 3, recorded while current rank == 2)"
        actor: system
        preconditions:
          - "milestone rank rule satisfied"
        side_effects:
          - "Every attached HouseWaybill in IN_TRANSIT -> DELIVERED with delivered_at_utc := milestone event_time_utc"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /air-freight/master-waybills/{id}/close"
        actor: CapacityPlanner
        preconditions:
          - "status == DELIVERED (else ERR_INVALID_STATE)"
          - "no Claim on any attached HouseWaybill with status IN {FILED, UNDER_REVIEW, COUNTERED, APPROVED} (ERR_OPEN_CLAIMS_EXIST)"
        side_effects: []
      - from: DRAFT
        to: VOID
        trigger: "POST /air-freight/master-waybills/{id}/void or system (booking cancel cascade)"
        actor: CapacityPlanner
        preconditions:
          - "status == DRAFT for the manual trigger (else ERR_INVALID_STATE)"
        side_effects:
          - "Attached HouseWaybill detach cascade: attached HWBs in CONSOLIDATED or TENDERED -> CLEARED with mawb_id := null, amounts := 0, spot flags := false, weight_basis := UNRATED; totals zeroed; booking consumed recomputed"
      - from: OPEN_FOR_CONSOLIDATION
        to: VOID
        trigger: "POST /air-freight/master-waybills/{id}/void or system (booking cancel cascade)"
        actor: CapacityPlanner
        preconditions:
          - "status == OPEN_FOR_CONSOLIDATION for the manual trigger (else ERR_INVALID_STATE)"
        side_effects:
          - "Same detach cascade as DRAFT -> VOID"
      - from: TENDERED
        to: VOID
        trigger: "system (booking cancel cascade only)"
        actor: system
        preconditions:
          - "parent FlightBooking transitioned to CANCELLED"
        side_effects:
          - "Same detach cascade as DRAFT -> VOID"

  - entity: HouseWaybill
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCREENING
        trigger: "POST /air-freight/house-waybills/{id}/submit"
        actor: ForwarderOps
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "dg_flag == false OR Shipper.known_shipper_status == KNOWN (ERR_SHIPPER_NOT_KNOWN)"
        side_effects:
          - "submitted_by_user_id := X-User-ID of the caller"
          - "Create ScreeningRecord(SECURITY, PENDING) for this waybill"
          - "If dg_flag: also create ScreeningRecord(DANGEROUS_GOODS, PENDING)"
      - from: SCREENING
        to: CLEARED
        trigger: "system (bubble-up: for every required screening type - SECURITY always, DANGEROUS_GOODS iff dg_flag - the latest ScreeningRecord by created_at has result == CLEARED)"
        actor: system
        preconditions:
          - "all required screening types cleared by their latest records"
        side_effects: []
      - from: SCREENING
        to: SCREENING_REJECTED
        trigger: "system (bubble-up: the latest ScreeningRecord of any required type has result == REJECTED)"
        actor: system
        preconditions:
          - "any required screening type rejected by its latest record"
        side_effects:
          - "Cascade link 1: this waybill's status := SCREENING_REJECTED"
          - "Cascade link 2 (caused by the rejection): Shipper of shipper_id screening_rejection_count += 1"
          - "Cascade link 3 (caused by the count increment): if screening_rejection_count >= 3 and shipper KNOWN -> SUSPENDED"
      - from: SCREENING
        to: DRAFT
        trigger: "POST /air-freight/house-waybills/{id}/recall"
        actor: ForwarderOps
        preconditions:
          - "status IN {SCREENING, SCREENING_REJECTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Existing ScreeningRecords are retained for audit; a later submit creates fresh records and clearance is judged on the latest record per type (created_at ordering)"
      - from: SCREENING_REJECTED
        to: DRAFT
        trigger: "POST /air-freight/house-waybills/{id}/recall"
        actor: ForwarderOps
        preconditions:
          - "status IN {SCREENING, SCREENING_REJECTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Same audit-retention rule as SCREENING -> DRAFT"
      - from: CLEARED
        to: CONSOLIDATED
        trigger: "POST /air-freight/master-waybills/{id}/house-waybills"
        actor: ForwarderOps
        preconditions:
          - "status == CLEARED (ERR_HWB_NOT_CLEARED)"
          - "target MasterWaybill status == OPEN_FOR_CONSOLIDATION (ERR_MAWB_NOT_OPEN_FOR_CONSOLIDATION)"
          - "booking of the target MAWB has status == OPEN (ERR_BOOKING_NOT_OPEN)"
          - "expected_master_waybill_version == MasterWaybill.version (ERR_STALE_VERSION)"
          - "dg_flag == false OR Shipper.known_shipper_status == KNOWN re-checked at consolidation (ERR_SHIPPER_NOT_KNOWN)"
          - "origin_code == booking.origin_code AND destination_code == booking.destination_code (ERR_LANE_MISMATCH)"
          - "a RateAgreement exists for (shipper_id, origin_code, destination_code) with valid_from_utc <= logical clock < valid_to_utc (ERR_NO_ACTIVE_RATE_AGREEMENT)"
          - "booking.consumed_weight_kg + candidate chargeable_weight_kg <= booked_weight_kg AND booking.consumed_volume_m3 + candidate effective_volume_m3 <= booked_volume_m3 (ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "mawb_id := target MAWB; weight_basis := QUOTED"
          - "chargeable_weight_kg computed from declared_volume_m3 (QUOTED variant)"
          - "spot_surcharge_applied decided from the pre-assignment utilization snapshot (candidate excluded), then locked"
          - "freight/fuel/security/spot/total charge lines computed via the selected RateAgreement; rate_agreement_id stamped"
          - "MasterWaybill totals recomputed; MasterWaybill.version incremented by 1"
          - "FlightBooking consumed_weight_kg / consumed_volume_m3 / utilization_pct recomputed"
      - from: CONSOLIDATED
        to: CLEARED
        trigger: "DELETE /air-freight/master-waybills/{id}/house-waybills/{houseWaybillId} (or system via MAWB void / booking cancel)"
        actor: ForwarderOps
        preconditions:
          - "for the manual trigger: status == CONSOLIDATED AND mawb_id == path masterWaybillId (else ERR_INVALID_STATE)"
        side_effects:
          - "mawb_id := null; all amount fields := 0; spot_surcharge_applied := false; spot_surcharge_amount := 0; weight_basis := UNRATED; chargeable_weight_kg := 0; rate_agreement_id := null"
          - "MasterWaybill totals recomputed; MasterWaybill.version incremented by 1 (manual trigger)"
          - "FlightBooking consumed_weight_kg / consumed_volume_m3 / utilization_pct recomputed"
      - from: CONSOLIDATED
        to: TENDERED
        trigger: "system (master waybill tender)"
        actor: system
        preconditions:
          - "measured_volume_m3 is set (enforced at MAWB tender)"
        side_effects:
          - "weight_basis := FINAL; chargeable_weight_kg recomputed from measured_volume_m3; charge lines recomputed; spot_surcharge_applied unchanged (locked at consolidation)"
      - from: TENDERED
        to: IN_TRANSIT
        trigger: "system (DEPARTED milestone on the master waybill)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system (DELIVERED milestone on the master waybill)"
        actor: system
        preconditions: []
        side_effects:
          - "delivered_at_utc := milestone event_time_utc"
      - from: TENDERED
        to: CLEARED
        trigger: "system (booking cancel cascade while MAWB TENDERED)"
        actor: system
        preconditions: []
        side_effects:
          - "Same detach-and-zero rule as CONSOLIDATED -> CLEARED (no version increment on the voided MAWB)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /air-freight/house-waybills/{id}/cancel"
        actor: ForwarderOps
        preconditions:
          - "status IN {DRAFT, SCREENING, SCREENING_REJECTED, CLEARED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SCREENING
        to: CANCELLED
        trigger: "POST /air-freight/house-waybills/{id}/cancel"
        actor: ForwarderOps
        preconditions:
          - "status IN {DRAFT, SCREENING, SCREENING_REJECTED, CLEARED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SCREENING_REJECTED
        to: CANCELLED
        trigger: "POST /air-freight/house-waybills/{id}/cancel"
        actor: ForwarderOps
        preconditions:
          - "status IN {DRAFT, SCREENING, SCREENING_REJECTED, CLEARED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: CLEARED
        to: CANCELLED
        trigger: "POST /air-freight/house-waybills/{id}/cancel"
        actor: ForwarderOps
        preconditions:
          - "status IN {DRAFT, SCREENING, SCREENING_REJECTED, CLEARED} (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: CustomsEntry
    initial_state: PREPARING
    terminal_states: [RELEASED]
    transitions:
      - from: PREPARING
        to: HANDED_OFF
        trigger: "POST /air-freight/customs-entries/{id}/transition with target_status=HANDED_OFF"
        actor: ForwarderOps
        preconditions:
          - "status == PREPARING (else ERR_INVALID_STATE)"
          - "HouseWaybill of hwb_id has status IN {CLEARED, CONSOLIDATED, TENDERED, IN_TRANSIT, DELIVERED} (ERR_HWB_NOT_CLEARED)"
        side_effects: []
      - from: HANDED_OFF
        to: FILED
        trigger: "POST /air-freight/customs-entries/{id}/transition with target_status=FILED"
        actor: CustomsBroker
        preconditions:
          - "status == HANDED_OFF (else ERR_INVALID_STATE)"
        side_effects:
          - "broker_reference recorded when supplied in the transition payload"
      - from: FILED
        to: RELEASED
        trigger: "POST /air-freight/customs-entries/{id}/transition with target_status=RELEASED"
        actor: CustomsBroker
        preconditions:
          - "status == FILED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: FILED
        to: REJECTED
        trigger: "POST /air-freight/customs-entries/{id}/transition with target_status=REJECTED"
        actor: CustomsBroker
        preconditions:
          - "status == FILED (else ERR_INVALID_STATE)"
        side_effects:
          - "rejection_reason recorded from payload"
      - from: REJECTED
        to: PREPARING
        trigger: "POST /air-freight/customs-entries/{id}/transition with target_status=PREPARING"
        actor: ForwarderOps
        preconditions:
          - "status == REJECTED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: Claim
    initial_state: FILED
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /air-freight/claims/{id}/start-review"
        actor: ClaimsAdjuster
        preconditions:
          - "status == FILED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /air-freight/claims/{id}/resolve-review with outcome=APPROVED"
        actor: ClaimsAdjuster
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "0 < approved_amount <= min(claimed_amount, liability_limit_amount) (ERR_AMOUNT_EXCEEDS_LIABILITY; ERR_INVALID_REQUEST when <= 0 or missing)"
        side_effects:
          - "approved_amount := payload approved_amount"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /air-freight/claims/{id}/resolve-review with outcome=DENIED"
        actor: ClaimsAdjuster
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: COUNTERED
        trigger: "POST /air-freight/claims/{id}/resolve-review with outcome=COUNTERED"
        actor: ClaimsAdjuster
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "0 < counter_amount <= liability_limit_amount (ERR_AMOUNT_EXCEEDS_LIABILITY; ERR_INVALID_REQUEST when <= 0 or missing)"
        side_effects:
          - "counter_amount := payload counter_amount"
      - from: COUNTERED
        to: UNDER_REVIEW
        trigger: "POST /air-freight/claims/{id}/rebut"
        actor: ForwarderOps
        preconditions:
          - "status == COUNTERED (else ERR_INVALID_STATE)"
        side_effects:
          - "review_round_count += 1"
      - from: COUNTERED
        to: SETTLED
        trigger: "POST /air-freight/claims/{id}/accept-counter"
        actor: ForwarderOps
        preconditions:
          - "status == COUNTERED (else ERR_INVALID_STATE)"
        side_effects:
          - "approved_amount := counter_amount"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /air-freight/claims/{id}/settle"
        actor: ClaimsAdjuster
        preconditions:
          - "status == APPROVED (else ERR_INVALID_STATE)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: consolidate-stale-mawb-version
    parent_entity: MasterWaybill
    write_endpoint: "POST /air-freight/master-waybills/{id}/house-waybills"
    occ_field: expected_master_waybill_version
    description: |
      Consolidating a house waybill into a master waybill whose version has
      advanced beyond the version the caller last observed is rejected. This
      captures the case where another consolidation or deconsolidation has just
      mutated the master waybill (totals, attached set) and the caller's view of
      its capacity consumption is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: chargeable_weight
    trigger: "consolidation (QUOTED variant) and master-waybill tender (FINAL variant)"
    algorithm: threshold
    formula: |
      dim_weight_kg = volume_m3 / DIM_FACTOR_M3_PER_KG
      raw = max(gross_weight_kg, dim_weight_kg)
      chargeable_weight_kg = ceil(raw * 2) / 2        # round UP to the next 0.5 kg
      QUOTED variant:  volume_m3 = declared_volume_m3
      FINAL variant:   volume_m3 = measured_volume_m3 (required set before tender)
    input_set: "the single HouseWaybill being rated"
    constants:
      DIM_FACTOR_M3_PER_KG: 0.006    # 1 kg per 6000 cm3 (IATA volumetric divisor)
      ROUNDING_STEP_KG: 0.5          # always ceil, never banker's/half-even
    precision: "0.5 kg steps, ceiling"
    variants:
      - name: QUOTED
        when: "computed at consolidation from declared_volume_m3"
        difference: "uses shipper-declared volume; basis for the capacity check and initial charges"
      - name: FINAL
        when: "recomputed at master-waybill tender from measured_volume_m3"
        difference: "uses warehouse-measured volume; identical inputs except volume source, so a measurement delta changes chargeable weight and every downstream charge"

  - name: freight_rate_selection
    trigger: "every (re-)rating of a HouseWaybill: consolidation and tender"
    algorithm: tiered_pricing
    formula: |
      agreement = the RateAgreement selected for (shipper_id, origin_code, destination_code)
      applicable = [tier for tier in agreement.weight_breaks if tier.min_weight_kg <= chargeable_weight_kg]
      if applicable is empty:
          freight = agreement.min_charge_amount
      else:
          candidates = [max(agreement.min_charge_amount, tier.rate_per_kg * chargeable_weight_kg)
                        for tier in applicable]
          freight = min(candidates)          # IATA lowest-applicable-rate rule: higher weight
                                             # breaks with lower rates win even below the break
    input_set: "the rated HouseWaybill plus the single active RateAgreement for its (shipper, lane)"
    constants: {}
    precision: "2 decimal places, round_half_up (applied when the charge line is written)"
    variants: []

  - name: charge_line_total
    trigger: "every (re-)rating of a HouseWaybill, after freight_rate_selection and spot_surcharge_determination"
    algorithm: aggregation
    formula: |
      freight_amount  = round2(freight_rate_selection result)                      # ROUND_HALF_UP
      fuel_surcharge_amount = round2(freight_amount * agreement.fuel_surcharge_pct)  # from the ROUNDED freight line
      security_fee_amount = agreement.security_fee_amount                           # flat, copied verbatim
      spot_surcharge_amount = round2(freight_amount * agreement.spot_surcharge_pct) if spot_surcharge_applied else 0
      total_charge_amount = freight_amount + fuel_surcharge_amount + security_fee_amount + spot_surcharge_amount
      PINNED ORDER: each line is rounded to 2dp ROUND_HALF_UP FIRST, then the rounded
      lines are summed. (Sum-then-round of the raw components is a different, forbidden
      order: e.g. rate 3.33 x 45.5 kg with 15% fuel and 10.01 security fee totals
      184.26 per-line-rounded vs 184.25 sum-then-rounded.)
    input_set: "the rated HouseWaybill and its selected RateAgreement"
    constants: {}
    precision: "2 decimal places per line, round_half_up, lines rounded before summation"

  - name: spot_surcharge_determination
    trigger: "consolidation of a HouseWaybill into a MasterWaybill (locked thereafter)"
    algorithm: threshold
    formula: |
      EVALUATION ORDER (pinned to remove the circular dependency between the
      candidate's charges and the utilization the candidate itself creates):
        1. snapshot = booking.consumed_weight_kg / consumed_volume_m3 over house
           waybills ALREADY attached to the booking's non-VOID master waybills,
           EXCLUDING the candidate waybill
        2. snapshot_util_pct = max(snapshot_weight / booked_weight_kg,
                                   snapshot_volume / booked_volume_m3) * 100   (2dp round_half_up)
        3. spot_surcharge_applied = (snapshot_util_pct >= SPOT_THRESHOLD_PCT)  # >= is inclusive
        4. compute charge lines (spot line included iff step 3 is true)
        5. only THEN attach the candidate and recompute booking consumed_*
      The flag is locked at consolidation and is NOT re-evaluated at tender.
    input_set: "house waybills in CONSOLIDATED or TENDERED state attached to non-VOID master waybills of the candidate's target booking, excluding the candidate"
    constants:
      SPOT_THRESHOLD_PCT: 85.0

  - name: liability_limit
    trigger: "claim filing (POST /air-freight/claims); result stamped on the Claim"
    algorithm: aggregation
    formula: |
      STANDARD variant (declared_value_surcharge_paid == false):
        limit = min(claimed_amount, round2(SDR_PER_KG * SDR_TO_USD * hwb.gross_weight_kg))
      DECLARED_VALUE variant (declared_value_surcharge_paid == true):
        limit = min(claimed_amount, hwb.declared_value_amount)
    input_set: "the Claim being filed and its HouseWaybill"
    constants:
      SDR_PER_KG: 22          # Montreal Convention 1999 liability limit per kg of actual gross weight
      SDR_TO_USD: 1.35        # fixed conversion rate for this benchmark
    precision: "2 decimal places, round_half_up"
    variants:
      - name: STANDARD
        when: "hwb.declared_value_surcharge_paid == false"
        difference: "weight-based SDR cap; independent of declared_value_amount"
      - name: DECLARED_VALUE
        when: "hwb.declared_value_surcharge_paid == true"
        difference: "value-based cap; identical claim on a surcharge-paid waybill yields a different (usually higher) limit"

  - name: demerit_suspension
    trigger: "every ScreeningRecord resolution to REJECTED"
    algorithm: threshold
    formula: |
      shipper.screening_rejection_count += 1
      if shipper.screening_rejection_count >= DEMERIT_LIMIT and shipper.known_shipper_status == KNOWN:
          shipper.known_shipper_status = SUSPENDED
      # boundary is INCLUSIVE: the 3rd rejection suspends; the 2nd does not
      # counter resets to 0 on reinstatement (SUSPENDED -> KNOWN)
    input_set: "the Shipper owning the rejected waybill; cumulative over all of the shipper's waybills"
    constants:
      DEMERIT_LIMIT: 3
    precision: "integer counter, exact"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role is permitted for this operation; on POST /customs-entries/{id}/transition the permitted role depends on target_status (HANDED_OFF/PREPARING: ForwarderOps; FILED/RELEASED/REJECTED: CustomsBroker)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Resource IDs in the path and referenced body ids exist, validated left-to-right (path segments before body references)"
    error_id: "ERR_SHIPPER_NOT_FOUND | ERR_FLIGHT_BOOKING_NOT_FOUND | ERR_MASTER_WAYBILL_NOT_FOUND | ERR_HOUSE_WAYBILL_NOT_FOUND | ERR_SCREENING_RECORD_NOT_FOUND | ERR_CUSTOMS_ENTRY_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4
    category: state
    check: "Optimistic concurrency: expected_master_waybill_version equals the master waybill's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /air-freight/master-waybills/{id}/house-waybills"

  - priority: 5
    category: state
    check: "Target resource is in a legal from-state for the requested transition (incl. ERR_HWB_NOT_CLEARED for consolidation/customs-handoff, ERR_MAWB_NOT_OPEN_FOR_CONSOLIDATION, ERR_BOOKING_NOT_OPEN, ERR_HWB_NOT_DELIVERED, ERR_MEASURED_VOLUME_MISSING, ERR_NO_CONSOLIDATED_HOUSE_WAYBILLS, else generic ERR_INVALID_STATE)"
    error_id: "ERR_HWB_NOT_CLEARED | ERR_MAWB_NOT_OPEN_FOR_CONSOLIDATION | ERR_BOOKING_NOT_OPEN | ERR_HWB_NOT_DELIVERED | ERR_MEASURED_VOLUME_MISSING | ERR_NO_CONSOLIDATED_HOUSE_WAYBILLS | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition and consolidation endpoints"

  - priority: 6
    category: business_safety
    check: "Dangerous-goods compliance: a dg_flag house waybill requires Shipper.known_shipper_status == KNOWN at submit AND re-checked at consolidation"
    error_id: ERR_SHIPPER_NOT_KNOWN
    http_status: 403
    applies_to: "POST /air-freight/house-waybills/{id}/submit; POST /air-freight/master-waybills/{id}/house-waybills"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the resolving ComplianceOfficer's X-User-ID must differ from the waybill's submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /air-freight/screening-records/{id}/resolve"

  - priority: 8
    category: business_constraint
    check: "Structural uniqueness and aggregate guards: hwb_number / mawb_number unique; account_code unique; tender-window 30-minute buffer vs other TENDERED master waybills on the same booking; rate-agreement half-open [valid_from, valid_to) non-overlap per (shipper, lane); tender requires >= 1 consolidated waybill; close requires no open claims; filing requires no other open claim on the same waybill"
    error_id: "ERR_DUPLICATE_WAYBILL_NUMBER | ERR_TENDER_WINDOW_CONFLICT | ERR_RATE_AGREEMENT_OVERLAP | ERR_NO_CONSOLIDATED_HOUSE_WAYBILLS | ERR_OPEN_CLAIMS_EXIST | ERR_DUPLICATE_OPEN_CLAIM | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "create/tender/close/claim-filing endpoints"

  - priority: 9
    category: business_referential
    check: "Lane consistency: house waybill origin_code/destination_code must equal the target booking's origin_code/destination_code"
    error_id: ERR_LANE_MISMATCH
    http_status: 422
    applies_to: "POST /air-freight/master-waybills/{id}/house-waybills"

  - priority: 10
    category: business_temporal
    check: "An active RateAgreement exists for (shipper, lane) with valid_from_utc <= logical clock < valid_to_utc; claim filed within its window: DAMAGE/SHORTAGE <= delivered_at_utc + 14 days, DELAY/LOSS <= delivered_at_utc + 21 days (filing at exactly the deadline is allowed)"
    error_id: "ERR_NO_ACTIVE_RATE_AGREEMENT | ERR_CLAIM_FILING_DEADLINE_PASSED"
    http_status: 422
    applies_to: "POST /air-freight/master-waybills/{id}/house-waybills; POST /air-freight/claims"

  - priority: 11
    category: business_fiscal
    check: "Capacity and money caps: booking consumed + candidate <= booked (weight and volume) at consolidation, and re-checked with FINAL weights at tender; claim approved/counter amounts <= liability_limit_amount"
    error_id: "ERR_CAPACITY_EXCEEDED | ERR_AMOUNT_EXCEEDS_LIABILITY"
    http_status: 422
    applies_to: "POST /air-freight/master-waybills/{id}/house-waybills; POST /air-freight/master-waybills/{id}/tender; POST /air-freight/claims/{id}/resolve-review"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; outside the business prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z (fixed startup default; never wall-clock). Setting the clock re-evaluates time-driven transitions (booking cutoff auto-close) eagerly."
    roles: &all_roles [ForwarderOps, CapacityPlanner, ComplianceOfficer, CustomsBroker, PricingManager, ClaimsAdjuster]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Advance logical clock; auto-transition OPEN bookings with cutoff_utc <= new time to CUTOFF_CLOSED"]

  # --- Shipper ---
  - method: POST
    path: "/air-freight/shippers"
    description: "Register a shipper account (starts UNVERIFIED)"
    roles: [ForwarderOps]
    code: 201
    input: [name, account_code]
    output: Shipper
    side_effects: ["known_shipper_status := UNVERIFIED", "screening_rejection_count := 0"]

  - method: GET
    path: "/air-freight/shippers/{id}"
    description: "Get a shipper"
    roles: *all_roles
    code: 200
    input: []
    output: Shipper
    side_effects: []

  - method: POST
    path: "/air-freight/shippers/{id}/verify-known-shipper"
    description: "Verify an UNVERIFIED shipper as KNOWN, or reinstate a SUSPENDED shipper (resets demerit count)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Shipper
    side_effects: ["known_shipper_status := KNOWN; screening_rejection_count := 0 when reinstating from SUSPENDED"]

  - method: GET
    path: "/air-freight/shippers/{id}/rate-agreements"
    description: "List rate agreements of a shipper (FK reverse lookup)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "RateAgreement[]"
    side_effects: []

  # --- RateAgreement ---
  - method: POST
    path: "/air-freight/rate-agreements"
    description: "File a rate agreement for a shipper+lane; rejected when its half-open [valid_from, valid_to) window overlaps an existing agreement for the same shipper+lane (touching windows where existing.valid_to == new.valid_from are allowed)"
    roles: [PricingManager]
    code: 201
    input: [shipper_id, origin_code, destination_code, weight_breaks, min_charge_amount, fuel_surcharge_pct, security_fee_amount, "spot_surcharge_pct?", valid_from_utc, valid_to_utc]
    output: RateAgreement
    side_effects: ["Overlap validated per ERR_RATE_AGREEMENT_OVERLAP"]

  # --- FlightBooking ---
  - method: POST
    path: "/air-freight/flight-bookings"
    description: "Procure capacity from an airline (booked allotment on one flight)"
    roles: [CapacityPlanner]
    code: 201
    input: [airline_code, flight_number, origin_code, destination_code, scheduled_departure_utc, cutoff_utc, booked_weight_kg, booked_volume_m3]
    output: FlightBooking
    side_effects: ["status := OPEN", "consumed_* := 0", "utilization_pct := 0"]

  - method: GET
    path: "/air-freight/flight-bookings/{id}"
    description: "Get a flight booking (lazily applies cutoff auto-close against the logical clock before responding)"
    roles: *all_roles
    code: 200
    input: []
    output: FlightBooking
    side_effects: []

  - method: POST
    path: "/air-freight/flight-bookings/{id}/cancel"
    description: "Cancel a booking (airline cancellation); cascades MAWB void -> HWB detach -> capacity recompute"
    roles: [CapacityPlanner]
    code: 200
    input: []
    output: FlightBooking
    side_effects: ["MAWBs in DRAFT/OPEN_FOR_CONSOLIDATION/TENDERED -> VOID; attached HWBs in CONSOLIDATED/TENDERED -> CLEARED detached and zeroed; booking consumed_* recomputed"]

  - method: GET
    path: "/air-freight/flight-bookings/{id}/master-waybills"
    description: "List master waybills of a booking (FK reverse lookup)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "MasterWaybill[]"
    side_effects: []

  # --- MasterWaybill ---
  - method: POST
    path: "/air-freight/master-waybills"
    description: "Create a master waybill (DRAFT) against a booking"
    roles: [CapacityPlanner]
    code: 201
    input: [booking_id, mawb_number]
    output: MasterWaybill
    side_effects: ["status := DRAFT", "totals := 0"]

  - method: GET
    path: "/air-freight/master-waybills/{id}"
    description: "Get a master waybill"
    roles: *all_roles
    code: 200
    input: []
    output: MasterWaybill
    side_effects: []

  - method: POST
    path: "/air-freight/master-waybills/{id}/open"
    description: "Open a DRAFT master waybill for consolidation"
    roles: [CapacityPlanner]
    code: 200
    input: []
    output: MasterWaybill
    side_effects: ["status -> OPEN_FOR_CONSOLIDATION"]

  - method: POST
    path: "/air-freight/master-waybills/{id}/house-waybills"
    description: "Consolidate a CLEARED house waybill into this master waybill (OCC-guarded; rates the waybill QUOTED; consumes booking capacity)"
    roles: [ForwarderOps]
    code: 200
    input: [hwb_id, expected_master_waybill_version]
    output: HouseWaybill
    side_effects: ["HWB -> CONSOLIDATED with QUOTED rating and charge lines", "MasterWaybill totals recomputed; increments MasterWaybill.version by 1", "booking consumed_* recomputed", "spot_surcharge_applied locked from pre-assignment snapshot"]

  - method: DELETE
    path: "/air-freight/master-waybills/{id}/house-waybills/{houseWaybillId}"
    description: "Remove a CONSOLIDATED house waybill from a master waybill (compensating action of consolidation)"
    roles: [ForwarderOps]
    code: 200
    input: []
    output: HouseWaybill
    side_effects: ["HWB -> CLEARED detached and zeroed", "MasterWaybill totals recomputed; increments MasterWaybill.version by 1", "booking consumed_* recomputed"]

  - method: POST
    path: "/air-freight/master-waybills/{id}/tender"
    description: "Tender the consolidation to the airline: requires measured volumes, reserves the tender window with a 30-minute buffer, re-rates all attached waybills FINAL, re-checks capacity"
    roles: [CapacityPlanner]
    code: 200
    input: [tender_window_start_utc, tender_window_end_utc]
    output: MasterWaybill
    side_effects: ["status -> TENDERED; attached HWBs CONSOLIDATED -> TENDERED with FINAL re-rate", "booking consumed_* recomputed with FINAL weights"]

  - method: POST
    path: "/air-freight/master-waybills/{id}/void"
    description: "Void a DRAFT or OPEN_FOR_CONSOLIDATION master waybill; detaches consolidated waybills"
    roles: [CapacityPlanner]
    code: 200
    input: []
    output: MasterWaybill
    side_effects: ["status -> VOID; attached HWBs -> CLEARED detached and zeroed; totals zeroed; booking consumed_* recomputed"]

  - method: POST
    path: "/air-freight/master-waybills/{id}/close"
    description: "Close a DELIVERED master waybill; blocked while any claim on its waybills is open"
    roles: [CapacityPlanner]
    code: 200
    input: []
    output: MasterWaybill
    side_effects: ["status -> CLOSED"]

  - method: POST
    path: "/air-freight/master-waybills/{id}/milestone-events"
    description: "Record a transit milestone. Rank rule: DEPARTED=1 requires TENDERED, ARRIVED=2 requires IN_TRANSIT, DELIVERED=3 requires ARRIVED; an event whose rank != current rank + 1 is recorded with out_of_order=true and causes no transition. EXCEPTION events never transition and require exception_code != NONE (non-EXCEPTION events require NONE). Rejected on CLOSED/VOID waybills."
    roles: [ForwarderOps]
    code: 201
    input: [event_code, event_time_utc, "exception_code?", "note?"]
    output: MilestoneEvent
    side_effects: ["On in-order rank match: MAWB transition per state machine; bubble-up to attached HWBs and to booking auto-DEPARTED"]

  - method: GET
    path: "/air-freight/master-waybills/{id}/milestone-events"
    description: "List milestone events of a master waybill, ordered by created_at ascending"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "MilestoneEvent[]"
    side_effects: []

  # --- HouseWaybill ---
  - method: POST
    path: "/air-freight/house-waybills"
    description: "Issue a house waybill for a shipper (DRAFT)"
    roles: [ForwarderOps]
    code: 201
    input: [shipper_id, hwb_number, origin_code, destination_code, pieces, gross_weight_kg, declared_volume_m3, "dg_flag?", "declared_value_amount?", "declared_value_surcharge_paid?"]
    output: HouseWaybill
    side_effects: ["status := DRAFT; computed charge fields := 0; weight_basis := UNRATED"]

  - method: GET
    path: "/air-freight/house-waybills"
    description: "List house waybills with optional filters (FK reverse lookup for shipper_id and mawb_id)"
    roles: *all_roles
    code: 200
    input: ["shipper_id?", "mawb_id?", "status?", "rate_agreement_id?", "limit?", "offset?"]
    output: "HouseWaybill[]"
    side_effects: []

  - method: GET
    path: "/air-freight/house-waybills/{id}"
    description: "Get a house waybill"
    roles: *all_roles
    code: 200
    input: []
    output: HouseWaybill
    side_effects: []

  - method: POST
    path: "/air-freight/house-waybills/{id}/submit"
    description: "Submit a DRAFT waybill to security/DG screening; auto-creates the required ScreeningRecords"
    roles: [ForwarderOps]
    code: 200
    input: []
    output: HouseWaybill
    side_effects: ["status -> SCREENING; submitted_by_user_id stamped; ScreeningRecord(SECURITY) created first, then ScreeningRecord(DANGEROUS_GOODS) iff dg_flag (strictly increasing created_at within one submit)"]

  - method: POST
    path: "/air-freight/house-waybills/{id}/recall"
    description: "Recall a waybill from SCREENING or SCREENING_REJECTED back to DRAFT for correction (records retained for audit)"
    roles: [ForwarderOps]
    code: 200
    input: []
    output: HouseWaybill
    side_effects: ["status -> DRAFT"]

  - method: POST
    path: "/air-freight/house-waybills/{id}/cancel"
    description: "Cancel a non-consolidated waybill"
    roles: [ForwarderOps]
    code: 200
    input: []
    output: HouseWaybill
    side_effects: ["status -> CANCELLED"]

  - method: POST
    path: "/air-freight/house-waybills/{id}/measure"
    description: "Record the warehouse-measured volume (m3); only while CONSOLIDATED, before tender"
    roles: [ForwarderOps]
    code: 200
    input: [measured_volume_m3]
    output: HouseWaybill
    side_effects: ["measured_volume_m3 set; effective_volume_m3 recomputed"]

  - method: GET
    path: "/air-freight/house-waybills/{id}/screening-records"
    description: "List screening records of a waybill (FK reverse lookup), ordered by created_at ascending with creation sequence as tie-break (SECURITY before DANGEROUS_GOODS within one submit)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "ScreeningRecord[]"
    side_effects: []

  - method: GET
    path: "/air-freight/house-waybills/{id}/customs-entries"
    description: "List customs entries of a waybill (FK reverse lookup)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "CustomsEntry[]"
    side_effects: []

  - method: GET
    path: "/air-freight/house-waybills/{id}/claims"
    description: "List claims of a waybill (FK reverse lookup)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  # --- ScreeningRecord ---
  - method: POST
    path: "/air-freight/screening-records/{id}/resolve"
    description: "Resolve a PENDING screening record CLEARED or REJECTED; resolver must differ from the submitting user (segregation of duties)"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "rejection_reason?"]
    output: ScreeningRecord
    side_effects: ["result := outcome; resolved_by_user_id stamped", "waybill bubble-up: SCREENING -> CLEARED when all required latest records CLEARED; SCREENING -> SCREENING_REJECTED on any REJECTED", "on REJECTED: shipper demerit cascade (count += 1; auto-suspend at >= 3)"]

  # --- CustomsEntry ---
  - method: POST
    path: "/air-freight/house-waybills/{id}/customs-entries"
    description: "Open a customs entry for a waybill (PREPARING); waybill must not be CANCELLED"
    roles: [ForwarderOps]
    code: 201
    input: [entry_type, "broker_reference?"]
    output: CustomsEntry
    side_effects: ["status := PREPARING"]

  - method: POST
    path: "/air-freight/customs-entries/{id}/transition"
    description: "Advance a customs entry. Role map per target_status: HANDED_OFF and PREPARING (rework) require ForwarderOps; FILED, RELEASED, REJECTED require CustomsBroker"
    roles: [ForwarderOps, CustomsBroker]
    code: 200
    input: [target_status, "broker_reference?", "rejection_reason?"]
    output: CustomsEntry
    side_effects: ["state transition per CustomsEntry state machine; broker_reference/rejection_reason recorded when supplied"]

  # --- Claim ---
  - method: POST
    path: "/air-freight/claims"
    description: "File a cargo claim against a DELIVERED waybill; stamps liability_basis and liability_limit_amount; enforces filing window and one-open-claim-per-waybill"
    roles: [ForwarderOps]
    code: 201
    input: [hwb_id, claim_type, claimed_amount]
    output: Claim
    side_effects: ["liability variant selected from declared_value_surcharge_paid; liability_limit_amount computed and stamped", "status := FILED"]

  - method: GET
    path: "/air-freight/claims/{id}"
    description: "Get a claim"
    roles: *all_roles
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/air-freight/claims/{id}/start-review"
    description: "Move a FILED claim into review"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/air-freight/claims/{id}/resolve-review"
    description: "Adjuster decision: APPROVED (approved_amount required, <= min(claimed, limit)), DENIED, or COUNTERED (counter_amount required, <= limit)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [outcome, "approved_amount?", "counter_amount?", "reason?"]
    output: Claim
    side_effects: ["status transition per outcome; approved_amount or counter_amount stamped"]

  - method: POST
    path: "/air-freight/claims/{id}/rebut"
    description: "Claimant (via forwarder ops) rebuts a counteroffer; claim returns to UNDER_REVIEW"
    roles: [ForwarderOps]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> UNDER_REVIEW; review_round_count += 1"]

  - method: POST
    path: "/air-freight/claims/{id}/accept-counter"
    description: "Claimant (via forwarder ops) accepts the counteroffer; settles at counter_amount"
    roles: [ForwarderOps]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> SETTLED; approved_amount := counter_amount"]

  - method: POST
    path: "/air-freight/claims/{id}/settle"
    description: "Settle an APPROVED claim at its approved_amount"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> SETTLED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, non-positive quantity, window end <= start, EXCEPTION event without exception_code, or other malformed input" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not permitted for this operation (incl. per-target role map on customs transitions)" }
  - { id: ERR_SHIPPER_NOT_KNOWN, http: 403, condition: "Dangerous-goods waybill submitted or consolidated while the shipper's known_shipper_status != KNOWN" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Screening resolver X-User-ID equals the waybill's submitted_by_user_id" }
  - { id: ERR_SHIPPER_NOT_FOUND, http: 404, condition: "Shipper id does not exist" }
  - { id: ERR_FLIGHT_BOOKING_NOT_FOUND, http: 404, condition: "Flight booking id does not exist" }
  - { id: ERR_MASTER_WAYBILL_NOT_FOUND, http: 404, condition: "Master waybill id does not exist" }
  - { id: ERR_HOUSE_WAYBILL_NOT_FOUND, http: 404, condition: "House waybill id does not exist" }
  - { id: ERR_SCREENING_RECORD_NOT_FOUND, http: 404, condition: "Screening record id does not exist" }
  - { id: ERR_CUSTOMS_ENTRY_NOT_FOUND, http: 404, condition: "Customs entry id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id does not exist" }
  - { id: ERR_DUPLICATE_WAYBILL_NUMBER, http: 409, condition: "hwb_number or mawb_number already exists" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic illegal from-state for the requested transition (incl. terminal-state lockdown and out-of-state milestone)" }
  - { id: ERR_HWB_NOT_CLEARED, http: 409, condition: "Operation requires the house waybill to be CLEARED-or-later (consolidation) or past screening (customs handoff)" }
  - { id: ERR_MAWB_NOT_OPEN_FOR_CONSOLIDATION, http: 409, condition: "Consolidation target master waybill is not OPEN_FOR_CONSOLIDATION" }
  - { id: ERR_BOOKING_NOT_OPEN, http: 409, condition: "Operation requires the flight booking to be OPEN (or OPEN/CUTOFF_CLOSED for tender)" }
  - { id: ERR_HWB_NOT_DELIVERED, http: 409, condition: "Claim filing requires the house waybill to be DELIVERED" }
  - { id: ERR_NO_CONSOLIDATED_HOUSE_WAYBILLS, http: 409, condition: "Tender requires at least one attached CONSOLIDATED house waybill" }
  - { id: ERR_MEASURED_VOLUME_MISSING, http: 409, condition: "Tender requires every attached CONSOLIDATED waybill to have measured_volume_m3 set" }
  - { id: ERR_OPEN_CLAIMS_EXIST, http: 409, condition: "Master waybill close blocked by a claim in FILED, UNDER_REVIEW, COUNTERED, or APPROVED on an attached waybill" }
  - { id: ERR_DUPLICATE_OPEN_CLAIM, http: 409, condition: "Another claim on the same waybill is in FILED, UNDER_REVIEW, COUNTERED, or APPROVED" }
  - { id: ERR_TENDER_WINDOW_CONFLICT, http: 409, condition: "Tender window violates the 30-minute buffer against another TENDERED master waybill on the same booking" }
  - { id: ERR_RATE_AGREEMENT_OVERLAP, http: 409, condition: "New agreement's half-open [valid_from_utc, valid_to_utc) window overlaps an existing agreement for the same shipper and lane" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_master_waybill_version does not match the master waybill's current version (OCC)" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Booking consumed + candidate chargeable weight (or effective volume) would exceed the booked allotment, at consolidation or at FINAL re-check on tender" }
  - { id: ERR_LANE_MISMATCH, http: 422, condition: "House waybill origin/destination do not equal the booking's lane" }
  - { id: ERR_NO_ACTIVE_RATE_AGREEMENT, http: 422, condition: "No rate agreement for (shipper, lane) with valid_from_utc <= logical clock < valid_to_utc at rating time" }
  - { id: ERR_CLAIM_FILING_DEADLINE_PASSED, http: 422, condition: "Claim filed after its window: 14 days (DAMAGE/SHORTAGE) or 21 days (DELAY/LOSS) from delivered_at_utc" }
  - { id: ERR_AMOUNT_EXCEEDS_LIABILITY, http: 422, condition: "approved_amount or counter_amount exceeds min(claimed_amount, liability_limit_amount)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ForwarderOps
    description: "Forwarder operations agent: issues house waybills, consolidates, records milestones, hands off customs documents, files claims on behalf of shippers"
    identity: "opaque"
    exclusive_operations:
      - "POST /air-freight/shippers"
      - "POST /air-freight/house-waybills and submit/recall/cancel/measure actions"
      - "POST/DELETE /air-freight/master-waybills/{id}/house-waybills (consolidate/deconsolidate)"
      - "POST /air-freight/master-waybills/{id}/milestone-events"
      - "POST /air-freight/house-waybills/{id}/customs-entries"
      - "Customs transitions HANDED_OFF and PREPARING (rework)"
      - "POST /air-freight/claims; rebut; accept-counter"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: CapacityPlanner
    description: "Procures airline capacity and runs master-waybill consolidation lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /air-freight/flight-bookings; cancel"
      - "POST /air-freight/master-waybills; open; tender; void; close"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Security/DG screening authority and known-shipper verifier; must never screen a waybill they submitted"
    identity: "opaque"
    exclusive_operations:
      - "POST /air-freight/shippers/{id}/verify-known-shipper"
      - "POST /air-freight/screening-records/{id}/resolve"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: CustomsBroker
    description: "Licensed broker: files entries with customs and reports release/rejection"
    identity: "opaque"
    exclusive_operations:
      - "Customs transitions FILED, RELEASED, REJECTED"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: PricingManager
    description: "Maintains customer rate agreements"
    identity: "opaque"
    exclusive_operations:
      - "POST /air-freight/rate-agreements"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: ClaimsAdjuster
    description: "Reviews and settles cargo claims"
    identity: "opaque"
    exclusive_operations:
      - "POST /air-freight/claims/{id}/start-review; resolve-review; settle"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
