            - { call: "POST /school/families/${fam}/students", payload: { full_name: "K2", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { st2: $.data.id } }
            - { call: "POST /school/sections/${sec}/enrollments", payload: { student_id: "${st1}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "GET /school/sections/${sec}", payload: {}, as: SchoolAdmin, captures: { sv: $.data.version } }
            - { call: "POST /school/sections/${sec}/enrollments", payload: { student_id: "${st2}", expected_section_version: "${sv}" }, as: SchoolAdmin }
          trigger:
            - { call: "POST /school/families/${fam}/invoices", payload: { school_year_id: "${y_id}", expected_family_version: "${fam_v}" }, as: SchoolAdmin, captures: { inv: $.data.id, gross: $.data.gross_cents } }
          assert:
            - "line rank0 == round_half_up(72501 * 1.00) = 72501 -> round_half_up(72501 * 0.925) = round_half_up(67063.425) = 67063"
            - "line rank1 == round_half_up(72501 * 0.90) = round_half_up(65250.9) = 65251 -> round_half_up(65251 * 0.925) = round_half_up(60357.175) = 60357"
            - "gross == 127420 (67063 + 60357 — sum of pre-rounded lines); the sum-then-round alternative 127421 MUST NOT appear"

      - name: early_bird_deadline_strict_boundary
        claim_type: constants_applied
        grounds: [calculations.enrollment_net_tuition, entities.SchoolYear.fields.early_bird_deadline]
        distinguishing_aspect: "The early-bird test is strict <: rank0 enrolled one second before the deadline yields 67063 (0.925 factor applied); rank1 enrolled exactly AT the deadline yields 65250 — the raw after_sibling with no factor, where the same rank one second earlier would have been 60356."
