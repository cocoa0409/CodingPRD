            - "the first POST /transfer-orders returns 409 with error.code == ERR_DONEE_CERTIFICATION_INVALID — 2026-07-31 is one day before the logical clock date 2026-08-01, and the comparison is >="
            - "after the refusal GET /transfer-orders?asset_id=${a1} returns total_count 0, ScreeningRequest.${r_np}.status is still APPROVED and SurplusAsset.${a1}.version is unchanged"
