          assert:
            - "err == ERR_ESCORT_REQUIREMENT_UNMET (business_safety priority 8 wins over business_fiscal priority 11)"
            - "the credit failure was also armed: provisional 475740 > 400000 - 0, so a wrong ordering would surface ERR_CREDIT_LIMIT_EXCEEDED instead"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: escort_threshold_at_exactly_144_width
        grounds:
          - calculations.required_escort_positions
          - entities.Load.fields.required_escort_positions
        distinguishing_aspect: |
          Boundary metric width_in on POST plan: width 144 exactly triggers the REAR
          escort requirement (>= semantics) while width 143 on an otherwise identical
          load requires none - one inch across the threshold flips the computed set.
        test_recipe:
          setup:
            - "Two loads, both 40000 lbs, 50x400 in height/length, FLATBED; widths 144 and 143 respectively"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Borderline Beams", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Beam A", gross_weight_lbs: 40000, width_in: 144, height_in: 50, length_in: 400, origin: "Tracy CA", destination: "Modesto CA" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_a: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Beam B", gross_weight_lbs: 40000, width_in: 143, height_in: 50, length_in: 400, origin: "Tracy CA", destination: "Modesto CA" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_b: "$.data.id" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_a}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "L. Zhu", driver_oversize_endorsed: true }, as: Dispatcher, captures: { esc_a: "$.data.required_escort_positions" } }
            - { call: "POST /heavy-haul/loads/${load_b}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "L. Zhu", driver_oversize_endorsed: true }, as: Dispatcher, captures: { esc_b: "$.data.required_escort_positions" } }
          assert:
            - "esc_a == [REAR] (width_in == 144 meets the >= 144 threshold exactly)"
            - "esc_b == [] (width_in == 143 falls one inch below)"
            - "overall heights are identical (50 + 60 = 110 < 192), isolating width as the only differing input"

      - name: standby_free_minutes_exactly_120
        grounds:
          - calculations.standby_billing
          - entities.DelayEvent.fields.billable_minutes
          - entities.DelayEvent.fields.standby_amount_cents
        distinguishing_aspect: |
          Boundary metric duration_minutes on POST delay-events (different metric and
          endpoint than the width threshold): a 120-minute CUSTOMER_DELAY bills
          exactly 0 (free allowance is inclusive), while 121 minutes bills 1 minute
          at 292 cents (round_half_up(17500/60)).
        test_recipe:
          setup:
            - "STANDARD load 40000 lbs, 100x50x400 in, states [OR], IN_TRANSIT (no permits or escorts required; cranes + securement satisfied the gate)"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Pinpoint Paper", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Paper rolls", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "Salem OR", destination: "Albany OR" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "M. Ortiz", driver_oversize_endorsed: false }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["OR"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "STRAPS", tiedown_count: 2, wll_per_tiedown_lbs: 10000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /heavy-haul/loads/${load_id}/depart", payload: {}, as: Driver }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/delay-events", payload: { kind: "CUSTOMER_DELAY", started_at: "2026-08-12T11:00:00Z", ended_at: "2026-08-12T13:00:00Z" }, as: Driver, captures: { bill_a: "$.data.billable_minutes", amt_a: "$.data.standby_amount_cents" } }
            - { call: "POST /heavy-haul/loads/${load_id}/delay-events", payload: { kind: "CUSTOMER_DELAY", started_at: "2026-08-12T14:00:00Z", ended_at: "2026-08-12T16:01:00Z" }, as: Driver, captures: { bill_b: "$.data.billable_minutes", amt_b: "$.data.standby_amount_cents" } }
          assert:
            - "bill_a == 0 and amt_a == 0 (exactly 120 minutes consumes the free allowance; >= vs > pinned)"
            - "bill_b == 1 and amt_b == 292 (round_half_up(1 x 17500/60) = round_half_up(291.666...) = 292)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: clearance_gate_requires_all_permits_granted
        grounds:
          - state_machines.Load.SURVEYED_to_CLEARED
          - state_machines.Permit.FILED_to_GRANTED
        distinguishing_aspect: |
          Entity pair (Load, Permit): with the CA OVERWEIGHT permit merely FILED,
          completing escorts, cranes, and securement leaves the load SURVEYED; only
          the permit's FILED -> GRANTED transition (a mutation on Permit, not Load)
          refires the readiness gate and moves the Load to CLEARED.
        test_recipe:
          setup:
            - "Load 96000 lbs, 150x100x400 in, states [CA]; OVERSIZE permit GRANTED; OVERWEIGHT permit stuck at FILED; escort + cranes + securement all satisfied"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Mission Bell", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Switchgear", gross_weight_lbs: 96000, width_in: 150, height_in: 100, length_in: 400, origin: "Gilroy CA", destination: "Salinas CA" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "N. Wade", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 500, states_crossed: ["CA"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 120000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERSIZE", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p_os: "$.data.id" } }
            - { call: "POST /heavy-haul/permits/${p_os}/file", payload: {}, as: PermitClerk }
            - { call: "POST /heavy-haul/permits/${p_os}/grant", payload: { travel_window_start: "2026-08-10T00:00:00Z", travel_window_end: "2026-08-20T00:00:00Z" }, as: StateAuthority }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv4: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERWEIGHT", expected_load_version: "${lv4}" }, as: PermitClerk, captures: { p_ow: "$.data.id" } }
            - { call: "POST /heavy-haul/permits/${p_ow}/file", payload: {}, as: PermitClerk }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv5: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Peninsula Pilots", position: "REAR", scheduled_start: "2026-08-12T08:00:00Z", scheduled_end: "2026-08-12T12:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv5}" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "CHAINS", tiedown_count: 4, wll_per_tiedown_lbs: 15000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { st_pre: "$.data.status" } }
          trigger:
            - { call: "POST /heavy-haul/permits/${p_ow}/grant", payload: { travel_window_start: "2026-08-10T00:00:00Z", travel_window_end: "2026-08-20T00:00:00Z" }, as: StateAuthority, captures: { ow_status: "$.data.status" } }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { st_post: "$.data.status" } }
          assert:
            - "st_pre == SURVEYED (escort, cranes, and securement all complete, but the gate holds: OVERWEIGHT permit not GRANTED)"
            - "ow_status == GRANTED (the Permit-side mutation is the trigger)"
            - "st_post == CLEARED (gate refired by the grant, not by any Load-endpoint call)"

      - name: invoice_creation_requires_load_delivered
        grounds:
          - state_machines.Load.IN_TRANSIT_to_DELIVERED
          - state_machines.Invoice.transitions
          - errors[ERR_LOAD_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair (Invoice, Load) - distinct from (Load, Permit): invoice
          creation is gated on the load's DELIVERED state; the same call fails with
          ERR_LOAD_INVALID_STATE while IN_TRANSIT and succeeds immediately after the
          Load-side arrive transition, with totals computed from the final variant.
        test_recipe:
          setup:
            - "STANDARD load 40000 lbs, 100x50x400 in, states [OR], 100 route miles, IN_TRANSIT (no permits/escorts needed)"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Rogue Valley Lumber", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "LVL bunks", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "Medford OR", destination: "Grants Pass OR" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "O. Kent", driver_oversize_endorsed: false }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["OR"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "STRAPS", tiedown_count: 2, wll_per_tiedown_lbs: 10000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /heavy-haul/loads/${load_id}/depart", payload: {}, as: Driver }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/invoices", payload: {}, as: BillingClerk, captures: { err: "$.data.error_id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/arrive", payload: {}, as: Driver }
            - { call: "POST /heavy-haul/loads/${load_id}/invoices", payload: {}, as: BillingClerk, captures: { inv_status: "$.data.status", inv_total: "$.data.total_cents" } }
          assert:
            - "err == ERR_LOAD_INVALID_STATE (Invoice x Load pair: IN_TRANSIT blocks billing)"
            - "inv_status == ISSUED after arrive flips the load to DELIVERED"
            - "inv_total == 37800 (linehaul 35000; subtotal 35000; fuel 8% = 2800)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: escort_provider_half_open_adjacency
        grounds:
          - errors[ERR_ESCORT_WINDOW_OVERLAP]
          - entities.EscortBooking.fields.provider_name
          - calculations.invoice_total
        distinguishing_aspect: |
          Interval semantics: strict half-open [start, end) on the pilot-car
          provider calendar - a booking starting exactly when another ends
          (10:00 == 10:00 boundary) is ACCEPTED, while a 09:30-10:30 booking that
          genuinely intersects is REJECTED; the calendar resource is provider_name.
        test_recipe:
          setup:
            - "Load 96000 lbs, width 150, states [CA], SURVEYED; provider 'Shared Roads Pilot' calendar is the contested resource"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Overlap Test Co", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Tank", gross_weight_lbs: 96000, width_in: 150, height_in: 100, length_in: 400, origin: "Fresno CA", destination: "Visalia CA" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "P. Yu", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 500, states_crossed: ["CA"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 120000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Shared Roads Pilot", position: "REAR", scheduled_start: "2026-08-12T08:00:00Z", scheduled_end: "2026-08-12T10:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv3}" }, as: Dispatcher, captures: { eb_a: "$.data.id", st_a: "$.data.status" } }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv4: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Shared Roads Pilot", position: "REAR", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T12:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv4}" }, as: Dispatcher, captures: { eb_b: "$.data.id", st_b: "$.data.status" } }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv5: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Shared Roads Pilot", position: "REAR", scheduled_start: "2026-08-12T09:30:00Z", scheduled_end: "2026-08-12T10:30:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv5}" }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "st_a == CONFIRMED (08:00-10:00 occupies the calendar)"
            - "st_b == CONFIRMED (10:00-12:00: new.start == existing.end is adjacency, not overlap, under half-open semantics)"
            - "err == ERR_ESCORT_WINDOW_OVERLAP (09:30-10:30 intersects both CONFIRMED windows)"

      - name: crane_buffered_turnaround_window
        grounds:
          - errors[ERR_CRANE_WINDOW_OVERLAP]
          - entities.CraneAppointment.fields.crane_id
        distinguishing_aspect: |
          Different interval semantics on a different resource: crane_id calendars
          apply a 45-minute turnaround BUFFER on both sides, so a window starting
          exactly 45 minutes after the previous end (10:45 after 08:00-10:00) is
          ACCEPTED while 44 minutes (10:44) is REJECTED - adjacency alone (10:00)
          would also fail here even though escort semantics allow it.
        test_recipe:
          setup:
            - "Load 96000 lbs, width 150, states [CA], SURVEYED; crane resource CRANE-X is the contested resource"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Turnaround Test Co", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Press", gross_weight_lbs: 96000, width_in: 150, height_in: 100, length_in: 400, origin: "Fresno CA", destination: "Madera CA" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "Q. Ames", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 500, states_crossed: ["CA"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 120000 }, as: Dispatcher }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-X", window_start: "2026-08-12T08:00:00Z", window_end: "2026-08-12T10:00:00Z" }, as: Dispatcher, captures: { ca_a: "$.data.id", st_a: "$.data.status" } }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-X", window_start: "2026-08-12T10:45:00Z", window_end: "2026-08-12T12:00:00Z" }, as: Dispatcher, captures: { ca_b: "$.data.id", st_b: "$.data.status" } }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-X", window_start: "2026-08-12T10:44:00Z", window_end: "2026-08-12T12:00:00Z" }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "st_a == SCHEDULED (08:00-10:00 occupies CRANE-X with buffered interval [07:15, 10:45))"
            - "st_b == SCHEDULED (10:45 start lands exactly on the buffer edge: existing.end + 45 min is allowed)"
            - "err == ERR_CRANE_WINDOW_OVERLAP (10:44 is one minute inside the 45-minute turnaround buffer)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: outstanding_balance_issue_void_conservation
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - calculations.credit_availability
          - entities.Customer.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity: money (Customer.outstanding_balance_cents). The
          invariant outstanding == sum(total_cents over ISSUED invoices) must hold
          after every step: issue raises it 0 -> 475740, void returns it to exactly
          0 - a cascade that left drift in either direction violates the invariant.
        test_recipe:
          setup:
            - "Customer credit 10000000; load 96000 lbs, 150x100x400 in, states [CA], 500 miles, EXTENDABLE_DOUBLE_DROP; both permits GRANTED; REAR escort; cranes; securement; DELIVERED with no delays and no fines"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Ledger Test Co", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Lathe", gross_weight_lbs: 96000, width_in: 150, height_in: 100, length_in: 400, origin: "Oxnard CA", destination: "Ventura CA" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "R. Cole", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 500, states_crossed: ["CA"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 120000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERSIZE", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p_os: "$.data.id" } }
            - { call: "POST /heavy-haul/permits/${p_os}/file", payload: {}, as: PermitClerk }
            - { call: "POST /heavy-haul/permits/${p_os}/grant", payload: { travel_window_start: "2026-08-10T00:00:00Z", travel_window_end: "2026-08-20T00:00:00Z" }, as: StateAuthority }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv4: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERWEIGHT", expected_load_version: "${lv4}" }, as: PermitClerk, captures: { p_ow: "$.data.id" } }
            - { call: "POST /heavy-haul/permits/${p_ow}/file", payload: {}, as: PermitClerk }
            - { call: "POST /heavy-haul/permits/${p_ow}/grant", payload: { travel_window_start: "2026-08-10T00:00:00Z", travel_window_end: "2026-08-20T00:00:00Z" }, as: StateAuthority }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv5: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Coast Pilots", position: "REAR", scheduled_start: "2026-08-12T08:00:00Z", scheduled_end: "2026-08-12T12:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv5}" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "CHAINS", tiedown_count: 4, wll_per_tiedown_lbs: 15000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /heavy-haul/loads/${load_id}/depart", payload: {}, as: Driver }
            - { call: "POST /heavy-haul/loads/${load_id}/arrive", payload: {}, as: Driver }
            - { call: "GET /heavy-haul/customers/${cust_id}", as: BillingClerk, captures: { out_before: "$.data.outstanding_balance_cents" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/invoices", payload: {}, as: BillingClerk, captures: { inv_id: "$.data.id", inv_total: "$.data.total_cents" } }
            - { call: "GET /heavy-haul/customers/${cust_id}", as: BillingClerk, captures: { out_mid: "$.data.outstanding_balance_cents" } }
            - { call: "POST /heavy-haul/invoices/${inv_id}/void", payload: {}, as: BillingClerk }
            - { call: "GET /heavy-haul/customers/${cust_id}", as: BillingClerk, captures: { out_after: "$.data.outstanding_balance_cents" } }
          assert:
            - "out_before == 0 (invariant baseline: sum over zero ISSUED invoices)"
            - "inv_total == 475740 (subtotal 440500 = 350000 + 42500 + 48000; fuel 8% = 35240)"
            - "out_mid == 475740 (forward action: outstanding == the single ISSUED total)"
            - "out_after == 0 (compensating action: void returns the conserved quantity exactly to baseline - zero drift)"

      - name: escort_window_book_cancel_conservation
        grounds:
          - state_machines.EscortBooking.CONFIRMED_to_CANCELLED
          - errors[ERR_ESCORT_WINDOW_OVERLAP]
          - entities.EscortBooking.fields.status
        distinguishing_aspect: |
          Conserved quantity: provider calendar occupation (time intervals, not
          money). A create + cancel pair must leave the occupied-window set of
          'Cal Heavy Pilots' unchanged, proven operationally when a third booking
          overlapping the freed window is ACCEPTED (it would be rejected had the
          cancellation left phantom occupation).
        test_recipe:
          setup:
            - "Load 96000 lbs, width 150, states [CA], SURVEYED; provider 'Cal Heavy Pilots' starts with an empty calendar"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Calendar Test Co", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Mixer drum", gross_weight_lbs: 96000, width_in: 150, height_in: 100, length_in: 400, origin: "Modesto CA", destination: "Stockton CA" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "S. Voss", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 500, states_crossed: ["CA"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 120000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Cal Heavy Pilots", position: "REAR", scheduled_start: "2026-08-12T08:00:00Z", scheduled_end: "2026-08-12T12:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv3}" }, as: Dispatcher, captures: { eb1: "$.data.id", st1: "$.data.status" } }
            - { call: "POST /heavy-haul/escort-bookings/${eb1}/cancel", payload: {}, as: Dispatcher, captures: { st1_cancel: "$.data.status" } }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv_after_cancel: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Cal Heavy Pilots", position: "REAR", scheduled_start: "2026-08-12T08:00:00Z", scheduled_end: "2026-08-12T12:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv_after_cancel}" }, as: Dispatcher, captures: { st2: "$.data.status" } }
          assert:
            - "st1 == CONFIRMED (window occupied)"
            - "st1_cancel == CANCELLED (compensating action)"
            - "st2 == CONFIRMED (rebooking the identical window succeeds: occupied set after create+cancel equals the empty baseline - the invariant holds with zero phantom occupation)"
