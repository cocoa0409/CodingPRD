              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
              captures: { fund_d: $.data.id }
            - call: "POST /restricted-funds"
              payload: { org_id: "${org_a}", fund_name: "Anonymous Tutoring Bequest", fund_type: "TEMP_RESTRICTED", principal_cents: 3000000, accumulated_appreciation_cents: 0, historic_dollar_value_cents: 0, restriction_purpose_code: "PURP-TUTORING", restriction_conflict: false, donor_of_record_reachable: true }
