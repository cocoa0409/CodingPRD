            - "Level 3 (encounter re-derivation): x_mag_b == true (the transition's side effect set magnesium_infusion_active on the SEVERE_HYPERTENSION bundle's MAGNESIUM_LOADED step), x_tier_b == \"TIER_IV\", x_121_b == true, x_req_b == 4.0 (the one-to-one required floor, not ACUITY*PHASE), x_assigned_b == 2.0, x_state_b == \"COVERAGE_BREACH\"."
            - "Level 4 (assignment re-pricing in place): ca_x_units_b == 2.0 and ca_x_status_b == \"ACTIVE\" and ca_x_mode_b == \"RATIO_SHARED\" — the debit is re-priced to ACUITY_UNITS[TIER_IV] 4.0 * PHASE_MULTIPLIER[ANTEPARTUM] 0.5 = 2.0, NOT to the shift's capacity_units_effective and NOT to the 4.0 one-to-one requirement, because coverage_mode is still RATIO_SHARED."
            - "Level 4b (shift ledger sync): shift_load_b == 2.8 (2.0 for enc_x plus the untouched 0.8 for enc_sib, up from 1.3) while shift_cap_b == 4.0 — capacity_units_effective does NOT drop to 3.0, because the TIER_IV focus penalty is only re-evaluated on the triggers staff_capacity_units declares and checklist completion is not among them."
            - "Level 5 (unit posture): the GET /obstetric-units/${unit_id}/coverage-report taken right after the magnesium completion returns staffing_posture \"RATIO_STRAINED\", coverage_deficit_units 2.0 (required 4.0 + 0.8 = 4.8 against assigned 2.0 + 0.8 = 2.8) and posture_reason \"DEFICIT_POSITIVE\" — the deficit is under FREEZE_DEFICIT 4.0, so the unit strains rather than freezing, and buffer_b == 75 because turnover_buffer_minutes is re-derived AFTER posture and is 45 only while OPEN."
            - "Ordering sensitivity, forward arm: completing seq-1 ANTIHYPERTENSIVE_GIVEN afterwards yields anti_status == \"COMPLETED\" and anti_min == 10, and it retroactively rewrites the ALREADY-COMPLETED magnesium row's advisory anchor: mag_seq_due_after == \"2026-08-01T07:10:00Z\" (completed_at of the predecessor 06:10 + required_within_minutes 60) where it read null one call earlier, while mag_status_after is still \"COMPLETED\"."
            - "Ordering sensitivity, idempotence arm: the second completion re-fires nothing downstream — ca_x_units_c == 2.0 (unchanged, not double-debited to 4.0), deficit_c == 2.0, posture_c == \"RATIO_STRAINED\", buffer_c == 75 — because the ACTIVATED -> STAGE_1_IN_PROGRESS transition (and thus the magnesium flip) has already been consumed."
            - "Level 6 (posture gates a downstream booking): e_posture == \"ERR_UNIT_POSTURE_BLOCKS_OPERATION\" with HTTP 409 for the PATIENT_REQUEST booking, which needs posture OPEN — and specifically NOT ERR_STALE_UNIT_VERSION, since v_now2 was read after the last write."
            - "Level 6b (the projection carries the cascade's numeric fingerprint): mi_status == \"CAPACITY_HELD\" for the MEDICALLY_INDICATED booking, which is admitted at RATIO_STRAINED, and mi_proj == 795 — expected_labor_minutes 720 plus the turnover buffer 75 frozen at hold time. An implementation whose chain breaks anywhere upstream still reports 45 and freezes 765."
            - "Blast radius is bounded: sib_req == 0.8, sib_assigned == 0.8, sib_state == \"RATIO_COVERED\" — the sibling encounter on the same nurse's shift is not re-tiered, even though its shift's aggregate load moved."

      # ---- layer 3 of 4: dual_variant_calculation ----
      - name: both_declared_variant_pairs_diverge_on_one_dataset_and_the_switch_delta_is_exact
        claim_type: dual_variant_calculation
        grounds: >
          §1.3 declares exactly two calculations carrying a `variants:` field —
          bundle_intervention_timeliness (activation_anchored vs sequence_anchored) and
          quality_measure_rate_set (delivery_cohort vs admission_shadow_cohort) — and
          §1.0 complexity_layers lists dual_variant_calculation. The layer's three obligations
          (both variants produce their expected number on the SAME dataset, the correct variant is
          selected for the authoritative field, and the delta on switch is exact) are already
          discharged in depth elsewhere, so no additional breadth instance is warranted here.
        excluded_because:
          difficulty_instance: dual_variant_calc / hypertension_bundle_activation_anchored_100_vs_sequence_anchored_87_50
          rationale: >
            That §1.8 instance drives one SEVERE_HYPERTENSION activation and reports 100.00 under the
            authoritative activation anchor beside 87.50 under the advisory sequence anchor from the
            identical four checklist rows, and its sibling
            dual_variant_calc / september_snapshot_delivery_cohort_33_3333_vs_admission_shadow_0_0000
            does the same for the rate set on one September cohort. Variant SELECTION is asserted in
            corner:calculations / quality_measure_rate_variants_diverge_on_the_same_september_cohort and
            corner:calculations / bundle_timeliness_diverges_between_the_activation_and_sequence_anchors,
            and the switch delta is asserted where the sequence anchor is rewritten under an
            out-of-order completion in
            corner:cross_cutting_complexity_layers / magnesium_step_completion_cascades_five_levels_from_one_checklist_item_to_a_frozen_induction_projection.
            A fourth pass over the same two formulas would add no discriminating power.

      # ---- layer 4 of 4: rate_threshold_triggers ----
      - name: rolling_d2i_window_walks_both_readiness_ceilings_and_recovers_once_the_window_slides
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers=rate_threshold_triggers
          - calculations[cesarean_readiness_derivation]
          - calculations[cesarean_readiness_derivation].constants.ROLLING_EVENT_WINDOW=3
          - calculations[cesarean_readiness_derivation].constants.READINESS_READY_CEILING=30.00
          - calculations[cesarean_readiness_derivation].constants.READINESS_DEGRADED_CEILING=45.00
          - calculations[cesarean_readiness_derivation].precision
          - calculations[cesarean_readiness_derivation].note
          - endpoints[GET /obstetric-units/{unitId}/readiness-report]
          - endpoints[POST /emergency-cesareans/{eventId}/record-incision]
          - state_machines[EmergencyCesareanEvent].TEAM_MOBILIZED->INCISION_RECORDED
        distinguishing_aspect: |
          cesarean_readiness_derivation is the scaffold's one RATE threshold: not a running total and not
          an instantaneous reading, but a mean over a sliding window of the last ROLLING_EVENT_WINDOW (3)
          MEASURED emergency events, compared against two ceilings that §1.3 declares STRICT. This walks
          one unit through six readings of that rate and pins every declared edge exactly once.
          (a) EMPTY WINDOW: with a current validated drill and an ACTIVE OR_STANDBY shift but zero measured
          events the state is READY and mean_d2i_minutes is null — the note's explicit boundary that an
          empty window is not a failure, and the reading an implementation that seeds the mean at 0 or
          treats "no data" as NOT_READY gets wrong in the opposite direction.
          (b) READY CEILING, EXACT: two events at exactly 30 minutes hold the mean at 30.00, and because
          READINESS_READY_CEILING is strict (> not >=) the unit stays READY. An implementation using >=
          reports DEGRADED here.
          (c) DEGRADED CEILING, EXACT: a third event at 75 minutes lands the mean on 45.00 to the penny
          ((30+30+75)/3), and because READINESS_DEGRADED_CEILING is also strict the unit stops at DEGRADED
          with readiness_reason MEAN_D2I_ABOVE_READY_CEILING instead of falling to NOT_READY.
          (d) WINDOW SIZE, not lifetime average: a fourth event at 31 minutes pushes the oldest reading
          out, and the mean RISES to 45.33 — crossing the degraded ceiling into NOT_READY — even though
          the arithmetic mean of all four measurements is 41.50, which is comfortably DEGRADED. Only an
          implementation that truncates at 3 and re-rounds to 2dp produces 45.33.
          (e) ORDERED BY incision_at, NOT BY ARRIVAL: the fifth call records a BACKDATED incision (20
          minutes, incision_at earlier than every event already in the window). It is a perfectly valid
          measured event, yet it must not enter the window at all, so the mean stays 45.33 and the state
          stays NOT_READY. An implementation that keeps "the last 3 rows I wrote" instead of "the 3 with
          the newest incision_at" computes 42.00 and reports DEGRADED.
          (f) RESET: only when a genuinely newer, fast event (14 minutes, met_target true at the inclusive
          15-minute CATEGORY_1_CRASH target) arrives does the window finally slide the 30-minute readings
          out, dropping the mean to 40.00 and lifting the unit back off NOT_READY to DEGRADED — proving
          the threshold is recoverable rather than latching.
          Every event is CATEGORY_1_CRASH, which §1.2 says BYPASSES the readiness precondition on
          mobilize-team, so the unit's own degrading readiness can never block the next measurement — the
          rate is measured, never gated, by itself.
        test_recipe:
          setup: |
            Clock starts at 2026-08-01T05:45:00Z. One unit "Bellcairn Perinatal Center LDR" with two LDR
            beds that are never assigned (so available_ldr_beds stays 2 and no bed-exhaustion DIVERT can
            appear) and six OR beds OR-01..OR-06, because mobilize-team drives an OR bed to OCCUPIED and
            only record-delivery ever releases it — this run never records a delivery, so each event needs
            its own room. Four staff: an ANESTHESIOLOGIST, an OB_ATTENDING, an or_circulating_qualified
            SURGICAL_TECH and a NEONATAL_RESUSCITATOR. A DECISION_TO_INCISION drill scheduled for 05:50
            with the anesthesiologist, the attending and the tech on the roster is started at 05:50,
            documented at 06:00 with a passing 3-minute interval and validated by the PerinatalSafetyOfficer
            (X-User-ID differs from the documenter, clearing SOD-2), which stamps drill_currency_state
            CURRENT on all three participants. At 06:00 the tech gets an OR_STANDBY shift over
            [06:00, 12:00) and the anesthesiologist and resuscitator get TRIAGE shifts over the same
            window; all three are activated, and the OR_STANDBY activation is what makes or_standby_staffed
            true so the empty-window reading can be READY rather than DEGRADED. Six walk-in encounters
            PRC-BELL-3101..3106 are then admitted (39 weeks, parity 1, all defaults, so each is TIER_I
            ANTEPARTUM at required_coverage_units 0.5 and the deficit peaks at 3.0 = RATIO_STRAINED, which
            still permits admission). All six are created BEFORE any cesarean is declared, because a
            declaration re-derives the encounter to TIER_IV one-to-one at 4.0 required and the unit is in
            DIVERT from the second declaration onward — and DIVERT blocks POST /labor-encounters at
            priority 8.02 but does NOT appear in the validation_priorities of POST /emergency-cesareans,
            /mobilize-team or /record-incision, so the measurement chain runs unimpeded. Five events are
            declared and mobilized at 06:00 (decision_at 06:00 for all five, onto OR-01..OR-05); the sixth
            encounter is left untouched so that its event can be declared later with a LATER decision_at,
            which is how a fast 14-minute measurement is manufactured at a clock that has already moved
            past 07:00. No induction bookings exist anywhere in this instance, so the NOT_READY cascade
            that bumps CONFIRMED ELECTIVE_39_WEEK bookings has nothing to act on and cannot perturb the
            readings.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T05:45:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Bellcairn Perinatal Center LDR", licensed_ldr_beds: 8, licensed_or_rooms: 6, max_daily_induction_bed_minutes: 2880 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
