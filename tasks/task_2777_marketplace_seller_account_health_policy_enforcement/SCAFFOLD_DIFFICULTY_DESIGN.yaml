            - "${err_code} != ERR_ACTION_NOT_APPEALABLE_STATE   # the state was equally invalid and must stay hidden from a stranger"
            - "rightful-owner attempt: 409 and ${err_code_2} == ERR_ACTION_NOT_APPEALABLE_STATE   # UPHELD is locked down for acknowledge"
            - "EnforcementAction.${a1}.state == UPHELD and acknowledged_at == null after both attempts"
            - "EnforcementAction.${a1}.resolution_reason == APPEAL_DENIED"
