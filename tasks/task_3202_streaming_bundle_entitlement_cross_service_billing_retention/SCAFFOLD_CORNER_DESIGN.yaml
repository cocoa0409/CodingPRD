          - errors[ERR_GRACE_WINDOW_CLOSED]
        distinguishing_aspect: "Retry at exactly period_end + 7 days (2026-10-08T00:00:00Z) is rejected (now < deadline required); retry at one second before succeeds — strict boundary."
        test_recipe:
          setup: ["PLATFORM subscription created 2026-09-01; renewal failed at 2026-10-01 (period_end); clock at exactly 2026-10-08T00:00:00Z for first attempt, then stepped BACK is impossible (monotonic), so two separate accounts: account A retried at deadline (rejected), account B retried at 2026-10-07T23:59:59Z — but clock is global and monotonic, so order B first at 2026-10-07T23:59:59 (success), then A at 2026-10-08 (rejected)"]
