# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3196_autonomous_trucking_corridor_operations_terminal_handoff
# 25 instances across the nine §0.5 rules (minimum is 18).
# Every grounds: reference resolves into SCAFFOLD.yaml §1.1–§1.6.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: readiness_score_check_level_vs_corridor_level
        grounds:
          - calculations.corridor_readiness_score
          - calculations.corridor_readiness_score.variants.check_level
          - calculations.corridor_readiness_score.variants.corridor_level
          - validations[priority=14]
          - endpoints.POST_/launch-readiness-checks/{id}/calibrate
        distinguishing_aspect: "Two LaunchReadinessCheck rows on one corridor, each with check_result PASS and calibration_variance_ms 160, contribute per-row scores of 100 while the corridor-level reading over the same two rows is 100.00 — the per-check reading exposes the variance term that the corridor aggregation divides away, so the two variants of corridor_readiness_score report different numbers for identical rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, ledger epoch [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) adopted."
            - "Terminals PHX-WEST and TUS-HUB are OPERATIONAL; carrier AURORA is ACTIVE."
            - "A corridor on the Sun Belt I-10 alignment is in READINESS_REVIEW with both terminals placed."
            - "Two readiness checks exist with check_result PASS and variance 160: a SENSOR_CALIBRATION check driven to CALIBRATION_PASSED, and a ROUTE_VALIDATION check driven to VALIDATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ledger-checkpoints"
              payload: { checkpoint_code: "EPOCH-SEP", epoch_start_at: "2026-09-01T00:00:00Z", epoch_end_at: "2026-10-01T00:00:00Z", hours_per_epoch: 24 }
              as: PlatformAdmin
              captures: { ck_id: $.data.id }
            - call: "POST /api/ledger-checkpoints/${ck_id}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/terminals"
              payload: { terminal_code: "PHX-WEST", terminal_name: "Phoenix West Hub", state_code: "AZ", apron_capacity: 40 }
              as: TerminalManager
              captures: { t_phx: $.data.id }
            - call: "POST /api/terminals"
              payload: { terminal_code: "TUS-HUB", terminal_name: "Tucson Transfer Hub", state_code: "AZ", apron_capacity: 30 }
              as: TerminalManager
              captures: { t_tus: $.data.id }
            - call: "POST /api/terminals/${t_phx}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/terminals/${t_tus}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/carriers"
              payload: { carrier_name: "Aurora Freight Systems", dot_number: "DOT-3196001" }
              as: ComplianceOfficer
              captures: { car_id: $.data.id }
            - call: "POST /api/corridors"
              payload: { corridor_name: "Sun Belt I-10", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", highway_segment_miles: 120, mapped_route: { route_code: "I10-EAST-01", waypoint_count: 14, has_hov_lane: true, requires_tunnel_clearance: false }, weather_profile: "CLEAR_DEFAULT", weather_risk_score: 20 }
              as: CorridorOperationsManager
              captures: { cor_id: $.data.id }
            - call: "POST /api/corridors/${cor_id}/launch-readiness/start"
              payload: {}
              as: CorridorOperationsManager
            - call: "POST /api/corridors/${cor_id}/launch-readiness-checks"
              payload: { check_type: "SENSOR_CALIBRATION", check_result: "PASS", suite_latitude: 60.0, suite_longitude: 12.5, valid_window_days: 180, correlation_key: "CAL-01" }
              as: CorridorOperationsManager
              captures: { chk_cal: $.data.id }
            - call: "POST /api/corridors/${cor_id}/launch-readiness-checks"
              payload: { check_type: "ROUTE_VALIDATION", check_result: "PASS", suite_latitude: 60.0, suite_longitude: 12.5, valid_window_days: 180, correlation_key: "RTE-01" }
              as: CorridorOperationsManager
              captures: { chk_rte: $.data.id }
            - call: "POST /api/launch-readiness-checks/${chk_cal}/calibrate"
              payload: {}
              as: CorridorOperationsManager
            - call: "POST /api/launch-readiness-checks/${chk_rte}/calibrate"
              payload: {}
              as: CorridorOperationsManager
            - call: "GET /api/launch-readiness-checks/${chk_rte}"
              payload: {}
              as: Any
              captures: { chk_rte_v: $.data.version }
            - call: "POST /api/launch-readiness-checks/${chk_rte}/validate"
              payload: { expected_check_version: "${chk_rte_v}" }
              as: CorridorOperationsManager
              captures: { chk_rte_v: $.data.version, rte_score: $.data.check_contribution }
          trigger:
            - call: "GET /api/launch-readiness-checks/${chk_cal}"
              payload: {}
              as: Any
            - call: "GET /api/corridors/${cor_id}"
              payload: {}
              as: Any
          assert:
            - "the SENSOR_CALIBRATION check contribution reading equals 100 — the per-check variant lands above the shared variance cap because its variance exceeds the 150 ms tolerance"
            - "Corridor.${cor_id}.readiness_score == 100.00"
            - "the per-check variant reading (100) and the corridor variant reading (100.00) are produced by different branches of corridor_readiness_score over the same two rows: the cap branch fires per row while the corridor branch divides the summed contributions"
            - "Corridor.${cor_id}.check_pass_count == 2 and Corridor.${cor_id}.check_count == 2"

      - name: run_plan_exposure_per_line_vs_aggregate
        grounds:
          - calculations.run_plan_exposure
          - calculations.run_plan_exposure.variants.per_line_rounded
          - calculations.run_plan_exposure.variants.aggregate_rounded
          - entities.RunPlan.fields.run_plan_exposure_cents
          - validations[priority=28]
        distinguishing_aspect: "For one run plan priced at posted_per_mile_cents 225 with trailer_count 2 on a MEDIUM-tier carrier, late_count 1 and a HIGH_WIND corridor, the per_line_rounded variant of run_plan_exposure reports 762.28 while the aggregate_rounded variant reports 762.27 over the identical inputs — a one-cent divergence that only the rounding order produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z, epoch [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) adopted."
            - "Carrier AURORA is ACTIVE with safety_tier MEDIUM and committed_discount_cents 15."
            - "Corridor Sun Belt I-10 is ACTIVE with weather_profile HIGH_WIND and weather_risk_score 55."
            - "A run plan is priced at posted_per_mile_cents 225 with trailer_count 2, so committed_rate_cents resolves to 250 and per_mile_rate_cents to 260."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ledger-checkpoints"
              payload: { checkpoint_code: "EPOCH-SEP", epoch_start_at: "2026-09-01T00:00:00Z", epoch_end_at: "2026-10-01T00:00:00Z", hours_per_epoch: 24 }
              as: PlatformAdmin
              captures: { ck_id: $.data.id }
            - call: "POST /api/ledger-checkpoints/${ck_id}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/terminals"
              payload: { terminal_code: "PHX-WEST", terminal_name: "Phoenix West Hub", state_code: "AZ", apron_capacity: 40 }
              as: TerminalManager
              captures: { t_phx: $.data.id }
            - call: "POST /api/terminals"
              payload: { terminal_code: "TUS-HUB", terminal_name: "Tucson Transfer Hub", state_code: "AZ", apron_capacity: 30 }
              as: TerminalManager
              captures: { t_tus: $.data.id }
            - call: "POST /api/terminals/${t_phx}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/terminals/${t_tus}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/carriers"
              payload: { carrier_name: "Aurora Freight Systems", dot_number: "DOT-3196001" }
              as: ComplianceOfficer
              captures: { car_id: $.data.id }
            - call: "POST /api/carriers/${car_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/shipper-commitments"
              payload: { shipper_name: "Rio Grande Distribution", shipper_floor_per_mile_cents: 100, reserved_window_start_epoch_day: 0, reserved_window_end_epoch_day: 30, committed_slots: 5 }
              as: ShipperPartnershipManager
              captures: { com_id: $.data.id }
            - call: "POST /api/shipper-commitments/${com_id}/confirm"
              payload: {}
              as: ShipperPartnershipManager
            - call: "POST /api/driver-prospects"
              payload: { prospect_name: "Dana Whitfield", home_terminal_id: "${t_phx}", pathway: "FIRST_LAST_MILE" }
              as: DriverOutreachCoordinator
              captures: { pro_id: $.data.id }
            - call: "POST /api/corridors"
              payload: { corridor_name: "Sun Belt I-10", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", highway_segment_miles: 120, mapped_route: { route_code: "I10-EAST-01", waypoint_count: 14, has_hov_lane: true, requires_tunnel_clearance: false }, weather_profile: "HIGH_WIND", weather_risk_score: 55 }
              as: CorridorOperationsManager
              captures: { cor_id: $.data.id }
            - call: "POST /api/run-plans"
              payload: { corridor_id: "${cor_id}", carrier_id: "${car_id}", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", shipper_commitment_id: "${com_id}", window_start_epoch_day: 1, window_end_epoch_day: 3, trailer_count: 2, posted_per_mile_cents: 225, hauler_team_id: "${pro_id}", sacra_loadboard_slot_held: true }
              as: CarrierDispatcher
              captures: { rp_id: $.data.id, rp_v: $.data.version }
          trigger:
            - call: "GET /api/run-plans/${rp_id}"
              payload: {}
              as: Any
          assert:
            - "RunPlan.${rp_id}.posted_per_mile_cents == 225"
            - "RunPlan.${rp_id}.per_mile_rate_cents == 260 — posted rate plus ceil(2 / 2) * 20"
            - "RunPlan.${rp_id}.committed_rate_cents == 250 — MAX_of(per_mile_rate_cents, shipper_floor) minus the MEDIUM band discount of 15, floored by the carrier rate"
            - "RunPlan.${rp_id}.run_plan_exposure_cents == 762.28 under per_line_rounded, and the aggregate_rounded variant over the same inputs reads 762.27"
            - "the two variant readings differ by exactly 0.01, which is the rounding order and nothing else"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: safe_stop_fee_nested_band_selection
        grounds:
          - calculations.safe_stop_fee
          - calculations.safe_stop_fee.variants.exposure_based
          - entities.RemoteSupportAssignment.fields.safe_stop_fee_cents
          - state_machines.RunPlan.transitions.IN_TRANSIT_to_READINESS_PENDING
        distinguishing_aspect: "safe_stop_fee nests a four-input multiplicative exposure inside a two-breakpoint band ladder, so a run at rounded exposure 816.00 sits in the zero band while the same run with trailer_count 2 reaches 1224.00 and jumps to the 25000 band — the fee is selected by non-linear interaction of mileage, weather, trailer count and carrier incident band, not by any single input crossing a threshold."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z, epoch [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) adopted."
            - "Carrier AURORA is ACTIVE with incident_band CLEAN and health_factor 1.0."
            - "Corridor Sun Belt I-10 is ACTIVE with weather_profile LOW_VISIBILITY and weather_risk_score 34, highway_segment_miles 24."
            - "A single-trailer run plan on that corridor is DISPATCH_READY behind an approved apron window, and a monitoring window for it has been acknowledged into MONITORING."
