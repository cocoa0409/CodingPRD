# =============================================================================
# Task 1856: SCAFFOLD_DIFFICULTY_DESIGN (Section 1.8 — Test Targeting Index)
# 9 rule_ids x 2 instances each = 18 instances.
# Every instance grounds in SCAFFOLD.yaml sections 1.1-1.7 and replays from
# empty-DB via declared endpoints only. Clock default: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: rvo_provisional_vs_final_on_obligation_year
        grounds:
          - calculations.rvo_obligation
          - entities.ObligationYear.fields.provisional_rvo_total_rins
          - entities.ObligationYear.fields.final_rvo_total_rins
        distinguishing_aspect: |
          Entity domain ObligationYear: the SAME EPA standards produce
          provisional RVOs from projected_volume_gal (1000 gal) and different
          final RVOs from actual_volume_gal (1200 gal); this instance is the
          volume-obligation domain, distinct from the CI-credit domain of
          state_credit_provisional_vs_verified_on_credit_report.
        test_recipe:
          setup:
            - "Account exists; ObligationYear 2026 opened with projected_volume_gal=1000 and standards 10/20/30/40 percent"
            - "Provisional RVOs 100/200/300/400; volume then closed at actual_volume_gal=1200"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-1" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/obligation-years/${yr}/close-volume"
              payload: { actual_volume_gal: 1200 }
              as: ComplianceManager
          trigger:
            - call: "GET /rfs/obligation-years/${yr}"
              as: ComplianceManager
          assert:
            - "ObligationYear.${yr}.provisional_rvo_cellulosic_rins == 100"
            - "ObligationYear.${yr}.provisional_rvo_biomass_diesel_rins == 200"
            - "ObligationYear.${yr}.provisional_rvo_advanced_rins == 300"
            - "ObligationYear.${yr}.provisional_rvo_total_rins == 400"
            - "ObligationYear.${yr}.final_rvo_cellulosic_rins == 120"
            - "ObligationYear.${yr}.final_rvo_biomass_diesel_rins == 240"
            - "ObligationYear.${yr}.final_rvo_advanced_rins == 360"
            - "ObligationYear.${yr}.final_rvo_total_rins == 480"
            - "ObligationYear.${yr}.provisional_rvo_total_rins != ObligationYear.${yr}.final_rvo_total_rins"

      - name: state_credit_provisional_vs_verified_on_credit_report
        grounds:
          - calculations.state_credit_generation
          - entities.StateCreditReport.fields.credits_tons
        distinguishing_aspect: |
          Entity domain StateCreditReport: the SAME fuel_gallons (1234) yield
          provisional credits from the program default CI (80.0) and different
          verified credits from measured CI (75.0); this instance is the
          state low-carbon credit domain, distinct from the RVO volume domain
          of rvo_provisional_vs_final_on_obligation_year.
        test_recipe:
          setup:
            - "Account exists; StateProgram enrolled with ci_standard 90.0 and default_ci 80.0"
            - "StateCreditReport filed for 1234 gallons (PROVISIONAL), then verified with measured_ci 75.0"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-2" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/state-programs"
              payload: { account_id: "${acct}", state_code: "CA", program_type: "LCFS", ci_standard_gco2e_mj: 90.0, default_ci_gco2e_mj: 80.0 }
              as: ComplianceManager
              captures: { prog: $.data.id }
            - call: "POST /rfs/state-credit-reports"
              payload: { state_program_id: "${prog}", period_label: "2026-Q3", fuel_gallons: 1234 }
              as: ComplianceManager
              captures: { scr: $.data.id }
            - call: "POST /rfs/state-credit-reports/${scr}/verify"
              payload: { measured_ci_gco2e_mj: 75.0 }
              as: ComplianceManager
          trigger:
            - call: "GET /rfs/state-credit-reports/${scr}"
              as: ComplianceManager
            - call: "GET /rfs/state-programs/${prog}"
              as: ComplianceManager
          assert:
            - "StateCreditReport.${scr}.status == VERIFIED"
            - "StateCreditReport.${scr}.credits_tons == 2.2212"
            - "StateProgram.${prog}.total_credits_tons == 2.2212"
            - "verified variant 2.2212 != provisional variant 1.4808 for identical fuel_gallons 1234"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (two different modes: (a) and (b))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: carryover_cap_waterfall_mode_a
        grounds:
          - calculations.carryover_cap_check
          - calculations.retirement_fifo_allocation
          - entities.RetirementBatch.fields.prior_vintage_qty
        distinguishing_aspect: |
          Mode (a) non-linear interaction with >= 3 inputs: cap depends on
          active RVO (provisional vs final branch on year status), prior-vintage
          qty in the new batch (from the FIFO draw), and already-ACCEPTED
          prior-vintage retirements; nested min() inside the FIFO draw feeds the
          threshold. Distinct from per-lot rounding (mode b) of
          per_lot_generation_rounding_mode_b.
        test_recipe:
          setup:
            - "Year 2026 with provisional RVOs 100/200/300/400 (TOTAL cap = round_half_up(0.20*400) = 80)"
            - "Prior-vintage (2025) GENERATED D6 lot with 100 RINs fully separated"
            - "Batch A (prior vintage 80) SUBMITTED then ACCEPTED; batch B (prior vintage 1) created in DRAFT"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-3" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2025, gallon_qty: 100, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot_prior: $.data.id }
            - call: "POST /rfs/rin-lots/${lot_prior}/separations"
              payload: { blended_gallons: 100 }
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 80 }
              as: ComplianceManager
              captures: { b_a: $.data.id }
            - call: "POST /rfs/retirement-batches/${b_a}/submit"
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches/${b_a}/decide"
              payload: { decision: "ACCEPT" }
              as: OpsAdmin
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 1 }
              as: ComplianceManager
              captures: { b_b: $.data.id }
          trigger:
            - call: "POST /rfs/retirement-batches/${b_b}/submit"
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CARRYOVER_CAP_EXCEEDED (80 already accepted + 1 new prior-vintage > cap 80)"
            - "ObligationYear.${yr}.retired_prior_total_rins == 80 (unchanged)"
            - "RetirementBatch.${b_b}.status == DRAFT (no allocations performed)"

      - name: per_lot_generation_rounding_mode_b
        grounds:
          - calculations.rin_generation_qty
          - calculations.position_aggregation
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-half-up PER LOT at
          generation, then sums rounded integers at position read; rounding the
          aggregate instead would give 3, the pinned order gives 4. Distinct
          from the mode-(a) threshold interaction of
          carryover_cap_waterfall_mode_a.
        test_recipe:
          setup:
            - "Account exists with two GENERATED D6/2026 lots of exactly 1 gallon each at equivalence_value 1.5"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-4" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 1, equivalence_value: 1.5 }
              as: ComplianceManager
              captures: { lot1: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 1, equivalence_value: 1.5 }
              as: ComplianceManager
              captures: { lot2: $.data.id }
          trigger:
            - call: "GET /rfs/compliance-accounts/${acct}/position"
              as: ComplianceManager
          assert:
            - "RINLot.${lot1}.rin_qty == 2 (round_half_up(1.5) per lot)"
            - "RINLot.${lot2}.rin_qty == 2"
            - "position bucket (D6, 2026).generated_rins == 4 (sum of rounded per-lot values; aggregate-rounding would yield 3)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (two different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: compliance_report_revision_and_amendment_cycles
        grounds:
          - state_machines.ComplianceReport.REJECTED_to_DRAFT
          - state_machines.ComplianceReport.ACCEPTED_to_DRAFT
          - state_machines.ComplianceReport.DRAFT_to_SUPERSEDED
        distinguishing_aspect: |
          Entity ComplianceReport: cyclic machine (DRAFT -> SUBMITTED ->
          REJECTED -> DRAFT revision loop, plus ACCEPTED -> DRAFT amendment
          loop and DRAFT -> SUPERSEDED on new same-type create); distinct
          entity from the AttestEngagement remediation loop instance.
        test_recipe:
          setup:
            - "Account + year exist; QUARTERLY report created (OCC), submitted, rejected by EPA, reopened to DRAFT, resubmitted, accepted, then amended back to DRAFT"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-5" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id, yr_v: $.data.version }
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "QUARTERLY", quarter_end_date: "2026-06-30T00:00:00Z", expected_obligation_year_version: "${yr_v}" }
              as: ComplianceManager
              captures: { rep: $.data.id }
            - call: "POST /rfs/compliance-reports/${rep}/submit"
              as: ComplianceManager
            - call: "POST /rfs/compliance-reports/${rep}/decide"
              payload: { decision: "REJECT" }
              as: OpsAdmin
            - call: "POST /rfs/compliance-reports/${rep}/reopen"
              as: ComplianceManager
            - call: "POST /rfs/compliance-reports/${rep}/submit"
              as: ComplianceManager
            - call: "POST /rfs/compliance-reports/${rep}/decide"
              payload: { decision: "ACCEPT" }
              as: OpsAdmin
          trigger:
            - call: "POST /rfs/compliance-reports/${rep}/reopen"
              as: ComplianceManager
          assert:
            - "ComplianceReport.${rep}.status == DRAFT (ACCEPTED -> DRAFT amendment loop closed the cycle)"
            - "ComplianceReport.${rep}.submitted_at == null"
            - "ComplianceReport.${rep}.is_late == false"
            - "ComplianceReport.${rep}.amendment_required == false"

      - name: attest_engagement_remediation_loop
        grounds:
          - state_machines.AttestEngagement.FINDINGS_ISSUED_to_REMEDIATION
          - state_machines.AttestEngagement.REMEDIATION_to_FIELDWORK
        distinguishing_aspect: |
          Entity AttestEngagement: cyclic remediation loop FIELDWORK ->
          FINDINGS_ISSUED -> REMEDIATION -> FIELDWORK (re-examination) with a
          second findings round closing CLEAN; distinct entity from the
          ComplianceReport cycle instance.
        test_recipe:
          setup:
            - "Account + year exist; engagement for auditor aud-1 created; fieldwork begun; ADVERSE findings issued; remediation opened"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-6" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/attest-engagements"
              payload: { obligation_year_id: "${yr}", auditor_user_id: "aud-1", fieldwork_start: "2026-09-01T00:00:00Z", fieldwork_end: "2026-10-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eng: $.data.id }
            - call: "POST /rfs/attest-engagements/${eng}/begin-fieldwork"
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /rfs/attest-engagements/${eng}/issue-findings"
              payload: { findings: "ADVERSE" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /rfs/attest-engagements/${eng}/remediate"
              as: ComplianceManager
          trigger:
            - call: "POST /rfs/attest-engagements/${eng}/begin-fieldwork"
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /rfs/attest-engagements/${eng}/issue-findings"
              payload: { findings: "CLEAN" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /rfs/attest-engagements/${eng}/close"
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "AttestEngagement.${eng}.status == CLOSED_CLEAN (REMEDIATION -> FIELDWORK -> FINDINGS_ISSUED -> CLOSED_CLEAN loop traversed)"
            - "AttestEngagement.${eng}.findings == CLEAN (second findings round overwrote ADVERSE)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (depth >= 3 and depth >= 2, different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: vendor_revocation_invalidation_cascade
        grounds:
          - state_machines.Vendor.APPROVED_to_REVOKED
          - state_machines.RINTrade.VERIFIED_to_INVALIDATED
          - state_machines.RINLot.ACTIVE_to_INVALIDATED
          - calculations.nested_retirement_accounting
          - state_machines.ComplianceReport.ACCEPTED_to_REJECTED
        distinguishing_aspect: |
          Trigger POST /rfs/vendors/{id}/diligence (REVOKED); depth-4 chain:
          vendor REVOKED -> trade INVALIDATED -> lot INVALIDATED (retired
          clawback) -> ObligationYear counters re-derived -> ACCEPTED report
          REJECTED with amendment_required=true. Distinct trigger and pattern
          from the retirement-acceptance cascade.
        test_recipe:
          setup:
            - "Account + year (provisional TOTAL RVO 400) exist; vendor APPROVED"
            - "Trade: 500 D6/2026 RINs @ 100c paid, delivered (PURCHASED lot 500 separated), verified"
            - "Retirement batch TOTAL_RENEWABLE/D6 qty 400 SUBMITTED then ACCEPTED from that lot (retired_total=400)"
            - "QUARTERLY report SUBMITTED then ACCEPTED"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-7" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id, yr_v: $.data.version }
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: true }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
            - call: "POST /rfs/vendors/${ven}/diligence"
              payload: { outcome: "APPROVED" }
              as: ComplianceManager
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 500, price_per_rin_cents: 100 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd: $.data.id }
            - call: "POST /rfs/rin-trades/${trd}/pay"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd}/deliver"
              as: Trader
              as_user_id: "tr-1"
            - call: "GET /rfs/rin-lots"
              payload: { trade_id: "${trd}" }
              as: ComplianceManager
              captures: { lot: $.data.0.id }
            - call: "POST /rfs/rin-trades/${trd}/verify"
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 400 }
              as: ComplianceManager
              captures: { b: $.data.id }
            - call: "POST /rfs/retirement-batches/${b}/submit"
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches/${b}/decide"
              payload: { decision: "ACCEPT" }
              as: OpsAdmin
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "QUARTERLY", quarter_end_date: "2026-06-30T00:00:00Z", expected_obligation_year_version: "${yr_v}" }
              as: ComplianceManager
              captures: { rep: $.data.id }
            - call: "POST /rfs/compliance-reports/${rep}/submit"
              as: ComplianceManager
            - call: "POST /rfs/compliance-reports/${rep}/decide"
              payload: { decision: "ACCEPT" }
              as: OpsAdmin
          trigger:
            - call: "POST /rfs/vendors/${ven}/diligence"
              payload: { outcome: "REVOKED" }
              as: ComplianceManager
          assert:
            - "Vendor.${ven}.diligence_status == REVOKED"
            - "RINTrade.${trd}.transfer_status == INVALIDATED"
            - "RINLot.${lot}.status == INVALIDATED"
            - "RINLot.${lot}.invalidated_qty == 100 (500 rin_qty - 400 retired_qty clawed back)"
            - "ObligationYear.${yr}.retired_total_rins == 0 (re-derived excluding INVALIDATED lot)"
            - "ComplianceReport.${rep}.status == REJECTED"
            - "ComplianceReport.${rep}.amendment_required == true"

      - name: retirement_acceptance_cascade_to_satisfied
        grounds:
          - state_machines.RetirementBatch.SUBMITTED_to_ACCEPTED
          - state_machines.RINLot.ACTIVE_to_EXHAUSTED
          - calculations.nested_retirement_accounting
          - calculations.posture_derivation
        distinguishing_aspect: |
          Trigger POST /rfs/retirement-batches/{id}/decide (ACCEPT); depth-2+
          chain: batch acceptance -> allocated lots debited (D6 lot hits zero
          -> EXHAUSTED) -> ObligationYear retired_* counters re-derived with
          nested d_code mapping -> posture flips ON_TRACK -> SATISFIED.
          Distinct trigger from the vendor-revocation cascade.
        test_recipe:
          setup:
            - "Year 2026 provisional RVOs 100/200/300/400; three GENERATED separated lots: D3 100, D4 200, D6 100"
            - "CELLULOSIC/D3 batch 100 ACCEPTED; BIOMASS_DIESEL/D4 batch 200 ACCEPTED; TOTAL_RENEWABLE/D6 batch 100 SUBMITTED"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-8" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D3", vintage_year: 2026, gallon_qty: 100, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot_d3: $.data.id }
            - call: "POST /rfs/rin-lots/${lot_d3}/separations"
              payload: { blended_gallons: 100 }
              as: ComplianceManager
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D4", vintage_year: 2026, gallon_qty: 200, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot_d4: $.data.id }
            - call: "POST /rfs/rin-lots/${lot_d4}/separations"
              payload: { blended_gallons: 200 }
              as: ComplianceManager
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 100, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot_d6: $.data.id }
            - call: "POST /rfs/rin-lots/${lot_d6}/separations"
              payload: { blended_gallons: 100 }
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "CELLULOSIC", d_code: "D3", rin_qty: 100 }
              as: ComplianceManager
              captures: { b1: $.data.id }
            - call: "POST /rfs/retirement-batches/${b1}/submit"
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches/${b1}/decide"
              payload: { decision: "ACCEPT" }
              as: OpsAdmin
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "BIOMASS_DIESEL", d_code: "D4", rin_qty: 200 }
              as: ComplianceManager
              captures: { b2: $.data.id }
            - call: "POST /rfs/retirement-batches/${b2}/submit"
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches/${b2}/decide"
              payload: { decision: "ACCEPT" }
              as: OpsAdmin
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 100 }
              as: ComplianceManager
              captures: { b3: $.data.id }
            - call: "POST /rfs/retirement-batches/${b3}/submit"
              as: ComplianceManager
          trigger:
            - call: "POST /rfs/retirement-batches/${b3}/decide"
              payload: { decision: "ACCEPT" }
              as: OpsAdmin
          assert:
            - "RINLot.${lot_d6}.status == EXHAUSTED (available_qty hit 0)"
            - "RINLot.${lot_d6}.retired_qty == 100"
            - "ObligationYear.${yr}.retired_cellulosic_rins == 100"
            - "ObligationYear.${yr}.retired_biomass_diesel_rins == 200"
            - "ObligationYear.${yr}.retired_advanced_rins == 300 (nested: D3 100 + D4 200)"
            - "ObligationYear.${yr}.retired_total_rins == 400 (nested: 100 + 200 + 100)"
            - "ObligationYear.${yr}.compliance_posture == SATISFIED"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (two different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: batch_resubmit_state_beats_carryover_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CARRYOVER_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair state(8) vs business_fiscal(12): re-submitting an
          already-SUBMITTED batch violates the from-state check AND would
          breach the carryover cap (80 already accepted + this batch's 80 >
          cap 80); the state error must win. Distinct pair from
          verify_safety_beats_temporal_window.
        test_recipe:
          setup:
            - "Year 2026 (TOTAL cap 80); prior-vintage D6 lot with 200 RINs fully separated"
            - "Batch A qty 80 ACCEPTED (retired_prior_total = 80, cap exhausted)"
            - "Batch B qty 80 SUBMITTED (was valid at submit time; still SUBMITTED, never decided)"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-9" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2025, gallon_qty: 200, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot_prior: $.data.id }
            - call: "POST /rfs/rin-lots/${lot_prior}/separations"
              payload: { blended_gallons: 200 }
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 80 }
              as: ComplianceManager
              captures: { b_a: $.data.id }
            - call: "POST /rfs/retirement-batches/${b_a}/submit"
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 80 }
              as: ComplianceManager
              captures: { b_b: $.data.id }
            - call: "POST /rfs/retirement-batches/${b_b}/submit"
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches/${b_a}/decide"
              payload: { decision: "ACCEPT" }
              as: OpsAdmin
          trigger:
            - call: "POST /rfs/retirement-batches/${b_b}/submit"
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (priority 8 state beats priority 12 fiscal)"
            - "trigger response error_id != ERR_CARRYOVER_CAP_EXCEEDED"
            - "RetirementBatch.${b_b}.status == SUBMITTED (unchanged)"

      - name: verify_safety_beats_temporal_window
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_VENDOR_NOT_APPROVED]
          - errors[ERR_VERIFICATION_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Category pair business_safety(9) vs business_temporal(11): verifying
          a trade whose vendor is UNVETTED AND whose 30-day verification
          window has expired must return the safety error. Distinct pair from
          batch_resubmit_state_beats_carryover_fiscal.
        test_recipe:
          setup:
            - "Account + UNVETTED vendor; trade 10 D6/2026 @ 100c paid and delivered at clock 2026-08-01"
            - "Clock advanced 31 days to 2026-09-01 (window delivered_at + 30 days = 2026-08-31 expired)"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-10" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "ShadyRIN Inc", qap_audited: false }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 10, price_per_rin_cents: 100 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd: $.data.id }
            - call: "POST /rfs/rin-trades/${trd}/pay"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd}/deliver"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /rfs/rin-trades/${trd}/verify"
              as: ComplianceManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_VENDOR_NOT_APPROVED (priority 9 safety beats priority 11 temporal)"
            - "trigger response error_id != ERR_VERIFICATION_WINDOW_EXPIRED"
            - "RINTrade.${trd}.transfer_status == DELIVERED (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: carryover_cap_at_exactly_20_percent_allowed
        grounds:
          - calculations.carryover_cap_check
          - validations[priority=12]
          - errors[ERR_CARRYOVER_CAP_EXCEEDED]
        distinguishing_aspect: |
          Metric: RIN count vs a percentage cap. Boundary semantics: exactly
          AT the cap (80 == round_half_up(0.20*400)) is allowed (<=), one more
          fails. Endpoint: POST /rfs/retirement-batches/{id}/submit. Distinct
          metric and endpoint from the retention-timestamp instance.
        test_recipe:
          setup:
            - "Year 2026 (provisional TOTAL RVO 400 => cap 80); prior-vintage D6 lot 100 RINs separated"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-11" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2025, gallon_qty: 100, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot_prior: $.data.id }
            - call: "POST /rfs/rin-lots/${lot_prior}/separations"
              payload: { blended_gallons: 100 }
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 80 }
              as: ComplianceManager
              captures: { b_ok: $.data.id }
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 81 }
              as: ComplianceManager
              captures: { b_over: $.data.id }
          trigger:
            - call: "POST /rfs/retirement-batches/${b_ok}/submit"
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches/${b_over}/submit"
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "RetirementBatch.${b_ok}.status == SUBMITTED (at-cap 80 allowed)"
            - "RetirementBatch.${b_ok}.prior_vintage_qty == 80"
            - "second trigger error_id == ERR_CARRYOVER_CAP_EXCEEDED (81 > 80)"
            - "RetirementBatch.${b_over}.status == DRAFT"

      - name: retention_purge_exact_cutoff_second
        grounds:
          - calculations.retention_cutoff
          - validations[priority=11]
          - errors[ERR_RETENTION_ACTIVE]
          - entities.PriceQuote.fields.retention_until
        distinguishing_aspect: |
          Metric: timestamp vs a retention cutoff. Boundary semantics: at
          retention_until exactly (created 2026-08-01T00:00:00Z + 1825 days =
          2031-07-31T00:00:00Z) purge succeeds (<=); one second before it
          fails. Endpoint: POST /rfs/compliance-accounts/{id}/purge-records.
          Distinct metric and endpoint from the carryover-count instance.
        test_recipe:
          setup:
            - "Account with one PriceQuote created at the default clock 2026-08-01T00:00:00Z (retention_until = 2031-07-31T00:00:00Z)"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-12" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/price-quotes"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, price_cents: 150, effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-08-31T23:59:59Z" }
              as: OpsAdmin
              captures: { pq: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-07-30T23:59:59Z" }
              as: OpsAdmin
            - call: "POST /rfs/compliance-accounts/${acct}/purge-records"
              as: OpsAdmin
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-07-31T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /rfs/compliance-accounts/${acct}/purge-records"
              as: OpsAdmin
              captures: { purged_quotes: $.data.purged_price_quotes }
            - call: "GET /rfs/price-quotes/${pq}"
              as: OpsAdmin
              captures: { err_gone: $.data.error_id }
          assert:
            - "first purge error_id == ERR_RETENTION_ACTIVE (one second before retention_until)"
            - "second purge succeeds at exactly retention_until"
            - "purged_price_quotes == 1"
            - "post-purge GET error_id == ERR_NOT_FOUND (record hard-deleted)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: trade_verify_gated_by_vendor_diligence
        grounds:
          - state_machines.RINTrade.DELIVERED_to_VERIFIED
          - state_machines.Vendor.UNVETTED_to_APPROVED
          - errors[ERR_VENDOR_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair RINTrade -> Vendor: verify is legal only when the
          referenced Vendor.diligence_status == APPROVED; the same trade is
          rejected while UNVETTED and succeeds after the vendor transition.
          Distinct pair from report-vs-engagement.
        test_recipe:
          setup:
            - "Account + vendor (UNVETTED); trade 10 D6/2026 @ 100c paid and delivered"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-13" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: true }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 10, price_per_rin_cents: 100 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd: $.data.id }
            - call: "POST /rfs/rin-trades/${trd}/pay"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd}/deliver"
              as: Trader
              as_user_id: "tr-1"
          trigger:
            - call: "POST /rfs/rin-trades/${trd}/verify"
              as: ComplianceManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
            - call: "POST /rfs/vendors/${ven}/diligence"
              payload: { outcome: "APPROVED" }
              as: ComplianceManager
            - call: "POST /rfs/rin-trades/${trd}/verify"
              as: ComplianceManager
              as_user_id: "cm-1"
          assert:
            - "first verify error_id == ERR_VENDOR_NOT_APPROVED (Vendor UNVETTED blocks RINTrade transition)"
            - "second verify succeeds after Vendor -> APPROVED"
            - "RINTrade.${trd}.transfer_status == VERIFIED"
            - "RINTrade.${trd}.verified_by_user_id == cm-1"

      - name: annual_report_gated_by_attest_engagement
        grounds:
          - state_machines.ComplianceReport.DRAFT_to_SUBMITTED
          - state_machines.AttestEngagement.FINDINGS_ISSUED_to_CLOSED_CLEAN
          - errors[ERR_ATTEST_NOT_CLEAN]
        distinguishing_aspect: |
          Entity pair ComplianceReport -> AttestEngagement: ANNUAL submit is
          legal only when an engagement for the same ObligationYear is
          CLOSED_CLEAN; rejected while FIELDWORK, succeeds after close.
          Distinct pair from trade-vs-vendor.
        test_recipe:
          setup:
            - "Account + year; engagement for auditor aud-1 in FIELDWORK; ANNUAL report DRAFT created by cm-1"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-14" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id, yr_v: $.data.version }
            - call: "POST /rfs/attest-engagements"
              payload: { obligation_year_id: "${yr}", auditor_user_id: "aud-1", fieldwork_start: "2026-09-01T00:00:00Z", fieldwork_end: "2026-10-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eng: $.data.id }
            - call: "POST /rfs/attest-engagements/${eng}/begin-fieldwork"
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "ANNUAL", expected_obligation_year_version: "${yr_v}" }
              as: ComplianceManager
              as_user_id: "cm-1"
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /rfs/compliance-reports/${rep}/submit"
              as: ComplianceManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
            - call: "POST /rfs/attest-engagements/${eng}/issue-findings"
              payload: { findings: "CLEAN" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /rfs/attest-engagements/${eng}/close"
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /rfs/compliance-reports/${rep}/submit"
              as: ComplianceManager
              as_user_id: "cm-1"
          assert:
            - "first submit error_id == ERR_ATTEST_NOT_CLEAN (engagement in FIELDWORK)"
            - "second submit succeeds after engagement CLOSED_CLEAN"
            - "ComplianceReport.${rep}.status == SUBMITTED"
            - "ComplianceReport.${rep}.is_late == false (submitted at default clock before due_date 2027-03-31T23:59:59Z)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: attest_fieldwork_windows_half_open
        grounds:
          - validations[priority=10]
          - errors[ERR_ENGAGEMENT_WINDOW_OVERLAP]
          - entities.AttestEngagement.fields.fieldwork_start
        distinguishing_aspect: |
          Resource: auditor_user_id calendar. Interval semantics: HALF-OPEN
          [fieldwork_start, fieldwork_end) — a new window starting exactly at
          the existing window's end is allowed; interior overlap conflicts.
          Distinct semantics and resource from price-quote closed windows.
        test_recipe:
          setup:
            - "Account + two obligation years; engagement E1 for auditor aud-1 on year A with window [2026-09-01, 2026-10-01)"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-15" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr_a: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2027, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr_b: $.data.id }
            - call: "POST /rfs/attest-engagements"
              payload: { obligation_year_id: "${yr_a}", auditor_user_id: "aud-1", fieldwork_start: "2026-09-01T00:00:00Z", fieldwork_end: "2026-10-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eng1: $.data.id }
          trigger:
            - call: "POST /rfs/attest-engagements"
              payload: { obligation_year_id: "${yr_b}", auditor_user_id: "aud-1", fieldwork_start: "2026-10-01T00:00:00Z", fieldwork_end: "2026-11-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eng2: $.data.id }
            - call: "POST /rfs/attest-engagements"
              payload: { obligation_year_id: "${yr_b}", auditor_user_id: "aud-1", fieldwork_start: "2026-09-15T00:00:00Z", fieldwork_end: "2026-10-15T00:00:00Z" }
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "touching window [2026-10-01, 2026-11-01) succeeds (half-open: start == prior end is free)"
            - "AttestEngagement.${eng2}.status == ENGAGED"
            - "overlapping window [2026-09-15, 2026-10-15) error_id == ERR_ENGAGEMENT_WINDOW_OVERLAP"

      - name: price_quote_windows_closed_shared_endpoint_conflicts
        grounds:
          - validations[priority=10]
          - errors[ERR_PRICE_WINDOW_OVERLAP]
          - entities.PriceQuote.fields.effective_end
        distinguishing_aspect: |
          Resource: (account_id, d_code, vintage_year) price series. Interval
          semantics: CLOSED [effective_start, effective_end] — a new window
          whose start equals the existing window's end CONFLICTS (shared
          endpoint); only a strictly-later start is free. Distinct semantics
          and resource from attest half-open windows.
        test_recipe:
          setup:
            - "Account with quote Q1 for (D6, 2026) covering closed window [2026-08-01, 2026-08-10]"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-16" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/price-quotes"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, price_cents: 150, effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-08-10T00:00:00Z" }
              as: OpsAdmin
              captures: { q1: $.data.id }
          trigger:
            - call: "POST /rfs/price-quotes"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, price_cents: 155, effective_start: "2026-08-10T00:00:00Z", effective_end: "2026-08-20T00:00:00Z" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
            - call: "POST /rfs/price-quotes"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, price_cents: 155, effective_start: "2026-08-10T00:00:01Z", effective_end: "2026-08-20T00:00:00Z" }
              as: OpsAdmin
              captures: { q2: $.data.id }
          assert:
            - "shared-endpoint window error_id == ERR_PRICE_WINDOW_OVERLAP (closed semantics: 2026-08-10T00:00:00Z belongs to Q1)"
            - "strictly-later window succeeds"
            - "PriceQuote.${q2}.price_cents == 155"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: lot_rin_conservation_submit_reject
        grounds:
          - state_machines.RetirementBatch.DRAFT_to_SUBMITTED
          - state_machines.RetirementBatch.SUBMITTED_to_REJECTED
          - entities.RINLot.fields.available_qty
        distinguishing_aspect: |
          Conserved quantity: RIN COUNT per lot —
          rin_qty == attached_qty + separated_qty + pending_retired_qty +
          retired_qty + invalidated_qty + expired_qty. Forward submit
          (separated -> pending) paired with compensating decide=REJECT
          (pending -> separated) restores every counter exactly. Distinct
          quantity from the escrow-cents invariant.
        test_recipe:
          setup:
            - "Account + year; GENERATED D6/2026 lot of 100 gallons separated (rin_qty 100, separated 100)"
            - "Batch TOTAL_RENEWABLE/D6 qty 40 created in DRAFT"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-17" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 100, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot: $.data.id }
            - call: "POST /rfs/rin-lots/${lot}/separations"
              payload: { blended_gallons: 100 }
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 40 }
              as: ComplianceManager
              captures: { b: $.data.id }
            - call: "POST /rfs/retirement-batches/${b}/submit"
              as: ComplianceManager
          trigger:
            - call: "POST /rfs/retirement-batches/${b}/decide"
              payload: { decision: "REJECT" }
              as: OpsAdmin
          assert:
            - "RINLot.${lot}.rin_qty == 100"
            - "RINLot.${lot}.attached_qty == 0"
            - "RINLot.${lot}.separated_qty == 100 (restored after REJECT)"
            - "RINLot.${lot}.pending_retired_qty == 0"
            - "RINLot.${lot}.retired_qty == 0"
            - "RINLot.${lot}.available_qty == 100 (100 == 0 + 100 + 0 + 0 + 0 + 0 conservation holds exactly)"
            - "RetirementBatch.${b}.status == REJECTED"

      - name: escrow_conservation_create_cancel
        grounds:
          - state_machines.RINTrade.PENDING_to_CANCELLED
          - entities.ComplianceAccount.fields.escrow_reserved_cents
          - entities.RINTrade.fields.total_price_cents
        distinguishing_aspect: |
          Conserved quantity: ESCROW CENTS — account.escrow_reserved_cents
          equals the sum of total_price_cents over UNPAID+PENDING trades.
          Forward trade create (+5000c) paired with compensating cancel
          (-5000c) restores escrow to 0 exactly. Distinct quantity from the
          lot RIN-count invariant.
        test_recipe:
          setup:
            - "Account (escrow 0) + vendor; trade of 50 D6/2026 RINs @ 100c created (total 5000c)"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-ACME-18" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: true }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 50, price_per_rin_cents: 100 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd: $.data.id }
          trigger:
            - call: "POST /rfs/rin-trades/${trd}/cancel"
              as: Trader
              as_user_id: "tr-1"
          assert:
            - "RINTrade.${trd}.transfer_status == CANCELLED"
            - "RINTrade.${trd}.total_price_cents == 5000"
            - "ComplianceAccount.${acct}.escrow_reserved_cents == 0 (create +5000, cancel -5000: no drift)"
            - "ComplianceAccount.${acct}.spent_cents == 0"
