        distinguishing_aspect: "The conserved quantity is bay occupancy rather than currency: dispatching a mobile visit leaves DeliveryCenter.booked_slot_count unchanged and cancelling it restores the appointment to TRIAGED, so the count reads 1 before, during and after the pair while the appointment has moved twice."
