scenario: |
  Generate task harder than expert level!

  2592. Industrial Battery Manufacturing (industrial and motive power battery manufacturer): cell design and plate production with lead or lithium chemistry processes and environmental controls, formation charging with energy consumption management and quality validation of capacity, battery assembly into modules and cases with connection torque and insulation resistance testing, capacity and cycle life testing with acceptance criteria and lot sampling, hazardous material handling, employee exposure monitoring and environmental permitting, motive power battery sizing for forklift applications with charger matching and fleet analysis, core return and recycling program with regulatory tracking of returned units, warranty administration based on cycle count and watering or maintenance compliance

domain_name: industrial-battery-manufacturing
api_prefix: "/"   # flat topology — every collection is a top-level path segment

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a top-level collection linked by explicit FK fields; no
  # nesting in URL paths except append-only event children (ExposureSample,
  # MaintenanceLog) which are reachable as sub-resources of their owner.

  state_machine_shape: parallel
  # BatteryAssembly carries torque_status x insulation_status as independent
  # axes with a derived certification_status; BatteryUnit carries
  # warranty_status x core_status; ProductionLot carries process_state
  # (cyclic: LOT_TESTING -> QUARANTINED -> LOT_TESTING) x env_hold_status;
  # CellDesign is cyclic (UNDER_REVIEW -> CHANGES_REQUESTED -> DRAFT ->
  # UNDER_REVIEW); Plant.compliance_posture is a derived posture gate.

  relationship_patterns:
    - one_to_many          # Plant -> Worker / FormationBay / TestChamber / ProductionLot
    - cross_aggregate      # FleetSizingRequest pins a CellDesign + Charger; BatteryUnit pins a lot
    - polymorphic          # MaintenanceLog.event_type discriminates payload fields
    - self_referential     # CellDesign supersession chain via supersedes_design_id

  role_model: segregation_of_duties
  # DesignEngineer who SUBMITs a CellDesign may not APPROVE it; the
  # QualityInspector who recorded a lot's last capacity-test result may not
  # RELEASE that lot. Peer ownership on top: SafetyOfficer owns exposure and
  # permit surface, ProductionSupervisor owns lots/runs/assemblies,
  # WarrantyAdministrator owns the field surface (units, cores, claims).

  consistency_model: immediate

difficulty_level: beyond_expert
# 14 entities / 70 endpoints / 61 error codes / 10 calculations (2 with
# divergent variants, 3 conserved-quantity invariants, 1 selector policy) /
# 12 state machines over 9 state fields (3 entities carry two independent
# axes; ProductionLot.process_state and CellDesign.approval_state are
# cyclic; Plant.compliance_posture is a derived posture gate) / 2 OCC rules
# / 52 ordered validation rules. Density target: every write endpoint
# either consumes a permit/energy budget, moves a conserved quantity, or is
# gated by a posture derived from a different entity.

# =====================================================================
# 1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: Plant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal plant name.
      - name: site_code
        type: string
        source: input
        description: Regulator-issued site code.
        constraints: "unique across Plant; 4-12 chars uppercase alphanumeric"
      - name: licensed_chemistries
        type: array
        source: input
        description: Chemistries this site's permit authorises.
        constraints: "non-empty subset of {LEAD_ACID, LITHIUM_LFP}; no duplicates"
      - name: permit_status
        type: enum
        source: input
        description: Environmental permit standing.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: monthly_lead_emission_permit_g
        type: number
        source: input
        description: Grams of lead-equivalent air emission the permit allows in the current permit month.
        constraints: "> 0; 2 decimal places"
      - name: emission_reserved_g
        type: number
        source: computed
        description: "Sum of reserved_emission_g over FormationRun rows of this plant's lots whose run_state IN {SCHEDULED, CHARGING}."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: emission_consumed_g
        type: number
        source: computed
        description: "Sum of consumed_emission_g over FormationRun rows of this plant's lots whose run_state == COMPLETED and whose actual_end_at falls in the current permit month."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: emission_utilization_ratio
        type: number
        source: computed
        description: "(emission_reserved_g + emission_consumed_g) / monthly_lead_emission_permit_g."
        default: 0
        constraints: "4 decimal places, round_half_up"
      - name: open_medical_removal_count
        type: integer
        source: computed
        description: "Count of Worker rows with plant_id == this plant and removal_status == MEDICAL_REMOVAL."
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived gate over every child write; recomputed by calculations.plant_compliance_posture.
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: peak_tariff_cents_per_kwh
        type: number
        source: input
        description: "Energy tariff applied to kWh allocated to the peak band [08:00,20:00) UTC."
        constraints: "> 0; 2 decimal places"
      - name: offpeak_tariff_cents_per_kwh
        type: number
        source: input
        description: "Energy tariff applied to kWh allocated to the off-peak band (all hours outside [08:00,20:00) UTC)."
        constraints: "> 0; 2 decimal places"
      - name: lead_initial_inventory_kg
        type: number
        source: input
        description: Lead mass on site at plant creation; the anchor of the mass-balance invariant.
        constraints: ">= 0; 3 decimal places"
      - name: lead_inventory_kg
        type: number
        source: computed
        description: Lead mass still on site; decremented by cell_design.lead_content_kg on each BatteryUnit ship.
        default: 0
        constraints: "3 decimal places, round_half_up"
      - name: lead_in_field_kg
        type: number
        source: computed
        description: Lead mass in customer hands (shipped units whose core has not been received).
        default: 0
        constraints: "3 decimal places, round_half_up"
      - name: lead_recycled_kg
        type: number
        source: computed
        description: Lead mass booked back through received core returns.
        default: 0
        constraints: "3 decimal places, round_half_up"
      - name: lead_mass_variance_kg
        type: number
        source: computed
        description: "lead_initial_inventory_kg - (lead_inventory_kg + lead_in_field_kg + lead_recycled_kg); MUST remain 0.000."
        default: 0
        constraints: "3 decimal places, round_half_up"
      - name: core_lead_variance_kg
        type: number
        source: computed
        description: Cumulative signed regulatory reconciliation difference (received_lead_kg - expected lead) over received cores.
        default: 0
        constraints: "3 decimal places, round_half_up"
      - name: core_deposit_liability_cents
        type: integer
        source: computed
        description: "CORE_DEPOSIT_CENTS * count(BatteryUnit of this plant's lots whose core_status IN {DEPOSIT_HELD, RETURN_OPEN, IN_TRANSIT})."
        default: 0
      - name: formation_energy_charge_cents
        type: integer
        source: computed
        description: Sum of final_charge_cents over COMPLETED FormationRun rows of this plant's lots.
        default: 0

  - name: CellDesign
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Design catalogue code.
        constraints: "unique across CellDesign"
      - name: chemistry
        type: enum
        source: input
        description: Cell chemistry family driving plate process, emission factor and DoD cap.
        constraints: "LEAD_ACID | LITHIUM_LFP"
      - name: plate_type
        type: enum
        source: input
        description: Plate/electrode construction.
        constraints: "TUBULAR | FLAT_PASTED | PRISMATIC_CELL; LEAD_ACID requires TUBULAR or FLAT_PASTED, LITHIUM_LFP requires PRISMATIC_CELL"
      - name: cells_per_battery
        type: integer
        source: input
        description: Series cell count per battery.
        constraints: ">= 1"
      - name: cell_nominal_voltage_v
        type: number
        source: input
        description: Nominal volts per cell.
        constraints: "> 0; 2 decimal places"
      - name: nominal_pack_voltage_v
        type: number
        source: computed
        description: "cells_per_battery * cell_nominal_voltage_v, rounded to 1 decimal place."
        constraints: "1 decimal place, round_half_up"
      - name: nominal_capacity_ah
        type: number
        source: input
        description: Rated capacity in ampere-hours at the 6-hour rate.
        constraints: "> 0; 1 decimal place"
      - name: rated_cycles
        type: integer
        source: input
        description: Rated cycle life used by cycle-life acceptance and warranty proration.
        constraints: ">= 1"
      - name: warranty_months
        type: integer
        source: input
        description: Calendar warranty term in months.
        constraints: ">= 1"
      - name: pack_weight_kg
        type: number
        source: input
        description: Assembled battery weight; checked against the forklift compartment limit.
        constraints: "> 0; 1 decimal place"
      - name: lead_content_kg
        type: number
        source: input
        description: Lead mass per battery; moves the plant mass-balance quantities.
        constraints: "3 decimal places; LEAD_ACID requires > 0; LITHIUM_LFP requires == 0"
      - name: formation_charge_factor
        type: number
        source: input
        description: Ah returned per Ah nominal during formation charging.
        default: 1.15
        constraints: ">= 1.00 and <= 2.00; 2 decimal places"
      - name: list_price_cents
        type: integer
        source: input
        description: Catalogue price per battery; default price of a shipped BatteryUnit and input to fleet capital.
        constraints: "> 0"
      - name: approval_state
        type: enum
        source: computed
        description: Design review state; only APPROVED designs may back a ProductionLot or a fleet selection.
        default: DRAFT
        constraints: "DRAFT | UNDER_REVIEW | CHANGES_REQUESTED | APPROVED | RETIRED"
      - name: revision
        type: integer
        source: computed
        description: Editorial revision counter; incremented by every accepted PATCH while in DRAFT or CHANGES_REQUESTED.
        default: 1
      - name: approved_revision
        type: integer
        source: computed
        description: Revision pinned at APPROVE time; ProductionLot copies it into design_revision_pinned.
        default: null
      - name: submitted_by_worker_id
        type: string
        source: computed
        description: "FK -> Worker.id; engineer who last SUBMITted this design for review."
        default: null
      - name: approved_by_worker_id
        type: string
        source: computed
        description: "FK -> Worker.id; engineer who APPROVEd this design; segregation of duties forbids equality with submitted_by_worker_id."
        default: null
      - name: supersedes_design_id
        type: string
        source: input
        description: "FK -> CellDesign.id; optional predecessor design this one replaces; the predecessor is RETIRED when this design is APPROVED."
        default: null
      - name: retest_tightening_enabled
        type: boolean
        source: input
        description: Feature flag; when true a requarantined lot's resampling plan is tightened per calculations.lot_sampling_plan.
        default: true

  - name: Worker
    parent: Plant
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; employing site."
      - name: full_name
        type: string
        source: input
        description: Employee name.
      - name: job_class
        type: enum
        source: input
        description: Job classification; gates the three job-class-restricted operations.
        constraints: "ENGINEER | PRODUCTION | QUALITY | SAFETY | MAINTENANCE"
      - name: hire_date
        type: datetime
        source: input
        description: ISO 8601 UTC hire instant; exposure samples may not predate it.
      - name: removal_status
        type: enum
        source: computed
        description: Medical-removal standing; a removed worker may not act as any entity_backed role.
        default: ACTIVE
        constraints: "ACTIVE | MEDICAL_REMOVAL"
      - name: exposure_index
        type: number
        source: computed
        description: Latest value produced by calculations.worker_exposure_index for the variant matching the triggering sample type.
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: exposure_index_variant
        type: enum
        source: computed
        description: Which variant produced the stored exposure_index.
        default: NONE
        constraints: "NONE | AIR_TWA_90D | BLOOD_PEAK_180D"
      - name: removal_count
        type: integer
        source: computed
        description: Lifetime count of MEDICAL_REMOVAL entries for this worker.
        default: 0
      - name: last_sample_at
        type: datetime
        source: computed
        description: sampled_at of the most recent ExposureSample for this worker.
        default: null

  - name: ExposureSample
    parent: Worker
    common_fields: false
    fields:
      - name: worker_id
        type: string
        source: input
        description: "FK -> Worker.id; monitored employee."
      - name: sample_type
        type: enum
        source: input
        description: Monitoring modality; selects the exposure-index variant.
        constraints: "AIR | BLOOD"
      - name: air_lead_ug_per_m3
        type: number
        source: input
        description: Airborne lead concentration; required when sample_type == AIR, must be omitted otherwise.
        default: null
        constraints: ">= 0; 2 decimal places"
      - name: sample_duration_minutes
        type: integer
        source: input
        description: Sampling duration weight; required when sample_type == AIR, must be omitted otherwise.
        default: null
        constraints: ">= 1 and <= 960"
      - name: blood_lead_ug_per_dl
        type: number
        source: input
        description: Blood lead level; required when sample_type == BLOOD, must be omitted otherwise.
        default: null
        constraints: ">= 0; 1 decimal place"
      - name: sampled_at
        type: datetime
        source: input
        description: ISO 8601 UTC sampling instant; must be <= logical now and >= worker.hire_date.
      - name: resulting_worker_index
        type: number
        source: computed
        description: worker.exposure_index after this sample was folded in.
        constraints: "2 decimal places, round_half_up"
      - name: resulting_variant
        type: enum
        source: computed
        description: Variant applied for this sample.
        constraints: "AIR_TWA_90D | BLOOD_PEAK_180D"
      - name: triggered_removal
        type: boolean
        source: computed
        description: True when this sample moved the worker into MEDICAL_REMOVAL.
        default: false

  - name: FormationBay
    parent: Plant
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; site hosting the bay."
      - name: bay_code
        type: string
        source: input
        description: Bay identifier.
        constraints: "unique per plant_id"
      - name: rated_power_kw
        type: number
        source: input
        description: Nameplate rectifier power; drives the provisional energy estimate.
        constraints: "> 0; 2 decimal places"
      - name: cooldown_minutes
        type: integer
        source: input
        description: Mandatory ventilation cooldown appended to both ends of every occupied window.
        default: 45
        constraints: ">= 0 and <= 240"
      - name: bay_status
        type: enum
        source: input
        description: Availability of the bay.
        default: AVAILABLE
        constraints: "AVAILABLE | MAINTENANCE"

  - name: TestChamber
    parent: Plant
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; site hosting the chamber."
      - name: chamber_code
        type: string
        source: input
        description: Chamber identifier.
        constraints: "unique per plant_id"
      - name: power_cap_kw
        type: number
        source: input
        description: Aggregate simultaneous draw the chamber supports; multiple tests may share it under this cap.
        constraints: "> 0; 2 decimal places"
      - name: chamber_status
        type: enum
        source: input
        description: Availability of the chamber.
        default: AVAILABLE
        constraints: "AVAILABLE | MAINTENANCE"

  - name: ProductionLot
    parent: Plant
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; manufacturing site."
      - name: cell_design_id
        type: string
        source: input
        description: "FK -> CellDesign.id; design being built; must be APPROVED at lot creation."
      - name: design_revision_pinned
        type: integer
        source: computed
        description: Copy of cell_design.approved_revision at lot creation; later design revisions do not affect this lot.
      - name: lot_code
        type: string
        source: input
        description: Lot identifier.
        constraints: "unique per plant_id"
      - name: quantity
        type: integer
        source: input
        description: Batteries planned in the lot; drives the sampling plan.
        constraints: ">= 1 and <= 500"
      - name: chemistry
        type: enum
        source: computed
        description: Copied from cell_design.chemistry at creation.
        constraints: "LEAD_ACID | LITHIUM_LFP"
      - name: process_state
        type: enum
        source: computed
        description: Manufacturing pipeline state; cyclic between LOT_TESTING and QUARANTINED.
        default: PLANNED
        constraints: "PLANNED | PLATE_PRODUCTION | FORMATION | ASSEMBLY | LOT_TESTING | RELEASED | QUARANTINED | SCRAPPED"
      - name: env_hold_status
        type: enum
        source: computed
        description: Environmental hold axis, independent of process_state; HELD blocks every lot-advancing and run-starting operation.
        default: CLEAR
        constraints: "CLEAR | HELD"
      - name: hold_reason
        type: enum
        source: computed
        description: Why the environmental hold axis is HELD.
        default: null
        constraints: "null | PLANT_FROZEN | PERMIT_SUSPENDED | OPERATOR_HOLD (PLANT_FROZEN and PERMIT_SUSPENDED are system-set by CASCADE A; OPERATOR_HOLD is the only value a SafetyOfficer may supply on POST /production-lots/{id}/env-hold)"
      - name: retest_count
        type: integer
        source: computed
        description: Number of QUARANTINED -> LOT_TESTING retest cycles already consumed.
        default: 0
      - name: sample_size
        type: integer
        source: computed
        description: Required completed CapacityTest count from calculations.lot_sampling_plan.
        default: null
      - name: acceptance_number
        type: integer
        source: computed
        description: Maximum tolerated FAIL results from calculations.lot_sampling_plan.
        default: null
      - name: sampling_plan_revision
        type: integer
        source: computed
        description: Incremented each time a sampling plan is created for this lot; a new plan supersedes the prior one.
        default: 0
      - name: completed_test_count
        type: integer
        source: computed
        description: "Count of CapacityTest rows on this lot's assemblies with test_state == COMPLETED and created_at >= the current sampling plan's creation instant."
        default: 0
      - name: failed_test_count
        type: integer
        source: computed
        description: "Count of the same window's COMPLETED CapacityTest rows whose result == FAIL."
        default: 0
      - name: passed_cycle_life_count
        type: integer
        source: computed
        description: "Count of the same window's COMPLETED CapacityTest rows with test_type == CYCLE_LIFE and result == PASS."
        default: 0
      - name: failed_formation_count
        type: integer
        source: computed
        description: Count of COMPLETED FormationRun rows on this lot whose capacity_validation_result == FAIL.
        default: 0
      - name: lot_capacity_yield_pct
        type: number
        source: computed
        description: Output of calculations.lot_capacity_yield over the current sampling window's PASS results.
        default: null
        constraints: "2 decimal places, round_half_up"
      - name: last_test_recorded_by_worker_id
        type: string
        source: computed
        description: "FK -> Worker.id; QualityInspector worker who recorded the most recent CapacityTest result in the current sampling window; may not be the releasing inspector."
        default: null
      - name: released_at
        type: datetime
        source: computed
        description: Logical clock instant of the RELEASED transition.
        default: null

  - name: BatteryAssembly
    parent: ProductionLot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; owning lot; must be in process_state ASSEMBLY at assembly creation."
      - name: serial_number
        type: string
        source: input
        description: Assembly serial.
        constraints: "unique across BatteryAssembly"
      - name: module_count
        type: integer
        source: input
        description: Modules in the case; expected connection count is 2 * module_count.
        constraints: ">= 1 and <= 48"
      - name: case_type
        type: enum
        source: input
        description: Case/tray construction; selects the torque specification.
        constraints: "STEEL_TRAY | POLY_CASE | MODULAR_RACK"
      - name: torque_spec_nm
        type: number
        source: computed
        description: Torque specification resolved from case_type constants at creation.
        constraints: "1 decimal place"
      - name: ir_min_megaohm
        type: number
        source: computed
        description: Minimum insulation resistance resolved from lot.chemistry constants at creation.
        constraints: "1 decimal place"
      - name: torque_status
        type: enum
        source: computed
        description: First independent verification axis.
        default: PENDING
        constraints: "PENDING | PASS | FAIL"
      - name: insulation_status
        type: enum
        source: computed
        description: Second independent verification axis; evolves independently of torque_status.
        default: PENDING
        constraints: "PENDING | PASS | FAIL"
      - name: certification_status
        type: enum
        source: computed
        description: Join of the two axes; CERTIFIED only when both are PASS, REJECTED when either is FAIL, REVOKED by lot quarantine cascade.
        default: PENDING
        constraints: "PENDING | CERTIFIED | REJECTED | REVOKED"
      - name: measured_torque_nm
        type: number
        source: computed
        description: Latest recorded torque reading.
        default: null
        constraints: "1 decimal place"
      - name: measured_ir_megaohm
        type: number
        source: computed
        description: Latest recorded insulation resistance reading.
        default: null
        constraints: "2 decimal places"
      - name: rework_count
        type: integer
        source: computed
        description: Number of rework cycles that reset both verification axes.
        default: 0

  - name: FormationRun
    parent: ProductionLot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; lot being formed."
      - name: bay_id
        type: string
        source: input
        description: "FK -> FormationBay.id; bay occupied by this run; must belong to the same plant as the lot."
      - name: scheduled_start_at
        type: datetime
        source: input
        description: ISO 8601 UTC planned window start.
      - name: scheduled_end_at
        type: datetime
        source: input
        description: ISO 8601 UTC planned window end; must be strictly after scheduled_start_at.
      - name: charge_factor_used
        type: number
        source: computed
        description: charge_factor_override when supplied at creation, otherwise cell_design.formation_charge_factor.
        constraints: "2 decimal places"
      - name: run_state
        type: enum
        source: computed
        description: Run lifecycle.
        default: SCHEDULED
        constraints: "SCHEDULED | CHARGING | COMPLETED | ABORTED"
      - name: estimated_energy_kwh
        type: number
        source: computed
        description: Provisional energy from calculations.formation_energy_charge variant provisional_nameplate.
        constraints: "2 decimal places, round_half_up"
      - name: provisional_charge_cents
        type: integer
        source: computed
        description: Provisional tariff charge booked at scheduling.
        default: 0
      - name: reserved_emission_g
        type: number
        source: computed
        description: Emission grams reserved against the plant permit while run_state IN {SCHEDULED, CHARGING}.
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: metered_energy_kwh
        type: number
        source: computed
        description: Metered energy supplied at completion.
        default: null
        constraints: "2 decimal places"
      - name: final_charge_cents
        type: integer
        source: computed
        description: Final tariff charge from calculations.formation_energy_charge variant final_metered.
        default: 0
      - name: consumed_emission_g
        type: number
        source: computed
        description: Emission grams booked as consumed at completion.
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: actual_start_at
        type: datetime
        source: computed
        description: Logical clock instant of the CHARGING transition.
        default: null
      - name: actual_end_at
        type: datetime
        source: computed
        description: Logical clock instant of the COMPLETED or ABORTED transition.
        default: null
      - name: scheduled_peak_hours
        type: number
        source: computed
        description: "Hours of the scheduled window inside the peak band [08:00,20:00) UTC."
        default: 0
        constraints: "4 decimal places, round_half_up"
      - name: scheduled_offpeak_hours
        type: number
        source: computed
        description: Hours of the scheduled window outside the peak band.
        default: 0
        constraints: "4 decimal places, round_half_up"
      - name: actual_peak_hours
        type: number
        source: computed
        description: "Hours of [actual_start_at, actual_end_at) inside the peak band."
        default: 0
        constraints: "4 decimal places, round_half_up"
      - name: actual_offpeak_hours
        type: number
        source: computed
        description: "Hours of [actual_start_at, actual_end_at) outside the peak band."
        default: 0
        constraints: "4 decimal places, round_half_up"
      - name: formation_capacity_pct
        type: number
        source: computed
        description: Post-formation capacity check supplied at completion, as a percentage of nominal_capacity_ah.
        default: null
        constraints: "2 decimal places"
      - name: capacity_validation_result
        type: enum
        source: computed
        description: PASS when formation_capacity_pct >= FORMATION_CAPACITY_MIN_PCT, else FAIL.
        default: null
        constraints: "null | PASS | FAIL"
      - name: abort_reason
        type: enum
        source: computed
        description: Why the run was aborted.
        default: null
        constraints: "null | OPERATOR_ABORT | BAY_FAULT | ENV_HOLD_CASCADE"

  - name: CapacityTest
    parent: BatteryAssembly
    common_fields: true
    fields:
      - name: assembly_id
        type: string
        source: input
        description: "FK -> BatteryAssembly.id; sampled assembly; must be CERTIFIED when the test is scheduled."
      - name: chamber_id
        type: string
        source: input
        description: "FK -> TestChamber.id; chamber occupied by the test; must belong to the same plant as the assembly's lot."
      - name: test_type
        type: enum
        source: input
        description: Acceptance dimension under test.
        constraints: "CAPACITY | CYCLE_LIFE"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: ISO 8601 UTC window start.
      - name: scheduled_end_at
        type: datetime
        source: input
        description: ISO 8601 UTC window end; must be strictly after scheduled_start_at.
      - name: draw_kw
        type: number
        source: input
        description: Simultaneous chamber draw of this test; summed against the chamber cap over overlapping windows.
        constraints: "> 0; 2 decimal places"
      - name: test_state
        type: enum
        source: computed
        description: Test lifecycle.
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | VOIDED"
      - name: measured_capacity_ah
        type: number
        source: computed
        description: Measured discharge capacity recorded at result time.
        default: null
        constraints: "1 decimal place"
      - name: cycles_completed
        type: integer
        source: computed
        description: Cycles achieved, recorded at result time; only meaningful for CYCLE_LIFE.
        default: null
      - name: result
        type: enum
        source: computed
        description: Acceptance outcome from calculations.capacity_test_result.
        default: null
        constraints: "null | PASS | FAIL"
      - name: yield_pct
        type: number
        source: computed
        description: "round(measured_capacity_ah / cell_design.nominal_capacity_ah * 100, 2) at result time."
        default: null
        constraints: "2 decimal places, round_half_up"
      - name: recorded_by_worker_id
        type: string
        source: computed
        description: "FK -> Worker.id; QualityInspector worker who recorded the result."
        default: null

  - name: Charger
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: Charger catalogue code.
        constraints: "unique across Charger"
      - name: chemistry_compatibility
        type: enum
        source: input
        description: Chemistry this charger may service.
        constraints: "LEAD_ACID | LITHIUM_LFP"
      - name: output_voltage_v
        type: number
        source: input
        description: Nominal DC output voltage; must equal the pack voltage to be eligible.
        constraints: "> 0; 1 decimal place"
      - name: output_amps
        type: number
        source: input
        description: Charge current; drives recharge-hours feasibility.
        constraints: "> 0; 1 decimal place"
      - name: charge_profile
        type: enum
        source: input
        description: Charge algorithm family.
        constraints: "FERRO | HF_MODULAR | LITHIUM_CCCV"
      - name: price_cents
        type: integer
        source: input
        description: Unit price; primary charger ranking key (ascending).
        constraints: "> 0"
      - name: charger_status
        type: enum
        source: input
        description: Catalogue availability; only AVAILABLE chargers are eligible candidates.
        default: AVAILABLE
        constraints: "AVAILABLE | DISCONTINUED"

  - name: FleetSizingRequest
    parent: Plant
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; site quoting the fleet."
      - name: application_name
        type: string
        source: input
        description: Customer application label.
      - name: forklift_class
        type: enum
        source: input
        description: Truck class of the application.
        constraints: "CLASS_I | CLASS_II | CLASS_III"
      - name: forklift_count
        type: integer
        source: input
        description: Trucks in the fleet.
        constraints: ">= 1 and <= 200"
      - name: shift_energy_kwh_per_shift
        type: number
        source: input
        description: Energy a truck consumes per shift.
        constraints: "> 0; 2 decimal places"
      - name: shifts_per_day
        type: integer
        source: input
        description: Shifts worked per day; drives the reserve factor and the spare-battery rule.
        constraints: ">= 1 and <= 3"
      - name: ambient_temp_c
        type: number
        source: input
        description: Coldest operating ambient temperature; drives the temperature derate.
        constraints: ">= -30 and <= 50; 1 decimal place"
      - name: required_voltage_v
        type: number
        source: input
        description: Truck system voltage; candidate pack and charger voltages must equal it exactly.
        constraints: "> 0; 1 decimal place"
      - name: compartment_max_kg
        type: number
        source: input
        description: Battery compartment weight limit.
        constraints: "> 0; 1 decimal place"
      - name: charge_window_hours
        type: number
        source: input
        description: Hours available to recharge between shifts.
        constraints: "> 0 and <= 24; 2 decimal places"
      - name: chemistry_preference
        type: enum
        source: input
        description: Chemistry filter for candidate designs.
        default: ANY
        constraints: "LEAD_ACID | LITHIUM_LFP | ANY"
      - name: request_state
        type: enum
        source: computed
        description: Quote lifecycle.
        default: MATCHED
        constraints: "MATCHED | ACCEPTED | WITHDRAWN"
      - name: daily_energy_kwh
        type: number
        source: computed
        description: "shift_energy_kwh_per_shift * shifts_per_day."
        constraints: "2 decimal places, round_half_up"
      - name: temp_derate_factor
        type: number
        source: computed
        description: Cold-temperature oversizing multiplier from calculations.motive_power_sizing.
        constraints: "4 decimal places, round_half_up"
      - name: reserve_factor
        type: number
        source: computed
        description: Shift-count reserve multiplier from calculations.motive_power_sizing.
        constraints: "2 decimal places"
      - name: required_ah
        type: integer
        source: computed
        description: Ampere-hours the selected pack must meet or exceed, for the selected candidate's chemistry.
      - name: selected_cell_design_id
        type: string
        source: computed
        description: "FK -> CellDesign.id; design chosen by the pinned selector policy."
      - name: selected_charger_id
        type: string
        source: computed
        description: "FK -> Charger.id; charger chosen for the selected design."
      - name: selected_charge_hours
        type: number
        source: computed
        description: Recharge hours of the selected pack/charger pair.
        constraints: "2 decimal places, round_half_up"
      - name: evaluated_design_count
        type: integer
        source: computed
        description: Number of CellDesign rows that passed the eligibility filter before ranking.
      - name: recommended_battery_count
        type: integer
        source: computed
        description: Batteries the fleet needs, including swap spares for LEAD_ACID.
      - name: recommended_charger_count
        type: integer
        source: computed
        description: Chargers the fleet needs.
      - name: fleet_capital_cents
        type: integer
        source: computed
        description: "recommended_battery_count * selected design list_price_cents + recommended_charger_count * selected charger price_cents."

  - name: BatteryUnit
    parent: ProductionLot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; producing lot; must be RELEASED at ship time."
      - name: sizing_request_id
        type: string
        source: input
        description: "FK -> FleetSizingRequest.id; optional accepted quote this unit fulfils."
        default: null
      - name: serial_number
        type: string
        source: input
        description: Unit serial.
        constraints: "unique across BatteryUnit"
      - name: customer_name
        type: string
        source: input
        description: Receiving customer.
      - name: list_price_cents
        type: integer
        source: input
        description: Invoiced price; warranty credit basis. Defaults to the lot's cell_design.list_price_cents when omitted.
        default: null
        constraints: "> 0 when supplied"
      - name: shipped_at
        type: datetime
        source: computed
        description: Logical clock instant of the ship call.
      - name: warranty_status
        type: enum
        source: computed
        description: Warranty axis; independent of core_status.
        default: IN_SERVICE
        constraints: "IN_SERVICE | CLAIM_OPEN | CLAIM_HONORED | CLAIM_PRORATED | CLAIM_DENIED"
      - name: core_status
        type: enum
        source: computed
        description: Core-return axis; independent of warranty_status. NOT_APPLICABLE for LITHIUM_LFP units.
        default: DEPOSIT_HELD
        constraints: "NOT_APPLICABLE | DEPOSIT_HELD | RETURN_OPEN | IN_TRANSIT | RECEIVED | RECYCLED | REJECTED"
      - name: cycle_count
        type: integer
        source: computed
        description: Sum of cycles_delta over CYCLE_REPORT MaintenanceLog rows of this unit.
        default: 0
      - name: months_in_service
        type: integer
        source: computed
        description: "floor((logical now - shipped_at) / 30 days), evaluated at adjudication time."
        default: 0
      - name: watering_events_expected
        type: integer
        source: computed
        description: Expected watering events from calculations.watering_compliance_ratio.
        default: 0
      - name: watering_events_ok
        type: integer
        source: computed
        description: Count of WATERING MaintenanceLog rows with electrolyte_level_ok == true.
        default: 0
      - name: watering_compliance_ratio
        type: number
        source: computed
        description: Output of calculations.watering_compliance_ratio.
        default: 1
        constraints: "4 decimal places, round_half_up"
      - name: usage_fraction
        type: number
        source: computed
        description: "max(cycle_count / cell_design.rated_cycles, months_in_service / cell_design.warranty_months) at adjudication time."
        default: 0
        constraints: "4 decimal places, round_half_up"
      - name: claim_count
        type: integer
        source: computed
        description: Number of warranty claims opened on this unit; a new claim supersedes a prior adjudicated one.
        default: 0
      - name: last_claim_at
        type: datetime
        source: computed
        description: Logical clock instant of the most recent claim.
        default: null
      - name: warranty_decision
        type: enum
        source: computed
        description: Adjudication outcome from calculations.warranty_settlement.
        default: null
        constraints: "null | HONORED | PRORATED | DENIED_USAGE | DENIED_MAINTENANCE | DENIED_NO_DEFECT"
      - name: warranty_credit_cents
        type: integer
        source: computed
        description: Credit issued by the adjudication.
        default: 0
      - name: core_manifest_number
        type: string
        source: computed
        description: Regulatory manifest number recorded when the core return is opened.
        default: null
      - name: declared_lead_kg
        type: number
        source: computed
        description: Lead mass declared on the manifest.
        default: null
        constraints: "3 decimal places"
      - name: received_lead_kg
        type: number
        source: computed
        description: Lead mass weighed in at receipt.
        default: null
        constraints: "3 decimal places"
      - name: core_credit_issued_cents
        type: integer
        source: computed
        description: Deposit credited back to the customer at receipt; stays 0 when the core is REJECTED.
        default: 0

  - name: MaintenanceLog
    parent: BatteryUnit
    common_fields: false
    fields:
      - name: battery_unit_id
        type: string
        source: input
        description: "FK -> BatteryUnit.id; serviced unit."
      - name: event_type
        type: enum
        source: input
        description: Field-service event kind; discriminates which payload fields are required.
        constraints: "WATERING | EQUALIZE | INSPECTION | CYCLE_REPORT"
      - name: performed_at
        type: datetime
        source: input
        description: ISO 8601 UTC service instant; must be >= unit.shipped_at and <= logical now.
      - name: electrolyte_level_ok
        type: boolean
        source: input
        description: Electrolyte level verdict; required when event_type == WATERING, must be omitted otherwise.
        default: null
      - name: cycles_delta
        type: integer
        source: input
        description: Cycles accumulated since the previous report; required when event_type == CYCLE_REPORT, must be omitted otherwise.
        default: null
        constraints: ">= 1 and <= 2000 when supplied"
      - name: technician_note
        type: string
        source: input
        description: Free-text note.
        default: null
      - name: resulting_cycle_count
        type: integer
        source: computed
        description: unit.cycle_count after this event.
      - name: resulting_compliance_ratio
        type: number
        source: computed
        description: unit.watering_compliance_ratio after this event.
        constraints: "4 decimal places, round_half_up"

# =====================================================================
# 1.2 State Machine Table
# Every machine declares `state_field:` because three entities carry two
# independent state axes; §1.8/§1.9 `grounds:` reference transitions as
# state_machines.<Entity>.<state_field>.<FROM>_to_<TO>.
# =====================================================================
state_machines:

  - entity: CellDesign
    state_field: approval_state
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /cell-designs/{id}"
        actor: DesignEngineer
        preconditions:
          - "approval_state IN {DRAFT, CHANGES_REQUESTED}"
          - "chemistry/plate_type pair and lead_content_kg rule still satisfied after the edit"
        side_effects:
          - "revision += 1"
          - "when approval_state == CHANGES_REQUESTED it is set back to DRAFT (revision loop closes here)"
        note: "Self-loop on DRAFT; the same call is also the CHANGES_REQUESTED -> DRAFT edge below."
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /cell-designs/{id}/review-actions with action=SUBMIT"
        actor: DesignEngineer
        preconditions:
          - "approval_state == DRAFT"
        side_effects:
          - "submitted_by_worker_id = acting worker id"
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /cell-designs/{id}/review-actions with action=REQUEST_CHANGES"
        actor: DesignEngineer
        preconditions:
          - "approval_state == UNDER_REVIEW"
          - "acting worker id != submitted_by_worker_id"
        side_effects:
          - "approval_state = CHANGES_REQUESTED; revision unchanged; submitted_by_worker_id retained for the segregation-of-duties check on the next APPROVE"
      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "PATCH /cell-designs/{id}"
        actor: DesignEngineer
        preconditions:
          - "approval_state == CHANGES_REQUESTED"
        side_effects:
          - "revision += 1"
          - "approval_state = DRAFT — the design may be SUBMITted again, closing the review cycle"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /cell-designs/{id}/review-actions with action=APPROVE"
        actor: DesignEngineer
        preconditions:
          - "approval_state == UNDER_REVIEW"
          - "acting worker job_class == ENGINEER"
          - "acting worker id != submitted_by_worker_id (segregation of duties)"
        side_effects:
          - "approved_revision = revision; approved_by_worker_id = acting worker id"
          - "when supersedes_design_id is not null, that predecessor CellDesign moves APPROVED -> RETIRED"
      - from: APPROVED
        to: RETIRED
        trigger: "system: a successor design whose supersedes_design_id points here is APPROVED"
        actor: system
        preconditions:
          - "approval_state == APPROVED"
        side_effects:
          - "approval_state = RETIRED; the design is removed from the fleet-sizing candidate pool"
          - "existing ProductionLot rows keep design_revision_pinned and are unaffected"

  - entity: Worker
    state_field: removal_status
    initial_state: ACTIVE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: MEDICAL_REMOVAL
        trigger: "POST /workers/{id}/exposure-samples whose resulting_worker_index >= REMOVAL_INDEX_THRESHOLD"
        actor: system
        preconditions:
          - "removal_status == ACTIVE"
          - "resulting_worker_index >= 100.00 as produced by calculations.worker_exposure_index"
        side_effects:
          - "CASCADE A hop 1: worker.exposure_index / exposure_index_variant / last_sample_at written from the sample"
          - "CASCADE A hop 2: because the worker's removal_status flipped, plant.open_medical_removal_count is recomputed (+1)"
          - "CASCADE A hop 3: because open_medical_removal_count changed, plant.compliance_posture is recomputed (1 removal -> RESTRICTED, 2+ -> FROZEN)"
          - "sample.triggered_removal = true"
      - from: MEDICAL_REMOVAL
        to: ACTIVE
        trigger: "POST /workers/{id}/medical-clearance"
        actor: SafetyOfficer
        preconditions:
          - "removal_status == MEDICAL_REMOVAL"
          - "the worker has a BLOOD ExposureSample with sampled_at >= logical now - 30 days and blood_lead_ug_per_dl < BLL_RETURN_THRESHOLD (20.0)"
        side_effects:
          - "removal_status = ACTIVE; exposure_index recomputed from the clearing BLOOD sample under variant blood_peak_180d"
          - "COMPENSATION hop 1: plant.open_medical_removal_count recomputed (-1)"
          - "COMPENSATION hop 2: because the count changed, plant.compliance_posture is recomputed"
          - "COMPENSATION hop 3: when the recomputed posture is no longer FROZEN, every ProductionLot of that plant with hold_reason == PLANT_FROZEN moves env_hold_status HELD -> CLEAR"

  - entity: Plant
    state_field: compliance_posture
    initial_state: OPEN
    terminal_states: []
    shape: posture_driven
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: posture recompute after a worker removal, a permit change, or an emission reservation/consumption write"
        actor: system
        preconditions:
          - "calculations.plant_compliance_posture yields RESTRICTED (exactly one open medical removal, or emission_utilization_ratio >= 0.8500 and < 1.0000, and permit_status == ACTIVE)"
        side_effects:
          - "compliance_posture = RESTRICTED"
          - "no lot may enter FORMATION and no SCHEDULED FormationRun may start while RESTRICTED; already CHARGING runs continue"
      - from: OPEN
        to: FROZEN
        trigger: "system: posture recompute after a worker removal, a permit suspension, or an emission write"
        actor: system
        preconditions:
          - "calculations.plant_compliance_posture yields FROZEN (>= 2 open medical removals, or emission_utilization_ratio >= 1.0000, or permit_status == SUSPENDED)"
        side_effects:
          - "compliance_posture = FROZEN"
          - "CASCADE A hop 4: because the posture became FROZEN, every ProductionLot of this plant whose process_state IN {PLANNED, PLATE_PRODUCTION, FORMATION, ASSEMBLY, LOT_TESTING, QUARANTINED} moves env_hold_status CLEAR -> HELD with hold_reason = PLANT_FROZEN (permit suspension writes hold_reason = PERMIT_SUSPENDED)"
          - "CASCADE A hop 5: because those lots went HELD, every FormationRun of those lots with run_state == CHARGING moves CHARGING -> ABORTED with abort_reason = ENV_HOLD_CASCADE, which releases its reserved_emission_g back to the plant"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: posture recompute"
        actor: system
        preconditions:
          - "calculations.plant_compliance_posture yields FROZEN"
        side_effects:
          - "same hold + run-abort cascade as OPEN -> FROZEN"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: posture recompute after medical clearance, permit increase, or reservation release"
        actor: system
        preconditions:
          - "calculations.plant_compliance_posture yields OPEN"
        side_effects:
          - "compliance_posture = OPEN"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system: posture recompute"
        actor: system
        preconditions:
          - "calculations.plant_compliance_posture yields RESTRICTED"
        side_effects:
          - "compliance_posture = RESTRICTED"
          - "every ProductionLot of this plant with hold_reason == PLANT_FROZEN moves env_hold_status HELD -> CLEAR; lots held with hold_reason == PERMIT_SUSPENDED stay HELD"
      - from: FROZEN
        to: OPEN
        trigger: "system: posture recompute"
        actor: system
        preconditions:
          - "calculations.plant_compliance_posture yields OPEN"
        side_effects:
          - "compliance_posture = OPEN"
          - "every ProductionLot of this plant with env_hold_status == HELD moves HELD -> CLEAR and hold_reason = null"

  - entity: ProductionLot
    state_field: process_state
    initial_state: PLANNED
    terminal_states: [RELEASED, SCRAPPED]
    shape: cyclic
    transitions:
      - from: PLANNED
        to: PLATE_PRODUCTION
        trigger: "POST /production-lots/{id}/advance with to_state=PLATE_PRODUCTION"
        actor: ProductionSupervisor
        preconditions:
          - "process_state == PLANNED"
          - "env_hold_status == CLEAR"
          - "plant.compliance_posture != FROZEN"
          - "lot.chemistry IN plant.licensed_chemistries"
        side_effects:
          - "process_state = PLATE_PRODUCTION"
      - from: PLATE_PRODUCTION
        to: FORMATION
        trigger: "POST /production-lots/{id}/advance with to_state=FORMATION"
        actor: ProductionSupervisor
        preconditions:
          - "process_state == PLATE_PRODUCTION"
          - "env_hold_status == CLEAR"
          - "plant.compliance_posture == OPEN (RESTRICTED blocks entry to FORMATION)"
        side_effects:
          - "process_state = FORMATION"
      - from: FORMATION
        to: ASSEMBLY
        trigger: "POST /production-lots/{id}/advance with to_state=ASSEMBLY"
        actor: ProductionSupervisor
        preconditions:
          - "process_state == FORMATION"
          - "env_hold_status == CLEAR"
          - "at least one FormationRun of this lot has run_state == COMPLETED"
          - "no FormationRun of this lot has run_state IN {SCHEDULED, CHARGING}"
          - "failed_formation_count == 0"
        side_effects:
          - "process_state = ASSEMBLY"
      - from: ASSEMBLY
        to: LOT_TESTING
        trigger: "POST /production-lots/{id}/sampling-plans"
        actor: QualityInspector
        preconditions:
          - "process_state == ASSEMBLY"
          - "env_hold_status == CLEAR"
          - "expected_lot_version matches lot.version (OCC, §1.2.1)"
          - "at least one BatteryAssembly of this lot has certification_status == CERTIFIED"
        side_effects:
          - "process_state = LOT_TESTING"
          - "sample_size and acceptance_number written from calculations.lot_sampling_plan"
          - "sampling_plan_revision += 1; the prior plan is superseded and completed_test_count / failed_test_count / passed_cycle_life_count / lot_capacity_yield_pct / last_test_recorded_by_worker_id reset to their defaults"
          - "lot.version += 1"
      - from: LOT_TESTING
        to: RELEASED
        trigger: "POST /production-lots/{id}/disposition with action=RELEASE"
        actor: QualityInspector
        preconditions:
          - "process_state == LOT_TESTING"
          - "env_hold_status == CLEAR"
          - "plant.compliance_posture != FROZEN"
          - "completed_test_count >= sample_size"
          - "failed_test_count <= acceptance_number"
          - "passed_cycle_life_count >= 1"
          - "acting worker id != last_test_recorded_by_worker_id (segregation of duties)"
          - "acting worker job_class == QUALITY"
        side_effects:
          - "process_state = RELEASED; released_at = logical now"
          - "lot_capacity_yield_pct recomputed by calculations.lot_capacity_yield over the current sampling window"
          - "BatteryUnit rows may now be shipped from this lot"
      - from: LOT_TESTING
        to: QUARANTINED
        trigger: "POST /capacity-tests/{id}/record-result whose FAIL pushes failed_test_count above acceptance_number, or POST /production-lots/{id}/disposition with action=QUARANTINE"
        actor: system | QualityInspector
        preconditions:
          - "process_state == LOT_TESTING"
        side_effects:
          - "CASCADE B hop 2: process_state = QUARANTINED (hop 1 was the CapacityTest result write that pushed failed_test_count over acceptance_number)"
          - "CASCADE B hop 3: because the lot became QUARANTINED, every BatteryAssembly of this lot with certification_status == CERTIFIED moves CERTIFIED -> REVOKED"
          - "CASCADE B hop 4: because those assemblies were revoked, every CapacityTest of those assemblies with test_state == SCHEDULED moves SCHEDULED -> VOIDED, releasing its chamber draw"
      - from: QUARANTINED
        to: LOT_TESTING
        trigger: "POST /production-lots/{id}/disposition with action=RETEST"
        actor: QualityInspector
        preconditions:
          - "process_state == QUARANTINED"
          - "env_hold_status == CLEAR"
          - "retest_count < RETEST_MAX (2)"
        side_effects:
          - "process_state = LOT_TESTING; retest_count += 1"
          - "sample_size and acceptance_number recomputed by calculations.lot_sampling_plan under the tightened branch; sampling_plan_revision += 1 and the sampling counters reset"
          - "every BatteryAssembly of this lot with certification_status == REVOKED moves REVOKED -> PENDING with torque_status = PENDING and insulation_status = PENDING (re-verification required)"
        note: "The LOT_TESTING -> QUARANTINED -> LOT_TESTING loop is the cycle in this machine; it may run at most twice."
      - from: QUARANTINED
        to: SCRAPPED
        trigger: "POST /production-lots/{id}/disposition with action=SCRAP"
        actor: QualityInspector
        preconditions:
          - "process_state == QUARANTINED"
        side_effects:
          - "process_state = SCRAPPED"
          - "every BatteryAssembly of this lot moves to certification_status = REJECTED"
          - "every SCHEDULED CapacityTest on those assemblies moves SCHEDULED -> VOIDED"

  - entity: ProductionLot
    state_field: env_hold_status
    initial_state: CLEAR
    terminal_states: []
    shape: parallel
    transitions:
      - from: CLEAR
        to: HELD
        trigger: "system: plant.compliance_posture entered FROZEN, or PATCH /plants/{id}/permit set permit_status=SUSPENDED"
        actor: system
        preconditions:
          - "env_hold_status == CLEAR"
          - "process_state NOT IN {RELEASED, SCRAPPED}"
        side_effects:
          - "env_hold_status = HELD; hold_reason = PLANT_FROZEN or PERMIT_SUSPENDED"
          - "every FormationRun of this lot with run_state == CHARGING moves CHARGING -> ABORTED with abort_reason = ENV_HOLD_CASCADE"
        note: "Independent of process_state: a lot can be ASSEMBLY+HELD or LOT_TESTING+HELD."
      - from: HELD
        to: CLEAR
        trigger: "system: plant posture recompute left FROZEN, or PATCH /plants/{id}/permit set permit_status=ACTIVE"
        actor: system
        preconditions:
          - "env_hold_status == HELD"
          - "the condition named by hold_reason no longer holds"
        side_effects:
          - "env_hold_status = CLEAR; hold_reason = null"
          - "aborted FormationRun rows are NOT resurrected; a new run must be scheduled"

  - entity: FormationRun
    state_field: run_state
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: CHARGING
        trigger: "POST /formation-runs/{id}/start"
        actor: ProductionSupervisor
        preconditions:
          - "run_state == SCHEDULED"
          - "lot.process_state == FORMATION"
          - "lot.env_hold_status == CLEAR"
          - "plant.compliance_posture == OPEN (cross-entity gate; RESTRICTED and FROZEN both block the start)"
          - "bay.bay_status == AVAILABLE"
        side_effects:
          - "run_state = CHARGING; actual_start_at = logical now"
          - "reserved_emission_g stays reserved on the plant (no double booking)"
      - from: CHARGING
        to: COMPLETED
        trigger: "POST /formation-runs/{id}/complete"
        actor: ProductionSupervisor
        preconditions:
          - "run_state == CHARGING"
          - "logical now > actual_start_at"
          - "metered_energy_kwh > 0"
        side_effects:
          - "run_state = COMPLETED; actual_end_at = logical now; metered_energy_kwh and formation_capacity_pct stored"
          - "actual_peak_hours / actual_offpeak_hours computed from [actual_start_at, actual_end_at)"
          - "final_charge_cents written by calculations.formation_energy_charge variant final_metered"
          - "consumed_emission_g = round(metered_energy_kwh * LEAD_EMISSION_FACTOR_G_PER_KWH[lot.chemistry], 2)"
          - "INVARIANT E1: plant.emission_reserved_g -= reserved_emission_g and plant.emission_consumed_g += consumed_emission_g in the same write"
          - "plant.formation_energy_charge_cents += final_charge_cents"
          - "capacity_validation_result = PASS when formation_capacity_pct >= 92.00 else FAIL; on FAIL lot.failed_formation_count += 1"
          - "plant.compliance_posture recomputed because emission_consumed_g changed (may enter RESTRICTED or FROZEN)"
      - from: CHARGING
        to: ABORTED
        trigger: "POST /formation-runs/{id}/abort, or system cascade when the lot goes HELD"
        actor: ProductionSupervisor | system
        preconditions:
          - "run_state == CHARGING"
        side_effects:
          - "run_state = ABORTED; actual_end_at = logical now; abort_reason set (OPERATOR_ABORT, BAY_FAULT or ENV_HOLD_CASCADE)"
          - "INVARIANT E1 (compensation): plant.emission_reserved_g -= reserved_emission_g with no consumption booked, so reserved+consumed returns to its pre-schedule value"
          - "final_charge_cents stays 0; provisional_charge_cents is retained on the run as a historical estimate but never rolls into plant.formation_energy_charge_cents"
          - "metered_energy_kwh stays null; the bay window is released for reuse"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /formation-runs/{id}/abort"
        actor: ProductionSupervisor
        preconditions:
          - "run_state == SCHEDULED"
        side_effects:
          - "run_state = ABORTED; actual_end_at = logical now; abort_reason set"
          - "INVARIANT E1 (compensation): plant.emission_reserved_g -= reserved_emission_g"
          - "plant.compliance_posture recomputed because the reservation was released"

  - entity: BatteryAssembly
    state_field: torque_status
    initial_state: PENDING
    terminal_states: []
    shape: parallel
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /battery-assemblies/{id}/verifications with verification_type=TORQUE"
        actor: QualityInspector
        preconditions:
          - "torque_status == PENDING"
          - "lot.process_state == ASSEMBLY"
          - "connection_count == 2 * module_count"
          - "measured_torque_nm >= torque_spec_nm * 0.95 and measured_torque_nm <= torque_spec_nm * 1.10 (asymmetric window, inclusive both ends)"
        side_effects:
          - "torque_status = PASS; measured_torque_nm stored"
          - "when insulation_status == PASS the derived certification_status moves PENDING -> CERTIFIED"
        note: "Independent of the insulation axis; either axis may be recorded first."
      - from: PENDING
        to: FAIL
        trigger: "POST /battery-assemblies/{id}/verifications with verification_type=TORQUE"
        actor: QualityInspector
        preconditions:
          - "torque_status == PENDING"
          - "lot.process_state == ASSEMBLY"
          - "connection_count == 2 * module_count"
          - "measured_torque_nm < torque_spec_nm * 0.95 or measured_torque_nm > torque_spec_nm * 1.10"
        side_effects:
          - "torque_status = FAIL; measured_torque_nm stored"
          - "derived certification_status moves PENDING -> REJECTED regardless of the insulation axis"
      - from: FAIL
        to: PENDING
        trigger: "POST /battery-assemblies/{id}/rework"
        actor: ProductionSupervisor
        preconditions:
          - "certification_status IN {REJECTED, REVOKED}"
          - "lot.process_state == ASSEMBLY"
          - "rework_count < 3"
        side_effects:
          - "torque_status = PENDING; measured_torque_nm = null; rework_count += 1"
      - from: PASS
        to: PENDING
        trigger: "POST /battery-assemblies/{id}/rework"
        actor: ProductionSupervisor
        preconditions:
          - "certification_status IN {REJECTED, REVOKED}"
          - "lot.process_state == ASSEMBLY"
          - "rework_count < 3"
        side_effects:
          - "torque_status = PENDING; measured_torque_nm = null; rework_count += 1"

  - entity: BatteryAssembly
    state_field: insulation_status
    initial_state: PENDING
    terminal_states: []
    shape: parallel
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /battery-assemblies/{id}/verifications with verification_type=INSULATION_RESISTANCE"
        actor: QualityInspector
        preconditions:
          - "insulation_status == PENDING"
          - "lot.process_state == ASSEMBLY"
          - "test_voltage_v >= 500"
          - "measured_ir_megaohm >= ir_min_megaohm"
        side_effects:
          - "insulation_status = PASS; measured_ir_megaohm stored"
          - "when torque_status == PASS the derived certification_status moves PENDING -> CERTIFIED"
      - from: PENDING
        to: FAIL
        trigger: "POST /battery-assemblies/{id}/verifications with verification_type=INSULATION_RESISTANCE"
        actor: QualityInspector
        preconditions:
          - "insulation_status == PENDING"
          - "lot.process_state == ASSEMBLY"
          - "test_voltage_v >= 500"
          - "measured_ir_megaohm < ir_min_megaohm"
        side_effects:
          - "insulation_status = FAIL; measured_ir_megaohm stored"
          - "derived certification_status moves PENDING -> REJECTED"
      - from: FAIL
        to: PENDING
        trigger: "POST /battery-assemblies/{id}/rework"
        actor: ProductionSupervisor
        preconditions:
          - "certification_status IN {REJECTED, REVOKED}"
          - "rework_count < 3"
        side_effects:
          - "insulation_status = PENDING; measured_ir_megaohm = null"
      - from: PASS
        to: PENDING
        trigger: "POST /battery-assemblies/{id}/rework"
        actor: ProductionSupervisor
        preconditions:
          - "certification_status IN {REJECTED, REVOKED}"
          - "rework_count < 3"
        side_effects:
          - "insulation_status = PENDING; measured_ir_megaohm = null"

  - entity: BatteryAssembly
    state_field: certification_status
    initial_state: PENDING
    terminal_states: []
    shape: compound
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "system: the second of the two verification axes reaches PASS"
        actor: system
        preconditions:
          - "torque_status == PASS and insulation_status == PASS"
        side_effects:
          - "certification_status = CERTIFIED; the assembly becomes eligible as a CapacityTest subject"
      - from: PENDING
        to: REJECTED
        trigger: "system: either verification axis reaches FAIL"
        actor: system
        preconditions:
          - "torque_status == FAIL or insulation_status == FAIL"
        side_effects:
          - "certification_status = REJECTED; the assembly is not a valid CapacityTest subject"
      - from: CERTIFIED
        to: REVOKED
        trigger: "system: owning lot moved LOT_TESTING -> QUARANTINED"
        actor: system
        preconditions:
          - "certification_status == CERTIFIED"
        side_effects:
          - "certification_status = REVOKED (CASCADE B hop 3)"
          - "every SCHEDULED CapacityTest on this assembly moves SCHEDULED -> VOIDED (CASCADE B hop 4)"
      - from: REVOKED
        to: PENDING
        trigger: "POST /production-lots/{id}/disposition with action=RETEST, or POST /battery-assemblies/{id}/rework"
        actor: system | ProductionSupervisor
        preconditions:
          - "certification_status == REVOKED"
        side_effects:
          - "certification_status = PENDING; torque_status = PENDING; insulation_status = PENDING"
      - from: REJECTED
        to: PENDING
        trigger: "POST /battery-assemblies/{id}/rework"
        actor: ProductionSupervisor
        preconditions:
          - "certification_status == REJECTED"
          - "rework_count < 3"
        side_effects:
          - "certification_status = PENDING; both axes reset to PENDING; rework_count += 1"

  - entity: CapacityTest
    state_field: test_state
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, VOIDED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /capacity-tests/{id}/record-result"
        actor: QualityInspector
        preconditions:
          - "test_state == SCHEDULED"
          - "lot.process_state == LOT_TESTING"
          - "lot.env_hold_status == CLEAR"
          - "logical now >= scheduled_end_at"
          - "measured_capacity_ah > 0; cycles_completed >= 0"
        side_effects:
          - "test_state = COMPLETED; result and yield_pct written by calculations.capacity_test_result; recorded_by_worker_id = acting worker id"
          - "lot.completed_test_count += 1; lot.last_test_recorded_by_worker_id = acting worker id"
          - "on result == FAIL: CASCADE B hop 1 — lot.failed_test_count += 1"
          - "on result == PASS and test_type == CYCLE_LIFE: lot.passed_cycle_life_count += 1"
          - "when lot.failed_test_count > lot.acceptance_number the lot moves LOT_TESTING -> QUARANTINED (CASCADE B hop 2) with its own downstream hops"
          - "lot.lot_capacity_yield_pct recomputed by calculations.lot_capacity_yield"
      - from: SCHEDULED
        to: VOIDED
        trigger: "system: owning assembly moved CERTIFIED -> REVOKED or the lot was SCRAPPED"
        actor: system
        preconditions:
          - "test_state == SCHEDULED"
        side_effects:
          - "test_state = VOIDED; the chamber draw of this test no longer counts toward the aggregate cap"
          - "result stays null and the test never enters lot.completed_test_count"

  - entity: BatteryUnit
    state_field: warranty_status
    initial_state: IN_SERVICE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: IN_SERVICE
        to: CLAIM_OPEN
        trigger: "POST /battery-units/{id}/warranty-claims"
        actor: WarrantyAdministrator
        preconditions:
          - "warranty_status == IN_SERVICE (CLAIM_HONORED and CLAIM_PRORATED are settled and rejected with ERR_WARRANTY_ALREADY_SETTLED)"
          - "expected_battery_unit_version matches unit.version (OCC, §1.2.1)"
        side_effects:
          - "warranty_status = CLAIM_OPEN; claim_count += 1; last_claim_at = logical now"
          - "months_in_service, cycle_count, watering_events_expected / watering_events_ok / watering_compliance_ratio recomputed as of logical now"
          - "unit.version += 1"
      - from: CLAIM_DENIED
        to: CLAIM_OPEN
        trigger: "POST /battery-units/{id}/warranty-claims (re-claim supersedes the prior adjudication)"
        actor: WarrantyAdministrator
        preconditions:
          - "warranty_status == CLAIM_DENIED"
          - "expected_battery_unit_version matches unit.version"
        side_effects:
          - "warranty_status = CLAIM_OPEN; claim_count += 1; warranty_decision and warranty_credit_cents reset to null / 0"
          - "unit.version += 1"
        note: "This loop back into CLAIM_OPEN is the true race guarded by OCC in §1.2.1."
      - from: CLAIM_OPEN
        to: CLAIM_HONORED
        trigger: "POST /battery-units/{id}/warranty-adjudication with inspection_finding=DEFECT_CONFIRMED"
        actor: WarrantyAdministrator
        preconditions:
          - "warranty_status == CLAIM_OPEN"
          - "calculations.warranty_settlement yields decision HONORED (usage_fraction <= 0.10 and compliance gate passed)"
        side_effects:
          - "warranty_decision = HONORED; warranty_credit_cents = list_price_cents"
      - from: CLAIM_OPEN
        to: CLAIM_PRORATED
        trigger: "POST /battery-units/{id}/warranty-adjudication with inspection_finding=DEFECT_CONFIRMED"
        actor: WarrantyAdministrator
        preconditions:
          - "warranty_status == CLAIM_OPEN"
          - "calculations.warranty_settlement yields decision PRORATED"
        side_effects:
          - "warranty_decision = PRORATED; warranty_credit_cents = prorated amount from calculations.warranty_settlement"
      - from: CLAIM_OPEN
        to: CLAIM_DENIED
        trigger: "POST /battery-units/{id}/warranty-adjudication"
        actor: WarrantyAdministrator
        preconditions:
          - "warranty_status == CLAIM_OPEN"
          - "calculations.warranty_settlement yields DENIED_USAGE, DENIED_MAINTENANCE or DENIED_NO_DEFECT"
        side_effects:
          - "warranty_decision set to the denying reason; warranty_credit_cents = 0"

  - entity: BatteryUnit
    state_field: core_status
    initial_state: DEPOSIT_HELD
    terminal_states: [RECYCLED, REJECTED, NOT_APPLICABLE]
    shape: linear
    transitions:
      - from: DEPOSIT_HELD
        to: RETURN_OPEN
        trigger: "POST /battery-units/{id}/core-return"
        actor: WarrantyAdministrator
        preconditions:
          - "core_status == DEPOSIT_HELD"
          - "lot.chemistry == LEAD_ACID"
          - "declared_lead_kg > 0"
        side_effects:
          - "core_status = RETURN_OPEN; core_manifest_number and declared_lead_kg stored"
          - "INVARIANT C1 holds: the unit still counts toward plant.core_deposit_liability_cents"
        note: "Independent of warranty_status: a unit can be CLAIM_OPEN and RETURN_OPEN at once."
      - from: RETURN_OPEN
        to: IN_TRANSIT
        trigger: "POST /battery-units/{id}/core-return/transitions with action=SHIP"
        actor: WarrantyAdministrator
        preconditions:
          - "core_status == RETURN_OPEN"
        side_effects:
          - "core_status = IN_TRANSIT"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /battery-units/{id}/core-return/transitions with action=RECEIVE"
        actor: WarrantyAdministrator
        preconditions:
          - "core_status == IN_TRANSIT"
          - "abs(received_lead_kg - cell_design.lead_content_kg) <= cell_design.lead_content_kg * 0.02"
        side_effects:
          - "core_status = RECEIVED; received_lead_kg stored"
          - "INVARIANT L1: plant.lead_in_field_kg -= cell_design.lead_content_kg and plant.lead_recycled_kg += cell_design.lead_content_kg, so lead_mass_variance_kg stays 0.000"
          - "plant.core_lead_variance_kg += round(received_lead_kg - cell_design.lead_content_kg, 3)"
          - "the deposit is NOT settled yet: core_deposit_liability_cents is untouched until RECYCLE or REJECT"
      - from: RECEIVED
        to: RECYCLED
        trigger: "POST /battery-units/{id}/core-return/transitions with action=RECYCLE"
        actor: WarrantyAdministrator
        preconditions:
          - "core_status == RECEIVED"
        side_effects:
          - "core_status = RECYCLED (terminal regulatory disposition)"
          - "INVARIANT C1 (compensation): core_credit_issued_cents = CORE_DEPOSIT_CENTS and plant.core_deposit_liability_cents -= CORE_DEPOSIT_CENTS, so the liability opened at shipment closes exactly"
      - from: IN_TRANSIT
        to: REJECTED
        trigger: "POST /battery-units/{id}/core-return/transitions with action=REJECT"
        actor: WarrantyAdministrator
        preconditions:
          - "core_status == IN_TRANSIT"
        side_effects:
          - "core_status = REJECTED; core_credit_issued_cents stays 0 (deposit forfeited)"
          - "INVARIANT C1 (compensation): plant.core_deposit_liability_cents -= CORE_DEPOSIT_CENTS"
          - "INVARIANT L1: plant.lead_in_field_kg -= cell_design.lead_content_kg and plant.lead_recycled_kg += cell_design.lead_content_kg (the rejected core is still processed on site)"
          - "no mass moves twice: a REJECTED core never passed through RECEIVED"

# =====================================================================
# 1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =====================================================================
concurrency_rules:
  - rule_id: sampling-plan-create-stale-lot
    parent_entity: ProductionLot
    write_endpoint: "POST /production-lots/{id}/sampling-plans"
    occ_field: "expected_lot_version"
    description: |
      Creating a sampling plan against a ProductionLot whose version has
      advanced since the client last read it is rejected. A new sampling plan
      legitimately supersedes the prior one (sampling_plan_revision += 1 and
      every sampling counter resets), so a writer holding a stale view of the
      lot would silently discard test results recorded against the plan it
      never saw. The check is a stale-version comparison, not a timing rule.

      Version bump scope (normative): ProductionLot.version is incremented only
      by writes addressed to the lot itself (advance, sampling-plans,
      disposition, env-hold), by writes that mutate a lot-owned counter
      (capacity-test record-result, which moves completed_test_count,
      failed_test_count and passed_cycle_life_count) and by any §1.7 cascade
      that touches the lot. Creating a child BatteryAssembly, recording a
      verification on one, reworking one or scheduling a CapacityTest do NOT
      bump the lot's version, so a version read at the ASSEMBLY advance is
      still current when the first sampling plan is drawn.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: warranty-claim-create-stale-unit
    parent_entity: BatteryUnit
    write_endpoint: "POST /battery-units/{id}/warranty-claims"
    occ_field: "expected_battery_unit_version"
    description: |
      Opening a warranty claim against a BatteryUnit whose version has advanced
      since the client last read it is rejected. A re-claim on a CLAIM_DENIED
      unit legitimately supersedes the previous adjudication (warranty_decision
      and warranty_credit_cents reset), and maintenance/cycle reports also bump
      the unit's version, so a stale claimant would adjudicate against cycle
      and watering figures that no longer exist.
    error_id: ERR_STALE_BATTERY_UNIT_VERSION
    http_status: 412

# =====================================================================
# 1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: formation_energy_charge
    trigger: "On POST /formation-runs (variant provisional_nameplate) and on POST /formation-runs/{id}/complete (variant final_metered)"
    algorithm: tiered_pricing
    formula: |
      # ---- Step 1: energy quantity ----------------------------------------
      # provisional_nameplate (at scheduling):
      #   theoretical_kwh = quantity * cells_per_battery * nominal_capacity_ah
      #                     * cell_nominal_voltage_v * charge_factor_used / 1000
      #   nameplate_kwh   = bay.rated_power_kw * scheduled_duration_hours
      #                     * BAY_UTILIZATION_FACTOR
      #   estimated_energy_kwh = round(min(theoretical_kwh, nameplate_kwh), 2)
      # final_metered (at completion):
      #   energy_kwh = metered_energy_kwh (operator-supplied meter reading)
      #
      # ---- Step 2: band split (differs per variant) -------------------------
      # provisional_nameplate splits the SCHEDULED window:
      #   peak_hours    = scheduled_peak_hours     # hours inside [08:00,20:00) UTC
      #   offpeak_hours = scheduled_offpeak_hours
      # final_metered splits the ACTUAL window [actual_start_at, actual_end_at):
      #   peak_hours    = actual_peak_hours
      #   offpeak_hours = actual_offpeak_hours
      # total_hours = peak_hours + offpeak_hours   (4 dp, round_half_up)
      #
      # ---- Step 3: proportional allocation ---------------------------------
      # kwh_peak    = round(energy_kwh * peak_hours / total_hours, 2)
      # kwh_offpeak = round(energy_kwh - kwh_peak, 2)
      #
      # ---- Step 4: PINNED ROUNDING ORDER -----------------------------------
      # Round EACH BAND to whole cents FIRST, then sum:
      #   charge_cents = round_half_up(kwh_peak    * plant.peak_tariff_cents_per_kwh)
      #                + round_half_up(kwh_offpeak * plant.offpeak_tariff_cents_per_kwh)
      # The alternative order (sum the two band products, then round once) is
      # explicitly REJECTED and yields a different cent value for the same
      # inputs. Band products are never summed before rounding.
      #
      # ---- Step 5: emission bookkeeping ------------------------------------
      # emission_g = round(energy_kwh * LEAD_EMISSION_FACTOR_G_PER_KWH[lot.chemistry], 2)
      #   provisional_nameplate -> reserved_emission_g (plant.emission_reserved_g += it)
      #   final_metered         -> consumed_emission_g (reservation released, consumption booked)
    input_set: |
      One FormationRun. Band hours are derived from wall-clock UTC hours of the
      relevant window; a window spanning midnight is split per calendar day
      before banding. Only runs with run_state IN {SCHEDULED, CHARGING} keep a
      reservation on the plant; only COMPLETED runs contribute consumption and
      final_charge_cents. ABORTED runs contribute neither.
    constants:
      BAY_UTILIZATION_FACTOR: 0.85
      PEAK_BAND_START_UTC_HOUR: 8
      PEAK_BAND_END_UTC_HOUR: 20
      LEAD_EMISSION_FACTOR_G_PER_KWH_LEAD_ACID: 2.5
      LEAD_EMISSION_FACTOR_G_PER_KWH_LITHIUM_LFP: 0.5
      FORMATION_CAPACITY_MIN_PCT: 92.00
    precision: "kWh 2 decimal places round_half_up; hours 4 decimal places round_half_up; money whole cents round_half_up per band"
    variants:
      - name: provisional_nameplate
        when: "At POST /formation-runs, before any energy has flowed"
        difference: "Energy is min(theoretical, nameplate*utilization) and the band split uses the SCHEDULED window; result lands in provisional_charge_cents / reserved_emission_g."
      - name: final_metered
        when: "At POST /formation-runs/{id}/complete"
        difference: "Energy is the metered reading and the band split uses the ACTUAL window, so a run that started late is banded differently; result lands in final_charge_cents / consumed_emission_g. For identical lot data the two variants differ in both energy and band mix."

  - name: worker_exposure_index
    trigger: "On POST /workers/{id}/exposure-samples (variant selected by sample_type) and on POST /workers/{id}/medical-clearance (variant blood_peak_180d)"
    algorithm: weighted_scoring
    formula: |
      # variant air_twa_90d  (sample_type == AIR)
      #   window   = samples with sample_type == AIR and
      #              sampled_at >= logical_now - 90 days   (INCLUSIVE lower bound)
      #              and sampled_at <= logical_now
      #   twa      = round( sum(air_lead_ug_per_m3 * sample_duration_minutes)
      #                     / sum(sample_duration_minutes), 3 )
      #   index    = round( twa / PEL_AIR_UG_PER_M3 * 100, 2 )
      #
      # variant blood_peak_180d  (sample_type == BLOOD)
      #   window   = samples with sample_type == BLOOD and
      #              sampled_at >= logical_now - 180 days  (INCLUSIVE lower bound)
      #   peak     = max(blood_lead_ug_per_dl) over the window
      #   index    = round( peak / BLL_LIMIT_UG_PER_DL * 100, 2 )
      #
      # worker.exposure_index        = index of the variant that ran
      # worker.exposure_index_variant = AIR_TWA_90D | BLOOD_PEAK_180D
      # removal: index >= REMOVAL_INDEX_THRESHOLD -> ACTIVE -> MEDICAL_REMOVAL
      #   (>= is exact: 100.00 removes, 99.99 does not)
    input_set: |
      ExposureSample rows of one worker, filtered by sample_type and by the
      variant's trailing window measured from the logical clock. Samples on the
      exact window boundary are INCLUDED. AIR samples never enter the blood
      variant and BLOOD samples never enter the air variant, so the two
      variants read disjoint slices of the same append-only log and produce
      different index values for the same worker on the same day.
    constants:
      PEL_AIR_UG_PER_M3: 50
      BLL_LIMIT_UG_PER_DL: 30
      REMOVAL_INDEX_THRESHOLD: 100.00
      BLL_RETURN_THRESHOLD_UG_PER_DL: 20.0
      AIR_WINDOW_DAYS: 90
      BLOOD_WINDOW_DAYS: 180
      CLEARANCE_BLOOD_WINDOW_DAYS: 30
    precision: "twa 3 decimal places round_half_up; index 2 decimal places round_half_up"
    variants:
      - name: air_twa_90d
        when: "Triggering sample_type == AIR"
        difference: "Duration-weighted 90-day average against the airborne PEL; a single high short sample is diluted by long clean samples."
      - name: blood_peak_180d
        when: "Triggering sample_type == BLOOD, and on medical clearance"
        difference: "Unweighted 180-day maximum against the blood-lead limit; a single high reading dominates forever inside the window."

  - name: lot_sampling_plan
    trigger: "On POST /production-lots/{id}/sampling-plans and on POST /production-lots/{id}/disposition with action=RETEST (which creates the tightened plan)"
    algorithm: threshold
    formula: |
      base_n   = ceil(sqrt(lot.quantity))
      chem_adj = base_n + 2  if lot.chemistry == LITHIUM_LFP else base_n
      n0       = max(3, min(chem_adj, 12))            # nested clamp, both ends bind
      c0       = 0 if n0 <= 4 else (1 if n0 <= 8 else 2)   # tiered acceptance number
      if lot.retest_count >= 1 and cell_design.retest_tightening_enabled:
          sample_size       = min(n0 * 2, 20)
          acceptance_number = max(c0 - 1, 0)
      else:
          sample_size       = n0
          acceptance_number = c0
    input_set: |
      Exactly one ProductionLot, read AFTER retest_count has been incremented by
      the RETEST transition, so the first retest already sees the tightened
      branch. quantity, chemistry, retest_count and the design's
      retest_tightening_enabled flag are the four inputs; they interact
      non-linearly through ceil(sqrt(...)), a chemistry offset, a two-sided
      clamp and a tier table.
    constants:
      SAMPLE_MIN: 3
      SAMPLE_MAX: 12
      SAMPLE_MAX_TIGHTENED: 20
      LITHIUM_SAMPLE_OFFSET: 2
      RETEST_MAX: 2
    precision: "integers only; ceil for the square root, no rounding elsewhere"

  - name: capacity_test_result
    trigger: "On POST /capacity-tests/{id}/record-result"
    algorithm: threshold
    formula: |
      nominal = cell_design.nominal_capacity_ah        # of the assembly's lot design
      yield_pct = round(measured_capacity_ah / nominal * 100, 2)
      if test_type == CAPACITY:
          result = PASS if measured_capacity_ah >= round(nominal * CAPACITY_ACCEPT_RATIO, 1) else FAIL
      else:  # CYCLE_LIFE
          cycles_required = ceil(cell_design.rated_cycles * CYCLE_ACCEPT_RATIO)
          result = PASS if (cycles_completed >= cycles_required
                            and measured_capacity_ah >= round(nominal * CYCLE_END_OF_LIFE_RATIO, 1))
                        else FAIL
    input_set: "One CapacityTest plus the pinned design revision of the assembly's lot. The >= comparisons are exact: a reading equal to the rounded threshold PASSES."
    constants:
      CAPACITY_ACCEPT_RATIO: 0.95
      CYCLE_ACCEPT_RATIO: 0.90
      CYCLE_END_OF_LIFE_RATIO: 0.80
    precision: "yield_pct 2 decimal places round_half_up; thresholds rounded to 1 decimal place before comparison"

  - name: lot_capacity_yield
    trigger: "On POST /capacity-tests/{id}/record-result and on POST /production-lots/{id}/disposition with action=RELEASE"
    algorithm: aggregation
    formula: |
      window = CapacityTest rows whose assembly belongs to this lot,
               test_state == COMPLETED, result == PASS, and
               created_at >= the creation instant of the CURRENT sampling plan
               (sampling_plan_revision window; inclusive lower bound, no upper bound)
      if count(window) == 0:
          lot_capacity_yield_pct = null
      else:
          # PINNED ORDER: per-test yield_pct is already rounded to 2 dp when the
          # result was recorded; average those rounded values, then round again.
          lot_capacity_yield_pct = round( sum(t.yield_pct for t in window)
                                          / count(window), 2 )
      # The pooled alternative — round(sum(measured_capacity_ah)
      #   / (count * nominal) * 100, 2) — is explicitly REJECTED.
      # Ordering for the sum is created_at ASC; the sum is commutative but the
      # order is pinned so a partial-window audit is reproducible.
    input_set: "PASS-result COMPLETED CapacityTest rows of the lot inside the current sampling-plan window; FAIL and VOIDED tests are excluded; tests from a superseded sampling plan are excluded."
    constants: {}
    precision: "2 decimal places, round_half_up, applied twice (per test, then on the mean)"

  - name: plant_compliance_posture
    trigger: "System recompute after every write that changes plant.permit_status, worker.removal_status, emission_reserved_g or emission_consumed_g"
    algorithm: threshold
    formula: |
      ratio = round((emission_reserved_g + emission_consumed_g)
                    / monthly_lead_emission_permit_g, 4)
      if permit_status == SUSPENDED
         or open_medical_removal_count >= 2
         or ratio >= POSTURE_FROZEN_RATIO:          # 1.0000, inclusive
          posture = FROZEN
      elif open_medical_removal_count == 1
         or ratio >= POSTURE_RESTRICTED_RATIO:      # 0.8500, inclusive
          posture = RESTRICTED
      else:
          posture = OPEN
    input_set: |
      One Plant. emission_reserved_g sums FormationRun.reserved_emission_g over
      runs of this plant's lots with run_state IN {SCHEDULED, CHARGING};
      emission_consumed_g sums consumed_emission_g over COMPLETED runs whose
      actual_end_at falls in the current permit month (the calendar month of the
      logical clock, UTC). Aborted runs contribute to neither sum.
    constants:
      POSTURE_RESTRICTED_RATIO: 0.8500
      POSTURE_FROZEN_RATIO: 1.0000
      REMOVALS_FOR_RESTRICTED: 1
      REMOVALS_FOR_FROZEN: 2
    precision: "ratio 4 decimal places round_half_up; comparisons are inclusive (>=) at both breakpoints"

  - name: motive_power_sizing
    trigger: "On POST /fleet-sizing-requests"
    algorithm: constraint_propagation
    formula: |
      daily_energy_kwh   = round(shift_energy_kwh_per_shift * shifts_per_day, 2)
      temp_derate_factor = round(min(1.0 + max(0, 15 - ambient_temp_c) * 0.01, 1.25), 4)
      reserve_factor     = 1.15 if shifts_per_day >= 2 else 1.05
      # required_ah depends on the CANDIDATE's chemistry (DoD cap), so it is
      # evaluated per candidate rather than once:
      required_ah(d) = ceil( daily_energy_kwh * 1000 / required_voltage_v
                             / DOD_CAP[d.chemistry]
                             * temp_derate_factor * reserve_factor )
      #
      # ---- CIRCULAR-LOOKING DEPENDENCY, EVALUATION ORDER PINNED ------------
      # The pack choice depends on charger feasibility (recharge hours must fit
      # the charge window) while charger feasibility depends on the pack's
      # capacity. The order below is normative:
      #
      # (1) design_candidates = CellDesign rows where
      #       approval_state == APPROVED
      #       and (chemistry_preference == ANY or chemistry == chemistry_preference)
      #       and nominal_pack_voltage_v == required_voltage_v
      #       and pack_weight_kg <= compartment_max_kg
      #       and nominal_capacity_ah >= required_ah(d)
      #     evaluated_design_count = count(design_candidates)
      # (2) sort design_candidates by nominal_capacity_ah ASC,
      #                            then pack_weight_kg ASC,
      #                            then created_at ASC        # never id
      # (3) for d in that order:
      #       charger_candidates(d) = Charger rows where
      #           charger_status == AVAILABLE
      #           and chemistry_compatibility == d.chemistry
      #           and output_voltage_v == required_voltage_v
      #           and charge_hours(d, c) <= charge_window_hours
      #       where charge_hours(d, c) = round( d.nominal_capacity_ah
      #             * DOD_CAP[d.chemistry] * SIZING_CHARGE_FACTOR[d.chemistry]
      #             / c.output_amps, 2 )
      #       if charger_candidates(d) is non-empty:
      #           selected_cell_design_id = d.id
      #           selected_charger_id     = min(charger_candidates(d)) ordered by
      #               price_cents ASC, then output_amps ASC, then created_at ASC
      #           selected_charge_hours   = charge_hours(d, selected charger)
      #           required_ah             = required_ah(d)
      #           break
      # (4) fallback: if evaluated_design_count == 0 -> ERR_NO_ELIGIBLE_CELL_DESIGN
      #     else if no candidate had a feasible charger -> ERR_NO_CHARGER_MATCH
      #     (no FleetSizingRequest row is persisted in either case)
      #
      # ---- fleet analysis --------------------------------------------------
      # recommended_battery_count =
      #     forklift_count * (1 if shifts_per_day == 1 else 2)   if LEAD_ACID
      #     forklift_count                                        if LITHIUM_LFP
      # recommended_charger_count =
      #     ceil(recommended_battery_count / 2)                   if LEAD_ACID
      #     forklift_count                                        if LITHIUM_LFP
      # fleet_capital_cents = recommended_battery_count * d.list_price_cents
      #                     + recommended_charger_count * charger.price_cents
    input_set: |
      All CellDesign rows (any chemistry, only approval_state == APPROVED are
      eligible; RETIRED, DRAFT, UNDER_REVIEW and CHANGES_REQUESTED designs are
      excluded) and all Charger rows with charger_status == AVAILABLE.
      DISCONTINUED chargers are excluded from the pool.
    constants:
      DOD_CAP_LEAD_ACID: 0.80
      DOD_CAP_LITHIUM_LFP: 0.90
      SIZING_CHARGE_FACTOR_LEAD_ACID: 1.15
      SIZING_CHARGE_FACTOR_LITHIUM_LFP: 1.05
      TEMP_DERATE_REFERENCE_C: 15
      TEMP_DERATE_PER_DEGREE: 0.01
      TEMP_DERATE_MAX: 1.25
      RESERVE_FACTOR_SINGLE_SHIFT: 1.05
      RESERVE_FACTOR_MULTI_SHIFT: 1.15
      LEAD_ACID_BATTERIES_PER_CHARGER: 2
    precision: "required_ah integer via ceil; derate 4 decimal places round_half_up; charge hours 2 decimal places round_half_up; money whole cents"

  - name: watering_compliance_ratio
    trigger: "On POST /battery-units/{id}/maintenance-logs, on POST /battery-units/{id}/warranty-claims and on POST /battery-units/{id}/warranty-adjudication"
    algorithm: aggregation
    formula: |
      months_in_service = floor((logical_now - shipped_at) / 30 days)
      if lot.chemistry == LITHIUM_LFP:
          watering_events_expected = 0
          watering_compliance_ratio = 1.0000     # watering is not applicable
      else:
          watering_events_expected = months_in_service * WATERING_EVENTS_PER_MONTH
          watering_events_ok = count(MaintenanceLog rows of this unit with
                                     event_type == WATERING
                                     and electrolyte_level_ok == true
                                     and performed_at >= shipped_at
                                     and performed_at <= logical_now)
          if watering_events_expected == 0:
              watering_compliance_ratio = 1.0000        # zero-denominator edge
          else:
              watering_compliance_ratio = round(min(1.0,
                  watering_events_ok / watering_events_expected), 4)
    input_set: "WATERING MaintenanceLog rows of one unit with electrolyte_level_ok == true inside [shipped_at, logical_now]; EQUALIZE, INSPECTION and CYCLE_REPORT rows never count, and WATERING rows with electrolyte_level_ok == false never count."
    constants:
      WATERING_EVENTS_PER_MONTH: 1
      SERVICE_MONTH_DAYS: 30
    precision: "ratio 4 decimal places round_half_up, capped at 1.0000"

  - name: warranty_settlement
    trigger: "On POST /battery-units/{id}/warranty-adjudication"
    algorithm: waterfall_allocation
    formula: |
      cycle_fraction    = cycle_count / cell_design.rated_cycles
      calendar_fraction = months_in_service / cell_design.warranty_months
      usage_fraction    = round(max(cycle_fraction, calendar_fraction), 4)
      # Ordered gate cascade — the FIRST matching branch wins:
      if inspection_finding == NO_DEFECT_FOUND:
          decision = DENIED_NO_DEFECT ; credit_cents = 0
      elif usage_fraction >= 1.0000:
          decision = DENIED_USAGE ; credit_cents = 0
      elif lot.chemistry == LEAD_ACID and watering_compliance_ratio < 0.8000:
          decision = DENIED_MAINTENANCE ; credit_cents = 0
      elif usage_fraction <= 0.1000:
          decision = HONORED ; credit_cents = list_price_cents
      else:
          multiplier  = 1.00 if watering_compliance_ratio >= 0.9500 else 0.90
          decision    = PRORATED
          credit_cents = round_half_up(list_price_cents
                                       * (1 - usage_fraction) * multiplier)
    input_set: "One BatteryUnit with cycle_count, months_in_service and watering_compliance_ratio evaluated as of the adjudication call, against the lot's pinned design revision."
    constants:
      WATERING_COMPLIANCE_MIN: 0.8000
      WATERING_FULL_CREDIT_MIN: 0.9500
      REDUCED_COMPLIANCE_MULTIPLIER: 0.90
      EARLY_FAILURE_USAGE_MAX: 0.1000
    precision: "usage_fraction 4 decimal places round_half_up; credit whole cents round_half_up applied once at the end"

  - name: plant_lead_mass_balance
    trigger: "On POST /battery-units (ship) and on POST /battery-units/{id}/core-return/transitions with action IN {RECEIVE, REJECT}"
    algorithm: aggregation
    formula: |
      lead_inventory_kg = round(lead_initial_inventory_kg
          - sum(design.lead_content_kg for every BatteryUnit shipped from this plant), 3)
      lead_in_field_kg  = round(sum(design.lead_content_kg for BatteryUnit rows of
          this plant's lots with core_status IN {DEPOSIT_HELD, RETURN_OPEN, IN_TRANSIT}), 3)
      lead_recycled_kg  = round(sum(design.lead_content_kg for BatteryUnit rows of
          this plant's lots with core_status IN {RECEIVED, RECYCLED, REJECTED}), 3)
      lead_mass_variance_kg = round(lead_initial_inventory_kg
          - (lead_inventory_kg + lead_in_field_kg + lead_recycled_kg), 3)
      # INVARIANT L1: lead_mass_variance_kg == 0.000 after every ship, receive
      # and reject. LITHIUM_LFP designs carry lead_content_kg == 0 and therefore
      # move none of these quantities.
      core_lead_variance_kg = round(sum(received_lead_kg - design.lead_content_kg
          for BatteryUnit rows with core_status IN {RECEIVED, RECYCLED}), 3)
    input_set: "Every BatteryUnit of this plant's lots, partitioned by core_status; NOT_APPLICABLE (lithium) units contribute 0.000 to every term."
    constants:
      CORE_MASS_TOLERANCE_RATIO: 0.02
      CORE_DEPOSIT_CENTS: 12500
    precision: "3 decimal places, round_half_up on every term"

# =====================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority;
#     the FIRST failing rule determines the response error_id)
# =====================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles (Anonymous is never accepted)."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the called endpoint's roles list in §1.5."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: required fields present, no unknown fields, enum members valid, numeric ranges honoured, and event-discriminated fields obey their rule (WATERING requires electrolyte_level_ok and forbids cycles_delta; CYCLE_REPORT requires cycles_delta and forbids electrolyte_level_ok; AIR samples require air_lead_ug_per_m3 + sample_duration_minutes and forbid blood_lead_ug_per_dl; BLOOD samples require blood_lead_ug_per_dl and forbid the AIR pair)."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "For entity_backed roles (DesignEngineer, ProductionSupervisor, QualityInspector, SafetyOfficer) the X-User-ID resolves to a Worker row."
    error_id: ERR_ACTING_WORKER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose roles include an entity_backed role"

  - priority: 5
    category: business_safety
    check: "The acting Worker has removal_status == ACTIVE; a medically removed employee may not perform any operation."
    error_id: ERR_ACTOR_MEDICALLY_REMOVED
    http_status: 403
    applies_to: "all endpoints whose roles include an entity_backed role"

  - priority: 6
    category: auth
    check: "Job-class-restricted operations require a matching Worker.job_class: APPROVE on a cell design requires ENGINEER, recording an exposure sample requires SAFETY, RELEASE of a lot requires QUALITY."
    error_id: ERR_ACTOR_JOB_CLASS_MISMATCH
    http_status: 403
    applies_to: "POST /cell-designs/{id}/review-actions (action=APPROVE), POST /workers/{id}/exposure-samples, POST /production-lots/{id}/disposition (action=RELEASE)"

  - priority: 7
    category: existence
    check: "Every path-templated id resolves, validated left to right."
    error_id: "ERR_PLANT_NOT_FOUND | ERR_WORKER_NOT_FOUND | ERR_CELL_DESIGN_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_FORMATION_RUN_NOT_FOUND | ERR_ASSEMBLY_NOT_FOUND | ERR_CAPACITY_TEST_NOT_FOUND | ERR_SIZING_REQUEST_NOT_FOUND | ERR_BATTERY_UNIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 8
    category: existence
    check: "Every foreign key supplied in the body resolves (plant_id, cell_design_id, lot_id, bay_id, chamber_id, assembly_id, sizing_request_id, supersedes_design_id)."
    error_id: "ERR_PLANT_NOT_FOUND | ERR_CELL_DESIGN_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_FORMATION_BAY_NOT_FOUND | ERR_TEST_CHAMBER_NOT_FOUND | ERR_ASSEMBLY_NOT_FOUND | ERR_SIZING_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys"

  - priority: 9
    category: business_constraint
    check: "Uniqueness: Plant.site_code, CellDesign.code, Charger.model_code, BatteryAssembly.serial_number and BatteryUnit.serial_number are globally unique; FormationBay.bay_code and TestChamber.chamber_code are unique per plant_id; ProductionLot.lot_code is unique per plant_id."
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /plants, POST /cell-designs, POST /chargers, POST /formation-bays, POST /test-chambers, POST /production-lots, POST /battery-assemblies, POST /battery-units"

  - priority: 10
    category: state
    check: "OCC: expected_lot_version equals ProductionLot.version."
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /production-lots/{id}/sampling-plans"

  - priority: 10
    category: state
    check: "OCC: expected_battery_unit_version equals BatteryUnit.version."
    error_id: ERR_STALE_BATTERY_UNIT_VERSION
    http_status: 412
    applies_to: "POST /battery-units/{id}/warranty-claims"

  - priority: 11
    category: state
    check: "CellDesign.approval_state permits the requested review action or edit (PATCH requires DRAFT or CHANGES_REQUESTED; SUBMIT requires DRAFT; APPROVE and REQUEST_CHANGES require UNDER_REVIEW)."
    error_id: ERR_DESIGN_STATE_INVALID
    http_status: 409
    applies_to: "PATCH /cell-designs/{id}, POST /cell-designs/{id}/review-actions"

  - priority: 11
    category: state
    check: "ProductionLot.process_state permits the requested move (advance to_state must be the immediate successor of the current state; drawing a sampling plan requires ASSEMBLY, redrawing one requires LOT_TESTING; scheduling a capacity test requires ASSEMBLY or LOT_TESTING; RELEASE and QUARANTINE require LOT_TESTING; RETEST and SCRAP require QUARANTINED; shipping a unit requires RELEASED; creating an assembly requires ASSEMBLY; creating a formation run requires FORMATION)."
    error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /production-lots/{id}/advance, POST /production-lots/{id}/sampling-plans, POST /production-lots/{id}/disposition, POST /formation-runs, POST /battery-assemblies, POST /battery-units, POST /capacity-tests"

  - priority: 11
    category: state
    check: "FormationRun.run_state permits the transition (start requires SCHEDULED; complete requires CHARGING; abort requires SCHEDULED or CHARGING)."
    error_id: ERR_RUN_STATE_INVALID
    http_status: 409
    applies_to: "POST /formation-runs/{id}/start, POST /formation-runs/{id}/complete, POST /formation-runs/{id}/abort"

  - priority: 11
    category: state
    check: "The addressed BatteryAssembly verification axis is still PENDING; re-recording a TORQUE or INSULATION_RESISTANCE verdict on the same axis without an intervening rework is rejected."
    error_id: ERR_ASSEMBLY_AXIS_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /battery-assemblies/{id}/verifications"

  - priority: 11
    category: state
    check: "CapacityTest.test_state == SCHEDULED and logical now >= scheduled_end_at when a result is recorded."
    error_id: ERR_CAPACITY_TEST_STATE_INVALID
    http_status: 409
    applies_to: "POST /capacity-tests/{id}/record-result"

  - priority: 11
    category: state
    check: "BatteryUnit.warranty_status permits the operation: opening a claim requires IN_SERVICE or CLAIM_DENIED, and adjudication requires CLAIM_OPEN."
    error_id: ERR_WARRANTY_STATE_INVALID
    http_status: 409
    applies_to: "POST /battery-units/{id}/warranty-claims, POST /battery-units/{id}/warranty-adjudication"

  - priority: 11
    category: state
    check: "A unit whose warranty_status is CLAIM_HONORED or CLAIM_PRORATED is settled and may not open another claim."
    error_id: ERR_WARRANTY_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /battery-units/{id}/warranty-claims"

  - priority: 11
    category: state
    check: "BatteryUnit.core_status permits the core action (open requires DEPOSIT_HELD; SHIP requires RETURN_OPEN; RECEIVE and REJECT require IN_TRANSIT; RECYCLE requires RECEIVED)."
    error_id: ERR_CORE_STATE_INVALID
    http_status: 409
    applies_to: "POST /battery-units/{id}/core-return, POST /battery-units/{id}/core-return/transitions"

  - priority: 11
    category: state
    check: "Medical clearance requires the Worker to be in removal_status == MEDICAL_REMOVAL."
    error_id: ERR_WORKER_NOT_REMOVED
    http_status: 409
    applies_to: "POST /workers/{id}/medical-clearance"

  - priority: 12
    category: business_safety
    check: "plant.compliance_posture != FROZEN for any lot-advancing, run-starting, run-scheduling, assembly-creating or lot-releasing operation."
    error_id: ERR_PLANT_FROZEN
    http_status: 409
    applies_to: "POST /production-lots/{id}/advance, POST /production-lots/{id}/sampling-plans, POST /production-lots/{id}/disposition (RELEASE), POST /formation-runs, POST /formation-runs/{id}/start, POST /battery-assemblies, POST /battery-units"

  - priority: 12
    category: business_safety
    check: "plant.compliance_posture == OPEN is required to enter FORMATION and to start a formation run; RESTRICTED blocks both while allowing everything else."
    error_id: ERR_PLANT_RESTRICTED
    http_status: 409
    applies_to: "POST /production-lots/{id}/advance (to_state=FORMATION), POST /formation-runs/{id}/start"

  - priority: 12
    category: business_safety
    check: "lot.env_hold_status == CLEAR for every lot-advancing, run-scheduling, run-starting, verification-recording, sampling, result-recording and release operation."
    error_id: ERR_LOT_ENV_HELD
    http_status: 409
    applies_to: "POST /production-lots/{id}/advance, POST /production-lots/{id}/sampling-plans, POST /production-lots/{id}/disposition (RELEASE, RETEST), POST /formation-runs, POST /formation-runs/{id}/start, POST /battery-assemblies/{id}/verifications, POST /capacity-tests, POST /capacity-tests/{id}/record-result"

  - priority: 12
    category: business_safety
    check: "lot.chemistry is a member of plant.licensed_chemistries before any hazardous processing step begins."
    error_id: ERR_CHEMISTRY_NOT_LICENSED
    http_status: 409
    applies_to: "POST /production-lots, POST /production-lots/{id}/advance"

  - priority: 12
    category: business_safety
    check: "Medical clearance requires a BLOOD ExposureSample with sampled_at >= logical now - 30 days and blood_lead_ug_per_dl < 20.0."
    error_id: ERR_CLEARANCE_EVIDENCE_MISSING
    http_status: 409
    applies_to: "POST /workers/{id}/medical-clearance"

  - priority: 12
    category: business_temporal
    check: "ExposureSample.sampled_at is <= logical now and >= worker.hire_date; MaintenanceLog.performed_at is within [unit.shipped_at, logical now]."
    error_id: ERR_EVENT_TIME_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /workers/{id}/exposure-samples, POST /battery-units/{id}/maintenance-logs"

  - priority: 13
    category: business_constraint
    check: "Segregation of duties: the APPROVE actor differs from CellDesign.submitted_by_worker_id, and the RELEASE actor differs from ProductionLot.last_test_recorded_by_worker_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /cell-designs/{id}/review-actions (action IN {APPROVE, REQUEST_CHANGES}), POST /production-lots/{id}/disposition (action=RELEASE)"

  - priority: 14
    category: business_referential
    check: "Cross-entity scope coherence: the FormationBay's plant_id equals the lot's plant_id; the TestChamber's plant_id equals the assembly's lot's plant_id; a sizing_request_id supplied at ship belongs to the same plant as the lot and has request_state == ACCEPTED."
    error_id: ERR_PLANT_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /formation-runs, POST /capacity-tests, POST /battery-units"

  - priority: 14
    category: business_referential
    check: "A ProductionLot may only be created against a CellDesign whose approval_state == APPROVED (RETIRED, DRAFT, UNDER_REVIEW and CHANGES_REQUESTED are refused)."
    error_id: ERR_DESIGN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /production-lots"

  - priority: 14
    category: business_referential
    check: "A CapacityTest may only be scheduled against a BatteryAssembly whose certification_status == CERTIFIED."
    error_id: ERR_ASSEMBLY_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /capacity-tests"

  - priority: 15
    category: business_temporal
    check: "scheduled_end_at is strictly after scheduled_start_at on formation runs and capacity tests."
    error_id: ERR_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /formation-runs, POST /capacity-tests"

  - priority: 15
    category: business_temporal
    check: "FormationBay single-occupancy with cooldown buffer: the requested [scheduled_start_at, scheduled_end_at] collides with an existing SCHEDULED or CHARGING run on the same bay when new_start < existing_end + cooldown_minutes AND new_end + cooldown_minutes > existing_start. Touching endpoints collide; the buffer applies on BOTH sides."
    error_id: ERR_BAY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /formation-runs"

  - priority: 15
    category: business_temporal
    check: "TestChamber aggregate-capacity with half-open intervals: for every instant covered by the requested [scheduled_start_at, scheduled_end_at) the sum of draw_kw over SCHEDULED CapacityTest rows on the same chamber overlapping that instant, plus the new draw_kw, must be <= chamber.power_cap_kw. Adjacent windows (previous end == new start) never overlap, and multiple tests may share the chamber under the cap."
    error_id: ERR_CHAMBER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /capacity-tests"

  - priority: 15
    category: business_constraint
    check: "connection_count supplied with a TORQUE verification equals 2 * assembly.module_count."
    error_id: ERR_CONNECTION_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /battery-assemblies/{id}/verifications"

  - priority: 15
    category: business_constraint
    check: "Sampling completeness at release: completed_test_count >= sample_size and passed_cycle_life_count >= 1. A lot whose current sampling window holds zero completed tests fails here."
    error_id: ERR_SAMPLING_INCOMPLETE
    http_status: 409
    applies_to: "POST /production-lots/{id}/disposition (action=RELEASE)"

  - priority: 15
    category: business_constraint
    check: "Acceptance at release: failed_test_count <= acceptance_number."
    error_id: ERR_ACCEPTANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /production-lots/{id}/disposition (action=RELEASE)"

  - priority: 15
    category: business_constraint
    check: "retest_count < 2 when a QUARANTINED lot is retested."
    error_id: ERR_RETEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /production-lots/{id}/disposition (action=RETEST)"

  - priority: 15
    category: business_constraint
    check: "rework_count < 3 when an assembly is reworked."
    error_id: ERR_REWORK_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /battery-assemblies/{id}/rework"

  - priority: 15
    category: business_constraint
    check: "Core receipt mass reconciliation: abs(received_lead_kg - cell_design.lead_content_kg) <= cell_design.lead_content_kg * 0.02. Exactly 2.00 percent variance is accepted."
    error_id: ERR_CORE_MASS_VARIANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /battery-units/{id}/core-return/transitions (action=RECEIVE)"

  - priority: 15
    category: business_constraint
    check: "Core return is only available for LEAD_ACID units; a LITHIUM_LFP unit's core_status is NOT_APPLICABLE."
    error_id: ERR_CORE_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /battery-units/{id}/core-return"

  - priority: 15
    category: business_constraint
    check: "Fleet sizing selector: at least one CellDesign passes the eligibility filter."
    error_id: ERR_NO_ELIGIBLE_CELL_DESIGN
    http_status: 422
    applies_to: "POST /fleet-sizing-requests"

  - priority: 15
    category: business_constraint
    check: "Fleet sizing selector: at least one eligible CellDesign has a feasible AVAILABLE charger within charge_window_hours."
    error_id: ERR_NO_CHARGER_MATCH
    http_status: 422
    applies_to: "POST /fleet-sizing-requests"

  - priority: 16
    category: business_fiscal
    check: "Emission quota: (plant.emission_reserved_g + plant.emission_consumed_g + this run's reserved_emission_g) / monthly_lead_emission_permit_g must be <= 1.0000. A reservation landing exactly on 1.0000 is ACCEPTED (and drives the plant FROZEN); strictly above 1.0000 is refused."
    error_id: ERR_EMISSION_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /formation-runs"

  - priority: 16
    category: business_fiscal
    check: "Lead inventory: plant.lead_inventory_kg >= cell_design.lead_content_kg when a unit is shipped."
    error_id: ERR_LEAD_INVENTORY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /battery-units"

  - priority: 16
    category: business_fiscal
    check: "Metered energy sanity at completion: metered_energy_kwh > 0 and <= estimated_energy_kwh * 2."
    error_id: ERR_METERED_ENERGY_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /formation-runs/{id}/complete"

  - priority: 3
    category: business_constraint
    check: "Chemistry/plate coherence: LEAD_ACID designs use FLAT_PASTED or TUBULAR plates and declare lead_content_kg > 0.000; LITHIUM_LFP designs use PRISMATIC_CELL plates and declare lead_content_kg == 0.000."
    error_id: ERR_PLATE_TYPE_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /cell-designs, PATCH /cell-designs/{id}"

  - priority: 11
    category: state
    check: "Rework requires certification_status IN {REJECTED, REVOKED}; a PENDING or CERTIFIED assembly may not be reworked."
    error_id: ERR_ASSEMBLY_STATE_INVALID
    http_status: 409
    applies_to: "POST /battery-assemblies/{id}/rework"

  - priority: 11
    category: state
    check: "A sizing decision requires request_state == MATCHED, and a unit may only name a sizing request whose request_state == ACCEPTED."
    error_id: ERR_SIZING_REQUEST_STATE_INVALID
    http_status: 409
    applies_to: "POST /fleet-sizing-requests/{id}/decision, POST /battery-units"

  - priority: 11
    category: state
    check: "cycles_completed is required when the recorded test's test_type == CYCLE_LIFE and must be omitted for CAPACITY tests (the discriminator lives on the stored row, not the payload, so this is a state check rather than a schema check)."
    error_id: ERR_CYCLE_LIFE_SAMPLE_MISSING
    http_status: 409
    applies_to: "POST /capacity-tests/{id}/record-result"

  - priority: 11
    category: state
    check: "An environmental hold action must change the lot's env_hold_status: HOLD on an already HELD lot and RELEASE_HOLD on an already CLEAR lot are refused."
    error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /production-lots/{id}/env-hold"

  - priority: 14
    category: business_referential
    check: "The addressed FormationBay's bay_status is AVAILABLE."
    error_id: ERR_BAY_UNAVAILABLE
    http_status: 409
    applies_to: "POST /formation-runs, POST /formation-runs/{id}/start"

  - priority: 14
    category: business_referential
    check: "The addressed TestChamber's chamber_status is AVAILABLE."
    error_id: ERR_CHAMBER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /capacity-tests"

# =====================================================================
# 1.5 API Endpoint Table
#   api_prefix is "/" so every collection is a flat top-level segment.
#   Path ids are always spelled {id}; no endpoint carries two path ids.
#   Every write endpoint requires the X-User-Role and X-User-ID headers.
# =====================================================================
endpoints:

  # --- test-driving surface ------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every window, TWA lookback, warranty-month and deadline computation reads. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default); it never falls back to real wall-clock time."
    roles: [PlantAdmin, DesignEngineer, ProductionSupervisor, QualityInspector, SafetyOfficer, FleetEngineer, WarrantyAdministrator]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "Logical now is repositioned; no stored row is recomputed retroactively."

  # --- Plant ---------------------------------------------------------
  - method: POST
    path: "/plants"
    description: "Registers a manufacturing plant with its environmental permit, monthly lead-emission allowance, licensed chemistries, energy tariff bands and opening lead inventory."
    roles: [PlantAdmin]
    code: 201
    input: [name, site_code, licensed_chemistries, permit_status, monthly_lead_emission_permit_g, peak_tariff_cents_per_kwh, offpeak_tariff_cents_per_kwh, lead_initial_inventory_kg]
    output: Plant
    side_effects:
      - "emission_reserved_g, emission_consumed_g, lead_in_field_kg, lead_recycled_kg, core_deposit_liability_cents and formation_energy_charge_cents initialise to 0."
      - "lead_inventory_kg initialises to lead_initial_inventory_kg; lead_mass_variance_kg and core_lead_variance_kg initialise to 0.000."
      - "emission_utilization_ratio initialises to 0.0000 and compliance_posture is derived (OPEN for an ACTIVE permit with no removals)."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_DUPLICATE_CODE]

  - method: GET
    path: "/plants"
    description: "Lists plants, newest first by created_at DESC then id ASC, with optional posture and permit filters."
    roles: [PlantAdmin, DesignEngineer, ProductionSupervisor, QualityInspector, SafetyOfficer, FleetEngineer, WarrantyAdministrator]
    code: 200
    input: ["permit_status?", "compliance_posture?", "limit?", "offset?"]
    output: Plant[]

  - method: GET
    path: "/plants/{id}"
    description: "Reads one plant including its derived emission_utilization_ratio and compliance_posture."
    roles: [PlantAdmin, DesignEngineer, ProductionSupervisor, QualityInspector, SafetyOfficer, FleetEngineer, WarrantyAdministrator]
    code: 200
    input: []
    output: Plant
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PLANT_NOT_FOUND]

  - method: PATCH
    path: "/plants/{id}"
    description: "Amends the monthly emission allowance, licensed chemistry list or tariff bands of a plant. Every supplied field is optional but at least one must be present."
    roles: [PlantAdmin]
    code: 200
    input: ["monthly_lead_emission_permit_g?", "licensed_chemistries?", "peak_tariff_cents_per_kwh?", "offpeak_tariff_cents_per_kwh?"]
    output: Plant
    side_effects:
      - "emission_utilization_ratio is recomputed against the new allowance and compliance_posture is re-derived immediately, so lowering the allowance under the reserved+consumed total can freeze the plant with no production write at all."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_PLANT_NOT_FOUND]

  - method: PATCH
    path: "/plants/{id}/permit"
    description: "Sets the plant's environmental permit status. Suspending the permit freezes the plant immediately and holds every in-flight lot; reinstating it releases those holds."
    roles: [PlantAdmin]
    code: 200
    input: [permit_status]
    output: Plant
    side_effects:
      - "compliance_posture is re-derived: SUSPENDED forces FROZEN regardless of emissions or removals."
      - "SUSPENDED runs CASCADE A hops 4 and 5 with hold_reason = PERMIT_SUSPENDED; ACTIVE re-derives the posture and lifts the system-imposed holds whose hold_reason was PLANT_FROZEN or PERMIT_SUSPENDED."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_PLANT_NOT_FOUND]

  - method: GET
    path: "/plants/{id}/emission-ledger"
    description: "Computed read of INVARIANT E1: the plant's monthly allowance, reserved grams, consumed grams, utilization ratio, derived compliance_posture and the per-run reservation lines that sum to them."
    roles: [PlantAdmin, SafetyOfficer, ProductionSupervisor]
    code: 200
    input: []
    output: "{ monthly_lead_emission_permit_g: number, emission_reserved_g: number, emission_consumed_g: number, emission_utilization_ratio: number, compliance_posture: string, open_medical_removal_count: integer, lines: object[] }"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PLANT_NOT_FOUND]

  - method: GET
    path: "/plants/{id}/lead-mass-balance"
    description: "Computed read of INVARIANT L1: opening inventory, on-hand inventory, lead in the field, recycled lead, the closing variance (which must stay 0.000) and the core deposit liability with its own core_lead_variance_kg."
    roles: [PlantAdmin, SafetyOfficer]
    code: 200
    input: []
    output: "{ lead_initial_inventory_kg: number, lead_inventory_kg: number, lead_in_field_kg: number, lead_recycled_kg: number, lead_mass_variance_kg: number, core_lead_variance_kg: number, core_deposit_liability_cents: integer }"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PLANT_NOT_FOUND]

  - method: GET
    path: "/plants/{id}/fleet-analysis"
    description: "Computed read aggregating the plant's ACCEPTED fleet sizing requests: total recommended batteries and chargers, total fleet capital in cents, and the per-request lines that produced them."
    roles: [PlantAdmin, FleetEngineer]
    code: 200
    input: []
    output: "{ accepted_request_count: integer, recommended_battery_count: integer, recommended_charger_count: integer, fleet_capital_cents: integer, lines: object[] }"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PLANT_NOT_FOUND]

  # --- Worker --------------------------------------------------------
  - method: POST
    path: "/workers"
    description: "Enrols a plant employee with the job class that gates job-class-restricted operations."
    roles: [PlantAdmin]
    code: 201
    input: [plant_id, full_name, job_class, hire_date]
    output: Worker
    side_effects:
      - "removal_status initialises to ACTIVE, removal_count to 0, exposure_index to 0.0000 and exposure_index_variant to none."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_PLANT_NOT_FOUND]

  - method: GET
    path: "/workers"
    description: "Lists workers, created_at ASC then id ASC, filterable by plant, job class and removal status."
    roles: [PlantAdmin, SafetyOfficer, ProductionSupervisor, QualityInspector, DesignEngineer]
    code: 200
    input: ["plant_id?", "job_class?", "removal_status?", "limit?", "offset?"]
    output: Worker[]

  - method: GET
    path: "/workers/{id}"
    description: "Reads one worker including the derived exposure_index and the variant that produced it."
    roles: [PlantAdmin, SafetyOfficer, ProductionSupervisor, QualityInspector, DesignEngineer]
    code: 200
    input: []
    output: Worker
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WORKER_NOT_FOUND]

  - method: POST
    path: "/workers/{id}/exposure-samples"
    description: "Records an industrial-hygiene sample for the worker. AIR samples carry air_lead_ug_per_m3 with sample_duration_minutes; BLOOD samples carry blood_lead_ug_per_dl. Recording a sample recomputes the worker's dual-variant exposure index and may trigger medical removal."
    roles: [SafetyOfficer]
    code: 201
    input: [sample_type, sampled_at, "air_lead_ug_per_m3?", "sample_duration_minutes?", "blood_lead_ug_per_dl?"]
    output: ExposureSample
    side_effects:
      - "worker.exposure_index and worker.exposure_index_variant are recomputed by CALC worker_exposure_index; worker.last_sample_at is set to the latest sampled_at."
      - "An index >= 100.00 moves the worker to MEDICAL_REMOVAL, increments worker.removal_count and increments plant.open_medical_removal_count, which re-derives plant.compliance_posture (CASCADE A step 1)."
      - "resulting_worker_index, resulting_variant and triggered_removal are stamped on the sample row."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_ACTOR_JOB_CLASS_MISMATCH, ERR_WORKER_NOT_FOUND, ERR_EVENT_TIME_OUT_OF_RANGE]

  - method: GET
    path: "/workers/{id}/exposure-samples"
    description: "Lists the worker's exposure samples, sampled_at DESC then created_at ASC. This is the only discovery channel for sample rows, which are append-only and never returned by any other read."
    roles: [PlantAdmin, SafetyOfficer]
    code: 200
    input: ["sample_type?", "limit?", "offset?"]
    output: ExposureSample[]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WORKER_NOT_FOUND]

  - method: GET
    path: "/workers/{id}/exposure-index"
    description: "Computed read returning BOTH exposure variants side by side - the 90-day air TWA index and the 180-day blood peak index - the governing (higher) index, the variant that governs and whether the worker is removal-eligible."
    roles: [PlantAdmin, SafetyOfficer]
    code: 200
    input: []
    output: "{ air_twa_90d_index: number, blood_peak_180d_index: number, governing_index: number, governing_variant: string, removal_eligible: boolean, sample_counts: object }"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WORKER_NOT_FOUND]

  - method: POST
    path: "/workers/{id}/medical-clearance"
    description: "Returns a medically removed worker to duty. Requires a BLOOD sample taken within the last 30 logical days below the 20.0 ug/dL return threshold; the worker's removal history is retained."
    roles: [SafetyOfficer]
    code: 200
    input: ["clearance_note?"]
    output: Worker
    side_effects:
      - "removal_status becomes ACTIVE; removal_count is NOT decremented."
      - "plant.open_medical_removal_count is decremented and plant.compliance_posture is re-derived, which can unfreeze the plant."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_WORKER_NOT_FOUND, ERR_WORKER_NOT_REMOVED, ERR_CLEARANCE_EVIDENCE_MISSING]

  # --- CellDesign ----------------------------------------------------
  - method: POST
    path: "/cell-designs"
    description: "Drafts a cell/plate design: chemistry, plate type, cell count and nominal cell voltage, capacity, rated cycles, warranty months, pack weight, lead content per pack, formation charge factor and list price. Optionally supersedes an earlier design."
    roles: [DesignEngineer]
    code: 201
    input: [code, chemistry, plate_type, cells_per_battery, cell_nominal_voltage_v, nominal_capacity_ah, rated_cycles, warranty_months, pack_weight_kg, lead_content_kg, "formation_charge_factor?", list_price_cents, "retest_tightening_enabled?", "supersedes_design_id?"]
    output: CellDesign
    side_effects:
      - "approval_state initialises to DRAFT, revision to 1 and approved_revision to null."
      - "nominal_pack_voltage_v is derived as cells_per_battery * cell_nominal_voltage_v, rounded to 1 decimal."
      - "LEAD_ACID requires plate_type in {FLAT_PASTED, TUBULAR}; LITHIUM_LFP requires plate_type PRISMATIC_CELL and lead_content_kg 0.000 (ERR_PLATE_TYPE_INCOMPATIBLE otherwise)."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_CELL_DESIGN_NOT_FOUND, ERR_DUPLICATE_CODE, ERR_PLATE_TYPE_INCOMPATIBLE]

  - method: GET
    path: "/cell-designs"
    description: "Lists cell designs, created_at ASC then id ASC, filterable by chemistry, approval state, submitter, approver and superseded predecessor."
    roles: [PlantAdmin, DesignEngineer, ProductionSupervisor, QualityInspector, FleetEngineer, WarrantyAdministrator]
    code: 200
    input: ["chemistry?", "approval_state?", "submitted_by_worker_id?", "approved_by_worker_id?", "supersedes_design_id?", "limit?", "offset?"]
    output: CellDesign[]

  - method: GET
    path: "/cell-designs/{id}"
    description: "Reads one cell design including approval_state, revision and approved_revision."
    roles: [PlantAdmin, DesignEngineer, ProductionSupervisor, QualityInspector, FleetEngineer, WarrantyAdministrator]
    code: 200
    input: []
    output: CellDesign
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_CELL_DESIGN_NOT_FOUND]

  - method: PATCH
    path: "/cell-designs/{id}"
    description: "Edits an unapproved design. Permitted only in DRAFT or CHANGES_REQUESTED; every accepted edit increments revision so an approval always names the revision it approved."
    roles: [DesignEngineer]
    code: 200
    input: ["nominal_capacity_ah?", "rated_cycles?", "warranty_months?", "pack_weight_kg?", "lead_content_kg?", "formation_charge_factor?", "list_price_cents?", "retest_tightening_enabled?"]
    output: CellDesign
    side_effects:
      - "revision is incremented by 1. A DRAFT design stays DRAFT (self-loop); a CHANGES_REQUESTED design is moved back to DRAFT by the edit, which is the only way to reopen it for a further SUBMIT."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_CELL_DESIGN_NOT_FOUND, ERR_DESIGN_STATE_INVALID, ERR_PLATE_TYPE_INCOMPATIBLE]

  - method: POST
    path: "/cell-designs/{id}/review-actions"
    description: "Drives the design review axis. action=SUBMIT moves DRAFT to UNDER_REVIEW and records submitted_by_worker_id; action=APPROVE moves UNDER_REVIEW to APPROVED (ENGINEER job class only, and never by the submitter); action=REQUEST_CHANGES moves UNDER_REVIEW back to CHANGES_REQUESTED."
    roles: [DesignEngineer]
    code: 200
    input: [action, "review_comment?"]
    output: CellDesign
    side_effects:
      - "SUBMIT sets submitted_by_worker_id to the acting worker."
      - "APPROVE sets approved_by_worker_id to the acting worker, sets approved_revision to the current revision, and RETIRES the superseded predecessor named by supersedes_design_id if that predecessor is APPROVED."
      - "REQUEST_CHANGES retains submitted_by_worker_id so the segregation-of-duties check still applies to the next APPROVE."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_ACTOR_JOB_CLASS_MISMATCH, ERR_CELL_DESIGN_NOT_FOUND, ERR_DESIGN_STATE_INVALID, ERR_SEGREGATION_OF_DUTIES]

  # --- FormationBay --------------------------------------------------
  - method: POST
    path: "/formation-bays"
    description: "Commissions a formation charging bay with its rated power and the mandatory cooldown buffer that extends every occupancy window on both sides."
    roles: [PlantAdmin]
    code: 201
    input: [plant_id, bay_code, rated_power_kw, cooldown_minutes]
    output: FormationBay
    side_effects:
      - "bay_status initialises to AVAILABLE."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_PLANT_NOT_FOUND, ERR_DUPLICATE_CODE]

  - method: GET
    path: "/formation-bays"
    description: "Lists formation bays, created_at ASC then id ASC, filterable by plant and status."
    roles: [PlantAdmin, ProductionSupervisor, QualityInspector, SafetyOfficer]
    code: 200
    input: ["plant_id?", "bay_status?", "limit?", "offset?"]
    output: FormationBay[]

  - method: GET
    path: "/formation-bays/{id}"
    description: "Reads one formation bay."
