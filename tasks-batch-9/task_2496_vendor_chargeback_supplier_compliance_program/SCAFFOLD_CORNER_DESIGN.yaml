# §1.9 Scaffold Corner Design — breadth probe for
# tasks/task_2496_vendor_chargeback_supplier_compliance_program.
#
# Taxonomy: references/claim-extraction-guide.md. `section:` values are the guide's nine
# sections; `claim_type:` values are the per-section rows of that guide. Corners already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub and NO
# test_recipe. Every name below is unique across BOTH design files.
#
# Fixed non-existent id used by all not-found probes:
#   00000000-0000-4000-8000-000000000000
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_vendor_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Vendor
          - endpoints[POST /compliance/vendors]
          - response_envelope
        distinguishing_aspect: "POST /compliance/vendors with the three required inputs returns 201 and a Vendor whose 12 declared fields are all present, with status ACTIVE and every counter at its zero value."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-2001", legal_name: "Cornerstone Creations", payment_terms_days: 45 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v_id: $.data.id }
          assert:
            - "Response HTTP status == 201"
            - "Response body has keys meta, response_type, data with response_type == entity"
            - "Vendor.${v_id}.vendor_code == 'V-2001'"
            - "Vendor.${v_id}.legal_name == 'Cornerstone Creations'"
            - "Vendor.${v_id}.payment_terms_days == 45"
            - "Vendor.${v_id}.status == ACTIVE"
            - "Vendor.${v_id}.otif_score == null"
            - "Vendor.${v_id}.open_chargeback_cents == 0"
            - "Vendor.${v_id}.recovered_lifetime_cents == 0"
            - "Vendor.${v_id}.refund_due_cents == 0"
            - "Vendor.${v_id}.open_violation_count == 0"
            - "Vendor.${v_id}.open_cap_count == 0"
            - "Vendor.${v_id}.repeat_offender_flag == false"
            - "Vendor.${v_id}.exposure_alert_flag == false"
            - "Vendor.${v_id}.version == 1"

      - name: corner_routing_guide_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.RoutingGuide
          - endpoints[GET /compliance/routing-guides/{id}]
        distinguishing_aspect: "GET /compliance/routing-guides/{id} returns exactly the row written by the create call, with requirement_count 1 after one requirement is added and status still DRAFT."
        test_recipe:
          setup:
            - "Clock at 2026-08-01. One DRAFT guide RG-2026-R with a single LABELING requirement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/routing-guides"
              payload: { guide_code: "RG-2026-R", title: "Retrieval Guide", scope_code: "GROCERY", effective_from: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g_id}/requirements"
              payload: { requirement_code: "LBL-01", domain: "LABELING", severity_tier: "TIER_1", min_evidence_count: 2, fixed_fee_cents: 25000, per_unit_recovery_cents: 30, handling_pct: 2.00, min_fee_cents: 30000, cap_cents: 40000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "GET /compliance/routing-guides/${g_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "Response HTTP status == 200"
            - "RoutingGuide.${g_id}.guide_code == 'RG-2026-R'"
            - "RoutingGuide.${g_id}.scope_code == 'GROCERY'"
            - "RoutingGuide.${g_id}.effective_from == 2026-09-01T00:00:00Z"
            - "RoutingGuide.${g_id}.effective_until == null"
            - "RoutingGuide.${g_id}.supersedes_guide_id == null"
            - "RoutingGuide.${g_id}.status == DRAFT"
            - "RoutingGuide.${g_id}.requirement_count == 1"
            - "RoutingGuide.${g_id}.published_at == null"
            - "RoutingGuide.${g_id}.published_by_user_id == null"

      - name: corner_chargeback_listing_is_paginated_and_filterable
        claim_type: listing
        grounds:
          - endpoints[GET /compliance/chargebacks]
          - response_envelope
          - entities.Chargeback.fields.settlement_status
        distinguishing_aspect: "GET /compliance/chargebacks returns a list envelope carrying total_count and has_more, and the vendor_id + settlement_status filters intersect: two chargebacks exist for the vendor and both are ASSESSED, so filtering on settlement_status RECOVERED yields total_count 0 while the unfiltered vendor query yields 2."
        test_recipe:
          setup:
            - "Vendor V-2003 with a PUBLISHED guide carrying TIER_1 SHP-04 and TIER_1 LBL-01."
            - "One received 1000-unit / 500-cent shipment carrying two fully evidenced violations, both assessed, producing two ASSESSED chargebacks of 425000 and 40000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-2003", legal_name: "Pagination Partners", payment_terms_days: 60 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v_id: $.data.id }
            - call: "POST /compliance/routing-guides"
              payload: { guide_code: "RG-2026-A", title: "Domestic Routing Guide 2026-A", scope_code: "ALL", effective_from: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g_id}/requirements"
              payload: { requirement_code: "SHP-04", domain: "SHIPMENT", severity_tier: "TIER_1", min_evidence_count: 2, fixed_fee_cents: 200000, per_unit_recovery_cents: 500, handling_pct: 5.00, min_fee_cents: 100000, cap_cents: 900000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r_shp_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g_id}/requirements"
              payload: { requirement_code: "LBL-01", domain: "LABELING", severity_tier: "TIER_1", min_evidence_count: 2, fixed_fee_cents: 25000, per_unit_recovery_cents: 30, handling_pct: 2.00, min_fee_cents: 30000, cap_cents: 40000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r_lbl_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v_id}", po_number: "PO-1", ordered_units: 1000, unit_cost_cents: 500, ship_window_start: "2026-08-06T00:00:00Z", ship_window_end: "2026-08-09T00:00:00Z", must_arrive_by: "2026-08-10T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { po_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${po_id}/shipments"
              payload: { asn_number: "ASN-1", shipped_units: 1000, carton_count: 40 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { s_id: $.data.id }
            - call: "POST /compliance/shipments/${s_id}/receive"
              payload: { received_units: 1000 }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/shipments/${s_id}/violations"
              payload: { requirement_id: "${r_shp_id}", affected_units: 400, affected_cartons: 16, narrative: "Late ASN." }
              as: DCInspector
              as_user_id: "insp-1"
              captures: { vio1_id: $.data.id }
            - call: "POST /compliance/violations/${vio1_id}/evidence"
              payload: { kind: "DOCUMENT", reference_uri: "s3://evidence/1/a.pdf" }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/violations/${vio1_id}/evidence"
              payload: { kind: "MEASUREMENT", reference_uri: "s3://evidence/1/b.csv" }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/violations/${vio1_id}/assess"
              payload: { assessment_note: "Late ASN." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cb1_id: $.data.id }
            - call: "POST /compliance/shipments/${s_id}/violations"
              payload: { requirement_id: "${r_lbl_id}", affected_units: 500, affected_cartons: 20, narrative: "Unreadable GS1-128 labels." }
              as: DCInspector
              as_user_id: "insp-1"
              captures: { vio2_id: $.data.id }
            - call: "POST /compliance/violations/${vio2_id}/evidence"
              payload: { kind: "PHOTO", reference_uri: "s3://evidence/2/a.jpg" }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/violations/${vio2_id}/evidence"
              payload: { kind: "SCAN", reference_uri: "s3://evidence/2/b.txt" }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/violations/${vio2_id}/assess"
              payload: { assessment_note: "Label scan failures." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cb2_id: $.data.id }
          trigger:
            - call: "GET /compliance/chargebacks?vendor_id=${v_id}"
              payload: {}
              as: APAccountant
              as_user_id: "ap-1"
          assert:
            - "Response HTTP status == 200 and response_type == list"
            - "meta contains total_count == 2 and has_more == false"
            - "The list contains exactly the ids ${cb1_id} and ${cb2_id}"
            - "Chargeback.${cb1_id}.gross_assessed_cents == 425000"
            - "Chargeback.${cb2_id}.gross_assessed_cents == 40000"
            - "Chargeback.${cb2_id}.cost_recovery_cents == 25000"
            - "GET /compliance/chargebacks?vendor_id=${v_id}&settlement_status=RECOVERED returns total_count == 0"
            - "GET /compliance/chargebacks?requirement_id=${r_lbl_id} returns total_count == 1"

      - name: corner_violation_not_found_for_unknown_id
        claim_type: not_found
        grounds:
          - endpoints[GET /compliance/violations/{id}]
          - errors.ERR_VIOLATION_NOT_FOUND
        distinguishing_aspect: "GET /compliance/violations/{id} with an id that was never minted returns 404 ERR_VIOLATION_NOT_FOUND in the error envelope, not an empty 200."
        test_recipe:
          setup:
            - "Empty database at the default clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "GET /compliance/violations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DCInspector
              as_user_id: "insp-1"
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 404"
            - "response_type == error"
            - "$.data.error_id == ERR_VIOLATION_NOT_FOUND"
            - "$.data.message is a non-empty string"

      - name: corner_purchase_order_missing_required_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /compliance/purchase-orders]
          - errors.ERR_INVALID_REQUEST
          - validations[priority=3]
        distinguishing_aspect: "POST /compliance/purchase-orders omitting ordered_units - a field with source input and no default - returns 400 ERR_INVALID_REQUEST and creates no PurchaseOrder row."
        test_recipe:
          setup:
            - "Vendor V-2005 exists; clock at 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-2005", legal_name: "Missingfield Mercantile", payment_terms_days: 30 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v_id}", po_number: "PO-BAD", unit_cost_cents: 500, ship_window_start: "2026-08-06T00:00:00Z", ship_window_end: "2026-08-09T00:00:00Z", must_arrive_by: "2026-08-10T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 400"
            - "$.data.error_id == ERR_INVALID_REQUEST"
            - "GET /compliance/purchase-orders?vendor_id=${v_id} returns total_count == 0"

      - name: corner_scorecard_tolerance_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.Scorecard.fields.tolerance_early_days
          - entities.Scorecard.fields.tolerance_late_days
          - entities.Scorecard.fields.fill_tolerance_pct
          - endpoints[POST /compliance/scorecards]
        distinguishing_aspect: "Omitting all three optional tolerance inputs yields tolerance_early_days 2, tolerance_late_days 0 and fill_tolerance_pct 2.00; supplying them explicitly on a second, clearance-separated period overrides all three."
        test_recipe:
          setup:
            - "Vendor V-2006; clock at 2026-08-01; no scorecards."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-2006", legal_name: "Defaultly Distributors", payment_terms_days: 30 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /compliance/scorecards"
              payload: { vendor_id: "${v_id}", period_code: "2026-05", period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { sc_default_id: $.data.id }
            - call: "POST /compliance/scorecards"
              payload: { vendor_id: "${v_id}", period_code: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z", tolerance_early_days: 5, tolerance_late_days: 3, fill_tolerance_pct: 0.50 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { sc_explicit_id: $.data.id }
          assert:
            - "Scorecard.${sc_default_id}.tolerance_early_days == 2"
            - "Scorecard.${sc_default_id}.tolerance_late_days == 0"
            - "Scorecard.${sc_default_id}.fill_tolerance_pct == 2.00"
            - "Scorecard.${sc_default_id}.status == OPEN"
            - "Scorecard.${sc_default_id}.cap_required == false"
            - "Scorecard.${sc_default_id}.measurement_variant == null"
            - "Scorecard.${sc_explicit_id}.tolerance_early_days == 5"
            - "Scorecard.${sc_explicit_id}.tolerance_late_days == 3"
            - "Scorecard.${sc_explicit_id}.fill_tolerance_pct == 0.50"

      - name: corner_shipment_invoice_value_is_computed_at_receipt
        claim_type: computed_fields
        grounds:
          - entities.Shipment.fields.invoice_value_cents
          - state_machines.Shipment.IN_TRANSIT_to_RECEIVED
          - endpoints[POST /compliance/shipments/{id}/receive]
        distinguishing_aspect: "invoice_value_cents has source computed: it is 0 while the shipment is IN_TRANSIT and becomes received_units * purchase_order.unit_cost_cents = 900 * 500 = 450000 at receipt - the shipped_units figure of 1000 never enters the product."
        test_recipe:
          setup:
            - "Vendor V-2007 with one PO of 1000 units at 500 cents and one IN_TRANSIT shipment of 1000 shipped units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-2007", legal_name: "Computeco Imports", payment_terms_days: 30 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v_id: $.data.id }
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v_id}", po_number: "PO-1", ordered_units: 1000, unit_cost_cents: 500, ship_window_start: "2026-08-06T00:00:00Z", ship_window_end: "2026-08-09T00:00:00Z", must_arrive_by: "2026-08-10T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { po_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${po_id}/shipments"
              payload: { asn_number: "ASN-1", shipped_units: 1000, carton_count: 40 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { s_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /compliance/shipments/${s_id}/receive"
              payload: { received_units: 900 }
              as: DCInspector
              as_user_id: "insp-1"
          assert:
            - "Before the trigger Shipment.${s_id}.invoice_value_cents == 0 and Shipment.${s_id}.received_units == null"
            - "Shipment.${s_id}.status == RECEIVED"
            - "Shipment.${s_id}.received_units == 900"
            - "Shipment.${s_id}.arrived_at == 2026-08-10T00:00:00Z"
            - "Shipment.${s_id}.invoice_value_cents == 450000"
            - "PurchaseOrder.${po_id}.received_units == 900"
            - "PurchaseOrder.${po_id}.first_receipt_at == 2026-08-10T00:00:00Z"
            - "PurchaseOrder.${po_id}.status == PARTIALLY_RECEIVED"

      - name: corner_evidence_item_system_fields_are_server_stamped
        claim_type: system_fields
        grounds:
          - entities.EvidenceItem.fields.captured_by_user_id
          - entities.EvidenceItem.fields.captured_at
          - entities.EvidenceItem.fields.subject_type
          - endpoints[POST /compliance/violations/{id}/evidence]
        distinguishing_aspect: "captured_by_user_id, captured_at, subject_type and violation_id are all source system/computed: the server stamps them from the acting X-User-ID, the logical clock and the path, so the row records insp-1 and 2026-08-10T00:00:00Z with subject_type VIOLATION and dispute_id null even though the client sent none of those values."
        test_recipe:
          setup:
            - "Vendor V-2008 with a PUBLISHED guide carrying TIER_1 LBL-01 and one received shipment holding a DETECTED violation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-2008", legal_name: "Stampwell Supply", payment_terms_days: 30 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v_id: $.data.id }
            - call: "POST /compliance/routing-guides"
              payload: { guide_code: "RG-2026-A", title: "Domestic Routing Guide 2026-A", scope_code: "ALL", effective_from: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g_id}/requirements"
              payload: { requirement_code: "LBL-01", domain: "LABELING", severity_tier: "TIER_1", min_evidence_count: 2, fixed_fee_cents: 25000, per_unit_recovery_cents: 30, handling_pct: 2.00, min_fee_cents: 30000, cap_cents: 40000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v_id}", po_number: "PO-1", ordered_units: 1000, unit_cost_cents: 500, ship_window_start: "2026-08-06T00:00:00Z", ship_window_end: "2026-08-09T00:00:00Z", must_arrive_by: "2026-08-10T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { po_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${po_id}/shipments"
              payload: { asn_number: "ASN-1", shipped_units: 1000, carton_count: 40 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { s_id: $.data.id }
            - call: "POST /compliance/shipments/${s_id}/receive"
              payload: { received_units: 1000 }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/shipments/${s_id}/violations"
              payload: { requirement_id: "${r_id}", affected_units: 500, affected_cartons: 20, narrative: "Unreadable labels." }
              as: DCInspector
              as_user_id: "insp-1"
              captures: { vio_id: $.data.id }
          trigger:
            - call: "POST /compliance/violations/${vio_id}/evidence"
              payload: { kind: "PHOTO", reference_uri: "s3://evidence/lbl/face.jpg", note: "Carton 12 face label." }
              as: DCInspector
              as_user_id: "insp-1"
              captures: { ev_id: $.data.id }
          assert:
            - "Response HTTP status == 201"
            - "EvidenceItem.${ev_id}.violation_id == ${vio_id}"
            - "EvidenceItem.${ev_id}.dispute_id == null"
            - "EvidenceItem.${ev_id}.subject_type == VIOLATION"
            - "EvidenceItem.${ev_id}.kind == PHOTO"
            - "EvidenceItem.${ev_id}.note == 'Carton 12 face label.'"
            - "EvidenceItem.${ev_id}.captured_by_user_id == 'insp-1'"
            - "EvidenceItem.${ev_id}.captured_at == 2026-08-10T00:00:00Z"
            - "ComplianceViolation.${vio_id}.evidence_count == 1"
            - "ComplianceViolation.${vio_id}.status == DETECTED"
            - "Shipment.${s_id}.evidence_capture_count == 1"

      - name: corner_requirement_invalid_enum_domain_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.RoutingRequirement.fields.domain
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /compliance/routing-guides/{id}/requirements]
