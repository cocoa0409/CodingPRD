  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: advance_blocked_by_unaccepted_evidence
        grounds:
          - state_machines.AccreditationApplication.EVIDENCE_REVIEW_to_SURVEY_SCHEDULING
          - state_machines.EvidenceItem
          - errors.ERR_EVIDENCE_COMPLETENESS_UNMET
        distinguishing_aspect: |
          Entity pair Application x EvidenceItem: the application's
          EVIDENCE_REVIEW -> SURVEY_SCHEDULING transition is gated by the
          ACCEPTED status of exactly evidence_required_count child
          EvidenceItems per element — one short (REJECTED does not count) and
          the transition fails.
        test_recipe:
          setup:
            - "Base chain in EVIDENCE_REVIEW; UM-1 has 1 ACCEPTED + 1 REJECTED evidence (needs 2 ACCEPTED); CR-1 and QI-1 each 1 ACCEPTED."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_el_um2
