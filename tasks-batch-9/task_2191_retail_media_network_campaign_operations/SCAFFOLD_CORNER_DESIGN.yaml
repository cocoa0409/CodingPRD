          setup:
            - "Baseline chain through line item activation, plus a second ONSITE slot SRP-B1 with max_concurrent_line_items 1, floor_cpc_cents 3500 and relevance_weight 1.0 carrying one SERVING CPM line item that bids 4500 on the 0.40-margin hero product."
