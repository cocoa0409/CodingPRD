# =============================================================================
# task_2705 — App Store Submission & Review Compliance
# Seed tables §1.0 – §1.7 (single source of truth for PRD / tests / impl)
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2705. App Store Submission & Review Compliance (mobile application publisher):
  platform guideline mapping to product features with pre-submission self-review,
  build submission with metadata, screenshots, age rating questionnaires and
  privacy disclosures, review outcome handling with rejection reason analysis,
  appeal and expedited review requests, privacy label and data collection
  disclosure accuracy verification against actual application behavior, in-app
  purchase and external payment link compliance with platform commerce rules,
  phased release, staged rollout and emergency rollback procedures, guideline
  change monitoring with impact assessment on existing features, account and
  certificate management with signing key security and provisioning profiles

domain_name: app-store-submission-compliance

# Flat root-level collections: every entity is addressed at the API root
# (/publisher-accounts, /app-records, /submissions, ...) and linked by explicit
# foreign keys rather than by URL nesting. The single nested read
# (GET /submissions/{id}/metadata-locales) exists only as the reverse-reachability
# channel for a cascade-created child.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # graph: Submission, AppRecord, GuidelineRule, SigningCredential and
  # FeatureMapping form a many-to-many web; SigningCredential.linked_cert_id and
  # GuidelineRule.supersedes_rule_id are self-referential edges.

  state_machine_shape: cyclic
  state_machine_shape_notes: |
    Submission is cyclic (REJECTED -> DRAFT -> ... -> REJECTED, and
    REJECTED -> APPEAL_PENDING -> APPROVED); AppRecord carries two independent
    state dimensions on one row (listing_state x distribution_state) plus the
    derived compliance_posture that gates every child write; RolloutPlan has a
    PHASE_ACTIVE self-loop; ImpactAssessment and AppealRequest branch fork-style
    with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many        # PublisherAccount -> AppRecord -> Submission
    - many_to_many       # FeatureMapping joins AppRecord x GuidelineRule
    - self_referential   # SigningCredential.linked_cert_id, GuidelineRule.supersedes_rule_id
    - cross_aggregate    # Submission.review_window_id crosses into the platform-owned pool

  role_model: segregation_of_duties
  # Publisher-side duties are split three ways (PublisherAdmin / ReleaseManager /
  # ComplianceOfficer) and no publisher role may perform another's step; on the
  # platform side the operator who decided a review MUST NOT decide its appeal.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:

  # --- Publisher side: account + signing material -----------------------------
  - name: PublisherAccount
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered publisher legal name", constraints: "1..120 chars, unique across accounts" }
      - { name: contact_email, type: string, source: input, description: "Operational contact email", constraints: "must contain '@'" }
      - { name: program_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED | SUSPENDED | TERMINATED", constraints: "EXPIRED set by clock when membership_paid_through_at < clock_now; SUSPENDED/TERMINATED set by POST /publisher-accounts/{id}/enforcement" }
      - { name: commerce_program_tier, type: enum, source: input, default: STANDARD, description: "SMALL_BUSINESS | STANDARD — selects the base commission rate in calculations.commission_settlement_cents" }
      - { name: membership_paid_through_at, type: datetime, source: system, description: "ISO 8601 UTC instant through which program membership is paid; advanced only by POST /publisher-accounts/{id}/membership-renewal" }
      - { name: enforcement_reason_code, type: string, source: system, default: null, description: "Reason code recorded by the last enforcement action; null when program_status IN {ACTIVE, EXPIRED}" }
      - { name: standing_score_rolling_365, type: number, source: computed, description: "Decayed 365-day standing per calculations.standing_score variant ROLLING_365; gates expedite eligibility", constraints: "0.00..100.00, 2 decimals" }
      - { name: standing_score_lifetime, type: number, source: computed, description: "Undecayed lifetime standing per calculations.standing_score variant LIFETIME_UNDECAYED; feeds review priority", constraints: "0.00..100.00, 2 decimals" }
      - { name: expedite_credits_remaining, type: integer, source: computed, description: "EXPEDITE_CREDITS_PER_WINDOW minus credits consumed in the rolling 365-day window per calculations.expedite_credit_ledger", constraints: "0..2" }
      - { name: rejection_strike_count, type: integer, source: computed, description: "Count of RejectionReason rows with severity CRITICAL whose recorded_at falls inside the rolling 365-day window and whose appeal_disposition != OVERTURNED" }
      - { name: settlement_finalized_periods, type: array, source: system, default: [], description: "Period labels (e.g. '2026-Q3') for which commerce revenue has already been reported; append-only" }

  - name: SigningCredential
    parent: null
    common_fields: true
    fields:
      - { name: publisher_account_id, type: string, source: input, description: "FK -> PublisherAccount.id; owning account" }
      - { name: credential_type, type: enum, source: input, description: "DISTRIBUTION_CERT | PROVISIONING_PROFILE" }
      - { name: linked_cert_id, type: string, source: input, default: null, description: "FK -> SigningCredential.id; the DISTRIBUTION_CERT this PROVISIONING_PROFILE is derived from. REQUIRED when credential_type == PROVISIONING_PROFILE, MUST be null when credential_type == DISTRIBUTION_CERT" }
      - { name: platform, type: enum, source: input, description: "IOS | ANDROID — must equal the platform of every AppRecord whose Submission cites this credential" }
      - { name: key_custody, type: enum, source: input, description: "HSM | CLOUD_MANAGED | LOCAL_KEYCHAIN — LOCAL_KEYCHAIN is rejected for DISTRIBUTION_CERT" }
      - { name: entitlements, type: array, source: input, default: [], description: "Subset of {IN_APP_PURCHASE, EXTERNAL_PAYMENT_LINK, PUSH_NOTIFICATIONS, BACKGROUND_LOCATION} granted by this credential" }
      - { name: not_before, type: datetime, source: input, description: "ISO 8601 UTC validity start (inclusive)" }
      - { name: not_after, type: datetime, source: input, description: "ISO 8601 UTC validity end (exclusive); must be > not_before" }
      - { name: status, type: enum, source: system, default: PENDING_ACTIVATION, description: "PENDING_ACTIVATION | ACTIVE | EXPIRING_SOON | EXPIRED | REVOKED | COMPROMISED" }
      - { name: revocation_reason, type: enum, source: system, default: null, description: "SUPERSEDED | MANUAL | COMPROMISE_CASCADE | null — set on entry to REVOKED" }
      - { name: compromised_at, type: datetime, source: system, default: null, description: "Clock instant at which the credential was reported compromised" }
      - { name: blocked_submission_count, type: integer, source: computed, default: 0, description: "Number of Submission rows this credential's revocation moved to BLOCKED_INVALID_SIGNING" }

  # --- Publisher side: the app listing ---------------------------------------
  - name: AppRecord
    parent: null
    common_fields: true
    fields:
      - { name: publisher_account_id, type: string, source: input, description: "FK -> PublisherAccount.id; owning account" }
      - { name: bundle_id, type: string, source: input, description: "Reverse-DNS bundle identifier", constraints: "unique per (publisher_account_id, platform)" }
      - { name: platform, type: enum, source: input, description: "IOS | ANDROID" }
      - { name: display_name, type: string, source: input, description: "Store display name", constraints: "1..30 chars" }
      - { name: primary_category, type: enum, source: input, description: "GAMES | FINANCE | HEALTH | SOCIAL | PRODUCTIVITY | KIDS" }
      - { name: listing_state, type: enum, source: system, default: DRAFT, description: "Dimension 1 of 2 — DRAFT | METADATA_COMPLETE | LISTED | DELISTED; driven only by PATCH /app-records/{id}/listing" }
      - { name: distribution_state, type: enum, source: system, default: NOT_DISTRIBUTED, description: "Dimension 2 of 2 — NOT_DISTRIBUTED | PHASED_ROLLOUT | FULLY_RELEASED | PAUSED | ROLLED_BACK; driven only by RolloutPlan transitions" }
      - { name: compliance_posture, type: enum, source: computed, default: RESTRICTED, description: "OPEN | RESTRICTED | FROZEN per calculations.compliance_posture; gates every child write" }
      - { name: posture_reason_codes, type: array, source: computed, default: [], description: "Ordered reason codes explaining the current posture, emitted in the fixed order declared by calculations.compliance_posture" }
      - { name: feature_compliance_index, type: number, source: computed, default: 0.00, description: "0.00..100.00 weighted self-review coverage per calculations.feature_compliance_index" }
      - { name: live_submission_id, type: string, source: computed, default: null, description: "FK -> Submission.id; the build currently distributed (the Submission cited by the RolloutPlan whose state IN {PHASE_ACTIVE, PAUSED, COMPLETED}); null when distribution_state IN {NOT_DISTRIBUTED, ROLLED_BACK}" }
      - { name: released_share_pct, type: number, source: computed, default: 0.00, description: "Percentage of the audience currently receiving live_submission_id; conserved with held_back_share_pct per calculations.rollout_audience_allocation" }
      - { name: held_back_share_pct, type: number, source: computed, default: 100.00, description: "Percentage of the audience withheld from live_submission_id" }
      - { name: rollback_count, type: integer, source: computed, default: 0, description: "Number of RolloutPlan rows for this app that reached ROLLED_BACK" }

  # --- Platform side: guideline corpus ---------------------------------------
  - name: GuidelineRule
    parent: null
    common_fields: true
    fields:
      - { name: rule_code, type: string, source: input, description: "Platform guideline code, e.g. '5.1.1'", constraints: "unique per (rule_code, version_label)" }
      - { name: title, type: string, source: input, description: "Human-readable guideline title" }
      - { name: category, type: enum, source: input, description: "SAFETY | PRIVACY | COMMERCE | LEGAL | DESIGN" }
      - { name: severity_weight, type: integer, source: computed, description: "Fixed function of category: SAFETY=5, PRIVACY=4, COMMERCE=3, LEGAL=3, DESIGN=1" }
      - { name: remediation_grace_days, type: integer, source: computed, description: "Fixed function of category: SAFETY=14, PRIVACY=30, COMMERCE=45, LEGAL=30, DESIGN=60" }
      - { name: version_label, type: string, source: input, description: "Guideline corpus revision label, e.g. '2026.09'" }
      - { name: effective_from, type: datetime, source: input, description: "ISO 8601 UTC instant from which the rule binds; may be in the past relative to the logical clock" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | EFFECTIVE | SUPERSEDED" }
      - { name: supersedes_rule_id, type: string, source: input, default: null, description: "FK -> GuidelineRule.id; the rule this one replaces on publication; null for a brand-new rule" }
      - { name: requires_feature_mapping, type: boolean, source: input, default: true, description: "When true, every AppRecord must carry a FeatureMapping to this rule before a Submission may be queued" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Clock instant of the DRAFT -> EFFECTIVE transition" }
      - { name: impacted_app_count, type: integer, source: computed, default: 0, description: "Number of ImpactAssessment rows created by this rule's publication cascade" }

  # --- Guideline-to-feature mapping (many-to-many junction) -------------------
  - name: FeatureMapping
    parent: null
    common_fields: true
    fields:
      - { name: app_record_id, type: string, source: input, description: "FK -> AppRecord.id; the mapped app" }
      - { name: guideline_rule_id, type: string, source: input, description: "FK -> GuidelineRule.id; the guideline this feature is mapped to" }
      - { name: feature_code, type: string, source: input, description: "Product feature identifier, e.g. 'ACCOUNT_DELETION'", constraints: "unique per (app_record_id, guideline_rule_id, feature_code)" }
      - { name: self_review_status, type: enum, source: system, default: NOT_STARTED, description: "NOT_STARTED | IN_PROGRESS | PASSED | FAILED | STALE | WAIVED_BY_PLATFORM" }
      - { name: risk_weight, type: integer, source: computed, description: "Copy of GuidelineRule.severity_weight at every recompute of AppRecord.feature_compliance_index" }
      - { name: evidence_ref, type: string, source: input, default: null, description: "Free-text pointer to the self-review evidence artifact" }
      - { name: attested_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceOfficer that recorded the PASS/FAIL outcome" }
      - { name: attested_at, type: datetime, source: system, default: null, description: "Clock instant of the last PASS/FAIL outcome" }
      - { name: staled_by_rule_id, type: string, source: system, default: null, description: "FK -> GuidelineRule.id; the newly EFFECTIVE rule whose publication cascade moved this mapping to STALE" }
      - { name: waiver_reason, type: string, source: system, default: null, description: "Reason recorded by POST /feature-mappings/{id}/waive; null unless self_review_status == WAIVED_BY_PLATFORM" }

  # --- The build submission (central entity) ----------------------------------
  - name: Submission
    parent: null
    common_fields: true
    fields:
      - { name: app_record_id, type: string, source: input, description: "FK -> AppRecord.id; the app this build belongs to" }
      - { name: signing_credential_id, type: string, source: input, description: "FK -> SigningCredential.id; the PROVISIONING_PROFILE the binary is signed with" }
      - { name: review_window_id, type: string, source: system, default: null, description: "FK -> ReviewCapacityWindow.id; the review slot pool selected at queue entry per calculations.review_capacity_allocation; null before queue entry" }
      - { name: build_number, type: integer, source: input, description: "Monotonic build counter", constraints: "unique per app_record_id; must be > every existing build_number for the app" }
      - { name: version_string, type: string, source: input, description: "Marketing version, e.g. '4.2.0'" }
      - { name: release_mode, type: enum, source: input, default: PHASED, description: "IMMEDIATE | PHASED | MANUAL — the release strategy the RolloutPlan must use" }
      - { name: submission_channel, type: enum, source: system, default: STANDARD, description: "STANDARD | EXPEDITED — becomes EXPEDITED only when queue entry cites an ExpediteRequest in state GRANTED" }
      - { name: state, type: enum, source: system, default: DRAFT, description: "DRAFT | PRE_REVIEW_PASSED | WAITING_FOR_REVIEW | IN_REVIEW | APPROVED | REJECTED | METADATA_REJECTED | APPEAL_PENDING | REJECTED_FINAL | BLOCKED_INVALID_SIGNING | DEVELOPER_WITHDRAWN | SUPERSEDED" }
      - { name: age_rating_answers, type: object, source: input, default: null, description: "Six intensity answers (violence, sexual_content, profanity, gambling_simulated, drugs_alcohol, horror) each 0..3 plus booleans unrestricted_web_access, user_generated_content, ugc_moderation_enabled, real_money_gambling, contests" }
      - { name: attested_age_rating, type: integer, source: input, default: null, description: "Age rating the publisher attests to", constraints: "member of {0, 4, 9, 12, 17, 18}" }
      - { name: derived_age_rating, type: integer, source: computed, default: null, description: "Rating derived from age_rating_answers per calculations.derived_age_rating" }
      - { name: age_rating_driving_dimension, type: enum, source: computed, default: null, description: "VIOLENCE | SEXUAL_CONTENT | DRUGS_ALCOHOL | GAMBLING_SIMULATED | HORROR | PROFANITY | FLOOR_RULE — winner of the fixed-priority tie-break in calculations.derived_age_rating" }
      - { name: declared_privacy_items, type: array, source: input, default: [], description: "Privacy label: array of { data_type, purpose, linked_to_user, used_for_tracking } declared collection tuples" }
      - { name: tracking_consent_prompt_present, type: boolean, source: input, default: false, description: "Publisher assertion that the binary shows a tracking consent prompt" }
      - { name: disclosure_accuracy_score_provisional, type: number, source: computed, default: null, description: "calculations.disclosure_accuracy_score variant SELF_REVIEW_PROVISIONAL, recomputed on every pre-review check", constraints: "0.0000..1.0000, 4 decimals" }
      - { name: disclosure_accuracy_score_final, type: number, source: computed, default: null, description: "calculations.disclosure_accuracy_score variant REVIEW_FINAL, recomputed on reviewer claim and on decision", constraints: "0.0000..1.0000, 4 decimals" }
      - { name: pre_review_passed, type: boolean, source: computed, default: false, description: "True after the most recent POST /submissions/{id}/pre-review-check found zero blocking reasons" }
      - { name: pre_review_blocking_reasons, type: array, source: computed, default: [], description: "Ordered blocking reason codes from the last pre-review check, in the fixed order declared by validations priority 60..90" }
      - { name: pre_review_checked_at, type: datetime, source: system, default: null, description: "Clock instant of the last pre-review check; bounds the SELF_REVIEW_PROVISIONAL finding scope" }
      - { name: attested_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceOfficer whose pre-review check last passed" }
      - { name: queued_at, type: datetime, source: system, default: null, description: "Clock instant of entry into WAITING_FOR_REVIEW" }
      - { name: provisional_deadline_at, type: datetime, source: system, default: null, description: "queued_at + BASE_SLA_HOURS; frozen at queue entry and never recomputed — the pinned input of deadline_pressure" }
      - { name: priority_score, type: number, source: computed, default: null, description: "0.00..100.00 per calculations.review_priority_score" }
      - { name: priority_band, type: enum, source: computed, default: null, description: "EXPEDITED | HIGH | NORMAL | LOW per calculations.review_priority_score" }
      - { name: effective_review_deadline_at, type: datetime, source: computed, default: null, description: "queued_at + sla_hours(priority_band); MUST NOT feed back into deadline_pressure" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the PlatformReviewer that claimed the submission; the segregation-of-duties subject" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Clock instant of the APPROVE / REJECT / METADATA_REJECT decision" }
      - { name: rejected_at, type: datetime, source: system, default: null, description: "Clock instant of the most recent entry into REJECTED or METADATA_REJECTED; opens the APPEAL_WINDOW_DAYS window" }
      - { name: resubmission_count, type: integer, source: computed, default: 0, description: "Number of times this submission re-entered DRAFT from REJECTED or METADATA_REJECTED" }
      - { name: metadata_locale_count, type: integer, source: computed, default: 0, description: "Count of MetadataLocale rows attached to this submission" }

  # --- Store listing metadata per locale --------------------------------------
  - name: MetadataLocale
    parent: null
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; the build whose store page this locale describes" }
      - { name: locale, type: string, source: input, description: "BCP-47 locale tag, e.g. 'en-US'", constraints: "unique per (submission_id, locale)" }
      - { name: is_primary, type: boolean, source: input, default: false, description: "Exactly one MetadataLocale per submission may carry is_primary == true" }
      - { name: title, type: string, source: input, description: "Localized title", constraints: "1..30 chars" }
      - { name: subtitle, type: string, source: input, default: null, description: "Localized subtitle", constraints: "0..30 chars" }
      - { name: keywords, type: string, source: input, default: "", description: "Comma-separated keyword string", constraints: "<= 100 chars" }
      - { name: promotional_text, type: string, source: input, default: null, description: "Localized promo copy", constraints: "0..170 chars" }
      - { name: screenshot_counts, type: object, source: input, description: "Map device class -> screenshot count, e.g. { PHONE_65: 3, TABLET_129: 2 }; every value must be an integer >= 0" }
      - { name: required_device_classes, type: array, source: computed, description: "IOS -> [PHONE_65, TABLET_129]; ANDROID -> [PHONE_65]; derived from the parent AppRecord.platform" }
      - { name: is_complete, type: boolean, source: computed, default: false, description: "True when title is non-empty and screenshot_counts[c] >= MIN_SCREENSHOTS_PER_CLASS for every c in required_device_classes" }

  # --- Observed runtime behavior (privacy label ground truth) ------------------
  - name: BehaviorFinding
    parent: null
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; the build the platform scanner observed" }
      - { name: data_type, type: enum, source: input, description: "PRECISE_LOCATION | CONTACTS | DEVICE_ID | EMAIL | PURCHASE_HISTORY | HEALTH | USAGE_DATA" }
      - { name: observed_purpose, type: enum, source: input, description: "ANALYTICS | ADVERTISING | APP_FUNCTIONALITY | PERSONALIZATION | THIRD_PARTY_SHARING" }
      - { name: observed_linked_to_user, type: boolean, source: input, description: "Whether the observed collection was linked to a user identity" }
      - { name: observed_tracking, type: boolean, source: input, description: "Whether the observed collection was used for cross-app tracking" }
      - { name: endpoint_domain, type: string, source: input, description: "Destination domain the data was transmitted to" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR — penalty weights 40 / 20 / 5 in calculations.disclosure_accuracy_score" }
      - { name: scanner_confidence, type: number, source: input, description: "0.0000..1.0000 detector confidence; SELF_REVIEW_PROVISIONAL scope requires >= PROVISIONAL_CONFIDENCE_FLOOR" }
      - { name: detected_at, type: datetime, source: input, description: "ISO 8601 UTC instant the behavior was observed; may be later than Submission.pre_review_checked_at (late-arriving finding)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | DISPUTED | RECONCILED | DISMISSED" }
      - { name: triaged_by_user_id, type: string, source: system, default: null, description: "X-User-ID that last triaged this finding" }
      - { name: triage_justification, type: string, source: system, default: null, description: "Justification recorded by the last triage action" }
      - { name: triaged_at, type: datetime, source: system, default: null, description: "Clock instant of the last triage action" }

  # --- Review outcome analysis -------------------------------------------------
  - name: RejectionReason
    parent: null
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; the rejected build" }
      - { name: guideline_rule_id, type: string, source: input, description: "FK -> GuidelineRule.id; the guideline cited by the reviewer" }
      - { name: reason_code, type: string, source: input, description: "Reviewer reason code, e.g. 'PRIVACY_LABEL_MISMATCH'" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR — penalty weights 12 / 6 / 2 in calculations.standing_score" }
      - { name: detail, type: string, source: input, description: "Reviewer narrative" }
      - { name: recorded_at, type: datetime, source: system, description: "Clock instant the decision recorded this reason; the age input of the standing decay factor" }
      - { name: recorded_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the deciding PlatformReviewer" }
      - { name: developer_response, type: string, source: system, default: null, description: "Publisher narrative supplied by POST /rejection-reasons/{id}/response" }
      - { name: disposition, type: enum, source: system, default: PENDING, description: "PENDING | ACCEPTED | CONTESTED — publisher's own disposition; only CONTESTED reasons may be cited by an appeal" }
      - { name: appeal_disposition, type: enum, source: system, default: PENDING, description: "PENDING | UPHELD | OVERTURNED — set by the appeal board decision cascade; OVERTURNED reasons leave calculations.standing_score penalty scope" }

  - name: AppealRequest
    parent: null
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; the rejected build under appeal" }
      - { name: appeal_type, type: enum, source: input, description: "GUIDELINE_INTERPRETATION | FACTUAL_ERROR" }
      - { name: argument, type: string, source: input, description: "Publisher appeal narrative", constraints: "20..2000 chars" }
      - { name: cited_rejection_reason_ids, type: array, source: input, description: "RejectionReason.id values contested by this appeal; every element MUST be a RejectionReason whose submission_id equals this appeal's submission_id and whose disposition == CONTESTED (discover them via GET /rejection-reasons?submission_id=)", constraints: "non-empty" }
      - { name: state, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | BOARD_REVIEW | UPHELD | OVERTURNED | PARTIALLY_OVERTURNED | WITHDRAWN" }
      - { name: filed_at, type: datetime, source: system, description: "Clock instant the appeal was filed; must satisfy filed_at <= Submission.rejected_at + APPEAL_WINDOW_DAYS" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filing ComplianceOfficer" }
      - { name: board_started_at, type: datetime, source: system, default: null, description: "Clock instant of the SUBMITTED -> BOARD_REVIEW transition" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the deciding PlatformAppealBoard operator; MUST differ from Submission.reviewed_by_user_id" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Clock instant of the board decision" }
      - { name: rationale, type: string, source: system, default: null, description: "Board rationale recorded at decision" }
      - { name: overturned_rejection_reason_ids, type: array, source: system, default: [], description: "Subset of cited_rejection_reason_ids the board overturned; empty for UPHELD, equal to cited_rejection_reason_ids for OVERTURNED" }
      - { name: overturn_ratio, type: number, source: computed, default: null, description: "round(count(overturned_rejection_reason_ids) / count(cited_rejection_reason_ids), 2); null before decision" }

  # --- Expedited review quota ---------------------------------------------------
  - name: ExpediteRequest
    parent: null
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; the build to accelerate" }
      - { name: publisher_account_id, type: string, source: system, description: "FK -> PublisherAccount.id; copied from the submission's AppRecord — the quota subject" }
      - { name: justification_category, type: enum, source: input, description: "CRITICAL_BUG | SECURITY_FIX | TIME_SENSITIVE_EVENT" }
      - { name: justification, type: string, source: input, description: "Publisher narrative", constraints: "20..1000 chars" }
      - { name: state, type: enum, source: system, default: REQUESTED, description: "REQUESTED | GRANTED | DENIED | CONSUMED | REFUNDED" }
      - { name: requested_at, type: datetime, source: system, description: "Clock instant of creation" }
      - { name: granted_at, type: datetime, source: system, default: null, description: "Clock instant of the GRANT decision; the rolling-window membership input of calculations.expedite_credit_ledger" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the deciding PlatformAppealBoard operator" }
      - { name: decision_rationale, type: string, source: system, default: null, description: "Rationale recorded at GRANT or DENY" }
      - { name: consumed_at, type: datetime, source: system, default: null, description: "Clock instant the cited submission entered WAITING_FOR_REVIEW on the EXPEDITED channel" }
      - { name: refunded_at, type: datetime, source: system, default: null, description: "Clock instant the credit was returned to the account (compensating action)" }

  # --- Platform review capacity (resource with aggregate interval semantics) ----
  - name: ReviewCapacityWindow
    parent: null
    common_fields: true
    fields:
      - { name: platform, type: enum, source: input, description: "IOS | ANDROID — must equal the platform of every assigned submission's AppRecord" }
      - { name: reviewer_pool_code, type: string, source: input, description: "Reviewer pool identifier, e.g. 'POOL_A'" }
      - { name: starts_at, type: datetime, source: input, description: "Half-open interval start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Half-open interval end (exclusive); must be > starts_at" }
      - { name: capacity_slots, type: integer, source: input, description: "Total review slots offered by this window", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED" }
      - { name: slots_reserved, type: integer, source: computed, default: 0, description: "Count of assigned Submission rows with state IN {WAITING_FOR_REVIEW, IN_REVIEW}" }
      - { name: slots_consumed, type: integer, source: computed, default: 0, description: "Count of assigned Submission rows with state IN {APPROVED, REJECTED, METADATA_REJECTED, APPEAL_PENDING, REJECTED_FINAL, SUPERSEDED}" }
      - { name: slots_available, type: integer, source: computed, description: "capacity_slots - slots_reserved - slots_consumed; conserved per calculations.review_capacity_allocation" }

  # --- Phased release / rollback -----------------------------------------------
  - name: RolloutPlan
    parent: null
    common_fields: true
    fields:
      - { name: app_record_id, type: string, source: input, description: "FK -> AppRecord.id; the app being released" }
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; the APPROVED build being released" }
      - { name: mode, type: enum, source: input, description: "IMMEDIATE | PHASED — must equal Submission.release_mode" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "ISO 8601 UTC instant the plan may start; closed-interval left endpoint for overlap arithmetic" }
      - { name: projected_end_at, type: datetime, source: computed, description: "PHASED: scheduled_start_at + PHASE_COUNT * MIN_PHASE_DWELL_HOURS; IMMEDIATE: scheduled_start_at — closed-interval right endpoint for overlap arithmetic" }
      - { name: state, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | PHASE_ACTIVE | PAUSED | COMPLETED | ROLLED_BACK | CANCELLED" }
      - { name: phase_index, type: integer, source: system, default: 0, description: "Index into PHASE_PCTS; 0 while SCHEDULED, 0..6 while PHASE_ACTIVE, 6 when COMPLETED" }
      - { name: released_share_pct, type: number, source: computed, default: 0.00, description: "PHASE_PCTS[phase_index] while PHASE_ACTIVE/PAUSED/COMPLETED, else 0.00" }
      - { name: held_back_share_pct, type: number, source: computed, default: 100.00, description: "100.00 - released_share_pct; the conserved complement" }
      - { name: phase_entered_at, type: datetime, source: system, default: null, description: "Clock instant the current phase_index was entered; the dwell-time baseline" }
      - { name: pause_reason_code, type: string, source: system, default: null, description: "Reason code of the last pause, including the cascade code POSTURE_DEGRADED" }
      - { name: rollback_reason_code, type: string, source: system, default: null, description: "Reason code of the emergency rollback" }
      - { name: halt_distribution, type: boolean, source: system, default: false, description: "When true the rollback also drives AppRecord.distribution_state to ROLLED_BACK; when false the app returns to NOT_DISTRIBUTED" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Clock instant of entry into COMPLETED" }
      - { name: terminated_at, type: datetime, source: system, default: null, description: "Clock instant of entry into ROLLED_BACK or CANCELLED; the buffer baseline for the next plan on the same app" }

  # --- Commerce surface --------------------------------------------------------
  - name: CommerceItem
    parent: null
    common_fields: true
    fields:
      - { name: app_record_id, type: string, source: input, description: "FK -> AppRecord.id; the owning app" }
      - { name: item_type, type: enum, source: input, description: "CONSUMABLE | NON_CONSUMABLE | SUBSCRIPTION | EXTERNAL_PAYMENT_LINK" }
      - { name: reference_name, type: string, source: input, description: "Internal item name", constraints: "unique per app_record_id" }
      - { name: price_tier_cents, type: integer, source: input, description: "List price in cents", constraints: ">= 0; must be 0 for EXTERNAL_PAYMENT_LINK" }
      - { name: entitlement_class, type: enum, source: input, description: "DIGITAL_CONTENT | PHYSICAL_GOOD | SERVICE — DIGITAL_CONTENT may never be sold through EXTERNAL_PAYMENT_LINK" }
      - { name: external_link_url, type: string, source: input, default: null, description: "Destination of the external payment link; REQUIRED when item_type == EXTERNAL_PAYMENT_LINK, MUST be null otherwise" }
      - { name: subscriber_retention_months, type: integer, source: input, default: 0, description: "Months of continuous paid subscription reported for this item; >= 12 unlocks the retained-subscriber rate" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | REMOVED" }
      - { name: rejection_note, type: string, source: system, default: null, description: "Reviewer note recorded on REJECT" }
      - { name: reported_gross_cents, type: integer, source: system, default: 0, description: "Gross proceeds reported for reported_period_label" }
      - { name: reported_period_label, type: string, source: system, default: null, description: "Settlement period the gross belongs to, e.g. '2026-Q3'" }
      - { name: commission_rate_applied, type: number, source: computed, default: null, description: "Rate selected by calculations.commission_settlement_cents for this line, 2 decimals" }
      - { name: commission_cents, type: integer, source: computed, default: 0, description: "Per-line commission, rounded before summation per the pinned rounding order" }

  # --- Guideline change impact --------------------------------------------------
  - name: ImpactAssessment
    parent: null
    common_fields: true
    fields:
      - { name: app_record_id, type: string, source: system, description: "FK -> AppRecord.id; the app the newly EFFECTIVE rule touches" }
      - { name: guideline_rule_id, type: string, source: system, description: "FK -> GuidelineRule.id; the newly EFFECTIVE rule" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | IN_ASSESSMENT | REMEDIATION_REQUIRED | OVERDUE | REMEDIATED | ACCEPTED_NO_CHANGE" }
      - { name: affected_feature_codes, type: array, source: system, default: [], description: "FeatureMapping.feature_code values the cascade moved to STALE, ordered by FeatureMapping.created_at ASC" }
      - { name: exposure_factor, type: number, source: computed, description: "1.5 when AppRecord.distribution_state IN {PHASED_ROLLOUT, FULLY_RELEASED, PAUSED}, else 1.0" }
      - { name: impact_severity, type: number, source: computed, description: "round(rule.severity_weight * count(affected_feature_codes) * exposure_factor, 2)" }
      - { name: remediation_deadline_at, type: datetime, source: computed, description: "guideline_rule.effective_from + guideline_rule.remediation_grace_days * 24h" }
      - { name: opened_at, type: datetime, source: system, description: "Clock instant of the publication cascade that created this row" }
      - { name: assessed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceOfficer driving the assessment" }
      - { name: assessed_at, type: datetime, source: system, default: null, description: "Clock instant of the last assessment action" }
      - { name: note, type: string, source: system, default: null, description: "Narrative recorded by the last assessment action" }
      - { name: remediated_at, type: datetime, source: system, default: null, description: "Clock instant of entry into REMEDIATED" }

# =============================================================================
# §1.2 State Machine Table (12 machines over 11 entities, 87 transitions)
# =============================================================================
state_machines:

  # --- Submission: cyclic (REJECTED -> DRAFT -> ... -> REJECTED) + fork-join ---
  - entity: Submission
    state_field: state
    initial_state: DRAFT
    terminal_states: [REJECTED_FINAL, DEVELOPER_WITHDRAWN, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "POST /submissions/{id}/pre-review-check (self-review found at least one blocking reason)"
        actor: ComplianceOfficer
        preconditions:
          - "AppRecord.compliance_posture != FROZEN (ERR_APP_COMPLIANCE_FROZEN)"
          - "PublisherAccount.program_status == ACTIVE (ERR_PROGRAM_MEMBERSHIP_EXPIRED / ERR_ACCOUNT_SUSPENDED)"
        side_effects:
          - "Recomputes Submission.disclosure_accuracy_score_provisional (calculations.disclosure_accuracy_score, variant SELF_REVIEW_PROVISIONAL)"
          - "Sets pre_review_checked_at = clock_now BEFORE the provisional score is computed, so the score's detected_at window includes this instant"
          - "Sets pre_review_passed = false and pre_review_blocking_reasons = the ordered blocking codes (ascending validations.priority; ties broken by the fixed code order METADATA_INCOMPLETE, SCREENSHOT_SET_EMPTY, AGE_RATING_UNDERSTATED, TRACKING_CONSENT_PROMPT_MISSING, PRIVACY_DISCLOSURE_INACCURATE, CRITICAL_FINDING_UNRESOLVED, GUIDELINE_MAPPING_INCOMPLETE, SIGNING_CREDENTIAL_INVALID)"
          - "Increments Submission.version by 1"
        note: "Self-review is a report, not a gate: the call returns 200 with the Submission even when blocking reasons exist. The same rules are enforced as hard errors at POST /submissions/{id}/queue."

      - from: DRAFT
        to: PRE_REVIEW_PASSED
        trigger: "POST /submissions/{id}/pre-review-check (zero blocking reasons)"
        actor: ComplianceOfficer
        preconditions:
          - "AppRecord.compliance_posture != FROZEN"
          - "PublisherAccount.program_status == ACTIVE"
          - "Zero blocking reasons per the ordered check list above"
        side_effects:
          - "Sets pre_review_checked_at = clock_now, pre_review_passed = true, pre_review_blocking_reasons = []"
          - "Sets attested_by_user_id = X-User-ID of the acting ComplianceOfficer"
          - "Recomputes disclosure_accuracy_score_provisional"
          - "Increments Submission.version by 1"

      - from: PRE_REVIEW_PASSED
        to: DRAFT
        trigger: "POST /metadata-locales, PUT /submissions/{id}/age-rating, or PUT /submissions/{id}/privacy-declaration"
        actor: ReleaseManager | ComplianceOfficer
        preconditions:
          - "AppRecord.compliance_posture != FROZEN"
        side_effects:
          - "Content mutation invalidates the attestation: pre_review_passed = false, pre_review_blocking_reasons = [], pre_review_checked_at = null, attested_by_user_id = null"
          - "Increments Submission.version by 1"
        note: "Derived-field reconciliation: any change to metadata, age rating answers or privacy declaration voids the self-review, so the submission must be re-checked before it can be queued."

      - from: PRE_REVIEW_PASSED
        to: WAITING_FOR_REVIEW
        trigger: "POST /submissions/{id}/queue"
        actor: ReleaseManager
        preconditions:
          - "pre_review_passed == true (ERR_PRE_REVIEW_NOT_PASSED)"
          - "clock_now - pre_review_checked_at <= PRE_REVIEW_FRESHNESS_HOURS (72h, inclusive) else ERR_PRE_REVIEW_STALE"
          - "AppRecord.compliance_posture == OPEN (FROZEN -> ERR_APP_COMPLIANCE_FROZEN, RESTRICTED -> ERR_APP_COMPLIANCE_RESTRICTED)"
          - "SigningCredential.status IN {ACTIVE, EXPIRING_SOON} and platform == AppRecord.platform (ERR_SIGNING_CREDENTIAL_INVALID / ERR_CREDENTIAL_PLATFORM_MISMATCH)"
          - "SigningCredential.not_after > the effective_review_deadline_at computed by this transition (ERR_CREDENTIAL_EXPIRES_BEFORE_DEADLINE)"
          - "Re-evaluated content gates at current clock: disclosure_accuracy_score_provisional >= DISCLOSURE_PASS_THRESHOLD, no BehaviorFinding with severity CRITICAL and status IN {OPEN, DISPUTED}, attested_age_rating >= derived_age_rating, complete guideline mapping coverage"
          - "A ReviewCapacityWindow is selectable per calculations.review_capacity_allocation (ERR_NO_REVIEW_CAPACITY)"
          - "If expedite_request_id is supplied: that ExpediteRequest.submission_id == this submission and state == GRANTED (ERR_INVALID_EXPEDITE_STATE)"
        side_effects:
          - "Sets review_window_id to the selected window; that window's slots_reserved += 1 and slots_available -= 1"
          - "Sets queued_at = clock_now and provisional_deadline_at = queued_at + BASE_SLA_HOURS (frozen forever)"
          - "Computes priority_score, priority_band and effective_review_deadline_at in the pinned order of calculations.review_priority_score"
          - "If expedite_request_id supplied: ExpediteRequest GRANTED -> CONSUMED (consumed_at = clock_now) and submission_channel = EXPEDITED"
          - "Increments Submission.version by 1"

      - from: WAITING_FOR_REVIEW
        to: IN_REVIEW
        trigger: "POST /submissions/{id}/claim"
        actor: PlatformReviewer
        preconditions:
          - "ReviewCapacityWindow.status == OPEN and starts_at <= clock_now < ends_at (ERR_REVIEW_WINDOW_CLOSED)"
          - "SigningCredential.status IN {ACTIVE, EXPIRING_SOON} (ERR_SIGNING_CREDENTIAL_INVALID)"
        side_effects:
          - "Sets reviewed_by_user_id = X-User-ID of the claiming PlatformReviewer (the segregation-of-duties subject for any later appeal)"
          - "Recomputes disclosure_accuracy_score_final (variant REVIEW_FINAL) — late-arriving findings now enter scope"
          - "Window slot accounting unchanged: the submission stays in the reserved set"
          - "Increments Submission.version by 1"

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /submissions/{id}/decision with outcome=APPROVE"
        actor: PlatformReviewer
        preconditions:
          - "disclosure_accuracy_score_final >= DISCLOSURE_PASS_THRESHOLD (ERR_PRIVACY_DISCLOSURE_INACCURATE)"
          - "No BehaviorFinding for this submission with severity CRITICAL and status IN {OPEN, DISPUTED} (ERR_CRITICAL_FINDING_UNRESOLVED)"
          - "attested_age_rating >= derived_age_rating (ERR_AGE_RATING_UNDERSTATED)"
          - "Every CommerceItem of the AppRecord with status == SUBMITTED has been reviewed, i.e. none remain in SUBMITTED (ERR_INVALID_COMMERCE_ITEM_STATE)"
        side_effects:
          - "Sets decided_at = clock_now; window slots_reserved -= 1 and slots_consumed += 1 (slots_available unchanged)"
          - "Any other Submission of the same AppRecord in state APPROVED transitions to SUPERSEDED"
          - "Recomputes AppRecord.compliance_posture and PublisherAccount standing scores"
          - "Increments Submission.version by 1"

      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /submissions/{id}/decision with outcome=REJECT"
        actor: PlatformReviewer
        preconditions:
          - "rejection_reasons is a non-empty array and every guideline_rule_id it cites references a GuidelineRule with status == EFFECTIVE (ERR_GUIDELINE_RULE_NOT_EFFECTIVE)"
        side_effects:
          - "Creates one RejectionReason row per entry (recorded_at = clock_now, recorded_by_user_id = reviewer, disposition = PENDING, appeal_disposition = PENDING)"
          - "Sets rejected_at = decided_at = clock_now; window slots_reserved -= 1 and slots_consumed += 1"
          - "CASCADE hop 1: every FeatureMapping of the AppRecord whose guideline_rule_id is cited by a CRITICAL or MAJOR reason moves PASSED -> FAILED"
          - "CASCADE hop 2 (caused by hop 1): AppRecord.feature_compliance_index is recomputed from the changed mapping statuses and, when it drops below POSTURE_INDEX_FLOOR, AppRecord.compliance_posture becomes RESTRICTED"
          - "CASCADE hop 3 (caused by hop 2): every RolloutPlan of the AppRecord in state PHASE_ACTIVE moves to PAUSED with pause_reason_code = POSTURE_DEGRADED"
          - "CASCADE hop 4 (caused by hop 3): AppRecord.distribution_state PHASED_ROLLOUT -> PAUSED while released_share_pct / held_back_share_pct are held at their pre-pause values"
          - "Recomputes PublisherAccount.rejection_strike_count and both standing_score variants"
          - "Increments Submission.version by 1"

      - from: IN_REVIEW
        to: METADATA_REJECTED
        trigger: "POST /submissions/{id}/decision with outcome=METADATA_REJECT"
        actor: PlatformReviewer
        preconditions:
          - "rejection_reasons is non-empty and every entry carries severity == MINOR (ERR_VALIDATION)"
        side_effects:
          - "Creates the RejectionReason rows exactly as the REJECT branch does"
          - "Sets rejected_at = decided_at = clock_now; window slots_reserved -= 1 and slots_consumed += 1"
          - "Divergent from the REJECT branch: NO FeatureMapping is touched, AppRecord.feature_compliance_index and compliance_posture are unchanged, no RolloutPlan is paused, and PublisherAccount.rejection_strike_count is unchanged (MINOR reasons never count as strikes)"
          - "Recomputes both PublisherAccount standing_score variants (MINOR penalty weight 2)"
          - "Increments Submission.version by 1"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /submissions/{id}/return-to-draft"
        actor: ReleaseManager
        preconditions:
          - "Every RejectionReason of this submission has disposition != PENDING (ERR_REJECTION_RESPONSE_REQUIRED)"
          - "No AppealRequest of this submission is in state IN {SUBMITTED, BOARD_REVIEW} (ERR_INVALID_APPEAL_STATE)"
          - "If signing_credential_id is supplied it must reference a SigningCredential with status IN {ACTIVE, EXPIRING_SOON} owned by the same account (ERR_SIGNING_CREDENTIAL_INVALID)"
        side_effects:
          - "resubmission_count += 1; pre_review_passed = false; pre_review_checked_at = null; attested_by_user_id = null"
          - "review_window_id = null, which decrements the previous window's slots_consumed by 1 and increments its slots_available by 1"
          - "Optionally re-points signing_credential_id"
          - "Increments Submission.version by 1"

      - from: METADATA_REJECTED
        to: DRAFT
        trigger: "POST /submissions/{id}/return-to-draft"
        actor: ReleaseManager
        preconditions:
          - "Every RejectionReason of this submission has disposition != PENDING"
        side_effects:
          - "Same side effects as the REJECTED -> DRAFT transition"

      - from: BLOCKED_INVALID_SIGNING
        to: DRAFT
        trigger: "POST /submissions/{id}/return-to-draft with signing_credential_id"
        actor: ReleaseManager
        preconditions:
          - "signing_credential_id is supplied and references a SigningCredential with status IN {ACTIVE, EXPIRING_SOON}, credential_type == PROVISIONING_PROFILE, platform == AppRecord.platform (ERR_SIGNING_CREDENTIAL_INVALID)"
        side_effects:
          - "Re-points signing_credential_id; pre_review_passed = false; resubmission_count += 1"
          - "Increments Submission.version by 1"

      - from: REJECTED
        to: APPEAL_PENDING
        trigger: "POST /appeal-requests"
        actor: ComplianceOfficer
        preconditions:
          - "clock_now <= rejected_at + APPEAL_WINDOW_DAYS * 24h (ERR_APPEAL_WINDOW_EXPIRED)"
          - "Every cited RejectionReason belongs to this submission and has disposition == CONTESTED (ERR_REJECTION_NOT_CONTESTED)"
          - "No AppealRequest of this submission is in state IN {SUBMITTED, BOARD_REVIEW} (ERR_APPEAL_ALREADY_OPEN)"
        side_effects:
          - "Creates the AppealRequest in state SUBMITTED with filed_at = clock_now"
          - "Increments Submission.version by 1"
        note: "METADATA_REJECTED is deliberately not appealable — filing from that state yields ERR_INVALID_SUBMISSION_STATE."

      - from: APPEAL_PENDING
        to: APPROVED
        trigger: "POST /appeal-requests/{id}/decide with outcome=OVERTURNED"
        actor: PlatformAppealBoard
        preconditions:
          - "AppealRequest.state == BOARD_REVIEW"
          - "X-User-ID != Submission.reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "All cited RejectionReason rows get appeal_disposition = OVERTURNED and leave the standing penalty scope"
          - "Every FeatureMapping moved to FAILED by the original rejection cascade returns to IN_PROGRESS, which recomputes AppRecord.feature_compliance_index and compliance_posture"
          - "Sets decided_at = clock_now on both AppealRequest and Submission; recomputes both PublisherAccount standing_score variants (+STANDING_APPEAL_CREDIT)"
          - "Increments Submission.version by 1"

      - from: APPEAL_PENDING
        to: REJECTED
        trigger: "POST /appeal-requests/{id}/decide with outcome=PARTIALLY_OVERTURNED"
        actor: PlatformAppealBoard
        preconditions:
          - "AppealRequest.state == BOARD_REVIEW"
          - "overturned_rejection_reason_ids is a non-empty strict subset of cited_rejection_reason_ids (ERR_VALIDATION)"
          - "X-User-ID != Submission.reviewed_by_user_id"
        side_effects:
          - "Cited reasons in overturned_rejection_reason_ids get appeal_disposition = OVERTURNED; the remainder get UPHELD"
          - "Only the FeatureMapping rows tied to overturned reasons return FAILED -> IN_PROGRESS"
          - "Submission returns to REJECTED so the publisher may respond and return it to DRAFT; rejected_at is NOT refreshed (the appeal window is not reopened)"
          - "Increments Submission.version by 1"

      - from: APPEAL_PENDING
        to: REJECTED_FINAL
        trigger: "POST /appeal-requests/{id}/decide with outcome=UPHELD"
        actor: PlatformAppealBoard
        preconditions:
          - "AppealRequest.state == BOARD_REVIEW"
          - "X-User-ID != Submission.reviewed_by_user_id"
        side_effects:
          - "All cited RejectionReason rows get appeal_disposition = UPHELD; standing penalties stay in scope"
          - "Terminal: the build can never be revived; the publisher must create a new Submission with a higher build_number"
          - "Increments Submission.version by 1"

      - from: DRAFT
        to: DEVELOPER_WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw"
        actor: ReleaseManager
        preconditions: []
        side_effects:
          - "Terminal; any ExpediteRequest of this submission in state IN {REQUESTED, GRANTED} moves to REFUNDED (refunded_at = clock_now), restoring PublisherAccount.expedite_credits_remaining"

      - from: PRE_REVIEW_PASSED
        to: DEVELOPER_WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw"
        actor: ReleaseManager
        preconditions: []
        side_effects:
          - "Same as the DRAFT -> DEVELOPER_WITHDRAWN transition"

      - from: WAITING_FOR_REVIEW
        to: DEVELOPER_WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw"
        actor: ReleaseManager
        preconditions:
          - "state != IN_REVIEW: once a reviewer has claimed the build the publisher can no longer withdraw it (ERR_INVALID_SUBMISSION_STATE)"
        side_effects:
          - "review_window_id = null, so the window's slots_reserved -= 1 and slots_available += 1 (compensating action for the queue reservation)"
          - "Any ExpediteRequest of this submission in state CONSUMED moves to REFUNDED, restoring PublisherAccount.expedite_credits_remaining to its pre-grant value"
          - "Terminal"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — another Submission of the same AppRecord is APPROVED"
        actor: system
        preconditions:
          - "No RolloutPlan of this submission is in state PHASE_ACTIVE (ERR_INVALID_ROLLOUT_STATE)"
        side_effects:
          - "Terminal; any RolloutPlan of this submission in state SCHEDULED moves to CANCELLED"
          - "Increments Submission.version by 1"

  # --- AppRecord dimension 1 of 2: listing_state (independent of distribution) --
  - entity: AppRecord
    state_field: listing_state
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: METADATA_COMPLETE
        trigger: "PATCH /app-records/{id}/listing with listing_action=COMPLETE_METADATA"
        actor: PublisherAdmin
        preconditions:
          - "At least one Submission of this app owns a MetadataLocale with is_primary == true and is_complete == true (ERR_METADATA_INCOMPLETE)"
        side_effects: ["Increments AppRecord.version by 1"]
      - from: METADATA_COMPLETE
        to: LISTED
        trigger: "PATCH /app-records/{id}/listing with listing_action=LIST"
        actor: PublisherAdmin
        preconditions:
          - "compliance_posture != FROZEN (ERR_APP_COMPLIANCE_FROZEN)"
          - "distribution_state != NOT_DISTRIBUTED — the store page may only go live once a build is actually distributed (ERR_APP_NOT_DISTRIBUTED)"
        side_effects: ["Increments AppRecord.version by 1"]
      - from: LISTED
        to: DELISTED
        trigger: "PATCH /app-records/{id}/listing with listing_action=DELIST"
        actor: PublisherAdmin | PlatformPolicyAdmin
        preconditions: []
        side_effects:
          - "Independent of the distribution dimension: an in-flight RolloutPlan keeps running and distribution_state is untouched"
          - "Increments AppRecord.version by 1"
      - from: DELISTED
        to: LISTED
        trigger: "PATCH /app-records/{id}/listing with listing_action=LIST"
        actor: PublisherAdmin
        preconditions:
          - "compliance_posture != FROZEN"
          - "distribution_state != NOT_DISTRIBUTED"
        side_effects: ["Increments AppRecord.version by 1"]
      - from: DELISTED
        to: DRAFT
        trigger: "PATCH /app-records/{id}/listing with listing_action=RETURN_TO_DRAFT"
        actor: PublisherAdmin
        preconditions:
          - "No RolloutPlan of this app is in state IN {SCHEDULED, PHASE_ACTIVE, PAUSED} (ERR_INVALID_ROLLOUT_STATE)"
        side_effects: ["Increments AppRecord.version by 1"]

  # --- AppRecord dimension 2 of 2: distribution_state (driven only by rollout) --
  - entity: AppRecord
    state_field: distribution_state
    initial_state: NOT_DISTRIBUTED
    terminal_states: []
    transitions:
      - from: NOT_DISTRIBUTED
        to: PHASED_ROLLOUT
        trigger: "system — POST /rollout-plans/{id}/start moved a plan SCHEDULED -> PHASE_ACTIVE"
        actor: system
        preconditions: ["The plan's Submission.state == APPROVED"]
        side_effects:
          - "Sets live_submission_id = plan.submission_id, released_share_pct = PHASE_PCTS[0], held_back_share_pct = 100.00 - PHASE_PCTS[0]"
          - "Increments AppRecord.version by 1"
      - from: PHASED_ROLLOUT
        to: FULLY_RELEASED
        trigger: "system — the plan advanced into the final phase (phase_index == PHASE_COUNT - 1) and reached COMPLETED"
        actor: system
        preconditions: ["released_share_pct == 100.00"]
        side_effects: ["held_back_share_pct = 0.00", "Increments AppRecord.version by 1"]
      - from: PHASED_ROLLOUT
        to: PAUSED
        trigger: "system — POST /rollout-plans/{id}/hold with action=PAUSE, or the posture-degradation cascade"
        actor: system
        preconditions: []
        side_effects: ["released_share_pct and held_back_share_pct are frozen at their current values", "Increments AppRecord.version by 1"]
      - from: PAUSED
        to: PHASED_ROLLOUT
        trigger: "system — POST /rollout-plans/{id}/hold with action=RESUME"
        actor: system
        preconditions: ["compliance_posture == OPEN (ERR_APP_COMPLIANCE_RESTRICTED)"]
        side_effects: ["Increments AppRecord.version by 1"]
      - from: PHASED_ROLLOUT
        to: ROLLED_BACK
        trigger: "system — POST /rollout-plans/{id}/rollback with halt_distribution=true"
        actor: system
        preconditions: []
        side_effects:
          - "live_submission_id = null, released_share_pct = 0.00, held_back_share_pct = 100.00, rollback_count += 1"
          - "Increments AppRecord.version by 1"
      - from: PAUSED
        to: NOT_DISTRIBUTED
        trigger: "system — POST /rollout-plans/{id}/rollback with halt_distribution=false"
        actor: system
        preconditions: []
        side_effects:
          - "live_submission_id = null, released_share_pct = 0.00, held_back_share_pct = 100.00, rollback_count += 1"
          - "Divergent from the halt_distribution=true branch: the app stays eligible for an immediate new rollout plan (no ROLLBACK_COOLDOWN_HOURS buffer is applied)"
          - "Increments AppRecord.version by 1"
      - from: FULLY_RELEASED
        to: PHASED_ROLLOUT
        trigger: "system — a later plan for a newer APPROVED submission started"
        actor: system
        preconditions: ["The new plan's submission_id != live_submission_id"]
        side_effects: ["live_submission_id re-points to the new plan's submission", "Increments AppRecord.version by 1"]
      - from: ROLLED_BACK
        to: PHASED_ROLLOUT
        trigger: "system — a replacement plan started after the cooldown buffer"
        actor: system
        preconditions: ["clock_now >= previous plan.terminated_at + ROLLBACK_COOLDOWN_HOURS (ERR_ROLLOUT_WINDOW_CONFLICT)"]
        side_effects: ["Increments AppRecord.version by 1"]

  # --- SigningCredential: key custody, expiry and compromise cascade ------------
  - entity: SigningCredential
    state_field: status
    initial_state: PENDING_ACTIVATION
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /signing-credentials/{id}/activate"
        actor: PublisherAdmin
        preconditions:
          - "not_before <= clock_now < not_after (ERR_CREDENTIAL_NOT_YET_VALID)"
          - "PublisherAccount.program_status == ACTIVE (ERR_PROGRAM_MEMBERSHIP_EXPIRED)"
          - "credential_type == DISTRIBUTION_CERT implies key_custody != LOCAL_KEYCHAIN (ERR_KEY_CUSTODY_NOT_PERMITTED)"
          - "credential_type == PROVISIONING_PROFILE implies the linked_cert_id credential has status == ACTIVE (ERR_LINKED_CERT_NOT_ACTIVE)"
        side_effects:
          - "Any other SigningCredential of the same (publisher_account_id, credential_type, platform) in status IN {ACTIVE, EXPIRING_SOON} moves to REVOKED with revocation_reason = SUPERSEDED"
          - "Recomputes compliance_posture of every AppRecord of the account (an ACTIVE DISTRIBUTION_CERT is a posture input)"
          - "Increments SigningCredential.version by 1"
      - from: ACTIVE
        to: EXPIRING_SOON
        trigger: "system — POST /_clock/set_current_utc lands inside the warning window"
        actor: system
        preconditions:
          - "clock_now < not_after and (not_after - clock_now) <= CREDENTIAL_EXPIRY_WARNING_HOURS"
        side_effects: ["Increments SigningCredential.version by 1"]
        note: "EXPIRING_SOON is still a valid signing status: submissions may be queued with it as long as not_after > effective_review_deadline_at."
      - from: EXPIRING_SOON
        to: EXPIRED
        trigger: "system — POST /_clock/set_current_utc reaches or passes not_after"
        actor: system
        preconditions: ["clock_now >= not_after (the interval is half-open, so equality expires)"]
        side_effects:
          - "Recomputes compliance_posture of every AppRecord of the account"
          - "Increments SigningCredential.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — POST /_clock/set_current_utc jumps past not_after without passing through the warning window"
        actor: system
        preconditions: ["clock_now >= not_after"]
        side_effects: ["Recomputes compliance_posture of every AppRecord of the account", "Increments SigningCredential.version by 1"]
      - from: ACTIVE
        to: COMPROMISED
        trigger: "POST /signing-credentials/{id}/report-compromise"
        actor: PublisherAdmin | PlatformPolicyAdmin
        preconditions:
          - "status IN {ACTIVE, EXPIRING_SOON} (ERR_INVALID_CREDENTIAL_STATE)"
        side_effects:
          - "Sets compromised_at = clock_now"
          - "CASCADE hop 1: every SigningCredential whose linked_cert_id == this credential id and whose status IN {PENDING_ACTIVATION, ACTIVE, EXPIRING_SOON} moves to REVOKED with revocation_reason = COMPROMISE_CASCADE"
          - "CASCADE hop 2 (caused by hop 1): every Submission whose signing_credential_id is one of those revoked profiles and whose state IN {WAITING_FOR_REVIEW, IN_REVIEW} moves to BLOCKED_INVALID_SIGNING, sets review_window_id = null (that window's slots_reserved -= 1, slots_available += 1) and increments the revoked credential's blocked_submission_count"
          - "CASCADE hop 3 (caused by hop 2): AppRecord.compliance_posture of each affected app is recomputed; with no ACTIVE DISTRIBUTION_CERT left it becomes RESTRICTED"
          - "CASCADE hop 4 (caused by hop 3): every RolloutPlan of those apps in state PHASE_ACTIVE moves to PAUSED with pause_reason_code = POSTURE_DEGRADED, which drives AppRecord.distribution_state PHASED_ROLLOUT -> PAUSED"
          - "Increments SigningCredential.version by 1"
      - from: EXPIRING_SOON
        to: COMPROMISED
        trigger: "POST /signing-credentials/{id}/report-compromise"
        actor: PublisherAdmin | PlatformPolicyAdmin
        preconditions: []
        side_effects: ["Identical cascade to the ACTIVE -> COMPROMISED transition"]
      - from: COMPROMISED
        to: REVOKED
        trigger: "POST /signing-credentials/{id}/revoke"
        actor: PublisherAdmin
        preconditions: []
        side_effects: ["Sets revocation_reason = MANUAL", "Increments SigningCredential.version by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /signing-credentials/{id}/revoke"
        actor: PublisherAdmin
        preconditions:
          - "No Submission signed with this credential is in state IN {WAITING_FOR_REVIEW, IN_REVIEW} (ERR_CREDENTIAL_IN_USE)"
        side_effects: ["Sets revocation_reason = MANUAL", "Recomputes compliance_posture of every AppRecord of the account", "Increments SigningCredential.version by 1"]

  # --- RolloutPlan: self-looping phase advance + emergency rollback -------------
  - entity: RolloutPlan
    state_field: state
    initial_state: SCHEDULED
    terminal_states: [ROLLED_BACK, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PHASE_ACTIVE
        trigger: "POST /rollout-plans/{id}/start"
        actor: ReleaseManager
        preconditions:
          - "clock_now >= scheduled_start_at (ERR_ROLLOUT_NOT_DUE)"
          - "Submission.state == APPROVED (ERR_INVALID_SUBMISSION_STATE)"
          - "AppRecord.compliance_posture == OPEN (ERR_APP_COMPLIANCE_RESTRICTED / ERR_APP_COMPLIANCE_FROZEN)"
          - "No other RolloutPlan of the same AppRecord is in state IN {PHASE_ACTIVE, PAUSED} (ERR_ROLLOUT_WINDOW_CONFLICT)"
        side_effects:
          - "PHASED: phase_index = 0, released_share_pct = PHASE_PCTS[0] = 1.00, held_back_share_pct = 99.00, phase_entered_at = clock_now; AppRecord.distribution_state -> PHASED_ROLLOUT"
          - "IMMEDIATE (divergent branch): phase_index = PHASE_COUNT - 1, released_share_pct = 100.00, held_back_share_pct = 0.00, state goes straight to COMPLETED with completed_at = clock_now and AppRecord.distribution_state -> FULLY_RELEASED without ever exposing a partial audience"
          - "Sets AppRecord.live_submission_id = submission_id"
          - "Increments RolloutPlan.version and AppRecord.version by 1 each"
      - from: PHASE_ACTIVE
        to: PHASE_ACTIVE
        trigger: "POST /rollout-plans/{id}/advance"
        actor: ReleaseManager
        preconditions:
          - "to_phase_index == phase_index + 1 — no skipping and no repeating (ERR_PHASE_SEQUENCE_INVALID)"
          - "to_phase_index <= PHASE_COUNT - 1 (ERR_PHASE_SEQUENCE_INVALID)"
          - "clock_now >= phase_entered_at + MIN_PHASE_DWELL_HOURS, evaluated inclusively (ERR_PHASE_DWELL_NOT_MET)"
          - "AppRecord.compliance_posture == OPEN (ERR_APP_COMPLIANCE_RESTRICTED)"
        side_effects:
          - "phase_index = to_phase_index, phase_entered_at = clock_now, released_share_pct = PHASE_PCTS[to_phase_index], held_back_share_pct = 100.00 - released_share_pct"
          - "Mirrors both share fields onto the AppRecord (conserved pair)"
          - "Increments RolloutPlan.version and AppRecord.version by 1 each"
      - from: PHASE_ACTIVE
        to: COMPLETED
        trigger: "POST /rollout-plans/{id}/advance with to_phase_index == PHASE_COUNT - 1"
        actor: ReleaseManager
        preconditions:
          - "Same preconditions as the self-loop; this is the loop's exit edge"
        side_effects:
          - "released_share_pct = 100.00, held_back_share_pct = 0.00, completed_at = clock_now"
          - "AppRecord.distribution_state PHASED_ROLLOUT -> FULLY_RELEASED"
          - "Increments RolloutPlan.version and AppRecord.version by 1 each"
      - from: PHASE_ACTIVE
        to: PAUSED
        trigger: "POST /rollout-plans/{id}/hold with action=PAUSE, or the posture-degradation cascade"
        actor: ReleaseManager | PlatformPolicyAdmin | system
        preconditions: []
        side_effects:
          - "pause_reason_code recorded (POSTURE_DEGRADED when raised by a cascade); shares frozen; AppRecord.distribution_state -> PAUSED"
          - "Increments RolloutPlan.version and AppRecord.version by 1 each"
      - from: PAUSED
        to: PHASE_ACTIVE
        trigger: "POST /rollout-plans/{id}/hold with action=RESUME"
        actor: ReleaseManager
        preconditions:
          - "AppRecord.compliance_posture == OPEN (ERR_APP_COMPLIANCE_RESTRICTED)"
        side_effects:
          - "pause_reason_code = null; phase_entered_at = clock_now, so the dwell clock restarts on resume; AppRecord.distribution_state -> PHASED_ROLLOUT"
          - "Increments RolloutPlan.version and AppRecord.version by 1 each"
      - from: PHASE_ACTIVE
        to: ROLLED_BACK
        trigger: "POST /rollout-plans/{id}/rollback"
        actor: ReleaseManager | PlatformPolicyAdmin
        preconditions: []
        side_effects:
          - "released_share_pct = 0.00, held_back_share_pct = 100.00, terminated_at = clock_now, rollback_reason_code recorded"
          - "AppRecord.rollback_count += 1, live_submission_id = null, and distribution_state -> ROLLED_BACK when halt_distribution == true, else -> NOT_DISTRIBUTED"
          - "Recomputes both PublisherAccount standing_score variants (a rollback removes the clean-rollout credit)"
          - "Increments RolloutPlan.version and AppRecord.version by 1 each"
      - from: PAUSED
        to: ROLLED_BACK
        trigger: "POST /rollout-plans/{id}/rollback"
        actor: ReleaseManager | PlatformPolicyAdmin
        preconditions: []
        side_effects: ["Identical to the PHASE_ACTIVE -> ROLLED_BACK transition"]
      - from: COMPLETED
        to: ROLLED_BACK
        trigger: "POST /rollout-plans/{id}/rollback"
        actor: ReleaseManager | PlatformPolicyAdmin
        preconditions: []
        side_effects:
          - "Emergency rollback of a fully released build: identical field updates, and AppRecord.distribution_state FULLY_RELEASED -> ROLLED_BACK when halt_distribution == true"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system — the plan's Submission moved to SUPERSEDED"
        actor: system
        preconditions: []
        side_effects: ["terminated_at = clock_now; no share fields ever moved, so no audience accounting is required"]

  # --- GuidelineRule: publication drives the guideline-change cascade -----------
  - entity: GuidelineRule
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "POST /guideline-rules/{id}/publish"
        actor: PlatformPolicyAdmin
        preconditions:
          - "effective_from <= clock_now (ERR_RULE_NOT_YET_EFFECTIVE)"
          - "If supersedes_rule_id is set, that rule has status == EFFECTIVE (ERR_GUIDELINE_RULE_NOT_EFFECTIVE)"
        side_effects:
          - "Sets published_at = clock_now"
          - "CASCADE hop 1: when supersedes_rule_id is set, the superseded rule moves EFFECTIVE -> SUPERSEDED and every FeatureMapping pointing at it is re-pointed to this rule; each such mapping whose self_review_status IN {PASSED, WAIVED_BY_PLATFORM} moves to STALE with staled_by_rule_id = this rule id"
          - "CASCADE hop 2 (caused by hop 1): for every AppRecord that owns at least one staled mapping an ImpactAssessment row is created (status OPEN, affected_feature_codes = the staled feature_codes ordered by FeatureMapping.created_at ASC, remediation_deadline_at = effective_from + remediation_grace_days * 24h) and AppRecord.feature_compliance_index is recomputed with the STALE factor, driving compliance_posture to RESTRICTED"
          - "CASCADE hop 3 (caused by hop 2): every RolloutPlan of those apps in state PHASE_ACTIVE moves to PAUSED with pause_reason_code = POSTURE_DEGRADED"
          - "CASCADE hop 4 (caused by hop 3): AppRecord.distribution_state PHASED_ROLLOUT -> PAUSED with both share fields frozen"
          - "Sets impacted_app_count = number of ImpactAssessment rows created; increments GuidelineRule.version by 1"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system — a rule whose supersedes_rule_id references this rule was published"
        actor: system
        preconditions: []
        side_effects:
          - "Terminal; the rule keeps binding historical RejectionReason rows but no longer requires feature mapping coverage"
          - "Increments GuidelineRule.version by 1"

  # --- FeatureMapping: self-review lifecycle with staling loop -------------------
  - entity: FeatureMapping
    state_field: self_review_status
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /feature-mappings/{id}/self-review with outcome=START"
        actor: ComplianceOfficer
        preconditions: ["AppRecord.compliance_posture != FROZEN", "GuidelineRule.status == EFFECTIVE (ERR_GUIDELINE_RULE_NOT_EFFECTIVE)"]
        side_effects: ["Recomputes AppRecord.feature_compliance_index and compliance_posture", "Increments FeatureMapping.version by 1"]
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /feature-mappings/{id}/self-review with outcome=PASS"
        actor: ComplianceOfficer
        preconditions: ["evidence_ref is non-empty on the mapping or supplied in the request (ERR_EVIDENCE_REQUIRED)"]
        side_effects:
          - "Sets attested_by_user_id and attested_at = clock_now"
          - "Recomputes AppRecord.feature_compliance_index; when the index reaches POSTURE_INDEX_FLOOR and no other posture input objects, compliance_posture becomes OPEN"
          - "Increments FeatureMapping.version by 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /feature-mappings/{id}/self-review with outcome=FAIL"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Recomputes AppRecord.feature_compliance_index (FAILED factor 0.0) and compliance_posture"
          - "Increments FeatureMapping.version by 1"
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /feature-mappings/{id}/self-review with outcome=START"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Recomputes AppRecord.feature_compliance_index and compliance_posture", "Increments FeatureMapping.version by 1"]
      - from: PASSED
        to: STALE
        trigger: "system — the guideline publication cascade re-pointed this mapping"
        actor: system
        preconditions: []
        side_effects: ["Sets staled_by_rule_id; recomputes AppRecord.feature_compliance_index (STALE factor 0.5)", "Increments FeatureMapping.version by 1"]
      - from: WAIVED_BY_PLATFORM
        to: STALE
        trigger: "system — the guideline publication cascade re-pointed this mapping"
        actor: system
        preconditions: []
        side_effects: ["Clears waiver_reason; the waiver does not survive a guideline revision", "Increments FeatureMapping.version by 1"]
      - from: STALE
        to: IN_PROGRESS
        trigger: "POST /feature-mappings/{id}/self-review with outcome=START"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Recomputes AppRecord.feature_compliance_index and compliance_posture", "Increments FeatureMapping.version by 1"]
      - from: FAILED
        to: WAIVED_BY_PLATFORM
        trigger: "POST /feature-mappings/{id}/waive"
        actor: PlatformPolicyAdmin
        preconditions: ["GuidelineRule.category != SAFETY — safety guidelines can never be waived (ERR_WAIVER_NOT_PERMITTED)"]
        side_effects: ["Sets waiver_reason; recomputes AppRecord.feature_compliance_index (WAIVED factor 1.0) and compliance_posture", "Increments FeatureMapping.version by 1"]
      - from: STALE
        to: WAIVED_BY_PLATFORM
        trigger: "POST /feature-mappings/{id}/waive"
        actor: PlatformPolicyAdmin
        preconditions: ["GuidelineRule.category != SAFETY"]
        side_effects: ["Same as the FAILED -> WAIVED_BY_PLATFORM transition"]

  # --- ImpactAssessment: branching remediation with an overdue arm --------------
  - entity: ImpactAssessment
    state_field: status
    initial_state: OPEN
    terminal_states: [REMEDIATED, ACCEPTED_NO_CHANGE]
    transitions:
      - from: OPEN
        to: IN_ASSESSMENT
        trigger: "POST /impact-assessments/{id}/assess with action=START"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Sets assessed_by_user_id and assessed_at = clock_now; recomputes impact_severity with the current exposure_factor", "Increments ImpactAssessment.version by 1"]
      - from: IN_ASSESSMENT
        to: REMEDIATION_REQUIRED
        trigger: "POST /impact-assessments/{id}/assess with action=REQUIRE_REMEDIATION"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Branch A: AppRecord.compliance_posture stays RESTRICTED and the remediation clock starts running against remediation_deadline_at"
          - "Increments ImpactAssessment.version by 1"
      - from: IN_ASSESSMENT
        to: ACCEPTED_NO_CHANGE
        trigger: "POST /impact-assessments/{id}/assess with action=ACCEPT_NO_CHANGE"
        actor: ComplianceOfficer
        preconditions:
          - "GuidelineRule.category != SAFETY and impact_severity <= ACCEPT_NO_CHANGE_SEVERITY_CEILING (ERR_IMPACT_TOO_SEVERE)"
        side_effects:
          - "Branch B (divergent from branch A): terminal; every affected FeatureMapping in STALE is restored to PASSED, AppRecord.feature_compliance_index is recomputed and, with no other objection, compliance_posture returns to OPEN"
          - "Increments ImpactAssessment.version by 1"
      - from: REMEDIATION_REQUIRED
        to: REMEDIATED
        trigger: "POST /impact-assessments/{id}/assess with action=MARK_REMEDIATED"
        actor: ComplianceOfficer
        preconditions:
          - "Every FeatureMapping named in affected_feature_codes has self_review_status IN {PASSED, WAIVED_BY_PLATFORM} (ERR_REMEDIATION_INCOMPLETE)"
        side_effects: ["Sets remediated_at = clock_now; recomputes AppRecord.compliance_posture", "Increments ImpactAssessment.version by 1"]
      - from: REMEDIATION_REQUIRED
        to: OVERDUE
        trigger: "system — POST /_clock/set_current_utc passes remediation_deadline_at"
        actor: system
        preconditions: ["clock_now > remediation_deadline_at (strictly greater: landing exactly on the deadline keeps the row REMEDIATION_REQUIRED)"]
        side_effects:
          - "AppRecord.compliance_posture becomes FROZEN, which blocks every publisher write on the app and its children"
          - "Every RolloutPlan of the app in state IN {PHASE_ACTIVE} moves to PAUSED with pause_reason_code = POSTURE_DEGRADED"
          - "Increments ImpactAssessment.version by 1"
      - from: OVERDUE
        to: REMEDIATED
        trigger: "POST /impact-assessments/{id}/assess with action=MARK_REMEDIATED"
        actor: ComplianceOfficer
        preconditions:
          - "Every FeatureMapping named in affected_feature_codes has self_review_status IN {PASSED, WAIVED_BY_PLATFORM}"
        side_effects:
          - "Sets remediated_at = clock_now; AppRecord.compliance_posture is recomputed and leaves FROZEN once no OVERDUE row remains"
          - "Increments ImpactAssessment.version by 1"
        note: "Remediating an OVERDUE row is the only publisher action permitted while the app is FROZEN (validations priority 40 exempts this endpoint)."

  # --- AppealRequest: fork-join with segregation of duties -----------------------
  - entity: AppealRequest
    state_field: state
    initial_state: SUBMITTED
    terminal_states: [UPHELD, OVERTURNED, PARTIALLY_OVERTURNED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: BOARD_REVIEW
        trigger: "POST /appeal-requests/{id}/board-review"
        actor: PlatformAppealBoard
        preconditions: ["Submission.state == APPEAL_PENDING (ERR_INVALID_SUBMISSION_STATE)"]
        side_effects: ["Sets board_started_at = clock_now", "Increments AppealRequest.version by 1"]
      - from: BOARD_REVIEW
        to: OVERTURNED
        trigger: "POST /appeal-requests/{id}/decide with outcome=OVERTURNED"
        actor: PlatformAppealBoard
        preconditions:
          - "X-User-ID != Submission.reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "overturned_rejection_reason_ids = cited_rejection_reason_ids, overturn_ratio = 1.00"
          - "Drives Submission APPEAL_PENDING -> APPROVED with all of that transition's side effects"
          - "Increments AppealRequest.version by 1"
      - from: BOARD_REVIEW
        to: PARTIALLY_OVERTURNED
        trigger: "POST /appeal-requests/{id}/decide with outcome=PARTIALLY_OVERTURNED"
        actor: PlatformAppealBoard
        preconditions:
          - "overturned_rejection_reason_ids is a non-empty strict subset of cited_rejection_reason_ids (ERR_VALIDATION)"
          - "X-User-ID != Submission.reviewed_by_user_id"
        side_effects:
          - "overturn_ratio = round(count(overturned) / count(cited), 2)"
          - "Drives Submission APPEAL_PENDING -> REJECTED"
          - "Increments AppealRequest.version by 1"
      - from: BOARD_REVIEW
        to: UPHELD
        trigger: "POST /appeal-requests/{id}/decide with outcome=UPHELD"
        actor: PlatformAppealBoard
        preconditions:
          - "X-User-ID != Submission.reviewed_by_user_id"
        side_effects:
          - "overturned_rejection_reason_ids = [], overturn_ratio = 0.00"
          - "Drives Submission APPEAL_PENDING -> REJECTED_FINAL"
          - "Increments AppealRequest.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /appeal-requests/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Submission returns APPEAL_PENDING -> REJECTED without refreshing rejected_at, so the original APPEAL_WINDOW_DAYS window keeps running"
          - "Increments AppealRequest.version by 1"

  # --- ExpediteRequest: quota grant with compensating refund ---------------------
  - entity: ExpediteRequest
    state_field: state
    initial_state: REQUESTED
    terminal_states: [DENIED, CONSUMED, REFUNDED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /expedite-requests/{id}/decide with outcome=GRANT"
        actor: PlatformAppealBoard
        preconditions:
          - "PublisherAccount.expedite_credits_remaining >= 1 (ERR_EXPEDITE_QUOTA_EXHAUSTED)"
          - "PublisherAccount.standing_score_rolling_365 >= EXPEDITE_STANDING_FLOOR (ERR_STANDING_TOO_LOW)"
          - "Submission.state IN {DRAFT, PRE_REVIEW_PASSED} (ERR_INVALID_SUBMISSION_STATE)"
        side_effects:
          - "Sets granted_at = clock_now and decided_by_user_id; the row enters the rolling window, so PublisherAccount.expedite_credits_remaining decreases by exactly 1"
          - "Increments ExpediteRequest.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /expedite-requests/{id}/decide with outcome=DENY"
        actor: PlatformAppealBoard
        preconditions: []
        side_effects: ["Terminal; no credit is consumed, so expedite_credits_remaining is unchanged", "Increments ExpediteRequest.version by 1"]
      - from: GRANTED
        to: CONSUMED
        trigger: "system — POST /submissions/{id}/queue cited this request"
        actor: system
        preconditions: ["The cited submission is the same submission_id (ERR_VALIDATION)"]
        side_effects: ["Sets consumed_at = clock_now; the credit stays consumed", "Increments ExpediteRequest.version by 1"]
      - from: GRANTED
        to: REFUNDED
        trigger: "system — POST /submissions/{id}/withdraw on the cited submission"
        actor: system
        preconditions: []
        side_effects: ["Sets refunded_at = clock_now; the row leaves the credit window so expedite_credits_remaining returns to its pre-grant value", "Increments ExpediteRequest.version by 1"]
      - from: REQUESTED
        to: REFUNDED
        trigger: "system — POST /submissions/{id}/withdraw on the cited submission"
        actor: system
        preconditions: []
        side_effects: ["Sets refunded_at = clock_now; no credit had been consumed, so expedite_credits_remaining is unchanged (void, not a refund)"]
      - from: CONSUMED
        to: REFUNDED
        trigger: "system — POST /submissions/{id}/withdraw while the submission is still WAITING_FOR_REVIEW"
        actor: system
        preconditions: ["Submission.state == WAITING_FOR_REVIEW — once a reviewer claims the build the credit is spent for good"]
        side_effects: ["Sets refunded_at = clock_now; expedite_credits_remaining returns to its pre-grant value", "Increments ExpediteRequest.version by 1"]

  # --- CommerceItem: review cycle + rollback-driven removal ----------------------
  - entity: CommerceItem
    state_field: status
    initial_state: DRAFT
    terminal_states: [REMOVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /commerce-items/{id}/submit"
        actor: PublisherAdmin
        preconditions:
          - "AppRecord.compliance_posture != FROZEN"
          - "item_type == EXTERNAL_PAYMENT_LINK implies the app's ACTIVE DISTRIBUTION_CERT carries the EXTERNAL_PAYMENT_LINK entitlement (ERR_EXTERNAL_LINK_NOT_PERMITTED)"
          - "item_type == EXTERNAL_PAYMENT_LINK implies entitlement_class != DIGITAL_CONTENT (ERR_EXTERNAL_LINK_NOT_PERMITTED)"
        side_effects: ["Increments CommerceItem.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /commerce-items/{id}/review with outcome=APPROVE"
        actor: PlatformReviewer
        preconditions: []
        side_effects: ["Recomputes commission_rate_applied and commission_cents from the current reported_gross_cents", "Increments CommerceItem.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /commerce-items/{id}/review with outcome=REJECT"
        actor: PlatformReviewer
        preconditions: ["rejection_note is non-empty (ERR_VALIDATION)"]
        side_effects: ["Increments CommerceItem.version by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /commerce-items/{id}/submit"
        actor: PublisherAdmin
        preconditions: ["Same preconditions as DRAFT -> SUBMITTED"]
        side_effects: ["Clears rejection_note", "Increments CommerceItem.version by 1"]
      - from: APPROVED
        to: REMOVED
        trigger: "system — a RolloutPlan of the app was rolled back with halt_distribution == true"
        actor: system
        preconditions: ["item_type == EXTERNAL_PAYMENT_LINK — only external commerce surfaces are torn down by a halting rollback"]
        side_effects: ["Terminal; the item leaves the commission settlement input set from the next settlement read onward"]

  # --- BehaviorFinding: triage branches feeding the accuracy calculation ---------
  - entity: BehaviorFinding
    state_field: status
    initial_state: OPEN
    terminal_states: [RECONCILED, DISMISSED]
    transitions:
      - from: OPEN
        to: DISPUTED
        trigger: "POST /behavior-findings/{id}/triage with action=DISPUTE"
        actor: ComplianceOfficer
        preconditions: ["justification is non-empty (ERR_VALIDATION)"]
        side_effects:
          - "Sets triaged_by_user_id, triage_justification, triaged_at = clock_now"
          - "DISPUTED findings remain in the REVIEW_FINAL penalty scope but leave the SELF_REVIEW_PROVISIONAL scope, so the two score variants diverge"
          - "Recomputes Submission.disclosure_accuracy_score_provisional and, when the submission is IN_REVIEW, disclosure_accuracy_score_final"
          - "Increments BehaviorFinding.version by 1"
      - from: OPEN
        to: RECONCILED
        trigger: "POST /behavior-findings/{id}/triage with action=RECONCILE"
        actor: PlatformPolicyAdmin
        preconditions:
          - "The Submission's declared_privacy_items now contain a tuple matching (data_type, observed_purpose, observed_linked_to_user, observed_tracking) (ERR_DISCLOSURE_STILL_MISSING)"
        side_effects:
          - "Leaves both penalty scopes; recomputes both score variants and AppRecord.compliance_posture when severity == CRITICAL"
          - "Increments BehaviorFinding.version by 1"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /behavior-findings/{id}/triage with action=DISMISS"
        actor: PlatformPolicyAdmin
        preconditions: ["justification is non-empty"]
        side_effects: ["Leaves both penalty scopes (false positive); recomputes both score variants", "Increments BehaviorFinding.version by 1"]
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /behavior-findings/{id}/triage with action=RECONCILE"
        actor: PlatformPolicyAdmin
        preconditions: ["Same disclosure-match precondition as OPEN -> RECONCILED"]
        side_effects: ["Same as OPEN -> RECONCILED"]
      - from: DISPUTED
        to: DISMISSED
        trigger: "POST /behavior-findings/{id}/triage with action=DISMISS"
        actor: PlatformPolicyAdmin
        preconditions: []
        side_effects: ["Same as OPEN -> DISMISSED"]

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: submission-create-stale-app-record
    parent_entity: AppRecord
    write_endpoint: "POST /submissions"
    occ_field: "expected_app_record_version"
    description: |
      Creating a Submission against an AppRecord whose version has advanced
      since the client last read it is rejected. A new submission legitimately
      supersedes the app's other DRAFT submissions (they move to
      DEVELOPER_WITHDRAWN), so the write is only safe against the exact app
      revision the client observed; a stale expected_app_record_version means
      the client's view of the app's draft set, posture or live build is out of
      date.
    error_id: ERR_STALE_APP_RECORD_VERSION
    http_status: 412

  - rule_id: rollout-plan-create-stale-app-record
    parent_entity: AppRecord
    write_endpoint: "POST /rollout-plans"
    occ_field: "expected_app_record_version"
    description: |
      Creating a RolloutPlan against an AppRecord whose version has advanced
      since the client last read it is rejected. A newly created plan
      legitimately supersedes the app's SCHEDULED plans (they move to
      CANCELLED) and re-targets the audience share fields, so a stale
      expected_app_record_version means the client is planning a release from
      an outdated view of distribution_state, released_share_pct and the
      cooldown baseline.
    error_id: ERR_STALE_APP_RECORD_VERSION
    http_status: 412

  - rule_id: credential-create-stale-account
    parent_entity: PublisherAccount
    write_endpoint: "POST /signing-credentials"
    occ_field: "expected_publisher_account_version"
    description: |
      Creating a SigningCredential against a PublisherAccount whose version has
      advanced since the client last read it is rejected. Activating a new
      DISTRIBUTION_CERT legitimately supersedes the account's existing active
      cert of the same platform, so key material must only be enrolled against
      the exact account revision the client observed; a stale
      expected_publisher_account_version means the client cannot know which
      certificate it is about to displace.
    error_id: ERR_STALE_PUBLISHER_ACCOUNT_VERSION
    http_status: 412

  - rule_id: membership-renewal-stale-account
    parent_entity: PublisherAccount
    write_endpoint: "POST /publisher-accounts/{id}/membership-renewal"
    occ_field: "expected_publisher_account_version"
    description: |
      Renewing program membership against a PublisherAccount whose version has
      advanced since the client last read it is rejected. Renewal is a
      legitimately repeatable operation that extends membership_paid_through_at
      from its current value, so a renewal computed against a stale account
      revision would extend the wrong baseline.
    error_id: ERR_STALE_PUBLISHER_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (13 rules)
# =============================================================================
calculations:

  - name: feature_compliance_index
    trigger: "Any FeatureMapping self_review_status change (self-review, waive, guideline-publish staling, rejection cascade, appeal restoration), FeatureMapping creation, and GuidelineRule publication"
    algorithm: weighted_scoring
    formula: |
      input_mappings = every FeatureMapping m with m.app_record_id == app.id
                       AND the GuidelineRule m.guideline_rule_id has status == EFFECTIVE
      # Mappings pointing at a SUPERSEDED rule are excluded from BOTH numerator and denominator.
      if input_mappings is empty:
          feature_compliance_index = 0.00        # empty-set boundary, NOT 100.00
      else:
          weight(m)  = GuidelineRule[m.guideline_rule_id].severity_weight
          factor(m)  = { PASSED: 1.0, WAIVED_BY_PLATFORM: 1.0, STALE: 0.5,
                         IN_PROGRESS: 0.25, NOT_STARTED: 0.0, FAILED: 0.0 }[m.self_review_status]
          earned = sum over input_mappings of weight(m) * factor(m)
          total  = sum over input_mappings of weight(m)
          feature_compliance_index = round_half_up(100 * earned / total, 2)
      # Rounding order is pinned: divide the two unrounded sums FIRST, round ONCE at the end.
      # Rounding each per-mapping contribution before summing is explicitly NOT the rule.
    input_set: "FeatureMapping rows of the app whose guideline is EFFECTIVE; no status filter on the mappings themselves"
    constants:
      SEVERITY_WEIGHTS: { SAFETY: 5, PRIVACY: 4, COMMERCE: 3, LEGAL: 3, DESIGN: 1 }
    precision: "2 decimal places, round_half_up"

  - name: compliance_posture
    trigger: "Recomputed after every mutation of FeatureMapping, ImpactAssessment, BehaviorFinding, SigningCredential, PublisherAccount.program_status, Submission decision, and after POST /_clock/set_current_utc"
    algorithm: threshold
    formula: |
      # Evaluated in this exact order; the first matching tier wins and
      # posture_reason_codes lists EVERY matching code of that tier in the order below.
      FROZEN tier:
        F1 ACCOUNT_NOT_IN_GOOD_STANDING  : account.program_status IN {SUSPENDED, TERMINATED}
        F2 IMPACT_OVERDUE                : exists ImpactAssessment ia with ia.app_record_id == app.id AND ia.status == OVERDUE
        F3 CRITICAL_FINDING_OPEN         : exists BehaviorFinding f with f.submission_id IN {Submission.id where app_record_id == app.id}
                                           AND f.severity == CRITICAL AND f.status IN {OPEN, DISPUTED}
      RESTRICTED tier (only when no FROZEN code matched):
        R1 MEMBERSHIP_EXPIRED            : account.program_status == EXPIRED
        R2 NO_ACTIVE_DISTRIBUTION_CERT   : no SigningCredential with publisher_account_id == app.publisher_account_id
                                           AND credential_type == DISTRIBUTION_CERT AND platform == app.platform
                                           AND status IN {ACTIVE, EXPIRING_SOON}
        R3 COMPLIANCE_INDEX_BELOW_FLOOR  : feature_compliance_index < POSTURE_INDEX_FLOOR
        R4 OPEN_IMPACT_ASSESSMENT        : exists ImpactAssessment ia with ia.app_record_id == app.id
                                           AND ia.status IN {OPEN, IN_ASSESSMENT, REMEDIATION_REQUIRED}
      OPEN: no code matched; posture_reason_codes = []
      # Boundary: feature_compliance_index == POSTURE_INDEX_FLOOR does NOT restrict (strict <).
    input_set: "The app's own FeatureMapping / ImpactAssessment rows, the BehaviorFinding rows of all its submissions, the account's DISTRIBUTION_CERTs for the app's platform, and the account's program_status"
    constants:
      POSTURE_INDEX_FLOOR: 90.00
    precision: "enum output; the index comparison uses the 2-decimal rounded index"

  - name: derived_age_rating
    trigger: "PUT /submissions/{id}/age-rating, and re-evaluated on POST /submissions/{id}/pre-review-check and POST /submissions/{id}/decision"
    algorithm: threshold
    formula: |
      DIM_BAND      = { 0: 0, 1: 9, 2: 12, 3: 17 }
      DIMENSIONS    = [VIOLENCE, SEXUAL_CONTENT, DRUGS_ALCOHOL, GAMBLING_SIMULATED, HORROR, PROFANITY]  # fixed tie-break priority
      base          = max over d in DIMENSIONS of DIM_BAND[answers[d]]
      driving_dim   = the FIRST d in DIMENSIONS (in the order above) whose DIM_BAND[answers[d]] == base
      # Content-independent floors, evaluated as an if/elif chain — only the first match applies:
      if   answers.real_money_gambling            : floor_age = 18
      elif answers.unrestricted_web_access
           OR (answers.user_generated_content AND NOT answers.ugc_moderation_enabled) : floor_age = 17
      elif answers.contests                      : floor_age = 12
      else                                       : floor_age = 0
      raw = max(base, floor_age)
      if answers.GAMBLING_SIMULATED >= 2         : raw = max(raw, 17)   # boundary: level 2 already bumps to 17
      derived_age_rating = min { b in RATING_BANDS : b >= raw }         # snap UP to the next declared band
      age_rating_driving_dimension = FLOOR_RULE when floor_age > base else driving_dim
      # When floor_age == base the content dimension wins the label.
    input_set: "Submission.age_rating_answers only; no other entity participates"
    constants:
      RATING_BANDS: [0, 4, 9, 12, 17, 18]
    precision: "integer; the output is always a member of RATING_BANDS"
    variants:
      - name: ATTESTATION_CHECK
        when: "pre-review check and reviewer decision"
        difference: "attested_age_rating < derived_age_rating is a violation (ERR_AGE_RATING_UNDERSTATED); attested_age_rating > derived_age_rating is permitted (over-rating is never blocked)"

  - name: disclosure_accuracy_score
    trigger: "POST /submissions/{id}/pre-review-check (provisional), POST /submissions/{id}/claim and POST /submissions/{id}/decision (final), POST /behavior-findings, POST /behavior-findings/{id}/triage, PUT /submissions/{id}/privacy-declaration"
    algorithm: chronological
    formula: |
      declared = Submission.declared_privacy_items          # tuples {data_type, purpose, linked_to_user, used_for_tracking}
      findings_in_scope = variant-specific (see variants)
      match(f)  = exists d in declared with d.data_type == f.data_type
                                       AND d.purpose == f.observed_purpose
                                       AND d.linked_to_user == f.observed_linked_to_user
                                       AND d.used_for_tracking == f.observed_tracking
      penalty(f) = { CRITICAL: 40, MAJOR: 20, MINOR: 5 }[f.severity]
      undisclosed_penalty   = sum of penalty(f) over f in findings_in_scope where NOT match(f)
      over_disclosure_count = count of d in declared such that NO f in findings_in_scope has f.data_type == d.data_type
      raw = 100 - undisclosed_penalty - (OVER_DISCLOSURE_PENALTY * over_disclosure_count IF the variant applies it ELSE 0)
      score = round_half_up(max(raw, 0) / 100, 4)           # 0.0000 .. 1.0000
      # Pinned: penalties are summed as integers FIRST, the single division by 100 happens LAST.
    input_set: "BehaviorFinding rows of the submission filtered per variant; the submission's own declared_privacy_items"
    constants:
      SEVERITY_PENALTIES: { CRITICAL: 40, MAJOR: 20, MINOR: 5 }
      OVER_DISCLOSURE_PENALTY: 2
      PROVISIONAL_CONFIDENCE_FLOOR: 0.8000
      DISCLOSURE_PASS_THRESHOLD: 0.9500
    precision: "4 decimal places, round_half_up; the pass test is score >= DISCLOSURE_PASS_THRESHOLD (inclusive)"
    variants:
      - name: SELF_REVIEW_PROVISIONAL
        when: "Written to Submission.disclosure_accuracy_score_provisional by the publisher-facing pre-review check and by any finding/declaration mutation"
        difference: |
          findings_in_scope = f.status == OPEN AND f.detected_at <= Submission.pre_review_checked_at
                              AND f.scanner_confidence >= PROVISIONAL_CONFIDENCE_FLOOR.
          The over-disclosure term is NOT applied (declaring more than observed is free at self-review time).
          Late-arriving findings, DISPUTED findings and low-confidence findings are all invisible here.
      - name: REVIEW_FINAL
        when: "Written to Submission.disclosure_accuracy_score_final on reviewer claim and on the reviewer decision gate"
        difference: |
          findings_in_scope = f.status IN {OPEN, DISPUTED} with NO detected_at bound and NO confidence floor,
          and the over-disclosure term IS applied at OVER_DISCLOSURE_PENALTY per over-declared data_type.
          For identical stored data the two variants therefore return different numbers whenever a finding
          arrived after pre_review_checked_at, was disputed, scored below the confidence floor, or the
          publisher over-declared a data type.

  - name: commission_settlement_cents
    trigger: "GET /app-records/{id}/commerce-settlement, and per-line recompute on POST /commerce-items/{id}/report-revenue and on CommerceItem SUBMITTED -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      line_items = CommerceItem rows with app_record_id == app.id
                   AND status == APPROVED
                   AND reported_period_label == the period being settled
                   ordered by created_at ASC (pins the per_line output order; the total is order-independent)
      base_rate = 0.15 if account.commerce_program_tier == SMALL_BUSINESS else 0.30
      for each ci in line_items:
          rate = base_rate
          if ci.item_type == SUBSCRIPTION AND ci.subscriber_retention_months >= 12:
              rate = min(rate, RETAINED_SUBSCRIBER_RATE)           # >= 12 qualifies; 11 does not
          if ci.item_type == EXTERNAL_PAYMENT_LINK:
              rate = round_half_up(rate - EXTERNAL_LINK_DISCOUNT, 2)
          ci.commission_rate_applied = rate
          ci.commission_cents = round_half_up(ci.reported_gross_cents * rate)     # STEP 1: round EACH line
      commission_settlement_cents = sum of ci.commission_cents                    # STEP 2: then sum
      gross_total_cents   = sum of ci.reported_gross_cents
      publisher_net_cents = gross_total_cents - commission_settlement_cents
      # ROUNDING ORDER IS PINNED: round-per-line-THEN-sum.
      # round_half_up(sum(gross_i * rate_i)) (sum-then-round) is explicitly NOT the rule; the two
      # differ by whole cents whenever two or more lines each carry a half-cent remainder.
      # Empty line_items -> commission_settlement_cents = 0, publisher_net_cents = 0.
    input_set: "APPROVED CommerceItem rows of the app for the requested period label; REMOVED, REJECTED, DRAFT and SUBMITTED items are excluded"
    constants:
      STANDARD_RATE: 0.30
      SMALL_BUSINESS_RATE: 0.15
      RETAINED_SUBSCRIBER_RATE: 0.15
      EXTERNAL_LINK_DISCOUNT: 0.03
    precision: "integer cents, round_half_up per line before summation"

  - name: review_priority_score
    trigger: "Submission PRE_REVIEW_PASSED -> WAITING_FOR_REVIEW (full evaluation), and re-evaluation of steps 2..6 for every WAITING_FOR_REVIEW submission on POST /_clock/set_current_utc"
    algorithm: constraint_propagation
    formula: |
      # STEP 1 (queue entry ONLY, then frozen forever):
      provisional_deadline_at = queued_at + BASE_SLA_HOURS
      # STEP 2 — reads provisional_deadline_at and NOTHING else:
      hours_remaining   = (provisional_deadline_at - clock_now) in hours, may be negative
      deadline_pressure = clamp((BASE_SLA_HOURS - hours_remaining) / BASE_SLA_HOURS, 0.0, 1.0)
      # At queue entry hours_remaining == BASE_SLA_HOURS, so deadline_pressure == 0.0 by construction.
      # STEP 3:
      standing_component = account.standing_score_lifetime                                  # 0..100
      urgency_component  = 100 * deadline_pressure                                          # 0..100
      risk_component     = 100 * (1 - Submission.disclosure_accuracy_score_provisional)     # 0..100
      priority_score = clamp(round_half_up(0.50 * standing_component
                                         + 0.30 * urgency_component
                                         - 0.20 * risk_component, 2), 0.00, 100.00)
      # STEP 4:
      priority_band = EXPEDITED if submission_channel == EXPEDITED
                      else HIGH   if priority_score >= 70.00
                      else NORMAL if priority_score >= 40.00
                      else LOW
      # STEP 5:
      sla_hours = { EXPEDITED: 12, HIGH: 24, NORMAL: 48, LOW: 96 }[priority_band]
      # STEP 6:
      effective_review_deadline_at = queued_at + sla_hours
      # CIRCULARITY IS BROKEN BY DECREE: step 2 may never read effective_review_deadline_at, whose value
      # depends on the band, which depends on the score, which depends on step 2. Evaluation is a single
      # forward pass over steps 1..6; there is no fixed-point iteration and no second pass.
    input_set: "The submission's own frozen provisional_deadline_at and provisional disclosure score, plus the owning account's LIFETIME_UNDECAYED standing score"
    constants:
      BASE_SLA_HOURS: 48
      SLA_HOURS_BY_BAND: { EXPEDITED: 12, HIGH: 24, NORMAL: 48, LOW: 96 }
      HIGH_BAND_FLOOR: 70.00
      NORMAL_BAND_FLOOR: 40.00
    precision: "priority_score 2 decimals round_half_up; deadlines are whole-hour offsets from queued_at"

  - name: standing_score
    trigger: "Submission decision (REJECT / METADATA_REJECT / APPROVE), appeal decision, RolloutPlan COMPLETED, RolloutPlan ROLLED_BACK, and POST /_clock/set_current_utc"
    algorithm: decay_function
    formula: |
      penalty_rows = RejectionReason r where Submission[r.submission_id].app_record_id belongs to this account
                     AND r.appeal_disposition != OVERTURNED
                     AND r.recorded_at is inside the variant's scope window
      weight(r)  = { CRITICAL: 12, MAJOR: 6, MINOR: 2 }[r.severity]
      age_days(r) = floor((clock_now - r.recorded_at) / 24h)
      decay(r)   = variant-specific (see variants)
      raw_penalty = sum over penalty_rows of weight(r) * decay(r)
      credit = STANDING_APPEAL_CREDIT * count(AppealRequest a of this account's submissions
                    where a.state IN {OVERTURNED, PARTIALLY_OVERTURNED} AND a.decided_at inside the scope window)
             + STANDING_CLEAN_ROLLOUT_CREDIT * count(RolloutPlan p of this account's apps
                    where p.state == COMPLETED AND AppRecord[p.app_record_id].rollback_count == 0
                    AND p.completed_at inside the scope window)
      score = clamp(round_half_up(100 - raw_penalty + credit, 2), 0.00, 100.00)
      # Sums are computed unrounded and rounded ONCE at the end.
    input_set: "RejectionReason rows of the account's submissions excluding appeal_disposition == OVERTURNED; AppealRequest rows in an overturning terminal state; COMPLETED RolloutPlan rows of apps with rollback_count == 0"
    constants:
      SEVERITY_PENALTIES: { CRITICAL: 12, MAJOR: 6, MINOR: 2 }
      STANDING_APPEAL_CREDIT: 3
      STANDING_CLEAN_ROLLOUT_CREDIT: 2
      ROLLING_WINDOW_DAYS: 365
      EXPEDITE_STANDING_FLOOR: 60.00
    precision: "2 decimal places, round_half_up, clamped to [0.00, 100.00]"
    variants:
      - name: ROLLING_365
        when: "Written to PublisherAccount.standing_score_rolling_365; the ONLY input to the expedite eligibility gate (>= EXPEDITE_STANDING_FLOOR)"
        difference: |
          Scope window = recorded_at / decided_at / completed_at >= clock_now - 365 days (inclusive lower bound),
          and decay(r) = 1.0 when age_days <= 90, 0.5 when 90 < age_days <= 180, 0.25 when age_days > 180.
      - name: LIFETIME_UNDECAYED
        when: "Written to PublisherAccount.standing_score_lifetime; the ONLY standing input to review_priority_score"
        difference: |
          Scope window = unbounded (every row of the account's history counts) and decay(r) = 1.0 for every row.
          For identical stored data the two variants return different numbers as soon as any rejection is more
          than 90 days old, or any rejection is older than 365 days.

  - name: expedite_credit_ledger
    trigger: "ExpediteRequest GRANT decision, ExpediteRequest -> REFUNDED, and POST /_clock/set_current_utc"
    algorithm: aggregation
    formula: |
      credits_used = count of ExpediteRequest e where
                       e.publisher_account_id == account.id
                       AND e.state IN {GRANTED, CONSUMED}
                       AND e.granted_at >= clock_now - ROLLING_WINDOW_DAYS * 24h   (inclusive lower bound)
      # DENIED and REFUNDED rows are out of scope; REQUESTED rows have granted_at == null and never count.
      expedite_credits_remaining = EXPEDITE_CREDITS_PER_WINDOW - credits_used
      CONSERVATION INVARIANT (must hold at every observable instant):
        expedite_credits_remaining + credits_used == EXPEDITE_CREDITS_PER_WINDOW
      COMPENSATING PAIR: GRANT (credits_used +1, remaining -1) followed by its compensating action
        REFUND (credits_used -1, remaining +1) MUST restore expedite_credits_remaining to the exact
        pre-grant integer; no drift is tolerated even when the clock moved between the two actions.
      BOUNDARY: a GRANT is refused when expedite_credits_remaining == 0 (zero-count edge, ERR_EXPEDITE_QUOTA_EXHAUSTED).
    input_set: "ExpediteRequest rows of the account in state GRANTED or CONSUMED whose granted_at is inside the rolling window"
    constants:
      EXPEDITE_CREDITS_PER_WINDOW: 2
      ROLLING_WINDOW_DAYS: 365
    precision: "integer counts; no rounding"

  - name: review_capacity_allocation
    trigger: "Submission queue entry (reservation), reviewer decision (reservation -> consumption), withdrawal / return-to-draft / signing-block cascade (release)"
    algorithm: waterfall_allocation
    formula: |
      For a ReviewCapacityWindow w:
        slots_reserved  = count(Submission s where s.review_window_id == w.id
                                AND s.state IN {WAITING_FOR_REVIEW, IN_REVIEW})
        slots_consumed  = count(Submission s where s.review_window_id == w.id
                                AND s.state IN {APPROVED, REJECTED, METADATA_REJECTED, APPEAL_PENDING,
                                                REJECTED_FINAL, SUPERSEDED})
        slots_available = w.capacity_slots - slots_reserved - slots_consumed
      CONSERVATION INVARIANT: slots_reserved + slots_consumed + slots_available == w.capacity_slots always.
      COMPENSATING PAIR: queue entry (reserved +1, available -1) followed by its compensating action
        withdrawal or return-to-draft (review_window_id = null -> reserved -1 / consumed -1, available +1)
        MUST restore slots_available to its exact pre-queue integer.
      SELECTOR (which window a queued submission is assigned to):
        (a) eligibility filter : w.status == OPEN
                                 AND w.platform == AppRecord.platform
                                 AND w.starts_at <= clock_now < w.ends_at        (half-open occupancy)
                                 AND w.slots_available >= 1
        (b) ranking expression : slots_available DESC, then starts_at ASC
        (c) tie-break          : created_at ASC (never id)
        (d) empty candidate set: reject the queue call with ERR_NO_REVIEW_CAPACITY (409); no state changes
    input_set: "OPEN ReviewCapacityWindow rows of the app's platform whose half-open interval contains the current clock"
    constants:
      POOL_MAX_CONCURRENT_SLOTS: 10
    precision: "integer counts"

  - name: review_pool_concurrency
    trigger: "POST /review-capacity-windows"
    algorithm: interval_merge
    formula: |
      intersecting = existing ReviewCapacityWindow w where
                       w.platform == new.platform
                       AND w.reviewer_pool_code == new.reviewer_pool_code
                       AND w.status == OPEN
                       AND w.starts_at < new.ends_at AND new.starts_at < w.ends_at
      # HALF-OPEN AGGREGATE SEMANTICS: touching endpoints (w.ends_at == new.starts_at, or
      # new.ends_at == w.starts_at) do NOT intersect, so adjacent windows are always legal.
      concurrent_slots = new.capacity_slots + sum(w.capacity_slots over intersecting)
      reject with ERR_REVIEW_POOL_OVERSUBSCRIBED when concurrent_slots > POOL_MAX_CONCURRENT_SLOTS
      # Overlap itself is legal; only aggregate oversubscription is not. Equality with the ceiling passes.
    input_set: "OPEN windows of the same (platform, reviewer_pool_code) whose half-open interval intersects the new one"
    constants:
      POOL_MAX_CONCURRENT_SLOTS: 10
    precision: "integer slot arithmetic"

  - name: rollout_window_exclusivity
    trigger: "POST /rollout-plans"
    algorithm: interval_merge
    formula: |
      new_interval = [new.scheduled_start_at, new.projected_end_at]      # CLOSED at both ends
      for every existing RolloutPlan p with p.app_record_id == new.app_record_id:
        if p.state IN {SCHEDULED, PHASE_ACTIVE, PAUSED}:
            conflict when new.scheduled_start_at <= p.projected_end_at
                     AND p.scheduled_start_at <= new.projected_end_at
            # CLOSED-INTERVAL SINGLE-OCCUPANCY SEMANTICS: touching endpoints DO conflict,
            # the exact opposite of review_pool_concurrency's half-open treatment.
        elif p.state == ROLLED_BACK:
            conflict when new.scheduled_start_at < p.terminated_at + ROLLBACK_COOLDOWN_HOURS * 1h
            # One-sided cooldown buffer, strict <: scheduling exactly at the buffer edge is legal.
        else:  # COMPLETED, CANCELLED
            no conflict
      any conflict -> ERR_ROLLOUT_WINDOW_CONFLICT
      projected_end_at = scheduled_start_at + PHASE_COUNT * MIN_PHASE_DWELL_HOURS * 1h   when mode == PHASED
                       = scheduled_start_at                                             when mode == IMMEDIATE
    input_set: "All RolloutPlan rows of the same AppRecord; COMPLETED and CANCELLED plans never conflict"
    constants:
      ROLLBACK_COOLDOWN_HOURS: 72
      PHASE_COUNT: 7
      MIN_PHASE_DWELL_HOURS: 24
    precision: "whole-hour interval arithmetic on ISO 8601 UTC instants"

  - name: rollout_audience_allocation
    trigger: "RolloutPlan start, advance, pause, resume, rollback"
    algorithm: waterfall_allocation
    formula: |
      PHASE_PCTS = [1.00, 2.00, 5.00, 10.00, 20.00, 50.00, 100.00]        # indexed 0..6
      released_share_pct  = PHASE_PCTS[phase_index] when state IN {PHASE_ACTIVE, PAUSED, COMPLETED} else 0.00
      held_back_share_pct = round_half_up(100.00 - released_share_pct, 2)
      CONSERVATION INVARIANT: released_share_pct + held_back_share_pct == 100.00 exactly, on BOTH the
        RolloutPlan and the mirrored AppRecord fields, at every observable instant including while PAUSED.
      COMPENSATING PAIR: advance (released -> PHASE_PCTS[i+1]) followed by its compensating action
        rollback (released = 0.00, held_back = 100.00) MUST leave the pair summing to exactly 100.00
        and MUST return held_back_share_pct to 100.00 with no residue.
      A pause freezes both fields; a resume does not change them; only advance and rollback move them.
    input_set: "The plan's own state and phase_index; no aggregation across entities"
    constants:
      PHASE_PCTS: [1.00, 2.00, 5.00, 10.00, 20.00, 50.00, 100.00]
      PHASE_COUNT: 7
      MIN_PHASE_DWELL_HOURS: 24
    precision: "2 decimal places, round_half_up"

  - name: impact_severity
    trigger: "ImpactAssessment creation by the guideline publication cascade, and every POST /impact-assessments/{id}/assess"
    algorithm: aggregation
    formula: |
      exposure_factor = 1.5 when AppRecord.distribution_state IN {PHASED_ROLLOUT, FULLY_RELEASED, PAUSED} else 1.0
      impact_severity = round_half_up(GuidelineRule.severity_weight * count(affected_feature_codes) * exposure_factor, 2)
      remediation_deadline_at = GuidelineRule.effective_from + GuidelineRule.remediation_grace_days * 24h
      # ACCEPT_NO_CHANGE is only permitted when impact_severity <= ACCEPT_NO_CHANGE_SEVERITY_CEILING
      # (inclusive) and the rule's category != SAFETY.
    input_set: "affected_feature_codes captured at cascade time (ordered by FeatureMapping.created_at ASC), the rule's severity_weight, and the app's distribution_state at evaluation time"
    constants:
      ACCEPT_NO_CHANGE_SEVERITY_CEILING: 6.00
    precision: "2 decimal places, round_half_up"

# =============================================================================
# Global constants referenced by §1.2 preconditions and §1.4 validations
# =============================================================================
global_constants:
  APPEAL_WINDOW_DAYS: 14
  PRE_REVIEW_FRESHNESS_HOURS: 72
  MIN_SCREENSHOTS_PER_CLASS: 2
  CREDENTIAL_EXPIRY_WARNING_HOURS: 168
  PROVISIONAL_CONFIDENCE_FLOOR: 0.8000
  DISCLOSURE_PASS_THRESHOLD: 0.9500
  POSTURE_INDEX_FLOOR: 90.00
  ACCEPT_NO_CHANGE_SEVERITY_CEILING: 6.00
  EXPEDITE_STANDING_FLOOR: 60.00
  EXPEDITE_CREDITS_PER_WINDOW: 2
  BASE_SLA_HOURS: 48
  PHASE_COUNT: 7
  MIN_PHASE_DWELL_HOURS: 24
  ROLLBACK_COOLDOWN_HOURS: 72
  POOL_MAX_CONCURRENT_SLOTS: 10
  ROLLING_WINDOW_DAYS: 365
  DEFAULT_CLOCK: "2026-08-01T00:00:00Z"

# =============================================================================
# §1.4 Validation Rules — STRICTLY ORDERED. The FIRST failing rule in ascending
# priority order determines the response; no later rule may mask an earlier one.
# Within one priority, path parameters are checked left-to-right, then body
# fields in the order they are declared in the §1.5 request_body.
# Bands: 10 header shape | 15 role | 20 tenancy | 25 existence | 28 schema |
# 30 optimistic concurrency | 35 entity state | 40 app posture gate |
# 45 account program status | 50 segregation of duties | 55 business_safety |
# 60 business_referential | 65 business_constraint | 70 business_temporal |
# 75 business_fiscal.
# Request headers: X-User-Role (all roles), X-User-ID (all roles),
# X-Publisher-Account-Id (entity_backed roles only).
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role is present and is one of the seven role names in §1.7; X-User-ID is present and non-empty; for the entity_backed roles X-Publisher-Account-Id is present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
    description: "Header shape only. A missing or unknown role header is a 400 and never a 403, even when the role that WOULD have been sent is not permitted on the endpoint."

  - priority: 15
    category: auth
    check: "The value of X-User-Role appears in the endpoint's authorized_roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
    description: "PRIORITY PAIR (15 vs 25): a request from an unauthorized role that also names a non-existent resource id returns 403 ERR_ROLE_NOT_PERMITTED, never 404 — existence must not leak to unauthorized callers."

  - priority: 20
    category: auth
    check: "For the entity_backed roles (PublisherAdmin, ReleaseManager, ComplianceOfficer) every entity reached through the path or body resolves transitively to X-Publisher-Account-Id: AppRecord.publisher_account_id; SigningCredential.publisher_account_id; Submission -> AppRecord; FeatureMapping -> AppRecord; MetadataLocale -> Submission -> AppRecord; BehaviorFinding -> Submission -> AppRecord; RejectionReason -> Submission -> AppRecord; AppealRequest -> Submission -> AppRecord; ExpediteRequest.publisher_account_id; RolloutPlan -> AppRecord; CommerceItem -> AppRecord; ImpactAssessment -> AppRecord"
    error_id: ERR_CROSS_ACCOUNT_ACCESS_DENIED
    http_status: 403
    applies_to: "every endpoint with a path id or an entity-reference body field, except POST /_clock/set_current_utc, POST /guideline-rules, POST /guideline-rules/{id}/publish, POST /review-capacity-windows and POST /review-capacity-windows/{id}/close"
    description: "Tenancy precedes existence: a resolvable id owned by another account is 403 ERR_CROSS_ACCOUNT_ACCESS_DENIED, while an id that resolves to nothing at all is 404. The four platform roles (PlatformReviewer, PlatformAppealBoard, PlatformPolicyAdmin, Auditor) skip this rule entirely; list endpoints instead silently narrow their result set to the header's account for entity_backed roles."

  - priority: 25
    category: existence
    check: "Every id referenced by the path resolves, then every entity-reference field in the body resolves, both in declaration order"
    error_id: "ERR_PUBLISHER_ACCOUNT_NOT_FOUND | ERR_SIGNING_CREDENTIAL_NOT_FOUND | ERR_APP_RECORD_NOT_FOUND | ERR_GUIDELINE_RULE_NOT_FOUND | ERR_FEATURE_MAPPING_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_METADATA_LOCALE_NOT_FOUND | ERR_BEHAVIOR_FINDING_NOT_FOUND | ERR_REJECTION_REASON_NOT_FOUND | ERR_APPEAL_REQUEST_NOT_FOUND | ERR_EXPEDITE_REQUEST_NOT_FOUND | ERR_REVIEW_CAPACITY_WINDOW_NOT_FOUND | ERR_ROLLOUT_PLAN_NOT_FOUND | ERR_COMMERCE_ITEM_NOT_FOUND | ERR_IMPACT_ASSESSMENT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path id or an entity-reference body field"
    description: "Path before body, left to right. POST /rollout-plans with an unknown app_record_id AND an unknown submission_id returns ERR_APP_RECORD_NOT_FOUND because app_record_id is declared first."

  - priority: 28
    category: schema
    check: "Required fields present; types, enum members, string lengths, array cardinalities, numeric ranges and ISO 8601 UTC instant format satisfied; unknown fields rejected; pagination limit inside [1, 100] and offset >= 0; age_rating_answers carries exactly the six intensity keys with values 0..3 plus the five booleans; screenshot_counts values are integers >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "every endpoint with a request body or query parameters"
    description: "Runs AFTER existence: a malformed body sent to a non-existent submission returns 404, not 422."

  - priority: 30
    category: concurrency
    check: "expected_app_record_version equals AppRecord.version; expected_publisher_account_version equals PublisherAccount.version (see §1.2.1)"
    error_id: "ERR_STALE_APP_RECORD_VERSION | ERR_STALE_PUBLISHER_ACCOUNT_VERSION"
    http_status: 412
    applies_to: "POST /submissions, POST /rollout-plans, POST /signing-credentials, POST /publisher-accounts/{id}/membership-renewal"
    description: "PRIORITY PAIR (30 vs 35): when the supplied expected_*_version is stale AND the target entity is in a state that forbids the operation, the 412 wins and the 409 state error is never emitted. The reverse ordering is a defect."

  - priority: 35
    category: state
    check: "The requested transition is declared in §1.2 for the entity's current state (and for AppRecord, for the specific state_field the endpoint drives)"
    error_id: "ERR_INVALID_SUBMISSION_STATE | ERR_INVALID_LISTING_STATE | ERR_INVALID_DISTRIBUTION_STATE | ERR_INVALID_CREDENTIAL_STATE | ERR_INVALID_ROLLOUT_STATE | ERR_INVALID_GUIDELINE_STATE | ERR_INVALID_MAPPING_STATE | ERR_INVALID_IMPACT_STATE | ERR_INVALID_APPEAL_STATE | ERR_INVALID_EXPEDITE_STATE | ERR_INVALID_COMMERCE_ITEM_STATE | ERR_INVALID_FINDING_STATE"
    http_status: 409
    applies_to: "every transition endpoint in §1.5; the response uses the code of the entity named in the path"
    description: "Undeclared self-transitions are refused: POST /rollout-plans/{id}/advance on a PAUSED plan is ERR_INVALID_ROLLOUT_STATE even though PHASE_ACTIVE -> PHASE_ACTIVE is a legal self-loop."

  - priority: 40
    category: state
    check: "AppRecord.compliance_posture is not FROZEN, and for the release-advancing subset it is not RESTRICTED either"
    error_id: "ERR_APP_COMPLIANCE_FROZEN | ERR_APP_COMPLIANCE_RESTRICTED"
    http_status: 409
    applies_to: "POST /submissions, POST /submissions/{id}/pre-review-check, POST /submissions/{id}/queue, POST /metadata-locales, PUT /submissions/{id}/age-rating, PUT /submissions/{id}/privacy-declaration, PATCH /app-records/{id}/listing, POST /feature-mappings/{id}/self-review, POST /rollout-plans, POST /rollout-plans/{id}/start, POST /rollout-plans/{id}/advance, POST /rollout-plans/{id}/hold, POST /commerce-items, POST /commerce-items/{id}/submit, POST /expedite-requests"
    description: |
      FROZEN blocks every endpoint listed above. RESTRICTED blocks only the release-advancing
      subset: POST /submissions/{id}/queue, POST /rollout-plans, POST /rollout-plans/{id}/start,
      POST /rollout-plans/{id}/advance, POST /rollout-plans/{id}/hold with action=RESUME,
      POST /commerce-items/{id}/submit and POST /expedite-requests.
      REMEDIATION EXEMPTION (§1.2 ImpactAssessment note): this priority is skipped entirely on
      POST /impact-assessments/{id}/assess, POST /behavior-findings/{id}/triage,
      POST /submissions/{id}/return-to-draft, POST /submissions/{id}/withdraw,
      POST /rollout-plans/{id}/rollback, POST /feature-mappings/{id}/waive,
      POST /signing-credentials, POST /signing-credentials/{id}/activate,
      POST /signing-credentials/{id}/revoke, POST /signing-credentials/{id}/report-compromise and
      POST /publisher-accounts/{id}/membership-renewal — otherwise a FROZEN app could never be unfrozen.
      PRIORITY PAIR (40 vs 55): an app whose posture is FROZEN and whose submission also has an
      unreconciled CRITICAL BehaviorFinding returns ERR_APP_COMPLIANCE_FROZEN, not
      ERR_CRITICAL_FINDING_UNRESOLVED.

  - priority: 45
    category: auth
    check: "PublisherAccount.program_status == ACTIVE"
    error_id: "ERR_PROGRAM_MEMBERSHIP_EXPIRED (program_status == EXPIRED) | ERR_ACCOUNT_SUSPENDED (program_status IN {SUSPENDED, TERMINATED})"
    http_status: 403
    applies_to: "POST /app-records, PATCH /app-records/{id}/listing, POST /signing-credentials/{id}/activate, POST /submissions, POST /submissions/{id}/pre-review-check, POST /submissions/{id}/queue, POST /feature-mappings, POST /rollout-plans, POST /rollout-plans/{id}/start, POST /rollout-plans/{id}/advance, POST /expedite-requests, POST /appeal-requests, POST /commerce-items, POST /commerce-items/{id}/submit"
    description: "An EXPIRED, SUSPENDED or TERMINATED account may still read, triage, remediate and renew membership, but may not create apps or advance any release. Checked AFTER the app posture gate so a FROZEN app under a suspended account reports the app-level cause first."

  - priority: 50
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID is distinct from the identity recorded on the artifact being judged"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 409
    applies_to: "POST /submissions/{id}/decision, POST /appeal-requests/{id}/board-review, POST /appeal-requests/{id}/decide, POST /expedite-requests/{id}/decide, POST /feature-mappings/{id}/waive, POST /commerce-items/{id}/review"
    description: |
      Concretely:
      (a) POST /submissions/{id}/decision requires X-User-ID == Submission.reviewed_by_user_id (only the
          claiming reviewer may decide) AND X-User-ID != Submission.attested_by_user_id (the publisher-side
          attester may never decide the same build);
      (b) POST /appeal-requests/{id}/board-review and /decide require X-User-ID != Submission.reviewed_by_user_id
          (the reviewer who rejected may not review or judge the appeal);
      (c) POST /expedite-requests/{id}/decide requires X-User-ID != Submission.reviewed_by_user_id;
      (d) POST /feature-mappings/{id}/waive requires X-User-ID != FeatureMapping.attested_by_user_id
          (whoever attested the self-review may not waive that same mapping);
      (e) POST /commerce-items/{id}/review requires X-User-ID != FeatureMapping.attested_by_user_id for any
          COMMERCE-category mapping of the same AppRecord.

  - priority: 55
    category: business_safety
    check: "No BehaviorFinding of the submission with severity == CRITICAL is in status OPEN or DISPUTED"
    error_id: ERR_CRITICAL_FINDING_UNRESOLVED
    http_status: 409
    applies_to: "POST /submissions/{id}/queue, POST /submissions/{id}/decision (outcome == APPROVE), POST /rollout-plans/{id}/start, POST /rollout-plans/{id}/advance"
    description: "A CRITICAL finding must reach RECONCILED or DISMISSED before any release advances; MAJOR and MINOR findings never block. On POST /submissions/{id}/pre-review-check the same check runs in REPORT MODE — it contributes the code CRITICAL_FINDING_UNRESOLVED to pre_review_blocking_reasons and returns 200 instead of 409."

  - priority: 55
    category: business_safety
    check: "The authoritative disclosure accuracy score is >= DISCLOSURE_PASS_THRESHOLD (0.9500)"
    error_id: ERR_PRIVACY_DISCLOSURE_INACCURATE
    http_status: 409
    applies_to: "POST /submissions/{id}/queue (uses disclosure_accuracy_score_provisional), POST /submissions/{id}/decision with outcome == APPROVE (uses disclosure_accuracy_score_final)"
    description: "BOUNDARY: inclusive — exactly 0.9500 passes, 0.9499 fails. The two variants can disagree on identical stored data (a DISPUTED finding leaves the provisional scope but stays in the final scope), so the endpoint decides which variant is authoritative. Report mode on pre-review-check contributes PRIVACY_DISCLOSURE_INACCURATE."

  - priority: 55
    category: business_safety
    check: "Submission.attested_age_rating >= Submission.derived_age_rating"
    error_id: ERR_AGE_RATING_UNDERSTATED
    http_status: 409
    applies_to: "POST /submissions/{id}/queue, POST /submissions/{id}/decision"
    description: "Over-attesting (a stricter rating than derived) is always allowed; under-attesting by even one band is refused. BOUNDARY: equality passes. Report mode on pre-review-check contributes AGE_RATING_UNDERSTATED."

  - priority: 55
    category: business_safety
    check: "When any element of Submission.declared_privacy_items has used_for_tracking == true, Submission.tracking_consent_prompt_present must be true"
    error_id: ERR_TRACKING_CONSENT_PROMPT_MISSING
    http_status: 409
    applies_to: "POST /submissions/{id}/queue"
    description: "Declared cross-app tracking without an in-app consent prompt is a hard block regardless of the accuracy score. Report mode on pre-review-check contributes TRACKING_CONSENT_PROMPT_MISSING."

  - priority: 60
    category: business_referential
    check: "The submission's signing credential is usable: SigningCredential.credential_type == PROVISIONING_PROFILE, status IN {ACTIVE, EXPIRING_SOON}, platform == AppRecord.platform, not_before <= clock_now, and the linked_cert_id credential has status IN {ACTIVE, EXPIRING_SOON}"
    error_id: "ERR_SIGNING_CREDENTIAL_INVALID | ERR_CREDENTIAL_PLATFORM_MISMATCH | ERR_CREDENTIAL_NOT_YET_VALID | ERR_LINKED_CERT_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /submissions, POST /submissions/{id}/queue, POST /submissions/{id}/claim, POST /submissions/{id}/return-to-draft (when signing_credential_id is supplied)"
    description: "Evaluated in the listed field order. PENDING_ACTIVATION, EXPIRED, REVOKED or COMPROMISED is ERR_SIGNING_CREDENTIAL_INVALID; a DISTRIBUTION_CERT supplied where a PROVISIONING_PROFILE is required is also ERR_SIGNING_CREDENTIAL_INVALID; not_before in the future is ERR_CREDENTIAL_NOT_YET_VALID (BOUNDARY: not_before == clock_now passes). EXPIRING_SOON is deliberately still usable — expiry is policed by the temporal rule at priority 70 instead."

  - priority: 60
    category: business_referential
    check: "For every GuidelineRule with status == EFFECTIVE and requires_feature_mapping == true there exists at least one FeatureMapping of the AppRecord pointing at it, and every FeatureMapping of the AppRecord whose rule is EFFECTIVE has self_review_status IN {PASSED, WAIVED_BY_PLATFORM}"
    error_id: ERR_GUIDELINE_MAPPING_INCOMPLETE
    http_status: 409
    applies_to: "POST /submissions/{id}/queue"
    description: "NOT_STARTED, IN_PROGRESS, FAILED and STALE all block; a missing mapping for a rule that requires one blocks; an empty mapping set blocks (there is no vacuous pass). Report mode on pre-review-check contributes GUIDELINE_MAPPING_INCOMPLETE."

  - priority: 60
    category: business_referential
    check: "Every ImpactAssessment of the AppRecord has status IN {REMEDIATED, ACCEPTED_NO_CHANGE}"
    error_id: ERR_REMEDIATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /submissions/{id}/queue, POST /rollout-plans, POST /rollout-plans/{id}/start, POST /rollout-plans/{id}/advance"
    description: "OPEN, IN_ASSESSMENT, REMEDIATION_REQUIRED and OVERDUE all block. This is the referential complement of the posture gate at priority 40 and is still evaluated when the posture happens to be OPEN (e.g. an OPEN assessment on an app whose compliance index is still above POSTURE_INDEX_FLOOR)."

  - priority: 60
    category: business_referential
    check: "The submission owns at least one MetadataLocale, exactly one of them has is_primary == true, and every MetadataLocale has is_complete == true (screenshot_counts[c] >= MIN_SCREENSHOTS_PER_CLASS for every c in required_device_classes)"
    error_id: "ERR_METADATA_INCOMPLETE | ERR_DUPLICATE_PRIMARY_LOCALE | ERR_SCREENSHOT_SET_INCOMPLETE"
    http_status: 409
    applies_to: "POST /submissions/{id}/queue, POST /metadata-locales, PATCH /app-records/{id}/listing with listing_action=COMPLETE_METADATA"
    description: "Zero locales or a missing primary is ERR_METADATA_INCOMPLETE; a second is_primary == true locale is ERR_DUPLICATE_PRIMARY_LOCALE (enforced on POST /metadata-locales); a locale short of MIN_SCREENSHOTS_PER_CLASS on any required device class is ERR_SCREENSHOT_SET_INCOMPLETE. Report mode on pre-review-check contributes METADATA_INCOMPLETE and SCREENSHOT_SET_INCOMPLETE."

  - priority: 60
    category: business_referential
    check: "Every RejectionReason of the submission has disposition != PENDING"
    error_id: ERR_REJECTION_RESPONSE_REQUIRED
    http_status: 409
    applies_to: "POST /submissions/{id}/return-to-draft"
    description: "The publisher must dispose of every reason (ACCEPTED or CONTESTED, via POST /rejection-reasons/{id}/response) before the build can go back to DRAFT. A submission in BLOCKED_INVALID_SIGNING has no rejection reasons and passes trivially."

  - priority: 65
    category: business_constraint
    check: "Submission.pre_review_passed == true and clock_now - pre_review_checked_at <= PRE_REVIEW_FRESHNESS_HOURS * 1h"
    error_id: "ERR_PRE_REVIEW_NOT_PASSED | ERR_PRE_REVIEW_STALE"
    http_status: 409
    applies_to: "POST /submissions/{id}/queue"
    description: "pre_review_passed == false (never checked, or checked with blocking reasons, or voided by a later content mutation) is ERR_PRE_REVIEW_NOT_PASSED. An attestation older than 72h is ERR_PRE_REVIEW_STALE. BOUNDARY: exactly 72h old still passes (inclusive <=)."

  - priority: 65
    category: business_constraint
    check: "build_number is strictly greater than the maximum build_number of every Submission of the same AppRecord that is not in state DEVELOPER_WITHDRAWN"
    error_id: ERR_DUPLICATE_BUILD_NUMBER
    http_status: 409
    applies_to: "POST /submissions"
    description: "Equal or lower build numbers are both refused with this code. A DEVELOPER_WITHDRAWN build releases its number for reuse; SUPERSEDED and REJECTED_FINAL builds do not."

  - priority: 65
    category: business_constraint
    check: "SigningCredential creation shape: credential_type == PROVISIONING_PROFILE requires a non-null linked_cert_id pointing at a DISTRIBUTION_CERT of the same account and platform; credential_type == DISTRIBUTION_CERT requires linked_cert_id == null and key_custody != LOCAL_KEYCHAIN; not_after > not_before"
    error_id: "ERR_KEY_CUSTODY_NOT_PERMITTED | ERR_LINKED_CERT_NOT_ACTIVE | ERR_CREDENTIAL_PLATFORM_MISMATCH | ERR_VALIDATION"
    http_status: 409
    applies_to: "POST /signing-credentials, POST /signing-credentials/{id}/activate"
    description: "A LOCAL_KEYCHAIN distribution certificate is never acceptable (ERR_KEY_CUSTODY_NOT_PERMITTED); a profile whose linked certificate is not ACTIVE at activation time is ERR_LINKED_CERT_NOT_ACTIVE; a profile whose platform differs from its linked certificate is ERR_CREDENTIAL_PLATFORM_MISMATCH. A missing linked_cert_id on a profile is the schema error ERR_VALIDATION at priority 28."

  - priority: 65
    category: business_constraint
    check: "No Submission signed with this credential is in state WAITING_FOR_REVIEW or IN_REVIEW"
    error_id: ERR_CREDENTIAL_IN_USE
    http_status: 409
    applies_to: "POST /signing-credentials/{id}/revoke"
    description: "POST /signing-credentials/{id}/report-compromise is deliberately exempt — a compromised key must always be stoppable, and its cascade moves the in-flight submissions to BLOCKED_INVALID_SIGNING instead."

  - priority: 65
    category: business_constraint
    check: "review_pool_concurrency: aggregate capacity across intersecting OPEN windows of the same (platform, reviewer_pool_code) must not exceed POOL_MAX_CONCURRENT_SLOTS"
    error_id: ERR_REVIEW_POOL_OVERSUBSCRIBED
    http_status: 409
    applies_to: "POST /review-capacity-windows"
    description: "HALF-OPEN aggregate semantics: adjacency (ends_at == starts_at) never intersects, so back-to-back windows are always legal. BOUNDARY: a total of exactly 10 slots passes, 11 fails."

  - priority: 65
    category: business_constraint
    check: "rollout_window_exclusivity: the new plan's CLOSED interval must not touch or overlap any RolloutPlan of the same app in state SCHEDULED, PHASE_ACTIVE or PAUSED, and must start at or after previous_plan.terminated_at + ROLLBACK_COOLDOWN_HOURS for any plan in state ROLLED_BACK"
    error_id: ERR_ROLLOUT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /rollout-plans, POST /rollout-plans/{id}/start"
    description: "CLOSED-interval single occupancy — the opposite convention from the review pool, where touching endpoints are fine. The cooldown comparison is strict (<), so a start exactly at terminated_at + 72h is legal. A rollback with halt_distribution == false applies no cooldown at all."

  - priority: 65
    category: business_constraint
    check: "RolloutPlan.mode == Submission.release_mode and Submission.release_mode != MANUAL"
    error_id: ERR_ROLLOUT_MODE_MISMATCH
    http_status: 409
    applies_to: "POST /rollout-plans"
    description: "A MANUAL submission is released outside the platform's staged-rollout machinery and can never own a RolloutPlan; a PHASED submission may not be released by an IMMEDIATE plan and vice versa."

  - priority: 65
    category: business_constraint
    check: "to_phase_index == phase_index + 1 and to_phase_index <= PHASE_COUNT - 1"
    error_id: ERR_PHASE_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /rollout-plans/{id}/advance"
    description: "Phases may neither be skipped nor repeated, and index 6 (100%) is the last; the advance that reaches index 6 completes the plan."

  - priority: 65
    category: business_constraint
    check: "AppRecord.distribution_state IN {PHASED_ROLLOUT, FULLY_RELEASED, PAUSED}"
    error_id: ERR_APP_NOT_DISTRIBUTED
    http_status: 409
    applies_to: "POST /rollout-plans/{id}/rollback, POST /commerce-items/{id}/report-revenue, PATCH /app-records/{id}/listing with listing_action=LIST"
    description: "Nothing can be rolled back, earn reportable revenue, or have a live store page before the app has ever been distributed."

  - priority: 65
    category: business_constraint
    check: "GuidelineRule.category != SAFETY, and the waiver carries a waiver_reason of at least 20 characters"
    error_id: "ERR_WAIVER_NOT_PERMITTED | ERR_EVIDENCE_REQUIRED"
    http_status: 409
    applies_to: "POST /feature-mappings/{id}/waive"
    description: "SAFETY guidelines can only reach PASSED through a real self-review with evidence. A missing or too-short waiver_reason is ERR_EVIDENCE_REQUIRED."

  - priority: 65
    category: business_constraint
    check: "A self-review PASS requires a non-empty evidence_ref, either already stored on the mapping or supplied in the request; a triage to DISPUTE or DISMISS requires a non-empty justification; a triage to DISMISS additionally requires severity != CRITICAL"
    error_id: "ERR_EVIDENCE_REQUIRED | ERR_WAIVER_NOT_PERMITTED"
    http_status: 409
    applies_to: "POST /feature-mappings/{id}/self-review, POST /behavior-findings/{id}/triage"
    description: "A CRITICAL finding can never be dismissed away (ERR_WAIVER_NOT_PERMITTED); it must be RECONCILED by actually correcting Submission.declared_privacy_items."

  - priority: 65
    category: business_constraint
    check: "The Submission's declared_privacy_items contain a tuple matching (data_type, observed_purpose, observed_linked_to_user, observed_tracking) of the finding"
    error_id: ERR_DISCLOSURE_STILL_MISSING
    http_status: 409
    applies_to: "POST /behavior-findings/{id}/triage with action=RECONCILE"
    description: "All four attributes must match exactly; a declared tuple with the right data_type but the wrong purpose or a false linked_to_user does not reconcile the finding."

  - priority: 65
    category: business_constraint
    check: "ImpactAssessment ACCEPT_NO_CHANGE requires GuidelineRule.category != SAFETY and impact_severity <= ACCEPT_NO_CHANGE_SEVERITY_CEILING; MARK_REMEDIATED requires every FeatureMapping named in affected_feature_codes to have self_review_status IN {PASSED, WAIVED_BY_PLATFORM}"
    error_id: "ERR_IMPACT_TOO_SEVERE | ERR_REMEDIATION_INCOMPLETE"
    http_status: 409
    applies_to: "POST /impact-assessments/{id}/assess"
    description: "BOUNDARY: severity exactly 6.00 may be accepted without change, 6.01 may not."

  - priority: 65
    category: business_constraint
    check: "CommerceItem commerce-rule shape: item_type == EXTERNAL_PAYMENT_LINK requires a non-null external_link_url, price_tier_cents == 0, entitlement_class != DIGITAL_CONTENT, and (at submit time) an ACTIVE DISTRIBUTION_CERT of the account carrying the EXTERNAL_PAYMENT_LINK entitlement; every other item_type requires external_link_url == null"
    error_id: "ERR_EXTERNAL_LINK_NOT_PERMITTED | ERR_VALIDATION"
    http_status: 409
    applies_to: "POST /commerce-items, POST /commerce-items/{id}/submit"
    description: "DIGITAL_CONTENT may never be sold through an external payment link, and no external link may be submitted without the platform entitlement on the signing certificate; both are ERR_EXTERNAL_LINK_NOT_PERMITTED. Shape violations (a non-zero price on an external link, a stray URL on an in-app purchase) are ERR_VALIDATION at priority 28."

  - priority: 70
    category: business_temporal
    check: "SigningCredential.not_after > the effective_review_deadline_at computed by this queue entry"
    error_id: ERR_CREDENTIAL_EXPIRES_BEFORE_DEADLINE
    http_status: 409
    applies_to: "POST /submissions/{id}/queue"
    description: "BOUNDARY: strict > — a credential expiring exactly at the review deadline is refused, because the review may conclude at that instant. This is the only reason an EXPIRING_SOON credential can block a queue call."

  - priority: 70
    category: business_temporal
    check: "clock_now <= Submission.rejected_at + APPEAL_WINDOW_DAYS * 24h"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /appeal-requests"
    description: "BOUNDARY: inclusive — an appeal filed at exactly rejected_at + 14 days is accepted. A PARTIALLY_OVERTURNED decision or an appeal withdrawal does NOT refresh rejected_at, so the original window keeps running. PRIORITY PAIR (70 vs 75): an appeal that is both out of window and filed by an account below the standing floor returns ERR_APPEAL_WINDOW_EXPIRED, never ERR_STANDING_TOO_LOW."

  - priority: 70
    category: business_temporal
    check: "No AppealRequest of the same submission is in state SUBMITTED or BOARD_REVIEW, and every cited RejectionReason belongs to this submission with disposition == CONTESTED"
    error_id: "ERR_APPEAL_ALREADY_OPEN | ERR_REJECTION_NOT_CONTESTED"
    http_status: 409
    applies_to: "POST /appeal-requests"
    description: "One live appeal per submission. A reason still PENDING or already ACCEPTED is not contestable, and neither is a reason whose appeal_disposition is already UPHELD or OVERTURNED."

  - priority: 70
    category: business_temporal
    check: "clock_now >= RolloutPlan.phase_entered_at + MIN_PHASE_DWELL_HOURS * 1h"
    error_id: ERR_PHASE_DWELL_NOT_MET
    http_status: 409
    applies_to: "POST /rollout-plans/{id}/advance"
    description: "BOUNDARY: inclusive >= — advancing exactly 24h after phase entry is legal, 23h59m is not. A pause does not extend phase_entered_at, but a RESUME rewrites it to the resume instant, so the full dwell restarts."

  - priority: 70
    category: business_temporal
    check: "clock_now >= RolloutPlan.scheduled_start_at"
    error_id: ERR_ROLLOUT_NOT_DUE
    http_status: 409
    applies_to: "POST /rollout-plans/{id}/start"
    description: "BOUNDARY: inclusive — starting exactly at scheduled_start_at succeeds."

  - priority: 70
    category: business_temporal
    check: "A ReviewCapacityWindow is selectable per calculations.review_capacity_allocation, and the already-assigned window is OPEN with starts_at <= clock_now < ends_at"
    error_id: "ERR_NO_REVIEW_CAPACITY | ERR_REVIEW_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /submissions/{id}/queue, POST /submissions/{id}/claim, POST /submissions/{id}/decision"
    description: "HALF-OPEN: a window is unusable at exactly ends_at. An empty eligible set at queue entry is ERR_NO_REVIEW_CAPACITY; an assigned window that has since closed or elapsed is ERR_REVIEW_WINDOW_CLOSED on claim and decision."

  - priority: 75
    category: business_fiscal
    check: "PublisherAccount.expedite_credits_remaining >= 1"
    error_id: ERR_EXPEDITE_QUOTA_EXHAUSTED
    http_status: 409
    applies_to: "POST /expedite-requests/{id}/decide with outcome == GRANT"
    description: "ZERO-COUNT EDGE: the third grant inside a rolling 365-day window is refused. A REFUNDED grant returns the credit and makes the next grant legal again; a DENIED request never consumed one."

  - priority: 75
    category: business_fiscal
    check: "PublisherAccount.standing_score_rolling_365 >= EXPEDITE_STANDING_FLOOR"
    error_id: ERR_STANDING_TOO_LOW
    http_status: 409
    applies_to: "POST /expedite-requests, POST /expedite-requests/{id}/decide"
    description: "BOUNDARY: inclusive >= at exactly 60.00. This gate reads the ROLLING_365 variant ONLY; standing_score_lifetime may be far lower and is irrelevant here (and vice versa)."

  - priority: 75
    category: business_fiscal
    check: "CommerceItem.reported_period_label is null and period_label is absent from PublisherAccount.settlement_finalized_periods"
    error_id: ERR_REVENUE_ALREADY_REPORTED
    http_status: 409
    applies_to: "POST /commerce-items/{id}/report-revenue"
    description: "Gross proceeds are reported exactly once per item per period; commission is recomputed from the stored gross on every settlement read thereafter."

  - priority: 75
    category: business_fiscal
    check: "No CommerceItem of the AppRecord remains in status SUBMITTED"
    error_id: ERR_INVALID_COMMERCE_ITEM_STATE
    http_status: 409
    applies_to: "POST /submissions/{id}/decision with outcome == APPROVE"
    description: "A build may not be approved while any of its app's commerce items is still awaiting commerce review; APPROVED, REJECTED, DRAFT and REMOVED items do not block."

# =============================================================================
# §1.5 API Endpoints (80 endpoints, flat root-level collections)
# Conventions: `input` lists body + query fields ("?" = optional); path ids are
# implicit. Every list endpoint accepts limit? / offset? with the §1.0 defaults
# and returns the paginated envelope. Every mutation increments the mutated
# entity's `version` by exactly 1 unless stated otherwise.
# =============================================================================
endpoints:

  # --- PublisherAccount --------------------------------------------------------
  - method: POST
    path: /publisher-accounts
    description: "Enroll a publisher in the developer program."
    roles: [PlatformPolicyAdmin]
    input: [legal_name, contact_email, membership_paid_through_at, "commerce_program_tier?"]
    output: PublisherAccount
    success_code: 201
    side_effects:
      - "program_status = ACTIVE when membership_paid_through_at > clock_now, else EXPIRED"
      - "standing_score_rolling_365 = standing_score_lifetime = 100.00; expedite_credits_remaining = EXPEDITE_CREDITS_PER_WINDOW"

  - method: GET
    path: /publisher-accounts
    description: "List publisher accounts."
    roles: [PlatformPolicyAdmin, PlatformReviewer, PlatformAppealBoard, Auditor, PublisherAdmin]
    input: ["program_status?", "commerce_program_tier?", "limit?", "offset?"]
    output: PublisherAccount[]
    success_code: 200
    side_effects: ["For entity_backed roles the result is narrowed to X-Publisher-Account-Id"]

  - method: GET
    path: /publisher-accounts/{id}
    description: "Read one publisher account."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformPolicyAdmin, PlatformReviewer, PlatformAppealBoard, Auditor]
    input: []
    output: PublisherAccount
    success_code: 200
    side_effects: []

  - method: POST
    path: /publisher-accounts/{id}/membership-renewal
    description: "Pay the program membership forward; the only way to leave program_status EXPIRED."
    roles: [PublisherAdmin]
    input: [expected_publisher_account_version, paid_through_at]
    output: PublisherAccount
    success_code: 200
    side_effects:
      - "OCC on PublisherAccount.version (§1.2.1 membership-renewal-stale-account); 412 ERR_STALE_PUBLISHER_ACCOUNT_VERSION on mismatch"
      - "membership_paid_through_at = paid_through_at (must be > clock_now, else ERR_VALIDATION); EXPIRED -> ACTIVE"
      - "Recomputes compliance_posture of every AppRecord of the account"
      - "Increments PublisherAccount.version by 1"

  - method: POST
    path: /publisher-accounts/{id}/enforcement
    description: "Platform enforcement action on an account."
    roles: [PlatformPolicyAdmin]
    input: [action, reason_code]
    output: PublisherAccount
    success_code: 200
    side_effects:
      - "action SUSPEND -> program_status SUSPENDED; TERMINATE -> TERMINATED; REINSTATE -> ACTIVE (or EXPIRED when membership_paid_through_at < clock_now)"
      - "enforcement_reason_code = reason_code (null on REINSTATE)"
      - "Recomputes compliance_posture of every AppRecord of the account (FROZEN while TERMINATED)"

  - method: GET
    path: /publisher-accounts/{id}/standing
    description: "Both standing variants and the expedite credit ledger side by side — the dual-variant read."
    roles: [PublisherAdmin, ComplianceOfficer, PlatformAppealBoard, PlatformPolicyAdmin, Auditor]
    input: []
    output: "{ standing_score_rolling_365: number, standing_score_lifetime: number, expedite_credits_remaining: integer, credits_used_in_window: integer, rejection_strike_count: integer, penalty_event_count: integer, decayed_penalty_total: number, undecayed_penalty_total: number, credit_total: number }"
    success_code: 200
    side_effects: ["Read-only: both calculations.standing_score variants are evaluated against the same stored rows"]

  # --- SigningCredential -------------------------------------------------------
  - method: POST
    path: /signing-credentials
    description: "Register a distribution certificate or provisioning profile."
    roles: [PublisherAdmin]
    input: [expected_publisher_account_version, publisher_account_id, credential_type, platform, key_custody, not_before, not_after, "linked_cert_id?", "entitlements?"]
    output: SigningCredential
    success_code: 201
    side_effects:
      - "OCC on PublisherAccount.version (§1.2.1 credential-create-stale-account); 412 ERR_STALE_PUBLISHER_ACCOUNT_VERSION on mismatch"
      - "status = PENDING_ACTIVATION; increments PublisherAccount.version by 1"

  - method: GET
    path: /signing-credentials
    description: "List signing material."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformPolicyAdmin, Auditor]
    input: ["publisher_account_id?", "linked_cert_id?", "credential_type?", "platform?", "status?", "key_custody?", "limit?", "offset?"]
    output: SigningCredential[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /signing-credentials/{id}
    description: "Read one credential."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformPolicyAdmin, Auditor]
    input: []
    output: SigningCredential
    success_code: 200
    side_effects: []

  - method: POST
    path: /signing-credentials/{id}/activate
    description: "Activate a credential, superseding the account's previous one of the same kind."
    roles: [PublisherAdmin]
    input: []
    output: SigningCredential
    success_code: 200
    side_effects:
      - "PENDING_ACTIVATION -> ACTIVE; supersedes the account's other ACTIVE/EXPIRING_SOON credential of the same (credential_type, platform) with revocation_reason = SUPERSEDED"
      - "Recomputes compliance_posture of every AppRecord of the account"

  - method: POST
    path: /signing-credentials/{id}/report-compromise
    description: "Emergency key-compromise report; runs the four-hop signing cascade."
    roles: [PublisherAdmin, PlatformPolicyAdmin]
    input: [reason_code]
    output: SigningCredential
    success_code: 200
    side_effects:
      - "ACTIVE|EXPIRING_SOON -> COMPROMISED with compromised_at = clock_now"
      - "CASCADE: linked profiles -> REVOKED (COMPROMISE_CASCADE) -> their in-flight Submissions -> BLOCKED_INVALID_SIGNING with review slot release -> posture RESTRICTED -> PHASE_ACTIVE rollouts PAUSED -> distribution_state PAUSED"
      - "Exempt from the posture gate at validations priority 40 and from ERR_CREDENTIAL_IN_USE"

  - method: POST
    path: /signing-credentials/{id}/revoke
    description: "Retire a credential."
    roles: [PublisherAdmin]
    input: ["revocation_reason?"]
    output: SigningCredential
    success_code: 200
    side_effects:
      - "ACTIVE|COMPROMISED -> REVOKED with revocation_reason = MANUAL when not supplied"
      - "Refused with ERR_CREDENTIAL_IN_USE while any Submission signed with it is WAITING_FOR_REVIEW or IN_REVIEW"
      - "Recomputes compliance_posture of every AppRecord of the account"

  # --- AppRecord ---------------------------------------------------------------
  - method: POST
    path: /app-records
    description: "Create an app listing shell."
    roles: [PublisherAdmin]
    input: [publisher_account_id, bundle_id, platform, display_name, primary_category]
    output: AppRecord
    success_code: 201
    side_effects:
      - "listing_state = DRAFT, distribution_state = NOT_DISTRIBUTED"
      - "compliance_posture is computed immediately and is RESTRICTED until an ACTIVE DISTRIBUTION_CERT and full mapping coverage exist"

  - method: GET
    path: /app-records
    description: "List app records."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformPolicyAdmin, PlatformAppealBoard, Auditor]
    input: ["publisher_account_id?", "live_submission_id?", "platform?", "primary_category?", "listing_state?", "distribution_state?", "compliance_posture?", "limit?", "offset?"]
    output: AppRecord[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /app-records/{id}
    description: "Read one app record including both state dimensions and the derived posture."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformPolicyAdmin, PlatformAppealBoard, Auditor]
    input: []
    output: AppRecord
    success_code: 200
    side_effects: []

  - method: PATCH
    path: /app-records/{id}/listing
    description: "Drive the listing_state dimension (independent of distribution_state)."
    roles: [PublisherAdmin, PlatformPolicyAdmin]
    input: [listing_action]
    output: AppRecord
    success_code: 200
    side_effects:
      - "listing_action COMPLETE_METADATA | LIST | DELIST | RETURN_TO_DRAFT per the §1.2 AppRecord.listing_state machine"
      - "Never touches distribution_state, live_submission_id or the share fields"
      - "DELIST is the only listing action a PlatformPolicyAdmin may take"

  - method: GET
    path: /app-records/{id}/compliance-summary
    description: "Posture explanation: index, ordered reason codes and the blocking child counts."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformPolicyAdmin, Auditor]
    input: []
    output: "{ compliance_posture: string, posture_reason_codes: string[], feature_compliance_index: number, mapping_total: integer, mapping_passed: integer, mapping_stale: integer, mapping_failed: integer, open_impact_count: integer, overdue_impact_count: integer, critical_finding_open_count: integer, active_distribution_cert_present: boolean }"
    success_code: 200
    side_effects: ["Read-only; recomputes calculations.feature_compliance_index and calculations.compliance_posture from current rows without persisting"]

  - method: GET
    path: /app-records/{id}/commerce-settlement
    description: "Per-line and total commission for one settlement period (round-per-line-then-sum)."
    roles: [PublisherAdmin, PlatformPolicyAdmin, Auditor]
    input: [period_label]
    output: "{ period_label: string, line_count: integer, gross_cents_total: integer, commission_cents_total: integer, net_cents_total: integer, lines: object[] }"
    success_code: 200
    side_effects: ["Read-only; evaluates calculations.commission_settlement_cents over the APPROVED CommerceItem rows whose reported_period_label == period_label"]

  # --- GuidelineRule -----------------------------------------------------------
  - method: POST
    path: /guideline-rules
    description: "Draft a platform guideline."
    roles: [PlatformPolicyAdmin]
    input: [rule_code, title, category, version_label, effective_from, "supersedes_rule_id?", "requires_feature_mapping?"]
    output: GuidelineRule
    success_code: 201
    side_effects:
      - "status = DRAFT; severity_weight and remediation_grace_days are derived from category and are never client-supplied"

  - method: GET
    path: /guideline-rules
    description: "List guidelines."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformAppealBoard, PlatformPolicyAdmin, Auditor]
    input: ["supersedes_rule_id?", "status?", "category?", "version_label?", "requires_feature_mapping?", "limit?", "offset?"]
    output: GuidelineRule[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /guideline-rules/{id}
    description: "Read one guideline."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformAppealBoard, PlatformPolicyAdmin, Auditor]
    input: []
    output: GuidelineRule
    success_code: 200
    side_effects: []

  - method: POST
    path: /guideline-rules/{id}/publish
    description: "Publish a guideline; runs the four-hop guideline-change cascade across every affected app."
    roles: [PlatformPolicyAdmin]
    input: []
    output: GuidelineRule
    success_code: 200
    side_effects:
      - "DRAFT -> EFFECTIVE with published_at = clock_now"
      - "CASCADE hop 1: superseded rule -> SUPERSEDED, its FeatureMapping rows re-pointed here, PASSED/WAIVED_BY_PLATFORM ones -> STALE with staled_by_rule_id"
      - "CASCADE hop 2: one ImpactAssessment per affected AppRecord (status OPEN, affected_feature_codes ordered by FeatureMapping.created_at ASC), index recomputed with the STALE factor, posture -> RESTRICTED"
      - "CASCADE hop 3: PHASE_ACTIVE RolloutPlans -> PAUSED with pause_reason_code = POSTURE_DEGRADED"
      - "CASCADE hop 4: AppRecord.distribution_state PHASED_ROLLOUT -> PAUSED with both share fields frozen"
      - "Sets impacted_app_count; increments the version of every touched entity by 1"

  # --- FeatureMapping ----------------------------------------------------------
  - method: POST
    path: /feature-mappings
    description: "Map a product feature to a guideline."
    roles: [ComplianceOfficer]
    input: [app_record_id, guideline_rule_id, feature_code, "evidence_ref?"]
    output: FeatureMapping
    success_code: 201
    side_effects:
      - "self_review_status = NOT_STARTED; risk_weight copied from GuidelineRule.severity_weight"
      - "Recomputes AppRecord.feature_compliance_index and compliance_posture (a new NOT_STARTED mapping lowers the index)"

  - method: GET
    path: /feature-mappings
    description: "List feature-to-guideline mappings."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformPolicyAdmin, Auditor]
    input: ["app_record_id?", "guideline_rule_id?", "staled_by_rule_id?", "self_review_status?", "feature_code?", "limit?", "offset?"]
    output: FeatureMapping[]
