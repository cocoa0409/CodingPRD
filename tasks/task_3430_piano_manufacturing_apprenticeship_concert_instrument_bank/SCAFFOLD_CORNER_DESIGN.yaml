            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 30, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv3: $.data.version } }
          trigger:
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: VOICING, hours_applied: 0, expected_build_order_version: "${bv3}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_VALIDATION (hours_applied 0 outside (0, 500])"
            - "BuildOrder.${b_id}.status == SEASONING, version == ${bv3}"

      - name: seasoning_gate_fails_at_day_364
        claim_type: violation_to_error
        grounds: [calculations.seasoning_and_drying_gates, "errors[ERR_SEASONING_INCOMPLETE]"]
        distinguishing_aspect: "At exactly 364 elapsed days the SEASONING -> ACTION_REGULATION advance fails with ERR_SEASONING_INCOMPLETE; the 365-day pass side is asserted by the difficulty instance seasoning_exactly_365_days_allows_regulation."
        test_recipe:
          setup: ["build entered SEASONING 2027-04-29 (version 3); clock at 2028-04-27 (364 days)"]
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.5 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_B, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 100, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 30, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv3: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-04-27T00:00:00Z" }, as: WorkshopManager }
          trigger:
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: ACTION_REGULATION, hours_applied: 40, expected_build_order_version: "${bv3}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_SEASONING_INCOMPLETE (364 < 365)"
            - "BuildOrder.${b_id}.status == SEASONING and version == ${bv3}"

      - name: duplicate_endorsement_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_ENDORSEMENT]"]
        distinguishing_aspect: "A second endorsement for the same (apprentice, operation) while the first is IN_TRAINING fails with ERR_DUPLICATE_ENDORSEMENT 409."
        test_recipe:
