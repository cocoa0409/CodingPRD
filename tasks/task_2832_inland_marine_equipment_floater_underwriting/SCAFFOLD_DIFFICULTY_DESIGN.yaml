              as: Underwriter
              captures: { item_1: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp2}/equipment-items"
