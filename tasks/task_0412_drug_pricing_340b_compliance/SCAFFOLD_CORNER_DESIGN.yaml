              payload: { covered_entity_id: "${ce_id}", drug_product_id: "${dp_id}", channel: "B340B", packages_ordered: 2, quarter: "2026Q2", unit_price_paid_cents: 2700 }
              as: PharmacyOperator
            - call: "GET /340b/drug-products/${dp_id}"
              payload: {}
              as: HrsaAuditor
              captures: { dp_ver: $.data.version }
            - call: "POST /340b/drug-products/${dp_id}/reconcile"
              payload: { quarter: "2026Q2", expected_drug_product_version: "${dp_ver}" }
              as: HrsaAuditor
              captures: { obl_id: $.data.id }
          trigger:
            - call: "POST /340b/repayment-obligations/${obl_id}/remit"
              payload: { amount_cents: 1000 }
              as: HrsaAuditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE and HTTP status == 403"

      - name: unauthenticated_missing_headers_rejected
        claim_type: rbac_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with an unknown X-User-Role returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /340b/covered-entities"
              payload: {}
              as: GhostRole
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and HTTP status == 401"

      - name: segregation_of_duties_self_discloser_cannot_dispute
        claim_type: rbac_denial
        grounds:
          - validations[priority=13]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.AuditFinding.UNDER_REVIEW_to_DISPUTED
        distinguishing_aspect: "The same ComplianceOfficer X-User-ID that created a SELF_DISCLOSURE finding cannot dispute it after start-review; returns ERR_SEGREGATION_OF_DUTIES (403). A different ComplianceOfficer id may dispute it."
        test_recipe:
          setup:
            - "A SELF_DISCLOSURE finding created by ComplianceOfficer user 'co-discloser', advanced to UNDER_REVIEW by an auditor."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020040", legal_name: "SoD CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              as_user_id: "co-discloser"
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00045-0045-45", drug_name: "SoD Drug", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              as_user_id: "co-discloser"
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
              as_user_id: "co-discloser"
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "3737370000", full_name: "Dr SoD", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              as_user_id: "co-discloser"
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-SOD-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              as_user_id: "co-discloser"
              captures: { pat_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 4, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/self-disclosures"
              payload: { prescription_dispense_id: "${disp_id}", finding_type: "DIVERSION", assessed_units: 4 }
              as: ComplianceOfficer
              as_user_id: "co-discloser"
              captures: { af_id: $.data.id }
            - call: "POST /340b/audit-findings/${af_id}/start-review"
              payload: {}
              as: HrsaAuditor
          trigger:
            - call: "POST /340b/audit-findings/${af_id}/dispute"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-discloser"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES and HTTP status == 403"

  # ==========================================================================
  # SECTION: cross_cutting_complexity_layers
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_accumulator_replenish_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[accumulator-replenish-stale]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Manual replenish carrying a stale expected_accumulator_version (the version observed before an auto-replenishing dispense bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "Accumulator on package_size-30 NDC observed at a known version, then a 340B dispense of 30 advances accrued/version via auto-replenish."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020041", legal_name: "OccAcc CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
