  - rule_id: boundary_precision_check
    instances:
      - name: qa_pass_close_at_defect_density_exactly_at_ceiling_rejected
        grounds:
          - calculations.qa_defect_density
          - validations[priority=57]
          - state_machines.QaPass.OPEN_to_CLOSED
        distinguishing_aspect: |
          Exercises the STRICT inequality at the 0.0500 defect-density ceiling and the
          4-decimal round_half_up that produces it: 8/160 == 0.0500 exactly is REFUSED (a
          less-than-or-equal implementation passes it), while 8/161 == 0.0497 after rounding is
          accepted. A naive implementation that rounds the density to 2 decimals would see 0.05
          in both cases and behave identically, so the pass/fail split falsifies the precision too.
        test_recipe:
          setup:
            - "Title NOVA-20, one string key, JP market plan TEXT_ONLY driven to LQA with its unit DELIVERED."
            - "FUNCTIONAL pass opened by lqa-1 with inspected_unit_count == 160."
            - "Two S2 FUNCTIONAL_CRASH bugs (weight 4 each) logged by lqa-1: weighted_defect_points == 8, density == 8/160 == 0.0500 exactly."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /titles"
              payload: { title_code: "NOVA-20", name: "Nova Drift 20", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
