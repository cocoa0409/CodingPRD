              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "11 Birch St", city: "Culver City", state_code: "CA", zip11: "902300101071", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
              captures: { p_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points/${p_id}/activate"
              payload: { route_id: "${route_id}" }
              as: AddressManagementSpecialist
            - call: "POST /api/delivery-units/${unit_id}/holds"
              payload: { delivery_point_id: "${p_id}", hold_start_date: "2026-09-10", hold_end_date: "2026-09-15", disposition: "ACCUMULATE_DELIVER_ON_END" }
              as: CustomerServiceRep
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/holds"
              payload: { delivery_point_id: "${p_id}", hold_start_date: "2026-09-15", hold_end_date: "2026-09-20", disposition: "ACCUMULATE_DELIVER_ON_END" }
              as: CustomerServiceRep
