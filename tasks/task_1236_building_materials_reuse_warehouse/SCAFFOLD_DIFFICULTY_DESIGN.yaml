  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (4 instances: money/count/days/volume,
  #          each via a distinct endpoint)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: appraisal_threshold_exact_boundary
        grounds:
          - calculations.receipt_final_valuation
          - errors[ERR_APPRAISAL_REQUIRED]
          - entities.TaxReceipt.fields.valued_total_cents
        distinguishing_aspect: |
          Metric = receipt valuation cents via POST /reuse/tax-receipts/{id}/issue:
          item sum exactly == 500000 triggers QUALIFIED_APPRAISAL (>= inclusive) — issuing
          without appraisal fields fails; a 400000-sum offer issues cleanly without one.
        test_recipe:
          setup:
            - "Category LIGHTING PER_UNIT base 80000, no appraisal-review flag"
            - "Offer B (boundary): 5 items override-priced 100000 each -> sum 500000; RECEIVED by staff-r"
            - "Offer U (under): 2 items override-priced 100000 each -> sum 400000; RECEIVED by staff-r"
            - "Receipts drafted for both offers"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "LIGHTING", display_name: "Lighting", pricing_model: "PER_UNIT", base_rate_cents: 80000, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
