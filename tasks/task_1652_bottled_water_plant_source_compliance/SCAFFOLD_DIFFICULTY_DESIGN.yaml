# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Bottled Water Plant & Source Compliance
# 9 rules x 2 instances = 18 instances. All chains replay against SCAFFOLD.yaml
# §1.5 exactly; OCC version values are always captured fresh via GET.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: permit_remaining_provisional_vs_certified
        grounds:
          - calculations.permit_withdrawal_remaining
          - entities.WaterSourcePermit.fields.withdrawn_month_provisional_gallons
          - entities.WaterSourcePermit.fields.withdrawn_month_certified_gallons
          - state_machines.WithdrawalEvent.RECORDED_to_FINALIZED
        distinguishing_aspect: |
          On the WaterSourcePermit volumetric domain, the provisional variant counts RECORDED+FINALIZED
          events while the certified variant counts FINALIZED only: with two RECORDED events totalling
          9000 gallons the same stored rows yield 9000 vs 0, and the certified figure only catches up
          (9000) after a compliance run finalizes them.
        test_recipe:
          setup:
            - "Plant with one SPRING permit (daily 10000, monthly 200000, valid 2026-01-01..2026-12-31)"
            - "Logical clock at startup default 2026-08-01T00:00:00Z"
            - "Two RECORDED withdrawal events dated 2026-08-01: 6000 and 3000 gallons"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant DV1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-DV1", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 6000, meter_reading_start_gallons: 0, meter_reading_end_gallons: 6000, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { ev1: $.data.id } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv2: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 3000, meter_reading_start_gallons: 6000, meter_reading_end_gallons: 9000, expected_permit_version: "${pv2}" }, as: SourceMonitor, captures: { ev2: $.data.id } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { prov_today: $.data.withdrawn_today_provisional_gallons, cert_today: $.data.withdrawn_today_certified_gallons, prov_month: $.data.withdrawn_month_provisional_gallons, cert_month: $.data.withdrawn_month_certified_gallons } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin, captures: { finalized: $.data.events_finalized } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { prov_month2: $.data.withdrawn_month_provisional_gallons, cert_month2: $.data.withdrawn_month_certified_gallons, prov_today2: $.data.withdrawn_today_provisional_gallons, cert_today2: $.data.withdrawn_today_certified_gallons } }
          assert:
            - "WithdrawalEvent.${ev1}.status == RECORDED before the compliance run"
            - "${prov_today} == 9000"
            - "${cert_today} == 0"
            - "${prov_month} == 9000"
            - "${cert_month} == 0"
            - "${finalized} == 2"
            - "${prov_month2} == 9000"
            - "${cert_month2} == 9000"
            - "${prov_today2} == 0 and ${cert_today2} == 0 (today window keys on the current logical date 2026-08-02)"

      - name: bottle_pool_gross_vs_sanitized
        grounds:
          - calculations.bottle_loop_availability
          - entities.Plant.fields.bottle_gross_pool_units
          - entities.Plant.fields.bottle_sanitized_pool_units
        distinguishing_aspect: |
          On the ReturnableBottle domain (different entity domain than the permit instance), the
          gross_loop variant counts SANITIZED+FILLED+WITH_CUSTOMER while the sanitized_only variant
          counts SANITIZED only: with 3 SANITIZED + 1 FILLED + 1 WITH_CUSTOMER the same bottle
          population yields 5 vs 3 — an inclusion-set divergence, not a provisional/final one.
        test_recipe:
          setup:
            - "Plant with SPRING permit, one bottling line (5000 preforms accepted), one VALIDATED treatment run, one RELEASED lot (planned/produced 1000)"
            - "Five bottles registered; b1 FILLED then delivered (WITH_CUSTOMER), b2 FILLED, b3/b4/b5 left SANITIZED"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant DV2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-DV2", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/validate", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 5000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 5000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv3: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 1000, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv3}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /api/production-lots/${lot}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/production-lots/${lot}/complete", payload: { produced_units: 1000 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "GET /api/lab-tests?subject_lot_id=${lot}&test_type=FINISHED_PRODUCT", as: QAOfficer, captures: { fptest: "$.data[0].id" } }
            - { call: "POST /api/lab-tests/${fptest}/record-result", payload: { result: "PASS", collected_at: "2026-08-04T13:00:00Z" }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/production-lots/${lot}/release", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-001" }, as: SanitationLead, captures: { b1: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-002" }, as: SanitationLead, captures: { b2: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-003" }, as: SanitationLead, captures: { b3: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-004" }, as: SanitationLead, captures: { b4: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-005" }, as: SanitationLead, captures: { b5: $.data.id } }
            - { call: "POST /api/bottles/${b1}/fill", payload: { lot_id: "${lot}" }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/bottles/${b1}/deliver", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/bottles/${b2}/fill", payload: { lot_id: "${lot}" }, as: ProductionLead, as_user_id: "pl-1" }
          trigger:
            - { call: "GET /api/plants/${plant}", as: PlantAdmin, captures: { gross: $.data.bottle_gross_pool_units, san: $.data.bottle_sanitized_pool_units } }
            - { call: "GET /api/bottles/${b1}", as: SanitationLead, captures: { b1_status: $.data.status } }
            - { call: "GET /api/bottles/${b2}", as: SanitationLead, captures: { b2_status: $.data.status } }
            - { call: "GET /api/bottles/${b3}", as: SanitationLead, captures: { b3_status: $.data.status } }
          assert:
            - "${gross} == 5"
            - "${san} == 3"
            - "${b1_status} == WITH_CUSTOMER"
            - "${b2_status} == FILLED"
            - "${b3_status} == SANITIZED"
            - "Bottle.${b4}.status == SANITIZED and Bottle.${b5}.status == SANITIZED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes (a) and (b))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: treatment_verdict_branching_thresholds
        grounds:
          - calculations.treatment_validation_verdict
          - state_machines.TreatmentRun.IN_PROGRESS_to_VALIDATED
          - state_machines.TreatmentRun.IN_PROGRESS_to_FAILED
        distinguishing_aspect: |
          Mode (a): a 5-input formula with a conditional branch on entity state — SPRING-source runs are
          governed by micro_pore_micron <= 0.2 while non-SPRING runs are governed by ro_rejection_pct >= 95.0.
          The same micro_pore_micron = 0.21 that FAILS a spring run is irrelevant to a WELL-sourced run,
          which passes on RO = 96.0; parameters exactly at threshold (40.0 / 1.6 / 0.3 / 0.2) pass.
        test_recipe:
          setup:
            - "Plant with a SPRING permit and a WELL permit"
            - "R1 on the SPRING permit with all parameters exactly at threshold; R2 on the SPRING permit with micro_pore_micron 0.21; R3 on the WELL permit with micro_pore_micron 0.21 and ro_rejection_pct 96.0"
            - "Parameters recorded by pl-1; validation performed by qa-1 (segregation satisfied)"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CF1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CF1", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm_s: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "WL-CF1", source_classification: "WELL", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm_w: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm_s}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T08:00:00Z" }, as: ProductionLead, captures: { r1: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm_s}", scheduled_start: "2026-08-03T08:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { r2: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm_w}", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T12:00:00Z" }, as: ProductionLead, captures: { r3: $.data.id } }
            - { call: "POST /api/treatment-runs/${r1}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${r1}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${r2}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${r2}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.21 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${r3}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${r3}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.21, ro_rejection_pct: 96.0 }, as: ProductionLead, as_user_id: "pl-1" }
          trigger:
            - { call: "POST /api/treatment-runs/${r1}/validate", as: QAOfficer, as_user_id: "qa-1", captures: { r1_status: $.data.status, r1_round: $.data.validation_round } }
            - { call: "POST /api/treatment-runs/${r2}/validate", as: QAOfficer, as_user_id: "qa-1", captures: { r2_status: $.data.status, r2_round: $.data.validation_round } }
            - { call: "POST /api/treatment-runs/${r3}/validate", as: QAOfficer, as_user_id: "qa-1", captures: { r3_status: $.data.status, r3_round: $.data.validation_round } }
          assert:
            - "${r1_status} == VALIDATED"
            - "${r1_round} == 1"
            - "${r2_status} == FAILED"
            - "${r2_round} == 1"
            - "${r3_status} == VALIDATED (the 0.21 micron reading that failed R2 is not consulted on the non-spring branch)"
            - "${r3_round} == 1"

      - name: community_report_per_source_rounding
        grounds:
          - calculations.community_report_volumes
          - entities.CommunityWaterReport.fields.total_acre_feet
          - entities.CommunityWaterReport.fields.per_source_breakdown
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — each source's gallons are converted to acre-feet
          and rounded to 3 decimals (round_half_up) BEFORE summation. With 163088 gal (0.5004986... -> 0.500)
          and 1 gal (0.0000031 -> 0.000) the pinned order yields total_acre_feet == 0.500, while the
          forbidden sum-then-convert order yields round(163089/325851, 3) == 0.501 — a different 3rd
          decimal on identical inputs.
        test_recipe:
          setup:
            - "Plant with SPRING permit A and WELL permit B (caps 200000/day, 5000000/month each)"
            - "FINALIZED July events: A = 163088 gallons (2026-07-10), B = 1 gallon (2026-07-11)"
            - "Logical clock at startup default 2026-08-01T00:00:00Z (July dates are backfill; compliance run finalizes them)"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CF2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CF2", source_classification: "SPRING", daily_cap_gallons: 200000, monthly_cap_gallons: 5000000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { permA: $.data.id, pvA: $.data.version } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "WL-CF2", source_classification: "WELL", daily_cap_gallons: 200000, monthly_cap_gallons: 5000000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { permB: $.data.id, pvB: $.data.version } }
            - { call: "POST /api/permits/${permA}/withdrawal-events", payload: { withdrawal_date: "2026-07-10", gallons: 163088, meter_reading_start_gallons: 0, meter_reading_end_gallons: 163088, expected_permit_version: "${pvA}" }, as: SourceMonitor, captures: { evA: $.data.id } }
            - { call: "POST /api/permits/${permB}/withdrawal-events", payload: { withdrawal_date: "2026-07-11", gallons: 1, meter_reading_start_gallons: 0, meter_reading_end_gallons: 1, expected_permit_version: "${pvB}" }, as: SourceMonitor, captures: { evB: $.data.id } }
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin, captures: { finalized: $.data.events_finalized } }
          trigger:
            - { call: "POST /api/plants/${plant}/community-reports", payload: { period_year: 2026, period_month: 7 }, as: ComplianceOfficer, captures: { rep: $.data.id, tot_gal: $.data.total_withdrawn_gallons, tot_af: $.data.total_acre_feet } }
            - { call: "GET /api/community-reports/${rep}", as: ComplianceOfficer, captures: { brk0_gal: $.data.per_source_breakdown } }
          assert:
            - "${finalized} == 2"
            - "${tot_gal} == 163089"
            - "${tot_af} == 0.5 (i.e., 0.500: 0.500 + 0.000 per-source, NOT 0.501 from sum-then-convert)"
            - "per_source_breakdown[0] = (permit_id ${permA}, gallons 163088, acre_feet 0.5) — permits ordered by created_at ASC, A first"
            - "per_source_breakdown[1] = (permit_id ${permB}, gallons 1, acre_feet 0.0)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: bottle_loop_cycle_counter_increments_once
        grounds:
          - state_machines.ReturnableBottle.SANITIZED_to_FILLED
          - state_machines.ReturnableBottle.RETURNED_DIRTY_to_IN_WASH
          - state_machines.ReturnableBottle.IN_WASH_to_SANITIZED
          - entities.ReturnableBottle.fields.wash_cycle_count
        distinguishing_aspect: |
          ReturnableBottle is a true cycle SANITIZED -> FILLED -> WITH_CUSTOMER -> RETURNED_DIRTY ->
          IN_WASH -> SANITIZED: one full loop returns to the exact initial state with wash_cycle_count
          incremented exactly once (0 -> 1) and last_wash_batch_id set — plus an AUTO BOTTLE_SANITATION
          lab test spawned by the PASSED batch.
        test_recipe:
          setup:
            - "Plant with SPRING permit, line (5000 preforms accepted), VALIDATED run, RELEASED lot (planned/produced 500)"
            - "Bottle b registered (SANITIZED, wash_cycle_count 0)"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant NL1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-NL1", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/validate", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 5000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 5000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv3: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 500, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv3}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /api/production-lots/${lot}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/production-lots/${lot}/complete", payload: { produced_units: 500 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "GET /api/lab-tests?subject_lot_id=${lot}&test_type=FINISHED_PRODUCT", as: QAOfficer, captures: { fptest: "$.data[0].id" } }
            - { call: "POST /api/lab-tests/${fptest}/record-result", payload: { result: "PASS", collected_at: "2026-08-04T13:00:00Z" }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/production-lots/${lot}/release", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-LOOP" }, as: SanitationLead, captures: { b: $.data.id } }
            - { call: "POST /api/bottles/${b}/fill", payload: { lot_id: "${lot}" }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/bottles/${b}/deliver", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/bottles/${b}/return", as: SanitationLead, as_user_id: "sl-1", captures: { st_returned: $.data.status } }
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_A", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: SanitationLead, captures: { batch: $.data.id } }
            - { call: "POST /api/wash-batches/${batch}/assign-bottles", payload: { bottle_ids: ["${b}"] }, as: SanitationLead, captures: { bc: $.data.bottle_count } }
            - { call: "POST /api/wash-batches/${batch}/start", as: SanitationLead, as_user_id: "sl-1" }
          trigger:
            - { call: "POST /api/wash-batches/${batch}/complete", payload: { rinse_temp_c: 71.1, sanitizer_ppm: 50.0 }, as: SanitationLead, as_user_id: "sl-1", captures: { batch_status: $.data.status } }
            - { call: "GET /api/bottles/${b}", as: SanitationLead, captures: { b_status: $.data.status, b_count: $.data.wash_cycle_count, b_lastbatch: $.data.last_wash_batch_id } }
            - { call: "GET /api/lab-tests?subject_wash_batch_id=${batch}&test_type=BOTTLE_SANITATION", as: QAOfficer, captures: { sptest: "$.data[0].id", sptest_status: "$.data[0].status" } }
          assert:
            - "${st_returned} == RETURNED_DIRTY"
            - "${bc} == 1 while the bottle is IN_WASH"
            - "${batch_status} == PASSED"
            - "${b_status} == SANITIZED (cycle closed back to the initial state)"
            - "${b_count} == 1 (exactly one increment for one PASSED wash)"
            - "${b_lastbatch} == ${batch}"
            - "${sptest_status} == SCHEDULED (AUTO sanitation micro test created by the PASSED batch)"

      - name: lot_rework_loop_reentry_release
        grounds:
          - state_machines.ProductionLot.QA_HOLD_to_REWORK
          - state_machines.ProductionLot.REWORK_to_QA_HOLD
          - state_machines.ProductionLot.QA_HOLD_to_RELEASED
          - entities.ProductionLot.fields.rework_count
        distinguishing_aspect: |
          ProductionLot is a branching machine with a revision loop (QA_HOLD -> REWORK -> QA_HOLD),
          a different entity than the bottle cycle: two rejections drive rework_count to 2 and the lot
          still reaches RELEASED afterwards, proving the loop re-enters QA_HOLD rather than terminating.
        test_recipe:
          setup:
            - "Plant with SPRING permit, line (5000 preforms accepted), VALIDATED run, lot created/started/completed (planned 800, produced 800) by pl-1"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant NL2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-NL2", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/validate", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 5000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 5000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv3: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 800, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv3}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /api/production-lots/${lot}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/production-lots/${lot}/complete", payload: { produced_units: 800 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/production-lots/${lot}/reject", as: QAOfficer, as_user_id: "qa-1", captures: { rw1: $.data.rework_count } }
            - { call: "POST /api/production-lots/${lot}/rework-complete", as: ProductionLead, as_user_id: "pl-1" }
          trigger:
            - { call: "POST /api/production-lots/${lot}/reject", as: QAOfficer, as_user_id: "qa-1", captures: { rw2: $.data.rework_count, st2: $.data.status } }
            - { call: "POST /api/production-lots/${lot}/rework-complete", as: ProductionLead, as_user_id: "pl-1", captures: { st3: $.data.status } }
            - { call: "GET /api/lab-tests?subject_lot_id=${lot}&test_type=FINISHED_PRODUCT", as: QAOfficer, captures: { fptest: "$.data[0].id" } }
            - { call: "POST /api/lab-tests/${fptest}/record-result", payload: { result: "PASS", collected_at: "2026-08-04T15:00:00Z" }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/production-lots/${lot}/release", as: QAOfficer, as_user_id: "qa-1", captures: { st4: $.data.status } }
          assert:
            - "${rw1} == 1"
            - "${rw2} == 2"
            - "${st2} == REWORK"
            - "${st3} == QA_HOLD (loop re-entry, not a new state)"
            - "${st4} == RELEASED (the finished-product PASS test from the first QA_HOLD still satisfies the release gate)"
  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: source_test_fail_cascade_suspends_permit_cancels_runs
        grounds:
          - state_machines.LabTest.SCHEDULED_to_COMPLETED_FAIL
          - state_machines.WaterSourcePermit.ACTIVE_to_SUSPENDED
          - state_machines.TreatmentRun.SCHEDULED_to_CANCELLED
          - calculations.plant_compliance_posture
        distinguishing_aspect: |
          Depth-3 chain from the record-result trigger: LabTest FAIL (hop 1) mutates the permit to
          SUSPENDED (hop 2); that permit mutation itself cancels the SCHEDULED TreatmentRun (hop 3)
          and forces the plant posture recompute to BREACH (hop 4) — each hop is caused by the
          previous mutation, not by the original API call.
        test_recipe:
          setup:
            - "Plant with one SPRING permit (ACTIVE)"
            - "TreatmentRun T referencing the permit, left in SCHEDULED"
            - "SOURCE_RAW lab test on the permit with due_date 2026-08-05 (SCHEDULED at default clock 2026-08-01)"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant TC1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-TC1", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "POST /api/plants/${plant}/lab-tests", payload: { test_type: "SOURCE_RAW", subject_permit_id: "${perm}", due_date: "2026-08-05" }, as: QAOfficer, captures: { test: $.data.id } }
          trigger:
            - { call: "POST /api/lab-tests/${test}/record-result", payload: { result: "FAIL", collected_at: "2026-08-03T09:00:00Z" }, as: QAOfficer, as_user_id: "qa-1", captures: { t_status: $.data.status } }
            - { call: "GET /api/permits/${perm}", as: ComplianceOfficer, captures: { p_status: $.data.status, p_reason: $.data.suspension_reason } }
            - { call: "GET /api/treatment-runs/${run}", as: ProductionLead, captures: { r_status: $.data.status } }
            - { call: "GET /api/plants/${plant}", as: PlantAdmin, captures: { posture: $.data.compliance_posture } }
          assert:
            - "${t_status} == COMPLETED_FAIL"
            - "${p_status} == SUSPENDED"
            - "${p_reason} == SOURCE_TEST_FAIL"
            - "${r_status} == CANCELLED (hop 3: caused by the permit suspension, not by the test call directly)"
            - "${posture} == BREACH (hop 4: posture recompute caused by the suspension)"

      - name: recall_initiation_cascade_lots_then_bottles
        grounds:
          - state_machines.ProductionLot.RELEASED_to_RECALLED
          - state_machines.ReturnableBottle.FILLED_to_QUARANTINED
          - state_machines.ReturnableBottle.WITH_CUSTOMER_to_QUARANTINED
          - entities.RecallEvent.fields.units_in_scope
          - calculations.plant_compliance_posture
        distinguishing_aspect: |
          Depth-3 chain from the recall-creation trigger (a different trigger than the test-FAIL
          cascade): RecallEvent creation (hop 1) mutates the in-scope lot to RECALLED (hop 2); the
          lot's recall mutation itself quarantines every bottle last filled from it that is FILLED or
          WITH_CUSTOMER (hop 3) — while an unfilled SANITIZED bottle of the same plant is untouched —
          and the open recall forces plant posture BREACH.
        test_recipe:
          setup:
            - "Plant with SPRING permit, line (5000 preforms accepted), VALIDATED run, RELEASED lot (planned/produced 100)"
            - "b1 FILLED from the lot; b2 delivered (WITH_CUSTOMER) from the lot; b3 registered and never filled"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant TC2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-TC2", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/validate", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 5000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 5000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv3: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv3}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /api/production-lots/${lot}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/production-lots/${lot}/complete", payload: { produced_units: 100 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "GET /api/lab-tests?subject_lot_id=${lot}&test_type=FINISHED_PRODUCT", as: QAOfficer, captures: { fptest: "$.data[0].id" } }
            - { call: "POST /api/lab-tests/${fptest}/record-result", payload: { result: "PASS", collected_at: "2026-08-04T13:00:00Z" }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/production-lots/${lot}/release", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-R1" }, as: SanitationLead, captures: { b1: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-R2" }, as: SanitationLead, captures: { b2: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-R3" }, as: SanitationLead, captures: { b3: $.data.id } }
            - { call: "POST /api/bottles/${b1}/fill", payload: { lot_id: "${lot}" }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/bottles/${b2}/fill", payload: { lot_id: "${lot}" }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/bottles/${b2}/deliver", as: SanitationLead, as_user_id: "sl-1" }
          trigger:
            - { call: "POST /api/plants/${plant}/recalls", payload: { reason: "micro positive", lot_ids: ["${lot}"] }, as: ComplianceOfficer, captures: { rec: $.data.id, scope: $.data.units_in_scope, recovered: $.data.units_recovered, rec_status: $.data.status } }
            - { call: "GET /api/production-lots/${lot}", as: ComplianceOfficer, captures: { lot_status: $.data.status, lot_recall: $.data.recall_id } }
            - { call: "GET /api/bottles/${b1}", as: SanitationLead, captures: { b1_status: $.data.status } }
            - { call: "GET /api/bottles/${b2}", as: SanitationLead, captures: { b2_status: $.data.status } }
            - { call: "GET /api/bottles/${b3}", as: SanitationLead, captures: { b3_status: $.data.status } }
            - { call: "GET /api/plants/${plant}", as: PlantAdmin, captures: { posture: $.data.compliance_posture } }
          assert:
            - "${rec_status} == INITIATED"
            - "${scope} == 100"
            - "${recovered} == 0"
            - "${lot_status} == RECALLED"
            - "${lot_recall} == ${rec}"
            - "${b1_status} == QUARANTINED (hop 3: caused by the lot becoming RECALLED)"
            - "${b2_status} == QUARANTINED"
            - "${b3_status} == SANITIZED (never filled from the recalled lot — untouched)"
            - "${posture} == BREACH"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_permit_state_beats_daily_cap
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - calculations.permit_withdrawal_remaining
        distinguishing_aspect: |
          Error-category pair state vs business_constraint: the request violates BOTH
          ERR_PERMIT_NOT_ACTIVE (priority 5) and ERR_DAILY_CAP_EXCEEDED (priority 9 — the daily
          provisional total already equals the 1000-gallon cap); the state error must win.
        test_recipe:
          setup:
            - "Plant with SPRING permit, daily_cap 1000, monthly_cap 30000"
            - "One RECORDED event of 1000 gallons on 2026-08-01 (provisional daily total == cap exactly)"
            - "Permit manually suspended by the ComplianceOfficer"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant PP1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-PP1", source_classification: "SPRING", daily_cap_gallons: 1000, monthly_cap_gallons: 30000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 1000, meter_reading_start_gallons: 0, meter_reading_end_gallons: 1000, expected_permit_version: "${pv}" }, as: SourceMonitor }
            - { call: "POST /api/permits/${perm}/suspend", as: ComplianceOfficer }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv3: $.data.version, p_status: $.data.status } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 1, meter_reading_start_gallons: 1000, meter_reading_end_gallons: 1001, expected_permit_version: "${pv3}" }, as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "${p_status} == SUSPENDED"
            - "${err} == ERR_PERMIT_NOT_ACTIVE (priority 5 state beats priority 9 business_constraint; the OCC check at priority 4 passed because the version was fresh)"

      - name: sanitation_pending_safety_beats_cross_plant_referential
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.ReturnableBottle.SANITIZED_to_FILLED
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential (a different pair than
          state-vs-constraint): the fill violates BOTH ERR_SANITATION_TEST_PENDING (priority 6 — the
          bottle's last wash batch has no COMPLETED_PASS micro test) and ERR_CROSS_PLANT_REFERENCE
          (priority 8 — the lot belongs to a different plant); the safety error must win.
        test_recipe:
          setup:
            - "Plant A: SPRING permit, line (2000 preforms accepted), VALIDATED run, RELEASED lot A"
            - "Plant A bottle b washed once (batch PASSED) so last_wash_batch_id is set; its AUTO BOTTLE_SANITATION test is still SCHEDULED (never resulted)"
            - "Plant B: fully independent second plant with its own RELEASED lot B"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant PP2-A" }, as: PlantAdmin, captures: { plantA: $.data.id } }
            - { call: "POST /api/plants/${plantA}/permits", payload: { permit_number: "SP-PP2A", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { permA: $.data.id } }
            - { call: "POST /api/plants/${plantA}/bottling-lines", payload: { line_code: "LINE-A", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { lineA: $.data.id, lvA: $.data.version } }
            - { call: "POST /api/plants/${plantA}/treatment-runs", payload: { source_permit_id: "${permA}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { runA: $.data.id } }
            - { call: "POST /api/treatment-runs/${runA}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${runA}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${runA}/validate", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/bottling-lines/${lineA}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 2000, expected_line_version: "${lvA}" }, as: ProductionLead, as_user_id: "pl-1", captures: { delA: $.data.id } }
            - { call: "POST /api/preform-deliveries/${delA}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 2000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "GET /api/bottling-lines/${lineA}", as: ProductionLead, captures: { lvA3: $.data.version } }
            - { call: "POST /api/bottling-lines/${lineA}/production-lots", payload: { treatment_run_id: "${runA}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lvA3}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lotA: $.data.id } }
            - { call: "POST /api/production-lots/${lotA}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/production-lots/${lotA}/complete", payload: { produced_units: 100 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "GET /api/lab-tests?subject_lot_id=${lotA}&test_type=FINISHED_PRODUCT", as: QAOfficer, captures: { fptestA: "$.data[0].id" } }
            - { call: "POST /api/lab-tests/${fptestA}/record-result", payload: { result: "PASS", collected_at: "2026-08-04T13:00:00Z" }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/production-lots/${lotA}/release", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plantA}/bottles", payload: { bottle_code: "B-PP2" }, as: SanitationLead, captures: { b: $.data.id } }
            - { call: "POST /api/bottles/${b}/fill", payload: { lot_id: "${lotA}" }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/bottles/${b}/deliver", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/bottles/${b}/return", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/plants/${plantA}/wash-batches", payload: { washer_unit: "WASHER_A", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: SanitationLead, captures: { batchA: $.data.id } }
            - { call: "POST /api/wash-batches/${batchA}/assign-bottles", payload: { bottle_ids: ["${b}"] }, as: SanitationLead }
            - { call: "POST /api/wash-batches/${batchA}/start", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/wash-batches/${batchA}/complete", payload: { rinse_temp_c: 71.1, sanitizer_ppm: 50.0 }, as: SanitationLead, as_user_id: "sl-1", captures: { batchA_status: $.data.status } }
            - { call: "POST /api/plants", payload: { name: "Plant PP2-B" }, as: PlantAdmin, captures: { plantB: $.data.id } }
            - { call: "POST /api/plants/${plantB}/permits", payload: { permit_number: "SP-PP2B", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { permB: $.data.id } }
            - { call: "POST /api/plants/${plantB}/bottling-lines", payload: { line_code: "LINE-B", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { lineB: $.data.id, lvB: $.data.version } }
            - { call: "POST /api/plants/${plantB}/treatment-runs", payload: { source_permit_id: "${permB}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { runB: $.data.id } }
            - { call: "POST /api/treatment-runs/${runB}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${runB}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${runB}/validate", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/bottling-lines/${lineB}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 2000, expected_line_version: "${lvB}" }, as: ProductionLead, as_user_id: "pl-1", captures: { delB: $.data.id } }
            - { call: "POST /api/preform-deliveries/${delB}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 2000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "GET /api/bottling-lines/${lineB}", as: ProductionLead, captures: { lvB3: $.data.version } }
            - { call: "POST /api/bottling-lines/${lineB}/production-lots", payload: { treatment_run_id: "${runB}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lvB3}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lotB: $.data.id } }
            - { call: "POST /api/production-lots/${lotB}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/production-lots/${lotB}/complete", payload: { produced_units: 100 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "GET /api/lab-tests?subject_lot_id=${lotB}&test_type=FINISHED_PRODUCT", as: QAOfficer, captures: { fptestB: "$.data[0].id" } }
            - { call: "POST /api/lab-tests/${fptestB}/record-result", payload: { result: "PASS", collected_at: "2026-08-04T13:00:00Z" }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/production-lots/${lotB}/release", as: QAOfficer, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /api/bottles/${b}/fill", payload: { lot_id: "${lotB}" }, as: ProductionLead, as_user_id: "pl-1", captures: { err: $.data.error_id } }
          assert:
            - "${batchA_status} == PASSED (bottle is SANITIZED with last_wash_batch_id set)"
            - "${err} == ERR_SANITATION_TEST_PENDING (priority 6 business_safety beats priority 8 business_referential cross-plant check)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: daily_cap_exact_gallon_boundary
        grounds:
          - calculations.permit_withdrawal_remaining
          - errors[ERR_DAILY_CAP_EXCEEDED]
        distinguishing_aspect: |
          Metric: integer gallons on POST /api/permits/{permitId}/withdrawal-events. A posting that
          brings the provisional daily total to EXACTLY daily_cap_gallons (6000 + 4000 == 10000)
          succeeds; a further 1-gallon posting is rejected — equality is allowed, cap+1 is not.
        test_recipe:
          setup:
            - "Plant with SPRING permit, daily_cap 10000, monthly_cap 200000"
            - "Clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant BP1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-BP1", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 6000, meter_reading_start_gallons: 0, meter_reading_end_gallons: 6000, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { e1: $.data.id } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 4000, meter_reading_start_gallons: 6000, meter_reading_end_gallons: 10000, expected_permit_version: "${pv2}" }, as: SourceMonitor, captures: { e2: $.data.id } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv3: $.data.version, today: $.data.withdrawn_today_provisional_gallons } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 1, meter_reading_start_gallons: 10000, meter_reading_end_gallons: 10001, expected_permit_version: "${pv3}" }, as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "WithdrawalEvent.${e2}.status == RECORDED (total == cap exactly is accepted)"
            - "${today} == 10000"
            - "${err} == ERR_DAILY_CAP_EXCEEDED (one gallon over the cap is rejected)"

      - name: bottle_cycle_limit_149_150_boundary
        grounds:
          - state_machines.ReturnableBottle.RETURNED_DIRTY_to_IN_WASH
          - errors[ERR_BOTTLE_CYCLE_LIMIT]
          - entities.ReturnableBottle.fields.wash_cycle_count
        distinguishing_aspect: |
          Metric: integer wash_cycle_count on POST /api/wash-batches/{id}/assign-bottles (a different
          metric and endpoint than the gallon cap). A bottle at count 149 (< MAX_WASH_CYCLES 150) is
          accepted into the batch; a bottle at exactly 150 is rejected and must be retired.
        test_recipe:
          setup:
            - "Plant with SPRING permit, line (2000 preforms accepted), VALIDATED run, RELEASED lot"
            - "b_lo RETURNED_DIRTY with wash_cycle_count 149; b_hi RETURNED_DIRTY with wash_cycle_count 150 (counts set via the declared test-driving injection endpoint)"
            - "One SCHEDULED wash batch on WASHER_A"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant BP2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-BP2", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/validate", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 2000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 2000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv3: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv3}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /api/production-lots/${lot}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/production-lots/${lot}/complete", payload: { produced_units: 100 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "GET /api/lab-tests?subject_lot_id=${lot}&test_type=FINISHED_PRODUCT", as: QAOfficer, captures: { fptest: "$.data[0].id" } }
            - { call: "POST /api/lab-tests/${fptest}/record-result", payload: { result: "PASS", collected_at: "2026-08-04T13:00:00Z" }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/production-lots/${lot}/release", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-LO" }, as: SanitationLead, captures: { b_lo: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-HI" }, as: SanitationLead, captures: { b_hi: $.data.id } }
            - { call: "POST /api/bottles/${b_lo}/fill", payload: { lot_id: "${lot}" }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/bottles/${b_lo}/deliver", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/bottles/${b_lo}/return", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/bottles/${b_hi}/fill", payload: { lot_id: "${lot}" }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/bottles/${b_hi}/deliver", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/bottles/${b_hi}/return", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/_inject/bottle-wash-cycles", payload: { bottle_id: "${b_lo}", wash_cycle_count: 149 }, as: PlantAdmin, captures: { lo_count: $.data.wash_cycle_count } }
            - { call: "POST /api/_inject/bottle-wash-cycles", payload: { bottle_id: "${b_hi}", wash_cycle_count: 150 }, as: PlantAdmin, captures: { hi_count: $.data.wash_cycle_count } }
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_A", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: SanitationLead, captures: { batch: $.data.id } }
          trigger:
            - { call: "POST /api/wash-batches/${batch}/assign-bottles", payload: { bottle_ids: ["${b_lo}"] }, as: SanitationLead, captures: { bc: $.data.bottle_count } }
            - { call: "POST /api/wash-batches/${batch}/assign-bottles", payload: { bottle_ids: ["${b_hi}"] }, as: SanitationLead, captures: { err: $.data.error_id } }
          assert:
            - "${lo_count} == 149"
            - "${hi_count} == 150"
            - "${bc} == 1 (the 149-cycle bottle was accepted)"
            - "Bottle.${b_lo}.status == IN_WASH"
            - "${err} == ERR_BOTTLE_CYCLE_LIMIT (150 >= MAX_WASH_CYCLES 150)"
            - "Bottle.${b_hi}.status == RETURNED_DIRTY (rejected bottle unchanged)"
  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lot_release_requires_validated_treatment_run
        grounds:
          - state_machines.ProductionLot.QA_HOLD_to_RELEASED
          - state_machines.TreatmentRun.IN_PROGRESS_to_VALIDATED
          - errors[ERR_TREATMENT_NOT_VALIDATED]
        distinguishing_aspect: |
          Entity pair ProductionLot -> TreatmentRun: a lot may be created against a non-terminal
          (SCHEDULED) run, but its QA_HOLD -> RELEASED transition is guarded by the RUN's state —
          release fails with ERR_TREATMENT_NOT_VALIDATED while the run is SCHEDULED and succeeds
          after the run is driven to VALIDATED, with no change to the lot itself in between.
        test_recipe:
          setup:
            - "Plant with SPRING permit, line (2000 preforms accepted), treatment run left SCHEDULED (never started/validated)"
            - "Lot referencing the run, started and completed by pl-1 (planned 500, produced 500); AUTO FINISHED_PRODUCT test recorded PASS"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CE1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CE1", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 2000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 2000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv3: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 500, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv3}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /api/production-lots/${lot}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/production-lots/${lot}/complete", payload: { produced_units: 500 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "GET /api/lab-tests?subject_lot_id=${lot}&test_type=FINISHED_PRODUCT", as: QAOfficer, captures: { fptest: "$.data[0].id" } }
            - { call: "POST /api/lab-tests/${fptest}/record-result", payload: { result: "PASS", collected_at: "2026-08-04T13:00:00Z" }, as: QAOfficer, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /api/production-lots/${lot}/release", as: QAOfficer, as_user_id: "qa-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/validate", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/production-lots/${lot}/release", as: QAOfficer, as_user_id: "qa-1", captures: { lot_status: $.data.status, rel_by: $.data.released_by_user_id } }
          assert:
            - "${err} == ERR_TREATMENT_NOT_VALIDATED (run was SCHEDULED; the lot's own state QA_HOLD was fine)"
            - "${lot_status} == RELEASED (same lot, unchanged except for the run now being VALIDATED)"
            - "${rel_by} == qa-1"

      - name: report_publish_requires_finalized_withdrawals
        grounds:
          - state_machines.CommunityWaterReport.DRAFT_to_PUBLISHED
          - state_machines.WithdrawalEvent.RECORDED_to_FINALIZED
          - errors[ERR_UNFINALIZED_WITHDRAWALS]
          - calculations.community_report_volumes
        distinguishing_aspect: |
          Entity pair CommunityWaterReport -> WithdrawalEvent (a different pair than Lot->Run): the
          report's DRAFT -> PUBLISHED transition is guarded by the states of the period's withdrawal
          events — publish fails while a RECORDED event exists in the period, then succeeds after a
          compliance run finalizes it, and the publish-time recompute yields 7500 gallons / 0.023
          acre-feet (round_half_up(7500/325851, 3)).
        test_recipe:
          setup:
            - "Plant with SPRING permit (caps 10000/200000)"
            - "One RECORDED event of 7500 gallons dated 2026-08-01 (clock at default 2026-08-01, so a compliance run at this clock does NOT finalize it: finalization requires withdrawal_date < current date)"
            - "DRAFT report for (2026, 8) — totals 0 at creation because no FINALIZED events exist"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CE2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CE2", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 7500, meter_reading_start_gallons: 0, meter_reading_end_gallons: 7500, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { ev: $.data.id } }
            - { call: "POST /api/plants/${plant}/community-reports", payload: { period_year: 2026, period_month: 8 }, as: ComplianceOfficer, captures: { rep: $.data.id, tot0: $.data.total_withdrawn_gallons } }
          trigger:
            - { call: "POST /api/community-reports/${rep}/publish", as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin, captures: { finalized: $.data.events_finalized } }
            - { call: "POST /api/community-reports/${rep}/publish", as: ComplianceOfficer, captures: { r_status: $.data.status, tot: $.data.total_withdrawn_gallons, af: $.data.total_acre_feet } }
          assert:
            - "${tot0} == 0 (creation-time snapshot: RECORDED events are excluded)"
            - "${err} == ERR_UNFINALIZED_WITHDRAWALS"
            - "${finalized} == 1"
            - "${r_status} == PUBLISHED"
            - "${tot} == 7500 (recomputed at publish)"
            - "${af} == 0.023"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_window_half_open_adjacency_vs_overlap
        grounds:
          - errors[ERR_LINE_WINDOW_CONFLICT]
          - entities.ProductionLot.fields.scheduled_start
          - entities.ProductionLot.fields.scheduled_end
        distinguishing_aspect: |
          Resource: BottlingLine; interval semantics: half-open [start, end) with adjacency allowed.
          Lot2 starting exactly when lot1 ends (12:00 == 12:00) is accepted, while lot3 straddling
          lot2's start (11:00-13:00 vs 12:00-14:00) is rejected — same resource, boundary-exact
          geometry, no buffer term.
        test_recipe:
          setup:
            - "Plant with SPRING permit; line with 1000 preforms accepted"
            - "Three SCHEDULED runs R1/R2/R3 (lots reserve runs 1:1)"
            - "lot1 booked 10:00-12:00 on the line"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant TO1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-TO1", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 1000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 1000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-10T06:00:00Z", scheduled_end: "2026-08-10T08:00:00Z" }, as: ProductionLead, captures: { r1: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }, as: ProductionLead, captures: { r2: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: ProductionLead, captures: { r3: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lvA: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${r1}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", expected_line_version: "${lvA}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot1: $.data.id } }
          trigger:
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lvB: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${r2}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-10T12:00:00Z", scheduled_end: "2026-08-10T14:00:00Z", expected_line_version: "${lvB}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot2: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lvC: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${r3}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-10T11:00:00Z", scheduled_end: "2026-08-10T13:00:00Z", expected_line_version: "${lvC}" }, as: ProductionLead, as_user_id: "pl-1", captures: { err: $.data.error_id } }
          assert:
            - "ProductionLot.${lot2}.status == PLANNED (adjacency 12:00 == 12:00 is allowed under half-open semantics)"
            - "${err} == ERR_LINE_WINDOW_CONFLICT (11:00-13:00 overlaps both lot1 and lot2)"
            - "Line preform_reserved_units == 200 after the two successful reservations"

      - name: washer_purge_buffer_thirty_minute_semantics
        grounds:
          - errors[ERR_WASHER_WINDOW_CONFLICT]
          - errors[ERR_WASHER_PURGE_BUFFER]
          - entities.WashBatch.fields.washer_unit
        distinguishing_aspect: |
          Resource: washer_unit on WashBatch (a different resource entity than BottlingLine);
          interval semantics differ from the line rule: adjacency alone is NOT sufficient — a
          mandatory 30-minute purge buffer applies, so [10:00, 11:00) after [09:00, 10:00) is
          rejected (buffer), [10:15, 11:00) is rejected (15 < 30 minutes), and [10:30, 11:30) is
          accepted (exactly 30 minutes satisfies the buffer). An overlapping window on the OTHER
          washer is unconstrained.
        test_recipe:
          setup:
            - "Plant only (wash batches need no other fixtures)"
            - "batch1 booked on WASHER_A 09:00-10:00"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant TO2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_A", scheduled_start: "2026-08-06T09:00:00Z", scheduled_end: "2026-08-06T10:00:00Z" }, as: SanitationLead, captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_A", scheduled_start: "2026-08-06T10:00:00Z", scheduled_end: "2026-08-06T11:00:00Z" }, as: SanitationLead, captures: { err2: $.data.error_id } }
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_A", scheduled_start: "2026-08-06T10:15:00Z", scheduled_end: "2026-08-06T11:00:00Z" }, as: SanitationLead, captures: { err3: $.data.error_id } }
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_A", scheduled_start: "2026-08-06T10:30:00Z", scheduled_end: "2026-08-06T11:30:00Z" }, as: SanitationLead, captures: { w4: $.data.id, w4_status: $.data.status } }
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_B", scheduled_start: "2026-08-06T09:30:00Z", scheduled_end: "2026-08-06T10:15:00Z" }, as: SanitationLead, captures: { w5: $.data.id, w5_status: $.data.status } }
          assert:
            - "${err2} == ERR_WASHER_PURGE_BUFFER (adjacent but 0 < 30 minutes of purge)"
            - "${err3} == ERR_WASHER_PURGE_BUFFER (15 < 30 minutes of purge)"
            - "${w4_status} == SCHEDULED (exactly 30 minutes of purge satisfies the rule)"
            - "${w5_status} == SCHEDULED (WASHER_B is a different resource; time overlap irrelevant)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: preform_reservation_create_cancel_conservation
        grounds:
          - entities.BottlingLine.fields.preform_reserved_units
          - state_machines.ProductionLot.PLANNED_to_CANCELLED
          - calculations.preform_reorder_projection
        distinguishing_aspect: |
          Conserved quantity: preform packaging units on the line. Invariant:
          preform_reserved_units == sum(planned_units) over lots IN {PLANNED, IN_PRODUCTION} and
          preform_on_hand_units is untouched by reservation. The forward action (lot create, +2000
          reserved) paired with its compensating action (lot cancel, -2000) leaves reserved, free,
          and on-hand exactly at their pre-pair values (0 / 5000 / 5000).
        test_recipe:
          setup:
            - "Plant with SPRING permit; line with 5000 preforms delivered and QC-accepted"
            - "One SCHEDULED run available for the lot"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CI1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CI1", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 5000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 5000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-10T06:00:00Z", scheduled_end: "2026-08-10T08:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { on0: $.data.preform_on_hand_units, res0: $.data.preform_reserved_units, free0: $.data.preform_free_units, lv3: $.data.version } }
          trigger:
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 2000, scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", expected_line_version: "${lv3}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { on1: $.data.preform_on_hand_units, res1: $.data.preform_reserved_units, free1: $.data.preform_free_units } }
            - { call: "POST /api/production-lots/${lot}/cancel", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { on2: $.data.preform_on_hand_units, res2: $.data.preform_reserved_units, free2: $.data.preform_free_units } }
          assert:
            - "${on0} == 5000 and ${res0} == 0 and ${free0} == 5000 (baseline before the pair)"
            - "${on1} == 5000 and ${res1} == 2000 and ${free1} == 3000 (forward action: reservation only, on-hand untouched)"
            - "${on2} == 5000 and ${res2} == 0 and ${free2} == 5000 (compensating cancel restores the exact baseline — zero drift)"
            - "ProductionLot.${lot}.status == CANCELLED"

      - name: withdrawal_record_void_gallons_conservation
        grounds:
          - entities.WaterSourcePermit.fields.withdrawn_month_provisional_gallons
          - state_machines.WithdrawalEvent.RECORDED_to_VOIDED
          - calculations.permit_withdrawal_remaining
        distinguishing_aspect: |
          Conserved quantity: volumetric gallons on the permit (a different quantity than preform
          packaging units). Invariant: withdrawn_month_provisional_gallons == sum(gallons) over
          events IN {RECORDED, FINALIZED} in the current month. The forward action (record 4000)
          paired with its compensating action (void the same event) leaves both the provisional and
          certified monthly aggregates exactly at their pre-pair baseline (0), while the permit
          version still advances (1 -> 3) — conservation of the quantity, not of the version.
        test_recipe:
          setup:
            - "Plant with SPRING permit (caps 10000/200000); clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CI2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CI2", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { prov0: $.data.withdrawn_month_provisional_gallons, cert0: $.data.withdrawn_month_certified_gallons } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 4000, meter_reading_start_gallons: 0, meter_reading_end_gallons: 4000, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { ev: $.data.id } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { prov1: $.data.withdrawn_month_provisional_gallons } }
            - { call: "POST /api/withdrawal-events/${ev}/void", as: SourceMonitor, captures: { ev_status: $.data.status } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { prov2: $.data.withdrawn_month_provisional_gallons, cert2: $.data.withdrawn_month_certified_gallons, pv3: $.data.version } }
          assert:
            - "${prov0} == 0 and ${cert0} == 0 (baseline)"
            - "${prov1} == 4000 (forward action)"
            - "${ev_status} == VOIDED"
            - "${prov2} == 0 and ${cert2} == 0 (compensating void restores the exact baseline — zero drift)"
            - "${pv3} == 3 (version advances on every mutation even though the quantity is conserved)"
