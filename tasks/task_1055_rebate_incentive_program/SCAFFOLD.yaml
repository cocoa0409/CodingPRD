scenario: "1055. Rebate & Incentive-Program Administration: program & offer/rules, claim/receipt submission & validation, eligibility & dedupe, payout (check/virtual-card) & escheat, budget & accrual, fraud, channel (dealer/consumer), reporting"
domain_name: "rebate-incentive-program"
api_prefix: "/api"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; only Receipt is addressed as a
  # sub-resource of Claim. No deep nesting in URL paths.

  state_machine_shape: parallel
  # Claim carries two independent state dimensions (adjudication_status x
  # payment_status). FraudCase is cyclic; Payout has a reissue cycle; Offer has a
  # suspend/republish cycle; Program toggles between ACTIVE and BUDGET_LOCKED.

  relationship_patterns:
    - one_to_many          # Program -> Offer, Claim -> Receipt, Claim -> Payout
    - cross_aggregate      # BudgetEntry references both Program and Claim
    - polymorphic          # Payout materialises either a check or a VirtualCard

  role_model: segregation_of_duties
  # The operator id that approved a Claim may not release that Claim's Payout.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Global constants (every symbol referenced by any formula, precondition or
# validation in this scaffold is declared here with a concrete value).
# ---------------------------------------------------------------------------
constants:
  DEFAULT_CLOCK_UTC: "2026-07-01T00:00:00Z"

  # Claim eligibility windows
  CLAIM_WINDOW_DAYS: 90            # purchase_date -> submit, inclusive
  OFFER_GRACE_DAYS: 15             # submits accepted after offer close, inclusive
  DEDUPE_WINDOW_DAYS: 365          # same serial_number collision window, inclusive
  MAX_CLAIMS_PER_CLAIMANT_PER_OFFER: 3
  RECEIPT_MAX_LINES: 20
  APPEAL_WINDOW_DAYS: 30
  MAX_APPEALS_PER_CLAIM: 2

  # Rebate rate table
  DEALER_TIER_1_MAX_UNITS: 9
  DEALER_TIER_2_MAX_UNITS: 49
  DEALER_TIER_1_PCT: 0.05
  DEALER_TIER_2_PCT: 0.08
  DEALER_TIER_3_PCT: 0.12
  CONSUMER_REBATE_PCT: 0.10
  CONSUMER_FLAT_BONUS_CENTS: 500

  # Budget & accrual
  RESERVE_FACTOR: 0.15
  BUDGET_WARN_PCT: 0.8000
  BUDGET_HARD_PCT: 1.0000

  # Payout
  CHECK_FEE_CENTS: 150
  CARD_FEE_CENTS: 50
  CARD_METHOD_MIN_CENTS: 2500
  PAYOUT_MIN_CENTS: 100

  # Escheat / dormancy
  ESCHEAT_DORMANCY_DAYS: 180       # CHECK payouts
  CARD_DORMANCY_DAYS: 90           # VIRTUAL_CARD payouts
  VIRTUAL_CARD_VALID_DAYS: 365

  # Fraud scoring
  FRAUD_SCORE_MIN: 0
  FRAUD_SCORE_MAX: 100
  FRAUD_SCORE_THRESHOLD: 70
  W_DENIED: 15
  W_DUPLICATE: 25
  W_VELOCITY: 10
  W_HIGH_VALUE: 20
  VELOCITY_FREE_CLAIMS: 2
  VELOCITY_WINDOW_DAYS: 30
  HIGH_VALUE_CLAIM_CENTS: 50000
  SUBSTANTIATION_MULTIPLIER: 1.5
  CLEARANCE_CREDIT: 30

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Program display name"
      - name: fiscal_year
        type: integer
        source: input
        description: "Fiscal year the budget belongs to"
      - name: escheat_jurisdiction
        type: string
        source: input
        description: "Two-letter state code used as the default escheat jurisdiction"
      - name: budget_total_cents
        type: integer
        source: input
        description: "Authorised program budget in cents"
        constraints: "must be > 0; mutated only by POST /api/programs/{id}/budget-adjustments"
      - name: committed_cents
        type: integer
        source: computed
        description: "sum(BudgetEntry.amount_cents where entry_type == COMMIT) - sum(RELEASE) - sum(ESCHEAT_REVERSAL) for this program"
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: "sum(BudgetEntry.amount_cents where entry_type == PAYMENT and the entry's Claim has payment_status IN {PAID, ESCHEATED}) for this program"
        default: 0
      - name: escheat_recovered_cents
        type: integer
        source: computed
        description: "sum(BudgetEntry.amount_cents where entry_type == ESCHEAT_REVERSAL) for this program"
        default: 0
      - name: pending_provisional_cents
        type: integer
        source: computed
        description: "sum(Claim.provisional_rebate_cents) over Claims whose Offer.program_id == this program and adjudication_status IN {SUBMITTED, UNDER_REVIEW, HELD}"
        default: 0
      - name: reserve_cents
        type: integer
        source: computed
        description: "Accrual reserve; see calculations.program_budget_position"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "budget_total_cents - committed_cents - reserve_cents"
      - name: utilization_pct
        type: number
        source: computed
        description: "(committed_cents + reserve_cents) / budget_total_cents, round_half_up to 4 decimal places"
        default: 0.0
      - name: status
        type: enum
        source: system
        description: "Program lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, BUDGET_LOCKED, CLOSED}"

  - name: Offer
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program that funds this offer"
      - name: name
        type: string
        source: input
        description: "Offer display name"
      - name: channel
        type: enum
        source: input
        description: "Claimant channel this offer is open to"
        constraints: "one of {DEALER, CONSUMER, BOTH}"
      - name: sku_scope
        type: string
        source: input
        description: "SKU family this offer covers; part of the offer-window uniqueness key"
      - name: effective_start_date
        type: datetime
        source: input
        description: "Inclusive start of the offer window (half-open interval start)"
      - name: effective_end_date
        type: datetime
        source: input
        description: "Exclusive end of the offer window (half-open interval end)"
        constraints: "must be strictly after effective_start_date"
      - name: max_rebate_cents_per_claim
        type: integer
        source: input
        description: "Per-claim cap applied to both rebate variants"
        constraints: "must be > 0"
      - name: dealer_tier_enabled
        type: boolean
        source: input
        description: "When false, DEALER claims use DEALER_TIER_1_PCT regardless of unit count"
        default: true
      - name: status
        type: enum
        source: system
        description: "Offer lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUSPENDED, CLOSED}"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the offer moved to CLOSED; anchors OFFER_GRACE_DAYS"
        default: null
      - name: active_claim_count
        type: integer
        source: computed
        description: "count of Claims on this offer with adjudication_status IN {SUBMITTED, UNDER_REVIEW, HELD, APPROVED}"
        default: 0

  - name: Claimant
    parent: null
    common_fields: true
    fields:
      - name: type
        type: enum
        source: input
        description: "Channel the claimant belongs to"
        constraints: "one of {DEALER, CONSUMER}"
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the dealer or consumer"
      - name: email
        type: string
        source: input
        description: "Contact email"
      - name: mailing_state
        type: string
        source: input
        description: "Two-letter state code; copied to EscheatRecord.jurisdiction"
      - name: status
        type: enum
        source: system
        description: "Claimant standing"
        default: ACTIVE
        constraints: "one of {ACTIVE, BLOCKED}"
      - name: fraud_score
        type: integer
        source: computed
        description: "Latest fraud score; see calculations.claimant_fraud_score"
        default: 0
      - name: duplicate_attempt_count
        type: integer
        source: computed
        description: "Number of submit attempts rejected with ERR_DUPLICATE_RECEIPT_SERIAL"
        default: 0
      - name: denied_claim_count
        type: integer
        source: computed
        description: "count of this claimant's Claims with adjudication_status == DENIED"
        default: 0
      - name: open_claim_count
        type: integer
        source: computed
        description: "count of this claimant's Claims with adjudication_status IN {SUBMITTED, UNDER_REVIEW, HELD}"
        default: 0

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; the offer being claimed against"
      - name: claimant_id
        type: string
        source: input
        description: "FK -> Claimant.id; the dealer or consumer submitting the claim"
      - name: adjudication_status
        type: enum
        source: system
        description: "Adjudication dimension of the parallel state machine"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, HELD, APPROVED, DENIED, REVOKED, WITHDRAWN, VOIDED}"
      - name: payment_status
        type: enum
        source: system
        description: "Payment dimension of the parallel state machine; evolves independently of adjudication_status"
        default: NONE
        constraints: "one of {NONE, SCHEDULED, PAID, ESCHEATED}"
      - name: total_units
        type: integer
        source: computed
        description: "sum(line.quantity) over the receipts included by the currently applicable rebate variant"
        default: 0
      - name: provisional_rebate_cents
        type: integer
        source: computed
        description: "Provisional variant of calculations.claim_rebate_amount, stamped at submit"
        default: 0
      - name: final_rebate_cents
        type: integer
        source: computed
        description: "Final variant of calculations.claim_rebate_amount, stamped at approve"
        default: null
      - name: fraud_score_at_submit
        type: integer
        source: computed
        description: "Value of calculations.claimant_fraud_score variant heuristic_realtime at submit time"
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the DRAFT -> SUBMITTED transition"
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant of the UNDER_REVIEW -> APPROVED transition"
        default: null
      - name: denied_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into DENIED; anchors APPEAL_WINDOW_DAYS"
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClaimsProcessor that approved the claim; segregation-of-duties key"
        default: null
      - name: denial_reason_code
        type: string
        source: system
        description: "Reason code supplied on the most recent deny"
        default: null
      - name: appeal_count
        type: integer
        source: system
        description: "Number of successful appeals taken on this claim"
        default: 0

  - name: Receipt
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim this proof-of-purchase belongs to"
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial number printed on the receipt; dedupe key"
      - name: purchase_date
        type: datetime
        source: input
        description: "Instant of purchase; drives the offer-window and CLAIM_WINDOW_DAYS checks"
      - name: retailer_name
        type: string
        source: input
        description: "Retailer that issued the receipt"
      - name: lines
        type: array
        source: input
        description: "Array of objects with keys sku (string), quantity (integer > 0), unit_price_cents (integer > 0)"
        constraints: "1 .. RECEIPT_MAX_LINES entries; evaluation order is the submitted array order"
      - name: line_count
        type: integer
        source: computed
        description: "len(lines)"
      - name: units
        type: integer
        source: computed
        description: "sum(line.quantity for line in lines)"
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "sum(line.quantity * line.unit_price_cents for line in lines)"
      - name: validated
        type: boolean
        source: system
        description: "True once a ClaimsProcessor has validated the receipt; gates inclusion in the final rebate variant"
        default: false
      - name: validated_at
        type: datetime
        source: system
        description: "Logical-clock instant of validation"
        default: null

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the approved claim being disbursed"
      - name: method
        type: enum
        source: input
        description: "Disbursement method; when omitted the server selects it per calculations.payout_net_amount"
        constraints: "one of {CHECK, VIRTUAL_CARD}"
      - name: gross_cents
        type: integer
        source: computed
        description: "Claim.final_rebate_cents at payout creation"
      - name: fee_cents
        type: integer
        source: computed
        description: "CHECK_FEE_CENTS for CHECK, CARD_FEE_CENTS for VIRTUAL_CARD"
      - name: net_cents
        type: integer
        source: computed
        description: "gross_cents - fee_cents"
      - name: status
        type: enum
        source: system
        description: "Payout lifecycle state"
        default: PENDING
        constraints: "one of {PENDING, RELEASED, REISSUE_PENDING, CLEARED, VOIDED, ESCHEATED}"
      - name: check_number
        type: string
        source: input
        description: "Check number recorded at release; only meaningful for method == CHECK"
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent release; anchors ESCHEAT_DORMANCY_DAYS"
        default: null
      - name: released_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceOfficer that released the payout"
        default: null
      - name: void_reason
        type: string
        source: input
        description: "Free-text reason recorded on void"
        default: null
      - name: reissue_count
        type: integer
        source: system
        description: "Number of times this payout has cycled through REISSUE_PENDING"
        default: 0

  - name: VirtualCard
    parent: Payout
    common_fields: true
    fields:
      - name: payout_id
        type: string
        source: input
        description: "FK -> Payout.id; the payout this card materialises"
      - name: initial_balance_cents
        type: integer
        source: computed
        description: "Payout.net_cents at issuance"
      - name: remaining_balance_cents
        type: integer
        source: computed
        description: "initial_balance_cents minus the sum of accepted spends"
      - name: status
        type: enum
        source: system
        description: "Card lifecycle state"
        default: ISSUED
        constraints: "one of {ISSUED, ACTIVATED, PARTIALLY_USED, EXHAUSTED, ESCHEATED}"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the card was issued (payout release)"
      - name: last_activity_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent activate or spend; anchors CARD_DORMANCY_DAYS"
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + VIRTUAL_CARD_VALID_DAYS days"

  - name: EscheatRecord
    parent: null
    common_fields: false
    fields:
      - name: payout_id
        type: string
        source: input
        description: "FK -> Payout.id; the dormant payout that was escheated"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the funding program"
      - name: amount_cents
        type: integer
        source: computed
        description: "Escheated amount; see calculations.escheat_transfer_amount"
      - name: jurisdiction
        type: string
        source: computed
        description: "Claimant.mailing_state of the claim's claimant, falling back to Program.escheat_jurisdiction when mailing_state is an empty string"
      - name: dormancy_days
        type: integer
        source: computed
        description: "Whole days between the dormancy anchor and the sweep instant"
      - name: swept_at
        type: datetime
        source: system
        description: "Logical-clock instant of the sweep that produced this record"

  - name: BudgetEntry
    parent: null
    common_fields: false
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program whose ledger this entry belongs to"
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim that caused the entry, null for BUDGET_ADJUSTMENT"
        default: null
      - name: entry_type
        type: enum
        source: system
        description: "Ledger entry kind"
        constraints: "one of {ACCRUAL, COMMIT, RELEASE, PAYMENT, ESCHEAT_REVERSAL, BUDGET_ADJUSTMENT}"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed amount in cents; always positive, the sign convention lives in the entry_type"
      - name: committed_after_cents
        type: integer
        source: computed
        description: "Program.committed_cents immediately after this entry was appended"
      - name: memo
        type: string
        source: input
        description: "Human-readable note"
        default: null

  - name: FraudCase
    parent: null
    common_fields: true
    fields:
      - name: claimant_id
        type: string
        source: input
        description: "FK -> Claimant.id; the claimant under investigation"
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim that triggered the case, null for analyst-opened cases"
        default: null
      - name: status
        type: enum
        source: system
        description: "Investigation state"
        default: OPEN
        constraints: "one of {OPEN, UNDER_INVESTIGATION, PENDING_INFO, SUBSTANTIATED, CLEARED}"
      - name: opened_reason
        type: string
        source: input
        description: "Why the case was opened"
      - name: opened_by
        type: enum
        source: system
        description: "SYSTEM_AUTO when the fraud threshold auto-opened the case, ANALYST when a FraudAnalyst opened it"
        constraints: "one of {SYSTEM_AUTO, ANALYST}"
      - name: heuristic_score_at_open
        type: integer
        source: computed
        description: "claimant_fraud_score variant heuristic_realtime evaluated when the case was opened"
      - name: final_score
        type: integer
        source: computed
        description: "claimant_fraud_score variant investigated_final, stamped when the case reaches SUBSTANTIATED or CLEARED"
        default: null
      - name: info_request_count
        type: integer
        source: system
        description: "Number of times the case cycled into PENDING_INFO"
        default: 0

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: [CLOSED]
    dimension: status
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/programs/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "program.status == DRAFT"
          - "program.budget_total_cents > 0"
        side_effects:
          - "recompute calculations.program_budget_position (available_cents, reserve_cents, utilization_pct)"
      - from: ACTIVE
        to: BUDGET_LOCKED
        trigger: "system: recompute of program_budget_position after a COMMIT or BUDGET_ADJUSTMENT entry"
        actor: system
        preconditions:
          - "program.status == ACTIVE"
          - "program.utilization_pct >= BUDGET_HARD_PCT"
        side_effects:
          - "cascade hop 2: every Offer of this program with status == PUBLISHED moves PUBLISHED -> SUSPENDED"
          - "cascade hop 3: for each Offer suspended by hop 2, every Claim on that offer with adjudication_status == DRAFT moves DRAFT -> VOIDED"
        note: "Auto-transition; evaluated inside the request that appended the ledger entry."
      - from: BUDGET_LOCKED
        to: ACTIVE
        trigger: "system: recompute of program_budget_position after a RELEASE, ESCHEAT_REVERSAL or BUDGET_ADJUSTMENT entry"
        actor: system
        preconditions:
          - "program.status == BUDGET_LOCKED"
          - "program.utilization_pct < BUDGET_HARD_PCT"
        side_effects:
          - "Offers suspended by the lock are NOT auto-republished; a ProgramAdmin must call POST /api/offers/{id}/publish"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/programs/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "program.status IN {ACTIVE, BUDGET_LOCKED}"
          - "no Claim funded by this program has adjudication_status IN {SUBMITTED, UNDER_REVIEW, HELD}"
        side_effects:
          - "every Offer of this program with status IN {DRAFT, PUBLISHED, SUSPENDED} moves to CLOSED and closed_at is stamped with the logical clock"
      - from: BUDGET_LOCKED
        to: CLOSED
        trigger: "POST /api/programs/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "program.status IN {ACTIVE, BUDGET_LOCKED}"
          - "no Claim funded by this program has adjudication_status IN {SUBMITTED, UNDER_REVIEW, HELD}"
        side_effects:
          - "every Offer of this program with status IN {DRAFT, PUBLISHED, SUSPENDED} moves to CLOSED and closed_at is stamped with the logical clock"

  - entity: Offer
    initial_state: DRAFT
    terminal_states: [CLOSED]
    dimension: status
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/offers/{id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "offer.status IN {DRAFT, SUSPENDED}"
          - "program.status == ACTIVE  (cross-entity: Offer depends on Program.status)"
          - "no other Offer with the same program_id, sku_scope and channel and status IN {DRAFT, PUBLISHED, SUSPENDED} overlaps this offer's half-open window"
        side_effects:
          - "offer becomes eligible as a target for POST /api/claims"
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "POST /api/offers/{id}/suspend, or system cascade hop 2 of Program ACTIVE -> BUDGET_LOCKED"
        actor: ProgramAdmin | system
        preconditions:
          - "offer.status == PUBLISHED"
        side_effects:
          - "every Claim on this offer with adjudication_status == DRAFT moves DRAFT -> VOIDED"
          - "Claims already SUBMITTED, UNDER_REVIEW or HELD are unaffected and continue to adjudicate"
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "POST /api/offers/{id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "offer.status == SUSPENDED"
          - "program.status == ACTIVE"
          - "no other Offer with the same program_id, sku_scope and channel and status IN {DRAFT, PUBLISHED, SUSPENDED} overlaps this offer's half-open window"
        side_effects:
          - "offer becomes eligible again; VOIDED claims are NOT resurrected"
        note: "Cycle: PUBLISHED -> SUSPENDED -> PUBLISHED."
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /api/offers/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "offer.status IN {DRAFT, PUBLISHED, SUSPENDED}"
        side_effects:
          - "offer.closed_at is stamped with the logical clock"
          - "submits are still accepted for OFFER_GRACE_DAYS after closed_at, inclusive"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /api/offers/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "offer.status IN {DRAFT, PUBLISHED, SUSPENDED}"
        side_effects:
          - "offer.closed_at is stamped with the logical clock"
      - from: DRAFT
        to: CLOSED
        trigger: "POST /api/offers/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "offer.status IN {DRAFT, PUBLISHED, SUSPENDED}"
        side_effects:
          - "offer.closed_at is stamped with the logical clock"

  - entity: Claimant
    initial_state: ACTIVE
    terminal_states: []
    dimension: status
    transitions:
      - from: ACTIVE
        to: BLOCKED
        trigger: "system cascade hop 1 of FraudCase -> SUBSTANTIATED"
        actor: system
        preconditions:
          - "claimant.status == ACTIVE"
        side_effects:
          - "cascade hop 2: every Claim of this claimant with adjudication_status IN {SUBMITTED, UNDER_REVIEW, HELD} moves to DENIED (denied_at stamped, denial_reason_code = 'FRAUD_SUBSTANTIATED')"
          - "cascade hop 2: every Claim of this claimant with adjudication_status == APPROVED and payment_status IN {NONE, SCHEDULED} moves APPROVED -> REVOKED"
          - "cascade hop 3: each REVOKED claim appends a BudgetEntry with entry_type == RELEASE and amount_cents == claim.final_rebate_cents, lowering Program.committed_cents, and moves any Payout of that claim with status IN {PENDING, REISSUE_PENDING} to VOIDED with payment_status reset to NONE"
      - from: BLOCKED
        to: ACTIVE
        trigger: "POST /api/claimants/{id}/reinstate"
        actor: FraudAnalyst
        preconditions:
          - "claimant.status == BLOCKED"
          - "no FraudCase of this claimant has status IN {OPEN, UNDER_INVESTIGATION, PENDING_INFO}"
        side_effects:
          - "claimant.fraud_score is reset to FRAUD_SCORE_MIN"
          - "DENIED and REVOKED claims are NOT resurrected"

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [APPROVED, REVOKED, WITHDRAWN, VOIDED]
    dimension: adjudication_status
    note: "Dimension 1 of 2. Runs independently of the payment_status dimension below; APPROVED is terminal on this axis while payment_status keeps evolving."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/claims/{id}/submit"
        actor: Dealer | Consumer
        preconditions:
          - "claim.adjudication_status == DRAFT"
          - "claimant.status == ACTIVE"
          - "offer.status == PUBLISHED, or offer.status == CLOSED and clock <= offer.closed_at + OFFER_GRACE_DAYS days"
          - "claim has at least one Receipt"
          - "every Receipt.purchase_date lies in [offer.effective_start_date, offer.effective_end_date)"
          - "for every Receipt, whole days between purchase_date and the logical clock <= CLAIM_WINDOW_DAYS"
          - "no Receipt.serial_number collides with a Receipt on another Claim per validations priority 34"
          - "count of this claimant's OTHER Claims on this offer with adjudication_status NOT IN {DRAFT, WITHDRAWN, VOIDED} is < MAX_CLAIMS_PER_CLAIMANT_PER_OFFER (the claim being submitted is not counted)"
        side_effects:
          - "claim.submitted_at stamped with the logical clock"
          - "claim.provisional_rebate_cents = calculations.claim_rebate_amount variant provisional"
          - "claim.total_units recomputed over all receipts of the claim"
          - "claim.fraud_score_at_submit = calculations.claimant_fraud_score variant heuristic_realtime; Claimant.fraud_score updated to the same value"
          - "append BudgetEntry with entry_type == ACCRUAL and amount_cents == claim.provisional_rebate_cents"
          - "Claimant.open_claim_count += 1; Offer.active_claim_count += 1"
          - "recompute Program.pending_provisional_cents and Program.reserve_cents"
      - from: SUBMITTED
        to: HELD
        trigger: "system: fraud threshold evaluated at the end of the submit request"
        actor: system
        preconditions:
          - "claim.fraud_score_at_submit >= FRAUD_SCORE_THRESHOLD"
        side_effects:
          - "a FraudCase is created with status OPEN, opened_by SYSTEM_AUTO, claimant_id = claim.claimant_id, claim_id = claim.id, heuristic_score_at_open = claim.fraud_score_at_submit, opened_reason = 'AUTO_THRESHOLD'"
        note: "Evaluated inside the same POST /api/claims/{id}/submit request; the response already shows HELD."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/claims/{id}/review"
        actor: ClaimsProcessor
        preconditions:
          - "claim.adjudication_status == SUBMITTED"
        side_effects:
          - "no counter changes; the claim stays inside the pending_provisional input set"
      - from: HELD
        to: UNDER_REVIEW
        trigger: "system cascade of FraudCase -> CLEARED"
        actor: system
        preconditions:
          - "claim.adjudication_status == HELD"
          - "the claim's triggering FraudCase reached CLEARED"
        side_effects:
          - "Claimant.fraud_score set to the case's final_score"
      - from: HELD
        to: DENIED
        trigger: "system cascade of FraudCase -> SUBSTANTIATED (via Claimant ACTIVE -> BLOCKED)"
        actor: system
        preconditions:
          - "claim.adjudication_status == HELD"
        side_effects:
          - "claim.denied_at stamped; claim.denial_reason_code = 'FRAUD_SUBSTANTIATED'"
          - "Claimant.denied_claim_count += 1; Claimant.open_claim_count -= 1; Offer.active_claim_count -= 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/claims/{id}/approve"
        actor: ClaimsProcessor
        preconditions:
          - "claim.adjudication_status == UNDER_REVIEW"
          - "claimant.status == ACTIVE"
          - "program.status == ACTIVE  (cross-entity: Claim depends on Program.status)"
          - "at least one Receipt of the claim has validated == true"
          - "calculations.claim_rebate_amount variant final <= program.available_cents evaluated with this claim excluded from pending_provisional_cents"
        side_effects:
          - "claim.final_rebate_cents = calculations.claim_rebate_amount variant final; claim.total_units recomputed over validated receipts only"
          - "claim.approved_at stamped; claim.approved_by_user_id = the request's X-User-ID"
          - "cascade hop 1: append BudgetEntry with entry_type == COMMIT and amount_cents == claim.final_rebate_cents, raising Program.committed_cents"
          - "Claimant.open_claim_count -= 1 (Offer.active_claim_count is unchanged: APPROVED is still an active status)"
          - "cascade hop 1 continued: recompute program_budget_position; when utilization_pct >= BUDGET_HARD_PCT the Program ACTIVE -> BUDGET_LOCKED transition fires (hop 2), which suspends published Offers (hop 3), which voids their DRAFT Claims (hop 4)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/claims/{id}/deny"
        actor: ClaimsProcessor
        preconditions:
          - "claim.adjudication_status == UNDER_REVIEW"
        side_effects:
          - "claim.denied_at stamped with the logical clock; claim.denial_reason_code = reason_code from the request"
          - "Claimant.denied_claim_count += 1; Claimant.open_claim_count -= 1; Offer.active_claim_count -= 1"
          - "recompute Program.pending_provisional_cents and Program.reserve_cents"
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /api/claims/{id}/appeal"
        actor: Dealer | Consumer
        preconditions:
          - "claim.adjudication_status == DENIED"
          - "claim.denial_reason_code != 'FRAUD_SUBSTANTIATED'"
          - "claimant.status == ACTIVE"
          - "whole days between claim.denied_at and the logical clock <= APPEAL_WINDOW_DAYS"
          - "claim.appeal_count < MAX_APPEALS_PER_CLAIM"
        side_effects:
          - "claim.appeal_count += 1"
          - "Claimant.denied_claim_count -= 1; Claimant.open_claim_count += 1; Offer.active_claim_count += 1"
          - "recompute Program.pending_provisional_cents and Program.reserve_cents"
        note: "Cycle: UNDER_REVIEW -> DENIED -> UNDER_REVIEW, bounded by MAX_APPEALS_PER_CLAIM."
      - from: APPROVED
        to: REVOKED
        trigger: "system cascade hop 2 of Claimant ACTIVE -> BLOCKED"
        actor: system
        preconditions:
          - "claim.adjudication_status == APPROVED"
          - "claim.payment_status IN {NONE, SCHEDULED}"
        side_effects:
          - "cascade hop 3: append BudgetEntry with entry_type == RELEASE and amount_cents == claim.final_rebate_cents, lowering Program.committed_cents"
          - "cascade hop 3: any Payout of this claim with status IN {PENDING, REISSUE_PENDING} moves to VOIDED and claim.payment_status resets to NONE"
          - "Offer.active_claim_count -= 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/claims/{id}/withdraw"
        actor: Dealer | Consumer
        preconditions:
          - "claim.adjudication_status IN {DRAFT, SUBMITTED}"
          - "the acting X-User-ID equals claim.claimant_id"
        side_effects:
          - "no counters change (a DRAFT claim was never counted)"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/claims/{id}/withdraw"
        actor: Dealer | Consumer
        preconditions:
          - "claim.adjudication_status IN {DRAFT, SUBMITTED}"
          - "the acting X-User-ID equals claim.claimant_id"
        side_effects:
          - "Claimant.open_claim_count -= 1; Offer.active_claim_count -= 1"
          - "recompute Program.pending_provisional_cents and Program.reserve_cents"
        note: "Compensating action for DRAFT -> SUBMITTED; restores both conserved counters exactly."
      - from: DRAFT
        to: VOIDED
        trigger: "system cascade of Offer PUBLISHED -> SUSPENDED"
        actor: system
        preconditions:
          - "claim.adjudication_status == DRAFT"
        side_effects:
          - "no counters change"

  - entity: Claim
    initial_state: NONE
    terminal_states: [ESCHEATED]
    dimension: payment_status
    note: "Dimension 2 of 2 on the same Claim row. Advances only through Payout transitions and never blocks or is blocked by the adjudication_status dimension."
    transitions:
      - from: NONE
        to: SCHEDULED
        trigger: "POST /api/claims/{id}/payouts"
        actor: FinanceOfficer
        preconditions:
          - "claim.adjudication_status == APPROVED"
          - "claim.payment_status == NONE"
        side_effects:
          - "a Payout is created in PENDING; claim.version increments by 1"
      - from: SCHEDULED
        to: PAID
        trigger: "POST /api/payouts/{id}/release"
        actor: FinanceOfficer
        preconditions:
          - "claim.payment_status == SCHEDULED"
        side_effects:
          - "append BudgetEntry with entry_type == PAYMENT and amount_cents == payout.net_cents, raising Program.paid_cents"
      - from: SCHEDULED
        to: NONE
        trigger: "POST /api/payouts/{id}/void"
        actor: FinanceOfficer | system
        preconditions:
          - "claim.payment_status == SCHEDULED"
        side_effects:
          - "no BudgetEntry is appended: voiding a payout does not release the commitment, the claim is still owed"
      - from: PAID
        to: NONE
        trigger: "POST /api/payouts/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "claim.payment_status == PAID"
          - "payout.status == RELEASED"
        side_effects:
          - "no new BudgetEntry is appended; Program.paid_cents is recomputed per its definition and therefore drops by payout.net_cents once claim.payment_status leaves {PAID, ESCHEATED}"
      - from: PAID
        to: ESCHEATED
        trigger: "POST /api/programs/{id}/escheat-sweep"
        actor: ProgramAdmin
        preconditions:
          - "claim.payment_status == PAID"
          - "the claim's payout is dormant per calculations.escheat_transfer_amount"
        side_effects:
          - "cascade hop 2: append BudgetEntry with entry_type == ESCHEAT_REVERSAL and amount_cents == claim.final_rebate_cents, lowering Program.committed_cents and raising Program.escheat_recovered_cents"
          - "cascade hop 3: recompute program_budget_position; when the program is BUDGET_LOCKED and utilization_pct drops below BUDGET_HARD_PCT the Program BUDGET_LOCKED -> ACTIVE transition fires"

  - entity: Payout
    initial_state: PENDING
    terminal_states: [CLEARED, ESCHEATED]
    dimension: status
    transitions:
      - from: PENDING
        to: RELEASED
        trigger: "POST /api/payouts/{id}/release"
        actor: FinanceOfficer
        preconditions:
          - "payout.status IN {PENDING, REISSUE_PENDING}"
          - "claimant.status == ACTIVE  (cross-entity: Payout depends on Claimant.status)"
          - "the request's X-User-ID != claim.approved_by_user_id"
          - "payout.net_cents >= PAYOUT_MIN_CENTS"
        side_effects:
          - "payout.released_at stamped with the logical clock; payout.released_by_user_id = X-User-ID"
          - "claim.payment_status SCHEDULED -> PAID; BudgetEntry PAYMENT appended"
          - "when payout.method == VIRTUAL_CARD a VirtualCard is created in ISSUED with initial_balance_cents == remaining_balance_cents == payout.net_cents"
      - from: REISSUE_PENDING
        to: RELEASED
        trigger: "POST /api/payouts/{id}/release"
        actor: FinanceOfficer
        preconditions:
          - "payout.status IN {PENDING, REISSUE_PENDING}"
          - "claimant.status == ACTIVE"
          - "the request's X-User-ID != claim.approved_by_user_id"
          - "payout.net_cents >= PAYOUT_MIN_CENTS"
        side_effects:
          - "payout.released_at is re-stamped, restarting the ESCHEAT_DORMANCY_DAYS clock"
        note: "Cycle: RELEASED -> REISSUE_PENDING -> RELEASED."
      - from: RELEASED
        to: REISSUE_PENDING
        trigger: "POST /api/payouts/{id}/reissue"
        actor: FinanceOfficer
        preconditions:
          - "payout.status IN {RELEASED, VOIDED}"
          - "claim.payment_status IN {PAID, NONE}"
        side_effects:
          - "payout.reissue_count += 1; payout.check_number cleared"
          - "claim.payment_status PAID -> NONE via the void path is NOT applied here; the claim stays PAID until the reissued payout is released"
      - from: VOIDED
        to: REISSUE_PENDING
        trigger: "POST /api/payouts/{id}/reissue"
        actor: FinanceOfficer
        preconditions:
          - "payout.status IN {RELEASED, VOIDED}"
          - "claim.adjudication_status == APPROVED"
        side_effects:
          - "payout.reissue_count += 1; claim.payment_status NONE -> SCHEDULED"
      - from: RELEASED
        to: CLEARED
        trigger: "POST /api/payouts/{id}/clear"
        actor: FinanceOfficer
        preconditions:
          - "payout.status == RELEASED"
          - "payout.method == CHECK"
        side_effects:
          - "payout is no longer escheatable"
      - from: PENDING
        to: VOIDED
        trigger: "POST /api/payouts/{id}/void"
        actor: FinanceOfficer | system
        preconditions:
          - "payout.status IN {PENDING, RELEASED, REISSUE_PENDING}"
        side_effects:
          - "claim.payment_status SCHEDULED -> NONE"
      - from: RELEASED
        to: VOIDED
        trigger: "POST /api/payouts/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "payout.status IN {PENDING, RELEASED, REISSUE_PENDING}"
        side_effects:
          - "claim.payment_status PAID -> NONE; Program.paid_cents lowered by payout.net_cents"
          - "any VirtualCard of this payout with status IN {ISSUED, ACTIVATED, PARTIALLY_USED} moves to ESCHEATED only through the sweep, never through void; the card is left untouched and further spends are rejected because payout.status != RELEASED"
      - from: RELEASED
        to: ESCHEATED
        trigger: "POST /api/programs/{id}/escheat-sweep"
        actor: ProgramAdmin
        preconditions:
          - "payout.status == RELEASED"
          - "dormancy per calculations.escheat_transfer_amount is satisfied"
        side_effects:
          - "cascade hop 1: an EscheatRecord is created with amount_cents from calculations.escheat_transfer_amount"
          - "cascade hop 2: claim.payment_status PAID -> ESCHEATED and BudgetEntry ESCHEAT_REVERSAL appended"
          - "any VirtualCard of this payout moves to ESCHEATED with remaining_balance_cents set to 0"

  - entity: VirtualCard
    initial_state: ISSUED
    terminal_states: [EXHAUSTED, ESCHEATED]
    dimension: status
    transitions:
      - from: ISSUED
        to: ACTIVATED
        trigger: "POST /api/virtual-cards/{id}/activate"
        actor: Dealer | Consumer
        preconditions:
          - "card.status == ISSUED"
          - "payout.status == RELEASED"
          - "the acting X-User-ID equals the claim's claimant_id"
        side_effects:
          - "card.last_activity_at stamped with the logical clock, restarting the CARD_DORMANCY_DAYS clock"
      - from: ACTIVATED
        to: PARTIALLY_USED
        trigger: "POST /api/virtual-cards/{id}/spend"
        actor: Dealer | Consumer
        preconditions:
          - "card.status IN {ACTIVATED, PARTIALLY_USED}"
          - "payout.status == RELEASED"
          - "0 < amount_cents < card.remaining_balance_cents"
        side_effects:
          - "card.remaining_balance_cents -= amount_cents; card.last_activity_at stamped"
      - from: PARTIALLY_USED
        to: PARTIALLY_USED
        trigger: "POST /api/virtual-cards/{id}/spend"
        actor: Dealer | Consumer
        preconditions:
          - "card.status IN {ACTIVATED, PARTIALLY_USED}"
          - "0 < amount_cents < card.remaining_balance_cents"
        side_effects:
          - "card.remaining_balance_cents -= amount_cents; card.last_activity_at stamped"
      - from: ACTIVATED
        to: EXHAUSTED
        trigger: "POST /api/virtual-cards/{id}/spend"
        actor: Dealer | Consumer
        preconditions:
          - "card.status IN {ACTIVATED, PARTIALLY_USED}"
          - "amount_cents == card.remaining_balance_cents"
        side_effects:
          - "card.remaining_balance_cents = 0; payout.status RELEASED -> CLEARED"
      - from: PARTIALLY_USED
        to: EXHAUSTED
        trigger: "POST /api/virtual-cards/{id}/spend"
        actor: Dealer | Consumer
        preconditions:
          - "card.status IN {ACTIVATED, PARTIALLY_USED}"
          - "amount_cents == card.remaining_balance_cents"
        side_effects:
          - "card.remaining_balance_cents = 0; payout.status RELEASED -> CLEARED"
      - from: ISSUED
        to: ESCHEATED
        trigger: "POST /api/programs/{id}/escheat-sweep"
        actor: ProgramAdmin
        preconditions:
          - "card.status IN {ISSUED, ACTIVATED, PARTIALLY_USED}"
          - "whole days between card.last_activity_at and the logical clock >= CARD_DORMANCY_DAYS"
        side_effects:
          - "card.remaining_balance_cents = 0; the parent Payout moves RELEASED -> ESCHEATED"
      - from: ACTIVATED
        to: ESCHEATED
        trigger: "POST /api/programs/{id}/escheat-sweep"
        actor: ProgramAdmin
        preconditions:
          - "card.status IN {ISSUED, ACTIVATED, PARTIALLY_USED}"
          - "whole days between card.last_activity_at and the logical clock >= CARD_DORMANCY_DAYS"
        side_effects:
          - "card.remaining_balance_cents = 0; the parent Payout moves RELEASED -> ESCHEATED"
      - from: PARTIALLY_USED
        to: ESCHEATED
        trigger: "POST /api/programs/{id}/escheat-sweep"
        actor: ProgramAdmin
        preconditions:
          - "card.status IN {ISSUED, ACTIVATED, PARTIALLY_USED}"
          - "whole days between card.last_activity_at and the logical clock >= CARD_DORMANCY_DAYS"
        side_effects:
          - "card.remaining_balance_cents = 0; the parent Payout moves RELEASED -> ESCHEATED"

  - entity: FraudCase
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, CLEARED]
    dimension: status
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /api/fraud-cases/{id}/transition with to_status == UNDER_INVESTIGATION"
        actor: FraudAnalyst
        preconditions:
          - "case.status IN {OPEN, PENDING_INFO}"
        side_effects:
          - "no cascade"
      - from: UNDER_INVESTIGATION
        to: PENDING_INFO
        trigger: "POST /api/fraud-cases/{id}/transition with to_status == PENDING_INFO"
        actor: FraudAnalyst
        preconditions:
          - "case.status == UNDER_INVESTIGATION"
        side_effects:
          - "case.info_request_count += 1"
      - from: PENDING_INFO
        to: UNDER_INVESTIGATION
        trigger: "POST /api/fraud-cases/{id}/transition with to_status == UNDER_INVESTIGATION"
        actor: FraudAnalyst
        preconditions:
          - "case.status IN {OPEN, PENDING_INFO}"
        side_effects:
          - "no cascade"
        note: "Cycle: UNDER_INVESTIGATION -> PENDING_INFO -> UNDER_INVESTIGATION, unbounded."
      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /api/fraud-cases/{id}/transition with to_status == SUBSTANTIATED"
        actor: FraudAnalyst
        preconditions:
          - "case.status == UNDER_INVESTIGATION"
        side_effects:
          - "case.final_score = calculations.claimant_fraud_score variant investigated_final (substantiated branch); Claimant.fraud_score = case.final_score"
          - "cascade hop 1: Claimant ACTIVE -> BLOCKED, which denies open claims and revokes approved-unpaid claims (hop 2), which appends RELEASE ledger entries and voids pending payouts (hop 3)"
      - from: UNDER_INVESTIGATION
        to: CLEARED
        trigger: "POST /api/fraud-cases/{id}/transition with to_status == CLEARED"
        actor: FraudAnalyst
        preconditions:
          - "case.status == UNDER_INVESTIGATION"
        side_effects:
          - "case.final_score = calculations.claimant_fraud_score variant investigated_final (cleared branch); Claimant.fraud_score = case.final_score"
          - "the case's claim, when its adjudication_status == HELD, moves HELD -> UNDER_REVIEW"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: payout-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /api/claims/{id}/payouts"
    occ_field: "expected_claim_version"
    description: |
      Creating a Payout against a Claim whose version has advanced since the
      client last observed it is rejected. A claim may legitimately carry a
      succession of payouts (a voided payout is replaced by a fresh one), so a
      second create is not blocked by any state precondition; the stale-version
      check is what makes the outcome deterministic.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

  - rule_id: budget-adjust-stale-program
    parent_entity: Program
    write_endpoint: "POST /api/programs/{id}/budget-adjustments"
    occ_field: "expected_program_version"
    description: |
      Adjusting a Program budget from a stale view of the program is rejected.
      Budget adjustments legitimately supersede one another, so a second
      adjustment carrying an outdated version is rejected on the version check
      rather than on any status precondition.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: claim_rebate_amount
    trigger: "POST /api/claims/{id}/submit (provisional variant) and POST /api/claims/{id}/approve (final variant)"
    algorithm: tiered_pricing
    formula: |
      # Step 1 - included receipt set (variant-dependent, see variants below)
      included = the receipts of this claim selected by the active variant
      # Step 2 - unit total drives tier selection ONCE, at claim level
      total_units = sum(line.quantity for r in included for line in r.lines)
      if claimant.type == DEALER:
          if offer.dealer_tier_enabled == false:
              pct = DEALER_TIER_1_PCT
          elif total_units <= DEALER_TIER_1_MAX_UNITS:      # 1..9
              pct = DEALER_TIER_1_PCT                        # 0.05
          elif total_units <= DEALER_TIER_2_MAX_UNITS:      # 10..49
              pct = DEALER_TIER_2_PCT                        # 0.08
          else:                                              # >= 50
              pct = DEALER_TIER_3_PCT                        # 0.12
      else:                                                  # CONSUMER
          pct = CONSUMER_REBATE_PCT                          # 0.10
      # Step 3 - ROUNDING ORDER IS PINNED: round EACH LINE, THEN sum.
      #   line_rebate_cents = round_half_up(line.quantity * line.unit_price_cents * pct)
      #   Summing first and rounding once is WRONG and produces different cents.
      raw = 0
      for r in included (ordered by Receipt.created_at ASC):
          for line in r.lines (in submitted array order):
              raw += round_half_up(line.quantity * line.unit_price_cents * pct)
      # Step 4 - consumer bonus, added once per claim, only when raw > 0
      if claimant.type == CONSUMER and raw > 0:
          raw += CONSUMER_FLAT_BONUS_CENTS                    # 500
      # Step 5 - per-claim cap
      rebate_cents = min(raw, offer.max_rebate_cents_per_claim)
    input_set: "Receipts attached to the claim; which subset is included depends on the variant. Receipts of other claims never contribute."
    constants:
      DEALER_TIER_1_MAX_UNITS: 9
      DEALER_TIER_2_MAX_UNITS: 49
      DEALER_TIER_1_PCT: 0.05
      DEALER_TIER_2_PCT: 0.08
      DEALER_TIER_3_PCT: 0.12
      CONSUMER_REBATE_PCT: 0.10
      CONSUMER_FLAT_BONUS_CENTS: 500
    precision: "integer cents; round_half_up applied per line only (Step 3); no rounding at Step 4 or Step 5"
    variants:
      - name: provisional
        when: "evaluated during POST /api/claims/{id}/submit and written to Claim.provisional_rebate_cents"
        difference: "included = ALL receipts of the claim regardless of Receipt.validated; the tier therefore reflects unverified units"
      - name: final
        when: "evaluated during POST /api/claims/{id}/approve and written to Claim.final_rebate_cents"
        difference: "included = only receipts with validated == true; dropping unvalidated receipts can lower total_units into a cheaper tier, so the final amount is not a proportional shrink of the provisional amount"

  - name: claimant_fraud_score
    trigger: "POST /api/claims/{id}/submit (heuristic_realtime variant) and POST /api/fraud-cases/{id}/transition into SUBSTANTIATED or CLEARED (investigated_final variant)"
    algorithm: weighted_scoring
    formula: |
      denied = Claimant.denied_claim_count                                # claims currently in DENIED
      dup    = Claimant.duplicate_attempt_count                           # rejected submits, cumulative
      recent = count of this claimant's Claims whose submitted_at is not null
               and (clock - submitted_at) < VELOCITY_WINDOW_DAYS days,
               INCLUDING the claim being submitted
      velocity_excess = max(0, recent - VELOCITY_FREE_CLAIMS)
      high_value = 1 if claim.provisional_rebate_cents >= HIGH_VALUE_CLAIM_CENTS else 0
      heuristic = W_DENIED*denied + W_DUPLICATE*dup + W_VELOCITY*velocity_excess + W_HIGH_VALUE*high_value
      heuristic = min(FRAUD_SCORE_MAX, max(FRAUD_SCORE_MIN, heuristic))
    input_set: "Only Claims belonging to this claimant. DRAFT, WITHDRAWN and VOIDED claims never contribute to `denied` or `recent`."
    constants:
      W_DENIED: 15
      W_DUPLICATE: 25
      W_VELOCITY: 10
      W_HIGH_VALUE: 20
      VELOCITY_FREE_CLAIMS: 2
      VELOCITY_WINDOW_DAYS: 30
      HIGH_VALUE_CLAIM_CENTS: 50000
      FRAUD_SCORE_MIN: 0
      FRAUD_SCORE_MAX: 100
      FRAUD_SCORE_THRESHOLD: 70
      SUBSTANTIATION_MULTIPLIER: 1.5
      CLEARANCE_CREDIT: 30
    precision: "integer points, round_half_up, clamped to [FRAUD_SCORE_MIN, FRAUD_SCORE_MAX]"
    variants:
      - name: heuristic_realtime
        when: "at submit; the result is stored on Claim.fraud_score_at_submit and Claimant.fraud_score, and gates the SUBMITTED -> HELD auto-transition at >= FRAUD_SCORE_THRESHOLD"
        difference: "pure weighted sum of the four observable counters, no analyst input"
      - name: investigated_final
        when: "when a FraudCase leaves UNDER_INVESTIGATION for a terminal state; written to FraudCase.final_score and Claimant.fraud_score"
        difference: "SUBSTANTIATED branch: min(FRAUD_SCORE_MAX, round_half_up(FraudCase.heuristic_score_at_open * SUBSTANTIATION_MULTIPLIER)). CLEARED branch: max(FRAUD_SCORE_MIN, FraudCase.heuristic_score_at_open - CLEARANCE_CREDIT). Identical counter inputs therefore yield two different scores depending on the branch taken."

  - name: program_budget_position
    trigger: "recomputed at the end of every request that appends a BudgetEntry, changes a Claim's adjudication_status, or adjusts the budget; also served by GET /api/programs/{id} and GET /api/programs/{id}/report"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED and must be followed exactly.
      # 1. committed
      committed_cents = sum(e.amount_cents where e.entry_type == COMMIT)
                      - sum(e.amount_cents where e.entry_type == RELEASE)
                      - sum(e.amount_cents where e.entry_type == ESCHEAT_REVERSAL)
      # 2. pending provisional. `subject_claim` is the claim currently being
      #    adjudicated by the enclosing request, or null outside an approve.
      pending_provisional_cents = sum(c.provisional_rebate_cents
            for c in Claims where c.offer.program_id == program.id
            and c.adjudication_status IN {SUBMITTED, UNDER_REVIEW, HELD}
            and c.id != subject_claim.id)
      # 3. reserve
      reserve_cents = round_half_up(RESERVE_FACTOR * pending_provisional_cents)
      # 4. available
      available_cents = budget_total_cents - committed_cents - reserve_cents
      # 5. utilization
      utilization_pct = round_half_up_4dp((committed_cents + reserve_cents) / budget_total_cents)
      # 6. gates
      #    approve is rejected with ERR_BUDGET_EXCEEDED when
      #        claim.final_rebate_cents > available_cents
      #    Program locks when utilization_pct >= BUDGET_HARD_PCT (>=, not >)
      #    and unlocks when utilization_pct < BUDGET_HARD_PCT.
    input_set: "BudgetEntry rows of this program (all of them, append-only) and Claims funded by this program in SUBMITTED, UNDER_REVIEW or HELD. The claim being approved is EXCLUDED from pending_provisional_cents while its own budget gate is evaluated."
    constants:
      RESERVE_FACTOR: 0.15
      BUDGET_WARN_PCT: 0.8000
      BUDGET_HARD_PCT: 1.0000
    precision: "integer cents for all *_cents fields (round_half_up on the reserve); utilization_pct is a number rounded half-up to 4 decimal places"

  - name: payout_net_amount
    trigger: "POST /api/claims/{id}/payouts"
    algorithm: constraint_propagation
    formula: |
      # This is a deliberately circular-looking dependency: the method depends on
      # an amount threshold, and the fee (hence the amount actually disbursed)
      # depends on the method. The evaluation ORDER below is PINNED.
      # (1) gross is fixed first and never changes
      gross_cents = claim.final_rebate_cents
      # (2) method is selected from GROSS, never from net
      if request supplies `method`:
          method = request.method
      elif claimant.type == CONSUMER and gross_cents >= CARD_METHOD_MIN_CENTS:
          method = VIRTUAL_CARD
      else:
          method = CHECK
      # (3) fee follows the method
      fee_cents = CHECK_FEE_CENTS if method == CHECK else CARD_FEE_CENTS
      # (4) net follows the fee. The method is NOT re-selected even when
      #     net_cents falls back below CARD_METHOD_MIN_CENTS.
      net_cents = gross_cents - fee_cents
      # (5) gate
      #     net_cents < PAYOUT_MIN_CENTS  ->  ERR_BELOW_MIN_PAYOUT
    input_set: "The single approved claim named in the path; no aggregation across claims."
    constants:
      CHECK_FEE_CENTS: 150
      CARD_FEE_CENTS: 50
      CARD_METHOD_MIN_CENTS: 2500
      PAYOUT_MIN_CENTS: 100
    precision: "integer cents; no rounding is performed, all inputs are already integral"

  - name: escheat_transfer_amount
    trigger: "POST /api/programs/{id}/escheat-sweep"
    algorithm: interval_merge
    formula: |
      # Candidate set, evaluated in a single pass over the program's payouts
      # ordered by released_at ASC, then created_at ASC (never by id).
      for payout in Payouts of this program where status == RELEASED:
          if payout.method == CHECK:
              anchor = payout.released_at
              limit  = ESCHEAT_DORMANCY_DAYS                  # 180
              amount = payout.net_cents
          else:                                               # VIRTUAL_CARD
              card   = the VirtualCard whose payout_id == payout.id
              anchor = card.last_activity_at
              limit  = CARD_DORMANCY_DAYS                     # 90
              amount = card.remaining_balance_cents
          dormancy_days = whole days from anchor to the logical clock
          if dormancy_days >= limit:                          # >=, not >
              create EscheatRecord(amount_cents = amount,
                                   dormancy_days = dormancy_days,
                                   jurisdiction = claimant.mailing_state
                                       or program.escheat_jurisdiction when empty,
                                   swept_at = clock)
              payout -> ESCHEATED ; claim.payment_status -> ESCHEATED
              append BudgetEntry(ESCHEAT_REVERSAL, claim.final_rebate_cents)
      # Note the asymmetry that must be honoured: the EscheatRecord captures the
      # NET (or remaining card balance) actually surrendered, while the ledger
      # reversal returns the GROSS committed amount so that Program.available_cents
      # returns exactly to its pre-commit value.
    input_set: "Payouts with status == RELEASED whose Claim's Offer belongs to this program. CLEARED, VOIDED, PENDING and REISSUE_PENDING payouts are never swept."
    constants:
      ESCHEAT_DORMANCY_DAYS: 180
      CARD_DORMANCY_DAYS: 90
      VIRTUAL_CARD_VALID_DAYS: 365
    precision: "integer cents; dormancy measured in whole days (floor of the elapsed interval)"

  - name: program_report_snapshot
    trigger: "GET /api/programs/{id}/report"
    algorithm: aggregation
    formula: |
      claims_submitted   = count(Claims of this program with submitted_at != null)
      claims_approved    = count(Claims with adjudication_status == APPROVED)
      claims_denied      = count(Claims with adjudication_status == DENIED)
      claims_revoked     = count(Claims with adjudication_status == REVOKED)
      dealer_claim_count = count of the above submitted claims whose claimant.type == DEALER
      consumer_claim_count = count of the above submitted claims whose claimant.type == CONSUMER
      approved_rebate_cents = sum(final_rebate_cents for APPROVED claims)
      escheated_cents    = sum(EscheatRecord.amount_cents for this program)
      offer_breakdown    = one row per Offer of this program, ordered by
                           Offer.effective_start_date ASC, then Offer.created_at ASC
                           (never by id), each row carrying offer_id,
                           active_claim_count and approved_rebate_cents
    input_set: "All Claims whose Offer.program_id == program.id, plus all EscheatRecords with program_id == program.id. DRAFT, WITHDRAWN and VOIDED claims are excluded from every count except claims_submitted, which itself excludes them because submitted_at is null."
    constants: {}
    precision: "integer counts and integer cents; no rounding"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "for entity_backed roles (Dealer, Consumer) acting on a Claim, Receipt, Payout or VirtualCard, X-User-ID equals the owning Claim.claimant_id"
    error_id: ERR_NOT_CLAIM_OWNER
    http_status: 403
    applies_to: "POST /api/claims, POST /api/claims/{id}/receipts, POST /api/claims/{id}/submit, POST /api/claims/{id}/withdraw, POST /api/claims/{id}/appeal, POST /api/virtual-cards/{id}/activate, POST /api/virtual-cards/{id}/spend"

  - priority: 10
    category: existence
    check: "every path-resolved resource exists, validated left-to-right"
    error_id: ERR_PROGRAM_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_CLAIMANT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_RECEIPT_NOT_FOUND | ERR_PAYOUT_NOT_FOUND | ERR_CARD_NOT_FOUND | ERR_FRAUD_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 11
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (program_id, offer_id, claimant_id, claim_id)"
    error_id: ERR_PROGRAM_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_CLAIMANT_NOT_FOUND | ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/offers, POST /api/claims, POST /api/fraud-cases"

  - priority: 12
    category: business_constraint
    check: "required body fields are present, enum values are members of the declared set, integers are positive where constrained, effective_end_date > effective_start_date, and Receipt.lines is a non-empty array whose entries each carry sku, quantity > 0 and unit_price_cents > 0 (the upper bound on the number of lines is checked separately at priority 13)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 13
    category: business_constraint
    check: "Receipt.lines carries at most RECEIPT_MAX_LINES (20) entries"
    error_id: ERR_RECEIPT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /api/claims/{id}/receipts"

  - priority: 15
    category: business_constraint
    check: "expected_claim_version equals Claim.version / expected_program_version equals Program.version"
    error_id: ERR_STALE_CLAIM_VERSION | ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /api/claims/{id}/payouts, POST /api/programs/{id}/budget-adjustments"

  - priority: 20
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_PROGRAM_NOT_ACTIVE | ERR_OFFER_NOT_PUBLISHED | ERR_CLAIM_NOT_DRAFT | ERR_CLAIM_NOT_REVIEWABLE | ERR_CLAIM_ALREADY_TERMINAL | ERR_PAYOUT_NOT_RELEASABLE | ERR_CARD_NOT_ACTIVE | ERR_INVALID_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 21
    category: state
    check: "creating a second Payout while the claim already has one with status IN {PENDING, RELEASED, REISSUE_PENDING} is rejected"
    error_id: ERR_PAYOUT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /api/claims/{id}/payouts"

  - priority: 25
    category: business_safety
    check: "the acting or referenced Claimant.status is ACTIVE (a BLOCKED claimant may neither submit, appeal, nor have a payout released)"
    error_id: ERR_CLAIMANT_BLOCKED
    http_status: 403
    applies_to: "POST /api/claims/{id}/submit, POST /api/claims/{id}/appeal, POST /api/claims/{id}/approve, POST /api/payouts/{id}/release"

  - priority: 26
    category: business_safety
    check: "the request's X-User-ID differs from Claim.approved_by_user_id (segregation of duties between adjudication and disbursement)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/payouts/{id}/release"

  - priority: 30
    category: business_temporal
    check: "for every Receipt of the claim, whole days between Receipt.purchase_date and the logical clock is <= CLAIM_WINDOW_DAYS (90); the boundary day 90 is accepted, day 91 is rejected"
    error_id: ERR_CLAIM_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/claims/{id}/submit"

  - priority: 31
    category: business_temporal
    check: "every Receipt.purchase_date lies inside the offer's half-open window [effective_start_date, effective_end_date); a purchase exactly at effective_end_date is rejected"
    error_id: ERR_PURCHASE_OUTSIDE_OFFER_WINDOW
    http_status: 422
    applies_to: "POST /api/claims/{id}/submit"

  - priority: 32
    category: business_temporal
    check: "the offer is PUBLISHED, or CLOSED with whole days between closed_at and the logical clock <= OFFER_GRACE_DAYS (15)"
    error_id: ERR_OFFER_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /api/claims/{id}/submit"

  - priority: 33
    category: business_temporal
    check: "an appeal is taken within APPEAL_WINDOW_DAYS (30) whole days of Claim.denied_at, inclusive"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/claims/{id}/appeal"

  - priority: 34
    category: business_referential
    check: "no Receipt of this claim shares a serial_number with a Receipt on a different Claim whose adjudication_status IN {SUBMITTED, UNDER_REVIEW, HELD, APPROVED} and whose purchase_date is within DEDUPE_WINDOW_DAYS (365) whole days of this receipt's purchase_date, measured as an inclusive closed window in both directions"
    error_id: ERR_DUPLICATE_RECEIPT_SERIAL
    http_status: 409
    applies_to: "POST /api/claims/{id}/submit"

  - priority: 35
    category: business_referential
    check: "Claimant.type matches Offer.channel (a DEALER claimant may only claim a DEALER or BOTH offer, a CONSUMER claimant only a CONSUMER or BOTH offer)"
    error_id: ERR_CHANNEL_MISMATCH
    http_status: 422
    applies_to: "POST /api/claims, POST /api/claims/{id}/submit"

  - priority: 36
    category: business_referential
    check: "no other Offer with the same program_id, sku_scope and channel and status IN {DRAFT, PUBLISHED, SUSPENDED} has a half-open window [effective_start_date, effective_end_date) that intersects this offer's window; windows that merely touch (one ends exactly where the other begins) do NOT intersect"
    error_id: ERR_OFFER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/offers, POST /api/offers/{id}/publish"

  - priority: 40
    category: business_constraint
    check: "at submit time, the count of the claimant's OTHER claims on this offer with adjudication_status NOT IN {DRAFT, WITHDRAWN, VOIDED} must be strictly less than MAX_CLAIMS_PER_CLAIMANT_PER_OFFER (3); the fourth submit against the same offer is therefore rejected, and a withdrawal frees the slot"
    error_id: ERR_CLAIM_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /api/claims/{id}/submit"

  - priority: 41
    category: business_constraint
    check: "the claim has at least one Receipt with validated == true at approval time"
    error_id: ERR_NO_VALIDATED_RECEIPT
    http_status: 422
    applies_to: "POST /api/claims/{id}/approve"

  - priority: 42
    category: business_constraint
    check: "Claim.appeal_count < MAX_APPEALS_PER_CLAIM (2)"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /api/claims/{id}/appeal"

  - priority: 43
    category: business_constraint
    check: "a spend amount_cents is > 0 and <= VirtualCard.remaining_balance_cents"
    error_id: ERR_INSUFFICIENT_CARD_BALANCE
    http_status: 422
    applies_to: "POST /api/virtual-cards/{id}/spend"

  - priority: 50
    category: business_fiscal
    check: "calculations.claim_rebate_amount variant final <= Program.available_cents, evaluated with the claim under adjudication excluded from pending_provisional_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /api/claims/{id}/approve"

  - priority: 51
    category: business_fiscal
    check: "Payout.net_cents >= PAYOUT_MIN_CENTS (100)"
    error_id: ERR_BELOW_MIN_PAYOUT
    http_status: 422
    applies_to: "POST /api/claims/{id}/payouts, POST /api/payouts/{id}/release"

  - priority: 52
    category: business_fiscal
    check: "a budget adjustment may not drive Program.budget_total_cents to zero or below"
    error_id: ERR_BUDGET_ADJUSTMENT_INVALID
    http_status: 422
    applies_to: "POST /api/programs/{id}/budget-adjustments"

  - priority: 60
    category: business_constraint
    check: "POST /api/payouts/{id}/clear applies only to method == CHECK; a VIRTUAL_CARD payout is cleared implicitly when its card reaches EXHAUSTED and may not be cleared manually. An escheat sweep that finds no dormant payout is NOT an error - it returns an empty array."
    error_id: ERR_NOT_CHECK_PAYOUT
    http_status: 409
    applies_to: "POST /api/payouts/{id}/clear"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Program -------------------------------------------------------------
  - method: POST
    path: "/api/programs"
    description: "Create a rebate program in DRAFT"
    roles: [ProgramAdmin]
    code: 201
    input: [name, budget_total_cents, fiscal_year, escheat_jurisdiction]
    output: Program
    side_effects: ["program.status = DRAFT", "available_cents = budget_total_cents, utilization_pct = 0.0"]

  - method: GET
    path: "/api/programs/{id}"
    description: "Read a program including its live budget position"
    roles: [ProgramAdmin, ClaimsProcessor, FinanceOfficer, FraudAnalyst]
    code: 200
    input: []
    output: Program
    side_effects: ["recomputes calculations.program_budget_position for the response"]

  - method: GET
    path: "/api/programs"
    description: "List programs"
    roles: [ProgramAdmin, ClaimsProcessor, FinanceOfficer, FraudAnalyst]
    code: 200
    input: ["status?", "fiscal_year?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: POST
    path: "/api/programs/{id}/activate"
    description: "Move a program DRAFT -> ACTIVE"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["program.status = ACTIVE", "increments Program.version by 1"]

  - method: POST
    path: "/api/programs/{id}/close"
    description: "Close a program and cascade-close its offers"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["program.status = CLOSED", "every non-CLOSED Offer moves to CLOSED with closed_at stamped", "increments Program.version by 1"]

  - method: POST
    path: "/api/programs/{id}/budget-adjustments"
    description: "Apply a signed budget delta under optimistic concurrency on Program.version"
    roles: [ProgramAdmin]
    code: 200
    input: [delta_cents, memo, expected_program_version]
    output: Program
    side_effects: ["budget_total_cents += delta_cents", "appends BudgetEntry with entry_type == BUDGET_ADJUSTMENT", "recomputes program_budget_position and may fire ACTIVE -> BUDGET_LOCKED or BUDGET_LOCKED -> ACTIVE", "increments Program.version by 1"]

  - method: GET
    path: "/api/programs/{id}/report"
    description: "Computed reporting snapshot for the program"
    roles: [ProgramAdmin, ClaimsProcessor]
    code: 200
    input: []
    output: { program_id: string, claims_submitted: integer, claims_approved: integer, claims_denied: integer, claims_revoked: integer, dealer_claim_count: integer, consumer_claim_count: integer, approved_rebate_cents: integer, escheated_cents: integer, committed_cents: integer, available_cents: integer, utilization_pct: number, offer_breakdown: array }
    side_effects: ["evaluates calculations.program_report_snapshot"]

  - method: POST
    path: "/api/programs/{id}/escheat-sweep"
    description: "Sweep dormant released payouts of this program into escheat records; returns the records created by this sweep (empty array when nothing is dormant)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: EscheatRecord[]
    side_effects: ["dormant Payouts move RELEASED -> ESCHEATED", "their Claims move payment_status PAID -> ESCHEATED", "ESCHEAT_REVERSAL BudgetEntry appended per swept claim", "program may move BUDGET_LOCKED -> ACTIVE"]

  # --- Offer ---------------------------------------------------------------
  - method: POST
    path: "/api/offers"
    description: "Create an offer under a program, in DRAFT"
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, name, channel, sku_scope, effective_start_date, effective_end_date, max_rebate_cents_per_claim, "dealer_tier_enabled?"]
    output: Offer
    side_effects: ["window-overlap check per validations priority 36"]

  - method: GET
    path: "/api/offers/{id}"
    description: "Read an offer"
    roles: [ProgramAdmin, ClaimsProcessor, FinanceOfficer, FraudAnalyst, Dealer, Consumer]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/api/offers"
    description: "List offers, filterable by parent program"
    roles: [ProgramAdmin, ClaimsProcessor, FinanceOfficer, FraudAnalyst, Dealer, Consumer]
    code: 200
    input: ["program_id?", "status?", "channel?", "sku_scope?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: POST
    path: "/api/offers/{id}/publish"
    description: "Publish an offer from DRAFT or SUSPENDED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: ["offer.status = PUBLISHED", "increments Offer.version by 1"]

  - method: POST
    path: "/api/offers/{id}/suspend"
    description: "Suspend a published offer"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: ["offer.status = SUSPENDED", "DRAFT claims on the offer move to VOIDED"]

  - method: POST
    path: "/api/offers/{id}/close"
    description: "Close an offer and start the OFFER_GRACE_DAYS grace period"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: ["offer.status = CLOSED", "offer.closed_at stamped with the logical clock"]

  # --- Claimant ------------------------------------------------------------
  - method: POST
    path: "/api/claimants"
    description: "Register a dealer or consumer claimant"
    roles: [ProgramAdmin]
    code: 201
    input: [type, legal_name, email, mailing_state]
    output: Claimant
    side_effects: ["claimant.status = ACTIVE, fraud_score = 0"]

  - method: GET
    path: "/api/claimants/{id}"
    description: "Read a claimant"
    roles: [ProgramAdmin, ClaimsProcessor, FinanceOfficer, FraudAnalyst, Dealer, Consumer]
    code: 200
    input: []
    output: Claimant
    side_effects: []

  - method: GET
    path: "/api/claimants"
    description: "List claimants"
    roles: [ProgramAdmin, ClaimsProcessor, FraudAnalyst]
    code: 200
    input: ["type?", "status?", "limit?", "offset?"]
    output: Claimant[]
    side_effects: []

  - method: POST
    path: "/api/claimants/{id}/reinstate"
    description: "Return a BLOCKED claimant to ACTIVE once no case is open"
    roles: [FraudAnalyst]
    code: 200
    input: [memo]
    output: Claimant
    side_effects: ["claimant.status = ACTIVE", "claimant.fraud_score reset to FRAUD_SCORE_MIN"]

  # --- Claim ---------------------------------------------------------------
  - method: POST
    path: "/api/claims"
    description: "Open a claim in DRAFT against a published offer"
    roles: [Dealer, Consumer]
    code: 201
    input: [offer_id, claimant_id]
    output: Claim
    side_effects: ["claim.adjudication_status = DRAFT, payment_status = NONE"]

  - method: GET
    path: "/api/claims/{id}"
    description: "Read a claim with both state dimensions and both rebate variants"
    roles: [ProgramAdmin, ClaimsProcessor, FinanceOfficer, FraudAnalyst, Dealer, Consumer]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/api/claims"
    description: "List claims, filterable by offer or claimant"
    roles: [ProgramAdmin, ClaimsProcessor, FinanceOfficer, FraudAnalyst, Dealer, Consumer]
    code: 200
    input: ["claimant_id?", "offer_id?", "adjudication_status?", "payment_status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/api/claims/{id}/receipts"
    description: "Attach a proof-of-purchase receipt to a DRAFT claim"
    roles: [Dealer, Consumer]
    code: 201
    input: [serial_number, purchase_date, retailer_name, lines]
    output: Receipt
    side_effects: ["receipt.validated = false", "line_count, units and gross_amount_cents computed"]

  - method: GET
    path: "/api/claims/{id}/receipts"
    description: "List the receipts of a claim"
    roles: [ProgramAdmin, ClaimsProcessor, FinanceOfficer, FraudAnalyst, Dealer, Consumer]
    code: 200
    input: ["validated?", "limit?", "offset?"]
    output: Receipt[]
    side_effects: []

  - method: GET
    path: "/api/receipts/{id}"
    description: "Read a single receipt"
    roles: [ProgramAdmin, ClaimsProcessor, Dealer, Consumer]
    code: 200
    input: []
    output: Receipt
    side_effects: []

  - method: POST
    path: "/api/receipts/{id}/validate"
    description: "Mark a receipt as verified so it enters the final rebate variant"
    roles: [ClaimsProcessor]
    code: 200
    input: []
    output: Receipt
    side_effects: ["receipt.validated = true", "receipt.validated_at stamped with the logical clock"]

  - method: POST
    path: "/api/claims/{id}/submit"
    description: "Submit a DRAFT claim for adjudication"
    roles: [Dealer, Consumer]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim.adjudication_status DRAFT -> SUBMITTED", "provisional_rebate_cents and fraud_score_at_submit stamped", "ACCRUAL BudgetEntry appended", "Claimant.open_claim_count and Offer.active_claim_count incremented", "auto SUBMITTED -> HELD with a SYSTEM_AUTO FraudCase when fraud_score_at_submit >= FRAUD_SCORE_THRESHOLD", "on ERR_DUPLICATE_RECEIPT_SERIAL, Claimant.duplicate_attempt_count is incremented before the error is returned"]

  - method: POST
    path: "/api/claims/{id}/withdraw"
    description: "Withdraw a DRAFT or SUBMITTED claim (compensating action for submit)"
    roles: [Dealer, Consumer]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim.adjudication_status -> WITHDRAWN", "Claimant.open_claim_count and Offer.active_claim_count restored to their pre-submit values"]

  - method: POST
    path: "/api/claims/{id}/review"
    description: "Take a submitted claim into review"
    roles: [ClaimsProcessor]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim.adjudication_status SUBMITTED -> UNDER_REVIEW"]

  - method: POST
    path: "/api/claims/{id}/approve"
    description: "Approve a claim under review, committing budget"
    roles: [ClaimsProcessor]
    code: 200
    input: []
    output: Claim
    side_effects: ["final_rebate_cents stamped", "approved_by_user_id = X-User-ID", "COMMIT BudgetEntry appended", "program may move ACTIVE -> BUDGET_LOCKED, suspending published offers and voiding their DRAFT claims"]

  - method: POST
    path: "/api/claims/{id}/deny"
    description: "Deny a claim under review"
    roles: [ClaimsProcessor]
    code: 200
    input: [reason_code]
    output: Claim
    side_effects: ["claim.adjudication_status UNDER_REVIEW -> DENIED", "denied_at stamped", "Claimant.denied_claim_count incremented"]

  - method: POST
    path: "/api/claims/{id}/appeal"
    description: "Appeal a denial, cycling the claim back into review"
    roles: [Dealer, Consumer]
    code: 200
    input: [appeal_note]
    output: Claim
    side_effects: ["claim.adjudication_status DENIED -> UNDER_REVIEW", "appeal_count incremented", "Claimant.denied_claim_count decremented"]

  # --- Payout --------------------------------------------------------------
  - method: POST
    path: "/api/claims/{id}/payouts"
    description: "Schedule a disbursement for an approved claim, under optimistic concurrency on Claim.version"
    roles: [FinanceOfficer]
    code: 201
    input: [expected_claim_version, "method?"]
    output: Payout
    side_effects: ["payout created in PENDING with gross/fee/net from calculations.payout_net_amount", "claim.payment_status NONE -> SCHEDULED", "increments Claim.version by 1"]

  - method: GET
    path: "/api/payouts/{id}"
    description: "Read a payout"
    roles: [ProgramAdmin, ClaimsProcessor, FinanceOfficer, Dealer, Consumer]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: GET
    path: "/api/payouts"
    description: "List payouts, filterable by claim"
    roles: [ProgramAdmin, ClaimsProcessor, FinanceOfficer, Dealer, Consumer]
    code: 200
    input: ["claim_id?", "status?", "method?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []

  - method: POST
    path: "/api/payouts/{id}/release"
    description: "Release a pending or reissued payout (segregation of duties enforced)"
    roles: [FinanceOfficer]
    code: 200
    input: ["check_number?"]
    output: Payout
    side_effects: ["payout.status -> RELEASED, released_at and released_by_user_id stamped", "claim.payment_status -> PAID", "PAYMENT BudgetEntry appended", "a VirtualCard in ISSUED is created when method == VIRTUAL_CARD"]

  - method: POST
    path: "/api/payouts/{id}/clear"
    description: "Record that a released check was cashed"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["payout.status RELEASED -> CLEARED", "the payout is no longer escheatable"]

  - method: POST
    path: "/api/payouts/{id}/void"
    description: "Void a payout without releasing the underlying commitment"
    roles: [FinanceOfficer]
    code: 200
    input: [void_reason]
    output: Payout
    side_effects: ["payout.status -> VOIDED", "claim.payment_status resets to NONE", "no BudgetEntry is appended"]

  - method: POST
    path: "/api/payouts/{id}/reissue"
    description: "Cycle a released or voided payout back to REISSUE_PENDING so it can be released again"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["payout.status -> REISSUE_PENDING", "payout.reissue_count incremented", "check_number cleared"]

  # --- VirtualCard ---------------------------------------------------------
  - method: GET
    path: "/api/virtual-cards/{id}"
    description: "Read a virtual card"
    roles: [ProgramAdmin, FinanceOfficer, Dealer, Consumer]
    code: 200
    input: []
    output: VirtualCard
    side_effects: []

  - method: GET
    path: "/api/virtual-cards"
    description: "List virtual cards, filterable by payout"
    roles: [ProgramAdmin, FinanceOfficer, Dealer, Consumer]
    code: 200
    input: ["payout_id?", "status?", "limit?", "offset?"]
    output: VirtualCard[]
    side_effects: []

  - method: POST
    path: "/api/virtual-cards/{id}/activate"
    description: "Activate an issued card"
    roles: [Dealer, Consumer]
    code: 200
    input: []
    output: VirtualCard
    side_effects: ["card.status ISSUED -> ACTIVATED", "last_activity_at stamped, restarting the CARD_DORMANCY_DAYS clock"]

  - method: POST
    path: "/api/virtual-cards/{id}/spend"
    description: "Spend against an activated card"
    roles: [Dealer, Consumer]
    code: 200
    input: [amount_cents, merchant_name]
    output: VirtualCard
    side_effects: ["remaining_balance_cents reduced", "status -> PARTIALLY_USED or EXHAUSTED", "on EXHAUSTED the parent Payout moves RELEASED -> CLEARED"]

  # --- EscheatRecord -------------------------------------------------------
  - method: GET
    path: "/api/escheat-records/{id}"
    description: "Read an escheat record"
    roles: [ProgramAdmin, FinanceOfficer]
    code: 200
    input: []
    output: EscheatRecord
    side_effects: []

  - method: GET
    path: "/api/escheat-records"
    description: "List escheat records, filterable by payout or program"
    roles: [ProgramAdmin, FinanceOfficer]
    code: 200
    input: ["payout_id?", "program_id?", "jurisdiction?", "limit?", "offset?"]
    output: EscheatRecord[]
    side_effects: []

  # --- BudgetEntry ---------------------------------------------------------
  - method: GET
    path: "/api/budget-entries/{id}"
    description: "Read a single ledger entry"
    roles: [ProgramAdmin, ClaimsProcessor, FinanceOfficer]
    code: 200
    input: []
    output: BudgetEntry
    side_effects: []

  - method: GET
    path: "/api/budget-entries"
    description: "List ledger entries, filterable by program or claim"
    roles: [ProgramAdmin, ClaimsProcessor, FinanceOfficer]
    code: 200
    input: ["program_id?", "claim_id?", "entry_type?", "limit?", "offset?"]
    output: BudgetEntry[]
    side_effects: []

  # --- FraudCase -----------------------------------------------------------
  - method: POST
    path: "/api/fraud-cases"
    description: "Open a fraud case against a claimant"
    roles: [FraudAnalyst]
    code: 201
    input: [claimant_id, opened_reason, "claim_id?"]
    output: FraudCase
    side_effects: ["case.status = OPEN, opened_by = ANALYST", "heuristic_score_at_open stamped from calculations.claimant_fraud_score"]

  - method: GET
    path: "/api/fraud-cases/{id}"
    description: "Read a fraud case"
    roles: [ProgramAdmin, FraudAnalyst]
    code: 200
    input: []
    output: FraudCase
    side_effects: []

  - method: GET
    path: "/api/fraud-cases"
    description: "List fraud cases, filterable by claimant or claim"
    roles: [ProgramAdmin, FraudAnalyst, ClaimsProcessor]
    code: 200
    input: ["claimant_id?", "claim_id?", "status?", "limit?", "offset?"]
    output: FraudCase[]
    side_effects: []

  - method: POST
    path: "/api/fraud-cases/{id}/transition"
    description: "Drive the cyclic fraud-case machine; to_status is one of UNDER_INVESTIGATION, PENDING_INFO, SUBSTANTIATED, CLEARED"
    roles: [FraudAnalyst]
    code: 200
    input: [to_status, "note?"]
    output: FraudCase
    side_effects: ["on SUBSTANTIATED: final_score stamped, Claimant -> BLOCKED, open claims denied, approved-unpaid claims revoked with RELEASE ledger entries and pending payouts voided", "on CLEARED: final_score stamped and a HELD claim moves to UNDER_REVIEW", "on PENDING_INFO: info_request_count incremented"]

  # --- Test-driving --------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-07-01T00:00:00Z (the fixed startup default) and never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all subsequent window, dormancy, velocity and appeal computations use the new instant"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or role not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_CLAIM_OWNER
    http: 403
    condition: "a Dealer or Consumer acts on a Claim, Receipt or VirtualCard whose Claim.claimant_id differs from X-User-ID"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, bad enum member, non-positive quantity/price, or effective_end_date <= effective_start_date"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program id in path or body does not resolve"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "offer id in path or body does not resolve"
  - id: ERR_CLAIMANT_NOT_FOUND
    http: 404
    condition: "claimant id in path or body does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim id in path or body does not resolve"
  - id: ERR_RECEIPT_NOT_FOUND
    http: 404
    condition: "receipt id in path does not resolve"
  - id: ERR_PAYOUT_NOT_FOUND
    http: 404
    condition: "payout id in path does not resolve"
  - id: ERR_CARD_NOT_FOUND
    http: 404
    condition: "virtual card id in path does not resolve"
  - id: ERR_FRAUD_CASE_NOT_FOUND
    http: 404
    condition: "fraud case id in path does not resolve"
  - id: ERR_PROGRAM_NOT_ACTIVE
    http: 409
    condition: "an operation requiring Program.status == ACTIVE is attempted while the program is DRAFT, BUDGET_LOCKED or CLOSED"
  - id: ERR_OFFER_NOT_PUBLISHED
    http: 409
    condition: "a claim is opened against an offer whose status is not PUBLISHED, or an offer transition is requested from a state that does not declare it"
  - id: ERR_OFFER_WINDOW_OVERLAP
    http: 409
    condition: "an offer's half-open window intersects a sibling offer with the same program_id, sku_scope and channel"
  - id: ERR_CLAIM_NOT_DRAFT
    http: 409
    condition: "a receipt is attached to, or a submit is attempted on, a claim whose adjudication_status is not DRAFT"
  - id: ERR_CLAIM_NOT_REVIEWABLE
    http: 409
    condition: "review, approve or deny is attempted from an adjudication_status that does not declare that transition"
  - id: ERR_CLAIM_ALREADY_TERMINAL
    http: 409
    condition: "any adjudication action is attempted on a claim in APPROVED, REVOKED, WITHDRAWN or VOIDED"
  - id: ERR_INVALID_TRANSITION
    http: 409
    condition: "a FraudCase or VirtualCard transition is requested from a state that does not declare it"
  - id: ERR_PAYOUT_NOT_RELEASABLE
    http: 409
    condition: "release, clear, void or reissue is attempted from a payout status that does not declare that transition"
  - id: ERR_PAYOUT_ALREADY_EXISTS
    http: 409
    condition: "a payout is created for a claim that already has one in PENDING, RELEASED or REISSUE_PENDING"
  - id: ERR_NOT_CHECK_PAYOUT
    http: 409
    condition: "clear is attempted on a payout whose method is VIRTUAL_CARD"
  - id: ERR_CARD_NOT_ACTIVE
    http: 409
    condition: "activate or spend is attempted on a card that is not in the required source state, or whose payout is not RELEASED"
  - id: ERR_CLAIMANT_BLOCKED
    http: 403
    condition: "the claimant relevant to the operation has status BLOCKED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID releasing a payout equals the Claim.approved_by_user_id that approved it"
  - id: ERR_CLAIM_WINDOW_EXPIRED
    http: 422
    condition: "a receipt's purchase_date is more than CLAIM_WINDOW_DAYS whole days before the logical clock at submit"
  - id: ERR_PURCHASE_OUTSIDE_OFFER_WINDOW
    http: 422
    condition: "a receipt's purchase_date is outside the offer's half-open [effective_start_date, effective_end_date) window"
  - id: ERR_OFFER_WINDOW_CLOSED
    http: 422
    condition: "submit is attempted more than OFFER_GRACE_DAYS whole days after the offer's closed_at"
  - id: ERR_DUPLICATE_RECEIPT_SERIAL
    http: 409
    condition: "a receipt serial_number collides with a receipt on another live claim inside DEDUPE_WINDOW_DAYS"
  - id: ERR_CHANNEL_MISMATCH
    http: 422
    condition: "Claimant.type is not compatible with Offer.channel"
  - id: ERR_CLAIM_CAP_EXCEEDED
    http: 409
    condition: "the claimant already holds MAX_CLAIMS_PER_CLAIMANT_PER_OFFER submitted-or-later claims on this offer"
  - id: ERR_NO_VALIDATED_RECEIPT
    http: 422
    condition: "approve is attempted while no receipt of the claim has validated == true"
  - id: ERR_RECEIPT_LIMIT_EXCEEDED
    http: 422
    condition: "a receipt carries more than RECEIPT_MAX_LINES line items"
  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 422
    condition: "an appeal is taken more than APPEAL_WINDOW_DAYS whole days after denied_at"
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "appeal_count has already reached MAX_APPEALS_PER_CLAIM"
  - id: ERR_BUDGET_EXCEEDED
    http: 409
    condition: "the final rebate exceeds Program.available_cents at approval"
  - id: ERR_BUDGET_ADJUSTMENT_INVALID
    http: 422
    condition: "a budget adjustment would leave budget_total_cents <= 0"
  - id: ERR_BELOW_MIN_PAYOUT
    http: 422
    condition: "the payout net amount is below PAYOUT_MIN_CENTS"
  - id: ERR_INSUFFICIENT_CARD_BALANCE
    http: 422
    condition: "a spend amount is not in (0, remaining_balance_cents]"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal Claim.version"
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not equal Program.version"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
