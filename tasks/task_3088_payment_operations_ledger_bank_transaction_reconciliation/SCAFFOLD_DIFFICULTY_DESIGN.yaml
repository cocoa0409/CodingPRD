- rule_id: resource_temporal_overlap
  instances:
  - name: statement_cycle_adjacency_closed_zero_length_overlap
    grounds:
    - validations[priority=18]
    - errors[ERR_LINE_ALREADY_MATCHED]
    - entities.BankStatement.fields.cycle_date
    - entities.BankStatement.fields.institution_ref
    - endpoints.POST_/bank-statements
    distinguishing_aspect: 'Interval semantics: cycles are CLOSED at the upper end, so a second cycle whose cycle_date
      is exactly equal (zero-length overlap) is rejected with ERR_LINE_ALREADY_MATCHED; one second later is accepted.
      The semantics are closed-closed rather than half-open, which is the geometric distinction from the sibling
      instance''s buffer rule, and the resource is BankStatement rather than BankingCalendar.'
