# =============================================================================
# 1.9 Scaffold Corner Design
#
# Breadth pass over references/claim-extraction-guide.md walked against this
# scaffold's §1.1-§1.7. Every instance below is a claim that the §1.8 difficulty
# instances do NOT already pin; where §1.8 already owns a corner, the row is kept
# as an `excluded_because:` stub so the coverage walk stays auditable.
#
# Conventions used throughout:
#   * the logical clock reads 2026-08-01T00:00:00Z until a test moves it
#     (§1.5 POST /_clock/set_current_utc), so every "days" figure below is
#     measured from that instant;
#   * calls that must not be silently accepted capture `$.data.error_id` so the
#     assertion is on the envelope, not on a status code alone;
#   * `as_user_id:` is supplied whenever the acting role is entity_backed
#     (ArtistRepresentative -> Artist.id, RentalClientContact -> RentalClient.id).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # ENTITIES (§1.1) - guide Table 1 + `entity_topology: graph`
  # ===========================================================================
  - section: entities
    instances:

      - name: performance_space_creation_persists_every_capability_limit
        claim_type: creation
        grounds:
          - "§1.1 PerformanceSpace declares eight input fields plus an optional `status`."
          - "§1.5 POST /performance-spaces -> 201, output PerformanceSpace, roles [CenterAdmin]."
          - "§1.0 envelope: successful writes return `{ response_type: 'entity', data: {...}, meta: {...} }`."
        distinguishing_aspect: >-
          Pins the create contract for the one entity whose fields are pure
          capability limits (rigging kg, house amps, DMX universes, changeover
          buffer): every one of them must survive the round trip untouched,
          because §1.3 technical_capability_assessment and §1.8's occupancy rule
          read them later. Supplies `status: OFFLINE` explicitly so the echo is
          proven to be an echo and not the §1.1 default.
        test_recipe:
          setup:
            - "Empty database. The clock anchor call below only repositions the logical clock to its declared start value and mutates no entity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CenterAdmin
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
          trigger:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Studio Theatre"
                seat_capacity: 240
                base_facility_fee_cents: 180000
                load_in_day_fee_cents: 60000
                changeover_buffer_minutes: 90
                rigging_capacity_kg: 1800
                house_power_amps: 200
                dmx_universes: 2
                status: "OFFLINE"
              captures: { space_id: "$.data.id" }
          assert:
            - "201 with response_type 'entity'."
            - "All eight capability fields echo exactly: seat_capacity 240, base_facility_fee_cents 180000, load_in_day_fee_cents 60000, changeover_buffer_minutes 90, rigging_capacity_kg 1800, house_power_amps 200, dmx_universes 2."
            - "status == 'OFFLINE' - the supplied value wins over the §1.1 default ACTIVE."
            - "id is a bare 36-character UUID (no prefix), version == 1, created_at == updated_at, both ISO-8601 UTC with milliseconds."

      - name: rental_engagement_read_exposes_three_independent_state_dimensions
        claim_type: retrieval
        grounds:
          - "§1.1 Engagement carries lifecycle_status, financial_clearance and ticketing_status as three separate computed dimensions."
          - "§1.2 declares initial states DRAFT / UNASSESSED / TICKETING_UNSET."
          - "§1.5 GET /engagements/{id} is readable by all eight roles and takes no body."
        distinguishing_aspect: >-
          A pure read that proves the stored row - not a synthesised view -
          carries all three dimensions plus the money fields written at creation.
          Distinct from the creation-response claim below: this asserts the GET
          projection, including that the RENTAL discriminator leaves artist_id
          null while facility_fee_cents / deposit_required_cents are already
          populated.
        test_recipe:
          setup:
            - "Grand Hall exists: 1200 seats, base_facility_fee_cents 500000, load_in_day_fee_cents 200000, changeover_buffer_minutes 120, rigging 5000 kg, 400 A, 4 DMX universes, status ACTIVE (default)."
            - "Rental client 'Meridian Dance Company' exists: credit_rating A, is_nonprofit false, outstanding_balance_cents 0 (default)."
            - "One RENTAL engagement exists for that client on Grand Hall with performance_day_count 1 and load_in_day_count 0, so §1.3 facility_fee gives 500000*1 = 500000 with no multi-day discount and no capacity surcharge (1200 seats), and deposit_requirement gives ceil_100(round_half_up(0.25*500000)) = 125000."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Meridian Spring Program", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 0 }
              captures: { engagement_id: "$.data.id" }
          trigger:
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
          assert:
            - "200 with response_type 'entity'."
            - "lifecycle_status == 'DRAFT', financial_clearance == 'UNASSESSED', ticketing_status == 'TICKETING_UNSET' - the three dimensions are all at their §1.2 initial states simultaneously."
            - "engagement_type 'RENTAL', rental_client_id == ${client_id}, artist_id == null."
            - "facility_fee_cents == 500000 and deposit_required_cents == 125000; deposit_paid_cents == 0."
            - "negotiated_fee_cents 0, artist_share_pct 0, labor_estimate_total_cents 0, additional_equipment_cost_cents 0, risk_score 0, risk_tier 'LOW', negotiation_round_count 0, cancellation_fee_cents 0, fee_accepted_by_user_id null."
            - "version == 1 - the read is side-effect free."

      - name: engagement_listing_paginates_and_filters_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - "§1.5 GET /engagements input [space_id?, artist_id?, rental_client_id?, lifecycle_status?, limit?, offset?], output Engagement[]."
          - "§1.0 list envelope: `{ response_type: 'list', data: [...], meta: { total_count, limit, offset, has_more } }` with default limit 10."
        distinguishing_aspect: >-
          The only instance that exercises the list envelope's arithmetic
          (total_count is the filtered count, not the page length; has_more is
          derived from offset+limit vs total_count) and proves a filter that
          matches nothing still returns 200 with an empty data array rather than
          a 404. Ordering is deliberately not asserted, since §1.1 declares no
          list order for this endpoint.
        test_recipe:
          setup:
            - "Grand Hall (as above) and rental client 'Meridian Dance Company' (credit A) exist."
            - "Three RENTAL engagements exist for that client on Grand Hall at non-overlapping dates: Oct 1-3, Oct 10-12 and Oct 20-22 2026. Each clears the §1.4 priority-60 occupancy check because the gaps far exceed the 120-minute changeover buffer."
            - "All three are still DRAFT, so a lifecycle_status='CANCELLED' filter must match none of them."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Booking One", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 0 }
              captures: { e1: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Booking Two", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 0 }
              captures: { e2: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Booking Three", load_in_start_utc: "2026-10-20T08:00:00Z", performance_start_utc: "2026-10-21T19:00:00Z", performance_end_utc: "2026-10-21T22:00:00Z", load_out_end_utc: "2026-10-22T02:00:00Z", performance_day_count: 1, load_in_day_count: 0 }
              captures: { e3: "$.data.id" }
          trigger:
            - call: "GET /engagements"
              as: RentalManager
              payload: { rental_client_id: "${client_id}", limit: 2, offset: 0 }
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /engagements"
              as: RentalManager
              payload: { rental_client_id: "${client_id}", limit: 2, offset: 2 }
            - call: "GET /engagements"
              as: FinanceController
              payload: { rental_client_id: "${client_id}" }
            - call: "GET /engagements"
              as: FinanceController
              payload: { rental_client_id: "${client_id}", lifecycle_status: "CANCELLED" }
          assert:
            - "Page 1: 200, response_type 'list', data length 2, meta.total_count 3, meta.limit 2, meta.offset 0, meta.has_more true."
            - "Page 2: data length 1, meta.total_count 3, meta.offset 2, meta.has_more false."
            - "The union of the two pages is exactly {${e1}, ${e2}, ${e3}} with no id repeated across pages."
            - "Unpaginated call: meta.limit == 10 (the §1.0 default), data length 3, has_more false."
            - "lifecycle_status='CANCELLED' filter: 200 with data == [] and meta.total_count == 0 - a filter miss is not a 404."

      - name: reading_absent_engagement_id_returns_engagement_not_found
        claim_type: not_found
        grounds:
          - "§1.6 ERR_ENGAGEMENT_NOT_FOUND (404)."
          - "§1.4 priority 30: the path id is resolved before any body or state check."
          - "§1.0 error envelope `{ response_type: 'error', data: { error_id, message }, meta: {...} }`."
        distinguishing_aspect: >-
          Establishes that a well-formed but unknown UUID in the path yields the
          entity-specific 404 with the standard error envelope, and that the
          same UUID shape is not confused with a validation failure (400).
        test_recipe:
          setup:
            - "No engagement has ever been created; the database is empty apart from the clock anchor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CenterAdmin
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
          trigger:
            - call: "GET /engagements/8f2a1c34-0000-4000-8000-0000000000ff"
              as: FinanceController
              captures: { err: "$.data.error_id" }
          assert:
            - "404 with response_type 'error' and data.error_id == 'ERR_ENGAGEMENT_NOT_FOUND'."
            - "data.message is a non-empty human-readable string and meta is present."
            - "The status is 404, not 400 - a syntactically valid UUID that resolves to nothing is a not-found, not an invalid request."

      - name: creating_engagement_with_missing_required_fields_is_invalid_request
        claim_type: required_fields
        grounds:
          - "§1.5 POST /engagements required input: engagement_type, space_id, title, load_in_start_utc, performance_start_utc, performance_end_utc, load_out_end_utc, performance_day_count, load_in_day_count."
          - "§1.4 priority 35 ERR_INVALID_REQUEST (400) covers missing required fields and malformed values."
        distinguishing_aspect: >-
          Pins that the required/optional split declared in §1.5 is enforced on
          the widest input surface in the scaffold, and - crucially - that a
          rejected create leaves no row behind, so the subsequent list is empty.
        test_recipe:
          setup:
            - "Grand Hall and rental client 'Meridian Dance Company' exist; no engagement exists yet."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "No Day Counts", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z" }
              captures: { err_missing: "$.data.error_id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Inverted Window", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T22:00:00Z", performance_end_utc: "2026-10-02T19:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 0 }
              captures: { err_order: "$.data.error_id" }
            - call: "GET /engagements"
              as: RentalManager
              payload: { space_id: "${space_id}" }
          assert:
            - "First call: 400 ERR_INVALID_REQUEST because performance_day_count and load_in_day_count are absent and neither has a §1.1 default."
            - "Second call: 400 ERR_INVALID_REQUEST because §1.1 requires load_in_start_utc <= performance_start_utc <= performance_end_utc <= load_out_end_utc."
            - "The list call returns meta.total_count == 0 - neither rejected create persisted a row, so no partial engagement exists."

      - name: omitted_optional_fields_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - "§1.1 UnionDepartment defaults: overtime_multiplier 1.5, doubletime_multiplier 2.0, call_minimum_hours 4, meal_penalty_cents 3500."
          - "§1.1 PerformanceSpace.status default ACTIVE; RentalClient.outstanding_balance_cents default 0; EquipmentItem.reserve_funded default false and reserved_qty default 0."
          - "§1.5 marks exactly those keys optional with a `?` suffix."
        distinguishing_aspect: >-
          One instance that sweeps every default-bearing optional across four
          different entities in a single chain. These four defaults are the
          inputs to §1.3 labor_cost, the §1.4 priority-55 offline check and the
          deposit arrears branch, so a wrong default silently corrupts three
          other rules rather than failing loudly here.
        test_recipe:
          setup:
            - "Empty database; the clock anchor is a no-op."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CenterAdmin
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
          trigger:
            - call: "POST /union-departments"
              as: CenterAdmin
              payload: { department: "STAGEHANDS", roster_size: 20, straight_hourly_rate_cents: 5000 }
              captures: { dept_id: "$.data.id" }
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /equipment-items"
              as: CenterAdmin
              payload: { category: "POWER_DISTRO", model_name: "400A Distro", on_hand_qty: 4, daily_rate_cents: 25000, replacement_value_cents: 900000 }
              captures: { item_id: "$.data.id" }
          assert:
            - "Department: overtime_multiplier == 1.5, doubletime_multiplier == 2.0, call_minimum_hours == 4, meal_penalty_cents == 3500 - all four omitted keys defaulted."
            - "Space: status == 'ACTIVE' (contrast with the creation instance, which supplied OFFLINE explicitly)."
            - "Client: outstanding_balance_cents == 0, so the §1.3 deposit_requirement arrears branch is off by default."
            - "Equipment item: reserve_funded == false and reserved_qty == 0."
            - "All four rows come back with version == 1."

      - name: computed_money_fields_are_written_by_the_server_per_engagement_type
        claim_type: computed_fields
        grounds:
          - "§1.1 Engagement.facility_fee_cents and deposit_required_cents are `source: computed`; neither appears in §1.5 POST /engagements `input`."
          - "§1.3 facility_fee and deposit_requirement both return 0 for engagement_type PRESENTED."
        distinguishing_aspect: >-
          Uses the type discriminator as the discriminating axis: two creates
          against the same space, one RENTAL and one PRESENTED, must produce
          different computed money fields from the same space rate card. That
          rules out an implementation that computes the fee from the space alone
          and ignores the polymorphic branch.
        test_recipe:
          setup:
            - "Grand Hall exists (1200 seats, 500000 per performance day, 200000 per load-in day, 120-minute buffer)."
            - "Rental client 'Meridian Dance Company' (credit A, not a nonprofit, outstanding 0) exists."
            - "Artist 'Cadence Quartet' exists with routing_window 2026-09-01 -> 2026-12-31, min_days_between_engagements 0, historical_sell_through_pct 0.8, guarantee_floor_cents 200000, so the PRESENTED window below sits inside the routing window (§1.4 priority 62 satisfied)."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Meridian Rental", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { rental_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { presented_id: "$.data.id" }
          assert:
            - "RENTAL row: facility_fee_cents == 700000 (500000*1 + 200000*1, no multi-day discount at 1 performance day, no surcharge at 1200 seats) and deposit_required_cents == 175000 (ceil_100(round_half_up(0.25*700000)))."
            - "PRESENTED row: facility_fee_cents == 0 and deposit_required_cents == 0 despite an identical rate card and identical day counts."
            - "Both values appear in the create response body itself - neither field is in the endpoint's `input` list, so they can only have been computed server side."
            - "labor_estimate_total_cents, additional_equipment_cost_cents, deposit_paid_cents, risk_score, realized_gross_cents and realized_margin_cents are all 0 on both rows."

      - name: system_fields_are_minted_at_creation_and_version_advances_per_write
        claim_type: system_fields
        grounds:
          - "§1.0 common fields: id, created_at, updated_at, version; `source: system` fields are never client supplied."
          - "§1.1 Engagement.fee_accepted_by_user_id is `source: system`, default null."
          - "§1.5 POST /engagements/{id}/record-deposit side effect: deposit_paid_cents increased, engagement.version incremented."
        distinguishing_aspect: >-
          The only instance that watches the system-field triple across a write:
          created_at must be frozen while updated_at and version move. It also
          pins that fee_accepted_by_user_id starts null - the field the §1.7
          segregation-of-duties rule later compares against.
        test_recipe:
          setup:
            - "Grand Hall and rental client 'Meridian Dance Company' (credit A) exist."
            - "A RENTAL engagement exists on Grand Hall with performance_day_count 1 and load_in_day_count 1, so facility_fee_cents is 700000 and deposit_required_cents is 175000."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "System Field Probe", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id", created_at_0: "$.data.created_at" }
            - call: "POST /engagements/${engagement_id}/record-deposit"
              as: RentalManager
              payload: { amount_cents: 175000 }
          assert:
            - "Create response: id is a bare UUID, version == 1, created_at == updated_at, fee_accepted_by_user_id == null."
            - "After record-deposit: version == 2 and deposit_paid_cents == 175000."
            - "created_at is byte-identical to ${created_at_0} after the write, while updated_at is strictly greater than created_at."
            - "The client never supplied id, created_at, updated_at or version - none of them appears in the §1.5 `input` list for either endpoint."

      - name: rental_client_with_unknown_credit_rating_enum_is_invalid_request
        claim_type: type_constraints
        grounds:
          - "§1.1 RentalClient.credit_rating enum [A, B, C]; Engagement.performance_day_count constraint >= 1."
          - "§1.4 priority 35 ERR_INVALID_REQUEST (400) covers enum and numeric-range violations."
        distinguishing_aspect: >-
          Separates the two flavours of §1.1 type constraint - a closed enum and
          a numeric floor - in one instance, and asserts a value just outside the
          numeric bound (0, one below the declared minimum of 1) rather than a
          wildly wrong value.
        test_recipe:
          setup:
            - "Grand Hall exists, plus a valid rental client 'Meridian Dance Company' with credit_rating A so the second trigger fails on the day count alone."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Unrated Consortium", contact_email: "ops@unrated.example", credit_rating: "AA", is_nonprofit: false }
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Zero Day Booking", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 0, load_in_day_count: 0 }
              captures: { err_range: "$.data.error_id" }
          assert:
            - "First call: 400 ERR_INVALID_REQUEST - 'AA' is outside the declared enum even though it looks like a plausible credit grade."
            - "Second call: 400 ERR_INVALID_REQUEST - performance_day_count 0 violates the >= 1 constraint; the request is rejected before §1.3 facility_fee would have produced a 0 fee."
            - "Neither rejected row exists afterwards: a GET /engagements filtered by space_id reports meta.total_count 0."

      - name: reserve_ledger_entry_is_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - "§1.1 ReserveLedgerEntry declares `common_fields: false` - only id and created_at, no updated_at and no version."
          - "§1.5 exposes POST /reserve-ledger-entries, GET /reserve-ledger-entries and GET /engagements/{id}/reserve-ledger-entries and no PUT/PATCH/DELETE for the entity."
          - "§1.1 balance_after_cents is the running total over entries ordered by created_at ASC."
        distinguishing_aspect: >-
          Proves immutability positively rather than by attempting a mutation
          against an undeclared verb: a second entry must leave the first row's
          balance_after_cents frozen at its historical value, which is exactly
          what an in-place-updating implementation would break.
        test_recipe:
          setup:
            - "Empty ledger; no engagement is involved, so both entries are center-level with engagement_id null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CenterAdmin
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
          trigger:
            - call: "POST /reserve-ledger-entries"
              as: CenterAdmin
              payload: { entry_type: "OPENING_BALANCE", amount_cents: 8000000, memo: "FY27 capital reserve opening balance" }
              captures: { entry1: "$.data.id" }
            - call: "POST /reserve-ledger-entries"
              as: CenterAdmin
              payload: { entry_type: "MANUAL_ADJUSTMENT", amount_cents: -1000000, memo: "Transfer to orchestra shell purchase" }
              captures: { entry2: "$.data.id" }
            - call: "GET /reserve-ledger-entries"
              as: FinanceController
              payload: { limit: 10, offset: 0 }
          assert:
            - "Both creates return 201 with id and created_at present and NO `version` and NO `updated_at` key in data - §1.1 common_fields is false for this entity."
            - "First entry balance_after_cents == 8000000; second entry balance_after_cents == 7000000 (running total, signed amount)."
            - "The listing shows meta.total_count == 2 and the OPENING_BALANCE row still reports balance_after_cents == 8000000 - appending never rewrote history."
            - "engagement_id is null on both rows (the optional key was omitted)."

      - name: labor_call_under_unknown_department_returns_department_not_found
        claim_type: parent_relationships
        grounds:
          - "§1.1 LaborCall.parent is Engagement and LaborCall.union_department_id is `FK -> UnionDepartment.id`."
          - "§1.4 priority 30 resolves path ids (ERR_ENGAGEMENT_NOT_FOUND) before priority 32 resolves body ids (ERR_DEPARTMENT_NOT_FOUND)."
        distinguishing_aspect: >-
          Covers both halves of a child's referential contract in one instance -
          the path parent and the body FK - and pins the ordering between them by
          issuing a call in which the parent is missing and the body reference is
          valid, then the reverse.
        test_recipe:
          setup:
            - "Grand Hall, rental client 'Meridian Dance Company' (credit A) and a RENTAL engagement (Oct 1-3 2026) exist."
            - "UnionDepartment STAGEHANDS exists with roster_size 20 and straight_hourly_rate_cents 5000, so the valid-department call would otherwise succeed."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /union-departments"
              as: CenterAdmin
              payload: { department: "STAGEHANDS", roster_size: 20, straight_hourly_rate_cents: 5000 }
