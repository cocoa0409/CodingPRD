  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_auth_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request sent with no X-User-Role / X-User-ID headers fails priority 1 with 401 ERR_UNAUTHENTICATED before any role or existence check."
        test_recipe:
          setup: ["one project exists (created out-of-band is impossible; create it as AgencyAdmin first)"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "AuthProbe", permit_number: "P-VAL-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id}
          trigger:
            - call: "GET /api/projects/${proj_id}"
              captures: {err: $.data.error_id}
          assert:
            - "http status 401 and error_id == ERR_UNAUTHENTICATED"

      - name: dispatch_nonexistent_assignment_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 3) precedes state: dispatching a well-formed but nonexistent assignment id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/assignments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/dispatch"
              payload: {}
              as: ProjectManager
              captures: {err: $.data.error_id}
          assert:
            - "http status 404 and error_id == ERR_NOT_FOUND"

      - name: duplicate_daily_report_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_DAILY_REPORT]"]
        distinguishing_aspect: "One DIR per (project, technician, report_date): a second submission with the same triple fails ERR_DUPLICATE_DAILY_REPORT even with a disjoint assignment list."
        test_recipe:
          setup: ["project with APPROVED SSI (soil item required_count 3), technician t1, two COMPLETED assignments (2026-05-04 09:00-10:00 and 10:00-11:00, each with a conforming test), first DIR for 2026-05-04 covering assignment 1"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "DupDIR", permit_number: "P-VAL-2", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 3, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {a1: $.data.id}
            - call: "POST /api/assignments/${a1}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${a1}", measured_values: { field_dry_density_pcf: 118.0 } }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/assignments/${a1}/complete"
              payload: { completion_note: "done" }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "10:00", end_time: "11:00" }
              as: ProjectManager
              captures: {a2: $.data.id}
            - call: "POST /api/assignments/${a2}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${a2}", measured_values: { field_dry_density_pcf: 118.0 } }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/assignments/${a2}/complete"
              payload: { completion_note: "done" }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/daily-reports"
              payload: { project_id: "${proj_id}", report_date: "2026-05-04", assignment_ids: ["${a1}"], summary: "morning shift" }
              as: Technician
              as_user_id: "${t1}"
          trigger:
            - call: "POST /api/daily-reports"
              payload: { project_id: "${proj_id}", report_date: "2026-05-04", assignment_ids: ["${a2}"], summary: "afternoon shift" }
              as: Technician
              as_user_id: "${t1}"
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_DUPLICATE_DAILY_REPORT (same project + technician + report_date), even though a2 is a valid uncovered assignment"

      - name: dir_assignment_work_date_mismatch_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=8]", "errors[ERR_REFERENCE_MISMATCH]"]
        distinguishing_aspect: "DIR coverage is referential: a report dated 2026-05-05 referencing an assignment whose work_date is 2026-05-04 fails ERR_REFERENCE_MISMATCH."
        test_recipe:
          setup: ["project with APPROVED SSI (soil item), technician t1, one COMPLETED assignment worked 2026-05-04 (conforming test recorded)"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "DIRMismatch", permit_number: "P-VAL-3", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {a1: $.data.id}
            - call: "POST /api/assignments/${a1}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${a1}", measured_values: { field_dry_density_pcf: 118.0 } }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/assignments/${a1}/complete"
              payload: { completion_note: "done" }
              as: Technician
              as_user_id: "${t1}"
          trigger:
            - call: "POST /api/daily-reports"
              payload: { project_id: "${proj_id}", report_date: "2026-05-05", assignment_ids: ["${a1}"], summary: "wrong date" }
              as: Technician
              as_user_id: "${t1}"
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_REFERENCE_MISMATCH (report_date != assignment.work_date)"

      - name: schedule_break_wrong_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_BREAK_DATE_MISMATCH]"]
        distinguishing_aspect: "The break must be booked exactly on date(break_due_at): scheduling a 7-day set (due 2026-05-08) on 2026-05-09 fails ERR_BREAK_DATE_MISMATCH before any capacity check."
        test_recipe:
          setup: ["project with APPROVED SSI (concrete item), lab, technician t1, DISPATCHED assignment, one CAST sample cast 2026-05-01T08:00 age 7 (due 2026-05-08)"]
          setup_api_calls:
            - call: "POST /api/labs"
              payload: { name: "Lab One", lab_code: "L1", daily_break_capacity: 10 }
              as: AgencyAdmin
              captures: {lab_id: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: CONCRETE_STRENGTH, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/projects"
              payload: { name: "BreakDate", permit_number: "P-VAL-4", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: CONCRETE_STRENGTH, description: "footings", required_cert_level: 1, required_count: 1 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-01", start_time: "08:00", end_time: "09:00" }
              as: ProjectManager
              captures: {asg: $.data.id}
            - call: "POST /api/assignments/${asg}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg}", lab_id: "${lab_id}", cast_at: "2026-05-01T08:00:00Z", required_break_age_days: 7 }
              as: Technician
              as_user_id: "${t1}"
