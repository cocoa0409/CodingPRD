          assert:
            - "Trigger 1: HTTP 200; posture stays 'PUBLISHED_FULL', open_lift_capacity_pph == 1800, raw_ccc == 1080 and guest_capacity == 918 - wind exactly AT the threshold is inert."
            - "Trigger 2: service_status == 'OPEN' and wind_hold_since == null."
            - "Trigger 3: HTTP 200; the response body reports posture 'PUBLISHED_PARTIAL', open_terrain_count 0, terrain_open_acres 0.0, open_lift_capacity_pph 0, raw_ccc 0, guest_capacity 0 and non_season_pool 0 - one tenth of a mile per hour above the threshold shuts the mountain."
            - "Trigger 4: service_status == 'WIND_HOLD' and wind_hold_since == '2026-08-01T00:00:00Z'."
