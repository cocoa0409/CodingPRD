              as: Manufacturer
              as_user_id: "${mfr_p_id}"
              captures: { fil_p1_id: $.data.id }
            - call: "POST /dealer-board/franchise-filings"
              payload: { manufacturer_id: "${mfr_p_id}", filing_type: "ADDITIONAL_POINT", proposed_effective_on: "2026-11-16", site_x_km: 14.4, site_y_km: 19.2 }
