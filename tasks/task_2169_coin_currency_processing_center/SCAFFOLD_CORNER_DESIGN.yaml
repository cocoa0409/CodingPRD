            - "SealedBag.${b_id}.version == 4"
            - "GET /cash-vault/count-sessions?sealed_bag_id=${b_id} returns total_count 1"

      - name: stale_vault_version_rejects_coin_order_release
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[coin-order-release-stale-vault]
          - validations[priority=35]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "An inventory adjustment between the client's read of Vault.version and the release advances that version, so the release carrying the earlier value is rejected with ERR_STALE_VERSION at 412 and no boxes leave the vault; retrying with the freshly read version succeeds."
        test_recipe:
          setup:
            - "Vault CV-C53 with QUARTER on_hand_boxes 10; CustomerAccount ACC-C53 ACTIVE."
            - "A CoinOrder for 2 QUARTER boxes approved to APPROVED_FULL by u-mgr-1; the client reads Vault.version, then a +1 QUARTER adjustment advances it."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C53", name: "OCC Vault Release" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C53", customer_name: "OCC Coin Cafe", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /cash-vault/vaults/${v_id}/inventory-adjustments"
              payload: { denomination: "QUARTER", delta_boxes: 10 }
              as: VaultManager
              as_user_id: "u-mgr-1"
            - call: "POST /cash-vault/coin-orders"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", pickup_window_start: "2026-08-05T10:00:00Z", pickup_window_end: "2026-08-05T12:00:00Z", lines: [ { denomination: "QUARTER", boxes_requested: 2 } ] }
              as: CustomerAccountHolder
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id }
            - call: "POST /cash-vault/coin-orders/${o_id}/approve"
              payload: { allow_partial: false }
              as: VaultManager
              as_user_id: "u-mgr-1"
            - call: "GET /cash-vault/vaults/${v_id}"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { v_stale: $.data.version }
            - call: "POST /cash-vault/vaults/${v_id}/inventory-adjustments"
              payload: { denomination: "QUARTER", delta_boxes: 1 }
              as: VaultManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /cash-vault/coin-orders/${o_id}/release"
              payload: { expected_vault_version: "${v_stale}" }
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { err: $.data.error_id }
            - call: "GET /cash-vault/vaults/${v_id}"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { v_fresh: $.data.version }
            - call: "POST /cash-vault/coin-orders/${o_id}/release"
              payload: { expected_vault_version: "${v_fresh}" }
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { o_status: $.data.status }
          assert:
            - "${err} == ERR_STALE_VERSION"
            - "HTTP status of the first trigger call == 412"
            - "${o_status} == RELEASED"
            - "VaultInventory for (${v_id}, QUARTER).on_hand_boxes == 9"
            - "VaultInventory for (${v_id}, QUARTER).reserved_boxes == 0"
            - "CustomerAccount.${a_id}.ledger_balance_cents == -100000"
            - "Vault.${v_id}.coin_face_value_on_hand_cents == 450000"

      - name: cascading_side_effects_across_four_entities
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CounterfeitReport.DRAFT_to_SUBMITTED
        excluded_because:
          difficulty_instance: counterfeit_submit_cascades_lot_to_bag_to_ticket_to_account
          rationale: "The four-hop chain and every intermediate field value are asserted there."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.deposit_credit_amount
        excluded_because:
          difficulty_instance: deposit_credit_provisional_vs_final_diverge_on_same_ticket
          rationale: "Both variants are computed on the same ticket and compared there."

      - name: rate_threshold_trigger_at_materiality_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - global_constants.VARIANCE_MATERIALITY_CENTS
        excluded_because:
          difficulty_instance: variance_materiality_flags_at_exactly_2500_but_not_at_2499
          rationale: "The >= boundary at exactly the threshold and one cent below it is asserted there."

