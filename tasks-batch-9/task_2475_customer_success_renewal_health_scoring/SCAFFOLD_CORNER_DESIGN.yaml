            - "SavePlay.${sp_id}.state == \"SUCCEEDED\" and outcome_note == \"Adoption recovered\"."
            - "Account.${acct_id}.open_save_play_count == 0."

      - name: archived_account_rejects_every_further_lifecycle_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Account.WIN_BACK_TARGETED_to_ARCHIVED
          - validations[priority=11]
          - errors.ERR_ACCOUNT_LIFECYCLE_INVALID
        distinguishing_aspect: "ARCHIVED is the Account terminal state: a REACTIVATE that would be legal from WIN_BACK_TARGETED returns ERR_ACCOUNT_LIFECYCLE_INVALID (409) once the account is ARCHIVED, and coverage_posture stays FROZEN."
        test_recipe:
          setup:
            - "One ENTERPRISE Account driven ONBOARDING -> CHURNED (root cause PRODUCT_GAP) -> WIN_BACK_TARGETED (offer 500 bp) -> ARCHIVED."
            - "No ExpansionOpportunity rows, so the ARCHIVE precondition holds."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/lifecycle"
              payload: { action: "CHURN", churn_root_cause_code: "PRODUCT_GAP" }
              as: CsOpsAdmin
            - call: "POST /accounts/${acct_id}/lifecycle"
              payload: { action: "WIN_BACK_TARGET", win_back_offer_bp: 500 }
              as: CsOpsAdmin
            - call: "POST /accounts/${acct_id}/lifecycle"
              payload: { action: "ARCHIVE" }
              as: CsOpsAdmin
          trigger:
            - call: "POST /accounts/${acct_id}/lifecycle"
              payload: { action: "REACTIVATE", new_contract_end_date: "2027-06-30" }
              as: CsOpsAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_ACCOUNT_LIFECYCLE_INVALID\"."
            - "Account.${acct_id}.lifecycle_state == \"ARCHIVED\" (unchanged)."
            - "Account.${acct_id}.coverage_posture == \"FROZEN\" and coverage_tier == \"DIGITAL\"."
            - "Account.${acct_id}.contract_end_date == \"2026-12-31\" (the rejected call wrote nothing)."
            - "Account.${acct_id}.renewal_likelihood == \"OMIT\"."

      - name: milestone_complete_twice_rejects_the_second_attempt
        claim_type: idempotency
        grounds:
          - state_machines.OnboardingMilestone.PENDING_to_COMPLETED
          - state_machines.Account.ONBOARDING_to_ADOPTING
          - validations[priority=12]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "Replaying COMPLETE on an already COMPLETED milestone returns ERR_INVALID_STATE_TRANSITION (409) rather than silently re-stamping completed_date, and the account stays ADOPTING with days_late 0."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
