              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (state precondition, priority 6, wins over the fiscal overpayment check at priority 14)"
            - "Order.${order_id}.collected_cents == 50000 and refunded_cents == 45000 (unchanged by the rejected payment)"

      - name: amend_anchor_safety_beats_config_bounds
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_ANCHOR_REQUIRED]
          - errors[ERR_CONFIG_OUT_OF_BOUNDS]
        distinguishing_aspect: |
          Category pair BUSINESS_SAFETY vs BUSINESS_CONSTRAINT: one amend
          violating BOTH the wind-code anchor rule (anchor_type NONE under
          anchoring_required) AND model dimension bounds (width 20 > max 16)
          must return ERR_ANCHOR_REQUIRED (priority 7) before
          ERR_CONFIG_OUT_OF_BOUNDS (priority 8).
        test_recipe:
          setup:
            - "Jurisdiction with anchoring_required == true; a DRAFT 10x12 order"
          setup_api_calls:
