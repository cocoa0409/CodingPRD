      - call: POST /api/zones
        payload:
          account_id: ${acc_f}
          domain_name: free.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.10
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc_f}
        captures:
          zone_f: $.data.id
      - call: POST /api/zones/${zone_f}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc_f}
      - call: POST /api/zones
        payload:
          account_id: ${acc_p}
          domain_name: pro.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
