scenario: |
  Connected Vehicle Emergency Response & Subscription Services (OnStar): automatic crash notification triggered by sensor thresholds with advisor connection and severity data transmission, emergency dispatch coordination with location transfer to public safety answering points, subscription plan tiers covering emergency services, remote commands, navigation and data connectivity, trial period conversion and lapse handling with retention of emergency-only functionality decisions, stolen vehicle assistance with law enforcement verification before remote slowdown, vehicle diagnostics reporting and dealer service scheduling integration, driver data collection and sharing consent including insurance program participation, coverage limitations in areas without cellular service

domain_name: connected-vehicle-emergency-services
api_prefix: /accounts

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PlanTier
    parent: null
    common_fields: true
    fields:
      - { name: code, type: enum, source: input, description: "Tier code", constraints: "enum {EMERGENCY_ONLY, SAFETY, SAFETY_REMOTE, PREMIUM}; unique" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly fee in cents", constraints: ">= 0" }
      - { name: allows_emergency, type: boolean, source: input, description: "Entitles automatic crash notification and SOS dispatch" }
      - { name: allows_remote_commands, type: boolean, source: input, description: "Entitles lock/unlock/horn/locate remote commands" }
      - { name: allows_navigation, type: boolean, source: input, description: "Entitles turn-by-turn navigation" }
      - { name: allows_data_gb, type: number, source: input, description: "Monthly data allowance in GB; 0 means no data connectivity entitlement", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle of the tier definition", constraints: "enum {ACTIVE, RETIRED}; default ACTIVE" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Account holder legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across accounts" }
      - { name: phone, type: string, source: input, description: "Contact phone in E.164 form" }
      - { name: home_region_code, type: string, source: input, description: "Home region used to seed coverage evaluation", constraints: "2-letter region code" }
      - { name: status, type: enum, source: system, description: "Account lifecycle", constraints: "enum {ACTIVE, CLOSED}; default ACTIVE" }

  - name: Vehicle
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number; unique", constraints: "exactly 17 chars, uppercase alnum minus I/O/Q" }
      - { name: make, type: string, source: input, description: "Manufacturer" }
      - { name: model, type: string, source: input, description: "Model name" }
      - { name: model_year, type: integer, source: input, description: "Model year", constraints: ">= 2015" }
      - { name: region_code, type: string, source: input, description: "Primary operating region; must be covered for telematics", constraints: "2-letter region code" }
      - { name: hardware_generation, type: integer, source: input, description: "Telematics hardware generation", constraints: "enum-as-int {4, 5}; gen 5 required for remote slowdown" }
      - { name: status, type: enum, source: system, description: "Vehicle registration lifecycle", constraints: "enum {ACTIVE, STOLEN_REPORTED, RECOVERED, DECOMMISSIONED}; default ACTIVE" }

  - name: Subscription
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; covered vehicle" }
      - { name: tier_code, type: string, source: input, description: "FK -> PlanTier.code; current tier; changed via convert/re-tier" }
      - { name: status, type: enum, source: system, description: "Subscription lifecycle", constraints: "enum {TRIAL, ACTIVE, PAST_DUE, LAPSED, EMERGENCY_RETAINED, CANCELLED}" }
      - { name: trial_start_date, type: datetime, source: system, description: "Set at creation to the logical clock date" }
      - { name: trial_end_date, type: datetime, source: computed, description: "trial_start_date + 30 days; converting before this date waives the conversion fee" }
      - { name: current_period_start, type: datetime, source: system, description: "Start of the current billing period (creation date or last renewal)" }
      - { name: next_renewal_date, type: datetime, source: computed, description: "current_period_start + 30 days while ACTIVE; null otherwise" }
      - { name: lapse_date, type: datetime, source: system, description: "Date the subscription entered LAPSED; null otherwise; drives the emergency-retention decision window" }
      - { name: emergency_only_flag, type: boolean, source: computed, description: "True when status is EMERGENCY_RETAINED or when an ACTIVE subscription sits on a tier with allows_emergency true and all other entitlements false" }
      - { name: period_remote_commands_used, type: integer, source: computed, description: "Count of RemoteCommand rows for this subscription in the current period (see calculations.remote_command_cap)" }
      - { name: conversion_fee_paid_cents, type: integer, source: system, description: "Fee charged on trial conversion per calculations.conversion_fee; 0 when waived" }

  - name: CoverageZone
    parent: null
    common_fields: true
    fields:
      - { name: region_code, type: string, source: input, description: "Region code this zone maps", constraints: "2-letter region code; unique" }
      - { name: has_cellular, type: boolean, source: input, description: "Whether cellular telematics service is available in the region" }
      - { name: supports_data, type: boolean, source: input, description: "Whether data connectivity is offered in the region" }
      - { name: supports_navigation, type: boolean, source: input, description: "Whether navigation services are offered in the region" }

  - name: CrashEvent
    parent: Vehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; vehicle that reported the crash" }
      - { name: subscription_id, type: string, source: computed, description: "FK -> Subscription.id; entitlement snapshot resolved at acceptance time" }
      - { name: delta_v_kph, type: number, source: input, description: "Delta-V of the impact in kph; severity threshold input", constraints: ">= 0" }
      - { name: rollover_detected, type: boolean, source: input, description: "Rollover sensor flag", default: false }
      - { name: airbag_deployed, type: boolean, source: input, description: "Airbag deployment flag", default: false }
      - { name: location_region_code, type: string, source: input, description: "Region where the crash occurred; drives coverage gating" }
      - { name: severity_score, type: number, source: computed, description: "Per calculations.crash_severity" }
      - { name: severity_band, type: enum, source: computed, description: "Per calculations.severity_band", constraints: "enum {MINOR, MODERATE, SEVERE}" }
      - { name: status, type: enum, source: system, description: "Crash event lifecycle", constraints: "enum {RECEIVED, ADVISOR_CONNECTED, DISPATCH_COORDINATED, CLOSED_NO_INJURY, CLOSED_DISPATCHED, REJECTED_NO_COVERAGE, REJECTED_NO_ENTITLEMENT}" }

  - name: DispatchRequest
    parent: Vehicle
    common_fields: true
    fields:
      - { name: crash_event_id, type: string, source: system, description: "FK -> CrashEvent.id; originating crash event" }
      - { name: psap_id, type: string, source: input, description: "FK -> PSAP.id; answering point selected by coverage_zone mapping" }
      - { name: status, type: enum, source: system, description: "Dispatch lifecycle", constraints: "enum {PENDING, LOCATION_SENT, ACKNOWLEDGED, CANCELLED}" }
      - { name: location_payload, type: object, source: computed, description: "Lat/long/severity snapshot sent to the PSAP at LOCATION_SENT" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Logical-clock timestamp when the PSAP acknowledged; null until ACKNOWLEDGED" }

  - name: PSAP
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Public safety answering point name" }
      - { name: region_code, type: string, source: input, description: "Region this PSAP serves", constraints: "2-letter region code" }
      - { name: accepts_location_transfer, type: boolean, source: input, description: "Whether the PSAP can receive digital location payloads", default: true }
      - { name: status, type: enum, source: system, description: "PSAP onboarding state", constraints: "enum {ACTIVE, SUSPENDED}; default ACTIVE" }

  - name: StolenVehicleCase
    parent: Vehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; reported vehicle" }
      - { name: police_report_number, type: string, source: input, description: "Law enforcement report number; unique" }
      - { name: reporting_agency, type: string, source: input, description: "Agency name" }
      - { name: status, type: enum, source: system, description: "Case lifecycle", constraints: "enum {REPORTED, VERIFIED, SLOWDOWN_ARMED, SLOWDOWN_EXECUTED, CLOSED_RECOVERED, CLOSED_UNVERIFIED}" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the LawEnforcement who verified; must differ from the reporter (segregation of duties)" }
      - { name: slowdown_executed_at, type: datetime, source: system, description: "Logical-clock timestamp of slowdown execution; null until executed" }

  - name: RemoteCommand
    parent: Vehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; target vehicle" }
      - { name: subscription_id, type: string, source: computed, description: "FK -> Subscription.id; entitlement snapshot at acceptance" }
      - { name: command_type, type: enum, source: input, description: "Command kind", constraints: "enum {LOCK, UNLOCK, HORN_LIGHTS, LOCATE}" }
      - { name: status, type: enum, source: system, description: "Command lifecycle", constraints: "enum {PENDING, SENT, ACKNOWLEDGED, FAILED, EXPIRED}" }
      - { name: is_emergency_command, type: boolean, source: computed, description: "True when accepted under EMERGENCY_RETAINED emergency-only entitlement (LOCATE only)" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + 10 minutes; system flips PENDING/SENT to EXPIRED at expiry" }

  - name: DiagnosticReport
    parent: Vehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; source vehicle" }
      - { name: odometer_km, type: integer, source: input, description: "Odometer reading at report time", constraints: ">= 0; monotonically non-decreasing per vehicle" }
      - { name: engine_hours, type: integer, source: input, description: "Engine hours at report time", constraints: ">= 0" }
      - { name: dtc_codes, type: array, source: input, description: "Diagnostic trouble codes; empty array means a clean report", default: "[]" }
      - { name: oil_life_pct, type: integer, source: input, description: "Remaining oil life percent", constraints: "0..100" }
      - { name: health_score, type: integer, source: computed, description: "Per calculations.health_score; 0..100" }
      - { name: status, type: enum, source: system, description: "Report lifecycle", constraints: "enum {GENERATED, SERVICE_SCHEDULED}" }

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dealership name" }
      - { name: region_code, type: string, source: input, description: "Region the dealer operates in", constraints: "2-letter region code" }
      - { name: service_capacity_per_day, type: integer, source: input, description: "Max service appointments per calendar day", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "Dealer onboarding state", constraints: "enum {ACTIVE, SUSPENDED}; default ACTIVE" }

  - name: ServiceAppointment
    parent: Dealer
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; servicing dealer" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle to service" }
      - { name: diagnostic_report_id, type: string, source: input, description: "FK -> DiagnosticReport.id; report motivating the appointment" }
      - { name: scheduled_date, type: string, source: input, description: "Service day, ISO date; must be strictly in the future relative to the logical clock" }
      - { name: status, type: enum, source: system, description: "Appointment lifecycle", constraints: "enum {REQUESTED, CONFIRMED, COMPLETED, CANCELLED}" }

  - name: DataConsent
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; consenting account" }
      - { name: consent_type, type: enum, source: input, description: "Consent scope", constraints: "enum {DRIVING_DATA_COLLECTION, INSURANCE_PROGRAM_SHARING}" }
      - { name: status, type: enum, source: system, description: "Consent lifecycle", constraints: "enum {GRANTED, REVOKED, SUPERSEDED}; cyclic — revoked consents may be re-granted" }
      - { name: granted_at, type: datetime, source: system, description: "Logical-clock timestamp of the latest grant" }
      - { name: revoked_at, type: datetime, source: system, description: "Logical-clock timestamp of the latest revocation; null while GRANTED" }
      - { name: effective_score, type: number, source: computed, description: "Per calculations.insurance_score; only maintained while INSURANCE_PROGRAM_SHARING is GRANTED; null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Subscription
    initial_state: TRIAL
    terminal_states: [CANCELLED]
    transitions:
      - from: TRIAL
        to: ACTIVE
        trigger: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/convert"
        actor: Account
        preconditions:
          - "Subscription status == TRIAL"
          - "expected_subscription_version matches current version (OCC)"
        side_effects:
          - "conversion_fee_paid_cents set per calculations.conversion_fee (waived when converted before trial_end_date)"
          - "current_period_start := logical clock date; next_renewal_date := +30 days"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/billing-events with outcome == PAYMENT_FAILED"
        actor: BillingAdmin
        preconditions:
          - "Subscription status == ACTIVE"
        side_effects:
          - "next_renewal_date unchanged; retry window opens for 10 days"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/billing-events with outcome == PAYMENT_SUCCEEDED"
        actor: BillingAdmin
        preconditions:
          - "Subscription status == PAST_DUE"
        side_effects:
          - "current_period_start := logical clock date; next_renewal_date := +30 days; period_remote_commands_used := 0"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/billing-events with outcome == PAYMENT_SUCCEEDED (renewal)"
        actor: BillingAdmin
        preconditions:
          - "Subscription status == ACTIVE"
        side_effects:
          - "current_period_start := logical clock date; next_renewal_date := +30 days; period_remote_commands_used := 0"
      - from: PAST_DUE
        to: LAPSED
        trigger: "system: logical clock reaches lapse_date (PAST_DUE entry + 10 days) with no successful payment"
        actor: system
        preconditions: []
        side_effects:
          - "lapse_date := logical clock date; next_renewal_date := null"
      - from: LAPSED
        to: EMERGENCY_RETAINED
        trigger: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/retain-emergency"
        actor: Account
        preconditions:
          - "Subscription status == LAPSED"
          - "logical clock date <= lapse_date + 30 days (retention window; reaching lapse_date + 30 exactly still qualifies)"
          - "Vehicle linked to the subscription has status == ACTIVE"
        side_effects:
          - "emergency_only_flag := true"
      - from: LAPSED
        to: CANCELLED
        trigger: "system: logical clock passes lapse_date + 30 days with no retain-emergency decision"
        actor: system
        preconditions: []
        side_effects:
          - "emergency_only_flag := false"
      - from: EMERGENCY_RETAINED
        to: CANCELLED
        trigger: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/cancel"
        actor: Account
        preconditions:
          - "Subscription status in {EMERGENCY_RETAINED}"
        side_effects:
          - "emergency_only_flag := false"
      - from: TRIAL
        to: CANCELLED
        trigger: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/cancel"
        actor: Account
        preconditions:
          - "Subscription status == TRIAL"
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/cancel"
        actor: Account
        preconditions:
          - "Subscription status == ACTIVE"
        side_effects:
          - "next_renewal_date := null"
      - from: EMERGENCY_RETAINED
        to: ACTIVE
        trigger: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/reactivate"
        actor: Account
        preconditions:
          - "Subscription status == EMERGENCY_RETAINED"
          - "expected_subscription_version matches current version (OCC)"
        side_effects:
          - "current_period_start := logical clock date; next_renewal_date := +30 days; period_remote_commands_used := 0; emergency_only_flag recomputed"
          - "increments Subscription.version by 1"
    note: "EMERGENCY_RETAINED is the retention decision: only automatic crash notification and emergency LOCATE remain; all other entitlements denied."

  - entity: CrashEvent
    initial_state: RECEIVED
    terminal_states: [CLOSED_NO_INJURY, CLOSED_DISPATCHED, REJECTED_NO_COVERAGE, REJECTED_NO_ENTITLEMENT]
    transitions:
      - from: null
        to: RECEIVED
        trigger: "POST /vehicles/{vehicleId}/crash-events (creation)"
        actor: SystemIngestion
        preconditions:
          - "CoverageZone for location_region_code has has_cellular == true, else event is created directly in REJECTED_NO_COVERAGE"
          - "Vehicle's subscription resolves (per calculations.entitlement_snapshot) to a status in {TRIAL, ACTIVE, PAST_DUE, EMERGENCY_RETAINED} with allows_emergency true, else event is created directly in REJECTED_NO_ENTITLEMENT"
          - "severity_score >= CRASH_SCORE_THRESHOLD (35), else the whole request fails with ERR_CRASH_THRESHOLD_NOT_MET and no row is persisted"
        side_effects:
          - "severity_score and severity_band computed per calculations.crash_severity / calculations.severity_band"
      - from: RECEIVED
        to: ADVISOR_CONNECTED
        trigger: "POST /vehicles/{vehicleId}/crash-events/{eventId}/connect-advisor"
        actor: Advisor
        preconditions:
          - "CrashEvent status == RECEIVED"
        side_effects:
          - "severity data transmission logged (severity_score, severity_band, airbag_deployed, rollover_detected)"
      - from: ADVISOR_CONNECTED
        to: DISPATCH_COORDINATED
        trigger: "POST /vehicles/{vehicleId}/crash-events/{eventId}/dispatch-requests (creates DispatchRequest PENDING then LOCATION_SENT)"
        actor: Advisor
        preconditions:
          - "CrashEvent status == ADVISOR_CONNECTED"
          - "Selected PSAP status == ACTIVE and accepts_location_transfer == true"
          - "PSAP.region_code == CrashEvent.location_region_code"
        side_effects:
          - "DispatchRequest created PENDING, then transitioned LOCATION_SENT with location_payload snapshot (cross-entity creation cascade)"
      - from: ADVISOR_CONNECTED
        to: CLOSED_NO_INJURY
        trigger: "POST /vehicles/{vehicleId}/crash-events/{eventId}/close"
        actor: Advisor
        preconditions:
          - "CrashEvent status == ADVISOR_CONNECTED"
        side_effects: []
      - from: DISPATCH_COORDINATED
        to: CLOSED_DISPATCHED
        trigger: "system: linked DispatchRequest reaches ACKNOWLEDGED (bubble-up)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DispatchRequest
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, CANCELLED]
    transitions:
      - from: PENDING
        to: LOCATION_SENT
        trigger: "system: immediately after creation (location transfer to PSAP)"
        actor: system
        preconditions: []
        side_effects:
          - "location_payload frozen from crash location + severity_band"
      - from: LOCATION_SENT
        to: ACKNOWLEDGED
        trigger: "POST /dispatch-requests/{dispatchId}/acknowledge"
        actor: PSAPOperator
        preconditions:
          - "DispatchRequest status == LOCATION_SENT"
        side_effects:
          - "acknowledged_at := logical clock"
          - "CrashEvent (crash_event_id) auto-transitions DISPATCH_COORDINATED -> CLOSED_DISPATCHED (bubble-up cascade)"
      - from: LOCATION_SENT
        to: CANCELLED
        trigger: "POST /dispatch-requests/{dispatchId}/cancel"
        actor: Advisor
        preconditions:
          - "DispatchRequest status == LOCATION_SENT"
        side_effects: []
    note: "No OCC on this machine; all writes are single-writer sequential by role."

  - entity: StolenVehicleCase
    initial_state: REPORTED
    terminal_states: [CLOSED_RECOVERED, CLOSED_UNVERIFIED]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /vehicles/{vehicleId}/stolen-cases/{caseId}/verify"
        actor: LawEnforcement
        preconditions:
          - "Case status == REPORTED"
          - "Verifier X-User-ID != reporter X-User-ID recorded on the case (segregation of duties)"
        side_effects:
          - "verified_by_user_id := verifier X-User-ID"
          - "Vehicle.status ACTIVE -> STOLEN_REPORTED (cross-entity mutation; this mutation itself arms slowdown eligibility)"
      - from: VERIFIED
        to: SLOWDOWN_ARMED
        trigger: "POST /vehicles/{vehicleId}/stolen-cases/{caseId}/arm-slowdown"
        actor: EmergencyOperator
        preconditions:
          - "Case status == VERIFIED (law enforcement verification MUST precede any slowdown)"
          - "Vehicle.hardware_generation == 5"
          - "CoverageZone for Vehicle.region_code has_cellular == true"
        side_effects: []
      - from: SLOWDOWN_ARMED
        to: SLOWDOWN_EXECUTED
        trigger: "POST /vehicles/{vehicleId}/stolen-cases/{caseId}/execute-slowdown"
        actor: EmergencyOperator
        preconditions:
          - "Case status == SLOWDOWN_ARMED"
          - "Vehicle.status == STOLEN_REPORTED"
        side_effects:
          - "slowdown_executed_at := logical clock"
      - from: SLOWDOWN_EXECUTED
        to: CLOSED_RECOVERED
        trigger: "POST /vehicles/{vehicleId}/stolen-cases/{caseId}/close-recovered"
        actor: LawEnforcement
        preconditions:
          - "Case status == SLOWDOWN_EXECUTED"
        side_effects:
          - "Vehicle.status STOLEN_REPORTED -> RECOVERED (compensating cascade restoring vehicle operability)"
      - from: VERIFIED
        to: CLOSED_RECOVERED
        trigger: "POST /vehicles/{vehicleId}/stolen-cases/{caseId}/close-recovered"
        actor: LawEnforcement
        preconditions:
          - "Case status == VERIFIED (recovered before any slowdown)"
        side_effects:
          - "Vehicle.status STOLEN_REPORTED -> RECOVERED"
      - from: REPORTED
        to: CLOSED_UNVERIFIED
        trigger: "POST /vehicles/{vehicleId}/stolen-cases/{caseId}/close-unverified"
        actor: LawEnforcement
        preconditions:
          - "Case status == REPORTED"
        side_effects: []
    note: "Vehicle.status RECOVERED can return to ACTIVE via PATCH /vehicles/{id} once the case is closed."

  - entity: RemoteCommand
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, FAILED, EXPIRED]
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /vehicles/{vehicleId}/remote-commands (creation)"
        actor: Account
        preconditions:
          - "Entitlement snapshot: allows_remote_commands true, OR (subscription EMERGENCY_RETAINED and command_type == LOCATE) — the emergency-only path"
          - "CoverageZone for Vehicle.region_code has_cellular == true"
          - "period_remote_commands_used < tier cap (calculations.remote_command_cap)"
        side_effects:
          - "expires_at := created_at + 10 minutes"
      - from: PENDING
        to: SENT
        trigger: "system: immediate delivery attempt"
        actor: system
        preconditions: []
        side_effects: []
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /remote-commands/{commandId}/acknowledge"
        actor: SystemIngestion
        preconditions:
          - "RemoteCommand status == SENT"
        side_effects:
          - "Subscription.period_remote_commands_used incremented (cap accounting)"
      - from: SENT
        to: FAILED
        trigger: "POST /remote-commands/{commandId}/fail"
        actor: SystemIngestion
        preconditions:
          - "RemoteCommand status == SENT"
        side_effects:
          - "Subscription.period_remote_commands_used incremented (failed commands still consume the cap)"
      - from: PENDING
        to: EXPIRED
        trigger: "system: logical clock reaches expires_at"
        actor: system
        preconditions: []
        side_effects:
          - "EXPIRED commands do NOT consume the period cap"
      - from: SENT
        to: EXPIRED
        trigger: "system: logical clock reaches expires_at"
        actor: system
        preconditions: []
        side_effects:
          - "EXPIRED commands do NOT consume the period cap"

  - entity: ServiceAppointment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /dealers/{dealerId}/appointments/{appointmentId}/confirm"
        actor: DealerService
        preconditions:
          - "Appointment status == REQUESTED"
          - "Dealer status == ACTIVE"
          - "Count of CONFIRMED appointments for the dealer on scheduled_date < service_capacity_per_day (capacity gate at confirm time)"
        side_effects:
          - "DiagnosticReport (diagnostic_report_id) GENERATED -> SERVICE_SCHEDULED (cross-entity mutation)"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /dealers/{dealerId}/appointments/{appointmentId}/complete"
        actor: DealerService
        preconditions:
          - "Appointment status == CONFIRMED"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /dealers/{dealerId}/appointments/{appointmentId}/cancel"
        actor: "Account | DealerService"
        preconditions:
          - "Appointment status == REQUESTED"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /dealers/{dealerId}/appointments/{appointmentId}/cancel"
        actor: "Account | DealerService"
        preconditions:
          - "Appointment status == CONFIRMED"
        side_effects:
          - "DiagnosticReport reverts SERVICE_SCHEDULED -> GENERATED ONLY IF no other non-cancelled appointment references the report (compensation)"

  - entity: DataConsent
    initial_state: GRANTED
    terminal_states: []
    transitions:
      - from: GRANTED
        to: REVOKED
        trigger: "POST /accounts/{accountId}/consents/{consentId}/revoke"
        actor: Account
        preconditions:
          - "Consent status == GRANTED"
        side_effects:
          - "revoked_at := logical clock"
          - "If consent_type == INSURANCE_PROGRAM_SHARING: effective_score := null (score no longer shared)"
      - from: REVOKED
        to: GRANTED
        trigger: "POST /accounts/{accountId}/consents/{consentId}/grant"
        actor: Account
        preconditions:
          - "Consent status == REVOKED (cyclic re-grant)"
          - "DRIVING_DATA_COLLECTION consent for the account must be GRANTED when consent_type == INSURANCE_PROGRAM_SHARING (cross-entity consent dependency)"
        side_effects:
          - "granted_at := logical clock; revoked_at := null"
          - "If consent_type == INSURANCE_PROGRAM_SHARING: effective_score recomputed per calculations.insurance_score"
      - from: GRANTED
        to: SUPERSEDED
        trigger: "system: a new DataConsent of the same consent_type is created for the account (only one non-SUPERSEDED consent per (account, consent_type))"
        actor: system
        preconditions: []
        side_effects:
          - "Prior consent's effective_score := null when superseded"
    note: "Cyclic machine: GRANTED <-> REVOKED loops allowed; SUPERSEDED is absorbing for that row."

  - entity: Vehicle
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: STOLEN_REPORTED
        trigger: "system: StolenVehicleCase REPORTED -> VERIFIED (cross-entity cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STOLEN_REPORTED
        to: RECOVERED
        trigger: "system: StolenVehicleCase closes recovered"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECOVERED
        to: ACTIVE
        trigger: "PATCH /vehicles/{vehicleId} with status == ACTIVE"
        actor: Account
        preconditions:
          - "Vehicle status == RECOVERED"
        side_effects: []
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "PATCH /vehicles/{vehicleId} with status == DECOMMISSIONED"
        actor: Account
        preconditions:
          - "Vehicle status == ACTIVE"
          - "No Subscription on this vehicle in status {TRIAL, ACTIVE, PAST_DUE, EMERGENCY_RETAINED}"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: subscription-convert-stale-version
    parent_entity: Subscription
    write_endpoint: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/convert"
    occ_field: "expected_subscription_version"
    description: |
      Converting a trial subscription whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. This
      captures the case where another writer has already converted the
      subscription (which legitimately supersedes the client's stale plan)
      and the current writer's view of the subscription is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: subscription-reactivate-stale-version
    parent_entity: Subscription
    write_endpoint: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/reactivate"
    occ_field: "expected_subscription_version"
    description: |
      Reactivating an EMERGENCY_RETAINED subscription whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION; a prior reactivation legitimately supersedes the
      stale writer's intent.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: crash_severity
    trigger: "CrashEvent creation (before the event is persisted)"
    algorithm: weighted_scoring
    formula: |
      score = 0.6 * min(delta_v_kph, 80)
            + 25 * (1 if airbag_deployed else 0)
            + 20 * (1 if rollover_detected else 0)
      severity_score = round(score, 1)   # one decimal, round_half_up
    input_set: "The single incoming crash report; no historical data"
    constants:
      CRASH_SCORE_THRESHOLD: 35
      DELTA_V_CAP_KPH: 80
      WEIGHT_DELTA_V: 0.6
      WEIGHT_AIRBAG: 25
      WEIGHT_ROLLOVER: 20
    precision: "1 decimal place, round_half_up"
    variants:
      - name: sensor_reported
        when: "airbag_deployed and rollover_detected are taken from the raw sensor payload"
        difference: "Adds flag bonuses; the only variant that can reach SEVERE without extreme delta-V"
      - name: delta_v_only
        when: "Both flags false — score is purely 0.6 * min(delta_v_kph, 80)"
        difference: "For identical delta_v, produces a score up to 45.0 points lower than sensor_reported"

  - name: severity_band
    trigger: "Immediately after crash_severity at CrashEvent creation"
    algorithm: threshold
    formula: |
      severity_score >= 60  -> SEVERE
      severity_score >= 35  -> MODERATE
      severity_score  < 35  -> MINOR   # events < CRASH_SCORE_THRESHOLD are rejected at creation, so MINOR can only arise from a manual replay
    input_set: "The severity_score just computed"
    constants:
      BAND_SEVERE_AT: 60
      BAND_MODERATE_AT: 35
    precision: "exact threshold comparisons, >= inclusive at both bands"

  - name: conversion_fee
    trigger: "Subscription TRIAL -> ACTIVE via convert"
    algorithm: tiered_pricing
    formula: |
      evaluation order (pinned):
        1. if logical clock date < trial_end_date  -> fee = 0
        2. else fee = max(0, plan.monthly_fee_cents * LATE_CONVERSION_FEE_PCT)
           rounded per-item to the cent (round_half_up), no second rounding after max
      conversion_fee_paid_cents = fee
    input_set: "Subscription trial_end_date, PlanTier.monthly_fee_cents of the target tier, logical clock"
    constants:
      LATE_CONVERSION_FEE_PCT: 0.20
    precision: "integer cents, round_half_up applied to the fee product exactly once"
    variants:
      - name: early_bird
        when: "Conversion strictly before trial_end_date"
        difference: "fee = 0 regardless of tier price — diverges from late_conversion for any tier with monthly_fee_cents > 0"
      - name: late_conversion
        when: "Conversion on or after trial_end_date (trial already expired but not yet auto-cancelled)"
        difference: "fee = 20% of monthly fee, round_half_up to the cent"

  - name: remote_command_cap
    trigger: "RemoteCommand creation; recomputed on ACKNOWLEDGED/FAILED and on period renewal"
    algorithm: aggregation
    formula: |
      period_remote_commands_used = count of RemoteCommand rows for the subscription
        with status in {ACKNOWLEDGED, FAILED}
        and created_at within [current_period_start, current_period_start + 30 days)
      cap_by_tier: EMERGENCY_ONLY -> 0, SAFETY -> 0, SAFETY_REMOTE -> 10, PREMIUM -> 50
      creation allowed only when period_remote_commands_used < cap  (strict <)
      EMERGENCY_RETAINED subscriptions: exactly 2 emergency LOCATE commands per 30-day window from lapse_date
    input_set: "RemoteCommand rows of the subscription in the named statuses within the current billing period"
    precision: "integer counts; window is closed-open on [start, start+30d)"
    variants:
      - name: standard_period_count
        when: "Subscription TRIAL/ACTIVE/PAST_DUE"
        difference: "Counts ACKNOWLEDGED + FAILED in the current billing period; EXPIRED never counts"
      - name: emergency_retained_count
        when: "Subscription EMERGENCY_RETAINED"
        difference: "Counts only is_emergency_command == true rows against a fixed cap of 2 keyed on lapse_date, not current_period_start — different baseline"

  - name: health_score
    trigger: "DiagnosticReport creation"
    algorithm: weighted_scoring
    formula: |
      base = 100
      base -= 8 * len(dtc_codes)            # each trouble code costs 8
      base -= (100 - oil_life_pct) // 5     # integer division: every full 5% of oil wear costs 1
      health_score = max(0, min(100, base))
    input_set: "The single report's dtc_codes and oil_life_pct"
    precision: "integer; integer division truncates toward zero BEFORE the clamp (order pinned)"
    variants:
      - name: clean_report
        when: "dtc_codes empty and oil_life_pct == 100"
        difference: "Always 100 — the only variant that can hit the ceiling"
      - name: degraded_report
        when: "Any dtc present or oil_life_pct < 100"
        difference: "Strictly below 100; two reports with identical odometer can differ by up to 100 points"

  - name: dealer_daily_capacity
    trigger: "ServiceAppointment REQUESTED -> CONFIRMED"
    algorithm: threshold
    formula: |
      confirmed_today = count of ServiceAppointment rows for the dealer
        with status == CONFIRMED and scheduled_date == candidate.scheduled_date
      confirm allowed only when confirmed_today < service_capacity_per_day  (strict <)
    input_set: "CONFIRMED appointments of the dealer on the exact scheduled_date; CANCELLED and COMPLETED excluded"
    precision: "strict < — a dealer with capacity 1 and 1 confirmed appointment rejects the next confirm"

  - name: insurance_score
    trigger: "DataConsent INSURANCE_PROGRAM_SHARING transitions to GRANTED; nulled on REVOKED/SUPERSEDED"
    algorithm: aggregation
    formula: |
      evaluation order (pinned to break the circular-looking dependency):
        1. raw = sum over DiagnosticReport rows of the account's vehicles,
                 created within the trailing 90 days of the logical clock,
                 of (health_score * 1.0)
        2. n = count of those rows
        3. effective_score = round(raw / n, 2) if n > 0 else 50.00
      # effective_score depends on reports; nothing else depends on effective_score,
      # so evaluating reports first fully defines the value.
    input_set: "DiagnosticReport rows belonging to vehicles of the account, created in [clock - 90 days, clock]; status in {GENERATED, SERVICE_SCHEDULED}"
    precision: "2 decimal places, round_half_up; empty set yields the 50.00 baseline"

  - name: entitlement_snapshot
    trigger: "CrashEvent creation, RemoteCommand creation, navigation/data requests"
    algorithm: constraint_propagation
    formula: |
      resolve subscription for vehicle ->
        if subscription.status in {TRIAL, ACTIVE, PAST_DUE}: entitlements = PlanTier flags of subscription.tier_code
        if subscription.status == EMERGENCY_RETAINED: entitlements = {allows_emergency: true, all others false} PLUS emergency LOCATE allowance
        if subscription.status in {LAPSED, CANCELLED} or missing: no entitlements
      then gate by CoverageZone of the operating region:
        has_cellular == false -> ALL telematics operations rejected (coverage beats entitlement)
    input_set: "Subscription of the vehicle, its PlanTier, CoverageZone of the region"
    precision: "boolean propagation; coverage gate is applied last and dominates"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc and SystemIngestion endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix; entity_backed roles must act on their own resources (Account role's X-User-ID must equal the path account's id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids exist and belong to the declared parent chain, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path params"
  - priority: 4
    category: existence
    check: "Request body well-formed: required fields present, enum values valid, types match"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: state
    check: "OCC: expected_subscription_version matches current Subscription.version on convert/reactivate"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/convert, /reactivate"
  - priority: 6
    category: state
    check: "Target resource in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Safety gates: law-enforcement verification precedes arm-slowdown; hardware gen 5 and cellular coverage required for slowdown; reporter != verifier"
    error_id: "ERR_SLOWDOWN_NOT_VERIFIED | ERR_SLOWDOWN_UNSUPPORTED_HARDWARE | ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "stolen-case verify/arm/execute endpoints"
  - priority: 8
    category: business_temporal
    check: "Temporal gates: retain-emergency within lapse_date + 30 days; appointment scheduled_date strictly in the future; odometer non-decreasing per vehicle; remote command cap window"
    error_id: "ERR_RETENTION_WINDOW_EXPIRED | ERR_APPOINTMENT_IN_PAST | ERR_ODOMETER_REGRESSION | ERR_REMOTE_COMMAND_CAP_REACHED"
    http_status: 409
    applies_to: "retain-emergency, appointment create, diagnostic report create, remote command create"
  - priority: 9
    category: business_constraint
    check: "Constraint gates: PSAP active + region match + accepts transfer; dealer capacity; consent dependency (insurance sharing requires data collection); unique email/vin/police_report_number"
    error_id: "ERR_PSAP_UNAVAILABLE | ERR_DEALER_CAPACITY_REACHED | ERR_CONSENT_DEPENDENCY_MISSING | ERR_DUPLICATE"
    http_status: 409
    applies_to: "dispatch, appointment confirm, consent grant, account/vehicle/stolen-case create"
  - priority: 10
    category: business_referential
    check: "Coverage and entitlement gates: cellular coverage in region (dominates), emergency entitlement present, tier capability flags, emergency-only command restriction"
    error_id: "ERR_NO_CELLULAR_COVERAGE | ERR_EMERGENCY_ENTITLEMENT_MISSING | ERR_TIER_CAPABILITY_MISSING | ERR_EMERGENCY_ONLY_COMMAND"
    http_status: 422
    applies_to: "crash-events, remote-commands, navigation/data endpoints"
  - priority: 11
    category: business_fiscal
    check: "Fiscal gates: billing outcome transitions valid for current subscription status"
    error_id: ERR_BILLING_TRANSITION_INVALID
    http_status: 409
    applies_to: "POST /accounts/{accountId}/subscriptions/{subscriptionId}/billing-events"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving). Before any call the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Advances the logical clock; fires system time-based transitions (PAST_DUE->LAPSED at lapse_date, LAPSED->CANCELLED after retention window, RemoteCommand expiry)"]

  - method: POST
    path: "/plan-tiers"
    description: "Define a subscription plan tier"
    roles: [PlatformAdmin]
    code: 201
    input: [code, monthly_fee_cents, allows_emergency, allows_remote_commands, allows_navigation, allows_data_gb]
    output: PlanTier
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/plan-tiers"
    description: "List plan tiers"
    roles: [PlatformAdmin, Account, EmergencyOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "PlanTier[]"
    side_effects: []

  - method: GET
    path: "/plan-tiers/{tierId}"
    description: "Get a plan tier"
    roles: [PlatformAdmin, Account, EmergencyOperator]
    code: 200
    input: []
    output: PlanTier
    side_effects: []

  - method: POST
    path: "/accounts"
    description: "Register an account"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, phone, home_region_code]
    output: Account
    side_effects: ["status := ACTIVE; email uniqueness enforced"]

  - method: GET
    path: "/accounts/{accountId}"
    description: "Get an account"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/coverage-zones"
