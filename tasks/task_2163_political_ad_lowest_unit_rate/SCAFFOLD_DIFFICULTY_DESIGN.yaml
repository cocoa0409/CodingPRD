            - call: "POST /political-ads/orders/${ord_g}/spots"
              payload: { air_date: "2026-08-25", start_offset_seconds: 0, duration_seconds: 30, program_code: "EN-G1" }
              as: AdvertiserAgent
              as_user_id: "${adv_w}"
            - call: "POST /political-ads/orders/${ord_g}/submit"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv_w}"
            - call: "POST /political-ads/orders/${ord_g}/decision"
              payload: { decision: "ACCEPT" }
              as: StationComplianceOfficer
