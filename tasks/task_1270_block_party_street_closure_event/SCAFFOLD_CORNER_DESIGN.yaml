      - name: locked_petition_withdraw_returns_409
        claim_type: precondition_enforcement
        grounds: ["state_machines.PetitionSignature.ACTIVE_to_WITHDRAWN", "errors[ERR_PETITION_LOCKED]"]
        distinguishing_aspect: "Once any application on the petition is ISSUED the petition locks; signature withdrawal then fails with ERR_PETITION_LOCKED."
        test_recipe:
          setup:
            - "Full issued application (4 BARRICADE plan, attendance 100); petition LOCKED by issuance"
          setup_api_calls:
            - call: "POST /organizers"
              payload: { full_name: "Xio Bo", email: "xio@x.com", phone: "555-25", address: "6 Elm St" }
              as: Anonymous
