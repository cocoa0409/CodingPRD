          - entities.Campaign.common_fields
        distinguishing_aspect: "The clock endpoint mutates no entity yet changes every later timestamp: rows created under two different pinned instants must carry exactly those instants in created_at, proving the implementation never reads wall-clock time."
        test_recipe:
          setup:
            - "No rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
