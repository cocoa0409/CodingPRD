              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_l}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T12:00:00Z" }, as: EscrowOfficer }
          trigger:
            - call: "POST /escrow/holdbacks/${hb_id}/expire"
              payload: {}
              as: EscrowOfficer
              captures: { exp_err: $.data.error_id }
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/holdbacks/${hb_id}/expire"
              payload: {}
              as: EscrowOfficer
              captures: { exp_status: $.data.status }
          assert:
            - "exp_err == ERR_NOT_EXPIRED (clock date 2026-09-15 == deadline date; equality does not expire)"
            - "exp_status == EXPIRED (clock date 2026-09-16 > deadline date)"
            - "Holdback.${hb_id}.effective_deadline_date == '2026-09-15' (no extensions granted)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: draw_create_requires_active_holdback
        grounds:
          - state_machines.DrawRequest
          - state_machines.Holdback.PENDING_APPROVALS_to_ACTIVE
          - errors[ERR_HOLDBACK_NOT_ACTIVE]
          - errors[ERR_NO_SELECTED_CONTRACTOR]
        distinguishing_aspect: |
          Pair DrawRequest -> Holdback: draw creation is gated on the parent holdback's
          status (DRAFT rejects with ERR_HOLDBACK_NOT_ACTIVE; ACTIVE without a selected bid
          rejects with ERR_NO_SELECTED_CONTRACTOR; ACTIVE + selected bid succeeds).
          Different entity pair than final_inspection_requires_completion_submitted
          (Inspection -> WorkOrder).
        test_recipe:
          setup:
            - "Escrow file with a holdback still in DRAFT, then driven to ACTIVE"
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
          trigger:
            - call: "POST /escrow/draw-requests"
              payload: { holdback_id: "${hb_id}", amount_cents: 1000, description: "Premature draw", is_final: false }
              as: Contractor
              as_user_id: "contr_1"
              captures: { early_err: $.data.error_id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_l}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
            - call: "POST /escrow/draw-requests"
              payload: { holdback_id: "${hb_id}", amount_cents: 1000, description: "No contractor yet", is_final: false }
              as: Contractor
              as_user_id: "contr_1"
              captures: { mid_err: $.data.error_id }
            - call: "POST /escrow/bids"
              payload: { holdback_id: "${hb_id}", amount_cents: 210000, scope_text: "Full tear-off" }
              as: Contractor
              as_user_id: "contr_1"
              captures: { bid_id: $.data.id }
            - { call: "POST /escrow/bids/${bid_id}/select", payload: {}, as: Buyer, as_user_id: "buyer_1" }
            - call: "POST /escrow/draw-requests"
              payload: { holdback_id: "${hb_id}", amount_cents: 1000, description: "Now valid", is_final: false }
              as: Contractor
              as_user_id: "contr_1"
              captures: { ok_status: $.data.status }
          assert:
            - "early_err == ERR_HOLDBACK_NOT_ACTIVE (DRAFT parent blocks child creation)"
            - "mid_err == ERR_NO_SELECTED_CONTRACTOR (ACTIVE but no bid selected yet)"
            - "ok_status == SUBMITTED (gate lifts once the holdback is ACTIVE with a selected bid)"

      - name: final_inspection_requires_completion_submitted
        grounds:
          - state_machines.Inspection.PLANNED_to_PASSED
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETION_SUBMITTED
          - errors[ERR_WORK_NOT_SUBMITTED]
        distinguishing_aspect: |
          Pair Inspection -> WorkOrder (different pair than DrawRequest -> Holdback): a
          FINAL_VERIFICATION report is rejected while the sibling WorkOrder is IN_PROGRESS,
          and the same report succeeds after submit-completion flips the work order to
          COMPLETION_SUBMITTED — one entity's transition gated on another's state.
        test_recipe:
          setup:
            - "ACTIVE holdback; bid selected; WorkOrder IN_PROGRESS; FINAL_VERIFICATION inspection PLANNED"
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_l}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
            - call: "POST /escrow/bids"
              payload: { holdback_id: "${hb_id}", amount_cents: 210000, scope_text: "Full tear-off" }
              as: Contractor
              as_user_id: "contr_1"
              captures: { bid_id: $.data.id }
            - { call: "POST /escrow/bids/${bid_id}/select", payload: {}, as: Buyer, as_user_id: "buyer_1" }
            - call: "GET /escrow/holdbacks/${hb_id}/work-orders"
              as: EscrowOfficer
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_1", purpose: "FINAL_VERIFICATION", scheduled_start: "2026-08-25T09:00:00Z", scheduled_end: "2026-08-25T10:00:00Z" }
              as: EscrowOfficer
              captures: { fins_id: $.data.id }
          trigger:
            - call: "POST /escrow/inspections/${fins_id}/report"
              payload: { result: "PASSED" }
              as: Inspector
              as_user_id: "insp_1"
              captures: { rep_err: $.data.error_id }
            - { call: "POST /escrow/work-orders/${wo_id}/submit-completion", payload: {}, as: Contractor, as_user_id: "contr_1" }
            - call: "POST /escrow/inspections/${fins_id}/report"
              payload: { result: "PASSED" }
              as: Inspector
              as_user_id: "insp_1"
              captures: { rep_status: $.data.status }
          assert:
            - "rep_err == ERR_WORK_NOT_SUBMITTED (work order was IN_PROGRESS)"
            - "Inspection.${fins_id} remained PLANNED after the rejected report (no state consumption on failure)"
            - "rep_status == PASSED and WorkOrder.${wo_id}.status == VERIFIED after completion was submitted"

