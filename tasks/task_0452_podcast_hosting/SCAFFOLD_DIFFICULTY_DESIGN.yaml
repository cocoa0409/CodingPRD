            - call: "POST /shows/${showSl}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pubSl}"
            - call: "POST /episodes"
              payload: { show_id: "${showSl}", title: "EpSl", total_ad_slots: 2, offered_positions: ["PRE_ROLL"] }
