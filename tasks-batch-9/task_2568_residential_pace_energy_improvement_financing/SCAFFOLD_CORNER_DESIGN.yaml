          - validations[priority=7]
          - errors[ERR_APPLICATION_VERSION_CONFLICT]
        distinguishing_aspect: |
          This is the §1.2.1 rule 'measure-add-stale-application' in isolation: one read of the DRAFT
          application funds two additions, the first bumps the version, and the second — byte-identical
          apart from being a different product — must be refused 412 with NO ProjectMeasure created and
          requested_principal_cents unchanged. The re-read then makes the very same body succeed, proving
          the refusal was purely about the token and consumed nothing.
