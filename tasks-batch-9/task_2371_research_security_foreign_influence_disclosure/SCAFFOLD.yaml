# =============================================================================
# SCAFFOLD — task_2371_research_security_foreign_influence_disclosure
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in their
# own sibling files.
# =============================================================================

scenario: |
  2371. Research Security & Foreign Influence Disclosure (university research security office):
  investigator disclosure of foreign appointments, talent programs and outside support,
  current-and-pending support and biographical sketch consistency checks across agencies,
  conflict of commitment review and management plan issuance, foreign travel registration and
  device security requirements for sensitive projects, subaward and collaboration screening
  against restricted entity lists, incident investigation for undisclosed relationships with
  agency notification, training assignment and completion enforcement before award activation,
  controlled research area access management

domain_name: research-security-disclosure

# Flat topology: every resource is a top-level collection and all relationships are
# body-level foreign keys, so the api prefix is the root.
api_prefix: "/"

# =============================================================================
# Step 0 — Complexity Profile
# =============================================================================
complexity_profile:
  difficulty_level: expert_plus        # deliberately above the §0.4 Expert band
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # graph: ForeignOrganization is self-referential (ownership chain), Investigator↔Project is
  # many-to-many through ProjectPersonnel, and Subaward/DisclosureItem/TravelRegistration all
  # point at the same organization graph from different aggregates. No nesting in URL paths
  # except for two nested creates.

  state_machine_shape: cyclic
  additional_state_machine_shapes:
    - parallel        # Project.award_status × Project.security_status; Disclosure.review_status × Disclosure.plan_status
    - branching       # SecurityIncident INVESTIGATING → {SUBSTANTIATED, UNSUBSTANTIATED} → CLOSED
    - posture_driven  # Investigator.disclosure_posture and Project.controlled_area_posture gate child operations
    - guarded         # cross-entity preconditions on almost every transition

  relationship_patterns:
    - one_to_many          # Disclosure → DisclosureItem, Project → Subaward
    - many_to_many         # Investigator ↔ Project through ProjectPersonnel
    - self_referential     # ForeignOrganization.parent_organization_id
    - cross_aggregate      # SecurityIncident references Investigator, Disclosure and Project

  role_model: segregation_of_duties
  # The reviewer who took a Disclosure UNDER_REVIEW may not approve its ManagementPlan; the
  # lead who substantiated a SecurityIncident may not perform the agency notification.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Investigator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Investigator legal name" }
      - { name: email, type: string, source: input, description: "Institutional email; unique across Investigators", constraints: "unique" }
      - { name: appointment_type, type: enum, source: input, description: "FACULTY | RESEARCH_STAFF | POSTDOC", constraints: "one of FACULTY, RESEARCH_STAFF, POSTDOC" }
      - { name: home_department, type: string, source: input, description: "Owning academic department" }
      - { name: institutional_base_effort_pct, type: number, source: input, default: 100, description: "Effort percentage the investigator owes the institution; enters total_commitment_pct as the first already-rounded term", constraints: "0 <= value <= 100" }
      - { name: committed_effort_pct, type: number, source: computed, description: "Per-row rounded sum of ACTIVE ProjectPersonnel effort; see calculations.investigator_commitment_totals", default: 0 }
      - { name: outside_effort_pct, type: number, source: computed, description: "Per-item rounded sum of disclosed outside effort; see calculations.investigator_commitment_totals", default: 0 }
      - { name: total_commitment_pct, type: number, source: computed, description: "institutional_base_effort_pct + committed_effort_pct + outside_effort_pct, summed from already-rounded components and never re-rounded" }
      - { name: overcommitment_pct, type: number, source: computed, description: "round(max(0, total_commitment_pct - 100), 2)" }
      - { name: risk_score, type: integer, source: computed, description: "0..100 research-security risk; see calculations.investigator_risk_score", default: 0 }
      - { name: substantiated_incident_count, type: integer, source: computed, description: "Count of SecurityIncident rows for this investigator with finding == SUBSTANTIATED", default: 0 }
      - { name: material_discrepancy_count, type: integer, source: computed, description: "Count of SupportStatement rows for this investigator with status == INCONSISTENT", default: 0 }
      - { name: training_compliant, type: boolean, source: computed, description: "True when the investigator has zero institution-wide TrainingAssignment rows (required_for_project_id is null) whose computed status is ASSIGNED or EXPIRED", default: true }
      - { name: disclosure_posture, type: enum, source: computed, description: "CLEAR | REVIEW_REQUIRED | RESTRICTED | SUSPENDED — gates travel approval, area access and project clearance; see calculations.investigator_disclosure_posture" }

  - name: ForeignOrganization
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered name of the foreign entity" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country of registration", constraints: "exactly 2 uppercase letters" }
      - { name: org_type, type: enum, source: input, description: "UNIVERSITY | INSTITUTE | COMPANY | GOVERNMENT_AGENCY | TALENT_PROGRAM" }
      - { name: parent_organization_id, type: string, source: input, description: "FK -> ForeignOrganization.id; nullable self-referential ownership parent; a chain that revisits a node is rejected with ERR_OWNERSHIP_CYCLE", default: null }
      - { name: parent_ownership_pct, type: number, source: input, description: "Percentage of this organization held by parent_organization_id; the >= 50 inclusive control threshold decides designation inheritance", default: 0, constraints: "0 <= value <= 100" }
      - { name: own_designation, type: enum, source: input, description: "Restricted-list designation attached directly to this organization: NONE | UNVERIFIED_END_USER | ENTITY_LIST | FOREIGN_MILITARY | MALIGN_TALENT_PROGRAM | SDN", default: NONE }
      - { name: designated_on, type: datetime, source: input, description: "Date the direct designation took effect; null when own_designation is NONE", default: null }
      - { name: effective_designation, type: enum, source: computed, description: "Strictest own_designation across the >= 50%-ownership chain rooted at this organization; same enum members as own_designation" }
      - { name: effective_designation_depth, type: integer, source: computed, description: "Hop distance from this organization to the chain member supplying effective_designation; 0 when the organization is designated directly", default: 0 }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Sponsored project title" }
      - { name: agency_code, type: enum, source: input, description: "NIH | NSF | DOD | DOE | NASA" }
      - { name: sensitivity_level, type: enum, source: input, description: "STANDARD | CONTROLLED | RESTRICTED" }
      - { name: award_amount_cents, type: integer, source: input, description: "Total obligated award amount in cents", constraints: "value >= 0" }
      - { name: period_start, type: datetime, source: input, description: "Award period of performance start" }
      - { name: period_end, type: datetime, source: input, description: "Award period of performance end; must be strictly after period_start" }
      - { name: controlled_area_capacity, type: integer, source: input, description: "Maximum number of investigators allowed concurrent access to this project's controlled research area", default: 0, constraints: "value >= 0" }
      - { name: award_status, type: enum, source: system, description: "PROPOSED | ACTIVATION_PENDING | ACTIVE | CLOSED | WITHDRAWN — funding dimension" }
      - { name: security_status, type: enum, source: system, description: "PENDING_CLEARANCE | CLEARED | SUSPENDED | TERMINATED — security dimension, evolves independently of award_status" }
      - { name: security_status_reason, type: enum, source: system, description: "NONE | OFFICER_ACTION | SUBAWARD_BLOCKED | INVESTIGATOR_SUSPENDED | INCIDENT_NOTIFICATION", default: NONE }
      - { name: activation_blockers, type: array, source: computed, description: "Blocker codes ordered by the fixed BLOCKER_ORDER constant; see calculations.project_activation_blockers", default: [] }
      - { name: active_grant_count, type: integer, source: computed, description: "Count of ControlledAccessGrant rows on this project with status == ACTIVE — the conserved headcount quantity", default: 0 }
      - { name: controlled_area_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | LOCKED_DOWN — gates ControlledAccessGrant activation" }
      - { name: open_incident_count, type: integer, source: computed, description: "Count of SecurityIncident rows on this project with status in {REPORTED, INVESTIGATING, SUBSTANTIATED}", default: 0 }

  - name: ProjectPersonnel
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; taken from the nested create path" }
      - { name: investigator_id, type: string, source: input, description: "FK -> Investigator.id" }
      - { name: role_on_project, type: enum, source: input, description: "PI | CO_PI | SENIOR_PERSONNEL | KEY_PERSON" }
      - { name: committed_person_months, type: number, source: input, description: "Annual person-months committed to this project", constraints: "0 < value <= 12, at most 2 decimal places" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | REMOVED" }

  - name: Disclosure
    parent: null
    common_fields: true
    fields:
      - { name: investigator_id, type: string, source: input, description: "FK -> Investigator.id" }
      - { name: cycle_label, type: string, source: input, description: "Disclosure cycle key, e.g. 2026-ANNUAL; unique per investigator among non-SUPERSEDED disclosures" }
      - { name: disclosure_type, type: enum, source: input, description: "ANNUAL | EVENT_DRIVEN | PROPOSAL" }
      - { name: review_status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | RETURNED_FOR_REVISION | CERTIFIED | REJECTED | SUPERSEDED — cyclic through RETURNED_FOR_REVISION" }
      - { name: plan_status, type: enum, source: system, description: "NOT_REQUIRED | PLAN_REQUIRED | PLAN_ISSUED | PLAN_ACKNOWLEDGED | PLAN_WAIVED | PLAN_TERMINATED — independent parallel dimension", default: NOT_REQUIRED }
      - { name: revision_round, type: integer, source: computed, description: "Number of completed RETURNED_FOR_REVISION transitions", default: 0 }
      - { name: item_count, type: integer, source: computed, description: "Count of DisclosureItem rows with status in {DECLARED, VERIFIED, DISPUTED}", default: 0 }
      - { name: late_item_count, type: integer, source: computed, description: "Count of DisclosureItem rows created while revision_round >= 1", default: 0 }
      - { name: undisclosed_item_count, type: integer, source: computed, description: "Count of DisclosureItem rows with source == INCIDENT_REMEDIATION", default: 0 }
      - { name: completeness_score, type: integer, source: computed, description: "0..100 score; tier penalty is keyed on the raw score, see calculations.disclosure_completeness_score" }
      - { name: completeness_tier, type: enum, source: computed, description: "A | B | C — selected from the RAW score before the tier penalty is applied, never re-derived from completeness_score" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of the most recent DRAFT/RETURNED_FOR_REVISION → SUBMITTED transition", default: null }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock instant of certification", default: null }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the officer who first took this disclosure UNDER_REVIEW; never overwritten", default: null }
      - { name: plan_effort_cap_pct, type: number, source: input, description: "Effort ceiling written into the issued management plan", default: null }
      - { name: plan_required_actions, type: array, source: input, description: "Management-plan action codes: DIVEST_APPOINTMENT | REDUCE_OUTSIDE_EFFORT | QUARTERLY_ATTESTATION | NO_FOREIGN_STUDENT_SUPERVISION | DEVICE_RESTRICTION", default: [] }
      - { name: plan_effective_from, type: datetime, source: input, description: "Management-plan start instant", default: null }
      - { name: plan_expires_on, type: datetime, source: input, description: "Management-plan end instant; must be strictly after plan_effective_from", default: null }
      - { name: plan_approver_user_id, type: string, source: system, description: "X-User-ID that issued the management plan; must differ from reviewer_user_id", default: null }
      - { name: plan_acknowledged_at, type: datetime, source: system, description: "Logical-clock instant the subject investigator acknowledged the plan", default: null }

  - name: DisclosureItem
    parent: Disclosure
    common_fields: true
    fields:
      - { name: disclosure_id, type: string, source: system, description: "FK -> Disclosure.id; taken from the nested create path" }
      - { name: item_type, type: enum, source: input, description: "FOREIGN_APPOINTMENT | TALENT_PROGRAM | OUTSIDE_SUPPORT | IN_KIND_RESOURCE | VISITING_SCHOLAR" }
      - { name: foreign_organization_id, type: string, source: input, description: "FK -> ForeignOrganization.id" }
      - { name: annual_effort_hours, type: number, source: input, description: "Hours per year devoted to this relationship", default: 0, constraints: "0 <= value <= 2080" }
      - { name: compensation_usd_cents, type: integer, source: input, description: "Annual cash compensation in cents", default: 0 }
      - { name: in_kind_value_cents, type: integer, source: input, description: "Annual in-kind resource value in cents", default: 0 }
      - { name: start_date, type: datetime, source: input, description: "Relationship start" }
      - { name: end_date, type: datetime, source: input, description: "Relationship end; null means ongoing", default: null }
      - { name: is_paid, type: boolean, source: input, description: "Whether the relationship is compensated", default: false }
      - { name: item_risk_points, type: integer, source: computed, description: "Per-item integer risk contribution before the cap; see calculations.investigator_risk_score" }
      - { name: status, type: enum, source: system, description: "DECLARED | VERIFIED | DISPUTED | WITHDRAWN" }
      - { name: source, type: enum, source: system, description: "SELF_REPORTED when created by the investigator, INCIDENT_REMEDIATION when created under a SecurityIncident remediation", default: SELF_REPORTED }

  - name: SupportStatement
    parent: null
    common_fields: true
    fields:
      - { name: investigator_id, type: string, source: input, description: "FK -> Investigator.id" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the proposal the document accompanies" }
      - { name: agency_code, type: enum, source: input, description: "NIH | NSF | DOD | DOE | NASA" }
      - { name: document_type, type: enum, source: input, description: "CURRENT_AND_PENDING | BIOSKETCH" }
      - { name: declared_person_months, type: number, source: input, description: "Total annual person-months the document declares", constraints: "value >= 0, at most 2 decimal places" }
      - { name: declared_appointment_count, type: integer, source: input, description: "Number of foreign appointments the document lists", constraints: "value >= 0" }
      - { name: declared_support_count, type: integer, source: input, description: "Number of outside-support entries the document lists", constraints: "value >= 0" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | RECONCILED | INCONSISTENT | SUPERSEDED" }
      - { name: applied_variant, type: enum, source: computed, description: "STRICT_AGENCY | INSTITUTIONAL_ROLLUP — the variant of the most recent reconcile", default: null }
      - { name: institutional_person_months, type: number, source: computed, description: "Institutional truth under applied_variant", default: null }
      - { name: variance_person_months, type: number, source: computed, description: "round(institutional_person_months - declared_person_months, 2)", default: null }
      - { name: omission_count, type: integer, source: computed, description: "Undeclared appointments plus undeclared outside-support entries under applied_variant", default: null }
      - { name: verdict, type: enum, source: computed, description: "CONSISTENT | MINOR_VARIANCE | MATERIAL_DISCREPANCY", default: null }

  - name: TravelRegistration
    parent: null
    common_fields: true
    fields:
