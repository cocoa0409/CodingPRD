  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: device_clip_windows_half_open_adjacent_allowed_one_second_overlap_rejected
        grounds:
          - validations[priority=40]
          - errors.ERR_DEVICE_WINDOW_CONFLICT
          - endpoints[POST /neighborhood-safety/consent-solicitations/{id}/share]
          - entities.SharedClip.fields.recorded_start_utc
          - entities.SharedClip.fields.duration_seconds
          - calculations.clip_retention_expiry
        distinguishing_aspect: |
          The contended resource is a Device (one camera's footage timeline) and the interval
          semantics are HALF-OPEN with a zero buffer: an interval that starts exactly where the
          previous one ended is accepted, and shifting that same interval one minute earlier so
          it overlaps by 60 seconds is rejected. The end of an existing clip is therefore an
          exclusive bound, which is the opposite convention from the canvass rule in the sibling
          instance. The rejected share must leave nothing behind — no SharedClip row, no change
          to clip_count, shared_clip_count or the owner's footage ledger — so the test also pins
          the no-partial-write property of the guard.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z; agency ONBOARDED with post_share_retention_days 30; officer with duty_role REQUESTER."
            - "Three residents R1, R2, R3 with one camera each at (0,10), (0,20), (0,30), retention_window_days 30, alert_radius_m 0."
            - "RequestArea (0,0) radius 500 over the CLOSED footage window 2026-08-08T00:00:00Z..2026-08-08T06:00:00Z, LOCKED with eligible_device_count 3; the VideoRequest is justified and SUBMITTED, so three solicitations are SOLICITED and R1's solicitation is sol1."
