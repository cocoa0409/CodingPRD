      - name: wrong_carrier_acceptance_cascades_across_two_carriers
        grounds:
          - state_machines.DataChallenge.UNDER_REVIEW_to_RESOLVED_ACCEPTED
          - entities.InspectionReport.fields.original_carrier_id
          - entities.InspectionReport.fields.reattributed
          - calculations.basic_measure_recompute
          - calculations.screening_risk_recompute
        distinguishing_aspect: |
          The cascade crosses an entity boundary into a second aggregate root: accepting the
          WRONG_CARRIER challenge rewrites the report and every violation onto c2 and in the same transition
          zeroes c1 (relevant_inspection_count 0, NOT_ENOUGH_DATA, percentile null, iss_value 0.0)
          while building c2 up from nothing (certified_measure 0.800 on denominator 37.5, percentile
          59.0, iss_value 20.7), and only c1 earns the data-quality credit 0.0200.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier c1 (20 power units, 1,600,000 VMT) -> MEDIUM, power_unit_exposure 30.0; carrier c2 (25 power units, 2,000,000 VMT) -> MEDIUM, vmt_per_pu 80000, utilization_factor 1.5, power_unit_exposure 37.5."
            - "UNSAFE_DRIVING code weight 5; UNSAFE_DRIVING/MEDIUM threshold 0.5 / 1.0 / 2.0."
            - "One SCORED report attributed to c1, dated 2026-07-01, with two UNSAFE_DRIVING violations (30.0 total) -> c1 certified_measure 1.000, percentile 65.0, ALERT, open_alert_count 1, iss_value 22.8."
