  - rule_id: transitive_cascade
    instances:

      - name: take_exceedance_cascade_six_hops_from_report_to_compliance_score
        grounds:
          - calculations.monitoring_report_lateness_and_take_ledger
          - state_machines[IncidentalTakePermit].transitions["ACTIVE -> SUSPENDED"]
          - state_machines[HabitatConservationPlan].state_field["plan_status"].transitions["IMPLEMENTING -> SUSPENDED_IMPLEMENTATION"]
          - state_machines[ProjectAction].transitions["PERMITTED -> REINITIATION_PENDING"]
          - state_machines[Consultation].transitions["OPINION_ISSUED -> REINITIATION_REQUIRED"]
          - calculations.compliance_standing_score
          - complexity_profile.complexity_layers["cascading_side_effects"]
          - complexity_profile.complexity_layers["rate_threshold_triggers"]
        distinguishing_aspect: >-
          DEPTH 6, triggered by a MONITORING-REPORT SUBMISSION that pushes the
          cumulative take ledger onto its trigger threshold. Every hop is caused
          strictly by the hop before it and by nothing in the request: the
          request writes only the report, the report's ledger move suspends the
          permit, the suspension suspends the plan, the plan suspension pushes
          the action into reinitiation, the action pushes the consultation, and
          the consultation bumps the proponent's reinitiation counter, which
          re-derives its compliance score. This is the deep instance of the pair.
