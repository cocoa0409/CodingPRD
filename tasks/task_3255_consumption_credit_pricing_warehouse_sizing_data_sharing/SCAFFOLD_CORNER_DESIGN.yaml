              as: ShareAdmin
              as_user_id: "${acct_np}"
            - call: "GET /v1/listings/${list_np}"
              payload: {}
              as: ShareAdmin
              as_user_id: "${acct_np}"
              captures: { list_np_v: $.data.version }
          trigger:
            - call: "POST /v1/paid-share-usage"
              payload: { listing_id: "${list_np}", buyer_account_id: "${acct_npc}", credits_used: 10, expected_listing_version: "${list_np_v}" }
              as: ShareAdmin
              as_user_id: "${acct_np}"
              captures: { err_np: $.data.error_id }
          assert:
            - "${err_np} == ERR_FREE_LISTING_NOT_PAYABLE"
