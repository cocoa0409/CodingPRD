              captures: { plan1: "$.data.id", plan1_v: "$.data.version" }
            - call: "GET /fca/facilities/${fac_id}"
              payload: {}
              as: CapitalPlanner
              captures: { fac_v2: "$.data.version" }
            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "P2", start_year: 2028, horizon_years: 1, expected_facility_version: "${fac_v2}" }
              as: CapitalPlanner
              captures: { plan2: "$.data.id" }
            - call: "POST /fca/funding-scenarios"
              payload: { capital_plan_id: "${plan1}", name: "S", annual_budget_cents: 100000000, escalation_rate: 0.0 }
              as: CapitalPlanner
              captures: { scen_id: "$.data.id" }
            - call: "POST /fca/funding-scenarios/${scen_id}/run"
              payload: { expected_capital_plan_version: "${plan1_v}" }
              as: CapitalPlanner
            - call: "GET /fca/plan-line-items"
