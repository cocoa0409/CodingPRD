# =============================================================================
# §1.9 Scaffold Corner Design — Fastener Cold Heading & Thread Rolling (task 2382)
#
# Breadth probe over §1.1–§1.7. Every claim the declared surface makes that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already assert is enumerated
# here; corners already covered by a §1.8 instance are emitted as
# `excluded_because:` stubs that name that instance.
#
# Fixture conventions used throughout:
#   * The logical clock is set explicitly as the first call of every chain; it
#     reads 2026-08-01T00:00:00Z before any call.
#   * X-User-IDs are stable strings: insp-1 / insp-2 (QualityInspector),
#     qm-1 / qm-2 (QualityManager), eng-1 (ProcessEngineer),
#     ht-1 (HeatTreatOperator), ship-1 (ShippingClerk), admin-1 (PlantAdmin).
#   * "CHAIN-B" below is the compact unplated reference route: part spec
#     NP-M8-088 (plating_spec NONE, CLASS_10_9, BY_COUNT 100, blank 20.0 g),
#     heat H-77410 (SAE_10B21, verified), wire 500.0 kg drawn 8.00 -> 6.80 mm,
#     tool DIE-4S-001 (rated 120000) on PRESS-3, furnace FCE-1 (400.0 kg),
#     lot L-2601 planned 5000 -> headed 4900 / scrap 60 -> THREAD_ROLL out 4850
#     -> heat treat PASS (hv 330.0, decarb 0.020) -> test sample 70 ACCEPT.
#     Its pre-computed literals: reservation 105.000 kg, consumed 99.200 kg,
#     wire available 400.800 kg, tool_utilization_pct 4.13, charge 97.000 kg,
#     risk_score_pre_test 5.83, risk_score_final 5.83, available_count 4780.
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: part_spec_creation_derives_bake_fields_and_applies_defaults
        claim_type: Creation
        grounds:
          - entities.PartSpec
          - entities.PartSpec.fields.he_bake_required
          - entities.PartSpec.fields.he_bake_min_minutes
          - entities.PartSpec.fields.scrap_allowance_pct
          - entities.PartSpec.fields.count_tolerance_pct
          - calculations.he_bake_compliance
          - endpoints[POST /part-specs]
        distinguishing_aspect: >
          A CLASS_10_9 ZINC_CLEAR spec posted without scrap_allowance_pct and count_tolerance_pct
          returns 201 with he_bake_required true, he_bake_min_minutes 240, scrap_allowance_pct 0.05,
          count_tolerance_pct 0.02 and version 1 — the two bake fields are derived from the pair
          (plating_spec, strength_class) and are never taken from the request.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-09-01T06:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
          trigger:
            - call: "POST /part-specs"
              payload: { part_number: "HX-M8-109", thread_designation: "M8x1.25", strength_class: "CLASS_10_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 20.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL", "POINT"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.150, plating_spec: "ZINC_CLEAR", packaging_mode: "BY_WEIGHT", nominal_pack_count: 500, pieces_per_kg: 62.5, proof_load_kn: 34.7 }
              as: ProcessEngineer
              captures: { spec_id: $.data.id }
          assert:
            - "The response is 201 and PartSpec.${spec_id}.he_bake_required == true"
            - "PartSpec.${spec_id}.he_bake_min_minutes == 240"
            - "PartSpec.${spec_id}.scrap_allowance_pct == 0.05"
            - "PartSpec.${spec_id}.count_tolerance_pct == 0.02"
            - "PartSpec.${spec_id}.version == 1 and created_at == 2026-09-01T06:00:00Z"
            - "Every submitted field is echoed unchanged: part_number == HX-M8-109, plating_spec == ZINC_CLEAR, required_secondary_ops == [THREAD_ROLL, POINT], max_decarb_depth_mm == 0.150"

      - name: furnace_defaults_cooldown_to_thirty_minutes
        claim_type: Defaults
        grounds:
          - entities.Furnace.fields.cooldown_minutes
          - entities.Furnace.fields.status
          - entities.Furnace.fields.last_run_end_at
          - endpoints[POST /furnaces]
        distinguishing_aspect: >
          Omitting cooldown_minutes yields exactly 30 on the stored Furnace — a different default field
          on a different entity than the PartSpec pair above — while status starts IDLE and
          last_run_end_at starts null.
        test_recipe:
          setup:
            - "Empty database; clock at 2026-09-01T06:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
          trigger:
            - call: "POST /furnaces"
              payload: { furnace_code: "FCE-1", max_charge_mass_kg: 400.0 }
              as: ProcessEngineer
              captures: { furnace_id: $.data.id }
          assert:
            - "The response is 201 and Furnace.${furnace_id}.cooldown_minutes == 30"
            - "Furnace.${furnace_id}.status == IDLE"
            - "Furnace.${furnace_id}.last_run_end_at == null"
            - "Furnace.${furnace_id}.max_charge_mass_kg == 400.0 and version == 1"

      - name: wire_lot_reduction_pct_computed_from_diameters
        claim_type: Computed Fields
        grounds:
          - entities.WireLot.fields.reduction_pct
          - entities.WireLot.fields.available_mass_kg
          - entities.WireLot.fields.reserved_mass_kg
          - entities.WireLot.fields.consumed_mass_kg
          - calculations.wire_draw_reduction
          - endpoints[POST /wire-lots]
        distinguishing_aspect: >
          reduction_pct is not an input at all: drawing 8.00 mm down to 6.80 mm stores 27.75 (from
          round_half_up((1 - (6.80/8.00)^2) * 100, 2)), and the three ledger members open at
          500.000 / 0.000 / 0.000 with status DRAWN.
        test_recipe:
          setup:
            - "A steel heat exists so the wire lot has a resolvable parent; the heat is not yet verified, which does not block wire-lot creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 500.0, mill_cert_serial: "MC-2026-000481" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
          trigger:
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 500.0 }
              as: ProcessEngineer
              captures: { wire_id: $.data.id }
          assert:
            - "The response is 201 and WireLot.${wire_id}.reduction_pct == 27.75"
            - "WireLot.${wire_id}.available_mass_kg == 500.000, reserved_mass_kg == 0.000, consumed_mass_kg == 0.000"
            - "WireLot.${wire_id}.status == DRAWN and quarantine_source == NONE"
            - "WireLot.${wire_id}.inspected_at == null and version == 1"
            - "WireLot.${wire_id}.steel_heat_id == ${heat_id}"

      - name: steel_heat_system_fields_are_server_generated
        claim_type: System Fields
        grounds:
          - entities.SteelHeat.fields.cert_status
          - entities.SteelHeat.fields.lab_report_reference
          - entities.SteelHeat.fields.verified_at
          - entities.SteelHeat.fields.verified_by_user_id
          - entities.SteelHeat.fields.counterfeit_reason
          - endpoints[POST /steel-heats]
        distinguishing_aspect: >
          The four system-sourced provenance fields of a freshly registered heat are all null and
          cert_status is PENDING; id, created_at and updated_at are server-minted at the pinned logical
          clock instant, none of them settable through the endpoint's input list.
        test_recipe:
          setup:
            - "Empty database; clock at 2026-09-01T06:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
          trigger:
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 500.0, mill_cert_serial: "MC-2026-000481" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
          assert:
            - "The response is 201 and SteelHeat.${heat_id}.cert_status == PENDING"
            - "SteelHeat.${heat_id}.lab_report_reference == null, verified_at == null, verified_by_user_id == null, counterfeit_reason == null"
            - "SteelHeat.${heat_id}.created_at == 2026-09-01T06:00:00Z and updated_at == 2026-09-01T06:00:00Z and version == 1"
            - "SteelHeat.${heat_id}.id is a server-minted identifier, not a value present in the request body"

      - name: production_lot_rejects_a_payload_missing_the_occ_field
        claim_type: Required Fields
        grounds:
          - endpoints[POST /production-lots]
          - concurrency_rules.production-lot-create-stale-wire-lot
          - validations[priority=3, error_id=ERR_VALIDATION]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: >
          expected_wire_lot_version is a required input with no default: omitting it returns 400
          ERR_VALIDATION at priority 3 and creates no ProductionLot, and the wire lot's ledger and
          version are left untouched — the schema rule fires before any reservation is attempted.
        test_recipe:
          setup:
            - "Part spec NP-M8-088, verified heat H-77410, released wire lot (500.000 kg available) and tool DIE-4S-001 mounted on PRESS-3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /part-specs"
              payload: { part_number: "NP-M8-088", thread_designation: "M8x1.25", strength_class: "CLASS_10_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 20.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.100, plating_spec: "NONE", packaging_mode: "BY_COUNT", nominal_pack_count: 100, pieces_per_kg: 62.5, proof_load_kn: 34.7 }
              as: ProcessEngineer
              captures: { spec_id: $.data.id }
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 500.0, mill_cert_serial: "MC-2026-000481" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "VERIFIED", mill_cert_serial: "MC-2026-000481", lab_report_reference: "LAB-0001" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 500.0 }
              as: ProcessEngineer
              captures: { wire_id: $.data.id }
            - call: "POST /wire-lots/${wire_id}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { wire_v1: $.data.version }
            - call: "POST /heading-tools"
              payload: { tool_code: "DIE-4S-001", station_count: 4, rated_life_pieces: 120000 }
              as: ProcessEngineer
              captures: { tool_id: $.data.id }
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-3" }
              as: ProcessEngineer
          trigger:
            - call: "POST /production-lots"
              payload: { lot_code: "L-2601", part_spec_id: "${spec_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T06:00:00Z", press_window_end_at: "2026-09-01T10:00:00Z", planned_pieces: 5000 }
              as: ProcessEngineer
              captures: { err_missing_occ: $.data.error_id }
          assert:
            - "The response is 400 with error_id ERR_VALIDATION"
            - "GET /production-lots?wire_lot_id=${wire_id} returns total_count 0 — no lot row was written"
            - "WireLot.${wire_id}.available_mass_kg == 500.000, reserved_mass_kg == 0.000 and version == ${wire_v1} (unchanged)"

      - name: part_spec_rejects_an_unknown_strength_class_enum
        claim_type: Type Constraints
        grounds:
          - entities.PartSpec.fields.strength_class
          - validations[priority=3, error_id=ERR_VALIDATION]
          - errors[ERR_VALIDATION]
          - endpoints[POST /part-specs]
        distinguishing_aspect: >
          CLASS_9_9 is outside the declared strength_class enum, so the create returns 400
          ERR_VALIDATION and no PartSpec is persisted — an enum-domain violation, distinct from the
          missing-required-field violation of the previous instance.
        test_recipe:
          setup:
            - "Empty database; clock at 2026-09-01T06:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
          trigger:
            - call: "POST /part-specs"
              payload: { part_number: "BAD-M8-001", thread_designation: "M8x1.25", strength_class: "CLASS_9_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 20.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.100, plating_spec: "NONE", packaging_mode: "BY_COUNT", nominal_pack_count: 100, pieces_per_kg: 62.5, proof_load_kn: 34.7 }
              as: ProcessEngineer
              captures: { err_enum: $.data.error_id }
          assert:
            - "The response is 400 with error_id ERR_VALIDATION"
            - "No PartSpec row exists: a subsequent POST /part-specs with part_number BAD-M8-001 and strength_class CLASS_10_9 succeeds with 201 rather than returning ERR_DUPLICATE_IDENTIFIER"

      - name: production_lot_rejects_a_press_window_that_ends_before_it_starts
        claim_type: Type Constraints
        grounds:
          - entities.ProductionLot.fields.press_window_end_at
          - validations[priority=3, error_id=ERR_VALIDATION]
          - errors[ERR_VALIDATION]
          - endpoints[POST /production-lots]
        distinguishing_aspect: >
          The numeric/temporal ordering constraint press_window_end_at > press_window_start_at is
          enforced at priority 3, before the priority-15 press-window overlap rule ever runs: an
          inverted window returns 400 ERR_VALIDATION, not 409 ERR_TOOL_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Part spec NP-M8-088, verified heat, released wire lot and mounted tool exactly as in production_lot_rejects_a_payload_missing_the_occ_field."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /part-specs"
              payload: { part_number: "NP-M8-088", thread_designation: "M8x1.25", strength_class: "CLASS_10_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 20.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.100, plating_spec: "NONE", packaging_mode: "BY_COUNT", nominal_pack_count: 100, pieces_per_kg: 62.5, proof_load_kn: 34.7 }
              as: ProcessEngineer
              captures: { spec_id: $.data.id }
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 500.0, mill_cert_serial: "MC-2026-000481" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "VERIFIED", mill_cert_serial: "MC-2026-000481", lab_report_reference: "LAB-0001" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 500.0 }
              as: ProcessEngineer
              captures: { wire_id: $.data.id }
            - call: "POST /wire-lots/${wire_id}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { wire_v1: $.data.version }
            - call: "POST /heading-tools"
              payload: { tool_code: "DIE-4S-001", station_count: 4, rated_life_pieces: 120000 }
              as: ProcessEngineer
              captures: { tool_id: $.data.id }
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-3" }
              as: ProcessEngineer
          trigger:
            - call: "POST /production-lots"
              payload: { lot_code: "L-2601", part_spec_id: "${spec_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T10:00:00Z", press_window_end_at: "2026-09-01T06:00:00Z", planned_pieces: 5000, expected_wire_lot_version: "${wire_v1}" }
              as: ProcessEngineer
              captures: { err_window: $.data.error_id }
          assert:
            - "The response is 400 with error_id ERR_VALIDATION"
            - "GET /production-lots?wire_lot_id=${wire_id} returns total_count 0"
            - "WireLot.${wire_id}.reserved_mass_kg == 0.000 and version == ${wire_v1}"

      - name: unknown_ids_return_their_own_not_found_error
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_PART_SPEC_NOT_FOUND]
          - errors[ERR_STEEL_HEAT_NOT_FOUND]
          - errors[ERR_WIRE_LOT_NOT_FOUND]
          - errors[ERR_HEADING_TOOL_NOT_FOUND]
          - errors[ERR_FURNACE_NOT_FOUND]
          - errors[ERR_PRODUCTION_LOT_NOT_FOUND]
          - errors[ERR_SECONDARY_OPERATION_NOT_FOUND]
          - errors[ERR_HEAT_TREAT_RUN_NOT_FOUND]
          - errors[ERR_PLATING_RUN_NOT_FOUND]
          - errors[ERR_LOT_TEST_NOT_FOUND]
          - errors[ERR_CERT_DOCUMENT_NOT_FOUND]
          - errors[ERR_PACK_UNIT_NOT_FOUND]
        distinguishing_aspect: >
          Each of the twelve path-placeholder families answers an unknown id with its own entity-specific
          404 code rather than a shared generic one, and the priority-4 existence check runs before any
          body-schema or state rule, so even the POST actions with valid bodies return 404.
        test_recipe:
          setup:
            - "Empty database; clock at 2026-09-01T06:00:00Z. Every id below is the unassigned UUID 00000000-0000-0000-0000-0000000000ff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
          trigger:
            - call: "GET /part-specs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlantAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /steel-heats/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlantAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /wire-lots/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlantAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /heading-tools/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlantAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /furnaces/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlantAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /production-lots/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlantAdmin
              captures: { e6: $.data.error_id }
            - call: "POST /secondary-operations/00000000-0000-0000-0000-0000000000ff/complete"
              payload: { pieces_out: 10 }
              as: ProcessEngineer
              captures: { e7: $.data.error_id }
            - call: "GET /heat-treat-runs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlantAdmin
              captures: { e8: $.data.error_id }
            - call: "POST /plating-runs/00000000-0000-0000-0000-0000000000ff/complete-plating"
              payload: {}
              as: HeatTreatOperator
              captures: { e9: $.data.error_id }
            - call: "POST /lot-tests/00000000-0000-0000-0000-0000000000ff/results"
              payload: { proof_load_failures: 0, tensile_failures: 0, min_measured_core_hardness_hv: 320.0 }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { e10: $.data.error_id }
            - call: "GET /certification-documents/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlantAdmin
              captures: { e11: $.data.error_id }
            - call: "GET /pack-units/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlantAdmin
              captures: { e12: $.data.error_id }
          assert:
            - "Every one of the twelve calls returns HTTP 404"
            - "The error_ids are, in call order: ERR_PART_SPEC_NOT_FOUND, ERR_STEEL_HEAT_NOT_FOUND, ERR_WIRE_LOT_NOT_FOUND, ERR_HEADING_TOOL_NOT_FOUND, ERR_FURNACE_NOT_FOUND, ERR_PRODUCTION_LOT_NOT_FOUND, ERR_SECONDARY_OPERATION_NOT_FOUND, ERR_HEAT_TREAT_RUN_NOT_FOUND, ERR_PLATING_RUN_NOT_FOUND, ERR_LOT_TEST_NOT_FOUND, ERR_CERT_DOCUMENT_NOT_FOUND, ERR_PACK_UNIT_NOT_FOUND"
            - "Each response body carries data.error_id and data.message and response_type == error per §1.0"

      - name: heading_tool_read_returns_its_initial_life_projection
        claim_type: Retrieval
        grounds:
          - entities.HeadingTool.fields.rated_derated_life_pieces
          - entities.HeadingTool.fields.conservative_life_pieces
          - entities.HeadingTool.fields.observed_avg_cycle_pieces
          - entities.HeadingTool.fields.cycle_pieces_history
          - calculations.tool_effective_life
          - endpoints[GET /heading-tools/{id}]
        distinguishing_aspect: >
          GET returns exactly what POST stored plus the initialised life projection: with regrind_count 0
          both life budgets equal the 120000 nameplate, observed_avg_cycle_pieces is null and
          cycle_pieces_history is the empty array — the read invents nothing.
        test_recipe:
          setup:
            - "One heading tool registered with rated_life_pieces 120000 and max_regrinds omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /heading-tools"
