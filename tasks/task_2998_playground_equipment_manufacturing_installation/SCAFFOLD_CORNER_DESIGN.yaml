            - "the second booking succeeds (2026-08-20..2026-08-21 leaves far more than TRAVEL_BUFFER_DAYS 1 clear of 2026-08-08): ${job2_booked} == 4 (crew 2 * 2 days) and ${committed_after_job2} == 16"
