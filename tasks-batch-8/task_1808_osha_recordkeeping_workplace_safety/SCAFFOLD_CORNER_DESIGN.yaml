              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "DI Worker", job_title: "Tech", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-01T10:00:00Z", description: "DI", body_part: "arm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "JOB_TRANSFER_RESTRICTION", expected_case_version: "${case_v}" }
              as: SafetyOfficer
          trigger:
            - call: "POST /safety/cases/${case_id}/day-entries"
              payload: { day_type: "RESTRICTED", start_date: "2026-08-10", end_date: "2026-08-05" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DAY_INTERVAL_INVALID"

