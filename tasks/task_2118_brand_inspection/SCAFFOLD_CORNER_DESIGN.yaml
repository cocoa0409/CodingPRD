        grounds: [complexity_profile.consistency_model, state_machines.AnimalLot.UNCHECKED_to_UNMATCHED, entities.Territory.fields.impound_current_head]
        distinguishing_aspect: "The consistency model is immediate: the EstrayCase row, the district's impound_current_head of 15 and the lot's ESTRAY_HOLD disposition are all readable on the first request issued after the finding, with no sweep or second write in between."
        test_recipe:
          setup: ["Clock at 2026-08-05T00:00:00Z; one order IN_FIELD in district T-IMM with a 15-head lot carrying no legible brand and impound_current_head still 0."]
