scenario: "Textbook & Course-Material Rental (Chegg style): catalog & ISBN/edition, rent vs buy vs ebook & term, due-date & extension/late, return label & condition/damage, buyback & price quote, subscription (study/solutions) add-on, highlighting allowance, refund/cancel"
domain_name: "textbook-rental"
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # Peer entities linked by explicit foreign keys (customer_id, order_id,
  # catalog_item_id, inventory_unit_id, rental_id); no deep URL nesting.
  state_machine_shape: parallel
  # Order carries two independent axes (payment_status x fulfillment_status);
  # ReturnShipment is branching (fork by inspection outcome); BuybackQuote is
  # branching (fork by assessed-condition match/mismatch).
  relationship_patterns:
    - one_to_many        # CatalogItem 1..N InventoryUnit; Customer 1..N Order
    - cross_aggregate    # Rental references Order and InventoryUnit across aggregates
  role_model: peer_roles
  # Customer owns orders/rentals/quotes/subscriptions; WarehouseAgent owns
  # physical intake/inspection; CatalogAdmin owns catalog/inventory/plan config.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - name: isbn13
        type: string
        source: input
        description: "13-digit ISBN of this edition; unique per (isbn13, edition)."
        constraints: "13 numeric chars; unique together with edition"
      - name: edition
        type: integer
        source: input
        description: "Edition number of the title."
        constraints: ">= 1"
      - name: title
        type: string
        source: input
        description: "Book title."
      - name: author
        type: string
        source: input
        description: "Primary author."
      - name: list_price_cents
        type: integer
        source: input
        description: "Full purchase (BUY) price in cents; also the damage-fee cap."
        constraints: ">= 0"
      - name: rental_base_cents
        type: integer
        source: input
        description: "Base rental price in cents for the standard 90-day term."
        constraints: ">= 0"
      - name: ebook_price_cents
        type: integer
        source: input
        description: "Ebook access price in cents for one term."
        constraints: ">= 0"
      - name: buyback_base_cents
        type: integer
        source: input
        description: "Base buyback value in cents at NEW condition (multiplied by condition factor)."
        constraints: ">= 0"
      - name: replacement_fee_cents
        type: integer
        source: input
        description: "Charge in cents when a rented unit is lost / not returned."
        constraints: ">= 0"
      - name: rentable
        type: boolean
        source: input
        description: "Whether RENT orders are allowed for this item."
        default: true
      - name: buyable
        type: boolean
        source: input
        description: "Whether BUY orders are allowed for this item."
        default: true
      - name: ebook_available
        type: boolean
        source: input
        description: "Whether EBOOK orders are allowed for this item."
        default: false
      - name: highlighting_allowed
        type: boolean
        source: input
        description: "Whether any highlighting is permitted on rented units without a flat penalty."
        default: true
      - name: max_highlight_pct
        type: number
        source: input
        description: "Max percent of pages that may be highlighted before per-point overage fees apply (only when highlighting_allowed)."
        default: 10
        constraints: "0..100"

  - name: InventoryUnit
    parent: null
    common_fields: true
    fields:
      - name: catalog_item_id
        type: string
        source: input
        description: "FK -> CatalogItem.id; the title/edition this physical copy is."
      - name: condition_grade
        type: enum
        source: input
        description: "Current graded condition of the copy."
        constraints: "one of {NEW, LIKE_NEW, GOOD, ACCEPTABLE}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle status of the physical copy."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, RESERVED, RENTED, IN_INSPECTION, RETIRED, SOLD}"
      - name: acquisition_cost_cents
        type: integer
        source: input
        description: "What the platform paid for this copy, in cents."
        constraints: ">= 0"
      - name: times_rented
        type: integer
        source: system
        description: "Count of completed rentals through this copy."
        default: 0

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Customer email; unique."
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        description: "Customer full name."
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: "Sum of all WalletTransaction.amount_cents for this customer (see calc wallet_balance). Debits are negative, credits positive."
        default: 0
      - name: active_subscription_id
        type: string
        source: system
        description: "Id of the customer's current ACTIVE Subscription, or null."
        default: null

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "Plan tier."
        constraints: "one of {STUDY, SOLUTIONS}"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Recurring fee in cents per term."
        constraints: ">= 0"
      - name: rental_discount_pct
        type: number
        source: input
        description: "Fraction discount applied to rental base pricing for members (e.g. 0.15)."
        constraints: "0..1"
      - name: includes_solutions
        type: boolean
        source: input
        description: "Whether this plan unlocks step-by-step solutions add-on."
      - name: term_months
        type: integer
        source: input
        description: "Length of one billing period in months."
        default: 1
        constraints: ">= 1"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the subscriber."
      - name: plan_id
        type: string
        source: input
        description: "FK -> SubscriptionPlan.id; the chosen plan."
      - name: status
        type: enum
        source: system
        description: "Subscription lifecycle status."
        default: ACTIVE
        constraints: "one of {ACTIVE, CANCELLED, SUPERSEDED}"
      - name: period_start
        type: datetime
        source: system
        description: "Start of the billing period; set to the logical clock at creation."
      - name: period_end
        type: datetime
        source: computed
        description: "period_start + plan.term_months months (see calc subscription_period)."
      - name: monthly_fee_cents
        type: integer
        source: computed
        description: "Snapshot of plan.monthly_fee_cents at creation (immune to later plan edits)."
      - name: rental_discount_pct
        type: number
        source: computed
        description: "Snapshot of plan.rental_discount_pct at creation."

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; who placed the order."
      - name: catalog_item_id
        type: string
        source: input
        description: "FK -> CatalogItem.id; the title being rented/bought/read."
      - name: inventory_unit_id
        type: string
        source: system
        description: "FK -> InventoryUnit.id; set on confirm for RENT/BUY (the reserved copy); null for EBOOK."
        default: null
      - name: fulfillment_type
        type: enum
        source: input
        description: "Order type."
        constraints: "one of {RENT, BUY, EBOOK}"
      - name: rental_term_days
        type: integer
        source: input
        description: "Rental / ebook access term length in days; required for RENT and EBOOK."
        constraints: "one of {30, 60, 90, 120}"
      - name: desired_start_date
        type: datetime
        source: input
        description: "Requested rental window start; defaults to the logical clock at creation (RENT only)."
        default: null
      - name: access_start
        type: datetime
        source: system
        description: "EBOOK access window start; set on pay (EBOOK only)."
        default: null
      - name: access_end
        type: datetime
        source: system
        description: "EBOOK access window end = access_start + rental_term_days (EBOOK only)."
        default: null
      - name: payment_status
        type: enum
        source: system
        description: "Payment axis (independent of fulfillment axis)."
        default: UNPAID
        constraints: "one of {UNPAID, PAID, REFUNDED}"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Fulfillment axis (independent of payment axis)."
        default: PENDING
        constraints: "one of {PENDING, CONFIRMED, DELIVERED, COMPLETED, CANCELLED}"
      - name: quoted_charge_cents
        type: integer
        source: computed
        description: "Provisional charge computed at creation (see calc order_charge, variant=quoted)."
      - name: final_charge_cents
        type: integer
        source: computed
        description: "Final settled charge; set for RENT at rental close (see calc order_charge, variant=final); null until then."
        default: null
      - name: refunded_cents
        type: integer
        source: computed
        description: "Total cents refunded to wallet against this order."
        default: 0

  - name: Rental
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the RENT order that produced this rental."
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the renter (copied from the order for direct ownership checks)."
      - name: inventory_unit_id
        type: string
        source: input
        description: "FK -> InventoryUnit.id; the physical copy on loan."
      - name: status
        type: enum
        source: system
        description: "Rental lifecycle status."
        default: ACTIVE
        constraints: "one of {ACTIVE, RETURN_INITIATED, CLOSED_RETURNED, CLOSED_LOST}"
      - name: start_date
        type: datetime
        source: system
        description: "Rental window start (from Order.desired_start_date)."
      - name: due_date
        type: datetime
        source: computed
        description: "start_date + term_days (see calc rental_due_date)."
      - name: term_days
        type: integer
        source: system
        description: "Current total term in days (grows by EXTENSION_TERM_DAYS per extension)."
      - name: extension_count
        type: integer
        source: system
        description: "Number of extensions applied."
        default: 0
      - name: highlight_pct_used
        type: number
        source: system
        description: "Percent of pages highlighted, reported at inspection; drives highlight fee."
        default: 0
      - name: late_days
        type: integer
        source: computed
        description: "Chargeable late days beyond grace (see calc late_fee)."
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Late fee in cents (see calc late_fee)."
        default: 0
      - name: damage_fee_cents
        type: integer
        source: computed
        description: "Damage + highlight-overage fee in cents (see calc damage_fee)."
        default: 0

  - name: ReturnShipment
    parent: null
    common_fields: true
    fields:
      - name: rental_id
        type: string
        source: input
        description: "FK -> Rental.id; the rental being returned."
      - name: status
        type: enum
        source: system
        description: "Return lifecycle; forks at inspection into one of three terminal outcomes."
        default: LABEL_ISSUED
        constraints: "one of {LABEL_ISSUED, CLOSED_GOOD, CLOSED_DAMAGED, CLOSED_LOST}"
      - name: carrier_label
        type: string
        source: system
        description: "Generated shipping label reference."
      - name: reported_condition
        type: enum
        source: input
        description: "Condition grade the warehouse assessed at inspection."
        default: null
        constraints: "one of {NEW, LIKE_NEW, GOOD, ACCEPTABLE} or null before inspection"
      - name: highlight_pct_reported
        type: number
        source: input
        description: "Percent of pages found highlighted at inspection."
        default: 0
      - name: is_lost
        type: boolean
        source: input
        description: "Set true at inspection when the copy is declared lost/not received."
        default: false
      - name: damage_fee_cents
        type: integer
        source: computed
        description: "Damage fee assessed for this return (mirrors Rental.damage_fee_cents)."
        default: 0

  - name: BuybackQuote
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the seller."
      - name: catalog_item_id
        type: string
        source: input
        description: "FK -> CatalogItem.id; the title being sold back."
      - name: inventory_unit_id
        type: string
        source: system
        description: "FK -> InventoryUnit.id; the intake copy created when a quote is PAID (else null)."
        default: null
      - name: declared_condition
        type: enum
        source: input
        description: "Condition the seller declares."
        constraints: "one of {NEW, LIKE_NEW, GOOD, ACCEPTABLE}"
      - name: assessed_condition
        type: enum
        source: input
        description: "Condition the warehouse assessed at inspection; null before."
        default: null
        constraints: "one of {NEW, LIKE_NEW, GOOD, ACCEPTABLE} or null"
      - name: status
        type: enum
        source: system
        description: "Buyback lifecycle; forks at inspection into PAID or REVISED."
        default: QUOTED
        constraints: "one of {QUOTED, ACCEPTED, REVISED, PAID, DECLINED, SUPERSEDED}"
      - name: quoted_price_cents
        type: integer
        source: computed
        description: "Offer at declared condition (see calc buyback_price, variant=quoted)."
      - name: revised_price_cents
        type: integer
        source: computed
        description: "Offer at assessed condition when it differs (see calc buyback_price, variant=assessed); null unless REVISED."
        default: null
      - name: paid_price_cents
        type: integer
        source: computed
        description: "Amount actually credited on PAID; null until paid."
        default: null
      - name: quote_expires_at
        type: datetime
        source: computed
        description: "created_at + QUOTE_VALIDITY_DAYS; accept is rejected at or after this instant."

  - name: WalletTransaction
    parent: null
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; wallet owner."
      - name: amount_cents
        type: integer
        source: input
        description: "Signed cents: positive = credit to customer, negative = debit."
      - name: kind
        type: enum
        source: input
        description: "Ledger entry kind."
        constraints: "one of {TOP_UP, ORDER_CHARGE, ORDER_REFUND, EXTENSION_FEE, LATE_FEE, DAMAGE_FEE, REPLACEMENT_CHARGE, BUYBACK_CREDIT, SUBSCRIPTION_FEE, SUBSCRIPTION_REFUND}"
      - name: reference_id
        type: string
        source: input
        description: "Opaque id of the originating order/rental/quote/subscription for audit (not a reverse-queryable FK)."
        default: null

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:
  # ---- Order: PARALLEL dimensions (payment_status x fulfillment_status) ----
  - entity: Order
    initial_state: "payment_status=UNPAID, fulfillment_status=PENDING"
    terminal_states: ["fulfillment_status=COMPLETED", "fulfillment_status=CANCELLED"]
    note: "Two independent axes on one row. `pay` moves only payment_status; `confirm`/return-close move only fulfillment_status; `cancel` moves both."
    transitions:
      # --- payment axis ---
      - from: "payment_status=UNPAID"
        to: "payment_status=PAID"
        trigger: "POST /orders/{id}/pay"
        actor: Customer
        preconditions:
          - "payment_status == UNPAID"
          - "customer wallet_credit_cents after debit is not required to be >= 0 (charge always succeeds; credit may go negative only for post-fulfillment fees, but ORDER_CHARGE at pay requires wallet_credit_cents + funding covers it -> see validation credit sufficiency)"
        side_effects:
          - "compute order_charge variant=quoted -> Order.quoted_charge_cents (already set at create; re-affirmed)"
          - "append WalletTransaction(kind=ORDER_CHARGE, amount_cents = -quoted_charge_cents) -> Customer.wallet_credit_cents recomputed"
          - "if fulfillment_type == EBOOK: set fulfillment_status=DELIVERED, access_start=clock_now, access_end=access_start + rental_term_days days"
      # --- fulfillment axis ---
      - from: "fulfillment_status=PENDING"
        to: "fulfillment_status=CONFIRMED"
        trigger: "POST /orders/{id}/confirm"
        actor: WarehouseAgent
        preconditions:
          - "fulfillment_type IN {RENT, BUY}"
          - "payment_status == PAID  (cross-axis guard)"
          - "an InventoryUnit of catalog_item_id exists with status==AVAILABLE and no rental-window conflict (see resource_overlap unit_window)"
        side_effects:
          - "select the eligible InventoryUnit (see selector confirm_unit_selector); set Order.inventory_unit_id"
          - "RENT: InventoryUnit.status AVAILABLE->RESERVED then ->RENTED; create Rental(status=ACTIVE, start_date=desired_start_date, term_days=rental_term_days); compute rental_due_date; InventoryUnit.times_rented += 1"
          - "BUY: InventoryUnit.status AVAILABLE->SOLD; set fulfillment_status=DELIVERED (single step)"
      - from: "fulfillment_status=CONFIRMED"
        to: "fulfillment_status=COMPLETED"
        trigger: "system: Rental reaches CLOSED_RETURNED or CLOSED_LOST (bubble up)"
        actor: system
        preconditions:
          - "linked Rental.status IN {CLOSED_RETURNED, CLOSED_LOST}"
        side_effects:
          - "set Order.final_charge_cents (see calc order_charge variant=final)"
      # --- cancel (both axes) ---
      - from: "fulfillment_status=PENDING"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "fulfillment_status == PENDING  (never CONFIRMED/DELIVERED/COMPLETED)"
        side_effects:
          - "if payment_status == PAID: append WalletTransaction(kind=ORDER_REFUND, amount_cents = +quoted_charge_cents); Order.refunded_cents += quoted_charge_cents; set payment_status=REFUNDED (compensating; see invariant wallet_conservation)"
          - "if EBOOK access already DELIVERED: cancel forbidden (validation)"

  # ---- Rental: linear-with-fork close ----
  - entity: Rental
    initial_state: ACTIVE
    terminal_states: [CLOSED_RETURNED, CLOSED_LOST]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /rentals/{id}/extend"
        actor: Customer
        preconditions:
          - "status == ACTIVE"
          - "extension_count < MAX_EXTENSIONS"
          - "term_days + EXTENSION_TERM_DAYS <= MAX_TOTAL_TERM_DAYS"
          - "customer wallet covers EXTENSION_FEE_CENTS (credit sufficiency)"
        side_effects:
          - "extension_count += 1; term_days += EXTENSION_TERM_DAYS; recompute due_date"
          - "append WalletTransaction(kind=EXTENSION_FEE, amount_cents = -EXTENSION_FEE_CENTS)"
      - from: ACTIVE
        to: RETURN_INITIATED
        trigger: "POST /rentals/{id}/return"
        actor: Customer
        preconditions:
          - "status == ACTIVE"
          - "no open ReturnShipment (status==LABEL_ISSUED) already exists for this rental"
        side_effects:
          - "create ReturnShipment(status=LABEL_ISSUED, carrier_label minted)"
      - from: RETURN_INITIATED
        to: CLOSED_RETURNED
        trigger: "system: ReturnShipment inspected with is_lost=false"
        actor: system
        preconditions:
          - "status == RETURN_INITIATED"
          - "linked ReturnShipment.status IN {CLOSED_GOOD, CLOSED_DAMAGED}  (cross-entity guard)"
        side_effects:
          - "compute late_fee -> late_days, late_fee_cents; compute damage_fee -> damage_fee_cents"
          - "append WalletTransaction(kind=LATE_FEE, amount_cents = -late_fee_cents) if late_fee_cents>0"
          - "append WalletTransaction(kind=DAMAGE_FEE, amount_cents = -damage_fee_cents) if damage_fee_cents>0"
          - "InventoryUnit.status IN_INSPECTION->AVAILABLE; condition_grade := ReturnShipment.reported_condition"
          - "bubble up: Order.fulfillment_status CONFIRMED->COMPLETED; set Order.final_charge_cents"
      - from: RETURN_INITIATED
        to: CLOSED_LOST
        trigger: "system: ReturnShipment inspected with is_lost=true"
        actor: system
        preconditions:
          - "status == RETURN_INITIATED"
          - "linked ReturnShipment.status == CLOSED_LOST"
        side_effects:
          - "late_fee_cents := 0; damage_fee_cents := 0"
          - "append WalletTransaction(kind=REPLACEMENT_CHARGE, amount_cents = -catalog.replacement_fee_cents)"
          - "InventoryUnit.status IN_INSPECTION->RETIRED"
          - "bubble up: Order.fulfillment_status CONFIRMED->COMPLETED; set Order.final_charge_cents = quoted_charge_cents + replacement_fee_cents"
      - from: ACTIVE
        to: CLOSED_LOST
        trigger: "system: return inspected past LOST_THRESHOLD_DAYS (auto-convert; see threshold auto_lost)"
        actor: system
        preconditions:
          - "late_days > LOST_THRESHOLD_DAYS at inspection time"
        note: "Reached only via the return->inspect chain when overdue beyond threshold; same side effects as RETURN_INITIATED->CLOSED_LOST."
        side_effects:
          - "identical to RETURN_INITIATED->CLOSED_LOST"

  # ---- ReturnShipment: BRANCHING fork by inspection outcome ----
  - entity: ReturnShipment
    initial_state: LABEL_ISSUED
    terminal_states: [CLOSED_GOOD, CLOSED_DAMAGED, CLOSED_LOST]
    note: "Non-linear: a single inspect trigger forks into one of three terminals with divergent side-effect sets."
    transitions:
      - from: LABEL_ISSUED
        to: CLOSED_GOOD
        trigger: "POST /return-shipments/{id}/inspect (is_lost=false, no fee assessed)"
        actor: WarehouseAgent
        preconditions:
          - "status == LABEL_ISSUED"
          - "is_lost == false"
          - "computed damage_fee == 0 AND rental late_fee == 0"
        side_effects:
          - "cascade: drive linked Rental RETURN_INITIATED->CLOSED_RETURNED (see Rental cascade)"
      - from: LABEL_ISSUED
        to: CLOSED_DAMAGED
        trigger: "POST /return-shipments/{id}/inspect (is_lost=false, fee assessed)"
        actor: WarehouseAgent
        preconditions:
          - "status == LABEL_ISSUED"
          - "is_lost == false"
          - "computed damage_fee > 0 OR rental late_fee > 0"
        side_effects:
          - "set ReturnShipment.damage_fee_cents = computed damage_fee"
          - "cascade: drive linked Rental RETURN_INITIATED->CLOSED_RETURNED (assesses late+damage fees)"
      - from: LABEL_ISSUED
        to: CLOSED_LOST
        trigger: "POST /return-shipments/{id}/inspect (is_lost=true OR late_days > LOST_THRESHOLD_DAYS)"
        actor: WarehouseAgent
        preconditions:
          - "status == LABEL_ISSUED"
        side_effects:
          - "cascade: drive linked Rental ->CLOSED_LOST (replacement charge, unit RETIRED)"

  # ---- BuybackQuote: BRANCHING fork at inspection ----
  - entity: BuybackQuote
    initial_state: QUOTED
    terminal_states: [PAID, DECLINED, SUPERSEDED]
    transitions:
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /buyback-quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "status == QUOTED"
          - "clock_now < quote_expires_at  (boundary: >= is expired)"
        side_effects:
          - "no ledger change yet"
      - from: QUOTED
        to: SUPERSEDED
        trigger: "system: a newer BuybackQuote created for same (customer_id, catalog_item_id) via POST /buyback-quotes"
        actor: system
        preconditions:
          - "status == QUOTED"
        side_effects:
          - "prior QUOTED quote for the (customer_id, catalog_item_id) pair set to SUPERSEDED (see concurrency rule buyback-requote-stale-customer); POST /buyback-quotes increments Customer.version by 1"
      - from: ACCEPTED
        to: PAID
        trigger: "POST /buyback-quotes/{id}/inspect (assessed_condition == declared_condition)"
        actor: WarehouseAgent
        preconditions:
          - "status == ACCEPTED"
          - "assessed_condition == declared_condition"
        side_effects:
          - "paid_price_cents := quoted_price_cents"
          - "create InventoryUnit(catalog_item_id, condition_grade=assessed_condition, status=AVAILABLE); set BuybackQuote.inventory_unit_id (cascade link 1)"
          - "append WalletTransaction(kind=BUYBACK_CREDIT, amount_cents = +quoted_price_cents) -> Customer.wallet_credit_cents (cascade link 2)"
      - from: ACCEPTED
        to: REVISED
        trigger: "POST /buyback-quotes/{id}/inspect (assessed_condition != declared_condition)"
        actor: WarehouseAgent
        preconditions:
          - "status == ACCEPTED"
          - "assessed_condition != declared_condition"
        side_effects:
          - "compute buyback_price variant=assessed -> revised_price_cents"
      - from: REVISED
        to: PAID
        trigger: "POST /buyback-quotes/{id}/respond-revision (action=ACCEPT)"
        actor: Customer
        preconditions:
          - "status == REVISED"
        side_effects:
          - "paid_price_cents := revised_price_cents"
          - "create InventoryUnit(catalog_item_id, condition_grade=assessed_condition, status=AVAILABLE); set inventory_unit_id"
          - "append WalletTransaction(kind=BUYBACK_CREDIT, amount_cents = +revised_price_cents)"
      - from: REVISED
        to: DECLINED
        trigger: "POST /buyback-quotes/{id}/respond-revision (action=DECLINE)"
        actor: Customer
        preconditions:
          - "status == REVISED"
        side_effects:
          - "no ledger change; item conceptually returned to seller; no InventoryUnit created"

  # ---- Subscription: additive with period non-overlap; cancel with proration ----
  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    note: "Subscriptions are additive (a customer may hold sequential, non-overlapping periods). Creation is guarded by a CLOSED-interval period-overlap rule (see resource overlap subscription_period)."
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "compute subscription_proration -> refund cents"
          - "append WalletTransaction(kind=SUBSCRIPTION_REFUND, amount_cents = +proration_refund_cents) if > 0"
          - "if this subscription was the one referenced by Customer.active_subscription_id: Customer.active_subscription_id := null"

# ============================================================================
# §1.2.1 Concurrency Rules
# ============================================================================
concurrency_rules:
  - rule_id: buyback-requote-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /buyback-quotes"
    occ_field: "expected_customer_version"
    description: |
      Creating a new BuybackQuote for a (customer_id, catalog_item_id) pair
      supersedes any prior QUOTED quote for that same pair (a legitimate
      re-quote). Because a prior create already superseded the earlier quote
      and advanced the seller's Customer.version, a create that still carries
      the customer version the client last observed is stale and rejected.
      Resolved by comparing expected_customer_version to the stored
      Customer.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: order_charge
    trigger: "variant=quoted at POST /orders (create); variant=final on Rental close (CONFIRMED->COMPLETED bubble-up)"
    algorithm: tiered_pricing
    formula: |
      # --- variant=quoted (order create) ---
      if fulfillment_type == RENT:
        base = catalog.rental_base_cents
        term_mult = TERM_MULT[rental_term_days]
        member_disc = customer.active_subscription.rental_discount_pct if customer has ACTIVE subscription else 0
        quoted = round_half_up(base * term_mult * (1 - member_disc))
      elif fulfillment_type == BUY:
        quoted = catalog.list_price_cents
      elif fulfillment_type == EBOOK:
        quoted = catalog.ebook_price_cents
      Order.quoted_charge_cents = quoted

      # --- variant=final (Rental close) ---
      if Rental closed CLOSED_RETURNED:
        # evaluation order is PINNED: (1) late_fee, (2) damage_fee, (3) T0, (4) loyalty tier from T0, (5) subtract
        T0 = Order.quoted_charge_cents + Rental.late_fee_cents + Rental.damage_fee_cents
        loyalty_credit = LOYALTY_CREDIT_CENTS if T0 >= LOYALTY_THRESHOLD_CENTS else 0
        final = T0 - loyalty_credit
      elif Rental closed CLOSED_LOST:
        final = Order.quoted_charge_cents + catalog.replacement_fee_cents   # loyalty NOT applied
      Order.final_charge_cents = final
    input_set: "Single Order + its Rental + linked CatalogItem + the customer's ACTIVE subscription snapshot (rental_discount_pct)."
    constants:
      TERM_MULT: { 30: 0.5, 60: 0.75, 90: 1.0, 120: 1.25 }
      LOYALTY_THRESHOLD_CENTS: 10000
      LOYALTY_CREDIT_CENTS: 500
    precision: "integer cents; round_half_up on each round_half_up() call"
    variants:
      - name: quoted
        when: "at order creation (provisional; excludes any late/damage/replacement)"
        difference: "base * term_mult * (1 - member_disc); no fees, no loyalty credit"
      - name: final
        when: "at rental close (definitive; includes late + damage, applies loyalty credit keyed on the pre-credit total tier)"
        difference: "adds late_fee + damage_fee; subtracts loyalty_credit whose tier is keyed on T0 (circular-looking dependency, order pinned)"

  - name: buyback_price
    trigger: "variant=quoted at POST /buyback-quotes; variant=assessed on inspect when assessed_condition != declared_condition"
    algorithm: weighted_scoring
    formula: |
      COND_MULT = { NEW: 1.0, LIKE_NEW: 0.9, GOOD: 0.75, ACCEPTABLE: 0.5 }
      # variant=quoted
      quoted_price_cents = round_half_up(catalog.buyback_base_cents * COND_MULT[declared_condition])
      # variant=assessed (only when assessed_condition != declared_condition)
      revised_price_cents = round_half_up(catalog.buyback_base_cents * COND_MULT[assessed_condition])
    input_set: "Single BuybackQuote + linked CatalogItem.buyback_base_cents."
    constants:
      COND_MULT: { NEW: 1.0, LIKE_NEW: 0.9, GOOD: 0.75, ACCEPTABLE: 0.5 }
    precision: "integer cents; round_half_up"
    variants:
      - name: quoted
        when: "at quote creation using the seller's declared_condition"
        difference: "multiplier keyed on declared_condition"
      - name: assessed
        when: "at inspection when warehouse assessed_condition differs from declared"
        difference: "multiplier keyed on assessed_condition -> generally lower revised offer"

  - name: late_fee
    trigger: "Rental close via return inspection"
    algorithm: threshold
    formula: |
      # return_instant = logical clock at the inspect call
      raw = (return_instant - Rental.due_date) in fractional days
      days_overdue = max(0, ceil(raw))          # 0 when returned on/before due_date
      late_days = max(0, days_overdue - GRACE_DAYS)   # chargeable only when days_overdue > GRACE_DAYS
      late_fee_cents = min(late_days * DAILY_LATE_FEE_CENTS, catalog.replacement_fee_cents)
      # If days_overdue > LOST_THRESHOLD_DAYS the rental auto-converts to CLOSED_LOST (see state machine);
      # late_fee is then NOT charged (replacement_fee is instead).
    input_set: "Single Rental + linked CatalogItem.replacement_fee_cents + logical clock."
    constants:
      GRACE_DAYS: 3
      DAILY_LATE_FEE_CENTS: 250
      LOST_THRESHOLD_DAYS: 30
    precision: "integer cents; days via ceil of positive day-difference"

  - name: damage_fee
    trigger: "Rental close CLOSED_RETURNED via return inspection"
    algorithm: weighted_scoring
    formula: |
      GRADE_RANK = { NEW: 0, LIKE_NEW: 1, GOOD: 2, ACCEPTABLE: 3 }
      original = InventoryUnit.condition_grade   # value BEFORE it is overwritten by reported_condition at close
      assessed = ReturnShipment.reported_condition
      severity = max(0, GRADE_RANK[assessed] - GRADE_RANK[original])
      condition_fee = severity * CONDITION_STEP_FEE_CENTS
      if catalog.highlighting_allowed:
        overage_pts = max(0, ReturnShipment.highlight_pct_reported - catalog.max_highlight_pct)   # boundary: > max
        highlight_fee = round_half_up(overage_pts * HIGHLIGHT_FEE_PER_PCT_CENTS)
      else:
        highlight_fee = HIGHLIGHT_BANNED_FLAT_CENTS if ReturnShipment.highlight_pct_reported > 0 else 0
      damage_fee_cents = min(condition_fee + highlight_fee, catalog.list_price_cents)   # capped at list price
    input_set: "Single Rental + its InventoryUnit (pre-update condition) + ReturnShipment (reported_condition, highlight_pct_reported) + CatalogItem (highlighting_allowed, max_highlight_pct, list_price_cents)."
    constants:
      GRADE_RANK: { NEW: 0, LIKE_NEW: 1, GOOD: 2, ACCEPTABLE: 3 }
      CONDITION_STEP_FEE_CENTS: 1500
      HIGHLIGHT_FEE_PER_PCT_CENTS: 200
      HIGHLIGHT_BANNED_FLAT_CENTS: 2500
    precision: "integer cents; round_half_up on the highlight_fee term"

  - name: rental_due_date
    trigger: "on Rental creation and on each extension"
    algorithm: aggregation
    formula: |
      Rental.due_date = Rental.start_date + Rental.term_days days
    input_set: "Single Rental."
    constants: {}
    precision: "whole days; ISO 8601 UTC"

  - name: subscription_period
    trigger: "on Subscription creation"
    algorithm: aggregation
    formula: |
      term_days = plan.term_months * 30
      Subscription.period_start = clock_now
      Subscription.period_end = period_start + term_days days
    input_set: "Single Subscription + linked SubscriptionPlan.term_months."
    constants:
      DAYS_PER_MONTH: 30
    precision: "whole days; ISO 8601 UTC"

  - name: subscription_proration
    trigger: "POST /subscriptions/{id}/cancel"
    algorithm: aggregation
    formula: |
      term_days = plan.term_months * 30    # equals (period_end - period_start) in days
      elapsed_days = clamp(floor((clock_now - period_start) in days), 0, term_days)
      remaining_days = term_days - elapsed_days
      proration_refund_cents = round_half_up(Subscription.monthly_fee_cents * remaining_days / term_days)
    input_set: "Single Subscription + logical clock."
    constants:
      DAYS_PER_MONTH: 30
    precision: "integer cents; round_half_up; floor on elapsed_days"

  - name: extension_fee
    trigger: "POST /rentals/{id}/extend"
    algorithm: aggregation
    formula: |
      fee = EXTENSION_FEE_CENTS                       # flat per extension
      new_term_days = Rental.term_days + EXTENSION_TERM_DAYS
      # guarded by: extension_count < MAX_EXTENSIONS AND new_term_days <= MAX_TOTAL_TERM_DAYS
    input_set: "Single Rental."
    constants:
      EXTENSION_FEE_CENTS: 1500
      EXTENSION_TERM_DAYS: 30
      MAX_EXTENSIONS: 2
      MAX_TOTAL_TERM_DAYS: 210
    precision: "integer cents"

  - name: wallet_balance
    trigger: "recomputed on every WalletTransaction append; exposed as Customer.wallet_credit_cents"
    algorithm: aggregation
    formula: |
      Customer.wallet_credit_cents = sum(txn.amount_cents for txn in WalletTransaction where txn.customer_id == Customer.id)
    input_set: "All WalletTransaction rows for the customer (append-only; order-independent sum)."
    constants: {}
    precision: "integer cents; exact sum"

  - name: confirm_unit_selector
    trigger: "POST /orders/{id}/confirm (RENT/BUY) selects which InventoryUnit to reserve"
    algorithm: waterfall_allocation
    formula: |
      available = InventoryUnit where catalog_item_id == order.catalog_item_id AND status == AVAILABLE
      if available is empty:
        -> ERR_NO_AVAILABLE_UNIT            # referential: no AVAILABLE-status copy exists at all
      requested_window = [order.desired_start_date, rental_due(order) + INSPECTION_BUFFER_DAYS)   # half-open; buffer added to due
      eligible = { u in available : fulfillment_type != RENT
                   OR no existing Rental window [r.start_date, r.due_date + INSPECTION_BUFFER_DAYS)
                      on u overlaps requested_window }   # HALF-OPEN overlap test
      if eligible is empty:                 # some AVAILABLE units exist but every one collides on the window
        -> ERR_UNIT_WINDOW_CONFLICT         # temporal (pri 8), distinct from the referential empty case above
      rank eligible ascending by: (GRADE_RANK[condition_grade], times_rented, created_at)
      tie-break: created_at ASC             # never id
      pick = first eligible
    input_set: "All InventoryUnit of the catalog item + every Rental window (any status) on each unit."
    constants:
      GRADE_RANK: { NEW: 0, LIKE_NEW: 1, GOOD: 2, ACCEPTABLE: 3 }
      INSPECTION_BUFFER_DAYS: 2
    precision: "n/a; deterministic ordering, created_at ASC final tie-break"

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role in X-User-Role is permitted for the endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for entity_backed Customer actions on an owned resource, X-User-ID equals the resource's customer_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "Customer-owned resources (orders, rentals, subscriptions, buyback-quotes, wallet)"
  - priority: 4
    category: existence
    check: "path/body-referenced resource exists (validated left-to-right): CatalogItem, InventoryUnit, Customer, SubscriptionPlan, Subscription, Order, Rental, ReturnShipment, BuybackQuote"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id or body FK (resource-specific NOT_FOUND error per §1.6)"
  - priority: 5
    category: state
    check: "POST /orders/{id}/cancel: order fulfillment_status == PENDING"
    error_id: ERR_ORDER_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /orders/{id}/cancel"
  - priority: 5
    category: state
    check: "POST /orders/{id}/confirm: order fulfillment_status == PENDING and payment_status == PAID"
    error_id: ERR_ORDER_NOT_PAID
    http_status: 409
    applies_to: "POST /orders/{id}/confirm"
  - priority: 5
    category: state
    check: "POST /orders/{id}/pay: payment_status == UNPAID"
    error_id: ERR_ORDER_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /orders/{id}/pay"
  - priority: 5
    category: state
    check: "POST /rentals/{id}/extend and /return: rental status == ACTIVE"
    error_id: ERR_RENTAL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /rentals/{id}/extend, POST /rentals/{id}/return"
  - priority: 5
    category: state
    check: "POST /rentals/{id}/return: no open ReturnShipment (LABEL_ISSUED) already exists for the rental"
    error_id: ERR_RETURN_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /rentals/{id}/return"
  - priority: 5
    category: state
    check: "POST /return-shipments/{id}/inspect: return status == LABEL_ISSUED"
    error_id: ERR_RETURN_NOT_OPEN
    http_status: 409
    applies_to: "POST /return-shipments/{id}/inspect"
  - priority: 5
    category: state
    check: "POST /buyback-quotes/{id}/accept: quote status == QUOTED"
    error_id: ERR_QUOTE_NOT_OPEN
    http_status: 409
    applies_to: "POST /buyback-quotes/{id}/accept"
  - priority: 5
    category: state
    check: "POST /buyback-quotes/{id}/inspect: quote status == ACCEPTED"
    error_id: ERR_QUOTE_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /buyback-quotes/{id}/inspect"
  - priority: 5
    category: state
    check: "POST /buyback-quotes/{id}/respond-revision: quote status == REVISED"
    error_id: ERR_QUOTE_NOT_REVISED
    http_status: 409
    applies_to: "POST /buyback-quotes/{id}/respond-revision"
  - priority: 5
    category: state
    check: "POST /subscriptions/{id}/cancel: subscription status == ACTIVE"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /subscriptions/{id}/cancel"
  - priority: 6
    category: business_safety
    check: "POST /orders/{id}/cancel: an EBOOK order already DELIVERED (access granted) cannot be cancelled/refunded"
    error_id: ERR_EBOOK_ALREADY_DELIVERED
    http_status: 422
    applies_to: "POST /orders/{id}/cancel"
  - priority: 7
    category: business_referential
    check: "POST /orders RENT requires catalog.rentable == true"
    error_id: ERR_ITEM_NOT_RENTABLE
    http_status: 422
    applies_to: "POST /orders"
  - priority: 7
    category: business_referential
    check: "POST /orders BUY requires catalog.buyable == true"
    error_id: ERR_ITEM_NOT_BUYABLE
    http_status: 422
    applies_to: "POST /orders"
  - priority: 7
    category: business_referential
    check: "POST /orders EBOOK requires catalog.ebook_available == true"
    error_id: ERR_ITEM_NOT_EBOOK_AVAILABLE
    http_status: 422
    applies_to: "POST /orders"
  - priority: 7
    category: business_referential
    check: "POST /orders/{id}/confirm: at least one AVAILABLE-status InventoryUnit exists for the catalog item"
    error_id: ERR_NO_AVAILABLE_UNIT
    http_status: 409
    applies_to: "POST /orders/{id}/confirm"
  - priority: 8
    category: business_temporal
    check: "POST /orders/{id}/confirm RENT: raised when AVAILABLE-status units exist (so ERR_NO_AVAILABLE_UNIT does not apply) but EVERY one has an existing Rental window [start, due + INSPECTION_BUFFER_DAYS) overlapping the requested window [desired_start, new_due + INSPECTION_BUFFER_DAYS) (HALF-OPEN overlap; buffer added to each due)"
    error_id: ERR_UNIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /orders/{id}/confirm"
  - priority: 8
    category: business_temporal
    check: "POST /customers/{id}/subscription: new period [period_start, period_end] must not overlap any non-CANCELLED Subscription period of the customer (CLOSED interval; boundary touch end==next_start is a CONFLICT)"
    error_id: ERR_SUBSCRIPTION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /customers/{id}/subscription"
  - priority: 8
    category: business_temporal
    check: "POST /orders EBOOK: new access window [access_start, access_end) must not overlap the customer's existing active EBOOK access window for the same catalog item (HALF-OPEN, no buffer; adjacency end==next_start allowed)"
    error_id: ERR_EBOOK_LICENSE_OVERLAP
    http_status: 409
    applies_to: "POST /orders"
  - priority: 8
    category: business_temporal
    check: "POST /buyback-quotes/{id}/accept: logical clock < quote_expires_at (at/after is expired)"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /buyback-quotes/{id}/accept"
  - priority: 9
    category: business_constraint
    check: "POST /rentals/{id}/extend: extension_count < MAX_EXTENSIONS and term_days + EXTENSION_TERM_DAYS <= MAX_TOTAL_TERM_DAYS"
    error_id: ERR_MAX_EXTENSIONS_REACHED
    http_status: 422
    applies_to: "POST /rentals/{id}/extend"
  - priority: 9
    category: business_constraint
    check: "POST /orders RENT requires rental_term_days in {30,60,90,120}; EBOOK requires rental_term_days present; BUY forbids it"
    error_id: ERR_INVALID_TERM
    http_status: 422
    applies_to: "POST /orders"
  - priority: 9
    category: business_constraint
    check: "POST /catalog: (isbn13, edition) is unique"
    error_id: ERR_DUPLICATE_EDITION
    http_status: 409
    applies_to: "POST /catalog"
  - priority: 9
    category: business_constraint
    check: "request body required fields present and well-typed; enum values in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST"
  - priority: 10
    category: business_fiscal
    check: "OCC: POST /buyback-quotes expected_customer_version == Customer.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /buyback-quotes"
  - priority: 11
    category: business_fiscal
    check: "POST /rentals/{id}/extend: wallet_credit_cents >= EXTENSION_FEE_CENTS (funds cover the extension fee)"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "POST /rentals/{id}/extend"
  - priority: 11
    category: business_fiscal
    check: "POST /orders/{id}/pay: wallet_credit_cents >= quoted_charge_cents (funds cover the charge)"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "POST /orders/{id}/pay"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock)."
    roles: [CatalogAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets logical clock used by all deadline/expiry/window rules"]

  - method: POST
    path: "/catalog"
    description: "Create a catalog item (ISBN/edition)."
    roles: [CatalogAdmin]
    code: 201
    input: [isbn13, edition, title, author, list_price_cents, rental_base_cents, ebook_price_cents, buyback_base_cents, replacement_fee_cents, "rentable?", "buyable?", "ebook_available?", "highlighting_allowed?", "max_highlight_pct?"]
    output: CatalogItem
    side_effects: ["enforces (isbn13, edition) uniqueness"]
  - method: GET
    path: "/catalog/{id}"
    description: "Fetch a catalog item."
    roles: [CatalogAdmin, Customer, WarehouseAgent]
    code: 200
    input: []
    output: CatalogItem
    side_effects: []

  - method: POST
    path: "/inventory-units"
    description: "Add a physical copy of a catalog item."
    roles: [CatalogAdmin]
    code: 201
    input: [catalog_item_id, condition_grade, acquisition_cost_cents]
    output: InventoryUnit
    side_effects: ["status initialized to AVAILABLE"]
  - method: GET
    path: "/inventory-units/{id}"
    description: "Fetch a physical copy."
    roles: [CatalogAdmin, WarehouseAgent]
    code: 200
    input: []
    output: InventoryUnit
    side_effects: []
  - method: GET
    path: "/inventory-units"
    description: "List/filter physical copies (reverse-FK for InventoryUnit.catalog_item_id)."
    roles: [CatalogAdmin, WarehouseAgent]
    code: 200
    input: ["catalog_item_id?", "status?", "limit?", "offset?"]
    output: InventoryUnit[]
    side_effects: []

  - method: POST
    path: "/customers"
    description: "Onboard a customer."
    roles: [CatalogAdmin]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: ["wallet_credit_cents initialized to 0"]
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer (includes wallet_credit_cents and version for OCC)."
    roles: [CatalogAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{id}/wallet/adjustments"
    description: "Operator wallet adjustment (top-up / manual credit or debit); the funding channel that lets customers pay."
    roles: [CatalogAdmin]
    code: 201
    input: [amount_cents, "kind?"]
    output: WalletTransaction
    side_effects: ["append WalletTransaction (kind default TOP_UP); recompute Customer.wallet_credit_cents; increments Customer.version by 1"]
  - method: GET
    path: "/customers/{id}/wallet-transactions"
    description: "Customer's ledger (reverse-FK for WalletTransaction.customer_id)."
    roles: [CatalogAdmin, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: WalletTransaction[]
    side_effects: []

  - method: POST
    path: "/subscription-plans"
    description: "Create a subscription plan (STUDY / SOLUTIONS)."
    roles: [CatalogAdmin]
    code: 201
    input: [tier, monthly_fee_cents, rental_discount_pct, includes_solutions, "term_months?"]
    output: SubscriptionPlan
    side_effects: []
  - method: POST
    path: "/customers/{id}/subscription"
    description: "Subscribe the customer to a plan for a billing period."
    roles: [Customer]
    code: 201
    input: [plan_id, "start_date?"]
    output: Subscription
    side_effects: ["compute subscription_period; snapshot monthly_fee_cents & rental_discount_pct; append WalletTransaction(kind=SUBSCRIPTION_FEE, amount = -monthly_fee_cents); set Customer.active_subscription_id if period contains clock_now; enforce CLOSED-interval period non-overlap; increments Customer.version by 1"]
  - method: GET
    path: "/subscriptions/{id}"
    description: "Fetch a subscription."
    roles: [Customer, CatalogAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "List/filter subscriptions (reverse-FK for Subscription.customer_id and Subscription.plan_id)."
    roles: [Customer, CatalogAdmin]
    code: 200
    input: ["customer_id?", "plan_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel a subscription; prorated refund for the remaining period."
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["compute subscription_proration; append WalletTransaction(kind=SUBSCRIPTION_REFUND) if refund>0; clear Customer.active_subscription_id if it pointed here"]

  - method: POST
    path: "/orders"
    description: "Place a RENT / BUY / EBOOK order for a catalog item (customer = X-User-ID)."
    roles: [Customer]
    code: 201
    input: [catalog_item_id, fulfillment_type, "rental_term_days?", "desired_start_date?"]
    output: Order
    side_effects: ["compute order_charge variant=quoted -> quoted_charge_cents; EBOOK: enforce license-window non-overlap; eligibility flags checked"]
  - method: GET
    path: "/orders/{id}"
    description: "Fetch an order (both payment_status and fulfillment_status axes)."
    roles: [Customer, CatalogAdmin, WarehouseAgent]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List/filter orders (reverse-FK for Order.customer_id, catalog_item_id, inventory_unit_id)."
    roles: [Customer, CatalogAdmin, WarehouseAgent]
    code: 200
    input: ["customer_id?", "catalog_item_id?", "inventory_unit_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/pay"
    description: "Pay for an order from wallet credit (payment axis)."
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["append WalletTransaction(kind=ORDER_CHARGE, amount = -quoted_charge_cents); payment_status UNPAID->PAID; EBOOK auto-DELIVERED with access window"]
  - method: POST
    path: "/orders/{id}/confirm"
    description: "Fulfil a paid RENT/BUY order: select+reserve a unit, create the Rental (RENT) or mark sold (BUY) (fulfillment axis)."
    roles: [WarehouseAgent]
    code: 200
    input: []
    output: Order
    side_effects: ["confirm_unit_selector; RENT: unit AVAILABLE->RENTED, create Rental, compute rental_due_date; BUY: unit AVAILABLE->SOLD, fulfillment DELIVERED; enforce unit-window non-overlap"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a PENDING order; refund the charge to wallet if paid."
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["if PAID: append WalletTransaction(kind=ORDER_REFUND, amount = +quoted_charge_cents), payment_status->REFUNDED, refunded_cents += quoted_charge_cents; fulfillment_status->CANCELLED"]

  - method: GET
    path: "/rentals/{id}"
    description: "Fetch a rental (due_date, fees, extension_count)."
    roles: [Customer, WarehouseAgent]
    code: 200
    input: []
    output: Rental
    side_effects: []
  - method: GET
    path: "/rentals"
    description: "List/filter rentals (reverse-FK for Rental.order_id, Rental.customer_id, Rental.inventory_unit_id)."
    roles: [Customer, WarehouseAgent]
    code: 200
    input: ["order_id?", "customer_id?", "inventory_unit_id?", "limit?", "offset?"]
    output: Rental[]
    side_effects: []
  - method: POST
    path: "/rentals/{id}/extend"
    description: "Extend a rental by EXTENSION_TERM_DAYS for a flat fee."
    roles: [Customer]
    code: 200
    input: []
    output: Rental
    side_effects: ["extension_count += 1; term_days += EXTENSION_TERM_DAYS; recompute due_date; append WalletTransaction(kind=EXTENSION_FEE, amount = -EXTENSION_FEE_CENTS)"]
  - method: POST
    path: "/rentals/{id}/return"
    description: "Start a return: mint a label and open a ReturnShipment."
    roles: [Customer]
    code: 201
    input: []
    output: ReturnShipment
    side_effects: ["create ReturnShipment(LABEL_ISSUED); Rental ACTIVE->RETURN_INITIATED; InventoryUnit RENTED->IN_INSPECTION"]
  - method: GET
    path: "/rentals/{id}/return-shipments"
    description: "List a rental's return shipments (reverse-FK for ReturnShipment.rental_id)."
    roles: [Customer, WarehouseAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: ReturnShipment[]
    side_effects: []
  - method: POST
    path: "/return-shipments/{id}/inspect"
    description: "Warehouse inspects the returned copy; forks to CLOSED_GOOD / CLOSED_DAMAGED / CLOSED_LOST and drives the rental-close cascade."
    roles: [WarehouseAgent]
    code: 200
    input: [reported_condition, "highlight_pct_reported?", "is_lost?"]
    output: ReturnShipment
    side_effects: ["compute late_fee + damage_fee; branch to terminal; cascade Rental close -> ledger + Order.final_charge + unit status; see §1.2"]

  - method: POST
    path: "/buyback-quotes"
    description: "Request a buyback price quote; supersedes any prior QUOTED quote for the same (customer, item). Requires OCC on the seller's Customer.version."
    roles: [Customer]
    code: 201
    input: [catalog_item_id, declared_condition, expected_customer_version]
    output: BuybackQuote
    side_effects: ["compute buyback_price variant=quoted; set quote_expires_at; supersede prior QUOTED quote -> SUPERSEDED; increments Customer.version by 1"]
  - method: GET
    path: "/buyback-quotes/{id}"
    description: "Fetch a buyback quote."
    roles: [Customer, WarehouseAgent]
    code: 200
    input: []
    output: BuybackQuote
    side_effects: []
  - method: GET
    path: "/buyback-quotes"
    description: "List/filter buyback quotes (reverse-FK for BuybackQuote.customer_id, catalog_item_id, inventory_unit_id)."
    roles: [Customer, WarehouseAgent]
    code: 200
    input: ["customer_id?", "catalog_item_id?", "inventory_unit_id?", "limit?", "offset?"]
    output: BuybackQuote[]
    side_effects: []
  - method: POST
    path: "/buyback-quotes/{id}/accept"
    description: "Seller accepts the quote (before expiry)."
    roles: [Customer]
    code: 200
    input: []
    output: BuybackQuote
    side_effects: ["status QUOTED->ACCEPTED"]
  - method: POST
    path: "/buyback-quotes/{id}/inspect"
    description: "Warehouse inspects the received copy; forks to PAID (match) or REVISED (mismatch)."
    roles: [WarehouseAgent]
    code: 200
    input: [assessed_condition]
    output: BuybackQuote
    side_effects: ["match: pay quoted, create AVAILABLE InventoryUnit, BUYBACK_CREDIT ledger; mismatch: compute revised_price, status->REVISED"]
  - method: POST
    path: "/buyback-quotes/{id}/respond-revision"
    description: "Seller accepts or declines a revised offer."
    roles: [Customer]
    code: 200
    input: [action]
    output: BuybackQuote
    side_effects: ["ACCEPT: pay revised, create InventoryUnit, BUYBACK_CREDIT; DECLINE: status->DECLINED, no credit"]

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation, or Customer acting on a resource it does not own"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a path id or body FK references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, or out-of-range enum value"
  - id: ERR_ORDER_NOT_CANCELLABLE
    http: 409
    condition: "cancel attempted on an order whose fulfillment_status != PENDING"
  - id: ERR_ORDER_NOT_PAID
    http: 409
    condition: "confirm attempted on an order that is not PENDING+PAID"
  - id: ERR_ORDER_NOT_PAYABLE
    http: 409
    condition: "pay attempted on an order whose payment_status != UNPAID"
  - id: ERR_RENTAL_NOT_ACTIVE
    http: 409
    condition: "extend/return attempted on a rental whose status != ACTIVE"
  - id: ERR_RETURN_ALREADY_OPEN
    http: 409
    condition: "return attempted while an open (LABEL_ISSUED) ReturnShipment already exists"
  - id: ERR_RETURN_NOT_OPEN
    http: 409
    condition: "inspect attempted on a ReturnShipment whose status != LABEL_ISSUED"
  - id: ERR_QUOTE_NOT_OPEN
    http: 409
    condition: "accept attempted on a BuybackQuote whose status != QUOTED"
  - id: ERR_QUOTE_NOT_ACCEPTED
    http: 409
    condition: "inspect attempted on a BuybackQuote whose status != ACCEPTED"
  - id: ERR_QUOTE_NOT_REVISED
    http: 409
    condition: "respond-revision attempted on a BuybackQuote whose status != REVISED"
  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "cancel attempted on a subscription whose status != ACTIVE"
  - id: ERR_EBOOK_ALREADY_DELIVERED
    http: 422
    condition: "cancel attempted on an EBOOK order whose access was already delivered"
  - id: ERR_ITEM_NOT_RENTABLE
    http: 422
    condition: "RENT order for an item with rentable == false"
  - id: ERR_ITEM_NOT_BUYABLE
    http: 422
    condition: "BUY order for an item with buyable == false"
  - id: ERR_ITEM_NOT_EBOOK_AVAILABLE
    http: 422
    condition: "EBOOK order for an item with ebook_available == false"
  - id: ERR_NO_AVAILABLE_UNIT
    http: 409
    condition: "confirm found no AVAILABLE-status InventoryUnit for the catalog item"
  - id: ERR_UNIT_WINDOW_CONFLICT
    http: 409
    condition: "the requested rental window overlaps an existing window (half-open, plus inspection buffer) on the selected unit"
  - id: ERR_SUBSCRIPTION_PERIOD_OVERLAP
    http: 409
    condition: "new subscription period overlaps an existing non-CANCELLED period (closed interval; boundary touch conflicts)"
  - id: ERR_EBOOK_LICENSE_OVERLAP
    http: 409
    condition: "new EBOOK access window overlaps the customer's active window for the same item (half-open; adjacency allowed)"
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "accept attempted at/after quote_expires_at"
  - id: ERR_MAX_EXTENSIONS_REACHED
    http: 422
    condition: "extension would exceed MAX_EXTENSIONS or MAX_TOTAL_TERM_DAYS"
  - id: ERR_INVALID_TERM
    http: 422
    condition: "rental_term_days missing/invalid for RENT/EBOOK, or supplied for BUY"
  - id: ERR_DUPLICATE_EDITION
    http: 409
    condition: "a catalog item with the same (isbn13, edition) already exists"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_customer_version != stored Customer.version on POST /buyback-quotes"
  - id: ERR_INSUFFICIENT_CREDIT
    http: 402
    condition: "wallet_credit_cents does not cover the charge (order pay / rental extension)"

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:
  - name: Customer
    description: "The renter/buyer/seller; acts only on their own orders, rentals, subscriptions, and buyback quotes."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /customers/{id}/subscription"
      - "POST /subscriptions/{id}/cancel"
      - "POST /orders"
      - "POST /orders/{id}/pay"
      - "POST /orders/{id}/cancel"
      - "POST /rentals/{id}/extend"
      - "POST /rentals/{id}/return"
      - "POST /buyback-quotes"
      - "POST /buyback-quotes/{id}/accept"
      - "POST /buyback-quotes/{id}/respond-revision"
    shared_operations:
      - "GET /catalog/{id}"
      - "GET /customers/{id} (own)"
      - "GET /customers/{id}/wallet-transactions (own)"
      - "GET /subscriptions/{id} (own), GET /subscriptions"
      - "GET /orders/{id} (own), GET /orders"
      - "GET /rentals/{id} (own), GET /rentals, GET /rentals/{id}/return-shipments"
      - "GET /buyback-quotes/{id} (own), GET /buyback-quotes"
  - name: WarehouseAgent
    description: "Physical operations: fulfilment and inspection of returns and buyback intake."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/confirm"
      - "POST /return-shipments/{id}/inspect"
      - "POST /buyback-quotes/{id}/inspect"
    shared_operations:
      - "GET /catalog/{id}"
      - "GET /inventory-units/{id}, GET /inventory-units"
      - "GET /orders/{id}, GET /orders"
      - "GET /rentals/{id}, GET /rentals, GET /rentals/{id}/return-shipments"
      - "GET /buyback-quotes/{id}, GET /buyback-quotes"
  - name: CatalogAdmin
    description: "Configuration and operator surface: catalog, inventory, customers, plans, wallet adjustments, clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /catalog"
      - "POST /inventory-units"
      - "POST /customers"
      - "POST /subscription-plans"
      - "POST /customers/{id}/wallet/adjustments"
    shared_operations:
      - "GET /catalog/{id}"
      - "GET /inventory-units/{id}, GET /inventory-units"
      - "GET /customers/{id}, GET /customers/{id}/wallet-transactions"
      - "GET /subscriptions/{id}, GET /subscriptions"
      - "GET /orders/{id}, GET /orders"


