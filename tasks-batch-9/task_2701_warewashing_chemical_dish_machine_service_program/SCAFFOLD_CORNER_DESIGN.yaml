      - name: an_applied_calibration_restarts_the_cycle_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.telemetry_alert_evaluation
          - entities.MachinePlacement.fields.cycles_since_calibration
          - endpoints[POST /warewashing/service-visits/{visit_id}/verify]
        distinguishing_aspect: |
          The CALIBRATION_OVERDUE trigger is cumulative, so it needs both a boundary and a reset:
          19999 cycles since the last calibration raise nothing, the 20000th raises the alert and pushes
          the machine to DEGRADED, and a VERIFIED visit resets cycles_since_calibration to 0 - after which
          a further reading at 20001 total cycles raises nothing, even though the lifetime counter is far
          past the threshold. An implementation that compares the lifetime cycle count instead of the
          since-calibration counter re-fires here.
        test_recipe:
          setup:
            - "One INSTALLED DT-88 placement (max_cycles_between_calibrations 20000, initial_cycle_count 0) with one DET-100 dispenser and a DISPATCHED ticket."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
