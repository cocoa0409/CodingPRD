scaffold_corner_design:
  # =================================================================
  # Table 1 — Entities
  # =================================================================
  - section: entities
    instances:
      - name: household_create_applies_defaults
        claim_type: defaults
        grounds:
          - entities.Household.fields.exposure_scoring_mode
          - entities.Household.fields.status
        distinguishing_aspect: "POST /households without exposure_scoring_mode defaults it to WEIGHTED and starts status=ACTIVE, recall_exposure_score=0, active_claim_count=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { primary_email: "d@x.test", display_name: "Def" }
              as: Anonymous
              captures: { hh: $.data.id }
          assert:
            - "Household.${hh}.exposure_scoring_mode == WEIGHTED"
            - "Household.${hh}.status == ACTIVE"
            - "Household.${hh}.recall_exposure_score == 0"
            - "Household.${hh}.active_claim_count == 0"

      - name: get_product_nonexistent_returns_not_found
        claim_type: not_found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /products/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: create_product_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Product.fields.serial_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /products omitting the required serial_number returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A manufacturer and a household with an owner."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "M", contact_email: "m@x.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "c1@x.test", display_name: "C1" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "X", purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { err: $.data.error_id }
          assert:
            - "returns HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: create_subscription_invalid_tier_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Subscription.fields.tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /households/{id}/subscriptions with tier=GOLD (not in {BASIC,PLUS,PREMIUM}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A household with an owner."]
          setup_api_calls:
            - call: "POST /households"
              payload: { primary_email: "c2@x.test", display_name: "C2" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
          trigger:
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "GOLD", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { err: $.data.error_id }
          assert:
            - "returns HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: create_product_unknown_manufacturer_fk_not_found
        claim_type: parent_relationships
        grounds: [entities.Product.fields.manufacturer_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /products whose manufacturer_id FK references a non-existent Manufacturer returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A household with an owner (no manufacturer)."]
          setup_api_calls:
            - call: "POST /households"
              payload: { primary_email: "c3@x.test", display_name: "C3" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "00000000-0000-4000-8000-000000000001", model_number: "X", serial_number: 1, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { err: $.data.error_id }
          assert:
            - "returns HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: product_coverage_status_expired_computed
        claim_type: computed_fields
        grounds: [calculations.warranty_coverage, entities.Product.fields.coverage_status]
        distinguishing_aspect: "With no ACTIVE subscription (bonus 0), a 12-month warranty on a 2025-01-01 purchase expires 2026-01-01; at clock 2026-02-01 the product's computed coverage_status reads EXPIRED."
        test_recipe:
          setup: ["A manufacturer, a household with owner (no subscription), a product warranty 12mo purchased 2025-01-01; clock 2026-02-01."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "M", contact_email: "m@x.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "c4@x.test", display_name: "C4" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "EX-1", serial_number: 1, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 30000, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /products/${prod}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Product.${prod}.warranty_expires_at == 2026-01-01T00:00:00Z"
            - "Product.${prod}.coverage_status == EXPIRED"

      - name: claim_document_immutable_no_version
        claim_type: immutability
        grounds: [entities.ClaimDocument]
        distinguishing_aspect: "ClaimDocument is common_fields:false — its create response carries id, created_at, claim_id, doc_type, file_uri but no version field, and there is no update endpoint."
        test_recipe:
          setup: ["A manufacturer, household, product, and a DRAFT claim."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "M", contact_email: "m@x.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "c5@x.test", display_name: "C5" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "D-1", serial_number: 1, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /claims"
              payload: { product_id: "${prod}", filed_by_member_id: "${owner}", claim_type: "WARRANTY", resolution_preference: "REFUND", issue_description: "d" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /claims/${claim}/documents"
              payload: { doc_type: "RECEIPT", file_uri: "s3://r/d" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { doc: $.data.id }
          assert:
            - "ClaimDocument.${doc}.claim_id == ${claim}"
            - "ClaimDocument.${doc} response has no version field"

  # =================================================================
  # Table 2 — State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: approve_draft_claim_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Claim.UNDER_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /claims/{id}/approve on a claim still in DRAFT (approve is only defined from UNDER_REVIEW) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A manufacturer, household, product, and a DRAFT claim."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "M", contact_email: "m@x.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "c6@x.test", display_name: "C6" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "S-1", serial_number: 1, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /claims"
              payload: { product_id: "${prod}", filed_by_member_id: "${owner}", claim_type: "WARRANTY", resolution_preference: "REFUND", issue_description: "d" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /claims/${claim}/approve"
              payload: {}
              as: ConciergeAgent
              as_user_id: "cx-1"
              captures: { err: $.data.error_id }
          assert:
            - "returns HTTP 409 with error_id == ERR_INVALID_STATE"

      - name: acknowledge_already_acknowledged_match_invalid_state
        claim_type: idempotency
        grounds: [state_machines.RecallMatch.MATCHED_to_ACKNOWLEDGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second acknowledge on a match already in ACKNOWLEDGED returns ERR_INVALID_STATE (409) — acknowledge is only defined from MATCHED."
        test_recipe:
          setup: ["A WEIGHTED household, product, PUBLISHED recall producing a MATCHED match, acknowledged once."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "M", contact_email: "m@x.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "c7@x.test", display_name: "C7", exposure_scoring_mode: "WEIGHTED" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "AK-1", serial_number: 5, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /recall-notices"
              payload: { manufacturer_id: "${mfr}", affected_model_number: "AK-1", serial_range_start: 1, serial_range_end: 100, severity: "LOW", remedy_type: "REPAIR", effective_from: "2025-06-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: ManufacturerAgent
              as_user_id: "${mfr}"
              captures: { rn: $.data.id }
            - call: "POST /recall-notices/${rn}/publish"
              payload: {}
              as: ManufacturerAgent
              as_user_id: "${mfr}"
            - call: "GET /recall-matches"
              payload: { product_id: "${prod}" }
              as: PlatformAdmin
              captures: { m: "$.data[0].id" }
            - call: "POST /recall-matches/${m}/acknowledge"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
          trigger:
            - call: "POST /recall-matches/${m}/acknowledge"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { err: $.data.error_id }
          assert:
            - "returns HTTP 409 with error_id == ERR_INVALID_STATE"

      - name: dismiss_from_acknowledged_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RecallMatch.MATCHED_to_DISMISSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "dismiss is defined only from MATCHED; dismissing an ACKNOWLEDGED match returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A WEIGHTED household, product, PUBLISHED recall, match acknowledged."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "M", contact_email: "m@x.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "c8@x.test", display_name: "C8", exposure_scoring_mode: "WEIGHTED" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "DK-1", serial_number: 5, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /recall-notices"
              payload: { manufacturer_id: "${mfr}", affected_model_number: "DK-1", serial_range_start: 1, serial_range_end: 100, severity: "LOW", remedy_type: "REPAIR", effective_from: "2025-06-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: ManufacturerAgent
              as_user_id: "${mfr}"
              captures: { rn: $.data.id }
            - call: "POST /recall-notices/${rn}/publish"
              payload: {}
              as: ManufacturerAgent
              as_user_id: "${mfr}"
            - call: "GET /recall-matches"
              payload: { product_id: "${prod}" }
              as: PlatformAdmin
              captures: { m: "$.data[0].id" }
            - call: "POST /recall-matches/${m}/acknowledge"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
          trigger:
            - call: "POST /recall-matches/${m}/dismiss"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { err: $.data.error_id }
          assert:
            - "returns HTTP 409 with error_id == ERR_INVALID_STATE"

  # =================================================================
  # Table 3 — Calculations (variant complements to §1.8)
  # =================================================================
  - section: calculations
    instances:
      - name: exposure_count_mode_variant_selection
        claim_type: variant_selection
        grounds: [calculations.recall_exposure_score, entities.Household.fields.exposure_scoring_mode]
        distinguishing_aspect: "COUNT-mode household: publishing a CRITICAL recall matching two products yields recall_exposure_score == 2 (raw count), the complement of the WEIGHTED sum (10) tested in §1.8."
        test_recipe:
          setup: ["A COUNT household with two matching products; a DRAFT CRITICAL recall."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Cnt", contact_email: "c@cnt.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "c9@x.test", display_name: "C9", exposure_scoring_mode: "COUNT" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "CT-9", serial_number: 100, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { p1: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "CT-9", serial_number: 101, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { p2: $.data.id }
            - call: "POST /recall-notices"
              payload: { manufacturer_id: "${mfr}", affected_model_number: "CT-9", serial_range_start: 1, serial_range_end: 200, severity: "CRITICAL", remedy_type: "REPLACE", effective_from: "2025-06-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: ManufacturerAgent
              as_user_id: "${mfr}"
              captures: { rn: $.data.id }
          trigger:
            - call: "POST /recall-notices/${rn}/publish"
              payload: {}
              as: ManufacturerAgent
              as_user_id: "${mfr}"
          assert:
            - "Household.${hh}.recall_exposure_score == 2"

      - name: refund_full_variant_plus_tier
        claim_type: variant_divergence
        grounds: [calculations.refund_amount, entities.Resolution.fields.refund_variant]
        distinguishing_aspect: "PLUS tier has prorate_refunds=false, so a REFUND resolution returns refund_variant=FULL with refund_amount_cents == purchase_price_cents (100000), the complement of the BASIC PRORATED path in §1.8."
        test_recipe:
          setup: ["A PLUS household ACTIVE, product priced 100000c; a REFUND claim documented, submitted, reviewed by cx-reviewer."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Ful", contact_email: "f@ful.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "c10@x.test", display_name: "C10" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "PLUS", period_start: "2025-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { sub: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "FL-1", serial_number: 1, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100000, warranty_months: 24 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /claims"
              payload: { product_id: "${prod}", filed_by_member_id: "${owner}", claim_type: "WARRANTY", resolution_preference: "REFUND", issue_description: "full" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/documents"
              payload: { doc_type: "RECEIPT", file_uri: "s3://r/10" }
              as: HouseholdOwner
              as_user_id: "${owner}"
            - call: "POST /claims/${claim}/submit"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
            - call: "POST /claims/${claim}/review"
              payload: {}
              as: ConciergeAgent
              as_user_id: "cx-reviewer"
          trigger:
            - call: "POST /claims/${claim}/approve"
              payload: {}
              as: ConciergeAgent
              as_user_id: "cx-approver"
            - call: "GET /resolutions"
              payload: { claim_id: "${claim}" }
              as: PlatformAdmin
              captures: { res: "$.data[0].id" }
          assert:
            - "Resolution.${res}.refund_variant == FULL"
            - "Resolution.${res}.refund_amount_cents == 100000"

  # =================================================================
  # Table 4 — Validations
  # =================================================================
  - section: validations
    instances:
      - name: submit_without_documentation_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_MISSING_DOCUMENTATION]"]
        distinguishing_aspect: "Submitting a DRAFT claim with zero ClaimDocuments returns ERR_MISSING_DOCUMENTATION (409); the product is REGISTERED and the subscription ACTIVE so no higher-priority check fires."
        test_recipe:
          setup: ["A BASIC household ACTIVE, product, DRAFT claim with NO documents."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "M", contact_email: "m@x.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "v1@x.test", display_name: "V1" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "BASIC", period_start: "2025-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { sub: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "V-1", serial_number: 1, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100, warranty_months: 24 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /claims"
              payload: { product_id: "${prod}", filed_by_member_id: "${owner}", claim_type: "WARRANTY", resolution_preference: "REFUND", issue_description: "nodoc" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /claims/${claim}/submit"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { err: $.data.error_id }
          assert:
            - "returns HTTP 409 with error_id == ERR_MISSING_DOCUMENTATION"

      - name: archive_product_with_active_claim_rejected
        claim_type: violation_to_error
        grounds: [state_machines.Product.REGISTERED_to_ARCHIVED, "errors[ERR_PRODUCT_HAS_ACTIVE_CLAIM]"]
        distinguishing_aspect: "Archiving a product that has a non-terminal (DRAFT) claim returns ERR_PRODUCT_HAS_ACTIVE_CLAIM (409)."
        test_recipe:
          setup: ["A household, product, and a DRAFT claim on that product."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "M", contact_email: "m@x.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
