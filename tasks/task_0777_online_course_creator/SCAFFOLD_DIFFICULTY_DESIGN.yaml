              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 15000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /coupons"
              payload: { course_id: "${course_id}", code: "MIN15K", discount_type: "PERCENT", discount_value: 10, max_redemptions: 5, min_purchase_cents: 15000, starts_at: "2026-01-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}", coupon_code: "MIN15K" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
          assert:
            - "Enrollment.${enrollment_id}.list_price_cents == 15000"
            - "Enrollment.${enrollment_id}.discount_cents == 1500"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enroll_requires_published_course
        grounds:
          - validations[priority=8]
          - errors[ERR_COURSE_NOT_PUBLISHED]
          - entities.Course.fields.status
        distinguishing_aspect: |
          Enrollment.access transition into existence depends on Course.status. A DRAFT course (never
          published) rejects enrollment with ERR_COURSE_NOT_PUBLISHED. Entity pair: Enrollment -> Course.
        test_recipe:
          setup:
            - "Course in DRAFT (has a lesson and an ACTIVE plan but never published)"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "Course A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COURSE_NOT_PUBLISHED"

      - name: payout_requires_active_creator
        grounds:
          - validations[priority=8]
          - errors[ERR_CREATOR_SUSPENDED]
          - entities.Creator.fields.status
        distinguishing_aspect: |
          Payout creation depends on Creator.status. A SUSPENDED creator's payout request returns
          ERR_CREATOR_SUSPENDED even before balance/OCC checks. Entity pair: Payout -> Creator —
          different pair from Enrollment -> Course.
        test_recipe:
          setup:
            - "Creator suspended via set-status; current version captured after suspension"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /creators/${creator_id}/set-status"
              payload: { status: "SUSPENDED" }
              as: PlatformAdmin
            - call: "GET /creators/${creator_id}"
              as: Creator
              as_user_id: "${creator_id}"
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /creators/${creator_id}/payouts"
              payload: { amount_cents: 1000, expected_creator_version: "${cv}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CREATOR_SUSPENDED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: coupon_code_window_overlap_closed_intervals
        grounds:
          - validations[priority=10]
          - errors[ERR_COUPON_WINDOW_OVERLAP]
          - entities.Coupon.fields.starts_at
          - entities.Coupon.fields.expires_at
        distinguishing_aspect: |
          Coupon windows on a Course use CLOSED intervals: two ACTIVE coupons sharing code SAVE with
          windows [03-01,03-31] and [03-31,04-30] collide because the touching endpoint 2026-03-31 is
          included in both. Resource: Course; adjacency (touch) => collision.
        test_recipe:
          setup:
            - "Course with an ACTIVE coupon SAVE window [2026-03-01,2026-03-31]"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "Course A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /coupons"
              payload: { course_id: "${course_id}", code: "SAVE", discount_type: "PERCENT", discount_value: 10, max_redemptions: 5, starts_at: "2026-03-01T00:00:00Z", expires_at: "2026-03-31T00:00:00Z" }
              as: Creator
              as_user_id: "${creator_id}"
          trigger:
            - call: "POST /coupons"
              payload: { course_id: "${course_id}", code: "SAVE", discount_type: "PERCENT", discount_value: 10, max_redemptions: 5, starts_at: "2026-03-31T00:00:00Z", expires_at: "2026-04-30T00:00:00Z" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COUPON_WINDOW_OVERLAP"

      - name: subscription_cycle_overlap_half_open_intervals
        grounds:
          - validations[priority=10]
          - errors[ERR_CYCLE_OVERLAP]
          - entities.Invoice.fields.cycle_start
          - entities.Invoice.fields.cycle_end
        distinguishing_aspect: |
          Subscription CYCLE intervals on an Enrollment use HALF-OPEN [start,end): [04-01,05-01) and
          [05-01,06-01) are adjacency-OK (accepted in setup), but [04-15,05-15) overlaps the first and
          is rejected. Resource: Enrollment; adjacency allowed — opposite semantics to the closed coupon rule.
        test_recipe:
          setup:
            - "Paid ACTIVE SUBSCRIPTION enrollment (plan 5000/30d); two adjacency-OK CYCLE invoices [04-01,05-01) and [05-01,06-01) already generated"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
