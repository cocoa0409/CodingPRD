        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_VERIFICATION_MISMATCH]"]
        distinguishing_aspect: "Submitting a measurement list missing a dispensed hopper (or adding an unknown one) is rejected with ERR_VERIFICATION_MISMATCH and creates no PortionVerification rows."
