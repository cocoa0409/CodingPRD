              as: Scheduler
              captures: { err_both: $.data.error_id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt_owner}", treatment_plan_id: "${pl_owner}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 99, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { err_cycle: $.data.error_id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt_owner}", treatment_plan_id: "${pl_owner}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 6, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap_ok: $.data.id }
          assert:
