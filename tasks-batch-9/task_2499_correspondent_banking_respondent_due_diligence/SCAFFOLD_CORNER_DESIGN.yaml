            - "the delta is 33337.49 and its sign is positive: with this observation history the actual basis is the more generous one, so the choice of basis is not a formality"
            - "the 2026-04 observation (999.00) is provably excluded - had all four periods been averaged the base would have been 89140.38 (356561.50 / 4) and the cap 160452.68, which is NOT the value returned"
            - "both plans are in state APPROVED with approved_by_user_id u-committee-1, and both respondents are in dd_state EXITING with payment_posture WIND_DOWN_ONLY (set at plan creation, unchanged by approval)"
            - "any MonitoringAlert rows raised by the 300000.00 observation are incidental to this instance and are not asserted"

  # ---------------------------------------------------------------------------
  # consistency_model - complexity_profile.consistency_model is `immediate`, so
  # the only legal claim_type here is `immediate`: every derived field, every
  # cascade and every counter is final in the response of the request that
  # caused it. These three instances forbid the two failure modes an eventual
  # implementation would show - a response that omits derived fields and makes
  # the caller re-read, and a counter that only settles on a later request.
  # No instance below sleeps, retries or polls; a re-read is used only to prove
  # the second reader sees exactly what the first response already said.
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: the_calibration_response_already_carries_every_derived_threshold
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/calibration]
          - calculations.monitoring_threshold_calibration
        distinguishing_aspect: "The calibration write produces five derived fields at once (per-corridor thresholds, the buffered aggregate, the hold threshold, calibrated_at, calibrated_by_user_id). Under an immediate model the 200 body is already complete, and a GET issued straight afterwards must be field-for-field identical - not merely eventually equal. The profile is created with EMPTY corridor_thresholds, so the before-picture is unambiguous."
        test_recipe:
          setup: ["One DE jurisdiction at corridor_risk_weight 1.00, one respondent with risk_rating UNRATED (factor 1.30), and one PROVISIONAL profile with two corridors at tolerance_pct 0.15."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "JP", name: "Japan", basel_aml_index: 3.00, corridor_risk_weight: 2.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Gamma Bank AG", swift_bic: "GAMMDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 100000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              captures: { r_id: $.data.id, r_ver: $.data.version }
            - call: "POST /correspondent-banking/respondents/${r_id}/monitoring-profiles"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", tolerance_pct: 0.15, expected_corridors: [ { jurisdiction_code: "DE", expected_monthly_usd: 100000.00, expected_monthly_count: 100 }, { jurisdiction_code: "JP", expected_monthly_usd: 100000.00, expected_monthly_count: 100 } ], expected_respondent_version: "${r_ver}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /correspondent-banking/monitoring-profiles/${p_id}/calibration"
              payload: { action: "CALIBRATE" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /correspondent-banking/monitoring-profiles/${p_id}"
              payload: {}
              as: FIGRelationshipManager
          assert:
            - "immediately before the trigger, GET the profile: calibration_state PROVISIONAL, corridor_thresholds is an empty list, aggregate_usd_threshold and hold_threshold_usd are null or 0.00, calibrated_at null"
            - "the CALIBRATE response itself is status 200 and already contains calibration_state CALIBRATED, corridor_thresholds in payload order [DE usd 149500.00 count 150, JP usd 74750.00 count 75], aggregate_usd_threshold 246675.00 (round((149500.00 + 74750.00) * 1.1, 2)), hold_threshold_usd 24667.50, calibrated_at 2026-08-01T00:00:00Z and calibrated_by_user_id u-analyst-1"
            - "the immediately following GET, issued by a DIFFERENT role with no wait, returns the SAME values for all five derived fields - no field is null-then-filled and no value drifts"
            - "no sleep, retry or second attempt is permitted between the two calls: a single round-trip suffices to observe the final state"
            - "the JP corridor proves the divisor is the corridor weight and not the home weight: 100000.00 * 1.15 * 1.30 / 2.00 = 74750.00 and ceil(149.5 / 2.00) = 75"
      - name: an_observation_and_the_alerts_it_raises_are_visible_in_the_same_breath
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/observations]
          - calculations.alert_generation
        distinguishing_aspect: "A single write creates rows in a DIFFERENT entity (MonitoringAlert) and a counter on the written row. Immediate consistency means the counter in the 201 body already equals the number of alert rows a list query returns in the next call - there is no window in which alerts_created_count says 2 but the list says 0, nor the reverse."
        test_recipe:
          setup: ["The CALIBRATED single-DE-corridor profile at usd_threshold 149500.00 / count_threshold 150 from the wind-down fixture, on a respondent with no NestedRelationship rows."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Delta Bank AG", swift_bic: "DELTDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 100000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              captures: { r_id: $.data.id, r_ver: $.data.version }
            - call: "POST /correspondent-banking/respondents/${r_id}/monitoring-profiles"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", tolerance_pct: 0.15, expected_corridors: [ { jurisdiction_code: "DE", expected_monthly_usd: 100000.00, expected_monthly_count: 100 } ], expected_respondent_version: "${r_ver}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { p_id: $.data.id }
            - call: "POST /correspondent-banking/monitoring-profiles/${p_id}/calibration"
              payload: { action: "CALIBRATE" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          trigger:
            - call: "POST /correspondent-banking/monitoring-profiles/${p_id}/observations"
              payload: { period_month: "2026-07", corridor_jurisdiction_code: "DE", aggregate_usd: 300000.00, txn_count: 300, distinct_downstream_count: 0 }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { obs_id: $.data.id }
            - call: "GET /correspondent-banking/monitoring-alerts?activity_observation_id=${obs_id}"
              payload: {}
              as: SanctionsOfficer
          assert:
            - "before the trigger, GET /correspondent-banking/monitoring-alerts?respondent_bank_id=${r_id} returns total_count 0"
            - "the 201 body already carries usd_threshold_applied 149500.00, count_threshold_applied 150, breach_ratio 2.0067 (round(300000.00 / 149500.00, 4)) and alerts_created_count 2"
            - "the immediately following list call returns total_count 2 - exactly the number the observation body reported - with alert_type VOLUME_BREACH at severity HIGH (breach_ratio 2.0067 is at or above HIGH_RATIO_AT 2.0) and alert_type COUNT_BREACH at severity HIGH (300 >= 2 * 150)"
            - "both alerts are in state OPEN with respondent_bank_id ${r_id}, activity_observation_id ${obs_id} and the VOLUME_BREACH row carrying breach_ratio 2.0067 while the COUNT_BREACH row carries null"
            - "no NESTED_ACTIVITY_UNDISCLOSED row exists: distinct_downstream_count 0 is not strictly greater than the 0 known nested relationships"
            - "the alert rows are queryable by a role that did not perform the write, on the very next request, with no settling period"
      - name: the_parent_version_bump_is_visible_to_the_very_next_writer
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - concurrency_rules[questionnaire-create-stale-respondent]
          - endpoints[POST /correspondent-banking/respondents/{respondentId}/monitoring-profiles]
        distinguishing_aspect: "The OCC token is only sound if the increment is immediate. This instance writes through one child endpoint and then attempts a second child write with the token that was valid one call earlier: it must fail 412 at once, and the freshly read token must succeed at once. An eventually-consistent version counter would let the stale token through, which is the exact bug this asserts against."
        test_recipe:
          setup: ["One respondent with an ACTIVE licence so a questionnaire may be opened, and its version read into ${v0}."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Epsilon Bank AG", swift_bic: "EPSIDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 100000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              captures: { r_id: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r_id}/licensing-verification"
              payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /correspondent-banking/respondents/${r_id}"
              payload: {}
              as: ComplianceAnalyst
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /correspondent-banking/respondents/${r_id}/monitoring-profiles"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", tolerance_pct: 0.15, expected_corridors: [ { jurisdiction_code: "DE", expected_monthly_usd: 100000.00, expected_monthly_count: 100 } ], expected_respondent_version: "${v0}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /correspondent-banking/respondents/${r_id}/questionnaires"
              payload: { questionnaire_version: "2026.1", expected_respondent_version: "${v0}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /correspondent-banking/respondents/${r_id}"
              payload: {}
              as: ComplianceAnalyst
              captures: { v1: $.data.version }
            - call: "POST /correspondent-banking/respondents/${r_id}/questionnaires"
              payload: { questionnaire_version: "2026.1", expected_respondent_version: "${v1}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          assert:
            - "the monitoring-profile create returns 201 and, on the very next read, the respondent's version is ${v0} + 1 - the bump is not deferred"
            - "the questionnaire create replaying the now-stale ${v0} returns 412 with error_id ERR_STALE_RESPONDENT_VERSION and creates nothing: GET /correspondent-banking/questionnaires?respondent_bank_id=${r_id} still returns total_count 0"
            - "${v1} == ${v0} + 1 exactly - one write, one increment"
            - "the retry with ${v1} returns 201 with state DRAFT and clarification_rounds 0, and the respondent's version is then ${v0} + 2"
            - "every step is a single request with no retry loop or delay; the 412 and the following 201 are separated only by the read that refreshes the token"
