              payload: { case_cracked: false, findings: [] }
              as: CoreInspector
            - call: "GET /api/reman-orders/${o_id}"
              as: Any
          assert:
            - "CoreDepositInvoice.${inv_id}.status == SETTLED_FULL"
            - "CoreDepositInvoice.${inv_id}.final_credit_cents == 50000"
            - "CoreDepositInvoice.${inv_id}.forfeited_cents == 0"
            - "RemanOrder.${o_id}.core_settlement_status == CLOSED"

  # ===========================================================================
  # Rule 5 - priority_pair_validation_conflict: (state vs business_fiscal) on
  # stock-adjustments vs (business_safety vs business_temporal) on verify.
  # Different error-category pairs AND different endpoints.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stock_adjust_occ_beats_negative_stock
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - concurrency_rules[hard-part-adjust-stale-version]
        distinguishing_aspect: |
          Pair (state, business_fiscal): a stock adjustment carrying BOTH a
          stale expected_hard_part_version (state/OCC, priority 5) and a delta
          that would drive qty_on_hand negative (business_fiscal, priority 10)
          must return ERR_STALE_VERSION (412), proving OCC is evaluated first.
        test_recipe:
          setup:
            - "HardPart P with qty_on_hand 5, version 1 (no mutations since creation)"
          setup_api_calls:
            - call: "POST /api/hard-parts"
              payload: { part_number: "P-100", part_family: "PUMP", unit_cost_cents: 1000, qty_on_hand: 5 }
              as: InventoryPlanner
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
          trigger:
            - call: "POST /api/hard-parts/${p_id}/stock-adjustments"
              payload: { qty_delta: -999, expected_hard_part_version: "${p_v} - 1" }
              as: InventoryPlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response status == 412"
            - "error_id == ERR_STALE_VERSION (not ERR_NEGATIVE_STOCK)"
            - "HardPart.${p_id}.qty_on_hand == 5 (unchanged)"

      - name: verify_cal_sod_beats_staleness
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.RemanOrder.transitions.CALIBRATION_to_DYNO_QUEUE
        distinguishing_aspect: |
          Pair (business_safety, business_temporal): a verify where the
          verifier IS the drafter (SoD, priority 7) AND the draft is 100h old
          (staleness, priority 8) must return ERR_SOD_VERIFICATION_FORBIDDEN
          (403), proving safety outranks temporal.
        test_recipe:
          setup:
            - "One order in CALIBRATION with a DRAFT calibration written by Calibrator cal-a; logical clock advanced 100 hours past cal_created_at"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T04:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-a"
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response status == 403"
            - "error_id == ERR_SOD_VERIFICATION_FORBIDDEN (not ERR_CAL_STALE)"
            - "RemanOrder.${o_id}.cal_status == DRAFT (unchanged)"

  # ===========================================================================
  # Rule 6 - boundary_precision_check: attempt-count boundary vs day-count
  # boundary. Different metrics, different endpoints.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: dyno_attempt_budget_third_run_allowed_fourth_rejected
        grounds:
          - calculations.dyno_shift_quality_score
          - errors[ERR_DYNO_ATTEMPT_EXHAUSTED]
          - state_machines.RemanOrder.transitions.DYNO_QUEUE_to_DYNO_QUEUE
        distinguishing_aspect: |
          Metric: attempt count. Run #3 is allowed (dyno_attempts_used 2 < 3)
          and a MARGINAL keeps the order in DYNO_QUEUE; run #4 observes
          dyno_attempts_used == 3 and is rejected with
          ERR_DYNO_ATTEMPT_EXHAUSTED (422) - exact >= boundary on the budget.
        test_recipe:
          setup:
            - "One order in DYNO_QUEUE with a long covering booking; two prior FAIL runs (each followed by recalibration + verify); a third run lands MARGINAL, leaving the order in DYNO_QUEUE with dyno_attempts_used == 3"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-05T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [185, 220, 240, 260] }
              as: DynoOperator
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.2, -0.1, 0.2, 0.1], tcm_flash_version: "TF-2026.08b" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [185, 220, 240, 260] }
              as: DynoOperator
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.3, 0.0, 0.1, 0.2], tcm_flash_version: "TF-2026.08c" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [190, 220, 240, 260] }
              as: DynoOperator
              captures: { r3_score: "$.data.shift_quality_score", r3_verdict: "$.data.verdict" }
          trigger:
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "run 3 shift_quality_score == 80.0 and verdict == MARGINAL"
            - "trigger response status == 422 with error_id ERR_DYNO_ATTEMPT_EXHAUSTED"
            - "RemanOrder.${o_id}.dyno_attempts_used == 3 (unchanged by rejected run)"
            - "RemanOrder.${o_id}.status == DYNO_QUEUE (unchanged)"

      - name: core_return_day_30_ontime_day_31_late
        grounds:
          - calculations.core_grade_and_credit
          - entities.CoreUnit.fields.days_late
        distinguishing_aspect: |
          Metric: whole days between issuance and receipt. A core received
          exactly on day 30 is on-time (full grade-A credit 50000c, day-count
          boundary uses <=), while day 31 applies the late factor
