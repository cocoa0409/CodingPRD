              as: Manager
              captures: { o2: $.data.id }
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prod_id}", bake_plan_line_id: "${line_id}", delivery_date: "2026-06-13T10:00:00Z", qty: 2 }
              as: Manager
              captures: { o3: $.data.id }
            - call: "POST /delivery-routes"
              payload: { route_date: "2026-06-13T00:00:00Z", driver_name: "Fay", window_start: "2026-06-13T06:00:00Z", window_end: "2026-06-13T14:00:00Z" }
              as: Manager
              captures: { route_id: $.data.id }
            - call: "POST /delivery-routes/${route_id}/stops"
              payload: { delivery_order_id: "${o1}", sequence: 1, arrival_window_start: "2026-06-13T08:00:00Z", arrival_window_end: "2026-06-13T09:00:00Z" }
              as: Manager
              captures: { stop1: $.data.id }
            - call: "POST /delivery-routes/${route_id}/stops"
              payload: { delivery_order_id: "${o2}", sequence: 2, arrival_window_start: "2026-06-13T09:00:00Z", arrival_window_end: "2026-06-13T10:00:00Z" }
              as: Manager
              captures: { stop2: $.data.id }
          trigger:
            - call: "POST /delivery-routes/${route_id}/stops"
              payload: { delivery_order_id: "${o3}", sequence: 3, arrival_window_start: "2026-06-13T08:30:00Z", arrival_window_end: "2026-06-13T09:30:00Z" }
