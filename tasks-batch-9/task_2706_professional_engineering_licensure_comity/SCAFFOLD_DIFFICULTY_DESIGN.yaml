      - name: reference_submit_gated_on_referee_active_license
        grounds:
          - validations[priority=12]
          - errors.ERR_REFEREE_LICENSE_INACTIVE
          - state_machines.Reference.REQUESTED_to_SUBMITTED
          - entities.Reference.fields.referee_engineer_id
          - roles.SupervisingEngineer
        distinguishing_aspect: |
          The gate reads a completely unrelated aggregate: whether the REFEREE — not the applicant, not the
          experience record — currently holds an ACTIVE License row. The referee here holds no licence at
          all, which is the case an implementation that joins Engineer -> License and inspects
          `license.status != ACTIVE` silently passes, because the join produces no row to inspect. Issuing
          the referee a licence and replaying the identical request then succeeds, so the dependency is on
          live cross-aggregate state rather than on anything captured at request time.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Cleo Nardi' has a SUBMITTED-then-UNDER_REVIEW STANDARD_EXAM application with EABET_ACCREDITED education, one 2019-01..2022-12 RESPONSIBLE_CHARGE record now in PENDING_VERIFICATION, and the 27500-cent assessment paid."
