              as_user_id: "fs-001"
            - call: "POST /cfs/production-batches/${batch_id}/temperature-logs"
              payload: { log_point: "CHILL_INTERMEDIATE", temperature_f: 80.0, site: "MAIN_KITCHEN" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { minutes_121: $.data.minutes_since_cook_end, in_range_121: $.data.in_range }
          assert:
            - "${cook_minutes} == null (minutes_since_cook_end is null on the COOK_END reading itself)"
            - "${minutes_119} == 119 and ${in_range_119} == true"
            - "${minutes_120} == 120 and ${in_range_120} == true (the 120-minute limit is inclusive and 80.0 F is exactly the inclusive temperature ceiling)"
            - "${minutes_121} == 121 and ${in_range_121} == false"
            - "ProductionBatch.${batch_id}.qa_status == QA_HELD and qa_reason == 'CHILL_GATE_FAILED' (only the third reading tripped the gate)"
            - "ProductionBatch.${batch_id}.production_stage == COOKED (the out-of-range intermediate reading does not discard the batch)"
            - "ProductionBatch.${batch_id}.chill_final_at == null and chill_minutes == null (no CHILL_FINAL reading was posted)"
            - "Three TemperatureLog rows exist for the batch with log_point CHILL_INTERMEDIATE, and none of them carries a version field"

      - name: waste_allowance_tier_flips_between_line_trays_500_and_501
        grounds:
          - calculations.meal_forecast_trays
          - calculations.meal_forecast_trays.constants.WASTE_TIER_1_CEIL
          - calculations.meal_forecast_trays.constants.WASTE_FLAT_TRAYS
          - calculations.meal_forecast_trays.constants.WASTE_TIER_2_RATE
          - endpoints[POST /cfs/meal-forecasts]
        distinguishing_aspect: |
          A different metric (the waste-allowance tray tier) at a different endpoint
          (POST /cfs/meal-forecasts). Two forecasts built from population feeds that differ by a
          single segregation inmate land line_trays on exactly 500 and exactly 501: the first keeps
          the flat 8-tray allowance because the tier-1 ceiling is inclusive, the second jumps to
          ceil(501 * 0.02) == 11. The jump is 3 trays, not 2, which also proves the ceiling is
          applied to the rate product rather than truncated, and the tier is chosen from line_trays
          rather than from total_forecast_trays.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ServiceContract CFS-2515-BP2 ACTIVE with Facility FAC-BP2 (satellite_site_count 0)."
            - "PopulationCount A: general 500, segregation 30, satellite 0, medical 0, source FORMAL_COUNT."
            - "PopulationCount B: general 500, segregation 31, satellite 0, medical 0, source FORMAL_COUNT."
            - "No DietOrder rows exist, so forecast_special_diet_trays is 0 for both."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-BP2", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-BP2", name: "South Unit Kitchen", sharps_authorized_count: 12, satellite_site_count: 0, blast_chiller_capacity: 2 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/population-counts"
              payload: { facility_id: "${facility_id}", general_population: 500, segregation_population: 30, satellite_population: 0, medical_population: 0, source: "FORMAL_COUNT" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { count_a: $.data.id }
            - call: "POST /cfs/population-counts"
              payload: { facility_id: "${facility_id}", general_population: 500, segregation_population: 31, satellite_population: 0, medical_population: 0, source: "FORMAL_COUNT" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { count_b: $.data.id }
          trigger:
            - call: "POST /cfs/meal-forecasts"
              payload: { facility_id: "${facility_id}", population_count_id: "${count_a}", service_date: "2026-08-02", meal_slot: "BREAKFAST", forecast_variant: "COUNT_DRIVEN" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { fc_a: $.data.id, line_a: $.data.line_trays, waste_a: $.data.waste_allowance_trays, total_a: $.data.total_forecast_trays }
            - call: "POST /cfs/meal-forecasts"
              payload: { facility_id: "${facility_id}", population_count_id: "${count_b}", service_date: "2026-08-02", meal_slot: "LUNCH", forecast_variant: "COUNT_DRIVEN" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { fc_b: $.data.id, line_b: $.data.line_trays, waste_b: $.data.waste_allowance_trays, total_b: $.data.total_forecast_trays }
          assert:
            - "${line_a} == 500 (ceil(500 * 0.94) == 470 general line trays plus 30 segregation trays plus 0 satellite trays)"
            - "${waste_a} == 8 and ${total_a} == 508 (line_trays exactly at WASTE_TIER_1_CEIL keeps the flat allowance)"
            - "${line_b} == 501 and ${waste_b} == 11 and ${total_b} == 512"
            - "${waste_b} - ${waste_a} == 3, so ceil(501 * 0.02) == 11 rather than a truncated 10"
            - "MealForecast.${fc_a}.forecast_special_diet_trays == 0 and MealForecast.${fc_b}.forecast_special_diet_trays == 0"
            - "MealForecast.${fc_a}.status == DRAFT and MealForecast.${fc_b}.status == DRAFT"
            - "PopulationCount.${count_a}.total_population == 530 and PopulationCount.${count_b}.total_population == 531"

  # ===========================================================================
  # Rule 7 - cross-entity state dependencies on different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: menu_cycle_activation_requires_service_contract_active
        grounds:
          - validations[priority=43]
          - errors.ERR_CONTRACT_NOT_ACTIVE
          - state_machines.MenuCycle.NUTRITION_APPROVED_to_ACTIVE
          - state_machines.ServiceContract.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          The entity pair is MenuCycle -> ServiceContract, reached through the Facility that owns the
          cycle: whether a NUTRITION_APPROVED cycle may activate depends on a status field two hops
          away that appears nowhere in the request. The cycle itself is fully eligible (it carries
          exactly 3 items for its 1-day length, it is nutrition-signed, its approved cost of 315
          cents is under the 320-cent ceiling, and the activating user is not the signer), so the
          only reason for the rejection is the contract's DRAFT status; activating the contract and
          replaying the identical request succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ServiceContract CFS-2515-CE1 left in status DRAFT - never activated."
            - "Facility FAC-CE1 under that contract with satellite_site_count 0."
            - "MenuCycle CYC-1 of cycle_length_days 1 with exactly 3 items (BREAKFAST/LUNCH/DINNER), nutrition-signed by rd-001 so status is NUTRITION_APPROVED with approved_kcal_per_meal_day 2800 and approved_cost_cents_per_meal_day 315."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
