              payload: { donor_id: "${d1}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T09:00:00Z", estimated_volume_cuft: 60 }
              as: StoreManager
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d2}", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_volume_cuft: 40 }
              as: StoreManager
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d3}", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T13:00:00Z", estimated_volume_cuft: 1 }
