      - name: retrofit_handling_waiver_evaluated_on_line_not_total
        grounds:
          - calculations.replacement_retrofit_pricing
          - entities.ComponentPlacement.fields.retrofit_handling_cents
          - entities.ComponentPlacement.fields.retrofit_total_cents
          - entities.ComponentPlacement.fields.legacy_surcharge_applied
          - validations[priority=70]
        distinguishing_aspect: |
          Mode: threshold evaluated on an INTERMEDIATE term rather than on the final output -
          FREE_HANDLING_LINE_THRESHOLD_CENTS 250000 is compared against line_cents before
          handling is added, so a 247000 line pays 3500 handling and totals 250500 (above the
          threshold) while a LEGACY line of 215450 + 18% surcharge = 254231 waives handling
          entirely, and doubling the 247000 line to 494000 flips the same placement's waiver.
