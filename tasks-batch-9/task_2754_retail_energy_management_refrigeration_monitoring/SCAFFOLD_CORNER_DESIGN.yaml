            closed_at_iso == "2026-08-01T11:00:00Z" (the clock at close, not the
            documentation time); disposition still "RETAIN";
            exposure_minutes still 15; peak_temp_f still 43.5.
            Cascade read-backs:
              GET /energy-ops/refrigeration-cases/${case_id} ->
