scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: proration_variant_calendar_day_vs_workday_diverge
        grounds:
          - calculations.stipend_pay_schedule
          - entities.AcademicTerm.fields.proration_method
          - entities.PayPeriod.fields.workday_count
          - entities.Appointment.fields.total_stipend_cents
        distinguishing_aspect: |
          Two terms carry byte-identical pay-period calendars and two appointments carry byte-identical
          effort, window and monthly_stipend_cents; only AcademicTerm.proration_method differs, and the
          CALENDAR_DAY term yields total_stipend_cents == 370968 while the WORKDAY term yields 375000,
          because the partial October window covers 15 of 31 calendar days but 11 of 22 workdays.
        test_recipe:
          setup:
            - "Term CALPRO2026 (2026-09-01..2026-12-15, proration_method CALENDAR_DAY) and term WRKPRO2026 (same dates, proration_method WORKDAY), both OPEN."
            - "Each term has the identical two pay periods: seq 1 = [2026-09-01, 2026-10-01) and seq 2 = [2026-10-01, 2026-11-01)."
            - "Each term has one StipendPolicy for (RESEARCH, DOCTORAL) with min_fte_monthly_stipend_cents 300000."
            - "Two distinct DOCTORAL students, both non-international, enrolled_credit_hours 0, so tuition remission resolves to 0 and does not perturb the stipend arithmetic."
            - "One GRANT funding source per term, authorized 5000000, budget 2026-07-01..2027-06-30, funding each appointment at share_pct 100.00."
            - "Each appointment: RESEARCH, effort_pct 75, 2026-09-01..2026-10-15, monthly_stipend_cents 250000 (FTE monthly 333333 >= the 300000 policy minimum), still DRAFT."
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "CHEM", name: "Chemistry" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { dept_id: "$.data.id" }
            - call: "POST /academic-terms"
              payload: { term_code: "CALPRO2026", term_start: "2026-09-01", term_end: "2026-12-15", tax_calendar_year: 2026, session_type: "IN_SESSION", proration_method: "CALENDAR_DAY", remission_drop_deadline: "2026-11-15" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { term_cal_id: "$.data.id" }
            - call: "POST /academic-terms"
              payload: { term_code: "WRKPRO2026", term_start: "2026-09-01", term_end: "2026-12-15", tax_calendar_year: 2026, session_type: "IN_SESSION", proration_method: "WORKDAY", remission_drop_deadline: "2026-11-15" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { term_wrk_id: "$.data.id" }
            - call: "POST /stipend-policies"
              payload: { term_id: "${term_cal_id}", assistantship_type: "RESEARCH", degree_level: "DOCTORAL", min_fte_monthly_stipend_cents: 300000, per_credit_tuition_cents: 50000, max_remission_cents_per_term: 500000, term_insurance_premium_cents: 0, insurance_min_effort_pct: 50, min_insurance_duration_days: 90, tuition_tax_exempt_cap_cents: 525000 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /stipend-policies"
              payload: { term_id: "${term_wrk_id}", assistantship_type: "RESEARCH", degree_level: "DOCTORAL", min_fte_monthly_stipend_cents: 300000, per_credit_tuition_cents: 50000, max_remission_cents_per_term: 500000, term_insurance_premium_cents: 0, insurance_min_effort_pct: 50, min_insurance_duration_days: 90, tuition_tax_exempt_cap_cents: 525000 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /pay-periods"
              payload: { term_id: "${term_cal_id}", sequence_no: 1, period_start: "2026-09-01", period_end_exclusive: "2026-10-01", pay_date: "2026-10-05" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /pay-periods"
              payload: { term_id: "${term_cal_id}", sequence_no: 2, period_start: "2026-10-01", period_end_exclusive: "2026-11-01", pay_date: "2026-11-05" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /pay-periods"
              payload: { term_id: "${term_wrk_id}", sequence_no: 1, period_start: "2026-09-01", period_end_exclusive: "2026-10-01", pay_date: "2026-10-05" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /pay-periods"
              payload: { term_id: "${term_wrk_id}", sequence_no: 2, period_start: "2026-10-01", period_end_exclusive: "2026-11-01", pay_date: "2026-11-05" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /academic-terms/${term_cal_id}/open"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /academic-terms/${term_wrk_id}/open"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /students"
              payload: { student_number: "GS-CAL-001", full_name: "Cal Student", degree_level: "DOCTORAL", is_international: false, cumulative_gpa: 3.50, visa_type: "NONE", enrolled_credit_hours: 0, external_weekly_hours: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { stu_cal_id: "$.data.id" }
            - call: "POST /students"
              payload: { student_number: "GS-WRK-001", full_name: "Wrk Student", degree_level: "DOCTORAL", is_international: false, cumulative_gpa: 3.50, visa_type: "NONE", enrolled_credit_hours: 0, external_weekly_hours: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { stu_wrk_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { department_id: "${dept_id}", source_code: "NSF-CAL-01", source_type: "GRANT", authorized_amount_cents: 5000000, budget_period_start: "2026-07-01", budget_period_end: "2027-06-30", allows_tuition_remission: true, sponsor_code: "NSF", grant_effort_cap_pct: 100, auto_reinstate_threshold_cents: 0 }
              as: GrantAccountant
              as_user_id: "user-ga-1"
              captures: { src_cal_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { department_id: "${dept_id}", source_code: "NSF-WRK-01", source_type: "GRANT", authorized_amount_cents: 5000000, budget_period_start: "2026-07-01", budget_period_end: "2027-06-30", allows_tuition_remission: true, sponsor_code: "NSF", grant_effort_cap_pct: 100, auto_reinstate_threshold_cents: 0 }
              as: GrantAccountant
              as_user_id: "user-ga-1"
              captures: { src_wrk_id: "$.data.id" }
            - call: "POST /appointments"
              payload: { student_id: "${stu_cal_id}", department_id: "${dept_id}", term_id: "${term_cal_id}", assistantship_type: "RESEARCH", effort_pct: 75, start_date: "2026-09-01", end_date: "2026-10-15", monthly_stipend_cents: 250000, supervisor_user_id: "user-fac-7" }
              as: DepartmentAdmin
              as_user_id: "user-dept-1"
              captures: { appt_cal_id: "$.data.id", appt_cal_v: "$.data.version" }
            - call: "POST /appointments"
              payload: { student_id: "${stu_wrk_id}", department_id: "${dept_id}", term_id: "${term_wrk_id}", assistantship_type: "RESEARCH", effort_pct: 75, start_date: "2026-09-01", end_date: "2026-10-15", monthly_stipend_cents: 250000, supervisor_user_id: "user-fac-7" }
              as: DepartmentAdmin
              as_user_id: "user-dept-1"
              captures: { appt_wrk_id: "$.data.id", appt_wrk_v: "$.data.version" }
            - call: "PUT /appointments/${appt_cal_id}/funding-plan"
              payload: { allocations: [ { funding_source_id: "${src_cal_id}", share_pct: 100.00, is_cost_share: false } ], expected_appointment_version: "${appt_cal_v}" }
              as: DepartmentAdmin
              as_user_id: "user-dept-1"
            - call: "PUT /appointments/${appt_wrk_id}/funding-plan"
              payload: { allocations: [ { funding_source_id: "${src_wrk_id}", share_pct: 100.00, is_cost_share: false } ], expected_appointment_version: "${appt_wrk_v}" }
              as: DepartmentAdmin
              as_user_id: "user-dept-1"
          trigger:
            - call: "POST /appointments/${appt_cal_id}/submit"
              payload: {}
              as: DepartmentAdmin
              as_user_id: "user-dept-1"
            - call: "POST /appointments/${appt_wrk_id}/submit"
              payload: {}
              as: DepartmentAdmin
              as_user_id: "user-dept-1"
          assert:
            - "Appointment.${appt_cal_id}.total_stipend_cents == 370968"
            - "Appointment.${appt_cal_id}.projected_pay_period_count == 2"
            - "Appointment.${appt_wrk_id}.total_stipend_cents == 375000"
            - "Appointment.${appt_wrk_id}.projected_pay_period_count == 2"
            - "Appointment.${appt_wrk_id}.total_stipend_cents - Appointment.${appt_cal_id}.total_stipend_cents == 4032"
            - "Appointment.${appt_cal_id}.weekly_hours == 30.0 and Appointment.${appt_wrk_id}.weekly_hours == 30.0"
            - "Appointment.${appt_cal_id}.duration_days == 45 and Appointment.${appt_wrk_id}.duration_days == 45"
            - "Appointment.${appt_cal_id}.tuition_remission_cents == 0 and Appointment.${appt_wrk_id}.tuition_remission_cents == 0"

      - name: tax_variant_term_provisional_vs_calendar_year_final_diverge
        grounds:
          - calculations.tuition_benefit_tax_assessment
          - entities.TaxAssessment.fields.variant_applied
          - state_machines.TaxAssessment.PROVISIONAL_to_FINAL
          - entities.StipendPolicy.fields.tuition_tax_exempt_cap_cents
        distinguishing_aspect: |
          One TaxAssessment row on the autumn term is read twice on the same underlying 400000-cent
          benefit: the TERM_PROVISIONAL variant applies the 525000 cap to that term alone and reports
          taxable_cents == 0, while CALENDAR_YEAR_FINAL applies the cap to the 800000 year total already
          partly consumed by the finalized summer assessment and reports taxable_cents == 275000 with
          imputed_withholding_cents == 60500.
        test_recipe:
          setup:
            - "Terms SUM2026 (2026-05-01..2026-08-31) and AUT2026 (2026-09-01..2026-12-31), both tax_calendar_year 2026, proration_method CALENDAR_DAY, both OPEN with four whole-month pay periods each."
            - "Both terms carry a (RESEARCH, DOCTORAL) StipendPolicy with per_credit_tuition_cents 50000, max_remission_cents_per_term 500000, min_fte_monthly_stipend_cents 400000, term_insurance_premium_cents 0 and tuition_tax_exempt_cap_cents 525000."
            - "One DOCTORAL student, enrolled_credit_hours 8, so the 100 percent remission band yields exactly 400000 cents of tuition benefit per term."
            - "Two non-overlapping ACTIVE appointments for that student, effort_pct 75, monthly_stipend_cents 300000 (FTE monthly exactly 400000), one per term, each funded 100.00 percent from a single GRANT source authorized 10000000."
            - "The summer TaxAssessment is already FINAL with benefit_cents 400000 and exempt_cents 400000, consuming 400000 of the 525000 calendar-year exemption."
