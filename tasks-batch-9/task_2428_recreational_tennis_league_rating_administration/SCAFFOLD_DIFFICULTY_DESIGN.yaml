      - name: dispute_and_identical_amend_conserve_the_provisional_credit_exactly
        grounds:
          - calculations.team_standings_points
          - state_machines.Match.REPORTED_to_DISPUTED
          - state_machines.Scorecard.DISPUTED_to_AMENDED
          - entities.Scorecard.fields.amendment_count
          - entities.Team.fields.standings_points
        distinguishing_aspect: |
          The conserved quantity is the provisional credit, which is a pure function of the
          currently open scorecard: it reads 5 / 1 while the card is SUBMITTED, collapses to 0 / 0
          the instant the card is DISPUTED (a DISPUTED result is outside the provisional inclusion
          set) and returns to exactly 5 / 1 after an amendment that re-states identical line
          scores, while the persisted official Team.standings_points stays 0 for both teams at all
          three observation points. An implementation that persists provisional credit, or that
          leaves DISPUTED matches in the provisional basis, cannot produce the 5 / 1 -> 0 / 0 ->
          5 / 1 sequence with amendment_count 1.
