              payload: {}
              as: ProductDesigner
            - call: "POST /impact-program/donation-products/${prod_id}/lines"
              payload: { gtin: "00000000000202", unit_size_label: "M", is_essential_good: false, donation_eligible: true }
              as: ProductDesigner
              captures: { pline_id: $.data.id }
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-XED-2", channel: "RETAIL_POS" }
              as: CustomerService
              captures: { ord_id: $.data.id }
            - call: "POST /impact-program/sales-orders/${ord_id}/lines"
              payload: { donation_product_line_id: "${pline_id}", quantity: 2, unit_price_cents: 1900, line_discount_cents: 0 }
              as: CustomerService
              captures: { soline_id: $.data.id, soline_v: $.data.version }
            - call: "POST /impact-program/sales-orders/${ord_id}/pay"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /impact-program/sales-orders/${ord_id}/lines/${soline_id}/return-requests"
              payload: { request_reason: "SIZE", requested_units: 1, is_exchange: false, expected_line_version: "${soline_v}" }
              as: CustomerService
              captures: { ret_id: $.data.id }
          assert:
            - "the return request succeeds while the order's status is PAID, and SalesOrderLine.${soline_id}.status == RETURN_REQUESTED"
            - "after PATCH /impact-program/sales-orders/${ord_id}/fulfillment with fulfillment_status SHIPPED the order's status is still PAID, proving the two dimensions are independent"
            - "a PATCH back to PLACED is refused with 409 ERR_FULFILLMENT_REGRESSION"
            - "POST /impact-program/sales-orders/${ord_id}/cancel is refused with 409 ERR_INVALID_STATE_TRANSITION while fulfillment_status == SHIPPED, because the PAID→CREATED transition is only declared when fulfillment_status == PLACED"
            - "the line's donation obligation is unchanged by the return request: DonationLiability for 2026-Q3 still reports final_liability_units == 2"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: half_open_partner_service_windows_reject_an_overlapping_allocation
        grounds:
          - entities.PartnerCapacityProfile.fields.effective_from
          - entities.PartnerCapacityProfile.fields.effective_to
          - validations[priority=11]
          - errors[ERR_CAPACITY_PROFILE_AMBIGUOUS]
        distinguishing_aspect: "Two capacity profiles for the same partner and season are legal only while their half-open windows do not intersect: a window ending exactly where the next begins is accepted while a one-second overlap is refused with ERR_CAPACITY_PROFILE_AMBIGUOUS, so the interval semantics are half-open and adjacency is not overlap."
        test_recipe:
          setup:
            - "The running season is OPEN at 2026-09-01T00:00:00Z; one APPROVED partner with an ACTIVE profile covering [2026-08-01T00:00:00Z, 2026-10-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q3", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z", freezes_at: "2026-12-01T00:00:00Z" }
              as: ImpactAuditor
              captures: { s_id: $.data.id }
