            - { call: "POST /api/studies/${study}/randomization-slots/replace", payload: { slots: [ { sequence_number: 1, stratum: "STANDARD", kit_number: "K-G", arm_code: "TRT-A" } ], expected_study_version: "${study_v3}" }, as: SponsorAdmin }
            - { call: "POST /api/subjects", payload: { site_id: "${site}", subject_number: "SUB-G", stratum: "STANDARD" }, as: Pharmacist, as_user_id: "${p1}", captures: { sub: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ON_HOLD" }, as: SponsorAdmin }
          trigger:
            - { call: "POST /api/subjects/${sub}/randomize", as: Pharmacist, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
