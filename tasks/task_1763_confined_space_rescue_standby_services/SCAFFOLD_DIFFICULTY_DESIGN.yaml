            - { call: "POST /rescue-ops/roster-entries/${ro_e2}/check-in", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { e2_status: "$.data.status" } }
            - { call: "POST /rescue-ops/roster-entries/${ro_e3}/check-in", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
