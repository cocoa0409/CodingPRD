        distinguishing_aspect: "PATCHing years_to_construction_start from 3 to 5 on a DRAFT plan re-runs the whole DESIGN chain — escalation_cents 18,855,354, contingency_cents 10,864,276, total_estimate_cents 123,507,032 and total_funding_need_cents 123,507,032 — rather than storing the new input and leaving the derived figures stale."
        test_recipe:
          setup:
            - "Shared prefix through the ENROLLED enrollment and the DRAFT plan created with years_to_construction_start 3 (total_estimate_cents 115,210,677)."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
            - *c_lab
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
            - *c_p1sub
            - *c_p1app
            - *c_inq
            - *c_clock_acq
            - *c_acq
            - *c_clock_dec
            - *c_p2
            - *c_p2fa
            - *c_p2fb
            - *c_p2fc
            - *c_p2sub
            - *c_p2app
            - *c_g1
            - *c_g2
            - *c_enr
            - *c_elig
            - *c_plan
          trigger:
            - &c_patch_plan
              call: "PATCH /remedial-action-plans/${plan_id}"
              payload: { years_to_construction_start: 5 }
