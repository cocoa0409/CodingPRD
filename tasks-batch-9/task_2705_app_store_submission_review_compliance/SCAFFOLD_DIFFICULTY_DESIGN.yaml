        grounds:
          - state_machines.AppealRequest.BOARD_REVIEW_to_PARTIALLY_OVERTURNED
          - state_machines.Submission.REJECTED_to_APPEAL_PENDING
          - state_machines.Submission.APPEAL_PENDING_to_REJECTED
          - entities.AppealRequest.fields.overturn_ratio
          - entities.RejectionReason.fields.appeal_disposition
          - calculations.feature_compliance_index
          - calculations.standing_score
        distinguishing_aspect: |
          APPEAL_PENDING forks three ways and this instance takes the middle branch: exactly ONE of the
          two cited reasons is overturned, so overturn_ratio is 0.50, the Submission returns to
