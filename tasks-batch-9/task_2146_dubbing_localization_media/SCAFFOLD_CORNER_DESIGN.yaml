        distinguishing_aspect: |
          A POST /titles carrying no X-User-Role / X-User-ID pair answers ERR_UNAUTHENTICATED 401 before any payload validation runs, so an also-malformed body never surfaces ERR_INVALID_REQUEST.
        test_recipe:
          setup:
          - "Empty database"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          trigger:
