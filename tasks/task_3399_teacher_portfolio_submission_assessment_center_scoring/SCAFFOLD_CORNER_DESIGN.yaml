          assert:
            - "path ids: e_cycle == ERR_CYCLE_NOT_FOUND, e_cand == ERR_CANDIDATE_NOT_FOUND, e_sub == ERR_SUBMISSION_NOT_FOUND, e_ctr == ERR_CENTER_NOT_FOUND, e_bk == ERR_BOOKING_NOT_FOUND, e_asr == ERR_ASSESSOR_NOT_FOUND, e_asg == ERR_ASSIGNMENT_NOT_FOUND, e_cert == ERR_CERTIFICATION_NOT_FOUND, e_ren == ERR_RENEWAL_NOT_FOUND, e_prog == ERR_PROGRAM_NOT_FOUND, e_stip == ERR_STIPEND_NOT_FOUND — all HTTP 404"
            - "body ids: e_ctr_body == ERR_CENTER_NOT_FOUND, e_cyc_body == ERR_CYCLE_NOT_FOUND, e_bm == ERR_BENCHMARK_NOT_FOUND — all 404"
            - "booking by an ELIGIBLE candidate with no open ASSESSMENT attempt: e_nosub == ERR_SUBMISSION_NOT_FOUND (404)"

  # ===========================================================================
  - section: rbac
    instances:
      - name: candidate_cannot_tech_review_own_submission
        claim_type: "RBAC denial"
        grounds:
          - roles.Candidate
          - roles.ScoringAdministrator
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Segregation of duties: the candidate who owns a SUBMITTED attempt cannot run its technical review — the endpoint is ScoringAdministrator-only (403 ERR_INSUFFICIENT_PERMISSIONS even for the owner)."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 OPEN; candidate A ELIGIBLE; P1 attempt SUBMITTED."]
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - *c_open
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
            - *c_p1_sub
            - *c_p1_art_wc
            - *c_p1_art_vid
            - *c_p1_submit
          trigger:
            - call: "POST /submissions/${sub_p1}/tech-review"
              payload: { decision: "ACCEPT" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "ComponentSubmission.${sub_p1}.status == SUBMITTED (unchanged)"

      - name: assessor_cannot_create_benchmarks
        claim_type: "RBAC denial"
        grounds:
          - roles.Assessor
          - endpoints.POST_/benchmarks
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "An entity-backed Assessor (even ACTIVE) cannot author calibration benchmarks — ScoringAdministrator exclusive."
        test_recipe:
          setup: ["Clock 2027-01-10; assessor Z exists (RECRUITED suffices — the role gate fires first)."]
          setup_api_calls:
            - *c_clk
            - call: "POST /assessors"
              payload: { full_name: "Reader Z", email: "rz@x.com", home_district_code: "D-900" }
              as: ScoringAdministrator
              captures: { asz: $.data.id }
          trigger:
            - call: "POST /benchmarks"
              payload: { component_code: "P1", content_domain: "math", known_score: 3.00 }
              as: Assessor
              as_user_id: "${asz}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: incentive_admin_cannot_verify_eligibility
        claim_type: "RBAC denial"
        grounds:
          - roles.IncentiveAdministrator
          - endpoints.POST_/candidates/{id}/verify-eligibility
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Segregation of duties: the role that administers stipends cannot decide candidate eligibility — BoardAdministrator exclusive."
        test_recipe:
          setup: ["Clock 2027-01-10; candidate A in ELIGIBILITY_REVIEW."]
          setup_api_calls:
            - *c_clk
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
          trigger:
            - call: "POST /candidates/${cand_a}/verify-eligibility"
              payload: { decision: "APPROVE" }
              as: IncentiveAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "Candidate.${cand_a}.status == ELIGIBILITY_REVIEW (unchanged)"

      - name: board_admin_cannot_transition_assessor
        claim_type: "RBAC denial"
        grounds:
          - roles.BoardAdministrator
          - endpoints.POST_/assessors/{id}/transition
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Board operations do not extend into the scoring pipeline: BoardAdministrator calling an assessor transition gets 403 ERR_INSUFFICIENT_PERMISSIONS (ScoringAdministrator exclusive)."
        test_recipe:
          setup: ["Clock 2027-01-10; assessor Z RECRUITED."]
          setup_api_calls:
            - *c_clk
            - call: "POST /assessors"
              payload: { full_name: "Reader Z", email: "rz@x.com", home_district_code: "D-900" }
              as: ScoringAdministrator
              captures: { asz: $.data.id }
          trigger:
            - call: "POST /assessors/${asz}/transition"
              payload: { to: "IN_TRAINING" }
              as: BoardAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "Assessor.${asz}.status == RECRUITED (unchanged)"

      - name: candidate_b_cannot_submit_candidate_a_submission
        claim_type: "RBAC ownership"
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Ownership gate: candidate B calling submit on candidate A's attempt gets 403 ERR_NOT_RESOURCE_OWNER — entity-backed identity is compared to submission.candidate_id before any state logic."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 OPEN; candidate A ELIGIBLE with P1 attempt IN_PROGRESS (artifacts uploaded); candidate B registered."]
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - *c_open
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
            - *c_p1_sub
            - *c_p1_art_wc
            - *c_p1_art_vid
            - call: "POST /candidates"
              payload: { full_name: "Candidate B", email: "bb@x.com", license_number: "LIC-BB", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_b: $.data.id }
          trigger:
            - call: "POST /submissions/${sub_p1}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_NOT_RESOURCE_OWNER"
            - "ComponentSubmission.${sub_p1}.status == IN_PROGRESS (unchanged)"

      - name: assessor_cannot_submit_score_for_others_assignment
        claim_type: "RBAC ownership"
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Ownership gate on scoring: R2 submitting a score on R1's assignment gets 403 ERR_NOT_RESOURCE_OWNER even though both are ACTIVE assessors."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 OPEN; candidate A ELIGIBLE; assessors R1/R2 ACTIVE; P1 SCORING with read 1 ASSIGNED to R1."]
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - *c_open
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
            - *c_bench
            - *c_r1_new
            - *c_r1_train
            - *c_r1_cal
            - *c_r1_a1
            - *c_r1_s1
            - *c_r1_a2
            - *c_r1_s2
            - *c_r1_active
            - *c_r2_new
            - *c_r2_train
            - *c_r2_cal
            - *c_r2_a1
            - *c_r2_s1
            - *c_r2_a2
            - *c_r2_s2
            - *c_r2_active
            - *c_p1_sub
            - *c_p1_art_wc
            - *c_p1_art_vid
            - *c_p1_submit
            - *c_p1_accept
            - *c_p1_asg1
          trigger:
            - call: "POST /assignments/${c_p1a1}/submit-score"
              payload: { score: 2.50 }
              as: Assessor
              as_user_id: "${as2}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_NOT_RESOURCE_OWNER"
            - "ScoringAssignment.${c_p1a1}.status == ASSIGNED and score is null (unchanged)"

  # ===========================================================================
  - section: consistency model
    instances:
      - name: booking_create_immediately_visible_with_computed_slot_end
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.AssessmentBooking.fields.slot_end_at
        distinguishing_aspect: "Immediate consistency: the POST /bookings 201 response already carries status BOOKED and the computed slot_end_at (slot_start + 120 minutes), and the follow-up GET returns identical values with version 1."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 OPEN; candidate A ELIGIBLE with IN_PROGRESS CKA submission; center capacity 5."]
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - *c_open
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
            - *c_center
            - *c_cka_sub
          trigger:
            - call: "POST /bookings"
              payload: { center_id: "${ctr_id}", cycle_id: "${cyc_id}", slot_start_at: "2027-01-20T14:00:00Z" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { bk2: $.data.id, bk2_st: $.data.status, bk2_end: $.data.slot_end_at, bk2_v: $.data.version }
            - call: "GET /bookings/${bk2}"
              payload: {}
              as: BoardAdministrator
              captures: { bk2_get_st: $.data.status, bk2_get_end: $.data.slot_end_at }
          assert:
            - "create response: status == BOOKED, slot_end_at == 2027-01-20T16:00:00Z, version == 1"
            - "GET immediately after returns the same BOOKED status and slot_end_at (no eventual lag)"
