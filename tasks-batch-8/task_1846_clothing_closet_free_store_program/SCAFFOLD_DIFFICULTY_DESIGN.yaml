            - { call: "POST /closet/clients/${c_id}/visits", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { vs1: $.data.id } }
            - { call: "POST /closet/visits/${vs1}/lines", payload: { item_id: "${i1}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/visits/${vs1}/checkout", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
          trigger:
