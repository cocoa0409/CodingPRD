      - name: return_privilege_suspended_after_three_hygiene_strikes
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "entities.Customer.fields.return_privilege", "errors[ERR_RETURN_PRIVILEGE_SUSPENDED]"]
        distinguishing_aspect: "Three HYGIENE_VIOLATION denials flip return_privilege to SUSPENDED; the fourth POST /return-requests is then rejected with ERR_RETURN_PRIVILEGE_SUSPENDED (403) BEFORE any hygiene or window check runs."
        test_recipe:
          setup:
            - "A SHIPPED, CAPTURED order with a single SEALED line of 4 units at 2500."
            - "Three separate 1-unit return requests have each been DENIED with deny_reason HYGIENE_VIOLATION (hygiene_strikes == 3, return_privilege SUSPENDED)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
