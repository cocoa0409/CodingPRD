# =============================================================================
# SCAFFOLD.yaml — task_3405_industrial_product_stewardship_converter_distributor_network
# Industrial Product Stewardship & Converter Distributor Network
# §1.0–§1.7 (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  Industrial Product Stewardship & Converter Distributor Network (3M): product
  formulation with regulatory review across jurisdictions and material disclosure
  obligations, converter network where authorized partners slit, die-cut and
  laminate base materials into customer-specific formats, converter authorization
  with equipment capability, quality system and territory considerations,
  technical service supporting application engineering and adhesion testing for
  customer substrates, distributor and converter pricing tiers with rebate
  programs and channel conflict management, product change notification and
  last-time-buy programs when a formulation is discontinued, regulated substance
  phase-out with reformulation and customer qualification cycles, counterfeit
  product detection in secondary channels

domain_name: industrial-product-stewardship
api_prefix: /stewardship

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat        # peer entities joined by FK references; no nested write paths
  state_machine_shape: cyclic  # clearance resubmission loop, converter suspend/reinstate loop,
                               # case retest loop, plus parallel dimensions on Order
  relationship_patterns:
    - many_to_many       # FormulationComponent joins Formulation x Substance
    - self_referential   # Formulation.successor_of_id (reformulation lineage)
    - polymorphic        # PriceAgreement buyer / RebateAccrual partner: converter XOR distributor
    - cross_aggregate    # Order gated by JurisdictionClearance; PhaseOutProgram gates on successor clearances
  role_model: segregation_of_duties  # auditor cannot authorize; program creator cannot activate; clearance submitter cannot decide
  consistency_model: immediate

# =============================================================================
# Global constants (every named constant used anywhere in §1.0–§1.9 is pinned here
# or inside a calculation's own constants: block, with a concrete literal)
# =============================================================================
constants:
  CLOCK_DEFAULT_UTC: "2026-09-01T00:00:00Z"   # logical clock value before any set_current_utc call
  MIN_AUDIT_SCORE: 75                          # authorize requires quality_audit_score >= 75 (inclusive)
  RETEST_MAX_FAILURES: 2                       # book-lab blocked when failure_count >= 2
  LAB_BENCH_DAILY_HOURS: 8.0                   # sum of bench_hours of LAB_BOOKED cases per (bench_id, bench_date) must stay <= 8.0
  CHANNEL_MARGIN_MIN_PCT: 0.08                 # distributor min unit price must be >= converter unit price at qty 1 * 1.08
  TIER_DISCOUNT_CONVERTER_AUTHORIZED: 0.18
  TIER_DISCOUNT_DISTRIBUTOR_PREFERRED: 0.12
  TIER_DISCOUNT_STANDARD: 0.0
  MAX_VOLUME_BREAKPOINTS: 3
  MIN_QUALIFIED_CUSTOMERS: 2                   # QUALIFYING -> ENFORCED requires >= 2 qualified customers (inclusive)
  QUALIFICATION_MIN_SAMPLES: 3                 # record-qualification requires samples_passed >= 3 (inclusive)
  ADHESION_THRESHOLD_METAL: 15.0               # N/25mm nominal pass thresholds by substrate_class
  ADHESION_THRESHOLD_POLYMER: 8.0
  ADHESION_THRESHOLD_GLASS: 10.0
  ADHESION_THRESHOLD_COMPOSITE: 12.0
  NOMINAL_TEMP_C: 23
  DERATE_PCT_PER_10C: 0.03                     # derated threshold = nominal * (1 + 0.03 * floor(|temp-23|/10))

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique jurisdiction code (e.g. DE, US-CA); unique across Jurisdiction" }
      - { name: name, type: string, source: input, description: "Human-readable jurisdiction name" }
      - { name: declaration_threshold_ppm, type: integer, source: input, description: "Concentration (ppm) at or above which DECLARATION-level disclosure is required" }
      - { name: full_disclosure_threshold_ppm, type: integer, source: input, description: "Concentration (ppm) at or above which FULL_DISCLOSURE is required; must be > declaration_threshold_ppm" }
      - { name: review_sla_days, type: integer, source: input, default: 30, description: "Advisory review SLA in days; informational only" }

  - name: Substance
    parent: null
    common_fields: true
    fields:
      - { name: cas_number, type: string, source: input, description: "CAS registry number; unique across Substance" }
      - { name: name, type: string, source: input, description: "Substance name" }
      - { name: restriction_class, type: enum, source: input, description: "STANDARD | REPORTABLE | RESTRICTED | PROHIBITED" }

  - name: Formulation
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code" }
      - { name: name, type: string, source: input, description: "Formulation name" }
      - { name: base_polymer_family, type: string, source: input, description: "Base resin/polymer family label" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE (auto on first CLEARED clearance) -> DISCONTINUED" }
      - { name: revision_number, type: integer, source: system, default: 1, description: "1 for a root formulation; successor creation sets predecessor.revision_number + 1" }
      - { name: successor_of_id, type: string, source: system, description: "FK -> Formulation.id; null for root formulations; set on rows created via POST /formulations/{id}/successors" }
      - { name: active_clearance_count, type: integer, source: computed, default: 0, description: "Count of this formulation's JurisdictionClearance rows with status CLEARED" }
      - { name: discontinued_at, type: datetime, source: system, description: "Logical-clock timestamp of discontinuation; null until DISCONTINUED" }
      - { name: ltb_deadline, type: datetime, source: input, description: "Last-time-buy deadline (inclusive): orders accepted while clock <= ltb_deadline; null until discontinued" }
      - { name: last_ship_date, type: datetime, source: input, description: "Latest acceptable requested_ship_date (inclusive) for LTB orders; null until discontinued" }
      - { name: ltb_pool_quantity, type: integer, source: input, description: "Total last-time-buy pool units; null until discontinued" }
      - { name: ltb_pool_remaining, type: integer, source: computed, description: "= ltb_pool_quantity - sum(quantity of orders on this formulation with fulfillment_status in {ALLOCATED, SHIPPED}); null until discontinued" }

  - name: FormulationComponent
    parent: null
    common_fields: false
    fields:
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id; formulation must be DRAFT at create time" }
      - { name: substance_id, type: string, source: input, description: "FK -> Substance.id" }
      - { name: concentration_ppm, type: integer, source: input, description: "Concentration in parts per million; must be > 0" }
    # Immutable join rows: no update endpoint, no version field. (formulation_id, substance_id) unique.

  - name: JurisdictionClearance
    parent: null
    common_fields: true
    fields:
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: disclosure_package_level, type: enum, source: input, description: "EXEMPT | DECLARATION | FULL_DISCLOSURE — level of the submitted disclosure package" }
      - { name: required_disclosure_level, type: enum, source: computed, description: "EXEMPT | DECLARATION | FULL_DISCLOSURE — computed from formulation components vs jurisdiction thresholds (calc required_disclosure_level)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> CLEARED | CHANGES_REQUESTED | REJECTED; CHANGES_REQUESTED -> SUBMITTED (resubmit); CLEARED -> SUSPENDED (system); SUSPENDED -> SUBMITTED (resubmit)" }
      - { name: submission_count, type: integer, source: system, default: 1, description: "1 on first submission; +1 on each resubmission" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the RegulatoryManager who made the latest decision; null until decided" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock time of latest decision; null until decided" }

  - name: Converter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Converter partner organization name" }
      - { name: home_territory_code, type: string, source: input, description: "Home territory code (matches Jurisdiction.code of its home market)" }
      - { name: status, type: enum, source: system, description: "APPLIED -> AUDIT_RECORDED -> AUTHORIZED -> SUSPENDED -> AUTHORIZED (reinstate); SUSPENDED -> REVOKED (system, on confirmed counterfeit implication)" }
      - { name: quality_audit_score, type: integer, source: input, description: "0-100 audit score recorded by QualityAuditor; null until audited" }
      - { name: audit_standard, type: string, source: input, description: "Audit standard label (e.g. ISO9001); null until audited" }
      - { name: audited_by, type: string, source: system, description: "X-User-ID of the QualityAuditor who recorded the audit; null until audited" }

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Distributor organization name" }
      - { name: home_territory_code, type: string, source: input, description: "Home territory code (matches Jurisdiction.code of its home market)" }

  - name: ConverterAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: converter_id, type: string, source: input, description: "FK -> Converter.id" }
      - { name: capability, type: enum, source: input, description: "SLITTING | DIE_CUTTING | LAMINATION" }
      - { name: territory_code, type: string, source: input, description: "Territory code this authorization covers (matched against Jurisdiction.code)" }
      - { name: valid_from, type: datetime, source: input, description: "Window start, inclusive" }
      - { name: valid_to, type: datetime, source: input, description: "Window end, exclusive (half-open [valid_from, valid_to))" }

  - name: ApplicationCase
    parent: null
    common_fields: true
    fields:
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id; formulation must be ACTIVE at case creation" }
      - { name: customer_ref, type: string, source: input, description: "Free-form end-customer reference (no persisted Customer entity)" }
      - { name: substrate_class, type: enum, source: input, description: "METAL | POLYMER | GLASS | COMPOSITE" }
      - { name: application_description, type: string, source: input, description: "Free-text description of the bonding application", required: false }
      - { name: status, type: enum, source: system, description: "OPEN -> LAB_BOOKED -> CLOSED_PASS | CLOSED_FAIL; CLOSED_FAIL -> LAB_BOOKED (retest while failure_count < RETEST_MAX_FAILURES)" }
      - { name: failure_count, type: integer, source: system, default: 0, description: "Number of failed recorded results; +1 on each failing record-result" }
      - { name: bench_id, type: string, source: input, description: "Lab bench identifier of the current/last booking; null until first book-lab" }
      - { name: bench_date, type: datetime, source: input, description: "Booking day (date portion used for capacity); null until first book-lab" }
      - { name: bench_hours, type: number, source: input, description: "Hours booked on the bench; null until first book-lab" }
      - { name: peel_strength_n_per_25mm, type: number, source: input, description: "Recorded peel strength; null until record-result" }
      - { name: test_temp_c, type: integer, source: input, description: "Test temperature in Celsius; null until record-result" }
      - { name: test_standard, type: enum, source: input, description: "NOMINAL | APPLICATION_DERATED; null until record-result" }
      - { name: pass_threshold_applied, type: number, source: computed, description: "The threshold (N/25mm) the recorded result was judged against; null until record-result" }

  - name: PriceAgreement
    parent: null
    common_fields: true
    fields:
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; orders under this agreement ship into this jurisdiction" }
      - { name: converter_id, type: string, source: input, description: "FK -> Converter.id; exactly one of converter_id / distributor_id must be set", required: false }
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; exactly one of converter_id / distributor_id must be set", required: false }
      - { name: tier, type: enum, source: input, description: "CONVERTER_AUTHORIZED (converter buyers only) | DISTRIBUTOR_PREFERRED (distributor buyers only) | STANDARD (either)" }
      - { name: base_price_cents, type: integer, source: input, description: "List unit price in cents before tier/volume discounts; must be > 0" }
      - { name: volume_breakpoints, type: array, source: input, description: "Array of { min_qty: integer, extra_discount_pct: number }, sorted by min_qty asc, at most MAX_VOLUME_BREAKPOINTS entries", default: [] }
      - { name: effective_from, type: datetime, source: input, description: "Effective window start, inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Effective window end, exclusive (half-open [effective_from, effective_to))" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> PriceAgreement.id" }
      - { name: converter_id, type: string, source: input, description: "FK -> Converter.id; exactly one of converter_id / distributor_id; must equal the agreement's buyer and X-User-ID when role is Converter", required: false }
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; exactly one of converter_id / distributor_id; must equal the agreement's buyer and X-User-ID when role is Distributor", required: false }
      - { name: formulation_id, type: string, source: system, description: "FK -> Formulation.id; denormalized from agreement at creation" }
      - { name: ship_to_jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; denormalized from agreement at creation" }
      - { name: quantity, type: integer, source: input, description: "Ordered units; must be > 0" }
      - { name: requested_ship_date, type: datetime, source: input, description: "Requested ship date; for LTB orders must be <= formulation.last_ship_date" }
      - { name: intended_capability, type: enum, source: input, description: "SLITTING | DIE_CUTTING | LAMINATION; required when buyer is a converter, forbidden when buyer is a distributor", required: false }
      - { name: lot_code, type: string, source: input, description: "Manufacturer lot code the order is drawn from; null allowed; counterfeit cascades match on lot_code equality", required: false }
      - { name: unit_price_cents, type: integer, source: computed, description: "Computed by calc order_unit_price at creation" }
      - { name: line_total_cents, type: integer, source: computed, description: "= unit_price_cents * quantity" }
      - { name: is_ltb_order, type: boolean, source: computed, description: "true when the formulation was DISCONTINUED at order creation (last-time-buy path)" }
      - { name: fulfillment_status, type: enum, source: system, description: "PENDING -> ALLOCATED -> SHIPPED; PENDING|ALLOCATED -> CANCELLED" }
      - { name: compliance_status, type: enum, source: system, description: "CLEAR <-> FLAGGED; parallel dimension, independent of fulfillment_status" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical-clock time of the ALLOCATED -> SHIPPED transition; null until shipped" }
      - { name: flagged_by_report_id, type: string, source: system, description: "FK -> CounterfeitReport.id; which report's confirmation flagged this order; null while CLEAR" }

  - name: RebateProgram
    parent: null
    common_fields: true
    fields:
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id" }
      - { name: partner_type, type: enum, source: input, description: "CONVERTER | DISTRIBUTOR" }
      - { name: converter_id, type: string, source: input, description: "FK -> Converter.id; exactly one of converter_id / distributor_id, consistent with partner_type", required: false }
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; exactly one of converter_id / distributor_id, consistent with partner_type", required: false }
      - { name: period_start, type: datetime, source: input, description: "Accrual period start, inclusive" }
      - { name: period_end, type: datetime, source: input, description: "Accrual period end, exclusive" }
      - { name: rebate_tiers, type: array, source: input, description: "Array of { threshold_qty: integer, rate_pct: number } sorted by threshold_qty asc; first threshold_qty must be 0; applied MARGINALLY (calc rebate_accrual_amount)" }
      - { name: budget_cap_cents, type: integer, source: input, description: "Maximum total payout across CLAIMED + PAID accruals; must be > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> CLOSED" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the ChannelManager who created the program (segregation-of-duties anchor)" }
      - { name: paid_out_cents, type: integer, source: computed, default: 0, description: "Sum of final_amount_cents of this program's PAID accruals" }

  - name: RebateAccrual
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> RebateProgram.id" }
      - { name: converter_id, type: string, source: system, description: "FK -> Converter.id; set when the program's partner is a converter", required: false }
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; set when the program's partner is a distributor", required: false }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Recomputed on each SHIP or FLAG/UNFLAG event over the provisional input set (see calc rebate_accrual_amount)" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Recomputed once at program close over the final input set; null until FINALIZED" }
      - { name: excluded_order_count, type: integer, source: computed, default: 0, description: "Count of the partner's SHIPPED orders in the period whose compliance_status is FLAGGED (excluded from the final input set)" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL -> FINALIZED (on program close) -> CLAIMED -> PAID" }

  - name: PhaseOutProgram
    parent: null
    common_fields: true
    fields:
      - { name: substance_id, type: string, source: input, description: "FK -> Substance.id; the regulated substance being phased out" }
      - { name: jurisdiction_codes, type: array, source: input, description: "Array of Jurisdiction.code strings where the phase-out is enforced; non-empty" }
      - { name: trigger_concentration_ppm, type: integer, source: input, description: "Formulations containing the substance at >= this concentration are affected; must be > 0" }
      - { name: status, type: enum, source: system, description: "ANNOUNCED -> REFORMULATING -> QUALIFYING -> ENFORCED" }
      - { name: successor_formulation_id, type: string, source: input, description: "FK -> Formulation.id; the reformulated successor; set by the REFORMULATING -> QUALIFYING advance; null before", required: false }
      - { name: qualified_customers, type: array, source: system, description: "Array of customer_ref strings that completed qualification; appended by record-qualification; default []" }
      - { name: qualified_customer_count, type: integer, source: computed, default: 0, description: "= len(qualified_customers)" }

  - name: CounterfeitReport
    parent: null
    common_fields: true
    fields:
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id" }
      - { name: lot_code, type: string, source: input, description: "Suspect lot code observed in the secondary channel" }
      - { name: channel_description, type: string, source: input, description: "Free-text description of where the suspect product surfaced" }
      - { name: implicated_converter_id, type: string, source: input, description: "FK -> Converter.id; optional converter implicated as the leak source", required: false }
      - { name: reporter_role, type: string, source: system, description: "X-User-Role of the reporter" }
      - { name: status, type: enum, source: system, description: "REPORTED -> CONFIRMED_COUNTERFEIT | CLEARED_GENUINE | INCONCLUSIVE" }
      - { name: investigator_note, type: string, source: input, description: "Free-text note recorded at disposition; null until disposition", required: false }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Formulation
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system (automatic when this formulation's first JurisdictionClearance becomes CLEARED)"
        actor: system
        preconditions:
          - "active_clearance_count transitions 0 -> 1"
        side_effects:
          - "Formulation becomes eligible for price agreements, application cases and orders"
        note: "Bubble-up: child clearance approval activates the parent formulation"

      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /stewardship/formulations/{id}/discontinue"
        actor: ProductManager
        preconditions:
          - "ltb_deadline >= current logical clock (window must not already be closed)"
          - "last_ship_date >= ltb_deadline"
          - "ltb_pool_quantity > 0"
        side_effects:
          - "discontinued_at = current logical clock"
          - "ltb_pool_remaining = ltb_pool_quantity"
          - "increments Formulation.version by 1"
        note: "Product change notification + last-time-buy window open in one action"

  - entity: JurisdictionClearance
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /stewardship/clearances/{id}/decision with decision=CLEARED"
        actor: RegulatoryManager
        preconditions:
          - "rank(disclosure_package_level) >= rank(required_disclosure_level), order EXEMPT < DECLARATION < FULL_DISCLOSURE (else ERR_DISCLOSURE_INSUFFICIENT)"
        side_effects:
          - "decided_by = X-User-ID, decided_at = clock"
          - "formulation.active_clearance_count += 1"
          - "if formulation.status == DRAFT: formulation -> ACTIVE (bubble-up)"

      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /stewardship/clearances/{id}/decision with decision=CHANGES_REQUESTED"
        actor: RegulatoryManager
        preconditions: []
        side_effects:
          - "decided_by = X-User-ID, decided_at = clock"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /stewardship/clearances/{id}/decision with decision=REJECTED"
        actor: RegulatoryManager
        preconditions: []
        side_effects:
          - "decided_by = X-User-ID, decided_at = clock"

      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /stewardship/clearances for the same (formulation_id, jurisdiction_id) pair (resubmission upsert)"
        actor: ProductManager
        preconditions:
          - "existing clearance for the pair is in CHANGES_REQUESTED"
        side_effects:
          - "disclosure_package_level replaced by the new payload value"
          - "required_disclosure_level recomputed"
          - "submission_count += 1"

      - from: CLEARED
        to: SUSPENDED
        trigger: "system (phase-out ENFORCED sweep, calc phaseout_enforcement_sweep)"
        actor: system
        preconditions:
          - "clearance matches an enforced phase-out program (formulation contains program.substance_id at >= trigger_concentration_ppm AND jurisdiction.code in program.jurisdiction_codes)"
        side_effects:
          - "formulation.active_clearance_count -= 1"
          - "cascade link 2: orders on (formulation, jurisdiction) with fulfillment_status in {PENDING, ALLOCATED, SHIPPED} and compliance_status CLEAR -> FLAGGED"

      - from: SUSPENDED
        to: SUBMITTED
        trigger: "POST /stewardship/clearances for the same (formulation_id, jurisdiction_id) pair (resubmission after suspension)"
        actor: ProductManager
        preconditions:
          - "existing clearance for the pair is in SUSPENDED"
        side_effects:
          - "disclosure_package_level replaced by the new payload value"
          - "required_disclosure_level recomputed"
          - "submission_count += 1"

  - entity: Converter
    initial_state: APPLIED
    terminal_states: [REVOKED]
    transitions:
      - from: APPLIED
        to: AUDIT_RECORDED
        trigger: "POST /stewardship/converters/{id}/record-audit"
        actor: QualityAuditor
        preconditions: []
        side_effects:
          - "quality_audit_score, audit_standard set from payload"
          - "audited_by = X-User-ID"

      - from: AUDIT_RECORDED
        to: AUTHORIZED
        trigger: "POST /stewardship/converters/{id}/authorize"
        actor: ChannelManager
        preconditions:
          - "quality_audit_score >= MIN_AUDIT_SCORE (75) (else ERR_AUDIT_SCORE_INSUFFICIENT)"
          - "X-User-ID != audited_by (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /stewardship/converters/{id}/suspend OR system (confirmed counterfeit implication, calc counterfeit_confirmation_sweep)"
        actor: ChannelManager | system
        preconditions: []
        side_effects:
          - "cascade link 2: this converter's orders with fulfillment_status in {PENDING, ALLOCATED} -> compliance_status FLAGGED (flagged_by_report_id set only when caused by a report)"

      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /stewardship/converters/{id}/reinstate"
        actor: ChannelManager
        preconditions: []
        side_effects: []
        note: "Reinstatement does NOT unflag orders; order flags clear only via the reporting cascade"

      - from: SUSPENDED
        to: REVOKED
        trigger: "system (a second distinct CONFIRMED_COUNTERFEIT report implicates the same converter while it is SUSPENDED)"
        actor: system
        preconditions:
          - "converter already SUSPENDED when the confirming disposition lands"
        side_effects: []

  - entity: ApplicationCase
    initial_state: OPEN
    terminal_states: [CLOSED_PASS]
    transitions:
      - from: OPEN
        to: LAB_BOOKED
        trigger: "POST /stewardship/application-cases/{id}/book-lab"
        actor: TechnicalEngineer
        preconditions:
          - "bench_hours > 0"
          - "capacity: sum(bench_hours of LAB_BOOKED cases on same (bench_id, bench_date)) + bench_hours <= LAB_BENCH_DAILY_HOURS (8.0) (else ERR_BENCH_CAPACITY_EXCEEDED)"
        side_effects:
          - "bench slot reserved (counts toward bench_daily_capacity)"

      - from: LAB_BOOKED
        to: CLOSED_PASS
        trigger: "POST /stewardship/application-cases/{id}/record-result with passing result (calc adhesion_pass_evaluation)"
        actor: TechnicalEngineer
        preconditions: []
        side_effects:
          - "pass_threshold_applied stored"
          - "bench slot released (hours no longer counted)"

      - from: LAB_BOOKED
        to: CLOSED_FAIL
        trigger: "POST /stewardship/application-cases/{id}/record-result with failing result"
        actor: TechnicalEngineer
        preconditions: []
        side_effects:
          - "failure_count += 1"
          - "pass_threshold_applied stored"
          - "bench slot released"

      - from: CLOSED_FAIL
        to: LAB_BOOKED
        trigger: "POST /stewardship/application-cases/{id}/book-lab (retest)"
        actor: TechnicalEngineer
        preconditions:
          - "failure_count < RETEST_MAX_FAILURES (2) (else ERR_RETEST_LIMIT_EXCEEDED)"
          - "same bench capacity rule as OPEN -> LAB_BOOKED"
        side_effects:
          - "bench slot reserved"

  - entity: Order
    initial_state: "fulfillment_status=PENDING, compliance_status=CLEAR"
    terminal_states: ["fulfillment_status=SHIPPED", "fulfillment_status=CANCELLED"]
    # PARALLEL DIMENSIONS: fulfillment_status and compliance_status evolve independently.
    transitions:
      - from: "fulfillment PENDING"
        to: "fulfillment ALLOCATED"
        trigger: "POST /stewardship/orders/{id}/advance"
        actor: "Converter | Distributor (owner)"
        preconditions:
          - "compliance_status == CLEAR (else ERR_ORDER_COMPLIANCE_BLOCKED)"
          - "if is_ltb_order: formulation.ltb_pool_remaining >= quantity (else ERR_LTB_POOL_EXHAUSTED)"
        side_effects:
          - "if is_ltb_order: formulation.ltb_pool_remaining -= quantity"

      - from: "fulfillment ALLOCATED"
        to: "fulfillment SHIPPED"
        trigger: "POST /stewardship/orders/{id}/advance"
        actor: "Converter | Distributor (owner)"
        preconditions:
          - "compliance_status == CLEAR (else ERR_ORDER_COMPLIANCE_BLOCKED)"
        side_effects:
          - "shipped_at = current logical clock"
          - "recompute provisional_amount_cents on the RebateAccrual of each ACTIVE RebateProgram matching (formulation_id, this partner) whose period covers shipped_at (calc rebate_accrual_amount, provisional variant)"

      - from: "fulfillment PENDING"
        to: "fulfillment CANCELLED"
        trigger: "POST /stewardship/orders/{id}/cancel"
        actor: "Converter | Distributor (owner)"
        preconditions: []
        side_effects: []

      - from: "fulfillment ALLOCATED"
        to: "fulfillment CANCELLED"
        trigger: "POST /stewardship/orders/{id}/cancel"
        actor: "Converter | Distributor (owner)"
        preconditions: []
        side_effects:
          - "compensation: if is_ltb_order, formulation.ltb_pool_remaining += quantity (calc ltb_pool_tracking invariant)"

      - from: "compliance CLEAR"
        to: "compliance FLAGGED"
        trigger: "system (phase-out enforcement sweep or confirmed counterfeit sweep)"
        actor: system
        preconditions:
          - "fulfillment_status != CANCELLED"
        side_effects:
          - "recompute excluded_order_count on matching RebateAccruals"

      - from: "compliance FLAGGED"
        to: "compliance CLEAR"
        trigger: "system (disposition CLEARED_GENUINE or INCONCLUSIVE on the report named by flagged_by_report_id, and no other CONFIRMED_COUNTERFEIT report matches this order's (formulation_id, lot_code))"
        actor: system
        preconditions: []
        side_effects:
          - "flagged_by_report_id = null"
          - "recompute excluded_order_count on matching RebateAccruals"

  - entity: RebateProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /stewardship/rebate-programs/{id}/advance"
        actor: FinanceController
        preconditions:
          - "X-User-ID != created_by (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
          - "current logical clock < period_end (cannot activate an already-closed window)"
        side_effects:
          - "creates the program's RebateAccrual row for the target partner with status PROVISIONAL, provisional_amount_cents = 0, excluded_order_count = 0"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /stewardship/rebate-programs/{id}/advance"
        actor: FinanceController
        preconditions:
          - "current logical clock >= period_end (period must have ended)"
        side_effects:
          - "program's RebateAccrual: recompute final_amount_cents over the FINAL input set (SHIPPED and compliance CLEAR at close), status -> FINALIZED"

  - entity: RebateAccrual
    initial_state: PROVISIONAL
    terminal_states: [PAID]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "system (parent RebateProgram ACTIVE -> CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "final_amount_cents computed (final variant of calc rebate_accrual_amount)"

      - from: FINALIZED
        to: CLAIMED
        trigger: "POST /stewardship/rebate-accruals/{id}/claim"
        actor: "Converter | Distributor (the accrual's partner)"
        preconditions:
          - "accrual must be FINALIZED; a claim on a PROVISIONAL accrual fails with the specialized state error ERR_ACCRUAL_NOT_FINALIZED (priority-8 tier), not generic ERR_INVALID_STATE"
          - "program.budget_cap_cents - sum(final_amount_cents of this program's CLAIMED or PAID accruals) >= this final_amount_cents (else ERR_REBATE_BUDGET_EXCEEDED)"
        side_effects: []

      - from: CLAIMED
        to: PAID
        trigger: "POST /stewardship/rebate-accruals/{id}/pay"
        actor: FinanceController
        preconditions: []
        side_effects:
          - "program.paid_out_cents += final_amount_cents"

  - entity: PhaseOutProgram
    initial_state: ANNOUNCED
    terminal_states: [ENFORCED]
    transitions:
      - from: ANNOUNCED
        to: REFORMULATING
        trigger: "POST /stewardship/phase-out-programs/{id}/advance"
        actor: RegulatoryManager
        preconditions: []
        side_effects: []

      - from: REFORMULATING
        to: QUALIFYING
        trigger: "POST /stewardship/phase-out-programs/{id}/advance with successor_formulation_id"
        actor: RegulatoryManager
        preconditions:
          - "successor_formulation_id present (else ERR_PHASEOUT_SUCCESSOR_REQUIRED)"
          - "successor_formulation.successor_of_id resolves to a formulation affected by this program (contains substance_id at >= trigger_concentration_ppm)"
        side_effects:
          - "successor_formulation_id stored on the program"

      - from: QUALIFYING
        to: ENFORCED
        trigger: "POST /stewardship/phase-out-programs/{id}/advance"
        actor: RegulatoryManager
        preconditions:
          - "qualified_customer_count >= MIN_QUALIFIED_CUSTOMERS (2) (else ERR_QUALIFICATION_GATE_UNMET)"
          - "successor formulation holds a CLEARED JurisdictionClearance in every jurisdiction whose code is in jurisdiction_codes (else ERR_QUALIFICATION_GATE_UNMET)"
        side_effects:
          - "cascade link 1 (calc phaseout_enforcement_sweep): every CLEARED JurisdictionClearance whose formulation contains substance_id at >= trigger_concentration_ppm and whose jurisdiction.code is in jurisdiction_codes -> SUSPENDED"
          - "cascade link 2: orders on those (formulation, jurisdiction) pairs, fulfillment in {PENDING, ALLOCATED, SHIPPED}, compliance CLEAR -> FLAGGED"
          - "cascade link 3: recompute excluded_order_count on RebateAccruals touching flagged orders"

  - entity: CounterfeitReport
    initial_state: REPORTED
    terminal_states: [CONFIRMED_COUNTERFEIT, CLEARED_GENUINE, INCONCLUSIVE]
    transitions:
      - from: REPORTED
        to: CONFIRMED_COUNTERFEIT
        trigger: "POST /stewardship/counterfeit-reports/{id}/disposition with outcome=CONFIRMED_COUNTERFEIT"
        actor: QualityAuditor
        preconditions: []
        side_effects:
          - "cascade link 1 (calc counterfeit_confirmation_sweep): if implicated_converter_id set and that converter is AUTHORIZED -> SUSPENDED (if already SUSPENDED -> REVOKED)"
          - "cascade link 2a: orders with (formulation_id, lot_code) equal to this report's, fulfillment != CANCELLED, compliance CLEAR -> FLAGGED (flagged_by_report_id = this report)"
          - "cascade link 2b: the implicated converter's in-flight orders (fulfillment in {PENDING, ALLOCATED}) with compliance CLEAR -> FLAGGED (flagged_by_report_id = this report)"
          - "cascade link 3: recompute excluded_order_count on RebateAccruals touching flagged orders"

      - from: REPORTED
        to: CLEARED_GENUINE
        trigger: "POST /stewardship/counterfeit-reports/{id}/disposition with outcome=CLEARED_GENUINE"
        actor: QualityAuditor
        preconditions: []
        side_effects:
          - "orders whose flagged_by_report_id == this report and for which no other CONFIRMED_COUNTERFEIT report matches (formulation_id, lot_code) -> compliance CLEAR"

      - from: REPORTED
        to: INCONCLUSIVE
        trigger: "POST /stewardship/counterfeit-reports/{id}/disposition with outcome=INCONCLUSIVE"
        actor: QualityAuditor
        preconditions: []
        side_effects:
          - "same release rule as CLEARED_GENUINE"

# =============================================================================
# 1.2.1 Concurrency Rules (true OCC races only; sequential-stale rejection)
# =============================================================================
concurrency_rules:
  - rule_id: successor-create-stale-formulation
    parent_entity: Formulation
    write_endpoint: "POST /stewardship/formulations/{id}/successors"
    occ_field: "expected_formulation_version"
    description: |
      Creating a successor formulation from a predecessor whose version has
      advanced since the client last read it is rejected. The loser read the
      predecessor at version N, another writer mutated the predecessor (e.g.
      discontinued it or created a successor, each bumping version), and the
      loser's stale expected_formulation_version=N no longer matches.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: authorization-create-stale-converter
    parent_entity: Converter
    write_endpoint: "POST /stewardship/converter-authorizations"
    occ_field: "expected_converter_version"
    description: |
      Creating a ConverterAuthorization against a Converter whose version has
      advanced since the client last read it is rejected. Authorization creation
      itself bumps Converter.version, so a second create carrying the pre-first
      version deterministically fails even though the converter remains
      AUTHORIZED and otherwise eligible.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: order-create-stale-agreement
    parent_entity: PriceAgreement
    write_endpoint: "POST /stewardship/orders"
    occ_field: "expected_price_agreement_version"
    description: |
      Creating an Order against a PriceAgreement whose version has advanced
      since the client last read it is rejected. Order creation bumps the
      agreement's version, so a second order carrying the pre-first version
      deterministically fails even though every business field of the agreement
      is unchanged and the order would otherwise succeed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: required_disclosure_level
    trigger: "JurisdictionClearance creation and every resubmission"
    algorithm: threshold
    formula: |
      let relevant = components of the formulation whose substance.restriction_class IN {REPORTABLE, RESTRICTED}
      if relevant is empty: required_disclosure_level = EXEMPT
      else let max_ppm = max(concentration_ppm over relevant)
        if max_ppm < jurisdiction.declaration_threshold_ppm: EXEMPT
        elif max_ppm < jurisdiction.full_disclosure_threshold_ppm: DECLARATION
        else: FULL_DISCLOSURE
      Boundary: max_ppm == declaration_threshold_ppm -> DECLARATION (>= is inclusive at the lower edge);
      max_ppm == full_disclosure_threshold_ppm -> FULL_DISCLOSURE.
    input_set: "FormulationComponent rows of the clearance's formulation joined to Substance; STANDARD and PROHIBITED classes excluded (PROHIBITED is rejected earlier by validation, never reaches this calc)"
    precision: "integer ppm comparison, no rounding"

  - name: order_unit_price
    trigger: "POST /stewardship/orders (at creation; result frozen on the order)"
    algorithm: tiered_pricing
    formula: |
      tier_discount = TIER_DISCOUNT_* constant for agreement.tier
      eligible = breakpoints in agreement.volume_breakpoints with min_qty <= order.quantity
      extra = max(extra_discount_pct over eligible) if eligible non-empty else 0
      effective_discount = tier_discount + extra
      unit_price_cents = round_half_up(base_price_cents * (1 - effective_discount))
      line_total_cents = unit_price_cents * quantity
      PINNED: average-rate application — the single best applicable breakpoint discounts the WHOLE
      quantity; NOT marginal per-bracket allocation. Rounding: round once at the unit price,
      then multiply (never round the line total first).
    input_set: "the order's agreement only"
    constants:
      TIER_DISCOUNT_CONVERTER_AUTHORIZED: 0.18
      TIER_DISCOUNT_DISTRIBUTOR_PREFERRED: 0.12
      TIER_DISCOUNT_STANDARD: 0.0
      MAX_VOLUME_BREAKPOINTS: 3
    precision: "integer cents, round_half_up at unit price"

  - name: rebate_accrual_amount
    trigger: "provisional variant: each order SHIP event and each compliance FLAG/UNFLAG event on a matching order; final variant: parent program ACTIVE -> CLOSED"
    algorithm: chronological
    formula: |
      Orders processed in chronological order: shipped_at ASC, tie-break created_at ASC (never id).
      Running cumulative quantity Q starts at 0. Tiers are program.rebate_tiers sorted by
      threshold_qty asc; tier i covers [threshold_qty_i, threshold_qty_{i+1}) with the last open-ended.
      For each order with quantity q and frozen unit_price_cents u:
        for each tier i:
          portion_i = max(0, min(Q + q, threshold_qty_{i+1}) - max(Q, threshold_qty_i))
          accrual_i_cents = round_half_up(portion_i * u * rate_pct_i)
        order_accrual_cents = sum(accrual_i_cents)
        Q += q
      accrual_total_cents = sum(order_accrual_cents over input set)
      PINNED rounding order (mode b): round each order's per-tier portion to cents FIRST (half-up),
      then sum. Never sum raw fractional cents across orders and round once.
    input_set: |
      provisional variant: the partner's orders on the program's formulation with
      fulfillment_status == SHIPPED and shipped_at inside [period_start, period_end),
      REGARDLESS of compliance_status.
      final variant: same but additionally compliance_status == CLEAR at close time.
    precision: "integer cents, round_half_up per order per tier portion"
    variants:
      - name: provisional
        when: "on every SHIP / FLAG / UNFLAG event while program is ACTIVE"
        difference: "input set includes FLAGGED shipped orders; stored in provisional_amount_cents"
      - name: final
        when: "once, at program close"
        difference: "input set excludes orders whose compliance_status is FLAGGED at close; chronological cumulative quantity Q is re-baselined over the reduced set, so surviving orders can fall into LOWER brackets than they occupied provisionally; stored in final_amount_cents"

  - name: adhesion_pass_evaluation
    trigger: "POST /stewardship/application-cases/{id}/record-result"
    algorithm: threshold
    formula: |
      nominal = ADHESION_THRESHOLD_<substrate_class>  (METAL 15.0, POLYMER 8.0, GLASS 10.0, COMPOSITE 12.0)
      if test_standard == NOMINAL:
        threshold = nominal
      else (APPLICATION_DERATED):
        steps = floor(abs(test_temp_c - NOMINAL_TEMP_C) / 10)
        threshold = round(nominal * (1 + DERATE_PCT_PER_10C * steps), 2)  # round_half_up to 2dp
      pass = peel_strength_n_per_25mm >= threshold   # inclusive boundary
      pass_threshold_applied = threshold
    input_set: "the single ApplicationCase being recorded"
    constants:
      ADHESION_THRESHOLD_METAL: 15.0
      ADHESION_THRESHOLD_POLYMER: 8.0
      ADHESION_THRESHOLD_GLASS: 10.0
      ADHESION_THRESHOLD_COMPOSITE: 12.0
      NOMINAL_TEMP_C: 23
      DERATE_PCT_PER_10C: 0.03
    precision: "threshold rounded to 2 decimal places round_half_up before comparison; peel compared as given"
    variants:
      - name: nominal
        when: "test_standard == NOMINAL"
        difference: "threshold is the bare substrate constant, temperature ignored"
      - name: application_derated
        when: "test_standard == APPLICATION_DERATED"
        difference: "threshold scales up 3% per full 10C deviation from 23C; same peel value can pass NOMINAL and fail APPLICATION_DERATED"

  - name: channel_price_floor
    trigger: "POST /stewardship/price-agreements when the buyer is a distributor"
    algorithm: constraint_propagation
    formula: |
      distributor_min_unit = round_half_up(base_price_cents * (1 - TIER_DISCOUNT_DISTRIBUTOR_PREFERRED_or_STANDARD - max_extra))
        where max_extra = max(extra_discount_pct over this agreement's own volume_breakpoints) or 0
      references = converter-buyer PriceAgreements for the same (formulation_id, jurisdiction_id)
        whose [effective_from, effective_to) overlaps this agreement's window (half-open overlap test)
      if references is empty: no floor applies
      floor_cents = min over references of round_half_up(ref.base_price_cents * (1 - ref_tier_discount)) * (1 + CHANNEL_MARGIN_MIN_PCT), rounded half-up to integer cents
      if distributor_min_unit < floor_cents: reject with ERR_CHANNEL_FLOOR_VIOLATION
      Evaluation order pinned: compute references' unit prices at quantity 1 (no breakpoint extra) FIRST,
      then the floor, then compare against this agreement's worst-case minimum unit price.
    input_set: "converter PriceAgreements sharing formulation_id + jurisdiction_id with overlapping windows"
    constants:
      CHANNEL_MARGIN_MIN_PCT: 0.08
    precision: "integer cents, round_half_up at each pinned step"

  - name: ltb_pool_tracking
    trigger: "order ALLOCATE (reserve) and ALLOCATED-order CANCEL (release) on a DISCONTINUED formulation"
    algorithm: aggregation
    formula: |
      on allocate (is_ltb_order): require ltb_pool_remaining >= quantity; then ltb_pool_remaining -= quantity
      on cancel of ALLOCATED ltb order: ltb_pool_remaining += quantity
      INVARIANT (compensating pair): at all times,
        ltb_pool_remaining == ltb_pool_quantity - sum(quantity of orders on this formulation
          with fulfillment_status IN {ALLOCATED, SHIPPED})
    input_set: "orders of this formulation created after discontinuation (is_ltb_order == true)"
    precision: "integer units, exact"

  - name: bench_daily_capacity
    trigger: "book-lab admission check; release on record-result"
    algorithm: aggregation
    formula: |
      occupied(bench_id, bench_date) = sum(bench_hours of ApplicationCases with status == LAB_BOOKED
        and matching bench_id and bench_date)
      admit new booking h iff occupied + h <= LAB_BENCH_DAILY_HOURS (8.0)   # boundary: == 8.0 admitted
      on record-result the booking leaves LAB_BOOKED, so its hours stop counting
      INVARIANT (compensating pair): a book-lab followed by its record-result leaves
      occupied(bench_id, bench_date) unchanged versus before the pair.
    input_set: "ApplicationCases currently in LAB_BOOKED"
    constants:
      LAB_BENCH_DAILY_HOURS: 8.0
    precision: "hours as decimal, exact <= comparison at 8.0"

  - name: phaseout_enforcement_sweep
    trigger: "PhaseOutProgram QUALIFYING -> ENFORCED"
    algorithm: constraint_propagation
    formula: |
      affected formulations = formulations having a FormulationComponent with
        substance_id == program.substance_id and concentration_ppm >= program.trigger_concentration_ppm
      target clearances = JurisdictionClearance rows with status == CLEARED whose formulation is
        affected and whose jurisdiction.code IN program.jurisdiction_codes
      process target clearances ordered by created_at ASC (tie-break: none needed, effects are independent):
        clearance -> SUSPENDED (cascade link 1), then link 2 and link 3 fire per the state machine
      The successor formulation's own clearances are never targeted: the successor is the
      reformulated replacement and is excluded from the affected set even if a component row
      matches (a successor is REQUIRED to be free of the trigger, enforced by the advance gate).
    input_set: "CLEARED clearances only; SUBMITTED/CHANGES_REQUESTED/SUSPENDED/REJECTED untouched"
    precision: "integer ppm, >= inclusive trigger"

  - name: counterfeit_confirmation_sweep
    trigger: "CounterfeitReport disposition = CONFIRMED_COUNTERFEIT"
    algorithm: constraint_propagation
    formula: |
      if report.implicated_converter_id is set:
        converter = that converter
        if converter.status == AUTHORIZED: converter -> SUSPENDED
        elif converter.status == SUSPENDED: converter -> REVOKED
        else (APPLIED/AUDIT_RECORDED/REVOKED): no converter transition
      order targets = orders with formulation_id == report.formulation_id and lot_code == report.lot_code
        and fulfillment_status != CANCELLED and compliance_status == CLEAR -> FLAGGED
      if the converter was suspended: additionally its in-flight orders
        (fulfillment IN {PENDING, ALLOCATED}, compliance CLEAR, any lot) -> FLAGGED
      selection order: created_at ASC; effects independent, order never changes the result set
    input_set: "as pinned above; terminal orders (SHIPPED via converter cascade excluded; SHIPPED via lot match included)"
    precision: "exact set membership"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins on conflict)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and non-empty", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "entity-backed role acts on its own resource: Converter role's X-User-ID equals the order/accrual converter_id; Distributor likewise", error_id: ERR_OWNERSHIP_VIOLATION, http_status: 403, applies_to: "POST /orders, POST /orders/{id}/advance, POST /orders/{id}/cancel, POST /rebate-accruals/{id}/claim" }
  - { priority: 4, category: auth, check: "segregation of duties: converter authorize X-User-ID != audited_by; rebate program activate X-User-ID != created_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /converters/{id}/authorize, POST /rebate-programs/{id}/advance (DRAFT->ACTIVE)" }
  - { priority: 5, category: existence, check: "request shape: required fields present, enum values valid, concentration_ppm > 0, quantity > 0, valid_from < valid_to, effective_from < effective_to, breakpoints sorted by min_qty asc with <= MAX_VOLUME_BREAKPOINTS entries, rebate_tiers sorted by threshold_qty asc with first threshold 0, exactly-one-of pairs not both-absent at the shape level", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 6, category: existence, check: "every id in path and body resolves to an existing entity", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path params or FK body fields" }
  - { priority: 7, category: state, check: "OCC: expected_<parent>_version equals the parent entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /formulations/{id}/successors, POST /converter-authorizations, POST /orders" }
  - { priority: 8, category: state, check: "target entity is in a state from which the requested transition exists (terminal states accept nothing); POST /rebate-accruals/{id}/claim on a non-FINALIZED accrual maps to the specialized ERR_ACCRUAL_NOT_FINALIZED at this same priority", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 9, category: business_safety, check: "clearance (re)submission: no component of the formulation references a PROHIBITED substance with concentration_ppm > 0", error_id: ERR_SUBSTANCE_PROHIBITED, http_status: 422, applies_to: "POST /clearances" }
  - { priority: 10, category: business_safety, check: "decision=CLEARED requires rank(disclosure_package_level) >= rank(required_disclosure_level)", error_id: ERR_DISCLOSURE_INSUFFICIENT, http_status: 422, applies_to: "POST /clearances/{id}/decision" }
  - { priority: 11, category: business_safety, check: "order creation requires a CLEARED JurisdictionClearance for (agreement.formulation_id, agreement.jurisdiction_id)", error_id: ERR_CLEARANCE_NOT_CLEARED, http_status: 409, applies_to: "POST /orders" }
  - { priority: 12, category: business_safety, check: "order advance requires compliance_status == CLEAR", error_id: ERR_ORDER_COMPLIANCE_BLOCKED, http_status: 409, applies_to: "POST /orders/{id}/advance" }
  - { priority: 13, category: business_temporal, check: "order creation: current clock within agreement's [effective_from, effective_to)", error_id: ERR_AGREEMENT_NOT_EFFECTIVE, http_status: 409, applies_to: "POST /orders" }
  - { priority: 14, category: business_temporal, check: "order on DISCONTINUED formulation: clock <= ltb_deadline AND requested_ship_date <= last_ship_date", error_id: ERR_LTB_WINDOW_CLOSED, http_status: 409, applies_to: "POST /orders" }
  - { priority: 15, category: business_temporal, check: "new ConverterAuthorization window must not overlap an existing one for the same (converter_id, capability, territory_code); half-open intervals, adjacency allowed", error_id: ERR_AUTHORIZATION_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /converter-authorizations" }
  - { priority: 16, category: business_temporal, check: "new PriceAgreement window must not overlap an existing one for the same buyer + formulation_id; half-open intervals, adjacency allowed", error_id: ERR_AGREEMENT_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /price-agreements" }
  - { priority: 17, category: business_constraint, check: "exactly one of converter_id / distributor_id set, and consistent with partner_type / tier / endpoint role", error_id: ERR_BUYER_AMBIGUOUS, http_status: 422, applies_to: "POST /price-agreements, POST /rebate-programs, POST /orders" }
  - { priority: 18, category: business_constraint, check: "converter must be AUTHORIZED to receive authorizations or to place converter orders", error_id: ERR_CONVERTER_NOT_AUTHORIZED, http_status: 409, applies_to: "POST /converter-authorizations, POST /orders (converter buyer)" }
  - { priority: 19, category: business_constraint, check: "converter order: an authorization must exist covering (converter, intended_capability, territory = agreement jurisdiction's code) with clock inside [valid_from, valid_to)", error_id: ERR_AUTHORIZATION_CAPABILITY_MISMATCH, http_status: 422, applies_to: "POST /orders (converter buyer)" }
  - { priority: 20, category: business_constraint, check: "converter authorize: quality_audit_score >= MIN_AUDIT_SCORE (75)", error_id: ERR_AUDIT_SCORE_INSUFFICIENT, http_status: 409, applies_to: "POST /converters/{id}/authorize" }
  - { priority: 21, category: business_constraint, check: "book-lab retest: failure_count < RETEST_MAX_FAILURES (2) when booking from CLOSED_FAIL", error_id: ERR_RETEST_LIMIT_EXCEEDED, http_status: 409, applies_to: "POST /application-cases/{id}/book-lab" }
  - { priority: 22, category: business_constraint, check: "POST /clearances: a live clearance (SUBMITTED or CLEARED) already exists for (formulation_id, jurisdiction_id); CHANGES_REQUESTED/SUSPENDED pairs resubmit instead", error_id: ERR_DUPLICATE_CLEARANCE, http_status: 409, applies_to: "POST /clearances" }
  - { priority: 23, category: business_constraint, check: "REFORMULATING -> QUALIFYING advance carries a successor_formulation_id whose successor_of_id is an affected formulation", error_id: ERR_PHASEOUT_SUCCESSOR_REQUIRED, http_status: 409, applies_to: "POST /phase-out-programs/{id}/advance" }
  - { priority: 24, category: business_constraint, check: "QUALIFYING -> ENFORCED: qualified_customer_count >= 2 AND successor holds CLEARED clearance in every jurisdiction_codes entry", error_id: ERR_QUALIFICATION_GATE_UNMET, http_status: 409, applies_to: "POST /phase-out-programs/{id}/advance" }
  - { priority: 25, category: business_fiscal, check: "distributor price agreement worst-case unit price >= channel floor (calc channel_price_floor)", error_id: ERR_CHANNEL_FLOOR_VIOLATION, http_status: 422, applies_to: "POST /price-agreements (distributor buyer)" }
  - { priority: 26, category: business_fiscal, check: "LTB allocate: formulation.ltb_pool_remaining >= order.quantity", error_id: ERR_LTB_POOL_EXHAUSTED, http_status: 409, applies_to: "POST /orders/{id}/advance (PENDING -> ALLOCATED, LTB orders)" }
  - { priority: 27, category: business_fiscal, check: "book-lab: occupied(bench_id, bench_date) + bench_hours <= LAB_BENCH_DAILY_HOURS (8.0)", error_id: ERR_BENCH_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /application-cases/{id}/book-lab" }
  - { priority: 28, category: business_fiscal, check: "accrual claim: program budget remaining covers final_amount_cents", error_id: ERR_REBATE_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /rebate-accruals/{id}/claim" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# Read (GET) endpoints are open to all 9 roles. Action endpoints name their role.
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical clock = payload current_utc"]

  - method: POST
    path: "/stewardship/jurisdictions"
    description: "Register a regulatory jurisdiction"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, declaration_threshold_ppm, full_disclosure_threshold_ppm, "review_sla_days?"]
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/stewardship/jurisdictions/{id}"
    description: "Get a jurisdiction"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: POST
    path: "/stewardship/substances"
    description: "Register a substance in the regulatory registry"
    roles: [PlatformAdmin]
    code: 201
    input: [cas_number, name, restriction_class]
    output: Substance
    side_effects: []

  - method: GET
    path: "/stewardship/substances/{id}"
    description: "Get a substance"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: Substance
    side_effects: []

  - method: POST
    path: "/stewardship/formulations"
    description: "Create a root formulation (status DRAFT, revision_number 1)"
    roles: [ProductManager]
    code: 201
    input: [product_code, name, base_polymer_family]
    output: Formulation
    side_effects: ["status=DRAFT, revision_number=1, successor_of_id=null"]

  - method: GET
    path: "/stewardship/formulations/{id}"
    description: "Get a formulation"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: Formulation
    side_effects: []

  - method: GET
    path: "/stewardship/formulations"
    description: "List formulations with filters and pagination"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: ["status?", "successor_of_id?", "limit?", "offset?"]
    output: Formulation[]
    side_effects: []

  - method: POST
    path: "/stewardship/formulations/{id}/successors"
    description: "Create a successor (reformulation) of the given formulation; OCC-guarded on the predecessor's version"
    roles: [ProductManager]
    code: 201
    input: [product_code, name, base_polymer_family, expected_formulation_version]
    output: Formulation
    side_effects:
      - "new row: status=DRAFT, revision_number = predecessor.revision_number + 1, successor_of_id = predecessor.id"
      - "increments predecessor Formulation.version by 1"

  - method: POST
    path: "/stewardship/formulations/{id}/discontinue"
    description: "Issue product change notification and open the last-time-buy window (ACTIVE -> DISCONTINUED)"
    roles: [ProductManager]
    code: 200
    input: [last_time_buy_deadline, last_ship_date, ltb_pool_quantity]
    output: Formulation
    side_effects:
      - "status -> DISCONTINUED; discontinued_at = clock; ltb_pool_remaining = ltb_pool_quantity"
      - "increments Formulation.version by 1"

  - method: POST
    path: "/stewardship/formulation-components"
    description: "Add a substance component to a DRAFT formulation"
    roles: [ProductManager]
    code: 201
    input: [formulation_id, substance_id, concentration_ppm]
    output: FormulationComponent
    side_effects: ["increments Formulation.version by 1 (content mutation)"]

  - method: GET
    path: "/stewardship/formulation-components/{id}"
    description: "Get a formulation component"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: FormulationComponent
    side_effects: []

  - method: GET
    path: "/stewardship/formulation-components"
    description: "List formulation components (FK reverse-reachability for formulation_id and substance_id)"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: ["formulation_id?", "substance_id?", "limit?", "offset?"]
    output: FormulationComponent[]
    side_effects: []

  - method: POST
    path: "/stewardship/clearances"
    description: "Submit a regulatory clearance dossier for (formulation, jurisdiction); resubmits when the pair's clearance is CHANGES_REQUESTED or SUSPENDED (200 then, 201 on first submission)"
    roles: [ProductManager]
    code: 201
    input: [formulation_id, jurisdiction_id, disclosure_package_level]
    output: JurisdictionClearance
    side_effects:
      - "first submission: status=SUBMITTED, submission_count=1, required_disclosure_level computed (calc required_disclosure_level)"
      - "resubmission: CHANGES_REQUESTED|SUSPENDED -> SUBMITTED, submission_count += 1, required_disclosure_level recomputed"

  - method: GET
    path: "/stewardship/clearances/{id}"
    description: "Get a clearance"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: JurisdictionClearance
    side_effects: []

  - method: GET
    path: "/stewardship/clearances"
    description: "List clearances with filters and pagination"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: ["formulation_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: JurisdictionClearance[]
    side_effects: []

  - method: POST
    path: "/stewardship/clearances/{id}/decision"
    description: "Regulatory decision on a SUBMITTED clearance"
    roles: [RegulatoryManager]
    code: 200
    input: [decision, "reviewer_note?"]
    output: JurisdictionClearance
    side_effects:
      - "decision=CLEARED: clearance -> CLEARED; formulation.active_clearance_count += 1; first CLEARED activates the formulation"
      - "decision=CHANGES_REQUESTED: -> CHANGES_REQUESTED; decision=REJECTED: -> REJECTED"

  - method: POST
    path: "/stewardship/converters"
    description: "Onboard a converter applicant (status APPLIED)"
    roles: [ChannelManager]
    code: 201
    input: [name, home_territory_code]
    output: Converter
    side_effects: ["status=APPLIED"]

  - method: GET
    path: "/stewardship/converters/{id}"
    description: "Get a converter"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: Converter
    side_effects: []

  - method: POST
    path: "/stewardship/converters/{id}/record-audit"
    description: "QualityAuditor records a quality-system audit (APPLIED -> AUDIT_RECORDED)"
    roles: [QualityAuditor]
    code: 200
    input: [audit_score, audit_standard]
    output: Converter
    side_effects: ["quality_audit_score/audit_standard set; audited_by = X-User-ID; status -> AUDIT_RECORDED"]

  - method: POST
    path: "/stewardship/converters/{id}/authorize"
    description: "ChannelManager authorizes an audited converter (AUDIT_RECORDED -> AUTHORIZED); auditor may not authorize (SoD)"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Converter
    side_effects: ["status -> AUTHORIZED"]

  - method: POST
    path: "/stewardship/converters/{id}/suspend"
    description: "Suspend an AUTHORIZED converter"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Converter
    side_effects: ["status -> SUSPENDED; cascade: in-flight orders (PENDING/ALLOCATED) of this converter -> compliance FLAGGED"]

  - method: POST
    path: "/stewardship/converters/{id}/reinstate"
    description: "Reinstate a SUSPENDED converter to AUTHORIZED (does not unflag orders)"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Converter
    side_effects: ["status -> AUTHORIZED"]

  - method: POST
    path: "/stewardship/distributors"
    description: "Onboard a distributor"
    roles: [ChannelManager]
    code: 201
    input: [name, home_territory_code]
    output: Distributor
    side_effects: []

  - method: GET
    path: "/stewardship/distributors/{id}"
    description: "Get a distributor"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: Distributor
    side_effects: []

  - method: POST
    path: "/stewardship/converter-authorizations"
    description: "Grant a capability+territory authorization window to an AUTHORIZED converter; OCC-guarded on Converter.version"
    roles: [ChannelManager]
    code: 201
    input: [converter_id, capability, territory_code, valid_from, valid_to, expected_converter_version]
    output: ConverterAuthorization
    side_effects: ["increments Converter.version by 1"]

  - method: GET
    path: "/stewardship/converter-authorizations/{id}"
    description: "Get a converter authorization"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: ConverterAuthorization
    side_effects: []

  - method: GET
    path: "/stewardship/converter-authorizations"
    description: "List converter authorizations with filters"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: ["converter_id?", "capability?", "territory_code?", "limit?", "offset?"]
    output: ConverterAuthorization[]
    side_effects: []

  - method: POST
    path: "/stewardship/application-cases"
    description: "Open a technical-service application engineering case (formulation must be ACTIVE)"
    roles: [TechnicalEngineer]
    code: 201
    input: [formulation_id, customer_ref, substrate_class, "application_description?"]
    output: ApplicationCase
    side_effects: ["status=OPEN, failure_count=0"]

  - method: GET
    path: "/stewardship/application-cases/{id}"
    description: "Get an application case"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: ApplicationCase
    side_effects: []

  - method: GET
    path: "/stewardship/application-cases"
    description: "List application cases with filters"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: ["formulation_id?", "status?", "limit?", "offset?"]
    output: ApplicationCase[]
    side_effects: []

  - method: POST
    path: "/stewardship/application-cases/{id}/book-lab"
    description: "Book lab bench time (OPEN -> LAB_BOOKED, or CLOSED_FAIL -> LAB_BOOKED retest)"
    roles: [TechnicalEngineer]
    code: 200
    input: [bench_id, bench_date, bench_hours]
    output: ApplicationCase
    side_effects: ["bench hours reserved (calc bench_daily_capacity)"]

  - method: POST
    path: "/stewardship/application-cases/{id}/record-result"
    description: "Record an adhesion test result; computed pass/fail closes the case (LAB_BOOKED -> CLOSED_PASS | CLOSED_FAIL)"
    roles: [TechnicalEngineer]
    code: 200
    input: [peel_strength_n_per_25mm, test_temp_c, test_standard]
    output: ApplicationCase
    side_effects: ["pass/fail computed (calc adhesion_pass_evaluation); failure_count += 1 on fail; bench hours released"]

  - method: POST
    path: "/stewardship/price-agreements"
    description: "Create a pricing agreement for a converter or distributor buyer in a jurisdiction"
    roles: [ChannelManager]
    code: 201
    input: [formulation_id, jurisdiction_id, "converter_id?", "distributor_id?", tier, base_price_cents, "volume_breakpoints?", effective_from, effective_to]
    output: PriceAgreement
    side_effects: []

  - method: GET
    path: "/stewardship/price-agreements/{id}"
    description: "Get a price agreement"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: PriceAgreement
    side_effects: []

  - method: GET
    path: "/stewardship/price-agreements"
    description: "List price agreements with filters"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: ["formulation_id?", "jurisdiction_id?", "converter_id?", "distributor_id?", "limit?", "offset?"]
    output: PriceAgreement[]
    side_effects: []

  - method: POST
    path: "/stewardship/orders"
    description: "Place an order under a price agreement; OCC-guarded on PriceAgreement.version"
    roles: [Converter, Distributor]
    code: 201
    input: [agreement_id, "converter_id?", "distributor_id?", quantity, requested_ship_date, "intended_capability?", "lot_code?", expected_price_agreement_version]
    output: Order
    side_effects:
      - "unit_price_cents / line_total_cents computed (calc order_unit_price); formulation_id and ship_to_jurisdiction_id denormalized from the agreement"
      - "fulfillment_status=PENDING, compliance_status=CLEAR; is_ltb_order computed"
      - "increments PriceAgreement.version by 1"

  - method: GET
    path: "/stewardship/orders/{id}"
    description: "Get an order"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/stewardship/orders"
    description: "List orders with filters and pagination"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: ["agreement_id?", "converter_id?", "distributor_id?", "formulation_id?", "ship_to_jurisdiction_id?", "flagged_by_report_id?", "fulfillment_status?", "compliance_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/stewardship/orders/{id}/advance"
    description: "Advance fulfillment PENDING -> ALLOCATED -> SHIPPED (target determined by current state)"
    roles: [Converter, Distributor]
    code: 200
    input: []
    output: Order
    side_effects:
      - "ALLOCATE: reserves LTB pool units when is_ltb_order"
      - "SHIP: shipped_at = clock; provisional rebate accrual recomputed on matching ACTIVE programs"

  - method: POST
    path: "/stewardship/orders/{id}/cancel"
    description: "Cancel a PENDING or ALLOCATED order"
    roles: [Converter, Distributor]
    code: 200
    input: []
    output: Order
    side_effects: ["ALLOCATED cancel: releases LTB pool units (calc ltb_pool_tracking compensation)"]

  - method: POST
    path: "/stewardship/rebate-programs"
    description: "Create a rebate program scoped to one converter or distributor partner"
    roles: [ChannelManager]
    code: 201
    input: [formulation_id, partner_type, "converter_id?", "distributor_id?", period_start, period_end, rebate_tiers, budget_cap_cents]
    output: RebateProgram
    side_effects: ["status=DRAFT; created_by = X-User-ID"]

  - method: GET
    path: "/stewardship/rebate-programs/{id}"
    description: "Get a rebate program"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: RebateProgram
    side_effects: []

  - method: GET
    path: "/stewardship/rebate-programs"
    description: "List rebate programs with filters"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: ["formulation_id?", "converter_id?", "distributor_id?", "status?", "limit?", "offset?"]
    output: RebateProgram[]
    side_effects: []

  - method: POST
    path: "/stewardship/rebate-programs/{id}/advance"
    description: "Advance program DRAFT -> ACTIVE -> CLOSED (target determined by current state)"
    roles: [FinanceController]
    code: 200
    input: []
    output: RebateProgram
    side_effects:
      - "DRAFT->ACTIVE: creates the partner's PROVISIONAL RebateAccrual"
      - "ACTIVE->CLOSED: finalizes the accrual (final variant of calc rebate_accrual_amount)"

  - method: GET
    path: "/stewardship/rebate-accruals/{id}"
    description: "Get a rebate accrual"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: RebateAccrual
    side_effects: []

  - method: GET
    path: "/stewardship/rebate-accruals"
    description: "List rebate accruals with filters"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: ["program_id?", "converter_id?", "distributor_id?", "status?", "limit?", "offset?"]
    output: RebateAccrual[]
    side_effects: []

  - method: POST
    path: "/stewardship/rebate-accruals/{id}/claim"
    description: "Partner claims a FINALIZED accrual (budget-gated)"
    roles: [Converter, Distributor]
    code: 200
    input: []
    output: RebateAccrual
    side_effects: ["status -> CLAIMED"]

  - method: POST
    path: "/stewardship/rebate-accruals/{id}/pay"
    description: "FinanceController pays a CLAIMED accrual"
    roles: [FinanceController]
    code: 200
    input: []
    output: RebateAccrual
    side_effects: ["status -> PAID; program.paid_out_cents += final_amount_cents"]

  - method: POST
    path: "/stewardship/phase-out-programs"
    description: "Announce a regulated-substance phase-out program"
    roles: [RegulatoryManager]
    code: 201
    input: [substance_id, jurisdiction_codes, trigger_concentration_ppm]
    output: PhaseOutProgram
    side_effects: ["status=ANNOUNCED; qualified_customers=[]"]

  - method: GET
    path: "/stewardship/phase-out-programs/{id}"
    description: "Get a phase-out program"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: PhaseOutProgram
    side_effects: []

  - method: GET
    path: "/stewardship/phase-out-programs"
    description: "List phase-out programs with filters"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: ["substance_id?", "successor_formulation_id?", "status?", "limit?", "offset?"]
    output: PhaseOutProgram[]
    side_effects: []

  - method: POST
    path: "/stewardship/phase-out-programs/{id}/advance"
    description: "Advance ANNOUNCED -> REFORMULATING -> QUALIFYING -> ENFORCED (target determined by current state)"
    roles: [RegulatoryManager]
    code: 200
    input: ["successor_formulation_id?"]
    output: PhaseOutProgram
    side_effects:
      - "REFORMULATING->QUALIFYING: stores successor_formulation_id"
      - "QUALIFYING->ENFORCED: enforcement sweep (calc phaseout_enforcement_sweep) cascades clearance suspension -> order flagging -> accrual exclusion recompute"

  - method: POST
    path: "/stewardship/phase-out-programs/{id}/record-qualification"
    description: "Record a customer's qualification of the successor formulation (program must be QUALIFYING)"
    roles: [TechnicalEngineer]
    code: 200
    input: [customer_ref, samples_passed]
    output: PhaseOutProgram
    side_effects:
      - "if samples_passed >= QUALIFICATION_MIN_SAMPLES (3): customer_ref appended to qualified_customers (duplicate customer_ref -> ERR_INVALID_REQUEST); qualified_customer_count recomputed"
      - "if samples_passed < 3: no mutation (200 with unchanged program)"

  - method: POST
    path: "/stewardship/counterfeit-reports"
    description: "Report suspected counterfeit product in a secondary channel"
    roles: [Converter, Distributor, QualityAuditor]
    code: 201
    input: [formulation_id, lot_code, channel_description, "implicated_converter_id?"]
    output: CounterfeitReport
    side_effects: ["status=REPORTED; reporter_role = X-User-Role"]

  - method: GET
    path: "/stewardship/counterfeit-reports/{id}"
    description: "Get a counterfeit report"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: []
    output: CounterfeitReport
    side_effects: []

  - method: GET
    path: "/stewardship/counterfeit-reports"
    description: "List counterfeit reports with filters"
    roles: [PlatformAdmin, ProductManager, RegulatoryManager, ChannelManager, QualityAuditor, TechnicalEngineer, FinanceController, Converter, Distributor]
    code: 200
    input: ["formulation_id?", "implicated_converter_id?", "status?", "limit?", "offset?"]
    output: CounterfeitReport[]
    side_effects: []

  - method: POST
    path: "/stewardship/counterfeit-reports/{id}/disposition"
    description: "QualityAuditor dispositions a REPORTED report (terminal); CONFIRMED fires the counterfeit sweep"
    roles: [QualityAuditor]
    code: 200
    input: [outcome, "investigator_note?"]
    output: CounterfeitReport
    side_effects: ["outcome=CONFIRMED_COUNTERFEIT: calc counterfeit_confirmation_sweep (converter suspension/revocation, order flagging, accrual exclusion recompute); CLEARED_GENUINE/INCONCLUSIVE: release flags owned by this report"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing/empty" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed role acts on a resource owned by a different partner id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user performs both sides of a segregated step (audit vs authorize; program create vs activate)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, non-positive quantity/concentration, malformed window (from >= to), unsorted breakpoints/tiers, over-long breakpoint array, duplicate qualification customer_ref, duplicate (formulation, substance) component" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body id does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state that allows the requested transition (including terminal-state lockdown)" }
  - { id: ERR_SUBSTANCE_PROHIBITED, http: 422, condition: "Clearance submission for a formulation containing a PROHIBITED substance at > 0 ppm" }
  - { id: ERR_DISCLOSURE_INSUFFICIENT, http: 422, condition: "decision=CLEARED but disclosure_package_level ranks below required_disclosure_level" }
  - { id: ERR_DUPLICATE_CLEARANCE, http: 409, condition: "A live (SUBMITTED or CLEARED) clearance already exists for the (formulation, jurisdiction) pair" }
  - { id: ERR_AUDIT_SCORE_INSUFFICIENT, http: 409, condition: "authorize with quality_audit_score < 75" }
  - { id: ERR_CONVERTER_NOT_AUTHORIZED, http: 409, condition: "Converter not AUTHORIZED (authorization grant or converter order placement)" }
  - { id: ERR_AUTHORIZATION_WINDOW_OVERLAP, http: 409, condition: "Authorization window overlaps an existing one for the same (converter, capability, territory); half-open, adjacency allowed" }
  - { id: ERR_AUTHORIZATION_CAPABILITY_MISMATCH, http: 422, condition: "No authorization covers the order's (converter, intended_capability, territory) at order time" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "Price agreement window overlaps an existing one for the same buyer + formulation; half-open" }
  - { id: ERR_AGREEMENT_NOT_EFFECTIVE, http: 409, condition: "Order clock outside the agreement's [effective_from, effective_to) window" }
  - { id: ERR_CHANNEL_FLOOR_VIOLATION, http: 422, condition: "Distributor agreement's worst-case unit price below the channel floor derived from converter agreements" }
  - { id: ERR_BUYER_AMBIGUOUS, http: 422, condition: "Both or neither of converter_id / distributor_id set, or inconsistent with partner_type/tier/role" }
  - { id: ERR_CLEARANCE_NOT_CLEARED, http: 409, condition: "Order creation without a CLEARED clearance for (formulation, ship-to jurisdiction)" }
  - { id: ERR_LTB_WINDOW_CLOSED, http: 409, condition: "Order on DISCONTINUED formulation with clock > ltb_deadline or requested_ship_date > last_ship_date" }
  - { id: ERR_LTB_POOL_EXHAUSTED, http: 409, condition: "LTB allocate would drive ltb_pool_remaining negative" }
  - { id: ERR_ORDER_COMPLIANCE_BLOCKED, http: 409, condition: "Advance attempted on a FLAGGED order" }
  - { id: ERR_BENCH_CAPACITY_EXCEEDED, http: 409, condition: "Booking would push the (bench, date) total over 8.0 hours" }
  - { id: ERR_RETEST_LIMIT_EXCEEDED, http: 409, condition: "Retest booking with failure_count >= 2" }
  - { id: ERR_ACCRUAL_NOT_FINALIZED, http: 409, condition: "Claim attempted before the parent program closed (accrual not FINALIZED)" }
  - { id: ERR_REBATE_BUDGET_EXCEEDED, http: 422, condition: "Claim exceeds the program's remaining budget cap" }
  - { id: ERR_PHASEOUT_SUCCESSOR_REQUIRED, http: 409, condition: "REFORMULATING -> QUALIFYING advance without a valid successor_formulation_id" }
  - { id: ERR_QUALIFICATION_GATE_UNMET, http: 409, condition: "QUALIFYING -> ENFORCED without >= 2 qualified customers or without successor clearances in every program jurisdiction" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns clock, jurisdiction and substance reference data"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /stewardship/jurisdictions"
      - "POST /stewardship/substances"
    shared_operations: ["all GET endpoints"]

  - name: ProductManager
    description: "Owns formulation lifecycle: creation, components, successors, discontinuation, clearance submission"
    identity: opaque
    exclusive_operations:
      - "POST /stewardship/formulations"
      - "POST /stewardship/formulations/{id}/successors"
      - "POST /stewardship/formulations/{id}/discontinue"
      - "POST /stewardship/formulation-components"
      - "POST /stewardship/clearances"
    shared_operations: ["all GET endpoints"]

  - name: RegulatoryManager
    description: "Decides clearances; owns phase-out programs"
    identity: opaque
    exclusive_operations:
      - "POST /stewardship/clearances/{id}/decision"
      - "POST /stewardship/phase-out-programs"
      - "POST /stewardship/phase-out-programs/{id}/advance"
    shared_operations: ["all GET endpoints"]

  - name: ChannelManager
    description: "Owns partner onboarding/authorization and pricing/rebate program creation"
    identity: opaque
    exclusive_operations:
      - "POST /stewardship/converters"
      - "POST /stewardship/converters/{id}/authorize"
      - "POST /stewardship/converters/{id}/suspend"
      - "POST /stewardship/converters/{id}/reinstate"
      - "POST /stewardship/distributors"
      - "POST /stewardship/converter-authorizations"
      - "POST /stewardship/price-agreements"
      - "POST /stewardship/rebate-programs"
    shared_operations: ["all GET endpoints"]

  - name: QualityAuditor
    description: "Records converter audits and dispositions counterfeit reports; barred from authorizing the converters it audited (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /stewardship/converters/{id}/record-audit"
      - "POST /stewardship/counterfeit-reports/{id}/disposition"
    shared_operations: ["all GET endpoints", "POST /stewardship/counterfeit-reports"]

  - name: TechnicalEngineer
    description: "Runs application engineering cases, lab bookings, adhesion results, qualification records"
    identity: opaque
    exclusive_operations:
      - "POST /stewardship/application-cases"
      - "POST /stewardship/application-cases/{id}/book-lab"
      - "POST /stewardship/application-cases/{id}/record-result"
      - "POST /stewardship/phase-out-programs/{id}/record-qualification"
    shared_operations: ["all GET endpoints"]

  - name: FinanceController
    description: "Activates/closes rebate programs and pays claimed accruals; barred from activating programs it created (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /stewardship/rebate-programs/{id}/advance"
      - "POST /stewardship/rebate-accruals/{id}/pay"
    shared_operations: ["all GET endpoints"]

  - name: Converter
    description: "Authorized converter partner; places converter orders, claims its accruals, reports counterfeits"
    identity: "entity_backed:Converter"
    exclusive_operations: []
    shared_operations:
      - "all GET endpoints"
      - "POST /stewardship/orders (as converter buyer; converter_id must equal X-User-ID)"
      - "POST /stewardship/orders/{id}/advance and /cancel (own orders only)"
      - "POST /stewardship/rebate-accruals/{id}/claim (own accruals only)"
      - "POST /stewardship/counterfeit-reports"

  - name: Distributor
    description: "Distributor partner; places distributor orders, claims its accruals, reports counterfeits"
    identity: "entity_backed:Distributor"
    exclusive_operations: []
    shared_operations:
      - "all GET endpoints"
      - "POST /stewardship/orders (as distributor buyer; distributor_id must equal X-User-ID)"
      - "POST /stewardship/orders/{id}/advance and /cancel (own orders only)"
      - "POST /stewardship/rebate-accruals/{id}/claim (own accruals only)"
      - "POST /stewardship/counterfeit-reports"
