          rationale: "The reactivation branch is asserted by the named §1.8 instance and again by the §1.9 validations instance reactivation_is_refused_for_a_ce_deficit_before_the_fee_is_ever_checked; the transfer branch of the same rule is asserted by the §1.9 validations instance a_ce_deficient_licensee_cannot_transfer_and_the_transfer_revokes_the_team_name."

  - section: rbac
    instances:
      - name: a_call_missing_x_user_headers_is_unauthenticated_before_any_path_id_resolves
        claim_type: role_negative
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=4]
        distinguishing_aspect: |
          Priority 1 is the first rung of the whole ladder, so an anonymous call against a
          NON-EXISTENT id must still answer 401 ERR_UNAUTHENTICATED and never 404: an implementation
          that resolves the path before authenticating leaks existence. Three distinct header defects
          all collapse to the same error - no headers at all, an X-User-Role that is not one of the
          nine declared roles, and a well-formed role with the X-User-ID header omitted.
        test_recipe:
          setup:
            - "an empty system; no row of any kind is needed for a priority-1 refusal"
          setup_api_calls: []
          trigger:
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Nia Ghost", prelicense_hours: 90 }
              as: "NONE (neither X-User-Role nor X-User-ID is sent)"
              captures: { e1: $.data.error_id }
            - call: "GET /commission/licensees/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: "NONE (neither X-User-Role nor X-User-ID is sent)"
              captures: { e2: $.data.error_id }
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Nia Ghost", prelicense_hours: 90 }
              as: "Notary (X-User-Role: Notary - not one of the nine roles of §1.7)"
              as_user_id: "notary-01"
              captures: { e3: $.data.error_id }
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Nia Ghost", prelicense_hours: 90 }
              as: "LicensingAnalyst (X-User-Role sent, X-User-ID header omitted)"
              captures: { e4: $.data.error_id }
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Nia Ghost", prelicense_hours: 90 }
              as: LicensingAnalyst
              as_user_id: "analyst-01"
              captures: { nia_id: $.data.id }
          assert:
            - "the headerless write returns 401 with ${e1} == ERR_UNAUTHENTICATED"
            - "the headerless read of a non-existent uuid returns 401 with ${e2} == ERR_UNAUTHENTICATED, NOT 404 ERR_LICENSEE_NOT_FOUND: priority 1 outranks the existence rule at priority 4"
            - "the undeclared role returns 401 with ${e3} == ERR_UNAUTHENTICATED, not 403 ERR_FORBIDDEN_ROLE: an unrecognised role fails authentication before the endpoint's roles list is consulted at priority 2"
            - "the role-without-user-id call returns 401 with ${e4} == ERR_UNAUTHENTICATED: both headers are required on every endpoint, including the ones whose §1.4 rules never read the user id"
            - "the same body with both headers present returns 201 and ${nia_id} is a fresh licensee, so all four refusals were header defects and nothing else"
            - "GET /commission/licensees as LicensingAnalyst returns total_count == 1: none of the four refused writes created a row"
      - name: an_exclusive_operation_of_a_neighbouring_role_is_refused_at_priority_two
        claim_type: role_negative
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_ROLE
          - roles.TrustAuditor
          - roles.CommissionCounsel
          - roles.RecoveryFundTrustee
          - roles.Public
        distinguishing_aspect: |
          The four commission-side roles are peers, not a hierarchy: each holds exclusive operations
          the other three cannot perform, and there is no super-role. The instance proves the
          exclusion in both directions on adjacent operations of the SAME complaint - counsel may
          dispose it but may not amend it, and Public may amend it but may not dispose it - which no
          "admin can do anything" implementation survives.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising and Sam Reed ACTIVE"
            - "a MISREPRESENTATION complaint against Sam Reed is in INTAKE"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "no trust account required" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Sam Reed", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { sam_id: $.data.id }
            - call: "POST /commission/licensees/${sam_id}/exam-results"
              payload: { score: 84, taken_on: "2026-07-05" }
              as: LicensingAnalyst
            - call: "GET /commission/brokerages/${bkg_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { bkg_v2: $.data.version }
            - call: "POST /commission/licensees/${sam_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v2}" }
              as: LicensingAnalyst
          trigger:
            - call: "POST /commission/complaints"
              payload: { complainant_name: "Pat Buyer", respondent_licensee_id: "${sam_id}", allegation_type: "MISREPRESENTATION", alleged_loss_cents: 300000 }
              as: Public
              as_user_id: "public-pat"
              captures: { cmp_id: $.data.id }
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Ivy Auditor", prelicense_hours: 90 }
              as: TrustAuditor
              as_user_id: "auditor-09"
              captures: { e1: $.data.error_id }
            - call: "POST /commission/complaints/${cmp_id}/disposition"
              payload: { disposition: "INVESTIGATE", investigator_user_id: "trustee-03" }
              as: RecoveryFundTrustee
              as_user_id: "trustee-03"
              captures: { e2: $.data.error_id }
            - call: "POST /commission/recovery-fund/appropriations"
              payload: { amount_cents: 1000000, appropriation_note: "counsel tries the trustee's channel" }
              as: CommissionCounsel
              as_user_id: "counsel-05"
              captures: { e3: $.data.error_id }
            - call: "POST /commission/complaints/${cmp_id}/amendments"
              payload: { amendment_note: "counsel tries the complainant's channel", amended_alleged_loss_cents: 400000 }
              as: CommissionCounsel
              as_user_id: "counsel-05"
              captures: { e4: $.data.error_id }
            - call: "POST /commission/complaints/${cmp_id}/amendments"
              payload: { amendment_note: "the complainant amends the loss", amended_alleged_loss_cents: 400000 }
              as: Public
              as_user_id: "public-pat"
            - call: "POST /commission/complaints/${cmp_id}/disposition"
              payload: { disposition: "INVESTIGATE", investigator_user_id: "counsel-05" }
              as: CommissionCounsel
              as_user_id: "counsel-05"
          assert:
            - "intake by Public returns 201: POST /commission/complaints is a shared operation of Public, LicensingAnalyst and CommissionCounsel, so the same body works for all three"
            - "the TrustAuditor attempting to create a licensee returns 403 with ${e1} == ERR_FORBIDDEN_ROLE - 'create licensee' is an exclusive operation of LicensingAnalyst"
            - "the RecoveryFundTrustee attempting a complaint disposition returns 403 with ${e2} == ERR_FORBIDDEN_ROLE even though the payload is otherwise the exact body that succeeds two calls later"
            - "the CommissionCounsel attempting an appropriation returns 403 with ${e3} == ERR_FORBIDDEN_ROLE - the peer exclusion runs the other way too, there is no hierarchical override"
            - "the CommissionCounsel attempting an amendment returns 403 with ${e4} == ERR_FORBIDDEN_ROLE: on the very same complaint counsel owns the disposition channel and Public owns the amendment channel"
            - "the Public amendment returns 200 with amendment_count == 1 and alleged_loss_cents == 400000"
            - "the counsel disposition then returns 200 with status == INVESTIGATION and investigator_user_id == counsel-05"
            - "GET /commission/licensees as LicensingAnalyst still returns total_count == 2 and GET /commission/recovery-fund still returns appropriated_cents == 0: not one of the four 403s had a side effect"
      - name: an_entity_backed_role_may_not_act_on_another_persons_record
        claim_type: role_ownership
        grounds:
          - validations[priority=6]
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.Salesperson
          - roles.Respondent
          - roles.ProviderAdmin
        distinguishing_aspect: |
          Priority 6 sits BELOW priority 2, so the two refusals are distinguishable and both must be
          reproduced: a Salesperson reaching for a LicensingAnalyst-exclusive endpoint gets
          ERR_FORBIDDEN_ROLE, while a Salesperson reaching for another salesperson's own-status
          endpoint - an endpoint their role IS listed on - gets ERR_NOT_RESOURCE_OWNER. Ownership is
          resolved from three different places: the path segment (Salesperson), the parent chain
          (Respondent -> SanctionOrder.respondent_licensee_id) and a stored owner id
          (ProviderAdmin -> EducationProvider.admin_user_id).
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising, Sam Reed ACTIVE and Rae Nunez ACTIVE"
            - "a FINE consent order of 500000 cents against Sam Reed is ISSUED"
