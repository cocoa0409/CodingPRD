      - name: return_window_member_vs_nonmember
        claim_type: conditional_validation
        grounds: ["validations[priority=13]", "errors[ERR_RETURN_WINDOW_EXPIRED]"]
        distinguishing_aspect: "At 45 days after completion, a member (90-day window) return succeeds while a non-member (30-day window) return on an identical sale is rejected."
