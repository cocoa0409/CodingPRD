        distinguishing_aspect: "The claim response itself must already carry assessed_amount 1234.60, and reads taken straight afterwards must show bond obligated 1276.35 / available 48723.65, carrier sanction_points 2.0 and the new INCREASE_LD ledger entry — no lag anywhere."
        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00; M1 filed 2026-08-01 and departed."
