              as: PlatformAdmin
              captures: { err_code: $.data.error_id }
          assert:
            - "${err_code} == ERR_TERRITORY_CODE_TAKEN at HTTP 409"
            - "Territory.${terr_de_id}.name == Germany and market_tier == 1 and base_value_index == 1.20"
            - "GET /film-sales/territories returns total_count == 1"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: market_planned_to_open_is_a_valid_transition_that_bumps_version
        claim_type: valid_transition
        grounds:
          - state_machines.Market.transitions.PLANNED_to_OPEN
          - "endpoints[POST /film-sales/markets/{id}/state]"
        distinguishing_aspect: |
          POST /film-sales/markets/{id}/state with to_status=OPEN moves a PLANNED market to OPEN and
          increments Market.version from 1 to exactly 2 — the transition's only declared side effect.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one PLANNED market EFM Berlin 2027-02-11 -> 2027-02-17 with 3 rooms and 4 tables."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/markets"
              payload: { name: "EFM Berlin", city: "Berlin", start_date: "2027-02-11T00:00:00Z", end_date: "2027-02-17T00:00:00Z", screening_room_count: 3, meeting_table_count: 4 }
              as: PlatformAdmin
              captures: { market_id: $.data.id }
          trigger:
            - call: "POST /film-sales/markets/${market_id}/state"
              payload: { to_status: "OPEN" }
              as: PlatformAdmin
              captures: { market_v: $.data.version }
          assert:
            - "HTTP 200 and Market.${market_id}.status == OPEN"
            - "${market_v} == 2"
            - "Market.${market_id}.screening_room_count == 3 and meeting_table_count == 4 unchanged"

      - name: film_development_to_packaging_requires_an_executed_agency_agreement
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Film.transitions.DEVELOPMENT_to_PACKAGING
          - state_machines.SalesAgencyAgreement.transitions.DRAFT_to_EXECUTED
          - errors.ERR_INVALID_STATE
          - validations[priority=50]
        distinguishing_aspect: |
          With the film's only SalesAgencyAgreement still DRAFT the PACKAGING transition returns
          ERR_INVALID_STATE at 409 and the film stays DEVELOPMENT at version 1; executing the same
          agreement (which also stamps executed_by_user_id and computes term_end_date
          2028-08-01T00:00:00Z from 24 calendar months) makes the identical call succeed.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one film with one DRAFT agency agreement (commission_pct 0.10, expense_cap 75000.00, 24 months from 2026-08-01)."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/films/${film_id}/agency-agreements"
              payload: { commission_pct: 0.10, expense_cap_usd: 75000.00, term_months: 24, term_start_date: "2026-08-01T00:00:00Z" }
              as: HeadOfSales
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "PACKAGING" }
              as: PlatformAdmin
              captures: { err_pre: $.data.error_id }
            - call: "POST /film-sales/agency-agreements/${agr_id}/state"
              payload: { to_status: "EXECUTED" }
              as: HeadOfSales
              as_user_id: "hos-signer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "PACKAGING" }
              as: PlatformAdmin
              captures: { film_v_after: $.data.version }
          assert:
            - "${err_pre} == ERR_INVALID_STATE at HTTP 409"
            - "immediately after the failed call Film.${film_id}.sales_status == DEVELOPMENT and version == 1"
            - "SalesAgencyAgreement.${agr_id}.status == EXECUTED with executed_by_user_id == hos-signer-1"
            - "SalesAgencyAgreement.${agr_id}.term_end_date == 2028-08-01T00:00:00Z"
            - "Film.${film_id}.sales_status == PACKAGING and ${film_v_after} == 2"

      - name: contract_initial_state_is_offered_pending_unpaid_on_all_three_axes
        claim_type: initial_state
        grounds:
          - state_machines.PreSaleContract.initial_state
          - entities.PreSaleContract.fields.negotiation_round
          - entities.PreSaleContract.fields.milestone_pct_total
