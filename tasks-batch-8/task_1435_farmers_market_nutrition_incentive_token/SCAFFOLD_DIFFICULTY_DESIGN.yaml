  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: market_day_half_open_window_abutment_vs_overlap
        grounds:
          - validations[priority=23]
          - entities.MarketDay.fields.opens_at
        distinguishing_aspect: |
          Half-open interval semantics on the MarketDay resource: [14:00,20:00) ABUTTING an existing
          [08:00,14:00) window is legal (touching endpoints do not intersect), while [13:00,15:00) overlaps
          and is rejected — geometric adjacency is the whole test.
        test_recipe:
          setup:
            - "Program + market exist; day1 window [2026-08-01T08:00, 2026-08-01T14:00) already scheduled"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day1: $.data.id } }
          trigger:
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T14:00:00Z", closes_at: "2026-08-01T20:00:00Z" }, as: MarketManager, captures: { day2: $.data.id } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T13:00:00Z", closes_at: "2026-08-01T15:00:00Z" }, as: MarketManager, captures: { err: $.data.error_id } }
          assert:
            - "abutting window [14:00,20:00) CREATED (201) — half-open: closes_at == opens_at is not an overlap"
            - "overlapping window [13:00,15:00) rejected ERR_MARKET_DAY_OVERLAP (409)"

      - name: serial_range_closed_interval_endpoint_sharing_vs_adjacency
        grounds:
          - validations[priority=24]
          - entities.TokenBatch.fields.serial_start
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (TokenBatch serial space, program-wide):
          integer CLOSED ranges — sharing the endpoint serial (100100) IS a conflict, while strict adjacency
          (100101 follows 100100) is legal. Mirror-image geometry vs the half-open market-day rule.
        test_recipe:
          setup:
            - "Program + market exist; batch A serials [100001, 100100] registered (SEALED)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { bA: $.data.id } }
          trigger:
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100100, serial_end: 100200 }, as: ProgramAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100101, serial_end: 100200 }, as: ProgramAdmin, captures: { bC: $.data.id } }
          assert:
            - "[100100,100200] rejected ERR_SERIAL_RANGE_OVERLAP (closed range: shared endpoint 100100 collides)"
            - "[100101,100200] CREATED (201) — strict adjacency legal"

      - name: serial_overlap_scope_is_program_wide_across_markets
        grounds:
          - validations[priority=24]
          - entities.TokenBatch.fields.market_id
        distinguishing_aspect: |
          Same closed-interval rule but the SCOPE is the program, not the market: a batch at market B whose
          range intersects market A's batch is still rejected when both markets belong to one program.
        test_recipe:
          setup:
            - "Program with TWO markets; batch [100001,100100] at market A"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M-A", city: "C" }, as: ProgramAdmin, captures: { mktA: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M-B", city: "C" }, as: ProgramAdmin, captures: { mktB: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mktA}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { bA: $.data.id } }
          trigger:
            - { call: "POST /token-batches", payload: { market_id: "${mktB}", kind: "MATCH", denomination_cents: 100, serial_start: 100050, serial_end: 100300 }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "cross-market intersecting range rejected ERR_SERIAL_RANGE_OVERLAP — scope is the whole program"

  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: issuance_void_restores_match_pool_exactly
        grounds:
          - state_machines.Issuance.ACTIVE_to_VOIDED
          - calculations.match_computation
          - entities.Program.fields.match_pool_remaining_cents
        distinguishing_aspect: |
          Conserved FISCAL quantity: Program.match_pool_remaining_cents == budget - sum(match over ACTIVE
          issuances). Forward issuance (charge 1200 -> match 1200, pool 98800) followed by its compensating
          void returns the pool to exactly 100000 with shopper season usage back to 0 — zero drift.
        test_recipe:
          setup:
            - "Base setup; issuance charge 1200 (match 1200) while day OPEN; nothing redeemed"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 1200, expected_shopper_version: "${shop_v}" }, as: BoothOperator, captures: { iss: $.data.id, m: $.data.match_cents } }
            - { call: "GET /programs/${prog}", payload: {}, as: ProgramAdmin, captures: { pool_mid: $.data.match_pool_remaining_cents } }
          trigger:
            - { call: "POST /issuances/${iss}/void", payload: {}, as: BoothOperator }
          assert:
            - "mid-state: match_cents == 1200 and pool == 98800"
            - "after void: Program.match_pool_remaining_cents == 100000 (budget - 0 active match)"
            - "after void: Shopper.season_match_used_cents == 0"
            - "after void: all tokens of ${iss} VOIDED; MarketDay.issued_value_cents == 0"

      - name: redeem_reverse_conserves_issued_unit_count
        grounds:
          - state_machines.Token.ISSUED_to_REDEEMED
          - state_machines.Token.REDEEMED_to_ISSUED
        distinguishing_aspect: |
          Conserved UNIT COUNT (different quantity type than pool cents): the number of tokens in status
          ISSUED for the issuance. Redeem (6 -> 5 issued) followed by reverse-redemption restores exactly 6;
          day redeemed_value 0 -> 100 -> 0 with no residual.
        test_recipe:
          setup:
            - "Base setup; issuance charge 300 -> 6 tokens ISSUED (3 base-100 + 3 match-100)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
            - { call: "POST /vendors", payload: { market_id: "${mkt}", legal_name: "V", stall_number: "S1" }, as: ProgramAdmin, captures: { vend: $.data.id } }
            - { call: "POST /vendors/${vend}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 300, expected_shopper_version: "${shop_v}" }, as: BoothOperator, captures: { iss: $.data.id } }
            - { call: "GET /tokens", payload: { issuance_id: "${iss}" }, as: BoothOperator, captures: { t0: "$.data[0].id", t0_sn: "$.data[0].serial_number" } }
          trigger:
            - { call: "POST /tokens/redeem", payload: { serial_number: "${t0_sn}" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /tokens/${t0}/reverse-redemption", payload: {}, as: Vendor, as_user_id: "${vend}" }
          assert:
            - "after redeem: count(tokens of ${iss} with status ISSUED) == 5 and MarketDay.redeemed_value_cents == 100"
            - "after reverse: count(tokens of ${iss} with status ISSUED) == 6 (conserved) and Token.${t0}.status == ISSUED"
            - "after reverse: MarketDay.redeemed_value_cents == 0 and Token.${t0}.redeemed_vendor_id == null"

      - name: approve_then_settle_conserves_zero_net_payable
        grounds:
          - state_machines.RedemptionSubmission.VERIFIED_to_APPROVED
          - state_machines.RedemptionSubmission.APPROVED_to_PAID
          - entities.Vendor.fields.payable_cents
        distinguishing_aspect: |
          Conserved payable-balance quantity (third distinct quantity): Vendor.payable_cents ==
          approved-but-unpaid total; approve (+195) then settlement (-195) returns the vendor to exactly 0,
          and Program.paid_out_cents + total outstanding payable increases monotonically without drift.
        test_recipe:
          setup:
            - "Base setup; charge 200 flow; submission APPROVED at 195 (vendor payable 195)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
            - { call: "POST /vendors", payload: { market_id: "${mkt}", legal_name: "V", stall_number: "S1" }, as: ProgramAdmin, captures: { vend: $.data.id } }
            - { call: "POST /vendors/${vend}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 200, expected_shopper_version: "${shop_v}" }, as: BoothOperator, captures: { iss: $.data.id } }
            - { call: "GET /tokens", payload: { issuance_id: "${iss}" }, as: BoothOperator, captures: { t0: "$.data[0].id", t0_sn: "$.data[0].serial_number", t1: "$.data[1].id", t1_sn: "$.data[1].serial_number" } }
            - { call: "POST /tokens/redeem", payload: { serial_number: "${t0_sn}" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /tokens/redeem", payload: { serial_number: "${t1_sn}" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /redemption-submissions", payload: { market_day_id: "${day}", token_ids: ["${t0}", "${t1}"] }, as: Vendor, as_user_id: "${vend}", captures: { sub: $.data.id } }
            - { call: "POST /market-days/${day}/close", payload: {}, as: MarketManager }
            - { call: "POST /redemption-submissions/${sub}/verify", payload: { outcome: "VERIFIED" }, as: MarketManager }
            - { call: "POST /redemption-submissions/${sub}/decide", payload: { outcome: "APPROVED" }, as: ProgramAdmin }
            - { call: "GET /vendors/${vend}", payload: {}, as: ProgramAdmin, captures: { pay_mid: $.data.payable_cents } }
            - { call: "GET /programs/${prog}", payload: {}, as: ProgramAdmin, captures: { prog_v: $.data.version } }
          trigger:
            - { call: "POST /settlement-runs", payload: { program_id: "${prog}", cutoff_at: "2026-08-31T23:59:59Z", expected_program_version: "${prog_v}" }, as: ProgramAdmin }
          assert:
            - "mid-state: Vendor.payable_cents == 195 (approved, unpaid)"
            - "after sweep: Vendor.payable_cents == 0 (195 - 195; net-zero conservation)"
            - "Program.paid_out_cents == 195; sum(vendor payables) + paid_out == sum(approved amounts) with no drift"
