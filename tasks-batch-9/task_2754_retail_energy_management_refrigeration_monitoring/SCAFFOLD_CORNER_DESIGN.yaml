          measurement period and an install date in the future - and both must
          fire BEFORE any of the M&V arithmetic runs, so the project stays
          APPROVED with adjusted_baseline_kwh, measured_savings_kwh and
          realization_rate all null and the store's savings ledger untouched.
          The 60-day boundary is inclusive, which the admitted 60-day retry
          proves.
