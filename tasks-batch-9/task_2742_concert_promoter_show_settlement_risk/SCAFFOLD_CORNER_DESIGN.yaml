            - "ONE SEAT PAST THE CEILING IS REFUSED WITH NO PARTIAL WRITE — ${rt_err_comp_1} == ERR_COMP_ALLOWANCE_EXCEEDED with HTTP 422 and ${rt_comp_b} == 3, unchanged"
            - "THE CEILING COUNTS COMPS ONLY — the five-seat ARTIST_HOLD is admitted at ${rt_h5_status} == HELD even though comps are at the ceiling, because a non-COMP hold does not consume comp allowance"
            - "THE SAME CEILING IS RE-CHECKED AT CONVERSION, NOT ONLY AT CREATION — ${rt_err_comp_2} == ERR_COMP_ALLOWANCE_EXCEEDED 422 for the conversion that would take comps from 3 to 8; an implementation that guards only POST /ticket-holds papers the house past its allowance through the back door"
            - "RELEASING A COMP RESETS THE HEADROOM — ${rt_c2_status} == RELEASED drops comps to 2, the re-issued comp then succeeds at ${rt_c3_status} == HELD, and the tier closes at ${rt_comp_c} == 3, ${rt_held_c} == 5 and ${rt_avail_c} == 92 (100 == 0 sold + 3 comp + 5 held + 92 available)"
            - "THE TOLERANCE GATE IS INSTANTANEOUS AND INCLUSIVE — line 1 at ${rt_l1_pct} == 10.00 is ${rt_l1_vstatus} == WITHIN_TOLERANCE with ${rt_l1_role} == NONE and ${rt_l1_exp} == 11000 (the ACTUAL is recognised), while line 2 at ${rt_l2_pct} == 10.01, one cent further out, is ${rt_l2_vstatus} == PENDING_APPROVAL with ${rt_l2_role} == TOUR_ACCOUNTANT and ${rt_l2_exp} == 10000 (recognition falls back to BUDGETED)"
            - "THE ESCALATION GATE IS INSTANTANEOUS AND INCLUSIVE TOO — line 3 at ${rt_l3_pct} == 25.00 keeps ${rt_l3_role} == TOUR_ACCOUNTANT while line 4 at ${rt_l4_pct} == 25.01 escalates to ${rt_l4_role} == RISK_OFFICER; both are PENDING_APPROVAL (${rt_l3_vstatus} and ${rt_l4_vstatus}) with recognition held at budgeted (${rt_l3_exp} == ${rt_l4_exp} == 10000)"
            - "THE CUMULATIVE BAND WALKS BACK DOWN — cancelling S4 gives ${rt_com_5} == 999000 with ${rt_util_5} == 99.90 and ${rt_post_5} == RESTRICTED (the market thaws the instant it drops below parity), and cancelling S3 gives ${rt_com_6} == 900000 with ${rt_util_6} == 90.00 and ${rt_post_6} == WATCH"
            - "AND THE THAWED MARKET ACCEPTS AGAIN — the offer refused while FROZEN now succeeds at ${rt_o5_status} == ACCEPTED, taking the market to ${rt_com_7} == 901000, ${rt_util_7} == 90.10 and ${rt_post_7} == RESTRICTED; the threshold is a function of current exposure, never a latch"

      - name: optimistic_concurrency_rejects_both_declared_stale_show_version_writes
        claim_type: optimistic_concurrency
        grounds:
          - "complexity_profile.complexity_layers[optimistic_concurrency]"
          - "concurrency_rules[offer-create-stale-show]"
          - "concurrency_rules[price-adjustment-stale-show]"
          - "validations[priority=16]"
          - "errors[ERR_STALE_SHOW_VERSION]"
        distinguishing_aspect: "Both declared concurrency rules are driven through the same Show, and in each case the stale version handed to the write is a REAL version that a genuine reader could have held one call earlier — never an invented number — which is the only way to prove the check compares against the CURRENT version rather than merely validating a format. The instance pins three things a naive implementation gets wrong: the guarded field is the PARENT's version even though the write targets a child (an Offer, a TicketTier price), so writes to sibling children must advance it; a successful guarded write advances the version itself, so replaying the very same request with the version that just worked must now fail; and the version check at priority 16 runs BEFORE the deal-coherence check at priority 25, so a request that is both stale and internally incoherent is a 412 and not a 422. Every rejection is also checked for absence of side effects, because the dangerous failure mode of OCC is a write that is reported as rejected but partially applied."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Market OCC Market limit 5000000; Venue OCC Hall capacity 500, facility fee 0, ticket tax 0; Artist OCC Act, withholding 0."
            - "One show S (event 2026-12-02T02:00Z, RENTAL, rental fee 0) created and left PLANNED. Its version at creation is captured as v1 and NOTHING else is created, so the whole instance can watch a single version counter move."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "OCC Market", region_code: "OC", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { oc_mk_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${oc_mk_id}", name: "OCC Hall", gross_capacity: 500, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { oc_vn_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "OCC Act", agency: "Occ Talent", tier: "THEATER", historical_sellthrough_pct: 66.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { oc_ar_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${oc_ar_id}", venue_id: "${oc_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { oc_sh_id: $.data.id, oc_v1: $.data.version }
          trigger:
            # a write to the parent advances the guarded version behind the client's back
            - call: "POST /shows/${oc_sh_id}/exposure-override"
              payload: { exposure_override_limit_cents: 9000000, exposure_override_justification: "Anchor date for the routing" }
              as: RiskOfficer
              as_user_id: "u_oc_risk"
              captures: { oc_v2: $.data.version }
            # RULE 1 — offer-create-stale-show
            - call: "POST /offers"
              payload: { show_id: "${oc_sh_id}", expected_show_version: "${oc_v1}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 100000, deposit_cents: 0, expense_cap_cents: 100000 }
              as: TalentBuyer
              captures: { oc_err_1: $.data.error_id }
            - call: "GET /offers"
              payload: { show_id: "${oc_sh_id}" }
              as: TalentBuyer
            - call: "GET /shows/${oc_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { oc_v2_check: $.data.version, oc_status_1: $.data.show_status }
            - call: "POST /offers"
              payload: { show_id: "${oc_sh_id}", expected_show_version: "${oc_v2}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 100000, deposit_cents: 0, expense_cap_cents: 100000 }
              as: TalentBuyer
              captures: { oc_of_id: $.data.id, oc_of_status: $.data.status }
            - call: "POST /offers/${oc_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${oc_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${oc_ar_id}"
              captures: { oc_of_status_acc: $.data.status }
            - call: "GET /shows/${oc_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { oc_v3: $.data.version, oc_status_2: $.data.show_status }
            # stale AND incoherent — priority 16 must win over priority 25
            - call: "POST /offers"
              payload: { show_id: "${oc_sh_id}", expected_show_version: "${oc_v2}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 120000, deposit_cents: 0, expense_cap_cents: 120000, versus_pct: 85.00 }
              as: TalentBuyer
              captures: { oc_err_2: $.data.error_id }
            - call: "GET /offers"
              payload: { show_id: "${oc_sh_id}" }
              as: TalentBuyer
            - call: "GET /offers/${oc_of_id}"
              payload: {}
