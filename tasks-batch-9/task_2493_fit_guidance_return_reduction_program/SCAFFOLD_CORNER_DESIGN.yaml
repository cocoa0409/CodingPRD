      - name: suspended_vendor_cannot_submit_a_specification
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_VENDOR_SUSPENDED]
          - calculations.vendor_reliability_score
          - state_machines.MeasurementSpec.status.SUBMITTED_to_CORRECTION_REQUESTED
          - state_machines.MeasurementSpec.status.CORRECTION_REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
          Vendor.status SUSPENDED is reachable only through accumulated penalties: 17 correction
          rounds cost 17 * CORRECTION_ROUND_PENALTY_BP = 5100, leaving reliability_score_bp 4900,
          which is below VENDOR_SUSPEND_BP 5000 (and the 16th round left 5200, i.e. merely
          PROBATION, so the 17th round is what flips the vendor). Because MAX_CORRECTION_ROUNDS
          caps a single specification at 3 rounds, the rounds are spread over six items. Once
          SUSPENDED, priority 17 blocks submit on a completely untouched DRAFT specification with
          409 ERR_VENDOR_SUSPENDED, even though the budget check at priority 31 is satisfied
          (42500 <= 100000).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with correction_budget_cents 100000."
            - "A target item T carrying one untouched DRAFT specification."
            - "Six auxiliary items, each with one deliberately out-of-tolerance specification (S chest 840 -> M chest 940 against a CHEST rule of increment 40 and 5 mm tolerance): items 1-5 are driven through three CORRECTION_REQUESTED rounds each and item 6 through two, for 17 rounds in total."
