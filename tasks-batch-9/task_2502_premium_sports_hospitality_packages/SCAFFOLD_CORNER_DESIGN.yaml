              captures: { v2: "$.data.variant", rev2: "$.data.revenue_cents", build2: "$.data.build_cost_cents", cost2: "$.data.cost_cents", unsold2: "$.data.unsold_units", exp2: "$.data.unsold_exposure_cents", m2: "$.data.margin_cents", nm2: "$.data.net_margin_cents", pct2: "$.data.margin_pct" }
