scenario: |
  1870. Neighborhood Watch & Community Safety Program (police-sponsored neighborhood watch): block registration & captain assignment, member contact roster & alert distribution, incident report intake & pattern mapping, law enforcement liaison meetings & data sharing, sign/materials distribution & program certification, training sessions & bias-avoidance guidance, event (National Night Out) coordination, program participation metrics

domain_name: neighborhood-watch-community-safety
api_prefix: /watch

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: access_control_matrix
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_actions

  entity_topology: hybrid
  # WatchGroup -> Block -> Member tree, plus cross-cutting Alert / IncidentReport /
  # LiaisonMeeting / CommunityEvent associations that span the tree.

  state_machine_shape: cyclic
  # IncidentReport has a SUBMITTED -> UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW loop;
  # CertificationReview forks PENDING -> {APPROVED, REJECTED, CONDITIONAL};
  # Alert carries parallel dimensions (distribution_status x acknowledgement posture).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # The member who files an IncidentReport cannot be the ProgramCoordinator who
  # clears it; the LiaisonOfficer who chairs a LiaisonMeeting cannot certify a
  # WatchGroup whose training was delivered by the same officer.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: WatchGroup
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Official program name of the neighborhood watch group."
        constraints: "1-120 chars; unique within a sponsoring precinct_code"
      - name: precinct_code
        type: string
        source: input
        description: "Code of the sponsoring police precinct (tenant-ish scope)."
        constraints: "uppercase alnum, 2-12 chars"
      - name: certification_status
        type: enum
        source: computed
        description: "Derived program certification level."
        default: UNCERTIFIED
        constraints: "enum {UNCERTIFIED, PROVISIONAL, CERTIFIED, SUSPENDED, REVOKED}"
      - name: certification_valid_until
        type: datetime
        source: computed
        description: "Certification expiry; null while UNCERTIFIED or REVOKED. Computed from the latest APPROVED CertificationReview.certification_grant_months."
      - name: posture
        type: enum
        source: computed
        description: "Derived operational posture gating all child operations. Posture = f(active captain coverage, member quorum, certification_status, training currency)."
        default: DORMANT
        constraints: "enum {DORMANT, FORMATION, OPERATIONAL, DEGRADED, FROZEN}"
      - name: sign_inventory_count
        type: integer
        source: computed
        description: "Watch signs currently issued to the group and not yet recalled. Ledger field adjusted by material issue/recall transitions."
        default: 0
        constraints: ">= 0"
      - name: materials_inventory_count
        type: integer
        source: computed
        description: "Printed materials (decals, flyers) currently issued and not recalled. Ledger field."
        default: 0
        constraints: ">= 0"
      - name: participation_score
        type: number
        source: computed
        description: "Program participation metric; see calculation participation_score (dual variant)."
        default: 0
      - name: training_cooldown_until
        type: datetime
        source: computed
        description: "Earliest moment a new bias-avoidance TrainingSession may be scheduled for this group (24h cooling-off after a completed session). Null when no cooldown is active."

  - name: Block
    parent: WatchGroup
    common_fields: true
    fields:
      - name: watch_group_id
        type: string
        source: input
        description: "FK -> WatchGroup.id; the sponsoring watch group."
      - name: street_segment
        type: string
        source: input
        description: "Human-readable block descriptor (e.g. '100-199 Maple St')."
        constraints: "unique within watch_group_id"
      - name: household_count
        type: integer
        source: input
        description: "Number of residential households on the block."
        constraints: ">= 1"
      - name: registration_status
        type: enum
        source: computed
        description: "Block registration lifecycle state."
        default: PENDING
        constraints: "enum {PENDING, REGISTERED, DEREGISTERED}"
      - name: risk_heat_score
        type: number
        source: computed
        description: "Pattern-mapping heat score; see calculation block_risk_heat (dual variant)."
        default: 0
      - name: last_incident_at
        type: datetime
        source: computed
        description: "Timestamp of the most recent IncidentReport on this block in state CORROBORATED or CLEARED. Null when none."

  - name: Member
    parent: WatchGroup
    common_fields: true
    fields:
      - name: watch_group_id
        type: string
        source: input
        description: "FK -> WatchGroup.id; group the member belongs to."
      - name: block_id
        type: string
        source: input
        description: "FK -> Block.id; block of residence. Must belong to the same watch_group_id."
      - name: full_name
        type: string
        source: input
        description: "Member legal name."
      - name: contact_channel
        type: enum
        source: input
        description: "Primary alert channel."
        constraints: "enum {SMS, EMAIL, PHONE_TREE}"
      - name: roster_visibility
        type: enum
        source: input
        description: "Who may see this member's contact record."
        default: GROUP_ONLY
        constraints: "enum {GROUP_ONLY, LIAISON_VISIBLE, PROGRAM_WIDE}"
      - name: membership_status
        type: enum
        source: computed
        description: "Member lifecycle state."
        default: ACTIVE
        constraints: "enum {ACTIVE, SUSPENDED, WITHDRAWN}"
      - name: bias_training_completed_at
        type: datetime
        source: computed
        description: "Timestamp of the member's most recent COMPLETED bias-avoidance training attendance. Null when never completed."
      - name: strike_count
        type: integer
        source: computed
        description: "Count of conduct strikes; reaching STRIKE_LIMIT suspends the member (see Member state machine)."
        default: 0
        constraints: ">= 0"

  - name: BlockCaptainAssignment
    parent: Block
    common_fields: true
    fields:
      - name: block_id
        type: string
        source: input
        description: "FK -> Block.id; block being captained."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member appointed captain."
      - name: assignment_status
        type: enum
        source: computed
        description: "Assignment lifecycle state."
        default: ACTIVE
        constraints: "enum {ACTIVE, RELIEVED, REVOKED}"
      - name: assigned_at
        type: datetime
        source: system
        description: "Timestamp the assignment became ACTIVE."
      - name: relieved_at
        type: datetime
        source: system
        description: "Timestamp the assignment left ACTIVE. Null while ACTIVE."

  - name: IncidentReport
    parent: Block
    common_fields: true
    fields:
      - name: block_id
        type: string
        source: input
        description: "FK -> Block.id; block where the incident occurred."
      - name: reporter_member_id
        type: string
        source: input
        description: "FK -> Member.id; filing member (segregation-of-duties anchor)."
      - name: category
        type: enum
        source: input
        description: "Incident category."
        constraints: "enum {SUSPICIOUS_ACTIVITY, PROPERTY_CRIME, VANDALISM, NOISE, TRAFFIC, OTHER}"
      - name: occurred_at
        type: datetime
        source: input
        description: "When the incident occurred. Must be <= current logical clock."
      - name: severity
        type: integer
        source: input
        description: "Reporter-assessed severity 1-5."
        constraints: "integer in [1,5]"
      - name: review_status
        type: enum
        source: computed
        description: "Review lifecycle state (cyclic: UNDER_REVIEW <-> NEEDS_INFO)."
        default: SUBMITTED
        constraints: "enum {SUBMITTED, UNDER_REVIEW, NEEDS_INFO, CORROBORATED, DISMISSED, CLEARED}"
      - name: corroboration_weight
        type: number
        source: computed
        description: "Weight contributed to block_risk_heat; see calculation block_risk_heat. 0 unless review_status in {CORROBORATED, CLEARED}."
        default: 0
      - name: shared_with_liaison
        type: boolean
        source: computed
        description: "True once the report has been disclosed under an ACTIVE DataShareAgreement; drives visibility scoping."

  - name: Alert
    parent: WatchGroup
    common_fields: true
    fields:
      - name: watch_group_id
        type: string
        source: input
        description: "FK -> WatchGroup.id; issuing group."
      - name: origin_incident_id
        type: string
        source: input
        description: "FK -> IncidentReport.id; optional originating incident. Required when alert_kind == INCIDENT_BULLETIN."
        constraints: "nullable"
      - name: alert_kind
        type: enum
        source: input
        description: "Alert category."
        constraints: "enum {INCIDENT_BULLETIN, MEETING_NOTICE, EVENT_NOTICE, SAFETY_TIP}"
      - name: audience_scope
        type: enum
        source: input
        description: "Distribution scope: single block or whole group."
        constraints: "enum {BLOCK, GROUP}"
      - name: target_block_id
        type: string
        source: input
        description: "FK -> Block.id; required iff audience_scope == BLOCK, forbidden otherwise."
        constraints: "nullable"
      - name: distribution_status
        type: enum
        source: computed
        description: "Delivery dimension of the Alert parallel state machine."
        default: DRAFT
        constraints: "enum {DRAFT, QUEUED, SENT, RECALLED}"
      - name: ack_posture
        type: enum
        source: computed
        description: "Acknowledgement dimension, derived from Member acknowledgements (parallel to distribution_status)."
        default: UNTRACKED
        constraints: "enum {UNTRACKED, PARTIAL, MAJORITY, FULL}"
      - name: scheduled_send_at
        type: datetime
        source: input
        description: "Requested send time; must respect quiet-hours window (see validations)."
      - name: recipient_count
        type: integer
        source: computed
        description: "Fan-out count computed by alert_fanout calculation at QUEUED->SENT."
        default: 0
      - name: ack_count
        type: integer
        source: computed
        description: "Number of distinct Members who acknowledged this alert."
        default: 0

  - name: LiaisonMeeting
    parent: WatchGroup
    common_fields: true
    fields:
      - name: watch_group_id
        type: string
        source: input
        description: "FK -> WatchGroup.id; host group."
      - name: liaison_officer_id
        type: string
        source: input
        description: "FK -> LiaisonOfficer.id; chairing officer (segregation-of-duties anchor for certification)."
      - name: room_slot_start
        type: datetime
        source: input
        description: "Meeting room reservation start (half-open interval [start, end))."
      - name: room_slot_end
        type: datetime
        source: input
        description: "Meeting room reservation end. Must be > room_slot_start."
      - name: meeting_status
        type: enum
        source: computed
        description: "Meeting lifecycle state."
        default: SCHEDULED
        constraints: "enum {SCHEDULED, HELD, CANCELLED}"
      - name: quorum_met
        type: boolean
        source: computed
        description: "Computed at HELD transition via meeting_quorum calculation."
        default: false
      - name: attendee_count
        type: integer
        source: input
        description: "Count of member attendees recorded when the meeting is marked HELD."
        constraints: ">= 0; only settable at mark-held"

  - name: LiaisonOfficer
    parent: null
    common_fields: true
    fields:
      - name: badge_number
        type: string
        source: input
        description: "Department badge number."
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        description: "Officer name."
      - name: precinct_code
        type: string
        source: input
        description: "Precinct the officer is assigned to; must match WatchGroup.precinct_code for liaison actions."

  - name: DataShareAgreement
    parent: WatchGroup
    common_fields: true
    fields:
      - name: watch_group_id
        type: string
        source: input
        description: "FK -> WatchGroup.id; disclosing group."
      - name: liaison_officer_id
        type: string
        source: input
        description: "FK -> LiaisonOfficer.id; receiving officer."
      - name: scope
        type: enum
        source: input
        description: "What data classes are shared."
        constraints: "enum {INCIDENT_SUMMARIES, ROSTER_CONTACTS, FULL}"
      - name: agreement_status
        type: enum
        source: computed
        description: "Agreement lifecycle state."
        default: PENDING
        constraints: "enum {PENDING, ACTIVE, REVOKED, EXPIRED}"
      - name: expires_at
        type: datetime
        source: input
        description: "Agreement expiry. System auto-transitions ACTIVE -> EXPIRED when logical clock passes expires_at (checked on every read/write touching the agreement)."

  - name: TrainingSession
    parent: WatchGroup
    common_fields: true
    fields:
      - name: watch_group_id
        type: string
        source: input
        description: "FK -> WatchGroup.id; group being trained."
      - name: trainer_officer_id
        type: string
        source: input
        description: "FK -> LiaisonOfficer.id; officer delivering bias-avoidance guidance."
      - name: curriculum
        type: enum
        source: input
        description: "Training curriculum type."
        constraints: "enum {BIAS_AVOIDANCE, OBSERVATION_SKILLS, REPORT_WRITING}"
      - name: scheduled_at
        type: datetime
        source: input
        description: "Session start time; must respect WatchGroup.training_cooldown_until."
      - name: session_status
        type: enum
        source: computed
        description: "Session lifecycle state."
        default: SCHEDULED
        constraints: "enum {SCHEDULED, COMPLETED, CANCELLED}"
      - name: attending_member_ids
        type: array
        source: input
        description: "Member ids marked attended at COMPLETED transition. Each must be an ACTIVE Member of the same watch_group_id."

  - name: CommunityEvent
    parent: WatchGroup
    common_fields: true
    fields:
      - name: watch_group_id
        type: string
        source: input
        description: "FK -> WatchGroup.id; hosting group."
      - name: event_kind
        type: enum
        source: input
        description: "Event category; NATIONAL_NIGHT_OUT has special certification gating."
        constraints: "enum {NATIONAL_NIGHT_OUT, BLOCK_PARTY, SAFETY_FAIR}"
      - name: street_closure_start
        type: datetime
        source: input
        description: "Street-closure window start (closed interval with mandatory buffer, see validations)."
      - name: street_closure_end
        type: datetime
        source: input
        description: "Street-closure window end. Must be >= street_closure_start."
      - name: event_status
        type: enum
        source: computed
        description: "Event lifecycle state."
        default: PROPOSED
        constraints: "enum {PROPOSED, APPROVED, COMPLETED, CANCELLED}"
      - name: estimated_attendance
        type: integer
        source: input
        description: "Projected attendance; drives tiered permit threshold."
        constraints: ">= 0"

  - name: CertificationReview
    parent: WatchGroup
    common_fields: true
    fields:
      - name: watch_group_id
        type: string
        source: input
        description: "FK -> WatchGroup.id; group under review."
      - name: reviewing_officer_id
        type: string
        source: input
        description: "FK -> LiaisonOfficer.id; certifying officer. MUST differ from the officer who trained the group's most recent COMPLETED BIAS_AVOIDANCE session (segregation of duties)."
      - name: review_status
        type: enum
        source: computed
        description: "Review lifecycle (branching fork)."
        default: PENDING
        constraints: "enum {PENDING, APPROVED, REJECTED, CONDITIONAL}"
      - name: certification_points
        type: number
        source: computed
        description: "Composite score; see calculation certification_points."
        default: 0
      - name: certification_grant_months
        type: integer
        source: computed
        description: "Months granted on APPROVED: 24 when points >= FULL_THRESHOLD, 12 otherwise. 0 when not APPROVED."
        default: 0

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: WatchGroup
    initial_state: DORMANT
    terminal_states: []   # posture is derived; certification_status has its own axis
    transitions:
      - from: DORMANT
        to: FORMATION
        trigger: "POST /watch/watch-groups/{id}/blocks with the group's first Block reaching REGISTERED"
        actor: system
        preconditions:
          - "certification_status in {UNCERTIFIED, PROVISIONAL}"
          - "at least one Block of the group has registration_status == REGISTERED"
        side_effects:
          - "recompute participation_score (census variant)"
          - "increments WatchGroup.version by 1"
        note: "posture is a derived axis; this transition fires automatically on block registration."
      - from: FORMATION
        to: OPERATIONAL
        trigger: "system posture recompute after captain assignment + training completion"
        actor: system
        preconditions:
          - "every REGISTERED Block has exactly one ACTIVE BlockCaptainAssignment"
          - "at least one COMPLETED BIAS_AVOIDANCE TrainingSession exists for the group"
          - "certification_status != REVOKED"
        side_effects:
          - "recompute participation_score (activity variant)"
          - "increments WatchGroup.version by 1"
      - from: OPERATIONAL
        to: DEGRADED
        trigger: "system posture recompute after captain revocation/relief leaves a REGISTERED block without an ACTIVE captain"
        actor: system
        preconditions:
          - "at least one REGISTERED Block lacks an ACTIVE BlockCaptainAssignment"
          - "certification_status != REVOKED"
        side_effects:
          - "hold all QUEUED Alerts of the group (distribution_status stays QUEUED; sends rejected with ERR_POSTURE_GATED)"
          - "increments WatchGroup.version by 1"
      - from: DEGRADED
        to: OPERATIONAL
        trigger: "system posture recompute after the captain vacancy is filled"
        actor: system
        preconditions:
          - "every REGISTERED Block has exactly one ACTIVE BlockCaptainAssignment"
        side_effects:
          - "release held QUEUED Alerts (they become sendable again)"
          - "increments WatchGroup.version by 1"
      - from: OPERATIONAL
        to: FROZEN
        trigger: "POST /watch/watch-groups/{id}/freeze"
        actor: ProgramCoordinator
        preconditions:
          - "certification_status == SUSPENDED"
        side_effects:
          - "cascade: every ACTIVE Member of the group -> membership_status unchanged but roster read-only (writes rejected ERR_POSTURE_GATED)"
          - "increments WatchGroup.version by 1"
      - from: FROZEN
        to: OPERATIONAL
        trigger: "POST /watch/watch-groups/{id}/unfreeze"
        actor: ProgramCoordinator
        preconditions:
          - "certification_status in {PROVISIONAL, CERTIFIED}"
        side_effects:
          - "recompute posture from scratch"
          - "increments WatchGroup.version by 1"
      - from: DEGRADED
        to: FROZEN
        trigger: "POST /watch/watch-groups/{id}/freeze"
        actor: ProgramCoordinator
        preconditions:
          - "certification_status == SUSPENDED"
        side_effects:
          - "increments WatchGroup.version by 1"
      - from: FORMATION
        to: FROZEN
        trigger: "POST /watch/watch-groups/{id}/freeze"
        actor: ProgramCoordinator
        preconditions:
          - "certification_status == SUSPENDED"
        side_effects:
          - "increments WatchGroup.version by 1"

  - entity: Block
    initial_state: PENDING
    terminal_states: [DEREGISTERED]
    transitions:
      - from: PENDING
        to: REGISTERED
        trigger: "POST /watch/blocks/{id}/register"
        actor: ProgramCoordinator
        preconditions:
          - "WatchGroup.certification_status != REVOKED"
          - "block has household_count >= 1"
          - "no other REGISTERED Block of the same WatchGroup shares street_segment (case-insensitive)"
        side_effects:
          - "trigger WatchGroup posture recompute (DORMANT -> FORMATION when first block registers)"
          - "increments WatchGroup.version by 1 (cascade)"
      - from: REGISTERED
        to: DEREGISTERED
        trigger: "POST /watch/blocks/{id}/deregister"
        actor: ProgramCoordinator
        preconditions:
          - "no IncidentReport of this block is in {SUBMITTED, UNDER_REVIEW, NEEDS_INFO}"
          - "no ACTIVE BlockCaptainAssignment exists for this block (must relieve/revoke first)"
        side_effects:
          - "cascade: all ACTIVE Members with block_id == this block -> WITHDRAWN"
          - "cascade: Member withdrawal triggers WatchGroup participation_score recompute"
          - "increments WatchGroup.version by 1 (cascade)"

  - entity: Member
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /watch/members/{id}/suspend OR system strike-threshold (strike_count reaches STRIKE_LIMIT=3)"
        actor: ProgramCoordinator | system
        preconditions:
          - "membership_status == ACTIVE"
        side_effects:
          - "cascade: any ACTIVE BlockCaptainAssignment with member_id == this member -> REVOKED (relieved_at stamped)"
          - "cascade: captain revocation triggers WatchGroup posture recompute (may force OPERATIONAL -> DEGRADED)"
          - "WatchGroup.version increments via posture cascade"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /watch/members/{id}/reinstate"
        actor: ProgramCoordinator
        preconditions:
          - "membership_status == SUSPENDED"
          - "WatchGroup.posture != FROZEN"
        side_effects:
          - "strike_count reset to 0"
          - "trigger WatchGroup participation_score recompute"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /watch/members/{id}/withdraw"
        actor: Member (self) | ProgramCoordinator
        preconditions:
          - "membership_status == ACTIVE"
        side_effects:
          - "cascade: ACTIVE BlockCaptainAssignment -> RELIEVED"
          - "trigger WatchGroup posture recompute"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /watch/members/{id}/withdraw"
        actor: ProgramCoordinator
        preconditions:
          - "membership_status == SUSPENDED"
        side_effects:
          - "trigger WatchGroup participation_score recompute"

  - entity: IncidentReport
    initial_state: SUBMITTED
    terminal_states: [DISMISSED, CLEARED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /watch/incident-reports/{id}/begin-review"
        actor: ProgramCoordinator
        preconditions:
          - "review_status == SUBMITTED"
          - "acting coordinator's user id != reporter_member_id (segregation of duties)"
        side_effects:
          - "increments IncidentReport.version by 1"
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /watch/incident-reports/{id}/request-info"
        actor: ProgramCoordinator
        preconditions:
          - "review_status == UNDER_REVIEW"
        side_effects:
          - "increments IncidentReport.version by 1"
        note: "revision loop: report bounces back to the reporter for clarification."
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /watch/incident-reports/{id}/resubmit"
        actor: Member (the original reporter only)
        preconditions:
          - "review_status == NEEDS_INFO"
          - "acting member id == reporter_member_id"
        side_effects:
          - "increments IncidentReport.version by 1"
      - from: UNDER_REVIEW
        to: CORROBORATED
        trigger: "POST /watch/incident-reports/{id}/corroborate"
        actor: LiaisonOfficer
        preconditions:
          - "review_status == UNDER_REVIEW"
          - "an ACTIVE DataShareAgreement exists for the report's block's WatchGroup with scope in {INCIDENT_SUMMARIES, FULL}"
        side_effects:
          - "set corroboration_weight via block_risk_heat calculation"
          - "set shared_with_liaison = true"
          - "cascade: recompute Block.risk_heat_score; update Block.last_incident_at"
          - "cascade: Block heat recompute triggers WatchGroup participation_score recompute (activity variant)"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /watch/incident-reports/{id}/dismiss"
        actor: ProgramCoordinator
        preconditions:
          - "review_status == UNDER_REVIEW"
          - "acting coordinator's user id != reporter_member_id"
        side_effects:
          - "corroboration_weight stays 0"
      - from: CORROBORATED
        to: CLEARED
        trigger: "POST /watch/incident-reports/{id}/clear"
        actor: LiaisonOfficer
        preconditions:
          - "review_status == CORROBORATED"
        side_effects:
          - "corroboration_weight recomputed under cleared variant (decayed weight)"
          - "cascade: recompute Block.risk_heat_score"

  - entity: Alert
    initial_state: DRAFT
    terminal_states: [RECALLED]
    transitions:
      - from: DRAFT
        to: QUEUED
        trigger: "POST /watch/alerts/{id}/queue"
        actor: BlockCaptain | ProgramCoordinator
        preconditions:
          - "distribution_status == DRAFT"
          - "WatchGroup.posture in {OPERATIONAL}"
          - "when alert_kind == INCIDENT_BULLETIN: origin_incident.review_status in {CORROBORATED, CLEARED}"
          - "when audience_scope == BLOCK: target_block.registration_status == REGISTERED and target_block holds exactly one ACTIVE BlockCaptainAssignment (ERR_NO_ACTIVE_CAPTAIN otherwise)"
        side_effects:
          - "increments Alert.version by 1"
      - from: QUEUED
        to: SENT
        trigger: "POST /watch/alerts/{id}/send (or system scheduler at scheduled_send_at)"
        actor: ProgramCoordinator | system
        preconditions:
          - "distribution_status == QUEUED"
          - "current logical clock >= scheduled_send_at (send before the scheduled instant is rejected ERR_INVALID_STATE; the scheduled instant itself is fireable)"
          - "WatchGroup.posture == OPERATIONAL (ERR_POSTURE_GATED otherwise)"
          - "current logical clock within send window: not inside quiet hours 22:00-07:00 local unless alert_kind == INCIDENT_BULLETIN"
        side_effects:
          - "compute recipient_count via alert_fanout calculation"
          - "increment WatchGroup.materials_inventory_count by printed_flyers(alert) when materials are attached (see alert_fanout)"
          - "increments Alert.version by 1"
      - from: SENT
        to: RECALLED
        trigger: "POST /watch/alerts/{id}/recall"
        actor: ProgramCoordinator
        preconditions:
          - "distribution_status == SENT"
        side_effects:
          - "compensating: decrement WatchGroup.materials_inventory_count by the same printed_flyers quantity added at send (conservation invariant)"
          - "ack_posture frozen at its current value"
      - from: QUEUED
        to: DRAFT
        trigger: "POST /watch/alerts/{id}/unqueue"
        actor: ProgramCoordinator
        preconditions:
          - "distribution_status == QUEUED"
        side_effects:
          - "increments Alert.version by 1"
    note: "ack_posture is a parallel derived dimension on the same row: UNTRACKED -> PARTIAL (1 <= ack_count < majority) -> MAJORITY (ack_count >= floor(recipient_count/2)+1) -> FULL (ack_count == recipient_count, recipient_count > 0). Driven by POST /watch/alerts/{id}/ack."

  - entity: LiaisonMeeting
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /watch/liaison-meetings/{id}/mark-held"
        actor: LiaisonOfficer
        preconditions:
          - "meeting_status == SCHEDULED"
          - "current logical clock >= room_slot_start"
          - "acting officer id == liaison_officer_id"
        side_effects:
          - "compute quorum_met via meeting_quorum calculation"
          - "when quorum_met: cascade WatchGroup participation_score recompute (meeting attendance input)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /watch/liaison-meetings/{id}/cancel"
        actor: LiaisonOfficer | ProgramCoordinator
        preconditions:
          - "meeting_status == SCHEDULED"
        side_effects:
          - "release room slot (frees overlap window for other meetings)"

  - entity: DataShareAgreement
    initial_state: PENDING
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /watch/data-share-agreements/{id}/activate"
        actor: LiaisonOfficer
        preconditions:
          - "agreement_status == PENDING"
          - "acting officer id == liaison_officer_id"
          - "officer.precinct_code == watch_group.precinct_code"
          - "current logical clock < expires_at"
        side_effects:
          - "increments DataShareAgreement.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /watch/data-share-agreements/{id}/revoke"
        actor: ProgramCoordinator | LiaisonOfficer
        preconditions:
          - "agreement_status == ACTIVE"
        side_effects:
          - "cascade: every IncidentReport of the group with shared_with_liaison == true has visibility re-scoped (roster_visibility enforcement tightened; reports remain CORROBORATED/CLEARED but new liaison reads are denied)"
          - "cascade: Block.risk_heat_score recomputed under the corroborated-only variant (cleared-with-revoked-share weights excluded — see block_risk_heat variants)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system auto-transition when logical clock >= expires_at (checked lazily on access)"
        actor: system
        preconditions:
          - "agreement_status == ACTIVE"
          - "logical clock >= expires_at"
        side_effects:
          - "same re-scope cascade as REVOKED"

  - entity: TrainingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /watch/training-sessions/{id}/complete"
        actor: LiaisonOfficer
        preconditions:
          - "session_status == SCHEDULED"
          - "acting officer id == trainer_officer_id"
          - "attending_member_ids non-empty; every id is an ACTIVE Member of the same watch_group_id"
        side_effects:
          - "for each attending member with curriculum == BIAS_AVOIDANCE: set bias_training_completed_at = scheduled_at"
          - "set WatchGroup.training_cooldown_until = scheduled_at + 24h"
          - "trigger WatchGroup posture recompute (FORMATION -> OPERATIONAL training gate)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /watch/training-sessions/{id}/cancel"
        actor: LiaisonOfficer | ProgramCoordinator
        preconditions:
          - "session_status == SCHEDULED"
        side_effects: []

  - entity: CommunityEvent
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /watch/community-events/{id}/approve"
        actor: LiaisonOfficer
        preconditions:
          - "event_status == PROPOSED"
          - "WatchGroup.certification_status == CERTIFIED when event_kind == NATIONAL_NIGHT_OUT; otherwise in {PROVISIONAL, CERTIFIED}"
          - "no street-closure overlap with another APPROVED event of the same WatchGroup (buffer-inclusive semantics, see validations)"
          - "when estimated_attendance >= PERMIT_TIER_THRESHOLD(100): WatchGroup must hold an ACTIVE DataShareAgreement (large-gathering notification rule)"
        side_effects:
          - "increments CommunityEvent.version by 1"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /watch/community-events/{id}/complete"
        actor: ProgramCoordinator
        preconditions:
          - "event_status == APPROVED"
          - "current logical clock > street_closure_end"
        side_effects:
          - "cascade: WatchGroup participation_score recompute (event completion input, activity variant)"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /watch/community-events/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "event_status == PROPOSED"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /watch/community-events/{id}/cancel"
        actor: LiaisonOfficer
        preconditions:
          - "event_status == APPROVED"
          - "current logical clock < street_closure_start"
        side_effects:
          - "release street-closure window"

  - entity: CertificationReview
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /watch/certification-reviews/{id}/decide with decision=APPROVED"
        actor: LiaisonOfficer
        preconditions:
          - "review_status == PENDING"
          - "acting officer id == reviewing_officer_id"
          - "certification_points >= APPROVAL_THRESHOLD(60) per certification_points calculation"
          - "segregation: reviewing_officer_id != trainer of group's latest COMPLETED BIAS_AVOIDANCE session"
        side_effects:
          - "set WatchGroup.certification_status = CERTIFIED when points >= FULL_THRESHOLD(80) else PROVISIONAL"
          - "set certification_grant_months = 24 (points >= FULL_THRESHOLD) else 12"
          - "set WatchGroup.certification_valid_until = now + grant months"
          - "cascade: certification_status change triggers WatchGroup posture recompute"
      - from: PENDING
        to: REJECTED
        trigger: "POST /watch/certification-reviews/{id}/decide with decision=REJECTED"
        actor: LiaisonOfficer
        preconditions:
          - "review_status == PENDING"
          - "acting officer id == reviewing_officer_id"
        side_effects:
          - "set WatchGroup.certification_status = UNCERTIFIED (no revocation unless previously certified: see note)"
        note: "when the group was previously CERTIFIED and the review is a renewal that is REJECTED, certification_status -> REVOKED instead of UNCERTIFIED."
      - from: PENDING
        to: CONDITIONAL
        trigger: "POST /watch/certification-reviews/{id}/decide with decision=CONDITIONAL"
        actor: LiaisonOfficer
        preconditions:
          - "review_status == PENDING"
          - "certification_points in [CONDITIONAL_FLOOR(40), APPROVAL_THRESHOLD(60))"
        side_effects:
          - "set WatchGroup.certification_status = PROVISIONAL"
      - from: CONDITIONAL
        to: APPROVED
        trigger: "POST /watch/certification-reviews/{id}/decide with decision=APPROVED (uplift after remediation)"
        actor: LiaisonOfficer
        preconditions:
          - "review_status == CONDITIONAL"
          - "certification_points recomputed >= APPROVAL_THRESHOLD(60)"
        side_effects:
          - "as PENDING -> APPROVED"
      - from: CONDITIONAL
        to: REJECTED
        trigger: "POST /watch/certification-reviews/{id}/decide with decision=REJECTED"
        actor: LiaisonOfficer
        preconditions:
          - "review_status == CONDITIONAL"
        side_effects:
          - "as PENDING -> REJECTED"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only — see SKILL.md §1.2.1 mandatory filter)
# =============================================================================
concurrency_rules:
  - rule_id: alert-queue-stale-group
    parent_entity: WatchGroup
    write_endpoint: "POST /watch/alerts"
    occ_field: "expected_watch_group_version"
    description: |
      Creating an Alert against a WatchGroup whose version has advanced since the
      client last observed it is rejected. The product semantics allow a fresh
      alert to legitimately coexist with any number of prior alerts, so no state
      precondition can catch the stale view; OCC on WatchGroup.version is the
      sanctioned resolution.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: captain-assign-stale-block
    parent_entity: Block
    write_endpoint: "POST /watch/blocks/{id}/captain-assignments"
    occ_field: "expected_block_version"
    description: |
      Creating a BlockCaptainAssignment against a Block whose version has advanced
      since the client last observed it is rejected with ERR_STALE_VERSION. The
      supersede semantics of captain assignment (a new ACTIVE assignment relieves
      a prior ACTIVE one) mean a sequential second create sees no state field that
      would reject it, so OCC on Block.version is the sanctioned resolution.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: participation_score
    trigger: "on WatchGroup posture recompute; on member join/withdraw/suspend/reinstate; on meeting HELD with quorum; on event COMPLETED; on incident corroboration"
    algorithm: weighted_scoring
    formula: |
      # Dual variant — the two variants produce different values for identical raw data.
      # Variant selection: CENSUS variant while posture in {DORMANT, FORMATION};
      # ACTIVITY variant while posture in {OPERATIONAL, DEGRADED, FROZEN}.
      base = 10 * count(Block where registration_status == REGISTERED)
      member_term = 2 * count(Member where membership_status == ACTIVE)
      meeting_term = 5 * count(LiaisonMeeting where meeting_status == HELD and quorum_met == true)
      event_term = 8 * count(CommunityEvent where event_status == COMPLETED)
      incident_term = 3 * count(IncidentReport where review_status in {CORROBORATED, CLEARED})
      if variant == CENSUS:
          score = base + member_term            # forward-looking: meetings/events/incidents excluded
      else:  # ACTIVITY
          score = base + member_term + meeting_term + event_term + incident_term
      participation_score = score   # integer arithmetic, no rounding
    input_set: "children of the WatchGroup; status filters pinned per term above"
    constants:
      BLOCK_W: 10
      MEMBER_W: 2
      MEETING_W: 5
      EVENT_W: 8
      INCIDENT_W: 3
    precision: "integer arithmetic (weights are integers); no fractional rounding"
    variants:
      - name: CENSUS
        when: "WatchGroup.posture in {DORMANT, FORMATION}"
        difference: "counts only blocks + members; excludes meetings, events, incidents"
      - name: ACTIVITY
        when: "WatchGroup.posture in {OPERATIONAL, DEGRADED, FROZEN}"
        difference: "adds meeting, event, and incident terms on top of the census terms"

  - name: block_risk_heat
    trigger: "on IncidentReport CORROBORATED or CLEARED transitions; on DataShareAgreement REVOKED/EXPIRED cascade"
    algorithm: decay_function
    formula: |
      # Step-decay over 30-day buckets measured from report.occurred_at to current logical clock.
      # PROVISIONAL variant: corroborated reports contribute full bucketed weight.
      # CORROBORATED_ONLY variant (used when no ACTIVE DataShareAgreement exists):
      #   reports in CLEARED whose share was revoked contribute 0.
      def bucket_weight(occurred_at, now):
          age_days = (now - occurred_at).days
          if age_days <= 30:  return 1.0
          if age_days <= 60:  return 0.5
          if age_days <= 90:  return 0.25
          return 0.0
      heat = 0.0
      for r in IncidentReport where block_id == this block
                            and review_status in {CORROBORATED, CLEARED}:
          if variant == CORROBORATED_ONLY and r.review_status == CLEARED and share_revoked(r):
              continue
          heat += r.severity * bucket_weight(r.occurred_at, now)
      # per-report rounding: each term rounded to 2dp HALF_UP before summation
      block_risk_heat = sum(round(severity * bucket_weight, 2))
    input_set: "IncidentReports of the block with review_status in {CORROBORATED, CLEARED}; bucket boundaries at 30/60/90 days inclusive of the earlier bucket (age_days <= 30 is the first bucket)"
    constants:
      FULL_WINDOW_DAYS: 30
      HALF_WINDOW_DAYS: 60
      QUARTER_WINDOW_DAYS: 90
    precision: "2 decimal places per term, round_half_up, per-term rounding then sum"
    variants:
      - name: PROVISIONAL
        when: "an ACTIVE DataShareAgreement covers the WatchGroup"
        difference: "CORROBORATED and CLEARED reports both contribute"
      - name: CORROBORATED_ONLY
        when: "no ACTIVE DataShareAgreement covers the WatchGroup (revoked or expired)"
        difference: "CLEARED reports whose disclosure was revoked contribute 0; CORROBORATED reports still contribute"

  - name: certification_points
    trigger: "on CertificationReview creation and on any decide call (recomputed fresh each time)"
    algorithm: weighted_scoring
    formula: |
      # Mode (a): >=3 inputs with non-linear interaction (conditional branches on entity state).
      member_pts = min(25, 1 * count(Member where membership_status == ACTIVE
                                       and bias_training_completed_at is not null))
      meeting_pts = min(25, 5 * count(LiaisonMeeting where meeting_status == HELD and quorum_met == true))
      event_pts = 20 if exists(CommunityEvent where event_kind == NATIONAL_NIGHT_OUT
                               and event_status == COMPLETED) else
                  (10 if exists(CommunityEvent where event_status == COMPLETED) else 0)
      captain_pts = 15 if every REGISTERED Block has exactly one ACTIVE BlockCaptainAssignment else 0
      alert_pts = 15 if count(Alert where distribution_status == SENT) >= 3 else
                  (5 if count(Alert where distribution_status == SENT) >= 1 else 0)
      certification_points = member_pts + meeting_pts + event_pts + captain_pts + alert_pts
    input_set: "children of the WatchGroup with the status filters pinned per term"
    constants:
      APPROVAL_THRESHOLD: 60
      CONDITIONAL_FLOOR: 40
      FULL_THRESHOLD: 80
      MEMBER_CAP: 25
      MEETING_CAP: 25
    precision: "integer arithmetic"
    variants: []

  - name: alert_fanout
    trigger: "on Alert QUEUED -> SENT transition"
    algorithm: aggregation
    formula: |
      # Mode (b): nested rounding where order matters.
      # phone-tree expansion: PHONE_TREE members each cascade to a fixed relay of 3 households.
      # PINNED ORDER: compute per-block rounded fanout first (ceil to whole recipients),
      # then sum across blocks. Summing raw values then rounding is FORBIDDEN.
      import math
      def block_fanout(block):
          m_sms   = count(Member of block, membership_status == ACTIVE, contact_channel == SMS)
          m_email = count(Member of block, membership_status == ACTIVE, contact_channel == EMAIL)
          m_tree  = count(Member of block, membership_status == ACTIVE, contact_channel == PHONE_TREE)
          raw = m_sms + m_email + m_tree * PHONE_TREE_RELAY   # relay = 2.5 households each
          return math.ceil(raw)                                # per-block ceil FIRST
      if audience_scope == BLOCK:
          blocks = [target_block]
      else:  # GROUP
          blocks = all Block of watch_group where registration_status == REGISTERED
      recipient_count = sum(block_fanout(b) for b in blocks)   # then SUM of per-block ceilings
      printed_flyers = math.ceil(recipient_count / FLYER_RATIO)  # 1 flyer per 10 recipients, ceil
      # DIVERGENCE NOTE: sum-then-ceil (ceil over the group-wide raw total) is the
      # forbidden order; e.g. two blocks each with one PHONE_TREE member yield
      # ceil(2.5) + ceil(2.5) = 6 under the pinned order but ceil(5.0) = 5 under the
      # forbidden order.
    input_set: "ACTIVE Members of the in-scope REGISTERED blocks only; SUSPENDED and WITHDRAWN members excluded"
    constants:
      PHONE_TREE_RELAY: 2.5
      FLYER_RATIO: 10
    precision: "ceil to integer recipients per block before summation; printed_flyers ceil over total"
    variants: []

  - name: meeting_quorum
    trigger: "on LiaisonMeeting SCHEDULED -> HELD transition"
    algorithm: threshold
    formula: |
      # Mode (c): circular-looking dependency with pinned evaluation order.
      # quorum threshold depends on active_member_count, which can itself be
      # affected by member suspensions; PINNED ORDER: (1) snapshot
      # active_member_count at the instant of the mark-held call, BEFORE any
      # side effects of this transition run; (2) compute threshold;
      # (3) compare attendee_count.
      active_members = count(Member of watch_group where membership_status == ACTIVE)   # step 1
      quorum_threshold = max(2, ceil(active_members * QUORUM_FRACTION))                  # step 2
      quorum_met = (attendee_count >= quorum_threshold)                                  # step 3 (>= inclusive)
    input_set: "ACTIVE Members of the meeting's WatchGroup at mark-held time; attendee_count from request payload"
    constants:
      QUORUM_FRACTION: 0.25
      QUORUM_MIN: 2
    precision: "ceil on threshold; comparison is inclusive >="
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "role is permitted to invoke the endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "path parameters reference existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition exists (all action endpoints)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: state
    check: "WatchGroup.posture gates the operation: alert queue/send, member write ops, event propose rejected unless posture in the operation's permitted set"
    error_id: ERR_POSTURE_GATED
    http_status: 409
    applies_to: ["POST /watch/alerts", "POST /watch/alerts/{id}/queue", "POST /watch/alerts/{id}/send", "POST /watch/members", "POST /watch/members/{id}/reinstate", "POST /watch/community-events"]

  - priority: 6
    category: business_safety
    check: "segregation of duties: IncidentReport review/dismiss actor != reporter_member_id; CertificationReview reviewing_officer_id != trainer of the group's latest COMPLETED BIAS_AVOIDANCE session"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /watch/incident-reports/{id}/begin-review", "POST /watch/incident-reports/{id}/dismiss", "POST /watch/certification-reviews", "POST /watch/certification-reviews/{id}/decide"]

  - priority: 7
    category: business_temporal
    check: "alert scheduled_send_at must not fall inside quiet hours 22:00-07:00 local unless alert_kind == INCIDENT_BULLETIN"
    error_id: ERR_QUIET_HOURS
    http_status: 422
    applies_to: ["POST /watch/alerts", "POST /watch/alerts/{id}/send"]

  - priority: 8
    category: business_temporal
    check: "LiaisonMeeting room slot [start, end) half-open must not overlap any other SCHEDULED or HELD meeting's slot for the same precinct; adjacency (end == other.start) is ALLOWED"
    error_id: ERR_ROOM_SLOT_CONFLICT
    http_status: 409
    applies_to: ["POST /watch/liaison-meetings"]

  - priority: 9
    category: business_temporal
    check: "CommunityEvent street-closure window is buffer-inclusive: a 2-hour buffer is appended to street_closure_end and prepended to street_closure_start; the buffered CLOSED interval must not touch another APPROVED event's buffered window of the same WatchGroup (adjacency forbidden, gap must be > 0)"
    error_id: ERR_CLOSURE_CONFLICT
    http_status: 409
    applies_to: ["POST /watch/community-events"]

  - priority: 10
    category: business_temporal
    check: "TrainingSession.scheduled_at must be >= WatchGroup.training_cooldown_until when the cooldown is set"
    error_id: ERR_TRAINING_COOLDOWN
    http_status: 422
    applies_to: ["POST /watch/training-sessions"]

  - priority: 11
    category: business_referential
    check: "FK integrity: member.block_id belongs to member.watch_group_id; alert.target_block_id belongs to alert.watch_group_id; agreement officer precinct matches group precinct; reporter is an ACTIVE member of the report's block's group; captain-assignment member must be an ACTIVE member of a block belonging to the same watch group as the assignment's block"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: ["POST /watch/members", "POST /watch/alerts", "POST /watch/data-share-agreements", "POST /watch/incident-reports", "POST /watch/blocks/{id}/captain-assignments"]

  - priority: 11.5
    category: business_referential
    check: "BLOCK-scoped alert creation requires the target block to hold exactly one ACTIVE BlockCaptainAssignment (checked at create so the captainless-block case is reachable even when the group posture would gate a later queue/send)"
    error_id: ERR_NO_ACTIVE_CAPTAIN
    http_status: 409
    applies_to: ["POST /watch/alerts"]

  - priority: 12
    category: business_constraint
    check: "uniqueness and cardinality: street_segment unique per group among non-DEREGISTERED blocks; a member may hold at most one ACTIVE captain assignment; badge_number unique; at most one PENDING CertificationReview per watch group"
    error_id: ERR_CONSTRAINT_VIOLATION
    http_status: 409
    applies_to: ["POST /watch/watch-groups/{id}/blocks", "POST /watch/blocks/{id}/captain-assignments", "POST /watch/liaison-officers"]

  - priority: 12.5
    category: business_constraint
    check: "a second CertificationReview for a watch group that already has a PENDING or CONDITIONAL review open is rejected"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: ["POST /watch/certification-reviews"]

  - priority: 13
    category: business_constraint
    check: "field-level request validity: required fields present, enum members valid, household_count >= 1, severity in [1,5], occurred_at <= current logical clock, room_slot_end > room_slot_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH"

  - priority: 14
    category: business_fiscal
    check: "materials inventory conservation: a recall may not drive WatchGroup.sign_inventory_count or materials_inventory_count below 0; distribution may not exceed the precinct depot budget of DEPOT_SIGN_BUDGET=50 signs per group"
    error_id: ERR_INVENTORY_LIMIT
    http_status: 422
    applies_to: ["POST /watch/watch-groups/{id}/materials/issue", "POST /watch/watch-groups/{id}/materials/recall"]

  - priority: 15
    category: business_safety
    check: "data-sharing gate: incident corroboration and liaison incident reads require an ACTIVE DataShareAgreement of sufficient scope; CommunityEvent approval with estimated_attendance >= 100 requires an ACTIVE agreement for the group"
    error_id: ERR_DATA_SHARE_REQUIRED
    http_status: 409
    applies_to: ["POST /watch/incident-reports/{id}/corroborate", "GET /watch/incident-reports/{id}", "POST /watch/community-events/{id}/approve"]

  - priority: 16
    category: business_safety
    check: "certification gate: NATIONAL_NIGHT_OUT approval requires WatchGroup.certification_status == CERTIFIED; other event kinds require PROVISIONAL or CERTIFIED"
    error_id: ERR_CERTIFICATION_REQUIRED
    http_status: 409
    applies_to: ["POST /watch/community-events/{id}/approve"]

  - priority: 17
    category: auth
    check: "reporter-only resubmission: POST /watch/incident-reports/{id}/resubmit requires acting member id == reporter_member_id"
    error_id: ERR_REPORTER_ONLY
    http_status: 403
    applies_to: ["POST /watch/incident-reports/{id}/resubmit"]

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving clock ----
  - method: POST
    path: /watch/_clock/set_current_utc
    description: "Set the server's logical clock. Before any set call, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [ProgramCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["lazy DataShareAgreement ACTIVE -> EXPIRED sweep on next access"]

  # ---- WatchGroup ----
  - method: POST
    path: /watch/watch-groups
