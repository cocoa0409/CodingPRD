  # ---------------------------------------------------------------- rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: phase_gate_beats_credit_limit_on_confirm
        grounds:
          - validations[priority=5]
          - validations[priority=17]
          - state_machines.Entry.REGISTERED_to_CONFIRMED
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): confirming an entry after the
          tournament locked violates both the phase gate (priority 5, state) and the credit
          ceiling (priority 17, business_fiscal: fee 2500 > credit_limit 2400). The state
          error ERR_TOURNAMENT_PHASE_FORBIDDEN must win.
        test_recipe:
          setup:
            - "Tournament (entry_fee 2500) locked at 2026-08-10; school Alpha (credit_limit_cents 2400) with one REGISTERED entry (created pre-lock, never confirmed) and itself CONFIRMED while it had zero confirmed entries (obligation 0, vacuously SATISFIED)."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "Districts PP", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", entry_fee_cents: 2500 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha", credit_limit_cents: 2400 }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e1: $.data.id } }
            - { call: "POST /schools/${s_a}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TournamentDirector }
            - { call: "GET /tournaments/${t}", as: TournamentDirector, captures: { t_v: $.data.version } }
            - { call: "POST /tournaments/${t}/lock-registration", payload: { expected_tournament_version: "${t_v}" }, as: TournamentDirector }
          trigger:
            - { call: "POST /entries/${e1}/confirm", as: SchoolCoach, as_user_id: "${s_a}", captures: { err: $.data.error_id } }
            - { call: "GET /entries/${e1}", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}" }
          assert:
            - "error_id == ERR_TOURNAMENT_PHASE_FORBIDDEN (state priority 5 beats business_fiscal priority 17 even though the confirm would also push the projected invoice 2500 over credit_limit 2400)"
            - "Entry.${e1}.status == REGISTERED (no mutation)"
            - "School.${s_a}.invoice_balance_cents == 0 (no fee charged)"

      - name: judge_conflict_beats_turnover_on_assign
        grounds:
          - validations[priority=8]
          - validations[priority=14]
          - state_machines.Pairing.PENDING_STAFFING_to_STAFFED
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_temporal): assigning judge J-Alpha
          to the CX pairing violates both conflict-of-interest (priority 8: own school Alpha
          has an entry in the pairing) and the turnover buffer (priority 14: J-Alpha already
          staffs an LD pairing starting 15 minutes after the CX round ends). The safety error
          ERR_JUDGE_CONFLICT_OF_INTEREST must win.
        test_recipe:
          setup:
            - "Tournament (prelim_round_count 4) with divisions CX and LD; school Alpha (1 CX entry, judge J-Alpha committed 4); school Beta (1 CX + 1 LD entry, two judges committed 4 each, obligation 8 covered); school Gamma (1 LD entry, judge committed 4); all CONFIRMED; locked; CX round 1 (2026-08-12 14:00-15:30) and LD round 1 (2026-08-12 15:45-17:15) paired: CX pairing (A1,B1cx), LD pairing (B1ld,C1); J-Alpha already assigned to the LD pairing (no conflict there)."
          setup_api_calls:
