      - name: mount_zone_conflict_ignores_the_removed_occupant
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_84_ERR_MOUNT_ZONE_CONFLICT
          - state_machines.EquipmentInstallation.PLANNED_to_REMOVED
        distinguishing_aspect: |
          The uniqueness predicate is scoped to non-REMOVED rows, so the zone must be genuinely freed
          by a removal: an implementation that keys a unique index on (order, mount_zone) without the
          status filter refuses the perfectly legal re-install. The instance then re-violates the rule
          while the replacement is PLANNED to prove the check is still armed.
        test_recipe:
          setup:
            - "A CUSTOMER_SPECIFIC service order on F550-DRW-84CA whose BEHIND_CAB crane was planned and then removed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
