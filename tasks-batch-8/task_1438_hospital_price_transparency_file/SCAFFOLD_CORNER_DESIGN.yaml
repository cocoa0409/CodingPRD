            - { call: "POST /transparency/discrepancy-reports", payload: { publication_cycle_id: "${cy}", standard_charge_record_id: "${r1}", reporter_type: "CONSUMER", description: "d1" }, as: Consumer, captures: { d1: $.data.id } }
            - { call: "POST /transparency/discrepancy-reports/${d1}/triage", payload: { outcome: "DISMISSED" }, as: ComplianceAuditor }
            - { call: "POST /transparency/discrepancy-reports", payload: { publication_cycle_id: "${cy}", standard_charge_record_id: "${r1}", reporter_type: "PAYER", description: "d2" }, as: ContractManager, captures: { d2: $.data.id } }
            - { call: "POST /transparency/discrepancy-reports/${d2}/triage", payload: { outcome: "CONFIRMED" }, as: ComplianceAuditor }
          trigger:
            - { call: "POST /transparency/discrepancy-reports/${d1}/propose-correction", payload: { proposed_gross_charge_cents: 90000 }, as: TransparencyOfficer, as_user_id: "officer-a", captures: { err1: $.data.error_id } }
            - { call: "POST /transparency/discrepancy-reports/${d2}/approve-correction", as: TransparencyOfficer, as_user_id: "officer-b", captures: { err2: $.data.error_id } }
          assert:
            - "propose on DISMISSED: error_id == ERR_DISCREPANCY_NOT_ACTIONABLE (409)"
            - "approve on CONFIRMED (skipping propose): error_id == ERR_DISCREPANCY_NOT_ACTIONABLE (409)"

      - name: attestation_decision_from_wrong_state_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Facility, "errors[ERR_ATTESTATION_INVALID_STATE]"]
        distinguishing_aspect: "cms-decision ACCEPT_ATTESTATION while attestation_status == NONE (nothing submitted) fails ERR_ATTESTATION_INVALID_STATE."
        test_recipe:
          setup: ["Facility F only (attestation NONE)"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-SM12", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
          trigger:
            - { call: "POST /transparency/facilities/${fac}/cms-decision", payload: { decision: "ACCEPT_ATTESTATION" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ATTESTATION_INVALID_STATE (409)"]

      - name: list_publish_from_draft_and_display_before_publish_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ShoppableServiceList, "errors[ERR_LIST_NOT_CERTIFIED]", "errors[ERR_LIST_NOT_PUBLISHED]"]
        distinguishing_aspect: "publish from DRAFT fails ERR_LIST_NOT_CERTIFIED; display of a merely CERTIFIED list fails ERR_LIST_NOT_PUBLISHED."
        test_recipe:
          setup: ["Facility F (min 1, mandated 1); item SI1 (SHOPPABLE, mandated); list L DRAFT with entry SI1"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-SM13", bed_count: 50, shoppable_min_entries: 1, mandated_min_entries: 1 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000, cms_shoppable_mandated: true }, as: TransparencyOfficer, captures: { si1: $.data.id } }
            - { call: "POST /transparency/shoppable-service-lists", payload: { facility_id: "${fac}", title: "L", entries: [ { service_item_id: "${si1}", display_name: "MRI", bundled_ancillary_item_ids: [], include_conditional_ancillaries: false, display_order: 1 } ] }, as: TransparencyOfficer, captures: { lst: $.data.id } }
          trigger:
            - { call: "POST /transparency/shoppable-service-lists/${lst}/publish", as: TransparencyOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /transparency/shoppable-service-lists/${lst}/certify", as: TransparencyOfficer }
            - { call: "GET /transparency/shoppable-service-lists/${lst}/display", as: Consumer, captures: { err2: $.data.error_id } }
          assert:
            - "publish from DRAFT: error_id == ERR_LIST_NOT_CERTIFIED (409)"
            - "display while CERTIFIED: error_id == ERR_LIST_NOT_PUBLISHED (409)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: derived_disclosure_variant_divergence_covered
        claim_type: variant_divergence
        grounds: ["calculations.derived_disclosure"]
        excluded_because:
          difficulty_instance: derived_disclosure_exact_min_vs_mix_weighted
          rationale: "Both variants and their 55000-vs-40000 divergence are asserted there."

      - name: consumer_display_min_branch_covered
        claim_type: correct_result
        grounds: ["calculations.consumer_display_price"]
        excluded_because:
          difficulty_instance: consumer_display_price_min_branch
          rationale: "Mode-(a) nested min with confidentiality branch asserted at the display endpoint."

      - name: bundle_rounding_order_covered
        claim_type: precision
        grounds: ["calculations.bundle_ancillary_rounding"]
        excluded_because:
          difficulty_instance: bundle_ancillary_per_item_floor_rounding
          rationale: "Per-item floor vs sum-then-round one-cent divergence asserted (40598 != 40599)."

      - name: penalty_variant_divergence_covered
        claim_type: variant_divergence
        grounds: ["calculations.penalty_accrual"]
        excluded_because:
          difficulty_instance: penalty_accrual_simple_vs_tiered
          rationale: "SIMPLE 90000 vs TIERED 30000 for identical dates/beds asserted there."

      - name: flat_fee_schedule_materialization_ignores_item_gross
        claim_type: correct_result
        grounds: ["calculations.negotiated_amount_materialization"]
        distinguishing_aspect: "FEE_SCHEDULE_FLAT materializes flat_amount_cents verbatim and does NOT track item gross: after a gross PATCH from 100000 to 200000 the amount stays 12345 while a PERCENT_OF_GROSS rate on the same item would have doubled."
        test_recipe:
          setup: ["Facility F; payer PA; contract CA ACTIVE; item SI gross 100000 (v1); rate RF FEE_SCHEDULE_FLAT flat 12345 ACTIVE"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-K1", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id, si_v: $.data.version } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "FEE_SCHEDULE_FLAT", flat_amount_cents: 12345 }, as: ContractManager, captures: { rf: $.data.id, amt0: $.data.negotiated_amount_cents } }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
          trigger:
            - { call: "PATCH /transparency/service-items/${si}", payload: { gross_charge_cents: 200000, expected_service_item_version: "${si_v}" }, as: TransparencyOfficer }
            - { call: "GET /transparency/payer-negotiated-rates/${rf}", as: ContractManager, captures: { amt1: $.data.negotiated_amount_cents } }
          assert:
            - "at creation: negotiated_amount_cents == 12345"
            - "after gross PATCH: negotiated_amount_cents == 12345 (FLAT branch is item-independent)"

      - name: percent_of_medicare_tracks_medicare_base_only
        claim_type: correct_result
        grounds: ["calculations.negotiated_amount_materialization", "entities.ServiceItem.fields.medicare_base_cents"]
        distinguishing_aspect: "PERCENT_OF_MEDICARE materializes floor(medicare_base_cents * pct / 100): 150% of 20000 = 30000; a medicare_base PATCH to 30000 re-materializes 45000 while gross is untouched."
        test_recipe:
          setup: ["Facility F; payer PA; contract CA ACTIVE; item SI gross 100000 medicare_base 20000 (v1); rate RM PERCENT_OF_MEDICARE 150 ACTIVE"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-K2", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000, medicare_base_cents: 20000 }, as: TransparencyOfficer, captures: { si: $.data.id, si_v: $.data.version } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_MEDICARE", rate_percent: 150 }, as: ContractManager, captures: { rm: $.data.id, amt0: $.data.negotiated_amount_cents } }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
          trigger:
            - { call: "PATCH /transparency/service-items/${si}", payload: { medicare_base_cents: 30000, expected_service_item_version: "${si_v}" }, as: TransparencyOfficer }
            - { call: "GET /transparency/payer-negotiated-rates/${rm}", as: ContractManager, captures: { amt1: $.data.negotiated_amount_cents } }
          assert:
            - "at creation: negotiated_amount_cents == 30000 (floor(20000 * 150 / 100))"
            - "after medicare_base PATCH: negotiated_amount_cents == 45000 (floor(30000 * 150 / 100)); gross_charge_cents unchanged at 100000"

      - name: extrema_null_without_rates_and_validate_blocked
        claim_type: input_set_filtering
        grounds: ["calculations.standard_charge_extrema", "errors[ERR_NO_NEGOTIATED_RATES]"]
        distinguishing_aspect: "With zero includible ACTIVE rates the extrema/derived are null (not zero) and derivation_method == NONE; the DRAFT record then cannot validate (ERR_NO_NEGOTIATED_RATES)."
        test_recipe:
          setup: ["Facility F; item SI gross 100000; cycle CY OPEN; no contracts at all"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-K3", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id, mn: $.data.min_negotiated_cents, mx: $.data.max_negotiated_cents, der: $.data.derived_disclosure_cents, meth: $.data.derivation_method } }
          trigger:
            - { call: "POST /transparency/standard-charge-records/${r1}/validate", as: TransparencyOfficer, captures: { err: $.data.error_id } }
          assert:
            - "min_negotiated_cents IS null, max_negotiated_cents IS null, derived_disclosure_cents IS null, derivation_method == NONE (empty input set -> nulls, not zeros)"
            - "validate: error_id == ERR_NO_NEGOTIATED_RATES (422); record stays DRAFT"

      - name: aggregate_only_excluded_below_deidentification_threshold
        claim_type: input_set_filtering
        grounds: ["calculations.derived_disclosure", "calculations.payer_count_deidentification"]
        distinguishing_aspect: "An AGGREGATE_ONLY contract with payer_count == 2 (< 3) is excluded from BOTH extrema and the derived pool: derived falls back to EXACT_MIN == 40000, not the 55000 a MIX_WEIGHTED inclusion would give."
        test_recipe:
          setup: ["Facility F; payers PA (DISCLOSE_ALLOWED vol 100, 40% -> 40000), PB (AGGREGATE_ONLY vol 300, 60% -> 60000), both contracts ACTIVE; item SI gross 100000; cycle CY OPEN"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-K4", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PB", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pb: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pb}", confidentiality_clause: "AGGREGATE_ONLY", annual_volume: 300, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { cb: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${cb}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 60 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${cb}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
          trigger:
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { mn: $.data.min_negotiated_cents, mx: $.data.max_negotiated_cents, der: $.data.derived_disclosure_cents, meth: $.data.derivation_method } }
          assert:
            - "min_negotiated_cents == 40000 and max_negotiated_cents == 40000 (AGGREGATE_ONLY excluded from extrema)"
            - "derivation_method == EXACT_MIN and derived_disclosure_cents == 40000 (aggregate pool blocked: payer_count 2 < 3)"

      - name: mrf_summary_rollup_snapshot_at_generation
        claim_type: correct_result
