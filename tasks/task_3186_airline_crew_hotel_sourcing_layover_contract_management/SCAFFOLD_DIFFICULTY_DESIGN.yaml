            - call: "POST /allocations/${al_z1}/confirm"
              payload: {}
              as: CrewOps
            - call: "POST /allocations/${al_z1}/check-in"
              payload: {}
              as: HotelVendorRep
              as_user_id: "${vend_j}"
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_sna}", crew_type: "FLIGHT_ATTENDANT", crew_count: 4, arrival_time: "2026-06-03T18:00:00Z", departure_time: "2026-06-04T09:00:00Z", required_rest_hours: 12 }
              as: CrewOps
