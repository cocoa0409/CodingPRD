          - errors.ERR_DUPLICATE_COMMITMENT
          - endpoints.POST_/erm/products/{id}/commitments
        distinguishing_aspect: |
          A member may hold only one Commitment row with status IN {PLEDGED, CONFIRMED} per product, so a
          second pledge must return ERR_DUPLICATE_COMMITMENT (409), leave the first row's price untouched
          and not inflate the participant count.
