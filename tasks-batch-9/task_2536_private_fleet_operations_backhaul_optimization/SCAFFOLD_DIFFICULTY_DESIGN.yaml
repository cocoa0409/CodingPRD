              payload: {}
              as: FleetPlanner
              captures: { s12_open_1: $.data.open_scheduled_cases }
          trigger:
            - call: "POST /fleet/trips/${trip_w_id}/plan"
              payload: {}
              as: FleetPlanner
              captures: { w_status_planned: $.data.plan_status }
            - call: "GET /fleet/stores/${store_s12_id}"
              payload: {}
              as: FleetPlanner
              captures: { s12_open_2: $.data.open_scheduled_cases }
            - call: "GET /fleet/replenishment-orders/${ord_a1_id}"
              payload: {}
              as: FleetPlanner
              captures: { ord_a1_status1: $.data.status }
            - call: "POST /fleet/replenishment-orders/${ord_a2_id}/cancel"
              payload: { reason_code: "MERCH_PULLED" }
              as: FleetPlanner
              captures: { ord_a2_status1: $.data.status }
            - call: "GET /fleet/stores/${store_s12_id}"
              payload: {}
              as: FleetPlanner
              captures: { s12_open_3: $.data.open_scheduled_cases }
            - call: "POST /fleet/trips/${trip_w_id}/cancel"
              payload: { reason_code: "VOLUME_PULLED" }
              as: FleetPlanner
              captures: { w_status_cancelled: $.data.plan_status }
            - call: "GET /fleet/stores/${store_s12_id}"
              payload: {}
              as: FleetPlanner
              captures: { s12_open_4: $.data.open_scheduled_cases, s12_delivered_4: $.data.delivered_cases_total }
            - call: "GET /fleet/replenishment-orders/${ord_a1_id}"
              payload: {}
              as: FleetPlanner
              captures: { ord_a1_status2: $.data.status }
            - call: "GET /fleet/trip-stops/${w_stop_id}"
              payload: {}
              as: FleetPlanner
              captures: { w_stop_status2: $.data.status }
            - call: "GET /fleet/tractors/${trc_551_id}"
              payload: {}
              as: MaintenanceCoordinator
              captures: { trc_551_status2: $.data.status }
          assert:
            - "${s12_open_0} == 0, ${s12_delivered_0} == 0, ${ord_a1_status0} == UNSCHEDULED"
            - "${s12_open_1} == 0 - staffing a trip commits nothing; the ledger only follows the SCHEDULED filter"
            - "${w_status_planned} == PLANNED, ${ord_a1_status1} == SCHEDULED and ${s12_open_2} == 900"
            - "${ord_a2_status1} == CANCELLED while ${s12_open_3} == 900 - cancelling an UNSCHEDULED order must NOT touch the ledger, because its 500 cases were never inside it"
            - "${w_status_cancelled} == CANCELLED, ${ord_a1_status2} == UNSCHEDULED and ${s12_open_4} == 0 - the exact 900 that were added are removed, with no drift"
            - "${s12_delivered_4} == 0 - a cancelled trip delivers nothing, so the compensation moves cases out of the open ledger without crediting the delivered total"
            - "${w_stop_status2} == SKIPPED and ${trc_551_status2} == AVAILABLE - the rest of the cancel cascade also ran"
            - "at every one of the five observations Store.open_scheduled_cases equals the sum of cases over that store's SCHEDULED orders"

      - name: pay_ledgers_unwind_exactly_on_statement_reversal
        grounds:
          - entities.Domicile.accrued_pay_cents
          - entities.Driver.ytd_gross_cents
          - state_machines.DriverPayStatement
          - calculations.driver_trip_pay
          - endpoints[POST /fleet/trips/{trip_id}/complete]
          - endpoints[POST /fleet/pay-statements/{statement_id}/settle]
          - endpoints[POST /fleet/pay-statements/{statement_id}/reverse]
        distinguishing_aspect: |
          CONSERVED QUANTITIES: the two money ledgers Domicile.accrued_pay_cents
          and Driver.ytd_gross_cents, which must both equal the sum of
          gross_cents over that domicile's / driver's non-REVERSED statements.
          Three properties are asserted that the case-ledger instance cannot
          show: the accrual and the unwind are the SAME 28244 cents computed by
          the FINAL_SETTLEMENT variant; settling moves the statement and the
          trip's settlement dimension but deliberately leaves both ledgers
          untouched, so paying is not a second accrual; and the reversal also
          zeroes Trip.driver_pay_cents, so the trip-level mirror of the ledger
          is compensated too.
