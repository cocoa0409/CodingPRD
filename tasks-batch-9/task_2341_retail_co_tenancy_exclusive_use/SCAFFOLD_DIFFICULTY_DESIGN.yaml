        as_user_id: la-admin-1
        captures:
          t_i2: $.data.id
      - call: POST /tenants
        payload:
          legal_name: Pulse Fitness Group
          notice_email: legal@pulsefitness.example
          primary_use_code: FITNESS
          is_national_chain: true
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          t_i3: $.data.id
      - call: POST /centers/${ctr}/leases
        payload:
          tenant_id: ${t_a1}
          suite_code: A1
          gla_sqft: 120000
          parcel_kind: ANCHOR_BOX
          primary_use_code: DISCOUNT_DEPT
          base_rent_monthly_cents: 6000000
          commencement_date: '2026-01-01'
          expiration_date: '2036-12-31'
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          l_a1: $.data.id
      - call: POST /centers/${ctr}/leases
        payload:
          tenant_id: ${t_a2}
          suite_code: A2
