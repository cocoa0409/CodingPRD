  # ============================================================
  # Rule 5 — priority_pair_validation_conflict
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_certificate_issue
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_POSTURE_BLOCKS_ISSUANCE]
        distinguishing_aspect: |
          state (priority 6) vs business_safety (priority 9): a DRAFT
          certificate on a RESTRICTED-posture production, when issue is
          attempted, must return ERR_INVALID_STATE (priority 6 wins)
          rather than ERR_POSTURE_BLOCKS_ISSUANCE.
        test_recipe:
          setup:
            - "Production P ACTIVE with coverage_posture RESTRICTED (open INJURY claim)"
            - "Certificate c in DRAFT"
            - "Then P is wrapped and cancelled (transitions c out of DRAFT via cascade) — no, instead we directly attempt to issue a cert that has been voided already (state violation) AND posture is RESTRICTED (safety violation)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-P1"
                title: "Priority Conflict 1"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-06-15T00:00:00Z"
                budget_cents: 100000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-P1"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/certificates"
              payload:
                certificate_type: "LOCATION"
                holder_name: "Lot"
                holder_address: "1 Lot Ln"
                additional_insured_name: "Lot Owner"
                coverage_lines: ["GENERAL_LIABILITY"]
                location_start: "2026-06-01T00:00:00Z"
                location_end: "2026-06-10T00:00:00Z"
              as: BrokerAgent
              captures: { cert_id: $.data.id }
            # void the certificate to put it into VOIDED (terminal) state
            - call: "POST /productions/${prod_id}/certificates/${cert_id}/void"
              payload: {}
              as: BrokerAgent
            # Open an injury claim to make posture RESTRICTED
            - call: "POST /productions/${prod_id}/claims"
              payload:
                policy_id: "${pol_id}"
                claim_type: "INJURY"
                occurrence_date: "2026-06-05T00:00:00Z"
                loss_amount_cents: 200000
              as: ProductionManager
              captures: { claim_id: $.data.id }
            - call: "POST /productions/${prod_id}/claims/${claim_id}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v_final: $.data.version }
          trigger:
            # Attempt to issue a VOIDED certificate while posture is RESTRICTED.
            # Both state-invalid and posture-invalid hold; state (pri 6) wins.
            - call: "POST /productions/${prod_id}/certificates/${cert_id}/issue"
              payload: { expected_production_version: "${prod_v_final}" }
              as: BrokerAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: business_safety_vs_business_fiscal_on_claim_settle
        grounds:
          - validations[priority=8]
          - validations[priority=18]
          - errors[ERR_SELF_SETTLEMENT_FORBIDDEN]
          - errors[ERR_FISCAL_CONSTRAINT_VIOLATED]
        distinguishing_aspect: |
          business_safety (priority 8, segregation of duties) vs
          business_fiscal (priority 18, settlement <= reserve): when the
          same user attempts to settle their own submitted claim with an
          over-reserve amount, ERR_SELF_SETTLEMENT_FORBIDDEN wins.
        test_recipe:
          setup:
            - "Production P ACTIVE with BOUND GL policy"
            - "Claim c in UNDER_REVIEW with reserve_cents initialized"
            - "X-User-ID of the original ProductionManager who submitted = X-User-ID attempting settle (segregation violation)"
            - "settlement_amount > reserve (fiscal violation)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-P2"
