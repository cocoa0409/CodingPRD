          trigger:
            - { call: "POST /api/notices", payload: { lease_id: "${lease}", charge_ids: ["${rc}"], expected_lease_version: "${lv}" }, as: PropertyManager, captures: { n1: $.data.id } }
            - { call: "POST /api/notices", payload: { lease_id: "${lease}", charge_ids: ["${rc}"], expected_lease_version: "${lv}" }, as: PropertyManager, captures: { err: $.data.error_id } }
            - { call: "GET /api/leases/${lease}/notices", as: PropertyManager }
          assert:
            - "first create succeeds (201) and the lease version advanced by 1"
            - "captured err == ERR_STALE_VERSION with HTTP 412 for the stale expected_lease_version"
            - "exactly one notice exists and it remains DRAFT (the rejected creation superseded nothing)"

      - name: occ_plan_create_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[plan-create-stale-lease]"]
        distinguishing_aspect: "The plan write path is OCC-guarded the same way: a plan creation carrying a superseded lease version fails 412 ERR_STALE_VERSION and neither cancels nor creates anything."
        test_recipe:
          setup: ["property PA, ACTIVE lease (version observed at lv), DAMAGE_FEE 10000"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
