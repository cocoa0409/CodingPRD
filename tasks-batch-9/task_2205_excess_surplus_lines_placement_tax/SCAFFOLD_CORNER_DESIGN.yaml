          rationale: "ERR_SEGREGATION_OF_DUTIES and ERR_REMITTANCE_AMOUNT_MISMATCH are both triggered there, individually and together, on POST /filing-batches/{id}/remit."

      - name: licence_and_security_gate_error_corner
        claim_type: Error Triggerable
        excluded_because:
          difficulty_instance: policy_issuance_depends_on_the_carriers_security_status
          rationale: "ERR_CARRIER_NOT_SECURITY_APPROVED is triggered there; its sibling ERR_BROKER_LICENSE_NOT_ACTIVE is triggered by batch_submission_depends_on_the_brokers_license_status."

      - name: interval_conflict_error_corner
        claim_type: Error Triggerable
        excluded_because:
          difficulty_instance: policy_terms_on_one_placement_are_half_open_so_adjacency_is_legal
          rationale: "ERR_POLICY_TERM_OVERLAP is triggered there; ERR_ELIGIBILITY_WINDOW_CONFLICT is triggered by eligibility_windows_are_closed_intervals_with_a_thirty_day_cooling_off_buffer."

      - name: capital_minimum_error_corner
        claim_type: Error Triggerable
        excluded_because:
          difficulty_instance: alien_carrier_trust_fund_minimum_is_inclusive_at_the_threshold
          rationale: "ERR_CARRIER_BELOW_STATE_CAPITAL_MINIMUM is instead triggered by the corner instance white_listing_a_carrier_below_the_state_capital_minimum_is_refused in the endpoints section; that Difficulty instance covers the neighbouring alien-trust threshold so the two are not duplicated here."

  # ===========================================================================
  - section: rbac
    instances:

      - name: each_roles_exclusive_operations_are_closed_to_the_other_four_roles
        claim_type: exclusive_operations
        grounds:
          - roles.PlacementBroker
          - roles.ComplianceOfficer
          - roles.TaxFiler
          - roles.StateRegulator
          - roles.PlatformAdmin
          - validations.priority_3_role
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The five roles partition the workflow with no overlap outside the explicitly shared affidavit signature: a PlatformAdmin cannot calculate tax, a TaxFiler cannot register a carrier, a PlacementBroker cannot white-list a carrier, and a StateRegulator cannot open a security review. Each refusal is 403 ERR_UNAUTHORIZED and, because the role gate is priority 3, it fires before path existence — so a wrong role on an unknown id still returns 403, never 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home ISSUED policy, plus the TX program and the APPROVED carrier."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - *k_elig_tx
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
            - *k_policy
          trigger:
            - call: "POST /policies/${policy_id}/calculate-tax"
              payload: {}
              as: PlatformAdmin
              captures: { e_admin_calc: $.data.error_id }
            - call: "POST /carriers"
              payload: { naic_number: "99999", legal_name: "Filer Owned Insurance Company", domicile_type: "US_STATE", capital_surplus_cents: 5000000000, am_best_rating: "A", trust_fund_cents: 0, naic_quarterly_listing: true }
              as: TaxFiler
              as_user_id: "tf-nina"
              captures: { e_filer_carrier: $.data.error_id }
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${carrier_id}", state_program_id: "${nv_program_id}", listed_on: "2026-08-01T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { e_broker_elig: $.data.error_id }
            - call: "POST /carriers/${carrier_id}/security-reviews"
              payload: {}
              as: StateRegulator
              as_user_id: "sr-tx"
              captures: { e_regulator_review: $.data.error_id }
            - call: "POST /policies/00000000-0000-4000-8000-0000000000aa/calculate-tax"
              payload: {}
              as: PlatformAdmin
              captures: { e_admin_unknown: $.data.error_id }
          assert:
            - "all five requests return 403 with response_type error"
            - "e_admin_calc, e_filer_carrier, e_broker_elig and e_regulator_review are each ERR_UNAUTHORIZED"
            - "e_admin_unknown == ERR_UNAUTHORIZED with status 403, not ERR_POLICY_NOT_FOUND with status 404"
            - "Policy.${policy_id}.tax_status is still UNCALCULATED"
            - "GET /carrier-eligibilities?carrier_id=${carrier_id} returns exactly 1 row — the TX row only"
            - "GET /carriers/${carrier_id}/security-reviews returns exactly 1 row"

      - name: a_broker_cannot_act_on_another_brokerages_placement
        claim_type: peer_roles
        grounds:
          - validations.priority_7_ownership
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.PlacementBroker
        distinguishing_aspect: "PlacementBroker is entity-backed, so X-User-ID IS a Broker.id and ownership is checked against Placement.broker_id at priority 7 — after the role gate passes. A second, fully licensed brokerage therefore gets 403 ERR_NOT_RESOURCE_OWNER rather than ERR_UNAUTHORIZED, distinguishing 'wrong role' from 'right role, wrong owner'."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the TX program on file, a first brokerage owning a DRAFT placement, and a second unrelated brokerage."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_placement
            - call: "POST /brokers"
              payload: { firm_name: "Interloper Surplus Partners LLC", home_state: "TX" }
              as: PlatformAdmin
              captures: { other_broker_id: $.data.id }
          trigger:
            - call: "POST /placements/${placement_id}/begin-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${other_broker_id}"
              captures: { e_begin: $.data.error_id }
            - call: "POST /placements/${placement_id}/declinations"
              payload: { admitted_carrier_name: "Republic Admitted Mutual", state_code: "TX", reason_code: "NO_APPETITE", declined_on: "2026-07-10T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${other_broker_id}"
              captures: { e_decl: $.data.error_id }
          assert:
            - "both requests return 403 with e_begin == ERR_NOT_RESOURCE_OWNER and e_decl == ERR_NOT_RESOURCE_OWNER"
            - "neither returns ERR_UNAUTHORIZED"
            - "Placement.${placement_id}.status is still DRAFT and broker_id is still ${broker_id}"
            - "GET /placements/${placement_id}/declinations returns 0 rows"
            - "the identical begin-search issued as ${broker_id} returns 200"

      - name: either_the_owning_broker_or_a_compliance_officer_may_sign_an_affidavit
        claim_type: shared_operations
        grounds:
          - roles.PlacementBroker
          - roles.ComplianceOfficer
          - state_machines.Affidavit.transitions
          - endpoints.POST_/affidavits/{id}/sign
        distinguishing_aspect: "Signing is the only shared operation in the matrix, and the two roles reach it by different gates: the broker must additionally own the policy (priority 7), while a ComplianceOfficer has no ownership constraint at all. A compliance officer who took no part in the carrier's security review signs successfully and drives compliance_status to COMPLIANT."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home policy with notices affixed, its placement having pinned declination_count 3, and a DRAFT DILIGENT_SEARCH affidavit attesting 3. Atlas's security review was approved by co-anders."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - *k_elig_tx
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
            - *k_policy
            - *k_affix_notices
            - &k_affidavit
              call: "POST /policies/${policy_id}/affidavits"
              payload: { affidavit_type: "DILIGENT_SEARCH", declination_count_attested: 3 }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { affidavit_id: $.data.id }
          trigger:
            - call: "POST /affidavits/${affidavit_id}/sign"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-brigid"
          assert:
            - "the response status is 200 and Affidavit.${affidavit_id}.status == SIGNED"
            - "Affidavit.${affidavit_id}.signed_by_user_id == co-brigid and signed_at == 2026-08-01T00:00:00Z"
            - "Policy.${policy_id}.compliance_status == COMPLIANT"
            - "GET /policies/${policy_id}/affidavits?status=SIGNED returns exactly 1 row"

      - name: the_officer_who_approved_the_carrier_cannot_sign_the_policys_affidavit
        claim_type: Segregation of duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.Affidavit.transitions
          - complexity_profile.role_model
        distinguishing_aspect: "The segregation rule reaches across entities and back in time: it compares the signer's X-User-ID with the reviewer_user_id of every APPROVED or CONDITIONAL MarketSecurityReview on the policy's carrier. co-anders approved Atlas, so co-anders is barred from signing any affidavit on any Atlas policy — while co-brigid, holding the identical role, is not."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home policy with notices affixed and a DRAFT DILIGENT_SEARCH affidavit attesting 3. Atlas's security review was approved by co-anders."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - *k_elig_tx
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
            - *k_policy
            - *k_affix_notices
            - *k_affidavit
          trigger:
            - call: "POST /affidavits/${affidavit_id}/sign"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_SEGREGATION_OF_DUTIES"
            - "error_id is neither ERR_UNAUTHORIZED nor ERR_NOT_RESOURCE_OWNER"
            - "Affidavit.${affidavit_id}.status is still DRAFT with signed_by_user_id null"
            - "Policy.${policy_id}.compliance_status is still NOTICES_AFFIXED"
            - "MarketSecurityReview.${review_id}.reviewer_user_id == co-anders"
            - "the identical sign issued as co-brigid returns 200"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: an_endorsement_created_from_a_pre_notice_policy_view_is_rejected_as_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.endorsement-create-stale-policy
          - errors.ERR_STALE_POLICY_VERSION
        distinguishing_aspect: "Affixing notices is a write on the Policy row, so it bumps Policy.version even though it touches no premium field. An endorsement request holding the version read before that affix is refused 412 ERR_STALE_POLICY_VERSION; re-reading the policy and retrying with the fresh version succeeds, and the version advances again."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home policy with tax calculated, its version read back into policy_v, and notices then affixed by another writer."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - *k_elig_tx
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
            - *k_policy
            - *k_calc_tax
            - *k_get_policy_v
            - *k_affix_notices
          trigger:
            - call: "POST /policies/${policy_id}/endorsements"
              payload: { endorsement_type: "PREMIUM_INCREASE", premium_delta_cents: 200000, effective_date: "2026-09-01T00:00:00Z", supersedes_endorsement_id: null, expected_policy_version: "${policy_v}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_POLICY_VERSION"
            - "GET /policies/${policy_id} reports a version strictly greater than ${policy_v}"
            - "GET /tax-filing-lines?policy_id=${policy_id}&line_type=ENDORSEMENT returns 0 rows"
            - "re-reading the policy version and retrying the identical endorsement returns 201, after which GET /policies/${policy_id} reports a version greater again"

      - name: a_security_decision_pinning_amended_financials_is_rejected_as_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.review-decide-stale-carrier
          - errors.ERR_STALE_CARRIER_VERSION
        distinguishing_aspect: "The OCC field here guards a different parent entity — the Carrier, not the Policy — and its purpose is to stop a reviewer pinning figures they never saw. After the carrier's rating and capital are amended, the decision held against the pre-amendment version is refused 412 ERR_STALE_CARRIER_VERSION, so no score is pinned and security_status stays UNREVIEWED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Atlas registered (A_PLUS, 6,000,000,000, US_STATE, listed) with a started review and its version read into carrier_v, then its financials amended down to A_MINUS and 1,600,000,000."
          setup_api_calls:
            - *k_clock
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - call: "GET /carriers/${carrier_id}"
              payload: {}
              as: Any
              as_user_id: "co-anders"
              captures: { carrier_v: $.data.version }
            - call: "PATCH /carriers/${carrier_id}"
              payload: { capital_surplus_cents: 1600000000, am_best_rating: "A_MINUS" }
              as: PlatformAdmin
          trigger:
            - call: "POST /market-security-reviews/${review_id}/decide"
              payload: { decision: "APPROVE", expected_carrier_version: "${carrier_v}", conditions_note: null }
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_CARRIER_VERSION"
            - "MarketSecurityReview.${review_id}.status is still UNDER_REVIEW with score null and decision null"
            - "Carrier.${carrier_id}.security_status is still UNREVIEWED"
            - "GET /carriers/${carrier_id} reports a version strictly greater than ${carrier_v}"
            - "retrying with the fresh carrier version returns 200 and MarketSecurityReview.${review_id}.score == 35"

      - name: capital_tier_boundaries_step_the_score_exactly_at_the_declared_cents
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.market_security_score
          - constants.CAPITAL_TIER_1_CENTS
          - constants.CAPITAL_TIER_2_CENTS
          - constants.CAPITAL_TIER_3_CENTS
        distinguishing_aspect: "All three capital tiers are inclusive at their declared cent value, so a single cent below a boundary drops the whole tier award: with an A rating, US_STATE domicile and a NAIC listing contributing a fixed 50 points, capital of exactly 5,000,000,000 scores 90 while 4,999,999,999 scores 80, exactly 1,500,000,000 scores 80 while 1,499,999,999 scores 70, and 499,999,999 collapses to the residual 5-point award for 55 — crossing out of the APPROVE band in the process."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; five US_STATE carriers, all rated A with naic_quarterly_listing true and trust_fund_cents 0, differing only in capital_surplus_cents: 5000000000, 4999999999, 1500000000, 1499999999 and 499999999. Each has a started review."
