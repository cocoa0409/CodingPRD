      - name: slot_quota_and_daily_quota_are_distinct_gates
        claim_type: boundary
        grounds:
          - calculations.pass_slot_availability
          - errors[ERR_SLOT_QUOTA_EXHAUSTED]
          - errors[ERR_DAILY_QUOTA_EXHAUSTED]
        distinguishing_aspect: "The two pass quotas fire independently and in pinned order: the third reservation on a full slot fails ERR_SLOT_QUOTA_EXHAUSTED while a different slot still takes reservations; once the daily total reaches 3 the next reservation on a FREE slot fails ERR_DAILY_QUOTA_EXHAUSTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Timed museum: slot quota 2, daily quota 3, rate 10."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/museums"
              payload: { museum_code: "NMAAHC", display_name: "African American History", requires_timed_pass: true, quarter_hour_pass_quota: 2, daily_pass_quota: 3, screening_rate_per_quarter_hour: 10 }
              as: PlatformAdmin
