  # ===========================================================================
  # SECTION 8 — Cross-Cutting Complexity Layers
  #   optimistic_concurrency, cascading_side_effects,
  #   dual_variant_calculation, soft_delete_archival
  # ===========================================================================
  - section: Cross-Cutting Complexity Layers
    instances:
      - name: occ_app_account_create_stale_vendor_app_version_rejected
        claim_type: "optimistic_concurrency — stale expected_<parent>_version rejected (concurrency_rules[app-account-create-stale-vendor-app])"
        grounds:
          - concurrency_rules[app-account-create-stale-vendor-app]
          - "endpoints[POST /rostering/app-accounts]"
          - errors[ERR_STALE_VENDOR_APP_VERSION]
        distinguishing_aspect: "Two provisioning requests for two DIFFERENT students are both individually legal, so no state precondition separates them — the loser is rejected 412 purely because its view of the licence (total_seats, allocation split, consumed_seats) predates the first provisioning. The refusal is inert: it burns no seat, takes no charge and does not itself advance VendorApp.version, so replaying with the refreshed version succeeds unchanged."
        test_recipe:
          setup:
            - "Clock at 2026-08-20T00:00:00Z; ACTIVE Northside building; ACTIVE Term Fall 2026; students STU-2001 and STU-2002 both grade 4 ENROLLED."
            - "One ACTIVE PER_STUDENT licence total_seats 4 price 1000, sole allocation on Northside with allocated_seats 4; VendorApp at version 2 after activation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4, date_of_birth: "2016-05-04" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s1_id: $.data.id }
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2002", first_name: "Priya", last_name: "Raman", grade_level: 4, date_of_birth: "2016-07-19" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s2_id: $.data.id }
            - call: "POST /rostering/vendor-apps"
              payload: { name: "MathBlast", vendor_code: "MBX", term_id: "${term_id}", rostering_standard: "ONEROSTER_REST_1P2", identifier_strategy: "SIS_ID", username_domain: "apps.district.k12", grade_band_scope: ["ELEMENTARY"], seat_model: "PER_STUDENT", allocation_policy: "PROPORTIONAL_HEADCOUNT", overage_policy: "BLOCK", total_seats: 4, price_per_seat_cents: 1000 }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
              captures: { va_id: $.data.id }
            - call: "POST /rostering/vendor-apps/${va_id}/activate-license"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "GET /rostering/building-allocations"
              payload: { vendor_app_id: "${va_id}", school_id: "${sch_ne_id}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { alloc_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-20T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { va_stale: $.data.version }
          trigger:
            - call: "POST /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_id}", subject_type: "STUDENT", student_id: "${s1_id}", expected_vendor_app_version: "${va_stale}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { a1_id: $.data.id }
            - call: "POST /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_id}", subject_type: "STUDENT", student_id: "${s2_id}", expected_vendor_app_version: "${va_stale}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { err: "$.data.error_id" }
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
