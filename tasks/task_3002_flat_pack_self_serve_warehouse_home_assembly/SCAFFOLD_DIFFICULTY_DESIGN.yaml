            - "booking for 51 kg: fee_cents == 7400 (4900 + 2500 tier-2 flat)"
            - "the 1 kg difference at the boundary moves the fee by exactly 2500 cents"

      - name: checkout_availability_hits_exactly_zero
        grounds:
          - calculations.stock_availability_and_signal
          - state_machines.Order.DRAFT_to_PAID
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: |
          Boundary on the unit-count metric via the checkout endpoint (a
          different metric and endpoint from the weight tier): buying exactly
          the available quantity succeeds and drives availability to exactly 0
          (signal OUT_OF_STOCK), while the next unit fails with
          ERR_INSUFFICIENT_STOCK — zero-remaining edge, not a >= threshold edge.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001 (threshold 5). Customer N. Article A (price 500) single carton, on_hand 5: available == threshold so signal starts at IN_STOCK. Order 1 of qty 5; order 2 of qty 1."
