        remainder = 0'
      - PaymentMilestone.${ms1}.base_amount_cents == 33300000
      - PaymentMilestone.${ms2}.base_amount_cents == 33300000
      - PaymentMilestone.${ms3}.base_amount_cents == 33400000
      - Sum of base_amount_cents == 100000000 (season total reconciles exactly)
      - 'Order-pinned rounding matters: if weights were 0.3333, 0.3333, 0.3334 on
        a fee of 99999999 cents, per-line rounding then remainder-distribution would
        differ from sum-then-round by 1-2 cents'
- rule_id: non_linear_state_machine
  instances:
  - name: bid_cyclic_counter_offer_loop
    grounds:
    - state_machines.Bid.SHORTLISTED_to_COUNTERED
    - state_machines.Bid.COUNTERED_to_SUBMITTED
    distinguishing_aspect: 'Bid entity has a CYCLE: SHORTLISTED → COUNTERED → (successor
      bid

      DRAFT → SUBMITTED → UNDER_REVIEW → SHORTLISTED → COUNTERED …).

      Negotiation rounds are unbounded, with round_number incrementing per

      cycle. A linear pipeline would not allow revisiting SUBMITTED.

      '
    test_recipe:
      setup:
      - Asset + package + accredited broadcaster; package UNDER_NEGOTIATION
      - Round-1 bid submitted, reviewed, shortlisted
      setup_api_calls:
      - call: POST /rights-assets
        payload:
