        source: computed
        default: 0
        description: Shop commission; computed last as the residual so proceeds conserve exactly.
      - name: consignor_payout_cents
        type: integer
        source: computed
        default: 0
        description: Money credited to the consignor's ledger.
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID that created the agreement; must differ from the recorder of the sale.
      - name: status
        type: enum
        source: system
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, LISTED, SOLD, EXPIRED, WITHDRAWN"
        description: Consignment lifecycle; SOLD, EXPIRED and WITHDRAWN are terminal.

  - name: PartsLot
    parent: null
    common_fields: true
    fields:
      - name: part_type
        type: enum
        source: input
        constraints: "one of HAMMER_SET, STRING_SET, ACTION_PARTS"
        description: What the lot holds.
      - name: lot_code
        type: string
        source: input
        description: Warehouse lot code; unique across lots.
      - name: initial_qty
        type: integer
        source: input
        constraints: "integer 1..1000"
        description: Units received; the conserved total for this lot.
      - name: on_hand_qty
        type: integer
        source: computed
