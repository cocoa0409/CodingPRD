          pay_grade: E5
          separation_date: '2027-01-15'
          skills:
          - LOGISTICS
          home_installation_id: ${inst}
        as: TransitionCounselor
        captures:
          m: $.data.id
          m_v: $.data.version
      trigger:
      - call: PATCH /skillbridge/service-members/${m}
        payload:
          expected_service_member_version: ${m_v}
          skills:
          - LOGISTICS
          - CDL
        as: TransitionCounselor
        captures:
          v2: $.data.version
          sk2: $.data.skills
      - call: PATCH /skillbridge/service-members/${m}
        payload:
          expected_service_member_version: ${m_v}
          pay_grade: E6
        as: TransitionCounselor
      - call: GET /skillbridge/service-members/${m}
        as: ProgramOffice
        captures:
          pg: $.data.pay_grade
          vfin: $.data.version
      assert:
      - 'first PATCH applies: version == 2, skills == [LOGISTICS, CDL]'
      - 'second PATCH with expected 1 (stale): 412 ERR_STALE_VERSION'
      - 'member afterwards: pay_grade still E5 (loser''s write discarded), version still 2'
  - name: wage_violation_flags_and_threshold
    claim_type: optimistic_concurrency
    grounds:
    - entities.WageRecord.fields.is_violation
    - entities.Employer.fields.pending_violations
    excluded_because:
      difficulty_instance: wage_violation_threshold_cascade
      rationale: The violation flag, ledger increments, and threshold suspension are asserted hop-by-hop in that cascade instance. (claim_type
        recorded as the layer row it would have exercised; no separate test needed.)
- section: consistency_model
  instances:
  - name: immediate_visibility_after_mutations
    claim_type: immediate
    grounds:
    - complexity_profile
    distinguishing_aspect: 'Immediate consistency: a resource created or mutated is fully visible in the very next read of the same request sequence
      — no lag on the application decision or on the match appearing in the opening''s filtered list.'
    test_recipe:
      setup:
      - Member m with application app; employer emp AUTHORIZED with opening op (version 1)
      setup_api_calls:
      - call: POST /skillbridge/installations
        payload:
          name: Fort Liberty
          command_code: ACC
          region_code: R1
          max_internship_duration_days: 120
          appeal_window_days: 14
          requires_tap_complete: false
        as: ProgramOffice
        captures:
          inst: $.data.id
      - call: POST /skillbridge/service-members
        payload:
          full_name: Alice Vega
          service_branch: ARMY
          pay_grade: E5
          separation_date: '2027-01-15'
          skills:
          - LOGISTICS
          home_installation_id: ${inst}
        as: TransitionCounselor
        captures:
          m: $.data.id
      - call: POST /skillbridge/internship-applications
        payload:
          service_member_id: ${m}
        as: ServiceMember
        as_user_id: ${m}
        captures:
          app: $.data.id
      - call: POST /skillbridge/employers
        payload:
          legal_name: Acme Logistics LLC
          industry_code: LOG
        as: ProgramOffice
        captures:
          emp: $.data.id
      - call: POST /skillbridge/employers/${emp}/authorize
        payload: {}
        as: ProgramOffice
      - call: POST /skillbridge/employer-openings
        payload:
          employer_id: ${emp}
          title: Warehouse Operations Intern
          required_skills:
          - LOGISTICS
          location_type: REMOTE
          capacity: 1
        as: EmployerRep
        as_user_id: ${emp}
        captures:
          op: $.data.id
          op_v: $.data.version
      trigger:
      - call: GET /skillbridge/internship-applications/${app}
        as: ProgramOffice
        captures:
          st1: $.data.status
      - call: POST /skillbridge/internship-applications/${app}/commander-decision
        payload:
          decision: APPROVE
        as: UnitCommander
        as_user_id: cmd-1
      - call: GET /skillbridge/internship-applications/${app}
        as: ProgramOffice
        captures:
          st2: $.data.status
          by2: $.data.decided_by_user_id
          at2: $.data.decided_at
      - call: POST /skillbridge/internship-matches
        payload:
          internship_application_id: ${app}
          employer_opening_id: ${op}
          start_date: '2026-10-01'
          end_date: '2026-10-31'
          expected_employer_opening_version: ${op_v}
        as: EmployerRep
        as_user_id: ${emp}
        captures:
          mt: $.data.id
      - call: GET /skillbridge/internship-matches?employer_opening_id=${op}
        as: ProgramOffice
      assert:
      - 'immediately after creation: GET shows status == SUBMITTED'
      - 'immediately after commander-decision: GET shows status == APPROVED, decided_by_user_id == cmd-1, decided_at == 2026-09-01T00:00:00Z (logical
        clock stamp)'
      - 'immediately after match creation: the opening-filtered list contains exactly ${mt}'
