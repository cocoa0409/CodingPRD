            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T09:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SALE_ACTIVE }, as: EventOrganizer }
            - { call: "POST /pos-transactions", payload: { sale_event_id: "${ev_id}" }, as: Cashier, captures: { tx_id: $.data.id } }
            - { call: "POST /pos-transactions/${tx_id}/lines", payload: { barcode: "${bc1}" }, as: Cashier }
            - { call: "POST /pos-transactions/${tx_id}/checkout", payload: { tendered_cents: 1000 }, as: Cashier }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-07T15:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SETTLEMENT }, as: EventOrganizer }
            - { call: "GET /sale-events/${ev_id}", payload: {}, as: EventOrganizer, captures: { ev_v: $.data.version } }
            - { call: "POST /sale-events/${ev_id}/generate-settlements", payload: { expected_sale_event_version: "${ev_v}" }, as: EventOrganizer, captures: { s_id: "$.data[0].id" } }
            - { call: "POST /settlements/${s_id}/finalize", payload: {}, as: EventOrganizer }
          trigger:
            - { call: "POST /settlements/${s_id}/mark-paid", payload: {}, as: EventOrganizer, captures: { err: $.data.error_id } }
            - { call: "POST /items/${it2}/pickup", payload: {}, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /settlements/${s_id}/mark-paid", payload: {}, as: EventOrganizer }
            - { call: "GET /settlements/${s_id}", payload: {}, as: EventOrganizer }
          assert:
            - "First mark-paid: error_id == ERR_ITEMS_NOT_TERMINAL (409) because Item.${it2} is UNSOLD"
            - "After pickup: Item.${it2}.status == PICKED_UP and second mark-paid succeeds"
            - "Settlement.${s_id}.status == PAID"

  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_signup_half_open_adjacency
        grounds:
          - calculations.shift_overlap_check
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: strict pairwise half-open [start, end) intersection on
          the Volunteer resource — a shift starting exactly when another ends
          (12:00 == 12:00) is NOT a conflict, but a 1-hour partial overlap is.
        test_recipe:
          setup:
            - "Event in DRAFT; volunteer Sam; shifts A 08:00-12:00, B 12:00-14:00, C 11:00-13:00 on 2026-05-28."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Sam", email: "sam@x.com" }, as: Anonymous, captures: { v_id: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { sale_event_id: "${ev_id}", role_name: "Floor", start_time: "2026-05-28T08:00:00Z", end_time: "2026-05-28T12:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { shA: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { sale_event_id: "${ev_id}", role_name: "Floor", start_time: "2026-05-28T12:00:00Z", end_time: "2026-05-28T14:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { shB: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { sale_event_id: "${ev_id}", role_name: "Floor", start_time: "2026-05-28T11:00:00Z", end_time: "2026-05-28T13:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { shC: $.data.id } }
          trigger:
            - { call: "POST /shift-signups", payload: { shift_id: "${shA}", volunteer_id: "${v_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { suA: $.data.id } }
            - { call: "POST /shift-signups", payload: { shift_id: "${shB}", volunteer_id: "${v_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { suB: $.data.id } }
            - { call: "POST /shift-signups", payload: { shift_id: "${shC}", volunteer_id: "${v_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { err: $.data.error_id } }
          assert:
            - "Signup A (08:00-12:00) succeeds"
            - "Signup B (12:00-14:00, adjacent end==start) succeeds — half-open semantics"
            - "Signup C (11:00-13:00, overlaps A by 1h and B by 1h): error_id == ERR_SHIFT_OVERLAP (409)"
            - "ShiftSignup.${suA}.status == SIGNED_UP and ShiftSignup.${suB}.status == SIGNED_UP"

      - name: slot_aggregate_capacity_not_pairwise
        grounds:
          - calculations.slot_capacity_check
          - entities.DropOffSlot.fields.capacity
        distinguishing_aspect: |
          Different interval semantics on a different resource: DropOffSlot uses
          aggregate capacity, not pairwise interval exclusion — two bookings
          occupying the IDENTICAL window 10:00-12:00 coexist because capacity 2 is
          not exhausted; a pairwise-overlap rule would have rejected the second.
        test_recipe:
          setup:
            - "Event in INTAKE_OPEN; slot 2026-06-02T10:00-12:00 capacity 2; consignors Tal and Uli."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 2 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Tal", email: "tal@x.com" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Uli", email: "uli@x.com" }, as: Anonymous, captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c1}" }, as: Consignor, as_user_id: "${c1}", captures: { b1: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c2}" }, as: Consignor, as_user_id: "${c2}", captures: { b2: $.data.id } }
            - { call: "GET /drop-off-slots", payload: { sale_event_id: "${ev_id}" }, as: EventOrganizer }
          assert:
            - "Both bookings on the fully-overlapping same window succeed (aggregate capacity semantics)"
            - "DropOffSlot.${slot_id}.booked_count == 2"
            - "DropOffBooking.${b1}.status == BOOKED and DropOffBooking.${b2}.status == BOOKED"

  - rule_id: compensating_invariant
    instances:
      - name: checkout_void_conserves_event_gross
        grounds:
          - calculations.event_gross_reconciliation
          - state_machines.POSTransaction.COMPLETED_to_VOIDED
          - entities.SaleEvent.fields.sold_gross_cents
        distinguishing_aspect: |
          Conserved quantity: money. The checkout (+2000) and void-of-completed
          (-2000) pair leaves SaleEvent.sold_gross_cents and every
          Consignor.sold_gross_cents unchanged (0 == 0), and the invariant
          sold_gross_cents == SUM(COMPLETED total_cents) holds at every step.
        test_recipe:
          setup:
            - "Event in SALE_ACTIVE; consignor Val's item (price 2000) ON_FLOOR."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Val", email: "val@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 2 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { bk_id: $.data.id } }
            - { call: "POST /drop-off-bookings/${bk_id}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Game", category: TOYS, price_cents: 2000 }, as: Consignor, as_user_id: "${c_id}", captures: { item_id: $.data.id, bc: $.data.barcode } }
            - { call: "POST /items/${item_id}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Insp Ira", email: "ira@x.com" }, as: Anonymous, captures: { v_insp: $.data.id } }
            - { call: "POST /items/${item_id}/inspect", payload: { outcome: PASS }, as: Inspector, as_user_id: "${v_insp}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T18:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T17:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: PRESALE_DAY }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T09:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SALE_ACTIVE }, as: EventOrganizer }
          trigger:
            - { call: "POST /pos-transactions", payload: { sale_event_id: "${ev_id}" }, as: Cashier, captures: { tx_id: $.data.id } }
            - { call: "POST /pos-transactions/${tx_id}/lines", payload: { barcode: "${bc}" }, as: Cashier }
            - { call: "POST /pos-transactions/${tx_id}/checkout", payload: { tendered_cents: 2000 }, as: Cashier }
            - { call: "GET /sale-events/${ev_id}", payload: {}, as: EventOrganizer }
            - { call: "POST /pos-transactions/${tx_id}/void", payload: {}, as: EventOrganizer }
            - { call: "GET /sale-events/${ev_id}", payload: {}, as: EventOrganizer }
            - { call: "GET /consignors/${c_id}", payload: {}, as: EventOrganizer }
          assert:
            - "After checkout: SaleEvent.${ev_id}.sold_gross_cents == 2000 == SUM of COMPLETED total_cents"
            - "After void: SaleEvent.${ev_id}.sold_gross_cents == 0 and Consignor.${c_id}.sold_gross_cents == 0 (compensating pair leaves no drift)"
            - "Item.${item_id}.status == ON_FLOOR after the void"

      - name: scan_remove_conserves_sellable_count
        grounds:
          - calculations.sellable_inventory_invariant
          - state_machines.Item.ON_FLOOR_to_IN_CART
          - state_machines.Item.IN_CART_to_ON_FLOOR
        distinguishing_aspect: |
          Conserved quantity: item count (different type than money).
          sellable_count = |ON_FLOOR|+|IN_CART|+|SOLD| stays 2 across the scan
          (ON_FLOOR->IN_CART) / line-removal (IN_CART->ON_FLOOR) compensating pair.
        test_recipe:
          setup:
            - "Event in SALE_ACTIVE; consignor Wes has two items ON_FLOOR; an OPEN transaction exists."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Wes", email: "wes@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 2 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { bk_id: $.data.id } }
            - { call: "POST /drop-off-bookings/${bk_id}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Toy A", category: TOYS, price_cents: 500 }, as: Consignor, as_user_id: "${c_id}", captures: { it1: $.data.id, bc1: $.data.barcode } }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Toy B", category: TOYS, price_cents: 600 }, as: Consignor, as_user_id: "${c_id}", captures: { it2: $.data.id } }
            - { call: "POST /items/${it1}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /items/${it2}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Insp Ira", email: "ira@x.com" }, as: Anonymous, captures: { v_insp: $.data.id } }
            - { call: "POST /items/${it1}/inspect", payload: { outcome: PASS }, as: Inspector, as_user_id: "${v_insp}" }
            - { call: "POST /items/${it2}/inspect", payload: { outcome: PASS }, as: Inspector, as_user_id: "${v_insp}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T18:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T17:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: PRESALE_DAY }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T09:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SALE_ACTIVE }, as: EventOrganizer }
            - { call: "POST /pos-transactions", payload: { sale_event_id: "${ev_id}" }, as: Cashier, captures: { tx_id: $.data.id } }
          trigger:
            - { call: "POST /pos-transactions/${tx_id}/lines", payload: { barcode: "${bc1}" }, as: Cashier, captures: { ln1: $.data.id } }
            - { call: "GET /items", payload: { sale_event_id: "${ev_id}", status: "ON_FLOOR" }, as: EventOrganizer }
            - { call: "GET /items", payload: { sale_event_id: "${ev_id}", status: "IN_CART" }, as: EventOrganizer }
            - { call: "DELETE /pos-transactions/${tx_id}/lines/${ln1}", payload: {}, as: Cashier }
            - { call: "GET /items", payload: { sale_event_id: "${ev_id}", status: "ON_FLOOR" }, as: EventOrganizer }
            - { call: "GET /items", payload: { sale_event_id: "${ev_id}", status: "IN_CART" }, as: EventOrganizer }
          assert:
            - "After scan: ON_FLOOR total_count == 1 and IN_CART total_count == 1 (sellable_count still 2)"
            - "After line removal: ON_FLOOR total_count == 2 and IN_CART total_count == 0 (compensating pair, no count drift)"
            - "Item.${it1}.status == ON_FLOOR after the removal"
