            - { call: "POST /api/initiatives", payload: { unit_id: "${un}", domain: "CLEANLINESS", baseline_cycle_id: "${c1}", evaluation_cycle_id: "${c2}", target_score: 85.0 }, as: ProgramAdmin, captures: { ini: "$.data.id" } }
