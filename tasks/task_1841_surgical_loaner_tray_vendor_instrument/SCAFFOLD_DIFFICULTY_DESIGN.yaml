  - rule_id: resource_temporal_overlap
    instances:
      - name: or_room_buffered_half_open_conflict
        grounds:
          - calculations.calc_delivery_deadline
          - errors[ERR_ROOM_TIME_CONFLICT]
          - entities.ORRoom.fields.turnover_buffer_minutes
        distinguishing_aspect: |
          ORRoom resource with PAIRWISE buffered half-open semantics: case B starting exactly
          buffer (30 min) after case A's end is ALLOWED (gap >= buffer), while 1 minute less
          (11:29 after a 09:00-11:00 case) is rejected ERR_ROOM_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Room OR-1 buffer 30; case A 2026-08-03 09:00-11:00 already created"
          setup_api_calls:
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1", turnover_buffer_minutes: 30 }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-A", or_room_id: "${room_id}", procedure_type: "TOTAL_KNEE", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T11:00:00Z" }, as: ORScheduler, captures: { caseA_id: $.data.id } }
          trigger:
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-B", or_room_id: "${room_id}", procedure_type: "TOTAL_HIP", surgeon_name: "Dr. B", scheduled_start_at: "2026-08-03T11:30:00Z", scheduled_end_at: "2026-08-03T13:00:00Z" }, as: ORScheduler, captures: { caseB_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-C", or_room_id: "${room_id}", procedure_type: "TOTAL_HIP", surgeon_name: "Dr. C", scheduled_start_at: "2026-08-03T11:29:00Z", scheduled_end_at: "2026-08-03T13:00:00Z" }, as: ORScheduler, captures: { err: $.data.error_id } }
          assert:
            - "Case B (gap exactly 30 == buffer) created with status SCHEDULED (boundary is inclusive: new_start >= existing_end + buffer is allowed)"
            - "Case C (gap 29 < buffer) rejected: ${err} == ERR_ROOM_TIME_CONFLICT"
            - "GET /vendor-office/cases?or_room_id=${room_id} -> total_count == 2"

      - name: sterilizer_slot_capacity_count
        grounds:
          - state_machines.SterilizationTurn.DECONTAMINATING_to_STERILIZING
          - entities.SterilizerUnit.fields.slot_capacity
          - errors[ERR_STERILIZER_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          SterilizerUnit resource with AGGREGATE-CAPACITY semantics (different interval semantics
          than the room's pairwise buffered rule): cycles on a unit overlap by construction (all
          start at 'now'), and the guard is a count — 2 active cycles on a 2-slot unit admit no
          third, while 1 active admits a second.
        test_recipe:
          setup:
