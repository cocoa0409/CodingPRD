- section: errors
  instances:
  - name: error_envelope_shape_on_failure
    claim_type: violation_to_error
    grounds:
    - response_envelope
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: 'Error responses use the fixed error envelope: response_type ''error'', data.error_id and data.message present.'
    test_recipe:
      setup:
      - one shop exists
      setup_api_calls:
      - call: POST /shops
        payload:
          name: Shop
          stalls: 1
          dwell_rate_cents_per_hour: 100
        as: ShopAdmin
        captures:
          s: $.data.id
      trigger:
      - call: GET /parts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: Any
        captures:
          err: $.data.error_id
          msg: $.data.message
      assert:
      - response_type == 'error' and data.error_id == ERR_NOT_FOUND
      - data.message is a non-empty string
  - name: slot_create_in_past_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_SLOT_IN_PAST]
    - validations[priority=12]
    distinguishing_aspect: A slot whose ends_at is at or before the logical clock now is rejected at creation.
    test_recipe:
      setup:
      - shop exists; clock at 2026-05-01T08:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T08:00:00Z'
        as: ShopAdmin
      - call: POST /shops
        payload:
          name: Shop
          stalls: 2
          dwell_rate_cents_per_hour: 500
        as: ShopAdmin
        captures:
          s: $.data.id
      trigger:
      - call: POST /shop-slots
        payload:
          shop_id: ${s}
          stall_id: S1
          starts_at: '2026-04-30T08:00:00Z'
          ends_at: '2026-04-30T16:00:00Z'
        as: ShopAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_SLOT_IN_PAST
  - name: duplicate_part_number_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DUPLICATE_PART_NUMBER]
    - entities.PartItem.fields.part_number
    distinguishing_aspect: part_number is unique per shop; a second create with the same number fails with ERR_DUPLICATE_PART_NUMBER.
    test_recipe:
      setup:
      - part H-100 already exists in the shop
      setup_api_calls:
      - call: POST /shops
        payload:
          name: Shop
          stalls: 2
          dwell_rate_cents_per_hour: 500
        as: ShopAdmin
        captures:
          s: $.data.id
      - call: POST /parts
        payload:
          shop_id: ${s}
          part_number: H-100
          description: Gladhand air hose
          unit_price_cents: 4500
          on_hand_qty: 10
          reorder_threshold: 2
        as: ShopAdmin
      trigger:
      - call: POST /parts
        payload:
          shop_id: ${s}
          part_number: H-100
          description: duplicate
          unit_price_cents: 4600
          on_hand_qty: 5
          reorder_threshold: 1
        as: ShopAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_DUPLICATE_PART_NUMBER
      - GET /parts?shop_id=${s} returns total_count == 1
