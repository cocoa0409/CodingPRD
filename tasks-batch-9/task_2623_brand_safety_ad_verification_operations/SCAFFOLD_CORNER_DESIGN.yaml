              payload: { page_id: "${page_out}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_out_ver}", classifier_kind: "HUMAN", category_codes: ["GAMBLING"], ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
