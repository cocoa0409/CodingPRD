- section: validations
  instances:
  - name: request_missing_auth_headers_returns_unauthenticated
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: Any endpoint call without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or business check runs.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /hub/enrollments
        payload:
          program_id: 00000000-0000-0000-0000-000000000000
          patient_ref: PAT-V1
          diagnosis_code: C50
        as: CaseManager
        captures:
          err: $.data.error_id
      assert:
      - 'the test sends NO X-User-Role / X-User-ID headers: HTTP 401 and ${err} == ERR_UNAUTHENTICATED (priority 1 beats the nonexistent program_id, which would be 404)'
  - name: existence_404_precedes_business_checks
    claim_type: priority_ordering
    grounds:
    - validations[priority=3]
    - validations[priority=4]
    distinguishing_aspect: A shipment create against a nonexistent enrollment returns 404 ERR_ENROLLMENT_NOT_FOUND (priority 3) even though the payload would also fail state/business gates.
    test_recipe:
