              captures: { tier_after: "$.data.commission_tier" }
          assert:
            - "${rate_at_threshold} == 0.2500 exactly: gross_hammer_cents 1000000 over listed_retail_value_cents 4000000"
            - "at 0.2500 the seller is promoted: SellerAccount.${s1}.commission_tier == TIER_PREFERRED and commission_rate_bps == 1500 (the comparison is >=, inclusive)"
            - "publishing lot two adds 2000 to listed_retail_value_cents without adding any hammer: the denominator becomes 4002000"
            - "${rate_below_threshold} == 0.2499 == round_half_up(1000000 / 4002000, 4) - one ten-thousandth below the threshold"
            - "${tier_after} == TIER_STANDARD with commission_rate_bps == 2000: the demotion happens on a publication, with no sale and no claim involved"
            - "net_recovery_rate stays 0.0000 throughout because no order has reached settlement_basis == FINAL"
            - "SaleOrder for ${lst1} keeps buyer_premium_bps 1400 and total_due_cents 1148500; seller_commission_rate_bps is still null because it is only frozen at pickup completion"

      - name: claim_approval_cascade_reaches_the_seller_commission_tier
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - calculations.manifest_accuracy_score
          - calculations.seller_probation_evaluation
          - calculations.commission_tier_assignment
        excluded_because:
          difficulty_instance: transitive_cascade / claim_approval_cascades_through_lot_score_to_seller_probation_tier
          rationale: >
            That instance already walks the four-level chain (claim decision -> Lot
            manifest_accuracy_score -> SellerAccount manifest_accuracy_avg -> account_status ->
            commission_tier) end to end with intermediate assertions at every hop, and its
            compensating twin verifies the reversal path. A breadth instance would only restate
            the same chain with fewer checks.

      - name: provisional_and_final_settlement_variants_differ_by_the_freight_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.order_settlement.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / order_settlement_provisional_vs_final_freight_delta
          rationale: >
            The depth instance already asserts both variants on the same order and proves the
            delta equals the freight delta exactly, including the case where the actual freight is
            lower than the estimate. Repeating it here adds no new discrimination beyond naming
            the layer.

  # ===========================================================================
  # Guide section 9 - Consistency Model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_write_is_fully_visible_in_its_own_response_and_in_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model[immediate]
          - endpoints[POST /liquidation/sale-orders/{id}/payments]
          - endpoints[POST /liquidation/listings/{id}/bids]
          - calculations.buyer_exposure
          - calculations.order_settlement
        distinguishing_aspect: >
          Nothing lags by a request: the fixed-price purchase's cascade-created SaleOrder is
          already queryable in the very next call, the payment response body itself carries the
          recomputed amount_paid_cents/balance_due_cents/payment_status rather than the pre-write
          values, and the denormalised BuyerAccount.outstanding_exposure_cents and
          SellerAccount aggregates match on the first read with no settling period. Re-reading a
          second time returns byte-identical values, so nothing converges late either.
        test_recipe:
          setup:
            - "A 200-unit lot (declared retail 2000000) has an OPEN FIXED_PRICE listing at 1000000; one qualified buyer holds a 10000000-cent limit."
            - "The clock stands at 2026-08-06T01:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts"
              payload: { legal_name: "Gulf Resale Co", tax_id: "B-2001", state_code: "TX", contact_email: "buy@gulf.example", resale_certificate_number: "TX-RC-77", resale_certificate_expires_on: "2027-01-31", requested_credit_limit_cents: 10000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ba: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts/${ba}/qualification-decisions"
              payload: { decision: "QUALIFY", business_verified: true, approved_credit_limit_cents: 10000000 }
              as: TrustSafety
              as_user_id: "ts-1"
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Immediate visibility lot", category_code: "TOYS", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lot1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "TOY-IM", unit_count: 200, unit_retail_cents: 10000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot1}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot1}/manifest-reviews"
              payload: { decision: "APPROVE", review_note: "immediate lot verified" }
              as: MarketplaceOps
              as_user_id: "ops-review-1"
            - call: "POST /liquidation/lots/${lot1}/listings"
              payload: { listing_format: "FIXED_PRICE", resale_channel: "MARKETPLACE_RESALE", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-20T00:00:00Z", ask_price_cents: 1000000 }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lst1: "$.data.id" }
            - call: "POST /liquidation/listings/${lst1}/publications"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T01:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /liquidation/listings/${lst1}/bids"
              payload: { buyer_id: "${ba}", amount_cents: 1000000 }
              as: Buyer
              as_user_id: "${ba}"
              captures: { bid1: "$.data.id", bid_status_now: "$.data.bid_status" }
            - call: "GET /liquidation/sale-orders"
              payload: { listing_id: "${lst1}" }
              as: Buyer
              as_user_id: "${ba}"
              captures: { so1: "$.data[0].id", total_now: "$.data[0].total_due_cents" }
            - call: "POST /liquidation/sale-orders/${so1}/payments"
              payload: { amount_cents: 500000 }
              as: Buyer
              as_user_id: "${ba}"
              captures: { paid_in_response: "$.data.amount_paid_cents", balance_in_response: "$.data.balance_due_cents", status_in_response: "$.data.payment_status" }
            - call: "GET /liquidation/buyer-accounts/${ba}"
              payload: {}
              as: Buyer
              as_user_id: "${ba}"
              captures: { exposure_first_read: "$.data.outstanding_exposure_cents" }
            - call: "GET /liquidation/buyer-accounts/${ba}"
              payload: {}
              as: Buyer
              as_user_id: "${ba}"
              captures: { exposure_second_read: "$.data.outstanding_exposure_cents" }
            - call: "GET /liquidation/seller-accounts/${s1}"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
              captures: { gross_now: "$.data.gross_hammer_cents" }
          assert:
            - "${bid_status_now} == WON in the bid's own response body: the fixed-price purchase resolves inside the same request"
            - "the very next read already returns the cascade-created order, so ${so1} is non-null and ${total_now} == 1148500 (hammer 1000000 + 1400 bps premium 140000 + 1 pallet freight 8500)"
            - "${paid_in_response} == 500000, ${balance_in_response} == 648500 and ${status_in_response} == PARTIALLY_PAID - all read off the payment response itself, with no follow-up GET required"
            - "${exposure_first_read} == 648500: the WON bid has dropped out of the bid exposure set and the order balance has replaced it, denormalised at write time"
            - "${exposure_second_read} == ${exposure_first_read} - a second read converges on nothing new, which is what distinguishes immediate from eventual"
            - "${gross_now} == 1000000 and SellerAccount.${s1}.listed_retail_value_cents == 2000000 in that same first read, giving gross_recovery_rate 0.5000"
            - "Listing.${lst1}.listing_status == CLOSED_SOLD and Lot.${lot1}.lot_status == SOLD are both already true when read immediately after the purchase"
