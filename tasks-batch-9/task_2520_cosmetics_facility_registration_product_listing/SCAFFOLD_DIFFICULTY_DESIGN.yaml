            - call: "POST /cosmetics/listings/${lst_id}/distribution-records"
              payload: { lot_code: "LOT-K1", consignee_name: "Rocky Mountain Distributors", consignee_class: "WHOLESALE", ship_date: "2026-08-03T00:00:00Z", delivery_date: "2026-08-07T00:00:00Z", units_shipped: 1000 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { dr_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/recall-actions"
              payload: { initiation_basis: "VOLUNTARY_NOTICE", hazard_class: "CLASS_I" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { rec_id: $.data.id }
            - call: "POST /cosmetics/recall-actions/${rec_id}/plan"
              payload: { corrective_summary: "Consumer-level retrieval with press notice", distribution_depth: "CONSUMER" }
              as: ResponsiblePersonAgent
