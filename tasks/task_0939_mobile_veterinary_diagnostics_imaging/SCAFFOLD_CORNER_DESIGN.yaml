scaffold_corner_design:
  - section: entities
    instances:
      - name: clinic_creation_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Clinic.fields.business_open_minute
          - entities.Clinic.fields.business_close_minute
          - entities.Clinic.fields.business_days
          - entities.Clinic.fields.billing_hold_status
        distinguishing_aspect: "POST /clinics with only name and address_zone returns 201 with status ACTIVE, billing_hold_status CLEAR, business_open_minute 480, business_close_minute 1020, business_days [0,1,2,3,4], version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clinics"
              payload: { name: "Default Vet", address_zone: "ZD" }
              as: PlatformAdmin
              captures: { cd: $.data.id, cd_open: $.data.business_open_minute, cd_close: $.data.business_close_minute, cd_hold: $.data.billing_hold_status, cd_ver: $.data.version, cd_status: $.data.status }
          assert:
            - "HTTP status == 201"
            - "${cd_open} == 480"
            - "${cd_close} == 1020"
            - "${cd_hold} == CLEAR"
            - "${cd_status} == ACTIVE"
            - "${cd_ver} == 1"
            - "Clinic.${cd}.business_days == [0, 1, 2, 3, 4]"
            - "Clinic.${cd}.created_at is an ISO 8601 UTC timestamp with three fractional digits equal to 2026-05-04T09:00:00.000Z"

      - name: clinic_retrieval_returns_the_stored_entity
        claim_type: Retrieval
        grounds: ["endpoints"]
        distinguishing_aspect: "GET /clinics/{clinic_id} returns exactly the row created, with the same id and the overridden business calendar rather than the defaults."
        test_recipe:
          setup: ["one clinic created with a non-default 07:00-15:00 Mon-Sat calendar"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Early Bird Vet", address_zone: "ZE", business_open_minute: 420, business_close_minute: 900, business_days: [0, 1, 2, 3, 4, 5] }
              as: PlatformAdmin
              captures: { ce: $.data.id }
          trigger:
            - call: "GET /clinics/${ce}"
              payload: {}
              as: Scheduler
              captures: { got_open: $.data.business_open_minute, got_close: $.data.business_close_minute, got_id: $.data.id }
          assert:
            - "${got_id} == ${ce}"
            - "${got_open} == 420"
            - "${got_close} == 900"
            - "Clinic.${ce}.business_days == [0, 1, 2, 3, 4, 5]"

      - name: equipment_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ["endpoints", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /equipment?limit=2&offset=0 over three rows returns 2 items with total_count 3 and has_more true; offset 2 returns 1 item with has_more false."
        test_recipe:
          setup: ["three modality units registered against one mobile unit"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mobile-units"
              payload: { name: "Van List" }
              as: PlatformAdmin
              captures: { ul: $.data.id }
            - call: "POST /equipment"
              payload: { modality: "RADIOGRAPHY", serial_label: "L-1", assigned_unit_id: "${ul}" }
              as: PlatformAdmin
            - call: "POST /equipment"
              payload: { modality: "ULTRASOUND", serial_label: "L-2", assigned_unit_id: "${ul}" }
              as: PlatformAdmin
            - call: "POST /equipment"
              payload: { modality: "CT", serial_label: "L-3", assigned_unit_id: "${ul}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /equipment"
              payload: { assigned_unit_id: "${ul}", limit: 2, offset: 0 }
              as: PlatformAdmin
              captures: { first_id: "$.data[0].id" }
            - call: "GET /equipment"
              payload: { assigned_unit_id: "${ul}", limit: 2, offset: 2 }
              as: PlatformAdmin
          assert:
            - "first page returns exactly 2 items with meta total_count == 3 and has_more == true"
            - "second page returns exactly 1 item with total_count == 3 and has_more == false"
            - "${first_id} is the equipment created first (created_at ASC ordering)"

      - name: study_get_with_unknown_uuid_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_STUDY_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET /studies/{study_id} for a syntactically valid but unknown UUID returns 404 ERR_STUDY_NOT_FOUND, not 200 with a null body."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /studies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Scheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_STUDY_NOT_FOUND"
            - "HTTP status == 404"
            - "response_type == error"

      - name: referral_missing_required_species_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_VALIDATION]", "validations[priority=5]", "endpoints"]
        distinguishing_aspect: "POST /referrals without the required species field returns 400 ERR_VALIDATION and creates no Referral row."
        test_recipe:
          setup: ["one ACTIVE clinic"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Shape Vet", address_zone: "ZS" }
              as: PlatformAdmin
              captures: { cs: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { clinic_id: "${cs}", patient_name: "Nameless", study_kind: "TELERAD", requested_modality: "RADIOGRAPHY" }
              as: ClinicUser
              as_user_id: "${cs}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_VALIDATION"
            - "HTTP status == 400"
            - "GET /referrals?clinic_id=${cs} returns 0 rows"

      - name: specialist_invalid_modality_privilege_enum_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_ENUM]", "validations[priority=6]", "entities.Specialist.fields.modality_privileges"]
        distinguishing_aspect: "POST /specialists with modality_privileges containing MRI — not a member of the closed modality enum — returns 400 ERR_INVALID_ENUM, distinct from the missing-field code ERR_VALIDATION."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /specialists"
              payload: { full_name: "Dr Wrong", modality_privileges: ["MRI"], species_privileges: ["CANINE"], stat_eligible: false }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_ENUM"
            - "HTTP status == 400"

      - name: study_computed_species_and_kind_copied_from_referral_not_from_input
        claim_type: Computed Fields
        grounds:
          - entities.Study.fields.species
          - entities.Study.fields.study_kind
          - entities.Study.fields.priority
        distinguishing_aspect: "POST /studies accepts only appointment_id, modality and body_region; species, study_kind and priority are copied from the parent Referral (FELINE / TELERAD / STAT), and modality may legitimately differ from Referral.requested_modality."
        test_recipe:
          setup: ["one TELERAD STAT referral for a FELINE patient requesting RADIOGRAPHY, scheduled as an appointment"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Copy Vet", address_zone: "ZC" }
              as: PlatformAdmin
              captures: { cc: $.data.id }
            - call: "POST /referrals"
              payload: { clinic_id: "${cc}", patient_name: "Suki", species: "FELINE", study_kind: "TELERAD", requested_modality: "RADIOGRAPHY", priority: "STAT", clinical_history: "acute collapse" }
              as: ClinicUser
              as_user_id: "${cc}"
              captures: { rc: $.data.id }
            - call: "POST /referrals/${rc}/accept"
              payload: {}
              as: Scheduler
            - call: "POST /appointments"
              payload: { referral_id: "${rc}" }
              as: Scheduler
              captures: { ac: $.data.id }
          trigger:
            - call: "POST /studies"
              payload: { appointment_id: "${ac}", modality: "ULTRASOUND", body_region: "ABDOMEN" }
              as: ClinicUser
              as_user_id: "${cc}"
              captures: { sc: $.data.id, sc_species: $.data.species, sc_kind: $.data.study_kind, sc_prio: $.data.priority, sc_src: $.data.priority_source, sc_mod: $.data.modality, sc_tgt: $.data.tat_target_minutes }
          assert:
            - "${sc_species} == FELINE"
            - "${sc_kind} == TELERAD"
            - "${sc_prio} == STAT"
            - "${sc_src} == NATIVE"
            - "${sc_mod} == ULTRASOUND"
            - "${sc_tgt} == 60"
            - "Study.${sc}.workflow_status == ORDERED"
            - "Study.${sc}.qc_status == PENDING_QC"
            - "Study.${sc}.tat_status == ACCRUING"
            - "Study.${sc}.billing_status == UNBILLED"
            - "Study.${sc}.equipment_id == null"
            - "Study.${sc}.technician_id == null"

      - name: qc_check_is_append_only_with_no_version_field
        claim_type: Immutability
        grounds: ["entities.QcCheck", "endpoints"]
        distinguishing_aspect: "QcCheck declares common_fields false: the created row exposes id and created_at but no version and no updated_at, and §1.5 offers no endpoint that mutates a QcCheck once written."
        test_recipe:
          setup: ["one calibrated ULTRASOUND unit and one ULTRASOUND-certified technician"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mobile-units"
              payload: { name: "Van Imm" }
              as: PlatformAdmin
              captures: { ui: $.data.id }
            - call: "POST /equipment"
              payload: { modality: "ULTRASOUND", serial_label: "IMM-1", assigned_unit_id: "${ui}" }
              as: PlatformAdmin
              captures: { ei: $.data.id }
            - call: "POST /equipment/${ei}/calibrate"
              payload: { calibration_valid_from: "2026-05-01T00:00:00Z", calibration_valid_until: "2026-05-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /technicians"
              payload: { full_name: "Ines Bo", certified_modalities: ["ULTRASOUND"] }
              as: PlatformAdmin
              captures: { ti: $.data.id }
          trigger:
            - call: "POST /qc-checks"
              payload: { equipment_id: "${ei}", performed_by_technician_id: "${ti}", result: "PASS", note: "phantom within tolerance" }
              as: FieldTech
              as_user_id: "${ti}"
              captures: { qi: $.data.id, qi_at: $.data.performed_at, qi_aff: $.data.affected_study_count }
          assert:
            - "HTTP status == 201"
            - "${qi_aff} == 0"
            - "${qi_at} == 2026-05-04T09:00:00.000Z"
            - "the response body carries id and created_at but neither version nor updated_at"
            - "Equipment.${ei}.last_passing_qc_at == 2026-05-04T09:00:00.000Z"
            - "Equipment.${ei}.usage_count_since_qc == 0"

      - name: study_creation_against_unknown_appointment_returns_not_found
        claim_type: Parent Relationships
        grounds: ["errors[ERR_APPOINTMENT_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "POST /studies naming an appointment_id that exists nowhere returns 404 ERR_APPOINTMENT_NOT_FOUND, proving body-referenced foreign keys are existence-checked at rung 4 before any business rule runs."
        test_recipe:
          setup: ["one ACTIVE clinic, no appointments"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Orphan Vet", address_zone: "ZO" }
              as: PlatformAdmin
              captures: { co: $.data.id }
          trigger:
            - call: "POST /studies"
              payload: { appointment_id: "11111111-2222-4333-8444-555555555555", modality: "CT", body_region: "HEAD" }
              as: ClinicUser
              as_user_id: "${co}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_APPOINTMENT_NOT_FOUND"
            - "HTTP status == 404"

      - name: study_repeat_link_is_discoverable_through_the_self_referential_filter
        claim_type: Creation
        grounds:
          - entities.Study.fields.repeat_of_study_id
          - calculations.repeat_billability
          - state_machines.Study.workflow.REPEAT_PENDING_to_NOT_PERFORMED
        distinguishing_aspect: "A replacement study created by POST /studies/{study_id}/repeat with repeat_cause QC_FAILURE is NON_BILLABLE, carries repeat_of_study_id pointing at its source, and is the only row returned by GET /studies?repeat_of_study_id=<source>."
        test_recipe:
          setup:
            - "one TELERAD study uploaded and then image-QC'd REPEAT_REQUIRED, so it sits in REPEAT_PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Redo Vet", address_zone: "ZR" }
              as: PlatformAdmin
              captures: { cr: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Hub QC Three", certified_modalities: ["RADIOGRAPHY"] }
              as: PlatformAdmin
              captures: { tr: $.data.id }
            - call: "POST /referrals"
              payload: { clinic_id: "${cr}", patient_name: "Ollie", species: "CANINE", study_kind: "TELERAD", requested_modality: "RADIOGRAPHY", priority: "ROUTINE", clinical_history: "lameness" }
              as: ClinicUser
              as_user_id: "${cr}"
              captures: { rr: $.data.id }
            - call: "POST /referrals/${rr}/accept"
              payload: {}
              as: Scheduler
            - call: "POST /appointments"
              payload: { referral_id: "${rr}" }
              as: Scheduler
              captures: { ar: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${ar}", modality: "RADIOGRAPHY", body_region: "ELBOW" }
              as: ClinicUser
              as_user_id: "${cr}"
              captures: { sr: $.data.id }
            - call: "POST /studies/${sr}/upload"
              payload: { image_count: 2 }
              as: ClinicUser
              as_user_id: "${cr}"
            - call: "POST /studies/${sr}/qc"
              payload: { qc_result: "REPEAT_REQUIRED" }
              as: FieldTech
              as_user_id: "${tr}"
          trigger:
            - call: "POST /studies/${sr}/repeat"
              payload: { repeat_cause: "QC_FAILURE" }
              as: ClinicUser
              as_user_id: "${cr}"
              captures: { sr2: $.data.id, sr2_link: $.data.repeat_of_study_id, sr2_bill: $.data.billing_status, sr2_wf: $.data.workflow_status, sr2_cause: $.data.repeat_cause }
          assert:
            - "HTTP status == 201"
            - "${sr2_link} == ${sr}"
            - "${sr2_bill} == NON_BILLABLE"
            - "${sr2_wf} == ORDERED"
            - "${sr2_cause} == QC_FAILURE"
            - "Study.${sr}.workflow_status == NOT_PERFORMED"
            - "Study.${sr}.repeat_count == 1"
            - "GET /studies?repeat_of_study_id=${sr} returns exactly 1 row whose id == ${sr2}"
            - "Appointment.${ar}.ordered_studies_count == 2"
            - "Appointment.${ar}.pending_studies_count == 1"
            - "Appointment.${ar}.not_performed_studies_count == 1"

  - section: state_machines
    instances:
      - name: cancel_study_twice_second_attempt_returns_study_terminal
        claim_type: Idempotency
        grounds: ["validations[priority=19]", "errors[ERR_STUDY_TERMINAL]", "state_machines.Study.workflow.ORDERED_to_CANCELLED"]
        distinguishing_aspect: "The second POST /studies/{study_id}/cancel on an already-CANCELLED study returns 409 ERR_STUDY_TERMINAL and does not recompute or double the cancellation fee."
        test_recipe:
          setup:
            - "one TELERAD study in ORDERED under an ACTIVE clinic"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Twice Vet", address_zone: "ZT" }
              as: PlatformAdmin
              captures: { ct2: $.data.id }
            - call: "POST /referrals"
              payload: { clinic_id: "${ct2}", patient_name: "Echo", species: "CANINE", study_kind: "TELERAD", requested_modality: "ULTRASOUND", priority: "ROUTINE", clinical_history: "recheck" }
              as: ClinicUser
              as_user_id: "${ct2}"
              captures: { rt2: $.data.id }
            - call: "POST /referrals/${rt2}/accept"
              payload: {}
              as: Scheduler
            - call: "POST /appointments"
              payload: { referral_id: "${rt2}" }
              as: Scheduler
              captures: { at2: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${at2}", modality: "ULTRASOUND", body_region: "ABDOMEN" }
              as: ClinicUser
              as_user_id: "${ct2}"
              captures: { st2: $.data.id }
            - call: "POST /studies/${st2}/cancel"
              payload: { cancel_reason: "owner withdrew" }
              as: ClinicUser
              as_user_id: "${ct2}"
              captures: { fee_first: $.data.cancellation_fee_cents, wf_first: $.data.workflow_status }
          trigger:
            - call: "POST /studies/${st2}/cancel"
              payload: { cancel_reason: "owner withdrew again" }
              as: ClinicUser
              as_user_id: "${ct2}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${wf_first} == CANCELLED"
            - "${fee_first} == 0"
            - "${err_id} == ERR_STUDY_TERMINAL"
            - "HTTP status == 409"
            - "Study.${st2}.cancellation_fee_cents == 0"
            - "Study.${st2}.billing_status == NON_BILLABLE"
            - "a TELERAD study has no route stop and therefore no lead time, so its cancellation fee is structurally 0"

      - name: arrive_on_a_planned_stop_before_dispatch_returns_stop_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.RouteStop.EN_ROUTE_to_ARRIVED", "validations[priority=17]", "errors[ERR_STOP_INVALID_STATE]"]
        distinguishing_aspect: "A stop only becomes EN_ROUTE as a fan-out of route dispatch; arriving while it is still PLANNED returns 409 ERR_STOP_INVALID_STATE and leaves arrived_at null."
        test_recipe:
          setup: ["one PUBLISHED but undispatched route with one PLANNED stop"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Early Arrive Vet", address_zone: "ZA" }
              as: PlatformAdmin
              captures: { ca2: $.data.id }
            - call: "POST /mobile-units"
              payload: { name: "Van A2" }
              as: PlatformAdmin
              captures: { ua2: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Pat Nam", certified_modalities: ["RADIOGRAPHY"] }
              as: PlatformAdmin
              captures: { ta2: $.data.id }
            - call: "POST /routes"
              payload: { mobile_unit_id: "${ua2}", technician_id: "${ta2}", service_date: "2026-05-04", shift_start_minute: 480, shift_end_minute: 900 }
              as: Scheduler
              captures: { ra2: $.data.id, ra2_v: $.data.version }
            - call: "POST /routes/${ra2}/stops"
              payload: { clinic_id: "${ca2}", planned_arrival_minute: 540, service_minutes: 30, drive_minutes_from_prev: 10, stop_priority: "ROUTINE", expected_route_version: "${ra2_v}" }
              as: Scheduler
              captures: { sa2: $.data.id }
            - call: "POST /routes/${ra2}/publish"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /route-stops/${sa2}/arrive"
              payload: {}
              as: FieldTech
              as_user_id: "${ta2}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_STOP_INVALID_STATE"
            - "HTTP status == 409"
            - "RouteStop.${sa2}.status == PLANNED"
            - "RouteStop.${sa2}.arrived_at == null"

      - name: completed_route_freezes_every_later_stop_write
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Route.DISPATCHED_to_COMPLETED", "validations[priority=12]", "errors[ERR_ROUTE_FROZEN]", "write_gate_precedence.order.G5_ROUTE_FROZEN"]
        distinguishing_aspect: "Once Route.status == COMPLETED, gate G5 rejects POST /route-stops/{stop_id}/cancel with ERR_ROUTE_FROZEN even though the stop itself is in a state that would otherwise admit cancellation."
        test_recipe:
          setup: ["one route dispatched, its single stop arrived and departed, and the route completed"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Frozen Vet", address_zone: "ZF" }
              as: PlatformAdmin
              captures: { cf: $.data.id }
            - call: "POST /mobile-units"
              payload: { name: "Van F" }
              as: PlatformAdmin
              captures: { uf: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Gil Roth", certified_modalities: ["RADIOGRAPHY"] }
              as: PlatformAdmin
              captures: { tf: $.data.id }
            - call: "POST /routes"
              payload: { mobile_unit_id: "${uf}", technician_id: "${tf}", service_date: "2026-05-04", shift_start_minute: 480, shift_end_minute: 900 }
              as: Scheduler
              captures: { rf2: $.data.id, rf2_v: $.data.version }
            - call: "POST /routes/${rf2}/stops"
              payload: { clinic_id: "${cf}", planned_arrival_minute: 540, service_minutes: 30, drive_minutes_from_prev: 10, stop_priority: "ROUTINE", expected_route_version: "${rf2_v}" }
              as: Scheduler
              captures: { sf: $.data.id }
            - call: "POST /routes/${rf2}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /routes/${rf2}/dispatch"
              payload: {}
              as: FieldTech
              as_user_id: "${tf}"
            - call: "POST /route-stops/${sf}/arrive"
              payload: {}
              as: FieldTech
              as_user_id: "${tf}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:25:00Z" }
              as: PlatformAdmin
            - call: "POST /route-stops/${sf}/depart"
              payload: {}
              as: FieldTech
              as_user_id: "${tf}"
            - call: "POST /routes/${rf2}/complete"
              payload: {}
              as: FieldTech
              as_user_id: "${tf}"
          trigger:
            - call: "POST /route-stops/${sf}/cancel"
              payload: { cancel_reason: "too late" }
              as: Scheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_ROUTE_FROZEN"
            - "HTTP status == 409"
