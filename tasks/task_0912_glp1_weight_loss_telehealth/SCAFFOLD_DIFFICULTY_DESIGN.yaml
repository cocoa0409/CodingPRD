  # =========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: consult_fifteen_minute_buffer_on_provider_calendar
        grounds:
          - validations[priority=11]
          - errors[ERR_CONSULT_SLOT_CONFLICT]
          - entities.Consult.fields.scheduled_start_at
        distinguishing_aspect: |
          Resource one is Provider, and its interval semantics widen BOTH sides by
          CONSULT_BUFFER_MINUTES: a consult starting exactly 15 minutes after the previous one
          ends is accepted, while one starting 14 minutes after is rejected — pure adjacency is
          not enough on this calendar.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z."
            - "A CA-licensed clinician holds one SCHEDULED consult on 2026-06-03 from 15:00 to 15:30 for a CA patient."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710008001" }
              as: PlatformAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /glp1/patients"
              payload: { email: "zed@example.com", full_name: "Zed Marek", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { pat_id: "$.data.id" }
            - call: "POST /glp1/consults"
              payload: { patient_id: "${pat_id}", provider_id: "${doc_id}", scheduled_start_at: "2026-06-03T15:00:00Z", scheduled_end_at: "2026-06-03T15:30:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { con1_id: "$.data.id" }
          trigger:
            - call: "POST /glp1/consults"
              payload: { patient_id: "${pat_id}", provider_id: "${doc_id}", scheduled_start_at: "2026-06-03T15:45:00Z", scheduled_end_at: "2026-06-03T16:15:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { con2_id: "$.data.id" }
            - call: "POST /glp1/consults"
              payload: { patient_id: "${pat_id}", provider_id: "${doc_id}", scheduled_start_at: "2026-06-03T16:29:00Z", scheduled_end_at: "2026-06-03T16:59:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { buffer_error: "$.data.error_id" }
          assert:
            - "the 15:45 booking returns HTTP 201 and Consult.${con2_id}.status == SCHEDULED, because 15:45 is exactly 15 minutes after 15:30"
            - "the 16:29 booking returns HTTP 409 with error_id ERR_CONSULT_SLOT_CONFLICT, because 16:29 is only 14 minutes after the 16:15 end of Consult.${con2_id}"
            - "GET /glp1/consults with provider_id ${doc_id} returns total_count == 2"

      - name: coaching_zero_buffer_adjacency_on_coach_calendar
        grounds:
          - validations[priority=11]
          - errors[ERR_COACH_SLOT_CONFLICT]
          - entities.CoachingSession.fields.scheduled_start_at
        distinguishing_aspect: |
          Resource two is the coach's CoachingSession calendar, and its interval semantics are the
          opposite of the consult rule: a half-open comparison with zero buffer, so a session
