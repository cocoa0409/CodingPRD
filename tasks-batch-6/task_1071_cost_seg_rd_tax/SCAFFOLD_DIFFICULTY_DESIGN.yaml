  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_submit_review
        grounds:
          - validations[priority=4]
          - validations[priority=13]
        distinguishing_aspect: |
          A study in SCOPING (no engineer assigned, zero ALLOCATED components) submitted for review fails
          both the state precondition (priority 4, category state) and the empty-set fiscal check
          (priority 13, category business_fiscal); the state error ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "ACTIVE client; property; COST_SEGREGATION study scoped (SCOPING) but not assigned; no components"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Conf Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "Prep Eng", email: "prep8@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "7 Main", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager }
          trigger:
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: referential_beats_constraint_on_add_component
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Adding an AssetComponent (allocated_cost_cents=0) to an RD_CREDIT study fails both the
          referential type check (priority 6, business_referential) and the amount check (priority 7,
          business_constraint); ERR_STUDY_TYPE_MISMATCH wins — a different category pair from the
          state-vs-fiscal conflict.
        test_recipe:
          setup:
            - "ACTIVE client; RD_CREDIT study (DRAFT)"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Conf Co2", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "RD_CREDIT", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /engineers", payload: { full_name: "Prep Eng", email: "prep9@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
          trigger:
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "bad", asset_class: "FIVE_YEAR", allocated_cost_cents: 0 }, as: Engineer, as_user_id: "${eng}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STUDY_TYPE_MISMATCH"
            - "http status == 409"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fee_percent_bps_at_cap_boundary
        grounds:
          - validations[priority=11]
          - calculations.study_fee
          - entities.Study.fields.fee_percent_bps
        distinguishing_aspect: |
          fee_percent_bps exactly 3000 (== MAX_FEE_BPS) is accepted (<= boundary), whereas 3001 would be
          rejected with ERR_FEE_PERCENT_TOO_HIGH; the metric is a numeric threshold on the scope endpoint.
        test_recipe:
          setup:
            - "ACTIVE client; property; COST_SEGREGATION study (DRAFT)"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Cap Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "8 Main", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
          trigger:
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "PERCENT", fee_percent_bps: 3000, property_id: "${prop}" }, as: StudyManager, captures: { status: "$.data.status", bps: "$.data.fee_percent_bps" } }
          assert:
            - "Study.${st}.status == SCOPING"
            - "Study.${st}.fee_percent_bps == 3000"

      - name: submit_review_empty_allocated_set
        grounds:
          - validations[priority=13]
          - state_machines.Study.ENGINEERING_to_IN_REVIEW
        distinguishing_aspect: |
          submit-review on a COST_SEGREGATION study in ENGINEERING with zero ALLOCATED components hits the
          empty-collection edge and returns ERR_NO_ALLOCATED_COMPONENTS; the metric is an empty-set count
          on a different endpoint (submit-review) than the fee-cap threshold.
        test_recipe:
          setup:
            - "ACTIVE client; property; COST_SEGREGATION study scoped and engineer assigned (ENGINEERING); no components allocated"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Empty Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "Prep Eng", email: "prep10@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "9 Main", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
          trigger:
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NO_ALLOCATED_COMPONENTS"
            - "http status == 409"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: study_create_requires_active_client
        grounds:
          - state_machines.Client.ONBOARDING_to_ACTIVE
          - errors[ERR_CLIENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Study creation is rejected (ERR_CLIENT_NOT_ACTIVE) when the referenced Client is still ONBOARDING;
          the pair is (Study -> Client).
        test_recipe:
          setup:
            - "A Client left in ONBOARDING (never activated)"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Onb Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
          trigger:
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_CLIENT_NOT_ACTIVE"
            - "http status == 409"

      - name: audit_case_requires_delivered_study
        grounds:
          - state_machines.Study.FINALIZED_to_DELIVERED
          - validations[priority=4]
        distinguishing_aspect: |
          Opening an AuditSupportCase is rejected with ERR_INVALID_STATE when the Study is only FINALIZED
          (not yet DELIVERED); the pair is (AuditSupportCase -> Study), different from (Study -> Client).
