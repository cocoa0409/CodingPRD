            - call: "POST /ocean-billing/terminals/${term_oak}/holidays"
              payload: { holiday_date: "2026-09-07T00:00:00Z", name: "Labor Day" }
              as: TerminalOperator
            - call: "POST /ocean-billing/terminals/${term_oak}/appointment-slots"
              payload: { slot_date: "2026-09-11T00:00:00Z", slot_seq: 1, capacity: 1 }
              as: TerminalOperator
              captures: { slot_r: $.data.id }
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-R", legal_name: "Rosemary Goods" }
              as: ContractManager
              captures: { acct_r: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${acct_r}/service-contracts"
              payload: { contract_ref: "CTR-R", demurrage_free_days: 2, detention_free_days: 5, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { ctr_r: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${ctr_r}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${term_oak}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000227", equipment_type: "DRY40", customer_account_id: "${acct_r}", service_contract_id: "${ctr_r}", terminal_id: "${term_oak}", discharge_ts: "2026-09-08T12:00:00Z", available_ts: "2026-09-09T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_r: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_r}/mark-available"
              payload: {}
              as: TerminalOperator
          trigger:
            - call: "POST /ocean-billing/containers/${cntr_r}/appointments"
              payload: { slot_id: "${slot_r}" }
              as: TerminalOperator
              captures: { bk_r: $.data.booking_id }
            - call: "GET /ocean-billing/terminal-appointment-slots/${slot_r}"
              payload: {}
              as: TerminalOperator
              captures: { slot_r_mid_status: $.data.status, slot_r_mid_count: $.data.booked_count }
            - call: "POST /ocean-billing/containers/${cntr_r}/appointments/${bk_r}/cancel"
              payload: {}
              as: TerminalOperator
            - call: "GET /ocean-billing/terminal-appointment-slots/${slot_r}"
              payload: {}
              as: TerminalOperator
              captures: { slot_r_end_status: $.data.status, slot_r_end_count: $.data.booked_count }
            - call: "POST /ocean-billing/containers/${cntr_r}/appointments"
              payload: { slot_id: "${slot_r}" }
              as: TerminalOperator
              captures: { bk_r2: $.data.booking_id }
          assert:
            - "slot_r_mid_status == FULL and slot_r_mid_count == 1 (book increments occupancy to capacity)"
            - "slot_r_end_status == OPEN and slot_r_end_count == 0 (cancel exactly compensates the book — occupancy invariant restored with no drift)"
            - "bk_r2 is a non-null booking id (the slot accepts a fresh booking after the cancel)"
