# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2214: Dental Support Organization Practice Integration
#
# Every numeric literal in an `assert:` line below was produced by executing the
# corresponding §1.3 `formula:` as code against the inputs pinned in `setup:` /
# `trigger:` — none is an estimate.
#
# Shared fixture conventions used across instances:
#   * logical clock starts at the mandated default 2026-08-01T00:00:00Z
#   * the affiliation baseline_ebitda_cents and earnout_pool_cents are both
#     90000000, so the earn-out tier arithmetic is reproducible
#   * practices are in IL and every doctor's license_state is IL, so the
#     corporate-practice licence check passes unless an instance targets it
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: earnout_provisional_annualization_vs_final_lag_holdback
        grounds:
          - calculations.earnout_payout
          - state_machines.EarnoutTranche.PROJECTED_to_RESERVED
          - state_machines.EarnoutTranche.RESERVED_to_SETTLED
          - entities.EarnoutTranche.fields.variant_applied
          - entities.EarnoutTranche.fields.lag_holdback_cents
          - entities.EarnoutTranche.fields.annualized_net_collections_cents
        distinguishing_aspect: |
          The PROVISIONAL variant scales reported collections and expenses by
          365/181 and withholds nothing, while the FINAL variant withholds 250
          bps of collections and scales nothing; on the same tranche this yields
          reserved_cents 14216163 against awarded_cents 41921250 and a
          lag_holdback_cents of 0 against 10500000.
        test_recipe:
          setup:
            - "One Affiliation CLOSED at logical clock 2026-09-01T00:00:00Z with earnout_pool_cents 90000000, baseline_ebitda_cents 90000000 and earnout_measurement_state OPEN."
            - "One Practice AFFILIATED in IL with one ACTIVE DoctorEmployment and one EFFECTIVE ServiceAgreement."
            - "One EarnoutTranche PROJECTED covering [2026-09-01, 2027-09-01); the logical clock stands at 2027-03-01T00:00:00Z, exactly 181 days after measurement_start."
          setup_api_calls:
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DsoIntegrationLead
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
            - call: "POST /dso/conversion-vendors"
              payload: { name: "ChartBridge Conversions", max_concurrent_windows: 3 }
              as: DsoIntegrationLead
              captures: { vendor_id: "$.data.id" }
            - call: "POST /dso/practices"
              payload: { affiliation_id: "${aff_id}", conversion_vendor_id: "${vendor_id}", name: "Elm Street Dental", state_code: "IL", charts_total_expected: 5000 }
              as: DsoIntegrationLead
              captures: { prac_id: "$.data.id" }
            - call: "POST /dso/doctors"
              payload: { full_name: "Ana Reyes", npi: "1710000001", license_number: "IL-DDS-4410", license_state: "IL", specialty: "GENERAL", is_seller_owner: true }
              as: DsoIntegrationLead
              captures: { doc_id: "$.data.id" }
            - call: "POST /dso/doctor-employments"
              payload: { practice_id: "${prac_id}", doctor_id: "${doc_id}", base_salary_monthly_cents: 1800000, collections_pct_bps: 3000, comp_model: "MONTHLY_MIN_GUARANTEE", legacy_annual_comp_cents: 24000000, post_close_term_months: 36, non_compete_months: 24, non_compete_radius_miles: 10 }
              as: DsoIntegrationLead
              captures: { emp_id: "$.data.id" }
            - call: "POST /dso/affiliations/${aff_id}/advance-diligence"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/service-agreements"
              payload: { practice_id: "${prac_id}", fee_model: "PCT_OF_COLLECTIONS", mgmt_fee_bps: 1800 }
              as: DsoDealCounsel
              captures: { msa_id: "$.data.id" }
            - call: "POST /dso/service-agreements/${msa_id}/line-items"
              payload: { service_code: "SVC-RCM-01", service_domain: "BILLING", monthly_fee_cents: 250000 }
              as: DsoDealCounsel
            - call: "POST /dso/service-agreements/${msa_id}/submit-legal-review"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/affiliations/${aff_id}/sign"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/service-agreements/${msa_id}/make-effective"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/doctor-employments/${emp_id}/accept-offer"
              payload: {}
              as: Dentist
              as_user_id: "${doc_id}"
            - call: "POST /dso/affiliations/${aff_id}/close"
              payload: {}
              as: DsoIntegrationLead
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: DsoFinanceController
            - call: "GET /dso/affiliations/${aff_id}"
              payload: {}
              as: DsoFinanceController
              captures: { aff_v: "$.data.version" }
            - call: "POST /dso/earnout-tranches"
              payload: { affiliation_id: "${aff_id}", period_label: "EO-Y1", measurement_start: "2026-09-01T00:00:00Z", measurement_end: "2027-09-01T00:00:00Z", expected_affiliation_version: "${aff_v}" }
              as: DsoFinanceController
              captures: { tr_id: "$.data.id" }
          trigger:
            - call: "POST /dso/earnout-tranches/${tr_id}/reserve"
              payload: { reported_net_collections_cents: 210000000, reported_expenses_cents: 151000000 }
              as: DsoFinanceController
              as_user_id: "u-fin-reserver"
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2027-09-02T00:00:00Z" }
              as: DsoFinanceController
            - call: "POST /dso/earnout-tranches/${tr_id}/settle"
              payload: { final_net_collections_cents: 420000000, final_expenses_cents: 285000000 }
              as: DsoFinanceController
              as_user_id: "u-fin-settler"
          assert:
            - "After reserve: EarnoutTranche.${tr_id}.variant_applied == PROVISIONAL"
            - "After reserve: EarnoutTranche.${tr_id}.annualized_net_collections_cents == 423480663"
            - "After reserve: EarnoutTranche.${tr_id}.annualized_expenses_cents == 304502762"
            - "After reserve: EarnoutTranche.${tr_id}.lag_holdback_cents == 0"
            - "After reserve: EarnoutTranche.${tr_id}.management_fee_cents == 23291436"
            - "After reserve: EarnoutTranche.${tr_id}.adjusted_ebitda_cents == 95686465"
            - "After reserve: EarnoutTranche.${tr_id}.growth_bps == 632 and multiple_bps == 25000"
            - "After reserve: EarnoutTranche.${tr_id}.reserved_cents == 14216163 and status == RESERVED"
            - "After settle: EarnoutTranche.${tr_id}.variant_applied == FINAL"
            - "After settle: EarnoutTranche.${tr_id}.lag_holdback_cents == 10500000"
            - "After settle: EarnoutTranche.${tr_id}.management_fee_cents == 22522500"
            - "After settle: EarnoutTranche.${tr_id}.adjusted_ebitda_cents == 101977500"
            - "After settle: EarnoutTranche.${tr_id}.growth_bps == 1331 and multiple_bps == 35000"
            - "After settle: EarnoutTranche.${tr_id}.awarded_cents == 41921250 and reserved_cents == 0"
            - "EarnoutTranche.${tr_id}.awarded_cents != EarnoutTranche.${tr_id}.reserved_cents observed after reserve (41921250 != 14216163)"
            - "Affiliation.${aff_id}.earnout_unallocated_cents == 48078750 and earnout_settled_cents == 41921250"

      - name: doctor_comp_monthly_guarantee_vs_annual_true_up
        grounds:
          - calculations.doctor_compensation
          - entities.DoctorEmployment.fields.comp_model
          - entities.DoctorEmployment.fields.harmonized_annual_comp_cents
          - entities.DoctorEmployment.fields.harmonization_delta_cents
          - validations[priority=50]
        distinguishing_aspect: |
          Two ACTIVE employments fed the identical 12-month collections series
          [5000000 x6, 7500000 x6], base 1800000/month and 3000 bps diverge
          purely by comp_model: MONTHLY_MIN_GUARANTEE returns 24300000 because
          six weak months are floored at the guarantee, while ANNUAL_TRUE_UP
          returns 22500000 because strong months absorb weak ones.
        test_recipe:
          setup:
            - "One Affiliation CLOSED at 2026-09-01T00:00:00Z; one Practice AFFILIATED in IL with integration_posture STABILIZING."
            - "Two ACTIVE DoctorEmployments at that practice, both with base_salary_monthly_cents 1800000, collections_pct_bps 3000 and legacy_annual_comp_cents 24000000; employment A uses comp_model MONTHLY_MIN_GUARANTEE and employment B uses ANNUAL_TRUE_UP."
          setup_api_calls:
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DsoIntegrationLead
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
            - call: "POST /dso/conversion-vendors"
              payload: { name: "ChartBridge Conversions", max_concurrent_windows: 3 }
              as: DsoIntegrationLead
              captures: { vendor_id: "$.data.id" }
            - call: "POST /dso/practices"
              payload: { affiliation_id: "${aff_id}", conversion_vendor_id: "${vendor_id}", name: "Elm Street Dental", state_code: "IL", charts_total_expected: 5000 }
              as: DsoIntegrationLead
              captures: { prac_id: "$.data.id" }
            - call: "POST /dso/doctors"
              payload: { full_name: "Ana Reyes", npi: "1710000001", license_number: "IL-DDS-4410", license_state: "IL", specialty: "GENERAL", is_seller_owner: true }
              as: DsoIntegrationLead
              captures: { doc_a_id: "$.data.id" }
            - call: "POST /dso/doctors"
              payload: { full_name: "Beto Alvarez", npi: "1710000002", license_number: "IL-DDS-5521", license_state: "IL", specialty: "GENERAL", is_seller_owner: false }
              as: DsoIntegrationLead
              captures: { doc_b_id: "$.data.id" }
            - call: "POST /dso/doctor-employments"
              payload: { practice_id: "${prac_id}", doctor_id: "${doc_a_id}", base_salary_monthly_cents: 1800000, collections_pct_bps: 3000, comp_model: "MONTHLY_MIN_GUARANTEE", legacy_annual_comp_cents: 24000000, post_close_term_months: 36, non_compete_months: 24, non_compete_radius_miles: 10 }
              as: DsoIntegrationLead
              captures: { emp_a_id: "$.data.id" }
            - call: "POST /dso/doctor-employments"
              payload: { practice_id: "${prac_id}", doctor_id: "${doc_b_id}", base_salary_monthly_cents: 1800000, collections_pct_bps: 3000, comp_model: "ANNUAL_TRUE_UP", legacy_annual_comp_cents: 24000000, post_close_term_months: 36, non_compete_months: 24, non_compete_radius_miles: 10 }
              as: DsoIntegrationLead
              captures: { emp_b_id: "$.data.id" }
            - call: "POST /dso/affiliations/${aff_id}/advance-diligence"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/service-agreements"
              payload: { practice_id: "${prac_id}", fee_model: "PCT_OF_COLLECTIONS", mgmt_fee_bps: 1800 }
              as: DsoDealCounsel
              captures: { msa_id: "$.data.id" }
            - call: "POST /dso/service-agreements/${msa_id}/line-items"
              payload: { service_code: "SVC-RCM-01", service_domain: "BILLING", monthly_fee_cents: 250000 }
              as: DsoDealCounsel
            - call: "POST /dso/service-agreements/${msa_id}/submit-legal-review"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/affiliations/${aff_id}/sign"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/service-agreements/${msa_id}/make-effective"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/doctor-employments/${emp_a_id}/accept-offer"
              payload: {}
              as: Dentist
              as_user_id: "${doc_a_id}"
            - call: "POST /dso/doctor-employments/${emp_b_id}/accept-offer"
              payload: {}
              as: Dentist
              as_user_id: "${doc_b_id}"
            - call: "POST /dso/affiliations/${aff_id}/close"
              payload: {}
              as: DsoIntegrationLead
          trigger:
            - call: "POST /dso/doctor-employments/${emp_a_id}/harmonize-compensation"
              payload: { monthly_collections_cents: [5000000, 5000000, 5000000, 5000000, 5000000, 5000000, 7500000, 7500000, 7500000, 7500000, 7500000, 7500000] }
              as: DsoFinanceController
            - call: "POST /dso/doctor-employments/${emp_b_id}/harmonize-compensation"
              payload: { monthly_collections_cents: [5000000, 5000000, 5000000, 5000000, 5000000, 5000000, 7500000, 7500000, 7500000, 7500000, 7500000, 7500000] }
              as: DsoFinanceController
          assert:
            - "DoctorEmployment.${emp_a_id}.harmonized_annual_comp_cents == 24300000"
            - "DoctorEmployment.${emp_a_id}.harmonization_delta_cents == 300000"
            - "DoctorEmployment.${emp_b_id}.harmonized_annual_comp_cents == 22500000"
            - "DoctorEmployment.${emp_b_id}.harmonization_delta_cents == -1500000"
            - "DoctorEmployment.${emp_a_id}.harmonized_annual_comp_cents - DoctorEmployment.${emp_b_id}.harmonized_annual_comp_cents == 1800000"
            - "DoctorEmployment.${emp_a_id}.is_harmonized == true and DoctorEmployment.${emp_b_id}.is_harmonized == true"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: earnout_chained_fee_tier_then_growth_multiple_lookup
        grounds:
          - calculations.earnout_payout
          - state_machines.EarnoutTranche.PROJECTED_to_RESERVED
          - entities.EarnoutTranche.fields.management_fee_cents
          - entities.EarnoutTranche.fields.growth_bps
          - entities.EarnoutTranche.fields.multiple_bps
        distinguishing_aspect: |
          Mode (c) chained lookup: the Step 3 management-fee tier is selected
          from the Step 1 annualized collections (423480663 lands in the 550 bps
          tier, not the 600 bps tier the un-annualized 210000000 would select),
          and the Step 7 multiple is selected from the Step 6 growth that the
          Step 4 fee itself produced — so management_fee_cents must equal
          23291436 and never 12600000.
        test_recipe:
          setup:
            - "Identical to earnout_provisional_annualization_vs_final_lag_holdback: one CLOSED Affiliation with baseline_ebitda_cents 90000000 and one PROJECTED EarnoutTranche over [2026-09-01, 2027-09-01)."
