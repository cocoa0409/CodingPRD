    roles: [PlatformAdmin]
    code: 201
    input: [name, scac_code, daily_pickup_capacity]
    output: Carrier
    side_effects:
      - "rejects a scac_code already held by another Carrier with ERR_DUPLICATE_SCAC"

  - method: GET
    path: "/liquidation/carriers/{id}"
    description: "Read one carrier."
    roles: [PlatformAdmin, MarketplaceOps, Buyer]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: POST
    path: "/liquidation/brand-policies"
    description: "Register a brand protection policy: permitted resale channels, de-branding requirement and fee, prohibited buyer states and an optional embargo interval."
    roles: [PlatformAdmin]
    code: 201
    input: ["brand_code", "permitted_channels", "de_branding_required?", "debranding_fee_cents_per_unit?", "prohibited_buyer_state_codes?", "embargo_start_at?", "embargo_end_at?"]
