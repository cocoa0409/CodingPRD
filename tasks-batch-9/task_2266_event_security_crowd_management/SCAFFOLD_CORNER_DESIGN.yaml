      - AfterActionReview.${aar_id}.coverage_shortfall_minutes == 900.00 — posts P1 (its guard stayed BRIEFED) and F1 (its guard was a NO_SHOW) each contribute max(0, 1 - 0) * 450 minutes, while S1, I1,
        I2 and E1 each contribute 0 because their guards reached RELIEVED
      - AfterActionReview.${aar_id}.authored_by_user_id == "commander-1" and finalized_by_user_id == null
      - SecurityEvent.${event_id}.status is still CLOSED — SUBMIT does not cascade the event
  - name: lane_effective_throughput_scales_by_staffing_factor_and_prohibited_item_drag
    claim_type: threshold
    grounds:
    - calculations.lane_effective_throughput
    - calculations.lane_effective_throughput.constants
    - entities.ScreeningLane.fields.assigned_operator_count
    - entities.ScreeningLane.fields.effective_throughput_pph
    distinguishing_aspect: |
      This is the only §1.3 row whose formula multiplies a STATE gate, a ratio and a constant drag together, so the claim has to walk all three independently: a lane that is not OPEN reports 0 no matter how many operators stand on it, a half-staffed OPEN lane applies staffing_factor 0.5 AND the prohibited-item drag of 0.9 to give floor(195 * 0.5 * 0.9) = 87 (not 97, which is the drag-free reading), a fully staffed lane gives floor(175.5) = 175 (not 176), and HOLD collapses it back to 0 without the operators leaving their posts.
    test_recipe:
      setup:
      - logical clock at 2026-09-12T16:30:00Z
      - Venue "Harbor Arena" (gross_capacity 8000, door_count 1) with zones ZF (FLOOR, 200 sqm), ZI (CONCOURSE, 100 sqm, ingress) and ZE (EXIT_CORRIDOR, 50 sqm); SecurityEvent with expected_attendance 200,
        doors_open_at 2026-09-12T17:00:00Z, event_start_at 18:30:00Z, event_end_at 22:30:00Z; RiskAssessment APPROVED at version 3 (composite_threat_score 3.75, T1, required_total_staff 5, required_supervisors
        1, required_screening_lanes 2, minimum_staffing_cost_floor_cents 36000); logical clock 2026-09-01T00:00:00Z
      - 'StaffingPlan ACTIVATED with budget_cents 500000 and four posts over 2026-09-12T15:00:00Z..22:30:00Z: S1 (SUPERVISOR, 1 guard, min_credential_level 3), I1 (INGRESS_SCREENING in ZI, 2 guards, bound
        to the BAG_CHECK lane), F1 (FLOOR, 1 guard) and E1 (EMERGENCY_EXIT, 1 guard) — required_total_staff 5'
      - one ScreeningLane (BAG_CHECK, nominal_throughput_pph 195, operator_capacity 2) still PLANNED
      - 'five VERIFIED guards at base_hourly_rate_cents 2200 (GC-8001 at credential_level 3 on S1), all five assignments CONFIRMED and BRIEFED: committed_cost_cents 82500, committed_guard_hours 37.50, coverage_ratio
        1.00, readiness_posture READY'
      - SecurityEvent in BRIEFED with gate_posture OPEN, no guard checked in yet, logical clock 2026-09-12T16:30:00Z
      - the ScreeningLane is BAG_CHECK with nominal_throughput_pph 195 and operator_capacity 2, still PLANNED, and post I1 (2 guards) is bound to it
