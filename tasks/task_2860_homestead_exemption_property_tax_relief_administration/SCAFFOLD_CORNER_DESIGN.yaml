      - name: substantiation_cascade_covered_by_the_difficulty_design
        claim_type: cascade_down
        grounds:
          - state_machines.FraudCase.OPEN_to_SUBSTANTIATED
          - state_machines.ExemptionGrant.SUSPENDED_to_REVOKED
          - state_machines.RetroactiveClaim.APPROVED_to_REVERSED
        excluded_because:
          difficulty_instance: substantiation_cascade_revokes_grant_reprices_parcel_and_reverses_approved_claim
          rationale: "The four-level downward cascade from one SUBSTANTIATE call — grant to REVOKED, parcel repriced, approved retroactive claim to REVERSED, taxpayer ledger and status rewritten — is already asserted level by level by that difficulty instance, including the intermediate Parcel.version bump. A corner probe would replay the identical chain with weaker assertions."

      - name: abatement_compensation_covered_by_the_difficulty_design
        claim_type: compensation
        grounds:
          - state_machines.FraudCase.ASSESSED_to_ABATED
          - entities.TaxpayerAccount.fields.net_relief_cents
        excluded_because:
          difficulty_instance: abatement_restores_the_taxpayer_money_ledger_to_its_pre_assessment_value
          rationale: "The compensating edge is exercised there end to end: a partial collection is abated and the instance asserts lifetime_recovery_collected_cents and net_relief_cents return to their exact pre-assessment values while recovery_paid_cents resets to 0. Repeating it here would add no distinct observable."

