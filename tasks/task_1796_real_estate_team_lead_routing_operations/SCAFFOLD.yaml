  - method: GET
    path: "/crm/nurture-campaigns/{campaignId}"
    description: "Get a nurture campaign"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: NurtureCampaign
    side_effects: []
  - method: GET
    path: "/crm/nurture-campaigns"
    description: "List nurture campaigns"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: ["team_id?", "status?"]
    output: NurtureCampaign[]
    side_effects: []
  - method: POST
    path: "/crm/nurture-campaigns/{campaignId}/activate"
    description: "Activate a DRAFT campaign or resume a PAUSED one (resume cascades PAUSED enrollments back to ENROLLED)"
    roles: [TeamAdmin]
    code: 200
    input: []
    output: NurtureCampaign
    side_effects: ["status -> ACTIVE", "resume: PAUSED enrollments -> ENROLLED"]
  - method: POST
    path: "/crm/nurture-campaigns/{campaignId}/pause"
    description: "Pause an ACTIVE campaign (cascades ENROLLED enrollments to PAUSED)"
    roles: [TeamAdmin]
    code: 200
    input: []
    output: NurtureCampaign
    side_effects: ["status -> PAUSED", "ENROLLED enrollments -> PAUSED"]

  # --- NurtureEnrollment ---
  - method: POST
