scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lead_time_provisional_vs_committed_on_configuration
        grounds:
          - calculations.lead_time_estimation
          - entities.Configuration.fields.lead_time_estimate_days
          - entities.Configuration.fields.committed_lead_time_days
        distinguishing_aspect: |
          Dual variant on the Configuration/Order domain: provisional lead time uses
          available_units (net of reservations) while committed uses stock_on_hand
          (gross); with 10 on hand, 8 reserved, a 9-unit build needs the part under
          the provisional variant (2 < 9, adds 10 days) but not under the committed
          variant (10 >= 9), so the two variants return different numbers for the
          same selections.
        test_recipe:
          setup:
            - "Account A1 (STANDARD, credit 10,000,000c) exists"
            - "Chassis L1: base 100000c, build_duration_hours 24"
            - "Component CPU1: price 20000c, lead_time_days 10, stock_on_hand 10"
            - "ALLOWED rule (L1, CPU1)"
            - "Configuration C1: 1x CPU1, VALIDATED"
            - "Order O1 with line qty 9 of C1, SUBMITTED and fully ALLOCATED -> CPU1 reserved_units == 8"
            - "Second Configuration C2: 1x CPU1, DRAFT"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A1", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a1_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L1", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l1_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "CPU1", kind: "CPU", price_cents: 20000, lead_time_days: 10, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { cpu1_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l1_id}", component_id: "${cpu1_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a1_id}"
                chassis_model_id: "${l1_id}"
                component_selections: [{ component_id: "${cpu1_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a1_id}"
              captures: { c1_id: $.data.id }
            - { call: "POST /api/configurations/${c1_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a1_id}", captures: { c1_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a1_id}", po_number: "PO-1" }, as: CustomerUser, as_user_id: "${a1_id}", captures: { o1_id: $.data.id } }
            - { call: "POST /api/orders/${o1_id}/lines", payload: { configuration_id: "${c1_id}", qty: 9, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a1_id}" }
            - { call: "POST /api/orders/${o1_id}/submit", payload: { expected_configuration_version: "${c1_v}" }, as: CustomerUser, as_user_id: "${a1_id}" }
            - call: "GET /api/orders/${o1_id}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                j1_id: $.data[0].id
            - { call: "POST /api/build-jobs/${j1_id}/allocate", payload: {}, as: FactoryOps }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a1_id}"
                chassis_model_id: "${l1_id}"
                component_selections: [{ component_id: "${cpu1_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a1_id}"
              captures: { c2_id: $.data.id }
            - { call: "POST /api/configurations/${c2_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a1_id}", captures: { c2_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a1_id}", po_number: "PO-2" }, as: CustomerUser, as_user_id: "${a1_id}", captures: { o2_id: $.data.id } }
            - { call: "POST /api/orders/${o2_id}/lines", payload: { configuration_id: "${c2_id}", qty: 9, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a1_id}" }
          trigger:
            - { call: "POST /api/orders/${o2_id}/submit", payload: { expected_configuration_version: "${c2_v}" }, as: CustomerUser, as_user_id: "${a1_id}", captures: { o2_committed: $.data.promised_ship_date } }
          assert:
            - "Configuration.${c2_id}.lead_time_estimate_days == 11  # provisional: 2 available < 9 needed -> 10 + floor(24/24)"
            - "Configuration.${c2_id}.committed_lead_time_days == 1   # committed: stock_on_hand 10 >= 9 -> 0 + 1"
            - "Order.${o2_id}.promised_ship_date == '2026-09-02T00:00:00Z'  # submitted at default clock 2026-09-01T00:00:00Z + 1 day, STANDARD tier buffer 0, qty 9 < 50"

      - name: recovery_credit_estimated_vs_final_on_asset
        grounds:
          - calculations.recovery_credit_reconciliation
          - entities.AssetRecoveryRequest.fields.estimated_credit_cents
          - entities.AssetRecoveryRequest.fields.final_credit_cents
        distinguishing_aspect: |
          Dual variant on the AssetRecoveryRequest domain (different entity domain from
          lead time): estimated credit is a flat 30% of unit price (36000c) while the
          final credit keys off grading (grade good = 45% = 54000c); the two variants
          diverge for identical asset data.
        test_recipe:
          setup:
            - "Account A2 (STANDARD, credit 10,000,000c)"
            - "Chassis L2: base 100000c, build 24h; Component CPU2: 20000c, lead 10, stock 10"
            - "ALLOWED rule (L2, CPU2); Configuration C3 with 1x CPU2 VALIDATED"
            - "Order O3, line qty 1 of C3, submitted -> built; wave released/shipped/received at clock 2026-09-02T00:00:00Z -> Asset delivered (unit price 120000c)"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A2", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a2_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L2", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l2_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "CPU2", kind: "CPU", price_cents: 20000, lead_time_days: 10, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { cpu2_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l2_id}", component_id: "${cpu2_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a2_id}"
                chassis_model_id: "${l2_id}"
                component_selections: [{ component_id: "${cpu2_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a2_id}"
              captures: { c3_id: $.data.id }
            - { call: "POST /api/configurations/${c3_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a2_id}", captures: { c3_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a2_id}", po_number: "PO-3" }, as: CustomerUser, as_user_id: "${a2_id}", captures: { o3_id: $.data.id } }
            - { call: "POST /api/orders/${o3_id}/lines", payload: { configuration_id: "${c3_id}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a2_id}" }
            - { call: "POST /api/orders/${o3_id}/submit", payload: { expected_configuration_version: "${c3_v}" }, as: CustomerUser, as_user_id: "${a2_id}" }
            - call: "GET /api/orders/${o3_id}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                j3_id: $.data[0].id
            - { call: "POST /api/build-jobs/${j3_id}/allocate", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${j3_id}/start", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${j3_id}/complete", payload: {}, as: FactoryOps }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/orders/${o3_id}/deployment-waves"
              payload:
                wave_label: "W1"
                ship_window_start: "2026-09-02T00:00:00Z"
                ship_window_end: "2026-09-10T00:00:00Z"
                destinations: [{ employee_ref: "HQ", address: "1 Main St", units: 1 }]
              as: AccountManager
              captures: { w3_id: $.data.id }
            - { call: "POST /api/deployment-waves/${w3_id}/release", payload: {}, as: AccountManager }
            - { call: "POST /api/deployment-waves/${w3_id}/ship", payload: {}, as: FactoryOps }
            - { call: "POST /api/deployment-waves/${w3_id}/receive", payload: {}, as: CustomerUser, as_user_id: "${a2_id}" }
            - call: "GET /api/orders/${o3_id}/lines"
              payload: {}
              as: CustomerUser
              as_user_id: "${a2_id}"
              captures:
                ol3_id: $.data[0].id
            - call: "GET /api/order-lines/${ol3_id}/assets"
              payload: {}
              as: CustomerUser
              as_user_id: "${a2_id}"
              captures:
                as3_id: $.data[0].id
            - { call: "POST /api/asset-recovery-requests", payload: { account_id: "${a2_id}", asset_id: "${as3_id}", program_kind: "RESALE_CREDIT" }, as: CustomerUser, as_user_id: "${a2_id}", captures: { rr3_id: $.data.id } }
          trigger:
            - { call: "POST /api/asset-recovery-requests/${rr3_id}/issue-label", payload: {}, as: PlatformAdmin, captures: { rr3_est: $.data.estimated_credit_cents } }
            - { call: "POST /api/asset-recovery-requests/${rr3_id}/receive", payload: { grade: "good" }, as: PlatformAdmin, captures: { rr3_final: $.data.final_credit_cents } }
          assert:
            - "AssetRecoveryRequest.${rr3_id}.estimated_credit_cents == 36000  # 0.30 * 120000"
            - "AssetRecoveryRequest.${rr3_id}.final_credit_cents == 54000     # 0.45 * 120000"
            - "AssetRecoveryRequest.${rr3_id}.estimated_credit_cents != AssetRecoveryRequest.${rr3_id}.final_credit_cents"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_round_per_line_then_sum
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.total_cents
          - entities.OrderLine.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: order_pricing rounds half-up PER LINE then sums.
          With PREMIER (8% off) and unit prices 100005c and 100017c, per-line rounding
          yields 92005 + 92016 = 184021c while the FORBIDDEN sum-then-round order
          yields round_half_up(200022 * 0.92) = 184020c — one cent of observable drift.
        test_recipe:
          setup:
            - "Account A4 (PREMIER, credit 10,000,000c)"
            - "Chassis L4: base 66671c, build 24h"
            - "Component CPCA: 33334c, lead 5, stock 100; component RMAB: 33346c, lead 5, stock 100"
            - "ALLOWED rules for both components on L4"
            - "Configuration CF1 (1x CPCA, unit 100005c) VALIDATED; Configuration CF2 (1x RMAB, unit 100017c) VALIDATED"
            - "Order O4 with line1 qty 1 of CF1 and line2 qty 1 of CF2"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A4", account_tier: "PREMIER", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a4_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L4", category: "LAPTOP", base_price_cents: 66671, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l4_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "CPCA", kind: "CPU", price_cents: 33334, lead_time_days: 5, stock_on_hand: 100, revision: "A01" }, as: PlatformAdmin, captures: { cpca_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "RMAB", kind: "MEMORY", price_cents: 33346, lead_time_days: 5, stock_on_hand: 100, revision: "A01" }, as: PlatformAdmin, captures: { rmab_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l4_id}", component_id: "${cpca_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l4_id}", component_id: "${rmab_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a4_id}"
                chassis_model_id: "${l4_id}"
                component_selections: [{ component_id: "${cpca_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a4_id}"
              captures: { cf1_id: $.data.id }
            - { call: "POST /api/configurations/${cf1_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a4_id}", captures: { cf1_v: $.data.version } }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a4_id}"
                chassis_model_id: "${l4_id}"
                component_selections: [{ component_id: "${rmab_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a4_id}"
              captures: { cf2_id: $.data.id }
            - { call: "POST /api/configurations/${cf2_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a4_id}" }
            - { call: "POST /api/orders", payload: { account_id: "${a4_id}", po_number: "PO-4" }, as: CustomerUser, as_user_id: "${a4_id}", captures: { o4_id: $.data.id } }
            - { call: "POST /api/orders/${o4_id}/lines", payload: { configuration_id: "${cf1_id}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a4_id}", captures: { ol4a_id: $.data.id } }
            - { call: "POST /api/orders/${o4_id}/lines", payload: { configuration_id: "${cf2_id}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a4_id}", captures: { ol4b_id: $.data.id } }
          trigger:
            - { call: "POST /api/orders/${o4_id}/submit", payload: { expected_configuration_version: "${cf1_v}" }, as: CustomerUser, as_user_id: "${a4_id}" }
          assert:
            - "OrderLine.${ol4a_id}.line_total_cents == 92005   # round_half_up(100005 * 0.92) = round_half_up(92004.60)"
            - "OrderLine.${ol4b_id}.line_total_cents == 92016   # round_half_up(100017 * 0.92) = round_half_up(92015.64)"
            - "Order.${o4_id}.total_cents == 184021              # per-line-then-sum; sum-then-round would give 184020"
            - "Order.${o4_id}.discount_cents == 20001             # 200022 - 184021"

      - name: promised_ship_date_tiered_buffer_nonlinear
        grounds:
          - calculations.promised_ship_date
          - entities.Order.fields.promised_ship_date
        distinguishing_aspect: |
          Mode (a) combinatorial non-linearity (different mode from rounding): three
          inputs (max committed lead time, account tier, bulk-qty threshold at >= 50)
          interact through conditional branches — a PREMIER order with a 50-unit line
          lands buffer 1 + 3 = 4 days on top of the lead-time base, and exactly 50
          crosses the threshold.
        test_recipe:
          setup:
            - "Account A5 (PREMIER, credit 100,000,000c)"
            - "Chassis L5: base 100000c, build 24h; Component CPU5: 10000c, lead 3, stock 1000"
            - "ALLOWED rule; Configuration C5 (1x CPU5) VALIDATED at clock 2026-09-01T00:00:00Z"
            - "Order O5 with one line of qty 50"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A5", account_tier: "PREMIER", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { a5_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L5", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l5_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "CPU5", kind: "CPU", price_cents: 10000, lead_time_days: 3, stock_on_hand: 1000, revision: "A01" }, as: PlatformAdmin, captures: { cpu5_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l5_id}", component_id: "${cpu5_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a5_id}"
                chassis_model_id: "${l5_id}"
                component_selections: [{ component_id: "${cpu5_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a5_id}"
              captures: { c5_id: $.data.id }
            - { call: "POST /api/configurations/${c5_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a5_id}", captures: { c5_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a5_id}", po_number: "PO-5" }, as: CustomerUser, as_user_id: "${a5_id}", captures: { o5_id: $.data.id } }
            - { call: "POST /api/orders/${o5_id}/lines", payload: { configuration_id: "${c5_id}", qty: 50, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a5_id}" }
          trigger:
            - { call: "POST /api/orders/${o5_id}/submit", payload: { expected_configuration_version: "${c5_v}" }, as: CustomerUser, as_user_id: "${a5_id}" }
          assert:
            - "Configuration.${c5_id}.committed_lead_time_days == 1  # stock 1000 >= 50 -> 0 + floor(24/24)"
            - "Order.${o5_id}.promised_ship_date == '2026-09-06T00:00:00Z'  # 2026-09-01 + 1 base + 1 PREMIER + 3 bulk(qty 50 >= 50)"
            - "Order.${o5_id}.build_status == SUBMITTED"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: substitution_negotiation_cycle_pending_rejected_pending
        grounds:
          - state_machines.SubstitutionRequest.PENDING_to_REJECTED
          - state_machines.SubstitutionRequest.REJECTED_to_PENDING
        distinguishing_aspect: |
          Cyclic shape on SubstitutionRequest: PENDING -> REJECTED -> PENDING with
          round incrementing 1 -> 2, while the BuildJob stays SHORTAGE_BLOCKED and the
          order stays ON_HOLD until an approval breaks the loop.
        test_recipe:
          setup:
            - "Account A6 (STANDARD, credit 10,000,000c); chassis L6 base 100000c build 24h"
            - "Components: SSD1 (5000c, lead 3, stock 0), SSD2 (7000c, lead 3, stock 50), SSD3 (6500c, lead 3, stock 50)"
            - "ALLOWED rules for all three on L6"
            - "Configuration C6 (1x SSD1) VALIDATED; Order O6 line qty 2, SUBMITTED"
            - "Allocate -> BuildJob SHORTAGE_BLOCKED, SubstitutionRequest SR1 PENDING (SSD1 -> SSD2), order ON_HOLD"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A6", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a6_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L6", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l6_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "SSD1", kind: "STORAGE", price_cents: 5000, lead_time_days: 3, stock_on_hand: 0, revision: "A01" }, as: PlatformAdmin, captures: { ssd1_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "SSD2", kind: "STORAGE", price_cents: 7000, lead_time_days: 3, stock_on_hand: 50, revision: "A01" }, as: PlatformAdmin, captures: { ssd2_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "SSD3", kind: "STORAGE", price_cents: 6500, lead_time_days: 3, stock_on_hand: 50, revision: "A01" }, as: PlatformAdmin, captures: { ssd3_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l6_id}", component_id: "${ssd1_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l6_id}", component_id: "${ssd2_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l6_id}", component_id: "${ssd3_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a6_id}"
                chassis_model_id: "${l6_id}"
                component_selections: [{ component_id: "${ssd1_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a6_id}"
              captures: { c6_id: $.data.id }
            - { call: "POST /api/configurations/${c6_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a6_id}", captures: { c6_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a6_id}", po_number: "PO-6" }, as: CustomerUser, as_user_id: "${a6_id}", captures: { o6_id: $.data.id } }
            - { call: "POST /api/orders/${o6_id}/lines", payload: { configuration_id: "${c6_id}", qty: 2, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a6_id}" }
            - { call: "POST /api/orders/${o6_id}/submit", payload: { expected_configuration_version: "${c6_v}" }, as: CustomerUser, as_user_id: "${a6_id}" }
            - call: "GET /api/orders/${o6_id}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                j6_id: $.data[0].id
            - { call: "POST /api/build-jobs/${j6_id}/allocate", payload: {}, as: FactoryOps }
            - call: "GET /api/build-jobs/${j6_id}/substitution-requests"
              payload: {}
              as: FactoryOps
              captures:
                sr6_id: $.data[0].id
            - { call: "POST /api/substitution-requests/${sr6_id}/reject", payload: {}, as: CustomerUser, as_user_id: "${a6_id}" }
          trigger:
            - { call: "POST /api/substitution-requests/${sr6_id}/repropose", payload: { proposed_component_id: "${ssd3_id}" }, as: FactoryOps }
          assert:
            - "SubstitutionRequest.${sr6_id}.status == PENDING            # cycle closed back"
            - "SubstitutionRequest.${sr6_id}.round == 2"
            - "SubstitutionRequest.${sr6_id}.price_delta_cents == 1500   # 6500 - 5000"
            - "BuildJob.${j6_id}.status == SHORTAGE_BLOCKED              # loop leaves the job blocked"
            - "Order.${o6_id}.build_status == ON_HOLD"

      - name: order_parallel_build_and_ship_dimensions
        grounds:
          - state_machines.Order
          - entities.Order.fields.build_status
          - entities.Order.fields.ship_status
        distinguishing_aspect: |
          Parallel state dimensions on Order (different entity from SubstitutionRequest):
          build_status advances DRAFT->SUBMITTED->ALLOCATED->IN_PRODUCTION->BUILT while
          ship_status stays PENDING the whole time, and only after BUILT can the ship
          dimension leave PENDING — the two axes evolve independently on one row.
        test_recipe:
          setup:
            - "Account A7 (STANDARD, credit 10,000,000c); chassis L7 base 80000c build 24h"
            - "Component RAM7 (8000c, lead 2, stock 10); ALLOWED rule"
            - "Configuration C7 (1x RAM7) VALIDATED; Order O7 line qty 1"
          setup_api_calls:
