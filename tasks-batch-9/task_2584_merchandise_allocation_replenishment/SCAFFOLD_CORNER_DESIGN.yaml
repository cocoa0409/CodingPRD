            - "Replayed under the rightful roles the same endpoints all succeed: AllocationManager locks (program LOCKED) and unlocks (ACTIVE) and then commits the run (COMMITTED)"
            - "StoreOperator on GET /allocation/stores/{storeId} for its OWN store returns 200 - shared_operations are reachable by the role that shares them"
            - "GET /allocation/allocation-runs?receipt_id=${rcpt_id} still has total_count == 1 and the run's version reflects only the successful commit: thirteen refusals wrote nothing"
      - name: store_operator_is_scoped_to_its_own_store_while_shared_writes_accept_both_planner_roles
        claim_type: shared_operations
        grounds:
          - roles.StoreOperator.shared_operations
          - roles.PlanningAdmin.shared_operations
          - roles.Allocator.shared_operations
          - roles.AllocationManager.shared_operations
          - validations[priority:3]
          - errors.ERR_STORE_SCOPE_VIOLATION
        distinguishing_aspect: |
          StoreOperator is the only entity_backed role: its X-User-ID is a Store id, so authorisation has a
          second axis that no other role has. All four of its operations are declared shared, and each one
          resolves the owning store down a DIFFERENT path - the storeId in the URL, position.store_id,
          line.store_id and recommendation.TO_store_id - so an implementation that hard-codes one traversal
          passes a quarter of this test. The transfer case is the sharpest: the donor store is a party to the
          recommendation and can see it move, yet only the receiver may book the arrival, so passing the
          DONOR's id must be refused. The second axis is that scoping applies only where it is declared: the
          single-resource reads are open to StoreOperator but the COLLECTION reads are not, so a store asking
          for the whole list is a rung 2 ERR_FORBIDDEN_ROLE, not a rung 3 ERR_STORE_SCOPE_VIOLATION - two
          different codes for what a careless implementation treats as one idea. The rest of the test drives
          all six genuinely shared write operations under BOTH of their declared roles.
