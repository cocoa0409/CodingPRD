  - rule_id: resource_temporal_overlap
    instances:
      - name: territory_radial_buffer_rejects_physically_disjoint_circles_on_relocation
        resource_entity: Territory
        interval_semantics: |
          Continuous two-dimensional radial occupancy with an ADDITIVE separation buffer. Two territories
          conflict unless distance_km >= r_subject + r_incumbent + PROTECTION_BUFFER_KM. The boundary is
          CLOSED - a slack of exactly 0.000 is compatible - but because the required separation exceeds
          the geometric one by PROTECTION_BUFFER_KM, two circles that do not intersect at all (a physical
          gap of 0.075 km) still conflict. The subject territory is excluded from its own candidate set
          and same-franchisee territories are never candidates.
        grounds:
          - calculations.territory_encroachment_slack
          - endpoints[POST /franchise/relocation-requests/{id}/submit]
          - state_machines.RelocationRequest.SUBMITTED_to_APPROVED
          - validations[priority=12]
          - errors[ERR_TERRITORY_ENCROACHMENT]
        distinguishing_aspect: |
          Overlap is evaluated on a moving resource: the relocation proposal, not the stored territory.
          A candidate circle 8.075 km from an incumbent whose radii sum to 8.0 km is geometrically
          disjoint and would pass any naive intersection test, yet it is rejected because the required
          separation is 8.5 km. Nudging the proposal to exactly 8.500 km clears it with encroachment_km
          0.000, and only the subsequent APPROVE actually rewrites the territory and club geometry.
        test_recipe:
          setup:
            - "Franchisee f1 owns territory T1 centred at (34.0, -118.0) with protected_radius_km 5.0 and one OPEN club on it."
            - "Franchisee f2 owns territory T2 centred at (34.0, -117.8) with protected_radius_km 3.0; the two circles are 17.0 km apart, far clear of the 8.5 km requirement."
            - "f1 has filed a DRAFT relocation request moving its circle to (34.0, -117.895) at radius 5.0 - 8.075 km from T2, so the circles are 0.075 km apart but the required separation is 5.0 + 3.0 + 0.5 = 8.5 km."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Beacon Hill Fitness LLC", contact_email: "ops@beaconhillfit.example", royalty_rate_bps: 650, national_account_eligible: false }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Eastbrook Fitness LLC", contact_email: "ops@eastbrookfit.example", royalty_rate_bps: 650, national_account_eligible: false }
              as: BrandAdministrator
              captures: { f2_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f2_id}", center_lat: 34.0, center_lng: -117.8, protected_radius_km: 3.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t2_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Beacon Hill Club", opened_on: "2021-06-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /franchise/clubs/${c1_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/relocation-requests"
              payload: { club_id: "${c1_id}", requested_lat: 34.0, requested_lng: -117.895, requested_radius_km: 5.0, justification: "Landlord redevelopment forces a move east" }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { rr1_id: $.data.id }
          trigger:
            - call: "POST /franchise/relocation-requests/${rr1_id}/submit"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/relocation-requests/${rr1_id}/withdraw"
              payload: { reason: "Re-siting 0.005 degrees further east" }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/relocation-requests"
              payload: { club_id: "${c1_id}", requested_lat: 34.0, requested_lng: -117.9, requested_radius_km: 5.0, justification: "Re-sited to respect the brand protection buffer" }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { rr2_id: $.data.id }
            - call: "POST /franchise/relocation-requests/${rr2_id}/submit"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/relocation-requests/${rr2_id}/decide"
              payload: { decision: "APPROVE" }
              as: BrandAdministrator
              as_user_id: "brand-reviewer-1"
          assert:
            - "the first submit response status == 409"
            - "the first submit response data.error_id == ERR_TERRITORY_ENCROACHMENT"
            - "immediately after the first submit, RelocationRequest.${rr1_id}.status == DRAFT"
            - "immediately after the first submit, RelocationRequest.${rr1_id}.submitted_by_user_id == null"
            - "RelocationRequest.${rr1_id}.status == WITHDRAWN after the withdraw"
            - "the second submit response status == 200"
            - "the second submit response data.status == SUBMITTED"
            - "the second submit response data.encroachment_km == 0.0"
            - "the decide response status == 200"
            - "the decide response data.status == APPROVED"
            - "Territory.${t1_id}.center_lng == -117.9"
            - "Territory.${t1_id}.center_lat == 34.0"
            - "Territory.${t1_id}.protected_radius_km == 5.0"
            - "Territory.${t1_id}.relocation_count == 1"
            - "Club.${c1_id}.lng == -117.9"
            - "Territory.${t2_id}.center_lng == -117.8"
            - "Territory.${t2_id}.relocation_count == 0"

      - name: promotion_windows_need_a_seven_day_cooling_gap_on_both_sides_of_the_channel
        resource_entity: Promotion
        interval_semantics: |
          Discrete CLOSED date intervals [starts_on, ends_on] on the (franchisee_id, plan_template_id)
          channel, with a mandatory PROMO_COOLING_GAP_DAYS separation measured in whole days from the
          nearer edge. Adjacency is REJECTED and so is any gap of 1..6 days, on either side: the later
          candidate needs new.starts_on - P.ends_on >= 7 and the earlier candidate needs
          P.starts_on - new.ends_on >= 7. Only PENDING_REVIEW and APPROVED promotions occupy the
          channel, and the channel key includes the plan template, so the identical window on a
          different template is free.
        grounds:
          - validations[priority=14]
          - endpoints[POST /franchise/promotions]
          - calculations.effective_monthly_dues.constants.PROMO_COOLING_GAP_DAYS
          - errors[ERR_PROMO_WINDOW_CONFLICT]
        distinguishing_aspect: |
          A completely different overlap semantics on a different resource entity: where Territory
          admits exact touching (slack 0.000 is fine), Promotion forbids it - a gap must be strictly at
          least 7 whole days, so the 6-day cases fail and the 7-day cases pass, on BOTH the later and the
          earlier side of the incumbent window. The four-call ladder pins the off-by-one in each
          direction, and the fifth call proves the conflict is scoped to the (franchisee, plan) channel
          rather than to the franchisee alone.
        test_recipe:
          setup:
            - "Franchisee f1 with two PUBLISHED plan templates, CORE12 and ELITE24."
            - "One APPROVED 10 percent promotion for (f1, CORE12) over the closed window 2026-07-01..2026-07-31."
