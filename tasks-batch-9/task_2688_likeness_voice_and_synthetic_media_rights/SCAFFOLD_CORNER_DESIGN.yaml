      - name: source_asset_checks_run_existence_then_shape_then_ownership
        claim_type: cascading_validation
        grounds: [validations.priority_13, validations.priority_72, validations.priority_70]
        distinguishing_aspect: >-
          Building a replica stacks three checks over the same array: the assets must exist (13), the
          array must be non-empty and duplicate-free (72), and every member must belong to the same
          grant (70). Each request violates exactly one rung while the lower rungs are also violable,
          so a wrong evaluation order surfaces immediately — e.g. an unknown id must be a 404, not the
          422 that a naive same-grant lookup would produce.
        test_recipe:
          setup:
            - "CA profile; one non-union CA talent with TWO active grants g1 and g2"
            - "One VOICE_SAMPLE captured under each grant: a1 under g1, a2 under g2"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "Grant one", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g1_id: $.data.id }
            - call: "POST /consent-grants/${g1_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
              captures: { t_v2: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "Grant two", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v2}" }
              as: RightsAdministrator
              captures: { g2_id: $.data.id }
            - call: "POST /consent-grants/${g2_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "POST /biometric-assets"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g1_id}", asset_kind: "VOICE_SAMPLE", capture_ref: "cap-g1", storage_class: "ENCRYPTED_VAULT", payload_digest: "sha256:a01" }
              as: RightsAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /biometric-assets"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g2_id}", asset_kind: "VOICE_SAMPLE", capture_ref: "cap-g2", storage_class: "ENCRYPTED_VAULT", payload_digest: "sha256:a02" }
              as: RightsAdministrator
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /digital-replicas"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g1_id}", replica_kind: "VOICE", source_asset_ids: ["00000000-0000-4000-8000-000000000000"], build_ref: "build-unknown" }
              as: RightsAdministrator
            - call: "POST /digital-replicas"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g1_id}", replica_kind: "VOICE", source_asset_ids: ["${a1_id}", "${a1_id}"], build_ref: "build-dupe" }
              as: RightsAdministrator
            - call: "POST /digital-replicas"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g1_id}", replica_kind: "VOICE", source_asset_ids: ["${a1_id}", "${a2_id}"], build_ref: "build-mixed" }
              as: RightsAdministrator
            - call: "POST /digital-replicas"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g1_id}", replica_kind: "VOICE", source_asset_ids: ["${a1_id}"], build_ref: "build-good" }
              as: RightsAdministrator
              captures: { r_id: $.data.id }
          assert:
            - "trigger call 1 -> 404 with data.error_id == \"ERR_BIOMETRIC_ASSET_NOT_FOUND\" — existence at priority 13 runs before the shape and ownership rungs"
            - "trigger call 2 -> 422 with data.error_id == \"ERR_NO_SOURCE_ASSETS\" — the duplicate-free clause of priority 72 fires even though both ids exist and both belong to g1"
            - "trigger call 3 -> 422 with data.error_id == \"ERR_ASSET_CONSENT_MISMATCH\" — priority 70 is reached only once existence and shape pass"
            - "trigger call 4 -> 201 with status \"BUILT\", source_asset_ids == [\"${a1_id}\"] and version 1"
            - "re-sending trigger call 4 with source_asset_ids omitted entirely, or sent as [], returns 400 with data.error_id == \"ERR_INVALID_REQUEST\" — the priority 3 well-formedness rung outranks priority 72's non-empty clause"
            - "GET /digital-replicas?talent_id=${t_id} returns exactly 1 row after all four calls"

      - name: two_violations_report_the_higher_priority_error
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: frozen_talent_outranks_below_floor_per_use_fee_on_consent_create
          rationale: >-
            §1.8 constructs a single POST /consent-grants that violates the FROZEN-posture rung (44) and
            the statutory-floor rung (90) at once, asserts the higher rung's error, and then repairs the
            posture to show the lower rung's error surfacing — the exact shape of this row.

      - name: adjacent_priority_pairs_resolve_in_declared_order
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: legal_hold_source_asset_outranks_cross_grant_asset_mismatch
          rationale: >-
            All three §1.8 priority_pair instances pit rules from different error categories against
            each other on one request (business_safety 50 vs business_referential 70, and
            business_temporal 76 vs business_constraint 82), which subsumes this row.

      - name: validity_depends_on_a_second_entity_state
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: replica_approval_gated_on_consent_grant_status
          rationale: >-
            The cross-entity rungs (35 ERR_CONSENT_NOT_ACTIVE, 48 ERR_ESTATE_AUTHORITY_UNVERIFIED,
            54 ERR_ASSET_BOUND_TO_ACTIVE_REPLICA) are each swept across the other entity's states in the
            §1.8 cross_entity_state_dependency instances, in both the valid and the invalid direction.

      - name: individually_valid_licenses_collectively_exceed_the_overlap_cap
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: license_distribution_windows_closed_inclusive_touch_counts_toward_cap
          rationale: >-
            MAX_OVERLAPPING_LICENSES is the only aggregate rung; §1.8 issues two admissible licenses and
            then a third whose window merely touches the others, asserting
            ERR_REPLICA_OVERLAP_CAP_EXCEEDED at the touch and success one second later.

  - section: endpoints
    instances:
      - name: state_law_profile_create_read_and_filtered_list
        claim_type: standard_crud
        grounds: [endpoints.POST_state_law_profiles, endpoints.GET_state_law_profiles, entities.StateLawProfile]
        distinguishing_aspect: >-
          StateLawProfile is the only pure reference entity, and its surface is create + read + list
          only: there is no update and no delete anywhere in §1.5, so the profile that a talent's
          retention and disclosure maths depends on can never be edited under the office's feet. The
          list read must filter by state_code and paginate.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
          trigger:
            - call: "POST /state-law-profiles"
              payload: { state_code: "NY", postmortem_rights_years: 40, postmortem_requires_registration: false, biometric_retention_max_days: 180, deletion_grace_days: 15, removal_window_days: 7, disclosure_required_advertising: true, disclosure_required_entertainment: false, min_disclosure_rank_advertising: 4, min_disclosure_rank_entertainment: 1 }
              as: RightsAdministrator
            - call: "GET /state-law-profiles?state_code=NY"
              payload: {}
              as: LicenseeProducer
              as_user_id: "lic-001"
            - call: "GET /state-law-profiles?limit=1&offset=1"
              payload: {}
              as: RightsAdministrator
            - call: "POST /state-law-profiles"
              payload: { state_code: "NY", postmortem_rights_years: 41, postmortem_requires_registration: false, biometric_retention_max_days: 180, deletion_grace_days: 15, removal_window_days: 7, disclosure_required_advertising: true, disclosure_required_entertainment: false, min_disclosure_rank_advertising: 4, min_disclosure_rank_entertainment: 1 }
              as: RightsAdministrator
          assert:
            - "trigger call 1 -> 201 echoing all ten declared fields; the row carries no version field, because StateLawProfile is declared common_fields false"
            - "trigger call 2 -> 200 with response_type == \"array\", total_count == 1 and the single NY row, readable by a LicenseeProducer as a shared GET"
            - "trigger call 3 -> 200 with total_count == 2, has_more == false and exactly one row — offset and limit are honoured on the reference collection"
            - "trigger call 4 -> 400 with data.error_id == \"ERR_INVALID_REQUEST\" because state_code is declared unique; the stored NY profile still reports postmortem_rights_years == 40"
            - "no PUT, PATCH or DELETE route exists for /state-law-profiles/{id} in §1.5, so a profile is immutable once created"

      - name: estate_authority_verification_is_a_one_way_action
        claim_type: action_endpoint
        grounds: [endpoints.POST_estate_authorities_id_verify, state_machines.EstateAuthority, errors.ERR_INVALID_ESTATE_AUTHORITY_STATE]
        distinguishing_aspect: >-
          POST /estate-authorities/{id}/verify carries no payload at all, so the whole claim is the
          transition and its stamps: SUBMITTED -> VERIFIED with verified_by_user_id and verified_at set
          from the request context and the logical clock. Re-verifying must be refused, which is what
          makes the estate gate on consent activity a one-time authorisation rather than a toggle.
        test_recipe:
          setup:
            - "CA profile; one CA talent recorded as deceased on 2026-08-01 so an estate authority is admissible"
            - "One SUBMITTED estate authority for that talent"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id }
            - call: "POST /talents/${t_id}/death-record"
              payload: { date_of_death: "2026-08-01T00:00:00Z" }
              as: RightsAdministrator
              as_user_id: "ra-001"
            - call: "POST /talents/${t_id}/estate-authorities"
              payload: { executor_name: "Reyes Family Trust", court_document_ref: "LA-PROB-2026-1187", registration_number: "CA-POSTMORTEM-9931" }
              as: RightsAdministrator
              as_user_id: "ra-001"
              captures: { ea_id: $.data.id }
          trigger:
            - call: "POST /estate-authorities/${ea_id}/verify"
              payload: {}
              as: RightsAdministrator
              as_user_id: "ra-002"
            - call: "POST /estate-authorities/${ea_id}/verify"
              payload: {}
              as: RightsAdministrator
              as_user_id: "ra-002"
          assert:
            - "at creation the authority reported status \"SUBMITTED\", submitted_by_user_id == \"ra-001\", verified_by_user_id == null and verified_at == null"
            - "trigger call 1 -> 200 with status \"VERIFIED\", verified_by_user_id == \"ra-002\", verified_at == \"2026-08-01T00:00:00Z\" and version 2"
            - "trigger call 2 -> 409 with data.error_id == \"ERR_INVALID_ESTATE_AUTHORITY_STATE\"; status, verified_by_user_id, verified_at and version are all unchanged by the refusal"
            - "Talent.${t_id}.life_status == \"DECEASED\" and postmortem_rights_until == \"2096-08-01T00:00:00Z\" (70 CA years) throughout"

      - name: estate_authorities_are_scoped_to_their_parent_talent
        claim_type: cross_reference_link
        grounds: [endpoints.POST_talents_id_estate_authorities, endpoints.GET_talents_id_estate_authorities]
        distinguishing_aspect: >-
          The estate authority collection is the one nested route in the API. Creation under a
          non-existent talent must 404 on the PARENT, and the nested list must return only the
          addressed talent's authorities even though two deceased talents each have one — a global
          query with a forgotten scope filter would return both.
        test_recipe:
          setup:
            - "CA profile; two CA talents, both recorded deceased, each with one SUBMITTED estate authority"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { t1_id: $.data.id }
            - call: "POST /talents/${t1_id}/death-record"
              payload: { date_of_death: "2026-07-01T00:00:00Z" }
              as: RightsAdministrator
            - call: "POST /talents/${t1_id}/estate-authorities"
              payload: { executor_name: "Reyes Family Trust", court_document_ref: "LA-PROB-2026-1187" }
              as: RightsAdministrator
              as_user_id: "ra-001"
              captures: { ea1_id: $.data.id }
            - call: "POST /talents"
              payload: { legal_name: "Noor Haddad", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { t2_id: $.data.id }
            - call: "POST /talents/${t2_id}/death-record"
              payload: { date_of_death: "2026-07-15T00:00:00Z" }
              as: RightsAdministrator
            - call: "POST /talents/${t2_id}/estate-authorities"
              payload: { executor_name: "Haddad Estate LLC", court_document_ref: "NY-SURR-2026-0442" }
              as: RightsAdministrator
              as_user_id: "ra-001"
              captures: { ea2_id: $.data.id }
            - call: "POST /estate-authorities/${ea2_id}/verify"
              payload: {}
              as: RightsAdministrator
              as_user_id: "ra-002"
          trigger:
            - call: "GET /talents/${t1_id}/estate-authorities"
              payload: {}
              as: RightsAdministrator
            - call: "GET /talents/${t1_id}/estate-authorities?status=VERIFIED"
              payload: {}
              as: RightsAdministrator
            - call: "POST /talents/00000000-0000-4000-8000-000000000000/estate-authorities"
              payload: { executor_name: "Ghost Estate", court_document_ref: "NONE-0000" }
              as: RightsAdministrator
            - call: "GET /estate-authorities/${ea2_id}"
              payload: {}
              as: EstateRepresentative
              as_user_id: "${ea2_id}"
          assert:
            - "trigger call 1 -> 200 with total_count == 1 and only ${ea1_id}; ${ea2_id} is absent even though it exists and is VERIFIED"
            - "trigger call 2 -> 200 with total_count == 0 — the status filter composes with the parent scope rather than replacing it"
            - "trigger call 3 -> 404 with data.error_id == \"ERR_TALENT_NOT_FOUND\" — the parent is resolved before the child is written, and no orphan authority is created"
            - "trigger call 4 -> 200: the EstateRepresentative identity is entity_backed:EstateAuthority, so ${ea2_id} may read its own record"
            - "GET /talents/${t2_id}/estate-authorities returns total_count == 1 with status \"VERIFIED\""

      - name: grant_read_reconciles_with_the_compensation_ledger
        claim_type: computed_read
        grounds: [entities.ConsentGrant.total_compensation_cents, endpoints.GET_compensation_entries]
        distinguishing_aspect: >-
          Two independent reads must agree: the grant's derived money fields and the append-only entry
          list they summarise. A non-union talent is used so no UNION_TOPUP row muddies the comparison,
          and the default share split (0.75 / 0.20 / 0.05) is asserted on the entry itself.
        test_recipe:
          setup:
            - "CA profile; one non-union CA talent (union_code omitted) with a drafted 300000 grant"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
