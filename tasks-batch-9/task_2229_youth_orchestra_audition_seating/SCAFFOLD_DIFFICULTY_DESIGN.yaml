              as: RegistrarStaff
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R1", start_at: "2026-08-20T17:40:00Z", end_at: "2026-08-20T18:10:00Z", panelist_ids: ["${p4_id}", "${p5_id}", "${p6_id}"], instrument_focus: "VIOLIN", quorum_required: 3, capacity: 4 }
              as: RegistrarStaff
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R1", start_at: "2026-08-20T17:40:00Z", end_at: "2026-08-20T17:55:00Z", panelist_ids: ["${p4_id}", "${p5_id}", "${p6_id}"], instrument_focus: "VIOLIN", quorum_required: 3, capacity: 4 }
              as: RegistrarStaff
            - call: "POST /audition-slots"
