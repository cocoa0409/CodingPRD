              payload: { site_id: "${site_id}", monthly_base_cents: 300000, hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /billing-periods"
              payload: { contract_id: "${contract_id}", period_month: "2026-06" }
              as: AccountManager
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /billing-periods"
              payload: { contract_id: "${contract_id}", period_month: "2026-06" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_DUPLICATE_PERIOD"

      - name: open_billing_period_inactive_contract_returns_contract_not_active
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=8]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - entities.ServiceContract.fields.status
        distinguishing_aspect: "Opening a BillingPeriod for a DRAFT (never-activated) contract returns ERR_CONTRACT_NOT_ACTIVE (409); only ACTIVE contracts back periods."
