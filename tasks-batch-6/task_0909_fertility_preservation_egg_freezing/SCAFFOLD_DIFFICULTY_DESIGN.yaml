  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: appt_state_beats_provider_temporal
        grounds:
          - "validations[priority=5]"
          - "validations[priority=13]"
          - state_machines.StimulationCycle.MONITORING_to_SUSPENDED
        distinguishing_aspect: "Category pair state(priority5) vs business_temporal(priority13): appointment create on a SUSPENDED cycle that also collides with the provider returns ERR_INVALID_STATE, not ERR_PROVIDER_UNAVAILABLE."
        test_recipe:
          setup:
            - "Cycle in MONITORING with an existing 09:00-09:30 appointment on provider phys1, then suspended."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr H", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P 11", date_of_birth: "1993-01-01T00:00:00Z", email: "p11@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 31, amh_level: 3.0, antral_follicle_count: 16 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc_id}/suspend", payload: {}, as: Physician, as_user_id: "${phys1}" }
          trigger:
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: thaw_safety_beats_referential
        grounds:
          - "validations[priority=8]"
          - "validations[priority=11]"
          - state_machines.Directive.ACTIVE_to_REVOKED
        distinguishing_aspect: "Category pair business_safety(priority8) vs business_referential(priority11): authorize with a REVOKED consent AND a specimen owned by another patient returns ERR_CONSENT_NOT_ACTIVE, not ERR_SPECIMEN_NOT_OWNED."
        test_recipe:
          setup:
            - "Patient P has consent directive REVOKED but disposition ACTIVE; patient Q owns a STORED specimen; a thaw authorization for P references Q's specimen; requester phys1 != authorizer phys2."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr I1", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /providers", payload: { full_name: "Dr I2", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys2: "$.data.id" } }
            - { call: "POST /procedure-rooms", payload: { name: "OR6", room_kind: "RETRIEVAL_OR" }, as: PlatformAdmin, captures: { room1: "$.data.id" } }
            - { call: "POST /storage-tanks", payload: { name: "T6", capacity_slots: 10 }, as: PlatformAdmin, captures: { tank1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P Q", date_of_birth: "1994-03-01T00:00:00Z", email: "pq@x.com" }, as: Coordinator, captures: { q_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${q_id}", patient_age_years: 30, amh_level: 4.0, antral_follicle_count: 20 }, as: Coordinator, captures: { qc_id: "$.data.id" } }
            - { call: "POST /consultations/${qc_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${q_id}", consultation_id: "${qc_id}" }, as: Coordinator, captures: { qcyc: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${qcyc}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${qcyc}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${qcyc}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${qcyc}", provider_id: "${phys1}", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${qcyc}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles/${qcyc}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T08:00:00Z", retrieval_end: "2026-05-10T09:00:00Z", oocytes_retrieved: 4, mature_oocyte_count: 1, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}" }
            - { call: "GET /cryo-specimens", payload: {}, as: Embryologist, captures: { q_spec: "$.data[0].id" } }
            - { call: "POST /patients", payload: { full_name: "P P", date_of_birth: "1994-03-01T00:00:00Z", email: "pp@x.com" }, as: Coordinator, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "CONSENT", expected_patient_version: "${p_v}" }, as: Patient, as_user_id: "${p_id}", captures: { consent_id: "$.data.id" } }
            - { call: "GET /patients/${p_id}", payload: {}, as: Coordinator, captures: { p_v2: "$.data.version" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "DISPOSITION", disposition_action: "THAW_TO_SELF", expected_patient_version: "${p_v2}" }, as: Patient, as_user_id: "${p_id}" }
            - { call: "POST /directives/${consent_id}/revoke", payload: {}, as: Patient, as_user_id: "${p_id}" }
            - { call: "POST /thaw-transfer-authorizations", payload: { patient_id: "${p_id}", specimen_ids: ["${q_spec}"], transfer_type: "THAW_TO_TRANSFER" }, as: Physician, as_user_id: "${phys1}", captures: { auth1: "$.data.id" } }
          trigger:
            - { call: "POST /thaw-transfer-authorizations/${auth1}/authorize", payload: {}, as: Physician, as_user_id: "${phys2}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_CONSENT_NOT_ACTIVE"
            - "response.status == 422"

  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: tank_capacity_at_boundary
        grounds:
          - "validations[priority=16]"
          - entities.StorageTank.fields.capacity_slots
          - state_machines.StimulationCycle.TRIGGERED_to_COMPLETED
        distinguishing_aspect: "Metric = tank slot count on POST retrieve: storing 3 specimens into a capacity-2 tank (used 0 + 3 > 2) is rejected with ERR_TANK_AT_CAPACITY; storing exactly capacity succeeds (see retrieval_complete_cascade_depth3)."
        test_recipe:
          setup:
            - "Cycle triggered; target tank capacity 2; retrieve attempts to cryopreserve 3 mature oocytes."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr J", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /procedure-rooms", payload: { name: "OR7", room_kind: "RETRIEVAL_OR" }, as: PlatformAdmin, captures: { room1: "$.data.id" } }
            - { call: "POST /storage-tanks", payload: { name: "T7", capacity_slots: 2 }, as: PlatformAdmin, captures: { tank1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P 12", date_of_birth: "1994-03-01T00:00:00Z", email: "p12@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
