              as_user_id: "${firm_id}"
            - call: "POST /hazard-evaluations/${he2_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
              captures: { he2_score: $.data.hazard_score }
          trigger:
            - call: "POST /recalls/${r_id}/classify"
              payload: { hazard_class: "CLASS_I" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { overdue_after: $.data.overdue_report_count, flag_after: $.data.compliance_flag, cadence_after: $.data.report_cadence_days }
          assert:
            - "${cadence_before} == 30"
