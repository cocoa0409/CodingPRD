          - state_machines.PurchaseContract.ACTIVE_to_SETTLED
          - calculations.desk_credit_posture
          - entities.HedgePosition.fields.lots_open
          - entities.TradingDesk.fields.committed_hedge_lots
        distinguishing_aspect: |
          A depth-4 chain triggered by the DeliveryTicket GRADED -> APPLIED transition, where
          each hop is caused by the previous one: applying the ticket raises delivered_bushels
          (hop 1), that value crossing contract.bushels drives contract ACTIVE -> SETTLED
          (hop 2), settling lifts hedge lots off the HedgePosition (hop 3), and the position's
          shrinking lots_open forces the TradingDesk margin and posture recompute (hop 4).
