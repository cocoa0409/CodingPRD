            - "Assignment.${asg_k}.payment_status == PAYABLE (mid-pipeline on payment axis)"
            - "Assignment.${asg_k}.final_fee_cents == 20000"

      - name: verification_flag_adjudication_cycle
        grounds:
          - state_machines.VerificationReport
          - state_machines.Assignment.UNDER_VERIFICATION_to_REJECTED_AFTER_FLAG
        distinguishing_aspect: |
          Cyclic/branching machine on the VerificationReport entity (distinct
          from the Assignment parallel dimensions): PENDING -> FLAGGED ->
          {DISMISSED | CONFIRMED_VIOLATION} fork with divergent side-effect
