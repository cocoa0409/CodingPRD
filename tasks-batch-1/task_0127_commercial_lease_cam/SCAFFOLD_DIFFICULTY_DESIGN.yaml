      - name: lease_terminate_blocked_by_open_reconciliation
        grounds:
          - state_machines.Lease.ACTIVE_to_TERMINATED
          - entities.Reconciliation.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair Lease -> Reconciliation (a DIFFERENT pair than
          Reconciliation->ExpensePool): a Lease cannot move ACTIVE->TERMINATED
          while any Reconciliation for it is in {DRAFT, IN_REVIEW, DISPUTED};
