# =============================================================================
# §1.8: Scaffold Difficulty Design (Test Targeting Index)
# waste-diversion-zero-waste — 9 rules x 2 instances
# Shared fixture conventions used across instances:
#   site:   landfill_tip_fee_per_ton_cents=5500, max_rebate_rate_per_ton_cents=12000
#   contract: stream MIXED_RECYCLABLES, rebate 10000c/ton, penalty 2000c/ton,
#             closed window [2026-01-01, 2026-12-31]
#   period: half-open [2026-08-01, 2026-09-01); logical clock set to 2026-08-10
#           whenever tickets dated 2026-08-05 must validate
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: diversion_rate_provisional_vs_certified
        grounds:
          - calculations.diversion_rate
          - entities.ScorecardPeriod.fields.diversion_rate_provisional_pct
          - entities.ScorecardPeriod.fields.diversion_rate_certified_pct
        distinguishing_aspect: |
          ScorecardPeriod domain: identical ticket data yields 75.00% provisional
          (PENDING+VALIDATED) vs 66.67% certified (VALIDATED only) because the two
          variants differ by validation-status inclusion set, not by any input change.
        test_recipe:
          setup:
            - "Clock at 2026-08-10; site S; vendor V ACTIVE; contract C ACTIVE (MIXED_RECYCLABLES); period P [2026-08-01,2026-09-01) OPEN"
            - "T1 RECYCLING net 2000 lbs VALIDATED; T2 RECYCLING net 1000 lbs PENDING; T3 LANDFILL net 1000 lbs VALIDATED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site DV", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 3000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "DV-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "DV-T2" }
              as: VendorUser
              as_user_id: "${vendor_id}"
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "LANDFILL", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "DV-T3" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t3_id: $.data.id }
            - call: "POST /tickets/${t3_id}/validate"
              payload: {}
              as: DataSteward
          trigger:
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
          assert:
            - "ScorecardPeriod.${period_id}.total_waste_lbs_provisional == 4000"
            - "ScorecardPeriod.${period_id}.diverted_lbs_provisional == 3000"
            - "ScorecardPeriod.${period_id}.diversion_rate_provisional_pct == 75.00"
            - "ScorecardPeriod.${period_id}.total_waste_lbs_validated == 3000"
            - "ScorecardPeriod.${period_id}.diverted_lbs_validated == 2000"
            - "ScorecardPeriod.${period_id}.diversion_rate_certified_pct == 66.67"
            - "diversion_rate_provisional_pct != diversion_rate_certified_pct for identical underlying tickets"

      - name: rebate_estimate_vs_audit_settlement
        grounds:
          - calculations.ticket_rebate_estimate
          - entities.ScorecardPeriod.fields.rebate_estimate_cents
          - entities.ScorecardPeriod.fields.rebate_settled_cents
        distinguishing_aspect: |
          VendorContract rebate domain: the estimate variant (ticket-reported
          contamination_pct 12 -> factor 0.5 plus penalty) accrues 6000c, while the
          audit-adjusted settlement variant substitutes the audit-measured 3%
          (factor 1.0, no penalty) and settles 20000c on identical tickets — a
          measurement-source variant, structurally different from the
          status-filter variant of diversion_rate.
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE (rebate 10000c/ton, penalty 2000c/ton); period [2026-08-01,2026-09-01) OPEN"
            - "T1 RECYCLING net 4000 lbs (2 tons), contamination_pct 12, VALIDATED -> estimate accrues 6000c"
            - "WasteAudit on 2026-08-06 measures MIXED_RECYCLABLES contamination_pct 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site RB", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 5000, tare_weight_lbs: 1000, contamination_pct: 12, ticket_date: "2026-08-05", external_ticket_ref: "RB-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
            - call: "POST /audits"
              payload: { site_id: "${site_id}", audit_date: "2026-08-06", auditor_name: "Aud A", stream_findings: [ { material_stream: "MIXED_RECYCLABLES", sampled_weight_lbs: 500, contamination_pct: 3 } ] }
              as: WasteAuditor
              captures: { audit_id: $.data.id }
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
              captures: { est_pre_close: $.data.rebate_estimate_cents }
          trigger:
            - call: "POST /scorecard_periods/${period_id}/close"
              payload: {}
              as: CertificationOfficer
          assert:
            - "est_pre_close == 6000  (2t * 10000c * 0.5 - 2t * 2000c penalty)"
            - "ScorecardPeriod.${period_id}.status == CLOSED"
            - "ScorecardPeriod.${period_id}.rebate_settled_cents == 20000  (audit pct 3 -> factor 1.0, no penalty)"
            - "ScorecardPeriod.${period_id}.rebate_estimate_cents == 6000  (estimate field preserved, not overwritten)"
            - "rebate_settled_cents != rebate_estimate_cents for identical VALIDATED ticket data"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: rebate_estimate_tiered_quality_factor
        grounds:
          - calculations.ticket_rebate_estimate
        distinguishing_aspect: |
          Mode (a): >=3 inputs (net weight, rebate rate, contamination_pct, penalty
          rate) with non-linear interaction — tiered quality factor (1.0/0.75/0.5)
          plus a conditional penalty that activates only at pct >= 10 and a
          disposal-route gate that zeroes LANDFILL tickets.
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE (rebate 10000c/ton, penalty 2000c/ton); period OPEN"
            - "TA RECYCLING net 4000 lbs pct 4; TB RECYCLING net 4000 lbs pct 12; TC LANDFILL net 4000 lbs — all VALIDATED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site TQ", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 5000, tare_weight_lbs: 1000, contamination_pct: 4, ticket_date: "2026-08-05", external_ticket_ref: "TQ-TA" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { ta_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 5000, tare_weight_lbs: 1000, contamination_pct: 12, ticket_date: "2026-08-05", external_ticket_ref: "TQ-TB" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { tb_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "LANDFILL", gross_weight_lbs: 5000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "TQ-TC" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { tc_id: $.data.id }
            - call: "POST /tickets/${ta_id}/validate"
              payload: {}
              as: DataSteward
            - call: "POST /tickets/${tb_id}/validate"
              payload: {}
              as: DataSteward
            - call: "POST /tickets/${tc_id}/validate"
              payload: {}
              as: DataSteward
          trigger:
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
          assert:
            - "ScorecardPeriod.${period_id}.rebate_estimate_cents == 26000  (20000 + 6000 + 0)"
            - "TA contributes 20000 (pct 4 -> factor 1.0, no penalty)"
            - "TB contributes 6000 (pct 12 -> factor 0.5 and 4000c penalty)"
            - "TC contributes 0 (LANDFILL route gated out)"

      - name: cost_avoidance_per_ticket_rounding
        grounds:
          - calculations.cost_avoidance
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each 1-lb diverted ticket
          avoids round_half_up(0.0005t * 5500c) = 3c; summing three tickets gives
          9c. The alternative (sum tons first, round once) yields
          round_half_up(8.25) = 8c, so the two orders observably differ and the
          scaffold pins per-ticket-then-sum.
        test_recipe:
          setup:
            - "Clock 2026-08-10; site (tip fee 5500c/ton); vendor; contract ACTIVE; period OPEN"
            - "Three RECYCLING tickets of net 1 lb each, all VALIDATED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site CA", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2, tare_weight_lbs: 1, ticket_date: "2026-08-05", external_ticket_ref: "CA-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2, tare_weight_lbs: 1, ticket_date: "2026-08-05", external_ticket_ref: "CA-T2" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2, tare_weight_lbs: 1, ticket_date: "2026-08-05", external_ticket_ref: "CA-T3" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /tickets/${c1_id}/validate"
              payload: {}
              as: DataSteward
            - call: "POST /tickets/${c2_id}/validate"
              payload: {}
              as: DataSteward
            - call: "POST /tickets/${c3_id}/validate"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /scorecard_periods/${period_id}/close"
              payload: {}
              as: CertificationOfficer
          assert:
            - "ScorecardPeriod.${period_id}.cost_avoided_cents == 9  (3c per ticket x 3, per-ticket rounding)"
            - "cost_avoided_cents != 8  (sum-then-round would give round_half_up(8.25)=8)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_reject_resubmit_cycle
        grounds:
          - state_machines.WeightTicket.PENDING_to_REJECTED
          - state_machines.WeightTicket.REJECTED_to_PENDING
          - state_machines.WeightTicket.PENDING_to_VALIDATED
        distinguishing_aspect: |
          WeightTicket carries a revision loop (PENDING -> REJECTED -> PENDING ->
          VALIDATED): a rejected ticket can be corrected by its vendor and
          re-enters the provisional set on each pass — a cycle, not a pipeline.
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE; period OPEN; T1 RECYCLING net 2000 lbs PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site CY", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 3000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "CY-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /tickets/${t1_id}/reject"
              payload: { reason: "illegible scale ticket" }
              as: DataSteward
              captures: { st_rejected: $.data.validation_status }
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
              captures: { prov_after_reject: $.data.total_waste_lbs_provisional }
            - call: "POST /tickets/${t1_id}/resubmit"
              payload: { gross_weight_lbs: 3000, tare_weight_lbs: 1000 }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { st_pending: $.data.validation_status }
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
              captures: { st_validated: $.data.validation_status }
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
              captures: { cert_after_validate: $.data.diversion_rate_certified_pct }
          assert:
            - "st_rejected == REJECTED"
            - "prov_after_reject == 0  (rejected ticket leaves the provisional set)"
            - "st_pending == PENDING  (cycle back, not a new ticket)"
            - "st_validated == VALIDATED"
            - "cert_after_validate == 100.00"

      - name: contamination_training_reopen_cycle
        grounds:
          - state_machines.ContaminationEvent.TRAINING_COMPLETED_to_OPEN
          - state_machines.ContaminationEvent.TRAINING_COMPLETED_to_VERIFIED_CLOSED
        distinguishing_aspect: |
          ContaminationEvent carries a corrective-training loop (OPEN ->
          TRAINING_ASSIGNED -> TRAINING_COMPLETED -> OPEN on failed verification,
          -> VERIFIED_CLOSED on pass) on a different entity than WeightTicket.
        test_recipe:
          setup:
            - "Site; one MAJOR contamination event (pct 6) in OPEN"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site CT", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /contamination_events"
              payload: { site_id: "${site_id}", event_date: "2026-08-05", material_stream: "MIXED_RECYCLABLES", contamination_pct: 6 }
              as: WasteAuditor
              captures: { ev_id: $.data.id, sev: $.data.severity }
          trigger:
            - call: "POST /contamination_events/${ev_id}/assign_training"
              payload: { trainee_name: "Dock Crew Lead", training_due_date: "2026-08-20" }
              as: WasteAuditor
              captures: { s1: $.data.status }
            - call: "POST /contamination_events/${ev_id}/complete_training"
              payload: {}
              as: WasteAuditor
              captures: { s2: $.data.status }
            - call: "POST /contamination_events/${ev_id}/verify"
              payload: { passed: false }
              as: WasteAuditor
              captures: { s3: $.data.status, trainee_after_fail: $.data.trainee_name }
            - call: "POST /contamination_events/${ev_id}/assign_training"
              payload: { trainee_name: "Dock Crew Lead", training_due_date: "2026-08-27" }
              as: WasteAuditor
            - call: "POST /contamination_events/${ev_id}/complete_training"
              payload: {}
              as: WasteAuditor
            - call: "POST /contamination_events/${ev_id}/verify"
              payload: { passed: true }
              as: WasteAuditor
              captures: { s4: $.data.status }
          assert:
            - "sev == MAJOR  (5 <= 6 < 10)"
            - "s1 == TRAINING_ASSIGNED"
            - "s2 == TRAINING_COMPLETED"
            - "s3 == OPEN  (failed verification loops back)"
            - "trainee_after_fail == null  (training fields cleared on reopen)"
            - "s4 == VERIFIED_CLOSED  (second pass terminates)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: vendor_suspend_transitive_cascade
        grounds:
          - state_machines.Vendor.ACTIVE_to_SUSPENDED
          - state_machines.VendorContract.ACTIVE_to_SUSPENDED
          - state_machines.WeightTicket.PENDING_to_REJECTED
          - calculations.diversion_rate
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /vendors/{id}/set_status: vendor SUSPENDED
          mutates contract (-> SUSPENDED); that contract mutation itself rejects
          its PENDING tickets; each ticket rejection then recomputes the period's
          provisional totals. Each link is caused by the previous link, not by the
          original call, and the trigger differs from the contamination-event cascade.
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE; period OPEN"
            - "T1 RECYCLING net 1000 PENDING; T2 RECYCLING net 2000 VALIDATED; T3 LANDFILL net 1000 VALIDATED"
