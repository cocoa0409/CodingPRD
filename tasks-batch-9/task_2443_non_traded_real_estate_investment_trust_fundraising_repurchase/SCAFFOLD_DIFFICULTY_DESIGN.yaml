              as: SponsorOperator
              captures: { decl_id: $.data.id }
          assert:
            - "DistributionDeclaration.${decl_id}.total_declared_cents == 150000"
            - "DistributionDeclaration.${decl_id}.coverage_ratio_gaap_bps == 6000"
            - "DistributionDeclaration.${decl_id}.coverage_ratio_cash_bps == 9000"
