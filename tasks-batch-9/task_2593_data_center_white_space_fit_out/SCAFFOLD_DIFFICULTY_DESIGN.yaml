  - rule_id: non_linear_state_machine
    instances:

      - name: mop_revision_cycle_returns_to_under_review
        grounds:
          - state_machines.MethodOfProcedure.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.MethodOfProcedure.REVISION_REQUESTED_to_UNDER_REVIEW
          - calculations.mop_approval_requirement
          - entities.MethodOfProcedure.fields.revision_count
          - validations[priority=36]
        distinguishing_aspect: |
          UNDER_REVIEW is re-entered by a cycle (UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW), not by
          a forward step, and the cycle is bounded: /revise succeeds at revision_count 0 and 1 and is
          rejected with ERR_MOP_REVISION_LIMIT_REACHED at revision_count 2, so the identical trigger from
          the identical from-state has two different outcomes depending on how many times the loop already
          ran. Each re-entry also closes the approval round, resetting approval_count to 0.
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-01T00:00:00Z."
            - "Hall HF1 is in PLANNING and holds PDU-A1 with busway BW-A1 (the MOP target)."
            - "MOP-1 (risk_class LOW, target_resource_type BUSWAY, authored by u-elec-1) has been submitted, so required_approval_count == 1."
            - "The MOP has already completed two full revision cycles: REQUEST_REVISION -> revise -> REQUEST_REVISION -> revise -> REQUEST_REVISION, leaving revision_count == 2 and status == REVISION_REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ChangeManager
            - call: "POST /halls"
              payload: { name: "Data Hall F", code: "HF1", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 10 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /mops"
              payload: { hall_id: "${hall_id}", target_resource_type: "BUSWAY", target_resource_id: "${bw_a_id}", title: "Re-torque BW-A1 tap-off boxes", risk_class: "LOW", backout_plan: "Re-energize BW-A1 and restore side-A feeds.", window_start: "2026-08-05T02:00:00Z", window_end: "2026-08-05T04:00:00Z" }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              captures: { mop1_id: $.data.id }
            - call: "POST /mops/${mop1_id}/submit"
              payload: {}
              as: ElectricalContractor
              as_user_id: "u-elec-1"
            - call: "POST /mops/${mop1_id}/approvals"
              payload: { decision: "REQUEST_REVISION", comment: "Add isolation boundary diagram." }
              as: ChangeManager
              as_user_id: "u-cm-1"
            - call: "POST /mops/${mop1_id}/revise"
              payload: { backout_plan: "Re-energize BW-A1, restore side-A feeds, verify phase rotation." }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
            - call: "POST /mops/${mop1_id}/approvals"
              payload: { decision: "REQUEST_REVISION", comment: "Window overlaps tenant freeze." }
              as: OperationsManager
              as_user_id: "u-om-1"
            - call: "POST /mops/${mop1_id}/revise"
              payload: { window_start: "2026-08-06T02:00:00Z", window_end: "2026-08-06T04:00:00Z" }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
            - call: "POST /mops/${mop1_id}/approvals"
              payload: { decision: "REQUEST_REVISION", comment: "Backout plan still missing witness step." }
              as: ChangeManager
              as_user_id: "u-cm-1"
          trigger:
            - call: "POST /mops/${mop1_id}/revise"
              payload: { backout_plan: "Re-energize, restore feeds, witness phase rotation with u-wa-1." }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
          assert:
            - "the trigger returns 409 with error.code == ERR_MOP_REVISION_LIMIT_REACHED"
            - "MethodOfProcedure.${mop1_id}.status == REVISION_REQUESTED (the third loop iteration is refused, the MOP does not re-enter UNDER_REVIEW)"
            - "MethodOfProcedure.${mop1_id}.revision_count == 2"
            - "MethodOfProcedure.${mop1_id}.approval_count == 0 and MethodOfProcedure.${mop1_id}.required_approval_count == 1"
            - "MethodOfProcedure.${mop1_id}.window_start == 2026-08-06T02:00:00Z (the rejected revise wrote nothing)"
            - "GET /mops/${mop1_id}/approvals returns exactly 3 MopApproval rows, all with decision == REQUEST_REVISION and sequence 1, 2, 3 in created_at order"

      - name: commissioning_package_parallel_script_and_witness_dimensions
        grounds:
          - state_machines.CommissioningPackage.script_status_SCRIPT_APPROVED_to_EXECUTED
          - state_machines.CommissioningPackage.witness_status_PENDING_to_REJECTED
          - state_machines.CommissioningPackage.witness_status_PENDING_to_WITNESSED
          - calculations.package_state_projection
          - entities.CommissioningPackage.fields.package_state
        distinguishing_aspect: |
          script_status and witness_status are two independent dimensions and package_state is never
          written directly — a witness REJECTED does not move the package forward but instead rolls the
          script dimension backwards EXECUTED -> SCRIPT_APPROVED, and the following re-execution resets the
          witness dimension REJECTED -> PENDING. The same package therefore passes through EXECUTED twice
          with two different witness values, so package_state (DRAFT / IN_EXECUTION / FAILED / CERTIFIED)
          is a projection of the pair rather than a position on a single path.
        test_recipe:
          setup:
            - "Hall HG1 has reached COMMISSIONING through the full fit-out chain: PDU-A1 (derate 0.94) / PDU-B1 (derate 1.00), busways BW-A1 and BW-B1 ENERGIZED, containment zone CA-1 PASS at 5.00 %, cooling unit CU-1 IN_SERVICE (120.00 kW / 22000 cfm / dT 18.0 F), rack R-1-1 POWERED on two 7.50 kW feeds."
            - "thermal_posture == NOMINAL (cooling_capacity_kw 119.08 against thermal_load_kw 12.75)."
            - "Commissioning package PKG-L1 (level L1, target_load_kw 10.00) has script_status SCRIPT_APPROVED and witness_status PENDING; it has been executed by u-ca-1 and then rejected by witness u-wa-1, which rolled script_status back to SCRIPT_APPROVED and set package_state FAILED."
            - "PKG-L1 has been executed a second time by u-ca-1, so script_status == EXECUTED and witness_status has been reset from REJECTED to PENDING."
