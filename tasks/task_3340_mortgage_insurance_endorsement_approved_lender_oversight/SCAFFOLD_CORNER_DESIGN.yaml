            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "LTV-1", base_loan_amount_cents: 30000001, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/appraisals", payload: { appraised_value_cents: 31250000, effective_date: "2026-07-01" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { ap_id: $.data.id } }
            - { call: "POST /mi/appraisals/${ap_id}/decide", payload: { decision: ACCEPT }, as: FhaReviewer, as_user_id: rev-1 }
